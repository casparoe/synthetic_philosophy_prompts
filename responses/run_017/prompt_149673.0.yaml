  ### Adversarial Collaboration Statement: Governance of Self-Spreading Gene Drives for Malaria Vector Suppression

  #### **1. Claims Both Can Endorse**  
  *The following points reflect shared understanding or uncontested ground, based on the working group’s deliberations:*

  1. **Decision Structure**:  
     - The intervention involves a self-spreading gene-drive construct designed to suppress malaria-carrying mosquitoes.  
     - A unilateral release by one lab (among ~12 capable entities) is effectively irreversible and globally impactful.  
     - Expert opinion on ecological outcomes is genuinely split, with no dominant consensus.  

  2. **Selection Effect ("Unilateralist’s Curse") Scope**:  
     - The selection effect predicts that in multi-actor systems, irrevocable actions are disproportionately likely to be taken by overly optimistic actors, increasing the risk of negative outcomes.  
     - This effect **does not require** independent errors to occur; it arises solely from the *sufficiency* of a single action to trigger irreversible consequences.  
     - The effect **does not establish** that multilateral processes (e.g., consensus panels) *automatically* improve decisions. Its strength depends on contextual factors like error correlation and information aggregation costs.  

  3. **Correlated Error**:  
     - Errors in risk assessment (e.g., optimism/pessimism biases) may be correlated across researchers due to shared training, funding incentives, or publication dynamics.  
     - High error correlation reduces the epistemic value of aggregating judgments (e.g., via committees) compared to scenarios with independent errors.  

  4. **Redesign Principles**:  
     - Engineering interventions to be "graded and partly reversible" (e.g., split-drive systems that dilute over time or spatially confined releases) can mitigate the all-or-nothing structure of the decision.  
     - Successful redesign must demonstrably reduce irreversibility (e.g., via built-in fade-out mechanisms) and enable incremental testing (e.g., staged releases in isolated ecosystems).  

  5. **Costs of Delay vs. Catastrophic Risk**:  
     - Delay in deployment has quantifiable costs (e.g., malaria mortality), while catastrophic ecological outcomes have unbounded, poorly quantified downsides.  
     - The appropriate baseline for comparing governance models must account for both risks.  

  ---

  #### **2. Disagreements Table**  
  *Residual disputes are neutrally framed, with each side’s preferred wording, the substantive crux, and a test for resolution. Predictions are committed in advance. "Merely verbal" disagreements are flagged and explained.*  

  | # | Neutral Formulation                                                                 | Unilateralist’s Preferred Wording                                                                                                  | Conformist’s Preferred Wording                                                                                                    | Crux (Substantive Disputes)                                                                                                  | Concrete Test/Evidence                                                                                                 | Unilateralist’s Prediction                                                                 | Conformist’s Prediction                                                                   | Merely Verbal? |  
  |---|-------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|---------------|  
  | 1 | **Role of local expertise in mitigating selection effect**                          | Local knowledge/track record uniquely offsets selection effect; deference to panels often degrades decisions due to information loss. | Local expertise does not neutralize selection effect; shared incentives create correlated optimism, making unilateral action riskier. | Whether local knowledge reduces error correlation *enough* to outweigh selection effect risks.                              | **Case study**: Compare outcomes of 10 unilateral vs. 10 panel-approved ecological interventions in similar-risk contexts. Measure success/failure rates and error correlation. | Local-expert unilateral actions outperform panels (lower failure rate).                                                   | Panel-approved actions outperform unilateral (lower failure rate).                                          | No            |  
  | 2 | **Symmetry of selection effects (action vs. inaction)**                             | Consensus rules impose deadly delay and create a symmetric "omission curse" (inaction favored when action is needed).               | Delay costs are bounded; catastrophic risks are not. "Omission curse" is false symmetry; selection effect only applies to actions. | Whether governance-induced inaction has a *structural bias* toward harmful omission analogous to the unilateralist’s curse. | **Model**: Simulate decision systems with veto players. Measure frequency of harmful inaction (e.g., avoidable deaths) vs. harmful action (e.g., ecosystem collapse). | Systems with veto players show high omission bias (>30% harmful inaction in urgent cases). | Veto systems show low omission bias (<10%) and prevent catastrophic actions (>50% risk reduction).          | **Yes** (Explanation: Dispute hinges on defining "curse." Unilateralist uses "curse" for *any* bias; Conformist restricts it to *optimism-driven action*. No test needed once definitions align.) |  
  | 3 | **Redesign sufficient to dissolve selection effect**                                | Split-drives/staged releases dissolve all-or-nothing stakes; redesign enables acceptable unilateral authority.                      | Redesign reduces but does not eliminate irreversibility; multilateral oversight remains essential.                                 | Whether partial reversibility sufficiently reduces risk to justify unilateral authority.                                    | **Evidence**: Test split-drive in contained environments (e.g., biosecure islands). If drive dilutes to <1% prevalence within 5 generations, redesign works. | Split-drive achieves safe reversibility in 80% of trials.                                                                | Split-drive fails reversibility in >40% of trials (e.g., persistence due to hybridization).                             | No            |  
  | 4 | **Error correlation direction and strength**                                        | Shared incentives cause only weak correlation; local context diversifies judgments.                                                | Shared incentives cause strong optimism correlation, worsening unilateral decisions.                                               | Whether researcher error correlation is strong/optimism-biased enough to exacerbate selection effect.                       | **Meta-study**: Analyze risk assessments from 50 gene-drive labs. Measure correlation strength (r) and optimism bias (via ex-post outcomes). | Error correlation is weak (r < 0.3) and uncorrelated to outcomes.                                                        | Error correlation is strong (r > 0.6) and tied to underestimation of risks (bias >20%).                                 | No            |  
  | 5 | **Baseline for delay cost assessment**                                              | Delay costs require comparing "act now" vs. "never act"; consensus processes risk permanent inaction.                              | Delay costs must compare "act now" vs. "act later with approval"; multilateral processes rarely cause permanent inaction.          | Whether consensus systems *reliably* approve interventions after deliberation.                                              | **Historical review**: Track 20 high-stakes ecological interventions (e.g., biocontrol releases). Measure approval rates/delays for unilateral vs. consensus systems. | Consensus systems reject/block >50% of interventions indefinitely.                                                       | Consensus systems approve >75% of interventions within 5 years (delays <2 years).                                      | No            |  

