answer: |-
  ## Sestina: The Ratchet

  We trace the bright **progress** of thought to **now**,  
  Through lenses ground by those who came before.  
  This **forward** march, they claim, shows how  
  The sturdy **chain** of cause pulls evermore,  
  Each link forged clean by clear-eyed **reason**.  
  What victors prize, the vanquished **forget**.

  But hindsight's silt makes monuments **forget**  
  Their roots in mud. We judge the **progress**  
  Made, declare with cold **reason**  
  Their flawed designs improved by **now**.  
  We see the heavy, dragging **chain**  
  They couldn't break. We see the **forward**

  Path *they* missed. We strain **forward**,  
  Condemning what their blindness made **forget**:  
  The weight of circumstance, that **chain**  
  Of context binding them. Our **progress**  
  Lies precisely here, in **now**,  
  Where we dissect with sharper **reason**.

  They thought their **reason** pure, aimed **forward**,  
  Blind to the future's **now**. They **forget**  
  How their own time constrained the **progress**  
  They proclaimed. We break that **chain**!

  Or so we dream. This shattered **chain**  
  We wield like proof of our **reason**,  
  A trophy hauled **forward**  
  To mark the ground we've gained. **Forget**  
  The old triumphal **progress** – *this* is **now**!

  True freedom lives in **now**? This **chain**  
  Of critique, our tool, our **reason**,  
  Feeds the very myth: **forward**! **Progress**!  
  Each 'break' clicks the ratchet. We **forget**...

  The envoi binds the words we strain **forward**:  
  **Progress**, **reason**, **chain** – the gears of **now**.  
  What we debunk, we must **forget**, or own the **chain**.

  ---

  ## What I was going for

  **End Words & Why:** I chose **progress**, **now**, **forward**, **chain**, **reason**, **forget**.
  *   **Progress** is the essential Whig term, synonymous with their narrative arc. Critics *must* engage with it, even to dismantle it.
  *   **Now** anchors the present-centric view inherent to Whig thinking ("leading to *us*") and remains the critic's unavoidable vantage point.
  *   **Forward** captures the Whig sense of inevitable direction and the critic's potential hope for better understanding (moving "forward" from error). Its directionality is key.
  *   **Chain** serves dual purposes: for Whigs, it's the linked, inevitable sequence of cause/effect leading to progress; for critics, it becomes the constraining context, the burden of past thinking, or the mechanism of the ratchet itself.
  *   **Reason** is the Whig tool for discerning progress and the critic's weapon for debunking. Both camps claim its mantle.
  *   **Forget** is crucial: Whigs "forget" context, losers, contingency; critics "forget" that their own critique is temporal and will be superseded, absorbed into the next "progress" narrative. It embodies the ratchet's erasure.

  **The Form Doing the Work:**
  A paragraph argues *about* the ratchet; the sestina *enacts* it. Here's how:
  1.  **Meaning Shift through Rotation:** The forced rotation of end words into new grammatical/semantic roles mimics the ratchet absorbing critique. "Chain" starts as inevitable linkage (Stanza 1), becomes a burden (Stanza 2), then a tool of critique (Stanza 5), and finally the inescapable mechanism (Envoi). "Forget" shifts from the past's blindness (Stanza 1) to the critic's necessary dismissal of outdated views (Stanza 4) to the inevitable fate of the critique itself (Stanza 6 & Envoi). Each recurrence subtly changes the word's connotation, showing how the *same vocabulary* serves both narrative and counter-narrative.
  2.  **Inevitable Return:** The relentless return of the six words, however their meaning warps, embodies the core problem: these concepts *cannot be escaped*, even in critique. You *must* use them, just as the ratchet forces the critique back into the narrative structure.
  3.  **The Envoi as Ratchet "Catch":** The brutal compression of all six words into three lines is the ratchet snapping shut. "Progress, reason, chain – the gears of now" explicitly links the Whig vocabulary to the mechanism trapping the critic. The final line, "What we debunk, we must forget, or own the chain," forces the collision: the act of debunking ("forget") *is* participation in the mechanism ("chain"). It doesn't resolve into triumphalism or nihilism; it presents the trap. The critic is caught using "progress," "forward," and "reason" even while denying their Whig meaning, demonstrating the vocabulary's survival and the ratchet's grip. The form itself makes the abstract "ratchet" tangible through repetition and constraint.
