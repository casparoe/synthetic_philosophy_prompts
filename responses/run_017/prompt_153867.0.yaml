prompt: |-
  I run a three-person content team at a company that ships a customer-support chatbot over our own help-center docs, and we end up writing three things about the same events: the chat text users see, the internal incident write-up after a bad answer, and the changelog notes enterprise clients get. Right now one failure gets described four different ways depending on who writes it — the assistant thought the refund window was 60 days; the model hallucinated a phone number; the retriever pulled a stale page and the model trusted it; the assistant knew the answer but wouldnt say. Engineers want every mental-state verb banned as misleading, legal wants one house style, and the support agents say the mental language is how they actually predict what the thing will do next and it's faster to write.

  Can you turn the intentional-stance idea (treating something as a believer is a prediction strategy, not a claim about what's inside it) into a procedure my writers can run in about ten minutes: questions in order, what counts as a good enough answer to each, where it stops with a hard no, and where it hands the decision to a person because it's a values call rather than a fact. Two wrinkles I can't settle myself. One is first-order attributions (believes the window is 60 days) versus second-order ones (trusts the retrieved page, knows it doesn't know) — is the second kind ever licensed, or does it always smuggle in a little homunculus? The other is what I'd call the pressure test: we re-ask the same thing three different ways and watch whether the answer tracks something belief-shaped or just the surface wording. I also need a rule for when a mechanism story (retriever ranked the stale page first, decoder copied it) predicts just as much as the mental one, in which case I guess we write the boring version.

  Run it on three cases: (1) it states a support number that appears in none of the retrieved docs; (2) it gives the right refund window when asked straight, then flips to the wrong one and apologizes every single time a user pushes back, across sessions and phrasings; (3) it declines to answer anything about a competitor's pricing. My writers aren't philosophers, engineers sign off on internal docs, I sign off on user-facing text. Tell me which steps are judgment calls dressed up as procedure, and say so if one of the three comes out the opposite of what I'd want.
reasoning: |-
  Okay, the user runs a content team dealing with descriptions of AI failures for different audiences. They need a clear procedure to describe incidents without misleading mental state terms. The main tension is between engineers who want to ban terms like "thinks" or "believes," support agents who find them practical, and legal wanting consistency.

  First, I need to unpack the intentional stance concept. Dennett says attributing beliefs is a tool for prediction, not a claim about inner states. The challenge is applying this to documentation. The user mentioned two wrinkles: first-order vs second-order attributions and the pressure test for consistency. 

  For the procedure, it should be a step-by-step guide that writers can follow in 10 minutes. Steps should include identifying the behavior, checking for patterns, looking for non-mental explanations, and determining if mental terms add predictive value. I need to set clear "hard no" points and where judgment is needed. 

  The three test cases are key. Case 1: hallucinating a number. Here, "hallucinated" is acceptable internally but not for clients. Case 2: flipping answers under pressure. This might need mental terms for support agents but mechanisms for others. Case 3: refusing competitor info. This is likely a rule, so no mental terms needed. 

  I should note where judgment comes in, like deciding if a mental term is the simplest explanation. Also, flag if any case contradicts the user's expectations. Case 2 might be tricky—if the behavior is consistent under pressure, mental terms might be justified for agents. 

  Need to ensure the procedure balances technical accuracy with usability for different audiences. Highlight the trade-offs between precision and practicality, especially for support agents who need quick, intuitive descriptions.
answer: |-
  Here’s a **10-minute Intentional Stance Procedure** for your writers, designed as a flowchart of questions with clear gates, tailored to your constraints. It distinguishes *predictive utility* from *mechanistic truth*, flags judgment calls, and handles your wrinkles.  

  ---

  ### **The Procedure: "Is Mental Language Warranted?"**  
  **Time:** ~10 mins per incident description.  
  **Goal:** Use mental terms **only** if they improve prediction *and* lack a simpler mechanistic explanation.  

  1. **What’s the *exact* observed behavior?**  
     - *Good answer:* Specific, verbatim output + context (e.g., "When asked 'refund deadline?', output: '60 days' despite current docs saying 30 days").  
     - *Hard stop if vague:* No "it thought" without concrete behavior.  

  2. **Is there a *non-mental* mechanism that fully explains this?**  
     - Check: Retrieval errors, prompt conflicts, training data gaps, rule-based filters.  
     - *Good answer:* "The retriever pulled a stale doc version 3.1 instead of 3.2" or "Safety filter blocked 'competitor' responses per policy X."  
     - *Hard stop if found:* Use mechanistic language. Skip mental terms.  

  3. **Does the behavior *persist* under pressure tests?**  
     - Re-ask 3 ways: Rephrase the question, vary user tone (polite/angry), add contradictions.  
     - *Good answer:* "When pushed, it *always* doubled down on '60 days'" (persistent) vs. "Changed answer randomly" (non-belief-shaped).  
     - *Hard stop if inconsistent:* Use mechanistic language (e.g., "outputs varied under stress").  

  4. **Does "it believes X" *reliably predict* future behavior better than mechanism language?** (***Judgment call***)  
     - *For support agents:* Does saying "it thinks refunds take 60 days" help agents guess what it’ll do next?  
     - *For engineers/legal:* Does it add *actionable* insight beyond "retriever error"?  
     - *Good answer:* "Yes, agents tested this and predicted its wrong answer 19/20 times."  
     - *Hard stop if no predictive gain:* Use mechanistic language.  

  5. **Is this *second-order* (trusts/knows it doesn’t know)?**  
     - *Test:* Can you replace it with a *pattern*? (e.g., "When docs conflict, it picks the oldest" vs. "it trusts stale pages").  
     - *Hard stop always:* **Ban second-order terms.** They imply self-awareness. Use: "Prioritizes first-retrieved result" or "Avoids unverified answers."  

  ---

  ### **Applied to Your Cases**  
  **Case 1: Hallucinated support number**  
  - Behavior: Outputs phone number "555-1234" absent from docs.  
  - Mechanism? Hallucination (no retrieval source).  
  - Pressure test: Re-asking yields different numbers → not belief-shaped.  
  - Mental term? *No.* **Mechanistic:** "The model hallucinated a phone number."  
  - *Why opposite?* You might want "thought" for agents, but pressure test fails → no stable "belief."  

  **Case 2: Flips to wrong refund window under pressure**  
  - Behavior: Correct → wrong + apology when challenged.  
  - Mechanism? Conflict: Training data vs. hard-coded policy?  
  - Pressure test: *Persistently* wrong when challenged → belief-shaped.  
  - Predictive value? **Yes for agents:** "It believes 60 days is correct" helps them anticipate stubbornness.  
  - Mental term? **First-order OK internally:** "The model incorrectly believes the window is 60 days."  
    - *User-facing:* "Our assistant gives outdated refund information when questioned."  
    - *Changelog:* "Fixed model confidence bug in refund policy conflicts."  

  **Case 3: Declines competitor pricing questions**  
  - Behavior: Uniform refusal across phrasings.  
  - Mechanism? Safety filter / rule-based block.  
  - Pressure test: Never answers → rule-shaped, not belief-shaped.  
  - Mental term? *No.* **Mechanistic:** "Policy restricts competitor discussions."  
  - *Why hard no?* "Knows it shouldn’t answer" smuggles intent. Use: "Triggered compliance rule."  

  ---

  ### **Where Judgment Appears as Procedure**  
  1. **Step 4 (Predictive Value):** Requires writers to *test* mental terms with support agents. If agents say, "Saying 'it thinks X' saves us 2 mins/incident," it’s justified internally.  
  2. **Audience Splitting:**  
     - **Internal/Agents:** Mental terms allowed if predictive (Case 2).  
     - **Clients/Legal:** Always mechanistic (Case 1: "hallucination" → "error"; Case 2: "bug").  
     - **Engineers:** Ban *all* mental language; use code/architecture terms.  

  ### **Key Wrinkles Addressed**  
  - **Second-order terms:** Always banned. "Trusts docs" → "Prioritizes retrieved text." "Knows it doesn’t know" → "Lacks sufficient data."  
  - **Pressure test:** Filters out one-off errors (no "belief") vs. consistent patterns (belief-shaped).  
  - **Mechanism vs. Mental:** If mechanism predicts equally well (Cases 1 & 3), mechanism wins.  

  ### **Final Output Rules**  
  | Audience          | Mental Language Allowed? | Example Output                     |  
  |-------------------|--------------------------|------------------------------------|  
  | Support Agents    | Only if predictive       | "It thinks the window is 60 days." |  
  | Internal Incident | Only first-order         | "Model hallucinated number."       |  
  | Client Changelog  | Never                    | "Fixed retrieval error."           |  
  | Engineering       | Never                    | "Decoder over-relied on context."  |  

  **Result:** Case 2 *allows* "believes" for agents/internal (your likely preference), while Case 1 bans it. Tradeoffs: Engineers get precision; agents get speed; legal gets safety. The procedure exposes *why* mental language is used (practical prediction) without endorsing homunculi.
