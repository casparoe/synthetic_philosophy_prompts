  ## The Unaccountable Anguish: A Defence of Legislative Disinterest  
  **By Edmund Vavasour, Esq.**

  Gentlemen, we labour under a common delusion: that the Law must mirror the Passions of the People. We grant the public cry a seat at the legislator’s table, mistaking volume for virtue. But let us recall our first principles. The sole end of Law is Happiness – understood as the net balance of Pleasure over Pain. Punishment is an intrinsic Evil, justified only by its power to prevent some greater Evil – the *mischief* of an act. This mischief divides cleanly: the *primary* harm, falling upon assignable individuals (injury to body, loss of property, damage to reputation); and the *derivative* harm – the alarm and insecurity spread through the community like a contagion, rendering all less safe.

  Now, consider an act occurring privately between consenting adults. By our strict enquiry, we satisfy ourselves that no primary harm befalls any assignable person. No bone is broken, no purse lightened, no name blackened by a whisper traceable to the act itself. What, then, of the derivative mischief? Here we encounter the roiling sea of popular Disgust, Revulsion, or Moral Outrage. This, we are told, *is* the derivative mischief – the widespread pain of knowing such things occur, the shudder of collective conscience. This pain, it is argued, must be weighed in the scales; if sufficiently heavy, it justifies the punitive evil of prohibition.

  **I reject this utterly.** Not because this popular pain is light, nor because the case for repeal outweighs it. **I reject its entry into the legislative ledger altogether.** To admit it is to poison the well of rational jurisprudence.

  My reason is this: Such pain, this profound Disgust, is almost invariably the bastard child of **Error**. It is built upon foundations of sand – false beliefs concerning matters of plain, ascertainable fact. The revulsion towards the private practice in question springs not from its demonstrable effects, but from phantoms: the belief that it inevitably spreads physical disease where none is found; that it dissolves the bonds of household and state, though households stand unshaken; that it constitutes a species of fraud, though all participants consent freely with open eyes. Strip away these errors – demonstrate the falsity of the feared consequences – and what remains of the Disgust? Does the revulsion persist with its original force when shorn of its justifying myths? If it dwindles, evaporates, or transforms into mere aesthetic distaste, then **it never was a legitimate legislative concern.**

  This is my **Test of Corrected Opinion**: *A pain of disapproval warrants the legislator’s attention only if it would survive the complete removal of every false belief about matters of fact held by the person who feels it.* A pain rooted solely in delusion is no fit basis for inflicting the very real pain of punishment. To prohibit an act *because* of such erroneous pain is not merely unwise; it is a profound corruption. It ratifies the error! It tells the public: *Your unfounded fears are justified; the phantom menace is real.* It smothers the candle of reason that might otherwise dispel the darkness. Repeal, conversely, lets the error stand exposed to the air. The pain of Disgust, unsupported by fact, will wither as the error is corrected by experience and open discourse. The Law must not be the enforcer of superstition.

  **But I hear objections rise.**

  *First:* "What of the neighbour," you cry, "whose revulsion rests upon *no* false matter of fact? Whose horror springs purely from a sincere, settled moral conviction that the act is inherently base and vile, consequences be damned? Does *his* anguish count? If yes, my Test is void; any passionate majority can veto reform by sheer intensity of feeling. If no, then I beg the question! For 'whether the act is base' is the very point at issue!"

  My answer is firm: **It does not count.** The legislator’s duty is not to adjudicate intrinsic moral worth – a task as impossible as weighing smoke. His duty is to assess the *temporal consequences* of acts. The neighbour’s pain, divorced from any belief in harmful consequence (disease, disorder, fraud), is a brute fact of his psychology, but it is *not a mischief caused by the act itself.* It is caused by his own moral sensibility reacting to knowledge of the act. To grant this pain legislative weight is indeed to surrender to the tyranny of feeling. The question of "baseness" is irrelevant to the legislator tasked solely with preventing assignable harm and its reasonable derivatives. Your pain at my private act, based solely on your non-factual moral judgment, is *your* misfortune, not a mischief *I* cause demanding legal remedy. The Law exists to bind actions, not to harmonize souls or validate every private moral shudder.

  *Second:* "What if the distress," comes another voice, "is triggered not by the act *per se*, but by its *visibility*? Could not the 'mischief' of this neighbourly pain be averted by demanding concealment rather than outright prohibition? Would not your principle embrace this?"

  **I embrace it wholeheartedly.** If the sole identifiable "harm" arising from an act is the psychological pain experienced by others *merely from knowing of it*, and crucially, *only* because of their own erroneous beliefs or unresolvable moral sensibilities (which we have excluded from the ledger), then the solution is plain: **Concealment, not Prohibition.** The principle is clear: The Law intervenes against acts causing primary or legitimate derivative harm. Where the only arguable harm is this unaccountable anguish, arising from conditions *outside* the act itself, the Law’s demand is for privacy, not penalty. It is a lesser imposition on liberty, targeting the visibility that triggers the distress, not the act causing no harm in itself. The neighbour’s peace is preserved without crushing the liberty of the actors. This is not evasion; it is precise calibration.

  **I confess one point gravely.** My own fervent indignation against the existing law – my pain at the suffering inflicted upon harmless individuals – must submit to this same Test of Corrected Opinion. Is *my* outrage built upon error? Do I falsely believe the victims more numerous than they are, or their suffering greater than it is? Do I ignore genuine primary harms? If my pain stems from demonstrable falsehood, it too should be discounted. Yet I stake my argument on this: The pain *I* plead arises from **assignable individuals** suffering the very real, primary evils of punishment – loss of liberty, property, reputation, even life. Their pain is tangible, inflicted by the law itself, demonstrably caused by the prohibition. It requires no moral theory to see a man whipped or ruined. This pain, unlike the neighbour’s unaccountable anguish, survives the removal of all factual error. It is the very type of primary mischief the Law exists to prevent, not the ephemeral distress we wrongly invite into our calculations.

  **Finally, to the foreshadowed objection of Moral Capital:** "A people's sense of the sacredness of its own morals," it will be said, "is a vital public good, a fund of restraint underpinning all law. To strike down laws supported by widespread revulsion, even if rooted in error, is to deplete this fund, buying a small present relief at the cost of general indiscipline."

  I answer thus: **First,** the "fund" is not depleted by aligning the Law more closely with demonstrable truth and the prevention of real harm. On the contrary, law grounded in reason, not superstition, commands a *deeper*, more durable respect. A law revealed as the enforcer of delusion breeds cynicism, not reverence. **Second,** if repeal of an error-based prohibition *does* cause transient unrest (a derivative harm), *this* may be weighed – though its likelihood and severity are surely less than claimed, and must be set against the immediate, certain evils of maintaining the unjust law. **Third,** and crucially, the Test of Corrected Opinion does not demand the sudden, violent overthrow of all popular morals. It provides the *principle* for gradual, rational reform. To repeal a law whose sole foundation is pain born of proven error is not to attack "sacred morals," but to excise a tumour of falsehood. The healthy tissue of genuinely useful moral sentiment, that which *does* restrain harmful acts, remains untouched. We do not saw off the branch we sit on; we prune the dead wood so the living tree may thrive. Let the Law concern itself with tangible harms, and leave the correction of unfounded disgust to the slow, sure progress of reason and experience. To do otherwise is to enthrone ignorance and call it virtue.
