prompt: |-
  You're a philosopher of history who also knows the empirical psychology of reasoning cold. Take this seriously and think it through properly: brainstorm a bit before you commit, and please kill at least one of your own favourite candidates out loud before you settle on an ordering. I'd rather have a defended agenda than a survey, and no reading lists or citations — I can't check them and I don't want them.

  My situation: I'm a journalist covering science and ideas, and a lot of what I actually write is post-mortem stuff — why the pandemic response went the way it did, why a startup imploded, why a coup succeeded, why everyone's forecast about X was wrong. The thing I keep tripping over is that once the outcome is known, every account of why it happened reads smoother than the run-up ever felt in real time. Psychologists call it hindsight bias, plus there's that "narrative fallacy" idea floating around, but the version I care about is the one that shows up in finished history and finished journalism, not in lab subjects guessing at trivia answers.

  I've got about a year of funded time and a commissioning budget for roughly eight long-form pieces, and I want to spend it on the questions where the conceptual confusion is actually costing people something — writers who get it wrong, readers who get sold a too-tidy story, maybe editors and forecasters too. So: which open questions here matter most, and in what order?

  For each one I want the reasoning, not just the placement: what makes it upstream of the other questions, how tractable it is for someone doing armchair analysis plus close reading of existing accounts (I have no lab, no data set, and no IRB), how neglected it is — some of this gets written about endlessly and I'd be adding nothing — and what specific finding or argument over the next year or two would move it up or down the list.

  Here are four things I've half-invented myself, because I want you to chew on these rather than just serve me the standard material:

  - Archive capture: the surviving record is partly an effect of what happened — institutions that lost stop keeping files, the losers' memoirs don't get written, the minutes that would have embarrassed the winner get destroyed. So the retrospective explainer has evidence that was never available to anyone making the decision, which means hindsight bias isn't only a cognitive glitch, it has an evidential root that no amount of self-awareness fixes.
  - The retrospective unit problem: we individuate events partly by what later became significant, so "the causes of the war" is an object that only exists because the war happened, and the explanation inherits its own conclusion in the choice of what it's an explanation of.
  - Counterfactual compression: the set of alternatives a writer reports as having been live shrinks with distance from the event, and it shrinks toward the alternatives that resemble what actually occurred.
  - Pre-registered history: as an actual institutional fix, you commission the causal account before the outcome is known — the analyst writes the explanation of the election or the outbreak with the outcome redacted, and you file it under embargo. Is that a real test of anything, or is it a gimmick that would just produce confident guesses?

  Tell me whether those four are one question or three or four, which one is load-bearing, whether any of them is just hindsight bias wearing a hat, and what you'd add or drop. Also tell me which questions on your list are actually mine to work on as a journalist rather than a philosopher's, and which are fake or merely verbal and should get cut. And please don't just say "it depends what you mean by explanation" — pick the sense you're working with and say why it's the right one for my purposes.

  Lead with your bottom line in the first sentence, then give me the reasoning and the ranked agenda. No preamble, and don't restate my question back to me.
reasoning: |-
  Hmm, the user is a journalist covering science and ideas, focusing on post-mortem analysis of events like pandemic responses, startup failures, and coups. They've noticed that historical explanations always seem smoother in hindsight than the chaotic reality of decision-making at the time. They're familiar with concepts like hindsight bias and narrative fallacy but are frustrated with how these manifest in finished historical accounts and journalism.

  They have a year and budget for eight long-form pieces and want to tackle the most important conceptual problems that actually cause real-world harm - misleading writers, misinformed readers, and poor decisions by editors/forecasters. They've proposed four concepts: archive capture, retrospective unit problem, counterfactual compression, and pre-registered history. They want me to evaluate these, identify which are most crucial, and develop a prioritized research agenda.

  I need to understand their core problem: why do post-mortem accounts feel artificially coherent? Hindsight bias is part of it (knowing the outcome distorts memory of past uncertainty), but there are deeper structural issues at play. The user's proposed concepts touch on this: archive capture deals with evidence distortion, retrospective unit problem concerns how we define events based on outcomes, counterfactual compression relates to how we simplify alternatives, and pre-registered history is a potential solution.

  Archive capture seems particularly important because it creates an evidential basis for hindsight bias - the historical record itself is skewed toward winners, making alternative paths seem less plausible than they actually were during the event. This affects all retrospective analysis.

  The retrospective unit problem is fundamental to how we conceptualize history - we define events by their outcomes, which inherently biases our explanations. This is upstream from the other issues because it shapes the very framework of analysis.

  Counterfactual compression is also significant but may be derivative of the first two - as time passes, we forget the true complexity of past uncertainties.

  Pre-registered history is an interesting experiment but likely impractical for journalism. It might reveal how outcomes affect explanations, but wouldn't solve the deeper structural problems.

  I should prioritize the questions that:
  - Have real-world consequences (misleading decision-makers)
  - Are tractable for a journalist (archival research, interviewing historians)
  - Are under-discussed (not just rehashing hindsight bias)
  - Can be advanced by current developments

  The user's most valuable contribution would be exposing how institutional practices (archiving, journalism routines) bake in these distortions. Archive capture and retrospective unit problem are the most fundamental and neglected. Counterfactual compression is important but flows from the first two. Pre-registered history is more of a gimmick.

  For the research agenda, I'll recommend starting with archive capture as it's concrete and has direct impact on reporting. Then the retrospective unit problem as it's more conceptual but foundational. Counterfactual compression comes next as it's psychologically interesting but more recognized. Pre-registered history should be tested but not prioritized.

  I'll also suggest adding questions about how these distortions affect forecasting and decision-making in real time, as this bridges to practical consequences. The core insight is that narrative coherence isn't just a cognitive error - it's structurally embedded in how history is recorded and analyzed, with real costs for learning from the past.
answer: |-
  **Bottom line:** Prioritize "archive capture" and "retrospective unit problem" as your core load-bearing concepts, drop "pre-registered history" as a gimmick, reframe "counterfactual compression" as a consequence, and add "institutionalized learning failures" to target concrete costs. Your ranked agenda tackles how evidence and event-definition warp explanation *before* cognitive bias kicks in.

  **Reasoning & Agenda Construction:**
  1.  **Killing a Candidate:** "Pre-registered history" is the gimmick. Why? It tests *an analyst's susceptibility to known-outcome bias* on a *single, pre-defined event*. It doesn't solve "archive capture" (the evidence base is still post-hoc), ignores "retrospective unit problem" (the event unit is fixed beforehand, unrealistically), and assumes "counterfactual compression" wouldn't occur in the pre-registered analysis (it likely would, based on prior beliefs). It might produce slightly less polished narratives, but the fundamental structural distortions in evidence and event framing remain. It's a lab trick, not a history/journalism fix. **Drop it.**

  2.  **Your Four Concepts Synthesized:**
      *   **Archive Capture & Retrospective Unit Problem are Foundational & Distinct:** These aren't just hindsight bias in hats. They are *structural preconditions* shaping the evidence base ("archive capture") and the very *object of explanation* ("retrospective unit problem") *before* anyone tries to reason causally. Hindsight bias operates *on top* of this skewed foundation. "Archive capture" ensures the record *overwhelmingly supports the winner's path/justification*. "Retrospective unit problem" means the 'event' being explained is *defined by its outcome*, baking teleology into the question. These are the evidential and ontological roots of retrospective smoothness.
      *   **Counterfactual Compression is a Consequence:** This is largely a *symptom* of the first two, amplified by hindsight bias. With a winner-skewed archive and an event defined by its outcome, the plausible alternatives naturally shrink *in the historical record and subsequent analysis* towards paths resembling the actual outcome. The messy, truly divergent alternatives fade because the evidence for them is lost/discounted ("archive capture") and they seem less relevant to explaining the defined outcome ("retrospective unit problem").

  3.  **What's Load-Bearing & Why:** "Archive Capture" and "Retrospective Unit Problem" are the load-bearing walls. They create the conditions where hindsight bias thrives and counterfactual compression is inevitable. They are:
      *   **Upstream:** They distort the input (evidence & event definition) that any explanation, even a rigorously self-aware one, must work with.
      *   **Costly:** They lead directly to "too-tidy stories" that misattribute causes (focusing only on winner-accessible factors), overstate inevitability, and systematically erase the contingency and uncertainty experienced by actors. This misinforms readers, misguides future decision-makers who learn the wrong lessons, and lets failing institutions off the hook by making their failure seem predestined.
      *   **Tractable for You:** Investigate via close reading: Compare internal pre-event documents/memos (where available) vs. post-hoc official histories/reports (demonstrating "archive capture"). Analyze how journalists/historians *define* the event *after* the fact vs. how it was discussed in real-time fragments ("retrospective unit problem"). Interview archivists about record-keeping practices post-failure.
      *   **Neglected:** Hindsight bias gets the ink. The *structural evidential bias* ("archive capture") and the *metaphysical sleight-of-hand in event definition* ("retrospective unit problem") are discussed in specialist history/philosophy circles but rarely tackled head-on in science/ideas journalism aimed at a broad audience covering contemporary events.
      *   **Moves Up/Down:** Moves **UP** if investigations reveal specific, high-stakes decisions (e.g., pandemic policy, military strategy) where critical loser-perspective records were actively destroyed or neglected. Moves **DOWN** if evidence shows robust institutional practices mitigating this (rare!).

  4.  **Essential Addition: Institutionalized Learning Failures:** How do the distortions from 1 & 2 *actively prevent organizations (governments, corporations, intelligence agencies) from learning accurately from past events?* This targets the concrete cost ("costing people something"). It's your unique angle: not just diagnosing the flaw, but showing *how it perpetuates bad decisions*. It's tractable: Analyze post-mortem reports from failed projects/events and track what lessons were officially "learned" vs. what the pre-event record suggests were the real uncertainties/mistakes. Why neglected? Institutions prefer tidy, blame-limiting narratives. What moves it? A major scandal revealing a disastrous decision based on a historically distorted "lesson."

  5.  **Fake/Verbal Questions to Avoid:** Debates solely about "determinism vs. free will" in history, or purely semantic arguments about "what is a cause?". You need the sense of "explanation" as *a practically useful account of why an event happened, intended to inform future understanding and action*. This is the sense used by policymakers, journalists, and the public – and the one distorted by your core problems, leading to real-world costs.

  **Your Ranked Agenda (8 Pieces):**

  1.  **The Winner's Archive: How History's Evidence is Rigged from the Start** (Deep dive into "Archive Capture" - mechanisms, examples from recent events (e.g., failed startups, abandoned pandemics plans), its impact on perceived inevitability).
  2.  **Defining Disaster: How Outcomes Create the Events We Explain** (Exploring "Retrospective Unit Problem" - contrast real-time confusion with post-hoc event labels (e.g., "The 2008 Financial Crisis" vs. real-time 2007), consequences for identifying causes).
  3.  **Why Organizations Can't Learn from Their Own Mistakes** (Spotlight on "Institutionalized Learning Failures" - how distorted post-mortems (built on 1 & 2) create false lessons, case study focus).
  4.  **The Shrinking Past: Why Alternatives Seem Fewer Over Time** (Reframing "Counterfactual Compression" as consequence - show its link to 1 & 2 using historical case comparisons near/far from the event).
  5.  **Hindsight's Trap: Beyond the Lab, Into the Archives** (Connecting cognitive bias to structural distortion - how 1 & 2 *enable* and amplify hindsight bias in real-world analysis).
  6.  **Journalism's Smoothing Machine: Chasing Narrative in the Ruins** (Self-reflective piece: How journalistic practices (deadlines, sourcing, narrative demands) interact with and exacerbate 1, 2, & 4).
  7.  **Forecasting's Blind Spot: When the Past Misleads the Future** (Impact on forecasters: How learning from distorted history feeds poor probabilistic thinking and surprise).
  8.  **Fighting the Tide: Can We Build Less Distorted Memory?** (Exploring *partial* mitigations: archival reforms, real-time documentation practices, scenario planning that preserves uncertainty - acknowledging the core problems remain but asking what's possible).

  **Why this order:** Starts with the foundational structural problems (1,2), links them to the key cost (3), shows the psychological consequence (4), integrates the cognitive bias (5), examines journalism's role (6), explores the forecasting impact (7), and ends with cautious hope/pragmatism (8). Each piece builds on the concepts established earlier, creating a cumulative argument about the roots and costs of historical smoothness. This leverages your access and skills as a journalist probing institutional practices and textual/archival evidence.
