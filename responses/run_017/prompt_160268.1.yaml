answer: |-
  Below is a complete, classroom-ready game design tailored to your constraints and learning objectives. It's optimized for 90 minutes, minimizes lecture, and forces engagement with your three target concepts through emergent gameplay.

  ---

  ### **Game Title:** Rule Cascade  
  *Time Allocation:* 5 min intro, 65 min gameplay, 20 min debrief (90 total)  
  *Materials:* Whiteboard (track rules), index cards (mandates + proposals), timer. Avoid projector.

  ---

  ### **Initial Ruleset (Handout - 1 Page)**  
  **Print and distribute this verbatim:**  

  > #### RULE CASCADE: STARTING RULES  
  > **I. RULE TIERS**  
  > - **Mutable (Blue):** Can be changed by majority vote.  
  > - **Entrenched (Red):** Require 2/3 vote to change.  
  > - **Inviolate (Gold):** Unchangeable. Only one exists.  
  >   
  > **II. ACTIVE RULES**  
  > *Gold: "The Clerk’s rulings may be overturned by majority vote."*  
  > *Red 1: "Proposals take effect only if passed by the required vote."*  
  > *Red 2: "A rule’s tier may be changed without altering its text."*  
  > *Blue 1: "Each player may propose one rule-change per round."*  
  > *Blue 2: "Voting requires simple majority unless specified otherwise."*  
  >   
  > **III. GAME MECHANICS**  
  > - **Clerk:** Rotates each round (alphabetical by last name). Duties:  
  >   - Interpret rules during play.  
  >   - Call/record votes.  
  >   - Update whiteboard.  
  > - **Proposals:** Must be written on index cards. Types allowed:  
  >   - Amend/repeal a rule.  
  >   - Add a new rule (starts Blue).  
  >   - *Jurisdiction Move:* Change a rule’s tier (color).  
  >   - *Janus Clause:* Specify custom voting conditions for your proposal (e.g., "Passes with 4 votes OR if majority approves").  
  >   - *Provisional Rule:* Add "PROVISIONAL" to proposal. Takes effect immediately but dissolves if not ratified by the next Clerk.  
  > - **Scoring:** Private mandates determine your score. Tokens awarded per passed proposal.  
  >   
  > **IV. ROUND STRUCTURE**  
  > 1. Clerk resolves provisional rules (upkeep).  
  > 2. Players write proposals (2 min).  
  > 3. Clerk reviews legality.  
  > 4. Vote on each proposal (1 min each).  
  > 5. Clerk updates rules. Rotate Clerk. Repeat.  

  ---

  ### **Mandate Cards (18 Unique Examples)**  
  *Format: Index card with PROTECT/RAID objectives + scoring hints.*  
  **Goal:** Create cross-cutting incentives (e.g., some want tiers raised, others lowered).  

  > **EXAMPLE MANDATES:**  
  > 1. *PROTECT:* "Rule Blue 1 must be Entrenched or Inviolate."  
  >   *RAID:* "Demote Rule Red 1 to Mutable."  
  >   *Reward:* +3 if PROTECTED; +2 if RAIDED; +1 token per passed proposal.  
  >   
  > 2. *PROTECT:* "Rule Red 2 must remain Entrenched."  
  >   *RAID:* "Repeal Rule Blue 2."  
  >   *Reward:* +4 if PROTECTED; +3 if RAIDED; +1 token per passed proposal.  
  >   
  > *(Vary targets: Some protect Inviolate, others raid it; some protect mutable rules, etc. Include 2-3 cards that incentivize creating new rules.)*  

  ---

  ### **Turn Order & Timeline**  
  - **Intro (5 min):** "We’re building a rule system. Goal: Shape rules to match your secret mandate. Pass proposals to earn tokens." *No jargon.*  
  - **Gameplay (65 min / 6 Rounds):**  
    - *Round Time:* 10 min/round (adjust if needed).  
    - **Per Round:**  
      1. **Upkeep (1 min):** New Clerk checks whiteboard. Dissolves unratified provisional rules (strikethrough).  
      2. **Proposal (2 min):** All players write proposals on cards. *Clerk may propose but can’t self-rule on legality.*  
      3. **Adjudication (3 min):** Clerk:  
         - Reads proposals.  
         - Rules "legal" or "illegal" (e.g., "Targets Inviolate? Illegal").  
         - For Janus: Explains dual voting conditions (current vs. self-set).  
      4. **Voting (3 min):** Per proposal:  
         - Clerk states voting threshold (e.g., "Majority for Blue rule").  
         - Janus: Clerk runs *both* votes (if either passes, it passes).  
         - Players vote openly. Clerk records.  
      5. **Update (1 min):** Clerk amends whiteboard:  
         - Provisional rules: Add "(PROVISIONAL)" + highlight.  
         - Janus: Note custom condition.  
         - Jurisdiction moves: Re-color rule.  
    - **Rotate Clerk** alphabetically after each round.  
  - **Final 2 min:** Players secretly write their PROTECT/RAID outcomes on mandate cards. Collect for scoring.  

  ---

  ### **Adjudication & Crisis Management**  
  - **Clerk Authority Challenges:** Use Gold rule—players vote to overturn Clerk’s ruling. *Self-referential test:* If Clerk’s authority is questioned, Gold rule still applies.  
  - **Predictable Derailments & Fixes:**  
    - *"I Win" Proposal:* Clerk rules illegal ("Not a rule-change"). If pressed: "Doesn’t modify the system. Suggest amending scoring instead."  
    - *Targeting Inviolate:* Clerk: "Illegal—Inviolate can’t be changed." *Watch for:* Jurisdiction move to *make* it mutable (legal, but requires transmuting Gold via Red 2).  
    - *Circular Logic (Janus):* Clerk runs both votes. If self-referential paradox (e.g., "Passes if this vote fails"), rule it illegal *after* vote.  
    - *Chaos from Provisional Rules:* Let it happen! Ratification failure creates "void" precedents.  
    - *Time Pressure:* Skip late-round proposals. Freeze game at 65 min.  
  - **TA Role:** Observe only. Intervene *just* to:  
    - Restart round if total deadlock.  
    - Clarify process (not content).  
    - Announce time.  

  ---

  ### **Debrief Guide (20 Min)**  
  **Link game moments to concepts (NO JARGON until end):**  

  1. **Fixed Point (5 min):**  
     - *Ask:* "Did anyone try to change the Gold rule? What happened?"  
     - *Reveal:* "The system needed one unbreakable anchor. Where you place it changes everything."  
     - *Moments:*  
       - Failed attacks on Gold.  
       - When Clerk overrides created stability/chaos.  

  2. **Jurisdiction Moves (5 min):**  
     - *Ask:* "Did anyone change a rule’s *power* without rewriting it? Why?"  
     - *Reveal:* "Moving tiers is a stealthy power play. Like amending a constitution vs. passing a law."  
     - *Moments:*  
       - A player transmuting their rule to Entrenched to block rivals.  
       - Raid/PROTECT incentives driving tier changes.  

  3. **Paradox as Exploit (5 min):**  
     - *Ask:* "Did any proposal’s success depend on itself? How did it feel?"  
     - *Reveal:* "Self-reference isn’t a puzzle—it’s a tool for strategy or sabotage."  
     - *Moments:*  
       - Janus clause passing under its own terms but failing under current rules.  
       - Provisional rule used to swing a vote, then vanishing.  

  4. **Limitation (2 min):**  
     - *Confess:* "This game assumes the fixed point *must* be a rule. Real legal systems sometimes anchor it in shared practice, not text."  

  **Finally:** Introduce terms *immutable*, *self-amendment*, *hierarchy*. Assign readings based on token leaders.  

  ---

  ### **Why This Works**  
  - **Forces Engagement:** Mandates pit players against each other. Tokens incentivize proposals.  
  - **Emergent Lessons:** Janus/provisional rules generate paradoxes organically. Jurisdiction moves reward tactical thinking.  
  - **Controlled Chaos:** Tight rounds prevent stagnation. Clerk rotation distributes power.  
  - **Lecturer Escape Hatch:** You’re a referee, not teacher. Debrief uses *their* experience as evidence.  

  **Test Run Advice:** Dry-run with 3 friends to refine timing. Have spare index cards ready!
