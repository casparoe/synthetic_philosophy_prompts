prompt: |-
  I'm a TA for an undergrad seminar on philosophy of law — 18 students, one 90-minute slot, a whiteboard, index cards, and a projector I'd rather not use. Last week we did the rule of recognition and what happens when a legal order tries to regulate its own amendment, and it went about as well as you'd expect: they treated self-reference as a cute puzzle rather than as something that happens to you. So I want to run them through a short game instead, something in the neighbourhood of Nomic, that game from the early 80s where changing the rules is itself a legal move, but compressed and rigged so the interesting stuff shows up inside 90 minutes instead of after six weeks of mailing-list play. Assume they've read nothing and have never heard the word immutable applied to a rule.

  Three things I want them to feel rather than be told. First, that a pile of amendable rules needs a fixed point somewhere, and that where that fixed point sits is itself something you'd have to legislate. Second, the difference between changing what a rule says and changing which tier of the hierarchy the rule occupies — in my notes I'm calling this a jurisdiction move: a proposal that never touches a rule's wording but reclassifies it, say, from mutable to entrenched or back. Third, that the paradoxes arrive as exploits somebody wants to pull off, not as exam questions. Two devices I've been playing with, which you should build in or replace if you think they're clumsy: a Janus clause, a form of proposal that specifies its own adoption conditions (this amendment passes if it gets a majority, or if it gets five votes, whichever is easier), so a proposal can fail under the standing procedure and pass under the procedure it would install; and provisional rules, which take effect the moment they're proposed and dissolve retroactively if they aren't ratified within a couple of rounds, so there's a window in which people act under a rule that may turn out never to have existed. For the rest, assume I'll hand out a short initial ruleset — maybe three tiers, mutable / entrenched / a single inviolate rule, plus a transmutation rule that is itself only entrenched, plus a rotating clerk whose default ruling a majority can override — and private mandate cards so everyone has something to protect and something to raid: you score for how well the final ruleset matches your mandate, not for winning votes, though you also get a small public token for each proposal of yours that passes (winner picks next week's reading, and there may be a coffe voucher in it). Nobody should hear phrases like inviolate level or self-amendment until the debrief.

  What I want from you is a thing I can actually run: the exact initial ruleset, short enough for one printed page and worded so I can just hand it over; the mandate cards; turn order and a timeline, including how much of the 90 minutes goes to play versus debrief; the adjudication mechanics, including what happens when what's disputed is the clerk's own authority; and what I do when it derails. Then a debrief that maps specific moments I should be watching for onto the ideas — especially the moment somebody tries to lock in their own favourite rule at the inviolate level, and the moment when a proposal's legality depends on the outcome that proposal would bring about — plus an honest note about which feature of the problem the game can't produce and I'll have to say out loud at the end. Last year I handed them the standard published ruleset and one guy immediately proposed that he wins, and the session was over in twelve minutes, so also tell me what will predictably go wrong and how to steer it back without me turning into the lecturer.
reasoning: |-
  We are designing a 90-minute classroom game to illustrate concepts in the philosophy of law, particularly about rule hierarchies, self-amendment, and the necessity of a fixed point in a legal system.

  Key Goals:
  1. Students should feel that a system of amendable rules needs a fixed point, and that the placement of that fixed point is itself a legislative choice.
  2. Students should experience the difference between changing a rule's content and changing its hierarchical level (a "jurisdiction move").
  3. They should see paradoxes as practical exploits rather than abstract puzzles.

  Game Mechanics Inspired by Nomic:
  - We have a starting ruleset with three tiers:
      Tier 1: Mutable Rules (can be amended by simple majority)
      Tier 2: Entrenched Rules (require a higher threshold to amend, e.g., 2/3 majority)
      Tier 3: A single Inviolate Rule (cannot be amended at all)
  - A "transmutation rule" (which is entrenched) allowing rules to be moved between tiers (without changing their wording) - this is the "jurisdiction move".
  - A rotating Clerk role (with a default ruling that a majority can override).
  - Proposals: Players can propose amendments to mutable rules, amendments to entrenched rules (which require the higher threshold), or transmutation moves (changing a rule's tier). Also, they can propose new rules (which start as mutable) or repeal rules.
  - Two special devices:
      a) Janus Clause: A proposal that specifies its own adoption conditions (e.g., "This amendment passes if it gets a majority OR if it gets 5 votes, whichever is easier"). This can lead to a situation where a proposal fails under the current rules but passes under the conditions it sets.
      b) Provisional Rules: A rule that takes effect immediately upon proposal but dissolves retroactively if not ratified within a set number of rounds (e.g., two rounds). During that window, actions taken under the rule are valid only if the rule is ratified.

  Scoring:
  - Each player has a private mandate card with two things: 
      (a) a rule they must protect (if it exists at the end, they get points; if it is at a higher tier, more points)
      (b) a rule they must raid (if it is removed or demoted, they get points; if it is in a lower tier, they get points for that too)
  - Also, a small public token (like a chip) for each proposal that passes (which can be exchanged for a coffee voucher and the winner picks next week's reading). This incentivizes proposing.

  Structure of the 90-minute session:
  - Introduction (5 minutes): Explain the game without using jargon. Hand out the initial ruleset and mandate cards. Explain the objective: to shape the rules to match your mandate and to pass proposals for tokens.
  - Rules explanation (10 minutes): Go over the initial ruleset and how to make proposals, vote, and the Clerk role. Explain the three tiers and the transmutation rule. Explain the two special devices (Janus and provisional rules) as options they can use in their proposals.
  - Gameplay (60 minutes): Divided into rounds. Each round has:
      a) Proposal phase: One player (rotating) makes a proposal (or multiple? but to keep it moving, one proposal per round? but 18 students... maybe two proposals per round? or let any player propose in a round but limit the number? We need to manage time. Let's have a fixed order of players, each round 2 players get to propose, and we have 9 rounds? But 60 minutes for 18 players? That's tight. Alternatively, we can have 6 rounds with 3 proposals each? But that might be chaotic. Let's try: Each round, 3 players are randomly selected to propose (so 6 rounds in 60 minutes -> 10 minutes per round). But random might be unfair. Alternatively, we pre-assign a speaking order and each round 3 players propose. With 18 players, we can have 6 rounds (each player proposes once? but 18/3=6 rounds). So 6 rounds, each round 3 players propose. Then voting and adjudication for each proposal. We need to keep it moving. 
      b) Voting phase: For each proposal, the Clerk reads it and then calls for a vote. The voting procedure is defined by the current rules. Initially, mutable rules require a simple majority (10 out of 18) and entrenched require 2/3 (12 out of 18). The Clerk rules on whether the proposal is valid (and if it's a transmutation, whether it targets a rule that can be moved and by what procedure). The Clerk's ruling can be overridden by a majority vote (so the Clerk isn't all-powerful).
      c) Implementation: If a proposal passes, the Clerk updates the ruleset (on the whiteboard). If it's a provisional rule, it is implemented immediately but marked as provisional with a note of when it will expire if not ratified.
      d) Ratification phase for provisional rules: At the beginning of each round, check provisional rules from two rounds ago. If they haven't been ratified by then (by a normal vote? or by the same procedure as their initial proposal? we need to define) then they are removed and any actions taken under them are considered void.

  - Debrief (15 minutes): Map the game events to the concepts.

  Initial Ruleset (to fit on one page):

  ```
  INITIAL RULESET

  I. RULE TIERS
     A. Tier 1: Mutable Rules - Can be amended or repealed by a simple majority vote.
     B. Tier 2: Entrenched Rules - Require a 2/3 majority vote to amend or repeal.
     C. Tier 3: Inviolate Rule - Cannot be amended or repealed. There is exactly one inviolate rule at all times.

  II. STARTING RULES
     A. Inviolate Rule (Tier 3): 
          "The Clerk shall be rotated every round to the next player in alphabetical order by first name."
     B. Entrenched Rules (Tier 2): 
          Rule E1: "A rule may be moved from one tier to another without changing its wording by a proposal that specifies the new tier. Such a proposal is called a transmutation. A transmutation proposal requires a vote of the same majority as required for amending the tier from which the rule is being moved, unless the proposal specifies otherwise (using a Janus Clause)."
          Rule E2: "The Clerk is responsible for interpreting the rules, calling for votes, and recording rule changes. The Clerk's ruling on any matter of procedure may be overridden by a simple majority vote of the players."
     C. Mutable Rules (Tier 1):
          Rule M1: "Each round, three players are selected to make one proposal each. The selection order is by the Clerk's list (initially, alphabetical by last name)."
          Rule M2: "Proposals may be: 
              a) Amendment: changing the wording of a mutable rule.
              b) Repeal: removing a rule (only mutable and entrenched rules can be repealed).
              c) New Rule: adding a new rule (which is initially mutable).
              d) Transmutation: moving a rule from one tier to another (as defined in E1).
              e) Provisional Rule: a new rule that takes effect immediately upon proposal but must be ratified within two rounds by the same vote required for its initial adoption. If not ratified, it is removed and any actions taken under it are void. A proposal for a provisional rule must state that it is provisional.
              f) Janus Clause: a proposal that defines the conditions for its own adoption. The Clerk will apply both the current rules and the proposed conditions and will adopt the proposal if either set of conditions is met. If the conditions conflict, the proposal fails."
          Rule M3: "Voting is by show of hands. The Clerk counts the votes and announces the result."

  III. CLERK
     - The Clerk is rotated as per the inviolate rule.
     - The Clerk's list is initially set as the players in alphabetical order by last name.

  IV. ADJUDICATION
     - Any dispute about the rules is settled by the Clerk, subject to override by a majority vote.

  V. PROVISIONAL RULES
     - A provisional rule is in effect from the moment it is passed until it either expires (if not ratified) or becomes permanent (if ratified). Ratification is done by a vote in the same manner as its initial passage, taken in the round two rounds after it was proposed. For example, a provisional rule proposed in round 1 must be ratified in round 3.

  ```

  Mandate Cards:
  - Each card has:
     Protect: [Rule ID and desired tier] - e.g., "Protect: Rule M1 should exist and be at least entrenched (Tier 2) at the end."
     Raid: [Rule ID and desired outcome] - e.g., "Raid: Rule E1 should be repealed or demoted to mutable (Tier 1)."
  - Also, each card has a unique identifier so the TA can record scores later.

  We will create 18 mandate cards. The starting rules are:
     Inviolate: 1 rule (the Clerk rotation)
     Entrenched: 2 rules (E1: transmutation, E2: Clerk's role and override)
     Mutable: 3 rules (M1: proposal order, M2: types of proposals, M3: voting)

  So the mandates can refer to these rules by their labels (e.g., "E1", "M2") and also to rules that might be added.

  We need to assign mandates such that there is conflict and incentive to change the rules.

  Example Mandate Card:

  ```
  MANDATE CARD #1

  PROTECT: Rule M1 (the rule about proposal order) must be in the ruleset at the end of the game and must be at least in Tier 2 (entrenched). If it is in Tier 2, you get 10 points; if in Tier 3, 20 points; if only in Tier 1, 5 points.

  RAID: Rule E2 (the rule about Clerk's rulings and override) must be either repealed or moved to Tier 1 (mutable). If repealed, 15 points; if moved to Tier 1, 10 points; if still in Tier 2, 0 points.

  Additionally, for each proposal of yours that passes, you get 1 token (which can be exchanged for a coffee voucher and counts toward picking next week's reading).
  ```

  We need 18 such cards. The TA can make them, ensuring that for each rule, some players want to protect it and some want to raid it.

  Turn Order and Timeline:
  - Total: 90 minutes
    - 5 min: Introduction
    - 10 min: Rules explanation
    - 60 min: Gameplay (6 rounds, each 10 minutes)
        Each round:
          - Start: Clerk checks for provisional rules that need ratification (from two rounds ago). Holds ratification vote if any.
          - Then: Clerk selects the next three proposers (by the current list, initially last name order). 
          - Each proposer makes one proposal. Clerk rules on validity (and if it's a Janus, explains the conditions). Then vote. Clerk records the result and updates the rules on the whiteboard.
          - If there is a dispute, the Clerk rules, and then there can be a vote to override the Clerk (if someone challenges).
          - End of round: Clerk rotates to the next player (as per inviolate rule).
    - 15 min: Debrief

  Adjudication Mechanics:
  - The Clerk is the initial interpreter. If a player challenges the Clerk's ruling, then the Clerk calls a vote to override. If a majority votes to override, then the challenge succeeds and the ruling is reversed.
  - Note: The Clerk might be the proposer? In that case, if there's a dispute about their own proposal, they should step aside? But the rules don't say that. Instead, we have the override mechanism. So even if the Clerk is biased, the majority can override.

  What to do when it derails?
  - If someone proposes "I win", the Clerk (or the TA) can point out that the proposal must be one of the allowed types (amendment, repeal, etc.) and must target an existing rule or create a new one. But if they try to create a new rule that says "Player X wins", then that rule is mutable and can be repealed. Also, the game doesn't end until the time is up, so even if such a rule is passed, it doesn't take effect until the end? We don't have a win condition in the rules. The scoring is done at the end by the TA. So the proposal might pass, but it doesn't immediately end the game. The TA can then say: "This rule is now in effect, but it doesn't specify when the win occurs. We'll interpret it as at the end of the game." Then at the end, the TA will score normally and ignore that rule? Or, to prevent derailment, we can say that the rule is invalid because it conflicts with the scoring system? Better: the mandate cards define the scoring, and the game rules are about the legal system. The rule "Player X wins" doesn't change the mandate scoring. So Player X doesn't actually win anything unless it matches their mandate? But that might be confusing. Alternatively, we can explicitly state in the initial rules that the game does not have a "win" condition and that the scoring is based solely on the mandate cards. We can add to Rule M2: "Proposals must be about the rules of the game and cannot directly assign victory or tokens to a player, except through the normal token award for passing proposals." So we can add that to M2.

