     "The Clerk shall be rotated every round to the next player in alphabetical order by first name. This rule cannot be amended, repealed, or moved to another tier."

  Similarly, we can state in the transmutation rule (E1) that it does not apply to the inviolate rule.

  Debrief Outline (15 minutes):
  1. Fixed Point: Ask the students: "Was there a rule that couldn't be changed? Why do you think we needed that? What if we didn't have it?" Then explain that in a legal system, there must be a fixed point (like a constitution) to avoid infinite regress.
