     The game has a clear fixed point (the inviolate rule) but in real legal systems, the fixed point (like the basic structure doctrine or the rule of recognition) might not be written down and might be based on social practices. The game cannot fully capture the dynamic and social aspect of how the rule of recognition is maintained by officials' behavior.

