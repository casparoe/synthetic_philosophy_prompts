prompt: |-
  I've been arguing about blame with friends for years, and there's one move in these arguments that I want a name for. I should be clear up front that I have no academic background — I work in freight scheduling and read this sort of thing on my own — so I'll describe it the way I've actually encountered it, and then say what would count as an answer.

  The move goes like this. Someone does something bad, and a story is offered about why they had no real alternative: they were threatened; they were dependent; they were raised so that the other option never presented itself as an option at all. The reply that ends the conversation is: none of that made you do it. You weighed things up and you acted on your own reasons. Whatever would have made you act differently never actually came into play — and if it did come into play, you could have ignored it, since people do. So the "I had no choice" story doesn't do the excusing work it's supposed to do.

  What interests me is that this reply seems decisive in some cases, partly right in others, and hollow in still others, and I can't find the variable. Four cases:

  **A.** A warehouse supervisor means to steal some stock. Without his knowledge, his employer has set things up so that if he had shown the slightest sign of not going through with it, he would have been made to go through with it. He shows no such sign, and takes the stock entirely for his own reasons. We learn about the arrangement afterwards. My reaction, and everyone else's: it changes nothing about how much he's to blame — even though, given the arrangement, there was no way he was leaving that warehouse with the stock not taken.

  **B.** A shopkeeper is told that if she doesn't hand over the week's takings, her family will be harmed. She hands them over. Most people in her position, I think, would refuse and go to the police. Here "you could have resisted — people do" seems like a real point, and it seems to reduce blame, though not to nothing.

  **C.** The same shopkeeper, except that she took the loan deliberately, from people she knew the character of, on terms she understood, for a purpose of her own. She is now in a position she chose to be in. Here the reply gets a grip it doesn't have in A — but she still acts on her own reasons at the moment of handing over the money, and arguably still can't do otherwise at that moment.

  **D.** A man grows up somewhere a certain cruelty to his younger brother is simply what one does. It never occurs to him at the time that there is another way to behave, and nobody suggests it. Twenty years on he understands that it was wrong. Here "nobody held a gun to you — you could have done otherwise" seems to me to misfire badly, and yet a residue of blame doesn't go away, which puzzles me.

  I've tried several candidate variables and none of them sort the cases. Not whether the pressure was actually exercised: that splits A off from B and C but leaves those three tangled. Not whether the person knew about it: in A he didn't and the reply works, in C she did and it works too. My best guess is that it's something about whether the person's own earlier choices are part of the story, but that doesn't seem to touch A, and it doesn't explain the residue in D.

  So: does this reply — one move, or several moves wearing the same clothes — have a name? I've tried looking into it a couple of times and kept landing on things that felt adjacent rather than on the move itself: discussions of whether anyone really chooses anything if our brains are doing the causing, and of whether addicts can stop. Both near, neither it.

  What I want is not a label. If you reach for some well-known doctrine to the effect that blame doesn't require that a person could have done otherwise, tell me which of A–D it actually settles and which it leaves alone — my sense is that it handles A cleanly and the rest not at all, but I'd rather be corrected than agreed with. Specifically: are A–D one phenomenon or more than one; which, if any, is the one that's actually been worked on and what are the others; what the load-bearing difference is between the cases where the reply lands and where it doesn't; and if there's no established term, a coinage — name, definition, and a case at each edge, one clearly inside and one clearly outside. Please don't send me to books or papers; I can't get at them, and I'm not asking who said what first.

  After the discussion, give me a single JSON object summarizing it, valid and nothing outside it, with this schema:

  - "has_established_name": "yes" | "partly" | "no"
  - "nearest_concepts": array of objects with fields "concept" (the name), "what_it_covers" (one sentence), "cases_covered" (array of "A"/"B"/"C"/"D"), "fit" ("exact" | "partial" | "poor"), "why_not_just_this" (one sentence)
  - "case_by_case": one object per case, A through D, with fields "case", "best_label", "move_succeeds" ("yes" | "partly" | "no"), "load_bearing_feature" (the single feature that decides this case), "one_sentence_reason"
  - "is_it_one_move": object with fields "answer" and "criterion_that_sorts_the_cases"
  - "proposed_term": object with fields "term", "definition", "clear_case", "borderline_case", "excluded_case"

  Keep every string value to about thirty words; the point is the sorting, not the prose.
reasoning: |-
  We are analyzing a specific move in blame arguments: the reply that dismisses excuses by asserting that the person acted on their own reasons and could have done otherwise, so the excuse fails.

  The user presents four cases (A, B, C, D) and wants to understand why the reply seems decisive in some, partly right in others, and hollow in others.

  After analysis, we find:

  - The reply is a form of "could have done otherwise" (CHDO) argument, which is central to debates about free will and moral responsibility.
  - However, the cases show that the force of the reply depends on the context of the constraint and the agent's relationship to it.

  Key distinctions:

  1. **The nature of the constraint**: Was it actually present and operative, or merely counterfactual? In A, the constraint was counterfactual (it didn't actually operate because the supervisor didn't resist). In B and C, the threat is actual and present.

  2. **The agent's awareness and prior choices**: In C, the shopkeeper chose to enter the situation, so she is responsible for being in that position. In D, the constraint is social and internalized, so the agent didn't have the capacity to see an alternative at the time.

  3. **The agent's capacity to do otherwise**: Even if an agent "could have done otherwise" in some abstract sense, if they lacked the capacity (e.g., due to upbringing in D) then the reply misfires.

  We note that philosophical discussions often distinguish:

  - **Compatibilism vs. Incompatibilism**: But this is about determinism and free will, which is too broad.

  - **Moral responsibility and alternative possibilities**: The principle that moral responsibility requires the ability to do otherwise (the Principle of Alternate Possibilities, PAP) was famously challenged by Harry Frankfurt in cases like A (Frankfurt cases). In A, the supervisor couldn't have done otherwise (because of the setup) but we still blame him because he acted on his own. So PAP is false? But note: in A, the constraint didn't actually operate. So it's a counterexample to PAP.

  - **Sourcehood**: What matters is not alternate possibilities but the source of the action. If the action comes from the agent's own will, then they are responsible even if they couldn't have done otherwise (as in A).

  However, in B and C, the threat is an actual constraint. Here, the agent is acting under duress. Duress can excuse to some extent, especially if the threat is severe and the agent's resistance is not reasonable to expect. But in C, because she chose to put herself in that position, she is more responsible.

  In D, the issue is about formative circumstances: the agent did not have the capacity to recognize the wrongness at the time. This relates to discussions of moral ignorance and upbringing.

  So the cases are not one phenomenon:

  - A is a Frankfurt-style case, which challenges the idea that responsibility requires alternate possibilities.

  - B is a case of duress (coercion), which can reduce blame.

  - C is a case of prior fault (or "assumption of risk") where the agent is responsible for being in the situation.

  - D is a case of moral ignorance due to upbringing, which might be a mitigating factor but doesn't always fully excuse.

  Now, the move (the reply) is essentially an assertion of the Principle of Alternate Possibilities (PAP) in a crude form: "You could have done otherwise, so you are responsible." But in A, we see that PAP fails because the agent couldn't have done otherwise (due to the counterfactual intervener) but we still hold him responsible. So the reply fails in A? Actually, in A the reply is made: "none of that made you do it" and we agree it doesn't excuse. But note: the reason it doesn't excuse is that the constraint didn't actually operate. So the reply is correct in A but for the wrong reason? The reply says "you could have done otherwise" but actually in A he couldn't have. So the reply is factually wrong in A? But we still hold him responsible. So the reply in A is not needed: we hold him responsible even though he couldn't have done otherwise.

  In A, the reply is: "none of that made you do it" and that is correct because the constraint didn't operate. But the part "you could have done otherwise" is false (he couldn't have) but we don't care because the action was his own. So the move in A is partly right and partly wrong? But the user says in A the reply is decisive and they agree it doesn't change blame.

  In B, the reply "you could have resisted" is a reason to assign more blame than if she couldn't, but we still reduce blame because of the threat. So the move partly succeeds.

  In C, the reply gets a grip because she chose the situation, so the duress is less excusing.

  In D, the reply "you could have done otherwise" is hollow because he couldn't have at the time (he didn't have the capacity to see the alternative).

  The load-bearing differences:

  - For A: The constraint is counterfactual and did not actually interfere. The agent acted on his own. So the excuse doesn't work because the constraint wasn't the cause.

  - For B: The constraint is actual and present, but we still think she could have resisted (it was not impossible). So the duress is partial and blame is reduced but not eliminated.

  - For C: The constraint is actual, but she voluntarily assumed the risk. So the duress is not a full excuse because she is responsible for being in that situation.

  - For D: The constraint is internalized and developmental, so at the time he lacked the capacity to do otherwise. Therefore, the reply misfires because it ignores the lack of capacity.

  Now, to answer the user's questions:

  **Has an established name?** Not a single name for the entire move, but components are named. The move itself is a common argument in everyday moral discourse. The closest established concept is the Principle of Alternate Possibilities (PAP) and its critiques, but it doesn't cover all cases.

  **Nearest concepts:**

  1. Principle of Alternate Possibilities (PAP): Moral responsibility requires that the agent could have done otherwise. It covers A (poorly because A is a counterexample), B (partially because in B she could have resisted but the threat is mitigating), C (partially because she could have resisted but prior fault matters), and D (poorly because he lacked capacity). Why not just this? Because PAP is challenged by Frankfurt cases (like A) and doesn't account for mitigating factors like duress or incapacity.

  2. Frankfurt-style counterexamples: Cases where an agent is responsible even though they couldn't have done otherwise. This covers A exactly. Why not just this? It only applies to counterfactual constraints and doesn't address actual duress or incapacity.

  3. Duress/Coercion: When an agent is forced by threats to act, reducing blame. Covers B (partial because she could have resisted) and C (partial, but prior fault complicates). Why not just this? It doesn't cover A (counterfactual) or D (upbringing).

  4. Moral Incapacity/Ignorance: When an agent lacks the capacity to recognize or do the right thing due to upbringing or circumstances. Covers D. Why not just this? It doesn't cover A, B, or C.

  **Case by case:**

  - A: 
    - Best label: Frankfurt case
    - Move succeeds: yes (the excuse doesn't work, so the reply is correct in dismissing it)
    - Load-bearing feature: The constraint was counterfactual and did not cause the action.
    - Reason: The agent acted on his own reasons without interference.

  - B:
    - Best label: Duress (partial)
    - Move succeeds: partly (the reply that she could have resisted is valid, but the threat reduces blame)
    - Load-bearing feature: The threat was actual and severe, but resistance was possible and reasonably expected in her situation.
    - Reason: The threat excuses to some extent because it would be hard to resist, but not impossible.

  - C:
    - Best label: Prior fault (or voluntary assumption of risk)
    - Move succeeds: yes (the excuse is weak because she chose to be in the situation)
    - Load-bearing feature: The agent voluntarily entered the situation knowing the risks.
    - Reason: She is responsible for putting herself in a position of duress.

  - D:
    - Best label: Moral Incapacity
    - Move succeeds: no (the reply misfires because he lacked the capacity to see an alternative at the time)
    - Load-bearing feature: The agent's upbringing deprived him of the capacity to recognize the wrongness.
    - Reason: He could not have done otherwise at the time because he didn't have the requisite moral understanding.

  **Is it one move?** 
  - Answer: No, it's more than one move. The reply is applying a single idea (you could have done otherwise) to different kinds of constraints, but the force of the reply depends on the type of constraint and the agent's relation to it.
  - Criterion that sorts the cases: The type of constraint (counterfactual vs. actual) and the agent's capacity and prior choices.

  **Proposed term:** Since there isn't one umbrella term, we can coin one that captures the common thread:

  - Term: "The Could-Have-Done-Otherwise Dismissal"
  - Definition: A reply in blame arguments that dismisses excuses by asserting that the agent acted on their own reasons and could have chosen differently, thereby rejecting the excuse.
  - Clear case: Case C (the shopkeeper with prior fault) because the reply clearly applies and the excuse fails.
  - Borderline case: Case B (the shopkeeper under threat) because the reply is partly right but the duress mitigates.
  - Excluded case: Case D (the man with upbringing) because the reply ignores the lack of capacity.

