  Hmm, the user is writing a political theory paper on urban-professional vs rural-working-class moral outlooks. They've developed a framework around "substitutability" - where professional classes see obligations as replaceable (substitutability-friendly) while rural/working classes see them as non-fungible (substitutability-hostile). They want to test this against Billy Elliot without plot summaries.

  I need to analyze how the film stages this substitutability conflict through five specific lenses: 1) Key collision scenes 2) How the film frames these outlooks 3) Where it resists the substitutability-friendly reading 4) How it distinguishes loyalty from entrapment 5) What cinematic elements add beyond theoretical concepts.

  For point 1, the boxing hall scene where Jackie discovers Billy dancing embodies the core conflict - the physical space literally forces the confrontation between ballet (mobility) and mining (rootedness). The strike context makes Billy's choice feel like betrayal.

  For point 2, the film subtly favors mobility through its visual storytelling - the Royal Ballet audition becomes a portal to light/space while the village remains dark and confined. The framing pushes us toward seeing escape as liberation.

  For point 3, I notice the film pushes back through Billy's hesitation - his near-failure to explain "electricity" at the audition suggests something ineffable is lost in translation to meritocratic terms. The ending's ambivalence about his return also complicates simple mobility narratives.

  For point 4, the film distinguishes genuine loyalty through Mrs. Wilkinson's character - her mentorship demonstrates solidarity that enables mobility rather than demanding stasis. This contrasts with the community's initial hostility that does trap people.

  For point 5, the visceral elements add most value - the physicality of Billy's dancing against gritty mining backdrops makes the moral tension felt rather than argued. The emotional impact of the final performance transcends theoretical binaries.

  The challenge is condensing each insight to 1-2 sentences while maintaining precision. I'll avoid any academic framing and focus on tight cinematic analysis that serves the user's theoretical framework. The response should feel like a concentrated critical reading rather than an essay.
answer: |-
  1.  The collision is sharpest when Jackie discovers Billy skipping boxing for ballet in the community hall, framed by the ongoing strike: this space, dedicated to masculine tradition, visually forces the direct confrontation between Billy's individual gift (implying mobility) and the community's non-fungible struggle (demanding presence).
  2.  The film concedes the substitutability-friendly case by framing Billy's escape to the Royal Ballet School through transcendent achievement and individual fulfillment, visually contrasting the cramped, dark village with the luminous, expansive stage, implicitly endorsing mobility as liberation.
  3.  The film resists a purely substitutability-friendly reading by lingering on the genuine grief and rupture caused by Billy's departure, particularly Jackie's sacrifice and the unresolved community loss, suggesting a cost beyond mere opportunity cost that the mobility vocabulary struggles to articulate.
  4.  It distinguishes loyalty from trap primarily through Mrs. Wilkinson: her support for Billy's escape, rooted in solidarity with his talent, demonstrates a loyalty expressed through enabling mobility, contrasting with the initial community pressure that *did* function as a valorized trap demanding stasis.
  5.  The film adds visceral weight through embodied performance: Billy's dancing expresses an inarticulate need for escape his community cannot grasp, while the miners' physical solidarity makes their rootedness feel like a tangible, lived reality, not just an abstract obligation, deepening the moral tension beyond theoretical opposition.
