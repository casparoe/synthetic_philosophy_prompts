prompt: |-
  had a long argument with my friend last night about inside view vs outside view and I think I lost more of it then I'd like, so I want to know how exposed my position actually is. Here's the version I'd defend: whenever a case has a usable reference class, the outside view gets default authority, and the inside view earns weight *only* as evidence about which reference class you're in -- and even there it gets a small weight, because my sense that my case is special is exactly the sort of judgment I'm supposed to be modest about. I've been calling the cost of slicing the class finer and finer the "gerrymander tax": every time you narrow, you pay in sample size and in how much the surviving cases really resemble yours, and I claim the tax is real but bounded.

  What would count against it? I want defeaters ranked from fatal to merely awkward, and I want you to separate the ones a defender of my view should honestly concede from the ones only a critic would throw. The three that got to me: (1) my friend said reference classes aren't found, they're built -- you can widen or narrow until you like the base rate -- and if modesty applies to my inside view it should apply to my sense of which class is the right one too, which either puts me in a regress or smuggles the inside view back in at the level of class choice; is there a non-arbitrary stopping point, and should the choice of class itself be governed by an outside view? (2) does consistent modesty eat itself -- if I discount my own reasoning about the details across the board, do I lose the ability to ever act on the details, and is that a reductio or a feature? (3) what empirical findings would actually move me, and are any of them arguably already in? I'd also like you to say whether my "usable reference class" escape hatch has qualified the whole thing into unfalsifiability, and if so whether that's damning for a view of this kind. The one that stuck with me is the thought that the outside view can't get off the ground without some inside-view judgment doing load-bearing work -- start there.
reasoning: |-
  Okay, the user had a heated debate with their friend about the inside view vs outside view, and they're worried their stance might be weaker than they thought. Their core argument is that the outside view should be the default when a usable reference class exists, with the inside view only serving as evidence about which reference class applies—and even then, it gets minimal weight because of modesty. They also mention a "gerrymander tax" for narrowing reference classes. 

  The user wants defeaters against their position, ranked by severity, and wants to know which ones they should concede versus which are just criticisms. They brought up three main points from their friend: (1) reference classes are constructed, not found, leading to potential regress or smuggling in the inside view; (2) consistent modesty might undermine all action; and (3) what empirical evidence could challenge their view. They're also concerned their "usable reference class" caveat makes their position unfalsifiable.

  First, I need to tackle the foundational issue: the outside view relies on inside-view judgments. The user's friend is right that choosing a reference class involves subjective decisions—what counts as "similar," what data to include, etc. The user's position might downplay this, but it's a real vulnerability. I should explain how this creates a regress problem and whether there's a non-arbitrary stopping point. 

  Next, the modesty eating itself. If the user discounts all their detailed reasoning, how can they ever act? This could be a reductio, but maybe it's a feature—forcing them to rely on base rates unless they have overwhelming evidence. I need to address whether this is practical or paralyzing. 

  For empirical evidence, studies like the Planning Fallacy research show the outside view beats inside-view predictions. But there are counterexamples, like expert intuition in stable domains (e.g., chess). The user should acknowledge this nuance. 

  The "usable reference class" escape hatch does risk unfalsifiability. If they can always say a reference class isn't "usable," their view becomes slippery. I should suggest ways to mitigate this, like clear criteria for usability. 

  The user seems intellectually honest—they're seeking weaknesses in their own view. Their deeper need might be validation that their position is defensible despite these challenges, or perhaps a clearer framework to salvage it. They might also want ammunition for future debates. 

  I'll structure the response by ranking defeaters from fatal to awkward, separating concessions from criticisms, and addressing each of their three points plus the unfalsifiability concern. The key is balancing rigor with practicality, showing where their view holds up and where it needs refinement.
answer: |-
  Here’s a structured analysis of your position’s vulnerabilities, ranked by severity and separated into concessions you *should* make vs. criticisms a skeptic might overstate. Your core view is defensible but requires refinement—especially on class selection and modesty limits.

  ---

  ### **Fatal or Near-Fatal Defeaters (Concede These)**  
  *These undermine your position’s foundations and require substantive adjustments.*

  1. **Reference Classes Are Built, Not Found (Your Friend’s Point #1)**  
     - **The Problem:** Choosing a reference class *always* relies on inside-view judgments (e.g., "Which features are relevant?", "What counts as 'similar'?"). Modesty about your case-specific judgment *should* extend to modesty about your class-selection judgment.  
     - **Why You Must Concede:**  
       - If class selection is arbitrary, the "default authority" of the outside view collapses—you’re just privileging one arbitrary class over others.  
       - **Non-arbitrary Stopping Point?** Only via *meta-rules* (e.g., "Use the broadest class with non-trivial data"), but these too require inside-view justification (e.g., "Why breadth over specificity?").  
     - **Solution:** Admit that class selection *is* an inside-view task, but constrain it with *epistemic humility*:  
       - Prioritize classes with **predictive validity** (e.g., classes that have worked in similar domains).  
       - Use **consensus classes** (e.g., industry standards) to reduce arbitrariness.  
       - Your "gerrymander tax" implicitly acknowledges this—formalize it as a bias-correction cost.

  2. **The Bootstrapping Problem (Your "Load-Bearing" Point)**  
     - **The Problem:** The outside view can’t function without inside-view inputs:  
       - Defining the *question* (e.g., "Will my startup succeed?" vs. "Will deep-tech startups in Berlin founded by Ph.D.s succeed?").  
       - Gathering/validating reference class data (e.g., "Which sources are reliable?").  
     - **Why You Must Concede:** This is inescapable. All empirical methods require initial priors or framing.  
     - **Solution:** Distinguish between *foundational* inside-view judgments (necessary to start any analysis) and *case-specific* ones (which your view discounts). Grant default authority only after initial framing.

  ---

  ### **Serious but Manageable Defeaters (Concede Partial Ground)**  
  *These force qualifications but don’t destroy your core argument.*

  3. **Modesty Undermining Action (Your Friend’s Point #2)**  
     - **The Problem:** If you distrust *all* fine-grained reasoning, you can’t act in novel situations (e.g., "Should I use AI in my startup?" has no reference class).  
     - **Why It’s Awkward:** Strict modesty *does* risk paralysis in edge cases.  
     - **Concede:** Your view applies best to **repeatable, classifiable decisions** (e.g., project timelines). In novel domains, inside view dominates *by default*—but modesty should still temper overconfidence.  
     - **Not a Reductio:** It’s a feature. The outside view is a *corrective*, not a universal oracle. When data is absent, you *must* use inside view—but cautiously.

  4. **Empirical Counterevidence (Your Point #3)**  
     - **What Should Move You:**  
       - **Planning Fallacy Studies:** When people use outside views (e.g., "How long did similar projects take?"), forecasts improve ([Kahneman & Tversky](https://www.jstor.org/stable/2626877)).  
       - **Exceptions:** In **high-expertise, high-feedback domains** (e.g., chess, firefighting), inside-view intuition often *beats* base rates ([Klein, *Sources of Power*](https://www.amazon.com/Sources-Power-People-Make-Decisions/dp/0262611465)).  
     - **Concede:** Outside view isn’t uniformly superior. Default to it in **low-predictability environments** (e.g., startups) but defer to experts in **stable, skill-based domains**.

  ---

  ### **Weaker Criticisms (Mostly Skeptical Noise)**  
  *Deflect these, but acknowledge their rhetorical force.*

  5. **"Usable Reference Class" as Unfalsifiable**  
     - **The Skeptic’s Claim:** If you can dismiss any counterexample as "no usable class," your view is non-falsifiable.  
     - **Response:** "Usable" isn’t arbitrary if defined:  
       - **Minimum N** (e.g., >20 cases).  
       - **Relevance** (e.g., class cases share >50% of key features with yours).  
       - **Predictive Utility** (e.g., class has outperformed inside-view guesses historically).  
     - **Verdict:** Not damning. All empirical tools have scope limits (e.g., randomized trials require feasibility).

  6. **Regress in Class Selection (Friend’s Point #1 Extended)**  
     - **The Skeptic’s Claim:** "Which reference class?" requires a meta-class, ad infinitum.  
     - **Response:** Terminate the regress with **pragmatic stopping rules**:  
       - Use the class with the **best Brier score** in calibration tests.  
       - Default to the **broadest uncontroversial class** absent strong evidence for narrowing.  
     - **Verdict:** A theoretical worry, not a practical one.

  ---

  ### **How to Salvage Your View**  
  1. **Reframe "default authority"** as a **bias-mitigation tool**—not an absolute truth.  
  2. **Embed class selection in a Bayesian framework**: Prior = broad class, likelihood = inside-view evidence for reweighting/narrowing.  
  3. **Quantify gerrymander tax**: Penalize class-narrowing by (1) shrinking effective N, (2) adding uncertainty via [beta-distribution priors](https://en.wikipedia.org/wiki/Beta_distribution).  
  4. **Accept that inside view does real work** in *defining the problem* and *interpreting the output*—but insist it shouldn’t *override* base rates without extraordinary evidence.

  **Bottom Line**: Your position is robust if you:  
  - **Concede** that class selection is inherently subjective (but constrainable).  
  - **Clarify** that outside-view authority is *heuristic*, not axiomatic.  
  - **Embrace** that modesty targets *overconfidence*, not action itself.  
  This turns "defeat" into a stronger, nuanced stance.
