     We provide the following activity plan:

     **Activity: Fairness Trade-off Discovery**

     **Materials:**
     - Dataset for Round 1 (loan denial) for Group A and Group B (as above) on a handout.
     - Worksheet for Round 1 with tables to fill in for each task.

     **Roles and Rules:**
     - Participants work in small groups (3-4 people) for 20 minutes.
     - They can set any threshold they want for Group A and Group B separately.
     - They must use the score to order individuals within a group: within a group, a higher score means higher risk, and they cannot change that order.
     - The decision rule: deny loan if score >= threshold for that group.

     **Tasks for Round 1:**
     1. Set thresholds for Group A and Group B such that exactly 4 individuals are denied in each group (40% denial rate). 
          - Record the thresholds.
          - Compute FPR and FNR for each group.
     2. Set thresholds for Group A and Group B such that the false positive rate is as close as possible to 20% in both groups.
          - Record the thresholds.
          - Compute the denial rate and FNR for each group.
     3. Set thresholds for Group A and Group B such that the false negative rate is as close as possible to 20% in both groups.
          - Record the thresholds.
          - Compute the denial rate and FPR for each group.

     Then, can they find thresholds that make both the denial rate and the FPR the same across groups? Or denial rate and FNR? Or FPR and FNR? They should try at least one combination (e.g., Task 1 and Task 2 thresholds) and see what happens to the third metric.

     **Round 2 (optional, time-permitting):**
     - New handout for a different decision: "Now, the bank uses the same risk score to offer a premium loan to low-risk individuals. We offer the premium loan if the score is < threshold. Here is new data from a different time period (or a different product)."
     - New dataset (Group A and Group B) with the same base rates but different scores and outcomes.
     - They are to set thresholds to achieve the same selection rate for the premium loan (e.g., 60% offered the premium loan) and then compute the error rates (now FP is offering the premium loan to someone who defaults, and FN is not offering to someone who does not default).

     **Debrief:**
     - Discuss what they found in Round 1: when they achieved demographic parity (same denial rate), what happened to FPR and FNR? (They became different.)
     - When they achieved error rate balance in FPR, what happened to the denial rate and FNR? (They became different.)
     - Introduce the terms: 
          - Demographic parity = same selection rate.
          - Error rate balance = same FPR and same FNR.
          - Calibration = the score means the same thing in both groups (e.g., a score of 50 corresponds to 50% risk of default in both groups).
     - State the impossibility theorem: when the base rates are different, you cannot have all three.
     - Explain that the trade-off is inherent in the score and the world (different base rates), not due to:
          - Bad data: even with perfect data, it happens.
          - Measurement error: even if the score is perfect within groups.
          - Prejudiced modellers: even with the best intentions.
     - Note that in Round 2, even though the threshold and the decision changed, the same trade-off appeared because the score was the same and the base rates were still different.

     **What will predictably go wrong:**
     - Confusion between FP/FN due to the double negative (predicting a negative event with a positive action).
     - Integer issues (not being able to hit exactly 20%).
     - Some groups may not finish all tasks.

     **How to handle:**
     - Provide a clear example on the board before they start: define FP and FN for a example threshold.
     - For integer issues, allow approximate (e.g., within 5%).
     - Have a facilitator walk around to help.

     **What the exercise cannot reproduce:**
     - The activity uses small synthetic datasets, but the theorem holds for large real datasets.
     - The activity doesn't show calibration because we don't have enough data per score, but the theorem holds even for perfectly calibrated scores.
     - The activity doesn't involve model training, but the theorem is about the predictions.

     We then conclude with a discussion on how to navigate these trade-offs in practice, which involves ethical and contextual considerations.

     This should fit within 90 minutes.
