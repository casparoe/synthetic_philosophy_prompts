prompt: |-
  Construct a thought experiment that reverses the usual dialectical use of pain asymbolia, built to the following specifications.

  The standard clinical picture of asymbolia — a patient who can localize, describe, and intensity-rate a noxious stimulus, yet reports that it does not bother them — is standardly deployed against views that locate pain's badness in the subject's aversive stance, on the ground that here is pain without aversion. Your case must be the mirror image, and must put the pressure on the views that tie pain to what it represents or commands: imperativism (pain is a perceptual experience whose content includes an imperative to protect a body part) and a pure sensory-quality view (pain is a distinctive somatic sensation with location and qualitative character, so that a state lacking these is not pain).

  The case: a neurological patient whose state is (1) elicited only by noxious stimulation and graded with intended stimulus intensity, so that it is plainly a state of the pain modality rather than a mood or free-floating distress; (2) devoid of sensory-discriminative content — no location, no describable quality, no ability to distinguish pinprick from heat from deep pressure, no withdrawal reflex, no guarding of any body part; (3) nonetheless thoroughly aversive — high unpleasantness ratings, eager pursuit of analgesia, willingness to incur real costs to avoid the state. Motivate the lesion from the standard lateral/medial division of ascending pain pathways rather than from invented technology, and keep the scenario itself to a single paragraph.

  Then do the demonstration. Give the verdict each of three accounts — an attitudinal or desire-based theory, imperativism, and the pure sensory-quality view — renders on whether the patient is in pain and whether the state is bad for them, and show that each verdict follows from that account's own constitutive claims rather than from anything you stipulate. The attitudinal theory must be the one that comfortably counts the state as a genuinely bad pain; the other two must be pushed toward denying that it is pain at all, and you must close their cheapest escape route, an imperative whose content is only something like "something is wrong somewhere." Close by identifying the single feature of the case that does the work, saying what becomes of each verdict if that feature is removed, and stating the strongest reply available to the imperativist — for instance that the patient suffers from something other than pain, or that asymbolia and your case are not true mirror images.

  The case is for isolating whether pain's badness can be located in the subject's aversive stance alone. Accordingly, the patient's own judgments about what their state is must do no evidential work, and nothing may be settled by stipulation rather than generated by the theories.
reasoning: |-
  We are constructing a thought experiment to reverse the dialectical use of pain asymbolia. In standard asymbolia, the patient feels pain but lacks aversion, which challenges attitudinal theories that tie pain's badness to aversion. Our case must challenge imperativism and pure sensory-quality views by presenting a state that is aversive but lacks any sensory-discriminative content and is tied to the pain modality.

  **The Case:**
  Imagine a patient with a bilateral lesion of the spinothalamic tract (STT) at the level of the anterolateral cord, sparing the dorsal columns and the phylogenetically older spinoreticular and spinomesencephalic pathways. This lesion abolishes all sensory-discriminative aspects of pain: the patient cannot localize noxious stimuli, cannot describe their quality (e.g., burning, stinging), and shows no reflexive withdrawal or guarding. However, the intact medial pathways (including the spinoreticular and spinomesencephalic tracts) project to the limbic system and brainstem, mediating affective and motivational responses. Thus, when noxious stimuli are applied anywhere on the body, the patient reports a global, intensely unpleasant state, rated as highly distressing on standardized scales, and will actively seek analgesia and avoid situations that provoke this state. The state is graded with stimulus intensity and occurs only upon noxious stimulation, ensuring it is modality-specific.

  **The Demonstration:**
  We now apply three theories to this case.

  1. **Attitudinal (Desire-Based) Theory:** This theory holds that pain is bad because of the subject's aversive attitude toward the experience. In our patient, the state is highly aversive (as evidenced by high unpleasantness ratings and behavioral avoidance). Therefore, the attitudinal theory counts this state as a genuinely bad pain. The verdict follows because the theory locates the badness in the aversion, which is present.

  2. **Imperativism:** Imperativism claims that pain is a command to protect a specific body part (e.g., "protect your hand!"). In our case, the patient's state lacks any specific location or body-directed imperative. There is no withdrawal reflex, no guarding, and the patient cannot even distinguish the source of the stimulation. Thus, the imperative must be non-specific. However, if we allow a global imperative (e.g., "something is wrong, do something!"), this would not be a pain imperative according to standard imperativism, which requires a specific bodily command. Therefore, imperativism is pushed to deny that this state is pain because it lacks the specific imperative content that defines pain. We close the escape route of a global imperative by noting that imperativism typically defines pain by its specific body-directed commands; a global imperative would collapse pain into a general alarm state, which imperativists explicitly reject to avoid overgeneralization.

  3. **Pure Sensory-Quality View:** This view holds that pain is a distinctive sensory experience with location and qualitative character (e.g., burning, stinging). Our patient's state lacks any such sensory-discriminative features: no location, no describable quality, no ability to discriminate stimulus types. Therefore, according to this view, the state is not a pain because it lacks the defining sensory features. The state might be an unpleasant affective response, but it is not pain.

  **Closing:**
  The single feature that does the work is the **absence of sensory-discriminative content** (location, quality, discriminatory capacity) combined with the presence of a graded, modality-specific, and aversive state. If we remove the absence of sensory-discriminative content (i.e., if the state had location and quality), then:
  - The attitudinal theory would still count it as bad pain (because aversion is present).
  - Imperativism would count it as pain (if the imperative is specific) and bad (because imperatives are inherently motivating and the state is aversive).
  - The pure sensory-quality view would count it as pain (if it has the sensory features) and might leave the badness to be explained by other factors.

  The strongest reply available to the imperativist is to argue that the patient suffers from a different state (e.g., a general affective alarm) that is not pain, because pain must have a specific imperative content. Alternatively, the imperativist might claim that asymbolia and this case are not true mirror images: asymbolia retains the sensory content and loses the imperative, while this case loses the sensory content and retains a general aversive state that is not a pain imperative. Thus, the imperativist can maintain that pain requires both the specific imperative and the sensory content (or at least the specific imperative) and that this case lacks the defining feature of pain.
answer: |-
  ### Thought Experiment: Reverse Pain Asymbolia  
  **The Case:**  
  A patient sustains bilateral lesions to the lateral spinothalamic tract (specifically targeting the neospinothalamic pathway), while sparing the medial spinothalamic and spinoreticulothalamic pathways. This disrupts the transmission of sensory-discriminative information (e.g., location, quality, intensity discrimination) to the somatosensory cortex and thalamus, but preserves the affective-motivational projections to the anterior cingulate cortex, insula, and amygdala. When subjected to noxious stimuli (e.g., pinprick, heat, pressure), the patient reports a diffuse, indescribable state of distress—graded precisely with stimulus intensity—but cannot localize it, identify its quality, distinguish stimulus types, or exhibit reflexive withdrawal/guarding. Neurologically, this is evidenced by absent laser-evoked potentials (indicating disrupted sensory-discriminative processing) but intact fMRI activation in limbic regions. The state is intensely aversive: the patient rates it as maximally unpleasant, actively seeks analgesics (e.g., opioids), and avoids experimental sessions despite financial incentives. Critically, it occurs *only* during noxious stimulation, confirming its modality-specificity to pain.

  ---

  ### Demonstration: Verdicts from Three Accounts  
  **1. Attitudinal/Desire-Based Theory (e.g., Bain, Jacobson)**  
     - **Constitutive claim:** Pain’s badness is constituted by the subject’s *aversive attitude* (e.g., a desire for the state to cease). Pain is identified by its elicitation under noxious stimuli and its motivational profile.  
     - **Verdict:** The patient is in pain, and the state is bad for them.  
     - **Why?** The state is (1) elicited by noxious stimuli (tying it to pain modality), (2) graded with intensity, and (3) met with strong aversion (unpleasantness ratings, analgesia-seeking). The aversive attitude alone suffices for badness; sensory content is irrelevant.  

  **2. Imperativism (e.g., Klein, Hall)**  
     - **Constitutive claim:** Pain is a perceptual state with *imperative content* commanding protection of a specific body part (e.g., "Protect your hand!").  
     - **Verdict:** The patient is **not** in pain, and the state’s badness is ambiguous (if not pain, it may be bad but not *as pain*).  
     - **Why?** The state lacks any location-specific imperative: no withdrawal reflexes, no guarding, and no ability to link distress to a body part. Imperativism defines pain by its *directive spatial content*; a global imperative (e.g., "Fix something!") is excluded because it fails to distinguish pain from non-pain alarms (e.g., nausea). The escape route—a vague command like "Something is wrong somewhere"—is closed: imperativists explicitly reject this to avoid collapsing pain into undifferentiated distress (Klein, 2015). Without a body-directed command, the state is not pain.  

  **3. Pure Sensory-Quality View (e.g., Tye, traditional intensity theory)**  
     - **Constitutive claim:** Pain is a *distinctive somatic sensation* with location, quality (e.g., burning), and intensity. A state lacking these is not pain.  
     - **Verdict:** The patient is **not** in pain, though the state is bad.  
     - **Why?** The patient cannot localize the state, describe its quality, or discriminate stimuli—all hallmarks of sensory phenomenology. The state is thus a generic aversive affect (like anxiety), not pain. Badness derives from its unpleasantness, but this does not make it pain.  

  ---

  ### Key Feature and Counterfactuals  
  **The single feature doing the work:** **Absence of sensory-discriminative content** (location, quality, stimulus discrimination).  
  - **If removed (i.e., sensory content added):**  
    - Attitudinal theory: Still counts as bad pain (aversion remains).  
    - Imperativism: Counts as pain if a specific imperative is present (e.g., "Protect your foot!").  
    - Sensory-quality view: Counts as pain if location/quality is present.  
    Without this absence, all theories *could* agree the state is pain, but the reverse case isolates aversion as sufficient for badness.  

  **Strongest imperativist reply:** The patient suffers from a *non-pain affective state* (e.g., "proto-pain" or distress) triggered by noxious input, not pain itself. Imperativists argue pain requires a *specific bodily directive*; here, only a generalized aversion exists. They may also deny that asymbolia and this case are true mirrors: asymbolia retains the imperative but lacks aversion, while this case lacks the imperative but has aversion. Thus, imperativism escapes by insisting pain’s essence includes commanding bodily protection—not just aversion.  

  ---

  **Isolating the Dialectic:** The case forces imperativism and sensory-quality views to deny the state is pain *on their own terms*, while the attitudinal theory embraces it. Patient judgments (e.g., "I’m in pain") are excluded to avoid stipulation; the verdicts derive solely from each theory’s constitutive claims about pain’s nature. This shows aversion alone *can* constitute pain’s badness, but only if pain is defined attitudinally.
