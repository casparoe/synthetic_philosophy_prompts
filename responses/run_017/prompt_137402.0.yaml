prompt: |-
  ok so I'm on the steering committee of the bike co-op I volunteer at — about 300 members, shared tools, two floors. There's an unwritten thing about where tools go when you're done: the weekday regulars all hang theirs back on the labeled rack by the door, the weekend crowd mostly leaves them on their bench till end of day. Both patterns are stable, everyone in each clique expects everyone else in it to do the same, and honestly it barely matters which one you do as long as the other people in the room are doing it.

  A few of us want to post a printed rule (pick one, either way) and one of the older members keeps shutting it down: "a norm is like which side of the road you drive on — nobody chose it, nobody enforces it, it holds because we all expect each other to, so a sign isn't going to make it work and might just kill the thing that was actually holding it together." He's read some Lewis and talks about coordination problems and equilibria and salience.

  Two things I think complicate it but I can't tell whether they're the kind of thing that breaks the comparison or just noise. First: some people genuinely prefer that everyone else put tools away and that they personally not have to — they like a tidy shop, they just dont like tidying. Second: turnover is high, and about a year ago a manager did post a rule (everything back on the wall) and maybe thirty people followed it for a week before it quietly died.

  Can you audit the driving analogy for me: what's supposed to map onto what (what plays the role of the road, the oncoming traffic, the two sides, the crash), which of those features our shop actually has and which it doesn't, where the mapping breaks, and whether his conclusion — don't formalize, it won't take and might crowd out the real norm — survives once the differences are on the table. Then, if the actual problem is that neither option is salient enough, is there something short of a written rule that does the same work (painting the rack bright yellow, moving it right next to the door), and is that just the same top-down thing wearing a different hat?

  Give me exactly five numbered points, one or two sentences each, no intro and no wrap-up.
reasoning: |-
  Okay, the user is part of a bike co-op steering committee dealing with an unwritten tool-return norm conflict. They need help analyzing an older member's driving-side analogy about norms and whether formalizing the rule would help or hurt. 

  First, I need to map the driving analogy to their shop scenario: 
  - Road = Shared workspace expectation 
  - Oncoming traffic = Other users' actions 
  - Left/right sides = "Wall return" vs "bench leave" methods 
  - Crash = Tool unavailability/disruption 

  The key differences that break the analogy are: 
  1) Asymmetric preferences (some want tidy shop but avoid tidying) unlike driving where all want collision-avoidance equally 
  2) High turnover and failed rule attempt show fragility unlike stable driving norms 
  3) Both methods are functionally similar (unlike dangerous wrong-side driving) so incentive to coordinate is weaker 

  The older member's conclusion holds because: 
  - Written rules failed before due to weak enforcement 
  - Formalizing might undermine existing organic solutions 
  - But subtle interventions (like painting racks) could boost salience without top-down pressure 

  The core problem is neither method is salient enough for newcomers. Non-rule interventions (visual cues, rack relocation) might work better than mandates by working with existing social dynamics rather than against them.
answer: |-
  1.  **Road = Shared expectation:** The "road" maps to the shared expectation that everyone will follow *some* consistent pattern for tool placement (either rack or bench), essential for smooth operation like traffic flow.
  2.  **Oncoming traffic = Others' actions:** "Oncoming traffic" represents the actions of other users; you rely on *their* predictable behavior (choosing rack or bench) to coordinate your own choice, just as drivers rely on others staying on the expected side.
  3.  **Sides = The two norms:** The "left/right sides" are the two stable patterns: "return to rack" (weekdays) and "leave on bench" (weekends), each a functional equilibrium for its group.
  4.  **Crash = Coordination failure:** A "crash" occurs when expectations clash, leading to tools misplaced or unavailable, disrupting work like a collision disrupts traffic – the risk both norms avoid *within* their group.
  5.  **Broken mapping (asymmetry & weak salience):** Unlike driving, where *all* drivers equally fear collisions, your shop has free-riders (want tidy shop but avoid tidying) and neither norm is universally "salient" (obvious default), especially for newcomers, weakening the organic stability the analogy relies on. The older member's "don't formalize" conclusion *mostly holds* here because a top-down rule lacks enforcement teeth and risks undermining existing fragile equilibria, as the failed past attempt showed. Boosting salience (painting the rack yellow, moving it) is different; it subtly *reinforces* an existing option without mandating it, potentially aiding coordination without top-down enforcement, leveraging visibility rather than authority.
