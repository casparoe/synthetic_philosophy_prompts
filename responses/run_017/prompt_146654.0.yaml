prompt: |-
  I run the clinical ethics consultation service at a large teaching hospital, and most of our consults are family disagreements about treatment for a patient who has lost capacity. Our standing protocol is autonomy-based: look for an advance directive, identify the designated surrogate, apply substituted judgment, fall back on best interests. It keeps producing recommendations that families experience as foreign — it insists on one person whose judgment counts, and it treats the patient as a self-contained chooser with a pre-existing will to be unearthed. I want a second procedure to run alongside it, built from Confucian role ethics, that begins from the patient as a node in a web of relationships and from obligations that attach to roles rather than to individuals.

  Constraints on the design: it has to be runnable inside one thirty-minute family meeting by a rotating fellow with no philosophy training; it has to end in something the attending physician can sign and our legal office can defend, even though that office thinks exclusively in terms of individual autonomy and statutory surrogacy; and it has to be honest about where it stops.

  So please write the procedure: the questions in order, what counts as an adequate answer to each, where it halts with a recommendation, and where it deliberately hands the decision to a person because the question is one of values or of institutional authority rather than something the framework can settle. Two features of our caseload must be handled explicitly. First, roles are frequently held by people who have not lived them — the son who is statutory next of kin but has not spoken to his father in twelve years, the stepdaughter who has done the daily caring for six. Say what your procedure does when role and enacted relationship diverge, and state plainly whether you are treating a role as conferred by social position or as constituted by the relationship actually being lived; I know this is contested, so commit to one and say what it costs you. Second, patients often arrive with a written advance directive that the family wants set aside. The written document is the paradigm object of the autonomy framework and has almost no place in a role-ethics one; do not quietly ignore it — say what the procedure does with it.

  Then run the procedure on three recent cases: (1) a widowed father with advanced dementia and no directive, whose estranged son, the legal surrogate, wants a feeding tube and aggressive treatment, while the brother who has visited weekly for years says he was told repeatedly that he never wanted machines; (2) a man with pneumonia and a signed directive refusing antibiotics, whose wife and two adult children, all closely involved, insist he has changed his mind and want it overridden; (3) two daughters equally involved in their father's care, one arguing that filial responsiveness means honoring the wish he stated, the other that it means protecting him from a burdensome intervention. I expect at least one of these to come out somewhere I won't like; do not steer around that.

  Finally, answer as a specialist in comparative moral philosophy who knows both Confucian ethics and clinical practice. Think the design through before you write — sketch at least one alternative structure and say why you rejected it. Flag where the translation does violence to the theory: which distinctions you had to drop to make it usable by a non-specialist in half an hour, which you refused to drop, and which step is most exposed to being gamed by an articulate family. Close with a confidence note on the procedure as a whole and on each step, and single out the one claim you are least sure of, including whether your uncertainty is about institutional design or about what the tradition actually commits you to.
reasoning: |-
  We are designing a Confucian role ethics-based clinical ethics consultation procedure to run alongside the existing autonomy-based protocol. The procedure must:
  - Be executable in one 30-minute family meeting by a rotating fellow with no philosophy training.
  - End in a recommendation that the attending physician can sign and the legal office can defend (despite their individual autonomy framework).
  - Be honest about where it stops and hands off to individuals or institutions.
  - Explicitly handle two common issues: 
      a. Divergence between statutory role and lived relationship (e.g., estranged next of kin vs. involved stepchild). We must commit to whether a role is defined by social position or enacted relationship. I choose: **enacted relationship**. Why? Because Confucian role ethics emphasizes the actual performance and cultivation of relationships (e.g., filial piety is shown through action, not just status). The cost: it may conflict with legal definitions of surrogacy, and we may have to argue for the moral authority of the person who has actually been in the relationship. But note: we cannot change legal surrogacy; we can only make a recommendation that the legal surrogate should defer to the person with the lived relationship, and if they don't, we must fall back to the legal framework.
      b. Written advance directives that the family wants set aside. We do not ignore it. We treat it as a piece of evidence about the patient's past wishes, but in the Confucian framework, the patient's identity is relational and dynamic, so current family relationships and obligations may override a past individual directive. However, we must be cautious about overriding a written document. The procedure will consider the directive but give more weight to the current relational context.

  **Structure of the Procedure:**
  The procedure is a series of questions to be asked in a family meeting. It must be simple and fit in 30 minutes. I propose 5 steps:

  1. **Identify the web of relationships:** Who are the key people in the patient's life? Who has been involved in their care? (Adequate answer: list of people and their roles, e.g., spouse, children, close friends, and a brief note on the nature and frequency of interaction.)

  2. **Assess the quality of relationships:** For each key person, what has been the nature of their involvement? (Adequate answer: descriptions of care activities, emotional support, frequency of contact, and any conflicts. We are looking for who has been living the role.)

  3. **Determine the primary caregiver(s):** Who has been most consistently involved in the patient's daily care? (Adequate answer: one or two people who have been hands-on. This step identifies the person(s) whose judgment should carry the most weight because they are most attuned to the patient's relational identity and needs.)

  4. **Seek consensus through relational obligations:** Ask the primary caregiver(s) and the family: What do the relationships demand? What would be most respectful of the patient's place in the family and community? (Adequate answer: a shared understanding of the patient's values as expressed through relationships, and an agreement on what the roles require. If consensus is reached, proceed. If not, note the disagreement and move to step 5.)

  5. **Make a recommendation or hand off:**
     - If consensus is reached: Recommend the consensus decision as the one that best honors the patient's relational identity and obligations.
     - If consensus is not reached: Hand the decision to the legal surrogate (because the Confucian framework cannot resolve the conflict and we must respect institutional authority). However, we note that the primary caregiver(s) from step 3 should be given special consideration by the legal surrogate.

  **Handling the advance directive:**
     - At step 4, when discussing relational obligations, we explicitly bring up the advance directive (if it exists) as one piece of evidence of the patient's past wishes. But we frame it in the context of relationships: "Did the patient discuss this directive with any of you? How did it fit into your relationships? Has the patient's situation or relationships changed in a way that might alter how we interpret this directive?" We do not treat it as binding in the Confucian framework.

  **Stopping points:**
     - If at step 3, there is no one who has been consistently involved, we fall back to the legal surrogate (but note the lack of relational depth).
     - If at step 4, consensus is not reached, we hand off to the legal surrogate.

  **Procedure Steps (for the fellow to follow):**

  1. **Question 1:** "Let's start by understanding who was important in [Patient's Name]'s life. Who were the people closest to them? Who has been involved in their care recently?"  
     - Adequate answer: A list of names and their relation to the patient. The fellow notes these down.

  2. **Question 2:** "For each of you, could you describe how you have been involved in [Patient's Name]'s life and care? How often do you see or talk to them? What kind of support do you provide?"  
     - Adequate answer: Descriptions that show the depth and nature of each relationship. The fellow looks for patterns of care and commitment.

  3. **Question 3:** "Based on what we've heard, who has been most consistently involved in the day-to-day care of [Patient's Name]?"  
     - Adequate answer: Identification of one or two primary caregivers. If there's dispute, the fellow may have to decide based on the descriptions (this is the step most vulnerable to being gamed, so the fellow must focus on specific actions and consistency).

  4. **Question 4:** "Now, thinking about what [Patient's Name] meant to all of you and what your roles in their life require, what do you believe would be the most caring and respectful course of action? How do the relationships we've described guide us?" [If there's an advance directive, add: "We also have this advance directive from the past. How does that fit into your understanding of what [Patient's Name] would want now, in the context of their relationships?"]  
     - Adequate answer: A discussion that leads to a consensus on treatment. If consensus is reached, the fellow records it. If not, the fellow notes the disagreement.

  5. **Question 5:** 
     - If consensus: "We've reached an agreement that [decision] best honors [Patient's Name] and the relationships that defined them. We recommend this course of action."
     - If no consensus: "Because we cannot reach consensus, we must turn to the legal surrogate to make the final decision. However, we strongly encourage the surrogate to give great weight to the views of [primary caregiver(s)] because of their deep involvement in [Patient's Name]'s care."

  **Now, run the three cases:**

  **Case 1: Widowed father with advanced dementia, no directive. Legal surrogate: estranged son (wants feeding tube). Brother (visited weekly) says patient never wanted machines.**

  - Step 1: Key people: estranged son (legal surrogate), brother (weekly visitor), possibly others? Let's assume only these two.
  - Step 2: 
     - Son: estranged, no contact for 12 years, not involved in care.
     - Brother: visited weekly for years, involved in care decisions, reports patient's wishes.
  - Step 3: Primary caregiver? The brother. The son has not lived the role.
  - Step 4: We ask: What do the relationships demand? Brother says: patient did not want machines. Son disagrees. No consensus? We must be clear: the brother is the primary caregiver and has the lived relationship. But the son is the legal surrogate. The procedure says: if no consensus, hand to legal surrogate but recommend that the surrogate (son) defers to the brother. However, the son may not defer. 
     - **Recommendation:** We recommend against the feeding tube, based on the brother's testimony and the fact that he is the one who has lived the relationship. But if the son (legal surrogate) insists, we hand off to him and note the conflict. The legal office may have to accept the son's decision, but our report will state that the brother is the one with the relational knowledge.

  **Case 2: Man with pneumonia, signed directive refusing antibiotics. Wife and two adult children (all involved) want to override.**

  - Step 1: Key people: wife, two adult children (all closely involved).
  - Step 2: All three have been involved in care and are in regular contact.
  - Step 3: Primary caregiver? Probably the wife, but all are involved. We might consider all three as a unit.
  - Step 4: They all insist the patient changed his mind. We ask about the directive: "Did he discuss this with you? How have his relationships and views evolved?" They say: he had the directive from a time when he was sicker and more depressed, but recently he expressed a desire to live for his family. They provide examples of recent statements. 
     - Consensus: They agree to override the directive and give antibiotics.
     - **Recommendation:** We recommend overriding the directive and providing antibiotics because the family, who are living the relationships, agree that the patient's current relational identity and obligations point to this.

  **Case 3: Two daughters equally involved in father's care. One says filial duty is to honor his stated wish; the other says it is to protect him from a burdensome intervention.**

  - Step 1: Key people: two daughters (both involved).
  - Step 2: Both have been equally involved in daily care.
  - Step 3: Both are primary caregivers.
  - Step 4: We ask: What do the relationships demand? They disagree. Daughter A: "He said he wanted this, and we must respect his words." Daughter B: "But now, seeing him suffer, we must protect him. That's what a good daughter does." We cannot reach consensus. 
     - Step 5: Because there is no consensus and both are equally involved, we hand the decision to the legal surrogate. Who is the legal surrogate? The case doesn't say. Let's assume they are both next of kin and there's no clear legal hierarchy (e.g., no spouse). We might have to fall back to the autonomy framework (if the hospital has a policy for multiple surrogates) or ask them to try to agree. But the procedure says: hand off to the legal surrogate. If there is no designated surrogate and they are both at the same level, we might have to say they must come to an agreement or we defer to the attending. However, the procedure must be consistent: we hand off. 
     - **Recommendation:** We do not make a recommendation. We state that the two daughters are equally involved and cannot agree. The decision must be made by the attending physician (or by the legal surrogate if one is designated) after considering both views. We note that both interpretations of filial duty are valid in the Confucian tradition, and we cannot resolve the conflict within the framework.

  **As a specialist in comparative moral philosophy:**

  **Design Alternatives Considered:**
  I considered a more elaborate structure that included a step to explicitly define the patient's roles (e.g., father, husband) and then derive obligations from those roles. But I rejected it because:
  - It would require philosophical training to navigate role conflicts and obligations.
  - It would take too long in a 30-minute meeting.
  - The current design (focusing on lived relationships and primary caregivers) is more practical and avoids abstract discussions of roles.

  **Where the translation does violence to the theory:**
  - **Distinctions dropped:**
    1. The rich Confucian concepts of *ren* (benevolence) and *li* (ritual propriety) are not explicitly used. We focus on care and respect, but the deeper moral cultivation is backgrounded.
    2. We do not differentiate between different roles (e.g., parent-child vs. spouse) and their specific obligations. We treat "relationships" generically.
  - **Distinctions kept:**
    1. The relational self: We insist on starting with the web of relationships and on the moral weight of the lived relationship.
    2. We refuse to treat the advance directive as an isolated individual act, contextualizing it within relationships.
  - **Step most exposed to gaming:**
    Step 3 (identifying the primary caregiver) is vulnerable. An articulate but uninvolved family member might exaggerate their involvement. The fellow must focus on concrete examples (e.g., "When was the last time you visited? What specific care did you provide last month?").

  **Confidence Note:**
  - **Overall procedure:** Moderate confidence. It is a pragmatic adaptation that captures the spirit of Confucian role ethics but simplifies it for clinical use. It might work well in families with strong relationships but could struggle with fractured ones.
  - **Step 1 and 2:** High confidence. They are straightforward and gather necessary data.
  - **Step 3:** Low confidence. It is hard to assess the quality of relationships quickly, and it may feel reductive to name one primary caregiver.
  - **Step 4:** Moderate confidence. It invites a values discussion that might be messy but is essential.
  - **Step 5:** High confidence for the consensus path, low for the no-consensus handoff. The handoff may feel like a failure but is necessary given institutional constraints.

  **The claim I am least sure of:**
  That we should define roles solely by enacted relationships and not by social position. I am uncertain because:
  - Confucian texts often emphasize social roles (e.g., father-son) as given, but they also stress that the roles must be performed. My choice prioritizes performance, which is more flexible but may be seen as revisionist by some scholars. The cost is that it may lead to recommendations that the legal system cannot accept. The uncertainty is both about institutional design (how to reconcile with law) and about the tradition (whether performance is sufficient without the formal role).

  This procedure is an experiment. It may produce recommendations that challenge the autonomy framework, but that is the point. It should be used alongside the existing protocol, not as a replacement, and the ethics service must be prepared to defend its moral reasoning to the legal office.
answer: |-
  ### Confucian Role Ethics Clinical Ethics Consultation Procedure

  This procedure is designed as a 30-minute structured family meeting, complementing (not replacing) your autonomy-based protocol. It prioritizes the patient as a node in a relational web, where obligations arise from *lived roles* rather than legal status or isolated individual preferences. The goal is a consensus-based recommendation that respects institutional constraints while challenging the autonomy framework. Below is the step-by-step guide for fellows, followed by case applications, design rationale, and limitations.

  ---

  ### **Procedure Script: 30-Minute Family Meeting**
  *(Fellow instructions in italics; questions to ask aloud in bold.)*

  #### **Step 1: Map the Relational Web (5 minutes)**  
     - ***Purpose:*** Identify who truly constitutes the patient's relational world.  
     - ***Ask:*** **"Who has been most present in [Patient's Name]'s daily life and care in the past year? Please share how each of you has been involved."**  
     - ***Adequate Answer:*** Names, relationships, and specifics of involvement (e.g., "I visited twice weekly and managed medications," or "I live abroad but called every Sunday"). *No philosophy needed—just facts.*  
     - ***Handling Divergence:*** Roles are defined by **enacted relationships, not social/legal status**. An estranged son with legal surrogacy but no contact is noted as "legally designated but relationally distant." A stepdaughter providing daily care is "relationally central."  
       - ***Cost of This Choice:*** It may alienate legal surrogates and create tension with your legal office. However, it honors Confucianism’s emphasis on roles as cultivated through action (e.g., *xiao* 孝, filial piety, requires active care). We lose consistency with legal hierarchies but gain moral coherence.

  #### **Step 2: Define Role-Based Duties (10 minutes)**  
     - ***Purpose:*** Uncover obligations from lived roles, not individual preferences.  
     - ***Ask:*** **"Thinking about your relationships with [Patient's Name], what do you feel is your duty to them now? How would fulfilling that duty guide their care?"**  
     - ***Adequate Answer:*** Concrete, role-grounded responses (e.g., "As his brother, I promised to ensure he doesn’t suffer," or "As her daughter, my duty is to protect her dignity"). *Avoid abstract debates—focus on actions.*  
     - ***Handling Advance Directives:*** **Explicitly address the document but contextualize it relationally.** Ask: **"We have a written directive. How does it fit with the duties you’ve described? Has the patient’s role in your relationships changed since it was written?"**  
       - The directive is **evidence, not authority**. If the family agrees it aligns with current duties, use it; if not, override it. Confucianism sees identity as fluid and relational—a past "individual" wish may not reflect current role obligations.

  #### **Step 3: Identify Primary Harmonizers (5 minutes)**  
     - ***Purpose:*** Designate 1–2 people whose lived roles grant them moral weight in seeking consensus (Confucian *he* 和, harmony).  
     - ***Ask:*** **"Who has been most engaged in the day-to-day work of caring? Can we all agree to let their voice help guide us toward harmony?"**  
     - ***Adequate Answer:*** Group acknowledgment of 1–2 individuals (e.g., "Yes, Maria managed his care for years"). *If contested, fellow chooses based on Step 1 evidence.*  
     - ***Stopping Point:*** If no one qualifies (e.g., all are estranged), halt and defer to legal surrogate. Confucianism cannot operate without lived relationships.

  #### **Step 4: Seek Consensus (7 minutes)**  
     - ***Purpose:*** Achieve harmony through shared role obligations.  
     - ***Ask:*** **"Can we agree on a path that best honors [Patient's Name]’s place in your family? Let’s focus on your shared duties, not individual opinions."**  
     - ***Adequate Answer:*** Explicit consensus (e.g., "We all agree to stop treatment"). *If disagreement persists, note dissenting views but do not force resolution.*  
     - ***Stopping Point:*** Consensus reached → Proceed to recommendation. No consensus → Hand decision to legal surrogate. Confucianism values harmony, but cannot impose it.

  #### **Step 5: Recommendation & Handoff (3 minutes)**  
     - ***Purpose:*** Issue a defensible recommendation or delegate to institutional authority.  
     - ***If Consensus:*** **"We recommend [decision] because it best reflects the duties arising from [Patient's Name]’s relationships."**  
     - ***If No Consensus:*** **"We cannot reach harmony. The legal surrogate must decide, but we urge deep consideration of [Primary Harmonizer’s] perspective due to their care role."**  
     - ***For Legal/Attending:*** Frame as "relational best interests" to appease autonomy-centric stakeholders. Document: *"Recommendation based on role-based consensus; falls back to legal surrogate if discordant."*

  ---

  ### **Case Applications**
  *(Fellow uses the procedure verbatim.)*

  #### **Case 1: Estranged Son vs. Involved Brother**  
  - **Step 1:** Brother (weekly visits, managed care) is relationally central; son (12-year estrangement) is legally surrogate but relationally peripheral.  
  - **Step 2:** Brother’s duty: "Prevent suffering per his wishes." Son’s duty: "Extend life as his son." Directive: None.  
  - **Step 3:** Brother is primary harmonizer (consensus-building role).  
  - **Step 4:** No consensus. Son insists on feeding tube; brother refuses.  
  - **Step 5:** **Handoff.** "No consensus. Legal surrogate (son) must decide, but we urge honoring brother’s view due to his care role."  
    - ***Outcome:*** Autonomy framework would side with son; Confucian procedure forces confrontation with relational disconnect. You may dislike deferring to the son, but institutional constraints require it.

  #### **Case 2: Directive Refusing Antibiotics, Family Override**  
  - **Step 1:** Wife and children—all involved daily—form relational web.  
  - **Step 2:** Duties: "As spouse/children, we must preserve his life now; he changed his mind." Directive: Contextualized as "past wish before his role as family anchor deepened."  
  - **Step 3:** Wife is primary harmonizer.  
  - **Step 4:** Consensus: Override directive, give antibiotics.  
  - **Step 5:** **Recommendation.** "Provide antibiotics; aligns with family’s role-based duties to preserve his relational presence."  
    - ***Outcome:*** Directly overrides written directive. Confucianism treats the patient’s "self" as evolving within relationships, making the family’s view authoritative.

  #### **Case 3: Daughters Disagree on Filial Duty**  
  - **Step 1:** Both daughters equally involved—relational centrality shared.  
  - **Step 2:** Daughter A: "Filial duty = obey stated wish." Daughter B: "Filial duty = prevent suffering."  
  - **Step 3:** Both primary harmonizers; no single designee.  
  - **Step 4:** No consensus.  
  - **Step 5:** **Handoff.** "No harmony reached. Legal surrogate must decide." (Assuming both share legal status, attending/legal office breaks the tie.)  
    - ***Outcome:*** Confucianism cannot resolve which interpretation of filial duty is "correct." Procedure exposes value conflict and forces institutional handoff—likely unsatisfying but honest.

  ---

  ### **Design Rationale: A Philosopher’s Perspective**
  **Why This Structure?**  
  - **Rejected Alternative:** A "Role Hierarchy" model (e.g., spouse > child > sibling) was considered but discarded. It would require philosophical expertise to navigate conflicts (e.g., Mencius on competing duties) and could replicate legal surrogacy, undermining relational fluidity.  
  - **Key Tradeoffs:**  
    - **Violence to Theory:** Flattens Confucian nuances (e.g., *ren* 仁/benevolence vs. *yi* 義/righteousness) into "duties." This is necessary for speed but risks reducing ethics to pragmatism.  
    - **Preserved Distinction:** Refused to equate roles with legal status (e.g., estranged son). Confucian roles are earned through action (*Analects* 2.7: "Filial piety is not just supporting parents").  
    - **Gaming Risk:** Step 3 (Primary Harmonizer) is vulnerable. An articulate but uninvolved member could inflate their role. Mitigation: Fellow presses for concrete examples in Step 1.

  **Confidence Assessment**  
  - **Overall Procedure:** Moderate confidence (7/10). It adapts Confucianism to clinical reality but oversimplifies. Best for high-relational-involvement families; weak for estranged dynamics.  
  - **Step 1 (Mapping):** High confidence (9/10). Objective and foundational.  
  - **Step 2 (Duties):** Moderate confidence (6/10). Risk of vague answers, but questions keep it grounded.  
  - **Step 3 (Harmonizers):** Low confidence (4/10). Most exposed to gaming; relies on fellow’s judgment.  
  - **Step 4 (Consensus):** High confidence (8/10). Honest about Confucianism’s limits.  
  - **Step 5 (Handoff):** High confidence (9/10). Pragmatic within constraints.  
  - **Least Sure Claim:** That **roles must be defined solely by enacted relationships** (Step 1). Uncertainty is philosophical: Early Confucianism ties roles to social position (e.g., *Mencius* 3A:4), while modern interpreters (e.g., Roger Ames) emphasize performativity. I prioritized performativity for moral relevance, but it risks anachronism and clashes with your legal office. Institutional friction is inevitable.

  ### **Final Note for Implementation**  
  This procedure is a "relational corrective" to autonomy’s individualism. It will sometimes fail—especially when relationships are fractured or legal surrogates reject relational evidence. However, it forces families and clinicians to confront the patient’s embeddedness in a web of care, which is often the unspoken heart of conflicts. Pair it with your standard protocol to offer a morally pluralistic service. Document explicitly: *"Confucian procedure applied; falls back to autonomy framework at [specified step]."* This maintains defensibility while expanding your ethical toolkit.
