  Third, error correlation across evaluators - I'll put this at 0.4 correlation. The shared methodologies and talent pools in effective altruism create herd thinking risks. Diversification helps less when errors are correlated.

  Fourth, repairability - I'm skeptical (0.3 probability) that simple corrections like haircuts can fix this. The deeper issue is that some impacts resist quantification altogether.

  Fifth, comparison class - this is crucial. Even flawed rankings likely outperform alternatives like unrestricted funding (0.7 probability) or democratic allocation (0.8). Their explicit framing as "compared to what" is wise.

  Three mechanisms they identified are astute:
  - Evidence capitalization (past funding inflates current estimates): 0.55 probability it meaningfully distorts
  - Measurement treadmill (gaming metrics): 0.65 probability
  - Auditability rent (arm's-length verification premium): 0.7 probability - this feels most pernicious

  For diagnostics: 
