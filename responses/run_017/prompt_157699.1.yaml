  - Perturbing error correlation moves headline credence most (from 0.4 to 0.65)
  - Their friend probably overweights error correlation and underweights comparison class
  - Ideal evidence? Randomize funding against rankings and track long-term institutional effects

  Throughout, I'll maintain their specified impartial welfarist view but note that non-welfarist ethics (like rights-based approaches) could significantly alter conclusions. The user's meta-awareness about "smuggling in value theory" is impressively rigorous.

