answer: |-
  ## The Illusory Escape: Prioritarianism and the Migratory Levelling-Down Objection

  Prioritarianism promises a compelling escape from the notorious levelling-down objection that plagues strict egalitarianism. By defining the value of an outcome solely as the sum of a strictly concave transformation of individual well-being – weighting gains to the worse-off more heavily – it guarantees that no outcome can be judged better *merely* because the better-off are made worse off without any compensating benefit. It seemingly preserves the intuition that benefiting the worst-off is crucial while avoiding the absurdity of endorsing pure, detrimental levelling. However, the introduction of choice under uncertainty, particularly in cases like the Ada and Bella scenario, reveals this escape as largely cosmetic. The levelling-down objection does not vanish; it migrates, resurfacing as a conflict with ex ante Pareto principles, and forces prioritarianism into an uncomfortable dilemma: either abandon a core tenet of rational individual decision-making under risk or fundamentally dilute its motivating concern for the actual worst-off.

  The Ada/Bella case starkly illuminates the tension. Under certainty, prioritarianism would unambiguously prefer transferring resources from someone at 130 to someone at 10 (raising the latter to 60, lowering the former to 60) because the gain to the worse-off (50 units) counts more heavily due to concavity than the loss to the better-off (70 units). This aligns perfectly with its rationale. However, under the risky option R (coin flip for 130 or 10), each person faces an *identical* prospect: a 50% chance of 130 and a 50% chance of 10, yielding an expected well-being of 70. This dominates the safe option S (60 for sure) in terms of individual expectation and total well-being in every possible state (140 vs. 120). Crucially, the *distribution* of outcomes is fixed: one at 130, one at 10, regardless of the coin toss. Prioritarianism, applying its concave transformation (e.g., square root) to *realized* well-being, calculates the value of S as √60 + √60 ≈ 15.49. The value of R, however, is the *expected value* of the sum: 0.5*(√130 + √10) + 0.5*(√10 + √130) = 0.5*(11.40 + 3.16) * 2 ≈ 14.56. S wins, despite lower expected well-being for each and lower total well-being.

  Is this preference for S over R a form of levelling-down? Superficially, no. No one is made determinately worse off to reduce a gap. S does not involve dragging down the better-off; it involves declining a risky prospect that offers higher expected well-being to everyone. The "levelling" here is probabilistic: the option preferred avoids the *possibility* of someone being very badly off (10), even though it also avoids the possibility of someone being very well off (130), and even though *everyone ex ante* prefers the gamble offering the chance to be very well off and only risks being very badly off (assuming self-interested, risk-neutral or slightly risk-averse individuals maximizing expected well-being). The mechanism differs: rather than actively harming someone to reduce inequality, prioritarianism rejects a prospect that creates *ex post* inequality with a very low outcome, even when that prospect is *ex ante* beneficial to all.

  However, the *underlying normative complaint* driving the levelling-down objection – that a theory sacrifices aggregate or individual good for the sake of a pattern (here, avoiding extreme low outcomes, which is the flip side of avoiding large inequality) – reappears forcefully. Prioritarians must reject **ex ante Pareto superiority**: the principle that if one option gives every single person a higher expectation of well-being than another, the first option cannot be worse. R gives both Ada and Bella an expected well-being of 70, while S gives only 60. Yet prioritarianism deems S better. To defend this, prioritarians must argue that ex ante Pareto is normatively unsound in this context. Several arguments might be marshalled:

  1.  **The Primacy of the Actual Outcome:** Prioritarians might argue that the concave transformation reflects the intrinsic moral weight of *actual* well-being levels. The person who *actually* ends up at 10 suffers a drastic loss that swamps the gains of the person at 130, regardless of the ex ante probabilities. The "view from nowhere" evaluating the realized distribution trumps the ex ante individual perspectives. Expected well-being, they might claim, is not the true currency of a person's good for the purposes of moral aggregation; only realized well-being matters. The coin flip creates a situation where someone *will* definitively be very badly off, and that concrete suffering is what the view prioritizes, even if no one knew in advance who it would be.
  2.  **Non-Identity of the Beneficiary:** Relatedly, they might argue that ex ante Pareto comparisons are misleading when the beneficiaries of the risk are indeterminate. Under R, while *someone* gets 130 and *someone* gets 10, it's not fixed *who* beforehand. The principle applies when we know *which* specific individuals are benefited or harmed; here, the uncertainty breaks the direct comparison for each identifiable person across the two options.
  3.  **Risk as Creating Distinct Moral Harms:** They might contend that imposing a risk of a very low outcome (10) on a person is itself a disvalue, captured by the concavity applied ex post, which outweighs the benefit of the chance of a high outcome (130), even when the expectation is positive. The potential for catastrophic loss carries moral weight beyond its contribution to expected utility.

  While these arguments have some force, rejecting ex ante Pareto is a significant cost. It pits prioritarianism against a fundamental principle of rational individual choice under uncertainty. If both Ada and Bella, presented with the choice individually, would rationally prefer R over S (aiming to maximize their own expected well-being), it seems perverse for a moral theory concerned with individual well-being to declare S the *better* social choice. This creates a direct conflict between the moral evaluation and the informed preferences of the individuals concerned.

  Faced with this conflict, prioritarians might instead embrace **ex ante prioritarianism**. This variant applies the concave transformation to each individual's *expected well-being* and sums the results. For S: g(60) + g(60). For R: g(70) + g(70). Assuming g is strictly concave, g(70) > g(60), so R is strictly preferred. This version satisfies ex ante Pareto: since R gives higher expected well-being to each, and g is increasing, g(70) > g(60) for each, so the sum is higher. It also avoids the problematic ranking in the Ada/Bella case, favouring the option with higher individual expectations and higher total well-being.

  However, this move fundamentally severs prioritarianism from its core motivation: giving priority to the *actually* worst-off. Ex ante prioritarianism is indifferent between option R (risky 130/10) and a *sure* outcome where both get 70. Yet, intuitively, a prioritarian should find the sure 70 vastly superior to the risky R. In the sure 70 outcome, no one suffers the terrible fate of ending up at 10. The person who actually ends up at 10 in R has a compelling claim that ex ante prioritarianism completely ignores. By transforming expectations, this variant loses its grip on the distribution of *realized* well-being, which was the original impetus for introducing concavity. It prioritizes those with low *expected* prospects, not those who end up badly off. While avoiding the conflict with ex ante Pareto, ex ante prioritarianism sacrifices the essence of the view, rendering it unable to distinguish between a safe middling outcome and a gamble with potentially catastrophic consequences for one individual – a distinction that lies at the heart of the prioritarian concern.

  Could an intermediate view reconcile these concerns? One might propose **ex post prioritarianism with an independent risk-aversion component**. This would sum the transformed realized well-being levels (capturing priority for the worst-off) *plus* a term reflecting overall risk aversion (e.g., based on the variance of well-being or the expected transformed sum itself). This might prefer S to R (due to the risk of a very low outcome), while also preferring the sure 70 to both (due to higher expected transformed sum and lower risk). However, this hybrid view abandons the purity and claimed parsimony of standard prioritarianism. It reintroduces an explicit concern for the *distribution* of risk and potentially for equality of outcomes as a separate factor (via risk aversion over the distribution). Furthermore, it faces challenges in weighting the priority component against the risk component and may lead to time-inconsistency or other decision-theoretic problems.

  **Conclusion: The Cosmetic Escape and the Migration of the Objection**

  Prioritarianism's purported escape from the levelling-down objection is ultimately cosmetic. While it successfully avoids endorsing outcomes where people are *determinately made worse off* solely to reduce inequality, the core concern underlying the objection – that the theory sacrifices aggregate or expected individual good for the sake of a distributional pattern – re-emerges forcefully under conditions of uncertainty. The Ada/Bella case demonstrates this migration: prioritarianism sacrifices the higher expected well-being of *each* individual and higher total well-being in every state to avoid the *ex post* outcome where one person is very badly off (and inequality is high).

  To maintain this verdict, prioritarians must reject **ex ante Pareto superiority**. They must argue that the moral imperative to avoid someone *actually* ending up at a very low level, captured by applying the concave transformation to realized well-being, overrides the fact that the risky option offered *everyone* a better prospect beforehand. While philosophically defensible, this rejection imposes a significant cost, creating a conflict between the moral evaluation and the rational preferences of the individuals involved. The alternative – embracing **ex ante prioritarianism** – preserves ex ante Pareto but at the even higher cost of abandoning the view's motivating focus on the *actually* worst-off, rendering it insensitive to the crucial distinction between a guaranteed decent life and a gamble that ruins one person's life while greatly benefiting another.

  Therefore, the levelling-down objection does not disappear; it transforms. It reveals that prioritarianism's avoidance of the objection in deterministic cases comes at the price of potential conflict with rational individual choice under uncertainty. The objection migrates from targeting direct harm for equality's sake to targeting the rejection of mutually beneficial risks due to the potential for severe *ex post* disadvantage. Prioritarianism survives only by choosing which fundamental intuition to sacrifice: either the rationality of individual risk-taking when aggregated (ex ante Pareto) or the primacy of helping those who actually end up worst off. This dilemma suggests that the initial escape was less a triumph of design than a shifting of the battleground, exposing a deeper tension within the attempt to prioritize the worst-off through aggregation alone. The spirit of the levelling-down objection – the unease with sacrificing tangible benefits for distributional ideals – persists, proving remarkably adaptable to new philosophical terrain.
