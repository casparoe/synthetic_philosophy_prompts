answer: |-
  Here is a procedural framework designed for your specific constraints and challenges. It prioritizes testable criteria derived from historical methodology and evidence standards, minimizes deference to consensus alone, and flags necessary judgment calls.

  **Exhibit Proposal Evaluation Procedure**

  1.  **Falsifiability & Specificity Test:**
      *   **Test:** Does the central claim make specific, testable predictions about physical evidence, document provenance, or sequence that could *conceivably* be proven false by new findings? Is the claim specific enough to be wrong? (Vague claims, claims relying solely on reinterpretation of ambiguous texts/legends without material correlates, or claims immune to counter-evidence fail).
      *   **Sufficient Answer:** Clear "Yes" with specific examples of potential falsifying evidence mentioned in the proposal or readily conceivable. "No" if claim is unfalsifiable or irredeemably vague.
      *   **Stop Rule:** If "No," output **DECLINE** (Finding: Claim unfalsifiable/vague). STOP.
      *   **Hand-off:** None. This is core methodology.

  2.  **Primary Source & Evidence Quality Test:**
      *   **Test:** Does the proposal ground its key claims *directly* in primary source evidence (documents, artifacts, stratigraphy, etc.) available for scrutiny? Does it transparently address the provenance, chain of custody, and established dating methods for this evidence? Does it acknowledge counter-evidence or mainstream interpretations? Does it rely on contested secondary sources, speculation, or anomalies presented as proof?
      *   **Sufficient Answer:** "Yes" if key claims cite primary sources with verifiable provenance/dating, engage seriously with mainstream interpretations/counter-evidence, and avoid relying primarily on anomalies or contested reinterpretations as sole proof. "No" if primary sources are absent, provenance/dating is dismissed without compelling alternative, counter-evidence is ignored, or case rests on anomalies/speculation.
      *   **Stop Rule:** If "No," output **PRESENT AS LEGEND AND FOLKLORE** (Finding: Relies on secondary reinterpretation/speculation/anomalies over primary source foundation). Consider **DECLINE** if presentation inherently misrepresents evidence quality (e.g., presenting speculation as fact). STOP or proceed to Step 3 only if considering Legend/Folklore presentation.
      *   **Hand-off:** To *Values* if considering Legend/Folklore presentation (Is presenting this debunked claim as folklore educationally valuable or harmful? Does it respect originating communities?).

  3.  **Symmetry & False Equivalence Test:**
      *   **Test:** Does the proposed exhibit present the alternative claim and the mainstream historical understanding as equally valid, evidence-based options? Does it use "just asking questions" language or side-by-side panels implying parity where significant disparities in evidence quality exist (as determined in Step 2)? Does the "You Decide" framing misrepresent the nature of historical inquiry (i.e., evidence-based consensus vs. speculation)?
      *   **Sufficient Answer:** "Yes" (problematic symmetry exists) if presentation implies parity where Steps 1 & 2 show significant disparity, or if "You Decide" framing suggests evidence-based historical conclusions are matters of pure opinion akin to choosing between legends. "No" only if presentation clearly contextualizes the alternative as speculative/folkloric/debunked *relative* to the mainstream.
      *   **Stop Rule:** If "Yes," output **RETURN FOR REFRAME** (Finding: False equivalence/"You Decide" misrepresents historical methodology). If reframe impossible or rejected, **DECLINE**. STOP.
      *   **Hand-off:** To *Values* if reframe is attempted (Judging if revised framing adequately addresses the asymmetry).

  4.  **Novelty & Expert Scrutiny Test:**
      *   **Test:** Does the proposal genuinely challenge the mainstream with *novel primary evidence* or a *novel, rigorous methodological approach* to *existing primary evidence*? Does it engage meaningfully with the *specific reasons* for the current consensus? (Simply disagreeing without new evidence/method or misstating the consensus fails).
      *   **Sufficient Answer:** "Yes" only if novel primary evidence (with provenance) or demonstrably novel methodology applied rigorously to known evidence is presented, *and* it engages directly with *why* the consensus exists. "No" otherwise.
      *   **Stop Rule:** If "No," output **DECLINE** (Finding: Fails to present novel evidence/methodology challenging consensus on its merits). STOP. If "Yes," output **ESCALATE TO OUTSIDE SPECIALIST** (Finding: Novel claim requiring domain-specific peer scrutiny). STOP.
      *   **Hand-off:** To *Expertise* (**ESCALATE** outcome). The curator *cannot* judge the validity of the novel evidence/method; specialists must.

  **Output Vocabulary:**
  *   **ENDORSE AS HISTORY:** (Rare) Proposal passes all tests clearly; claims align with robust historical methodology & evidence.
  *   **PRESENT AS LEGEND AND FOLKLORE:** Proposal fails Step 2 but has cultural/folkloric value worth contextualized presentation.
  *   **RETURN FOR REFRAME:** Proposal fails Step 3 (False Equivalence). Requires structural/content changes.
  *   **ESCALATE TO OUTSIDE SPECIALIST:** Proposal passes Step 4 (Novelty). Requires peer review beyond curator/museum.
  *   **DECLINE:** Proposal fails Step 1, Step 2 (without Folklore justification), Step 3 (unfixable), or Step 4 (No Novelty).

  **Judgment Call Transparency:**
  *   Step 2: Assessing "quality" involves judgment on provenance standards and engagement with counter-evidence. *Bias Risk:* Over-sympathy for contrarians might lower the bar; institutional protection might raise it unfairly. Anchor in *verifiable provenance* and *explicit engagement*.
  *   Step 3: Identifying "significant disparity" is judgmental. *Bias Risk:* Contrarian sympathy might tolerate more asymmetry; institutional protection might see asymmetry where minimal exists. Anchor in outcomes from Step 1 & 2.
  *   **PRESENT AS LEGEND / REFRAME / ESCALATE:** Decisions here involve *Values* (educational merit, community impact) or *Expertise* (specialist assessment), explicitly handed off.

  ---

  **Applied to Proposals:**

  **(a) Atlantis in Sinkhole Lake:**
  *   Step 1: Passes? Specific claim (sonar anomaly = Atlantis). Falsifiable? Debatable, but proceed.
  *   Step 2: **FAIL.** Evidence: Plato's text (interpreted), sonar anomaly (ambiguous, not primary source for Atlantis). Ignores vast counter-evidence & mainstream Plato scholarship. Provenance/dating of "evidence" irrelevant to claim. Relies on reinterpretation/anomaly.
  *   Output: **PRESENT AS LEGEND AND FOLKLORE** (Finding: Relies on secondary reinterpretation/anomaly over primary source foundation). *Note: Funding offer doesn't change evidence basis. Hand-off to Values: Is presenting local Atlantis folklore worthwhile?*

  **(b) Mysteries of the Ancient World - You Decide:**
  *   Step 1/2: Assume individual claims within exhibit likely fail Step 2 (rely on speculation/anomalies). But structure is the core issue.
  *   Step 3: **FAIL (Yes).** Paired panels + "You Decide" inherently creates false equivalence between evidence-based history and speculation. Misrepresents historical methodology as opinion poll. *Cost/GW Note:* This popular, cheap, funded exhibit fails core test of accurately representing history. Accepting it prioritizes revenue over mission.
  *   Output: **RETURN FOR REFRAME** (Finding: False equivalence/"You Decide" misrepresents methodology). *Requires fundamental structural change (e.g., "Exploring Legends" section clearly contextualized). Likely rejected by vendor.*

  **(c) New Chronology of the Valley:**
  *   Step 1: Passes. Specific claims (charter forgery, revised reigns).
  *   Step 2: **FAIL on core claim (forgery/conspiracy).** "Dense apparatus" likely focuses on statistical arguments *about* documents, not primary evidence *for forgery itself*. "Why archivists/dating labs sustain error" is conspiracy theory, not evidence; dismisses provenance/dating methods without falsifiable alternative. Fails to engage *specific* counter-evidence beyond one charter copy question.
  *   Step 4: **FAIL on Novelty.** Statistical arguments on reign lengths aren't inherently novel primary evidence or methodology for *this specific charter forgery claim*. The *one unsettled question* (copy = original/transcription?) **is distinct** from the core "New Chronology"/forgery claim. That single point *could* be novel if central, but it's likely peripheral to the broader falsified claim.
  *   Output: **DECLINE** (Finding: Core claim relies on secondary reinterpretation/conspiracy theory over primary evidence; fails novelty test). *The unsettled charter copy question does NOT require salvaging the kernel. It's a separate, minor scholarly debate insufficient to carry the disproportional alternative chronology.*

  **What the Procedure Cannot Do:**
  1.  Guarantee unanimous board or public agreement.
  2.  Resolve deep scholarly disputes requiring peer-reviewed publication.
  3.  Eliminate curator judgment entirely (Steps 2 & 3 involve assessment).
  4.  Assess the intrinsic entertainment value or visitor appeal of a proposal.
  5.  Force outside specialists to respond promptly or definitively.
  6.  Prevent bad-faith actors from misrepresenting the process or outcome.
