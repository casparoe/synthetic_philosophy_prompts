prompt: |-
  Hey — I need a teaching plan, not an explanation of Smith himself (I've read the chapters, I don't need them summarized). I'm running a fifty-minute discussion section next week for first-years in an intro ethics course. They've just come out of Mill and then Kant's formula of universal law, and the reading is a couple of chapters from Smith's Theory of Moral Sentiments on sympathy and the impartial spectator. I ran this section last year and it went badly: everyone walked out convinced Smith was basically a vaguer, kinder rule-utilitarian with a bit of interior monologue bolted on, one student said "so the impartial spectator is just your conscience" and I flubbed the answer, and by the end the only thing that had landed was that Smith is the capitalism guy. So: what has to come first and what depends on what — I'm guessing that sympathy as imaginative projection of someone's *situation* (rather than catching their feeling) has to be in place before propriety, and propriety before the spectator, and that the bit about general rules has to come *after* the spectator rather than before, but I'm not confident about the order or about what to leave for last.

  Two things I want built in, and I want you to tell me if either is a mistake. First, I want to teach the spectator as the destination of a loop rather than as a little person in your head: you notice you're partial, you imagine a well-informed bystander, you notice that you've rigged *that* bystander in your favour too, you imagine someone watching him, and the impartial spectator is what the sequence settles toward — the thing the recursion converges on. I like it because it explains why the spectator isn't just "what my actual peers think" without me having to dodge the relativism objection with a hand-wave, but I don't know where the framing breaks or whether it smuggles in something Smith doesn't want. Second, the hard bit as I see it is that Smith's question is about whether a passion is *proportionate* to what provoked it — the volume of the sentiment, not the rightness of the act — and I need one metaphor to carry that. I've been toying with photographic exposure versus a volume knob versus tuning an instrument; tell me which one to build the section around, what that metaphor has to have and what it must not have (I worry exposure implies a single correct setting and the knob implies more is just more), and give me the one concrete case to hang it on. I was thinking of something where the action isn't clearly wrong — someone getting visibly, disproportionately angry at a friend who turned up forty minutes late, at a table where everyone else is laughing it off — but say if a case about *resentment at a slight* is the wrong choice, and why.

  Then the misconception map, with a place in the sequence for each: the spectator as conscience; the spectator as Kant re-labelled or as Mill's impartial benevolent spectator, given that they've just had both and that all three words start with "impartial"; sympathy read as empathy or as pity/benevolence; the collapse into "morality is just what the people around you would think"; and whatever they'll form from the metaphor I use. Also: should I raise at all, at this level, whether the spectator is merely a well-informed ordinary person or something more idealized — and if not, what should I openly refuse to explain and say out loud that I'm refusing? Finally, a check: one question or task I can put to them in the last five minutes that would show they've got the structure rather than just being agreeable or just uncomfortable — ideally something that separates the spectator from the average opinion of their friends and from a rule, and something that would let me tell the difference between a student who understands it and one who has only learned to say "it depends on propriety". I'm not asking for extra readings, just the arc.
reasoning: |-
  Okay, the user is a teaching assistant preparing for a 50-minute ethics discussion section on Adam Smith's Theory of Moral Sentiments. They've had a bad experience last year where students misunderstood Smith as a vague rule-utilitarian with a "conscience" concept, reducing him to just "the capitalism guy." They need a clear teaching plan that structures Smith's concepts properly: sympathy as imaginative projection of situations, propriety, and the impartial spectator. The user has specific requests: framing the spectator as a recursive loop rather than an inner person, finding a metaphor for proportionate passions, and addressing common misconceptions.

  First, I need to ensure the sequence of concepts is correct. The user suspects sympathy must come before propriety, which precedes the spectator, with general rules coming last. That makes sense. Smith starts with sympathy as understanding others' situations through imagination. Then, propriety judges if emotional responses fit the context. The spectator emerges as a tool to correct personal bias. General rules are derived from repeated spectator judgments, so they should come after. I should confirm this order to avoid past mistakes.

  The user wants two key elements in the plan. First, the impartial spectator as a recursive loop. Students might think of it as a static conscience, but Smith describes it as a process: you imagine a bystander, realize they're biased, then imagine someone judging them, converging on impartiality. This addresses relativism because the spectator isn't just peers' opinions but a refined, objective standard. I need to check if Smith explicitly describes this recursion. In TMS, he discusses adjusting the spectator by considering how others view us, which implies a process. So this framing seems valid without smuggling in extra ideas.

  Second, the user needs a metaphor for proportionality of passions—like exposure, volume knob, or instrument tuning. The example given is disproportionate anger at a friend being late. The metaphor must show that the right response depends on context, avoiding implying a single correct answer. A volume knob might suggest louder is stronger, which isn't right. Exposure in photography has a "correct" setting, which oversimplifies. Instrument tuning fits best: each situation requires adjusting emotions like tuning strings to harmony, depending on the context (e.g., a casual dinner vs. a job interview). The case of someone overreacting to a friend's lateness is good because the propriety depends on circumstances—why they were late, the event's importance. This highlights proportionality without moral rightness.

  For misconceptions, I need to map where each arises and how to counter them. Sympathy as empathy or pity: clarify early that it's about projecting situations, not feeling what others feel. Spectator as conscience: use the recursive loop to show it's dynamic. Spectator as Kantian/Millian: contrast Smith's situated judgment vs. Kant's rules or Mill's utility. Collapse to peer opinion: emphasize the recursive process moves beyond actual peers. The metaphor might lead to seeing tuning as absolute, so stress context-dependence.

  Addressing whether the spectator is idealized: at the intro level, avoid deep metaphysics. Present it as well-informed and impartial but based on human psychology. Refuse to discuss if it's transcendental by stating it's beyond the scope.

  For the closing task: ask students to apply the spectator to a case where social norms conflict with proportionality. Example: resenting a minor slight in a culture where retaliation is expected. They should explain if the spectator would approve the resentment based on context, separating it from group opinion or rules. This tests understanding of proportionality and the spectator as a process.

  The user's deeper needs: they want students to grasp Smith's unique contributions beyond utilitarianism or deontology. They need to prevent reductive readings and highlight the procedural, context-sensitive nature of moral judgment. The plan must build concepts sequentially, using clear examples and metaphors, while actively debunking myths. The TA also needs confidence in their framing of the spectator and metaphor choice, so providing reassurance with textual basis is key.
answer: |-
  Here’s a battle-tested 50-minute plan focused on **conceptual sequencing** and **misconception prevention**, structured around your priorities. The goal is to make Smith’s *process* (not just his conclusions) impossible to miss.

  **Core Sequence (Non-Negotiable Order):**  
  1. **Sympathy as Situational Projection** → 2. **Propriety as Proportionality** → 3. **Impartial Spectator as Convergent Loop** → 4. **General Rules as Byproduct**  
  *(Your instincts are correct: reverse any of these and Smith collapses into Kant/Mill/relativism)*

  ---

  ### **The Plan (50 Mins)**  
  **Target Misconceptions:** Spectator = Conscience/Kant/Mill; Sympathy = Empathy; Morality = Peer Approval; Proportionality = Moral Rightness  

  #### **Opening (5 mins): The "What’s Weird" Hook**  
  - **Task:** "Smith says we approve/disapprove of others’ feelings based on whether we can *‘go along with them’* (TMS I.i.1.1). **Pair & Share:** What’s jarring about this? How is it *not* ‘was their action right/wrong?’ or ‘did I feel bad for them?’"  
  - *Goal:* Surface intuitions that sympathy ≠ benevolence/empathy and judgment ≠ act-evaluation. **Pivot to your key insight:** Smith cares about the *volume* of your anger/grief/joy, not (yet) the act’s morality.

  #### **I. Sympathy: Projection, Not Infection (10 mins)**  
  - **Metaphor:** **Tuning an instrument.**  
    - *Why it works:* Harmony depends on *relationship* (note vs. context), not volume (knob) or single correctness (exposure). A "C" is right *with other C’s* but dissonant in an E-minor chord.  
    - *What it avoids:* Implies no universal "right setting"; avoids "more=stronger" (knob) or "objective truth" (exposure).  
  - **Concrete Case:** **Your example works perfectly.**  
    - *Scenario:* Alex is *furious* at Sam, 40 mins late to a casual hangout. Group is chuckling.  
    - **Q1:** "Can you *‘bring yourselves along’* with Alex’s rage? Why/why not?"  
    - **Q2:** "What *situational details* would make Alex’s anger *proportionate*? (e.g., Sam caused Alex to miss a flight? It’s the 5th time?)"  
    - *Key Point:* Sympathy isn’t feeling Alex’s anger—it’s imagining *being Sam’s situation* (traffic? emergency?) and asking if *that situation* warrants *that much* anger. **Propriety emerges here.**

  #### **II. Propriety: The Proportionality Test (10 mins)**  
  - **Refine the Metaphor:** **"Is Alex’s anger *in tune* with Sam’s situation and the social context?"**  
    - *Crucial Nuance:* Propriety isn’t "is anger justified?" but "is *this intensity* of anger appropriate *given these strings* (context)?"  
  - **Deepen the Case:**  
    - **Q3:** "What if Alex is *stoically silent*? Is that ‘in tune’? Why might under-reaction also lack propriety?"  
    - **Q4:** "How would you feel if Alex *apologized* for overreacting? Why does Smith say we ‘enter into’ their moderation?"  
    - *Goal:* Cement that **propriety = passion/situation harmony**. *This is Smith’s unique lens.*

  #### **III. Impartial Spectator: The Recursive Loop (15 mins)**  
  - **Frame Exactly as You Want:** **"The spectator isn’t in your head—it’s where your *attempts* to be impartial *land*."**  
    - **Loop Visualization:**  
      - Step 1: I’m angry at Sam → I’m biased.  
      - Step 2: I imagine "what would a *reasonable person* watching this think?" → But I rig them ("Sam *always* does this!").  
      - Step 3: I imagine *another person* watching *that* biased spectator → **Recursion starts.**  
      - Step 4: The "impartial spectator" is the point where adding layers doesn’t change the judgment → **Convergence.**  
    - **Why this kills misconceptions:**  
      - ≠ Conscience (static inner voice) → It’s dynamic.  
      - ≠ Peer opinion → Starts with peers but *corrects* via recursion.  
      - ≠ Kant/Mill → Grounded in situated passions, not rules/utility.  
  - **Checkpoint Q:** "Why can’t Step 2 (the ‘reasonable’ bystander) be the final judge? Give an example of self-deception here."  

  #### **IV. General Rules & Misconception Triage (5 mins)**  
  - **Q:** "Smith says rules are ‘general maxims’ from repeated spectator judgments. **So—are rules *foundational* (Kant) or *derivative* (Smith)?"**  
  - **Actively Debunk:**  
    - "Why is ‘spectator = conscience’ wrong?" → Conscience doesn’t require recursive bias-checking.  
    - "Why is this *not* Mill?" → Mill’s spectator aggregates utility; Smith’s calibrates passion-propriety.  
    - "Why not relativism?" → The loop *transcends* current peers via recursive correction.  
  - **Your Refusal (State Clearly):** "Is the spectator *idealized* or just *informed*? Smith is fuzzy; today, we treat it as the *limit* of trying to be impartial—not God, not StatsBot 3000."  

  #### **Closing Task: The Acid Test (5 mins)**  
  - **Prompt:** "You resent a colleague’s *minor* condescension. Your friends say ‘screw them—fight back!’ **Using Smith:** How would the impartial spectator process this? What might propriety require? *Why is this different from ‘what my friends think’ or ‘is condescension wrong’?*"  
  - **Why it works:**  
    - Tests if they prioritize *proportionality* (minor slight → minor resentment?) over act-judgment.  
    - Forces distinction between actual peers (pro-retaliation) and spectator (propriety-focused).  
    - Reveals if they invoke the *loop* ("I’d check if my imagined bystander is biased toward my pride...").  
    - Surface-level answers will say "depends"; strong answers will *use the recursion* to show *why* it depends.  

  ---

  ### **Why This Sequence Works**  
  - **Sympathy first** prevents empathy/benevolence confusion.  
  - **Propriety before spectator** ensures they see the *problem* (partiality) the spectator *solves*.  
  - **Spectator as loop** blocks conscience/Kant/Mill assimilations.  
  - **Rules last** avoids rule-utilitarian misreadings.  
  - **Your metaphor (tuning)** locks in proportionality and context-dependence without smuggling absolutism.  
  - **The case (anger at lateness)** isolates passion-judgment from act-judgment—which is the point.  

  **Stick the Landing:** End by contrasting Smith with last week’s thinkers: "Kant gives a test for maxims; Mill calculates outcomes; Smith trains us to *calibrate our reactions*. Different project." This prevents the "capitalism guy" reduction by highlighting his moral psychology.  

  You’ve got this—your recursion insight is gold and textually defensible (TMS III.1-3). Smith *is* that procedural.
