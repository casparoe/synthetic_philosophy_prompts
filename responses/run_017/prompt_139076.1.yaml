prompt: |-
  I chair the serious-harm review panel for a hospital network. We sit fortnightly, we review roughly forty cases a year, and our findings are read by the board, by patients' families, and occasionally by a coroner, so a finding that someone's failure to act caused a death can end a career, and a finding that it did not can end a claim. The panel is three clinicians and one lay member, none of us with any training in philosophy; we have ninety minutes per case and no budget for outside experts or library access.

  Around two thirds of what we review is harm that nobody brought about by acting: a chart not reviewed, a deteriorating patient not escalated, a defibrillator not checked, a drug not reordered, a result not chased. We have no principled way to say when one of these absences is part of the causal history of the outcome and when it is merely a sad fact about the background against which the outcome happened. We currently improvise something close to a but-for test, and it keeps giving us answers we cannot defend: it returns causation wherever a hundred people each failed to do the same thing, it returns causation where the omitted act would have been too late or too weak to help, and it returns nothing at all when the failure belongs to no one in particular.

  Write me a decision procedure my panel could actually run, in order, with the following properties.

  It should open with the questions to ask in sequence, what will count as an adequate answer to each, and where the procedure terminates early with a negative finding. It should use a small fixed vocabulary of verdicts — I would suggest four, along the lines of causal omission by a named agent, causal omission not attributable to any individual, breach without causal contribution, and no omission — each defined tightly enough that two panels would not disagree about which applies, and each with a note on what follows from it in our report: recording, referral, sanction, or nothing.

  The procedure must include a specification rule for the counterfactual comparison, since this is where our arguments actually happen. Say explicitly what is to be held fixed when we ask what would have happened had the act been performed: other people's failures, the patient's underlying condition, what the same agent would have done next, the state of equipment. Require the panel to write the "would have" scenario as a short paragraph, say what to do when the panel cannot agree on it, and say what to do when the omitted act only had a chance of averting the harm — a thirty per cent chance of rescue, say — including whether the procedure adopts a threshold or refuses to.

  It should handle five patterns that account for most of our disputes, and for each it must say what it returns and where it stops:

  the latent omission — an omission that does nothing on its own and matters only because a safeguard downstream also failed;
  the shadowed omission — the same act was incumbent on someone else, or on an automated check, who also did not perform it, so that no single absence made the difference;
  the unadopted duty — the omission is a breach of a written protocol that nobody in that unit had ever realistically followed, so that on the unit's actual practice there was nothing to omit;
  the derived omission — the agent's failure is itself the product of a failure upstream, in rostering, training, supply or maintenance, so the causal question can always be pushed back one step, and then another;
  the vacant role — the duty attached to a post that was unfilled that shift, so there is an omission with no omitter.

  Give us a stopping rule for tracing derived omissions backwards, a causal horizon, since without one every one of our findings turns into a finding about a staffing decision made years ago by someone who has left.

  Mark every point at which the question before the panel is really one of values rather than fact — who may fairly be blamed, what we owe a family, whether a sanction is proportionate — and state plainly that the procedure is silent there and hands the decision to a person. Keep the whole thing to two sides of A4; it has to be usable in the room by people who have never read any of this literature and, since we cannot look anything up, nothing in it may depend on our knowing one.

  Then run it on three of our cases, as an appendix. First: a patient's observations crossed the escalation threshold at two in the morning and the nurse did not call the outreach team, expecting, in line with the unit's actual practice, that the night coordinator would review the charts at four; the coordinator was diverted to another emergency and did not; the patient arrested at half past five, and review at four would probably have prevented it. Second: a drug needed in resuscitating anaphylaxis was not reordered when stock fell three weeks earlier; three people had authority to order it and each assumed another had; two usable substitutes were in the building, neither in the resus trolley and neither named in the protocol; the patient died. Third: a junior doctor was the sole doctor covering two wards overnight after being told the second ward was staffed; a review assigned to her by protocol did not happen and a patient in that ward died; the rota that left her covering both had been signed off eleven months earlier by a manager who has since left.

  At least one of these must come out in a way my panel will not like, and I want you to say so without softening it: give the verdict the procedure returns, show the steps, and tell us why we will find it unwelcome. Close by stating what the procedure cannot do — the questions it has no resources to settle, the cases in which its verdicts are artefacts of how we specified the counterfactual, and the ways in which writing it down will change the answers we give.
reasoning: |-
  We are constructing a decision procedure for a serious-harm review panel that must handle cases of omission (failures to act). The procedure must be practical, with clear steps, a fixed set of verdicts, and handle common patterns of dispute.

  Verdicts (4 types):
  1. Causal omission by a named agent (CO-NA): An individual's failure to act was a cause of the harm.
     - Report: Record the finding, refer for disciplinary action if warranted, and note the causal link for the family/coroner.
  2. Causal omission not attributable to any individual (CO-NI): The failure was causal but cannot be pinned on one person (e.g., systemic failure, multiple people equally responsible).
     - Report: Record the finding, recommend systemic changes, no individual sanction but may lead to management review.
  3. Breach without causal contribution (B): There was a failure to act (breach of duty) but it did not cause the harm (e.g., the act would not have prevented the harm).
     - Report: Record the breach, but note it did not cause the harm. May lead to retraining or protocol review, but no sanction for causing harm.
  4. No omission (NO): There was no duty to act in the circumstances, or the act was not omitted in a meaningful sense (e.g., because the duty was not realistically part of practice).
     - Report: No breach, no causation. Nothing follows in terms of sanction or referral.

  Decision Procedure Steps:

  1. Identify the alleged omission and the agent(s) involved.
     - If there is no identifiable agent (e.g., vacant role) and no one was assigned the duty, go to step 4.
     - If the duty was not incumbent on anyone (e.g., unadopted duty), then verdict is NO (stop).
     - Otherwise, proceed.

  2. Determine if there was a breach of duty.
     - Was there a duty (written or reasonably expected) for the agent to perform the act in the circumstances?
     - If no, verdict NO (stop).
     - If yes, but the duty was not part of the unit's actual practice (unadopted duty) and no reasonable expectation of compliance, then verdict NO (stop). Otherwise, there is a breach.

  3. Causal analysis: Counterfactual specification.
     - We must construct a counterfactual scenario: what would have happened if the act had been performed?
     - What to hold fixed:
       - The patient's underlying condition at the time of the omission.
       - The state of equipment and resources (unless the omitted act was to change them).
       - Other people's actions and omissions that are not part of the same causal chain (i.e., independent failures are held fixed). However, if the omission is part of a chain (e.g., latent omission), then we do not hold fixed the downstream failures that are the immediate cause (see step 3b).
       - What the same agent would have done next? We hold fixed the agent's other actions that are independent, but if the omitted act would have changed what the agent did next, we allow that to change.
     - Write a short paragraph describing the counterfactual scenario.

     - If the panel cannot agree on the counterfactual scenario, they must vote (majority rules) and note the disagreement in the report.

  4. Counterfactual assessment:
     - Would the harm have been averted? (i.e., but-for the omission, would the harm have been prevented?)
       - If yes, and the chance of prevention was 100%, then proceed to step 5.
       - If the omitted act had only a chance of preventing the harm (e.g., 30%), then we adopt a threshold: if the chance was 50% or greater, we treat it as causal (for the purposes of this procedure). If less than 50%, then it is not considered a cause (verdict B: breach without causation). [Note: This is a policy choice. We use 50% as a bright line for practicality.]

  5. Assigning responsibility for the omission:
     - If the omission was by a named individual (or individuals who can be identified), then:
          - If the omission was caused by a failure upstream (derived omission), then we must decide how far back to go. Apply the stopping rule: trace back only one step (to the immediate cause of the omission) unless that cause is itself an omission by someone else in the same event chain. We stop at the first human agent who had the duty and the capacity to act and whose omission was not itself caused by a prior omission in the same chain (i.e., we do not go back years). If the upstream cause is a system issue (e.g., staffing level set by a manager who left), then we stop at the agent who was supposed to act in the immediate situation and also note the system failure (but the verdict for the immediate agent may be CO-NA, and the system issue is recorded as a contributing factor for CO-NI in a separate verdict if necessary). However, if the immediate agent had no reasonable ability to act because of the upstream failure (e.g., vacant role, inadequate training), then the immediate agent may not be at fault (verdict might be CO-NI or even NO for the immediate agent, and we might have a separate finding for the upstream).

     - Patterns:
          a. Latent omission: The omission (e.g., not checking a chart) only becomes harmful because a downstream safeguard also failed (e.g., the coordinator did not review). In the counterfactual, we do not hold fixed the downstream failure because it is part of the same causal chain. So if the act had been done (e.g., the nurse called the outreach), then the harm would have been prevented? If yes, then the nurse's omission is causal (CO-NA). The coordinator's omission is also causal? But we are considering one omission at a time. We might have two causal omissions.

          b. Shadowed omission: Multiple agents (or an automated system) had the same duty and all failed. Then no single omission is but-for (because even if one had acted, the others might not have, and the harm would still have occurred? Not necessarily: if one had acted, the harm might have been prevented). We must do the counterfactual: if one agent had acted, would the harm have been prevented? If yes, then that agent's omission is causal (CO-NA). But if the harm would have been prevented only if all had acted (which is not the case) or if the chance of prevention by one agent acting is less than 50%, then we might have to say that no one individual's omission was causal (but the collective failure was). Then verdict CO-NI.

          c. Unadopted duty: The protocol existed but was not followed in practice. We already handled this in step 2: if the duty was not part of actual practice and there was no reasonable expectation of compliance, then NO.

          d. Derived omission: The agent's failure was due to an upstream failure (e.g., rostering). We stop at the immediate agent unless the upstream failure was so overwhelming that the immediate agent had no real ability to act (then we might assign to the upstream). But our stopping rule: we do not go beyond one step if the immediate agent had the duty and the capacity to act (even if with difficulty). If the immediate agent could have acted but didn't, then that agent is at fault (CO-NA) and we note the upstream as a contributing factor. If the immediate agent could not have acted (e.g., because of the upstream failure) then we assign to the upstream agent (if identifiable) or CO-NI.

          e. Vacant role: The duty was assigned to a role that was vacant. Then there is no named agent. The omission is systemic. Verdict CO-NI.

  6. Verdict:
     - If the breach caused the harm (by the counterfactual) and we can attribute it to a named agent: CO-NA.
     - If the breach caused the harm but we cannot attribute it to one agent (e.g., shadowed omission with no single agent making the difference, or vacant role): CO-NI.
     - If there was a breach but it did not cause the harm (by counterfactual): B.
     - If no breach: NO.

  Handling the five patterns explicitly in the procedure:

  - Latent omission: In the counterfactual, we assume the act is done and then ask if the harm would have been prevented. We do not hold fixed the downstream failure because that failure is contingent on the initial omission (or independent? We must specify). We treat the downstream failure as part of the scenario that might be altered by the initial act. However, if the downstream failure is independent (e.g., an unrelated emergency) then we hold it fixed? Our rule: we hold fixed only independent events. If the downstream failure is part of the same system (e.g., the coordinator's review is the next step) then we do not hold it fixed; we assume the coordinator would have acted as usual if the call had been made? Actually, we are considering the counterfactual of the act being done, so if the act would have triggered the coordinator to act, then the harm would have been prevented. So the nurse's omission is causal.

  - Shadowed omission: We consider each agent individually. For each, we ask: if that agent had acted, would the harm have been prevented? If the answer is yes (with probability>=50%), then that agent's omission is causal (CO-NA). But if the harm would only have been prevented if all agents had acted, then no single agent's action would have sufficed, so we cannot assign to an individual (CO-NI). However, note that in the drug reordering example: if one agent had ordered the drug, then the stock would have been available, so that one act would have sufficed. Then each agent's omission is causal? But that leads to overdetermination. We must be careful: the counterfactual for one agent acting is that the drug is available. Then the harm would have been prevented. So each agent's omission is a cause? But we don't want to blame everyone if only one needed to act. The procedure: if the counterfactual for one agent acting leads to prevention, then that agent's omission is causal. But note: if we have multiple agents and we are considering each one, we might assign CO-NA to each one. However, that may be too harsh. Alternatively, we might say that each is a cause, but we report each one. But the procedure allows for CO-NA for each named agent.

  - Unadopted duty: Already handled in step 2.

  - Derived omission: We assign to the immediate agent if they had a duty and the capacity to act. We do not go further back unless the immediate agent was completely unable to act because of the upstream failure. Then we assign to the upstream agent (if identifiable) or to CO-NI.

  - Vacant role: Verdict CO-NI.

  Stopping rule for derived omissions: We stop at the first human agent in the chain who had the duty and the capacity to act (even if that capacity was impaired by the upstream failure, unless the impairment was so severe that they had no real choice). We do not go back further than one step (i.e., we do not look for the cause of the cause).

  Value judgments: The procedure will flag when we must make a value judgment:
     - Step 2: Deciding whether a duty was "reasonably expected" might involve values (what is reasonable?).
     - Step 3: When we specify the counterfactual, we must make judgments about what would have happened (but these are factual, though uncertain). The 50% threshold for probability is a policy choice (value).
     - Step 5: Deciding if an agent had "capacity to act" in the face of upstream failures may involve values (how much pressure is too much?).

  The procedure is silent on these value judgments and requires the panel to decide based on their experience and the evidence.

  Now, run the procedure on the three cases:

  Case 1:
  - Omission 1: Nurse did not escalate at 2am.
  - Omission 2: Coordinator did not review at 4am.

  We must consider each omission separately.

  For the nurse:
  1. Duty: Protocol says to escalate. It was part of the unit's practice? The nurse expected the coordinator to review at 4, but the protocol required escalation at 2. So breach? Yes, because the protocol was in place and the nurse knew or should have known.
  2. Counterfactual: If the nurse had escalated at 2am, what would have happened? The outreach team would have been called. They would have come and intervened, and the arrest at 5:30 would have been prevented. The coordinator's failure is downstream and independent? Not exactly: the nurse's escalation would have bypassed the coordinator. So we do not hold fixed the coordinator's failure. The harm would have been prevented. Chance? High, so above 50%.
  3. Responsibility: The nurse is a named agent. There was no upstream failure that took away the nurse's capacity (she could have called). So verdict: CO-NA for the nurse.

  For the coordinator:
  1. Duty: Review charts at 4am. Breach: yes, because diverted by emergency? But the duty was there and she did not do it. However, the unit's practice was that the coordinator would review? So breach.
  2. Counterfactual: If the coordinator had reviewed at 4am, would the harm have been prevented? Yes, because the arrest was at 5:30 and review at 4 would have caught it. Chance: high.
  3. Responsibility: Named agent. Verdict: CO-NA for the coordinator.

  But note: the nurse expected the coordinator to review. Does that matter? In the counterfactual for the nurse, we are not holding fixed the coordinator's failure. So both are causal.

  However, the panel might not like holding the nurse responsible because she relied on the coordinator. But the procedure says: if the nurse had a duty and breached it, and it caused the harm, then CO-NA. So we must assign.

  Case 2:
  - Omission: Drug not reordered when stock fell. Three people had authority to order it and each assumed another had.

  We consider each of the three people.

  For one of them (say, Agent A):
  1. Duty: To reorder the drug? They had authority, but was it their specific duty? The protocol might not have specified who exactly. But if all three had the duty (and it was a shared duty), then breach: they did not do it.
  2. Counterfactual: If Agent A had reordered the drug, then the drug would have been in stock. Then when the anaphylaxis occurred, the drug would have been available. The protocol called for that drug, but there were substitutes. However, the substitutes were not in the trolley and not named in the protocol. So if the drug was available, it would have been used and the patient would have been saved? We must assume that the team would have used the drug (since it was the protocol drug) and that it would have worked. Chance: high. So the harm would have been prevented.
  3. Responsibility: Named agent. Verdict: CO-NA for Agent A.

  But the same for all three? Then we would have three CO-NA. However, note that the procedure allows for multiple agents to be assigned CO-NA. But the panel might find this unfair because any one of them could have acted.

  Alternatively, we might consider the shadowed omission: if we ask what if one agent had acted, the harm would have been prevented. So each is causal. We assign CO-NA to each.

  But note: there were substitutes. So even without the drug, they could have used a substitute? The protocol didn't name them, so they might not have been used. The counterfactual: if the drug was not available, they might have used a substitute? But we are in the counterfactual of the drug being available, so they would have used it. But in the actual case, they didn't have the drug and didn't use a substitute? Why? Because they were following the protocol? Then the absence of the drug caused the death. So the reordering omission caused the absence.

  But what about the substitutes? The counterfactual for the reordering omission: if the drug had been reordered, it would have been there and used. So the omission caused the absence and the absence caused the death.

  Alternatively, we could consider: was the failure to use a substitute a separate omission? But the procedure is looking at the reordering omission.

  Verdict: for each of the three agents, CO-NA.

  But the panel might not like this because it holds three people responsible for an outcome that any one of them could have prevented. However, the procedure requires it.

  Case 3:
  - Omission: The junior doctor did not perform the review.
  - Upstream: The rota was signed off by a manager who left.

  1. Duty: The junior doctor had a duty by protocol to do the review? Yes.
     Breach: She did not do it. But why? Because she was covering two wards and was overstretched? And she was told the second ward was staffed? But she was the sole doctor and knew she was covering both? Then she should have prioritized? We must see if she had the capacity.

  2. Counterfactual: If she had done the review, would the harm have been prevented? Yes, because the patient died due to the lack of review.

  3. Responsibility: The omission was by the junior doctor. But was it caused by an upstream failure? The rota was inadequate. The stopping rule: we stop at the immediate agent (the junior doctor) unless she had no capacity to act. Was she so overstretched that she could not have done the review? That is a value judgment. The panel must decide: if they think she could have done it (even if busy), then CO-NA for her. If they think she was impossibly overburdened (so no capacity), then we look upstream to the manager who signed off the rota. But the manager has left. And the rota was signed off 11 months ago. The stopping rule: we do not go back that far. We note the system failure (CO-NI) and assign the immediate omission to the junior doctor only if she had the capacity. If not, then the omission is due to the system (vacant role? not exactly, the role was filled but by an overburdened doctor). We might assign CO-NI for the system.

  But note: the duty was assigned to the junior doctor and she failed to do it. The upstream failure (rota) does not excuse her unless it made it impossible. The panel must decide: was it impossible? Or was it a breach by her? If she could have done the review (even if it meant neglecting something else) then she had a duty to do it? But she had to prioritize. The protocol assigned the review to her, so she should have done it. If she was too busy, that might be a reason for the system to be blamed, but she still might be at fault for not doing it.

  The procedure: if the junior doctor had the capacity to do the review (i.e., it was possible for her to do it in the circumstances) then CO-NA for her. If the workload was so high that she could not possibly have done it, then we assign CO-NI (system failure). The upstream manager is not individually named because the stopping rule says we do not go back to someone who left and made a decision 11 months ago.

  The panel might not like holding the junior doctor responsible because she was put in an impossible position. But if the panel decides she could have done the review, then they must assign CO-NA. If they decide she could not, then CO-NI.

  Now, the requirement: at least one case must come out in a way the panel won't like. We'll say:

  In Case 1, the nurse gets CO-NA, which the panel might not like because she expected the coordinator to catch it.

  In Case 2, three people get CO-NA, which the panel might find too harsh.

  In Case 3, if the panel decides the junior doctor could have done the review, then she gets CO-NA, which they might not like because she was overstretched.

  We'll present Case 2 as the one they won't like.

  Procedure's limitations:
     - It cannot handle cases where the counterfactual is highly speculative (e.g., what if the nurse had called? would the outreach team have come in time?).
     - The 50% threshold is arbitrary and may not reflect the true probability.
     - The specification of what to hold fixed in the counterfactual is somewhat arbitrary and can change the outcome.
     - The procedure might oversimplify complex causal chains.
     - The value judgments (e.g., capacity to act, reasonable duty) are left to the panel without guidance.
     - Writing the procedure down might make panels more rigid and less able to consider unique circumstances.

  Appendix: Running the cases.

  Case 1: 
  - Alleged omission by the nurse at 2am.
    Step 1: Agent is the nurse. Duty exists (protocol). Not unadopted (it was in practice? The nurse knew the protocol but expected the coordinator to review. But the duty to escalate was still hers). Breach: yes.
    Step 2: Counterfactual: If the nurse had escalated at 2am, the outreach team would have been called and would have intervened, preventing the arrest. Chance: high (>50%). So causation.
    Step 3: Responsibility: The nurse is named and had capacity. Verdict: CO-NA.

  - Alleged omission by the coordinator at 4am.
    Step 1: Agent is the coordinator. Duty exists. Breach: yes (due to emergency? But she didn't do it).
    Step 2: Counterfactual: If she had reviewed at 4am, she would have seen the deterioration and called outreach, preventing the arrest. Chance: high. Causation.
    Step 3: Responsibility: Named agent, had capacity (even though diverted, she could have delegated? or the emergency might have been handled differently? We assume she could have done it). Verdict: CO-NA.

  Case 2:
  - Alleged omission: Three agents failed to reorder the drug.
    Consider Agent A (one of the three).
    Step 1: Agent A had authority and duty (shared). Breach: didn't reorder.
    Step 2: Counterfactual: If Agent A had reordered, the drug would have been in stock. Then during the anaphylaxis, the team would have used it (since it was the protocol drug) and the patient would have been saved. Chance: high. Causation.
    Step 3: Responsibility: Named agent. Verdict: CO-NA.

    Same for Agent B and Agent C.

    So three CO-NA verdicts.

  Case 3:
  - Alleged omission: Junior doctor did not do the review.
    Step 1: Agent is the junior doctor. Duty: yes (protocol). Breach: yes, she didn't do it.
    Step 2: Counterfactual: If she had done the review, she would have intervened and the patient would not have died. Chance: high.
    Step 3: Responsibility: The omission was by the junior doctor. But was she capable? The panel must decide: 
        - If they decide she had the capacity (even though covering two wards, she could have done the review by prioritizing), then verdict CO-NA for her.
        - If they decide she did not have the capacity (the workload was impossible), then we assign CO-NI (system failure) because the rota was inadequate. We do not assign to the manager (stopping rule: the manager left and the decision was 11 months ago; we don't go back that far).

  The panel might not like the Case 2 outcome (three CO-NA) because it holds three people individually responsible for an outcome that any one could have prevented. But the procedure requires it because each one's failure was causal (but-for any one of them acting, the harm would have been prevented).

  Conclusion: The procedure is a tool, but it has limitations and requires value judgments. It will change practice by making the reasoning more explicit, which may lead to more consistent but also more rigid outcomes.
answer: |-
  ### Decision Procedure for Omission-Related Harm Reviews

  **Introduction**  
  This procedure provides a structured approach to determining whether an omission (failure to act) caused serious harm. It uses a fixed vocabulary of four verdicts, specifies counterfactual rules, and addresses common dispute patterns. The panel must apply the steps in sequence, terminating early if criteria are unmet. Verdicts are factual; value judgments (e.g., blameworthiness, proportionality) are flagged for panel discretion. The procedure fits on 2 A4 pages and requires no external expertise.

  ---

  ### **Fixed Vocabulary of Verdicts**  
  1. **Causal Omission by Named Agent (CO-NA)**  
     - *Definition*: A specific individual’s failure to act was a necessary cause of the harm (≥50% chance of prevention if acted).  
     - *Report Action*: Record finding, refer for disciplinary action, note causation for families/coroner.  

  2. **Causal Omission Not Attributable to Any Individual (CO-NI)**  
     - *Definition*: The omission caused harm but cannot be assigned to one agent (e.g., systemic failure, multiple agents).  
     - *Report Action*: Record finding, recommend systemic changes (e.g., protocol updates), no individual sanction.  

  3. **Breach Without Causal Contribution (B)**  
     - *Definition*: A duty was breached, but the omission had <50% chance of preventing harm (or harm would have occurred anyway).  
     - *Report Action*: Record breach, recommend training/protocol review, no sanction for causation.  

  4. **No Omission (NO)**  
     - *Definition*: No breach of duty occurred (duty not applicable, not part of actual practice, or no agent existed).  
     - *Report Action*: No further action.  

  ---

  ### **Decision Procedure Steps**  
  *Follow in order; terminate early if criteria met. Use majority vote if disagreement.*

  #### **Step 1: Identify Duty and Agent**  
  - **Question**: Was there a duty (written protocol or reasonably expected practice) for a specific agent to act?  
  - **Adequate Answer**:  
    - *Named agent*: Proceed to Step 2.  
    - *Vacant role/unfilled post*: Verdict = **CO-NI** (stop).  
    - *No duty or duty not part of unit’s actual practice* (unadopted duty): Verdict = **NO** (stop).  
  - **Value Judgment**: "Reasonably expected practice" may involve values (panel discretion).  

  #### **Step 2: Confirm Breach**  
  - **Question**: Did the agent fail to perform the act, despite the duty?  
  - **Adequate Answer**:  
    - *Yes*: Proceed to Step 3.  
    - *No*: Verdict = **NO** (stop).  

  #### **Step 3: Specify Counterfactual Scenario**  
  - **Question**: What would have happened if the agent had acted?  
  - **Rules for Holding Fixed**:  
    - Patient’s underlying condition at time of omission.  
    - State of equipment/resources (unless act would alter them).  
    - **Independent failures** (unrelated to the omission chain).  
    - **Do NOT hold fixed**:  
      - Downstream dependent failures (e.g., latent omissions).  
      - Actions the same agent would take next (allow these to change).  
  - **Write Counterfactual**: 1–2 sentences describing the outcome if the act occurred.  
    - *Disagreement*: Vote (majority decides); note dissent in report.  
  - **Probability Threshold**:  
    - If act had ≥50% chance of preventing harm, proceed to Step 4.  
    - If <50% chance, verdict = **B** (stop).  

  #### **Step 4: Assign Responsibility**  
  - **Question**: Can the omission be attributed to a named agent without tracing further back?  
  - **Pattern Handling**:  
    - *Latent omission* (downstream failure enabled harm):  
      - If counterfactual shows harm prevented (e.g., act would have triggered safeguard), proceed.  
    - *Shadowed omission* (multiple agents/automation failed):  
      - If one agent acting would have prevented harm (≥50% chance), verdict = **CO-NA**.  
      - If no single agent’s action would suffice (e.g., all must act), verdict = **CO-NI** (stop).  
    - *Derived omission* (upstream cause, e.g., rostering):  
      - **Stopping Rule**: Assign to immediate agent unless they had **no capacity to act** (e.g., impossible due to upstream failure). If no capacity, verdict = **CO-NI** (stop). Do not trace beyond one step.  
  - **Adequate Answer**:  
    - *Named agent responsible*: Verdict = **CO-NA** (stop).  
    - *No named agent* (e.g., shadowed with collective failure): Verdict = **CO-NI** (stop).  

  ---

  ### **Summary of Patterns and Verdicts**  
  | **Pattern**         | **Procedure Response**                                                                 | **Verdict**      |  
  |----------------------|----------------------------------------------------------------------------------------|------------------|  
  | Latent omission      | Downstream failure not held fixed; if act prevents harm, proceed to assign agent.      | CO-NA or CO-NI   |  
  | Shadowed omission    | Test if one agent’s action suffices; if not, collective failure.                       | CO-NA or CO-NI   |  
  | Unadopted duty       | Handled in Step 1 (no duty if not actual practice).                                    | NO               |  
  | Derived omission     | Stop at immediate agent unless no capacity; do not trace further.                      | CO-NA or CO-NI   |  
  | Vacant role          | Handled in Step 1 (no agent).                                                          | CO-NI            |  

  ---

  ### **Appendix: Case Applications**  
  *Cases run per procedure; verdicts based solely on steps.*

  #### **Case 1: Nurse and Coordinator Omissions**  
  - **Facts**: Nurse did not escalate at 02:00 (expected coordinator’s 04:00 review). Coordinator diverted and did not review. Patient arrested at 05:30; review at 04:00 would likely have prevented arrest.  
  - **Procedure**:  
    1. **Nurse’s omission**:  
       - Step 1: Duty exists (protocol). Agent = nurse.  
       - Step 2: Breach occurred (did not escalate).  
       - Step 3: Counterfactual: If nurse escalated at 02:00, outreach team intervenes. Coordinator’s failure not held fixed (downstream). Harm prevented (≥50% chance).  
       - Step 4: Named agent (nurse) had capacity. **Verdict = CO-NA**.  
    2. **Coordinator’s omission**:  
       - Step 1: Duty exists. Agent = coordinator.  
       - Step 2: Breach occurred.  
       - Step 3: Counterfactual: If coordinator reviewed at 04:00, harm prevented (≥50% chance).  
       - Step 4: Named agent (coordinator) had capacity. **Verdict = CO-NA**.  
  - **Why Unwelcome**: Panel may dislike holding the nurse responsible due to "expected" coordinator review, but procedure assigns CO-NA as both omissions independently caused harm.  

  #### **Case 2: Drug Not Reordered**  
  - **Facts**: Three agents failed to reorder anaphylaxis drug; each assumed another would act. Substitutes existed but not in trolley/protocol. Patient died.  
  - **Procedure**:  
    - Step 1: Duty exists for all three agents (authority to reorder). Agents = A, B, C.  
    - Step 2: Breach by all.  
    - Step 3: Counterfactual for Agent A: If A reordered, drug available. Team uses protocol drug (substitutes irrelevant), harm prevented (≥50% chance). Same for B and C.  
    - Step 4: **Shadowed omission**: Each agent’s action would have sufficed. **Verdict = CO-NA for each agent (A, B, C)**.  
  - **Why Unwelcome**: Panel will dislike assigning CO-NA to all three, as it implies severe individual culpability for a collective oversight. Procedure requires it, as any one agent could have prevented harm.  

  #### **Case 3: Junior Doctor Overloaded**  
  - **Facts**: Junior doctor (sole cover for two wards) missed review; patient died. Rota signed off 11 months prior by departed manager.  
  - **Procedure**:  
    - Step 1: Duty exists (protocol). Agent = junior doctor.  
    - Step 2: Breach occurred (review not done).  
    - Step 3: Counterfactual: If review done, harm prevented (≥50% chance).  
    - Step 4: **Derived omission**: Upstream rota issue. Panel assesses capacity:  
      - If junior doctor **had capacity** (could have prioritized review), verdict = **CO-NA**.  
      - If **no capacity** (workload impossible), verdict = **CO-NI** (stop; rota is systemic).  
      - *Stopping rule*: Do not trace to manager (left role; decision >1 step back).  
  - **Verdict**: **CO-NA** (if capacity) or **CO-NI** (if no capacity). Panel must decide capacity (value judgment).  

  ---

  ### **Limitations of the Procedure**  
  1. **Counterfactual Artifacts**: Verdicts depend on what is held fixed (Step 3). Different panels may specify scenarios differently, altering outcomes.  
  2. **Threshold Arbitrariness**: The 50% probability rule may misclassify low-probability causations (e.g., 40% chance escapes accountability).  
  3. **Unresolved Value Judgments**: The procedure is silent on:  
     - Fairness of blame (Step 1/Step 4).  
     - Proportionality of sanctions.  
     - What families "deserve" to hear.  
  4. **Incomplete Causality**: Cannot handle:  
     - Overdetermined harm (e.g., five omissions, any three would cause harm).  
     - "Butterfly effect" chains (e.g., staffing decision years prior).  
  5. **Behavioral Impact**: Writing verdicts may:  
     - Encourage defensive practice (e.g., over-escalation).  
     - Stifle nuanced discussion (rigidity vs. improvisation).  

  **Closing Note**: This procedure standardizes factual causation but cannot replace human judgment on ethics, context, or mercy. Its strength is consistency; its weakness is simplification. Use it as a scaffold, not a substitute, for deliberation.
