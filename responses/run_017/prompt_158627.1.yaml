answer: |-
  Here is a draft proposal for your dissertation chapter, designed to meet the specified requirements and word count, incorporating your core ideas and structure:

  **Chapter Proposal: The Structure of Violence Measurement - Resolving the Trend Dispute Through Parameter Mapping and Purpose-Relativity**

  **1. Core Question & Contribution:**  
  This chapter addresses a foundational dispute in the study of political violence: the persistent disagreement over whether violence is declining globally. I argue that this debate is fundamentally mischaracterized as a purely *empirical* dispute resolvable by better data. Instead, I propose that much of the conflict arises from *structural features of the concept itself* when aggregated, disguised as empirical disagreement. The core question is: **Under what conditions, and for which specific conceptualizations, can claims about the overall trend of "violence" be considered determinate factual claims, as opposed to artifacts of measurement conventions or unresolved normative choices?** The chapter disentangles three distinct layers: the *factual* (trend direction given fixed measurement parameters), the *normative* (justification for choosing specific parameters), and the *metaphysical* (whether an un-stipulated "overall violence trend" fact exists).

  **2. The Problem: Why Existing Approaches Fall Short**  
  Current debates often proceed by proponents of opposing trend claims (e.g., "Long Peace" advocates vs. critics) emphasizing different datasets or definitions. However, this approach is inadequate because:
      *   **Better Data is Insufficient:** Even perfect data on all violent incidents cannot resolve disputes arising from *how* to aggregate fundamentally heterogeneous harms (e.g., comparing one genocide to ten thousand homicides). Data quality affects the *factual* layer but not the *aggregation* problem.
      *   **Stipulative Definitions are Question-Begging:** Simply defining "violence" more carefully (e.g., focusing only on battle deaths) answers the normative question ("*Which* measure should we prioritize?") by fiat, without justifying *why* that particular aggregation is authoritative for the "overall trend" question. It avoids the core structural issue.
      *   **What They Miss:** Both approaches fail to acknowledge that "violence" functions differently at different levels of aggregation. While trend claims for *homogeneous sub-kinds* (e.g., annual interstate war fatalities per capita) are often determinate factual matters, claims about the *overall aggregate* trend become increasingly indeterminate as the heterogeneity and incommensurability of included harms increases. The debate often surreptitiously slides between these levels, creating the illusion of a single resolvable empirical dispute.

  **3. Method: Measurement-Theoretic Mapping and Purpose-Relativity**  
  Over the nine months, I will employ a structured, measurement-theoretic analysis focused on three key parameters defining any violence trend measure:
      1.  **Incidence Variable:** What is counted? (e.g., realized fatal events, victim-hours of suffering, ex ante risk-weighted expected victimization).
      2.  **Denominator:** What is the base? (e.g., per capita per year, per person-lifetime, per social encounter).
      3.  **Severity Weighting:** How are different harms aggregated? (e.g., simple counts, disability-adjusted life years (DALYs), a weighting with potential lexical priorities between harm types like torture vs. property damage).
  I will systematically explore how variations in these parameters (e.g., using lifetime risk vs. annual per capita rate; realized harm vs. coercive capacity) generate conflicting trend signals from the same underlying phenomena (e.g., effects of rising life expectancy, increased anonymous interactions, or shifts from private violence to state surveillance/incarceration).

  Crucially, I will map these measurement specifications onto the **primary purposes** for which violence trend claims are typically made:
      *   **Forecasting:** Predicting future risk for individuals/groups.
      *   **Assigning Blame/Credit:** Evaluating the performance of specific institutions or eras.
      *   **Moral Urgency Assessment:** Prioritizing interventions.
      *   **Era Comparison:** Judging relative societal conditions across time.
  The core analytical step is demonstrating that different purposes *logically require* different combinations of parameters. For instance, forecasting individual risk plausibly requires a "per person-lifetime" denominator and incorporates ex ante risk, while assigning credit to a contemporary government might focus on realized harm per capita during its tenure. The hypothesis is that apparent disagreements about "the trend" often reflect unstated conflicts about the underlying purpose, not the empirical world.

  **4. Candidate Conclusions & Discriminating Evidence**  
  The analysis will adjudicate between three possible metaphysical/conceptual structures for violence aggregation:
      *   **Unitarian:** There is one objective fact about the overall trend; current disagreement stems from measurement error/ignorance. *Discriminating Evidence:* Finding a single parameter set demonstrably privileged by all relevant purposes or by the intrinsic nature of harm, making other sets irrelevant.
      *   **Conventionalist:** The overall trend is *only* determinate relative to a fully stipulated set of parameters/weights; no deeper fact exists. *Discriminating Evidence:* Demonstrating that no parameter set is objectively privileged, and purposes underdetermine choice between equally valid but conflicting sets for aggregate claims.
      *   **Patchwork/Localist (Proposed View):** Determinacy holds robustly for trend claims within homogeneous sub-kinds of violence (e.g., specific types of homicide, battle deaths) but dissolves for the heterogeneous aggregate "violence as such." The aggregate debate is largely normative/purpose-driven. *Discriminating Evidence:* Showing consistent determinacy within well-defined sub-kinds, persistent and irresolvable parameter-dependence for the aggregate, and a clear mapping showing how purpose drives parameter choice without resolving the metaphysical indeterminacy of the overall trend.

  **5. Potential Failure Modes & Honest Scope**  
  *   **Failure:** The project fails if: (a) the purpose-relative mapping collapses (all purposes require identical parameters, making disagreement purely empirical); (b) the heterogeneity of sub-kinds proves illusory or measurement-dependent itself (undermining the patchwork); or (c) the parameter variations never generate conflicting trend signals in practice (rendering the structural point moot).
  *   **Scope & Cuts:** For feasibility within nine months and one chapter:
      *   **Focus:** Modern states/post-WWII period (leveraging better data availability).
      *   **Core Harms:** Primarily physical violence (lethal and non-lethal), coercive detention; explicit exclusion of structural violence, psychological harm without physical coercion, and non-human violence for tractability.
      *   **Depth:** Illustrative analysis of key parameter conflicts (e.g., lifetime vs. annual risk; realized harm vs. coercive capacity displacement) and mapping to core purposes (forecasting, blame/credit, moral urgency). Deep dives into specific historical periods or exhaustive parameter combinations will be deferred.
      *   **Normative Theory:** Identifying required parameters for purposes, not providing a full normative justification *for* those purposes/weights.

  **6. Practical Deliverable: The Violence Trend Audit Template**  
  The chapter will conclude with a concrete tool: an **audit template** for evaluating violence trend claims. This template will require explicit declaration of:
      *   The specific **purpose** of the trend claim.
      *   The chosen **incidence variable**.
      *   The chosen **denominator**.
      *   The **severity weighting scheme** (and justification if complex/lexical).
  This forces separation of the *empirical* claim (trend direction *given* these parameters) from the *stipulative/normative* choices underlying the parameters. It provides a practical framework for clarifying debates and identifying the true sources of disagreement (purpose, normativity) vs. resolvable empirical questions.

  This chapter provides the crucial theoretical and conceptual foundation for understanding the limits and possibilities of measuring aggregate political violence, moving beyond sterile definitional debates and revealing the structural roots of enduring trend disputes.
