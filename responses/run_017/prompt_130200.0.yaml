answer: |-
  Here’s a reconstruction of the implicit theory behind the tenure patterns, tested against your queries:

  ### Reconstructed Theory: Task-Specific Corruption Risks & Institutional Purposes
  The allocation of tenure presupposes that **different state functions face distinct corruption vectors and require distinct institutional virtues**:
  1. **Legislation** (rotated):  
     - **Primary risk**: *Capture by electoral self-interest.* Lawmakers may prioritize re-election over public good, trading favors for votes/campaign funds.  
     - **Virtue promoted**: *Accountability and responsiveness.* Rotation forces alignment with current popular will.  
     - **Strict presupposition**: Legislating is an act of will-formation (not truth-tracking), vulnerable to *temporal* corruption (entrenchment).  

  2. **Adjudication** (life tenure):  
     - **Primary risk**: *External pressure or retaliation.* Judges may distort rulings to please voters/politicians who control tenure.  
     - **Virtue promoted**: *Independence and stability.* Insulation enables counter-majoritarian rulings and consistent legal interpretation.  
     - **Strict presupposition**: Judging is truth-adjacent (applying law to facts), requiring *deliberative independence* from short-term pressures.  

  3. **Administration** (permanent, protected):  
     - **Primary risk**: *Partisan purges and policy lurches.* Expertise lost if staff change with each election.  
     - **Virtue promoted**: *Neutral competence and continuity.* Ensures state functions survive electoral shifts.  
     - **Strict presupposition**: Execution requires *technical expertise* immune to political whim.  

  4. **Fact-Finding (juries)** (ephemeral, untrained):  
     - **Primary risk**: *Systemic bias or elite capture.* Professional fact-finders might develop class/ideological biases.  
     - **Virtue promoted**: *Democratic legitimacy and epistemic diversity.* Fresh perspectives guard against institutional blind spots.  
     - **Strict presupposition**: Facts are best discerned by *unmediated community sense* rather than expertise.  

  ### Underdetermined Aspects
  - **Why not rotate judges?** The theory doesn’t strictly require life tenure; long non-renewable terms could also mitigate accountability pressures.  
  - **Civil service vs. jury design:** Both prioritize neutrality, but one uses expertise (bureaucracy), the other amateurism (jury). This suggests *who controls outcomes* (experts vs. laypeople) matters as much as corruption prevention.  
  - **Gradient ambiguity:** The pattern fits *both* a "will vs. truth" axis (legislation as will, judging/admin as truth) *and* a "vulnerability to capture" axis (legislators most exposed to electoral bribery, judges to removal threats).  

  ---

  ### Testing the Counterfactual: "Why Not Rotate Judges?"  
  **The challenge:** If anti-capture is the goal, predictable lifelong judges seem *easier* to bribe than anonymous juries.  
  **Theory’s response:**  
  - Judicial corruption is *qualitatively different*. Legislators face *ex ante* capture (trading favors for votes), while judges face *ex post* retaliation (ruling against powerful interests). Life tenure neutralizes *fear of consequences*, not just bribery.  
  - **Evidence for distinct rationale:** Federalist 78 (Hamilton) explicitly argues life tenure prevents judges from being "overpowered, awed, or influenced" by other branches. Juries avoid elite bias; judges avoid retaliation.  
  - **Contradiction?** Partly: The practice *is* two designs (anti-bias for juries, anti-retaliation for judges), but unified by a deeper principle: **institutions must be insulated from the dominant corruption vector of their function.**  

  ---

  ### Testing the "Insulated Legislature" Package  
  *(Sortition legislators + short-term elected judges)*  

  | **Institutional Half** | **Endorsed by Which Theory Half?** | **Advantages/Problems** |  
  |------------------------|-------------------------------------|--------------------------|  
  | **Insulated Legislature** (sortition, single term): | - **Endorsed:** Anti-electoral capture (removes re-election incentives).<br>- **Rejected:** Undercuts legislative *accountability* (no electoral check).<br>- **Fits:** Jury-like legitimacy, but at odds with legislation’s will-forming role. | **Defensible:** Eliminates campaign finance corruption.<br>**Breaks:** Lacks democratic mandate; risks incompetence; no mechanism to remove bad actors mid-term. |  
  | **Short-Term Judges** (elected, renewable): | - **Endorsed:** None. Direct election contradicts judicial independence rationale.<br>- **Fits loosely:** Rotation *could* reduce elite entrenchment, but amplifies accountability pressures. | **Defensible:** Increases responsiveness (e.g., on civil rights).<br>**Breaks catastrophically:** Judges become politicians; rulings vulnerable to electoral whims (e.g., punishing unpopular acquittals). |  

  **Overall Package Verdict:**  
  - **Improves:** Legislator independence from donors/voters.  
  - **Worsens:** Judicial independence (+ adds electoral pressures).  
  - **Theoretical incoherence:** Applies anti-capture tools crosswise: Sortition fights electoral capture but is misplaced for agenda-setting; judicial elections *introduce* electoral capture where insulation is core.  

  ---

  ### Juries as Precedent for Sortition  
  **Why juries are a weak precedent:**  
  1. **Narrow remit:** Juries decide bounded factual questions ("Did X do Y?") under strict legal instructions. Legislators create open-ended rules affecting millions.  
  2. **Lack of agenda power:** Juries react to charges/proof; legislators set priorities and trade-offs.  
  3. **Epistemic limits:** Untrained juries work because facts are localized; legislation requires coordination with macroeconomics, diplomacy, etc.  
  4. **Unanimity/reasons:** Juries *must* deliberate toward consensus; legislators logroll and compromise.  

  **Limited evidence they provide:**  
  - Proof that citizens *can* handle complex, high-stakes decisions with minimal training.  
  - Evidence that short terms + no re-election *can* reduce corruption in focused tasks.  
  - **But:** No proof this scales to proactive, polycentric problem-solving.  

  ---

  ### Conclusion  
  The pattern’s coherence lies in **matching tenure to each function’s dominant pathology**:  
  - Legislators rotated to combat *electoral capture*.  
  - Judges insulated to combat *retaliation*.  
  - Administrators protected to combat *partisan purge*.  
  - Juries randomized to combat *professional bias*.  

  The counterfactual fails because judicial life tenure targets *retaliation*, not bribery. The "insulated legislature" package misapplies solutions, weakening accountability where needed (legislators) and inviting capture where independence is paramount (judges). Juries prove citizen panels can work for *binary, retrospective* tasks but not for *open-ended, prospective* ones. The theory holds best when institutions are viewed as specialized tools for distinct tasks—not as a unified "democracy" mechanism.
