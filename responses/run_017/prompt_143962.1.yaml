prompt: |-
  My friend Miriam and I spent most of last evening arguing about whether anything can be recovered about Jesus of Nazareth from the Gospels, and we ended up circling rather than disagreeing cleanly, so I want a sharper description of what she is actually doing. She thinks a real figure can be recovered and that a short list of tests does the recovering. I think the tests get applied one at a time and always come out wherever the person applying them already wanted to be.

  These are the rulings I pinned her to. Jesus' baptism by John: authentic, because a church that proclaimed Jesus as Lord would hardly have invented a story in which he submits to someone else's rite. The crucifixion under Pilate: as certain as anything gets. The cry of dereliction from the cross: not authentic, because it is too neatly composed out of the opening of Psalm 22 — embarrassment value notwithstanding. The prediction that no stone of the temple will be left on another: authentic, on the grounds that it turns up in Mark, in John, in Acts and in the charges at the trial, and that it explains why the movement collided with the temple authorities. The prohibition of divorce and the instruction that a person's word should simply be yes or no: authentic, because the later church softened both, and traditions do not get stricter as they go. The Lukan saying that the kingdom of God is already present within or among you: rejected as the evangelist's editing; she holds instead that Jesus announced a kingdom about to break in from above, and that the spiritualised, deferred version is a later adaptation. The long Johannine discourse in which Jesus calls himself the bread of life: rejected, and here her reasoning inverts — it is too exactly the theology of the later church to be earlier than it. The virginal conception and the infancy stories: rejected, although she concedes the Greek is Semitic in flavour, on the grounds that style can always be imitated. Parables that appear only in Luke, such as the good Samaritan: she declines to rule at all, calling them possible but unprovable.

  So here is the case I want your prediction on. Suppose a papyrus fragment is published next month, provenance unknown, dated by its handwriting to the early third century, containing a saying found in no canonical gospel. In translation it runs: do not pray that the kingdom may come; pray that you may not be put to shame when it comes, for it comes like a snare on everyone who watches for it, and those who keep watch by night will be the last to see it. The Greek is translation-Greek built out of matched parallel lines, and a very similar saying appears in Syriac in a Christian work of roughly the same period, which may or may not depend on the Greek.

  What will she say — authentic, inauthentic, or unprovable — and what is she running? Please name the two or three rules that fit her whole track record equally well, say what each of them predicts about this fragment and exactly where they come apart on it (note that the saying is at once embarrassing relative to the church's own prayer practice, stocked with imagery the church used everywhere, flattering to an apocalyptic Jesus, and attested only late and perhaps only once), give me your single best guess with the reason for preferring it, and close by specifying the one further case you would put to her to tell the surviving rules apart. Under 700 words, and please don't point me at anything to read — I want the reasoning, not sources.
reasoning: |-
  Okay, the user is deeply engaged in a theological debate with Miriam about the authenticity of Jesus' sayings in the Gospels. They've outlined Miriam's criteria for determining authenticity and want to predict how she'd judge a newly discovered saying. The user seems frustrated by circular arguments and wants clarity on Miriam's methodology.

  Hmm, Miriam's approach appears to rely on three consistent principles: embarrassment (authentic if embarrassing to early church), multiple attestation (authentic if widely attested), and theological development (inauthentic if too aligned with later church theology). The baptism and crucifixion pass embarrassment test, while divorce prohibition passes theological development test. The Johannine discourses fail as they match later theology too perfectly.

  This new fragment presents a puzzle. It's embarrassing (contradicts Lord's Prayer) which suggests authenticity, but late appearance (3rd century) and single attestation weaken it. The apocalyptic tone fits Miriam's view of Jesus, but the late date raises doubts. 

  Miriam will likely call it "unprovable" due to late attestation outweighing embarrassment value. To test her consistency, I'd present a saying that's theologically embarrassing but early - like Jesus denying his divinity in an early papyrus. That would force her to choose between embarrassment and multiple attestation criteria.

  The user isn't seeking sources but wants logical dissection of methodological tensions. They're clearly well-versed in historical Jesus scholarship but want the reasoning distilled without academic jargon. The challenge is balancing all conflicting criteria in this test case.
answer: |-
  Based on Miriam's consistent methodology, here's the prediction and analysis:

  **Prediction:** Miriam will likely declare the saying **inauthentic**, though possibly hedging as "unprovable" due to late attestation being the decisive flaw. Her core rejection will center on provenance and date.

  **Miriam's Core Rules:**

  1.  **Embarrassment/Criterion of Dissimilarity:** Sayings/events embarrassing to the later church are likely authentic (e.g., Baptism, Crucifixion, Divorce prohibition). Traditions don't invent awkwardness.
  2.  **Multiple Attestation:** Sayings/events appearing in multiple independent early sources are more likely authentic (e.g., Temple prediction).
  3.  **Theological Development/Inverse Dissimilarity:** Sayings too perfectly aligned with *developed* church theology, especially if absent from earlier strata, are likely inauthentic creations *of* that church (e.g., John's Bread of Life, Lukan "within you" kingdom).

  **Application to the Fragment & Rule Conflict:**

  *   **Rule 1 (Embarrassment/Dissimilarity) Suggests AUTHENTIC:** The saying directly contradicts the Lord's Prayer ("Thy Kingdom come") and its core petition. Inventing a saying *against* praying for the Kingdom's coming would be highly embarrassing for the early church. This strongly points to authenticity.
  *   **Rule 2 (Multiple Attestation) Suggests UNPROVABLE/INAUTHENTIC:** The saying appears *only* in a late (early 3rd century) fragment of unknown provenance and a potentially dependent Syriac source. This fails multiple attestation from *early*, independent sources (like Mark, Q, Paul, John). Late, single attestation is weak evidence. Rule 2 clashes directly with Rule 1 here.
  *   **Rule 3 (Theological Development) Suggests UNPROVABLE/AMBIGUOUS:** The apocalyptic tone ("like a snare," "keep watch by night") fits Miriam's view of Jesus' message (about to break in). It doesn't obviously reflect a *later, spiritualized/deferred* kingdom theology (which she rejects, like Luke 17:21). However, the church *did* use apocalyptic imagery. Rule 3 doesn't strongly argue *against* authenticity, but its flattering nature means Rule 3 doesn't *support* it either. Rule 3 is largely neutral here.

  **Where Rules Come Apart:** The core clash is between **Rule 1 (Strong Embarrassment = Authentic)** and **Rule 2 (Late, Single Attestation = Unprovable/Inauthentic)**. Rule 1 sees the contradiction with church practice as a mark of authenticity. Rule 2 sees the lack of early, multiple witnesses as a fatal flaw outweighing embarrassment. Rule 3 is secondary but highlights that the apocalyptic theme isn't a clear mark *against* authenticity for Miriam.

  **Best Guess & Reason:** Miriam will prioritize **Rule 2 (Multiple Attestation/Early Provenance)** over Rule 1 in this case. The fragment's lateness (early 3rd century) and lack of earlier canonical attestation will be decisive. While the embarrassment is strong, she will argue that a *late* community with apocalyptic leanings *could* have created an "embarrassing" saying to critique mainstream prayer practice or emphasize watchfulness, making it unreliable as a Jesus saying. She'll likely say **inauthentic**, or strongly lean towards "unprovable due to late, solitary attestation."

  **Test Case to Distinguish Rules:** Present a saying attested in multiple *early* sources (e.g., Mark *and* Q material in Matthew/Luke) that is theologically *embarrassing* to the later church but *doesn't* fit Miriam's specific apocalyptic Jesus view. For example: "Why do you call me good? No one is good but God alone" (Mark 10:18, Luke 18:19) – if it *only* appeared in a newly discovered, verified 1st-century papyrus alongside Mark, *without* the canonical context softening it. Does Rule 1 (embarrassment - implies Jesus denying inherent goodness/special status) trump Rule 2 (multiple early attestation) despite contradicting her view of Jesus' self-understanding? Her ruling here would show the relative weight of Embarrassment vs. her specific historical reconstruction.
