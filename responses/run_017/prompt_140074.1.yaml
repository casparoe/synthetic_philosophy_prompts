  Then:

    Move 5: Red plays (2,3).
    Move 6: Blue, using stealing: what would Red play at move 6? (1,3). So Blue plays (1,3).
    Move 7: Red's turn: the strategy says (3,1). Red plays (3,1).
    Move 8: Blue's turn: the strategy says (3,2). Blue plays (3,2).
    Move 9: Red's turn: the strategy says (3,3). Red plays (3,3).
    Still no conflict.

  Alternatively, we set the strategy to include a move that Blue played earlier. For example, at move 5, Red plays (1,3). Then at move 6, Blue plays (2,3) (by copying the next move of Red). Then at move 7, the strategy for Red is (1,2) -> but (1,2) is already occupied by Blue (from move 2). So Red cannot play there. This is the conflict.

  So the fixed strategy for Red (after the initial four moves) is:
    Move 5: (1,3)
    Move 6: (1,2)   -> but (1,2) is already taken by Blue.

  So when it is Red's turn for move 6 (which is actually the 5th move in the strategy because we are starting after the initial 4 moves), the strategy says (1,2) but that cell is taken. What does Red do? The strategy doesn't say. So the stealing breaks down.

  We'll prepare a board with the initial four moves and then give the fixed strategy for Red as:
    Move 5: (1,3)
    Move 6: (1,2)   -> conflict at move 6.

  Then in the drill:
    - The pair sets up the board with the initial four moves.
    - They assign one as Red (with the fixed strategy) and one as Blue (who will steal Red's strategy).
    - Move 5: Red plays (1,3).
    - Move 6: Blue's turn: Blue says: "If I were Red and it was move 5, I would play (1,3). But that has been played. Now what? The strategy for Red at move 6 is (1,2). So I (Blue) will play (1,2)." But (1,2) is already occupied by Blue (from move 2). So Blue cannot play there. Alternatively, if Blue doesn't remember that they already played at (1,2), they try to play and see it's taken. This is the conflict.

  Actually, in the stealing argument, the second player (Blue) is using the first player's strategy as if Blue were the first player. So Blue ignores the existing stones? That might be the point: the stolen strategy might call for a move that is already taken by either player. In that case, the stealing player must have a backup plan? But then the argument becomes more complicated.

  We want the students to see that the stolen strategy might call for an occupied cell, so the argument requires that the strategy can be defined in a way that it never calls for an occupied cell? Or that the stealing player can make an arbitrary move in that case? But then the argument doesn't go through as simply.

  In the drill, we want them to see that the stolen strategy might call for a move that is already taken by the stealing player (Blue) and then they don't know what to do.

  So we design the initial board and strategy to cause that.

  **Debrief:**
  We go through each round and connect to the premises. We also note that in the physical drill, they encountered the problem of the stolen strategy calling for an occupied cell. We explain that in the full argument, we assume the strategy is defined for all positions (so it would not call for an occupied cell) and that the stealing player can use the strategy by pretending that the extra stone they have is not there (by considering the board without the extra stone). But that requires that the extra stone doesn't hurt, which is premise 2. In Hex, an extra stone doesn't hurt, so you can ignore it and play the strategy. But in the triangle avoidance game, an extra stone might complete a triangle, so you cannot ignore it.

  **Closing:**
  We return to the friend's claim: the strategy-stealing argument (when it applies) shows that the first player wins, but only under specific conditions. In real-life races, if the extra move might hurt (like in the triangle game) or if the game can be drawn, then the follower might not benefit. Moreover, even when it applies, it doesn't tell you how to win, only that the first player has a winning strategy. So the leader might not know how to use the advantage.

  This design meets the requirements. It has four rounds of play, a physical drill, and a debrief that ties back to the friend's claim.
answer: |-
  ### Recommended Design: "The Strategy-Stealing Lab"

  **Why Rejected Others:**  
  - **Lectured Hex analysis:** Rejected—violates "no lecture up front" and fails to induce experiential discovery.  
  - **Pure abstract debate:** Rejected—lacks physical play, so students wouldn’t *feel* the argument’s fragility.  
  - **Single-game deep dive:** Rejected—insufficient to contrast premises (draws, liability, symmetry) across contexts.  

  ---

  ### Full Design  
  **Materials per Pair:**  
  - 1× tic-tac-toe grid (printed).  
  - 1× 5×5 Hex board (printed; cells labeled A1–E5).  
  - 1× \(K_6\) graph (6 vertices, 15 edges; printed).  
  - 2× colored pens (e.g., red/blue).  
  - 1× prediction ledger (Brier-scored table; see below).  
  - **Drill kit:** 1× partially played Hex board (pre-printed with 3 moves: Red at A1, Blue at B2, Red at C3).  

  **Timeline (90 mins):**  
  1. **Intro (5 mins):**  
     - *Goal:* "Today, we test a bold claim: 'In any head-to-head race, the follower can always win by copying the leader plus one free move.'"  
     - *Rules:* No devices. Pairs play 4 rounds. Record predictions/reasons **before** playing. Scoring via ledger.  

  2. **Round 1: Tic-Tac-Toe (10 mins)**  
     - *Rules:* Standard (3×3 grid). First player: X, second: O. Win: 3-in-a-row. Draw if board full.  
     - *Prediction:* "Who wins? (First, Second, Draw)" + reason.  
     - *Play:* One game per pair.  
     - *Why:* Extra move is harmless (copying doesn’t hurt), but draws possible → stealing shows "first can’t lose," not "must win."  

  3. **Round 2: 5×5 Hex (15 mins)**  
     - *Rules:* No swap. First connects top-bottom (red), second left-right (blue). Win: complete path. **State:** "Draws impossible (trust me)."  
     - *Prediction:* "Who wins? (First/Second)" + reason.  
     - *Play:* One game per pair.  
     - *Why:* Premises hold (no draw, extra stone helps, symmetric roles) → stealing "proves" first wins, but no strategy given.  

  4. **Round 3: Triangle Avoidance on \(K_6\) (15 mins)**  
     - *Rules:* Players claim edges (red/blue). **Lose** if you complete a monochromatic triangle. State: "Draws impossible (Ramsey!)."  
     - *Prediction:* "Who wins? (First/Second)" + reason.  
     - *Play:* One game per pair.  
     - *Why:* Extra move can force loss (e.g., creating a triangle) → stealing fails despite no draws.  

  5. **Round 4: Handicap Hex (20 mins)**  
     - **Part A (10 mins):** Second player has a "bolt" (play two stones once, anytime).  
       - *Rules:* Standard Hex, but second uses bolt once (e.g., "Bolt! I play at D4 and E5").  
       - *Prediction:* "Who wins? (First/Second)" + reason.  
       - *Play:* One game.  
     - **Part B (10 mins):** Both players have a bolt.  
       - *Rules:* Each may use bolt once.  
       - *Prediction:* "Who wins?" + reason.  
       - *Play:* One game.  
     - *Why:* Tests symmetry premise.  
       - **Part A:** Asymmetric → argument fails (second wins in practice).  
       - **Part B:** Symmetric → argument *could* apply (first wins with extra bolt), but messy.  

  6. **Physical Drill: Strategy-Stealing Simulation (15 mins)**  
     - *Setup:* Groups of 4 (from 2 pairs). One shared pre-printed Hex board (moves: Red A1, Blue B2, Red C3). Roles: Leader (Red), Follower (Blue), Strategist (for Leader), Thief (for Follower).  
     - *Task:*  
       - Leader/Strategist pick next move (e.g., D4) using a fixed "strategy" (pre-printed: "Always play the center of largest open area").  
       - Thief *steals*: "If I were Leader, I’d play D4. So I (Follower) play D4."  
       - **Conflict:** Thief’s "copy" demands D4, but Leader’s dummy stone (C3) blocks Follower’s path. Follower stalls → "What’s my 'extra move’ now?"  
     - *Debrief prompt:* "What broke? What if the board were empty?"  

  7. **Debrief (20 mins):**  
     - **Map moments to premises:**  
       | Round | Premise Tested | Predictable Outcome |  
       |-------|----------------|---------------------|  
       | 1 | Draws possible? (Yes) | 90% draws → stealing ≠ win |  
       | 2 | Extra stone helps? (Yes) | First wins 70% (but not 100%!) |  
       | 3 | Extra stone hurts? (Yes) | First loses 80% (forced triangles) |  
       | 4A | Symmetric roles? (No) | Second wins with bolt |  
       | 4B | Symmetric? (Yes) | Tie or first wins |  
       | Drill | "Dummy stones" | Strategy demands occupied cell → needs help from "extra stone never hurts" |  
     - **Predictable Problems:**  
       - Strong players dominate (e.g., Hex experts win regardless).  
       - Skill ≠ strategy (e.g., "I won Hex, so first *always* wins" ≠ proof).  
       - Small samples mislead (e.g., "I drew tic-tac-toe, so draws are easy").  
       - Bolt confusion (e.g., "Bolt = two moves, so second wins 4A" ≠ why symmetry fails).  
     - **What I Must Supply:**  
       - Generality: "Hex has no draw *on any size board* (topology proof)."  
       - Non-constructiveness: "Stealing proves existence, not how to win."  
     - **Closing Move:**  
       - "My friend said: 'Followers win by copying plus one move.' We saw this *only* when:  
         1. No draws (Hex, not tic-tac-toe),  
         2. Extra moves help (Hex, not \(K_6\)),  
         3. Roles are symmetric (Hex, not bolt-handicap).  
         Even then, it’s a guarantee—not a roadmap. Leaders *can* be caught, but only if the race is fair, decisive, and the follower isn’t holding a bomb."  

  ---

  **Prediction Ledger (Brier Scoring):**  
  - Students predict **probability** (0–100%) of first/second win (or draw) before each round.  
  - After playing, score: \((1 - \text{outcome probability})^2\) (e.g., predict 80% first wins, first wins → score \( (1-0.8)^2 = 0.04 \)); lower = better.  
  - Leaderboard: Rank by total score (displayed post-debrief).  

  **If Cut to 60 Mins:**  
  - **Cut Round 4B (both bolts).**  
  - **Why:** Part A (asymmetric bolt) suffices to break symmetry; Part B is redundant for premises.  
  - **Adjust timeline:**  
    - Rounds 1–3: 30 mins (10 each).  
    - Round 4A: 10 mins.  
    - Drill: 10 mins (simplify to 1 move/group).  
    - Debrief: 10 mins.  

  ---

  **Why This Works:**  
  - **Experiential:** Physical drill forces confrontation with "dummy stones" and undefined "extra move."  
  - **Contrastive:** Premises fail *differently* in each round (draws, liability, asymmetry).  
  - **Self-correcting:** Prediction ledger reveals overconfidence (e.g., "Hex first always wins" vs. actual losses).  
  - **Philosophically honest:** Debrief separates empirical play (fallible) from proof (infallible but conditional).
