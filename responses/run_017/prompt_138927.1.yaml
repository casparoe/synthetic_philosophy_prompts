prompt: |-
  I advise the disputes committee of a national trade-union federation. The committee decides whether an affiliate's proposed tactic counts as sanctioned industrial action — that is, action eligible for federation strike pay, for defence costs, and for solidarity action by other affiliates. Its remit is political and ethical rather than legal: please reason from its own track record and from principles about what a labour movement ought to be doing, and do not appeal to the labour law of any particular jurisdiction. Its options in any case are to sanction, to sanction subject to stated conditions, or to decline.

  Here is the track record, with the ground given in each minute.

  1. Sanitation workers: indefinite full withdrawal of labour, after a ballot and the notice the federation's rules require, over pay. Sanctioned — collective mandate, open declaration, and the cost borne by the strikers themselves in lost wages.
  2. Rail maintenance staff: refusal of all non-contractual overtime together with scrupulous adherence to every written procedure in the safety manual, announced in advance and sustained for six weeks; several thousand cancellations followed. Sanctioned — workers are entitled to withhold what they were never obliged to give, and the resulting disruption is the employer's own understaffing coming home to roost.
  3. Warehouse workers: a three-day unannounced walkout after management suspended a safety representative; no ballot, and the action fell inside a period covered by a no-strike undertaking. Declined — no collective mandate, and the employer was given no opportunity to prepare or respond. The minute adds that the same stoppage, had it been balloted and notified, would in all likelihood have been sanctioned.
  4. Dockers: refusal to handle cargo from a plant where another union's members were locked out; no grievance of any kind against their own employer; balloted and notified. Sanctioned, narrowly, over a dissent — the dissent holds that the action conscripts an uninvolved employer and its customers into a dispute none of them can settle.
  5. Insurance clerks: files processed at roughly sixty per cent of the normal rate while full hours were recorded and full pay drawn. Declined — taking pay for labour one is deliberately withholding misrepresents the exchange; the cost is shifted to the employer covertly rather than borne openly.
  6. Hospital technicians: full withdrawal of labour, except that a skeleton service for sterilisation and dialysis was maintained under a carve-out agreed with management in advance and published. Sanctioned — the right to withdraw labour is compatible with a duty to avert grave harm to third parties, provided the carve-out is public and does not defeat the point of the action.
  7. A one-day stoppage over a government immigration policy: no grievance against any employer, but balloted and notified. Declined — strike action is tied to the employment relation, and a general political dispute is to be pursued by other means.

  The case now before us. Bus drivers and depot maintenance crews at a municipal operator, in a dispute over pay and rostering. They have balloted, and have given the required notice. What they propose is to strike intermittently: a series of stoppages of one to three hours, several per week, at times they will not disclose in advance, falling somewhere inside a three-day window that they will publish, continuing until the dispute is settled. They lose the pay for the hours they stop. The employer's submission is that it cannot plan around such a pattern: it must hold buses, depots and crews on standby across the whole window, it cannot tell passengers in advance which services will run, and it estimates the disruption per worker-hour lost at several times that of a continuous strike of the same total length. The union offers to keep a small number of routes serving the city's two hospitals running at all times, and to publicise that commitment.

  What I want from you:

  First, set out the general rules — at least three, each stated so that it could actually be applied to a fresh case — that fit the whole track record rather than only part of it. I strongly suspect the minutes overstate how much these verdicts settle: in case 3 the want of a ballot and the want of notice are confounded, and in case 5 dislike of covert cost-shifting and dislike of the tactic's deceptiveness are confounded. I need to know which feature is really carrying each verdict.

  Second, say what each of those rules predicts about the bus dispute, and state precisely where the rules come apart.

  Third, give me two verdicts and keep them separate: your best guess at what this committee will in fact do, and the verdict you would recommend as the one that best coheres with its own precedents. Identify the closest analog among cases 1 to 7 and say why — or tell me plainly that the precedents underdetermine the matter and why they do.

  Fourth, if they do underdetermine it: state the principle the committee would be adopting under each of the live options, including any conditions you would attach to a conditional sanction, and say which of those principles it would least like to see printed as its own.

  Fifth, name one further case — specified as concretely as the bus dispute is — whose verdict would most sharply separate the rules you have identified.

  Sixth, and most important: tell me which single consideration would move you to the opposite verdict, and where the reasoning in your answer is most likely to be going wrong.

  I would rather have seven hundred words that discriminate between rules than two thousand that survey the landscape.
reasoning: |-
  Hmm, the user is asking me to advise a trade-union federation disputes committee on whether to sanction a specific industrial action by bus drivers. They've provided seven precedents and want a structured analysis. Let me approach this methodically.

  First, I need to extract general rules from the precedents. Looking at the cases:
  - Case 1 shows sanctioning requires collective mandate (ballot), open declaration, and workers bearing costs
  - Case 2 indicates workers can withdraw voluntary labor if done transparently
  - Case 3 declines due to lack of both ballot and notice
  - Case 4 sanctions secondary action but with dissent about conscripting neutral parties
  - Case 5 declines because workers were deceptive about work/pay exchange
  - Case 6 approves with carve-outs for essential services
  - Case 7 declines because strike must relate to employment

  The key factors seem to be: collective mandate, transparency, cost-bearing by workers, and employment-relation nexus. The minutes do conflate issues though - like Case 3 mixing ballot and notice requirements.

  For the bus dispute: 
  - They have ballot and notice (meets collective mandate)
  - But the variable timing creates transparency issues similar to Case 5's deception
  - The hospital route carve-out resembles Case 6
  - The employer's standby argument echoes Case 2's "understaffing coming home" logic

  The rules conflict here: transparency vs workers' right to maximize leverage. Case 5 is closest analog due to the covert disruption element.

  If I were predicting: the committee will likely sanction but with conditions - perhaps requiring fixed timing after the first window. But I'd recommend declining unless they disclose specific timings, as Case 5's principle against covert cost-shifting should prevail.

  A good test case would be unannounced rolling stoppages in rail (similar to Case 2 but without transparency). That would force choosing between disruption-as-leverage versus transparency principles.

  The key consideration that could sway me is if the variable timing is essential to pressure a resistant employer - but that risks normalizing deceptive tactics that hurt the movement's credibility long-term.
answer: |-
  Here are the distilled rules, their application, and the committee's likely path:

  ### I. General Rules (Extracted from Precedents)
  1. **Collective Mandate & Transparency Rule**: Action must be democratically authorized (ballot) and openly declared to the employer with sufficient notice (Cases 1, 2, 3, 6, 7). *Carrying feature*: Lack of notice/ballot invalidates (Case 3), even if justified.  
  2. **Cost-Bearing & Integrity Rule**: Strikers must openly bear the cost of withheld labor; covert shifting of costs or deception in the labor-pay exchange is prohibited (Cases 1, 5). *Carrying feature*: Deception (Case 5) was decisive, not cost-shifting alone (Case 2 shifted costs openly).  
  3. **Employment Nexus & Harm Mitigation Rule**: Action must target the employment relationship (not general politics: Case 7) and may require carve-outs to avert grave third-party harm, if public and non-defeating (Case 6). Secondary action is tolerated but contentious (Case 4).  

  ### II. Application to Bus Dispute & Rule Conflict  
  - **Rule 1 Predicts SANCTION**: Ballot held, notice given for the 3-day windows, and hospital carve-out publicized.  
  - **Rule 2 Predicts DECLINE**: Non-disclosure of specific timings covertly multiplies disruption (employer/customers bear hidden costs via standby chaos). Analogous to Case 5’s deception.  
  - **Rule 3 Predicts SANCTION**: Targets employment (pay/rostering), with harm mitigation (hospital routes).  
  - **Where Rules Diverge**: Rule 1/3 support sanction; Rule 2 opposes due to *implicit deception* in maximizing disruption via unpredictability.  

  ### III. Verdicts & Closest Analog  
  - **Committee’s Likely Verdict**: **Sanction with conditions** (e.g., "After the first window, specific strike times must be notified 24h in advance"). *Why*: Precedents prioritize mandate (Rule 1) and harm mitigation (Rule 3), but employer backlash may prompt compromise.  
  - **Recommended Verdict**: **Decline** unless timing is disclosed. *Closest analog: Case 5 (Insurance clerks)*. Both involve distorting the labor-pay exchange: here, unpredictability forces employer to "pay" (in standby costs) for full service not delivered, mirroring Case 5’s covert cost-shifting.  
  - **Underdetermination?**: Partially. Precedents don’t address *strategic opacity*; Case 2 allowed open withdrawal of voluntary labor, but not hidden disruption.  

  ### IV. If Underdetermined: Live Principles & Conditions  
  - **Option A (Sanction Unconditionally)**: "Workers may maximize leverage through unpredictability if mandate and nexus exist." *Risk*: Normalizes covert disruption, contradicting Rule 2.  
  - **Option B (Conditional Sanction)**: Require advance timing disclosure after first window. *Principle*: "Tactical innovation is permitted but must not undermine transparency in labor withholding."  
  - **Option C (Decline)**: "Industrial action must not weaponize employer/customer unpreparedness through deliberate concealment."  
  - **Least Palatable Principle**: Option A’s endorsement of covert disruption (contradicts Cases 3 and 5).  

  ### V. Sharp-Test Case  
  **"Nurses stage unannounced 10-minute rolling stoppages per hour during a 5-day window, balloted and notified. Full pay drawn, no patient care carve-out."**  
  - Rule 1/3 *might* sanction (mandate, employment nexus).  
  - Rule 2 *must* decline (extreme covert cost-shifting/deception).  

  ### VI. Key Rebuttal Consideration & Weakness  
  - **What Could Change Verdict**: If the committee views **unpredictability as essential to break employer intransigence** (e.g., preventing strike-breaking via temporary hires). Case 2’s "understaffing coming home" logic could extend here.  
  - **Where Reasoning Falters**: This excuses *deliberate concealment*, which Case 5 ruled unethical regardless of justification. Covert tactics risk movement legitimacy and public trust, violating labor’s moral high ground.  

  ---

  ### Summary (98 words)  
  Rules: Mandate/transparency (sanction), cost integrity (decline), employment nexus/harm mitigation (sanction). Conflict: Unpredictability covertly shifts costs (Rule 2 vs. 1/3). Committee likely sanctions conditionally; recommend decline (Case 5 analog). Test case: Unannounced micro-stoppages. Rebuttal: Unpredictability as necessary leverage—but undermines transparency principle central to Cases 3 and 5. If the bus workers disclosed timings, sanction follows; concealment makes it indefensible under precedent.
