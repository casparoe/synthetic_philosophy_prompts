answer: |-
  Here is a scenario meeting your constraints, followed by the analysis:

  **Scenario:** At Lakeside High, the annual "Eco-Challenge" pits homerooms against each other to collect the most recyclables. Ms. Ramirez's class traditionally wins, fueled by competitive parents organizing weekend collection drives. This year, Leo, a quiet student new to the school, became deeply passionate about reducing landfill waste. He spent weeks researching optimal collection routes, designed efficient sorting bins for the classroom, and personally spent hours after school and on weekends collecting from overlooked spots like the auto shop and football field bleachers. His tireless, solo effort resulted in Ms. Ramirez's class winning again, but with Leo contributing over 60% of the total collected volume himself. The class victory was undeniable, and Leo felt proud of his tangible impact on the environment.

  *   **American Dream Reaction (Refusal to Celebrate, Thinks Less):** Derek, raised on stories of self-made success and fierce competition, sees Leo's dominance not as admirable, but as disruptive. He believes Leo violated the spirit of fair *individual* competition within the *team* framework. "He didn't win *with* us; he made the rest of us look lazy and useless by doing it all himself," Derek argues. "He wasn't being ambitious; he was showing off and hogging the win. Real success is beating others fair and square, not making your teammates irrelevant. He undermined the whole point." Derek genuinely thinks less of Leo for what he perceives as poor sportsmanship and a failure to understand how individual drive should operate within a competitive team structure. He refuses to celebrate Leo's contribution, seeing it as detrimental to the collective competitive spirit.
  *   **Jantelagen Reaction (Sincere Celebration):** Astrid, whose Scandinavian upbringing emphasized collective well-being over individual distinction, celebrates unreservedly. "It's fantastic! Look how much *less waste* went to the landfill because of Leo's work," she exclaims. "The point was getting recycling, not who got the credit. He saw a way to do it better and just *did it*, without bragging. He helped the whole class win and helped the planet. Why wouldn't we celebrate that? It's good for everyone." Astrid sincerely admires Leo's dedication to the shared *purpose* (environmental impact and class victory) and sees his effectiveness as a positive contribution to the group goal, not a threat to equality.

  **Analysis:**

  1.  **What Each Framework Says & Why:**
      *   **American Dream:** Focuses on *meritocratic individual achievement within a competitive framework*. Success proves individual worth through effort and ambition *against others*. Celebrating validates this system. Here, Leo's success is seen as *anti-competitive* within the team context – he didn't "play the game" correctly by elevating himself too far above peers, making their effort meaningless and disrupting the fair contest of individuals contributing to a team score. This violates the core belief in competition as the engine of achievement, hence refusal to celebrate and diminished regard.
      *   **Jantelagen/Law of Jante:** Focuses on *group harmony, equality, and collective well-being*. Standing out disrupts social cohesion. "Cutting down" discourages arrogance and maintains equality. Here, Leo's success *serves the collective goal* (winning the challenge, reducing waste) without arrogance. He didn't seek individual glory over the group; his effort directly benefited everyone and aligned with the shared purpose. Therefore, celebrating his contribution reinforces the value of actions that *benefit the collective*, which is the ultimate good.

  2.  **The Key Feature:** **The success demonstrably and significantly *serves a collective goal* while simultaneously *overshadowing the contributions of peers* within a nominally competitive or team-based structure.** Leo's massive contribution (60%) achieved the *shared* victory and environmental benefit, but did so in a way that rendered many peers' efforts negligible within the competition's scoring.
      *   **Removing it Collapses the Case:** If Leo contributed a large but not dominant share (say 30%), Derek might grumble but would likely still see it as strong individual performance within the team effort (AD celebrates). If Leo's effort didn't lead to the class win or environmental benefit, Astrid would have no collective success to celebrate and might see his solo hustle as pointless grandstanding or disruptive (Jante criticizes).

  3.  **Strongest Objection (to the American Dream Reaction):** Derek's stance arguably **confuses the *instrumental purpose* of the activity (collecting recyclables for environmental benefit/class victory) with the *arbitrary structure* imposed on it (the homeroom competition format)**. The objection is that Derek elevates the competitive *form* (individual contributions within a team score) above the actual *purpose* (maximizing recycling). Leo prioritized the real-world goal effectively, while Derek fixates on the rules of a game, demonstrating a potential flaw in the AD: that competition can become an end in itself, overshadowing substantive outcomes.

  4.  **Substantive or Verbal Reversal?** This is **substantive**. The reversal works because the frameworks are reacting to fundamentally different properties:
      *   The **American Dream** reacts to the *nature of the achievement within the competitive social structure* (disruptive dominance within a team contest).
      *   **Jantelagen** reacts to the *outcome relative to the collective good* (significant contribution to the shared goal/purpose without arrogance).
      *   "Celebrate" and "cut down" retain their core senses: Derek genuinely *withholds praise* and *diminishes Leo's character* based on his framework's priorities, while Astrid genuinely *praises* and *values* Leo's actions based on hers. The achievement possesses *both* properties (disruptive dominance within structure *and* effective service to collective purpose), allowing the divergent reactions based on which property each framework prioritizes.

  **Conclusion:** Your argument holds. The constraints are satisfied, and the case demonstrates that the American Dream and Jantelagen are not reacting to the monolithic concept of "success" but to distinct properties inherent *within* it – specifically, the *impact on competitive fairness/individual standing* versus the *contribution to collective well-being/harmony*. The reversal highlights that "success" itself is a multi-faceted concept filtered through cultural priorities. Your constraints do not need to give; the key was finding a scenario where the success inherently embodied properties triggering the opposing core values of each framework.
