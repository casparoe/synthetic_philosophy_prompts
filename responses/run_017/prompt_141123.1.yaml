answer: |-
  The judge's assertion that "the facts speak for themselves" is deceptively simple. Its meaning and defensibility shift dramatically depending on the level of ambition we assign to it. Let's walk through the spectrum, considering what it claims, its nature, its plausibility, and whether it delivers his desired conclusions.

  At its most platitudinous, the sentence might merely assert that **historical events happened independently of our later interpretations of them**. This is a straightforwardly **metaphysical** claim about the reality of the past. It’s **trivial and defensible** – the shooting occurred regardless of whether we later call it a mutiny or a massacre. However, this minimal reading does *nothing* to support the judge's conclusions. It doesn’t tell us *which* events happened (only that *something* did), how we know about them, how we assemble them into a coherent narrative, or how to handle conflicting accounts based on the same thin evidence. It certainly doesn't imply that more archive digging will resolve the fundamental interpretive clash between "mutiny" and "massacre," nor that stripping away explicit framing yields neutrality. It simply affirms a basic realism about the past, which neither historian likely disputes.

  A slightly stronger, **epistemic** reading might claim that **the surviving traces (reports, tallies, letters, oral histories) contain within them a single, unambiguous story about the past, directly accessible to any careful observer**. This is **substantive but highly doubtful**. The problem isn't carelessness; it's that the traces are fragmentary, generated from specific perspectives (colonial police, missionaries, later generations), and silent on crucial aspects (the women, the strikers' intent). A firing report doesn't announce whether the crowd constituted a mutiny or a market gathering; that requires placing it within a larger context – your second "job." This reading fails spectacularly on the judge's points. The *existence* of the two conflicting accounts, produced by careful historians from the *same* box, demonstrates that the traces do *not* speak univocally. More archive *might* help (finding a striker's diary would be transformative), but it might not, especially for the women erased from the record. Presenting the traces without framing isn't neutral; it presents the *colonial administration's perspective* as the baseline "fact," implicitly favoring the "mutiny" narrative because the police reports dominate the archive. The absence of the women isn't merely a lack of facts; it's a *fact about* the colonial system's exclusionary record-keeping.

  A **methodological** reading could mean **historians should restrict themselves to statements directly verifiable by the surviving traces, avoiding any synthesis or higher-level description**. This is **normative advice** posing as description. It’s **substantive and largely indefensible** in practice. Could an exhibit only list: "Firing report dated X: 14 shots fired. Hospital tally: 8 admissions. Oral History Y: 'My father said they shot people in the field.'"? This avoids explicit "mutiny" or "massacre" labels (your third job), but it fails as history. It doesn’t tell us what *happened*, only what some documents *say*. Crucially, it doesn't solve the core interpretive divergence. Deciding *which episode a trace belongs to* (your second job) is already interpretive. Is the oral history about the same event as the firing report? Placing them together assumes a connection – a minimal framing. Furthermore, this approach buries the judge's problem rather than solving it. Visitors *will* synthesize these fragments, likely imposing their own implicit frames, which could be far less informed or more ideological than a historian's explicit, argued interpretation. It also utterly fails the women in the fields; their absence from the records means they vanish entirely under this "just the facts" regime. Their killing isn't a "fact" here, only the later oral testimony *about* it is.

  The strongest, most ambitious reading is **metaphysical and epistemic**: **There is one true, complete description of the past event ("as it actually was"), and it is fully determined by the totality of what happened, potentially knowable in principle, and capable of adjudicating between competing narratives like "mutiny" and "massacre" solely through the accumulation of evidence, without requiring irreducible interpretive choices.** This is **substantive and straightforwardly false** based on historical practice and philosophy. It ignores the constitutive role of the historian's questions, concepts, and narrative structures. Your three jobs aren't separable; deciding a trace *is* evidence (Job 1) often depends on the episode you think it belongs to (Job 2), which shapes the apt description (Job 3). The sceptical pressures bite precisely at the joints between these jobs. The same physical actions (police firing) *can* belong to different, equally factually supported episodes – a mutiny suppression, a market-day massacre, *or* a botched exercise – depending on how we interpret the intent of the crowd, the perception of the police, and the context. No amount of evidence will *force* a single emplotment (tragedy, farce, accident); the choice involves weighing significance, motive, and consequence, areas where the "facts" underdetermine the narrative. This reading utterly fails the judge's conclusions. Disagreement might *persist* even with more evidence because the framing isn't just a gap in knowledge, but a choice in perspective. An exhibit stripped of explicit framing isn't neutral; it presents the traces *as* the facts, privileging the perspectives that generated the records (colonial authorities) and obscuring the silences (the women, the strikers). The absence of the women *is* a fact the slogan ignores – a fact about power and erasure, not a lack of historical reality.

  Regarding your apparatus and questions: Your three jobs are heuristically useful but deeply intertwined. The "world alone" might settle some micro-facts (e.g., a bullet was fired at time T), but *no* job – assigning evidential status, placing within an episode, choosing apt description – is free of interpretive choice. The world doesn't tell us if a shot is evidence of mutiny or massacre; that requires situating it within contested understandings of agency and context. Scepticism bites hardest at the transition from trace to evidence (Job 1, especially with silences) and from evidence-sequence to emplotted narrative (Jobs 2 & 3).

  The archive's silences are critical. If "the facts" are only what the records contain, then the women literally didn't exist *as historical facts*. This is not just incomplete history; it's a **political verdict masquerading as metaphysics**, accepting the colonial gaze as definitive. The only defensible view is that the killing of the women *is* a historical fact, knowable through later oral tradition, and their *absence from the contemporary record* is itself a crucial historical fact about the nature of the colonial state.

  Your historian-swap test is insightful but tricky. A strong believer in interpretive neutrality (the flawed methodological reading) would predict convergence: same facts, same conclusions. Most plausible readings, recognizing the role of framing, predict *continued divergence*. Political sympathies shape *which traces are deemed significant*, *how they are connected* (Job 2), and *what concepts are applied* (Job 3). A historian sympathetic to colonial order might downplay the oral history or read the crowd's gathering as inherently threatening, favoring "mutiny." A historian sympathetic to the strikers might emphasize the hospital tally and oral history, interpreting the gathering as non-threatening, favoring "massacre." Swapping sympathies would likely swap the dominant narrative constructed *from the same box*. The test *does* isolate the role of pre-existing perspective, but it also shows how perspective shapes the very perception of the "facts" within the trace – what stands out, what gets connected, what seems explanatory. It rigs the result *against* the notion that facts alone dictate the narrative.

  Ranke's "wie es eigentlich gewesen" (how it actually was) is *not* the same as the judge's crude slogan. Ranke aimed for rigorous, evidence-based history that transcended partisan myth-making, emphasizing the particularity of the past. It shares the minimal metaphysical realism of the first reading. However, Ranke himself engaged in significant interpretation, synthesis, and narrative construction. His motto is best seen as an **aspiration to objectivity through method and source criticism, not a denial of interpretation**. It avoids the strongest, false readings of the judge's claim by acknowledging the historian's active role in reconstructing the past from traces. It doesn't promise that facts "speak for themselves" without mediation, nor that all disagreements vanish with more evidence, nor that a framing-free presentation is possible or desirable. Its difficulties are those of achieving reliable historical knowledge, not the incoherence of denying interpretation's necessity. It founders on the same problems of perspective, narrative, and silence as any historical method, but it doesn't build denial of these problems into its core premise like the judge's strongest claims do.

  In essence, the judge's sentence, beyond its barest assertion of a real past, collapses under scrutiny. It cannot support his conclusions because it misunderstands how historical knowledge is built from fragmentary, perspectival traces within inescapable frameworks of understanding. The disagreement between your historians isn't just about missing evidence; it's about fundamental choices in framing that more archives might refine but won't necessarily dissolve. Presenting "just the facts" isn't neutral; it's an interpretive choice with profound political implications, silently endorsing the perspective of the record-keepers and erasing those they excluded. The facts don't speak; we speak *for* them, and we must do so with critical awareness of the silences and choices involved.
