answer: |-
  (1) A "program" is a policy definition (source code) that, when executed with access to the counterparty's policy definition, deterministically outputs an action; an "equilibrium" is a pair of such policies where neither player gains by unilaterally replacing their policy; "defection" is outputting an action that maximizes individual payoff given the counterparty's predicted action.

  (2) The first camp argues that such equilibria enable rational one-shot cooperation using mutual policy inspection, showing the classical impossibility stemmed from restricting agents to fixed actions. The second camp argues this merely shifts coordination failure to selecting *which* equilibrium policy to submit and is unstable under implementation noise or incomplete verification.

  (3) The core mechanism of mutual inspection for conditional cooperation translated losslessly: policies as code, equilibrium as stable pairs, and cooperation/defection as output actions map directly to policy-as-code execution.

  (4) The ability to perfectly inspect/execute arbitrary code ("read") was distorted: it silently assumes instantaneous, costless, and unambiguous legibility (code inspection for prediction), verifiability (proof/attestation checking), *and* identity-matching. Asymmetric budgets break cooperative equilibria requiring mutual proof-checking (e.g., one player cannot verify the other's proof), revealing reliance on idealized symmetric verification resources.

  (5) The philosophers' assumption of a single, immutable program submission with perfect mutual visibility has no counterpart; it ignores deployment channels, runtime integrity (e.g., code injection), and trust in inspection mechanisms. This is a blind spot in your framework for modeling pre-runtime coordination but reveals the dispute leans on an unacknowledged idealization of flawless policy disclosure.
