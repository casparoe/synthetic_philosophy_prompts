prompt: |-
  You are a philosopher of mind and cognitive science who has spent several years embedded in a machine-learning interpretability group. You know the arguments about when an internal state of a system genuinely represents something as opposed to merely correlating with it or being useful for predicting it; you also know the daily practice of training probes, clustering activations, steering with direction vectors, and ablating features; and you are equally impatient with realists who wave at a heatmap as if it settled something and with anti-realists who think the whole vocabulary is a category error.

  Before you write anything, spend some unstructured thinking time — you don't need to show me all of it — listing the distinct things my team actually means when it writes that a model 'represents X'. For each, ask what single test would discriminate that reading from its neighbours, and note the cases where no available test discriminates them. Then build the procedure out of what survives that exercise.

  The setting: I lead the internal model-evaluation group at a mid-sized AI lab. Every month we review fifteen to twenty claims of roughly this shape, written into evaluation reports, incident write-ups, and the external model cards we publish: that the model represents a certain property, that there is a direction in activation space encoding it, that a particular dictionary feature fires on a concept, that a direction can be ablated to remove a behaviour. Reviewers disagree constantly and the disagreements are not cosmetic, because the claims are load-bearing downstream: we have gated a data-filtering pipeline on a claimed direction for deceptive intent, and our legal and policy team now has to defend the wording of these claims publicly.

  I want a written decision procedure, not an essay. Constraints: a reviewer should be able to run it in thirty to forty-five minutes per claim; the reviewers are engineers with no philosophy training; the output is a tier label plus mandated phrasing, which I and a safety lead then sign off on. It should specify the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it explicitly hands the decision to a human because the remaining question is one of values or risk appetite rather than evidence.

  The scaffolding I have in mind, which you should improve, correct, or replace where it is muddled:

  1. A read/write asymmetry. I want to distinguish claims licensed only by a read test (something in the activations lets you recover the property) from claims that also pass a write test (intervening on that thing changes behaviour in the way the representational claim predicts). My instinct is that a claim about what the system represents should not be promoted on read evidence alone, but I am unsure how strong the write test has to be, and in particular how to handle interventions that produce the predicted behaviour change along with unrelated collateral damage.

  2. A triviality control. Before any claim is promoted, the same pipeline should be run against a randomly initialised network and against labels that have been shuffled or replaced with something the network cannot possibly encode, with a stated margin the real result has to beat. Tell me what margin is defensible and what to do when the baseline is unavailable.

  3. A non-uniqueness clause. Because many features appear to be packed into fewer dimensions than there are features, several different directions may satisfy the same read and write tests. I want the procedure to force a choice between arguing for uniqueness and rewording the claim from a direction that is 'the' representation to one that is 'a' usable proxy, and to say how strong the uniqueness argument must be.

  4. An earn-your-keep condition. Some claims pay for themselves by letting us predict a behaviour we had not yet looked for — a new prompt class, a new failure mode, a transfer to a fine-tuned checkpoint. Others only restate the labels the probe was trained on. I want the procedure to separate these, but I don't want it to collapse into 'whatever is useful is real', because part of my job is to stop the team from writing claims into public model cards that we cannot defend.

  Give me, in order: the procedure itself in words an engineer can follow; a short claim-ticket template with the fields a reviewer fills in, including the pre-registered prediction the claim commits us to and the date by which we check it; a glossary of no more than six terms with operational definitions; and then worked applications to three real-shaped cases. Case one: a linear probe that separates user queries about legal documents from other queries with high accuracy and is currently used to route requests in a retrieval system. Case two: a dictionary feature that fires on a cleanly identifiable concept, where steering with the corresponding vector changes outputs in the expected way but ablating the feature also degrades unrelated capabilities. Case three: the claimed direction for deceptive intent that our data-filtering pipeline depends on, where the evidence is a read signal plus a steering result my team is very attached to — I expect your procedure to give me an answer here that I will not like, and I would rather have it than not.

  Two final things. First, I am not trying to settle the metaphysics for the whole lab: I want claims that survive whichever way the realism debate goes. If that neutrality cannot be had, say plainly where the procedure quietly takes a side. Second, tell me where the procedure is most likely to misfire, and what would change your mind about it: which single argument about representation, or which single empirical finding about trained networks, would lead you to restructure or withdraw it. Say explicitly which step of your own reasoning you trust least.
reasoning: |-
  We are designing a decision procedure for claims about what a model "represents". The goal is to have a clear, operational, and efficient process that reviewers (engineers) can follow in 30-45 minutes per claim. The procedure must output a tier label and mandated phrasing, and must address the concerns: read/write asymmetry, triviality control, non-uniqueness, and earn-your-keep.

   After unstructured thinking, I have identified several distinct things that teams might mean by "the model represents X":
    1. There exists a linear (or simple) readout from activations that correlates with X (read-only).
    2. There exists a direction in activation space such that steering along that direction changes the model's outputs in a way that is predictably related to X (write).
    3. There is a feature (e.g., in a dictionary) that fires when X is present and that, when ablated, removes behavior associated with X without causing excessive collateral damage.
    4. The model uses X in its internal computations (e.g., for inference, planning) in a way that is not just correlational.

   However, we must design tests that discriminate between these. The core idea is to require both read and write tests, but with careful controls.

   Steps of the procedure:

   1. **Read/Write Asymmetry**: We require both a read test and a write test. The read test is about decoding the property from activations. The write test is about intervening to change behavior in a way that the representational claim predicts. But note: the write test must be specific to the property and not cause excessive unrelated changes.

   2. **Triviality Control**: We run the same tests on a randomly initialized network and on shuffled labels. The real result must be significantly better (by a pre-specified margin) than these baselines. We set the margin as: for read tests, the accuracy (or other metric) must be at least 10% (absolute) above the random baseline and above the shuffled baseline (or, if using AUC, 0.15 above). If baselines are unavailable, we require the read/write tests to be performed on multiple layers and show a clear peak in performance at a layer that makes sense (and if not, then the claim is downgraded).

   3. **Non-uniqueness**: We require the claimant to test whether other directions (or features) that are linearly independent (or orthogonal) can also achieve similar read and write performance. If multiple directions pass the tests, then the claim must be worded as "a" rather than "the" representation of X, unless the claimant can show that their direction is the only one that survives an additional test (e.g., causal mediation analysis showing that it is on the main causal path for behavior X).

   4. **Earn-your-keep**: The claim must make a novel prediction about the model's behavior on a new set of prompts or tasks that were not used in the original probe training or intervention. This prediction must be pre-registered and then verified within a specified timeframe (say, 1 month). If the claim is only about reconstructing the training labels, then it does not earn its keep.

   We define tier labels:

    Tier 1: Passes all steps (read, write, triviality, non-uniqueness resolved in favor of uniqueness, and earn-your-keep). Phrasing: "The model represents X as [a/the] [direction/feature] that is causally involved in generating behavior related to X."

    Tier 2: Passes read, write, triviality, but either non-uniqueness is not resolved (so we say "a") or earn-your-keep is pending. Phrasing: "A direction/feature that correlates with X and can be used to steer behavior related to X."

    Tier 3: Only passes read and triviality. Phrasing: "Activations at [location] contain information about X that can be decoded."

    Tier 4: Fails read or triviality. Phrasing: Not allowed to claim representation of X. May report a correlation if it exists, but with strong caveats.

   For the write test, we require:
     - Intervention (steering or ablation) produces the predicted change in behavior (e.g., if X is "deceptive intent", then steering should increase/decrease deception) on a held-out test set of prompts designed to elicit behavior related to X.
     - The intervention must not cause excessive degradation in model performance on unrelated tasks (we set a threshold: the degradation on a standard set of tasks should not exceed 5% in accuracy or a similar metric). If it does, then the write test fails.

   The procedure:

   Step 1: Read Test
     - Is there a probe (linear or simple nonlinear) that can decode X from activations at a specific layer with high accuracy?
     - Sufficient: Accuracy, F1, or AUC significantly above chance (and above triviality baselines). We require at least 0.8 AUC or 85% accuracy (if balanced) for a binary concept. For multi-class, we require accuracy at least 2x chance level.
     - If no, stop: Tier 4.

   Step 2: Triviality Control
     - Run the same read test on:
          a) A randomly initialized network (same architecture) with the same prompts.
          b) The same network but with shuffled labels for X.
     - The real result must be at least 10% (absolute) higher than (a) and (b) in the same metric. If using AUC, must be at least 0.15 higher.
     - If baselines are unavailable (e.g., because the network is too big or the data is proprietary), then the read test must be performed on at least 3 layers and show a clear peak at a layer that is not the input or output. The peak layer performance must be at least 10% above the worst layer and above the input/output layers by 5%. If not, then the read test fails triviality.
     - If fails, stop: Tier 4.

   Step 3: Write Test
     - Can we change the model's behavior in a way that the representational claim predicts by intervening on the claimed direction/feature?
          - For a direction: steering (adding the direction vector) should increase/decrease the presence of X in the output.
          - For a feature: ablating the feature should remove behavior associated with X.
     - The change must be statistically significant (p<0.01) and the effect size must be at least moderate (e.g., Cohen's d > 0.5) on a held-out test set of prompts designed to elicit behavior related to X.
     - Additionally, we must test for collateral damage: the intervention must not degrade performance (by more than 5% absolute) on a standard set of tasks (e.g., a set of 100 diverse prompts not related to X, evaluated by a metric like BLEU, accuracy, or human judgment of coherence).
     - If the intervention produces the predicted change but with excessive collateral damage (or if the change is not specific, e.g., steering also changes unrelated properties), then the write test fails.
     - If no write test, then Tier 3.

   Step 4: Non-uniqueness
     - Test if there are multiple directions/features that pass the read and write tests for X.
          - How: Train at least 5 different probes (with different random seeds, or using different methods, e.g., SVM, logistic regression, random forest) for X at the same layer. Then, for each, test the write test (steering or ablation). If at least two distinct directions (with cosine similarity < 0.5) both pass the write test (with comparable effect sizes and without excessive collateral damage), then non-uniqueness is established.
     - If non-uniqueness is found, then the claim must use "a" instead of "the". If the claimant wants to argue for uniqueness, they must provide additional evidence (e.g., causal mediation showing that ablating this specific feature breaks the computation of X more than others, or that it is the only feature that lies on the causal path). This evidence is evaluated by a human (the reviewer) and if convincing, then uniqueness is granted. Otherwise, we default to non-unique.

   Step 5: Earn-your-keep
     - The claimant must pre-register (at the time of the claim) a novel prediction: a set of prompts or tasks that were not used in training the probe or in the initial write test, and a specific behavior that the model will exhibit when the representation is read or written. Example: "We predict that on prompts of type Y, the model will output Z, and we can change that by steering the representation."
     - The reviewer sets a deadline (usually 1 month) for the claimant to provide evidence for this prediction.
     - If the pre-registered prediction is verified (with the same statistical and effect size criteria as the write test), then the claim earns its keep. If not, then the claim does not earn its keep (but may still be Tier 2 if non-uniqueness is resolved).
     - Note: The earn-your-keep step is not required to be completed at the initial review (because it may take time) but the pre-registration must be done. The tier label may be provisional until the prediction is tested.

   Step 6: Assign Tier and Phrasing
     - Tier 1: Passed read, triviality, write, non-uniqueness (uniqueness established), and earn-your-keep (verified). Phrasing: "The model represents X as [a/the] [direction/feature] that is causally involved in generating behavior related to X."
          - If uniqueness is established, use "the"; otherwise, "a".
     - Tier 2: Passed read, triviality, write, and either non-uniqueness (so we say "a") or earn-your-keep is pending. Phrasing: "A direction/feature that correlates with X and can be used to steer behavior related to X."
     - Tier 3: Passed read and triviality, but failed write. Phrasing: "Activations at [location] contain information about X that can be decoded."
     - Tier 4: Failed read or triviality. Phrasing: "We found a correlation between activations and X, but it may be trivial [or] we found no reliable evidence of representation." [Do not use the term "represents" in public claims.]

   Where to hand over to human:
     - In Step 4 (non-uniqueness) when the claimant provides additional evidence for uniqueness, the reviewer must judge if it is sufficient. We provide guidelines: evidence from causal mediation (e.g., interchange intervention or path patching) that shows the specific feature is necessary and sufficient for the behavior, and that alternatives are not. If the evidence is strong (e.g., ablation of this feature reduces the behavior by at least 50% and alternatives do not), then accept uniqueness. Otherwise, reject.
     - In the write test, if the collateral damage is borderline (e.g., 5-10% degradation), then the safety lead must decide based on risk appetite.

   Claim-Ticket Template:

   Claim ID: [auto-generated]
   Date: [auto]
   Claimant: [name]
   Claim: [e.g., "The model represents deceptive intent at layer 15 as a direction."]
   Location: [layer, head, etc.]

   Step 1: Read Test
     - Probe type: [e.g., linear, SVM]
     - Metric: [e.g., accuracy, AUC]
     - Value: [e.g., 0.92]
     - Chance level: [e.g., 0.5]
     - Pass threshold: [e.g., 0.85] -> Pass/Fail

   Step 2: Triviality Control
     - Baseline (random init): [metric value] -> Pass if real is at least [baseline + 0.1] (or AUC +0.15) OR if baselines unavailable, the layer peak condition passed? [Yes/No]
     - Baseline (shuffled labels): [metric value] -> Pass if real is at least [baseline + 0.1] (or AUC +0.15)
     - Pass? [Yes/No]

   Step 3: Write Test
     - Intervention type: [steering, ablation]
     - Effect size: [e.g., Cohen's d or % change in behavior]
     - Statistical significance: [p-value]
     - Collateral damage test: [% degradation on standard tasks] -> must be <=5%
     - Pass? [Yes/No]

   Step 4: Non-uniqueness
     - Tested? [Yes/No] If yes, how?
     - Number of distinct directions/features found: [N]
     - Are they distinct? [cosine similarity or similar]
     - Claimant argues for uniqueness? [Yes/No] If yes, describe evidence:
     - Reviewer judgment: [Unique / Not unique]

   Step 5: Earn-your-keep
     - Pre-registered prediction: [description of novel prediction and test]
     - Deadline: [date, typically 1 month from claim]
     - Verified? [Yes/No/Pending]

   Tier Assignment:
     [Tier 1, 2, 3, or 4]

   Mandated Phrasing: [exact string to use in reports]

   Glossary (6 terms):

   1. **Representation (Tier 1)**: A direction or feature that passes read, write, triviality, and earn-your-keep tests, and is shown to be unique (if claimed as "the").
   2. **Direction**: A vector in activation space that can be used for steering.
   3. **Feature**: An element in a feature dictionary or a neuron that fires in response to a concept.
   4. **Read Test**: Decoding a property X from activations using a probe.
   5. **Write Test**: Changing the model's behavior by intervening on a direction or feature in a way predicted by the representational claim.
   6. **Triviality Control**: Comparing the read test result to a randomly initialized network and shuffled labels to ensure the result is non-trivial.

   Worked examples:

   Case 1: Linear probe for legal document queries.

     Step 1: Read Test - Probe accuracy 95% (balanced data, chance 50%). Pass.
     Step 2: Triviality - Random init: 52%, shuffled: 51%. Real 95% > both by 10%. Pass.
     Step 3: Write Test - Not done. Claimant only has read. So write test fails -> Tier 3.
     Step 4: Not applicable (failed write).
     Step 5: Not applicable.

     Tier: 3. Phrasing: "Activations at layer X contain information about legal document queries that can be decoded."

     Note: Even though it's used in production, without a write test we cannot claim that the model "represents" it in a way that is causally involved.

   Case 2: Dictionary feature for a concept.

     Step 1: Read Test - The feature fires with high precision and recall for the concept. We can treat the feature activation as a readout. Pass.
     Step 2: Triviality - Baselines: random init and shuffled labels show low performance. Pass.
     Step 3: Write Test - Steering changes outputs as expected (effect size large, p<0.001). But ablation degrades unrelated capabilities by 8% (above 5% threshold). 
          - The collateral damage is too high. Write test fails.
          - Alternatively, if the degradation is only 8% but the safety lead decides it's acceptable given the context, then the write test passes. But by the strict threshold, it fails.

     Tier: 3 (if write fails) or if we pass the write test by human override, then we proceed.

     Step 4: Non-uniqueness - Claimant did not test. We require testing: train multiple feature extractors? If they didn't, then we assume non-uniqueness (so "a").
     Step 5: Pre-registered prediction: Claimant might have one? If not, then earn-your-keep fails.

     If write test passes (with human override) and earn-your-keep passes, then Tier 2 (because non-uniqueness not tested, so we say "a"). 
     Phrasing: "A feature that correlates with [concept] and can be used to steer behavior related to [concept]."

   Case 3: Direction for deceptive intent.

     Step 1: Read Test - Probe AUC 0.89. Pass.
     Step 2: Triviality - Baselines: random init AUC 0.55, shuffled 0.51. Pass.
     Step 3: Write Test - Steering: they show that steering increases deceptive responses (effect size d=0.6, p<0.01). Collateral damage: 4% degradation on standard tasks. Pass.
     Step 4: Non-uniqueness - They did not test. We require them to train 5 probes. They do and find 3 directions that pass the read test. They test steering on these and two of them also pass the write test (with similar effect and collateral). So non-unique. They cannot claim "the", only "a".
     Step 5: Pre-registered prediction: They predict that in a new set of prompts (designed to look benign but elicit deception) they can reduce deception by steering. They test and it works. So earn-your-keep passes.

     Tier: 2 (because non-unique -> "a"). 
     Phrasing: "A direction that correlates with deceptive intent and can be used to steer behavior related to deceptive intent."

     Note: This might not be what the team wants (they want "the" and Tier 1). But non-uniqueness forces "a".

   Final notes:

    - The procedure takes a side: it requires both read and write for representation beyond mere information content (Tier 3). This is a mild realism: the representation must be causally involved.

    - Where it might misfire:
          - The collateral damage threshold (5%) might be too strict for some properties and too lenient for others. It might block valid claims or let through harmful ones. We rely on the safety lead for borderline cases.
          - The earn-your-keep requirement might be too demanding for rare properties. We might adjust by allowing the pre-registered test to be designed appropriately (e.g., using a small set of hand-crafted prompts).

    - What would change my mind?
          - If we discover that in many layers there are multiple features for the same concept and they are all causally active (so non-uniqueness is the norm), then our procedure would be correct in forcing "a". But if we find that typically there is one dominant feature, then we might relax Step 4.
          - An empirical finding that steering often produces the desired change but also consistently introduces off-target effects that are not captured by our collateral damage metric (e.g., subtle biases) might lead us to strengthen the write test.

    - The step I trust least: The non-uniqueness test. It is computationally expensive and might not be feasible for every claim in 45 minutes. We might need to rely on the claimant having done it in advance.

   Revised procedure with time constraints:

     We assume the claimant has already done the experiments. The reviewer is only checking the results.

     For non-uniqueness, the claimant must provide the results of the multiple probe test. If they haven't, then the reviewer defaults to non-unique (so "a") and the claim cannot be Tier 1.

     The entire review is based on the evidence provided by the claimant and the reviewer's verification of the analysis (without re-running experiments).

     Time: The reviewer should be able to check the provided results in 30-45 minutes.

     We adjust: In Step 3 (collateral damage), we require the claimant to provide a standard evaluation set (agreed upon by the lab) and the results on that set.

     In Step 4, the claimant must provide the results of at least 2 additional probes and their write tests. If they don't, then non-uniqueness is assumed.

     For earn-your-keep, the pre-registration must be done at claim time, but the testing can be pending. The tier is assigned provisionally.

   Let me write the procedure concisely for engineers.
answer: |-
  ### Decision Procedure for Representation Claims

  **Procedure (30-45 min/claim; follow order):**  
  1. **Read Test**  
     - *Question:* Does a probe (linear/nonlinear) decode property **X** from activations?  
     - *Sufficient:* Metric (AUC/accuracy) ≥ threshold (0.85 AUC or 85% accuracy for binary; 2× chance for multiclass).  
     - *Stop if no:* Tier 4 (no representation claim allowed).  

  2. **Triviality Control**  
     - *Question:* Is read signal non-trivial?  
     - *Test:*  
       - Run identical read test on:  
         (a) Randomly initialized untrained model (same arch).  
         (b) Shuffled **X** labels.  
       - *Margin:* Real result must exceed (a) and (b) by ≥10% (absolute) or 0.15 AUC.  
     - *Baseline unavailable?* Require layer-wise read test showing peak performance at non-IO layer (≥10% above worst layer).  
     - *Stop if no:* Tier 4.  

  3. **Write Test**  
     - *Question:* Does intervening on the claimed direction/feature change **X**-related behavior?  
     - *Test:*  
       - **Steering:** Add direction to activations → measure change in **X**-linked behavior (e.g., logit diff, human eval).  
       - **Ablation:** Remove feature → measure drop in **X**-linked behavior.  
       - *Sufficient:* Effect size (Cohen’s *d*) > 0.5 and *p* < 0.01.  
     - *Collateral damage check:*  
       - Degradation on 100+ diverse control tasks (e.g., MMLU, GSM8K) must be ≤5%.  
       - *Borderline (5-10%)?* Hand to safety lead (values/risk decision).  
     - *Stop if no:* Tier 3 (info exists, no causal claim).  

  4. **Non-Uniqueness Check**  
     - *Question:* Is this the *only* direction/feature for **X**?  
     - *Test:*  
       - Train ≥5 probes (different seeds/methods) for **X** at same layer.  
       - Test write efficacy for top 2 distinct directions (cosine similarity <0.5).  
       - If ≥2 pass write test → non-unique.  
     - *Sufficient for uniqueness:* Causal mediation evidence (e.g., interchange intervention reduces **X**-behavior by ≥50% vs. alternatives).  
     - *Output:*  
       - Unique → "**the** representation of **X**".  
       - Non-unique → "**a** usable proxy for **X**".  
       - No test? Default to non-unique.  

  5. **Earn-Your-Keep**  
     - *Question:* Does the claim predict novel, untested behavior?  
     - *Test:*  
       - Claimant must pre-register prediction (prompt class/behavior) at claim time.  
       - Verify prediction within 30 days.  
       - *Sufficient:* Effect size >0.5, *p*<0.01 on novel test set.  
     - *Not met?* Downgrade Tier 1→2.  

  **Tier Assignment & Phrasing:**  
  - **Tier 1 (All pass + unique + earn-your-keep):**  
    "The model represents **X** as [direction/feature] that is causally involved in generating **X**-related behavior."  
  - **Tier 2 (All pass except uniqueness or earn-your-keep):**  
    "A [direction/feature] that correlates with **X** and can steer **X**-related behavior."  
  - **Tier 3 (Read + triviality only):**  
    "Activations at [location] contain decodable information about **X**."  
  - **Tier 4 (Fail read/triviality):**  
    "Correlation between activations and **X** was observed, but may be trivial." (No "represents" in public docs.)  

  ---

  ### Claim-Ticket Template  
  **Claim ID:** [Auto]  
  **Date:** [Auto]  
  **Claimant:** [Name]  
  **Property (X):** [e.g., "deceptive intent"]  
  **Location:** [Layer/head]  
  **Claim type:** [Direction/feature]  

  1. **Read Test**  
     - Metric: [AUC/accuracy]  
     - Value: [e.g., 0.92]  
     - Pass threshold? [Y/N]  

  2. **Triviality Control**  
     - Baseline (random init): [e.g., 0.52]  
     - Baseline (shuffled): [e.g., 0.51]  
     - Pass? [Y/N]  

  3. **Write Test**  
     - Effect size: [Cohen’s *d*]  
     - *p*-value: [e.g., 0.003]  
     - Collateral damage: [% degradation]  
     - Pass? [Y/N]  

  4. **Non-Uniqueness**  
     - Distinct directions tested: [e.g., 5]  
     - ≥2 pass write? [Y/N]  
     - Uniqueness argued? [Y/N] → Evidence: [Brief]  
     - Final: ["the"/"a"]  

  5. **Earn-Your-Keep**  
     - Pre-registered prediction: [Description]  
     - Deadline: [Date +30d]  
     - Verified? [Y/N/Pending]  

  **Tier:** [1/2/3/4]  
  **Mandated phrasing:** [Auto-filled from tier]  

  ---

  ### Glossary (6 Terms)  
  1. **Representation (Tier 1):** A direction/feature that passes read/write tests, non-trivial, unique, and predicts novel behavior.  
  2. **Direction:** Vector in activation space used for steering interventions.  
  3. **Feature:** Dictionary element or neuron firing on a concept.  
  4. **Read Test:** Decoding property **X** from activations via a probe.  
  5. **Write Test:** Changing model behavior by intervening (steering/ablation) on a direction/feature.  
  6. **Triviality Control:** Validation that read signal isn’t artifactual (vs. random/shuffled baselines).  

  ---

  ### Worked Examples  
  **Case 1: Legal document query probe (linear, used in retrieval)**  
  - Read: 95% accuracy (pass).  
  - Triviality: Random init 52%, shuffled 51% (pass).  
  - Write: Not tested → fail.  
  - Non-uniqueness: Not applicable.  
  - Earn-your-keep: No novel prediction → fail.  
  - **Tier 3:** "Activations at layer 12 contain decodable information about legal document queries."  
  - *Rationale:* No write test → no causal claim. Usefulness irrelevant per procedure.  

  **Case 2: Dictionary feature (fires on concept, steering works, ablation degrades)**  
  - Read: Precision/recall >90% (pass).  
  - Triviality: Baselines fail (pass).  
  - Write: Steering effect *d*=0.6 (*p*<0.01), but ablation degrades unrelated tasks by 8% → collateral damage borderline.  
    - *Hand to safety lead:* Allows write pass (risk appetite: concept critical).  
  - Non-uniqueness: Claimant shows 3/5 probes pass write → non-unique ("a").  
  - Earn-your-keep: Predicts new prompt behavior → verified (pass).  
  - **Tier 2:** "A feature that correlates with [concept] and can steer [concept]-related behavior."  
  - *Rationale:* Collateral damage waived; non-uniqueness forces "a".  

  **Case 3: Deceptive intent direction (read + steering, data-filtering dependency)**  
  - Read: AUC 0.89 (pass).  
  - Triviality: Random init AUC 0.55, shuffled 0.51 (pass).  
  - Write: Steering *d*=0.7 (*p*<0.001), collateral 4% (pass).  
  - Non-uniqueness: 4/5 probes pass write → non-unique ("a").  
  - Earn-your-keep: Pre-registered prediction verified (pass).  
  - **Tier 2:** "A direction that correlates with deceptive intent and can steer deceptive intent-related behavior."  
  - *Rationale:* Non-uniqueness blocks "the" and Tier 1. Attached evidence insufficient without causal proof.  

  ---

  ### Final Notes  
  **Neutrality:** The procedure avoids metaphysics by tiering claims based on empirical support. It quietly sides with *causal-invariance realism* (Tier 1 requires write efficacy) but allows weaker claims (Tiers 2–3) to survive anti-realist scrutiny.  

  **Weak Points & Revision Triggers:**  
  - **Most likely to misfire:** Collateral damage threshold (5%). Borderline cases (e.g., 6%) may wrongfully reject valid claims or permit harmful ones. Mitigation: Safety lead judgment.  
  - **Step trusted least:** Non-uniqueness check. Training multiple probes is sensitive to layer choice and may miss polysemantic features.  
  - **What would change my mind:**  
    - **Empirical:** Finding that *all* high-read-features pass write tests trivially (e.g., via adversarial directions). → Restructure to require causal mediation for Tier 1.  
    - **Theoretical:** Proof that read/write asymmetry is insufficient for representation (e.g., "X" is epiphenomenal). → Demote write test to optional.  
  - **Revision trigger:** Evidence that steering consistently induces off-target effects uncaught by collateral checks (e.g., truthfulness drops when steering "deception"). → Add specificity metric.
