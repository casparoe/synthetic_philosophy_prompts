  ### Designed Activity: The Sealed-Report Protocol for Epiphenomenalism and the Paradox of Phenomenal Judgment

  This activity uses a tactile "sealed-report" protocol to create a tangible, experiential understanding of the paradox. Students confront the tension between report accuracy and personal authorship, simulating how epiphenomenalism severs the causal link between experience and report. The design emphasizes *correlation without causation*, setting up reveals that mirror the philosophical problem. Below, I provide the full blueprint, defend it against alternatives, and state what it establishes.

  ---

  ### **Roles**
  1. **Experiencer (E)**: Feels the item in the box and decides whether to sign the pre-printed report or write their own. All 16 students act as E in Round 1; in Round 2, 8 students are E (half with mismatched items, half with empty boxes).
  2. **Blind Reporter (BR)**: Does not touch the box (blindfolded) and decides whether to sign the pre-printed report or write their own. In Round 2, 8 students are BR (paired with E).
  3. **Proctor (P)**: Manages setup, timing, and reveals. Played by you (the instructor), with one student volunteer to assist with materials.
  4. **Scorer (S)**: Tracks team scores. Played by you or a student volunteer (use a whiteboard for transparency).

  **Why these roles?**  
  - E embodies the "first-person reporter" with potential experience.  
  - BR simulates a report *without* experience, forcing students to confront how a report can exist independently.  
  - P and S ensure smooth execution without philosophical framing.  

  ---

  ### **Materials List and Setup**
  **Materials** (all inexpensive/common):  
  - **16 opaque boxes** (e.g., shoeboxes with lids; cover with paper if translucent).  
  - **Tactile item set**: 5 distinct items (e.g., fine sandpaper, coarse sandpaper, felt, steel wool, smooth stone). Use 3–4 duplicates to cover all boxes.  
  - **Sealed report cards**: 32 pre-printed slips (16 for Round 1, 16 for Round 2) in sealed envelopes. Reports read: "I feel [item name]" (e.g., "I feel sandpaper").  
  - **Blank cards and pens**: 16 blank cards and 8 pens (students share).  
  - **Blindfolds**: 8 scarves/bandanas (for BR in Round 2).  
  - **Scoreboard**: Whiteboard or large paper.  
  - **Station codes**: Numbered slips (1–16) for stations.  
  - **Master key**: Your private list mapping stations to items/reports (see below).  

  **Setup (10 minutes before class or during intro)**:  
  1. Arrange 16 stations (tables/chairs) in a circle for interaction. Each station has:  
     - One box with one tactile item (Round 1) OR no item/mismatched item (Round 2).  
     - One sealed envelope with a pre-printed report.  
     - One blank card and pen (shared between pairs in Round 2).  
  2. Pre-set items/reports using the master key:  
     - **Round 1**: All stations have matching items/reports (e.g., Station 1: sandpaper in box, report: "I feel sandpaper").  
     - **Round 2**:  
       - Stations 1–4: Mismatched item (e.g., box has felt; report says "I feel sandpaper").  
       - Stations 5–8: Empty box (report says "I feel [item X]").  
       - Stations 9–16: Same as 1–8 (duplicated for 16 students).  
  3. Divide students into two teams (A and B) of 8. Assign stations randomly.  

  ---

  ### **Minute-by-Minute Timeline (80 Total Minutes)**
  **0:00–0:10 (10 min): Introduction and Setup**  
  - **P says**: "We’re doing a team activity about accurate reporting. Each of you will interact with an object in a box and decide how to report what you feel. Teams earn points for accurate reports but lose points for errors. Follow the rules at your station—no talking during tasks."  
  - Assign teams/stations. Emphasize: "Your goal is to maximize team points."  
  - *No philosophical terms or framing*.  

  **0:10–0:25 (15 min): Round 1 (Correlation Without Causation)**  
  - **P says**: "At your station, there’s a box and a sealed envelope. Do this:  
    1. Open the box, feel the item inside (no peeking!), and form your experience.  
    2. Open the envelope and read the pre-printed report.  
    3. Decide: Sign your name on the pre-printed card to adopt it, OR set it aside and write your own report on a blank card.  
    4. Submit your report to your team’s collection box.  
    - Scoring: Signing a correct report = +5 pts; signing wrong = -5 pts. Writing correct = +10 pts; writing wrong = -10 pts."  
  - Students act (5 min). Proctor collects reports.  
  - **Reveal (P says)**: "Before we score, notice: All pre-printed reports were generated yesterday based on station codes—not your experiences. Now, let’s see what happened."  
  - P/S score publicly:  
    - Match item to report. Most reports will be correct (since all match).  
    - Expected outcome: >80% sign pre-printed cards (safe +5 pts). Few write own reports (risk of -10 outweighs +10 bonus).  
  - **Key reveal**: "You signed a report you didn’t create because it matched your experience. But that report existed before you felt anything—it was caused by the station setup, not your experience."  

  **0:25–0:45 (20 min): Round 2 (Broken Correlation and Reports Without Experience)**  
  - **P says**: "New roles: Half of you are Experiencers (E)—feel the item if there is one. Half are Blind Reporters (BR)—put on a blindfold, do NOT touch the box. BRs: Imagine you’re having an experience, but don’t touch.  
    - E and BR at the same station get identical pre-printed reports.  
    - Each decides independently: Sign or write your own report. Same scoring."  
  - Assign roles: At each station, one E, one BR (8 E, 8 BR).  
  - Students act (10 min). P collects reports.  
  - **Reveal (P says)**: "This time, reports were pre-printed from station codes, not experiences. But some boxes were empty or had mismatched items. Let’s score."  
  - P/S score:  
    - Stations 1–4 (mismatched): E feels wrong item (e.g., feels felt; report says "sandpaper").  
    - Stations 5–8 (empty): E feels nothing; report claims an item.  
    - BRs have no experience.  
  - Expected outcome:  
    - Most E sign pre-printed reports (habit from Round 1), leading to wrong reports (-5 pts). Some E write correct reports (e.g., "I feel felt" or "I feel nothing") for +10.  
    - BRs often sign pre-printed reports (no experience, so guessing), leading to wrong reports (-5).  
  - **Key reveal**: "Reports were identical for E and BR at each station—same pre-printed words. But BRs had no experience, and E sometimes had none or a mismatch. Yet reports were submitted. Accuracy depended on luck, not experience."  

  **0:45–0:60 (15 min): Round 3 (Sorting Reports: The Knowledge Problem)**  
  - **P says**: "Take all signed reports from Round 2 and pile them here. As a class, sort them into two groups:  
    - Group 1: Reports from someone who FELT something.  
    - Group 2: Reports from someone who felt NOTHING (BRs or E with empty boxes).  
    You have 5 minutes. Use only the report text—no names, stations, or handwriting clues."  
  - Students sort. P observes.  
  - **Reveal (P says)**: "Time’s up. Let’s see who actually had experiences."  
  - P checks reports against master key:  
    - Group 1 should contain only E from mismatched stations (they felt something, even if wrong).  
    - Group 2 contains BRs and E from empty stations.  
  - Expected outcome: Sorting fails (>50% errors). Students cannot reliably distinguish reports with/without experience because:  
    - Pre-printed reports are identical for E and BR.  
    - Handwritten reports may be similar (e.g., E with empty box writes "I feel nothing"; BR guesses "I feel nothing").  
  - **Key reveal**: "You couldn’t tell which reports came from experiences. The words alone don’t reveal their origin—even accurate reports could be from blind guessers."  

  **0:60–0:80 (20 min): Debrief and Philosophical Mapping**  
  - **P starts**: "Let’s connect this to the reading. You encountered a paradox: If experiences don’t cause reports, how can reports be about experiences or count as knowledge? In this activity:  
    - The pre-printed report was like a 'phenomenal judgment'—it described an experience but wasn’t caused by it.  
    - The station code was the 'physical cause' (like a brain state), generating both the item (which caused your experience) and the report."  
  - **Map moments to claims**:  
    - **Round 1**: Students signed reports that *correlated* with their experience but were *caused by the station* (not the experience). Shows **correlation ≠ causation**. *Philosophical link*: Epiphenomenalism says experiences are caused by physical states but cause nothing—reports are caused by physical states too, so correlation is coincidental.  
    - **Round 2**: Reports existed for empty boxes (no experience) or mismatches (wrong experience). BRs produced reports without experiences. Shows **reports can exist without experiences**. *Philosophical link*: If experiences do no causal work, reports are fixed by physical states alone—so they’d be the same even if experiences were absent or different.  
    - **Round 3**: Failure to sort reports by experience origin. Shows **reports don’t carry marks of their causal history**. *Philosophical link*: If reports aren’t caused by experiences, we lose the link that makes them *about* experiences or grounds *knowledge* (introspection becomes unreliable).  
  - **Address the modal gap**: "In the activity, when we removed the experience (empty box), we changed the physical setup. But in epiphenomenalism, the physical state could be identical while the experience varies. Imagine: Same station code (same brain state), but no experience. The report would still exist, unchanged. Your signature on it wouldn’t make it knowledge—it’d be a lucky guess, like a BR’s report."  
  - **Transition to discussion**: "In groups of 4, discuss: When you signed a correct report in Round 1, did you *know* what you felt? Why or why not?" (5 min). Then, open class dialogue (5 min).  

  ---

  ### **Scoring Scheme (Team-Based)**  
  - **Round 1**:  
    - Sign correct: **+5**  
    - Sign wrong: **-5**  
    - Write correct: **+10**  
    - Write wrong: **-10**  
  - **Round 2**: Same as Round 1, scored per report (E and BR separate).  
  - **Total scores**: Sum of Rounds 1 and 2. Announce winning team for engagement.  
  - **Why this scheme?** The +10/-10 for writing creates tension: Accuracy favors signing (safe +5), but authorship is rewarded only if you risk -10. In Round 1, signing dominates; in Round 2, writing is incentivized but risky.  

  ---

  ### **What Will Predictably Go Wrong**  
  1. **Students treat it as a guessing game**: Some will focus on "winning" points, missing the paradox. *Mitigation*: Debrief explicitly ties actions to philosophy. Use the reveals to highlight the "why" behind outcomes.  
  2. **Reverse-engineering station codes**: Clever students might notice reports match station numbers. *Mitigation*: Use random codes (e.g., station numbers not sequential) or emphasize that this *reinforces* the point—reports are fixed by external causes.  
  3. **Accuracy incentive swamps authorship**: In Round 1, most sign for +5; few risk writing. *Mitigation*: The authorship bonus (+10) is high enough to tempt some, but the high risk (-10) makes signing rational—this mirrors the paradox’s tension (we prioritize accuracy over authorship).  
  4. **"I signed because it was true" reply**: Students may say signing is fine if the report is correct. *Mitigation*: Use Round 2 to show correctness can be accidental (BRs) and Round 3 to show reports don’t encode their origin.  

  **What the activity cannot reproduce**:  
  - **The modal heart**: We cannot physically hold the "station code" (brain state) fixed while varying experiences. Empty boxes change the physical setup. *Solution*: Address this verbally in debrief: "In epiphenomenalism, identical brain states could produce reports with no experiences. Our activity approximates this with BRs, but it’s not perfect—we need philosophy to fill the gap."  

  ---

  ### **Defense of Design Against Alternatives**  
  **Why this mechanism?**  
  - **Sealed-report protocol**: Creates a direct analogue for pre-existing "phenomenal judgments" uncaused by experience. Alternatives (e.g., students generate reports for each other) lack the "pre-existing" element, diluting the causation-correlation tension.  
  - **Tactile (not visual)**: Avoids verbal-fluency biases (e.g., describing colors) and ensures focus on the causal link.  
  - **Three-round arc**:  
    - Round 1 establishes correlation without causation.  
    - Round 2 breaks correlation and introduces reports without experiences.  
    - Round 3 challenges knowledge and aboutness.  
    Alternative sequences (e.g., starting with sorting) would feel abstract; this build-up makes the paradox visceral.  

  **Rejected alternatives**:  
  - **No teams/scoring**: Without stakes, students might not feel the tension between accuracy and authorship. Scoring makes the norm tangible.  
  - **Solo activity**: Teams add peer pressure to "not let others down," amplifying the tension.  
  - **Visual stimuli**: Could introduce language biases (e.g., "red" vs. "crimson"), muddying the focus on causation.  

  ---

  ### **What the Activity Establishes About the Paradox**  
  **Where the pressure falls**: Primarily on **introspective reporting as a case of knowledge**.  
  - **Why?** The activity shows that accurate reports can arise without experiences (BRs) or independent of experiences (pre-printed cards). In Round 3, students see reports don’t carry information about their causal origin, undermining the claim that we "know" our experiences through reporting—even when reports are correct, they could be lucky guesses (like a BR signing a correct report by chance).  
  - **Secondary pressure**: On **aboutness**. If reports aren’t caused by experiences, their "aboutness" is coincidental (like a pre-printed report matching an experience by station code).  

  **Strongest epiphenomenalist reply**:  
  - "Reports are reliably correlated with experiences due to a common physical cause (the brain state/station code), so they still constitute knowledge—like a thermometer reliably correlating with temperature."  
  - **Do students’ actions undermine this?** **Yes.** In Round 3, they failed to distinguish reports with/without experiences, showing that correlation alone doesn’t grant the ability to discern genuine knowledge. The BR’s "lucky" correct report (if it occurred) demonstrates reliability isn’t sufficient—knowledge requires appropriate causal connectivity.  

  ---

  **Final Note**: This activity makes the paradox *felt*, not just abstract. By the debrief, students have grappled with the gaps in causation, aboutness, and knowledge through action. Use the discussion to transition to textual analysis, asking: "How does this challenge Jackson’s Mary or Chalmers’ zombie argument?" This bridges the experiential to the theoretical.
