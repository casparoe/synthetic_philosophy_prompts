  The core tension here is epistemological: can we really gain moral knowledge from narratives about others' lives, or is this just reinforcing pre-existing principles? The user seems especially concerned about two vulnerabilities - whether the "labels" actually come from the reader's prior moral framework (making biographies decorative), and whether fiction could serve the same purpose (undermining Plutarch's reliance on real lives).

