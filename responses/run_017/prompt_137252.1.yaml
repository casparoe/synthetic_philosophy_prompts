prompt: |-
  Hi — I work incident response at a mid-size cyber insurance and managed-detection outfit. We handle somewhere around 150 ransomware and data-extortion cases a year: usually me plus a duty analyst on a call, two to six hours to decide whether we authorize a payment, legal and a director signing off, and the client (often a small hospital, a school district, a county) sitting in the room wanting an answer yesterday. What I need is a procedure, not an essay.

  The reason I'm asking about this stuff specifically: our internal arguments have been going in circles for about six months, and from what I can tell we've independently reinvented a loop that decision theorists already have names for. One side says: the files are already encrypted, the data is already out, the intrusion already cost them money, so nothing we pay now changes any of that — the only live question is what paying does from this moment forward. The other side says: fine, but the reason this client got picked, and the reason the note is sitting in the inbox at all, has something to do with what they expected us to do, and if we're the kind of outfit that pays we get picked more, and the future version of us is worse off. Then the first side says the decision today can't change whether we were already the kind of outfit that pays. And round we go.

  Two setups were described to me as capturing the structure, roughly:

  - Counterfactual mugging: a very reliable predictor flips a coin in private. If it comes up heads and the predictor expected you to hand over $100 in the tails case, it quietly deposits $10,000 and you're never asked for anything. If it comes up tails, it turns up and asks for $100. You've been asked. Nothing you do now changes how the coin landed. Do you pay?
  - XOR blackmail: a letter arrives offering to save your house from termites for a fee. You know the letter gets sent exactly when either there's an infestation and the sender expects you to refuse, or there isn't one and they expect you to pay — one or the other, not both. The letter is here. Do you pay?

  What I want is the usable content of those two puzzles, and of whatever the fight between the two ways of answering them actually turns on, turned into something my team can run at 3am. Concretely: an ordered set of questions, what counts as a good enough answer to each, the points where the answer is just "no", and the points where the procedure has to stop and hand things to a person because it's a values call rather than a factual one. Assume the analyst running it has no decision-theory background at all, has twenty to thirty minutes, and has to write the output down in a form the director and our compliance file can both live with.

  Four ways our real cases aren't the puzzles, and the procedure has to survive them:

  1. Our predictors are bad. Attackers aren't anywhere near perfect predictors. They read proxies: whether the client carries cyber insurance, what sector it's in, anything public we've said, whether somebody paid under similar circumstances last year. So whatever the argument for paying (or for refusing) is, it should degrade smoothly as prediction gets worse instead of flipping at some point, and it needs to say what to do when we genuinely have no idea how good the proxy is — which is most of the time.
  2. Two audiences, not one. Whoever we're dealing with right now will definitely find out what we did, and may well come back at the same target again (repeat extortion is common). The wider population of attackers will mostly learn nothing beyond a leak or a court filing eight months later. I'm fairly sure those are separate channels that should get separate weights, and I don't want a procedure that silently adds them together.
  3. The note itself carries information. Sometimes the demand is boilerplate; sometimes it names specific files, or a backup server, or the client's insurer by name, and the timing and the phrasing are themselves clues about how we were selected and what they think they know. I want a step that asks what the arrival and the content of the demand tell us, and what they make irrelevant — not just "did a crime happen".
  4. Legibility isn't free. We've talked about publishing a no-concessions charter, except that half our clients' policies only reimburse a ransom if we haven't publicly committed to never paying one, and a public charter only does any work if attackers can read it and believe it. So "just credibly precommit in advance" is not an answer I can use; I need the procedure to treat precommitment as something with a price and a reliability, and to say where it belongs in the ordering.

  Please also give me worked applications to three cases, with the reasoning actually shown rather than just the verdicts: one ordinary hospital ransomware case (encrypted systems, backups partly intact, no exfiltration claimed), one where a small client has already had the same actor come back a second time after we paid once, and one where the procedure spits out an answer I'm going to hate. My guess is that last one is either paying in a case where the money plainly does nothing for the victim sitting in front of me, or refusing where somebody's going to lose records they can't get back — if you think the unwelcome answer is somewhere else entirely, use that instead and say why.

  And a closing section on what the procedure can't do: where it will misfire, what it's structurally blind to, and which of its steps are judgment calls dressed up as procedure. Be explicit wherever you're smuggling in a choice about whose welfare counts, what counts as a cost, or what we're trading against what — I'd rather see the smuggling than have it hidden inside a checklist.

  Last thing: tell me how confident you are in the different moving parts of what you've given me, and single out the one bit you're least sure of. If the honest answer is that one of my four complications has no good answer in the usual way people think about these two puzzles, say that plainly instead of inventing something smooth — I'd rather have a hole I know about than a step my analysts trust and shouldn't.
reasoning: |-
  We are designing a decision procedure for ransomware payment authorization. The goal is to break the circular argument about whether paying now affects future targeting (deterrence) versus only considering the immediate consequences.

  Key insights from decision theory:
  - The "counterfactual mugging" highlights that if the attacker's decision to target you was based on a prediction of your behavior, then your current action can affect the incentive structure for future predictions. However, if the prediction is already made and the event has occurred, paying in the tails scenario (when you are asked) might be necessary to maintain the incentive for the predictor to set up the heads scenario (where you get $10,000 without paying). But note: in our case, the "heads" scenario is not getting attacked (because the attacker predicted you wouldn't pay and thus didn't attack? Actually, in the mugging, heads is when you get the reward without being asked). This is a bit abstract.

  - The "XOR blackmail" is about the signal your action sends. By paying, you are effectively telling the blackmailer that their model (which led them to send the letter) was correct. This might encourage them to send more letters in the future. However, if the letter is sent only in one of two mutually exclusive scenarios, your action reveals which scenario it was.

  But we have real-world complications: attackers are imperfect predictors, there are two audiences (the current attacker and the wider population), the demand note carries information, and precommitment is costly and imperfect.

  We need a step-by-step procedure that:
  1. Captures the immediate consequences of paying vs. not paying.
  2. Considers the signaling effect to the current attacker (who may return) and to the wider attacker population.
  3. Incorporates the information from the note and the context of the attack.
  4. Handles imperfect predictors and the cost of precommitment.

  The procedure must be run by an analyst in 20-30 minutes and produce a written output for the director and compliance.

  Proposed Procedure: Ransomware Payment Authorization Protocol (RPAP)

  Step 0: Immediate Triage
     - Confirm the incident: Is it an active ransomware or data extortion case? (If not, exit procedure.)
     - Verify that the client is covered for this incident under their policy. (If not, exit procedure; no payment authorization possible.)
     - Document: Time of first contact, client details, attacker alias (if known), and initial assessment of impact.

  Step 1: Assess Immediate Harm and Alternatives
     - Question 1: What is the immediate harm that can be avoided by paying? (e.g., decryption keys for irreplaceable data, prevention of data leak, restoration of critical systems)
     - Question 2: What alternatives to paying exist? (e.g., backups, workarounds, third-party decryption tools)
     - Question 3: What is the estimated cost of recovery without paying? (Include downtime, lost business, recovery efforts, etc.)
     - Question 4: What is the attacker's demand and the total cost of payment (including any fees)?

     - Threshold: If the immediate harm is negligible (e.g., full backups available and tested, no exfiltration) and alternatives are viable, then recommend non-payment and exit. Otherwise, proceed.

  Step 2: Evaluate the Attacker's Knowledge and Selection (The Note as Signal)
     - Question 5: What does the note (and the attack method) reveal about the attacker's knowledge?
        - Consider: Did they mention specific systems, data, or the insurance policy? Did they target backups? How accurate is their information?
     - Question 6: What proxies might the attacker have used to select this target? (e.g., public information about the client, sector, insurance, past incidents)
     - Question 7: Based on the note and the attack, how confident are we that the attacker has:
        a. Actually encrypted data that cannot be recovered otherwise? (Scale: High/Med/Low)
        b. Exfiltrated data? (High/Med/Low, and if so, what data?)
        c. The capability to provide a working decryption key? (High/Med/Low, based on intelligence on the actor)

     - Output: A summary of the attacker's apparent capabilities and knowledge. This helps in assessing the reliability of their threats and the likelihood of future interactions.

  Step 3: Assess the Predictor Quality (Imperfect Predictors)
     - Question 8: How good a predictor do we think this attacker (or the group they represent) is? Consider:
        - Historical accuracy: Have they correctly assessed victims' payment likelihood in the past? (If known)
        - Resources: Are they a sophisticated group with intel capabilities, or a commodity attacker?
        - How did they get their information? (e.g., from public sources, prior access, etc.)
     - Question 9: How much of the attacker's decision to target this client was likely based on a prediction of our payment behavior? (Scale: High/Med/Low influence)

     - Note: If the attacker's prediction quality is low (or we have no idea), then the deterrence effect (the "future version of us" argument) is weaker. We default to Low if unknown.

  Step 4: Two Audiences - Current Attacker and Wider Population
     We separate the effects on the current attacker (who is in the room, so to speak) and the wider population.

     A. Current Attacker (Repeat Extortion Risk):
        - Question 10: Is this the same attacker that has targeted this client before? (If yes, what happened last time? Did we pay? Did they come back?)
        - Question 11: How likely is it that this attacker will return to the same client if we pay? (e.g., because they see the client as a soft target)
        - Question 12: How likely is it that this attacker will return if we don't pay? (e.g., because they think they can pressure us)

        - Note: Paying might encourage the same attacker to return (if they see it as profitable) but might also discourage if they expect non-payment next time? Actually, if we pay, they may come back soon. If we don't pay, they might give up on this target.

     B. Wider Attacker Population (Deterrence):
        - Question 13: How visible is this incident and our response? (Will other attackers learn about it? How? When?)
        - Question 14: How much weight should we give to the deterrence effect on the wider population? (Consider: How many attackers are likely to know about our response? How much do they care? How does our action change their incentive to target similar clients?)

        - Note: This effect is often weak because visibility is low and delayed.

     - Output: Two separate assessments (current attacker and wider) for the impact of payment on future targeting.

  Step 5: Precommitment and Its Cost
     - Question 15: Is there a precommitment in place? (e.g., a public no-concessions policy? A private one? None?)
     - Question 16: How credible is this precommitment to the attacker? (e.g., if we have a public policy but have paid in the past, it's not credible)
     - Question 17: What is the cost of violating a precommitment? (e.g., loss of credibility, which might encourage more attacks; also, policy implications for insurance coverage)
     - Question 18: What is the cost of establishing or reinforcing a precommitment by refusing to pay? (e.g., the immediate harm to the client, and the potential for reputational damage if the client suffers)

     - Note: Precommitment is only useful if it is credible and known. If we don't have one, then we are in a situation where each case is evaluated on its own.

  Step 6: Decision Matrix
     Now we weigh the factors.

     A. Immediate Net Benefit (NB_immediate) of paying:
          = (Harm avoided by paying - Cost of payment) - (Harm that cannot be avoided even if we pay) 
          - But note: harm avoided is the value of decryption/not leaking minus the cost of recovery without paying? Actually, we can think of it as:
            NB_immediate = (Cost of recovery without paying - Cost of recovery with paying) - Payment amount
            But this might be negative if payment is high and recovery without paying is cheap.

          Alternatively, we can think of the net immediate benefit as:
            = (Value of avoided harm) - (Payment amount)
          where "Value of avoided harm" is the difference between the loss if we don't pay and the loss if we do pay (without considering future effects).

     B. Future Costs (FC) of paying (or not paying):
          We break into two:
          FC_current = Expected cost from future attacks by the same attacker on the same client
          FC_wider = Expected cost from future attacks by other attackers on any client (due to signaling)

          How to estimate FC_current?
            - If we pay, the probability of repeat attack by same attacker (P_repeat_pay) and the expected cost of that attack.
            - If we don't pay, the probability of repeat attack (P_repeat_refuse) and expected cost.
            Then: 
              FC_current(pay) = P_repeat_pay * Expected cost of repeat attack
              FC_current(refuse) = P_repeat_refuse * Expected cost of repeat attack

          Similarly for FC_wider, but it's harder. We might assign a qualitative score (High/Med/Low) and a direction (positive if paying increases future attacks, negative if it decreases).

     C. Precommitment effect (PC):
          - If we have a precommitment and we violate it, we lose credibility. This might lead to more attacks in the future. Assign a cost for that.
          - If we don't have a precommitment and we refuse, we might build credibility for the future. This might lead to fewer attacks. Assign a benefit.

     However, we cannot do precise math. Instead, we use a scoring system.

     Proposed scoring:

     We assign a score for each of the three main factors (Immediate, Current Attacker Future, Wider Future) on a scale from -2 (strong argument against payment) to +2 (strong argument for payment), and then a Precommitment factor that adjusts.

     Factor 1: Immediate Net Benefit
        +2: High net benefit (e.g., avoid catastrophic harm at relatively low payment)
        +1: Moderate net benefit
         0: Neutral
        -1: Net cost (payment is high and avoids little harm)
        -2: High net cost (payment is very high and avoids negligible harm)

     Factor 2: Current Attacker Future Effect (same attacker, same client)
        Consider: 
          - If paying is likely to lead to repeat attacks (bad), then negative.
          - If refusing is likely to lead to repeat attacks (bad), then positive for paying? Not exactly.

        We are trying to minimize future harm. So:

          Score_current = - [ (Probability of repeat if pay * Expected harm) - (Probability of repeat if refuse * Expected harm) ]

          But we can simplify:

          If paying is expected to cause more repeat attacks than refusing: then score is negative (because we want to avoid paying in that case).
          If paying is expected to cause fewer repeat attacks: then positive.

          So:
            +2: Paying significantly reduces the chance and/or impact of repeat attacks by this attacker.
            +1: Paying modestly reduces the chance/impact.
            0: No difference or unclear.
            -1: Paying modestly increases the chance/impact.
            -2: Paying significantly increases the chance/impact.

     Factor 3: Wider Attacker Population Effect (deterrence)
          +2: Refusing would send a strong deterrent signal to the wider population (so we want to refuse -> negative for payment) -> so for payment, this factor would be -2?
          Actually, we are building a score for payment. So:

          If paying encourages more attacks by other attackers (bad for payment) -> negative.
          If refusing discourages attacks (good for refusal) -> negative for payment.

          Alternatively, we can think of the effect of payment on the wider population:

            Score_wider = - [ Expected increase in attacks on other clients due to payment ]

          So:
            +2: Paying would strongly reduce future attacks by others (e.g., because it signals we are unpredictable? Unlikely) -> this is very unlikely, so we don't expect positive.
            +1: Modest reduction? Also unlikely.
            0: Neutral
            -1: Modest increase in future attacks by others
            -2: Strong increase in future attacks by others

          But note: the argument is that paying might make us a target. So we expect negative scores for payment on this factor.

     Factor 4: Precommitment
          This is an adjustment factor. We start with a base of 0.

          If we have a credible precommitment to not pay and we are considering paying:
            - Then we lose credibility, which might lead to more attacks in the future. This is a cost of paying. So we subtract: -1 or -2 depending on the credibility and the cost of losing it.

          If we have a credible precommitment and we refuse, that's good: we maintain credibility. So we add: +1 or +2? But note: we are building a score for payment. So if refusing is good for credibility, then paying is bad. So we subtract.

          Alternatively, we can set:

            Precommitment adjustment (for payment):
              If we have a precommitment to not pay and it is credible:
                  Adjustment = -2   (because violating it is very bad)
              If we have a precommitment but it's not credible:
                  Adjustment = 0    (violating doesn't hurt because no one believed it anyway)
              If we have no precommitment:
                  Adjustment = 0
              If we have a precommitment to pay (unlikely) or some other form, adjust accordingly.

          Also, if we don't have a precommitment and we refuse, we might build credibility for a future precommitment? But that's indirect. We ignore for now.

     Step 6: Sum the scores:

          Total = Score_immediate + Score_current + Score_wider + Adjustment_precommit

          If Total >= 3: Strong recommendation to pay.
          If Total >= 1: Weak recommendation to pay.
          If Total between -1 and 0: Weak recommendation to refuse.
          If Total <= -2: Strong recommendation to refuse.

     But note: the immediate factor might be dominant. Also, we must consider legal and regulatory constraints (e.g., sanctions).

     Step 7: Human Judgment and Sign-off
          - The analyst writes up the scores and the reasoning.
          - The director reviews, considering:
               a. Are there any overrides? (e.g., legal prohibitions, ethical concerns, client relationship)
               b. Is the analysis missing critical context?
          - The director makes the final call and documents it.

  Worked Examples:

  Example 1: Ordinary Hospital Ransomware
     - Encrypted systems, backups partly intact (so some data loss), no exfiltration claimed.
     - Demand: $500,000 in Bitcoin.

     Step 1: 
          Q1: Harm avoided: Without paying, they can restore from backups but lose some recent data (e.g., a week). This includes patient records, which could lead to treatment delays and potential harm. Also, downtime during recovery is critical for a hospital. Estimated harm without paying: $2 million (downtime, recovery, data loss). With paying: they get decryption quickly, downtime minimized. Harm with paying: $200,000 (payment + some recovery). So net immediate benefit: $2M - $200K = $1.8M? Actually, the net benefit of paying is the harm without paying minus harm with paying: $2M - $200K = $1.8M. But note: the payment is $500K, so the cost of payment is $500K. The harm avoided is the harm that would occur without paying minus the harm that occurs with paying: $2M - $200K = $1.8M. Then net immediate benefit = $1.8M - $500K = $1.3M. But this is positive and large -> Score: +2.

          Q2: Alternatives: Backups are available but incomplete. They might be able to reconstruct some data. But it will take time. -> No great alternative.

     Step 2:
          The note is generic. Attacker didn't mention any specific systems. They probably didn't do deep recon. They might have targeted the hospital because it's in a vulnerable sector. 
          Q7: Confidence in encryption: High. Exfiltration: Low (they didn't claim it). Capability to decrypt: High (this is a known ransomware group with a track record). 
          So no red flags.

     Step 3:
          Predictor quality: Low. They seem to have cast a wide net. They didn't even know the client had insurance (didn't mention it). 
          So deterrence effect weak.

     Step 4:
          A. Current attacker: 
              Q10: First time? Yes.
              Q11: If we pay, they might come back? Unlikely to target the same hospital soon because they know the hospital will improve defenses. But possible. Let's say low probability. 
              Q12: If we don't pay, they might not come back because they think we won't pay. 
              So paying might slightly increase the chance of repeat? But we are not sure. Score: -1 (modest increase in risk).

          B. Wider population: 
              This incident won't be widely known. The wider effect is negligible. Score: 0.

     Step 5: 
          Precommitment: None. Adjustment: 0.

     Total = +2 (immediate) -1 (current) +0 (wider) = +1 -> Weak recommendation to pay.

     But note: the immediate benefit is very strong. So we would likely pay.

  Example 2: Small Client, Second Attack by Same Actor (We Paid Once)
     - Same client, same attacker. We paid last time (6 months ago). Now they are back, demanding $200,000.

     Step 1:
          Q1: Harm without paying: They have backups now (they learned from last time). The backups are tested and can be restored in 48 hours. Downtime cost: $100,000. No exfiltration claimed. Harm with paying: $200,000 (payment) plus some minimal recovery. Net immediate benefit: Harm avoided by paying is $100,000 (the downtime cost) but we are paying $200,000 -> net cost of $100,000. So immediate score: -1 (net cost).

     Step 2:
          The note says: "We know you paid last time. Pay again." 
          This indicates they are specifically targeting because of the prior payment.

     Step 3:
          Predictor quality: High for this attacker because they have inside knowledge (they were here before).

     Step 4:
          A. Current attacker:
              Q10: Same attacker, second time.
              Q11: If we pay, they will definitely come back again (they are proving it). So high probability of repeat, and expected harm of next attack (say, $150,000). 
              Q12: If we refuse, they might not come back because they see we stopped paying. 
              So paying increases the chance of repeat significantly. Score: -2.

          B. Wider population: 
              Not visible. Score: 0.

     Step 5:
          Precommitment: None. Adjustment: 0.

     Total = -1 (immediate) -2 (current) = -3 -> Strong recommendation to refuse.

     We refuse.

  Example 3: Unwelcome Answer - Paying When It Seems Useless
     - A school district. Systems encrypted, backups were also encrypted. No exfiltration. 
     - The harm: Without decryption, they lose 10 years of student records (including special education plans, etc.) that are irreplaceable. The harm is very high (but non-monetary). 
     - The demand is $1 million. 
     - We have intelligence that this attacker often provides faulty decryption keys.

     Step 1:
          Harm without paying: Permanent loss of records -> we assign a very high value (say, equivalent to $10 million in harm). 
          Harm with paying: $1 million payment plus a 50% chance the decryption doesn't work (so expected harm: $1M + 0.5*$10M = $6M). 
          Net immediate benefit: $10M - $6M = $4M -> very positive. So score: +2.

     Step 2:
          The note is generic. Attacker didn't mention insurance. 
          Confidence in decryption: Low (50% chance). Score: still +2? But note: we are taking a risk. The analyst might mark this as +1 to account for the risk.

     Step 3:
          Predictor quality: Low (they didn't even know the backups were online and encryptable? So they got lucky).

     Step 4:
          A. Current attacker: 
              First time. If we pay, they might come back? But the client will improve. We don't know. Score: -1 (modest risk).
          B. Wider: 0.

     Step 5: 
          Precommitment: None. 0.

     Total = +2 -1 = +1 -> Weak pay.

     But the director might hate this because the chance of decryption is only 50%. So we are paying $1M for a 50% chance of avoiding $10M harm. The expected value is positive, but it's a gamble. Also, the harm is non-monetary and emotional.

     This is where the procedure produces an answer we might hate: paying a lot for a chance to recover irreplaceable data. But the immediate harm is so high that even with the risk, it might be worth it.

     However, note that Step 2's confidence in decryption was low. We might adjust the immediate score to account for risk. We did: we used expected harm. So it's included.

     But the procedure doesn't capture the fact that if the decryption fails, we've paid $1M and still have the harm. The expected value calculation is what we have.

     Alternatively, we might assign:
          Immediate score = +1 (because of the risk) -> then total=0, which is weak refuse. But that's not what we did above.

     We need to be consistent. We used expected harm, so immediate net benefit is positive. But if the analyst is very risk-averse, they might mark it as +1.

     This is a judgment call.

  What the Procedure Can't Do:

  1. It relies on subjective estimates of harm, probability, and predictor quality. These are judgment calls.
  2. It does not account for ethical considerations beyond the client's immediate welfare (e.g., the moral hazard of funding criminals). That must be handled by the director.
  3. The scoring system is arbitrary. The thresholds (e.g., +3 for strong pay) are set arbitrarily and might need calibration.
  4. The separation of current and wider effects is simplistic. There might be spillover.
  5. It doesn't capture the possibility that paying might encourage the attacker to target similar clients (same sector) even if it's not the same attacker. We put that in the wider effect, but it's hard to measure.
  6. The procedure assumes we can assign monetary values to harms. For non-monetary harms (like loss of life in a hospital), we must convert to monetary, which is uncomfortable.

  Confidence:

  - Most confident: The structure (separating immediate, current attacker, wider population) is sound and addresses the circular argument.
  - Least confident: The scoring system for the wider population effect (Factor 3). It's very hard to estimate and likely to be negligible in most cases, but we have to include it. We might be overemphasizing it.

  Regarding the four complications:

  1. Imperfect predictors: We handled by having a step to assess predictor quality and then weighting the future effects accordingly. This degrades smoothly (if predictor quality is low, the future effect scores are less extreme). But we don't have a good way to quantify "low" vs "high" beyond a rough scale.

  2. Two audiences: We separated them. This is good.

  3. Note as signal: We have Step 2.

  4. Precommitment cost: We included it as an adjustment. But note: we didn't address the cost of establishing a precommitment. That is a strategic decision outside the scope of the incident response.

  One hole: We don't have a step for legal/regulatory constraints (e.g., sanctions against the attacker). We should add that in Step 0: check if the attacker is on a sanctions list. If yes, payment is illegal and we stop.

  Revised Step 0:
     - Confirm incident and coverage.
     - Check sanctions: If the attacker is on a sanctions list (or we have reason to believe they are), then payment is prohibited. Exit with recommendation to not pay.

  We also didn't consider the possibility of law enforcement actions (e.g., if we pay, we might help track the funds). But that's rare and we can ignore.

  Final Procedure Outline:

  RPAP v1.0

  Step 0: Triage and Sanctions Check
     [ ... ]

  Step 1: Immediate Harm and Alternatives
     [ ... ]

  Step 2: Attacker's Knowledge and Note Analysis
     [ ... ]

  Step 3: Predictor Quality
     [ ... ]

  Step 4: Two-Audience Future Effects
     [ ... ]

  Step 5: Precommitment Adjustment
     [ ... ]

  Step 6: Scoring and Recommendation
     [ ... ]

  Step 7: Director Review and Final Decision

  We provide the analyst with a worksheet to fill in the scores and reasoning.

  Let me know if you need the full procedure in a formatted worksheet style.
answer: |-
  ### Ransomware Payment Authorization Procedure (RPAP)  
  **Version 1.0**  
  *For use by incident response analysts. Time limit: 25 minutes. Document all answers.*  

  ---

  #### **Step 0: Immediate Triage & Sanctions Check**  
  1. **Is this a confirmed ransomware/data extortion case?**  
     - ☐ Yes → Proceed.  
     - ☐ No → Exit procedure.  
  2. **Is the attacker on a sanctions list (OFAC, etc.)?**  
     - ☐ Yes → **STOP. Payment prohibited.** Notify legal.  
     - ☐ No → Proceed.  
  3. **Can the client legally pay (jurisdiction, sector rules)?**  
     - ☐ Yes → Proceed.  
     - ☐ No → **STOP. Do not pay.** Notify legal.  

  ---

  #### **Step 1: Immediate Harm Assessment**  
  *(Focus: What happens if we pay vs. refuse? Ignore future effects for now.)*  
  1. **What harm will occur if we REFUSE payment?**  
     - *Examples:* Permanent data loss, irreversible system damage, leak of sensitive data, critical downtime.  
     - **Scoring:** Quantify harm (e.g., "$500K downtime + $2M data loss"). If unquantifiable, use:  
       - ☐ Catastrophic (irreversible damage/loss)  
       - ☐ Severe (recoverable but costly >$X)  
       - ☐ Moderate (manageable with alternatives)  
       - ☐ Minimal (no material impact).  
  2. **What harm will occur if we PAY?**  
     - Include: Ransom amount, transaction fees, risk of decryption failure (estimate %), reputational damage.  
  3. **Are there viable alternatives to paying?**  
     - *Examples:* Backups, third-party decryptors, system rebuilds.  
     - **Threshold:** If alternatives reduce harm to <30% of ransom cost → **Recommend refusal**. Exit procedure.  
     - **Output:** Net immediate benefit (NIB) of paying = [Harm if refuse] – [Harm if pay].  

  ---

  #### **Step 2: Attacker Signal Assessment**  
  *(Focus: What does the attack method/demand note reveal? Ignore "deterrence" for now.)*  
  1. **What specific clues indicate why the client was targeted?**  
     - *Check:* Note mentions insurance? Specific files/systems? Client sector? Prior incidents?  
     - **Scoring:**  
       - ☐ High (attacker shows deep knowledge: e.g., named insurer, backup servers).  
       - ☐ Medium (generic but references sector/tactics).  
       - ☐ Low (boilerplate note).  
  2. **Based on the note, what does the attacker likely believe?**  
     - *Examples:* "They think we always pay," "They don’t know we have backups."  
  3. **Does the note suggest the attacker can be trusted?**  
     - *Check:* Ransomware variant reputation, decryption success rate, proof of decryption.  
     - **Threshold:** If decryption success likelihood <50% → **Recommend refusal**.  

  ---

  #### **Step 3: Predictor Quality & Repeat Risk**  
  *(Focus: Will THIS attacker return?)*  
  1. **Same attacker as a prior incident?**  
     - ☐ Yes → How many times? Did we pay last time?  
     - ☐ No.  
  2. **How good is this attacker at predicting our behavior?**  
     - *Consider:* Intel sources (e.g., insurance leaks, dark web chatter), attack sophistication.  
     - **Scoring (0-10 scale):**  
       - 0-3: Random/opportunistic (e.g., spray-and-pray ransomware).  
       - 4-6: Moderately informed (e.g., knows client sector).  
       - 7-10: Highly strategic (e.g., tailored to victim’s insurance).  
  3. **If we pay, probability of repeat attack on this client?**  
     - Use: Historical data (if none, estimate: ☐ >50% / ☐ <50%).  
  4. **If we refuse, probability of repeat attack?**  
     - *Note:* Refusal may deter if attacker thinks you’ll never pay.  
     - **Output:** Repeat risk score = [P(repeat|pay)] – [P(repeat|refuse)].  
       - Negative → Paying reduces repeat risk.  
       - Positive → Paying increases repeat risk.  

  ---

  #### **Step 4: Wider Population & Precommitment**  
  *(Focus: Will OTHERS attack us later?)*  
  1. **How visible is this payment decision to other attackers?**  
     - *Check:* Will this be public? Leaked? Shared in hacker forums?  
     - **Scoring:**  
       - ☐ High visibility (e.g., large client, public sector, court filing likely).  
       - ☐ Low visibility (e.g., private settlement, no leak expected).  
  2. **Precommitment status:**  
     - Does client’s policy have a public "no concessions" clause?  
     - Is it credible? (e.g., Have we ever violated it?)  
     - **Cost of violating precommitment:**  
       - High (e.g., undermines future deterrence) → Deduct 2 pts from payment score.  
       - Low (e.g., clause is ambiguous, rarely enforced) → No deduction.  
  3. **If we pay, will this encourage copycat attacks?**  
     - *Heuristic:* High visibility + high predictor quality → High risk.  
     - **Output:** Wider risk score (0–10): Estimate % increase in future attacks.  

  ---

  #### **Step 5: Decision Matrix**  
  *(Score each factor. Sum for recommendation.)*  

  | Factor                  | Score Range      | Weight | Notes                                  |  
  |-------------------------|------------------|--------|----------------------------------------|  
  | **Net Immediate Benefit (NIB)** | –5 to +5         | 3×     | +5 = Pay avoids catastrophe. –5 = Pay does nothing. |  
  | **Repeat Risk Score**   | –2 to +2         | 2×     | +2 = Pay strongly deters repeat. –2 = Pay invites repeat. |  
  | **Wider Risk Score**    | 0 to –4          | 1×     | 0 = No effect. –4 = Pay causes many future attacks. |  
  | **Precommitment Cost**  | 0 to –2          | 1×     | Deduct if paying violates credible precommitment. |  

  **Recommendation Formula:**  
  `(NIB × 3) + (Repeat Risk × 2) + (Wider Risk) + (Precommitment)`  

  - **>+10:** Strong pay.  
  - **+5 to +9:** Weak pay.  
  - **-4 to +4:** Escalate to director (values judgment).  
  - **<-5:** Strong refuse.  

  ---

  #### **Step 6: Director Escalation & Documentation**  
  - **Mandatory escalation if:**  
    - Scores fall in "values judgment" range (–4 to +4).  
    - Non-quantifiable harm (e.g., human life, cultural records).  
    - Legal/political constraints.  
  - **Document:**  
    - Scores, rationale, time constraints.  
    - Director’s final decision and override reason.  

  ---

  ### Worked Examples  

  #### **Case 1: Ordinary Hospital Ransomware**  
  - *Context:* Encrypted systems; backups 70% intact; no exfiltration; $300K demand.  
  - **Step 1:**  
    - Harm if refuse: 30% data loss ($1.5M) + 3-day downtime ($2M) = **$3.5M**.  
    - Harm if pay: $300K + 5% decryption failure risk ($175K) = **$475K**.  
    - NIB = $3.5M – $475K = **+$3.025M (Score: +4)**.  
  - **Step 2:**  
    - Note generic. Attacker didn’t mention backups/insurance → **Low targeting signal (Score: Low)**.  
  - **Step 3:**  
    - First attack. Attacker sophistication low → **Predictor quality: 2/10**.  
    - P(repeat if pay) = 30%; P(repeat if refuse) = 40% → Repeat risk = 30% – 40% = **–10% (Score: –1)**.  
  - **Step 4:**  
    - Low visibility → **Wider risk: 0**.  
    - No public precommitment → **Cost: 0**.  
  - **Decision:** `(4 × 3) + (–1 × 2) + 0 + 0 = 12 – 2 = 10` → **Strong pay**.  

  ---

  #### **Case 2: Repeat Attacker on Small Client**  
  - *Context:* Paid same actor 6 months ago; now back demanding $200K; backups available.  
  - **Step 1:**  
    - Harm if refuse: 2-day downtime ($50K) + restore from backups ($10K) = **$60K**.  
    - Harm if pay: $200K → NIB = $60K – $200K = **–$140K (Score: –3)**.  
  - **Step 2:**  
    - Note says: "We know you paid last time" → **High targeting signal**.  
  - **Step 3:**  
    - Predictor quality: 8/10 (knew client would pay again).  
    - P(repeat if pay) = 80%; P(repeat if refuse) = 30% → Repeat risk = 80% – 30% = **+50% (Score: +2)**.  
  - **Step 4:**  
    - Low visibility → **Wider risk: 0**.  
    - Precommitment: None → **Cost: 0**.  
  - **Decision:** `(–3 × 3) + (2 × 2) + 0 + 0 = –9 + 4 = –5` → **Strong refuse**.  

  ---

  #### **Case 3: Unwelcome Answer (School District Data Extortion)**  
  - *Context:* No encryption; attacker threatens to leak irreplaceable student records; $500K demand.  
  - **Step 1:**  
    - Harm if refuse: Leak of sensitive records (unquantifiable; culturally catastrophic).  
    - Harm if pay: $500K.  
    - NIB: Non-monetary harm → **Escalate to director (Score: N/A)**.  
  - **Step 2:**  
    - Note names specific files → **High targeting signal**.  
  - **Step 3:**  
    - Predictor quality: 6/10 (knew data was valuable).  
    - P(repeat if pay) = 60%; P(repeat if refuse) = 20% → Repeat risk = **+40% (Score: +2)**.  
  - **Step 4:**  
    - High visibility (public sector) → **Wider risk: –3** (paying signals vulnerability).  
    - Public "no concessions" policy → **Precommitment cost: –2**.  
  - **Decision:**  
    - Formula incomplete due to escalation.  
    - **Analyst recommendation:** Weak refuse (due to high wider/precommitment costs).  
    - **Director override:** Pays due to ethical obligation to protect children’s data.  

  ---

  ### Limitations & Blind Spots  
  1. **Structural Blind Spots:**  
     - **Morality of funding crime:** Procedure ignores ethical weights (e.g., "paying fuels ransomware economy"). Director must decide.  
     - **Non-monetary harm:** Cultural/humanitarian losses (e.g., hospital patient data) forced into monetary terms.  
     - **Predictor decay:** If attackers improve intel gathering, historical predictor quality becomes unreliable.  

  2. **Where Judgment Masquerades as Procedure:**  
     - Harm quantification (Step 1): Requires subjective valuation of "catastrophic" vs. "severe."  
     - Predictor quality (Step 3): Analyst bias can skew scores (e.g., overestimating attacker sophistication).  
     - Wider risk (Step 4): Highly speculative; defaults to 0 if no data → undervalues long-term deterrence.  

  3. **Failure Modes:**  
     - **Over-indexing on immediate harm:** Pays in cases that incentivize repeat attacks (e.g., Case 3 if not escalated).  
     - **Underestimating visibility:** Assumes non-public payments stay secret, but attackers share victim lists.  
     - **Precommitment fragility:** Credibility hinges on consistent enforcement, which this procedure can’t guarantee.  

  ---

  ### Confidence Assessment  
  - **Most confident:**  
    - Separating immediate harm (Step 1) from future signaling (Steps 3–4). Handles the "circular argument" by forcing sequential evaluation.  
    - Incorporating attacker signals (Step 2). Directly addresses your "note carries information" requirement.  
  - **Least confident:**  
    - **Wider population risk (Step 4).** We lack data on attacker information-sharing. Scoring is guesswork → Over-relies on visibility heuristics.  
  - **Unresolved Complication:**  
    - **"Predictors are bad" (your point #1).** The procedure degrades gracefully (low predictor quality → less weight on future effects), but has no answer for "unknown unknowns." If predictor quality is truly unknowable, Step 3 defaults to low (5/10), which may under/over-deter.  

  **Final Note:** This procedure doesn’t resolve the philosophical fight—it operationalizes it. By forcing explicit scoring, it replaces abstract debates ("are we the kind who pay?") with documented trade-offs.  

  ---  
  **Output:** Analyst completes RPAP worksheet → Director signs off. Audit trail for compliance.
