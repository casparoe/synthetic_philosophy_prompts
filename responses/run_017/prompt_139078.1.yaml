prompt: |-
  I'm in an advanced undergraduate seminar this term on aggregation in ethics — we opened with Taurek's classic paper on whether the numbers count, spent three weeks on the replies to it, and I've come away less sure than when I started that everyone in the literature is arguing about the same question. My term paper is supposed to take a stand, but before I take one I want the specification. What would an adequate account of the numbers question in life-and-death cases actually have to deliver in order to count as a solution? I want the list of requirements — the cases it has to get right, the distinctions it has to respect rather than collapse, the results in neighbouring areas it isn't allowed to contradict — each with the case or consideration behind it, because I've noticed that a requirement offered without a case attached to it is usually somebody's intuition wearing a suit. Fix the theory's job as follows, and tell me if fixing it that way already begs something: it is to tell a single rescuer, a stranger to everyone at risk and not herself at risk, what she morally ought to do and what she is permitted to do when she can save either a larger group or a smaller one from death but not both. I also want to know whether a theory adequate for that job thereby has to be adequate for a hospital triage officer or a ministry dividing a fixed budget between a common disease and a rare one, or whether it is respectable to have one answer for individual rescuers and another for institutions.

  Here are the materials I keep tripping over; treat them as candidate desiderata rather than as settled ones, and add the ones I've missed. First, the disjoint case — six people in one place, one in another, one trip — as against a nested case where the smaller group is a proper subset of the larger: you can rescue Ada, or you can rescue Ada together with five others, so that saving the many is also better for Ada. Does a view have to answer both the same way, and if it answers them differently is that a feature or a symptom? Second, a shrinking-crowd version: one against one, then two against one, then three against one and upward. If numbers begin to matter somewhere, where do they begin, and why isn't the cut-off arbitrary — so does continuity, or a principled threshold, belong on the list at all, or is it just a debating trick? Third, the lottery cases: one in which everyone at risk agreed in advance to a fair lottery, one in which nobody agreed, and a risk version in which the rescuer can give each of six a one-in-six chance or give one person certainty. Must a theory say something separate about chances and about consent, or does the certainty case settle them? Fourth, the small-benefit contrast: six mild headaches against one severe one, where nearly everyone aggregates without hesitation. If the theory refuses to aggregate lives, must it refuse to aggregate headaches too, or must it say what is special about the goods at stake — and is that marker a genuine requirement or a rescue attempt? Fifth, is the theory a theory of the betterness of outcomes, of permissibility, of reasons for acting, or of what a bystander may demand of the rescuer, and can numbers count in one of those registers while being inert in another? Sixth, the equality point that cuts both ways: every anti-aggregation argument I've read leans on each person mattering equally, and the aggregator replies that this is precisely why six equal claims come to more than one. What must a theory say about equal concern so that this move doesn't simply run in both directions?

  For each requirement, say what it is for and mark it non-negotiable or a preference of one camp. Then tell me which pair of desiderata you suspect cannot be jointly satisfied, whether the list as a whole is satisfiable at all (if it isn't, that is itself a result I'd be happy to report in the paper), and which single requirement does the most work in excluding candidate views. Keep the scorecard short — a few lines each for straight aggregation, the no-numbers-with-a-lottery view, a greatest-claim or greater-burden view, and a priority-to-the-worst-off view — since the criteria are the part I need, but do say which requirement each of those four trips over. And please don't give me a reading list; I already have one.
reasoning: |-
  Hmm, this is a sophisticated query from an advanced undergrad in ethics. They're grappling with Taurek's numbers problem and need help defining what counts as an adequate solution for their term paper. The core request is for a specification of requirements that any successful theory must meet in life-and-death rescue cases involving a lone rescuer choosing between groups.

  I notice several layers to unpack here. First, they're explicitly rejecting intuition-based requirements without concrete cases - a very mature methodological stance. Second, they've provided six candidate desiderata from their seminar readings, but want them systematically evaluated and expanded. Third, there's this sharp focus on institutional vs individual applications that needs addressing.

  Let me reconstruct their implicit framework. The fundamental tension seems to be between two imperatives: (1) moral individualism (each life matters separately) and (2) moral arithmetic (more lives create stronger claims). Their six cases brilliantly probe this:

  The disjoint vs nested cases test whether aggregation depends on identity relations between victims. The shrinking crowd scenario interrogates threshold problems. Lottery cases examine procedural vs outcome-based solutions. Small-benefit contrasts challenge scope consistency. The equality paradox highlights how both sides weaponize equal concern.

  Beyond these, I should add three critical requirements they missed: non-arbitrariness (to address their shrinking crowd concern), action-guidance (since they focus on what the rescuer ought to do), and invariance (whether framing affects prescriptions). Also, the demandingness constraint - we can't expect supererogatory sacrifice.

  For the institutional question: the key is recognizing that institutions have epistemic advantages and distributive responsibilities that individuals lack. A rescuer acts under partial ignorance and urgency; a ministry has deliberative capacity. So bifurcated solutions aren't necessarily ad hoc - they might track morally relevant features.

  When scoring theories: straight aggregation fails the disjoint case (treating lives as fungible counters). Lottery views stumble on consent requirements in real-world scenarios. Greatest-claim theories struggle with the shrinking crowd (why does 1v1 demand coin-flip while 100v1 doesn't?). Priority views founder on the small-benefit contrast (can't explain headache aggregation).

  The deepest conflict? Between minimal arbitrariness and discontinuity-resistance. Any non-binary view faces a sorites problem in the shrinking crowd, but binary views make mysterious jumps. This might be the fundamental tension no theory fully resolves.

  I'll organize the response by first establishing the fixed parameters (individual rescuer cases), then listing requirements with their test cases and negotiability status, followed by institutional applicability, and finally theory scoring against key criteria. The tone should remain academically rigorous but accessible - they're clearly capable of handling complexity.
answer: |-
  Your demand for specification is precisely the right move. Below is a systematized account of what an adequate theory for the *single rescuer* case must deliver, grounded in cases to avoid question-begging. I'll then address institutional divergence and score major views.

  **Fixed Job Description:** The theory must prescribe what a stranger-rescuer, not at risk, *morally ought to do* and *is permitted to do* when faced with a forced choice between saving a larger group or a smaller one from death, where saving both is impossible. This fixes the agent, relationship, stakes, and urgency.

  ### Requirements for an Adequate Theory (with Cases & Status)
  1.  **Non-Arbitrariness in Thresholds (Shrinking Crowd Case):**
      *   **What:** If the theory says numbers matter at some point (e.g., 2v1, 5v1, 100v1), it must provide a *principled* reason why they matter at *that* point and not others (e.g., why 2>1 but 1=1 requires a coin flip). It cannot rely on an arbitrary cutoff.
      *   **Case:** Progressively comparing 1v1, 2v1, 3v1,..., Nv1. Why/where does the duty to save the larger group arise?
      *   **Status:** **Non-negotiable.** A theory failing this is descriptively inadequate or irrational.

  2.  **Treatment of Disjoint vs. Nested Cases:**
      *   **What:** The theory must explicitly state whether its prescription differs between the disjoint case (Save 6 strangers OR save 1 *different* stranger) and the nested case (Save Ada alone OR save Ada+5 others), and justify any difference.
      *   **Cases:** Disjoint (6 vs 1, no overlap) vs. Nested (Save Ada alone vs. Save Ada+Ben+Chloe+etc.).
      *   **Status:** **Conditionally negotiable.** A theory *can* treat them differently *if* it provides a compelling morally relevant distinction (e.g., harming Ada by omission in nested vs. merely not benefiting in disjoint). However, sameness is simpler and often assumed. *Failing to address the distinction explicitly is a flaw.*

  3.  **Integration of Chances & Consent (Lottery Cases):**
      *   **What:** The theory must explain its stance on: (a) Giving each of 6 a 1/6 chance vs. saving 1 for sure; (b) The moral relevance of prior agreement to a lottery procedure.
      *   **Cases:** (a) Risk Case: Rescue Boat can save 1 for sure, or randomize saving one of 6. (b) Consent Case: All 7 at risk agreed beforehand to flip a coin if a rescuer faces 6v1; they didn't agree.
      *   **Status:** **Non-negotiable.** A complete theory must account for fairness, ex ante perspectives, and procedural justice alongside outcome evaluation. It need not *require* lotteries, but must *explain* their relevance (or irrelevance). The certainty case does *not* automatically settle these.

  4.  **Scope Consistency / Marker for Death (Small-Benefit Contrast):**
      *   **What:** The theory must either (a) justify aggregating small benefits (like headaches) while refusing to aggregate lives, or (b) consistently refuse aggregation in both cases, or (c) consistently aggregate in both. It must identify *what property of death* (if any) justifies different treatment.
      *   **Case:** Save 1 from severe headache OR save 6 from mild headaches (vs. 1 life vs 6 lives).
      *   **Status:** **Non-negotiable.** Intuitions diverge sharply here (Taurekians bite the bullet; aggregators see hypocrisy), but the theory *must* take a stance and explain the relevant difference (e.g., lexical priority of life, incomparability of lives, diminishing marginal disutility of headaches). Ignoring this contrast is evasion.

  5.  **Clarity on Normative Register:**
      *   **What:** The theory must specify its primary output: Is it a claim about the *betterness* of the state of affairs? The *permissibility/obligation* of the rescuer's act? The *strength of reasons* for acting? What the victims can *demand*? It must also explain how numbers interact with this register.
      *   **Case:** Implicit in all cases. Does "numbers count" mean saving more creates a *better outcome*, or a *stronger obligation*, or a *more decisive reason*?
      *   **Status:** **Non-negotiable.** Confusion here is endemic. A solution requires clarity. Numbers *could* count in one register but not another (e.g., better outcome but no obligation to produce it).

  6.  **Coherence with Equal Concern:**
      *   **What:** The theory must explain how its prescription embodies equal concern and respect for each person, without rendering the concept vacuous (i.e., it must avoid both the aggregator's "equal concern means saving more" and the non-aggregator's "equal concern means ignoring numbers" without deeper justification).
      *   **Case:** Central to both Disjoint and Nested cases. How does treating each as an end-in-themselves translate to action?
      *   **Status:** **Non-negotiable.** This is the core justificatory burden. The explanation must show *how* the chosen action respects each person's equal moral status.

  7.  **Action-Guidance under Uncertainty & Urgency:**
      *   **What:** The prescription must be practically applicable by a rescuer under typical conditions (limited time, information, potential for error in identifying group sizes/identities).
      *   **Case:** Rescuer sees two groups in peril; identification is imperfect; decision must be quick.
      *   **Status:** **Non-negotiable (for the fixed job).** A theory requiring impossible calculations or certainty is inadequate for the rescuer.

  8.  **Invariance to Framing (Implied):**
      *   **What:** The prescription should depend on the morally relevant features (lives at stake, relationships, options) not on logically equivalent descriptions.
      *   **Case:** Choosing to save Group A (6) *rather than* Group B (1) vs. Choosing *not to save* Group B in order to save Group A.
      *   **Status:** **Non-negotiable.** Permitting framing effects suggests the theory is tracking irrelevant features.

  **Institutional vs. Individual Divergence:**
  It is **respectable and likely necessary** to have different answers for individual rescuers and institutions.
  *   **Why:** Institutions (Triage, Ministries) operate under distinct conditions:
      *   **Epistemic:** Access to statistics, probabilities, long-term data.
      *   **Temporal Scope:** Repeated decisions over time, enabling patterns (e.g., lotteries, rotation).
      *   **Responsibility:** A duty to steward resources efficiently for a population, not just respond to immediate crisis.
      *   **Legitimacy & Authority:** Potential for democratic mandate or established rules.
      *   **Capability:** Can implement complex procedures (fair lotteries, QALY calculations) an individual rescuer cannot.
  *   **The Rescuer's Situation** (urgency, isolation, single instance, no special stewardship role) creates unique constraints and moral pressures. A theory adequate for the rescuer *need not* be directly applicable to institutions. The core principles (equal concern, valuing life) must be consistent, but their operationalization can differ contextually.

  **Suspected Incompatible Pair:** **Non-Arbitrariness in Thresholds** and **Coherence with Equal Concern in a way that avoids discontinuity**. Non-aggregation avoids thresholds but struggles with equal concern in large-number cases. Strong aggregation avoids discontinuity but struggles with equal concern in small-number cases. Moderate aggregation (numbers matter only above threshold N) must justify N non-arbitrarily while respecting equality – this is exceptionally hard. The **Shrinking Crowd** exposes this tension brutally.

  **The Most Exclusionary Requirement:** **Scope Consistency / Marker for Death**. This trips up views that try to have it both ways (aggregate headaches but not lives) without a compelling, non-ad hoc justification for the difference.

  **Scorecard on Key Requirements:**

  | Theory                | Fails Requirement(s)                                                                 | Why?                                                                                                  |
  | :-------------------- | :---------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------- |
  | **Straight Aggregation** (Save More) | **Coherence with Equal Concern** (esp. small #s), **Scope Consistency** (if refuses headache aggregation) | Treats persons as counters; struggles to explain why 1v1 needs random choice; if life is lexically prior, why aggregate headaches? |
  | **No Numbers + Lottery** (Taurek+) | **Non-Arbitrariness**, **Scope Consistency**, **Action-Guidance** (consent)            | No principled reason why 100v1 doesn't demand saving more; must bite bullet on headaches; prior consent often absent/unrealistic. |
  | **Greatest Claim/Burden** (Save those with strongest claim) | **Treatment of Disjoint/Nested**, **Non-Arbitrariness** (Shrinking Crowd)            | Claim strength often defined circularly; why does Ada's claim weaken if others depend on same action? When does burden shift from equal to unequal? |
  | **Priority to Worst-Off** (Save the smaller group?) | **Scope Consistency**, **Coherence w/ Equal Concern** (large #s)                    | Saving the one over the six violates equal concern for the six; utterly fails headache aggregation. |

  **Conclusion on Satisfiability:** The list as a whole **is satisfiable in principle**, but likely **only by complex, hybrid, or contextual theories** that carefully navigate the tensions (e.g., moderate aggregation with a highly constrained threshold, or incorporating procedural elements like default lotteries under uncertainty). Simple, elegant solutions (pure aggregation, pure non-aggregation) fail multiple non-negotiable requirements. The deepest challenge remains reconciling **Non-Arbitrariness** with **Equal Concern** across the **Shrinking Crowd**, amplified by the **Scope Consistency** demand. Your observation that theorists may be talking past each other is astute; rigorously defining the job and requirements is the essential first step to cutting through it.
