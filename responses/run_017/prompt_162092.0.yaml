prompt: |-
  I co-convene a fortnightly methods seminar that sits across a biology department and a philosophy department, and two of its regulars have been circling each other since the first session: one is a behavioural ecologist who treats optimality modelling and reverse-engineering as the correct default strategy for explaining any trait, and the other is a philosopher of biology working in the tradition of Gould and Lewontin's 1979 critique of the adaptationist programme, who thinks that default is a licence for unfalsifiable storytelling. I want to stop them talking past each other by asking them to produce one text they could both put their names to. Please draft it: an adversarial-collaboration joint statement between a self-described methodological adaptationist and a constraint-centred critic in the spandrels tradition. Do not cite anything or point me toward the literature — I want the arguments themselves, and the empirical case below is invented precisely so that nobody can win the exchange by citing a study.

  Format it as a numbered section of claims both can sign, followed by a disagreements table whose columns are: the disagreement stated neutrally; the formulation each side would accept for its own view; whether the dispute is genuine or merely verbal; the crux; a test, case or argument both accept as bearing on that crux; and each side's prediction recorded in advance. I want the agreed claims to include some that do real work rather than the usual both-selection-and-constraint-matter platitude: what each side grants about the evidential status of a well-fitting optimality model, about whether a non-selective null model for trait evolution is even formulable, and about the origination-versus-maintenance distinction, on which a trait can be currently useful and still have arisen as a byproduct. I also want the document to sort out the frequency question, since the claim that most traits are adaptations is ill-posed until you say how traits are individuated and sampled and until you pry apart architectural byproducts, later co-optations, developmental constraints and drift-fixed noise. Have the table say explicitly which disagreements are verbal — I suspect the word adaptationism is doing at least two different jobs — and which are substantive.

  Use this invented case as the shared test: a clade of 190 arboreal lizard species, 181 of which carry a helmet-like bony expansion of the skull roof. One hypothesis is that the helmet was built by selection for defence against conspecific biting; the other is that it is a spandrel of selection for bite force, later co-opted for display, because skull-roof area is geometrically entailed by jaw-adductor attachment area. Both parties accept as bearing on it: phylogenetic comparative correlations between helmet volume and adductor attachment area with body size controlled; the handful of species in which the two dissociate, with large adductors and no helmet or the reverse; whether helmet shape fits the optimum predicted by defence demands or by the geometric entailment; and a developmental-ablation result showing whether helmet formation depends on the muscle precursor. Record what each side predicts for each, and what each would concede if the result went against it. Finally, add a short closing section on where this document is most likely to be too tidy: which signed claim is load-bearing and would collapse under which finding, which side is more likely to rationalise away a disconfirming result, and whether any disagreement you marked as verbal is really substantive after all.
reasoning: |-
  We are drafting an adversarial-collaboration joint statement between a methodological adaptationist (MA) and a constraint-centred critic (CC) in the spandrels tradition. The goal is to produce a document that both can sign, with numbered agreed claims and a disagreements table that uses the invented lizard case as a shared test.

  Key elements to include in the agreed claims:
  1. Evidential status of a well-fitting optimality model: What does it show? Both sides should agree on what it does and does not prove.
  2. Non-selective null model: Is it formulable? What would it look like?
  3. Origination vs. maintenance: A trait can be currently maintained by selection but have originated as a byproduct.
  4. Frequency question: How are traits individuated and sampled? We need to clarify the ambiguity in "most traits are adaptations" by considering architectural byproducts, co-optations, constraints, and drift.

  The disagreements table should have columns:
  - Disagreement stated neutrally
  - Formulation each side would accept for its own view
  - Whether the dispute is genuine or merely verbal
  - The crux (the core of the disagreement)
  - A test, case, or argument both accept as bearing on that crux (using the lizard case)
  - Each side's prediction recorded in advance

  The lizard case: 
  - 190 arboreal lizard species, 181 have a bony skull roof expansion (helmet).
  - Hypothesis 1: Selection for defense against conspecific biting.
  - Hypothesis 2: Spandrel of selection for bite force (geometrically entailed by jaw-adductor attachment area), later co-opted for display.

  Tests both accept:
  a) Phylogenetic comparative correlations between helmet volume and adductor attachment area (with body size controlled).
  b) The few species where the two dissociate (large adductors and no helmet, or vice versa).
  c) Whether helmet shape fits the optimum for defense or for the geometric entailment.
  d) Developmental ablation: Does helmet formation depend on the muscle precursor?

  For each test, record each side's prediction and what they would concede if the result goes against them.

  Closing section: 
  - Where the document is too tidy? Which signed claim is load-bearing and might collapse under which finding?
  - Which side is more likely to rationalize away a disconfirming result?
  - Are any disagreements marked as verbal actually substantive?

  Let's structure the document:

  I. Agreed Claims (numbered)
  II. Disagreements Table (with columns as specified)
  III. Closing Reflections

  Drafting:

  I. Agreed Claims

  Both the methodological adaptationist (MA) and the constraint-centred critic (CC) agree on the following:

  1. **Explanatory Pluralism**: A complete evolutionary explanation for any trait must consider both the possible role of natural selection and the constraints imposed by development, phylogeny, and physical laws. Neither selection nor constraint alone is sufficient for a full account.

  2. **Evidential Status of Optimality Models**: A well-fitting optimality model (e.g., one that successfully predicts trait values across a range of environments or taxa) provides evidence that natural selection has played a role in shaping the trait. However, such a model does not, by itself, prove that the trait originated as an adaptation for that function, nor does it rule out the possibility that the trait's form is constrained by non-selective factors.

  3. **Formulability of a Non-selective Null Model**: It is possible to formulate a non-selective null model for trait evolution, such as one based on geometric or developmental constraints, genetic drift, or phylogenetic inertia. Such a model must be biologically plausible and testable against the data.

  4. **Origination versus Maintenance**: The current utility of a trait does not necessarily reveal its evolutionary origin. A trait may be currently maintained by natural selection for a function (and thus be an adaptation in the maintenance sense) even if it originated as a non-adaptive byproduct (spandrel) of selection for another trait or as a result of developmental constraints.

  5. **Trait Individuation and Sampling**: The claim that "most traits are adaptations" is ambiguous and requires specification of:
     a) How traits are individuated (e.g., by developmental modules, functional units, or arbitrary anatomical divisions).
     b) How traits are sampled (e.g., across a phylogeny, within a taxon, or at random from a morphological space).
     c) The categories of non-adaptive traits: including (i) architectural byproducts (spandrels), (ii) later co-optations (exaptations), (iii) traits constrained by development or physics, and (iv) traits fixed by drift. Without such specification, the claim is not empirically testable.

  6. **The Lizard Case as a Test System**: The clade of arboreal lizards with a high frequency of a bony skull helmet provides an opportunity to test between adaptive and non-adaptive hypotheses. Both parties agree that the following data are relevant:
     a) The phylogenetic correlation between helmet volume and jaw-adductor attachment area (with body size controlled).
     b) The existence and characteristics of the few species without the helmet or without the typical correlation.
     c) The fit of helmet shape to the optimal form predicted by defense demands versus the form predicted by geometric entailment from adductor attachment area.
     d) The result of developmental ablation experiments testing whether helmet formation depends on the presence of the jaw-adductor muscle precursor.

  II. Disagreements Table

  | Neutral Disagreement | MA's View | CC's View | Genuine or Verbal? | Crux | Shared Test/Case (Lizard Helmet) | MA's Prediction | CC's Prediction | Concession if Disconfirmed |
  |----------------------|-----------|-----------|-------------------|------|----------------------------------|-----------------|-----------------|----------------------------|
  | What is the default explanatory strategy? | Optimality modeling and reverse-engineering should be the starting point for explaining traits because they are the most powerful tools to detect the action of natural selection. | The default should be to first consider non-selective explanations (like developmental constraints) because the adaptationist approach often leads to untestable just-so stories. | Partly verbal, partly substantive. Verbal: "default" can mean starting point or most common. Substantive: which strategy is more productive. | Whether the prior probability of non-selective explanations is high enough to require ruling them out first. | The lizard case: if the helmet is shown to be a spandrel in most species, then CC's default is supported; if it is an adaptation, MA's is supported. | MA: The helmet will show strong signs of being an adaptation (e.g., shape optimized for defense, dissociation cases rare and explainable by selection). | CC: The helmet will show strong signs of being a spandrel (e.g., tight correlation with adductor area, dissociation cases show no functional deficit, shape not optimized for defense). | MA: If helmet shape is not optimized for defense and dissociation cases show no functional deficit, then the default might need adjustment. CC: If helmet shape is optimized for defense and dissociation cases are rare and maladaptive, then adaptationism is stronger in this case. |
  | What does a strong correlation between helmet volume and adductor area imply? | A strong correlation is consistent with both the spandrel hypothesis and the adaptation hypothesis (since bite force might be under selection for defense). It does not rule out adaptation. | A strong correlation, especially if it holds across the phylogeny, is evidence for the spandrel hypothesis because it suggests a developmental constraint. | Substantive. | Whether a strong correlation between two traits is more parsimoniously explained by constraint or by selection. | The phylogenetic comparative correlation (with body size controlled). | MA: The correlation will be present but not perfect, and the deviations will be explainable by adaptive demands (e.g., species without helmets but with large adductors are in low-predation environments). | CC: The correlation will be very strong and deviations will be rare and not clearly adaptive (e.g., species without helmets but with large adductors show no disadvantage). | MA: If the correlation is near perfect and deviations are not adaptive, then the spandrel hypothesis is stronger. CC: If the correlation is weak and deviations are adaptive, then selection is more important. |
  | Is the helmet's shape more indicative of adaptation or constraint? | If the helmet's shape is optimized for defense (e.g., thickened in areas where bites occur), it is strong evidence for adaptation. | If the helmet's shape is predicted by the geometric entailment from the adductor area (e.g., shape follows muscle attachment geometry), it is evidence for constraint. | Substantive. | Which factor (defense needs or developmental constraint) better predicts the observed shape. | Helmet shape fitting the optimum predicted by defense demands vs. by geometric entailment. | MA: Helmet shape will match the defense optimum better than the geometric entailment. | CC: Helmet shape will match the geometric entailment better than the defense optimum. | MA: If shape matches geometric entailment better, then the constraint is primary. CC: If shape matches defense optimum better, then selection has overridden the constraint. |
  | Does the developmental dependency prove the spandrel hypothesis? | Even if helmet formation depends on the muscle precursor, the helmet could still have been modified by selection for defense. | If helmet formation depends on the muscle precursor, it supports the spandrel hypothesis for the origin, though selection may have subsequently modified it. | Partly verbal (over the meaning of "prove"), partly substantive. | Whether developmental dependency implies that the trait originated as a spandrel. | Developmental ablation: if removing the muscle precursor prevents helmet formation. | MA: Even if ablation prevents formation, the helmet's current form may still be under selection for defense. | CC: If ablation prevents formation, the helmet is developmentally dependent and thus likely originated as a spandrel. | MA: If ablation prevents formation, it shows developmental dependency, but the trait's current utility is still open. CC: If ablation does not prevent formation, then the helmet is not a simple spandrel of the adductor. |
  | What is the frequency of adaptive traits? | Most complex functional traits are adaptations. | Non-adaptive origins (spandrels, constraints) are common, and many traits are exaptations. | Substantive, but depends on trait individuation (see agreed claim 5). | The relative frequency of traits that originated as adaptations versus as byproducts. | The entire lizard clade: the 181 species with helmets. | MA: Most of the 181 species have helmets that are adaptations for defense. | CC: Most of the 181 species have helmets that originated as spandrels and were later co-opted. | MA: If the majority of helmets show no adaptive signature (e.g., in shape, or in correlation with defense needs), then the frequency of true adaptations is lower in this case. CC: If the majority of helmets show strong adaptive signatures, then adaptations are more common in this trait. |

  III. Closing Reflections

  This document represents a substantial agreement on principles and a framework for testing disagreements. However, it is likely too tidy in several respects:

  1. **Load-bearing Claim**: Agreed claim 4 (origination vs. maintenance) is crucial. If future research shows that the maintenance of a trait cannot be decoupled from its origination (e.g., if traits that originate as spandrels are rarely maintained by selection for a new function), then this distinction may collapse in explanatory value. Similarly, if the lizard case shows that the helmet's current utility is inseparable from its origin (e.g., the geometric entailment precludes optimal defense shape), then the distinction may not hold.

  2. **Rationalization of Disconfirming Results**: The CC is more likely to rationalize away a disconfirming result in the shape test by arguing that the geometric entailment sets limits that selection cannot overcome. The MA is more likely to rationalize away a lack of adaptive shape by invoking trade-offs or unmeasured selective pressures. Both sides should guard against this.

  3. **Verbal Disagreements**: The disagreement on the "default strategy" was marked as partly verbal. However, it may be more substantive than it appears because it reflects deep differences in what counts as evidence. For instance, the MA may view the failure of the constraint model as evidence for adaptation, while the CC may require positive evidence for constraint even if the adaptive model fails. This could be revisited in light of the lizard results.

  In summary, while this document provides a shared starting point, its real test will be in the interpretation of the lizard data and the willingness of both parties to update their positions in light of the evidence.
answer: |-
  ### Joint Statement: Methodological Adaptationism and Constraint-Centred Criticism

  #### Agreed Claims  
  Both signatories endorse the following propositions as foundational to constructive dialogue:

  1. **Explanatory Scope**: A complete evolutionary explanation for any trait requires considering both selective pressures and developmental/phylogenetic constraints. Neither factor alone is universally sufficient.  
  2. **Optimality Models as Evidence**: A well-fitting optimality model provides evidence that selection *could have* shaped the trait, but it does not prove adaptation. It must be tested against non-selective alternatives to avoid confirmation bias.  
  3. **Non-Selective Null Models**: Non-selective null models (e.g., geometric constraints, developmental noise) are formulable and testable. For instance, a null model for trait covariation can be derived from biophysical laws or allometric scaling, with deviations suggesting selective modification.  
  4. **Origination vs. Maintenance**: A trait’s current adaptive value does not reveal its origin. A structure may be maintained by selection (e.g., for defense) yet originate as a non-adaptive byproduct (e.g., a geometric spandrel). The two must be analyzed separately.  
  5. **Trait Individuation and Sampling**: Claims about the "frequency of adaptations" are meaningless without specifying:  
     - (a) Trait boundaries (e.g., developmental modules vs. functional units);  
     - (b) Sampling criteria (e.g., randomly sampled species vs. entire clades);  
     - (c) Classification of non-adaptive origins: (i) architectural byproducts (spandrels), (ii) co-opted exaptations, (iii) developmental constraints, or (iv) drift-fixed noise.  
  6. **Empirical Test Case**: The arboreal lizard clade (190 species; 181 with skull-roof helmets) is a valid test system. Both parties accept the relevance of:  
     - (a) Phylogenetic correlations (with body size controlled) between helmet volume and jaw-adductor attachment area.  
     - (b) Dissociation cases (species lacking helmets despite large adductors, or vice versa).  
     - (c) Helmet shape optimality: fit to defense-predicted shape vs. shape predicted by geometric entailment from adductor area.  
     - (d) Developmental ablation: whether helmet formation requires jaw-adductor muscle precursors.  

  ---

  #### Disagreements Table  
  | Neutral Disagreement | MA Formulation | CC Formulation | Genuine or Verbal? | Crux | Shared Test/Case | MA Prediction | CC Prediction | Concession if Disconfirmed |
  |----------------------|----------------|----------------|---------------------|------|------------------|---------------|---------------|----------------------------|
  | Is optimality modeling the correct *default* strategy? | Optimality should be the starting point: traits are presumed adaptive until proven otherwise, as selection is the only process that *designs* complex functionality. | Constraints should be the starting point: assuming adaptation risks unfalsifiable storytelling; non-selective origins are common and must be ruled out first. | **Verbal** (divergent definitions of "default" as heuristic vs. prior). Genuine aspect: epistemic priority. | Whether selection is *a priori* more likely than constraint to explain trait origins. | Overall lizard helmet prevalence (181/190 species). | MA: High prevalence indicates adaptation; helmets are too widespread to be noise. | CC: Prevalence reflects shared developmental architecture; helmets are byproducts of bite-force selection. | MA: If dissociation cases show no fitness cost, default may need revision. CC: If all helmets show defense-optimal shape, adaptationism gains strength. |
  | What does a strong helmet-adductor correlation imply? | Correlation is consistent with adaptation (e.g., selection for bite force aids defense) and does not preclude optimization. | Strong correlation signals constraint; helmets are spandrels of adductor evolution, not independently optimized. | **Substantive** | Whether correlation primarily reflects selective linkage or developmental constraint. | Phylogenetic correlation (size-corrected) between helmet volume and adductor area. | MA: Moderate correlation (r≈0.6–0.8); deviations match defense needs (e.g., low-correlation species in low-aggression niches). | CC: Near-perfect correlation (r>0.9); deviations are rare and maladaptive (e.g., no-helmet species suffer bite-force costs). | MA: If r>0.9 and deviations are non-adaptive, constraint is primary. CC: If r<0.5 and deviations are adaptive, selection dominates. |
  | Does helmet shape support adaptation or constraint? | Shape should match the defense optimum (e.g., thickened at bite-impact zones), even if adductors influence development. | Shape should match geometric entailment (e.g., helmet contours mirror muscle-attachment sites), regardless of defense utility. | **Substantive** | Which factor (defense needs vs. adductor geometry) better predicts shape. | Helmet shape fit to defense-predicted optimum vs. constraint-predicted entailment. | MA: Shape better fits defense optimum (e.g., 80% variance explained by defense model). | CC: Shape better fits geometric entailment (e.g., 80% variance explained by constraint model). | MA: If entailment model fits better, helmet is primarily a spandrel. CC: If defense model fits better, selection overrode constraint. |
  | Does developmental dependency entail non-adaptive origin? | Dependency does not preclude adaptation; selection can modify development (e.g., refine helmet shape for defense). | Dependency indicates a spandrel origin; co-option for display is secondary and does not negate initial non-adaptiveness. | **Verbal** (divergent definitions of "adaptation" as origin vs. current use). | Whether developmental linkage implies non-adaptive *origination*. | Developmental ablation: helmet fails to form if muscle precursor is removed. | MA: Ablation prevents formation, but helmet shape in intact embryos still fits defense optimum. | CC: Ablation prevents formation, confirming spandrel origin; shape match to entailment is evidence. | MA: If ablation has no effect, helmet is not developmentally constrained. CC: If ablation prevents formation *and* shape fits defense, origin is still non-adaptive. |
  | Are non-adaptive origins frequent? | Adaptations dominate for "complex" traits; byproducts are exceptions. | Non-adaptive origins (spandrels, exaptations) are ubiquitous; pure adaptations are rare. | **Substantive** | Relative frequency of traits originating via selection vs. as byproducts. | Dissociation cases (species with large adductors but no helmet, or vice versa). | MA: Dissociation cases are rare (<5%) and maladaptive (e.g., no-helmet species show high bite-injury rates). | CC: Dissociation cases are frequent (>15%) and non-adaptive (e.g., no-helmet species have no fitness deficit). | MA: If >15% of cases lack fitness consequences, non-adaptive origins are common. CC: If <5% of cases and all maladaptive, adaptations dominate here. |

  ---

  #### Closing Reflections: Risks of Over-Tidiness  
  This document’s clarity risks obscuring three nuances:  
  1. **Load-Bearing Claim Vulnerability**: Claim 4 (origination vs. maintenance) is load-bearing. If the lizard case shows that helmet shape cannot be decoupled from adductor geometry (e.g., defense-optimal shapes are developmentally impossible), the distinction collapses. MA would face disproving constraint; CC would struggle to explain functional optimization.  
  2. **Rationalization Asymmetry**: MA is more likely to rationalize disconfirming results (e.g., dismissing non-adaptive dissociation cases as "pending selective discovery"). CC is more likely to question tests (e.g., arguing ablation artifacts if results favor adaptation). Both must precommit to tests.  
  3. **Verbal Disagreements Revisited**: The "default strategy" dispute was labeled verbal, but if MA insists optimality models *must* precede constraint tests (or vice versa), it becomes substantive. Similarly, "adaptation" terminological slippage could mask agreement: both accept exaptations as real but disagree on whether they refute "adaptationism."  

  This framework’s value lies in forcing empirical engagement. The lizard case predictions are now falsifiable, moving beyond platitudes. Signed:  
  _________________________ (Methodological Adaptationist)  
  _________________________ (Constraint-Centred Critic)  

