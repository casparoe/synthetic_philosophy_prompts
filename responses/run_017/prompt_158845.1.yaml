  ### Runnable Activity: The Gavagai Puzzle Experience  
  **Total Time:** 110 minutes (including debrief)  
  **Participants:** 14–18 adults, 1 volunteer as the "Speaker," others as "Linguists"  
  **Materials:** Whiteboard, index cards, pens, timer, two envelopes labeled "MANUAL A" and "MANUAL B."  

  ---

  #### **Phase 1: Setup and Rules (5 min)**  
  - **You (Facilitator):** *"Tonight, we’re field linguists documenting an isolated language. One volunteer will be the Speaker—they know this language and will answer questions. Your job: figure out what their word ‘gavagai’ means. Rules:  
    1. The Speaker answers only ‘yes’ or ‘no’ to questions of the form: ‘If [scene], would you say gavagai?’  
    2. Scenes must be describable in 10 seconds (e.g., ‘a brown animal with long ears hopping’).  
    3. No non-scene questions (e.g., no ‘What do you mean by gavagai?’).  
    4. We’ll have three rounds, escalating in freedom."*  
  - Choose a Speaker. Privately hand them an index card with their rule:  
    > **Speaker’s Secret Rule:** *Say ‘yes’ to ‘gavagai’ if and only if the scene contains a rabbit. Always answer based on this rule—do not reveal it.*  
    *(Note: This rule is consistent with "rabbit," "undetached rabbit part," or "rabbit stage"—all are present when a rabbit is visible.)*  

  ---

  #### **Phase 2: Round 1 – Limited Scenes (15 min)**  
  - **You:** *"First, test simple scenes I provide. Predictions go on the left side of the whiteboard; Speaker’s answers on the right."*  
  - Read 5 pre-written scene cards aloud. Examples:  
    > 1. "A furry animal with long ears hopping in a field." → *Speaker: YES*  
    > 2. "A green apple on a table." → *Speaker: NO*  
    > 3. "A motionless furry animal with long ears." → *Speaker: YES*  
    > 4. "A brown rabbit’s foot detached on the ground." → *Speaker: NO*  
    > 5. "A squirrel and a rabbit together." → *Speaker: YES*  
  - **Goal:** Participants build confidence that "gavagai" = "rabbit."  

  ---

  #### **Phase 3: Round 2 – Directed Questions (20 min)**  
  - **You:** *"Now, ask your own scene questions! Write them on index cards; I’ll hand them to the Speaker."*  
  - **Monitor for "obvious objection" questions:**  
    - *Expected:* "A rabbit missing a leg?" (YES), "Just a rabbit’s ear?" (NO), "A rabbit moving?" (YES).  
    - **Speaker’s Rule Covers All:** Rabbit presence implies parts/stages, so answers stay consistent.  
  - Whiteboard tracks Q&A. Participants typically settle on "rabbit."  

  ---

  #### **Phase 4: Round 3 – Unlimited Questions (25 min)**  
  - **You:** *"Final round: Ask anything scene-based. Speaker answers all—no limits. Test edge cases!"*  
  - **Predictable Participant Moves:**  
    - **The Gamer:** *"A rabbit-shaped cloud?"* → Speaker: NO (no rabbit).  
    - **Demands Intentions:** *"Do you mean the whole rabbit or a part?"* → You intervene: "Invalid—rephrase as a scene."  
    - **Skeptic Checks Out:** *"This is impossible without mind-reading!"* → Note this for debrief; affirm their frustration.  
  - **Crucial Twist:** After 20 min, introduce ambiguity:  
    - **You:** *"Before we conclude, split into small groups. Design two ‘translation manuals’ for ‘gavagai’ that fit all evidence. Write them on index cards."*  
    - **Hint if stuck:** *"E.g., Manual A: ‘rabbit.’ Manual B: ‘undetached rabbit part’ or ‘rabbit stage.’"*  
    - Groups share manuals. Whiteboard lists options (all fit the data).  

  ---

  #### **Phase 5: The Stake (10 min)**  
  - **You:** *"We’ll vote on which manual is ‘correct.’ But first—commit in writing. Write your choice on a card, sign it, and put it in envelope A (Manual A: ‘rabbit’) or B (Manual B: ‘undetached part’). If you’re right, you ‘win’ a point. Speaker: no hints!"*  
  - Participants vote. Envelopes are sealed.  
  - **Reveal:** *"The Speaker’s rule was: say ‘yes’ if a rabbit is present. But does this prove Manual A is right? Manual B also fits—when a rabbit exists, so do its parts. Your evidence can’t distinguish them. And now… we’ll never open the envelopes. The Speaker won’t reveal their ‘intentions’ because we’re done."*  
  - **Effect:** Participants feel the weight of choosing with no decisive evidence.  

  ---

  ### **Debrief (15 min): Mapping to Activity Moments**  
  **Goal:** Show indeterminacy without labeling it until the end.  
  **Script:**  
  1. **Start with Frustration:** *"When you voted, did anyone feel there was no fact of the matter? That’s the core of today’s puzzle. Quine’s ‘gavagai’ thought experiment shows translation is indeterminate—no evidence settles meaning."*  
     - **Map to Activity:** "Unlimited questions felt exhaustive, yet manuals still conflicted. The stake made you confront: with nothing to choose, can either manual be ‘wrong’?"  

  2. **Address Objections:**  
     - **"But a real linguist would ask more questions!":** *"You did! Yet rabbit/undetached part/stage all aligned with every answer. The Speaker’s rule covered all scenarios—extra questions didn’t help."*  
     - **"The Speaker knows their intent!":** *"Even if they ‘meant’ rabbit, how could we verify it? Pointing? But pointing at a rabbit also points at its parts. Language can’t escape this ambiguity."*  
     - **"This is just skepticism!":** *"Not quite. Skepticism says ‘We can’t know.’ Indeterminacy says ‘There’s no fact to know.’ Your manuals weren’t uncertain—they were equally valid."*  

  3. **Turn to English (Key Moment):** *"Now: point to a rabbit and say ‘rabbit.’ Are you referring to the animal, its parts, or a momentary stage? How would you test it? Our own language has the same ambiguity—we just ignore it through convention."*  
     - **Landing It:** Use a participant’s vote card: *"You chose Manual A for the Speaker. But why not for English? Because we ‘just know’? Quine says that’s habit, not proof."*  

  4. **Reveal the Word:** *"This is ‘indeterminacy of translation’: meaning isn’t fixed by behavior. There’s no ‘correct’ manual—only useful ones. The Speaker’s rule wasn’t about rabbits; it was about scenes triggering assent."*  

  5. **Close:** *"Implication: meaning is communal, not private. We negotiate it together—like you did with manuals. No one ‘wins’ the bet because language isn’t a game with hidden answers."*  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Gamer/Troll:**  
     - *Issue:* Asks nonsense scenes ("a floating rabbit in space") to "break" the Speaker.  
     - *Solution:* "Stick to plausible earthly scenes. The Speaker’s rule handles all standard cases."  

  2. **Demands Intentions:**  
     - *Issue:* "Just ask the Speaker what they meant!"  
     - *Solution:* "In the activity, they can’t—no English. In life, even if they answer, we must translate their explanation. Loop back to indeterminacy!"  

  3. **Skeptic Checks Out:**  
     - *Issue:* "This proves we can’t understand anyone!"  
     - *Solution:* Validate ("Good point!") then pivot: "But Quine isn’t saying we fail—he’s saying success has multiple definitions. Manuals A and B both ‘work.’"  

  4. **Over-Invested Debater:**  
     - *Issue:* Fixates on "winning" the bet.  
     - *Solution:* "The envelopes stay sealed to make a point: indeterminacy isn’t about ‘solving’ it."  

  ---

  ### **What the Activity Can’t Generate (Requires Your Input)**  
  - **The Radical Leap:** Participants may grasp underdetermination ("we need more data") but not indeterminacy ("no data could fix it"). You must clarify:  
    > *"Even infinite questions wouldn’t help. Rabbit and undetached part always co-occur in the Speaker’s rule—they’re empirically equivalent. It’s not ignorance; it’s ontological ambiguity."*  
  - **Why It Matters:** Without your framing, they might see this as a language-game quirk. Stress:  
    > *"This challenges the idea that words ‘hook onto’ the world uniquely. Meaning is use, not reference."*  

  **First-Time Risks:**  
  - Speaker slips (e.g., answers non-scene questions). **Mitigation:** Rehearse with them briefly.  
  - Groups struggle to generate alternative manuals. **Mitigation:** Pre-write example manuals on cards to distribute if needed.  
  - Debate overwhelms time. **Mitigation:** Use a timer per round; table off-topic points for "parking lot" discussion after.  

  **Honest Weakness:** The activity *shows* underdetermination but can’t *prove* indeterminacy—you must bridge the gap by explaining that the manuals aren’t just unverified, but *verifiably equivalent*. Use the sealed envelopes to symbolize this: "No key exists to open them because there’s no lock."  

  ---  
  **Final Tip:** Start debrief with participant quotes (e.g., "I voted but felt 50/50"). This grounds abstraction in their experience. By staging the puzzle, you’ve made Quine’s dilemma visceral—the rest is naming what they’ve felt.
