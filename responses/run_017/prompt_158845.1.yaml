  What the activity cannot generate and must be supplied:

  The activity shows that multiple translation manuals fit the evidence. But the deeper philosophical point is that there is no fact of the matter about which one is correct. This is a metaphysical point, not just epistemic. We must explain that the behavior does not determine the meaning, and there is no further fact (beyond behavior and dispositions) that fixes it. We must also explain that this challenges the idea of meaning as a mental entity.

  Additionally, the turn to English requires explicit explanation: we are in the same boat with our own language, but we don't notice because we share a language and conventions.

  Finally, we must note that Quine's view is controversial and not everyone accepts indeterminacy.

  Debrief Script:

  1. Recap the activity: "We collected a lot of evidence about when the native speaker says 'gavagai'. We then saw that multiple interpretations fit all the evidence: rabbit, undetached rabbit part, rabbit stage. And we had to bet without knowing."

  2. Introduce Quine and the gavagai puzzle: "This is based on a thought experiment by Quine. He argued that no matter how much evidence we collect, we cannot uniquely determine the meaning of a word. There will always be multiple interpretations that fit all the evidence. This is called the indeterminacy of translation."

  3. Emphasize: "It's not that we don't have enough evidence. Even with all possible evidence, the ambiguity remains. And note: the native speaker was following a simple rule. But that rule did not fix the meaning. It only fixed the use in specific situations."

  4. Turn to English: "Now, you might think this is a problem only for foreign languages. But consider the word 'rabbit' in English. How do we know that we don't mean undetached rabbit part? We point to a rabbit and say 'rabbit'. But when we point, we are pointing to the rabbit and to its parts and to the stage. The physical act of pointing is ambiguous. We rely on the fact that we have been trained in a community that uses the word to refer to whole rabbits. But there is no behavioral fact that forces that interpretation over the others."

  5. Discuss the stake: "When you had to bet, you had to choose without any basis. That's because there is no fact of the matter. The meaning isn't fixed by the observable evidence."

  6. Address challenges: 
     - To the gamer: "We restricted to scenes because that's the kind of evidence field linguists have. And even with unlimited questions, we couldn't break the symmetry."
     - To the one who wants inner intentions: "Even if we could ask the native speaker, they might say 'rabbit', but that's just another word that would need translation. And if they think of a rabbit, how do we know what their mental image is? Maybe they are thinking of an undetached part? We can't see into their minds. And Quine would say that the mental image itself is not what fixes meaning. The meaning is in the public use."
     - To the skeptic about other minds: "This is not about whether the native speaker has a mind, but about what their words mean. Even if we grant they have a mind, we cannot determine the exact meaning of their words from their behavior."

  7. Conclude: "The activity shows that meaning is underdetermined by evidence. This has profound implications for philosophy of language and mind. It challenges the idea that words have fixed meanings and that we can always find out what they are. It also suggests that meaning is a matter of how we use words in a community, not something that exists independently."

  Materials Needed:
  - Index cards for scene descriptions (prepared in advance for Phase 1).
  - Blank index cards for new scenes in Phases 2 and 3.
  - Whiteboard and markers for recording.
  - Paper for groups to write manuals.
  - Index cards for the bet.

  This should fit in two hours, with timing being the biggest risk. Be prepared to cut short the unlimited questioning if needed.

  Good luck!
