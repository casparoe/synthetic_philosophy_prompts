prompt: |-
  I hold a chair in political philosophy and sit as the philosopher-member of my country's standing Electoral Law Commission. Next month we must rule on a proposal that I expect to divide us, and I would like your help in working out what our own record commits us to.

  Our precedents. (1) We recommended lowering the voting age to sixteen for municipal and regional elections but not for national ones, on the ground that the stakes and the informational demands of national contests justify a later threshold. (2) We recommended municipal and regional voting rights for non-citizen residents after three years of lawful residence, withheld national voting rights, and rejected a proposal that the residence requirement be made to scale with how likely a resident is to naturalise. (3) We retained the national vote for citizens resident abroad, but only for the first fifteen years after emigration. (4) We rejected compulsory voting at national level, but approved a legal duty to enrol enforced by a nominal fine, and approved placing a formal none-of-the-above option on the ballot, counted and published though not binding. (5) We enfranchised prisoners serving sentences under one year and withheld the vote from those serving longer. (6) We rejected both a threshold of fourteen and proxy voting by parents on behalf of children.

  The proposal now before us is to make voting in municipal elections legally compulsory — a nominal fine, discharged either by casting a ballot or by filing a formal declaration of abstention — and to apply the duty to everyone on the register, including the sixteen- and seventeen-year-olds and the non-citizen residents we enfranchised, among them residents who cannot naturalise at all because their state of origin forbids it. The alternative on the table is a probationary franchise: the newly enfranchised cohorts hold the right but incur no duty for their first two electoral cycles.

  What I want is this. Set out the two or three principles that fit our precedents about equally well — something turning on subjection to the law, something turning on membership and reciprocity, something turning on the representativeness of the electorate, something developmental, or whatever else you think fits — and say what each predicts about the proposal, and separately about each cohort within it. Give me your best recommendation with your reason for preferring it, identify which of our precedents is the closest analog, and if you think our record genuinely underdetermines the decision, state plainly what principle we would be adopting under each option, including what we would thereby be committing ourselves to about compulsory voting at national level later on. Close by naming the single further case that would most cleanly separate the principles you identify; I have some latitude to place matters on the agenda, and I would rather settle the principle than the proposal.
reasoning: |-
  Hmm, the user is a political philosopher on an Electoral Law Commission who needs help analyzing a new proposal about compulsory municipal voting. They've outlined six key precedents and want me to extract principles from them to apply to the current dilemma between full compulsory voting for all registrants (including teens and non-citizens) versus a probationary franchise.

  First, let's distill those precedents into coherent principles. The commission consistently makes tiered distinctions between municipal/regional and national elections (Precedents 1,2,3,5), suggesting a "governance proximity" principle. There's also a clear pattern of conditional enfranchisement based on duration or stakes (Precedents 1,2,3,5) - call this the "stakes-competence nexus." And the handling of non-voters shows a "formal participation expectation" (Precedent 4's nominal fine and abstention declaration).

  Now applying these to the proposal: Full compulsion would extend Precedent 4's logic consistently to all registrants, treating municipal participation as a universal civic baseline. But the probationary option would create an inconsistency by exempting new voters from Precedent 4's duty while letting them vote - undermining the reciprocity principle implicit in Precedent 2's rejection of scaled residency based on naturalization likelihood.

  The cohort analysis reveals tensions: For teens, Precedent 6 rejected proxy voting, affirming their independent capacity - so exempting them via probation weakens developmental logic. For non-citizen residents, Precedent 2 rejected differential treatment based on naturalization prospects, making probation's temporary exemption inconsistent.

  My recommendation leans toward full compulsion because probation creates arbitrary exceptions that violate the commission's own consistency in applying municipal duties. The closest analog is Precedent 4, which already established compulsion as acceptable for municipal participation. Adopting probation would implicitly endorse a "learner's permit" view of voting that contradicts Precedent 6's refusal of parental proxies.

  To clarify the principles long-term, I'd propose adding a case about compulsory voting for citizens abroad - if they're subject to laws (Precedent 3), should they have duties? This directly tests whether "subjection to law" or "electorate representativeness" drives the commission's logic.
answer: |-
  Based on your precedents, two core principles emerge as most consistent: **Governance Proximity & Subjection** and **Staged Integration & Competence Thresholds**. A third principle, **Formal Participation Expectation**, is strongly implied but less uniformly applied. Here's how they fit your record and predict outcomes for the proposal and cohorts:

  ### Principle 1: Governance Proximity & Subjection  
  *Justification:* Distinguishes rights/duties based on closeness of governance. Those most directly subject to local laws (residents) owe participation duties, while national-level demands higher competence/longer-term membership.  
  - **Fits Precedents:**  
    - (1) Lower voting age locally (directly subject) but not nationally.  
    - (2) Non-citizens vote locally (subject to municipal laws) but not nationally.  
    - (3) Emigrants lose national vote after 15 years (diminished subjection).  
    - (5) Shorter-sentence prisoners retain vote (sooner subjection resumes).  
  - **Predicts for Proposal:**  
    - **Full Compulsion:** Aligns – *all* on municipal register are subject to local laws, so all share duty.  
    - **Probation:** Contradicts – subjection is binary (resident or not), not gradual.  
  - **Cohort Implications:**  
    - **16–17-year-olds:** Subject to municipal laws (e.g., curfews, school regulations) → duty applies.  
    - **Non-citizen residents:** Directly subject to local laws → duty applies equally, regardless of naturalization prospects.  

  ### Principle 2: Staged Integration & Competence Thresholds  
  *Justification:* Franchise expands progressively based on demonstrated commitment or capacity. Rights precede full duties; integration is gradual.  
  - **Fits Precedents:**  
    - (1) Voting age staged: local elections as "training" for youth.  
    - (2) 3-year wait for non-citizens (proving commitment).  
    - (3) 15-year cutoff for emigrants (fading ties).  
    - (6) Rejecting proxy votes for kids: capacity must be direct, not inherited.  
  - **Predicts for Proposal:**  
    - **Probation:** Strongly aligns – new cohorts earn duty-free participation first.  
    - **Full Compulsion:** Contradicts – imposes duty immediately, skipping probation.  
  - **Cohort Implications:**  
    - **16–17-year-olds:** Need electoral "apprenticeship" → probation protects developmental logic.  
    - **Non-citizen residents:** 3-year wait already staged enfranchisement → adding immediate duty is abrupt.  

  ### Principle 3: Formal Participation Expectation  
  *Justification:* Voting is a civic ritual; the system expects formal engagement (vote or abstain), enforced minimally to ensure legitimacy.  
  - **Fits Precedents:**  
    - (4) Duty to enroll + formal abstention option.  
    - (5) Disenfranchising only long-term prisoners (severing civic ties).  
  - **Predicts for Proposal:**  
    - **Full Compulsion:** Extends Precedent 4’s logic – duty applies universally once enfranchised.  
    - **Probation:** Weakens – exempts groups from core participation expectation.  

  ---

  ### Recommendation & Reasoning  
  **Adopt full compulsion.**  
  - **Why:** Principle 1 (Governance Proximity) is your strongest, most consistent thread. Subjection to municipal law binds *all* registrants equally, making differential duties illogical. Precedent 2 explicitly rejected tailoring rights to naturalization likelihood – applying probation here would similarly fragment civic equality. Principle 3 (Formal Participation) further supports uniform duty.  
  - **Closest Analog:** Precedent 4 (duty to enroll + abstention option). Compulsory voting extends this expectation to the act itself, maintaining symmetry.  
  - **National-Level Implication:** This *does not* commit to national compulsion. Precedents consistently treat national elections as distinct (higher stakes, competence demands). Your record permits compulsion at municipal level (as "civic baseline") while rejecting it nationally (Precedent 4).  

  ### If Underdetermined?  
  Your record *slightly* favors full compulsion but could support probation if emphasizing Staged Integration (Principle 2). Adopting either would commit you to:  
  - **Full Compulsion:** Civic duty stems purely from subjection to law. *Future national compulsion remains rejectable* due to higher competence thresholds.  
  - **Probation:** Voting requires "apprenticeship" for new groups. *Future national compulsion is likely untenable* – if even municipal duty requires probation, national demands would too.  

  ---

  ### Critical Test Case for Principles  
  **Propose: Should citizens residing abroad *permanently* (beyond 15 years) retain municipal voting rights?**  
  - **Cleanly Separates Principles:**  
    - **Principle 1 (Proximity/Subjection):** No rights – they avoid local law subjection.  
    - **Principle 2 (Staged Integration):** Rights lost after 15 years (Precedent 3) → no municipal vote.  
    - **Contrast:** If municipal voting is a "developmental right," emigrants might retain it longer than national voting. Current silence makes this ideal for clarifying.  

  This case isolates whether "subjection" or "integration" is paramount, resolving ambiguity in your framework. Settle this first to anchor the current proposal.
