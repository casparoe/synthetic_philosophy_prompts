  "Value alignment", by contrast, is the broader aim that the system should act in a manner that is genuinely beneficial or good for the beneficiaries (in the AI context, humanity or the operator). This corresponds to the equitable duty of a trustee to act in the best interests of the beneficiaries, even if that requires departing from the strict terms of the trust when circumstances change or when the settlor’s expressed intent becomes harmful. It invokes the court’s cy-près jurisdiction or the principle that a trustee must not slavishly follow the trust instrument to the detriment of the beneficiaries.

