  In AI, however, there is no equivalent court or cy-près jurisdiction. The system, once deployed, may rigidly pursue the specified objective without recourse to equitable adjustment. This is where your analogy strains: trust law has institutional mechanisms to correct intent-value gaps; AI alignment lacks them.

