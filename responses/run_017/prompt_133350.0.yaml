prompt: |-
  Analyse the removal of Terri Schiavo's feeding tube in Florida in 2005 as a case study for the distinction between doing and allowing harm — and, more narrowly, between killing and letting die. The facts I'll take as given: after a cardiac arrest in 1990 she was diagnosed as being in a persistent vegetative state; she was not terminally ill, and with the tube in place she could have lived for years; the tube was removed in March 2005 at the request of her husband acting as her guardian, after years of litigation and against the wishes of her parents, and she died of dehydration roughly two weeks later.

  I don't want a general defence or critique of the distinction — I want it mapped onto this case. So: (i) identify the agent, given that the decision was spread across a guardian, a long series of state and federal courts, legislatures that intervened without changing the outcome, and the physician who actually removed the tube, and say whether 'doing' versus 'allowing' is even well defined once the act is distributed across that many hands; (ii) apply the two standard ways of drawing the line — the causal picture, on which a doing starts a lethal sequence while an allowing merely fails to stop one the patient's own condition is already producing, and the 'would have died anyway' baseline test — and say which side the removal falls on, including what to do with the fact that over the window in which dehydration kills she was not otherwise dying, while over a long enough window everyone is; (iii) say whether the distinction is doing any independent work here, or whether the load is carried by a prior judgement about her best interests and the value of her continued life, with the distinction reached for only because people disagree about that judgement; (iv) say whether the intending/foreseeing distinction would handle the case more cleanly; and (v) say what the episode does to the theory — does it confirm the distinction, is it an anomaly for it, or is it the kind of case the distinction was never built for?

  Answer as exactly five numbered points, matching my five questions in order, at most two sentences each, with no introduction and no summing-up, in British English.
reasoning: |-
  Hmm, the user wants me to analyze the Terri Schiavo case through the lens of the doing/allowing harm distinction, specifically focusing on killing versus letting die. They've provided specific facts about the case and want me to address five precise questions in a very structured format.

  The case involves Terri Schiavo who was in a persistent vegetative state for 15 years. Her feeding tube was removed in 2005 at her husband's request as her legal guardian, despite objections from her parents. She died of dehydration approximately two weeks later. I need to map ethical distinctions onto this complex scenario.

  For question (i), I need to identify who the agent is in this distributed decision-making process. There are multiple parties involved: the husband as guardian, numerous courts that upheld his decision, legislatures that tried to intervene, and the physician who physically removed the tube. The doing/allowing distinction becomes complicated when an action is spread across so many actors. I should note that the physician's physical act of removing the tube represents the most direct action.

  For question (ii), I need to apply two standard frameworks for distinguishing between killing and letting die. The causal picture asks whether we're starting a new lethal sequence or merely failing to stop an existing one. The baseline test considers whether death would have occurred anyway without intervention. In this case, removing the feeding tube clearly initiates a new causal chain since without intervention she could have lived for years. The "would have died anyway" test is tricky because over any sufficiently long timeframe everyone dies, but practically speaking she wasn't dying until the tube removal.

  Question (iii) asks whether the distinction is doing independent ethical work or if it's secondary to judgments about quality of life. I think the distinction isn't carrying much weight here - it seems the core disagreement was about whether her life had value and what she would have wanted, with the killing/letting die argument being used to support predetermined positions.

  For question (iv) I need to consider whether the intending/foreseeing distinction (like in double effect reasoning) would handle this better. Foreseeing death is different from intending it. In this case, death was clearly intended as the means to end her condition, not merely foreseen, so this distinction doesn't resolve the ethical tension either.

  Finally, for question (v), I should assess what this case means for the theory. This scenario challenges the distinction because it shows that withdrawing life-sustaining treatment (often framed as "letting die") can feel like actively killing when it causes death in a patient who isn't terminally ill. The distinction seems inadequate for cases involving the withdrawal of artificially sustained life.

  I'll structure my response exactly as requested: five numbered points corresponding to each question, using British English spelling conventions, with no introduction or conclusion, and limiting each to two sentences maximum.
answer: |-
  (i) The primary agent is the physician who physically removed the feeding tube, initiating the direct cause of death; while the decision involved multiple actors (guardian, courts), the *act* of removal constitutes 'doing' harm, defined by the direct physical intervention. The distributed decision-making complicates moral responsibility assignment, but the core harmful act remains identifiable.

  (ii) Causally, removing the tube started a new, lethal sequence (dehydration) that her condition (PVS) was not causing, placing it firmly in the 'killing' camp under this picture. The 'would have died anyway' baseline is ambiguous: over the immediate window, she wasn't dying without the tube's removal, but over decades she inevitably would; the standard application focuses on imminent death without intervention, which was absent, again supporting 'killing'.

  (iii) The distinction performs little independent work; the core dispute centred entirely on conflicting judgements about her best interests and the perceived value (or indignity) of her continued existence in PVS. Opponents invoked 'killing' primarily to condemn an outcome they deemed immoral based on that prior value judgement, while proponents used 'letting die' to frame it as permissible withdrawal.

  (iv) The intending/foreseeing distinction does not resolve the case cleanly; death from dehydration was not merely a foreseen side-effect but the intended means to achieve the end (cessation of artificial sustenance), placing it clearly within 'intending harm' under doctrines like double effect.

  (v) The episode exposes the distinction as anomalous and strained in withdrawal-of-treatment cases; it confirms that the distinction struggles when applied to deliberately ending artificially sustained life for non-terminally ill patients, a scenario it wasn't primarily built to address, revealing its limitations.
