answer: |-
  Your pattern reveals a sophisticated moral heuristic that *can* be systematized into reflective equilibrium, but it requires overturning some intuitions. Here’s a principle grounded in **phenomenal binding** and **welfare subjects**, calibrated to your cases:

  ### The Binding Threshold Principle (BTP)
  **A.** Moral weight scales with the *probability* that an organism possesses **phenomenal binding** (PB)—the capacity to integrate sensory inputs into a unified, temporally extended subjective experience ("what it’s like to be me").  
  **B.** Only organisms with a non-negligible PB probability (≥ *p_min*) qualify as **welfare subjects**—entities whose experiences can meaningfully "go well or badly" over time.  
  **C.** For welfare subjects, moral weight = PB probability × expected welfare range (pain/pleasure depth × duration).  
  **D.** Organisms below *p_min* have negligible moral weight *even if sentient* (i.e., capable of atomized sensations).  

  **Parameters from your verdicts:**  
  - *p_min* ≈ 0.05 (you assign "a few percent" to nematodes but act as if weight=0).  
  - Welfare range heavily discounts:  
    - Non-binding pain (e.g., withdrawal reflexes).  
    - Extremely short lives (e.g., soil fauna, aphids).  
  - **Key clause:** Binding requires evidence of *goal-directed persistence* (e.g., trade-offs, learning, play).  

  ---

  ### How BTP Resolves Your Cases
  1. **Shrimp stunners (YES):**  
     - Evidence: Avoidance learning + trade-offs → PB probability ↑ (≈0.5-0.7).  
     - Welfare range: Hours/days of potential suffering avoided.  
     - ∴ High moral weight per dollar.  

  2. **Chilled fly larvae (WEAK YES):**  
     - Limited evidence of PB (withdrawal ≠ binding). PB probability ≈ *p_min* (0.05).  
     - Welfare range low (short life, minimal behavioral complexity).  
     - ∴ Weight ~1/50th of shrimp (matches your $50 vs $1).  

  3. **Spraying aphids (NOTHING):**  
     - No evidence of PB; reflexes dominate. PB probability ≪ *p_min*.  
     - Lives are minutes/hours—no "narrative" to disrupt.  
     - ∴ Negligible weight (even for billions).  

  4. **Paving meadow (NOTHING):**  
     - Soil fauna (nematodes, mites) lack behavioral markers of PB. PB probability < 0.01.  
     - **Anti-natalist argument rejected:** Only welfare subjects can have "bad lives." Non-subjects don’t lose welfare by not existing.  
     - ∴ No loss, no gain.  

  5. **Ticks off dog (NOTHING):**  
     - Parasites show nociception but no PB evidence (e.g., no learning in ticks). PB probability ~0.  
     - ∴ Indifference justified.  

  6. **Pig vs. bees (PIG WINS):**  
     - Pig: Clear PB (trade-offs, play, distress). Welfare range vast (years of suffering).  
     - Bees: PB uncertain—complex behavior but short lifespans, limited individuality. PB probability ≈0.1. Welfare range per bee: low (days/weeks).  
     - ∴ 1 pig > 1 million bees: Pig’s welfare depth swamps bee numbers.  

  ---

  ### Verdicts on New Cases
  - **Farmed crickets:**  
    Moderate PB probability (≈0.3—show learned avoidance, sociality). Welfare range medium (weeks).  
    ∴ Worth funding humane slaughter at ~1/10th shrimp value.  
  - **Ants in your kitchen:**  
    Low PB probability (≈0.05—trail-following is reflexive, limited individual learning). Welfare range very low (hours/days).  
    ∴ Morally negligible to kill them.  

  ---

  ### Conflicts with Your Intuitions & Overturned Verdicts
  1. **Conflict:** Your shrimp verdict assumes *sentience* suffices. BTP requires *binding*—overturning "mere sentience" as sufficient.  
  2. **Overturned intuition:** Your "few percent" PB for nematodes *should* imply *some* weight. But BTP sets *p_min* = 0.05 → nematodes at 0.01-0.03 get weight=0.  
     - **Why overturn?** Your actions (doing nothing) reveal your implicit threshold. Consistency demands accepting this cutoff.  
  3. **Overturned anti-natalism:** You reject "paving as benefit" but BTP agrees—non-subjects can’t have "bad lives," so preventing existence isn’t a moral win.  

  ---

  ### What Would Change My Mind
  - **For aphids/soil fauna:** Evidence of *cross-modal integration* (e.g., aphids altering behavior using combined visual/chemical cues over time) → raises PB probability.  
  - **For bees:** Data showing bees *sacrificing future rewards* for immediate relief (proving temporal binding) → PB ≈0.5, forcing higher weight.  
  - **Against BTP:** Finding that *atomized pain* (e.g., in decerebrate mammals) is morally relevant → collapses PB requirement.  
  - **Breaking point:** If binding is a continuum (not threshold), BTP fails. But your shrimp/fly disparity suggests a categorical shift.  

  ---

  ### Why This Works
  Your pattern isn’t arbitrary—it tracks **whether pain/pleasure integrates into a "life story."** Shrimp show this; nematodes don’t; bees are ambiguous. BTP systematizes your emphasis on learning, trade-offs, and duration while rejecting arithmetic for non-subjects. It treats your aphid/soil apathy as *correct* and your pig-over-bees as *principled*, not hypocritical. The only sacrifice: admitting nematodes truly "don’t count" despite sentience potential.
