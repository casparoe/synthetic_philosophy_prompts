  Key misconceptions: First, the idea that rational people wouldn't overpay. I need to show that incremental bidding can seem logical. Second, confusing this with sunk cost fallacy—emphasize that decisions are prospective. Third, the belief that setting limits solves everything, ignoring how others react. Fourth, assuming all escalations have known values, when many involve uncertain prizes. Introduce the term "quit penalty" during the auction analysis to name the structural feature.

  For the check, use the variant where 40% of the runner-up's bid is refunded. The sunk cost view might not predict behavior change, but the quit penalty account would expect less escalation. Real understanding would note the reduced exit cost, while fluent answers might miss this nuance. The coarse-increment variant shows how step size affects escalation.

  Finally, openly decline to cover game theory equilibrium, experimental literature, and behavioral economics nuances. State that the focus is on practical pattern recognition, not theoretical depth.

