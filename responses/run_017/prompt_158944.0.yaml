prompt: |-
  I'm a doctoral student in comparative economic history, and my dissertation's methods chapter has stalled on something I can't resolve from the literature itself: whether the contrastive "why" questions that organize this field are well posed at all. My own chapter asks a contrastive question about a pair nobody writes books about — why the Dutch Republic and not the Ottoman Empire, in a period where both had substantial commercial sophistication, fiscal apparatus, and long-distance shipping — and I don't want to spend three years discovering that the form of the question was doing the work. So I want a specification, not another survey.

  Write the desiderata that a contrastive historical explanation must meet to count as a satisfactory answer to a question of the form "why F rather than C?", where F is the focal case that got the outcome and C is the contrast case or class that didn't. For each desideratum, give the case or consideration that motivates it, and mark whether you take it to be non-negotiable or a preference of one methodological camp. Fix the standard of adequacy as follows: an explanation is good enough if it would be worth three years of primary-source work to test — that is, if a negative finding about it (the cause was absent in F, or it was present in C after all) would be informative rather than merely deflationary.

  Below are the candidate requirements I keep seeing asserted, which I can't sort into genuine demands and camp prejudices. Adjudicate them, add the ones I've missed, and feel free to re-cut the taxonomy — I care more about the criteria and their motivating cases than about the scoring of answers.

  1. Whether the contrast class must be a "natural" class rather than one gerrymandered to make the focal case look exceptional, and what test would distinguish the two. "Why Britain and not China?", "why north-west Europe and not the Yangzi delta?", and "why Britain and not France?" give noticeably different lists of candidate causes. If the answer to the question is unstable under re-description of the arms at coarser or finer grain, is that a defect in the question, a discovery about the outcome's causal structure, or neither?

  2. Whether an adequate explanation must be contrast-invariant — the same cause doing the work under any reasonable re-description of both arms — or whether it may be contrast-relative, in the sense of naming whatever F had that C lacked, and thereby shifting as C shifts. My suspicion is that most published answers are contrast-relative while presenting themselves as invariant, and I want to know whether that is a real failing.

  3. Symmetric counterfactual support. Must a candidate cause both (a) have been sufficiently absent in C that adding it would have produced the outcome there, and (b) have been sufficiently present in F that removing it would have prevented the outcome here? Or is one direction enough? In practice the literature almost always argues only one direction, and I want the cost of demanding both stated explicitly.

  4. Separation of the arms. In an experiment, treating one unit doesn't affect the other. In these cases the units traded with each other, borrowed each other's techniques, competed for the same bullion flows and the same colonial hinterlands, and the outcome in F plausibly depressed the outcome in C. Can a contrast be well posed when the arms are causally coupled? If not, much of this literature is answering an ill-posed question. If yes, we owe an account of what "holding C's trajectory fixed while removing F's cause" could even mean.

  5. Diachronic adequacy: must a good explanation also say why the divergence happened when it did, and not merely why it happened in F rather than C? The awkward case is the near-miss — a contrast case that appears to have had many of the hypothesized preconditions centuries earlier and still did not make the transition. Does an adequate answer have to explain the near-miss, or is the near-miss evidence that the contrast has been misdescribed?

  6. Transportability versus difference-making. Must the cause be such that instantiating it in C would have produced the outcome there, as opposed to being merely correlated with the outcome within the observed set of cases? And separately: how should we treat causes present in both arms — factors that are genuine causes of the outcome but not of the difference, and that are therefore invisible to the contrast while plausibly doing most of the causal work? I want a requirement, not a shrug.

  7. Level and integration. Explanations are offered at the level of measurable proximate factors (coalfield location, real wages, freight rates), at the level of institutions and property rights, at the level of beliefs and intellectual culture, and at the level of sheer contingency. Must an adequate answer integrate levels, or is a single-level answer acceptable if complete at its level? Is the standing demand for a "deeper" explanation a desideratum or the prejudice of the institutions camp?

  8. Whether the question is well posed at all when the outcome is a matter of degree and the arms were already on divergent trajectories before the divergence — i.e., whether the contrast presupposes a shared baseline that the evidence does not in fact supply.

  Flag any pair of desiderata you think cannot be jointly satisfied. If the list turns out to be a result — if, say, no explanation can be both stable under re-description and fine-grained enough to be worth testing, or both honest about causal coupling between the arms and usable as a contrast — say so, and say what conclusion we should draw about the question rather than about any proposed answer to it. Then, in a few lines and only to show the list has teeth, name the single desideratum that excludes the largest share of the usual families of answers (resource endowments, institutions, culture, state formation, pure contingency).
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a doctoral student in comparative economic history stuck on their methods chapter. The core issue is whether contrastive "why" questions in their field are well-posed. Specifically, they're comparing the Dutch Republic and the Ottoman Empire, two cases not typically paired. They want criteria to evaluate such questions before committing years to research.

  First, I need to unpack their main concerns. They listed eight candidate requirements they've encountered in literature but can't sort out which are essential vs. methodological biases. My job is to adjudicate these, add missing ones, and provide clear desiderata. The standard is that a good explanation should justify three years of primary-source work—meaning a negative finding should be informative, not just deflationary.

  Looking at their points: 

  The user is worried about question stability (#1) - whether rephrasing the contrast changes the answer. They suspect many explanations are contrast-relative (#2) but pretend to be invariant. They also question if counterfactuals need symmetry (#3) and how to handle causally coupled cases (#4) like trading empires. Diachronic adequacy (#5) involves timing of divergence. Transportability vs difference-making (#6) addresses whether causes would work in C. Level integration (#7) debates if multi-level explanations are needed. Finally, #8 asks if contrasts presuppose a false baseline.

  I notice they're implicitly requesting epistemological rigor. They need criteria that prevent wasted effort—like discovering their question's framing did the heavy lifting. Their anxiety about "three years" suggests high stakes. Unspoken needs might include: validation that their atypical case pair (Dutch/Ottoman) is viable, tools to defend their methodology, and clarity on when contrastive questions themselves are flawed.

  For desiderata, I'll prioritize robustness. Non-negotiable criteria should avoid tautology and ensure testability. For example, demanding causal separability (#4) might be impractical for entangled cases like theirs, so I'd make it optional but flag implications. Symmetry (#3) should be required—it's the only way to confirm a cause makes a difference. Near-misses (#5) mustn't be ignored, as they challenge the contrast's validity. 

  The biggest pitfall? Probably "contrast-invariance" (#2). If causes shift when contrasts change, the explanation may be ad hoc. Yet enforcing strict invariance could make answers too vague. I'll propose a middle path: allow contrast-relativity but require scope conditions. 

  For transportability (#6), I'll insist on modal robustness—the cause must be meaningful in C's context, not just correlated. This excludes geographic determinism, which can't be "transplanted." 

  Finally, the baseline issue (#8) needs addressing: if trajectories already diverged, the contrast might misfire. Here, I'll add a desideratum requiring explicit divergence timing. 

  The toughest trade-off is between invariance and granularity. Detailed mechanisms are testable but contrast-relative; invariant answers (e.g., "institutions") are stable but hard to falsify. Conclusion: some tension is inevitable, but well-scoped questions can manage it. The Dutch/Ottoman pair actually helps—their entanglement demands careful handling of separability, making the case stronger methodologically.
answer: |-
  Here is a specification of desiderata for a satisfactory contrastive historical explanation, adjudicating your listed concerns, adding critical omissions, and flagging tensions. The standard is **epistemic robustness for primary-source testing**: failure to confirm should reveal something substantive about causal structure, not just the question's flaws.

  ### Core Desiderata (Non-Negotiable)
  1.  **Non-Tautological Contrast Definition**:  
      -   *Requirement*: The contrast class C must be defined *independently* of the outcome or the hypothesized cause.  
      -   *Motivation*: "Why Dutch Republic not Ottoman Empire?" becomes circular if C is implicitly defined as "non-capitalist early modern states." The comparison must avoid presupposing the answer.  
      -   *Adjudication*: Rejects "gerrymandered" contrasts (#1). Instability under re-description signals a flawed question or definition (e.g., "Britain vs France" vs "Britain vs China" instability often reflects poor initial contrast definition).  
      -   *Test*: Does the contrast remain plausible *if we didn't know the outcome*? (e.g., 1600 observer seeing both as dynamic, composite, naval-trading empires).

  2.  **Symmetric Counterfactual Support**:  
      -   *Requirement*: A candidate cause X must satisfy: (a) Its presence/character in F was necessary for F's outcome (removing it in F would likely prevent the outcome); (b) Its absence/character in C was sufficient to explain C's non-outcome (adding it to C would likely produce the outcome).  
      -   *Motivation*: Near-misses (#5) – e.g., if Song China had "proto-capitalist" features but no transition, claiming "markets" as *the* cause for Europe fails (b). Pure presence-in-F/absence-in-C (#6) risks correlation without difference-making.  
      -   *Adjudication*: Makes #3 both directions non-negotiable. The cost is high (requires deep knowledge of C), but essential for causal inference. A negative finding (X was present in C, or removing X in F didn't prevent proto-outcomes) is highly informative.

  3.  **Causal Separability (or Explicit Modeling of Interdependence)**:  
      -   *Requirement*: If the arms are causally coupled (#4), the explanation must either: (a) Demonstrate that the coupling did not significantly determine the outcome difference; or (b) Explicitly incorporate the interaction (e.g., "F's success actively undermined C via mechanism Y") as part of the cause.  
      -   *Motivation*: Dutch-Ottoman competition in spice trade, shared bullion flows, and potential knowledge transfer make coupling unavoidable. Ignoring it risks spurious explanation.  
      -   *Adjudication*: Coupling doesn't doom the question (#4), but demands explicit treatment. "Holding C fixed" means modeling the world *without F's specific causal mechanism operating*, not erasing F.

  4.  **Modal Robustness (Transportability + Difference-Making)**:  
      -   *Requirement*: The cause X must be both (a) A genuine *difference-maker* between F and C (present/operative in F, absent/inoperative in C); and (b) *Transportable* – plausibly capable of producing the outcome in C's context if added, not just correlated within the observed cases (#6).  
      -   *Motivation*: "Coal in Britain" fails (b) if C lacks geology. "Weak Ottoman centralization" fails if adding strong centralization to the *Ottoman context* wouldn't reliably produce Dutch outcomes due to other constraints. Factors present in both must be shown *not* to be sufficient.  
      -   *Adjudication*: Solves the "invisible causes in both" problem (#6) – they are necessary background conditions, not the contrastive cause. The cause must make the difference *and* be actionable in principle for C.

  5.  **Diachronic Precision**:  
      -   *Requirement*: The explanation must account for the *timing* of the divergence, not just the fact of difference. It must explain why the outcome emerged in F *when it did*, and why C did not achieve it *earlier or later* despite relevant preconditions.  
      -   *Motivation*: Near-misses (#5) are fatal if unaddressed (e.g., sophisticated Ottoman finance/capital markets pre-1600). This isn't just misdescription; it challenges the causal mechanism's sufficiency/timing.  
      -   *Adjudication*: A non-negotiable demand emerging from #5. An adequate answer *must* explain the near-miss or show why it wasn't one.

  ### Methodological Preferences (Camp-Dependent, But Impact Robustness)
  6.  **Contrast Relativity vs. Invariance (#2)**:  
      -   *Adjudication*: Strict invariance is unrealistic & often leads to vacuous answers. *Preference*: Allow contrast-relativity **BUT** demand clear *scope conditions*: The explanation must specify the *range* of contrasts (C-classes) for which X remains the key difference-maker. E.g., "Why Dutch not Ottoman?" may yield a different answer than "Why Dutch not Venice?", but the explanation should state *why* C matters (e.g., scale, internal structure). A negative finding can refine scope.
      -   *Motivation*: Honesty about context-dependence. A finding that X works for N.W. Europe contrasts but not for global ones is informative.

  7.  **Level Integration (#7)**:  
      -   *Adjudication*: Single-level *proximate* explanations (e.g., freight rates) are acceptable **IF** they satisfy Desiderata 1-5 and explicitly acknowledge necessary (but insufficient) background conditions at other levels. However, explanations solely at "deep" levels (e.g., culture) often fail Desideratum 4 (Modal Robustness) without specifying proximate mechanisms.  
      -   *Preference*: Multi-level integration is *strongly preferred* for completeness and avoiding "just-so" stories, but not absolutely non-negotiable if proximate mechanisms are robustly causal. The demand for "depth" is often valid if proximate factors lack transportability or diachronic adequacy.

  ### Critical Omission Addressed
  8.  **Explicit Divergence Baseline**:  
      -   *Requirement*: The explanation must specify the *point or period of divergence* and justify why F and C are comparable *at that baseline* on relevant dimensions related to the outcome.  
      -   *Motivation*: Addresses #8 directly. Outcomes of degree on divergent trajectories require pinning down *when* and *on what basis* the contrast is meaningful (e.g., "Both had sophisticated commerce circa 1580, yet F developed [specific outcome] by 1650 while C did not"). A negative finding can challenge the baseline validity.

  ### Flagged Tensions & Trade-offs
  *   **Contrast Relativity + Scope Conditions vs. Symmetric Counterfactual Support:** Specifying scope (Preference 6) makes symmetric testing tractable for *that scope*, but may limit generalizability. Demanding symmetry *across all possible contrasts* is impossible.
  *   **Causal Separability vs. Granularity:** Fully modeling interdependence (Core 3b) can make the explanation complex and harder to test with primary sources, favoring simpler contrasts. But ignoring it (Core 3a) risks invalidity for coupled cases.
  *   **Diachronic Precision vs. Parsimony:** Explaining *every* near-miss and timing quirk can lead to over-complex, multi-causal narratives that are hard to falsify.

  ### Conclusion on Question-Posing & Biggest Excluder
  No desideratum set makes *all* contrastive questions inherently well-posed. However, satisfying Core 1-5 and the Baseline requirement makes a question **testably robust**. Instability under re-description (#1) usually indicates failure of **Non-Tautological Contrast Definition (Core 1)** or poor **Scope Conditions (Preference 6)**.

  **The Desideratum Excluding the Largest Share of Usual Answers: Modal Robustness (Core 4b - Transportability).**
  *   **Resource Endowments (e.g., Coal):** Often fail transportability (can't add coal to the Ottoman heartland) and symmetric counterfactuals (many places had coal without an outcome).
  *   **Institutions:** Risk failing transportability if not specified mechanistically (How does transplanting "Dutch property rights" *alone* into the Ottoman context overcome other constraints like social structure?). Often lack diachronic precision.
  *   **Culture:** Extremely difficult to demonstrate transportability or symmetric counterfactuals robustly ("adding the Protestant ethic" to C is ill-defined).
  *   **State Formation:** Must show the *specific* state feature was difference-making *and* transportable (e.g., would a less fiscal-military Ottoman state have developed like the Dutch? Unlikely without other changes).
  *   **Pure Contingency:** By definition, fails Modal Robustness and Symmetric Counterfactuals (can't replicate "contingency").

  **Result:** A well-posed "Why F not C?" question requires a contrast defined independently of the outcome, a plausible shared baseline, and a hypothesized cause that is demonstrably both necessary in F, sufficient to alter C, transportable to C's context, capable of explaining the timing, and compatible with the degree of causal coupling. If your Dutch-Ottoman question meets this, it justifies the work.
