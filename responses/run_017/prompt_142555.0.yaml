  Then, for Player 2, M is weakly dominated by L (against U: both 1; against M: L gives 1, M gives 0). Remove M. Then only (U,L).

  Same result. 

  We need a game where the order matters. 

  Example from the literature: 

  Player 2
         L    R
  U     1,1  0,0
  M     1,0  0,1
  D     0,0  1,0

  But this is not symmetric. 

  Another example:

  Player 2
         L    R
  U     1,1  0,1
  M     1,0  0,0
  D     0,0  0,0

  For Player 1: 
  - U weakly dominates M? When Player 2 plays L: U=1, M=1 -> same; Player 2 plays R: U=0, M=0 -> same. So not dominated.
  - U and M weakly dominate D? When Player 2 plays L: U=1, M=1, D=0 -> so weakly dominated. When Player 2 plays R: U=0, M=0, D=0 -> same.

  So we can remove D. Then:

         L    R
  U     1,1  0,1
  M     1,0  0,0

  For Player 2, against U: L gives 1, R gives 1 -> indifferent.
  Against M: L gives 0, R gives 0 -> indifferent.
  So no dominance. 

  But we want a game that empties out. 

  Example from Marx and Swinkels, 1997, or other sources. 

  Here is a classic:

  Player 2
         a    b    c
  Player1
  A     0,0  1,1  0,1
  B     1,1  0,0  1,0
  C     1,0  0,1  0,0

  But this is for weak dominance with order dependence.

  First, note that for Player 1, A is not weakly dominated by B or C? 
  - If Player 2 plays a: A=0, B=1, C=1 -> A is worse.
  - If Player 2 plays b: A=1, B=0, C=0 -> A is better.
  - If Player 2 plays c: A=0, B=1, C=0 -> A is not uniquely worst.

  So not dominated.

   in this game, no strategy is strictly dominated. For weak dominance:

  Player 1: 
  - A is weakly dominated by B? When a: 0<1; b: 1>0; so no.
  - Similarly, no strategy is weakly dominated.

  So not helpful. 

  Another example:

  Player 2
         L    R
  U     1,1  0,0
  M     0,0  1,1
  D     0,0  0,0

  Then D is weakly dominated by U and by M. Remove D. Then we have the coordination game. 

  Still not order-dependent.

  We need a game with at least three strategies for each. 

  Example from https://www.jstor.org/stable/2951490?seq=1 (but I don't have access). 

  Here is one:

  Player 2
         L    C    R
  U     1,1  0,0  0,1
  M     0,0  1,1  0,0
  D     0,1  0,0  1,0

  Now, for Player 1:
  - U and M and D are not dominated by each other in an obvious way.

  Let's check for Player 1:
  - U vs M: 
     L: U=1, M=0 -> U better
     C: U=0, M=1 -> M better
     R: U=0, M=0 -> same
    So not dominated.
  - U vs D:
     L: 1 vs 0 -> U better
     C: 0 vs 0 -> same
     R: 0 vs 1 -> D better
    not dominated.
  - M vs D:
     L: 0 vs 0 -> same
     C: 1 vs 0 -> M better
     R: 0 vs 1 -> D better
    not dominated.

  For Player 2:
  - L vs C: 
     U: L=1, C=0 -> L better
     M: L=0, C=1 -> C better
     D: L=1, C=0 -> L better
    not dominated.
  - L vs R:
     U: L=1, R=1 -> same
     M: L=0, R=0 -> same
     D: L=1, R=0 -> L better
    so R is weakly dominated by L? Because in U and M, they are the same, and in D, L is better.
  - C vs R:
     U: C=0, R=1 -> R better
     M: C=1, R=0 -> C better
     D: C=0, R=0 -> same
    not dominated.

  So remove R for Player 2 (weakly dominated by L). Then the game is:

         L    C
  U     1,1  0,0
  M     0,0  1,1
  D     0,1  0,0

  Now, for Player 1:
  - U vs M: 
     L: 1 vs 0 -> U better
     C: 0 vs 1 -> M better
    not dominated.
  - U vs D:
     L: 1 vs 0 -> U better
     C: 0 vs 0 -> same
    so D is weakly dominated by U.
  - M vs D:
     L: 0 vs 0 -> same
     C: 1 vs 0 -> M better
    so D is weakly dominated by M.

  Remove D. Then:

         L    C
  U     1,1  0,0
  M     0,0  1,1

  This is a coordination game. 

  But if we had removed a different strategy first? 

  In the original game, for Player 1, is there a weakly dominated strategy? 
  - D might be weakly dominated by U? 
    When Player 2 plays L: U=1, D=0 -> U better
    C: U=0, D=0 -> same
    R: U=0, D=1 -> D better
    so not.
  - Alternatively, remove a different strategy for Player 2.

   What if we remove C for Player 2? Is C weakly dominated? 
    By L: 
      U: C=0, L=1 -> L better
      M: C=1, L=0 -> C better
      D: C=0, L=1 -> L better
    not dominated.
    By R:
      U: C=0, R=1 -> R better
      M: C=1, R=0 -> C better
      D: C=0, R=0 -> same
    not dominated.

  So the only weak dominance is R by L for Player 2. 

  This doesn't give order dependence. 

