   - Against M: L=0, R=3 -> R better.
   - Against D: L=5, R=6 -> R better.
   So R is better than L in some cases and not worse? Actually, against U: L=4, R=3 -> R is worse. So not dominated.

   I am considering the following:

  Player 2
