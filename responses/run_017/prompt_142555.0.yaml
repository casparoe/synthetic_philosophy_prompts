  - U is not weakly dominated by D: when Player 2 plays L, U=0, D=0; C: U=1, D=1; R: U=0, D=0 -> so U and D are payoff equivalent? Actually, in this matrix, U and D have the same payoffs? 
  U: 0,1,0
  D: 0,1,0
  So U and D are identical. So we can remove one of them, say D. 

  Then the game becomes:

         L    C    R
  U     0,0  1,0  0,1
  M     1,0  0,0  1,1

  Then for Player 2:
  - L: 0,0
  - C: 0,0
  - R: 1,1

  So R weakly dominates L and C (because in some cases it is better and never worse). 

  Then we are left with U and M for Player 1 and R for Player 2. Then Player 1: U gives 0, M gives 1 -> M is better. 

  But if we remove U first (because it is duplicate of D), we get the same. 

  We want an example where the outcome depends on the order. 

  Example from https://www.econ.uzh.ch/dam/jcr:ffffffff-9350-0074-0000-000046cde6d6/notdominance.pdf (page 2):

  Player 2
         a    b    c
  Player1
  A     1,3  2,2  0,0
  B     2,2  0,0  1,3
  C     0,0  1,3  2,2

  This is a game with no pure Nash, and no dominated strategies. 

