  ### Rational Choice and Games: Classroom Activity Design

  Below is a complete 90-minute activity designed to meet your objectives. The focus is on experiential learning through gameplay, with minimal lecture. The activity uses simple materials (coins, cards, tokens) and small integer payoffs to ensure accessibility.

  ---

  ### **Materials List**
  - **For Phase 1 (Strict Dominance):**  
    - 8 decks of playing cards (remove all except 3♥, 3♦, 4♠, 4♣ for simplicity).  
    - 16 coins (one per student).  
    - Tokens (e.g., poker chips) for payouts (1 token = 1 point on problem set or 1 chocolate piece).  
    - Whiteboard markers.  
    - Handout: Payoff Matrix A (see below).  

  - **For Phase 2 (Weak Dominance):**  
    - Handout: Payoff Matrix B (see below).  
    - Same tokens/coins as Phase 1.  

  - **For Phase 3 (Correlated vs. Independent Conjectures):**  
    - 5 decks of playing cards (use only ♠ and ♣ suits: 2♠, 3♠, 2♣, 3♣).  
    - 15 tokens.  
    - Handout: Payoff Matrix C (see below).  

  ---

  ### **Game Matrices** (All payoffs in tokens)
  #### **Matrix A: Strict Dominance by Mixtures (Two-Player)**  
  *Player 2 chooses columns; Player 1 chooses rows.*  
  ```
          L (3♦)     R (4♠)
  U (3♥)   0, 2       4, 1
  M (4♣)   4, 1       0, 2
  D (Joker) 1, 3       1, 3   // Joker = "Safe" card for D
  ```
  - **Key**: D is **not beaten by any pure strategy** (U loses to L, M loses to R) but is **beaten by a 50/50 mix of U and M** (expected payoff 2 > 1).  
  - Cards: Player 2 draws a card (L = 3♦, R = 4♠); Player 1 chooses U (3♥), M (4♣), or D (Joker).  

  #### **Matrix B: Weak Dominance Problems (Two-Player)**  
  ```
          X       Y       Z
  A      3, 3    0, 0    0, 0
  B      0, 0    3, 3    0, 0
  C      0, 0    0, 0    1, 1
  ```
  - **Key**: C is weakly dominated (by A or B). Eliminating C first leaves a coordination game; eliminating A or B first leaves C. Weakly dominated strategies vanish entirely if eliminated early.  
  - Cards: Player 2 draws X (2♠), Y (3♠), or Z (4♠).  

  #### **Matrix C: Correlated vs. Independent Conjectures (Three-Player)**  
  ```
  Player 3 chooses ♠ or ♣ (cards: 2=♠, 3=♣). Players 1/2 choose rows/columns.
  Payoffs for Player 1 only (Players 2/3 get symmetric payoffs based on their actions):
           P2: ♠       P2: ♣
  P3: ♠    4, [2,0]    0, [0,2]  
  P3: ♣    0, [0,2]    1, [2,0]  
  ```
  - **Key for Player 1**: Choosing ♠ is a best response to **correlated** conjectures (e.g., "if P3 plays ♠, P2 plays ♠; if P3 plays ♣, P2 plays ♣") but **not** to independent mixtures.  
  - **Symmetric payoffs for Players 2/3**: E.g., Player 2 gets 2 if they match Player 3’s card, 0 otherwise; Player 3 gets 2 if Players 1/2 mismatch.  

  ---

  ### **Activity Timeline** (90 Minutes Total)
  #### **Phase 1: Strict Dominance by Mixtures** (30 min)  
  1. **Setup (5 min)**:  
     - Pair students (8 pairs). Give each pair: Matrix A, 1 deck, coins/tokens.  
     - Rules:  
       - Player 2 draws a card (L = 3♦, R = 4♠).  
       - Player 1 chooses U (3♥), M (4♣), or D (Joker).  
       - Payoffs from Matrix A. Play 5 rounds.  
  2. **Gameplay (10 min)**:  
     - Students play. Instructor circulates, asking: *"Is any choice consistently bad? Why keep D?"*  
     - **Predictable event**: Some Player 1s stick with D (safe 1 token), avoiding U/M’s risk.  
  3. **Discovery (15 min)**:  
     - Groups discuss: *"Can you force Player 1 to earn less than 2 tokens? Can a coin flip help?"*  
     - **Critical moment**: Students realize:  
       - D earns 1 always.  
       - U/M alone can lose (0 tokens) but a 50/50 coin flip (U on heads, M on tails) earns 2 on average.  
     - **Payout**: Players re-play 5 rounds with randomization; compare D (avg 1) vs. mix (avg 2).  

  #### **Phase 2: Weak Dominance Pitfalls** (20 min)  
  1. **Transition (2 min)**: Regroup into same pairs. Distribute Matrix B.  
  2. **Gameplay (8 min)**:  
     - Player 2 draws X (2♠), Y (3♠), or Z (4♠). Play 5 rounds.  
     - Rules: Eliminate a strategy if it’s *always* ≤ others (weak dominance).  
  3. **Contrast (10 min)**:  
     - Half the pairs eliminate **C first** (weakly dominated by A/B). Result: A/B coordination game remains.  
     - Other half eliminate **A or B first** (weakly dominated by C in reduced games). Result: Only C survives.  
     - Groups report: *"Why did we get different outcomes?"*  
     - **Key insight**: Weak dominance order changes results; strict dominance does not.  

  #### **Phase 3: Correlated vs. Independent Conjectures** (30 min)  
  1. **Setup (5 min)**: Form 5 groups of 3 players. Distribute Matrix C and cards.  
  2. **Gameplay (15 min)**:  
     - **Round 1 (Correlated)**:  
       - Dealer (instructor) draws one card for Player 3 (2=♠, 3=♣).  
       - Player 2 sees Player 3’s card and **must match it** (♠/♠ or ♣/♣).  
       - Player 1 chooses ♠ or ♣. Best response: Play ♠ (earns 4 if P3=♠, 0 if P3=♣; avg 2).  
     - **Round 2 (Independent)**:  
       - Player 3 flips a coin (heads=♠, tails=♣).  
       - Player 2 flips a coin (heads=♠, tails=♣) **independently**.  
       - Player 1 chooses ♠ or ♣. Best response: Play ♣ (earns 0.25×4 + 0.25×0 + 0.25×0 + 0.25×1 = 1.25) > ♠ (1.0).  
     - **Payout**: Player 1 earns tokens for each round.  
  3. **Discussion (10 min)**:  
     - *"Why was ♠ better in Round 1 but ♣ better in Round 2?"*  
     - **Revelation**: In Round 1, P2’s move **correlated** with P3’s; in Round 2, moves were **independent**.  

  #### **Debrief and Formal Statement** (10 min)  
  - **Map to concepts**:  
    - Phase 1: Strictly dominated strategies are never rational if mixtures are allowed.  
    - Phase 2: Weakly dominated strategies vanish if eliminated early, but the algorithm isn’t "common knowledge"-proof.  
    - Phase 3: With >2 players, a strategy can be a best response only to **correlated** beliefs.  
  - **One-sentence formulation**:  
    > *"Iterated elimination removes strategies that are never a best response to any belief about others’ play—but only if beliefs are independent and rationality is common knowledge."*  
  - **Final note**: Common knowledge of rationality rules out strategies surviving iterated strict dominance.  

  ---

  ### **Predictable Challenges and Mitigations**  
  1. **Dominance Prodigy**:  
     - Student spots D’s dominance in Matrix A immediately.  
     - **Response**: *"Great! Now, can you prove it’s beaten by a coin flip?"* Redirect to randomization.  

  2. **Risk-Averse Student**:  
     - "Why not choose D? It’s safe!"  
     - **Response**: *"Let’s calculate: if you flip a coin for U/M, can you lose more than D?"* Show 2 > 1 mathematically.  

  3. **Confusing Mixture with Equilibrium**:  
     - "Is the coin flip an equilibrium?"  
     - **Response**: *"Not necessarily! The mixture *beats* D, but equilibrium depends on others’ responses."* (Save full NE for later lectures.)  

  4. **Algebra Disengagement**:  
     - Students freeze at variables.  
     - **Response**: Use coins/cards for tangible probabilities. Say *"No algebra—just count tokens."*  

  5. **Group Dysfunction**:  
     - One student dominates; others disengage.  
     - **Response**: Assign roles (e.g., "Dealer," "Recorder," "Chooser").  

  ---

  ### **Limits of the Activity**  
  - **What the activity CANNOT do**:  
    - Prove the equivalence of "never a best response" and "strictly dominated" for 2 players (requires formal proof).  
    - Generalize weak dominance pitfalls beyond 3 strategies (complexity blows up).  
    - Distinguish mixtures that include eliminated strategies vs. survivors (it doesn’t matter: strict dominance is transitive).  
  - **What YOU must supply post-activity**:  
    1. The formal definition: *"A strategy σ is strictly dominated if ∃σ' such that ∀s_{-i}, u_i(σ', s_{-i}) > u_i(σ, s_{-i})."*  
    2. The insight: With 3+ players, correlated beliefs allow for non-Nash best responses.  
    3. The caveat: Common knowledge of rationality is necessary for iterated elimination.  

  ---

  ### **Correction of Your Half-Memory**  
  > *"In a two-player game, 'strictly dominated by a mixed strategy' and 'never a best response' coincide. With three players, a strategy can be a best response to correlated conjectures but not to independent mixtures."*  
  **This is correct**. Example: Matrix C shows ♠ is a best response to correlated P2/P3 moves but not to independent mixtures. The gap exists because independent mixtures cannot replicate all correlated distributions (e.g., "P2 and P3 always match" requires correlation).  

  ---

  This activity forces students to confront the phenomena firsthand, names concepts through guided discovery, and isolates technical nuances with physical randomization. Run it as-is, and debrief gaps afterward.
