  Player1
  A     0,0  0,0  0,0
  B     0,0  1,1  2,0
  C     0,0  0,2  1,1

   In this game, for Player 1:
   - A is weakly dominated by B and by C? 
     For any move of Player 2, A gives 0. 
     B gives: against a:0, b:1, c:2 -> so in b and c, it gives more than 0.
     C gives: against a:0, b:0, c:1 -> in c, it gives 1>0.
     So A is weakly dominated by B and by C.

   Similarly, for Player 2, a is weakly dominated by b and by c? 
