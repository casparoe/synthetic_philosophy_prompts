  - U is not weakly dominated by M: because when Player 2 plays L, U=1, M=1 -> same; C: U=2, M=2 -> same; R: U=0, M=3 -> M better. So not dominated.
  - U is not weakly dominated by D: R: U=0, D=2 -> D better, but L: U=1, D=0 -> U better.
  - M and U: as above.

   For Player 2:
  - Against U: L=1, C=1, R=0 -> so R is weakly dominated by L and C.
  - Against M: L=2, C=2, R=3 -> so R is better.
  - Against D: L=0, C=3, R=2 -> so R is not dominated.

   So R is not dominated overall.

   But note, against U, R is weakly dominated by L or C. But against M and D, it is not. So we cannot remove R.

   I am using the following example from Stack Exchange (https://economics.stackexchange.com/questions/12470/example-for-a-game-with-no-pure-nash-equilibrium-but-many-mixed-one/12471#12471?newreg=8e0e7 or something else).

   After search, I recall that the game of "three men's Morris" or other, but let's use this:

  Player 2
         L    R
  U     1,1  0,0
  M     0,0  0,0
  D     0,0  1,1

   Then for Player 1, M is weakly dominated by U and by D. 
   If we remove M, then we have a coordination game between (U,L) and (D,R).
   But if we leave M, then for Player 2, against M, both L and R give 0, so they are indifferent. 

   But that's not order-dependent.

