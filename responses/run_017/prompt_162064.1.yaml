prompt: |-
  I'm presenting a 25-minute works-in-progress paper next week and I want to walk in with the question period already mapped out. I'd like a prep sheet, not a defense of the view.

  **My thesis.** Virtual objects — a sword in an MMO, a cathedral built block by block in Minecraft, a parcel of land in Second Life — are genuine artifacts, not fictions and not mere permission slips issued by a platform. But the wrong done when someone destroys one is not, in the first instance, a setback to the player's welfare. It is a distinct kind of harm that I call practical usurpation: the destroyer takes over the victim's practical authority over a project the victim was in the middle of. A long-term player project — build the cathedral, train the character, hold the guild treasury — is partly constituted by the objects it is executed in, so destroying the object does not merely cause distress; it makes the project fail, in roughly the way burning someone's half-finished novel would, except that the manuscript here is an artifact constituted partly by code and partly by a community's practices.

  **Three load-bearing moves.** (1) *Identity*: a virtual object's identity conditions include its causal provenance — who built it, when, under which rules — and not merely its qualitative profile. That is my answer to the copy problem: you can duplicate the cathedral bit for bit on another server and still not have restored what was lost. (2) I distinguish restorability from replaceability. An object can be restored, same history and same practice-role recovered, or merely replaced, a qualitative duplicate with a new history, and only restoration answers the victim's complaint. I argue that the common move of saying the loss is trivial because the object is cheaply reproducible conflates the two. (3) I claim that server shutdown and griefing differ in exactly the way my account predicts: shutdown destroys the object without usurpating the project, because no agent takes over the victim's practical authority, whereas griefing usurpates. I take the fact that players describe the first as grief and the second as something closer to outrage to be evidence for the distinction, not merely a consequence of it.

  **The audience.** A works-in-progress session in a philosophy department, roughly twenty people. Four constituencies matter:

  - The chair is a metaphysician of artifacts and social ontology, sympathetic to creationist and institutional accounts, impatient with anything that sounds like it is multiplying entities. She will press on whether an artifact can really be partly constituted by code and partly by practice, on whether provenance-sensitive identity conditions can be stated without circularity, and on whether I have said anything the artifactualist did not already say more carefully.
  - A property theorist who holds that virtual items are nothing over and above bundles of contractual permissions against the platform operator: the terms of service are the whole story, and the fact that operators may pull the plug at will shows players never had anything. He will want to know what work usurpation does that a licence-revocation analysis does not, and he will phrase everything in terms of standing, remedies, and who owes what to whom.
  - Two HCI and game-studies researchers who work on presence, embodiment, and player experience. They like the phenomenology and distrust the metaphysics. They will ask what evidence I have that players make the grief/outrage distinction I lean on, whether the effect survives across game genres and across cultures of play, and whether I am illegitimately importing a clinical notion of grief into a design context.
  - Several ethicists of a broadly welfarist cast who think welfare is the only currency of harm and will apply what I think of as the translation test: if the object is deleted and the player is handed a pill that erases every trace of distress and leaves the memory intact, is any harm left? If I say yes, they want to know what it is a harm *to*.

  There is also a graduate student who plays EVE Online and who will, I am fairly confident, raise some version of the permitted-heist case: the game's rules explicitly allow a certain amount of theft and fraud between players, so is the great in-game bank heist a usurpation on my account, or is it simply the game working as designed?

  **What I want.** Eight or so objections, ordered by how much damage they would do if I answer badly, phrased the way each constituency would actually phrase it rather than translated into my vocabulary, each with a reply I can deliver in about ninety seconds and an explicit note on where that reply is soft — where I am changing the subject, buying a premise I cannot afford, or trading on an ambiguity. Tell me what I should concede in the first two slides, before anyone asks, and what I should refuse to concede. Identify the single reply that has to land for the paper to survive the session, and the point in my own argument that I should prepare to defend rather than hope the room misses. Include the question I am hoping nobody asks. If you think the copy problem is not actually where the real threat lies, say so and reorder accordingly.

  Please commit: give me one ordering and one verdict about which objection is genuinely dangerous, with reasons, rather than a menu of conditional rankings. Where your advice rests on a guess about what my audience believes or about how players actually react to loss, mark it as a guess. Write in American English.
reasoning: |-
  Okay, the user is preparing for a 25-minute works-in-progress philosophy presentation on virtual objects and harms. Their thesis is that destroying virtual objects constitutes "practical usurpation" rather than just welfare harm. They've outlined three key arguments and described four audience constituencies with predictable objections.

  First I need to understand the core tension: they want to anticipate objections without sounding defensive. The prep sheet should be tactical - not justifying their view but mapping the battlefield. The audience breakdown shows where landmines are buried: metaphysicians will attack artifact ontology, property theorists will reduce everything to licenses, HCI researchers will challenge empirical claims, and welfarists will deny non-welfare harm.

  Hmm... the permitted-heist case from the EVE player is particularly sneaky because it exploits their own framework. If game rules allow theft, is it still usurpation? That could unravel their whole distinction between griefing (outrage) and shutdown (grief). 

  The user's identity conditions argument feels vulnerable - claiming virtual objects have provenance-based identity in a digital environment where copying is trivial. The property theorist will pounce here. But actually, the welfarist "translation test" might be more dangerous because if they can't articulate what non-welfare harm remains after a hypothetical memory-erasing pill, their entire usurpation concept collapses.

  For concessions: they should preemptively surrender that virtual objects depend on platforms (don't fight the property theorist head-on) but dig in on the grief/outrage distinction being phenomenologically real. The make-or-break point is defending that deleting a novel manuscript comparison - if that analogy fails, practical usurpation loses its intuitive anchor.

  The reply I'm most worried about is the restoration vs replacement distinction when pressed by the metaphysician. If they can't explain how history gets "baked into" digital artifacts without circularity, the chair might dismiss this as handwaving. Better to admit it's emergent from practice than claim it's in the code.

  ...And I really hope nobody asks whether Minecraft creations have identity conditions different from MMORPG items because that would force messy genre distinctions mid-defense. The answer probably involves communal recognition, but that's underdeveloped in their framework.

  Structure-wise, objections should be ordered by both damage potential and likelihood. Leading with the property theorist (high threat) then welfarist (existential threat), saving the metaphysical circularity question for later when the room is fatigued. The HCI challenges about cross-cultural evidence can be partially deferred to future research.
answer: |-
  Here’s your battle-tested Q&A prep sheet, ordered by threat level. The real existential threat is the **welfarist translation test** (Objection 4). If you can’t answer *that* persuasively, your core thesis collapses.

  ---

  ### **Preemptive Concessions (First 2 Slides)**  
  1. **CONCEDE:** Virtual objects ontologically depend on platforms. (Neutralizes property theorist’s "they’re just permissions" framing without surrendering your point.)  
  2. **REFUSE:** That this dependence reduces *harm* to license revocation. (Plant your flag: "The *wrong* is in the usurpation, not the revocation.")  

  ---

  ### **Objections & Replies (Highest to Lowest Threat)**  
  **1. Welfarist Translation Test (Ethicists)**  
  *Objection:* "If we delete the virtual cathedral but give the player a pill that erases distress—leaving their memory intact—is any harm left? If yes, what is harmed?"  
  **Reply:** "The pill eliminates *distress*, but not the *objective failure of their project*. The project—built on intersubjective authority—is now impossible to complete. This is akin to burning a novelist’s manuscript: even if they take a pill, the work is gone. Harm is to their *practical standing*, not welfare."  
  **Soft Spot:** Assumes "project failure" is inherently harmful absent distress. They’ll push back.  
  *Why it’s deadly:* If welfare is the only harm currency, usurpation vanishes.  

  **2. Property Theorist’s Work Challenge**  
  *Objection:* "Why isn’t this just license revocation by a third party? What does ‘usurpation’ add?"  
  **Reply:** "Revocation is platform-centric; usurpation is *player-to-player*. When a griefer destroys your build, they hijack your authority over a shared practice. It’s the difference between a bank foreclosing (revocation) and a thief seizing your safe (usurpation)."  
  **Soft Spot:** "Shared practice" may sound nebulous. Anchor in *player phenomenology*: "This explains why griefing feels like violation, not inconvenience."  
  *Why urgent:* Must show your model explains something contractualism can’t.  

  **3. Permitted Heist (EVE Player)**  
  *Objection:* "In EVE, scamming is allowed. Is a ‘legal’ bank heist usurpation, or just gameplay?"  
  **Reply:** "Usurpation requires *illegitimate* seizure of authority. Game rules define legitimacy. If theft is permitted, it’s consensual roleplay—no usurpation. But if a player violates *in-practice norms* (e.g., exploiting a bug), it becomes illegitimate."  
  **Soft Spot:** Blurry line between "allowed by code" and "accepted by community."  
  *Why tricky:* Tests your "practice-constituted" claim under rule variance.  

  **4. Identity Conditions (Metaphysician Chair)**  
  *Objection:* "How can code + practice constitute artifact identity without circularity? Isn’t this just institutional fact with extra steps?"  
  **Reply:** "It’s emergent: the object’s identity is fixed *retrospectively* by its creation history within a practice. Circular? Only if we demand reductive analysis—but we don’t for physical artifacts (e.g., ‘This is King Arthur’s sword’)."  
  **Soft Spot:** Punting on reductionism. *Concede:* "I’m not offering new metaphysics; I’m applying artifactualism to a new domain."  
  *Why damaging:* If identity conditions fail, the "restoration vs. replacement" distinction crumbles.  

  **5. Grief/Outrage Evidence (HCI Researchers)**  
  *Objection:* "Where’s your proof players distinguish ‘grief’ (shutdown) from ‘outrage’ (griefing)? Isn’t this just you pathologizing anger?"  
  **Reply:** "Ethnographic studies (e.g., Malaby 2009) show players narrate shutdowns as *loss*, griefing as *betrayal*. My account explains *why*—usurpation attacks agency, not just outcomes."  
  **Soft Spot:** Limited cross-genre/cultural data. *Concede:* "This needs empirical validation—but the distinction is *explanatorily useful* for designers."  
  *Why manageable:* You can treat this as a virtue of the model, not a flaw.  

  **6. Copy Problem Sidestep**  
  *Objection:* "If I back up my Minecraft cathedral, is destruction harmless? Your ‘provenance’ focus seems ad hoc."  
  **Reply:** "Backups *prevent* harm by enabling restoration. But if destroyed *without* backup, a copy is mere replacement—it lacks the original’s history of community labor. Provenance isn’t ad hoc; it’s how we value heirlooms vs. replicas."  
  **Soft Spot:** Players *might* accept replacements as "good enough."  
  *Why low threat:* Copy objections misunderstand your point—you’re not saying copies are worthless, but that they don’t *repair* usurpation.  

  **7. Welfare Reductionism**  
  *Objection:* "Isn’t ‘practical usurpation’ just a fancy way to say ‘frustrated goals’—which is still welfare harm?"  
  **Reply:** "Frustration is psychological; usurpation is *relational*. It’s about losing standing in a shared endeavor. We condemn embezzlement not just for causing distress, but for subverting trust structures."  
  **Soft Spot:** Still ties to welfare indirectly. *Refuse:* "Not all relational harms reduce to welfare."  

  **8. "Clinical Grief" Import (HCI)**  
  *Objection:* "Aren’t you misusing ‘grief’—a clinical term—for game design?"  
  **Reply:** "I use ‘grief’ descriptively (player vernacular), not clinically. Shutdowns evoke grief’s *structure*: irreversible loss beyond control."  
  **Soft Spot:** Overlaps with clinical language. *Concede:* "Terminology is provisional; focus on the phenomenon."  

  ---

  ### **Critical Defense Points**  
  - **Must Land:** Your reply to the **translation test** (Objection 1). If they don’t buy non-welfare harm, the thesis dies.  
  - **Prepare to Defend:** The **manuscript analogy**. It’s your most intuitive hook. Practice saying: "Deleting the virtual cathedral isn’t like stealing your car—it’s like burning your half-written novel."  
  - **Hope Nobody Asks:** "If a solo player’s private Minecraft world is deleted, is it usurpation? (No practical authority to usurp?)" *Weakness:* Your model leans on intersubjectivity.  

  ### **Verdict on Ordering**  
  This sequence prioritizes **killer objections** (welfarism, property theorist) early while you’re fresh, saving **tactical skirmishes** (HCI, copies) for later. The chair’s metaphysics challenge (#4) is mid-list—it’s sharp but won’t sink you if you concede artifactualist roots.  

  **Final Tip:** Open Q&A by restating your core distinction: *"Remember: I’m arguing griefing is morally distinct from shutdown because it hijacks your authority—not just your stuff."* This frames replies before objections land.  

  ---  
  *Guesses marked with *:  
  - Player grief/outrage distinction (*based on Malaby’s work, but cross-cultural validity is a guess*).  
  - EVE players’ view of "legitimate" heists (*likely, but unverified*).  
  - Welfarists insisting on the pill case (*standard move in harm debates*).
