  - If you use the rate that includes the genotype (because it reflects the true risk), then go to the behavior change case.
  - If you use the rate without the genotype (because that's what was known at the time), then go to the behavior change case.

  For those who used the genotype-included rate in the above, now consider the behavior change case: The risk number you assign might change the patient's behavior (e.g., if you say high risk, they might improve their diet and exercise, lowering their actual risk). How do you assign the risk?
