  For those who assign a single probability, consider how you do it. Do you select one of the two rates (e.g., the one from the group you consider more relevant) or do you combine the two rates (e.g., by averaging or using a model that integrates both factors)?
  - If you select one rate (say, based on which group has stronger evidence or is more relevant), then proceed to the Simpson's paradox case below.
  - If you combine the rates, also proceed to the Simpson's paradox case.

  Now, the Simpson's paradox case: Your patient has high cholesterol. You know that in every genetic subgroup, high cholesterol is associated with a lower risk of cardiac events compared to low cholesterol, but in the whole population, high cholesterol is associated with a higher risk. Which risk do you assign to the patient?
  - If you assign the aggregate rate (the whole population rate for high cholesterol), then go to the genetic marker case below.
  - If you assign the conditional rate (the rate for high cholesterol within the patient's genetic subgroup), then also go to the genetic marker case.

