answer: |-
  Below is a step-by-step procedure for attributing political effects to artifacts, designed for your constraints (20 minutes, public documents, 1–2 interviews). It blocks the specified failure modes by focusing on verifiable constraints, dependencies, and costs—not intentions or agency. The "upkeep" concept is validated as distinct (step 4) because it captures vulnerabilities from ongoing dependencies (e.g., vendor support, data feeds), not initial design or deployment choices.  

  **Procedure**  
  1. **Identify the non-negotiable output**  
     *Question:* Does the artifact *require* a specific output or constraint (e.g., "batteries must authenticate via app," "algorithm must exclude data from unverified sources")? Ignore goals like "optimize coverage"; focus on hard-coded rules.  
     *Sufficient answer:* Technical specs, API documentation, or vendor admissions confirming the output is unavoidable without modifying the artifact.  
     *If yes → ARTIFACT* (e.g., "The artifact enforces [output] by design."). Stop.  
     *If no/unclear → Proceed to step 2.*  

  2. **Test institutional constraints**  
     *Question:* Would the effect disappear if the institution changed its *deployment parameters* (e.g., budget, staffing rules) *without replacing the artifact*?  
     *Sufficient answer:* Institution/vendor confirms parameters are adjustable (e.g., "We could change the algorithm’s constraints if funding increased").  
     *If yes → INSTITUTION* (e.g., "The institution’s deployment choices drive these outcomes."). Stop.  
     *If no → Proceed to step 3.*  

  3. **Check upkeep dependencies**  
     *Question:* Does the effect arise from *ongoing external support* (e.g., updates, maintenance, data) that a third party can withdraw?  
     *Sufficient answer:* Evidence of dependency (e.g., "servers required for full functionality," "no local override") and harm from withdrawal (e.g., bankruptcy, contract lapse).  
     *If yes → UPKEEP* (e.g., "The artifact’s reliance on [support] creates vulnerabilities when withdrawn."). Stop.  
     *If no → Proceed to step 4.*  

  4. **Assess arrangement sensitivity**  
     *Question:* Would the effect vanish if the artifact were placed in a *different context* (e.g., different labor laws, user demographics, market structure)?  
     *Sufficient answer:* Comparison to similar deployments (e.g., "In Country X, this tool didn’t cause disparities due to stricter equity laws").  
     *If yes → ARRANGEMENT* (e.g., "The artifact interacts with local conditions to produce these outcomes."). Stop.  
     *If no/unclear → UNSETTLED* (e.g., "The origins of this effect remain ambiguous.").  

  **Failure modes blocked**  
  - **No intentions**: Steps 1–4 rely solely on observable constraints/dependencies. Designer motives are irrelevant.  
  - **No agency**: Artifacts "require," "depend on," or "interact with"—they don’t "decide" or "want."  

  **Case Analyses**  
  1. **Transit rostering system**  
     - Step 1: Algorithm doesn’t *require* split shifts; vendor says it "optimizes for coverage" (adjustable goal). → Proceed.  
     - Step 2: Authority admits constraints come from budget/contract. Changing these (e.g., more funding) could alter shifts. → **INSTITUTION**  
     *Sentence:* "The authority’s budget and contractual rules, not the algorithm itself, generate these schedules."  

  2. **Smart e-bike battery**  
     - Step 1: Battery *requires* app authentication for full range (hard-coded). → **ARTIFACT**  
     *Sentence:* "The battery’s design necessitates manufacturer authentication, rendering it unusable when support lapses."  

  3. **AI essay detector**  
     - Step 1: Does it *require* flagging non-native speakers? Vendor likely denies this; bias may stem from training data (adjustable). → Proceed.  
     - Step 2: University could add contestation routes or recalibrate thresholds without replacing the tool. → **INSTITUTION**  
     *Sentence (revised as requested):* "The university’s deployment—adopting the detector without safeguards—disproportionately harms non-native speakers."  

  **What the procedure cannot do**  
  - **Misclassifies "invisible" artifacts**: Systems with no public specs (e.g., proprietary algorithms) may default to UNSETTLED.  
  - **Smuggles values**: Choosing "whose options count" (step 1) and "comparison context" (step 4) relies on your judgment.  
  - **Oversimplifies hybrids**: Cases where artifact + institution + upkeep interact (e.g., biased design + careless deployment + no updates) force arbitrary prioritization.  
  - **Editorial caveat**: When evidence conflicts (e.g., vendor vs. user claims), the editor must weigh credibility—procedure can’t resolve this.  

  \answer{INSTITUTION}
