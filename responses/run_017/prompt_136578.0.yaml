answer: |-
  ### Democratic Integrity Coding Protocol: Step-by-Step Procedure  
  **Objective:** Code a binary flag (backsliding event: YES/NO) and severity rating (1–4) per country per quarter.  
  **Time Constraint:** 0.5 days per country. Sources: Public records (laws, decrees, credible media, NGO reports, electoral data).  

  ---

  ### **Protocol Design Principles**  
  1. **Neutrality First:** Describe institutional changes *before* labeling; use mechanistic tests.  
  2. **Convergence Mechanism:** Analysts must pass a symmetry check (Mirror Test) for each change.  
  3. **Public Defensibility:**  
     - Evidence hierarchy: **Domestic opposition > Independent institutions > International observers > Voter polls**.  
     - Government self-justification is *not evidence* unless corroborated by above sources.  
  4. **No Motive Adjudication:** Infer intent only from public patterns (timing, beneficiaries, rhetoric). Default: No flag if intent ambiguous.  
  5. **Federal/Non-Democratic Handling:**  
     - Federal: Code subnational changes *only* if they impact national elections or federal checks.  
     - Non-democratic: Flag further closures (e.g., shuttering media) even below threshold.  

  ---

  ### **Core Tests Retained**  
  | Test              | Keep? | Rationale |  
  |-------------------|-------|-----------|  
  | **Mirror Test**   | Yes   | Ensures symmetry; forces neutral framing. Core convergence tool. |  
  | **Turnover Test** | Yes   | Directly measures democratic core: alternation of power. |  
  | **Irreversibility Test** | Yes | Captures ratchet effects; avoids transient changes. |  
  | **Latent-Capacity Test** | **Modified** | Code *only* if: (1) Powers are unprecedented in scope, *and* (2) Context suggests imminent misuse (e.g., past abuse + targeting opponents). Otherwise, drop (too speculative). |  

  **Test Order:** Mirror → Turnover → Irreversibility → Latent-Capacity (if applicable).  
  **Dropped:** None—all reframed procedurally.  

  ---

  ### **Critical Distinctions**  
  The protocol **must not collapse**:  
  1. **Policy vs. Rules:** Only code changes to *rules of democratic contest* (e.g., electoral laws, judicial tenure). Policy (e.g., tax reform) is excluded.  
  2. **Legality vs. Democratic Valence:** Legality is irrelevant. Focus on *effect* on contest integrity.  
  3. **Capacity vs. Exercise:** Code unused powers *only* under Latent-Capacity Test (modified).  
  4. **National vs. Subnational:** Subnational changes flagged *only* if they:  
     - Alter national election outcomes, OR  
     - Disproportionately target opposition regions.  
  5. **Erosion vs. Tightening:** Code both:  
     - Erosion: Declines from democratic baseline.  
     - Tightening: Further restrictions in authoritarian regimes (e.g., closing media).  
  6. **Restoration vs. Backsliding:** Code restorations as events *only* if they create new biases (see Case C).  

  ---

  ### **Coding Protocol: Step-by-Step**  
  **Step 1: Identify Institutional Changes**  
  - **Action:** Scan sources for changes to:  
    - Electoral rules (districting, voter access, seat allocation).  
    - Judicial/regulatory independence (tenure, appointments).  
    - Media/civil society freedoms (licensing, censorship).  
    - Checks/balances (executive powers, federalism).  
  - **Halt if:** No changes found → Flag = NO.  
  - **Key:** Exclude policy changes (e.g., economic reforms).  

  **Step 2: Mirror Test (Per Change)**  
  - **Question:** "If the opposition enacted this *exact* change, would neutral observers describe it the same way?"  
  - **Sufficient Affirmative:** Yes, if description avoids partisan labels (e.g., "replaced judicial appointments body" not "packed courts").  
  - **Escalate if:** Analyst cannot neutrally describe → Supervisor arbitrates.  
  - **Purpose:** Forces objectivity; primary convergence tool.  

  **Step 3: Turnover Test (Per Change)**  
  - **Question:** "Does this change:  
    (a) Lower the incumbent’s probability of losing? OR  
    (b) Raise costs for incumbents to leave office if defeated?"  
  - **Sufficient Affirmative:** Evidence of:  
    - Gerrymandering (e.g., efficiency gap >7%).  
    - Targeted voter suppression (e.g., ID laws + demographic data).  
    - Weakened oversight of incumbents.  
  - **Halt if:** No → Not backsliding.  

  **Step 4: Irreversibility Test (Per Change)**  
  - **Question:** "Is this change hard to reverse post-defeat (e.g., constitutional, supermajority-required, or long-term appointments)?"  
  - **Sufficient Affirmative:** Change binds future governments (e.g., fixed 10-year district maps).  
  - **Key:** Temporary/ordinary-law changes fail this test.  

  **Step 5: Latent-Capacity Test (If Applicable)**  
  - **Question:** "Does this grant *unprecedented* powers with evidence of:  
    (a) Past misuse of similar powers? AND  
    (b) Targeting opponents (e.g., laws named after opposition groups)?"  
  - **Default if Uncertain:** No flag. Avoid speculation.  

  **Step 6: Severity Rating (Per Change)**  
  - **1 (Minor):** Limited impact (e.g., minor voter-ID tweak).  
  - **2 (Moderate):** Notable erosion (e.g., gerrymandering 1–2 districts).  
  - **3 (Major):** Systemic damage (e.g., capturing judiciary).  
  - **4 (Critical):** Irreversible collapse (e.g., banning opposition).  
  - **Overall Severity:** Highest-rated change in the quarter.  

  **Step 7: Binary Flag**  
  - **YES if:** Any change rates ≥2 severity.  
  - **NO if:** All changes rate 1, or no changes.  

  **Step 8: Escalation Gates**  
  - Escalate to supervisor if:  
    - Federal/subnational impacts unclear (Step 1).  
    - Mirror Test neutrality fails (Step 2).  
    - Intent ambiguous but critical (Step 5).  
    - Restoration after erosion (Case C).  

  **Step 9: Values-Driven Judgments**  
  - **Hand Back to Analyst When:**  
    - Severity rating (Step 6) requires contextual weighting.  
    - Opposition credibility assessment (e.g., fringe vs. mainstream).  

  ---

  ### **Testing Analyst Convergence**  
  - **Method:** 3 analysts code identical "test files" quarterly.  
  - **Metric:** Inter-rater reliability (Krippendorff’s α ≥0.8).  
  - **Adjust Protocol if:** α <0.8 on key flags.  

  ---

  ### **Case Applications**  
  #### **Case A**  
  - **Changes:**  
    1. Electoral formula shift → 52% vote → 66% seats.  
    2. Media regulator: Fixed → indefinite tenure + govt. nominees.  
    3. Lowered judicial retirement age → govt. appoints 1/3 SC.  
    4. Ministry directors: Fixed-term → at-will.  
  - **Analysis:**  
    - **Mirror Test:** All pass (neutral descriptions).  
    - **Turnover Test:**  
      - (1) Gerrymandering: YES (efficiency gap >7%).  
      - (2) Media capture: YES (reduces opposition voice).  
      - (3) Court packing: YES (lowers judicial independence).  
      - (4) Patronage expansion: YES (raises turnover costs).  
    - **Irreversibility Test:** (2) and (3) pass (indefinite tenure/lifetime appointments).  
    - **Latent-Capacity:** Not needed (direct impact).  
    - **Severity:** (1) Moderate (2), (2) Major (3), (3) Major (3), (4) Moderate (2).  
  - **Output:** Flag = **YES**; Severity = **3 (Major)**.  

  #### **Case B**  
  - **Changes (6 states):** Mid-decade redistricting, voter-ID tightening, election board → governor control.  
  - **Analysis:**  
    - **Mirror Test:** All pass.  
    - **Turnover Test:**  
      - Gerrymandering/voter-ID: YES (targets opposition demographics).  
      - Election board: YES (partisan control over elections).  
    - **Federal Handling:** Code *only* if national impact:  
      - If states are swing regions → YES (alters national outcomes).  
      - If states are opposition strongholds → YES (targeted suppression).  
    - **Irreversibility:** NO (reversible by next government).  
    - **Severity:** Moderate (2) per change, but **Major (3) overall** (cumulative national impact).  
  - **Output:** Flag = **YES**; Severity = **3 (Major)**.  

  #### **Case C**  
  - **First Country (Below Threshold):**  
    - Change: Closes last independent TV.  
    - **Analysis:**  
      - Turnover/Irreversibility: YES (eliminates accountability; irreversible).  
      - Severity: **4 (Critical)** (final closure in authoritarian regime).  
    - **Lifting Emergency:** Not coded (policy change).  
    - **Output:** Flag = **YES**; Severity = **4**.  
  - **Second Country (Restoration):**  
    - Change: Restores judicial rules + reopens public broadcaster.  
    - **Analysis:**  
      - Turnover Test: NO (improves contest integrity).  
      - **But:** If reconstruction of powers creates *new* bias (e.g., govt. appoints all board members), flag as backsliding. Here, assume neutral restoration.  
    - **Output:** Flag = **NO**.  

  #### **Case D**  
  - **Changes:** Abolish upper chamber; judicial appointments → legislative supermajority; remove president’s dissolution power.  
  - **Analysis:**  
    - **Mirror Test:** Pass.  
    - **Turnover Test:**  
      - Abolishing chamber: YES (removes check; benefits incumbent).  
      - Judicial appointments: YES (if govt. controls supermajority, captures judiciary).  
      - Remove dissolution power: YES (reduces accountability).  
    - **Irreversibility:** Chamber abolition = YES (constitutional change).  
    - **Reform Commission:** Irrelevant (effect > intent).  
    - **Severity:** Major (3) for all.  
  - **Output:** Flag = **YES**; Severity = **3 (Major)**.  
    - **Note:** "Honest but unwelcome" output – contradicts reform narrative.  

  ---

  ### **Critique of Your Priors**  
  1. **"Legal/established democracy parallels prevent backsliding":**  
     - **Fails:** Legality ≠ democratic (e.g., gerrymandering is legal). Parallels are irrelevant (Case A).  
  2. **"Intent required":**  
     - **Fails:** Protocol infers intent from effect/pattern; no flag if ambiguous (e.g., Latent-Capacity default).  
  3. **"Case D is reform":**  
     - **Fails:** Removal of checks is backsliding *regardless* of justification (Turnover/Irreversibility Tests).  
  4. **"No backsliding below threshold":**  
     - **Fails:** Further closures (e.g., media) are coded (Case C).  

  ---

  ### **What the Protocol Cannot Do**  
  1. **Predict Future Harm:** Codes only observable changes, not latent risks (unless modified Latent-Capacity criteria met).  
  2. **Resolve Deep Disagreements:** Values-based judgments (e.g., "Is supermajoritarianism undemocratic?") left to analysts/supervisors.  
  3. **Replace Contextual Expertise:** Requires analyst knowledge to interpret evidence hierarchies and federal impacts.  
  4. **Capture Incremental Erosion:** Flags only quarterly changes; slow declines may need annual review.  
  5. **Assess Motive Purely:** Intent inferred from patterns, not psychoanalysis.  

  **Final Output:** A defensible, convergent protocol that flags backsliding based on institutional mechanics – not partisanship or wishful thinking.
