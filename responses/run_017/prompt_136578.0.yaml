  We are designing a coding protocol for democratic backsliding events. The protocol must be:
   - Executable by country specialists in half a day per country per quarter.
   - Returns two items: a binary flag (backsliding event occurred?) and a severity rating (1-4).
   - Must ensure convergence among politically diverse analysts.
   - Defensible in public: institutional change must be coded before naming, rules about evidence sources.
   - Avoid adjudicating motive: infer intent from public record when indispensable; default when unclear.
   - Handle countries below democratic threshold and federal systems.

   Constraints:
   1. Analysts disagree politically -> build symmetry checks. Test convergence by having multiple analysts code same file and measure inter-rater reliability.
   2. Public defensibility: code the change neutrally, then assess. Rule: complaints from multiple independent domestic sources (opposition, civil society, independent media) are required as evidence for contested changes. Government self-description and outside observers are secondary; voter assessments (if from reliable polls) can be considered but not alone.
   3. Avoid motive: when intent is indispensable, infer from (a) the timing (e.g., before an election), (b) the pattern (multiple changes in quick succession), (c) the beneficiaries (consistently the incumbent), (d) public statements by the actors. Default when intent cannot be inferred: no flag for that change (but note: the change might still be coded under other steps without intent).
   4. Handle non-democracies and federal systems: for federal, code at national level unless state-level changes have national implications (e.g., affect national elections). For countries below threshold, code changes that further erode democratic institutions (even if already authoritarian) or that consolidate authoritarianism.

   Candidate tests and their evaluation:
   - Mirror test: Keep. It is a symmetry check to avoid partisan bias. Ask: "If the opposition had done the same thing, would we code it the same way?" This forces neutral description.
   - Turnover test: Keep. It focuses on the core of democracy: alternation in power. If a change makes it harder for the incumbent to lose or for the loser to leave, it is backsliding.
   - Irreversibility test: Keep. A ratchet effect (change survives government change) is a strong indicator of entrenchment. But note: some changes might be reversible only with supermajority, which can be coded as irreversibility.
   - Latent-capacity test: Problematic. Granting unused powers can be backsliding if they are designed to be used against opponents in the future. However, without exercise, it's speculative. Modify: Code only if the power is granted in a context of recent abuse of similar powers OR if there is evidence (e.g., statements) that it is intended for future use against opponents. Otherwise, do not code.

   Order of tests: The order I propose is:
   1. Mirror test (to ensure neutral description)
   2. Turnover test (core democratic impact)
   3. Irreversibility test (entrenchment)
   4. Latent-capacity test (with the modification above) - but use sparingly.

   Distinctions we must not collapse:
   - Policy change vs. rules of the contest: Only changes to the rules of the contest (electoral rules, judicial independence, media freedom, etc.) are backsliding. Policy changes (e.g., tax laws) are not unless they directly alter the democratic contest.
   - Legality vs. democratic valence: A change can be legal but still backsliding (e.g., using legal majorities to change the constitution in a self-serving way). Legality is not a defense.
   - Capacity vs. exercise: Exercise of power to undermine democracy is clear backsliding. Capacity without exercise is only coded if there is evidence of intent (as above) and if it meets other tests.
   - National vs. subnational: In federal systems, code subnational changes if they affect national elections or national democratic integrity (e.g., gerrymandering in states that affect national legislature). Otherwise, note but do not flag at national level.
   - Erosion from democratic baseline vs. tightening within authoritarian: Both can be backsliding. In non-democracies, further closing of space (e.g., closing last independent TV) is backsliding. Also, even in democracies, tightening (e.g., making an already weak opposition even weaker) is backsliding.

