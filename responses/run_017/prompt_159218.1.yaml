prompt: |-
  I teach a 90-minute upper-level seminar on theories of well-being — fourteen students, mostly philosophy majors, plus two psychology majors who keep dragging in empirical work on mood and reward. Last night, after a departmental colloquium, I had a long and entirely circular argument with a friend who works in affective neuroscience. Her claim: that there is one thing all pleasant experiences share is a folk illusion, and what we call pleasure is just a grab-bag of states that happen to move us in similar directions. My reply, repeated too many times: if you give up on a shared feature you lose whatever made pleasure the thing worth having in the first place, and you are left with a list instead of an explanation. We got nowhere, and I would rather my students run into the same wall than hear me describe it.

  So I want a structured activity for that session in which they assemble the problem themselves. The three words they must not hear until the last ten minutes are hedonism, valence, and heterogeneity; before that, everything should be in their own vocabulary. The shape I have in mind: first they each generate the experiences they would unhesitatingly call pleasant, and the ones they would call pleasant only under protest, and the group tries to write a single definition that covers all and only the first set; then the definition breaks in a specific, discoverable way, and they find themselves pushed toward either a felt-quality account (pleasure as a distinctive way an experience feels) or an attitudinal account (pleasure as liking or wanting the experience while you are having it). I also want them to feel the pull of a third option I have been toying with and cannot make airtight: that pleasant names a role rather than a quality — the state such that, when you are in it, you want to go on being in it, and its presence settles whether things are going well for you at that moment. Two invented materials I would like built into the activity as evidence the students have to rule on rather than as illustrations from me: a fictional ethnographic vignette about a small community whose classificatory term covers relief, absorption in a hard task, being proven right, and the cold alertness after a long fast, but not the taste of ripe fruit; and a fictional neural marker that tracks self-reported pleasantness cleanly across sensory cases but splits off sharply for absorbed, effortful ones. There should be something at stake in the room — perhaps they are advising a clinician, or programming something benevolent — so that the choice between the accounts is a decision with consequences rather than a poll.

  Please give me the activity as exactly five numbered beats — the setup (with materials and timing folded in), the first round, the turn where the invented cases land, the forced choice, and the debrief — each beat one or two sentences, with no preamble and no closing summary. The debrief should map specific moments in the room onto the three accounts, tell me what will predictably go wrong the first time I run this and how to handle it, and be honest about which feature of the problem the activity cannot reproduce and that I will have to supply myself.
reasoning: |-
  Hmm, the user is a philosophy professor teaching an upper-level seminar on well-being theories. They had a circular debate with a neuroscientist friend about whether pleasure has a shared core feature or is just a heterogeneous collection of states. They want to create a structured classroom activity where students discover this problem themselves without using terms like "hedonism," "valence," or "heterogeneity" until the end.

  The activity needs five specific beats: setup, first round with definition-building, introducing fictional cases, forced choice with stakes, and debrief. Students should generate personal examples of clear vs. borderline pleasant experiences, craft a definition that fits only the clear cases, then see it break when presented with fictional ethnographic and neural evidence. The forced choice should have real stakes like advising a clinician.

  Key requirements include: students must create their own vocabulary initially; two invented materials (ethnographic vignette about a culture with different pleasure classifications, neural marker data showing divergence); and exploration of three accounts (felt-quality, attitudinal, and the professor's role-based theory). The debrief must connect classroom moments to theories, predict pitfalls, and admit what the activity can't capture.

  For the setup, I'll design a handout with three columns: "Clear Pleasant," "Borderline Pleasant," and "Distinctly Not Pleasant" - students fill this individually first. Then groups merge examples and try to define "pleasant" to cover only column one. Timing should be tight: 5 minutes individual, 15 minutes group definition.

  The turn introduces the two fictional materials: the ethnographic case (community that includes relief, absorption, etc. but excludes taste) and neural data showing sensory vs. effortful states decoupling. This forces definition revision. I'll make the neural marker fictional but plausible-sounding.

  For the forced choice, I'll add stakes: students must advise either a clinician designing a mood disorder treatment (favors felt-quality/attitudinal) or an AI programmer creating a well-being monitor (favors role-based). Groups choose one account and justify based on consequences. This makes it consequential rather than abstract.

  The debrief maps their definition struggle to felt-quality, their attempts to save it with wanting/liking to attitudinal, and the role-based option when definitions fail. Predictable problems: students might conflate pleasure with happiness or miss the heterogeneity point. The activity can't replicate the neuroscientist's "grab-bag" intuition - the professor will need to supply that perspective after the debrief.

  I'll keep each beat to 1-2 sentences as requested, using active language. The ethnographic vignette will describe the Kaelin people explicitly, and the neural marker as "NeuroTrack-7" for specificity. Stakes are framed as two memos to choose from. In debrief, I'll note that the activity may oversimplify attitudinal accounts by reducing them to "wanting."
answer: |-
  Here are the five beats:

  1.  **Setup (Handout & Groups):** Distribute individual worksheets with three columns: "Clear Pleasant" (experiences I'd unhesitatingly call pleasant), "Borderline Pleasant" (pleasant only under protest), "Distinctly Not Pleasant"; give 5 minutes to fill silently, then form triads to merge their "Clear" lists and write a single definition capturing *only* these (15 minutes).  
  2.  **First Round (Definition & Stress Test):** Groups share definitions; the class compiles a master "Clear Pleasant" list on the board and votes on/challenges one definition to refine it into a single, agreed-upon statement that must exclude all "Borderline" and "Not Pleasant" examples volunteered earlier (20 minutes).  
  3.  **The Turn (Introducing Anomalies):** Distribute two new "evidence reports": 1) An anthropologist's note on the Kaelin people (their term *sheltok* covers relief, deep task focus, being proven right, fasting alertness, but *never* ripe fruit taste), and 2) Lab data showing "NeuroTrack-7" correlates perfectly with self-reported pleasantness for sensory joys (food, warmth) but shows *opposite* activation during focused, effortful states also self-reported as pleasant (like solving a puzzle); groups get 10 minutes to judge if these challenge their definition and how.  
  4.  **Forced Choice (Stakes & Decision):** Announce they are advising a client choosing between two projects: Project SUN (targets a specific, consistent neural "glow" state for mood disorders) or Project FLOW (optimizes for states people actively seek to maintain during them); groups must choose *one* project to endorse, justifying *only* by which account of pleasantness their revised thinking supports (felt-quality, "wanting/liking", or a "maintenance-worthy state"), based on the evidence and stakes (15 minutes for group decision & brief justification prep).  
  5.  **Debrief (Mapping & Limits):** Map: Their initial definition struggle reflects felt-quality, attempts to save it using "wanting/liking" reflects attitudinal accounts, and Project FLOW arguments reveal the "role" option; predict groups will conflate pleasure with happiness or causal features, handle by asking "Is that sensation *itself* pleasant or just causing it?"; admit the activity cannot replicate the neuroscientist's *intuition* of heterogeneity as fundamental—you must explicitly pose that "grab-bag" challenge after the debrief.
