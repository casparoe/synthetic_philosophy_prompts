  The blackmailer is a perfect predictor. They know both S and P (your type, i.e., what you would do if you received the letter). The blackmailer sends you a letter if and only if exactly one of S or P is true (i.e., S XOR P is true). So:

  - If you have the secret (S=1) and you are the type who doesn't pay (P=0), then the blackmailer sends the letter (because exactly one is true: 1 XOR 0 = 1).
  - If you don't have the secret (S=0) and you are the type who pays (P=1), then the blackmailer sends the letter (0 XOR 1 = 1).
  - If both are true (S=1 and P=1) or both false (S=0 and P=0), then no letter is sent (1 XOR 1 = 0, 0 XOR 0 = 0).

  Now, if you receive the letter, it demands payment. You must decide whether to pay or not. The payoffs:

