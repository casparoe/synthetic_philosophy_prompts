  ### Understanding XOR Blackmail and FDT's Resistance to Extortion

  #### Setup of XOR Blackmail
  - **The Secret**: You have a 50% chance of possessing a costly secret (e.g., a termite infestation). If revealed, it costs you **$1,000**. If you lack the secret, revelation costs nothing.
  - **The Blackmailer**: A perfect predictor who knows both (1) whether you have the secret and (2) your *type* (i.e., your policy for responding to extortion: "pay" or "don't pay").
  - **The Letter**: Sent if and only if exactly one of two conditions is true:  
    - You have the secret, AND you are the "don't pay" type.  
    - You lack the secret, AND you are the "pay" type.  
    This is the XOR condition: (Secret AND ¬Pay) OR (¬Secret AND Pay).  
  - **The Demand**: If you receive the letter, the blackmailer demands **$100** to keep the secret silent.  
    - If you **pay**, the secret is never revealed.  
    - If you **don't pay**, the secret is revealed *only if you actually have it*.  

  #### Payoffs Upon Receiving the Letter
  | Your Action | If You HAVE the Secret (Cost if revealed: $1,000)         | If You LACK the Secret (Cost if revealed: $0)         |
  |-------------|----------------------------------------------------------|-------------------------------------------------------|
  | **Pay**     | –$100 (payment avoids revelation)                        | –$100 (payment wasted; no secret exists)             |
  | **Don't Pay**| –$1,000 (revelation occurs)                              | $0 (no secret, no cost)                              |

  ### How CDT and FDT Approach the Decision
  #### Causal Decision Theory (CDT) Pays
  - **Reasoning**: CDT ignores the predictor's knowledge and focuses on *causal effects* of your action. Conditional on receiving the letter:  
    - Paying **causes** the secret not to be revealed (saving $1,000 if you have the secret).  
    - Not paying **causes** revelation if you have the secret.  
    - CDT assigns a 50% probability to having the secret (since the letter doesn't reveal whether you have it). Thus:  
      - *Expected utility of paying*: –$100 (no dependence on the secret).  
      - *Expected utility of not paying*: 50% chance of –$1,000 = –$500.  
    - **Result**: CDT pays to avoid the risk of a $1,000 loss.  
  - **Flaw**: CDT doesn't account for the *correlation* between your action (pay/don't pay) and the existence of the secret. If you pay, the predictor only sent the letter because you *lack* the secret. Paying wastes $100. If you don't pay, the predictor only sent the letter because you *have* the secret, costing $1,000. CDT pays anyway, losing $100 unnecessarily in the no-secret scenario.

  #### Functional Decision Theory (FDT) Resists Extortion
  - **Reasoning**: FDT chooses a *policy* (a rule for all similar situations) that maximizes expected utility *before* the predictor acts. It considers:  
    - **Policy A (Always Pay)**: You are the "pay" type.  
      - The predictor sends the letter *only if you lack the secret* (XOR condition: ¬Secret AND Pay).  
      - If you have the secret (50% probability), no letter is sent, and the secret remains hidden at no cost.  
      - If you lack the secret (50% probability), you receive the letter, pay $100, and lose nothing else.  
      - *Expected utility*: 50% × (–$100) = –$50.  
    - **Policy B (Never Pay)**: You are the "don't pay" type.  
      - The predictor sends the letter *only if you have the secret* (XOR condition: Secret AND ¬Pay).  
      - If you have the secret (50% probability), you receive the letter, don't pay, and lose $1,000.  
      - If you lack the secret (50% probability), no letter is sent, and you pay/lose nothing.  
      - *Expected utility*: 50% × (–$1,000) = –$500.  
  - **Comparison**:  
    - Policy A (Always Pay): Expected utility = –$50.  
    - Policy B (Never Pay): Expected utility = –$500.  
    FDT chooses **Policy A** since it has higher expected utility.  
  - **Upon Receiving the Letter**: An FDT agent follows Policy A and **pays the $100**.  

  #### Why the Passage Claims FDT "Resists Extortion"
  - **The Key Insight**: FDT evaluates the *logical counterfactual* of your policy. It recognizes that:  
    - If you adopt Policy A (Always Pay), the predictor sends the letter *only when you lack the secret*, so paying is futile (you pay $100 for nothing).  
    - If you adopt Policy B (Never Pay), the predictor sends the letter *only when you have the secret*, so not paying costs $1,000.  
  - **Resisting Extortion**: Despite Policy A requiring payment, FDT only adopts it because it yields better *overall* outcomes. Crucially:  
    - In the **rare-secret variant** (e.g., 5% chance of having the secret), FDT switches to **Policy B (Never Pay)**:  
      - Expected utility of Policy B: 5% × –$1,000 = –$50.  
      - Expected utility of Policy A: 95% × –$100 = –$95.  
      - FDT chooses Policy B, and upon receiving the letter, **does not pay**.  
    - Here, FDT "resists extortion" by refusing to pay, accepting the rare $1,000 loss when the secret exists, rather than frequently wasting $100 when it doesn't. CDT, in contrast, *always pays* upon receiving the letter, losing $100 frequently (when the secret is absent) due to its failure to account for the predictor's correlation.  
  - **Correction to Your Sketch**: Your description was mostly correct, but FDT's "resistance" arises in the rare-secret case, where it adopts a non-payment policy. The blackmailer sends the letter only if you have the secret, so not paying *does* cost $1,000, but FDT accepts this because the net loss is lower than CDT's frequent payments.

  ### Core Summary
  Summary: FDT agents resist extortion in XOR blackmail by adopting a policy of non-payment when the secret is sufficiently rare, thereby avoiding the frequent, unnecessary payments made by CDT agents who fail to account for the correlation between their actions and the existence of the secret.
