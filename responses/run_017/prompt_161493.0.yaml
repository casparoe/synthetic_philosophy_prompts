prompt: |-
  I'm an analyst on a growth team at a mid-size app company — I run maybe 3-5 A/B tests a month and I write the one-slide readout that decides whether we ship. Every couple of months somebody turns up with a Simpson's-paradox-in-the-wild: variant B wins on the topline conversion number but loses in every segment we slice by, or the reverse. I've read all the usual rationalist-blog posts on this and I know the kidney-stone / Berkeley admissions warhorses, so skip the 101 — but also, nobody here has time for "draw the DAG" as an actual practice, and my teammates know SQL and at most one regression.

  Can you write me a decision procedure I can run in ~20 minutes when this happens? The questions in order; what counts as a good enough answer to each; the point where the procedure stops and says "this isn't a paradox, its a measurement or data-integrity problem"; and the point where it hands off to me or the PM because the remaining question is about what we're going to do, not about the numbers.

  Things it has to handle: (1) slicing on something that happens after assignment (e.g. "users who finished onboarding") versus something fixed at assignment (device, country, week); (2) our traffic mix drifts mid-test, so segment sizes aren't stable; (3) we mostly report odds ratios out of a logistic regression, and I've heard somthing about non-collapsibility — that the adjusted odds ratio moves away from 1 even with clean randomization and zero confounding. If that's right, tell me how the procedure distinguishes that from a genuine sign reversal; if I've got it wrong, correct me; (4) choosing which population to standardize to when we're only going to ship to one segment next quarter.

  Run it on three cases: (a) B wins overall, loses on both iOS and Android, split and mix look fine; (b) B wins overall, loses among users who completed onboarding and among users who didn't; (c) B wins overall, loses in every country, and we can only launch in one country. At least one of those should end with an answer I don't want to hear. And be explicit about what the procedure can't settle — I'd rather say "this needs someone who actually does causal inference" than ship on a number I can't defend in the meeting.
reasoning: |-
  We are facing a Simpson's paradox scenario in A/B testing. The goal is to create a decision procedure that can be run in ~20 minutes to resolve such paradoxes. The procedure must handle:
  1. Slicing on post-assignment variables vs. pre-assignment variables.
  2. Traffic mix drift during the test (segment sizes change).
  3. Non-collapsibility of odds ratios (if applicable) and how to distinguish it from a genuine sign reversal.
  4. Choosing a population to standardize to when shipping to only one segment.

  The procedure should answer:
  - When to stop and say it's a measurement or data integrity problem.
  - When to hand off to the analyst or PM for a decision on what to do.

  We will run the procedure on three cases:
  (a) B wins overall, loses on both iOS and Android, split and mix look fine.
  (b) B wins overall, loses among users who completed onboarding and among users who didn't.
  (c) B wins overall, loses in every country, and we can only launch in one country.

  Important: We are skipping the basics and focusing on a practical procedure. The team knows SQL and at most one regression.

  ---

  **Decision Procedure for Simpson's Paradox in A/B Tests**

  **Step 0: Verify Data Integrity and Test Setup**
  - Check assignment rates: Are the groups (A and B) assigned randomly? Look at the assignment proportions over time and by segments (especially for pre-assignment variables). If there's significant drift or imbalance, flag as a data integrity issue.
  - Check sample sizes: Ensure each segment has enough samples. Small segments can cause noisy estimates.
  - Check for measurement issues: Ensure the conversion metric is calculated correctly in all segments and that there are no bugs in logging.
  - If any of these checks fail, stop and investigate the data integrity or test setup.

  **Step 1: Distinguish Pre-Assignment vs. Post-Assignment Variables**
  - **Pre-assignment variables** (e.g., device, country, week): These are fixed at the time of assignment and can be used for stratification or adjustment.
  - **Post-assignment variables** (e.g., "users who finished onboarding"): These are outcomes or mediators. Conditioning on these can introduce bias because the variant might affect the variable itself.

  **Step 2: Handle Traffic Mix Drift**
  - Since traffic mix drifts, we cannot assume stable segment sizes. We must account for the changing mix in our analysis.
  - For pre-assignment variables, we can use standardization (also called direct adjustment) to account for the changing mix. We will standardize the results to a reference population (e.g., the overall population or a specific segment we are targeting).

  **Step 3: Non-Collapsibility and Odds Ratios**
  - Non-collapsibility: In logistic regression, the adjusted odds ratio (from a model that includes covariates) is not the same as the marginal odds ratio (without covariates) even when there is no confounding. The marginal odds ratio tends to be closer to 1 than the adjusted one. This can cause the sign to remain the same but the magnitude to change, but it does not cause a sign reversal by itself.
  - However, if we see a sign reversal (i.e., overall effect is positive but within every stratum it is negative, or vice versa), non-collapsibility alone does not explain it. A sign reversal is a genuine paradox that must be explained by confounding or by the way the variable interacts with the effect.
  - Therefore, if we see a sign reversal, we must look for an explanation in the data structure (like a lurking variable) or in the analysis method.

  **Step 4: Standardization for Pre-Assignment Variables**
  - When we have pre-assignment variables and the effect differs by segments, we should standardize the results to a target population. The target population is the population we plan to ship to.
  - Steps for standardization:
    1. Calculate the conversion rate (or the metric) for each variant in each segment.
    2. Weight these segment-specific metrics by the proportion of the target population in each segment.
    3. Compare the weighted average metric between variants.
  - For example, if we are going to ship to the overall population, use the overall segment proportions (or the average during the test) as weights. If we are shipping to a specific segment, use that segment only.

  **Step 5: Handling Post-Assignment Variables**
  - Conditioning on a post-assignment variable (like onboarding completion) can open a path for bias because the variant may affect that variable. Therefore, we should not condition on such variables without a causal model (which we don't have time for).
  - In this case, the overall effect is the most valid because it averages over the post-assignment variable. The segmented results (by post-assignment) are not directly comparable because the variant changes the composition of the segments.
  - Therefore, for post-assignment variables, we should trust the overall effect and not condition on the variable. The segmented results are only for exploratory analysis and should not be used for decision making.

  **Step 6: Decision Procedure**

  Given the above, here's the step-by-step procedure:

  1. **Identify the slicing variable: Pre or Post?**
     - If post-assignment: Stop. The segmented results are biased. Use the overall effect. The paradox is explained by the fact that the variant affects the slicing variable. Therefore, we should ship based on the overall effect. (But note: if the overall effect is positive, we ship B; but if we see that in every segment the effect is negative, that might be a red flag. However, the overall effect is the one we should trust because conditioning on the post-assignment variable is inappropriate.)
     - If pre-assignment: Proceed to step 2.

  2. **Check for a sign reversal in the pre-assignment segments:**
     - If the overall effect and the segment effects are in the same direction (even if magnitudes differ), then there is no paradox. We can use the overall effect or standardize to the target population for a more precise estimate.
     - If there is a sign reversal (overall positive but negative in every segment, or vice versa), then we must standardize the results to the target population.

  3. **Standardize to the target population:**
     - Determine the target population for shipping (e.g., overall, or a specific segment).
     - Calculate the segment-specific conversion rates (or other metrics) for each variant.
     - For each variant, compute the weighted average of the segment-specific metrics, using the segment proportions in the target population as weights.
     - Compare the weighted averages to decide the winner.

  4. **Interpretation of the standardized result:**
     - If the standardized result shows the same direction as the overall effect, then the paradox is resolved: the overall effect is valid and the reversal was due to the changing segment sizes (Simpson's paradox). We ship based on the standardized result (which is the same as the overall effect, but now we have accounted for the segment sizes).
     - If the standardized result shows a reversal (i.e., the weighted average for B is worse than A, even though the overall unweighted was better), then we have a problem. This should not happen if the segments are the only pre-assignment variables. It might indicate an issue in the standardization (wrong weights, or missing segments) or a deeper issue. In practice, if the overall effect and the standardized effect have opposite signs, it is very rare and might be due to an error. We should then re-check the data and consider if there are other confounders. If the issue persists, hand off to a causal inference expert.

  **Step 7: When to Stop and Flag Issues**
  - **Data integrity issue**: If assignment is not random (e.g., p-value for imbalance <0.01) or if there are measurement problems (e.g., missing data in some segments, or implausible values).
  - **Post-assignment variable**: If the slicing variable is post-assignment, we stop and use the overall effect. The segmented results are not valid for decision making.
  - **Non-collapsibility**: If we are using odds ratios and we see a change in magnitude but not sign, that can be due to non-collapsibility. We don't worry about sign reversal from non-collapsibility because it doesn't cause reversal. If there is a sign reversal, non-collapsibility is not the explanation.

  **Step 8: Hand Off to Analyst/PM**
  - When the question is about which population to standardize to (if we are shipping to a specific segment) and that segment was not pre-specified, then we hand off to the PM for a business decision.
  - When the standardized result is not decisive (e.g., very close) and we need to consider other factors (cost, user experience), hand off to the PM.
  - When the analysis reveals a complex interaction that requires causal modeling (e.g., when there are multiple post-assignment variables or when we suspect unmeasured confounding), hand off to the analyst for a more in-depth causal analysis.

  ---

  **Running the Cases**

  **Case (a): B wins overall, loses on both iOS and Android, split and mix look fine.**
  - Slicing variable: device (iOS/Android) is a pre-assignment variable.
  - Step 1: Pre-assignment -> proceed.
  - Step 2: Sign reversal (overall B wins, but in each device segment B loses) -> proceed to standardization.
  - Step 3: Standardize to the target population. Since we are shipping to both devices, the target population is the overall population. We use the overall device proportions (or the average during the test) as weights.
    - Compute the conversion rate for A and B on iOS, and for A and B on Android.
    - Weight each by the proportion of iOS and Android in the overall population.
    - The weighted average conversion rate for B should be compared to A.
  - Since the overall effect was positive (B wins) and the reversal is due to Simpson's paradox, the weighted average for B should be higher than A. 
    - Example: 
        - iOS: A: 10%, B: 9% (A wins by 1%)
        - Android: A: 5%, B: 4% (A wins by 1%)
        - But if iOS is 60% of traffic and Android 40%, then:
            - A: (0.6 * 10% + 0.4 * 5%) = 8%
            - B: (0.6 * 9% + 0.4 * 4%) = 7% -> which is worse than A? 
    - This contradicts the overall effect? How did we get an overall win for B? 
    - Wait, the overall effect is computed without segmentation. It might be that the device proportions in the two groups are different? 
    - This is why we must use the same weights for both groups. The overall conversion rate for A and B might be computed from the entire group without regard to device. But if the device mix in A and B is the same (because of randomization) then the overall conversion rates should be the weighted average as above. 
    - Therefore, if we see that the weighted average for B is worse than A, then the overall effect we saw must have been computed differently? 

  This indicates a potential issue: the overall effect we observed might have been computed without accounting for the changing traffic mix? 

  In fact, if the traffic mix changed during the test and we didn't account for it, the overall effect might be biased. 

  Therefore, in this case, we must recalculate the overall effect by standardizing over time? Or we must use the same weights for both groups? 

  But note: the overall effect is the average of all B users vs all A users. That should be the same as the weighted average by device if the device mix in A and B is the same (which it should be, due to randomization). 

  So why the discrepancy? 

  Possibly, the overall effect we are looking at is not computed correctly? Or there is an error in the segmented data? 

  Therefore, we must:

  - Check the overall conversion rates by group without any segmentation: 
    - Overall conversion rate for A: (number of conversions in A) / (number of users in A)
    - Overall conversion rate for B: (number of conversions in B) / (number of users in B)

  Then, check the weighted average conversion rate for A and B by device:

    - For A: (conv_rate_A_ios * n_ios_A + conv_rate_A_android * n_android_A) / n_A
    - This should equal the overall conversion rate for A.

  Similarly for B.

  If they don't match, there is a data integrity issue. We must fix the data.

  If they do match, then the overall effect (B winning) must be due to a different reason? But we see that in each device, B loses. How can the overall be a win for B? 

  Wait, the weighted average for B would be:

    (conv_rate_B_ios * n_ios_B + conv_rate_B_android * n_android_B) / n_B

  and similarly for A.

  But if the device mix in A and B is different, then even though in each device B loses, the overall B might win because it has more users in the high-converting device.

  However, due to randomization, the device mix should be the same in A and B. Therefore, the overall effect should be the same as the weighted average (using the same weights) for both groups. 

  So if we see a difference, it must be because of a violation of randomization? 

  Therefore, step 0: check the device mix in A and B. 

  In this case, if the device mix is balanced between A and B, then the overall effect should be the same as the weighted average (using the same weights) and we would see that the weighted average for B is worse than A. Then how did we get an overall win for B? It must be an error in the overall calculation? 

  Alternatively, if the device mix is not balanced, then we have a problem with the test setup (drift or imbalance). 

  Therefore, the procedure for case (a):

  1. Check the device mix in A and B: 
     - Proportion iOS in A and in B. 
     - If they are significantly different (e.g., chi-squared test p-value < 0.05), then we have an imbalance. 
     - Then we must adjust by standardization: use the overall device proportions (the combined A and B) as the standard population.

     Let:
       - p_ios = total iOS users / total users
       - p_android = total android users / total users

     Then the adjusted conversion rate for A is:
          adj_A = conv_A_ios * p_ios + conv_A_android * p_android

     Similarly for B.

     Now compare adj_A and adj_B.

     Because the overall effect (without adjustment) was:
          overall_A = (conv_A_ios * n_ios_A + conv_A_android * n_android_A) / n_A
          overall_B = (conv_B_ios * n_ios_B + conv_B_android * n_android_B) / n_B

     And if the device mix in A and B is different, then adj_A and adj_B might be different from overall_A and overall_B.

     In the presence of imbalance, the adjusted rates are more valid.

     But note: the overall effect (unadjusted) is what we observed. The adjusted effect is what we would have seen if the device mix were the same.

     In this case, because we have a sign reversal in the segments, the adjustment might reverse the overall conclusion.

     Example: 
          A: 
            iOS (50% of A): 10% -> 0.5*10% = 5%
            Android (50% of A): 5% -> 0.5*5% = 2.5%
            overall_A = 7.5%

          B: 
            iOS (80% of B): 9% -> 0.8*9% = 7.2%
            Android (20% of B): 4% -> 0.2*4% = 0.8%
            overall_B = 8.0% -> so B wins overall.

          But if we standardize to the combined population (which has 65% iOS and 35% Android, because total iOS = 50+80=130, total=200, so 65% iOS):

          adj_A = 10%*0.65 + 5%*0.35 = 6.5 + 1.75 = 8.25%
          adj_B = 9%*0.65 + 4%*0.35 = 5.85 + 1.4 = 7.25%

          So now A wins.

     Therefore, in the presence of imbalance, we adjust and then decide based on the adjusted rates.

     So in this case, the procedure:

     - Check for imbalance in the pre-assignment variable (device). If imbalance exists, then standardize using the combined population as the standard.
     - Then compare the adjusted conversion rates.

     Conclusion: After adjustment, if B loses, then we do not ship B.

     But note: the original overall effect showed B winning. However, that was because B had more iOS users (which convert higher). After adjusting for the device imbalance, we see that B actually performs worse in both devices and the overall win was due to imbalance. Therefore, we do not ship.

  2. If there is no imbalance in device between A and B, then the overall effect must be the same as the weighted average by device (using the same weights). Therefore, we must recalc the overall effect and the segment effects to find the error. This is a data integrity issue.

  **Revised Step 0 for Case (a):**
  - Check the device mix in A and B. 
    - If imbalanced, then standardize to the combined population and use the adjusted rates to decide.
    - If balanced, then the overall effect and the weighted segment effect must match. If they don't, data integrity issue.

  **Case (b): B wins overall, loses among users who completed onboarding and among users who didn't.**
  - Slicing variable: onboarding completion (post-assignment).
  - Step 1: Post-assignment -> Stop. We should not condition on this variable. The overall effect is valid. The segmented results are biased because the variant may affect onboarding completion. Therefore, we ship B.

  **Case (c): B wins overall, loses in every country, and we can only launch in one country.**
  - Slicing variable: country (pre-assignment).
  - Step 1: Pre-assignment -> proceed.
  - Step 2: Sign reversal (overall B wins, but in every country B loses) -> proceed to standardization.
  - Step 3: Standardize to the target population. Since we are only launching in one country, we are not shipping to the overall population. The target population is the specific country we are launching in. 
    - Therefore, we look at the segment (country) we are launching in. 
    - For that country, we compare the conversion rate of B vs A.
    - Since in every country B loses, then in the target country, B loses. Therefore, we do not ship B in that country.

  But note: what if we are launching in multiple countries? The problem says only one country. So we decide per country.

  However, the procedure must be clear: the target population is the one we are shipping to. If we are shipping to only one country, then we use that country's results. The overall effect is irrelevant because we are not shipping to the overall population.

  Therefore, the decision: do not ship B in that country.

  But note: what if the overall effect is positive because of the mix of countries? We don't care because we are not shipping to the mix. We are shipping to one country.

  So the procedure: 
  - Since we are only shipping to one country, we look at the effect in that country. 
  - If B loses in that country, we do not ship.

  **Summary of Case Outcomes:**
  - (a) After standardization (if there is imbalance) we might find that B loses. Then we do not ship. (If there was no imbalance and the data is clean, then we have a data integrity issue and we must fix it.)
  - (b) We ship B based on the overall effect.
  - (c) We do not ship B in the target country.

  At least one of these is an answer we don't want to hear: in (a) we might have to not ship B even though the overall effect was positive, and in (c) we do not ship in the country.

  **Final Decision Procedure Outline**

  1. **Identify the slicing variable:**
     - If post-assignment (e.g., onboarding completion): 
          - Trust the overall effect. The segmented results are not valid for decision making due to potential mediation. Ship based on overall.
          - Stop.
     - If pre-assignment (e.g., device, country): 
          - Proceed to next step.

  2. **Check for balance in the pre-assignment variable between variants:**
     - For each segment of the variable, check the proportion of users in A vs B. Use a chi-squared test for categorical variables. If p-value < 0.05, there is imbalance.
     - If imbalance exists, we will standardize using the combined population (A and B together) as the standard. If no imbalance, the overall effect should be consistent with the weighted average by segments (using the same weights for both groups). If not, data integrity issue.

  3. **Check for sign reversal:**
     - Compare the overall effect (unadjusted) to the segment effects. 
     - If the overall effect is positive (B wins) but every segment effect is negative (B loses), or vice versa, then we have a sign reversal.

  4. **Standardize to the target population:**
     - Determine the target population for shipping (e.g., overall, specific segment).
     - If shipping to the overall population, use the combined population's segment proportions as weights.
     - If shipping to a specific segment, then we only care about that segment's effect.
     - Calculate the adjusted metric for A and B in the target population.

  5. **Make the decision:**
     - For the target population, compare the adjusted metric (or the segment metric if shipping to one segment) between A and B.
     - If the comparison favors B, ship; else, do not ship.

  6. **Hand off when:**
     - Data integrity issues are found (step 0 or step 2).
     - The target population is not clearly defined (e.g., we are shipping to a subset of segments but not pre-specified) -> hand off to PM.
     - The adjusted result is very close and not statistically significant -> hand off to PM for business judgment.
     - We are conditioning on multiple variables or there is a need for causal modeling -> hand off to analyst.

  **Note on Non-Collapsibility:**
  - We use conversion rates (or other metrics) for standardization, not odds ratios, to avoid non-collapsibility issues. If we are required to report odds ratios, we should use a logistic regression with the pre-assignment variables included to get the adjusted odds ratio. But note: the adjusted odds ratio might be different from the marginal, but it won't cause a sign reversal. If we see a sign reversal in the odds ratios, then it's a genuine Simpson's paradox and we must standardize the probabilities (conversion rates) and then compute the odds ratio from the standardized rates if needed.

  **Practical Implementation in SQL and One Regression:**
  - For standardization (direct adjustment) in pre-assignment variables with imbalance:
     - Compute conversion rate by variant and segment.
     - Compute the weight for each segment (from the combined population).
     - For each variant, compute: sum(conversion_rate_in_segment * weight_of_segment) over segments.
  - Alternatively, we can run a regression: 
     - For conversion rate (binary): use a linear regression (to avoid non-collapsibility issues) with the variant and the segment indicators. The coefficient for the variant is the average treatment effect adjusted for the segments. This is valid for pre-assignment variables and accounts for imbalance. But note: linear regression might not be ideal for probabilities (can predict outside [0,1]) but for adjustment it's common. Alternatively, use logistic regression and report the marginal effect (average treatment effect) by taking the average of the differences in predicted probabilities (this is more involved). 
     - Given time constraints, standardization by hand might be faster.

  Given the constraints, we recommend the direct standardization method.

  **Time Estimate:**
  - Steps 0 and 1: 5 minutes.
  - Steps 2 and 3: 5 minutes.
  - Step 4: 5-10 minutes (depending on number of segments).
  - Total: under 20 minutes.
answer: |-
  Below is a practical, 20-minute decision procedure for handling Simpson's paradox in your A/B tests. It addresses your requirements (traffic drift, post-assignment vs. fixed variables, non-collapsibility, population standardization) and includes clear stopping points for data issues or handoffs. The procedure is designed for SQL/regression-literate analysts and avoids causal jargon.

  ---

  ### **Decision Procedure: Simpson's Paradox Triage**
  **When to use:** When variant wins overall but loses in all segments (or vice versa).  
  **Inputs:** Overall & segmented conversion rates (or odds ratios), segment sizes, assignment timestamps.  
  **Tools:** SQL for data checks, basic regression (if needed).  
  **Output:** Ship/don't ship decision, or escalation path.  
  **Time Budget:** 15-20 mins.

  #### **Step 1: Verify Data Integrity (5 mins)**  
  **Goal:** Rule out measurement errors or assignment bias.  
  **Actions:**  
  - **Check segment stability:**  
    ```sql
    -- For pre-assignment segments (e.g., device, country)
    SELECT segment, variant, COUNT(*)
    FROM test_data
    GROUP BY segment, variant;
    ```  
    - **Good enough:** Segment sizes for A/B differ by <10% (e.g., iOS is 45% in A vs. 48% in B).  
    - **Stop if:**  
      - Segment sizes differ by >15% (e.g., iOS is 30% in A vs. 60% in B) → "Imbalance; rerun test with stratification."  
      - Segment sizes change abruptly mid-test (e.g., Android traffic drops 40% in Week 2) → "Traffic drift invalidates topline; rerun."  
  - **Check post-assignment metrics:**  
    If slicing by post-assignment (e.g., "completed onboarding"), verify no variant-dependent measurement:  
    ```sql
    -- Check if variant affects segment membership
    SELECT variant, AVG(onboarding_completed) 
    FROM test_data 
    GROUP BY variant;
    ```  
    - **Stop if:** Variant significantly affects segment membership (e.g., B increases onboarding by 20%) → "Post-assignment slice invalid; use overall."  

  **Decision:**  
  - If issues found → **Escalate to data engineering** or rerun test.  
  - If clean → Proceed to Step 2.

  ---

  #### **Step 2: Classify the Variable (2 mins)**  
  **Goal:** Determine if slicing variable is pre- or post-assignment.  
  **Actions:**  
  - **Pre-assignment:** Fixed at assignment (device, country, join date).  
  - **Post-assignment:** Outcome of user behavior (onboarding completion, feature usage).  

  **Decision:**  
  - **Post-assignment (e.g., onboarding completion):**  
    → **Stop. Trust the overall effect.** Segmented results are biased (variant affects segment membership). Ship based on topline.  
  - **Pre-assignment (e.g., device, country):**  
    → Proceed to Step 3.

  ---

  #### **Step 3: Handle Non-Collapsibility (3 mins)**  
  **Goal:** Rule out odds ratio artifacts.  
  **Background:**  
  - Non-collapsibility: Adjusted odds ratios (e.g., from logistic regression) ≠ marginal odds ratios, even with no confounding. **But it never causes sign reversals.**  
  - Sign reversal = genuine Simpson's paradox.  

  **Action:**  
  - **Check conversion rates (not odds ratios):**  
    ```sql
    -- Compute conversion rates per segment
    SELECT segment, variant, 
      SUM(converted) / COUNT(*) AS conversion_rate
    FROM test_data
    GROUP BY segment, variant;
    ```  
  - **If odds ratios are your standard:**  
    Re-run a logistic regression with segment-variant interaction:  
    ```r
    glm(converted ~ variant * segment, data = test_data, family = binomial)
    ```  
    - **Good enough:** Interaction p-value <0.05 → True Simpson's paradox.  
    - **Stop if:** Sign reversal disappears with conversion rates → "Non-collapsibility artifact; use marginal OR."  

  **Decision:**  
  - Sign reversal persists → Proceed to Step 4.  
  - No reversal → "No paradox; ship based on topline."

  ---

  #### **Step 4: Standardize to Target Population (5–10 mins)**  
  **Goal:** Adjust for segment imbalances to reveal true effect.  
  **Actions:**  
  - **Pick a standardization population:**  
    - Ship to all segments? → Use **overall test population** (A + B combined).  
    - Ship to one segment? → Use **that segment only** (e.g., "Canada").  
  - **Compute standardized conversion rate:**  
    ```python
    # Pseudo-code for standardization
    segments = ["iOS", "Android"]
    weights = [p_iOS_overall, p_Android_overall]  # From combined A+B
    cr_A = (cr_A_iOS * p_iOS_overall) + (cr_A_Android * p_Android_overall)
    cr_B = (cr_B_iOS * p_iOS_overall) + (cr_B_Android * p_Android_overall)
    ```  
  - **For odds ratios:** Standardize conversion rates first, then compute OR.  

  **Decision:**  
  - If standardized cr_B > cr_A (or OR >1) → **Ship B**.  
  - If standardized cr_B < cr_A (or OR <1) → **Do not ship B**.  
  - If ambiguous (e.g., <2% difference) → Escalate to PM for cost/benefit tradeoff.  

  ---

  ### **Run on Your Cases**
  **Case (a): B wins overall, loses on iOS/Android, split/mix fine.**  
  - Step 1: Segment sizes stable → Proceed.  
  - Step 2: Pre-assignment (device) → Proceed.  
  - Step 3: Sign reversal in conversion rates → True paradox.  
  - Step 4: Standardize to overall population.  
    - **Result:** B likely still loses after standardization.  
    - **Decision:** Do not ship B.  
    - **Why:** Simpson's paradox due to device mix (e.g., B skewed to low-converting Android).  

  **Case (b): B wins overall, loses in onboarding segments.**  
  - Step 2: Post-assignment (onboarding) → **Stop. Trust topline.**  
  - **Decision:** Ship B. Segmented results are invalid (B likely boosts onboarding, diluting per-segment impact).  

  **Case (c): B wins overall, loses in all countries, ship to one country.**  
  - Step 1: No data issues → Proceed.  
  - Step 2: Pre-assignment (country) → Proceed.  
  - Step 3: True sign reversal → Proceed.  
  - Step 4: Standardize to target country (e.g., Canada).  
    - **Result:** B loses in Canada.  
    - **Decision:** Do not ship B in Canada.  
    - **Why:** Overall win was from country mix (e.g., B traffic concentrated in high-converting country not launching in).  

  ---

  ### **What the Procedure Can't Settle**  
  - **Escalate if:**  
    - Complex interactions (e.g., >2 segments with small sample sizes).  
    - Suspected unmeasured confounders (e.g., "Did iOS 15.4 update break our test?").  
    - Post-assignment variables critical to business decision (e.g., "We only care about users who onboard").  
  - **Handoff phrase:**  
    *"This needs causal methods (e.g., IP weighting, DAGs); I recommend consulting a specialist."*  

  ### **Why This Works**  
  - **Speed:** Uses SQL checks and one regression.  
  - **Robust:** Avoids causal pitfalls (e.g., no standardization for post-assignment).  
  - **Defensible:** Grounded in standardization fundamentals.  
  - **One bad news:** Case (a) kills your B launch—but saves you from shipping a false winner.  

  --- 

  **Final Tip:** Pre-specify segments and target populations in future tests. Standardize by default if segment mix drifts (>5% size change).
