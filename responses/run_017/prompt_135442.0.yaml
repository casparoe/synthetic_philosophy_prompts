prompt: |-
  I spent forty years in experimental physics, the last decade of it largely on statistical methods for collider data, and since retiring I have been reading my way into the philosophy of probability. I have found that I hold fairly firm verdicts on a scattering of cases, and I would like to know whether any single account of what probability *is* delivers them, and if not, which of them I ought to surrender. I also have a candidate principle of my own, which I set out at the end; I would rather you tested and repaired it than redescribed it to me.

  **The cases.**

  *(i) A machine-tossed coin.* The dynamics are deterministic; the outcome varies so finely with the launch parameters that any region of parameter space large enough for a machine to hit contains heads-regions and tails-regions in very nearly equal measure. My verdict: one-half is the correct probability, it is a fact about the set-up rather than about anyone's beliefs or about the actual long run of tosses, and I want to say this *without* appealing to indeterminism in the fundamental physics. So I do not want chance tied to indeterminism.

  *(ii) A single uranium-238 nucleus.* Given its half-life, I reckon the probability that it decays within the next hour at something of order ten to the minus fourteen. My verdict: this is a real, single-case probability, and it is a fact about that nucleus — not about me, and not, I think, a frequency. There is no long run of *this* nucleus. The long run of nuclei is my evidence for the single-case figure, not what the figure means.

  *(iii) A die with a delayed bias.* Fair for its first million rolls; thereafter an internal mechanism makes six come up very nearly one time in three; it will be rolled a billion times in all, so over its whole career six appears very nearly one time in three. My verdict: on the first roll, the probability of six is one-sixth, and the career-long frequency does not move me. But note what makes me uneasy: had I been told only the career-long frequency and nothing about the mechanism, one-third would have been the reasonable thing to say. My verdict therefore seems to depend on something other than frequencies, and I would like to know what.

  *(iv) The googol-th digit of 0.123456789101112…*, whose digits are known to be normal in base ten, so that each digit occurs with limiting frequency one-tenth. My verdict: there is no *chance* about that digit; it is what it is. I would nevertheless take a bet at odds slightly better than nine to one against its being a seven, and I take that to be the uniquely sensible attitude for someone in my epistemic position — though someone who had actually done the computation would be right to refuse the bet. Note also that if a position is chosen at random from the first *N* places, the frequency story does yield a genuine probability, approaching one-tenth as *N* grows; but that is a probability about the random selection, not about the digit. So here is a case with frequency present, chance absent, and a single-case number I am prepared to act on that I take to be neither a chance nor a matter of taste. I do not know what it is.

  *(v) A five-sigma excess.* When a signal of roughly that significance was reported a dozen years ago, the press office converted it into a chance of a few parts in ten million that the result was a background fluctuation. My verdict: I am entirely comfortable with the probability-of-the-data-given-no-signal statement, and I treat it as at least model-relative fact. I am not comfortable with "the probability that the particle exists is one minus that." But I am equally uncomfortable being told that the latter is merely my personal degree of belief: I think the confidence the community arrived at was rationally required of anyone with that evidence, and I do not see how to make sense of that without a prior I cannot defend as *the* right one. This is a probability attaching to a hypothesis — to a lawlike claim rather than to an event — and I do not know what to do with it.

  *(vi) The unrepeatable case.* The probability that the West Antarctic ice sheet commits to irreversible collapse before 2200 under a stated emissions path; or that a particular fault segment ruptures in the next thirty years. My verdict: I need such numbers, some are better than others, 0.02 and 0.9 cannot both be right, and yet I do not think there is a *chance* of the ice sheet's collapsing — there is no set-up of which this century is one realization, no ensemble of Antarctic ice sheets. At the same time I refuse to say the number is simply what I happen to feel, because then I cannot see what the modellers are arguing about. This case and case (ii) are the pair I most want addressed: both are contingent, future, single-case; in one I hear a real probability in the world, in the other I do not, and I cannot say what the difference consists in.

  *(vii) The settled past.* The probability that it rained in Cambridge on a particular day in 1740, judged from barometric and other records: I would say something like a third. Obviously there is no chance now. Yet I catch myself saying "it probably rained" as though something in 1740 were still open. And a frequency account will offer me the frequency among relevantly similar days — where my answer swings with which features I hold fixed (the season? the barometer reading? the whole synoptic situation?), and that swing troubles me in a way the corresponding swing in my confidence about the coin does not.

  **The case I go back and forth on, which I would like your account to decide rather than me.** A perturbed-parameter ensemble of climate models: under a given scenario, seven-tenths of the runs exceed two degrees of warming by 2100. Here there *is* a repeatable set-up with stable frequencies, but what is repeated is the model, not the century. Is 0.7 a chance? It does not look like one — there is only one earth. But the number is not up for grabs either: if someone reweights the ensemble to taste, I want to say they have got it wrong. My own principle, below, does not clearly settle this, and I do not know whether that is a defect in the principle or in the question.

  **My tentative principle.** A probability claim is a *chance* claim just in case it is anchored: there is a physically specifiable set-up, characterizable without reference to any particular token, whose repeated realizations would be to good approximation independent and identically distributed with a stable limiting frequency — where the stability may come either from indeterministic dynamics or from the outcome's being sensitively but evenly distributed under small perturbations of initial conditions, so that determinism is no obstacle. Where a claim is unanchored, it reports a degree of belief that is nonetheless objectively constrained: it is correct only if it is the number a calibration-minded agent with my total evidence would assign, and numbers outside a certain range are simply wrong, not merely inconvenient. As I understand it, this is roughly a propensity story for the first tier and an objective-Bayesian story for the second.

  A friend in my reading group objects that I have stapled two theories together and inherited both diseases: either my anchoring condition is propensity-talk in disguise, leaving me with the same unanswered question about what fixes the *right* set-up — the reference-class problem reappearing one level up, as in case (iii) — or my "objectively constrained credence" is either empty, because there is no such unique number, or a chance in disguise, which would make case (vi) a case of self-deception rather than of honest ignorance.

  **What I want.** One account, or one precisely stated hybrid, stated tightly enough that I can test it, with the clause of it that each of my cases motivates, and its verdict on the ensemble case and on one further case of your choosing that would separate it from its nearest rivals. Then tell me plainly which of my verdicts it cannot accommodate, and which you would overturn and why — particularly between (ii) and (vi), where I suspect I am holding something inconsistent. Please do not survey the literature for me; I can read that myself, and I would rather have your position than a map of other people's. Commit to one: say what you think probability is, where you think it runs out, and which claim in your account you are least sure of and what would make you abandon it.
reasoning: |-
  Okay, let me unpack this fascinating challenge from a physicist deeply versed in both experimental data and probability philosophy. The user presents seven carefully constructed cases where their intuitions about probability clash with standard interpretations, plus a climate model case they're uncertain about. Their core struggle is reconciling single-case probabilities (like a uranium decay) with non-repeatable events (like ice sheet collapse), while rejecting both pure subjectivism and frequentism.

  Hmm... what stands out immediately is their insistence on objective constraints even where "chance" seems absent. In case (iv) with the normal number digit, they acknowledge acting on 1/10 odds while denying it's "chance" - this feels key. Their proposed "anchored/unanchored" distinction is thoughtful but, as their friend noted, risks being a propensities-Bayes hybrid with both problems. 

  The uranium vs ice sheet contrast (ii vs vi) is the crux: why does one feel like a "world fact" while the other doesn't, despite both being future singular events? I suspect their physics training makes quantum propensities feel ontologically weightier than climate uncertainties. But their own principle undermines this: if anchoring requires a "physically specifiable set-up," then both the uranium nucleus (with its quantum indeterminism) and the machine-tossed coin (with its chaotic determinism) qualify, while ice sheets don't. Yet they reject that determinism blocks chance in case (i), which is consistent but leaves (vi) hanging.

  For the climate ensemble case (vii), their discomfort is revealing. The 0.7 isn't about Earth's unique history but about model behavior under perturbations - it's a mathematical propensity of the model space. This suggests expanding "set-up" to include well-defined theoretical ensembles, not just physical repeatability. That might resolve their tension: the uranium has a physical propensity, the model ensemble has a mathematical one, but the ice sheet lacks any well-defined probabilistic structure.

  Their barometric history case (v) exposes how even "settled" events retain epistemic probability with objective constraints. Here I agree with them - the 1/3 isn't metaphysical but emerges from evidence and calibration norms. The deeper pattern across cases seems to be: probabilities are objective when rooted in either (a) physical symmetries/mechanisms or (b) uniquely rational credences given evidence. The trick is formalizing (b) without collapsing into subjectivism.

  I'll propose a "constraints + calibration" view where probability claims are always claims about rationally constrained uncertainty quantification, with "chance" being a special case when constraints come from physical symmetries. This handles their digit case (iv) as rational credence, distinguishes uranium (physical symmetry) from ice sheets (no symmetry), and makes the climate model probability derive from mathematical rather than physical constraints. For their dice-with-bias case (iii), the early 1/6 probability reflects the actual physical mechanism present during those rolls, not the future or aggregate tendency - again a symmetry argument. Their five-sigma discomfort is spot-on: p-values shouldn't be posterior probabilities without priors, but the community's rational confidence stems from shared calibration standards, not personal belief.

  The hardest nut is their friend's criticism: isn't "rational constraint" just disguised chance? I'd argue no - rational credence is constrained by available symmetries in evidence (as in digit cases or barometer readings), while chance requires symmetries in the physical setup. When physical symmetries exist, they dominate; when absent, evidential symmetries take over. This preserves objectivity without requiring chance everywhere. For the ice sheet, the "0.02 vs 0.9" dispute is about whose model better captures relevant physical/evidential symmetries - it's objectively resolvable in principle by calibration tests, even if not a "chance" fact.

  In the end, I'll suggest they surrender the intuition that ice sheet collapse has no probability - instead, accept it as high-stakes rational credence with physical grounding, distinct from quantum chance but no less objective. Their anchoring principle nearly works if "physically specifiable set-up" includes theoretical ensembles and "objective constraint" admits evidence-based symmetries. The repaired view: probability is unified as symmetry-constrained uncertainty, with chance being its physical instantiation.
answer: |-
  Your cases expose deep fractures in standard interpretations of probability—frequentism, propensity, and subjectivism all stumble over at least one. I’ll present a unified account ("**Constraint-Based Probability**") built from your anchoring insight but refined to avoid stapling problems. I’ll state it crisply, apply it to your cases, flag verdicts to surrender, and resolve the uranium/ice-sheet tension. Finally, I test it against your climate ensemble and a new case.

  ---

  ### **The Account: Constraint-Based Probability**
  1. **Probability is a quantification of *rationally constrained uncertainty*.**  
  2. **Chance** is a subtype: it arises when constraints are *physically necessary symmetries* (deterministic or indeterministic) in a repeatable **setup**. A setup is a physical configuration characterized by parameters that can be reset (e.g., coin launch, uranium nucleus).  
  3. **Non-chance probabilities** are *epistemic* but **objectively constrained**: they are fixed by symmetries in the *evidence space* (e.g., normal number digits, historical records).  
  4. **Constraints are symmetric ignorances**:  
     - **Physical chance**: Ignorance of microstates *mandated* by setup symmetries (e.g., phase-space symmetry for coins; quantum irreducibility for uranium).  
     - **Epistemic probability**: Ignorance *compelled* by evidence symmetries (e.g., digit normality; identical barometer readings).  
  5. **Only one probability is correct** for a given query: the one respecting *all relevant symmetries*. Mismatched constraints yield wrong probabilities (e.g., misidentifying setup in case iii).  

  ---

  ### **Application to Your Cases**
  1. **Machine-tossed coin (i)**:  
     - **Verdict upheld**. Setup: symmetric phase space under parameter reset. *Chance* = 1/2 from physical symmetry (measure uniformity), not indeterminism.  

  2. **Uranium-238 nucleus (ii)**:  
     - **Verdict upheld**. Setup: quantum decay process. *Chance* ≈ 10⁻¹⁴ from physical symmetry (wavefunction evolution). Single-case propensity fixed by quantum irreducibility.  

  3. **Die with delayed bias (iii)**:  
     - **Verdict upheld**. Setup at first roll: symmetric die mechanics. *Chance* = 1/6. Career frequency violates setup symmetry (mechanism changes). If only frequency known, 1/3 is *epistemic* (evidence symmetry), but not chance.  

  4. **Googol-th digit (iv)**:  
     - **Verdict upheld**. *No chance* (no physical setup). But **epistemic probability** = 1/10 from evidence symmetry (base-10 normality). Acting on 1/10 is objectively required; betting after computation violates symmetry (new evidence).  

  5. **Five-sigma excess (v)**:  
     - **p(data|null) upheld**: Model-relative chance (statistical setup symmetry).  
     - **p(H|data) rejected as chance**. It’s **epistemic**: constrained by evidence + prior. Your discomfort is justified—no unique prior exists. But community consensus can be *objectively rational* if priors are calibrated to theoretical symmetries (e.g., naturalness in particle physics).  

  6. **Ice sheet collapse (vi)**:  
     - **Surrender "no probability" verdict**. *No chance* (no resetable physical setup), but **epistemic probability** exists. 0.02 vs. 0.9 are objectively constrained by climate model symmetries (e.g., parameter perturbations, paleoclimate analogs). Modellers argue over which symmetries are relevant.  

  7. **Settled past (vii)**:  
     - **Verdict modified**. "Probability" is **epistemic**: constrained by evidence symmetries (barometer records, seasonal data). "One-third" is objective given fixed evidence. Swing with features held fixed? Resolved by *which symmetries evidence supports* (e.g., holding barometer readings fixed breaks symmetry).  

  ---

  ### **Climate Ensemble Case (Your "Go Back and Forth")**  
  - **0.7 is not chance** (earth has no resetable setup).  
  - **But it’s objectively constrained epistemic probability**:  
    - Symmetry: Perturbed physics/initial conditions in model ensemble.  
    - Reweighting "to taste" breaks evidence symmetry (e.g., ignoring model skill).  
    - **Why not "up for grabs"?** The ensemble defines a *evidence-space symmetry* for rational uncertainty under that model family.  

  ---

  ### **Testing the Account: A New Case**  
  **Case: Schrödinger’s Cat (to separate from rivals)**  
  *A cat is sealed in a box with radioactive atom (50% hourly decay chance), poison, and a hammer. After one hour, what is P(cat alive)?*  

  - **Propensity theory**: 0.5 (irreducible quantum chance).  
  - **Frequentism**: Undefined (single case).  
  - **Subjectivism**: Whatever you believe.  
  - **Constraint-Based View**:  
    - Before opening: *Chance* = 0.5. Setup: quantum decay (physical symmetry).  
    - After opening (unobserved): *Epistemic probability* = 0.5. Evidence symmetry: no information to break quantum uncertainty.  
    - **Key distinction**: Physical chance becomes epistemic constraint upon measurement irrelevance.  

  ---

  ### **Resolving Your Uranium (ii) vs. Ice Sheet (vi) Tension**  
  - **Uranium**: Physical symmetry (quantum indeterminism) → **chance**.  
  - **Ice Sheet**: No physical symmetry → **no chance**.  
  - **But both have objective probabilities**:  
    - Uranium: Chance anchored in physics.  
    - Ice Sheet: Epistemic probability anchored in evidence symmetries (model ensembles, paleoclimate data).  
  - **Why "0.02 vs 0.9 can’t both be right"?** Only one respects *all* evidence symmetries (e.g., if model A fits ice-core data better, P(collapse) is higher).  

  ---

  ### **What to Surrender**  
  1. **Case (vi)**: Reject "no probability" claim. Ice sheet collapse has an *epistemic probability* objectively constrained by evidence.  
  2. **Case (v)**: Reject treating p(H|data) as chance. It’s epistemic—but rationally constrained by theory-laden priors.  
  3. **Your principle’s flaw**: Anchoring to "repeated realizations" is too narrow. **Revised**:  
     - *Chance*: Physical necessity from setup symmetries.  
     - *Epistemic probability*: Rational necessity from evidence symmetries.  
     - Both are objective; both demand calibration.  

  ---

  ### **Weakest Link & How to Break It**  
  - **Least sure claim**: "Evidence symmetries uniquely constrain probabilities."  
  - **What could break it**: If two agents with identical evidence and rationality can justifiably assign different probabilities *without violating any symmetry*.  
  - **Defense**: This never occurs—divergence implies overlooked asymmetries (e.g., in climate case, model weighting). If proven possible, I’d abandon objective epistemic probabilities.  

  This account unifies your verdicts by grounding all probability in *symmetry-constrained ignorance*. Chance is physics-bound; other probabilities are evidence-bound—both objective, neither subjective. The ice sheet finally aligns with the uranium.
