prompt: |-
  Sorry if this is long. I'm on a small behavioural insights team at a public pension agency and we're finally writing an internal ethics guidance note for the stuff we actually ship, and going through it I've realised my own views here are probably less tidy than I keep pretending in meetings. We had a proper fight about it at our offsite last month and nobody convinced anybody. Here's roughly where I've landed:

  (1) Option-preserving is basically the whole moral ballgame: rearranging the choice environment is fine, taking options away (bans, mandates, stiff penalties) is a different category and I want no part of it.
  (2) I'm attached to what I've seen called asymmetric paternalism — an intervention is justified if it helps people who are making an error and leaves the people who aren't making an error no worse off. What I like about it is that it seems to let me do good without ever having to win an argument about whose values or preferences are better than whose.
  (3) But I don't think actual choices are the welfare standard. Revealed preferences are shot through with framing, defaults and inertia, so what people actually pick can't be the thing I'm trying to promote; I want to say the target is something like their informed or "laundered" preferences.
  (4) I reject the transparency condition. If an intervention only works while people aren't noticing it, and would stop working the day it got disclosed, I definately don't count that against it. Where people end up is what matters, not whether they could in principle endorse the mechanism.
  (5) I think targeting is good, not creepy: use a predictive model and give different defaults to different people depending on how likely they are to make the relevant mistake, instead of one blunt default for everyone. Uniform defaults waste the effect on people who'd have been fine anyway and under-help the ones who most need it.
  (6) I also think the nudger's aim matters: the very same intervention is fine when it's aimed at the person's own good and objectionable when it's really serving somebody else's bottom line, even if it happens to help the person too. Our own procurement people keep pushing an auto-enrolment tweak that would genuinely help staff and also cut our admin costs, and I cant get myself to be neutral about that.
  (7) Auto-escalation, where your contribution rate creeps up every year unless you actively opt down, is the best tool we have and I'd defend it to anyone.
  (8) But I also want to say that interventions which work by farming people's inattention or procrastination are manipulative and not OK; the legitimate ones remove real obstacles like hassle costs and confusing forms, they don't just sit on people's inertia.
  (9) And here's what started the fight: we've begun running what we call "re-setters" internally — instead of a default that fires once and then sticks, the default re-applies every year, so if you opted out last year you get put back in unless you actively opt out again. I think these are better than sticky defaults, because everyone gets a fresh chance each year to act on what they actually want, and the group still enrolled at the end is closer to the group that genuinely wants to be in.

  Can someone audit this for me? I'd like the tensions ranked by severity rather than a list where everything is flagged as equally bad, and for each real one I want to know exactly what would have to give and what it would cost me to give it. Please also tell me which pairs only look like they're in tension — I have a feeling at least one of these is actually fine and I'm just hearing it as contradictory because of how I've worded it, but I can't tell which. And if there's one revision that would clean up the most, say what it is. Be concrete about the re-setters specifically: I need to know whether (9) survives (1)–(8) or whether I have to pick.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're part of a behavioral insights team at a public pension agency, working on an internal ethics guidance note. The user has outlined their personal ethical framework for behavioral interventions, which includes nine points. They need an audit of these points to identify tensions, rank their severity, and see how they hold together, especially regarding their "re-setters" intervention.

  First, I need to parse each of their nine principles. Let me list them out:

  1. Option-preserving is key; no bans or mandates.
  2. Asymmetric paternalism: help those making errors without harming others.
  3. Actual choices aren't the welfare standard; target informed preferences.
  4. Reject transparency; outcomes matter more than mechanism endorsement.
  5. Targeting is good; use predictive models for tailored defaults.
  6. The nudger's intent matters: must be for the individual's good.
  7. Auto-escalation is defensible.
  8. Interventions shouldn't exploit inattention; should remove obstacles.
  9. Re-setters (recurring defaults) are better than sticky defaults.

  The user mentioned a fight at their offsite, so there's internal disagreement. They want to know if their principles are coherent, especially whether re-setters (point 9) conflict with others. They also want tensions ranked by severity and concrete advice on revisions.

  Looking at the principles, the biggest red flags are between points 4 and 8. Point 4 says transparency isn't necessary, even if the intervention only works when hidden. But point 8 criticizes exploiting inattention or procrastination. That's a direct conflict because re-setters might rely on people not noticing the reset each year, which could be seen as exploiting inattention.

  Then, point 9 (re-setters) vs. point 1 (option-preserving). Re-setters repeatedly re-enroll people who opted out, which might feel like taking away the permanence of their choice. Even though they can opt out again, the repeated default could be seen as undermining their initial decision, especially if they're inattentive.

  Point 3 (informed preferences) vs. point 4 (transparency rejection). If transparency is rejected, how can we ensure preferences are informed? If people don't know about the reset, their choice isn't based on full information, contradicting the goal of informed preferences.

  The user's intent (point 6) seems solid, but the re-setters might be seen as serving the agency's admin efficiency, which they mentioned in point 6 as problematic. Even if it helps employees, the dual benefit might taint the intervention's legitimacy in their framework.

  Targeting (point 5) and re-setters could work together if they target those more likely to procrastinate. But without transparency, it might feel manipulative.

  The user needs to reconcile these. The core tension is between respecting agency and achieving outcomes. They value outcomes (points 3,4) but also want to avoid manipulation (point 8). Re-setters might need transparency to align with point 8. Maybe they can disclose the reset clearly, allowing it to work without stealth. Also, ensuring re-setters don't feel coercive by making opt-out easy.

  For revisions, emphasizing "easy and salient opt-out" could resolve the tension with option-preserving. Making transparency a requirement would align points 4 and 8, but that's a big shift. Alternatively, reframing exploitation vs. obstacle-removal: if re-setters reduce hassle (e.g., auto-renewals like subscriptions), they might fit point 8.

  The user's identity in a public pension agency means they have a duty to both employees and the organization. Their struggle with procurement's auto-enrolment tweak shows they're wary of conflicts of interest. Re-setters must be justified as primarily benefiting employees, not cutting costs.

  In conclusion, the most severe tensions are between transparency and anti-exploitation, and re-setters vs. option-preserving. To keep re-setters, they need robust opt-out mechanisms and possibly transparency. Compromising on stealth might be necessary, aligning outcomes with process.
answer: |-
  Here's an audit of your ethical framework, ranking tensions by severity and providing concrete analysis for the "re-setters" intervention. The most critical conflicts stem from rejecting transparency while condemning exploitation of inattention.

  ### Tensions Ranked by Severity

  1.  **SEVERE TENSION: (4) Reject Transparency vs. (8) Anti-Exploitation of Inattention/Procrastination**
      *   **Conflict:** (4) explicitly endorses interventions that *only work when hidden* (stealth nudges). (8) condemns interventions that "farm" inattention/procrastination. Stealth nudges fundamentally rely on and exploit inattention – if the person noticed, it wouldn't work. These principles are directly contradictory.
      *   **What Must Give:** You must choose one core stance.
          *   **Option A: Abandon (4)** (Reject Transparency). Embrace transparency as a requirement. Accept that some effective interventions (like pure stealth nudges) are off-limits because they are manipulative under your (8). *Cost:* You lose a potentially powerful tool (stealth), and some interventions might become less effective if disclosed.
          *   **Option B: Revise (8)** (Anti-Exploitation). Refine your definition of "farming" inattention. Perhaps distinguish *exploiting* inattention (manipulative) from *relying* on predictable cognitive patterns *to overcome barriers* (potentially acceptable, even without transparency). This requires a clear, defensible line. *Cost:* Risk of self-deception or appearing hypocritical; harder to condemn commercial dark patterns that also "help" (e.g., auto-renewals saving hassle).
      *   **Impact on Re-setters:** This is CRITICAL for re-setters. If re-setters work primarily because people *don't notice the annual reset* and their inattention leads to being re-enrolled, they fall squarely into the stealth/exploitation category condemned by (8). To keep re-setters under (8), they *must* be designed and implemented with high salience and clear communication about the reset mechanism.

  2.  **SIGNIFICANT TENSION: (9) Re-setters vs. (1) Option-Preserving & (3) Informed Preferences**
      *   **Conflict:** While re-setters technically preserve the *option* to opt-out annually, they actively *undo a previous explicit choice* (the prior year's opt-out). This feels coercive to some and arguably disrespects the initial choice, potentially violating the spirit of (1). It also challenges (3): Is the choice made under an annual reset *more* "informed" or "laundered" than the initial choice? Or does the repeated imposition create decision fatigue or resignation ("I give up") rather than reflection?
      *   **What Must Give:** Refinement of definitions and implementation.
          *   **Refine (1):** Emphasize "meaningful and accessible" options over mere existence. Ensure the annual opt-out is *extremely easy and salient*.
          *   **Refine (9) Implementation:** Make the reset process *highly transparent and salient*. Frame it not as an undo, but as a *deliberate, periodic re-confirmation opportunity*. Provide context: "Last year you opted out. The default is enrolment again this year because [brief benefit reminder]. Do you wish to opt out again?" *Cost:* Increased friction/complexity; potentially lower effectiveness if salience makes opting out easier. Risk that some see it as nagging.
      *   **Can They Coexist?** Yes, **if** the re-setter is implemented with robust transparency, ease of opt-out, and clear framing as a fresh choice opportunity. It edges closer to a recurring active choice prompt than a pure stealth default.

  3.  **MODERATE TENSION: (3) Informed Preferences (Target) vs. (4) Reject Transparency**
      *   **Conflict:** How can you promote "informed" or "laundered" preferences (3) while rejecting the idea that people need to be aware of *how* the choice architecture is influencing them (4)? True informed preferences arguably require understanding the influencing mechanisms.
      *   **What Must Give:** Nuance in defining "informed."
          *   **Clarify (3):** Specify that "informed" primarily relates to *understanding the consequences of the choice itself* (e.g., pension benefits, risks of non-enrolment), not necessarily the behavioral mechanism nudging them. *Cost:* Accepts a slightly less robust view of autonomy; harder to justify if the *mechanism* itself feels manipulative (linking back to Tension #1).
      *   **Can They Coexist?** Yes, **if** "informed" is focused on the *choice outcome*, not the *nudge mechanics*. Transparency about the *options and consequences* is still required, even if transparency about the *nudge design* isn't.

  4.  **MODERATE TENSION: (6) Nudger's Aim Matters vs. Efficient Targeting (5) & Re-setters (9)**
      *   **Conflict:** Your procurement example shows unease with dual motives. Re-setters (9) and predictive targeting (5) *could* be seen as serving the pension agency's interests (higher enrolment rates, lower admin costs on churn, potentially better fund health) *alongside* member welfare. Does this taint them under (6)?
      *   **What Must Give:** A clear stance on alignment.
          *   **Refine (6):** State that an intervention is acceptable *if the primary intent and dominant effect* are the individual's good, even if secondary benefits exist for the institution. Requires rigorous evaluation. *Cost:* Requires careful monitoring and justification to avoid mission creep; harder to apply definitively.
      *   **Can They Coexist?** Yes, **if** you can robustly demonstrate that re-setters and targeted defaults are *primarily* for the member's benefit (increasing retirement savings for those who need/want it) and the institutional benefits are secondary and not the driving force.

  5.  **MINOR TENSION / PERCEIVED CONFLICT: (8) Anti-Exploitation vs. (7) Auto-Escalation**
      *   **Conflict:** Doesn't auto-escalation (7) exploit inertia/procrastination? People stay on the escalator because they don't act.
      *   **Resolution:** This is **not a fundamental tension**. Key difference:
          *   **Auto-escalation (7):** Primarily overcomes *hassle* and *projection bias* (underestimating future self's ability to save more). The *decision point* (when hired or enrolled) is salient. The escalation itself is predictable and disclosed. It removes the obstacle of repeated active decisions.
          *   **Exploitation (8):** Involves mechanisms designed *specifically* to hijack inattention, confusion, or fleeting impulses, *without* removing a meaningful obstacle, often obscuring the influence. Auto-escalation aims to align actions with long-term intentions set at a clearer moment.

  ### Analysis of Re-setters within (1)-(8)

  *   **Survival is Contingent:** Re-setters **can** survive your principles (1)-(8), **but only with significant caveats:**
      1.  **Mitigate Tension #1 (Severe):** Re-setters **must avoid relying on stealth.** The annual reset mechanism *must* be highly salient and clearly communicated *in advance and at the point of reset*. Opt-out must be *extremely easy* (e.g., one-click, pre-filled form). This moves it away from exploiting inattention and towards overcoming hassle/forgetfulness (aligning with (8)). If it only works when hidden, it violates (8).
      2.  **Mitigate Tension #2 (Significant):** Frame the reset explicitly as a *new decision opportunity*, not an undo. Provide context ("You opted out last year. Would you like to review this decision for this year?"). Ensure the choice environment genuinely facilitates a considered decision (not buried in fine print). This strengthens alignment with (1) & (3).
      3.  **Align with (6):** Ensure the *primary justification* for re-setters is member welfare (capturing changed circumstances, overcoming past inertia with a fresh prompt), not administrative convenience or boosting enrolment metrics. Document this.
      4.  **Align with (5):** Re-setters could be *combined* with targeting. Maybe only apply them to segments predicted to be prone to procrastination or where initial opt-out was likely impulsive? (Requires careful ethical review of segmentation criteria).
      5.  **Align with (2) & (7):** Re-setters fit asymmetric paternalism – they help procrastinators/inattentive people get back in, while those actively wanting out can easily opt out again. They share a philosophy with auto-escalation: overcoming inertia to help people act on presumed long-term goals.

  **Concrete Verdict on Re-setters:** They are **ethically permissible under your framework IF AND ONLY IF** implemented with **robust transparency, high salience, effortless opt-out, and framing as a deliberate renewal opportunity.** If implemented stealthily or opaquely, they violate core principles (4 vs 8, and potentially 1 & 3). The procurement auto-enrolment tweak might be acceptable under (6) if *both* effects are genuine and member benefit is demonstrably primary.

  ### The Single Most Cleansing Revision

  **Revise Principle (8) to incorporate a distinction between *exploiting* vs. *overcoming* inertia:**

  *   **Original (8):** "...interventions which work by farming people's inattention or procrastination are manipulative and not OK; the legitimate ones remove real obstacles..."
  *   **Proposed Revision (8):** "Interventions that *exploit* inattention, impulsivity, or confusion in ways that bypass or undermine reflection are manipulative and not OK. Legitimate interventions remove real obstacles (like hassle costs or complexity) or structure choices to facilitate decisions aligned with considered preferences, even if they leverage predictable cognitive patterns like inertia *when combined with transparency and ease of exit*."

  **Why this helps:**
  *   Directly addresses the core contradiction with (4) by linking acceptability to transparency/ease-of-exit.
  *   Provides a clearer lens to distinguish acceptable tools like auto-escalation (7) and *transparent* re-setters (9) from dark patterns.
  *   Better integrates the insights of (3) (targeting considered preferences).
  *   Makes the framework more internally coherent without abandoning the valuable caution against manipulation.
  *   *Cost:* Requires more nuanced judgment calls; slightly weaker condemnation of some commercial practices that use "ease" as cover.

  Your framework is thoughtful but the rejection of transparency (4) while condemning exploitation of inattention (8) is the fundamental crack. Addressing that, primarily through revising (8) and ensuring re-setters are transparent and easy to escape, is crucial for coherence. Re-setters can be a powerful ethical tool *if* implemented as a salient renewal opportunity, not a stealthy undo.
