answer: |-
  Here’s a structured 50-minute teaching plan designed to rebuild intuitions, emphasizing the *formal structure* of the impossibility result and its scope. The goal is to shift focus from "fairness is impossible" to "these criteria impose conflicting distributional requirements."

  **Brainstorming Core Goals (By Minute 50):**  
  Students should be able to:  
  1. **Recognize** that each fairness criterion implies a *specific mathematical relationship* between group prevalence rates, score distributions, and error rates.  
  2. **Trace** how a violation of one criterion (given fixed base rates) forces a trade-off between the others using concrete probabilities.  
  3. **Identify** the critical assumption of a *fixed joint distribution & single decision rule* limiting the theorem's scope.

  ---

  **1. Sequence & Dependencies (Strict Order is Crucial):**  
  *(Total: ~40 mins)*  
  - **Min 0-3: Foundation on the Board:**  
    *"Decision Rule: Score S (continuous/probability) → Threshold T → Binary Decision D (Y/N).  
    Protected Group: A, B.  
    Ground Truth Outcome: Y (e.g., 1=Positive, 0=Negative)."*  
    **Why:** Must establish the *joint distribution* `P(Y, S | Group)` before criteria make sense. Everything depends on this.  

  - **Min 3-10: Define Criteria Visually (Using Probabilities):**  
    Write *only* the probability statements (not names yet!):  
    **(C1)** `P(Y=1 | S=s, Group=A) = P(Y=1 | S=s, Group=B)` for scores `s`  
    **(C2)** `P(S>=T | Y=0, Group=A) = P(S>=T | Y=0, Group=B)` [FPR] & `P(S>=T | Y=1, Group=A) = P(S>=T | Y=1, Group=B)` [FNR]  
    **(C3)** `P(Y=1 | S>=T, Group=A) = P(Y=1 | S>=T, Group=B)` [PPV]  
    **Depends on:** Joint distribution foundation. **Why:** Forces seeing them as *constraints on the joint distribution*, not just labels.  

  - **Min 10-25: **The Central Case Study: Academic Grading Admission****  
    *"University program: Group A (60% truly qualified), Group B (40% truly qualified). Model predicts qualification. Threshold T set for admission."*  
    **Must Contain:**  
    - Clear, unequal base rates (`P(Y=1 | A) = 0.6`, `P(Y=1 | B) = 0.4`).  
    - A simple score distribution (e.g., for A: 70% score high, 30% low; for B: 50% high, 50% low) allowing calculation of FPR/FNR/PPV.  
    - **Concrete numbers** showing satisfaction of **two criteria forces violation of the third** (e.g., satisfy Calibration & EO → PPV unequal).  
    **Must Avoid:**  
    - Moral/political loading (lending/risk assessments trigger this).  
    - Perfect predictors or equal base rates.  
    - Complex distributions.  
    **Why Not Lending/Risk?** They pre-load normative debates ("*should* base rates differ?"), obscuring the *mathematical inevitability* under *given* conditions. Grading focuses on descriptive distributions.  

  - **Min 25-35: Demonstrate Impossibility Mechanically:**  
    Using the case study numbers, **calculate** what happens when forcing two criteria.  
    *"Assume Calibration (C1) and Equalized Odds (C2) hold for our A/B groups. Calculate PPV (C3) for A and B. See the divergence? Now try forcing Calibration (C1) and PPV (C3) – what breaks? Equalized Odds (C2)."*  
    **Depends on:** Defined criteria & case study distributions. **Why:** Forces active engagement with the constraints.  

  - **Min 35-40: Introduce Scope Caveats ("Fixed Distribution, Single Rule"):**  
    *"This result assumes: (1) One threshold T, (2) Decisions don't change future Y, (3) Auditing on the same distribution used to build the rule. What if...?"*  
    - **Human Review Variation:** "System outputs 'Review Needed' for uncertain scores (no direct Y/N)."  
      *Carries Over:* Criteria still constrain the *probabilistic mapping* (S to Y).  
      *Breaks:* The theorem assumes *binary decisions* directly impacting Y; auditing now focuses on the *routing rule* and *human decisions*.  
    - **Feedback Loops:** "Loan denials cause economic harm, lowering future qualification rates."  
      *Carries Over:* Criteria definitions remain, but the distribution `P(Y, S | Group)` *changes over time*.  
      *Breaks:* The *fixed distribution* assumption. The impossibility holds per-snapshot, but long-term dynamics are different.  

  **2. Addressing Misconceptions (Timing & Approach):**  
  1.  **"Fairness is mathematically impossible, so it's just politics."**  
      **When:** After demonstrating impossibility in the case study (Min 30).  
      **Defuse:** "The impossibility shows *these specific criteria conflict* under *these conditions*. It doesn't say 'fairness is impossible' – it says *these definitions impose incompatible requirements*. We must choose which requirements matter most for a context."  

  2.  **"Dropping group membership dissolves the conflict."**  
      **When:** When defining criteria (Min 5-10).  
      **Defuse:** "The criteria constrain *outcomes by group*. If group correlates with features used, the score S itself becomes a proxy, and the joint distribution `P(Y, S | Group)` still exists. The conflict arises from the *real-world distributions*, not the model's inputs."  

  3.  **"This is just an accuracy-vs-fairness trade-off."**  
      **When:** After demonstrating impossibility (Min 35).  
      **Defuse:** "Notice: We assumed a *fixed predictor quality* (score distributions). The conflict is between different *fairness goals themselves*, even holding accuracy constant."  

  4.  **"We can satisfy all three with a better model/perfect prediction."**  
      **When:** Before defining criteria OR when introducing base rates in the case study (Min 3 or Min 15).  
      **Defuse:** "Agreed! If base rates are equal OR the predictor is perfect (no errors), all criteria align. The impossibility *specifically* applies when these don't hold. Our case study has unequal base rates and an imperfect predictor – the realistic case."

  **3. Key Takeaway Placement (Min 40-42):**  
  Place this IMMEDIATELY after introducing scope caveats:  
  *"The impossibility theorem is a powerful formal result about constraints on a single decision rule applied to a fixed snapshot of the world. Its core lesson isn't 'fairness is impossible' but 'these fairness definitions make conflicting demands on the underlying data distribution'. When we change the system design (human review) or consider dynamics (feedback), the *nature* of the conflict or the *possibility* of satisfying goals may change, but the fundamental tension between different parity metrics remains relevant."*

  **4. Closing Question & Boundaries:**  
  - **Closing Question (Min 48, on board):**  
    *"In a scenario where Group A has a significantly higher prevalence of Y=1 than Group B, and we have an imperfect predictor, if we insist on Equalized Odds (C2), which criterion – Calibration (C1) or Predictive Parity (C3) – are we mathematically forced to sacrifice? Why?"*  
    **Why:** Tests understanding of the *direction* of the conflict driven by base rates, not just label recall.  

  - **Decline to Discuss (State Clearly):**  
    1.  **"Causal interpretations of fairness."** ("We're describing statistical associations in a snapshot, not causes.")  
    2.  **"Optimization techniques for trade-offs."** ("Today is about *why* trade-offs exist fundamentally; next steps are *how* we navigate them.")  

  **Execution Tips:**  
  *   **Board is King:** Keep the joint distribution, criteria formulas, and case study numbers visible throughout.  
  *   **Calculations:** Make them do *one* simple calculation (e.g., PPV for A vs B under C1&C2) live.  
  *   **Language:** Use "constraint", "mathematical requirement", "distributional implication", "conflict between criteria". Avoid "fairness is" statements.  
  *   **Pacing:** Ruthlessly enforce timings; the case study demo and scope caveats are the heart.  

  This plan forces confrontation with the *mathematical structure* of the conflict, demystifies the impossibility as a property of specific definitions under specific conditions, and explicitly limits its scope, setting the stage for more nuanced policy/technical discussions later. Good luck!
