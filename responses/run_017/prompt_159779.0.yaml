prompt: |-
  I am revising a chapter of my dissertation on the varieties of free will worth wanting, and before I commit to the argument I have been developing, I would like to know whether compatibilists have a reply to it that does not simply amount to changing the subject.

  The chapter tries to make "worth wanting" tractable without tying it to any single one of our practices. Let the modal spread of a decision at t be the proportion of the nearest possible worlds — those whose total prior state differs from the actual one only minimally — in which the agent decides otherwise. My proposal is that the free will worth wanting is, at bottom, non-trivial modal spread combined with sensitivity to reasons, and hence that spread behaves like a scalar: the more of it an agent's decision involves, other things being equal, the freer she is.

  If that is right, the case against compatibilism looks short. On any reasons-responsive compatibilist model, the agent's deliberative process issues in one determinate decision given the whole prior state of the world, so her spread is nil, and her deliberation therefore makes no difference to what she does — it merely redescribes an outcome that was already fixed. Compatibilists would then be in the position of securing only the deliberative variety of free will while conceding the variety that does the real work in grounding desert, which is the one I care about.

  I have a refinement for the standard objection. Mere neural noise raises spread but delivers nothing anyone wants, so I stipulate that the spread must be generated inside the agent's own reason-forming mechanism rather than in its peripheral implementation: the alternatives must open up because she is weighing considerations, not because her motor system is jittery.

  My question is whether that refinement makes the argument sound, and in particular whether the monotonic step holds: if I locate indeterminacy properly, inside reason-formation, do I thereby get strictly more of the variety that grounds desert than any compatibilist model delivers — more spread, more freedom, more desert — or does adding agential indeterminacy fail to increase that quantity, or even diminish it? I set aside exotic cases in which deterministic chaos lets arbitrarily small differences amplify into different decisions, since spread of that kind is not agential in the relevant sense.
reasoning: |-
  Okay, the user is working on a dissertation chapter about what makes free will "worth wanting." They've introduced this concept of "modal spread" - basically, how many nearby possible worlds have the agent making a different decision. Their argument is that real free worth wanting requires both reasons-sensitivity and significant modal spread (non-trivial chance of doing otherwise in similar circumstances). 

  They think this sinks compatibilism because compatibilist models (where decisions are determined by prior states) would always have zero modal spread. The agent couldn't have done otherwise in those nearby worlds. The user has refined this by specifying the indeterminism must be in the reason-forming process itself, not just neural noise.

  Hmm... I see several angles here. First, the user might be underestimating compatibilist resources. Frankfurt-style cases come to mind immediately - where an agent does X for their own reasons, but couldn't have done otherwise due to some counterfactual intervener. Yet we'd still say they acted freely. This suggests the "could have done otherwise" requirement isn't as central as the user thinks.

  The user seems really invested in connecting modal spread to desert (moral responsibility). But Fischer's semi-compatibilism makes a strong case that reasons-responsiveness alone can ground desert without any alternative possibilities. If the user hasn't engaged deeply with Fischer, that might be a gap.

  Also, their refinement about locating indeterminacy "inside reason-formation" feels unstable. How do you draw that boundary? And why would adding randomness to reasoning enhance responsibility rather than undermine it? Kane's work on efforts of will comes to mind, but even that has well-known luck problems.

  The user's tone suggests they've thought hard about this and want a substantive challenge, not just "you're changing the subject" dismissals. They're clearly aiming for an original contribution. I should acknowledge the sophistication of their model while pressing on the philosophical tensions.

  Biggest worry: even if we grant their model, it's not clear why more modal spread equals more desert. That seems like an undefended premise. And compatibilists could argue their agents actually have richer reasons-sensitivity since deterministic deliberation allows for tighter connection between reasons and actions.

  The chaos theory exclusion is smart, but makes me wonder if their "agential indeterminacy" is just as problematic - how is indeterminism within reasoning any less of an external influence from the agent's perspective?
answer: |-
  Your argument is sophisticated and engages deeply with compatibilism's core challenges, but compatibilists have substantive replies that don't merely "change the subject." Let's address your refinement and the monotonic claim step-by-step:

  ### 1. **The Core Compatibilist Reply: Reasons-Responsiveness Without Indeterminacy**
     - **Reasons-sensitivity suffices for desert**: Compatibilists like Fischer & Ravizza (*Responsibility and Control*) argue that the *actual-sequence* properties of deliberation—how the agent responds to reasons in the actual world—ground desert, not alternative possibilities. If an agent's decision *actually* results from a reasons-responsive mechanism (even if deterministically), they deserve praise/blame. Your "nil spread" is irrelevant because responsibility isn't contingent on metaphysical access to alternatives.
     - **Indeterminacy undermines control**: They contend that inserting indeterminacy *into* reason-formation (e.g., during weighing) introduces luck, *diminishing* desert. If two worlds are identical prior to \( t \), and the agent decides differently due to indeterminacy, the difference isn't attributable to *her*—it's a random fluctuation. This is the "Mind Argument": indeterminacy severs the link between reasons and outcome.

  ### 2. **Your Refinement: Indeterminacy "Inside" Reason-Formation**
     - **Why it doesn't save the argument**: Locating indeterminacy within reason-formation doesn't automatically make it *agential*. Compatibilists argue that for a decision to be "hers," it must be deterministically caused *by her character/values/reasons*—not perturbed by undetermined events, even if intra-psychological.  
     - **Counterexample (Kane-style)**: Suppose Alice weighs moral/prudential reasons, and indeterminacy causes her to "tip" toward morality in 60% of near worlds. In worlds where she tips prudentially, *she didn’t choose* for the indeterminacy to resolve that way—so why is she responsible for that outcome? The indeterminacy still functions as noise, even if cognitively integrated.

  ### 3. **Does Modal Spread Increase Desert? The Monotonicity Challenge**
     Compatibilists reject monotonicity: more spread ≠ more desert. Key points:
     - **Desert requires ownership, not alternatives**: For Fischer, what matters is whether the agent *actually* guided the action via reasons (e.g., acting on a mechanism that would have responded to different reasons). Deterministic agents can have this; indeterministic agents may lack it if outcomes aren't sufficiently controlled.
     - **Spread can dilute responsibility**: If high modal spread means an agent's decisions are highly sensitive to minor fluctuations (e.g., 40% chance of donating to charity based on identical reasons), their commitment appears weak. Desert often seems *stronger* when an agent *reliably* acts rightly despite pressure (suggesting low spread).

  ### 4. **Compatibilist Models of "Difference-Making"**
     - **Deliberation as causal mediation**: Even deterministically, deliberation *does* make a difference: in worlds where the agent has different reasons, she decides differently. What matters is that reasons *counterfactually* affect outcomes—not that prior states plus identical reasons could yield different outcomes.
     - **Hierarchical/structural control**: Frankfurt or Watson might argue that free will requires aligning decisions with higher-order volitions. If this alignment occurs deterministically, the agent is "active," and desert is secured—without needing modal spread.

  ### 5. **A Direct Counter: The Zygote Argument (Pereboom)**
     Imagine a deterministic world where an agent (Melinda) is reasons-responsive, has non-trivial *counterfactual* spread (she'd choose differently *if* reasons changed), but nil *same-prior-state* spread. She commits a crime after careful deliberation.  
     - **Pereboom's view**: We *would* hold Melinda responsible—because her action expresses her reasons-responsive character.  
     - **Your model**: Her spread is nil, so she lacks desert-grounding freedom.  
     - **Compatibilist reply**: This shows your intuition about desert conflicts with practice. We *do* blame determined-but-deliberative agents (e.g., calculating criminals).

  ### Conclusion
  Your refinement doesn't make the argument sound against compatibilism. By locating indeterminacy intra-rationally, you avoid trivializing spread (e.g., via neural noise), but you haven't shown that:
  - Indeterminacy adds agential control rather than undermining it (via luck).
  - Desert *requires* same-prior-state modal spread (as opposed to reasons-responsiveness in the actual sequence).
  - Increased spread monotonically increases desert (it may do the opposite).

  **Most damningly**: Compatibilists argue that introducing indeterminacy *at all*—even in reason-formation—makes outcomes partially random, *diminishing* the agent's responsibility compared to a deterministic reasons-responsive process. Your monotonic claim fails because they see agential indeterminacy as *subtracting* from desert, not adding to it.

  **Suggested engagement**: Grapple with Fischer's actual-sequence semi-compatibilism and Pereboom's hard incompatibilist critique (which agrees that *neither* determinism nor indeterminacy secures desert). This forces you to defend why desert *must* require same-prior-state alternatives.
