prompt: |-
  I teach a first-year graduate seminar and I am writing a taxonomy handout on Nozick's utility-monster example. Every version of this I can find simply lines up five theories side by side; I want a tree built from the logical space instead, and I want it to separate, for my students, objections to aggregation as such from objections to the concentration of a claim in a single being.

  Structure it as a decision tree with one branching question per node and eight to twelve leaves. Each node should be phrased as a claim or a case a student could answer without already knowing which position it leads to; no node may ask them which theorist they side with. Start from a commitment nearly everyone in the room already accepts, not from the definition of utilitarianism.

  The work should be done by cases rather than labels. Use at least these: the standard monster whose gains dwarf everyone else's losses; the reluctant monster, who has the monster's utility function, hates having it, and wants to be cured of it at a large net cost to aggregate utility; the reverse monster, whose capacity for suffering is out of all proportion to anyone's capacity for enjoyment; the swarm, in which no individual claim dominates but ten million slightly more efficient converters collectively do; and the archival monster, a merely possible being we could bring into existence or decline to.

  Leaves that must appear: total utilitarianism biting the bullet; prioritarianism; negative or suffering-focused views; average utilitarianism; sufficientarian and lexical-threshold views; Nozickian side-constraints; Harsanyi-style aggregation, on which a social welfare function meeting the expected-utility and Pareto-indifference conditions must be a weighted sum of individual utilities; rule-consequentialist self-effacement; and the empirical dismissal, on which no such psychology is nomologically possible.

  Close by marking the combinations your branching questions permit but that nobody occupies, with a one-line diagnosis of each — incoherent, unattractive, or merely unclaimed — and by flagging any pair of leaves the tree cannot actually separate, together with the further case that would separate them if one could be constructed.

  Lead with a single sentence naming the branching question that does the most diagnostic work, then give the tree: no preface, and no restatement of what I asked for.
reasoning: |-
  Hmm, the user is teaching a first-year graduate seminar and needs a taxonomy handout on Nozick's utility monster. They want a decision tree based on logical space rather than just listing theories side by side. The key is to separate objections to aggregation itself from objections to concentrated claims in single beings.

  The user specified several cases to include: standard monster, reluctant monster (who hates their utility function), reverse monster (extreme suffering capacity), swarm (many slightly efficient converters), and archival monster (merely possible being). The leaves must cover total utilitarianism, prioritarianism, negative utilitarianism, average utilitarianism, sufficientarianism, Nozickian constraints, Harsanyi aggregation, rule-consequentialism, and empirical dismissal.

  I need to build a tree starting from a near-universal commitment - perhaps "Significant individual suffering warrants avoidance" would work since almost everyone accepts this. The branching questions should be phrased as claims or cases students can answer without knowing the theory positions.

  For structure, I'll start with that universal commitment, then branch based on:
  - Whether we reject all forms of aggregation
  - How we handle concentrated claims
  - How we address disproportionate suffering
  - How we treat potential beings
  - How we respond to reluctant monsters

  I need to ensure all required leaves appear and mark combinations that are incoherent, unattractive, or unclaimed. Also need to identify any inseparable pairs and what case would separate them.

  The reluctant monster case is particularly important for distinguishing between theories that might otherwise look similar. I'll use it to separate prioritarianism from sufficientarianism since prioritarianism would reject sacrificing for the reluctant monster while sufficientarianism might permit it if thresholds are met.

  For the archival monster, this helps distinguish average utilitarianism (which might reject creating it) from total utilitarianism (which would favor creation).

  The swarm case challenges theories that object only to single-entity concentration but accept aggregation otherwise. This separates Nozickian constraints from views that permit aggregation as long as no single claim dominates.

  Finally, I'll note that Harsanyi aggregation and total utilitarianism appear together in one leaf since they converge on monsters - the tree can't separate them without additional cases about non-monster scenarios, which aren't part of this exercise.
answer: |-
  **The most diagnostic question: Must we sacrifice any number of moderate sufferings to prevent a single individual's truly catastrophic suffering?**

  1.  **Significant individual suffering warrants avoidance:**
      1.  *Can the suffering of one individual ever be outweighed by benefits to others?*
          1.  **No: Suffering cannot be outweighed by others' gains.**
              1.  *Does this apply symmetrically to benefits? Must we also avoid benefiting one if it causes any suffering to others?*
                  1.  **Yes: Suffering avoidance is paramount, benefits are secondary or irrelevant.** → **Negative Utilitarianism / Suffering-Focused Views** (Rejects Standard Monster, Reverse Monster, Archival Monster creation; prioritizes preventing worst suffering regardless of source or aggregation).
                  2.  **No: We can create benefits for others even if it causes *some* suffering, but we cannot impose catastrophic suffering on one for others' benefit.** → **Nozickian Side-Constraints** (Rejects Standard Monster, Reverse Monster, Archival Monster creation if catastrophic; permits Swarm only if no individual suffers catastrophic loss. Reluctant Monster protected).
          2.  **Yes: Suffering can sometimes be outweighed.** → Proceed to 2.
  2.  **How should gains and losses across individuals be compared?**
      1.  *Is summing individual utilities into an aggregate the correct way to make interpersonal comparisons for policy?*
          1.  **No: Aggregation itself is flawed.**
              1.  *Is the core problem the* concentration *of claims in one being (like the Monster), not aggregation per se?*
                  1.  **Yes: A single individual's extreme claim disrupts fairness.** → **Sufficientarian or Lexical-Threshold Views** (Rejects Standard Monster, Reverse Monster, Archival Monster creation if pushes individuals below threshold; may accept Swarm if thresholds maintained. May reject sacrifice for Reluctant Monster if it harms others below threshold).
                  2.  **No: Aggregation is flawed even when claims are distributed (like the Swarm).** → **Rule-Consequentialist Self-Effacement** (Rejects Standard Monster in practice via rules protecting individuals, might accept Swarm *if* rules permit; rejects Archival Monster creation due to rule instability; may accept sacrificing for Reluctant Monster if rules permit).
          2.  **Yes: Aggregation via summing utilities is fundamentally sound.** → Proceed to 3.
  3.  **Which aggregated utility function is correct?**
      1.  *Should the well-being of merely possible future individuals count equally with actual individuals?*
          1.  **Yes: Possible beings matter.** → **Total Utilitarianism** (Accepts Standard Monster, Swarm, Archival Monster creation; likely accepts sacrificing for Reluctant Monster if net gain).
          2.  **No: Only the well-being of actual (or existing) individuals counts.** → Proceed to 4.
  4.  **How do we aggregate the utilities of actual individuals?**
      1.  *Should we give priority to those who are worse off?*
          1.  **Yes: Benefits to the worse off matter more.** → **Prioritarianism** (Likely rejects Standard Monster, Swarm, Archival Monster creation if they worsen the worst-off; rejects sacrificing *for* Reluctant Monster if it harms worse-off individuals).
          2.  **No: Each individual's utility counts equally in the sum.** → Proceed to 5.
  5.  **Is the average utility or the total utility the correct aim?**
      1.  *Does adding new members with positive utility always improve the outcome, even if it lowers average utility?*
          1.  **Yes: More happy lives are better.** → **Harsanyi Aggregation / Weighted-Sum Utilitarianism** (Accepts Standard Monster, Swarm; rejects Archival Monster creation *only if* it lowers average utility *and* we are averaging; but Harsanyi typically converges with Total here. Accepts sacrificing for Reluctant Monster if net gain).
          2.  **No: The average utility level is what matters.** → **Average Utilitarianism** (Rejects Standard Monster if it lowers average; rejects Archival Monster creation if below average; rejects Swarm if it lowers average; rejects sacrificing for Reluctant Monster if it lowers average).

  **Unoccupied Combinations & Diagnosis:**
  1.  **'No Aggregation' + 'Concentration is the only problem' + 'Aggregation is flawed even distributed'**: (Path: 2a -> 2a1 -> 2a1b) *Incoherent*. Cannot simultaneously reject all aggregation *and* say concentration is the *only* problem; rejecting distributed aggregation contradicts the concentration-only claim.
  2.  **'Aggregation Sound' + 'Only Actual Count' + 'Priority to Worse-Off' + 'Average Matters'**: (Path: 2b -> 3b -> 4a -> 5b) *Unattractive & Unclaimed*. Prioritizing the worse-off inherently conflicts with purely averaging utilities; prioritizing the worst-off would require caring about their absolute level, not just the average.
  3.  **'Aggregation Sound' + 'Possible Beings Count' + 'Average Matters'**: (Path: 2b -> 3a -> 5b) *Unattractive & Unclaimed*. Including possible beings but caring only about average utility leads to the "Mere Addition" paradox and is generally seen as indefensible.

  **Indistinguishable Leaves & Separating Case:**
  *   **Total Utilitarianism** and **Harsanyi Aggregation** converge on all monster cases presented (Standard, Reluctant, Reverse, Swarm, Archival). *Separating Case Needed:* A scenario with risky social choices where individuals have different risk attitudes. Harsanyi, satisfying EU axioms, would weight utilities based on risk aversion; Total Utilitarianism might not, depending on interpretation. (E.g., Policy A: 50% chance of massive gain for Monster, 50% chance of minor loss for Swarm vs. Policy B: Certain moderate gain for all. Harsanyi *may* weight Monster's utility differently due to risk preferences; simple Total Utilitarianism sums expected utilities equally).
