  Hmm, the user used to work in pensions valuation, so they'll appreciate precise discount rate mechanics. The satire should bite through bureaucratic language alone, without explicit jokes. The Compensation Fund's absurdity must emerge from its own rules—like requiring claimants who "would have existed anyway," which is philosophically impossible to prove. 

  For the Non-Procreation Credit, the tone needs to mimic energy-saving advice brochures. The comparison between skipping two kids and skipping flights should look mathematically sound but ethically jarring. 

  Ah, and the buried critiques: discounting implying future people matter less, the harm/benefit distinction, and commodifying duty. These can't be stated outright—just visible in the structure. Like how the discount rate makes 2085 harm cost pennies today, or how the Fund invests in index trackers instead of helping anyone. 

  For the 150-word note... The non-identity problem is where the satire stretches truth. Philosophers like Parfit use it to show obligations *aren't* dissolved, but here it's weaponized to void compensation. A defender would say: "The Scheme ignores that we shape *which* future exists, so we owe it to *whomever exists* to leave a habitable world." To flip the joke, the leaflet could frame non-procreation as tragic but necessary—making readers squirm at the "recommendation." 

  Also, the discount rate joke oversimplifies. Economists argue growth-adjusted rates prevent sacrificing present poor for future rich. The leaflet presents it as pure devaluation. A fairer version might show high discount rates *protecting* current welfare—but that'd weaken the satire. 

