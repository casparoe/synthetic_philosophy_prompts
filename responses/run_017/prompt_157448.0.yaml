answer: |-
  ### Simulation Design: "Milltown Archives"  
  **Fiction:** A small industrial town (Milltown, 1900-1960) with two communities:  
  - **Mill Workers:** Majority group, employed by the town’s central mill.  
  - **Riverbottom Residents:** Marginalized group living in the floodplain, largely ignored by administration unless causing issues.  

  **Mechanics:**  
  - **Materials:** Index cards (two colors: white for Mill Workers, yellow for Riverbottom), markers, masking tape, poster paper (for timelines), tokens (buttons/paper clips).  
  - **Wall Display:** Three posters:  
    - **"Full History"** (hidden until debrief): Lists all 24 pre-written events (see JSON).  
    - **"Town Archive"**: Stores cards from Round 1.  
    - **"Digital Archive"**: Stores digitized cards from Round 2.  

  **Roles & Constraints:**  
  | Role              | Participants | Key Constraints                                                                 | Gap Produced                                                                 |  
  |-------------------|--------------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------|  
  | **Administrators** | 6            | - 8 min to record events on cards. <br>- Only 1 card per 90 sec timer beep. <br>- Must prioritize "urgent town business." | Riverbottom events (except problems) omitted; routine Mill events dominate. |  
  | **Archivists**     | 6            | - 6 min to "digitize" (tape cards to poster). <br>- Only 10 tokens (1 token/card). <br>- Must prioritize "well-documented, significant events." | Riverbottom cards rarely digitized; Mill cards amplified.                  |  
  | **Researchers**    | 6            | - 5 min to answer: *"How did Riverbottom residents shape Milltown’s history?"* <br>- Can only use "Digital Archive" posters. | Report claims Riverbottom was "unimportant" or "only problematic."         |  

  **Rounds:**  
  1. **Record Creation (Round 1):**  
     - Administrators receive event prompts (e.g., *"Mill payroll processed"* vs. *"Riverbottom festival held"*).  
     - **Constraint:** Timer beeps every 90 sec; they can only write one card per beep. Urgent Mill events (taxes, accidents) prioritized.  
     - **Storage:** Only 15 card slots on "Town Archive" poster. Administrators discard excess.  

  2. **Archival Selection (Round 2):**  
     - Archivists receive surviving cards. They spend tokens to "digitize" (tape) cards to the "Digital Archive" poster.  
     - **Constraint:** Tokens run out fast; they focus on legible Mill events (neat, pre-labeled).  

  3. **Research (Round 3):**  
     - Researchers write reports using only "Digital Archive" cards.  
     - **Payoff:** Researchers earn candy/bragging rights for "most confident report."  

