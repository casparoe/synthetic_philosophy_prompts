prompt: |-
  hey — I'm running a 90 minute session for about 18 first year undergrads in a course called History, Memory and Power. Mixed bunch, most of them have never thought of an archive as anything other than a warehouse where old stuff lives. I need an in-class activity that makes them *feel* three related claims I keep circling around, rather than me standing at the front asserting them. I'll name them here so you know what the machinery has to do, but I don't want the students to hear any of these words until the debrief.

  1. The administrative by-product claim: records mostly exist because some institution needed them for its own purposes — tax rolls, court dockets, hospital intake forms, plantation inventories, school registers. So what survives tracks bureaucratic usefulness, not importance. Nobody decided that the interesting stuff should be kept; the stuff that got kept was the stuff somebody was paid to write down.

  2. Problem-triggered visibility: groups who were *not* inside the administration show up in the record mainly at the moments they were a problem for it — an arrest, a riot, an outbreak, a complaint, an inquiry. So their surviving traces are skewed toward the moments they were least agentic and most threatening. The archive doesn't show them living, it shows them being handled.

  3. The legibility dividend: this compounds. Being recorded once makes you easier to record again — you're in the index, you have a file number, later finding aids and description and digitization budgets follow whatever is already described and already on the shelf. So a second generation of archiving sharpens the first generation's gaps instead of filling them. Gaps aren't noise sprinkled around a representative sample; they're structured, and they correlate with power, which is exactly why absence-of-evidence inferences from an archive go wrong in a predictable direction.

  The thing I most want them to hit is that none of this requires a villain. A room of well-meaning people with twenty minutes, a small budget, limited shelf space, and no instructions about whom to care about will reproduce all three. If the activity ends with students feeling guilty, or feeling like they spotted the bias and avoided it, it hasn't worked.

  So: design a runnable simulation. My constraints are — one room, 90 minutes, 18 people, no laptops for students, one projector if you need it, and materials limited to index cards, markers, masking tape and a printout or two. There should be rounds: an early round where they produce or collect records under time/budget/space pressure, a later round where a *different* subset of them acts as a second generation of archivists choosing what to describe, catalogue or "digitize" from what survived, and a final round where yet another subset plays researchers who can only use the surviving archive to answer a historical question about the same little world. I want the researchers to predictably over-claim — to treat "no card about X" as "X didn't matter / X didn't happen" — and I want that to be the moment the room notices something's off, not me telling them.

  Give me: the setup and the fiction (keep it cheap and generic, invent a small town / institution / 60-year span, whatever makes the mechanics bite), the roles and what each role does and doesn't know, the rules for each round including the constraints that do the work (time limits, budgets, shelf slots, whatever), a scoring or payoff scheme that doesn't need real money but gives people something to optimize, and the counting or display mechanic that makes the skew visible on the wall before anyone names it. Then the debrief: which moment in play maps onto which of the three claims, the questions to ask in what order, and how to run it so the students supply the generalisation themselves. Then be honest about (a) what will predictably go wrong the first time I run this — including the version where a sharp student deliberately over-collects the under-recorded group and breaks the demonstration, and the version where the whole thing feels like a moral lecture — and (b) which feature of these claims the activity simply cannot reproduce and I have to supply in words afterwards. I suspect #3's intergenerational compounding is the hardest to stage properly; tell me if you agree and what you'd do instead.

  After the prose, give me the structured bits:

  - A timeline table with exactly these columns: minute_range | what_participants_do | what_facilitator_does | mechanic_doing_the_work | intended_failure_mode. One row per phase, covering the whole 90 minutes.

  - A single JSON object with three named fields: "roles" (array of objects, each with fields role_name, info_they_have, info_they_lack, constraint_they_are_under, gap_that_constraint_produces, one_line_facilitator_note), "debrief_beats" (array of objects, each with fields order, moment_in_activity_to_point_at, question_to_ask, claim_it_maps_to — value must be one of "byproduct", "problem_triggered", "legibility_dividend", or "none_facilitator_must_supply" — what_a_good_student_answer_sounds_like, and fallback_if_that_moment_didnt_happen), and "cannot_reproduce" (array of short strings, each naming one feature of the three claims that the game can't stage and one sentence on how I should handle it in words).

  Keep it practical please, this is thursday and I have to prep it tonight.
reasoning: |-
  We are designing a simulation game for 18 students, 90 minutes, with index cards, markers, masking tape, and a projector if needed. The goal is to illustrate three claims about archives without using the jargon until the debrief. The claims are:
  1. Administrative by-product: Records exist because of institutional needs, not because they were deemed important.
  2. Problem-triggered visibility: Marginalized groups appear in records mainly when they are a problem for the administration.
  3. Legibility dividend: Existing records are easier to preserve and digitize, amplifying gaps.

  The simulation will have three rounds:
  1. Record Creation: Participants act as administrators creating records under constraints (time, space, budget).
  2. Archival Selection: A different group acts as archivists selecting which records to describe/catalog/digitize from the surviving records.
  3. Research: Another group acts as researchers using the surviving archive to answer a historical question, leading them to over-claim (treat absence as evidence of absence).

  We need a fiction: let's create a small town called "Milltown" that has a Town Hall administration. The time span is 60 years (1900-1960). The town has two main groups: the "Mill Workers" (who are the dominant, well-documented group) and the "Riverbottom" community (a marginalized group that lives by the river and is less integrated with the town's administration).

  Roles:
  - Administrators (Round 1): 6 students (they create records on index cards for various town events, but must prioritize administrative tasks and have limited time and resources).
  - Archivists (Round 2): 6 students (they select which of the surviving records to catalog/digitize, with constraints of time and budget).
  - Researchers (Round 3): 6 students (they use the cataloged/digitized records to answer a historical question about Milltown).

  But note: 18 students total. We can split into three groups of 6, but then each group does only one role? That might work. Alternatively, we can have multiple rounds and reassign roles, but we don't have time for that. Let's assign roles for the entire simulation: Group A (Administrators), Group B (Archivists), Group C (Researchers). They do their role in the respective round and then observe the next.

  However, in Round 1, only Administrators are active. In Round 2, only Archivists are active (they work on the records created in Round 1). In Round 3, only Researchers are active (they use the archive from Round 2). The other students can observe? We have 18 students, so we can have 6 in each role. That works.

  But we need to make sure that the records created in Round 1 are preserved in a way that some are lost? Actually, the constraints in Round 1 should cause some records not to be created at all (due to time pressure) and some to be lost (due to storage limits). Then in Round 2, from the surviving records, archivists select a subset to catalog/digitize.

  Fiction Setup:
  - Milltown has a Town Hall that keeps records. The town is dominated by the Mill (textile mill) and the Mill Workers. The Riverbottom community is a group of people who live in the floodplain and are often seen as outsiders. They are not employed by the mill and are sometimes the subject of complaints.

  Key events that might be recorded:
  For Mill Workers: payroll, hiring, promotions, accidents at the mill, retirements, etc.
  For Riverbottom: only when there is a problem: a flood that affects the town, a complaint about sanitation, a protest, a crime, etc.

  Round 1: Record Creation (Administrators)
  - Each administrator gets a set of event prompts (on cards or a sheet) that they must record on index cards. They have 10 minutes.
  - Constraints: 
    - They have a limited number of index cards (say, 4 per administrator? total 24 cards for 6 admins) and markers.
    - They have a limited time: 10 minutes.
    - They must record events as they happen, but they are overwhelmed by the volume of events. They are instructed to prioritize events that are required for the functioning of the town (e.g., payroll, taxes, official meetings) and events that are urgent (e.g., a fire, a complaint from a prominent citizen).
  - Event prompts: We'll have a list of events that occur over a 60-year period. Some events are about Mill Workers (routine and non-routine), some about Riverbottom (mostly problems), and some neutral (e.g., weather, town festivals). The administrator must choose which events to record based on time and card availability.
  - How to ensure the skew? By the nature of the events and the instructions: they are told that their job is to keep the town running, so they should record things that are necessary for administration. They are not historians; they are clerks.
  - Storage: After recording, they must "store" the cards in an "archive box" (a box with limited space). They can only store 15 cards (due to shelf space). So they must discard some. They are instructed to keep what is most important for future reference (which they will interpret as administrative continuity).

  Round 2: Archival Selection (Archivists)
  - The archivists receive the 15 stored cards from Round 1. They have to catalog and digitize a subset. 
  - Constraints: 
    - They have a limited budget: represented by tokens (maybe 10 tokens). Each card they catalog costs 1 token. Digitizing (which we'll simulate by making a digital copy on a projected screen) costs an additional token per card? But to keep it simple, let's say cataloging is free, but digitizing costs 1 token per card. They can choose to digitize up to 10 cards? 
    - They have 10 minutes. They must create a catalog (a list of the cards they digitize) and "digitize" by writing the card content on a master list that will be projected (or on a big poster paper if no projector). 
  - They are instructed to prioritize records that are easy to process (legible, already have a clear subject) and that seem important for the town's history.

  Round 3: Research (Researchers)
  - The researchers get the digitized catalog (the list of events that were digitized) and the master list (projected or on a poster). They do not see the undigitized records. They are given a research question: "What was the role of the Riverbottom community in Milltown's history between 1900 and 1960?" 
  - They have 10 minutes to write a short report (a paragraph) based solely on the digitized records. 
  - We expect they will find very few records about Riverbottom and conclude that they were not very important or active, except in a few problem events.

  Debrief:
  - We then reveal the full set of events that were supposed to happen (including the ones not recorded and not digitized) and show the gaps. We point out that the Riverbottom community had many events (like festivals, mutual aid, etc.) that were never recorded because they weren't a problem for the administration.
  - We map the rounds to the claims.

  To make the skew visible:
  - We can use the wall to display the records in three stages:
    1. All event prompts (what happened) - but we don't show this until the end.
    2. The stored records (15 cards) - we can post them on one part of the wall.
    3. The digitized records (subset) - we post them on another part, or project the list.

  But we don't want to show the full event list until the end. Instead, we can have a big timeline on the wall with years (1900-1960) and then during the debrief, we mark the events that were recorded and digitized versus the ones that weren't.

  Alternatively, we can have three posters:
  - Poster 1: "What Happened" (hidden until debrief) - with all events.
  - Poster 2: "What Was Recorded and Stored" (from Round 1) - 15 cards.
  - Poster 3: "What Was Digitized" (from Round 2) - the subset.

  During the debrief, we reveal Poster 1 and compare.

  Now, for the event list: We need to create a set of events. Let's have 30 events (so that in Round 1, they record 24, then store 15). The events should be:
  - 15 about Mill Workers: 10 routine (payroll, hiring, etc.), 5 non-routine (accident, strike, etc.)
  - 10 about Riverbottom: 2 positive (e.g., community festival, helping during a fire), 3 neutral (e.g., a birth, a marriage), and 5 negative (complaint, flood damage, arrest, etc.)
  - 5 about the town: weather, festival, etc.

  But note: the administrators will record mostly the routine Mill Worker events and the negative Riverbottom events because they are urgent or required. The positive and neutral Riverbottom events are less likely to be recorded because they aren't required and the admins are busy.

  To assign events: We can give each administrator a sheet with 5 events (so 6 admins x 5 = 30 events). They have to choose 4 to record (due to card limit) and then they store 15 out of 24 recorded. The events on the sheet are mixed.

  But we must ensure that the Riverbottom positive events are less likely to be recorded. We can do this by the way we write the event descriptions. For example:

  Mill Worker routine: "Payroll for the week of Jan 3, 1901: must be recorded for accounting."
  Mill Worker non-routine: "Accident at the mill: worker injured. Requires investigation."
  Riverbottom positive: "Riverbottom community held a festival. (optional: no administrative action needed)"
  Riverbottom negative: "Complaint from a Mill Worker about theft in Riverbottom. Requires investigation."

  The administrators are told: "You are clerks in the Town Hall. Record events that are required for the town's administration or that require immediate action. You have limited time and index cards."

  In Round 1, they record events on index cards. Each card must have: Event description, Date, and Category (they can assign a category if they want, but not required). They have 10 minutes to write 4 cards each (they can do less if time runs out). Then, they must decide which 15 cards to store (they can negotiate as a group). The rest are discarded (put in a "shredder" box).

  Round 2: Archivists get the 15 stored cards. They have 10 tokens. They can choose to digitize (i.e., copy onto the master list) any card at a cost of 1 token per card. They can digitize up to 10 cards. They also create a catalog (a list of the digitized events). They have 10 minutes.

  Round 3: Researchers get the catalog and the master list (projected or on a poster). They are given the research question and 10 minutes to write a paragraph. Then we ask one or two to read their report.

  Debrief: Reveal the full event list (30 events). Show which ones were recorded and which were digitized. Point out the gaps.

  Now, to address the concerns:

  - Sharp student in Round 1: An administrator might decide to record all Riverbottom events to be fair. But we can mitigate by time pressure and the fact that they have to prioritize administrative necessity. Also, the event prompts for Riverbottom positive are worded as not requiring action. If someone does over-record, that's okay because in the storage phase (only 15 slots) they might still be discarded. Even if stored, in Round 2 the archivists might not digitize them because they are not "important" (legible). So the compounding gap might still occur.

  - Moral lecture: To avoid, emphasize that the administrators and archivists are well-meaning and making rational decisions under constraints. The debrief should focus on the system, not individual choices.

  - What the game cannot reproduce: The intergenerational compounding (Claim 3) is hard because we only have two generations. But we can show that the records that were stored were easier to digitize (because they were already in the archive) and that the archivists focused on those. Also, the researchers only see the digitized records. So the gap from Round 1 is amplified in Round 2. We can point that out.

