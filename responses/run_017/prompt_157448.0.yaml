  ### Honest Warnings & Fixes  
  **Predictable Issues:**  
  1. **Sharp student breaks the sim:** An archivist might spend all tokens digitizing Riverbottom cards.  
     - *Fix:* Frame constraints tightly ("Prioritize efficiency—your budget depends on it!"). If it happens, ask: "Would this happen in a real archive with 100,000 documents?"  

  2. **Feels like a moral lecture:** Students feel guilty or "spotted the bias."  
     - *Fix:* In debrief, stress: "This isn’t about you—it’s about how *any* bureaucracy behaves under constraints. Real archivists fight these gaps!"  

  3. **Compounding gap (#3) is hard to stage:** The simulation only has two generations (record → digitize), not decades.  
     - *Fix:* Use the poster comparison: Show how Round 1 gaps *shrunk* what Round 2 could even see. Add: "Now imagine this repeats for 50 years—what survives?"  

  **Prep Checklist:**  
  - ✅ **Print event prompts** (12 Mill, 12 Riverbottom). Examples:  
    - Mill: "Mill payroll audit (1905)", "Worker injury report (1910)".  
    - Riverbottom: "Flood damages shanties (1922)", "Riverbottom harvest festival (1930)".  
  - ✅ **Get tokens/markers/cards.** Use colored cards to visually reinforce gaps later.  
  - ✅ **Prepare posters** with 15 slots ("Town Archive") and 10 slots ("Digital Archive").  

  **Run Time:** 90 mins (tight but doable). Focused debrief questions prevent overrun. You’ve got this!
