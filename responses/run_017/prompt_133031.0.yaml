answer: |-
  The air in the Surplus reading room hummed, a low thrum from the climate control fighting the latent heat of ten thousand active terminals. Cold fluorescence etched the lines deeper on Wren Halloway’s face as she looked up from the glowing screen. Anselm Roy stood just inside the reinforced glass doors, the sharp lines of his Bureau coat seeming incongruous against the room's utilitarian sprawl. He looked tired, the polished assurance worn thin. It was ten past two.

  "Anselm." Wren’s voice was flat, unsurprised. She didn’t stand. "The Bureau doesn't usually send its conscience out past midnight."

  "The Bureau’s conscience sleeps soundly," Roy replied, crossing the echoing space. His footsteps were quiet on the polymer floor. "Its pragmatists, less so. We need to talk. Before the Convocation."

  "About Ost’s signature." It wasn’t a question. The verification record glowed on her screen: *Order 7-K. Authorization: Maret Ost. Countersignature: Verified. Source: Field Commander’s Log, Sector Gamma, Archival Seal 78-G.* "You saw it."

  "I saw it." Roy stopped before her terminal, his shadow falling across the keyboard. He didn’t look at the screen. "The Surplus does its job. It collects. It verifies. It displays. Admirable, in its way. Like cataloging every brick in a ruin."

  "And the Bureau does its job," Wren countered, leaning back, her eyes meeting his. "It selects. It arranges. It smooths the edges until the ruin looks like a blueprint for a future palace."

  Roy sighed, a sound of genuine weariness. "Wren, don’t caricature. You know it’s more than that. A city isn’t built on bricks. It’s built on *agreement*. On shared understanding. On knowing what we’re building *towards*. The Bureau gives Terrenne that shape. We tell the *truth*, Wren. Every word we utter passes verification. But we tell it in a way people can *live* inside. What do you offer? A million shards of ‘what happened’. Who pieces them together? Who decides what matters at sunrise?"

  "*We* decide," Wren said, gesturing around the cavernous room. "Anyone. Everyone. The facts aren’t yours to parcel out like rations. They’re the ground. The unyielding, undeniable ground we all stand on. You build your palace on sand you keep sweeping away."

  "Ground?" Roy’s voice sharpened. "A field of rubble is ground too. But you can’t build on it. You can only dig. And keep digging. Forever. That’s the Surplus’s selection rule, Wren: *no* selection. You abdicate the act of meaning-making to whoever has the time, the obsession, the loudest voice. Is that neutrality? Or is it handing the city’s story to the scavengers and the screamers?"

  Wren didn’t flinch. "Meaning is made *between* people, Anselm, not *for* them. It grows *from* the ground. Your Bureau doesn’t just arrange facts; it replaces them. Not with falsehoods, no. You’re too clever for that. You replace them with… silences. With strategically placed truths that point away from the inconvenient ones. With the *least* informative answer possible. You know exactly what Ost’s signature means. You know Kessel wasn’t an accident, wasn’t rogue action. You know the story Terrenne lives by is built on its denial. And every carefully chosen true sentence you’ve uttered for ten years has been a brick in that denial."

  "Denial?" Roy leaned forward, palms flat on the cool terminal housing. "Is that what you think we’re doing? We *acknowledged* Kessel. We mourned it. We rebuilt."

  "You acknowledged *an event*," Wren shot back. "You denied its *author*. You denied the hand that lit the fuse. You took the fact of the fire and severed it from the fact of the order. You scattered the pieces so no one could see the whole picture. That’s not mourning. That’s dismemberment."

  "And why?" Roy’s voice dropped, intense. "Because the *whole picture*, as you put it, would have shattered everything. Ten years ago, we were hanging by a thread. Ost wasn’t just a leader; she was the story we told ourselves to stop tearing each other apart. ‘The Founder’, ‘The Peacemaker’. We needed that story. We *built* on it. Hospitals, schools, trade pacts – all resting on the belief that the peace was clean, that the hard choices were made by others, in the dark. Take that away?" He shook his head. "You think you’re handing them truth. You’re handing them a live grenade. What do they do with it? Who puts Terrenne back together after you shatter the story holding it up? The Surplus? Your glorious heap of facts?"

  Wren was silent for a moment, the hum of the room filling the space. She looked past him, at the endless rows of terminals, each a window into a verified fragment. "You’re right," she said quietly. Roy blinked, startled. "It might shatter. People might not know how to move forward. Kessel won’t come back. The dead won’t rise." She met his eyes again, her gaze fierce. "But what you’re ignoring, Anselm, what your Bureau *depends* on ignoring, is the rot that denial breeds. You think the liar is free? He’s a slave. He’s chained to the truth he’s hiding. He has to remember it, constantly, to work around it, to build his alternatives. But what happens when you do it for ten years? Institutionally? Systematically? When the shaping becomes so complete, so seamless?"

  She leaned forward. "Where is the lie *now*, Anselm? Not in your sentences. They’re true. Is it in the things you *don’t* say? In the reports buried on page seventeen? In the press conference scheduled opposite the memorial? In the way you frame every question about Kessel as a question about ‘healing’ and ‘moving forward’, never about accountability? Is the denial in the silence *between* your true words?"

  Roy straightened, his face pale. "We make choices. Necessary choices. For coherence. For stability."

  "Coherence built on a void," Wren pressed. "You started knowing Ost signed the order. You built your shining city on that buried fact. But after ten years of never speaking it, of crafting a world where it *couldn’t* be spoken… do *you* still feel the weight of it? Or has the Bureau’s beautiful, truthful narrative become your reality? Is Ost the Founder who saved us, full stop? Is the signature in the Surplus just… an anomaly? A glitch in the archive?"

  The question hung in the cold air. Roy didn’t answer immediately. He looked down at his hands, then around at the towering shelves of data cores, the silent witnesses. "It costs," he said finally, his voice rough. "It costs the survivors of Kessel every day. It costs *me*. The shaping isn’t free. We carry the omissions. We know the map isn’t the territory."

  "But *do* you?" Wren asked, the intensity undimmed. "Or do you carry the *idea* of the cost? The *concept* of the omission? When was the last time you looked at the field reports from Kessel, Anselm? Not the summaries. The raw intake logs. The names. The timestamps. Do they still feel real? Or are they just… data points your narrative explains away?"

  Roy flinched, a minute recoil Wren wouldn’t have caught ten years ago. "That’s unfair."

  "Is it? You build alternatives. That’s the liar’s freedom, isn’t it? The freedom Ost exercised when she denied giving the order. The freedom to say ‘it is not’ to what *is*. You argue that’s the same freedom that lets us start anew. Maybe. But there’s a precipice. When does the builder of alternatives lose the ground he’s building *from*? When does the man shaping the truth forget what it felt like when it was unshaped?"

  He stared at her, the polished defender momentarily stripped bare. "And you, Wren?" His voice was low, probing a wound. "You’ve lived in this archive for ten years. Breathing the dust of other people’s actions, other people’s suffering, other people’s lies and truths. Where’s *your* ground? What shared world do *you* stand in? Or is the Surplus your world now? A world made entirely of verified fragments? Can you even see Terrenne out there anymore, living, struggling, *needing* a story? Or is it just… more data to be filed?"

  Wren didn’t look away, but her knuckles were white where she gripped the edge of the terminal. The endless hum of the archive seemed to swell around them. The question resonated, turning back on itself. The fragility wasn't just out there; it was right here, in this room, between them.

  Outside the high, narrow windows, the first faint grey smear of pre-dawn touched the skyline of Terrenne. The Convocation was five hours away.

  Roy pushed himself off the terminal. He looked exhausted, hollowed. "They need a story, Wren. However flawed. They need to know what Terrenne *is*."

  "And they need to know what Terrenne *did*," Wren replied, her voice steady but drained. "However terrible. Or they'll build on bones they refuse to name."

  He nodded once, a curt, weary gesture that conceded nothing and everything. "Good luck tomorrow." The words were rote, stripped of conviction.

  He turned and walked back towards the glass doors, his footsteps echoing in the vast, silent room. Wren watched him go, then turned back to the screen, to the stark, verified fact of Maret Ost’s signature. The hum of the Surplus enveloped her, a sea of truths waiting to drown or buoy. She didn't know which. Dawn crept closer, minute by verified minute.
