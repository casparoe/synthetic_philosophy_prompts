prompt: |-
  I'm a PhD student TAing for our upper-level normative ethics seminar, and I'm marking the midterm answers to the question below. I'd like a second opinion before I commit to a grade, since one answer reads very smoothly and I don't want to be carried along by it.

  The question (20 marks, 500-word limit):

  The doctrine of double effect (DDE) is often said to explain why it may be permissible to divert a runaway trolley onto a track where it will kill one workman rather than five, but impermissible to push a heavy stranger off a footbridge into its path so that his body stops it. Consider the following pair of cases.

  Case A (Sandbags): A runaway trolley will kill five workmen unless you divert it onto a spur. The spur ends in a pile of sandbags, which on their own are sufficient to stop the trolley before it reaches the five. A single workman is standing directly in front of the sandbags; he will certainly be killed, but his body contributes nothing to stopping the trolley.

  Case B (Sandbags Plus): Everything is as in Case A, except that the sandbags on their own are not quite sufficient: the trolley will stop short of the five only if the collision with the workman's body also slows it. There is no other way to save the five.

  (a) Set out the conditions DDE imposes, distinguishing the good effect from the merely foreseen bad effect, and explaining what it is for a bad effect to be a means rather than a side-effect. (6 marks)
  (b) Apply the doctrine to both cases. If your verdicts differ, identify exactly which condition does the work. (8 marks)
  (c) How much work, if any, is done by the bare comparison of numbers — five lives saved against one lost — in the doctrine's verdicts on these cases and on the footbridge case? (6 marks)

  Student's answer:

  DDE holds that an action with both a good and a bad effect is permissible only if (i) the action itself, apart from its effects, is not wrong; (ii) the agent intends the good effect and merely foresees the bad one; (iii) the bad effect is not the means by which the good effect is produced, but a side-effect of producing it; and (iv) there is a proportionate reason for acting. The doctrine is designed to capture exactly the contrast we care about: in the switch case the one death is foreseen but not aimed at, whereas on the footbridge the man's body is what stops the trolley, so his death is the means of saving the five and the act is excluded.

  Case A is straightforwardly permissible. The good effect, five lives saved, is produced by diverting the trolley into the sandbags; the workman's death plays no part in producing it, so it is a foreseen side-effect and conditions (ii) and (iii) are met. Condition (iv) is met too, since the comparison of numbers is straightforward: five lives outweigh one, and that favourable balance is what makes the reason proportionate — it is the same comparison defenders of the doctrine rely on in the original switch case.

  Case B is impermissible. Here the five survive only because the workman's body helps to slow the trolley: the good outcome causally depends on his death, and so his death is the means to it. Structurally this is the footbridge again, and DDE rules it out for the same reason, namely that the man is being made to serve as a brake.

  I should say why I reject the alternative reading of condition (iii), the agential one, on which a bad effect counts as a means only if the agent's plan or practical reasoning builds it in as a step towards the good effect. That reading should be rejected because on it whether the death is a means depends on what the agent happens to be thinking or saying to herself as she acts, which is a private psychological matter and cannot affect whether the action is right. The causal reading is therefore the only reading with moral content, and it yields the correct result in both cases.

  Please assign a mark out of 20 and give me the point-by-point comments I can enter against the rubric: which claims are correct and worth credit, where precisely the argument fails and why, and what the answer would have needed to do to earn full marks. I want the comments to locate the specific step that goes wrong rather than offering a general impression, and I don't want the mark inflated by the confident prose.
reasoning: |-
  Okay, the user is a PhD student TA grading a midterm for an upper-level ethics seminar. They're concerned about one student's answer on a trolley problem variation involving the Doctrine of Double Effect (DDE). The answer reads smoothly but they want an unbiased second opinion before finalizing the grade.

  Let me break this down systematically. The question has three parts: (a) explaining DDE conditions, (b) applying to two sandbag cases, and (c) discussing the role of numbers. The student's answer is indeed well-written but has substantive flaws in part (b) and (c) that need careful identification.

  For part (a), the student nails all four DDE conditions correctly. Full marks there - 6/6. The explanation of means vs side-effect is crisp and textbook-perfect.

  The problems start in part (b). In Case A, they're correct that it's permissible, but their reasoning about sandbags doing all the work is right for the wrong reason - actually in this scenario the workman's death is still causally necessary because he's blocking the sandbags. More importantly, their Case B analysis is fundamentally wrong. They claim it's structurally like footbridge because death is a means, but actually under standard DDE interpretation, the sandbags remain the primary means while death is still collateral damage. Their rejection of the "agential reading" is also misplaced - that's actually the mainstream view in DDE scholarship.

  For part (c), they completely miss that numbers comparison is secondary in DDE - proportionality is necessary but not sufficient. Their claim that "five outweighing one" does the work oversimplifies the doctrine.

  The writing is so polished it's easy to miss these errors. I'll recommend 13/20 - solid but not top tier. The comments should pinpoint exactly where the reasoning derails: specifically the flawed causal analysis in Case B and the misunderstanding of proportionality. To get full marks they'd need to recognize Case B's permissibility under DDE and properly contextualize the numbers argument.

  This seems like a classic case where eloquent writing masks conceptual errors - exactly what the TA is worried about. The student clearly understands DDE basics but falters on nuanced application. My feedback will help the TA justify the grade while giving the student actionable insights for improvement.
answer: |-
  Based on a strict application of the rubric and standard DDE interpretation (particularly the mainstream "intentional" reading of "means"), here's the mark breakdown and point-by-point comments for the student's answer:

  **Final Mark: 13/20**

  **Comments for Rubric:**

  **(a) Set out the conditions... (6 marks)**
  *   **Strengths (6/6):** Correctly lists all four core DDE conditions (i). Defines the good effect (saving five) and bad effect (killing one) clearly for the context (ii). Provides an accurate *causal* definition of "means" (bad effect *causally necessary* for good effect) versus "side-effect" (bad effect merely foreseen but causally redundant for good effect) (iii). This is a precise and complete answer to part (a), deserving full marks.

  **(b) Apply the doctrine to both cases... (8 marks)**
  *   **Case A (Sandbags) - Strengths (3/4):** Correctly identifies the case as permissible under DDE. Correctly states the good effect (saving five) is achieved by the sandbags. Correctly states the death is a foreseen side-effect.
  *   **Case A (Sandbags) - Weakness (1 mark deducted):** Incorrectly claims "the workman's death plays no part in producing it" and "contributes nothing." **Reason:** In Case A, the workman is *physically blocking the sandbags*. While the sandbags do the stopping, his death *is* causally necessary to *access* the sandbags. His body must be crushed *before* the trolley hits the sandbags. DDE would still permit this (death is not the *means* to stopping, just a necessary side-effect of accessing the means), but the student's causal description is inaccurate.
  *   **Case B (Sandbags Plus) - Error (Major, 3 marks deducted):** Incorrectly concludes the case is impermissible, claiming the death is the "means." **Reason:** While the death *is* now causally necessary *for the stopping power* (completing what the sandbags lack), DDE (especially the intentional/agential reading dominant in the literature) would *still* classify the death as a *side-effect*, not the *means*. The *means* is still diverting the trolley into the *sandbag structure*; the death is a *foreseen consequence* of the impact *with that structure* that happens to provide the necessary extra stopping power. The *agent's intention* is to stop the trolley *using the sandbag setup*; the death is a foreseen but unintended consequence *of that action*. This is structurally distinct from Footbridge, where the death *is* the intended means (pushing the man *to hit the trolley*).
  *   **Rejection of Agential Reading - Error (1 mark deducted):** Incorrectly dismisses the agential/intentional reading of "means." **Reason:** This dismissal is fatal to their Case B analysis. The mainstream interpretation of DDE, particularly concerning "means" (iii), *is* the intentional/agential one: a bad effect is a *means* if the agent *intends* it *as part of their plan* to achieve the good end. It is *not* solely a matter of "private psychology" but of the *objective description of the agent's plan and intentions* (e.g., "I will stop the trolley *by pushing the man onto the tracks*" vs. "I will stop the trolley *by diverting it onto the spur with the sandbags*"). Philosophical arguments *do* hinge on this distinction, and rejecting it undermines the standard DDE analysis of cases like Bombing vs. Strafing. Their "causal reading" alone is insufficient and leads them to the wrong conclusion in Case B.
  *   **Overall for (b):** Correct Case A verdict but flawed reasoning regarding necessity; Incorrect Case B verdict due to misunderstanding the "means" condition and rejecting the agential reading. **(4/8)**

  **(c) Role of numbers... (6 marks)**
  *   **Weakness (Major, 4 marks deducted):** Overstates the role of the numbers comparison ("five lives outweigh one") and misunderstands its function within DDE. **Reason:** The student claims the favourable balance "is what makes the reason proportionate" and implies it does the primary work in justifying the act under DDE. This is incorrect. DDE treats proportionality *(iv)* as a *necessary but insufficient* condition. The doctrine's *core work* is done by the *intention* and *means/side-effect* distinctions *(ii & iii)*. The numbers comparison (proportionality) only kicks in *after* these conditions are satisfied to ensure the good achieved sufficiently outweighs the foreseen bad. Crucially, DDE *forbids* an act even if proportional (5>1) if it fails the means/intention conditions (as in Footbridge). The student's answer implies the numbers do the core justificatory work ("it is the same comparison..."), which misrepresents DDE. The numbers comparison *alone* cannot make a DDE-impermissible act (like Footbridge or, in their view, Sandbags Plus) permissible.
  *   **Minor Strength (2/6):** Correctly identifies that proportionality (involving the numbers) is a required condition of DDE and is met in Case A/standard switch. But this is insufficient to salvage the answer to (c).

  **Summary of Why Not Full Marks (20):**
  1.  **Critical Error in Case B Application:** Misapplied the "means" condition to Sandbags Plus, incorrectly deeming it impermissible like Footbridge, due to rejecting the agential reading.
  2.  **Misunderstanding of "Means" Condition:** The rejection of the agential/intentional reading is a fundamental misunderstanding of how DDE is standardly applied to distinguish cases. The causal reading alone is inadequate.
  3.  **Overemphasis on Numbers in (c):** Failed to recognize that the numbers comparison (proportionality) is only a secondary, necessary condition that cannot override the primary intention/means constraints. Attributed too much justificatory weight to it.
  4.  **Minor Inaccuracy in Case A Causality:** While not changing the permissibility verdict, the description of the workman's role in Case A was factually imprecise regarding necessity.

  **What Was Needed for Full Marks:**
  *   **(a):** As achieved. (Full marks)
  *   **(b):**
      *   Case A: Correct verdict + accurate description of the death as a foreseen side-effect *despite* its causal necessity for accessing the sandbags (acknowledging the workman blocks the sandbags).
      *   Case B: Correct verdict (Permissible) + explanation that while the death is causally necessary for the stopping power, the *agent's intended means* is still diverting the trolley *into the sandbag structure*; the death is a foreseen but unintended side-effect *of that action*. Explicitly use the intentional/agential understanding of "means."
      *   Explain *why* Case B differs from Footbridge: In Footbridge, the agent *intends* the impact of the body *as the means* to stop the trolley. In Sandbags Plus, the agent intends the impact with the sandbag structure, foreseeing the death as a consequence.
  *   **(c):** Clearly state that the numbers comparison (5>1) is only relevant for the *proportionality* condition (iv). Emphasize that this condition is necessary *but only applies if the other conditions (especially ii & iii) are already satisfied*. Stress that the numbers *cannot* make an act permissible under DDE if it involves intending the evil or using it as a means (e.g., Footbridge remains impermissible despite 5>1). The core justificatory work is done by the intention/means distinctions.
