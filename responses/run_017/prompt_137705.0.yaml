prompt: |-
  So I've been trying to figure out what I actually think about promising, and the only honest method I've got is to write down my gut on a bunch of cases and then ask what principle, if any, I'm secretly using.

  - My friend asks me to get coffee next Saturday, I say yes, and then something I've wanted for years lands on the same afternoon. Gut: I go to coffee, or at minimum I owe her an actual reschedule and not a flake.
  - End of a party, real warmth, "we are totally doing this again soon," everyone knows it won't happen. Gut: nobody's bound by that and I feel nothing.
  - A dying friend asks me to promise I'll take her dog. Gut: that one binds hard, years later, even though she's gone and has no idea whether I did it.
  - Guy on a plane asks me to email him an article, I say I promise, he's forgotten by the next day, I'll never see him again. Gut: binds, but barely — like a 2 out of 10 — and skipping it costs me almost nothing emotionally. I genuinely don't know why this isn't the same as the dog one.
  - Someone makes me promise not to testify by threatening me. Not binding at all.
  - I promise to pay back the $500 I think I owe, then find the reciept — already paid. Not binding.
  - But I promise to help a friend move and completely underestimate what the flight costs. Still binding, my problem.
  - I promise to host book club in March, and in February my kid's in the hospital. Fine to bail, but I owe real notice and a make-up; if I just ghost, I've done something wrong.
  - I promise to keep a secret, then it turns out keeping it lets someone get seriously hurt. I break it.
  - "I promise myself I'll quit" on New Year's. Not really the same animal, and breaking it isn't the kind of thing I owe anyone an apology for.
  - I say "I promise" while already knowing I'm going to blow it off. That's clearly worse than just blowing it off, even in a case where nothing else changes.
  - The one I can't settle: a woman in early-stage Alzheimer's asks me to promise I'll come by every Sunday. A year later she doesn't know who I am and seems indifferent whether I show. My gut flickers between obviously you still go and there's no one left to be owed this.

  My half-baked theory has been that promising hands the promisee a kind of claim that only they can cancel — but that makes the promise-to-myself case weird, and I'm not sure it explains why the dog and the plane guy feel so different.

  So: is there one principle that gets these, or close? And I want you to actually commit here — pick the account you think is right rather than lining up three and leaving me to choose, say plainly which of my verdicts it can't keep and which one you'd overturn, and tell me what it predicts about the Alzheimer's case and about a couple I haven't listed: I promise my brother I'll keep his confidence and then he tells me he's about to do something genuinely awful to someone; and I promise someone something and later they release me, but I'm pretty sure they only said it because they felt pressured. Where is your own answer most likely wrong? American English, and no fence-sitting.
reasoning: |-
  Okay, the user is really digging into what makes a promise binding. They've listed a bunch of scenarios with their gut reactions and want a unified principle that explains them all. Let me start by understanding each case.

  First, the coffee promise: they feel obligated to go or reschedule properly. Then the party "promise" isn't binding. The dying friend's dog—super binding. The plane guy asking for an article is barely binding. Threatened promises? Not binding. Already paid debt? Not binding. Underestimating moving costs? Still binding. Hospitalized kid? Can bail but owe notice. Secret causing harm? Break it. Self-promises? Different, no apology needed. Lying when promising? Worse. Alzheimer's case? Torn.

  Their half-baked theory is that the promisee has a claim only they can cancel. But that doesn’t explain self-promises or the difference between the dog and plane guy. So the user needs a principle that covers all these without contradictions.

  I recall Scanlon's Principle F. It says breaking a promise without reason is wrong because it manipulates the promisee's expectations. That fits most cases. But let's test it. 

  Coffee promise: the friend relies on it, so breaking it without reason is wrong. Party line? No reliance, so not binding. Dying friend's dog: she relied on the promise for peace of mind, so binding even after death. Plane guy? Minimal reliance, so weak obligation. Threatened promise: no voluntary reliance, so not binding. Already paid debt: no expectation of repayment, not binding. Underestimated moving costs: friend relied, so binding. Hospitalized kid: emergency overrides, but must inform because of their reliance. Secret causing harm: preventing harm is a reason to break, justified. Self-promise: no other person relying, so different. Lying when promising: worse because it's deliberate deception. 

  Alzheimer's case: initially, she relied, but later she doesn't remember. The reliance was at the time of promise, so obligation holds unless harm is done. But if she's indifferent, maybe the obligation fades? Principle F might say the promise is still binding because she relied when capable. But the user is conflicted. So the principle would say keep going but allows override if it causes distress.

  Brother's confidence: if he's about to do harm, breaking the promise is justified to prevent harm. Released under pressure: the release isn't valid because it wasn't voluntary, so obligation might still hold.

  Where could this go wrong? The plane guy feels too weak under Principle F. Maybe because the reliance is minimal. And the Alzheimer's case is tricky—maybe ongoing reliance isn't there, but the principle doesn't account for changing conditions well. Also, self-promises aren't covered, but the user accepts they're different.

  So the user's deeper need is a consistent ethical framework to navigate promises without guilt or inconsistency. They want clarity, especially in ambiguous cases like Alzheimer's. They might also need to reconcile their intuitions with a theory that feels true to their experiences.
answer: |-
  Here's the single principle I think best explains your intuitions, grounded in Scanlon's "Principle F" from *What We Owe To Each Other*, but sharpened to fit your cases:

  **A promise creates a binding obligation if (and only if) the promisee voluntarily and reasonably relies on the promise to shape their expectations or decisions, and breaking it without adequate reason would intentionally manipulate or exploit that reliance.**

  Now, let's apply it ruthlessly to your cases, overturn one of your verdicts, commit on Alzheimer's, predict new cases, and expose weaknesses:

  1.  **Coffee:** *Binding.* Your friend reasonably relies on you (plans her Saturday, anticipates company). Breaking it exploits that reliance unless you give her a chance to adjust (reschedule).
  2.  **Party "Promise":** *Not Binding.* No reasonable reliance ("everyone knows it won't happen"). It's social noise, not a promise shaping plans.
  3.  **Dying Friend's Dog:** *Binding Hard.* She relied *profoundly* on your promise for peace of mind regarding her beloved dog's fate. Breaking it exploits that crucial reliance, even posthumously. The reliance *happened*.
  4.  **Plane Guy (Article):** *Binding (but weak - 2/10).* He *did* voluntarily rely, however minimally ("Oh good, I don't need to write it down/remember it myself"). Breaking it *is* a minor exploitation of that reliance. The weakness comes from the low *stakes* of his reliance and the ease of fulfilling it. **This is why it feels different from the dog:** The *degree* and *significance* of reliance are vastly lower.
  5.  **Threatened Promise:** *Not Binding.* Reliance wasn't truly voluntary (coerced). There's no voluntary reliance to exploit fairly.
  6.  **Already Paid Debt:** *Not Binding.* No reasonable reliance exists *because there's nothing owed*. Your promise didn't create a new expectation of payment; it mistakenly affirmed a non-existent debt.
  7.  **Underestimated Moving Costs:** *Binding.* Your friend reasonably relied on your promise (didn't hire movers, planned logistics). Breaking it exploits that reliance. Your miscalculation isn't their fault or an "adequate reason" to abandon the commitment.
  8.  **Sick Kid / Book Club:** *Binding, but overridden by emergency.* Your friends relied (planned schedules). Bailing exploits that reliance *unless* you give them maximum notice (mitigating harm) and offer a make-up (acknowledging the obligation). The child's emergency *is* an adequate reason to break the *attendance*, but not the obligation to *inform and mitigate* the reliance harm.
  9.  **Harmful Secret:** *Binding broken justifiably.* You created reliance (they trusted you with the secret). However, preventing serious harm is an overwhelmingly adequate reason to break the promise. It outweighs the exploitation of reliance in this specific context. You still *broke* the promise, but for good reason.
  10. **Promise to Self:** *Not Binding (in the same way).* No *other person* voluntarily relied on your promise to shape *their* expectations/decisions. It's a resolution, not a promise creating interpersonal obligation. Breaking it might be self-defeating, but it doesn't *wrong someone else*.
  11. **Lying Promise:** *Worse.* Saying "I promise" *intentionally induces* reliance you know you will exploit. It's deceptive manipulation of the reliance mechanism itself. Much worse than just failing to do something spontaneously.
  12. **Alzheimer's Case:** *Obligation Weakens Significantly Over Time, Likely Fades.* **My Verdict:** Initially, binding. She voluntarily relied on your promise for future comfort/companionship when she was capable of forming that reliance. A year later? She no longer has the cognitive capacity to *rely* on your visits or derive the expected benefit. Her "indifference" signals the absence of the *reliance interest* the promise was meant to serve. Continuing might be kind, but the *binding obligation* based on her reliance diminishes as her capacity to rely vanishes. Ghosting immediately is wrong (exploits *initial* reliance), but after a year of decline and indifference, the specific promise-based obligation is likely gone. **Commit:** You don't *owe* it to *her* anymore, though kindness or general duty might suggest visits.

  **Overturning Your Verdict:** I overturn your "binds, but barely (2/10)" on the **Plane Guy**. Under this principle, it *does* bind, however minimally, because he *did* voluntarily rely (even trivially). Skipping it *is* a minor exploitation. Your feeling that it "costs almost nothing emotionally" reflects the low *stakes* of the reliance, not the absence of obligation.

  **Predictions on New Cases:**

  1.  **Brother's Confidence / Awful Act:**
      *   **Prediction:** *Binding broken justifiably.* Your brother reasonably relied on your promise of confidentiality. However, if he reveals an imminent plan to commit genuine harm (e.g., assault, fraud), preventing that harm is an overwhelmingly adequate reason to break the promise. You must break it. The obligation is overridden, though you still *broke* a promise.
  2.  **Released Under Pressure:**
      *   **Prediction:** *Obligation likely persists.* The release isn't valid because it wasn't *voluntary*. If they felt pressured, they couldn't genuinely choose to cancel their reliance claim. The original reliance (and your obligation not to exploit it) remains intact. You should either fulfill the promise or seek genuine confirmation they *want* to release you without pressure.

  **Where My Answer is Most Likely Wrong:**

  1.  **The "Voluntary" in Reliance:** Is the plane guy's reliance *truly* voluntary in a meaningful sense, or just a reflexive "okay, thanks"? This principle might over-obligate for trivial, spur-of-the-moment assurances.
  2.  **Posthumous Obligations (The Dog):** Does reliance truly "bind" after death? The principle says yes (the reliance *happened*), but critics argue obligations require a living obligee. This feels intuitively strong for the dog, weaker for, say, promising to burn a letter no one else cares about.
  3.  **The Alzheimer's Slippery Slope:** Determining *when* the capacity for reliance is gone enough to extinguish the obligation is messy. Is it when she forgets the promise? When she forgets you? When she seems indifferent? The principle gives a framework (loss of reliance capacity), but pinpointing the moment is ethically fraught.
  4.  **Self-Promises:** It dismisses them entirely as interpersonal obligations, which feels right, but doesn't address why *some* self-promises feel morally significant (e.g., addicts).

  **In short:** Your gut tracks **reasonable, voluntary reliance**. A promise matters because someone else changes what they do or expect based on your word. Breaking it without good reason is wrong because it takes advantage of that change. The *strength* of the bond depends on the *significance* of the reliance. This explains why the dog (profound reliance) binds harder than the plane guy (trivial reliance), why coercion voids it (no voluntary reliance), why changed facts (debt paid) void it (no reliance needed), and why emergencies override but require mitigation (reliance still happened). It resolves Alzheimer's by focusing on the *promisee's* capacity for reliance, which fades with the disease. This is the clearest, most consistent principle matching your intuitions.
