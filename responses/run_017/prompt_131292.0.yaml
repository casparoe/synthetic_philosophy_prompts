prompt: |-
  Hey — I'm in the third year of a history PhD (economic/global history, sort of) and I need to turn a half-baked idea into a two-page proposal for a nine-month dissertation fellowship; the deadline's in a couple of weeks and I've got nothing on paper. The thing I keep circling is the old "why Britain and not China?" question — the Great Divergence / Needham-question style thing — and I'm actually less interested in answering it than in whether it's a well-posed question at all. My supervisor says it's either trivial (they had coal and colonies, we didn't) or meaningless, and a friend in the econ department says it's just an identifiability problem: sustained growth in income per head happened once, so n=1, and you can't separate "Britain had the causes" from "whoever went first would end up looking like Britain afterwards". My flatmate, who did a philosophy BA, says this is just the 1980s literature on contrastive explanation with the serial numbers filed off. None of those three quite matches what's bugging me.

  Here's the half-formed bit I want you to sharpen. I've been calling it the transplant test, or the portability test: when someone offers a factor F as the answer to "why A rather than B?", make them specify the counterfactual transplant — F present in B's setting, or absent from A's, everything else about B held fixed — and then say what would have happened. If they can't do it without the specification quietly dissolving the unit being compared (you can't turn a vast composite empire into a small state inside a competitive states system while holding that unit fixed), then F isn't a difference-maker across the contrast; it's either a re-description of the outcome, or a signal that the units were cut at the wrong scale. My guess — the thing I want the proposal to actually test — is that if you run this audit across the usual list of candidate causes (coal and colonies; high wages and cheap energy; parliamentary constraint on the executive and secure property; war-driven fiscal capacity; the scientific-culture story; maybe the revisionist line that living standards on both sides were comparable surprisingly late) a lot of the leading explanations come out non-portable, and that what this shows isn't that the question is meaningless but that it's ill-scaled: it wants to be asked of regions — a Yangzi delta against an English one — rather than of civilisations. A second thought I had, which you should use or kill: the question might really be three questions with different well-posedness conditions — a selection question (why this one out of the pool of candidates?), a transformation question (why did this one change and the other not?), and an attribution question (why does the outcome have the shape it has?) — and maybe only the first of them is tractable once you widen the pool to the later industrialisers, which gets you more than one case.

  So write me the proposal — about 1000 words, short headed sections, the sort of thing a committee reads in four minutes. I need: the question stated precisely enough that it has a determinate answer (including pinning down the outcome variable — income per head, mechanised industry, or sustained technological change — and being honest that when the gap opened is itself part of what's contested); why the existing answers leave it open, where for each of the main stories you say which specific move blocks the transplant test rather than just saying the literature is divided; the method, month by month over nine months, and why that method rather than the obvious alternatives (another cross-country regression, or just doing archive work on one region); what the deliverable is for a historian who isn't a philosopher; what would count as the project failing; and what makes it too big for nine months. Don't give me citations or a bibliography — I'll fill those in — refer to positions by nickname instead. Also please actually confront the supervisor's "trivial or meaningless" objection and the n=1 objection rather than gesturing at them; if my portability idea collapses into something already done, say so in the proposal and say what the version that survives looks like.

  After the proposal, give me a single JSON object with this exact schema, so I can paste it into my planning notes:

  - "question": string, the sharpened question in one sentence
  - "readings": array of objects, one per question-type you keep (drop any you killed), each with keys "type" (selection / transformation / attribution, or your own relabel), "status" (one of "well-posed", "ill-posed", "ill-scaled", "tractable-only-if-revised"), and "why" (one sentence)
  - "portability_audit": array of objects, five or six rows, each with keys "factor" (short name of the candidate cause), "transplant" (the counterfactual transplant you'd demand, one sentence), "verdict" (one of "portable", "non-portable", "unclear"), "note" (one sentence on what the verdict shows)
  - "schedule": array of objects, one per block of months, keys "months", "task", "output"
  - "failure_conditions": array of strings, each a concrete state of the world in which I should conclude the project didn't work
  - "deliverable": string, what a non-philosopher historian gets out of it
  - "biggest_scope_risk": string
  - "strongest_objection": string, the best thing my supervisor could say
  - "confidence": integer 0–100, how much you'd bet the framing survives contact with the committee
