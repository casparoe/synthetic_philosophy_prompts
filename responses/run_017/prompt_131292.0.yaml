answer: |-
  ## Dissertation Fellowship Proposal: The Transplant Test - Diagnosing Causal Claims in the Great Divergence Debate

  **1. Core Question & Problem**
  Why did sustained, productivity-driven growth in *per capita* income (first measurable in Britain c. 1750-1800 and diverging significantly from major Eurasian cores like China's Lower Yangzi by c. 1830) occur *there* first, and not elsewhere? This project argues the dominant framing ("Why Britain, not China?") is fundamentally **ill-scaled**, leading to non-portable causal claims. It diagnoses this by subjecting leading explanations to a "transplant test": demanding proponents specify a viable counterfactual where the proposed factor (F) is moved (into "China" or out of "Britain"), holding the *unit* fixed, and predicting the outcome. Failure indicates F is either epiphenomenal or signals flawed unit selection.

  **2. Why Existing Answers Fail: The Transplant Audit**
  Current explanations typically collapse under the transplant test by requiring impossible unit transformations or becoming outcome-redescriptions:
  *   **"Coal & Colonies"**: Transplant: *Move abundant, accessible coal deposits to the Lower Yangzi c. 1700.* Verdict: **Non-portable**. The test dissolves: coal’s relevance depends on pre-existing energy demand (driven by institutions/capital) and transport infrastructure absent in the Yangzi context. Colonies’ revenue extraction presumes state capacity & financial markets unique to Europe.
  *   **"High Wages & Cheap Energy"**: Transplant: *Remove Britain’s relatively high wages (pre-1750) or make Yangzi energy cheaper.* Verdict: **Non-portable**. High wages in Britain were likely an *outcome* of prior institutional/economic shifts, not an independent driver. "Cheap energy" in Yangzi wouldn't trigger mechanization without simultaneous demand for labor-saving tech driven by factor prices *and* market incentives.
  *   **"Parliament & Property"**: Transplant: *Impose a British-style constrained executive and strong private property rights on Qing China.* Verdict: **Non-portable**. This requires dissolving the Qing imperial state structure – the very "unit" being compared. Property rights function within specific legal & political ecosystems; transplanting them piecemeal is incoherent.
  *   **"War-Driven Fiscal State"**: Transplant: *Remove Britain’s competitive-state-system-driven fiscal-military apparatus.* Verdict: **Unclear/Non-portable**. While impactful in Europe, transplanting this *out* of Britain might only delay, not prevent, growth if other factors (e.g., scientific culture, coal) were sufficient. Transplanting it *into* China dissolves the unit (a unified empire doesn't mimic a competitive states system).
  *   **"Scientific Culture"**: Transplant: *Move the Royal Society ethos and Newtonian synthesis to Jiangnan scholars.* Verdict: **Non-portable**. The "culture" was embedded in institutions (universities, societies), patronage structures, and a specific epistemological shift tied to European contexts. Its direct economic impact pre-1800 is also contested.
  *   **"Late Living Standard Parity" (Revisionist)**: Transplant: *Assume parity persists beyond 1750.* Verdict: **Irrelevant to Transplant**. This challenges the *timing* of divergence but doesn’t provide a causal F to transplant. It highlights the outcome variable contestation but fails the test by not offering a portable driver.

  **3. Rescaling the Question: Regions, Not Civilizations**
  The consistent failure of the transplant test across factors points not to meaninglessness, but **mis-specification of the comparative unit**. Civilizations (Britain/China) are vast, internally heterogeneous composites. The salient unit for early industrialization is the *core economic region* (e.g., England vs. Lower Yangzi Delta). Factors like specific factor price ratios, proto-industrial networks, or local institutional adaptations *might* be portable *across comparable regional economies* (e.g., England vs. Netherlands, or Yangzi vs. Kansai), making causal claims testable. Asking "Why England’s region, not Yangzi’s?" rescales the question to where portable factors could plausibly exist.

  **4. Tripartite Question Typology: Separating Puzzles**
  The ill-posed "Why Britain/China?" question conflates distinct issues:
  *   **Selection**: Why was *this specific region* (England) the first from the pool of potential candidates (NW Europe cores, Yangzi, Kansai) to achieve take-off? (*Potentially tractable* by widening the pool to include early followers like Belgium/Rhineland, increasing n).
  *   **Transformation**: Why did this specific region undergo a *sustained productivity revolution* when otherwise comparable regions (e.g., Yangzi) did not *at that time*? (*Ill-scaled* if asked of civilizations; *tractable-only-if-revised* to regional comparison with careful counterfactuals).
  *   **Attribution**: Why did the Industrial Revolution manifest with its *specific technological and organizational characteristics* (e.g., steam, factories)? (*Ill-posed* for the divergence itself – the characteristics are path-dependent outcomes of the British context; relevant for *how* it happened there, not *why* it happened there first).

  **5. Methodology: A Conceptual & Comparative Audit (9 Months)**
  *   **Months 1-2: Factor Inventory & Test Specification:** Systematically catalog major proposed factors (F) from key historiographical schools ("Coal/Colonies", "Institutional", "Revisionist", "Cultural"). For each, rigorously define the precise counterfactual transplant demanded by the test for both the "Britain" and "China" units. *Output: Transplant Test Protocol & Factor Matrix.*
  *   **Months 3-4: Literature Audit & Verdict Logging:** Apply the transplant test to each F using secondary literature. Document (1) the attempted counterfactual specification, (2) the reason for failure/success (unit dissolution? outcome redescription?), (3) verdict (Portable/Non-portable/Unclear). *Output: Annotated Audit Log.*
  *   **Month 5: Unit Rescaling Analysis:** Analyze the audit log to identify patterns of failure. Develop the argument for regional rescaling using comparative data on key regional economies (England, Yangzi, Netherlands, N. Italy, Kansai) pre-1750. *Output: Rescaling Framework Paper Draft.*
  *   **Month 6: Question Typology Refinement:** Formalize the tripartite distinction (Selection/Transformation/Attribution). Map which factors might be viable for which question type under rescaling. *Output: Typology Schema.*
  *   **Month 7: Case Study Scoping (Selection Question):** Identify 2-3 regional pairs (e.g., England/Netherlands c. 1700; England/Belgium c. 1800) suitable for piloting the "Selection" question with portable factors. *Output: Case Study Design Brief.*
  *   **Month 8: Confronting N=1 & Triviality:** Synthesize findings to directly address core objections: How rescaling + typology + widening the pool mitigates n=1; why "coal/colonies" is non-portable hence non-trivial. *Output: Objections Response Memo.*
  *   **Month 9: Synthesis & Proposal Writing:** Integrate audit results, rescaling argument, typology, and objection rebuttals into a cohesive historiographical critique and revised framework. Draft dissertation chapter. *Output: Fellowship Final Report & Dissertation Chapter Outline.*

  *Why not alternatives?* Cross-country regressions assume portable, measurable variables – precisely what this project challenges. Deep archive work on one region is premature before establishing *which* regions and factors warrant comparison. This project provides the necessary conceptual scaffolding.

  **6. Deliverable (For Historians)**
  A clear diagnostic toolkit enabling historians to: 1) **Identify flawed causal claims** in divergence debates by spotting non-portable factors or ill-scaled units; 2) **Reframe research questions** towards tractable comparisons (e.g., regional selection); 3) **Construct more robust counterfactuals** by specifying viable transplants; 4) **Navigate the n=1 problem** by strategically widening the case pool for specific question types.

  **7. What Counts as Failure?**
  *   The transplant test consistently fails to discriminate between factors (all/none are portable/unportable for the same reason).
  *   Rescaling to regions provides no analytical advantage; factors remain non-portable or unit dissolution persists at this level.
  *   The tripartite typology proves irrelevant or fails to clarify which aspects of the divergence question are tractable.
  *   Widening the pool for the "Selection" question yields no meaningful comparative leverage (all candidate regions are equally "likely" or too dissimilar).

  **8. Biggest Scope Risk**
  Defining and defending a rigorous, non-arbitrary methodology for specifying the "holding fixed" condition in the counterfactual transplants across vastly different contexts. Avoiding ad-hoc justifications for why some contextual features can be held fixed while others (deemed essential to the unit) cannot is the core philosophical and practical challenge.

  **9. Confronting "Trivial or Meaningless" & "n=1"**
  *   **Trivial?** If "coal/colonies" were trivially sufficient, the transplant test would hold: adding coal/colonies to Yangzi *should* predictably trigger British-style growth. The test shows this fails – coal/colonies were necessary *only within* a specific, non-portable institutional and economic context. Their insufficiency elsewhere makes the explanation non-trivial but also inadequate.
  *   **Meaningless / n=1?** The singularity (n=1) of *the event* is real. However, the question "Why *this* unit first?" isn't meaningless if we: (1) *Reject* that "Britain" vs. "China" are the correct units (rescaling to regions), and (2) *Separate* the "Selection" question (why this region *first* from a pool) from the "Transformation" question (why did *this* region undergo *this* change). Selection *becomes tractable* by examining later industrializers (Belgium, Germany, US Northeast, Japan), increasing n for "first mover among potential leaders." While the *global* transformation remains singular, the *regional* selection mechanism is comparable. The project shows the standard question is meaningless *as posed*, but meaningful components exist when reframed.

  ---

