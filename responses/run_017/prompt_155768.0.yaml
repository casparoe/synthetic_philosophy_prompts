prompt: |-
  I assess habitat-loss applications for a regional planning authority — around sixty a year, mostly conversion of rough grassland, scrub and wetland to housing, solar arrays and intensive agriculture. Most are decided at officer level, but any application with a contested animal-welfare assessment goes to committee. The remit was recently widened: alongside biodiversity, we must now record the expected effect of the loss on the animals themselves. I have half a day per application, a desk study plus one site visit, no population modelling, and two pages to fill in.

  Please write me a decision procedure my team can run on a proposal to determine whether the net welfare effect of the conversion is positive, negative, or genuinely indeterminate, and — where it is one or the other — roughly how large. Give the questions in the order I should ask them, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to the committee because the remaining question is one of values rather than facts. In particular it has to settle how I handle these:

  whether to count only the animals alive on the site when the decision is made, or also the animals whose births the conversion prevents, given that most of the welfare effect of habitat loss seems to run through births rather than deaths;
  what accounting horizon to close the books at, since effects on future population size compound without limit, together with whatever justifies that horizon rather than a longer or shorter one;
  whether the typical life of the animals concerned is one worth living or not, and what I do when the evidence does not settle this;
  the deaths caused by clearance itself and the fate of animals displaced into territories already occupied by others;
  which animals are in the account at all, given that my team counts vertebrates and decapods but not the invertebrates that often make up most of the animal biomass on a site.

  Then run it on three applications: draining thirty hectares of wet grassland supporting a large breeding population of common toads and field voles for distribution sheds; clearing ten hectares of mature scrub for a solar farm, where a small, stable population of a long-lived territorial bird is at carrying capacity and clearance will kill some adults; and a proposal to restore sixty hectares of improved pasture to wet woodland, which everyone in my team expects to approve. The procedure should tell me where it cannot produce a signed number at all, and be honest about which steps are judgement dressed up as method. Please write in British English.
reasoning: |-
  Okay, I need to help this user who assesses habitat-loss applications for a regional planning authority. They handle about sixty applications yearly, converting rough grassland, scrub, and wetland to housing, solar arrays, or intensive agriculture. The key change is that now, alongside biodiversity, they must evaluate the net welfare effect on animals themselves. They have limited time—half a day per application—and constraints like desk study plus one site visit, no population modeling, and a two-page report. 

  The user wants a decision procedure to determine if the net welfare effect is positive, negative, or indeterminate, and roughly how large. I must address specific challenges: whether to count existing animals or also potential births, what accounting horizon to use, how to handle uncertainty about whether animal lives are worth living, the deaths from clearance and displacement, and which animals to include in the assessment.

  First, I should build a step-by-step procedure that's practical within their time limits. It needs to be sequential, stopping early if a clear negative is found, and handing off to committee when value judgments are needed. For the tricky parts: I'll prioritize counting existing animals and prevented births because welfare effects often come from lost future lives. For the horizon, I'll suggest 25 years as a compromise—long enough to cover generational impacts but short enough to avoid infinite compounding and align with planning cycles. If evidence doesn't settle if lives are worth living, I'll default to "worth living" for wild animals but flag uncertainty. For clearance deaths and displacement, I'll account for immediate suffering and long-term fitness loss. And only include vertebrates and decapods, as per their remit, excluding invertebrates.

  Now, for the applications: I'll apply the procedure to three scenarios. For the wet grassland draining, it'll likely show a large negative due to high-density species and displacement risks. The scrub clearance for solar should also be negative but smaller, with committee input needed for value judgments. The pasture restoration to woodland should be positive, as it creates new habitats with likely better welfare.

  I'm structuring the response in British English, with clear steps and justifications. I'll be honest about where judgments are disguised as method, especially in steps involving welfare assumptions or horizon choices. Finally, I'll ensure the procedure outputs a signed assessment or flags indeterminacy, keeping it concise for their two-page limit.
answer: |-
  Below is a pragmatic, tiered decision procedure designed for your operational constraints (half-day assessment, desk/site, no modelling, 2-page output). It prioritises tractability and defensibility, explicitly flags value judgments for committee referral, and addresses your specific concerns.

  **Decision Procedure: Net Animal Welfare Impact Assessment (NAWIA)**

  **Core Principles:**
  1.  **Scope:** Vertebrates & decapods only (per remit).
  2.  **Counting:** Include **both animals present at decision time AND animals whose births are prevented** (as welfare loss is primarily through lost future positive experiences). Treat prevented births as welfare units lost.
  3.  **Horizon:** **25 years.** Justification: Balances practical forecasting (planning cycles, habitat succession) with capturing significant generational turnover for most species. Beyond this, uncertainty compounds excessively & welfare discounting becomes highly contentious (value judgment). Acknowledge this is arbitrary but necessary.
  4.  **Life Worth Living (LWL) Assumption:** Wild animals in stable populations are assumed to have lives **net worth living** unless *strong, species-specific evidence* indicates otherwise (e.g., high chronic disease prevalence, severe inbreeding depression documented). If evidence is ambiguous, proceed with "LWL assumed".
  5.  **Displacement & Clearance Deaths:** Explicitly account for welfare harms: suffering/death during clearance & reduced fitness/increased suffering for displaced individuals struggling in suboptimal habitat.
  6.  **Indeterminacy:** Acknowledge when key parameters are unknown or welfare assumptions are too uncertain.
  7.  **Committee Referral:** Flag steps involving major *value* judgments (e.g., weighting suffering vs. prevented positive lives, extreme horizon choices) or highly contested welfare assumptions.

  **Procedure Flow (Sequential Questions):**

  1.  **Is the proposal a *restoration* of semi-natural habitat?** (e.g., pasture to woodland)
      *   **Sufficient Answer:** Yes / No.
      *   **If YES:** Proceed to Step 7 (Presumptive Positive). *Rationale: Restoration generally creates higher welfare potential.*
      *   **If NO:** Proceed to Step 2.

  2.  **What is the *dominant vertebrate/decapod assemblage* and its approximate current density?** (Desk study, site visit)
      *   **Sufficient Answer:** Identify 1-3 key species/groups & estimate density (e.g., "High: >50 common toads/ha", "Low: 1-2 bird territories/10ha", "Moderate: Field vole signs widespread").
      *   **If NO vertebrates/decapods reliably detected:** Net Welfare Effect = **Neutral (Zero)**. STOP. *Rationale: Scope limits assessment.*
      *   **Otherwise:** Proceed to Step 3.

  3.  **Does the clearance method involve *high suffering/death* for residents?** (e.g., crushing, drowning, prolonged exposure vs. rapid culling/encouraged dispersal)
      *   **Sufficient Answer:** High / Moderate / Low / Negligible suffering expected. Based on method, species vulnerability, timing (breeding/non-breeding).
      *   **If HIGH suffering expected:** Flag significant **immediate negative welfare impact**. Proceed to Step 4.
      *   **Otherwise:** Proceed to Step 4.

  4.  **Is *suitable, unoccupied habitat* readily available nearby for displaced individuals?**
      *   **Sufficient Answer:** Yes (abundant similar habitat <1 territory diameter/km) / Limited (some habitat, likely competition) / No (highly fragmented, saturated).
      *   **If NO:** Flag significant **medium-term negative welfare impact** (displacement stress, competition, starvation, predation). Proceed to Step 5.
      *   **If LIMITED:** Flag **moderate negative welfare impact** from displacement. Proceed to Step 5.
      *   **If YES:** Displacement impact likely **Low/Negligible**. Proceed to Step 5.

  5.  **What is the *expected net change in long-term carrying capacity* (LCC) for key species over 25 years?** (Consider habitat quality/area loss vs. mitigation/offset gains)
      *   **Sufficient Answer:** Large Decrease (>50% LCC loss) / Moderate Decrease (20-50%) / Small Change (±<20%) / Moderate Increase / Large Increase. *Judgment based on habitat mapping, species requirements, mitigation plans.*
      *   **If MODERATE or LARGE INCREASE:** Proceed to Step 7 (Presumptive Positive).
      *   **If SMALL CHANGE:** Proceed to Step 6.
      *   **If MODERATE or LARGE DECREASE:** Proceed to Step 6.

  6.  **For key species facing LCC decrease (Step 5): Is there *strong evidence* their lives are *not worth living* (NWL)?**
      *   **Sufficient Answer:** Yes (e.g., endemic disease causing chronic suffering) / No / Ambiguous.
      *   **If YES (strong NWL evidence):** Preventing births = **Welfare Gain**. *This is rare.* Combine with impacts from Steps 3 & 4. Proceed to Step 8.
      *   **If NO or AMBIGUOUS (LWL assumed):** Preventing births = **Major Welfare Loss** (primary impact). Combine with impacts from Steps 3 & 4. Proceed to Step 8.

  7.  **For restoration/increases (Steps 1 or 5): Is the *new habitat likely to support higher welfare* than the old?** (e.g., complex woodland vs. simple pasture)
      *   **Sufficient Answer:** Likely Higher / Similar / Likely Lower (rare for restorations). *Judgment based on species needs, habitat complexity, known stressors.*
      *   **If LIKELY HIGHER:** Flag **significant positive welfare potential** (from future inhabitants). Proceed to Step 8.
      *   **If SIMILAR:** Net effect primarily through scale of LCC increase (Step 5). Proceed to Step 8.
      *   **If LIKELY LOWER:** *Contradiction - re-evaluate Steps 1/5 or flag uncertainty.* Proceed to Step 8.

  8.  **Synthesise & Quantify (Rough Scale):**
      *   Combine the flagged impacts:
          *   **Large Negative:** Major LCC decrease (Step 5) + High clearance suffering (Step 3) + Poor displacement outcome (Step 4) + LWL assumed (Step 6).
          *   **Moderate Negative:** Mod LCC decrease OR High clearance suffering + Poor displacement OR Mod decrease + Mod suffering/displacement.
          *   **Small Negative:** Small LCC decrease OR Mod/Low suffering/displacement.
          *   **Neutral:** Small LCC change + Negligible suffering/displacement OR Restoration with similar welfare potential.
          *   **Small Positive:** Small LCC increase OR Restoration with likely higher welfare (minor scale).
          *   **Moderate Positive:** Mod LCC increase OR Restoration with likely higher welfare (clear scale).
          *   **Large Positive:** Large LCC increase + Restoration with higher welfare potential.
      *   **Indeterminate If:**
          *   Strong NWL claim contested/inconclusive (Step 6).
          *   LCC change highly uncertain (Step 5).
          *   Welfare comparison of habitats is highly contested (Step 7).
          *   Scale of suffering/displacement vs. prevented births involves irreducible value conflict (e.g., many painful deaths vs. many prevented good lives).
      *   **Committee Referral Required If:**
          *   Step 6 (NWL claim) is central and highly contested.
          *   The chosen 25-year horizon is fundamentally challenged as inappropriate *for welfare reasons*.
          *   Synthesis (Step 8) reveals a close call hinging on weighting severe suffering vs. large numbers of prevented positive lives (core value judgment).
          *   A "Large" impact rating is assigned and contested.

  **Application to Case Studies:**

  1.  **Draining 30ha Wet Grassland (Toads/Voles) for Sheds:**
      *   Step 1: No (Loss).
      *   Step 2: Key species: Common Toad (High density, breeding pop), Field Vole (High density). Proceed.
      *   Step 3: Drainage likely causes **High suffering/death** (drowning, crushing, desiccation for amphibians; disruption/fragmentation for voles).
      *   Step 4: **Limited/Negligible** suitable habitat nearby (wet grassland fragmented, unlikely unoccupied patches). **Moderate/Large negative impact** (displacement stress, high mortality).
      *   Step 5: Habitat loss total, mitigation unlikely equivalent. **Large Decrease** in LCC for both key species.
      *   Step 6: No evidence for NWL. LWL assumed. **Major Welfare Loss** from prevented births dominates.
      *   Step 8: **Synthesis:** Large LCC Decrease (Prevented Births Loss) + High Clearance Suffering + Large Displacement Impact = **LARGE NEGATIVE** net welfare effect.

  2.  **Clearing 10ha Mature Scrub for Solar Farm (Long-lived Territorial Birds at K):**
      *   Step 1: No (Loss).
      *   Step 2: Key species: Long-lived Territorial Bird (e.g., Dartford Warbler). **Low density** (stable, at K ~ 2-3 territories/10ha?).
      *   Step 3: Clearance methods vary. Likely **Moderate suffering/death** (some adult mortality probable, nest destruction if timing wrong, stress).
      *   Step 4: **Limited** suitable habitat (mature scrub often patchy, territories defended). Displacement stress/mortality likely. **Moderate negative impact**.
      *   Step 5: Loss of 10ha prime habitat. Species slow-reproducing, territorial. **Moderate Decrease** in local/regional LCC (loss of several territories long-term).
      *   Step 6: No evidence for NWL. LWL assumed. **Moderate Welfare Loss** from prevented future lives.
      *   Step 8: **Synthesis:** Moderate LCC Decrease (Prevented Births Loss) + Moderate Clearance Suffering + Moderate Displacement Impact = **MODERATE NEGATIVE**.
      *   **Committee Referral?** *Potentially.* If stakeholders strongly contest the LWL assumption for this species, or argue the suffering/death of existing adults outweighs the prevented births (value judgment on weighting), refer. Otherwise, officer decision.

  3.  **Restoring 60ha Pasture to Wet Woodland:**
      *   Step 1: **YES.** Proceed to Step 7.
      *   Step 7: Pasture (improved grassland) typically supports low vertebrate diversity/density (earthworms excluded). Wet woodland offers complex structure, varied niches. **Likely Higher Welfare** potential for amphibians (frogs, newts), birds (warblers, woodpeckers), mammals (bats, shrews), possibly decapods (crayfish if wetlands). **Significant positive welfare potential**.
      *   Step 8: **Synthesis:** Large LCC Increase (from low pasture baseline) + Higher Welfare Potential = **LARGE POSITIVE** net welfare effect. (No significant clearance suffering/displacement expected from low-density pasture fauna, or mitigated).

  **Honesty about Judgement:**

  *   **Judgement Dressed as Method:** Steps 5 (LCC change estimate), 6 (LWL assumption default), and 7 (welfare potential comparison) are inherently judgmental, informed by evidence but not purely objective. The 25-year horizon is a necessary but arbitrary policy choice. The rough scale quantification (Step 8) is inherently subjective, though structured.
  *   **Transparent Method:** The *sequence* forces consideration of key welfare components. The scope, counting principle (include prevented births), and explicit flags for suffering, displacement, and indeterminacy/committee referral provide structure and auditability. Distinguishing between uncertainty (indeterminate) and value conflicts (committee) is crucial.

  This procedure provides a defensible, efficient framework for your team. It explicitly addresses your core dilemmas within operational limits, prioritises animal welfare components, and clearly signposts when decisions require political or ethical input via committee. Remember to document the reasoning concisely at each step within the 2-page limit.
