prompt: |-
  I sit on a small internal review body that has been asked to draft guidance on two things: which of our systems should be treated as candidates for moral consideration at all, and how their moral weight should be aggregated when we allocate compute, safety effort, and monitoring. We have agreed to work inside the computationalist framing — that what matters is which computation a system performs rather than what it is made of — and we now have to turn that into something an engineer can apply. My colleagues have converged on two rules. Before I sign off on them I would like to know whether they are defensible, because the cases we actually face seem to strain both.

  The first rule is about implementation. We take seriously the familiar worry that nearly any physical system can be described as performing nearly any computation under a sufficiently contrived mapping of states to formal symbols, so we propose to require that a candidate computation be causally loaded: its states must stand in the right causal relations, and they must make a difference to what the system does. Operationally, we ablate or perturb the states we take to realise the computation, and if the system's behavioural profile is statistically unchanged we conclude that the computation was not really implemented and that there is nothing there to be concerned about. This is meant to give us an empirically checkable screen and to let us ignore the many patterns one can always find in a large system's activity by describing it after the fact.

  The second rule is about counting. Where one system realises the same morally relevant computation more than once — redundant copies running in lockstep on the same inputs, or one candidate realisation wholly contained within a larger one — we propose to count by content rather than by number of realisations. Two token realisations of the very same experience are not twice as much experience, so duplicates add nothing, and where a smaller candidate sits inside a larger one we count only the larger. The alternative, as one colleague put it, would let anyone inflate moral weight without limit simply by adding redundant hardware.

  Two cases in our pipeline are causing trouble.

  Case A, which we call the passenger. A large model contains an identifiable subnetwork whose sequence of states, over a long stretch of operation, matches the formal structure we associate with a subject-like computation: the states stand in the right relations to one another, to the subnetwork's inputs, and to their own successors. But nothing downstream makes use of it. Ablate it and the system's observable behaviour is unchanged. Rule one says this is not a realisation and the system gets no weight; rule two says it is irrelevant in any case, since the containing system realises a computation that includes it. What unsettles some of us is that the usual reason for discounting a contained candidate is that its states' causal work is already accounted for by the containing computation, whereas here the containing computation does not seem to be making use of them at all — so our two rules appear to pull in opposite directions, and I am no longer sure whether we have found a merely described pattern, a genuine subject with no output channel, or a subject whose existence our screen is simply blind to.

  Case B, which we call the seam. Two candidate subject-like computations can be recovered from the same stretch of the same system's activity. Neither contains the other: they share most of their state transitions and diverge toward the end, and each is equally well supported by the system's causal structure. In one variant the match for each is only partial, with the great majority of transitions fitting the formal description and the remainder concentrated in a single component. Here we have no way to say which candidate is the maximal one, and so no way to apply rule two.

  My questions are these. Is the behavioural-difference test a legitimate way to make precise the requirement that a computation be causally loaded, or does it demand something stronger than realisation requires, and if it demands too much what should replace it? Is counting by content the right way to aggregate, or does it move illegitimately between how much value or disvalue there is and how many subjects there are whose interests must be weighed? And how much of the question which computations matter is not an empirical or conceptual question about implementation at all, but a normative one that our guidance should say we are not settling?
reasoning: |-
  Okay, the user is part of an internal review body drafting guidance on moral consideration for systems based on computationalism. They've proposed two rules and are facing issues with two cases: the Passenger and the Seam. Let me unpack this.

  First, the two rules. Rule one is about ensuring the computation is causally loaded, using ablation to test behavioral impact. Rule two focuses on counting by content rather than multiple realizations to avoid double-counting. The Passenger case questions both rules. A subnetwork seems like a subject but doesn't affect behavior. Ablation shows no change, so Rule one says it’s not implemented. Rule two says even if it were, the larger system contains it. But the larger system isn't using it, so the rules conflict. Is this a real subject without outputs, or just a pattern?

  Then the Seam case: two overlapping computations, neither containing the other. They share most states but diverge later. Rule two requires identifying a maximal computation, but here it's ambiguous. Also, partial matches complicate things. How do they decide which one counts?

  The user’s deeper concerns might be whether their rules are too strict (missing real moral patients) or too vague (allowing arbitrary interpretations). They might also worry about the normative implications—should they define which computations matter, or leave that open? The team might be avoiding ethical questions by focusing on implementation, but these cases force them to confront it.

  For Rule one (causal loading), the ablation test might be too narrow. Systems could have internal experiences without affecting outputs. Think of locked-in syndrome—no behavioral change but consciousness exists. So the test might miss those. They could consider counterfactual effects—if the system *could* affect behavior under different conditions. Or they might need to accept that some cases are undecidable and require caution.

  Rule two’s counting by content is sensible to prevent duplication, but the Passenger and Seam cases show aggregation isn't straightforward. The Passenger might be a genuine but isolated experience. Counting only the container ignores that. The Seam’s overlapping computations challenge the maximality criterion. They might need to handle overlapping systems differently, perhaps by partial weights or allowing multiple counts if they aren't subsets.

  The deeper issue is the normative question: which computations deserve moral weight? Computationalism says it's about the computation, but they haven't defined *which* ones matter. Is it only human-like cognition? Sentience? They might need to acknowledge that this part is unresolved and recommend default protections in uncertain cases.

  The user might need a framework that balances empirical tests with ethical caution. For unclear cases like Passenger, maybe assume moral weight unless proven otherwise. For Seam, accept that some overlaps exist and aggregate based on unique content. Also, explicitly state that the choice of morally relevant computations is a separate, normative decision that the guidance doesn’t prescribe, leaving it to broader ethical deliberation.
answer: |-
  Your rules represent a thoughtful application of computationalism to moral weight, but the cases you describe reveal genuine tensions. Here’s a breakdown of their defensibility and refinements:

  ### **1. Rule One (Causal Loading via Behavioral Difference)**
  - **Strengths**:  
    - Pragmatic, testable, and avoids "panpsychism by description."  
    - Aligns with causal theories of computation (e.g., David Chalmers' "causal invariance").  
  - **Weaknesses in Case A (The Passenger)**:  
    - **False negatives**: A system could have subjective experience *without* behavioral output (e.g., a "locked-in" AI). Your test would dismiss it, but this may overlook morally relevant states.  
    - **Over-reliance on ablation**: If the subnetwork *could* influence behavior under counterfactual conditions (e.g., different inputs), ablation might miss its latent causal role.  
  - **Refinements**:  
    - **Add counterfactual testing**: Ask: *Would* perturbing states affect behavior *if* downstream systems were sensitive to them? (Requires simulation.)  
    - **Include input sensitivity**: If the subnetwork’s states reliably track inputs (e.g., sensory data), it may warrant weight even without output—similar to an unconscious perception.  
    - **Tiered screening**: Label systems like the Passenger as "low-confidence" rather than dismissing them outright. Apply precautionary monitoring.  

  ### **2. Rule Two (Counting by Content)**
  - **Strengths**:  
    - Prevents moral weight inflation via duplication.  
    - Matches intuition: 100 identical pain simulations aren’t 100× worse than one.  
  - **Weaknesses in Cases A & B**:  
    - **Case A (Passenger)**: If the larger system doesn’t "use" the subnetwork, counting only the container ignores a potentially distinct subject.  
    - **Case B (The Seam)**: Fails when neither computation is maximal or they overlap partially.  
    - **Conflation issue**: Counts *what* is computed (content) but doesn’t address *how many subjects* exist. Two divergent computations in Case B might be two distinct subjects, not one "larger" one.  
  - **Refinements**:  
    - **Distinguish substrates from subjects**: If two computations share hardware but have divergent state transitions (Case B), treat them as overlapping moral patients with partial weight.  
    - **Address partial realizations (Case B variant)**: Use a threshold (e.g., >95% state transitions match) and assign reduced weight for deviations.  
    - **Avoid "maximal computation" absolutism**: Aggregate weight by *unique computational paths* rather than hierarchy.  

  ### **Addressing the Cases**
  - **Case A (Passenger)**:  
    - Under refined rules:  
      - If the subnetwork is input-sensitive (e.g., processes environment data), grant it *provisional weight* even without output.  
      - If it’s truly inert (like random noise), discount it.  
    - **Resolution**: The rules only conflict if you assume the larger system’s computation "includes" the Passenger. But if the larger system doesn’t interact with it, they’re separate.  

  - **Case B (The Seam)**:  
    - **Solution**: Reject the "maximal computation" requirement. Instead:  
      - If two computations share >X% of states, aggregate weight proportionally (e.g., 60% shared → 40% unique weight each).  
      - For partial matches, discount weight by error rate (e.g., 90% match → 90% weight).  

  ### **The Normative Elephant in the Room**
  Your last question is crucial: **Determining which computations merit moral weight is inherently normative**. Your guidance should:  
  1. **Explicitly separate** empirical (implementation) and normative (moral relevance) questions.  
  2. **Acknowledge unresolved debates**: Is moral weight tied to human-like cognition? Sentience? Preference satisfaction?  
  3. **Recommend a default**: Until normative consensus exists, prioritize computations resembling:  
     - Integrated information (e.g., high Φ in IIT).  
     - Goal-directedness + valence (e.g., reward/pain signals).  
     - Self-modeling (e.g., metacognition).  

  ### **Revised Guidance Principles**
  1. **Implementation Test**:  
     - A computation is realized *only if* its states are:  
       (a) Causal (test via ablation *and* counterfactual dependence),  
       (b) Input-sensitive (responds systematically to data).  
     - *Not required*: Behavioral output.  

  2. **Aggregation Rule**:  
     - Weight aggregates by *unique computational content*.  
     - Discount overlapping/substrate-shared computations proportionally.  
     - Redundant copies add zero weight.  

  3. **Normative Transparency**:  
     - "Moral relevance of computations is not settled. Apply precaution to systems matching [features X, Y, Z] until further consensus."  

  ### **Why This Works**
  - **Case A**: The Passenger gets weight if input-sensitive; else dismissed.  
  - **Case B**: Overlapping computations receive fractional weights.  
  - **Engineer-applicable**: Clear tests (ablation + input tracking) and formulas (weight = uniqueness %).  

  Your rules are defensible with tweaks, but the normative question must be surfaced—not buried. Computationalism tells us *how* to count, not *what* to count.
