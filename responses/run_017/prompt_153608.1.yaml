prompt: |-
  Hey — you're a philosopher of history who's also spent time around working historians, so take this seriously: brainstorm the failure modes of after-the-fact explanation for a bit before you write anything down, then commit to a list.

  I'm a historiography PhD student and I want the desiderata, not a survey. Specifically: what does a method for explaining why *this* outcome rather than *that* one happened have to deliver, given that the historian always writes after the fact and almost always knows how it ends. Fix the purpose as: an account good enough both to underwrite a monograph on a single causal sequence and to be handed to someone who doesn't know the ending yet — a forecaster, an intelligence analyst, a policy person — as usable advice.

  Give me the requirements with the case or consideration behind each, and mark which are non-negotiable and which are just the taste of one camp. Here's what I keep circling; tell me which of these are genuine desiderata, which are prejudice, and add the ones I'm missing:

  - ex-ante legibility: every factor the explanation leans on must have been identifiable by a well-informed contemporary working only from pre-outcome evidence. Doesn't this just ban all the hindsight-enabled causal selection that is where history's actual insight lives?
  - the near-miss test: the explanation has to make the losing outcome genuinely live, and must not explain the opposite outcome equally well when you swap in the counterfactual.
  - source contamination: the archive, memory, and the secondary literature are themselves outcome-shaped, so any test of the explanation is run on contaminated evidence.
  - closure versus contingency: narrative emplotment that a reader can follow, versus faithfulness to the mess, dead ends, and near-misses that went nowhere.
  - diachronic stability: an explanation shouldn't have to be rewritten every time later events make a new description of the earlier event true (the "beginning of the X" problem — sentences that describe an event by its consequences).
  - resistance to judged-probability inflation: the explanation shouldn't inherit the fact that knowing an outcome makes it look like it had to happen.

  Then flag any pair you think can't be jointly satisfied — I suspect ex-ante legibility versus hindsight-enabled causal selection is the big one, and possibly closure versus contingency — and say which single requirement excludes the most accounts people actually defend. Very short scorecard at the end, two lines each, for covering-law style accounts, counterfactual-dependence accounts, and narrative/process-tracing accounts; keep the weight on the criteria, not the scoring.
reasoning: |-
  Okay, let me tackle this user's query step by step. The user is a historiography PhD student asking for the core requirements of a historical explanation method that can both support academic monographs and provide actionable insights for forecasting. They've listed some initial ideas and want my critique and additions.

  First, I need to unpack their bullet points. The "ex-ante legibility" criterion seems tricky because it conflicts with how historians actually use hindsight to select relevant causes. Banning that would strip away much of history's value. Then there's the "near-miss test" - this feels crucial for showing why alternatives failed, but I wonder if it's achievable in practice given source contamination issues. 

  The "source contamination" problem is particularly sticky. Archives are inherently shaped by outcomes, making any verification biased. For "closure vs contingency," I recognize this tension between readable narratives and messy realities - both matter but pull in opposite directions. "Diachronic stability" resonates as a real problem when events get redefined by later consequences. And "judged-probability inflation" is that classic hindsight bias where outcomes seem inevitable.

  I should add some missing criteria. "Mechanism fidelity" comes to mind - explaining not just that A led to B, but how. Also "temporal sensitivity" to handle the timing of causes, and "scale articulation" to bridge individual actions with structural forces. Plus "explanatory sufficiency" - does the account actually distinguish the real outcome from alternatives?

  Now for the conflicts... Ex-ante legibility versus hindsight insight is the big one. You can't have both - historians need that retrospective lens. Closure and contingency also clash inherently; satisfying both fully might be impossible. Among all criteria, I think source contamination is the most fundamentally limiting because it poisons the well of evidence itself.

  For the scorecard at the end, I'll need to quickly evaluate the three major approaches. Covering-law models fail almost everything except diachronic stability. Counterfactual dependence handles near-misses well but stumbles on legibility and source issues. Narrative methods excel at closure and mechanism but often sacrifice contingency.

  The user seems frustrated with theoretical purity that ignores practical historiography. They want something usable in real research. I should emphasize that while some criteria are non-negotiable (like mechanism fidelity), others involve tradeoffs historians constantly navigate.
answer: |-
  Here's the breakdown of desiderata for post-hoc historical explanation, based on philosophical rigor and historian practice, targeting your purpose of **usable causal accounts for both monographs and forward-looking advice**.

  **Non-Negotiable Core Desiderata:**

  1.  **Mechanism Fidelity:** *The explanation must specify the causal mechanisms linking causes to the outcome, not just correlations or sequences.*
      *   *Why:* Without mechanisms, you have description, not explanation. It's useless for forecasting ("why X happened" doesn't tell you "how Y might happen"). Monographs require showing *how* change occurred, not just *that* it did. (Case: Explaining the French Revolution requires more than listing grievances; it needs the mechanism of state fiscal collapse triggering elite defection and popular mobilization).
  2.  **Explanatory Sufficiency:** *The explanation must demonstrate why *this* outcome occurred rather than plausible alternatives (the near-miss), given the antecedent conditions.*
      *   *Why:* This directly addresses the "Why this, not that?" question. If the same explanation "fits" the counterfactual outcome, it fails. (Case: An explanation for the Allies winning WWII that doesn't show why Axis victories (e.g., at Midway, Stalingrad) didn't lead to their overall win is insufficient).
  3.  **Resistance to Judged-Probability Inflation (Anti-Hindsight Bias):** *The explanation must actively counteract the cognitive bias that the outcome was inevitable.*
      *   *Why:* This is the core epistemic challenge of post-hoc analysis. Failing here renders the explanation useless for forecasting, as it misrepresents the uncertainty contemporaries faced. (Case: Treating the fall of the Berlin Wall in 1989 as obviously inevitable ignores the genuine contingency perceived in 1988).

  **Essential, But Require Nuance/Tradeoffs:**

  4.  **The Near-Miss Test (Operationalized):** *The explanation must make the losing alternatives genuinely plausible *within the constraints of the explanation itself* and show the specific factors/events that tipped the balance.*
      *   *Why:* Essential for contingency and sufficiency. However, absolute symmetry ("explains the opposite equally well") is too strong; the point is to show *why symmetry was broken*. (Case: A good explanation of the Cuban Missile Crisis resolution shows why war was a *real* possibility (near-miss) but pinpoints Kennedy's blockade/Khrushchev's perception of escalation risk as tipping points).
  5.  **Source Contamination Awareness:** *The explanation must explicitly acknowledge and account for how the historical record (sources, memory, historiography) is shaped by the outcome.*
      *   *Why:* Ignoring this guarantees bias. The method *must* include strategies for mitigating it (e.g., seeking "losers'" sources, pre-outcome documents, analyzing historiographical shifts), even if perfect elimination is impossible. (Case: Analyzing the causes of the US Civil War requires grappling with the "Lost Cause" narrative deeply embedded in sources and early historiography).
  6.  **Diachronic Stability (Contextual):** *The explanation should rely primarily on factors whose significance and description are not *fundamentally altered* by subsequent events. Significance can evolve, but core causal claims shouldn't hinge solely on later outcomes.*
      *   *Why:* Explanations that only work because we know what came later are tautological and useless for contemporaries/forecasters. (Case: Calling 1914 "the beginning of the decline of Europe" relies on 1945; a stable explanation uses factors identifiable in 1914 (militarism, alliances, nationalism) even if their *long-term* consequences weren't fully clear).

  **Camp-Specific Preferences (Taste):**

  7.  **Ex-Ante Legibility (Modified):** *Factors and mechanisms should be *traceable* in the pre-outcome record, even if their *causal weight/significance* is only fully discernible in hindsight.*
      *   *Why:* Pure ex-ante legibility *does* ban essential hindsight-enabled causal selection (e.g., identifying a minor policy decision as crucial only because we see its massive downstream effects). However, factors *must* have existed and be identifiable *as existing* beforehand. The key is that *causal salience* is often a *product* of hindsight analysis. Banning this kills insight. (Case: Historians identify Luther's 95 Theses as pivotal *because* of the Reformation; contemporaries saw just another theological dispute. The *theses existed*, their *pivotal role* is hindsight).
  8.  **Closure vs. Contingency (Balance Required):** *The explanation must provide sufficient narrative coherence ("closure") to be intelligible and follow the causal chain, while simultaneously respecting the openness, messiness, and genuine contingency experienced by historical actors ("faithfulness to the mess").*
      *   *Why:* Pure closure risks determinism and ignores the near-miss. Pure contingency is incoherent as an explanation. The art lies in showing the path *as it unfolded* with its uncertainties, while still explaining why *this* path materialized. (Case: Explaining the rise of Hitler requires showing the contingent moments (e.g., Hindenburg's choices, backroom deals) alongside the structural pressures that made his rise *possible* within the narrative).

  **Inherent Tensions & The Biggest Excluder:**

  *   **Unresolvable Tension:** `Ex-Ante Legibility (Pure)` vs. `Hindsight-Enabled Causal Selection`. As argued, pure ex-ante legibility is incompatible with the core practice of identifying *which* contemporaneous factors were *actually* decisive.
  *   **Major Tension Requiring Balance:** `Closure` vs. `Contingency`. Achieving perfect balance is impossible; every account leans one way, but leaning too far either way violates core desiderata (sufficiency/anti-hindsight vs. intelligibility).
  *   **The Single Biggest Excluder:** `Source Contamination`. This is the deepest epistemic problem. Methods that fail to acknowledge and systematically address how the evidence itself is shaped by the outcome are fundamentally flawed. They guarantee explanations that reinforce the inevitability narrative embedded in the archive. **This requirement excludes a vast number of superficially plausible but methodologically naive accounts.**

  **Scorecard (Criteria-Focused):**

  1.  **Covering-Law (Hempel/D-N):**
      *   *Mechanism Fidelity:* Poor (often black-box correlations/laws).
      *   *Explanatory Sufficiency:* Poor (struggles with singular events/alternatives).
      *   *Anti-Hindsight:* Very Poor (implies inevitability via "laws").
      *   *Near-Miss/Contingency:* Very Poor (deterministic).
      *   *Source Contamination:* Poor (ignores constructed nature of evidence/laws).
      *   *Diachronic Stability:* Good (if laws are timeless).
      *   *Ex-Ante Legibility:* Good (in theory, if laws known).
      *   *Closure:* Good (deductive structure).
  2.  **Counterfactual-Dependence:**
      *   *Mechanism Fidelity:* Mixed (often focuses on difference-makers, not mechanisms).
      *   *Explanatory Sufficiency:* **Strong** (core focus on "this not that").
      *   *Anti-Hindsight:* Good (centers contingency).
      *   *Near-Miss/Contingency:* **Strong**.
      *   *Source Contamination:* Moderate (requires careful handling of evidence for alternatives).
      *   *Diachronic Stability:* Moderate (depends on how antecedents are fixed).
      *   *Ex-Ante Legibility:* Weak (hindsight crucial for selecting plausible worlds/factors).
      *   *Closure:* Weak (can be fragmentary).
  3.  **Narrative/Process-Tracing:**
      *   *Mechanism Fidelity:* **Strong** (core focus).
      *   *Explanatory Sufficiency:* Good (requires showing path-dependence/forks).
      *   *Anti-Hindsight:* Good (can build in actor uncertainty).
      *   *Near-Miss/Contingency:* Good (can incorporate critical junctures).
      *   *Source Contamination:* **Strong** (explicitly engages hermeneutics of sources).
      *   *Diachronic Stability:* Moderate (depends on narrative framing).
      *   *Ex-Ante Legibility:* Moderate (traces pre-existing elements, uses hindsight salience).
      *   *Closure:* **Strong**.

  **The strongest approach for *your* purpose (monograph + forecasting advice) is likely a rigorous form of Narrative/Process-Tracing that explicitly incorporates Counterfactual Reasoning to ensure Explanatory Sufficiency and Near-Miss plausibility, while relentlessly applying Source Contamination Awareness and Anti-Hindsight strategies.** It best navigates the core tensions while delivering mechanism-based explanations sensitive to contingency and evidence construction.
