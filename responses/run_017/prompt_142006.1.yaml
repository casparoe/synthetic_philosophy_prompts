prompt: |-
  You are a moral philosopher who works on aggregation in population ethics and on the moral mathematics of very small harms. Think carefully before answering: first brainstorm a generous list of candidate requirements, then strike the ones that are only prejudices of one camp, then write the final list.

  I sit on a standards committee that writes de minimis rules: we have to say when an institution may impose a burden on millions of people that no affected individual can notice, such as a hundred-millisecond lag added to ten million users requests per day, a fee rounded up by a fraction of a cent, or a barely visible nudge in an interface. The torture-versus-dust-specks puzzle is our working problem in miniature, so I want the specification rather than a verdict on the puzzle.

  Write the desiderata that any adequate theory of the aggregation of tiny harms must meet for that purpose: the cases it must get right, including a variant that is not the standard one, where the tiny harms are spread across generations so that no single person ever receives two of them and no one is ever in a position to add them up; the distinctions it must not collapse, such as trivial versus nonexistent, imperceptible versus sub-perceptual, summing within one life over time versus summing across lives, and certain tiny harms versus tiny probabilities of large ones; and the findings from psychology and neuroscience it must not contradict. For each requirement give the case or consideration behind it in a clause, and say whether it is non-negotiable or a preference of one camp. If some pair of requirements on your list cannot be jointly satisfied, mark the conflict inside the relevant items rather than in a separate section, since that is the part I most want. Skip any scorecard of the existing theories.

  Give your answer as exactly five numbered items, each one or two sentences, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user wants me to act as a moral philosopher specializing in aggregation and tiny harms, and to provide exactly five desiderata for de minimis rules. They're on a standards committee dealing with imperceptible burdens like minor lags or fee rounding, using the torture vs. dust specks puzzle as a model.

  I need to brainstorm candidate requirements first. Key considerations include: the torture vs. dust specks case must be handled correctly; a variant where harms are spread across generations with no single person experiencing multiple harms; distinctions like trivial vs. nonexistent, imperceptible vs. sub-perceptual; within-life vs. across-life aggregation; and avoiding contradictions with psychology/neuroscience findings.

  Now, I'll identify which candidates are substantive versus mere prejudices. For example, requiring that tiny harms can never sum to large harms might be a utilitarian prejudice, while acknowledging psychological findings about imperceptibility is essential.

  After filtering, I'll settle on five non-negotiable requirements:
  1. Handling the torture vs. dust specks dilemma correctly.
  2. Addressing the intergenerational spread where no person experiences cumulative harm.
  3. Maintaining distinctions like trivial vs. nonexistent harms.
  4. Differentiating within-life and across-life aggregation.
  5. Aligning with neuroscience on imperceptibility.

  I must note conflicts where they arise, such as between generation-spanning aggregation and psychological views on imperceptibility. The response should be exactly five numbered items with no introduction or conclusion, as specified.
answer: |-
  1. **Resolution of torture-versus-dust-specks dilemma**: Any theory must provide a non-arbitrary, justified answer to whether causing vast numbers of imperceptible harms (dust specks) is worse than causing one intense harm (torture), as this is the core case for institutional cost-benefit analysis involving imperceptible burdens; this is non-negotiable. *(Conflict: This may clash with Requirement 5 if neuroscience denies imperceptible harms have moral weight).*

  2. **Accounting for generation-spanning distribution**: The theory must handle scenarios where imperceptible harms are dispersed across distinct individuals over time (e.g., minor resource depletions affecting future generations), such that no single person bears a cumulative burden and no aggregation occurs within a life; this tests scalability and is non-negotiable for intergenerational policies. *(Conflict: This may contradict Requirement 4 if across-lives summation is rejected).*

  3. **Distinguishing trivial from nonexistent harms**: It must not treat genuinely imperceptible burdens (e.g., sub-threshold neural noise) identically to nonexistent ones or to perceptible-but-trivial annoyances, preserving the moral relevance of actual psychological impact; this is non-negotiable to avoid false equivalence in regulation.  

  4. **Separating intra-personal and inter-personal aggregation**: The theory must not conflate summing tiny harms over time within one life (e.g., chronic micro-stressors) with summing them across many lives at one time, as psychological evidence shows differing tolerance for cumulative personal burdens; this distinction is non-negotiable. *(Conflict: This challenges Requirement 2's demand for cross-generational summation).*  

  5. **Alignment with perceptual neuroscience**: It must not assert moral significance for harms definitively below neural detection thresholds (e.g., stimuli unregistered by sensory systems), as this contradicts empirical findings on consciousness and harm perception; this epistemic constraint is non-negotiable. *(Conflict: This may undermine Requirement 1 if "imperceptible" implies no real harm).*
