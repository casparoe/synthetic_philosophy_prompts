prompt: |-
  I am a PhD student in philosophy — my dissertation concerns the distinction between reasons that bear on whether an attitude fits its object and reasons that bear only on the value of being in that attitude — and for the past two years I have served as the graduate member and, informally, the minute-writer of my university's Research Integrity Review Panel. I would like a decision procedure the panel could actually run, written so that people who have never encountered that distinction can apply it correctly.

  The setting: the panel has eight seats — two senior scientists from different departments, a statistician, a research-compliance officer, a non-voting attorney from the Office of General Counsel, a rotating faculty member, me, and a chair who is an associate dean. We meet monthly for ninety minutes and handle ten to fifteen matters a year. We have no power to compel raw data or to interview unwilling parties; the statistician is the only member who can competently read the analyses in front of us; and the attorney screens every sentence for defamation exposure, so we cannot say anything we could not defend. Our output is a two-page recommendation to the Vice Provost for Research, who signs off on nearly all of them. The options in front of us are: close the matter with no public action, request materials from the authors, place a note on the publication record, recommend retraction, or refer the matter to the federal research-integrity office. The stakes run from a postdoc's career to a center's funding to the credibility of the institution's record.

  My sense is that the panel's real question is an attitude question in administrative costume: do we have a reason of the right kind to reduce confidence in this finding? Most of what actually moves the panel is not of that kind — it is the trouble a complainant can make, the existence of press coverage, the funder's mood, the size of the citing literature, the career damage a note would do to a junior author, the desire to be seen as responsive. Some of those are perfectly good reasons to do something. None of them, as far as I can tell, is a reason to doubt the finding, and the panel slides between the two constantly. I want a procedure that stops the slide.

  Please give me the following.

  An ordered set of questions, each with an account of what counts as a sufficient answer, including where the procedure stops with a no and where it hands the decision to a vote because the question is one of values rather than facts. It must be runnable inside a ninety-minute meeting, by the eight people described, and it must generate the two-page record as a by-product rather than as extra work.

  The procedure has to preserve a set of distinctions I keep watching the panel collapse. First, the basic one: considerations that bear on whether the finding is reliable, versus considerations that bear on what it costs or gains the panel, the institution, or the authors for us to be in a state of doubt. Second, reasons to investigate versus reasons to doubt: most of what reaches us justifies the first and is then treated as though it justified the second, and I want that gap to be explicit and thresholded. Third, the asymmetry of verdicts: our not finding evidence of fabrication, and the authors' answering our questions cooperatively, are not reasons for confidence, and the procedure must not let a written record imply that they are. Fourth, the stakes question, which I want flagged rather than settled: a finding that underwrites a clinical guideline, or that has hundreds of citing papers, raises the cost of being wrong — say whether that lowers the bar for reducing confidence, what the procedure assumes, and what would change under the view that it does not. Then the mirror image, which is the panel's most common failure: the damage that flagging would do to a junior author is not a reason for confidence either, and I want that as its own check rather than a footnote. Fifth, source-relative reasons: an allegation from a former lab member in a bitter dispute, or from an anonymous dossier since picked up by a science news outlet — distinguish what the complainant's motives do to the reliability of their testimony from what the trouble they can cause, or the coverage they have generated, does to us.

  Two further wrinkles that I have not seen handled anywhere and that I think matter more than the tidy cases. The first is what I have started calling laundered reasons: considerations that exist only because the panel or another body previously acted on reasons of the wrong kind, and which return to us later disguised as reasons of the right kind. A flag issued two years ago mainly to placate a large foundation now appears in a General Counsel memo as part of a documented pattern. The procedure must say whether such a consideration has any weight, and if it has none, what the panel is obliged to do when it shows up in a new file — including whether it owes a written correction of its own prior action. The second is that a committee is arguably not the kind of thing that has attitudes at all, and its output is a public statement that will function as evidence for readers who were not in the room. So the procedure should say whether it is trying to bring the panel to the fitting attitude, or to give readers a reason of the right kind to revise theirs, or both — and what breaks if it is the second, since a statement aimed at other people's attitudes makes almost every consideration look like a state-given one from our side.

  Please also mark, at each step, which parts are genuine procedure and which are judgment calls dressed up as procedure, and close by saying what the procedure cannot do: the questions it cannot answer, the cases it will systematically mishandle, and the points at which my distinction simply runs out.

  Then run it on three files.

  One: an anonymous dossier alleging image manipulation in a paper from six years ago. A forensic image review came back inconclusive; the authors produced part of the raw data and said the rest was lost in a lab move; the field is polarized; the dossier's author is identifiable as a former lab member with a documented grievance; a science news outlet has written about the allegations twice; and the chair wants a note on the record to show we responded.

  Two: an undisputed analytical error in a paper whose central result underwrites a clinical guideline. The statistician says the claim does not follow from the analysis anyone could run; the senior authors concede the error but say the conclusion survives; the error was found by a graduate student in the lab who is about to go on the job market and has asked not to be named; and the compliance officer notes that a note on the record would trigger a funder review of the entire center.

  Three: the laundering case. A new allegation against a lab the panel flagged two years ago, on a file I now think was driven almost entirely by reasons of the wrong kind and for which I drafted the minutes. The new file's summary cites our own earlier flag as corroboration. Run the procedure honestly and tell me what it commits us to, including whether it commits us to stating in writing that the earlier flag carried no evidential weight. If it does, say so plainly; that is an answer I will not like, and I would rather have it from the procedure than discover it myself in the meeting.

  I know the philosophical literature on this; I do not need citations, references, or a reading list, and the attorney will not read them anyway. What I need is something eight people with different training can run in a room in ninety minutes. Please write in American English, roughly 1,200 to 1,600 words, in a form I could circulate to the panel with only the identifying details changed.
reasoning: |-
  We are designing a decision procedure for the Research Integrity Review Panel. The procedure must:
  1. Distinguish reasons bearing on the reliability of a finding (fitting-attitude reasons) from reasons bearing on the costs/benefits of expressing doubt (state-given reasons).
  2. Make explicit the gap between reasons to investigate and reasons to doubt.
  3. Avoid implying that lack of evidence of misconduct or cooperative authors are reasons for confidence.
  4. Flag (but not decide) how high stakes (e.g., clinical guidelines, many citations) might affect the threshold for doubt, without letting state-given reasons (like harm to a junior author) count as reasons for confidence.
  5. Handle source-relative reasons: distinguish the reliability of testimony from the trouble the complainant might cause.
  6. Address "laundered reasons" (prior panel actions taken for state-given reasons now appearing as evidence).
  7. Clarify whether the panel's output is about the panel's attitude, the readers' attitudes, or both.

  The procedure must be executable in 90 minutes by the described panel and generate a two-page record.

  Procedure Structure:
  We break the process into distinct, ordered questions. Each question must be answered with "sufficient" evidence or lead to a stop or a vote. We mark which parts are procedural (fact-based) and which are judgment calls.

  ---

  **Research Integrity Review Panel: Decision Procedure**

  **Purpose**: To determine whether there are sufficient reasons of the right kind (fitting-attitude reasons) to reduce confidence in a research finding, and to recommend appropriate actions without being swayed by irrelevant considerations (state-given reasons).

  **Definitions**:
  - **Fitting-Attitude Reasons (FA)**: Reasons that directly bear on the reliability of the finding (e.g., evidence of error, fabrication, or methodological flaws).
  - **State-Given Reasons (SG)**: Reasons that bear on the costs or benefits of expressing doubt (e.g., potential harm to an author, reputational damage to the institution, media pressure, funder relations).
  - **Reasons to Investigate**: Information that justifies further inquiry but does not, by itself, justify doubting the finding.
  - **Reasons to Doubt**: Information that, after investigation, directly undermines the reliability of the finding.

  ---

  **Ordered Set of Questions**:

  **Step 0: Preliminary Screening (Procedural)**
  - *Question*: Has the complaint been vetted by the compliance office for completeness and jurisdiction? 
  - *Sufficient Answer*: Yes (proceed) or No (close the matter with no public action).
  - *Notes*: This step is administrative and does not involve substantive judgment. If the complaint is incomplete or outside the panel's scope, stop.

  **Step 1: Reasons to Investigate (Procedural with Judgment)**
  - *Question*: Is there sufficient initial evidence (e.g., allegation, inconsistency, error report) to justify further investigation? 
  - *Sufficient Answer*: 
    - **Yes** if there is any plausible FA reason to suspect a problem (e.g., an allegation of manipulation, an admitted error, a statistical anomaly) OR if there is an SG reason that triggers an obligation to investigate (e.g., public controversy, funder request). 
    - **No** if the complaint is entirely baseless (e.g., no evidence, clearly frivolous). 
  - *Procedure*: 
    - If **No**, close the matter with no public action. 
    - If **Yes**, proceed to Step 2. 
  - *Judgment Call*: Deciding what counts as "plausible" requires judgment, but the threshold is low (any non-frivolous reason). 
  - *Record Note*: Do not imply that an investigation implies doubt. Write: "The panel found sufficient reason to investigate [specific issue]."

  **Step 2: Investigation (Procedural)**
  - *Action*: Request materials from authors, consult experts (e.g., statistician), and gather evidence. (This step occurs before the meeting and is reported at the meeting.)
  - *Output*: A summary of the evidence gathered.

  **Step 3: Assessment of Fitting-Attitude Reasons (Procedural with Judgment)**
  - *Question*: Does the evidence gathered in Step 2 provide FA reasons to reduce confidence in the finding? 
  - *Sufficient Answer*: 
    - **Yes** if there is clear and convincing evidence of:
      - Fabrication, falsification, or plagiarism (FFP), OR
      - A significant error or flaw that undermines the central finding, OR
      - Misrepresentation of data or methods that affects the conclusion.
    - **No** if:
      - The evidence is inconclusive, OR
      - The error is minor and does not affect the conclusion, OR
      - There is no evidence of FFP or significant error after investigation.
  - *Procedure*: 
    - If **Yes**, proceed to Step 4 (Action Consideration). 
    - If **No**, proceed to Step 5 (State-Given Reasons Check). 
  - *Judgment Call*: 
    - The panel must judge what counts as "significant" and "undermines." The statistician and relevant experts should lead. 
    - **Critical Rule**: Lack of evidence (e.g., raw data not available) is not a FA reason for confidence. Similarly, authors' cooperation is not a FA reason for confidence. 
  - *Record Note*: If the answer is **No**, the record must state: "The investigation found no evidence that warrants reduced confidence in the finding." Do not add positive language about confidence.

  **Step 4: Action Consideration (Procedural with Judgment)**
  - *Question*: Given FA reasons to doubt, what action is proportionate? 
  - *Options*: 
    - Place a note on the publication record (for errors that do not invalidate the whole paper).
    - Recommend retraction (for FFP or major errors that invalidate the finding).
    - Refer to federal office (if evidence suggests possible FFP that may require further investigation).
  - *Factors*: 
    - Severity of the issue (FA reasons). 
    - **Do not consider SG reasons** (e.g., harm to authors, funder reactions) in choosing the action. 
  - *Procedure*: Vote if there is disagreement on the action. 
  - *Record Note*: Justify the action solely based on the FA reasons.

  **Step 5: State-Given Reasons Check (Judgment)**
  - *Trigger*: Step 3 answered **No** (no FA reasons to doubt). 
  - *Question*: Are there compelling SG reasons to take action anyway? 
  - *Considerations*: 
    - Public controversy (e.g., media coverage, community concern). 
    - Funder or institutional pressure. 
    - Potential harm to the institution's reputation. 
    - **Do not treat these as FA reasons**. 
  - *Procedure*: 
    - This is a judgment call. If SG reasons are present and compelling, the panel may choose to place a note on the record or request materials. 
    - **Never** recommend retraction or refer to federal office based solely on SG reasons. 
    - Vote required. 
  - *Record Note*: Clearly separate FA and SG reasons. State: "Although the investigation found no evidence warranting reduced confidence in the finding, due to [state SG reason, e.g., public interest], the panel recommends [action]." 

  **Step 6: High Stakes Flag (Procedural)**
  - *Question*: Does the finding underpin high-stakes applications (e.g., clinical guideline, policy, extensive citation)? 
  - *Purpose*: To note in the record that the stakes are high, which may affect how readers interpret the panel's decision. 
  - *Procedure*: 
    - If yes, add a statement to the record: "The panel notes that this finding has been cited in [context] and therefore has high-stakes implications." 
    - **Do not** use stakes to lower the threshold for FA reasons. 
    - **Do not** let stakes influence the decision in Steps 3-5. 
  - *Judgment Call*: Deciding what counts as "high stakes" is a judgment, but it is informational only.

  **Step 7: Source Reliability (Procedural with Judgment)**
  - *When*: This step runs parallel to Step 1 and Step 3. 
  - *Question*: How does the source of the allegation affect the reliability of the evidence? 
  - *Procedure*: 
    - In Step 1, consider the source's credibility as part of the initial evidence. 
    - In Step 3, if the evidence relies on testimony, weigh the source's motives and credibility. 
    - **Do not** let the source's potential to cause trouble (SG) affect the assessment of the evidence (FA). 
  - *Record Note*: If the source's motives are relevant to the evidence, state: "The panel considered the source's [motives] in weighing the evidence, but found [it did/did not] undermine the reliability of the testimony."

  **Step 8: Laundered Reasons (Procedural)**
  - *Question*: Is a prior panel action being cited as evidence in the current case? 
  - *Procedure*: 
    - If yes, disregard the prior action entirely unless it was based solely on FA reasons. 
    - If the prior action was based on SG reasons, state in the record: "The panel's prior action in [case] was not based on evidence affecting the reliability of the finding and therefore carries no evidential weight in this matter." 
    - If the panel determines that its prior action was based on SG reasons, it must correct the record in the current case. 
  - *Judgment Call*: Determining the basis of the prior action may require reviewing old records.

  **Clarification on Panel's Output**:
  - The panel's statement is a public record that provides FA reasons to readers. Therefore, the procedure focuses on FA reasons. 
  - Including SG reasons in the public statement would be misleading and inappropriate because they are not reasons for readers to doubt the finding. 
  - The panel does not have a "mental state" of doubt; it produces a statement that gives readers FA reasons (if any) to doubt. 

  **What the Procedure Cannot Do**:
  - It cannot eliminate judgment. Steps 3 and 5 involve judgment calls.
  - It cannot force the panel to ignore SG reasons entirely (Step 5 exists because SG reasons sometimes must be addressed institutionally).
  - It may mishandle cases where FA and SG reasons are deeply entangled (e.g., when public controversy arises from legitimate but unproven concerns).
  - It does not address systemic issues (e.g., a pattern of problems in a lab) beyond the specific finding.
  - The distinction may "run out" in Step 5 when the panel must act on SG reasons without endorsing them as FA reasons.

  ---

  **Running the Procedure on Three Files**:

  **File 1: Anonymous dossier alleging image manipulation (6 years ago)** 
  - **Step 0**: Vetted, so proceed.
  - **Step 1**: Initial evidence: dossier from a former lab member (with grievance) and media coverage. FA reason: allegation of image manipulation. SG reason: media coverage. **Yes** to investigate.
  - **Step 2**: Investigation: forensic review inconclusive; authors provided partial raw data; rest lost. 
  - **Step 3**: FA assessment: 
    - Evidence inconclusive. No proof of manipulation. Loss of data is not evidence of misconduct (without more). 
    - **No** FA reasons to doubt. 
  - **Step 5**: SG reasons: media coverage, chair wants to show responsiveness. 
    - **Judgment**: Is there a compelling SG reason? Media coverage and institutional reputation might be compelling. 
    - **Action**: Place a note? But note: Step 5 does not allow retraction. A note might be considered. 
    - **Vote**: Likely split. 
    - **Record**: "The investigation found no evidence of image manipulation. However, due to public interest and media coverage, the panel recommends placing a note on the publication record stating that an investigation was conducted and no evidence of misconduct was found." 
  - **Step 6**: High stakes? Polarized field but not specified as high-stakes application. No flag. 
  - **Step 7**: Source reliability: source had grievance, which may affect credibility of allegation. But forensic review did not confirm, so it did not change the FA assessment. 
  - **Step 8**: Not applicable. 
  - **Outcome**: Place a note due to SG reasons, but the record must clearly separate FA and SG reasons.

  **File 2: Undisputed analytical error in a paper underwriting a clinical guideline** 
  - **Step 0**: Vetted, proceed.
  - **Step 1**: Initial evidence: error found by a graduate student, confirmed by statistician. FA reason: error in analysis. **Yes** to investigate.
  - **Step 2**: Investigation: authors concede error but claim conclusion stands.
  - **Step 3**: FA assessment: 
    - Statistician: error is significant and central claim does not follow. 
    - **Yes**, FA reasons to doubt (error undermines the finding). 
  - **Step 4**: Action: 
    - The central result is undermined and underlies a clinical guideline. 
    - Action: Recommend retraction (or at least a note if the paper can be corrected, but the guideline reliance may require stronger action). 
    - **Procedural**: Vote if disagreement. 
  - **Step 6**: High stakes: clinical guideline. Flag in record. 
  - **Step 7**: Source reliability: graduate student (anonymous) is credible as they found the error, but the FA assessment stands independently. 
  - **Step 8**: Not applicable. 
  - **Outcome**: Recommend retraction (or correction if possible) based on FA reasons. Record must state the high stakes.

  **File 3: Laundering case (new allegation against a lab previously flagged for SG reasons)** 
  - **Step 0**: Vetted, proceed.
  - **Step 1**: Initial evidence: new allegation and prior panel flag. FA reason: new allegation. **Yes** to investigate.
  - **Step 2**: Investigation: [details of new allegation].
  - **Step 3**: FA assessment: 
    - Focus solely on the new evidence. 
    - Suppose the new evidence alone is weak and does not meet the threshold for FA reasons. **No** FA reasons to doubt. 
  - **Step 8**: Prior flag: 
    - Review prior file (you drafted minutes and recall it was SG-driven). 
    - **Procedure**: Prior flag was based on SG reasons (to placate a foundation), not FA reasons. 
    - **Action**: Disregard the prior flag as evidence. 
    - **Record Obligation**: State: "The panel's prior action in [case number] was not based on evidence affecting the reliability of the finding and therefore carries no evidential weight in this matter." 
    - Additionally, the panel should consider: Does it owe a correction? The procedure says: correct the record in the current case by stating the prior flag has no evidential weight. 
  - **Step 5**: SG reasons: new allegation and prior flag might create pressure. If compelling, a note might be considered. 
  - **Outcome**: 
    - If Step 3 is **No** and Step 8 requires disregarding the prior flag, then unless the new allegation provides FA reasons, the panel must close the case or act on SG reasons (with a note). 
    - **Crucially**, the record must explicitly state that the prior flag has no evidential weight. This may require acknowledging that the prior action was not evidence-based. 

  **Commitment in File 3**: The procedure commits the panel to stating in writing that the earlier flag carried no evidential weight. This is necessary to prevent laundering and to maintain the integrity of the process. 

  ---

  **Final Note**: The procedure is not perfect. It relies on the panel's ability to honestly separate FA and SG reasons. In practice, SG reasons may still influence judgments in Steps 3 and 5. But the structure forces explicit acknowledgment and contains the damage.
answer: |-
  ### Research Integrity Review Panel: Decision Procedure for Findings Reliability  
  **Purpose**: To determine whether we have sufficient reasons to reduce confidence in a research finding based *only* on evidence that bears directly on its reliability (fitting-attitude reasons), and to recommend appropriate actions without being swayed by institutional, reputational, or personal costs (state-given reasons). This procedure ensures our output gives readers—not just the panel—valid reasons to revise their confidence.  

  **Core Principles**:  
  1. **Fitting-Attitude (FA) Reasons**: Directly address whether the finding is reliable (e.g., evidence of error, fabrication, or methodological flaws).  
  2. **State-Given (SG) Reasons**: Address costs/benefits of acting (e.g., media pressure, harm to an author’s career, funder reactions). These *never* justify reducing confidence in the finding.  
  3. **Asymmetry of Evidence**:  
     - Absence of evidence of misconduct ≠ evidence of reliability.  
     - Authors’ cooperation ≠ evidence of reliability.  
  4. **Output Clarity**: Our public statement must provide readers with FA reasons (if any) to doubt the finding. SG reasons may justify actions (e.g., investigation) but must be explicitly segregated in the record.  

  **Procedure Rules**:  
  - **Time Limit**: Strict 90-minute runtime. Stick to questions; if consensus lags, vote.  
  - **Roles**:  
    - Statistician leads evidence assessment (Steps 3–4).  
    - Attorney screens all language for legal risk.  
    - Chair ensures adherence to procedure.  
    - All members flag SG intrusions.  
  - **Output**: Answers to these questions auto-generate the 2-page recommendation.  
  - **Judgment Calls**: Marked where unavoidable. Procedural steps are binary (yes/no).  

  ---

  ### Ordered Decision Questions  
  #### Step 1: Is there sufficient reason to investigate?  
  **Question**: Does the complaint/allegation provide *any* plausible FA reason to suspect the finding might be unreliable?  
  - **FA Examples**: Alleged data manipulation, admitted error, statistical inconsistency, missing raw data.  
  - **SG Exclusion**: Ignore media coverage, complainant’s motives, career impacts, or institutional risk.  
  - **Sufficient Answer**:  
    - **Yes** (proceed): If even one FA reason exists (e.g., "The dossier alleges image manipulation").  
    - **No** (close with no action): If only SG reasons (e.g., "A news outlet reported allegations, but no evidence was provided").  
  - **Procedure Stop**: Close the matter if "No."  
  - **Judgment Call?** Minimal. Threshold is low: "plausible" means not facially absurd.  
  - **Record Output**: "The panel identified a FA reason to investigate: [brief description]."  

  #### Step 2: Did the investigation uncover FA reasons to doubt the finding?  
  **Question**: Does the evidence gathered (e.g., author responses, raw data, expert analysis) provide clear and specific FA reasons to reduce confidence?  
  - **FA Threshold**:  
    - **Doubt justified**: Fabrication/falsification/plagiarism (FFP); error/flaw that invalidates the central finding; methodological misrepresentation.  
    - **Doubt not justified**: Inconclusive evidence; minor error with no bearing on the conclusion; lost data without corroborating suspicion.  
  - **SG Exclusion**: Ignore authors’ cooperativeness, investigation costs, or lack of FFP evidence.  
  - **Asymmetry Enforcement**:  
    - If raw data is unavailable, state: "Absence of data does not imply misconduct."  
    - If authors cooperate, state: "Cooperation does not affect the finding’s reliability."  
  - **Sufficient Answer**:  
    - **Yes** (proceed to Step 4): FA reasons are present.  
    - **No** (proceed to Step 5): FA reasons are absent or inconclusive.  
  - **Judgment Call?** High. Statistician breaks ties on technical points; panel votes on significance.  
  - **Record Output**: "Investigation found [FA reasons present] OR [no FA reasons to doubt]."  

  #### Step 3: Source Reliability Check (Parallel to Steps 1–2)  
  **Question**: Does the source’s credibility affect the weight of their testimony as FA evidence?  
  - **FA Focus**: Assess if the source’s motives (e.g., grievance, anonymity) undermine the reliability of their specific claims (e.g., "The complainant’s grievance may explain their allegation but does not disprove the image analysis").  
  - **SG Exclusion**: Ignore the source’s potential to cause trouble (e.g., "The news outlet’s coverage increases institutional risk, but this does not affect the finding’s reliability").  
  - **Procedure**: Revisit during Steps 1–2 if source motives are central.  
  - **Judgment Call?** Moderate. Separate source credibility (FA) from source notoriety (SG).  
  - **Record Output**: "Source motives were noted but did not [or did] alter the assessment of evidence."  

  #### Step 4: Action for FA-Based Doubt (If Step 2 = Yes)  
  **Question**: What action is proportionate to the FA reasons?  
  - **Options**:  
    - Request materials (if unresolved but doubt is serious).  
    - Place a note (for errors that don’t invalidate the paper).  
    - Recommend retraction (for FFP or invalidating errors).  
    - Refer to federal office (for suspected FFP requiring further investigation).  
  - **SG Exclusion**: Do not consider:  
    - Career impacts (e.g., "A note could harm a junior author").  
    - Institutional stakes (e.g., "Retraction might cost the center funding").  
  - **High Stakes Flag (Procedural)**:  
    - If the finding has high-stakes applications (e.g., clinical guideline, policy influence), append: "The panel notes this finding supports high-stakes applications; readers should weigh this in their assessment."  
    - **Do not** lower the FA threshold for doubt. Flag stakes but do not debate them.  
  - **Procedure**: Vote if consensus fails.  
  - **Judgment Call?** Low. Match action to severity of FA reasons.  
  - **Record Output**: "FA reasons justify [action]."  

  #### Step 5: SG Check (If Step 2 = No)  
  **Question**: Are there compelling SG reasons to act despite no FA-based doubt?  
  - **Allowed Actions**: Request materials or place a note only (no retraction/referral).  
  - **SG Examples**: Public controversy, funder pressure, institutional reputation.  
  - **Proportionality Test**: Action must be limited to addressing the SG reason (e.g., a note to acknowledge public concern, not to imply doubt).  
  - **Sufficient Answer**:  
    - **Act**: If SG reasons are severe (e.g., "Science news coverage has sparked widespread debate").  
    - **Close**: If SG reasons are negligible.  
  - **Judgment Call?** High. Requires vote; attorney screens for defamation risk.  
  - **Record Output**: "No FA reasons to doubt were found. However, due to [SG reason], the panel recommends [action]."  

  #### Step 6: Laundered Reasons Check  
  **Question**: Is a prior panel action cited as FA evidence?  
  - **FA Exclusion**: Prior actions driven by SG reasons (e.g., placating a funder) carry no FA weight.  
  - **Procedure**:  
    - Review prior case basis (if unclear, statistician+chair assess).  
    - If prior action was SG-based: Disregard it as evidence and state in the record: "The prior action was not based on FA reasons and provides no corroborative weight."  
    - If prior action was FA-based: Treat it as corroborative only if the evidence was validated.  
  - **Correction Duty**: If a prior SG-based action is cited, the record must correct the misimpression.  
  - **Judgment Call?** Moderate. Basis of prior action may require file review.  
  - **Record Output**: "The prior action in [case] was [FA/SG]-based and thus [does/does not] contribute to this assessment."  

  #### Step 7: Panel Output Clarification  
  **Question**: Does the recommended action provide readers (not just the panel) with FA reasons to revise their confidence?  
  - **Principle**: The public statement must stand on FA grounds alone. SG reasons may justify actions but cannot be framed as reasons for doubt.  
  - **Procedure**: Attorney reviews language to ensure:  
    - SG-driven actions are explicitly labeled as such.  
    - No implied confidence from cooperation or lack of evidence.  
  - **Breakage Point**: If the statement aims to shape readers’ attitudes without FA reasons, it becomes an SG reason itself (e.g., "We issued a note to calm funders" is SG; "We issued a note due to an error" is FA).  
  - **Record Output**: Auto-generated from Steps 1–6.  

  ---

  ### What This Procedure Cannot Do  
  1. **Eliminate Judgment Calls**: Steps 2 (evidence assessment), 5 (SG action), and 6 (laundering) rely on panel judgment. The procedure makes biases explicit but can’t purge them.  
  2. **Resolve Entangled Cases**: When FA and SG reasons are fused (e.g., public outcry over legitimate but unproven concerns), the procedure may misfire by oversimplifying.  
  3. **Handle Systemic Issues**: Patterns of misconduct (e.g., a lab’s history) are assessed per-finding; broader reviews are outside scope.  
  4. **Override Institutional Realities**: SG reasons (e.g., funder demands) may force action via Step 5, but the procedure flags this as non-evidential.  
  5. **Philosophy Limits**: The FA/SG distinction "runs out" in Step 5—when acting on pure SG reasons, we cannot magically convert them into FA reasons.  

  ---

  ### Procedure Test Runs  
  #### Case 1: Anonymous Dossier (Image Manipulation Allegation)  
  - **Step 1**: FA reason exists? Yes. Allegation of image manipulation (FA). Proceed.  
  - **Step 2**: FA reasons to doubt? No. Forensic review inconclusive; partial data provided; no evidence manipulation occurred. Lost data ≠ evidence of misconduct.  
  - **Step 3**: Source reliability? Complainant has grievance (SG), but forensic analysis (FA) is independent. No FA impact.  
  - **Step 5**: SG reasons to act? Yes. Media coverage and chair’s desire to show responsiveness (SG). Action: Place a note.  
  - **Step 6**: High stakes? None flagged.  
  - **Step 7**: Laundering? N/A.  
  - **Output**: Place a note. Record states: "No FA reasons to doubt were found. Due to public interest, a note is added to confirm investigation."  

  #### Case 2: Undisputed Analytical Error (Clinical Guideline)  
  - **Step 1**: FA reason exists? Yes. Error conceded by authors (FA). Proceed.  
  - **Step 2**: FA reasons to doubt? Yes. Statistician confirms error invalidates central finding.  
  - **Step 3**: Source reliability? Graduate student’s anonymity (SG) doesn’t affect error (FA).  
  - **Step 4**: Action? Retraction (proportionate to invalidating error). High stakes flagged: "Finding underlies clinical guidelines."  
  - **Step 5**: Skipped (Step 2 = Yes).  
  - **Step 6**: Laundering? N/A.  
  - **SG Exclusion**: Compliance officer’s warning (funder review triggered) ignored.  
  - **Output**: Recommend retraction. Record states: "FA reasons (critical error) justify retraction. High-stakes application noted."  

  #### Case 3: Laundering Case (New Allegation + Prior SG-Based Flag)  
  - **Step 1**: FA reason exists? Yes. New allegation (FA). Proceed.  
  - **Step 2**: FA reasons to doubt? Assume **No** (new evidence is weak; e.g., no corroboration).  
  - **Step 6**: Laundering? Prior flag cited as evidence. Review: Prior action was SG-driven (to placate a foundation). **Correction required**: Disregard prior flag. Record must state: "The prior action was based on SG reasons and carries no evidential weight."  
  - **Step 5**: SG reasons to act? Possibly (e.g., new allegation’s visibility). Action: Place a note only if SG reasons compel.  
  - **Commitment**: The procedure **requires you to state in writing that the prior flag has no evidential weight**. This corrects the record and prevents laundering.  
  - **Output**: Close or place a note (if SG reasons). Record states: "No FA reasons to doubt. The prior action provides no corroboration. [If SG action:] A note is added due to [SG reason]."  

