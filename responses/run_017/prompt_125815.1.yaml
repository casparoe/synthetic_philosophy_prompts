  Okay, I need to help the user create a custom philosophical case about the wrong-kind-of-reasons problem. This is a complex request with very specific requirements. Let me break it down.

  The user is writing a paper arguing that the standard solution to the wrong-kind-of-reasons problem - distinguishing between reasons for having an attitude and reasons for bringing it about - doesn't fully solve the issue. They need a realistic case without demons, bets, or other crude incentives.

  Key specifications:
  - The attitude must be recalcitrant (not controllable at will) like grief or trust
  - Must include both undefeated fittingness reasons and moral wrong-kind reasons
  - Must derive verdicts from both fitting-attitude and inclusive theories
  - Must show why cultivation responses fail
  - Must include a comparison to standard cases and an objection

  I'm considering using "trust" as the attitude since it's complex, socially embedded, and recalcitrant - you can't just decide to trust someone. The scenario should involve a promise made to a dying person, creating a strong moral reason to trust someone, while the actual evidence suggests distrust is fitting.

  For the fitting-attitude theorist: They'd say the moral reason to trust is irrelevant to whether trust is fitting. Only evidence about the person's trustworthiness matters. 

  For the inclusive theorist: They'd count the moral reason as a genuine reason for trust, creating a conflict with the fittingness reasons.

  Why cultivation fails here: Because the promise demands trust on this specific occasion, not just general cultivation. And trust isn't the kind of attitude you can quickly cultivate through indirect methods.

  If we modify the case to make trust controllable or replace the promise with money, it becomes a standard case where the cultivation response works. But in this version, the moral pressure from the promise and the recalcitrant nature of trust make it different.

  The strongest objection against the inclusive view would be that it confuses reasons for action with reasons for attitude - the promise gives reason to act as if you trust, not to actually trust.

  This case should effectively challenge the standard solution while meeting all the user's requirements.
answer: |-
  Here is a custom-built case meeting all specifications, followed by the analysis:

  **The Case:**  
  Elena promised her dying mentor, Aris, that she would trust his estranged son, Leo, to make critical decisions about Aris’s legacy project. Aris believed reconciliation was vital and extracted this promise on his deathbed. Elena, however, possesses decisive evidence that Leo is financially reckless and manipulative: she reviewed his past business records showing consistent fraud and spoke to multiple victims of his schemes. When Leo proposes a risky investment for the project, Elena feels viscerally resistant; she *finds him untrustworthy*. Her promise to Aris feels morally binding, creating immense pressure to trust Leo *now*, as this pivotal decision arises. Yet the evidence screams that Leo is unworthy of that trust. The attitude here is **trust**, understood as a confident reliance on someone’s character or competence. It qualifies as recalcitrant because it is not directly willable: one cannot instantly decide to feel confident reliance toward someone against whom one has strong, evidence-based suspicion. Trust emerges (or fails to) from complex evaluations of character and history, not simple volition.

  **Verdicts from the Theories:**  
  1. **Fitting-Attitude Theorist (FA):**  
     FA analyses value (e.g., trustworthiness) as what it is fitting to favor (e.g., trust). A reason for an attitude must bear on whether its object *merits* it. Here, the only considerations bearing on whether *trust* is fitting are facts about Leo’s character and competence (his fraud history, manipulative behavior). These undefeated facts decisively make distrust fitting. The promise to Aris is a reason *to act as if* she trusts Leo (e.g., delegate the decision), or *to cultivate* trust over time, but it is irrelevant to whether Leo *is trustworthy* and thus irrelevant to the fittingness of trusting him *now*. The promise is a right-kind reason for *action* (fulfilling a vow) but a wrong-kind reason for the *attitude* of trust, as it doesn’t address Leo’s trustworthiness. Thus, FA concludes: Elena has *no reason* to trust Leo, only reasons to act against her fitting distrust.

  2. **Inclusive Theorist (IT):**  
     IT holds that any consideration counting in favor of having an attitude is a genuine reason for it. The promise to Aris is a potent moral consideration: it counts strongly in favor of Elena trusting Leo *on this occasion* to honor Aris’s dying wish and enable reconciliation. This coexists with evidence-based reasons against trusting Leo (his untrustworthiness). IT denies any deep distinction between "right" and "wrong" kinds; both are pro tanto reasons for the attitude. Thus, IT concludes: Elena has *strong, conflicting reasons* regarding trust. The moral reason (promise) favors trusting Leo now; the factual reasons favor distrust. The overall balance may favor distrust, but the promise remains a genuine normative reason *for* the attitude of trust itself.

  **Why the Cultivation Reply Fails:**  
  The standard reply—that wrong-kind reasons are reasons to *bring about* or *cultivate* the attitude, not to *have* it—fails here for two reasons:  
  1. **Immediacy of the Demand:** The promise binds Elena to trust Leo *on this specific occasion* for this specific decision. It is not a reason to *become* trusting over time; it demands the attitude *now*, coincident with the action.  
  2. **Recalcitrance + Indirectness Mismatch:** Trust cannot be conjured instantly via indirect cultivation (e.g., therapy, exposure). Even if Elena could eventually cultivate trust in Leo through long-term effort, this does not satisfy the *immediate* demand of the promise. The promise requires trust *now*, but recalcitrance means no cultivation strategy can produce it *on this occasion*. The reply thus dissolves the normative force of the promise for the *present attitude*; it cannot convert the moral pressure into a reason applicable to the attitude at the required time.  

  **Key Feature Doing the Work:**  
  The **combination of a recalcitrant attitude with an immediate, non-prudential normative demand** (the promise) is essential. Remove either, and the standard reply works.  

  **Modified Case (Removing Key Feature):**  
  Substitute a *controllable attitude* (e.g., *publicly endorsing* Leo’s plan) and a *cash bribe* for the promise. Elena can easily choose to endorse the plan for money, regardless of her private views.  
  - **FA:** The bribe is a reason to *act* (endorse), not a reason for any private attitude. No wrong-kind problem arises.  
  - **IT:** The bribe is a reason to endorse, but endorsement is an action, not a recalcitrant attitude. The cultivation reply easily handles this: the bribe gives reason to *perform the endorsing action*.  
  Both views avoid the core challenge.  

  **Strongest Objection (Against IT):**  
  IT’s verdict—that Elena has a moral reason *to trust* Leo—confounds reasons for attitudes with reasons for actions or projects. Trust is a *cognitive/affective response to perceived trustworthiness*. The promise gives Elena reason to *act trustingly* and to *undertake projects to foster trust*, but it cannot rationally compel the *attitude itself* without reference to Leo’s actual trustworthiness. To insist the promise is a reason *for trust* violates the **constitutive link** between trust and perceived reliability: if Elena’s reason for trusting is the promise, not Leo’s qualities, her state isn’t genuine trust but pretense or self-deception. IT thus fails to respect the internal logic of the attitude, reducing reasons for attitudes to mere incentives.  

  **Why this meets all specs:**  
  - Recalcitrant attitude (trust) justified.  
  - Fittingness reason (Leo’s fraud) undefeated; moral WK reason (promise) non-prudential.  
  - Verdicts derived from FA/IT principles, not intuitions.  
  - Cultivation reply blocked by immediacy + recalcitrance.  
  - Feature removal test and objection provided.
