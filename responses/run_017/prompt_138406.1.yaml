answer: |-
  ### Analysis of the Phenomenon

  Your description highlights a core challenge in neural network interpretability: the ability to find multiple distinct activation-space directions that each appear to "represent" a given property (e.g., "is this token part of a city name") based on two key tests:
  1. **Linear probe performance**: A simple linear classifier trained on the direction accurately predicts the property from activations.
  2. **Steering validity**: Artificially perturbing activations along that direction changes model behavior in a way that aligns with expectations (e.g., increasing refusal rates or altering outputs to match the property).

  Critically, these directions are **not unique**—they vary with training data, layer choice, random seeds, or even between research groups—yet the model's underlying behavior remains consistent. This undermines claims that any single direction definitively captures what the network "really represents," as the evidence fails to distinguish between candidates. Additional constraints (e.g., "the direction must be used downstream" or "sparse coding must recover it") merely shift the ambiguity to a new level without resolving it.

  ### Is There an Established Term?
  **Verdict: no established term**  
  Despite similarities to concepts like polysemanticity (one direction for many features) or philosophical underdetermination (evidence insufficient to pick between theories), no widely adopted term specifically describes this phenomenon. Here's why existing terms fall short:
  - **Polysemanticity/superposition**: Addresses *one-to-many* mappings (e.g., a single neuron/direction encodes multiple unrelated features). Your issue is the *many-to-one* problem: multiple directions for a single feature.
  - **Underdetermination**: Broadly applies to theories competing for inadequate evidence. Your concern is narrower: evidence (probes + steering) failing to uniquely identify a *representation* within a fixed model, not competing theories about the model.
  - **Non-identifiability**: A statistical concept where model parameters (e.g., directions) cannot be uniquely determined from data. While related, it lacks specificity to interpretability tests like steering.
  - **Equifinality/degeneracy**: Focus on functional outcomes (e.g., different paths to the same behavior), not representational ambiguity under interventions like steering.

  ### Coining a Term: **Representational Multiplicity**
  To precisely capture your phenomenon, I propose the term:  
  **Representational Multiplicity**  

  #### Definition
  **Representational Multiplicity** is the phenomenon in neural network interpretability where, for a given property of interest, multiple distinct activation-space directions satisfy both:  
  1. **Linear decodability**: A linear probe trained on activations achieves high accuracy in predicting the property.  
  2. **Steering-consistency**: Perturbing activations along the direction induces expected changes in model behavior.  

  Critically, these directions are **functionally interchangeable** under the tests above but are **not equivalent** (e.g., they differ geometrically, arise from varying methodologies, or occupy different subspaces). The multiplicity persists even when the model's behavior is invariant to the choice of direction, and attempts to resolve it (e.g., via downstream usage or sparsity) only relocate the ambiguity.

  #### Key Boundaries
  - **What it is**:  
    - A *diagnostic* for methodological limitations: Probes + steering are necessary but insufficient to uniquely identify representations.  
    - **Layer/context-dependent**: Directions shift across layers, datasets, or seeds without altering model behavior, exposing probe/steering as coarse tools.  
    - **Empirically pervasive**: Occurs for any property with definable labels (e.g., city names, refusal modes).  
    - **Distinct from model capability**: The model's behavior is consistent; the ambiguity arises from interpretability tools.  

  - **What it is NOT**:  
    - **Not polysemanticity/superposition**: Those describe *compression* (many features → one direction); this is *inflation* (one feature → many directions).  
    - **Not underdetermination of theories**: Applies to representations within a model, not high-level explanations.  
    - **Not causal misidentification**: Steering is valid for all directions; the issue isn't incorrect causality but non-uniqueness.  
    - **Not noise/artifacts**: Directions are robust to probe/steering tests; the multiplicity is inherent to high-dimensional spaces and linear methods.  

  #### Where It Stops
  The phenomenon halts when:  
  - **Evidence forces uniqueness**: E.g., only one direction is causally necessary for the property (tested via ablation), or a direction is *invariant* across layers/seeds and aligns with downstream mechanisms.  
  - **Constraints resolve ambiguity**: If a new test (e.g., "direction must be sparse and used by attention heads") eliminates all but one candidate *without relocating the problem*, it escapes multiplicity.  
  - **Lower-dimensional spaces**: In toy models with dimension ≤ feature count, directions often stabilize, but this vanishes in practical high-dimensional networks.  

  ### Why This Carving?
  - **Precision**: Focuses on the interplay of probes and steering, avoiding conflation with polysemanticity or theory underdetermination.  
  - **Utility**: Highlights a vulnerability in interpretability claims—e.g., "the network represents X" based solely on probes/steering—and pushes for stronger evidence.  
  - **Machine-actionable**: Coined for your scenario alone, with clear criteria for identification.  

  This "carving" isolates your concern: the tools meant to reveal representations (probes + steering) often multiply them instead, leaving the interpreter no wiser about what's "really" there.

  Verdict: no established term — representational multiplicity
