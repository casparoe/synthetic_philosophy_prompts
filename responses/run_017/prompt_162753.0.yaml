  ### Procedure

  1. **Introduction**: Explain the scenario: a paratrooper in one of four cells: NE, NW, SE, SW. Prior probabilities as above. The paratrooper receives a radio message: "If you are north of the river, then you are west of the road." 

  2. **分组**: 
     - Group A: envelope says "Protocol A: the operator always broadcasts this message and it is a true constraint on the territory. Specifically, it means that in this territory, the conditional probability of being west given that you are north is 1."
     - Group B: envelope says "Protocol B: the operator has a menu of three messages and selects uniformly at random among the ones that are true for your cell. The menu is:
           M1: 'If you are north of the river, then you are west of the road.'
           M2: 'If you are north of the river, then you are east of the road.'
           M3: 'You are south of the river.'
          In this case, you have received M1."

  3. **Task**: Each group must come to a consensus on the posterior probability that the paratrooper is in the North (P(North)), and be ready to bet on it.

  4. **Betting**: Use a scoring rule. Given time, use a quadratic scoring rule for the probability of North. 
     - For a participant who reports a probability q for North, their score if North is true is: 1 - (1-q)^2, if South is true: 1 - q^2.
     - To avoid real money, use chips or just record scores for a leaderboard.

     Alternatively, we can use a binary option: a bet on North at odds that they find acceptable.

     Given the time, we can have them write their posterior for North and then we can simulate the scoring later.

  5. ** within-group discussion**: 
     - Group A might split into two: some might do the fixed marginal update (setting P(NE)=0 and then normalize only within North, keeping P(North)=0.5, so P(NW)=0.5, and then not change the South) -> P(North)=0.5.
     - Others might do the M update: conditioning on not being in NE, so P(North)=P(NW)/(1-P(NE)) =0.05/0.55=1/11≈0.0909.

     - Group B: should do the material conditional update: 
          P(North|M1) = P(NW) / [P(NW) + (1/3)(P(SE)+P(SW))] = 0.05 / [0.05 + (1/3)(0.5)] = 0.05/ (0.05+0.1667)=0.05/0.2167=0.2307.

  6. **Betting market**:
     - Each participant writes their posterior for North on a card.
     - Then, we allow them to trade bets. For example, a bet that pays 1 chip if North, 0 otherwise. They can buy and sell at prices they choose.
     - We might see different prices across groups and within Group A.

  7. **Reveal the protocols**: Have them open the envelopes and read the protocols. Then discuss why the updates are different.

  8. **Debrief**: Explain that the update depends on the protocol, and that the content of the message alone does not determine the update. Point out the different rules that emerged in Group A (fixed marginals vs conditioning) and how in Group B the update was by Bayes' rule for the menu.

  ### What will go wrong

  - Participants might not know how to update for Protocol A: they might not think of the fixed marginal method or the MRE method. 
     - To handle this, you can circulate and drop hints: "How might you incorporate the constraint? Does it force you to be in the west if you are in the north?"

  - In Group B, they might not condition on the method of message selection. 
     - You can hint: "Given that you are in a particular cell, what is the probability that the operator would say M1?"

  - One person might dominate and force their method on the group.

  - Time might be tight.

  ### What the activity can't do

  - It doesn't adjudicate which updating rule is correct for Protocol A. In fact, there is a literature on that.
  - It doesn't account for risk aversion in betting.

  In the discussion, you can:
