  ### Session Design: Updating on Conditionals with Protocol-Dependence

  **Core Scenario**:  
  Paratrooper dropped in one of four territories divided by a river (N/S) and road (E/W).  
  - **Priors**:  
    - NE: 0.45  
    - NW: 0.05  
    - SE: 0.25  
    - SW: 0.25  
  - **Radio message**:  
    "If you are north of the river, the chance you are west of the road is three in four."  
    (i.e., \( P(\text{West} \mid \text{North}) = 0.75 \))  

  **Protocols** (distributed in sealed envelopes):  
  - **Protocol A (Constraint)**:  
    Operator *always* broadcasts this message, and it is a true constraint about the territory.  
  - **Protocol B (Randomized Menu)**:  
    Operator has a fixed menu of three conditionals and broadcasts one *uniformly at random* from those true of your actual cell. The menu:  
    1. "If north, chance of west is three in four."  (identical to the heard message)  
    2. "If north, chance of west is one in two."  (\( P(\text{West} \mid \text{North}) = 0.5 \))  
    3. "If north, chance of west is one in four."  (\( P(\text{West} \mid \text{North}) = 0.25 \))  

  ---

  ### Activity Structure (90 minutes)  
  #### **1. Introduction (10 mins)**  
  - Explain the prior, territory, and message.  
  - Split into small groups (3–4 people). Half get Protocol A, half get Protocol B.  
  - **Task**: Compute posterior probability of being in the North (i.e., \( P(\text{North} \mid \text{Message}) \)).  
  - **Goal**: Prepare to trade bets on \( P(\text{North}) \).  

  #### **2. Group Computation (25 mins)**  
  - Groups compute posteriors based on their protocol.  
    - **Protocol A hint**: "The message is a true fact about the territory. How should this constrain your beliefs?"  
    - **Protocol B hint**: "For your cell, which menu items are true? What’s the probability the operator chose this message?"  
  - Provide calculators (phones) for arithmetic.  

  #### **3. Betting Market (25 mins)**  
  - **Rules**:  
    - Each group starts with 20 chips.  
    - **Bet type**: Binary option on "Paratrooper is in North."  
    - **Scoring**: Quadratic scoring rule for probability reports. If a group reports posterior \( q \):  
      - Payoff if North true: \( 1 - (1 - q)^2 \)  
      - Payoff if South true: \( 1 - q^2 \)  
      (Convert payoffs to chips, e.g., scale by 10.)  
    - Groups can trade chips for contracts (e.g., "Pay 3 chips for a contract that pays 10 if North").  
  - **Process**:  
    - Groups publicly post their \( P(\text{North}) \) and bid/ask prices for contracts.  
    - Encourage trading between Protocol A and B groups.  

  #### **4. Reveal and Discussion (30 mins)**  
  - **Staged reveals**:  
    1. Groups share posteriors.  
       - Expected answers:  
         - Protocol A (fixed North marginal): \( P(\text{North}) \approx 0.5 \)  
           (Set \( P(\text{NW}) = 0.75 \times 0.5 = 0.375 \), \( P(\text{NE}) = 0.125 \), keep South unchanged.)  
         - Protocol A (MRE): \( P(\text{North}) \approx 0.23 \)  
           (Minimize KL divergence: approx. \( P(\text{NE}) = 0.06 \), \( P(\text{NW}) = 0.18 \), \( P(\text{SE}) = 0.38 \), \( P(\text{SW}) = 0.38 \))  
         - Protocol B: \( P(\text{North}) \approx 0.55 \)  
           (Apply likelihood ratios: \( P(\text{NW}) \propto 0.05 \times 3 \), \( P(\text{NE}) \propto 0.45 \times 1 \), etc.; normalize to total 1.1 → \( P(\text{North}) = (0.15 + 0.45)/1.1 \).)  
    2. Open envelopes to reveal protocols.  
    3. Discuss why answers diverge.  

  ---

  ### Predicted Outcomes and Debrief  
  #### **Key Moments**  
  - **Trades accepted**:  
    - Protocol B groups (posterior ~0.55) selling contracts to Protocol A groups (posterior ~0.23–0.5) at prices implying \( P(\text{North}) \approx 0.4 \).  
    - Bets between Protocol A subgroups (fixed marginal vs. MRE) at mid-range prices (~0.35).  
  - **Trades rejected**:  
    - Bets at extreme odds (e.g., Protocol A MRE groups refuse contracts priced above 0.3; fixed marginal groups refuse below 0.4).  
  - **Envelope reveal impact**:  
    - Protocol B groups realize their update assumes the message is randomly selected from a menu, not a territory constraint.  
    - Protocol A groups see internal disagreement from competing rules (fixed marginal vs. MRE).  

  #### **Why the Message Underdetermines the Update**  
  - **Protocol matters**: The same sentence can be generated by different processes (global constraint vs. cell-specific random selection).  
  - **Updating rules clash**:  
    - Fixed marginal preserves \( P(\text{North}) \) but distorts likelihoods.  
    - MRE alters \( P(\text{North}) \) to minimally adjust priors.  
    - Protocol B treats the message as a likelihood generator, ignoring the conditional structure.  
  - **Debrief points**:  
    - The utterance doesn’t specify *how* it was produced.  
    - Updating requires knowing if the message is a constraint, a random truth, or something else.  

  #### **Predictable Challenges and Mitigation**  
  1. **"The message must raise P(West)"**:  
     - Some will think the message boosts \( P(\text{West}) \) unconditionally.  
     - **Mitigation**: Ask: "Does the message say anything about the South? How does Protocol B affect this?"  
  2. **Refusal to bet on conditionals**:  
     - Risk-averse groups avoid bets due to ambiguity.  
     - **Mitigation**: Use the scoring rule to reward precision, not just accuracy.  
  3. **One person dominates/blurts answers**:  
     - A student pre-familiar with Judy Benjamin might quote MRE.  
     - **Mitigation:** Assign roles (e.g., "calculator," "skeptic") to balance participation.  
  4. **Thin trading**:  
     - If groups converge to similar posteriors, trading stalls.  
     - **Mitigation**: Introduce a contrarian "market maker" (you) to offer extreme bids.  

  ---

  ### Limitations and Normative Discussion  
  #### **What the Activity Can’t Do**  
  - **Adjudicate correct updating**:  
    - Bets reveal *disagreements*, not who is right. MRE is standard for Judy Benjamin, but the activity doesn’t justify it.  
  - **Isolate credences from risk attitudes**:  
    - Ambiguity aversion masquerades as low \( P(\text{North}) \); risk-seeking inflates it. Quadratic scoring helps but doesn’t eliminate this.  
  - **Replicate full protocol-dependence**:  
    - Protocol B simplifies to a likelihood update (not normative for conditionals), but it’s computationally feasible.  

  #### **What You Must Supply in Discussion**  
  - **Why protocols matter**:  
    - The sentence token doesn’t carry its generative process. Real updates require knowing if the message is a constraint, a random selection, or (e.g.) a lie.  
  - **Normative foundations**:  
    - MRE minimizes information loss but assumes constraint-based updates.  
    - Protocol B forces Bayesian conditioning on a likelihood model.  
  - **Judy Benjamin’s lesson**:  
    - Conditioning on conditionals isn’t equivalent to conditioning on events. The update must preserve the conditional’s *role* (constraint vs. evidence).  

  ---

  ### Confidence and Sanity Checks  
  - **High confidence**:  
    - **Divergence of posteriors**: Your numbers (0.5 vs. 0.23) are correct for fixed marginal vs. MRE under Protocol A.  
    - **Protocol B computation**:  
      - For a cell in North: Only one menu item is true, so \( P(\text{Message} \mid \text{cell}) = 1 \) if \( P(\text{West} \mid \text{North}) \) matches the cell’s region (e.g., NW satisfies only message 1).  
      - For a cell in South: All three messages are vacuously true (since "if north" is false), so \( P(\text{Message} \mid \text{cell}) = 1/3 \).  
      - Thus:  
        \[
        P(\text{Message}) = P(\text{NW}) \cdot 1 + P(\text{NE}) \cdot 0 + P(\text{SE} \lor \text{SW}) \cdot \frac{1}{3} = 0.05 + \frac{0.5}{3} \approx 0.2167
        \]  
        \[
        P(\text{North} \mid \text{Message}) = \frac{P(\text{NW})}{P(\text{Message})} = \frac{0.05}{0.2167} \approx 0.23
        \]  
      - *But wait, this conflicts with the earlier "sloppy likelihood" method!* I made an error here. The correct Protocol B posterior for the menu of conditionals is actually **~0.23**, not 0.55. The "sloppy likelihood" method (which gives 0.55) is *incorrect* for Protocol B. For true Protocol B, we compute:  
        \[
        P(\text{cell} \mid \text{Message}) \propto P(\text{cell}) \cdot P(\text{Message} \mid \text{cell})
        \]  
        with \( P(\text{Message} \mid \text{cell}) \) as above, leading to \( P(\text{North} \mid \text{Message}) \approx 0.23 \). The 0.55 is a common mistake if groups misapply a likelihood ratio.  
  - **Least confident in**:  
    - **Protocol B’s divergence from MRE**: Both give ~0.23, but fixed marginal (0.5) still diverges sharply. For starker contrast, use this:  
      - Have Protocol B groups compute the *sloppy likelihood* method (which is normatively wrong but intuitive). They get 0.55, which clashes violently with MRE (0.23) and fixed marginal (0.5).  
      - In debrief, clarify: "Some groups may have done this. It’s a common mistake—applying the likelihood globally—and Protocol B doesn’t justify it."  

  ### Adjusted Protocol B Computation for Sloppy Groups  
  - **Incorrect but intuitive method for Protocol B** (if groups misapply the message):  
    - Treat the message as a likelihood: \( P(\text{Message} \mid \text{NW}) = 3 \), \( P(\text{Message} \mid \text{NE}) = 1 \), \( P(\text{Message} \mid \text{South}) = 1 \).  
    - Posterior:  
      \[
      \begin{align*}
      P(\text{NW}) &\propto 0.05 \times 3 = 0.15 \\
      P(\text{NE}) &\propto 0.45 \times 1 = 0.45 \\
      P(\text{SE}) &\propto 0.25 \times 1 = 0.25 \\
      P(\text{SW}) &\propto 0.25 \times 1 = 0.25 \\
      \text{Total} &= 1.1 \\
      P(\text{North}) &= (0.15 + 0.45)/1.1 \approx 0.55
      \end{align*}
      \]  
  - **Why this happens**: Students ignore the menu randomization and directly use the conditional as a likelihood.  
  - **Use this**: It creates a violent split (0.23 vs. 0.5 vs. 0.55) and lets you critique it in debrief.  

  ### Final Workflow  
  1. Run activity with protocols.  
  2. When groups report posteriors, expect:  
     - Protocol A: 0.5 (fixed) or 0.23 (MRE).  
     - Protocol B: 0.23 (correct) or 0.55 (sloppy).  
  3. Use the envelope reveal to highlight protocol-dependence.  
  4. In debrief, explain why 0.55 is wrong for B (it ignores the menu randomization) and why 0.5 is controversial for A.  

  This design ensures they *feel* the underdetermination through bets and protocol reveals, setting up a rich discussion on updating rules.
