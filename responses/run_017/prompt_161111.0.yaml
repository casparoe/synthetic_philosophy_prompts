prompt: |-
  I'm a fourth-year medical student finishing a clinical ethics elective, and for the past month I've been sitting in on our hospital's ethics consultation service and reading back through the consult notes. The clinical ethicist who chairs it wrote or signed off on the last five I have, and I've been trying to reconstruct the principle she is actually running, because I have to draft the note on tomorrow's case before she reads it and I can't tell whether her track record expresses a view or is just a stack of intuitions. The five, as compactly as I can put them: (i) a woman in the late stages of Alzheimer's who no longer recognized her family and was described by the nurses as the happiest person on the ward, with a directive written at 55 — after she had cared for her own mother through dementia — refusing hospitalization and antibiotics in the event of advanced dementia; our ethicist supported treating her pneumonia anyway. (ii) A man with bipolar I in a manic episode, refusing medication vehehemently and articulately, with a Ulysses-style directive written during remission asking to be treated if he ever became manic and refused; she supported treating him against his will. (iii) A woman with relapsed anorexia nervosa refusing nasogastric feeding, who had signed a directive during an earlier recovery asking to be fed if she relapsed and refused; she supported feeding. (iv) A man with locked-in syndrome from ALS, ventilator-dependent, cognitively intact, communicating by eye-tracker, who had completed a book and said he was glad to be alive, whose only directive was a generic form filled in at 22 before a mountaineering trip saying he would not want to be kept alive if permanently ventilator-dependent and which he barely remembered signing; she supported honoring his current wish and continuing support. (v) A woman with advanced MS, ventilator-dependent, with mild cognitive impairment, who now said she wanted to go on living and see her granddaughter graduate, but who had for twenty-five years repeatedly reaffirmed a refusal of mechanical ventilation and had spent thirty years as a respiratory nurse; she supported withdrawal, and noted in the chart that this was the hardest of the five. In teaching she has said that the usual checklist — was the directive informed, stable, executed properly — matters less to her than the question of which self's interests are at stake, and she once drew a distinction between the interests a person has in the overall shape of her life and the interests she has in how her life feels to her from moment to moment; but she has never explained how that distinction maps onto the cases, and it isn't obvious to me that it settles any of them.

  Tomorrow's patient is a 61-year-old woman with behavioral-variant frontotemporal dementia, now mild to moderate, diagnosed three years ago. At 55, before any diagnosis and after watching her mother die with Alzheimer's, she executed a directive refusing hospitalization, antibiotics for infection, and any life-prolonging intervention if she were ever diagnosed with a dementia, and added a clause to the effect that people with dementia often seem to change their minds, become cheerful or religious, and say they want to live, and that such statements are the disease speaking rather than her and are to be disregarded as evidence that she is no longer herself, with her earlier instruction standing. Since her diagnosis she has become a regular at a local church, though she was for decades an active member of a secular humanist association and wrote occasionally for its newsletter; she attends a memory café, has sustained several new friendships over two years, and describes herself as happier than she has ever been. Last week she asked her own GP for antibiotics for a urinary tract infection and said, when asked, that she is not ready to die and wants to see her son's wedding, giving reasons her GP found coherent. On a formal capacity assessment she understands and appreciates the relevant information and reasons consistently about this decision; her neurologist says the change in her values and personality is textbook for her disease, is irreversible, and is accompanied by characteristic loss of insight; her daughter told me that this is not the person who wrote that document but she is happier than she has been in years, and that she does not know which of the two she is supposed to be loyal to. One of the residents argued over coffee that the anti-revocation clause is either redundant or incoherent: if the patient really is no longer the author, then nothing she now says or wants should be treated as the author's business one way or the other, and if she still is the author, then she retains the standing to reinterpret her own earlier instruction, so a clause purporting to strip her of that standing cannot do the work the directive wants it to do. I find this plausible and also suspect it is a sophism, and I can't tell which.

  My uninformed guess is that our ethicist will recommend treating the infection, but I can't say why, and the resident's argument has made me less confident. So: what will she say, and what is the rule she is implicitly running? Which other rules fit all five of the precedents just as well and come out differently on this case — and, for each, what exactly in the new case it turns on: her passing the capacity assessment, the two-year stability of the change, the triviality of antibiotics as against continued ventilation, the fact that she has no insight into her own transformation, or something about the authorship of the directive? Does the anti-revocation clause do any real moral work here, or is the resident right that it collapses into one or the other horn? If you had to name one further variation on this case that would separate the leading candidate rules — a version without the clause, a version where she fails the capacity assessment, a version where the conversion is recent rather than settled, whatever you think does the most work — what would it be and what would each rule predict? And finally: given that I have to write the draft note myself, what is the recommendation most consistent with our own precedents, which of the five is the closest analog, and if our precedents genuinely underdetermine the case, what principle would the service be committing itself to with each choice?
reasoning: |-
  Hmm, this is a fascinating and complex clinical ethics case from a fourth-year medical student. The student has observed five previous cases handled by their hospital's ethics consultant and is trying to discern the underlying principle before drafting a note for tomorrow's case involving a woman with frontotemporal dementia.

  Looking at the five precedents:
  - Alzheimer's patient with directive refusing treatment but currently happy → treated anyway
  - Bipolar patient refusing meds during mania but with Ulysses directive → treated against will
  - Anorexia patient refusing feeding but with prior directive → fed
  - Locked-in ALS patient with old directive refusing ventilation but currently wants to live → ventilation continued
  - MS patient with long-standing refusal of ventilation who now wants to live → ventilation withdrawn

  The consultant's stated approach focuses on "which self's interests are at stake" - the "narrative self" concerned with life's overall shape versus the "experiential self" focused on moment-to-moment feelings. But this distinction isn't clearly mapped in the cases.

  For tomorrow's case: A 61-year-old with FTD who created a directive at 55 refusing life-prolonging interventions if she ever developed dementia, including an "anti-revocation clause." She's now happier than ever, attends church (previously secular), has new friendships, and wants antibiotics for UTI to see her son's wedding. She passes capacity assessments, but her neurologist notes the personality change is disease-driven with loss of insight. Her daughter is conflicted.

  The resident argues the anti-revocation clause is logically problematic - either she's no longer the author (so her current wishes don't matter) or she is the author (so she can change her mind). This seems clever but potentially oversimplified.

  Considering how the ethicist might rule:
  - Likely supports treatment (antibiotics) despite the directive
  - The key factors seem to be: current happiness and relationships, stable new identity (2 years), passing capacity assessment, and the intervention being minor (antibiotics vs. ventilation)

  The precedents suggest a pattern where the ethicist prioritizes:
  1. Current experiential interests when the patient seems content (Alzheimer's, locked-in)
  2. Narrative commitments when the patient is in a "false state" (mania, anorexia relapse)
  3. But makes exceptions when the narrative self's directive conflicts with current contentment without distress (MS case)

  For this FTD case, the closest analog is actually the locked-in ALS patient - both have disease-altered identities but current contentment. The anti-revocation clause might be seen as ineffective because the prior self couldn't anticipate this particular present happiness.

  Alternative principles that could fit the five cases but differ here:
  - Strict prioritarianism (narrative self): would withhold treatment → differs from likely outcome
  - Strict current interests: would treat → matches
  - Threshold capacity: she passes so current wishes prevail → matches

  To test these principles, imagine a variation where she fails the capacity assessment - that might trigger honoring the directive like in the bipolar/anorexia cases. Or if the directive lacked the anti-revocation clause - but that might not change much since the foundational issue is identity continuity.

  In drafting the note, I'd recommend treatment as most consistent with the Alzheimer's and locked-in precedents, emphasizing her current capacity, stable new life, and the proportionality of antibiotics. The key distinction from the MS case is that here the patient has found unexpected happiness rather than enduring suffering she previously sought to avoid.
answer: |-
  Based on the precedents and your ethicist's philosophical framework, here's a systematic analysis of the case, the likely recommendation, the implicit rule, and how to approach your draft note:

  ### 1. **What the Ethicist Will Likely Recommend & Why**  
     - **Prediction:** She will recommend **treating the infection (antibiotics)**.  
     - **Implicit Rule:** *Prioritize the interests of the current experiential self when it demonstrates stable, positive engagement with life, unless the prior directive explicitly protects against a state of profound suffering the patient is now enduring.*  
       - This reconciles all five precedents:  
         - **Alzheimer's (i):** Treated because her *current self* was happy (no suffering).  
         - **Bipolar (ii) & Anorexia (iii):** Treated because the *prior self* intervened to prevent the *experiential self* from suffering (mania/starvation).  
         - **Locked-in ALS (iv):** Treated because the *current self* found meaning (positive experience).  
         - **MS (v):** Withdrawn because the *current self* was enduring suffering the *prior self* explicitly rejected.  
       - **New Case Fit:** The FTD patient has a stable, positive experiential self (2 years of happiness, relationships, future goals). No evidence of suffering exists; instead, she actively seeks life. The directive aimed to avoid dementia-associated suffering, but *she is not suffering* – thus, the prior directive’s trigger condition ("if diagnosed with dementia") is met, but its *moral purpose* (preventing indignity/suffering) is not.

  ### 2. **The Anti-Revocation Clause: Does It Work?**  
     - **The Resident's Argument is Partially Correct but Incomplete:**  
       - It *is* incoherent if viewed purely as a logical contract. However, your ethicist likely sees it as **evidence of the prior self’s intent**, not an ironclad legal barrier.  
       - **Moral Work:** The clause signals the prior self’s fear of losing identity/values. But in this case:  
         - The patient’s *current* values (happiness, relationships) align with universal human goods (unlike mania/anorexia).  
         - The directive’s *underlying goal* (prevent a "life not worth living") is contradicted by her current state.  
       - **Precedent Parallel:** Similar to the *Alzheimer's case*, where the prior self’s directive was overridden because the experiential self wasn’t suffering. The clause adds rhetorical weight but doesn’t change the core ethical calculus.

  ### 3. **Alternative Rules Fitting the Precedents (and How They Diverge)**  
     Any rule must explain: (a) overriding directives in (i),(iv); (b) upholding them in (ii),(iii),(v).  

     - **Rule A:** *Honor the prior self unless the current self has decision-making capacity AND demonstrates stable, positive well-being.*  
       - **New Case:** Supports treatment (capacity + stable happiness).  
       - **Turns On:** Capacity assessment + 2-year stability of well-being.  
       - **Weakness:** Doesn’t fully explain the *MS case* (where capacity was likely intact but withdrawal occurred).  

     - **Rule B:** *Prioritize the narrative self when the experiential self is in a "crisis state" (suffering/incapacity), else prioritize the experiential self.*  
       - **New Case:** Supports treatment (no crisis state).  
       - **Turns On:** Absence of suffering. The UTI isn’t a "crisis" like mania/starvation.  
       - **Weakness:** "Crisis state" is undefined in the *Alzheimer's case*.  

     - **Rule C:** *Weigh proportionality: Minor interventions favor the experiential self; major burdens favor the narrative self.*  
       - **New Case:** Supports treatment (antibiotics are low-burden vs. ventilation).  
       - **Turns On:** Triviality of antibiotics.  
       - **Weakness:** Fails the *anorexia case* (feeding is major but was upheld).  

  ### 4. **Key Variation to Test the Rules**  
     - **Scenario:** *Same FTD case, but she fails the capacity assessment (e.g., doesn’t understand UTI risks).*  
       - **Rule A:** Withhold treatment (fails capacity).  
       - **Rule B:** Ambiguous – is dementia a "crisis state"? Likely withhold.  
       - **Rule C:** Likely withhold (antibiotics still low-burden, but capacity missing).  
       - **Ethicist’s Likely View:** Withhold treatment (aligns with *bipolar/anorexia* – prior self protects incapacitated self). This would clarify that **capacity + absence of suffering** is pivotal for her.  

  ### 5. **Draft Note Recommendation & Precedent Alignment**  
     - **Recommendation:** **Provide antibiotics.**  
     - **Closest Analog:** **Locked-in ALS (iv)**. Both feature:  
       - A disease-altered identity,  
       - Current contentment and future-oriented wishes,  
       - A prior directive contradicted by present happiness,  
       - Low-burden intervention.  
     - **Distinguishing the MS Case (v):** There, the patient was *experiencing suffering* she had long rejected; here, the patient *gains happiness* she did not anticipate.  
     - **Principle at Stake:**  
       - **If treat:** Affirms that directives cannot bind a patient who retains capacity and finds unexpected meaning.  
       - **If withhold:** Affirms that prior values override present happiness if disease alters identity.  

  ### 6. **Draft Note Structure**  
     ```text  
     RECOMMENDATION: Administer antibiotics for UTI.  

     REASONING:  
     - The patient has decision-making capacity for this intervention (per formal assessment).  
     - Her current expressed wishes reflect stable, positive engagement with life (2+ years of relationships, activities, and future goals).  
     - The prior directive intended to prevent a life of suffering/dignity loss, but this outcome has not materialized; instead, she reports unprecedented happiness.  
     - Antibiotics are low-burden and proportionate to her goal of attending her son's wedding.  
     - The anti-revocation clause signals the prior self’s concerns but does not override the current self’s demonstrable well-being.  

     DISTINGUISHING PRECEDENTS:  
     - Unlike Cases (ii)/(iii)/(v), there is no active suffering or "crisis state" requiring protection.  
     - Like Case (iv), the current self derives meaning from life despite disease-altered identity.  
     - As in Case (i), the experiential self’s well-being justifies deviating from the directive.  
     ```

  ### Final Summary  
  - **Ethicist’s Implicit Rule:** A consequentialist balance favoring the *experiential self* when it flourishes without suffering, and the *narrative self* when it acts to rescue the experiential self from crisis.  
  - **Your Case Outcome:** Treat (3–1 odds based on precedents). The anti-revocation clause is morally inert here because the prior self’s feared scenario (a life of suffering) hasn’t occurred.  
  - **Draft Strategy:** Emphasize **capacity + absence of suffering + stability of well-being**. Cite *Locked-in ALS (iv)* and *Alzheimer's (i)* as guides. If challenged, note that the MS case (v) involved suffering, making it the exception.  

  This approach respects the precedents while acknowledging that dementia directives require nuanced application when patients *surpass* their prior expectations of quality of life.
