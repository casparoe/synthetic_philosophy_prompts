  For the anti-psychiatry point: Hacking explicitly rejects "labels = unreal," but students will need concrete examples. The novel adds visceral force to looping—we feel the ward's machinery through Chief's hallucinations—and starkly shows power imbalances in classification (Ratched as unchecked authority). 

