  Okay, let me start by unpacking this retired plant physiologist's query. He's in a U3A philosophy group dealing with Mary's Room thought experiments. His group leader, Brenda, has given verdicts on several variants, and he's trying to figure out her underlying principles. The key case he's focused on is Partial Mary—a protanope who learns all physical facts and then gains the ability to see red. He wants to know how three different approaches (ability-based, phenomenal-concept, quality-space) would handle this, predict Brenda's response, and get a test case to differentiate theories.

  First, I need to recall Brenda's previous verdicts. Ordinary Mary gains something but not a new fact; the robot doesn't know what red looks like despite physical knowledge; simulated Mary only knows if her visual system is actually exercised, not just equations; inverted Mary has a real difference despite identical physical descriptions. 

  For Partial Mary, the key is that protanopes experience color but lack the long-wavelength cone, so red is perceived as dark yellow/brown. She's already in the color space. Now, applying the three approaches:

  1. **Ability-based**: Focuses on new capacities. Partial Mary gains the ability to experience red, recognize it, imagine it. She'd be less surprised than ordinary Mary because she has a reference frame in color experience. Prediction: She learns something new ability-wise, but less shock.

  2. **Phenomenal-concept**: She acquires a new concept only experience provides. Even with physical knowledge, she couldn't form the concept of "red experience" without the cone. So she'd be just as surprised as ordinary Mary. Prediction: Learns a new phenomenal concept, surprise level same.

  3. **Quality-space/acquaintance**: Since she's already acquainted with color, red is a new location in her existing space. With physical knowledge, she could theoretically locate red, so any surprise is computational, not epistemic. Prediction: No new knowledge, surprise due to imagination limits.

  Now, guessing Brenda's take. Her emphasis on simulation Mary needing actual exercise of the visual system (not just equations) suggests she values the actual experience. For Partial Mary, since the cone addition activates a new dimension in her existing modality, but she hasn't exercised it, Brenda might say she learns something new—similar to the robot not knowing despite perfect sorting. The inverted Mary case shows she accepts private differences, so Partial Mary gaining a new qualia might count as new. But the acquaintance angle is tricky because she's already in the space. 

  I think Brenda will go with "she learns something new" because the actual experience matters. My reasoning: in the simulation case, running the system is crucial; similarly, Partial Mary needs the cone activated to have the experience, even if she has the structure. The robot case shows that functional competence isn't enough without experience. So Partial Mary, post-surgery, gains a new phenomenal quality within her modality, hence new knowledge.

  For a test case to separate theories: Consider "Calibrated Partial Mary" where, pre-surgery, she uses a neuroprosthetic to experience red via another modality (e.g., sound). If she can form the phenomenal concept or ability without the cone, then post-surgery, if she doesn't learn anything new, it supports phenomenal-concept/ability views. If she still learns something, it supports acquaintance (since the quality space was already accessed). But if Brenda says she doesn't learn post-surgery because of the prosthetic, it aligns with her simulation verdict—actual exercise in the relevant modality matters.
answer: |-
  Based on Brenda's verdicts and your analysis of Partial Mary (the protanope case), here's a breakdown of how each approach predicts the outcome, whether Partial Mary would be *less surprised* than ordinary Mary, my best guess for Brenda's verdict (with reasoning), and a decisive test case to resolve ambiguity.

  ---

  ### **1. Predictions for Partial Mary by Approach**
  **a) Ability-Camp (New Capacities)**  
  - **Prediction:** Partial Mary *does* learn something new.  
    - She gains new *abilities*: to phenomenally experience red, recognize it, imagine it, or recall it in a first-person way.  
  - **Surprise Level:** **Less surprised than ordinary Mary.**  
    - Reason: She starts with a pre-existing color space (blues, yellows, greens) and can anticipate red as a "gap" (e.g., "dark yellow/brown"). Her surprise stems from *activating* a missing ability in a familiar modality, not encountering an entirely new dimension.  

  **b) Phenomenal-Concept Camp (New First-Person Concepts)**  
  - **Prediction:** Partial Mary *does* learn something new.  
    - She acquires a *phenomenal concept* of red—a first-person way of grasping "what it's like"—that physical knowledge couldn't provide, even with her existing color experiences.  
  - **Surprise Level:** **As surprised as ordinary Mary.**  
    - Reason: Lacking the L-cone, she never had *any* access to the specific quale of red. Physical knowledge + analogous hues (yellow/green) can't generate this concept—only the experience can.  

  **c) Quality-Space/Acquaintance Camp (Structure + Location)**  
  - **Prediction:** Partial Mary does *not* learn anything new.  
    - She already knows the *structure* of color space (e.g., hue/brightness relationships) via her protanopic vision and physics. Red is just a new coordinate in that space. Any surprise is due to computational/imagiative limits, not epistemic lack.  
  - **Surprise Level:** **Minimal surprise (far less than ordinary Mary).**  
    - Reason: With full physical knowledge + her existing acquaintance with color, she could (in principle) locate and anticipate red's position in quality space. The gene therapy just fills in a missing data point.  

  ---

  ### **2. Best Guess for Brenda's Verdict on Partial Mary**
  **Prediction:** Brenda will say **Partial Mary learns something new**, and she'll be **less surprised than ordinary Mary** but still meaningfully surprised.  

  **Reasons (Based on Her Track Record):**  
  - **Simulation Verdict is Key:** Brenda's insistence that Mary *only* knows red if her visual system is "actually exercised" (not just equations) shows she prioritizes *embodied, first-person activation* over abstract knowledge. Partial Mary's new cone "exercises" a previously inactive part of her visual system, creating a new phenomenal quality—even if it's within a known modality.  
  - **Robot Verdict Supports Realism:** The robot case rejects functional competence (sorting colors) as sufficient for knowing "what red looks like." Similarly, Partial Mary's physical knowledge + protanopic color space doesn't grant her the *phenomenal character* of red—only the new cone does.  
  - **Inverted Mary Verdict Confirms Private Differences:** Brenda accepts inverted spectra as "real differences" despite identical physics. This implies she believes qualia are irreducible to third-person facts. Partial Mary gains a new quale (red), so it's a new fact *for her*.  
  - **Ordinary Mary Verdict Nuance:** She distinguishes "gaining something" (experience) from "new factual content" (nothing false learned). Partial Mary fits this: she gains a new experience, but no physical fact is contradicted.  

  **Why Less Surprised?**  
  Brenda will likely argue that Partial Mary’s existing color space provides scaffolding: red isn't a wholly alien experience (like color to a blind person) but a "missing shade" in her palette. The surprise is about the *specificity* of the quale, not its existence.  

  **Why Not Quality-Space?**  
  Brenda's simulation verdict rejects "equations on paper" as sufficient. If she endorsed quality-space, she’d say Partial Mary could deduce red’s location—but she explicitly denied this for simulation Mary. Actual activation matters.  

  ---

  ### **3. Decisive Test Case to Separate Theories**
  **The Case: "Calibrated Partial Mary"**  
  - **Setup:** Partial Mary (protanope) learns all physical facts. *Before* gene therapy, she uses a perfect neuroprosthetic that translates red light into a *non-visual* modality she already knows (e.g., a specific sound frequency or tactile pattern). She becomes expert at identifying "red" via this prosthetic. After mastering this, she receives the gene therapy and sees a red tomato for the first time.  
  - **Question:** Does she learn anything new when she sees red *visually*?  

  **What This Shows:**  
  - **Ability-Camp Prediction:** *No new knowledge.*  
    - She already has the ability to discriminate, imagine, and recognize red via the prosthetic. Visual red adds no new functional capacity.  
  - **Phenomenal-Concept Prediction:** *Learns something new.*  
    - The prosthetic gave her a "red marker," but seeing red visually supplies a new *phenomenal concept* tied to vision. She couldn’t anticipate the visual quale.  
  - **Quality-Space Prediction:** *No new knowledge.*  
    - She mapped red’s relational position (e.g., "between orange and magenta") via the prosthetic. Visual experience just fills in the modality-specific "feel."  

  **Why It Divides Brenda?**  
  - If Brenda says Mary learns something new, she’s likely in the phenomenal-concept camp (experiences are modality-specific).  
  - If she says no new knowledge, she aligns with ability/quality-space (focusing on structural discrimination). Her simulation verdict hints she’d choose the former—actual *visual* activation matters, not proxies.  

  ---

  ### **Summary for Your Tenner**  
  - **Brenda’s Likely Tuesday Verdict:** Partial Mary learns something new (a first-person experience of red), but her surprise is muted compared to ordinary Mary due to her pre-existing color acquaintance.  
  - **Your Best Bet:** Argue for the *phenomenal-concept* reading of Brenda. Her simulation and robot verdicts show she ties knowledge to embodied experience, not structure or abilities alone.  
  - **Wildcard:** If Brenda rules "no new knowledge" for Partial Mary, she’s likely closer to quality-space—but her track record makes this unlikely.  

  Let me know how Tuesday goes—I’m invested in the tenner now!
