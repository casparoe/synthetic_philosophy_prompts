prompt: |-
  I'm helping a regulatory agency choose one decision rule for cost-benefit analysis under risk: a single formula that staff economists will apply to hundreds of unrelated projects a year (vaccine approvals, dam safety, wildfire mitigation, biosecurity containment), with the resulting number published and open to legal challenge. Before I look at any candidate rule, I want the specification. What must a risk-weighting rule deliver to count as adequate for that job, with the case or consideration behind each requirement, and which of those requirements are genuinely non-negotiable as opposed to the hobby-horses of one camp?

  My draft list, with the case I have in mind for each:

  1. Take a definite stand on the classic Allais and common-ratio patterns — accommodate them in the formalism, or give a principled account of why they are error. Silence is not acceptable.
  2. Stay calibrated across stake sizes: modest, well-documented aversion to a small-stakes coin flip must not compound into refusing plainly favorable large-stakes gambles.
  3. Give real weight to low-probability, irreversible, catastrophic losses, rather than letting them vanish because they are unlikely.
  4. Avoid fanaticism — a vanishingly small chance of an astronomically large payoff must not automatically dominate every ordinary project — and avoid achieving this by a hard probability cutoff, since any cutoff can be defeated by slicing one risk into many smaller ones.
  5. Behave consistently under changes of bracketing: a portfolio of independent projects should not get one verdict project-by-project and the opposite verdict as a single aggregate distribution, or if it does, the rule must say which bracketing is authoritative and why.
  6. Say whether it evaluates a single decision or the policy of following the rule repeatedly, and what it recommends when a plan that is optimal from the outset is one the agency will later want to abandon midway.
  7. Say whose risk attitude enters the formula when the people bearing a risk are not the people receiving the benefits, and when citizens disagree among themselves; it must not quietly substitute the agency's own attitude for the social one.
  8. Pin the risk attitude down by a fixed, publicly specified calibration procedure rather than fitting it to each decision, so that a verdict cannot be retrofitted to an intuition.

  Tell me which of these are real desiderata for this job and which I should drop. Flag any pair you suspect cannot be jointly satisfied — I think 3 and 4 are jointly unsatisfiable, and that 5 is unsatisfiable together with matching ordinary narrow-bracketed choices, but I want to know if either suspicion is wrong. Name the single requirement that does the most work in excluding otherwise attractive candidates, and add any requirement I have missed that would disqualify a rule outright. Then, in a few lines each and no more, score three contenders: expected utility with a concave utility index, a risk-weighted rule that re-weights probabilities rather than only outcomes, and a safety-first rule that maximizes the worst outcome.
reasoning: |-
  Okay, the user is helping a regulatory agency choose a decision rule for cost-benefit analysis under risk. This rule will be applied to hundreds of unrelated projects each year, and the results will be published and subject to legal challenges. They've drafted a list of requirements and want to know which are essential, which can be dropped, and if any pairs conflict. They also suspect that requirements 3 and 4 might be incompatible, and that 5 might conflict with matching narrow-bracketed choices.

  First, I need to assess each requirement. Requirement 1 is non-negotiable because the rule must address Allais and common-ratio paradoxes to avoid internal inconsistencies. Silence here would open the agency to legal challenges, especially since these paradoxes are well-known in decision theory. 

  Requirement 2 is crucial for consistency across stake sizes. If the rule isn't calibrated, small-scale risk aversion could lead to rejecting large-scale beneficial projects, which is impractical. This is a common critique of expected utility with high curvature, so it's a must-have.

  Requirement 3 (catastrophic loss weighting) and 4 (avoiding fanaticism) seem conflicting. The user suspects they can't both be satisfied. Catastrophic losses need attention even if low probability, but allowing tiny chances of huge payoffs to dominate isn't feasible. Rules like expected utility might ignore catastrophes, while others like maxmin are too extreme. This is a real tension; perhaps a bounded utility function could help, but hard cutoffs are problematic per requirement 4. 

  Requirement 5 (consistency under bracketing) is vital for aggregation. If project-by-project vs. portfolio evaluations conflict, the rule must specify which takes precedence. Expected utility satisfies this, but risk-weighted rules might not, leading to manipulable decisions. Non-negotiable because the agency handles many unrelated projects.

  Requirement 6 addresses dynamic consistency. If the optimal plan might be abandoned later, the rule must clarify whether it evaluates single decisions or repeated policies. This is important for projects with multiple stages, like dam safety. Maybe negotiable but still important.

  Requirement 7 is about whose risk preferences are considered. The agency shouldn't impose its own; societal preferences are key. Disagreements among citizens need a method, like using a representative agent or averaging. Non-negotiable to avoid bias and legal challenges.

  Requirement 8 requires a fixed calibration. Ad-hoc fitting would undermine transparency and invite legal disputes. Must be non-negotiable for consistency across projects.

  Now, conflicting pairs: 3 and 4 indeed conflict. Weighting catastrophes without fanaticism is tough. Expected utility with bounded utility might work but requires careful calibration. Requirement 5 conflicting with narrow bracketing—yes, if the rule isn't linear in probabilities, bracketing matters. Expected utility handles this, but others don't.

  The most excluding requirement is probably 5 (bracketing consistency) because many alternatives to expected utility fail here. Requirement 7 (whose risk attitude) is also critical as it affects legitimacy.

  Missing requirements? Maybe computational tractability for hundreds of projects, but the user might assume that. Also, transparency for legal challenges—formulas must be understandable. But the listed ones cover key points.

  Scoring contenders:
  - Expected Utility: Handles bracketing and calibration well but might underweight catastrophes or require high risk aversion leading to stake-size issues. Fits 5 and 8 but struggles with 3.
  - Risk-Weighted (e.g., rank-dependent): Can address Allais paradox and catastrophes but fails bracketing (5) and might have calibration issues. Fanaticism risk too.
  - Safety-First (maxmin): Focuses on worst-case, good for catastrophes but ignores probabilities, leading to fanaticism avoidance failure. Bracketing might be inconsistent.

  So, expected utility is the most robust despite its flaws. The user needs to balance these trade-offs, especially between 3 and 4. Highlighting the conflicts is key for their decision.
answer: |-
  Below is a structured evaluation of your requirements, followed by contender assessments. Requirements marked **★** are non-negotiable for regulatory legitimacy; others are contextually important but negotiable with robust justification.

  ---

  ### **Evaluated Requirements**
  | # | Requirement                      | Verdict & Case                                                                                                | Non-Negotiable? | Conflicts With |
  |---|----------------------------------|---------------------------------------------------------------------------------------------------------------|-----------------|----------------|
  | 1 | **Resolve Allais/common-ratio**  | **Keep.** Avoids internal inconsistency; legal challenges will exploit ambiguity in foundational paradoxes.    | ★ Yes          | None           |
  | 2 | **Stake-size calibration**       | **Keep.** Prevents "risk aversion" from rejecting Pareto improvements (e.g., rejecting high-return infrastructure). | ★ Yes          | None           |
  | 3 | **Weight catastrophic losses**   | **Keep.** Essential for existential risks (e.g., pandemics, dam failures).                                    | ★ Yes          | 4              |
  | 4 | **Avoid fanaticism**             | **Keep.** Prevents marginal projects being vetoed by speculative mega-risks (e.g., "dragon king" scenarios).   | ★ Yes          | 3              |
  | 5 | **Bracketing consistency**       | **Keep.** Mandatory for portfolio decisions (e.g., evaluating 100 independent vaccine trials jointly vs. singly). | ★ Yes          | Risk-weighted rules |
  | 6 | **Dynamic consistency**          | **Negotiable.** Relevant for multi-stage projects (e.g., nuclear waste storage) but can be handled procedurally. | No             | None           |
  | 7 | **Specify risk attitude source** | **★ Keep.** Prevents paternalism; requires democratic input (e.g., using survey data for public risk preferences). | ★ Yes          | None           |
  | 8 | **Fixed calibration**            | **★ Keep.** Critical for transparency/auditability (e.g., courts can verify if $u(x)$ is applied uniformly). | ★ Yes          | None           |

  **Key Tensions:**
  - **3 vs. 4 (Confirmed Conflict):** Weighting catastrophes (e.g., 0.001% chance of 1B deaths) without allowing fanaticism (e.g., 1e-100 chance of 1e100 lives saved dominating) is mathematically impossible without bounded utility or ad hoc bounds.  
  - **5 vs. Narrow Bracketing:** Expected utility satisfies 5 linearly; others (e.g., prospect theory) fail unless aggregation is explicitly defined.

  **Most Exclusionary Requirement:**  
  **#5 (Bracketing consistency)** eliminates otherwise appealing rules (e.g., rank-dependent utility).  

  **Missing Requirement:**  
  - **Computational tractability:** Must handle 100+ projects/year with auditable calculations.  
  - **Non-arbitrary parameters:** Avoid rules requiring project-specific tuning (e.g., "catastrophe" thresholds).

  ---

  ### **Contender Assessments (≤3 lines each)**
  1. **Expected Utility (EU) with Concave Utility**  
     *Strengths:* Satisfies 2,5,6,8 perfectly; simplest for legal defense.  
     *Weaknesses:* Fails 3 (underweights catastrophes), struggles with 1/4 (requires extreme curvature, violating 2).  
     *Verdict:* Best baseline but inadequate alone for catastrophes.

  2. **Risk-Weighted Utility (e.g., Rank-Dependent)**  
     *Strengths:* Addresses 1 (Allais) and 3 (catastrophes via probability weighting).  
     *Weaknesses:* Violates 5 (bracketing inconsistency), risks fanaticism (4), and calibration (8) is subjective.  
     *Verdict:* Theoretically flexible but legally vulnerable.

  3. **Safety-First (Maxmin)**  
     *Strengths:* Excels at 3 (avoids catastrophes), simple.  
     *Weaknesses:* Violates 2/4 (rejects all gambles with any loss; extreme fanaticism), ignores probabilities.  
     *Verdict:* Unusable for balanced regulation.

  ---

  ### **Recommendations**
  - **Prioritize EU + catastrophe modifications** (e.g., bounded utility, hybrid models) to reconcile 3 and 4.  
  - **Non-negotiable core:** 1,2,3,4,5,7,8. Drop 6 if procedural safeguards exist.  
  - **Critical calibration:** Use public wealth/life-risk surveys (e.g., mortality VSL studies) to anchor risk attitudes objectively.  

  This framework ensures robustness against legal challenges while balancing axiomatic integrity and regulatory practicality.
