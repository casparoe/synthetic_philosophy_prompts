prompt: |-
  You are a philosopher of mind and epistemology who works on perception, and who has also done applied work on evidence assessment and research-integrity review. Please think carefully and work in two stages. First, brainstorm: lay out the distinctions from the literature on the cognitive penetration of perception that could matter here — penetration of experience versus penetration of judgment, reporting or response; whether a reported effect is better explained by task demands, imagery, or memory than by a change in what was seen; encapsulation and modularity, and the reply that apparent penetration shows up mainly under degraded, brief or ambiguous stimulus conditions; the difference between penetration by long-term perceptual learning and expertise and penetration by an occurrent belief, hope or desire about the very hypothesis at hand; the worry that an experience shaped by the belief it is supposed to confirm cannot give non-circular support; and the 2016 Behavioral and Brain Sciences review by Firestone and Scholl, which argued that the published reports of top-down effects on perception do not establish what they are taken to establish. Say explicitly which of these distinctions must survive being turned into a five-minute checklist for someone with no training in the field, and which should be dropped as unusable at the front line.

  Then write the procedure. I am the verification lead for a citizen-science biodiversity recording platform whose records feed a national species atlas, and that atlas is used for Red List assessments, for designating protected sites, and as evidence in planning decisions that are legally binding on landowners. My reviewers are volunteers with no psychology or philosophy background; they handle roughly three to four hundred verification decisions a week at about five minutes each, and any downgrade has to be defensible in a two-sentence note to the volunteer who submitted the record, many of whom are the same people we ask to go out again next week. I can also change what we collect at submission time, if that is where the real fix lies, so tell me which fields the form should capture. What I need is an ordered set of questions to run on a record, what counts as a sufficient answer to each, the points where the procedure stops and says no or downgrades the record to anecdotal or corroboration-only status, and the points where it hands the decision to a named human because the remaining question is one of values rather than facts — the asymmetric costs matter here, since a false positive record can freeze a housing development while a false negative can hide the collapse of a species that was already declining. Some of my reviewers think the answer is simply to require photographs; I do not think that settles it, because the photographer chooses what to frame and a photo is still classified by someone with expectations of their own.

  Please then run the procedure on three cases and show your work, not just the verdicts. First: an experienced volunteer with a long county listing history reports a rare vagrant warbler at a well-known migrant trap, eighteen hours after a rare-bird alert naming that species goes out to the local email list; a twelve-second view, no photograph, detailed written field notes, three further observers reporting the same bird later that day after the same alert; it would be a first county record and my communications team has already drafted the press release. Second: a novice submits a blurred photograph of one member of a well-known lookalike species pair, during a week in which the platform targeted her postcode with a prompt to look for that species. Third, at the level of the whole dataset rather than a single record: during weeks when we run those targeted prompts, reports of the target species rise by around forty per cent, and the prompt is my team's most-used engagement feature and appears in the deck we show funders. If the procedure says something about that third case that costs me a feature I built, I would rather hear it now than in the annual review. Finally, flag the cases the procedure cannot settle at all, be honest about which of its steps are judgment calls dressed up as procedure, and say plainly what this procedure must not be used for — including, I suspect, whether it may be used to tell a volunteer what they really saw rather than what their record is worth as evidence.
reasoning: |-
  We are creating a verification procedure for a citizen-science biodiversity platform. The goal is to assess the reliability of submitted records, with a focus on potential cognitive biases, especially cognitive penetration of perception. We must be efficient (5 minutes per record) and user-friendly for volunteers with no background in psychology or philosophy.

  Key distinctions from the literature that are relevant and must be distilled into a checklist:

  1. **Penetration of experience vs. judgment (or response)**: We need to distinguish whether the observer's experience (what they saw) was altered by their beliefs/desires, or whether the alteration happened at the level of judgment (interpretation of what they saw) or reporting. The latter is more common and less problematic for perception.

  2. **Alternative explanations (task demands, imagery, memory)**: Could the reported effect be explained by the observer trying to please the task (e.g., reporting what they think we want), by mental imagery (imagining the target species), or by memory distortions (especially if the observation was brief or long ago)?

  3. **Stimulus conditions**: Degraded, brief, or ambiguous viewing conditions make misperception more likely and top-down effects more plausible.

  4. **Long-term learning (expertise) vs. occurrent bias**: Long-term expertise (e.g., birders with years of practice) can improve perception and is generally reliable. Occurrent bias (a current hope or belief about the presence of a specific species) is more problematic because it can lead to circular confirmation.

  5. **Circularity of evidence**: If an experience is shaped by the very belief it is supposed to confirm, then it cannot provide independent evidence. This is a critical point for scientific evidence.

  6. **Firestone and Scholl (2016) review**: They argue that many reported top-down effects on perception are actually effects on judgment, attention, or memory, not on perception itself. We should be skeptical of claims that perception is altered without strong evidence.

  Which distinctions survive for a 5-minute checklist?

  - We must include: 
    - Stimulus conditions (especially brief, degraded, or ambiguous) as a red flag.
    - Distinguishing between long-term expertise (which is good) and occurrent bias (which is bad) — but we can operationalize this by looking at the observer's experience level and the context (e.g., were they primed by an alert?).
    - Alternative explanations (especially task demands and memory) — we can ask about the circumstances of the observation and the presence of corroborating evidence.
    - The circularity worry: if the observer was expecting the species, then their report might not be independent evidence.

  - We can drop or simplify:
    - The philosophical distinction between experience and judgment might be too subtle. Instead, we can focus on observable factors like the quality of the observation and the presence of biases in the context.
    - Modularity and encapsulation: too theoretical. We can focus on the practical indicators of reliability.

  Proposed Procedure:

  We'll design an ordered set of questions. The procedure must:

  - Be efficient (5 minutes total).
  - Lead to a decision: accept, downgrade (to anecdotal or corroboration-only), reject, or escalate to a human.
  - Provide a two-sentence note for the submitter if downgrading or rejecting.
  - Consider asymmetric costs: false positives (e.g., freezing development) are very costly, false negatives (missing a decline) are also costly but we have many records.

  We can change the submission form to capture key information. Suggested additional fields:

  - At submission:
    - Duration of observation (free text: e.g., "5 seconds", "10 minutes").
    - Viewing conditions (dropdown: clear, hazy, foggy, rainy, dark, etc. — or just a note if poor conditions).
    - Any prior knowledge that might influence? (e.g., "Were you aware of recent reports of this species in the area? Yes/No" — but note that this might be underreported or bias the submitter. Alternatively, we can infer from context.)
    - Was a photograph taken? (Yes/No) and if not, why? (optional: forgot, too quick, etc.)
    - For the platform: we can track if the record was submitted during a targeted prompt for that species.

  But note: we don't want to overload the form. We can also use metadata (e.g., if a rare-bird alert went out, we know the date/time and can compare to submission time).

  The Procedure:

  We'll have a flowchart-like set of questions. We start with the most critical and efficient filters.

  1. **Is there a photograph?** 
     - If yes, move to photo assessment (but note: photo can be poor or ambiguous).
     - If no, then we must rely on notes and context.

  But note: even with a photo, the framing and the classifier's expectations matter. So we need to assess the photo quality and the context.

  Order of questions:

  Step 1: **Check for unambiguous evidence.**
     - Is there a clear, diagnostic photograph or video? (Diagnostic = shows key features that distinguish from lookalikes.)
       - If yes, and the photo is of high quality (clear, not blurry, shows key features) and the species is easily identifiable from the photo, then accept (unless there are other red flags).
       - If the photo is poor (blurry, distant, doesn't show key features) then we treat it as if there is no photo.

  Step 2: **Assess the observation conditions.**
     - How long was the observation? (If < 30 seconds, flag as brief.)
     - What were the viewing conditions? (If poor: e.g., fog, rain, dark, heavy foliage, etc.)
     - If the observation was brief OR conditions were poor, then we proceed with caution.

  Step 3: **Check for potential occurrent bias.**
     - Was the observer aware of a recent report of this species in the area? (We can know this from metadata: e.g., if a rare-bird alert was sent and the record is submitted within, say, 48 hours, or if the record was submitted during a targeted prompt for that species.)
     - If yes, then there is a risk of circularity and bias.

  Step 4: **Assess the observer's expertise.**
     - We can have a system of observer reliability scores (based on past verification rates) or use their self-reported experience level (if we collect that). Alternatively, we can look at their history (number of records, how many were verified).
     - But note: we don't want to penalize novices unfairly. So we use expertise as a factor but not a sole determinant.

  Step 5: **Look for corroborating evidence.**
     - Are there independent reports of the same species at the same location and time? (If yes, that supports the record.)

  Step 6: **Consider the species context.**
     - Is it a common species? Then we are more lenient.
     - Is it a rare species or a lookalike? Then we require more evidence.

  Step 7: **Assess the written notes.**
     - Do the notes describe key diagnostic features? Do they mention considering and ruling out lookalikes?

  Step 8: **Decision points:**
     - If we have a clear photo, and no other red flags, accept.
     - If no photo, but the observer is experienced, the observation was long and in good conditions, and the species is common, accept.
     - If no photo, and any of: brief observation, poor conditions, occurrent bias (e.g., recent alert), and the species is rare or a lookalike, then we downgrade or reject.
     - If there is independent corroboration (multiple observers at the same time), that can overcome some issues.

  Downgrade to "anecdotal" (not used for atlases) or "corroboration-only" (only valid if there is other evidence) when:
     - The evidence is weak and there is a risk of cognitive bias (e.g., no photo, brief view, and the observer was primed by an alert).

  Escalate to a human when:
     - The case is borderline and involves a high-stakes species (e.g., a first record) or when the decision requires weighing complex factors (e.g., the cost of a false positive vs. false negative).

  We must be clear that the procedure does not tell the volunteer what they saw, only the evidential weight we can assign to the record.

  Now, the procedure in steps:

  **Verification Procedure for a Single Record**

  1. **Photograph or other physical evidence?**
     - If there is a clear, diagnostic photograph/video: go to step 2.
     - If no photograph, or the photograph is non-diagnostic (blurry, doesn't show key features, etc.): go to step 3.

  2. **Assess the photograph:**
     - Is the photo of high quality (clear, well-lit, shows key diagnostic features) and unambiguously the reported species? 
       - Yes: then the record is provisionally accepted (go to step 8 for context checks).
       - No: treat as if no photo (go to step 3).

  3. **Observation duration:**
     - Was the observation brief (less than 30 seconds) OR were conditions poor (e.g., fog, rain, dusk, dense cover)? 
       - Yes: flag as "low-evidence" and go to step 4.
       - No: go to step 4.

  4. **Occurrent bias check:**
     - Was the observer likely influenced by a recent alert or targeted prompt? (Check metadata: if the record is of a species that was the subject of a platform prompt in that area in the last week, or if a rare-bird alert for that species went out in the last 48 hours and the record is within the alert area.)
       - Yes: flag as "potential bias" and go to step 5.
       - No: go to step 5.

  5. **Observer expertise:**
     - Is the observer highly experienced? (Define by: more than 50 verified records in the same taxon, or a known expert as per our list.)
       - Yes: consider this a positive factor.
       - No: note that the observer is less experienced.

  6. **Corroborating evidence:**
     - Are there independent reports of the same species at the same location and time (within, say, 24 hours) by other observers? 
       - Yes: strong corroboration.
       - No: no corroboration.

  7. **Species context:**
     - Is the species common and easily identifiable? (Use a pre-defined list of common species that are not easily confused.)
     - Or is it rare and/or part of a lookalike pair? (Use a pre-defined list of rare species and lookalike groups.)

  8. **Written notes:**
     - Do the notes describe key diagnostic features and rule out lookalikes? 
       - Yes: positive.
       - No: negative.

  9. **Decision matrix:**
     - If there is a clear photo (from step 2) and no occurrent bias (step 4) and the species context is non-critical (common or not a lookalike), then ACCEPT.
     - If there is a clear photo but occurrent bias is present, then still ACCEPT (because the photo is objective) but note that the context of bias is recorded for future reference.
     - If no photo, then:
          - If the observation was not brief and conditions were good, and the observer is experienced, and the notes are good, and no occurrent bias: ACCEPT.
          - If any of: brief/poor conditions, occurrent bias, or inexperienced observer, then:
              - If there is strong corroboration: ACCEPT (but note that the record is dependent on the corroboration).
              - If no corroboration: DOWNGRADE to "anecdotal" (not for atlas use) or "corroboration-only" (only valid if other evidence exists). 
     - For very high-stakes records (e.g., first county record) without a photo and with occurrent bias, even with corroboration, we may need to ESCALATE to a human for a second look.

  10. **Escalation rules:**
      - Escalate to a named expert (human) if:
          - The record is of a critically endangered species or a first record and the evidence is weak (no photo, brief, bias) but there is some corroboration.
          - When the decision has high asymmetric costs and the automated procedure is inconclusive.

  **Two-sentence note for downgrading:**
  Example: "We could not verify this record due to the brief observation time and the lack of a photograph. Please try to get a photo next time, especially for rare species."

  **For the entire dataset during targeted prompts:**
  - We note that reports of the target species rise by 40% during prompts. This could be due to increased effort (good) but also due to expectation effects (bad). We must adjust for this in the atlas data by flagging records from prompted periods as potentially less reliable. We might not use them for trend analyses without corroboration.

  **On the three cases:**

  Case 1: Rare warbler, experienced volunteer, no photo, 12-second view, after a rare-bird alert, with detailed notes and later corroboration.

  - Step 1: No photo -> step 3.
  - Step 3: Brief (12 seconds) -> flag low-evidence.
  - Step 4: Occurrent bias (alert 18 hours prior) -> flag potential bias.
  - Step 5: Experienced -> positive.
  - Step 6: Corroboration (later reports, but note: same day after the same alert -> not independent? They might have been influenced by the alert too). However, they are independent observers. We'll count as corroboration.
  - Step 7: Rare species and first record -> high stakes.
  - Step 8: Notes detailed -> positive.

  Decision: Without a photo, brief observation, and occurrent bias, we would normally downgrade. But there is corroboration and the observer is experienced. However, because it's a first record and high stakes, we ESCALATE to a human. The human might decide to accept because of the corroboration and the observer's track record, but note the bias risk.

  Note to submitter if downgraded: "For rare species, we require a photograph or longer observation to confirm. Your record has been noted and will be reviewed by an expert." But in this case, we escalate so no note until after human review.

  Case 2: Novice, blurred photo of a lookalike species, during a targeted prompt.

  - Step 1: Photo, but blurred -> non-diagnostic -> step 3.
  - Step 3: We don't know duration or conditions? Assume we have that info. If not, we have to ask. But the form should capture duration and conditions. Suppose the form says "a few seconds" and conditions were clear.
  - Step 4: Occurrent bias (targeted prompt) -> flag.
  - Step 5: Novice -> negative.
  - Step 6: No mention of corroboration -> none.
  - Step 7: Lookalike species -> critical.

  Decision: Non-diagnostic photo, so treated as no photo. Brief observation (assumed), occurrent bias, novice, no corroboration, and lookalike species -> DOWNGRADE to anecdotal.

  Note: "The photo provided is not clear enough to confirm the species, especially since it is a lookalike. Please try to get a clearer photo next time."

  Case 3: Dataset level during targeted prompts.

  - We note that reports of the target species increase by 40% during prompts. This could be due to:
     a) Increased effort (more people looking, so more records) -> valid.
     b) Expectation effects (people reporting the species because they expect it, even if they didn't see it clearly) -> invalid.

  Our procedure flags records during prompts as having potential occurrent bias. Therefore, for the atlas, we might treat these records as requiring additional scrutiny. We can:
     - Only accept prompted records if they have a clear photo or if they are by experienced observers with no other red flags.
     - Or, we can use them but with a lower weight in analyses.

  This means that the prompt feature might lead to less reliable data for the target species during the prompt period. We must inform funders that while the prompt increases engagement, we have to adjust the data quality. Alternatively, we can design prompts to minimize bias (e.g., by asking for photos and by not overemphasizing the target species).

  **Limitations of the procedure:**
  - It cannot tell the volunteer what they really saw; it only assesses the record as evidence.
  - Some steps are judgment calls (e.g., what counts as a diagnostic photo? what is brief? what is poor conditions?) — we try to operationalize (e.g., brief = <30 seconds; poor conditions = predefined list) but there will be gray areas.
  - The procedure is not for research on perception; it's for evidence assessment in citizen science.
  - It must not be used to question the honesty of the volunteer, only the reliability of the evidence.

  **Conclusion:**
  The procedure will help standardize verification, but we must train reviewers on the steps and have a human escalation path for high-stakes cases. We also adjust the submission form to capture key data (duration, conditions, and we use metadata for prompts and alerts).
answer: |-
  ### Brainstorm: Key Distinctions from Cognitive Penitration Literature
  I'll distill the literature on cognitive penetration of perception into essentials, flagging which distinctions are usable in a 5-minute volunteer checklist. Unusable distinctions are either too theoretical or require specialized knowledge to apply reliably.

  1. **Penetration of experience vs. judgment/reporting/response**  
     - **Core distinction**: Did beliefs alter the *visual experience itself* (e.g., literally seeing a common bird as rare), or just the *interpretation/reporting* (e.g., mislabeling what was seen)?  
     - **Usable? Partially**. Volunteers can't assess internal experiences. Focus instead on observable red flags for biased *judgment* (e.g., rushed ID after an alert). Drop "experience" as unverifiable. Keep "judgment/reporting risks" via contextual clues.  

  2. **Alternative explanations (task demands, imagery, memory)**  
     - **Core distinction**: Is the effect better explained by non-perceptual factors? (e.g., *task demands*: observer seeks rewards; *imagery*: "seeing" expected traits; *memory*: details shifting post-observation).  
     - **Usable? Yes**. Volunteers can flag:  
       - **Task demands**: Was the observer prompted to find this species?  
       - **Memory**: Was the view brief/old?  
       - **Imagery**: Does the description overemphasize expected traits?  

  3. **Stimulus conditions (degraded/brief/ambiguous)**  
     - **Core distinction**: Top-down effects are likelier when stimuli are unclear.  
     - **Usable? Yes**. Straightforward: "Was the view short, distant, or obscured?" Include in checklist.  

  4. **Long-term expertise vs. occurrent bias**  
     - **Core distinction**: Perceptual learning (e.g., expert birders) improves accuracy, but *occurrent* beliefs (e.g., "I hope this is the rare warbler!") can distort.  
     - **Usable? Yes**. Key for volunteers:  
       - **Expertise**: Trust experienced observers more.  
       - **Occurrent bias**: Did the observer know about a recent alert/target? This is critical.  

  5. **Circular evidence problem**  
     - **Core distinction**: If belief shapes perception, it can't independently confirm that belief (e.g., "I saw it because I expected it").  
     - **Usable? Yes**. Operationalize as: "Was the observer aware of the species being 'wanted'? If yes, require stronger evidence."  

  6. **Firestone & Scholl (2016) critique**  
     - **Core argument**: Most "top-down perception" effects are actually attention/memory/judgment errors.  
     - **Usable? Indirectly**. Emphasize that apparent "perception" issues are often *reporting* issues. Volunteers should prioritize objective evidence (photos, independent witnesses).  

  **Survives to Checklist**: Stimulus conditions, occurrent bias, task demands, memory risks, expertise, and circularity concerns.  
  **Dropped**: Experience/judgment dichotomy (unverifiable), encapsulation/modularity (too theoretical).  

  ---

  ### Verification Procedure for Biodiversity Records  
  **Goal**: Assess if a record is **reliable evidence** for conservation decisions. Asymmetric costs:  
  - **False positive** (e.g., wrong rare species) → Misallocates funds/halts development.  
  - **False negative** (e.g., missing true rare species) → Undetected extinction risk.  

  **Submission Form Additions** (low-burden, high-impact):  
  1. **Observation duration**: Numeric field (seconds/minutes).  
  2. **Conditions**: Dropdown (clear, fog/rain, low light, obscured).  
  3. **Prompt awareness**: "Did you see a prompt/target for this species? (Y/N)".  
  4. **Alert awareness**: "Were you aware of recent alerts for this species here? (Y/N)".  
  5. **Photo attempt**: "If no photo, why? (e.g., too fast, no camera)".  

  **Procedure Rules**:  
  - **5-minute limit**: Focus on high-risk flags.  
  - **Downgrades**: Record marked "anecdotal" (not for atlases/decisions) or "corroboration-needed" (only valid with other evidence).  
  - **Escalate to human**: When costs are asymmetric or values conflict (e.g., high-stakes species).  
  - **Submitter note**: 2 sentences max; polite, constructive.  

  **Ordered Questions**:  
  1. **Is the species common or easily confused?**  
     - *Sufficient answer*: Common = not on regional rarity/lookalike list.  
     - *Stop/downgrade*: If rare/lookalike AND no photo → Escalate to human if first record; else downgrade to "corroboration-needed".  
     - *Submitter note*: "Rare/lookalike species need photos. Try next time!"  

  2. **Was a diagnostic photo provided?**  
     - *Sufficient answer*: Photo shows key traits (e.g., wing bars for warblers) and is not blurred.  
     - *Stop/downgrade*: No photo OR non-diagnostic photo → Proceed to Q3. If photo is clear, ACCEPT (unless conflict in Q5).  
     - *Judgment call*: "Diagnostic" depends on species. Use reference guides.  

  3. **Were viewing conditions poor?**  
     - *Sufficient answer*: Duration <30 seconds OR conditions ≠ "clear".  
     - *Stop/downgrade*: Yes AND species rare/lookalike → Downgrade to "anecdotal".  
     - *Submitter note*: "Brief/poor views make IDs hard. Photos help!"  

  4. **Was there occurrent bias?**  
     - *Sufficient answer*: "Prompt/alert awareness" = YES OR record submitted <48h after alert.  
     - *Stop/downgrade*: Yes AND no photo → Downgrade to "corroboration-needed".  
     - *Escalate*: If high-stakes (e.g., first record) → Human weighs costs.  

  5. **Is the observer experienced?**  
     - *Sufficient answer*: >50 verified records OR known expert.  
     - *Stop/downgrade*: Novice AND rare/lookalike AND no photo → Downgrade to "anecdotal".  
     - *Values call*: Expertise isn't infallible. Human needed if bias + high stakes.  

  6. **Is there independent corroboration?**  
     - *Sufficient answer*: ≥1 other observer, same location/time, no shared bias.  
     - *Stop*: Corroboration overcomes single-observer issues → ACCEPT.  
     - *Judgment call*: "Independent" = not alerted together.  

  **Procedure Must NOT Be Used For**:  
  - Telling volunteers what they "really saw." Focus on *evidence quality*, not personal experience.  
  - Research integrity investigations (needs expert review).  
  - Common species with photos (automatic accept).  

  ---

  ### Case Applications  
  **Case 1: Rare Warbler Vagrant**  
  - **Context**: Expert, no photo, 12-second view, after alert, detailed notes, corroboration later same day. First county record; press release pending.  
  - **Procedure**:  
    1. **Species**: Rare/lookalike → Proceed.  
    2. **Photo**: None → Downgrade risk.  
    3. **Conditions**: Brief (<30s) → Downgrade risk.  
    4. **Occurrent bias**: Alert awareness → Downgrade to "corroboration-needed".  
    5. **Expertise**: Experienced → But bias + no photo override.  
    6. **Corroboration**: Later reports → BUT same alert → Not independent.  
  - **Verdict**: DOWNGRADE to "corroboration-needed" for atlas use. Press release paused.  
    - **Submitter note**: "Rare species need photos or longer views. We'll keep your record as needing more proof."  
    - **Why?** High occurrent bias + brief view + non-independent corroboration. Human escalation optional due to stakes, but procedure flags unreliability.  

  **Case 2: Novice, Blurred Photo of Lookalike**  
  - **Context**: Novice, blurred photo, during targeted prompt, no corroboration.  
  - **Procedure**:  
    1. **Species**: Lookalike → Proceed.  
    2. **Photo**: Blurred, non-diagnostic → Treat as no photo.  
    3. **Conditions**: Assume poor (blur implies distance/motion) → Downgrade risk.  
    4. **Occurrent bias**: Prompt awareness → Downgrade to "anecdotal".  
    5. **Expertise**: Novice → Reinforces downgrade.  
  - **Verdict**: DOWNGRADE to "anecdotal". Not for atlas.  
    - **Submitter note**: "Photos need clear details for lookalikes. Try again in better light!"  

  **Case 3: Dataset-Level Prompt Effects**  
  - **Context**: Reports rise 40% during prompts; prompts boost engagement.  
  - **Procedure**:  
    - **Per-record checks**: All prompted records flagged in Q4 (occurrent bias).  
    - **Dataset impact**: Records without photos during prompts are automatically downgraded. This reduces false positives but may lose true records.  
  - **Verdict**: **Accept for engagement, flag for science**.  
    - Prompts stay, but atlas uses only:  
      - Prompted records with photos, OR  
      - Non-biased records (no prompt/alert awareness).  
    - **Cost to your feature**: Yes—prompted records are deprioritized for high-stakes uses. Mitigate by:  
      - Requiring photos for prompted species.  
      - Using prompted data for "engagement metrics" only in funder decks.  
  - **Why?** Firestone & Scholl's critique applies: Rises may reflect attention/judgment errors, not true prevalence. Protects against circular evidence.  

  ---

  ### Honest Assessment  
  - **Judgment calls dressed as procedure**:  
    - "Diagnostic" photos (species-dependent).  
    - "Independence" of corroboration (e.g., same alert).  
    - Expertise thresholds (50 records is arbitrary).  
  - **Unsettled cases**:  
    - High-stakes records with bias but strong corroboration (e.g., Case 1). Human must decide.  
    - When volunteers omit/lied on "awareness" fields (procedure assumes honesty).  
  - **Critical limitation**: This assesses *records as evidence*, not the volunteer's experience. Never say, "You didn't see that." Say, "We need more proof."  

  **Final Advice**: Pair this with photo mandates for rare species. It won't eliminate bias (framing/classifier effects remain), but it reduces the most acute risks. For your engagement prompts, celebrate participation while separating "fun" data from "evidence" data. The procedure prioritizes avoiding false positives—this is non-negotiable for legal/Red List uses.
