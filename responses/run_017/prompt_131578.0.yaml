  **Timeline (90 minutes):**

  0:00 - 0:05 (5 min): **Setup and Fragment Collection**
  - Facilitator hands out index cards and explains the fragment types without theoretical framing. Prompt: "Write one item for each category on a separate card. Be genuine but not deeply personal. Choose things you are comfortable sharing in this context. You can redact anything too private. We are building kits of personal fragments."

    Categories (write on board or slide):
    1. **Memory:** A specific, vivid memory (e.g., "the time I got lost in a forest at age 10").
    2. **Style:** A verbal mannerism or characteristic way of speaking (e.g., "I often say 'to be fair' before making a point").
    3. **Project/Value:** An unfinished project or a strongly held value (e.g., "my half-written novel about time travel" or "my commitment to environmental justice").

  - Each student writes one card per category (3 cards total). They write their name on the back of each card. They are told they can skip a category if they are uncomfortable, but they must provide at least two.

