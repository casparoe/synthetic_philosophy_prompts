  0:45 - 0:50 (5 min): **Voice-Token Choice**
  - The Room must decide who speaks for the Subject. They are given the voice-token and must award it to one of the four (I1, I2, I3, or S). They cannot split it. They discuss for 3 minutes and then vote by show of hands. The majority wins.

