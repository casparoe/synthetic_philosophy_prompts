  - Each Inheritor delivers their response to the room (one at a time, in a specified order). The Subject remains silent and observes.
  - The Room (R) judges each Inheritor (and also the Subject, but note: the Subject is silent, so how? We must adjust: The Subject is not judged in this round because they are silent. We judge only the Inheritors. Alternatively, we can have the Subject write a response and then read it after the Inheritors? But that breaks silence. Instead, we can skip judging the Subject in Round 1 and introduce them in Round 2 after degradation. Let's adjust the plan: In Round 1, we judge only the three Inheritors. Then in Round 2, after degrading the Subject, we include the Subject and the Inheritors.)

