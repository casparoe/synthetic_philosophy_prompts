  **Handout Prompts (in order):**

  1. **Fragment Collection (0:00):** 
     "On each index card, write one fragment of yourself. Use one card per category. Write your name on the back.
      - **Memory:** A specific, vivid memory (e.g., 'the time I got lost in a forest at age 10').
      - **Style:** A verbal mannerism or characteristic way of speaking (e.g., 'I often say "to be fair" before making a point').
      - **Project/Value:** An unfinished project or a strongly held value (e.g., 'my half-written novel about time travel' OR 'my commitment to environmental justice').
