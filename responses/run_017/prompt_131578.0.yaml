    - For the Subject: Since they have all three fragments but degraded, we must assign a score per fragment? But we don't have separate scores for each fragment. We have one overall score for the Subject. How to compute the ledger for the Subject? We must reconsider.

    Revised ledger for the Subject: The Subject has all three fragment types, but degraded. The ledger for the Subject would be: 
