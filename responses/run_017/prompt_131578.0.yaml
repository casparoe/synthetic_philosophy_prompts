  Key elements:
  - Real, mildly exposing personal fragments from each student.
  - One volunteer subject whose fragments are split unevenly among three inheritors (memories, style/mannerisms, projects/values).
  - The subject becomes silent (out of room or bound to silence).
  - Inheritors act as the subject in a novel situation, and the room judges (blind and in writing) the degree of the subject's presence in each.
  - A ledger system with weights assigned to fragment types (fixed by the room) to compute a score for each inheritor and the subject.
  - A degradation round: the subject's contributions are degraded (e.g., constrained to clichés, partial destruction of notes) while the inheritors remain intact. Then, the room judges again and must choose one voice-token (indivisible) for who speaks for the subject.
  - A chain round: one fragment is passed through a chain of people (who never met the source) and the ledger is applied to the last person in the chain.
  - A closing decision about the subject's unfinished project (complete in style, adapt, or leave) with reasons.

  We need to avoid:
  - Using the phrase "distributed self" or equivalent until debrief.
  - Framing lecture.

  We must handle:
  - Potential raw emotions (e.g., recent bereavement).
  - The subject treating it as a lark and breaking frame.
  - Drift into platitudes about commemoration.
  - Reluctance to assign numbers.

  Plan for 90 minutes (with minute marks).

