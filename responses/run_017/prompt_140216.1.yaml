  Okay, the user is writing a feature for a science magazine about the qualia debate. They want a joint statement between a qualia realist and someone who dismisses qualia as an empty concept. The key is to create a compact, five-point document that both sides could sign, highlighting their agreements, core disagreements, and a testable prediction.

  First, I need to recall the main positions. The qualia realist believes in subjective experiences beyond functional facts, supported by conceivability arguments. The eliminativist thinks qualia are redundant, reducible to behaviors and reports. The user specified five numbered items with brutal compression—no intros, conclusions, or citations.

  The first point should clarify what the dispute isn't about. Both agree that experiences exist and matter. The real issue is whether qualia, defined as intrinsic, non-representational, ineffable, and private, can differ while all functional facts remain identical. That's the classic philosophical divide.

  For the second and third points, each side's view needs wording they'd accept. The realist must emphasize the "further fact" revealed by conceivability arguments. The eliminativist should focus on qualia as an unnecessary posit. I need to avoid strawman formulations here.

  The fourth point addresses the crux. The user suspects part is verbal—whether "quale" must include those four properties. Also, if an undetectable state has any reality. The realist sees it as a genuine difference; the eliminativist calls it an empty posit.

  The fifth point is the experiment: slow color rotation over a year with recalibration. Both accept the setup. The realist predicts the subject chooses reversal, valuing the original qualia. The eliminativist predicts indifference. Each would see the opposite outcome as counterevidence. The user wonders if any result could move both—probably not, since it hinges on interpreting the choice.

  I should ensure neutrality. No jargon, just clear statements. The experiment is crucial because it translates philosophy into a testable scenario, even if it doesn't resolve the deeper disagreement. Ending on the fifth point's irreconcilability stays true to the user's request not to force resolution.
answer: |-
  Here is the joint statement draft:

  1.  **Agreed Basis:** Both parties affirm that conscious experience exists and matters profoundly. The dispute concerns *only* whether specific properties often bundled under "qualia" (intrinsic, non-representational, ineffable, and privately/directly apprehensible) denote a real aspect of reality *over and above* functional capacities, discriminatory behaviors, and verbal reports.
  2.  **Realist Position:** Qualia realism holds that there is a "further fact" about subjective experience, revealed by the conceivability of functional duplicates with inverted qualia, demonstrating that consciousness involves properties not exhausted by physical or functional description.
  3.  **Eliminativist Position:** Eliminativism holds that "qualia" as defined above is an incoherent or empty posit; all scientifically tractable facts about consciousness are captured completely by subjects' discriminative capacities, behavioral dispositions, and patterns of report (verbal or otherwise).
  4.  **The Crux:** The core disagreement is whether a hypothetical state difference *undetectable in principle* by any subject (through report, memory, or behavior) constitutes a genuine difference in conscious reality (Realist) or merely signifies an explanatory posit detached from any empirical criterion (Eliminativist). We agree that *some* disagreement stems from differing definitions of "quale" itself.
  5.  **The Test Case (Slow Rotation):** Both accept the slow color rotation scenario. **Realist Prediction:** Upon learning the truth, the subject will strongly prefer reversal to restore original qualia, sacrificing the year's learning. Choosing *not* to reverse would challenge this view. **Eliminativist Prediction:** The subject will be indifferent or refuse reversal, as no functional difference exists. Choosing reversal *would* challenge this view. We concur no outcome decisively settles the underlying philosophical dispute.
