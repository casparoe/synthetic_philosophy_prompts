answer: |-
  ## Remarks for the Hallie Brant Archive Transfer Ceremony

  [Adjust microphone, pause, look at the assembled group – Naomi, archivists, funders, producers, students]

  Thank you. It’s an honor, and frankly, a little overwhelming, to stand here today. We’re gathered to mark the transfer of the production archive for *Rent Strike* into the care of this library, alongside the extraordinary papers of Hallie Brant herself. Her letters, her case files, the recordings of meetings – the real, tangible evidence of a life fiercely lived in the service of others. And now, our boxes: scripts, call sheets, costume designs, and the digital ghosts of our film. It’s a profound act of trust, placing this fiction we’ve spun beside the bedrock of fact that Hallie left behind.

  As the screenwriter, I spend most of my time wrestling with words – finding the right ones, putting them in the right order, trying to make them feel alive. But preparing these remarks, I found myself stuck on something deeper than craft. It’s the weight of speaking *for*, or *about*, someone who is no longer here to speak for herself. Hallie Brant spent her life amplifying voices the world tried to silence. Now, we’ve made a film giving her a voice we constructed. And that responsibility, that unease, is what I want to speak to you about honestly today. Not as a confession, not as a defense, but as an acknowledgement of the complex ground we stand on when we try to translate a real life, especially one defined by integrity and struggle, into narrative.

  Hallie’s work was about truth – the messy, painful, often inconvenient truth of people’s lives, their housing, their struggles against systems stacked against them. Documentary evidence – like the papers in this archive – was her weapon and her shield. She built cases on facts. She demanded accountability through the record. So, what does it mean when we, filmmakers inspired by her, introduce elements *into* that record that are not, strictly speaking, fact?

  Our film does three things that step away from the literal documentary record. I need to name them, because they live in the tension between honoring a life and shaping a story, and because they’ll soon sit physically alongside Hallie’s own words in this archive.

  First, we created a character named Del. Del is a tenant organizer, a vital presence in the film’s narrative arc. But Del isn’t one person Hallie knew. Del is a composite, woven from the threads of three remarkable individuals Hallie worked alongside. We did this not to diminish any of those three real people, but because the story we were telling – about a specific campaign, a specific moment in Hallie’s journey – demanded a focus, a single point of connection, that the sprawling reality didn’t provide. We sacrificed the granular truth of three distinct lives to try and capture a deeper truth about the *kind* of collaboration, the *kind* of solidarity, that fueled Hallie’s work. Does that synthesis betray the individuals? Or does it attempt to honor the collective spirit they embodied? That’s a question we grappled with, and one the archive now holds.

  Second, there’s a pivotal scene where Hallie delivers a rousing public speech, a call to arms for the tenants' union. The passion in that speech, the arguments, the urgency – those *are* Hallie’s words. But she didn’t speak them in that specific moment, to that specific crowd. We built that speech by gathering sentences, phrases, and fervent convictions scattered across her *private letters*. We took the intimate, unguarded thoughts she shared with confidantes and projected them onto a public stage. Why? Because those private words revealed a fire, a clarity of purpose, a rhetorical power that we felt *defined* her public persona, even if no single recording captured it exactly that way. We moved her words from the private page to the public square she inhabited. Is that giving voice to her inner convictions? Or is it putting words into her mouth for our dramatic convenience? Both interpretations hold weight.

  The third step is the most difficult to discuss, especially knowing Naomi is here. In the film, there is a moment near the end depicting a reconciliation between Hallie and her estranged brother. We gave her a line in that scene. And I need to say clearly: this scene is an invention. It did not happen as we portray it. Furthermore, crafting that line broke a specific promise, a "silence rule," we made to the estate – that Hallie would never speak a line she was not documented as having said or written. We broke that undertaking. Naomi has rightly told us this reconciliation did not occur, and we acknowledge the pain and breach of trust this invention causes. Why did we include it? Not out of malice, but out of a flawed, perhaps hubristic, narrative impulse – a desire to resolve an emotional thread we saw running through her life and letters, a longing for closure that we projected onto her story. It was a failure to resist the pressure of the dramatic form, a failure to honor the specific boundary we had agreed upon. The wound between Hallie and her brother was real, documented in her papers; the healing we depicted was not. This is where the ethical line feels most stark, the potential for harm – even to someone no longer physically here – feels most acute. Because it touches the intimate, unresolved pain of family, and because we overstepped a clear agreement.

  My friend, a documentarian, framed this dilemma for me powerfully. She said the potential wrong isn't necessarily a *harm* to Hallie in a direct sense – she is gone. It’s something closer to a *betrayal*: a misuse of a voice silenced, an act of unfairness inscribed in the record that the person it concerns can *never* contest or correct. It risks taking her story away from her. That haunts me. And yet, the same friend argued the opposite impulse can also be true: that dramatization can sometimes reach for a *different kind* of truth – a truth about essence, about impact, about the emotional core of a life – that a strict recitation of facts alone might not convey. That a scene built from her private anguish or joy, even transposed to a fictional moment, might resonate with the spirit of who she was in a way a simple chronology does not.

  Holding these two truths simultaneously is the heart of the difficulty. It’s the question of what, if anything, we owe to the dead. Is it only fidelity to the documented fact? Or is it also an attempt to understand, to interpret, to make their lives resonate for those who never knew them? And when we put words in the mouth of a real person, what are we asserting? Are we claiming, "This is what she *would* have said"? That feels presumptuous, dangerous. Or are we saying, "This is what her life, her writings, her actions, lead *us* to believe she *might* have felt, condensed into a moment of drama"? That feels less certain, more fragile, but perhaps closer to the messy work of understanding another human being across time and silence. I don’t have a definitive answer. I wrestle with it constantly.

  So, what does it mean to place our film’s archive – with its composite character, its rearranged words, its invented scene – alongside Hallie Brant’s own papers? It’s not because we claim they hold the same kind of truth. Hallie’s letters *are* evidence; they are fragments of her lived experience, direct transmissions from her mind and heart. Our film is an *interpretation*; it’s an argument, built on evidence, shaped by craft and necessity and, yes, our own limitations. It’s a story *about* her life, not the life itself.

  But placing them together creates a dialogue. It allows the raw material – Hallie’s own voice, unfiltered – to sit right next to the artistic reflection built upon it. It allows researchers, students, future viewers, to see the source, and then see what the filmmaker drew from it, what we invented, where we diverged. It makes the process visible. It invites scrutiny. It says: "Here is the woman. Here is *a story* about the woman. Compare them. Question the choices. Understand the gap." The archive doesn’t just preserve truth; it can also preserve the *conversation about* truth, the struggle to represent it. By including our flawed attempt alongside her authentic record, this library isn’t endorsing our inventions; it’s providing the tools to understand them, to critique them, and perhaps, to better understand the complex alchemy of turning life into narrative.

  To the documentary students here: This tension – between factual accuracy and narrative truth, between respecting the subject and serving the story – is your battleground. I offer our choices, and my own deep ambivalence about some of them, not as a model, but as a case study. Argue about it! Debate where the line should be drawn, whether we crossed it, and why it matters. That debate *is* honoring the complexity Hallie herself navigated.

  To Naomi: I cannot undo the hurt caused by breaking the silence rule, by inventing that scene. I offer no easy justification. I can only reiterate our profound respect for your mother’s legacy and our sincere regret for the pain this specific choice has caused you. Your presence here, amidst this difficult honesty, speaks volumes about your strength and your commitment to your mother’s memory. Thank you.

  And finally, how do we honor Hallie Brant today? Not by claiming to know what she would think of this film – that is a privilege lost to us. We honor her by recognizing the power of her *actual* voice in these archives – the voice that fought for tenants, that demanded justice, that spoke truth to power. We honor her by acknowledging the immense responsibility that comes with handling someone else’s story, especially when they are no longer here to guide it. We honor her by ensuring that her own words remain paramount, accessible, and undeniable. Our film is a shadow cast by her light. It is our attempt to grasp something of her fire. But the true source, the enduring flame, is here, in her papers. May they always illuminate the path towards justice she walked so fiercely. Thank you.
