prompt: |-
  I'm on the rules committee of my housing co-op, which is rewriting its charter, and someone handed us the argument below and I genuinely can't tell which bit to throw out.

  Our amending clause, Rule 12, says: any rule may be amended or repealed by a two-thirds vote of a general meeting. We're considering adding Rule 13, which would say: Rule 12 may not be amended except by a two-thirds vote followed by a mail ballot of all members. The point of it is to make the threshold hard to lower later.

  (1) Rule 12 lets a general meeting amend any rule in the charter, including Rule 12 itself.
  (2) So there is nothing the meeting cannot lawfully enact: any rule whatever can be made part of the charter by a two-thirds vote.
  (3) Suppose the meeting enacts Rule 13. Rule 13 is itself a rule in the charter, so by Rule 12 the meeting can repeal Rule 13 by an ordinary two-thirds vote, and then, at the same meeting or a later one, lower the threshold in Rule 12. Nothing unlawful happens at either step. So Rule 13 entrenches nothing: every entrenchment clause is defeasible by the very procedure it tries to restrict, just in two steps instead of one, and the whole exercise is decoration.
  (4) But now suppose the meeting instead uses Rule 12 to amend Rule 12 directly, so that Rule 12 reads: no rule may be amended except by a two-thirds vote and a mail ballot. Once that amendment takes effect, the old two-thirds-only procedure no longer exists, so the meeting cannot undo what it just did by the route it used to do it. That looks like real entrenchment, achieved in one step by the very same supposedly unlimited power.
  (5) (3) says entrenchment is impossible and (4) says it's trivial. Both can't be right.

  I'd rather keep (4) than (3), because if (3) is right we should scrap Rule 13 and I've wasted two weekends on it. But I can't say what's wrong with (3). Is it that can amend in (2) is doing two different jobs? Is it something about whether an amendment that breaks the existing manner-and-form rules is void or merely improper, and about which rule is in force at the moment it validates the change? Its also not clear to me whether it matters if Rule 13 is redrafted to say it applies to amendments and repeals of itself, or whether routing future amendments to a different body (the mail ballot) is doing all the real work. A friend says this has the same shape as the old question whether an omnipotent being can tie its own hands, which makes me trust it less, not more.

  Tell me which step you'd reject, why it looked fine, and what giving it up costs us in practice when we draft the thing.
reasoning: |-
  Okay, the user is part of a housing co-op's rules committee rewriting their charter. They're dealing with Rule 12, which allows amending any rule with a two-thirds vote at a general meeting. They want to add Rule 13, which would require a two-thirds vote plus a mail ballot to amend Rule 12, making it harder to change in the future. The user is confused by two conflicting arguments: one saying entrenchment is impossible, the other saying it's trivial.

  First, I need to parse both arguments. Argument (3) claims that enacting Rule 13 is pointless because the meeting can repeal Rule 13 first with a two-thirds vote, then amend Rule 12. So Rule 13 doesn't actually protect anything. Argument (4) suggests that directly amending Rule 12 to include the mail ballot requirement would entrench it since the old procedure is gone, making it binding.

  The user is stuck because both arguments seem logical but contradict each other. They want to know which one to reject. They prefer keeping (4) because they've invested time in Rule 13. But they can't figure out why (3) is wrong.

  I recall that in legal and parliamentary systems, entrenchment clauses are common. The key is understanding the hierarchy of rules. Rule 12 is the foundational amendment rule. Any amendment under Rule 12 must comply with the procedures in place at the time. So when Rule 13 is added, it becomes part of the charter. To repeal Rule 13, the meeting must follow the current Rule 12, which only requires a two-thirds vote. After repealing Rule 13, Rule 12 is back to its original form, allowing amendments without a mail ballot. That makes Argument (3) correct—Rule 13 doesn't effectively entrench because it can be removed easily.

  But Argument (4) suggests that directly changing Rule 12 itself would work. If Rule 12 is amended to require both a two-thirds vote and a mail ballot for all amendments, then any future amendment must follow that new procedure. At the moment of amendment, the existing Rule 12 allows changes with just a two-thirds vote, so they can change Rule 12 to include the mail ballot requirement. After that, the new procedure is in place, and reverting would require a mail ballot, which is harder. That seems like real entrenchment.

  The contradiction arises because in (3), adding a separate rule (Rule 13) doesn't bind the amendment process itself. Rule 13 is just another rule that can be repealed under Rule 12. But changing Rule 12 directly alters the amendment procedure, making future changes harder. So the problem with (3) is that Rule 13 doesn't constrain Rule 12; it's subject to it. Whereas amending Rule 12 changes the source of authority.

  So I need to reject Step (2) in Argument (3). The user's Step (2) claims that "there is nothing the meeting cannot lawfully enact," which is true at the moment of the meeting. But after enacting Rule 13, repealing it later requires following Rule 12, which only needs a two-thirds vote. So Rule 13 doesn't bind future meetings. However, amending Rule 12 directly changes the procedure for future amendments, creating entrenchment.

  In practice, if the co-op wants to entrench the amendment rule, they should directly amend Rule 12 to include the mail ballot requirement. Adding a separate Rule 13 won't work because it's too easy to remove. The user thought Rule 13 would help, but it's ineffective. The wasted weekends are due to not realizing that entrenchment requires modifying the amendment rule itself, not adding a new rule that depends on it.

  The user's friend mentioned the omnipotence paradox, which is relevant. An omnipotent being can limit itself by changing its own nature. Similarly, the amendment rule can be self-entrenched by altering its own requirements. So the solution is to amend Rule 12 directly. The cost of giving up Rule 13 is minimal because it wasn't effective anyway. Instead, they should change Rule 12 to include the mail ballot for all amendments or just for its own amendment. This provides real entrenchment.
answer: |-
  You're wrestling with a classic legal paradox of self-amendment, and **I'd reject the logic in Argument (3)**. Here's why, what makes it tempting, and the practical drafting implications:

  ### The Core Issue: Rule 13 Doesn't Bind Rule 12
  *   **Step (3) is flawed** because it treats Rule 13 as if it can magically constrain Rule 12. It cannot. Rule 12 is the *source* of the power to amend *any* rule, including itself *and* Rule 13.
  *   Enacting Rule 13 is just creating another rule *under* Rule 12. Rule 12 *allows* its own amendment or repeal at any time by a simple 2/3 vote. Rule 13 says "you can't amend Rule 12 *unless* you do X+Y". But **Rule 12 doesn't care what Rule 13 says**. Rule 12 says "I can be amended by 2/3 vote". Full stop.
  *   Therefore, a future meeting using Rule 12's power *can* repeal Rule 13 with a 2/3 vote. Rule 13 offers *no resistance* because Rule 12's power supersedes Rule 13's attempted restriction. Rule 13 is just content; Rule 12 is the engine. You can't stop the engine by writing "don't run" on a sticky note attached to it if the engine's own programming says "ignore sticky notes".
  *   **Why it looks fine:** It relies on the intuitive idea that "a rule is a rule." If Rule 13 says you need a mail ballot to change Rule 12, it *feels* like that should bind. But in a hierarchy of rules, the *amendment rule* (Rule 12) is supreme over *substantive rules* (like Rule 13). Rule 13 is ultimately just substantive content about amendment procedures, but it doesn't alter the *source* of the amendment power itself.

  ### Why Argument (4) is Correct (Real Entrenchment)
  *   **Amending Rule 12 *directly*** changes the *source* of the amendment power itself. You are modifying the engine's programming.
  *   Step (4) is correct: A meeting uses the *existing* Rule 12 (requiring only 2/3) to *replace* Rule 12 with a *new* Rule 12 that requires 2/3 *plus* a mail ballot.
  *   **After this change takes effect:** The *new* Rule 12 is the *only* valid amendment procedure. The old procedure (2/3 only) ceases to exist. To amend *anything* now (including the new Rule 12 itself), you *must* follow the new procedure (2/3 vote + mail ballot).
  *   **This *is* real entrenchment:** You've successfully raised the bar for future amendments by using the current power to redefine that power for the future. The meeting tied its own hands *by changing the definition of what its hands are allowed to do*.

  ### What Giving Up Step (3) Costs You & Practical Drafting
  *   **Cost:** You lose the idea that Rule 13 (as proposed) provides any meaningful entrenchment. It doesn't. Adding Rule 13 is indeed decorative and futile for its stated purpose.
  *   **Practical Solution (What you SHOULD do):** **Amend Rule 12 directly.** Don't create a separate Rule 13. Rewrite Rule 12 itself to include the entrenchment provision.
      *   **Bad (Ineffective):** "Rule 13: Rule 12 may not be amended except by a two-thirds vote followed by a mail ballot of all members."
      *   **Good (Effective Entrenchment):** Amend Rule 12 to read:
          > "**Rule 12 (Amendment):** (a) Any rule *other than this Rule 12* may be amended or repealed by a two-thirds vote of a General Meeting. (b) This Rule 12 may only be amended or repealed by a two-thirds vote of a General Meeting *followed by* a mail ballot of all members in which a majority of those voting approve the amendment or repeal."
  *   **Why this works:** You've used the *current* power (simple 2/3) to redefine the *future* power required to change Rule 12. Future meetings are bound by the *new* Rule 12 they find in the charter. To change it, they *must* use the harder procedure *defined within it*. The "omnipotent being" analogy fits here: it *can* tie its hands by *choosing* to redefine its own power in a more restrictive way for the future.

  ### Addressing Your Specific Questions
  *   **"Can amend" doing two jobs?** Yes, subtly. In Step (2)/(3), "can amend" relies on Rule 12's *current* power. Step (4) uses "can amend" under the *current* power to *change* what "can amend" means *in the future*. It's about the *time* at which the power is exercised and which version of Rule 12 is authoritative.
  *   **Void vs. Improper?** This is key. An attempt to amend Rule 12 *after* your effective amendment (requiring mail ballot) *without* a mail ballot would likely be **void** (invalid, of no effect), because it fails to follow the *only* valid procedure defined in the *current* Rule 12. Rule 13, as proposed, could only make an improper amendment (breaching Rule 13) but not void (since Rule 12's procedure was still followed).
  *   **Applying Rule 13 to itself?** Adding "...and this rule" to Rule 13 doesn't help. A future meeting can *still* repeal Rule 13 (including its self-reference) using Rule 12's simple 2/3 power before touching Rule 12. Rule 12's power trumps Rule 13's content.
  *   **Routing to a different body?** Changing the *body* (e.g., requiring a mail ballot instead of a meeting vote) *is* part of what makes entrenchment work in Step (4), but only because it's done *within* the amendment rule itself. The core principle remains: you must change Rule 12, not just add a rule about Rule 12.

  **Conclusion:** Scrap the proposed Rule 13. It's a waste of ink. Instead, **directly amend Rule 12** to include the higher threshold (2/3 + mail ballot) *specifically for amendments to Rule 12 itself*. This uses your current power (Rule 12) effectively to bind future power and achieves the real entrenchment you want. Your weekends weren't entirely wasted – you've now understood a crucial principle of constitutional drafting! Focus your efforts on crafting the *direct* amendment to Rule 12.
