  Here's a decision tree designed to clarify your aquaculture strategy, built from the logical space of core ethical questions. It has 5 binary questions, leading to 10 distinct leaves (some named positions, others unnamed). The tree avoids presupposing conclusions and isolates key disagreements. Each branch is a plain yes/no or choice between options, answerable without specialized knowledge.

  ### **Decision Tree**
  1. **Do farmed aquatic animals (finfish and decapods) deserve moral consideration?**  
     - *Yes* → Go to Q2  
     - *No* → Go to Q1b  

  2. **Should we reduce moral weight for animals with uncertain sentience (e.g., shrimp)?**  
     - *Yes* → Discount decapods more than finfish  
     - *No* → Treat all sentient-suspected species equally  

  3. **Is the typical farmed aquatic animal's life (including death) net negative?**  
     - *Yes* → Reducing headcount is priority  
     - *No* → Welfare improvements may be acceptable  

  4. **Does promoting higher-welfare farming risk entrenching the industry?**  
     - *Yes* → Welfare reforms may backfire  
     - *No* → Welfare reforms are safe  

  5. **When measuring impact, should we count:**  
     - *Per individual animal* → Focus on species with most individuals/tonne (e.g., small fish)  
     - *Per tonne of product* → Focus on high-volume species regardless of individuals  

  **Q1b (if Q1=No): Are there non-moral reasons to support welfare reforms?**  
