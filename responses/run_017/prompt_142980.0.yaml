  Notably, the user dismisses intros/conclusions—so I'll dive straight into numbered assertions. Their phrasing ("reconstruct the implicit account") suggests they want analytical rigor, but their fiction background means avoiding jargon. I'll mirror their terms like "salience" and "inferential horsepower." 

  Finally, their critique group's resistance implies they need defensible logic. Point 4 will validate their theory while point 5 preempts counterarguments about entailment. The locked-room distinction (point 3) is crucial—it resolves their observed paradox by separating physical from behavioral evidence.
answer: |-
  Here are the five numbered points reconstructing the fair-play norm's presuppositions:

  1.  **Accessibility, Not Solvability:** The norm requires all *raw information* necessary to logically deduce the solution be presented to the reader *before* the detective's revelation, presupposing the reader *could* solve it with perfect reasoning, not that they *will* or *should be expected to*.
  2.  **Expertise Justifies Inference:** The norm allows the detective superior inferential power (recognizing a smudge means a letter was steamed) because readers implicitly accept expertise as a valid *reason* for a conclusion, presupposing the *type* of inference (based on experience) is recognizable, even if the *specific conclusion* isn't guessable without that expertise.
  3.  **Distinct Clue Categories:** The norm treats "who/why" clues (motive, alibi, opportunity) differently from "how" clues (elaborate mechanisms); presupposing readers demand psychological/behavioral clues support plausible human deduction chains, while accepting *novel* physical tricks if their *components* were fairly presented.
  4.  **Salient Reasoning Chains:** The norm presupposes the solution follows via a finite chain of inferences where each step is a *recognizable type* of deduction (elimination, contradiction, expertise application, common-sense motive) applied to *salient* clues, not just any logically possible chain from all text.
  5.  **Rejection of Logical Omniscience:** The norm fundamentally rejects the formal principle that knowing clues entails knowing all consequences; it presupposes human reasoning is bounded, and fairness means providing clues supporting a *feasible, recognizable path*, not guaranteeing the reader traverses it or sees every implication.
