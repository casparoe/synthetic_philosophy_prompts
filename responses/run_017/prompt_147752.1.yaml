prompt: |-
  I have been reading about a proposed norm in Bayesian epistemology, and I have hit on a class of cases that I cannot classify. The norm, as I understand it, is this: a rational agent's current degree of confidence in a proposition, on the supposition that her later self will assign that proposition some specific probability, ought to equal that later probability. Equivalently, her current confidence should match her expectation of what her future confidence will be. I believe this is called the Reflection principle and is associated with Bas van Fraassen, though I may be misremembering the details. My difficulty is not with the basic principle as it applies to cases where I simply expect to learn more, or to have more evidence, later on. It is with cases where the future confidence is produced by a process I now regard as epistemically defective.

  Let me give two concrete instances. First, suppose I now have strong, excellent evidence that a proposition A is true, and I am 90% confident of A. I also know for certain that tomorrow I will be given a drug that will permanently erase the specific experiences and records that constitute that evidence. I know exactly what the drug will do: after taking it, I will have no memory of the evidence and no way to recover it, and my confidence in A will settle at 50%. If I apply the Reflection principle naively, it seems to say that my current confidence in A, on the supposition that my future self will be 50% confident, should itself be 50%. But that would require me to discount my present evidence entirely and drop to 50% right now, merely because I know I will later forget why I believe A. That strikes me as wrong.

  Second, suppose I know that next week I will be subjected to a prolonged and irresistible propaganda campaign that will raise my confidence in A to 80%, even though I now possess excellent evidence that A is only about 30% likely. Again, the principle seems to tell me that, conditional on my future self being 80% confident, I should already be 80% confident. Yet here the future change is not forgetfulness but a predictable corruption of my judgment by a process I now regard as unreliable.

  These are not cases where I expect to receive new evidence I lack; nor are they cases where I expect my future self to have strictly more, or better, evidence than I have now. They seem instead to be cases of expected epistemic corruption or anticipated future irrationality. My questions are as follows. Does this pattern have an established name in Bayesian or formal epistemology? How is it related to the Reflection principle itself, to the standard objection that Reflection goes wrong when an agent expects to forget, and to the Dutch-book arguments sometimes offered in defense of Reflection? If there is no established term, please coin one, define it precisely, and give boundary cases that distinguish it from (a) merely forgetting evidence, (b) rationally updating on new evidence, and (c) ordinary cases where a future self has superior evidence. I am not asking for bibliographies, citations, or further reading; I want the conceptual carving: what exactly this phenomenon is, what it is not, and where its edges lie. A bare label would not satisfy me.
reasoning: |-
  Okay, the user is grappling with a fascinating problem in Bayesian epistemology concerning the Reflection principle. They've presented two thought experiments where future credences are distorted not by new evidence but by cognitive corruption—drug-induced amnesia in one case and propaganda in the other. The core tension is how to reconcile Reflection's demand for deference to future selves when those future states are epistemically compromised. 

  Hmm, what makes this particularly thorny is that both cases involve *predictable* deterioration: the agent knows exactly how and why their future self will be wrong. That's different from standard "forgetting evidence" objections to Reflection, because here the future self isn't just missing evidence—they're actively miscalibrated. The propaganda case is especially vivid since it's not memory loss but implanted false confidence.

  The user wants precise conceptual boundaries. Let me map the territory: First, we must distinguish between (a) rational updating on new evidence, (b) losing evidence (where Reflection fails but uncontroversially so), and (c) this new category of *anticipated irrationality*. The key differentiator is whether the future credence stems from proper epistemic procedures. In the drug case, the 50% isn't based on any evidence—it's a post-amnesia vacuum. In propaganda, the 80% is manufactured. 

  Ah! And the Dutch book defense of Reflection relies on future selves being rational actors. If they're predictably irrational, the coherence argument collapses—you'd happily bet against your future self. That's why the user instinctively rebels against lowering current credence: their present self remains epistemically superior. 

  For labeling: "Epistemic Corruption" feels right—it captures the active deterioration in the propaganda case while covering passive corruption via amnesia. We could specify subtypes (procedural vs. evidential corruption) but the umbrella term suffices. The boundaries are clean: unlike ordinary forgetting, corruption violates rationality norms; unlike new evidence, it doesn't truth-track. 

  The user's examples brilliantly expose where Reflection assumes ideal agency. Their discomfort is warranted: applying Reflection here would force self-sabotage. The answer must validate that while showing how this fits into broader epistemic taxonomy.
answer: |-
  This phenomenon is a well-recognized challenge to the **Reflection Principle** and is central to its limitations. It has no single universally adopted name, but we can precisely define it and distinguish it from related concepts.

  ### Core Concept: **Epistemic Corruption**
  **Definition:** A situation where an agent rationally expects their future credence in a proposition to be formed by a process that the agent *currently judges* to be epistemically defective—meaning it systematically distorts reasoning, ignores relevant evidence, introduces false evidence, or otherwise violates norms of rational updating—*without* that process providing compensating epistemic value (e.g., new reliable evidence).

  ### Key Characteristics Distinguishing Epistemic Corruption
  1.  **Source of Future Credence:** The future credence is produced by a process the agent *currently knows* to be irrational or unreliable (e.g., drug-induced amnesia erasing specific evidence, propaganda distorting reasoning, severe fatigue impairing judgment, hypnosis implanting beliefs).
  2.  **Loss of Epistemic Advantage:** The agent *currently possesses* evidence or rational grounds that they know their future self will lack or override irrationally.
  3.  **Predictability:** The agent can predict *with certainty or high confidence* both the *magnitude* and the *direction* of the future credence shift due to the corrupting process.
  4.  **No Compensating Epistemic Gain:** The process leading to the future credence does *not* provide access to new, relevant, reliable evidence that could rationally justify the shift. The shift is purely a product of the defect.

  ### Boundary Cases: Distinguishing Epistemic Corruption
  *   **(a) Merely Forgetting Evidence (Standard Forgetting Objection):**
      *   **Case:** You know you will forget *some* evidence relevant to A, but you don't know *which* evidence, or what the net effect on your credence will be. Your future self updates rationally on the evidence they *do* remember.
      *   **Distinction:** While Reflection may still fail here, it's *not* Epistemic Corruption. The future self is rational *given their evidence*. The problem is uncertainty about what evidence they'll have. In true Epistemic Corruption, you know *exactly* what evidence will be lost/added *and* that the future self's resulting credence is irrational *even given their impoverished/enriched evidence state*.
  *   **(b) Rationally Updating on New Evidence:**
      *   **Case:** You know you will receive new, highly reliable evidence tomorrow that could rationally shift your credence in A to anywhere between 10% and 90%. You currently set your credence to your expectation of your future credence (potentially satisfying Reflection).
      *   **Distinction:** The future credence shift is driven by *reliable access to truth-conducive information* you currently lack. This is the paradigmatic case *for* Reflection. Epistemic Corruption involves shifts driven by processes that *damage* reliability.
  *   **(c) Future Self Has Superior Evidence:**
      *   **Case:** You know your future self will have access to strictly more or better evidence than you have now (e.g., results of a crucial experiment, decrypted documents). You rationally defer to their future judgment.
      *   **Distinction:** The future self is epistemically *superior*. Epistemic Corruption involves a future self that is predictably epistemically *inferior* due to a defective process. The key is the *origin* and *reliability* of the evidence/process leading to the future credence, not just quantity.

  ### Relationship to the Reflection Principle and Objections
  1.  **Reflection Principle (Standard Formulation):** P\_t(A | P\_{t+Δ}(A) = x) = x, where P\_t is current credence at time t, and P\_{t+Δ} is future credence at time t+Δ.
  2.  **Standard Forgetting Objection:** Reflection fails if the agent expects to *lose* evidence, as the future self has less information. The agent *should not* fully defer to a less informed self. Your cases are a *stronger* variant of this objection.
  3.  **Epistemic Corruption as a Deepened Objection:** Your cases show that Reflection fails catastrophically not just when the future self has *less* evidence, but crucially, when the future self's credence is formed *irrationally* based on a process the current self knows is defective. The flaw isn't just informational impoverishment; it's procedural corruption.
  4.  **Dutch Book Arguments:** These defend Reflection by showing that violating it makes an agent vulnerable to a sure-loss sequence of bets (diachronic Dutch book). However, this argument *assumes the future self is rational*. If the agent rationally believes their future self will be *irrational* (Epistemic Corruption), accepting the Dutch book against their future self can be a *rational way to profit* from the predicted irrationality. The Dutch book defense collapses when future irrationality is rationally anticipated. The "coherence" enforced by Dutch books is undesirable if it forces you to align with a predictably corrupted future state.

  ### Applying the Concept to Your Cases
  1.  **Drug-Induced Amnesia:**
      *   **Corrupting Process:** Specific, targeted erasure of crucial evidence supporting A.
      *   **Future State:** Credence drops to 50% (ignorance) despite the erased evidence overwhelmingly supporting A.
      *   **Current Judgment:** You know the 50% credence results *only* from irrational neglect of the lost evidence; it doesn't reflect the actual support *for A* available in the world (which you currently possess). Your future self is epistemically corrupted by amnesia.
      *   **Correct Response:** Maintain 90% credence. Conditional on your future self being 50% confident *due to this specific corruption*, your current credence should remain 90%. Deferring would corrupt your *current* rationality.
  2.  **Propaganda Campaign:**
      *   **Corrupting Process:** Systematic introduction of false evidence/distortion of reasoning via a known unreliable method (propaganda).
      *   **Future State:** Credence rises to 80% despite current strong evidence suggesting only 30% likelihood.
      *   **Current Judgment:** You know the 80% credence is *caused* by irrational manipulation, not by access to truth-conducive evidence. Your future self is epistemically corrupted by propaganda.
      *   **Correct Response:** Maintain ~30% credence. Conditional on your future self being 80% confident *due to this specific corruption*, your current credence should remain ~30%. Deferring would mean adopting a credence you *know* is based on lies.

  ### The Edges of Epistemic Corruption
  *   **Blurred Edge (Degrees of Defectiveness):** What if the process is only *slightly* unreliable? Or if it provides *some* true evidence mixed with distortion? (e.g., a biased but partially informative news source). Whether this qualifies as full "corruption" depends on the agent's rational assessment of the *net epistemic impact* and the *systematic nature* of the defect. True Epistemic Corruption requires a process judged to be *predominantly and systematically* defective.
  *   **Blurred Edge (Self-Doubt):** What if you merely *suspect* you might become irrational in the future, but lack certainty about the process or its effect? This leans towards the standard "loss of evidence" or general uncertainty objection, not full Epistemic Corruption where the defect and its outcome are predictable.
  *   **Sharp Edge (No New Evidence):** If the process *also* provides genuinely new, reliable, relevant evidence – even alongside distortion – it moves towards case (b) or (c). Epistemic Corruption requires the credence shift is *primarily or solely* due to the defective aspect of the process.
  *   **Sharp Edge (Current Rationality):** The agent must *currently, rationally* judge the future process as defective. If the agent is *currently mistaken* about the defectiveness of the future process, it might satisfy the *conditions* for Epistemic Corruption from their perspective, but not objectively. The principle is agent-relative.

  In essence, **Epistemic Corruption** occurs when a rational agent anticipates their future credence will be the direct output of a predictable, exogenous process that they currently know violates rational norms, rendering that future credence unreliable and epistemically inferior to their current state. The Reflection Principle rationally *fails* under these conditions, as deference would require the agent to abandon their current, superior epistemic position in favor of a known corrupted one. The Dutch book defense is invalid here because betting against your predictably irrational future self can be a rational strategy.
