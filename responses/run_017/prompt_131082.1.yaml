prompt: |-
  I'm a TA for a 24-person undergrad course that's basically decision theory for philosophers — mostly second- and third-years, not very mathy. I've got one 75-minute slot next week, a projector, a stack of index cards, no budget at all, though I can rustle up a single decent prize (a nice bottle of something, or a fat book token) and a bag of good chocolate. I was talking this over with a friend who does econ and she said the version I usually run is too easy to shrug off, and I think she's right.

  Last term I did the plain two-urn thing — one urn with a known 50/50 mix, one with an unknown mix, you pick a colour and you pick an urn — and it half flopped. A third of the class said "isnt that just risk aversion?" and I didnt have a clean way to show them it wasn't. And the people who did see the pattern only saw it in the aggregate: nobody felt like *they* had done anything odd. I want them to catch themselves doing it.

  Two wrinkles I've been playing with, which you should build the session around (or replace if you can see something better): (1) alongside the known urn and the mystery urn, add a third urn whose composition is produced by a transparent random process right in front of them, but the result goes into a sealed envelope that nobody — me included — will ever open. It's pure risk by construction and I bet it still feels like the mystery urn, which should separate "I dislike unknown probabilities" from "I just dislike coin flips." (2) A two-parter where the same student contradicts themselves. First I offer a ticket that pays if a fair coin lands heads *and* red comes out of the mystery urn, or tails *and* black comes out of the mystery urn — so its chance of winning doesn't depend on the composition at all, and it looks worth exactly the same as a ticket on the known urn. Then I flip the coin in front of them and offer to swap their coin-ticket for a known-urn ticket for a small fee. My guess: indifferent before the flip, happy to pay after it, whichever way it lands — so they've paid to undo a choice they just said they were indifferent about.

  What I actually need: rules and materials; some way to get a number out of each student rather than a show of hands (I was thinking anonymous numbered index cards I hand back at the end, so each person can see their own round-2 answer sitting next to their round-5 answer); payoffs that work with chocolate and one shared prize and no cash; a minute-by-minute timeline; and a debrief that maps particular moments onto the sure-thing principle, the reduction of compound lotteries, and whatever goes wrong when someone prefers the known urn for red *and* the known urn for black — but with me never naming any of that up front, and the labels arriving only at the end. Also: how to run the mystery urn honestly (I dont want to rig it or lie about what's in it, and somebody always accuses me of rigging it), what will predictably go wrong the first time I run this, and an honest note on what it can't show. My sense is it can establish that something has to give but not which formal model of the behaviour is right, and it definitely can't establish that anyone is being irrational. No reading lists or citations, just the session.
reasoning: |-
  We are going to design a classroom activity to demonstrate the Ellsberg paradox and related decision-making phenomena. The goal is to have students confront their own preferences that violate expected utility theory (without naming it until the end). We will use three urns and a two-part ticket to create situations where students might exhibit ambiguity aversion and then contradict themselves in a way that violates the sure-thing principle.

  ## Materials
  1. **Urns and Balls**:
     - **Urn A (Known)**: 50 red balls, 50 black balls. (Use a transparent container if possible, or show the balls before sealing.)
     - **Urn B (Mystery)**: An unknown mix of red and black balls (say, 100 balls total). We will not reveal the composition. To avoid accusations of rigging, we can have a student volunteer before class (or at the start) fill this urn from a large supply of red and black balls, but without counting. Alternatively, we can use a sealed container that was prepared by a trusted third party (like the professor) and not tampered with. We must emphasize that we don't know the composition either.
     - **Urn C (Random)**: We will create this urn in front of the class. We have a bag of red and black balls (or a coin to flip to determine the color for each ball, but that would be time-consuming). Instead, we can use a transparent random process: flip a fair coin in front of the class. If heads, Urn C is 100 red balls; if tails, Urn C is 100 black balls. But then we put the result in a sealed envelope and don't reveal it. So the urn is either all red or all black, but no one knows which.

  2. **Tickets and Choices**:
     - We will use index cards for each student to record their choices anonymously. Each card will have a unique number (so we can hand them back at the end for students to see their own sequence of choices). We will also have a master list matching numbers to students for handing back, but the actual choices are anonymous during the activity.

  3. **Payoffs**:
     - We have a bag of good chocolate for immediate small rewards and a single decent prize (like a bottle or book token) for a lottery at the end. We can use the choices to assign lottery tickets for the big prize. Alternatively, we can use the chocolate as immediate rewards for some choices. Since we cannot use cash, we can assign points for each choice that translate into chances in a lottery for the big prize.

     **Proposal for Payoffs**:
     - Each student makes several choices. For each choice, they are effectively stating a preference between two lotteries. We can randomly select one choice from one student (or a few) to be played out for real at the end. That way, every choice matters because it might be the one selected. Alternatively, we can randomly select a few students and one of their choices to be played for the big prize. The chocolate can be given to everyone who participates, or we can use it as a small reward for the lottery that is run more frequently.

     **Practical Plan**:
     - We will run several rounds. In each round, students write their choice on an index card. At the end, we randomly pick (say) 3 students (by drawing numbers from a hat). Then, for each selected student, we randomly pick one of the rounds they participated in (again by drawing). Then we run the lottery they chose in that round and if they win, they get the big prize. For the rest, we give chocolate. This way, every choice matters and they have an incentive to state their true preference.

     Alternatively, to reduce complexity, we can run one round for real (but then we have to decide which round in advance, which might bias). We'll go with the random selection method.

  4. **Index Cards**:
     - Each student gets one index card with a unique number (1 to 24). We will have a master list: number -> student name. For each round, the student writes the round number and their choice (e.g., "Round 1: Urn A for red"). We collect and shuffle the cards after each round, then we can hand them back at the end so each student can review their own choices.

  ## The Activity: Step-by-Step

  ### Introduction (5 minutes)
  - Explain the urns:
    - Urn A: 50 red, 50 black. (Known risk)
    - Urn B: Mystery urn. We don't know how many red and black. (Ambiguity)
    - Urn C: We will flip a fair coin now. If heads, it's 100 red; if tails, 100 black. We put the result in a sealed envelope and no one will ever know. (Pure risk, but the outcome is unknown)

  - Explain the payoffs: At the end, we will randomly select a few students and one of their choices to be played out for the big prize. The rest get chocolate.

  ### Round 1: Single Color Bet (10 minutes)
  - Students choose an urn and a color (red or black). They will get a ticket that pays the big prize if the ball drawn from their chosen urn is of the chosen color.
  - They write on their card: Round 1, Urn (A, B, or C) and Color (red or black). They can choose any urn and any color.

  **Prediction**: Most will choose Urn A. Some might choose Urn C. Few will choose Urn B. We are looking for ambiguity aversion.

  ### Round 2: Pair of Bets (10 minutes)
  - Now we ask for two separate choices (to see if they prefer the known urn for both colors).
  - Part A: They choose between:
     - Ticket 1: Bet on red from Urn A.
     - Ticket 2: Bet on red from Urn B.
     - Ticket 3: Bet on red from Urn C.
  - Part B: They choose between:
     - Ticket 1: Bet on black from Urn A.
     - Ticket 2: Bet on black from Urn B.
     - Ticket 3: Bet on black from Urn C.

  They write on their card: Round 2A: [Ticket choice for red] and Round 2B: [Ticket choice for black].

  **Prediction**: For both red and black, they will prefer Urn A over Urn B and Urn C? But note: for Urn C, if they choose red, the probability is either 1 or 0, which is the same as a coin flip. We expect them to be indifferent between Urn A and Urn C? Or maybe not because Urn C is also unknown? We are testing if Urn C feels like Urn B or like Urn A.

  ### Round 3: The Compound Ticket (15 minutes)
  - We introduce a compound lottery ticket.
  - The ticket pays if:
     - A fair coin (to be flipped now) lands heads AND a red ball is drawn from Urn B, OR
     - The coin lands tails AND a black ball is drawn from Urn B.
  - Explain that the probability of winning does not depend on the composition of Urn B. Let p be the proportion of red in Urn B. Then the probability is (1/2)*p + (1/2)*(1-p) = 1/2. So it's exactly a 50% chance.

  - We ask them: How do you value this ticket compared to a ticket that pays if a red ball is drawn from Urn A (which is 50%)? They should be indifferent.

  - They choose between:
     - Option X: The compound ticket on Urn B (with the coin flip)
     - Option Y: A ticket on Urn A for red (or black, it doesn't matter because it's 50%)

  They write: Round 3: [X or Y]

  **Prediction**: They should be indifferent. But because of ambiguity aversion, they might prefer the known Urn A.

  ### Round 4: Flip the Coin (10 minutes)
  - Now we flip the coin for the compound ticket in front of the class. We do not reveal the outcome to the students? Actually, we must reveal it because the next choice depends on it.

  - We flip a fair coin. Suppose it lands heads. Then the compound ticket from Round 3 now becomes: it pays if a red ball is drawn from Urn B (because the coin was heads and we need red). Similarly, if tails, it pays if black is drawn.

  - Now we offer them a chance to swap. We say: "You have the compound ticket, which now is a bet on [red/black] from Urn B. I will let you swap it for a ticket on Urn A for the same color (so if you have a bet on red from Urn B, you can swap to a bet on red from Urn A) for a small fee. The fee is 1 chocolate. Alternatively, you can keep your current ticket."

  - But note: we cannot charge real money, so we use chocolate. We have a bag of chocolate. We will take away one chocolate from their total if they swap? But we haven't given chocolate yet. Instead, we can say: if you choose to swap, you will get one less chocolate at the end (but they don't know how many chocolates they are getting). Alternatively, we can use the lottery: the swap costs a 1% reduction in their chance of winning the big prize? That's too abstract.

    **Alternative for fee**: We can say that swapping is free, but we are going to see if they want to swap. However, without a cost, they might swap even if they are indifferent. We need a small cost to see if they have a strict preference.

    **Better idea**: We frame it as: you can pay one chocolate to swap. But since we are giving chocolate at the end, we can say: "If you choose to swap, you will forfeit one chocolate (from the bag you would have received)." We must ensure that everyone gets at least one chocolate. We can give everyone 2 chocolates at the end, and if they swap they get 1.

    But note: we are going to run a lottery for the big prize. The chocolate is a separate small reward. We can say: everyone gets 2 chocolates at the end, but if you choose to swap in this round, you get only 1.

  - They write: Round 4: [Keep or Swap]

  **Prediction**: Even though they were indifferent in Round 3, now that the coin is flipped, they might prefer the known urn and be willing to pay a chocolate to swap.

  ### Round 5: Contradiction? (10 minutes)
  - We don't do a round 5 per se. We have already seen in Round 4 a potential contradiction. We will hand back the index cards at the end so they can see their Round 3 and Round 4 choices.

  ### Data Collection
  - For each round, we collect the index cards. We keep them in order (by round) and by card number.

  ### Debrief (15 minutes)
  - We hand back the index cards so each student can see their own choices over the rounds.
  - We show aggregate results (without names) for each round.
  - We then discuss:
    1. Round 1: Most people chose Urn A. Why? Because they don't like ambiguity (Urn B) and they might also be wary of Urn C? But note: Urn C is a known 50% chance (either 0 or 100, but the coin flip made it 50% ex ante). Why does Urn C feel different from Urn A? It shouldn't by expected utility theory because both are 50% chances. But Urn C has a known probability distribution? Actually, yes: it's a 50-50 chance between 0 and 100. So it's risky, not ambiguous. Yet, people might treat it as ambiguous because they don't know the outcome? We want to separate ambiguity from risk.

    2. Round 2: We expect that for both red and black, more people chose Urn A than Urn B. But note: if they choose Urn A for red and Urn A for black, that's fine. But if they choose Urn A for red and also Urn A for black, then they are turning down a 50% chance for a 50% chance? Wait, the two bets are separate. Actually, each bet is a separate ticket. But the point is: they prefer the known 50% for each color over the ambiguous one. However, if they were to combine the two bets (if they could bet on both colors in the same urn) then in Urn B they would have a sure thing (because one of the two bets must win) but in Urn A they have two independent 50% chances? That's the Ellsberg two-color paradox. We didn't do that, so we might not see that.

    3. Round 3: The compound ticket. We expect many to prefer Urn A (known) over the compound ticket, even though they are both 50%. This is ambiguity aversion.

    4. Round 4: After the coin flip, the compound ticket becomes a bet on a specific color from Urn B. Now they are willing to pay a chocolate to swap to the known Urn A for the same color. But in Round 3 they were indifferent? So why pay to swap? This violates the sure-thing principle: the outcome of the coin flip should not matter because either way the chance of winning is 50%. And they were indifferent between the compound ticket and Urn A before. But now they strictly prefer Urn A? That is a contradiction.

  - We then introduce the terms:
     - **Ambiguity aversion**: Dislike of not knowing the probabilities (as in Urn B).
     - **Reduction of compound lotteries**: The compound ticket (coin flip and then draw) is equivalent to a single-stage 50% chance. But people might not reduce it and treat it as ambiguous until the coin is flipped.
     - **Sure-thing principle**: If you prefer A to B no matter what happens in a random event, then you should prefer A to B even before the event. In our case, after the coin flip, they prefer Urn A no matter which way the coin landed. So they should prefer Urn A before the flip? But they were indifferent.

  - We note that these behaviors violate expected utility theory, but they might be explained by other models (like max-min expected utility, or prospect theory). We don't have to resolve which model is best, but we show that there is a tension.

  ## Potential Problems and Solutions
  1. **Rigging accusations for Urn B**: 
     - To avoid this, we can have a student volunteer (before class) fill Urn B from a large container of red and black balls without counting. Or we can have two students do it. We emphasize that we don't know the composition. Alternatively, we can use a sealed urn that was prepared by the professor and show that it hasn't been tampered with.

  2. **Urn C construction**:
     - Flip a coin in class: heads -> Urn C is all red, tails -> all black. Then we put the balls in an opaque container and seal it. We write the result (e.g., "all red" or "all black") in an envelope and seal it. We emphasize that we won't open the envelope.

  3. **Time management**: 
     - We have 75 minutes. The timeline is tight. We might skip Round 2 if time is short? But Round 2 is important to show the pattern for both colors. Alternatively, we can combine Round 1 and Round 2 by having them make two choices in Round 1 (but that might be confusing). We'll stick to the plan and keep an eye on time.

  4. **Complexity of Round 3 and 4**:
     - The compound ticket might be hard to understand. We must explain it clearly. We can write the conditions on the board and compute the probability together.

  5. **Chocolate as currency**:
     - We are using chocolate as a small cost. We must ensure that the chocolate is desirable enough. Also, we must be clear that swapping costs one chocolate (so they get one less at the end). We will give everyone at least one chocolate even if they swap, but if they didn't swap they get two.

  6. **Lottery for the big prize**:
     - We randomly select a few students and one of their choices. We must explain the rules clearly at the beginning so they take the choices seriously.

  ## Timeline
  - 0-5 min: Introduction and explanation of urns and rules.
  - 5-15 min: Round 1 (single color bet).
  - 15-25 min: Round 2 (pair of bets: red and black separately).
  - 25-40 min: Round 3 (compound ticket vs known urn).
  - 40-50 min: Flip the coin for Round 3 and run Round 4 (swap offer).
  - 50-60 min: Collect all cards and prepare for debrief. (We don't run Round 5, so we use this time for the lottery if we want to do it now? But we can do the lottery at the very end.)
  - 60-75 min: Debrief (hand back cards, show aggregate results, discuss, introduce concepts).

  At the end of the debrief, we draw the lottery: randomly pick 3 numbers (students) and then randomly pick one round for each. Then we run the lottery they chose in that round and award the big prize if they win. Then we hand out chocolates (with the swap penalty applied).

  ## What it can and cannot show
  - It can show that people are ambiguity averse (prefer known probabilities to unknown).
  - It can show that people treat Urn C (which is a known risk) similarly to Urn B? Or differently? We'll see.
  - It can show a dynamic inconsistency: indifference before the coin flip, then a strict preference after, which violates the sure-thing principle.
  - It cannot prove which model of decision-making is correct (e.g., max-min vs. non-additive probabilities). It only shows that expected utility theory is violated.
  - It cannot prove that the behavior is irrational; it just shows a pattern.

  ## Rules for Each Round
  We'll write the rules on the board or on a slide.

  **Round 1**: 
  - Choose an urn (A, B, or C) and a color (red or black). If a ball of that color is drawn from that urn, you win (the big prize, if this round is selected for you).

  **Round 2**:
  - Part A: For a bet on red, which ticket do you prefer?
     - Ticket 1: Bet on red from Urn A.
     - Ticket 2: Bet on red from Urn B.
     - Ticket 3: Bet on red from Urn C.
  - Part B: For a bet on black, which ticket do you prefer? (same options)

  **Round 3**:
  - Choose between:
     - Option X: A ticket that pays if (coin=heads and Urn B=red) OR (coin=tails and Urn B=black). [We flip the coin later, but the ticket is for the whole process.]
     - Option Y: A ticket that pays if a red ball is drawn from Urn A.

  **Round 4**:
  - We flipped the coin. Suppose it was heads. Then your Option X ticket is now a bet on red from Urn B.
  - You can swap this ticket for a ticket that bets on red from Urn A, but it will cost you one chocolate (so you get one less chocolate at the end). Do you want to swap?
     - Keep: keep the Urn B ticket.
     - Swap: get the Urn A ticket and lose one chocolate.

  Note: If the coin was tails, then Option X becomes a bet on black from Urn B, and we offer a swap to a bet on black from Urn A.

  We are ready to run the session.
answer: |-
  Below is a detailed, ready-to-run lesson plan for your 75-minute session. It incorporates your two wrinkles (the third urn and the two-part contradiction) and addresses all your requirements: anonymous choices via index cards, chocolate/prize integration, a debrief linking behavior to concepts without naming them upfront, and strategies to handle common pitfalls.

  ---

  ### **Materials & Setup**
  1. **Urns** (use clear containers if possible):
     - **Urn A (Known)**: 50 red balls, 50 black balls (pre-filled, openly counted).
     - **Urn B (Mystery)**: 100 balls with unknown red/black mix (pre-filled offstage by a student volunteer *before class* to avoid rigging accusations; seal the urn in a bag after filling).
     - **Urn C (Random Process)**: Empty at start. Have a bucket of 100 red and 100 black balls nearby. Flip a coin live to determine composition: heads = 100 red, tails = 100 black. Fill Urn C accordingly, seal it in an envelope without showing, and discard the key.  
       *Why this works:* The process is transparent, but the outcome is permanently hidden, isolating "unknown probability" from "dislike of coin flips."

  2. **Index Cards**:  
     - Numbered 1–24 (one per student).  
     - Columns for rounds: **R1**, **R2A**, **R2B**, **R3**, **R4**.  
     - Master list linking numbers to student names (for handing back cards later).

  3. **Payoffs**:  
     - **Chocolate**: Given immediately for participation in select rounds (small stakes).  
     - **Grand Prize Lottery**: One winner drawn at the end. Each student earns "lottery tickets" based on choices:  
       - 1 ticket for each round they participate in.  
       - **+1 bonus ticket** if their choices in R3/R4 reveal a contradiction (incentivizes engagement).  
     - *Rationale:* Low-cost, high-engagement; chocolate rewards small acts, lottery leverages loss aversion.

  4. **Other**:  
     - Projector (display instructions/urns visually).  
     - Coin for Urn C setup and R3/R4.  
     - Sealed envelope for Urn C result.  
     - Hat for lottery drawing.

  ---

  ### **Timeline (75 Minutes Total)**

  #### **Intro (5 min)**  
  - **Goal:** Frame the session as "testing intuition, not math."  
  - **Script:**  
    > "We’re exploring how we make choices when probabilities are clear vs. fuzzy. No right/wrong answers—I want your gut reactions. At the end, one person wins [prize] via lottery. Every choice you make earns lottery tickets; some choices also pay chocolate immediately."

  #### **Round 1: Single-Urn Choice (10 min)**  
  - **Task:**  
    > "Pick one urn (A, B, or C) and one color (red or black). If I draw your color from your urn later, you get chocolate now."  
  - **Logistics:**  
    - Students write **R1: [Urn] + [Color]** on cards.  
    - Collect cards, draw 5–6 students’ choices at random. For each, draw a ball from their chosen urn: if color matches, they get chocolate.  
  - **Why:** Introduces ambiguity aversion (Urn B/C chosen less than A). Urn C tests if "unknown probability" ≠ "dislike randomization."

  #### **Round 2: Pair of Bets (10 min)**  
  - **Task:**  
    > "Part A: Would you rather bet on red from Urn A or red from Urn B?  
    Part B: Would you rather bet on black from Urn A or black from Urn B?"  
  - **Logistics:**  
    - Write **R2A: [A or B]**, **R2B: [A or B]** on cards.  
    - No payouts here (save for lottery).  
  - **Why:** Reveals if students prefer known urn for *both* colors—a precursor to Ellsberg’s paradox.

  #### **Round 3: Compound Ticket (15 min)**  
  - **Task:**  
    > "Option X: A ticket that pays if [coin = heads AND Urn B = red] OR [coin = tails AND Urn B = black].  
    Option Y: A ticket that pays if Urn A = red.  
    Which is worth more to you? (Indifferent? Pick one.)"  
  - **Logistics:**  
    - Write **R3: [X, Y, or Indifferent]**.  
    - Explain why probability of X winning is 50% *regardless* of Urn B’s mix:  
      > "If Urn B is 70% red, X wins on heads (70% chance) OR tails (30% chance). (0.5 * 0.7) + (0.5 * 0.3) = 0.5."  
    - **Payout:** All students get chocolate (small reward for complex thinking).  
  - **Why:** Sets up contradiction; students should be indifferent if rational. Most pick Y (ambiguity aversion).

  #### **Round 4: Post-Flip Swap (15 min)**  
  - **Logistics:**  
    1. Flip coin publicly for R3’s Option X:  
       - If **heads**, X = "Bet on Urn B = red".  
       - If **tails**, X = "Bet on Urn B = black".  
    2. **Task:**  
       > "You hold Option X. You can swap it for Option Y (Urn A) but lose 1 chocolate. Keep or swap?"  
  - **Write:** **R4: [Keep or Swap]**.  
  - **Why:** Forces personal contradiction. Those indifferent in R3 often pay to swap after the flip (violating reduction of compound lotteries).

  #### **Lottery & Hand Back Cards (5 min)**  
  - Draw a student’s number from a hat; they win the prize.  
  - Return index cards so students see their R3 vs. R4 choices side-by-side.

  ---

  ### **Debrief (15 min)**  
  **Goal:** Help students "catch themselves" without jargon. Reveal formal concepts only at the end.  

  1. **Aggregate Results (Project anonymous data):**  
     - Show R1: Urn A favored over B/C.  
     - Show R2: Most picked Urn A for red *and* black.  
       > "If you picked A for both, you turned down Urn B twice. What’s uncomfortable about B?"  
     - Show R3: Most picked Y (Urn A) or were indifferent.  
     - Show R4: Many swapped to Urn A even after R3 indifference.  

  2. **Key Moments → Concepts (Student-led discovery):**  
     - **Urn C vs. Urn B (R1):**  
       > "Urn C was decided by a coin flip, but you treated it like B. Why not like A?"  
       *Reveal:* "Unknown probabilities feel different than known risks—even when the process is fair."  
     - **Betting on Both Colors (R2):**  
       > "If you picked A for red and A for black, you’d pay to avoid B both times. But in Urn B, one color *must* win. Is this consistent?"  
       *Reveal:* "This suggests probabilities alone don’t drive choices—comfort with ambiguity matters."  
     - **The Swap (R3 → R4):**  
       > "If you were indifferent in R3 but paid to swap in R4, what changed? The coin flip made Urn B’s ambiguity feel *worse*, even though the odds didn’t change."  
       *Reveal:* "This violates two rules: (1) Compound lotteries should simplify to their net odds (reduction), and (2) If you prefer Y after heads *and* after tails, you should prefer it upfront (sure-thing principle)."  

  3. **What We Can’t Conclude:**  
     > "This doesn’t mean you’re irrational—it means simple probability models might not capture your intuition. Philosophers call this ‘ambiguity aversion’; economists model it with things like Maxmin Expected Utility."  

  ---

  ### **Predictable Pitfalls & Solutions**  
  - **"You rigged Urn B!"**:  
    - Have a student fill Urn B pre-class with no one watching. Seal it and emphasize: "None of us know—this urn is Schrödinger’s cat."  
  - **Math resistance**:  
    - Use plain language ("fuzzy odds" vs. "clear 50/50"). Focus on feelings ("Which urn feels safest?").  
  - **Indifference in R3**:  
    - Force a choice: "If you must pick one, which?" (Indifference still reveals something).  
  - **Time crunch**:  
    - Skip R2 if behind (it supports R1 but isn’t critical). Prioritize R3/R4 (the core contradiction).  
  - **Debrief overwhelm**:  
    - Use student quotes ("Who felt uneasy about Urn B? Why?"). Avoid lecturing.  

  ### **What It Shows (and Doesn’t)**  
  - **Shows**: Ambiguity aversion ≠ risk aversion; dynamic inconsistency; violations of reduction/sure-thing principles.  
  - **Doesn’t Show**: Which decision theory is "correct"; that ambiguity aversion is irrational (it may be adaptive!).  

  This plan creates visceral "aha!" moments by making students complicit in their own contradictions—while keeping the mood light with chocolate and a prize. The index cards ensure anonymity while letting them confront their personal choices.
