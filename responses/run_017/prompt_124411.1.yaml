prompt: |-
  I've been reading rationalist blogs and forums for something like fifteen years, and for the last four I've convened a small, semi-anonymous discussion group — eight or nine of us, mostly engineers, two physicians, one game designer — that meets monthly to take apart a single live disagreement rather than to work through a syllabus. Last month's got away from us and I want to hand it to you in a more precise form than we managed. We have a standing norm that everyone reads the host's paper and sends written comments before the meeting. One member, R., didn't comment on M.'s paper. M. — who has, by common consent, the worst commenting record in the group — sent a long message to the group chat about it. R. replied that M. of all people had no standing to say it. M. replied that this was textbook tu quoque and that her own record has no bearing on whether R. breached the norm. A third member, S., said the tu quoque framing was the category error and that R. was closer to right: standing is a legal notion, locus standi, and the whole point of standing doctrine is that a party can be right on the merits and still not be the party entitled to press the claim in that forum, because standing isn't about what the defendant did but about who may invoke the tribunal's power. A fourth member said the courtroom was simply the wrong source domain: blame is not an institutional act, there is no judge to dismiss the suit, and talk of standing is just a polite dialect for telling someone to shut up. Halfway through the evening we also noticed something that seemed to cut against R.: on the legal test M. is the injured party, and the injured party normally has the best standing of anyone in the room, which is not at all the conclusion R. wanted. R. then amended his case by appeal to the clean-hands maxim instead, so that what is withheld from M. is not the hearing but the remedy.

  What I want from you is an audit of the analogy rather than a verdict on the etiquette, and I'd rather you argued it than pointed me at a literature — we have no library access and I don't want a reading list. Please do the courtroom mapping explicitly, as a table: who is the plaintiff, the defendant, the tribunal, the injury, the remedy, the motion to dismiss, the appeal; and then, for R.'s amended version, what clean hands maps onto and whether the thing being denied is the claim, the remedy, the hearing, or the uptake. Then tell me which features of a court the analogy quietly imports into ordinary blame that blame doesn't have — a third party with authority to rule on standing, a binary rather than graded entitlement, a scarce institutional good being allocated, blame as something done to a defendant rather than said to an addressee or overheard by an audience — and sort the disanalogies into the ones that matter for the work R. wants the analogy to do and the ones that don't. I especially want to know whether the conclusion R. is using it for (that he may properly answer the criticism by pointing at the critic, without ever addressing whether he skipped the reading) survives once the disanalogies are on the table, or whether the analogy was doing all the work and collapses into either you may not raise this or merely I don't have to listen to you from her.

  Two more things, if you'll indulge them. First, one member proposed swapping the courtroom for the Austin-style speech-act picture: hypocritical blame is not false but infelicitous, a misfire or an abuse rather than an error — a void utterance, like a sentence pronounced by someone with no authority to pronounce it — so that the hypocrite's criticism says something true while failing to come off. Give me that mapping too, and tell me whether it carries R.'s conclusion any better than the legal one does, or whether it just relocates the same problem: if there is no institution, there is no one with the standing to declare the utterance void, and hearers will update on its content anyway. Second, mostly to be contrary, I floated a different model and I'd like it stress-tested rather than indulged: treat standing as a budget rather than a jurisdiction. Blaming draws on a store built up by compliance with the norm in question; the hypocrite is not disqualified but overdrawn, so the criticism still transmits its content while costing her credibility she has already spent, and further blame bounces. On that model, does it follow that reformed offenders regain standing disproportionately, that a bystander who never faced the temptation has infinite standing, that blaming the absent or the dead is costless, and that the debt is discharged by reform or by accepting blame oneself? And does it license an institution one of us half-seriously proposed — a blame escrow, where you file the criticism now and it is released to its target once you have fixed your own instance? Finally, tell me what a hypocritical criticism actually asserts: whether alongside you did wrong it carries a comparative claim about the speaker's own position that makes it self-undermining rather than merely ill-mannered, and what a rational target should do with it — whether the critic's hypocrisy is evidence about the norm's stringency, evidence about the critic's reliability, or noise, and whether the familiar observation that the people keenest to enforce a norm are often the ones who struggle with it should change the answer. If there is a better analogy than any of the three on the table, I'd like to hear it, with the correspondences stated.
reasoning: |-
  Okay, let me unpack this user's query. They've been part of a rationalist discussion group for years, and their latest meeting got heated over a disagreement about standing and hypocrisy in blame. The core issue is whether someone (M.) who has poor compliance with group norms can validly call out another member (R.) for skipping pre-meeting comments. R. responded with a tu quoque argument, which then spiraled into analogies with legal standing and speech acts.

  First, I need to map the courtroom analogy as requested. The user wants explicit correspondences: plaintiff (M.), defendant (R.), tribunal (the group), injury (breach of norm), remedy (acknowledgment/correction), motion to dismiss (R.'s "no standing" retort), appeal (R.'s shift to clean-hands doctrine). For the clean-hands amendment, it denies the remedy rather than the hearing. 

  The key disanalogies stand out: blame isn't adjudicated by a neutral third party; entitlement isn't binary; there's no scarce institutional resource. R.'s core argument ("I can deflect by pointing at M.'s hypocrisy") relies entirely on importing legal authority structures that don't exist socially. Without them, his defense collapses into either silencing M. or mere dismissal—neither addresses the actual norm breach.

  Next, the Austin speech-act model frames hypocritical blame as infelicitous (void for lack of authority). But again, without institutional backing, "void" has no force—hearers still process the criticism's content. This model fails R. similarly: it presupposes an authority that isn't present.

  Then there's the "standing as budget" model the user proposed. Blame credibility accumulates via compliance; hypocrites are overdrawn. This explains why reformed offenders regain standing (paid their debt) and why bystanders have high credibility (no withdrawals). But it has quirks: blaming the dead costs nothing, and "blame escrow" could technically work but feels impractical. Crucially, it shows hypocritical blame isn't false—just less credible. The target should still engage with the substance, discounting for the critic's unreliability. 

  The deeper insight: hypocritical criticism implicitly asserts "I uphold this norm," which undermines itself when false. But rational targets should treat the speaker's hypocrisy as reliability evidence, not validity evidence about the norm itself. Enthusiastic enforcers often struggle with norms—their hypocrisy might indicate the norm's importance, not irrelevance.

  Finally, the best analogy is economic (credibility ledger). It avoids artificial binaries, accepts graded influence, and centers communicative dynamics over institutional fictions. R. can't deflect; he must engage or concede. M.'s history makes her criticism weaker, not void.

  The user's group needs this clarity: analogies shape thought, but only if their limits are exposed. R.'s legal framing smuggles in authoritarian assumptions; dissolving it returns focus to whether he breached the norm—which he did.
answer: |-
  Here's a systematic audit of the analogies, mappings, and implications as requested:

  ### Courtroom Analogy Mapping
  | **Legal Concept**        | **Correspondence in Group Dispute**      | **Notes**                                                                 |
  |--------------------------|------------------------------------------|---------------------------------------------------------------------------|
  | **Plaintiff**            | M. (accuser)                             | Initiates the "complaint" against R.                                      |
  | **Defendant**            | R. (accused)                             | Subject of M.'s criticism                                                 |
  | **Tribunal**             | The discussion group                     | Implicit collective "court" evaluating claims                             |
  | **Injury**               | Breach of commenting norm                | Harm to group expectations                                                |
  | **Remedy**               | R. acknowledging fault/committing change | Desired outcome of M.'s criticism                                         |
  | **Motion to Dismiss**    | R.'s "no standing" objection             | Attempt to invalidate M.'s right to speak                                 |
  | **Appeal**               | R. shifting to "clean hands" argument    | Amendment after group noted injury paradox                                |
  | **Clean Hands Maxim**    | M.'s own poor commenting record          | Alleged "unclean" behavior disqualifying M.                               |
  | **What is Denied?**      | **The remedy** (not claim/hearing)       | R. argues M. cannot *receive satisfaction* due to her hypocrisy           |

  ### Critical Disanalogies & Their Impact
  | **Disanalogy**                         | **Impact on R.'s Argument**                                     |
  |----------------------------------------|------------------------------------------------------------------|
  | **No neutral tribunal**                | ⚠️ **Fatal**: Group lacks authority to rule on standing. R. self-appeals. |
  | **Blame isn't binary**                 | ⚠️ **Damaging**: Standing is gradational (e.g., M.'s record ≠ R.'s).        |
  | **No scarce institutional resource**   | ✅ *Neutral*: Blame "airtime" is non-rivalrous; all can speak.           |
  | **Blame is dialogic, not adjudicative**| ⚠️ **Fatal**: Targets can respond; no formal dismissal mechanism.        |

  **Conclusion for R.'s Defense**:  
  The analogy collapses under disanalogies. R. cannot validly dismiss M.'s claim via "standing" because:  
  - Without a tribunal, his objection reduces to **"I don't have to listen to you"** (not institutional disqualification).  
  - The clean-hands shift admits M. *can speak* but shouldn't *get remedy*—yet "remedy" in blame requires R.'s cooperation, not judicial fiat.  
  **→ R. must engage the substance or concede breach.**

  ---

  ### Speech-Act (Austin) Mapping
  | **Concept**              | **Correspondence**               |
  |--------------------------|----------------------------------|
  | **Infelicity Condition** | "Abuse" (insincere commitment)   |
  | **Void Utterance**       | Hypocritical blame               |
  | **Authority to Pronounce** | Moral credibility to enforce norm |

  **Flaws for R.'s Purpose**:  
  1. Still requires an institution to declare infelicity (absent here).  
  2. Hearers *do* process the content (M. correctly noted R.'s breach).  
  3. Reduces to **"Your blame is socially ineffective"**—but R.'s response *proves* it had uptake.  
  **→ No stronger than legal analogy; still ignores substantive truth.**

  ---

  ### Standing-as-Budget Model Stress Test
  **Core Mechanics**:  
  - Standing = credibility currency earned by norm compliance.  
  - Blaming = debit against balance.  
  - Hypocrisy = overdraft (criticism "bounces").  

  **Implications**:  
  | **Scenario**                  | **Outcome**                         | **Plausible?** |
  |-------------------------------|-------------------------------------|----------------|
  | Reformed offenders            | ✅ **Yes**: Regain standing via reform   | High           |
  | Bystander never tempted       | ❌ **No**: "Infinite" standing ignores empathy gaps | Low (overclaim) |
  | Blaming absent/dead           | ✅ **Yes**: Costless (no social penalty) | Medium         |
  | Debt discharge                | ✅ **Yes**: Reform/accepting blame refills | High           |
  | Blame escrow                  | ⚠️ **Possible but unstable**: Requires enforcement; risks gamification | Low (impractical) |

  **Strengths**:  
  - Explains *graded* influence (M.'s criticism weaker due to history).  
  - Predicts why R. rejects M. but might accept blame from others.  

  **Weaknesses**:  
  - Doesn't negate truth-value of criticism.  
  - Still avoids R.'s obligation to engage.  

  ---

  ### What Hypocritical Criticism Asserts & Rational Response  
  1. **Content**:  
     - Primary: *"You violated norm N."*  
     - Implicit: *"I endorse N and am sufficiently compliant to enforce it."*  
     → **Self-undermining** only if the implicit claim is false (making it pragmatic paradox, not logical falsehood).  

  2. **Rational Target Response**:  
     - **Not evidence about norm stringency** (hypocrisy irrelevant to N's validity).  
     - **Strong evidence about critic's reliability** (they may misjudge N's demands or their own compliance).  
     - **Not mere noise**: Signals group tension over N's enforcement.  
     - **With "keen enforcers struggle" insight**: Discount the *critic's authority*, not the *norm*. Target should:  
       (a) Acknowledge if breach occurred (separate from speaker),  
       (b) Note speaker's hypocrisy as reliability deficit.  

  ---

  ### Superior Analogy: **Credibility Ledger in Reputation Economies**  
  | **Element**         | **Correspondence**                     |  
  |----------------------|----------------------------------------|  
  | Moral capital        | Standing budget                        |  
  | Transactions         | Praise/blame exchanges                 |  
  | Creditworthiness     | Right to enforce norms                 |  
  | Debt                 | Hypocrisy deficit                      |  
  | Bankruptcy           | Irrelevance of further criticism       |  
  | **Advantages**:      |                                       |  
  | - Explains gradation (M. has low balance)           |  
  | - Permits reform (capital replenishment)            |  
  | - No false institutional assumptions (peer-to-peer) |  
  | **Conclusion for R.**: He may note M.'s low balance but cannot ignore the *debt* he incurred by skipping comments. The group ledger demands accountability first.  

  ### Final Judgment on R.'s Move  
  R.'s analogy fails because it smuggles in **coercive authority** where none exists. His defense only works if:  
  (A) The group accepts him as sole arbiter of standing (undemocratic), or  
  (B) He claims the *entire group* lacks standing to hear M. (absurd).  
  **→ Rational response:** R. must address the breach, then separately note M.'s hypocrisy as a credibility issue.**
