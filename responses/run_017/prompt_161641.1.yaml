prompt: |-
  i've been going in circles on this for about a week and it's feeding into a third-year essay on moral uncertainty that's due in a fortnight, so any help is very much appreciated. The setup: I have £20k I've decided to give away, and four options — (a) a bednet charity, (b) a long-run existential-risk fund, (c) a research fund for working out which causes are most cost-effective, (d) spend it on a extremely long holiday. I've got roughly 0.6 credence in something like a commonsense near-term view that cares a lot about identified lives and thinks (d) is genuinely, seriously wrong, and roughly 0.4 in a long-termist consequentialism that cares mostly about the far future and regards (d) as a bit wasteful but not a big deal. Here's the argument:

  (1) If you're uncertain which moral theory is true, the rational thing to do is maximize expected choiceworthiness: score each option by each theory, weight by your credence in that theory, add them up, pick the winner. (2) The theories don't measure the same thing, so their scores aren't on a common scale, and to add them you need a conversion rule. (3) The only conversion rule that isn't pulled out of thin air is to use each theory's own ranking of the options on the table: rescale so the best option on the table gets 1, the worst gets 0, and the rest sit in between in proportion. That uses only information internal to each theory, and it's invariant to what units the theory happened to be stated in. (4) But now whether (a) beats (b) depends on what else is on the table: I did the arithmetic with made-up units, and with (d) available the long-termist view's scale gets squashed relative to the commonsense one and (b) wins; delete (d) from the menu and the commonsense view's spread opens back up and (a) wins. I varied the numbers a fair bit and the flip survives, which is the worrying part. (5) That's absurd — whether I should do (a) rather than (b) can't depend on the existence of an option I'm not going to take. (6) So (3) is out; but every other conversion rule is arbitrary in the sense that nothing in the theories fixes it, since multiplying one theory's units by ten changes nothing the theory says about the world and yet flips the sum. (7) So maximizing expected choiceworthiness delivers no verdicts at all, only verdicts relative to a stipulation I can pick at will.

  That's already bad, but it gets worse when I look for an exit. (8) Fall back on the other standard view, do whatever the theory you're most confident in says. But which theory that is depends on how coarsely you carve up theory space: lump the consequentialist family into one theory and it's my favourite at 0.4; split it into four sub-variants at 0.1 each and the commonsense view at 0.35 becomes my favourite instead. Nothing in the epistemology seems to fix the right grain. (9) So no procedure for acting under moral uncertainty is well-defined, and therefore under moral uncertainty there's no such thing as one option being more rationally choiceworthy than another: the person who reads nothing and gives to their local animal shelter and the person who spends two years researching before giving are equally rational, and the whole idea of "taking moral uncertainty seriously" is empty — including, I guess, the idea of taking this argument seriously.

  I definately can't accept (9), and every paper I read treats this as a live, tractable problem, so I assume something in the chain is broken. I've tried two fixes and neither quite lands: a friend says (2) is the bad step because you can aggregate the theories' ordinal rankings instead of their cardinal scores, but that seems to throw away how much better one option is than another, and I worry about cycling; my supervisor muttered something about treating moral uncertainty like imprecise probabilities and just using a permissibility rule — don't do anything that a theory you give more than some threshold credence forbids — but that just relocates the arbitrariness to the threshold. If I have to give something up I'd rather keep (1) and (5) than (3) or (6), because giving up either of the former feels like giving up the whole enterprise, though maybe that instinct is exactly the mistake. So: which step do you reject, why does it look fine, and what does each of the available rejections actually cost me?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're writing an essay on moral uncertainty and are stuck on a theoretical issue regarding how to act when unsure between two moral theories. The core problem is that the standard method of maximizing expected choiceworthiness (MEC) seems to break down because of scaling issues between different moral theories. 

  First, I need to understand their setup clearly. They have £20k to donate among four options with credences split between a near-term commonsense view (0.6) and a long-term consequentialist view (0.4). The scaling method they're using (normalizing each theory's scores to 0-1 based on available options) leads to menu-dependence: whether (a) or (b) wins changes depending on whether (d) is considered. That feels intuitively wrong, and they're right to be troubled by it.

  Hmm, where's the flaw? I recall that standard MEC requires intertheoretic comparisons, which their normalization method tries to solve but introduces menu-dependence. The key insight might be that normalization isn't the only way - and perhaps not the correct way - to handle the scaling problem. The user thinks step (3) is unavoidable because any other scaling would be arbitrary, but that might not be true. 

  Let me think about alternatives. What if we don't normalize based on the menu? The arbitrariness concern (step 6) is valid - multiplying one theory's scale by a constant shouldn't change anything. But actually, that's exactly why we need a different approach: the ratios within a theory matter more than absolute values. For example, if long-termism says (b) is 100x better than (d), while commonsense says (a) is only slightly better than (d), that ratio information might be what we need to compare across theories. 

  The user's friend suggested ordinal aggregation, but that throws away valuable intensity information. Their supervisor mentioned permissibility rules, which avoids scaling but introduces threshold arbitrariness. Neither seems satisfactory. 

  Ah, here's a better angle: the problem might be with step (2). The user assumes theories don't share a common scale, but perhaps they do at a fundamental level. Both theories might agree that saving lives is good - they just weight near-term vs long-term lives differently. If we can find a common unit (like "life-years saved"), we might compare them directly. But that's tricky for existential risk charities where impacts are probabilistic and far-future. 

  I notice the user is particularly attached to premises (1) and (5). That makes sense - giving up MEC entirely or accepting menu-dependence both seem unacceptable. The solution must preserve these while fixing the scaling issue. 

  Looking back at literature, MacAskill's variance normalization comes to mind. Instead of normalizing to best/worst option, normalize to the spread of each theory's evaluations. This makes each theory's judgment "equally loud" in the aggregation. In their case, it would prevent the long-termist view from being squashed when (d) is present. 

  For their numbers: if commonsense assigns (a) 100, (d) 0 (range 100), while long-termism assigns (b) 1000000, (d) 1000 (range 999000), variance normalization would rescale each by their standard deviation. Suddenly the long-termist scores don't dominate just because their numbers are bigger - the spread matters. This might make (a) win regardless of (d)'s presence, solving the menu-dependence. 

  The cost? This method assumes each theory's evaluative "spread" should have equal weight in decision-making. Some might argue that if one theory has starker value differences, that should count more. But it's less arbitrary than menu-dependent normalization. 

  On their worry about theory individuation (step 8): this is separate but important. Perhaps we should aggregate based on underlying value commitments rather than labeled theories. If all consequentialist variants share core premises, aggregating them first makes sense. The epistemology might not fix the grain, but philosophical analysis of what makes theories distinct could help. 

  Ultimately, rejecting step (3) seems the least costly move. It preserves MEC (1), avoids menu-dependence (5), and while the scaling solution isn't perfect, variance normalization is principled and used in practice. The cost is accepting some meta-normative assumptions about comparing across theories, but that's unavoidable in moral uncertainty. 

  For their essay, emphasizing that MEC requires careful handling of intertheoretic comparisons - and showing how different methods lead to different practical conclusions - could actually strengthen their analysis of moral uncertainty's challenges.
answer: |-
  You've hit a profound problem in moral uncertainty theory—the **intertheoretic comparability problem**—and your frustration is warranted. The core issue is step (3), but rejecting it doesn’t sink the project. Here’s how to break the chain while preserving (1) and (5), and why alternatives are less costly than they seem.

  ### The Flawed Link: Step (3)
  **Step (3) claims:**  
  > *"The only non-arbitrary conversion rule is rescaling each theory’s scores to [0,1] based on the best/worst option on the menu."*  

  **Why this fails:**  
  - **Menu-dependence** is indeed absurd (as you note in (5)). Whether (a) or (b) wins shouldn’t hinge on whether (d) is considered.  
  - **It’s not the only option**: Rescaling to the menu’s range isn’t "internal" to the theory—it depends entirely on *which options you happen to be considering*. True "internal" rescaling would use the theory’s *own* global scale (e.g., "utility per life saved"), not your arbitrary menu.  

  ---

  ### The Solution: Reject (3) and Use Variance Normalization
  **Alternative conversion rule:**  
  Instead of normalizing to your menu’s min/max, **normalize by the variance (or standard deviation) of each theory’s evaluations**.  
  - **How it works**:  
    1. For each theory, calculate the *spread* of its scores for all options (e.g., standard deviation).  
    2. Rescale each theory’s scores so that one unit of choiceworthiness represents the *same evaluative "spread"* across theories.  
  - **Why this avoids your problem**:  
    - **Menu-independent**: Adding or removing an option (like (d)) doesn’t arbitrarily rescale the entire theory—it only slightly adjusts the variance.  
    - **Preserves intensity**: Unlike ordinal methods, it uses cardinal information.  
    - **Non-arbitrary**: Multiplying a theory’s units by a constant won’t change the rescaled scores.  

  **Applied to your case:**  
  - Suppose commonsense near-termism assigns:  
    - (a): 100 (best)  
    - (b): 10  
    - (c): 30  
    - (d): 0 (worst)  
    *SD ≈ 40*  
  - Long-termism assigns:  
    - (a): 100  
    - (b): 1,000,000  
    - (c): 500,000  
    - (d): 1,000  
    *SD ≈ 400,000*  
  - **Rescale by SD**:  
    - Commonsense: (a) = 100/40 = 2.5, (b) = 10/40 = 0.25  
    - Long-termism: (b) = 1e6/400k = 2.5, (a) = 100/400k ≈ 0.00025  
  - **Expected choiceworthiness**:  
    - (a): (0.6 × 2.5) + (0.4 × 0.00025) ≈ **1.5**  
    - (b): (0.6 × 0.25) + (0.4 × 2.5) ≈ **1.15**  
    → (a) wins, and *this doesn’t flip if (d) is removed*, since SDs are stable.  

  ---

  ### Costs of Rejecting (3)
  1. **Modest arbitrariness**: Variance normalization assumes that "one SD of choiceworthiness" is comparable across theories. But this is less arbitrary than menu-dependence—it treats each theory’s *evaluative framework* as equally "loud."  
  2. **Requires cardinality**: Theories must provide cardinal scores (not just rankings). But your theories do (e.g., "bednets save 100 lives/$10k" vs. "x-risk reduction saves 1e22 lives/$10k").  

  ---

  ### Why Other Steps Hold
  - **(1) MEC is kept**: Still maximize expected choiceworthiness.  
  - **(5) Menu-independence is kept**: No flipping based on irrelevant options.  
  - **(6) Arbitrariness reduced**: Variance normalization is theory-relative but menu-invariant.  
  - **(8) Grain problem sidestepped**: MEC remains viable, so fallback isn’t needed.  

  ---

  ### Addressing Your Escape Hatches
  - **Ordinal aggregation (your friend’s idea)**: Prone to cycles, ignores how *much* better (b) is than (d) under long-termism. Worse than variance normalization.  
  - **Permissibility rule (supervisor’s idea)**: Lets you exclude (d) if forbidden by a >0.5-credence theory. But doesn’t help choose between (a)/(b)/(c), and threshold *is* arbitrary.  

  ---

  ### What This Costs You in the Essay
  - **Concession**: MEC requires a *meta-normative choice* about intertheoretic comparisons. No perfect, theory-neutral solution exists—but **variance normalization is the least arbitrary** widely accepted method (defended by MacAskill, Riedener, others).  
  - **Broader point**: Moral uncertainty doesn’t collapse into relativism (step 9). It just forces us to clarify how theories relate. You can still criticize someone who "reads nothing" if they ignore credible theories or cardinal information.  

  **Recommendation**: Reject step (3). Use variance normalization, acknowledge its mild assumptions, and show it resolves menu-dependence. Your case study then becomes a strength—illustrating how technical choices affect real decisions.  

  *This preserves the core of MEC while avoiding absurdity. The project survives, but demands careful handling of comparability.*
