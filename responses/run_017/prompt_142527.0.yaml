  ### **Decision Tree Quiz: Historical Materialism**
  *Instructions: Answer Agree (A) or Disagree (D) for each question. Base your answer only on the information provided in the question.*

  1. **Black Death Claim**:  
     "The Black Death (14th-century plague) killed 30–50% of Europe’s population. In England, this led to the end of serfdom as workers gained bargaining power; in Eastern Europe (e.g., Poland), lords tightened serfdom to force labor. This divergence is best explained by pre-plague differences in laws, customs, or political institutions—not just the plague or the economy."  
     - ✅ A: Superstructure (laws/customs) caused the divergence.  
     - ✅ D: Base (plague/economy) caused the divergence; superstructure was secondary.  

  2. **Protestant Work Ethic Claim**:  
     "Protestantism (especially Calvinism) promoted values like hard work and thrift. These ideas independently helped cause the rise of capitalism in 16th–17th century Europe—they weren’t just a consequence of economic changes like trade or banking."  
     - ✅ A: Religious ideas independently caused economic change.  
     - ✅ D: Economic changes caused religious ideas; ideas didn’t drive capitalism.  

  3. **Legal Abolition Claim**:  
     "In 18th-century Prussia, serfdom was abolished by royal decree *before* capitalist agriculture (e.g., wage labor, markets) developed. The legal change was a necessary cause for capitalism, not just a result of it."  
     - ✅ A: Superstructure (law) constituted the new economic order.  
     - ✅ D: Superstructure (law) reflected an already emerging economic order.  

  4. **Twin Islands Thought Experiment**:  
     "Two islands start identical: same crops, tools, and trade. Island A practices equal inheritance (land divided among children); Island B uses primogeniture (eldest child inherits everything). After 100 years, Island A has many small farms and slow innovation; Island B has large estates, wage labor, and faster tech growth. The economic divergence is primarily due to the initial difference in inheritance customs."  
     - ✅ A: Superstructure (customs) caused the economic divergence.  
     - ✅ D: Identical bases would develop similarly; customs couldn’t cause divergence.  

  5. **Steam Engine Direction Claim**:  
     "The steam engine (18th-century tech) emerged primarily because capitalist property relations (e.g., private ownership, profit incentives) created the conditions for innovation—not because the technology autonomously demanded new social relations."  
     - ✅ A: Relations of production (property/class) caused forces of production (tech).  
     - ✅ D: Forces of production (tech) caused relations of production; property relations adapted to tech.  

  6. **Constitutive Courts Claim**:  
     "Courts and property laws don’t just stabilize an existing economy (e.g., protecting owners). They *create* economic order—like defining who initially owns land after conquest or revolution—not just reflecting preexisting ownership."  
     - ✅ A: Superstructure constitutively "makes" the economic base.  
     - ✅ D: Superstructure only "holds up" (stabilizes/legitimizes) the base.  

  7. **Overdetermined Revolutions Claim**:  
     "Events like the French Revolution had multiple causes: economic crises, Enlightenment ideas, political conflicts, and cultural shifts. These are so interwoven that no single factor (e.g., the economy) is primary; they’re relatively autonomous and equally causal."  
     - ✅ A: History is overdetermined; no primary level.  
     - ✅ D: One level (usually the economy) is primary.  

  8. **"Last Instance" Claim**:  
     "The phrase 'the economy determines the superstructure in the last instance' is useful, even if historical explanations *never* trace back to the economy alone (e.g., they always involve laws or ideas as steps). It’s not an empty slogan."  
     - ✅ A: "Last instance" is meaningful despite never being observed.  
     - ✅ D: "Last instance" is useless if never observed.  

