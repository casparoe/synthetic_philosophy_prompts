  The key distinctions we want to capture:
  1. Does the superstructure primarily *hold up* (stabilize, legitimate, reproduce) an existing economic order, or does it *help make* (constitute, shape) that order?
  2. What is the direction of causation between forces of production (tools, techniques) and relations of production (property, class)? Does one primarily determine the other?
  3. Are ideas and belief systems ever independent causes of major economic changes, or are they always symptoms of underlying economic conditions?
  4. How much explanatory work does "in the last instance" do? Is it a meaningful concept if we never actually get to the last instance?

  We have several cases to use:
  - The Black Death (plague) in 14th century Europe: led to the end of serfdom in Western Europe (e.g., England) but reinforced serfdom in Eastern Europe (e.g., Poland, Russia).
  - The Protestant work ethic: Max Weber's claim that Protestantism (especially Calvinism) helped cause the rise of capitalism.
  - Legal abolition of serfdom: in some cases, the legal change came before the development of capitalist agriculture (e.g., in parts of Europe, serfdom was abolished by law before capitalist agriculture was fully established).
  - A fictional case: two islands with identical economies and technology but different inheritance customs or religious beliefs, leading to divergent economic systems a century later.

  The possible positions we want to land on (with some flexibility on labels):
  1. Plain base/superstructure with the "last instance" hedge (classic Marxism).
  2. Productive forces primacy: relations of production are determined by what best develops the forces of production.
  3. Class struggle / property relations first: the relations of production (class power, property) determine the development of the forces of production.
  4. Relative autonomy: the levels (base and superstructure) are relatively autonomous and overdetermine each other (Althusserian view).
  5. Hegemony and common sense: the superstructure (ideology, culture) plays a key role in maintaining the system (Gramscian view).
  6. Ideas as one cause among many: a pluralist view where ideas, culture, etc., are independent causes and not reducible to the economy.

