prompt: |-
  I have somehow ended up on the committee that decides which projects in our new "evolution of mind" cluster get the first round of seed money, and I am the only member who is not an evolutionary psychologist — my own work is in developmental methods, so I am the person who is supposed to ask the annoying questions. Every application has the same shape: a human behavior, a story about why it would have paid off for our hunter-gatherer ancestors, and a flourish. Some of them feel like lactase persistence to me — a case where the adaptationist story has really been nailed down — and some feel like Kipling with footnotes. I cannot reliably tell which is which, I do not trust my gut, and I am going to have to defend the ranking to a dean, so before I read another application I want a written standard I can actually apply.

  What I need is a specification: what does an adaptationist hypothesis about a human psychological trait have to deliver to count as a real explanation rather than a just-so story, where "real" is relativized to the purpose — is this worth $40,000 of pilot money and a year of someone's time. Give me the requirements with the case or consideration behind each one: the phenomenon it must explain, the case it must get right, the distinction it must not collapse, the finding it must not contradict. For each requirement, tell me whether it binds any adaptationist explanation as such, or whether it is a preference of one research program dressed up as a methodological demand. My draft list, which I half-suspect is a mix of genuine desiderata and camp prejudice, runs like this: (1) the three ledgers — the story must name the currency it was maximizing and in what units, the timescale over which selection acted, and the selective regime, rather than "fitness" in the abstract; (2) the contrast class — it must say which alternative designs were actually present in the same population and lost, since "it was useful" is otherwise compatible with everything; (3) no phantom preferences — no positing a desire or module whose only evidence is the very behavior it is invoked to explain; (4) the orphan-trait discount — a trait present in exactly one lineage has no comparative leverage, and the hypothesis should be marked down for it; (5) the lag-load constraint — mismatch stories ("stone-age brains in a modern world") have to show that the environment changed faster than the trait could have tracked it by selection; (6) reachability — the design must be reachable from the ancestral design by tinkering, not engineered from scratch; (7) the engineering signature — reliable development, precision, economy, efficiency in the trait, as you would expect of something built for a job; (8) heritability and non-social transmission — cultural transmission must be ruled out; (9) cross-cultural universality; (10) some identifiable genetic basis; (11) novel predictions rather than post hoc fitting of known findings; (12) a stated finding that would kill the hypothesis.

  For each, say keep, revise, or drop, and say why, and add whatever I have missed. Three things I especially want. First: which of these are jointly unsatisfiable — my suspicion is that "generates predictions we can test now," "cites ancestral selection pressures no one can observe," and "uniquely human traits need comparative leverage" cannot all stand together, and if so the interesting output of this exercise is the impossibility result rather than the list. Second: which single requirement does the most exclusionary work, and which one, if I dropped it, would let in the worst offenders. Third: how the list handles the cases that are giving me trouble — morning sickness and food aversions in the first trimester, where pregnancy-protection and mere-byproduct stories are both on offer; the content effect on the Wason selection task, where a specialized cheater-detection device competes with general reasoning plus familiarity; a mate-preference difference that shows up in large cross-cultural surveys but reportedly shrinks in more gender-equal societies; a preference found in Western student samples that reportedly fails to appear in the small-scale societies I have read about; the mirror-image problem, where the same selective story is told for opposite findings (risk-taking shows mating competition, caution shows parental investment); and a byproduct explanation that is offered with exactly the same confidence and exactly as much evidence as the adaptation story it replaces. Any list that also rules out lactase persistence, camouflage, or the peacock's train is too strong, so use those as calibration. One further wrinkle specific to my situation: some hypotheses are fine as science but not cheaply testable, and I need to know whether "checkable within a pilot budget" is a desideratum on the theory or merely a fact about my committee.

  Only after all that, and briefly, score the main contenders against whatever list survives — the massive-modularity program, human behavioral ecology, cultural-evolution and dual-inheritance approaches, and the developmental / niche-construction style of explanation. I care far more about the criteria than the scorecard, so keep the weight on where the requirements come from and what each one is for.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on a committee for funding projects in an "evolution of mind" cluster and need a reliable standard to evaluate adaptationist hypotheses. They’re a developmental methods expert surrounded by evolutionary psychologists, feeling out of their depth. Their draft list has 12 criteria, but they’re unsure which are valid and which might be biased. They want a practical, defensible framework to avoid just-so stories.

  First, I need to break down their draft criteria. They mentioned things like the three ledgers, contrast class, phantom preferences, etc. Each needs to be assessed for whether it's essential, revisable, or droppable. The user also has specific cases they’re struggling with, like morning sickness, Wason task, mate preferences, etc. They want to ensure lactase persistence and other solid examples still pass the test.

  The user’s deeper needs include justifying their decisions to the dean, avoiding embarrassment by funding weak projects, and balancing scientific rigor with feasibility on a pilot budget. They’re worried about criteria that might be incompatible, like needing testable predictions while relying on unobservable ancestral pressures. They also want to know which criterion is most critical and which, if dropped, would let in bad proposals.

  Looking at each criterion:
  1. **Three Ledgers**: Essential. Forces specificity in selection pressures.
  2. **Contrast Class**: Keep but revise. Alternative designs in the population might be too strict; ancestral variations or plausible alternatives are better.
  3. **No Phantom Preferences**: Crucial. Avoids circularity.
  4. **Orphan-Trait Discount**: Drop for psychology. Human uniqueness is common, so comparative evidence isn't always feasible.
  5. **Lag-Load Constraint**: Keep, but for mismatch hypotheses only. Must show environment changed faster than selection could act.
  6. **Reachability**: Important. Trait must be evolvable from ancestral state.
  7. **Engineering Signature**: Keep but use cautiously. Not all adaptations are optimal; look for design evidence.
  8. **Heritability and Non-Social Transmission**: Drop. Overlooks gene-culture coevolution.
  9. **Cross-Cultural Universality**: Revise. Allow for adaptive variation.
  10. **Identifiable Genetic Basis**: Drop. Too stringent for complex traits.
  11. **Novel Predictions**: Essential for testability.
  12. **Falsifiability**: Keep. Must state what would disprove it.

  Missing criteria? They need **developmental plausibility**—how the trait emerges ontogenetically. Also, **integration with known mechanisms** and **specification of the EEA** (Environment of Evolutionary Adaptedness).

  Incompatible criteria? Yes. Ancestral pressures (unobservable) vs. testable predictions vs. comparative evidence for unique traits. Solution: Prioritize current testability over direct evidence of past selection.

  Most exclusionary criterion? **No Phantom Preferences**. It prevents circular reasoning. Dropping **Contrast Class** would allow vague "it was useful" stories.

  Handling their cases:
  - **Morning sickness**: Adaptationist story wins with multiple lines of evidence (timing, cross-cultural patterns, design).
  - **Wason task**: Cheater-detection has better design evidence than familiarity.
  - **Mate preferences**: Shrinking differences in equal societies support facultative adaptation.
  - **Western-only findings**: Suggests cultural, not evolutionary, origin.
  - **Mirror-image problem**: Need constraints like sex-specific conditions.
  - **Byproduct explanations**: Require equal evidence standards.

  Pilot budget constraint: It’s a practical filter, not a theoretical flaw. Prioritize hypotheses with feasible tests.

  Scoring research programs:
  - **Massive Modularity**: Strong on engineering signatures but weak on developmental and cultural factors.
  - **Human Behavioral Ecology**: Good at current fitness but may overlook cognitive mechanisms.
  - **Cultural Evolution**: Excels in transmission but sometimes neglects innate factors.
  - **Developmental/Niche-Construction**: Integrates development but may underemphasize selection.

  Key is balancing adaptationist criteria with feasibility and avoiding just-so stories by emphasizing testability and specificity.
answer: |-
  Below is a rigorous, actionable specification for evaluating adaptationist hypotheses in psychology, designed to filter out "just-so" stories while allowing strong candidates (like lactase persistence or camouflage) to pass. I've structured this as a revision of your draft list, with each requirement justified by its purpose, scientific basis, and practical role in assessing pilot-worthiness. I'll address your three core requests first (joint satisfiability, exclusionary power, and case applications), then refine the list, and finally score the major research programs against the final criteria.

  ### Part 1: Core Insights from Your Requests
  1. **Jointly Unsatisfiable Requirements**:  
     You identified a tension between:  
     - **Testable novel predictions** (requiring observable, contemporary evidence).  
     - **Ancestral selection pressures** (unobservable, inferred from paleo-data/ecology).  
     - **Comparative leverage for unique traits** (demanding cross-species evidence for human-specific traits).  
     
     **Impossibility Result**: These *cannot* all be strict requirements simultaneously. For uniquely human traits (e.g., complex language), comparative evidence is weak or absent, and ancestral pressures are reconstructable only indirectly. **Solution**: Prioritize *current testability* over direct evidence of past selection. A hypothesis must deliver testable predictions *today* (e.g., "If X is an adaptation for Y, we should observe Z in modern humans under condition W"). This relaxes the need for comparative data or direct observation of ancestral pressures, while still demanding rigor. Pilot studies can then test proxies for ancestral function (e.g., adaptive logic in controlled environments).

  2. **Most Exclusionary Requirement**:  
     - **No Phantom Preferences** (your #3) does the heaviest exclusionary work. It prevents circular reasoning by barring hypotheses that invent unobserved "modules" or "desires" solely to explain the target behavior. Dropping this lets in the worst offenders (e.g., "Men enjoy sports because of a Pleistocene hunting module" with no independent evidence).  
     - **Dropping Contrast Class** (your #2) would be catastrophic. Without it, any trait can be labeled adaptive ("fitness" becomes a post hoc tautology). Keep it to exclude vague "it was useful" stories.

  3. **Handling Problem Cases**:  
     - **Morning sickness/food aversions**: Keep if it specifies *design evidence* (e.g., timing aligns with fetal vulnerability; cross-cultural consistency). Adaptationist story wins here due to multiple lines of evidence (e.g., Flaxman & Sherman 2000). Byproduct stories fail if they can't explain the precision of aversions.  
     - **Wason selection task (content effect)**: Adaptationist (cheater-detection) hypothesis wins if it predicts *domain-specific performance spikes* (e.g., Cosmides & Tooby). General reasoning loses if familiarity alone doesn't replicate the effect.  
     - **Mate-preference differences shrinking in gender-equal societies**: Supports a *facultative adaptation* (adjusts to environment). Reject hypotheses insisting on fixed universality.  
     - **Preference absent in small-scale societies**: Fatal to adaptationist claims unless the hypothesis predicts *ecological contingency* (e.g., only triggers under resource scarcity).  
     - **Mirror-image problem (risk-taking vs. caution)**: Require *boundary conditions* (e.g., "Risk-taking predicts mating effort only in low-pathogen environments"). No boundary = unfalsifiable just-so story.  
     - **Byproduct explanations**: Demand equal evidence (e.g., "Music is a byproduct of language" must show shared mechanisms, not just plausibility).  
     - **Lactase persistence/camouflage/peacock's train**: All pass by specifying selective regime, contrast class, and design evidence (e.g., lactase's genetic basis and fitness benefits in dairying cultures).

  ### Part 2: Revised Requirements for Adaptationist Hypotheses
  I categorize requirements into **Core** (essential for any adaptationist explanation), **Contextual** (depends on the hypothesis type), and **Dropped** (misapplied or too restrictive). **"Real explanation"** here means: *Worth pilot funding if it delivers testable, non-tautological evidence for a selective history, with minimal assumptions*.  

  | # | Your Draft Requirement           | Verdict | Revision & Rationale                                                                                                                                 | Case/Consideration Behind It                                                                                                                                                              |
  |---|----------------------------------|----------|------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | 1 | **Three Ledgers**                | Keep     | **Require specificity in currency, timescale, and selective regime.** Currency must be quantifiable (e.g., "caloric intake," not "fitness"). Timescale must align with trait complexity (e.g., sexual selection = generations). | Prevents vague "survival" stories. Lactase persistence nails this: currency = nutrition from dairy, timescale = since animal domestication, regime = pastoralist societies.               |
  | 2 | **Contrast Class**               | Revise   | **Require plausible alternatives (ancestral variants or competing designs), not necessarily present in the same population.**                                     | "Useful" ≠ adaptive; e.g., "Why color vision *this* way?" must consider dichromacy as ancestral state. Avoids unfalsifiable claims.                                                        |
  | 3 | **No Phantom Preferences**       | Keep     | **No internal states/modules posited without independent evidence (e.g., developmental consistency, neural correlates).**                                    | Circularity filter. E.g., "Fear of snakes exists because of a snake-detection module" fails without evidence beyond the fear itself.                                                       |
  | 4 | **Orphan-Trait Discount**        | Drop     | Comparative evidence is desirable but not required. Human cognition has many unique traits (e.g., symbolic thought).                                          | Unique traits can still show adaptive design (e.g., language). Penalizing uniqueness overfits to non-human models. Keep as a weak preference, not a requirement.                         |
  | 5 | **Lag-Load Constraint**          | Keep     | **Only for mismatch hypotheses.** Must estimate selection response time vs. environmental change rate (e.g., using population genetics models).                | Protects against "Pleistocene hangover" hand-waving. E.g., Obesity mismatch must show processed foods spread faster than selection could act (~100 years? Plausible).                     |
  | 6 | **Reachability**                 | Keep     | **Show plausibility via evolutionary developmental pathways (e.g., minimal mutations, exaptation).**                                                       | Rules out "irreducible complexity" errors. E.g., Eye evolution is reachable from light-sensitive patches.                                                                                 |
  | 7 | **Engineering Signature**        | Revise   | **Require *some* design evidence (e.g., reliability, efficiency), but allow for trade-offs and constraints.** Not all adaptations are optimal.                     | Camouflage shows precision; peacock's train shows costliness as sexual signal. But human traits may be "good enough" (e.g., appendix). Weak signatures weaken the case but don't kill it. |
  | 8 | **Heritability/Non-Social Trans.** | Drop   | Cultural transmission can *co-drive* adaptations (gene-culture coevolution). Require only that genetic *or* cultural inheritance plausibly supports selection. | Lactase persistence involves both genes and culture. Dropping this avoids false dichotomies.                                                                                              |
  | 9 | **Cross-Cultural Universality**  | Revise   | **Predict universality *or* facultative variation (if ecology modulates the trait).** Reject rigid universality demands.                                      | Mate preferences vary with pathogen load (Gangestad & Buss). Absence in some cultures must be explained (e.g., triggered only in high-risk ecologies).                                   |
  | 10| **Identifiable Genetic Basis**   | Drop     | Too restrictive for complex traits (e.g., intelligence). Require only that the trait is *heritable* in broad sense (genetic or cultural).                       | Many adaptations are polygenic or epigenetically regulated. Pilot studies can't sequence genomes cheaply.                                                                                 |
  | 11| **Novel Predictions**            | Keep     | **Must generate testable predictions beyond the explained behavior.** Prioritize hypotheses with *feasible* pilot tests (e.g., experiments, surveys).          | Key for pilot funding. E.g., "If jealousy is a mate-guarding adaptation, it will peak when partner infidelity risk is high" → testable with vignettes.                                   |
  | 12| **Falsifiability**               | Keep     | **Explicitly state what evidence would kill the hypothesis.**                                                                                              | E.g., "Lactase persistence is an adaptation for dairy digestion" is falsified if it predates dairying.                                                                                    |
  | **ADDED** | **Developmental Plausibility** | Add    | **Must explain how the trait develops reliably across expected environments (e.g., critical periods, learning mechanisms).**                               | Adaptationist stories often ignore ontogeny. E.g., Food aversions must develop early without cultural input. Filters "innate module" just-so stories.                                   |
  | **ADDED** | **Integration with Known Mechanisms** | Add | **Must align with established neuroscience, endocrinology, or psychology.**                                                               | Prevents "adaptive storytelling" divorced from biology. E.g., Stress responses must involve HPA axis.                                                                                   |
  | **ADDED** | **Specify EEA**                | Add    | **Describe the Environment of Evolutionary Adaptedness (EEA) with ecological/historical data, not speculation.**                                         | E.g., Hunter-gatherer EEA for social traits should reference ethnography. Forces grounding in real habitats.                                                                            |

  **Final Core Requirements for Pilot Funding**:  
  1. Three Ledgers (specificity).  
  2. Revised Contrast Class (plausible alternatives).  
  3. No Phantom Preferences (no circularity).  
  4. Falsifiability (kill condition).  
  5. Novel Predictions (testability).  
  6. Developmental Plausibility (ontogeny).  
  7. Integration with Known Mechanisms.  
  8. Specify EEA (selective regime).  
  *Contextual*: Lag-Load (for mismatch), Engineering Signature (weighted), Reachability.  
  *Dropped/Downgraded*: Orphan-Trait, Heritability, Universality (revised), Genetic Basis.  

  **Why This List?**  
  - **Balances rigor and feasibility**: Drops genetically unrealistic demands but adds developmental/mechanistic grounding.  
  - **Prioritizes testability**: Novel predictions + falsifiability + pilot-friendly methods (e.g., experiments) make proposals fundable.  
  - **"Checkable within pilot budget"** is a **practical constraint on proposals**, not a theoretical desideratum. A hypothesis can be valid but impractical (e.g., requiring ancient DNA). Reject proposals lacking *any* pilot-scale test (e.g., fMRI on foragers), but don't weaken standards.  

  ### Part 3: Scoring Major Research Programs
  Using the final requirements above (scale: ★ = fully meets, ☆ = partially, ✘ = weak):  

  | Approach                  | Three Ledgers | Contrast Class | No Phantom Pref. | Falsifiability | Novel Predictions | Developmental Plaus. | Mech. Integration | Specify EEA | **Pilot Strength**                                     |
  |---------------------------|---------------|----------------|------------------|----------------|-------------------|----------------------|-------------------|------------|--------------------------------------------------------|
  | **Massive Modularity**    | ☆             | ✘              | ★                | ★              | ★                 | ✘                    | ☆                 | ☆          | **Moderate**: Strong predictions but ignores development/EEA specificity. Lab-tests cheap, but cross-cultural work expensive. |
  | **Human Behavioral Ecology** | ★           | ★              | ★                | ★              | ★                 | ☆                    | ✘                 | ★          | **High**: Field-friendly (e.g., foraging decisions). Weak on mechanisms but ledger/EEA strong.                     |
  | **Cultural Evolution**    | ☆             | ★              | ★                | ★              | ★                 | ★                    | ☆                 | ☆          | **High**: Tests transmission (e.g., memory experiments). Strong development, but EEA often underspecified.          |
  | **Developmental/Niche Construction** | ★       | ★              | ★                | ★              | ☆                 | ★                    | ★                 | ★          | **High**: Embeds traits in life history (e.g., plasticity). Pilot-friendly if using existing cohorts.              |

  **Key Takeaways**:  
  - **Massive Modularity** struggles most (phantom preferences risk, ignores development).  
  - **Behavioral Ecology** excels on adaptationist criteria but neglects proximate mechanisms.  
  - **Cultural/Developmental** approaches best meet the revised standards by integrating evolution with real-world constraints.  

  ### Summary for Your Committee  
  **Use this framework to demand**:  
  - Specificity in selective pressures (ledgers, EEA).  
  - Testability now (novel predictions, falsifiability).  
  - Biological and developmental plausibility (no circularity, mechanisms, ontogeny).  
  **Reject proposals that**:  
  - Invoke unobserved "modules."  
  - Fail to specify what would disprove them.  
  - Have no pilot-feasible tests.  
  **Compromise on**:  
  - Universality (allow adaptive variation).  
  - Comparative evidence (prioritize function over phylogeny).  

  This list filters Kipling-esque stories while funding testable science—like your lactase persistence benchmark. When in doubt, ask: "What can they *do* with $40K that would make this more than a story?" If the answer isn't concrete, reject.
