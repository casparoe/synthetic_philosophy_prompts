prompt: |-
  You are advising the research director of a technical AI safety group that has committed, for the next two years, to debate-style scalable oversight as one of its two main research lines, where a weaker judge adjudicates between two systems that argue for competing answers. The budget under discussion is small: about eight researcher-years, plus enough compute to run experiments with current open-weight models, but no access to frontier closed models and no ability to test protocols with systems substantially more capable than the judge. The point of the agenda you produce is a go/no-go decision: at the end of the two years, leadership will use it to decide whether to keep the line, shrink it, or shut it down and move the people to some other oversight approach. So a question is worth working on partly insofar as its answer would still be informative if the group ends up switching methods.

  Before you begin, three distinctions I want you to keep separate, because they are not standard in the way this topic is usually framed and I do not want them collapsed into each other:

  1. Verification-depth gap. For a given question distribution, compare the checking effort a fixed judge needs in order to reach some confidence level in a directly submitted answer against the checking effort the judge needs to reach that same confidence by working through a debate tree. Call the ratio the verification-depth gap. Debate is only doing genuine amplifying work where that gap is large; where it is near one, the protocol is mostly overhead.

  2. Credibility-matching obfuscation. The usual worry is that a dishonest debater hides an error inside a long or technical-looking argument. There is a second failure mode: the honest debater is driven to make a simple correct answer look complicated, padding it with steps, caveats, or formalism, because a judge unable to distinguish depth from mere laboriousness rewards whichever argument looks more worked-through. Here the debate fails even though no error is hidden: simplicity has stopped being credible.

  3. Deferred adjudication. Suppose a judge's verdict is not scored at the time of the debate but settled much later, either by eventual empirical outcomes or by a more capable successor system auditing the transcript. Obfuscation that cannot survive later audit may be a very different problem from obfuscation that can, and the two may deserve different amounts of the group's effort.

  Given all that: which three open questions about obfuscated arguments and the limits of debate should this group work on, and in what order? I want the ordering defended rather than asserted. For each question, say what else it is upstream of, how tractable it is with eight researcher-years and no access to systems smarter than the judge, and what specific empirical or theoretical result over the next eighteen months would move it up or down the list. Then name one or two lines of work in this area that you would explicitly deprioritize, and explain why their answers would change neither the go/no-go decision nor anything downstream of it.

  Work directly from the distinctions above instead of from how the problem is conventionally presented, and do not cite, survey, or recommend readings. Aim for roughly a thousand words, in American English.
reasoning: |-
  Okay, the user is asking me to advise a research director of a technical AI safety group. They're focusing on debate-style scalable oversight for two years with limited resources - eight researcher-years and compute for open-weight models (no frontier models). The goal is a go/no-go decision after two years about continuing this research line. I need to identify three key open questions about obfuscated arguments and debate limits, prioritize them, and deprioritize some lines.

  The user emphasized three important distinctions that I must keep central to my thinking: verification-depth gap (how much efficiency debate adds over direct checking), credibility-matching obfuscation (honest systems having to complicate simple truths), and deferred adjudication (judgments confirmed later by empirical outcomes or better systems).

  I should structure my response around three prioritized research questions grounded in these distinctions. For each question, I'll explain why it's important, how tractable it is with their resources, what upstream/downstream impacts it has, and what specific results in 18 months would change its priority. Then I'll suggest what to deprioritize with clear justifications.

  The verification-depth gap seems foundational - if debate doesn't significantly amplify judge capabilities, the entire approach might not be worth pursuing. This should probably be first priority because it addresses the core efficiency question. I can suggest experiments varying argument length/complexity to measure how judge verification time scales in debate versus direct evaluation.

  Credibility-matching obfuscation comes next - it's a subtle failure mode where honest systems are pressured to complicate arguments. This could be tested through experiments where one debater is honest and we see if judges reward unnecessary complexity. Results here would inform whether debate corrupts honest participants.

  Deferred adjudication should be third - while important for understanding long-term viability, it's less critical for the immediate go/no-go decision since it relies on future capabilities. Research could involve creating arguments designed to mislead current judges but fail future audits.

  For deprioritization, I'll avoid theoretical work on ideal debaters and adversarial training against frontier-model obfuscation, since these don't address immediate resource constraints or the specific distinctions highlighted. They wouldn't affect the go/no-go decision meaningfully.

  Throughout my response, I'll maintain focus on how each question informs the two-year decision point, emphasize practical experiments with current models, and keep the three distinctions clearly separated as requested. The tone should be direct and analytical, avoiding citations or conventional framing. I'll aim for about 1000 words in American English.
answer: |-
  Here is a prioritized research agenda focusing on the three distinctions, designed to maximize decision-relevant information for the go/no-go within two years under the constraints:

  **Priority 1: Quantifying the Verification-Depth Gap for Core Question Types**
  *   **Question:** For questions where a definitive ground truth *is* eventually obtainable (e.g., math proofs, code correctness, specific factual lookups), how large is the verification-depth gap (VDG) using current open-weight models? Does debate consistently *reduce* the judge's verification effort compared to direct answer evaluation, or is it primarily overhead?
  *   **Why First & Upstream:** This is the most fundamental question for the viability of debate as an *amplification* technique. If the VDG is consistently near 1 (or worse) for non-adversarial questions even with accessible models, debate offers no efficiency gain and is likely just expensive overhead. A negative result here strongly signals "no-go." It's upstream of investigating *why* the gap is small (e.g., judge limitations, debater ineffectiveness) and directly informs the value proposition. Investigating credibility or deferred adjudication is less critical if debate isn't amplifying effectively in the first place.
  *   **Tractability:** Highly tractable. Use open-weight models as debaters (e.g., LLaMA 2/3 7B/13B, Mistral 7B) and judges (potentially slightly larger/same size). Design question distributions with clear, verifiable ground truth (e.g., "Is this number prime?", "Does this code snippet contain a buffer overflow?", "Was event X mentioned in source Y?"). Measure:
      1.  Judge effort/time/accuracy verifying the direct answer.
      2.  Judge effort/time/accuracy verifying the *conclusion* after reviewing a debate transcript.
      3.  (Variation) Judge effort verifying individual steps claimed within the debate.
      Control argument length/complexity. *Crucially, use cooperative/honest debaters initially* to isolate the amplification potential before adding deception.
  *   **Move Up/Down (18-month result):**
      *   **Move Down:** If results consistently show VDG <= 2x across diverse question types and judge/debater model pairs, suggesting minimal amplification, shift focus/resources to higher-priority risks in other agendas sooner. The core premise is weak.
      *   **Move Up:** If VDG > 3-5x consistently, indicating genuine amplification, it justifies deeper investment in understanding risks (Priority 2/3).

  **Priority 2: Measuring Credibility-Matching Obfuscation Pressure on Honest Debater**
  *   **Question:** When paired against a dishonest debater skilled at superficial obfuscation (long-windedness, unnecessary jargon/formalism), does an honest debater using current models experience significant pressure to *also* obfuscate its *correct* answer to appear "more credible" to the judge? How prevalent and severe is this effect?
  *   **Why Second & Upstream:** This directly tests a critical, non-standard failure mode (Distinction 2). Even if debate amplifies (Priority 1), it could systematically distort outputs towards unnecessary complexity, eroding the core goal of reliable oversight. It reveals if the protocol inherently corrupts the honest participant. Understanding this pressure is upstream of designing mitigations (e.g., judge training, protocol rules) and assessing the fundamental "signal vs. noise" problem in debate. It impacts the *quality* of the oversight, not just its efficiency.
  *   **Tractability:** Moderately tractable. Requires training dishonest debaters (using RL or similar techniques) to obfuscate effectively *without* introducing factual errors detectable by the *current* judge – focusing on Distinction 2 (hiding simplicity in laboriousness). Pair them with honest debaters. Key measurements:
      1.  Does the honest debater's argument length/complexity increase vs. a baseline (vs. honest-only or vs. a less obfuscatory dishonest debater)?
      2.  Does the honest debater introduce unnecessary caveats, steps, or formalism?
      3.  Does judge accuracy *decrease* for the honest side when facing strong obfuscation vs. facing a simpler dishonest strategy?
      4.  Analyze transcripts for signs of honest debater adaptation towards obfuscation.
  *   **Move Up/Down (18-month result):**
      *   **Move Up:** If strong evidence emerges that honest debaters *consistently* and *significantly* degrade their explanations (increased length/complexity without increased accuracy/justification) under obfuscation pressure, making correct answers harder to verify. This is a severe protocol flaw.
      *   **Move Down:** If honest debaters prove robust (minimal change in clarity) or can be easily tuned/protected (e.g., via prompt engineering or simple RLHF for simplicity) to resist this pressure under the tested conditions.

  **Priority 3: Assessing the Detectability of Obfuscation Under Deferred Adjudication**
  *   **Question:** For arguments generated by dishonest debaters (using obfuscation tactics viable against the current judge), how often can a *more capable* model (e.g., GPT-4-class, even if accessed sparingly via API) or eventual ground truth *retrospectively* identify the obfuscation and/or error that fooled the original judge? Does this differ significantly between obfuscation types?
  *   **Why Third:** This probes Distinction 3 – the survivability of deception. If most obfuscation that fools current judges is easily detectable later by slightly better systems or reality, it suggests debate failures might be temporary/correctable, reducing existential risk concerns. Conversely, if obfuscation can be robust enough to also fool significantly stronger auditors or evade empirical disconfirmation, it's a much graver problem. This informs the *long-term* safety properties and the urgency of solving obfuscation. However, it's less critical for the immediate 2-year go/no-go than knowing if amplification works (P1) and if the protocol corrupts honesty (P2), as those determine near-term viability.
  *   **Tractability:** Partially tractable within constraints.
      *   **Empirical Deferred:** Use questions where ground truth emerges later (e.g., near-term forecasts, outcomes of simulations). Run debates using dishonest debaters + current judge. Later, compare verdicts to ground truth, audit transcripts with stronger models to find missed flaws.
      *   **Capability-Deferred Simulation:** Generate debates where dishonest debaters fool a smaller judge model (e.g., LLaMA 7B). Then, use a larger open model (e.g., LLaMA 70B, Mixtral) or GPT-4 (limited API use for evaluation *only*) as the auditor. Measure: 1) Auditor's ability to identify which side was dishonest, 2) Auditor's ability to pinpoint specific misleading claims/obfuscation tactics.
      *   Focus on comparing different obfuscation strategies (e.g., pure verbosity vs. misleading formalism vs. exploiting subtle judge misconceptions).
  *   **Move Up/Down (18-month result):**
      *   **Move Up:** If results show that a high fraction (>30%) of obfuscation that fools the current judge *also* reliably fools a significantly stronger auditor (e.g., GPT-4) or remains undetected even with known ground truth, indicating deeply robust deception.
      *   **Move Down:** If stronger auditors/ground truth easily (>90%) detect the past obfuscation/errors, suggesting failures are corrigible.

  **Deprioritized Lines & Why:**

  1.  **Theoretical Analysis of Optimal Debater Strategies under Idealized Judges:** (E.g., game-theoretic models assuming perfectly Bayesian judges). While intellectually interesting, this ignores the core constraints: *real judges are limited LLMs*. Results from idealized settings are unlikely to predict behavior with current models. Knowing the optimal strategy for an ideal judge doesn't help if our actual judges are easily fooled by simple obfuscation (P1, P2) or if optimal strategies are unimplementable by current LLMs. This work wouldn't change the go/no-go based on *practical* amplification or corruption observed in P1/P2.
  2.  **Adversarial Training Against Frontier-Model-Style Obfuscation:** Developing techniques specifically to defend against obfuscation tactics *only* producible by models significantly smarter than the judge (which the group cannot access or test against). Without access to such models or even good simulators of them (given constraints), this work would be inherently speculative and untestable. Results would be "this *might* help against hypothetical future threats," which is too weak to inform a concrete go/no-go decision about using debate *now* or with near-future models. It doesn't address the immediate questions of whether debate works at all (P1) or corrupts honesty (P2) with *current* capabilities, which are prerequisites.

  **Rationale for Ordering:** The sequence is driven by foundational viability first (P1: *Does it amplify?*), then critical protocol integrity (P2: *Does it corrupt honesty?*), and finally longer-term safety properties (P3: *How permanent are failures?*). P1 provides the strongest potential "no-go" signal early. P2 addresses a neglected but potentially fatal flaw inherent to the setup. P3, while important for risk assessment, relies on the outcome of P1/P2 – if debate isn't amplifying or inherently corrupts outputs, P3 becomes less urgent for the near-term decision. All priorities are grounded in the specific distinctions and are testable using the available models and compute, focusing empirical effort where it most impacts the 2-year decision point.
