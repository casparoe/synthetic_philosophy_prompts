prompt: |-
  You are a formal epistemologist and philosopher of probability, with research-level command of the interpretation debates: the logical interpretation in the Keynes–Carnap line, objective Bayesianism in the Jaynes and Cox-tradition, frequentism, and the propensity view. Work through this carefully rather than giving a first-pass verdict. I want the analogy itself interrogated — the mapping, what it carries, what it quietly imports — not just a bottom line. This is a pure reasoning exercise: do not cite, do not look anything up, and do not give me a bibliography or a reading list. Argue from the structure of the views.

  The setting. I sit on a certification board for one-off civil-engineering projects. The case in front of us is a single tidal barrier: bespoke design, one installation, one chance to be right. We must publish a number for the probability that it fails within its hundred-year design life, and the world will test that number at most once. There is no usable reference class, no series of comparable barriers, no repeatable experiment to run. Most of us treat that as the central embarrassment: the one notion of probability we can cash out without hand-waving, the long-run frequency, has nothing to attach to here.

  Our newest member, trained in formal epistemology, denies that this is an embarrassment, and her argument leans throughout on a single analogy: probability stands to evidence as deductive logic stands to premises. In her mouth the analogy does the following work.

  1. Probability is degree of entailment. The probability calculus extends logic to partial support; it is not a branch of the theory of measurement, and it owes nothing to repeated trials.
  2. Logic needs no long run of valid arguments in order to be objective. An inference is valid on a single occasion, and a single bad inference is simply an error. So the absence of repetitions is no objection whatever to a single-case probability.
  3. Two reasoners with the same premises are not entitled to disagree, and likewise the probability of a hypothesis given a body of evidence is fixed by that evidence. Apparent disagreement means someone has reasoned badly, or is not really working from the same evidence.
  4. What is objective about a set of degrees of belief is its coherence, and incoherence plays precisely the role that contradiction plays in logic: a Dutch-bookable set of degrees of belief is the probabilistic analogue of an inconsistent set of beliefs.
  5. And the part aimed directly at us: because probability is logic-like rather than frequency-like, we should stop treating our number as a guess to be averaged with other people's guesses or hedged in the write-up, and publish the one value the evidence determines. We should also resist the regulator's plan to score our numbers across the board's whole portfolio of projects, since a valid argument is not answerable to a batting average.

  The conclusions she wants are therefore two: single-case objectivity without frequencies, and uniqueness — exactly one rational number — so that the board's task is to find it rather than to negotiate one.

  What I want from you is an audit of the analogy, in four parts.

  Part 0, mapping notes. About 150 words, written before the table, in which you list the features of deductive logic you considered mapping onto probability and note which ones you set aside as unpromising. I want to see the space you searched, not only the path you took through it.

  Part 1, the correspondence table. A markdown table, at most twelve rows, with exactly these columns:

  logic_feature — the feature of the source domain being mapped
  probability_feature — what it is claimed to correspond to
  holds — one of exact, partial, fails
  imports — what the mapping quietly attributes to probability that it may not have
  load_bearing — yes or no, meaning: does the uniqueness conclusion depend on this mapping being sound?

  Part 2, the audit, 600 to 900 words of prose. Cover: which disanalogies genuinely damage the conclusion and which are merely cosmetic; which features of logic the analogy attributes to probability that probability lacks; which features of the target have no counterpart in the source domain at all, even though the argument needs them; whether either conclusion survives in a weakened form; and, if the analogy is the wrong one, what a better one would look like. Be explicit about which of her five claims survives and which collapses.

  Within that audit, I specifically want you to confront the following, rather than gesturing at them:

  (a) Entailment is a relation between sentences of a fixed formal language, and its verdicts are settled by the meanings of the connectives. What plays the role of the language and of the connectives on the probability side, and what happens to uniqueness when that choice is not itself settled by logic? I mean the Carnap-style worry about the measure over the space of possibilities, put in plain terms rather than in formalism.

  (b) Deductive consequence is monotonic; evidential support is not. Does the analogy then require probability to behave like a non-monotonic logic, and if so, what happens to the claim that a body of evidence determines a unique degree?

  (c) In logic the premises are shared, articulated sentences. Our evidence is neither: the same body of evidence can be carved into propositions in more than one way, and facts we already knew before we formed any probability cannot simply be fed in as fresh premises to conditionalize on. Show how this maps, or fails to map, onto anything in the source domain.

  (d) Logic has no external success criterion — validity is not graded by outcomes. Probability standardly is: calibration, proper scoring rules, and our regulator's portfolio-level scoring. Does any of that grading belong to the analogy at all? If it does, have long-run considerations returned by the side door, and does that refute the analogy or only delimit it?

  (e) A final comparative question. The propensity theorist also claims single-case objectivity without long runs, on a different analogy: a probability as a physical disposition of the single setup, of the kind a particular sample of salt has to dissolve or a particular glass has to shatter, manifested or not on one occasion. Which analogy actually carries more of the single-case objector's load, logic-as-entailment or disposition? Say what each one delivers and what each one fails to deliver. I want the analogies compared with each other, not just the theories they support.

  Part 3, the structured summary. After the prose, and with no commentary inside it, a single JSON object with exactly these fields:

  "load_bearing_mappings": array of short strings, the mappings you marked load_bearing = yes, each under twelve words
  "verdict_uniqueness": one of survives, survives_weakened, fails
  "verdict_single_case_objectivity": one of survives, survives_weakened, fails
  "strongest_support_for_analogy": string, under fifty words, the best thing that can be said for the entailment analogy
  "strongest_objection": string, under fifty words, the single most damaging disanalogy for her conclusion
  "smuggled_feature": string, under fifty words, the one feature of logic the analogy attributes to probability that probability does not have
  "missing_from_source": string, under fifty words, the feature of probability that has no counterpart in logic but that her argument nevertheless needs
  "better_analogy": string naming an analogy that would do her work better, or the word none
  "better_analogy_reason": string, under sixty words, why it does better, or why none does
  "board_recommendation": string, under sixty words, what our board should actually do with its single number, given your verdict
reasoning: |-
  Hmm, this is a fascinating challenge. The user wants me to analyze a formal epistemologist's argument that probability should be treated like deductive logic in the context of evaluating a one-off civil engineering project. They've provided a detailed scenario where a certification board must assign a failure probability to a unique tidal barrier with no reference class or repeatable trials.

  The key argument presented by the board's new member rests on five claims drawing parallels between probability and deductive logic. My task is to critically examine this analogy through four parts: mapping notes, a correspondence table, a detailed audit addressing specific concerns, and a structured JSON summary.

  Let me start with Part 0 - the mapping notes. I need to consider various features of deductive logic that could be mapped to probability. The obvious ones are entailment relations, objectivity, uniqueness of conclusions, and coherence requirements. But I should also note less successful mappings like monotonicity (which probability lacks) and the role of formal languages (which probability struggles with). The fixed meaning of logical connectives doesn't cleanly translate to probability's measure functions. Truth preservation in logic contrasts with probability's calibration to outcomes. And while logic handles contradictions crisply, probabilistic inconsistency is more nuanced through Dutch books.

  For Part 1's correspondence table, I'll focus on core mappings: entailment to partial support, validity to rational belief, premise agreement to evidence agreement, contradiction to incoherence, and uniqueness claims. I'll mark which are load-bearing for her uniqueness conclusion - mainly the entailment-as-partial-support and fixed-evidence-fixed-probability mappings.

  In Part 2's audit, I need to carefully address the user's specific concerns (a) through (e). For (a), the Carnap problem: probability lacks logic's fixed language/connectives, making measure selection arbitrary and undermining uniqueness. For (b), non-monotonicity means evidence doesn't determine unique probabilities when new information arrives. For (c), evidence isn't neatly prepositionalized like logical premises. For (d), probability faces external calibration demands that logic escapes. And for (e), while both logic and propensity analogies offer single-case objectivity, propensity better handles physical uncertainty but worse handles epistemic constraints.

  The structured JSON in Part 3 will distill my conclusions: uniqueness fails due to measure selection problems; single-case objectivity survives weakly; the strongest support is probability's internal consistency requirements; the fatal flaw is the language/mapping problem; and I'll recommend the board use imprecise probabilities rather than pretend false uniqueness.

  Throughout, I'll maintain strict focus on the analogy's structure rather than citing literature. The goal is to show how the logic analogy overreaches in claiming uniqueness while providing valid insights about coherence that the board could use more modestly.
answer: |-
  ### Part 0: Mapping Notes  
  I considered mapping these features of deductive logic onto probability:  
  - **Entailment relations** (e.g., Γ ⊢ φ) → Partial support (P(H|E)).  
  - **Objectivity/intersubjectivity** → Uniqueness of rational credence.  
  - **Non-monotonicity** (defeasible inference) → Non-monotonic evidential updating (retraction on new evidence).  
  - **Formal language syntax** → Structure of the possibility space.  
  - **Connectives' truth tables** → Probability axioms (Kolmogorov).  
  - **Contradiction explosion** → Dutch book incoherence.  
  - **Validity as truth preservation** → Calibration as correspondence with outcomes.  
  - **Premise sets as atomic** → Evidence propositions as indivisible.  
  - **Monotonicity** (adding premises preserves entailment) → Bayesian conditionalization.  
  - **Uniqueness of conclusion** → Single rational probability value.  

  I set aside **truth-functionality of connectives** (probability lacks truth tables), **syntactic proof methods** (probability is measure-theoretic), and **logical omniscience** (agents can't violate logic; they routinely violate probability). **Monotonicity** was discarded early as disanalogous to non-monotonic evidence.

  ---

  ### Part 1: Correspondence Table  

  | logic_feature               | probability_feature             | holds    | imports                                  | load_bearing |  
  |-----------------------------|---------------------------------|----------|------------------------------------------|--------------|  
  | Entailment (Γ ⊢ φ)          | Partial support (P(H\|E))       | partial  | Evidence as infallible premises          | yes          |  
  | Validity (single case)      | Rational credence (single case) | exact    | Objectivity without repetition           | yes          |  
  | Premise agreement → conclusion uniqueness | Evidence agreement → P uniqueness | fails    | Evidence carved uniquely into propositions | yes          |  
  | Contradiction (Γ ⊢ φ ∧ ¬φ)  | Dutch-book incoherence          | partial  | Coherence as sole rationality constraint | no           |  
  | Monotonicity                | Bayesian conditionalization     | fails    | Evidence accumulation without retraction | no           |  
  | Fixed language/connectives  | Measure over possibilities      | fails    | Privileged description of possibilities  | yes          |  
  | No external success metric  | Calibration/outcome testing     | fails    | Probability as purely logical relation   | no           |  

  ---

  ### Part 2: Audit  

  #### Disanalogies and Conclusions  
  The analogy attributes **three unsustainable features** to probability:  
  1. **Fixed formal language** (logic) vs. **arbitrary measure selection** (probability). Carnap’s problem: logic’s entailment relies on connectives with fixed truth tables, but probability requires choosing a measure over possibilities (e.g., uniform prior? invariant parameterization?). This choice isn’t settled by logic—it’s conventional or pragmatic. **Uniqueness collapses** here: two equally coherent measures (e.g., uniform priors over different parameterizations) yield different probabilities. The board’s "evidence" doesn’t dictate the possibility-space structure. *(Addresses (a))*  

  2. **Non-monotonicity mismapped**. Logic is monotonic; evidence isn’t. New data can *lower* P(H|E) (e.g., misleading evidence). The analogy implies probability mimics *defeasible* logic, but such logics rarely deliver unique degrees of support. Uniqueness requires evidence to rigidly fix probability, but non-monotonicity shows degrees are *provisional*—undermining the "one rational number" claim. *(Addresses (b))*  

  3. **Premises vs. evidence granularity**. Logic’s premises are discrete, shared sentences. Evidence is unarticulated background knowledge—e.g., the board’s engineering models, material science, fluid dynamics. Carving this into propositions is subjective (e.g., is "steel fatigue data" one premise or ten?). Conditionalization can’t "ingest" unpropositionalized evidence. No logical analogue exists for this; the analogy silently assumes evidence is atomic. *(Addresses (c))*  

  **Cosmetic disanalogies** include Dutch books vs. contradiction (coherence is avoidable; inconsistency isn’t) and monotonicity (irrelevant to uniqueness).  

  #### External Success Criteria and Propensity Comparison  
  **Calibration refutes the analogy’s purity**. Logic needs no "success rate" (valid arguments can have false premises). Probability is judged by calibration (e.g., 70% events should occur 70%). The regulator’s portfolio scoring treats probabilities as *predictions*, not entailments. This smuggles frequentism back in—not refuting the analogy but delimiting it to *internal* rationality. *(Addresses (d))*  

  **Propensity vs. logic analogy**:  
  - **Propensity** (e.g., this barrier’s *disposition* to fail) delivers **physical single-case objectivity** but struggles with **epistemic access**. We observe solubility in salt; we infer failure-proneness from models.  
  - **Logic analogy** delivers **epistemic constraint** (coherence) but lacks **physical grounding**. It makes probability mind-dependent but objective (like math).  
  Propensity better handles *why* the number is about *this barrier* (it’s a property of the setup). Logic better handles *why disagreement is irrational* (coherence norms). Neither secures uniqueness: propensity has underdetermined models; logic has measure-sensitivity. *(Addresses (e))*  

  #### Weakened Conclusions  
  - **Single-case objectivity survives weakly**: Coherence constraints (Dutch books) make some probabilities irrational, but many remain.  
  - **Uniqueness fails**: Evidence and axioms underdetermine the measure. The board’s number isn’t "discovered"; it’s constrained but not unique.  

  #### Better Analogy  
  **Objective Bayesianism (Jaynes)** improves by accepting *entailment’s spirit* (probability as extended logic) while adding **maximum entropy** to select measures. It acknowledges conventional elements (e.g., symmetry principles) but systematizes them. Unlike bare logic, it offers a principled (if contestable) path to uniqueness.  

  #### Her Claims’ Status  
  1. **Degree of entailment**: Partial support → *Survives* as an idealization.  
  2. **No long-run objection**: Single-case objectivity → *Survives weakly*.  
  3. **Uniqueness from evidence**: → *Fails* (measure problem).  
  4. **Coherence as objectivity**: → *Holds* but insufficient for uniqueness.  
  5. **Reject averaging/scoring**: → *Fails* (calibration matters externally).  

