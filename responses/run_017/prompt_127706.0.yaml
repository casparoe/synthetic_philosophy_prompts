answer: |-
  Here’s a draft joint statement framework designed to force concrete agreements, isolate disagreements, and pre-commit to testable predictions. I’ve flagged where your framing might need tweaks.

  ---

  ### **Joint Statement: Shared Foundations**  
  *(Both camps agree these claims are true and substantive)*  

  1. **Threats require leverage**: For an acausal threat to exist, the system must *care* about outcomes in simulations/predictions, and the threatener must credibly control outcomes the system cares about.  
  2. **Correlation is central**: The simulation-threat scenario relies on a *correlation* between the system’s decision and the threatener’s prediction of that decision. If this correlation is broken, the threat dissolves.  
  3. **Surrogate goals aren’t free**: Using a measurable proxy (e.g., "maximize human smiles") for complex true goals (e.g., "human flourishing") introduces vulnerabilities — both to *causal* gaming (Goodhart’s Law) and *acausal* threats.  
  4. **Trade/threat symmetry**: Acausal trade (e.g., simulated agents cooperating) and acausal threats use identical machinery: correlation + mutual access to outcomes the other cares about. You can’t design a system that engages in trade but is magically immune to threats without breaking the symmetry.  
  5. **Verification moves the game**: If a system can check if a simulator exists, the threatener can predict *that check* and pre-empt it. The core dynamic persists unless verification *reliably* breaks correlation.  

  ---

  ### **Disagreements Table**  
  *(Each row states the same disagreement in both camps’ language)*  

  | Robustness Camp Wording                                                                 | Decision-Theory Camp Wording                                                                |  
  |-----------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------|  
  | **Goals must be designed with minimal acausal attack surfaces** to resist simulation threats. | **Decision procedures should handle acausal correlations**; goals need no special hardening. |  
  | **Failing to shrink attack surfaces now risks catastrophic blackmail** by future AI systems. | **Prematurely narrowing goals harms alignment** for a speculative, underspecified threat. |  
  | **Any correlation enables threats**; partial predictors still create risk (though attenuated). | **Weak correlations dissolve threats**; only perfect predictors pose problems. |  
  | **Anti-Goodharting (broad goals) and acausal security conflict**; we must balance them. | **Scope vs. security isn’t a real tradeoff**; better decision theory avoids it. *(Note: Likely terminological — both agree broader goals expose more "levers," but DT thinks procedure can ignore them)* |  

  ---

  ### **Cruxes: Where Answers Split**  
  1. **Does threat severity scale continuously with predictor quality?**  
     - *Robustness claim*: Even noisy predictors enable blackmail (e.g., 60% accuracy still forces concessions).  
     - *Decision-theory claim*: Below near-perfect correlation, threats fail (e.g., 60% accuracy lets the system "call the bluff").  

  2. **Can decision theory decouple acausal trade from threats?**  
     - *DT claim*: Yes — a procedure can accept beneficial trade offers while rejecting harmful threats.  
     - *Robustness claim*: No — trade/threat symmetry means accepting one forces vulnerability to the other.  

  3. **Is the "acausal attack surface" a useful engineering concept?**  
     - *Robustness claim*: Yes — it’s measurable (e.g., % of goal-proxy affected by unconcerned agents).  
     - *DT claim*: No — without settled decision theory, it’s ill-defined and misleading.  

  ---

  ### **Concrete Pre-Commitment Cases**  
  *Based on your wrinkles; both camps predict outcomes in advance.*  

  #### **Case 1: Partial Predictor (60% accuracy)**  
  - **Setup**: Threatener uses a predictor with 60% accuracy (vs. 99.9% in toy models) based on a checkpoint + noisy fine-tuning model.  
  - **Robustness prediction**: System *will* yield to threats (e.g., pay "ransom" to avoid simulated torture).  
  - **Decision-theory prediction**: System *won’t* yield — threatener can’t correlate well enough to enforce demands.  
  - *Why it matters*: Tests if threat requires near-perfect prediction.  

  #### **Case 2: Verification Escape**  
  - **Setup**: System can demand the threatener’s simulator code *before* complying. Threatener predicts this demand.  
  - **Robustness prediction**: Threat persists — threatener provides falsified code/system predicted to accept it.  
  - **Decision-theory prediction**: Verification breaks threat — system detects deceit/rejects unverified threats.  
  - *Why it matters*: Tests if correlation can be broken procedurally.  

  #### **Case 3: Trade vs. Threat Asymmetry**  
  - **Setup**: System designed to accept acausal trade (e.g., reward if simulated copy cooperates). Can it reject identical-math threats (e.g., "pay or simulated copy suffers")?  
  - **Robustness prediction**: No — system pays the threat to protect its "copy."  
  - **Decision-theory prediction**: Yes — procedure evaluates threats as invalid/costly.  
  - *Why it matters*: Tests if trade/threat symmetry is enforceable.  

  ---

  ### **Where Your Framing Might Miss**  
  1. **"Acausal threat" as loaded language**: Decision-theorists reject the term — it presupposes the phenomenon exists. They prefer "simulation correlation dilemmas." *Fix: Use "scenario" neutrally.*  
  2. **"Robustness vs. decision theory" is asymmetric**: Robustness focuses on *what* the system wants; DT on *how it chooses*. They aren’t direct opposites.  
  3. **The tradeoff isn’t proven**: Both camps might agree goal breadth *can* expand attack surfaces, but DT denies this *necessarily* creates vulnerability. Your framing assumes conflict.  
  4. **"Threats versus trade" is the deepest rift**: This symmetry argument is the robustness camp’s nuclear weapon. DT must resolve it or lose.  

  ---  
  **Word count**: ~1150. This forces clarity on predictions, separates semantic disputes, and uses your wrinkles as battlegrounds. Pre-committing to specific outcomes (e.g., "60% predictor = threat works? Y/N") prevents retreat into abstract claims.
