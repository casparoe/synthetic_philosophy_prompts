answer: |-
  Here’s a structured fifty-minute seminar plan focused on **isolating the puzzle’s core challenge** and **pre-empting common collapses**, using British English throughout:

  ---

  ### **Seminar Plan: Kavka’s Toxin Puzzle**

  **Pre-Puzzle Foundations (Crucial Setup: 15 mins)**  
  *Must be established before stating the case:*  
  1. **"Intending ≠ Predicting" Drill**  
     - *Activity:* Contrast "I predict England will win the Euros" (evidence-based) vs. "I intend to cycle to campus tomorrow" (commitment-based).  
     - *Key Point:* Predictions track evidence; intentions *initiate action*.  
  2. **"Desiring ≠ Intending" Clarifier**  
     - *Example:* "I want to run a marathon" ≠ "I intend to train tomorrow". Desire lacks commitment.  
     - *Emphasise:* Intentions bind you to *reasons for action*.  
  3. **"Rationality Assumption"**  
     - Explicitly state: *We assume the agent is fully rational throughout.* This prevents "I might be irrational later" escapes.  

  **The Case Setup (5 mins)**  
  *Features the puzzle MUST have:*  
  - **No "infallible detector"**: Avoid framing it as epistemic (e.g., "how to fake an intention").  
    - *Instead:* Stress that *sincerely forming the intention now* is the challenge. Detection is irrelevant.  
  - **Crucial Constraints**:  
    - Reward *only* for forming the intention tonight (Tuesday).  
    - Toxin *only* causes suffering if drunk tomorrow (Wednesday).  
    - No external enforcement/punishment beyond the toxin’s effects.  

  ---

  ### **Misconceptions & Defusal Sequence (25 mins)**  
  *Address in this order when they arise (anticipate early):*  

  1. **"Just take the money and don’t drink!"**  
     - *When:* Immediately after stating the case.  
     - *Defusal:*  
       > "Can you *sincerely intend tonight* to drink the toxin *if you already know* you’ll have no reason to drink it tomorrow? Why would a rational agent commit now to an act they know will be against their interests later?"  

  2. **"I might be irrational later / less rational than I expect!"**  
     - *When:* After introducing rationality assumption.  
     - *Defusal:*  
       > "The puzzle assumes *perfect rationality*. If you’re rational now, you know that when tomorrow comes, drinking the toxin is pointless. Why would your rational future self drink it?"  

  3. **"Intentions are just predictions!"**  
     - *When:* When discussing how to form the intention.  
     - *Defusal:*  
       > "If intending is just predicting, could you ‘intend’ by saying ‘I predict I’ll drink it’? But the tycoon pays for *intentions*, not predictions. A prediction isn’t a commitment – it doesn’t *motivate* you to act."  

  4. **"Use a commitment device! (e.g., contract, threat)"**  
     - *When:* When solutions are brainstormed.  
     - *Defusal:*  
       > "The toxin is the *only* consequence. No device can add *new* penalties. Could signing a contract tonight *make it rational* to drink the toxin tomorrow? Why? (Hint: If not, you still can’t *intend* to drink it)."  

  ---

  ### **Consolidation (5 mins)**  
  - **Diagnostic Question for the Room:**  
    > *"What reason would you have* ***tomorrow*** *to drink the toxin, if you’ve already been paid and face only suffering?"*  
    - *Correct insight:* No reason exists → no rational basis to form the intention *today*.  

  - **Explicitly Avoid This Topic:**  
    > "We’re bracketing *how intentions cause actions* (e.g., ‘strength of will’). That’s a different puzzle. Today’s question is purely about rational *formation* of intentions."  

  ---

  ### **Why This Works**  
  - **Pre-emptive framing** stops the puzzle dissolving into willpower ("just try harder!") or self-prediction ("I’ll probably do it").  
  - **Rejecting the detector** avoids epistemic red herrings (e.g., "how to trick the test"). Focus stays on *whether rational intention-formation is possible*.  
  - **Order of defusals** matches typical student logic, forcing confrontation with the core paradox:  
    *Rationality prevents you from binding your future self to an irrational act.*  

  Timing is tight; rigorously chair digressions. Use quick polls ("hands up if you think X is possible") to pace discussion.
