prompt: |-
  Hey — I need a philosopher's read on a very un-philosophical problem, and I'd rather you diagnosed what's actually going on than sent me a rubric template.

  I chair our teaching standards committee (we rotate: two of five of us are replaced every year). Last spring we passed a rule saying students may use AI tools for "brainstorming and copy-editing" but not for "substantial drafting." Now we're the people who have to apply it to real cases, and it's gone about as well as you'd expect. One student fed her own rough bullet points to a chatbot paragraph by paragraph, so maybe 40% of the final prose is generated but every idea is hers. One non-native speaker ran every sentence of his own draft through a tool that also rewrote his phrasing. One generated ten outlines, picked one, discarded the rest. One dictated a messy draft and had a tool "clean it up," which changed the argument in places. None of these is a clear violation and none is clearly fine, and they're not even ordered along a single scale.

  The problem isn't which way they should go. It's that every line I can write down feels arbitrary in exactly the same way: for any boundary I state, someone can produce a case that sits on the other side of it while differing from a case on this side by an amount too small to matter, and I have nothing to say about why the line is here rather than a hair to the left. And it compounds: whatever we decide gets cited to next year's committee, which is mostly new people who never saw this year's cases, so a slightly lenient call becomes the floor for a slightly more lenient one the year after.

  My colleagues have three attitudes. One says there's a real answer about where the line is and we're just not in a position to find it, so pick a number, publish it, and accept that we might be off. One says there's no answer at all, it's a judgement call, and we should say honestly that we're exercising discretion rather than pretending to discover something. One says the fuzziness is the point: it lets us handle cases we never anticipated and stops students optimizing right up to the edge, so we should keep it and stop trying to sharpen it.

  What I want, and what I'm definately not going to get, is all three of: a decision in every case; a written reason I can give the student that isn't just "because we said so" (our registrar insists on this); and no case coming out differently from one that differs from it imperceptibly. It feels like I can have any two and not all three, and I can't see which one to drop. Our economist suggests a fourth thing: define a band, and inside the band flip a weighted coin and tell the student honestly that's what we did. I can't tell if that's admirably honest or a collapse into laziness.

  I also keep suspecting the framing itself is the mistake — that "how much help" was never the right sort of quantity to be measuring, and any rule built on a graded notion like that was doomed before we passed it. If so, what shape should a rule have instead? I have a feeling this has a name in our discipline and it isn't "policy design," and I teach this stuff, which is the embarrassing part.

  I have to send the guidance document out Friday. So: what is the structure of the thing I'm stuck in, which colleague is nearest right and what exactly is wrong with the other two, and what should I actually write?
reasoning: |-
  Okay, let me unpack this user's problem. They're chairing a committee grappling with AI policy enforcement, and the core issue is boundary arbitrariness. The existing "brainstorming/copy-editing vs substantial drafting" rule is collapsing under edge cases that resist binary classification. 

  First, I notice the user is philosophically trained but deliberately avoiding jargon. That's telling - they want substance over academic posturing. Their frustration with "graded notions" suggests they've already diagnosed the category error: treating AI assistance as a matter of degree when the real concerns might be elsewhere. Smart.

  The three colleague positions represent classic philosophical approaches:
  - The realist (there's a knowable line)
  - The non-cognitivist (it's pure discretion)
  - The anti-definitionist (vagueness is functional)

  But none resolve the institutional dilemma: needing consistent precedent with rotating committees. The economist's weighted coin idea is fascinating - it introduces probabilistic honesty but might feel like abdication.

  Hmm... the user's trilemma (decide all cases + written reasons + no arbitrary lines) echoes philosophical problems about vagueness. Sorites paradox comes to mind - when does a heap of sand stop being a heap? But in practice, legal systems handle this through bright-line rules + intent-based standards.

  The non-native speaker case is particularly revealing. If the tool preserves meaning but alters phrasing, is that "copy-editing" or "drafting"? This exposes how the rule misidentifies the harm - we care about intellectual labor, not word origins. Maybe the pivot should be to...

  *lightbulb* Ah! The solution might lie in shifting from quantifying AI use to qualifying the student's engagement. Instead of measuring "how much AI", ask "what kind of cognitive work remains". That's why the student feeding bullet points feels less problematic - the ideas underwent transformation in her mind first.

  For Friday's guidance, I'd recommend:
  1. Explicitly reframe the standard around control and comprehension
  2. Provide decision heuristics focused on intellectual ownership 
  3. Build in mandatory case annotations for institutional memory
  4. Add a "good faith" clause acknowledging evolving practices

  The registrar's demand for reasons can be satisfied by making the criteria about demonstrable understanding rather than AI percentage. And for borderline cases? Admit the gray area but require students to demonstrate mastery - that's better than coin flips.

  Most importantly, the committee needs to acknowledge this as a living document. The first footnote should state: "We judge trees by their roots, not their fertilizers." Sets the right tone.
answer: |-
  You're wrestling with a **conceptual category error** disguised as a policy problem. The flaw isn't in your application of the rule—it's in the rule itself. "Substantial drafting" implies a quantitative threshold where none exists. AI assistance isn't a spectrum from "safe" to "forbidden"; it's a **qualitative shift in agency**. Here's the diagnosis and a path forward:

  ---

  ### **The Structural Trap: Sorites Paradox Meets Institutional Amnesia**
  1. **The Sorites Problem**: You're facing the ancient "heap paradox." If removing one grain doesn’t turn a heap into a non-heap, where’s the line? Your rule creates a false continuum ("how much AI?"). No bright line exists because:
     - **Ideas ≠ Expression**: A student’s bullet points transformed by AI aren’t "her ideas" in any meaningful sense—they’re AI interpretations. The non-native speaker’s rewritten sentences may preserve his intent but surrender his voice.  
     - **Process ≠ Product**: Judging based on the *output’s similarity* to human work ignores *how cognition was delegated*. A messy draft "cleaned up" by AI that alters arguments is intellectual outsourcing, regardless of the word count.

  2. **Institutional Drift**: Rotating committees + vague standards = entropy. Precedents dissolve, leniency compounds. Your economist’s coin flip "solution" is honest about arbitrariness but abdicates pedagogical responsibility.

  ---

  ### **Where Your Colleagues Miss the Mark**
  | Colleague               | Insight                                  | Fatal Flaw                                  |
  |-------------------------|------------------------------------------|---------------------------------------------|
  | **The Realist**         | Admits human limitation.                | Assumes a "true line" exists. There isn’t—it’s the wrong question. |
  | **The Discretionist**   | Honest about subjectivity.              | Invites inconsistency and student distrust. |
  | **The Anti-Definitionist** | Correct that vagueness has utility.     | Confuses *flexibility* with *conceptual clarity*. Vagueness isn’t a virtue—it’s a stopgap. |

  ---

  ### **The Pivot: From "How Much AI?" to "Whose Mind is at Work?"**
  Replace the input-based rule (brainstorming/copy-editing) with **output-based standards focused on intellectual sovereignty**. Your rule should ask:
  > **"Can the student defend, reconstruct, and explain this work as an extension of their own critical thinking?"**

  **Practical Framework for Your Guidance:**
  1. **Core Principle**:  
     *"Submissions must be products of the student’s own intellectual engagement. AI may assist, but cannot replace the student’s responsibility for the work’s conception, structure, and reasoning."*

  2. **Decision Heuristics**:  
     - ✅ **Permissible**: AI as a *tool* (e.g., grammar checks, synonym suggestions, sparking initial ideas).  
       *Example: "The student generated 10 AI outlines but critically evaluated and rebuilt one using their own analysis."*  
     - ⚠️ **Gray Area**: AI as a *co-author* (e.g., restructuring paragraphs, paraphrasing complex arguments).  
       *Require oral defense: "Explain why you chose this structure over alternatives. Walk us through your argument’s evolution."*  
     - ❌ **Violation**: AI as a *proxy* (e.g., generating text the student can’t explain, altering core claims).  
       *Example: "The student dictated a draft and accepted AI ‘clean-up’ that changed their argument without review."*

  3. **Institutional Safeguards**:  
     - **Annotate Decisions**: For gray-area cases, document *why* it was permitted/denied based on the student’s demonstrable understanding.  
       *"Allowed because student explained revisions in meeting. Disallowed because student couldn’t justify key terms AI inserted."*  
     - **Mandate Process Statements**: Students must briefly describe their AI use and verify: *"I have reviewed all AI-generated content and stand behind its integration as my own work."*  
     - **Annual Review**: Each committee adds 2–3 annotated case studies to a shared log. Prevents drift and builds collective wisdom.

  ---

  ### **What to Write in the Guidance**
  ```markdown
  # Revised Guidance: AI and Academic Integrity  
  **Principle**: Tools may aid your process, but you must retain **intellectual ownership** of the final work. If you cannot defend, reconstruct, or explain any part of your submission without relying on AI, it violates our standards.  

  ## Key Questions for Self-Assessment:  
  1. **Conception**: Did I generate the core ideas, or did I outsource their formation?  
  2. **Control**: Did I critically evaluate and *direct* all AI contributions?  
  3. **Comprehension**: Can I explain every claim, transition, and word choice in this work?  

  ## Examples:  
  | Scenario                                | Likely Judgment | Why?                                  |  
  |-----------------------------------------|-----------------|---------------------------------------|  
  | Using AI to fix grammar/spelling        | Permitted       | Preserves your ideas and structure.   |  
  | Having AI rewrite sentences for clarity | Gray Area       | *Requires verification of your oversight.* |  
  | Submitting AI-generated text unchanged  | Violation       | You did not engage intellectually.    |  

  **In Ambiguous Cases**: We may ask you to:  
  - Discuss your process in a meeting.  
  - Recreate part of the work independently.  
  - Annotate how you revised AI output.  
  ```

  ---

  ### **Why This Works**
  - **Drops the Illusion of Precision**: No more unmeasurable "percentage of AI." Focuses on the *teachable* goal: student accountability.  
  - **Satisfies the Registrar**: Reasons are concrete ("student couldn’t explain X") not arbitrary ("AI wrote 41%").  
  - **Prevents Boundary Haggling**: Students can’t game "how much is too much?"—they must prove mastery.  
  - **Embraces Evolution**: The annual case log turns ambiguity into institutional learning, not entropy.  

  You were right: "How much help?" was the wrong frame. **Authentic learning isn’t diminished by tools—it’s undermined by disengagement.** Your rule now measures the right thing: the student’s mind at work.  

  Final note: Add this footnote to your guidance—*"When in doubt, ask: If the AI vanished, could the student still create work reflecting this understanding?"* That’s the line worth defending.
