prompt: |-
  I am helping a foundation spend a single large grant, and I want your reasoning rather than a survey of a field.

  The grant will support one new research group: roughly fifteen researchers for five years, trained as theorists and philosophers, with a small budget for modest human-subject studies and no access to frontier-scale compute. Their mandate is the conceptual and theoretical foundations of inferring what people want from how they behave — the family of problems that includes inverse reinforcement learning, preference learning and reward modelling. The group is not meant to build better systems. It is meant to establish what question such formalisms are actually answering, where they are confused, and which of those confusions are load-bearing for the people who do build the systems. Please write in British English, and do not organise your answer around papers, authors or a reading list: I want the arguments and the structure of the problem.

  Three stipulations, so that we are arguing about the same thing.

  First, most behaviour is *laundered*. Call a behavioural record laundered when it was produced by someone acting inside a choice environment that another optimiser arranged for its own purposes: a recommender's ranking, a platform's defaults, an employer's incentive scheme, a market's price signal, the ordering of options on a form. Any realistic dataset of human behaviour is largely of this kind, and the laundering is not noise added to a clean signal. It is a second agent's objective written into the data-generating process, and it is invisible in the data itself.

  Second, the reward–rationality degeneracy. If we model a person as choosing with probability proportional to an exponential of the value of each option, then multiplying all rewards by a factor and dividing the temperature by that same factor leaves the choice probabilities unchanged: behaviour can reveal the ratio of preference strength to noise, never either quantity alone. Observed near-deterministic choice is equally compatible with someone who cares a great deal and trembles a lot and with someone whose preferences are mild but who is an unusually consistent chooser. Relatedly, many distinct reward functions make the very same policy optimal: add a constant, rescale by a positive factor, or add to the reward a term of the form *potential of the next state minus potential of the current state*, which telescopes away across a trajectory, and nothing observable changes. And a reward is only ever identified relative to a chosen representation of the situation, so the features the reward is permitted to care about are themselves a substantive assumption smuggled in before inference begins.

  Third, call the *recovery picture* the view that there is a fact of the matter about a person's reward function and that inference aims to estimate it; call the *construction picture* the view that what inference delivers is a useful summary which partly constitutes, rather than discovers, the preference it reports. I do not know which is correct, and I doubt the group will settle it.

  Given all that: what should these fifteen people work on, and in what order? Give me five or six questions, ranked, and defend the ranking. For each, I want to know what it gates — which other questions, and which downstream engineering or policy defaults, cannot be responsibly settled until it is answered; whether it is tractable in five years given this training and this budget, or whether it secretly needs scale empirics the group cannot run; whether it is genuinely neglected or already crowded by people who will get there anyway; what a finished answer would look like, so the group can tell whether it has won; and what result or evidence during the first two years would move it up or down the list. Please also indicate which questions depend on the recovery-versus-construction dispute, and either show that your ordering is robust across both pictures or tell me explicitly which picture you are betting on and what in the ordering changes if that bet is wrong.

  Finally, name two or three lines of work that look prominent or attractive but that you would deliberately not fund here, and say why: because they are crowded, because answering them would change little downstream, or because they presuppose an answer to something else on your list.

  Aim for about 1,500 words, and flag the points where your ranking rests on empirical guesses you are least confident in.
reasoning: |-
  Okay, the user is setting up a research group focused on the theoretical foundations of inferring human preferences from behaviour. They've laid out three key stipulations: laundered behaviour, reward-rationality degeneracy, and the recovery vs. construction debate. 

  First, I need to absorb the core challenge. The group isn't building systems but probing the conceptual underpinnings of preference inference. The stipulations are crucial: most behavioural data is contaminated by other optimisers' agendas, there's inherent mathematical ambiguity in inferring rewards, and we don't know if preferences are discovered or constructed. 

  Hmm, the user explicitly wants reasoning, not literature surveys. That's refreshing but tricky—I must avoid namedropping while still grounding arguments in credible logic. The British English requirement means watching spellings and idioms ("behaviour" not "behavior", "prioritise" not "prioritize"). 

  The ranking needs clear defence criteria: what blocks other research, tractability, neglect, and definable success metrics. Also, I must flag where my assumptions are shaky. Let me start by mapping the problem space. 

  Laundered behaviour feels like the biggest practical obstacle. If data is shaped by platforms/employers, any inference might recover their objectives, not human preferences. This seems first-order because until we untangle this, other work could be fundamentally misguided. Plus, it's underexplored—most IRL assumes clean data. 

  Degeneracy is deep but more abstract. The recovery/construction divide looms over everything. I suspect construction is more plausible given behavioural economics, but the user wants robustness. Maybe I can structure questions to work under both views where possible. 

  For the ranking: Question 1 must be laundering. Without clarifying this, everything else builds on sand. Tractability seems okay—formalising "laundering signatures" in synthetic/small datasets could yield diagnostic tools in 2-3 years. Success would be a taxonomy of laundering effects. 

  Question 2 should tackle the degeneracy head-on. The temperature/reward ambiguity and potential-based rewards make inference non-unique. Progress here gates everything downstream. It's tractable with theory/modelling but might require accepting that only equivalence classes are identifiable. 

  Question 3 on ontology feels urgent. If we don't know what preferences are (e.g., scalar rewards? partial orders?), we can't specify inference goals. This depends heavily on recovery vs. construction—but even defining "useful summaries" requires ontological clarity. 

  Question 4 (social preference aggregation) might be lower priority initially but becomes critical once we consider multi-agent systems. It's thorny—Arrow’s theorem suggests limits—but tractable for small groups. 

  Question 5 (counterfactuals) depends heavily on earlier work. Without laundering/degeneracy resolved, asking "what if?" is hopeless. Still, worth scoping because policymakers crave this. 

  Question 6 (validation) must come last—we can't validate methods without foundational clarity. 

  Now, what to exclude: 
  - "Better IRL algorithms" is out—they're building tools, not foundations. 
  - "Descriptive models of bias" is covered elsewhere (behavioural econ). 
  - "Neurofoundations" would overreach into neuroscience without addressing core ambiguities. 

  My shakiest assumption? That laundering can be formalised without massive empirical studies. Also, betting that construction is more viable than recovery might influence prioritisation—if recovery were true, degeneracy might leapfrog laundering. 

  The user seems sophisticated—likely a program officer or academic. Their frustration with superficial surveys suggests they want actionable depth. Unspoken needs: probably wants this group to prevent real-world harm from misguided preference inference (e.g., in AI safety). I'll emphasise where clarity could avert downstream engineering risks. 

  Right, structure accordingly: intro framing, ranked questions with defences, exclusions, then caveats. Keep British English throughout ("behaviour", "prioritise"). Aim for crisp arguments—no fluff.
answer: |-
  ## Prioritised Research Agenda: Foundations of Preference Inference from Laundered Behaviour

  Given the constraints and stipulations, here is a ranked set of research priorities for the group, defended by their foundational importance, tractability, neglected status, and downstream impact. The ordering rests on the premise that **addressing the contaminating effects of laundering is the most urgent barrier to meaningful progress**, as it fundamentally compromises the data itself before any inference begins, regardless of the recovery/construction debate.

  **Ranked Questions:**

  1.  **Question:** *How can we formally characterise the *signatures* and *systematic distortions* introduced by laundering mechanisms (e.g., recommender systems, institutional incentives, market structures) into behavioural data, and what implications does this have for the identifiability of *any* underlying preference structure?*
      *   **Why Top Priority?** Laundering isn't noise; it's structural contamination by a *second optimiser's objective*. This directly gates *everything* downstream. If we cannot diagnose, characterise, or model how laundering distorts the behavioural signal, no subsequent inference method can be trusted. It renders the degeneracy problem even more ambiguous and makes the recovery/construction debate moot if the data fundamentally reflects something other than the agent's "true" (or constructed) preferences. Success here is foundational for responsible data selection and interpretation.
      *   **What Gates?** This gates all work on degeneracy (Q2), ontology (Q3), counterfactuals (Q5), and validation (Q6). It fundamentally informs what datasets are even amenable to preference inference. Downstream, it impacts how platforms collect training data for RLHF, how policymakers interpret behavioural nudges, and how economists model revealed preference under institutional constraints.
      *   **Tractability:** Highly tractable. The group can:
          *   Develop formal models of specific laundering mechanisms (e.g., constrained choice sets under platform ranking, incentive misalignment in employment records).
          *   Analyse synthetic and existing (non-frontier-scale) datasets using these models to identify statistical signatures (e.g., specific correlations, choice distribution anomalies, violations of choice consistency axioms *caused* by the launderer).
          *   Run modest lab experiments manipulating choice architectures to observe laundering effects directly.
      *   **Neglected?** Extremely. Most IRL/Preference Learning assumes data reflects *only* the agent's preferences plus noise, ignoring the systematic, optimiser-driven contamination. Work on algorithmic bias touches on consequences but rarely formalises the *causal mechanism* of laundering in the data-generating process.
      *   **Finished Answer Looks Like:** A taxonomy of laundering mechanisms with associated formal characterisations of their distortive effects on observable behaviour and preference identifiability. Diagnostic tools (statistical tests, model-based indicators) to detect likely laundering in datasets. Frameworks for bounding the *possible* interpretations of laundered data.
      *   **Year 1-2 Movers:** Strong empirical evidence from lab studies showing distinct, measurable signatures for different laundering types. Development of a compelling formal model showing how laundering creates irreducible ambiguity beyond degeneracy. Failure to find *any* robust signatures would push this down, but seems unlikely.
      *   **Recovery/Construction Dependence:** Robust. Both pictures require understanding how laundering contaminates the data. Recovery needs to disentangle it; construction needs to understand what is being summarised (agent+launderer or agent alone?).

  2.  **Question:** *Given the degeneracy inherent in preference inference (reward/temperature scaling, potential-based rewards, state representation dependence), what equivalence classes of reward functions (or preference structures) *can* be identified from behaviour, and under what conditions can we break the degeneracy meaningfully?*
      *   **Why #2?** Degeneracy isn't just noise; it's a fundamental mathematical ambiguity at the heart of the inference problem. Laundering (Q1) makes it worse, but even with "clean" data, we often cannot uniquely identify a reward function. Clarifying the precise *limits* of identifiability is crucial before building complex models. It forces us to acknowledge that inference outputs sets or equivalence classes, not points. This directly impacts what questions we can even ask.
      *   **What Gates?** Gates ontology (Q3 – what *can* we represent?), counterfactuals (Q5 – predictions depend on the specific representative chosen from the equivalence class), and validation (Q6 – how do we validate an equivalence class?). Downstream, it forces humility in AI systems claiming to "know" a user's reward, impacts the design of preference elicitation interfaces, and challenges legal/policy uses of inferred preferences.
      *   **Tractability:** Very tractable. Primarily theoretical work:
          *   Formal exploration of identifiability under varying assumptions (deterministic/stochastic, partial observability, different state representations, different noise models).
          *   Characterising the equivalence classes induced by different degeneracies (scaling, potential shaping, representation changes).
          *   Identifying minimal assumptions (e.g., preferences over final outcomes, known state dynamics, specific forms of irrationality) that shrink the equivalence classes or break specific degeneracies. Modest lab studies can test implications.
      *   **Neglected?** Under-discussed in practice. While the *existence* of degeneracies is known (especially potential shaping), their *systematic treatment* and the implications of equivalence classes for applied work are often glossed over. Theoretical work exists but hasn't permeated applied ML.
      *   **Finished Answer Looks Like:** A comprehensive formal characterisation of the identifiability landscape for preference inference: maps showing which degeneracies apply under which observational conditions, proofs of minimal sufficient conditions for breaking specific degeneracies, and a framework for specifying the equivalence class output of any inference method.
      *   **Year 1-2 Movers:** Clear formal proofs demonstrating the *impossibility* of breaking key degeneracies (like reward/temperature scaling) under fully general conditions. Successful identification of *practically useful* minimal assumptions for specific contexts. Lack of progress on breaking *any* degeneracy practically would solidify the equivalence class focus.
      *   **Recovery/Construction Dependence:** Mostly Robust. Recovery must accept equivalence classes as the "fact" to be discovered. Construction sees the equivalence class as the space of possible useful summaries. Representation dependence strongly leans towards construction, as the features define the language of construction.

  3.  **Question:** *What is the appropriate *ontology* for representing preferences inferred from behaviour? Are scalar rewards sufficient, or do we need partial orders, context-dependent weights, multi-objective structures, or non-consequentialist elements (like rules or procedures)? How does laundering constrain this ontology?*
      *   **Why #3?** After clarifying data contamination (Q1) and fundamental limits (Q2), we must ask *what* we are even trying to infer. The standard scalar reward assumption is simplistic and often inadequate for human preferences (sacrifices, context-dependence, deontological constraints). Laundering might necessitate representing institutional objectives *alongside* individual preferences. Choosing the wrong ontology makes inference meaningless or misleading.
      *   **What Gates?** Gates the development and evaluation of specific inference algorithms (though not the group's focus, it informs what *should* be built). Critically gates counterfactual prediction (Q5 – predicting behaviour under novel situations requires a generalisable representation) and validation (Q6 – how to validate a complex ontology?). Downstream, it determines the expressiveness of AI preference models and influences behavioural economics modelling.
      *   **Tractability:** Moderately tractable. Mix of conceptual, formal, and modest empirical:
          *   Philosophical analysis of what aspects of human preference are behaviourally manifest *and* relevant for prediction/summary.
          *   Formal modelling of alternative preference structures (e.g., context-dependent utilities, lexicographic orders) and their behavioural implications.
          *   Analysis of existing behavioural datasets (and modest new studies) to identify systematic violations of scalar reward assumptions (e.g., framing effects, preference reversals) and how laundering interacts with these.
      *   **Neglected?** Yes, within the ML-centric preference learning community. Scalar rewards dominate. Behavioural economics critiques exist but haven't been fully integrated into formal inference frameworks, especially considering laundering.
      *   **Finished Answer Looks Like:** A principled framework for selecting preference ontologies based on the behavioural domain and inference purpose. Formal definitions of key non-scalar preference structures and their testable behavioural signatures. Guidance on when scalar rewards are (in)sufficient given laundering effects.
      *   **Year 1-2 Movers:** Compelling evidence that laundering systematically *induces* violations of scalar reward assumptions. Development of a tractable formal model for a non-scalar ontology that demonstrably fits certain laundered data better. Persistent failure to find clear evidence *against* scalar rewards in laundered data might push this down slightly.
      *   **Recovery/Construction Dependence:** **Highly Dependent**. Recovery seeks the "true" structure, implying one ontology is correct. Construction chooses the ontology that yields the most useful summary for a purpose. This question forces the group to confront the debate directly. My ranking bets that **construction is more viable**, especially given laundering and degeneracy. Under recovery, this question might leapfrog Q2 if one believes a "true" complex ontology exists and degeneracy is solvable once it's found. Under construction, it remains a crucial design choice after acknowledging Q1 & Q2.

  4.  **Question:** *How can we formally model the inference and aggregation of preferences in multi-agent settings where behaviour is interdependent and laundered by shared institutional structures (e.g., markets, platforms, organisations)?*
      *   **Why #4?** Humans rarely act in isolation. Most laundering happens in social/institutional contexts. Preferences are often inferred from behaviour influenced by others (strategic interaction, social norms) and shaped by the same launderer. Standard IRL assumes a single agent in a fixed environment. This needs extension to handle the social reality captured in laundered data.
      *   **What Gates?** Gates the application of foundational insights (Q1-3) to realistic social and economic datasets. Critical for counterfactuals (Q5) involving policy changes affecting groups. Downstream, essential for designing fair recommendation systems, equitable institutional policies, and multi-agent AI systems interacting with humans.
      *   **Tractability:** Challenging but feasible core work. Focus on foundational models:
          *   Extend laundering models (Q1) to multi-agent settings (e.g., platform shaping interactions between users).
          *   Explore degeneracy (Q2) and ontology (Q3) in simple game-theoretic or market models with laundered data.
          *   Formalise challenges in preference aggregation under laundering and degeneracy (connecting to social choice theory). Modest lab experiments with small groups.
      *   **Neglected?** Very. Single-agent IRL dominates. Multi-agent IRL is nascent but rarely considers laundering or the foundational degeneracy/ontology issues.
      *   **Finished Answer Looks Like:** Formal frameworks for modelling preference inference in multi-agent systems subject to laundering. Identification of unique challenges and ambiguities arising from interdependence and shared laundering. Initial formal results on the (im)possibility of recovering/constructing individual vs. group preferences under these conditions.
      *   **Year 1-2 Movers:** Successful application of single-agent laundering signatures (Q1) to predict distortions in simple multi-agent data. Formal demonstration of new, irreducible ambiguities introduced by multi-agent interactions *plus* laundering. Lack of tractable models might limit scope but not core importance.
      *   **Recovery/Construction Dependence:** Robust. Both pictures need to address multi-agent complexity and laundering. Construction might focus more on useful group-level summaries.

  5.  **Question:** *What are the formal limits and possibilities for *counterfactual prediction* based on inferred preferences? Can we reliably predict behaviour under novel choice architectures, novel option sets, or novel laundering mechanisms?*
      *   **Why #5?** A primary goal of preference inference is often prediction: "What would they choose if X changed?" Laundering (Q1), degeneracy (Q2), and ontology (Q3) severely constrain this. Predicting behaviour under *novel* laundering is particularly unclear. Success here is the ultimate test of the utility of preference inference.
      *   **What Gates?** The practical value of the entire enterprise. Directly impacts how AI systems use inferred preferences for planning or personalisation, and how policymakers simulate behavioural impacts of interventions. Validation (Q6) often relies on counterfactual checks.
      *   **Tractability:** Difficult, requires building on Q1-4. Focus on theoretical limits and principled approaches:
          *   Formal analysis of generalisation bounds for different preference representations (Q3) under distribution shift (e.g., new choice sets, new launderers).
          *   Characterising when counterfactual queries *can* be answered robustly across the degeneracy equivalence class (Q2).
          *   Developing frameworks for counterfactual prediction that explicitly model the laundering mechanism and its potential change.
      *   **Neglected?** Yes. Most ML focuses on in-distribution prediction or assumes preferences extrapolate naively. Foundational work on the limits of counterfactual prediction from behavioural data, especially laundered data, is sparse.
      *   **Finished Answer Looks Like:** A taxonomy of counterfactual queries ranked by their feasibility given laundering, degeneracy, and ontological choices. Formal impossibility results for certain types of predictions. Principled frameworks for making (and quantifying uncertainty in) counterfactual predictions that account for the foundational challenges.
      *   **Year 1-2 Movers:** Strong theoretical results showing fundamental limits to counterfactual prediction under laundering without strong assumptions. Development of a promising model-based approach incorporating launderer dynamics. Poor performance of naive methods in lab studies simulating novel laundering.
      *   **Recovery/Construction Dependence:** Robust. Both need to know the limits of prediction. Recovery hopes the "true" preference enables extrapolation; construction designs summaries specifically for prediction tasks.

  6.  **Question:** *What constitutes *validation* of a preference inference method given the challenges of laundering, degeneracy, and ontology? What can we validate against if not "ground truth" rewards?*
      *   **Why #6?** Validation is essential, but traditional metrics (predictive accuracy on held-out *laundered* data, user self-reports) are inadequate and ignore the core challenges. We need new criteria aligned with the foundational understanding developed in Q1-5. This is last because it depends on the answers to the prior questions defining *what* needs validation.
      *   **What Gates?** Responsible deployment. Without meaningful validation, progress claims are hollow. Downstream, it dictates how AI developers evaluate their preference models and how regulators assess claims about inferred user desires.
      *   **Tractability:** Feasible core framework. Builds directly on Q1-5:
          *   Propose validation criteria based on robustness across the degeneracy equivalence class (Q2), consistency with identified laundering signatures (Q1), or ability to answer specific counterfactual queries (Q5) deemed feasible.
          *   Develop metrics for assessing the suitability of the chosen ontology (Q3).
          *   Explore the role of limited, targeted preference elicitation as a partial anchor.
      *   **Neglected?** Critically so. Validation is often an afterthought using flawed metrics. Foundational work on *what validation means* given the inherent ambiguities is virtually nonexistent.
      *   **Finished Answer Looks Like:** A principled framework for validating preference inference methods that explicitly acknowledges and incorporates the challenges of laundering, degeneracy, and ontology. A suite of diagnostic checks and validation metrics aligned with this framework, moving beyond simplistic accuracy or concordance with self-report.
      *   **Year 1-2 Movers:** Development of compelling diagnostics based on laundering signatures or degeneracy robustness that effectively flag inadequate methods in synthetic/lab data. Consensus that existing validation metrics are fundamentally insufficient.
      *   **Recovery/Construction Dependence:** **Dependent**. Recovery validation seeks indirect evidence aligning with the posited "true" structure. Construction validation focuses on utility for specific downstream tasks. My construction-leaning bet makes task-based utility central, but diagnostics from Q1 & Q2 are vital for both.

  **Lines of Work Not Funded:**

  1.  **Developing Novel "Better" IRL/Preference Learning Algorithms:** *Why?* This directly contradicts the mandate. The group is not building systems. Focusing on algorithms presupposes solutions to the foundational questions about data (laundering), identifiability (degeneracy), and representation (ontology) that this group is meant to investigate first. It's crowded and would distract from the core mission.
  2.  **Comprehensive Descriptive Modelling of Cognitive Biases in Isolation:** *Why?* While biases matter, substantial work already exists in behavioural economics and cognitive science. The unique value here is integrating these insights *within the formal frameworks of preference inference* and specifically grappling with how they interact with *laundering* and *degeneracy*. Funding pure descriptive bias studies wouldn't leverage the group's theorist strength or address the core stipulations.
  3.  **Direct Neuroscientific Foundations of Reward:** *Why?* While fascinating, this requires frontier-scale resources and expertise beyond the group's scope (modest human studies, no neuroimaging). More importantly, it sidesteps the core problem: how to interpret *behaviour* generated in complex, laundered environments. Even perfect neural reward readings wouldn't resolve how laundering distorts the behavioural record used for practical inference.

  **Key Uncertainties in Ranking:**

  1.  **Tractability of Laundering Signatures (Q1):** My ranking assumes distinct, characterisable signatures exist and can be modelled without massive empirical studies. If laundering proves overwhelmingly complex and chaotic, leaving no discernible fingerprints, Q1 becomes intractable and the entire project might need rethinking. Early lab work is crucial here.
  2.  **Viability of Breaking Degeneracies (Q2):** I assume breaking degeneracies like reward/temperature scaling in general is impossible, making equivalence classes central. If the group finds strong, *practical* minimal assumptions that effectively break key degeneracies in common settings early on, Q2 might shift towards developing these assumptions, potentially increasing its relative importance.
  3.  **Dominance of Construction (Q3 Dependence):** My ranking (placing ontology after laundering/degeneracy) bets heavily on the construction picture being more tenable. If convincing arguments *for* recovery emerge early (e.g., via Q3 work showing a stable ontology is discoverable despite laundering/degeneracy), then Q3 (ontology) could potentially leapfrog Q1/Q2, as finding the "true" structure becomes paramount. This is the largest philosophical gamble in the ordering.

  This agenda prioritises peeling back the layers obscuring preference inference, starting with the corrupted data itself (Q1), then the inherent mathematical ambiguity (Q2), before defining what we seek (Q3) and how it functions socially (Q4). Only then can we reasonably tackle prediction (Q5) and validation (Q6). The goal is foundational clarity to prevent well-intentioned but misguided applications downstream.
