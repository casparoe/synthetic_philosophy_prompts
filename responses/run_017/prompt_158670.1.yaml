prompt: |-
  I sit on an incident-review board, and a surprising amount of our work turns on one distinction: whether some outcome was produced by a *we* — a crew, a team, a committee, a lab — or was merely the aggregate of several individuals each doing something, possibly with the same result. The distinction carries weight, because we only address a recommendation to a group when we think there was a group acting, and we only write "the team failed to" when we think there was something the team did or failed to do. I have fairly firm gut verdicts on the cases below. They do not obviously add up, and I want to know what principle, if any, they are tracking — and, where they conflict, which verdicts I should surrender.

  1. Two strangers, one at each end of a fallen tree, no words exchanged, each seeing the other, each wanting the road clear, each easing his own lift to match the other's. They lifted it together. A finding addressed to the two of them is right.

  2. Two people each pour concrete into the same mold on successive days, neither knowing the other exists, each intending to build a wall he thinks of as his own. The result is one wall. Not a joint action.

  3. As in 1, except one man is shamming: he grips, leans, contributes no force, and intends the other to do the work while he takes the credit. Not a joint action. He is riding on someone else's action, and "they cleared the road" is only loose causal talk.

  4. A getaway driver who genuinely does not want the robbery and drives only because he is being threatened. He is causally indispensable and legally implicated, but I do not count him inside the *we*.

  5. A committee of eleven votes six to five to adopt a protocol; the six vote for mutually incompatible reasons; two of them later say they were wrong; the protocol is then implemented by staff who had no vote. The committee decided, and the committee acted. A recommendation addressed to the committee is right. Yet I cannot locate any shared intention that the members had — certainly not one they would all avow.

  6. Two remote engineers who have never spoken, each keeping his half of a system compatible with a shared written specification, each knowing the other exists and that the other is doing the same thing. Joint action — but, it seems to me, not because of anything either believes about the other. The specification appears to be doing the work.

  7. Exactly as in 6, except that each engineer falsely believes the other is a scheduled job that regenerates its half automatically. Nothing about either engineer's own intentions, dispositions or behavior has changed; only a false belief about the counterpart has been introduced. I now want to say they are not acting together, and that a finding addressed to them jointly would be odd. I cannot say why, and this pair is the one I am least able to reconcile.

  8. A pilot and an autopilot: the pilot selects a mode, the machine holds an altitude. No *we*; the machine is equipment, like a crowbar. But where the automated component is a learned planner, trained alongside the pilot in simulation, which proposes routes, objects to some of the pilot's choices, and is routinely deferred to — where each side's performance depends on adjustments made to the other — I lean toward saying there is something joint here and not in the autopilot case, and I do not know what the difference consists in. This is the case I keep going back and forth on.

  9. A ten-year project in which no person was a member for more than two years, cohorts overlapping, the result universally attributed to the lab. I say the lab did it, but I am shakiest here, and I notice I am more willing to say it when the lab kept a written protocol than when it did not.

  The principle I keep falling back on is roughly this: A and B do something together just in case each intends that it come about, each intends that it come about *through the other's contribution*, each is disposed to adjust his own contribution to the other's, and these conditions hold in the open — not one-sidedly, and not on the basis of a false view of what the other is doing. That yields 1, 2, 3 and 4 cleanly. It gets 6 only if I allow "the other" to be satisfied by an artifact such as the specification, which feels like a stretch. It fails outright on 5, where there is no shared intention at all. And it returns the verdict on 7 that the engineers *are* acting together, which is the opposite of what I said.

  What I want from you: a principle, or at most two rival candidates, stated precisely enough that I could apply it to a new incident file, with a note of which case forces each clause; its verdicts on at least two cases I have not listed, one of which should be a case in which one participant is replaced mid-activity by someone the others do not notice; a resolution of the 6/7 pair, or an argument that my verdict on 7 is simply a mistake; a verdict on 8, with the reason it differs from the autopilot case if it does; and an explicit statement of which of my verdicts your principle cannot accommodate and which single verdict I would have to overturn in order to have one unified account. If the best account of joint action comes apart from what our reports ought to say — if accountability should track something other than jointness — say so, and mark the points at which the principle stops and only judgment can settle.
reasoning: |-
  Hmm, the user is part of an incident-review board and is grappling with the philosophical distinction between collective action versus individual actions that coincidentally align. They've presented nine detailed scenarios where this distinction matters for their reports and recommendations. Their intuitive judgments seem inconsistent when tested against their proposed principle of joint action.

  Looking at their cases... The core tension revolves around intentionality and mutual awareness. Case 1 shows clear joint action through nonverbal coordination, while Case 2 lacks any mutual awareness despite identical outcomes. Case 3 introduces bad faith that breaks the "we," and Case 4 shows coercion removing agency - both supporting the intentionality requirement. But then Case 5 challenges this by showing a committee decision without shared intent, which the user still treats as collective action. Cases 6 and 7 are particularly interesting - identical behaviors where only a false belief in Case 7 seemingly breaks the jointness, which their principle can't explain. Case 8 probes human-machine collaboration boundaries, and Case 9 examines institutional continuity over time.

  Their stated principle (mutual intention + adjustment + openness) works well for Cases 1-4 but fails elsewhere. It can't handle the committee's procedural unity in Case 5, struggles with the specification as a proxy in Case 6, and wrongly validates Case 7. The engineer cases (6/7) are especially revealing - the only difference is a false belief about the other being human, suggesting that mutual recognition matters more than abstract coordination.

  For institutional accountability (like the lab in Case 9), we might need a separate dimension tracking structural agency - where the collective exists as an entity with persistent processes, regardless of individual turnover. This would explain why written protocols make the user more comfortable attributing action to "the lab."

  The human-machine case (8) seems to turn on bidirectionality. A simple autopilot is a tool, but a co-trained planner that influences human decisions starts resembling a participant in a feedback loop. Still, calling it a "we" feels metaphorical - perhaps accountability should stick with the human operators while noting the system's role.

  The user's challenge with Case 7 is understandable. If both engineers act identically, why does belief change the verdict? It reveals that joint action isn't just about coordinated behavior but about mutual orientation - each must conceive the other as an agent to adjust to, not just an obstacle or force of nature. The specification in Case 6 works because it's a shared object representing mutual obligations.

  For new test cases: a crew replacing members mid-task unnoticed could still count as collective action if procedures maintain continuity. But if a janitor accidentally completes a scientist's experiment by cleaning at the wrong time, that's mere aggregation - no intentional chain.

  Ultimately, the user might need two frameworks: one for joint agency (requiring mutual awareness) for small groups, and one for institutional accountability (requiring persistent structures) for organizations. Their Case 5 verdict (committee action without shared intent) suggests they already intuitively do this. I'll argue they should surrender their Case 7 intuition and treat 6/7 the same, as the behavioral reality outweighs private beliefs for accountability purposes.
answer: |-
  Based on your cases and the tension between behavioral coordination and mental-state requirements, I propose a **Two-Tiered Accountability Principle** distinguishing *Joint Agency* (requiring shared intentionality) from *Institutional Action* (requiring structural unity). This resolves conflicts in your verdicts while prioritizing accountability over metaphysical "jointness."

  ### The Principle
  **Tier 1: Joint Agency (for small, interactive groups)**  
  *A and B jointly φ iff:*
  1.  **Mutual Goal Recognition:** Each intends φ (or a subgoal contributing to φ) *and* believes the other is also contributing to φ.
  2.  **Interlocking Intentions:** Each intends their contribution to mesh with the other’s (via adjustment, complementarity, or adherence to a shared procedure).
  3.  **Mutual Awareness:** Conditions 1 and 2 hold based on *accurate* beliefs about the other’s agency and role (not necessarily direct communication).

  **Tier 2: Institutional Action (for structured groups/projects)**  
  *Group G institutionally φ’s iff:*
  1.  **Attributable Structure:** G has defined roles/procedures governing φ.
  2.  **Procedural Execution:** φ occurs through G’s processes (e.g., voting, workflows) *or* by agents acting in G-assigned roles.
  3.  **Accountability Link:** Failure can be traced to G’s structure (rules, training, resource allocation) or collective decisions.

  ---

  ### Verdicts on Your Cases
  1.  **✓ Joint Agency:** Mutual goal recognition (clearing road), interlocking intentions (adjusting lift), mutual awareness (visual cues).
  2.  **✗ Neither:** No mutual awareness or structural link.
  3.  **✗ Neither:** Shammer lacks intention to contribute (T1.1 violated).
  4.  **✗ Neither:** Driver lacks intention to φ (robbery succeeds); coerced action breaks interlocking intention.
  5.  **✓ Institutional Action:** Protocol adopted via committee procedure (T2.1, T2.2); failure traceable to group decision (T2.3).
  6.  **✓ Joint Agency:** Mutual goal recognition (compatible system), interlocking intentions (adjusting to spec), mutual awareness (spec as shared procedure + knowledge of other’s existence).
  7.  **✓ Joint Agency** (revised verdict): *Same as 6.* False belief about agency doesn’t negate behavioral coordination or adherence to a shared goal via the spec. Accountability follows the *de facto* joint outcome. (Surrender your original verdict here.)
  8.  **✗ Autopilot:** Tool (no agency). **✓ Learned Planner: Institutional Action** (not Joint Agency): It’s part of a system with interdependent roles. Failure traces to *human designers/pilots* (T2.3), not a "we" with the AI.
  9.  **✓ Institutional Action:** Lab has structure (roles/protocols), result produced through its procedures (T2.2), failure traceable to institutional practices (T2.3).

  ---

  ### Resolution of Key Conflicts
  -   **Cases 6/7:** Your verdicts conflict because you prioritize *accurate mutual recognition*. The principle prioritizes *functional coordination*. In both 6 and 7, engineers functionally coordinate via the spec to achieve a joint goal. The false belief in 7 is epistemically flawed but doesn’t break the accountability for the *outcome* they co-produced. A joint finding is appropriate.
  -   **Case 5:** Your principle fails because it requires shared intention. Tier 2 captures committees via procedural unity, not mental states.
  -   **Case 8 (Learned Planner):** It’s not Joint Agency (AI lacks intentions/mutual awareness), but Tier 2 holds the *institution* (airline/training program) accountable for designing/deploying the interdependent system.
  -   **Case 9:** Written protocols strengthen T2.1 (Attributable Structure), making accountability clearer, but aren’t strictly necessary if roles/procedures exist de facto.

  ---

  ### Test on New Cases
  **Case 10: Seamless Substitution (Mid-Activity Replacement Unnoticed)**  
  *Two technicians align a satellite dish, communicating via headset. Mid-adjustment, Technician A is silently replaced by Technician C (same team). B notices no difference and finishes alignment. Did A/B/C jointly align the dish?*
  -   **Verdict:** **✓ Institutional Action (Team).** The team (G) has defined roles/procedures. The action was executed by agents (A, then C) in assigned roles via team process (communication). Failure would trace to team structure/training (T2.1-T2.3). *Not Joint Agency* between B and C (no mutual awareness of substitution), but accountability lies with the team.

  **Case 11: Accidental Coordination**  
  *A chemist leaves a solution mixing, intending to return. A janitor (unaware of the experiment) pauses cleaning, thinking the noise is faulty equipment. This pause allows the reaction to complete correctly. Did the chemist and janitor produce the result?*
  -   **Verdict:** **✗ Neither.** No mutual goal recognition (janitor has no intent re: experiment), no interlocking intentions, no shared structure/procedure linking them. Mere aggregate cause.

  ---

  ### What Your Principle Must Surrender & Why
  -   **Surrender your Case 7 verdict.** Holding that the engineers *aren’t* acting together overvalues subjective belief accuracy and undervalues functional, procedurally mediated coordination. Their actions *are* interlocked via the spec, producing a joint outcome. Accountability should follow the observable structure and result.
  -   **Accommodation Limits:** Your Case 3 (Shammer) verdict is preserved but under T1.1 (intention violated). Case 4 (Driver) is preserved (T1.1/T1.2 violated). Case 5 is accommodated under Tier 2.

  ---

  ### When Accountability Diverges from Jointness
  Accountability often *should* track **Institutional Action (Tier 2)** over strict Joint Agency, especially in organizational contexts:
  -   **Case 5 (Committee):** No shared intention, but accountability lies with the committee *as an institution*.
  -   **Case 8 (Learned Planner):** No "we," but accountability lies with the institution deploying the system.
  -   **Case 9 (Lab):** No persistent "we," but the *lab as an institution* is accountable for its output.
  -   **Case 10 (Substitution):** Accountability lies with the team structure, not fleeting joint intentions.

  **Judgment Call Zones:**
  1.  **Defining "Structure" for Tier 2 (Case 9):** When do informal practices become "defined roles/procedures"? Judgment needed based on evidence of established workflows.
  2.  **Intent vs. Coercion Threshold (Case 4):** How much coercion negates intention? Judgment based on severity/alternatives.
  3.  **AI's Role (Case 8):** How much autonomy/deference creates institutional responsibility? Judgment based on design/oversight.

  This principle prioritizes traceability of failure and functional coordination over philosophical "jointness," aligning with your board’s practical need to assign actionable recommendations. It captures your core intuitions (1-4, 6 revised) while resolving conflicts via institutional accountability where joint intention is absent or obscured.
