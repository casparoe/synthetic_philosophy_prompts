prompt: |-
  I'm in a seminar on moral change right now (we did Appiah's book on honor codes and then the Bernard Williams argument about slavery — the bit where he says the ancients weren't missing any fact that we have, reflection just wrecked their conceptual scheme, and there's no guarantee that whatever replaces it is an improvement) and I also work about fifteen hours a week as a student campaigner for a small NGO that runs behaviour-change campaigns. We greenlight maybe four campaigns a year, each one costs a couple hundred thousand dollars, and our actual method so far is basically: decide the practice is bad, say on a poster that it's bad, measure nothing. I have to run a workshop for our country director and two community advisory board members next month on how we pick and design these things, and I'd rather bring them something usable than a summary of the readings.

  So what I want is a procedure, not an essay. Take the distinction between norms held in place by argument, by interest, and by honour, and turn it into a decision procedure our team could actually run on a candidate practice in an afternoon workshop — the questions in order, what counts as a good enough answer to each, where it stops with a hard no, and where it has to hand the decision back to a human being because it's really a question about values. The people running it will be comms staff and one field officer, so nothing that needs philosophy vocabulary to apply. Things I think it has to handle, and I'm not sure how: how to work out who the relevant honour audience actually is (whose respect does the person doing the practice need, and can we reach them); whether the practice can even be made visible to that audience, since I suspect a lot of our campaigns target things nobody will admit to anyway; whether there's a face-saving exit ramp so people can stop without conceding they were wrong before — my guess is that's why the anti-dueling stuff worked and our stuff doesn't; and how to tell a case where people already privately agree with us but can't stop because of coordination or money, which I think no amount of honour or argument will fix. I also want it to be honest about the Williams worry my tutor keeps raising, which as I understand it is that a procedure like this can tell you whether you'd win but not whether you're right — if that's a real limit, mark exactly where it bites in the procedure.

  Then run it on three cases. First: the initiation week for the sports clubs at my own university, which involves a lot of drinking and some genuinely nasty hazing that everyone knows about and nobody reports. Second: informal cash gifts that families give to nurses at a district hospital where our partner works — everyone knows it's against the rules, the nurses' salaries are months in arrears, and families who don't pay say they get ignored; I can't tell if this is an interests case, an honour case, or neither. Third, and this is the one where I expect an answer I won't like: our own fundraising imagery, i.e. photos of identifiable children in pretty dire situations that we send to donors because they outperform everything else we've tried. Please don't tell me to go read more — I need something I can put on one page and defend in the room.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're in a seminar on moral change, discussing Appiah's honor codes and Bernard Williams' argument about conceptual schemes. Now, they need to create a practical workshop for their NGO on selecting behavior-change campaigns. The key here is translating philosophical concepts into a usable procedure without jargon.

  First, the user wants a step-by-step decision procedure. They mentioned three pillars from Appiah: argument, interest, and honor. I need to break these down into actionable questions. The team consists of comms staff and a field officer, so simplicity is crucial. The procedure must address specific challenges: identifying the honor audience, making practices visible, creating exit ramps, and distinguishing between coordination problems versus genuine disagreement.

  Looking at the three cases: university hazing, cash gifts to nurses, and fundraising imagery. Each tests different aspects of the framework. For hazing, the honor dynamics among peers are central. The cash gifts involve economic interests and social pressures. Fundraising imagery pits donor response against ethical concerns—classic Williams territory where effectiveness clashes with values.

  The user emphasized the Bernard Williams warning. The procedure must clearly mark where it can only predict success, not moral correctness. That means separating empirical questions (e.g., "Can we reach the honor audience?") from normative ones (e.g., "Is this practice wrong?"). The latter should be flagged as requiring human judgment.

  Another challenge is the invisibility of practices. If a behavior is hidden, like bribery, shaming won't work. The procedure needs a step to assess visibility and suggest making it visible only if ethical. Exit ramps are critical—offering alternatives like public commitments for hazing or legal payment channels for nurses.

  For the cash gifts case, it's likely an interests problem masked as corruption. But if nurses fear losing respect for refusing gifts, honor plays a role. The procedure should tease this apart by asking if changing material incentives would suffice. If yes, it's interests; if not, honor or coordination issues exist.

  Fundraising imagery is tricky. Evidence shows it works, but exploiting suffering is ethically questionable. Here, the procedure reaches its limit. It can confirm the campaign's effectiveness (honor appeal to donors' desire to help) but can't resolve if it's right—that's a values decision for the NGO.

  I'll structure the procedure as a flowchart: after defining the problem, assess if the practice has honor elements. If yes, identify the audience and visibility. Then check for interest barriers and coordination issues. Where moral questions arise, hand them to humans. For each case, apply the steps methodically, showing where Williams' concern applies—especially in the fundraising example, where effectiveness doesn't justify the means.

  Finally, ensuring the output fits on one page. Use plain language, icons for steps, and clear stopping points. Highlight exit ramps and visibility fixes. The goal is practicality: a tool that comms teams can use immediately, while acknowledging philosophical limits upfront.
answer: |-
  Here’s a practical, one-page decision procedure for evaluating behavior-change campaigns, based on Appiah’s triad (Argument/Interest/Honor) and Williams' caution. Designed for a 90-minute workshop with non-philosophers.

  ---

  **BEHAVIOR SHIFT CHECKLIST: SHOULD WE RUN THIS CAMPAIGN?**  
  *(Answer sequentially. Stop if any "NO" or "UNCLEAR" blocks the campaign without deeper review.)*

  ### PHASE 1: UNDERSTAND THE PRACTICE
  1.  **"Can we describe the *specific* behavior we want to change in one sentence?"**  
      *   *Good Answer:* Concrete action (e.g., "Students force new members to drink until vomiting," not "Stop hazing").  
      *   *Stop If:* Vague or multiple behaviors bundled together. *Handoff to Human:* None.
  2.  **"Who *exactly* does this behavior? Who benefits? Who is harmed?"**  
      *   *Good Answer:* Clear groups identified (e.g., Perpetrators: Senior club members; Beneficiaries: Senior members (status), Harmed: New members, University reputation).  
      *   *Stop If:* Key groups unclear. *Handoff to Human:* None.

  ### PHASE 2: WHY DOES IT PERSIST? (Appiah's Triad)
  3.  **"Is this held up by MATERIAL INTEREST? (Do people *lose money, time, safety, or critical opportunity* if they stop?)"**  
      *   *Good Answer:* Evidence of direct cost (e.g., Nurses lose income if gifts stop; families fear worse care).  
      *   *Action:* If YES, campaign *must* address this first (e.g., lobby for nurse salary payments, create legal tipping channels). **Argument/Honor campaigns will FAIL here. STOP unless you fix the interest.**
  4.  **"Is this held up by HONOR/RESPECT? (Do people do it to avoid *shame* or gain *status/respect* from a specific group?)"**  
      *   *Good Answer:* Identifies the *"Honor Audience"* (Whose respect matters? Peers? Elders? The community? Donors?).  
      *   *Crucial Test:* **"Can we *reach and influence* that specific Honor Audience?"** (e.g., Can we get sports club seniors to see hazing as shameful? Can we make donors see exploitative photos as dishonorable?)  
      *   *Visibility Check:* **"Is the behavior (or refusal to do it) *visible* to the Honor Audience?"** If NO (e.g., secret bribes, hidden hazing), can we *ethically* make it visible?  
      *   *Stop If:* Honor Audience unclear OR unreachable OR behavior invisible & can't be ethically made visible.  
      *   *Handoff to Human:* "Is the Honor value here fundamentally at odds with our core ethics?" (Williams Warning starts here).
  5.  **"Is this held up by BELIEF/ARGUMENT? (Do people genuinely think it's *right or necessary*?)"**  
      *   *Good Answer:* Evidence of sincere belief (e.g., "Gifts show gratitude," "Hazing builds toughness").  
      *   *Stop If:* Belief is deeply tied to core cultural/religious values your NGO doesn't challenge.  
      *   *Handoff to Human:* "Is this belief based on facts we can correct, or is it a fundamental value difference?" (Williams Warning).

  ### PHASE 3: CAN WE CHANGE IT? (Practical & Ethical Checks)
  6.  **"Is there a COORDINATION PROBLEM? (Do people *privately* want to stop but feel *trapped* because others won't?)"**  
      *   *Good Answer:* Evidence many dislike the practice but comply (e.g., "Most students hate hazing but fear exclusion," "Families resent bribes but fear being the only one not paying").  
      *   *Action:* If YES, focus campaign on creating public commitment/visible tipping point (e.g., pledges, visible alternatives). **Argument/Honor alone won't fix this.**
  7.  **"Is there a SAFE EXIT RAMP? (Can people stop *without humiliation* or admitting past 'wrongness'?)"**  
      *   *Good Answer:* Offers a face-saving justification to stop (e.g., "New Uni Policy = I *have* to stop hazing," "Official Gratitude Fund = I can show respect *this* way instead").  
      *   *Stop If:* No plausible exit ramp exists. Campaign will likely fail.
  8.  **THE WILLIAMS WARNING (Final Check):**  
      *   **"Even if this campaign *works*, could it replace something valuable with something worse? Have we truly understood *why* this practice exists?"**  
      *   *Handoff to Human:* **ALWAYS.** This is the fundamental ethical question no procedure can answer. Requires values discussion. *Mark Here: This is where "success" ≠ "right."*

  ---

  **APPLYING THE CHECKLIST TO YOUR CASES:**

  1.  **University Sports Hazing:**
      *   *Phase 1:* Clear behavior & actors (Seniors hazing new members).
      *   *Phase 2:* **Interest?** Low (perpetrators). **Honor? YES!** Audience = Peers (other club seniors/uni athletes). *Reachable?* Maybe (via star athletes/coaches). *Visible?* YES (semi-public). **Belief?** Some ("builds toughness"). **Coordination?** YES (many seniors privately dislike it). **Exit Ramp?** Crucial! (e.g., "New mandatory training replaces hazing," focus on "building real team spirit").
      *   *Verdict:* **POTENTIAL YES.** Focus: Honor shift *within* peer group + Coordination solution (public pledge) + Strong Exit Ramp. Williams Warning: Risk losing *any* group bonding? (Human judgment).

  2.  **Cash Gifts to Nurses:**
      *   *Phase 1:* Clear behavior (Families give cash to nurses).
      *   *Phase 2:* **Interest? STRONG YES!** (Nurses need income; families fear neglect). **Honor?** Maybe minor ("showing gratitude"), but Audience (nurses?) weak. Belief? Weak ("everyone does it"). **Visibility?** Low (covert).
      *   *Phase 3:* **Coordination?** YES (Families fear being the only non-payer). **Exit Ramp?** Needs one (e.g., official complaint channel *without* punishing nurses?).
      *   *Verdict:* **HARD STOP at Interest (Q3).** Campaigns shaming gifts or arguing ethics *will fail* while salaries are unpaid & care is scarce. **Must fix material interest first** (advocate for salaries, transparent systems). Then maybe address coordination.

  3.  **Exploitative Fundraising Imagery:**
      *   *Phase 1:* Clear behavior (Using identifiable child suffering in ads).
      *   *Phase 2:* **Interest?** YES (Campaign $ is vital). **Honor? YES!** Audience = **DONORS.** *Reachable?* YES (you talk to them). *Visible?* YES (the ads). **Belief?** Mixed (Some staff think it's necessary; some donors might feel noble).
      *   *Phase 3:* Coordination? Low. Exit Ramp? Easy (Use different images).
      *   *Williams Warning (Q8):* **THIS IS THE CRITICAL QUESTION.** Does the *effectiveness* (Honor appeal to donors) justify the potential harm (exploitation, undermining dignity)? **The procedure shows you *can* shift the honor norm (by making donors see it as shameful), but CANNOT tell you if you *should*.** This is pure Values Handoff: Does this practice align with your NGO's core mission and ethics, regardless of income? The procedure predicts success but flags the ethical risk starkly.

  ---

  **WORKSHOP DELIVERABLE:** Print this checklist + 3 case answers on one page.  
  **Defend It In The Room:**  
  1.  **It's Actionable:** Asks specific, answerable questions in order.  
  2.  **Prevents Wasted Effort:** Stops campaigns destined to fail (like arguing ethics where interest rules, or shaming where honor is invisible).  
  3.  **Forces Critical Thinking:** On Honor Audiences, Exit Ramps, and Coordination.  
  4.  **Honest About Limits:** Clearly marks the Williams Warning (Q8) – success ≠ moral improvement. Makes values debates explicit, not hidden.  
  5.  **Built for Your Team:** Uses plain language, focuses on evidence & reachability.  

  This won't give easy answers on values (Williams is right!), but it will make your campaign choices far more rigorous and likely effective where it matters. Good luck!
