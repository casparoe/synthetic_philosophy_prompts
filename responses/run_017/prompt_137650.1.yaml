  Also, the widening interval: in this case, after seeing green, the interval for P(next green) is [0.593,0.818], which is wider relative to the prior average (0.5667) but actually narrower than the prior range which was [min over factories, including C's uncertainty]. Prior P(green) min: if C has p=0, then P(green)= min over factories, but since we don't know factory, for each prior in set, P(green) can be from min over factories' p? No, for a fixed prior in set (fixed p_C), P(green) = (1/3)(0.4 + 0.8 + p_C), so as p_C from 0 to 1, P(green) from (1.2)/3=0.4 to (2.2)/3≈0.733. After seeing green, P(next green) as above from 0.593 to 0.818. The min increased from 0.4 to 0.593, max decreased from 0.733 to 0.818, so the interval narrowed. But in other cases, it might widen. For example, if we had ambiguous evidence, but in this symmetric update, it narrowed.

  Perhaps with conflicting evidence. But for the user, this example already shows that after updating, the imprecise model has a range while the average has a point, and decisions might differ.

  To answer the question: what is lost by averaging? The information about the range of plausible probabilities given the evidence. Averaging forces a specific weighting (e.g., uniform over p_C) that may not be justified, and hides the remaining ambiguity. In decisions, if you're ambiguity-averse, you might avoid bets that are favorable on average but have a high downside risk.

