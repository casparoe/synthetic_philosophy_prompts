    - Why? If truth depends on the person (Q2→No) but meaning doesn’t shift (Q4→No) and truth can’t vary (Q5→No), you have a contradiction.  

  - **Unattested but coherent?** None. All non-empty leaves are attested.  
  - **Leaves the tree can’t separate**:  
    - *Community-relative truth* (Leaf 3) is sometimes conflated with relativism, but the tree separates them via Q2 (truth based *only* on the thing → Leaf 3) vs. Q5 (truth varies by person → Leaf 5).  

  - **Stricter-in-every-way handling**:  
    - Built into leaf explanations. No new branch needed—it doesn’t break the views but tests them:  
      - In contextualism/relativism, faultlessness holds.  
      - In objectivism, it exposes why one person *must* be wrong.  
    - If this case feels like it "breaks" something, it’s likely because objectivism (Leaf 2) struggles to explain why the stricter person’s standard seems internally consistent yet "wrong."  

  ### Final Notes
  - **Most confident leaves**: Objectivism, Contextualism, Relativism (well-defended in philosophy).  
  - **Least confident leaf**:  
    - *Expression without belief* (Leaf 1): Real (e.g., "emotivism"), but rare in everyday disputes. Friends might think they’re stating facts.  
  - **Tree strength**: Cleanly separates the 4 views you requested. The 5th question handles the stricter-in-every-way tension explicitly.  
  - **If debates persist**: Focus on Question 4 (does meaning shift?). It’s the pivot between "no real disagreement" (contextualism) and "genuine but faultless disagreement" (relativism).  

