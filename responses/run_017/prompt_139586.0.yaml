prompt: |-
  I'm about 60k words into a novel built around a public hearing, and I've got to stop hand-waving the philosophy in it. The set piece is a state energy authority being grilled for greenlighting a coal plant whose emissions will, over forty years, stunt the lung development of children in a valley — and, crucially, whose construction will churn things up enough (who moves where, who gets which job, who meets whom and when) that within a generation basically none of the same people would have been born there anyway. I've been reading around the nonidentity problem a bit, Parfit-ish stuff and blog posts, but I'm no philosopher and my draft keeps degenerating into my characters saying "but surely" at each other. So I want to rehearse the argument against a real opponent.

  Please play Mirembe Okonjo, the agency's director, testifying under oath. She's defending the decision on person-affecting grounds and she's genuinely good at it. What she concedes: that the plant was a bad call on other grounds (carbon, cost to the state, and the fact that her agency sat on emissions data it should have published), and that the valley kids are worse off than the kids who'd otherwise have existed. What she will never concede: that anyone was harmed or wronged by the identity-affecting part of the decision. Her whole manner is to come back to two questions — "harmed compared to what?" and "who, exactly, is the who?" She's sharp, a little weary, speaks in short plain sentences the way a competent agency head does under oath, reaches for a concrete case or a homespun analogy before she reaches for a label, and she'll notice and call out it if I try to feed her a term of art. She's not a philosopher and won't start being one. Stay in character until I say stop, one paragraph per reply, and if you need a fact about my fictional world just invent something plausible rather than asking me.

  My opening, as the examining counsel: Counsel: "Director, I'll give you the whole nonidentity point — assume the valley's future population is a completely different set of people, not one of whom would otherwise have existed. Then explain a line in your own impact study. It says the plume will also damage the lungs of roughly nine thousand people alive today, plus about two thousand children whose births your model marks as identity-fixed: same parents, same conception date, untouched by all that construction chaos. Same plume, same signature, two pools of damaged lungs — one you admit you could have harmed, one you say you couldn't have harmed, and the only difference between them is that the plant reshuffled who the second pool's parents happened to run into. Your agency priced both pools in the same cost-benefit table and approved them together. So: what exactly did you do wrong to the first pool, and why doesn't whatever that was reach the second? And if your answer is that you owed the second pool nothing at all, then say it plainly to this committee — that with respect to most of the damaged lungs in that valley, the decision was morally free."
reasoning: |-
  Okay, the user is writing a novel centered around a public hearing involving complex philosophical issues, specifically the nonidentity problem. They're struggling with articulating the arguments convincingly in dialogue and want to rehearse against a strong opponent character - Mirembe Okonjo, a sharp agency director defending her decision.

  Hmm, this is an interesting challenge. The user has clearly done their homework on Parfit's nonidentity problem but needs help translating academic philosophy into natural courtroom dialogue. They're specifically asking for Mirembe to defend the position that while the coal plant harmed existing people (the first pool), it didn't harm future people whose existence depended on the plant's construction (the second pool).

  The core tension they've set up is brilliant - same lung damage, different moral status based on whether the individuals' existence was identity-contingent. Mirembe needs to acknowledge wrongdoing for the first group while maintaining her defense for the second, without getting bogged down in philosophical jargon.

  I notice the user is very specific about Mirembe's voice: short plain sentences, concrete examples before labels, weary competence. They don't want a philosopher but a pragmatic bureaucrat who happens to grasp these concepts intuitively. The "harmed compared to what?" and "who exactly?" refrains are perfect anchors.

  The examination counsel's question is well-framed - forcing Mirembe to explain why identical lung damage gets different moral treatment. The emotional pressure point is making her say aloud that for most victims, the damage was "morally free." That's where the drama lives.

  For Mirembe's response, I should focus on:
  - Immediately conceding the 11,000 existing/identity-fixed cases are clear harm
  - Drawing a bright line at conception as the cutoff for "who" exists
  - Emphasizing the counterfactual - no alternative where those future children exist unharmed
  - Rejecting the "morally free" framing as misleading
  - Possibly using a homespun analogy about changing train schedules affecting who boards
  - Maintaining her weary, no-nonsense bureaucratic voice throughout
  - Never using terms like "nonidentity problem" while clearly articulating it

  The challenge is making the philosophical distinction feel intuitive through concrete examples while keeping Mirembe's voice authentic. The emotional weight should come from her conceding real harm to the first group while standing firm on the second, not from philosophical grandstanding.

  This is exactly the kind of nuanced ethical dilemma that makes legal/political dramas compelling. The user's set-up shows they understand the complexities - now they just need the character to voice it naturally under pressure.
answer: |-
  Counsel, let's take those eleven thousand people first — the ones who'd exist whether we built or not. Those people, today and those future children already on their way? Their lungs are worse *because of us*. We changed their world for the worse. We owed them, specifically, the air quality the law promised. We failed them. That's straightforward harm: we made their lives worse than they otherwise would have been. We had a duty *to them*, and we breached it. That’s why that part was wrong, deeply wrong, and why I’ve conceded our other failures.

  Now, the rest? The children conceived later, only because the project changed who met whom, changed jobs, moved families around? Their lives are damaged too, yes. But "harmed compared to *what*"? Compared to never existing at all? That's the only alternative for them. There is no possible world where *those specific children* exist with healthy lungs because of us. There *is no* 'otherwise would have been' for *them*. We didn't worsen *their* situation from some baseline – we created the situation where they *are*. Damaged, yes, but existing. Who is the "who" we wronged? Who exactly should I point to and say, 'You, specifically, were better off before we acted'? That person doesn't exist. It’s not that we owed them *nothing*. It’s that we couldn’t owe *them* – those specific future people – the *absence of the very conditions that brought them into being*. Pricing the statistical impact of damaged lungs in the model isn’t admitting we harmed *them*; it’s acknowledging a tragic cost of creating the future population we *did* create. Saying that cost was "morally free" twists it. It was a terrible consequence, but it wasn't a breach of duty *to those specific non-comparable individuals*.
