answer: |-
  ### Bottom Line
  Students revise their estimates after seeing anonymous peer estimates, then discover that identical agreement patterns had different evidential causes (independent vs. shared evidence), forcing confrontation with the invisibility of evidential overlap and its impact on peer weighting.

  ### Session Design
  **Materials**  
  - Urn: 100 poker chips (60 red, 40 blue; true proportion red = 0.6).  
  - Envelopes:  
    - 7 envelopes with unique samples (independent evidence group; each sample: 5 chips drawn with replacement from urn, recorded, chips returned).  
    - 7 envelopes with identical samples (shared evidence group; one sample of 5 chips drawn, duplicated for all envelopes).  
  - Index cards (42 total: 3 per student for estimates, 1 per student for rule).  
  - Projector/spreadsheet for displaying numbers.  
  - Colored tokens (optional): Use red/blue chips in samples.  
  - Scorecards (pre-printed) for payout calculations.  

  **Partitioning for Evidential Overlap**  
  - Randomly shuffle 14 envelopes (7 independent, 7 shared) and distribute one per student. Students are unaware of the two groups.  
  - **Independent group**: Each has a unique sample (e.g., Student 1: 3 red, 2 blue; Student 2: 4 red, 1 blue, etc.).  
  - **Shared group**: All have the same sample (e.g., all have 2 red, 3 blue).  
  - *Key*: Samples are pre-drawn and sealed. True urn composition hidden until the end.  

  **Timeline (80 Minutes)**  
  1. **0–5 min: Setup and Instructions**  
     - *Instructor script*: “You each have an envelope with 5 chips from an urn of 100 red/blue chips. The true proportion of red is fixed but unknown. Open your envelope privately. Write on Card 1: (1) Your estimate of the red proportion (0 to 1), (2) Your confidence (0–10, 0=lowest). Do not share your chips yet.”  

  2. **5–15 min: Private Estimation**  
     - Students examine their sample, write estimate and confidence on Card 1.  
     - Collect Card 1.  

  3. **15–20 min: Display Private Estimates**  
     - Project all anonymous estimates and confidences (e.g., “Estimate: 0.4, Conf: 6; Estimate: 0.8, Conf: 3; …”).  

  4. **20–30 min: First Revision (No Discussion)**  
     - *Instructor script*: “You see all estimates. Without talking, revise your own. Write on Card 2: Revised estimate and revised confidence.”  
     - Collect Card 2.  

  5. **30–35 min: Display Revised Estimates**  
     - Project revised estimates/confidences anonymously.  

  6. **35–45 min: Discussion and Final Revision**  
     - *Instructor script*: “Discuss freely: Share your chips and reasons. After 10 minutes, write on Card 3: Final estimate and final confidence.”  
     - Collect Card 3.  

  7. **45–50 min: Display Final Estimates**  
     - Project final estimates/confidences.  

  8. **50–55 min: Reveal True Proportion and Scores**  
     - Reveal urn: 60 red, 40 blue (proportion = 0.6).  
     - **Scoring rule**: Accuracy score = 10 × [1 − (estimate − 0.6)²].  
       - *Example*: Estimate 0.7 → (0.7−0.6)² = 0.01 → Score = 10 × (1−0.01) = 9.9.  
     - Project scores for final estimates (anonymous, grouped by independent/shared later).  

  9. **55–65 min: Rule Self-Application**  
     - *Instructor script*: “Suppose you and an equal peer disagree after seeing the same evidence. How much do you move toward their view? Write a fraction F (0–1) on Card 4: 0=no move, 1=fully adopt.”  
     - Collect F values, project anonymously (e.g., “F: 0.2, 0.7, …”).  
     - *Instructor script*: “Now apply your F to this disagreement: Move your F toward the class average F by fraction F. Write new F1 = (1−F) × your F + F × average F.”  
     - Collect and project F1 next to original F.  

  10. **65–80 min: Debrief**  
      - Reveal group structure: “Group A had unique samples; Group B had identical samples.” Show which students were in which group.  
      - Discuss:  
        - **Evidential Overlap**: “In Group B, agreement came from shared evidence—it added no new information. In Group A, agreement suggested stronger evidence. But you couldn’t tell from estimates alone. What you owe a peer depends on hidden evidence overlap.”  
        - **Self-Application**: Point to F/F1 projection. “If your F was 0 (steadfast), F1=0—no change. If F>0 (conciliatory), F1 moved toward the average. Apply F repeatedly: Conciliationism may converge to a fixed point or oscillate; steadfastness never moves. This mirrors the problem: Conciliating about conciliationism may weaken it.”  
        - **Accuracy and Confidence**: Contrast scores in Group A (e.g., moving helped if evidence independent) vs. Group B (e.g., moving hurt due to shared evidence). “Confidence soared in Group B? That was overconfidence—agreement didn’t warrant it. Accuracy pays, but hedging isn’t free: Under-confident in Group A missed gains; over-confident in Group B cost accuracy.”  
      - Acknowledge: “Half of you were misled by shared evidence. This is unavoidable—you can’t always see evidence overlap.”  

  ### Handling Predictable Issues  
  - **Refuses to give a number**: Allow pass (score = 0 for that stage), but encourage: “Your best guess is fine—this is about your reaction.”  
  - **Treats as urn puzzle**: Redirect: “Focus on how others’ estimates affect you, not just the urn.”  
  - **Everyone hedges similarly**: If estimates/converge blandly, highlight: “Fixed points happen—e.g., if all F=0.5, F1=0.5. But in real life, initial diversity prevents this.”  
  - **Noisy samples**: Expected—e.g., shared group may have biased samples (e.g., 2/5 red), making revision costly. Use this to show evidential risks.  
  - **Time pressure**: Skip projecting confidences if behind; use pre-loaded spreadsheet for quick scoring.  

  ### What the Game Cannot Reproduce  
  - **Epistemic asymmetry**: Assumes true equality in reliability and evidence access. Real disagreements often involve perceived competence differences—state this and argue for peerhood as an idealization.  
  - **Complex evidence**: Game uses simple sensory data; real disagreements involve reasoning, interpretation. Argue that the core problem (weighting peers amid hidden evidence) remains analogous.  

  ### Why This Works  
  The hidden evidential overlap (independent vs. shared samples) creates identical visible agreement (e.g., seven 0.6 estimates) but divergent evidential weight. Students *revise blindly* and *discover the mismatch* in debrief, making abstract problems (peer weighting, self-application) visceral through their scores and rules.
