  #### Cruxes  
  **Crux 1: Is salience irreducible?**  
  - **Question:** Can salience explain outcomes beyond the size of a basin of attraction?  
  - **Why it moves a side:** The Lewisian sees salience as a cognitive primitive; the modeller views it as redundant.  
  - **Replication/Probe:** Replication 2 (announcement).  
  - **Predictions:**  
    - Lewisian: In ≥4 of 5 runs, the group converges to "zog" by round 60 (≥95% usage).  
      - *Damage if:* ≤2 runs converge to "zog".  
    - Modeller: In ≤3 of 5 runs, the group converges to "zog".  
      - *Damage if:* ≥4 runs converge to "zog".  

  **Crux 2: Does the announcement transcend belief-updating?**  
  - **Question:** Does the cheap announcement (replication 2) exert unique influence unexplained by learning models?  
  - **Why it moves a side:** The Lewisian attributes power to salience/common knowledge; the modeller sees only belief adjustment.  
  - **Replication/Probe:** Replication 2 (announcement) vs. a modified replication 2 *without* common knowledge (e.g., announce only to half the group).  
    - *Note:* Original replication 2 cannot discriminate; modification creates asymmetry in expectations.  
  - **Predictions (modified probe):**  
    - Lewisian: Full-group announcement converges to "zog" faster (by round 50) than partial.  
      - *Damage if:* No speed difference.  
    - Modeller: Both conditions converge at similar speeds.  
      - *Damage if:* Full-group is ≥20 rounds faster.  

  **Crux 3: Are mixed-motive norms a change of subject?**  
  - **Question:** Do sanction-based norms require Lewisian expectations, or are they dynamically distinct?  
  - **Why it moves a side:** The Lewisian sees continuity; the modeller sees a paradigm shift.  
  - **Replication/Probe:** Not testable in current setup. *Proposed modification:* Add a "sanction round" to the game where players punish mismatches.  
  - **Predictions (modified probe):**  
    - Lewisian: Sanctions only stabilize if participants know punishments are common knowledge.  
      - *Damage if:* Sanctions work without common knowledge.  
    - Modeller: Sanctions stabilize via learning, regardless of knowledge.  
      - *Damage if:* Sanctions fail without common knowledge.  

  **Crux 4: Do sticklers prevent convergence?**  
  - **Question:** Can sticklers create persistent diversity?  
  - **Why it moves a side:** The Lewisian sees expectations as dominant; the modeller sees sticklers as basin-altering.  
  - **Replication/Probe:** Replication 4 (sticklers).  
  - **Predictions:**  
    - Lewisian: Group converges to one label in ≥4 of 5 runs (diversity ≤5%).  
      - *Damage if:* ≥3 runs show diversity >20%.  
    - Modeller: ≥3 runs sustain diversity (>20% minority label).  
