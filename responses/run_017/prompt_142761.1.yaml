answer: |-
  ### Joint Statement on the Nature of Conventions  
  **Following a Two-Day Adversarial Collaboration**  

  #### Preamble  
  This document is the product of a two-day adversarial collaboration convened by the author of this magazine feature. We—a philosopher in the Lewisian tradition and a modeller in cultural evolution—have long disagreed on how conventions emerge and persist. Our goal here is not to resolve our differences but to clarify them, identify testable predictions for an experimental study, and advance the science of cooperation. We do not claim consensus. We present agreed-upon claims, pinpoint disagreements, and specify "cruxes" (key sub-questions) that could shift our views if tested. This is a roadmap for empirical inquiry, not a conclusion.  

  ---

  #### Agreed Claims  
  1. A convention is a stable pattern of behavior that solves a recurring coordination problem—like choosing matching labels—where multiple solutions could work equally well.  
  2. In the merged-rooms study, each room’s convergence to "zog" or "mip" by round 30 arose from learning, history, and random chance; neither label was inherently superior.  
  3. After the rooms merge (round 31), the population may or may not reconverge to a single label by round 60, depending on experimental conditions.  
  4. If reconvergence occurs, it tends toward an equilibrium—a stable state where almost all participants consistently choose the same label.  
  5. The basin of attraction—the set of starting conditions that lead to a particular equilibrium—influences which convention dominates after the merge.  
  6. Salience—an option’s psychological prominence—can affect outcomes but arises from factors like precedent or external cues (e.g., an announcement).  
  7. Turnover (replication 3) disrupts stability by introducing newcomers with no prior experience.  
  8. Sticklers (replication 4) resist change and slow convergence but may not determine the final outcome.  
  9. Articulability (replication 5) speeds up learning when labels can be easily described.  
  10. Common knowledge—where everyone knows a fact, knows others know it, and so on—is present only if all participants observe the same evidence simultaneously (e.g., an announcement).  

  ---

  #### Disagreements Table  
  | Question | Lewisian’s Position | Modeller’s Position | Substantive or Verbal? | Crux |  
  |----------|---------------------|---------------------|------------------------|------|  
  | Is salience an independent cause? | "Salience is a fundamental cognitive force that directly explains why groups coordinate on one equilibrium over another." | "Salience is just a label for whatever widens a basin of attraction; it has no explanatory power beyond the dynamics." | Substantive | Crux 1 |  
