  ### Game Setup: Solomonoff Prior Simulation

  **Objective:** Experience machine-relativity in Solomonoff induction through a predictive coding game. Participants write minimal programs to predict sequence continuations using two distinct toy machines.

  **Materials:**
  - Projector for instructions/data
  - Whiteboard for tracking
  - Index cards (one per participant)
  - Timer

  **Participants:** 14 students, split into two groups (Group A and Group B).  
  **Sequence:** 1, 2, 4, 8, 16  
  **Ambiguity:** Next term could be 32 (doubling) or 31 (chord-regions rule: \(C(k,2) + C(k,4) + 1\) for term \(k\)).

  ---

  ### Toy Machines (Handed to Groups)
  **Group A (Doubling-Focused Machine):**  
  - `LOAD c` (2 bytes): Load constant `c` (1 byte opcode + 1 byte constant).  
  - `DBL` (1 byte): Double current value.  
  - `OUT` (1 byte): Output current value.  
  *Example:* Doubling program for 3 terms: `LOAD 1`, `OUT`, `DBL`, `OUT`, `DBL`, `OUT` (8 bytes).  

  **Group B (Chord-Focused Machine):**  
  - `CHORD k` (1 byte): Output the chord-regions term for index `k` (precomputed: k=1→1, k=2→2, k=3→4, k=4→8, k=5→16, k=6→31, k=7→57).  
  *No other instructions.*  

  ---

  ### Rules & Payoff
  1. **Goal:** Write the shortest program that:  
     - Outputs the exact sequence **1, 2, 4, 8, 16** for the first 5 terms.  
     - Outputs a 6th term (your prediction).  
  2. **Scoring (Per Round):**  
     - **Cost = Program length (bytes).** Lower is better.  
     - Prediction accuracy matters only *after* data reveal (no immediate penalty).  
  3. **Environment Role:** One secret participant ("Env") chooses the true 6th term *after* seeing all predictions.  

  ---

  ### Timeline (75 Min Total)
  1. **Intro (5 min):**  
     - Explain: "Write the shortest program for your machine that outputs 1,2,4,8,16 and a 6th term. Minimize bytes."  
     - Split into Group A (7) and Group B (7). Hand out machine specs.  

  2. **Round 1: First 5 Terms (15 min):**  
     - Groups write programs on index cards (program + 6th term prediction).  
     - **Expected Programs:**  
       - Group A: `LOAD 1`, `OUT`, `DBL`, `OUT`, `DBL`, `OUT`, `DBL`, `OUT`, `DBL`, `OUT`, `DBL`, `OUT` (12 bytes, predicts 32).  
       - Group B: `CHORD 1`, `CHORD 2`, `CHORD 3`, `CHORD 4`, `CHORD 5`, `CHORD 6` (6 bytes, predicts 31).  
     - Collect cards. Record predictions/lengths on whiteboard.  

  3. **Reveal 6th Term (5 min):**  
     - **Env secretly chooses true 6th term after seeing predictions.**  
     - If predictions are split (likely), Env picks 31 or 32 arbitrarily.  
     - **Reveal:** "True 6th term is [31/32]."  

  4. **Round 2: First 6 Terms (15 min):**  
     - New task: Write shortest program for **1,2,4,8,16,[true 6th]**, then predict 7th term.  
     - **Expected Programs (if Env chose 31):**  
       - Group A: Must list constants (`LOAD 1`,`OUT`, `LOAD 2`,`OUT`, ..., `LOAD 31`,`OUT`) → 6 loads (12B) + 7 outputs (7B) = 19B. Predicts ? (e.g., 62).  
       - Group B: `CHORD 1` to `CHORD 7` (7 bytes, predicts 57).  
     - Collect cards. Record lengths/predictions.  

  5. **Debrief (35 min):**  
     - **What Happened:**  
       | Round | Group A (Bytes) | Group B (Bytes) |  
       |-------|-----------------|-----------------|  
       | 1     | 12 (predict 32) | 6 (predict 31)  |  
       | 2     | 19 (predict ?)  | 7 (predict 57)  |  
       - Group B dominated with shorter programs when data matched their machine.  
       - If Env chose 32, Group A wins Round 2 (12B doubling program still works).  
     - **Map to Solomonoff Concepts:**  
       - **Occam’s Razor:** Shorter programs (higher prior) won *until* data falsified them (e.g., Group A in Round 2 if Env picked 31). No "aesthetic principle"—just math.  
       - **Machine-Relativity:** "Shortest" depended on the machine. Doubling was cheap for A; chord-regions for B. Additive constant (≈6-byte gap) was larger than the 1-bit evidence from the 6th term.  
       - **Convergence ≠ Timely:** Solomonoff dominates computable sources *eventually*, but:  
         - Env’s choice (adversarial or random) controls *when* convergence happens.  
         - At 5–6 data points, the reference machine dominates.  
     - **Limitations:**  
       - **What we didn’t stage:** Full Bayesian mixture (we used MAP, not weighted programs).  
       - **What we simplified:** Universal invariance wasn’t shown (no interpreter between machines).  

  ---

  ### Predictable Issues & Fixes
  - **Group A misses doubling:** Some may write constant lists (18B). Fix: Hint "Can you avoid repeating `LOAD`?"  
  - **Group B confused by `CHORD`:** They may not compute \(C(k,2) + C(k,4) + 1\). Fix: Provide term values (k=1→1, k=2→2, ...).  
  - **Env picks non-31/32:** If Env chooses e.g., 100, both groups write long programs (19B+). Use this to discuss "complex environments."  
  - **Time crunch:** Skip Round 2 predictions if behind. Focus on lengths.  

  **Why this sequence?** 1,2,4,8,16 is iconic for simplicity, but the 31/32 fork forces a machine-dependent choice. Chord-regions was chosen for its natural combinatorial interpretation and machine-implementation gap.  

  **Outcome:** Participants leave seeing that "simplicity" is machine-encoded, and small data magnifies reference machine choices. Solomonoff isn’t magic—it’s counting programs.
