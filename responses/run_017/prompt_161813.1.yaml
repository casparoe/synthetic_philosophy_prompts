     But we require the program to match the data exactly. So they are not disqualified in round 1 because they match the first 5. In round 2, they must match the first 6.

     The only thing that changes is the program length and the prediction for the next term.

     We can do without a payoff? Or we can have a payoff that is inversely proportional to the program length? And then in the debrief, we note that the prior probability is proportional to 2^{-length}.

     But to keep it simple, we'll just compare the program lengths and the predictions.

     Timeline:

     Total: 75 minutes.

     0-5 min: Introduction. Explain the task: "We are going to explore how we predict the next number in a sequence. You will be given a machine language and asked to write a program that outputs the given sequence and then predicts the next term. The goal is to write the shortest possible program that matches the given data exactly. The data is the first five terms: 1,2,4,8,16. Your program should output six terms: the first five must be 1,2,4,8,16 and the sixth is your prediction. We will then reveal the true sixth term and do a second round."

     Split into two groups. Hand out index cards with the machine language for their group.

     Group A gets:

          Machine A Instruction Set (each instruction is represented by a byte, and constants in parentheses are one byte):

            LOAD_ACC <c>  : Load the accumulator with the constant c. (2 bytes total: one for the opcode, one for c)
            DBL           : Double the accumulator. (1 byte)
            OUTPUT        : Output the current value in the accumulator and move to the next term. (1 byte)

          Example program that outputs 1, then 2:
            LOAD_ACC 1   -> outputs: (after OUTPUT) 1
            OUTPUT
            DBL          -> now accumulator becomes 2
            OUTPUT

          Total bytes: 2 (LOAD_ACC 1) + 1 (OUTPUT) + 1 (DBL) + 1 (OUTPUT) = 5 bytes.

     Group B gets:

          Machine B Instruction Set:

            CHORD         : Output the current term for the current value of k and then increment k. (1 byte per CHORD)

          Note: k starts at 1 and increments by 1 after each CHORD.

          Example: 
            CHORD   -> outputs 1 (k becomes 2)
            CHORD   -> outputs 2

          Total bytes: 2.

     5-20 min: Round 1. They work in their groups (or individually? we have 14 people, 7 per group). We want each to write a program? Or we can have them work in pairs? But 7 per group: we can have them work individually. They write a program (on index card) and write the sixth term they predict.

     We walk around and help with the machine languages.

     For Group A: we expect they will write the doubling program (12 bytes) and predict 32.

     For Group B: they will write 6 CHORD instructions (6 bytes) and predict 31.

     They turn in the index card with the program (list of instructions) and the sixth term.

     20-25 min: We collect and then we ask a few to share their program length and prediction. We record on the board:

          Group A: 
              Program lengths: likely 12 bytes (if they wrote the doubling program) or maybe some wrote the constant program (18 bytes) if they didn't think of doubling? But we expect 12.
              Prediction: 32

          Group B:
              Program lengths: 6 bytes
              Prediction: 31

     Then we reveal that we have an environment: a participant (chosen secretly at the beginning) who will now choose the sixth term. We ask the environment to choose either 31 or 32. (If they choose something else, we can still proceed, but we encourage 31 or 32.)

     Let's say the environment chooses 31.

     25-30 min: We reveal the sixth term: 31.

     Then we say: "Now we have the sequence: 1,2,4,8,16,31. For round 2, write a program that outputs these six terms exactly and then outputs a seventh term. Minimize the program length."

     30-45 min: Round 2. They write new programs.

          Group A: their doubling program no longer works. They must write a program that outputs the constants: 
              LOAD_ACC 1, OUTPUT, LOAD_ACC 2, OUTPUT, LOAD_ACC 4, OUTPUT, LOAD_ACC 8, OUTPUT, LOAD_ACC 16, OUTPUT, LOAD_ACC 31, OUTPUT, and then for the seventh term, they have to predict. They can choose any number. 
              Length: 6 LOAD_ACC (each 2 bytes) -> 12 bytes, and 7 OUTPUT (each 1 byte) -> 7 bytes. Total: 19 bytes.
              They might find a pattern? But the doubling pattern is broken. They might try to find a new pattern? But it might be longer than 19 bytes.

          Group B: they can write: CHORD repeated 7 times (7 bytes). They predict the chord-regions term for k=7: C(7,4)=35, C(7,2)=21 -> 35+21+1=57.

     They turn in.

     45-50 min: We collect and share program lengths and seventh term predictions.

          Group A: ~19 bytes, prediction? (they might guess arbitrarily, e.g., 62 if they think doubling after 31? but 31*2=62; or they might notice the chord pattern? but they don't have the CHORD instruction)

          Group B: 7 bytes, prediction 57.

     Now we reveal the environment again? But we didn't plan for a seventh term. We can have the environment choose the seventh term? But we don't have time? 

     Alternatively, we can stop at round 2 and not reveal the seventh term. The point is to see the program lengths.

     50-75 min: Debrief.

     What happened:

          Round 1: 
            Group A had short doubling programs (12 bytes) and predicted 32.
            Group B had even shorter chord programs (6 bytes) and predicted 31.

          The environment chose 31.

          Round 2:
            Group A now has to write a long program (19 bytes) because their prior (doubling) was falsified.
            Group B still has a very short program (7 bytes) and they predict 57.

     Discussion:

          Occam's razor: The prior probability is higher for shorter programs. We saw that in round 1, Group B had a shorter program than Group A. And when the data matched their prediction, their prior was confirmed.

          Machine relativity: The reason Group B had a short program for the chord rule and Group A had a short program for doubling is because the machine language matters. The additive constant in the invariance theorem is large enough that at 5 data points, the machine choice dominates.

          Convergence: If the environment continues to follow the chord rule, then Group B will always have a short program (1 byte per term) and Group A will have to use a long program. Eventually, the chord rule will dominate. But if the environment switches to doubling at some point, then Group B will be falsified. The Solomonoff prior converges to the true computable environment in the limit, but the speed depends on the complexity of the environment and the reference machine.

          Also, the environment could be adversarial: if the environment always chooses the number that is predicted by the longer program, then it can force the shorter program to be falsified. But that environment might not be computable? Or it might be computable but complex (because it's looking at the predictions).

     What can't be staged:

          We are not doing the full Bayesian update: we are just taking the shortest program. In Solomonoff, we weight by all programs, not just the shortest. But the shortest dominates the prior.

          We are not showing the mixture over programs.

          We are also not showing the invariance under reference machine (because we are not translating between machines) but we are showing that the reference machine matters for small data.

     What might go wrong:

          Group A might not find the doubling program? They might write the constant program (18 bytes) and then in round 1 they are already longer. Then in round 2, they have to change to 19 bytes? So the effect is still there: Group B is shorter.

          Group B might not understand the CHORD instruction? We explain: "CHORD outputs the next term in the chord-regions sequence: for k=1, it outputs 1; k=2, it outputs 2; k=3, it outputs 4; k=4, it outputs 8; k=5, it outputs 16; k=6, it outputs 31; k=7, it outputs 57." We give them the formula if needed? But we don't want to spoil. We can say: "The CHORD instruction computes the term as: C(k,2) + C(k,4) + 1, where C(n,k) is the binomial coefficient." But they might not know binomial coefficients? We can provide a table for k=1 to 7.

          Alternatively, we avoid the formula and just tell: "For k from 1 to 7: the chord-regions terms are 1,2,4,8,16,31,57." They can use that to verify.

          The environment might choose a number that is neither 31 nor 32? Then both groups have to write long programs. We can then discuss: if the data doesn't match any simple pattern, then the shortest program is just listing the constants.

          We might run out of time: Round 1 and Round 2 might take longer than 20 minutes each? We allocated 15 min for round 1 and 15 min for round 2. We can cut short.

     We commit to the above.

     In summary:

          Sequence: [1,2,4,8,16] -> then sixth term chosen by environment (ideally 31 or 32) -> then seventh term not revealed.

          Machines:

            Machine A (Group A):
              LOAD_ACC <c>  (2 bytes)
              DBL (1 byte)
              OUTPUT (1 byte)

            Machine B (Group B):
              CHORD (1 byte)   [which outputs the next term in the chord sequence and increments k]

          We provide the chord sequence for k=1 to 7: [1,2,4,8,16,31,57] to Group B.

     Debrief outline:

          1. Occam's razor: In round 1, the group with the shortest program had the highest prior. When the data matched, that program became even more dominant in round 2.

          2. Machine relativity: The reference machine matters. Group A found doubling short, Group B found chord-regions short. The additive constant in the invariance theorem is not negligible for small data: the gap between the two hypotheses (doubling vs chord) in different machines was larger than the difference within a machine.

          3. Convergence: We see that after the sixth term, the chord group had a very short program. If the environment continues to generate chord terms, they will always have a short program. But if the environment changes, they might be falsified. The Solomonoff prior converges to the true computable environment, but it might take a long time if the true environment is complex or if the reference machine makes a wrong program short.

          4. Adversarial environment: We saw that the environment, by choosing after seeing the bets, can falsify the short program. But if it does that consistently, it might not be computable by a short program on either machine. So the prior would eventually learn a complex environment, but very slowly.

     We note that the Solomonoff prior is not computable, but it's a theoretical ideal.

     Finally, we ask: "What if we had used the same machine for everyone? Which rule would have been shorter?" In our case, we had two machines. But if we had used a universal machine, then both rules could be implemented, but with different lengths. The invariance theorem says that the difference in code length between the two rules would be bounded by a constant (the length of the interpreter) but that constant is large.

     We emphasize that for small data, the reference machine matters a lot.

     We also note that the prior probability is exponentially sensitive to the program length (2^{-length}), so a difference of 6 bytes (as in round 1: 12 vs 6) is a factor of 2^6=64 in prior odds.

     This exercise illustrates why at 5 data points, the choice of reference machine can dominate the evidence.

     Time check: we have 25 minutes for debrief. We can adjust.

     What if the environment chooses 32? Then in round 2, Group A still has a short program (12 bytes) and Group B must write a long program (19 bytes). The convergence would then favor doubling. So either way, the group whose prior was confirmed wins.

     We are ready.
