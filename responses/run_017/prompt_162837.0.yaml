prompt: |-
  So I'm a software engineer with no philosophy or econ background, and I help run the grants committee for a mid-size open source foundation — we hand out a couple million a year across ~40 grants, and right now the decisions are made by five people arguing over a spreadsheet. A friend who works at a prediction market startup keeps telling us we should just run futarchy on it: the committee votes on what we're supposed to maximize (say, downstream adoption or contributor retention measured 18 months out), then we open conditional markets that trade claims like total adoption conditional on us funding project A versus conditional on us not funding it, and we fund whichever side prices higher. I think I get the basic mechanic, and I get that the standard objections are about manipulation, thin markets, and how you even pick the metric. What I need is an agenda, not an explainer.

  Concretely: we have maybe six months of two people's part-time time and around $50k we could put into market subsidies, and the decision at the end of that is whether to run one live pilot on a handful of grants or drop the whole idea. So which open questions here actually matter for a decision like that, in what order should we take them on, and why that order? I care much more about the reasoning than the list — which questions are upstream of the others (so that getting them wrong quietly poisons everything downstream), which are tractable for two engineers with no econ PhD versus which genuinely need mechanism-design expertise, which are already well trodden versus actually neglected, and for each one, what we would concretely do differently depending on how it came out. Also please say which of the famous philosophical objections basically don't bite at our scale and that we should stop spending time on.

  A few things we've been kicking around that I want you to put into the ranking rather than politely ignore: (1) shadow mode, where we run the markets non-binding alongside our normal process for a year and only escalate to binding if the market's implied forecasts beat the committee's on grants we didn't route through it; (2) locking the metric before any trading starts, plus letting anyone buy a capped dispute bond that forces a pause and a public audit of whether the metric is being gamed; (3) instead of one welfare metric, requiring a proposal to clear a small bundle of them (adoption, contributor retention, maintainer bus factor) with an explicit rule for what counts as clearing; (4) trading on what a future, better-informed version of our own electorate would retrospectively endorse, rather than on an objective index; (5) a liquidity subsidy that decays as volume arrives, and the separate question of who eats the losses when the market turns out to be wrong. Some of these are probably reinvented wheels — if one already has a standard name, just tell me the name and move on, no citations or reading lists, I can't chase papers anyway and I don't want a bibliography. Please defintely rank all five against whatever you think matters more, and don't tell me they're all good ideas.

  Start with a few sentences of prose on what you take the single biggest crux to be and why, then give me a table, one row per question, 8 to 12 rows, ordered by your priority, with exactly these columns: rank | question_or_line_of_work | upstream_of (which other questions or answers depend on this) | tractable_by_us (high/medium/low, plus what it actually takes) | neglectedness (high/medium/low) | decision_it_changes (what we'd do differently given each answer) | evidence_that_would_move_it (what we'd see in a six-month pilot that would move this up or down the list). If any of my five ideas earns a row, mark it with [mine]. Keep everything tied to a foundation our size, not to national governments.
reasoning: |-
  Okay, let me start by really understanding what this user needs. They're a software engineer working with an open-source foundation that distributes grants. Their current process involves five people debating over a spreadsheet, which is subjective and time-consuming. A friend suggested futarchy using prediction markets to make decisions based on market predictions. The user gets the basics but wants a practical agenda to test this approach within their constraints: six months, part-time for two people, $50k budget. They need to decide whether to run a pilot or drop the idea.

  First, I need to identify the core challenge. The biggest crux they face is whether prediction markets can reliably aggregate information better than their committee. If the market doesn't provide better forecasts, the whole idea fails. That's the make-or-break point. Everything else like metric design or manipulation depends on this.

  Looking at their specific ideas: shadow mode, locking metrics, multiple metrics, retrospective endorsement, and liquidity subsidies. Each of these needs to be evaluated for priority. Shadow mode seems crucial because it's low-cost and tests the market's accuracy without risk. If the market doesn't outperform the committee in shadow mode, there's no point proceeding. That should be top priority.

  Next, tractability. The team are engineers without econ backgrounds. Questions about metric definition are something they can handle since they know their domain. But complex mechanism design like subsidy structures might require expert input. Highlighting which tasks they can do vs. where they need help is important.

  Neglectedness is another factor. Some problems like market manipulation are well-studied, so they don't need to reinvent solutions. Others, like multiple welfare metrics in futarchy, are less explored. Focusing on high-neglected areas could provide more value.

  Decision impacts matter too. For example, testing multiple metrics might change how they structure the market. But if they find that one metric is sufficient, it simplifies the process. Each question's answer should directly influence their next steps.

  I should also address their philosophical concerns. At their scale, issues like manipulation might be manageable with small subsidies and trusted participants. Thin markets could be mitigated by starting with shadow mode. The key is to prioritize actionable steps over theoretical debates.

  In the table, ordering the rows by priority. Shadow mode first, then defining the metric, followed by manipulation risks. Their ideas like dispute bonds and multiple metrics fit into these categories. Liquidity subsidies are lower priority since they can be adjusted later.

  Finally, evidence from a pilot. For shadow mode, comparing market forecasts to actual outcomes will show if the market adds value. For metric definition, seeing if the metric correlates with real success. Each row in the table should specify what evidence would move the needle on that question.

  The user needs a clear, step-by-step plan that's practical. Avoiding academic jargon and focusing on what they can test within their constraints. Making sure each step builds on the previous, so if early tests fail, they don't waste time on later steps.
answer: |-
  Here's the agenda, distilled to the core crux and prioritized for your constraints. The single biggest crux: **Can a subsidized prediction market, populated by *your specific community*, consistently generate forecasts about grant outcomes that are *more accurate* than your committee's judgments *and* robust enough to base funding decisions on?** If the market isn't meaningfully better at predicting the outcomes you care about (even in shadow mode), or if it's trivially manipulable by bad actors within your grantee pool, the entire mechanism collapses. Everything else (metric design, dispute bonds, subsidies) optimizes a process that only matters if this core information aggregation works.

  ### Prioritized Agenda Table

  | Rank | Question or Line of Work                                | Upstream Of                                                  | Tractable By Us (What it Takes)                          | Neglectedness | Decision it Changes                                                                 | Evidence That Would Move It (From 6-month Pilot)                                                                 |
  | :--- | :------------------------------------------------------ | :----------------------------------------------------------- | :------------------------------------------------------- | :------------ | :---------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- |
  | 1    | **Core Predictive Accuracy (vs. Status Quo)**           | *Everything* (Metric validity, manipulation risk, mechanism viability) | **High** (Run shadow markets; compare to committee predictions & actuals) | Low (Concept) | Pilot viability. Drop if market adds no value or is systematically worse.           | Quantifiable delta in forecast accuracy (MAE, Brier score) vs. committee on non-routed grants. Direction matters. |
  | 2    | **Metric Definition & Measurability**                   | Market design, dispute bond logic, welfare validity          | **High** (Define clear, objective, auditable proxies for "success". Eng domain knowledge.) | Medium        | Pilot feasibility. Lock metric design or scrap pilot if unresolvable ambiguity.     | Can we define it unambiguously? Can we observe it reliably 18mo later? Does it *feel* right for grant goals?     |
  | 3    | **Manipulation Risk by Grantee Community**              | Market integrity, subsidy design, binding decision safety    | **Medium** (Simulate attacks; analyze trader identities; need basic game theory) | Medium-High   | Binding pilot viability. Need stronger safeguards (bonds, caps) or abandon binding use. | Evidence of unusual trading patterns linked to applicants/grantees. Successful small-scale collusion attempts.   |
  | 4    | **[Mine] Shadow Mode Validation**                       | Decision to go binding, Core Accuracy (Q1)                   | **High** (Run markets non-binding; track predictions vs. outcomes) | Low (Concept) | Escalate to binding pilot? Or refine/abandon?                                         | Clear evidence market outperforms committee (Q1) *and* forecasts are stable/tradable.                            |
  | 5    | **Minimal Viable Market Structure (Liquidity/Stakes)**  | Subsidy cost, manipulation risk, decision reliability        | **Medium** (Test small markets; monitor volume/spreads; needs empirics) | Low           | Required subsidy level & design for binding pilot. Is it practical/cost-effective?   | Subsidy $ needed to achieve tight spreads on plausible stakes. Volume decay patterns. Trader pool size/activity. |
  | 6    | **[Mine] Locked Metric + Dispute Bond Feasibility**     | Market integrity, metric rigidity                            | **Medium** (Design bond mechanism; simulate disputes; legal review?) | Medium        | Include in binding pilot design? Adjust bond cap/audit process?                      | Evidence of *potential* metric gaming during shadow mode. Willingness to stake bonds. Cost/complexity of audits. |
  | 7    | **[Mine] Multi-Metric Clearing Rule Viability**         | Market complexity, subsidy cost, decision clarity            | **Low** (Requires complex market design; expert input likely needed) | High          | Pilot scope. Stick with single metric or abandon multi-metric approach.             | Can we define a simple, non-arbitrary rule? Does it create paradoxes/misaligned incentives? Trader confusion?    |
  | 8    | **[Mine] Retrospective Endorsement Tradability**        | Metric validity, market complexity                           | **Low** (Highly abstract; requires novel market design; expert input) | Very High     | Drop this approach entirely for pilot. Stick to objective metrics.                  | Trader confusion in shadow mode. Lack of liquidity. Evidence it correlates poorly with actual outcomes.          |
  | 9    | **[Mine] Liquidity Subsidy Decay Design**               | Subsidy cost, manipulation risk (Q3)                         | **Medium** (Implement/test decay formulas; monitor impact) | Low           | Fine-tuning for binding pilot. Minor cost/parameter adjustments.                    | Optimal decay curve shape. Impact on sustained liquidity vs. cost. Manipulation attempts under decay (Q3).       |
  | 10   | **"Who Eats Losses?" (Settlement Finality)**            | Trader trust, mechanism legitimacy                           | **High** (Clear rules: Traders eat losses. Foundation pays subsidies.) | Low           | Communication clarity. No change to mechanism – it's fundamental.                    | Trader understanding/compliance. No need for intervention if rules are clear.                                    |

  ### Key Reasoning & Your Ideas in Context

  1.  **Q1 & Q2 Are Foundational (Upstream):** If the market can't predict better than your committee (Q1) *or* you can't define/measure the target (Q2), stop. These are tractable with your skills: Q1 needs data analysis (shadow mode!), Q2 needs domain expertise defining clear OSS success metrics (e.g., "verified unique monthly active users of the *feature* built with this grant").
  2.  **Q3 (Manipulation) is the Critical Risk:** At your scale, participants *are* the grantees/potential grantees. This isn't national security-level manipulation, but collusion among 3-5 key players could distort small markets. Test *this* aggressively in shadow mode. Tractable with vigilance and sims.
  3.  **Your Ideas Ranked & Rationalized:**
      *   **Shadow Mode (Rank 4):** *Essential* low-risk test for Q1/Q2/Q3. Do this *first* before any binding talk. Changes: Go/no-go on binding.
      *   **Locked Metric + Dispute Bond (Rank 6):** Good guardrail *if* Q3 (manipulation) is a real concern *and* Q2 (definition) is solid. Needs practical design (bond size? audit trigger?). Changes: Include in binding design?
      *   **Multi-Metric (Rank 7):** Adds huge complexity, likely intractable without experts. Probably overkill initially. Changes: Drop it for pilot simplicity.
      *   **Retrospective Endorsement (Rank 8):** Intractable abstraction. Avoid. Changes: Drop it.
      *   **Subsidy Decay (Rank 9):** Implementation detail. Easy to test/tweak *after* core viability is shown. Changes: Fine-tuning.
  4.  **Philosophical/Objections That Don't Bite (Yet):**
      *   **"Markets are Amoral/Short-Termist":** You control the metric (e.g., "contributor retention 18mo"). If "retention" is the goal, markets optimizing for it aren't amoral, they're focused.
      *   **"Voter Incompetence on Welfare Metric":** Your committee is already defining "welfare" (what grants aim for). Futarchy just changes *how* you optimize for it. The competence question is identical to your current process.
      *   **"General Equilibrium Effects":** Your grants are small relative to the whole OSS ecosystem. Local effects dominate.
  5.  **Tractable vs. Needing Expertise:** You can handle Q1, Q2, Q4 (shadow), Q10, and basic Q5/Q9 monitoring. Q3 (manipulation analysis), Q6 (bond design), Q7 (multi-metric), and Q8 (endorsement) likely need external mechanism design help *if* you proceed beyond shadow mode and they become critical path.
  6.  **Evidence is King:** The pilot is about generating data for Q1 (accuracy), Q3 (manipulation patterns), and Q5 (liquidity/subsidy cost). Let this data drive the next steps. Don't over-design the *binding* mechanism until shadow mode proves the core concept works *in your context*.

  **Concrete Next Step:** Immediately start designing and running **Shadow Mode (Rank 4)** for the next grant cycle batch. This directly tests Q1 (Accuracy), feeds into Q2 (Metric), reveals Q3 (Manipulation), and informs Q5 (Liquidity) with minimal risk/cost. Use the $50k primarily for subsidies *here*. Let the results of *this* dictate everything else.
