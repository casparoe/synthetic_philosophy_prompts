prompt: |-
  Hey — I'm in a political theory reading group (mostly philosophy grad students plus one econ guy who keeps derailing us) and we've gotten stuck on the Condorcet jury theorem, and it's definately changed how I read the whole epistemic-democracy literature. Here's where I ended up, and I'd like someone to just tell me which of us is wrong.

  My understanding is that the theorem says: if every voter is individually more than 50% likely to get the right answer and the votes are independent, the majority's chance of being right goes to 1 as you add voters. My friend reads that as "always make the group as big as possible." But when I ran the numbers on a toy case I got something weird: three reviewers who are each 90% reliable get the right answer 97.2% of the time by majority; add two more reviewers who are each only 51% reliable and the five-person majority drops to about 92%. So "bigger is better" looks false to me, even though everyone added is still above chance.

  The bigger disagreement is about what "independent" is even doing in there. I built a little model I've been calling the briefing-memo setup: before voting, everyone reads the same one-page memo, which points at the correct answer 80% of the time; each person votes with the memo unless their own private hunch (right 60% of the time, independent across people) says otherwise. Each person then ends up 60% reliable overall — still above chance — and since the hunches are independent, I figured the noise washes out and the majority still converges on the truth, just more slowly. My friend says any shared input like the memo breaks the theorem entirely and the majority gets stuck below certainty no matter how many people you pile on. That seems too strong: surely a memo that is itself right 80% of the time can only help? Relatedly, if independence is really required without qualification, doesn't the theorem end up implying that juries shouldn't deliberate at all, which is nuts? I've spent alot of time on this and can't see who's making the mistake.

  So: who's right, does the memo case converge to 1 or plateau, and if it plateaus, at what number? And does my 97.2 → 92 calculation actually contradict the theorem, or have I misread what the theorem promises? Please lead with the bottom line and keep the whole answer under 300 words, in American English.
reasoning: |-
  Alright, let me tackle this user's problem step by step. They're part of a political theory reading group stuck on the Condorcet jury theorem. The main issues are: whether bigger groups are always better, and how shared information like a memo affects the theorem's assumptions.

  First, the user's example with reviewers. They have three 90%-reliable reviewers achieving 97.2% accuracy. Adding two 51%-reliable reviewers drops the group accuracy to 92%. The theorem assumes homogeneous competence, but here the added members are less competent. So the user's calculation doesn't contradict the theorem—it highlights that adding less competent members can lower group accuracy. The theorem doesn't promise improvement when adding below-average voters.

  Next, the memo scenario. Each voter gets a shared memo (80% accurate) and a private hunch (60% accurate). The user thinks individual competence is 60%, but actually, the shared memo creates dependence. Even though private hunches are independent, the shared memo means votes aren't fully independent. In this case, the majority accuracy plateaus because the memo's influence doesn't diminish with more voters. If the memo is wrong, the whole group could be wrong regardless of size. The plateau level depends on the memo's reliability since it acts as a common signal.

  The user's friend is correct about independence being crucial. Shared inputs like the memo break independence, preventing convergence to certainty. Deliberation might introduce similar dependencies by creating common information. The theorem requires both competence above 50% and strict independence. Without independence, adding more voters doesn't guarantee better outcomes.

  The user's confusion might stem from not fully accounting for dependence in the memo case. Their 97.2% to 92% example is valid but doesn't violate the theorem because it involves heterogeneous competence. The memo case plateaus due to dependence, not heterogeneity. Clarifying these distinctions should resolve their group's debate.
answer: |-
  **Bottom Line:** Your friend is mostly right about the memo breaking convergence; the majority accuracy plateaus below 1. Your 97.2% → 92% example doesn't contradict the theorem, as it violates the homogeneous competence assumption.

  1.  **Your 97.2% → 92% Calculation:** This happens because you added *less competent* voters (51% vs 90%). The standard CJT assumes all voters have identical competence *p* > 0.5. Adding voters below the *current group's average* competence lowers accuracy. The theorem promises convergence only when adding voters *all* above 50% *with the same p*. Your case doesn't break it; it highlights the homogeneity assumption.

  2.  **The Memo Case (Plateaus, doesn't converge to 1):**
      *   Each voter's correctness is **not independent**. The shared memo creates a massive common cause of error. If the memo is wrong (20% of the time), *every* voter starts misled. While private hunches are independent, their 60% reliability is too weak to reliably overcome a misleading memo across a large group.
      *   **Result:** The probability the majority is correct **plateaus** below 1. The limit depends on the memo's strength. Your setup approximates voters being correct *only if* either the memo is right OR the memo is wrong *but* their hunch flips them back (which requires the hunch to be right *and* override the memo). This gives an individual competence *p* = (0.8) + (0.2 * 0.6) = 0.92, but crucially, votes are highly correlated.
      *   **Plateau Level:** As the group size grows infinitely large, the majority accuracy will converge to the probability the memo is correct, which is **80%**. The group essentially just locks onto the memo's recommendation. The independent hunches become irrelevant in large groups because the shared signal dominates.

  3.  **Independence & Deliberation:** The independence assumption *is* strict. Shared evidence (like a memo or deliberation) creates correlation, violating it. The CJT *does* suggest that if voters form independent judgments *before* deliberation, adding voters helps, but deliberation itself introduces correlation. This is a major critique of purely CJT-based epistemic democracy.
