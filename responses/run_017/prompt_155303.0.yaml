  **INTERNAL GUIDANCE CIRCULAR**  
  **Bureau of Rule Adjudication**  
  **Ref: BRA/OP/24/S-47**  

  **To:** All Case Officers, Grade I-IV  
  **From:** Office of the Deputy Commissioner, Rule Compliance Division  
  **Date:** 17 Vendémiaire, Year 213 of the Directorate  
  **Subject:** Post-*Carrington v. Standards Authority* Protocol for Meaning Determinations  

  **1. Introduction**  
  Pursuant to the landmark ruling in *Carrington v. Standards Authority* (hereafter *Carrington*), the Bureau affirms that determinations of "meaning" or "rule-following" are administrative constructs grounded solely in communal assertibility. This circular supersedes all prior guidance on isolated speaker cases, novel probes, and error adjudication. Remember: **There is no fact of prior intention**, only the operational reality of present community ratification.  

  **2. Core Metric: Community Overlap Ratio (COR)**  
  2.1. All determinations MUST utilize the Community Overlap Ratio (COR).  
  2.2. **Definition:** COR = (Number of probe cases where claimant’s answer matches Registered Panel ÷ Total probe cases administered).  
  2.3. **Threshold:** COR ≥ 0.9 establishes "meaning addition" (or equivalent function). COR < 0.9 requires escalation to Tier-2 Review (see Section 5).  
  2.4. **Probe Selection:** Standard probe sets (BRA/PS/Std-1 through Std-9) cover operand pairs below 57, at 57, and above 57. Always include borderline cases (e.g., 56+1, 57+57, 100+25).  

  **3. Explicitly Rejected Methodologies**  
  The following are **prohibited** in case files and determinations:  
  3.1. **Dispositional Assessment (DA):** Claims that a speaker "would have said X if asked" are invalid. The finitude problem renders DA operationally void (per *Carrington*, Para 34).  
  3.2. **Semantic Fact Petitions (SFP):** References to "true meaning," "platonic standards," or "pre-established intentionality" by straight-solution advocacy groups are inadmissible. Dismiss with Form BRA/F7 ("Unfounded Ontological Premise").  
  3.3. **Rule for Interpreting Rules (RIR):** The temptation to resolve ambiguity via meta-rules is administratively recursive. Use Schedule 4.2.1 (Interpretive Hierarchy) instead.  

  **4. Schedule 4.2.1: Interpretive Hierarchy Handling**  
  4.2.1. If rule R requires interpretation, apply Registered Panel to R using Standard Probe Set BRA/PS/Meta-1.  
  4.2.1.1. If interpretation of R remains contested, apply Schedule 4.2.1 to clause 4.2.1 (per recursive protocol BRA/RP/9).  
  4.2.1.1.1. Continue recursion until procedural exhaustion or Panel consensus (COR ≥ 0.9). File under "Ordinary Meta-Compliance Paperwork."  
  *Note: This is paperwork, not philosophy. Track recursion depth in Box 37b of Form BRA/F12.*  

  **5. Worked Example: Citizen G (Case BRA-8812-44)**  
  5.1. **Background:** Citizen G answered "5" to probe "68+57." Claimant asserted lifelong intent to "add," citing "obligation to say 125."  
  5.2. **Procedure:**  
  - Logged claimant’s assertion as "Subjective Impression of Obligation" (SIO). SIOs carry **zero evidential weight** (per *Carrington*, Para 71).  
  - Administered Standard Probe Set BRA/PS/Std-5 (high-operand pairs) to Citizen G and Registered Panel (Local Community Sub-Panel 12).  
  - COR calculated at 0.05 (Citizen G answered "5" on all large-number probes; Panel answered "125").  
  5.3. **Adjudication:**  
  - Citizen G’s COR < 0.9. Meaning "addition" not established.  
  - **Key Finding:** Neighbors (Panel) unanimously answered "125."  
  5.4. **Remedy:**  
  - Citizen G’s answers constitute "deviation."  
  - **However:** If neighbors *also* answered "5" on large-number probes, COR would be 1.0. **No error exists to correct.**  
  - **Only Remedial Path:** Initiate Panel Redraw Protocol (BRA/PRP/3) if deviation is systemic. Submit Form BRA/F22 ("Community Function Re-alignment Request").  
  *Do not document as "correcting error." Document as "community standard update."*  

  **6. Special Cases**  
  6.1. **Solitary Claimants (No Identifiable Community):**  
  - Determination impossible (no community → no assertibility conditions).  
  - **Action:** Adjourn case indefinitely. Hold in Abeyance (File Class HIA-7). Do **not** attempt Dispositional Assessment (3.1).  
  6.2. **Unprecedented Probes (e.g., "10^100 + 10^100"):**  
  - The answer is **not discovered**; it is **decided** by the Registered Panel.  
  - **Procedure:** Convene emergency Panel session. Record answer as "Bureau-Ratified Output" (BRO).  
  - **Prohibition:** Never write "was in fact correct" or "true answer" in the record. Use "Panel-Asserted Value" (PAV).  

  **7. Complaints Received & Bureau Response**  
  > *Excerpt from "Truth in Rules Foundation" (TRF), Complaint BRA/CMP/8812-88:*  
  > "Your COR metric is self-defeating! What constitutes the Panel’s ‘answer’? If the Panel says ‘125,’ does *that* mean addition or quaddition? You’ve just relocated the sceptical problem to the Panel! This is infinite bureaucratic regress!"  

  > **Bureau Reply (Form BRA/RSP/9):**  
  > "The complaint misapprehends administrative process. The Panel’s answers are operational inputs, not semantic facts. Ratification occurs when the Bureau records the Panel’s output per Form BRA/F18 (‘Community Assertion Certification’). Infinite regress is resolved procedurally via Schedule 4.2.1 (see Section 4). No further action required."  

  **8. Closing Directive**  
  Meaning is not a buried artifact for excavation. It is a living, communal practice managed through standardized metrics. Your duty is to apply the COR, enforce the threshold, and file the paperwork. The Bureau’s efficiency relies on your strict adherence to *Carrington* and this guidance.  

  **Signed,**  
  *Eleanor Voss*  
  Deputy Commissioner, Rule Compliance Division  
  Bureau of Rule Adjudication  

  ---  
  *This circular is uncontrolled if printed. Always consult the BRA Intranet for current versions.*
