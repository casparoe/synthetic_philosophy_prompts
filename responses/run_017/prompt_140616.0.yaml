prompt: |-
  I convene a small graduate reading group that sits between comparative economic history and the philosophy of social science, and we have now spent two sessions going in circles on whether the question "why did sustained, energy-intensive industrial growth happen in Britain rather than in Qing China?" is even well posed. Half the group thinks it is a perfectly ordinary explanatory request that happens to be empirically hard; the other half thinks the form itself carries a mistake — that once the contrast class is made explicit, the question either mutates into a different one ("why anywhere?", "why then?", "why first in one place rather than another?") or turns out to be unanswerable in principle rather than for want of evidence. I have decided that we will not settle this with more historiography, so I want a pair of constructed cases to argue over instead.

  Please build me two cases to specification. Assume the usual contrastive account of why-questions: a request for explanation has the form "why P rather than Q?", where Q is the foil, and an adequate answer cites a difference-making factor between the actual case and the foil. I further want you to use the following three-part test for whether such a request is well posed. (1) Common comparison class: the actual case and the foil must be drawn from a class specifiable without reference to which of them won. (2) Non-collapse: the factor that does the explanatory work must not be the very factor that makes the foil a live candidate in the first place; if it is, the contrast is doing no independent work and the question has quietly become a different question. (3) Grain stability: the verdict about what explains P rather than Q must survive small re-descriptions of P and of Q, so that the answer is not an artifact of how finely the relata are individuated. Now design two cases, each about which of two comparable regions or organisations first adopted some new technique or practice, such that in Case A the contrastive question is well posed and genuinely answerable, and in Case B the question, despite looking exactly like the question in Case A, is ill posed. The defect in Case B must be structural and diagnosable by the test above, and it must not be any of the cheap defects: not scarcity of evidence, not chanciness or indeterminism, not chaos or sensitivity to initial conditions, not general scepticism about historical explanation. It must also be invisible from the surface: a reader given only the two narratives, without the test, should be inclined to answer both questions in the same way and should not be able to tell which case is the broken one. Constraints on the cases: realistic macrosocial material, stylised but historically plausible (two textile districts, two river-valley polities, two firms in one industry — your choice), no science fiction and no philosophical apparatus such as demons, perfect predictors or counterfactual oracles, one paragraph each, and the two stories recognisably the same kind of story so that it is the structural difference rather than the subject matter that separates them. One further specification, because otherwise the exercise is too easy: in Case A the difference-maker must be relational rather than intrinsic — a fact about how the two candidates stood to each other, or to a shared environment, rather than a property of the winner that the loser simply lacked.

  After both cases, give me the demonstration that they meet the specification. For each: state the question, name the foil explicitly, and run all three conditions, saying which passes, which fails and why. Then identify the single structural feature that differs between A and B, and show the swap test — that importing that feature into A breaks A, and removing it from B repairs B — so that it is clear the feature and not the storytelling is doing the work. Then tell me how a member of my group who insists that contrastive questions of this shape are always well posed would try to escape: what re-individuation of the relata, or what reformulation of the question, would they propose, and does that manoeuvre actually restore the original question or silently change its subject? Finally, bring it back to the case we started from: on your own account, is "why Britain and not China?" well posed, ill posed, or well posed only after a specific repair? Say exactly what the repair consists in, and say what it costs — what the repaired question can no longer tell us that the original one seemed to promise. Please argue it out rather than pointing me at literature; I have no interest in a reading list here, and I would rather have your reasoning than your sources.
reasoning: |-
  We are constructing two cases: Case A (well-posed contrastive question) and Case B (ill-posed). Both are about the adoption of a new technique in two comparable regions/organizations.

  **Case A: Well-Posed Contrastive Question**

  In the textile districts of Flandria and Boravia, both regions had long-standing traditions of woolen cloth production. In the late 17th century, a new power loom was invented that required both access to coal for steam power and proximity to a major port for importing raw cotton. Flandria had both coal deposits and a major port. Boravia had a major port but no coal, so it continued using traditional looms. The question is: "Why did Flandria adopt the power loom rather than Boravia?"

  **Case B: Ill-Posed Contrastive Question**

  In the river-valley polities of Riveria and Hilland, both were equally advanced in rice cultivation and had similar population densities. A new irrigation technique was developed that required a very specific landscape: a river with a particular gradient and soil type. Riveria had that exact landscape; Hilland did not, as its river was steeper and its soil rocky. The question is: "Why did Riveria adopt the new irrigation technique rather than Hilland?"

  **Demonstration:**

  **Case A: "Why did Flandria adopt the power loom rather than Boravia?"**
  - Foil: Boravia.
  - Condition (1) Common comparison class: Both are textile districts with major ports and a tradition of woolen cloth production. The class is "textile districts with major ports" without reference to adoption.
  - Condition (2) Non-collapse: The difference-maker is Flandria's coal deposits. This is not the factor that makes Boravia a live candidate (which is its port). The port is shared; coal is the differentiator. The question does not collapse because the foil (Boravia) is a candidate due to the port, but the explanation is about coal, which is independent.
  - Condition (3) Grain stability: If we re-describe the adoption as "adopting steam-powered textile technology" or the foil as "another textile district with a port but no coal", the explanation (coal access) remains stable. The answer does not change with small re-descriptions.

  **Case B: "Why did Riveria adopt the new irrigation technique rather than Hilland?"**
  - Foil: Hilland.
  - Condition (1) Common comparison class: Both are river-valley polities with rice cultivation and similar population densities. The class is "river-valley polities with rice cultivation" without reference to adoption.
  - Condition (2) Non-collapse: The difference-maker is the specific landscape (gradient and soil). However, the very factor that makes Riveria adoptable (the landscape) is what defines the technique's feasibility. The foil (Hilland) is a live candidate only because we initially thought it was similar, but the explanatory factor (landscape) is the same factor that makes Riveria the only possible candidate. Thus, the contrast collapses: if we know the technique requires a specific landscape, then only Riveria could have adopted it. The question becomes "why in a place with the required landscape?" and the foil (Hilland) is not a genuine alternative because it lacks the necessary condition. The contrast is doing no work; the question is really "why here and not elsewhere?" but without specifying the class of "elsewhere" that includes only places without the landscape, the foil is not a true alternative.
  - Condition (3) Grain stability: If we re-describe the adoption as "adopting irrigation in a landscape with gradient X and soil Y", then the foil (Hilland) is automatically excluded. The explanation (having that landscape) is trivial and re-description makes the foil not comparable. If we re-describe the foil as "a polity without the required landscape", then the question becomes trivial: "because it had the landscape and the other didn't". The answer is unstable under re-description because the grain of the relata is tied to the explanatory factor.

  **Structural Difference:**

  The key difference is that in Case A, the difference-maker (coal) is a *relational* factor (about how the candidate stands to the environment) that one candidate has and the other lacks, but the environment (port) is shared. The foil is a live candidate independently of the difference-maker. In Case B, the difference-maker (landscape) is *constitutive* of the possibility of adoption. The foil is not a live candidate because the technique is only possible in one landscape. Thus, the foil is not a genuine alternative.

  **Swap Test:**

  - Import Case B's feature into Case A: Suppose the power loom required not just coal and a port, but a port with a specific depth and coal with a specific sulfur content, and only Flandria had that. Then, Boravia (with a port but not the exact type) is not a live candidate. The question becomes ill-posed: the foil is not a real alternative because the technique is only possible in Flandria.
  - Remove Case B's feature: Suppose the irrigation technique does not require a specific landscape but can be adapted to various conditions. Then, if Riveria adopted it and Hilland didn't, we might look for a difference-maker (e.g., Riveria had a more centralized government). Then the question becomes well-posed because the landscape is not the defining factor.

  **Escape Attempt:**

  A member of the group who insists that contrastive questions are always well-posed might try to re-individuate the relata. For Case B, they might say: "We should not compare Riveria and Hilland, but rather Riveria and all other polities that had the potential to adopt (i.e., with the right landscape)." But then the foil becomes an empty set (only Riveria) or a different question: "why here and nowhere else?" which may not be answerable if there are no other such polities. Alternatively, they might broaden the foil: "Why Riveria rather than any other place?" but that changes the contrast class and the question becomes about why it happened in Riveria at all, not why it happened there rather than in Hilland. This maneuver changes the subject: it becomes a different contrastive question.

  **Back to Britain and China:**

  The question "Why did sustained, energy-intensive industrial growth happen in Britain rather than in Qing China?" might be ill-posed if the difference-maker is such that it makes Qing China not a genuine alternative. For instance, if industrial growth required a set of conditions that only Britain had (e.g., a specific combination of institutions, resources, and geography), then China might not be a live candidate. The foil (China) would be included in the contrast class only because we initially thought it was similar, but if the explanatory factors are unique to Britain, then the contrast collapses: the answer becomes "because Britain had X and China didn't", but if X is necessary and only in Britain, then the question is really "why Britain?" and the foil is doing no work.

  **Repair:**

  The question can be repaired by specifying a contrast class in which both Britain and China are genuine alternatives. This might involve broadening the explanation to factors that both possessed to some degree but differed in how they interacted. For instance, we might ask: "Why did Britain, rather than China, experience industrial growth given that both had commercialized economies, skilled artisans, and access to resources?" Then the difference-maker might be relational (e.g., Britain's access to New World resources via colonies, or its fragmented political structure allowing innovation). The repair costs: we lose the stark contrast and must admit that China was a candidate, which might be controversial. The original question seemed to promise an explanation of why one succeeded and the other failed, but if the failure was due to the absence of necessary conditions, the contrastive form is misleading.

  **Conclusion:**

  The original question is ill-posed if the factors that made industrial growth possible were present only in Britain and absent in China. It becomes well-posed only after a repair that establishes a common comparison class where both are viable candidates, and the difference-maker is a relational factor that could have been otherwise. The cost is that we must concede that China was a viable candidate, which might require historical reinterpretation.
answer: |-
  ### Constructed Cases

  **Case A: Well-Posed Contrastive Question**  
  In the early 19th century, the neighboring textile districts of Milltown and Weavertop competed for dominance in cotton production. Both had access to flowing water for power, skilled weavers, and networks to import raw cotton. A new high-efficiency steam-powered loom emerged, requiring coal for fuel and proximity to a navigable river for coal transport. Milltown lay near a river and a coal seam, while Weavertop was near the same river but had no local coal. Milltown adopted the loom; Weavertop did not, sticking to water wheels. The relational difference was that Milltown's coal deposits were accessible via the shared river, lowering transport costs, whereas Weavertop faced prohibitive overland coal-hauling expenses.  

  **Case B: Ill-Posed Contrastive Question**  
  In the same period, the river-valley polities of Lowland and Upland cultivated rice using traditional methods. Both had stable governments, surplus labor, and access to iron tools. A new canal-based irrigation system was developed, requiring a landscape with a specific soil porosity and river gradient to prevent erosion. Lowland had this exact soil-gradient profile; Upland had steeper slopes and porous soil, making the system infeasible. Lowland adopted the system; Upland did not. The relational difference was that Lowland's topography aligned with the system's design constraints, while Upland's did not, given the shared regional climate.  

  ---

  ### Demonstration of Conditions  

  **Case A: "Why did Milltown adopt the steam loom rather than Weavertop?"**  
  - **Foil**: Weavertop.  
  - **Condition (1) Common comparison class**: Both districts are textile producers with water access, skilled labor, and cotton networks. This class ("textile districts with rivers and labor") is specifiable without reference to adoption. **Passes**.  
  - **Condition (2) Non-collapse**: The difference-maker is relational: Milltown's coal was river-accessible, making transport cheap, while Weavertop's lack of local coal forced costly overland haulage. This factor is independent of why Weavertop is a live candidate (its river and labor). The foil doesn't collapse because Weavertop's candidacy rests on shared features (river, labor), not the absent coal. **Passes**.  
  - **Condition (3) Grain stability**: If we re-describe the adoption as "adopting coal-dependent steam tech" or the foil as "a river-textile district without coal access," coal transport costs remain explanatory. If we make the foil "districts without rivers," it becomes a different question. Small re-descriptions (e.g., "steam-powered weaving") preserve the answer. **Passes**.  

  **Case B: "Why did Lowland adopt the canal system rather than Upland?"**  
  - **Foil**: Upland.  
  - **Condition (1) Common comparison class**: Both polities are river-valley rice growers with governance, labor, and tools. This class ("rice-growing polities with valleys and iron tools") is specifiable without adoption. **Passes**.  
  - **Condition (2) Non-collapse**: The difference-maker is relational: Lowland's soil-gradient profile fits the system's erosion constraints, while Upland's does not. But this is the very factor that defines the system's feasibility—it only works where the landscape matches. Upland is a foil only because we initially grouped it with Lowland, but the explanatory factor (landscape) is identical to what makes Lowland the sole viable candidate. The contrast collapses: the question becomes "why where the system is possible?" and Upland isn't a genuine alternative. **Fails**.  
  - **Condition (3) Grain stability**: If we re-describe the adoption as "adopting a system requiring soil X and gradient Y," Upland is excluded by definition. If we re-describe the foil as "a polity without the required landscape," the answer trivializes to "because Lowland had it." The explanation is unstable under re-description: e.g., broadening to "polities attempting irrigation" introduces grain issues (Upland couldn't attempt it). **Fails**.  

  ---

  ### Structural Difference and Swap Test  
  - **Key Difference**: In Case A, the relational factor (coal transport costs) is a *contingent difference* within a shared enabling environment (river access). In Case B, the relational factor (landscape compatibility) is a *necessary condition* for the technique itself—it defines the "adoption space."  
  - **Swap Test**:  
    - **Import Case B's feature into Case A**: Suppose the steam loom required a specific river curvature and coal type only found in Milltown. Then Weavertop's candidacy vanishes—it was never viable. Condition (2) fails: the difference-maker (curvature/coal type) collapses into Milltown's candidacy. The question becomes ill-posed.  
    - **Remove Case B's feature from Case B**: Suppose the canal system was adaptable to varied landscapes (e.g., with terracing). Then Upland's failure could be due to a relational factor like labor mobility or trade routes. Condition (2) passes: the foil remains a live candidate independent of the difference-maker. The question becomes well-posed.  

  ---

  ### Escape Attempt for the Proponent of Always Well-Posed Questions  
  A defender would likely **re-individuate the relata** to salvage Case B. They might redefine the foil as "a region with similar governance and labor but differing topography," then argue the contrast class is "comparable polities where adoption was theoretically possible." But this:  
  - Silently changes the subject: The original foil (Upland) is no longer a specific alternative but a stand-in for "non-adopters." The question mutates into "why did adoption occur where conditions allowed?" which is not contrastive in the same way.  
  - Fails to restore the original: The repaired question ("why Lowland rather than regions with viable alternatives?") excludes Upland entirely, abandoning the intended contrast. It becomes a pseudo-contrast where the foil is abstract, not a concrete case.  

  ---

  ### Verdict on "Why Britain and Not China?"  
  The question is **ill-posed as stated** but **repairable at a cost**.  
  - **Why ill-posed?** It violates Condition (2): If the difference-maker (e.g., Britain's Atlantic trade network or coal-geography nexus) is necessary for industrialization, China becomes a foil only by superficial grouping (both were "advanced pre-modern economies"), not as a genuine alternative. The contrast collapses—China wasn't "in the running" for *this specific growth path*.  
  - **Repair**: Specify a shared comparison class where both are viable candidates, e.g., "why Britain rather than China, given that both had commercialized agriculture, proto-industry, and resource potential?" The difference-maker must then be relational (e.g., Britain's colonial resource extraction vs. China's inward-focused expansion).  
  - **Cost**: The repaired question can no longer explain why industrialization *emerged uniquely* in Britain. It assumes China was a live candidate, which may be anachronistic if the necessary conditions were absent. The original question promised an account of "first-mover" emergence, but the repair reduces it to "differential outcome among peers," losing the historical specificity of the breakthrough.  

  **Reasoning**: The Britain-China question often founders on whether "industrial growth" was ever a possibility for Qing China. If not, the foil is invalid (Condition 2 failure). Repairing it forces a redefinition of industrialization as a general potential, not a concrete historical trajectory—a shift that abandons the original's thrust.
