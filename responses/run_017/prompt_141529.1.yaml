prompt: |-
  I sit on the four-person scientific review panel of the Larkspur Trust's Confirmation Grants — small awards, around £90,000, intended to fund work that puts an existing theory to a test it was not built to pass — and I have to circulate a draft decision memo to the others by Wednesday night for a Thursday vote. We are ranking two proposals, and because the same structure will recur every cycle we also want to settle, in writing, how much credit a theory should get for evidence that was already in hand when the theory was constructed. I have exactly one graduate seminar in philosophy of science behind me and have been re-reading my notes on Bayesian confirmation, so I know enough to recognise that our disagreement is really a formal one — I gather this is what philosophers call the problem of old evidence — and not enough to trust my own answer; I have changed my mind three times since Friday.

  The two proposals: Proposal A comes from a group modelling why some heavily fished populations fail to rebound after fishing stops. They built their model by fitting it to a forty-year survey of a well-known stock that collapsed in the early 1990s and never recovered, and the fit has one striking feature — the same parameter value that reproduces the collapse also reproduces an apparently unrelated change in the age structure of the catch in the decade before it, a connection nobody in the field had drawn. What they want the money for is a genuinely new test: a specific early-warning signature they predict will appear in a different, currently monitored stock about three years before that stock hits its modelled tipping point. Two wrinkles: they have already looked at the first two years of that monitoring series to check data quality, so the prediction is arguably only partly new; and Proposal B, from a separate group, is a model published before the relevant survey data were released, which predicted the qualitative pattern and has now been confirmed, with the money requested to test a sharper second consequence. One panellist, Marisol, says A's fit to the old dataset is worth exactly zero on any Bayesian accounting, because the data were known when the model was built, so its probability was already one and no amount of fitting can raise the theory's probability; on her view we should fund B and nothing else. Another, Dev, says that is a reductio rather than a result — that a formalism which gives forty years of data, including that structural coincidence, no weight whatsoever has stopped describing confirmation — and that old and new are matters of degree anyway, as the data-quality inspection shows. Our chair has floated a compromise she calls the hindsight surcharge: count accommodated evidence, but at half weight. Once you try to write that down, though, it forks, and this is where I get lost: you can temper each piece of accommodated evidence's likelihood ratio separately and then multiply, or you can halve the total shift in log-odds that the whole body of evidence produces, and those two procedures come apart when the collapse pattern and the age-structure coincidence are treated as separate items — they can even disagree about which way the halving bites. A third option on the table is a recording rule Dev likes: before reviewers are shown how the fit came out, they write down how surprising the pattern would have been under the best rival model, and the panel scores the theory using that recorded surprise instead of their post-hoc impression; Marisol's objection is that this measures reviewers' powers of imagination and can be gamed by how a proposal is framed.

  Please draft the decision memo I will circulate: it should recommend, with reasons, which proposal to fund (or how to split the money between them), what convention the panel should adopt in writing for evidence that was already known when a theory was built — including which version of the surcharge, if any, and how to treat partly contaminated predictions — and how the unification of the two regularities in Proposal A should figure in the scoring. Give the strongest argument for whatever option you are not recommending its due rather than setting it up to lose; I want Marisol and Dev both to feel the memo has taken them seriously. Please write it as exactly five numbered items, each one or two sentences long, with no preamble, no heading and no sign-off.
reasoning: |-
  Hmm, the user is a member of a scientific review panel that needs to decide between two proposals for Confirmation Grants. They're struggling with how to evaluate evidence that was known when theories were built - a classic problem in philosophy of science known as "old evidence." They need to draft a decision memo by Wednesday night.

  The core issue is Bayesian confirmation theory: when data was already known (probability 1), it can't increase a theory's probability. But this leads to counterintuitive results - like Proposal A getting zero credit for fitting 40 years of data including an unexpected connection between collapse patterns and age structure changes.

  There are two proposals:
  - Proposal A: Models why some fished populations don't rebound. Built using 40-year dataset (including an unexpected connection between collapse and age structure). Wants to test a new early-warning signal in a different stock. Already checked first 2 years of data.
  - Proposal B: Model published before data release, correctly predicted qualitative pattern. Now wants to test a sharper second consequence.

  Panelists disagree:
  - Marisol (strict Bayesian): Old evidence gets zero credit. Fund B only.
  - Dev: This is absurd - 40 years of data with unexpected connection should count. Old/new is a spectrum.
  - Chair: "Hindsight surcharge" - count accommodated evidence at half weight. But this has two interpretations:
    1. Halve each piece of evidence's likelihood ratio separately
    2. Halve the total log-odds shift
    These disagree when treating collapse and age-structure as separate.

  Also considering Dev's "recording rule": Reviewers write down surprise before seeing fit. Marisol worries this measures imagination and can be gamed.

  The user needs a memo with:
  1. Funding recommendation
  2. Convention for old evidence
  3. How to treat partly contaminated predictions (like A's data peek)
  4. How to score unification in Proposal A
  5. Strongest counterargument to recommendation

  All in 5 numbered items, 1-2 sentences each.

  Key considerations:
  - Proposal A's unification is scientifically valuable - connecting collapse and age structure is novel.
  - Strict Bayesianism (Marisol) ignores scientific practice where model fit matters.
  - Hindsight surcharge is practical but arbitrary.
  - Recording rule has merit but implementation challenges.

  Balancing act:
  - Don't fully reject Bayesianism (respect Marisol)
  - But can't ignore real scientific value of post-hoc fits (respect Dev)
  - Unification deserves credit beyond simple confirmation

  Recommendation: Fund Proposal A. Why?
  - Its novel connection (collapse + age structure) would have been improbable under rivals
  - New test is strong despite partial peek
  - Unification should be valued beyond confirmation metrics

  Convention: Adopt recording rule for future, but for now treat unification in A as "effectively novel" due to lack of prior connection.

  For partial contamination: Discount by fraction of data unseen (here, 1/3 unseen → 2/3 weight).

  Strongest counterargument: Strictly speaking, Bayesianism shows A's fit provides zero confirmation boost, and we risk rewarding curve-fitting.

  This respects both views:
  - Marisol: Acknowledges formal Bayesian point
  - Dev: Values unexpected unification
  - Practical for current decision while establishing better method for future
answer: |-
  1.  Recommend funding Proposal A: its novel unification of the collapse pattern and age-structure shift—though accommodated—reveals an unexpected connection that would have been improbable under prior rival models, and its new test (despite partial data inspection) targets a decisive tipping-point signature in a distinct stock, offering higher transformative potential than Proposal B's second-order test.
  2.  Adopt Dev's recording rule for future cycles: reviewers must document the pre-fit surprise of each pattern under the best rival model, quantifying how anomalous the evidence would have been if not yet accommodated; this avoids arbitrary discounts while respecting that genuine unification (as in A) can signal explanatory depth.
  3.  For partly contaminated predictions like A's data peek, discount only the inspected portion: here, the two years of seen data reduce the test's novelty weight by one-third (since three years were predicted), but the final year remains fully novel.
  4.  Score unification as a distinct epistemic virtue: in A, treat the collapse/age-structure link as a single "explanatory integration" factor in the recording rule, capturing its added value beyond isolated fits; this rewards theories that unify disparate phenomena without conflating it with mere confirmation.
  5.  Strongest counterargument (for Marisol): Strict Bayesianism correctly insists that accommodated evidence cannot increase rational credence, so rewarding A risks incentivizing overfitting known data; B’s pre-registered prediction, even if less ambitious, provides unambiguous confirmation uncontaminated by hindsight bias.
