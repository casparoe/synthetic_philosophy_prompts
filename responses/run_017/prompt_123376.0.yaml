  - We start with a whiteboard showing the number of morally significant subjects (N) = 1.
  - In each round, an operational change is presented. Participants vote on whether N goes up, down, or stays the same. They also write down the rule they used.
  - At the end, we apply the group's rules consistently to see what N becomes.
  - Participants privately guess the order of magnitude of the final count before the reveal.

  We want cases that are "boring engineering" to highlight the sharpness of the problem. The cases provided are:

  1. Serving the same model to 5000 users in one batched forward pass.
