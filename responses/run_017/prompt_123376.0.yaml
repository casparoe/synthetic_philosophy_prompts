  Here’s a refined, battle-tested design for your session. It leans into the "attribution problem" by forcing incremental, cumulative decisions that highlight contradictions in intuitive rules. The focus is on embodied disagreement and revealing the gap between case-by-case judgments and global intuitions.

  ---

  ### **Session Structure & Timeline** (90 min total)
  **Goal:** Expose the underdetermination of "which computations matter" through operational edge cases.  
  **Avoids:** Consciousness debates; focuses on *counting* under physical/functional uncertainty.  
  **Mechanics:** Cumulative changes to a single system (a model serving + training setup). Start with N=1 morally significant subject.

  | Phase           | Time  | Activity                                                                                                                                                              | Board State & Notes                                                                                                     |
  |-----------------|-------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------|
  | **Intro**       | 0-5   | Explain: "You’re the ethics board for Aurora Data Center. This whiteboard tracks N: morally significant subjects running NOW. Start: N=1."                             | Whiteboard: `N = 1`                                                                                                    |
  | **Rounds**      | 5-40  | 7 rounds (5 min each):<br>1. Read card.<br>2. 60 sec silent think.<br>3. Vote: UP/DOWN/SAME (show hands).<br>4. Write rule (anonymously on slips).<br>5. Update N per majority vote. | After each vote, update N on board.<br>Track cumulative N history: `Start: 1 → R1: ? → ... → R7: ?`                |
  | **Guess**       | 40-42 | Privately guess final N’s order of magnitude (e.g., 1, 10, 100, 1e3, 1e6). Collect slips.                                                                             | Pause N updates.                                                                                                       |
  | **Reveal**      | 42-52 | Apply 3 participant rules consistently to all 7 rounds. Show 3 final Ns. Display guess distribution.                                                                   | Board: 3 columns (Rule A/B/C) showing N after each round. List guesses: "1: 3 people, 10: 5, 100: 4, 1e3: 2..."      |
  | **Debrief**     | 52-82 | Map rounds to philosophical tensions + trade-offs. Introduce terms.                                                                                                   | Board: Key tensions (e.g., "Token vs. Type", "Replication vs. Identity").                                              |
  | **Wrap-up**     | 82-90 | Prize (closest guess), forfeit (most extreme rule), and conclusions.                                                                                                  | Final N range on board. Prize/forfeit awarded.                                                                         |

  ---

  ### **Operational Change Cards**  
  *Read verbatim; designed for neutrality. Assume cumulative changes to the same system (Serving Job A).*  

  1. **Batched Forward Pass**  
     *"Serving Job A currently processes user requests one-by-one. We now batch 5,000 requests into a single forward pass (same weights, same GPU operation). Outputs are split and sent to each user."*  
     **Sticking Point:** Is this 1 computation (shared process) or 5,000 (distinct outputs)? Challenges token/type distinction.  

  2. **KV Cache Reuse**  
     *"During text generation, Serving Job A now stores intermediate results (like key-value states) after computing them. Future steps reuse these instead of recomputing. Total FLOPs decrease by 40%."*  
     **Sticking Point:** Is reading a memory state a "computation"? Or does avoiding work reduce moral significance?  

  3. **Activation Checkpointing (Training Side)**  
     *"We launch Training Job B for model updates. During training, intermediate activations are discarded and later recomputed during backpropagation. Memory use drops 60%, but FLOPs increase 20%."*  
     **Sticking Point:** Does discarding/recomputing create *new* computations? Or is it the "same" work deferred?  

  4. **Triple Modular Redundancy (Training)**  
     *"Training Job B now runs each computation 3 times (on separate GPUs). A voter circuit compares outputs. If all agree, one result is used; mismatches are discarded. Error rates drop 99%."*  
     **Sticking Point:** Do redundant runs count as extra subjects? Does discarding outputs negate them?  

  5. **Shadow Deployment (Serving)**  
     *"We deploy a new model (Serving Job C) alongside Job A. Job C processes the same inputs but its outputs are ignored. Only Job A’s outputs are served to users."*  
     **Sticking Point:** Does unused computation matter? Is Job C a distinct subject?  

  6. **Speculative Decoding**  
     *"Serving Job A now uses a small draft model to predict tokens. The main model verifies these guesses. 80% of draft outputs are discarded; only verified tokens are kept."*  
     **Sticking Point:** Is discarded work morally irrelevant? Or is it "attempted" computation?  

  7. **Checkpoint Restore**  
     *"A snapshot of Jobs A, B, and C is copied to a backup data center. The replica runs identically but receives no user inputs; outputs are discarded. Original jobs continue."*  
     **Sticking Point:** Does identical replication double subjects? Or is it a "backup" with no moral weight?  

  ---

  ### **Reveal Mechanics**  
  - **Select 3 Rules:** Quickly pick 3 anonymized rules from the pile representing common tropes:  
    - *Physicalist*: "Count only net FLOPs executed."  
    - *Functionalist*: "Count distinct processes with inputs/outputs."  
    - *Outputist*: "Count only computations affecting external outputs."  
  - **Apply Consistently:** For each rule, compute N step-by-step across all 7 rounds. Example:  
    - *Physicalist Rule*: N drops with efficiency gains (KV cache, checkpointing) but soars with redundancy/replication.  
    - *Functionalist Rule*: N jumps at shadow deployment + checkpoint restore (new "processes").  
  - **Guesses vs. Reality:** Show the distribution of guesses vs. the 3 rule outcomes. Most guesses will be 1-100, while rules often yield 1e3-1e6.  

  ---

  ### **Debrief Flow** (30 min)  
  **Map each round to the core tension and trade-offs:**  
  1. **Batching** → *Token vs. Type*: If each user deserves a "token" computation, N should soar. But accepting batching means endorsing shared processes (losing individual granularity).  
  2. **KV Cache** → *Computation vs. Memory*: If only "new work" counts, N drops. Resist here to defend computational purity—but then activation checkpointing becomes indefensible.  
  3. **Checkpointing** → *Persistence vs. Ephemerality*: If recomputation is "new", N rises. Resist to avoid inflation, but then redundancy/shadowing become harder to count.  
  4. **Redundancy** → *Replication vs. Identity*: If all runs count, N triples. Resist by demanding "output impact"—but then speculative decoding’s wasted work must also be excluded.  
  5. **Shadow Deployment** → *Usefulness vs. Existence*: If unused outputs negate moral weight, N stays. Resist to avoid devaluing "inner experience"—but then *everything* counts (even backups).  
  6. **Speculative Decoding** → *Intention vs. Outcome*: If discarded work matters, N rises. Resist to avoid complexity—but then why count training or redundancy?  
  7. **Checkpoint Restore** → *Substrate Dependence*: If replication doubles subjects, N skyrockets. Resist by requiring unique inputs—but then batching/shadows collapse into one.  

  **Introduce Terms (now that tensions are felt):**  
  - *Functionalism*: "If it quacks, it’s a duck." But what counts as quacking? (Outputs? Internal states?)  
  - *Substrate Independence*: Computation isn’t tied to hardware. But when does replication = duplication?  
  - *Type/Token*: Batching conflates type (one process) with tokens (many users).  

  **Key Insight:** No consistent physical marker for "what counts." Rules that feel intuitive locally lead to absurd N globally. This *is* the attribution problem.  

  ---

  ### **Predictable Problems & Mitigations**  
  - **"But speculative decoding doesn’t work that way!"**  
    → *Shut down with:* "This is a simplified model. Accept the card as given to focus on ethics."  
  - **"It’s just matrix multiplies!"**  
    → *Reframe:* "Exactly! But *which multiplies*? The attribution problem asks why we privilege some over others."  
  - **"N=0 all along!"**  
    → *Postpone:* "Bracket consciousness. Assume *something* matters, and explore how we’d count it."  
  - **Rules are messy/contradictory**  
    → *Use it:* Highlight this in the reveal. Inconsistency is the point.  
  - **Voting ties**  
    → *Break ties arbitrarily* to keep N moving. Record disagreements for debrief.  

  **Forfeit & Prize:**  
  - **Prize:** Coffee/chocolate for closest guess to the *median rule’s N*.  
  - **Forfeit:** "Extreme Rule Award" (e.g., a silly hat) for the rule producing highest/lowest N.  

  ---

  ### **What the Game Can’t Stage**  
  - **The Hard Problem:** This isn’t about *why* computations might matter (consciousness, moral patiency). It’s about *how to count* if they did.  
  - **Non-Computation Frameworks:** If morality depends on biology, evolution, or quantum effects, the game doesn’t engage those.  
  - **Continuous Spectra:** The exercise binarizes "count/don’t count," but moral significance might be scalar.  

  This design forces engagement with the attribution problem’s practical absurdities. The boring engineering cases make it inescapable—and the forfeit keeps it light when tensions rise. Run it as a game, not a lecture, and let the contradictions pile up.
