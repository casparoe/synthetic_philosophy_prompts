prompt: |-
  yo — you're a law professor who teaches statutory interpretation in the fall and writes on philosophy of law the rest of the year (the metaphysics of legal content: what fixes what a text means, whether a hundreds-person legislature can have anything worth calling an intention, that kind of thing). Please think carefully and actually brainstorm the mappings before you commit to an answer — I want the worked-out comparison, and I want to see you try out correspondences and reject some of them, not just announce a bottom line.

  So I'm a staff attorney at a legal aid org and we're deciding whether to back a test case, and I've noticed both sides are arguing from analogies and I can't tell how much weight the analogies are actually carrying. Heads up: the statute below is one I made up for the hypothetical, so please don't try to recall any real case or statute — I want you reasoning about the structure of the problem, not about sources. Also no case citations or reading lists, I'm on a laptop with no westlaw and no wifi and I don't want them anyway.

  The statute (enacted 1971): "No person shall, without the consent of the occupant, install or use in any dwelling any device capable of transmitting a visual image of the interior." A 2003 amendment added "or of recording sound from the interior" after a wave of hidden-microphone cases. In the same session a bill to add "or of detecting by any other means the presence, number, or movement of persons within the interior" passed the senate and died in the house. Nothing since. The 1971 committee report is basically all about peeping toms and landlords hiding cameras in smoke detectors.

  The facts: a landlord installs one battery-powered hub per unit, ceiling mounted, no lens, no microphone. It emits radio pulses, measures how the reflections change, and runs a model that renders on his dashboard a blobby animated silhouette — roughly person-shaped, low-res, a stick-figure-ish outline — showing where a body-mass is in the room and how it moves. It distinguishes one occupant from three and "sleeping" from "pacing." No faces, no identifying features. The landlord uses only an aggregate occupancy score to enforce a lease clause barring unauthorized subtenants; the blob view exists in the app one click away and he swears he's never opened it. The vendor markets the things as camera-free and privacy compliant, and the landlord says he picked them precisely because his own lawyer told him the statute only reaches images.

  In my office, Dana says: look, a statute is like a contract. You get the four corners, the defined terms, and whatever background conventions fix ordinary meaning; you don't go rooting around in one side's deleted emails about what they'd hoped for. "Visual image" in 1971 meant a picture made by light, and whatever this thing renders, no lens ever saw that room. So: no violation, and the 2003 dead bill is irrelevant because it was never agreed to. (She also says the fact that even contract law lets in some extrinsic evidence is exactly like the canons — narrow, disciplined exceptions, not a license.)

  Sam says: a statute is like a note or an instruction someone left you. If my colleague writes "meet me at the bank," I don't ask whether a riverbank satisfies the string, I ask what she was trying to get done. The point of this law was that a landlord shouldn't be watching what tenants do inside their own home; a landlord who swapped a lens for a radio antenna gets closer to the mischief, not further from it, and he gets it in a form tenants can't defeat by closing the curtains. So: violation, and the 2003 near-miss shows the legislature was told about the gap and just never got around to it.

  Here's what I want:

  1. Lay out each analogy's correspondence table explicitly: what plays the role of the parties, the assent, the document, the context, the extrinsic material, breach, the remedy, the person doing the interpreting. Do it for the contract analogy and for the note/instruction analogy separately.
  2. Where does each mapping break? And crucially — separate the disanalogies that matter for the job each analogy is being asked to do here from the ones that are just decoration. I don't care that a contract needs consideration or that a note is short; I do care about whatever actually moves the "visual image" question.
  3. What does each analogy quietly import into the statute that the statute doesn't have? I suspect the contract one smuggles in symmetric parties who could have renegotiated, and that silence allocates risk to the party who never agreed; I suspect the note one smuggles in a single speaker with an actual psychology and a reader who's trying to be helpful rather than adversarial. Tell me if I'm wrong and what else is being smuggled.
  4. Does each conclusion survive once the disanalogies are on the table? Does Dana's no-violation survive, does Sam's violation survive, and is the 2003 dead bill entitled to do the work each side wants from it under their own analogy? Is there an asymmetry — i.e., does one analogy depend on the legislative history question more than the other?
  5. My own candidate, which I can't stress-test: a statute is like an API spec or an interface contract. There's a published text, downstream clients write code against it, silent breaking changes are a serious wrong, and clients are entitled to rely on published behavior; but a spec also has a stated purpose and a test suite, and any decent implementer asks what the endpoint was for before deciding what counts as conforming. Spell out the correspondences (who's the client, who's the maintainer, what's a breaking change, what plays the role of the test suite here) and tell me whether this actually does better than the other two, or whether it's just purposivism in a hoodie and whichever side I want it to favor is whichever side I decide the "clients" are. Does it favor one side once you fill in the table honestly?
  6. If there's a better analogy than all three, name it and say why it beats them. If the honest answer is that no analogy can carry this and something else should — canons, the text's own structure, notice and fair-warning considerations, whatever — say that plainly and tell me what should be doing the work instead.

  sorry for the wall of text, but I keep flip-flopping on this and I need to see which parts of my own reasoning are load-bearing. definately don't just tell me what you'd hold — I want to know what's carrying it.
reasoning: |-
  Okay, let me tackle this step by step. The user is a legal aid attorney deciding whether to back a test case involving a surveillance statute. Both sides are using analogies—contract vs. instruction—to interpret "visual image." The user wants a deep analysis of these analogies, their strengths/weaknesses, and alternatives. 

  First, I need to unpack Dana's contract analogy. She argues statutes are like contracts: focus on text, not intent. The mapping would be: legislature and citizens as parties, statute as contract, legislative history as extrinsic evidence. But the disanalogies jump out—statutes aren't negotiated bilaterally, citizens don't "assent," and legislative silence doesn't allocate risk like contractual silence. This analogy smuggles in assumptions of equal bargaining power, which is unrealistic for tenants vs. landlords. The 2003 dead bill? Under contract logic, it's irrelevant—like rejected draft terms. Dana's "no violation" conclusion holds if you accept the analogy, but cracks when you notice tenants couldn't negotiate the statute's "silence."

  Sam's instruction analogy is different: statute as a note from a colleague. Here, the legislature is the writer, enforcers are the reader, and purpose trumps literal text. The mapping: "visual image" isn't just about light—it's about preventing surveillance. The disanalogy? Legislatures aren't single minds; they're coalitions with competing intents. The 2003 bill becomes key—it shows awareness of the gap, so the "instruction" was meant to cover all spying. But this smuggles in a unified "speaker" intent that doesn't exist. Sam's violation conclusion relies heavily on that fictional unity. The dead bill matters more here—it's like a follow-up email clarifying the original request.

  Now the user's API spec analogy. Interesting! Statute as interface: legislature maintains the spec, citizens implement against it. "Visual image" is a method name; its behavior must match the docs (text) but also the purpose (test suite). Breaking changes—like unexpected surveillance—violate the spec. But who are the "clients"? Tenants (vulnerable users) or landlords (relying on text)? This analogy avoids bilateral negotiation myths but still struggles with whose reliance matters. The 2003 bill? Like an unreleased patch—shows maintainers knew about a bug but didn't fix it yet. Does it favor either side? Honestly, it depends whether you prioritize backward compatibility (landlord's view) or the spec's intent (tenant's safety). It's better than the others but still not neutral.

  Is there a better analogy? Maybe... but analogies always leak. Instead, I should focus on statutory interpretation tools. Text first: "visual image" in 1971 meant optical images. But the statute's structure—banning transmission, not just recording—hints at real-time intrusion. Purpose: the committee report targets privacy invasions, and tech evolves. The 2003 bill? Not law, but shows legislative awareness—supports avoiding absurd results (landlords circumventing with new tech). Fair warning? Landlords had notice cameras were banned; radio waves might be a gray zone, but the vendor's "privacy compliant" claim smells self-serving.

  Ultimately, no analogy is perfect. The API spec comes closest by balancing text and purpose, but the core issue is statutory evolution. Tenants deserve protection from surveillance creep—that's the statute's spirit. The 2003 dead bill isn't law, but it confirms the gap. I'd back the case: the blob-view violates the purpose, even if the text is fuzzy.
answer: |-
  Here's a systematic breakdown of your analogies, their mappings, strengths, weaknesses, and alternatives – with strict attention to the structural role each analogy plays in resolving the "visual image" question:

  ### 1. Contract Analogy (Dana)  
  **Correspondence Table:**  
  | Contract Element         | Statutory Element              | Role in "Visual Image" Dispute       |  
  |--------------------------|--------------------------------|--------------------------------------|  
  | Parties (symmetric)      | Legislature ↔ Citizens         | Assumes landlords/tenants are equal parties to the "bargain" |  
  | Mutual Assent            | Enactment via bicameralism/presentment | Text is the "meeting of minds" |  
  | Four Corners Rule        | Plain meaning of enacted text  | "Visual image" must be optical; tech without lens excluded |  
  | Defined Terms            | Statutory definitions          | 1971 meaning governs ("light-based pictures") |  
  | Background Conventions   | Ordinary meaning at enactment | 1971 tech context (cameras, peeping toms) |  
  | Extrinsic Evidence       | Legislative history            | Committee report admissible only for ambiguity (not here) |  
  | Breach                   | Violation of statute           | Landlord adheres to literal text |  
  | Remedy                   | Penalty/enforcement            | N/A for interpretation |  
  | Interpreter              | Judge as neutral arbiter       | Resolves ambiguity against drafter (pro-tenant canon) |  

  **Disanalogies That Matter:**  
  - **Asymmetric Power:** Citizens don't "assent" like contracting parties; they’re bound unilaterally. Breaks the *quid pro quo* foundation.  
  - **Silence ≠ Risk Allocation:** Contractual silence implies risk on party who could have bargained. Statutory silence doesn’t imply legislative intent to *permit* conduct.  
  - **Purpose vs. Precision:** Contracts prioritize predictability; statutes aim for purpose-driven regulation. Ignoring purpose here excludes non-optical surveillance the drafters couldn’t conceive of.  

  **Smuggled Assumptions:**  
  - That the legislature and citizen are symmetric parties who could have "negotiated" the meaning of "visual image" in 1971 (false).  
  - That textual silence = permission (favors landlord). Ignores fair warning for *tenants* about novel intrusions.  

  **Conclusion Survival:**  
  - **"No violation" holds** only if you accept that statutory text is a closed system like a contract.  
  - **2003 Bill:** Utterly irrelevant under contract analogy – like a rejected counteroffer. Dead bills aren’t "extrinsic evidence" in contracts.  
  - **Asymmetry:** Contract analogy *depends less* on legislative history – it actively rejects the 2003 bill.  

  ---

  ### 2. Instruction Analogy (Sam)  
  **Correspondence Table:**  
  | Instruction Element    | Statutory Element              | Role in "Visual Image" Dispute     |  
  |------------------------|--------------------------------|------------------------------------|  
  | Author                 | Legislature                    | Assumes unified "speaker" intent   |  
  | Reader/Recipient       | Enforcer/citizen               | Interpreter seeks author's goal    |  
  | Text                   | Statute language               | Starting point but not decisive    |  
  | Context/Purpose        | Mischief addressed             | Core concern: tenant privacy invasion |  
  | Ambiguity Resolution   | "What was she trying to do?"   | Landlord avoids lens but achieves same "watching" |  
  | Extrinsic Clues        | Legislative history            | Committee report & 2003 bill show mischief scope |  
  | Compliance Failure     | Violation                      | Landlord circumvents spirit of rule |  
  | Interpreter            | Trusted agent executing intent | Judge as legislature's helper      |  

  **Disanalogies That Matter:**  
  - **Collective Intent Myth:** Legislatures lack a singular "purpose"; they’re coalitions with competing motives. "Preventing surveillance" may not be the *only* purpose (e.g., avoiding overbreadth).  
  - **Adversarial Context:** Unlike a colleague’s note, statutes are interpreted in court by *opposing parties*, not cooperative agents.  
  - **Democratic Legitimacy:** Focusing on intent risks judicial override of enacted text.  

  **Smuggled Assumptions:**  
  - A single, coherent legislative "mind" (false – 1971 legislature may have *only* cared about cameras).  
  - That the interpreter (judge) is a neutral "helper" rather than a policymaker. Favors tenant protection.  

  **Conclusion Survival:**  
  - **Violation holds** if you accept the legislature’s "purpose" was broad privacy protection.  
  - **2003 Bill:** Critical evidence – like the author saying "I meant all surveillance!" after sending the note.  
  - **Asymmetry:** Instruction analogy *depends entirely* on extrinsic purpose – 2003 bill is central.  

  ---

  ### 3. API Spec Analogy (Your Candidate)  
  **Correspondence Table:**  
  | API Element           | Statutory Element              | Role in "Visual Image" Dispute        |  
  |-----------------------|--------------------------------|---------------------------------------|  
  | Specification Text    | Enacted statute                | "Visual image" is a method signature  |  
  | Maintainer            | Legislature                    | Authority to amend/interpret          |  
  | Client Implementers   | Citizens (landlords)           | Rely on published spec for compliance  |  
  | Test Suite/Behavior   | Purpose + real-world effects   | Does the tech violate privacy as cameras would? |  
  | Breaking Change       | Unforeseen expansion of meaning | Extending "visual image" to radio waves? |  
  | Documentation         | Legislative history            | Committee report = "docs" for intended use |  
  | Deprecation Warning   | Failed amendments (2003 bill)  | Signal of planned future change        |  
  | Interpreter           | Developer/Judge                | Balances text compliance with spec intent |  

  **Analysis:**  
  - **Strengths:**  
    - Acknowledges *reliance interests* (landlord as "client" coding against the spec).  
    - Incorporates *purpose* via "test suite" (does the blob-view "break" tenant privacy?).  
    - Handles *technological change* better: specs evolve, but silent changes harm clients.  
  - **Weaknesses:**  
    - **Who is the Client?** Landlords rely on text; tenants rely on purpose. Favors whichever "client" you prioritize.  
    - **Breaking Change:** If "visual image" meant optics in 1971, radio waves *are* a breaking change – unless the spec’s "test" (privacy harm) fails otherwise.  
    - **2003 Bill:** Like an unreleased patch note – signals maintainer awareness but isn’t binding.  
  - **Verdict:**  
    - **Better than contract** (admits purpose via "test suite"). **Better than instruction** (respects published interface).  
    - **Neutral?** If "clients" are *all* citizens (landlords + tenants), it balances reliance and purpose. Landlord’s reliance on text is strong, but if the "test suite" (privacy harm) is identical, the *spirit* of the spec is violated.  
    - **Favors:** Leans toward Sam’s violation *if* the privacy harm is equivalent. The blob-view "hacks around" the interface while achieving the same output (surveillance).  

  ---

  ### 4. Best Analogy / Alternative  
  **Winner: No Analogy – Use Statutory Interpretation Tools Directly**  
  Analogies all leak because:  
  - Contracts assume reciprocity; instructions assume singular intent; APIs assume technical users.  
  - **What actually resolves "visual image":**  
    1. **Text & Ordinary Meaning:** "Visual" in 1971 implied optics. Strongest for landlord.  
    2. **Purpose:** Committee report shows focus on *intrusive surveillance* – not just light-based tech.  
    3. **Context/Structure:** 2003 amendment added sound recording. Shows legislature expanding to *non-visual* intrusions. Dead bill signals awareness of broader gap.  
    4. **Fair Warning:** Landlord’s reliance on literal text is reasonable, but tenants’ expectation of *no surveillance* is equally legitimate.  
    5. **Canon:** *Expressio unius* – listing images/sound implies exclusion of other sensors? Or *noscitur a sociis* – "visual image" is part of a category (sensory intrusions)?  

  **The 2003 Dead Bill’s Role (Objectively):**  
  - Not law, but relevant to show:  
    - Legislature knew of technological gaps.  
    - Senate (half the body) endorsed broad coverage.  
  - Weakens landlord’s "reliance on plain text" – he was on notice of ambiguity.  

  ---

  ### Bottom Line for Your Case  
  - **Dana’s "no violation"** is defensible on text/reliance grounds but risks absurdity (landlords using thermal scopes, lidar).  
  - **Sam’s "violation"** is defensible on purpose/evasion grounds but risks judicial overreach.  
  - **Your API Analogy** improves on both but still forces a choice: prioritize landlord’s reliance or tenant’s privacy.  
  - **How to Decide:**  
    - The statute’s **structure** (amending to add sound) shows it targets *sensory invasions*, not just cameras.  
    - The blob-view is functionally identical to a low-res camera – it transmits real-time occupancy/movement.  
    - **Back the case:** The legislature’s failure to act *after 2003* doesn’t change the 1971 purpose’s applicability to novel tech achieving the same mischief.  

  **What’s Load-Bearing:**  
  - **For Dana:** Literal text + fair warning to landlord.  
  - **For Sam:** Purpose + legislative awareness of gap.  
  - **For Statute:** The *evolving nature of the mischief* (privacy invasion) matters more than the fixed meaning of 1971 tech terms.  
  **Recommendation:** Argue that "visual image" includes *any rendered depiction of interior activity* – its function, not its physics.
