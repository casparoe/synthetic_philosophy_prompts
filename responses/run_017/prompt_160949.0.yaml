  Okay, the user is in a reading group discussing Everettian quantum mechanics and probability. They're unconvinced by another member's argument that uses analogies to justify probability in many-worlds. The user wants an audit of these analogies.

  First, I need to map the duplication analogy: Sleeper = pre-measurement observer, Successors = branch descendants, Coin = measurement outcome, Number of copies = branch count (but this is problematic), Waking up = measurement resolution. The river analogy adds channel width = branch weight (squared amplitude).

  The key disanalogies:
  - Definite branch count vs quantum indeterminacy: In duplication there are exactly two symmetric successors, but quantum branching lacks this definiteness. Branch decomposition is basis-dependent and vague.
  - Weight justification problem: The river analogy assumes width determines probability but doesn't explain why. It might beg the question by just restating the conclusion.
  - Persisting self assumption: Both analogies imply a "you" that persists through branching, but unitary QM may not support this.
  - Practical difference question: If all branches exist, why care which one "you" experience? The analogies quietly rely on caring about self-location.

  These disanalogies seem serious. The branch count issue undermines the symmetry argument from duplication, and the river analogy doesn't provide independent justification for weights - it just illustrates them. The self-persistence assumption might not hold in QM.

  The conclusion probably doesn't survive these problems. The analogies are doing the heavy lifting rather than deriving probability from physics. Better approaches might include decision-theoretic arguments (David Deutsch/David Wallace), or treating weights as primitive. But these have their own challenges.

  For the user who wants to know what fixes the weights without assuming them, the honest answer might be that no analogy suffices. The strongest arguments come from decision theory or long-run frequency considerations, but these remain contentious in the field.
answer: |-
  Here's an audit of the analogies used to defend Everettian probability, structured to address your concerns. I'll map the correspondence, analyze disanalogies (separating critical from cosmetic), assess the conclusion's viability, and outline alternatives.

  ### Correspondence Table
  | **Duplication/River Analogy** | **Everettian QM Role** |
  |-------------------------------|------------------------|
  | Sleeper before duplication | Pre-measurement observer |
  | Successors after duplication | Post-branching descendant observers |
  | "Heads"/"Tails" announcement | Measurement outcomes (e.g., spin up/down) |
  | Number of copies (in duplication) | Branch count (problematic—see disanalogy 1) |
  | Channel widths (in river) | Branch weights (squared amplitudes) |
  | Moment of waking | Decoherence/measurement resolution |

  ### Disanalogies: Critical vs. Cosmetic
  **Critical Disanalogies** (undermine her argument's core):  
  1. **Definite Branch Count vs. Quantum Indeterminacy**  
     - **Her Analogy:** Duplication produces a definite, symmetric set of successors (e.g., 2 copies). Probability arises from ignorance about *which* successor "you" become.  
     - **QM Reality:** Branch count isn't intrinsic. The universal wavefunction decomposes into branches only relative to a choice of basis (e.g., pointer states). Branch number is:  
       - Basis-dependent (e.g., Schrödinger's cat basis vs. atomic excitation basis).  
       - Vague (fuzzy decoherence).  
       - Continuous in many cases (no discrete "slots" for credence).  
     - **Why it matters:** Her analogy assumes a fixed set of equiprobable candidates, but QM lacks this. If branches aren't countable or symmetric, symmetry arguments for equal credence fail. **This is fatal to the duplication half of her argument.**  

  2. **Unjustified Weighting in River Analogy**  
     - **Her Analogy:** River water flows disproportionately into wider channels; "more of you" goes to high-weight branches. Credence should track this "amount."  
     - **Problem:** This doesn't *justify* why credence *should* follow weight—it *presupposes* it. Key questions:  
       - Why is "amount of self" tied to amplitude? Unitary dynamics only evolves the state; it doesn't define a "fraction of identity."  
       - If all successors are equally "you" (per duplication analogy), why expect *this* successor's experience to correlate with branch weight?  
     - **Why it matters:** The river analogy is circular. It visualizes the Born rule as a conclusion but provides no independent reason to accept it. **This undermines the river half.**  

  3. **Presupposed Persisting Self**  
     - **Her Analogy:** Implies a "you" that persists through branching, with uncertainty about "which body you wake up in."  
     - **QM Reality:** Unitary dynamics doesn't require a substantive, persisting self. Everettian "branching" is just state decomposition—no physics tracks "which successor is *really* you."  
     - **Why it matters:** Her argument leans on first-person uncertainty ("which successor am I?"). But if there's no fact about identity, this uncertainty is illusory. **This invalidates the self-location framework she relies on.**  

  **Cosmetic Disanalogies** (don't directly impact her probability claim):  
  - **Artificial vs. Physical:** Duplication uses sci-fi tech (scanners, rooms), while branching is natural via decoherence.  
  - **Discrete vs. Continuous:** Duplication is discrete; branching can be continuous (e.g., momentum measurements).  
  - **Hydraulic Metaphor:** Water is classical; amplitudes are complex numbers.  

  ### Restatement of Your Worries
  - **First Worry (Branch Count):** Correctly identified. The analogy smuggles in definite, symmetric branches—precisely what QM lacks.  
  - **Second Worry (Weight Justification):** Spot-on. The river analogy asserts—not derives—that weight should govern credence.  
  - **Third Worry (Persisting Self):** Accurate. The "self" is imported, not derived from dynamics.  
  - **Fourth Worry (Practical Difference):** This is pivotal:  
    - If all branches exist equally, "which one you turn out to be" only matters if *subjective experience* is branch-relative.  
    - Her argument implicitly assumes that *your* future experience is indexed to one branch (hence uncertainty).  
    - But unitary QM alone doesn't ground this indexicality—it's added by fiat.  

  ### Does Her Conclusion Survive?
  **No.** The disanalogies are fatal to her claim that "nothing distinctively quantum" is happening and that no derivation of the Born rule is needed:  
  - **Fatal Flaws:**  
    1. **Branch Indeterminacy** undermines the duplication analogy's symmetry argument.  
    2. **Unjustified Weighting** makes the river analogy question-begging.  
    3. **Self-Persistence Assumption** lacks foundation in unitary dynamics.  
  - **Result:** The analogies *stipulate* the Born rule (via "number of copies" or "channel width") while *pretending* to derive it from intuitive scenarios. They don't resolve the core problem: **why rational credence should mirror squared amplitudes when branches aren't countable or symmetric.**  

  ### Remaining Options for Everettians
  If analogies fail, proponents must derive the Born rule from within Everett. Here are the main strategies, ranked by viability (per current debate):  

  1. **Decision-Theoretic Arguments (Deutsch-Wallace)**  
     - **Goal:** Show that rational agents *must* use squared amplitudes in bets to avoid sure losses.  
     - **Mechanics:** Use quantum games (e.g., quantum roulette) + decision theory axioms (e.g., consistency across branches).  
     - **Strengths:** Purely operational; no added metaphysics.  
     - **Weaknesses:** Assumes agents care about future branches *proportionally to weight* (sneaks in the conclusion?).  

  2. **Long-Run Frequency Arguments (Everett, Graham)**  
     - **Goal:** Show that in the multiverse, most (weighted) observers see frequencies matching Born rule.  
     - **Mechanics:** Use the typicality of high-weight branches in repeated measurements.  
     - **Strengths:** Connects to empirical data.  
     - **Weaknesses:** "Typicality" is weight-dependent—circular if weights aren't already privileged.  

  3. **Additivity Constraints (Zurek, Carroll)**  
     - **Goal:** Derive Born rule from symmetries of the wavefunction (e.g., envariance).  
     - **Mechanics:** Show that probabilities for composite systems must multiply if subsystems are independent.  
     - **Strengths:** Formal and basis-independent.  
     - **Weaknesses:** Still assumes probabilities exist; doesn't fully avoid circularity.  

  4. **Postulate the Rule (The "Shut Up and Calculate" Escape)**  
     - **Admit:** Born rule is a primitive feature of quantum reality.  
     - **Weakness:** Abandons the claim that Everett "recovers" probability.  

  ### Ranking Disanalogies from Fatal to Cosmetic
  1. **Branch Indeterminacy** (Fatal) → Undercuts symmetry.  
  2. **Unjustified Weighting** (Fatal) → Circular.  
  3. **Persisting Self Assumption** (Severe) → Unphysical.  
  4. **Practical Difference Ambiguity** (Moderate) → Needs independent justification.  

  ### The Honest Answer & What Would Move You
  - **Better Analogy?** None. Personal fission/river analogies are seductive but misleading. **No analogy can substitute for a derivation** because the problem is uniquely quantum: unitary dynamics lacks intrinsic probabilities.  
  - **What Fixes Weights Without Assuming Them?** The strongest candidate is **decision theory** (e.g., Deutsch-Wallace). It argues:  
    - Rationality constraints (e.g., consistency across branches) *force* agents to bet *as if* branches have Born-rule probabilities.  
    - Weights aren't "probabilities" but *emerge* as the unique quantities that rational agents must use.  
    - **Weakness:** It assumes agents value all future branches (indexically) and that branching doesn't alter rationality norms. Critics say it "cheats" by building in the answer.  

  ### Bottom Line
  Her analogies fail because they borrow classical probability structures (definite outcomes, countable successors, persisting selves) that Everettian QM denies. The duplication case provides symmetry where none exists; the river metaphor assumes Born-rule weighting without justification. To move you, an argument must show *why* rational agents should weight their expectations by squared amplitude—and **decision theory is the only approach that tries rigorously**. If even that feels circular, the "honest" view may be that Everettians must treat the Born rule as fundamental (contradicting her "no distinctively quantum" claim).  

  For your group: Focus on Wallace's *"Quantum Probability from Subjective Likelihood"* (2007) for the decision-theoretic case—it confronts the "no probabilities in kinematics" problem head-on.
