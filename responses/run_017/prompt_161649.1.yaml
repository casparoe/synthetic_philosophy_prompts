answer: |-
  Your framework is sharp and self-critical—exactly the right approach for testing whether cultural evolution is *genuinely* Darwinian. Let's break down potential defeaters, rank them by severity, and address your worries about tautology and alternative models. I’ll also revisit the Weismann test.

  ---

  ### **Fatal Defeaters (Undermine Core Premise)**
  1. **"Selection" as Tautology** (Your First Worry)  
     - **The Threat**: If "variants spread because they spread" (e.g., defining fitness *post hoc*), selection explains nothing. This reduces Darwinism to a redescription.  
     - **Fatal If**: Population-level selection adds no *predictive* power beyond guided variation. For example, if all cultural change is driven by individual learning plus prestige bias (e.g., "copy elites"), selection is redundant.  
     - **Defender's Response**: Distinguish *selection* (variants differ in fitness) from *bias* (variants copied for non-functional reasons). Only if functional traits (e.g., efficient tools) outcompete maladaptive ones *despite* biases (e.g., prestige) does selection "earn its keep."  

  2. **Neutral Drift + Population Size Explains "Cumulative" Culture**  
     - **The Threat**: Models like Henrich's *Drift Threshold Model* show that purely neutral copying + large populations can preserve complex traits (e.g., kayak designs) without selection. If complexity arises from statistical inevitability, not adaptive winnowing, Darwinism isn't needed.  
     - **Fatal If**: Key examples (e.g., Inuit tools, Polynesian navigation) show no functional variation—variants are equally fit, and complexity correlates with population size, not environmental challenges.  
     - **Defender's Concession**: Some cases *are* neutral. But cumulative culture often shows adaptive peaks (e.g., optimized thermometers in 19th-century labs). Selection is essential when variants *differ* in functionality (e.g., QWERTY vs. Dvorak keyboards).  

  ---

  ### **Serious Awkwardness (Force Major Revisions)**
  3. **Prestige/Conformity Bias Overrides Functional Advantage**  
     - **The Threat**: If people copy high-status individuals or majority norms *regardless* of functionality (e.g., inefficient rituals preserved), selection is swamped by transmission bias.  
     - **Example**: Medieval medical practices persisted despite ineffectiveness because physicians were prestigious.  
     - **Defender's Response**: Concede this weakens selection *in those domains* but argue barriers (e.g., blueprints) limit bias. Still, prestige often corrupts the "barrier" (e.g., altering recipes to fit trends).  

  4. **Convergent Innovation Undermines Selection's Role**  
     - **The Threat**: If the same solution emerges independently (e.g., bow-and-arrow designs in isolated groups), cumulative culture may reflect shared cognitive biases + environmental constraints, not inter-group selection.  
     - **Your Worry**: This moves you most—and rightly. If guided variation reconstructs solutions reliably, population-level selection is otiose.  
     - **Defender's Concession**: Independent innovation *is* guided variation. But cumulative leaps (e.g., semiconductor tech) require building on prior *specific* know-how—selection preserves intermediates that no individual could reinvent.  

  ---

  ### **Minor Awkwardness (Manageable with Refinements)**
  5. **The "Barrier" is Porous or Context-Dependent**  
     - E.g., oral traditions mutate with each retelling; digital recipes allow version history.  
     - **Defender's Response**: Admit the barrier is probabilistic, not absolute. Darwinian dynamics still dominate when fidelity is high *enough* (e.g., recorded music vs. folk tales).  

  6. **Guided Variation and Selection Interact**  
     - Most cultural change blends individual learning (guided variation) and copying (selection). Isolating "pure" selection is artificial.  
     - **Defender's Response**: This doesn’t refute Darwinism—it shows dual inheritance. Selection still operates on heritable variation, even if guided variation generates novelty.  

  ---

  ### **Is the Weismann Test Flawed? Yes—But Salvageable**  
  - **The Problem**: Weismann's barrier (germline/soma separation) is specific to genetics. Culture lacks a clean germline—transmission is often behavioral and permeable.  
  - **Better Criterion: The Darwinian Triad**  
    A system is Darwinian if:  
    **(1) Variation**: Heritable differences exist (e.g., recipe variants).  
    **(2) Differential Fitness**: Variants differ in "cultural fitness" (e.g., tastier recipes spread faster).  
    **(3) Heredity**: Traits are transmitted with sufficient fidelity for lineages to persist.  
  - **Why This Works**:  
    - It captures population-level selection without demanding physical barriers.  
    - It allows "leaks" (improvements passed on) but still requires heredity (e.g., copying the *improved* recipe).  
    - It accommodates your "patchy" view: Domains with high fidelity (e.g., digital code) satisfy the triad; oral traditions may not.  

  ---

  ### **Conclusion: Where the Machinery Earns Its Keep**  
  - **Fatal Risks**: If neutral drift or prestige bias explains key cases *better than selection*, or if "selection" is circular, the view collapses.  
  - **Strongest Evidence for Darwinism**:  
    - **Adaptive radiation** in cultural lineages (e.g., divergence of programming languages for niches).  
    - **Maladaptive persistence** (e.g., inefficient traditions outlasting better alternatives due to cultural inertia).  
  - **Your Weismann Test Revised**: Replace "barrier" with **high-fidelity inheritance + selective winnowing**. Focus on whether population-level dynamics *add explanatory power* beyond individual learning.  

  Your framework is robust if it can pinpoint domains where:  
  - Variants *compete* (not just drift),  
  - Functional differences drive spread (not just bias),  
  - Lineages *accumulate* complexity requiring generational winnowing.  

  If you can show that—e.g., in technology or institutional evolution—Darwinian machinery is indispensable.
