prompt: |-
  hey — I'm in a third year epistemology seminar and I've got to present a case of my own design on thursday. We did the bank cases, then pragmatic encroachment, and the thing people keep saying in discussion is that pragmatic encroachment explains all the same data anyway so why bother with contextualism. I want to push back on that by showing the two views genuinely make different predictions, so what I need is a matched pair of little scenarios that double-dissociate them.

  Rough spec:

  Two scenarios, one paragraph each, same setting for both so they're properly matched (a hospital lab, an airport ops room, a restaurant kitchen, whatever — just not a bank, and nothing skeptical, no lotteries, no fake barns, nobody saying "you might be wrong" for no reason).

  Case 1 — contextualism moves, pragmatic encroachment doesn't. Same subject, same proposition, same evidence, same reliability of the method, and crucially the same practical stakes for the subject throughout. The only thing that varies is the context of the person making the knowledge claim. Contextualism (the bank-case, DeRose/Lewis sort of view where the standard for "knows" shifts with what's properly ignored or what's at stake for the attributor) should end up saying one attribution is true and the other false; pragmatic encroachment (Stanley / Fantl & McGrath style — whether S knows depends on how much is riding on it for S, invariant across attributors) should give the same verdict both times. Constraint: the context shift has to be earned, not a bare mention. Someone just raising a wild possibility or going "are you sure?" doesn't count — I want the standards to go up because of something a contextualist is actually committed to treating as relevant (a real, documented failure mode of the method, or the attributor acquiring a genuine need to rely on the claim, that kind of thing).

  Case 2 — pragmatic encroachment moves, contextualism doesn't. Now hold the attributor's context completely fixed (same conversation, same salience, same purposes) and vary only what's at stake for the subject. Same proposition, same evidence, same reliability. PE should flip and contextualism shouldn't. Constraint, and this is the bit I keep getting wrong when I try it myself: the stakes shift can't be visible from inside the attributor's context — nobody mentions it, nothing about how anyone is talking changes, the attributor has no reason to suspect it. Otherwise contextualism flips as well and I've just rewritten the bank case. The version I had in mind was stakes that get raised by something the subject didn't create and maybe doesn't even know about — a supervisor quietly deciding to lean on her say-so, a rule that changed overnight, something ambient — but if that only works given a contested reading of PE (objective vs. subjective stakes, whether the subject has to be in a position to act), say so and tell me which reading you'd need.

  Then for each case:
  - lay out the proposition, the evidence and the method, whose stakes are what and who knows about them, and which features of the attributor's context are supposed to be doing the work;
  - actually run the mechanics for each theory rather than just announcing the verdict, because I need to be able to defend it when people push back;
  - name the single variable doing the work, and say what happens to the case if I delete it — does it just collapse back into the bank cases;
  - and give me the best thing the side that comes out badly can say. For case 1 that's presumably the contextualist going "yes, the standards moved, and that's the right answer, that's the whole point"; for case 2 maybe someone arguing the subject's evidence wasn't really held fixed after all.

  Last thing: be honest if both halves can't be built. If there's a structural reason you can't get contextualism to move without the subject's stakes moving too, or the other way round, tell me which half you'd drop and why — I'd much rather present one case that survives discussion than two that fall apart in it.
reasoning: |-
  Okay, let me tackle this epistemology problem. The user needs two scenarios that cleanly separate contextualism from pragmatic encroachment - a double dissociation. 

  First I need to understand the core challenge: contextualism says knowledge attributions depend on the attributor's context (what's salient, what's at stake for them), while pragmatic encroachment says knowledge depends on the subject's practical stakes. The bank cases blend these factors, so I need to decouple them.

  For Case 1 (contextualism moves, PE doesn't):
  - Must keep subject's stakes fixed while varying attributor's context
  - Attributor's standards must shift for legitimate contextualist reasons (not just arbitrary skepticism)
  - Idea: Hospital lab setting where two technicians discuss a test result
  - Technician A (low-stakes attributor) accepts "knows" attribution
  - Technician B (high-stakes attributor) rejects it because they'll use the info for critical surgery
  - PE shouldn't move because subject's stakes never change

  For Case 2 (PE moves, contextualism doesn't):
  - Trickier! Must keep attributor context fixed while varying subject's hidden stakes
  - Subject's stakes must change without affecting attributor's awareness or conversation
  - Idea: Restaurant kitchen where chef confirms ingredient freshness
  - Hidden factor: Unbeknownst to anyone, the ingredient now affects a VIP with allergies
  - PE should flip because subject's stakes increased objectively
  - Contextualism shouldn't move because attributor sees no reason to raise standards

  Key pitfalls to avoid:
  - In Case 2, if stakes change is visible, contextualism moves too
  - Must ensure evidence/reliability stays constant
  - Need clear documentation of failure modes for Case 1
  - For Case 2, must specify it's objective stakes version of PE

  Potential weaknesses:
  - Some contextualists might say Technician B's surgical use doesn't properly raise standards
  - Some PE theorists might reject objective stakes
  - But both positions have defenders, so it should work for seminar discussion

  Final check:
  - Both cases use non-bank settings
  - No skepticism/lotteries
  - Stakes changes are "earned"
  - Mechanics show step-by-step reasoning
  - Fallback positions identified

  This should give the user what they need - two scenarios that force the theories apart in different directions.
answer: |-
  Here's a matched pair designed to achieve the double dissociation you need. Both cases are set in an **airport baggage handling control room** to ensure matching background conditions. I'll explain the mechanics carefully and flag potential objections.

  ---

  ### **Case 1: Contextualism Moves, Pragmatic Encrapment Doesn't**  
  **Scenario**:  
  *In the control room, Technician Ava monitors RFID scans showing baggage routed correctly to Flight 107 (a routine domestic flight). Her colleague Ben asks, "Does bag #AX3B go to 107?" Ava checks her screen: the scan log shows it passed through the correct routing node (Node 17) 45 seconds ago. The system has a 99.9% accuracy rate, with errors only occurring if a bag is physically mis-sorted *and* the scan fails—a documented but rare failure mode (1 in 10,000 bags). Ben is confirming for a passenger inquiry (low stakes). Unbeknownst to Ava, Supervisor Clara is eavesdropping. Clara *must* confirm this bag’s routing because Flight 107 is secretly carrying a time-sensitive transplant organ, and a misroute would be catastrophic. Clara interjects: "Ava, do you actually *know* bag #AX3B is on 107? What if the scan glitched?"*  

  - **Proposition**: *Bag #AX3B is routed to Flight 107.*  
  - **Evidence & Method**: RFID scan log showing passage through Node 17 (correct routing point), 99.9% reliable system, documented rare scan failures.  
  - **Stakes**:  
    - **Subject (Ava)**: Low stakes throughout (routine query).  
    - **Attributors**:  
      - Ben (low stakes: passenger inquiry).  
      - Clara (high stakes: organ transport, undisclosed to Ava).  
  - **Contextual Shift Trigger**: Clara’s high-stakes reliance + explicit mention of a *documented* error possibility (scan glitch).  

  **Mechanics**:  
  - **Contextualism (DeRose/Lewis)**:  
    - Ben’s context: Error possibilities (scan glitches) are properly ignored—stakes are normal. **Verdict: "Ava knows" is TRUE.**  
    - Clara’s context: Stakes are extreme (life-or-death), so documented error possibilities (scan failures) become salient and *cannot* be ignored. **Verdict: "Ava knows" is FALSE** (standards raised).  
  - **Pragmatic Encroachment (Stanley/Fantl-McGrath)**:  
    - Ava’s practical stakes are *identical* in both attributions (low). Her ability to act on the belief (e.g., answer Ben) is unchanged. **Verdict: "Ava knows" is TRUE in both contexts.**  

  **Key Variable**: Attributor’s stakes/salience structure (Clara’s undisclosed high stakes + raising a *realistic* error possibility).  
  **If Removed**: Without Clara’s stakes/mention of scan glitches, collapses into a low-stakes bank case.  
  **Best Defense for PE**: "Ava’s evidence *is* sufficient for knowledge—Clara’s anxiety doesn’t change that. If Ava’s stakes were high, *then* she wouldn’t know."  

  ---

  ### **Case 2: Pragmatic Encroachment Moves, Contextualism Doesn’t**  
  **Scenario**:  
  *Technician Liam monitors RFID scans for Flight 208 (a routine cargo flight). His colleague Mia asks, "Is crate #5J8N on 208?" Liam checks his screen: the scan log shows it passed Node 12 (correct for 208) 2 minutes ago. The system is 99.9% reliable. Mia needs this for inventory paperwork (low stakes). Unbeknownst to *everyone*, airport security quietly flagged crate #5J8N this morning as containing hazardous materials. A misrouted crate risks a chemical leak. Liam and Mia are unaware; their conversation is casual. Mia asks, "So, do you know it’s on 208?" Liam says, "Yes, it scanned at Node 12."*  

  - **Proposition**: *Crate #5J8N is routed to Flight 208.*  
  - **Evidence & Method**: Identical to Case 1 (scan log, same reliability).  
  - **Stakes**:  
    - **Subject (Liam)**: **Objectively high stakes** (hazardous materials risk), but Liam is *ignorant* of this.  
    - **Attributor (Mia)**: Low stakes (paperwork), unaware of hazards, no salient error possibilities.  
  - **PE Stakes Trigger**: Objective, action-relevant stakes for Liam (even if unknown to him).  

  **Mechanics**:  
  - **Pragmatic Encroachment (Stanley/Fantl-McGrath, *objective stakes* version)**:  
    - Liam’s *actual* practical environment is high-stakes (misrouting = disaster). His evidence (99.9% reliable) is insufficient for acting in *this* environment. **Verdict: "Liam knows" is FALSE.**  
    - If stakes were low (no hazard), same evidence **would suffice**. PE flips.  
  - **Contextualism (DeRose/Lewis)**:  
    - Mia’s context dominates: Low stakes, no salient error possibilities raised, nothing to ignore. **Verdict: "Liam knows" is TRUE** (standards remain low).  

  **Key Variable**: Subject’s objective practical stakes (hidden hazard), unknown to all in the conversation.  
  **If Removed**: Without the hazard, it’s a standard low-stakes knowledge attribution.  
  **Best Defense for Contextualism**: "Liam *does* know—the hazard changes nothing because it’s epistemically irrelevant. If Mia *knew* about it, *then* standards might rise, but she doesn’t."  

  ---

  ### **Why This Works & Caveats**  
  1. **Double Dissociation Achieved**:  
     - Case 1: Contextualism flips (TRUE→FALSE), PE stable (TRUE→TRUE).  
     - Case 2: PE flips (TRUE→FALSE), Contextualism stable (TRUE→TRUE).  

  2. **Stakes Handling**:  
     - Case 1 avoids "bare mention": Scan glitches are *documented* failures (contextualist-relevant).  
     - Case 2 uses **objective stakes** for PE. This is defensible (Stanley 2005 argues knowledge depends on *actual* practical facts, not just subjective awareness). If your seminar rejects objective PE, use **subjective stakes with hidden awareness**: Suppose Liam *suspects* (but hasn’t confirmed) the crate *might* be hazardous, raising his personal stakes. This still isolates PE, as Mia’s context remains unchanged.  

  3. **No Collapse into Bank Cases**:  
     - Case 1: Attributor’s stakes shift *without* subject involvement.  
     - Case 2: Subject’s stakes shift *invisibly* to the attributor.  

  4. **Where Objections Might Arise**:  
     - **Case 1**: A contextualist might argue Clara’s stakes *don’t* properly raise standards ("Her role as supervisor doesn’t make scan errors relevant!"). **Rebuttal**: Contextualism *requires* this—if attributor’s reliance/salience doesn’t matter, it’s not contextualism.  
     - **Case 2**: Critics may say Liam’s evidence *is* weaker objectively ("Hazards make misroutes more likely!"). **Rebuttal**: Specify the hazard doesn’t affect scan reliability (e.g., hazard is unrelated to routing errors).  

  ---

  ### **If Forced to Drop One, Keep Case 2**  
  - **Why**: Case 1 is more vulnerable to "contextualists wouldn’t *actually* shift standards here" debates. Case 2’s objective-PE move is cleaner and harder to dismiss.  
  - **Structural Limit**: Pure contextualism *cannot* respond to *hidden* subject-stakes shifts—by design, it’s attribution-context-dependent. PE *cannot* respond to attributor-stakes shifts—by design, it’s subject-stakes-dependent.  

  Both cases should survive seminar scrutiny if you emphasize the *documented error modes* (Case 1) and *epistemically inert stakes* (Case 2). Present them back-to-back to highlight the dissociation. Good luck!
