prompt: |-
  Had a long argument with a friend last night about the units of selection, and I realised halfway through that we werent actually disagreeing about the same question, so what I want now is the spec, not another position paper. He's gene's-eye all the way: genes are the only things copied faithfully generation after generation, organisms and colonies are just vehicles that get rebuilt each time, so genes are the units, end of story. I kept saying that can't be the whole story, partly because of traits that look individually costly and collectively beneficial (reproductive restraint in a group that would otherwise crash), and partly because it feels to me like the phrase is doing three different jobs at once: which thing has heritable variation in fitness, which thing's fitness differences actually explain why the trait spread, and which thing the trait is apparently designed to benefit.

  So write me the desiderata any theory of the units of selection has to meet, with the case behind each one. Purpose clause: I want a theory good enough to tell a working biologist which level to look at and what to measure, not just a metaphysical verdict. Things I want on the list, at minimum: it has to say which of those three jobs it's answering, or give a principled link between them; it has to handle individually costly / collectively beneficial traits, and say what would settle whether the group is really a unit rather than just redescribing the case; it has to handle a gene that sabotages the gametes carrying its rival and spreads while making its bearer less fertile, without letting the fact that genes are what gets transmitted do all the work; it has to be non-vacuous, since you can always recast a gene-frequency change as a group-level change and always partition the covariance across levels, it needs to say what makes level L is a unit here a claim that could be false; it has to handle the two ways of defining a collective's fitness (the average of its members' fitness versus the collective's own reproduction, like a colony fissioning or a nest founding a new one) and say whether the verdict can flip depending on which you use; it has to say what counts as heritable variation at the collective level without just stipulating that groups aren't faithful enough; it can't collapse the level selection acts at into the level the trait is for (byproduct cases); and it has to say something about the boundary cases, eusocial colonies and hosts with obligate symbionts, and about what evidence for a level would look like that isn't just inferring the level back from the outcome.

  Then flag the pair of desiderata you suspect can't be jointly satisfied (my hunch is the non-vacuity requirement and the one about colony fissioning pull against each other), tell me which single requirement knocks out the most popular positions, and give me a quick scorecard for the gene's-eye view, multi-level selection in the Price-equation style, and the pluralist it's different questions, pick your level line. No citations, I'll fill those in myself.
reasoning: |-
  Hmm, the user had a heated debate with a friend about units of selection and realized they were talking past each other. They want a clear specification of what a theory of units of selection must accomplish, not just another argument. Their friend is a strict gene's-eye view advocate, while they feel this misses important nuances like costly traits that benefit groups. They listed several specific requirements for a robust theory.

  The user identifies three distinct jobs the term "units of selection" might be doing: (1) identifying what has heritable variation in fitness, (2) explaining why traits spread, and (3) determining what benefits from the trait. They want a theory that clarifies which job it addresses or connects them coherently.

  Key challenges they raise include: handling costly individual/beneficial group traits, gene sabotage cases, avoiding vacuity (since you can always redescribe selection at different levels), defining group fitness (average member fitness vs. collective reproduction), establishing heritable variation at group level, distinguishing selection level from trait purpose, and dealing with boundary cases like eusocial colonies. They also want practical guidance for biologists.

  They suspect tension between non-vacuity and colony fissioning cases, and want to know which requirement disqualifies popular positions. They request evaluation of gene's-eye view, multi-level selection, and pluralist approaches.

  I need to distill their requirements into clear desiderata with justifications. For each, I'll explain why it's necessary based on biological examples they mentioned. Then I'll analyze tensions between desiderata, identify which requirement is most challenging for mainstream views, and score the three approaches against the full spec.

  The core tension seems to be between mechanistic fidelity (genes as replicators) and explanatory completeness (higher-level effects). Their example of colony fissioning vs. non-vacuity highlights how defining fitness operationally can make levels arbitrary unless anchored to something concrete like information retention across generations.
answer: |-
  Here's the specification for a theory of units of selection meeting your requirements, structured around core desiderata with their justifications:

  ### Core Desiderata for a Theory of Units of Selection

  1.  **Explicit Scope Declaration:** *Must clearly state which of the three conceptual jobs ("heritable variation in fitness", "explanation for trait spread", "apparent beneficiary") it primarily addresses, OR provide a rigorous framework linking them.*
      *   **Case:** The core confusion in your argument stemmed from conflating these distinct questions. A biologist needs to know *which* question the theory answers to apply it correctly (e.g., is the "unit" the replicator, the interactor, or the beneficiary?).

  2.  **Costly Cooperation/Group Benefit Resolution:** *Must provide a non-circular operational criterion for distinguishing genuine group-level selection (where the group is a unit) from mere group-level effects arising from individual selection.*
      *   **Case:** Traits like reproductive restraint or cooperative defense are individually costly but group-beneficial. The theory must specify what evidence (beyond the existence of the trait) shows selection is acting *on the group as a whole* (e.g., measured group fitness differences correlated with group heritable traits), not just that groups with more cooperators do better (which can be kin selection).

  3.  **Gene Sabotage Neutralization:** *Must explain the spread of "selfish" genes (e.g., gamete killer alleles) without *solely* relying on the argument that genes are the fundamental replicators.*
      *   **Case:** While genes *are* replicated, the spread of a gamete-killer allele demonstrably *reduces* the organism's fitness (fertility). A unit theory must explain this spread at the relevant level of interaction (e.g., competition *within* the organism/genome) without letting the replicator status pre-empt the explanation of the trait's dynamics.

  4.  **Non-Vacuity Requirement:** *Must provide criteria such that the claim "Level L is a unit of selection for trait T" is empirically falsifiable and cannot be trivially true by redescription.*
      *   **Case:** Price's equation allows partitioning covariance across any arbitrary levels. The theory needs criteria (e.g., requirement for *heritable* variation specifically *at* level L, coupled with a fitness definition intrinsic to L) that prevent *any* level from always being a "unit" for *any* trait change via mere statistical decomposition. It must be possible for "group selection" to be a *false* explanation for a given trait.

  5.  **Collective Fitness Definitional Clarity:** *Must explicitly define "fitness" for collectives and acknowledge that the verdict on whether the collective is a unit *can* depend on which definition is used (e.g., average member fitness vs. collective reproduction rate).*
      *   **Case:** Consider a bee colony. Does its "fitness" mean the average worker's reproductive output (low) or the colony's rate of producing new queens/swarms (high)? A trait like worker sterility looks maladaptive under the first definition but adaptive under the second. The theory must handle this ambiguity and state which definition it employs and why.

  6.  **Heritable Variation at Level L:** *Must define "heritable variation" at the collective level (L) without presupposing collectives are intrinsically less faithful than genes. It must specify what constitutes "inheritance" sufficient for selection at L.*
      *   **Case:** Dismissing group selection solely because groups don't replicate "faithfully enough" compared to genes is question-begging. The theory needs a level-appropriate definition: e.g., for groups, is it the stability of group-level properties (composition, structure) across "generations" (fissions, foundings) sufficient to generate a response to selection *on the group*?

  7.  **Level Distinction (Selection vs. Benefit):** *Must prevent collapsing the level *at which selection acts* (the interactor) with the level that *benefits* (the beneficiary). Must handle byproduct effects.*
      *   **Case:** A gene causing thick fur (adaptive for the organism in the cold) also benefits lice living on the organism. The lice benefit is a byproduct of individual organismic selection. The theory must not misidentify lice (the beneficiary) as the unit of selection *for* thick fur.

  8.  **Boundary Case Handling:** *Must provide principled criteria applicable to ambiguous cases like eusocial insect colonies (superorganism vs. group of individuals?) and obligate symbiont/host systems (single unit or two?).*
      *   **Case:** Is a termite colony with sterile workers one unit or many? Is a lichen (fungus + alga) one unit or two? The theory needs criteria (e.g., integration of reproduction, alignment of fitness interests, heritability of the combined state) to guide classification, not just rely on intuition.

  9.  **Evidential Specificity:** *Must specify what empirical evidence, observable *prior* to knowing the full evolutionary outcome, supports the claim that level L is a unit for trait T.*
      *   **Case:** Evidence cannot be solely "the trait exists and benefits L". It should include measurable criteria like: covariance between L-level trait variation and L-level fitness variation, heritability of relevant L-level traits, and crucially, evidence that selection acting *directly* on L is a significant cause, not just an effect of lower-level selection (linking to Desiderata 2 & 4).

  ### Flagged Tension: Non-Vacuity (4) vs. Collective Fitness Definition (5)
  *   **Conflict:** Defining collective fitness via collective reproduction (e.g., swarm rate) strongly supports non-vacuity for colony-level selection in eusocial insects. However, defining it via average member fitness often leads to vacuously partitioning the same evolutionary change to the individual level using Price. Insisting on the latter definition for "consistency" can make group selection *seem* vacuous, while insisting on the former can seem arbitrary. Reconciling a non-vacuous definition *of fitness itself* across levels is tricky and potentially circular if fitness definitions are level-specific.

  ### Requirement Knocking Out Popular Positions: Non-Vacuity (4)
  *   **Why:** Naive versions of "group selection" often fail this by presenting group-beneficial traits or group-level statistical partitions as *sufficient* evidence, ignoring whether the groups actually function as coherent interactors with heritable variation *at that level*. Conversely, extreme gene's-eye views sometimes dismiss higher levels *a priori* based on replicator fidelity, violating Desiderata 6. Price-partitioning itself is vacuous without additional criteria defining what makes a level "real" for selection.

  ### Quick Scorecard

  1.  **Gene's-Eye View (Replicator Focus):**
      *   **Strengths:** Excels at Desiderata 1 (Explicit: Replicator/heritable variation), 3 (Gene Sabotage), partially 4 (Non-Vacuity - genes are clear units) & 7 (Benefit often ≠ Selection level).
      *   **Weaknesses:** Fails Desiderata 2 (Costly Cooperation - often dismisses/reinterprets group benefit), 5 (Ignores ambiguity of collective fitness), 6 (Stipulates gene-level fidelity), 8 (Struggles with superorganisms/symbiosis as units), 9 (Evidence focuses solely on gene transmission). Fails to provide practical level-finding tools for biologists studying groups.

  2.  **Multi-Level Selection (Price Equation/Interactor Focus):**
      *   **Strengths:** Directly addresses Desiderata 2 (Costly Cooperation via partitioning), 5 (Can accommodate different fitness definitions), 8 (Can model colonies/symbiosis), 9 (Provides statistical measures - covariance components).
      *   **Weaknesses:** Critically vulnerable on Desiderata 4 (Non-Vacuity - partitioning always possible), struggles with 1 (Scope: Often conflates statistical partitioning with causal explanation), ambiguous on 6 (Heritability at level L often assumed), risks violating 7 (Level of partitioning can be conflated with beneficiary). Can become a calculation tool without clear biological meaning regarding "units".

  3.  **Pluralist "Different Questions, Pick Your Level":**
      *   **Strengths:** Excels at Desiderata 1 (Explicitly separates the questions).
      *   **Weaknesses:** Fails Desiderata 4 (Non-Vacuity - all levels can be "answers" vacuously), 2 (Provides no principled criterion to "pick" the level for costly cooperation), 5 (Ambiguity remains unresolved), 6/8/9 (Offers little concrete guidance on defining levels, fitness, inheritance, or evidence). Provides little practical guidance ("look where you want") for the working biologist seeking the *causal* explanation.

  This spec provides the framework. Now you can evaluate specific theories (e.g., Dawkins' replicator view, Wilson/DS Wilson's group selection, Godfrey-Smith's Darwinian Populations, Okasha's multilevel framework) against these criteria. The tension between non-vacuity and collective fitness definition is a key philosophical/operational hurdle.
