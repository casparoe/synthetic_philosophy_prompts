  You are a philosopher who works on rational choice and decision theory and who also reads machine learning papers closely — I want someone who can move between the two vocabularies without cheating in either direction. Think this through carefully before writing: begin with a short pass in which you list the separate ingredients of superrationality that will each need their own translation (the notion of rationality doing the work, the sameness relation between agents, the counterfactual being evaluated, the fixed-point character of the recommended action, and the role of the payoffs), flag any place where my framing below bakes in an assumption the literature would not accept, and only then do the translation itself.

  Context on me: I am a research engineer; my daily work is multi-agent reinforcement learning and self-play, plus structural causal models and do-calculus for estimating the effects of interventions from logged data. I am fluent in that vocabulary — policies and parameters, parameter sharing, shared random seeds and common random numbers, ε-greedy exploration, best response and regret, correlated equilibrium and incentive compatibility, distributional shift and adversarial opponents, SCMs, the do-operator, backdoor paths, latent confounders, counterfactuals — and I would rather you use it precisely than soften it. In philosophy I am close to a beginner: I know the one-box/two-box fight over Newcomb's problem is a thing, and I have absorbed Hofstadter's superrationality from blog posts rather than from the source. The argument I am trying to settle started at our lab retreat last month, where we ran an anonymous one-shot Prisoner's Dilemma for real money among thirty people; twenty-six defected, the four cooperators were annoyed, and one labmate has been insisting in Slack ever since that the superrational answer was obviously to cooperate and that the rest of us simply failed to reason correctly. I suspect that is the original mistake restated in more words, but I cannot say exactly where it goes wrong, which is why I am asking you.

  The job: restate the case for superrationality — that in a one-shot Prisoner's Dilemma between sufficiently similar rational agents one should cooperate, because in choosing one is somehow choosing for both — in my vocabulary, as faithfully and as unsympathetically as you can, and then give me the residue report. In particular, settle this in my terms: which node is the superrationalist intervening on? My read is that the standard decision-theoretic argument translates cleanly — my action and my twin's action have no causal path between them, so intervening on my action severs the correlation and defection comes out ahead. The superrationalist looks to be intervening on something else: not on this agent's action but on the output of the program both agents are instances of, or on what an agent like me does. I want to know whether that is an intervention my framework can even express, or whether the variable is not in any causal graph over physical events at all. Related: I think mutual cooperation in a strict one-shot Prisoner's Dilemma is not even a correlated equilibrium, since defection is strictly dominant conditional on any signal; so whatever superrationality selects, it is not a solution concept I have. Tell me what it does select — a fixed point of some other operator, something like requiring the policy to be a fixed point of its own output rather than a best response to itself? — and whether the nearest things I have to a model of that (a self-referential program whose output is defined in terms of its own output; self-play with shared parameters, where my update changes my opponent) capture it, or quietly smuggle in a causal channel the original argument does not have.

  Then the case I actually care about, which I do not think the usual presentations cover. Call it the divergent-checkpoint dilemma: you and your opponent are two replicas of the same trained policy checkpoint, and before the game your twin receives k additional gradient steps of fine-tuning on a private minibatch you cannot see, though you know the architecture, the optimizer, the learning rate, and the loss; payoffs are 3 for mutual cooperation, 1 for mutual defection, 5 for exploiting a cooperator, 0 for being exploited. Three questions. (i) Superrationality appears to turn on how similar the two programs are, so what exactly is the similarity metric, and does the recommendation vary continuously with k or flip at a threshold — and if it flips, where, and on what principled basis rather than by taste? (ii) I can in principle simulate the k steps if I can enumerate the plausible minibatches, but my compute budget may or may not allow it: is the superrational verdict supposed to depend on my hardware? Say explicitly whether you treat that dependence as a genuine feature of the view, as a reductio of it, or as an artifact of my framing. (iii) Add a wrinkle: with small probability ε the operator has replaced my twin with a hard-coded always-defect agent, and I know ε but not whether it happened. What does the view now recommend, and how does that sit with the fact that any policy that cooperates here has a catastrophic worst case against an arbitrary opponent?

  Finally, the residue report proper: list what translated without loss, what translated only after you distorted it (naming which of my framework's assumptions you had to impose), and what has no expression at all in a vocabulary of policies, interventions, and equilibria. My suspicion is that nothing in my vocabulary corresponds to normative rationality as opposed to performance, and that the gap between a policy being optimal and each of its actions being optimal is going to do a great deal of work. Then take a position: does the residue show that my vocabulary is missing something a decision theorist needs, or that the superrational claim was less determinate than it sounds? I would rather have a real verdict with the reasoning visible than a balanced survey. Where your translation connects to the modern descendants of Hofstadter's idea, use them, but keep everything in my terms and do not merely summarize them. Aim for roughly 1,000–1,400 words, in the form of a memo I could paste straight into the Slack thread.
reasoning: |-
  We are at a lab retreat. Thirty people play an anonymous one-shot Prisoner's Dilemma for real money. Twenty-six defect, four cooperate. One labmate insists that the superrational answer was to cooperate and that the rest failed to reason correctly. We want to understand superrationality in the vocabulary of multi-agent reinforcement learning, causal models, and game theory, then apply it to a variant where agents are fine-tuned replicas.

  We are to restate the case for superrationality faithfully but unsympathetically, then give a residue report. We must identify what intervention the superrationalist is making, whether mutual cooperation is a correlated equilibrium (it isn't, since defection is strictly dominant), and what fixed-point concept superrationality uses. We also have a variant: the divergent-checkpoint dilemma, where the opponent is a replica that has received k additional gradient steps. We must address the similarity metric, continuity with k, computational constraints, and an ε chance of replacement with an always-defect agent.

  Finally, we must report what translated cleanly, what distorted, and what has no expression in our vocabulary, and take a position on whether the vocabulary is missing something or the superrational claim is indeterminate.

  ---

  **Part 1: Superrationality in Your Vocabulary**

  **Ingredients of Superrationality (with translations and flagging assumptions):**

  1. **Notion of rationality**: Superrationality assumes that rationality is not just about maximizing one's own payoff given others' actions, but about choosing an action that, if chosen by all similar agents, leads to an outcome that is best for all. This is a form of *collective rationality* or *symmetric reasoning*.  
     *Translation*: Instead of a best response to the opponent's policy, it requires a policy that, when played by all identical agents, yields a Pareto-efficient outcome (or the best symmetric outcome).  
     *Flag*: Standard decision theory (e.g., causal decision theory) rejects this; it says rationality is individual, not collective. The literature would not accept that rationality is defined collectively in this way.

  2. **Sameness relation**: Agents must be "sufficiently similar" in their reasoning process. Hofstadter often uses identical programs or identical rational agents.  
     *Translation*: In RL terms, this is **parameter sharing**: both agents run the same policy network with the same weights. The "sameness" is exact functional identity at the time of decision.  
     *Flag*: The literature (e.g., in game theory) typically allows agents to be distinct. Superrationality assumes symmetry in the agents' decision algorithms, which is a strong assumption.

  3. **Counterfactual being evaluated**: The superrationalist evaluates the counterfactual: "What if both agents do the same action?" rather than "What if I do X while the other does whatever they do?"  
     *Translation*: Instead of conditioning on the opponent's action (via observation or belief), the agent considers only the scenario where both agents choose identically. This is a **restricted counterfactual** that ignores asymmetric deviations.  
     *Flag*: Standard causal decision theory (using do-calculus) would consider interventions on one's own action while leaving the opponent's action to its natural distribution (which may be correlated). Superrationality fixes both actions to be the same.

  4. **Fixed-point character**: The recommended action must be a fixed point: if all identical agents choose it, no one has an incentive to unilaterally deviate. But note: in Prisoner's Dilemma, mutual cooperation is not a Nash equilibrium because unilateral defection is better. Superrationality avoids this by disallowing asymmetric deviations.  
     *Translation*: The policy must be a **symmetric fixed point** under the assumption that the opponent is identical. Formally, let π be a policy (which, for a one-shot game, is just an action). Then π is superrational if:  
     U(π, π) ≥ U(π', π) for all π'   ... but this is not true for cooperation in PD!  
     Instead, the fixed point is defined by: π is chosen because if both do it, the outcome is best among symmetric outcomes. So it's:  
     π = argmax_{a} U(a, a)   (maximize payoff under the assumption that both choose the same action).  
     For PD: max U(a,a) is achieved at a=C (payoff 3) vs a=D (payoff 1).  
     *Flag*: This is not a standard equilibrium concept (like Nash). It ignores the possibility that if I cooperate, the opponent might not (because they are identical and might reason the same, but the superrationalist assumes they do).

  5. **Role of payoffs**: Payoffs are evaluated under the symmetric outcome. The superrationalist does not consider the payoff if one defects and the other cooperates because that asymmetric outcome is deemed irrelevant (since both agents are identical and will do the same thing).  
     *Translation*: The agent only considers the diagonal of the payoff matrix.  
     *Flag*: This ignores the off-diagonal payoffs, which are crucial in standard decision theory. In PD, the off-diagonals show that defection dominates.

  **The Superrational Argument for PD (faithfully restated):**  
  - You and your opponent are identical rational agents running the same decision algorithm.  
  - Since you are identical, whatever you decide, your opponent will decide the same thing.  
  - Therefore, you face only two possibilities: both cooperate or both defect.  
  - If both cooperate, you get 3; if both defect, you get 1.  
  - Since 3 > 1, you should cooperate.  

  In your vocabulary:  
  - Agents share the same policy parameters (parameter sharing).  
  - The policy is being chosen under the constraint that both agents will execute the same policy (because they are identical and will output the same action).  
  - Thus, the policy selects an action that maximizes the payoff when both take that action. This is equivalent to:  
    action = argmax_{a} U(a, a)  
  For PD:  
    U(C,C)=3, U(D,D)=1 → choose C.

  **Intervention and Causal Graph:**  
  - The superrationalist is **intervening on the policy's output**, not on the physical action of one agent.  
  - In causal terms:  
    - Let P be the shared policy program.  
    - Let A1 = P(agent1), A2 = P(agent2).  
    - Normally, in causal decision theory, you intervene on A1 (do(A1=C)) and see what A2 does (which may be correlated due to common cause P).  
    - Superrationality intervenes on P: it sets the program P to output a specific action, and since both agents run P, both actions are set to that value.  
  - The causal graph is:  
    P → A1, P → A2  (with no other edges).  
    Intervening on P sets both A1 and A2 simultaneously.  
  - This is different from intervening on A1 alone, which would break the connection from P to A1 but leave A2 unchanged (still determined by P).  
  - So the superrational counterfactual is: "If the policy program were to output C, then both agents would output C, and I would get U(C,C)."  
  - The standard causal intervention is: "If I set my action to C, and my opponent's action is whatever P outputs for them, what do I get?" which could be U(C,C) or U(C,D) depending on what the opponent does.  

  **Is Mutual Cooperation a Correlated Equilibrium?**  
  No. In a correlated equilibrium, no player has an incentive to deviate unilaterally from the recommended action. In PD, if the recommendation is "both cooperate", then if I deviate to defect, I get 5 instead of 3, so it's not a correlated equilibrium. Superrationality does not produce a correlated equilibrium; it produces a symmetric outcome that is not stable under unilateral deviation. It is not a standard solution concept in game theory.

  **Fixed-Point Operator:**  
  Superrationality uses a fixed point of the symmetric optimization operator:  
    π* = argmax_{π} U(π, π)  
  This is not the best response operator (which is BR(π) = argmax_{π'} U(π', π)).  
  In fact, mutual cooperation in PD is a fixed point of this symmetric operator but not of the best response operator (since BR(C) = D).  

  **Your Framing's Assumption:**  
  You assumed that the agents are "sufficiently similar" but did not specify identity. Superrationality typically requires exact identity of the decision algorithm, not just similarity. The literature (e.g., Hofstadter) often uses exact copies.

  **Part 2: Divergent-Checkpoint Dilemma**

  Setup:  
  - You and your opponent are replicas of the same trained policy checkpoint.  
  - Your twin receives k additional gradient steps on a private minibatch.  
  - You know architecture, optimizer, learning rate, loss.  
  - Payoffs: (C,C)=3, (D,D)=1, (C,D)=0, (D,C)=5.  
  - With probability ε, the opponent is replaced by an always-defect agent.

  **(i) Similarity Metric and Continuity:**  
  - Superrationality requires the agents to be identical. With k>0, they are not identical. So we must weaken "identical" to "similar".  
  - The similarity metric: the probability that both agents output the same action when facing the same decision problem.  
    - Formally, let π be your policy, π_k be the twin's policy after k steps.  
    - Similarity s(k) = Pr[ π(input) = π_k(input) ] for the same input (the PD game).  
  - But note: the PD game has no input features; it's a one-shot. So s(k) = 1 if π and π_k choose the same action, 0 otherwise. But this is circular because the action depends on what we decide!  
  - Instead, we must consider the policies' outputs over a distribution of inputs (but the PD has only one input). Without inputs, we cannot define similarity over the policy function.  
  - Alternative: the similarity of the policy parameters. E.g., the L2 distance between the parameter vectors. But this is not what matters; what matters is functional behavior.  
  - Hofstadter's superrationality does not address gradual divergence. It assumes exact identity.  
  - Thus, the recommendation:  
    - If k=0, agents are identical: cooperate (by superrationality).  
    - If k→∞, the twin is arbitrary: defect (by dominance).  
    - For finite k, there is no principled threshold. One might use the probability that the twin cooperates if you do. But that is not superrationality; it's standard reasoning.  
  - Superrationality, strictly, requires identity. With k>0, it does not apply. The recommendation does not vary continuously; it flips at k=0. But this is unsatisfying.  

  **(ii) Computational Constraints and Simulation:**  
  - If you can simulate the k steps (enumerate minibatches and compute π_k), then you can compute what π_k will do. Then you are not in a symmetric situation; you have more information.  
  - Superrationality assumes symmetry: both agents are in the same epistemic state. If you can simulate and your twin cannot (because they are fine-tuned and you are not), then asymmetry breaks superrationality.  
  - If both agents are identical and both know they will be diverged by k steps, then they must both simulate the same process? But the minibatches are private, so they cannot.  
  - Verdict: The superrational recommendation does not depend on your hardware. If k>0, superrationality does not apply because agents are not identical. The dependence on hardware (whether you can simulate) is an artifact of your framing that breaks the symmetry assumption.  

  **(iii) ε Chance of Always-Defect:**  
  - With probability 1-ε, the opponent is the diverged twin; with probability ε, it is an always-defect agent.  
  - The superrationalist (if they insist) might say: when the opponent is the twin, we are similar enough to apply superrationality and cooperate; when it is always-defect, we should defect. But then the policy must condition on the type, which we don't know.  
  - So the expected payoff if you cooperate: (1-ε)*U(C, π_k) + ε*U(C, D) = (1-ε)*(payoff if twin) + ε*0.  
    But we don't know what π_k does. If we assume symmetry, we might assume that π_k is the same as your policy? But you haven't been fine-tuned.  
  - Without the ε, if k=0, superrationality says cooperate. With ε>0, the strictly dominant action is to defect because if the opponent is always-defect, cooperating gives 0 (the worst) and defecting gives 1. But even if the opponent is the twin, defecting might be safe.  
  - The superrational view struggles here. It might say:  
    - If ε is very small and k=0, then the chance that the opponent is identical is high, so cooperate.  
    - But if k>0 or ε>0, then identity is broken, so defect.  
  - However, this ignores the catastrophic downside of cooperating against always-defect. A robust policy would defect.  
  - Superrationality does not address robustness; it assumes identity and common knowledge of rationality.  

  **Part 3: Residue Report**

  **What Translated Without Loss:**  
  - The fixed-point operator: the symmetric optimization max_a U(a,a) is clear in our vocabulary.  
  - The requirement of parameter sharing (or identical policies) for the original superrationality.  
  - The intervention: superrationality intervenes on the policy P, not on the action A1. This is expressible in SCMs: we can have a variable P that is a common cause of both actions, and we can intervene on P.  

  **What Translated with Distortion:**  
  - **Sameness relation**: We had to assume exact parameter identity. In reality, even with the same checkpoint, stochasticity might cause different outputs (e.g., if there is exploration). But superrationality assumes determinism and identity. We imposed that the policy is deterministic and shared.  
  - **Counterfactual**: We had to restrict the counterfactual to symmetric outcomes. This is not standard in causal decision theory, but we can express it by intervening on P. However, the motivation for why we should intervene on P (instead of A1) is normative and not causal.  
  - **Rationality**: We translated collective rationality as symmetric optimization, but this distorts the standard notion of rationality (which is individual). We imposed a collective rationality assumption.  

  **What Has No Expression:**  
  1. **Normative rationality vs. performance**: Your vocabulary is about optimal policies (that maximize expected reward) and equilibria (stability under deviations). Superrationality introduces a normative claim: that you *ought* to cooperate because it is "rational" in a collective sense. But there is no expression for "ought" in the performance-based vocabulary. The gap is between individual and collective rationality.  
  2. **The gap between action-optimality and policy-optimality**: In a one-shot game, a policy is just an action. But in general, superrationality might apply to policies that are fixed points of symmetric play. However, in your vocabulary, we can define a policy that is a fixed point of the symmetric operator, but the normative force is missing.  
  3. **Similarity without identity**: There is no standard way to extend superrationality to similar but non-identical agents. The notion of "sufficiently similar" is not formalized in the original theory and has no counterpart in game theory or RL.  
  4. **Common knowledge of rationality and similarity**: Superrationality requires that both agents know they are identical and rational. This common knowledge has no direct expression in SCMs or RL, except through the policy itself.  

  **Verdict:**  
  The residue shows that the superrational claim was less determinate than it sounds. Specifically:  
  - In the exact one-shot PD with identical agents, superrationality has a clear but non-standard recommendation: cooperate. But this is not a robust solution; it ignores the possibility of errors or deviations.  
  - In the divergent-checkpoint case, superrationality does not apply (since agents are not identical), and the labmate's insistence on cooperation was misguided.  
  - The dependence on exact identity is a critical flaw: in the real world, agents are never identical, and even in your retreat, the thirty people were not running identical decision algorithms. The 26 defectors were correct by standard causal decision theory.  
  - The superrational recommendation is not a correlated equilibrium and is not incentive-compatible: if you believe your opponent will cooperate (because they are superrational), then defecting gives you 5>3. So it is exploitable.  

  **Final Position:**  
  - Your vocabulary is not missing anything essential; it exposes the assumptions of superrationality (exact identity, deterministic policies, and collective rationality) that are not tenable in practice.  
  - The labmate's argument fails because:  
    - The agents (lab members) were not identical in their decision processes.  
    - Even if they were, standard rationality (which avoids catastrophic losses) would defect unless common knowledge of exact superrationality holds.  
  - For the divergent-checkpoint dilemma:  
    - If k=0 and ε=0, superrationality says cooperate.  
    - But with any k>0 or ε>0, the symmetry is broken, and defection becomes safer.  
    - Given the catastrophic downside (cooperating while exploited), a robust policy defects.  

  **Recommendation for Slack:**  
  In the one-shot PD with humans, defection is the rational choice by standard decision theory. Superrationality's cooperation only holds under idealized and unrealistic assumptions of agent identity. Given that the agents were humans with diverse reasoning, the 26 defectors were correct, and the 4 cooperators were either irrational or applying a non-standard normative principle. In the divergent-checkpoint case, the same applies: unless k=0 and ε=0, defect. And even then, if there is any uncertainty, defect. Superrationality is not a practical guide for real-world decisions.
answer: |-
  ### Memo: Superrationality in Multi-Agent RL and Causal Vocabulary  
  **To:** Lab Slack Thread  
  **From:** Philosopher-ML Translator  
  **Subject:** Resolving the Retreat PD Dispute and Divergent-Checkpoint Dilemma  

  #### **1. Faithful Restatement of Superrationality in Your Vocabulary**  
  **Core Claim:** In a one-shot Prisoner's Dilemma (PD) between two *identical rational agents* (e.g., same policy checkpoint), cooperation is "rational" because both agents, being identical, will output the same action. Thus, by choosing your action, you effectively choose the symmetric outcome (both C or both D). Since mutual cooperation (payoff 3) dominates mutual defection (payoff 1), you "should" cooperate.  

  **Ingredients Translated:**  
  - **Rationality**: Not "maximize individual payoff given opponent's policy" (best response), but "choose the action that, if *both* agents select it, maximizes payoff under symmetry." This is a **symmetric fixed-point optimization** over the diagonal of the payoff matrix:  
    \[
    \pi^* = \underset{a}{\text{argmax}}  \; U(a, a)
    \]  
    For PD: \(U(C,C) = 3\), \(U(D,D) = 1\) → Cooperate. *Flag*: Standard decision theory rejects this—it violates **dominance** (defection is strictly better regardless of opponent).  

  - **Sameness Relation**: Agents must be *functionally identical* (same policy parameters, architecture, and initial weights). Translation: **Parameter sharing** with identical checkpoints. Sameness is binary: either agents are clones (k=0) or they are not (k>0). *Flag*: Literature assumes strict identity; "sufficient similarity" is not formally defined.  

  - **Counterfactual Evaluated**: Not "what if I intervene on my action?" (do-calculus), but "what if I intervene on the *shared policy* that outputs both actions?"  
    - **Causal Graph**:  
      - Variables: Policy program \(P\), Agent 1's action \(A_1\), Agent 2's action \(A_2\).  
      - Edges: \(P \rightarrow A_1\), \(P \rightarrow A_2\) (no direct \(A_1 \leftrightarrow A_2\) edge).  
    - **Intervention**: Superrationalist intervenes on \(P\) (set policy output to C/D), affecting both \(A_1\) and \(A_2\) simultaneously. Standard CDT intervenes on \(A_1\) alone (severing \(P \rightarrow A_1\)), leaving \(A_2\) correlated via \(P\).  
    - *Key Difference*: Superrationality’s counterfactual forces symmetry: "If I set \(P\) to C, both agents output C."  

  - **Fixed-Point Character**: Not a best response to opponent's policy (\(\pi^* = BR(\pi_{\text{opp}})\)), but a **symmetric Nash Fixed Point** (SNFP):  
    \[
    U(\pi^*, \pi^*) \geq U(\pi', \pi^*) \quad \forall \pi' \quad \text{(but this fails in PD!)}
    \]  
    Instead, it uses a *weaker* fixed point:  
    \[
    \pi^* = \underset{\pi}{\text{argmax}}  \; U(\pi, \pi)
    \]  
    This is not an equilibrium (fails unilateral deviation tests); it’s a self-consistent symmetry assumption.  

  - **Payoffs**: Only symmetric outcomes (diagonal payoffs) are considered. Asymmetric payoffs (e.g., 5 for exploit) are ignored as "irrelevant" (since identical agents cannot asymmetrically deviate).  

  **Why It’s Not a Correlated Equilibrium**:  
  - Mutual cooperation has **negative incentive compatibility**: If both are told "cooperate," defecting yields higher payoff (5 > 3) regardless of the signal. It violates the core definition of correlated equilibrium.  

  **Nearest RL Concepts (and Why They Fail)**:  
  - **Self-Play with Shared Parameters**: Trains a policy against itself (e.g., AlphaZero). But in deployment, agents are identical, so self-play *can* converge to cooperation if the game is repeated or has communication. *Distortion*: Self-play assumes iterative updates that create a causal channel (your update affects future opponents)—superrationality has no such channel in a one-shot.  
  - **Self-Referential Policies**: A program that outputs an action defined by \(a = f(a_{\text{twin}})\). This creates a logical circularity (e.g., quining). *Distortion*: This smuggles in a causal link (your code directly computes opponent’s action) absent in the physical setup.  

  #### **2. Divergent-Checkpoint Dilemma: Superrationality Under Fine-Tuning**  
  Setup: You (policy \(\pi\)) vs. twin (\(\pi_k\)) from same checkpoint + \(k\) SGD steps on private minibatch. Payoffs: (C,C)=3, (D,D)=1, (C,D)=0, (D,C)=5.  

  **(i) Similarity Metric and Continuity with \(k\)**:  
  - **Similarity Metric**: Superrationality requires strict identity (\(k = 0\)). No continuous metric exists in the literature. We can attempt:  
    - *Functional similarity*: \(\text{Pr}(\pi(\text{input}) = \pi_k(\text{input}))\) over inputs.  
    - *Parameter similarity*: \(\|\theta - \theta_k\|_2\).  
    Both fail:  
    - PD has no inputs → similarity reduces to whether \(\pi\) and \(\pi_k\) choose the same action (tautological).  
    - With \(k > 0\), policies diverge stochastically (private minibatch) → similarity is undefined without a distribution.  
  - **Recommendation**: Flips discontinuously at \(k = 0\):  
    - \(k = 0\): Cooperate (identical agents).  
    - \(k > 0\): Not identical → superrationality does not apply. Defect by dominance.  
    *Principled Basis?* None. Hofstadter’s theory assumes perfect clones; gradual divergence is unaddressed.  

  **(ii) Dependence on Compute/Hardware**:  
  - **Claim**: To apply superrationality, you must simulate \(\pi_k\)’s behavior by sampling plausible minibatches.  
  - **Translation**: If compute allows exact simulation (enumerate minibatches), you can estimate \(Pr(\pi_k = C)\) and choose best response. But this is **not superrationality**—it’s standard expected utility maximization.  
  - **Superrational Verdict**:  
    - If you can simulate \(\pi_k\), symmetry is broken (you have info your twin lacks) → superrationality invalid.  
    - If you cannot simulate, but \(k\) is small, superrationality still requires \(k = 0\) → defect.  
    - **Verdict**: Dependence on hardware is a *reductio* of applying superrationality here. The theory assumes identical epistemic states; simulation breaks this.  

  **(iii) \(\epsilon\)-Chance of Always-Defect Opponent**:  
  - With probability \(\epsilon\), twin is replaced by \(\pi_{\text{evil}}\) (always defects).  
  - **Superrational Recommendation**:  
    - If \(\epsilon = 0\) and \(k = 0\): Cooperate.  
    - If \(\epsilon > 0\) or \(k > 0\): "Not identical" → defect.  
  - **Problem**: Ignores worst-case robustness. Expected payoff if you cooperate: \((1-\epsilon) \cdot U(C, \pi_k) + \epsilon \cdot 0\). Since \(U(C, \pi_k)\) depends on \(\pi_k\) (unknown), and \(\pi_{\text{evil}}\) exploits you, cooperation risks payoff 0.  
  - **Catastrophic Failure**: No superrationalist defense. A policy cooperating here is not **adversarially robust**; defection dominates strictly (minimax payoff 1 vs 0).  

  #### **3. Residue Report: What Survived, Distorted, or Has No Analog**  
  **Translated Without Loss**:  
  - **Symmetric Fixed-Point Operator**: \(\pi^* = \underset{\pi}{\text{argmax}}  U(\pi, \pi)\) is well-defined in your vocabulary.  
  - **Intervention Target**: Distinguishing intervention on policy \(P\) (superrational) vs. action \(A_1\) (CDT) is expressible in SCMs.  
  - **Parameter Sharing**: Matches the identity assumption.  

  **Translated with Distortion (Your Assumptions Imposed)**:  
  - **Sameness as Parameter Identity**: We assumed policies are deterministic and binary-same. Reality: Policies can be stochastic, and "similarity" lacks a metric.  
  - **Counterfactual Restriction**: We forced the counterfactual to ignore asymmetric outcomes. Normatively, this is arbitrary—your framework *can* express it, but only by abandoning dominance.  
  - **Fixed Point as SNFP**: We mapped it to a mathematical object, but superrationality’s fixed point lacks the game-theoretic stability of Nash/CE.  

  **No Expression in Your Vocabulary**:  
