  The deeper issue seems decision-theoretic: How to act when evidence is ambiguous or impossible to obtain? This connects to differing risk tolerances and cost-benefit analyses of precautionary measures.

  The user's hypothesis is largely correct. The two mechanisms are being conflated, creating confusion. The evidence debate is indeed structurally thorny due to the gameability problem. And underneath lies a decision-theoretic disagreement about handling irreducible uncertainty.

