prompt: |-
  I'm a science-and-ideas journalist working on a feature about who checks the checkers once the checkers are language models, and before I start interviewing people I want the spec, not the sales pitch. So: write me the desiderata that any scheme for scalable oversight — getting a weaker judge to reliably supervise a stronger model — has to meet to count as adequate. Each requirement needs the concrete case behind it (the situation that shows why you'd want it), and each needs to be marked either non-negotiable or as a preference of one particular camp.

  Let me fix the purpose so adequacy isn't up for grabs: I want to know what would let a regulator actually lean on such a scheme when certifying high-stakes model output — clinical guidance, an engineering safety case, a financial disclosure — in a domain where no available human expert can check the whole thing end to end. Concretely: the judge is a smart generalist rather than a specialist, has maybe 40 minutes per item, works in what I'll call a sealed room (no re-running the model, no outside tools, no phoning someone who knows more), and the object being judged is a long chain of reasoning whose conclusion may be true but deeply counterintuitive, or false but beautifully presented.

  I have a few hobby-horses of my own that I'd rather you rule on than just adopt: that the scheme shouldn't get to assume the two sides in a dispute differ in skill or in honesty; that it shouldn't get to assume truth is more persuasive than a well-told falsehood under time pressure; that a verdict has to survive being handed to a second judge with different priors; and that it can't simply push the problem up a level to another overseer who also needs overseeing. Tell me honestly which of those are genuine desiderata and which are just my tastes dressed up as requirements — I've read enough of this stuff to know its easy to do that.

  Then the part I most want: which pair of desiderata do you suspect can't be jointly satisfied, and which single requirement does the most work in knocking out candidate schemes? After that, a very short scorecard — a paragraph total — for debate, recursive or iterated amplification-style schemes, and market- or prediction-market-flavored oversight. Keep the weight on the criteria rather than the scoring, and keep the two seperate. Plain prose, American English, under 900 words if you can.
reasoning: |-
  Hmm, this is a complex request from a science journalist about scalable oversight schemes for AI systems. They want desiderata (essential requirements) for judging whether a weaker human can reliably supervise a stronger AI model in high-stakes scenarios. Let me unpack this carefully.

  The journalist is working on a feature about who checks the AI "checkers" when those checkers are language models themselves. They want concrete requirements grounded in real-world cases, with each marked as non-negotiable or preference-based. The scenario is specific: a smart generalist with 40 minutes, in a sealed room, judging long chains of reasoning that could be counterintuitively true or deceptively false.

  They also have their own hobby-horses: 
  - No assumptions about skill/honesty differences between disputants
  - No assumption truth is more persuasive than falsehood under time pressure
  - Verdicts must be robust across judges with different priors
  - No kicking the oversight can up the ladder

  I need to honestly evaluate which of these are genuine requirements versus personal preferences. 

  For the desiderata, I'm considering these key requirements:
  1. **Soundness under adversarial conditions** (non-negotiable) - because models could systematically deceive
  2. **Judicial tractability** (non-negotiable) - humans have limited time/cognition
  3. **Verification robustness** (non-negotiable) - must work across judge priors
  4. **No meta-oversight loophole** (non-negotiable) - avoids infinite regress
  5. **Truth-conduciveness under constraints** (preference) - some camps value this
  6. **Dispute symmetry** (preference) - their hobby-horse, but debatable
  7. **Persuasion parity** (preference) - also their hobby-horse, context-dependent

  Evaluating their hobby-horses:
  - Dispute symmetry is reasonable but not always necessary
  - Persuasion parity is overstated - truth often has structural advantages
  - Robustness across priors is crucial
  - No meta-oversight is absolutely essential

  The tension between judicial tractability and soundness under adversarial conditions seems fundamentally hard to resolve. And soundness does the most work in eliminating schemes.

  For the scorecard:
  - Debate: Good on soundness, poor on tractability
  - Recursive/iterated amplification: Avoids meta-oversight, but tractability issues
  - Prediction markets: Good tractability, weak on adversarial soundness

  I need to keep this under 900 words in plain American English, focusing on criteria rather than scoring. The tone should be professional but accessible for a journalist audience.
answer: |-
  Here are the desiderata for scalable oversight schemes in your specified regulatory context, followed by honest assessments of your hobby-horses, key tensions, and a brief scorecard. Desiderata are grounded in concrete failure modes and marked as **Non-Negotiable (NN)** or **Camp Preference (CP)**.

  ### Core Desiderata
  1. **Soundness Under Adversarial Conditions (NN)**  
     *Concrete Case*: A model generates a false but highly persuasive safety case for a novel reactor design, citing plausible-sounding but fabricated studies. The judge must detect deception despite the model’s superior ability to manipulate language.  
     *Why NN*: If oversight fails when the model intentionally deceives, certification is untrustworthy.

  2. **Judicial Tractability (NN)**  
     *Concrete Case*: A clinical guidance report cites 50+ specialized studies. A generalist judge with 40 minutes must assess validity without tools or external help. Oversight must compress complex reasoning into judge-accessible signals (e.g., highlighting contradictions, not raw data dumps).  
     *Why NN*: Without time/cognition feasibility, the system is unusable.

  3. **Verification Robustness (NN)**  
     *Concrete Case*: Two judges—one conservative, one radical—evaluate counterintuitive financial engineering advice. Both must reach the same verdict despite differing priors on market efficiency.  
     *Why NN*: Certification requires consistency; oversight can’t depend on judge-specific biases.

  4. **No Meta-Oversight Loophole (NN)**  
     *Concrete Case*: A scheme uses a secondary AI to summarize disputes for the judge. If that summarizer itself needs oversight (e.g., it omits key rebuttals), the problem recurs infinitely.  
     *Why NN*: Pushing oversight upstream creates regress; the scheme must close the loop at the human judge.

  5. **Truth-Conduciveness Under Constraints (CP: Optimizer Camp)**  
     *Concrete Case*: A true but counterintuitive conclusion (e.g., "this drug works via an unknown mechanism") is poorly explained. The scheme should help the judge favor truth over falsehoods *despite* equal persuasiveness.  
     *Why CP*: Some camps prioritize truth-approximation over raw adversarial robustness, but this isn’t universally required for certification.

  6. **Dispute Symmetry (CP: Skeptic Camp)**  
     *Concrete Case*: Two agents (human+AI or AI+AI) debate. The judge shouldn’t assume one is more skilled/honest, as bad actors could exploit bias (e.g., a malicious human bribed to defend flawed output).  
     *Why CP*: Your hobby-horse—useful to limit assumptions, but schemes can sometimes assume honest judges/systems and still work.

  7. **Persuasion Parity Neutralization (CP: Pragmatist Camp)**  
     *Concrete Case*: A false engineering analysis uses emotionally resonant narratives ("this bridge will inspire communities") that outcompete a true, dry rebuttal under time pressure.  
     *Why CP*: Another hobby-horse. Truth often *does* have structural advantages (e.g., coherence with reality), so demanding strict neutrality may overcorrect.

  ### Your Hobby-Horses: Genuine vs. Taste
  - **No skill/honesty assumptions**: Genuine but situational (NN only if adversarial; otherwise CP).  
  - **No truth-persuasion advantage**: Overly strict (CP). Truth *can* be less persuasive (e.g., counterintuitive facts), but schemes needn’t assume symmetry to be adequate.  
  - **Verdict survives different priors**: Genuine (NN, as Verification Robustness).  
  - **No meta-oversight**: Genuine (NN).  

  ### Key Tensions and Knockout Power
  - **Hardest Pair to Satisfy**: **Judicial Tractability + Soundness Under Adversarial Conditions**.  
    *Why*: Adversarial soundness requires deep, time-intensive verification (e.g., checking hidden premises). Tractability demands shortcuts. Under 40 minutes, these conflict brutally.  
  - **Most Disqualifying Requirement**: **Soundness Under Adversarial Conditions**.  
    *Why*: Knocks out schemes relying on model honesty (e.g., naive RLHF), "self-supervision," or human intuition alone. Forces solutions like debate or formal verification—which then struggle with tractability.

  ### Scorecard (Criteria-Focused)
  **Debate/Iterated Amplification**: Excels at **Soundness** (adversarial pressure exposes flaws) and **No Meta-Oversight** (judge sees grounded disputes). Weak on **Tractability**—judges struggle to parse rapid-fire, technical exchanges in 40 minutes. **Verification Robustness** varies: structured debates help, but priors still affect which arguments resonate.  
  **Market/Prediction Schemes**: Strong **Tractability** (aggregated signals reduce cognitive load). Weak **Soundness**—markets assume participants can eventually verify truth, but this fails against novel deception. **Verification Robustness** is poor if experts have correlated biases; **No Meta-Oversight** is achieved only if markets are the top layer.  

  ---

  **Word Count**: 798  
  **Key Emphasis**: Desiderata are rooted in failure modes (e.g., fabricated reactor studies, biased judges). Your hobby-horses are partly valid but overindex on adversarial edge cases. Tension between tractability and adversarial soundness is the core bottleneck.
