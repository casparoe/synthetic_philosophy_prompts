answer: |-
  **QUESTION 4: VAN FRAASSEN'S REFLECTION PRINCIPLE**

  Alice is concerned with a hypothesis \(H\). At time \(t_0\), she knows that at time \(t_1\) she will observe a perfectly reliable signal \(S\) about \(H\). The signal \(S\) takes two values: \(S_1\) if \(H\) is true, and \(S_2\) if \(H\) is false. Thus, after observing \(S\), she will know whether \(H\) is true or false. Alice updates her credences by conditionalization.  

  However, independently of \(H\) and the signal, at time \(t_1\) (after observing the signal) Alice will be subjected to a pharmacological intervention with probability \(p\) (known to her at \(t_0\)). With probability \(1-p\), no intervention occurs. If the intervention occurs, it deterministically alters her credence in \(H\). Specifically, if her credence in \(H\) at \(t_1\) (after the signal) was \(c\), then after the intervention her credence in \(H\) becomes:  
  \[
  c' = (c \cdot (1 - \epsilon)) + \frac{\epsilon}{2}
  \]  
  for some small fixed \(\epsilon > 0\) (also known to her at \(t_0\)). If no intervention occurs, her credence remains \(c\).  

  After time \(t_1\), the specification of whether the intervention occurred is erased from her memory. Thus, at a later time \(t_2\), she does not know whether the intervention occurred. She only knows the chance \(p\) and the value of \(\epsilon\). She cannot decline the intervention and has no later route to discovering whether it occurred.  

  Let \(\text{Cr}_0\) be Alice’s credence function at \(t_0\), and \(\text{Cr}_2\) her credence function at \(t_2\).  

  (a) For a given real number \(x \in [0,1]\), consider the proposition \([\text{Cr}_2(H) = x]\). Does the literal Reflection identity hold? That is, is it true that for every \(x\), \(\text{Cr}_0(H \mid \text{Cr}_2(H) = x) = x\)?  
  *(3 marks)*  

  (b) Compute \(\text{Cr}_0(H \mid \text{Cr}_2(H) = x)\) for each possible value of \(x\) that has positive probability. If there are values of \(x\) for which the conditional probability is undefined, state that.  
  *(7 marks)*  

  (c) What does this case show about the interpretation of the Reflection principle? In particular, should Reflection be understood as a coherence constraint on a present credal state, or as a principle of deference to a later self treated as an expert? And what does the diachronic Dutch-strategy argument for Reflection actually support?  
  *(5 marks)*  

  (d) What structural condition on the relation between later credence and evidence is required for the literal Reflection identity to follow from conditionalization? Explain why this condition fails in the present case.  
  *(5 marks)*  

  ---

  **MODEL ANSWER**  

  **(a) Failure of Literal Reflection Identity**  
  The literal Reflection identity does not hold. Reflection requires \(\text{Cr}_0(H \mid \text{Cr}_2(H) = x) = x\) for all \(x\), but this fails because \(\text{Cr}_2(H)\) is distorted by the intervention, which Alice cannot later detect. The future credence \(\text{Cr}_2(H)\) is not a pure report of the evidence (the signal \(S\)) but is confounded by the independent, deterministic effect of the intervention. Even though Alice updates by conditionalization on \(S\) at \(t_1\), the intervention alters her credence in a way that makes \(\text{Cr}_2(H)\) an unreliable indicator of \(H\)’s truth, breaking the link Reflection assumes.  

  **(b) Correct Conditional Credence**  
  At \(t_1\), after observing \(S\), Alice’s credence in \(H\) is \(1\) if \(S = S_1\) (\(H\) true) or \(0\) if \(S = S_2\) (\(H\) false). Let \(q = \text{Cr}_0(H)\) be her prior credence. The intervention occurs with probability \(p\), altering her credence as specified. Thus, \(\text{Cr}_2(H)\) takes four possible values:  
  - \(1\) (if no intervention and \(S_1\): \(H\) true),  
  - \(0\) (if no intervention and \(S_2\): \(H\) false),  
  - \(1 - \frac{\epsilon}{2}\) (if intervention and \(S_1\): \(H\) true),  
  - \(\frac{\epsilon}{2}\) (if intervention and \(S_2\): \(H\) false).  

  The joint probabilities are:  
  - \(\text{Cr}_0(\text{Cr}_2(H) = 1, H) = \text{Cr}_0(\text{no intervention}, S_1) = (1-p) \cdot q\)  
  - \(\text{Cr}_0(\text{Cr}_2(H) = 0, \neg H) = \text{Cr}_0(\text{no intervention}, S_2) = (1-p) \cdot (1-q)\)  
  - \(\text{Cr}_0(\text{Cr}_2(H) = 1 - \frac{\epsilon}{2}, H) = \text{Cr}_0(\text{intervention}, S_1) = p \cdot q\)  
  - \(\text{Cr}_0(\text{Cr}_2(H) = \frac{\epsilon}{2}, \neg H) = \text{Cr}_0(\text{intervention}, S_2) = p \cdot (1-q)\)  

  For any other \(x\), \(\text{Cr}_0(\text{Cr}_2(H) = x) = 0\), so \(\text{Cr}_0(H \mid \text{Cr}_2(H) = x)\) is undefined. For the four possible \(x\):  
  - \(\text{Cr}_0(H \mid \text{Cr}_2(H) = 1) = \frac{\text{Cr}_0(H, \text{Cr}_2(H) = 1)}{\text{Cr}_0(\text{Cr}_2(H) = 1)} = \frac{(1-p)q}{(1-p)q} = 1\)  
  - \(\text{Cr}_0(H \mid \text{Cr}_2(H) = 0) = \frac{\text{Cr}_0(H, \text{Cr}_2(H) = 0)}{\text{Cr}_0(\text{Cr}_2(H) = 0)} = \frac{0}{(1-p)(1-q)} = 0\) (since \(H\) false)  
  - \(\text{Cr}_0(H \mid \text{Cr}_2(H) = 1 - \frac{\epsilon}{2}) = \frac{\text{Cr}_0(H, \text{Cr}_2(H) = 1 - \frac{\epsilon}{2})}{\text{Cr}_0(\text{Cr}_2(H) = 1 - \frac{\epsilon}{2})} = \frac{pq}{pq} = 1\)  
  - \(\text{Cr}_0(H \mid \text{Cr}_2(H) = \frac{\epsilon}{2}) = \frac{\text{Cr}_0(H, \text{Cr}_2(H) = \frac{\epsilon}{2})}{\text{Cr}_0(\text{Cr}_2(H) = \frac{\epsilon}{2})} = \frac{0}{p(1-q)} = 0\)  

  Thus, \(\text{Cr}_0(H \mid \text{Cr}_2(H) = x)\) equals \(1\) if \(x = 1\) or \(x = 1 - \frac{\epsilon}{2}\), and \(0\) if \(x = 0\) or \(x = \frac{\epsilon}{2}\). In all cases, it is unequal to \(x\) (e.g., for \(x = 1 - \frac{\epsilon}{2}\), it is \(1 \neq 1 - \frac{\epsilon}{2}\)).  

  **(c) Interpretation of Reflection and the Dutch-Strategy Argument**  
  This case shows that Reflection is not a universal coherence constraint but a principle of *deference to a rational future self*. Literal Reflection fails here because Alice’s \(t_2\) self is impaired—the intervention distorts her credences, making her an unreliable expert. Reflection holds only when the future self is rational (i.e., updates by conditionalization alone) and has strictly more evidence. Here, Alice’s \(t_2\) self has *less* reliable doxastic states due to the intervention, so deference is unwarranted.  

  The diachronic Dutch-strategy argument supports only a *weaker* principle: that Reflection is required when the agent expects to be rational at the future time. The argument assumes the future self’s credences are formed rationally (via conditionalization), so a bookie can exploit inconsistencies between current and future bets. But in this case, the \(t_2\) self’s impairment means she is not rational; a bookie could exploit her distorted credences, but this does not indict Alice’s \(t_0\) coherence. The Dutch strategy thus supports Reflection *only when the future self is rational*, not the literal principle universally.  

  **(d) Structural Condition for Reflection from Conditionalization**  
  Literal Reflection follows from conditionalization only if the future credence \(\text{Cr}_2(H)\) is a *sufficient statistic* for the evidence with respect to \(H\). That is, \(\text{Cr}_2(H)\) must fully capture all information about \(H\) from the evidence, so that \(H\) is independent of the specific evidence given \(\text{Cr}_2(H)\). Formally, \(\text{Cr}_0(H \mid \text{Cr}_2(H) = x, E) = \text{Cr}_0(H \mid \text{Cr}_2(H) = x)\) for all evidence \(E\).  

  This fails here because \(\text{Cr}_2(H)\) depends on both the evidence (via \(S\)) and the intervention, which is independent of \(H\). The event \([\text{Cr}_2(H) = x]\) reveals not just \(S\) (and thus \(H\)) but also whether the intervention occurred. For example:  
  - \(\text{Cr}_2(H) = 1 - \frac{\epsilon}{2}\) implies both \(H\) is true (from \(S_1\)) *and* the intervention occurred.  
  But since the intervention is independent of \(H\), it adds no information about \(H\) beyond \(S\). Crucially, \(\text{Cr}_2(H)\) is not a deterministic function of the evidence alone; it is also shaped by the intervention. Thus, \(\text{Cr}_2(H)\) does not screen off \(H\) from the evidence, violating sufficiency.  

  ---

  **MARKING SCHEME (20 MARKS TOTAL)**  
  A strong answer must make five key moves. Marks are awarded for clarity, correctness, and completeness.  

  | **Move**                                                                                                | **Marks** | **Failure it Catches**                                                                 |
  |---------------------------------------------------------------------------------------------------------|-----------|----------------------------------------------------------------------------------------|
  | **1. Identifies that literal Reflection fails and explains why** (distortion undermines reliability). | 4         | Conflating Reflection with martingale property (expected future credence = current). |
  | **2. Correctly computes \(\text{Cr}_0(H \mid \text{Cr}_2(H) = x)\) for all \(x\)** (values as above). | 5         | Assuming invertibility of distortion restores deference.                             |
  | **3. Interprets Reflection as deference to a rational expert, not universal coherence; explains Dutch strategy supports only a weaker principle.** | 5         | Treating Dutch strategy as decisive for literal principle without addressing impairment. |
  | **4. States the sufficiency condition and why it fails** (\(\text{Cr}_2(H)\) not a function of evidence alone). | 4         | Misidentifying the condition (e.g., assuming partition or invertibility suffices).   |
  | **5. Notes that conditional credence depends on truth of \(H\) revealed by \([\text{Cr}_2(H)=x]\), not \(x\) itself.** | 2         | Abandoning Reflection without stating what governs conditional credence.              |

  **Grading Distinction:**  
  - **First-class (17–20):** All moves present; computations exact; deep interpretation of Dutch strategy and sufficiency.  
  - **Good (13–16):** Moves 1–4 covered; minor errors in computation or Dutch strategy; solid on sufficiency.  
  - **Bare pass (10–12):** Identifies failure (move 1) and attempts computation (move 2) but incomplete; weak on interpretation (move 3) or condition (move 4).  
  - **Fail (<10):** Misses >1 move; claims Reflection holds; miscomputes conditional credence; ignores sufficiency.
