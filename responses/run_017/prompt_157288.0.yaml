prompt: |-
  I am writing this year's comprehensive examination in formal epistemology for our PhD cohort, and I need one question on van Fraassen's Reflection principle — the requirement that, for any proposition A and any number x in the unit interval, an agent's present credence in A, conditional on the proposition that her credence in A at some specified later time will be x, should itself be x. I want a question that no candidate can dispose of by writing down that formula, deriving it from conditionalization over a partition of possible future evidence, or rehearsing the diachronic Dutch-strategy argument.

  The question should turn on a case you construct yourself, in which the agent will in fact receive perfectly reliable evidence bearing on a hypothesis H, so that conditionalizing is unproblematic, but where, independently of H and with a chance she knows, she will afterward be subjected to a belief-forming process whose effect on her credences is deterministic and exactly known to her now while being unavailable to her later: she will not know whether the process operated on her, and its specification will have been erased from her memory. A pharmacological intervention that compresses every credence toward certainty by a factor she can compute is one way to fill this in, but use whatever fills it in best. Close off the obvious escapes by stipulation: the evidence is genuinely relevant, the update on it is genuinely Bayesian, she cannot decline the intervention, and she has no later route to discovering whether it occurred.

  The question should then force a decision, not a survey. Does the literal Reflection identity deliver the correct present credence in H? If not, what does — deference to the value she would get by inverting the known distortion, the martingale consequence of conditionalization taken on its own, or some third formulation? And what does the answer show about whether Reflection is best read as a coherence constraint on a present credal state or as a principle of deference to a later self treated as an expert, and about whether the Dutch-strategy argument supports the literal principle or something weaker than it? The candidate should also be pressed to say what structural condition on the relation between later credence and evidence is needed for the literal identity to follow from conditionalization at all, and why the case violates it.

  Deliver the question exactly as it would appear on the paper, stipulations included, together with a model answer of roughly a thousand words and a marking scheme out of twenty marks built around five moves a strong answer must make. For each move give its mark value and one line naming the failure it is meant to catch — for instance conflating the martingale consequence with the literal principle, assuming invertibility of the distortion suffices to restore deference, treating the Dutch strategy as decisive without addressing what it means for a bookie to be able to exploit an impaired later self, or abandoning Reflection altogether without saying what governs the case instead. The scheme should make explicit what separates a first-class answer from a bare pass rather than only listing what is missing at the bottom.
reasoning: |-
  We are constructing a comprehensive exam question on van Fraassen's Reflection principle. The question should involve a case where the agent will receive reliable evidence but also undergo a deterministic belief distortion process, the occurrence of which she cannot later detect. The question should force a decision on whether the literal Reflection identity holds and what the correct credence should be, while also addressing the interpretation of Reflection and the structural condition required for Reflection to follow from conditionalization.

  We design a case as follows:

  **Case: The Memory-Altering Drug and the Reliable Signal**

  An agent, Alice, is concerned with a hypothesis H. At time t0, she knows that at time t1 she will observe a perfectly reliable signal S about H. The signal S can take two values: S1 or S2. If H is true, then S will be S1 with probability 1; if H is false, then S will be S2 with probability 1. Thus, after observing the signal, she will know the truth value of H.

  However, independently of H and the signal, at time t1 (after observing the signal) Alice will be subjected to a pharmacological intervention with a known chance. With probability p, she is given a drug that compresses her credences toward certainty. Specifically, if her credence in H at time t1 (after observing the signal but before the drug) is c, then after the drug her credence in H becomes:

    c' = c^γ   (for some fixed γ > 1)

  With probability 1-p, she is not given the drug and her credence remains c.

  The drug's effect is deterministic and known to her at t0. However, after time t1, the specification of whether the drug was administered is erased from her memory. Thus, at a later time t2, she will not know whether the drug was administered or not. She only knows that with probability p she was drugged and with probability 1-p she was not.

  Alice updates by conditionalization on the evidence she receives. She cannot decline the intervention and has no way of later discovering whether it occurred.

  **The Question**

  At time t0, Alice considers her future credence at t2 in H. Let Cr0 be her credence at t0, and Cr2 her credence at t2.

  The literal Reflection principle requires that for any x, Cr0(H | Cr2(H)=x) = x.

  We ask:

  (a) Does the literal Reflection identity hold in this case? That is, is it true that for every x, Cr0(H | Cr2(H)=x) = x? If not, why not?

  (b) What should Alice's present credence in H be, conditional on the proposition that her future credence at t2 in H is x? (That is, what is the correct value of Cr0(H | Cr2(H)=x)?) Justify your answer by computing it or by explaining the reasoning.

  (c) What does this case show about the interpretation of the Reflection principle? In particular, should Reflection be understood as a coherence constraint on a present credal state, or as a principle of deference to a later self treated as an expert? And what does the diachronic Dutch-book argument for Reflection actually support?

  (d) What structural condition on the relation between later credence and evidence is required for the literal Reflection identity to follow from conditionalization? Explain why this condition fails in the present case.

  **Model Answer (Approx. 1000 words)**

  (a) The literal Reflection identity does not hold in this case. The reason is that the future credence Cr2(H) is not a straightforward report of the evidence received, but is distorted by the potential drug intervention in a way that Alice cannot later detect. Although she updates by conditionalization on the evidence (the signal S), the drug introduces a deterministic distortion that operates without her knowledge at t2.

  (b) To compute Cr0(H | Cr2(H)=x), we must consider the possible paths to having Cr2(H)=x.

  At time t1, after observing the signal, Alice's credence in H is either 1 (if she saw S1) or 0 (if she saw S2). Let E1 be the event of observing S1 (which implies H is true) and E2 be the event of observing S2 (which implies H is false). Then:

  - If E1 occurs (so H is true), then her credence at t1, c, is 1.
  - If E2 occurs (so H is false), then her credence at t1, c, is 0.

  Now, the drug intervention happens:

  - With probability p, the drug is administered, so her credence at t2 becomes c^γ. Since c is either 0 or 1, we have:
      - If c=1, then c^γ = 1 (since 1 raised to any power is 1).
      - If c=0, then c^γ = 0 (similarly).
    Thus, the drug has no effect in this case! Why? Because when the credence is already 0 or 1, compressing it (by raising to a power γ>1) leaves it unchanged.

  - With probability 1-p, no drug is given, and her credence remains c (which is 0 or 1).

  Therefore, regardless of whether the drug is given or not, at time t2 her credence in H is the same as at t1: either 0 or 1. Specifically:

  - If H is true (E1 occurs), then Cr2(H) = 1.
  - If H is false (E2 occurs), then Cr2(H) = 0.

  So the event [Cr2(H)=x] can only occur when x=0 or x=1. Moreover:

  - [Cr2(H)=1] occurs if and only if H is true (because then E1 occurs and Cr2(H)=1).
  - [Cr2(H)=0] occurs if and only if H is false.

  Therefore, for x=1:

    Cr0(H | Cr2(H)=1) = Cr0(H | H) = 1.

  For x=0:

    Cr0(H | Cr2(H)=0) = Cr0(H | not H) = 0.

  For any other x (not 0 or 1), the event [Cr2(H)=x] has probability 0, so the conditional probability is undefined.

  Thus, the conditional credence Cr0(H | Cr2(H)=x) is 1 if x=1, 0 if x=0, and undefined otherwise. This is not equal to x (except trivially at the boundaries). Therefore, the literal Reflection identity fails.

  But note: the above reasoning depends on the specific distortion function (c^γ) leaving 0 and 1 unchanged. What if we change the distortion function? The problem asks for a deterministic distortion that is known, but we must note that if the distortion function does not fix 0 and 1, then the situation changes. However, in the problem we are free to design the case. So let us adjust the distortion function to avoid this issue.

  **Revised Case:** Let the drug, when administered, set the credence to c' = (c * (1-ε)) + ε * (1/2) for some small ε>0. That is, it pushes the credence slightly toward 1/2. Then:

  - If c=1, then c' = (1*(1-ε)) + ε/2 = 1 - ε/2.
  - If c=0, then c' = (0*(1-ε)) + ε/2 = ε/2.

  Now, without the drug, c remains 1 or 0.

  So at t2, the credence can be:

  - With probability 1-p: 1 (if E1 and no drug) or 0 (if E2 and no drug).
  - With probability p: 1 - ε/2 (if E1 and drug) or ε/2 (if E2 and drug).

  Therefore, Cr2(H) can take four possible values: 0, 1, ε/2, 1-ε/2.

  Now, we compute Cr0(H | Cr2(H)=x) for these x.

  First, note that:

  - The event [Cr2(H)=1] occurs only in the scenario: E1 (so H is true) and no drug. The probability of this event is Cr0(H) * (1-p).
  - The event [Cr2(H)=0] occurs only in the scenario: E2 (so H is false) and no drug. The probability of this event is (1-Cr0(H)) * (1-p).
  - The event [Cr2(H)=1-ε/2] occurs only in the scenario: E1 (so H is true) and drug. The probability is Cr0(H) * p.
  - The event [Cr2(H)=ε/2] occurs only in the scenario: E2 (so H is false) and drug. The probability is (1-Cr0(H)) * p.

  Now, conditional on [Cr2(H)=1], we have that H must be true (because this event only occurs when E1 occurs, which implies H). Similarly, conditional on [Cr2(H)=0], H must be false.

  Conditional on [Cr2(H)=1-ε/2], we have that H is true (because this event only occurs when E1 occurs). Similarly, conditional on [Cr2(H)=ε/2], H is false.

  Therefore:

    Cr0(H | Cr2(H)=1) = 1
    Cr0(H | Cr2(H)=0) = 0
    Cr0(H | Cr2(H)=1-ε/2) = 1
    Cr0(H | Cr2(H)=ε/2) = 0

  In no case is the conditional probability equal to x (except when x=1 and x=0, but even then only if we condition on the exact value that matches the truth). For example, when x = 1-ε/2, we have conditional probability 1, not 1-ε/2.

  Therefore, the literal Reflection identity fails.

  What should the conditional credence be? It is 1 if the future credence is either 1 or 1-ε/2 (because both occur only when H is true), and 0 if the future credence is 0 or ε/2. But note that the value of the future credence does not add any new information about H beyond what is already in the event [Cr2(H)=x]. In fact, the event [Cr2(H)=x] tells us exactly whether H is true or false, because:

  - If x is either 1 or 1-ε/2, then H is true.
  - If x is either 0 or ε/2, then H is false.

  Thus, the conditional credence is 1 if x is in {1, 1-ε/2} and 0 if x is in {0, ε/2}. This is not equal to x.

  (c) This case shows that the literal Reflection principle should not be understood as a universal requirement of rationality. Instead, it is valid only under specific conditions. In particular, it is often interpreted as a principle of deference to a later self who has more information. But in this case, the later self has been subjected to a distortion that makes her credence an unreliable guide. Therefore, Alice should not defer to her future self's credence in the way Reflection requires.

  The case suggests that Reflection is best understood as a coherence constraint that holds when the later credence is based on the same prior and the agent has updated by conditionalization on new evidence, and crucially, when there is no such distortion. The diachronic Dutch-book argument for Reflection assumes that the agent's future credences are formed rationally (by conditionalization) and that the bookie can exploit any violation of Reflection by placing bets at both times. However, in this case, the later self is impaired (by the drug) and thus not rational. The Dutch-book argument would not apply because the bookie cannot force the agent to accept bets that rely on her being rational at t2. Therefore, the Dutch-book argument supports a weaker principle: that Reflection holds when the agent expects to be rational at the future time.

  (d) The structural condition required for the literal Reflection identity to follow from conditionalization is that the future credence Cr2(H) is a function of the total evidence the agent will have acquired by time t2. Moreover, that function must be such that the evidence is recoverable from the credence. In other words, the mapping from the evidence to the future credence must be invertible. In the standard case, when the agent updates by conditionalization, her future credence in H is the conditional probability of H given the evidence. If the evidence partitions the possibility space, then knowing the future credence (which is the conditional probability) and knowing the evidence are equivalent. But in our case, the distortion process is not invertible: from the credence at t2, we cannot uniquely determine the evidence because different evidence states (and drug states) might lead to the same credence. However, note that in our revised case, each value of Cr2(H) corresponds to a unique combination of the evidence and the drug. But crucially, the event [Cr2(H)=x] does not just give information about the evidence but also about the drug. And since the drug is independent of H, it does not bear on H, but the event [Cr2(H)=x] does give information about H because it depends on the evidence (which is perfectly reliable) and the drug (which is independent). Therefore, the event [Cr2(H)=x] is informative about H.

  The condition that fails is that the future credence is a sufficient statistic for the evidence with respect to H. In other words, conditional on the future credence, H should be independent of the evidence. But in this case, conditional on the future credence, we can still deduce the evidence (because in our revised case, each value of x corresponds to a specific evidence and drug state), so H is determined by the future credence. However, the Reflection principle requires that the conditional credence equals x, which is not the case.

  The deeper condition is that the future credence must be the result of conditionalizing the prior on the evidence, without any further distortion. The Dutch-book argument assumes that the agent's future credences are the result of rational updating. Here, they are not, because of the drug.

  **Marking Scheme (out of 20 marks)**

  The strong answer must make the following five moves:

  1. **Recognize that the literal Reflection identity fails and explain why, with reference to the case.** (4 marks)  
     *Failure to catch:* Simply writing the Reflection formula without addressing the distortion.

  2. **Correctly compute the conditional credence Cr0(H | Cr2(H)=x) in the case (using either the initial or revised distortion function) and show that it is not equal to x.** (5 marks)  
     *Failure to catch:* Assuming that because the distortion is known and invertible, one can adjust for it and restore Reflection.

  3. **Interpret what the case shows about the Reflection principle, distinguishing between a coherence constraint and deference to an expert, and explain the bearing of the Dutch-book argument.** (5 marks)  
     *Failure to catch:* Treating the Dutch-book argument as decisive for the literal principle without considering the rationality of the future self.

  4. **Identify the structural condition that would allow Reflection to follow from conditionalization and explain why it fails here.** (4 marks)  
     *Failure to catch:* Conflating the martingale property (that the expectation of future credence equals current credence) with the literal Reflection identity.

  5. **Articulate what governs the case instead of Reflection (i.e., the correct conditional credence and the fact that the future credence event is informative about the truth of H).** (2 marks)  
     *Failure to catch:* Abandoning Reflection without providing an alternative account of the conditional credence.

  **Grading Distinction:**

  - **First-class answer (17-20):** Makes all five moves with clarity and precision, correctly computes the conditional probabilities in the revised case, and offers insightful discussion of the implications for the interpretation of Reflection and the Dutch-book argument.

  - **Good answer (13-16):** Makes moves 1, 2, 3, and 4 but may have minor errors in computation or less developed discussion of the interpretation.

  - **Bare pass (10-12):** Identifies that Reflection fails (move 1) and attempts move 2 and 3, but with significant gaps (e.g., not using a revised distortion function when necessary, or incomplete discussion of the Dutch-book).

  - **Fail (<10):** Misses key moves, for example, claims Reflection holds, or fails to compute the conditional credence, or does not address the structural condition.

  **The Exam Question as it Appears on the Paper:**

  ---

  **QUESTION X: VAN FRAASSEN'S REFLECTION PRINCIPLE**

  Alice is concerned with a hypothesis H. At time t0, she knows that at time t1 she will observe a perfectly reliable signal S about H. The signal S takes two values: S1 if H is true, and S2 if H is false. Thus, after observing S, she will know whether H is true or false. Alice updates her credences by conditionalization.

  However, independently of H and the signal, at time t1 (after observing the signal) Alice will be subjected to a pharmacological intervention with probability p (known to her at t0). With probability 1-p, no intervention occurs. If the intervention occurs, it deterministically alters her credence in H. Specifically, if her credence in H at t1 (after the signal) was c, then after the intervention her credence in H becomes:

     c' = (c * (1-ε)) + (ε/2)

  for some small fixed ε>0 (also known to her at t0). If no intervention occurs, her credence remains c.

  After time t1, the specification of whether the intervention occurred is erased from her memory. Thus, at a later time t2, she does not know whether the intervention occurred. She only knows the chance p and the value of ε. She cannot decline the intervention and has no later route to discovering whether it occurred.

  Let Cr0 be Alice's credence function at t0, and Cr2 her credence function at t2.

  (a) For a given real number x in [0,1], consider the proposition [Cr2(H)=x]. Does the literal Reflection identity hold? That is, is it true that for every x, Cr0(H | Cr2(H)=x) = x? (3 points)

  (b) Compute Cr0(H | Cr2(H)=x) for each possible value of x that has positive probability. If there are values of x for which the conditional probability is undefined, state that. (7 points)

  (c) What does this case show about the interpretation of the Reflection principle? In particular, should Reflection be understood as a coherence constraint on a present credal state, or as a principle of deference to a later self treated as an expert? And what does the diachronic Dutch-strategy argument for Reflection actually support? (5 points)

  (d) What structural condition on the relation between later credence and evidence is required for the literal Reflection identity to follow from conditionalization? Explain why this condition fails in the present case. (5 points)

