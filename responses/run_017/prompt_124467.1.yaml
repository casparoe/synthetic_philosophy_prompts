prompt: |-
  I write novels, not philosophy, but I got dragged into some of the animal-ethics stuff for a book a while back and now I notice this pattern everywhere and I don't have a word for it.

  Two instances from my own ms. A working farm dog gets killed — no name, two lines of description, not a pet. Readers were furious with me for chapters afterwards. Earlier in the same book a pig is slaughtered, described at about the same length, and I recieved exactly zero letters about it. Second instance: a beta reader told me a minor human character — a hired hand, maybe four lines total, dies offstage in a fire — "didn't really count as a death," and she meant that morally, not as a note about plotting. Meanwhile the villain, who gets a long chapter inside his head while he's doing something genuinely awful, got loads of sympathy.

  The pattern as I see it: readers hand out how-much-this-creature-counts in proportion to how much inner life the text actually *shows* them, and then take it back when the inner life shown is unpleasant or alien. The pig and the hired hand have whatever inner life pigs and hired hands have; what varies is a technique choice I made with a pen. It feels wierd to me that an aesthetic decision on my part is moving people's moral judgments around, including about real pigs, because readers do walk out of the book and apply it.

  Why I don't think the obvious words are it. Not the identifiable-victim thing or the numbers-are-too-big-to-feel thing: in both pairs it's one individual either way, the numbers are identical. Not anthropomorphism, if that means projecting human traits onto nonhumans — the dog isn't being read as a person in a human suit, it's being read as *someone*. And not just speciesism, because the hired hand gets the pig's treatment and he's an adult human.

  So: is there an established concept for this, on the ethics side or the narrative-theory side — moral concern tracking represented mind instead of actual mind? And the part I actually care about, so please don't skip it: which variable is doing the work? Amount of inner life shown, how hard you're pushed to imagine it from the inside, or how much the shown inner life resembles your own? Those three come apart across my examples and I can't tell which one I'm looking at. Then: is this a fact about how fiction works — there's nothing true of the pig beyond what I wrote, so nothing else is even available to track — or a fact about our moral psychology that fiction merely exposes? I'd definately like to know which, because if it's the second, my own reasons for not eating pigs are in worse shape than I'd like.

  Keep the answer under 600 words and lead with the bottom line: one or two sentences on whether it has a name and, if it doesn't, what you'd call it.
reasoning: |-
  Okay, the user writes novels and has noticed a pattern where readers' moral concern seems tied to how much inner life is shown in the text, regardless of whether it's an animal or human character. They gave examples: a farm dog's death caused outrage while a pig's slaughter didn't, and a minor human character's death "didn't count" compared to the villain who got sympathy. 

  The user wants to know if there's a term for this phenomenon - moral concern tracking represented mind rather than actual mind. They also want to understand which variable drives it: amount of inner life shown, the push to imagine from inside, or similarity to reader's own mind. And crucially, whether this is about how fiction works (since the text creates the reality) or about human moral psychology (which would challenge their own ethics around eating pigs).

  Hmm... this connects to several concepts I know. The identifiable victim effect is close but doesn't quite fit since the numbers are equal. Narrative empathy explains how techniques like interiority create bonds. The "problem of other minds" in philosophy is relevant too - we can only judge based on what's presented. 

  For terminology, "narrative moral salience" seems right - it captures how narrative techniques make certain beings morally visible. The key variable is likely the push to imagine from inside (what Keen calls "empathetic narrative") because in both cases where readers didn't care (pig, hired hand), there was no interiority shown. 

  The deeper issue is philosophical: is this just how fiction works (text as world) or does it reveal a flaw in human ethics? I think both - fiction exposes how our moral psychology relies on external cues since we can't access others' inner states directly. That doesn't necessarily invalidate the user's ethics about pigs though, as real pigs have rich inner lives even if not depicted. 

  The user seems intellectually honest - they're worried their pig ethics might be inconsistent. Good on them for confronting that. Their examples are sharp too, especially the human hired hand getting the "pig treatment." I should emphasize that narrative techniques trigger but don't create moral concern; they're just tools that activate our existing capacity for empathy.
answer: |-
  **Bottom line:** There's no single perfect term, but **narrative moral salience** captures the core idea. It describes how *represented* consciousness (via narrative techniques) triggers moral concern, often overshadowing inherent moral worth. This is primarily a fact about human moral psychology exposed by fiction.

  **The Concept:**
  *   **Narrative Moral Salience:** Your aesthetic choices (especially depicting inner life: thoughts, feelings, desires) make a character *morally visible* to readers.
  *   **Related Concepts:**
      *   **Narrative Empathy (Suzanne Keen):** How narrative techniques foster reader empathy.
      *   **The Problem of Other Minds (Philosophy):** The inherent difficulty in knowing another being's subjective experience; fiction provides a proxy.
      *   **"Fiction as Thought Experiment" (Martha Nussbaum etc.):** Fiction allows us to explore moral responses in controlled scenarios.

  **Which Variable?**
  The key driver is **how hard the text pushes readers to imagine the inner life from the inside** (Keen's "empathetic narrative"). 

  1.  **Amount Shown:** Your dog had *some* description (agency/work), pig/hired hand had minimal/none. The villain had maximum interiority. (Amount matters, but...)
  2.  **Push to Imagine:** The dog's role (working, loyal) *prompts* readers to infer a richer inner life than the pig or faceless hired hand, even without explicit POV. The villain's extended POV *forces* immersion. This push is crucial.
  3.  **Resemblance:** This modulates the *quality* of concern (sympathy vs. horror for the villain), but the *initial trigger* is the representation itself. We engage with alien minds *because* they are vividly presented.

  **Fiction Technique vs. Moral Psychology:**
  It's **both, but the psychology is fundamental.**

  1.  **Fiction's Constraint:** Within the text, the representation *is* the reality. The pig *only* exists for the reader as you wrote it. There's nothing *else* "true" in that fictional world to track. Fiction forces reliance on representation.
  2.  **Psychology Exposed:** However, this reliance mirrors our *real-world* struggle. We cannot directly access others' inner lives. We constantly infer consciousness and moral status based on *external cues* (behavior, appearance, similarity, narrative framing). Fiction exploits this by controlling the cues. Your readers' reactions reveal that **represented consciousness serves as the primary cue for triggering moral concern in human psychology, often more potent than abstract knowledge of inherent worth.**

  **Implication for Your Ethics:**
  Your concern about eating pigs is *not* necessarily undermined. Fiction reveals a psychological *bias*, not the full scope of ethics. Real pigs demonstrably possess complex inner lives (sentience, emotions, social bonds) *independent* of narrative depiction. Your ethics likely stem from acknowledging this *evidence*, not a fictional portrayal. Fiction exposes our *default* psychological shortcut (tracking the easily represented), but ethical reasoning can (and should) consider evidence beyond immediate, easily evoked representations. The bias exists, but awareness allows us to correct for it.
