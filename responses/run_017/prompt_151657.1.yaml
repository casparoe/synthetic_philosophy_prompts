prompt: |-
  I chair the serious-incident review committee at a 600-bed teaching hospital, and I want to replace the way we write causal statements with something my committee can actually run.

  Context: we review roughly a dozen incidents a month. Every review ends in a written report with (a) a causal statement — what caused the harm to this patient — and (b) the corrective actions we will take. The report goes to the board, and for the serious ones to the regulator and potentially into litigation, so the wording has to be defensible under hostile questioning. The committee is two physicians, a risk manager, a quality-improvement nurse and me; nobody has any training in causal inference beyond a regression module years ago. We have ninety minutes per case, the incident timeline, the chart, and whatever data we already collect routinely. We cannot commission new studies, and we will not adopt a procedure that needs a statistician in the room.

  What I want is a decision procedure for the causal statement, built on the two families of account that philosophers actually dispute: counterfactual-dependence accounts in the Lewis line, on which X caused Y roughly because, had X not occurred, Y would not have; and interventionist accounts in the Woodward line, on which X causes Y because there is some intervention that sets X to a different value and changes Y with everything else held fixed. I am not asking you to adjudicate between them. I am asking you to turn what each one gives us into a checklist we can run in about fifteen minutes per claim, and to be explicit at every step about which account is doing the work, because they come apart in ways we keep tripping over.

  Design constraints:

  - Ordered questions, each with a stated sufficiency condition (what a yes has to consist in) and an explicit stop: either a hard no that kills the claim, or a flag that routes the factor elsewhere in the report.
  - The distinctions that have to survive the translation into plain English: the contrast class (caused relative to what — X at one value versus X at another, not X happened); whether the counterfactual comes out true only on a backtracking reading, that is only if we also change something upstream of X, which is the move that makes our risk scores, early-warning scores and abnormal lab values look causal when they are only tracking a common upstream condition; whether the intervention we can imagine is surgical, setting X directly and breaking the other routes into X, or only works by first changing something else that also reaches the outcome by a second route; whether the effect is invariant across the different routes by which we could set X — permanent staffing versus agency cover, automated alert versus staff training — since if the answer depends on the route, X was never one variable; whether we may test the intervention against any admissible background setting of the other factors or only against what actually happened that night, together with a bound on admissible so that we do not end up calling everything a cause; and what to do with factors nobody can set, such as the patient's age, frailty, sex, race or rural address, including the case where the honest intervention is on someone else's perception of that factor rather than on the factor itself.
  - A tie-break rule for when the two accounts disagree, and a short ladder of permitted language — cause, contributing factor, risk stratifier, marker — with the condition for each rung, because most of our arguments are really about which rung a factor belongs on.
  - Honesty about where judgment cannot be eliminated: which variables belong in the model, how far upstream we trace, how much invariance is enough, whether an intervention counts as available for us (physically possible, legally permitted, fundable by next quarter), and the gap between the general-level evidence we actually have and the single-case attribution we have to write, given that the interventionist test is naturally about what happens in general while our report is about this patient on this night. Mark those as sign-off points for me rather than as questions with answers.

  Then run the finished procedure step by step on three shapes of case from our last quarter:

  1. An abnormal set of observations on a ward round was documented but not escalated; the patient arrested several hours later. The committee wants to write that the failure to escalate caused the arrest.
  2. The patient was eighty-four and frail. The committee wants frailty named in the causal statement, because it is the thing everyone brings up in the meeting.
  3. The infusion pump was programmed at ten times the intended rate and, independently, the patient was given a second drug at a dose that would on its own have produced the same toxicity. Either would have done it alone.

  At least one of these should come out in a way the committee will dislike — my guess is that the counterfactual reading and the interventionist reading will not both give us what we want in the third case — and I want that result left as it comes out rather than softened.

  Finally, tell me plainly what the procedure cannot do: which of our recurring questions it has no purchase on, which kinds of incident it will systematically misgrade (rare events, omissions and things that did not happen, harm avoided by luck), and where it will return confident-sounding answers that are really metaphysical positions in disguise.
reasoning: |-
  We are designing a decision procedure for causal statements in incident reviews. The procedure must be based on two philosophical accounts: counterfactual dependence (Lewis) and interventionism (Woodward). The goal is a checklist that can be run in about 15 minutes per claim, with explicit labeling of which account is at work.

  Design constraints:
  - Ordered questions with sufficiency conditions and explicit stops (hard no or flag for routing).
  - Must handle: contrast class (X at one value vs. another), avoiding backtracking in counterfactuals, surgical vs. non-surgical interventions, invariance across intervention routes, admissible background conditions, and factors that cannot be set (like patient characteristics).
  - Tie-break rule for when the two accounts disagree, and a ladder of language (cause, contributing factor, risk stratifier, marker) with conditions.
  - Mark judgment points for sign-off by the chair.

  We then apply the procedure to three cases.

  The procedure cannot avoid judgment in:
  - Choosing the variables in the model.
  - How far upstream to trace.
  - How much invariance is enough.
  - What interventions are available.
  - Bridging the gap between general evidence and single-case attribution.

  We are to be explicit about what the procedure cannot handle.

  Let's design the procedure step by step.

  ---

  **Causal Attribution Procedure**

  **Preliminary Step: Define the Event and Harm**
  - Clearly state the harmful outcome Y (e.g., patient arrest) and the specific factor X being considered for causal attribution (e.g., failure to escalate).
  - Define the contrast class for X: what alternative value(s) of X are we considering? (e.g., for failure to escalate, the contrast is escalation occurring; for frailty, it might be a less frail state, but note that frailty is not easily changeable).

  **Step 1: Counterfactual Dependence Check (Lewis-style)**
     *Question 1.1: Would the harm Y have been avoided if X had been at the alternative value (in the contrast class), holding fixed the actual circumstances (without backtracking)?*
     - Sufficiency condition: We have a plausible and non-backtracking counterfactual scenario in which X is changed to the alternative value and Y does not occur. The change in X must be direct (without changing prior causes of X) and the scenario must be realistic given the actual circumstances.
     - How to assess: Use the timeline and known facts. If changing X alone (without altering prior events) would have prevented Y, then the counterfactual holds.
     - Stop conditions:
       - If yes, move to Step 2 (interventionist check).
       - If no, and the counterfactual fails because changing X alone would not avoid Y (even in a non-backtracking way), then X is not a cause by counterfactual dependence. Route X to Step 3 for alternative categorization.
       - If the counterfactual only holds by backtracking (i.e., we must change some prior event to change X, and that prior event also independently affects Y), then flag this as a potential confounder and route to Step 3.

  **Step 2: Interventionist Check (Woodward-style)**
     *Question 2.1: Is there an intervention (available in principle) that sets X to the alternative value (from the contrast class) which would change Y, while holding fixed other variables at their actual (or admissible) background settings?*
     - Sufficiency condition: We can describe an intervention that (a) is surgical (directly sets X without affecting other pathways to Y) and (b) in the actual background conditions (or in a range of admissible backgrounds) would change the outcome. The effect should be invariant across the different ways we might set X (e.g., if we can set X by multiple interventions, they all lead to the same change in Y).
     - How to assess: Consider if there is a way to directly manipulate X (e.g., by policy, training, device redesign) that would break the link from the actual value of X to Y. The intervention must not rely on changing other variables that are also causes of Y.
     - Stop conditions:
       - If yes, then X is a cause by both accounts. Use the strongest language ("cause").
       - If no, because the intervention is not surgical (i.e., it affects other variables that also influence Y), then X might still be a contributing factor. Route to Step 3.
       - If no, because the effect is not invariant (i.e., the outcome change depends on how we set X), then X is not a stable cause. Route to Step 3 to consider as a marker or risk stratifier.
       - If no, because there is no available intervention (even in principle) that sets X (e.g., for patient frailty), then route to Step 3.

  **Step 3: Alternative Categorization (for factors that didn't pass Steps 1 or 2)**
     *Question 3.1: Does X meet the conditions for being a contributing factor?*
     - Conditions: 
       - There is a counterfactual scenario (even if it requires backtracking) in which changing X (or an intervention on X) reduces the harm or the chance of harm, but it is not clear that it would have avoided the harm entirely in the actual circumstance.
       - Or, the interventionist test partially holds (e.g., an intervention on X changes the probability of Y, but not deterministically).
     - If yes, categorize as "contributing factor".
     - If no, move to Question 3.2.

     *Question 3.2: Is X a risk stratifier or marker?*
     - Conditions: 
       - X is associated with the outcome but not modifiable (e.g., age, frailty) and/or changing X (even by intervention) does not change the outcome (because it's not the cause but a correlate). 
       - Or, there is no direct causal link but X is useful for predicting the outcome or targeting interventions elsewhere.
     - If yes, categorize as "risk stratifier" (if it can be used for risk assessment) or "marker" (if it's just associated).
     - If none of these, then X is not causally relevant. Do not include in the causal statement.

  **Tie-break Rule:**
  - If the counterfactual account (Step 1) says yes and the interventionist account (Step 2) says no, then:
    - If the interventionist rejection is due to lack of invariance or non-surgical intervention, then downgrade to "contributing factor".
    - If the interventionist rejection is due to the factor being unchangeable (like frailty), then categorize as a "risk stratifier" or "marker".
  - If Step 1 says no and Step 2 says yes, then:
    - This is unlikely because if an intervention can change Y by changing X, then in the actual situation the counterfactual should hold (unless there are issues of preemption or overdetermination). But if it occurs, trust Step 2 and call it a cause (because interventionism is more robust to preemption).

  **Ladder of Language:**
  - **Cause**: Passes both Step 1 and Step 2.
  - **Contributing factor**: Fails one or both steps but meets the conditions in Step 3.1 (e.g., it played a role but might not have been sufficient alone, or the intervention is not clean).
  - **Risk stratifier**: A factor that is useful for identifying at-risk patients but not modifiable (Step 3.2).
  - **Marker**: A factor that is associated with the outcome but not causal and not necessarily useful for risk stratification (Step 3.2).

  **Judgment Points (for chair sign-off):**
  1. **Variable Selection**: Which factors are considered? (e.g., why include frailty but not the color of the walls?)
  2. **Contrast Class**: What alternative value of X is chosen? (e.g., for failure to escalate, the alternative is escalation; for frailty, what is a less frail state?)
  3. **Admissible Background Conditions**: In the interventionist test, what range of background conditions are we holding fixed? (Only the actual night? A typical night? The chair must decide based on available evidence and the purpose of the report.)
  4. **Intervention Availability**: What counts as an available intervention? (Must it be feasible by next quarter? Only physically possible? The chair must set the boundary.)
  5. **Invariance Threshold**: How similar must the effect be across intervention routes? (The chair must decide based on committee consensus.)
  6. **Bridging the Gap**: How do we apply general evidence (e.g., studies on escalation) to this specific case? (The chair must weigh the evidence and decide if it applies.)

  **What the Procedure Cannot Do:**
  - **Rare Events**: If the outcome is rare, the counterfactual might be hard to assess because we don't have enough data to know what would have happened. The procedure might over- or under-attribute.
  - **Omissions and Non-Events**: The counterfactual for omissions (like failure to escalate) is natural, but interventions on omissions are tricky (how do we "set" an omission? by ensuring the action occurs?).
  - **Harm Avoided by Luck**: If an incident almost happened but was caught by chance, the procedure might not capture near misses.
  - **Overdetermination and Preemption**: In cases with multiple sufficient causes (like the infusion pump case), the counterfactual test might fail (because even if we remove one cause, the other still causes the harm) but the interventionist test might still show that each is a cause (because intervening on each would change the outcome in scenarios where the other is not present). However, in the specific case where both are present and either alone would have sufficed, the counterfactual for each fails (so Step 1 says no for each) but the interventionist might say yes (if we can intervene to prevent one, then the outcome would not have occurred). The tie-break rule (trust Step 2) would then call it a cause.
  - **Metaphysical Positions**: The procedure relies on the chosen accounts. For example, counterfactual accounts might not count preempted causes as causes, while interventionist accounts might. The procedure will reflect these underlying views.

  Now, let's apply the procedure to the three cases.

  ---

  **Case 1: Failure to escalate caused the arrest?**
  - Factor X: Failure to escalate the abnormal observations.
  - Contrast class: Escalation occurring (i.e., the observations were escalated).
  - Harm Y: Patient arrest.

  *Step 1: Counterfactual Dependence*
  - Question 1.1: If the abnormal observations had been escalated, would the arrest have been avoided? (Without backtracking: we don't change prior events, just the escalation.)
  - Assessment: Based on the timeline, if escalation would have led to timely intervention (e.g., critical care review, treatment) that would have prevented the arrest, then yes.
  - In this case, likely yes. (Assume that escalation would have led to an effective intervention.)

  *Step 2: Interventionist Check*
  - Question 2.1: Is there a surgical intervention that sets escalation to "yes" and prevents the arrest? 
  - Intervention example: A policy that ensures escalation when abnormal observations are documented (e.g., an automated alert or mandatory call). This intervention directly targets the escalation process without altering other pathways (assuming it doesn't change the observations themselves or the patient's condition).
  - Invariance: The effect should hold across different ways to ensure escalation (e.g., training, alerts, staffing changes) if they all lead to escalation when needed.
  - Likely yes, if we believe that escalation in this case would have prevented the arrest.

  *Result*: Both steps pass. **Causal statement: "The failure to escalate caused the arrest."**

  ---

  **Case 2: Frailty caused the harm?**
  - Factor X: Patient frailty (say, high frailty score).
  - Contrast class: A less frail state (but note: this is not changeable for that patient at that time).
  - Harm Y: The specific harm (e.g., death, complication).

  *Step 1: Counterfactual Dependence*
  - Question 1.1: If the patient had been less frail, would the harm have been avoided? (Without backtracking: we don't change the patient's age or prior health, which is impossible. But we can imagine a counterfactual world where the patient is less frail and the same incident occurs.)
  - Assessment: This requires backtracking because to make the patient less frail we have to change their past. Without backtracking, we cannot change frailty without changing prior causes. Thus, the counterfactual is backtracking and fails the condition.

  *Step 2: Interventionist Check*
  - Question 2.1: Is there an intervention that sets frailty to a lower value? 
  - No, because we cannot change frailty at the time of the incident. Even if we consider interventions that reduce frailty over time (like exercise programs), that is not setting X at the time of the incident. 
  - Alternatively, if we consider interventions on how frailty is perceived (e.g., by adjusting treatment plans based on frailty), then we are not intervening on frailty itself but on how clinicians respond to it. This would be an intervention on a different variable (e.g., clinical decision-making).

  *Result*: Both steps fail. Move to Step 3.

  *Step 3: Alternative Categorization*
  - Question 3.1: Contributing factor? 
    - If frailty made the patient more susceptible to harm (e.g., a less frail patient might have survived the same error), then it played a role. But note: in the actual event, we cannot change it. The counterfactual with backtracking might show that if the patient had been less frail, the harm would not have occurred, but that's backtracking.
    - However, the committee must decide if it meets the contributing factor condition. Given that it is unmodifiable, we might not call it a cause.

  - Question 3.2: Risk stratifier or marker?
    - Frailty is a known risk factor. It can be used to identify patients who need more careful monitoring or adjusted treatment. 
    - So, categorize as a "risk stratifier".

  *Causal statement*: **Do not list frailty as a cause. Instead, note: "The patient's frailty was a risk stratifier, increasing vulnerability to harm."**

  ---

  **Case 3: Overdetermination (infusion pump and second drug)**
  - We have two factors:
    - X1: Infusion pump programmed at 10x rate.
    - X2: Second drug given at a toxic dose.

  - Harm Y: Toxicity (e.g., organ damage).

  - We'll consider each factor separately.

  *For X1 (pump error):*
  - Contrast class: Pump programmed correctly.

  *Step 1: Counterfactual Dependence*
  - Question 1.1: If the pump had been programmed correctly, would the toxicity have been avoided?
  - Assessment: No, because the second drug (X2) would have still caused the toxicity. So the harm would have occurred anyway. Thus, counterfactual dependence fails.

  *Step 2: Interventionist Check*
  - Question 2.1: Is there an intervention that sets the pump to the correct rate and that would have avoided the toxicity?
  - In this specific case, if we intervene to set the pump correctly, the second drug is still given at a toxic dose, so the toxicity still occurs. So, no.

  *Result for X1*: Both steps fail. Move to Step 3.

  *Step 3 for X1*: 
  - Question 3.1: Contributing factor? 
    - Since the pump error was sufficient to cause the toxicity (but for the presence of the second drug, it would have been the cause), and if we removed both factors the harm would not have occurred, we might consider it a contributing factor. But note: in the actual scenario, it was not necessary because the second drug was present.
    - However, we can argue that the pump error increased the harm (if the toxicity was worse because of both) or that it was a factor that contributed to the harm occurring at the time it did. But in this case, the harm would have occurred anyway from the second drug. So it might not have changed the outcome.

    This is tricky. The committee might note that the pump error was a sufficient cause but not necessary. In Step 3.1, we might say it is a contributing factor because it was part of the causal set that produced the harm.

  *For X2 (second drug):* 
  - Similarly, Step 1 fails because if the second drug had not been given, the pump error would have caused the toxicity. 
  - Step 2 also fails for the same reason.

  *Step 3 for X2*: Same as for X1.

  *Tie-break and Overdetermination*:
  - In overdetermination cases, the counterfactual account fails for each factor because the harm would have occurred without either one (due to the other). The interventionist account, when applied to the single case, also fails because intervening on one factor doesn't change the outcome (since the other is still present). 
  - However, note that the interventionist account is usually defined for types, not tokens. In general, if we ask "does X cause Y?" we mean that there is an intervention on X that changes Y in some contexts. In this case, in the absence of the other factor, an intervention on X would change Y. But in the actual context (with both present), the intervention on one factor doesn't change the outcome.

  - The procedure (as designed for single cases) fails both steps for each factor. So we go to Step 3 for each.

  - In Step 3, we might categorize both as "contributing factors" because each was sufficient and they jointly caused the harm (even though either alone would have sufficed). Alternatively, we might say that they are both causes in a broader sense.

  - But note: the committee might dislike this because they feel each should be called a cause.

  *Alternative Approach*:
  - We can consider the harm as occurring at a specific time and in a specific manner. If the two factors caused the harm to occur earlier or in a more severe form, then changing one might have changed the timing or severity. But the problem says "the same toxicity", so we assume the harm is the same.

  *Causal statement*: **We cannot call either factor a "cause" by the strict procedure. Instead, we might say: "The harm was caused by the combination of the pump programming error and the administration of the second drug at a toxic dose. Each was independently sufficient to cause the harm."** 

  But note: the procedure does not have a category for "sufficient cause" when not necessary. We might need to extend the language ladder. However, the procedure as designed would put each as a "contributing factor" because they were part of the causal set.

  *Chair Judgment*: The chair might note that in overdetermination cases, the standard counterfactual account fails, but we can use a different contrast (e.g., removing both factors) to show that the harm would not have occurred. Then, we can say that the disjunction (X1 or X2) is a cause. But we are testing each factor individually.

  Given the constraints, the procedure outputs:
  - For X1: Contributing factor.
  - For X2: Contributing factor.

  But the committee might want to call both causes. However, the procedure does not allow that because neither passed Step 1 or 2.

  ---

  **What the Procedure Cannot Do:**
  - **Recurring Questions without Data**: If we lack data to assess the counterfactual (e.g., what would have happened if we escalated?), we have to rely on judgment.
  - **Omissions**: The procedure handles omissions (like failure to escalate) by contrasting with the action occurring. This is built in.
  - **Near Misses**: If harm was avoided by luck (e.g., a nurse happened to check), the procedure is for incidents that caused harm. It does not analyze near misses.
  - **Rare Events**: The counterfactual might be speculative. The procedure assumes we can make reasonable inferences.
  - **Overdetermination**: As in Case 3, the procedure fails to call each factor a cause by the strict tests, even though intuitively they are. This is a known limitation of the counterfactual account.
  - **Systematic Misgrading**: 
    - Preemption: If one factor causes the harm just before the other would have, then the counterfactual holds for the first factor (if we remove it, the harm wouldn't have occurred at that time) and fails for the second. The interventionist might also hold for the first. But if the second factor is the one we are considering, it fails. This might be misgraded.
    - Omissions: The procedure should handle them, but interventions on omissions are about ensuring the action occurs, which might not be surgical if it affects multiple behaviors.
  - **Metaphysical Positions**: The answers are based on the chosen accounts. For example, in overdetermination, the procedure (using counterfactual dependence) says the factors are not causes, which is a specific philosophical stance.

  ---

  **Final Note**: The chair must use judgment at the sign-off points, especially for the hard cases. The procedure is a tool to structure the discussion and make the reasoning explicit, but it does not eliminate the need for expert judgment.
answer: |-
  Below is a causal attribution decision procedure designed for your committee, grounded in the philosophical accounts of counterfactual dependence (Lewis) and interventionism (Woodward). The procedure is structured as a checklist with ordered questions, explicit stops, and clear routing. It includes a tie-break rule, a language ladder for causal statements, and marks judgment points for chair sign-off. I then apply it to your three cases and conclude with limitations.

  ---

  ### **Causal Attribution Procedure**  
  **Purpose**: To determine if factor \(X\) (e.g., failure to escalate, frailty) caused harm \(Y\) (e.g., arrest, toxicity) in a specific incident.  
  **Inputs**: Timeline, chart data, routine data (no new studies).  
  **Time Allocation**: ≤15 minutes per claim.  
  **Output**: Causal statement with standardized language (cause/contributing factor/risk stratifier/marker).  

  #### **Step 0: Define the Claim** (1 minute)  
  - **Question**: What is \(X\) (the factor) and \(Y\) (the harm)? Specify the contrast class for \(X\): "\(X = x_1\) caused \(Y\)" vs. "\(X = x_2\)" (e.g., "failure to escalate" vs. "escalation occurred").  
  - **Stop if**: \(X\) is vague (e.g., "human error"). Redefine \(X\) concretely.  
  - **Judgment Point**: Chair signs off on \(X\), \(Y\), and contrast class.  

  #### **Step 1: Counterfactual Dependence Check** (Lewis Account) (4 minutes)  
  - **Question 1.1**: In the actual circumstances, if \(X\) had been at \(x_2\) (contrast class), would \(Y\) not have occurred?  
    - *Sufficiency condition*: A "yes" requires a non-backtracking counterfactual (no changes to upstream factors like patient physiology or prior events).  
    - *Assessment*: Use timeline/chart to test if changing *only* \(X\) (e.g., escalating) would prevent \(Y\). Ignore general evidence (e.g., "escalation usually helps").  
  - **Stop if**:  
    - **Hard No**: \(Y\) would still occur (e.g., harm was inevitable). Route \(X\) to Step 3.  
    - **Flag**: Counterfactual only true via backtracking (e.g., changing \(X\) requires changing an upstream factor like sepsis, which independently causes \(Y\)). Route \(X\) to Step 3 as "non-causal correlate."  
    - **Yes**: Proceed to Step 2.  

  #### **Step 2: Interventionist Check** (Woodward Account) (5 minutes)  
  - **Question 2.1**: Is there an intervention \(I\) that sets \(X = x_2\) (surgically, without changing other \(Y\)-causing paths) and changes \(Y\)?  
    - *Sufficiency condition*: \(I\) must be:  
      - **Surgical**: Directly targets \(X\) (e.g., forcing escalation via policy) without altering unrelated paths (e.g., not by changing staffing, which affects other outcomes).  
      - **Invariant**: Effect holds across >1 feasible intervention route (e.g., automated alerts AND staff training both prevent \(Y\)). If effect depends on the route, \(X\) is not a stable variable → **Flag as "variable mismatch."**  
    - **Background Admissibility**: Test \(I\) against:  
      - Actual conditions (e.g., that night’s staffing).  
      - **Bound**: Only backgrounds consistent with hospital data (e.g., avoid hypotheticals like "if the nurse was Superman").  
  - **Question 2.2**: Is \(I\) "available"? (Physically possible, legal, fundable by next quarter).  
  - **Stop if**:  
    - **Hard No**: No invariant surgical \(I\) exists (e.g., no way to set frailty). Route to Step 3.  
    - **Flag**: \(I\) is non-surgical (e.g., reducing frailty requires changing diet, which also affects comorbidities). Route to Step 3.  
    - **Yes**: \(X\) is a **cause**.  

  #### **Step 3: Tie-Break and Routing** (3 minutes)  
  - **Input**: Results from Steps 1–2.  
  - **Tie-Break Rule**:  
    | Step 1 | Step 2 | Outcome |  
    |--------|--------|---------|  
    | Yes | No | Downgrade to "contributing factor" (interventionism prioritizes stability). |  
    | No | Yes | Upgrade to "cause" (counterfactuals fail in preemption; interventionism handles it). |  
    | Conflict | Conflict | Use interventionism (more objective; less prone to backtracking errors). |  
  - **Route to Language Ladder**:  
    - **Cause**: Passes both steps (or tie-break).  
    - **Contributing factor**: Fails one step but plays a role (e.g., \(X\) worsened \(Y\) or increased risk).  
    - **Risk stratifier**: Unmodifiable \(X\) (e.g., age) that predicts \(Y\) but isn’t causal.  
    - **Marker**: Non-causal correlate (e.g., rural address) with no intervention value.  

  #### **Step 4: Finalize Language** (2 minutes)  
  - **Conditions for Ladder**:  
    - **Cause**: \(X\) passes Steps 1–2 (or tie-break).  
    - **Contributing factor**: \(X\) fails Step 1 or 2 but:  
      - Counterfactual shows reduced harm severity/probability, or  
      - Intervention shows probabilistic benefit.  
    - **Risk stratifier**: \(X\) unmodifiable (e.g., frailty) but predicts \(Y\) (e.g., guides resource allocation).  
    - **Marker**: Fails all tests; mere correlation (e.g., race due to bias upstream).  
  - **Output**: Causal statement with chosen language.  

  #### **Judgment Points (Chair Sign-Off)**  
  1. **Variable/contrast class selection** (Step 0).  
  2. **Background admissibility** (Step 2.1: What counts as "actual conditions"?).  
  3. **Intervention availability** (Step 2.2: Is \(I\) "feasible"?).  
  4. **Invariance threshold** (Step 2.1: How many intervention routes are needed?).  
  5. **Bridging general evidence** (e.g., studies) to this case.  

  ---

  ### **Case Applications**  
  #### **Case 1: Failure to Escalate Caused Arrest?**  
  - **\(X\)**: Failure to escalate abnormal observations.  
  - **Contrast class**: Escalation occurred.  
  - **\(Y\)**: Arrest.  
  - **Step 1 (Counterfactual)**:  
    - Non-backtracking counterfactual: If escalated, would arrest have been avoided?  
      - *Yes* (if escalation leads to intervention that prevents arrest, per timeline).  
  - **Step 2 (Interventionist)**:  
    - Surgical \(I\): Automated alert system (sets escalation directly).  
    - Invariant: Holds for alerts or mandatory training (both change outcome).  
    - Available: Yes (feasible policy).  
  - **Result**: **Cause** (both steps passed).  
  - **Statement**: "Failure to escalate caused the arrest."  

  #### **Case 2: Should Frailty Be Named as a Cause?**  
  - **\(X\)**: Frailty.  
  - **Contrast class**: Less frail state.  
  - **\(Y\)**: Harm (e.g., death from error).  
  - **Step 1 (Counterfactual)**:  
    - Counterfactual: If patient was less frail, would harm have been avoided?  
      - *Hard No*: Requires backtracking (changing age/disease history), which alters upstream factors.  
  - **Step 2 (Interventionist)**:  
    - Surgical \(I\)? None (cannot set frailty at will).  
    - Non-surgical \(I\) (e.g., geriatric care pathways) affects other variables (e.g., staffing).  
    - **Hard No**: No invariant surgical intervention.  
  - **Tie-Break**: Not needed (both fail).  
  - **Route to Step 3**:  
    - Contributing factor? No (no modifiable role in incident).  
    - Risk stratifier? Yes (predicts vulnerability).  
  - **Result**: **Risk stratifier**.  
  - **Statement**: "Frailty was a risk stratifier; it increased vulnerability to harm."  
  - **Committee Discomfort Addressed**: Frailty is included but not as a cause, per philosophy.  

  #### **Case 3: Overdetermined Harm (Infusion Pump and Second Drug)**  
  - **Claim 1: Pump Error Caused Toxicity?**  
    - **\(X\)**: Pump programmed at 10x rate.  
    - **Contrast class**: Correct pump rate.  
    - **\(Y\)**: Toxicity.  
    - **Step 1 (Counterfactual)**:  
      - If pump correct, would toxicity be avoided? *No* (second drug alone caused it).  
    - **Step 2 (Interventionist)**:  
      - Surgical \(I\): Pump safety feature (sets rate directly).  
      - *But*: In actual background (second drug given), \(I\) does not change \(Y\) (toxicity still occurs). → **Hard No**.  
    - **Route to Step 3**:  
      - Contributing factor? *Yes* (sufficient to cause \(Y\) independently; part of causal set).  
  - **Claim 2: Second Drug Caused Toxicity?**  
    - Identical result: Fails Steps 1–2 → **Contributing factor**.  
  - **Result**: **Contributing factor** for both.  
  - **Statement**: "The pump error and second drug overdose were contributing factors; either alone was sufficient to cause toxicity."  
  - **Committee Discomfort**: Neither is a "cause" under counterfactual dependence (due to overdetermination), but interventionism flags both as modifiable risks. Tie-break resolves to contributing factor.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Recurring Questions with No Purchase**:  
     - **Rare Events**: Incidents with no prior data (e.g., novel errors) rely on chair judgment; procedure cannot infer counterfactuals without anchors.  
     - **Omissions/Non-Events**: E.g., "failure to check records" requires defining a contrast class ("checking occurred"), but interventionism struggles if no surgical \(I\) exists (e.g., how to "set" vigilance?).  
     - **Harm Avoided by Luck**: Near-misses are out of scope (procedure requires actual harm \(Y\)).  

  2. **Systematic Misgrading**:  
     - **Overdetermination (Case 3)**: Counterfactual dependence falsely dismisses causes (both \(X\)s fail Step 1). Interventionism partially rescues this via tie-break.  
     - **Preemption**: If \(X1\) causes harm just before \(X2\) would, counterfactual dependence passes for \(X1\) but fails for \(X2\) (misgrading \(X2\) as non-causal).  
     - **Probabilistic Causation**: E.g., "delay increased risk of arrest" (without certainty) often downgraded to "contributing factor" even if pivotal.  

  3. **Confident-Sounding Metaphysical Positions**:  
     - **Counterfactual Dependence**: Assumes deterministic worlds (all-or-nothing outcomes); masks uncertainty in "what would have happened."  
     - **Interventionism**: Treats "surgical interventions" as objective, but feasibility (Step 2.2) is value-laden (e.g., "fundable by next quarter" reflects hospital priorities).  
     - **Single-Case vs. General Evidence**: Procedure forces single-case attribution, but interventionism is population-level (e.g., "escalation prevents arrest" may not hold *this time*).  

  **Recommendation**: Use this procedure to standardize arguments, but train the committee on the philosophical underpinnings to reduce "tripping over" distinctions. For contentious cases (e.g., Case 3), the chair’s sign-off on judgment points is critical for defensibility.
