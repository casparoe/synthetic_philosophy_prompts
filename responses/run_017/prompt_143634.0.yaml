  ### Audit of Your Claims on the Two-Envelope Paradox  
  I'll address your seven claims, identify conflicts, and explain the arithmetic where necessary. The focus is on consistency between your specific assertions, not a general literature review. Claims are analyzed in the context of plain expected money (as per your method in (5)).

  #### **(1) Closed envelopes, before you look: switching and staying are exactly equally good.**  
  This is correct. Assume the envelopes contain amounts \(A\) and \(2A\). Your expected value from staying:  
  \[
  \frac{1}{2} \times A + \frac{1}{2} \times 2A = \frac{3A}{2}.
  \]  
  Expected value from switching:  
  \[
  \frac{1}{2} \times 2A + \frac{1}{2} \times A = \frac{3A}{2}.
  \]  
  Both policies ("always stay" and "always switch") yield identical expected values. No conflict with other claims yet.  

  #### **(2) Open envelope with known discrete uniform prior: switch on small amounts, stay on large ones (e.g., smaller amount uniform on {$5, $10, ..., $50}).**  
  This is correct. Suppose you observe amount \(x\). The smaller amount \(S\) is uniform on {$5, $10, ..., $50$}, so pairs are \((S, 2S)\). For \(x = 5\):  
  - Only possible if you have the smaller envelope (pair \((5, 10)\)). Switching guarantees $10 > $5.  
  For \(x = 100\):  
  - Only possible if you have the larger envelope (pair \((50, 100)\)). Switching yields $50 < $100.  
  For \(x = 10\):  
  - Two equally likely cases:  
    - Smallest in pair \((10, 20)\): you have $10 (smaller), switching gives $20.  
    - Largest in pair \((5, 10)\): you have $10 (larger), switching gives $5.  
  - Expected value of switching: \(\frac{1}{2} \times 20 + \frac{1}{2} \times 5 = 12.5 > 10\).  
  Similar calculations for other \(x\) show:  
  - Switch if \(x \leq 50\) (expected gain > \(x\)).  
  - Stay only if \(x = 100\).  
  This does **not** contradict (1): (1) is about unconditional switching (no observation), while (2) uses the observation to conditionally switch. Arithmetic confirms (2) is optimal given the prior.  

  #### **(3) Diagnosis: The 50/50 assumption isn't free; it implies an improper prior.**  
