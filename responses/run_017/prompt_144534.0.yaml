  We are going to construct a scenario in biogeography, a field science, involving the distribution of a species of moth.

  **Scenario:** A team of biogeographers studies a rare moth species, *Arctia aurantiaca*, in a remote mountain range. They observe that the moths have bright orange wings when found on the western slopes (where the dominant flora is heather) but are dull brown on the eastern slopes (where the dominant flora is bilberry). They have recorded 100 sightings, all fitting this pattern: west slopes always orange, east slopes always brown. The team is now about to survey a newly accessible northern valley, which has a mixed flora including both heather and bilberry. They wish to predict the color of the moth in this new valley. The community has two candidate hypotheses:

  1. **Hypothesis A (Color-by-Slope):** Moths on the western side of any ridge are orange, those on the eastern side are brown. (This is the entrenched predicate, having been used in all past projections about the moth.)

  2. **Hypothesis B (Color-by-Plant):** Moths are orange when on heather and brown when on bilberry, regardless of slope. (This predicate is natural: it keys on the plant species, which are known to be ecologically significant and are part of a well-established taxonomy.)

  Note that in the original 100 sightings, the western slope had heather and the eastern slope had bilberry, so both hypotheses fit the data. The northern valley, however, has both plants on both slopes. In particular, there is a patch of heather on the eastern slope and a patch of bilberry on the western slope. Hypothesis A predicts that in the northern valley, moths on the western slope (even on bilberry) will be orange and on the eastern slope (even on heather) will be brown. Hypothesis B predicts that moths on heather (even on the eastern slope) will be orange and on bilberry (even on the western slope) will be brown.

  **Entrenchment vs. Naturalness:**

  - The **entrenchment response** (Goodman) would project the predicate with the stronger track record of past projections. Hypothesis A (Color-by-Slope) has been used in all past projections (e.g., predicting moths in other valleys based on slope) and has always been confirmed. Hypothesis B (Color-by-Plant) has not been used for projections before. Thus, entrenchment licenses projecting Hypothesis A.

  - The **naturalness response** (objective resemblance) would project the predicate that carves nature at the joints. The plant species (heather vs. bilberry) are natural kinds in ecology, with known effects on other species (e.g., via chemical defenses) and are part of a well-established taxonomic and ecological framework. Slope, by contrast, is merely a geographic feature and might be a proxy for the real cause (the plant). Thus, naturalness licenses projecting Hypothesis B.

  **Structural feature:** The key structural feature is that the two predicates (slope and plant) were perfectly correlated in the observed data but come apart in the new environment. This allows the two responses to diverge.

  **Degeneration:** If we remove the mixed flora in the new valley (so that the western slope remains pure heather and the eastern pure bilberry), the predictions of both hypotheses coincide and the problem disappears. Alternatively, if we remove the ecological naturalness of the plants (e.g., by making the plants arbitrarily defined), the case degenerates into ordinary grue (where one predicate is gerrymandered).

  **Strongest line of attack for the worse response:**

  - **Against entrenchment:** The strongest objection is that entrenchment is blindly following past practice and may miss the underlying causal structure (the plant species being the real driver). If Hypothesis B is true, then projecting by slope would lead to a false prediction and a missed opportunity to discover the true ecological mechanism.

  - **Against naturalness:** The strongest objection is that naturalness, without any track record of successful projection, is speculative. It might be that the plant is not the cause, and slope is (e.g., due to microclimate differences that also affect plant distribution). The entrenched predicate has a proven record and should not be abandoned without evidence.

  **Table:**

  | Response               | Predicate it licenses projecting | Feature of the case it keys on               | Strongest objection available to it |
  |------------------------|----------------------------------|---------------------------------------------|-------------------------------------|
  | Entrenchment (Goodman) | Color-by-Slope (Hypothesis A)    | Track record of past successful projections | May ignore underlying causal structure, leading to error when proxies fail. |
  | Naturalness            | Color-by-Plant (Hypothesis B)    | Plant as a natural kind in ecology          | Without a track record, it may project a predicate that is natural but not actually operative in this context. |
answer: |-
  ### Scenario
  In a marine biology lab studying adaptive coloration in cuttlefish, researchers observe that a population exhibits two distinct skin patterns: "mottled" (complex, irregular blotches) and "banded" (parallel stripes). Over a decade, they record 500 sightings in two habitats: shallow reef flats (high light, rocky substrate) and deep seagrass beds (low light, soft substrate). All observed cuttlefish in reef flats are mottled, and all in seagrass beds are banded. The team now investigates a newly discovered hybrid zone: a deep rocky canyon with seagrass-like light levels but reef-like substrate. They must predict the pattern here. Two hypotheses emerge:  
  - **Pattern-by-Habitat-Type** (entrenched): Cuttlefish in reef-like habitats are mottled; in seagrass-like habitats, banded. This predicate has been used in all prior publications and guides conservation efforts.  
  - **Pattern-by-Light-Level** (natural): Cuttlefish under high light are mottled; under low light, banded. This aligns with optics theory (light affects camouflage efficacy) and is "natural" as light sensors directly report it, while "habitat-type" is a coarse proxy.  

  Both fit past data (light/habitat correlated perfectly in original zones), but diverge in the canyon (low light + reef substrate): Pattern-by-Habitat predicts banded (seagrass-like habitat); Pattern-by-Light predicts mottled (high light would cause mottling, but light is low, so banded? Correction: *low* light → banded, so Pattern-by-Light predicts **banded** here. Pattern-by-Habitat, if "reef-like" substrate defines habitat, predicts **mottled** for reef-like, but the canyon is deep (low light) yet rocky. Refined: Habitat-Type defines "reef-like" by substrate (rocky), so predicts mottled; Light-Level defines by light (low), so predicts banded. Thus, predictions conflict: Habitat-Type says mottled in canyon, Light-Level says banded.  

  ### Analysis  
  - **Entrenchment response** projects **Pattern-by-Habitat-Type**: It has a stronger track record—used in 100% of past projections (e.g., predicting patterns in other reefs/seagrass zones) and is embedded in textbooks.  
  - **Naturalness response** projects **Pattern-by-Light-Level**: Light is a fundamental physical variable; sensors measure it directly, and it resembles known causal drivers (e.g., light-triggered gene expression). Habitat-Type is a disjunction of substrate/light/depth—a less "joint-carving" aggregate.  

  **Structural feature**: The predicates were extensionally equivalent in observed data but are *theoretically separable* (light vs. substrate can vary independently). This exposes how entrenchment favors operational history, while naturalness favors causal grounding.  

  **Degeneration**: If light and substrate never diverge (e.g., no hybrid zones exist), the case collapses into verbal disagreement. If "Pattern-by-Light" were replaced with an artificial disjunction (e.g., "mottled iff habitat is reef-flat *or* pH > 8"), it reduces to classic grue.  

  ### Strongest Objections  
  - **Against entrenchment**: It risks institutional inertia—projecting a coarse proxy (habitat) ignores measurable physics (light), potentially missing true causes (e.g., if light drives evolution but habitat is a historical accident).  
  - **Against naturalness**: It invites speculative overreach—light may not be causal (e.g., banding could evolve from substrate friction, not light), and without entrenchment, we might project untested "natural" variables (e.g., magnetic fields) prematurely.  

  ### Table  
  | Response               | Predicate licensed          | Key feature                                  | Strongest objection                          |  
  |------------------------|-----------------------------|---------------------------------------------|---------------------------------------------|  
  | Entrenchment (Goodman) | Pattern-by-Habitat-Type     | Historical use in projections (e.g., policy tools) | May conserve flawed proxies, impeding discovery of underlying mechanisms. |  
  | Naturalness            | Pattern-by-Light-Level      | Direct measurability and causal resemblance (physics) | Lacks empirical validation; risks projecting "natural" but irrelevant variables. |  

  ---  
  **Seminar note**: This case forces students to confront whether science prioritizes stability (entrenchment) or causal depth (naturalness) when underdetermined data meets real-world complexity. The hybrid zone is the "grue moment."
