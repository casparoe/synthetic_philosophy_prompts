prompt: |-
  You are a philosopher of medicine who works on the naturalism-versus-normativism dispute about the concept of disease. Think the problem through carefully before you write — it is worth brainstorming several candidate mechanisms and discarding the ones that cheat — but give me a polished result, not your notes.

  Build me a thought experiment to order. I am using it in a lecture whose point is that the disagreement between naturalist and normativist accounts is substantive rather than merely verbal, so the case must generate its verdicts from the theories instead of building them into the description.

  Specifications:

  1. Realistic and contemporary — an office, a school, a housing block; no science fiction, no invented neuroscience, no futuristic technology. One paragraph.
  2. Everyone in the relevant reference class has the condition, because the environmental exposure that produces it is near-universal. The condition is an impairment of a part's own functioning, so nobody can wave it off as a wound or as something merely present in the body; and it harms its bearers in a way they themselves care about and would pay to avoid — a real decrement in a capacity, not just an abnormal test result.
  3. From those details alone it must follow that (a) the best-known naturalist account — health as statistically species-typical functioning of the parts, disease as subnormal functional contribution relative to a reference class — returns "not a disease," while (b) the influential hybrid account — dysfunction as a mechanism's failure to do what natural selection designed it to do, plus the value judgment that the condition harms its bearer — returns "disease."
  4. It must also follow that a third view, on which a condition is a disease only if clinical medicine rather than regulation, engineering, or public-health policy is the institution that appropriately addresses it, returns "not a disease" while conceding the harm. Secure this by making removal of the exposure the effective remedy, not by stipulating that doctors have nothing to offer.

  Then: show each theory's reasoning from the details of the case; name in one sentence the single feature doing the work; say what happens to all three verdicts if that feature is removed — what if exposure falls to a third of the population, for instance — and whether the case then collapses into one everybody already agrees about; and give the strongest reply open to the defender of the account that comes out worst, including your view on whether that reply is legitimate or is really a way of making the account unfalsifiable.

  Begin with the scenario paragraph itself, with no preamble and no restating of these instructions; follow it with a single line giving the three verdicts; then give the analysis. Keep the whole thing under 700 words.
reasoning: |-
  Hmm, this is a sophisticated request about the philosophy of medicine. The user wants a thought experiment that cleanly distinguishes three theoretical approaches to disease: naturalism, hybrid normativism, and an institutional account. 

  I need to create a scenario where:
  - Near-universal environmental exposure causes functional impairment
  - Naturalism (Boorse-style) says "not disease" because statistically typical
  - Hybrid (Wakefield-style) says "disease" due to evolutionary dysfunction + harm
  - Institutional account says "not disease" because fix requires policy not medicine

  The key challenge is making the environmental cause near-universal but not science-fictional. Modern office lighting seems perfect - fluorescent lighting is ubiquitous, blue light effects are documented, and it causes functional visual impairment people would pay to avoid. 

  For the theories:
  1. Naturalism must classify as normal because >50% have it (reference class: contemporary office workers)
  2. Hybrid must identify evolutionary mismatch (our eyes didn't evolve for LEDs) plus harm
  3. Institutional account must point to building codes as solution, not clinical treatment

  The pivot is universality. If exposure drops, naturalism flips verdict while hybrid stays constant. Institutional view might shift if clinical interventions emerge. 

  Hybrid theorists might protest that universality breaks the "failure of design" criterion, but I think they're wrong - natural selection doesn't care about prevalence, only functional performance relative to ancestral environment. That defense would indeed make the account unfalsifiable.

  User seems highly knowledgeable - probably philosophy professor preparing lectures. The demand for no sci-fi and realistic harm suggests they've seen too many fanciful counterexamples. I'll keep the language tight and avoid marking my own thought process in the response.
answer: |-
  ### Scenario
  In a modern open-plan office building with floor-to-ceiling windows and energy-efficient LED lighting, nearly all employees develop chronic eye strain with measurable reduction in visual acuity after 18 months. The specific wavelengths of reflected sunlight combine with the LEDs to cause cumulative retinal photoreceptor desensitization. This objectively reduces near-vision sharpness to 20/40 (correctable to 20/20 with lenses but requiring constant wear), causes persistent headaches after screen use, and diminishes color discrimination in low contrast – impairments all employees report as frustrating and productivity-limiting. The only effective remedy is replacing the lighting system with full-spectrum bulbs and installing UV-filtering window films, a building-wide intervention. Ophthalmologists can prescribe corrective lenses to manage symptoms but cannot reverse the retinal changes.

  ### Verdicts
  Naturalism: not a disease. Hybrid: disease. Institutional: not a disease.

  ### Analysis
  **Naturalist Account (Boorse):** "Not a disease." Statistically species-typical functioning is assessed relative to a *relevant reference class* (here, contemporary office workers). Since >95% of this class develops the impairment, it represents the *new functional norm*. Though suboptimal compared to pre-industrial humans, it isn't statistically subnormal within the class defining baseline health.  
  *Key feature:* Near-universality in the reference class.  
  *If exposure drops to 33%:* Now statistically atypical. Naturalism likely calls it a disease.  
  *Collapse?* No – if only a minority were affected, all theories might concur it's a disease. Universality creates the disagreement.

  **Hybrid Account (Wakefield):** "Disease." There is *harm* (reduced vision/headaches impede well-being). Crucially, the photoreceptors *fail to perform their natural-selected function*: transducing light efficiently under evolutionarily typical conditions. LEDs/reflective windows create an environment mismatched with the eye's design history, causing *dysfunction* irrespective of prevalence.  
  *Key feature:* Failure relative to evolutionary design.  
  *If exposure drops to 33%:* Still a dysfunction + harm → still a disease verdict.  
  *Strongest Hybrid Reply:* "Universality *proves* environmental mismatch – natural selection wouldn't 'design' near-universal impairment!" *Rebuttal:* This confuses *etiology* with *dysfunction*. Wakefield defines dysfunction by failure of *mechanism* relative to *past* selection pressures, not current fitness or prevalence. If the retina isn't performing its evolved function due to novel stimuli, it's dysfunctional even if universal. Rejecting this conflates dysfunction with statistical rarity or maladaptiveness, collapsing into naturalism or value-laden views. The reply is illegitimate: it makes "dysfunction" unfalsifiable by prevalence data.

  **Institutional Account (e.g., Reznek, Cooper):** "Not a disease." The *appropriate remedy* is architectural/environmental (lighting/window modification), implemented via regulation or facilities management. Clinical medicine (ophthalmology) offers only symptomatic management (lenses), not cure or primary prevention. Though harmful, it falls under public health/engineering jurisdiction.  
  *Key feature:* Non-medical solution.  
  *If exposure drops to 33%:* Remedy remains environmental modification. Verdict unchanged. Clinical intervention (if developed) might shift verdict, but here it treats symptoms, not cause.  
  *Collapse?* Only if clinical prevention/treatment emerges as primary solution.

  ### Conclusion
  The disagreement is substantive: theories weight *universality*, *evolutionary mismatch*, and *institutional context* differently. Changing universality alters only the naturalist verdict, confirming its statistical core. The hybrid view remains stable but risks unfalsifiability if prevalence is misused to define dysfunction. The institutional view prioritizes social response over biology or values alone.
