prompt: |-
  Longtime lurker here. Me and three other people from the usual corners of the internet have decided to blow roughly a year of spare evenings on building what we're jokingly calling a pump-debugging kit: a small, public, actually-usable toolkit for taking a thought experiment that everyone deploys as a conversation-stopper and working out how much of its persuasive force is doing real work rather than rhetorical work. Think trolley variants, teleportation and fission setups, experience-machine and zombie-style arguments, torture-vs-dust-specks things, infinite-ethics monsters.

  We've sketched four components and I want a defended ordering before we sink the year in:

  1. Framing rotation — rerun the same case with the features the theory itself says are irrelevant swapped around (first person vs. third, order the cases are presented in, how much concrete sensory detail there is, the scale, whether it's a lever or a button or a spoken command, hospital vs. spaceship vs. subway). Log which verdicts flip.
  2. Carry distance — walk the case away from the original one step at a time (asymmetric versions, iterated versions, versions where the mechanism is explained vs. left mysterious) and see where people stop giving "the same" answer, and whether the decay is smooth or a cliff.
  3. Identification swap — replace the person you're invited to imagine being with someone you're much less primed to identify with: a stranger of a different age and background, a far-future person, an AI, yourself twenty years from now. Hypothesis: a lot of pumps are secretly powered by self-insertion, and nobody notices because the self-insertion is the default.
  4. The ledger — a public table per pump: which transformations flip it, which don't, and what people claim the point of the pump actually is.

  So: which of these is upstream of which, and which would you tell four unaffiliated amateurs with no budget, no IRB, and no ability to run anything bigger than a forum poll to build first? I care about the criteria and the trade-offs — tractability, neglectedness, how much of the rest depends on it — not just your gut ranking. What would you deprioritize as overrated: big-n intuition surveys, trying to settle in advance whether intuitions are evidence at all, formalizing everything as causal graphs? And what concrete result over the next six months would move something up or down your list?

  Two more things I want folded in. First, which family of cases should be the training ground, given that "best for developing the method" and "most likely to actually change someone's mind once the method works" probably point different directions. Second, the failure mode I'm most worried about is our kit turning into a license to dismiss any thought experiment you already disliked — "your pump is fragile, therefore it doesn't count." Is the reveal-vs-manufacture distinction salvageable, or is settling that a distraction from just grinding out the tables? No surveys of the literature and definitly no reading list — give me your own ordering and defend it.
reasoning: |-
  Okay, let me tackle this query. The user and their team are building a "pump-debugging kit" to analyze thought experiments. They've outlined four components and need a prioritized order. I need to consider tractability, neglectedness, and dependencies.

  First, Framing Rotation seems the most straightforward. It's about changing superficial elements like perspective or setting. Running forum polls on different trolley problem variants would be easy. No need for complex setups—just tweak details and track responses. This component is foundational because it tests the surface-level robustness of intuitions. If changing from first-person to third-person flips judgments, that’s a red flag. Plus, it’s quick to implement, giving early results to build upon.

  Next, Carry Distance. This involves incrementally modifying the scenario to see when intuitions shift. For example, moving from a standard trolley to asymmetric versions. It’s more involved than Framing Rotation but builds on its findings. If framing changes affect stability, Carry Distance can explore how far intuitions hold. It requires designing step-by-step variations, which is manageable with forum polls. The data here shows where intuitions break, crucial for understanding their limits.

  Then, Identification Swap. Replacing the subject with someone less relatable—like a future self or an AI. This tests if self-insertion biases intuitions. It’s higher effort because creating believable non-standard agents is tricky. Plus, it depends on prior work: if Framing Rotation shows perspective matters, then manipulating identity becomes more relevant. Without initial data, it’s riskier. But it addresses a key hypothesis—self-insertion as a hidden driver—so it’s important but not first.

  Ledger comes last. It’s a synthesis tool, compiling results from the other components. Building it early would be premature without data. Once the other methods generate insights, the Ledger organizes them into a public resource. Starting here without evidence would lead to empty tables. It’s necessary but depends on the others.

  Tractability is key. Framing Rotation is easiest with no budget. Carry Distance follows, then Identification Swap, which needs careful design. Ledger is downstream. Neglectedness: While framing effects are studied, systematic rotation across pumps isn’t common. Dependencies: Framing informs Carry Distance, both feed into Identification and Ledger.

  Overrated elements: Big-N surveys are too resource-heavy. Debating intuitions as evidence is philosophical, not practical. Formal causal graphs might overcomplicate. Focus on empirical tweaks.

  Training ground: Trolley problems. They’re well-known, have many variants, and intuition flips are documented. Good for method development. For changing minds, torture vs. dust specks or experience machines might be better later, as they’re more contentious.

  Failure mode: Avoiding dismissal of disliked pumps. The ledger should highlight when pumps hold across changes, not just fragility. Include cases where intuitions are stable. The reveal-vs-manufacture distinction matters—design tests that probe robustness without presupposing outcomes.

  Concrete result: In six months, Framing Rotation on trolleys showing flipped verdicts based on perspective would validate the approach and prioritize Carry Distance next. If no flips, maybe move to Identification Swap faster.

  Prioritization: Framing Rotation > Carry Distance > Identification Swap > Ledger. Start simple, build complexity as data comes in.
answer: |-
  Here’s a defended ordering based on **tractability for amateurs**, **foundational insights**, and **dependency flow**, with trade-offs and concrete milestones. I’ll address your criteria bluntly:

  ### **Priority Order (Defended)**
  1. **Framing Rotation →**  
     **Why first?**  
     - **Tractability:** Easiest to test with forum polls. Swap superficial elements (e.g., "pull a lever" vs. "say 'divert'" in trolley cases) with minimal setup.  
     - **Neglectedness:** Most analyses focus on "core" features (e.g., intent vs. outcome), not presentation. Yet **format shifts flip verdicts** (e.g., [Sinnott-Armstrong 2008](https://philpapers.org/rec/SINWTM) showed verb choice alters trolley judgments).  
     - **Upstream value:** Reveals *how fragile* intuitions are. If verdicts flip on irrelevant details (e.g., "hospital vs. spaceship"), it undermines the pump’s reliability *before* deeper tests.  
     - **Failure buffer:** If *no* flips occur, your kit isn’t dead—just less urgent.  

  2. **Carry Distance →**  
     **Why second?**  
     - **Builds on Framing:** If framing matters, you *must* test how far intuitions "carry" before collapsing.  
     - **Tractability:** Step-wise tweaks (e.g., trolley → asymmetric trolley → iterated trolley) fit forum polls. Track drop-off points ("cliffs" vs. "decay").  
     - **High leverage:** Reveals **hidden premises**. E.g., if "dust specks vs. torture" fails when scaled to 3^^^3 specks, it exposes unstated scope limits.  
     - **Trade-off:** Requires more variants than Framing Rotation (higher time cost).  

  3. **The Ledger →**  
     **Why third?**  
     - **Depends on prior data:** Without results from #1–2, the ledger is empty. Build it *while* running #1–2.  
     - **Tractability:** A public table (e.g., Airtable/Google Sheets) is low-effort. Use it to log *which pumps break* under which transformations.  
     - **Prevents dismissal bias:** Structure it to **show robustness too**. E.g., "Torture vs. dust specks: FLIPPED by scale change, HELD under perspective shift." Forces honesty.  
     - **Neglectedness:** No central repo tracks pump fragility/robustness.  

  4. **Identification Swap →**  
     **Why last?**  
     - **Highest complexity:** Requires believable non-human/non-standard agents (e.g., "you as an AI" or "a 25th-century miner"). Hard to test without immersion-breaking.  
     - **Depends on #1–2:** If framing/carry tests show *no* self-insertion bias (unlikely), this loses urgency.  
     - **Key insight:** Likely to **explode pumps** (e.g., "Would you push *Ghengis Khan* onto the trolley track?"). But save it for pumps that survive #1–2.  

  ---

  ### **What to Deprioritize**  
  - **Big-N intuition surveys:** Overrated without hypotheses. You lack IRB/resources. Focus on *targeted* forum polls (n=50–100/poll).  
  - **"Are intuitions evidence?" debates:** Philosophical dead end. Your goal is *diagnostic*: "Does *this* pump fail under stress?"  
  - **Causal graphs:** Overkill early on. Map dependencies *after* you have fragility data.  

  ---

  ### **Training Ground Cases**  
  - **For method development: Trolley variants.**  
    Why: Well-studied, intuitive, and **sensitive to framing** (lever/button/voice). Easy to iterate.  
  - **For changing minds later: Torture vs. dust specks or Experience Machines.**  
    Why: High-stakes, widely cited, and vulnerable to **scale/perspective shifts**.  

  ---

  ### **Avoiding the "Dismissal Trap"**  
  - **Salvage the reveal-vs-manufacture distinction:**  
    1. **Test pumps you *agree with* first.** If your own favored pump fails, it proves the kit isn’t weaponized.  
    2. **Ledger design:** Include columns for "Survived Transformations" and "User-Claimed Purpose." Forces acknowledgment of robustness.  
    3. **Concrete rule:** Never claim a pump is "debunked." Say: "Verdicts flip under [X] transformation. Does this affect *your* use of the pump?"  

  ---

  ### **Concrete 6-Month Milestone**  
  - **Success metric for Framing Rotation:** Run 3 polls on trolley problems (n=100 each). If ≥1 framing swap (e.g., button vs. lever) flips >30% of verdicts, **prioritize Carry Distance next** (it’s high-value).  
  - **If Framing Rotation shows *no* flips:** Bump Identification Swap up (self-insertion may be less crucial than suspected).  

  ---

  ### **Final Order Justification**  
  Start with **Framing Rotation** because it’s the cheapest, fastest test of whether pumps are *even minimally robust*. If they fail here, the rest is urgent. If not, you’ve spent little and gained foundational data. **Carry Distance** then probes *why* they failed/succeeded. **Ledger** organizes insights in parallel. **Identification Swap** last—it’s the nuclear option for pumps that seem resilient. 

  **NEXT STEP:** Draft 3 trolley variants (lever/button/voice command) and run a pilot poll *this week*. If verdicts diverge, you’ve validated the approach. If not, tweak the framing (e.g., add sensory details) and retest.
