  **INTERNAL GUIDANCE MEMORUM: CA-17-REV.3**  
  **FROM:** Central Consciousness Registry, Standards Compliance Division  
  **TO:** All Certified Claims Adjusters, Grade II and Above  
  **SUBJECT:** Adjudication Protocols for Higher-Order Thought (HOT) Registration & Conscious State Certification  
  **EFFECTIVE:** Immediately  
  **REF:** Agency Mandate §8.1(b); *Consciousness Administration Act (Revised)*  

  **1. PURPOSE:** This memorandum provides definitive procedural clarification regarding the assessment of Consciousness Claims (Form CC-114) under Agency Mandate §8.1(b), which stipulates that a first-order mental state (FOMS) achieves certified conscious status *only* upon the Agency's receipt and validation of a duly filed Higher-Order Thought (HOT) concerning said FOMS. Strict adherence to the temporal, formal, and substantive requirements outlined herein is mandatory for claim determination.

  **2. DEFINITIONS:**  
      *   **2.1 First-Order Mental State (FOMS):** Any sensory, perceptual, or affective state occurring within a registered Subject-Consciousness System (SCS).  
      *   **2.2 Higher-Order Thought (HOT):** A distinct, reportable mental state taking a FOMS as its intentional object.  
      *   **2.3 Registration:** The formal, timestamped logging of a HOT descriptor within the Central Consciousness Registry Database (CCRD), via approved neural interface or Form HOT-7b (Verbal Report Affidavit).  
      *   **2.4 Conscious Status:** The certified property of a FOMS contingent *solely* upon successful HOT Registration per §8.1(b). A FOMS lacking contemporaneous HOT Registration is deemed non-conscious *ipso facto*, regardless of subjective retrospective assertions or external behavioral correlates.

  **3. ADJUDICATION PROTOCOLS:**  
      *   **3.1 Absent Registration (Peripheral/Unattended States):**  
          *   **3.1.1:** Claims concerning FOMSs occurring during periods of focal attention (e.g., Subject absorbed in cinematic narrative, Claim ID #SCS-4512-B) are DENIED if no contemporaneous HOT Registration exists for the specific FOMS cited (e.g., olfactory data from cinema ventilation system, proprioceptive data regarding left visual field boundary).  
          *   **3.1.2:** The phenomenological vividness or objective salience of the FOMS is irrelevant to determination. Focus is exclusively on the presence/absence of the requisite HOT Registration (§2.3, §2.4). Denial Code: AR-02 ("No Registered HOT for Specified FOMS").

      *   **3.2 Late Registration:**  
          *   **3.2.1:** HOT Registrations received >200ms post-FOMS onset timestamp are classified as "Late Filings" (LF).  
          *   **3.2.2:** LF HOTs pertain ONLY to the conscious status of the FOMS existing at the *exact moment of eventual HOT Registration*.  
          *   **3.2.3:** The *original* FOMS (occurring prior to LF HOT Registration) remains NON-CONSIOUS. Claims citing the original FOMS are DENIED. Denial Code: LF-01 ("HOT Registration Non-Contemporaneous with Cited FOMS").

      *   **3.3 Erroneous Registration:**  
          *   **3.3.1:** A HOT Registration concerning a *non-existent* FOMS (e.g., Claim ID #SCS-7890-A: HOT filed for "intense sensation of being granite," Subject identified as *Homo sapiens*, not mineralogical sample) is VALID as a registered HOT.  
          *   **3.3.2:** However, as the cited FOMS ("being granite") demonstrably did not occur within the SCS, the claim for conscious status of *that specific FOMS* is DENIED (Refer §2.1). The HOT itself possesses conscious status *as a discrete mental state*, but only if *it* becomes the object of a subsequent, valid HOT Registration (See §3.4). Denial Code: ER-01 ("Cited FOMS Not Present in SCS").

      *   **3.4 HOT Self-Certification Requests:**  
          *   **3.4.1:** Claims seeking conscious status certification *for the HOT itself* (e.g., Claim ID #SCS-2024-C: "Certify my awareness *of* my thought about the pain") require adjudication per standard §8.1(b).  
          *   **3.4.2:** Conscious status for the initial HOT (HOT-1) is contingent upon the Agency receiving a valid HOT Registration *taking HOT-1 as its object* (HOT-2).  
          *   **3.4.3:** Claims concerning HOT-1 submitted WITHOUT a valid HOT-2 Registration are DENIED (Refer §3.1).  
          *   **3.4.4:** Claims concerning HOT-2 require a valid HOT-3 Registration, *ad infinitum*. The Agency acknowledges the procedural regress inherent in §8.1(b). Adjusters must process each tier sequentially per standard protocols. Denial Code (for HOT-n lacking HOT-(n+1)): AR-02.

      *   **3.5 No-Report Paradigm Claims:**  
          *   **3.5.1:** Subjects participating in experimental protocols where verbal/motor report (Form HOT-7b) is deliberately suppressed or delayed ("No-Report") frequently submit claims asserting extensive conscious awareness exceeding reportable content.  
          *   **3.5.2:** Absent contemporaneous HOT Registration (neural or affidavit) for a specific FOMS during the no-report period, claims concerning that FOMS are DENIED (§3.1.1, §3.1.2).  
          *   **3.5.3:** Retrospective affidavits filed post-protocol concerning FOMSs during the no-report window are classified as Late Filings (Refer §3.2). Denial Code: LF-01 or AR-02, as applicable.

  **4. COMPLIANCE:** Failure to adhere strictly to these protocols constitutes a Grade 3 Compliance Violation. Consult the *Adjudicator's Field Manual (Consciousness)*, Chapter 8, for detailed filing procedures and Form HOT-7b notarization requirements.

  **5. SAMPLE DETERMINATION LETTER:**

  **[AGENCY LETTERHEAD]**

  **Subject-Consciousness System:** SCS-4512-B  
  **Claim ID:** CC-114-4512B-0892  
  **Date of Determination:** 2023-10-27

  Dear Claimant,

  This letter constitutes the Agency's final determination regarding your Consciousness Claim (CC-114) filed 2023-10-25, seeking certified conscious status for the following First-Order Mental States (FOMSs) occurring during cinematic attendance on 2023-10-24:

  1.  **FOMS A:** Olfactory sensation: Popcorn odor (Timestamp: 19:14:32.115)
  2.  **FOMS B:** Visual sensation: Perception of the left edge of the cinema screen (Timestamp: 19:22:17.843)

  **Agency Review Findings:**

  *   Central Registry records confirm valid HOT Registration (Ref: HOT-Neural-4512B-1024) concerning FOMS: "Complex audiovisual narrative comprehension (Cinematic Presentation)" during the relevant timestamps.
  *   **No** contemporaneous HOT Registration (neural or Form HOT-7b) was found pertaining specifically to FOMS A (popcorn odor) or FOMS B (left screen edge) during the cited timestamps or within the 200ms contemporaneity window (§3.2).

  **Determination:**

  Pursuant to Agency Mandate §8.1(b) and Guidance Memo CA-17-REV.3 (§3.1.1, §3.1.2), your claim for certified conscious status for **FOMS A** and **FOMS B** is **DENIED**.

  **Reason for Denial:** AR-02 (No Registered HOT for Specified FOMS). The phenomenology of unattended sensory data lacks standing absent compliant HOT Registration. The valid HOT concerning the central narrative does not confer conscious status upon unregistered concurrent FOMSs.

  This determination is final. No further administrative review is available.

  Sincerely,

  **Agnes Finch**  
  Certified Claims Adjuster, Grade II-B  
  Central Consciousness Registry  
  Standards Compliance Division
