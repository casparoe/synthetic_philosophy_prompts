  We are given a setup with a finite partition of possibilities and two inaccuracy measures: Brier and Log.
   The user has observed that the Brier score leads to arguments for probabilism (coherence) via dominance and expected accuracy minimization, while the Log score does not.
   We are to address the questions (a) through (e).

   Let me first summarize the key observations:

   1. For the Brier score, an incoherent credence function (like (0.6,0.6) in two cells) is dominated by a coherent one (like (0.5,0.5)).
   2. For the Log score, the same incoherent (0.6,0.6) is not dominated by any coherent credence function. However, a subadditive credence function (like (0.4,0.4)) is dominated by (0.5,0.5) in the Log score.
   3. The expected Brier score with respect to a probability q is minimized uniquely at x = q, even if we allow x to be any non-negative vector (not necessarily on the simplex). This is known as "strict propriety" over the entire non-negative orthant.
   4. The expected Log score with respect to q is not minimized at x = q when we allow incoherent competitors. In fact, we can make the expected Log score arbitrarily low by setting x to (t, t, ..., t) for t very large.

   Now the questions:

   (a) The key property is that the inaccuracy measure is strictly proper over the entire non-negative orthant, meaning that for every probability measure q, the expected inaccuracy E_q[I(c, w)] is minimized uniquely at c = q, even when c is allowed to be any non-negative vector (not necessarily summing to 1).

      - The Brier score has this property. The user computed: 
            E_q[I_B(x)] = Σ_j (x_j - q_j)^2 + (1 - Σ_j q_j^2)
          The term (1 - Σ_j q_j^2) is constant in x, so the minimum over x occurs at x_j = q_j for every j.

      - The Log score does not have this property. The expected Log score is the cross-entropy: 
            E_q[I_L(x)] = -Σ_j q_j * ln(x_j)
          This is minimized (over the positive orthant) when x_j = q_j only if we require that Σ_j x_j = 1? Actually, without constraints, we can set x_j arbitrarily large to make the score arbitrarily low (toward -∞). 

      But note: the Log score is strictly proper if we restrict to the simplex (i.e., among coherent credence functions). However, for the dominance argument for probabilism, we need that every incoherent credence function is dominated by some coherent one. The Brier score achieves this because the coherent minimizer of expected Brier (which is the probability q that we are using) dominates the incoherent one. The Log score fails because the incoherent (0.6,0.6) is not dominated by any coherent point.

      So the condition for the dominance argument to work is that the inaccuracy measure is strictly proper over the entire non-negative orthant (and not just the simplex). This condition is not just probabilism restated because it is a condition on the inaccuracy measure: it requires that the unique minimizer of expected inaccuracy from the perspective of any probability q is q itself, even when we allow non-probabilistic credence functions.

   (b) The example is structural. The Log score is a local inaccuracy measure: it depends only on the credence assigned to the true cell. Any local inaccuracy measure that is strictly proper on the simplex will not be strictly proper on the entire non-negative orthant. Why?

      - For a local measure, I(c, w_i) = f(c_i) for some function f (with the understanding that if c_i=0 and w_i is true, then inaccuracy is infinite). 
      - The expected inaccuracy with respect to q is: 
            E_q[I(c, w)] = Σ_i q_i * f(c_i)
      - To minimize this over c without constraints (c_i >=0), we can minimize each term independently. The minimum of q_i * f(c_i) for each i occurs at a value of c_i that minimizes f(c_i) (if q_i>0). But note, if f is bounded below and we can set c_i arbitrarily, then we might get a minimum at infinity. 

      For the Log score, f(c_i) = -ln(c_i). Then for each i, we can set c_i arbitrarily large to make q_i * (-ln(c_i)) arbitrarily low (toward -∞). So the minimum is not achieved at any finite c. 

      However, if we require that the measure is bounded below and that the minimum occurs at a finite point, then for each term we would require that f(c_i) is minimized when c_i = 1? But that is not the case for the Log score: the Log score f(c_i) = -ln(c_i) is minimized as c_i → ∞? Actually, it goes to -∞ as c_i → ∞? So that is a problem.

      Alternatively, consider a local inaccuracy measure that is strictly proper on the simplex. On the simplex, the minimum of Σ_i q_i * f(c_i) for coherent c (with Σ_i c_i = 1) should occur at c=q. But without the constraint, we can set each c_i arbitrarily large and get arbitrarily low inaccuracy. Therefore, no local inaccuracy measure that is unbounded below (as we let c_i → ∞) can be strictly proper on the entire non-negative orthant.

      Moreover, if we try to bound it below, say by having f(c_i) → ∞ as c_i → ∞, then we might get a minimum at finite c. But then what is the minimizer? For each term, we minimize q_i * f(c_i). If q_i>0, then we minimize f(c_i). So if f is minimized at a point, say m, then we would set c_i = m for every i. Then the expected inaccuracy would be minimized at a constant vector (m, m, ..., m). For this to equal q (which is a probability vector) we would need m = q_i for every i. But that can only be if all q_i are equal? So in general, it won't be minimized at q.

      Therefore, the only way to have strict propriety on the entire non-negative orthant is to have a global measure (like Brier) that depends on the entire credence vector.

      Caveat: There might be non-local measures that are not strictly proper on the non-negative orthant? But the Brier is one that is.

   (c) The Brier score is known to decompose into calibration and refinement. The calibration term captures how well the credence function matches the empirical frequencies when grouped by the same credence value, and the refinement term captures the remaining resolution. 

      The sensitivity of the Brier score to how credence is spread across false cells is indeed part of the refinement. In the example: 
          - For (0.8, 0.2, 0) with true world first: (1-0.8)^2 + (0-0.2)^2 + (0-0)^2 = 0.04 + 0.04 = 0.08.
          - For (0.8, 0.1, 0.1): (1-0.8)^2 + (0-0.1)^2 + (0-0.1)^2 = 0.04 + 0.01 + 0.01 = 0.06.
          - Splitting the residual 0.2 evenly over n false cells: (1-0.8)^2 + Σ_{j=2}^{n+1} (0-0.2/n)^2 = 0.04 + n * (0.04/n^2) = 0.04 + 0.04/n → 0.04.

      This shows that the Brier score rewards spreading the residual credence (the part not on the true cell) over more false cells. This is because the penalty per false cell is squared, and by spreading it we reduce the square per cell (by the convexity of the square function). 

      The log score, being local, does not care about the false cells. 

      In the accuracy argument for probabilism, the Brier score's sensitivity to the entire vector is what allows it to enforce the additivity of probability (that the total credence must be 1). The log score does not enforce that because it only looks at the true cell.

   (d) The argument for probabilism is typically run relative to a fixed partition. But the issue of partition sensitivity is important.

      The Brier score is partition-dependent: it changes when we refine the partition. The log score also changes when we split the true cell (as shown). 

      For the argument for probabilism to be well-founded, we need to specify the partition. One common approach is to take the maximally fine partition, i.e., the set of possible worlds. However, in many practical cases we are interested in a particular coarse-grained partition.

      Another approach is to require that the inaccuracy measure be such that the dominance or expected accuracy conclusions are invariant under refinement. This is a strong condition. 

      For the Brier score, if we take the maximally fine partition (worlds) then we get a unique coherent credence function (the one that assigns 1 to the true world and 0 to others) as the most accurate. But that is not what we want because we want to allow non-extreme credences.

      Actually, the argument for probabilism does not require that we use the maximally fine partition. It is run for the partition of interest. The norm of probabilism is relative to the partition: your credences over the partition should be probabilities.

      However, there is a deeper issue: if we have two partitions, one being a refinement of the other, then the inaccuracy over the coarse partition might be computed from the fine partition by aggregating. For example, if a cell in the coarse partition is split in the fine partition, then the credence for the coarse cell is the sum of the credences for the fine cells. 

      The Brier score for the coarse partition is not the same as the Brier score for the fine partition. Therefore, the inaccuracy measure is not invariant under refinement.

      One response is that the epistemic goal of accuracy is defined relative to a particular partition. Alternatively, one might require that the inaccuracy measure for a coarse partition is the same as the inaccuracy measure for the fine partition when we aggregate the credences appropriately. But that would require a very specific form of the inaccuracy measure.

      The log score has a similar issue: if we split the true cell, then the log score becomes worse because the credence assigned to the true cell is split. 

      However, note: the log score for a coarse partition is not defined in terms of the fine partition. We have to choose a partition.

      So the standard approach is to fix a partition and run the argument for that partition. The norm of probabilism is then relative to that partition.

      But how does this interact with (a)? The property of being strictly proper on the non-negative orthant is defined relative to a fixed partition. If we change the partition, we change the measure. The Brier score remains strictly proper for the new partition. The log score remains strictly proper on the simplex for the new partition. However, the dominance argument fails for the log score in the same way regardless of the partition.

   (e) The intuitive core: 

      The Brier score (and similar strictly proper global measures) penalize two kinds of "mismatch":
          (1) Mismatch in the true cell: giving a low credence to the true cell is penalized.
          (2) Mismatch in the total magnitude: giving a total credence that is not 1 is penalized (because if the total is more than 1, then even if you spread the excess over false cells, the squared error adds up; and if less, then you are not giving enough to the true cell or you are being too stingy overall).

      Why should a veritist care about the total magnitude? 

      The idea is that the truth-value vector has total magnitude 1 (since only one cell is true, it has 1 and the rest 0, so the sum is 1). Therefore, a credence function that does not sum to 1 is not just "incoherent" but also "farther from the truth" in the sense of Euclidean distance. 

      The veritist might argue that the entire vector of credences is an attempt to represent the truth-value vector, and any deviation from that vector (in any coordinate) is inaccuracy. The log score, on the other hand, only cares about the true cell. 

      However, one might argue that the false cells are not "true" and so we shouldn't care about what credence we assign to them? But note: if we assign a very high credence to a false cell, that seems inaccurate. The log score does not capture that because it only looks at the true cell.

      Therefore, the veritist might say that we should care about the entire representation. The log score is not a measure of the entire representation but only of the true part.

      But there is a counterargument: the veritist goal is to have high credence in the true cell and low in the false ones. The log score does encourage high credence in the true cell, but it does not explicitly encourage low credence in the false cells. However, because the credences must sum to 1 (if we are coherent), then having high in the true implies low in the false. But for incoherent credences, we can have high in the true and also high in the false.

      The Brier score explicitly penalizes high credence in false cells (because (0 - c_j)^2 is increasing in |c_j|). 

      Therefore, the veritist has a reason to prefer a global measure: it penalizes both underconfidence in the true cell and overconfidence in false cells, and also penalizes mismatched total credence.

      However, the veritist might also be concerned about the practical implications: if we only care about the true cell, then why not set all false cells to 0 and the true cell to 1? But that would be extreme and not allow for learning. The global measure allows for a more nuanced view.

      Ultimately, the choice of inaccuracy measure is a substantive decision in formal epistemology. The Brier score is not the only strictly proper global measure (there are others, like the spherical score), but the log score is the canonical local one.

      The accuracy-first programme typically uses strictly proper scoring rules, and the dominance argument for probabilism requires that the rule is strictly proper on the non-negative orthant (not just the simplex) so that incoherent credence functions are not only suboptimal for their own expected score but are dominated by coherent ones.

      A compromise: one might use the log score but then require coherence as a separate norm. But the accuracy-first programme seeks to derive all norms from accuracy.

  Conclusion:

      The key property for the dominance argument for probabilism is that the inaccuracy measure is strictly proper over the entire non-negative orthant (i.e., without requiring the credences to be coherent). The Brier score has this property, the log score does not. This is because the log score is local and does not penalize overconfidence in false cells or mismatched total credence. The veritist can argue that the entire credence vector should be close to the truth-value vector, which has a fixed total of 1, and hence that a global measure is appropriate.
answer: |-
  ### Comprehensive Response to Your Queries on Accuracy-First Epistemology

  Your analysis of the Brier and Log scores in the two-cell case is correct and highlights a fundamental distinction between global and local inaccuracy measures. Below, I address each question rigorously, combining algebraic insights with intuitive explanations.

  ---

  #### **(a) The Key Property: Strict Propriety Over the Non-Negative Orthant**
  **What's doing the work?**  
  The critical property is **strict propriety extended to the entire non-negative orthant** (not just the probability simplex). An inaccuracy measure \(I\) satisfies this if for *any* probability function \(q\), the expected inaccuracy \(E_q[I(c, \cdot)]\) is minimized *uniquely* at \(c = q\), even when \(c\) is allowed to be any non-negative vector (i.e., \(c \in \mathbb{R}_{\geq 0}^n\)).

  - **Brier**:  
    As you computed:  
    \[
    E_q[I_B(c, \cdot)] = \sum_j (c_j - q_j)^2 + \left(1 - \sum_j q_j^2\right).
    \]  
    The unique minimum occurs at \(c_j = q_j\) for all \(j\), irrespective of whether \(\sum_j c_j = 1\). This forces \(c\) to match \(q\) on every cell, including the total sum \(\sum_j c_j = \sum_j q_j = 1\).

  - **Log**:  
    \[
    E_q[I_L(c, \cdot)] = -\sum_j q_j \ln c_j.
    \]  
    This is minimized only under the constraint \(\sum_j c_j = 1\) (where \(c_j = q_j\)). Without this constraint, setting \(c_j \to \infty\) for all \(j\) drives \(E_q[I_L]\) to \(-\infty\), so no finite minimum exists.

  **Why this isn't probabilism restated**  
  Strict propriety over the orthant is a **constraint on the inaccuracy measure**, not a restatement of probabilism. It requires that the *only* way to minimize expected inaccuracy from a probabilistic perspective is to adopt that same probability—even if incoherent alternatives are permitted. This property *enables* the dominance argument for probabilism: if \(c\) is incoherent, it cannot be \(q\) for any \(q\), so there exists a \(q\) (the coherent minimizer) that dominates \(c\).

  **Intuitive picture**:  
  - Brier "sees" the entire credal landscape: it penalizes **mismatches in both individual credences and total sum** (since the truth vector \((1, 0, \dots, 0)\) has sum 1).  
  - Log is "myopic": it only cares about the credence assigned to the *actual* world, ignoring false cells and total credence. An incoherent \(c\) can exploit this by over-assigning to all cells without penalty.

  ---

  #### **(b) Structural Failure of the Log Score**
  **Is the example an artifact?**  
  No, it is **structural**. The Log score is the unique strictly proper local measure (up to affine transformation) for probabilities, but it *cannot* be strictly proper over the non-negative orthant. Here's why:

  - **Local measures** satisfy \(I(c, w_i) = f(c_i)\) for some \(f\) (e.g., \(f(x) = -\ln x\) for Log).  
  - Expected inaccuracy becomes \(E_q[I(c, \cdot)] = \sum_j q_j f(c_j)\).  
  - Minimizing this over \(c \in \mathbb{R}_{\geq 0}^n\) requires minimizing each \(q_j f(c_j)\) *separately*. If \(f\) is unbounded below (e.g., \(-\ln x \to -\infty\) as \(x \to \infty\)), the minimum is \(-\infty\) (achieved as \(c_j \to \infty\)). If \(f\) is bounded below, the minimum may occur at \(c_j = k\) for all \(j\), but this equals \(q_j\) only if \(q\) is uniform.

  **Caveats**:  
  1. No local measure can be strictly proper over the orthant without incoherence.  
  2. Global measures like Brier avoid this by coupling cells (e.g., through terms like \((\sum_j c_j - 1)^2\) implied by squared Euclidean distance).

  ---

  #### **(c) Brier Decomposition: Calibration vs. Refinement**
  The Brier score decomposes as:  
  \[
  I_B(c, w_i) = \underbrace{(1 - c_i)^2}_{\text{reliability}} + \underbrace{\sum_{j \neq i} c_j^2}_{\text{resolution}} + \underbrace{\text{terms independent of } c}_{\text{irrelevant}}.
  \]  
  In your examples:  
  - With \(c = (0.8, 0.2, 0)\) and \(w_1\) true: \(I_B = (1-0.8)^2 + 0.2^2 + 0^2 = 0.04 + 0.04 = 0.08\).  
  - With \(c = (0.8, 0.1, 0.1)\): \(I_B = (1-0.8)^2 + 0.1^2 + 0.1^2 = 0.04 + 0.01 + 0.01 = 0.06\).  
  - Splitting residual mass over \(n\) false cells: \(I_B = 0.04 + \sum_{k=1}^n (0.2/n)^2 = 0.04 + 0.04/n \to 0.04\).

  **Connection to accuracy arguments**:  
  - **Sensitivity to false cells** arises from the refinement term \(\sum_{j \neq i} c_j^2\).  
  - This term penalizes **overconfidence in false cells** (high \(c_j\)) and rewards **spreading residual credence** (convexity of \(x^2\) favors dispersion).  
  - In the accuracy argument, refinement ensures that incoherent credences (e.g., \(c = (0.6, 0.6)\)) are dominated because they over-assign to false cells *and* mismatch the total sum.

  **Contrast with Log**:  
  The Log score lacks a refinement component—it ignores false cells entirely. This is why it fails to penalize credence inflation (e.g., \(c = (0.6, 0.6)\)).

  ---

  #### **(d) Partition Sensitivity and Refinement Invariance**
  **The problem**:  
  Brier and Log scores are **partition-relative**. Consider:
  - **True cell refinement**: Splitting a true cell \(w_i\) into subcells worsens both scores (you now assign less to the true subcell).  
  - **False cell refinement**: Splitting false cells improves Brier (by spreading residual mass) but leaves Log unchanged (it ignores false cells).

  **How accuracy arguments handle this**:  
  1. **Fixed partition**: Arguments for probabilism are run relative to a **given partition**. Coherence is defined as \(\sum_j c_j = 1\) *for that partition*.  
  2. **Maximal partition**: Some advocate using the finest possible partition (possible worlds), but this faces practical issues (e.g., continuous spaces).  
  3. **Refinement-invariant measures**: Alternatives exist (e.g., continuous scoring rules), but Brier/Log are partition-sensitive.  

  **Brier in the limit**:  
  As false cells are split infinitely (\(n \to \infty\)), \(I_B \to (1 - c_i)^2\)—matching the penalty for the true cell alone. However, this **does not make Brier local**:
  - The minimum expected Brier still requires \(c = q\) (so coherence is enforced).  
  - Incoherent credences (e.g., \(c = (0.6, 0.6)\)) remain accuracy-dominated even after refinement.  

  **Key takeaway**: Brier's partition sensitivity does not undermine the probabilism argument for a fixed partition. Refinement highlights its global nature but doesn't collapse it to locality.

  ---

  #### **(e) Intuitive Core: Why Global Measures?**
  **Veritist justification for global measures**:  
  A global measure like Brier enforces two desiderata:  
  1. **Directional accuracy**: High credence in true cells.  
  2. **Magnitude calibration**: Total credence \(\sum_j c_j = 1\) (since truth has magnitude 1).  

  **Why this matters**:  
  - **Incoherent inflation** (e.g., \(c = (0.6, 0.6)\)) misrepresents reality by implying *two* cells are likely true (total credence = 1.2).  
  - **Incoherent deflation** (e.g., \(c = (0.4, 0.4)\)) underrepresents reality (total credence = 0.8).  
  - **False-cell overconfidence** (e.g., \(c = (0.4, 0.6)\) when \(w_1\) is true) inaccurately elevates a false cell.  

  **Log score's weakness**:  
  It ignores magnitude and false cells, allowing:
  - Inflation without penalty (assign \(c_i = 10^6\) to all cells; "truth" is assigned massively, but falsehoods are too).  
  - No incentive to lower credence in false cells.  

  **Epistemic intuition**:  
  Accuracy should reflect **comprehensive representational fidelity**—how well the *entire* credence vector mirrors the ontic truth (one cell true, others false). Local measures fail by ignoring the "falsehood-tracking" role of credences. A global measure like Brier formalizes this holistically.

  ---

  ### Summary
  - **(a)** Strict propriety over the non-negative orthant enables dominance arguments by enforcing magnitude calibration.  
  - **(b)** Log's failure is structural: locality prevents strict propriety over the orthant.  
  - **(c)** Brier's refinement component penalizes false-cell overconfidence, crucial for dominating incoherent credences.  
  - **(d)** Arguments are partition-relative; refinement doesn't undermine Brier's global nature.  
  - **(e)** Veritists should prefer global measures: accuracy requires matching both truth-values *and* total magnitude.  

  This framework reveals that the success of accuracy-first arguments depends critically on the *global structure* of the inaccuracy measure. The Brier score exemplifies this; the Log score does not.
