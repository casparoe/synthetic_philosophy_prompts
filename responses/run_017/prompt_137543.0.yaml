prompt: |-
  Hey — I work in a materials testing lab (mostly brittle fracture and fatigue), and an argument in our group chat has turned into a mild obsession, so I'm hoping you can tell me whether there's an established concept for what I keep running into.

  It started with a specific alloy. The question was whether it's *really* brittle at room temperature. Put a load on it and a crack does start — and then the crack stops: the plastic zone at the tip blunts, local stress drops, and it arrests after a millimetre or two. The sample is still brittle in the ordinary sense (load a different region, or re-machine and load again, and it cracks again), but no single test ever gives you the full thing: the fracture begins and is then undone by its own beginning. Same shape in a case my brother-in-law, who's a chemist, keeps bringing up: a catalyst that is genuinely disposed to speed up a reaction, does visibly start working, and then gets poisoned by its own product binding to the active sites — catalyst undamaged, disposition fully intact, nothing external blocking it, the process just shuts itself off part-way. And then there's fatigue, which is maybe a third thing or maybe the same thing from a different angle: a coupon that survives any single load you care to apply, but develops a crack over a hundred thousand cycles — is that one disposition whose manifestation is spread over many applications of the stimulus, or a hundred thousand different dispositions?

  I've since read around a bit and found the cases people always wheel out — the sorcerer who would make the glass stop being fragile at the very instant it was struck, and the glass packed in padding so that it's fragile and yet never breaks. Neither is mine, or so I want to say: in the first, the disposition itself goes away; in the second, nothing happens at all. In mine the disposition survives, something definitely happens, and it's the happening that stops it. It's also not the fool's-gold situation, where something produces the characteristic behaviour without having the disposition at all — my stuff really has it, it just can't finish. Please don't just hand me a label; I want the carving: what exactly this is, why it isn't the two famous cases (or why it secretly is one of them), and where its edges are — e.g. does it matter that the stopping factor is internal rather than external, and what happens to it when the arrest occurs so early that nothing detectable occurs at all?

  Could you format the answer with these sections: "Nearest misses" (about 200 words — the closest established ideas and why each fits or doesn't), "The phenomenon itself" (about 250 words — what's actually going on, and whether the all-or-nothing/instantaneous assumption in the standard cases is doing hidden work), "A name and a definition" (about 120 words — your term plus necessary-and-sufficient-ish conditions), "Boundary cases" (about 200 words — the early-arrest case, the fatigue case, and one more you invent), and "Bottom line" (about 60 words, plain English).
reasoning: |-
  Okay, the user works in a materials testing lab focusing on brittle fracture and fatigue. They're describing a phenomenon where a material starts to fracture but stops almost immediately due to the plastic zone blunting the crack tip, reducing local stress. The material remains brittle overall, but each test doesn't lead to complete failure. They compare this to a catalyst that gets poisoned by its own product and fatigue where failure happens over many cycles. 

  The user wants to understand if there's an established concept for this. They mention two common examples: a sorcerer making glass non-fragile when struck and glass packed in padding that never breaks. They feel these examples don't fit because in their case, the disposition remains, something happens, but the process stops itself. They want a clear distinction and a new term if needed.

  First, I need to recall established concepts. For materials, crack arrest toughness is a thing. It's the stress intensity factor below which a crack stops. But that's more about propagation than initiation. The user's case has initiation with immediate arrest due to blunting. Fracture mechanics usually treats initiation and propagation separately. Their alloy initiates but arrests quickly. 

  The catalyst example involves self-inhibition. Catalysts can be poisoned by products, which is known in chemistry. But the user points out the catalyst isn't damaged, just temporarily blocked. Similarly, in fatigue, it's about cumulative damage over cycles. Each cycle might not cause failure, but the accumulation does. 

  The sorcerer example is about dispositional changes, like the glass losing fragility when struck. The padding example is about masking. The user's case is different because the disposition persists, the action starts, but halts due to its own consequences. It's intrinsic self-limiting behaviour.

  I need to check if there's a term for this. "Self-arresting fracture" exists in geology for faults stopping due to stress drops. In materials, "pop-in" cracks might start but stop. But these are specific. The user's broader concept applies across fields. 

  For the name, something like "Self-Negating Manifestation" or "Auto-Abortive Disposition" might work. It captures the initiation followed by self-induced arrest. The key points are: disposition exists and is triggered, the process initiates, but internal feedback stops it. The disposition remains intact for future triggers.

  Boundary cases: if arrest happens too early, maybe no detectable event occurs. Is that still the same? The user's catalyst still starts working but stops. Fatigue as repeated cycles causing eventual failure—each cycle might be a micro self-arrest until one isn't. The distinction is whether each trigger produces a partial event that self-stops.

  The core is the manifestation's consequences preventing completion. Unlike masking, the trigger does activate the disposition. Unlike dispositional change, the property remains. It's a middle path where the process self-limits.
answer: |-
  Here’s a structured analysis of your phenomenon, with precise conceptual carving:

  ---

  ### Nearest Misses (≈200 words)
  *   **Crack Arrest Toughness (K_ia)**: Material-specific stress intensity below which a propagating crack stops. **Fits**: Describes arrest after initiation. **Misses**: Focuses solely on propagation mechanics within fracture mechanics. Doesn’t capture the *persistence of the brittle disposition* after arrest or extend to non-material cases (catalyst, fatigue). Your alloy arrest is an *immediate, intrinsic consequence of initiation itself* via blunting.
  *   **Disposition Masking (e.g., padded glass)**: The disposition exists, but an external barrier prevents manifestation. **Fits**: Disposition remains intact. **Misses**: In your cases, the stimulus *is* applied and *does* trigger the characteristic initial behavior (crack initiation, catalytic activity). The stopping mechanism is *internal* and *consequence-driven* (blunting stress drop, product poisoning), not an external barrier blocking stimulus access.
  *   **Conditional Dispositions (e.g., sorcerer's glass)**: The disposition itself changes (fragility vanishes at impact). **Fits**: A change occurs at the trigger moment. **Misses**: In your cases, the disposition *does not change or vanish*. Brittleness remains after arrest; catalytic disposition persists after poisoning. The *manifestation process* halts, not the disposition itself.

  ---

  ### The Phenomenon Itself (≈250 words)
  Your phenomenon hinges on a **triggered disposition manifesting in a way that intrinsically generates immediate negative feedback**, halting its own continuation *while leaving the underlying disposition intact*. The core is a **self-limiting feedback loop embedded within the manifestation process**:

  1.  **Disposition Activation**: The stimulus triggers the characteristic initial behavior (crack nucleation, catalytic turnover, cyclic slip/deformation).
  2.  **Intrinsic Negative Feedback Generation**: This initial manifestation *directly and necessarily* produces a counteracting factor *as part of its own occurrence*:
      *   Crack nucleation → Plastic zone formation → Local stress relaxation/blunting.
      *   Catalytic turnover → Product generation → Product binding/poisoning.
  3.  **Manifestation Arrest**: The counteracting factor rapidly overwhelms the driving force for the initial behavior, halting further manifestation *within the same triggering event*.
  4.  **Disposition Persistence**: The fundamental property (brittleness, catalytic activity, susceptibility to fatigue damage) remains unchanged. The system is reset and ready for a *new* triggering event elsewhere/elsewhen.

  **The Hidden Assumption:** Standard cases (sorcerer, padding) implicitly treat dispositions as having **instantaneous, all-or-nothing manifestations**. Your phenomenon reveals **manifestation as a *process* with internal structure and potential for feedback**. The "something happening" (initiation) and the "undoing" (arrest) are sequential phases *within* a single manifestation attempt of the persistent disposition.

  ---

  ### A Name and a Definition (≈120 words)
  **Term: Auto-Abortive Disposition (AAD)**

  **Definition:** An Auto-Abortive Disposition is a causal property of a system whereby:
  1.  The application of a characteristic stimulus **successfully initiates** the disposition's core manifestation process.
  2.  This initial manifestation **intrinsically generates negative feedback** as a direct consequence of its own occurrence.
  3.  This feedback **rapidly arrests** the continuation of the manifestation process *within the scope of the triggering event*.
  4.  The underlying disposition **remains fundamentally intact** and capable of being re-triggered by subsequent stimuli.

  *(Necessary & Sufficient-ish: Initiation + Intrinsic Feedback → Arrest + Persistence)*

  ---

  ### Boundary Cases (≈200 words)
  1.  **Extreme Early Arrest (Undetectable Initiation)**: If feedback is *instantaneous* relative to initiation, does it count? **Resolution:** If initiation is theoretically required for feedback generation (e.g., even a single bond break enabling blunting, a single catalytic turnover releasing the poison), it's still AAD. If no initiation occurs *at all*, it's masking or misidentification. Detectability is an epistemic limit, not a definitional one for AAD.
  2.  **Fatigue**: Is each cycle an AAD, or is fatigue something else? **Resolution:** Each cycle involves *initiation* of slip/deformation/micro-crack growth and potential *arrest* via local plasticity/redistribution (intrinsic feedback). The *disposition* is susceptibility to cumulative damage. Each cycle is a micro-AAD event where the manifestation (damage increment) is arrested but the disposition persists, allowing the next cycle. Macroscopic failure occurs when feedback mechanisms are finally overwhelmed. Fatigue *exemplifies* AAD occurring iteratively.
  3.  **Invented Case: Self-Quenching Fluorescence**: A molecule fluoresces (disposition) when excited by light (stimulus). The emitted photon (manifestation product) has a wavelength absorbed by the *same* molecule, immediately de-exciting it (intrinsic negative feedback). Emission stops almost instantly after initiation, but the molecule remains fluorescent. Classic AAD.

  ---

  ### Bottom Line (≈60 words)
  You've identified a real gap: dispositions where the manifestation process *itself* contains the seeds of its own rapid halt. It's not masking (stimulus gets through, initiation happens), nor disposition loss (the property endures). Call it **Auto-Abortive Disposition (AAD)**. It's defined by successful initiation, internally generated feedback causing arrest, and disposition persistence. Fatigue involves iterative micro-AAD events; early arrest still counts if initiation occurs.
