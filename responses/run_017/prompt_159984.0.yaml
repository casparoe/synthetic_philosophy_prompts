  We are designing a 90-minute workshop activity for novelists that illustrates the problem of symmetric reasoning in dilemmas without using game theory jargon. The goal is to have participants experience the conflict between individual dominance reasoning and the idea that identical reasoners might be constrained to act together.

  Constraints:
  - No words: game theory, prisoner's dilemma, cooperate, defect, Newcomb, evidential, superrationality until debrief.
  - Use novelists' vocabulary: sealed endings, a character who cannot hear you, the same story written twice.
  - Real stakes: use the instructor's time and desirable objects (e.g., manuscript consultation, notes on excerpt, a good bottle, first refusal on something).
  - The activity must be playable, not just describable.
  - Two rounds: 
      Round 1: Anonymous one-shot plays in pairs, to elicit dominance reasoning.
      Round 2: Pairing with a "byte-identical" counterpart, with a twist of writing advice to that counterpart.

  Also, include a group-level variant and address what might go wrong.

  Structure:
  1. Introduction (5 minutes)
  2. Round 1: The Sealed Ending (25 minutes)
  3. Transition and Setup for Round 2 (10 minutes)
  4. Round 2: The Mirror Character (35 minutes)
  5. Debrief (15 minutes)

  Total: 90 minutes.

  Detailed Plan:

  1. Introduction (5 minutes)
     - Welcome and set the context: "Today we're going to explore character decision-making through an activity that involves making choices in a constrained environment. We'll be looking at how characters (and people) reason when faced with difficult decisions, especially when the outcome depends on what someone else does."
     - Explain the first activity briefly: "In the first part, you'll be paired randomly with another participant. Each of you will make a private, anonymous choice that affects both of you. We'll then reveal the outcomes and discuss."

  2. Round 1: The Sealed Ending (25 minutes)
     - Setup (5 min): 
          - Divide participants into pairs randomly (using pre-prepared slips of paper with pair numbers). 
          - Give each participant a sealed envelope and two cards (labeled A and B) and a small slip of paper. 
          - Instructions: "You and your partner are each to choose one of two options: A or B. Write your choice on the slip, seal it in the envelope, and write your pair number on the envelope. Then hand it in. You cannot communicate with your partner."
          - Payoff scheme (explain verbally and also on a handout for reference):
              - If both choose A: each gets 2 points.
              - If one chooses A and the other B: the one who chose B gets 3 points, the one who chose A gets 0.
              - If both choose B: each gets 1 point.
          - Emphasize: Points will be converted into lottery tickets for prizes at the end of the workshop (the prizes are the stakes: e.g., manuscript consultation, notes on excerpt, a bottle of wine, first refusal on a desirable object). The more points, the more tickets.
     - Play (5 min): Participants choose and seal their choices.
     - Collect envelopes and reveal outcomes (10 min):
          - Open the envelopes and record the outcomes for each pair on a whiteboard (without revealing individual identities, just pair outcomes).
          - Tally the points for each participant (they can track their own points on a personal scorecard).
          - Quick discussion (5 min): Ask a few participants: "Why did you choose what you chose?" Expect dominance reasoning: "No matter what the other does, I do better by choosing B." (Because if they choose A, I get 3 with B vs 2 with A; if they choose B, I get 1 with B vs 0 with A.) Note: This sets up the standard argument.

  3. Transition and Setup for Round 2 (10 minutes)
     - Introduce the concept for Round 2: "Now, we're going to do a similar activity, but with a twist. This time, you are going to be paired with a very specific counterpart. We have created pairs of participants who are going to receive the exact same set of instructions and background. Think of it as two characters in a novel who are written by the same author, with the same backstory and the same decision-making process. They are, in a sense, identical in every way that matters for this choice. And they both know that they are identical to their counterpart."
     - Emphasize: "In this round, before making your choice, you will write one sentence of advice to your counterpart. You will seal that advice and hand it in. I will read some of the advice aloud (anonymously) before any choices are made or revealed."
     - Pairing mechanism: 
          - Pre-assign pairs for Round 2. How to make it verifiable? We need to ensure that participants believe they are paired with an identical counterpart.
          - Idea: Before the workshop, prepare two sets of identical instructions for each pair. Each set will be in an envelope with a unique pair number. The instructions will be exactly the same for both members of the pair. Also, prepare a list of pair assignments (to be posted after the advice is written and collected, but before choices are made?).
          - To avoid suspicion: Explain that the pairings are determined by a random process that ensures each person has a counterpart with the same instructions. We can use a public method: 
              - Step 1: Have each participant draw a number from a hat (numbers 1 to 9 if 18 participants, each number appearing twice). Then, the two with the same number are paired. This is done publicly so they see that there is a counterpart with the same number. 
              - But note: We want them to have the same instructions and know it. So we can say: "The number you draw corresponds to a set of instructions that is identical for both of you. You both have the same role, the same information, and you both know that the other has the same."
          - However, we want them to write advice before knowing who the counterpart is? That might be tricky. Instead, let them know the pairing number but not the person. So: 
              - Each participant draws a number (say 1 to 9) from a hat. Then they are told: "The person who has the same number as you is your counterpart. You don't know who they are, but you both have the same instructions and you both know that the other has the same. Now, write a sentence of advice to your counterpart, and seal it in an envelope with your pair number and the word 'Advice' on it."
     - Payoff scheme for Round 2: Same as Round 1? Or different? We can keep it the same to highlight the contrast. But note: We want to set up the symmetric dilemma. However, the group variant is coming. So let's keep Round 2 as pairs.

     Steps for Round 2 setup:
          - Draw numbers (publicly) (2 min)
