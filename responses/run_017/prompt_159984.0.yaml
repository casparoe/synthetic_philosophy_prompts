answer: |-
  Below is a complete, playable workshop activity designed to meet your exact specifications. It uses novelists' vocabulary, avoids game theory jargon until debrief, and forces participants to confront the conflict between dominance reasoning and symmetric reasoning through experiential mechanics. The activity is structured for **90 minutes** with 16–18 adults, moveable tables, and stakes in your "currency" (consultations, notes, bottles, etc.). Materials fit in one bag.

  ---

  ### **Activity Title: "The Sealed Ending Dilemma"**  
  *Core Metaphor:* Two authors write the same character facing the same choice in parallel stories. Can they "coordinate" without communicating?  

  ---

  ### **Materials Needed** (fit in one backpack):  
  - 18 envelopes (9 pairs)  
  - 36 blank cards (2 per participant)  
  - 18 slips of paper ("choice slips")  
  - 18 small sheets ("advice sheets")  
  - Pens  
  - Two glass bottles (one premium, one ordinary)  
  - Prize descriptions (e.g., "Manuscript Consultation - 60 min," "Written Notes - 10 pages," "Premium Wine Bottle")  
  - Timer  

  ---

  ### **Stakes Setup**  
  - **Currency:** Your working time (consultations/notes) + desirable objects (wine bottles, first refusal on rare books).  
  - **Structure:**  
    - Points earned convert to lottery tickets. Each ticket = one entry for prizes.  
    - **Critical Bite:** Stakes must hurt *most* in Round 1 (to entrench dominance reasoning) and *taper* in Round 2 (to expose cognitive dissonance).  
    - **Prize Allocation:**  
      - 1st–3rd highest scorers: First choice of prizes (e.g., consultation, wine, notes).  
      - 4th–6th: Remaining prizes.  
      - All others: "First refusal" tokens (e.g., dibs on future workshop spots).  

  ---

  ### **90-Minute Timeline**  

  #### **PART 1: ROUND 1 — THE SOLITARY AUTHOR (20 min)**  
  *Goal: Elicit dominance reasoning organically.*  
  - **0–5 min:** Framing (no jargon).  
    - *"Imagine you’re writing a character who faces a choice. Their ending is sealed in an envelope—they can’t hear you. You pick A or B. Your points depend on what an anonymous ‘co-author’ (another participant) picks for their character. More points = better lottery odds for prizes."*  
    - Show payoff scheme visually:  
      ```  
      If you pick A and co-author picks A → Both get 2 points  
      You pick A, co-author picks B → You get 0, co-author gets 3  
      You pick B, co-author picks A → You get 3, co-author gets 0  
      Both pick B → Both get 1 point  
      ```  
  - **5–10 min:** **Write choices.** Participants write A/B on **choice slips**, seal in envelopes labeled with pair numbers (pre-assigned random pairs). Collect envelopes.  
  - **10–15 min:** **Reveal outcomes.** Open envelopes, record pair results on a board (e.g., "Pair 3: A and B → 0 and 3"). Distribute points.  
  - **15–20 min:** **Brief discussion.** Ask: *"Why did you choose what you did?"*  
    - *Expected response:* "However my co-author chose, I got more by picking B."  
    - *Your role:* Nod, but **do not name "dominance."**  

  #### **PART 2: TRANSITION TO ROUND 2 (10 min)**  
  - **20–25 min:** **Introduce symmetric framing.**  
    - *"Now, imagine two authors writing the same character. They receive identical briefs, know they’re identical, and know the other knows. You’ll advise your ‘mirror author’ before choosing."*  
  - **25–30 min:** **Pair assignment.**  
    - Publicly draw numbers from a hat (1–9, each number twice). Holders of matching numbers are "mirror authors."  
    - *Crucial trust step:* Let participants verify matches (e.g., *"Number 3, meet your mirror"*). Tables rearrange so pairs sit together.  

  #### **PART 3: ROUND 2 — THE MIRROR AUTHOR (35 min)**  
  *Goal: Create cognitive dissonance via advice/choice mismatch.*  
  - **30–35 min:** **Write advice.**  
    - Each writes one sentence on **advice sheet** for mirror author (e.g., *"Pick A—it’s nobler"*). Seal in envelope labeled with pair number. Collect.  
  - **35–40 min:** **Read advice samples.** Open 3–4 envelopes anonymously. Read advice aloud (e.g., *"Pair 2’s advice: ‘Choose B to win’"*).  
  - **40–45 min:** **Make choices.** Same payoff as Round 1. Write A/B on **choice slips**, seal in envelopes.  
  - **45–55 min:** **Reveal outcomes.** Open envelopes. Record:  
    - Pair number  
    - Advice given  
    - Choices made  
    - Outcome (points)  
    - *Example:* "Pair 5: Advised ‘Pick A.’ Chose A and B → 0 and 3."  
  - **55–65 min:** **Silent observation.** Let participants scan the board. *Likely result:* 60–70% of pairs show advice/choice mismatch (e.g., both advise "A" but pick B).  

  #### **PART 4: GROUP VARIANT — THE WRITERS’ RETREAT TEMPTATION (10 min)**  
  *Goal: Contrast pair symmetry with group fragility.*  
  - **65–70 min:** **Framing.**  
    - *"At a writers’ retreat, each guest is offered a rare bottle (point to premium bottle) privately. If anyone takes it, the host cancels group gifts (ordinary bottles). If none take it, everyone gets a gift. You decide by secret ballot: TAKE or PASS."*  
  - **70–75 min:** **Vote and reveal.**  
    - Votes on slips. If ≥1 TAKE → only takers get 3 points. If all PASS → everyone gets 2 points.  
    - *Why it pulls against pairs:* Group size breaks symmetry (no identical counterpart). Dominance reigns: *"I gain by taking, whether others pass or take."*  

  #### **PART 5: DEBRIEF (15 min)**  
  *Map moments to concepts without jargon until the end:*  
  - **75–80 min:** **Recall Round 1.**  
    - *"You said: ‘My co-author’s choice is fixed. I do better picking B regardless.’"* → **Dominance reasoning.**  
  - **80–85 min:** **Contrast Round 2.**  
    - Point to advice/choice mismatches: *"You advised your mirror author one thing but did another. Why?"*  
    - Highlight tension: *"If your mirror author is identical to you, shouldn’t they pick what you pick? Then B only gets 1 point, but A gets 2. Yet you picked B—why doubt the symmetry?"* → **Symmetric reasoning conflict.**  
  - **85–87 min:** **Group vs. pair.**  
    - *"In the retreat, taking was tempting alone—but with your mirror author, you might coordinate if you trusted sameness. Groups don’t have that anchor."*  
  - **87–90 min:** **Name concepts + validate dissent.**  
    - Finally use terms: *"This mirrors ‘superrationality’: if reasoners are identical, choices aren’t independent. But in practice, we don’t trust it."*  
    - **Where dissent is reasonable:** *"You could argue identicality is unrealistic—we’re not clones. But if you refuse the idea entirely, you miss why it changes the ‘menu’ of choices."*  
    - End: *"In fiction, this tension can break a character: do they act alone or as part of a mirrored pair?"*  

  ---

  ### **Critical Mechanics Notes**  
  1. **Why advice works:**  
     - Advice exposes hypocrisy. Participants say "pick A" (hoping for symmetry) but pick B (dominance). The public mismatch makes the conflict visceral.  
     - **Fix:** Keep advice anonymous and brief. Reading only *samples* preserves privacy while showing patterns.  

  2. **Group variant placement:**  
     - After Round 2, as a palate cleanser. Shows how symmetry collapses in groups (no "mirror" anchor). Smaller groups (e.g., 4) could coordinate; 16–18 cannot.  

  3. **Pairing trust:**  
     - **Risk:** Participants suspect pairs aren’t "identical."  
     - **Solution:** Public number draw + immediate mirror verification ("If you have #5, stand together").  
     - **Backup:** Emphasize *"identical briefs, not identical people"* to preempt skepticism.  

  4. **Predictable Snafus:**  
     - **SNAFU:** Round 2 pairs coordinate perfectly (all pick A).  
       - **Mitigation:** Stakes in Round 1 incentivize B; advice samples prime doubt (e.g., if advice is "pick B," mirrors won’t trust).  
     - **SNAFU:** Participants call the setup "rigged."  
       - **Mitigation:** Transparent pair-matching; avoid overclaiming identicality ("same instructions," not "same brain").  
     - **SNAFU:** Group variant has all PASS (rare).  
       - **Lean in:** *"Why? Did you trust strangers more than your mirror author?"*  

  5. **Evidence of Success vs. Noise:**  
     - **Success:**  
       - Gasps/laughter when advice contradicts choices.  
       - Post-Round 2 silence (cognitive dissonance).  
       - Debrief questions about "trusting" the mirror.  
     - **Noise:**  
       - Competitive gloating (point-focused).  
       - Abstract questions pre-debrief (politeness).  

  6. **What the Game Can’t Stage:**  
     - The **epistemic weight** of identicality. Participants won’t *feel* their choices are ontologically linked. You must explain: *"Superrationality isn’t about trust—it’s about logical necessity. If you’re identical, your ‘choices’ are one event."*  

  ---

  ### **Character Scene Integration**  
  In your novel, mirror this structure:  
  1. Retreat leader runs Round 1 (dominance emerges organically).  
  2. Round 2 with advice exposes hypocrisy (participants squirm).  
  3. Group variant fails (someone takes the bottle).  
  4. Debrief names "superrationality"—but a skeptic argues: *"Identical authors? That’s fantasy. We’re all messy drafts."*  
     - **Cost of refusal:** The skeptic misses how symmetry redefines self-interest, but gains realism. Ambiguity lingers.  

  This activity forces the collision, leaves room for doubt, and works equally well for your workshop and novel. Run it as-is.
