prompt: |-
  hey — I'm a PhD student in metaphysics, writing the chapter where I try to show that restricted answers to the special composition question are unstable: they either quietly collapse into universalism or they turn into some kind of brutalism with extra steps. I want a pair of cases to open the seminar with and my own attempts keep falling apart. Can you build me one?

  What I need: two cases, A and B, such that —

  1. At the level of description a contact- or cohesion-style criterion can see — what's touching what, what's bonded to what, the topology of the arrangement, what's flowing where and at what rate, what moves together when you poke it — the two are as near identical as you can get them. Ideally a working biologist told only that much couldn't guess which case she was being shown.
  2. Under the life criterion (the van Inwagen-ish answer: some things compose something further iff their activity constitutes a life) the verdict clearly flips. Yes in one, no in the other. Direction is up to you, but I need an actual flip, not just a case that's hard for one theory.
  3. No cheating off vagueness. No viruses, no prions, no "well, is a slime mold one organism or many" shrugging, nothing on the life/not-life borderline. Both verdicts should be ones a holder of each theory would state confidently.
  4. Realistic. No sci-fi, no demons, no exotic physics. Ordinary biology or ordinary artefact-y setups are fine. Pls skip corpses, coma patients and brain-dead bodies on ventilators — I tried all three and they're doing some other job entirely, plus people just start arguing about death.
  5. Nothing conscious in either case. Every time I put a subject of experience in, forty minutes vanish into personal identity. Plants, fungi, colonial marine inverts, cell cultures, industrial machinery — anything that isn't a subject.
  6. The annoying constraint: state both cases without using a single singular term for a composite object. Plural talk about the simples only (or about cells/molecules/parts, if you want to fix a level and treat it as simple enough for the purpose), plus topological, causal, and functional vocabulary. It's a pain, but half the room are nihilists and if my setup says "the organism" they'll just say I begged the question.
  7. Stretch goal: make A and B the two ends of one continuous process, where the contact-level description from (1) never jumps discontinuously anywhere in the middle. If you can't, tell me why it can't be done and I'll quietly drop that bit.

  Then, after the cases:

  - Verdicts in both cases under (a) nihilism, (b) universalism, (c) the life criterion, (d) a plain contact criterion, and (e) a hobbyhorse of mine I want stress-tested: call it Non-Redundancy — some things compose something further iff there is some activity they perform together that no proper subset of them could perform on its own. I made it up, so don't go looking for it; what I want to know is whether it peels off from the other four on your case or just shadows one of them.
  - A sentence or two of why for each verdict, not just the verdict.
  - Which single feature of the case is doing the work, and what happens if you delete it. If removing it makes all five theories say the same thing in both cases, I need to know — that's arguably the result I want for the chapter, so don't hide it.
  - Last thing: steelman the parity objection. Whatever feature you used to generate the flip, why isn't the moderate just gerrymandering — picking whichever feature delivers the answer she likes and then calling that feature composition-relevant? Give me the strongest reply available to the moderate, and then give me your honest read on whether this pair helps her or hurts her.

  A paragraph each for the cases, tops; the discussion after can be as long as it needs to be. thx!
reasoning: |-
  Hmm, the user is a PhD student in metaphysics working on a chapter about the instability of restricted composition theories. They need a pair of cases that appear identical under contact-based criteria but flip under the life criterion, without vagueness, sci-fi, consciousness, or composite object terms. They also want analysis under several theories including their own Non-Redundancy criterion.

  The life criterion requires a clear distinction between living and non-living systems. For Case A, I'm considering a healthy plant with functional nutrient transport and coordinated growth - clearly alive. For Case B, I'll create a near-identical system using a hydroponic setup with peristaltic pumps and timers that precisely mimic the plant's vascular flow patterns. The key is making the mechanical system replicate the biological processes without actually being alive.

  I need to ensure both systems appear identical at the contact level: same tube structures, same fluid movement patterns, same responses to perturbations. The biological system must be unambiguously alive (no borderline cases like slime molds), while the artificial system must be clearly non-living despite its sophisticated mimicry.

  For the continuous process version (stretch goal), I could describe a plant gradually being replaced by artificial components, maintaining identical structure and function throughout until the final switch to full artificiality. This demonstrates how composition verdicts flip without any contact-level discontinuity.

  The analysis will show:
  - Nihilism: no composites in either case
  - Universalism: composites in both
  - Life criterion: composite only in Case A
  - Contact criterion: composites in both
  - Non-Redundancy: composite in both (since both systems have irreducibly collective functions)

  The critical feature is whether the coordinated activity emerges from biological organization (life) or external programming. Removing this distinction would collapse the cases together. For the parity objection, the moderate can argue that life is a natural joint in reality rather than gerrymandering, though this pair highlights the difficulty in justifying why life specifically should matter for composition.
answer: |-
  Here's a pair meeting your constraints. The key difference is the *source* of coordination and self-maintenance: endogenous biological organization vs. externally programmed machinery.

  **Case A (Life: YES):**  
  A healthy *Elodea* freshwater plant fragment in an aquarium. Many plant cells (say, 10,000) are arranged such that:  
  (i) Cell walls adhere tightly to adjacent cells.  
  (ii) Cytoplasmic strands connect interiors of adjacent cells.  
  (iii) Water and dissolved minerals flow continuously through interconnected, tube-like structures formed by aligned cells; the flow direction and rate vary predictably in response to light intensity changes sensed by pigment-containing cells.  
  (iv) When a probe gently pushes one edge, adjacent cells resist displacement together, and the flow pattern adjusts to maintain pressure gradients.  
  (v) Sugars are synthesized in some cells using light and CO2, transported through connected cells to others, where they are broken down; energy from breakdown drives ion pumps maintaining internal chemical differences across cell membranes against diffusion.  
  (vi) New cell walls and cytoplasmic components are synthesized using materials from the flows, increasing the total spatial extent occupied over weeks.

  **Case B (Life: NO):**  
  A sophisticated microfluidic bioreactor mimicking *Elodea*. Many synthetic hydrogel microcapsules (≈10,000), each containing:  
  - An inert semi-permeable outer shell bonded chemically to adjacent shells.  
  - Internal tubing connecting to adjacent capsules via precisely aligned ports with valve-like structures.  
  - A suspension of glucose, salts, and inert colloidal particles.  
  Flow is driven by an array of external peristaltic pumps controlled by a light sensor. Flow rate/direction changes identically to Case A in response to light. Probes encounter identical resistance and flow adjustments due to pressure feedback loops controlling the pumps. Glucose is added to inflow streams to mimic synthesis; "breakdown" is simulated by glucose removal via selective filters in some capsules, with energy supplied externally to pumps maintaining ion gradients. New capsules are added periodically by an external robot, bonding to the edge and connecting flow ports, increasing total spatial extent identically. No molecules are synthesized *within* any capsule using energy derived internally.

  ---

  ### Analysis of Verdicts
  1.  **Nihilism:** NO composition in both A and B. Only the plant cells/microcapsules exist fundamentally. Their coordinated behavior doesn't necessitate a further object. *(Why: Nihilism denies composition ever occurs, regardless of organization or function.)*
  2.  **Universalism:** YES composition in both A and B. Any plurality of things composes a further object. The cells/capsules compose one object; every random subset composes another. *(Why: Universalism demands composition always occurs.)*
  3.  **Life Criterion (van Inwagen):** YES in A, NO in B. In A, the cells’ joint, self-sustaining (via internal energy capture/conversion), self-repairing (via internal synthesis), and self-directed (growth pattern) activity constitutes a life. In B, the activity, while externally identical, is entirely orchestrated and powered from outside; no internal self-sustaining process constitutes a life. *(Why: Life requires self-contained metabolic processes driven by internal energy conversion, absent in B.)*
  4.  **Contact/Cohasion Criterion:** YES composition in both A and B. The cells/capsules are bonded together in a continuous, cohesive structure exhibiting unified mechanical behavior (resisting probes together). *(Why: Physical bonding and unified mechanical response are paradigmatic triggers for contact criteria.)*
  5.  **Non-Redundancy Criterion:** YES composition in both A and B. In both cases, the coordinated flow and pressure maintenance, and the resistance to displacement when probed, are activities performed collectively. No proper subset of cells/capsules (e.g., just the inflow side) could sustain the global flow pattern or resist displacement in the same way independently. *(Why: The system-level functions rely on the integrated whole; subparts lack the complete structure/connections.)*

  ### Critical Feature & Its Removal
  *   **The Critical Feature:** The presence (A) or absence (B) of **internal, self-sustaining metabolic processes driven by captured/converted energy**, resulting in genuine self-maintenance and self-directed growth/replacement.
  *   **Effect of Removal:** If you remove the requirement for *internal* energy conversion and self-maintenance (making the life criterion just about complex, coordinated, self-sustaining *behavior*), then the distinction collapses. Both A and B would satisfy this weakened "life" criterion, and all restricted criteria (Life, Contact, Non-Redundancy) would yield YES for both. This *is* the instability you seek: restricting composition to "life" either requires this robust internal metabolic feature (distinguishing A/B), or it collapses into accepting any highly coordinated, self-sustaining system (like B) as composing an object, effectively shadowing universalism or Non-Redundancy for such systems. A strict life criterion *must* rely on the biological specifics to avoid collapse, but this makes it vulnerable to parity objections.

  ### Steelmanning the Parity Objection & Assessment
  *   **Strongest Reply for the Moderate:** "The distinction between endogenous biological self-maintenance and external artificial control isn't arbitrary; it carves nature at a fundamental joint. Biology reveals a unique ontological category – *life* – characterized by intrinsic teleology, self-perpetuation via internal metabolism, and evolutionary historicity. Case A instantiates this natural kind; Case B is a sophisticated mimic exploiting causal regularities but lacking the intrinsic causal powers and historical lineage defining life. Composition occurs when genuine life emerges because life is a metaphysically significant, objective property, not just complex function. Picking 'life' isn't gerrymandering; it's recognizing a real feature of the world that non-living systems, no matter how functionally similar, fundamentally lack."
  *   **Honest Assessment (Does this pair help or hurt the moderate?):** **It hurts them significantly.** The near-perfect duplication at the contact/functional level exposes the *elusiveness* of the "fundamental joint." The moderate must posit a hidden essence (internal metabolism + intrinsic teleology) not directly observable in the contact/functional descriptions. Yet, the cases show that *all* observable, composition-relevant behaviors (cohesion, unified motion, complex function, system-level maintenance) are present in both. This forces the moderate into either:
      *   **Brutalism Lite:** Insisting composition occurs in A but not B is a brute fact grounded solely in the presence of this specific biological process, admitting no deeper explanation in terms of arrangement or function accessible at level (1).
      *   **Collapse:** Admitting that *any* system exhibiting sufficiently complex self-sustaining behavior (including B) composes an object, abandoning the uniqueness of "life" as the criterion and collapsing towards universalism/Non-Redundancy for complex systems.
      Your Non-Redundancy criterion highlights this pressure: it delivers the same verdict for A and B based on observable function, making the Life criterion seem like it adds an arbitrary, empirically hidden restriction. The pair vividly illustrates how hard it is for the moderate to justify why *only* biological self-maintenance counts, without appealing to question-begging notions of "real" objects or collapsing into admitting functionally equivalent non-biological composites. It pushes them towards the instability your chapter argues for.
