  We are given an A/B test where a new nudging feature was randomly assigned at sign-up. The overall results show that 470/1000 (47%) passed in the feature group versus 440/1000 (44%) in the control group. However, when stratifying by whether the user completed the onboarding module, we see:

  - Among those who completed onboarding:
      - Feature group: 800 users, 55% passed -> 440 passed (800 * 0.55)
      - Control group: 600 users, 60% passed -> 360 passed (600 * 0.6)

  - Among those who did not complete onboarding:
      - Feature group: 200 users, 15% passed -> 30 passed (200 * 0.15)
      - Control group: 400 users, 20% passed -> 80 passed (400 * 0.2)

  Note: The total for the feature group is 440+30=470 and for the control group 360+80=440, matching the overall.

  The paradox is that in each stratum (completers and non-completers) the control group has a higher pass rate (60% vs 55% and 20% vs 15%) but overall the feature group has a higher pass rate (47% vs 44%). This is Simpson's paradox.

  The user stated a rule: "when a reversal like this appears the disaggregated table is the honest one, the headline is just an artefact of a confounder, and the finer the breakdown the safer the inference". However, this rule is not always correct. The key is to understand the causal role of the stratifying variable (onboarding completion).

  In this experiment:
  - Randomization: The feature was randomly assigned at sign-up. So the feature assignment (let's call it T) is randomized and therefore independent of any pre-treatment variables.
  - Onboarding completion (let's call it M) is recorded after the feature is switched on. Therefore, M is potentially affected by the treatment.

  Given that M occurs after treatment, it cannot be a confounder (which is a pre-treatment variable). Instead, it is a mediator or a collider.

  We are not conditioning on a common effect of treatment and outcome, so it's not a collider. Actually, M is a post-treatment variable that lies on the causal path between treatment T (the feature) and the outcome Y (passing the exam). The nudging feature may work by increasing the likelihood of completing the onboarding module, which in turn may increase the chance of passing. Therefore, M is a mediator.

  Now, what do we want to estimate? The decision is whether to roll out the feature. We are interested in the total effect of the feature on passing the exam. The total effect includes both the direct effect of the feature and the indirect effect through increasing onboarding completion.

  The aggregate comparison (overall pass rates) estimates the total effect. The stratified comparison (by M) estimates the effect of the feature conditional on M, which is the direct effect (not mediated by M) but it does not capture the indirect effect.

  In the stratified analysis, we are holding M fixed. But note: the feature affects M. The completion rates are:
  - Feature group: 800/1000 = 80% completed
  - Control group: 600/1000 = 60% completed

  So the feature increases the completion rate. By stratifying by M, we are comparing the feature and control groups within the same level of M. However, the groups being compared within each stratum are not comparable in terms of the type of users. Why? Because the feature caused some users to complete the onboarding who otherwise would not have. In the control group, the 60% who completed are the ones who would complete even without the feature (a more motivated group). In the feature group, the 80% who completed include the motivated group (who would complete anyway) and also some less motivated ones who were nudged to complete. Therefore, the group of completers in the feature group is a mix of highly motivated and less motivated users, while in the control group it's only the highly motivated. This makes the control group look better in the completers stratum. Similarly, the non-completers in the feature group are the ones who did not complete despite the nudge (so they are the least motivated), while in the control group, non-completers include some who might have been nudged to complete if they were in the feature group (so they are a mix of less motivated and some who are even less motivated). Therefore, the non-completers in the feature group are a more negative selection than in the control group.

  Hence, the stratified comparisons are biased for the total effect because they condition on a post-treatment variable (M) that is affected by the treatment. This breaks the randomization because the groups within strata are no longer comparable.

  Therefore, the false presupposition is that the disaggregated table is always the honest one. The correction is that when the stratifying variable is a mediator (or more generally, a post-treatment variable), the aggregate comparison is the one that estimates the total causal effect and the disaggregated table may lead to biased estimates of the total effect.

  Now, let's break down the reversal:

  The aggregate reversal arises because the feature increases the completion rate (from 60% to 80%). The completers have a much higher pass rate (55-60%) than non-completers (15-20%). The feature moves 20% of the control group (200 users) from non-completers to completers (because 80% - 60% = 20% of the total). These 200 users, if they had been in the control group, would have been non-completers and had a 20% pass rate (so 40 of them would have passed). But because of the feature, they become completers and have a 55% pass rate (so 110 of them pass). This is an increase of 70 passes (110 - 40). However, in the completers group, the feature group has a lower pass rate (55% vs 60%) which is a loss. Similarly, in the non-completers, the feature group has a lower pass rate (15% vs 20%). But the overall gain from moving 200 users from non-completers (with 20% pass) to completers (with 55% pass) is so big that it overcomes the within-stratum losses.

  In numbers:

  - The 200 users who were moved by the feature from non-completers to completers:
      - In control (non-completers): expected passes = 200 * 20% = 40
      - In feature (completers): expected passes = 200 * 55% = 110
      - Gain: 70 passes

  Now, consider the remaining users:

  - The 600 users who complete regardless (the always-takers for completion):
      - In control: 600 * 60% = 360 passes
      - In feature: 600 * 55% = 330 passes -> loss of 30 passes

  - The 200 users who are non-completers regardless (the never-takers for completion):
      - In control: 200 * 20% = 40 passes (but note: in the control group, non-completers are 400, which includes 200 never-takers and 200 who would have been moved? Actually, we have to be careful. The control group non-completers are 400, which includes the 200 never-takers and 200 who are moved by the feature? Actually, the 200 moved are in the feature group. In the control group, the 400 non-completers are a mix of the never-takers and the ones who would have been moved? Actually, we don't have that breakdown. Alternatively, we can think of the entire population as having:

    - 600 always-takers: they complete regardless of treatment.
    - 200 compliers: they complete only if given the feature.
    - 200 never-takers: they never complete.

  Then, in the control group:
    - Completers: 600 (always-takers) -> 600 * 60% = 360 passes
    - Non-completers: 200 (compliers) + 200 (never-takers) = 400 -> (200 * 20%? for compliers? Actually, we don't know the pass rate for compliers in control, but in the control non-completers we observe 20% pass rate overall. So the 400 non-completers in control have 400 * 20% = 80 passes.

  But note: the compliers in the control group (non-completers) have a pass rate we don't separately observe. Similarly, the never-takers have a pass rate we don't observe. The observed 20% is the average of these two groups.

  In the feature group:
    - Completers: 600 (always-takers) + 200 (compliers) = 800 -> 800 * 55% = 440 passes
    - Non-completers: 200 (never-takers) -> 200 * 15% = 30 passes

  Now, the 200 never-takers in the feature group have 15% pass rate, but in the control group they are part of the non-completers (which also include compliers) and we saw 20% for the entire non-completers. This suggests that the compliers in control (non-completers) have a pass rate that is higher than 20%? Actually, we can compute:

  Control non-completers: 80 passes from 400 users.

  If we assume that the never-takers have the same pass rate in both groups (which they should because they are not affected by the treatment in terms of completion) then:

  In the feature group, never-takers: 200 * 15% = 30 passes -> so pass rate 15%.

  In control group, non-completers: 400 users = 200 compliers + 200 never-takers. The never-takers in control: 200 * 15% = 30 passes. Then the compliers in control: 80 - 30 = 50 passes from 200 -> 25% pass rate.

  Similarly, the always-takers in control: 600 * 60% = 360 passes.

  In the feature group:
    - Always-takers: 600 * 55% = 330 passes -> so the pass rate for always-takers is 55% in feature and 60% in control? This difference might be due to the feature having a negative direct effect on the always-takers.

  But note: the feature might have a direct effect (not through completion) that is negative. However, the total effect is positive.

  So the reversal arises because the feature increases completion (which is beneficial because completers have higher pass rates) but it also has a negative effect on pass rates for both the always-takers and the never-takers (as seen by the within-stratum lower pass rates in the feature group). However, the positive effect of increasing completion for the compliers (who go from 25% pass rate in control to 55% in feature) is so strong that it overcompensates the negative effects.

  But note: the compliers in the feature group have a pass rate of 55%? Actually, the completers in the feature group are 800 and include always-takers and compliers. We don't know the pass rate of compliers separately. However, the overall gain is from moving the compliers from non-completers (with 25% pass) to completers (with 55% pass) and the negative effect on the always-takers and never-takers.

  Therefore, the aggregate comparison (which shows a 3% point gain) is the total effect and is what we want.

  Now, to the questions:

  1. false_presupposition: 
     - The false rule: "when a reversal like this appears the disaggregated table is the honest one, the headline is just an artefact of a confounder, and the finer the breakdown the safer the inference."
     - Correction: This is not true when the stratifying variable is a mediator (a post-treatment variable), in which case the aggregate comparison estimates the total causal effect and the stratified comparisons estimate direct effects conditional on the mediator, which may be biased for the total effect.

  2. stratifier_role: 
     - Onboarding completion is a mediator because it is a post-treatment variable that is affected by the feature and also affects the outcome.

  3. what_each_comparison_estimates:
     - aggregate: estimates the total effect of the feature on passing, and it is the one that answers the ship-or-roll-back decision because we want the overall impact of the feature.
     - stratified: estimates the controlled direct effect of the feature on passing, conditional on onboarding completion, which does not capture the indirect effect via increasing completion and is not the decision-relevant total effect.

  4. why_reversal_arises: 
     - The reversal arises because the feature increases the completion rate (from 60% to 80%), and the moved group (those who complete only because of the feature) have a higher pass rate as completers (55%) than they did as non-completers (25% in control, but we see 20% overall in control non-completers) and this gain outweighs the negative within-stratum effects.

     But note: to keep it one sentence: "The feature moves 200 students from non-completion to completion, and while these students have a lower pass rate as completers (55%) than the original completers (60%), they have a much higher pass rate than they did as non-completers (20%), and this gain of 70 passes (200*(55%-20%)) is offset by a loss of 30 passes among the 600 always-completing students (600*(55%-60%)) and a loss of 10 passes among the 200 never-completing students (200*(15%-20%)), resulting in a net gain of 30 passes overall."

     However, that is long. Alternatively: "The feature moves some students to a higher-passing group (completers) but within each completion group, the feature slightly reduces the pass rate, and because the moved students are numerous and gain substantially by moving, the aggregate effect is positive."

     Or: "The feature increases completion by 20 percentage points, moving 200 users from non-completers (with 20% pass) to completers (with 55% pass), which gains 70 passes, which more than offsets the 30-pass loss from the 600 always-completers (due to a 5 percentage point drop) and the 10-pass loss from the 200 never-completers (due to a 5 percentage point drop)."

     We'll condense.

  5. recommendation: 
     - Ship the feature because the aggregate comparison shows a positive total effect, which is the decision-relevant quantity.

  6. when_to_stratify: 
     - Stratification is legitimate when the stratifying variable is a confounder (pre-treatment) and we want to adjust for it, but it destroys the estimate of the total effect when the stratifier is a mediator (post-treatment) because it blocks part of the causal path.

