  Hmm, the user is asking me to create a specification for what makes an account of social construction of kinds "good" in the context of a graduate seminar. They want clear standards of assessment that can settle the "so-what" question - whether a kind being socially constructed gives anyone a reason to do anything, what kind of reason, and for whom.

  The user has several specific requirements. First, the account must handle different stock cases (race, gender, money) without treating them as identical - they have important differences in how concepts relate to kinds, whether people can be wrong about them, and how members relate to the classification. Second, the account must clearly distinguish "constructed" from related but different concepts like "caused," "chosen," or "fictional." Third, they have a specific case about a bank's fraud model that emerged unintentionally and evolved into a meaningful category.

  I need to decide whether their third requirement (about the fraud model case) is a genuine desideratum or just their personal hobbyhorse. The user also wants to know which requirement excludes the most existing views, and whether any requirements conflict - specifically whether demanding neutrality about a kind's reality while delivering revisionary conclusions might be incompatible.

  For the specification, I'll need to define what social construction is "out of" - practices, concepts, institutions, material infrastructure - and whether non-intentional elements can be part of the base. The account shouldn't be a full theory of reference or metaphysics, but needs enough to function.

  I'll structure my response with numbered requirements, each with a short name, motivating case, and classification as non-negotiable, negotiable, or camp-specific. For the contrast set, I'll use a table. I'll start with a bottom-line conclusion and keep the analysis of existing accounts brief as requested.

  The bank fraud case seems important - it challenges views that require collective acceptance or intentional creation, suggesting construction can happen through unintentional, emergent processes. This might force revisions to accounts like Searle's status functions. I think it's a genuine desideratum because it reveals a gap in many theories.

  I see potential tension between requiring neutrality about a kind's reality (so construction doesn't imply unreality) and delivering revisionary conclusions (which often assume the kind isn't "fixed"). But they're not strictly incompatible - one can acknowledge constructed kinds as real while arguing for reform. The real conflict is between realist and anti-realist commitments that sometimes sneak into construction accounts.

  I'll outline requirements covering: the construction base (must include practices/institutions and permit non-intentional elements), handling variation across cases (must have machinery for differences), distinguishing contrasts (must mark specific distinctions shown in cases), handling unintentional construction (non-negotiable based on fraud case), and answering the "so-what" question (non-negotiable for the purpose).

  The unintentional construction requirement will exclude the most views (especially Searle-style accounts). The fraud model case shows why collective acceptance isn't necessary - categories can emerge and become consequential without it.
answer: |-
  **A minimally adequate account of social construction must explain how constructed kinds can emerge unintentionally from material practices while distinguishing them from merely caused or fictional kinds, and deliver actionable "so-what" conclusions across diverse cases.**  

  **Requirements:**  
  1.  **Material-Practice Anchoring (Non-negotiable)**  
      *What it must do:* Account for the construction base as including materially anchored practices (e.g., institutions, infrastructure, habitual actions), permitting non-intentional elements.  
      *Motivating case:* **Money.** Physical ledgers, minting practices, and banking infrastructure sustain monetary value independently of any single agent’s intentions. Excluding material infrastructure (e.g., reducing money to pure collective belief) cannot explain its stability or collapse.  

  2.  **Variation-Tracking Machinery (Non-negotiable)**  
      *What it must do:* Explain key differences between paradigm cases (race/gender/money) without reducing them to one mechanism. Must distinguish: (a) whether the kind and operative concept are co-constituted (gender) vs. conceptually mediated (race "science"), (b) susceptibility to error (mistaken racial biology vs. constitutive gender rules), (c) member awareness/adaptation (bank customers adapting to fraud scores vs. unconscious racialization).  
      *Motivating case:* **Race vs. Gender.** Racial categories were *imposed* via erroneous concepts (biology), creating a gap between kind and concept; gender categories often *constitute* the social kind via recognition (no prior "real" gender). A univocal account obscures distinct harms/remedies.  

  3.  **Contrast Preservation (Non-negotiable)**  
      *What it must do:* Clearly distinguish "socially constructed" from:  
      
      | Contrast Term      | Must Distinguish Because:                          | Case Demonstrating Collapse Error          |  
      |--------------------|---------------------------------------------------|-------------------------------------------|  
      | Causally influenced | Construction requires constitutive dependence, not just causation | **Height** is biologically caused *and* socially significant (e.g., discrimination), but not thereby constructed. |  
      | Chosen/Voluntary   | Many constructed kinds (race) are involuntarily assigned. | Arguing gender is "chosen" ignores systemic assignment. |  
      | Merely nominal     | Constructed kinds have causal power (e.g., money). | Calling money "just a label" ignores its economic force. |  
      | Fictional/Unreal   | Constructed kinds are real in their effects (e.g., gender). | Denying racism's impact by calling race "unreal." |  

  4.  **Unintentional Emergence Capacity (Non-negotiable)**  
      *What it must do:* Accommodate kinds emerging from feedback loops in material systems *without* prior collective acceptance or intent.  
      *Motivating case:* **Bank’s Fraud Model.** The algorithmic cluster (1) emerged sans intent/acceptance, (2) gained causal power via behavior adaptation, (3) acquired social reality through later adoption. *This is a genuine desideratum:* It reveals that requiring "collective acceptance" (à la Searle) or "ameliorative intent" is inadequate for cases where construction is systemic and retroactively ratified.  

  5.  **Action-Guiding Output (Non-negotiable)**  
      *What it must do:* For a constructed kind K, output: (a) *who* has reason to act (e.g., institutions, members, affected groups), (b) *what type* of reason (moral, prudential, epistemic), (c) based on construction’s *specific harm/mechanism* (e.g., remedying constitutive misrecognition vs. dismantling material infrastructure).  
      *Motivating case:* **Gender.** Construction reveals reasons for trans-inclusive policies (constitutive harm) vs. reasons to abolish gendered pay infrastructure (material practice). Neutrality about K’s reality *is compatible* with revisionary conclusions: e.g., "Race is constructed *and* real, justifying reparations due to its constitutive harm." The fault line is not neutrality vs. revision, but *whether the account specifies the mechanism generating the reason*.  

  **Scorecard for Major Accounts:**  
  - **Causal-Historical (e.g., Hacking):** Fails (3) & (5) (often conflates constructed with contingent/caused; weak on reasons).  
  - **Constitutive/Ameliorative (e.g., Haslanger):** Fails (4) (requires reflective intent; cannot handle unintentional cases).  
  - **Collective Acceptance (e.g., Searle):** Fails (1) & (4) (over-intellectualizes base; excludes material/non-intentional emergence).  

  **Key Implications:**  
  - **Most exclusionary requirement:** (4) Unintentional Emergence. It invalidates Searlean, constitutive-rules, and ameliorative accounts, which dominate the literature.  
  - **Your fraud model case is decisive:** It forces rejection of intentionalist/acceptance-based models, showing construction requires *systemic practice-based emergence*. This is a core desideratum, not a hobbyhorse—it generalizes to overlooked cases (e.g., algorithmic classes, emergent subcultures).  
  - **Reality/Revision tension is misplaced:** Requirement (5) succeeds if the account *explains how construction generates reasons*, regardless of realism (e.g., "Money is real *because* constructed; this gives regulators reason to manage its infrastructure"). The true conflict is between *mechanistic specificity* (good) and *overgeneralization* (bad).
