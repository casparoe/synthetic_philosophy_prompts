answer: |-
  Here's a scenario meeting your constraints, focusing on a simple representational system:

  **Scenario:** In a population of ground-nesting birds, a specific neural state `S` in a parent is produced by a visual mechanism (`Producer`) upon detecting a large, dark, fast-moving shape overhead. Historically, `S` caused two distinct, evolved downstream responses (`Consumers`):  
  1.  **Distraction Display (`C1`)**: Triggered immediately upon `S`, the parent feigns injury *away from the nest*. This successfully lured away *mammalian ground predators* (like foxes) historically attracted by the display. Success for `C1` requires only that a *large, fast-moving terrestrial threat* is present near the nest.  
  2.  **Brooding Tuck (`C2`)**: Triggered ~5 seconds after `S` (a slight delay), the parent silently flattens over the nest. This successfully protected chicks from *raptors* (like hawks) diving from above. Success for `C2` requires that a *large, fast-moving aerial predator* is present directly overhead.

  The `Producer` mechanism was selected *because* `S` reliably co-occurred with large, fast-moving predators *in general* (both terrestrial and aerial). Both consumers (`C1`, `C2`) always fire when `S` is produced and perform their functions perfectly.

  **Case Check:**

  1.  **Producer-Side (Etiological/Indicator) Content:**  
      The `Producer` mechanism producing `S` has the historical proper function of indicating the presence of a **large, fast-moving predator near the nest** (the property `F` correlating with selection). `S` is true if this general predator condition holds. *True if fox OR hawk present.*
  2.  **Consumer-Side (Success-Condition) Content:**  
      *   **Privilege Most Demanding Consumer?** `C2` (aerial defense) requires an *aerial* predator overhead (`P`), a more specific condition than `C1` needs (any large, fast-moving threat). Assigning `P` satisfies `C2` and `C1` (a terrestrial predator near the nest *is* a large, fast-moving threat). Content = **large, fast-moving aerial predator overhead**.
      *   **Joint Condition All Consumers Need?** `C1` needs a *terrestrial* threat near the nest; `C2` needs an *aerial* threat overhead. The only condition *common* to both successes is **a large, fast-moving predator is present**. This collapses back to `F`.
      *   **Restrict to Normal Conditions?** In Millikan's Normal conditions, both consumers get what they need - terrestrial threats trigger `C1`, aerial threats trigger `C2`. `S` indicates `F` (general predator) and both responses succeed. `F` satisfies both consumers Normally.
      *   **Survives Repairs?** Survives *only* the "privilege most demanding consumer" repair (`C2`), assigning `P` (aerial predator overhead). Fails "joint condition" (collapses to `F`) and "Normal conditions" (supports `F`).

  **The Wedge:** The key structural feature is **one producer mechanism selected for indicating a broad functional kind (`F`: predator) evolved alongside two distinct consumers requiring different, non-hierarchical subtypes (`C1` needs terrestrial threat near nest, `C2` needs aerial threat overhead) for their specific success conditions.** `F` is neither genus to `P` (aerial) nor `T` (terrestrial); they are distinct functional subtypes relevant to different responses. The producer's history tracks `F`, while the most demanding consumer (`C2`) requires `P`.

  **Removing the Wedge:** If either consumer was absent, or if both consumers required exactly the same condition (e.g., both only needed `F`, or both specifically needed `P`), the theories would align.

  **Strongest Reply (Consumer-Side Theorist):** Argue that privileging the "most demanding" consumer *is* the correct standard repair. `C2`'s success condition (`P`) is a sufficient condition for `C1`'s success (any aerial predator overhead is *also* a large, fast-moving threat near the nest) but not vice-versa. Assigning `P` thus guarantees both consumers succeed, while assigning `F` does not guarantee `C2`'s success (a fox doesn't make `C2` work). This isn't a mere amendment; it's a core defense of the standard repair against this objection. The producer-side theorist counters that the mechanism was *selected* for indicating `F`, not `P`, and `C1`'s existence shows the system wasn't exclusively for aerial threats.

  **Status:** This is a genuine objection to consumer-side theories that rely solely on "joint need" or "Normal conditions" repairs. It forces advocates towards the "most demanding consumer" principle, which, while plausible, may seem ad hoc and risks over-specifying content based on just one part of the consuming system.
