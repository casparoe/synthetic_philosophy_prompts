  Hmm, the user helps run training for volunteer mentors at a youth mentoring charity in Manchester, with an 80-minute slot after lunch when people are sleepy. They want an activity to demonstrate situational influence on behavior without academic references, building on a previous attempt that half-worked.

  The user had an argument with their brother about whether crisis behavior reveals "true character," and wants volunteers to encounter this idea experientially. Their previous activity involved private predictions about helping behavior, then a staged corridor mishap with different envelope conditions (time pressure, reward, control). Issues included participants noticing manipulations or stopping out of politeness.

  Key requirements: No library/references needed, avoid terms like "virtue" until debrief, use British English, continuous prose for emailing a co-facilitator. Must handle sceptics fairly, show gap between prediction and action, and acknowledge what the activity can't prove (e.g., lifelong consistency). Practical constraints: 18 adults, community centre room, facilitators can help stage things.

  For the redesign, the core insight is to make the envelope conditions affect choices *after* the corridor event rather than during it, avoiding the "polite stopping" problem. The corridor incident becomes pure observation without experimental manipulation attached, making it feel organic. The real variation comes later with an ethical dilemma task influenced by the envelope contents.

  The activity has three phases: prediction, observation, and decision. For prediction, everyone privately writes what they'd do if they saw dropped papers and an adjective for someone who wouldn't help. Then half the group does errands (with envelopes containing either time pressure note, biscuit, or nothing) while the other half observes a staged papers-dropping incident. Crucially, no one is "tested" here—it's just for observers to note behavior neutrally. 

  After everyone returns, all participants do an ethical dilemma task: decide whether to report a fictional volunteer misconduct case. The envelopes now matter: time pressure group gets "meeting starts in 3 minutes", biscuit group finds a treat inside, control gets nothing. This is where situational manipulation happens, but it feels natural because it's framed as part of workshop logistics. 

  For debrief, start by validating the observation phase ("what did you see?") to surface that most helped regardless of envelopes—countering the brother's crisis argument. Then reveal the prediction gap: show how many predicted they'd help vs how many actually did (likely near-universal helping), and note the harsh adjectives used for non-helpers. Finally, discuss the dilemma task outcomes—how small nudges (time pressure, reward) likely shifted decisions. Preempt sceptics by asking "could the helpers just be helpful people?" and use observation phase data to show envelope differences didn't affect helping, making the dilemma variation harder to dismiss as "character." 

  Acknowledge limits: this shows situational sway in moments, not that character is fake; consistency over time is a separate question. Materials: envelopes with instructions, dilemma slips, biscuits/pens. Timeline: 10m setup, 15m predictions, 15m errands/observation, 15m dilemma task, 25m debrief. Handle issues like sceptics grumbling by emphasizing no deception—they knew something was happening—and making the dilemma task feel like real workshop work. Use facilitators to stage the drop and manage timing.

  The prose will be natural, with phrases like "rubbish" and "cuppa" to keep it British. Co-facilitator needs to help with staging and know envelope conditions in advance.
answer: |-
  Right, here's a complete plan built from your experience, designed for the room, the time, and the need to avoid obvious manipulation while letting the insight emerge. It leans into the gap between prediction and action and gives your brother's point a genuine platform.

  **Before the Session (What You & Co-Facilitators Need):**

  1.  **Envelopes (18):** Prepare three types, visually identical:
      *   **Group A (Time Pressure - 6 envelopes):** Contains a slip: "IMPORTANT: Your 1-to-1 matching slot with your coordinator has been moved forward. Please report to [Room Name, e.g., 'the small office'] IMMEDIATELY after your errand. Do not be late." Also contains the *actual* errand slip (see below).
      *   **Group B (Positive Nudge - 6 envelopes):** Contains a nice biscuit (e.g., chocolate digestive) or a small, new biro. Also contains the *actual* errand slip.
      *   **Group C (Control - 6 envelopes):** Contains *only* the actual errand slip.
  2.  **Errand Slips (18):** Simple, quick tasks taking 1-2 minutes max, sending people to different parts of the building. Examples: "Take this blank register sheet to the kitchen noticeboard", "Ask the office for a spare highlighter pen", "Check the main hall thermostat is set to 20C", "Find out if the kettle in the kitchen is switched on". Ensure destinations are spread out so people return at different times.
  3.  **Prediction Slips (18):** Small identical pieces of paper with two lines: "If I saw someone drop a pile of papers in a corridor and look lost, I would: (Circle) STOP / NOT STOP"; "One adjective for someone who would NOT STOP: _________".
  4.  **'Dilemma' Slips (18):** Prepared for the *second* activity, seemingly unrelated. Each slip describes a brief, fictional scenario involving a minor ethical grey area a mentor *might* face, requiring a simple yes/no or A/B choice. Crucially, **two versions** exist, but they look identical at first glance. Example Scenario: "You overhear another volunteer mentor tell their young person a slightly exaggerated story about their past to seem 'cooler'. It's harmless but not strictly true. Do you: (A) Mention it privately to the Programme Coordinator later? (B) Decide it's not a big deal and say nothing?" **Version 1** has this text. **Version 2** is identical *except* the last sentence adds: "*(Remember, the Programme Coordinator values absolute honesty in all volunteer interactions.)*". Half get Version 1, half get Version 2.
  5.  **Co-Facilitators:** Brief two co-facilitators thoroughly. One will stage the "paper drop" in the corridor at the precise moment. The other will manage handing out the Dilemma slips later and helping subtly observe. They *must* know the envelope groups (A/B/C) are different, but *not* focus on it during the errand phase. Their main role is naturalism during the drop.

  **The 80-Minute Session Plan:**

  1.  **Introduction & Prediction (15 mins):**
      *   (0-2 mins) Gather everyone. Explain the next bit is about noticing how we make quick judgments and decisions, relevant to mentoring where first impressions and small moments matter. "We're going to do a couple of quick, practical bits to get us thinking."
      *   (2-5 mins) Hand out **Prediction Slips** and pens. Emphasise: "This is totally private, no names. Just circle what you *think* you'd do, and one word for someone who *wouldn't* stop. Fold it and put it in this box when done." Collect the box.
      *   (5-10 mins) While slips are collected, briefly introduce the "errand" phase: "We need to simulate a bit of the practical running around that happens here. I've got envelopes with a quick task each – just pop out, do it, come straight back. Takes 2 mins max."
      *   (10-15 mins) Hand out the **Envelopes** randomly. **Crucially Say:** "Inside your envelope is your task. *Some envelopes might also have a small extra instruction or item* – that's just part of the logistics for today, don't worry about it affecting your task. Off you go when you're ready, come back promptly." **Do not elaborate.** Let them open envelopes privately and head out one by one as ready.

  2.  **The 'Incident' & Errands (15 mins):**
      *   (15-25 mins) As participants leave for errands, your staged co-facilitator (looking like any other participant) heads to a predetermined spot in the corridor *just before* the main flow starts. They deliberately drop a large, loose folder of papers, looking flustered. They *do not* make eye contact or actively solicit help, just look busy trying to pick them up. Your other co-facilitator (or you, if free) subtly observes *who stops to help unprompted* and for how long (just a mental note: stopped/helped significantly vs. briefly acknowledged/apologised but rushed on vs. walked past). **Key:** The envelope manipulation (A/B/C) is *not* the point here. The observers just note behaviour neutrally. The point is *real behaviour happens*.
      *   (25-30 mins) Participants return from errands at different times. Let them mill about, chat quietly, maybe get a cuppa if possible. The atmosphere should be post-task casual.

  3.  **The 'Dilemma' Task (15 mins):**
      *   (30-32 mins) Regroup. "Thanks for that. While you were out, we set up the next bit. It’s about how we think through tricky little moments. Again, private responses." Hand out the **Dilemma Slips** and pens. "Read the scenario, make your choice (A or B), fold the slip, and pop it in this *new* box. No discussion yet, just your individual decision." **Crucially:** Participants get Version 1 or Version 2 of the Dilemma slip *completely randomly*, unrelated to their earlier envelope group. They *do not* know there are two versions.

  4.  **Debrief (35 mins - The Critical Bit):**
      *   (32-40 mins) **Start with the Obvious - The Corridor:** "Okay, hands up who saw someone drop papers in the corridor?" (Many hands). "What happened?" Let 3-4 people describe what they saw. Prompt gently: "Did anyone stop? How did it look? Did it seem genuine?" Your observing co-fac can share their neutral observation: "Yeah, I saw X stop properly, Y paused but seemed in a rush, Z walked past looking focused." **Land Point 1:** "Interesting. So, behaviour happened. We all saw real people making real choices in that moment." *(This validates the experience and starts neutrally.)*
      *   (40-45 mins) **Reveal the Prediction Gap:** Open the first prediction box. Tally the results *publicly* on a flipchart/whiteboard: "Number who *predicted* they would STOP: [X]". "Number who *predicted* they would NOT STOP: [Y]". Then: "And the adjectives people wrote for someone who *wouldn't* stop..." Read out 5-7 of the harshest/most common ones (e.g., "selfish", "rude", "uncaring", "busybody" - be prepared for strong words!). **Pause.** Let that hang. "Now, thinking about what actually happened in the corridor, based on what we saw and [Co-fac] noted, how many people do we think *actually* walked past without really helping?" (Get a rough show of hands/estimate). **Land Point 2:** "Right. So... pretty much everyone *predicted* they'd stop? And we had some quite strong words for people who wouldn't? But actually, in the real moment, a few people *did* walk past? What's that gap about?" *Let them discuss briefly.* Guide towards: "So, we judged hypothetical non-helpers harshly on 'character'... but when it happened in reality, maybe it felt different? Less about being a 'selfish' person, more about... what?" *(They'll say "being in a rush", "distracted" etc. - that's the situational lever emerging naturally).*
      *   (45-50 mins) **Introduce Your Brother's Counter (Make it Strong!):** "Okay, that's one view. But I had a massive argument with my brother about this! He reckons this is rubbish. He'd say: *'The people who stopped? They're just the decent ones, the helpers. The ones who walked past? They're the selfish ones you described. You saw their true character in that little crisis moment. One moment tells you everything.'* What do you think of that? Could he be right?" **Actively solicit opinions, especially from the sceptics/grumpy ones.** "Who agrees with my brother? Why?" Let them argue *for* the character position. Validate their points: "That's a fair argument. Consistency matters. Some people *are* reliably kinder."
      *   (50-60 mins) **Reveal the Envelopes & Dilemma - The Situational Nudges:** "Alright, let's test that character idea a bit more. Remember I said some envelopes had 'a small extra instruction or item'? That was deliberate." Briefly explain the three types (A: Time Pressure, B: Biscuit/Biro, C: Plain). "Now, crucially, when [Co-fac] observed the corridor, did the people who *didn't* stop mostly have the Time Pressure note? Or did helpers mostly have the Biscuit?" Reveal the truth: *"Actually, we didn't see a clear pattern. People with Time Pressure notes stopped just as often as others. People with Biscuits walked past sometimes. The envelope nudge didn't really change who stopped in the corridor."* **Pause.** "So my brother might be onto something *for that specific corridor moment*? Maybe stopping *was* more about individual tendency *in that situation*?" *(This concedes a point to the character view for that specific incident, building credibility).* "BUT... we had *another* moment where a nudge *might* have worked." Reveal the Dilemma Slip manipulation. "Half of you had a Dilemma slip that just said [Read Version 1]. The other half had a slip that *added* [Read the extra sentence in Version 2, e.g., 'Remember, the Programme Coordinator values absolute honesty...']." Open the second box. Tally the choices: "Who chose Option A (Report) with Version 1? ... With Version 2?" "Who chose Option B (Say nothing) with Version 1? ... With Version 2?" **Almost certainly, significantly more people will choose the 'report' option (A) with Version 2 (the honesty nudge). Land Point 3:** "Look at that! Just *one extra sentence* on a slip of paper – a tiny reminder about what the coordinator values – shifted what a decent number of people decided was the 'right' thing to do. Not a crisis, just a quiet decision. So... what shaped that choice more? Their stable 'honest character'? Or the tiny situation of which words were on the page in front of them?" *(The situational effect is clear and hard to dismiss as 'character' because the nudge was random and invisible to them).*
      *   (60-67 mins) **Synthesise & Acknowledge Limits:** "So, what have we bumped into today? On one hand [point to flipchart], we judge non-helpers harshly as if it's fixed character. On the other [point to corridor observation tally], in a real moment, behaviour varies, and a big situational nudge (time pressure) *didn't* change helping much – maybe character *does* shine in small crises? But on the other hand [point to dilemma tally], a tiny, almost invisible situational nudge *did* change an ethical decision significantly. What does that tell us?" Guide discussion: Situations *powerfully* shape us, often without us realising. We're quick to judge others based on single actions (attributing character), but slower to see how situations shape our *own* actions. **Crucially Acknowledge Limits:** "Now, this doesn't mean people *don't* have character, or that being a good mentor doesn't matter! What it *does* show is that situations – even tiny ones like a biscuit, a rushed feeling, or a sentence on a page – can nudge our decisions and actions *in the moment*, sometimes overriding what we *think* we'd do or who we *think* we are. It doesn't prove someone lacks character entirely, but it shows character isn't the *only* player, and it's often not the biggest player in a single moment. Consistency over a lifetime? That's a much bigger question – this was just about moments. But in mentoring, moments matter! Understanding these nudges helps us be less judgmental of others – and ourselves – when things go a bit wrong, and maybe helps us set up situations where good choices are easier for our young people." Briefly link back to mentoring: "Think about the tiny situations we create for our young people when we meet them – the room, the tone, the first question we ask. Those are our 'envelopes' and 'dilemma slips'. They nudge."

  **What Will Go Wrong & How to Handle It:**

  1.  **Everyone Stops in Corridor (Polite/Obvious):** *Handle:* This is fine! The key point is the *gap* between their harsh adjectives for non-helpers and the fact that *nearly everyone* predicted they'd stop *and* (apparently) did stop. The dilemma task will still show the situational nudge. Say: "Looks like we're a helpful bunch! But remember those strong words you wrote for non-helpers... what if *you* were the one who didn't stop? Would you deserve that label?"
  2.  **No One Stops in Corridor:** *Handle:* Unlikely, but if so, focus even more on the prediction gap ("We *all* predicted we'd stop, but *no one* actually did? What happened in that moment?") and lean heavily on the dilemma task results. The situational effect there will still be strong.
  3.  **People Compare Envelopes Early:** *Handle:* Downplay it during the errand phase. "Yep, some had a biscuit, lucky them! Some had a note about timing, just workshop logistics." Reiterate the focus is the errand. The *impact* of the envelopes is revealed later in the debrief.
  4.  **Sceptics/Grumpy Folks Dismiss It:** *Handle:* This is why you *invite* your brother's argument strongly and concede the corridor point (that the time pressure didn't clearly change behaviour). Let them voice their scepticism during that part. The power of the *dilemma* slip manipulation is hard to dismiss because it's random and they didn't see it coming. Focus on "What about *this* result?" Acknowledge character exists but situations are powerful too. "It's not either/or, it's both/and – but we often underestimate the situation part."
  5.  **Dilemma Task Results Aren't Clear:** *Handle:* Unlikely if the nudge is clear (like the honesty reminder). If it's muddy, focus less on the exact numbers and more on the *principle*: "Even if it's only a few people, the fact that simply *adding one sentence* changed *anyone's* decision shows situations have power, doesn't it?"
  6.  **Someone Feels "Tricked":** *Handle:* Be upfront in the debrief: "We set up some variations today – the different envelopes, the two dilemma slips – to see if tiny things make a difference. We weren't testing *you* as individuals, but how these little nudges work on all of us. It's why we kept responses anonymous. The point is learning how situations work, not judging anyone's choices."

  **What It Shows & What It Doesn't:**

  *   **Shows:** Situational factors (even trivial ones like a biscuit or a single sentence) can significantly influence decisions and potentially actions in the moment. It highlights the gap between our predicted behaviour (and harsh judgments of others) and actual behaviour. It demonstrates that we often underestimate situational power and over-rely on character explanations ("they're just rude").
  *   **Doesn't Show:** That character doesn't exist, that people are entirely inconsistent, or that deep-seated values are irrelevant. It doesn't prove anything about long-term consistency or the development of character over time. It's a snapshot of momentary influences.
  *   **Your Job in the Debrief:** Explicitly state these limits: "This activity shows how powerful situations can be *in specific moments*. It doesn't mean mentors don't develop real character or that consistency isn't valuable. It *does* mean we should be humble about judging others based on single actions and aware of how the little things – the 'situation' we create – can make good choices easier or harder for everyone, including ourselves and our young people."

  This version uses the room, the people, and their own actions and predictions as the data. The manipulation is present but less about fooling them during the corridor incident (which addresses your half-flop) and more about revealing the invisible nudge in the dilemma task and the gap between prediction and reality. The debrief explicitly stages the argument with your brother, giving sceptics a voice before showing the compelling evidence from the dilemma slips. It stays practical, avoids jargon, and links back to the mentoring context. Good luck with the post-lunch slot!
