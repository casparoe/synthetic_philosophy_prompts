prompt: |-
  I spent my career in the laboratory — molecular biology, mostly — and now sit in on a graduate seminar in moral philosophy, where I keep wanting to handle arguments the way I used to handle experiments. Please act as a professional moral philosopher with a real taste for careful case design, and build me a matched pair of cases on the shallow-pond argument: a treatment and a control.

  What the pair has to do. Condition A is the control: Singer's principle — roughly, that if we can prevent something bad from happening without sacrificing anything of comparable moral significance, we ought to do it — and a commonsense morality that permits partiality to oneself and one's near and dear, treats large sacrifices as supererogatory, and holds negative duties more strictly than positive ones, both return the verdict "you must help." In Condition B the commonsense verdict flips to "you may walk on," while the principle still returns "you must help." The two conditions may differ in exactly one feature — a feature the principle, as stated, does not mention — and must be identical in everything the principle does advert to: the same bad outcome, the same certainty that it will occur and that the agent can prevent it, the same genuinely trivial cost to the agent, the same physical distance, no special relationship, no one else present or able to help, and no causal responsibility on the agent's part.

  Cheating. The flip must not be manufactured by any of the usual suspects: greater distance; larger numbers, thresholds, or aggregation; doubt about whether the aid arrives; the agent's own projects or relationships; some other agent or institution whose job it is; or the mere fact that people feel less about distant sufferers. Name the feature you have chosen and show that it is not one of these in disguise. Also say plainly what the pair is for — I want to know whether the pull of the pond case comes from its moral structure or from something about how it is presented, and that fixes what would count as rigging it.

  Constraints. Realistic: a hospital, a field station, a funding or hiring committee, a shared lab — something a department head could actually face. No trolleys, no science fiction, no thought-experiment machinery. One paragraph per condition.

  Deliverable. Both conditions; then the verdict of each of the two views in each condition, with the reasoning that gets there; then the diagnostics — which single feature does the work, what happens to the divergence when you remove it, whether the effect survives describing the conditions in the opposite order or to someone who has never met the shallow-pond argument (if it does not, say so; that is a finding, not a failure), and how a defender of whichever view comes out worse would attack the case — in particular whether your feature is a moral difference or an artifact of framing.

  Before settling, spend a few lines brainstorming two or three candidate features and discarding the ones that turn out to be forbidden levers in disguise. I would rather have one honest, fully diagnosed pair than three that merely look clever.
reasoning: |-
  Okay, let's tackle this problem. The user is a molecular biologist transitioning into moral philosophy and wants a matched pair of cases based on Singer's shallow-pond argument. The goal is to isolate a single feature that flips the commonsense verdict while Singer's principle remains unchanged. 

  First, I need to recall Singer's principle: if you can prevent something bad without sacrificing anything morally significant, you should do it. The control condition (Condition A) must align both Singer and commonsense morality on "must help." Condition B needs commonsense to say "may walk on" while Singer still says "must help." The challenge is finding that one differentiating feature that isn't among the forbidden factors like distance, numbers, doubt, etc.

  Brainstorming possible features:
  1. **Sunk costs vs. opportunity costs**: Using sunk costs might trigger loss aversion. Commonsense might see backing out as wasteful, but Singer focuses only on future costs. However, is sunk cost just framing? Needs checking against forbidden levers.
     
  2. **Agent's prior commitment**: Switching funds from one project to another. But this might involve the agent's projects or relationships, which is forbidden. Also, could imply causal responsibility if the initial project promised aid.

  3. **Resource allocation in hierarchical settings**: A department head reallocating funds. The key might be that the funds are already committed elsewhere, making reallocation feel like taking from another cause. But is this just introducing another moral claim? The principle doesn't account for existing allocations if they're not causally tied.

  Considering sunk costs: In Condition B, the agent has already invested resources into a project, and diverting them now means the past investment is wasted. Commonsense might see walking away as permissible because the sacrifice isn't just the trivial cost but also the loss of prior investment. However, Singer's principle only considers future sacrifices. The sunk cost itself isn't a moral factor for Singer, but it affects commonsense judgments due to loss aversion.

  Checking against forbidden levers:
  - **Distance**: Physical distance remains the same.
  - **Numbers**: Only one beneficiary in both cases.
  - **Doubt**: Certainty of outcome and aid effectiveness is identical.
  - **Agent's projects**: The sunk cost relates to past projects, not current personal commitments. The agent isn't choosing between personal goals but dealing with allocated resources.
  - **Other agents**: No institutions or other agents involved.
  - **Diminished empathy**: The emotional response isn't the point; it's the perceived waste of resources.

  So sunk cost seems viable. Now, designing the cases realistically. Condition A: A researcher can redirect unallocated funds to save a colleague. Condition B: The funds are already committed to another project, so redirecting wastes the prior investment. Same cost, same outcome, no special relationships.

  Testing diagnostics: If you remove the sunk cost, both cases converge. Presenting in reverse order might not flip commonsense if the sunk cost effect is robust. Defenders of commonsense might argue that wasting resources is a significant sacrifice, but Singer would counter that the sunk cost is irrelevant to future consequences. The key is whether the sunk cost introduces a moral difference or is a framing artifact. Since the resources are identical in future terms, it's likely framing, exposing how commonsense is influenced by psychological factors.
answer: |-
  ### Brainstorming Candidates and Discard
  1. **Candidate: Sunk Costs**  
     *Idea:* Agent has already invested resources into Project X; diverting them to aid wastes that prior investment. Commonsense might perceive *abandoning* sunk costs as non-trivial, while Singer ignores irrecoverable past costs.  
     *Discarded?* No—it avoids forbidden levers: no distance/numbers change, no doubt, no personal projects (sunk costs are *past*, not future commitments), and no institutional duty.  

  2. **Candidate: Temporal Urgency of Competing Claim**  
     *Idea:* Aid delays a time-sensitive but equally vital task (e.g., pausing a lab experiment to save a life).  
     *Discarded:* Violates "trivial cost"—delaying science might cause significant harm, making the cost non-trivial and incomparable.  

  3. **Candidate: Symbolic Resource Type**  
     *Idea:* Using funds earmarked for a symbolic purpose (e.g., a memorial grant).  
     *Discarded:* Risks "special relationships" (if the grant honors someone) or "agent’s projects" (if they feel obligated).  

  **Chosen Feature:** **Sunk Costs**—specifically, the *loss of prior irrecoverable investments* if resources are reallocated.  

  ---

  ### Condition A (Control)  
  Dr. Chen, a department head at a university research hospital, learns that a visiting scholar from another institution has collapsed in the shared lab corridor due to a sudden allergic reaction. An epinephrine auto-injector (cost: $30) from the lab’s *unallocated emergency supply* will save them. No one else is nearby. The funds are trivial to the department’s budget, and Chen has no prior relationship with the scholar.  

  ---

  ### Condition B (Treatment)  
  Dr. Chen faces the identical scenario: a collapsing visiting scholar in the corridor, requiring a $30 epinephrine auto-injector to survive. The only difference: the *last available auto-injector* is part of a sealed package purchased for a multi-year study on anaphylaxis protocols. Using it wastes the $15,000 already spent designing and initiating the study (e.g., patient recruitment, IRB approvals), rendering prior investments irrecoverable. The $30 cost remains trivial, and all other factors match Condition A.  

  ---

  ### Verdicts and Reasoning  
  **Condition A:**  
  - **Singer’s Principle:** "Must help." Preventing death costs $30—trivial compared to a life. No comparable sacrifice exists.  
  - **Commonsense Morality:** "Must help." No conflicting obligations; aiding a stranger at minimal cost aligns with negative duties (e.g., "don’t ignore imminent harm"). Partiality and supererogation don’t apply.  

  **Condition B:**  
  - **Singer’s Principle:** "Must help." Identical to Condition A: the *future* cost is still $30 (a trivial sum), and sunk costs are morally irrelevant. Preventing death outweighs wasting past investments.  
  - **Commonsense Morality:** "May walk on." Sunk costs ($15,000 lost) make the sacrifice *feel* non-trivial—it violates stewardship of resources. Though not a "personal" project, wasting institutional funds triggers a duty to honor prior commitments, reframing aid as *actively harming* the study. Supererogation excuses non-action.  

  ---

  ### Diagnostics  
  1. **Feature Doing the Work:** **Sunk costs** (irrecoverable prior investments).  
  2. **Effect of Removal:** If sunk costs are omitted (e.g., the injector isn’t tied to a study), commonsense reverts to "must help," collapsing the divergence.  
  3. **Order/Novelty Robustness:**  
     - *Reverse Order:* Describing Condition B first, commonsense still permits walking away—sunk costs intuitively amplify perceived sacrifice.  
     - *Naïve Audience:* Those unfamiliar with Singer agree: Condition A demands help; Condition B permits walking away ("Why waste $15k for a stranger?").  
  4. **Attacks from Defenders:**  
     - **Commonsense Defender:** "Sunk costs *are* morally significant—wasting resources harms the study’s beneficiaries. Singer’s ‘trivial cost’ is misleading; it ignores *systemic* obligations."  
     - **Singerian Defender:** "This is pure framing! Sunk costs don’t alter the *actual* future sacrifice ($30). Commonsense is biased by loss aversion, not moral reasoning."  
  5. **Moral Difference or Artifact?**  
     Sunk costs are a **psychological framing artifact**. Commonsense treats irrecoverable losses as increasing the "cost," but Singer correctly notes only *prospective* costs matter. The pair exposes how shallow-pond cases "work" by downplaying real-world cognitive biases—here, loss aversion masquerading as moral duty.  

  **Conclusion:** The "pull" of the pond case relies partly on presentation—omitting sunk costs masks how commonsense weighs *perceived* sacrifices. Your matched pair isolates this, showing Singer’s principle resists framing effects that sway intuitive judgments.
