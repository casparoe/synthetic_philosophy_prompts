answer: |-
  ## Research Proposal: Prioritarianism's Fragile Immunity? Testing the Boundaries of the Levelling-Down Objection Under Risk and Agency

  **1. Research Question:** Does prioritarianism universally escape the levelling-down objection (LDO), or does its immunity break down under specific conditions involving risk (prospective levelling down) and/or the distinction between actively worsening versus withholding benefit (subtractive vs. pre-emptive levelling down), revealing a tension between its ex ante and ex post evaluations?

  **2. Background and the Gap:** Prioritarianism, by weighting well-being gains to the worse off more heavily via a strictly concave transformation function, claims immunity to the LDO. The standard argument is compelling: making someone worse off without benefiting anyone else *always* decreases overall value according to the prioritarian sum. However, this defence primarily addresses *actual, subtractive* levelling down in *realized* outcomes. My hypothesis is that this immunity may not hold uniformly when we consider:

  *   **Agency Contrast:** *Subtractive Levelling Down* (actively harming a worse-off individual) vs. *Pre-emptive Levelling Down* (withholding a potential benefit from a worse-off individual that would leave them better off than others, but not as well off as they *could* be).
  *   **Temporal/Risk Contrast:** *Actual Levelling Down* (occurring in the realized outcome) vs. *Prospective Levelling Down* (occurring within a possible but unrealized state of a risky prospect, or in expectation).

  The motivating case exposes this gap: A choice between giving a worse-off person (A) a sure outcome (60) or a gamble (50% chance at 100, 50% chance at 20), while a better-off person (B) remains at 100. Ex ante prioritarianism (applying the weighting function to expected well-being) is indifferent (both yield weighted expected value based on 60). However, ex post prioritarianism (applying the weighting function to *realized* well-being) strictly prefers the sure thing. Crucially, in the bad state of the gamble (A=20, B=100), we have an outcome where A is worse off (20 vs. 60) *and* no one is better off than they would have been under the sure alternative – the hallmark of the LDO. Yet, prioritarianism (ex post) *avoids* this outcome precisely *because* it contains this levelled-down state. This suggests a potential "LDO-by-proxy": avoiding a policy *because* it risks creating a levelled-down state, even if ex ante expectations are equal. The standard defence overlooks this prospective dimension and the nuances of agency.

  **3. Why the Standard Reply is Insufficient:** The standard reply correctly states that prioritarianism *never* judges a *realized* outcome containing pure levelling down (A worse off, no one better off) as better than an alternative without it. However, it fails to address:
  *   Whether prioritarianism's *evaluation of actions/policies* under risk could systematically *disprefer* options *because* they risk creating levelled-down states, functionally exhibiting an aversion analogous to valuing the *avoidance* of such states.
  *   Whether the distinction between subtractive and pre-emptive levelling down interacts with risk in ways that challenge the completeness of prioritarianism's immunity, particularly regarding the *source* of the worsened state.
  *   Whether the concavity of the weighting function is conflating two distinct normative concerns: giving priority to the worse off and aversion to risk in the distribution of well-being itself.

  **4. Methodology:** A purely axiomatic approach risks missing the nuanced interplay of concepts in concrete cases and the potential collapse of distinctions. This project will employ a **triangulated methodology** over three years:

  *   **Year 1: Conceptual Cartography & Case Construction:** Rigorously define the conceptual matrix (Subtractive/Pre-emptive x Actual/Prospective). Develop a suite of targeted thought experiments for each cell and their intersections. Crucially, test the *stability* and *non-triviality* of each cell: Does the subtractive/pre-emptive distinction hold weight under risk? Does "prospective" levelling down meaningfully differ from "actual" in ways relevant to the LDO? *Deliverable:* A refined conceptual framework and validated set of core cases, identifying if any cells collapse or if the project fundamentally concerns only one core contrast (e.g., ex ante vs ex post evaluation under risk).
  *   **Year 2: Formal Modelling & Normative Analysis:** Model the core cases using:
      *   **Standard Prioritarianism:** Compare ex ante (weight expected utility) and ex post (weight realized utility, then sum) formulations.
      *   **Risk-Separated Prioritarianism:** Explore models where a risk-aversion parameter is distinct from the priority weighting parameter (e.g., applying the priority weighting *after* a risk-averse transformation of prospects, or vice-versa).
      *   **State-Dependent Prioritarianism:** Investigate if state-dependent weighting (where priority depends on who is worst off *in a state*) creates new LDO vulnerabilities.
      Analyse verdicts: Does any variant *favour* a policy *because* it levels down prospectively? Does any variant *disfavour* a policy *solely because* it risks creating a levelled-down state (even if ex ante expectations are equal/prioritized)? Does separating risk attitude change the results? *Deliverable:* Formal models mapping the conditions under which prospective LDO-like aversion emerges, and analysis of whether this constitutes a genuine LDO vulnerability.
  *   **Year 3: Synthesis, Robustness & Implications:** Synthesize findings. Test robustness against:
      *   Variations in well-being scales and weighting function curvature.
      *   The "third contrast": Does levelling down a non-priority individual *change* the priority ordering, creating dynamic effects?
      *   Broader objections (e.g., ex post Pareto, agent-relative obligations).
      Develop the philosophical interpretation: Is prospective LDO aversion a *new* form of LDO vulnerability for prioritarianism, or is it best understood as a manifestation of a *different* objection (e.g., a conflict between ex ante and ex post Pareto, or a distinct problem of risk distribution)? *Deliverable:* A definitive account of prioritarianism's vulnerability profile concerning the LDO, including a clear taxonomy of relevant objections.

  **5. Range of Possible Conclusions & Deciding Factors:**

  1.  **Strong Confirmation:** Prioritarianism exhibits genuine LDO vulnerability specifically in the Prospective/Pre-emptive cell (or similar), driven by the ex ante/ex post tension. *Decider:* Clear cases where prioritarianism (ex ante or ex post) disprefers a policy *primarily due to the risk/presence of a levelled-down state* in a non-actualized prospect, and this aversion cannot be fully explained by standard risk aversion or Pareto concerns alone.
  2.  **Modified Immunity:** The prospective cases expose a distinct objection (e.g., an ex post Pareto/ex ante prioritarian conflict), not a *new* LDO, but one still problematic for prioritarianism's coherence under risk. *Decider:* Analysis showing the core normative concern in prospective cases differs fundamentally from the core complaint of the standard LDO (valuing equality/avoiding inequality for its own sake).
  3.  **Matrix Collapse:** Only one contrast (likely Actual vs. Prospective) is substantive; the agency contrast (Subtractive/Pre-emptive) is irrelevant or collapses under scrutiny. The project reveals a core tension between ex ante and ex post prioritarianism under risk. *Decider:* Year 1 analysis showing no significant difference in prioritarian evaluations based *only* on whether the worsening is active or via omission within risky prospects.
  4.  **Projection Revealed:** The apparent vulnerability stems entirely from conflating priority weighting with risk aversion; separated models show no LDO-like aversion. *Decider:* Risk-separated models in Year 2 eliminate the problematic aversion in prospective cases without altering prioritarian core commitments.
  5.  **Two Projects:** The investigation unavoidably cleaves into (a) the nature of prioritarian value (is it state-dependent? does it apply to prospects or outcomes?) and (b) the ethics of distributing risk under prioritarianism, requiring separate treatment. *Decider:* Inability to analyse prospective cases without fundamentally questioning how prioritarian value is defined across states or time, distinct from its aggregation under risk.

  **6. Usefulness for Policy & Practice:** The project will clarify the implications of choosing ex ante vs ex post prioritarianism for real-world decisions involving risk and distribution (e.g., healthcare resource allocation, social insurance, climate policy). It will identify potential pitfalls, such as systematic aversion to policies that benefit the worst-off if they carry a risk of very bad outcomes, even when expected gains are equal. The final deliverable will be a clear framework for practitioners outlining:

  *   When and why different prioritarian approaches might conflict under uncertainty.
  *   The practical significance (if any) of the subtractive/pre-emptive distinction in policy choices.
  *   Recommendations for specifying prioritarian aggregation under risk to avoid unintended consequences like de facto levelling-down aversion or ex post/ex ante conflicts.

  **7. Genuine Failure Conditions:**

  *   **Conceptual Collapse (Likely):** The four-cell matrix proves unstable. If Year 1 reveals that only the Actual/Prospective contrast matters and the Subtractive/Pre-emptive distinction adds no unique insight *within the LDO context under risk*, the project simplifies to a focused study on ex ante vs ex post prioritarianism and the LDO. This is a refinement, not failure.
  *   **Triviality of Vulnerability (Failure):** If the motivating case and its variants are shown to *only* illustrate a well-understood ex post Pareto violation or standard risk aversion inherent to any non-linear weighting, with no distinctive connection to the *logic* of the LDO, the core hypothesis fails. Success requires demonstrating a *specific* link to the *avoidance of levelled-down states* as such.
  *   **Irreducible Duality (Major Challenge):** If Year 3 confirms the project inherently addresses two distinct foundational issues (the *currency* of prioritarian value - outcome vs. prospect - and its *treatment of risk*), making a unified answer impossible, this represents a significant complication requiring explicit acknowledgement and potentially reshaping the thesis.
  *   **No Novel Insight (Failure):** If rigorous analysis concludes the prospective aversion is either perfectly aligned with prioritarianism's core aims (and thus unproblematic) or entirely explained by existing, non-LDO-related critiques, the project fails to deliver its intended novel contribution.

  This project offers a timely and critical examination of a purported strength of prioritarianism, using precise conceptual distinctions and formal tools to test its limits under realistic conditions of uncertainty and agency. It promises to advance our understanding of distributive ethics under risk and provide practical guidance for prioritarians engaged in real-world policy analysis.
