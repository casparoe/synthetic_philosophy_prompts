prompt: |-
  I'm a journalist — I cover science and ideas, mostly — and I'm working on a piece about how different countries decide what actually counts as corruption, so I've been going through the published rulings of one national integrity commission (I'll keep it anonimous). Their track record so far:

  - a minister gave a road contract to a firm that had given his daughter an unpaid internship the year before; the firm scored top on the technical eval anyway — corrupt
  - a district water officer gave a maintenance contract to her own clan's cooperative; fair price, good work, and everyone locally says that's what the office is for — corrupt
  - an officer mediated a land dispute and then accepted a goat and a meal from the winning family, as local custom requires — not corrupt
  - a councillor bought a generator for a clinic out of her own salary, and the neighbourhood swung to her party — not corrupt
  - a financial regulator took a job at a bank he had supervised, six months after leaving, with no decision shown to have been bent — corrupt
  - a supplier funded scholarships at the ministry's own training college while its contract was up for renewal; no individual official gained — corrupt

  Next month they've got a new one, and it's the reason I'm writing the piece. The ministry has replaced discretionary tender scoring with an automated formula run on uploaded documents. A supplier paid a mid-level official, off duty and off the books, to help them format and upload their submission so it scores higher. No lies, every document true, she has no override, and she has no official duty to advise suppliers at all.

  What will they rule, and what rule are they really running? I can see at least two that fit all six precedents — something like corruption is a private consideration displacing the reasons the office exists to act on, versus something like corruption is any practice that, allowed generally, would build a market in official access or wreck the trust the office needs — and they come apart on this case. Give me your best guess with the reasoning, tell me which precedent is the closest analog and which one cuts the other way, and name the single further case that would settle which rule they're on. Also worth saying whether their willingness to condemn the clan contract that everyone locally accepts means they're quietly running a Western definition. No literature review, please — I want the argument, not the reading list.
reasoning: |-
  Okay, let me tackle this journalist's query step by step. They're investigating how different countries define corruption, using a specific integrity commission's rulings as a case study. The commission has six precedents and an upcoming case about an official helping a supplier format documents for automated tenders. 

  First, I need to understand the commission's pattern. The precedents show they condemn actions where private interests interfere with public duties, even without direct personal gain. The internship and clan contract cases demonstrate this - no personal profit, but still ruled corrupt because private connections influenced decisions. The revolving door and scholarship cases extend this to institutional integrity risks.

  The exceptions are telling: accepting a customary goat and personal charity to a clinic weren't punished. This suggests the commission distinguishes cultural practices from systemic threats, and allows personal goodwill if it doesn't trade on office power.

  For the new case, I'm leaning toward "corrupt" because it creates a hidden market for access. Even though the documents were truthful and the official had no advisory duty, paying for formatting help undermines the automated system's fairness. The closest precedent is the scholarship case - both involve third-party benefits during tender processes. The goat case cuts the other way by showing cultural context matters, but here there's no tradition justifying the payment.

  To confirm their underlying rule, I'd want to see how they'd rule on a case where officials accept minor, non-traditional gifts for routine services. If they condemn it, they're likely using the "market for access" standard. Their rejection of the locally accepted clan contract does hint at Western influence, prioritizing impartial systems over community norms.

  The key tension is between preventing systemic corruption versus accommodating local practices. This commission seems to prioritize systemic integrity, which would mean ruling against the formatting assistance.
answer: |-
  Based on the precedents and the core tension you identify, here's my analysis:

  1.  **Ruling Prediction:** **Corrupt.**
  2.  **The Rule They're Running:** **Corruption is any practice that creates a covert, unfair market for official access or influence, undermining the system's designed impartiality and creating systemic risk, even without immediate personal enrichment or direct decision-making power.**

  **Reasoning:**

  *   **Pattern Recognition:** The commission consistently rules "corrupt" when actions create systemic risks or hidden advantages, even absent personal gain or direct decision-bending:
      *   **Internship:** Created a hidden channel of influence/obligation *before* the decision, undermining the appearance and potential reality of impartiality.
      *   **Clan Contract:** Substituted kinship loyalty for impartial public duty, creating systemic nepotism risk regardless of local acceptance or immediate outcome.
      *   **Revolving Door:** Creates systemic risk that regulators will act in anticipation of future private gain, undermining trust in their *current* impartiality.
      *   **Supplier Scholarships:** Created a hidden market where institutional benefits (scholarships) were traded for official access/favor during a tender, regardless of individual gain.
  *   **Exceptions Explained:** The "not corrupt" rulings fit this systemic rule:
      *   **Goat & Meal:** A localized, transparent, culturally mandated *post-decision* gesture of thanks, not a covert market for *future* access/influence. It doesn't systemically undermine the office's function.
      *   **Generator:** A transparent, personal act of charity *not* trading on her official power or granting future access/favor. It builds goodwill for the *party*, not a hidden market for her *official* actions.
  *   **The New Case Fits the Systemic Risk Pattern:** Paying an official (even off-duty) for help navigating the *official* tender system creates a **covert market for access and expertise**. The official gains financially from her position and knowledge of the *system*, not her decision-making power. This:
      *   Undermines the **automated system's core purpose** (impartiality based on formulaic scoring) by creating an unfair advantage for those who pay.
      *   Creates a **systemic risk** that suppliers *must* pay such consultants (who have insider knowledge) to compete fairly, replicating the very "discretionary access" problem the automated system was meant to solve. It replaces human discretion with "formula hacking" services.
      *   Involves a **private consideration** (payment) directly linked to the performance of an *official function* (submitting a tender), displacing the reason the tender system exists (fair, open competition based on merit).

  **Precedent Analysis:**

  *   **Closest Analog:** **The Supplier Scholarships.** Both involve a supplier providing a benefit (scholarships / paid formatting help) during a tender renewal process to gain an advantage within an official system. Neither involves direct decision-bending by an individual official for personal gain, but both create an unfair playing field and a hidden channel of influence/access that undermines the integrity of the tender process itself.
  *   **Precedent Cutting the Other Way:** **The Goat & Meal.** This precedent shows the commission *can* accept certain contextualized exchanges. The argument *for* the formatting help being "not corrupt" would hinge on it being a purely technical service, off-duty, not influencing a decision, and perhaps being a common practice (like a local custom). However, the **key difference** is that the Goat was a *post-decision cultural ritual*, while the formatting help is a *pre-submission paid service* directly intended to *gain advantage within the official system*. The former concludes a process; the latter actively subverts the intended fairness of the process.

  **The Settling Case:**

  The single further case that would best clarify their core rule is:

  *   **"The Post-Tender Consultant":** A *former* official, now working purely in the private sector as a consultant, is paid by a supplier *after they lost a tender* to review their submission and advise how to format/optimize it better *for the next tender* under the same automated system. They use only publicly available information about the scoring formula.
      *   **Why it Settles:** This isolates the "market for access/influence" element from the "current official" element.
          *   If they rule **Not Corrupt**, it strongly suggests their core concern is **active officials leveraging their position and access for private gain**, and the earlier formatting case was condemned *because* it involved a sitting official.
          *   If they rule **Corrupt**, it confirms their primary concern is **any covert market that systemically undermines the impartiality of the tender process**, regardless of whether the advisor is a current official, a former official, or just a savvy private actor, because it still creates an unfair advantage traded for money.

  **The "Western Definition" Question:**

  Their condemnation of the **clan contract** strongly suggests they prioritize **universalistic, impartial standards** over **particularistic, local loyalties**, which aligns with common Western anti-corruption frameworks. The local acceptance ("that's what the office is for") is precisely the kind of embedded nepotism Western models target. This indicates a fundamental rejection of the idea that public office exists primarily to serve specific kinship or communal groups, favoring an impersonal, rules-based state model. Their willingness to overrule local norms points to an underlying universalist/Weberian ideal of bureaucracy, even if unstated. The goat case shows they *can* accommodate *some* local custom, but only when it doesn't create systemic risk or an obligation *before* or *during* official action. The clan contract crossed that line decisively.
