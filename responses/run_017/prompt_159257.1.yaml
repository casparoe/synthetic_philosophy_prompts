prompt: |-
  I write about science and ideas, and every time I explain the Church–Turing thesis to readers I get the same two furious emails. One says it isn't even a factual claim: "computable" just means computable by a Turing machine, the thesis settled the definition decades ago, done. The other says no, it's an empirical claim about what physical systems can do, it could be false, and people have sketched exotic setups that would refute it. A third correspondent, newer, says the real live question is what we should count as computation in systems like brains or neural nets at all. These people have been at it forever and nobody seems to budge anybody.

  My own guess, tell me if it's wrong, is that they're answering different questions under one name: one about pinning down an informal mathematical concept, one about the laws of physics. But I want the fuller diagnosis. Is the rest of the standoff verbal, or is there a substantive disagreement about standards of evidence — about what could possibly count as evidence for a claim nobody thinks is provable — plus bedrock intuitions neither side argues for?

  And concretely, because I get pitched things like this more than you'd think: suppose a group sends me a preprint claiming a buildable device that settles, after finite time, whether any Turing machine with fewer than, say, a million states halts — the physical evolution runs what looks like an unbounded amount of computation and then relaxes into a stable state you can just read off. Assume it works. Does that refute anything? My worry is that the definition side will say a bounded gadget tells us nothing about the concept of computability, while the physics side will say it kills the physical thesis as stated, and both will feel vindicated — which would itself be evidence about what kind of fight this is. So: given your diagnosis, what would count as progress — a sharper distinction between the theses, a formal result, a different question — or should I just tell readers to expect no resolution, and why?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a science writer who keeps getting conflicting emails about the Church-Turing thesis. One group insists it's a definitional matter, settled long ago, while another argues it's an empirical claim about physics that could be falsified. A third group brings up the question of what counts as computation in systems like brains or neural nets. The user suspects these are different questions under one name but wants a deeper diagnosis. They also present a concrete scenario: a hypothetical device that decides halting for bounded Turing machines, asking if that refutes anything and how to handle the standoff.

  First, I need to recall the core aspects of the Church-Turing thesis. The thesis has two main interpretations: the mathematical one and the physical one. The mathematical version is about formalizing the intuitive notion of computation into models like Turing machines, lambda calculus, etc. This is widely accepted as defining what "computable" means. The physical version claims that any physically computable function can be computed by a Turing machine. This is where the debate heats up because it touches on what the laws of physics allow.

  The user's correspondents represent these two camps. The definitional side is correct that "computable" is mathematically defined by Turing machines. The physical side argues that there might be physical processes beyond what Turing machines can do. Both are valid perspectives but address different questions. The third group's point about brains and neural nets introduces the semantic aspect of computation—what it means for a physical system to actually compute something, not just simulate steps.

  The user's scenario with the hypothetical device is interesting. A machine that solves the bounded halting problem quickly. The definitional side would dismiss it because it doesn't address unbounded computation, which is essential for the mathematical concept. The physical side might see it as evidence against the physical thesis, but only if the device performs beyond Turing machines, which this bounded case doesn't. So both sides might feel vindicated, but they're talking past each other.

  The deeper issue here is conflating different types of theses: mathematical definitions vs. empirical claims. The standoff persists because each side uses different standards of evidence. Mathematicians don't require empirical proof for definitions, while physicists look for real-world phenomena. Progress would involve clarifying these distinctions and perhaps introducing new frameworks like physical computability theories. 

  For the user's writing, they should clearly separate the two theses and explain why each side is partially right. Highlighting ongoing debates in physics (like hypercomputation) and philosophy (semantics of computation) can show where the real uncertainties lie. Emphasizing that the mathematical thesis is settled but the physical one is an open empirical question. Also, addressing the semantic question about what constitutes computation in physical systems adds depth. 

  In conclusion, the user should inform readers that the mathematical definition is uncontroversial, but the physical and semantic aspects remain areas of active discussion. Providing a clear taxonomy of the theses and their evidential standards can help readers navigate the confusion without expecting a resolution.
answer: |-
  Here's a breakdown of the Church-Turing Thesis (CTT) debate, your diagnosis, the device scenario, and what progress might look like, based on decades of philosophical and technical discourse:

  **Your Diagnosis is Fundamentally Correct: Different Questions**

  You've nailed the core issue. The standoff arises because "Church-Turing Thesis" masks distinct claims with different domains, standards of evidence, and purposes:

  1.  **The Mathematical Thesis (MTT):** This is **conceptual analysis**. It claims that the *informal, intuitive notion* of an "effectively calculable function" or a "mechanical procedure" is *exactly captured* by the formal notions of computability by a Turing Machine, lambda-definability, general recursiveness, etc. (These formalisms were proven equivalent).
      *   **Status:** Overwhelmingly accepted as settled. The convergence of multiple independent formalisms (Turing, Church, Gödel, Post, Kleene) and decades of failing to find a convincing counterexample *within mathematics* provides strong consensus.
      *   **Standard of Evidence:** Mathematical proof of equivalence between formalisms, conceptual coherence, inability to find a plausible intuitive counterexample that isn't captured by the formalisms. It's not empirically falsifiable; it's about defining the boundary of a concept.
      *   **Your Correspondent #1's View:** They are focusing solely on MTT. "Computable" *is defined* as TM-computable within mathematical logic. For this purpose, it *is* settled.

  2.  **The Physical Thesis (PTT):** This is an **empirical claim about the universe**. It claims that *any function computable by a physical system operating within the known laws of physics* is computable by a Turing Machine. No physically realizable device can compute a function outside the TM-computable set.
      *   **Status:** Deeply plausible but *not* proven. It's a statement about the laws of physics, which are contingent and subject to revision based on experiment.
      *   **Standard of Evidence:** Empirical evidence and physical theory. A demonstration of a physical system reliably computing a non-TM-computable function (e.g., solving the *general* halting problem) would falsify it. Arguments for it rely on the success of TM-based models in physics *so far* and arguments that known physics (QM, GR) is TM-simulable.
      *   **Your Correspondent #2's View:** They are focusing on PTT. They see CTT as a claim about the *physical* limits of computation, which physics *could* overturn.

  3.  **The Semantic Question (SQ):** "What counts as computation?" This is **philosophical/interpretative**. When a physical system (brain, analog computer, neural net, the universe) evolves, under what conditions are we justified in saying it is *performing a computation* and *what* computation is it performing? This is distinct from simulation/emulation.
      *   **Status:** Actively debated, especially with complex systems like brains and analog systems. There's no single agreed-upon answer.
      *   **Your Correspondent #3's View:** They are highlighting SQ. They argue that before debating *limits*, we need a clear criterion for when a physical process *is* computing a specific function in the first place.

  **The Standoff: Why It Persists**

  *   **Conflation:** People often conflate MTT and PTT under the single label "Church-Turing Thesis." Arguments valid for one are applied to the other.
  *   **Different Goals:** Logicians (MTT focus) want a clean definition for mathematical reasoning. Physicists/computationalists (PTT/SQ focus) want to understand the computational power of the real world.
  *   **Evidence Mismatch:** MTT proponents point to the settled mathematical definition and the lack of *mathematical* counterexamples as proof CTT is true. PTT proponents point out this says *nothing* about physics. PTT proponents point to speculative physics models as *potential* counterexamples. MTT proponents argue these models are unrealistic or don't actually compute a *function* in the required sense (touching on SQ).
  *   **"Bedrock Intuitions":** Yes. MTT rests on intuitions about "mechanical procedure." PTT rests on intuitions that physics is fundamentally algorithmic (or finite/discrete). SQ rests on intuitions about representation and intentionality. These are rarely explicitly argued for in the heat of debate.

  **Your Device Scenario: Does it Refute Anything?**

  *   **The Claim:** A *bounded* device (fixed finite memory/states) solves the halting problem for TMs with < N states (N large, e.g., a million).
  *   **Analysis:**
      *   **Against MTT:** **No refutation.** MTT defines computability for *arbitrary* inputs. Any *bounded* device can be simulated by a Universal TM (UTM) with enough time/tape. Solving a bounded halting problem is computable *by definition* (enumerate all <N state TMs on inputs up to a certain size; finite search). The device is just a (potentially very fast) physical implementation of a TM-computable function. It doesn't compute anything *uncomputable*.
      *   **Against PTT:** **No *strong* refutation, but a challenge.** The device performs an *enormous* but *finite* amount of computation very quickly (or via a non-algorithmic physical process). This doesn't compute a non-TM-computable function (the general halting problem is still out of reach). However:
          *   It *might* challenge naive intuitions about physical realizability (how is this much computation packed in?).
          *   It *forces the SQ question:* Is the physical process *literally computing* the halting results, or is it exploiting physical laws to reach an equilibrium *analogous* to the answer? How do we map the physical state to the mathematical result? This is crucial. If the mapping is arbitrary or requires interpretation beyond simple readout, it might not be computing the *function* in the relevant sense.
      *   **Result:** **Both sides feel vindicated, rightly so.** Definition side: No new *mathematical* computability. Physics side: A physically novel way to solve an intractable (but computable) problem, highlighting the SQ issue. The standoff persists because the device doesn't cleanly address either thesis without ambiguity (especially SQ).

  **What Counts as Progress?**

  1.  **Sharper Distinction and Terminology:** This is the most immediate and achievable progress. Explicitly separate:
      *   **MTT (Settled Definition):** The formal definition of "computable function."
      *   **PTT (Empirical Hypothesis):** The claim that physics only allows computation of MTT-computable functions.
      *   **SQ (Philosophical Question):** The criteria for attributing specific computations to physical processes.
      *   **Hypercomputation:** The study of models (theoretical or speculative physical) that *might* compute beyond the TM limit. Framing PTT as "Is hypercomputation physically possible?" is clearer.

  2.  **Progress on SQ:** Developing robust, widely accepted criteria for when a physical system computes a specific function would be major progress. This involves philosophy of mind (representational content), physics (state mapping), and computer science. Resolving SQ would clarify what would *count* as evidence for/against PTT. Is a system solving the halting problem, or just evolving according to physics in a way someone *interprets* as solving it?

  3.  **Theoretical Results in Physics:** Proving (or finding strong evidence) that our best fundamental physical theories (e.g., a theory of quantum gravity) are *themselves* Turing-computable (i.e., any physical process they describe can be simulated by a TM) would strengthen PTT. Conversely, a credible theory predicting non-TM-computable processes would weaken it.

  4.  **Formalizing Physical Computability:** Developing rigorous mathematical frameworks for "physical computability" that incorporate resources (time, space, energy) and constraints from physics could provide a clearer basis for discussing PTT beyond simple TM equivalence/non-equivalence. This often intersects with computational complexity.

  5.  **Concrete Physical Experiments (The Holy Grail, but unlikely):** An actual, reproducible demonstration of a physical system solving a verifiably non-TM-computable problem (like the general halting problem for *arbitrary* inputs) under agreed-upon SQ criteria would decisively falsify PTT. The immense practical and theoretical hurdles make this seem fantastical.

  **What to Tell Your Readers:**

  *   **Acknowledge the Standoff:** Explain that "Church-Turing Thesis" often refers to *three* entangled ideas: a settled mathematical definition, an unproven claim about physics, and a deep philosophical question about what computation *is* in the real world.
  *   **Clarify the Core Distinction:** Emphasize that the definition of "computable" in math/logic is settled (MTT), but whether *physics* allows computation beyond that limit (PTT) is an open empirical question, complicated by the need to define what counts as computation (SQ).
  *   **Explain Why Resolution is Hard:** MTT is settled by mathematical consensus and definition. PTT is about the fundamental laws of the universe, which are discovered, not legislated. SQ is a deep philosophical puzzle about meaning and representation. These require very different kinds of arguments and evidence.
  *   **Set Expectations:** Tell them **not to expect a single, definitive resolution** of "the" Church-Turing thesis. The mathematical part is settled. The physical part remains a fascinating, open hypothesis about the universe. The semantic part is an ongoing philosophical investigation. Progress comes from untangling these threads and advancing each on its own terms.
  *   **Address the Device:** Explain that such a device, while impressive, solves a computable (though enormous) problem. It doesn't challenge the *definition* of computability but might push the boundaries of efficient physical computation and raise interesting questions about *how* the result is represented physically (SQ).

  By clearly separating MTT, PTT, and SQ, you give your readers the framework to understand *why* the debate persists and what genuine progress in each domain would look like. The standoff isn't *just* verbal, but it *is* fundamentally about conflating distinct questions with fundamentally different standards of evidence.
