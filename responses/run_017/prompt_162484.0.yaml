  ### Population Axiology Decision Tree  
  *Start at Branch 1. Answer each question based on your intuitive judgment, not prior knowledge of theories.*

  ---

  #### **Branch 1: Value of Adding a Positive-Welfare Life**  
  *Claim: When a person comes into existence with a life above neutral welfare (+w), this makes the world better.*  
  - **Yes** → Go to Branch 2.  
  - **No** → Go to Branch 6.  

  ---

  #### **Branch 2: Drip Lives Case**  
  *Compare:*  
  - **A**: One person at +1,000 welfare units.  
  - **B**: 1 billion people at +0.001 welfare units (total welfare = A’s).  
  *Which is better?*  
  - **A is better** → Go to Branch 3.  
  - **B is better or equal** → Go to Branch 4.  

  ---

  #### **Branch 3: Why A is Better in Drip Lives?**  
  *Choose the strongest reason:*  
  - **Average welfare matters most** → Leaf: **Averagism**.  
  - **B’s lives are below a welfare threshold** → Go to Branch 3A.  
  - **B’s worst-off life is unacceptable** → Leaf: **Lexical Prioritarianism**.  

  **Branch 3A: Nature of the Welfare Threshold**  
  *The minimum welfare required for adding a life to improve the world is:*  
  - **Fixed** (e.g., always +10) → Go to Branch 5.  
  - **Sliding** (decreases as population grows) → Leaf: **Sliding Critical-Level (unnamed)**.  

  ---

  #### **Branch 4: Aggregation Method**  
  *When comparing populations of different sizes, the overall good depends on:*  
  - **Total welfare sum** → Go to Branch 5.  
  - **Number of lives** (more lives = better, even with equal total) → Leaf: **Positive Expansionism (unnamed)**.  

  ---

  #### **Branch 5: Staircase vs. One-Jump Case**  
  *In the staircase (A → A+ → ... → Z), each step adds people at +w and redistributes downward. Z has huge population at low +w.*  
  - **Accept the staircase** (each step improves things) → Go to Branch 5A.  
  - **Reject the staircase** (break at any step) → Leaf: **Critical-Level Utilitarianism (fixed)**.  

  **Branch 5A: One-Jump Endorsement**  
  *Is a direct jump from A to Z (same Z) an improvement?*  
  - **Yes** → Leaf: **Totalism**.  
  - **No** → Leaf: **Path-Dependence (unnamed)**.  

  ---

  #### **Branch 6: Adding Negative-Welfare Lives**  
  *Does adding a person with negative welfare (–w) make the world worse?*  
  - **Yes** → Leaf: **Asymmetry View**.  
  - **No** → Leaf: **Person-Affecting Restriction (unnamed)**.  

  ---

  ### Leaf Positions (Views)  

  1. **Totalism**  
     - *Awkward commitment:* Embraces the repugnant conclusion (Z > A).  
     - *Load-bearing branch:* 5A (Yes to one-jump).  

  2. **Averagism**  
     - *Awkward commitment:* Prefers a smaller, happier population even if total welfare is lower.  
     - *Load-bearing branch:* 3 (Average matters).  

  3. **Critical-Level Utilitarianism (fixed)**  
     - *Awkward commitment:* May endorse "sadistic conclusion" (adding tortured lives over mildly unhappy ones).  
     - *Load-bearing branch:* 5 (Reject staircase).  

  4. **Sliding Critical-Level (unnamed)**  
     - *Awkward commitment:* The 10-billionth life can be barely worth living; may slowly converge to repugnance.  
     - *Load-bearing branch:* 3A (Sliding threshold).  
     - *Status:* Unexplored—avoids impossibility theorems but may not escape repugnance.  

  5. **Lexical Prioritarianism**  
     - *Awkward commitment:* No number of mild gains can override a tiny loss to the worst-off.  
     - *Load-bearing branch:* 3 (Worst-off priority).  

  6. **Asymmetry View**  
     - *Awkward commitment:* No moral reason to create happy people (neutral), but strong reason not to create unhappy ones.  
     - *Load-bearing branch:* 6 (Yes to negative-life harm).  

  7. **Positive Expansionism (unnamed)**  
     - *Awkward commitment:* Prefers "drip lives" (B > A); accelerates repugnant conclusion.  
     - *Load-bearing branch:* 4 (Number of lives matters).  
     - *Status:* Rare—unattractive due to extreme repugnance.  

  8. **Path-Dependence (unnamed)**  
     - *Awkward commitment:* Accepts Z via staircase but rejects direct jump; inconsistent across time.  
     - *Load-bearing branch:* 5A (No to one-jump).  

  9. **Person-Affecting Restriction (unnamed)**  
     - *Awkward commitment:* Adding lives (even at –w) is neutral; creating suffering isn’t bad.  
     - *Load-bearing branch:* 6 (No to negative-life harm).  
     - *Status:* Unexplored—incoherent with harm intuition.  

  ---

  ### Notes  
  - **Unseparated pairs:** Lexical Prioritarianism vs. fixed Critical-Level (agree on drip lives). *Add a case:* "Is a life at –1 worse than no life?" to split them.  
  - **Missing position:** Negative Utilitarianism (reject adding any life). Covered under Asymmetry if extended to "adding +w lives is bad."  
  - **Repugnant conclusion embraced?** Totalism and Sliding Critical-Level both endorse it (explicitly or gradually). The "not repugnant" stance aligns with Totalism.  
  - **Cuts:** Omitted "Average with floor" and "Negative-leaning averagism" to stay under 12 leaves.  

  Print this as a one-page flowchart: Start at Branch 1 → Follow arrows → Arrive at your leaf.
