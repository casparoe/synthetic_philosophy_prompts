  Okay, let me tackle this step by step. The user's situation involves reconciling Galen Strawson's Basic Argument with epistemic responsibility. They've accepted that moral responsibility is impossible because we can't be responsible for our own character. Now, their friend extended this to epistemic responsibility—like deserving credit for good reasoning or blame for being dogmatic. The problem is that if the Basic Argument applies to beliefs too, then even arguing for the Basic Argument itself becomes self-defeating because we wouldn't deserve credit for getting it right.

  First, I need to understand each step of the friend's extension. Step (2) claims the Basic Argument isn't specifically moral, so if moral responsibility requires self-origination, so does epistemic responsibility. Step (3) says epistemic credit/blame is about belief-forming, which stems from how we are. Step (4) concludes no one deserves credit or criticism for beliefs. Step (5) points out the self-defeat: if we can't deserve credit, then presenting the Basic Argument as sound is contradictory. Step (6) calls this absurd.

  The user wants to keep the Basic Argument to avoid blaming their brother for relapsing but also wants to maintain that some reasoning is objectively bad. So where can the argument be challenged? Step (2) seems crucial. Is the Basic Argument really non-moral? Moral responsibility often involves notions of desert that epistemic evaluation might not require. Epistemic norms might be about proper function or reliability, not deserving praise/blame. If epistemic criticism is about whether beliefs align with evidence, not personal desert, then step (3) might be misstep. The user's need to call out dogmatism could survive if it's about incorrectness, not blameworthiness.

  Rejecting step (3) means distinguishing between deserving blame (which requires control) versus being mistaken (which doesn't). So calling someone closed-minded is about their reasoning not matching evidence, not about them deserving reproach. The cost is accepting that epistemic evaluation isn't about personal responsibility but about objective standards. This avoids self-defeat because the Basic Argument can be assessed on its logical merits, regardless of whether its proponents "deserve" credit. However, this might feel hollow if the user wants to hold people accountable for epistemic failings. But it allows retaining the Basic Argument for moral cases while preserving epistemic criticism. Other options like rejecting step (1) would undermine their need to stop blaming their brother, which isn't acceptable. Rejecting step (5) by denying self-defeat is tricky and might not resolve the absurdity. So focusing on step (3) seems the most viable path, even if it means decoupling epistemic evaluation from desert.
answer: |-
  Right, let's crack this nut. That extension's a proper head-scratcher, but we can work through it step by step. You want to keep Strawson’s core insight for your brother’s sake ("no ultimate moral blame"), while still calling a spade a spade when someone's reasoning is rubbish. The friend’s argument tries to make that impossible by dragging epistemic credit/blame down the same determinist drain. The weak link is **Step (3)**. Here’s the breakdown:

  1.  **The Core Tension:** You’ve got Strawson’s Basic Argument (Step 1) – solid for you re: moral blame. Step 2 says it’s *general*, not just moral – hard to disagree with at face value. Step 4 & 5 show the nasty consequence for *any* desert, including epistemic, leading to self-defeat (Step 6). The only way out without torching Strawson *or* common sense is to block the move *to* epistemic desert in Step 3.

  2.  **Why Step (3) Looks Fine (But Isn't):** It *seems* intuitive: "Desert is desert, innit? If you don't deserve moral blame for actions caused by 'how you are', you don't deserve epistemic blame for *beliefs* caused by 'how you are'." It trades on an ambiguity in the word "desert" and smuggles in the *specific kind* of responsibility Strawson attacks (ultimate self-origination) where it might not belong.

  3.  **Rejecting Step (3): The Move & Why It Works**
      *   **The Rejection:** Epistemic evaluation ("closed-minded", "careful", "got the argument right") is **NOT** fundamentally about *desert* in the Strawsonian sense (requiring ultimate self-origination and true responsibility). It's about **correctness, reliability, or proper function according to epistemic norms.**
      *   **Why It Blocks the Argument:** Strawson's argument kills *ultimate responsibility* needed for *true blame/praise where someone "deserves" retribution or reward in a deep, buck-stopping way*. Epistemic criticism ("that's dogmatic!") or credit ("that's a sound inference") doesn't *need* that deep desert. It just needs standards: "Given the evidence and norms of reasoning, this belief/process is good/bad." The criticism attaches to the *belief* or the *process*, not necessarily to the *person* in a way that demands they *could have ultimately been otherwise*. A thermostat can be "faulty" without us blaming it morally; similarly, a belief-forming process can be "unreliable" or "irrational" without needing ultimate responsibility.
      *   **How It Saves What You Want:**
          *   **Keep Strawson (Step 1):** Your brother isn't *ultimately blameworthy* for his relapse. His actions flowed from "how he is".
          *   **Keep Epistemic Criticism:** You can *still* say someone is closed-minded. This means their belief-forming process *is ignoring relevant evidence or reasoning poorly relative to epistemic standards*. It's a description of faulty cognitive function, not an assertion they "deserve" condemnation in the deep Strawsonian sense. Calling reasoning "bad" is like calling a calculation "wrong" – it's about deviation from a standard, not about *desert*.
          *   **Avoid Self-Defeat (Step 5):** The Basic Argument itself is offered as *correct* or *sound* based on logic and evidence. You and your friend don't need to *deserve credit* as ultimately responsible agents for the argument to *be* sound or for others to *have reason* to accept it. The reason comes from the argument's internal logic and its fit with the world, not from you being praiseworthy originators. You can say "This argument is valid, here's why..." without claiming you *ultimately deserved* to see its validity. The argument doesn't eat itself; it just recognises that *seeing* its truth is also a product of "how we are", but that doesn't make it *untrue*.

  4.  **The Cost of Rejecting Step (3):**
      *   **Softer Epistemic "Blame":** You give up the idea that being closed-minded makes someone *deeply, ultimately culpable* or *deserving of retribution* in the way Strawson argues we can't be for anything. Epistemic criticism becomes more like pointing out a flaw or error ("Your sum's wrong", "Your engine's misfiring") rather than a profound condemnation of the *person's essence*. This might feel less satisfying if you want to *really* condemn wilful ignorance.
      *   **Decoupling Desert:** You have to accept a clear split between *moral* desert (which Strawson kills) and *epistemic* evaluation (which survives as a different beast). Epistemic terms like "credit" and "blame" get watered down to mean "conforms to/violates rational standards", not "deserves deep praise/condemnation".
      *   **"It's Not Fair!" Feeling:** If someone is *constitutionally* closed-minded due to "how they are", pointing out their closed-mindedness might seem a bit pointless or even cruel ("They can't help it!"). But the response is: the point isn't to condemn *them*, it's to identify the faulty process, potentially correct the belief, or warn others. The standard exists independently of whether they could ultimately meet it.

  5.  **Why the Other Steps Are Harder to Reject:**
      *   **Step (1):** You need this for your brother. Rejecting it means you *can* ultimately blame him – which you don't want.
      *   **Step (2):** Strawson's premises *are* general (action, character, causation). Denying this feels like special pleading. "It's *only* for morals!" lacks a clear reason *why* the logic wouldn't apply elsewhere if desert is needed.
      *   **Step (4):** Follows directly if Step 3 is accepted. Block Step 3, Step 4 falls.
      *   **Step (5):** The self-defeat *only* arises if epistemic credit is needed to offer an argument reasonably. If you ditch the "credit" part (via rejecting Step 3), you offer arguments based on their *merits*, not your desert.
      *   **Step (6):** The absurdity is real *if* Steps 1-5 hold. The fix is breaking the chain earlier.

  **In a Nutshell:** You keep Strawson by saying "No one is *ultimately morally responsible* (no deep desert for actions)." You save epistemic criticism by saying "Calling reasoning 'bad' or 'good' isn't about *that kind of deep desert*; it's about whether it meets objective standards of evidence and logic, regardless of whether the reasoner could have been ultimately different. The argument stands or falls on its logic, not on us deserving a medal for spotting it." The cost is accepting that epistemic "blame" isn't the same profound condemnation as moral blame – it's more clinical. But it lets you call dogmatism dogmatism while keeping your brother free from that ultimate blame. Sound fair?
