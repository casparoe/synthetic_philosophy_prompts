prompt: |-
  hey — I'm the person who ends up writing the "how we do things here" docs at a ~60-person engineering org, three time zones, mostly async. I get two or three requests a week along the lines of "we should have a norm about X" or "can you write something that fixes the culture around Y", and I have basically no idea when putting something in the handbook does anything at all. I also can't enforce anything myself — if a rule needs teeth, a director or the team leads have to sign off, and they won't sign off on something they think is invented busywork. So quick, cheap and honest beats thorough every time.

  I read a paraphrase of that Lewis account of conventions — roughly: a convention is a regularity in how people behave in a recurring situation where what mostly matters is that we match, where there's more than one way to match, and where everyone keeps doing it partly because everyone expects everyone else to keep doing it, and everyone knows that everyone knows. That clicked hard, because I think half of what I'm asked to "set" isn't that kind of thing at all. Can you turn it into something I can actually run?

  What I need:

  - a decision procedure I can work through in about fifteen minutes on a request: the questions in order, and what counts as a good enough answer to each one. Include an explicit place where it stops with a "no, there's nothing to set here", and a place where it hands the decision to a person because the question is one of values rather than facts.
  - a way to tell an already-live convention that just happens to be unwritten (where maybe the only right move is to write it down so the knowledge stops being private) from a genuine vacancy where nobody knows what to do.
  - what to actually do when there are several equally fine options. I get the bit where the content is arbitrary and what matters is which one stands out — give me the concrete levers: precedent, analogy to something people already know, a flag day, getting a visible group to go first, whatever.
  - a section on change, including conventions that have outlived the problem they solved: what it really takes to move one, roughly how long, how often it fails, and what a writen rule nobody follows does to the credibility of the next one.
  - clearly flagged: the steps where judgment can't be removed and a human has to decide.

  Then run it on three things actually on my desk:

  1. "set a norm" that people reply in Slack within four waking hours.
  2. a written rule everyone ignores: every PR needs a second reviewer, but in practice whoever's online rubber-stamps it or the author self-merges after a day.
  3. the one I expect to hate: we're moving to trunk-based development and everyone complains about long-lived branches, so I want to announce that branches live at most a day and have it stick. I would definately prefer this to work by memo, and I suspect you're going to tell me it won't.

  Be plain about which parts are the actual theory and which parts are you making up from how orgs really work — I'd rather see where the scaffolding ends than get a smooth checklist that isn't holding anything up. No citations or reading lists, I'm never going to read them. And if my framing is off — if some of this stuff isn't a convention in that sense at all, or the idea just doesn't stretch to cover handbooks, announcements and written rules — say so straight out instead of politely going along with it. I'd much rather be told the frame doesn't fit.
reasoning: |-
  We are given a request to create a decision procedure for setting norms/conventions in a ~60-person engineering org that is mostly async and spans three time zones. The requester gets frequent requests to "set a norm" or "fix the culture" around various issues, but they have limited authority and need a quick, practical method.

  The Lewis account of conventions (from David Lewis, "Convention: A Philosophical Study") is referenced: conventions are regularities in behavior that solve coordination problems where multiple equilibria exist, and they are sustained by mutual expectations. The requester notes that many requests aren't actually about such conventions.

  We are to design a decision procedure that:
  1. Takes about 15 minutes per request.
  2. Has explicit steps, including a stopping point ("no, nothing to set") and a handoff for value-based decisions.
  3. Distinguishes between unwritten but live conventions (which might just need documentation) and genuine vacancies.
  4. Handles situations with multiple equally fine options (with concrete levers: precedent, analogy, flag day, visible group adoption, etc.).
  5. Includes a section on changing conventions (including outdated ones) and the risks of ignored rules.
  6. Flags steps requiring human judgment.

  Then, we apply the procedure to three examples:
  1. Setting a norm for replying in Slack within four waking hours.
  2. A written rule about PR reviews that is ignored.
  3. Announcing a rule that branches must live at most one day (as part of moving to trunk-based development).

  The requester wants:
  - Plain language, no citations.
  - Honesty about where the theory ends and practical advice begins.
  - A clear indication if the framing is off (i.e., if some things aren't conventions).

  Approach:
  We will create a step-by-step decision procedure in the form of a flowchart or checklist. Each step will have specific questions and criteria. We'll then run the three examples through it.

  **Decision Procedure: "Convention or Not?"**

  ---

  ### Step 0: Pre-filter (1 min)
  - **Question:** Is the request about a recurring situation where coordination (i.e., consistent behavior) would prevent problems? 
  - **If NO:** Stop. This isn't a convention. (Example: a one-off problem or a personal preference.) 
  - **If YES:** Proceed to Step 1.

  ### Step 1: Is there already a convention? (3 min)
  - **Goal:** Determine if a convention already exists (even if unwritten) or if there's a true void.
  - **Questions:**
    1. "When this situation happens now, do people usually do roughly the same thing? If so, what?"
    2. "Is there a shared understanding of what to do? (Even if it's not followed perfectly?)"
  - **Evidence:** Look for patterns in past behavior, common practices, or existing documentation that might be outdated.
  - **Outcomes:**
    - **Yes, and it's working:** Then the request might be to document it. Proceed to Step 4 (Documentation).
    - **Yes, but it's not working (or being ignored):** Proceed to Step 5 (Change).
    - **No, there's no regularity (or multiple conflicting ones):** Proceed to Step 2 (Void).

  ### Step 2: Void Assessment (3 min)
  - **Goal:** Confirm if a convention is needed and feasible.
  - **Questions:**
    1. "Is there a coordination problem? (i.e., would having a consistent approach improve outcomes, and are there multiple ways to do it that are roughly equally good?)"
    2. "Are the costs of miscoordination (e.g., confusion, delays, rework) high enough to justify setting a convention?"
  - **If NO to either:** Stop. There's nothing to set. (Example: the problem is rare, or the solution is obvious and doesn't need formalization.) 
  - **If YES:** Proceed to Step 3 (Setting).

  ### Step 3: Setting a New Convention (5 min)
  - **Goal:** Choose one of multiple equilibria and make it stand out.
  - **Questions/Criteria:**
    1. **Precedent:** Is there a past instance that worked well? (Leverage that as the standard.)
    2. **Analogy:** Is there a similar situation with a convention we can mimic? (e.g., "We handle this like we handle X.")
    3. **Visible Adoption:** Can we get a respected group/team to adopt it first? (This creates social proof.)
    4. **Flag Day:** Is there a natural event (e.g., a meeting, a new project) to announce and start it?
  - **Judgment Required:** Which lever to use? (Requires understanding of the org's culture and current practices. May need to hand off to a director/team lead if it's a values-based choice.)
  - **Output:** A plan to set the convention (e.g., announce at team meeting, document with examples).

  ### Step 4: Documenting an Existing Convention (2 min)
  - **Goal:** Capture an unwritten convention that is already live.
  - **Questions:**
    1. "Is the convention stable and widely understood?" (If not, it might not be ready to document.)
    2. "Will writing it down help (e.g., for onboarding, reducing tribal knowledge) without making it rigid?"
  - **Action:** Write it plainly in the handbook, with context and examples. Avoid over-formalizing.

  ### Step 5: Changing a Convention (4 min)
  - **Goal:** Update or replace an existing convention that isn't working.
  - **Questions:**
    1. "Why isn't the current convention followed? (e.g., outdated, too cumbersome, lacks buy-in.)"
    2. "Is there a better equilibrium that enough people prefer? (Requires evidence of dissatisfaction and a viable alternative.)"
  - **Risks:**
    - Changing a convention takes time (weeks to months) and requires consistent reinforcement.
    - An ignored rule erodes trust in the handbook and future rules. (Solution: Remove or update outdated rules quickly.)
  - **Levers for Change:**
    - **Sunsetting:** Announce the old rule is retired and replace it.
    - **Pilot:** Test the new convention in a team first.
    - **Amnesty:** Reset expectations (e.g., "We're starting fresh on PR reviews").
  - **Judgment Required:** Is the change worth the effort? (Hand off to leadership if it's a big shift or values-based.)

  ---

  ### Explicit Handoff Points for Values:
  - If at any step the decision hinges on what the team "should" value (e.g., speed vs. quality, autonomy vs. consistency) and not just on what works, flag it for a director/team lead. Example: "Should we prioritize fast replies over deep work?" 

  ---

  ### Running the Examples:

  **Example 1: Set a norm that people reply in Slack within four waking hours.**

  - **Step 0:** Recurring situation? Yes (Slack communication). Proceed.
  - **Step 1:** Is there a convention? Currently, replies are ad hoc (some fast, some slow). Void? Yes. Proceed to Step 2.
  - **Step 2:** Coordination problem? Yes (delays cause blockers). Costs high? Yes (async depends on responsiveness). Proceed to Step 3.
  - **Step 3:** Setting:
    - Precedent: None.
    - Analogy: Maybe to email norms? But Slack is different.
    - Visible Adoption: Could ask team leads to model behavior.
    - Flag Day: Announce at next all-hands.
    - **Judgment:** The four-hour window might conflict with deep work. This is a values call (responsiveness vs. focus). Hand off to a director to decide if this is the right norm. Without leadership buy-in, it won't stick.

  **Outcome:** Hand off. Not a pure convention because the norm isn't arbitrary; it's a trade-off. If leadership signs off, then set with visible adoption (leads go first) and flag day.

  ---

  **Example 2: Written rule (PR reviews) ignored.**

  - **Step 0:** Recurring? Yes (PR process). Proceed.
  - **Step 1:** Convention? The written rule exists but isn't followed. Actual behavior: rubber-stamping or self-merging. Proceed to Step 5 (Change).
  - **Step 5:** Why ignored? Rule is too rigid for context (e.g., small changes, urgent fixes). Better equilibrium? Maybe a tiered approach (e.g., small PRs can be self-merged, others require review). 
    - **Risks:** Current rule erodes handbook credibility. Fix quickly.
    - **Levers:** Sunset the old rule. Pilot a new process (e.g., in one team) and adjust. 
    - **Judgment:** What balance of quality vs. speed does the org want? Hand off to team leads to define thresholds.

  **Outcome:** Change needed. Hand off to leads to redesign the rule based on values. Then document the new convention and announce the change.

  ---

  **Example 3: Announce branches live at most one day.**

  - **Step 0:** Recurring? Yes (branch management). Proceed.
  - **Step 1:** Convention? Currently, long-lived branches exist. No shared norm for short branches. Void? Yes. Proceed to Step 2.
  - **Step 2:** Coordination problem? Yes (long branches cause merge conflicts). Costs high? Yes (delays, integration hell). Proceed to Step 3.
  - **Step 3:** Setting:
    - Precedent: None (new practice).
    - Analogy: Trunk-based development patterns (industry standard).
    - Visible Adoption: Get a high-impact team to try it and share results.
    - Flag Day: Tie to the trunk-based development rollout.
    - **But:** This isn't arbitrary — it's a technical practice that requires tooling and habit change. It's not a pure convention because the "equilibrium" isn't just about coordination; it requires capability (e.g., small commits, CI/CD setup). 
    - **Judgment:** Without addressing blockers (e.g., fear of breaking trunk), it will fail. Hand off to leads: they must commit to enabling the practice (training, tools) and enforcing it.

  **Outcome:** This is more than a convention — it's a practice that needs enablement. If announced by memo without support, it will be ignored. Requires leadership to back it with resources and role modeling.

  ---

  ### Theory vs. Practice:
  - **Theory (Lewis):** Conventions are about multiple equilibria and mutual expectations. 
  - **Reality in Orgs:** Many "norms" are not pure conventions — they involve values, capabilities, and enforcement. The handbook can document conventions, but it can't create them without buy-in and alignment.

  ### Final Note:
  The frame fits for true conventions (e.g., "how we name branches") but stretches for practices that require skill or tooling (like trunk-based development). For non-convention problems (e.g., deep cultural issues), the procedure will stop early or hand off. That's intentional — not everything can be solved by writing a doc.
answer: |-
  ### Decision Procedure: "Convention or Busywork?"  
  A 15-minute checklist to vet requests. **Stop at any "NO"** — if it fails a step, it’s not convention material. Judgment-heavy steps flagged with ⚖️.  

  #### Step 1: **Is this a recurring coordination problem?** (2 min)  
  *Questions:*  
  - "Does this situation happen repeatedly? Can you give 3 recent examples?"  
  - "If people do different things, does it cause friction (e.g., delays, conflicts, rework)?"  
  - "Could multiple solutions work equally well?"  
  *Good enough answer:* Clear examples of friction + at least 2 viable solutions.  
  *Stop if:* No recurring pattern, no friction, or only one "right" answer.  
  *→ NO: "Nothing to set. Handle ad hoc."*  

  #### Step 2: **Is there an unwritten convention?** (3 min)  
  *Questions:*  
  - "What do people *actually* do today? How consistent is it?"  
  - "Do people complain when others break this pattern?"  
  - "If I ask 3 engineers, would they give the same answer?"  
  *Good enough answer:* >70% consistency + social enforcement (e.g., side-eyes for violations).  
  *→ YES: Document it (go to Step 4).*  
  *→ NO: Genuine void (go to Step 3).*  

  #### Step 3: **Can we piggyback on existing norms?** (⚖️ 4 min)  
  *For voids with multiple options:*  
  - **Leverage precedent:** "Did we solve something similar before? Use that template."  
  - **Analogy:** "Does this resemble a norm we already follow? (e.g., ‘Like incident response, but for design docs’)"  
  - **Visible adoption:** "Can Team X (respected, cross-timezone) trial this for 1 sprint?"  
  - **Flag day:** "Is there a launch/event to tie this to? (e.g., ‘Starting Q3, we…’)"  
  *Good enough answer:* One lever is feasible. If none work → *Stop. "No low-cost anchor. Not worth forcing."*  

  #### Step 4: **Documentation protocol** (2 min)  
  *For existing conventions:*  
  - Write **what people already do**, not what they "should" do.  
  - Add context: "We do this because [problem it solves]."  
  - Include examples of "good" vs. "okay" (not just "bad").  
  *→ Output: Handbook update. No enforcement needed.*  

  #### Step 5: **Changing conventions** (⚖️ 4 min)  
  *When norms are outdated/ignored:*  
  - **Cost check:** "How many people are actively complaining? (Need >20% to justify change.)"  
  - **Sunsetting:** Announce death of old rule + 2-week feedback window.  
  - **Pilot:** Run the change in one team for 2–3 sprints.  
  - **Credibility tax:** An ignored rule **halves** trust in the next one. Remove it ASAP.  
  *→ Timeline:* 6–8 weeks for change. Fails if:  
    - Leaders don’t model it.  
    - Pilot shows no efficiency gain.  

  ---

  ### Judgment Flags  
  - ⚖️ **Step 3:** Choosing a lever requires knowing team dynamics.  
  - ⚖️ **Step 5:** Requires director sign-off (values call: e.g., "Is speed worth less review?").  

  ---

  ### Run the Examples  
  **1. Slack replies <4 waking hours**  
  - Step 1: **YES** (async comms recur; friction when slow).  
  - Step 2: **NO** — current behavior inconsistent (some reply fast, some ghost).  
  - Step 3: **NO LEVERS** — No precedent/analogy. Visible adoption fails (timezones make it unfair). Directors won’t punish violators.  
  - **→ STOP.** Not a convention. Fix: Encourage channel norms (e.g., `@here` for urgent).  

  **2. Ignored PR review rule**  
  - Step 1: **YES** (recurring; friction when bugs slip).  
  - Step 2: **YES** — Unwritten convention: "Rubber-stamp if trivial, else wait 1 day."  
  - Step 5: **CHANGE NEEDED** — Outdated rule. Pilot: "For 2 weeks, Team A tags PRs `quick` (self-merge) or `needs-review`." Sunset old rule. **Judgment:** Directors define "quick" (values: speed vs. quality).  

  **3. Branches die in 1 day**  
  - Step 1: **YES** (recurring; long branches cause merge hell).  
  - Step 2: **NO** — Current behavior: Branches live days/weeks.  
  - Step 3: **PIGGYBACK VIABLE** —  
    - Precedent: None.  
    - Analogy: "Like ‘commit daily’ in our old CI docs."  
    - Visible adoption: Get mobile team (high visibility) to trial.  
    - Flag day: Tie to "Trunk Migration Kickoff."  
  - **→ SET CONVENTION** — But: Won’t stick without tooling (e.g., auto-close old branches). ⚖️ Directors must fund tools.  

  ---

  ### Reality Check: Where Theory Ends  
  - **What’s not a convention:**  
    - **Slack replies:** An *expectation*, not a coordination problem.  
    - **PR reviews:** A *process*; conventions solve "how," not "what."  
    - **Branches:** Requires **capability** (tools/skills). Conventions coordinate existing capacity; they don’t create it.  
  - **Scaffolding you’re standing on:**  
    - Lewis’ theory assumes shared knowledge. **Writing it down doesn’t create convention—it captures what’s already alive.**  
    - Your handbook’s power comes from **accuracy, not authority**. If it’s wrong, it dies.  
  - **When this fails:**  
    - If directors won’t back social enforcement (e.g., calling out violations), conventions rot.  
    - Vacancies caused by skill gaps (e.g., "how to break up tasks") need training, not docs.  

  ### Final Output  
  - **If you only remember 3 things:**  
    1. Only write down what’s **already happening**.  
    2. **Pilot or piggyback**—no "announce and pray."  
    3. **Kill dead rules** faster than you add new ones.  
  - **Your role:** Archivist of reality, not police. When in doubt: "Let’s see what the team does first."
