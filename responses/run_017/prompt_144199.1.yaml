prompt: |-
  I'm writing a term paper for a graduate seminar on computational models of perception and action, and I've got stuck on a question about active inference that I keep going back and forth on, so I'd like a careful comparison rather than another summary of the framework.

  As I understand the selling point: perception, action, and learning are all supposed to fall out of one imperative — minimize a bound on surprise, i.e. variational free energy — whereas in classical optimal control the agent minimizes a cost (or maximizes a reward) that is handed to it from outside the model, and perception is handled by a separate state-estimation step. The standard move is then to say that in active inference the goal is not an external cost function but a prior over preferred outcomes built into the generative model itself, so goal-directedness gets absorbed into the structure of the model rather than stipulated as an objective.

  What I can't work out is how much of that is a substantive difference and how much is relabeling. Three sub-questions:

  First, suppose I set up a partially observed Markov decision problem and solve it by model predictive control, with a cost that penalizes both deviation from a target trajectory and the expected entropy of my belief about the hidden state. Do I get literally the same behavior as an active-inference agent minimizing expected free energy under a prior preference over outcomes? If the two schemes are formally equivalent, what work is the variational framing doing beyond renaming the cost as a prior? And if they are not equivalent, I'd like you to point at the exact place where they come apart.

  Second, on the standard telling, action reduces prediction error by making the world match the prediction, rather than by making the prediction match the world. But minimizing expected free energy means scoring counterfactual policies — sequences of actions the agent is not currently performing, whose sensory consequences it is not currently undergoing, evaluated over a future horizon. Doesn't that reintroduce precisely the kind of model-based, forward-simulating planner that the framework was advertised as replacing? What is left of the claim that perception and action are two aspects of a single process?

  Third, a worry about precision. An agent can in principle reduce the prediction error it incurs either by acting on the world, by updating its beliefs, or by lowering the precision it assigns to the sensory prediction errors it expects — turning down the gain, as it were, or simply not sampling that stream of input. The last option looks far cheaper than the first two, and an agent that exploited it would present as more or less comatose: sitting in an unchanging environment with the gain turned down, and by its own lights doing perfectly well. I don't think this is quite the familiar dark-room worry, since the issue here is the agent's freedom to set precision rather than its choice of which state to occupy, but I suspect they are related. What in the framework rules this out? Is the answer just that precision parameters are themselves part of the generative model and carry their own priors, so that precision is optimized rather than freely chosen — and if so, doesn't that push the real explanatory burden back onto whatever fixes those hyperparameters?

  Please use equations where they genuinely help, but always say in plain words what the equations are doing, and tell me what conceptual or empirical work the difference does if there is one, or what the active-inference framing buys you if there isn't.
reasoning: |-
  We are addressing three sub-questions about active inference. Let's take them one by one.

  ### First Sub-question: Equivalence between Active Inference and POMDP with a Specific Cost

  **Question:** 
  Suppose we set up a partially observed Markov decision process (POMDP) and solve it by model predictive control (MPC) with a cost that penalizes both deviation from a target trajectory and the expected entropy of the belief about the hidden state. Is this equivalent to active inference minimizing expected free energy (EFE) under a prior preference? If equivalent, what is the point of the variational framing? If not, where do they diverge?

  **Answer:**

  In active inference, the agent minimizes the variational free energy (FE) for perception (i.e., state estimation) and the expected free energy (EFE) for action selection. The EFE for a policy (sequence of actions) π is defined as:

      EFE(π) = E_q[ ln q(s|π) - ln p(o,s | π) ]

  But note that in the literature (e.g., Friston et al.), the EFE is often decomposed as:

      EFE(π) = E_q(s|π)[ D_KL[ q(o|s) || p(o) ] ] + E_q(s|π)[ H[q(o|s)] ]

  or equivalently:

      EFE(π) = - E_q(o|π)[ ln p(o) ] + E_q(s|π)[ H[p(o|s)] ]

  where the first term is the expected divergence from prior preferences (i.e., the cost of not getting what you want) and the second is the expected ambiguity (i.e., the uncertainty about outcomes given the state).

  In a POMDP with MPC, we typically minimize a cost that accumulates over a horizon. Consider a cost at time t of the form:

      c(t) = (o_t - target_t)^2 + λ * H[b_t]

  where b_t is the belief state (distribution over hidden states) and H[b_t] is the entropy of the belief. The first term penalizes deviation from a target trajectory, and the second term penalizes uncertainty (high entropy) in the belief.

  Now, compare this to the EFE. The EFE also has two terms: one that encourages outcomes that match the prior preferences (which can be seen as the target) and one that encourages low ambiguity (i.e., low entropy in the outcome given the state). However, note that the ambiguity term is about the outcome given the state, not the entropy of the belief state.

  But wait: in the POMDP cost above, we have the entropy of the belief state, while in the EFE we have the entropy of the outcome given the state (which is fixed by the generative model). So they are not the same.

  Moreover, the EFE is typically written as:

      EFE(π) = E_q(o|π)[ ln q(o|π) - ln p(o) ]

  which can be decomposed into:

      EFE(π) = E_q(o|π)[ - ln p(o) ] + E_q(o|π)[ ln q(o|π) ]

  The second term is the entropy of the outcomes under the policy, which is:

      H[q(o|π)] = - E_q(o|π)[ ln q(o|π) ]

  So:

      EFE(π) = - E_q(o|π)[ ln p(o) ] - H[q(o|π)] 

  But note that H[q(o|π)] is not the same as the entropy of the belief state.

  Alternatively, we can write:

      EFE(π) = - E_q(o|π)[ ln p(o) ] + E_q(s|π)[ H[p(o|s)] ]

  because:

      q(o|π) = ∫ ds q(o,s|π) = ∫ ds q(s|π) p(o|s)

  and then:

      H[q(o|π)] = - ∫ do q(o|π) ln q(o|π)

  which is not the same as H[b_t] (the entropy of the belief state at time t).

  Therefore, the two cost functions are not equivalent. Specifically:

  - The EFE in active inference has a term for the expected divergence from prior preferences (which is like the target trajectory) and a term for the expected ambiguity (entropy of outcomes given states, which is fixed by the observation model).
  - The POMDP cost we described has a term for the deviation from the target and a term for the entropy of the belief state (which is the uncertainty in the state estimate).

  However, note that in some formulations of active inference, the EFE is written to include an information gain term. In fact, an alternative decomposition is:

      EFE(π) = E_q(o,s|π)[ ln q(s|π) - ln p(o,s) ]

  and then:

      EFE(π) = E_q(o,s|π)[ - ln p(o|s) ] + E_q(o,s|π)[ ln q(s|π) - ln p(s) ]

  But note that:

      E_q(o,s|π)[ - ln p(o|s) ] = E_q(s|π)[ H[p(o|s)] ]   [expected ambiguity]

  and:

      E_q(o,s|π)[ ln q(s|π) - ln p(s) ] = E_q(s|π)[ ln q(s|π) - ln p(s) ] = D_KL[ q(s|π) || p(s) ]

  This KL divergence term can be interpreted as the cost of deviating from a prior over states. However, in active inference, the prior over states is often not specified independently of the preferences. Instead, the prior preferences are over outcomes, and the prior over states is part of the generative model.

  Moreover, in the POMDP cost, we have a penalty on belief entropy. In active inference, the EFE does not directly include the entropy of the belief state. However, note that in the process of perception (state estimation), the variational free energy is minimized, which does involve the entropy of the belief state. But for action selection, the EFE is about future outcomes and states.

  So, the two are not equivalent. The key difference is that the EFE is defined in terms of the expected outcomes under the policy and the prior preferences over outcomes, and it includes an ambiguity term (which is the expected entropy of the observation model). The POMDP cost we defined includes a belief entropy term, which is about the uncertainty in the state estimate.

  But wait: there is a connection through information gain. Sometimes the EFE is written as:

      EFE(π) = - E_q(o|π)[ ln p(o) ] + E_q(s|π)[ H[p(o|s)] ]

  However, in the literature, an alternative form of the EFE that includes an information gain term is:

      EFE(π) = - E_q(o|π)[ ln p(o) ] - E_q(s|o,π)[ ln p(s|o) - ln q(s|π) ]

  But note:

      E_q(o,s|π)[ ln q(s|o,π) - ln q(s|π) ] = E_q(o|π)[ D_KL[ q(s|o,π) || q(s|π) ] ] = E_q(o|π)[ IG ]

  where IG is the information gain (reduction in belief entropy) that would result from observing o. So:

      EFE(π) = - E_q(o|π)[ ln p(o) ] - E_q(o|π)[ IG ] + ... (wait, this is not exactly matching)

  Actually, the decomposition that includes information gain is:

      EFE(π) = - E_q(o|π)[ ln p(o) ] + E_q(s|π)[ H[p(o|s)] ] 
                - E_q(o|π)[ D_KL[ q(s|o,π) || q(s|π) ] ]

  The last term is negative information gain (so minimizing EFE encourages information gain). 

  So active inference policies that minimize EFE will seek to maximize information gain (exploration) and maximize the fulfillment of prior preferences (exploitation). But note that the prior preferences p(o) are defined over outcomes, and the information gain is about the state.

  In the POMDP cost we described, we only have a penalty on belief entropy (which is a function of the current belief). However, in MPC, we are optimizing over a sequence of actions, and the belief entropy at future time steps is part of the cost. But note that minimizing the entropy of the future belief state is not the same as maximizing the expected reduction in belief entropy (which is what the information gain term captures).

  Therefore, the two formulations are not equivalent. The active inference EFE includes a term that encourages exploration (information gain) and a term that encourages exploitation (achieving preferred outcomes). The POMDP cost we described only has exploitation (target trajectory) and a penalty on current uncertainty (which might discourage going into states where the belief is uncertain, but without the exploration incentive).

  **What work is the variational framing doing?** 
  The variational framing unifies perception, learning, and action under a single objective: minimizing free energy (and its expected counterpart). This provides a principled way to derive update equations for perception (as inference) and action (as planning) from the same objective. It also provides a natural way to incorporate prior preferences (as part of the generative model) and to handle uncertainty. Moreover, the information gain term in EFE emerges naturally from the free energy principle, which is a key aspect of active inference that balances exploration and exploitation.

  ### Second Sub-question: The Role of Forward Simulation in Active Inference

  **Question:**
  In active inference, action is supposed to reduce prediction error by making the world match the prediction. But evaluating policies via expected free energy requires forward simulation of counterfactual futures. Doesn't that reintroduce a model-based planner? And what then remains of the idea that perception and action are two aspects of a single process?

  **Answer:**

  Indeed, active inference requires the evaluation of counterfactual futures (i.e., what would happen if I took a particular sequence of actions) to select the best policy. This is done by simulating future states and outcomes under each candidate policy and then computing the expected free energy for that policy. This is a model-based planning process.

  However, note that in active inference, the same generative model is used for perception and for action. Perception uses the model to infer the current state given observations, and action uses the model to predict future states and outcomes under different policies. So the model is shared.

  Moreover, the objective function (free energy minimization) is the same for both. Perception minimizes the current free energy (which is a bound on surprise) by adjusting beliefs. Action minimizes the expected free energy (which is a bound on expected surprise) by selecting actions. So they are two aspects of the same imperative: minimize free energy.

  The process of evaluating policies is indeed a forward simulation. But note that the active inference framework does not necessarily specify how this evaluation is done. It could be done by explicitly simulating trajectories (as in tree search) or by amortized methods (e.g., training a neural network to output the best policy). However, the key point is that the forward simulation uses the same generative model that is used for perception.

  Therefore, the framework does include a model-based planner. But the claim is that this planner is not an external addition: it is an inherent part of the free energy minimization process. The agent must consider future free energy to select actions that minimize it, and that requires looking ahead.

  **What remains of the single process?**
  The single process is the minimization of free energy, which manifests as perception (when we update beliefs) and as action (when we select policies that minimize expected free energy). The fact that we use forward simulation for planning does not break the unity because the same objective and model are used. Moreover, in some implementations, the planning and perception are interleaved: the agent continuously updates its beliefs and then re-plans.

  So, the active inference framework does not replace model-based planning; it provides a specific objective for planning (minimizing expected free energy) and integrates it with perception under the same objective.

  ### Third Sub-question: Precision Tuning and the Dark Room Problem

  **Question:**
  Can an agent reduce prediction error by lowering the precision (gain) assigned to sensory prediction errors? If so, why wouldn't the agent just turn down the gain and become comatose? How does active inference prevent this?

  **Answer:**

  Yes, in principle, an agent can reduce the weighted prediction error by reducing the precision (i.e., the weighting) of the prediction errors. This would make the prediction errors less costly. However, in active inference, the precision is not a free parameter that the agent can arbitrarily set. Instead, it is part of the generative model and is subject to inference.

  Specifically, the precision is modeled as a hyperparameter in the generative model (e.g., the variance of the observation noise). The agent then infers the precision along with the states. This is done by extending the generative model to include the precision and then performing variational inference over both the states and the precision.

  Therefore, the agent cannot arbitrarily set the precision to zero. It must adjust the precision in accordance with its prior beliefs about the precision and the sensory data. If the agent has a prior that the precision is high (i.e., that the sensory data are reliable), then it will require strong evidence (in the form of prediction errors) to lower the precision.

  Moreover, note that the free energy objective includes a complexity term (KL divergence between the posterior and prior). If the agent were to lower the precision without justification, it would incur a cost in terms of the divergence from the prior on precision.

  **The dark room problem:**
  The classic dark room problem is that an agent might prefer to stay in a dark room because it is predictable and thus minimizes surprise. However, active inference addresses this by incorporating prior preferences that are about outcomes (e.g., the agent prefers to see food, friends, etc.). So the agent will leave the dark room to seek preferred outcomes.

  In the case of precision, the worry is that the agent might lower the precision to avoid prediction errors. But note that the prior on precision matters. If the prior on precision is high, then the agent expects precise sensory data. If the agent lowers the precision, it will have a large divergence from the prior, which increases the free energy. Therefore, the agent will only lower the precision if the sensory data are so noisy that the prediction errors are large and the prior on precision is not too strong.

  Moreover, the expected free energy for action selection includes terms for achieving preferred outcomes. If the agent turns down the gain, it might not be able to achieve preferred outcomes (because it is ignoring the sensory data that would guide it to those outcomes). Therefore, the agent must balance the cost of high precision (large prediction errors) with the benefit of being able to achieve preferred outcomes.

  **What fixes the hyperpriors?**
  The hyperpriors (e.g., the prior on precision) are part of the generative model. They are either fixed by evolution, development, or learning. Learning can adjust these hyperpriors over longer timescales. But at a given moment, they are fixed and the agent must infer the precision accordingly.

  Therefore, the solution to the precision worry is that the agent cannot arbitrarily set precision to zero without violating its prior beliefs. The prior beliefs act as a regularizer.

  **Conclusion on this point:** 
  The active inference agent is not free to set precision arbitrarily. Precision is inferred, and the inference is constrained by prior beliefs. Moreover, the agent's prior preferences (for outcomes) will tend to drive it to engage with the world to achieve those outcomes, which requires maintaining sufficient precision to guide action.

  ### Summary

  1. **Equivalence:** The active inference EFE and the POMDP cost function you described are not equivalent. The EFE includes terms for prior preferences and ambiguity, and it naturally incorporates an exploration bonus (via information gain). The POMDP cost you described does not have an exploration bonus and has a different penalty (on belief entropy).

  2. **Forward simulation:** Active inference does require forward simulation for planning, but it uses the same generative model and objective function (free energy minimization) as perception. Therefore, perception and action are unified under a single imperative.

  3. **Precision tuning:** The agent cannot arbitrarily lower precision to avoid prediction errors because precision is part of the generative model and is subject to inference, which includes a prior. The prior on precision and the prior preferences for outcomes prevent the agent from becoming comatose.

  The active inference framework provides a unified account of perception, action, and learning under a single principle. The differences with classical optimal control are substantive: the objective function (free energy) is derived from first principles (minimizing surprise) and includes exploration naturally, and the goals are built into the model (as prior preferences) rather than being an externally supplied cost function.
answer: |-
  ### Detailed Comparison of Active Inference and Classical Optimal Control

  Your questions cut to the heart of active inference's (AIF) claims. Below, I address each sub-question with formal comparisons, plain-English explanations, and an assessment of whether the differences are substantive or relabeling.

  ---

  #### **First Sub-question: Equivalence with POMDP + Entropy Penalty**  
  **Formal Setup**  
  - **Classical POMDP (Model Predictive Control):**  
    Cost for policy \(\pi\) over future horizon \(T\):  
    \[
    \mathcal{C}(\pi) = \mathbb{E}_{q(o_{1:T}, s_{1:T}|\pi)} \left[ \sum_{t=1}^T \left( \underbrace{\text{cost}(o_t, t)}_{\text{target deviation}} + \lambda \cdot \underbrace{H[q(s_t|\pi)]}_{\text{belief entropy}} \right) \right]
    \]  
    - \(\text{cost}(o_t, t)\): External cost (e.g., quadratic deviation from target trajectory).  
    - \(H[q(s_t|\pi)]\): Entropy of belief state \(q(s_t|\pi)\).  
    - \(\lambda\): Trade-off parameter.  

  - **Active Inference (Expected Free Energy):**  
    Expected Free Energy (EFE) for policy \(\pi\):  
    \[
    G(\pi) = \mathbb{E}_{q(o_{1:T}, s_{1:T}|\pi)} \left[ \sum_{t=1}^T \underbrace{\ln \frac{q(s_t|\pi)}{p(o_t, s_t|\pi)}}_{\text{EFE decomposition}} \right]
    \]  
    Decomposed into:  
    \[
    G(\pi) = \underbrace{\mathbb{E}[\ln q(s_t|\pi) - \ln p(s_t)]}_{\text{State complexity}} + \underbrace{\mathbb{E}[-\ln p(o_t|s_t)]}_{\text{Ambiguity}} + \underbrace{\mathbb{E}[-\ln p(o_t)]}_{\text{Preference divergence}}
    \]  
    - \(p(o_t)\): **Prior preference** (goal as part of the generative model).  
    - Ambiguity: \(H[p(o_t|s_t)]\) (outcome uncertainty given state).  
    - Complexity: \(D_{\text{KL}}[q(s_t|\pi) \parallel p(s_t)]\) (deviation from state prior).  

  **Key Differences**:  
  1. **Cost vs. Preference Internalization**:  
     - In POMDP, \(\text{cost}(o_t, t)\) is **external** (e.g., programmer-defined).  
     - In AIF, \(-\ln p(o_t)\) is **internal** (prior preference \(p(o_t)\) is part of the generative model).  
     This is **relabeling** without substantive difference *if* \(p(o_t)\) is set to \(\exp(-\text{cost}(o_t, t))\).  

  2. **Entropy Term**:  
     - POMDP penalty: \(H[q(s_t|\pi)]\) (uncertainty in **belief**).  
     - AIF penalty: \(H[p(o_t|s_t)]\) (uncertainty in **outcomes given state**).  
     These are **formally distinct**:  
     - \(H[q(s_t|\pi)]\) measures ignorance about hidden states.  
     - \(H[p(o_t|s_t)]\) measures noise in the observation process (fixed by environment).  
     *Example*: In a foggy environment, \(H[p(o_t|s_t)]\) is high, but \(H[q(s_t|\pi)]\) could be low if the agent is confident despite fog.  

  3. **Exploration Incentive**:  
     - AIF includes an **implicit information gain** term (from EFE decomposition):  
       \[
       \text{InfoGain} = \mathbb{E}_{q(o_t|\pi)} \left[ D_{\text{KL}}[q(s_t|o_t, \pi) \parallel q(s_t|\pi)] \right]
       \]  
       This encourages actions that reduce uncertainty (e.g., exploring to learn).  
     - Your POMDP cost **lacks this term**. Adding it would require explicit bonuses (e.g., in POMDPs, this is handcrafted as \(\lambda_2 \cdot \text{InfoGain}\)).  

  **Conclusion**:  
  - **Not Equivalent**: AIF’s EFE includes ambiguity (sensory noise) and information gain, while your POMDP cost uses belief entropy.  
  - **Substantive Difference**: AIF naturally balances **exploration** (information gain) and **exploitation** (preference satisfaction) via EFE. In POMDPs, exploration must be added ad hoc.  
  - **What AIF Framing Buys**: A unified objective that *automatically* incorporates adaptive exploration without extra terms.  

  ---

  #### **Second Sub-question: Forward Simulation vs. "Single Process"**  
  **The Tension**:  
  - AIF claims action and perception are "two sides of the same coin" (both minimize free energy).  
  - Yet policy selection via EFE requires **forward simulation** of counterfactual futures (policies not currently executed).  

  **Resolution**:  
  1. **Forward Simulation is Unavoidable**:  
     Yes, evaluating \(G(\pi)\) requires:  
     \[
     q(o_{1:T}, s_{1:T}|\pi) = \text{forward-simulate}(p(o_t|s_t), p(s_t|s_{t-1}, a_t), q(s_0))
     \]  
     This is **model-based planning** (like POMDP solvers). AIF does not replace this; it specifies *how* policies are scored (via EFE).  

  2. **Perception-Action Unity**:  
     - **Perception** (inference): Minimizes *current* free energy to update beliefs \(q(s_t)\):  
       \[
       q^*(s_t) = \arg\min_q F(q, o_t)
       \]  
     - **Action** (planning): Minimizes *expected future* free energy \(G(\pi)\) to choose actions.  
     Both use:  
     - The **same generative model** \(p(o, s)\).  
     - The **same variational principle** (minimize bound on surprise).  
     *This is the "single process"*: Perception solves for \(q(s)\) given \(o\); action solves for \(\pi\) given \(q(s)\).  

  **What Remains of the Claim**:  
  - **Substantive Unity**: Unlike optimal control (where cost is arbitrary), AIF uses **one optimization target** (free energy) for both.  
  - **Architectural Difference**: Optimal control separates "state estimator" and "controller"; AIF derives both from one objective.  
  - **Empirical Payoff**: AIF predicts neural circuits implement variational inference (e.g., predictive coding), which is testable (e.g., fMRI studies show prediction error minimization in perception *and* action).  

  ---

  #### **Third Sub-question: Precision Tuning and the Comatose Agent**  
  **The Problem**:  
  An agent could minimize free energy by:  
  1. Acting to change sensations (active).  
  2. Updating beliefs (perceptual inference).  
  3. **Lowering precision** \(\pi\) (gain) on prediction errors:  
     \[
     \text{Weighted prediction error} = \pi \cdot (o_t - \mathbb{E}[o_t])
     \]  
     If \(\pi \to 0\), prediction errors are ignored → agent becomes "comatose".  

  **Why AIF Avoids This**:  
  1. **Precision as Inference**:  
     - Precision \(\pi\) (inverse variance of observation noise) is **part of the generative model**:  
       \[
       p(o_t|s_t, \pi) = \mathcal{N}(o_t; g(s_t), \pi^{-1})
       \]  
     - The agent infers \(\pi\) (as a hyperparameter) via **hierarchical Bayesian inference**:  
       \[
       q^*(\pi) = \arg\min_q F(q, o_t)
       \]  
       This requires explaining away prediction errors: high errors *could* imply low \(\pi\), but also surprising states.  

  2. **Priors Constrain Precision**:  
     - A **prior** \(p(\pi)\) (e.g., high precision expected) penalizes implausible \(\pi\):  
       \[
       F \supset D_{\text{KL}}[q(\pi) \parallel p(\pi)]
       \]  
       *Example*: A "healthy" agent has a prior favoring moderate-to-high precision (evolutionarily tuned for engagement).  

  3. **Dark Room Revisited**:  
     - In the dark room:  
       - Low \(H[p(o_t|s_t)]\) (predictable sensations).  
       - But high \(D_{\text{KL}}[q(o_t|\pi) \parallel p(o_t)]\) if \(p(o_t)\) prefers novelty (e.g., food, social cues).  
     - **Turning down precision** *increases* \(D_{\text{KL}}\) (preferences not met) → not optimal.  

  **Hyperparameter Priors as the Foundation**:  
  - **Yes**, priors on hyperparameters (like \(p(\pi)\)) are essential. They are:  
    - **Learned** (e.g., via meta-Bayesian updating).  
    - **Evolved** (e.g., agents with comatose-tendencies outcompeted).  
  - But this is **not circular**: It pushes explanation to **evolution, development, or learning** (e.g., "Why do we have a prior for engagement?").  
  - **Empirical Test**: Agents with mismatched priors (e.g., low \(p(\pi)\)) show pathologies (apathy in depression; catatonia).  

  ---

  ### Summary: What AIF Framing Buys  
  1. **Substantive Differences**:  
     - **Unified exploration-exploitation** (EFE’s information gain).  
     - **Perception-action integration** under one objective (testable in neuroscience).  
     - **Precision inference** prevents comatose solutions (via adaptive gain control).  

  2. **Relabeling with Benefits**:  
     - "Cost" → "Prior preference" is relabeling, but **internalizing goals** into the model:  
       - Enables self-consistent Bayesian updates.  
       - Explains why goals feel "intrinsic" (e.g., homeostasis as a prior).  

  3. **Key Innovations**:  
     - Derives *all* adaptive processes (perception, action, learning) from **one imperative**.  
     - Provides a **process theory** (e.g., predictive coding) for neurobiological implementation.  

  **Recommendation for Your Term Paper**:  
  - Argue that AIF is **not just relabeling**—it’s a shift from externally specified costs to internally generated preferences, with testable neural and behavioral consequences. Use the precision and exploration issues as case studies.
