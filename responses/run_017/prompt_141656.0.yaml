  Below is a one-page decision tree addressing your requirements. It uses concrete cases to guide newcomers through the logical space of positions on contradictions, avoiding philosophical jargon where possible. The tree starts from practical cases you provided and incorporates finer distinctions. I've flagged unsettled/contested issues, highlighted non-diagnostic questions, and noted where labels are approximate.

  ---

  ### **Decision Tree: Navigating Contradictions**  
  *Start with Question 1. Answer based on concrete cases, not abstract principles.*

  #### **Question 1 (Explosion Test)**  
  *In your client databases, if you temporarily accept both conflicting addresses (X and Y) as true, must you conclude the client owes a million pounds?*  
  - **A. Yes** → Go to Q2 (Classical logic rules force arbitrary conclusions).  
  - **B. No** → Go to Q3 (Logic blocks "spread" to unrelated claims).  

  #### **Question 2 (Belief Revision)**  
  *When your report contains a sentence you know is wrong (but you stand behind each individually), do you:*  
  - **A. MUST find and remove the error** → **Classical + Belief Revision** (Contradictions = fatal flaws; revise beliefs).  
  - **B. Can keep all sentences while investigating** → *Invalid path* (Classical logic forbids this; no position here).  

  #### **Question 3 (True Contradictions?)**  
  *Is the liar sentence ("This sentence is false") BOTH true and false?*  
  - **A. Yes** → Go to Q4 (Accepts true contradictions).  
  - **B. No** → Go to Q5 (Rejects true contradictions).  

  #### **Question 4 (Trivialism Threat)**  
  *If one true contradiction exists (e.g., a vague "bald/not-bald" man), must EVERY claim (e.g., "1=0") be true?*  
  - **A. Yes** → **Trivialism** (One contradiction → everything true; absurd, no one holds this).  
  - **B. No** → **Dialetheism** (Some contradictions true; use paraconsistent logic to contain them).  

  #### **Question 5 (Gap or Just False?)**  
  *The liar sentence is:*  
  - **A. NEITHER true nor false** → Go to Q6 (Truth-value "gap").  
  - **B. FALSE (or flawed) but doesn’t explode** → Go to Q7 (Logic blocks explosion without gaps).  

  #### **Question 6 (Vagueness/Change Cases)**  
  *At the instant a lamp switches off→on, is it:*  
  - **A. BOTH off and on** → *Invalid path* (Requires true contradictions; but Q3B rejected this).  
  - **B. NEITHER off nor on** → **Paraconsistency (Gap View)** (Contradictions = undefined/meaningless; avoid assigning truth).  
  - **C. EITHER off or on (we can’t specify)** → *Invalid path* (Implies classical resolution; conflicts with Q1B).  

  #### **Question 7 (Relevance Test)**  
  *If a contradiction arises about a seating plan, does it infect conclusions about the club’s budget?*  
  - **A. Yes** → **Paraconsistency (Non-Relevance)** (Contradictions risk widespread untrustworthiness; isolate cautiously).  
  - **B. No** → **Paraconsistency (Relevance-Based)** (Contradictions only spread within relevant topics; budget is safe).  

  ---

  ### **Key to Leaves (Named Positions)**  
  1. **Classical + Belief Revision**:  
     - *Client DBs*: Resolve conflicts immediately (e.g., flag/reject one address).  
  2. **Dialetheism**:  
     - *Client DBs*: Both addresses might correctly describe reality (e.g., overlapping realities); use paraconsistent logic, but investigate.  
  3. **Paraconsistency (Gap View)**:  
     - *Client DBs*: Mark address as "undefined"; don’t use it in critical decisions, but other data (e.g., debt) is safe.  
  4. **Paraconsistency (Non-Relevance)**:  
     - *Client DBs*: Address conflict might indirectly taint other fields (e.g., debt); audit everything.  
  5. **Paraconsistency (Relevance-Based)**:  
     - *Client DBs*: Address conflict doesn’t affect debt calculations; use topic-secure reasoning.  
  6. **Trivialism**:  
     - *Client DBs*: All conclusions are true (e.g., client owes $1M); absurd, not held.  

  ---

  ### **Diagnostic Notes**  
  - **Non-Diagnostic Questions** (All positions agree):  
    - *Club constitution*: No position allows arbitrary conclusions (e.g., skipping subscriptions) from one contradiction.  
    - *Two promises*: All agree you must act (e.g., negotiate, prioritize); contradictions don’t nullify obligations.  
  - **Unseparated Leaves**:  
    - The tree *cannot* split "Relevance-Based" vs. "Non-Relevance" paraconsistency cleanly. Use two extra questions:  
      1. *"If two claims are individually acceptable, is their conjunction (A and B) automatically acceptable?"*  
