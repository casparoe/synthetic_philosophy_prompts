      2. *"Does the claim 'some contradictions are true' risk being both true and false?"*  
         - Yes → Dialetheism; No → Paraconsistency.  
  - **Unsettled vs. Contested**:  
    - **Settled/Uncontroversial**:  
      - Classical logic *does* entail explosion (if A and ¬A, then B for any B).  
      - Paraconsistent logics *are* used in computer science (e.g., databases, AI) for inconsistency management.  
    - **Contested**:  
      - Whether true contradictions exist (Dialetheism vs. others).  
      - Whether paraconsistent logic is the "correct" logic or just a pragmatic tool.  
  - **Approximate Labels**:  
    - "Non-Relevance Paraconsistency" is fuzzy (could include *preservationist* or *non-adjunctive* logics).  
    - "Gap View" may align with *supervaluationism* or *partial logic*.  

  ---

  ### **Practical Takeaways**  
  - **Your client databases**: The tree clarifies whether to resolve (Classical), isolate (Paraconsistency), or accept (Dialetheism) conflicts.  
  - **Reading group focus**: Prioritize Q1 (Explosion) and Q3 (True Contradictions)—they define the major splits.  

