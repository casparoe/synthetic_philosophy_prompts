  **Appendix J: Merit Review and Personnel Procedures (Metaphysical Compliance Addendum)**  
  *Effective August 1, 20XX; Revised per Senate Resolution 7.45*

  **J.1 General Principles of Causal Attribution in Personnel Actions**

  1.1  All personnel evaluations, determinations of merit, assignments of credit or blame, and assessments of intent shall be conducted pursuant to the principle of singular sufficient causal history.  
  1.2  For any event or outcome relevant to personnel decisions (hereinafter "Outcome O"), the Personnel Committee (hereinafter "Committee") shall identify and document the complete, sufficient physical event sequence causally sufficient for O. This sequence shall be termed the *Physical Event Sequence Report* (PESR).  
  1.3  Descriptions of mental states (e.g., beliefs, desires, intentions, reasons) associated with any agent involved in producing O are acknowledged as descriptive patterns supervenient upon the PESR. Such descriptions shall be recorded separately in the *Mental State Acknowledgment* (MSA) form. The MSA provides no independent causal contribution to O assessment.  
  1.4  Systematic overdetermination of O by both the PESR and any supervenient mental description is hereby excluded as a valid basis for evaluation. Credit or blame accrues solely to the PESR.

  **J.2 Annual Merit Raises & Performance Review**

  2.1  Faculty members seeking merit consideration shall submit Form PESR-7 ("Physical Contribution Ledger") detailing the physical event sequences underlying claimed outcomes (e.g., publication submissions, student credit hours generated, keystrokes logged on university servers, laboratory apparatus manipulations).  
  2.2  Quantification of Contribution:  
      a) Each discrete physical event sequence listed in the PESR-7 shall be assigned a point value based on its measurable energy expenditure and spatiotemporal coordinates relative to Outcome O (e.g., manuscript acceptance).  
      b) Point values are non-additive for redescriptions of the same physical sequence under mental-state terminology (e.g., "desire to publish," "belief in the argument"). Listing such redescriptions in the optional MSA-A (Annual) supplement does not increase point totals.  
      c) The cumulative PESR point total determines merit raise eligibility per the standard salary matrix. MSA-A submissions exceeding one (1) page shall be returned unread.  
  2.3  *Dissenting Procedure (Overdetermination Minority):* Faculty endorsing systematic overdetermination may check Box 12.3 on PESR-7. This triggers submission of Form OV-1 ("Dual Causation Certification"), requiring duplication of the PESR narrative under the heading "Intentional Contribution." Points listed in OV-1 are automatically deducted from the final PESR total to prevent double-counting of the Outcome O. OV-1 submissions are filed separately under "Redundant Causation Archives."

  **J.3 Letters of Recommendation**

  3.1  Letters of recommendation (Internal Form LOR-P, External Form LOR-E) are recognized as physical artifacts (ink patterns on paper, pixel configurations on screen) generated by the letter-writer's PESR.  
  3.2  The causal weight of an LOR in personnel decisions (e.g., hiring, promotion) derives solely from:  
      a) The measurable reputation-point value of the letter-writer's institution (per Tier-Index Table 4B).  
      b) The word count of the letter, adjusted for font size and line spacing (Standardized Page Equivalents - SPE).  
  3.3  *Intentional Content Disclaimer:* Prose describing the candidate's mental states (e.g., "Dr. Smith is deeply committed," "shows exceptional insight") constitutes an MSA-L appended to the LOR. The Committee shall disregard MSA-L content for causal assessment. LOR impact is calculated solely via 3.2(a-b).  
  3.4  *Letter-Writer Certification Requirement:* To mitigate the causal irrelevance of the letter-writer's *own* mental states, all LORs must include Form CERT-9 ("Physical Basis Affidavit"), signed by the writer, attesting that the letter resulted from a physical event sequence within their nervous system sufficient to produce the observed text, irrespective of their beliefs about the candidate. Failure to include CERT-9 renders the LOR inadmissible.

  **J.4 Academic Integrity Investigations & Determination of Intent**

  4.1  In cases of alleged academic misconduct (e.g., plagiarism), the Committee's sole task is to establish the physical event sequence resulting in the submitted work (e.g., source text matching algorithms, timestamped file transfers, keyboard input logs). This constitutes the PESR-I (Integrity).  
  4.2  Determination of "Intent to Deceive" or "Knowledge":  
      a) Mental states such as intent or knowledge are not causally efficacious components of the PESR-I and cannot be empirically isolated from the physical sequence.  
      b) The Committee shall utilize Form MSI-5 ("Mental State Inference - Checkbox"). The relevant faculty member must select one (1) box from the following options:  
          *   [ ] The physical sequence suggests pattern P1 (commonly labeled 'intentional')  
          *   [ ] The physical sequence suggests pattern P2 (commonly labeled 'negligent')  
          *   [ ] The physical sequence suggests pattern P3 (commonly labeled 'accidental')  
          *   [ ] Insufficient physical trace data (Specify: _________)  
      c) The selected box on MSI-5 is a non-causal descriptor appended to the PESR-I. Sanctions (if any) are determined solely by the properties of the PESR-I (e.g., extent of text duplication, breach of digital access protocols). The MSI-5 selection does not alter sanction severity.  
  4.3  Faculty charged with misconduct must sign Line 17 of the PESR-I, confirming the physical sequence's accuracy. Refusal to sign constitutes a separate physical event (hand motion abstention) recorded on Form NCS-2 ("Non-Compliance Sequence").

  **J.5 Committee Deliberation Protocol**

  5.1  Committee meetings are scheduled physical events occurring in Room B307. Attendance is recorded via biometric scanner (PESR-C1).  
  5.2  Deliberative discourse (sound waves emitted by members) is acknowledged as supervenient upon the members' concurrent neurophysiological states (PESR-C2).  
  5.3  The Committee's final decision (e.g., raise allocation, hire recommendation, sanction) is the product of a sufficient physical event sequence (PESR-C3) terminating in a vote tally (physical button presses) or signature on Form DEC-10.  
  5.4  *Rationale Documentation:* Discussion minutes, recording arguments and reasons cited, shall be compiled on Form MSA-D (Deliberation). The MSA-D is filed as a courtesy notation in the "Supervenient Record" subfolder. The causal sufficiency of the outcome resides entirely in PESR-C3. The MSA-D provides no explanatory power regarding why PESR-C3 occurred as it did and is not subject to appeal based on its content.  
  5.5  *Certification of Committee Physical Causation:* Prior to adjournment, the Chair shall sign Form CERT-C ("Committee Causation Affidavit"), affirming that the recorded PESR-C1, PESR-C2, and PESR-C3 constitute the sufficient physical history for the decision outcome, and that the contents of the MSA-D played no causal role.

  **J.6 Implementation & Compliance**

  6.1  All personnel files must maintain strict separation: PESR documentation (primary causal record) in Blue Folders; MSA documentation (descriptive overlay) in Beige Folders. Comingling is a Category 3 Compliance Violation.  
  6.2  The Office of Metaphysical Compliance (OMC) shall conduct annual audits to ensure:  
      a) No points awarded in merit reviews derive from MSA descriptions.  
      b) No sanctions in integrity cases are enhanced based on MSI-5 selections.  
      c) CERT forms are properly executed and filed.  
  6.3  Appeals based on the perceived "unfairness" of attributing outcomes solely to physical sequences, or the perceived significance of mental states, shall be directed to the OMC and will be reviewed solely for procedural adherence to this Appendix, not substantive metaphysical dispute.

  ---
  *Reviewed and Certified as Metaphysically Compliant by the Office of the Provost and the University Committee on Ontological Parsimony (UCOP). Forms available on Intranet Portal > Policy Hub > Appendix J Resources. OMC Helpdesk: omc_help@stateuniv.edu // Ext. 7455.*
