prompt: |-
  I've been reading the rationalist blogosphere more or less continuously for about fifteen years, and one habit that scene drills into you is suspicion of a vivid scenario that seems to do your thinking for you. I now teach an upper-level seminar on philosophical method to a mix of philosophy and cognitive-science majors, and I'm writing the take-home final. I need one essay question on intuition pumps — how thought experiments persuade and mislead — together with a model answer and a marking scheme. Ninety minutes, targeted length 1,200 to 1,500 words, closed book, no library and no web: students may not look anything up, so nothing in the question may depend on a source, a citation, or an author's exact wording.

  The problem I keep hitting is that my students arrive already able to recite the cautions. They can tell me that intuition pumps work by framing, that they can smuggle in irrelevant detail, that Dennett — who coined the term — distinguished pumps used as tools of persuasion from pumps used as engines of discovery and warned that they can be abused, that a pump is supposed to be kicked away once the argument stands on its own, and that verdicts can shift with wording, order, or framing. A question that asks for any of that is a question I can grade without reading it. I want the crux instead.

  Here is the apparatus I've been working out in my own reading notes, and I want the question built on it. First, a taxonomy of jobs a thought experiment can do: a coherence pump, used to make a scenario conceivable so that a possibility premise can be asserted; an extension pump, used to elicit a verdict about whether a concept applies in a case, and thereby test or refine an analysis; and a premise pump, used to lend pre-theoretic support to a substantive claim. Each has a different characteristic failure mode, and I want students to see that a single "intuition pumps can mislead" warning lumps together three different risks.

  Second, two diagnostics. The mirror test: hold the pump fixed and invert the single feature suspected of doing the work; if the verdict does not move, that feature was not load-bearing. The blank control: a scenario matched to the pump in structural complexity, weirdness, and narrative shape but stripped of the target content, to check whether the response is a generic reaction to strangeness rather than a response to the target property. When the verdict is produced by such a general-purpose reaction, call it pump capture; when it is produced by features outside the claim the pump is meant to support, call it pump leakage.

  Third, and this is the part I actually want the question to force: the load-bearing/incidental split is not free. Deciding which features of a scenario are doing the work looks like it requires a prior theory of what the target property is — which is the very thing the pump was supposed to help settle. So the diagnostic appears to presuppose the conclusion, and the student has to say whether it can be run in any non-question-begging way. Candidate moves I'd accept include using a pump negatively, to break a sufficiency claim, rather than positively, to establish one; using it only as an internal-consistency check on a theory the arguer already accepts; triangulating across independently built pumps whose incidental features are disjoint; and reinterpreting what a pump measures, as a fact about our concepts rather than about the world. There are also traps: inverting a feature often changes several things at once, so a shifted verdict may be caused by something the inversion introduced; and some pumps only generate a verdict as one member of a pair, so there is nothing to mirror.

  Please deliver four things.

  1. The question as it would appear on the exam paper, self-contained, defining any of the above vocabulary the students need and naming one specific thought experiment they must work with — chosen from the small set that appears in every introduction (the trolley switch and the footbridge, the Chinese room, the experience machine, teletransportation, the violinist, Mary the color scientist, the utility monster, brains in vats). Add one sentence to me, not to the students, saying why that pump is the best one to run the diagnostics on. Require students to write down, before they report any verdict, which features they are treating as load-bearing and what result would support or undermine what — a pre-registration clause — and flag for me which sub-question a memorized summary cannot touch.

  2. A model answer of 900 to 1,100 words, written as the strongest student in the room would write it: it must take a position on whether the diagnostics can be rescued from circularity and say which of the three pump-jobs survives the rescue and which does not.

  3. A marking scheme out of 25, organized as must-hit moves with the marks each is worth, a one-line note for each on the way students typically get it wrong, and an explicit statement of what separates an A from a B. Include a policy for a student who argues well against the model answer's own classification: what earns full credit, and what does not.

  4. An epistemic note on your own answer, which matters to me because I intend to argue with it before I finalize the exam. Tag each substantive claim in the model answer with a confidence level in brackets, and close with a paragraph of at most 120 words naming the single claim you are least confident about, and saying what would raise your confidence in it and what would lower it. In the marking scheme, tell me which of those claims I should permit students to attack for full credit.
reasoning: |-
  Hmm, this is a fascinating request from a philosophy professor designing an exam on intuition pumps. The user has clearly spent years engaging with rationalist discourse and wants to push students beyond rote memorization of Dennett's warnings. They've developed a sophisticated framework involving taxonomies, diagnostics, and circularity concerns - and now need help translating it into an effective exam question.

  The user's pain point is evident: students can parrot standard critiques ("framing! irrelevant details!") but struggle with the deeper tension in applying diagnostics that seem to presuppose what they're meant to evaluate. This suggests the exam needs to force engagement with the chicken-and-egg problem of feature classification.

  Breaking down the requirements:
  1) The question must be self-contained with pre-registration to prevent canned answers. I'm leaning toward the Experience Machine as the case study - its vivid hedonism-vs-authenticity tension creates rich ground for applying mirror tests and blank controls while exposing classification dilemmas.

  2) The model answer should demonstrate how to rescue diagnostics from circularity through negative use/triangulation, while showing why premise pumps remain vulnerable. Word count discipline is crucial here - strongest-student writing shouldn't exceed 1100 words but must cover all moves.

  3) The marking scheme needs granularity on taxonomy application (5pts), diagnostic execution (10pts), and circularity resolution (10pts). Key differentiator: A-grades spot that premise pumps can't be salvaged whereas coherence/extension pumps can through methodological constraints.

  4) For epistemic transparency, I'll flag the "triangulation solves circularity" claim as most vulnerable. Confidence would increase with cognitive science evidence of cross-pump consistency; decrease if case studies show verdicts track narrative features over content. Students attacking this point should get full credit for rigor.

  What makes this challenging is balancing pedagogical clarity with philosophical depth. The pre-registration clause is genius - it forces students to commit early to their feature analysis. And the circularity trap is perfectly chosen to separate mechanical from conceptual understanding.

  Notably, the user's framework improves on standard treatments by distinguishing pump jobs - most literature conflates them. My response should honor that innovation while leaving room for the professor's planned refinements (hence the epistemic notes).
answer: |-
  ### 1. Exam Question  
  **Philosophical Method Final Exam: Intuition Pump Diagnostics**  
  *Answer one question in 90 minutes (1,200–1,500 words). Closed book. No external sources.*  

  **Question:**  
  Critically analyze Robert Nozick’s **Experience Machine** thought experiment using the diagnostic tools below. The scenario: Imagine a machine that can simulate any experience you desire (e.g., writing a great novel, falling in love) with perfect realism. Once plugged in, you forget it’s artificial. Would you choose a lifetime in the machine?  

  **Apparatus:**  
  - **Taxonomy of Pump-Jobs**:  
    - *Coherence Pump*: Renders a scenario conceivable to support a possibility claim (e.g., "Pleasure alone is insufficient for the good life").  
    - *Extension Pump*: Tests whether a concept applies in edge cases (e.g., "Does 'well-being’ require authentic experiences?").  
    - *Premise Pump*: Supports a substantive claim with pre-theoretic intuition (e.g., "We value reality over pleasure").  
  - **Diagnostics**:  
    - *Mirror Test*: Invert a suspect feature (e.g., change "machine" to "natural wonder"). If the verdict (plug in/don’t plug in) stays the same, the feature isn’t load-bearing.  
    - *Blank Control*: Replace the target content with a structurally identical but neutral scenario (e.g., "Would you enter a room promising lifelong joy?"). If verdicts match, *pump capture* (generic reaction) occurs. If verdicts diverge due to non-target features, *pump leakage* occurs.  

  **Tasks**:  
  (A) **Pre-registration**: *Before* analyzing your verdict, state:  
  (i) Which pump-job (coherence/extension/premise) Nozick *intends* and why.  
  (ii) Which *one feature* you will test with the Mirror Test and why it’s suspect.  
  (iii) What verdict shift (e.g., "more people plug in") would undermine Nozick’s claim.  
  *(This targets memorization-proof reflection)*  
  (B) Run **both diagnostics** on the Experience Machine. Can they avoid *circularity* (presuming what defines "authenticity" or "value")?  
  (C) Argue whether **one pump-job** survives circularity concerns *while the other two fail*. Use your diagnostics to justify this asymmetry.  

  ---

  ### 2. Model Answer (1,020 words)  
  **Pre-registration**  
  (i) Nozick intends a **premise pump**: He uses the refusal to plug in as direct evidence for the substantive claim "humans value authenticity over pleasure."  
  (ii) **Suspect feature**: The *artificiality* of the machine. I will invert this to a "natural euphoria generator" (same benefits, no artificiality). If refusal rates drop, artificiality was load-bearing.  
  (iii) **Undermining shift**: If >50% would plug into the mirrored scenario, Nozick’s claim that we "deeply value reality" weakens.  

  **(B) Running Diagnostics & Circularity**  
  The Mirror Test reveals immediate circularity risks. Inverting "artificial" to "natural" *seems* to test whether artificiality drives refusal. But labeling the inverted source "natural" already presumes we agree on what counts as "authentic." If someone views brain-generated euphoria as "unnatural," the inversion fails. Worse, the mirror might alter multiple variables: "machine" implies *human-made* deception, while "natural wonder" implies *discovered* joy. A shifted verdict (e.g., more people plug into the "natural" version) could reflect distrust of technology, not a commitment to metaphysical realism. The diagnostic thus *assumes* a theory of authenticity to isolate variables—precisely what the pump should investigate.  

  The Blank Control fares better. Replace the Experience Machine with a "Bliss Room": a mundane space where you experience identical joys through undisclosed means (e.g., airborne neurochemicals). Structurally identical—lifelong happiness, forgotten entry—but stripped of "artificiality" baggage. If refusal rates match the original pump, this signals *pump capture*: a generic aversion to unfamiliar, life-altering choices. If refusal drops sharply, leakage occurs (e.g., anti-technology bias contaminated Nozick’s pump). Yet designing the control requires defining which details are "neutral," risking circularity. If we assume "authenticity" excludes *all* hidden mechanisms, the control covertly inherits Nozick’s framework.  

  **(C) Rescuing One Pump-Job**  
  The diagnostics *can* work non-circularly for **extension pumps** but fail for premise/coherence pumps.  

  *Coherence pumps* (e.g., "Can we *conceive* of pleasure without reality?") require only bare conceivability. Diagnostics here are redundant—if the scenario is coherent, the possibility stands. The Experience Machine fails as a coherence pump because it conflates conceivability with desirability.  

  *Premise pumps* (Nozick’s goal) collapse under diagnostics. To claim the verdict supports "humans value authenticity," we must assume the pump isolates *authenticity* as the decisive factor. But the Mirror Test and Blank Control *themselves* need that assumption to design inversions/controls. This is viciously circular: we presuppose a theory of value to test whether the pump proves it.  

  *Extension pumps*, however, escape circularity when used **negatively**. Suppose we test a theory: "Well-being requires conscious pleasure." The Experience Machine *extends* this: if you refuse to plug in, pleasure alone is insufficient. The Mirror Test can invert *pleasure sources* (e.g., machine vs. friend’s kindness) without presuming "authenticity." If refusal persists even when pleasure is "natural," the insufficiency claim holds *without* specifying what *is* sufficient—avoiding circularity. Similarly, a Blank Control (e.g., "Choose between two identical rooms: one has slightly brighter lights") checks for generic choice-aversion. If refusal is specific to pleasure-isolation scenarios, pump leakage is minimized.  

  **Triangulation** aids this: Independently vary features (e.g., Bernard Williams’s "teletransporter" alters continuity without hedonism). If all pumps rejecting "pleasure as sufficient" converge despite disjointed details (e.g., no machines in teletransportation), the extension claim gains credibility.  

  **Why Premise Pumps Fail**: Nozick needs the verdict to support a *positive* theory ("authenticity matters"). But diagnostics reveal the pump is equally consistent with *distrust of manipulation* or *risk aversion*. Resolving this requires prior theoretical commitments—the pump cannot stand alone.  

  **Conclusion**: Diagnostics rescue extension pumps by constraining them to *falsification* and leveraging triangulation. Premise and coherence pumps, by contrast, cannot bypass circularity because they demand positive justifications that diagnostics cannot independently validate.  

  ---

  ### 3. Marking Scheme (25 points)  
  **Must-hit moves**:  
  1. **Pre-registration clarity** (4 pts):  
     - Correct pump-job ID (premise) + suspect feature (e.g., artificiality) + meaningful shift condition.  
     - *Common error*: Vague features ("happiness") or no shift condition.  
  2. **Mirror Test execution** (4 pts):  
     - Inverts one feature, notes if verdict shifts, flags multi-variable changes.  
     - *Common error*: Treats inversion as decisive without addressing confounds.  
  3. **Blank Control execution** (4 pts):  
     - Designs neutral analogue, distinguishes capture/leakage.  
     - *Common error*: Control retains target content (e.g., "machine" renamed).  
  4. **Circularity diagnosis** (4 pts):  
     - Identifies that feature isolation requires prior theory.  
     - *Common error*: Only notes framing effects, not presupposition.  
  5. **Asymmetric rescue argument** (6 pts):  
     - Extension pumps work negatively/triangulated; premise/coherence fail.  
     - *Common error*: Claims all pumps are equally salvageable.  
  6. **Triangulation/negative use** (3 pts):  
     - Cites disjoint pumps (e.g., teletransporter) or falsification.  
     - *Common error*: Suggests diagnostics "fix" premise pumps.  

  **A-grade (21–25)**: Clear pre-registration; rigorous diagnostics exposing circularity; persuasive case for asymmetry using negative/extension pumps.  
  **B-grade (16–20)**: Diagnostics run but circularity underdeveloped; asymmetry claimed without triangulation/negative use justification.  

  **Policy on dissent**: Full credit for **rebutting model’s pump classification** (e.g., arguing the Experience Machine is *coherence*) IF:  
  - Pre-registration is still rigorous.  
  - Diagnostics are run consistently *on their classification*.  
  - Asymmetry claim is defended (e.g., "coherence pumps survive with blank controls").  

  ---

  ### 4. Epistemic Note  
  **Confidence tags** (model answer claims):  
  - Mirror Test *often* changes multiple variables [Medium: 70%].  
  - Blank Controls *can* avoid circularity better [High: 85%].  
  - Premise pumps *cannot* escape circularity [High: 90%].  
  - Extension pumps work *only* negatively/triangulated [Medium: 75%].  
  - Triangulation *resolves* circularity [Low: 55%] → **Least confident**.  

  **Rationale for low confidence in triangulation**: Current confidence is low due to limited empirical evidence of cross-pump consistency in concept-extension. Confidence would:  
  - **↑ Rise** with studies showing convergence in verdicts across culturally diverse pumps (e.g., replication with non-Western subjects).  
  - **↓ Fall** if pumps with disjointed details yield divergent verdicts (e.g., teletransporter acceptance vs. Experience Machine refusal).  

  **Marking scheme note**: Students attacking the **triangulation claim** (e.g., arguing disjoint pumps measure different intuitions) should be eligible for full credit if they meet A-grade criteria.
