prompt: |-
  I'm teaching a graduate seminar on the separateness of persons objection this term, and I keep running into the same move from an economist in my department — he's a genuinely good philosopher of the social sciences, not a cartoon utilitarian — and I want to know whether the thing he leans on is actually load-bearing. His line, usually delivered over coffee, is that the objection only looks forceful because we fetishise the boundaries between organisms. On his picture, aggregating well-being accross persons is exactly like aggregating it accross times within a single life: prudence and benevolence are the same operation, just with more columns in the spreadsheet, and the only reason the two feel different is that in one case we happen to run the calculation from the inside. He uses that to license two conclusions: (i) that cost-benefit analysis in real policy settings — a transport appraisal, a hospital budget, a pandemic triage protocol — is prudence written large and needs no extra moral warrant beyond what any sane person already grants for their own life, and (ii) that Rawls's insistence on the distinctness of persons and Nozick's crack about there being no social entity with a good of its own are rhetoric dressed up as argument. He also gestures at Harsanyi's veil-of-ignorance result as the formal version of the same thought.

  Here is where my seminar made it harder than I expected. We spent a session varying the *degree* of subject-fusion, and the analogy seems to move with it in a way I can't get a grip on. Four set-ups: (A) one person across an ordinary life — prudential trade-off, nobody objects. (B) a pair of people joined in such a way that every affective state is shared at full intensity and there is one decision procedure between them. (C) the same pair only partially fused: each feels the other's pains and pleasures at half intensity, and they still deliberate separately. (D) the reverse direction — one human life whose earlier and later stages share no memory, no projects, no psychological continuity at all, Parfit-ish fission without the branching, so that prudence across that life starts to look like one stage of a person making a sacrifice for a stranger. So what I want is an audit of the analogy, not a verdict on utilitarianism. Give me the correspondence table first: in the intrapersonal case, what plays the role of the planner, the earlier self, the later self, the discount rate, compensation, and the boundary of the unit — and what does each map onto in the interpersonal case, including who plays the planner there (and note that in the target the planner is always somebody with their own stakes, which has no analogue in the source).

  Then the disanalogies, sorted rather than listed: which ones actually block the inference to (i) and (ii) and which are noise — e.g. whether the single stream of consciousness and shared memory in the source matter for the metaphysics but not for the policy conclusion, or the other way round. Then run the cases: does B behave like A or like the ordinary many-person case? Does C give me a scalar version of the objection, with separateness coming in degrees rather than on/off — and if so, is that trouble for the standard Rawlsian framing, which wants distinctness to be a hard moral fact, or trouble for my colleague, or both? And D: if the analogy is meant to borrow the self-evidence of prudence, and prudence across a discontinuous life is itself just one stage benefiting another, hasn't it lost the thing it was borrowing — or is that just a change of subject? Finally, if the analogy fails, is there a better one that does the work he wants without the fusion metaphysics? I've been toying with a parent dividing things among several children — one decision-maker, several distinct beneficiaries, no identity needed, aggregation of a sort clearly happening — but I suspect it quietly imports something about the parent's own stake or about the children's claims that he isn't entitled to. Say what that is, and say whether any analogy can get you from trade-offs within a life are fine to trade-offs between lives are fine without smuggling the conclusion. Don't bother with citations or a reading list — I've read the standard stuff, I just want the mapping and its breaking points.
reasoning: |-
  Okay, let me unpack this. The user is teaching a graduate seminar on the separateness of persons objection and is grappling with an economist colleague's argument that personal boundaries are arbitrary for moral aggregation. The core challenge is dissecting the intrapersonal-interpersonal analogy across varying fusion scenarios (A-D), mapping conceptual roles, identifying disanalogies that matter for policy/licensing conclusions, and testing alternative analogies. 

  First, the colleague's move needs precise reconstruction: He claims organism boundaries are morally irrelevant, making prudence (within-life) and benevolence (between-lives) computationally identical operations differing only in perspective ("columns in the spreadsheet"). This licenses (i) policy CBA as "prudence writ large" and (ii) dismissal of Rawls/Nozick as rhetorical. Harsanyi's veil is cited as formal support.

  The seminar's exploration of fusion degrees complicates things: 
  - A (standard prudence) is uncontroversial. 
  - B (full fusion) seems to collapse to A. 
  - C (partial fusion) introduces scalar separateness. 
  - D (discontinuous life) makes prudence resemble sacrifice for a stranger. 

  User wants: 
  1. **Mapping table** for intrapersonal → interpersonal roles (planner, selves, discount rate etc.), noting the "planner with stakes" asymmetry. 
  2. **Disanalogies sorted by consequence**: Which undermine (i)/(ii) vs. mere metaphysical noise? 
  3. **Case analysis**: Does B behave like A? Does C challenge Rawls' binary distinctness? In D, if prudence loses self-evidence, does the analogy collapse? 
  4. **Alternative analogy test**: Parent dividing resources among children—does it smuggle in premises? 

  Key tensions to address: 
  - The **planner asymmetry**: In intrapersonal case, the planner *is* the subject of trade-offs (self-interest aligned). In policy, planners are external agents with partial stakes. This risks circularity if "prudence writ large" assumes a unified agent that doesn't exist. 
  - **Discount rates**: Time preference within lives may be rational (e.g., uncertainty); interpersonal "discounting" (e.g., privileging some groups) needs independent justification. 
  - **Compensation mechanics**: Compensation within a life is automatic (beneficiary bears costs). Between lives, it requires transfer mechanisms and raises distributive justice issues. 
  - **Subjectivity gaps**: In C (partial fusion), shared affect doesn't imply shared identity or authority—deliberation remains separate. This blocks treating them as one agent. 
  - **D's implication**: If discontinuous prudence is just interpersonality, the analogy can't ground interpersonal aggregation in prudence's authority—it assumes what it proves. 

  For cases: 
  - **B** (full fusion) does behave like A, but only by erasing separateness—so it can't justify aggregation where separateness exists. 
  - **C** shows separateness is scalar, but Rawls can retreat to "sufficient distinctness for reciprocity" without needing binary metaphysics. The colleague's move fails here because partial fusion doesn't license overriding separate deliberation. 
  - **D** severs the analogy's foundation: If prudence across gaps isn't self-evidently rational, it can't lend authority to benevolence. 

  Alternative analogy (parent/children): 
  - Covertly assumes **fiduciary authority** (parent's duty to act in children's interests) and **equal moral status** of children—neither of which apply to impersonal policy planners or unequal societies. 
  - Also, parental partiality is limited (e.g., can't sacrifice one child for others), unlike utilitarian aggregation. 

  Verdict: The analogy fails for (i) and (ii) because its disanalogies (planner asymmetry, compensation, subjectivity) are load-bearing for policy justification and the distinctness argument. Harsanyi's veil doesn't save it—it assumes risk-pooling rational choice, not identity dissolution. No analogy can "borrow" prudence's authority for interpersonal trade-offs without already assuming separateness is irrelevant.
answer: |-
  Here's the structural audit of the analogy, mapping core elements across domains, followed by disanalogies that target your colleague's conclusions, and case analyses. The breaking points hinge on **authority, subjectivity, and compensation mechanisms**.

  ### Core Mapping Table
  | **Intrapersonal Case (Source)** | **Role** | **Interpersonal Case (Target)** | **Critical Notes** |
  |---------------------------------|----------|---------------------------------|-------------------|
  | Unified decision-maker (e.g., "present self") | Planner | Policy analyst, government, social planner | *Asymmetry:* In source, planner *is* the subject of trade-offs (identity-aligned interests). In target, planner is *external* to subjects, creating principal-agent problems. |
  | Earlier self | Cost-bearer | Disadvantaged group/individual | Compensation is automatic in source (bearer *becomes* beneficiary). In target, compensation requires separate transfer (often fails). |
  | Later self | Beneficiary | Advantaged group/individual | Beneficiary in source is temporally continuous with cost-bearer. In target, beneficiaries are distinct agents. |
  | Time preference / discount rate | Discount rate | Interpersonal weighting (e.g., social discount rate, priority to worse-off) | Source discounting often instrumental (uncertainty, opportunity cost). Target weighting is *moral* (desert, equality) and lacks default justification. |
  | Psychological continuity | Boundary of unit | Organismic boundaries | Boundary in source is defeasible (e.g., dementia). In target, boundaries are sites of agency, even with shared affect. |
  | Welfare aggregation across time | Operation | Welfare aggregation across persons | Formally similar; normatively distinct due to consent and identity. |

  ### Load-Bearing Disanalogies (Blocking i & ii)
  **1. Planner Asymmetry**  
  - **Why it blocks (i) & (ii):** In prudence, the planner *experiences* costs/benefits directly. In policy, the planner imposes costs/benefits *on others*. Prudence requires no justification to third parties; policy does. This dissolves the "prudence writ large" claim and forces Rawls/Nozick's point: no *single entity* exists to experience "social prudence."  
  - **Noise:** Shared affect (Case B/C) doesn't resolve this—deliberation remains external.

  **2. Compensation Mechanism**  
  - **Why it blocks (i):** Intrapersonally, compensation is automatic (e.g., saving now benefits *my* future hunger). Interpersonally, compensation is hypothetical and often fails (e.g., sacrificed minority isn't compensated by majority gain). Policy requires independent principles of justice (e.g., Pareto, prioritarianism) absent in prudence.  
  - **Noise:** Psychological unity (Case A vs. D) affects compensation *rationality* but not its automaticity.

  **3. Subjectivity & Consent**  
  - **Why it blocks (ii):** Prudence involves one subjectivity making trade-offs for itself. Interpersonal aggregation ignores separate subjective standpoints. Rawls’ "distinctness" highlights this moral friction: even with shared affect (Case C), two deliberative agents exist. Nozick’s "no social entity" underscores the lack of a unified perspective to *experience* aggregation.  
  - **Noise:** Memory/project continuity (Case D) is irrelevant; what matters is *who decides*.

  ### Case Analyses
  - **Case B (Full Fusion):** Behaves like A (prudence). *But:* Only because fusion erases separateness. It fails as an analogy for ordinary interpersonal cases—it *assumes* the conclusion (boundaries are irrelevant).  
  - **Case C (Partial Fusion):** **Scalar trouble for both sides.**  
    - For Rawls: Distinctness *is* scalar, but Rawls needs only "sufficient distinctness" for reciprocity (moral powers don’t require atomism).  
    - For Colleague: Partial fusion doesn’t license aggregation—separate deliberation persists. Half-shared pain ≠ half-shared authority. The objection still bites: why can one agent’s decision bind the other?  
  - **Case D (Discontinuous Life):** **Analogy loses foundation.** Prudence here *is* benevolence toward a stranger. If prudence in D isn’t self-evident (e.g., "Why sacrifice for a future ‘stranger’?"), the analogy can’t borrow prudence’s normative force for interpersonal cases. Colleague must defend *both* as equally rational—but D’s rationality depends on broader ethics (e.g., promissory obligations).

  ### Alternative Analogy: Parent Dividing Resources Among Children  
  - **Why it fails:** Covertly imports morally loaded premises:  
    1. **Fiduciary authority:** Parent acts *in loco parentis* with duty to children’s interests. The state lacks this default authority.  
    2. **Equal moral status:** Parent typically assumes children’s equal claims. Policy must argue for equality.  
    3. **No self-interest:** Parent doesn’t benefit from allocations (unlike policymakers/stakeholders).  
  - **Result:** This analogy assumes the moral framework it needs to justify, smuggling in impartiality and authority.

  ### Conclusion: Why the Analogy Fails for (i) & (ii)  
  No analogy can "borrow" prudence’s self-evidence for interpersonal trade-offs without **erasing the separateness it seeks to justify ignoring**. The disanalogies (planner position, compensation, subjectivity) are load-bearing because they expose:  
  - Policy aggregation imposes costs *on* others, not *for* oneself.  
  - Consent and distributive justice are irreducible in multiperson cases.  
  Harsanyi’s veil doesn’t help—it assumes risk-pooling rationality, not identity dissolution. Your colleague’s move reduces to question-begging: if we treat persons as "columns," aggregation works—but the moral objection is precisely that we *shouldn’t* treat them that way. The metaphysics of fusion (B/C) or fission (D) don’t resolve the authority problem; they evade it.
