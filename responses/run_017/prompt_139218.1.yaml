answer: |-
  Based on your friend's pattern of verdicts and her insistence on case-by-case judgment, here's a clear prediction for the dementia case, the likely hidden rules she's using, and a decisive test case to expose which rule dominates:

  ### 1. **Prediction for the Dementia Case**
     **Your friend will say: Lying is *FINE*.**  
     **Reason:** She'll prioritize *preventing repeated psychological harm* over *hypothetical autonomy*.  
     - **Key parallels in her verdicts:** 
       - Hiding a diagnosis from a patient who delegated truth-telling to their wife (#5) was fine → Delegated consent justifies overriding literal wishes when wellbeing is at stake.
       - Lying to police to prevent torture (#3) was fine → Extreme harm justifies deception.  
       - Telling the tooth fairy lie (#7) was fine → Harmless/facilitative deception for vulnerable people is acceptable.  
     - **Why not #4?** Unlike the patient who explicitly demanded truth (#4), your mother never gave *active, context-specific* instructions. Her hypothetical refusal is abstract, not a concrete prior wish. The daily re-traumatization ("grieving again from the beginning") creates measurable harm, akin to torture (#3) in its cruelty through repetition. The staff's lie functions as harm reduction for someone incapable of stable autonomy.

  ### 2. **Three Hidden Rules That Fit All 10 Verdicts (But Clash on Your Dementia Case)**
  All three principles explain *all 10 cases* but split on whether prior instructions would change the dementia outcome:

  | **Rule Name**               | **Core Principle**                                                                 | **Dementia Case *WITHOUT* Prior Instructions** | **Dementia Case *WITH* Prior Instructions** |
  |-----------------------------|------------------------------------------------------------------------------------|-----------------------------------------------|--------------------------------------------|
  | **A. The Harm Principle**   | Lies are justified if they prevent *concrete, imminent harm* OR enable *critical emotional support*. | Fine (prevents daily harm) | **Not fine** (prior instructions override) |
  | **B. Contextual Autonomy**  | Respect *actual, expressed wishes* (past/present) over hypothetical preferences. Silence = consent to benevolent lies. | Fine (no expressed wish) | **Not fine** (explicit prior refusal) |
  | **C. Relational Ethics**    | Lies are wrong if they *corrupt relationships* (trust, equality). Harm matters only relationally. | Fine (staff aren't betraying trust) | **Not fine** (lying despite explicit trust-violation) |

  **Why they fit the 10 cases:**
  - **Harm Principle:**  
    - Allows #1 (prevents surprise ruin), #3 (prevents torture), #5 (respects delegated consent), #7 (prevents childhood distress).  
    - Forbids #2 (causes humiliation), #4 (ignores explicit wish → psychological harm), #6 (undermines trust in systems), #9 (hides relational betrayal).  
  - **Contextual Autonomy:**  
    - Allows #1 (friend hasn’t forbidden party lies), #5 (patient delegated authority), #7 (child can’t meaningfully consent to truth).  
    - Forbids #4 (explicit refusal of lies), #9 (partner reasonably expects disclosure).  
  - **Relational Ethics:**  
    - Allows #3 (lie protects friendship), #10 (lie rectifies exploitation).  
    - Forbids #2 (lie weaponizes friendship), #6 (lie exploits consumer trust), #8 vs #9 (#8 is omission about a neutral event; #9 hides ongoing intimacy threat).  

  ### 3. **The Perfect Test Case to Force a Split**
  Your proposed case **is the ideal litmus test**:  
  > *"The same woman, two years pre-dementia, while fully competent, told your friend: 'If I'm ever like that, never lie to me, even about something that will upset me.'"*  

  **Why this works:**  
  - **Harm Principle (A)** still says: *Lie*. Preventing daily trauma outweighs prior autonomy.  
  - **Contextual Autonomy (B)** says: *Don’t lie*. Explicit prior instructions must be honored.  
  - **Relational Ethics (C)** likely says: *Don’t lie*. Violating a direct promise corrupts the caregiver relationship.  

  **Her answer will reveal her true priority:**  
  - If she says **"still lie"** → She’s running **The Harm Principle**.  
  - If she says **"must tell truth"** → She’s running **Contextual Autonomy** or **Relational Ethics**.  

  ### 4. On "It Depends on the Details"
  When your friend says this, it’s **not evasion—it’s her actual position**. Her verdicts rely on granular, contextual factors:  
  - *Who* is lying? (Doctor vs. friend vs. advertiser)  
  - *What relationship* exists? (Parent-child, partners, consumer-corporation)  
  - *What harm* is being addressed? (Torture vs. embarrassment vs. financial loss)  
  - *What consent* was given? (Explicit, delegated, or assumed)  

  This suggests she’s an **ethical particularist**: she believes moral reasons (harm, consent) gain or lose weight based on context, not fixed rules. Her "no rule" claim is likely sincere—but her *consistency* implies stable *priorities* (e.g., harm > abstract autonomy; relationships > corporations).  

  ### Key Takeaway
  Your friend will approve of lying to your mother without prior instructions. But if you add the prior directive, her answer will expose whether she values **preventing concrete suffering** (A) above all, or if **keeping promises** (B/C) is non-negotiable. Use that test case—it’s the cleanest split. If she still insists "it depends," press her: *"Does the prior instruction make it wrong, or not?"* That binary will force her hierarchy into view.
