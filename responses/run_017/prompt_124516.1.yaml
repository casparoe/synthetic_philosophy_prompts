prompt: |-
  I chair the behavior-support committee at a nonprofit that runs eleven group homes for adults with profound intellectual and multiple disabilities. My younger sister moved into one of them two years ago, so I now also see the output of our process from the family side, which is part of why I'm asking. Every resident has a written preferences-and-goals plan, rewritten annually and reviewed quarterly, signed off by a state regulator; in practice that document determines how a person spends their days — what they are offered, what they are taken to, what staff will wake them for, what gets removed from their environment as a safety risk. None of the residents use speech, so every one of these plans is inferred from behavior. Our current method is essentially a frequency count: over a two-week structured trial a support worker offers a pair of options ten times, and whichever one the resident approaches, reaches toward, or looks at longer gets written into the plan as a preference. The workers who run the trials have high-school educations, no statistics, about fifteen minutes per trial, and usually two or three other residents to supervise at the same time; anything I hand them has to fit on one laminated sheet, use no equipment the unit doesn't already have, and hold up when a reviewer asks how we know.

  I recently read about inverse reinforcement learning — inferring an agent's reward function from its observed actions — in a machine-learning context, and it made me anxious about our own practice in a way I can't fully articulate to my committee. The parts I keep circling are these. First, behavior underdetermines the reward function: many different orderings of how much someone cares generate exactly the same choices, and, counterintuitively, a person who always picks the same thing tells you less about the strength of the preference than someone who mostly picks it but occasionally doesn't. Second, choices are made against an option set that we constructed, and a long history of being offered almost nothing can itself shrink what a person reaches for, so a frequency count can quietly launder staff convenience and institutional routine into the resident's own preferences. Third, motor effort, positioning, staff cueing, satiation, and fear of the alternative all move behavior in the same direction that liking does, and our trials don't separate them. Fourth — and this is the one I'm least sure I've got right — a reward function inferred from someone's behavior is not automatically the thing we ought to be serving; there may be cases where the plan should say something about what we owe the person rather than what they'd pick. I'd like the procedure to preserve those four worries while being usable by someone who will never read the theory, and to be honest about which of them it has quietly dropped.

  So: please write me a decision procedure my committee can adopt for turning observed behavior into a sentence in a plan. In order, the questions to ask; what counts as a sufficient answer to each; which tests a support worker can actually run in fifteen minutes on the unit; where the procedure stops and returns no inference is licensed from this behavior; and where it hands the question to a named human being — the resident where possible, otherwise a family member or an advocate — because it is a judgment about values and not a matter of evidence at all. The output should be a plan sentence a regulator can audit, not a preference ordering, and I'd like it to allow sentences that are instructions to staff about the environment rather than claims about what the resident wants. Then run it on three cases: a resident who picks the quiet room over the music room nine times out of ten (I want to know whether that means she seeks quiet or is avoiding noise, and the plan sentences differ); a resident who reaches for a cookie more often than an apple when the apple is placed slightly farther away and reaching is effortful for her; and a resident who has refused every offered activity for two years and now spends most of the day in bed, where I suspect the honest answer is that the behavior is underdetermined and the right move is something other than writing down a preference. At least one of these should come out somewhere my current frequency count would not have gone, and at least one should be marked as a case the procedure cannot settle. Finally, tell me where the procedure will misfire — which residents, which kinds of option, which staff behaviors — and what a reviewer should look for to notice that it has.
reasoning: |-
  Hmm, the user chairs a behavior-support committee at a nonprofit running group homes for adults with profound intellectual and multiple disabilities. They've raised some deep concerns about their current preference-assessment method, which relies on simple frequency counts of choices between two options. Their personal connection—having their sister in one of these homes—adds emotional weight to their quest for a better system.

  Their core anxieties are fourfold: First, that behavior alone can't perfectly reveal underlying preferences since multiple motivations could produce identical actions. Second, that limited options might artificially narrow expressed preferences over time. Third, that factors like physical effort or fear could masquerade as preference. Fourth, that sometimes what a person *would* choose isn't what we *should* provide—there are ethical obligations beyond revealed preference.

  They need a practical decision tree that frontline staff can execute with minimal training, using only existing resources, while explicitly preserving these philosophical concerns. The output must be regulator-friendly plan sentences, not just data points. They also want concrete examples tested and want to know where the method could fail.

  The user's clearly done their homework on inverse reinforcement learning but wisely recognizes that academic models won't translate directly to caregivers with high-school educations multitasking in group homes. Their frustration with "laundering institutional convenience" into formal plans suggests they've seen this happen. The cookie-vs-apple example hints they're noticing how accessibility barriers get misread as preferences.

  For the solution, I'll build a step-by-step protocol that forces staff to pause at each of their four worries. Key features: mandatory "effort calibration" before preference tests, explicit tracking of non-choice responses, distinction between "liking" and "choosing," and off-ramps to human judgment when behavior is ambiguous or ethical questions arise. The laminated sheet will look deceptively simple but embed safeguards against their concerns.

  In the test cases: For the quiet room chooser, we'll force separation of "seeks quiet" vs "avoids noise" via avoidance tests. For the cookie-apple dilemma, we'll reveal how unequal effort invalidates the preference claim. For the bedbound resident, we'll trigger an "inconclusive" flag and shift to well-being obligations. Each demonstrates where frequency counts fail.

  The failure modes section will warn about residents with chronic pain (effort confounds), those with trauma histories (fear looks like dislike), and staff who skip calibration steps. Reviewers will be told to check for repeated "inconclusive" flags in files—a sign the system is working as intended to prevent false certainty.
answer: |-
  Here's a decision procedure ("The Preference & Well-Being Inference Protocol") designed for your context, embedding your core concerns into a staff-friendly workflow on a single laminated sheet. It prioritizes clarity, auditability, and ethical pauses.

  **The Preference & Well-Being Inference Protocol (Laminated Sheet)**

  **Purpose:** To guide staff in observing behavior to write useful, ethical sentences for the resident's plan about what to offer, avoid, or prioritize. **Remember:** Behavior has many causes. We separate "choosing" from "liking," and know when to ask for human judgment.

  **Before Any Trial: Effort & Access Check (MANDATORY - 2 min)**
  1.  **Ask:** "Can the resident easily see/hear/smell both options *and* physically reach/move towards either one *without significant extra effort* compared to the other?"
      *   **If NO:** STOP. This setup is invalid. Adjust positioning/access so effort is equal *before* testing preference. If equal effort isn't possible, note the barrier (e.g., "Reaching left requires more effort") and consider this a barrier removal need, not a preference test.
      *   **If YES:** Proceed to Structured Trial.

  **Structured Trial (10 min max per pair)**
  2.  **Offer Pair:** Clearly present two options simultaneously. Use consistent, simple cues ("Look, Anna: Music or Quiet?"). Ensure resident is alert. Record date/time.
  3.  **Observe & Record (10 Offers):** For each offer:
      *   **Choice:** Which option did the resident *approach*, *reach for*, or *clearly fixate gaze on* for >3 seconds *first*? (Record: A or B)
      *   **Avoidance:** Did the resident *turn head away*, *pull back*, *vocalize distress* (cry, whimper), or *tense up* when an option was presented or approached? (Record: Avoided A, Avoided B, or None)
      *   **No Response:** Did the resident show *no clear orientation* (look, reach, move) towards either option after 20-30 seconds? (Record: No Response)
  4.  **Summarize Trial:**
      *   Choices: A: \_\_\_ out of 10 / B: \_\_\_ out of 10
      *   Avoidance Observed? (Yes/No for A? Yes/No for B?)
      *   No Response Count: \_\_\_ out of 10

  **Interpretation & Plan Sentence Writing (3 min)**
  5.  **Ask: "Was there consistent Avoidance of one option?"**
      *   **If YES (Avoidance observed in >3 trials for one option):** This suggests *active dislike or distress*. **Plan Sentence:** "Avoid exposing [Resident] to [Avoided Option] due to observed distress signals (e.g., turning away, vocalizing)."
      *   **If NO:** Go to Question 6.
  6.  **Ask: "Was there High No Response (>5 out of 10)?"**
      *   **If YES:** Behavior is unclear. STOP TRIAL FOR THIS PAIR. **Result:** "Inconclusive: High non-response rate observed for [Option Pair]. Needs different approach/timing or consult team/advocate." *Do NOT write a preference sentence.*
      *   **If NO:** Go to Question 7.
  7.  **Ask: "Was Choice highly consistent (Chose one option 8, 9, or 10 times)?"**
      *   **If YES:** This shows a reliable *choice under these specific conditions*. **But Ask:** "Is there a clear reason why the *unchosen* option might be harder (see Step 1) or scary?" If unsure, note it. **Plan Sentence:** "When offered [Option A] and [Option B], [Resident] consistently chooses [Chosen Option]." *(Note: This is about choice behavior, not necessarily deep preference strength or inherent liking).*
      *   **If NO (Choices are mixed: e.g., 7/3, 6/4):** This suggests the resident *can* choose and finds *both* acceptable sometimes, or has a mild preference. **Plan Sentence:** "[Resident] chooses [More Frequently Chosen Option] more often than [Less Frequently Chosen Option] when both are offered. Offer both options regularly."
  8.  **The Values Check (CRITICAL PAUSE):**
      *   **Ask:** "Does the behavior or the potential plan sentence raise a question about what we *owe* this person, regardless of their current choice? (e.g., health needs, dignity, social connection, trying new things after long isolation, avoiding harmful isolation even if chosen?)"
      *   **If YES:** STOP WRITING BASED SOLELY ON BEHAVIOR. **Hand Off To:** [Named Human: e.g., "The Behavior Support Committee," "Designated Family Advocate," "Ethics Subcommittee"] for a values-based decision. **Note:** "Observation data available, but plan sentence requires ethical/judgment call regarding [Brief reason, e.g., 'long-term isolation', 'nutritional need vs. choice']."

  **Key for Reviewer:** How do we know?
  *   Signed sheet shows Effort/Access Check passed (Step 1).
  *   Raw data recorded (Step 3: Choices, Avoidance, No Response).
  *   Path through questions (Steps 5-8) is documented.
  *   Hand-offs to humans (Step 8) are clearly noted with reason.

  ---

  **Testing the Protocol on Your Cases:**

  1.  **Resident: Quiet Room (9/10) vs. Music Room**
      *   Step 1: Effort/Access equal? (Assume Yes)
      *   Step 3: Choices: Quiet 9, Music 1. Avoidance: *Crucially, was Avoidance of Music observed?* (e.g., turning away, distress when music starts?). No Response: 0.
      *   Step 5: **Was Avoidance Observed?** If YES (>3 times avoidance of Music), Plan: "Avoid exposing [Resident] to the Music Room due to observed distress signals." If NO avoidance observed, proceed.
      *   Step 6: Low No Response? (Yes, 0)
      *   Step 7: Highly Consistent? (Yes, 9/10) Plan: "When offered the Quiet Room and Music Room, [Resident] consistently chooses the Quiet Room." **BUT** Staff *must note* if avoidance was observed (showing active dislike) or not (showing preference for quiet).
      *   Step 8: Values Check? Does consistently choosing quiet raise a concern about isolation/sensory deprivation long-term? If yes, hand off. If no, sentence stands.
      *   **Difference:** Separates *avoidance* (dislike/distress) from *consistent choice* (preference under conditions). Current method wouldn't distinguish.

  2.  **Resident: Cookie vs. Apple (Cookie chosen more often, Apple placed farther)**
      *   Step 1: **Effort/Access Check:** "Can resident reach both equally?" **NO.** Reaching for apple requires significantly more effort. **STOP.** Invalid setup for preference. **Result:** "Positioning barrier identified: Reaching towards [Apple location] requires significantly more effort than reaching towards [Cookie location]. Ensure food choices are presented with equal ease before inferring preference." **Do NOT write a preference sentence.** Plan might need: "Ensure all offered food/drink items are within equal and easy reach."
      *   **Difference:** Current method would falsely record "Prefers Cookie" and likely reinforce it. Protocol stops this by mandating the Effort Check *first*.

  3.  **Resident: Refuses all activities, stays in bed.**
      *   *Assume a trial offering "Sensory Mats (A)" vs "Garden Visit (B)"*
      *   Step 1: Effort/Access? (Getting out of bed requires high effort for both, but assume staff assist equally? Complex, but assume "adjusted" to be equal effort *for the choice moment*).
      *   Step 3: Choices: A: 0, B: 0. Avoidance: Likely Avoidance observed for *both* options in some trials? (e.g., turning away, pushing away). No Response: 10/10? Or high?
      *   Step 5: Avoidance Observed? If >3 Avoidance for *both* A & B, Plan: "Avoid pressing [Resident] to engage in [Sensory Mats] or [Garden Visits] due to consistent observed distress signals when offered." (Focus on avoiding *pressure*, not the activities themselves necessarily).
      *   Step 6: **If High No Response (>5/10):** "Inconclusive: High non-response rate observed for [Activity Pair]. Needs different approach/timing or consult team/advocate." **Do NOT write preference.**
      *   **CRITICAL Step 8: Values Check:** **YES.** Regardless of behavior (refusal/inconclusive), long-term bed confinement raises profound well-being concerns (physical health, sensory deprivation, dignity). **Hand Off To:** [Named Human/Committee] for ethical/judgment decision. **Reason:** "Sustained inactivity and refusal raise concerns about physical health deterioration, sensory deprivation, and social isolation, requiring a values-based plan beyond observed choice/refusal." **Output:** *Not* a preference sentence. Likely a directive like: "Staff will gently offer supported sitting upright in bed/wheelchair for [X] minutes, [Y] times per day, focusing on sensory input (e.g., open window, hand massage, quiet talking) regardless of refusal cues, monitored for tolerance. Consult OT/Physio. Review monthly." *This is about obligation, not inferred preference.*
      *   **Difference:** Current method would either force a "preference" for bed (invalid) or be stuck. Protocol forces "Inconclusive" or identifies avoidance, then mandates the ethical hand-off for well-being obligations.

  ---

  **Where the Procedure Will Misfire & Reviewer Checks:**

  1.  **Residents with High Effort/Cognitive Load for *Any* Choice:**
      *   **Misfire:** High "No Response" rates on everything, leading to constant "Inconclusive." Staff may get frustrated and skip trials or mislabel subtle cues.
      *   **Reviewer Check:** Look for repeated "Inconclusive" flags across many trials/pairs. Check if alternative methods (single-stimulus presentation, longer observation windows, different cues) were considered. Look for evidence of staff training on interpreting subtle signals for these residents.

  2.  **Subtle Avoidance Cues Missed:**
      *   **Misfire:** Staff focused only on "approach" might miss faint turning away, slight tensing, or low-level vocalizations indicating distress. This could mislabel avoidance as mere "non-preference" or "inconclusive."
      *   **Reviewer Check:** Scrutinize the raw data notes (Step 3) for detail on avoidance. Are they vague ("seemed unhappy") or specific ("turned head 90° away, hummed loudly")? Interview staff about specific distress signals for that resident. Check if videos (if ethically approved/used) match notes.

  3.  **"Satiation" Effects in Short Trials:**
      *   **Misfire:** Offering cookies 10 times quickly might lead to refusal/satiation by the 8th trial, misread as "non-preference" or avoidance later in the trial. Preferences for slower-paced or less repetitive activities may be missed.
      *   **Reviewer Check:** Look at the *pattern* within the 10 trials. Did choice/avoidance change significantly from first to last offers? Are trials spaced appropriately (e.g., not all 10 offers in 5 minutes)? Is the option inherently repetitive?

  4.  **Staff Bias in Option Selection / "Convenience Laundering":**
      *   **Misfire:** Staff only test "safe," easy-to-offer pairs, avoiding messy, complex, or resource-intensive options. The inferred preferences stay within a narrow, convenient band.
      *   **Reviewer Check:** Audit the *options chosen for testing*. Are they diverse? Do they include potentially enriching but "inconvenient" options (community outings, specific messy play, preferred staff 1:1 time)? Is there evidence of brainstorming novel options? Does the plan include obligations (Step 8 outputs) to offer things beyond the convenience band?

  5.  **Misapplication of the Values Hand-Off (Step 8):**
      *   **Misfire A (Overuse):** Staff hand off everything vaguely challenging, avoiding responsibility.
      *   **Misfire B (Underuse):** Staff ignore clear ethical dilemmas (like sustained isolation) to stick with "objective" behavior sentences.
      *   **Reviewer Check:** Examine the reasons given for hand-offs in Step 8. Are they valid ethical concerns or just difficult choices? Look for *lack* of hand-offs where serious well-being concerns (malnutrition, severe isolation, untreated pain interfering with choice) are evident in records but not addressed in the plan via obligation sentences. Check if the named humans/committees actively review these hand-offs.

  This protocol explicitly tackles your four worries by:
  1.  **Underdetermination:** Mandating Effort Checks, tracking Avoidance/No Response separately from Choice, flagging Inconclusive results, and separating *choice* sentences from *avoidance* sentences and *obligation* directives.
  2.  **Constrained Option Sets:** The Values Hand-Off (Step 8) is the explicit escape hatch for when the offered options/history are suspected to be limiting, mandating ethical consideration beyond observed behavior.
  3.  **Confounds (Effort, Fear, Satiation):** Front-loading the Effort Check, explicitly defining and tracking Avoidance (fear/distress), and flagging high No Response help separate these from "liking." Satiation is harder but reviewer checks help.
  4.  **Reward Function vs. Ought:** The Values Hand-Off (Step 8) is the core mechanism addressing this, explicitly separating evidence-based inferences from value-based obligations in the final plan sentence.

  The output provides clear, auditable sentences for regulators while embedding necessary complexity and ethical safeguards into the process itself.
