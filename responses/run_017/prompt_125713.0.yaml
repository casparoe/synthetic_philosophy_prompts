  ### Translation of Claims into Psychometric Vocabulary

  As a philosopher grounded in applied measurement (including standard-setting meetings), I approach this by carefully mapping each fairness claim to your psychometric framework. I prioritize faithfulness to both the original claims and your operational context (banding, lottery, hold-harmless rule, and criterion contamination). Below are restatements, followed by residue analysis. I explicitly flag assumptions imported from psychometrics (e.g., construct measurability, groups as given). 

  **Private Pass: Rejected Translations**  
  - For (a): I considered "calibration as predictive validity without DIF" but rejected it because DIF addresses item-level bias, not score-level outcome matching.  
  - For (b): I considered "equal sensitivity/specificity as classification consistency" but rejected it because classification consistency focuses on test-retest reliability, not group-wise error rates.  
  - For (d): I considered "alike in relevant respects = equal true scores" but rejected it because true scores are latent and unobservable, making operationalization impossible.  

  **Restatements and Residue**  

  #### (a) Calibration Claim  
  **Source Claim**: A score is calibrated within a group when, among people in that group who receive a given score, the actual rate of the outcome matches the score.  
  **Translation**: For a given group, at each observed score value, the average true outcome (success) rate equals the value implied by the score (assuming the score represents a probability). This requires **predictive validity** such that the score is an unbiased estimator of the success probability, with **measurement error** that does not systematically distort expectations.  
  **Fidelity**: Distorted  
  **What Broke**: Must assume the score is on a probability scale. If not (e.g., a raw score), "matching" requires a transformation (e.g., via item characteristic curves), which the original claim ignores. Calibration is also disrupted by **base rate** differences, which the claim doesn't address.  
  **Smuggled Assumption**: The construct (success) is real and measurable, and the score is intended as a probability.  
  **Residue Verdict**: Defect of the original claim—it assumes scores are inherently interpretable as probabilities.  

  #### (b) Equal Error Rates Claim  
  **Source Claim**: A score has equal error rates across groups when the false-positive and false-negative rates are the same in each group; and, separately, when a given score carries the same positive predictive value in each group.  
  **Translation**:  
  - Part 1 (FPR/FNR): At a specified **cut score**, **sensitivity** (1 - FNR) and **specificity** (1 - FPR) are equal across groups, implying identical error distributions.  
  - Part 2 (PPV): For a given observed score, **positive predictive value** (PPV) is equal across groups, equivalent to **calibration** from (a).  
  **Fidelity**: Distorted  
  **What Broke**: FPR/FNR require a binary decision threshold, but your banding system uses multiple cut scores. The original claim doesn’t specify thresholds, creating ambiguity. PPV equality reduces to calibration (a), so it’s redundant if (a) holds.  
  **Smuggled Assumption**: Groups are exhaustive and mutually exclusive, and a single threshold exists (contradicted by banding).  
  **Residue Verdict**: Real gap in both—psychometrics lacks tools for multi-threshold error rates, and the claim overlooks banding.  

  #### (c) Impossibility Result  
  **Source Claim**: When the underlying outcome rates differ between groups, a score that is not perfectly accurate cannot have all of these properties (calibration, equal FPR/FNR, equal PPV) at once.  
  **Translation**: If **base rates** (success prevalence) differ across groups, a score with **measurement error** cannot simultaneously achieve: (i) **calibration** (as in (a)), (ii) equal **sensitivity** and **specificity** at a cut score (as in (b)), and (iii) equal **PPV** (implied by (i)). This arises because **predictive validity** metrics are interdependent via Bayes’ theorem (e.g., PPV depends on base rates).  
  **Fidelity**: Clean  
  **What Broke**: Nothing—interdependencies among sensitivity, specificity, PPV, and base rates are well-established in psychometrics (e.g., via **contingency tables**).  
  **Smuggled Assumption**: Base rates are stable and measurable, and measurement error is inevitable.  
  **Residue Verdict**: n/a  

  #### (d) Individual Fairness  
  **Source Claim**: People who are alike in the relevant respects should be treated alike.  
  **Translation**: Individuals with the same **true score** should receive the same observed score and thus the same band assignment, necessitating **measurement invariance** (no **differential item functioning**). This requires identical **item characteristic curves** across groups and minimal **measurement error** to ensure **classification consistency**.  
  **Fidelity**: Distorted  
  **What Broke**: True scores are latent and unobservable, so "alike in relevant respects" cannot be directly verified. Band assignments depend on observed scores, which include error, making identical treatment impossible. The claim ignores **linking and equating** constraints.  
  **Smuggled Assumption**: True scores exist and are the sole "relevant respect"; groups are defined a priori.  
  **Residue Verdict**: Defect of your framework—psychometrics cannot bridge true-vs-observed score gaps without error-prone proxies.  

  #### (e) Criterion Contamination Worry  
  **Source Claim**: The outcome variable is a record of our own earlier allocation decisions, so improving "accuracy" partly consists in reading our prior practice back to ourselves.  
  **Translation**: **Criterion contamination** occurs because instructors record "success" while aware of band assignments, embedding prior allocation decisions (based on the score) into the outcome. This inflates **predictive validity** artificially, as the score predicts its own consequences.  
  **Fidelity**: Clean  
  **What Broke**: Nothing—psychometrics explicitly identifies criterion contamination as a validity threat.  
  **Smuggled Assumption**: The outcome is intended as an objective criterion.  
  **Residue Verdict**: n/a  

  #### (f) Moral Choice and Fairness Critique  
  **Source Claim**: Where criteria conflict, the choice between them is moral/political, not technical; and allocation by predicted outcome is inherently unfair if differing rates stem from past injustice.  
  **Translation**: Trade-offs between fairness criteria (e.g., calibration vs. equal error rates) require value judgments about **adverse impact** and **consequential validity**, not statistical optimization. If group **base rate** differences reflect historical injustice, using the score for allocation perpetuates inequity, regardless of **predictive validity**.  
  **Fidelity**: Inexpressible  
  **What Broke**: Psychometrics lacks tools to evaluate "injustice" or moral choices; **adverse impact** is measurable but cannot adjudicate fairness. The stronger claim (all allocation by prediction is unfair) is a normative stance outside psychometric vocabulary.  
  **Smuggled Assumption**: "Injustice" is identifiable and separable from measurement error.  
  **Residue Verdict**: Defect of your framework—it quantifies outcomes but cannot address structural causes.  

