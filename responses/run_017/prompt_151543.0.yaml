prompt: |-
  hey, I'm taking a philosophy of technology course this term and we've been doing social ontology and virtual objects, and I keep running into a thing in games that I can't find a word for. sorry if this is rambly, two cases from an MMO I've played for years:

  (1) Before every raid everyone goes to a particular shrine and types a specific emote. Everyone I've ever asked says it's a hidden mechanic -- skip it and the boss gets a buff or the loot table gets worse. A couple months ago some dataminer types went through the game files and there is no such flag, nothing tied to that shrine or that emote. The practice didn't stop. People still get removed from groups for not doing it, guilds still schedule around it, and if you ask why, people say because it works.

  (2) There's a street in the main city where everyone trades. Everyone treats it as a no-PvP street and tells new players it's an official safe zone. Also not in the code. Someone attacks there maybe once a month and gets yelled at, kicked from their guild, sometimes mass-reported. Then last year the devs actually added a real safe-zone flag to that street and everybody said it had always been that way.

  So the thing I want a name for: features of a virtual world that are genuinely there -- they coordinate behaviour, people get punished over them, they show up in schedules and in the in-game economy -- but whose existence depends on each player assuming the devs put them there, while no individual player seems to have ever checked or to believe it on their own authority. Nobody is collectively accepting anything; each person is deferring to an authority they assume everyone else verified. And it's not the usual everyone-knows-that-everyone-knows situation either, because what gets shared is a belief about the devs, not about each other.

  Is there an established concept for this, or is it just an urban legend that happens to be load-bearing? I want the carving, not a label: what kind of thing this is, how it differs from its nearest neighbours (I can think of a couple -- a convention people follow because others follow it, and the code-vs-made-up-rule distinction), at what point one of these stops existing (does a patch note saying it was never real kill it? does the devs later coding it make it real retroactively, or make it a different object?), and whether the punishment in case (2) is a real harm in the same way it would be if the safe zone had been coded from the start.

  under 400 words please, and if you end up coining something I want the definition in one sentence plus one case that clearly counts and one that clearly doesn't. thanks!
reasoning: |-
  Okay, the user is taking a philosophy of technology course and has encountered a phenomenon in MMOs where players believe in certain game mechanics that aren't actually coded into the game. They described two cases: a ritual at a shrine that people think affects raid outcomes, and a street treated as a safe zone that wasn't officially designated. The key point is that these "features" coordinate behavior, enforce punishments, and persist because each player assumes the devs implemented them, without anyone actually verifying. The user wants to know if there's a term for this, how it differs from similar concepts, and what happens when devs intervene.

  First, I need to recall relevant concepts in social ontology. Searle's institutional facts come to mind, where collective intentionality assigns functions to objects. But here, the belief is about the devs' authority, not mutual agreement. The user mentions it's not about everyone knowing others know (common knowledge), but each person deferring to an assumed verified authority.

  Maybe this is a type of social fact where the collective belief is anchored in perceived institutional backing. The enforcement mechanisms (kicking players, mass reports) show that the community treats these as real rules. When devs later codify the safe zone, it retroactively validates the belief, but the original phenomenon was purely social.

  The term "institutional anchor" might fit. It's a social rule that the community enforces because they believe it's officially sanctioned, even if it isn't. This differs from conventions (like driving on the right) which rely on mutual expectations without needing authority. Also, urban legends might not have the same behavioral impact.

  The user's deeper need might be understanding how virtual objects gain reality through collective belief versus code. They might be exploring the ontology of digital spaces—how social practices create "real" structures without underlying tech. The questions about retroactive validation and harm are crucial here. If devs patch in the safe zone, does that change the past reality of the rule? The harm from punishment might be the same since the social consequences were real regardless of code.

  Key distinctions: 
  1. vs. emergent conventions: No authority assumption, just mutual reinforcement. 
  2. vs. coded rules: Actual tech enforcement. 
  3. vs. urban legends: Lack of sustained coordination.

  The term should emphasize the perceived institutional authority. "Institutional Anchoring" captures that the rule is anchored by belief in dev authority, not code. For the definition: A social rule treated as institutionally codified due to collective deference to assumed authority, enabling coordination and enforcement despite lacking actual institutional backing.

  Cases: 
  - Counts: The raid ritual, where punishment occurs based on assumed dev mechanics. 
  - Doesn't count: Players gathering at a spot because it's convenient (emergent convention without authority assumption).

  On retroactivity: When devs codify it, the rule transitions from social to coded, but its prior existence was socially real. A patch note debunking it might kill it by removing the authority assumption. Harm in case (2) is real because social exclusion and penalties have tangible effects, similar to breaking an actual rule.

  The user also wants brevity—under 400 words—and a clear definition with examples. Need to structure the response concisely, addressing all parts: concept, differentiation, retroactivity, harm.
answer: |-
  Here's a conceptual carve-up of your phenomenon:

  **Core Concept: Institutional Anchoring (or Anchored Fiction)**  
  A rule, object, or affordance in a virtual world that functions *as if* it were institutionally codified (e.g., by developers) solely because the community collectively defers to the *assumed* existence of that codification, enabling coordination and enforcement despite lacking any actual institutional basis.

  **How it differs:**
  *   **vs. Emergent Convention:** Conventions (e.g., "trade here") rely on mutual expectations ("I do it because others do"). Anchoring relies on belief in *external authority* ("I do it because the *devs made it matter*").
  *   **vs. Coded Rule:** Anchored elements lack the actual technical implementation they are believed to possess. Their "reality" is purely social, dependent on the *perception* of institutional backing.
  *   **vs. Common Knowledge Urban Legend:** While anchored elements often *start* as legends, they become structurally load-bearing, directly coordinating core activities (raids, PvP rules) and triggering formalized sanctions (kicks, reports), unlike passive myths.

  **Existence & Change:**
  *   An anchored element exists as long as the collective deference to assumed dev authority sustains its functional role.
  *   **Patch Note Debunking:** Likely kills it by destroying the necessary belief in dev authority.
  *   **Devs Codifying It:** Doesn't make it retroactively "real" *as coded* previously, but *validates* the social function. It transitions from an anchored fiction to an institutional fact.
  *   **Punishment Harm:** The social harm (exclusion, reputation damage, lost play time) is **just as real** as if the rule were coded. The *cause* is social misalignment, but the *impact* is tangible within the community.

  **Definition & Cases (One Sentence):**  
  *Institutional Anchoring* is the phenomenon where a community treats a virtual rule or object as officially codified by an authority (e.g., game developers) due to collective deference to that assumed authority, enabling coordination and enforcement, despite the absence of any actual institutional backing.

  *   **Clearly Counts:** Your raid shrine ritual – enforced behavior based purely on assumed (but absent) dev mechanics.
  *   **Clearly Doesn't Count:** Players congregating in a specific city square because it's visually appealing and becomes a de facto social hub due to mutual reinforcement (an emergent convention lacking the authority deference).

  This highlights the power of *perceived institutional authority* in shaping virtual social reality, distinct from either pure code or pure mutual agreement.
