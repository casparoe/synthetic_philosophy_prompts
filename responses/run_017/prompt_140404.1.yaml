prompt: |-
  hey — I'm in a 300-level philosophy of biology seminar (cross-listed with ecology/evolution) and we're in the units-of-selection weeks, and I've realised my gut verdicts on cases don't add up to any position on the syllabus. My TA says everything is gene selection if you squint hard enough, which feels like a way of never being wrong, but the recipe we got in lecture — variation, heritability, differential output, apply it at whatever level you like — feels so permissive that a single nucleotide site passes it. So I want to know what I actually think. Here's where I land:

  - The mouse segregation distorter: heterozygote males pass the thing on to way more than half their pups but sire fewer pups overall, and homozygotes are sterile or dead. Verdict: gene-level selection, no hesitation. The individual mouse is doing worse while the allele does fine; the organism is just the arena.
  - A peacock's train. Verdict: individual-level selection, i.e. sexual selection — it's about how many matings that bird gets. I get that you can redescribe it as the long-train allele out-reproducing its alternative, but that redescripion feels empty here, and I want to say gene-level talk is doing no work in this case even though it's true.
  - Sterile workers in an ant colony headed by a singly mated queen. Verdict: gene-level again, via relatedness. I don't want to call the colony a unit of selection; I want to say the colony is something the genome builds.
  - Cellular slime moulds: amoebas aggregate when they starve and about a fifth of them die to build the stalk that lifts the rest. My prof told us to imagine the slug is chimeric, formed from unrelated amoebas. Verdict: I still want to say yes, this is selection at the level of the slug — between-slug differences beat within-slug cheating often enough that something like the stalk/spore ratio really is a slug-level trait.
  - Structurally the same thing inside my own body: cell lineages that defect get policed by apoptosis, immune surveillance, a sequestered germline. Verdict: here I do NOT want to say multilevel selection, with the body as the group and cells as the individuals. I want to say the body just is the individual and cell-level selection is noise that gets suppressed.

  Those last two are the pair I can't reconcile, and I think I might be conflating two seperate questions without knowing how to pull them apart. If relatedness is what welds a bunch of lower-level things into a higher-level one, then my verdicts are exactly backwards: my cells are clonal and the slug in my prof's version is a pile of strangers, so the body should look like a better unit than the slug, not a worse one.

  The rule I keep coming back to is a reproduction test: a level is a unit of selection only if things at that level genuinely reproduce — some bottleneck-ish process makes offspring units that resemble parent units — rather than getting reassembled out of whatever happens to be lying around each generation. But that test does nothing for the peacock, where both the gene and the bird pass it and I still think only one description earns its keep.

  Our TA also threw a made-up case at us, and it's the one that breaks my rule for me: a colonial marine invertebrate where colonies sometimes reproduce by budding off a single founder cell and sometimes form when three unrelated colonies fuse. There's a costly shared defensive structure that makes colonies survive better and grow slower. It spreads in the bottleneck regime and gets eaten by free-riders in the fusion regime — same trait, same ecology, only the mode of colony reproduction differs. My gut says the colony is a unit of selection in the first regime and isn't in the second, but on the Price-equation framing we did, the fusion colonies are just as much groups with differential survival, so group selection is going on in both and merely loses in one. I definately hate that conclusion and can't say why.

  And the one I go back and forth on: obligate symbionts. A bacterium passed strictly from mother to offspring for millions of years — I sort of want to say the pair is one unit. A gut community passed around among nestmates — I want to say no. Is that just transmission fidelity, and is there a threshold, or is that the wrong axis entirely?

  What I want: a principle (or two candidates) stated precisely enough to apply, with the case that motivates each clause; its verdict on a case I haven't listed — make one up and tell me what it predicts; and an honest list of my verdicts it can't save. If the honest answer is that one of my verdicts is just wrong, say which and why. Please don't give me reading recs, we already have a syllabus.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're in a philosophy of biology seminar dealing with units of selection, and their intuitive judgments about different cases don't align with any standard position. The TA's "everything is gene selection" view feels like a cop-out, while the standard variation-heritability-fitness recipe seems too permissive. 

  First, I need to understand their specific pain points. They've listed several cases with their intuitive verdicts, but the last two—slime molds and multicellular bodies—contradict each other. Both involve suppression of lower-level selection, yet they see the slime mold as group selection but the body as organismal selection. The key inconsistency arises when considering relatedness: in the body, cells are clonal (high relatedness), while in the chimeric slime mold, amoebas are unrelated (low relatedness). Yet they see the body as a stronger unit, which is the opposite of what relatedness would predict.

  Their proposed "reproduction test" (bottlenecking) explains some cases but fails for the peacock, where both gene and organism reproduce. The TA's colonial invertebrate example highlights the problem: when colonies reproduce via a single cell (bottleneck), group selection works; when colonies fuse, free-riders invade. But the Price Equation would call both group selection, which they reject. 

  The symbiont cases add another layer: vertical transmission makes the host-symbiont pair feel like a unit, while horizontal transmission doesn't. This suggests transmission fidelity matters, but is it the same as bottlenecking?

  To resolve this, I need to disentangle two questions: what units are vehicles (interactors) versus what units replicate (replicators). The gene is always the replicator, but vehicles can be genes, cells, organisms, or groups depending on functional integration. The bottleneck matters because it creates parent-offspring lineages at the higher level, allowing selection to act on group traits. 

  For the body: the germline bottleneck makes the organism the vehicle; cell lineages don't reproduce independently. For chimeric slime molds: no bottleneck, so amoebas are the vehicles, and "slug-level selection" is really individual amoebas benefiting from cooperation in that context. The colonial invertebrate with bottlenecking: the colony becomes a vehicle; without bottlenecking, colonies are groups but not vehicles because traits aren't heritable at colony level. 

  This framework explains their intuitions: the mouse segregation distorter is a genic vehicle; peacock trains are organismal vehicles; ant workers are genic due to relatedness; slime molds only if bottlenecked (but they aren't in the example); bodies are organismal vehicles; symbionts with vertical transmission become part of the host vehicle. 

  The cases their view can't save: the chimeric slime mold (shouldn't be group selection) and the fusion colonies (aren't vehicles). Their verdict on symbionts is mostly right. The peacock is fine—genic redescription is always possible but not always explanatory. 

  I'll structure the answer to define vehicles versus replicators, apply to each case, resolve the inconsistencies using bottlenecks and functional integration, and note where their intuitions need adjustment. The colonial invertebrate example will illustrate the bottleneck principle in action. Symbionts show transmission fidelity enables integration into a vehicle. The key is insisting that vehicles must have inherited traits and functional coherence, not just differential survival.
answer: |-
  Here's a precise principle (with motivation, application, and limitations) that reconciles your verdicts while exposing where your intuitions might need refinement. The core insight is separating **functional individuality** from **selection dynamics**:

  ### Principle: The Vehicle Criterion
  **A level X is a bona fide *unit of selection* (a "vehicle") if:**
  1.  **Functional Integration:** Entities at level X exhibit coordinated, adaptive traits that *directly* cause differential survival/reproduction *at level X*.
  2.  **Developmental Bottleneck:** Entities at level X arise primarily through a bottleneck process where a *single* parent X-unit produces offspring X-units that inherit its traits *as a coherent whole* (not merely through reassembly of parts).
  3.  **Constraint of Lower Levels:** Selection at level X significantly suppresses or channels potential selection at lower levels (e.g., genes, cells) within it, making lower-level evolutionary dynamics largely dependent on the success of X.

  **Motivation for Each Clause:**
  *   **(1) Functional Integration:** Distinguishes genuine *adaptations* of X from mere side effects of selection at other levels (e.g., the peacock's train isn't just a gene's effect; it's an organism-level mating adaptation). Motivates why the peacock is organism-level.
  *   **(2) Developmental Bottleneck:** Ensures heritability and parent-offspring resemblance *at level X*, making selection on X-level traits evolutionarily significant. Solves the colonial invertebrate case and distinguishes bodies from chimeric slugs. Motivates why the body is a unit and the fusion colony isn't.
  *   **(3) Constraint of Lower Levels:** Distinguishes a true vehicle from a temporary assemblage where lower-level selection dominates (e.g., chimeric slug vs. body). Explains why suppressing cheating is necessary but not sufficient (it must be *for the function of X*). Motivates why the ant colony isn't the primary unit (selection is constrained by kin selection at the gene level).

  **Applying the Principle to Your Cases:**

  1.  **Mouse Segregation Distorter:**
      *   *Verdict:* **Gene-level selection.** Violates (3) at organism level (organism fitness *decreases* due to gene's action). The gene is the functional unit causing its own differential transmission.
  2.  **Peacock's Train:**
      *   *Verdict:* **Organism-level selection.** Strong (1): train is an integrated organismal trait directly causing mating success. Strong (2): bottlenecked organismal reproduction. Strong (3): cell/gene selection within the peacock is irrelevant to train evolution. Genic redescription is possible but *less explanatory* of the adaptation's function.
  3.  **Sterile Ant Workers:**
      *   *Verdict:* **Gene-level selection (via kin selection).** Weak/no (1) at colony level: worker sterility isn't a colony *trait* in the same way; it's a consequence of genes influencing development *based on relatedness*. Weak (2): colonies form via queen founding (bottleneck), but the key trait (worker sterility) evolves via gene transmission. Strong (3): worker reproduction is suppressed *for gene transmission*. The colony is a *context* for genic selection, not the primary vehicle.
  4.  **Chimeric Slime Mould Slug:**
      *   *Verdict:* **NOT slug-level selection.** Fails (2): Slug arises by aggregation of *unrelated* amoebas, not from a single parent slug bottleneck. Fails (3): Cheating is a major force; selection primarily acts on *amoebas* within slugs (cooperators vs. defectors). Your "often enough" intuition reflects amoebas benefiting from cooperation *in that context*, not slug-level adaptation. *Your intuition here is likely wrong* based on the chimeric setup.
  5.  **Multicellular Body:**
      *   *Verdict:* **Organism-level selection.** Strong (1): Organs, immune system are integrated adaptations. Strong (2): Definitive germline bottleneck. Strong (3): Cell-level selection (cancer) is policed and suppressed *for organismal function*. Cell lineages don't reproduce independently.
  6.  **Colonial Invertebrate (TA's Case):**
      *   *Bottleneck Reproduction:* **Colony IS a unit (vehicle).** Passes (1): Defensive structure is a colony-level adaptation. Passes (2): Reproduction via single founder cell = bottleneck. Passes (3): Within-colony free-riding is minimized by bottleneck, selection acts on colony traits.
      *   *Fusion Reproduction:* **Colony is NOT the primary unit.** Fails (2): Fusion reassembles colonies from parts of multiple parents, breaking heritability of colony traits. Fails (3): Free-riders readily invade - selection acts *within* fused colonies on lineages originating from different parents. Differential group survival exists (Price Equation captures this), but the *vehicle* for adaptation is the lower-level unit (e.g., the lineage within the colony that avoids paying the cost).
  7.  **Obligate Symbionts:**
      *   *Vertical Transmission (e.g., Buchnera in aphids):* **Host-Symbiont Pair approaches a single unit.** Strong (1)/(2): Tight coadaptation, co-speciation, host bottleneck transmits symbiont. Strong (3): Symbiont genome stripped down/reliant on host; host adaptations depend on symbiont. *It's a borderline case leaning towards a composite vehicle.*
      *   *Horizontal Transmission (e.g., Gut Microbiome):* **NOT a single unit.** Fails (2): Community reassembles each generation from diverse sources. Fails (3): Selection acts strongly *within* the gut on individual microbe strains competing/cooperating. The "community" lacks the bottleneck and integration for vehicle status.

  **A New Case: "Super Lichen"**
  *   *Scenario:* A lichen (fungus + alga) evolves an expensive shared structure enhancing drought tolerance. Reproduction occurs *only* when a fungal spore and algal cell from the *same parent lichen* disperse together via a specialized propagule (bottleneck). Horizontal acquisition is impossible.
  *   *Principle's Prediction:* **"Super Lichen" IS a unit of selection.** Passes (1): Shared structure is an integrated adaptation. Passes (2): Propagule creates a bottleneck ensuring parent-offspring resemblance for the *composite trait*. Passes (3): Within-lichen conflict suppressed by co-transmission. It functions as a cohesive evolutionary individual.
  *   *Contrast:* If the alga and fungus assembled randomly each generation, it would NOT be a unit.

  **What Your Verdicts Get Right & Where the Principle Challenges Them:**

  *   **Saved:** Mouse Distorter (Gene), Peacock (Organism), Ants (Gene), Body (Organism), Vertical Symbiont (~Composite Vehicle), Horizontal Symbiont (No), Bottleneck Colony (Yes), Fusion Colony (No).
  *   **Needs Adjustment:** **Chimeric Slime Mould.** Your "slug-level" verdict is incompatible with the chimerism and lack of bottleneck. The principle argues selection primarily acts on *amoebas* within the slug context. Cooperation persists only if benefits to cooperating amoebas outweigh cheating opportunities *for them*, or if mechanisms evolve (like kin recognition in *some* slime molds) suppressing defection. In the chimeric case, it's not group selection.
  *   **Clarified:** The "reproduction test" (bottleneck) is crucial (Clause 2), but it must be combined with functional integration (Clause 1) and constraint of lower levels (Clause 3). The Price Equation *describes* covariance, but the Vehicle Criterion identifies the level where adaptations *reside* and selection is *most causally efficient*.

  **Why the Gene-Level Redescription Feels Empty (e.g., Peacock):** Genic selection is always *true* in the sense that allele frequencies change. The Vehicle Criterion identifies the level(s) where the *functional adaptations* are organized and where the *causal action* of selection is most directly apparent. Describing the peacock's train solely in terms of "long-tail alleles" misses the *organismal biology* of mate choice, display, and competition that the trait functions within. The gene is the replicator; the organism is the vehicle.

  **The Honest Answer:** Your intuition that the chimeric slime mold slug is a unit of selection is likely incorrect given the specific scenario (unrelated amoebas). Selection is acting primarily on the amoebas within the slug, not *on the slug as a cohesive whole*. Your other verdicts align remarkably well with the Vehicle Criterion, which emphasizes functional integration and developmental bottlenecks as key to defining evolutionary individuals.
