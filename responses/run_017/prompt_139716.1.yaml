prompt: |-
  I cover science and ideas for a mid-size outlet, and I've been chewing on something a friend from grad school mentioned once — Good's theorem on the value of information, the result (I.J. Good, 1960s something-or-other, I never read the original) that free information can't have negative expected value for someone who maximizes expected utility coherently, and, more usefully for me, that a piece of information is worth nothing unless it could change what you'd actually do. I want to turn that into something I can run, because my real problem isn't "should I believe this study," it's "should I wait for one more thing before I file." This comes up maybe twice a week: I have a draft, a deadline six to twenty hours out, a standards editor who has to sign off on anything carrying a health or risk claim, and one or two calls I could still make — the study's statistician, a second lab that isn't in the press release, the agency press office. Everyone in my newsroom has an opinion and they're all vibes ("it can't hurt to check one more source"), and I'd like an actual procedure with a fixed order of questions and defined stopping points instead of that.

  Here's the wrinkle I keep getting stuck on, and I want it handled head-on rather than smoothed over. When I do the extra reporting, half the time what changes isn't the claim but the verb: "shows" becomes "suggests," "doubles the risk" becomes "is associated with a higher risk." I've started calling this the hedge sink — information whose entire effect is to soften the hedging language rather than the content. Taken naively, Good's theorem says that information was worthless, since my publish/don't-publish decision was never going to flip on it. But the hedge is an action I take, and what readers do (do they stop taking the thing, does the agency open a review) turns on it, and once you let hedges count as actions it feels like any scrap of information can change some action and the theorem stops biting. So should the procedure count a change of verb as a change of action? If it does, what's left of the discipline? My half-baked thought is a two-decision rule — value the information against my filing decision and separately against the downstream reader's or regulator's decision, and treat it as the interesting case when those two disagree — but I don't trust it and I'd rather have something I can defend to my editor.

  So: give me a decision procedure, in words, that a reporter with no stats training can run in under an hour, on the back of an envelope if need be. It should spell out what to write down first (I'm guessing: name the decision the information is supposed to change before you go get it), what counts as a sufficient answer to each question, where it stops with "file now," where it stops with "wait," where it hands the decision to my editor because it's a values question rather than a factual one (how bad a false alarm is relative to a missed harm is not mine to settle), and where it simply doesn't work. Two things it definately has to handle: scoop risk, meaning if I wait for the replication a competitor may file first and my information becomes worth approximately nothing because the public conversation already moved without me; and the fact that my "second source" usually isn't independent — same lab, same funder, same press release feeding four outlets — which I suspect makes the value of that extra call much smaller than it feels. Then run the procedure on three cases: (a) a preprint, n=23, linking a common sleep supplement to elevated liver enzymes, with a rumor that a bigger outlet already has it; (b) a leaked draft of a government risk assessment for an industrial solvent, where the final version is due in nine days and might well come out softer; and (c) a piece I've spent three weeks on and love, where I'm dying to make one more call to the lead author — I want to see the procedure tell me something I don't want to hear, so if it concludes that call is theater, say so plainly. Finally, be straight with me about what the procedure can't do: is this just expected-value bookkeeping with a reporting-shaped paint job, or does it catch something my newsroom intuition actually misses?
reasoning: |-
  Okay, the user is a science reporter dealing with the "hedge sink" problem—where extra reporting often only changes the wording (e.g., "shows" to "suggests") without altering the core decision to publish. They want a practical decision procedure grounded in Good’s theorem but struggle because hedging feels like an "action," potentially making any information valuable. Their real pain points are deadline pressure, scoop risk, and non-independent sources.  

  First, I need to reconcile Good’s theorem with the reality of hedging. Good’s core idea is that information only has value if it could change a decision. But in reporting, changing a verb *is* a decision—it affects reader/regulator actions. The key is distinguishing *substantive* actions (publish/don’t publish) from *presentation* actions (wording). The procedure must treat these separately to avoid valuing trivial info.  

  The user’s "half-baked" two-decision idea is actually spot-on. I’ll formalize it: split decisions into (1) **filing** (publish now/not) and (2) **presentation** (verb strength). Information gets value only if it could flip #1 *or* force a material change in #2 that alters downstream impact. "Material change" means the wording shift meaningfully affects reader behavior (e.g., "doubles risk" → "linked to risk" might change medical decisions).  

  Now, building the procedure. It needs:  
  - **Triggers**: When to run it (e.g., deadline <24h, draft ready).  
  - **Inputs**: Explicitly define the decisions upfront.  
  - **Hurdles**: Three questions:  
    1. *Filing flip?* Could this info make me kill the story? (If yes, wait.)  
    2. *Material hedge?* Could it weaken wording *and* would that change reader actions? (Requires evidence, not vibes.)  
    3. *Cost/Benefit*: Weigh scoop risk, source independence, time.  
  - **Outputs**: Clear "file now," "wait," or "hand to editor" paths.  

  For the "hedge sink," Question #2 is the gatekeeper. It forces the reporter to articulate *how* a softer verb changes outcomes (e.g., "If we say 'linked,’ readers won’t stop taking the supplement; if we say 'causes,’ they might"). If they can’t justify it concretely, the info has no value.  

  Handling user’s specifics:  
  - **Scoop risk**: Built into cost/benefit—waiting has high cost if competitors are close.  
  - **Non-independent sources**: Explicitly called out; they rarely change decisions.  
  - **Editor handoff**: When impact asymmetry (false alarm vs. missed harm) isn’t the reporter’s call.  

  Testing on their cases:  
  - **(a) Sleep supplement preprint**: Scoop risk high, source non-independent → file now.  
  - **(b) Leaked gov draft**: Final report in 9 days could flip filing decision → wait.  
  - **(c) "Love story" call**: Unlikely to flip filing/presentation → theater.  

  Finally, the procedure’s edge: It’s not just EV math—it combats "vibes" by forcing specificity. But it can’t resolve values calls (e.g., "how bad is a false alarm?") or predict black swans. The real win is killing the "just one more call" reflex when the info can’t *do* anything.
answer: |-
  Below is a **Decision Procedure for Deadline Reporting** based on Good's theorem, designed for speed, defensibility, and handling your "hedge sink" problem. It treats **filing decisions** (publish/don’t) and **presentation decisions** (verbs/hedges) separately to avoid valuing trivia. The core insight: **Information is worthless unless it could change a *material action*—where "material" means altering outcomes for readers or regulators, not just wording.**

  ---

  ### **The Procedure: 3 Questions, 1 Worksheet**  
  *(Run this when your draft is ready, deadline is <24 hours, and you’re eyeing "one more call")*  

  #### **STEP 0: PREP WORK (5 min)**  
  Write this down:  
  1. **The Decision at Stake**:  
     - **Filing Decision**: "Publish this story now? (Yes/No)"  
     - **Presentation Decision**: "What verb/claim strength will I use? (e.g., ‘proves’ vs. ‘suggests’)"  
  2. **Your Current Leaning**:  
     - Filing: "I’m leaning toward [Publish/Not Publish] because ______."  
     - Presentation: "I’ll use verb [X] because ______."  
  3. **The Information Source**: Name it (e.g., "Call Dr. Lee at Lab B").  
  4. **Scoop Risk**: "Competitors are [actively chasing this/not a concern]."  
  5. **Source Independence**:  
     - Is this source *truly independent*? (Same lab/funder/press release? → Low independence)  
     - Score: 1 (shared bias) to 5 (fully independent).  

  ---

  #### **STEP 1: ASK 3 QUESTIONS (10 min per source)**  
  **Question 1: Could this flip my FILING decision?**  
  - *What would make me kill the story?* (e.g., source reveals fraud, major flaw, retraction).  
  - **Sufficient Answer**: "Yes, if [specific fact] emerges." → **WAIT and get info**.  
    "No." → **Move to Question 2**.  

  **Question 2: Could this force a MATERIAL change to PRESENTATION?**  
  - *Material = Changes reader/regulator behavior.* Not just verbs! Ask:  
    - "If I soften ‘shows’ to ‘suggests,’ will it change **what readers DO**?" (e.g., "Readers won’t stop taking the supplement if I say ‘suggests,’ but they might if I say ‘shows’").  
    - "Does this affect **regulatory/policy outcomes**?" (e.g., "Saying ‘linked to cancer’ triggers an agency review; ‘may be linked’ does not").  
  - **Sufficient Answer**:  
    - "Yes, and here’s **evidence** it changes behavior (e.g., past reader surveys, agency protocols)." → **WAIT and get info**.  
    - "No, or it’s just **vibes**." → **Info has low/no value. FILE NOW**.  

  **Question 3: Is the COST of waiting < BENEFIT of the info?**  
  - *Weigh*:  
    - **Cost**: Scoop risk (high if competitors are close), wasted time, deadline pressure.  
    - **Benefit**: Probability source is independent × impact of change (from Q1/Q2).  
  - **Sufficient Answer**:  
    - High scoop risk + low source independence → **Benefit < Cost. FILE NOW**.  
    - Low scoop risk + high independence + material change possible → **WAIT**.  

  ---

  #### **STEP 2: DECISION PATHS**  
  - **FILE NOW**: If Q1=No *and* (Q2=No *or* Q3=Cost>Benefit).  
  - **WAIT**: If Q1=Yes *or* (Q2=Yes *with evidence* *and* Q3=Benefit>Cost).  
  - **HAND TO EDITOR**: If Q1/Q2 hinge on **values** (e.g., "How bad is a false alarm vs. missed harm?").  
  - **DOESN’T WORK**: If outcomes are unknown (e.g., "Will readers panic?" with no data).  

  ---

  ### **Test Cases**  
  #### **Case (a): Sleep supplement preprint (n=23), rumor of competitor scoop**  
  - **Prep**: Filing = "Publish" (timely). Presentation = "Weak verb (‘may elevate enzymes’)". Scoop risk = HIGH. Source = Lab B (same funder; independence=2/5).  
  - **Q1**: Will a call kill the story? *Unlikely (preprint exists, n=23 is small but not fraudulent). → No.*  
  - **Q2**: Will verb change alter behavior? *Unlikely. Readers won’t act on n=23; regulators ignore it. Softening verb adds nothing material. → No.*  
  - **Q3**: Cost of waiting? *HIGH (scoop risk). Benefit? LOW (non-independent source). → Cost > Benefit.*  
  - **Decision**: **FILE NOW**.  

  #### **Case (b): Leaked gov risk assessment (final in 9 days)**  
  - **Prep**: Filing = "Publish if leak is credible". Presentation = "Strong verb (‘causes cancer’) based on draft". Scoop risk = LOW (you have leak). Source = Agency press office (independence=4/5).  
  - **Q1**: Could their comment kill the story? *Yes, if they deny the leak’s validity → Weak yes.*  
  - **Q2**: Could verb change be material? *Yes, if final report softens language, regulators won’t act. → Yes, with evidence (past softened reports halted reviews).*  
  - **Q3**: Cost of waiting? LOW (9 days left). Benefit? HIGH (independent source, impacts policy).  
  - **Decision**: **WAIT** (but set a 48h deadline for response).  

  #### **Case (c): "Love story" call to lead author**  
  - **Prep**: Filing = "Publish" (ready). Presentation = "Verb ‘shows’". Scoop risk = LOW. Source = Lead author (independence=1/5 – biased).  
  - **Q1**: Kill the story? *No (already vetted). → No.*  
  - **Q2**: Material verb change? *Unlikely. Author won’t undercut their work; even if they hedge, readers won’t change behavior. → No evidence.*  
  - **Q3**: Cost? MEDIUM (time sink). Benefit? NEGLIGIBLE (non-independent, no material change).  
  - **Decision**: **FILE NOW. The call is theater.**  

  ---

  ### **What This Can and Can’t Do**  
  **Strengths (vs. newsroom vibes)**:  
  - **Kills "hedge sink"**: Forces you to prove verb changes alter *outcomes*, not just words.  
  - **Exposes non-independence**: Scores source bias, preventing wasted calls to captured labs.  
  - **Quantifies scoop risk**: Makes opportinity cost explicit.  
  - **Handles values conflicts**: Flags when to escalate to your editor (e.g., risk tolerance).  

  **Limitations**:  
  - **Not a stats tool**: Doesn’t evaluate study quality (assumes you’ve done basic vetting).  
  - **Relies on your estimates**: If you’re bad at judging "will readers change behavior?", Q2 fails.  
  - **Black swans**: Can’t value information that reveals unknown unknowns (e.g., source casually mentions fraud).  
  - **Paint job?**: Yes, it’s **expected value accounting**—but structured to combat reporter-specific biases (sunk cost in "love stories," herd instinct for "one more call").  

  **Why it bites**: It rejects information that can’t move needles. Your newsroom’s "can’t hurt to check" ignores **costs** (deadlines, scoops) and **false precision** from non-independent sources. This doesn’t.  

  **Final tip**: When Q2 (material hedge) is murky, **default to filing**—and let your standards editor force the verb change later. Their job is hedging; yours is news judgment.
