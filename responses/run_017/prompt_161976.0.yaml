answer: |-
  ### Thought Experiment Design: Distinguishing Heterogeneity and Common-Figure Views

  I will design a pair of probes that meet all your constraints. The key variable differentiating the probes is the **presence of a dynamic, non-geometric invariant**—specifically, a wobbling motion tied to the object's physical instability when placed on a surface. This variable is chosen because it leverages a property that can be perceived both haptically (through touch) and visually (through motion patterns), without relying on spatial form. The heterogeneity view can endorse success in the first probe because the wobble is an amodal event (e.g., a temporal pattern like instability) that does not require transfer of geometric shape; it is a "bridge" through a non-spatial property. In contrast, the common-figure view attributes success to the transfer of spatial figure, so it predicts above-chance performance on both probes. Crucially, your invariant idea (e.g., wobble as a bridge) is incorporated here, but I argue it is insufficient alone because the standard cube-and-sphere test often includes *accidental* invariants (like shadows or how objects rest) that both views could explain. By isolating a *controlled, non-geometric* invariant (wobble) in one probe and removing it in the other, we force a divergence: the heterogeneity view denies transfer when only static shape is available, while the common-figure view asserts it.

  **Why your invariant idea needs refinement:** Your instinct to use an invariant is sound, but accidental invariants (e.g., a cube's shadow or its stable rest on a table) are problematic because they could allow the heterogeneity view to explain a "success" in the standard Molyneux test through learned associations, not innate commonality. For instance, if a newly sighted patient recognizes a cube by its shadow, it might stem from haptic experience with light/shadow correlations (learned from others), not direct shape transfer. My design avoids this by using (1) a *non-accidental*, intrinsic invariant (wobble) that is tied to the object's physics and (2) eliminating environmental cues (e.g., uniform lighting, no shadows) to isolate the variable. This ensures that a positive result in the dynamic probe is explicable by the heterogeneity view without conceding geometric commonality.

  ---

  ### Experimental Setup Overview
  - **Patient:** Adult with dense bilateral cataracts from infancy, no pattern vision pre-surgery. Tested on the day dressings are removed, with normal visual acuity post-surgery confirmed via standard optometric tests.
  - **Objects:** Two pairs of unfamiliar solids, all made of identical smooth, matte-gray plastic to eliminate texture/color cues. Pair 1 (for Probe 1) consists of **Object A** (a hemisphere with a flattened, unstable base that wobbles when nudged) and **Object B** (a cone with a wide, stable base that does not wobble). Pair 2 (for Probe 2) consists of **Object C** (a tetrahedron) and **Object D** (a torus segment, e.g., a small, curved donut-like shape). All objects are unnamed; the patient knows them only by arbitrary haptic labels (e.g., "Object 1" for A/C, "Object 2" for B/D). Objects are never touched during the session.
  - **Pre-Session Haptic Training:** Prior to surgery, the patient learns to distinguish each pair by touch alone (e.g., "Object A wobbles when placed down; Object B does not"). No visual descriptions are given.
  - **In-Session Visual Screening:** Conducted before probes. **Haptic screening:** Objects are presented one at a time (hidden from view), and the patient identifies each by label (e.g., "This is Object A") to confirm discrimination. **Visual screening:** Objects are presented visually (not paired with touch): first, the patient views a training set of two *novel* visually distinct objects (e.g., a spiky star and a smooth oval) and learns to discriminate them via feedback (e.g., "Which is the spiky one?" with corrective feedback). This establishes basic visual ability without cross-modal pairing. Then, for the test objects, the patient views each pair (A/B and C/D) statically and performs a same/difference task (e.g., "Do these two look the same or different?"). This confirms visual discriminability without requiring identification.
  - **Purely Visual Training Rationale:** The feedback-based training on within-vision discriminations (using novel objects) ensures the patient can process basic visual features like edges or motion. It is not in dispute because it involves *only* visual-to-visual associations (e.g., learning that a spiky shape looks "pointy"), not cross-modal links. It does not involve the test objects or any haptic pairing.
  - **Probe Administration:** Two probes in one session, order randomized. Each probe is a two-alternative forced choice (2AFC) on first presentation, single trial, no feedback. Objects are concealed under cloth until the trial begins. The patient responds by pointing.

  ---

  ### Probe 1: Dynamic Invariant Present
  **Scene:** The patient sees Object A and Object B placed 50 cm apart on a featureless white table under uniform, shadowless lighting. An experimenter gently nudges each with a rod, causing Object A to wobble visibly (oscillating side-to-side) while Object B remains stable. No sound is produced. The patient is asked: "Point to the one that wobbles as you know from touch—Object A or Object B?"

  **Heterogeneity View Verdict:** Predicts **pass** (correct identification).  
  **Reasoning:** The wobble is a dynamic, non-geometric invariant (instability) that is amodal—it is perceived as the same "event" in both touch (e.g., haptic vibration) and vision (e.g., oscillating motion). This view holds that such temporal patterns are not tied to specific senses; they are abstract properties learned through multisensory experiences (e.g., feeling and seeing a fall). Thus, the patient recognizes the wobble visually because the invariant is already tied to the object haptically, *without* requiring transfer of spatial form. Success stems from a non-spatial "bridge," not geometric commonality.

  **Common-Figure View Verdict:** Predicts **pass** (correct identification).  
  **Reasoning:** Extension and figure are common to both senses, so the patient recognizes Object A by its shape (e.g., the hemisphere) immediately. The wobble may aid recognition, but it is superfluous; the shared spatial structure is sufficient.

  ---

  ### Probe 2: Dynamic Invariant Absent
  **Scene:** The patient sees Object C and Object D placed 50 cm apart on the same table under identical conditions. Both are stationary and never moved. The patient is asked: "Point to the one you know by touch as Object C—Object C or Object D?"

  **Heterogeneity View Verdict:** Predicts **chance performance** (50% accuracy).  
  **Reasoning:** Without a non-geometric invariant (like wobble), only static shape is available. Since ideas of sight and touch are heterogeneous, the visual appearance of Object C (e.g., the tetrahedron's angles) has no necessary connection to its haptic feel. The patient cannot transfer shape information; any match would require learned associations from post-surgery experience, which is absent here. Inference is impossible because no verbal, dynamic, or environmental cues exist to bridge the modalities.

  **Common-Figure View Verdict:** Predicts **above chance performance** (significantly >50% accuracy).  
  **Reasoning:** Figure (e.g., the tetrahedron's spatial properties) is a common notion accessible to both senses. The patient, possessing the figure haptically, immediately recognizes it visually without learning. The static shape alone enables transfer, as extension is inherent to both modalities.

  ---

  ### Key Variable and Design Rationale
  - **Variable:** Presence of a **dynamic, non-geometric invariant** (wobble) in the visual array. Probe 1 has it; Probe 2 does not.
  - **How It Separates the Views:** Both views agree on Probe 1's success but for different reasons (heterogeneity via amodal event, common-figure via shape). They disagree on Probe 2: heterogeneity predicts chance (no transfer without a bridge), while common-figure predicts success (shape transfer). This isolates cross-modal *shape* transfer from success via inference (e.g., using the wobble bridge).
  - **If Variable Removed:** Without the dynamic invariant (e.g., both probes static), the design collapses into the standard Molyneux problem (cube-and-sphere). Both views might then attribute any success to accidental invariants or luck, making it evidentially inert.
  - **No Floor/Ceiling Effects:** Shapes are equally unfamiliar and discriminable (per screening). Sighted pre-tests confirm that static discrimination (e.g., tetrahedron vs. torus) is as easy as wobble detection (e.g., 95% accuracy in controls), ensuring tasks are non-trivial and matched.

  ---

  ### Strongest Objection and Mitigation
  - **Objection from Common-Figure View:** "Probe 2 failure could stem from visual discriminability issues, not lack of transfer. The static shapes (C/D) might be harder to distinguish than the dynamic pair (A/B), even if screening shows basic difference detection."  
    **Blunting Modification:** Pre-screen all objects with sighted, naive subjects in a 2AFC task (no touch). Select pairs where static shape discrimination (C/D) and wobble detection (A/B) have identical accuracy (e.g., both 95%). This ensures difficulty is matched, so failure in Probe 2 cannot be attributed to discriminability.  
    **Residue:** The design cannot settle whether shape transfer *might* occur for simpler shapes (e.g., cube vs. sphere), but it tests if a positive Molyneux result requires a non-spatial bridge. It also cannot rule out that the common-figure view could be salvaged by redefining "figure" to include dynamics, but this would conflate spatial and non-spatial properties.

  - **Objection from Heterogeneity View:** "The wobble in Probe 1 might not be truly amodal; the patient could infer the visual wobble from haptic experience via causal reasoning (e.g., 'instability looks like this'), which still requires learning, not innate recognition."  
    **Blunting Modification:** Use a subtle, irregular wobble (e.g., chaotic oscillation) that is hard to describe verbally, minimizing inference. Emphasize that the heterogeneity view *endorses* such non-spatial bridges as learned associations (per Locke/Berkeley), so this objection reinforces its core commitment—success in Probe 1 does not imply geometric commonality.  
    **Residue:** The design cannot prove that the wobble bridge is "innate," but it doesn't need to; it only requires that the heterogeneity view can *explain* Probe 1 without shape transfer.

  ---

  ### Third Position: Sensorimotor Account
  A sensorimotor account (e.g., Alva Noë) emphasizes that perception depends on active exploration and the "laws" of sensorimotor contingency. It would diverge from both views on Probe 2:  
  - **Probe 1 Prediction:** **Pass** (like both views), because the wobble provides an immediate affordance for action (e.g., "this can be knocked over"), enabling recognition via embodied interaction.  
  - **Probe 2 Prediction:** **Chance or near-chance** (aligning with heterogeneity view), because static objects offer no sensorimotor engagement; without prior visual exploration (e.g., moving around the object), the patient cannot "grasp" the shape's sensorimotor contingencies.  
  - **Structural Feature Divergence:** The account peels off due to its reliance on **action-mediated learning**. Unlike the common-figure view, it denies immediate shape transfer; unlike the heterogeneity view, it attributes Probe 1 success to dynamics enabling action, not amodality. The key differentiator is the requirement for motor interaction in shape perception, which is absent in both traditional views.  
  - **Impact on Design:** This account would interpret Probe 2 failure as evidence for sensorimotor dependence, not heterogeneity. To test it, the design could add a third probe allowing movement (e.g., patient walks around static objects), but that exceeds your scope.

  ---

  This design cleanly separates the views: if the patient passes Probe 1 but fails Probe 2, it supports heterogeneity; if both are passed, it supports common-figure. Critically, Probe 1 success alone is evidentially inert for the common-figure view, as it could arise from a non-spatial bridge. The dynamic invariant variable ensures that only Probe 2 tests shape transfer directly.
