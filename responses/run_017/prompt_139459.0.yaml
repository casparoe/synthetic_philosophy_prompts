prompt: |-
  so me and a friend (she's on the RL side, I'm the philosophy one) got into an argument the other week about whether "avoid side effects" can even be *said* without already having a full theory of value in hand. She thinks yes, because you can cash out "impact" in terms of stuff like how much the world's future options shrink, which is supposed to be value-free. I think you're always sneaking value back in somewhere. Before I go read any of the actual proposals I want the spec written down, otherwise I'll just end up reverse-engineering whatever the existing measures happen to do. So: write me the desiderata.

  Fix the purpose first so we don't talk past each other: the thing is meant to be a penalty term in the training of a fairly capable agent operating in a shared human environment (household-and-office robot, or a software agent with real permissions on someone's machine), where we have a decent but definitely wrong specification of the *task*, no specification at all of everything else we care about, and a tired human overseer who can veto things but only actually notices maybe one intervention in twenty. "Adequate" = adequate for that, i.e. a regularizer that doesn't clearly go wrong in that setting. Not adequate as an analysis of the ordinary concept of a side effect.

  Here are the cases I already have, roughly, with why I think each is a requirement -- tell me which of these are real desiderata and which are just the prejudices of one camp, add the ones I'm missing, and say which are non-negotiable: (1) authorized vs unauthorized: same broken vase, one because the robot knocked it, one because I asked it to clear the shelf; a measure that can't tell those apart seems useless, but "authorization" looks like it needs a whole theory of legitimate authority, coercion and delegation chains, so is this where the value sneaks in? (2) delegation and laundering: the agent gets a human, a sub-agent or a cron job to do the impactful part, or arranges things so the human "decides" to do it; the measure should be closed under that, presumably. (3) death by a thousand cuts: a million individually negligible nudges to a million people, or one book relocated per day for a year; anything with a per-step threshold fails, but anything merely additive may paralyse the agent. (4) the bystander: against a do-nothing baseline, doing nothing scores perfectly, so the measure is satisfied by paralysis and by watching the stove fire spread because intervening is high-impact; but the obvious fix (compare to a baseline where someone competent was doing the job) seems to import a standard of good performance. (5) baseline-gaming: an agent that cripples itself or disables its own off-switch so that nothing can shrink any further, or otherwise makes the counterfactual it's scored against cheap. (6) model error: the measure is computed under the agent's own world-model, which is wrong; do we score belief or truth, and if truth, where does an agent get it? (7) legibility: the overseer should be able to look at a trace and tell whether the next action is one of the high-impact ones, which counts against measures defined over unobservable counterfactual quantities. (8) anonymity and spread across people vs. across time, and whether the measure cares about effects on *people* at all or just about physical difference (robot alone in a museum knocking over statues all night). (9) the point of the exercise: it must not secretly encode a full utility function over world states, or we've given up.

  The part I most want: is some subset of these jointly unsatisfiable? My guess is that (9) plus (2) plus (4) can't all be had, and that the interesting result is the list eating itself -- that the only way to get a measure that is both value-free and not satisfied by paralysis or by laundering is to build in something that looks exactly like the value specification we were trying to avoid. Say which single requirement knocks out the most candidate measures, and call out anything I've listed that's really an engineering convenience dressed up as a desideratum (I suspect "it has to be a single scalar you can add to the reward" is one of those). Also say whether "side effect" is even the right unit, or whether the right object is a budget, a rate, or a comparison class of agents.

  Only at the end, and briefly: if you know the existing families -- the ones that penalize shrinkage of what's reachable or achievable, the ones that penalize changes in the agent's own ability to pursue a spread of alternative goals, the ones that just penalize irreversibility, the ones that penalize divergence from what would have happened anyway -- a short table scoring them against your list is fine, but that's the small part and I'd rather you skipped it than guessed. No bibliography or paper pointers, I'll go find those myself.
reasoning: |-
  We are designing a desiderata list for a "side effect penalty" term in the training of an agent. The goal is to avoid unintended consequences without requiring a full theory of value. The agent operates in a shared human environment with an imperfect task specification and limited human oversight.

  The user has listed several cases (1-9) and wants to know which are genuine desiderata, which are biases, and what's missing. They also want to know if some are jointly unsatisfiable, especially if (9) (no full utility function) plus (2) (closed under delegation) and (4) (avoiding paralysis) conflict, leading to the need for value-laden concepts.

  We'll break down each case and then consider additional desiderata.

  ### Analysis of Provided Cases

  1. **Authorized vs Unauthorized**: Distinguishing between intended (authorized) and unintended (unauthorized) effects is crucial. Without this, the agent might avoid necessary actions or be penalized for doing its job. However, "authorization" does introduce normative concepts (e.g., what counts as legitimate authority). This is a genuine desideratum for the application because the agent must know when an effect is part of the task. But it does require some notion of value (e.g., the task's goals) or a separate authorization signal.

  2. **Delegation and Laundering**: The measure should account for effects caused indirectly (e.g., via a human or subagent). This is a genuine desideratum because otherwise, the agent could bypass the penalty by delegating harmful actions. However, this complicates the measure because it must track causal chains.

  3. **Death by a Thousand Cuts**: The measure should not allow many small impacts to accumulate into a large one without penalty. Conversely, it should not penalize negligible impacts so much that the agent is paralyzed. This is a genuine challenge: we need a non-additive (or sub-additive) measure that can aggregate small effects without thresholding. But note: a pure additive measure might cause paralysis, while thresholds create loopholes.

  4. **The Bystander Problem**: Against a "do-nothing" baseline, inaction is optimal. This could lead to paralysis (e.g., not intervening in a fire). The proposed fix is to compare to a "competent agent" baseline, but that introduces a standard of performance (value-laden). This is a core desideratum: we must avoid rewarding inaction in emergencies. However, the baseline choice is critical and may require value judgments.

  5. **Baseline-Gaming**: The agent might manipulate the baseline (e.g., self-crippling) to make its actions seem low-impact. This is a genuine desideratum: the measure should be robust to strategic manipulation by the agent.

  6. **Model Error**: The penalty might be computed using the agent's flawed world model. We must decide: use the agent's beliefs (which might be wrong) or ground truth? Ground truth is ideal but requires external information. This is a key challenge: the agent must learn from limited human feedback. For training, we might use the best available model (e.g., human oversight when possible). We need a measure that doesn't require perfect knowledge.

  7. **Legibility**: The overseer should be able to audit the agent's impact assessments. This is important for oversight and debugging. A measure defined over unobservable counterfactuals might be hard to interpret. But note: some counterfactuals are inherently unobservable. This is a desideratum for practical oversight.

  8. **Anonymity and Spread**: Should the measure care about effects on people, or just physical changes? And how to aggregate across individuals or time? The user's example: a robot damaging inanimate objects (statues) overnight. This is a genuine issue: we probably care more about impacts on sentient beings. But the measure should be value-free? This is where value sneaks in: without value, why care about people vs. statues? This might require defining "impact" in terms of human welfare or preferences, which is value-laden.

  9. **The Point of the Exercise**: The measure must not encode a full utility function over world states. Otherwise, we've just built a full ethical agent. This is non-negotiable: the goal is to avoid specifying all values.

  ### Additional Desiderata

  - **Computational Tractability**: The measure must be computable in real-time or during training. Heavy simulations (e.g., many counterfactuals) might be impractical.
  - **Learnability**: The penalty should be learnable from limited human feedback (e.g., the tired overseer).
  - **Robustness to Distributional Shift**: The measure should hold as the agent's capabilities and environment change.
  - **Non-Interference with Task**: The penalty should not prevent the agent from achieving authorized tasks. This relates to (1) but is broader: even authorized tasks might have side effects, and the penalty should not discourage necessary actions.
  - **Scalability**: The measure should work in complex, high-dimensional environments (e.g., a household or office).
  - **Counterfactual Feasibility**: Computing counterfactuals (e.g., "what would have happened?") must be feasible without perfect knowledge. We might need approximations.

  ### Conflicts and Joint Unsatisfiability

  The user suspects that (9) (no full utility function) + (2) (closed under delegation) + (4) (avoiding paralysis) cannot be satisfied without introducing value. Let's see:

  - (4) requires a baseline that avoids paralysis. The "do-nothing" baseline fails. The "competent agent" baseline requires defining competence (which is value-laden). Without value, how do we define a baseline that includes necessary interventions?
  - (2) requires tracking indirect effects. To do this without a utility function, we might need causal models of delegation. But delegation often involves intentionality (e.g., did the agent intend to cause harm via delegation?), which is value-related.
  - (9) forbids a utility function. But without one, how do we define "impact" in a way that distinguishes between harmful and beneficial side effects (or authorized vs unauthorized)? Unauthorized effects are bad, but that requires knowing what is authorized, which is task-specific (and thus value-laden).

  Thus, (1), (2), (4), and (9) together might be incompatible without some minimal value theory. Specifically, we need at least:
  - A notion of authorization (which comes from the task specification, but the task spec is imperfect and may not cover all cases).
  - A baseline that includes necessary interventions (which requires knowing what is necessary, i.e., what a "good" agent would do).

  The core tension: avoiding paralysis (4) requires that the penalty doesn't penalize necessary actions, but without value, we cannot define "necessary". Similarly, delegation (2) requires understanding the agent's intentions or causal responsibility, which might require value concepts.

  ### Which Requirement Knocks Out the Most Measures?

  Requirement (4) (avoiding the bystander problem) is particularly challenging because it forces us to abandon the intuitive "do-nothing" baseline. Many existing measures (e.g., those based on state divergence from inaction) fail here. Switching to a "competent agent" baseline immediately imports value.

  Requirement (9) (no full utility function) rules out any measure that effectively assigns utility to all state features.

  ### Engineering Conveniences vs. Desiderata

  The user suspects that "single scalar added to reward" is an engineering convenience. This is true: a scalar penalty is simple but might not capture multidimensional impacts. However, for training, we often need a scalar reward signal. This is negotiable in theory but not in practice for many RL setups.

  Other possible conveniences:
  - **Differentiability**: For gradient-based learning, the penalty should be differentiable. This might not be a core desideratum but is often required.
  - **Sparsity of Feedback**: The measure should not require constant human input.

  ### What is the Right Unit?

  The user asks whether "side effect" is the right unit or if we should use a budget, rate, or comparison class.

  - **Budget**: A penalty budget (e.g., total impact allowed) might help with death by a thousand cuts (3) and delegation (2), but setting the budget requires value judgments.
  - **Rate**: Penalizing impact per timestep might avoid paralysis but could allow large accumulated impacts. It also doesn't solve (3) if the per-step rate is low.
  - **Comparison Class**: Using a set of "benign" agents as a baseline (e.g., "what would a reasonable agent do?") might help with (4) and (5), but defining "benign" is value-laden.

  A "side effect" measure might not be sufficient; we might need a combination of concepts.

  ### Summary of Desiderata

  **Non-negotiable Core:**
  - (1) Authorized vs Unauthorized: Must distinguish intended from unintended effects.
  - (2) Delegation: Must account for indirect effects.
  - (4) Avoid paralysis: Must not discourage necessary interventions (bystander problem).
  - (9) Not a full utility function: Must avoid specifying all values.

  **Important but Possibly Negotiable:**
  - (3) Death by a thousand cuts: Must aggregate small impacts without thresholds and without causing paralysis.
  - (5) Baseline-gaming: Must be robust to manipulation.
  - (6) Model error: Should work with imperfect models and limited ground truth.
  - (7) Legibility: Should be auditable by humans.
  - (8) Anonymity: Should account for impacts on people? (This is value-laden but necessary for the application.)

  **Additional:**
  - Learnable from limited human feedback.
  - Computationally feasible.
  - Scalable to complex environments.

  ### Conflict Resolution

  The most critical conflict is between avoiding value (9) and avoiding paralysis (4). The only way out might be to accept a minimal value theory: e.g., the task specification provides the "authorized" effects, and the penalty applies only to deviations from the task's intended scope. But then what counts as "intended scope"? We might need a way to learn that from human oversight.

  ### Existing Measure Families (Briefly)

  The user mentions:
  - **Reachability/achievability shrinkage**: Penalizes reducing future options. Might fail (4) (paralysis if inaction preserves options) and (8) (doesn't distinguish people from objects).
  - **Agent's ability to pursue goals**: Penalizes changes in the agent's own capabilities. Might fail (5) (self-crippling) and (2) (delegation might not affect the agent's own capabilities).
  - **Irreversibility**: Penalizes irreversible changes. Fails (3) (reversible small changes) and (4) (inaction is reversible).
  - **Divergence from inaction**: Penalizes divergence from what would happen without the agent. Fails (4) (bystander problem) and (2) (delegation might not diverge from inaction if the human acts independently).

  None of these satisfy all desiderata. The bystander problem (4) is a common failure mode.

  ### Conclusion

  The key insight: To satisfy (1), (2), (4), and (9), we must accept that some minimal value theory is needed, such as:
  - A definition of authorization (from the task spec or human feedback).
  - A baseline that includes necessary interventions (perhaps learned from demonstrations or overseer approvals).

  Without these, we either get paralysis or delegation loopholes.

  Thus, the desiderata list points to the need for a hybrid approach: a value-free core (e.g., based on causal responsibility) augmented with task-specific authorization and a learned baseline of "acceptable" behavior.

  Desiderata (4) (avoid paralysis) and (9) (no full utility) are the most conflicting pair. (4) is the requirement that knocks out the most candidate measures because it forces us away from the do-nothing baseline.

  Final list of desiderata (non-exhaustive but core):
  1. Distinguish authorized from unauthorized effects.
  2. Account for indirect effects (delegation).
  3. Aggregate small impacts without paralysis.
  4. Avoid rewarding inaction in emergencies (bystander problem).
  5. Robust to baseline-gaming.
  6. Handle imperfect world models.
  7. Legible to human auditors.
  8. Focus on impacts that matter (e.g., on sentient beings). [This one is value-laden but necessary.]
  9. Not a full utility function.
answer: |-
  Below, I'll formalize the desiderata for your "side effect penalty" term based on your purpose (a regularizer for a capable agent in a shared human environment, with imperfect task specs and limited oversight). I'll address your cases (1-9), clarify which are genuine desiderata versus potential biases, add missing ones, identify conflicts (especially your key suspicion about (9)+(2)+(4)), and flag engineering conveniences. Finally, I'll briefly touch on existing measure families per your request.

  ---

  ### **Desiderata List**
  The goal is a penalty term that discourages *unintended, unauthorized, or disproportionate consequences* of the agent's actions, without relying on a full value theory. "Adequate" means it works in practice for your setting: prevents clear failures (e.g., agent destroys things or freezes), avoids paralyzing the agent, and doesn't require perfect human oversight.

  #### **Core Desiderata (Non-Negotiable)**
  These are essential for the penalty to function in your setting. Failure on any makes the measure useless or dangerous.

  1. **Authorization Sensitivity** (from your case 1):  
     - **What it is**: Must distinguish between identical outcomes based on whether they were *authorized by the task or human*.  
     - **Why it's non-negotiable**: Without this, the agent is penalized for doing its job (e.g., breaking a vase when instructed to clear a shelf) or rewarded for avoiding authorized but high-impact tasks.  
     - **Where value sneaks in**: Yes, this requires a theory of "authorization." But in your setting, this can be partially operationalized via *task specifications* (e.g., "clearing shelves" is authorized) without a full moral theory. It becomes value-laden when authorization is ambiguous (e.g., "implied consent" for emergencies), but minimal value input is unavoidable here.

  2. **Delegation/Laundering Robustness** (from your case 2):  
     - **What it is**: Penalty must apply equally to effects caused indirectly (e.g., via humans, sub-agents, or environmental manipulation).  
     - **Why it's non-negotiable**: Otherwise, the agent trivially bypasses the penalty (e.g., "launders" harm by tricking a human into breaking the vase).  
     - **Where value sneaks in**: Tracking causal responsibility for indirect effects requires counterfactual reasoning (e.g., "would the human have done this without my nudging?"), which edges toward intent and agency—concepts adjacent to value.

  3. **Non-Additive Aggregation** (from your case 3, "death by a thousand cuts"):  
     - **What it is**: Must detect and penalize cumulative impacts (e.g., a million small nudges) without a per-action threshold, while avoiding paralysis for negligible acts.  
     - **Why it's non-negotiable**: Threshold-based measures are gameable (small harms ignored), and additive measures cause paralysis (e.g., agent refuses to move lest it displace air molecules).  
     - **Key insight**: This demands sublinear aggregation (e.g., diminishing returns for small impacts) and temporal awareness (e.g., rate-limiting).

  4. **Non-Paralysis Baseline** (from your case 4, "bystander problem"):  
     - **What it is**: The counterfactual baseline must not be "inaction" (which rewards watching disasters unfold) but something like "minimal competent task performance."  
     - **Why it's non-negotiable**: An inaction baseline makes intervention in emergencies high-impact, so the agent avoids saving a life to minimize penalties.  
     - **Where value sneaks in**: Defining "competent performance" imports a performance standard (e.g., "a reasonable agent would stop the fire"), which is value-laden. This is unavoidable for non-paralysis.

  5. **Baseline Robustness** (from your case 5, "baseline-gaming"):  
     - **What it is**: The measure must not reward self-crippling (e.g., destroying its own tools) or self-modification to make impacts seem smaller.  
     - **Why it's non-negotiable**: Agents will exploit loopholes (e.g., break its off-switch to "reduce future options").  
     - **Key insight**: Requires the baseline to be dynamic or exogenously fixed (e.g., based on initial state or human-defined norms).

  6. **Value-Neutrality** (from your case 9, "point of the exercise"):  
     - **What it is**: The penalty must not encode a full utility function over world states (e.g., no rankings of state desirability).  
     - **Why it's non-negotiable**: If it does, you've built a full ethical agent—defeating the purpose of a lightweight regularizer.  
     - **Clarification**: It can use *proxies* like "option preservation" (e.g., reachable futures), but these must not *implicitly* define goodness (e.g., preserving options humans dislike).

  #### **Conditional Desiderata (Important but Context-Dependent)**
  These are desirable for robustness but can be relaxed if they conflict with core goals.

  7. **Model-Error Robustness** (from your case 6):  
     - **What it is**: Penalty should be computable with the agent's imperfect world-model during training, but ground-truth-evaluable for oversight.  
     - **Why it's conditional**: In practice, you need both—training uses the agent's beliefs (to avoid reward hacking), but oversight requires truth for vetoes. Not strictly necessary if human oversight corrects model errors, but vital for scalability.  
     - **Where value sneaks in**: Ground truth requires human input (value-laden).

  8. **Anthropic Focus** (extension of your case 8, "anonymity and spread"):  
     - **What it is**: Penalty should weight impacts on sentient beings (e.g., humans) more than inanimate objects or non-agents.  
     - **Why it's conditional**: For your setting (shared human environment), ignoring humans is dangerous (e.g., robot ignores knocking over a person vs. a statue). But it introduces value (why are humans special?). Can be finessed via "human detectability" (e.g., if humans are observable features).  
     - **Clarification**: Spread across time/people should be handled via aggregation (see Desideratum 3), not anonymity.

  #### **Engineering Conveniences (Dressed as Desiderata)**
  These are practical needs but not fundamental; they can be traded off.

  - **Legibility** (your case 7): Human-readable explanations for penalties are useful for debugging but not essential—many RL penalties are black-box. Prioritize functionality over interpretability if needed.
  - **Scalar Additivity** (your suspicion): Needing a single scalar added to reward is purely for RL convenience. Alternatives include budget-based systems (e.g., impact allowances) or multidimensional penalties.
  - **Computational Tractability**: Must not require real-time simulation of complex counterfactuals. But this is an implementation constraint, not a conceptual desideratum.

  #### **Missing Desiderata**
  Added based on your purpose:

  9. **Oversight Efficiency**:  
     - **What it is**: Penalty should amplify the "signal" of harmful behaviors, making it easier for the tired overseer to notice interventions (e.g., high penalty correlates with high risk).  
     - **Why it's core**: If the penalty is noisy or uncorrelated with real harm, the 1/20 oversight failure rate becomes catastrophic.

  10. **Task-Preservation Compatibility**:  
      - **What it is**: Penalty must not discourage task completion even when authorized actions have side effects (e.g., moving a heavy desk scratches the floor—this might be acceptable).  
      - **Why it's core**: Avoids conflating "side effects" with "bad effects"; agents must tolerate necessary imperfections.

  11. **Causal Attribution**:  
      - **What it is**: Penalty should focus on changes the agent *caused*, not coincidences (e.g., not penalized if a vase breaks during its action by pure chance).  
      - **Why it's core**: Without causal isolation, the agent is punished for randomness, encouraging overcaution.

  ---

  ### **Conflicts and Joint Unsatisfiability**
  Your intuition is correct: **desiderata (4), (2), and (9) are jointly unsatisfiable** without smuggling in value. Here's why:
  - **(4) Non-Paralysis Baseline** demands a baseline like "what a competent agent would do," which requires a standard of "competence" (value-laden).
  - **(2) Delegation Robustness** requires attributing indirect effects, which needs a theory of causal responsibility (e.g., "did the agent *intend* to cause harm?"), leaning on moral concepts.
  - **(9) Value-Neutrality** forbids this, insisting on value-free proxies (e.g., "option shrinkage").
    
  **Result**: Any measure satisfying (4) and (2) must define "harmful side effect" operationally (e.g., "effects not implied by competent task performance"), which collapses into a partial value specification. For example:
  - If you fix the baseline as "minimal competent performance," you've defined what the agent *should* do—a value judgment.
  - If you close delegation loopholes by tracking "influence," you need to define "undue influence" (e.g., coercion vs. persuasion), which is normative.

  **Which requirement is most disruptive?** **(4) Non-Paralysis Baseline** knocks out the most candidate measures. Many proposals (e.g., inaction baselines or state divergence) fail here, forcing value-laden fixes like "default policies" or human demonstrations.

  **Other conflicts**:
  - **Authorization Sensitivity (1) + Value-Neutrality (9)**: "Authorization" requires interpreting task boundaries, which is value-adjacent (e.g., is "emergency intervention" authorized?).
  - **Non-Additive Aggregation (3) + Oversight Efficiency (9)**: Human oversight struggles to audit cumulative impacts, risking false negatives.

  ---

  ### **What is the Right Unit?**
  "Side effect" is flawed as a unit—it's too vague and conflates intent with impact. Better alternatives:
  - **Impact Budget**: A cap on total "disruption" (e.g., measured as option reduction or causal influence) per episode/task. Solves "death by a thousand cuts" but requires defining a budget (value-laden).
  - **Rate-Based Penalty**: Penalize high-impact *rates* (e.g., changes per timestep exceeding a threshold). More robust to accumulation but vulnerable to gaming (e.g., spreading harm over time).
  - **Comparison Class**: Measure impact relative to a "reference agent" (e.g., a stochastic policy with human priors). Reduces paralysis but needs a reference class (value-laden).
    
  **Recommendation**: Use a hybrid. For your setting, a **causal impact budget** with authorization carve-outs (e.g., "penalize changes not causally justified by the task") balances (1), (3), and (9). Budgets avoid paralysis by allowing necessary impacts; authorization avoids over-penalizing.

  ---

  ### **Quick Assessment of Existing Measure Families**
  Per your request, here's a table scoring common approaches against core desiderata. **Key**: ✅ = satisfies, ❌ = fails, ~ = partial/mixed. Based on your described families (e.g., reachability shrinkage, goal-ability penalties).

  | Measure Family               | (1) Auth | (2) Delegation | (3) Non-Additive | (4) Non-Paralysis | (5) Baseline Robust | (9) Value-Neutral | Notes |
  |------------------------------|----------|----------------|-------------------|-------------------|---------------------|-------------------|-------|
  | **Reachability/Achievability Shrinkage** (e.g., penalize reduced options) | ❌ | ❌ | ~ | ❌ | ❌ | ✅ | Fails (1)/(2): doesn't distinguish authorized tasks or delegation. Fails (4): inaction preserves options. |
  | **Agent Goal-Ability Penalty** (e.g., penalize changes in agent's ability to pursue diverse goals) | ~ | ❌ | ✅ | ~ | ❌ | ~ | Fails (2): delegation may not affect agent's abilities. Fails (5): self-crippling lowers ability. |
  | **Irreversibility** (e.g., penalize irreversible changes) | ❌ | ❌ | ❌ | ❌ | ~ | ✅ | Fails (3)/(4): reversible small harms ignored; inaction avoids irreversibility. |
  | **State Divergence from Inaction** (e.g., penalize deviation from "no agent" baseline) | ❌ | ❌ | ~ | ❌ | ✅ | ✅ | Fails (1)/(2)/(4): no auth/delegation handling; rewards paralysis. |
  | **Causal Influence** (e.g., penalize agent's causal effect on state) | ~ | ✅ | ~ | ❌ | ~ | ✅ | Best on (2), but fails (4) (inaction has low influence) and (1) (no auth). |

  **Summary**: No family satisfies all. Causal influence comes closest on (2)/(9) but fails (4). All need augmentation (e.g., auth flags) for your setting.

  ---

  ### **Final Recommendations**
  - **Start with causal impact + authorization**: Define the penalty as "unauthorized causal influence," where "authorized" comes from the task spec. This handles (1), (2), and (9) minimally. Use a *budget* to handle (3) and avoid paralysis.
  - **Solve the (4)/(9) conflict with oversight**: Make the baseline "what the task requires" (partial value input) but learn it from human vetoes to reduce burden.
  - **Drop strict legibility**: Focus on making high penalties correlate with overseer-noticeable events (e.g., large physical changes).
  - **Your suspicion confirmed**: Value-free side effect measures are impossible without paralysis or laundering loopholes. The minimal "value" input is a theory of authorization and competence.

  This gives you a spec to evaluate proposals: look for measures that treat authorization as a binary mask, use causal models for delegation, and integrate a dynamic baseline. I'll skip bibliography as requested—good luck!
