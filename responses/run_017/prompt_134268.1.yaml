answer: |-
  Below is a structured, actionable checklist for evaluating pilot/feasibility studies, designed for your 90-minute memo constraint. It incorporates Good's theorem insights while flagging violations and judgment calls. The procedure prioritizes **crude but conservative bounds** (avoiding complex models) and explicitly separates "don't buy," "buy," and "committee judgment" outcomes. I'll first outline the checklist, then apply it to your three cases.

  ---

  ### **Checklist for Pilot Study Evaluation**  
  *(Complete in Order — Stop Early if Decision is Clear)*

  #### **Step 0: Define Status Quo (5 mins)**  
  - **What to answer:**  
    - What action would we take **without** the study? (e.g., scale up now, reject, or choose default option)  
    - What is the **net value** of that action? (Monetary equivalent; e.g., expected lives saved × $ value, or net dollar benefit)  
  - **Sufficient answer:** Qualitative (e.g., "Scale up; expected net benefit = $3M"). If unclear, proceed but note uncertainty.  
  - **Stop if:** No viable alternative action exists → **"Don’t buy study"** (no decision to change).  

  #### **Step 1: Perfect Information Upper Bound (15 mins)**  
  - **What to calculate:**  
    - **Maximum gain from switching actions** if you had *perfect* information:  
      `Max Gain = |Net Value of Best Action − Net Value of Second-Best Action|`  
    - **EVPI (Expected Value of Perfect Information):**  
      `EVPI = Min(Probability of Being Wrong × Cost of Wrong Choice, Max Gain)`  
      *Simplified:* If scaling up costs `C` and has failure probability `P_fail`, and failure loses all `C`, then `EVPI ≈ Min(P_fail × C, (1−P_fail) × Net Benefit If Good)`  
  - **Sufficient answer:** Back-of-envelope numbers (e.g., "Max Gain = $5M; EVPI = $1.2M").  
  - **Compare to study cost (direct + delay):**  
    - **Study cost:** Direct cost + **delay cost** (annual net benefit of program × 1 year, *only if* Step 0 action was scale-up).  
    - **Decision:**  
      - If **Total Study Cost > EVPI → "Don’t buy study"** (even perfect info isn’t worth it).  
      - If **Total Study Cost < 0.1 × EVPI → "Buy study, obviously"** (info is cheap relative to upside).  

  #### **Step 2: Assumption Audit (Good's Theorem Violations) (10 mins)**  
  Answer **yes/no** for each violation. If "yes," flag risks but *proceed* to Step 3.  
  1. **Costly/delayed?** (Always yes) → Increases cost, already incorporated.  
  2. **No commitment to ignore?** (Can’t unsee results) → Risk: Study may force a *worse* decision.  
  3. **Payoff depends on beliefs?** (e.g., matching funds) → Study may directly alter payoffs.  
  4. **Measures a proxy?** (e.g., pilot vs. national scale) → Lowers info value; discount EVPI by 30–70%.  
  5. **Measurement perturbs?** (e.g., evaluation changes implementation) → Lowers info value; discount EVPI by 20–50%.  
  6. **Multiple decision-makers?** → May over/undervalue info; use average/median estimates.  
  7. **Defines options, not states?** (e.g., qualitative study) → Not covered by Good’s theorem; use Step 4.  

  #### **Step 3: Imperfect Information & Adjustments (15 mins)**  
  - **Discount EVPI** for **violations #4–5** (e.g., proxy + perturbation → apply 50% discount).  
  - **For #3 (belief-dependent payoffs):**  
    - Calculate **expected subsidy value**: `Probability Study Unlocks Subsidy × $ Value of Subsidy`.  
    - Add this to discounted EVPI → **Adjusted Value**.  
  - **For #7 (defining options):**  
    - Estimate **value of best new option minus best existing option** → Use as Adjusted Value.  
  - **Compare:**  
    - If **Total Study Cost > Adjusted Value → "Don’t buy study"**.  
    - Else → Proceed to Step 4.  

  #### **Step 4: Decision Reversals and Judgment (15 mins)**  
  - **Answer:** "What decision would we make for every possible study result?" (Optimistic, pessimistic, null).  
    - Focus on: **"What if null?"** (e.g., "If null, we’d abandon the program").  
  - **Sufficient answer:** Qualitative scenarios (no model needed).  
  - **Stop if:**  
    - No result would change Step 0 action → **"Don’t buy study"** (info has no choice value).  
    - Study enables new actions (e.g., strategy pivots) → **"Buy study"** if Adjusted Value > cost.  
  - **Else:** Flag to committee: "Value hinges on judgment: [e.g., how we interpret null results]".  

  #### **Step 5: Committee Handoff (5 mins)**  
  - **When to use:** Ambiguous Adjusted Value, high-stakes violations (#2, #3, #6), or irreducibly qualitative factors.  
  - **Output template:**  
    > "The study costs $(X) and delays benefits by $(Y). Our upper bound for its value is $(Z), but real value is likely lower due to [violations]. Crucially, it may [e.g., unlock matching funds/alter implementation]. Given [gaps], we recommend: [Buy/Don’t buy/Committee judgment on tradeoffs]."  

  ---

  ### **Applied to Your Cases**  
  **Key Assumptions:**  
  - Value of a life-year = $1,000 (foundation-standard placeholder; adjust as needed).  
  - Discount rate = 0% (simplicity; if delay matters, add 5–10% to cost).  

  #### **Case (a): $400k RCT Pilot for $6M Scale-Up**  
  - **Step 0:** Scale up without study (since effect "probably real"). Net value = $3M (expectation; e.g., 50% chance of $6M benefit, 50% of $0).  
  - **Step 1:**  
    - Max Gain = $3M (switch from scale-up to abandon if bad).  
    - EVPI = Min(50% × $6M, 50% × $3M) = $1.5M.  
    - Total study cost = $400k + $600k (delay; 1 yr of $3M program ÷ 5-yr duration) = $1M.  
    - $1M > $1.5M? No → Proceed.  
  - **Step 2:** Violations #4 (proxy), #5 (perturbation), #6 (multiple DMs). Discount EVPI by 50% → $750k.  
  - **Step 3:** Adjusted Value = $750k. $1M cost > $750k → **"Don’t buy study"**.  
  - **Why:** Costly pilot + delay outweighs noisy info. Committee should revisit if national scalability uncertainty is extreme.  

  #### **Case (b): $180k Qualitative Study**  
  - **Step 0:** Choose default strategy without study. Net value = $0 (assume no dominant option).  
  - **Step 1:** Max Gain = $2M (e.g., best strategy could save 2,000 life-years vs. worst). EVPI not applicable (violation #7) → Proceed to Step 3.  
  - **Step 3:** Adjusted Value = $2M (value of best new option). $180k cost ≪ $2M → **"Buy study, obviously"**.  
  - **Why:** Defines high-value actions; low cost.  

  #### **Case (c): $250k Pilot for Matching Funds**  
  - **Step 0:** Reject program (true effect below threshold). Net value = $0.  
  - **Step 1:** Max Gain = $0 (no action to switch *without subsidy*). But subsidy depends on beliefs → Proceed to Step 2.  
  - **Step 2:** Violation #3 (matching funds), #4 (noisy signal), #6 (multiple DMs).  
  - **Step 3:**  
    - Adjusted Value = Expected subsidy: Probability study clears threshold × $ value of match.  
    - E.g., 30% chance of $4M match (doubling $2M grant) = $1.2M.  
    - Discount 40% for noise → $720k. Total cost = $250k.  
  - **Step 4:** If null result, we reject → no reversal risk.  
  - **Decision:** $720k > $250k → **"Buy study"**.  
  - **Ethics:** This is **legitimate** (subsidy unlocks *new* payoff structure), *but* disclose: "Study primarily valuable for subsidy access, not learning. If true effect is negative, match may fund harmful program."  

  ---

  ### **One-Page Summary for Memo Template**  
  ```markdown
  # Pilot Study Evaluation: [Program Name]

  ## Status Quo  
  Without this study, we would: **[Scale up/Reject/Choose Default]**.  
  Expected net value of that choice: **[$X or qualitative]**.  

  ## Quick Upper Bound  
  Maximum value of perfect information: **[$Y]**.  
  Total study cost (direct + delay): **[$Z]**.  
  → **[$Z > $Y ? Don’t buy study. $Z < 0.1 × $Y ? Buy study. Else: Proceed.]**  

  ## Key Risks & Adjustments  
  - **Can we ignore useless results?** [Yes/No] → If no, study may force bad decisions.  
  - **Do results unlock funding?** [Yes/No] → If yes, value includes subsidy access.  
  - **Pilot generalizes to scale?** [Yes/No] → If no, information value discounted.  
  - **Study changes implementation?** [Yes/No] → If yes, information value discounted.  
  - **Qualitative/option-defining?** [Yes/No] → If yes, value is in better choices.  
  Adjusted value of study: **[$A]**.  

  ## Decision Reversals  
  If study finds:  
  - **Null result:** We would **[Action]**.  
  - **Positive result:** We would **[Action]**.  
  - **Inconclusive:** We would **[Action]**.  
  → **[Will any result change status quo? If no, study has no choice value.]**  

  ## Recommendation  
  [**Buy study** | **Don’t buy study** | **Committee judgment needed**]  
  *Rationale: [2–3 lines, e.g., "Cost exceeds value even under optimistic assumptions" or "Subsidy access justifies cost despite noise"]*  
  ```

  ---

  ### **Where You're Making Judgment Calls (Disclose in Memo)**  
  1. **Probability estimates** (e.g., chance of program failure, subsidy unlock).  
  2. **Discount rates for violations** (e.g., "50% discount for proxy risk").  
  3. **Valuation of intangibles** (e.g., "Avoiding harm to foundation reputation").  
  4. **Delay cost** (e.g., "Annualized 20% of total program value").  

  ### **Final Note on Case (c)**  
  "Buying the result to unlock the match" is **legitimate within the framework** because the subsidy creates a new payoff structure (violating Good’s assumption that payoffs depend only on *true* states). However, it introduces **moral hazard** (incentive to run noisy pilots for subsidies). **Disclose transparently:** "This study’s primary value is subsidy access, not learning. If the true effect is negative, matching funds could amplify harm."  

  ---  
  This checklist prioritizes speed, transparency, and conservative bounds. It won’t capture all nuances but protects against wasteful pilots and flags when committee judgment is essential. Use the one-page summary to force clarity.
