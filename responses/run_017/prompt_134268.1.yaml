prompt: |-
  hey — I'm taking a decision theory reading course this term (phil dept, cross-listed with the econ phd field course: Savage, then Jeffrey, then a couple weeks on value of information and scoring rules) and I also have a paid internship at a small global health foundation where my actual job is drafting the funding memos. Roughly three or four times a month I write the section that answers "should we pay for a pilot / feasibility study first, or just decide now and put the money straight into the program?" Typical numbers: a $150k–$600k study now versus a $2M–$8M scale-up decision a year later. I get about a day per memo, I can't fit a model or run simulations in that time, and it goes to a five-person program committee (two ex-finance, an epidemiologist, one of our country directors, and the exec director) who will not read an equation but will definately ask "what would we do differently if it came back null?" and "isn't it always better to know?". My flatmate does psych research and keeps teasing me that all our pilots are underpowered, which is making me weirdly paranoid about the noisy-signal part.

  So: we did Good's theorem last week — the result that for an expected-utility maximizer information you don't have to pay for can't be bad news in expectation, and is worth exactly zero if it couldn't change what you'd do anyway — and I want to turn it into a procedure I can actually run on a memo in ninety minutes, including the parts where the theorem doesn't apply to us. The ways our setup breaks its assumptions, as far as I can tell: (1) the study is never free, and the real cost is delay, since a year of waiting is a year of people not getting the program; (2) we can't unsee the result — the committee can't commit to the choice it would have made without it, someone will reopen the decision, and the country director's ministry co-funds based on the headline number, so the result partly creates the situation we then act in rather than just describing it; (3) our payoff isn't purely a function of the true effect, because we have a matching funder who doubles grants in areas where our evidence base *looks* promising, so what we believe is partly what we're paid for; (4) the pilot measures a proxy (one district, one implementer) for the thing we care about (national scale, government delivery), and the correlation between the two is itself unknown; (5) the measurement perturbs — intensive baseline surveys and an evaluation team in the district change how the program runs; (6) the decision maker is five people with different priors, not one expected-utility maximizer, so "the" value of the information isn't even well defined; and (7) sometimes the study isn't about a state of the world at all, it's about what options we can even describe (a qualitative study that tells us which of three implementation strategies is coherent), which feels like it's outside the theorem's scope entirely.

  What I want from you: an ordered checklist I can work through, where each step says what counts as a sufficient answer at that step, including a deliberately crude quantitative step that gives me an upper bound on the value of the information without a full model (my instinct is: the most I could gain by changing my mind is the whole value, so if the study costs more than the gain from switching to my second-best option under the most favorable possible result, stop right there — and note that this is generous, since real information is worth less than perfect information). Tell me where the procedure just returns "don't buy it", where it returns "buy it, obviously", and where it has to hand the question to the committee because it's a values call rather than a factual one. I want an explicit assumption audit at the front that translates Good's theorem's preconditions into yes/no questions I can answer about a real grant. Then run it on three cases: (a) a $400k cluster-randomized pilot in one district of a school-based delivery program where we already think the effect is probably real but small and the live question is whether to go national at $6M; (b) a $180k qualitative study of why front-line health workers ignore a protocol, where the decision is which implementation strategy to adopt and the study won't estimate any effect at all; (c) a $250k pilot of a cash-transfer-plus-mental-health package that our biggest donor has promised to match two-to-one if the pilot clears a headline threshold — my honest belief is the true effect is below the threshold but the pilot is noisy enough that it might clear it anyway. One of those should come out with an answer I won't like (I have a feeling it's (c), and I want you to say plainly whether "buying the result to unlock the match" is a legitimate use of the framework or a violation of its assumptions that I'd have to disclose to the committee). Also give me a one-page version I can paste into the memo template, and a short paragraph on which steps are really just me making a judgment call in procedural costume — I'd much rather write "we can't tell" in a memo than a number with fake precision.
