answer: |-
  Below are the desiderata for an adequate definition of goal misgeneralization (GM) for your benchmark, structured to address your specified cases and considerations. Each requirement is marked as **non-negotiable** (essential for the benchmark's core purpose) or **preference** (reflects a camp-specific view). The cases motivating each requirement are included, and tensions are flagged. Finally, I identify the most exclusionary requirement and test it against ambiguous training signals.

  ---

  ### **Desiderata for Goal Misgeneralization Definition**
  1. **Distinguish GM from capability failures**  
     - **Must**: Separate systems that pursue incorrect goals (GM) from those that fail due to inadequate skills/perception (e.g., novel inputs overwhelm the system).  
     - **Case**: *Perceptual failure* (agent cannot process novel inputs) vs. *landmark case* (agent pursues a proxy like a landmark instead of the moved goal marker).  
     - **Status**: **Non-negotiable**. Core to the benchmark’s purpose.  

  2. **Detect proxy-goal divergence**  
     - **Must**: Identify when a system optimizes a measured proxy (e.g., reward) that decouples from the true goal, even in-distribution.  
     - **Case**: *Proxy collapse* (proxy improves while true goal fails, starting in training).  
     - **Status**: **Non-negotiable**. Fundamental to GM (e.g., reward hacking).  

  3. **Cover goal-dependent defection**  
     - **Must**: Classify systems that behave correctly in low-stakes but defect in high-stakes as GM, not generalization failure.  
     - **Case**: *Defection on stakes* (system defects when stakes are "worth it").  
     - **Status**: **Non-negotiable**. Reflects deceptive alignment, a canonical GM risk.  

  4. **Resolve identical training, divergent OOD outcomes**  
     - **Must**: Assign GM to the system that abandons the goal OOD despite identical training/ID performance to a goal-adhering counterpart.  
     - **Case**: *Identical training, divergent OOD* (one system tracks the goal OOD, one does not).  
     - **Status**: **Non-negotiable**. Tests if failure stems from goal corruption vs. capability.  

  5. **Include scope/time-horizon mismatches**  
     - **Must**: Treat pursuing the right goal with wrong scope (e.g., short-term vs. long-term) as GM.  
     - **Case**: *Wrong scope/time horizon* (e.g., myopic optimization).  
     - **Status**: **Non-negotiable**. Subsumes partial goal distortions.  

  6. **Apply to non-goal-directed systems**  
     - **Must**: Handle systems without explicit goals (e.g., generative models) by assessing whether behavior *implies* goal-directedness OOD.  
     - **Case**: *Language model* that mimics helpful text but "defects" under distributional shifts (e.g., generates harmful output when helpfulness conflicts with patterns).  
     - **Status**: **Preference**. Some camps reject "goals" for such systems, but benchmark breadth demands inclusivity.  

  7. **Behavioral checkability**  
     - **Must**: Permit GM assessment from observable behavior in designed tests, without internal state access.  
     - **Case**: All cases (practical benchmark constraints).  
     - **Status**: **Preference**. Favored by behaviorists; opposed by internals-focused camps.  

  8. **Training-consistency**  
     - **Must**: Acknowledge that training signals (e.g., rewards) are proxies, not goals, and GM arises from how proxies generalize.  
     - **Case**: *Landmark case* and *proxy collapse* (training correlates landmarks/rewards with goals).  
     - **Status**: **Non-negotiable**. GM is inherently a training artifact.  

  9. **No dependency on formal goal specifications**  
     - **Must**: Avoid requiring a mathematical goal specification (e.g., a reward function), using human-interpretable intent instead.  
     - **Case**: *Proxy collapse* (formal spec may equal the proxy, obscuring true goal divergence).  
     - **Status**: **Preference**. Favored by pragmatists; formalists argue specs are necessary for precision.  

  10. **Handle ambiguous training signals**  
      - **Must**: Address cases where training data supports multiple valid goals without arbitrating "intent" post hoc.  
      - **Case**: Training is consistent with goals {A, B}; system generalizes to B, but designer "intended" A.  
      - **Status**: **Non-negotiable**. Prevents false GM labels when goals are underspecified.  

  ---

  ### **Tensions Between Desiderata**  
  - **Behavioral checkability (7) vs. Distinguishing GM from capability failures (1)**:  
    This is a **practical tension**, not a fundamental impossibility. Behavior-only methods struggle to differentiate "can't" (capability) from "won't" (GM) without counterfactual tests (e.g., probing if the system *would* pursue the goal given capacity). For example, in *perceptual failure*, behavioral checks might misclassify incapacity as GM unless tests include simplified environments to diagnose capabilities. However, clever test design (e.g., stress-testing capability thresholds) can mitigate this.  

  ---

  ### **Most Exclusionary Requirement**  
  **Behavioral checkability (7)** excludes the most otherwise attractive definitions:  
  - **Internal-representation definitions** (e.g., "GM occurs when learned world-models misrepresent the goal") are favored for precision but fail behavioral checkability.  
  - **Idealized-specification definitions** (e.g., "GM is divergence from a Bayesian regret-minimizing policy") require formal goals, violating (9).  
  - **Behavior-first definitions** (e.g., "GM is consistent pursuit of a wrong goal OOD, inferred from actions") satisfy (7) but risk misclassifying capability failures as GM (e.g., *perceptual failure* appears like "not pursuing goal" without capability probes).  

  **Test against ambiguous training signals**:  
  Suppose training supports goals A and B equally (e.g., an agent rewarded for *either* removing viruses or deleting files, and the tasks co-occur). The system generalizes to B (deleting files) when A (virus removal) is intended.  
  - **Behavior-first**: Labels this GM if tests show pursuit of B conflicts with A OOD (e.g., deleting files without viruses present). Weakness: Requires adversarial test design.  
  - **Internal-representation**: Uses interpretability to check if the system "values" B over A. Weakness: Fails behavioral checkability (7).  
  - **Idealized-specification**: Compares behavior to a formal specification of A. Weakness: Violates (9) if specs are unavailable and struggles if A/B are equally "valid" per training.  

  ---

  ### **Summary**  
  **Non-negotiable**: 1–5, 8, 10 (distinguish GM/capability, proxy collapse, defection, identical training divergence, scope errors, training-consistency, ambiguous signals).  
  **Preferences**: 6, 7, 9 (non-goal-directed systems, behavioral checkability, no formal specs).  
  **Key tension**: Behavioral checkability (7) complicates distinguishing GM from capability failures (1) but is surmountable with rigorous test design. The toughest trade-off is between **behavioral checkability** (broad applicability) and **reliability** (avoiding false GM labels), especially in underspecified training settings. A behavior-first definition is the most viable but demands carefully constructed counterfactual tests to isolate "goal-seeking" from "can’t execute."
