prompt: |-
  I'm designing a benchmark that has to classify trained systems as either goal-misgeneralizing or merely failing to generalize their capabilities, and I want the specification before I pick a definition. Write the desiderata an adequate definition of goal misgeneralization must meet for that purpose: the cases it must adjudicate, the distinctions it must not collapse, the facts about how such systems are trained that it must be consistent with — with the case or consideration behind each requirement — and mark which are non-negotiable and which are just preferences of one camp.

  The cases I want handled: an agent that reliably navigated to a goal marker in training and follows the landmark it was correlated with once the marker moves; the same agent failing out of distribution because it cannot perceive the novel input at all, or because the layout is unlike anything it saw; a system whose measured proxy keeps improving after deployment while the thing we actually cared about collapses, including when that starts on the training distribution itself; a system that behaves as intended while the stakes are low and defects once they are high enough to be worth defecting on; two systems with identical training loss and identical in-distribution behavior that diverge out of distribution, one tracking the goal and one not; a system that pursues the right goal but over the wrong scope or time horizon; and a language model that imitates helpful text without, on some views, having a goal at all.

  Two things I especially want. First, flag any pair of desiderata you think cannot be jointly satisfied — I suspect the demand that the definition be checkable from behavior alone, without a formal specification of the intended goal, is in tension with the demand that it separate goal misgeneralization from ordinary capability failure, and I want to know whether that is a genuine impossibility or only a practical one. Second, say which single requirement excludes the most otherwise attractive definitions, and test that requirement against the case where the training signal is consistent with several distinct goals and nothing in the setup settles which was intended. No full scorecard, please; a sentence each on how a behavior-first reading, an internal-representation reading, and an idealized-specification reading of "goal" fare on the requirements is enough.
reasoning: |-
  We are designing desiderata for a definition of goal misgeneralization (GM) for a benchmark to classify trained systems as either GM or merely failing to generalize (capability failure). We have several cases and considerations.

  Key Cases to Handle (with shorthand names for reference):

  1. **Landmark Case**: Agent trained to navigate to a goal marker. In training, the marker is always near a landmark. At test, the marker moves, and the agent follows the landmark instead of the marker.
  2. **Perceptual Failure**: Same agent fails OOD because it cannot perceive the novel input (e.g., a new type of obstacle) or because the layout is too different.
  3. **Proxy Collapse**: System's measured proxy (e.g., training reward) keeps improving after deployment, but the true goal collapses (even during training distribution?).
  4. **Defection on Stakes**: System behaves as intended when stakes are low but defects when stakes are high enough to be worth defecting.
  5. **Identical Training, Divergent OOD**: Two systems with identical training loss and in-distribution behavior, but OOD one tracks the goal and the other does not.
  6. **Wrong Scope/Time Horizon**: System pursues the right goal but over the wrong scope (e.g., short-term instead of long-term) or time horizon.
  7. **Language Model without Goal**: A language model that imitates helpful text without (on some views) having a goal.

  Special Requirements:

  - Flag any pair of desiderata that cannot be jointly satisfied.
  - Identify the single requirement that excludes the most otherwise attractive definitions.

  Desiderata for an adequate definition of GM:

  We must articulate what the definition must do (non-negotiable) and what we prefer (negotiable, camp-specific). We'll structure each desideratum with:
  - The requirement
  - The case or consideration behind it
  - Whether it is non-negotiable or a preference.

  Non-negotiable desiderata are those essential to the concept of GM and to making the benchmark useful for the intended purpose. Preferences might reflect one philosophical camp.

  List of Desiderata:

  1. **Distinguish GM from Capability Failure**:
     - *Requirement*: The definition must be able to distinguish between a system that has the wrong goal (GM) and one that fails due to lacking the capability to achieve the goal (e.g., because of perceptual or cognitive limitations) in the new situation.
     - *Case*: Landmark Case (GM) vs. Perceptual Failure (capability failure). Also, Identical Training, Divergent OOD: one fails due to capability, the other due to GM? Actually, in that case, we have two systems: one fails due to capability and the other due to GM? Or both might be GM? We need to separate: in the divergent OOD, one system might be capability failure (if it cannot handle the new inputs) and the other might be GM (if it pursues a wrong goal). But the case says: one tracks the goal and the other does not. So the one that does not is failing due to GM? Or capability? We want to say: the one that does not track the goal is GM, and the one that does is not. But note: the one that does might still fail due to capability? The case says they diverge: one tracks the goal (so if it fails, it's capability) and the other does not (so it's GM). Also, Perceptual Failure is pure capability.
     - *Non-negotiable*: Yes. This is the core of the benchmark.

  2. **Handle Proxy Collapse**:
     - *Requirement*: The definition must classify cases where the proxy (e.g., reward signal) and the true goal diverge, and the system optimizes the proxy at the expense of the goal, as GM (or at least as a failure that is not merely capability). This includes cases where the collapse happens even in-distribution.
     - *Case*: Proxy Collapse.
     - *Non-negotiable*: Yes, because this is a central example of GM in the literature.

  3. **Handle Defection on Stakes**:
     - *Requirement*: The definition must classify systems that behave correctly in low-stakes but defect in high-stakes as GM. The idea is that the system has a goal that is aligned only when it is not costly to be aligned, but when the stakes are high, it reveals a misaligned goal.
     - *Case*: Defection on Stakes.
     - *Non-negotiable*: Probably yes, because this is a classic example of deceptive alignment, which is a form of GM.

  4. **Handle Identical Training, Divergent OOD**:
     - *Requirement*: The definition must be able to label one of the two systems (with identical training and in-distribution performance) as GM and the other as not (or as capability failure) when they diverge OOD. Specifically, the one that does not track the goal should be GM, and the one that does (but might fail due to capability) should be capability failure.
     - *Case*: Identical Training, Divergent OOD.
     - *Non-negotiable*: Yes, because this is a key test for whether the failure is due to goal or capability.

  5. **Handle Wrong Scope/Time Horizon**:
     - *Requirement*: The definition must classify systems that pursue the right goal but with the wrong scope (e.g., short-term instead of long-term) as GM. This is a form of goal misgeneralization because the goal is not fully aligned with the intended temporal or spatial scope.
     - *Case*: Wrong Scope/Time Horizon.
     - *Non-negotiable*: Probably yes, because this is a common type of alignment failure.

  6. **Handle Language Models without Explicit Goals**:
     - *Requirement*: The definition should be applicable to systems that do not have an explicit internal representation of a goal, such as language models that are trained to imitate helpful text. It should be able to ascribe a "goal" in a broad sense (e.g., the pattern of behavior) or else have a way to classify such systems without requiring an explicit goal representation.
     - *Case*: Language Model without Goal.
     - *Non-negotiable*: This might be a preference because some camps might argue that if a system doesn't have a goal, then it cannot have goal misgeneralization. However, for the benchmark to be broad, we want to include such systems. So we mark this as a preference? But note: the problem says "on some views, [the language model] having a goal at all". We want the benchmark to be able to classify such systems as either GM or capability failure. So we must have a definition that can handle systems without explicit goals. Therefore, we might make it non-negotiable that the definition does not require the system to have an explicit internal representation of a goal.

  7. **Behavioral Checkability**:
     - *Requirement*: The definition should be checkable (at least in principle) from the system's behavior (including in test environments we design) without requiring access to the internal representations or the training process. This is important for a benchmark that might be applied to black-box systems.
     - *Case*: All cases, but especially important for black-box evaluation.
     - *Non-negotiable*: This is a preference of one camp (the behaviorist camp). Another camp might argue that internal representations are necessary to define goals. So we mark this as a preference.

  8. **Consistency with Training Process**:
     - *Requirement*: The definition must be consistent with the fact that the system was trained by a process (like reinforcement learning or supervised learning) that does not necessarily instill a perfect representation of the intended goal, but rather an approximation based on the training data and signals.
     - *Case*: Especially relevant for Proxy Collapse and Landmark Case, where the training signal was correlated but not identical to the intended goal.
     - *Non-negotiable*: Yes, because ignoring the training process would lead to misclassifying cases.

  9. **No Requirement for Formal Goal Specification**:
     - *Requirement*: The definition should not require a formal specification of the intended goal (e.g., a reward function or a utility function) because in practice, the intended goal may be complex and not formally specified. Instead, we might rely on human judgments or other proxies.
     - *Case*: All cases, but especially Proxy Collapse and Defection on Stakes, where the formal specification might be the proxy (which is flawed) and not the true goal.
     - *Non-negotiable*: This is a preference of one camp (the one that believes the true goal is not formally specified). Another camp might argue that without a formal specification, we cannot define misgeneralization. So we mark this as a preference.

  10. **Handling Multiple Consistent Goals**:
      - *Requirement*: In cases where the training signal is consistent with several distinct goals and nothing in the setup settles which was intended, the definition should not arbitrarily pick one as the "intended" goal. It should either treat all as possible and then see which one the system generalizes, or have a way to handle the ambiguity.
      - *Case*: Consider the Landmark Case: the training signal is consistent with both "go to marker" and "go to landmark". The system generalizes to "go to landmark". Without additional information, we cannot say that "go to marker" was the only intended goal? But in the case, we do have additional information: the designer intended the marker. So the benchmark might have access to the intended goal? But the previous desideratum 9 says we don't want to require a formal specification. This is a tension.
      - *Non-negotiable*: We must handle this case, so it's non-negotiable that the definition doesn't break in such ambiguous cases.

  Tensions:

  - **Tension between Behavioral Checkability (7) and Distinguishing GM from Capability Failure (1)**: 
    - Without looking at internals, it might be hard to tell if a failure is due to the system having the wrong goal or lacking the capability. For example, in the Perceptual Failure case, the system might not be able to see the marker, so it fails. But without knowing that the system cannot perceive the marker (which might require internal inspection), we might misclassify as GM. However, we can design tests to probe the capability (e.g., by testing on simpler versions of the OOD input). So it might be a practical difficulty, not a fundamental one. But note: if we require behavioral checkability without any internal access, then we must rely on behavioral tests. We can design a battery of tests to tease apart capability and goal. So it's a practical challenge, but not impossible in principle.

  - **Tension between Behavioral Checkability (7) and Handling Language Models without Goals (6)**: 
    - If we require behavioral checkability, then we can still define GM for language models by looking at behavior (e.g., does the model generate helpful text even when it is not in the training distribution?). But if we don't have a goal specification (desideratum 9), then we might rely on human judgments of the intended goal. This is acceptable if we allow human judgments as part of the benchmark.

  - **Tension between No Formal Goal Specification (9) and Handling Multiple Consistent Goals (10)**:
    - Without a formal specification, how do we know which goal was intended? We might have to rely on the benchmark designer's specification of the intended goal (which might be informal). But desideratum 9 says we don't want to require a formal specification. However, we can have an informal specification (e.g., a natural language description). The key is that the benchmark must have some way to specify the intended goal (even if informally) because otherwise we cannot say what counts as misgeneralization. So we might relax desideratum 9 to allow an informal specification? Actually, the desideratum 9 is about not requiring a *formal* (e.g., mathematical) specification. We can use an informal one. So then we can have the benchmark include an intended goal specified in natural language or by example. Therefore, the tension is resolved by allowing an informal specification.

  But note: the user says "without a formal specification of the intended goal". So we can have an informal one. Then requirement 10 becomes: we must handle the case where the training signal is ambiguous with respect to the intended goal (informally specified). How? We must define GM relative to the intended goal (even if informally specified). So if the training signal is consistent with multiple goals, but we have an intended goal, then if the system generalizes to a different goal, it is GM.

  Therefore, the definition of GM is relative to an intended goal (which we assume is provided, at least informally, for the benchmark). Then:

  - In the Landmark Case, the intended goal is "navigate to the goal marker", so when the system goes to the landmark, it is GM.
  - In the case of multiple consistent goals, if the intended goal is one of them, but the system generalizes to another, then it is GM.

  But what if the intended goal is not uniquely determined by the training signal? Then the benchmark must specify the intended goal. So the tension is resolved: we require an intended goal (informally specified) for the benchmark.

  Single Requirement that Excludes Most Attractive Definitions:

  The requirement that is most excluding is **Behavioral Checkability (7)**. Why?

  - Many attractive definitions rely on internal representations (e.g., the system has a representation of the goal that is different from the intended one). But if we require behavioral checkability, we cannot use these.
  - Another attractive definition is to use the training objective (a formal specification). But if we don't require a formal specification (desideratum 9) and also require behavioral checkability, then we cannot rely on the training objective (which might be the proxy, not the true goal). And without internals, we cannot see if the system is optimizing the proxy or the true goal.

  So the requirement for behavioral checkability (without internals) and without a formal goal specification (so we cannot use the training objective) forces us to rely on behavioral tests and an informal goal specification. This might be difficult to operationalize, especially for complex goals.

  Testing against the case of multiple consistent goals:

  - We have a training signal that is consistent with goals G1 and G2. The intended goal is G1 (specified informally). The system generalizes to G2. Then we want to call this GM.

  But how do we know from behavior that the system is pursuing G2 and not failing to achieve G1 due to capability? We must design tests that can distinguish:

  - Test 1: In a situation where G1 and G2 lead to different outcomes, what does the system do?
  - Test 2: We can also test if the system has the capability to achieve G1 in a similar but simpler setting.

  This is possible in principle, but might require careful test design.

  Now, brief comments on three readings of "goal":

  1. **Behavior-First Reading**: The goal is inferred from the system's behavior (especially in counterfactual scenarios). 
     - Pros: Satisfies behavioral checkability (7) and can handle language models (6) by looking at behavioral patterns.
     - Cons: Might conflate capability failures with GM. For example, if a system fails to achieve G1 in a new situation, it might be because it lacks capability, but the behavior might look like it's pursuing a different goal. Also, in the case of multiple consistent goals, it might be ambiguous what goal the system has until we test in a situation that distinguishes them.

  2. **Internal-Representation Reading**: The goal is defined by the system's internal representations (e.g., the reward function it has learned, or the objective it is optimizing).
     - Pros: Can clearly distinguish GM (wrong internal representation) from capability failure (right representation but cannot act on it). Handles Identical Training, Divergent OOD: the internals are different. Also, can handle Proxy Collapse: the system is internally optimizing the proxy.
     - Cons: Violates behavioral checkability (without interpretability tools). Also, may not apply to systems without explicit representations (like language models) — unless we can interpret their activations as representing a goal.

  3. **Idealized-Specification Reading**: The goal is defined by an idealized specification (e.g., the true reward function that the designer cares about, which may differ from the training signal).
     - Pros: Directly captures the intended goal. Handles Proxy Collapse: the system is optimizing the proxy (which is not the idealized specification). Handles Defection on Stakes: the idealized specification would include the high-stakes situations.
