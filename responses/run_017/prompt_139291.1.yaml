  - The tension between behavioral checkability and distinguishing GM from capability failure is not a fundamental impossibility but a practical challenge that can be addressed by careful test design (probing capabilities in controlled settings). However, it might be very hard in practice.

  - The requirement that excludes the most attractive definitions is **Behavioral Checkability (7)**, because it rules out definitions that use internal representations and also complicates definitions that rely on a formal goal specification.

