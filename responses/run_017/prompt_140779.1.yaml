  ### **Branch Questions (9 Total)**
  1. **Vivid dream case**: In a dream of a red room (no stimulus, no action), is the dreamer genuinely experiencing redness?  
     - (A) Yes  
     - (B) No—it’s just memory/simulation  
     - (C) Only in a derivative sense (e.g., brain activity)  

  2. **Meditator case**: A long-term meditator reports no qualitative character but unchanged color discrimination. Is her report accurate?  
     - (A) Yes—there is no qualitative character  
     - (B) No—she has it but isn’t attending to it  
     - (C) Partly—qualitative character is minimal or different  

  3. **Mid-task denial case**: Someone mid-task denies experiencing anything when asked, then insists they saw the stimulus when shown. What explains this?  
     - (A) No experience until prompted  
     - (B) Experience was present but unnoticed  
     - (C) Experience was present and noticed, but reporting failed  

  4. **Where misrepresentation happens** (for normal perception, e.g., seeing a red apple): If there’s an error about "redness," where is it?  
     - (A) In perception itself (it adds properties not there)  
     - (B) In self-monitoring/reporting (it misdescribes what perception delivers)  
     - (C) No error (or elsewhere)  

  5. **Nature of seeming**: When someone says "I see red and it feels like something," what is happening?  
     - (A) They undergo a genuine mental state with its own character  
     - (B) They undergo a genuine mental state without qualitative character  
     - (C) No state—just a disposition to judge/report  

  6. **Scope**: Does this apply to dreams, imagery, and background sensations?  
     - (A) Yes, to all conscious states  
     - (B) Only to task-guided perception/action  
     - (C) Only to some (e.g., not dreams)  

  7. **Target**: Are properties like "redness" real?  
     - (A) Yes, as we describe them  
     - (B) No, they don’t exist  
     - (C) They exist, but not as we think  

  8. **Meta-problem**: Why do people insist on qualitative properties?  
     - (A) They’re real and directly accessed  
     - (B) Illusion in perception  
     - (C) Illusion in self-monitoring  
     - (D) Concepts/language are misleading  

  9. **Science explanation**: Can science fully explain "redness" as a property?  
     - (A) Yes, with current/future science  
     - (B) No, science is fundamentally limited  
     - (C) We don’t/can’t know  

