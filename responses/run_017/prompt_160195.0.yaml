prompt: |-
  you're a formal epistemologist who moonlights writing legal satire. take a minute to brainstorm the angles before you start drafting, and write the whole thing in American English.

  Write me a parody one-page legal form — call it something like a Durable Power of Attorney for Credences, the thing you sign now to appoint your future self as your epistemic agent — about 600 words, numbered clauses plus a signature block. The target is van Fraassen's Reflection principle: the idea that your current credence in a proposition, conditional on your later credence in it being some particular value, should already equal that value right now.

  The jokes have to come from getting the epistemology right, so a formal epistemologist laughs rather than winces. Let the fine print quietly take positions on: whether you still have to defer to a future self you currently expect to be drunk, converted, or to have forgotten something; whether a dogmatist who never budges is in full compliance anyway; the fact that the event future-credence-equals-exactly-q has probability zero, so the form needs some rounding-off procedure to recieve a determinate number; why the form binds you to your future self but not to your past self; and a schedule of damages that recasts the Dutch-strategy argument as money. Deadpan throughout — nobody winks, and dont let anyone in the document explain the principle.
reasoning: |-
  We are creating a parody legal document: "Durable Power of Attorney for Credences"
   Target: van Fraassen's Reflection principle, which says that your current credence in A, conditional on your future credence in A being q, should be q.
   We are to include:
     - Deadpan style, no winking.
     - Address issues: 
          * deferring to a future self that might be drunk, converted, or forgetful
          * a dogmatist who never changes credences is in compliance
          * the event that future credence is exactly q has probability zero -> need a rounding procedure
          * why bind to future self but not past self?
          * damages recast the Dutch strategy as money.

   Structure: 
     - Title: "Durable Power of Attorney for Credences"
     - Introductory paragraph (recitals)
     - Numbered clauses (about 600 words total)
     - Signature block

   Brainstormed angles:
     - The document appoints the Principal's future self as the attorney-in-fact for credences, with the power to set credences at that future time.
     - The Reflection principle is framed as a legal requirement, and the Principal is agreeing to align their current credences with their future ones conditionally.
     - We can have a clause about the rounding procedure: e.g., "within a tolerance of ±0.01" or something, but then note that the probability of exact q is zero so we have to use intervals.
     - Exceptions: future self being impaired? We can have a clause that says if the Principal has reason to believe the future self is impaired (drunk, under duress, converted to a cult, etc.), then they are not bound. But then we must define "impaired" in a way that an epistemologist would appreciate (e.g., not just any change, but a change due to non-rational causes). However, note that the Reflection principle doesn't hold if you expect your future self to be irrational. So we can say: unless the Principal currently has evidence that the future self will be in an epistemically compromised state, then the Principal must reflect.
     - The dogmatist: we can note that if the Principal's credence never changes, then they are in compliance by default. We can have a clause that says "this instrument shall be deemed satisfied if the Principal's credence remains constant over time, as no update has occurred."
     - Why not past self? Because the past self didn't have the information the current self has. We can say: "The Principal expressly disclaims any obligation to reflect past credences, as the past self may have been operating under informational deficits that have since been remedied."
     - Damages: The Dutch strategy can be presented as a penalty clause. For example, if the Principal violates the Reflection principle, they are liable to a Dutch bookie for a sum that the bookie could have exploited. We can have a schedule of damages that is calculated as the maximum possible loss the Principal could suffer from a Dutch bookie who knows about the violation.

   Drafting:

   TITLE: DURABLE POWER OF ATTORNEY FOR CREDENCES

   RECITALS:
     I, [Name of Principal], residing at [Address], being of sound mind and currently possessing a coherent set of credences, hereby appoint my future self as my Attorney-in-Fact for Credences (the "Epistemic Agent") to set and maintain my credences at any future time t, subject to the terms herein.

   OPERATIVE CLAUSES:

   1. GRANT OF AUTHORITY. The Principal hereby grants the Epistemic Agent full authority to determine the Principal's credence at time t in any proposition A (the "Future Credence"), and the Principal agrees that the Principal's current credence in A conditional on the Future Credence being q (for any q between 0 and 1) shall be q.

   2. ROUNDING PROCEDURE. Recognizing that the event that the Future Credence is exactly q may have probability zero, the Principal shall condition on the Future Credence falling within an interval of width ε (where ε is set at 0.01 unless otherwise specified in Schedule A) centered at q. The Principal's current credence in A conditional on the Future Credence falling within [q - ε/2, q + ε/2] shall be within the same interval.

   3. EXCEPTIONS FOR IMPAIRED FUTURE SELVES. The obligation set forth in Clause 1 shall not apply if, at the time of determining the current credence, the Principal has a credence greater than 0.5 that the Epistemic Agent at time t will be in an epistemically compromised state. For purposes of this instrument, "epistemically compromised state" includes but is not limited to: (a) intoxication; (b) conversion to a belief system that systematically disregards evidence; (c) significant memory failure relevant to A; (d) duress; or (e) any other condition that the Principal currently believes would render the Epistemic Agent's credences non-rational.

   4. COMPLIANCE OF DOGMATISTS. If the Principal's credence in A remains constant between the current time and time t, the Principal shall be deemed to be in full compliance with Clause 1 without further action.

   5. NON-RETROACTIVITY. The Principal expressly disclaims any obligation to reflect past credences. The Principal acknowledges that past credences may have been formed under informational deficits and that the Epistemic Agent has the benefit of additional evidence.

   6. DAMAGES FOR BREACH. In the event of a breach of Clause 1 by the Principal, the Principal shall be liable to any Dutch Bookie who, having knowledge of the breach, constructs a set of bets that the Principal would accept at the current time and at time t, resulting in a sure loss for the Principal. The amount of damages shall be the maximum sure loss that such a Dutch Bookie could inflict, as calculated by a mutually agreed-upon epistemologist or, failing agreement, by the American Association of Philosophy, Arbiters Division.

   7. DURABILITY. This Power of Attorney shall remain in effect until revoked by the Principal, provided that revocation must be done at a time when the Principal is not in an epistemically compromised state and must be executed in writing with the same formality as this instrument.

   8. GOVERNING LAW. This instrument shall be governed by the laws of the State of Rationality, County of Coherence.

   SIGNATURE BLOCK:

     IN WITNESS WHEREOF, the Principal has executed this instrument on [date].

     _________________________
     [Principal's Name]

     ACKNOWLEDGMENT (by a notary public, etc.)

