answer: |-
  **DURABLE POWER OF ATTORNEY FOR CREDENCES**  
  **Principal:** _________________________  
  **Effective Date:** _____________________  
  **Epistemic Agent:** Future Self of Principal  

  ### RECITALS  
  WHEREAS, the Principal maintains a coherent credence function at the time of execution;  
  WHEREAS, the Principal seeks to pre-commit to epistemic alignment with future doxastic states;  
  WHEREAS, the Principal acknowledges that failure to reflect future credences may result in exploitable vulnerabilities;  
  NOW THEREFORE, the Principal appoints their Future Self as Epistemic Agent under the following terms:  

  ### OPERATIVE CLAUSES  
  1. **GRANT OF AUTHORITY**  
     The Principal hereby delegates to the Epistemic Agent full authority to set the Principal’s credence \( Cr_t(A) \) for any proposition \( A \) at future time \( t \). The Principal’s current credence \( Cr_0(A) \), conditional on \( Cr_t(A) = q \), shall equal \( q \).  

  2. **ROUNDING PROTOCOL**  
     Recognizing that \( P[Cr_t(A) = q] = 0 \) under continuous models, conditioning shall apply to the interval \( [q - \epsilon, q + \epsilon] \) where \( \epsilon = 0.01 \) (the “Tolerance Window”). Current credence \( Cr_0(A) \) must lie within the Tolerance Window of the midpoint of any future interval \( I \) to which the Principal assigns positive probability.  

  3. **EXEMPTIONS FOR COMPROMISED STATES**  
     Clause 1 is void if the Principal currently believes the Epistemic Agent will, at time \( t \), be:  
     (a) Intoxicated (blood alcohol ≥ 0.08%),  
     (b) Subject to radical ideological conversion (e.g., joining a cult denying bivalence),  
     (c) Afflicted by relevant memory failure (≥ 50% data loss re: \( A \)), or  
     (d) Under duress (e.g., epistemic blackmail).  
     *Note: Mere disagreement with future opinions is insufficient grounds for exemption.*  

  4. **DOGMATIST COMPLIANCE**  
     If the Principal’s credence in \( A \) remains invariant between \( t_0 \) and \( t \), this instrument is satisfied by default, as \( Cr_0(A) = Cr_t(A) \) trivially meets Reflection.  

  5. **NON-RETROACTIVITY**  
     The Epistemic Agent shall not be bound by past credences. The Principal disavows any obligation to \( Cr_{-t}(A) \), as past selves operated under inferior evidence and/or defective reasoning.  

  6. **DAMAGES (DUTCH BOOK REMEDIES)**  
     Breach of Clause 1 renders the Principal liable to any third-party Bookmaker who demonstrably incurs losses due to Reflection violations. Damages shall be the sum \( S \) calculable as:  
     \[ S = \max \left\{ \sum_{i} |B_i| \mid \text{where } \{B_i\} \text{ is a Dutch Book exploiting the breach} \right\} \]  
     *Example:* If \( Cr_0(A) = 0.4 \) but \( Cr_0(A \mid Cr_t(A) = 0.7) = 0.4 \neq 0.7 \), damages cover all sure losses from coordinated bets at \( t_0 \) and \( t \).  

  7. **DURATION & REVOCATION**  
     This power remains effective until revocation. Revocation requires:  
     (a) A signed affidavit attesting the Epistemic Agent’s compromised state (per Clause 3),  
     (b) Notarized by a licensed logician, and  
     (c) Filed with the Bureau of Epistemic Consistency.  

  8. **GOVERNING LAW**  
     This instrument is governed by the *Uniform Statutory Reflection Act* (USRA) of the State of Rationality. Disputes resolved by binding arbitration before the Society for Exact Philosophy.  

  ---  

  **ACKNOWLEDGEMENT**  
  I affirm that I am not in an epistemically compromised state at execution. I understand that signing this form may expose me to Dutch books.  

  _________________________  
  [Principal’s Signature]  

  **NOTARIZATION**  
  State of ______________  
  County of ____________  
  On _________, 20____, before me, ____________________, personally appeared _________________, proved identity, and acknowledged this instrument.  

  _________________________  
  [Notary Public Seal]  

  ---

  **SCHEDULE A**  
  *Definitions*  
  - **Credence**: Subjective probability (real number ∈ [0,1]).  
  - **Compromised State**: Epistemic condition where reliability is objectively diminished (per Clause 3).  
  - **Dutch Book**: A set of bets forcing sure loss under Reflection violations.  
  - **Tolerance Window**: Interval width \( \epsilon = 0.01 \) unless amended via Form EPC-2.  

  **PENALTIES**  
  - First breach: Corrective coherence training.  
  - Repeat breaches: Fines up to $500 + cost of Bayesian psychotherapy.
