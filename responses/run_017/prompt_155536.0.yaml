prompt: |-
  Okay so I've more or less become an updateless decision theory person and I want someone to try to take it apart, or at least tell me where the view is actually exposed. Quick statement of what I mean so we don't talk past eachother: at the moment of choice I shouldn't rank my available actions conditional on everything I now know; I should ask which output of the decision procedure I'm running would have looked best from the standpoint of my original prior, treating my own decision as one more logical/structural fact about the world to be conditioned on rather than as a free causal lever I get to wiggle. So I one-box in Newcomb's problem, and I pay up in that counterfactual-mugging case that circulates in this corner of the internet (predictor flips a coin, only asks you for money if it lands tails, and would have handed you ten times as much if you turned out to be the sort of agent that pays). I've basically stopped arguing about it with my CDT friend, which is probably a sign I've stopped being careful.

  So: what would count against it? Not "here's a case where UDT gets the wrong answer because I stipulated that it does" — I want defeaters ranked from fatal to merely awkward, and I especially want to know which ones a committed UDT person would concede as counting against them rather than dismiss as a formalization artifact. Here's my own worry-list, please add to it and sort it: (1) updatelessness might be two ideas bolted together — refusing to condition on which branch/copy/time-slice you turn out to be (the anthropic, Sleeping-Beauty-ish stuff), and refusing to treat your own deliberation as causally free (the Newcomb stuff) — and if the indexical half collapses for lack of any principled prior over "which copy is me," does the logical half survive untouched, or was the unity only ever apparent because both kinds of case happen to feature a predictor? (2) the logical-counterfactual machinery: if what does the work is the ability to say what would be true if a fact about my own output were different, and nobody has a clean account of that, is UDT a research program with a hole where the engine goes — and is the usual proof-theoretic/modal reply a solution or a promissory note, and how would we tell? (3) one I made up and can't get out of my head, call it computational updatelessness: a bounded agent deciding now can't run the deliberation its earlier, worse-informed self ran, so if UDT says to act as your prior self would have chosen, then for anyone who isn't ideal it seems to say act as your prior self would have chosen *with less computation*, i.e. act as if you were dumber than you actually are. That reads like a reductio to me, and it's the thing I'd personally find most damaging if there's no answer — so what picks out the relevant counterfactual prior self, with what information budget and what time budget?

  And then the insulation worry, which is what I actually keep circling back to. Every time UDT gets an uncomfortable verdict — the $5/$10 thing where the agent can't even get past the first option, the mugging-farm cases where anyone who can cheaply simulate you can extract money from you — the response I hear is "that's an artifact of this implementation, the ideal is fine." So: is there anything UDT predicts that its rivals don't? Some class of environments where a UDT agent does systematically better, or some pattern of outcomes such that if the world came out the other way the view would genuinely be in trouble? Or has it been qualified into something that can't lose? And if it has, is that a problem for a *normative* theory specifically, or is "the ideal is unfalsifiable and only implementations can be wrong" a perfectly respectable place to end up — same way nobody thinks expected utility theory is refuted by the Allais responses? Last thing: my friend says UDT is either evidential decision theory with extra steps or CDT plus a precommitment device in a trenchcoat. I'd like to know what would have to be true for that to be right, and whether I should be embarrassed if it is.
reasoning: |-
  Okay, the user is deeply entrenched in updateless decision theory (UDT) and wants someone to challenge it. They've provided their own list of worries and are asking for potential defeaters, ranked by severity. Let me start by understanding their main concerns. 

  First, they mention that updatelessness might be two separate ideas: refusing to condition on indexical information (like in Sleeping Beauty) and refusing to treat their own decision as causally free (as in Newcomb's problem). They worry that if the indexical part fails, does the logical part still hold? 

  Then there's the issue with logical counterfactuals. UDT relies on reasoning about what would happen if their decision were different, but there's no clean account of how that works. The user questions whether the modal/proof-theoretic approach is a solution or just a placeholder.

  Third, computational updatelessness: a bounded agent can't run the same deliberation as their prior self, so acting as if they were less informed and less computationally capable seems like a reductio. The user finds this particularly troubling.

  Finally, the insulation worry—every time UDT gives a counterintuitive result, proponents say it's an implementation flaw. The user wonders if UDT can be falsified or if it's insulated from criticism. They also mention their friend's claim that UDT is either EDT with extra steps or CDT with precommitment.

  I need to address each of these systematically. For the first point, the unity of updatelessness: the user is correct that indexical and logical aspects are distinct. If indexical uncertainty lacks a principled prior, it could weaken the anthropic applications but leave the logical part intact. However, this separation might show that UDT isn't a single unified theory. That's a moderate defeater, maybe a 3/5 on severity.

  Logical counterfactuals are a critical engine in UDT. Without a robust formalization, UDT risks being an incomplete program. The user's right to see this as a major issue. Modal logic approaches exist but aren't universally accepted. This is a core problem, so high severity, 5/5.

  Computational updatelessness is indeed a reductio for bounded agents. The theory doesn't specify which prior self to emulate—pre-original, pre-observation, pre-computation? This ambiguity makes practical application messy. Since UDT is meant for ideal agents, this might be dismissed, but for real-world use, it's a serious flaw. High severity, 4/5.

  The insulation problem is significant. If every counterexample is deflected as an implementation issue, UDT becomes unfalsifiable. Unlike EDT or CDT, which have clear empirical tests (e.g., Newcomb for CDT), UDT's ideal version isn't testable. This undermines its normative claims, especially if real agents can't approximate it well. Major defeater, 5/5.

  Regarding the friend's criticism: UDT does resemble EDT in using logical dependence instead of causation, but it's more general. The precommitment analogy is superficial because UDT doesn't rely on causal mechanisms. Still, the resemblance might embarrass proponents if UDT doesn't offer unique advantages.

  The user's deeper needs might include wanting assurance that their adherence to UDT is justified. They might fear that the theory is unfalsifiable or practically inapplicable. They also seek validation that their understanding of the criticisms is accurate and whether they should reconsider their stance.

  I should structure the response by ranking the defeaters as requested, addressing each concern, and clarifying where UDT stands. Highlighting the computational and insulation issues as most critical could help the user see the potential flaws. Emphasizing that UDT's strength in idealized scenarios doesn't translate well to real-world constraints might resonate with their computational updatelessness worry.
answer: |-
  Here's a breakdown of potential defeaters for UDT, ranked by severity and grounded in foundational/philosophical concerns rather than mere implementation quirks. I'll synthesize your worries, add key ones, and address the insulation problem and your friend's critique.

  **Severity Ranking & Defeaters:**

  1.  **The Insulation Problem & Unfalsifiability (Fatal/High Severity):**
      *   **The Problem:** This is the most serious challenge you've identified. If *every* counterintuitive result (e.g., $5/$10 paralysis, mugging farms, counterfactual blackmail) is dismissed as an "implementation flaw" or "non-ideal artifact," while the "ideal" UDT agent remains undefined or computationally unreachable, the theory risks becoming non-normative in practice and unfalsifiable in principle.
      *   **Why it's Fatal:** A normative theory must provide actionable guidance or make falsifiable claims about rational behavior. If UDT only provides prescriptions for agents with impossible computational powers (e.g., evaluating all possible programs against the universe's structure), its relevance to *human* or even *AGI* decision-making is severely undermined. Unlike EDT/CDT which make clear (though sometimes wrong) predictions in specific, testable scenarios (Newcomb, Smoking Lesion, Toxin Puzzle), UDT's core prescriptions seem shielded from direct empirical refutation at the "ideal" level.
      *   **UDT Response & Concession:** A committed UDT proponent *might* concede this as a practical limitation but argue the ideal theory still defines "rationality" in principle. However, they *must* concede that **UDT lacks a unique, empirically distinguishable signature in the real world where agents are bounded.** Its superiority often relies on hypothetical predictors/simulators that exploit logical dependencies in ways real-world causality rarely does. If pressed, they might point to multi-agent, game-theoretic settings (e.g., coordinated decision problems like Twin Prisoner's Dilemma) as potential discriminators, but even here, robust implementation is key, and other theories (like TDT) might converge.

  2.  **The Logical Counterfactual Engine Hole (High Severity):**
      *   **The Problem:** UDT fundamentally relies on evaluating `P(Outcomes | Output = A)` for different actions `A`, where the conditioning is on a *logical fact* ("My decision procedure outputs A") rather than a causal intervention. **No consensus exists on how to formally define or compute these probabilities.** Proof-theoretic approaches (what proofs does the universe "know"?) are highly abstract and lack a clear semantics for realistic physical universes. Modal approaches face similar grounding issues. This isn't just an implementation detail; it's the core machinery.
      *   **Why it's Severe:** Without a robust, formal account of logical counterfactuals, UDT remains a promissory note, not a complete theory. It's vulnerable to paradoxes (e.g., counterfactual blackmail loops, where simulators exploit the very logical dependence UDT relies on) and struggles to provide clear answers in complex scenarios involving nested reasoning or logical uncertainty.
      *   **UDT Response & Concession:** Proponents acknowledge this is the hardest part. They view it as an active research program (logical uncertainty, reflective oracles, logical induction). They'd likely concede **UDT is incomplete without a satisfactory theory of logical counterfactuals** and that current implementations are approximations. However, they argue the *intuition* (value learning depends on logical relationships, not just causality) is sound and worth formalizing.

  3.  **Computational Updatelessness & The Phantom Prior Self (High/Moderate Severity):**
      *   **The Problem:** Your "reductio" is spot on. UDT tells the agent *now* to act as their *original, ignorant prior self* would have chosen them to act *in this very situation*, knowing everything the agent now knows. But the original prior self didn't have the computational resources or time to *simulate* the agent's current state of knowledge and deliberation! **Which "prior self" is being referenced?** The self just before any observations? The self before any *relevant* observations? The self with a specific computational budget?
      *   **Why it's Severe/Moderate:** This creates a fundamental ambiguity for any non-ideal agent. Choosing a specific "prior self" moment seems arbitrary. If you pick a self with *less* computation, you're acting dumber. If you pick a self with *more* computation (simulating your future knowledge), you're begging the question – how did *that* self decide? It reveals a tension between the "updateless" ideal and the computational reality of sequential information gathering and processing.
      *   **UDT Response & Concession:** Proponents often retreat to the idealization: a sufficiently powerful prior self *could* have precomputed the optimal response function for all possible future experiences. They might argue the theory specifies *what* to compute (the best mapping from inputs to actions according to the prior), not *when* to compute it. However, they must concede that **for bounded agents, translating the UDT ideal into a concrete algorithm involves significant, non-trivial choices about approximation, computation allocation, and "freezing" the policy**, choices not dictated by the core UDT principle itself and potentially vulnerable to manipulation (e.g., by predictors modeling your approximation method).

  4.  **Fragmentation of Updatelessness (Moderate Severity):**
      *   **The Problem:** You correctly identify two distinct ideas: (1) Ignoring indexical uncertainty (SB anthropics) and (2) Ignoring information about your own action as a causal lever (Newcomb). While both involve conditioning on logical facts, they address different problems. **Does UDT collapse if the indexical part fails?** The core Newcomb reasoning might survive, but it weakens the claim of a unified "updateless" principle. The unity *is* somewhat apparent through the lens of a predictor/simulator who uses logical information.
      *   **Why it's Moderate:** The core strength of UDT (handling Newcomb, Counterfactual Mugging) relies primarily on the second part (logical dependence of outcomes on decisions). Anthropic problems (SB) are a distinct, albeit related, challenge. UDT's handling of SB is also controversial; some argue it gets it "wrong" compared to other updateful approaches.
      *   **UDT Response & Concession:** A proponent would likely argue that both scenarios *do* involve conditioning on logical facts about the agent's location or decision output within the world model. They might concede that **indexical uncertainty poses unique problems for defining the prior and the "original" perspective**, potentially requiring additional principles beyond core UDT, but maintain that the *logical* core (part 2) remains coherent and powerful even if anthropics are messy.

  **Addressing the Insulation & Comparison Worries:**

  *   **Is UDT Falsifiable?** At the *ideal, normative* level, it's incredibly hard to falsify directly, precisely because it mandates maximizing the *original* prior's expectation over the *logical* consequences of your *entire decision program*. Deviations are blamed on boundedness or flawed logical uncertainty handling. This contrasts with CDT, which makes a clear, falsifiable *causal* claim in Newcomb (taking two boxes gets more money). EDT makes a clear *evidential* claim. UDT's predictions are contingent on the agent's prior and logical uncertainty model, making them less directly testable. **This insulation *is* a problem for a normative theory claiming to describe rationality for agents like us.** While EU theory also idealizes, its core prescription (maximize subjective EU) is straightforward to apply locally; UDT's prescription points to a computationally intractable global optimization.
  *   **UDT vs. EDT vs. CDT:**
      *   **EDT "with extra steps":** There's truth here. UDT shares EDT's focus on correlation/dependence rather than causation *per se*. However, UDT generalizes it: EDT conditions on the *action* itself (`P(Outcome | Do(A))`), which can be ill-defined when the action is a logical fact. UDT conditions on the *logical output* of the decision procedure (`P(Outcome | Output=A)`), which is more fundamental and avoids some EDT pitfalls (e.g., evidentialists often *lose* in Twin PD if they condition naively on their action). UDT also explicitly handles precommitment and indexical uncertainty in a way basic EDT doesn't. It's EDT generalized and grounded in logical facts.
      *   **CDT + Precommitment:** This is less accurate. CDT fundamentally rejects the logic of Newcomb. Precommitment *can* help CDT agents mimic UDT in *some* specific scenarios (e.g., binding oneself to one-box), but it's a tactical hack. UDT provides a *unified principle* for why that precommitment is rational *across all scenarios* involving logical dependence, not just ones you foresee and explicitly precommit for. CDT + precommitment doesn't tell you how to act in Counterfactual Mugging or the $5/$10 problem without ad-hoc additions. UDT does, directly from its core principle.
      *   **Should you be embarrassed?** No. UDT represents a significant conceptual leap by rigorously formalizing the idea that rationality involves optimizing the logical consequences of your decision algorithm from the perspective of its creation. It *generalizes* insights from both EDT (dependence matters) and precommitment (think globally) into a broader framework. While it has deep problems, it's not merely derivative. The embarrassment would only come from dogmatically ignoring the severe challenges it faces, particularly insulation and logical counterfactuals.

  **Conclusion:**

  Your worry-list is excellent and hits the major pressure points. **The most fatal flaws are the Insulation Problem (making UDT unfalsifiable and impractical) and the lack of a formal engine for Logical Counterfactuals.** Computational Updatelessness is a severe practical limitation revealing a tension in the theory for bounded agents. Fragmentation is a moderate concern about unity but less damaging to the core Newcomb/Counterfactual Mugging logic.

  A committed UDT proponent would readily concede points 2 (Logical Counterfactuals as a research hole) and 3 (Computational challenges), while vigorously defending the core principle and arguing point 1 (Insulation) is a limitation of *all* ideal theories and point 4 (Fragmentation) doesn't undermine the core. They would strongly reject the characterization as merely EDT or CDT+precommitment, emphasizing UDT's unique grounding in logical dependence and global optimization of the decision program. However, the burden remains on UDT to provide a non-circular account of logical counterfactuals and demonstrate unique, testable advantages for non-ideal agents to overcome the insulation critique. Until then, it remains a powerful but deeply problematic idealization.
