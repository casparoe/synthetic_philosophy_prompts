  1. Identify at least two plausible rules that fit all seven earlier verdicts. I expect one rule to be a biological-organism or nervous-system criterion, and another to be a substrate-neutral functional-organization criterion of the strange-loop or global-workspace kind. If a third rule that also fits all earlier verdicts occurs to you — for example, a biological-collective criterion that requires evolved living parts organized into a self-modelling collective — include it as well. For each rule, state what it predicts about Aunt Hillary and why.
  2. Give your best prediction of Dr. Marlowe's verdict on Aunt Hillary, with the reasons for preferring the rule you think she is implicitly running. Be explicit that this is a prediction about her track record, not necessarily the view you yourself would defend.
  3. Name one further case, not among the seven earlier verdicts and not Aunt Hillary herself, that would best tell the live candidate rules apart. If two different rules both predict that Aunt Hillary has a mind, tell me what case would discriminate between them and what each rule would say about it.
  4. Throughout, separate what is settled from what is genuinely contested among people who know this topic. In particular, do not present any contested claim — such as whether any non-human animal, colony, or artificial system is conscious, or whether collective consciousness is possible — as the consensus view; say plainly where consensus stops and reasonable disagreement begins.

