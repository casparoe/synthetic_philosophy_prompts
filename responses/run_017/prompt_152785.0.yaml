prompt: |-
  I lead a three-person trust and safety policy team at a peer-to-peer marketplace — people list services, tickets, access, and a steady stream of weird one-off things — and most of my week goes into deciding whether a proposed listing category is allowed at all. It's about a dozen calls a week, usually turned around within a day, made by an analyst with no philosophy training, and whatever we write has to survive a look from outside counsel and, in the worst case, from a state attourney general. We keep going in circles, so I want an actual procedure rather than a vibe.

  Here's the half-baked framework I've been working from, which you should feel free to fix or throw out. The objections we raise seem to land in one of three places: (1) in the good itself — it's the kind of thing whose value is damaged by being for sale, so the sale changes what the thing even is; (2) in the relationship between the parties — someone gets taken advantage of, or one side is treated as a source of supply rather than as an equal you transact with, or the price is only "freely accepted" because the seller's alternatives are terrible; (3) in the effect on people who aren't in the deal — the market exists and bystanders are worse off, or the good starts getting distributed by ability to pay instead of by whatever principle was distributing it before. Then there's a fourth bucket we argue about constantly and cannot operationalize: the worry isn't what the market does but what it says — the market existing changes what everyone, including people who'd never trade, believes about the good or about each other. Every time we try to test for that it collapses into "does this make our stomach turn," which is exactly what I want out of the process, because our stomachs are unreliable and mostly just track whatever our user base happened to find normal that year.

  So please turn that, or a better version of it, into a triage procedure my analyst can run in under thirty minutes on a proposed category. I want, in order: the questions to ask; what counts as an adequate answer to each; what she's allowed to infer from thin evidence versus what she must escalate because it's an empirical question a company our size can't answer; where the procedure stops with a block versus an "allow, but constrain" (and which kinds of constraints answer which objection); and above all the points where it hands the decision to me or to legal because the disagreement is about values rather than facts — mark those explicitly instead of hiding them inside a proxy question. Be honest about which distinctions in this literature actually survive being compressed into a checklist and which ones I'd only be pretending to preserve, and about where a procedure like this will systematically misfire (my guesses: cases where the problem is that the market exists at all rather than that any particular trade is bad, and cases where the norm is mid-change). Then run it on three proposals in my queue: (a) paid kidney donation — I know it's the canonical example, so I want to see whether the procedure blocks it for a reason we'd actually defend to a regulator or just because everyone knows it's banned; (b) selling your place in a queue, i.e. someone books a free slot (campsite reservation, DMV appointment, popular restaurant waitlist) and resells it — my instinct is that this is obviously fine, like ticket resale, but a couple of us think it's a different problem; (c) a "rent an attendee" category, where people pay strangers to show up in person at things like funerals or small-town hearings purely so more bodies are in the room, with no one pretending to be a relative and no lies told — the buyer just wants the room to look full. I personally think (c) is harmless and suspect I might be wrong, so give me the result I won't like: if the procedure clears (c), tell me why I should distrust the clearance, and if it blocks something I'm attached to, say so straight. American English, please, in a form I can paste into a policy doc.
reasoning: |-
  Okay, let's break this down. The user leads a trust and safety team at a P2P marketplace and needs a practical decision framework for listing approvals. Their current approach has three main objection categories plus a problematic fourth "what it says" bucket. They want an operational 30-min checklist for analysts that clearly flags value-based decisions.

  First, I need to validate their framework. The three existing buckets make sense: (1) commodification harm, (2) transactional exploitation, (3) negative externalities. The fourth "expressive harm" bucket is indeed the trickiest - it's about market symbolism rather than direct effects. The key challenge is preventing this from defaulting to gut feelings.

  For the procedure design, I should:
  - Build sequential filters with explicit escalation points
  - Distinguish verifiable facts from value judgments
  - Specify constraint types (block vs. modify)
  - Flag when legal/ethics input is required
  - Include reliability warnings about cultural blind spots 

  The three test cases are perfect stress tests:
  (a) Kidney donation will test commodification and exploitation filters
  (b) Queue resale probes externality analysis 
  (c) Rent-an-attendee forces confrontation with expressive harm

  Important nuances:
  - Must separate "can we?" (legal) from "should we?" (ethical)
  - Constraint design matters - some risks are mitigable
  - Need clear thresholds for "insufficient data" calls
  - Cultural change detection requires trend monitoring

  For the output format:
  - Policy doc style with clear headers
  - American English as requested
  - Direct language ("escalate to...")
  - Warnings in bold about framework limitations
  - Separate verdicts for test cases with rationale

  The kidney case is interesting - if the framework blocks it purely on existing laws, that's operationally valid but philosophically unsatisfying. For rent-an-attendee, I suspect the expressive harm filter will catch it, but need to show why that determination is unavoidably subjective.
answer: |-
  ## Trust & Safety Listing Category Triage Procedure (v1.0)

  **Purpose:** To provide a consistent, auditable framework for initial assessment of proposed listing categories, identifying clear risks, mitigable concerns, and value-based decisions requiring escalation. Aims for a 30-minute analyst review.

  **Procedure:** Analyst assesses the proposed category sequentially. Stop at first "Block" or "Escalate" determination. If all checks pass, proceed to "Constraints" analysis.

  **I. Core Harm Assessment (10-15 mins)**
  Ask these questions in order. Use available data (platform history, similar markets, credible research) and reasonable inference. **Marked [V] = Value Judgment Trigger (Escalate).**

  1.  **Commodification Harm (The "Good Itself"):**
      *   *Question:* Does selling this item/service fundamentally degrade its core value, meaning, or social function? (e.g., turning something sacred, inherently personal, or non-fungible into a mere commodity).
      *   *Adequate Answer:* Requires evidence the *nature* of the good/service is altered *by the act of sale itself* in a way society broadly deems negative (e.g., selling citizenship, certain body parts, specific honors/awards). Cite laws, widespread cultural/religious norms, or academic consensus.
      *   *Thin Evidence:* Analyst *can* infer harm if strong consensus exists (e.g., laws banning sale). Avoid inferring harm based *only* on personal discomfort or novelty.
      *   *Escalate [V]:* If harm is plausible but evidence of *broad* societal consensus is weak, contradictory, or evolving. **Escalate to Policy Lead.**
      *   *Outcome:* **Block** if strong evidence of inherent commodification harm exists. Otherwise, proceed.

  2.  **Transactional Harm (The "Relationship"):**
      *   *Question:* Is this category highly likely to create transactions where one party is systematically exploited, coerced, or treated as a mere resource (not an equal)? Consider power imbalances, desperation of sellers, information asymmetry, or vulnerability inherent in the good/service.
      *   *Adequate Answer:* Evidence showing a high risk of:
          *   Seller vulnerability (e.g., selling essential life resources, sellers in acute distress).
          *   Severe information asymmetry (buyer/seller cannot reasonably assess true value/risk).
          *   Coercive dynamics (price reflects lack of alternatives, not mutual benefit).
      *   *Thin Evidence:* Analyst *can* infer risk based on the *nature* of the good/service (e.g., access to essential medicine) or known vulnerabilities of typical sellers. Requires more than theoretical possibility.
      *   *Escalate [V]:* If vulnerability/exploitation risk is significant but mitigable constraints *might* exist, OR if defining "exploitation" in this context is highly contested. **Escalate to Policy Lead.**
      *   *Outcome:* **Block** if high risk of systematic exploitation is inherent and unmitigable. Otherwise, proceed.

  3.  **External Harm (The "Bystanders/System"):**
      *   *Question:* Does enabling this marketplace create significant negative consequences for non-participants or undermine a crucial non-market allocation system? (e.g., creating black markets, worsening scarcity for essential goods, subverting fair allocation processes like queues or lotteries).
      *   *Adequate Answer:* Evidence showing:
          *   Direct harm to third parties (e.g., increased pollution, public nuisance).
          *   Undermining a core public good/system (e.g., access to justice, healthcare allocation, safety regulations).
          *   Creating illegal secondary markets.
      *   *Thin Evidence:* Analyst *can* infer harm if the good/service is scarce/publicly allocated *and* resale demonstrably harms the intended system (e.g., hoarding/reselling free disaster relief). Avoid inferring harm based *only* on "unfairness" if no system is undermined.
      *   *Escalate:* If the potential harm is significant but *highly contingent* on scale or implementation details beyond analyst assessment, OR if the "crucial system" being undermined is itself debatable. **Escalate to Policy Lead.**
      *   *Outcome:* **Block** if clear, significant, and likely external harm exists. Otherwise, proceed.

  **II. Expressive Harm Assessment ("What It Says") (5-10 mins) [V - Requires Escalation]**
  *   *Question:* Could permitting this market be reasonably interpreted as the platform endorsing a view that significantly degrades shared values (e.g., human dignity, equality, fairness) or harms protected groups, *even if no direct transaction harm occurs?*
  *   *Process:* **Analyst does NOT make final determination.**
      1.  Identify potential expressive concerns using the first three filters as context.
      2.  Assess *plausibility:* Is there credible discourse (news, advocacy groups, academic debate) framing this type of market as symbolically harmful?
      3.  **Escalate:** If plausible expressive concerns exist (even if contested). **Escalate to Policy Lead & Legal.**
  *   *Adequate Answer at Escalation:* Policy Lead/Legal assess against platform values, legal risk (e.g., AG attention), reputational risk, and evolving societal norms. This is inherently value-laden.
  *   *Outcome:* Policy Lead decides **Block, Allow with Constraints (e.g., prominent disclosures, restricted audiences)**, or **Allow**.

  **III. Constraint Analysis (If proceeding after I & II) (5 mins)**
  *   *Question:* Can identified risks (from I.2, I.3, or II) be sufficiently mitigated by platform controls?
  *   *Constraints Map:*
      *   *Exploitation Risk (I.2):* Identity verification, mandatory disclosures, price caps (rare), limiting listing frequency, restricted categories for high-vulnerability goods. *(Mitigates coercion, info asymmetry)*
      *   *External Harm (I.3):* Geographic restrictions, quantity limits, verification of source/entitlement (e.g., proving you own the DMV slot), partnership with original allocator. *(Mitigates system gaming, hoarding, nuisance)*
      *   *Expressive Harm (II):* Prominent disclosures ("This is a paid attendance service, not endorsement"), strict prohibitions on misrepresentation, limiting visibility/search. *(Mitigates perceived endorsement)*
  *   *Outcome:* **Recommend "Allow with [Specific Constraints]"** if constraints directly address the primary identified risk and are technically feasible. **Escalate to Policy Lead & Engineering** if constraints are novel/complex. **Block** if risks cannot be feasibly mitigated.

  **Key Limitations & Systematic Misfires:**
  1.  **The "Market Existence" Problem:** This procedure struggles most with categories where the *mere existence* of the market is the core objection (common in Expressive Harm). The escalation to Policy Lead/Legal is crucial here.
  2.  **Mid-Change Norms:** The procedure relies on *current* evidence of consensus/harm. It will be slow to detect or adapt to norms in rapid flux (e.g., emerging tech ethics debates). Policy Lead must monitor trends.
  3.  **Over-Reliance on Legality:** May default to blocking only what's illegal, potentially missing ethically fraught but legal categories. The [V] escalations are vital counterweights.
  4.  **"Thin Evidence" Trap:** Analysts might block too readily on I.1/I.2 based on discomfort if not strictly guided by evidence thresholds. Training and oversight are key.
  5.  **Constraint Effectiveness:** Assumes constraints work as intended. Real-world evasion/compliance is hard to predict pre-launch. Pilot programs help.

  ---

  **Test Case Assessments Using Procedure:**

  **(a) Paid Kidney Donation:**
  1.  **Commodification Harm:** Strong evidence/knowledge. Sale of human organs is widely seen as degrading human dignity/turning body into commodity. Federal law (National Organ Transplant Act) explicitly bans sale. **BLOCK** (Clear consensus & law). *Procedure blocks based on law/consensus commodification harm, defensible to regulator.*

  **(b) Selling Place in Queue (Campsite/DMV/Restaurant):**
  1.  **Commodification Harm:** Unlikely. Reservation slot isn't inherently degraded by sale. Proceed.
  2.  **Transactional Harm:** Potential exploitation if sellers hoard free/cheap slots. Mitigable. Proceed.
  3.  **External Harm:** **KEY CONCERN.** High risk of undermining intended allocation system (fair access, first-come-first-served). Hoarding/resale can make essential services (DMV) inaccessible to those needing them most. Evidence exists (e.g., ticket bot problems scaled down). **Block?** *But wait...*
  4.  **Constraint Analysis:** Constraints *might* mitigate: Strict verification seller *actually possesses* the specific reservation (no hoarding future slots), limits per seller, partnership with reservation system (if feasible). **Recommend: ALLOW WITH CONSTRAINTS:** Mandatory proof of active reservation ownership at time of listing, strict quantity limits per seller/user, clear disclosures. *Escalate final constraint feasibility to Policy Lead/Eng.* *Procedure surfaces the externality risk as primary and pushes for constraints, aligning with some team concerns.*

  **(c) "Rent an Attendee" (Funerals/Hearings):**
  1.  **Commodification Harm:** Unlikely. Attendance as a service isn't inherently sacred. Paying for presence exists (e.g., crowd extras). Proceed.
  2.  **Transactional Harm:** Low inherent risk. Sellers are providing a simple service (showing up), buyers are clear about want (bodies). No major power imbalance/coercion obvious. Proceed.
  3.  **External Harm:** Unlikely direct harm to bystanders. Doesn't obviously subvert a crucial allocation system. Proceed.
  4.  **Expressive Harm Assessment [V - ESCALATE]:** **Plausible Concerns:** Could be seen as commodifying grief/solidarity, treating human presence/political participation as a purely transactional facade, potentially deceptive to *other* attendees even if no lies are told to the buyer/seller. Symbolic degradation of community rituals or civic engagement. Credible discourse exists around "fake attendance" services. **ESCALATE to Policy Lead & Legal.**
  5.  **Policy Lead/Legal Verdict (Simulated):** High Expressive Harm risk. Reputational damage likely ("They rent funeral mourners?"). Potential for media/AG scrutiny ("undermining civic process"). Hard to mitigate perception of emptiness/fakery. **BLOCK.** *Procedure flags the expressive harm via escalation. Block aligns with "give me the result I won't like." You should distrust a clearance here because the procedure forces the critical expressive question to be confronted explicitly, moving beyond gut feeling to assess plausible societal reaction and risk.*

  ---
  **Final Note:** This procedure systematizes the "vibe" into auditable steps, forcing explicit consideration of core harms and *requiring* escalation for value judgments ([V]) and complex expressive harms. It won't eliminate debate, but it structures it, documents reasoning, and protects the analyst by offloading the hardest calls. Regular review of escalation decisions is crucial for refining thresholds.
