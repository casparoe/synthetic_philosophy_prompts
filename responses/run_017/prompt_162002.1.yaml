  - No villains; every person in the chain acts reasonably
  - Must show two losses: credibility deficit due to the reporter's identity, and replacement of imperfect original language with bureaucratic terms
  - Cannot be simplistic "believe victims" messaging; must include at least one instance of over-credibility
  - Ending should be unresolved, with the accurate word appearing too late
  - Accessible language, no jargon, administrator-approved

  Brainstorming the chain of hands:
  1. The girl (reporter): uses raw, imprecise language to describe an incident
  2. Her friend: quotes directly but filters through personal bias
  3. Teacher: rephrases into educational framework, focuses on actionable elements
  4. Dean: fits into conduct code categories, loses nuance
  5. Written report: freezes into official language
  Critical transitions:
  - Girl to friend: loss of emotional weight when removed from original context
  - Friend to teacher: shift from personal account to professional assessment
  - Teacher to dean: compression into predefined categories
  - Dean to report: concretization of fluid experience

  Vocabulary laundering examples:
  Original: "he kept making it hard to breathe near me"
  Becomes: "repeated invasions of personal space"
  Then: "violation of physical boundaries"
  Finally: "Code 3.2: Proximal Harassment"

  The core mechanism: identical lines change function:
  - Line 2 (girl): "He kept making it hard to breathe near me" → direct experience
  - Line 1 next stanza (friend): same words now framed as hearsay
  - Line 3 later stanza (dean): now evidence for categorization

  Late-arriving truth: in the final stanza, the girl realizes "It was the air he was taking" but this insight comes after the report is closed

  Ensuring balance:
  - Teacher reasonably says "I can't act on what friends overhear"
  - Dean must match incident to conduct code categories
  - Friend misremembers a detail showing over-credibility
  - Assistant principal would approve phrases like "disruptive behavior" and "proper channels"

  Title must pass admin approval while resonating with students: "Chain of Custody" subtly references evidence handling while feeling neutral

  Rhyme scheme: light alternating rhyme (breath/said, me/see) but prioritizes natural speech over perfect meter. Repeating lines sound organic in new contexts—e.g., "it happened again Tuesday" shifts from complaint to evidentiary fact

  Final check against requirements:
  - No villains: all characters act within their roles
  - Two losses: credibility (ignored when she says it) + language (replaced by official terms)
  - Bidirectional credibility: friend adds erroneous detail
  - The word "suffocation" appears only in the report's aftermath
