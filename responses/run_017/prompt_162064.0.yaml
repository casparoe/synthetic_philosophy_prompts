answer: |-
  Here’s a battle-tested Q&A prep sheet prioritizing existential threats, audience framing, and strategic concessions. Objections are ordered by **lethality** (capacity to collapse the core thesis), with explicit soft spots flagged.

  ---

  ### **Preemptive Concessions (First 2 Slides)**
  - **CONCEDE:** Virtual artifacts are *ontologically dependent* on platforms (no code → no object).  
  - **CONCEDE:** Platforms *can* legitimately destroy objects (e.g., routine server maintenance).  
  - **REFUSE TO CONCEDE:** That dependence makes objects "mere permissions" or reduces harm to welfare loss.  
  - **REFUSE TO CONCEDE:** Provenance is reducible to contractual terms (it’s a metaphysical feature of the artifact).

  ---

  ### **Objection Ranking & Replies**  
  *(Descending Order of Lethality)*  

  1. **Property Theorist’s "License Revocation" Challenge**  
     *Objection:* "If virtual objects are just bundles of permissions governed by ToS, deletion is license revocation—not usurpation. Why isn’t this just breach of contract? What work does ‘usurpation’ do?"  
     **Reply:** Usurpation captures the *relational harm between agents*: the griefer hijacks the victim’s practical authority mid-project, whereas license revocation (e.g., shutdown) lacks this agentive takeover. Contracts govern access; they don’t erase the artifact’s intersubjective reality (*soft spot: assumes social ontology over legalism*).  
     **Danger:** If this lands, your account of harm collapses into contract law.  

  2. **Metaphysics Chair’s "Circular Identity" Challenge**  
     *Objection:* "Provenance-dependent identity seems circular: if the artifact is *constituted* by community practices, but those practices *presuppose* the artifact, how do you avoid vicious circularity?"  
     **Reply:** Artifacts and practices co-evolve dynamically (like constitutions and interpretations). The object’s identity is fixed at creation *by* the rules, but its persistence depends on practice-sustenance—no more circular than "money" (*soft spot: handwaves metaphysical grounding*).  
     **Danger:** Undercuts your solution to the copy problem.  

  3. **Welfarist Ethicist’s "Translation Test"**  
     *Objection:* "If we delete the sword but erase the player’s distress with a pill, what harm remains? If none, isn’t harm just welfare loss?"  
     **Reply:** The pill erases *felt* harm but not the *objective* harm: the project is still failed by external intervention. Burning a novel and erasing the author’s memory doesn’t undo the vandalism (*soft spot: assumes non-welfarist harm is intuitive*).  
     **Crucial to Land:** If this fails, your entire harm framework implodes.  

  4. **Property Theorist’s "Standing" Challenge**  
     *Objection:* "Who owes restoration? The griefer? The platform? If the platform permits deletion, how is this not just players assuming risk?"  
     **Reply:** The griefer owes restoration (if possible) *to the victim* because they usurped authority. Platforms may owe compensation but aren’t usurpers (*soft spot: avoids legal remedies*).  

  5. **HCI Researchers’ "Empirical Distinction" Challenge**  
     *Objection:* "Where’s evidence players distinguish ‘grief’ (shutdown) from ‘outrage’ (griefing) as you claim? [*Guess: They’ll cite studies showing uniform distress language*]."  
     **Reply:** Player forums (e.g., EVE post-heist rage vs. graceful shutdown farewells) and ethnographies (e.g., Boellstorff 2015) show distinct moral vocabularies (*soft spot: anecdotal; concede need for cross-genre study*).  

  6. **Metaphysics Chair’s "Artifactual Overreach"**  
     *Objection:* "How is your ‘code-practice artifact’ meaningfully different from Searle’s institutional facts? Isn’t this just ‘X counts as Y in C’ with extra steps?"  
     **Reply:** Institutional facts lack *material history*: the Minecraft cathedral’s identity depends on *this player’s* 200-hour labor, not just collective acceptance (*soft spot: risks reinventing wheel*).  

  7. **EVE Online Grad Student’s "Permitted Heist"**  
     *Objection:* "If EVE’s rules permit theft, is the bank heist usurpation or just gameplay? Doesn’t your account condemn core game mechanics?"  
     **Reply:** Permitted heists are *consensual project-risks* (like gambling), not usurpation. Usurpation requires *non-consensual authority seizure* outside accepted rules (*soft spot: fuzzy consent boundary*).  
     **Hoped Nobody Asks:** This forces a messy "rules vs. morality" debate.  

  8. **Welfarist’s "Harm To Whom?"**  
     *Objection:* "If harm isn’t to welfare, what is it *to*? The project? But projects aren’t moral patients."  
     **Reply:** Harm is *to the agent* via destruction of their *invested practical identity*—akin to vandalizing a voter’s ballot (*soft spot: borrows from non-standard agency theories*).  

  ---

  ### **Critical Prep Priorities**  
  - **Defend This or Perish:** The **Translation Test reply** (Objection 3). If welfare is the only harm, your thesis dies.  
  - **Weak Point to Fortify:** **Provenance without circularity** (Objection 2). Rehearse the creation/persistence distinction.  
  - **Dangerous Objection:** **#1 (License Revocation)**. It reframes your entire account as redundant.  
  - **Strategic Pivot:** When pressed on metaphysics, return to *phenomenology of harm* ("Imagine your half-finished novel...").  
  - **Concede Early:** Platform dependence (disarms "it’s just code" reductions).  
  - **Never Concede:** That welfare loss exhausts harm (your core innovation).

  **Final Note:** The real threat isn’t the copy problem—it’s the **property theorist reducing artifacts to permissions**. If you lose that battle, usurpation has no foothold. Prepare analogies to physical artifacts (e.g., a leased car: revocation vs. theft).
