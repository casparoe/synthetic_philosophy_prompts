prompt: |-
  I'm a junior majoring in philosophy, and this term I'm in a seminar on race, aesthetics, and politics. We spent most of two weeks on the W. E. B. Du Bois essay about Black art — "Criteria of Negro Art," I think it's called, the one where he says that all art is propaganda and always must be, that he doesn't care about art that isn't used for propaganda, and that this is no license for bad art, because the propaganda has to be beautiful and true to count as art at all. I finished the reading convinced, and then realized that being convinced hasn't changed a single thing I actually do, which makes me suspect I understood it less well than I thought.

  Here is what I mean. I sit on the student exhibitions committee for the gallery in our student union: twice a month, in a ninety-minute meeting, six to ten proposals for small commissions — anywhere from $500 to $3,000 — from student and local artists for work to be installed in the building or shown in the gallery cases. We vote, we write a paragraph of reasons that goes back to the applicant, and the gallery director reviews what we recommend and can veto it (she has, once, over insurance and once over a work that would have needed a structural engineer). Our rubric is three lines — artistic merit, message, fits the space — and it is useless, because every real disagreement we have turns out to be a fight inside the first line. I would like to replace it with a decision procedure built honestly out of Du Bois's position: art should be propaganda; propaganda that isn't made well isn't art; and craft that carries nothing is decoration. Please write me that procedure as an ordered set of questions a committee of non-specialists can run in about fifteen minutes per proposal, each with a stop rule: what counts as passing, what counts as an immediate no, and which questions have to be kicked to a person — the director, the artist, the people depicted — because they are disagreements about values rather than facts and no checklist can settle them. Keep the distinctions in Du Bois's view that are actually doing the work and drop the ones that only matter in a seminar paper, and be blunt about where a rubric like this will misfire.

  Two half-formed ideas of my own, which you should use or discard as you see fit. The first is a subtraction test: take the political content away and ask whether the object still holds up as a made thing, then take the craft away and ask whether the message still reaches anyone who wasn't already persuaded — so that a slogan on a beautiful surface and a beautiful surface with a slogan stapled to it both fail, for different reasons. The second is that propaganda has an addressee, and it matters who it is: a work addressed to the people it depicts, or to the people it wants to move, seems to me a different animal from a work whose real content is that its sponsor is a decent institution, and I don't know what Du Bois's view implies about that second kind. Then run the finished procedure on three kinds of proposal we get constantly. One: a large, genuinely accomplished mural for the dining hall wall about the scheduling of subcontracted food-service workers, proposed by a student labor group, with a student artist whose portfolio is strong and a facilities office that is quietly unhappy. Two: a polished, professionally produced installation funded by the bank that handles the university's accounts — beautiful, costs us nothing, says that everyone on this campus belongs, and puts the bank's name on the wall label; we currently approve these cheerfully and I want to know whether we should. Three: a stack of photocopied posters from the tenants' union in the neighborhood next to campus, about a rent increase at a building the university's foundation has a stake in — the committee agrees with them completely, the people affected made it themselves, and the design is honestly bad; I suspect this is the case where the procedure says something we don't want to hear, and I want to see whether it has to say it or whether it can offer us a condition instead of a no. Finally, tell me what the procedure cannot do — what it will get wrong, which of our decisions it will not touch, and where it will quietly turn into a vote dressed up as a test. Please write the whole thing in American English.
reasoning: |-
  Okay, the user is a philosophy junior working on a student exhibitions committee. They've been studying Du Bois's "Criteria of Negro Art" and want to apply his ideas to their art selection process. They need a practical decision procedure based on Du Bois's principles: art as propaganda, requiring both message and craft, rejecting mere decoration. 

  Hmm, the user's frustration is palpable—they understand Du Bois intellectually but feel it hasn't changed their actions. That disconnect between theory and practice is exactly what they're trying to bridge. Their committee's current rubric ("artistic merit, message, fits the space") is too vague, leading to circular debates. Smart of them to notice that.

  Their two half-baked ideas show real engagement: the "subtraction test" is a solid diagnostic tool, and the question about propaganda's audience cuts to a key ambiguity in Du Bois. The three test cases they describe are perfect stress tests—especially the bank-funded installation (slick but corporate) and the tenants' union posters (authentic but poorly designed). 

  The challenge is translating dense theory into a 15-minute checklist for non-specialists. Must avoid academic jargon. Core Du Bois principles to preserve: 1) Art must have purpose (propaganda) 2) Bad craft kills art 3) Decoration isn't art. Can discard his historical specifics about "Negro Art"—the universal core is what matters here. 

  For the procedure: should be question-based with clear stop rules. Need fail-fast gates upfront (e.g., "Is this art or decoration?"). The subtraction test can be Question 2. The audience question needs inclusion—maybe as a tiebreaker. For the "fits space" practicalities, keep it last since Du Bois wouldn't prioritize that. 

  Biggest traps: The bank proposal will pass craftsmanship but fail the propaganda test (it's institutional PR). The tenant posters might fail craft but could be salvaged if the committee helps improve execution. The mural is the ideal case—strong on all fronts. Should explicitly call out where the rubric will misfire: like when craft/message are adequate but not exceptional, forcing subjective votes anyway. 

  ...Writing response now with the three-part procedure, test case analyses, and limitations section. Emphasizing that no rubric eliminates judgment—just makes the values driving decisions visible. That's what the user really needs: not a magic formula, but a way to expose the politics they're already enacting.
answer: |-
  Here's a concrete decision procedure based on Du Bois's core principles, designed for practical committee use in 15-minute slots. It prioritizes his core argument: **Art *is* propaganda (carries a message/purpose); Propaganda *must* be well-crafted to *be* art; Craft without message is decoration.**

  **The Du Boisian Art Selection Procedure (v1.0)**

  **Ordered Questions & Stop Rules:**

  1.  **Is this primarily decoration? (The Craft-Without-Message Gate)**
      *   *Question:* Does the work exist mainly for aesthetic pleasure, formal experimentation, or visual appeal *without* a discernible message, argument, or purpose beyond itself?
      *   *Stop Rule - Immediate No:* **YES.** (It fails Du Bois's core requirement: art *is* propaganda). *Move to next proposal.*
      *   *Stop Rule - Pass:* **NO.** (It has a message/purpose, proceed to Q2).
      *   *Kick to:* **Committee Vote.** (If there's sharp disagreement on *whether* a message/purpose exists. This is a values judgment about intent/interpretation).

  2.  **Subtraction Test: Does the craft *carry* the message? (The Propaganda-as-Art Gate)**
      *   *Question A (Subtract Message):* If you conceptually *remove* the stated message/purpose, does the object still stand as a compelling, well-made thing based purely on its formal qualities (composition, technique, material use, skill)?
      *   *Question B (Subtract Craft):* If you conceptually *remove* the high-quality craft (imagine the same message conveyed via a crude sketch, a typed memo, or a poorly printed flyer), would the message still land effectively *on someone not already deeply sympathetic to it*?
      *   *Stop Rule - Immediate No:* **A = YES *and* B = NO.** (Beautiful surface, weak message reliance = *Decoration with a slogan stapled on*). **OR A = NO *and* B = YES.** (Strong message, weak craft = *Propaganda pamphlet, not Art*).
      *   *Stop Rule - Pass:* **A = NO *and* B = NO.** (The message *needs* this specific craft to be effective, and the craft *only* becomes fully realized *through* serving this message. This is the ideal: Propaganda *as* Art). Proceed to Q3.
      *   *Kick to:* **Committee Vote (with discussion).** (If A=YES *and* B=YES? Rare. Might be genuinely great art *and* great propaganda independently, or committee is divided. Discuss if craft/message truly *fuse*). **OR** If assessment of *craft quality* is highly technical (e.g., specific art conservation needs, structural engineering) - **Kick to Director/Expert.**

  3.  **Who is the Propaganda *For*? (The Audience & Integrity Check)**
      *   *Question:* Is the primary intended audience/beneficiary of the message the community depicted, affected, or needing uplift/change? Or is the primary audience the institution/sponsor/outsiders, signaling virtue or legitimacy?
      *   *Stop Rule - Not Immediate No, but Strong Warning:* **Primarily for Institution/Sponsor/Outsider Signaling.** (Du Bois is skeptical. This risks being propaganda *for the status quo* or *for the sponsor's image*, not transformative art). *Proceed to Q4, but flag this concern heavily.*
      *   *Stop Rule - Pass (Conditional):* **Primarily for Affected/Uplifted Community or to Move the Unconvinced.** (Aligns with Du Bois's intent for art as a weapon for justice). Proceed to Q4.
      *   *Kick to:* **Committee Vote.** (Judging primary audience/intent is inherently interpretive. Requires discussion).

  4.  **Practical Viability: Can it Physically & Legally Exist Here?**
      *   *Question:* Does the work fit the designated space physically and structurally? Can insurance and safety requirements be met? Are there legal/contractual barriers (e.g., sponsor demands, copyright)?
      *   *Stop Rule - Conditional Pass/Immediate No:* **YES** = Passes Du Bois criteria, subject to practical resolution. **NO** = Immediate practical rejection. *Reasons must be documented clearly (Director usually handles this).*
      *   *Kick to:* **Director/Facilities/Legal.** (These are factual, logistical, or legal determinations, not artistic judgments per Du Bois).

  **Applying the Procedure to Your Test Cases:**

  1.  **Labor Group Mural:**
      *   Q1: **NO** (Not decoration - clear message about workers).
      *   Q2: **A (Subtract Message):** NO (Strong portfolio suggests craft stands alone? Likely YES, proceed). **B (Subtract Craft):** NO (A crude flyer about scheduling wouldn't move the unconvinced? Likely YES, proceed). **Result:** Likely A=YES & B=YES → **Kick to Committee Vote/Discussion:** Does the *specific* craft of the mural *enhance and carry* the message about workers in a way a simpler form couldn't? (If the craft is genuinely integral to the message's power here, it passes Q2).
      *   Q3: **Pass (Conditional).** For the workers/to move the campus community.
      *   Q4: **Conditional Pass.** Subject to Facilities/Director resolving concerns. **VERDICT: LIKELY APPROVE** (if Q2 discussion confirms craft-message fusion).

  2.  **Bank-Funded "Belonging" Installation:**
      *   Q1: **NO** (Has a message: "everyone belongs").
      *   Q2: **A (Subtract Message):** YES (Polished, professional - looks good without the message). **B (Subtract Craft):** YES ("Everyone belongs" is a simple message; a basic sign conveys it). **Result:** A=YES & B=YES → **Immediate No** under Q2 Stop Rule. *It's beautiful decoration with a slogan stapled on, and the slogan doesn't need the craft.*
      *   Q3: **Strong Warning.** Primary audience is the institution/bank (signaling virtue/legitimacy), not primarily for marginalized groups needing affirmation or to challenge exclusionary systems.
      *   **VERDICT: REJECT** (Fails core Du Boisian test at Q2).

  3.  **Tenants' Union Posters:**
      *   Q1: **NO** (Clear message about rent increases).
      *   Q2: **A (Subtract Message):** NO (Design is "honestly bad" - likely wouldn't stand alone). **B (Subtract Craft):** YES (The message about rent increases is potent even on a basic flyer). **Result:** A=NO & B=YES → **Immediate No** under Q2 Stop Rule. *Strong message, weak craft = Propaganda pamphlet, not Art.*
      *   **BUT - Committee Option:** This is where the *purpose* of your space matters. The procedure flags it's not Art per Du Bois. *However,* your gallery might have a mission beyond *only* showing "Art" (e.g., community advocacy, documentation). The procedure exposes this tension. Instead of a flat "no," the Committee could:
          *   **A.** **Reject as *Art*,** but potentially accept as *documentation/community voice* in a different format/context (e.g., a vitrine display contextualizing the struggle, *alongside* better-designed supporting material if possible). This requires honesty about bypassing the "art" standard.
          *   **B.** **Offer Conditional Approval:** Work *with* the tenants' union. Can the committee provide design assistance/resources *pro bono* to elevate the craft *without* diluting the message/authenticity? Can it be presented in a way that strengthens its impact (better mounting, contextual text)? This turns a "no" into a collaboration to *achieve* Du Boisian art.

  **What This Procedure CANNOT Do (Where It Misfires or Masks Judgment):**

  1.  **Judge "Truth" Deeply:** Du Bois demands truth. The procedure *implies* it (Q1/Q3 touch on sincerity), but it can't rigorously investigate the factual accuracy or depth of the message. A beautifully crafted, well-intentioned lie might pass. Committees have to assume good faith or rely on external knowledge.
  2.  **Define "Good Craft" Objectively:** Q2 relies on committee assessment. Disagreements here are often fundamental aesthetic judgments disguised as applying Du Bois. The "Subtraction Test" helps structure the debate but doesn't eliminate subjectivity.
  3.  **Resolve Values Conflicts Disguised as Aesthetics:** Arguments about "artistic merit" (your old Q1 fights) often mask political disagreements. This procedure *surfaces* those conflicts earlier (especially at Q1 and Q3), but it doesn't resolve them. The "Kick to Vote" moments are where politics happen.
  4.  **Handle Adequacy vs. Excellence:** It has clear "No" gates and a "Pass" for the ideal fusion. But what about work that *barely* passes Q2 (adequate craft, adequate message delivery)? These will force a vote, and the rubric provides little guidance beyond "not failing." It doesn't help rank good-enough proposals.
  5.  **Eliminate Institutional Pressure:** The Facilities Office's quiet unhappiness or the Bank's influence exist outside the rubric. The procedure might say "Approve" the mural, but pressure might kill it anyway. It can't shield the committee from politics, only clarify the *artistic* rationale.
  6.  **Prevent "Box-Ticking":** A savvy but insincere artist could design work that technically passes Q1 & Q2 but whose message is vapid or whose audience focus (Q3) is performative. The procedure detects obvious fails but not sophisticated bad faith.
  7.  **Replace "Fits the Space":** Q4 is a bare-minimum gatekeeper. It doesn't help judge if it's the *best* work *for* that specific location, only if it *can* go there.

  **In essence:** This procedure forces the committee to explicitly confront **Message, Craft Fusion, and Audience** before getting lost in aesthetics. It rejects pure decoration and weak craft. It exposes corporate co-option (Case 2) and the limits of raw authenticity without form (Case 3). It clarifies *why* you're arguing (values vs. logistics vs. craft assessment). But it won't make the hard votes disappear; it just makes the values underlying those votes more visible, and forces a justification beyond "artistic merit." It turns Du Bois's seminar conviction into actionable, if sometimes uncomfortable, criteria. Remember: **No rubric is neutral. This one explicitly values politically engaged, skillfully realized art aimed at justice.** Own that.
