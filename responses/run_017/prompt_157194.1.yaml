  ### Swap Market Activity: Spectrum Problem in Rational Choice  
  **Goal:** Students experience a preference cycle via incremental trades, revealing tensions between local improvements and global judgments, without triggering "repugnant conclusion" associations. Uses vacation packages (avoiding population ethics) and emphasizes coarse-vs.-fine chains and step reversal.  

  ---

  ### **Activity Setup**  
  **Materials:**  
  - **Cards:** Two rings (coarse and fine chains) describing vacation packages. Each card lists:  
    - **Accommodation quality** (1–5 stars, 1 = basic hostel, 5 = luxury resort).  
    - **Meal quality** (0–10 points, 0 = no food, 10 = gourmet dining).  
    - **Activities** (binary: "none" or "guided tour").  
  - **Tokens:** Sticky notes or chips (1 token = 1 extra credit point or snack pick).  
  - **Room Setup:** Chairs in two circles (coarse/fine groups).  

  **Card Contents (8 Cards per Ring, Same Endpoints):**  
  | **Coarse Chain (Big Steps)** | **Accommodation** | **Meal Quality** | **Activities** |  
  |-----------------------------|-------------------|------------------|---------------|  
  | **A (Start/End)**           | 2★               | 10               | None          |  
  | **B**                       | 4★               | 8                | None          |  
  | **C**                       | 1★               | 9                | Guided Tour   |  
  | **Z (Midpoint)**            | 5★               | 0                | None          |  
  | ...Cycle back to A...         |                  |                  |               |  

  | **Fine Chain (Small Steps)** | **Accommodation** | **Meal Quality** | **Activities** |  
  |-----------------------------|-------------------|------------------|---------------|  
  | **A (Start/End)**           | 2★               | 10               | None          |  
  | **B**                       | 3★               | 9                | None          |  
  | **C**                       | 4★               | 8                | None          |  
  | **D**                       | 2★               | 9                | None          |  
  | **E**                       | 1★               | 9                | Guided Tour   |  
  | **F**                       | 1★               | 7                | Guided Tour   |  
  | **G**                       | 5★               | 3                | None          |  
  | **Z (Midpoint)**            | 5★               | 0                | None          |  
  | ...Cycle back to A...         |                  |                  |               |  

  **Key Design:**  
  - **A vs. Z:** When compared cold, A (2★, 10 meals) is widely preferred to Z (5★, 0 meals).  
  - **Adjacent "Upgrades":** Each step trades a small loss (e.g., –1 meal) for a gain (e.g., +1★ or an activity).  
    - *Example Coarse Step:* A (2★,10 meals) → B (4★,8 meals) – "Better room, slightly worse food."  
    - *Example Fine Step:* A (2★,10 meals) → B (3★,9 meals) – "Tiny room upgrade, tiny food downgrade."  
  - **Cycle Structure:** Z trades back to A via steps that mirror the chain (e.g., Z → G → ... → A).  

  ---

  ### **Timeline (80 Minutes)**  
  **0–5 min: Setup**  
  - Split class: Half do coarse chain (8 students), half do fine (8 students).  
  - Distribute cards randomly. Each student holds one card.  
  - **Rules:**  
    - Only view your card and the next in the chain.  
    - To swap, pay 1 token to facilitator. Swap only if you prefer the next card.  
    - Tokens = extra credit/snack pick (real but small incentive).  

  **5–35 min: Swap Market (30 min)**  
  - Facilitator circulates. Students request swaps by showing their card and the next.  
  - **Script:** "Convince yourself this is an upgrade. If yes, pay a token and swap."  
  - **Critical:** No peeking ahead; no discussion of transitivity.  
  - **Goal:** Students complete the ring, paying tokens to return to their start card.  

  **35–45 min: Reveal & Cold Vote (10 min)**  
  - **Reveal the ring:** Show full chain on board. Point out they paid tokens to end up where they started.  
  - **Cold Vote:** "Raise hand if you’d trade A for Z *directly*." (Expect most to refuse.)  
  - **Record votes:** Coarse vs. fine groups separately.  

  **45–55 min: Step Reversal (10 min)**  
  - **Task:** "Pick *one* swap in your chain to reverse for free. Which one?"  
  - **Reveal:** Students realize *any* reversal feels like a downgrade (e.g., "Why lose my 5★ hotel to get back meals?").  

  **55–80 min: Debrief (25 min)**  

  ---

  ### **Debrief: Mapping Activity to Formal Issues**  
  **1. Map Moments to Concepts:**  
  | **Activity Moment**          | **Formal Issue**                          |  
  |------------------------------|------------------------------------------|  
  | Happy adjacent swaps         | Local judgments are intuitive.           |  
  | Paid tokens to return to A   | Money-pump vulnerability (cycle cost).   |  
  | Refusal to trade A for Z     | Global judgment vs. local steps.         |  
  | Coarse group resisted more   | Step-size sensitivity (shouldn’t matter if transitive). |  
  | No step reversal accepted    | Each pairwise judgment feels robust.     |  

  **2. Escapes & Costs:**  
  | **Escape Route**                     | **What It Solves**                     | **Cost**                                      |  
  |--------------------------------------|----------------------------------------|-----------------------------------------------|  
  | **Deny a pairwise judgment**         | Breaks the cycle.                      | Why did it feel like an upgrade in the moment? (Judgment unreliability). |  
  | **Deny transitivity**                | Allows cycles without irrationality.   | Money pumps become possible (exploitable).    |  
  | **Incomparability / "On a par"**     | Blocks problematic swaps.              | Limits rational choice (can’t always rank options). |  
  | **Tiny losses don’t accumulate**     | Explains coarse/fine difference.       | Contradicts continuity (e.g., $0.01 losses add up). |  
  | **Context-sensitivity**              | Judges differently locally vs. globally. | Undermines objective "better than" relations. |  

  **3. What the Game Can’t Do (Clarify Post-Activity):**  
  - **Judgment vs. Truth:** Shows *your judgments* cycle, not that the *relation itself* is intransitive. You might be bad at judging!  
  - **Money Pump Meaning:** Proves that *acting on these judgments* is costly if cyclical, but doesn’t prove the *preferences* are irrational—only that myopic choice is exploitable.  
  - **Calibration Fallback:** If no reversal occurs, focus on coarse-vs.-fine: "Why did fine-chain students swap more? Should step size matter?"  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Someone spots the ring early.  
    - **Fix:** Emphasize incentives ("Tokens buy snacks!") and peer pressure. If one refuses, say: "Trade only if *you* see an upgrade."  

  - **Problem:** Econ half refuses Z > A vote.  
    - **Calibration Step (Pre-Activity):**  
      - Show A and Z cards: "Who prefers A? Z?" (If >30% prefer Z, adjust Z: e.g., "5★, 0 meals, AND you’re allergic to hotel food").  
      - Use this to force A > Z consensus.  

  - **Problem:** No reversal in step-reversal phase.  
    - **Fallback:** Hypothetical: "Imagine you’re at Z. Would you reverse *any* step if free? Which one?" Highlight that all reversals feel like losses.  

  - **Overrun/Under-16 Fix:**  
    - **25-min for 6 Students:** One chain only (fine). Skip step reversal. Fast-track swaps (5 min). Cold vote → money-pump reveal → 10-min debrief.  

  ---

  ### **Why This Works**  
  - **Avoids Repugnant Conclusion:** Uses personal vacations (not populations). Focuses on step-size sensitivity to differentiate.  
  - **Economist Bite:** Money pumps make intransitivity costly—econ students *feel* the irrationality.  
  - **Philosophy Bite:** Steps feel genuinely better, challenging blanket transitivity.  
  - **Dual Chains:** Coarse vs. fine exposes step-size bias, forcing debate about "should this matter?"  

  **Final Tip:** In debrief, validate both sides. Economists: "Pumps hurt!" Philosophers: "Life’s messy!" Then show how both pay a price.
