  Z: 
    - Accommodation: 5-star
    - Spending money: $0

  Coarse chain (4 steps between A and Z, so 5 cards including A and Z):

  - Card 1 (A): 1-star, $200
  - Card 2: 2-star, $170  [ gain: +1 star, loss: $30 ]
  - Card 3: 3-star, $130  [ gain: +1 star, loss: $40 ]
  - Card 4: 4-star, $80   [ gain: +1 star, loss: $50 ]
  - Card 5 (Z): 5-star, $0    [ gain: +1 star, loss: $80 ]

  In this chain, the losses are increasing, but let's hope that at each step, the star upgrade is worth the money loss.

  Fine chain (8 steps between A and Z, so 9 cards including A and Z). The changes are smaller per step.

  - Card 1 (A): 1-star, $200
  - Card 2: 1.5-star, $190 [ gain: +0.5 star, loss: $10 ]
  - Card 3: 2-star, $180   [ gain: +0.5 star, loss: $10 ]
  - Card 4: 2.5-star, $165 [ gain: +0.5 star, loss: $15 ]
  - Card 5: 3-star, $150   [ gain: +0.5 star, loss: $15 ]
  - Card 6: 3.5-star, $130 [ gain: +0.5 star, loss: $20 ]
  - Card 7: 4-star, $110   [ gain: +0.5 star, loss: $20 ]
  - Card 8: 4.5-star, $85  [ gain: +0.5 star, loss: $25 ]
  - Card 9 (Z): 5-star, $0     [ gain: +0.5 star, loss: $85 ]

  Note: We use half-stars to make more steps.

  Alternatively, we can use integer stars and vary the money in smaller amounts.

  But let's proceed with this.

  The activity:

  0. (Before class) Prepare card printouts for coarse chain (5 cards) and fine chain (9 cards). Since we have 16 students, we can assign 8 to coarse and 8 to fine. In the coarse group, not all will get to swap because there are only 4 upgrades available. So better to have multiple copies of each chain? Or have the students as holders of the cards and allow them to upgrade in sequence.

   But then only one student per chain can upgrade at a time? That might be slow.

   Instead, we can have the students work in pairs for each chain. For the coarse chain, we have 5 cards, so we need 5 students (or pairs) to hold the cards. Similarly, for the fine chain, 9 students (or pairs). But 5+9=14, close to 16. We can have two students left out or have them observe.

   Alternatively, we can have two coarse chains and one fine chain? But then the class is split into three groups.

   Given the time, I propose we have two groups: 
     - Group 1 (coarse): 5 students (or 5 pairs) for the coarse chain.
     - Group 2 (fine): 9 students (or 9 pairs) for the fine chain.

   But 5+9=14, so if we have 16 students, we can have two students form a pair and have 7 pairs in total, but then we need to adjust.

   Alternatively, we can have the activity as a whole class with one chain at a time, but then we can't compare coarse and fine in the same activity.

   Given time, I think it's better to run both chains simultaneously.

   So: 
     - 16 students: split into two groups of 8.
     - In the coarse group, we have a chain of 5 cards. So we need 5 card holders. The other 3 students can be recorders or observers, or we can have two coarse chains if we duplicate the cards.
     - Similarly, in the fine group, we have 9 cards, so 9 card holders. But we only have 8 students in the group. So remove one card? Or adjust.

   We can trim the fine chain to 8 cards (7 steps).

  Revised fine chain (7 steps, 8 cards):

  - Card 1 (A): 1-star, $200
  - Card 2: 1.5-star, $190 
  - Card 3: 2-star, $180   
  - Card 4: 2.5-star, $165 
  - Card 5: 3-star, $150   
  - Card 6: 3.5-star, $130 
  - Card 7: 4-star, $110   
  - Card 8 (Z): 5-star, $0     [ gain: +1 star, loss: $110 ]

  This last step is a bit big, but it's the best we can do.

   Then, coarse group: 5 cards -> 5 students.
   fine group: 8 cards -> 8 students.
   Total: 13 students. The remaining 3 can be facilitators or observers.

   Alternatively, have some students work in pairs.

   Now, the activity procedure:

  1. (5 min) Introduction: 
     - "We are going to do an activity to explore how we make decisions when there are trade-offs. You will be given a card that describes a prize package for a weekend getaway. You will have the opportunity to improve your package by trading it for a better one, at a small cost of one token per trade. Tokens are worth a small incentive (e.g., one token = one extra credit point or first choice of snacks)."

  2. (5 min) Assign groups and distribute cards.
     - Split into two groups: coarse and fine (8 students each).
     - In the coarse group, assign 5 students to be card holders (give them the 5 cards of the coarse chain) and 3 to be observers. In the fine group, assign all 8 to be card holders (8 cards).

     But then the observers might not be engaged. Alternatively, have the coarse group have 5 card holders and the other 3 in the coarse group can be traders who are not initially holding cards? But then they can participate by trading.

     Better: in each group, we have the card holders and then the other students can be the ones who decide if they want to trade. But then it's not clear.

     Given the complexity, I propose to have the students work in pairs within their groups. For the coarse group, 4 pairs (8 students) for 5 cards? That doesn't match.

     We can have the activity with the facilitator as the bank, and each student individually can trade. So:

     - Each student in the coarse group starts with card A (coarse version).
     - Each student in the fine group starts with card A (fine version).

     Then, they can choose to upgrade to the next card in their respective chain by paying one token to the facilitator. The facilitator has a supply of cards.

     They can keep upgrading until they reach Z. This way, each student can go at their own pace.

     This allows for индивидуальный прогресс.

     And we can have many students in each group.

     So for the coarse group, the sequence of cards is predefined: 
          A_coarse -> card2_coarse -> card3_coarse -> card4_coarse -> Z_coarse

     For the fine group: 
          A_fine -> card2_fine -> ... -> card8_fine = Z_fine

     The students can choose to stop at any time.

     This is better.

  3. (25 min) Trading phase:
     - Students start with card A of their chain.
     - They can approach the facilitator (or use a digital method or queue) to upgrade. 
     - The facilitator shows them the next card in their chain (without revealing the whole chain).
     - The student decides whether to pay one token to upgrade.
     - They can keep upgrading until they reach Z or decide to stop.
     - The facilitator records how far each student goes.

     We expect that in the fine group, more students will reach Z because the steps are smaller.

  4. (10 min) After they have all finished or time is called, the facilitator asks those who reached Z if they would like to downgrade back to A for one token. This is the money pump offer.

     We expect that many will say no, because they may think Z is better than A.

  5. (5 min) Collect data: 
     - How many in each group upgraded to each step.
     - How many in each group chose to downgrade from Z back to A.

  6. (10 min) Cold vote: 
     - The facilitator shows the two cards A and Z (without the chain) to the entire class.
     - Ask: "If you had to choose between A and Z, which would you choose? A or Z?" 
     - We expect most to choose A.

  7. (5 min) Then, ask the students who upgraded to Z: "Why did you upgrade to Z if you now think A is better?" 
     - And those who chose not to downgrade: "Why did you choose to stay at Z if you think A is better?"

  8. (5 min) Step reversal phase: 
     - For students who upgraded at least once, pick one step they took (say from card X to card Y) and ask if they would like to reverse that step for free (no token cost). 
     - They should be reluctant because each step was an improvement.

  9. (20 min) Debrief.

  Timeline (80 minutes):
  - 0-5 min: Introduction and group assignment.
  - 5-30 min: Trading phase (25 min).
  - 30-40 min: Money pump offer and data collection (10 min).
  - 40-45 min: Cold vote and initial reaction (5 min).
  - 45-50 min: Step reversal (5 min).
  - 50-70 min: Debrief (20 min).

   Now, the debrief:

   The goal is to map the activity to the formal issues:

   1. Local judgments: At each step, the upgrade seemed like an improvement.
   2. The cycle: In the money pump, some students may have gone from A to Z and then back to A, paying two tokens to end up where they started.
   3. The coarse-vs-fine contrast: In the fine chain, more students likely reached Z because the changes were smaller.

   Then, escapes:

   - Deny one of the pairwise judgments: Maybe one step in the chain was not an improvement.
   - Deny transitivity: Maybe the 'better than' relation is not transitive.
   - Incomparability or parity: Maybe some of the cards are not comparable, or are on a par.
   - Tiny losses don't accumulate: Maybe the small changes don't add up to a big loss.
   - Context-sensitivity: Maybe the judgment depends on the context (what card you currently have).

   For each escape, what it costs:

   - Denying a pairwise judgment: then we need to explain why that step seemed like an improvement at the time.
   - Denying transitivity: then we can have cycles, and money pumps are possible, which might be seen as irrational.
   - Incomparability: then we might not be able to make a choice, but in the activity they did make choices.
   - Tiny losses don't accumulate: but in the aggregate, the loss is large.
   - Context-sensitivity: then the judgment of whether A is better than Z might depend on the path taken.

   What the game can't do:

   - It shows that their judgments cycle, but doesn't settle whether the relation itself is intransitive or they are just bad at judging.
   - The money pump: does it show that the preferences are irrational, or only that acting on them in a piecemeal way is costly? We have to supply that it is often taken as an argument for transitivity to avoid being money pumped.

   Predictable problems and fallbacks:

   - Problem: Someone spots the spectrum early and stops.
     - Fallback: In the instructions, emphasize that they should only consider the immediate next card and not think ahead. Also, the incentive of tokens might make them upgrade even if they suspect a spectrum.

   - Problem: The econ half refuses the bait at the endpoint vote (says they prefer Z to A).
     - Fallback: In the cold vote, if many prefer Z, then we can discuss why. Maybe our card design is flawed. We can then reveal the coarse and fine chains and ask if that changes their mind. Or we can have a discussion about what dimensions matter.

     To calibrate: Before the activity, in the introduction, ask for a show of hands: "If you could either have a 1-star hotel with $200 spending money or a 5-star hotel with $0, which would you choose?" If many choose the 5-star, then we have a problem. So we might need to adjust the card design.

     Revised design for A and Z to make A clearly better for most:

     - A: 1-star hotel, $200 spending money (enough for meals and some activities)
     - Z: 5-star hotel, $0 (you cannot even afford to eat at the hotel restaurant)

     Emphasize that $0 means you have to skip meals or cannot leave the hotel.

   - Problem: The group doesn't reverse at all (everyone is happy at Z).
     - Fallback: Then the activity doesn't show the cycle. We can then focus on the coarse-vs-fine contrast: why did more in the fine group upgrade to Z than in the coarse group? And then discuss if the number of steps should matter.

     Also, we can then present the money pump argument theoretically: if you are at A, and you would pay to upgrade to B, then to C, ... to Z, and then you are at Z, and you would pay to upgrade to A (because you now prefer A), then you are back at A and have paid for the whole cycle. Then you might do it again. So you can be money pumped.

     In the activity, they didn't want to upgrade from Z to A, but if they did, it would be a problem.

   - Calibration step: Before the activity, do the cold vote for A vs Z. If the room is split, then adjust the cards. For example, if many choose Z, then increase the spending money in A or decrease the quality of the 5-star hotel (e.g., "5-star but in a dangerous location").

  25-minute compression for a reading group of six:

   - Skip the group split and do only one chain (e.g., the fine chain) with 6 steps.
   - Each of the six students starts with a card in the chain? Or all start at A and upgrade individually.
   - Time: 
     - 2 min intro.
     - 10 min trading.
     - 3 min money pump offer.
     - 2 min cold vote.
     - 3 min step reversal.
     - 5 min debrief.

   But it's tight. Alternatively, run the activity with one student as a demonstration.

   Given the constraints, we go with the individual upgrade version.

  Let's finalize the card design for the two chains.

  Coarse chain (4 upgrades, 5 cards in sequence for upgrades):

  - Upgrade 1: from A to B
    - A: 1-star, $200
    - B: 2-star, $170
  - Upgrade 2: from B to C
    - B: 2-star, $170
    - C: 3-star, $130
  - Upgrade 3: from C to D
    - C: 3-star, $130
    - D: 4-star, $80
  - Upgrade 4: from D to Z
    - D: 4-star, $80
    - Z: 5-star, $0

  Fine chain (7 upgrades, 8 cards in sequence):

  - Upgrade 1: from A to B
    - A: 1-star, $200
    - B: 1.5-star, $190
  - Upgrade 2: from B to C
    - B: 1.5-star, $190
    - C: 2-star, $180
  - Upgrade 3: from C to D
    - C: 2-star, $180
    - D: 2.5-star, $165
  - Upgrade 4: from D to E
    - D: 2.5-star, $165
    - E: 3-star, $150
  - Upgrade 5: from E to F
    - E: 3-star, $150
    - F: 3.5-star, $130
  - Upgrade 6: from F to G
    - F: 3.5-star, $130
    - G: 4-star, $110
  - Upgrade 7: from G to Z
    - G: 4-star, $110
    - Z: 5-star, $0

  Note: In the fine chain, the last step is from 4-star to 5-star with a loss of $110, which is substantial. We hope that in the context of many small steps, they may take it.

  In the instructions to the facilitator:
  - Do not use the words 'transitivity' or 'cycle' until the debrief.
  - When a student wants to upgrade, show them only the next card, not the whole chain.
  - In the money pump offer to those who reached Z: "Would you like to downgrade to A for one token? You would get the A card and have to pay one token."

  Debrief outline (20 min):

  1. (5 min) Map the activity to the spectrum problem:
     - At each step, the upgrade seemed like an improvement (local judgment).
     - But then, at the end, many think that A is better than Z (global judgment).
     - The coarse-vs-fine: did more students in the fine group reach Z? Why might that be? (because the steps were smaller, so the loss was less noticeable at each step)

  2. (5 min) The money pump: 
     - If you are at A, you might pay to upgrade to B, then to C, ... to Z. Then, if you are at Z and you think A is better, you might pay to downgrade to A. Now you are back at A and have paid tokens for nothing. And you might do it again.
     - This is the money pump argument against intransitive preferences.

  3. (5 min) Escapes from the problem:
     - Option 1: Reject one of the pairwise judgments. But then why did it seem like an improvement at the time? Maybe you made a mistake.
     - Option 2: Reject transitivity. Then cycles are possible, and you are vulnerable to money pumps.
     - Option 3: Some pairs are incomparable or on a par. Then you might not have a reason to upgrade at some step, so you stop.
     - Option 4: Tiny losses don't accumulate. But in the aggregate, they do.
     - Option 5: Context-sensitivity. The value of money might depend on the hotel quality? Then the judgment of the trade-off is path-dependent.

  4. (5 min) What the activity doesn't settle:
     - It shows that our judgments are not transitive, but it doesn't prove that the underlying relation is intransitive. Maybe we are bad at judging.
     - The money pump shows that if you have intransitive preferences and you make decisions step by step, you can lose money. But if you are aware of the cycle, you might avoid it.

   This should provide a rich discussion.
