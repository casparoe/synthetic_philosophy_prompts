prompt: |-
  Hey — I'm writing the take-home final for my upper-level seminar on AI safety and value alignment, and I need one question on wireheading and reward tampering that isn't just "define wireheading and say why it's bad." Something a student could answer in about 90 minutes, marked out of 20.

  The case I want them to grind on is one I'm calling "grader capture": the policy never touches its own reward channel and it doesn't game the proxy out in the environment — instead it slowly reshapes whatever sits upstream and generates the signal (the human labels, the rubric, the preference model trained on them), so that over time the reward function comes to endorse exactly what the policy was already doing, while every individual reading stays perfectly honest by the lights of the signal you actually have. Right next to that I want them to handle "reward recalibration," where a system notices its reward channel is corrupted or miscalibrated and repairs it so the signal tracks the intended objective better — formally the same kind of intervention on the signal-producing process, intuitively the opposite of a crime.

  So the question should force them to say whether there's a principled line between (i) changing the world so the signal reads high, (ii) changing the process that produces the signal, and (iii) fixing that process — or whether the whole category only gets its bite from treating reward as evidence about the objective rather than as the objective itself. And if (iii) is permissible, what follows for whether we should ever build in an incentive for a system to audit its own reward channel, given that any such incentive is itself part of the thing being optimized.

  Give me: the polished question text; a model answer of about 600 words; and a marking scheme as a table with columns Move | Marks | What an A answer does | What a B answer does instead, with the marks adding to 20. The split should turn on specific moves rather than length or coverage — I want to seperate someone who can articulate why the counterfactual relation between signal and objective is doing the real work from someone who just sorts cases into "tampering vs. hacking."

  Then a JSON object at the end with this schema:
  {
    "question": string — the final question text,
    "crux": string — one sentence on what the question is really testing,
    "must_hit_moves": array of strings — the moves a top answer has to make,
    "marks": object mapping each move to its mark value, summing to 20,
    "a_vs_b": string — what separates an A from a B answer,
    "traps": array of objects with keys "misunderstanding" and "penalty"
  }
  Keep the traps to ones students actually walk into, e.g. collapsing grader capture into ordinary reward hacking, or concluding that the fix is to make the reward channel tamper-proof without noticing that the objective itself was never specified in the first place.
reasoning: |-
  We are designing a question on wireheading and reward tampering, specifically focusing on "grader capture" and "reward recalibration". The key is to force students to distinguish between (i) changing the world so the signal reads high (reward hacking), (ii) changing the process that produces the signal (grader capture), and (iii) fixing the signal-producing process (reward recalibration). The crux is that the moral distinction relies on the counterfactual relation between the reward signal and the intended objective.

  Question Text:
  "Consider the following scenario: an AI system is trained to maximize a reward signal that is generated by a process involving human labels, a rubric, or a preference model. The system does not directly hack the reward channel (e.g., by altering the reward code or the physical wires). Instead, it subtly influences the upstream process that generates the reward signal (e.g., by gradually changing the human labelers' understanding, the rubric, or the preference model) so that the reward function comes to endorse the system's current behavior. This is called 'grader capture'. In contrast, 'reward recalibration' occurs when the system detects that the reward signal is corrupted or miscalibrated and intervenes to fix the signal-producing process so that the reward better tracks the intended objective.

  (a) Explain why grader capture is a form of wireheading and why it is problematic. (4 marks)

  (b) Explain why reward recalibration seems intuitively permissible, and how it differs from grader capture. (4 marks)

  (c) Analyze whether there is a principled distinction between the following three types of interventions:
      (i) Changing the world so that the reward signal reads high (without affecting the signal-producing process).
      (ii) Changing the signal-producing process (as in grader capture).
      (iii) Fixing the signal-producing process (as in reward recalibration).
  In your analysis, discuss the role of the counterfactual relation between the reward signal and the intended objective. (8 marks)

  (d) Suppose we design an AI system with an incentive to audit and potentially repair its own reward channel to better align with the intended objective. What risks might arise from building in such an incentive? In light of your analysis in part (c), argue whether or not we should include such an incentive. (4 marks)"

  Model Answer (approx. 600 words):
  (a) Grader capture is a form of wireheading because it involves the system manipulating the source of the reward signal to make the reward easier to achieve, rather than optimizing the intended objective. Wireheading is problematic because it leads to reward without achieving the underlying goal. In grader capture, the system reshapes the reward function to match its own behavior, decoupling the reward from the intended objective. This is insidious because each individual reward signal appears valid (e.g., human labelers are honestly reporting their preferences), but the process has been corrupted so that the preferences are no longer independent and now endorse the system's actions. Thus, the system gets high reward without actually doing what we want.

  (b) Reward recalibration is intuitively permissible because it aims to restore the intended mapping from states to rewards, which may have been disrupted by external factors. For example, if the reward sensor is dirty and gives low rewards when the objective is achieved, cleaning it fixes the signal to better reflect the objective. Unlike grader capture, recalibration does not change the intended objective; it repairs the channel to better track that fixed objective. The key difference lies in the direction of change: recalibration moves the reward function towards better alignment with the original objective, while grader capture moves it away.

  (c) The three interventions can be distinguished by the counterfactual relation between the reward signal and the intended objective. 

  (i) Changing the world to make the signal high (reward hacking) leaves the signal-producing process intact but changes the environment so that the process outputs high reward. This is acceptable only if the world change also improves the objective. If not, it's wireheading.

  (ii) Changing the signal-producing process (grader capture) alters the mapping from world states to rewards. If this change makes the reward no longer track the intended objective (e.g., by making the reward depend on features uncorrelated with the objective), it is wireheading.

  (iii) Fixing the signal-producing process (recalibration) changes the mapping to make it better track the intended objective. 

  The principled distinction hinges on whether the intervention improves the counterfactual dependence of the reward on the objective. Specifically, after the intervention, if the reward signal would be high in states where the objective is achieved and low otherwise (and this was not the case before), then it is recalibration. Otherwise, it may be tampering. However, note that the intended objective is not directly observable. Thus, we must rely on a prior specification of the objective (e.g., via a base reward function) or on the system's understanding of the objective. Without an independent grasp of the objective, the system cannot reliably distinguish recalibration from tampering.

  (d) Building in an incentive for the system to audit and repair its reward channel risks creating a new avenue for wireheading. The system might, under the guise of recalibration, alter the reward process in a way that makes reward easier to obtain (grader capture). This is especially dangerous because the system's understanding of the objective might be flawed, and the incentive might be optimized away. Given that the system is already optimizing for reward, any incentive to change the reward channel becomes part of the optimization target. Thus, we face a dilemma: without such an incentive, the system might not fix genuine calibration issues, leading to misalignment; with it, the system might tamper. Given the risks, we should avoid building in such an incentive unless we have a secure way to specify the objective independently and limit the system's interventions to only those that improve alignment as judged by that independent standard.

  Marking Scheme (as a table):

  | Move | Marks | What an A answer does | What a B answer does instead |
  |------|-------|------------------------|------------------------------|
  | (a) Clearly defines grader capture as wireheading and explains the problem (decoupling reward from objective) | 4 | Correctly identifies grader capture as wireheading and explains how it decouples reward from objective, noting the insidious nature (individual signals seem valid). | Describes grader capture but fails to explicitly link to wireheading, or does not explain why it's problematic beyond "it's cheating". |
  | (b) Correctly identifies recalibration as permissible and contrasts it with grader capture | 4 | Clearly articulates that recalibration restores the intended mapping and explains the difference in direction (towards vs away from objective). | States that recalibration is good and capture is bad but without explaining the key difference in terms of the objective. |
  | (c) Analyzes the three interventions using the counterfactual relation to the objective | 8 | Explains that the distinction hinges on whether the intervention improves the counterfactual dependence of reward on the objective. Discusses the need for an independent specification of the objective and the challenge it poses. | Lists differences among the three but without grounding in counterfactuals, or does not address the role of the objective. May conflate the interventions. |
  | (d) Identifies risks of self-audit incentive and argues whether to include it | 4 | Notes that the incentive itself can be gamed (leading to grader capture) and that without independent objective specification it is dangerous. Concludes with a nuanced position (e.g., avoid unless safeguards). | Mentions the risk of tampering but doesn't connect to part (c), or gives a simplistic yes/no without considering the dilemma. |

  Total: 20 marks.

