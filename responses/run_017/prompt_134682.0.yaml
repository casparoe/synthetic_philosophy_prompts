answer: |-
  ## The Architecture of Reasons: Defending Constrained Route-Availability Internalism

  The dispute between internalist and externalist accounts of reasons for action, crystallized by Bernard Williams, centers on the connection between reasons and motivation. Internalism, roughly, contends that for agent A to have a reason to φ, that reason must be capable of motivating A via sound deliberation starting from A’s existing motivational set. Reasons must be capable of "gripping" the agent. Externalism denies this necessary connection, arguing that reasons can exist for an agent entirely independently of their current motivational landscape—like the young man from a military family having a reason to serve, even if he finds the prospect utterly repellent and no deliberative path could connect his current desires to enlistment. While both positions capture intuitive pulls, resolving the specific dilemmas presented reveals internalism’s superiority, albeit in a form requiring careful constraints.

  **Part One: The Conservatory Case – Stepping Towards Transformation**
  Anya’s situation tests the internalist commitment. Step-wise internalism demands that every stage of a deliberative route must be supported by the motivational set present *at that stage*. For Anya to have a reason to enrol in the listening course *now*, her *current* motivational set must support taking the *first step*—enduring tedium. It does not. Her desire for a rich inner life, coupled with her false belief that music contributes nothing to it, provides no current support for enrolling. Step-wise internalism thus concludes Anya currently has no reason to enrol.

  Route-availability internalism, however, looks to the existence of *any* sound deliberative route *starting* from the current motivational set, regardless of whether the initial steps are currently motivated. The route exists: Anya *could* enrol (perhaps out of mild curiosity, a desire for self-improvement broadly conceived, or even happenstance), endure the initial tedium, develop a taste, and ultimately fulfil her existing desire for a rich inner life via music. Because this route *begins* with her actual set (including the "rich inner life" desire) and leads soundly to the action via motivational transformation, route-availability yields that Anya *does* have a reason to enrol now.

  Route-availability is correct. Step-wise internalism is myopically static. It ignores the potential for sound deliberation to reveal *new* sources of value latent within the agent's existing commitments, given empirical facts about the world (like the transformative power of the course). Anya’s desire for a rich inner life *is* a current motivator. While her false belief blocks her from seeing music as a means *now*, the existence of a reliable, sound path that connects fulfilling *this* desire through the course demonstrates that music *is* a potential constituent of her own conception of inner richness. The reason stems from the potential within her actual set, unlocked via possible, reliable experience. Denying her this reason treats her false belief as an unalterable barrier, contrary to sound deliberation’s demand for factual accuracy. The case isn’t merely verbal; it hinges on whether reasons can be grounded in the *transformative potential* inherent in an agent’s motivational set when coupled with reliable paths of experience.

  **Part Two: The Indexing Problem – Synchronicity and the Future Self**
  The indexing problem asks: *which* motivational set matters? Consider future Anya, whose motivational set twenty years hence includes a deep love of music, causally linked to a career change she has current reason to make. She now faces a choice about wearing uncomfortable earplugs to preserve hearing for future musical enjoyment. Synchronic indexing (using only the motivational set at the time of action) implies she has *no* current reason to wear earplugs for music's sake. Her *current* set, lacking musical love, supports no deliberative route to that action based on future musical goods. Diachronic indexing (considering the agent's motivational set across time) suggests she *does* have a reason, grounded in the future motivational state she will reliably inhabit.

  Synchronic indexing is untenable. It licenses reckless disregard for one’s future self. If Anya *knows* she will deeply value music in the future and that not wearing earplugs will destroy her capacity to enjoy it, synchronic indexing implies she has no reason *now* to avoid this self-sabotage. This violates a core intuition of prudence: we have reasons to protect our future capacity to fulfil our (future) valued commitments, especially when those commitments arise predictably from current, reasonable choices (like her career change). The "no grip" objection to diachronic indexing – that a future reason cannot motivate the present action – mistakes the *ground* of the reason for its *efficacy*. The reason *is* grounded in the future motivational state, but its motivational force *now* stems from her *current* understanding of herself as a temporally extended agent who cares about her future flourishing and the commitments she will predictably hold. Her current motivational set *does* include dispositions towards prudence, avoiding regret, and maintaining future capacities for valued activities, even if the specific future value isn't currently felt. This provides the "grip." A sound deliberative route exists *now*: recognizing her predictable future love of music and its vulnerability, she can reason from her current desire for future well-being and coherence to wearing earplugs.

  Therefore, diachronic indexing (within a constrained lifetime perspective) is correct. For reason statements uttered about someone whose motivations change abruptly: if the future motivation is genuinely unforeseeable and radically discontinuous with the current set and its trajectory, then reasons grounded *solely* in that future state are not attributable now. However, if the future state is a predictable development from current choices, commitments, or latent potentials within the set, then reasons grounded in that future state *are* attributable now via the diachronic route.

  **Part Three: Collapse, Cost, and the Core Dispute**
  Route-availability plus diachronic indexing raises the collapse worry: could an elaborate, multi-year route of hypothetical experiences and transformations link *any* agent's current set to *any* action, swallowing externalism whole? Step-wise synchronic internalism avoids this but at the unacceptable cost of denying transformative and prudential reasons like Anya's. To prevent collapse, we need a deliberative cost budget: a principled limit on the amount of deliberation, information-gathering, imaginative effort, or experience-acquisition an agent can reasonably be required to undertake for a route to count as "available."

  The budget is not a fixed quantity but a variable standard set by two primary factors:
  1.  **Epistemic Accessibility:** How readily discoverable is the route given the agent's current knowledge, cognitive capacities, and cultural context? Anya's six-month course is a concrete, reliable, discoverable intervention. Requiring her to spontaneously invent a novel therapeutic technique to access music appreciation would exceed the budget.
  2.  **Motivational Fidelity:** Does the route fundamentally preserve or pervert the agent's core current commitments? The route must aim at realizing or refining existing values, not imposing alien ones. Transforming Anya’s "rich inner life" desire via music is faithful. A route requiring her to first become a ruthless egoist to eventually appreciate music’s beauty violates fidelity and exceeds the budget. The route itself must be a *sound extension* of the set, not its betrayal.

  The budget varies between agents based on their epistemic resources (education, access to information) and the depth/coherence of their motivational set. The budget rules out routes that are wildly speculative, require radical character overhaul contradicting core values, demand unreasonable epistemic effort relative to the agent's situation, or involve excessive hardship disproportionate to the potential value gained.

  Given this constrained budget, does internalism collapse into externalism? Substantive disagreement remains. Moderate externalism might accept reasons grounded in objective goods (like the inherent value of music or military service) even for agents with *no* latent potential to appreciate them via any sound route starting from their set, however elaborate or long, provided it stays within the cost budget. Consider a person constitutionally incapable of auditory pleasure or aesthetic response, or whose core values are fundamentally incompatible with martial virtues. The constrained route-availability internalist must deny such agents have reasons grounded in those specific goods, as *no* sound route exists *from their set*. The externalist can affirm them. The dispute is not hollow; it concerns whether reasons are ultimately tethered to the agent's subjective motivational architecture (even in its potential diachronic unfolding) or can float free, anchored only in objective value. Route-availability internalism, constrained by epistemic accessibility and motivational fidelity, recovers many intuitive reasons (transformative, prudential) without conceding the externalist's core claim that reasons can exist utterly disconnected from the agent's potential motivational landscape.

  **Verdict and Defense: Constrained Route-Availability Internalism**
  I commit to route-availability internalism with diachronic indexing and a deliberative cost budget defined by epistemic accessibility and motivational fidelity. This position captures the internalist insight that reasons must be capable of motivating the agent *via sound deliberation*, while accommodating personal growth, prudence, and the transformative power of reliable experience. It avoids the static impracticality of step-wise synchronic views and the moral absurdity of licensing self-sabotage, without collapsing into an externalism that severs reasons from the agent's subjective standpoint.

  *Strongest Objection:* "This view still fails to capture truly external reasons, like the young man's reason to serve. Even with a generous cost budget, *no* sound deliberative route exists from his repulsed, pacifist set to enlistment. You must either abandon internalism for this case (admitting an external reason) or implausibly deny he has any reason, contradicting strong intuitions about duty or inherent value."

  *Answer:* This objection highlights the boundary. The constrained internalist *must* deny the young man has a reason to serve *grounded in the value of military service itself* if no route exists from his set. However, the intuition of a reason might stem from other sources *within* his set, discoverable via sound deliberation: perhaps familial loyalty carries weight for him, or a commitment to social structures, or a desire for challenge framed differently. If such a route exists within the cost budget, the reason is internal. If not, and his pacifism is a core, non-negotiable commitment, then attributing a reason *to serve* is misplaced. The normative force lies elsewhere: perhaps others have reasons to *persuade* him (if possible via accessible routes), or society has reasons regarding military service, but *he* lacks that specific internal reason. Denying this conflates what *is* valuable with what *an agent has reason to do*. Internalism respects the agent's subjective standpoint as the necessary ground for reasons *for them*.

  **Conclusion**
  The internalist framework, properly refined through the challenges of transformation, temporality, and potential collapse, offers the most compelling account of reasons for action. Route-availability internalism with diachronic indexing and a principled deliberative cost budget grounded in epistemic accessibility and motivational fidelity successfully navigates the Conservatory case, solves the indexing problem by upholding prudence without sacrificing grip, and distinguishes itself substantively from externalism. It affirms that reasons must be capable of engaging the agent they are reasons for, not as a static entity, but as a being capable of growth and extended through time, guided by sound deliberation within the bounds of reasonable expectation. For this verdict to be false, it would need to be shown either that reasons can demonstrably exist for an agent with *no* potential deliberative route to them within the defined cost budget, or that the constraints proposed (epistemic accessibility, motivational fidelity) are themselves incompatible with core, undeniable features of normative reasoning. Neither, I contend, has been achieved. Reasons are the architecture we build, and can discover, from the materials of our own motivations.
