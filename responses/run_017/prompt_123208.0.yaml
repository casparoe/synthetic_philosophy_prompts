  First, I need to figure out what exactly they're asking for. They want to know if there's an established term for this phenomenon in philosophical literature. But more importantly, they need a clear definition—boundaries, what it is and isn't, and how it relates to debates about genuine moral dilemmas. They also mention specific instances: driving one friend over another, a novel where a character breaks a promise to someone who never finds out, and the importance of the passed-over person's awareness and the method of choice (coin flip vs. deliberate decision).

  I recall Bernard Williams' concept of "moral remainder" from his works like "Ethical Consistency" and "Moral Luck." That seems to fit. Williams discusses residual obligations that linger after a conflict of duties. For example, in Agamemnon's dilemma, choosing to sacrifice his daughter leaves a remainder. The user's examples align with this—apologizing to the friend not driven, or the novel character trying to make amends posthumously. 

  But I should check if there are other terms. "Agent-regret" is another Williams term, but it's broader and not always directed. Here, the leftover is specifically owed to the person affected. So moral remainder is more precise. Also, "pro tanto duties" might come up, but that refers to duties that can be overridden, not the leftover feeling itself.

  Next, boundaries. The user is concerned about cases where the person doesn't know about the choice (like the novel example). Williams' remainder still applies because it's about the agent's moral landscape, not the recipient's awareness. However, awareness might affect how the remainder is discharged. If the person doesn't know, making amends might be symbolic, but the obligation persists. 

  The coin flip scenario is interesting. If the choice isn't deliberate, the agent might not feel the same residue because they didn't actively prioritize one claim over another. That suggests that the remainder arises from the agent's recognition of the overridden duty. 

  The user also mentions the leftover behaves like a debt—it can be discharged by future actions, and its intensity varies with the difficulty of the choice. Williams notes that remainders might require reparative actions, supporting the debt-like quality. The variation in intensity aligns with the "moral cost" idea; harder decisions leave a heavier residue.

  Now, connecting this to genuine moral dilemmas. Proponents argue remainders prove that the overridden duty still had moral force, implying wrongdoing regardless. Critics might say the feeling is just psychological, not a true moral residue. The user needs to know if their observations support the existence of dilemmas. Since the remainder feels obligatory and reason-giving, it leans towards supporting dilemmas, but it's contested.

  I should also differentiate moral remainder from guilt, regret, etc. Guilt implies wrongdoing, which the user denies. Regret can be bystander-like, but remainder is agent-specific and directed. The need to apologize even when justified shows it's not mere sadness.

  The user's examples are strong, especially the novel scenario where the promisee is dead. That challenges the idea that awareness is necessary. The coin flip case helps distinguish deliberate choice from randomness. 

  Finally, coining a term isn't necessary since "moral remainder" exists, but if they need alternatives, "directed moral residue" or "overridden duty residue" could work. However, sticking to established terms is better for academic credibility. 

  In conclusion, moral remainder fits the pattern. The boundaries: it arises from deliberate choices overriding pro tanto duties, is directed, reason-giving, dischargeable, and persists regardless of the recipient's awareness. It supports the existence of genuine dilemmas if interpreted as evidence of inescapable moral failure, though critics may disagree.
answer: |-
  This pattern you've identified is both profound and precisely observed. It **does** have an established name in philosophical ethics: **Moral Remainder** (or sometimes **Moral Residue**). The concept is most prominently associated with the work of **Bernard Williams** (especially in essays like "Ethical Consistency" and "Moral Luck") and developed by others like **Ruth Marcus** and **Christopher Gowans** in debates about moral dilemmas.

  Here's the carving you need:

  1.  **What Moral Remainder Is:**
      *   **The Core:** It is the persistent, directed, normative "leftover" feeling or obligation that survives a *justified* choice to override one genuine moral claim (a *pro tanto* duty) in favor of another, more pressing or weighty one.
      *   **Directedness:** It is specifically *owed to* the individual(s) whose claim was overridden. It's not just a diffuse feeling; it's about *them*.
      *   **Normative Force:** It feels like a *reason for action* (e.g., apology, explanation, future priority, reparation) and not merely a feeling of sadness or disappointment. It generates an obligation *towards* that person.
      *   **Dischargeability:** Actions directed *at* the person whose claim was overridden (apology, making amends, future priority) can genuinely "settle" or diminish the remainder, like paying a debt. This distinguishes it from persistent regret or trauma.
      *   **Source:** It arises because the overridden claim *was genuine and morally significant*, even though overriding it was the right thing to do overall. The moral landscape isn't wiped clean by the justification; the "cost" of the decision leaves a trace obligation.
      *   **Intensity:** The weight of the remainder often correlates with the *moral cost* of the decision – how strong the overridden claim was and how close the choice was. A clear, easy choice leaves a smaller residue than a agonizing one between near-equal claims.
      *   **Independence from Knowledge:** Crucially, as you noted in the novel example, the remainder *can* exist even if the person whose claim was overridden is *unaware* of the choice or the overridden claim. The obligation arises from *your* recognition of the claim they *had*, not their awareness of its violation. (This is a key differentiator).

  2.  **What Moral Remainder Is NOT (Boundary Cases & Distinctions):**
      *   **NOT Ordinary Regret:** Regret is sadness or disappointment about an outcome or situation. It can be bystander regret ("I wish that hadn't happened") and isn't necessarily *directed* at a specific person you owe something *to*. Regret doesn't demand specific reparative actions *towards* the affected party and isn't discharged by them. You can regret a necessary amputation; you don't owe the leg an apology.
      *   **NOT Guilt (in the standard sense):** Guilt implies you believe you did something *wrong*, violating a moral norm. Moral Remainder persists precisely when you are *confident you did the right thing overall*. You feel an obligation *despite* justification, not because of wrongdoing.
      *   **NOT Mere Sadness or Disappointment:** These are feelings *about* the situation or consequences. Moral Remainder is an *obligation felt towards a specific person*.
      *   **NOT the General Unpleasantness of Choice:** The stress or burden of *having* to choose is different. That burden lifts once the choice is made. Moral Remainder *begins* after the justified choice is made and lingers.
      *   **NOT Necessarily About "Harm":** The person passed over might not be *harmed* in a tangible way (e.g., your friend missed an event but wasn't physically hurt). The remainder arises from the *overriding of their legitimate claim* on you (promise, need, relationship), not necessarily from measurable damage. The claim itself was the locus of value, even if unfulfilled.
      *   **NOT Dependent on Recipient Awareness (Boundary Confirmed):** Your novel example is spot-on. If the promisee never knew and is dead, the character's feeling isn't *for show* or about reputation. It's a persistent obligation *to that person*, surviving their ignorance and death. The remainder exists in the moral relationship *as understood by the agent*. (Imagine keeping a deathbed promise secret: the obligation to keep it persists even if no one else ever knows you made it; similarly, the obligation *from* overriding it persists).
      *   **NOT Present in Non-Deliberate Outcomes (Boundary Confirmed):** Had the choice been made by coin flip or car failure, the "leftover" would likely be different. It might be regret ("unfortunate how it worked out") or sadness for the friend, but it likely wouldn't carry the same *directed, debt-like* sense of obligation *owed specifically by you to her* for having *chosen* against her claim. The moral remainder arises *because you actively judged and overrode* a genuine claim. The coin flip absolves you of that specific active judgment against her claim. (Test Case: If you *intended* to flip a coin fairly, but then felt a pang needing to apologize anyway, *that* pang might be a small remainder related to placing her fate outside your direct moral consideration).

  3.  **The Connection to Genuine Moral Dilemmas:**
      *   **Proponents of Genuine Dilemmas:** They argue Moral Remainder is *evidence* that the overridden claim retains genuine moral force *even after* being justifiably overridden. The persistence of the directed obligation shows that the agent *did* fail to fulfill a real duty *to that person*, even if they fulfilled a greater or more pressing one. They "wronged" the person passed over *in that specific dimension*, even while acting rightly overall. The remainder *is* the marker of that inescapable moral failure. (Williams' view leans this way).
      *   **Opponents of Genuine Dilemmas (e.g., some Utilitarians, Kantians):** They offer two main rebuttals:
          1.  **Psychological Explanation:** The feeling is merely a psychological residue – regret, identification with the disappointed party, or evolutionary altruism instincts – mistakenly interpreted as a moral obligation. It has no *true* normative force; it's just a feeling to manage.
          2.  **Second-Best Explanation:** The feeling arises because the *best possible* action wasn't available. We regret the sub-optimal world where we couldn't satisfy both claims, and the feeling is linked to the *person* affected by that sub-optimality, but it doesn't mean we failed a *duty* *to them*. The only duty was to choose the best available option, which we did. Any further obligation is illusory or purely supererogatory (beyond duty).
      *   **Your Pattern's Significance:** Your observations – particularly the *directedness, normative force, dischargeability, independence from awareness, and dependence on deliberate choice* – strongly challenge the "mere psychology" explanation. It *feels* and *behaves* like a real moral obligation. This lends significant weight to the pro-dilemma position. However, opponents can still fall back on the "second-best" explanation, denying that the overridden claim constituted a *duty* that was *violated* rather than simply a *value* that was *outweighed*.

  **In Summary:**

  *   **Name:** Moral Remainder (or Moral Residue).
  *   **Definition:** The persistent, directed, normative obligation felt *towards* a specific individual(s) whose genuine moral claim (*pro tanto* duty) was justifiably overridden in a conflict, arising from the recognition of that claim's validity and moral cost of overriding it, and capable of being discharged through reparative actions directed at that individual.
  *   **Key Boundaries:**
      *   Survives justification and lack of wrongdoing belief.
      *   Directed at the claimant, independent of their awareness.
      *   Generates reasons for action (apology, amends, future priority).
      *   Dischargeable through actions directed at the claimant.
      *   Intensity linked to the moral cost/strength of overridden claim.
      *   Requires a *deliberate choice* to override the claim.
      *   NOT guilt, regret, sadness, or choice burden.
  *   **Relation to Dilemmas:** The existence and nature of Moral Remainder is a powerful argument *for* the reality of genuine moral dilemmas, as it suggests an inescapable moral failure (failing the overridden duty) even when acting rightly overall. Opponents explain it away as psychology or regret over sub-optimal outcomes, but your careful observations make their explanations less convincing.

  **For Your Teacher:** Frame your discovery of this pattern as recognizing the phenomenon of Moral Remainder as articulated by Bernard Williams. Emphasize how your examples (especially the unaware promisee and the coin-flip contrast) directly engage with key features Williams highlights (directedness, persistence despite justification) and strengthen the case for genuine dilemmas by demonstrating the residue's normative, almost debt-like character that transcends the recipient's knowledge. Be prepared to discuss the opponent's ("no dilemmas") counter-arguments and why you find the Moral Remainder explanation more compelling based on the phenomenology you described.
