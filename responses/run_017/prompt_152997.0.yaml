prompt: |-
  I work in the appraisal unit of a national transport authority. Every year we allocate a fixed safety budget across candidate projects — junction redesigns, median barriers, bridge retrofits, level-crossing upgrades — by monetising each project's expected reduction in fatality risk using a single official figure, expressed in currency, for what is called the value of a statistical life. That figure comes from studies of how much extra pay workers in hazardous occupations have to be offered to accept additional risk of death on the job. We convert each project's expected lives saved into money at that rate, rank the projects by net monetised benefit, and fund them in that order until the budget is spent.

  Three features of this procedure strike me as pulling in different directions, and I can't tell whether they are in tension or whether I am missing the view that reconciles them.

  First, we use one number for everyone, even though the underlying studies report quite different trade-offs depending on whose behaviour you look at and in what occupation, and even though the individual circumstances of the people protected by any given project vary enormously. When I asked why we discard that variation, I was told that a single uniform number is what keeps the procedure non-judgmental: we are deferring to the trade-offs people actually make rather than substituting our own views about whose life matters more. But discarding the variation looks to me like the opposite of deference.

  Second, we refuse to count what people say. The authority also runs consultations in which residents are asked how much they would pay for safer junctions near them, and those answers are excluded from the ranking on the ground that hypothetical questions are not real choices. Yet the wage evidence we do rely on is also, in the end, a money-for-risk trade-off, inferred rather than requested; and the people whose risk we are reducing were never asked anything at all.

  Third, the procedure is justified entirely by deferring to each individual's own trade-offs, and then simply adds the resulting sums across different individuals — including, in the nature of the case, people who will never enjoy the benefit attributed to them.

  A consultant has now proposed that we stop averaging: infer each person's own valuation of risk from their actual behaviour — occupational choice, seatbelt use, smoking, and similar — and weight safety spending accordingly, so that those who live as though they set less store by their own lives receive less protection.

  What I want from you is a reconstruction of the implicit theory. What view of utility, or of what it is we are putting a number on, would make this procedure coherent? Which parts of it strictly require that view, and which are merely habits that would survive under rival views? Which rival views does the procedure quietly rule out? Is it internally consistent — in particular, in treating market behaviour as evidence while treating stated willingness to pay as none? Does the consultant's proposal follow from the same view, or does it rest on a misunderstanding of what a choice can reveal? And if we replaced the presupposed view with one on which what matters is how well lives actually go, what exactly would have to change in how projects are ranked, and would the resulting rankings differ much in practice?
reasoning: |-
  Okay, the user works in the appraisal unit of a national transport authority and is grappling with some philosophical and methodological tensions in their safety budget allocation process. They use a single Value of Statistical Life (VSL) figure derived from wage-risk trade-offs in hazardous occupations to monetize the expected reduction in fatality risk across various projects. They've raised three main concerns: the use of a uniform VSL despite variations in individual valuations, the exclusion of stated preferences from public consultations while relying on revealed preferences from labor markets, and the aggregation of individual trade-offs into collective decisions that affect people who weren't consulted.

  The user questions whether their current approach is coherent and internally consistent. They also mention a consultant's proposal to personalize VSL based on individual behaviors like occupational choices or seatbelt use. They're essentially asking for a deep dive into the implicit theoretical foundations of their methodology and how alternative approaches might change their practice.

  Hmm, this is a sophisticated multi-layered question that touches on welfare economics, decision theory, and ethics in public policy. The user clearly has technical expertise but is wrestling with normative questions beneath the surface of their technical work. I should unpack the underlying philosophical commitments methodically.

  First, the current approach is firmly rooted in the revealed preference tradition of welfare economics. It treats observed market behaviors (like wage-risk trade-offs) as the only valid source for inferring valuations because they involve real trade-offs with real consequences. This explains why hypothetical survey responses are excluded - they're seen as lacking the discipline of actual choices. The commitment to a single uniform VSL stems from a specific interpretation of Kaldor-Hicks efficiency and a desire to avoid paternalistic value judgments about whose life is more valuable.

  But there are tensions here. When they discard variation in wage-risk studies by averaging, they're actually imposing uniformity rather than deferring to differences. And the justification about avoiding judgments is somewhat undermined by the aggregation process itself, which implicitly assumes comparability of welfare across individuals - a substantive ethical position. The exclusion of future beneficiaries who weren't part of the original wage-risk studies is another inconsistency.

  The consultant's personalized VSL proposal actually takes the revealed preference logic further - perhaps too far. While consistent with the idea that valuations should be individual-specific, it misunderstands what market choices reveal. People's risk-related behaviors are influenced by constraints, information gaps, and self-control problems, not just pure valuation. Applying this mechanically could lead to perverse outcomes where disadvantaged groups get less protection.

  If we shifted to a capability approach focused on how well lives actually go, we'd need several changes: incorporating non-fatal benefits more systematically, adjusting for differential vulnerability, and possibly using equity weights. In practice, this might significantly re-rank projects affecting vulnerable populations like pedestrians in low-income areas versus car occupants on highways.

  The practical differences might be substantial for projects where risk reduction recipients differ systematically from the workers in the original wage-risk studies. But for many infrastructure projects affecting broad populations, the rankings might not shift dramatically. The bigger change would be conceptual - moving from a preference-satisfaction model to an objective well-being framework.

  I should structure this as a coherent reconstruction of the implicit theory first, then examine each tension point, then evaluate alternatives. The user will need clear distinctions between what's fundamental to the approach versus what's merely customary, and concrete illustrations of how alternative frameworks would change their rankings.
answer: |-
  Here's a reconstruction of the implicit theory underlying your procedure, its tensions, and the implications of alternative views:

  **The Implicit Theory: Revealed Preference Utilitarianism (with Kaldor-Hicks Efficiency & Welfarism)**

  1.  **Fundamental Value:** Individual welfare (utility), defined as the satisfaction of individual preferences.
  2.  **Epistemology:** Preferences are *only* knowable through **revealed choices** in **real markets with real consequences**. Actual sacrifices (money, time, risk acceptance) reveal true valuations. Hypothetical statements ("stated preferences") are unreliable guides to actual behavior under constraint.
  3.  **VSL as Preference Revelation:** The VSL figure is an *aggregate measure* of the marginal rate of substitution (MRS) between money and mortality risk, revealed by workers accepting higher pay for higher risk (or consumers buying safety features). It represents the *average* amount individuals in the relevant population *demonstrably* require to accept a marginal increase in risk.
  4.  **Uniform VSL Justification (Non-Paternalism & Kaldor-Hicks):**
      *   **Non-Paternalism:** Using individual-specific valuations based on choices deemed "imprudent" (e.g., smoking, risky jobs without full comp. wage?) would impose the appraiser's judgment on what constitutes a "rational" valuation, violating respect for individual autonomy/preferences.
      *   **Kaldor-Hicks Efficiency:** A project is efficient if the monetary value of its benefits (calculated using the *average* MRS) exceeds its costs, *and* in theory, the gainers *could* compensate the losers (though compensation isn't required). This relies on monetary valuation using a single shadow price (the uniform VSL). Using different VSLs for different people would make this potential compensation test incoherent.
      *   **Practicality & Fairness (Procedural):** A single number avoids contentious debates about whose life is "worth more." It provides an objective(ish), transparent rule derived from actual behavior, not official decree.
  5.  **Aggregation (Simple Utilitarianism):** Welfare gains are additive. Saving one life (preventing the loss of one person's *entire* future utility stream) is valued at the VSL *for each life saved*, regardless of who that person is or whether they "deserve" it based on past choices. The benefit is the aggregate risk reduction *monetized using the average MRS*.
  6.  **Exclusion of Stated Preferences:** This is core to the epistemology. Market wage data involves real trade-offs with real money and real risk consequences. Survey responses involve hypothetical money and hypothetical risk changes without real stakes or budget constraints, making them unreliable ("cheap talk"). They don't reveal *actual* willingness to pay/sacrifice.

  **Tensions Examined:**

  1.  **Uniform VSL vs. Deference to Variation:**
      *   **Requires:** The Kaldor-Hicks justification and the non-paternalistic objection to using individual-specific valuations derived from behaviors deemed "low value." *Strictly requires* the view that averaging *is* the non-judgmental way to defer to *society's aggregate* revealed preferences.
      *   **Habit/Survivable:** The *concept* of using revealed preferences could survive using segmented averages (e.g., by income group, region) *if* the non-paternalism/Kaldor-Hicks objections were overruled. However, the core procedure relies fundamentally on a *single* shadow price for efficiency calculations.
      *   **Tension:** Averaging discards individual variation revealed in the *source data*. The procedure defers to the *existence* of revealed preference, but imposes uniformity in its *application*. It's deferential at the data collection stage but judgmental at the application stage.

  2.  **Revealed (Market) vs. Stated (Survey) Preferences:**
      *   **Requires:** The epistemological commitment that *only* real choices with real consequences reveal true preferences. This is fundamental to the implicit theory.
      *   **Ruled Out:** Theories that grant validity to deliberative processes, expressed needs, or hypothetical constructs (e.g., capability approach, some democratic theory, some behavioral welfare economics acknowledging cognitive biases affecting market choices).
      *   **Internal Consistency?** Yes, strictly within its own framework. Market behavior involves real resource trade-offs under constraint. Surveys do not. The people protected weren't asked, but the VSL is derived from *others* making *analogous* trade-offs (money vs. risk) in real contexts, deemed the best available proxy.

  3.  **Individual Trade-offs & Aggregation:**
      *   **Requires:** A welfarist view where the good is preference satisfaction, and utilitarianism (or potential Pareto efficiency) for aggregation. The benefit is the *aggregate monetized risk reduction*, not necessarily the utility gained by specific individuals.
      *   **Tension:** Including people "who never enjoy the benefit" (e.g., future users not in the labor market studies) is justified by the *ex ante* perspective: from the planning stage, *any* user faces a reduced risk. The VSL is the value placed on reducing that probabilistic risk by *anyone* facing similar risks, revealed by current analogous individuals. It's not about compensating specific victims.

  **The Consultant's Proposal: Misapplied Revelation?**

  *   **Logic Under Same View?** Superficially, yes – it pushes revealed preference to the individual level. It claims to be *more* deferential by using individual-specific behavior.
  *   **Misunderstanding Revelation:** The consultant fundamentally misunderstands what choices reveal:
      *   **Constraints:** Occupational choices are heavily influenced by skills, education, location, discrimination, and economic necessity. A risky job choice may reveal desperation, not a low VSL.
      *   **Information:** People may lack accurate risk perceptions (e.g., smoking risks historically).
      *   **Self-Control/Time Inconsistency:** Smoking or not wearing a seatbelt may reflect hyperbolic discounting or impulse control issues, not a stable, considered low valuation of life.
      *   **Context Dependence:** Valuation of risk is highly context-dependent. Accepting job risk ≠ valuing road safety risk identically. Accepting personal risk ≠ valuing societal risk reduction identically.
      *   **Externalities:** My risky behavior (smoking, no seatbelt) imposes costs on others (healthcare, grief), making my private valuation socially incomplete.
  *   **Consequence:** This proposal abandons non-paternalism. It *judges* that certain revealed choices (deemed "irresponsible") *do* validly reveal a low VSL, while others (like wage studies) are privileged. It would systematically disadvantage the poor, less educated, and those facing systemic constraints, violating horizontal equity and likely reducing overall welfare.

  **Shifting the View: What if "How Well Lives Actually Go" Matters?**

  Suppose we adopt an **Objective List or Capability Approach** (e.g., Sen, Nussbaum): What matters is enabling people to achieve certain functionings (being safe, healthy, mobile, etc.) and have genuinely flourishing lives.

  *   **What Would Change in Ranking:**
      1.  **Beyond Fatality:** Non-fatal injuries, health impacts (e.g., pollution reduction from traffic calming), accessibility, quality of life, and equity would need explicit, significant weighting alongside fatality risk reduction. Monetization might be insufficient or require fundamental rethinking.
      2.  **Differential Vulnerability:** Projects benefiting vulnerable groups (children, elderly, disabled, disadvantaged communities) who face higher baseline risks or have fewer resources to mitigate risk could receive higher priority. A uniform VSL applied to equal risk reduction would not capture this.
      3.  **Equity Weights:** Explicit weights might be applied to benefits accruing to disadvantaged groups, reflecting a societal judgment that improving their lives matters more at the margin.
      4.  **Beyond Revealed Preference:** Stated preferences/community input might be valued as expressions of need or experienced risk, especially where market data is lacking or biased. Deliberative methods could be used.
      5.  **Contextual Evaluation:** The impact on overall community well-being, social cohesion, and access to opportunities would factor in, not just isolated risk reduction.
      6.  **Rejection of Individual VSL from "Risky Behavior":** Smoking status wouldn't determine your worth for a safe sidewalk. Focus would be on enabling *capabilities* regardless of past choices constrained by circumstance.

  *   **Would Rankings Differ in Practice?**
      *   **Significantly for Some Projects:** Projects primarily benefiting vulnerable road users (pedestrians, cyclists in low-income areas), improving non-fatal safety (e.g., safer routes to school), or in disadvantaged communities would likely rank much higher. Projects like median barriers on high-speed highways (benefitting mainly car occupants, often wealthier) might rank relatively lower unless they demonstrably protected others or reduced severe inequities.
      *   **Modestly for Others:** Projects with very high benefit-cost ratios using the old method might still rank high. Projects where benefits are diffuse and accrue broadly might see less change.
      *   **Magnitude:** The *extent* of re-ranking depends on the specific weight given to equity, non-fatalities, and community well-being relative to monetized fatality risk reduction. The practical difference could be substantial, especially in budgets prioritizing social justice or areas with high inequality/vulnerability.

  **Conclusion:**

  Your procedure rests on a specific, internally consistent (though contestable) foundation: revealed preference utilitarianism operationalized via Kaldor-Hicks efficiency using a uniform VSL derived from labor market behavior. Its coherence depends on accepting its core tenets: only real choices reveal preferences, averaging is necessary/non-paternalistic for efficiency, and aggregation via monetization is valid.

  The tensions you identify are real:
  *   Averaging *is* a judgment overriding individual variation.
  *   Excluding surveys *is* an epistemological choice favoring one type of data.
  *   Protecting the unconsulted *is* justified by *ex ante* risk reduction valued by proxies.

  The consultant's proposal misapplies revealed preference logic by ignoring context and constraints, leading to ethically problematic outcomes.

  Shifting to a view prioritizing "how well lives go" would fundamentally alter the appraisal:
  1.  **Require:** Explicit incorporation of equity, non-fatal outcomes, vulnerability, and broader well-being.
  2.  **Change:** Prioritization of projects benefiting vulnerable populations and improving quality of life beyond simple risk reduction.
  3.  **Differ:** Rankings would likely shift significantly towards projects fostering equitable safety and community well-being, particularly in disadvantaged areas. The practical impact would be most pronounced where current methods overlook systemic vulnerabilities or non-fatal harms.
