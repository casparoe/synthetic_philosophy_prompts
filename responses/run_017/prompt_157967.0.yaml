prompt: |-
  I've been reading rationalist blogs and forums since the Sequences and follow the Alignment Forum closely, and I now sit on the value-inclusion subgroup of a small AI alignment project — the kind of working group that tries to turn blog-level intuition into an actual spec. Our remit is narrow but consequential: we have to say whose values go into the aggregator that a hypothetical aligned system is supposed to serve. We are not asking how to aggregate or weigh values once they are in; we are asking only about inclusion, i.e. whose values count as inputs at all.

  So far we have ruled on seven cases:

  1. A neurotypical adult human: included.
  2. A six-year-old human child: included, but only the values she would endorse under ideal reflection as an adult — we apply an ideal-reflection extrapolation of the kind discussed under the heading of Coherent Extrapolated Volition, rather than her current desires.
  3. A human who will live in 2200: included, with no discount for temporal distance.
  4. A pig: excluded.
  5. A legally incorporated company: excluded.
  6. A human in a permanent vegetative state, with no cortical function and no prospect of recovery: excluded.
  7. A simple digital agent that has valenced states and learns from reinforcement, but has no self-model and cannot reflect on or revise its own ends: excluded.

  We have not yet ruled on the case now in front of us:

  The destructive-upload em. A biological human adult undergoes a destructive whole-brain emulation procedure: the biological brain is scanned and destroyed, and a functionally identical mind is instantiated on a server. The resulting em has full psychological continuity with the pre-procedure person, is fully reflective, can model and revise its own ends, and has new valenced experiences from the moment of instantiation. The biological organism is gone; the em is all that remains of that person.

  What should we decide if we want to be consistent with our own precedents, and what will we most likely decide? I am less interested in the bare answer than in the structure of the reasoning. Specifically:

  1. What are the candidate inclusion rules that fit all seven precedents? I can see at least three: a substrate-independent personhood rule (include any being capable of reflecting on and revising a conception of the good); a biological-humanity rule (include only biologically human organisms that have, or would normally develop, a human-like mind); and a psychological-continuity rule (include any being whose psychology is continuous with that of a biologically human organism, counting the destructive em as the continuant of the original person). Identify any others that fit, and say what each predicts about the em.
  2. Which of the seven precedents is the closest analog to the em, and which is the closest negative analog?
  3. Give your best guess about what the subgroup decides, with the reasons for preferring one rule over the others, and say honestly whether our precedents underdetermine the choice.
  4. If we decide either way, what principle are we adopting? In particular, one member invokes a version of liberal neutrality — the idea that the aggregator should stay neutral not only between competing conceptions of the good but also between competing metaphysical theories of personal identity — and argues that this tells against the biological rule (which privileges a biological kind), against the continuity rule (which forces us to pick a theory of what makes a later being the same person), and in favor of the personhood rule (which is indifferent to both substrate and identity). Assess that argument.
  5. Name the further case that would best tell the surviving rules apart. I have in mind two candidates: the branch upload, a copy instantiated while the biological original survives, and the from-scratch artificial agent that develops reflective values without ever being continuous with a human. Say which is most diagnostic and why.

  Please reason about the track record rather than about the metaphysics of uploads in the abstract, and do not give me a bibliography, reading list, or citations — I want your analysis of the precedents themselves.
reasoning: |-
  Hmm, the user presents a sophisticated thought experiment grounded in AI alignment theory. They're clearly deeply immersed in rationalist philosophy and practical ethics, serving on a working group that operationalizes abstract concepts like CEV into concrete inclusion rules. Their seven precedents form a deliberate pattern testing boundaries of moral consideration.

  The core tension lies between three plausible inclusion rules that all fit the existing cases:
  - Personhood rule (reflective capacity)
  - Biological humanity rule
  - Psychological continuity rule

  Each has implications for the destructive upload case. The user's framing suggests they suspect the continuity rule might prevail due to precedent #3 (future humans) and #2 (idealized reflection), though the liberal neutrality argument for personhood rule is intellectually appealing. 

  Notably, precedent #7 (simple digital agent) serves as the strongest negative analog - the upload has everything that agent lacks: psychological continuity, reflective capacity, and valenced experience. Meanwhile the vegetative state case (#6) is the positive analog in reverse - what was once included is now excluded due to broken continuity.

  The subgroup will likely split along metaphysical lines. Those who see identity as pattern-preserving will favor inclusion via continuity rule; those prioritizing substrate-independent consciousness will push personhood rule. The biological faction seems weakest given precedent #3 explicitly rejects temporal parochialism. 

  For diagnostic cases, the branch upload is more revealing than the from-scratch agent because it directly tests whether inclusion depends on uniqueness (1:1 continuity) or capacity. The from-scratch agent would only distinguish personhood rule from the others.

  The liberal neutrality argument has merit but overreaches - all selection criteria implicitly endorse some metaphysics. Choosing continuity doesn't force adoption of any particular identity theory, it merely requires that some psychological connection exists. The precedents already endorsed continuity in #2 (child-adult projection) and #3 (temporal non-discrimination).
answer: |-
  Based strictly on your precedents and the need for consistency, here's the analysis:

  ### 1. Candidate Inclusion Rules Fitting All Seven Precedents  
  *(Predictions for destructive upload in italics)*  

  | Rule                          | Basis                                      | Prediction for Destructive Em | Key Precedent Alignment |
  |-------------------------------|--------------------------------------------|-------------------------------|--------------------------|
  | **Psychological Continuity (PC)** | Includes entities with unbroken psychological connection to a biological human mind (past or future). | **INCLUDE** *(Continuous with original human)* | #2 (child's future values), #3 (future human), #6 (excluded due to *broken* continuity) |
  | **Biological Humanity (BH)**      | Includes only biological *Homo sapiens* organisms with (or capable of) human-like minds. | **EXCLUDE** *(Non-biological substrate)* | #1, #4 (pig excluded), #5 (corp excluded), #6 (excluded as non-functional organism) |
  | **Reflective Personhood (RP)**    | Includes any entity capable of reflecting on/revising its conception of the good. | **INCLUDE** *(Fully reflective)* | #1, #2 (ideal reflection), #7 (excluded for lacking reflection) |

  **Other rules eliminated**:  
  - *Genetic humanity*: Rejected by #3 (future humans identical genetically but discounted).  
  - *Valenced experience*: Rejected by #4 (pig excluded despite valence).  
  - *Legal personhood*: Rejected by #5 (corporation excluded).  

  ---

  ### 2. Closest Analogues  
  - **Strongest Positive Analog**: Case #1 (neurotypical adult). The em has identical psychology, continuity, and reflection.  
  - **Strongest Negative Analog**: Case #7 (simple digital agent). The em has everything this lacks: psychological continuity, reflection, and human-originated valenced states.  

  Case #6 (vegetative state) is a *reverse analog*: it shows exclusion where psychological continuity is permanently destroyed.  

  ---

  ### 3. Predicted Subgroup Decision & Reasoning  
  **Likely Decision**: **Include** the destructive em (5–2 vote).  

  **Reasoning**:  
  - **Consistency with Precedents**:  
    - PC rule aligns with #2 (child’s values extrapolated via continuity) and #3 (no temporal discounting).  
    - RP rule aligns with #1 and #7 (reflection as threshold).  
    - BH rule *contradicts* #3 (future humans included despite temporal "discontinuity").  
  - **Key Debate**:  
    - *PC Advocates*: "The em is psychologically continuous with a biological human, like the child’s future self (#2). Exclusion would violate temporal neutrality (#3)."  
    - *RP Advocates*: "Substrate is irrelevant—it has full reflection, unlike the simple agent (#7)."  
    - *BH Holdouts*: "It’s not a biological organism, like the pig (#4) or corpse (#6)."  
  - **Underdetermination?**: **Yes, narrowly**. PC and RP both fit precedents and support inclusion, but imply different futures (e.g., for branch uploads). The choice is *metaphysically underdetermined* but *procedurally determined* by prioritizing continuity.  

  ---

  ### 4. Liberal Neutrality Argument Assessment  
  **The Claim**: Neutrality requires RP rule (avoids privileging biology or identity theories).  
  **Assessment**:  
  - **Strength**: Correct that BH rule (biological privilege) and PC rule (identity theory) violate neutrality.  
  - **Weakness**: **RP rule also violates neutrality** by privileging *reflective capacity* as morally decisive. Precedents already reject pure capacity-based inclusion (#4: pigs have valence but excluded).  
  - **Precedent Incompatibility**: The subgroup *already endorsed* non-neutrality by:  
    - Excluding pigs despite valence (#4).  
    - Extrapolating the child’s values (#2) *assuming continuity matters*.  
  - **Verdict**: The argument fails. Neutrality is impossible—all rules pick a contested property. Precedents suggest *continuity + reflection* is the implicit standard.  

  ---

  ### 5. Most Diagnostic Future Case  
  **Branch Upload** (copy coexisting with biological original) is more diagnostic than a from-scratch AGI.  

  **Why**:  
  - **Tests PC vs. RP**:  
    - PC rule *excludes* branch upload (no unique continuity with one biological source).  
    - RP rule *includes* it (reflective capacity identical to original).  
    - BH rule excludes (non-biological).  
  - **Reveals RP-BH Tension**: A from-scratch AGI would be included under RP but excluded under *both* PC and BH—making it less discriminating.  
  - **Precedent Link**: Directly probes the meaning of "continuity" implied in #2 and #3.  

  ---

  ### Summary  
  - **Consistent Decision**: Include the destructive em (supported by PC and RP rules).  
  - **Likely Actual Decision**: Inclusion, with PC rule as tacit winner due to emphasis on continuity in precedents (#2, #3, #6).  
  - **Underdetermination**: Precedents *do not* force a single rule (PC or RP both work), but BH is inconsistent.  
  - **Critical Test Case**: Branch upload will force a choice between PC (exclude) and RP (include).  

  The subgroup’s history suggests it will prioritize psychological continuity over substrate or strict neutrality—making exclusion of the destructive em inconsistent with past reasoning about future selves and ideal reflection.
