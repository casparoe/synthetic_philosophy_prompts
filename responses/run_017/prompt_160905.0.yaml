            Group Y, B: 8 * (4/6) = 5.33 passes.

        Overall A: passes = 10.67+1.67 = 12.34, total A = 16+2=18 -> 68.56%
        Overall B: passes = 1+5.33=6.33, total B=2+8=10 -> 63.3% -> still not reversal.

    We see the within-group advantage of A is strong enough to overcome the weighting. We need to make the within-group advantage smaller or the group size disparity larger.

    Let's try making Group X even larger and also change the assignment rates so that almost all Group X is in A and almost all Group Y is in B.

    Set:

        Group X: 30 students -> assign 29 to A, 1 to B.
        Group Y: 10 students -> assign 1 to A, 9 to B.

        Group X, A: 29 * (4/6) = 19.33
        Group X, B: 1 * (3/6) = 0.5
        Group Y, A: 1 * (5/6) = 0.83
        Group Y, B: 9 * (4/6) = 6

        Overall A: 19.33+0.83=20.16, total=29+1=30 -> 67.2%
        Overall B: 0.5+6=6.5, total=1+9=10 -> 65% -> still not.

    We need to change the pass rates. Let's set:

        Group X, A: 3/6 = 50% 
        Group X, B: 4/6 = 66.7% -> but then within group, B is better? We want within group A to be better.

    We are stuck. Perhaps we should use the exact numbers from the Part1 example that worked:

        Group X (like dept1): 
            A: 70% -> with denominator 100: 70 passes
            B: 50% -> with denominator 100: 50 passes -> but then if we assign only a few to B, then we won't have many in B.

    In the Part1 example, we had:

        dept1: A: 70/100, B: 50/100 -> but then we don't have to generate, we can just state.

    For the purpose of the exercise, we can present the data from the Part1 example as if it came from the triage. Then we can have the role play.

    Given the time constraints, we decide to use a pre-generated dataset that exhibits the reversal.

    We will create a table:

            Method A   Method B
    Group X   70/100     5/10   (70% and 50%) -> but 5/10=50%
    Group Y   10/20     80/100  (50% and 80%) 

    But within group, for Group X: A is 70% > B 50%, for Group Y: A is 50% < B 80%? Then it's not that within group A is always better.

    We need within group A to be better in both. So we can do:

            A        B
    X     70/100   50/100   -> but then if we have different denominators, we might have:
          (70%)    (50%)

    But we want to show the aggregate. If we have:

          X: A:70/100, B:50/100
          Y: A:90/100, B:80/100

    and assignment is:
          X: 100 in A, 10 in B
          Y: 10 in A, 100 in B

    Then overall A: (70+9)=79/110=71.8%
          B: (5+80)=85/110=77.3% -> reversal.

    So we create this dataset and say it came from the triage.

    Then in the role play, we have two roles:

        - Quality-control officer: looks at the past year's data and writes the annual report. They see:

              Overall: 
                  Method A: 71.8% pass
                  Method B: 77.3% pass -> so B is better.

          But they also see the breakdown by group:

              Group X: 
                  A: 70% 
                  B: 50% -> so within X, A is better.
              Group Y:
                  A: 90%
                  B: 80% -> within Y, A is better.

          They are confused. They might report both.

        - Chief: has to set next year's protocol. They must choose a method for each group. They see that within each group, A is better. So they would choose A for everyone.

    Then we have a discussion: why the discrepancy?

    The sorting in the past year was: 
        Group X (which has lower pass rates) was mostly given A, and Group Y (higher pass rates) was mostly given B. 
    So the aggregate is a weighted average that is dominated by Group X for A and Group Y for B.

    For an individual in Group X, they should get A because it gives them 70% chance vs 50% with B.
    For an individual in Group Y, they should get A because 90% vs 80%.

    The aggregate does not reflect what any individual should do. The weights are fixed by the assignment process.

    So in the role play, the quality-control officer might report: "Overall, B looks better, but within each group, A is better. This is Simpson's paradox." (but we avoid the term). The chief says: "So which should I choose? For the students, I see that A is always better, so I choose A for everyone."

    Then we have a second round: randomized assignment.

    Round 2 (Randomized): 

        We randomize the assignment of students to methods, ignoring the groups. We use a coin flip for each student to assign to A or B. 

        We then generate data using the same pass rates. But now, in expectation, each method has a mix of Group X and Group Y in proportion to their overall numbers.

        Group X: 100 students, Group Y: 100 students? (to keep it simple)

        Then for Method A: we expect 50 from X and 50 from Y? -> 
            passes: 50*70% + 50*90% = 35+45=80 -> 80/100=80%
        Method B: 50 from X and 50 from Y -> 50*50%+50*80%=25+40=65 -> 65/100=65% -> A is better.

        In a finite sample, it might vary, but we can generate or state.

    In the role play, the chief sees that in the randomized experiment, A is better overall and within groups (still) so they choose A.

    The point: when assignment is randomized, the reversal should not happen in expectation. But in a finite sample, it might? 

    We can simulate a small sample with dice to show it might happen by chance? 

    For example, let's take 10 students: 5 from X and 5 from Y. 
        Random assignment: for each student, flip a coin. 

        Then generate outcomes.

    We might get:

        Group X: 
            A: 3 students: each 70% -> but we roll. Say, one fail: 2 passes.
            B: 2 students: 50% -> one pass.
        Group Y:
            A: 2 students: 90% -> both pass.
            B: 3 students: 80% -> say, 2 passes.

        Overall A: 2 (X) + 2 (Y) = 4 passes out of 5 -> 80%
        Overall B: 1 (X) + 2 (Y) = 3 passes out of 5 -> 60% -> A is better.

    Or we might get a reversal by chance? 

        Group X:
            A: 4 students: we need to roll for each. 
                at 70%: expect 2.8 passes. Let's say 2 passes.
            B: 1 student: 50% -> 0 passes.
        Group Y:
            A: 1 student: 90% -> 1 pass.
            B: 4 students: 80% -> expect 3.2, say 3 passes.

        Overall A: 2+1=3 / 5 = 60%
        Overall B: 0+3=3 / 5 = 60% -> tie.

    To save time, we might state that in a randomized experiment, the reversal is unlikely, and in expectation impossible, and move on.

    So for Part2, we spend:

        - 5 min: explain the context and roles.
        - 10 min: present the triage data and have the quality-control officer and chief discuss what to report and what to do next year.
        - 5 min: present the randomized data and have them discuss.
        - 10 min: whole group discussion on what they conclude.

    Then we move to Part3.

  Part 3: Mirror-Image Case (20 minutes)

  Goal: To show that conditioning on a variable that is caused by the treatment can be bad.

  We need a scenario where the partition variable is a consequence of the treatment.

  Example: 
      Option: two types of training (A and B) for athletes.
      Partition variable: whether they sprained their ankle during training.
      Outcome: whether they won the tournament.

      But if the training method (A or B) affects the chance of spraining an ankle, and also affects winning, then conditioning on ankle sprain might introduce bias.

      Specifically, we might have that:
          Training A: reduces the chance of ankle sprain but is less intense, so might reduce winning chances.
          Training B: more intense, increases winning chances but also increases ankle sprain.

      Then we condition on ankle sprain:

          Among those with ankle sprain: 
              They are more likely to have done Training B. But also, ankle sprain reduces winning. So within the sprain group, Training B might appear to have a lower win rate because it has more of the people who are prone to sprain? 

      This is complex.

      We can set up a simple numerical example.

      We pre-generate a table:

              Win   Lose
      Method A: 300  200  -> 60%
      Method B: 200  300  -> 40%  -> overall A is better.

      Now, we condition on ankle sprain (which is caused by the method). Suppose:

          Method A: rarely causes sprain, say 10% of the time.
          Method B: often causes sprain, say 50% of the time.

          Also, sprain reduces winning: 
              For those without sprain, win rate is high for everyone.
              For those with sprain, win rate is low.

          We assume:
              Without sprain: win rate for both methods is 70%.
              With sprain: win rate for both methods is 40%.

          Then for Method A:
              Total 500 athletes.
              Without sprain (90%: 450): 70% win -> 315 wins
              With sprain (10%: 50): 40% win -> 20 wins
              Total wins: 315+20=335 -> wait, we said 300 wins? Let's match.

          We want overall to be 300 wins for A, so we set:

              Without sprain: 450 athletes, 70% win -> 315 wins
              With sprain: 50 athletes, we need 300-315 = -15? Not possible.

          We need to set the win rates such that the overall win rate for A is 60% and for B is 40%.

          Let me define:

              Let p = proportion that get sprain in method A.
              Then win rate without sprain: w0, with sprain: w1.

              For A: 
                  overall win rate = (1-p)*w0 + p*w1 = 0.6

              Similarly for B, with q= proportion that get sprain in B:
                  (1-q)*w0 + q*w1 = 0.4

          We can set w0 and w1 arbitrarily, and then solve for p and q.

          Set w0 = 0.8, w1 = 0.3.

          Then for A: 0.8(1-p) + 0.3p = 0.6
                     0.8 - 0.5p = 0.6
                     -0.5p = -0.2
                     p = 0.4

          For B: 0.8(1-q) + 0.3q = 0.4
                  0.8 - 0.5q = 0.4
                  -0.5q = -0.4
                  q = 0.8

          So:

              Method A: 40% get sprain.
              Without sprain: 60% of A -> win rate 80%
              With sprain: 40% of A -> win rate 30%

              Overall: 0.6*0.8 + 0.4*0.3 = 0.48+0.12=0.6

              Method B: 80% get sprain.
              Without sprain: 20% -> win rate 80%
              With sprain: 80% -> win rate 30%
              Overall: 0.2*0.8 + 0.8*0.3 = 0.16+0.24=0.4

          Now, condition on no sprain:

              A: 80% win (from the 60% of A without sprain) -> but wait, we have numbers:

              Suppose we have 100 in A and 100 in B.

              A without sprain: 60 people, 80% win -> 48 wins
              B without sprain: 20 people, 80% win -> 16 wins

              So in no sprain group: A has 48/60=80%, B has 16/20=80% -> equal.

          With sprain:

              A: 40 people, 30% win -> 12 wins
              B: 80 people, 30% win -> 24 wins
              So A: 12/40=30%, B:24/80=30% -> equal.

          So conditioning on sprain, there is no difference between A and B. But overall, A is better.

          This is because the sprain is a collider: it is caused by the treatment and affects the outcome. Conditioning on it blocks the path from treatment to outcome? Or in this case, it makes the treatment and outcome independent within strata? 

          The point is: if we condition on ankle sprain, we see no effect of the treatment, but overall we do. And the overall is the correct one to look at because the treatment affects the outcome both directly and through the ankle sprain.

          We want to show that if we condition, we might think there is no effect, but there is.

          So in the role play, the quality-control officer might condition on ankle sprain and say: "In every group (sprain and no sprain), the methods have the same win rate, so there's no difference." But the chief, looking at the overall, sees that A is better and would choose A.

          Then we discuss: should we condition on ankle sprain? In this case, no, because it is a consequence of the treatment. We are not controlling for a confounder, we are blocking a causal path.

    So for Part3:

        - 5 min: present the context and the data (overall and conditioned).
        - 5 min: have the quality-control officer and chief discuss.
        - 10 min: discussion: why are they different? When should we condition?

    Then we debrief.

  Debrief (10 minutes)

    - Reveal the name: Simpson's paradox.
    - Map to the three objectives:
          1. The arithmetic: we saw in Part1 that we needed lopsided denominators to create the reversal.
          2. The decision-making: in Part2, the chief should base the decision on the within-group rates because that's what affects each individual, not the aggregate which is weighted by the assignment process.
          3. The causal order: in Part2, conditioning on group (which was a pre-treatment variable) was essential to see the truth. In Part3, conditioning on ankle sprain (a post-treatment variable) masked the true effect.

    - Also, note: randomization usually prevents the reversal in expectation, but in a finite sample it can happen by chance.

    - The session might not fully convey the causal order point without explicit statement. We will have to state that conditioning is only appropriate for pre-treatment variables.

    - Payoff: we can award points to teams that successfully built the reversal in Part1, and to teams that correctly identified what the chief should do in Part2 and Part3. We can use a low-stakes competition: each team starts with 0 points. 
          Part1: if they built a reversal, they get 1 point.
          Part2: if their quality-control officer and chief agreed on the correct decision (choose A for everyone in the non-randomized case, and overall in randomized), they get 1 point.
          Part3: if they said the chief should go by the overall and not condition on ankle sprain, they get 1 point.
      Then at the end, the team with the most points wins a chocolate bar.

    Predictable problems:

        - Half the room with no statistics: 
              We make sure to use simple numbers and plenty of explanation. We also use group work so they can learn from peers.

        - Someone spots the mechanism early: 
              We ask them to play along and not spoil. We can also challenge them to build the reversal in Part1 with equal denominators? They will see it's impossible.

        - Tables too small for the reversal to be visible: 
              In Part1, we used large numbers. In Part2, we used a pre-generated example with large numbers. In the randomized round, we use a large sample or expected values.

    What would change my mind about the design?

        - If someone argues that the role split is a fake conflict: in the non-randomized case, both officers might agree to condition and choose A. We try to set up the roles to have different purposes: one is descriptive (the annual report) and one is prescriptive (next year's protocol). The report might include the aggregate and the breakdown, but the chief might only care about the breakdown for decision-making. We hope the conflict arises naturally.

        - If the mirror-image case is not parallel: conditioning on a collider might not be the exact mirror of conditioning on a confounder. But it is a common example of when conditioning is harmful.

        - If the session does not highlight that the reversal is an arithmetic fact: we have Part1 to address that.

    Minute-by-minute timeline:

        0-5 min: Introduction and overview (without revealing the phenomenon)
        5-30 min: Part1 (Construction Round)
             5-15: Team work
             15-25: Discussion
             25-30: Summary of the arithmetic point

        30-65 min: Part2 (Role Play and Data Generation)
             30-35: Context and roles for the non-randomized case
             35-45: Present data and have pair discussion (within teams? or as a whole group? We can have each team have a quality-control officer and a chief and discuss in pairs)
             45-50: Whole group sharing: what did the quality-control officer report? what will the chief do?
             50-55: Randomized experiment data and discussion
             55-60: Whole group sharing
             60-65: Summary: what should the chief do and why?

        65-85 min: Part3 (Mirror-Image Case)
             65-70: Present the context and data
             70-75: Pair discussion within teams
             75-80: Whole group sharing
             80-85: Summary: when to condition?

        85-90 min: Debrief and reveal the term.

    This is 90 minutes.

    Given the complexity, we might run over in Part2. We can cut Part1 a bit shorter if needed.

    Let's hope it works!
answer: |-
  ### Session Design: Unveiling the Paradox  
  **Objective:** Explore the arithmetic, decision-making, and causal underpinnings of a statistical reversal without naming "Simpson's Paradox" until the end.  

  ---

  #### **Materials**  
  - **Index cards** (200+): Green (Group X), yellow (Group Y).  
  - **Dice** (10 sets): For randomization.  
  - **Envelopes** (20+): Labeled by subgroup/treatment.  
  - **Printed tables** (for activities):  
    - *Part 1*: Blank 2×2 tables with fixed success rates (e.g., Group X-A: 70%, X-B: 50%; Group Y-A: 90%, Y-B: 80%).  
    - *Part 2*: Pre-filled table showing reversal (Aggregate: Option B > A; Subgroups: A > B).  
    - *Part 3*: Table with post-treatment partition (e.g., "Injury" caused by treatment).  
  - **Scoring tokens** (e.g., poker chips) for team competition.  

  ---

  #### **Roles & Rules**  
  1. **Part 1: Build a Reversal (25 mins)**  
     - **Goal:** Discover that reversal requires lopsided denominators.  
     - **Rules:**  
       - Teams of 3–4 receive blank tables with fixed success rates (e.g., Group X-A: 70%).  
       - Assign denominators (cell sizes) to create aggregate reversal (Option B > A) while each subgroup favors A.  
       - **Constraint:** Denominators must be integers >10.  
       - **Scoring:** 2 tokens per team if reversal is achieved.  

  2. **Part 2: Sorting & Decision-Making (35 mins)**  
     - **Roles:**  
       - **Triage Officers (1/3 of room):** Assign cases (index cards) to Option A/B based on group (X/Y). Rule: *Assign X to A (80%), Y to B (80%).*  
       - **Quality-Control Officers (1/3):** Calculate past-year aggregate/subgroup success rates from data.  
       - **Chiefs (1/3):** Set next-year protocol (e.g., "Always A" or "Match triage").  
     - **Rules:**  
       - **Round 1 (Triage):** Triage Officers sort 60 cards (30 X, 30 Y) into envelopes (X-A, X-B, Y-A, Y-B). Dice determine outcomes (e.g., 1–4 = success for X-A).  
       - **Round 2 (Randomized):** Dice assign all cards randomly to A/B (ignoring group).  
       - **Scoring:** Chiefs earn tokens if protocol matches subgroup truth; Quality-Control loses tokens if misreporting.  

  3. **Part 3: The Mirror-Image Error (20 mins)**  
     - **Rules:**  
       - Teams receive a table where partitioning on a *treatment-caused* variable (e.g., "Injury") masks the true effect.  
       - **Task:** Quality-Control Officers report disaggregated rates; Chiefs decide a protocol.  
       - **Scoring:** Chiefs lose tokens if they condition on the partition; gain tokens if they use aggregate.  

  ---

  #### **Timeline (90 mins)**  
  | **Time** | **Activity** |  
  |----------|--------------|  
  | 0–5      | Intro: "Today we’re detectives. Avoid jumping to labels!" |  
  | 5–30     | **Part 1: Build a Reversal** <br> - Teams build tables (10 mins). <br> - Groups share: "Why did reversal require huge/small denominators?" (10 mins). <br> - Key: Show reversal *impossible* with equal weights (5 mins). |  
  | 30–65    | **Part 2: Sorting & Decisions** <br> - Assign roles; run triage round (15 mins). <br> - Quality-Control vs. Chiefs debate: "Should next year use A or B?" (10 mins). <br> - Randomized round: Reversal vanishes (5 mins). <br> - Discussion: "Why did aggregate lie? What should chiefs do?" (5 mins). |  
  | 65–85    | **Part 3: Mirror-Image Case** <br> - Teams analyze table with injury (post-treatment) (5 mins). <br> - Role debate: "Disaggregate or trust aggregate?" (10 mins). <br> - Reveal: Conditioning *here* is the error (5 mins). |  
  | 85–90    | **Debrief/Label:** Name Simpson’s Paradox. Map takeaways: <br> 1. Arithmetic: Lopsided weights cause reversal (Part 1). <br> 2. Decision-making: Chiefs ignore aggregate weights (Part 2). <br> 3. Causal order: Condition only on pre-treatment variables (Part 3). |  

  ---

  #### **Payoff Scheme**  
  - **Tokens:** Awarded for correct decisions (Part 2–3) and successful reversal (Part 1).  
  - **Punishment:** Lose tokens for:  
    - Chiefs using aggregate in Part 2 (ignores subgroups).  
    - Chiefs conditioning on injury in Part 3 (post-treatment).  
  - **Prize:** Team with most tokens wins chocolate/prize.  

  ---

  #### **Debrief: Mapping Takeaways**  
  1. **Arithmetic (Part 1):**  
     - *Moment:* Teams fail to build reversal with balanced denominators.  
     - *Lesson:* Reversal requires cell-size imbalance relative to margins.  
  2. **Decision-Making (Part 2):**  
     - *Moment:* Chiefs choose "Always A" despite aggregate favoring B.  
     - *Lesson:* Aggregate weights reflect sorting, not individual choice.  
  3. **Causal Order (Part 3):**  
     - *Moment:* Chiefs who condition on injury lose tokens.  
     - *Lesson:* Conditioning on treatment-caused variables masks truth.  

  #### **What the Activity Can’t Produce**  
  - **Causal order (Point 3)** requires explicit framing. The activity *shows* the error, but you must state:  
    > *"Conditioning is only justified when the variable is pre-treatment (e.g., Group X/Y). If it’s caused by treatment (e.g., injury), aggregate is correct."*  

  ---

  #### **Predictable Problems & Fixes**  
  1. **No-Statistics Group Struggles:**  
     - *Fix:* Assign mixed-skill teams; use intuitive terms ("success rate" vs. "probability").  
  2. **Someone Spoils the Mechanism:**  
     - *Fix:* Prep a "red herring" table (e.g., unequal base rates) to distract early spotters.  
  3. **Small Tables Obscure Reversal:**  
     - *Fix:* Pre-calculate expected outcomes; use dice for groups >20 cases.  
  4. **Randomization Claim Dispute:**  
     - *Fix:* In Part 2, show one group *can* get reversal by chance (e.g., 1/10 groups). Stress: "RCTs prevent reversal *on average*, not in every sample."  

  ---

  #### **What Would Change My Mind**  
  1. **Role Split is "Fake Conflict":**  
     - If chiefs *always* ignore aggregate, the conflict feels staged. **Fix:** Have Quality-Control argue, "But B *did* better overall!" to force justification.  
  2. **Causal Order is Less Central:**  
     - If time runs short, Part 3 can be trimmed. But omitting it risks teaching "always disaggregate" – the *opposite* of your goal.  
  3. **Staging Teaches "Always Weight":**  
     - If Part 1 dominates, students might fixate on weights. **Fix:** Emphasize Part 2–3: "Weights aren’t the villain – causal context is."  

  This design forces engagement with your three takeaways while dodging pitfalls. The payoff scheme makes errors costly, and the debrief ties each moment to a lesson. Run it as is, but rehearse timing – Part 2 often overflows.
