  For "what it shows", I must emphasize this is specifically a critique of patterned theories - not proof of libertarianism. Nozick's own entitlement theory has serious flaws even if this argument lands. The infrastructure point in the streamer example actually exposes a weakness in Nozick's framework - interdependence challenges his atomistic view of ownership.

  The streamer addendum ironically strengthens their skepticism. It highlights how modern platforms rely on collective systems (algorithms, internet infrastructure) that undermine the "pure voluntary exchange" premise. This deserves explicit callout since they flagged it.

  Finally, "what to do" should affirm their critical approach: keep the insight about emergent inequality, reject extreme rhetoric, and notice real-world complexities. No reading list - they were clear about that. Instead, I'll subtly model how to dissect arguments by applying their own infrastructure observation to counter the blogger's simplification.

