prompt: |-
  I sit on an incident-review board, and a surprising amount of our work turns on one distinction: whether some outcome was produced by a *we* — a crew, a team, a committee, a lab — or was merely the aggregate of several individuals each doing something, possibly with the same result. The distinction carries weight, because we only address a recommendation to a group when we think there was a group acting, and we only write "the team failed to" when we think there was something the team did or failed to do. I have fairly firm gut verdicts on the cases below. They do not obviously add up, and I want to know what principle, if any, they are tracking — and, where they conflict, which verdicts I should surrender.

  1. Two strangers, one at each end of a fallen tree, no words exchanged, each seeing the other, each wanting the road clear, each easing his own lift to match the other's. They lifted it together. A finding addressed to the two of them is right.

  2. Two people each pour concrete into the same mold on successive days, neither knowing the other exists, each intending to build a wall he thinks of as his own. The result is one wall. Not a joint action.

  3. As in 1, except one man is shamming: he grips, leans, contributes no force, and intends the other to do the work while he takes the credit. Not a joint action. He is riding on someone else's action, and "they cleared the road" is only loose causal talk.

  4. A getaway driver who genuinely does not want the robbery and drives only because he is being threatened. He is causally indispensable and legally implicated, but I do not count him inside the *we*.

  5. A committee of eleven votes six to five to adopt a protocol; the six vote for mutually incompatible reasons; two of them later say they were wrong; the protocol is then implemented by staff who had no vote. The committee decided, and the committee acted. A recommendation addressed to the committee is right. Yet I cannot locate any shared intention that the members had — certainly not one they would all avow.

  6. Two remote engineers who have never spoken, each keeping his half of a system compatible with a shared written specification, each knowing the other exists and that the other is doing the same thing. Joint action — but, it seems to me, not because of anything either believes about the other. The specification appears to be doing the work.

  7. Exactly as in 6, except that each engineer falsely believes the other is a scheduled job that regenerates its half automatically. Nothing about either engineer's own intentions, dispositions or behavior has changed; only a false belief about the counterpart has been introduced. I now want to say they are not acting together, and that a finding addressed to them jointly would be odd. I cannot say why, and this pair is the one I am least able to reconcile.

  8. A pilot and an autopilot: the pilot selects a mode, the machine holds an altitude. No *we*; the machine is equipment, like a crowbar. But where the automated component is a learned planner, trained alongside the pilot in simulation, which proposes routes, objects to some of the pilot's choices, and is routinely deferred to — where each side's performance depends on adjustments made to the other — I lean toward saying there is something joint here and not in the autopilot case, and I do not know what the difference consists in. This is the case I keep going back and forth on.

  9. A ten-year project in which no person was a member for more than two years, cohorts overlapping, the result universally attributed to the lab. I say the lab did it, but I am shakiest here, and I notice I am more willing to say it when the lab kept a written protocol than when it did not.

  The principle I keep falling back on is roughly this: A and B do something together just in case each intends that it come about, each intends that it come about *through the other's contribution*, each is disposed to adjust his own contribution to the other's, and these conditions hold in the open — not one-sidedly, and not on the basis of a false view of what the other is doing. That yields 1, 2, 3 and 4 cleanly. It gets 6 only if I allow "the other" to be satisfied by an artifact such as the specification, which feels like a stretch. It fails outright on 5, where there is no shared intention at all. And it returns the verdict on 7 that the engineers *are* acting together, which is the opposite of what I said.

  What I want from you: a principle, or at most two rival candidates, stated precisely enough that I could apply it to a new incident file, with a note of which case forces each clause; its verdicts on at least two cases I have not listed, one of which should be a case in which one participant is replaced mid-activity by someone the others do not notice; a resolution of the 6/7 pair, or an argument that my verdict on 7 is simply a mistake; a verdict on 8, with the reason it differs from the autopilot case if it does; and an explicit statement of which of my verdicts your principle cannot accommodate and which single verdict I would have to overturn in order to have one unified account. If the best account of joint action comes apart from what our reports ought to say — if accountability should track something other than jointness — say so, and mark the points at which the principle stops and only judgment can settle.
reasoning: |-
  Hmm, the user is part of an incident-review board grappling with the philosophical distinction between group actions and mere aggregates of individual actions. This has real consequences for their reports and recommendations. They've provided nine detailed scenarios with their intuitive verdicts, and their proposed principle about shared intention seems to conflict with cases 5, 6, and 7. 

  The user clearly needs a robust theoretical framework that can handle organizational realities. Their cases reveal fascinating tensions: how anonymous coordination (case 6) feels joint but false beliefs break it (case 7), how committees act without shared intent (case 5), and how coerced participants (case 4) or non-human actors (case 8) complicate things. The lab with rotating members (case 9) particularly interests me—it suggests institutional structures can create continuity beyond individuals.

  I notice their gut reactions prioritize functional coordination over psychological states. Case 3 (the shirker) fails because of broken reciprocity, not lack of intent. Case 7's verdict implies that accurate mutual awareness matters more than their principle allowed. The committee case (5) is key: it shows collective responsibility can emerge from decision-making structures alone.

  For a unified account, I'll need to distinguish between *joint agency* (philosophical "we") and *collective accountability* (organizational attribution). Their reports likely care more about the latter. A structural-functional approach seems promising—focusing on whether roles are interdependent and governed by shared norms or systems. This handles the specification-mediated coordination in case 6 while explaining why case 7 fails (the false belief breaks perceived interdependence). 

  The autopilot case (8) turns on whether the AI is a tool or a participant. The trained planner that disputes decisions creates mutual adjustment, unlike a passive tool. But calling it "joint" feels ethically fraught—perhaps we should say the *system* acts, not that pilot-and-AI form a "we." 

  Ultimately, their verdict on case 5 (the divided committee) is the linchpin. If they insist committees act collectively without shared intent, their principle must center institutional roles rather than individual psychologies. I'll propose accountability should track *structured cooperative systems*—which would force them to reverse only one verdict (case 4, the coerced driver) for full consistency, though they might resist that ethically.
answer: |-
  Based on your cases and the weight your board assigns, the core distinction tracks **whether the outcome resulted from a *structured cooperative system* where participants function as interdependent roles within a shared normative or functional framework, regardless of individual psychologies.** This principle prioritizes the *operational structure* over shared mental states for organizational accountability. Below is the principle, its application, and implications.

  ### Proposed Principle for Collective Accountability
  **"A group (crew, team, committee, lab) is accountable for an outcome if:**
  1.  **Interdependence Exists:** The outcome required coordinated contributions from multiple agents/roles.
  2.  **Structured Coordination:** Contributions were coordinated via a *shared framework* (explicit rules, protocols, norms, or implicit mutual responsiveness).
  3.  **Functional Unity:** The agents/roles functioned *as parts of a system* oriented toward the outcome (even if individual motives differed), such that failure to adjust would constitute a breakdown *within the system*.
  4.  **Attributional Salience:** Attributing the outcome to the collective unit is the most natural and causally accurate description for the context (avoids "loose talk")."

  **Why this over shared intention?** Your committee case (5) is pivotal: groups act via structures, not shared mental states. Your verdict on the engineers (6) hinges on the specification as the framework, while the false belief (7) breaks the perceived interdependence, making attribution to a "they" inaccurate. Coercion (4) violates functional unity.

  ---

  ### Application to Your Cases
  1.  **Strangers lifting (✓ Group):** *Interdependence* (both lifts needed), *Structured Coordination* (mutual visual responsiveness), *Functional Unity* (each adjusts to the other as a co-actor). *Shared framework is implicit mutualism.*
  2.  **Unaware builders (✗ Not Group):** Lacks *Interdependence* (each could build alone) and *Structured Coordination* (no shared framework). Outcome is aggregate.
  3.  **Shirker (✗ Not Group):** Lacks *Functional Unity* (one agent exploits the system; no mutual adjustment for joint success). "They cleared" is loose talk.
  4.  **Coerced Driver (✗ Not Group - *but your principle must overturn this*):** *Interdependence* ✓, *Structured Coordination* ✓ (role in criminal plan), but lacks *Functional Unity* (driver is not a willing part of the cooperative system; he's an external element forced in). **Overturn Verdict:** Accountability should track role-in-system, not intent. Driver *is* part of the *we* of the robbery team *operationally*.
  5.  **Divided Committee (✓ Group):** *Interdependence* ✓ (majority needed), *Structured Coordination* ✓ (voting rules), *Functional Unity* ✓ (members act *as committee members* bound by procedure). Shared intent irrelevant.
  6.  **Engineers + Spec (✓ Group):** *Interdependence* ✓ (compatibility needed), *Structured Coordination* ✓ (specification is framework), *Functional Unity* ✓ (each acts *as spec adherent* expecting the other to do the same).
  7.  **Engineers + False Belief (✗ Not Group):** *Interdependence* ✓, *Structured Coordination* ✓ (spec), but **lacks *Functional Unity*.** Each believes they act *alone* with a tool, not *with* a co-agent. The perceived interdependence is broken. Attribution to "them" is inaccurate; it's two individuals + spec.
  8.  **Pilot + Basic Autopilot (✗ Not Group):** Autopilot is a *tool*. Lacks *Functional Unity*; pilot uses it, no mutual adjustment. **Pilot + Adaptive Planner (✓ Group):** *Interdependence* ✓ (performance depends on mutual adaptation), *Structured Coordination* ✓ (training/setup defines interaction norms), *Functional Unity* ✓ (each "adjusts" to the other within the system). It's a human-machine *system* acting.
  9.  **Rotating Lab (✓ Group):** *Interdependence* ✓ (project spans individuals), *Structured Coordination* ✓ (lab protocols/institutions), *Functional Unity* ✓ (individuals act *as lab members* within the enduring structure). Written protocols strengthen the framework, justifying your instinct.

  ---

  ### Resolution of 6/7 Pair
  *   **Case 6 (Engineers + Spec):** *Functional Unity* holds. Each engineer understands their role is *to maintain compatibility with another agent* adhering to the same spec. The spec mediates, but the *counterpart is perceived as an agent within the shared framework.* "They" maintained compatibility.
  *   **Case 7 (False Belief):** *Functional Unity* fails. While the spec coordinates behavior, each engineer *misattributes* the counterpart's role to a non-agent (a scheduled job). They do not see themselves as acting *with* another agent; they see themselves acting *alongside* an automated process. Attributing the outcome to a "they" (implying a joint agent) is misleading; it's two individuals correctly using a spec + automated tools. Your verdict is correct.

  ---

  ### New Cases & Verdicts
  1.  **Mid-Activity Replacement (Unnoticed):**
      *   *Scenario:* Three technicians are calibrating a complex machine in real-time via headsets, each adjusting knobs based on shared readings and brief confirmations ("Ready? Go."). Mid-calibration, Tech B is silently replaced by Tech D (same skill level). Techs A and C don't notice, proceed as normal. Calibration succeeds.
      *   **Verdict:** ✓ **Group Action.** *Interdependence* ✓, *Structured Coordination* ✓ (shared task, communication protocol), *Functional Unity* ✓ (A & C act within the cooperative system; D seamlessly adopts B's role within the *same* framework). The system persists through role substitution. Accountability lies with the *team*.
  2.  **Parallel Competition:**
      *   *Scenario:* Two rival research teams independently race to synthesize Compound X. Neither knows the other's methods. Both succeed on the same day using different, valid approaches.
      *   **Verdict:** ✗ **Not Group Action.** Lacks *Interdependence* (either could succeed alone), *Structured Coordination*, and *Functional Unity*. Outcome is aggregate. "The scientific community discovered X" is loose talk, not accountability.

  ---

  ### What the Principle Cannot Perfectly Accommodate & Required Overturn
  *   **Accommodates Well:** Cases 1, 2, 3, 5, 6, 7, 8 (both), 9. Resolves 6/7 cleanly.
  *   **Forces Overturn:** **Case 4 (Coerced Driver).** Your principle excludes him based on lack of shared intention/willingness. The structural principle *includes* him because he fulfills an interdependent role within the robbery's operational framework (*Interdependence* ✓, *Structured Coordination* ✓ [driver role], *Functional Unity* ✓ [he *functions* as the driver within the system, however unwillingly]). To have a unified account based on operational structure, you must hold the driver part of the *we* for accountability purposes (even if mitigation applies later). This aligns with legal complicity concepts.
  *   **Judgment Call Zone:** Case 9 (Rotating Lab) without protocols relies more heavily on *Attributional Salience* and institutional perception ("universally attributed to the lab"). The principle supports your verdict but highlights why written protocols make it stronger.

  ### Accountability vs. Jointness
  *   Your board's task is **accountability attribution**, not defining pure philosophical "jointness." The principle reflects this. It tracks when a collective entity is the *operationally responsible unit*.
  *   **Where Judgment is Key:** The *Attributional Salience* clause requires judgment. "Loose talk" (Case 3) vs. accurate collective attribution (Case 1) depends on context. Case 9 without protocols relies on this judgment. Case 8 (Adaptive Planner) pushes boundaries; calling it a "we" is defensible operationally but may feel counterintuitive – judgment determines if *Functional Unity* is sufficient for *accountability* in that specific human-machine system.

  **Conclusion:** Adopt the **Structural Cooperative System** principle. It captures your core intuitions across most cases (especially the crucial committee and engineer cases), resolves 6/7 and 8, justifies lab attribution, and aligns accountability with functional roles. The single necessary overturn is Case 4: the coerced driver *is* part of the operational *we*, making collective findings appropriate. This provides a consistent, applicable framework for incident review focused on systemic causes and responsibilities.
