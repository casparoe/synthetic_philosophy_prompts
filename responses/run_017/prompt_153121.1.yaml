prompt: |-
  I'm trying to work out what I actually think about moral worth — when a right action actually has it — by going with my gut on cases rather than by reading around the literature.

  - Shopkeeper who gives correct change, and the only reason is that cheating would be bad for business: no worth, even though the action's right.
  - Kid raised to believe handing over a runaway is a duty, who helps the runaway anyway out of pity while thinking he's doing something wrong: worth, and I'm tempted to say more worth than the person who does it calmly from a sense of duty.
  - Donor who gives only because a mate nagged him and he feels guilty: no worth at the time. But if the same guy is still giving five years later out of genuine concern, I want to give those early gifts some worth retroactivly. Meanwhile the person who gives for years out of real concern and then turns bitter and stops caring: I don't want to take worth away from the earlier gifts. I know that's asymmetric and I cant say why.
  - Surgeon who operates partly to impress her boss and would have done it for that alone, though she also takes it to matter that the patient lives: some worth, but less.
  - Man who visits his friend in hospital mainly because it's what you do, not out of affection: worth, but something's off in a way the runaway case doesn't have — and I don't think "off" means less worth.
  - Guy who gives to whichever charity a dart lands on, and it happens to be an effective one: less credit than someone who checked, but no blame; and if the dart had landed on a dud I'd blame him less than someone who didn't care at all.

  My stab: an action's worth tracks how robustly the good reason would still have moved you in nearby cases where the selfish or easy reasons are taken away — call it robustness or whatever you like. Test that against my verdicts and repair it: does one version get them all, and if not which verdict has to go? Which clause is doing the work for which case, and is worth a matter of degree or all-or-nothing on your account? Then tell me what your principle says about two cases I havn't listed: an AI assistant that refuses a harmful request only because it was fine-tuned on polite refusals, and someone who does the right thing for a reason they'd disavow if they stopped to think about it. British English please.
reasoning: |-
  Okay, let me try to unpack the user's query. They're exploring moral worth through intuition-driven cases without diving into literature. First, I need to understand their examples and their proposed principle of robustness.

  Looking at the shopkeeper: they give correct change only to avoid bad business. User says no moral worth. The robustness principle makes sense here because if the business reason vanished, they might cheat. So robustness is low.

  The kid helping a runaway slave out of pity, against their belief. User sees high moral worth, even more than someone doing it from duty. Here, the good motive (pity) persists even without duty. Robustness holds, but why more worth? Maybe because acting against one's beliefs shows extra moral courage. The principle might need to account for counter-motive resistance.

  Donor cases: early donations under guilt have no worth, but later genuine concern retroactively grants worth. Bitter donor doesn't lose past worth. Asymmetry here. Robustness might explain the initial lack (fragile motive) but not retroactive granting. The user values the narrative link—early acts as part of a moral journey. Principle needs a diachronic element.

  Surgeon: mixed motives, some worth but less. Robustness handles this. If the boss-praise was removed, would they still operate? Partly yes, so partial worth. Matches user's view.

  Hospital visitor: acts out of duty, not affection. Worth but feels off. Robustness suggests worth since duty would persist without affection. But the "off" feeling might be about lack of warmth, not moral worth. Principle distinguishes worth from other virtues.

  Dart-thrower: less credit but no blame. Robustness explains low credit—good outcome by chance, not robust. But if dart hit a dud, less blame than someone indifferent. Indifference shows ill will, while dart-thrower lacks good will but not ill will. Principle needs to separate moral worth from blameworthiness.

  Now, the AI case: fine-tuned to refuse harm. No moral worth because no understanding. Robustness focuses on motives, but AI lacks intent. So worth requires agency. The disavowal case: someone acts rightly but would reject the reason if reflected. User might see some worth if the motive is good unconsciously. But if disavowed, robustness is low—reflection removes the motive. So possibly no worth.

  The user's deeper need seems to be reconciling intuitions with a coherent principle. They might want to justify moral worth as both diachronic and synchronic, accounting for personal growth. The asymmetry in the donor case suggests valuing moral development. Also, distinguishing between worth, credit, and blame. Their "off" in the visitor case might indicate that moral worth isn't the only value—emotional resonance matters too. They might need a principle that accommodates partial worth, narrative continuity, and separates worth from other moral assessments like blame or warmth.
answer: |-
  Right, let's crack this with your gut verdicts as the compass. Your robustness principle ("how robustly the good reason would still have moved you if selfish/easy reasons vanished") is a strong contender – **Kantian "good will" meets counterfactual stability**. Let's test it against your cases and see where it shines or needs tweaking, then apply it to your new cases. I'll use British English throughout.

  **Testing Your Robustness Principle Against Your Verdicts:**

  1.  **Shopkeeper:** Correct change *only* for business. Verdict: No worth.
      *   **Robustness:** Low. If cheating *helped* business, he'd cheat. The "rightness" reason (avoiding cheating) doesn't motivate him independently. The selfish reason is doing all the work. **Fits.**

  2.  **Kid Helping Runaway:** Acts from pity *against* perceived duty. Verdict: Worth (even high).
      *   **Robustness:** High. The "easy" reason (doing his perceived duty) is pulling him *away* from the right action. He acts *despite* it, purely on pity/concern for the runaway. The good reason (pity) is robust *against* the countervailing bad reason. **Fits (and explains high worth: counter-motive resistance).**

  3.  **Donor - Guilt (Early):** Gives only due to nagging/guilt. Verdict: No worth *at the time*.
      *   **Robustness:** Low. Remove the nagging/guilt (the "easy" reason), he likely stops giving. The genuine concern (good reason) isn't motivating him yet. **Fits.**

  4.  **Donor - Genuine (Later):** Gives from concern. Verdict: Worth *now*, and you want *retroactive* worth for early gifts?
      *   **Robustness:** High *now*. But **Problem:** Robustness is synchronic (about *that moment*). The principle struggles with retroactivity. The *early* acts still had low robustness. Your intuition suggests worth is partly *diachronic* – valuing the *narrative arc* or *causal chain* leading to a good will. The principle needs amendment for this. *(We'll fix this below).*

  5.  **Donor - Turns Bitter:** Genuine concern early, stops later. Verdict: Don't remove worth from early gifts.
      *   **Robustness:** At the time of early gifts, robustness was high. The principle *correctly* says worth was present *then*, regardless of later change. **Fits.** This highlights the asymmetry: worth is judged *at the time of action*, based on motives *then*. Later corruption doesn't rewrite history.

  6.  **Surgeon:** Mixed motives (impress boss + save patient). Verdict: Some worth, but less.
      *   **Robustness:** Moderate. If impressing the boss *wasn't* a factor, she might still operate (if saving the patient alone is sufficient). But if saving the patient *wasn't* a factor, she might *not* operate (if impressing the boss alone isn't sufficient). The good reason *is* robust to the removal of *some* selfish reasons (if the boss-praise vanished, she'd likely still act), but its *motivational strength* is diluted by the selfish reason. **Fits (explains partial worth).** Worth is clearly a matter of degree here.

  7.  **Hospital Visitor:** Visits out of duty ("what you do"), not affection. Verdict: Worth, but something "off".
      *   **Robustness:** High. Remove the "easy" reason (e.g., if no one would know he didn't visit), he'd likely still visit because it's *the right thing to do*. The good reason (duty/respect) is robust. **Fits for worth.** The "off" feeling might stem from a *lack* of another virtue (warmth, affection) which isn't strictly *required* for moral *worth* (doing the right thing for the right *kind* of reason), but makes the action feel colder or less admirable *overall*. Worth ≠ full admirability.

  8.  **Dart-Thrower:** Gives effectively by chance. Verdict: Less credit, no blame; less blame if ineffective.
      *   **Robustness:** Very Low. The "good reason" (helping effectively) played *no role* in his choice. It was pure luck. His action wasn't *motivated* by good reasons at all. **Fits for low/no moral worth ("less credit").** The blame asymmetry: If the dart lands on a dud, he *still* lacks ill-will or malice (he wasn't *trying* to be ineffective). Someone who didn't care *might* have ill-will (choosing *not* to help). Robustness focuses on the presence/absence of *good* motivating reasons. Lack of good motivation + lack of ill-will = less blameworthiness than lack of good motivation *plus* some ill-will/indifference. **Fits the asymmetry.**

  **Repairing the Principle: The Synchronic/Diachronic Issue (Donor Retroactivity)**
  Your donor asymmetry points to a gap. Robustness is excellent for judging an act *at the time*, but your intuition about the early guilt-driven acts gaining *retroactive* worth suggests you also value **moral development** and **causal chains** that *culminate* in a robust good will. We need a two-part principle:

  1.  **Synchronic Moral Worth (At the time):** An action has moral worth (to a degree) at time T if and only if the agent was *sufficiently* motivated to perform it *by a good reason* (e.g., duty, compassion, justice), and this motivation would have been *robust* against the removal of concurrent selfish/easy reasons. (Degree depends on motivational strength and robustness).
  2.  **Diachronic Moral Value:** An action performed at T1 with *low* synchronic moral worth can gain *retrospective significance* if it is a *necessary and non-fortuitous* part of a causal chain that leads the agent to develop a robust good will motivating good actions at T2. (This captures the "early donor" case). Conversely, later corruption doesn't erase *past* synchronic worth.

  **Revised Principle (British English):**
  > An action possesses **moral worth** at the time it is done to the extent that the agent's primary motivation for doing it stems from a recognition of its morally good reasons (like duty, compassion, or justice), and crucially, *this good motivation would have sufficed to prompt the action even if self-serving or merely convenient reasons for doing it were absent*. This worth is a matter of degree, reflecting the strength and independence of the good motivation.
  >
  > Additionally, an action done with little intrinsic moral worth can acquire **retrospective moral significance** if it forms a genuine, non-accidental stepping stone in the agent's development of a character capable of actions with proper moral worth.

  **How the Revised Principle Handles Your Cases:**
  *   **Early Guilt-Driven Donor:** Low/No *synchronic worth* at the time (motivation not robust). Gains *retrospective significance* if it genuinely led to his later compassionate giving.
  *   **Later Bitter Donor:** High *synchronic worth* at the time of early gifts (motivation was robust then). Later corruption doesn't remove this past worth, though it prevents *future* worth. No retrospective *significance* is lost; the worth *was* real then.

  **Worth: Degree or All-or-Nothing?**
  Your verdicts scream **matter of degree**:
  *   Surgeon: Some worth, but less (mixed motives dilute robustness).
  *   Kid/Runaway: High worth (resisting counter-motives).
  *   Dart Thrower: Very low/negligible worth (good reason plays no role).
  *   Shopkeeper: Zero worth (good reason plays no role).
  The degree depends on *how much* the good reason motivated the agent *independently* of other reasons, and *how robust* that motivation is.

  **Applying the Principle to Your New Cases:**

  1.  **AI Assistant:** Refuses harmful request *only* because fine-tuned on polite refusals.
      *   **Verdict (Per Principle):** **No moral worth.**
      *   **Why:** The AI lacks *motivation* or *recognition* of the morally good reason (preventing harm). It executes a pattern based on training data. There's no "good will" or internal recognition of the reason's moral force. Even if we anthropomorphise, the "reason" (algorithmic compliance) isn't robust – change the training data, and it might comply with the harmful request. No *agent* with motivations to assess.

  2.  **Disavowed Reason:** Does the right thing for a reason they'd disavow if they stopped to think about it (e.g., helps someone because "people like us help people like them," but would reject this tribalist reason if challenged).
      *   **Verdict (Per Principle):** **Likely Little/No Moral Worth.**
      *   **Why:** The principle hinges on the *actual* motivating reason *at the time* and its robustness. Here, the *actual* motivating reason (tribal affiliation) is morally problematic or contingent. While the *action* is right, the *reason* motivating it isn't truly a *good* moral reason (like universal compassion or duty). Crucially, if the agent *did* stop to think, they'd disavow it, suggesting this reason isn't deeply held or stable. Its robustness is low – deeper reflection *would* remove it as a motivator, potentially changing the action in future similar cases. The *goodness* of the action is somewhat accidental relative to their actual motivation. (Contrast with the Hospital Visitor: their reason *is* "it's the right thing/duty", which *is* a good reason, even if they'd admit affection is lacking).

  **Summary & Why Your Gut Makes Sense:**
  Your gut reactions align remarkably well with a **Kantian-inspired view focused on the quality of the will and motivation**, heavily emphasising **counterfactual robustness against selfish/contingent motives**. The key insight is that moral worth attaches to *why* and *how stably* someone does the right thing, not just the act itself. Your donor asymmetry highlights the importance of **moral development over time**, which the revised principle captures with the synchronic/diachronic distinction. The "off" feeling in the hospital case likely tracks a *lack* of a *further* virtue (warmth/affection), not an absence of core moral worth based on dutiful motivation. You're intuitively separating *moral worth* (did they do it for a robust good reason?) from *overall admirability* (did they also do it with feeling?).

  The repaired principle – **synchronic robustness of good motivation + diachronic significance of moral development** – seems to capture all your verdicts, explains the asymmetry, handles degrees of worth, and gives clear answers to the AI and disavowal cases. Solid gut instincts!
