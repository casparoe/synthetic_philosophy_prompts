  The audience includes virologists, origin-of-life chemists, biosignature specialists, and philosophers of science - each with distinct priorities. The virologists care about lab practice, chemists emphasize metabolism, the biosignature expert wants operational criteria to avoid false positives, and philosophers include a natural kinds realist who might see pluralism as abandoning explanatory depth.

