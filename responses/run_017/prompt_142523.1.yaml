prompt: |-
  I spent a career in experimental physics and have come to decision theory only in retirement, so I may be missing what the field takes for granted; but before I read any more proposed solutions I want to know what I should be demanding of one. The case that stopped me is the Pasadena game. A fair coin is tossed until it first lands heads; if that first heads falls on toss n, the payoff is (−1)^{n−1}·2^n/n dollars — plus 2, minus 2, plus 8/3, minus 4, and so on. Each state has probability 2^{−n}, so summing term by term in the natural order gives the alternating harmonic series, which converges to ln 2, about 0.69. Yet the positive terms alone sum to +∞ and the negative terms alone to −∞, so the ordinary integral is not merely unknown but undefined: the same series can be rearranged to converge to any real number you please, or to diverge outright.

  In physics we had a name for the manoeuvre of extracting a number from such an expression. One introduces a cut-off, isolates a finite part, discards a divergence, and then argues about whether the finite part depends on the cut-off. When it does not, the number is physical; when it does, the honest conclusion is that we were asking a question that has no answer. I would like the analogous discipline stated explicitly here.

  So: write me the specification. What must a rule for evaluating or ranking gambles with undefined expectations deliver in order to count as adequate — the phenomena it must handle, the cases it must get right, the distinctions it must respect, the formal properties it must not violate — with the case or consideration behind each requirement? Take the purpose fixed: the rule should be good enough to guide a one-off choice, to guide the same agent's choices sequentially as uncertainty resolves, and to be usable in policy reasoning where a very small probability gets multiplied by an astronomically large value. Mark each requirement as non-negotiable or as a preference of a particular temperament, and say which single requirement does the most work in excluding candidates you know of.

  Here are the cases I would insist on, including two I have not seen handled. (i) The Pasadena game with one dollar added to every payoff: it weakly dominates, and I take it as a non-negotiable datum that it is preferable. (ii) The same gamble re-presented: lay the states out as intervals on the unit interval in the usual order, then re-lay exactly the same intervals, with exactly the same payoffs attached, in a permuted order — a measure-preserving reshuffling, so the probability distribution of outcomes is unchanged. Summing along the new arrangement of the state space yields any value one likes, say +100, by the rearrangement theorem. Is invariance under such a re-presentation a requirement, or is it a prejudice? It is the requirement I care about most, since it is the analogue of demanding that a physical quantity not depend on the coordinates. (iii) The Pasadena game held together with its mirror image, the gamble that pays the exact negative in every state: the pair is worth precisely zero whatever happens, so any rule with even a shred of additivity is constrained here. (iv) A sequential version: the agent pays about 0.69 to play, the first toss falls tails, and the same procedure applied to the conditional problem now returns about −0.61, since the conditional expectation is 2(ln 2 − 1). Does the rule mandate that the convention used to sum be held fixed across nodes, and what happens to an agent who is free to change conventions as he goes? Relatedly, can a bookie who merely re-describes an agent's own holding, without changing its distribution, extract money from him by cycling descriptions? (v) A compound of the Pasadena game with an independent St Petersburg gamble, where one pathology is conditional convergence and the other is a genuinely infinite integral. (vi) A tiny probability of an enormous good, where I do not want the rule to work simply by declaring utilities bounded, because the boundedness escape seems to me to purchase determinacy by refusing to say what I most want to say about such cases.

  Three further things I would like flagged rather than settled. First, whether the list is itself the result: I suspect that state-relabelling invariance, determinacy of a finite value, weak dominance, and additivity across independent gambles cannot all be had together, and I would like the contradiction located precisely. Second, whether the rule should output a number at all, or only a partial ordering, given that a number invites a price and a price invites a pump. Third, briefly — a paragraph each, no more — how the familiar families fare against the list as you have built it: the response that utility must be bounded so that the case never arises; the response that extends expectation by a privileged summation or principal value; the response that evaluates only differences against a status quo, hoping the difference gamble is integrable; the response that takes dominance as primitive and abandons numerical valuation; and the response that moves to nonstandard or infinitesimal values. I do not need names, dates, or references for any of this.

  Finally, tell me where my cut-off analogy helps and where it misleads. In physics the test was empirical: a regularization that predicted different numbers for the same measurement was wrong, full stop. Here there is no measurement to appeal to, so I want to know what plays the role of that constraint — and whether the absence of it means that the choice among these rules is a choice of temperament rather than a discovery.
reasoning: |-
  Okay, the user is a retired experimental physicist diving into decision theory, particularly troubled by the Pasadena game. They want a rigorous specification for evaluating gambles with undefined expectations, drawing parallels to regularization in physics. Their core concern is how to demand invariance under state-relabelling while satisfying other intuitive principles like weak dominance and additivity.

  First, I need to unpack their non-negotiables. Weak dominance is paramount—adding $1 to every payoff in the Pasadena game must make it strictly better. State-relabelling invariance is their "coordinate independence" principle, crucial for consistency. Additivity constraints (like the mirror-image combo summing to zero) test linearity. Sequential consistency matters for dynamic choices, and handling astronomically large payoffs without bounding utility is essential for realism.

  The tension between these requirements is glaring. State-relabelling invariance clashes with assigning any finite value to the Pasadena game, since reshuffling states can make the sum converge to any real number. Yet weak dominance demands we distinguish the +$1 variant. This contradiction suggests a trilemma: you can't have all three of (1) numerical valuation, (2) relabelling invariance, and (3) dominance/additivity. 

  For their test cases: 
  - The +$1 variant highlights the weakness of privileged summation rules (like Cesàro), which fail dominance by ignoring finite shifts.
  - The mirror-image combo breaks many additive approaches unless they treat the pair as non-additive.
  - Sequential play exposes conventions that aren't node-consistent, inviting money pumps.

  The bounded utility "escape hatch" feels unsatisfying—it dodges the problem rather than solving it. Infinitesimal/nonstandard approaches might work but feel alien. Partial orderings avoid numerical contradictions but sacrifice pricing precision. 

  Their cut-off analogy is astute but limited. In physics, empirical validation resolves ambiguities; here, the "test" is internal consistency of preferences. Without measurements, we're left trading off virtues: robustness vs. expressiveness. The choice becomes temperamental—e.g., whether one prioritizes computability (privileged sums) or coherence (state invariance via dominance-only frameworks).

  Ultimately, I'd stress that no rule satisfies all desiderata. The contradiction lives between relabelling invariance, finite valuation, and dominance. For their purpose—guiding one-off choices and policy—partial dominance-based orders seem safest, though least expressive. If they insist on numbers, privileged summation plus clear caveats might serve, but they'd hate its state-dependence. 

  The physicist's intuition is spot-on: when regularization artifacts persist, the question lacks an answer. Here, the "divergence" is in the axioms themselves.
answer: |-
  Below is a specification for evaluating gambles with undefined expectations, structured to address your requirements and test cases. The framework prioritizes coherence, robustness, and practical applicability for one-off choices, sequential decisions, and policy reasoning. Key tensions are explicitly flagged.

  ---

  ### **Core Requirements**
  1. **Weak Dominance (Non-negotiable)**  
     If gamble *G*′ pays ≥ *G* in every state and > *G* in some state with positive probability, then *G*′ ≻ *G*.  
     *Case*: Pasadena + $1 dominates the original Pasadena game and must be strictly preferred.  
     *Justification*: Fundamental to rational choice; violating it permits self-destructive decisions.

  2. **State-Relabelling Invariance (Non-negotiable)**  
     Gambles must be evaluated identically under measure-preserving rearrangements of the state space.  
     *Case*: If the Pasadena game’s states are permuted to sum to +100, this value must not be taken seriously.  
     *Justification*: Analogous to coordinate independence in physics; prevents arbitrage via redescription.

  3. **Additivity for Independent Gambles (Negotiable, but Highly Desirable)**  
     If *G* and *H* are independent, the value of *G* ⊕ *H* should ideally satisfy *V*(*G* ⊕ *H*) = *V*(*G*) + *V*(*H*).  
     *Case*: Pasadena ⊕ Mirror-Pasadena should have value 0, as their net payoff is identically zero.  
     *Tension*: Conflicts with state-relabelling if *G* has undefined expectation.

  4. **Sequential Consistency (Non-negotiable)**  
     Evaluation must be consistent across subtrees (no money pumps). If a rule assigns value *V* pre-resolution, the conditional value at any node must align with *V*’s updating.  
     *Case*: After first tails, the Pasadena conditional expectation is negative; an agent must not regret paying ~0.69 upfront.  
     *Justification*: Prevents dynamic inconsistency and exploitation.

  5. **Robustness to Large Payoffs (Non-negotiable)**  
     Must handle unbounded utilities (e.g., St. Petersburg variants).  
     *Case*: Policies involving tiny probabilities of existential stakes (e.g., asteroid deflection) require meaningful comparison.  
     *Justification*: Bounded utility is empirically inadequate for extreme risks.

  6. **Determinacy (Preference)**  
     Outputs a real number or extended real (±∞) where possible.  
     *Rationale*: Enables pricing and policy tradeoffs. Partial orderings are less actionable.

  ---

  ### **The Central Contradiction**  
  **State-relabelling invariance + weak dominance + finite determinacy → Contradiction**.  
  - Pasadena + $1 dominates Pasadena (dominance).  
  - State-relabelling forces any evaluation rule to ignore presentation order.  
  - But finite valuation via summation is presentation-dependent (rearrangement theorem).  
  - *Resolution*: Sacrifice finite determinacy or strict additivity. No rule satisfies all three simultaneously.

  ---

  ### **Evaluation of Familiar Approaches**  
  | **Approach**               | **Performance Against Requirements**                                                                 | **Key Failure**                                  |  
  |----------------------------|------------------------------------------------------------------------------------------------------|-------------------------------------------------|  
  | **Bounded Utility**        | Avoids pathologies but violates *Robustness*. Bounds are arbitrary; fails astronomic-stakes cases.   | Rejects meaningful policy questions (vi).       |  
  | **Privileged Summation**   | Assigns ln(2) to Pasadena. Fails *State-Relabelling*: permuted states yield +100. Fails *Dominance*: Pasadena + $1 not distinguished. | Artifact of presentation; non-robust.           |  
  | **Difference Gambling**    | Evaluates Δ from status quo. Fails *Additivity*: Pasadena ⊕ Mirror ≠ 0. Fails *Sequential Consistency* at non-root nodes. | Incoherent in dynamic choice (iv).              |  
  | **Dominance-Only Ordering**| Satisfies *Dominance*, *State-Relabelling*, *Robustness*. Outputs partial order. Fails *Determinacy* and pricing needs. | Too weak for policy tradeoffs (vi).             |  
  | **Nonstandard Analysis**   | Assigns hyperreal values. Satisfies *Additivity* and *Determinacy*. Fails *State-Relabelling*: values depend on summation convention. | Unphysical; no unique embedding (ii).           |

  ---

  ### **The Cut-Off Analogy: Where It Helps and Misleads**  
  **Helps**:  
  - Identifies **conditionally convergent** integrals (e.g., Pasadena) as artifacts of regularization.  
  - Highlights that a finite answer is only "physical" if **cutoff-independent**.  
  - Warns against mistaking a summation artifact (e.g., ln(2)) for a true value.  

  **Misleads**:  
  - Physics has **empirical validation** to resolve ambiguities (e.g., Lamb shift). Decision theory lacks this.  
  - In physics, cutoffs are **extraneous** (e.g., renormalization scale); in decision theory, the state space is **intrinsic**. Relabelling is a symmetry of the problem, not a technical nuisance.  
  - The absence of empirical feedback turns the choice into one of **temperament**:  
    - Prefer **computability**? → Privileged summation (sacrifices invariance).  
    - Prefer **coherence**? → Dominance partial order (sacrifices pricing).  
    - Prefer **expressiveness**? → Hyperreals (sacrifices uniqueness).  

  ---

  ### **Recommended Approach**  
  A **state-relabelling-invariant dominance partial order** satisfies non-negotiables but is incomplete. For policy:  
  1. Adopt a **finitely additive prior** over state presentations, or  
  2. Use **lexical dominance**: Compare gambles by:  
     - Stochastic dominance in tail events,  
     - Then by a privileged sum (e.g., Cesàro) if comparable.  
  *Why*: Balances robustness with actionability. Sequential choices remain pump-proof.  

  **Key Tradeoff**: No numerical rule respects all symmetries. The contradiction is inescapable; choose which virtue to prioritize. For your physics-trained instincts: **State-relabelling is the Lorentz invariance of decision theory. Violate it only with caution.**
