  Okay, let me try to unpack this user's question. They're a backend engineer who's encountered this weird situation multiple times—standards committee, open-source funding, school board. In each case, both sides privately agree on a solution but can't publicly admit it's good. Instead, each needs to frame it as a loss to their own group. 

  Hmm, the open-source example is clearest. Objectors didn't want surveillance money tainting their project; funders needed financial support. The compromise? Take the money but bury it in general funds + let objectors record dissent. But crucially: objectors had to call it a defeat, and funders had to act like they'd sacrificed something. If anyone said "hey this actually works for both," chaos ensued. 

  What's fascinating is why this works: each side's real concern was narrower than their stated principle. Objectors cared about visible endorsement (not money existing), funders cared about cash (not logos). But their constituencies enforced the broad principles, so admitting the narrower truth publicly would break everything. 

  User wants to know: is there a concept for this? Not just a label—they want careful boundaries. Which elements are essential? The performative loss? The secrecy of true motives? The principle/concern mismatch? 

  I'm mentally scanning political theory/econ/game theory... 
  - Face-saving is adjacent but too individual. 
  - Compromise misses the performative sacrifice angle. 
  - Hypocrisy is too moralistic. 
  - Coase theorem? Nope, that assumes transaction costs are the problem. 

  Wait—this feels like "preference falsification" meets "audience costs." Timur Kuran's work on how people hide true preferences to avoid social punishment. And audience cost theory (James Fearon) about leaders paying penalties for backing down. But neither fully captures the mutual performative sacrifice. 

  Also, Schelling's idea of "conflict ritual" comes close—ritualized fights where the outcome matters less than the ceremony of opposition. But still not quite. 

  Maybe the core is: mutual sacrifice theater required by polarized constituencies. Remove any element—the audience, the secrecy, the principle mismatch—and it collapses. If constituents overlap (see each other's blogs), the illusion shatters. If one side genuinely prefers the compromise, the performance fails. 

  User also asks where it breaks: 
  - If both sides are honest with constituents? Probably fails—constituents would revolt. 
  - If constituencies overlap? Definitely fails (as in the blog incident). 
  - If concessions are invisible? Might work, since no one checks. 

  Nearest misses: 
  - Kabuki theater: dismissive, misses strategic depth. 
  - Noble lie: implies deception for public good, but here it's for deal stability. 
  - Cheap talk: not about signaling credibility. 

  So no perfect term exists. Best I can offer: "performative sacrifice equilibrium." Defining traits: 
  1) Requires polarized audiences enforcing broad principles 
  2) True motives are narrower but must stay hidden 
  3) Mutual (but asymmetric) theater of loss 
  4) Collapses if the illusion is exposed 

  User's "Pareto improvement that dissolves when you point at it" is poetically accurate. Adding "performative sacrifice" makes it sound less cute and more structural. 

  Should emphasize: this isn't about bad faith. It's a coordination problem where revealing coordination destroys the solution. Like quantum entanglement—measuring it changes the state.
answer: |-
  This phenomenon is both fascinating and under-theorized, but it intersects with several established concepts. The closest fit is **Preference Falsification Under Mutual Audience Costs**, with elements of **Conflict Ritual** and **Coordination Traps**. Below is a systematic breakdown:

  ---

  ### **Core Definition**  
  **Performative Sacrifice Equilibrium**  
  *Definition*: A stable outcome in polarized negotiations where:  
  1. Both parties privately prefer a compromise to the status quo.  
  2. Each must publicly frame the outcome as a **loss** to maintain credibility with their constituents.  
  3. The true rationale for acceptance (narrower interests overriding broad principles) cannot be publicly disclosed without destabilizing the agreement.  
  4. The compromise depends on **mutual performance of concession**—each side must visibly "suffer" to satisfy their audience.  

  *Key Mechanism*: Constituents enforce adherence to **symbolic principles** (e.g., "no collaboration with surveillance firms"), while negotiators care about **tangible interests** (e.g., funding without endorsement). Publicly narrowing the principle exposes negotiators as "selling out," destroying the performative loss required for legitimacy.

  ---

  ### **Essential Ingredients**  
  Remove any of these, and the phenomenon collapses:  
  1. **Polarized Constituencies**: Audiences hold rigid, divergent principles.  
  2. **Audience Costs**: Negotiators face penalties (e.g., loss of trust, status) if seen as conceding without a fight.  
  3. **Principle-Interest Mismatch**: Negotiators' true interests are narrower than their publicly stated principles.  
  4. **Mutual Performative Sacrifice**: Both sides must credibly demonstrate "loss" to their audience.  

  ---

  ### **Boundary Conditions**  
  | Scenario                          | Does the Phenomenon Survive? | Why |  
  |-----------------------------------|-------------------------------|-----|  
  | Both sides honest with constituents | ❌ No | Honesty reveals the narrower interest, violating the principle-ritual. Constituents punish "hypocrisy." |  
  | Constituencies overlap (read blogs) | ❌ No | Audiences see through the performance ("Why did they accept if they lost?"). Illusion collapses. |  
  | One side genuinely prefers the middle | ⚠️ Partially | Only if they can still perform sacrifice. If constituents detect genuine satisfaction, legitimacy erodes. |  
  | Concessions never checked          | ✅ Yes | Performative loss only requires *appearance* of sacrifice. No verification needed. |  
  | Direct communication between constituencies | ❌ No | Eliminates information asymmetry, exposing the coordinated performance. |  

  ---

  ### **Why Near-Miss Concepts Fail**  
  - **Compromise**: Assumes mutual gain is *acknowledged*. Here, gain must be disguised as loss.  
  - **Saving Face**: Focuses on individual dignity, not *mutual* performance of sacrifice for audience costs.  
  - **Hypocrisy**: Implies bad faith. Here, negotiators *sincerely* prefer the outcome but are constrained by audience.  
  - **Kabuki Theater**: Dismissive; ignores the *strategic necessity* and Pareto improvement.  
  - **Coase Theorem**: Assumes costless bargaining. Here, "transaction costs" include audience-driven performance.  

  ---

  ### **Nearest Theoretical Anchors**  
  1. **Preference Falsification** (Timur Kuran):  
     - People hide true preferences to avoid social sanctions.  
     - *Difference*: Here, falsification is *mutually necessary* for stability.  
  2. **Audience Costs** (James Fearon):  
     - Leaders punished for backing down from public threats.  
     - *Difference*: Costs are *symmetrical* and enable (rather than deter) agreement.  
  3. **Schelling Points** (Thomas Schelling):  
     - Focal solutions requiring coordination.  
     - *Difference*: This is a *deliberately obscured* focal point.  

  ---

  ### **Practical Diagnosis Flowchart**  
  To identify this in future cases, ask:  
  1. **Is there a compromise both privately prefer?** → If no, not this.  
  2. **Must they publicly frame it as a loss?** → If no, ordinary compromise.  
  3. **Would admitting the true rationale collapse support?** → If no, misaligned incentives.  
  4. **Is performative sacrifice needed for credibility?** → If yes, **Performative Sacrifice Equilibrium**.  

  ---

  ### **Why This Emerges in Tech/Governance**  
  - **High-Stakes Symbolism**: Principles (e.g., "ethical purity") become tribal markers.  
  - **Decentralized Accountability**: Maintainers/board members answer to fragmented audiences.  
  - **Low Trust**: Constituents assume "win-win" implies betrayal of principles.  

  This isn’t dysfunction—it’s a **second-best solution** when ideals and incentives collide. Naming it won’t resolve the tension, but recognizing the pattern can prevent accidental unraveling (e.g., by silencing colleagues who say "everyone won"). The stability lies in the dance, not the deal.
