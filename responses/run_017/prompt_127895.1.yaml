prompt: |-
  I cover science and ideas for a newspaper, and I've been unable to stop thinking about an argument I overheard at a dinner after a conference on medical prediction. Names and details below are changed, and the company is one I'll call Corvid Health, since the specifics aren't what I want adjudicated.

  Corvid markets a prognostic engine for cardiology. Its selling point concerns what philosophers call the reference class problem: the risk figure for a particular patient depends on which set of past patients you compare her to, and the data don't select a set for you. Corvid's answer is what it calls "interval honesty." For any patient the engine scans every reference class that (a) contains the patient, (b) is defined using at most four of the available clinical variables, and (c) contains at least 250 historical patients, and it reports the lowest and highest risk across those classes. For one patient at the centre of the dinner conversation — a woman in her early sixties with a moderately uncommon genotype — it returned 8 per cent to 41 per cent five-year risk. Her insurer's rule is to fund the procedure above 30 per cent, and it denied coverage on the strength of the top of the interval. Her cardiologist objected, and the two people at my end of the table took it from there.

  (1) He said the interval is not candour but laundering. Reference classes are partially ordered, not ranked along one dimension, so "every admissible class" is not a determinate set: whether age is recorded in years or months, how finely diagnoses are coded, which labs happen to be stored, all change the endpoints. And because classes get thinner as you add variables, loosening the four-variable cap inflates the interval toward zero and one. The 250-patient floor and the cap are administrative conventions dressed up as epistemology.

  (2) She replied that he was litigating metaphysics when the live question is decision. For a threshold decision what you need is a score that is calibrated — that when it says 20 per cent, about a fifth of such patients have the event — and calibration is checkable, and there are now training procedures that aim for calibration simultaneously within every subgroup an auditor can define, so overlapping classes are no longer in tension. The demand that there be one true probability for this individual, she said, is an artifact of a frequentist picture in which probabilities just are frequencies in a class.

  (3) He answered that calibration is itself relative to a chosen family of classes, so the problem relocates rather than dissolves. A predictor that assigns every patient the base rate for her group is perfectly calibrated within that group and tells you nothing about her. Worse, two predictors can both pass every calibration check an auditor happens to run and still assign this patient different numbers; nothing in the calibration criterion picks between them.

  (4) She conceded that calibration is necessary and not sufficient, but said that is exactly why it is paired with requirements that the score extract all the available signal, and — more to the point — that the insurer's misuse is not a failure of probability theory at all. The abuse is that the payer was allowed to choose the convenient endpoint after seeing it. A decision rule has to be fixed in advance, and a wide interval should trigger collecting more information about this patient, not authorise whichever bound is cheaper.

  (5) He then widened the frame: there is a version of the problem where narrowing cannot save you, because the individual is yourself and the candidate classes are things like all humans, all humans alive this century, or all agents in technologically developed civilisations. There you cannot inspect the class from outside, and the choice of class changes the answer qualitatively rather than trading bias against variance. He said this is the same disease.

  (6) She said it is a different disease: there the difficulty is indexical — which observers get to count as evidence — and importing it into an actuarial tool is a category error. Even so, its remedy has the same shape as the clinical one: state the class explicitly and test how much the conclusion depends on it. He shot back that "be explicit and run a sensitivity analysis" is laboratory hygiene, not a solution, and that Corvid's product is deceptive in both directions: a single number hides the choice, while the interval hides it behind spurious precision about its own endpoints.

  I said nothing at the time because I couldn't sort it out. Please adjudicate move by move: for each of the six numbered moves, say whether it is clearly right, partly right, or wrong, and why, flagging any move that rests on a claim that is simply false. Then say who is more right overall, and what both of them are missing. In particular I'd like your view on whether calibration-based criteria really do dissolve the reference class problem or merely relocate it, and on whether there is a principled answer — as opposed to a regulatory one — to what a clinician ought to be told about a patient when the admissible reference classes disagree.
reasoning: |-
  Okay, I need to unpack this dense philosophical debate about medical prediction and reference classes. The user is a science journalist who witnessed this argument at a conference dinner and wants it dissected move by move. 

  First, let's understand the core tension: Corvid Health's "interval honesty" approach versus traditional single-point risk scores. The interval method seems transparent but might be mathematically dubious, while calibration-focused approaches claim to solve the reference class problem but may just relocate it.

  Hmm, the man's opening salvo (Move 1) feels technically sound - he's right that "every admissible class" is nebulous when data granularity and variable caps are arbitrary. But the woman counters well in Move 2 by shifting to practical decision-making. Her calibration argument is strong clinically, though she might oversell it as solving the philosophical problem.

  Move 3 is where it gets spicy. His calibration relativity point lands - I recall that perfectly calibrated models can still be uninformative if they just regurgitate group averages. But she pivots smartly in Move 4 to the real villain: the insurer cherry-picking the 41% endpoint. That's a policy failure masquerading as statistical debate.

  The cosmic leap in Move 5 feels like rhetorical overreach though. Comparing clinical risk assessment to existential probability puzzles is apples-to-oranges. Her category error rebuttal in Move 6 holds water - sensitivity analysis is imperfect but pragmatically valid.

  What's missing overall? Neither addressed how to handle patients who fall between reference classes. And the insurer's behavior exposes a system flaw: wide intervals should trigger deeper investigation, not coverage denial. The calibration debate is important, but the real scandal is using statistics as a cost-cutting weapon.

  For the journalist's key questions: Calibration relocates rather than solves the reference class problem. And the principled answer is that clinicians need the full distribution - not just endpoints - plus guidance on when uncertainty demands additional testing.
answer: |-
  Here's a move-by-move adjudication of the debate, followed by an overall assessment and answers to your core questions:

  ### Move-by-Move Adjudication
  1.  **He said the interval is not candour but laundering...**  
      **Verdict: Partly right (leaning toward clearly right).**  
      His core critique is valid: The interval endpoints *are* sensitive to arbitrary implementation choices (variable coding, granularity, storage practices). The "4-variable cap" and "250-patient floor" are indeed administrative conventions without deep epistemological justification. However, he slightly overstates the case. While the *exact* set of admissible classes isn't uniquely determined, the *approach* (scanning reasonable, data-supported classes) is a meaningful attempt at transparency. The "laundering" charge is strong but highlights a real weakness: the interval gives a false impression of objective boundaries.

  2.  **She replied that he was litigating metaphysics...**  
      **Verdict: Partly right.**  
      She correctly shifts focus to decision-making and highlights the practical importance of *calibration*. Her point about modern calibration techniques aiming for subgroup calibration is valid and addresses a key practical concern. However, she **misstates a key point**: Calibration *does not* dissolve the tension from overlapping reference classes. A model can be well-calibrated *on average* within many overlapping subgroups *without* resolving the fundamental question of *which subgroup's calibration is most relevant for this specific patient*. Her dismissal of "one true probability" is philosophically sound (frequentist limitations), but doesn't negate the practical problem of choosing the best reference class for prediction.

  3.  **He answered that calibration is itself relative...**  
      **Verdict: Clearly right.**  
      This is a crucial and accurate rebuttal. Calibration is always assessed *relative to a chosen grouping*. A model perfectly calibrated for "all females 60-70" might be poorly calibrated for "females 60-70 with genotype X". His example of the base-rate predictor is devastating: perfect calibration within a broad group provides no *individual* discrimination. His final point about two well-calibrated models assigning different risks to the same individual is correct and exposes the core limitation: calibration is necessary for reliability, but insufficient for individualized precision and doesn't solve the reference class choice.

  4.  **She conceded that calibration is necessary and not sufficient...**  
      **Verdict: Clearly right (on the misuse), Partly right (on the solution).**  
      She correctly identifies the **critical failure**: the insurer cherry-picking the convenient endpoint (41%) *after* seeing the interval. This is indeed an abuse of the information. Her prescription is sound in principle: decision rules (like "fund if risk >30%") *must* be defined *before* the risk assessment method is applied or its result seen. Her point that a wide interval *should* trigger more data collection is excellent clinical practice. However, this doesn't fully address *how* a clinician should interpret the conflicting information *now* when more data might be unavailable or impractical.

  5. **He then widened the frame...**  
      **Verdict: Partly right (insightful analogy) but Mostly Wrong (as applied).**  
      The "cosmic" reference class problem (self-location, indexical uncertainty) is a fascinating *analogy* illustrating deep philosophical issues in probability. However, claiming it's the "same disease" is a **category error**. The clinical problem involves abundant, structured, *external* data from a population. The cosmic problem involves profound uncertainty about the nature of the observer and the relevant population *itself*. While both involve reference class ambiguity, the clinical context allows for empirical investigation, data collection, and statistical testing in ways the cosmic problem fundamentally does not. Importing this is unhelpful for the practical medical decision.

  6. **She said it is a different disease... He shot back...**  
      **Verdict: She is Clearly Right (on category error); He is Partly Right (on limitations of sensitivity analysis).**  
      She correctly identifies the category error in his cosmic analogy. "Be explicit and run sensitivity analysis" *is* the appropriate, practical response in the clinical/actuarial context – it *is* laboratory/statistical hygiene and the best available tool. His critique that Corvid's product is deceptive has merit: a single number hides uncertainty, while an interval with arbitrary bounds gives a *false sense of precisely quantified uncertainty*. However, calling sensitivity analysis "not a solution" is too harsh; it *is* the principled way to handle model uncertainty, even if imperfect.

  ### Overall Assessment
  *   **Who is more right overall?** **She is more right on the practical, clinical, and decision-theoretic aspects.** She correctly focuses on the requirements for sound decision-making (pre-specified rules, calibration, triggering further inquiry) and identifies the insurer's action as the primary abuse. Her approach is grounded in the realities of medical prediction and modern statistical learning.
  *   **He is more right on the deep philosophical and technical statistical limitations.** He correctly exposes the inherent ambiguity in defining reference classes and the insufficiency of calibration alone. His critique of the arbitrary bounds of Corvid's interval is valid.

  ### What Both Are Missing
  1.  **The Need for Full Distributional Information:** Both focus on endpoints (single number or interval). A more informative approach might be to show the *distribution* of risk estimates across reasonable reference classes (e.g., a histogram), conveying the density and central tendency, not just min/max. This better represents the uncertainty structure.
  2.  **Loss Functions & Decision Theory:** The debate centers on *estimating risk*, but the *impact of being wrong* (loss function) is crucial for decisions. A principled approach integrates the risk estimate *and* the consequences of action/inaction under uncertainty into the decision rule itself (e.g., expected utility maximization). Neither explicitly connects the risk assessment to a formal decision framework incorporating costs/benefits.
  3.  **Causal Structure:** Reference classes defined purely by correlates (even predictive ones) can be misleading. Incorporating causal knowledge (where possible) about *why* variables predict risk could lead to more stable, meaningful reference classes. Both discuss associations, not causation.
  4.  **Regulatory vs. Principled Solution Tension:** The core issue involves a tension between principled epistemology (there *is* no single perfect reference class) and regulatory necessity (we *must* make a coverage decision). Neither fully grapples with how to bridge this gap systematically.

  ### Answers to Your Specific Questions
  1.  **Does calibration dissolve or merely relocate the reference class problem?**  
      **Calibration merely relocates (or reframes) it, it does not dissolve it.** As He correctly argued (Move 3), calibration is always relative to a chosen grouping or family of groupings. Achieving good calibration across many subgroups is valuable for reliability, but it doesn't tell you *which subgroup's calibration is most relevant for individualizing the prediction for *this* patient. The fundamental challenge of selecting the most appropriate reference level of granularity persists. Calibration ensures the number means what it says *for a group*, but choosing *which group* remains the core reference class problem.

  2.  **Is there a principled answer for what a clinician should be told?**  
      **Yes, a principled answer exists, but it's nuanced and involves conveying uncertainty explicitly:**  
      *   **Principled Core:** The clinician should be told that the patient's risk is uncertain and depends on how similar historical patients are defined. The *variability* across reasonable definitions is a crucial part of the patient's risk profile, not noise to be eliminated.
      *   **Best Practice Communication:**
          *   **Report a Central Estimate & Dispersion:** Provide a central tendency (e.g., median risk across plausible classes) *along with* a measure of dispersion (e.g., interquartile range, 5th-95th percentile range of estimates) – more informative than just min/max.
          *   **Highlight Key Drivers:** Identify which variables or definitions cause the largest swings in risk. This tells the clinician *why* the uncertainty exists and what factors matter most.
          *   **State the Implications:** Explicitly state that this degree of uncertainty **should trigger**:
              *   Discussion with the patient about the uncertainty itself.
              *   Consideration of gathering additional patient-specific information (e.g., more detailed tests, family history).
              *   Consideration of factors beyond pure risk percentage in the decision (patient values, preferences, overall health).
      *   **This is principled because:** It honestly reflects the epistemological state (inherent uncertainty due to reference class ambiguity), provides actionable information (central estimate, dispersion, key drivers), and directs next steps (shared decision-making, potential for more information gathering). It avoids the false precision of a single number and the deceptive pseudo-precision of an arbitrary min/max interval.

  In essence, the reference class problem is an inherent limitation of frequentist probability applied to individuals. Calibration improves reliability within groups but doesn't solve the grouping choice. The principled response is transparency about the uncertainty and its sources, coupled with a decision-making process that incorporates this uncertainty and its consequences. Corvid's interval is a flawed attempt at transparency, the insurer's use of it was abusive, and the solution lies in better communication of uncertainty and robust, pre-defined decision rules.
