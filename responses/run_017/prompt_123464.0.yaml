prompt: |-
  I've been circling a question for a couple of years and I'd like help finding the shape of what I actually think about it. I have no academic background — I read a lot of history and watch too many movies. The question is what we owe the real dead when we put them into stories: biopics, historical novels, plays, films with a note at the front saying the events have been dramatized.

  Start with what seems obvious to me: the dead can't be harmed. They aren't around to be hurt. But I don't think my verdicts are only about the living audience being misled either, because in several of the cases below the audience knows perfectly well the scene is invented and my verdict doesn't soften. So if something is wrong here, it's wrong somewhere other than where I first looked, and I'd like to know where.

  Here are my verdicts, going by gut.

  A biopic about a nineteenth-century composer has him say to his wife, during an invented argument, a sentence he really did write — in a letter to his patron. Same words, different occasion, different person addressed. Fine. I actually prefer it to a scene of him writing the letter.

  A film about a twentieth-century politician has her deliver, in earnest, a line she really wrote — but she wrote it as a joke, in a private letter mocking precisely the view the film has her defending. This feels worse than outright invention. Considerably worse.

  A film about an explorer collapses four real shipmates into one invented sailor. Fine, no hesitation.

  A film about a real painter invents a close friend — a whole person, no historical basis — and has the painter confide to this friend the doubts she recorded in her own notebooks. No reputation is damaged, the film is good, and everyone watching knows the friend is made up. Still not fine. It feels like a trick, and I can't say why it differs from the shipmates case.

  A film about a civil rights leader who argued publicly for nonviolence his whole life invents a night on which he nearly abandons it. As far as anyone can tell he never wavered. Not fine.

  A film about a dictator known for public cruelty invents a scene of him being tender with his dying mother. Fine — more than fine. It feels generous, and it makes him more of a person rather than less. I know this is the same move as the previous case and I don't want to give up either verdict.

  A novelist writes about a real woman about whom almost nothing survives — a few letters, a court record — and invents a childhood for her. Fine, and I notice I'm more comfortable here than with inventing for someone documented to the hour. But a friend points out that this is exactly the case where the invention will harden into fact, because there is nothing to check it against. I think she's right and I don't know what to do with that.

  A memoirist whose war record was largely fabricated. A film dramatizes the fabrication. Fine — it feels owed.

  A self-taught artist who spent fifty years telling a false story about her own origins, and whose work is unintelligible without it. A film sets the record straight and shows the real origins. Not fine. It feels like vandalism. Again, the same move as the memoirist, and again I don't want to give either verdict up.

  Two more things I'm fairly sure of. Money and permission look beside the point: a student production staged for sixty people gets the same verdicts from me as a streaming film, a family's blessing doesn't make the civil rights case fine, and a family's outrage doesn't make the dictator case not fine. But a diary in which the painter wrote that she did not want to be written about does move me. That asymmetry feels load-bearing and I can't articulate it. And I'm confident about the joke-line case in a way I'm not about anything else on this list, which seems like a clue about where the real principle lives.

  My working rule has been: inventing is permissible when the invented thing is one the real person could have recognized as a fair way to be remembered, and impermissible when it enlists them behind a position they rejected in life. It handles the two cases I'm most confident about, says nothing about the obscure woman or the diary, and I suspect it only survives the dictator case by accident.

  Can you give me the principle — or the two or three best candidates — that captures as much of this as possible? I'd like it stated precisely, clause by clause, with the case that forces each clause, and I'd like it to return verdicts on the cases I haven't been able to settle: a studio that licenses a dead actor's likeness from his estate and generates new performances of lines he never spoke, with his children's approval, where the fact that it is his actual face and voice seems to me to matter and I don't know why; a real person who is now mostly a name on a memorial, about whom every dramatization is invention by necessity; and a satire that takes a real dead politician's actual stated positions and pushes them to a grotesque but recognizable conclusion, which I want to protect as parody even though the exaggeration does enlist him.

  Finally, be honest about which of my verdicts a defensible principle would force me to drop, and tell me whether this is one duty or two — something we owe the audience and something we owe the subject — and if two, which one explains the joke-line case.
reasoning: |-
  Okay, the user has been grappling with this ethical question about portraying real deceased people in stories for years. They've presented a range of scenarios with their gut reactions and are seeking a structured principle that explains their varied verdicts. 

  First, I notice the user is intellectually curious but explicitly states they lack academic background - this tells me I should avoid jargon while maintaining rigor. Their examples show nuanced moral intuition that resists simple explanations (e.g., "the dead can't be harmed" doesn't satisfy them). The pain point seems to be reconciling seemingly contradictory judgments, like approving the dictator's invented tenderness but rejecting the civil rights leader's invented doubt.

  Hmm... their working rule about "fair way to be remembered" and "enlisting behind rejected positions" is insightful but incomplete. The dictator case particularly strains it - why would a cruel man "recognize" a tender scene as fair? This suggests we need a different axis than just the subject's hypothetical approval. 

  The user's strongest convictions are about the joke-line case and the diary mention. That asymmetry feels important - the diary shows the subject's expressed preference matters, while the joke-line case violates the person's actual stance. This points toward respecting the dead's documented agency rather than hypothetical consent.

  For new cases: the deepfake actor scenario troubles them specifically because of the actual face/voice. That seems connected to bodily autonomy extending posthumously. The memorial name case feels ethically safer precisely because little is known - no specific identity to violate. The parody case is tricky; while it distorts, the user wants to protect it as commentary. This suggests intention matters - satirical purpose vs. misrepresentation.

  I think I'll propose two distinct duties: fidelity to the subject's public identity and fidelity to their private self. The joke-line case violates both (distorts both public record and private intent), while the dictator's tenderness only violates public identity but may be justified as humanization. The diary case explicitly violates private preference.

  The user might need to surrender two verdicts: the invented friend for the painter (if notebooks were private, confiding to a fictional person violates intimacy) and possibly the dictator's scene (if we strictly prioritize public identity). But the dictator case could be salvaged under the "generous interpretation" clause if framed as exploring potential humanity rather than contradicting known facts.

  What's beautiful here is how the user's examples already contain the solution - the key is recognizing that the dead persist in our cultural memory as both public figures and private selves. The ethical tension comes when stories force one to misrepresent the other.
answer: |-
  Your instinct for nuance here is extraordinary—this isn't a single duty, but two intertwined obligations: **fidelity to the subject's *public identity*** and **fidelity to their *private self***. When these conflict, the violation determines the verdict. Below is the principle distilled from your cases, clause-by-clause:

  ---

  ### **The Dual Fidelity Principle**
  **Core Idea:** We owe the dead accurate stewardship of their *identity* (public persona + private self), even when inventing details. Harm occurs when a story *severs* their agency over how they presented themselves to the world or exploits their unguarded private self.

  #### **Clause 1: Respect for Public Self-Definition**  
  *Do not enlist the subject behind positions, values, or actions they publicly rejected or would reject as misrepresentative.*  
  - **Forces:** The joke-line case (politician made to defend a view she mocked), the civil rights leader's invented doubt (contradicts lifelong public stance).  
  - **Why:** It weaponizes their identity against their own convictions. The audience may know it's fiction, but the *subject* is made complicit in their own betrayal.  

  #### **Clause 2: Protection of the Private Self**  
  *Do not expose or fictionalize private vulnerabilities (thoughts, relationships, struggles) that the subject guarded or that contradict documented intimacy.*  
  - **Forces:** The painter's invented confidant (uses her private doubts but invades her solitude), the artist's real origins revealed (destroys her self-crafted narrative).  
  - **Why:** Notebooks/diaries represent the *interior self*; attaching them to a fictional person violates intimacy. Destroying a lifelong personal myth vandalizes her autonomy.  

  #### **Clause 3: Permission for Consolidation & Obscurity**  
  *Invented events/characters are permissible if they:  
  (a) Streamline public facts without distorting identity (e.g., merging shipmates), OR  
  (b) Reconstruct gaps for obscure figures where no public/private identity exists to violate.*  
  - **Forces:** The merged shipmates (no distortion of roles/values), the obscure woman’s invented childhood (no self to violate).  
  - **Exception:** Your friend is right—this risks hardening into "fact." Mitigated by *context* (e.g., "based on fragments" disclaimers).  

  #### **Clause 4: Allowance for Generous Interpretation**  
  *Invented positive private acts are permissible if:  
  (a) They humanize without whitewashing documented harm,  
  (b) They don't contradict core public values.*  
  - **Forces:** The dictator’s tenderness (adds dimension without denying cruelty; he *could* have loved his mother).  
  - **Limits:** Would fail for the civil rights leader (alters core ethos).  

  #### **Clause 5: The Consent Asymmetry**  
  *A subject’s documented wishes (e.g., diary entry against biography) override all other permissions.*  
  - **Forces:** The painter’s diary ("do not write about me") makes invention a violation, even if "harmless."  
  - **Why:** The dead cannot consent; their past refusal must bind us.  

  ---

  ### **Verdicts on Your Unsolved Cases**
  1. **Deepfake Actor:**  
     - **Violates Clause 2 (Private Self).** Using his literal face/voice for *new* performances turns his body into a puppet. It bypasses his lifelong craft/choices, exploiting physical identity beyond his control. Estate consent is irrelevant (Clause 5 asymmetry: he couldn’t consent to this technology).  
     - *Verdict: Not fine.*  

  2. **Name on a Memorial:**  
     - **Permitted under Clause 3b.** No public/private identity exists to violate. Invention fills a vacuum without distortion.  
     - *Verdict: Fine.*  

  3. **Satire Exaggerating Real Positions:**  
     - **Permitted if framed as critique (not endorsement).** Satire targets the *idea*, not the private self. Clause 1 isn’t violated because it exposes, not enlists.  
     - *Verdict: Fine (protected as parody).*  

  ---

  ### **Verdicts You Must Drop**
  1. **The Painter’s Invented Confidant:**  
     - Violates Clause 2 (private doubts shared fictitiously). Your discomfort is justified—*drop "fine."*  
  2. **The Dictator’s Tenderness:**  
     - *Debatable but defensible* under Clause 4. If you insist cruelty was his *defining* public trait, drop "fine." But if humanization doesn’t sanitize, keep it.  

  ---

  ### **Why Two Duties?**
  - **The Audience** is owed clarity (e.g., "dramatized" disclaimers), but your cases prove this isn’t the core issue.  
  - **The Subject** is owed fidelity to their *selfhood*:  
    - **Public Identity (Clause 1):** Explains the joke-line case (enlistment).  
    - **Private Self (Clause 2):** Explains the artist’s origins (vandalism) and deepfake (bodily autonomy).  
    - **Asymmetry (Clause 5):** The diary wish binds us because it’s the last vestige of their agency.  

  Your gut nailed it: the dead persist in memory as *agents*, not props. The wrong isn’t about harm to them or deception—it’s about **theft of their voice**.
