answer: |-
  ### Proposal: Structural Realism and the Inarticulate Structure—A Retrospective Test Using Machine Learning  

  #### **1. Precise Research Question**  
  Can a structure-finding procedure, applied exclusively to pre-theory-change data, reliably recover the *specific structural components* that were retained (rather than discarded) in subsequent scientific theories? This question demands a determinate yes/no answer: either the procedure identifies retained structures systematically above chance, or it does not. The answer tests structural realism’s core continuity claim—that theory change preserves structure—by assessing whether continuity is a real, prospective feature of scientific practice or a retrospective rationalization.  

  #### **2. Why Existing Debates Leave This Open**  
  Structural realism (SR) argues that scientific theories preserve structure across theory changes, but debates focus on *formally articulated* structures (e.g., equations in physics). Both moderate (epistemic) and stronger (ontic) SR variants assume structures are explicitly statable, leaving two gaps:  
  - **Moderate SR** (structure is knowable, but not underlying entities) cannot address whether *inarticulate* structures (e.g., machine-learned parameter configurations) bear continuity, as they are neither "known" nor formalized.  
  - **Strong SR** (structure is all that exists) struggles to explain how continuity applies to structures that cannot be "stated" in any formalism, only approximated through algorithms.  

  *Why alternative approaches miss the point*:  
  - **Scientific discovery frameworks** focus on *how* structures are found, not whether continuity is prospective or retrospective.  
  - **Machine understanding debates** ask whether models "grasp" meaning, but this project tests a meta-scientific claim (structural continuity) by treating models as tools for *revealing biases in historical narratives*.  

  This project uniquely interrogates SR’s empirical basis: if continuity is inherent, structure-finding tools blind to future theories should identify survivors; if not, continuity may be a post hoc illusion.  

  #### **3. Method: 12-Month Work Plan**  
  Using open-source tools (PyTorch, scikit-learn) and modest compute (consumer-grade GPUs), I will:  
  - **Months 1–2**: *Case selection and data curation*. Identify three historical episodes where:  
    (i) Theory change is well-documented (e.g., transition from caloric to kinetic theory of heat; phlogiston to oxidation; Newtonian gravity to general relativity for Mercury’s perihelion).  
    (ii) Pre-change data is machine-readable (e.g., 18th-century calorimetry datasets; planetary motion catalogs).  
    (iii) The "retained" and "discarded" structures are uncontroversially identified in hindsight (e.g., conservation principles retained; fluid-like caloric discarded).  
    Simulated data will augment gaps, ensuring reproducibility.  
  - **Months 3–4**: *Baseline model training*. Train simple interpretable models (sparse neural networks, symbolic regression) on pre-change data to predict target phenomena (e.g., heat transfer; orbital paths). Goal: Achieve period-appropriate predictive accuracy without overfitting.  
  - **Months 5–6**: *Structure extraction*. Extract internal structures (e.g., learned parameters, feature interactions) as directed graphs or functional dependencies. For example, a neural net’s activation patterns for calorimetry data might reveal weightings akin to latent variables.  
  - **Months 7–8**: *Structure comparison using recurrence criterion*. Apply a non-predictive criterion for structural recurrence:  
    > *Criterion*: Structures **A** (from historical theory) and **B** (from model) recur if:  
    > (i) They exhibit *isomorphic interventionist counterfactuals*—e.g., perturbing variable *X* in **A** and its mapped counterpart in **B** produces analogous changes in system behavior;  
    > (ii) The mapping preserves *dependencies* (e.g., if **A** has *X → Y → Z*, **B** must have a corresponding chain *X' → Y' → Z'*);  
    > (iii) This holds across >70% of tested interventions.  
    This avoids predictive equivalence (e.g., two different equations fitting data) by requiring causal topology to align.  
  - **Months 9–10**: *Retrospective testing*. For each case, score whether extracted structures match historically retained/discarded ones. Replicate with varied models/data splits to reduce randomness.  
  - **Months 11–12**: *Analysis and drafting*. Quantify success rate (fraction of cases where retained structures are recovered). Prepare papers on implications for SR.  

  #### **4. Range of Possible Conclusions and Deciding Considerations**  
  - **Conclusion 1 (Supports SR)**: Models recover retained structures >80% of the time. *Deciding factor*: Statistical significance (p<0.05) across cases.  
  - **Conclusion 2 (Undermines SR)**: Models recover discarded structures or show no bias toward retained ones. *Deciding factor*: Success rate ≤50% (chance-level).  
  - **Conclusion 3 (Inconclusive)**: Mixed results (e.g., 60–70% success). *Deciding factors*:  
    - Case heterogeneity: Does performance correlate with data quality or theory maturity?  
    - Criterion sensitivity: Does relaxing/varying the recurrence threshold alter outcomes?  
  Key considerations: Consistency across cases, robustness to model choice, and whether failures trace to data gaps or philosophical issues.  

  #### **5. Criteria for Project Failure**  
  The project fails if:  
  - No suitable historical cases with machine-readable data are found (mitigation: use simulated analogs from published historical reconstructions).  
  - Extracted structures are too ambiguous to compare via the recurrence criterion (mitigation: simplify models or use synthetic benchmarks).  
  - Results are universally inconclusive (e.g., success rates cluster near 60% without explanatory patterns).  

  #### **6. Feasibility and Scope Risks**  
  The primary risk is **tractability of structure recurrence judgments**. Mapping inarticulate model structures to historical formalisms requires nuanced counterfactual testing, which could become computationally intensive or subjective. If >50% of cases demand ad-hoc mappings, the project may exceed one year. Mitigation: Focus on cases with qualitative historical records of interventions (e.g., "if caloric fluid were added, temperature would rise") to ground comparisons. Secondary risk: Data scarcity. This is minimized by selecting well-studied episodes (e.g., Mercury’s orbit) with public datasets.  

  #### **7. Value to Scientists and Funders**  
  This project offers a concrete framework for assessing the trustworthiness of inarticulate model variables (e.g., a neural network’s latent representations). If retrospectively successful, it suggests that models capturing "survivor structures" are more likely to be reliable—even when uninterpretable—because they align with science’s stable patterns. For funders, this justifies investing in opaque but predictively powerful models (e.g., in climate science or epidemiology). If unsuccessful, it urges caution: internal variables may encode ephemeral artifacts, demanding human oversight. Either outcome advances science’s capacity to evaluate AI-driven discovery.  

