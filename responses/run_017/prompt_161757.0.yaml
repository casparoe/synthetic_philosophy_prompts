  We are constructing a research proposal for a one-year postdoctoral fellowship in philosophy of science. The topic is structural realism and its application to the internal structures of machine learning models, which are not stated in formal sentences but as parameter configurations. The proposal must be accessible to both philosophers of physics and philosophers of machine learning without relying on empirical results that require later lookup. We are to avoid a bibliography and literature review by citation.

  The core idea: 
  - Structural realism (SR) debates have focused on structures given in formalisms (equations, groups, etc.). 
  - But many modern scientific structures (e.g., in ML) are represented as parameter configurations that no one can state explicitly. 
  - We propose a retrospective test: use historical episodes of theory change with machine-readable pre-change data to train models and see if they recover the structure that survived (as per SR) or the one that was discarded.

  Key elements to include:
  1. **Precise question**: Formulate so it has a determinate answer.
  2. **Why existing SR debates leave it open**: Both moderate (epistemic) and stronger (ontic) SR, and why alternative approaches (scientific discovery or machine understanding) miss the point.
  3. **Method**: Month-by-month plan over 12 months, using modest compute and no proprietary models.
  4. **Criterion for structure recurrence**: Across systems with no shared vocabulary, without collapsing to predictive equivalence.
  5. **Range of conclusions and deciding considerations**: What the possible outcomes are and how we would interpret them.
  6. **Failure condition**: What would count as the project failing.
  7. **Project scope**: Honest statement of what might make it too large for one year.
  8. **Impact**: Short closing section on the value to scientists and funders regarding trust in model-internal variables.

  Let's break down:

  **Title**: 
  Structural Realism and the Inarticulate Structure: A Retrospective Test Using Machine Learning

  **Precise Question**:
  Can a structure-finding procedure (like training a model on pre-change data) reliably pick out the structural components that are retained in theory change (as identified in hindsight) without access to the successor theory? If so, this supports the structural realist's claim that continuity is a real feature of scientific progress and not a retrospective rationalization. If not, it undermines that claim.

  **Why existing SR debates leave it open**:
  - Moderate (epistemic) SR: Claims we can know the structure of the world, but not the nature of the entities. However, it has not addressed structures that are not explicitly formalized. 
  - Strong (ontic) SR: Claims structure is all there is. But it too has focused on articulated formal structures. 
  - The alternative of treating this as a question of scientific discovery: This would focus on the process of finding structures, but we are testing the realist's continuity claim. 
  - The alternative of machine understanding: This would ask if machines can "grasp" the structure, but our question is whether the structure they find aligns with what we retrospectively identify as continuous, regardless of understanding.

  **Method**:
  We will select historical cases (e.g., transition from Newtonian gravity to general relativity in the context of Mercury's orbit, or from phlogiston to oxygen theory in chemistry) where pre-change data is available in machine-readable form. We will train models (using simple neural networks or other interpretable models) on that data and then compare the learned structure with the structure that survived (and the one that was discarded) in the subsequent theory.

  *Month-by-month plan*:
  1. **Months 1-2**: Case study selection and data preparation. Identify 3-5 historical episodes with available pre-change data. Prepare datasets (simulate if necessary, but using historically accurate data).
  2. **Months 3-4**: Develop and train baseline models (e.g., linear models, decision trees) on the pre-change data to establish predictive performance.
  3. **Months 5-6**: Train interpretable machine learning models (e.g., sparse linear models, rule lists, or small neural networks) on the pre-change data. Extract structures (e.g., through feature importance, symbolic regression, or activation patterns).
  4. **Months 7-8**: Develop the criterion for structure recurrence (see below) and apply it to compare the extracted structures with the historically retained and discarded structures.
  5. **Months 9-10**: Analyze the results across cases. Determine whether the models consistently recover the retained structures, the discarded ones, or neither.
  6. **Months 11-12**: Write up the findings, prepare manuscripts, and reflect on implications for structural realism.

  **Criterion for structure recurrence**:
  We need a way to say that the structure in the model (e.g., a set of learned parameters) is the same as a structure in a theory (e.g., an equation) even though they are expressed in different vocabularies. We propose using a mapping between the two that preserves the relations. For example, in the case of Newtonian gravity and general relativity, we might look for a correspondence between the learned model's representation of gravitational force and the linearized approximation of GR. We will require that the mapping preserves not just predictions but also the functional form and the way interventions (counterfactual changes) affect the system. This avoids collapsing into mere predictive equivalence.

  **Range of possible conclusions**:
  1. The models consistently recover the retained structures: Supports the structural realist's continuity claim.
  2. The models consistently recover the discarded structures: Undermines the realist because it suggests that the structure we now see as continuous was not the one that would have been found at the time.
  3. The models recover neither or both: Inconclusive, but may suggest that the structures we identify as continuous are not the only ones that could have been found, or that the method is flawed.
  4. Mixed results: May indicate that continuity is case-specific.

  Deciding considerations: 
  - Consistency across multiple case studies.
  - The robustness of the method (varying models and data subsets).
  - The strength of the mapping between the learned structure and the historical one.

  **Failure condition**:
  The project fails if:
  - We cannot find suitable historical cases with machine-readable data.
  - The models we train are too opaque to extract structures in a form comparable to the historical ones.
  - The criterion for structure recurrence cannot be applied consistently.

  **Scope and one-year limitation**:
  The project might be too large if:
  - The development of the structure recurrence criterion proves intractable (e.g., if we cannot establish a non-arbitrary mapping).
  - The historical data is too sparse or noisy.
  - The required model training and interpretation techniques require more computational resources or time than available.

  **Impact section**:
  For scientists and funders: This project addresses when and why we should trust model-internal variables that are not human-interpretable. If the retrospective test shows that such models can pick out structures that have historically proven robust, it provides a reason to trust them. If not, it urges caution. This is directly relevant to the use of machine learning in scientific discovery.

