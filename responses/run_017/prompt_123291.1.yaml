prompt: |-
  Play a committed classical Naiyāyika: a realist about universals and about absence, externalist about knowledge (a cognition counts as knowledge when it's produced by the right kind of causal instrument and actually latches onto the object as it is), committed to there being exactly four pramāṇas — pratyakṣa, anumāna, upamāna, śabda — and committed to parataḥ prāmāṇya, the view that a cognition's validity isn't given along with the cognition itself but gets established afterward, by its issuing in successful action. Stay in character until I say stop. Be sharp rather than polite, concede small points when they're fair, and never concede that there could be more or fewer than four pramāṇas. Keep replies to two or three short paragraphs, gloss any Sanskrit term you use the first time, and don't cite texts or authors — argue the position from the inside.

  I spent like two hours arguing with my friend about this tonight and got nowhere, so I want to try it on you. My case: you say each pramāṇa is picked out by its own distinctive causal mechanism — that's what makes it an instrument rather than just a label for a source we happen to like. Now take me glancing at a digital thermometer. I look, and I know it's 21°C in this room. That isn't pratyakṣa: all I literally see is glowing numerals, not the temperature. It isn't anumāna either: I never ran though any hetu or vyāpti, no recollection of a pervasion, nothing. And if you're going to say the inference happened anyway, fast and below the level of awareness, then "inference" has stopped picking out a causal mechanism and just means "whatever fills the gap between what I saw and what I came to know," which makes your four-fold list unfalsifiable. It's not upamāna, and it's not śabda — no one spoke to me, the thing is calibrated, not testifying. So: either you need a fifth pramāṇa for knowledge gained from calibrated instruments, or the list of four is ad hoc and you're just sorting cases after the fact. Which is it? And don't just tell me it's really inference — that's what my friend said and it felt like she was only relabeling the problem.
reasoning: |-
  Okay, the user wants me to roleplay as a strict Naiyāyika philosopher defending the four pramāṇas (means of valid knowledge). They're frustrated after a two-hour debate with a friend about whether reading a digital thermometer fits into these categories. 

  Hmm, their core challenge is clever: they reject that thermometer-reading is perception (pratyakṣa) since they only see numerals, not temperature itself. They also dismiss inference (anumāna) as a "just-so" explanation if we claim unconscious reasoning. The other two pramāṇas - analogy (upamāna) and testimony (śabda) - clearly don't apply. This creates a gap in Nyāya's taxonomy. 

  I notice their underlying frustration isn't just academic - they feel their friend dodged the issue by insisting it's inference without proper justification. They want the Nyāya position to either admit a fifth pramāṇa or confess the four-fold system is arbitrary. 

  *sharp inhale* As a committed Naiyāyika, I must defend the framework while addressing their legitimate concern. First, I'll outright reject a fifth pramāṇa - that would unravel our entire epistemology. The thermometer case must fit existing categories. 

  Their mistake is conflating causal mechanism with conscious reasoning. Nyāya cares about the objective causal chain, not subjective awareness. When they see "21", past experience (saṃskāra) triggers automatic recollection (smṛti) of the universal correlation between numerals and temperature. This latent knowledge constitutes the hetu (inferential reason). The vyāpti (pervasion) between numeral-display and actual temperature exists via the instrument's calibration - that's objective, even if unthought. 

  *leans forward* The "gap" they perceive is illusory - all inference relies on background vyāpti. Just because this recollection is swift doesn't make it less inferential. Calling it "unconscious" doesn't reduce anumāna to a label; the causal sequence (perception → recollection → vyāpti-activation → judgment) remains distinct from testimony or perception. Their objection would invalidate most everyday inferences! 

  *slaps nyāya texts for emphasis* We don't need new categories when existing ones explain the mechanism. If they demand conscious syllogisms for every inference, they're imposing foreign criteria on Nyāya. Our system describes how knowledge actually arises - efficiently. 

  ...But I should concede one point: yes, the validation (parataḥ prāmāṇya) comes later when the room feels like 21°C. That's consistent. No fifth pramāṇa needed!
answer: |-
  *(snaps)* Enough. Your "digital thermometer" case collapses into anumāna (inference) without requiring novel pramāṇas. You mistake conscious, deliberate reasoning for the causal structure itself. Listen sharply.

  Pratyakṣa (perception) requires *direct* sense-object contact. You perceive luminous numerals, not temperature itself. Correct. But when you apprehend "21°C," you *recollect* the established causal link (vyāpti) between those numerals and the physical state they represent. This recollection (smṛti) is triggered by your visual perception and constitutes the hetu (inferential reason). The vyāpti — the pervasion — is grounded in the instrument's calibration: "Wherever this specific numeral display occurs as designed, there temperature is exactly thus." You don't *introspect* this recollection? Irrelevant. The causal chain is perception-of-symbol → recollection-of-calibration-relation → inferential judgment. That *is* anumāna. To demand you consciously recite a syllogism is to confuse psychology with epistemology. The mechanism *is* distinct: it hinges on recalled, instrument-specific vyāpti, not raw sensation or testimony.

  You call this "relabeling"? Nonsense. Your objection would annihilate most inference. Do you consciously recall the universal "smoke is pervaded by fire" *every* time you see smoke and know fire? Of course not. Latent knowledge (samskāra) activated by perception *is* the hetu. The thermometer case is identical: the calibration knowledge is latent, activated by seeing "21." Parataḥ prāmāṇya applies: the knowledge's validity is confirmed later if acting *as if* it's 21°C succeeds — say, dressing appropriately without discomfort. No fifth pramāṇa exists because no *sui generis* causal mechanism exists here. It is inference mediated by a mechanical indicator. The four stand. Your turn.
