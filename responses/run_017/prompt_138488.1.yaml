prompt: |-
  I am writing a chapter on the epistemology of historicity — at what point a tradition stops being legend — and I need to know what my supervisor will say about a case of my own before I build a section around it. She works with a three-place scale (history; not history but with a recoverable historical kernel; legend with nothing behind it), and her rulings so far are these:

  - The Trojan War as the epics tell it — gods on the field, the wooden horse, the ten years: kernel only. A real city, destroyed in the right period, lies at the mound now called Hisarlik; the war as narrated is not history.
  - The battle fought at Kadesh in Syria in the thirteenth century BCE: history — even though our accounts are the pharaoh's own temple inscriptions, boastful, numerically impossible and full of divine favour, and the enemy's side of it survives mainly in a peace treaty concluded some years later.
  - The Exodus: legend, nothing behind it — no contemporary Egyptian record of the flight, no trace of a large population in the Sinai over decades. She adds that the late-thirteenth-century Egyptian victory stela naming Israel as a people in Canaan establishes the people, not the story.
  - Arthur: legend — first named some three centuries after the fighting, in a compilation of around 828, while a British writer closer to those events describes the same war against the Saxons, names Ambrosius Aurelianus, and never mentions Arthur. Ambrosius she counts as historical.
  - The Norse voyages to Vinland: history — the sagas were written down two centuries or so after the voyages, but a Norse site has been excavated at L'Anse aux Meadows in Newfoundland and dated to around the year 1000, with the kind of buildings the sagas describe.

  My case: a steppe tradition, first written down in a monastic chronicle roughly six centuries after the events, about the migration of a people and the burning of a town I will call Arshat. The chronicle says the migration was commanded by a sky-fire that stood still over Arshat for three nights, and that is the reason the tradition itself gives for why the people left. At the site the chronicle's own itinerary identifies as Arshat there is a destruction layer radiocarbon-dated to within a generation of the date its king-list implies; above it lies a horizon of foreign-style pottery spread over several hundred miles; ancient DNA shows population turnover at about that date. No contemporary inscription anywhere names either the town or the migrants, and the king-list survives only inside the same late chronicle.

  What will she say about the Arshat migration? More useful to me than the verdict: what rule is she running, which other rules fit her five rulings equally well but come apart here, and which further case — real or constructed — would best tell them apart? I would also like to know whether her middle verdict is doing genuine work, or is only a polite way of declining to answer.
reasoning: |-
  Okay, the user is writing a chapter on historicity and needs to predict their supervisor's verdict on a case study. Let me start by understanding the supervisor's framework. She uses a three-place scale: history, historical kernel, and legend. The examples given show a pattern. 

  Trojan War is kernel-only because there's evidence of a real city destroyed at the right time, but the epic narrative isn't historical. Kadesh is history despite biased accounts because there are multiple sources and archaeological evidence. Exodus is legend with no contemporary evidence. Arthur is legend because of late mention and absence in earlier records, while Ambrosius is historical. Vinland is history because of archaeological evidence matching the sagas.

  Now, the user's case: Arshat migration. Written down six centuries later. Sky-fire as a divine sign. Destruction layer at the site, foreign pottery, aDNA showing population turnover. No contemporary inscriptions. King-list only in the chronicle.

  The supervisor would likely see the archaeological evidence (destruction layer, pottery, aDNA) as strong indicators of a real event. The sky-fire might be mythical, but the migration itself has evidence. Similar to Vinland where archaeology confirmed the sagas. Unlike Exodus, where there's no evidence. 

  The middle category (kernel) applies here because the core event (migration, destruction) has evidence, but the supernatural element (sky-fire) is likely embellishment. The king-list might be problematic, but the physical evidence supports the event's occurrence.

  Rules the supervisor uses: Corroboration with archaeology boosts to history or kernel. Lack of contemporary records isn't fatal if other evidence exists. Supernatural elements are discounted. Late documentation requires supporting evidence.

  Alternative rules could be stricter about written sources. If someone requires contemporary records, then Arshat would be kernel or legend. But the supervisor accepted Kadesh despite biased accounts and Vinland with late documentation. So she values archaeological evidence highly.

  To differentiate, a case with archaeological evidence but no written sources at all. Like a prehistoric event with physical evidence but no narrative. Supervisor might still call it history. Or a case with early texts but no archaeology, like some biblical events. She might lean towards kernel or legend without corroboration.

  The middle category is useful. It distinguishes between no evidence (legend) and evidence of a core event (kernel) versus fully historical with reliable accounts. Without it, cases like Troy would be lumped with legends or forced into history.

  User's deeper needs: They want to understand the supervisor's reasoning to structure their argument correctly. They might be unsure how to handle cases where evidence is mixed. Also, they might want to justify using the kernel category effectively in their chapter.
answer: |-
  Based on your supervisor's established rulings and reasoning, here's the breakdown for your Arshat migration case:

  1.  **The Verdict:** Your supervisor will almost certainly place the Arshat migration in the **"not history but with a recoverable historical kernel"** category.

  2.  **The Rule She is Running:** **Corroboration of the core event by independent, non-textual evidence (archaeology, archaeogenetics) outweighs the late date of the written source and the presence of mythical/supernatural elements, confirming a historical kernel even in the absence of contemporary inscriptions.**

      *   **Why it fits her rulings:**
          *   **Like Troy:** A specific location (Arshat) is identified archaeologically with physical evidence (destruction layer) matching the *type* of event described (destruction) and dated appropriately. The *specific narrative details* (sky-fire command) are likely legendary/mythical additions. The king-list being late and only within the chronicle is analogous to the Trojan king-list being embedded within Homeric epic – not independently verifiable.
          *   **Unlike Exodus:** Crucially, there *is* concrete, contemporary (in archaeological terms) evidence *at the specific location* (destruction layer) *and* regional evidence (pottery horizon, aDNA turnover) directly supporting the core claim: a destructive event at Arshat followed by a significant migration/population shift. This is the gaping hole in the Exodus case.
          *   **Like Vinland:** The late written source (sagas/chronicle) is corroborated by definitive archaeological evidence (L'Anse aux Meadows site/building types vs. Arshat destruction layer/associated material culture horizon and aDNA) precisely where and when the tradition suggests. The supernatural element (Vinland sagas have some too, like prophetic dreams) is discounted in favor of the materially verified core event.
          *   **Unlike Arthur:** There is contemporary (archaeological/genetic) evidence *from the event period itself* supporting the core claim (migration following destruction). Arthur lacks *any* contemporary evidence linking the *narrative* (or even the name) to the 5th-6th century events. Ambrosius has slightly better (earlier) textual attestation. Arshat has *physical* attestation.
          *   **Like Kadesh (in spirit, not evidence type):** Despite the problematic nature of the *primary written source* (Pharaoh's boasts/chronicle's sky-fire), there is *other evidence* confirming the *core event happened* (Hittite treaty & broad historical context / Arshat destruction, pottery spread, aDNA). The rule is that biased/supernatural-laden narratives can still contain a historical core *if independently corroborated*.

  3.  **Alternative Rules that Fit Her Five Rulings but Fail/Conflict with Arshat:**
      *   **Rule A: "Requires Contemporary Inscription for 'History' or 'Kernel'":** Fits Troy (no inscription), Kadesh (has inscription = History), Exodus (no inscription = Legend), Arthur (no inscription = Legend), Vinland (no inscription = Kernel? But she calls it History!). **Fails:** Vinland is History without contemporary inscription. Arshat would likely be Legend under this rule, contradicting her Vinland ruling. She demonstrably *doesn't* require contemporary inscriptions.
      *   **Rule B: "Supernatural Elements Automatically Demote to Legend":** Fits Trojan gods/horse (Kernel, not History), Exodus plagues/parting sea (Legend), Arthurian magic (Legend). **Fails:** Kadesh is full of divine intervention ("Ramses saved by Amun") yet is History. The sky-fire in Arshat would force it to Legend under this rule, but Kadesh shows she discounts supernatural elements if the core event is strongly corroborated by other means. Arshat's physical evidence parallels Vinland (which also has supernatural elements).
      *   **Rule C: "Late Documentation (>200 years) Automatically Precludes 'History'":** Fits Arthur (300yrs+ = Legend), Vinland (~200yrs? = History - *but pushes it*). **Fails:** Vinland is History despite ~200-year gap. Troy's kernel relies on traditions potentially centuries older than Homer. Her focus is on *corroboration*, not just the age of the text. Arshat's 600-year gap is long but mitigated by the strong archaeological/genetic match.

  4.  **A Case to Tell These Rules Apart:**
      *   **The Case:** "The Founding of City X by Hero Y." Earliest written mention 500 years after the supposed founding, describing a miraculous sign guiding the founder. Extensive archaeology shows continuous settlement at City X for 1000+ years, with a significant *expansion* phase roughly 500 years ago (matching the traditional founding date), but *no evidence of destruction or cultural discontinuity* immediately before this expansion. No contemporary inscriptions mention Y or the founding. Ancient DNA shows population continuity through the expansion phase.
      *   **How it Tells Them Apart:**
          *   **Your Supervisor's Rule (Corroboration of Core Event):** Would likely say *Legend, nothing behind it, or possibly Kernel (but weak)*. The archaeology shows development, not a founding event matching the narrative. It confirms people lived there, but *not* the specific event of "founding by Hero Y with a sign." The lack of discontinuity weakens any link. The supernatural element has no corroboration. Contrasts with Arshat's destruction layer/migration evidence.
          *   **Rule A (Requires Inscription):** Legend (no inscription).
          *   **Rule B (Supernatural = Legend):** Legend (miraculous sign).
          *   **Rule C (Late Doc = No History):** Legend (500-year gap).

  5.  **Is the Middle Category Doing Genuine Work?**
      *   **Absolutely Yes.** It's not just politeness; it's a crucial epistemological category recognizing that traditions often preserve a distorted memory of a real event. It *does* genuine work:
          *   It distinguishes between *no underlying event* (Exodus, Arthur under her view) and *some identifiable event* that inspired the tradition (Troy, Arshat).
          *   It acknowledges that evidence can confirm an event *occurred* without confirming the *specific narrative details*.
          *   It provides a category for cases where archaeology confirms an event matching the *type* described (destruction, migration) but not the specifics or agents (Achaeans vs. Trojans, sky-fire).
          *   It avoids the false dichotomy of "completely true" or "completely false." Her rulings show clear criteria for assigning it: archaeological evidence pinpointing an event matching the tradition's core claim, despite late sources and mythical embellishments.

  **Conclusion for Arshat:** The combination of a destruction layer at the identified site dated correctly, plus widespread material culture change *and* aDNA evidence for population movement coinciding with that destruction, provides the same level of strong, independent corroboration for the *core event* (migration triggered by destruction of Arshat) that L'Anse aux Meadows provides for the Vinland voyages. The late chronicle, the mythical sky-fire explanation, and the unverified king-list are analogous to the late sagas and their supernatural elements in Vinland, or the mythical elements in the Trojan epics. They frame the story but don't negate the historical kernel confirmed by hard evidence. Therefore: **"Not history but with a recoverable historical kernel."** The key rule is the *corroboration of the central claim by contemporary non-textual evidence*.
