prompt: |-
  I sit on my university's academic-integrity committee, and after a messy case last term I started reading about how groups decide things. Our rule is two-part: a finding of misconduct requires both that the student submitted work that was not their own and that no valid excuse applies. We vote by show of hands, and last term we ended up with a majority for each of the two conditions separately but a majority against a finding of misconduct — and then argued for an hour about what we had actually decided. Someone sent me a chapter from a popular book on collective decision-making that seemed to describe exactly our problem, but I don't trust it enough to bring it to the committee. Before I do, I'd like to know which parts of it a specialist in this area would endorse, which are simplifications, and which are quietly wrong.

  The chapter's account, as closely as I can reproduce its wording, goes like this: a group can be made up of perfectly reasonable individuals and still be unreasonable as a group. Imagine three judges deciding whether a defendant is liable, where the law makes liability depend on both a duty of care and a breach of that duty. One judge finds a duty and a breach and votes liable; one finds a duty but no breach; one finds no duty but a breach. Two of the three accept that there was a duty and two of the three accept that there was a breach, so if the court votes on the two questions separately it has to find the defendant liable — even though two of the three judges voted not liable. The court's verdict therefore depends on nothing more than which questions get put to the vote, which means it is an artifact of procedure rather than a finding. This is the discursive dilemma. The chapter then says that it is really just Condorcet's paradox of voting applied to beliefs instead of preferences — or, equivalently, Arrow's impossibility theorem restated for courts — and draws the moral that whenever a group has to settle several logically connected questions at once, no voting rule can reliably turn reasonable individuals into a reasonable group. It extends this well beyond law: any committee, board or electorate that votes on a package of related propositions risks endorsing conclusions that nobody in the room accepts, which is why putting complex questions to a popular vote is a dice roll. The only real escapes, it concludes, are to hand the decision to one person, or to break the issue down until every vote is a simple yes-or-no on one thing.

  My instinct is that this is unfair in at least one way — it slides from "collective judgments can be inconsistent" to "group decision-making is unreliable generally," and I don't see why a coherence problem about the shape of a group's stated position should tell us anything about whether the group is likely to get the facts right. But I can't tell where the chapter stops being accurate and starts overstating, and I also can't tell whether its practical moral survives correction. So: please audit it claim by claim, saying what someone who works on this literature would accept outright, what they would describe as a common simplification, what they would reject, and what the strongest defender of the view would say the chapter gets wrong about their own result. Then tell me whether the conclusion I actually care about follows from the accurate parts of the account: our committee is considering a "double-majority" fix, where each condition must win a majority on its own and the composite finding must also win a majority on its own, and if the composite fails we record no violation and note only those conditions that did pass. Is that a genuine way out of the problem the chapter describes, is it secretly one of the procedures the literature already discusses under another description, what does it cost us, and does it quietly give up something that the impossibility results are usually taken to require? I'd also like to know whether we would do better simply to vote only on the two conditions and never on the composite finding at all — what we would gain and lose by doing that, in terms the rest of the committee will understand.
reasoning: |-
  Okay, let me try to unpack this user's query. They're on an academic integrity committee and faced a confusing situation where separate majorities supported each condition for misconduct, but a majority opposed the overall finding. They read a chapter on collective decision-making that describes the discursive dilemma, and they're unsure how much of it is accurate. They want an expert audit of the chapter's claims and advice on procedural fixes.

  First, I need to verify the chapter's core example. The three-judge scenario where individual votes lead to inconsistent group outcomes is indeed a standard illustration of the discursive dilemma. The user is right to recognize this as a real phenomenon in judgment aggregation. 

  The chapter's connection to Condorcet and Arrow seems mostly valid as a conceptual analogy, but I should note the technical differences: Condorcet deals with preferences, while discursive dilemma is about propositions. The chapter's claim that "no voting rule can reliably prevent this" is largely correct based on known impossibility theorems, but I should clarify it's about logical consistency, not factual accuracy.

  Where the chapter likely overreaches is implying all group decisions are unreliable. The user's instinct about this is spot-on—inconsistency doesn't equal inaccuracy. I should emphasize that empirical groups can still reach correct decisions despite this theoretical issue.

  For the proposed "double-majority" fix: requiring majority support for each condition AND the composite finding. This resembles the premise-based approach but adds a conclusion-based check. It prevents inconsistent outcomes but creates new risks: the committee might deadlock even when both conditions have majority support, or the composite vote could override minority concerns about mitigating factors. 

  The alternative—voting only on conditions and deriving the conclusion—would avoid direct contradictions but might feel procedurally unfair. Members who see valid excuses might feel silenced if the conclusion follows automatically.

  Practical advice for the user: Present both options neutrally. The double-majority method prioritizes consensus on the outcome but may lower violation findings. The condition-only voting is simpler but less deliberative. Neither "solves" the impossibility result, but both manage trade-offs transparently. Suggest piloting one method with a review clause.

  The user's deeper need seems to be restoring committee confidence after a messy case. Beyond procedure, they might benefit from framing recommendations as "managing inherent trade-offs" rather than "fixing flaws."
answer: |-
  Here’s a step-by-step audit of the chapter’s claims, followed by analysis of your committee’s proposed solutions. The key insights draw from judgment aggregation theory (e.g., List, Pettit, Dietrich) and social choice theory.

  ---

  ### **Audit of the Chapter’s Claims**
  1. **"A group can be made up of perfectly reasonable individuals and still be unreasonable as a group."**  
     - **Endorsed**: True. This is the core of the **doctrinal paradox** (a.k.a. discursive dilemma). Individual rational judgments can aggregate into collective inconsistency.  
     - **Simplification**: "Unreasonable" here means *logically inconsistent*, not factually incorrect or irrational. The group violates coherence (e.g., affirming premises but rejecting the conclusion).

  2. **The three-judges example**  
     - **Endorsed**: Accurate illustration. Majorities support "duty" (Judges 1+2) and "breach" (Judges 1+3), yet only Judge 1 supports liability (Judges 2+3 oppose).  
     - **Simplification**: Real cases often have >3 voters or nuanced dependencies, but the paradox scales to any group size.

  3. **"The verdict depends on which questions get put to vote"**  
     - **Endorsed**: Correct.  
       - **Premise-based voting** (vote on duty/breach first): Liable (majorities affirm both).  
       - **Conclusion-based voting** (vote on liability directly): Not liable (majority opposes).  
     - **Rejected**: Not *only* "procedure" – the conflict arises from **logical interdependence**. No neutral aggregation exists.

  4. **"It is Condorcet’s paradox applied to beliefs or Arrow’s theorem for courts"**  
     - **Endorsed as analogy**: Both reveal aggregation failures:  
       - Condorcet: Cyclical majorities in preferences.  
       - Arrow: No "fair" way to aggregate preferences.  
       - Discursive dilemma: No "consistent" way to aggregate judgments on interconnected propositions.  
     - **Overstatement**: Not *identical*. Arrow’s theorem concerns preferences (not beliefs) and requires specific axioms. The parallel is valid but imprecise.

  5. **"No voting rule can reliably turn reasonable individuals into a reasonable group"**  
     - **Endorsed with nuance**: True under **List-Pettit impossibility theorem** (2002): For interconnected propositions, no aggregation rule satisfies all of:  
       - *Universal domain* (all possible individual judgments)  
       - *Collective rationality* (group judgments are consistent)  
       - *Systematicity* (same rule for all propositions)  
       - *Majority preservation* (if all agree on a proposition, group accepts it).  
     - **Key caveat**: "Reliably" means *guaranteed consistency*. Some rules (e.g., supermajorities) reduce but don’t eliminate risk.

  6. **"Putting complex questions to a popular vote is a dice roll"**  
     - **Simplification**: True for **interdependent propositions** (e.g., "A", "B", and "A∧B→C").  
     - **Overstatement**: Not all referendums face this. Simpler questions (single issues) avoid it. The risk is proportional to logical complexity.

  7. **"Only escapes: one dictator or isolated yes/no votes"**  
     - **Endorsed**: Dictatorship avoids inconsistency (but violates fairness).  
     - **Rejected**: Isolating votes **does not solve** the problem – it *chooses one aggregation path* (premise- vs. conclusion-based), each with flaws.  
     - **Omission**: Alternatives exist:  
       - **Deliberation**: Discussion can align judgments (but not guaranteed).  
       - **Supermajorities**: Raise consensus threshold (reduces inconsistency risk).  
       - **Priority rules**: E.g., always derive conclusion from premises.

  ---

  ### **Analysis of Your Committee’s Solutions**
  #### **Option 1: Double-Majority Fix**  
  *(Each condition + composite finding need separate majority support)*  
  - **What it is**: A **hybrid approach** requiring:  
    > (1) Majority affirms "work not their own"  
    > (2) Majority affirms "no valid excuse"  
    > (3) Majority affirms "violation occurred" (composite).  
    *If (3) fails, record only passed conditions.*  

  - **Is it a genuine escape?**  
    - **Yes for consistency**: Prevents the paradox by ensuring the composite finding only passes if supported directly.  
    - **Costs**:  
      - **False negatives**: May acquit violators. Example:  
        - 60% support Condition A (not own work)  
        - 60% support Condition B (no excuse)  
        - But 55% oppose composite (e.g., due to mitigating factors).  
        → Violator is acquitted despite meeting both conditions.  
      - **Strategic voting**: Members may vote against conditions they support to block composite.  
      - **Ambiguity**: Recording passed conditions without action may confuse (e.g., "We agree work wasn’t theirs, but no penalty").  

  - **Relation to literature**: Similar to **conclusion-based priority** (but with extra checks). It ensures coherence by subordinating premises to the conclusion.  

  - **Gives up?** Violates **majority preservation**: If all agree on A and B, the group *should* agree on "violation" (A∧B), but this rule may block it.  

  #### **Option 2: Vote Only on Conditions (Never Composite)**  
  *(Derive the finding from individual conditions)*  
  - **How it works**: Vote *only* on:  
    > (1) "Work not their own?"  
    > (2) "No valid excuse?"  
    → If both pass by majority, misconduct is recorded *automatically*.  

  - **Gains**:  
    - **Avoids inconsistency**: No direct vote on composite, so no conflict.  
    - **Efficiency**: Faster, no ambiguity.  

  - **Losses**:  
    - **Ignores holistic judgment**: Members who see mitigating factors (e.g., "no excuse, but plagiarism was trivial") can’t register dissent on the outcome.  
    - **Rigidity**: May punish students where a majority opposes sanction despite meeting conditions.  
    - **Accountability**: The composite outcome isn’t explicitly endorsed by the group.  

  - **Literature status**: Standard **premise-based approach**. Susceptible to "tyranny of premises" – the composite is imposed even if incoherent with minority views.  

  ---

  ### **Recommendations for Your Committee**
  1. **Double-majority is safer** if:  
     - You prioritize consensus on sanctions over procedural efficiency.  
     - Mitigating factors (not captured by the two conditions) often sway votes.  
     - **Explain to committee**: "This ensures we only sanction when a majority explicitly supports the penalty, not just the technical conditions."  

  2. **Vote-only-on-conditions is better** if:  
     - Conditions are objective (e.g., plagiarism detected by software; excuse criteria are binary).  
     - Speed/clarity are critical.  
     - **Explain**: "We define violation as meeting both conditions; voting separately is efficient and avoids deadlock."  

  3. **Third way: Structured deliberation**  
     - Vote on conditions first. If both pass, hold a *non-binding* straw poll on the composite.  
     - If composite lacks majority, reopen debate on excuses/severity before a final vote.  
     - **Cost**: Time-intensive but balances coherence and fairness.  

  ### **Bottom Line**  
  - **The chapter is broadly correct** about the paradox and its inevitability in interconnected votes.  
  - **Its pessimism is overstated**: Groups *can* reach reliable decisions using tailored rules or deliberation, but consistency isn’t guaranteed.  
  - **Neither solution "solves" impossibility** – both manage trade-offs. Double-majority prioritizes outcome legitimacy; condition-voting prioritizes procedural clarity.  
  - **For academic integrity**: Prefer double-majority. It reduces wrongful sanctions (students gain the benefit of doubt) and aligns with academic values of deliberative justice.  

  > ℹ️ **Practical script for committee**:  
  > *"Last term’s confusion arose because voting separately on conditions and the outcome can create logical conflicts. To fix this, we propose: (1) Vote on each condition; (2) If both pass, vote on whether a violation occurred. Only record a violation if all three votes pass. This ensures our final decision reflects explicit consensus."*
