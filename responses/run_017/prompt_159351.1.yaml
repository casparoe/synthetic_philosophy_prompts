  ## Convocation Address: The Weight and the Light  
  **Kittredge School 150th Anniversary**  
  By [Your Name], Chair of the Board of Trustees  

  Good morning. We gather today on profound ground. One hundred and fifty years ago, Dr. Amos Kittredge founded this school with a radical vision: free education for the children of emancipated enslaved people and for poor white families in this mill town. Look around you. Look at the generations of lawyers, teachers, nurses, artists, entrepreneurs, and leaders – especially within this town’s Black community – whose journeys began on these grounds. Four of your Trustees sitting here are graduates. This school is not just brick and mortar; it is a living lineage of resilience, intellect, and hard-won dignity. For that legacy, we offer deep, specific gratitude. We thank the teachers who saw potential where others saw lack. We honor the families who sacrificed and believed. We celebrate the alumni whose achievements, large and quiet, built this town’s professional class and proved Dr. Kittredge’s founding premise: that given opportunity, brilliance flourishes. This school’s light is real, and it continues to shine.  

  And yet, we gather also in the long shadow cast by the same man. Sixteen years after founding this school, as a state legislator, Amos Kittredge drafted, championed, and secured passage of the 1887 Act for the Care of the Feeble-Minded. His words advocating for it were harsher than his peers. The law he crafted was brutal: compulsory commitment to an asylum based on a single physician's certificate. No hearing. No appeal. Its definitions were dangerously broad – sweeping in paupers, epileptics, and girls deemed "unruly." It stripped away liberty, dignity, and family with terrifying ease.  

  We know he was warned. The State Medical Society raised objections. Right here in this town, the editor of the Black weekly newspaper spoke out forcefully against it, using arguments we would recognize today as defenses of human rights and due process. Dr. Kittredge dismissed them publicly as “sentimentalists.” His focus was absolute: the passage of his law.  

  This school’s initial state endowment was secured in that same legislative session, tied to the creation of the asylum board. Our existence is intertwined with that grim bargain. That is a fact of our origin, a weight we inherit.  

  The consequences were devastating. Nearly 1,900 people were committed under this law before its repeal in 1962. Lives were shattered, families torn apart, individuals disappeared behind asylum walls for being poor, ill, different, or defiant. The suffering inflicted by this law is incalculable and irredeemable. We condemn the Act of 1887 unequivocally and specifically. We condemn the cruelty of its design, the arrogance of its assumptions, and the profound harm it inflicted on vulnerable human beings. And we condemn the man who, possessing intelligence and influence, who had seen potential in the marginalized children of this town, nevertheless chose to wield his power to draft, champion, and force through this instrument of oppression, silencing critics who saw its peril. Amos Kittredge bears direct responsibility.  

  Years later, after visiting the asylum, Kittredge expressed public regret, calling the institutions “what he had not intended,” and campaigned for repeal. That campaign failed. His regret does not absolve him. It does not undo the harm. It does not lessen the condemnation due the act itself or the choices he made in 1887. The law remained, and its machinery ground on for decades.  

  So, what do we do with this? How do we stand here, beneficiaries of the light this institution cast, inheritors of the heavy cost paid elsewhere for its creation?  

  We cannot balance these things on a single ledger. The good done here does not cancel the harm done there. The harm done there does not negate the good done here. They are not transactions offsetting each other. To claim otherwise dishonors both the graduates who thrived and the victims who suffered.  

  We do not ask you to forgive Amos Kittredge. Forgiveness belongs to the victims and their descendants, not to us. We do not ask you to imagine what you might have done in his place; such speculation is ultimately a comfort to ourselves, not an assessment of history.  

  Instead, we must hold both truths, distinctly and simultaneously:  

  1.  **Deep Gratitude:** For the tangible, enduring good this school has achieved and continues to achieve. For the doors it opened, the minds it shaped, the community it built. We celebrate that legacy fiercely.
  2.  **Clear Condemnation:** Of the Act of 1887, a profound injustice authored by Amos Kittredge. Of the choices he made, despite available criticism, to pursue and defend it. We name this wrong without flinching.

  This is our complex inheritance: light and shadow intertwined at the root. The name "Kittredge" above our door signifies both the radical vision that built this school and the grievous harm inflicted by the same hand. To keep the name is not to endorse the man in full; it is to acknowledge the full, uncomfortable weight of our history. The permanent exhibit being installed about the 1887 Act is not an answer, but a necessary testament – a constant reminder of the shadow that accompanies our light, urging vigilance against the misuse of power and the dehumanization of the vulnerable.  

  This school's enduring power lies not in simplifying its past, but in facing its complexities with clear eyes and moral courage. It lies in the resilience it fostered in its students, a resilience we now must apply to understanding our own foundation. We honor the graduates – including Marion Oakes, who speaks later – not by smoothing over history, but by respecting the fullness of their experiences and the truths they carry. We honor the victims of the Act by remembering them specifically, by condemning the injustice they suffered without caveat, and by committing to build a future where such power cannot be so abused.  

  Let the light of this school continue to shine brightly. Let the shadow of its origins remind us always of the cost of indifference and the imperative of justice. Let us carry both, honestly, as we step into the next 150 years.  

  Thank you.

  ---

  **Annotation:**

  1.  **Contested Claim:** The sentence *"We know he was warned... Dr. Kittredge dismissed them publicly as ‘sentimentalists.’"* rests on the historical interpretation that these contemporary criticisms constituted a genuine opportunity for Kittredge to know better and change course, and that his dismissal demonstrates culpable failure to heed available ethical reasoning. While the *fact* of the published objections is documented, the *weight* this carries regarding his moral responsibility is an ethical judgment. Critics might argue the objections weren't forceful enough, weren't seen as legitimate by him, or that societal pressure overrode them. I believe this interpretation is strongly supported by the record (he encountered specific, principled opposition and chose to override it derisively), making his failure to "listen" a key element of his culpability, distinct from mere "man of his time" inevitability.
  2.  **Confidence in the Two-Claim Distinction:** I am **highly confident** in the distinction you articulated. Separating the *epistemic availability* of better ideas ("could he have known?") from the *moral culpability* for not acting on available better judgment ("should he be blamed even if he could have known?") is crucial and analytically sound. Your case demonstrates precisely why the first claim (lack of available alternatives) fails on these facts, sharpening the focus onto the live question of blameworthiness despite available criticism. This framework effectively dismantles the vague "man of his time" defense.
  3.  **Point of Least Certainty:** I am **least sure** about the precise framing of the "bargain" and its implications for the school's stance: *"...a weight we inherit... Our existence is intertwined with that grim bargain. That is a fact of our origin... not a reason to think he is excused."* While factually accurate and crucial to acknowledge, the phrasing walks a tightrope. Is stating this "inheritance" and "weight" sufficient to convey the compromised position *without* inadvertently sounding like it lessens the condemnation of Kittredge or softens the school's moral responsibility in remembering the victims? I believe the surrounding, unequivocal condemnation protects it, but the potential for a listener (perhaps the Historical Society president) to perceive it as overly justifying the name retention or softening the blow remains the trickiest nuance.
