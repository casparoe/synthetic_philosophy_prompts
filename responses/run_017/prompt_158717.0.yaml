prompt: |-
  Hey, I'm putting together a short chapter on what individuals owe in situations where the harm only shows up collectively, and before I even look at what people have already said I want the spec nailed down first. So: write me the desiderata that an account of a single agent's reasons in collective-harm cases would have to meet.

  Fix the purpose like this: it has to be able to tell one person what she has most reason to do on an ordinary Tuesday, and separately say something coherent about whether anyone may blame or criticise her if she doesn't — I don't want those two questions quietly treated as the same question.

  Cases it has to get right (add any I'm missing): the tiny-contribution case, where a few thousand people each do something whose effect on the victim is imperceptible on its own; the lumpy-threshold case, where the harm comes in discrete units, e.g. a canteen that restocks whole animals in batches sized to last week's sales, so whether your sandwich matters depends on where in the batch it lands and you can't tell which; the constitutive rather than causal case, like a vote whose only real effect runs through the size of the winning margin instead of through who wins; the repeat-player case, where the same agent faces the same negligible choice hundreds of times over a life; and the awkward one where the party being harmed is arguably better off existing at all, since the demand that created them is also what creates the harm.

  Then say which distinctions the account must not collapse: making a difference versus being one of the people who make it, expected versus actual efficacy, acting wrongly versus being aptly blamed, what I should do versus what we should do, and reasons not to contribute versus reasons to pay for it afterward.

  Mark which of these you take to be genuine requirements and which are just a prejudice of one camp — I think the idea that if your act makes no difference then you can't have a duty not to do it is an assumption smuggled in as a result. And tell me whether any subset of the desiderata can't be satisfied together, since that's the part I actually care about, plus which single requirement eliminates the most popular existing answers. Keep the scorecard to a couple of lines, I'll do that bit myself.
reasoning: |-
  Okay, the user wants desiderata for an account of individual reasons in collective-harm cases. Let me start by understanding their request. They’re writing a chapter and need criteria that any theory must meet before reviewing existing literature. The focus is on what one person should do on an ordinary Tuesday and separately on blameworthiness. They provided several cases: tiny contributions, lumpy thresholds, constitutive effects (like voting), repeated actions, and cases where the harmed party benefits from existing.

  First, I need to list all the desiderata. The user mentioned distinctions that shouldn’t be collapsed: difference-making vs. being part of the group, expected vs. actual efficacy, wrongness vs. blame, individual vs. collective obligations, and contributing vs. compensating. Also, they want to know which requirements are genuine versus biased assumptions. The key challenge is identifying any incompatibilities between these criteria.

  Let me break down the cases. Tiny contributions involve imperceptible harm per action. Lumpy thresholds have discrete harm units where an individual’s impact depends on batch position. Constitutive cases like voting affect outcomes through margins. Repeat players face the same choice many times. The existence case is tricky—harmed parties exist due to the harmful activity.

  I should consider different philosophical approaches. Consequentialism might struggle with imperceptible harms, while deontological views could handle participation but might conflate wrongness and blame. Expected value approaches might work for lumpy thresholds but not for constitutive cases. Repeat actions need consistency over time, and the existence case requires non-comparative harm assessment.

  The user suspects that the "no duty if no difference" idea is a smuggled assumption. So, I need to flag that as a potential bias. Also, separating individual reasons from collective obligations is crucial. Blame vs. wrongness distinction is important—someone might act wrongly without being blameworthy if they couldn’t know the impact.

  Possible conflicts: Holding that an act is wrong even if it makes no difference might clash with intuitive moral responsibility. Also, in lumpy cases, expected harm might not align with actual harm. The existence case might conflict with harm principles if the alternative is non-existence. 

  I should check which desiderata are essential. The user probably thinks the "no difference, no duty" is not essential. The rest seem genuine. Incompatibilities might arise between requiring individual wrongness without difference-making and avoiding overdemandingness. Also, blameworthiness might require knowledge, but wrongness might not, creating tension.

  Popular theories like act consequentialism fail with imperceptible harms. Rule consequentialism might handle repeat cases but struggle with thresholds. Participatory approaches might work for voting but not for existence cases. The hardest requirement is probably the constitutive case, as it’s not causal.

  Finally, the user wants a concise scorecard. I’ll note which theories fail which criteria. The main takeaway is that no theory satisfies all, highlighting the need for a new approach or accepting trade-offs. The key is to show where conflicts lie, especially between individual obligations in no-difference cases and blameworthiness depending on epistemic factors.
answer: |-
  Here are the desiderata for an account of individual reasons in collective-harm cases, structured for clarity:

  ### Core Desiderata (Genuine Requirements)
  1.  **Action-Guidance:** Must provide a clear, non-paradoxical answer to "What does one agent have *most reason to do* in the specific situation?" (The "ordinary Tuesday" question).
  2.  **Blame Separation:** Must provide a distinct, coherent account of *blameworthiness/criticizability* for an individual agent's action/omission, decoupled from the verdict on what they had most reason to do. These are separate evaluations.
  3.  **Case Coverage:** Must yield plausible verdicts on:
      *   **Tiny Contributions:** (Imperceptible harm individually, massive harm collectively).
      *   **Lumpy Thresholds:** (Discrete harm units, unknown position relative to threshold - e.g., canteen restocking).
      *   **Constitutive Harm:** (Harm stems from *participation* defining a collective outcome/status, not causal impact - e.g., margin-of-victory vote).
      *   **Repeat Players:** (Agent faces identical negligible-choice scenarios many times over a lifetime).
      *   **Existence-Dependent Harm:** (Harmed party arguably only exists *because* of the harmful practice/collective action).
  4.  **Distinction Preservation:** Must *not* collapse:
      *   **Difference-Making vs. Participation:** Being part of the harming group vs. being the one who *makes* the harm occur.
      *   **Expected vs. Actual Efficacy:** What the agent could reasonably foresee vs. the actual causal outcome.
      *   **Wrongdoing vs. Blameworthiness:** Whether the act was wrong vs. whether the agent is aptly blamed/criticized for it (often hinges on knowledge/control).
      *   **Individual vs. Collective Oughts:** What I should do vs. what we should do together.
      *   **Ex Ante Duty vs. Ex Post Liability:** Reasons not to contribute vs. reasons to compensate/repair if harm occurs.

  ### Potential Biases/Contested Assumptions (Marked as such)
  5.  **"No Difference, No Duty?" Rejected:** *Must not assume* that an agent cannot have a duty to refrain/act if their *individual* act makes no perceptible difference to the outcome. (Flagged by user as a potentially smuggled assumption; a good account should *justify* its stance on this, not assume it).
  6.  **Non-Overdemandingness:** Should avoid implausibly demanding requirements that would make ordinary life impossible or require excessive sacrifice for negligible individual effect. *(Plausible constraint, but specific thresholds are contested)*.
  7.  **Epistemic Feasibility:** Recommendations should be sensitive to the agent's *actual* or *reasonably expected* knowledge about the situation (e.g., lumpy thresholds). *(Plausible constraint on blameworthiness and action-guidance, but not necessarily on the objective wrongness of an act)*.

  ### Key Tensions & Elimination Potential
  *   **Primary Tension:** Reconciling **Action-Guidance (1)** demanding non-paradoxical individual duties in **Tiny Contribution (3a)** and **Lumpy Threshold (3b)** cases with the **Difference-Making vs. Participation (4a)** distinction and rejecting the **"No Difference, No Duty" Assumption (5)**. How can an agent have a strong reason *not* to do X if X makes *no difference*? This is the core philosophical knot.
  *   **Secondary Tension:** Reconciling plausible **Blameworthiness (2)** verdicts (often requiring foreseeable difference-making or clear contravention of a rule) with potential verdicts of **Wrongdoing (4c)** in no-difference cases (if the account holds such acts are wrong).
  *   **Existence Case Challenge:** Providing a coherent account of harm and reasons in **Existence-Dependent Harm (3e)** without relying on implausible comparisons to non-existence.
  *   **Repeaters Challenge:** Explaining why repeated tiny contributions over a lifetime don't simply reduce to each instance being insignificant (**Tiny Contribution (3a)** problem multiplied), or conversely, why one instance *does* matter if the lifetime pattern does.
  *   **Eliminator Champion:** The **Constitutive Harm case (3c - e.g., margin vote)** is particularly lethal to popular accounts. Theories relying solely on *causal* difference-making (Act Consequentialism, some deontological views) or *expected* causal difference-making (Expected Utility) fail here, as the harm/power arises purely from participation defining the collective. **Requirement (3c) eliminates the most popular answers.**

  **Incompatibility Alert:** Satisfying **Action-Guidance (1)** + **Tiny Contributions (3a)** + **Rejection of "No Difference, No Duty" (5)** *simultaneously* is the central difficulty. Most theories sacrifice one: Consequentialism often sacrifices (5) by denying duties in (3a); Participatory/Complicity theories sacrifice clear (1) or struggle with (4a); Rule-based theories struggle with (3b) & (3c). Holding all four creates the need for novel solutions (e.g., focusing on participation in harm, group obligations, risk imposition, or objective wrongness independent of difference-making).

