answer: |-
  ### Exam Question  
  **Epistemology Final Exam (90 minutes, 25 marks total)**  
  **Answer all parts. Write approximately 900 words total. Base your answers solely on the primary text (Wittgenstein’s *On Certainty*) and reasoned argument. Do not cite secondary literature.**  

  **Case Background:**  
  The Kestrel Hydrographic Office has charted the Kestrel Bank for a century. Its survey method treats the Bank as geologically stable: soundings taken years apart are pooled into a single depth model, and individual anomalous soundings are discarded as instrument error. That the Bank does not move is not something the Office has evidence for; it is what makes pooling soundings into one chart possible. Over thirty years, the proportion of discarded anomalies has risen steadily. The director invokes the Office’s standing revision protocol: when over 20% of soundings must be discarded, the stability assumption is retired and replaced with a migrating-Bank model. This retirement uses discarded anomalies as evidence—a procedure presupposing the stability assumption. Meanwhile, the Tidalists, using satellite altimetry (a method never presupposing stability), produce independent estimates of the Bank’s position and argue the stability assumption was testable all along.  

  **(a) (8 marks)**  
  Explain what it means for a proposition (e.g., "The Kestrel Bank is stable") to play a "framework role" in a practice like the Hydrographic Office’s. How does this role differ from:  
  (i) being a well-confirmed empirical hypothesis?  
  (ii) being merely something no one in the community thinks to question?  
  Use the case to illustrate your answer.  

  **(b) (10 marks)**  
  The director retires the stability assumption when anomalies exceed 20%. Is this retirement a rational revision? In your answer, address this tension: the evidential standard (counting anomalies) is only available because the stability assumption is in place. How does the Tidalists’ claim that the assumption was testable all along affect your assessment?  

  **(c) (7 marks)**  
  A critic argues that your framework account cannot distinguish the Office’s stability assumption from a paranoid patient’s conviction that his food is being poisoned (a belief held despite what others call counter-evidence). Does this mean the framework account collapses into relativism, or must it appeal to an external standard? In your response, discuss what work, if any, the Tidalists’ independent method does.  

  ---

  ### Model Answer (Strong Student Script, ~700 words)  
  **(a)** A proposition plays a "framework role" when it is not tested by evidence but makes evidence possible. Wittgenstein calls this a "hinge" proposition: it is fixed, and the practice "turns around" it. For the Hydrographic Office, "The Kestrel Bank is stable" is a hinge. Without it, pooling soundings from different times into one chart would be meaningless—an odd reading could not be dismissed as instrument error but might indicate change. This differs sharply from (i) a well-confirmed empirical hypothesis. Hypotheses are inferred from evidence and can be falsified by it (e.g., "The Bank is eroding" could be tested by repeated soundings). The stability assumption, by contrast, defines what counts as evidence (a normal sounding) versus error (an anomaly). It is not confirmed by soundings; it sets the rules for interpreting them. It also differs from (ii) a communal assumption unchallenged by the group. Communal assumptions are sociological facts—people don’t question them out of habit. But the framework role is logical: it enables the practice. If the Office questioned stability, pooling soundings would collapse. The communal silence reflects necessity, not mere convention.  

  **(b)** The retirement is rational, but not as a normal empirical update. The protocol uses anomalies (discarded as errors) as evidence against stability. But anomalies only exist because the framework defines them: they are deviations from a stable Bank. This circularity means the evidence is internal to the framework. Retirement is thus a framework shift—a "conversion," not falsification. Wittgenstein notes hinges can change, but this is radical: the rules of evidence transform. The director follows a predefined rule (retire at 20% anomalies), which is rational as it maintains the practice’s usefulness. Without such a protocol, clinging to stability amid rising anomalies would be dogmatic. The Tidalists claim stability was testable all along because their altimetry never assumed it. They see anomalies not as errors but as evidence of change. This shows an external method can challenge the framework. But the Office’s retirement doesn’t rely on the Tidalists; it uses internal criteria. The Tidalists’ claim highlights that the assumption was always *potentially* revisable, but only via a framework shift, not direct testing. Rationality here lies in adapting the practice when internal friction (rising anomalies) signals poor fit with the world.  

  **(c)** The critic is wrong: the framework account avoids relativism without an external standard. The key difference between the Office and the paranoid patient is functional. The Office’s stability assumption enables a shared, productive practice (charting) with built-in revision (the protocol). When anomalies rise, the framework is adjusted to restore coherence. The patient’s delusion, however, shuts down inquiry: "poisoned food" isn’t part of a practice generating knowledge; it is isolated and inflexible, ignoring all counter-evidence without revision rules. This functional difference—enabling vs. disabling inquiry—distinguishes hinges from delusions. Relativism is avoided because frameworks are not arbitrary "what we accept" but are tied to successful practices open to internal revision. The Tidalists’ method provides an alternative route to knowledge, which may aid transitions (e.g., validating migration post-retirement). But it isn’t essential for the distinction. Even without the Tidalists, the Office’s practice is self-correcting via its protocol, while the patient’s is not. The framework account thus doesn’t collapse: it shows how commitments are anchored in practices that respond to the world, not in subjective certainty.  

  ---

  ### Marking Scheme (25 marks total)  
  **Part (a) (8 marks):**  
  - **Framework role as hinge (2 marks):** Must state it enables evidence/interpretation.  
    *Top move:* "It is not tested but makes evidence possible (e.g., anomalies defined as errors)."  
    *Common failure:* Treating it as a basic belief (foundationalism).  
  - **Differs from empirical hypothesis (2 marks):** Must contrast testability vs. enabling role.  
    *Top move:* "Hypotheses are falsifiable; framework sets rules for what counts as evidence."  
    *Common failure:* Calling it a "very well-confirmed hypothesis."  
  - **Differs from communal assumption (2 marks):** Must separate logical necessity from social habit.  
    *Top move:* "Communal silence is sociological; framework is logical (practice collapses without it)."  
    *Common failure:* Equating it with "what the group accepts by convention."  
  - **Case illustration (2 marks):** Must use pooling/discarding anomalies.  
    *Top move:* "Pooling soundings requires stability to define anomalies as errors."  
    *Common failure:* Generic examples without case specifics.  

  **Part (b) (10 marks):**  
  - **Rationality as non-empirical revision (2 marks):** Must reject standard falsification.  
    *Top move:* "Retirement is a framework shift ('conversion'), not hypothesis falsification."  
    *Common failure:* Calling it "evidence proving instability."  
  - **Circularity acknowledged (2 marks):** Must note evidence depends on the assumption.  
    *Top move:* "Anomalies presuppose stability, so evidence is internal."  
    *Common failure:* Ignoring circularity (e.g., "anomalies directly show instability").  
  - **Revision mechanism (2 marks):** Must cite protocol as predefined rule.  
    *Top move:* "Protocol adapts practice when anomalies exceed threshold."  
    *Common failure:* Describing retirement as "learning from evidence" within the framework.  
  - **Tidalists’ claim (2 marks):** Must show it challenges but doesn’t dictate revision.  
    *Top move:* "Tidalists offer external method, but Office revises internally."  
    *Common failure:* Claiming Tidalists "prove" instability or make retirement redundant.  
  - **Rationality justification (2 marks):** Must tie to practice’s usefulness.  
    *Top move:* "Rational as it resolves friction (rising anomalies) to sustain the practice."  
    *Common failure:* Dismissing retirement as "irrational due to circularity."  

  **Part (c) (7 marks):**  
  - **Functional difference (2 marks):** Must contrast enabling vs. disabling inquiry.  
    *Top move:* "Office’s practice is shared/revisable; delusion is isolated/inflexible."  
    *Common failure:* Answering "the patient’s belief is false."  
  - **Relativism rejected (2 marks):** Must appeal to revisability/productivity.  
    *Top move:* "Frameworks avoid relativism by being useful and self-correcting."  
    *Common failure:* Accepting relativism or appealing to "external truth."  
  - **Tidalists’ role (2 marks):** Must show it’s helpful but not essential.  
    *Top move:* "Provides alternative method but doesn’t define framework/delusion distinction."  
    *Common failure:* Claiming Tidalists are "necessary to avoid relativism."  
  - **Conclusion (1 mark):** Must reject collapse/external standard.  
    *Top move:* "Account stands without relativism or external standards."  
    *Common failure:* Concluding framework account "fails" or "needs external truth."  

  **Key misconceptions (automatic mark deductions if present):**  
  - *Misconception:* Treating framework propositions as basic beliefs (foundationalism).  
    *Diagnostic:* "The stability assumption is a foundational belief." (Deduct 2 marks)  
  - *Misconception:* Answering delusion objection by citing falsity.  
    *Diagnostic:* "The patient is wrong, but the Office is right." (Deduct 2 marks)  
  - *Misconception:* Framing "cannot be doubted" as psychological impossibility.  
    *Diagnostic:* "We are psychologically unable to doubt stability." (Deduct 1 mark)  
  - *Misconception:* Ignoring circularity in retirement.  
    *Diagnostic:* "Anomalies are direct evidence against stability." (Deduct 2 marks)  

  **Grade Boundaries:**  
  - **Distinction (A):** 20+ marks  
  - **Merit (B):** 15–19 marks  
  - **Pass (C):** 10–14 marks  
  - **Fail:** Below 10 marks  

  **Discrimination Note:**  
  The single move separating A from B scripts is in part (c): articulating the functional difference between framework and delusion (e.g., "enabling shared, revisable practice" vs. "shutting down inquiry") without appealing to truth/falsity or communal acceptance. Top scripts make this move explicitly; B scripts gesture at it weakly or default to "we accept it."  

