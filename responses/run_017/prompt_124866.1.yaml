prompt: |-
  I have just come away from a long and rather unsatisfying argument with an old friend who works as a research hydrologist, and I want to turn what went wrong in it into a final-exam question. Her position, pressed with considerable impatience, was that any conviction for which you cannot specify in advance what would count as evidence against it is not a belief but a prejudice, and that good scientists retire exactly those convictions by finding data that contradict them. I found myself defending the Wittgensteinian thought that some commitments are not held on evidence at all but are rather what makes evidence possible — and I defended it badly. Two things undid me. She asked how, on my account, you tell the difference between such a commitment and a paranoid delusion, given that both are held in the face of what the rest of us call counter-evidence. And she pointed out that her own field maintains formal procedures for retiring the assumptions its instruments presuppose, which on my account ought to be impossible. I want my students put under precisely that pressure, in a form in which reciting the vocabulary of the topic gets them nothing.

  The setting: a third-year undergraduate epistemology seminar, closed-book final, ninety minutes for a single question worth 25 marks, with students expected to write about 900 words. They have read the primary text — Wittgenstein's late notes published as On Certainty — and a general survey of epistemology. Assume no knowledge of the secondary literature, and do not let the question or the answer depend on it: I want no reading list, no citations, no "as so-and-so has argued", and no move that is licensed merely by attributing a view to a commentator. Every move in the model answer should be one a strong student could have produced from the primary text plus argument.

  Here is the case I want built into the question. The Kestrel Hydrographic Office has charted the Kestrel Bank for a century. Its survey method treats the Bank as geologically stable: soundings taken years apart are pooled into a single depth model, and an individual anomalous sounding is discarded as instrument error. That the Bank does not move is not something the Office has evidence for; it is what makes the pooling of soundings into one chart possible at all. Over thirty years the proportion of discarded anomalies has risen steadily, and eventually the director invokes the Office's standing revision protocol: when more than one sounding in five must be discarded, the stability assumption is to be retired and replaced by a model in which the Bank migrates. The retirement is authorised by counting discarded anomalies — that is, by a procedure that itself presupposes the very assumption being retired. Meanwhile a separate team, the Tidalists, has for some years produced independent estimates of the Bank's position by satellite altimetry, a method that never presupposed stability; they argue the assumption was testable all along. The Kestrel Bank is invented, so please do not try to look it up, and do not import facts about real hydrography or real satellite methods into the case.

  Please produce:

  1. The question itself, in a form I can paste into the paper, with sub-parts and marks allocated (I have in mind something like: a part demanding an account of what it is for a proposition to play this framework role, and how that differs both from being a well-confirmed empirical hypothesis and from being merely something no one in the community thinks to question; a part asking whether the director's retirement of the assumption is a rational revision, given that the only evidential standards available are ones the assumption itself makes possible; and a part in which a critic says the framework account cannot distinguish the Office's assumption from a patient's conviction that his food is being poisoned, and so either collapses into relativism or must smuggle in an external standard — with the student required to say what work, if anything, the Tidalists' independent method does).

  2. A model answer of roughly 700 words, written as a strong but not miraculous student's script rather than as a polished paper. It should, among other things, distinguish revision-as-conversion from revision-as-evidence-response and take a stand on which the protocol enacts; say what functional difference between a framework commitment and a delusion could do the work without appealing to "it is one we accept"; and say whether the relativity of framework-hood to a practice is a relativism about anything that matters.

  3. A marking scheme organised around the specific moves a top script must make, with the marks each is worth out of 25, and, for each move, the one characteristic way candidates get it wrong. I especially want named the error of treating framework propositions as basic beliefs in the foundationalist sense, the error of answering the delusion objection by saying the patient's belief is false, and the error of resting on "cannot be doubted" understood as psychological impossibility. Finish the scheme by stating the single move that most reliably separates an A script from a B script.

  4. After the model answer and the marking scheme, a JSON object — valid JSON, nothing after it — with this schema:

  must_hit_points: an array of objects, each with keys id (short string), part (which sub-part it belongs to), claim (one sentence: what the candidate must establish), marks (integer), top_move (one sentence: the specific move that earns full marks), common_failure (one sentence: the specific way a weaker script falls short).

  misconceptions: an array of objects, each with keys misconception (string), diagnostic (the kind of sentence in a script that reveals it), marks_lost (integer).

  boundaries: an object with keys distinction, merit, pass (integers: the mark thresholds).

  discrimination_note: a string of one or two sentences on which single move separates the top band from the one below.

  case_revisions: an array of objects, each with keys issue (anything in the stem that is ambiguous enough to let a candidate wiggle out of the question or that makes an intended answer unavailable) and fix (a concrete rewording).
reasoning: |-
  We are creating an exam question based on the described scenario and philosophical problem. The question has three parts (a, b, c) and is worth 25 marks total. We also need a model answer, a marking scheme, and additional data in JSON format.

  Question Structure:

  Part a: (8 marks) Explain what it means for a proposition to play a "framework role" in a practice such as the Kestrel Hydrographic Office's charting. How does this role differ from (i) being a well-confirmed empirical hypothesis and (ii) being a mere communal assumption that no one thinks to question? Use the case to illustrate.

  Part b: (10 marks) The director of the Hydrographic Office retires the stability assumption when the proportion of discarded anomalies exceeds 20%. Is this retirement a rational revision of the framework? In your answer, consider that the evidential standard (counting discarded anomalies) is only available because the stability assumption is in place. How does this relate to the Tidalists' claim that the assumption was testable all along?

  Part c: (7 marks) A critic argues that the framework account cannot distinguish the Hydrographic Office's stability assumption from a paranoid patient's conviction that his food is being poisoned. Both are held in the face of what others see as counter-evidence. Does this mean the framework account collapses into relativism, or must it appeal to an external standard? In your answer, discuss what role, if any, the Tidalists' independent method plays in addressing this problem.

  Total: 25 marks.

  Now, the model answer (approx 700 words) as a strong student script.

  Model Answer:

  (a) In the Kestrel Hydrographic Office's practice, the proposition that the Kestrel Bank is geologically stable plays a framework role. This means it is not an empirical claim that is tested by the soundings but a rule that structures the practice of interpreting the soundings. Without assuming stability, the Office could not pool soundings taken at different times into a single depth model. An individual sounding that does not fit would be seen as an error of the instrument, not as evidence of change. Thus, the stability assumption is what Wittgenstein calls a "hinge" proposition: it is fixed, and the practice turns around it. It is not a hypothesis because it is not inferred from evidence and is not subject to confirmation or disconfirmation by the data it helps interpret. It differs from a well-confirmed empirical hypothesis in that the latter is supported by evidence and could be overturned by new evidence. Here, the stability assumption is prior to evidence: it defines what counts as evidence (a good reading) and what counts as an error (an anomaly). It also differs from a mere communal assumption that no one questions because, although the community does not question it, the framework role is functional: it is necessary for the practice. If the community questioned it, the practice would collapse or change fundamentally. The communal assumption is a sociological fact, but the framework role is logical: it is what makes the practice of pooling soundings possible.

  (b) The director's retirement of the stability assumption is rational, but it is not a straightforward empirical revision. The protocol uses the count of discarded anomalies, which relies on the stability assumption (since anomalies are defined as deviations from a stable bank). Thus, the evidence that triggers the retirement is internal to the framework. This is a revision of the framework itself, not an empirical finding within it. Wittgenstein notes that sometimes a hinge proposition can be modified, but this is a radical change, like a conversion. The Tidalists, using satellite altimetry, never assumed stability and claim the assumption was testable all along. From their perspective, the anomalies were not errors but evidence of change. The Office's retirement is not a response to evidence in the usual sense because the evidence (anomalies) was always interpreted within the framework. However, the rising anomaly rate becomes a reason to abandon the framework when it reaches a predefined threshold. This is a rational, rule-governed shift, but it is not the same as falsifying a hypothesis. The Tidalists' method shows that the Bank's movement can be measured without assuming stability, so their independent standard provides an external check. But the Office's protocol does not require the Tidalists' input; it is triggered internally. The rationality lies in following a procedure that allows the practice to adapt when the framework leads to too many anomalies, which might indicate that the framework is no longer serving its purpose.

  (c) The critic argues that the framework account cannot distinguish the Office's stability assumption from a paranoid delusion. Both are held despite what others see as counter-evidence. However, the framework account does not collapse into relativism and does not need an external standard to distinguish them. The key difference is functional: the stability assumption is part of a shared, public practice that produces useful results (nautical charts). The paranoid belief is not part of such a practice; it is isolated and does not enable any collective inquiry. The Tidalists' independent method shows that the stability assumption is not an arbitrary framework: it can be compared with other methods. But even without the Tidalists, the Office's practice has internal criteria for revision (the protocol). This does not make the framework relative to the community in a pernicious way because the revision protocol is responsive to the world: when the anomaly rate rises, it suggests the world does not fit the framework. The paranoid patient, by contrast, has no such revision mechanism and is not engaged in a practice that produces shared knowledge. Therefore, the framework account does not imply that any belief held firmly is a framework commitment. The Tidalists' role is that they provide an alternative method, which may help in the transition, but the distinction between framework and delusion does not depend on it. The difference lies in the role the belief plays: one enables a shared, revisable practice; the other is a fixed idea that shuts down inquiry. This avoids relativism because the framework is not just "what we accept" but what has proven useful and is open to revision when it fails.

  [Word count: approx 700]

  Marking Scheme (25 marks total):

  We break down the marks by the required moves in each part.

  Part a (8 marks):
  - Correct account of framework role (hinge proposition) as enabling evidence (2 marks). Common error: calling it a basic belief (foundationalism) or a hypothesis.
  - Distinguishing from empirical hypothesis: empirical is testable, framework is not (2 marks). Common error: saying framework is just a very well confirmed hypothesis.
  - Distinguishing from communal assumption: not just sociological but logical role (2 marks). Common error: treating it as merely conventional without necessity for the practice.
  - Using the case illustration (2 marks). Common error: generic explanation without reference to the pooling of soundings and discarding anomalies.

  Part b (10 marks):
  - Recognizing that the retirement is rational but not a standard empirical revision (2 marks). Common error: treating it as falsification of a hypothesis.
  - Explaining that the evidence (anomalies) is framework-dependent (2 marks). Common error: saying the anomalies are direct evidence against stability.
  - Describing revision as a "conversion" or change of framework (2 marks). Common error: describing it as a normal evidence update.
  - Discussing the Tidalists' claim: their method shows an alternative without the assumption (2 marks). Common error: saying the Tidalists prove the Office wrong.
  - Evaluating the rationality: following a predefined protocol that adapts the practice (2 marks). Common error: saying it is irrational because circular.

  Part c (7 marks):
  - Addressing the delusion objection: functional difference (enabling shared practice vs. shutting down) (2 marks). Common error: answering that the patient's belief is false (truth is not the point) or that we know it's false.
  - Rejecting relativism: the framework is revisable and productive (2 marks). Common error: accepting relativism or appealing to an external truth.
  - Role of Tidalists: they provide an alternative but are not necessary for the distinction (2 marks). Common error: saying the Tidalists are the only way to avoid relativism.
  - Concluding that the framework account does not collapse (1 mark). Common error: concluding it does collapse or must appeal to external standard.

  The single move that separates A from B: In part c, the ability to articulate the functional difference between a framework commitment and a delusion without appealing to truth or communal acceptance, but to the role in enabling and sustaining a shared, revisable practice.

