prompt: |-
  I am writing to ask for something quite specific, and I would rather explain the situation than have you guess at it. I spent thirty-five years as an experimental condensed-matter physicist, mostly on phase transitions, and I retired four years ago. Since then I have been reading philosophy of science in a fairly disciplined way, and I let myself be persuaded to join the refereeing panel of an interdisciplinary journal that publishes on complex systems. Roughly a dozen manuscripts a year reach me in which the word emergent is doing real argumentative work: it is the reason the paper is supposed to be interesting, the reason a derivation is said to be unnecessary, or the reason a modelling assumption is said to be safe. My recommendations on these have not been consistent. Last spring I recommended acceptance of a paper on stop-and-go waves in traffic and rejection of one on collective motion in flocks, and when the handling editor — a professional philosopher — asked me what distinguished them, I found that what I had written amounted to an intuition about which authors were being careful. She was entitled to ask, and I would like to answer her properly the next time.

  What I want from you is not an essay about emergence. It is a procedure I can run on a manuscript, in the order given, and defend to an editor. Before I say what it has to do, let me tell you the provisional scheme I have been carrying around, because I would like you to build on it and also to tell me plainly which parts of it are confused. I have been using three tests. First, what I call the substitution test: if you alter the micro-level constituents or the micro-level dynamics substantially, does the macro-level regularity survive unchanged? My instinct, from my own field, is that survival under this kind of variation is the real content of emergence claims, and that a macro regularity which dissolves the moment the details change is a summary of the parts and not a finding about them. Second, what I call the two-way prediction test: how well can one predict the macro state from the micro state, and how well can one predict the micro state from the macro state? Where the downward direction is systematically degenerate — many micro arrangements compatible with one macro state, and nothing at the micro level selecting among them — I have been inclined to say the macro level is autonomous. Third, what I call the derivation debt: a paper that claims emergence ought to say what a completed derivation from the micro level would consist of, which bridge assumptions and which limiting or idealising steps it would require, and how far the present paper is from providing one. A claim with no stated debt has always struck me as promissory.

  I am not confident about any of this. I cannot tell whether robustness under substitution is the same property as autonomy or merely evidence for it; I cannot tell whether my second test is a claim about the world or about the notation we happen to use; and I suspect the third conflates our being finite with nature's being inexhaustible, which are not the same thing and which I would want kept apart if they can be.

  So here is what I need. Give me a decision procedure, in the order the questions are to be asked, that starts from what a manuscript actually contains and not from what a well-read author might have said elsewhere. For each question say what would count as a sufficient answer at the level of evidence papers in this area really provide, and say where the procedure terminates in a negative verdict — the point at which I am entitled to write that the emergence claim is unsupported and needs no rebuttal, rather than being asked to refute it. Mark separately the places where the procedure must stop and hand the decision to me, because what is at issue is not a fact about the system but a decision about what the journal should mean by the word, and I should not pretend that such a decision was delivered by the method. Two classes of case worry me especially and must be handled rather than set aside: manuscripts in which the macro state is said to act back on the parts, so that the causal arrow is claimed to run downwards; and manuscripts, most of them from biology and neuroscience, where the micro level is not fully characterised or is itself contested, so that the substitution test cannot literally be run. That second situation is nothing like the one I was trained in, and I do not want a procedure that quietly presupposes a finished micro theory.

  Then I want the procedure applied, in full and without abbreviation, to three manuscripts of a kind I actually receive. One reports stop-and-go waves in highway traffic, which appear without any driver intending them and propagate backwards through the flow. One is from my own former field and argues that the universality of critical exponents — the fact that systems with entirely different microphysics share exponents and scaling functions — is a case of emergence, and I should say at once that this is the example I have long regarded as the paradigm, so I am not a neutral reader of it. One concerns a decentralised collective, a robot swarm or an ant colony, and attributes to the collective a goal-directedness or a form of agency that no individual unit has; this is the kind of paper I instinctively dismiss as anthropomorphism, and I expect to dislike whatever the procedure tells me about it. I would rather be told I am wrong than have my instincts confirmed by flattery, so please let the procedure give its verdict and let me argue with it afterwards.

  Finally, tell me in plain terms where the procedure will misfire: which kinds of system it will systematically over-credit or under-credit, which kinds of author it will reward for rhetoric, and which questions it cannot settle even in principle. I have about an hour per manuscript, I am not a philosopher, and the person who receives my recommendation is one; my output is a single paragraph saying reject, revise, or accept, with reasons the editor can check.

  Two requests about form and content. Please write the whole thing as continuous prose in the manner of a letter: no headings, no bullet points, no bold text, no tables; if the steps must be numbered, number them inside the running text. Aim for somewhere between a thousand and fourteen hundred words. And do not give me references, reading lists, or a survey of the literature by name — I can find that myself, and what I cannot find for myself is exactly what I am asking you for.
reasoning: |-
  Okay, the user is a retired condensed-matter physicist now refereeing interdisciplinary complex systems papers where "emergence" is central. They need a practical, step-by-step procedure to evaluate emergence claims in manuscripts, building on their existing three tests but addressing their uncertainties. 

  First, I need to unpack their core concerns: Their substitution test (robustness under micro-changes) feels intuitively right but they're unsure if it defines emergence or just indicates it. The two-way prediction test (micro↔macro predictability) seems muddled between ontological and epistemological claims. The derivation debt feels conflated with human limitations versus fundamental irreducibility. 

  The procedure must: handle downward causation cases; work when micro-levels are ill-defined (common in bio/neuroscience); produce defensible rejections without needing full rebuttals; and explicitly flag where editorial judgment calls are needed. They especially want it applied to three concrete examples: traffic waves (which they accepted), critical exponents (their "paradigm" case), and collective agency (which they instinctively dismiss).

  Hmm—their biases are noteworthy: They openly admit favoring the critical exponents example and skepticism toward collective agency claims. The procedure must override these where evidence dictates. Also key: They have only ~1 hour per manuscript and must write a concise verdict for a philosopher editor. No jargon, no literature reviews—pure practicality.

  For the procedure's structure, I'll sequence it as: 
  1. Macro-phenomenon clarity check (what exactly is claimed emergent?) 
  2. Micro-foundations transparency (are components/interactions specified?) 
  3. Substitution test adaptation (even for incomplete micro-theories) 
  4. Two-way predictability assessment (with downward causation caveats) 
  5. Derivation debt articulation (demanding concrete pathways, not promissory notes) 

  Crucially, I'll build robustness into substitution: For contested micro-levels (like neuroscience), ask "If we vary plausible alternative micro-models, does the pattern persist?" Not ideal but workable. For downward causation, require evidence beyond correlation—like controlled interventions showing macro-state changes alter micro-dynamics. 

  The traffic waves example should pass easily: Micro (cars/drivers) varied via simulations/real traffic; macro-pattern robust; derivation debt partly paid via PDE models. Critical exponents will pass but reveal their derivation debt is heavier than they recall—universality classes still lack first-principles derivations for many systems. Collective agency cases will likely fail derivation debt unless authors quantify goal-directedness or show downward causation experimentally. 

  Biggest misfire risks: Over-crediting elegant math without empirical validation; under-crediting field observations where micro-variation is impractical (e.g., ecosystems). Also, rhetorically savvy authors might "pass" by vaguely gesturing at derivation pathways without substance. 

  Finally, I'll emphasize where judgment is unavoidable: When derivation debts are deemed "acceptable" versus "excessive," or when downward causation evidence is circumstantial but compelling. The editor must own those calls. 

  This should give them a concrete, defensible filter—and likely challenge their instincts on collective agency papers.
answer: |-
  My dear colleague,  

  Thank you for this extraordinarily clear request. I’ll provide a decision procedure for evaluating emergence claims in manuscripts, built directly on your three tests but refined to address your uncertainties. The procedure is sequential: if a manuscript fails an early step, you may stop (with clear grounds for rejection). Where judgment is unavoidable—where philosophy must intervene—I’ll mark it explicitly with **［JUDGMENT REQUIRED］**. I’ll then apply it rigorously to your three cases and outline its limitations in plain terms.  

  ### The Procedure  
  1. **Identify the macro-regularity and its micro-basis.**  
     What *precisely* is claimed as emergent? (e.g., "stop-and-go waves," "universal scaling"). What are the claimed micro-constituents and their dynamics? (e.g., cars/drivers, spins/atoms).  
     *Sufficient evidence*: The manuscript must define both in operational terms (observable or computable). If the macro-phenomenon is vague (e.g., "intelligence," "agency") or the micro-foundations are undefined, stop. Verdict: **Reject** (claim is ungrounded).  
     *Handles contested micro-levels*: If micro-foundations are disputed (e.g., neuroscience), require authors to state their assumptions explicitly. Proceed if assumptions are testable.  

  2. **Apply the *substitution test* (robustness under micro-variation).**  
     Does the manuscript show that the macro-regularity persists under *non-trivial changes* to micro-components or dynamics? (e.g., simulating traffic with different car-following models; testing critical exponents across material classes).  
     *Sufficient evidence*: Empirical data, simulations, or analytical proofs varying micro-parameters while holding macro-conditions fixed. If authors show no variation data, stop. Verdict: **Reject** (robustness unverified; phenomenon may be artifact).  
     *Handles incomplete micro-theories*: If micro-foundations are unknown (e.g., cell signaling in embryogenesis), authors must propose *plausible alternative micro-models* and test against them. No alternatives offered? Verdict: **Reject**.  

  3. **Apply the *two-way prediction test* (autonomy).**  
     (a) *Upward prediction*: How reliably can micro-states predict the macro-state?  
     (b) *Downward prediction*: How reliably can the macro-state predict micro-states?  
     *Sufficient evidence*: Quantitative measures (e.g., entropy, degeneracy, prediction error). High upward but low downward predictability (many micro-states → one macro-state) suggests autonomy.  
     *Downward causation*: If authors claim "downward causation" (macro-state influences micro-dynamics), require evidence that micro-states are *constrained* by the macro-regularity (e.g., traffic waves altering individual driver behavior). Correlation ≠ causation; **［JUDGMENT REQUIRED］** on whether evidence suffices.  

  4. **Assess the *derivation debt*.**  
     What would a full derivation from micro to macro require? Authors must:  
     (a) Specify necessary bridge assumptions (e.g., mean-field approximations).  
     (b) Identify limiting steps (e.g., thermodynamic limit, coarse-graining scale).  
     (c) State how far the manuscript is from achieving this (e.g., "We derive the phase transition but not scaling exponents").  
     *Sufficient evidence*: A concrete pathway, even if incomplete. No pathway described? Verdict: **Reject** (promissory note). Vague gestures (e.g., "future work will derive it") are insufficient. **［JUDGMENT REQUIRED］** on whether the debt is acceptable for the journal.  

  ### Application to Your Cases  
  **Traffic Waves Manuscript**  
  1. Macro: Back-propagating stop-and-go waves. Micro: Cars/drivers with acceleration rules. *Defined operationally*. → Proceed.  
  2. Substitution test: Simulations with varied car-following models (e.g., IDM vs. Gipps) show persistent waves. Real-world data across highways. *Robustness demonstrated*. → Proceed.  
  3. Two-way prediction: Upward—micro-states (car positions/speeds) predict wave onset. Downward—waves predict *ranges* of driver behavior (e.g., braking) but not exact actions. *Autonomy supported*. No downward causation claimed. → Proceed.  
  4. Derivation debt: PDE models (e.g., Burgers' equation) derived from micro-rules; scaling relations fitted but not fully derived. *Debt articulated, partial payment*. **［JUDGMENT REQUIRED］** on adequacy.  
  *Verdict*: **Accept** (if derivation debt deemed acceptable).  

  **Critical Exponents Manuscript**  
  1. Macro: Universality of exponents. Micro: Atomic spins, fluid molecules, etc. *Defined*. → Proceed.  
  2. Substitution test: Exponents identical across Ising models, ferrofluids, liquid crystals. *Robustness proven*. → Proceed.  
  3. Two-way prediction: Upward—micro-states predict criticality. Downward—macro-state (critical point) predicts *equivalence classes* of micro-configurations (renormalization flow). *Autonomy clear*. → Proceed.  
  4. Derivation debt: Renormalization group theory *provides* derivation pathway; approximations (e.g., momentum cutoff) stated. *Debt paid*. → Proceed.  
  *Verdict*: **Accept**.  

  **Collective Agency Manuscript**  
  1. Macro: "Goal-directed swarm behavior." Micro: Robots/ants with local rules. *Ambiguous definition of "goal-directed."* **［JUDGMENT REQUIRED］** Is "goal" operationalized (e.g., resource retrieval efficiency)? If not, **Reject**. Assume it is. → Proceed.  
  2. Substitution test: Swarm achieves goal under varied individual algorithms. *Robustness shown?* If yes → Proceed.  
  3. Two-way prediction: Upward—micro-rules predict swarm trajectories. Downward—authors claim "swarm goal" influences individual actions. *Require evidence*: e.g., individuals altering behavior when swarm goal changes. If absent, stop. Verdict: **Reject** (downward causation unsupported).  
  4. Derivation debt: No pathway from micro-rules to "agency" (no mathematical formalism for "goals"). *Debt unstated*. → **Reject**.  
  *Verdict*: **Reject** (fails steps 3–4).  

  ### Where the Procedure Misfires  
  - **Over-credits**: Elegant mathematical models with no empirical validation (e.g., showing robustness *only* in simulations with untested assumptions).  
  - **Under-credits**: Systems where micro-variation is unethical or impossible (e.g., ecosystem emergence; substitution test infeasible).  
  - **Rewords rhetoric**: Authors who "pass" by listing derivation steps without substance (e.g., "bridge assumptions exist" without specifying them).  
  - **Cannot settle**:  
     - Whether autonomy implies *ontological* novelty (vs. epistemological convenience). **［JUDGMENT ALWAYS REQUIRED］**.  
     - Whether downward causation is "real" or a descriptive shortcut. **［JUDGMENT REQUIRED］**.  
     - The boundary between "acceptable" and "excessive" derivation debt. **［JUDGMENT REQUIRED］**.  

  The procedure will force authors to clarify claims, demonstrate robustness, and admit gaps. It protects you from refuting vague emergence—failures at Steps 1, 2, or 4 justify rejection without rebuttal. Your role is to judge only where philosophy and editorial policy intersect. For your hour per manuscript: Focus on Steps 1 (clarity) and 4 (debt articulation)—they trip up most papers. Your instincts on collective agency were sound; the procedure formalizes why.  

  Yours in service to clarity,  
  —A fellow traveler
