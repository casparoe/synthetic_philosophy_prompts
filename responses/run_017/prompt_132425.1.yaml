  ### What the Activity Can’t Stage  
  The activity shows *how* kinematics works and when it breaks, but it can’t resolve the normative question: "Should rationality *require* rigidity, or is it a default?" Close by arguing:  
  - Rigidity is a *minimal* assumption when you lack meta-information (e.g., about channel drift).  
  - But if new evidence challenges the reliability of the update (e.g., "the lab assay was drifting"), rigidity isn’t rational—you *should* recalibrate conditionals.  
  - This mirrors your dog’s ultrasound: the 60% shift was brute; the drifting assay signaled that rigidity might fail.
