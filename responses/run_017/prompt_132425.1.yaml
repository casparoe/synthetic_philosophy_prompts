  ### Activity: "Uncertain Evidence & the Order of Updating"  
  **Time:** 80-minute seminar  
  **Students:** 14 (split into 7 groups of 2)  
  **Materials:**  
  - Handout (1 per group) with scenarios, probabilities, and formulas  
  - Calculators (students can use phones)  
  - Scorecards (for reporting probabilities)  
  - Whiteboard for recording group results  
  - Coin (for determining truth in scoring)  

  **Scoring:** Quadratic scoring rule. Students report probabilities for hypothesis H. After truth is revealed:  
  - If H true: Score = 10 × [1 - (1 - reported P(H))²]  
  - If H false: Score = 10 × [1 - (reported P(H))²]  
  Scores translate to quiz points (max 10). Ensures honest reporting.  

  ---

  ### Timeline (80 Minutes Total)  
  **0–10 min: Setup & Round 1 (Certain Evidence)**  
  - **Setup (3 min):** Explain activity, scoring, and split into groups. Distribute handouts.  
  - **Round 1 Task (7 min):** Groups update on two *certain* pieces of evidence (A+ and B+).  
    - Prior: P(H) = 0.3 (H = "disease present").  
    - Test A: Learns A+ (P(A+|H) = 0.8, P(A+|~H) = 0.1).  
    - Test B: Learns B+ (P(B+|H) = 0.7, P(B+|~H) = 0.2).  
    - Half groups update A+ then B+; half update B+ then A+.  
    - **Payoff:** Groups report final P(H). No scoring yet (truth revealed later).  

  **10–25 min: Round 2 (Uncertain Evidence, Two-Way Partition)**  
  - **Task (15 min):** Groups update on two *uncertain* shifts (no certain proposition learned).  
    - Same prior/likelihoods as Round 1.  
    - Shift 1 (A): Set P(A+) = 0.7, P(A−) = 0.3.  
    - Shift 2 (B): Set P(B+) = 0.6, P(B−) = 0.4.  
    - Update rule: New P(H) = [Prior P(H|A+)] × new P(A+) + [Prior P(H|A−)] × new P(A−) [provided on handout: P(H|A+) ≈ 0.774, P(H|A−) ≈ 0.087; P(H|B+) = 0.6, P(H|B−) ≈ 0.138].  
    - 3 groups: A then B. 3 groups: B then A. 1 group does both orders.  
    - **Payoff:** Report final P(H) on scorecard.  

  **25–40 min: Round 3 (Uncertain Evidence, Three-Way Partition)**  
  - **Task (15 min):** Groups update on partitions of different granularity.  
    - New prior: P(H) = 0.5 (H = "disease present").  
    - Partition: {E1, E2, E3} with priors P(E1) = 0.4, P(E2) = 0.4, P(E3) = 0.2; conditionals P(H|E1) = 0.9, P(H|E2) = 0.2, P(H|E3) = 0.3.  
    - Coarse partition: F = {E1, E2} (so ~F = E3).  
    - Shift 1 (Coarse): Set P(F) = 0.9, P(~F) = 0.1.  
    - Shift 2 (Fine): Set P(E1) = 0.5, P(E2) = 0.3, P(E3) = 0.2.  
    - Update rule: Use prior conditionals (e.g., new P(H) for coarse shift = [Prior P(H|F)] × new P(F) + [Prior P(H|~F)] × new P(~F) [provided: P(H|F) = 0.55, P(H|~F) = 0.3]).  
    - 3 groups: Coarse then fine. 3 groups: Fine then coarse. 1 group does both.  
    - **Payoff:** Report final P(H).  

  **40–55 min: Truth Reveal & Scoring**  
  - **Truth determination (5 min):** Flip biased coin (P(H) = 0.3) to determine actual H (recorded pre-class for consistency). Reveal truth to class.  
  - **Scoring (10 min):** Calculate scores using quadratic rule. Groups compare scores.  

  **55–80 min: Debrief (25 min)**  
  - **Key discoveries (15 min):**  
    - **Round 1 (Certain Evidence):** All groups have same final P(H) (~0.875). Shows ordinary conditionalization commutes—order doesn’t matter when evidence is certain.  
    - **Round 2 (Uncertain Evidence):** Groups report different P(H) for A-then-B (≈0.415) vs. B-then-A (≈0.568). Establishes:  
      - Kinematics rule isn’t redundant (no proposition to conditionalize on).  
      - Rigidity fails (conditional probabilities changed due to base-rate shift, but rule assumed fixity)—this is why order matters.  
    - **Round 3 (Three-Way):** Groups report different P(H) for coarse-then-fine (0.57) vs. fine-then-coarse (≈0.525). Shows partition choice is substantive—coarsening loses information.  
  - **Normative gap (10 min):**  
    - Activity shows kinematics is *descriptive* (how shifts *can* propagate) but doesn’t settle if rigidity is rational.  
    - When signal reveals channel untrustworthiness (e.g., "drifting assay"), rigidity fails—rule isn’t applicable.  
    - Conclusion: Kinematics is a tool, but its assumptions (fixed conditionals, partition choice) are defeasible.  

  ---

  ### Predictable Issues & Fixes  
  1. **Students refuse to commit to a number:**  
     - *Why:* Anxiety about "wrong" answers.  
     - *Fix:* Emphasize scoring rewards honesty, not accuracy. Show example calculation.  

  2. **Students re-derive priors instead of updating:**  
     - *Why:* Misunderstanding kinematics (treating shifts like new priors).  
     - *Fix:* Walk through one update step live. Handout highlights: "Use current probabilities, not priors, for inputs."  

  3. **Groups talk across tables:**  
     - *Why:* Curiosity about order effects.  
     - *Fix:* Assign roles (e.g., "Group 3A: A then B only"). Record results privately first.  

  4. **Computation errors:**  
     - *Why:* Fractions vs. decimals, misapplied formulas.  
     - *Fix:** Provide pre-computed conditionals (e.g., P(H|A+)) on handout.  

  ---

  ### Handout (Abbreviated)  
  **Round 1 (Certain Evidence)**  
  - Prior: P(H) = 0.3  
  - Test A: You learn A+ (P(A+|H) = 0.8, P(A+|~H) = 0.1). Update P(H) via Bayes.  
