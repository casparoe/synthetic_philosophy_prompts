  ### Detailed Feedback  
  **General Note:** The answer is clear and mostly correct in (a) and (b), but (c) contains a critical error in reasoning.  

  ---

  #### **(a) [7 marks: Student scores 6/7]**  
  **Student's Answer:**  
  > Calibration within groups says that the score means the same thing in both groups: for any value s, of the people in group a who are assigned the score s, a fraction s actually has Y = 1. Balance for the negative class says that the average score received by people with Y = 0 is the same in the two groups, and balance for the positive class says the same for people with Y = 1.  
  >  
  > The impossibility result says that no score can satisfy all three at once. More precisely, when the two groups have different base rates of Y — different values of P(Y = 1 | A = a) — a score that is calibrated cannot also satisfy both balance conditions. The degenerate cases in which all three hold are those in which the score is perfectly predictive, and those in which the groups' base rates are equal.  
  >  
  > What the result does not show is that fairness is unachievable generally, or that we must abandon all of the criteria at once: any two of the three can be satisfied together. Nor does it show that the data are biased or that anyone has been negligent — the conflict is a fact about the joint distribution of (A, Y, S) and arises even for a perfectly specified model trained on perfectly recorded outcomes. And it does not tell us which criterion we should adopt, since that depends on what the score is used for and on who bears which kind of error.  

  **Assessment:**  
  - **Definitions (Correct but slightly imprecise):**  
    - Calibration: Correctly defined as requiring \(\mathbb{E}[Y \mid S=s, A=a] = s\) for all \(s\) and groups \(a\).  
    - Balance for negative/positive classes: Correctly defined as \(\mathbb{E}[S \mid Y=0, A=a] = \mathbb{E}[S \mid Y=0, A=a']\) (and analogously for \(Y=1\)).  
    - **Imprecision:** The definition of calibration should specify "for all \(s\) in the support of \(S\)" (to avoid issues with unobserved scores), but this is minor.  
  - **Impossibility Result (Correct):**  
    - Correctly states the conflict arises when base rates differ (\(P(Y=1 \mid A=0) \neq P(Y=1 \mid A=1)\)) and the score is calibrated.  
    - **Missing detail:** The conflict arises specifically when the score is **non-constant** and groups have different base rates. A trivial constant score (e.g., \(S = p\) for all) satisfies all three only if base rates are equal, but the student later covers degenerate cases.  
  - **Degenerate Cases (Correct):**  
    - Perfect prediction (i.e., \(S = Y\) almost surely) and equal base rates.  
  - **What the Result Does Not Show (Correct and thorough):**  
    - Correctly notes that pairwise satisfiability is possible, that the conflict is distributional (not due to bias/negligence), and that normative choices remain.  
  - **Deduction:**  
    - **-1 mark** for omitting that the score must be **non-trivial** (i.e., not constant) for the conflict to arise in non-degenerate cases. The student mentions "non-trivial" later in (b) but should specify it here.  

  ---

  #### **(b) [7 marks: Student scores 7/7]**  
  **Student's Answer:**  
  > The compliance team is right that unequal base rates are the engine of the conflict, but wrong to think they can switch the engine off by reweighting the training sample. Importance weighting changes the weights in the training loss, but it does not change the fitted score, so the function they deploy is the one they would have had anyway. And the three conditions are not properties of the training procedure at all: they are properties of the joint distribution of (A, Y, S) in the population where the score is used. If the deployed population still has unequal base rates, the conflict is still there no matter what was done upstream.  
  >  
  > Note also that balance for the positive class is just the requirement that the positive predictive value be equal across groups: among those who receive a high score, the proportion who actually have Y = 1 should be the same for the two groups. This is why the compliance team's proposal is worth taking seriously in the first place.  
  >  
  > Suppose, however, that the deployed population really did have equal base rates. Then, as the degenerate case in part (a) shows, the conflict disappears: once the base rates match, any calibrated and non-trivial score automatically satisfies both balance conditions, so all three hold. The practical moral is that the trade-off is a fact about prevalence, and prevalence is something an institution can in principle change by intervening on the world rather than on the classifier.  

  **Assessment:**  
  - **Critique of Proposal (Correct):**  
    - Correctly notes that importance-weighting during training **does not alter the deployed score** if the model class/computation is unchanged.  
    - Emphasizes that fairness conditions are properties of the **deployment population**, not training data.  
  - **Equal Base Rates in Deployment (Correct):**  
    - If the deployment population has equal base rates (\(P(Y=1 \mid A=0) = P(Y=1 \mid A=1)\)), then calibration implies both balance conditions (for non-trivial scores).  
  - **Positive Predictive Value (PPV) Comment (Accurate but tangential):**  
    - Balance for the positive class (\(\mathbb{E}[S \mid Y=1, A=a]\)) is **not** equivalent to PPV equality (\(\mathbb{E}[Y \mid S \geq t, A=a]\)). The student conflates concepts here.  
    - **However**, this mistake is **not fatal** because the core argument about base rates is correct, and the PPV remark is presented as motivational context.  
  - **Sufficiency Claim (Correct):**  
    - Correctly states that equal base rates + calibration + non-triviality imply all three conditions.  
  - **No deductions**: All key requirements are addressed.  

  ---

  #### **(c) [6 marks: Student scores 1/6]**  
  **Student's Answer:**  
  > The argument is sound in its first step. If the false positive rate has to match at every threshold, then for every threshold the upper tail of the score distribution among people with Y = 0 must carry the same mass in both groups, which is to say that the conditional distribution of S given Y = 0 is the same in both groups; and similarly given Y = 1. So uniform error-rate balance requires S to be independent of A given Y. Note that this is much stronger than ordinary error-rate balance, which only requires the two groups' ROC curves to pass through a common point.  
  >  
  > And once S is independent of A given Y, the score carries no further information about group membership: conditional on the outcome, scores are distributed identically in the two groups. Since calibration is a condition on what the score means — that a score of s corresponds to a risk of s — and the score's distribution no longer differs between the groups, calibration within groups follows automatically. Uniform fairness therefore escapes the impossibility result, and an agency that wants to avoid the trade-off should require S to be independent of A given Y by construction; training on a group-balanced sample and then checking that the two ROC curves coincide is enough. One might object that equality at every threshold is impossibly demanding in practice. But that is a practical objection rather than a mathematical one, and the point of the construction is that the impossibility result is an artifact of fixing a single threshold.  

  **Assessment:**  
  - **First Step (Correct):**  
    - Uniform error-rate balance (i.e., equal FPR and FNR at **every** threshold) implies \(S \perp A \mid Y\). This is correctly justified.  
  - **Second Step (Incorrect and Fatal):**  
    - **Error:** Claims that \(S \perp A \mid Y\) implies calibration within groups (\(\mathbb{E}[Y \mid S=s, A=a] = s\) for all \(s, a\)).  
    - **Why it's wrong:**  
      - \(S \perp A \mid Y\) ensures the **distribution of \(S\)** is identical across groups given \(Y\), but says nothing about the **relationship between \(S\) and \(Y\)**. Calibration requires \(\mathbb{E}[Y \mid S=s, A=a] = s\), which depends on the conditional expectation of \(Y\) given \(S\), not the distribution of \(S\) given \(Y\).  
      - **Counterexample:** Suppose \(S \perp A \mid Y\) and both groups have identical \(P(S \mid Y)\). If the score is **miscalibrated** in the same way for both groups (e.g., \(\mathbb{E}[Y \mid S=s] = s^2\) for all groups), calibration fails, but \(S \perp A \mid Y\) holds.  
    - **Consequence:** Uniform fairness **does not escape** the impossibility result. If base rates differ, \(S \perp A \mid Y\) **and** calibration **contradict** balance for the negative/positive classes (by the same theorem as in (a)).  
  - **Training Misstep (Incorrect):**  
    - Claims training on a "group-balanced sample" (i.e., equalizing \(P(Y=1 \mid A=a)\) in training data) ensures \(S \perp A \mid Y\). **False:** Equalizing base rates in training affects \(P(Y \mid A)\), not \(P(S \mid Y, A)\). \(S \perp A \mid Y\) requires identical \(P(S \mid Y=0)\) and \(P(S \mid Y=1)\) across groups, which is not guaranteed by balanced training.  
  - **Practical Objection (Irrelevant):**  
    - The student correctly notes that requiring thresholds at all levels is demanding, but this does not mitigate the mathematical error.  
  - **Deductions:**  
    - **-5 marks** for the core error: Falsely claiming \(S \perp A \mid Y\) implies calibration, and concluding uniform fairness escapes impossibility.  
    - **-0 marks** for the first step (correct) and practical comment (irrelevant but harmless).  

  ---

  ### Final Mark: **14/20**  
  **Breakdown:**  
  - **(a)**: 6/7 (Minor omission: non-trivial score requirement)  
  - **(b)**: 7/7 (Accurate and complete)  
  - **(c)**: 1/6 (Only the first step is correct; core argument is flawed)  

  **Summary for Student:**  
  Strong performance on (a) and (b), demonstrating clear understanding of the impossibility theorem and its implications. In (c), you correctly identified that uniform error-rate balance forces \(S \perp A \mid Y\), but incorrectly assumed this implies calibration. This led to an invalid conclusion that uniform fairness escapes the conflict. Remember: calibration depends on \(\mathbb{E}[Y \mid S]\), while \(S \perp A \mid Y\) constrains only the distribution of \(S\) given \(Y\). These are logically distinct conditions.
