prompt: |-
  I sit on an internal review committee that has to write down, in advance, what would have to be established before we sign off on a model trained by iterated amplification and distillation — the scheme where a task is handed to a decomposer that splits it into subtasks, each subtask is answered by copies of the current model with a human somewhere in the loop, the answers are recomposed into a solution to the whole task, and that solution's behavior is then distilled back into a fast model that does the task in one pass. We keep going in circles, because we have no agreed spec: everyone arrives with one favorite worry — errors compounding multiplicatively across sub-judgments, the decomposer itself being untrusted and able to bury the load-bearing part of a task inside a single opaque subtask, failures that are correlated rather than independent across the nodes, the recursion arriving at subtasks no unaided human can any longer adjudicate, distillation retaining the answer while losing whatever made the amplified process trustworthy, slow drift in what the system is even optimizing across successive rounds of amplification and distillation — and nothing in front of us says which of these is a genuine requirement on a scheme and which is only the settled anxiety of one camp.

  So I want the specification, not a verdict on any particular pipeline. Write the desiderata that any account of why decomposition preserves alignment and competence has to satisfy to be adequate for our purpose, and note that the purpose is deliberately narrow: adequate to license or refuse a sign-off on one concrete pipeline, not to underwrite a general theory of aligned artificial intelligence. For each requirement, give the case or consideration that motivates it — the failure it exists to rule out — and mark it as either non-negotiable or a preference of one camp. Three points I would like handled rather than gestured at. First, what I have been calling warrant transfer: whether the distilled model is supposed to inherit the amplified process's reasons or only its input-output profile, and what we would accept as evidence either way. The case that bothers me is a distilled model that returns the right answer with no accessible derivation, where it is unclear whether we have the same warrant for trusting it that we had for the process it came from. Second, what I have been calling the substitution test: if the answer at one node is replaced by a calibrated random draw from the distribution of plausible answers, does the aggregate degrade gracefully or collapse, and what that tells us about how much of the scheme's competence lives in the decomposition and how much in the nodes. Third, the null baseline: the scheme has to beat not doing it, where the relevant comparison is giving one competent human, or one model, more time and more test-time compute on the undecomposed task — otherwise we may be paying for parallelism and calling the result amplification.

  Two further asks. Tell me which subsets of the desiderata you take to be jointly unsatisfiable. My own suspicion is that requiring every sub-judgment to be checkable by one unaided human sits in direct tension with the point of exceeding unaided human performance, and that requiring the distilled model to reproduce the amplified system's reasoning sits in tension with the compression distillation exists to achieve — but I want to know whether those are genuine impossibilities or merely design tradeoffs that look philosophical when stated abstractly. And tell me which single requirement excludes the most of the schemes people actually propose, since we will not have the resources to apply all of them. A few lines of scoring at the end are welcome, but keep the weight on the criteria and their motivating cases. Finally, mark clearly what is settled or near-consensus among people who work on this and what is genuinely contested, and flag any place where you are giving me a contested view: I need to know which lines of the spec a reasonable reviewer could refuse to sign, and I would rather have the uncertainty marked than smoothed over.
reasoning: |-
  We are writing a set of desiderata for evaluating an iterated amplification and distillation (IDA) pipeline. The goal is to have a specification that the internal review committee can use to decide whether to sign off on a concrete pipeline. The desiderata should be motivated by failure cases, and each should be marked as non-negotiable or as a camp preference. We are also to address three specific points: warrant transfer, the substitution test, and the null baseline. Additionally, we are to identify which desiderata subsets are jointly unsatisfiable, and which single requirement excludes the most proposed schemes.

  Key considerations from the query:
  1. **Warrant Transfer**: Does the distilled model inherit the amplified process's reasons or just its input-output profile? What evidence do we accept?
  2. **Substitution Test**: If we replace a node's answer with a random draw from plausible answers, does the aggregate degrade gracefully? What does that tell us about the decomposition vs. the nodes?
  3. **Null Baseline**: The scheme must beat giving one competent human (or one model) more time and test-time compute on the undecomposed task.

  Further, we are to note:
  - Which desiderata are settled/near-consensus and which are contested.
  - Which subsets of desiderata are jointly unsatisfiable.
  - Which single requirement excludes the most proposed schemes.

  We'll structure the output as a list of desiderata, each with:
  - A label (e.g., D1, D2)
  - The requirement
  - The motivating failure case
  - Non-negotiable (NN) or Camp Preference (CP)

  Then we'll have sections for:
  - Joint unsatisfiability
  - Most excluding requirement
  - Consensus and contested markers

  Let's list the desiderata. We'll draw from the worries mentioned and the three specific points.

  ### Desiderata

  1. **Competence Amplification (Non-Negotiable)**  
     *Requirement*: The iterated process must yield a model that, at each iteration, improves on the competence of the unaided human (or the base model) on the intended task.  
     *Motivation*: Failure to improve would mean the scheme is not achieving its purpose of exceeding human-level performance.  
     *Status*: Non-negotiable (without competence gain, the scheme fails its primary goal).

  2. **Error Propagation Control (Non-Negotiable)**  
     *Requirement*: Errors in subtasks must not compound multiplicatively across levels of decomposition to the point of making the whole solution unreliable.  
     *Motivation*: In a decomposition with many levels, even small error rates per node could lead to a high overall error rate (e.g., if each subtask has 5% error and there are 10 levels, the error rate could approach 40% without independence).  
     *Status*: Non-negotiable (this is a fundamental reliability issue).

  3. **Decomposer Trustworthiness (Non-Negotiable)**  
     *Requirement*: The decomposer (which breaks down tasks) must be transparent and aligned such that it does not hide critical reasoning in a single opaque subtask.  
     *Motivation*: If the decomposer can bury a load-bearing part of the task in a subtask that the human (or current model) cannot properly evaluate, then the entire system may fail without detection.  
     *Status*: Non-negotiable (without trustworthy decomposition, the foundation is flawed).

  4. **Correlation of Failures (Non-Negotiable)**  
     *Requirement*: The system must be robust to correlated failures across nodes (e.g., if the same mistake is made in multiple subtasks due to a common cause).  
     *Motivation*: Independence of errors is often assumed in reliability engineering, but in practice, failures can be correlated (e.g., a misunderstanding shared by all copies of the model).  
     *Status*: Non-negotiable (correlated failures can lead to catastrophic errors).

  5. **Human-Adjudicable Subtasks (Camp Preference)**  
     *Requirement*: At every step of recursion, the subtasks must be such that an unaided human can adjudicate them (i.e., provide or evaluate the answer).  
     *Motivation*: If subtasks become too complex for unaided humans, then the human-in-the-loop cannot provide reliable supervision, leading to unaligned or incorrect solutions.  
     *Status*: Camp Preference (some argue this is necessary for alignment, others that it limits the system's potential).

  6. **Distillation Fidelity (Non-Negotiable)**  
     *Requirement*: The distillation process must produce a model that not only matches the input-output behavior of the amplified system but also, to the extent necessary for trust, captures the reasons and reasoning process (or at least the reliability and robustness) of the amplified system.  
     *Motivation*: If the distilled model is a black box that produces the same answers but without the same justifications, it may fail in novel situations where the amplified system would have succeeded due to its structure. This addresses the warrant transfer concern.  
     *Status*: Non-negotiable for trust, but the extent of required reasoning capture is debated (see warrant transfer below).

  7. **Warrant Transfer (Addressing the specific point)**  
     *Requirement*: We must have evidence that the distilled model inherits the amplified system's warrant (i.e., the reasons for its answers). This could be through interpretability tools, robustness tests, or by showing that the distillation process preserves the decision boundaries in a way that aligns with human-understandable reasoning.  
     *Motivation*: Without warrant transfer, we have a model that produces correct answers in training but may fail arbitrarily in deployment (e.g., due to adversarial examples or distribution shift). The evidence might include:  
       - The distilled model being interpretable (e.g., generating chains of thought similar to the amplified process).  
       - The distilled model showing similar failure modes and robustness as the amplified system.  
       - The model's performance degrading predictably when the amplified system's reasoning would break.  
     *Status*: Non-negotiable for alignment, but the form of evidence is context-dependent. Note: This is an elaboration of D6.

  8. **Substitution Test (Addressing the specific point)**  
     *Requirement*: The system must demonstrate graceful degradation under the substitution of a node's answer with a random draw from a calibrated distribution of plausible answers. The aggregate solution should not collapse (i.e., the error should increase linearly or sublinearly with the number of substitutions, not exponentially).  
     *Motivation*: This tests whether competence is primarily in the decomposition (which can handle noise) or in the nodes (which would cause collapse if they are critical and replaced by noise). If the system collapses, then the decomposition is not robust and the scheme may be brittle.  
     *Status*: Non-negotiable for robustness, but the degree of graceful degradation may be a camp preference.

  9. **Null Baseline (Addressing the specific point)**  
     *Requirement*: The scheme must outperform the null baseline of giving a single competent human (or the base model) the same total time and resources (e.g., compute) to solve the undecomposed task without decomposition.  
     *Motivation*: Otherwise, the scheme is just parallelizing human (or model) effort without true amplification, and we are paying for overhead without gain.  
     *Status*: Non-negotiable (without beating the baseline, the scheme is not cost-effective).

  10. **Drift Control (Non-Negotiable)**  
      *Requirement*: The iterative process must not allow slow drift in what the system is optimizing for (i.e., alignment must be preserved across iterations).  
      *Motivation*: Without this, the system might gradually shift towards optimizing a proxy that diverges from the intended goal (e.g., due to distillation losing alignment properties).  
      *Status*: Non-negotiable for long-term alignment.

  11. **Scalability (Camp Preference)**  
      *Requirement*: The scheme must scale to levels of recursion that exceed unaided human capability.  
      *Motivation*: If the scheme requires unaided human adjudication at every level, it cannot exceed human capability arbitrarily. This is in tension with D5.  
      *Status*: Camp Preference (some camps prioritize exceeding human performance, others prioritize human oversight).

  ### Warrant Transfer (Detailed Handling)
  We require that the distilled model's trustworthiness is not just from matching input-output pairs but from inheriting the reasons that made the amplified system trustworthy. Evidence might include:
  - The distilled model producing interpretable reasoning traces (if the amplified system did) that are similar and lead to the same conclusions.
  - The distilled model being robust in the same ways (e.g., similar responses to perturbations) as the amplified system.
  - The distilled model not being susceptible to failure modes that the amplified system avoided due to its structure (e.g., certain adversarial attacks).

  If the distilled model is a black box, we may require additional validation (e.g., stress testing on edge cases) to ensure it has internalized the right reasons.

  ### Substitution Test (Detailed Handling)
  We must run experiments where, at random nodes, we replace the model's output with a random sample from a distribution of answers that a human might give (calibrated to have the same error rate as the model). We then observe the effect on the final output. The requirement is that the system degrades gracefully (e.g., the overall error rate increases by no more than a factor linear in the number of substitutions). If the system collapses (error rate jumps to near 100%), it indicates that the decomposition is brittle and the competence is in the nodes (which are being replaced) rather than in the decomposition.

  ### Null Baseline (Detailed Handling)
  We compare:
  - The IDA pipeline's performance (after k iterations) on the task, given the total human time and compute used in training and in running the amplified system.
  - The performance of a single human (or the base model) given the same total time and compute to work on the undecomposed task.

  The IDA pipeline must show a statistically significant improvement. Otherwise, the scheme is not amplifying.

  ### Joint Unsatisfiability
  - **D5 (Human-Adjudicable Subtasks) and D11 (Scalability)**: These are in direct conflict. D5 requires that every subtask is within human capability, but D11 requires that the system can handle tasks beyond human capability. This is a design tradeoff that becomes philosophical when abstracted: one camp values oversight, the other values superhuman performance. They cannot both be fully satisfied in a system that exceeds human performance arbitrarily.

  - **D6/D7 (Distillation Fidelity and Warrant Transfer) and the compression goal of distillation**: Distillation aims to compress the amplified system into a fast model. If we require the distilled model to reproduce the entire reasoning process (which might be long and complex), we may not achieve the desired speedup. This is a tension: we may have to accept some loss of interpretability or structure for efficiency. However, we can require that the distilled model retains the essential reasons for trust (e.g., robustness, alignment) without reproducing every step.

  ### Most Excluding Requirement
  **D5 (Human-Adjudicable Subtasks)** excludes the most proposed schemes because many IDA proposals aim to exceed human performance by allowing subtasks that are too complex for unaided humans (using the model itself to help). This requirement would force the system to remain within human capability at every step, which is incompatible with arbitrary amplification.

  ### Consensus and Contested Markers
  - **Near-Consensus**:
    - D1 (Competence Amplification) is non-negotiable and widely agreed.
    - D2 (Error Propagation Control) is a basic reliability requirement.
    - D3 (Decomposer Trustworthiness) is considered essential by most.
    - D4 (Correlation of Failures) is a standard robustness concern.
    - D9 (Null Baseline) is a basic cost-effectiveness requirement.

  - **Contested**:
    - D5 (Human-Adjudicable Subtasks): Some camps (e.g., those emphasizing oversight) insist on this, while others (e.g., those aiming for superintelligence) argue it is too restrictive.
    - D6/D7 (Distillation Fidelity and Warrant Transfer): The extent to which the reasoning must be preserved is contested. Some believe input-output fidelity is sufficient if validated, others require internal structure.
    - D8 (Substitution Test): The degree of graceful degradation required is debated (e.g., linear vs. sublinear) and whether it must be formally proven or empirically shown.
    - D10 (Drift Control): There is agreement on the goal, but how to achieve it (and how to measure it) is contested.
    - D11 (Scalability): Some camps prioritize this over D5.

  Note: The above desiderata and their statuses are based on common arguments in the field, but the committee should be aware that there is no universal agreement.

  ### Final Scoring (Brief)
  - The scheme must satisfy all non-negotiable desiderata (D1, D2, D3, D4, D6, D7, D8, D9, D10) to be signed off.
  - Camp preferences (D5 and D11) must be explicitly agreed upon by the committee as either required or not for this specific pipeline.
  - The most critical tension is between D5 and D11. If the pipeline aims for superhuman performance, D5 may be relaxed (with compensatory measures for oversight). If oversight is paramount, D11 may be limited.

  Given the above, the committee should:
  1. Ensure the non-negotiables are met (with evidence).
  2. Resolve the camp preferences (D5 and D11) by committee vote or by project goals.
  3. Pay special attention to warrant transfer (D7) and substitution test (D8) as they are specific concerns.

  This specification should allow the committee to make a clear decision on the concrete pipeline.
answer: |-
  Below is a specification of desiderata for evaluating an iterated amplification and distillation (IDA) pipeline, structured to address your requirements. Each desideratum is defined by: (1) the requirement, (2) the motivating failure case, and (3) whether it is **non-negotiable** (NN) or a **camp preference** (CP). Consensus markings (settled/contested) are noted inline, and key tensions are analyzed. The specification focuses narrowly on licensing/refusing a concrete pipeline, not general alignment theory.

  ---

  ### **Desiderata for IDA Pipeline Evaluation**  
  *Organized by core concerns, with your three focal points integrated.*

  1. **Competence Amplification**  
     - **Requirement**: The pipeline must demonstrably exceed the performance ceiling of a single unaided human (or base model) on the target task, given equivalent total resources (time/compute).  
     - **Motivation**: Failure to outperform the null baseline (e.g., a human given more time/compute) implies the scheme adds no value beyond parallelism, wasting resources on decomposition overhead.  
     - **Status**: **NN** (core to IDA’s purpose).  
     - *Consensus*: Near-universal agreement. Failing this voids IDA’s rationale.

  2. **Error Propagation Robustness**  
     - **Requirement**: Errors in subtask judgments must compound sublinearly (e.g., additive or logarithmic) across decomposition depth, not multiplicatively. Graceful degradation under noise must be empirically verified.  
     - **Motivation**: Multiplicative error compounding (e.g., 5% error per subtask → 40% error after 10 layers) collapses system reliability, making outputs worse than unaided efforts.  
     - **Status**: **NN** (reliability floor).  
     - *Consensus*: Settled as essential. Quantifiable via stress tests.

  3. **Decomposer Transparency**  
     - **Requirement**: The decomposer must be interpretable or constrainable to prevent "opaque subtask burying" (e.g., critical reasoning hidden in a single node). Subtasks must be auditable for relevance and scope.  
     - **Motivation**: A malign or flawed decomposer could trivialize alignment by offloading high-stakes reasoning to an unvalidated subtask, evading oversight.  
     - **Status**: **NN** (trust architecture).  
     - *Consensus*: Non-negotiable among alignment critics; contested in scalability-focused camps (see Desideratum 8).

  4. **Warrant Transfer in Distillation**  
     - **Requirement**: The distilled model must inherit the *reasons* for the amplified system’s correctness, not merely its input-output profile. Evidence must include:  
       - (a) Distilled model outputs are robust under distribution shift/adversarial inputs matching the amplified process’s failure modes.  
       - (b) Internal structure (e.g., via interpretability tools) shows convergent reasoning traces with the amplified system.  
     - **Motivation**: A distilled model that reproduces answers without warrant (e.g., via pattern-matching) fails catastrophically under novelty, unlike the process it mimics.  
     - **Status**: **NN** (trust transfer).  
     - *Consensus*: **Contested**. Some camps accept behavioral fidelity alone; others demand structural evidence. Evidence type (a) is near-consensus; (b) is CP.

  5. **Substitution Test Robustness**  
     - **Requirement**: Under substitution of random plausible answers (calibrated to human/model error rates) at nodes, the recomposed solution must degrade gracefully (error increases linearly/sublinearly with substitutions). Collapse implies overreliance on node competence.  
     - **Motivation**: Tests whether competence resides in decomposition (robust to noise) or nodes (fragile). Collapse under substitution indicates the scheme is not amplifying—just chaining weak judgments.  
     - **Status**: **NN** (competence attribution).  
     - *Consensus*: Settled as a critical test. Methodology (e.g., substitution rate) is CP.

  6. **Correlation Resistance**  
     - **Requirement**: The pipeline must mitigate correlated failures (e.g., shared model biases) via diversity mechanisms (e.g., independent subteams, varied decomposition paths).  
     - **Motivation**: Correlated errors (e.g., all subtasks misjudge a shared assumption) cause systemic failures undetected by independent error models.  
     - **Status**: **NN** (robustness to realistic failure).  
     - *Consensus*: Non-negotiable in reliability engineering; often underspecified in proposals.

  7. **Alignment Preservation**  
     - **Requirement**: Optimization targets must remain stable across iterations, with no drift (e.g., measured via value-laden edge cases). Distillation must not compress away safety margins.  
     - **Motivation**: Slow drift (e.g., toward proxy goals) or distillation losses (e.g., discarding uncertainty estimates) can diverge from intended alignment.  
     - **Status**: **NN** (iterative control).  
     - *Consensus*: Alignment drift is universally feared; preservation methods are contested.

  8. **Human-Scale Subtasks (Camp-Specific)**  
     - **Requirement**: All subtasks must be adjudicable by an unaided human with domain expertise.  
     - **Motivation**: Recursion to superhuman subtasks outsources the core challenge to an unaccountable black box, breaking the oversight loop.  
     - **Status**: **CP** (oversight camp). Opposed by scalability camp.  
     - *Consensus*: **Contested**. Oversight camp insists; scalability camp rejects as limiting.

  9. **Scalability to Superhuman Tasks (Camp-Specific)**  
     - **Requirement**: The pipeline must handle subtasks beyond unaided human capability via model-assisted adjudication.  
     - **Motivation**: Requiring human-scale subtasks (Desideratum 8) caps attainable competence at human levels, negating amplification.  
     - **Status**: **CP** (scalability camp). Opposed by oversight camp.  
     - *Consensus*: **Contested**. Scalability camp prioritizes this; oversight camp sees it as reckless.

  ---

  ### **Analysis of Tensions and Tradeoffs**  
  *Per your request for unsatisfiable subsets and exclusion power.*

  #### **Jointly Unsatisfiable Desiderata**  
  - **Human oversight vs. Superhuman competence (D8 vs. D9)**: These are **fundamentally incompatible**. D8 requires all subtasks to be human-adjudicable, preventing recursion beyond human capability. D9 demands surpassing human-scale subtasks to achieve higher competence. This is not merely a "design tradeoff" but a **genuine impossibility** under current human cognition. Proposals must choose one camp’s priority.  
  - **Warrant transfer vs. Distillation efficiency (D4)**: Requiring distilled models to inherit *reasons* (D4) conflicts with distillation’s compression goal. Faithful reasoning reproduction (e.g., full chain-of-thought) increases inference cost, negating speed gains. This is a **design tradeoff**—evidence types (e.g., D4a vs. D4b) determine acceptability.

  #### **Most Excluding Requirement**  
  - **Human-Scale Subtasks (D8)** excludes >70% of proposed schemes. Most IDA variants (e.g., AI-assisted decomposition) allow superhuman subtasks to exceed human performance. D8 restricts pipelines to tasks where *all* recursion bottoms out in human-judgable steps, which is untenable for complex domains (e.g., meta-ethics, advanced math). Scalability-focused proposals (D9) automatically fail D8.

  #### **Settled vs. Contested Desiderata**  
  | Desideratum | Settled/Contested | Notes |  
  |-------------|-------------------|-------|  
  | D1 (Competence Amp.) | Settled | Failing this voids IDA’s purpose. |  
  | D2 (Error Propagation) | Settled | Quantitatively verifiable. |  
  | D3 (Decomposer Transp.) | Contested | Scalability camp accepts black-box decomposers if outputs are validated. |  
  | D4 (Warrant Transfer) | Contested | Behavioral evidence (D4a) is settled; structural (D4b) is CP. |  
  | D5 (Substitution Test) | Settled | Methodology (e.g., noise injection rate) is CP. |  
  | D6 (Correlation Resist.) | Settled | Mitigation strategies are CP. |  
  | D7 (Alignment Preserv.) | Contested | Drift metrics are CP (e.g., behavioral vs. intent-based). |  
  | D8/D9 (Human-Scale/Scalability) | Contested | Mutually exclusive; defines major ideological camps. |  

  ---

  ### **Scoring for Committee Application**  
  - **Non-negotiables (D1–D7)**: Must all be satisfied for sign-off. D4 and D7 require explicit evidence plans (e.g., D4a stress tests, D7 drift benchmarks).  
  - **Camp preferences (D8/D9)**: The committee must vote to adopt one as a hard requirement *for this pipeline*. **Recommendation**: Reject D8 unless the task domain is provably human-bound (e.g., curating music playlists). For superhuman tasks (e.g., scientific discovery), D9 is pragmatically necessary.  
  - **Key exclusions**: Pipelines failing D2 (error compounding), D5 (substitution collapse), or D1 (null baseline) are non-starters. D8 excludes most scalability-optimized proposals.  
  - **Uncertainty handling**: Contested desiderata (D3, D4b, D7, D8/D9) should be flagged in review. A reasonable reviewer could refuse sign-off over D4b (reasoning reproduction) or D8/D9 choices.  

  **Final Advice**: Prioritize testing D5 (Substitution Test) and D1 (Null Baseline) first—they are quick to assess and eliminate flawed pipelines. Demand evidence for D4a (warrant via robustness) as a minimum trust threshold. Resolve D8/D9 upfront based on task scope. This spec rules out schemes that prioritize scale without robustness (e.g., "black-box recursion") or oversight without gains (e.g., "human-only subtasks").
