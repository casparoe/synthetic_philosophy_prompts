  Looking at the requirements: grounding malfunctions and licensing bio-talk are crucial. The synthetic cell case tests ahistorical functions. Without functions, can we say it malfunctions? Probably not, so allowing functions in new systems is key. The cancer case requires distinguishing hierarchical functions—organism vs. cell lineage.

