  But the user might worry about circularity or empirical grounding. They might push back on organizational accounts being too abstract. If evidence shows selected effects are necessary in physiology, that could challenge organizational theories. Still, for their use case, organizational theory balances the needs best. They need to accept that history isn't necessary for function, which might be a shift from traditional views but fits medicine better.
answer: |-
  Here’s the spec for a theory of biological function tailored to your needs—philosophy of medicine, disorder-as-dysfunction, with neuro/psychiatric applications. I’ll commit clearly, rank desiderata, resolve your cases, and flag trade-offs.  

  ---

  ### **Core Job of the Theory**  
  1. **Ground malfunctions**: Support normative claims ("trait X is broken") even without evolutionary history (e.g., congenital disorders, synthetic biology).  
  2. **License biological function-talk**: Fit how biologists describe functions (e.g., "the function of protein X is to catalyze Y").  

  ---

  ### **Non-Negotiable Desiderata** (Ranked by Priority)  
  1. **Malfunction requires normativity**  
     - *Requirement*: Must distinguish *having a function* (normative) from *performing it well/poorly*.  
     - *Why non-negotiable?* Without this, "dysfunction" collapses into mere causation or statistical abnormality. Case in point: A broken heart valve *should* pump blood but fails; a cancer cell *shouldn*’*t* hyper-proliferate.  
     - *Dealbreaker for*: Pure causal-role accounts (Cummins) that reduce function to causal contribution—no "should" implied.  

  2. **Ahistorical functions**  
     - *Requirement*: Must assign functions to traits in systems with no evolutionary history (e.g., synthetic cells).  
     - *Why non-negotiable?* Medicine needs to diagnose dysfunctions in novel contexts (e.g., lab-grown organs, CRISPR edits). If no function exists, "malfunction" is incoherent.  
     - *Dealbreaker for*: Etiological accounts (Millikan, Neander)—they demand evolutionary history.  

  3. **Hierarchy-awareness**  
     - *Requirement*: Functions must be relativized to biological hierarchies (e.g., cell vs. organism).  
     - *Why non-negotiable?* Cancer mutations benefit *cells* but harm *organisms*. A theory must distinguish "function for X at level Y."  
     - *Dealbreaker for*: Monolithic theories that ignore context (e.g., naive selected-effects).  

  4. **Empirical adequacy**  
     - *Requirement*: Functions must align with biological practice (e.g., physiologists assigning functions to novel proteins).  
     - *Why non-negotiable?* If the theory contradicts biologists, it’s useless for underwriting their claims.  

  ---

  ### **Negotiable "Preferences"**  
  - **Evolutionary depth**: *Nice-to-have*, but not essential if normativity comes from elsewhere (e.g., self-maintenance).  
  - **Universality**: *Unnecessary*—medicine doesn’t need functions for rocks or software.  
  - **Teleology without ghosts**: *Already covered*—normativity must be naturalistic (no spooky "purposes").  

  ---

  ### **Resolving Your Cases**  
  1. **Synthetic cell (no ancestors)**  
     - *Demand*: **Must have functions** (e.g., ribosome functions to synthesize proteins).  
     - *Cost of denying*: If no function, no malfunction—undermines clinical applications.  
     - *Verdict*: Etiological accounts fail; causal-role/organizational succeed.  

  2. **Cancer mutation (selected in cell lineage, kills organism)**  
     - *Demand*: **Functions must be level-relative**.  
       - For the *cell lineage*, dividing faster is functional (selected-effect).  
       - For the *organism*, it’s dysfunctional (undermines viability).  
     - *Clinical implication*: Doctors care about organism-level function—so mutation is dysfunctional *at that level*.  
     - *Verdict*: Etiological accounts struggle (conflict between levels); organizational accounts handle this cleanly.  

  ---

  ### **The Conflict & Trade-Off**  
  - **The tension**: You suspect correctly: **Ahistorical functions + robust normativity** strain single-theory solutions.  
    - Etiological: Strong normativity (via selection) but fails ahistoricity.  
    - Causal-role: Ahistorical but no normativity.  
    - Organizational: Naturalistic normativity (via self-maintenance) and ahistorical, but faces circularity worries.  
  - **The fix**: **Organizational accounts** (Mossio, Saborido, Moreno) best balance demands:  
    - *Function* = Contribution to self-maintenance of an autonomous system.  
    - *Malfunction* = Failure to contribute adequately.  
    - Works for synthetic cells (if self-maintaining) and cancer (undermines organismal autonomy).  

  ---

  ### **Scoring the Families**  
  | **Theory**       | **Malfunction Normativity** | **Ahistorical Functions** | **Hierarchy-Aware** | **Fits Biology** |  
  |------------------|----------------------------|---------------------------|---------------------|------------------|  
  | **Etiological**  | ✅ (Strong)                | ❌ (Fatal flaw)           | ⚠️ (Requires work)  | ⚠️ (Ignores novel traits) |  
  | **Causal-Role**  | ❌ (None)                  | ✅ (Strong)               | ✅                   | ⚠️ (Too promiscuous) |  
  | **Organizational**| ✅ (Moderate)              | ✅                        | ✅                   | ✅                |  

  ---

  ### **My Commitments**  
  - **Best candidate**: **Organizational accounts** (e.g., autonomy/closure-based).  
  - **Sacrificed desideratum**: **Evolutionary grounding**—jettisoned because medicine needs ahistorical normativity.  
  - **Likely wrong about**: Organizational accounts being empirically adequate *everywhere*. If biologists invoke selection *irreducibly* (e.g., in exaptations), I’d reconsider.  
  - **Red flag**: If self-maintenance is circular (e.g., "viability" presupposes function), the theory collapses. But current formulations avoid this.  

  ### **Conclusion**  
  For disorder-as-dysfunction, **organizational function** delivers:  
  1. Normativity via self-maintenance (malfunctions possible).  
  2. Functions for synthetic/novel systems.  
  3. Level-relativity (cancer = dysfunctional for organism).  
  4. Biological fidelity (fits physiology’s "function of X" talk).  

  Etiological theories are untenable for medicine; causal-role is inert for pathology. Split concepts aren’t needed—organizational theory handles both your cases. If forced to choose, **ahistorical normativity** is the hill to die on: without it, medicine loses its conceptual foundation.
