  For established concepts, I'll compare this to: person-affecting views (which focus on existing individuals but don't fully explain the flip), the mere addition paradox (which is about intransitivity but not baseline dependence), modal baseline theories (which come close but are more about actual vs possible), and choice-theoretic path dependence (which is similar but more general).

  The invariant core is that the baseline isn't neutral - it actively shapes how we value the change. For boundary cases: clear instance would be adding one life-worthy life to a population where evaluation flips based on starting point. Clear non-instance would be classical utilitarianism where adding life-worthy lives always improves things. A borderline case might be average utilitarianism with variable population size.

  If there's no established name, I could propose "Baseline-Relative Valuation" or "Counterfactual Sensitivity." The test would be whether adding a life-worthy life is evaluated differently when framed as creation vs prevention.

  As for whether this is a defect - in the user's regulatory context it certainly violates important principles. It may be unavoidable for theories that avoid the repugnant conclusion while maintaining other intuitions. I'll note that theories like critical-level utilitarianism might avoid it by having a fixed threshold.

  This is a sophisticated observation by the user that cuts to fundamental issues in population ethics. I'll structure my response exactly as requested to give them the analytical clarity they're seeking.
answer: |-
  ### 1. **What I think you are describing**  
  You are observing that in population ethics, the *evaluation of a fixed pair of populations* (A and B) can reverse or become indeterminate based solely on which population is designated as the baseline ("starting point") for comparison. This violates the principle of **baseline invariance**: that the relative ranking of two options should depend only on their intrinsic properties, not on which is labeled the counterfactual. Your first example shows this:  
  - When the baseline is 10 people (A), adding an 11th with positive-but-lower welfare (B) is often deemed non-improving.  
  - When the baseline is 11 people (B), removing the 11th to revert to A is deemed non-improving (or even impermissible).  
  Thus, A is not better than B from baseline A, but B is not better than A from baseline B—creating a stalemate. Your second example generalizes this: theories avoiding the repugnant conclusion treat the baseline as a "pivotal anchor," making betterness relations path-dependent. Ambiguity in your description: you initially frame this as a *ranking change*, but it’s more precisely a **failure of mutual comparability under baseline reversal**—a form of context-dependent incommensurability.

  ### 2. **Nearest established concepts, and where each falls short**  
  **(a) Person-affecting views**  
  - *What it says*: Only actions affecting existing individuals’ welfare matter; creating new people is neutral unless they suffer.  
  - *Falls short*: Person-affecting views explain *why* adding a happy person might be neutral but don’t inherently require baseline-dependence. One could have a person-affecting view where adding happy people is always permissible (symmetric), avoiding your phenomenon. Your issue is structural: the *same theory* assigns asymmetric valuations depending on the baseline, even with fixed populations.  

  **(b) Creation asymmetry (or Procreation Asymmetry)**  
  - *What it says*: We have no duty to create happy people but a duty not to create unhappy ones.  
  - *Falls short*: This is a *substantive* claim about obligations. Your phenomenon is *formal*: it’s about how baseline choice affects the *betterness relation* itself. A theory could endorse creation asymmetry (e.g., "adding happy lives is neutral") while maintaining baseline invariance by always ranking A+v1 as equally good as A. But in your examples, valuations flip with the baseline—e.g., removing v1 from A+v1 isn’t better, implying A and A+v1 are incomparable, not equal.  

  **(c) Modal baseline theories (e.g., Actualism vs. Possibilism)**  
  - *What it says*: The value of a world depends on which world is "actual" (Actualism) or exists in some modal context (Possibilism).  
  - *Falls short*: Modal baselines often address *obligations* given feasibility constraints (e.g., "ought implies can"). Your concern is about *betterness rankings* absent constraints: two abstract populations are compared, and the baseline is purely notational. Actualism might *use* baseline-dependence but doesn’t *explain* why it arises in fixed-population comparisons.  

  **(d) Incommensurability or nontransitivity**  
  - *What it says*: Some options cannot be ordered (incommensurability) or rankings loop (nontransitivity).  
  - *Falls short*: Incommensurability typically means A and B are *incomparable simpliciter*, regardless of context. Here, comparability *depends* on the baseline: from A, B is not better; from B, A is not better. This resembles **non-binary comparability failure** (where pairwise rankings aren’t composable), but it’s specifically induced by baseline framing.  

  **(e) Reference-dependence (from behavioral economics)**  
  - *What it says*: Preferences shift based on a reference point (e.g., loss aversion).  
  - *Falls short*: Reference-dependence usually applies to *experienced welfare* (e.g., gains vs. losses). Your cases involve objective welfare levels, not subjective framing. Theories like Critical-Level Utilitarianism avoid reference-dependence but might still exhibit baseline sensitivity if the critical level is context-dependent.  

  **Core gap**: None capture **baseline-relative betterness**—where the *designation* of the counterfactual alters the valuation of identical pairs—as a distinct structural flaw.

  ### 3. **The carving**  
  - **Invariant core**: A theory exhibits **baseline-relative betterness** if, for two fixed populations A and B, the truth of "B is better than A" or "A is better than B" depends on whether A or B is the baseline—despite no change in the populations’ composition or welfare.  
  - **Clear instance**:  
    - Baseline = 10 high-welfare people (A). Adding an 11th with low-but-positive welfare (B) is *not better*.  
    - Baseline = 11 people (B). Removing the 11th to restore A is *not better*.  
    Outcome: From A, B isn’t superior; from B, A isn’t superior. Mutual incomparability induced by baseline.  
  - **Clear non-instance**:  
    - Classical Utilitarianism. Adding any life-worth-living is always better, regardless of baseline. "B > A" and "A < B" hold unambiguously.  
  - **Disputed boundary case**:  
    - **Average Utilitarianism** with A (10 at welfare 10) vs. B (11 at welfare 9.1). From A, adding the 11th lowers average welfare (9.1 < 10), so B is worse. From B, removing the 11th raises average (10 > 9.1), so A is better.  
    - *Ruling*: This **is** baseline-relative betterness. Valuation flips: B is worse than A from baseline A, but A is better than B from baseline B—a contradiction unless "better than" is baseline-relative. If the theory treats "better than" as symmetric, it fails.  

  ### 4. **If there is no name, coin one**  
  - **Label**: **Baseline-Relative Valuation** (BRV)  
  - **Definition**: A theory has BRV if there exist populations A and B such that:  
    (i) When A is the baseline, B is not better than A;  
    (ii) When B is the baseline, A is not better than B;  
    (iii) This asymmetry arises solely from the choice of baseline, not from changes in A or B.  
  - **Test for new theories**:  
    - Construct two populations: A (n people at high welfare) and B = A ∪ {v} (adding one person with positive welfare below the average in A).  
    - Check:  
      (a) From baseline A, is B at least as good as A? (If no, BRV possible.)  
      (b) From baseline B, is A at least as good as B? (If no, BRV confirmed.)  
    - BRV holds iff (a) and (b) are both negative.  

  ### 5. **Feature or defect, and whether it is avoidable**  
  - **Feature or defect?** In regulatory economics, BRV violates the **principle of irrelevant alternatives**: baseline choice is arbitrary, so rankings should be invariant. It introduces arbitrariness—e.g., whether a policy is "improving" depends on how the status quo is defined. This is a **defect** for any theory aspiring to objective comparability.  
  - **Is it avoidable?**  
    - **Unavoidable for some repugnance-avoiders**: Theories rejecting the repugnant conclusion often deny that adding happy people is *required* (hence "B not > A" from A) but also deny that removing them is *required* (hence "A not > B" from B). BRV emerges naturally here.  
    - **Avoidable alternatives**:  
      - **Critical-Level Utilitarianism** (CLU): Adds a fixed welfare threshold ξ; lives above ξ count as positive. If ξ is set above the new person’s welfare, B is never better than A, *and* A is always better than B—no BRV.  
      - **Total Utilitarianism**: Always ranks B > A, avoiding BRV but embracing repugnance.  
  - **What would change my mind?**  
    - If BRV could be shown necessary for *any* coherent avoidance of repugnance (e.g., via an impossibility theorem), it might be defensible as a meta-requirement.  
    - If a theory avoided repugnance *and* BRV without ad hoc fixes (e.g., a non-arbitrary baseline selector), BRV would be merely contingent.  
    Currently, BRV appears inherent to asymmetric, non-totalizing views—a price for rejecting repugnance.
