prompt: |-
  I'm a teaching assistant for an undergraduate political theory course, and last week we ran a session on the boundary problem: the difficulty that any democratic procedure must take for granted a set of people whose decision counts as the decision of the group, while the identity of that set is itself one of the things supposedly up for democratic decision. The session went fine over the familiar ground. The students quickly saw that *let the people decide* is unhelpful when what is disputed is precisely who the people are, and we spent most of the hour on the standard contrast between a constituency defined by affectedness and one defined by subjection to coercion, together with the standard complaints that the first is wildly over-inclusive and the second leaves out everyone who is harmed without being governed. What I mishandled was a harder variant that a student raised in office hours afterwards, and I'd like help with the concept rather than with the syllabus: please don't give me readings, authors, or a literature map, just the conceptual structure.

  Her variant goes as follows. Suppose a polity adopts what I'll call a *variable franchise*: instead of a standing electorate, the constituency is reconstituted for each decision, and includes exactly those persons whose interests are affected by that decision above some specified threshold, with the determination made by a standing commission applying an affectedness test. I want four things explained. First, agenda-dependence: whether some group counts as affected seems to shift with which options are placed on the table and how the question is framed, so that a decision to build upstream, a decision not to build, and a decision framed as water-rights rather than flood-control each appear to enfranchise a different set of people. The composition of the deciders therefore seems to depend on choices that the deciders themselves make. Is this the same circularity as the familiar one about who decides who decides, or a different one, and does it have a different moral? Second, the move from a scalar to a binary: affectedness admits of degree while the franchise normally assigns equal votes, so the threshold looks arbitrary, and resisting that arbitrariness by giving the more-affected more weight seems to break political equality. Is the arbitrariness of the cut a real objection to affectedness as a criterion of inclusion, or is it benign? Third, the diachronic worry: if the constituency is reassembled issue by issue, there may be no persisting group that governs itself over time, and it becomes unclear why someone should regard a decision they lost as one they nonetheless made. Does the idea of self-government actually require a continuing demos, or is that an aesthetic preference for continuity? Fourth, the generality worry: every account of legitimate authority, including non-democratic ones, needs to say whose authority and over whom, so does the boundary problem give a distinctive objection to democracy, or is it a problem democracy inherits rather than one it creates?

  If you can, rank the four worries by how damaging you take them to be, say which of them the variable franchise is meant to solve and whether it does, and flag anything important that all four of them are missing.
reasoning: |-
  Okay, the user is a teaching assistant for a political theory course, and they're dealing with a tricky variant of the boundary problem raised by a student. The variant involves a "variable franchise" where the electorate is reconstituted for each decision based on affectedness, determined by a commission. They have four specific conceptual worries: agenda-dependence, the scalar-to-binary issue, the diachronic worry about a persistent demos, and the generality worry about whether this problem is unique to democracy. 

  First, I need to unpack each worry without getting into literature or authors, just the conceptual structure. The user explicitly doesn't want readings, so I should stick to pure analysis. 

  Starting with agenda-dependence: the concern here is that how a question is framed changes who is considered affected. For example, framing a policy as "water rights" vs. "flood control" might include or exclude different groups. This leads to circularity because the deciders influence who gets to decide. Is this different from the classic boundary problem? The classic problem is about who decides the initial demos, while here it's about each decision's scope being shaped by agenda-setting. The moral might be that agenda control becomes a form of power, which could be more manipulable than a fixed demos.

  Next, the scalar-to-binary issue. Affectedness is a spectrum, but the franchise is binary (you vote or not). Setting a threshold is arbitrary—why this cutoff? Weighting votes by affectedness might solve the arbitrariness but breaks political equality. The question is whether this arbitrariness invalidates affectedness as a criterion. Maybe it's benign because all thresholds involve some arbitrariness, but in democracy, equal voting is core. So this might be a serious flaw if political equality is non-negotiable.

  Then, the diachronic worry. Without a persistent group, can we still call it self-government? If the demos changes with each issue, someone might be bound by decisions they didn't participate in. The user asks if the need for continuity is essential or just aesthetic. This ties into whether democracy requires a "people" over time to build collective identity and accountability. Without it, legitimacy might erode because there's no ongoing community to accept losses.

  Lastly, the generality worry. Every political system must define its boundaries, so is this problem unique to democracy? The user wonders if democracy inherits this issue rather than creates it. The key is that democracy uniquely ties legitimacy to popular participation, making the boundary problem more acute. If the "people" are undefined, the foundation of democratic authority is unstable, whereas a monarchy might just declare boundaries by fiat.

  Now, ranking the worries by damage level. Agenda-dependence seems most damaging because it allows manipulation of the franchise through framing, undermining fairness. Scalar-to-binary is next because it challenges core democratic principles of equality. Diachronic worry follows, as it questions the coherence of self-government. Generality worry is least damaging because while shared, it's more acute for democracy.

  The variable franchise aims to solve the classic over/under-inclusion of fixed electorates but only addresses the static version. It handles the inclusion problem per issue but not these deeper issues. 

  What all four miss? The practical feasibility—like how the commission is chosen, its biases, or implementation costs. Also, they might overlook that affectedness can be socially constructed, not objective. Power dynamics in defining "affected" aren't addressed. Plus, the moral weight of coercion vs. affectedness isn't compared. 

  So structuring the response: tackle each worry conceptually, rank them, explain what variable franchise solves, and note the gaps. Keep it tight and conceptual as requested.
answer: |-
  Here's the conceptual breakdown of the four worries regarding the variable franchise, ranked by severity, with analysis of what the variable franchise solves and what all worries miss:

  ### **Ranking of Worries by Severity** (Most to Least Damaging):
  1.  **Agenda-Dependence**
  2.  **Scalar-to-Binary Arbitrariness**
  3.  **Diachronic Worry** (Lack of Persistent Demos)
  4.  **Generality Worry**

  ---

  ### **Conceptual Analysis of Each Worry:**

  1.  **Agenda-Dependence**  
      *   **Core Problem:** The set of "affected persons" isn't fixed by the *decision's substance* alone. It depends on how the question is *framed* (e.g., "build dam?" vs. "grant water rights?"), which options are presented (e.g., "build dam?" vs. "do nothing?"), and who sets the agenda.  
      *   **Circularity Type:** This is a *new, distinct circularity* beyond "who decides who decides?". Here, **the deciders indirectly determine *who counts as a decider* for *future* decisions** by how they frame issues and set agendas. The commission's application of the test is also vulnerable to agenda manipulation.  
      *   **Moral:** This undermines the legitimacy of *all* decisions. It prioritizes **agenda-setting power** over affectedness itself. Those controlling the framing/options effectively choose their electorate, making the franchise manipulable and potentially self-serving.  
      *   **Severity:** Most damaging – it attacks the core logic and stability of the mechanism.

  2.  **Scalar-to-Binary Arbitrariness**  
      *   **Core Problem:** Affectedness is a continuous spectrum; the franchise threshold is a sharp binary cutoff. Why is *this* level of affectedness the threshold for inclusion? Why not higher/lower?  
      *   **Arbitrariness Objection:** This *is* a serious objection to affectedness-as-criterion. While thresholds are often necessary, **the justification for *this specific* threshold is morally/politically fraught** and lacks a clear democratic principle.  
      *   **Weighted Votes?:** Giving the "more affected" more votes mitigates threshold arbitrariness but **violates political equality** (one-person-one-vote). It transforms the system into a form of **stakeholder governance**, not democracy based on equal citizenship.  
      *   **Benign?** Not benign. It exposes a **fundamental tension** between the democratic ideal of equal voice and the logic of affectedness.  
      *   **Severity:** Highly damaging – it reveals an inherent conflict within the criterion's application to democratic procedure.

  3.  **Diachronic Worry (Lack of Persistent Demos)**  
      *   **Core Problem:** Self-government implies a "self" that persists over time and governs *itself*. A constantly shifting demos lacks **collective identity, shared history, and reciprocal obligations**. Why should someone accept a loss on issue A when they weren't part of the demos for issue B that bound them?  
      *   **Requirement for Self-Government?** A persistent demos isn't *purely* aesthetic. It provides:  
          *   **Continuity of obligation:** Consent/association is ongoing, not per-issue.
          *   **Reciprocity:** "I lose some, you lose some" within a shared community.
          *   **Collective agency:** The "people" as an entity capable of long-term projects and self-binding.
      *   **Variable Franchise Impact:** It fragments the demos into transient "issue-publics." Legitimacy becomes transactional ("was I consulted *this time*?"), not relational ("am I part of *this* polity?").  
      *   **Severity:** Significant – it weakens the normative foundation of self-government and long-term legitimacy.

  4.  **Generality Worry**  
      *   **Core Problem:** Every authority structure (monarchy, oligarchy, democracy) must define its scope/subjects ("boundary problem"). Is this a *distinctive* flaw for democracy?  
      *   **Distinctiveness:** **Yes.** Democracy uniquely grounds legitimacy in the participation/consent of the governed. The boundary problem is **constitutive and inescapable** for democracy:  
          *   Non-democratic systems can define boundaries by force, tradition, or ascription without contradiction.
          *   Democracy *requires* a legitimate "demos" to authorize the procedure that defines the demos, creating a **logical and justificatory circle**.  
      *   **Inherited or Created?** Democracy inherits the *need* to define boundaries but **creates the distinctive *circularity* problem** because its legitimacy depends on the very group whose definition is contested.  
      *   **Severity:** Least damaging to the *variable franchise specifically* (it's a meta-problem for all democratic justifications). However, it highlights why the boundary problem is particularly acute for democracy.

  ---

  ### **What the Variable Franchise Solves (and Doesn't):**
  *   **Solves:** The variable franchise directly addresses the *static over/under-inclusion critique* of fixed constituencies (e.g., "affectedness includes the globe" / "subjected excludes the harmed"). It aims for **dynamic precision** – enfranchising only those *significantly* impacted *by this specific decision*.
  *   **Doesn't Solve:** It **fails to solve the core boundary problem** (who defines "affected"? how is the threshold set?) and **exacerbates** agenda-dependence, scalar arbitrariness, and diachronic instability. It shifts the problem from defining *the* demos to defining *the test* and *the commission* for each issue.

  ---

  ### **What All Four Worries Miss (Key Omission):**
  *   **The Problem of Power & Epistemology:** All worries implicitly assume the "affectedness test" can be applied **neutrally and objectively** by the standing commission. This misses:
      1.  **Power Dynamics:** Who appoints/controls the commission? How are its biases checked? The commission holds immense power to *constitute the demos*, creating a **new, unaccountable locus of authority**.
      2.  **Epistemic Challenge:** Determining "who is affected how much" is often **complex, contested, and value-laden**. Is it based on subjective experience, objective harm, potential risk, or normative claims? The commission's judgments are inherently political and disputable, undermining claims to neutral application.
      3.  **The "Affected" vs. "Responsible" Distinction:** Affectedness focuses on impact, not agency or contribution. It may fail to capture those who *cause* problems or bear long-term responsibility for outcomes, potentially weakening accountability.

  This omission is crucial because the feasibility and legitimacy of the variable franchise hinge entirely on the assumption that "affectedness" can be fairly and knowably determined by an institution – an assumption that is itself deeply problematic and political.
