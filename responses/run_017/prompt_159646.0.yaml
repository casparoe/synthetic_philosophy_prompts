answer: |-
  Here's an operational procedure for your ethics consult notes, grounded in your core concept of the "better-informed, clearer-headed self" (BICS), designed for speed and clinical utility. It explicitly addresses your dials and stopping points, and flags judgment calls.

  **Core Principle:** The goal is *not* to dictate the objectively "least harmful" action (your friend's position) or to fabricate a fictional patient. It's to **identify the action most likely to align with the authentic values and goals of *this specific decision-maker* (patient or surrogate), corrected for distortions caused by circumstance, misinformation, or impaired reasoning capacity.** We correct *beliefs*, not *values*.

  **The Dials (Set These Explicitly *Before* Starting Analysis):**
  1.  **Information Correction (Always ON, Level: High):** Provide missing, clarify misunderstood *factual* medical information (diagnosis, prognosis, treatment options/risks/benefits, likelihoods). Goal: Shared reality.
  2.  **Emotional/Physical State Correction (Usually ON, Level: Moderate):** Mitigate the impact of acute fear, severe pain, or extreme exhaustion *on the ability to process information and weigh options*. We do *not* correct for chronic depression, stable anxiety, or baseline personality.
  3.  **Reasoning Error Correction (Selectively ON, Level: Low):** Correct only clear, consequential logical errors *in applying their own stated values to the facts* (e.g., misunderstanding probability, ignoring clear consequences they *say* they want to avoid). We do *not* correct value judgments we deem "unwise."
  4.  **Value "Improvement" (Always OFF):** We *never* alter the decision-maker's core values, goals, or priorities (e.g., "quality of life > length of life," "fight at all costs," "religious duty"). We only clarify what they *are* and ensure factual beliefs support applying them.
  5.  **Order of Correction (Fixed):** 1. Information -> 2. Emotional/Physical State -> 3. Reasoning Error. *Rationale:* You need accurate facts first. Emotional state might block processing those facts. Only once those are addressed can you see if pure reasoning errors distort applying their values to the clarified situation. Changing the order (e.g., correcting reasoning before info) *does* risk flipping outcomes based on faulty premises.

  **The Procedure: Questions in Order**

  **Phase 1: Grounding & Information Gathering (The "What Is" Stage)**
  1.  **Q1: Who is the relevant decision-maker?** (Competent patient? Designated surrogate? Default surrogate?)
      *   *Good Enough Answer:* Legally defined and documented. Stop if unclear (e.g., dispute over capacity/surrogacy) - flag for legal/clinical review.
  2.  **Q2: What is the specific decision needing to be made *right now*?** (e.g., Intubate? Start dialysis? Withdraw pressors? Pursue surgery?)
      *   *Good Enough Answer:* Clear, specific, time-bound clinical action. Stop if overly vague ("what's best?") - reframe with clinical team.
  3.  **Q3: What are the relevant, agreed-upon *medical facts*?** (Diagnosis, prognosis with/without intervention, treatment options, risks/benefits, likelihoods, burdens)
      *   *Good Enough Answer:* Documented in chart, consensus among treating team. Stop if major factual dispute - defer to medical expertise/clarification.
  4.  **Q4: What are the decision-maker's *stated* values, goals, and priorities *relevant to this decision*?** (Elicited from patient/surrogate: e.g., "What's most important to you/your loved one right now?" "What are you hoping for?" "What are your biggest fears?")
      *   *Good Enough Answer:* Direct quotes or close paraphrases. Stop if completely incoherent or absent - may indicate need for capacity eval or deeper conversation.

  **Phase 2: Assessing the Gap (The "BICS Filter" Application)**
  5.  **Q5: Apply Dial 1 (Information Correction): Does the decision-maker demonstrate significant misunderstanding or lack of key medical facts?**
      *   *Good Enough Answer:* If YES, provide clear, concise factual clarification. Re-ask Q4 if values seem based on misinformation. *Hand Back Point:* If clarification is given and values *still* lead to a choice that seems harmful *based solely on their stated values*, proceed. We don't override values.
  6.  **Q6: Apply Dial 2 (Emotional/Physical State Correction): Is there evidence that acute fear, pain, or exhaustion is *significantly impairing* their ability to understand (Q5) or *apply their stated values* (Q4) to the clarified facts?** (Observe: Panic, incoherence, inability to focus, severe pain/distress during discussion).
      *   *Good Enough Answer:* Clinical judgment. If YES, recommend: a) Addressing distress (pain meds, anxiolytics if appropriate), b) Allowing rest, c) Re-convening discussion when improved. *Stopping Point:* If impairment is severe/unfixable and urgent decision needed, focus shifts to best *process* (e.g., identifying most reasonable surrogate if patient incapacitated). *Hand Back Point:* Once addressed, return to clarified Q4/Q5.
  7.  **Q7: Apply Dial 3 (Reasoning Error Correction): After Q5 & Q6, does the decision-maker make a clear reasoning error *in applying their own stated values* to the clarified facts?** (e.g., "I value avoiding suffering, but I want CPR for stage 4 cancer because it might give me 10 more years" [factual error]. Or "I know chemo has a 5% chance of cure and 95% chance of misery, but I feel lucky so I choose it" [gambler's fallacy - *if* they stated avoiding misery is paramount]).
      *   *Good Enough Answer:* Identify the *specific* error and gently point out the inconsistency with *their own* values/goals using the clarified facts. *Stopping Point:* If error persists despite clarification, or if correcting it reveals a *value conflict* they must resolve (e.g., "I see you both highly value fighting and avoiding suffering, but this treatment has a low chance of helping the fight while guaranteeing suffering. How do you weigh these?"). *Hand Back Point:* Always. We highlight the inconsistency; *they* must resolve it or choose which value dominates. **This is a major Judgment Call.** Err on the side of *not* labeling it an "error" unless the inconsistency is stark and consequential.

  **Phase 3: Synthesis & Recommendation (The "BICS Output")**
  8.  **Q8: Based on the clarified facts (Q5), mitigated impairments (Q6), corrected reasoning (Q7), and the decision-maker's *authentic, stated values* (Q4), what option appears most consistent with what they would choose if thinking clearly and fully informed?**
      *   *Good Enough Answer:* A clear recommendation ("Proceeding with intubation aligns best with Mr. X's stated value of fighting for recovery chance"; "Withholding dialysis appears most consistent with Mrs. Y's expressed priority to avoid burdensome interventions with low benefit"). It must flow logically from the previous steps.
  9.  **Q9: Is this recommendation consistent with standard ethical principles (beneficence, non-maleficence) and legal boundaries?**
      *   *Good Enough Answer:* Check for obvious conflicts (e.g., recommending active euthanasia). *Stopping Point:* If major conflict exists, recommend *against* the action and explain why. Flag for committee/legal.
  10. **Q10: State the recommendation clearly and concisely for the note.**

  **What This Procedure Can't Do:**
  *   **Resolve deep value conflicts:** If the patient/surrogate's core values are internally contradictory or clash fundamentally with medical reality *after* all corrections, the procedure can only highlight the conflict. The *human* must choose.
  *   **Guarantee outcomes:** It optimizes for *alignment with authentic values*, not medical success or avoiding all harm.
  *   **Eliminate uncertainty:** Prognostic uncertainty is inherent; the BICS acts within that uncertainty.
  *   **Replace human judgment:** Steps Q6 (assessment of impairment) and Q7 (identifying reasoning errors) are inherently judgment calls. The procedure structures the *inquiry*, not the answer.
  *   **"Fix" deeply held values:** We don't argue someone *should* value longevity over quality of life, or vice-versa.

  **Judgment Calls Wearing a Lab Coat (Be Explicit About These in Your Note):**
  1.  **Significance of Prior Statements (Q4):** How much weight to give an old, vague, or contextually different statement vs. current expressions?
  2.  **Level of Emotional/Physical Impairment (Q6):** Is this distress truly impairing *decision-making* or just making the discussion difficult?
  3.  **Identifying a "Reasoning Error" (Q7):** When is it truly an error in applying *their own values*, versus a value we disagree with or a different weighting of risks/benefits? *This is the most perilous step.*
  4.  **Synthesizing Conflicting Values (Q8):** If values conflict (e.g., "fight" vs. "avoid suffering"), which seems *more* core or dominant *to this person*?

  ---

  **Running the Cases:**

  **Case 1: 78M Advanced Dementia, Pneumonia ("Let me go if I can't recognize family")**
  *   **Q1-4:** Surrogate (likely family). Decision: Antibiotics for reversible pneumonia? Facts: High chance of recovery *from pneumonia*, no change in underlying severe dementia (unlikely to recognize family). Stated Values: Surrogate reports patient valued independence, feared burden, scribbled note.
  *   **Q5 (Info):** Ensure surrogate understands: Treating pneumonia *isn't* treating dementia. Success means returning to *pre-pneumonia* state (still severe dementia, no recognition), not improvement. Burden is short-course IV antibiotics.
  *   **Q6 (Emotion):** Assess surrogate stress/grief. Correct if needed (support, time).
  *   **Q7 (Reasoning):** Potential error: Conflating treating pneumonia with "fixing" dementia or prolonging a state worse than death. Clarify: The note rejects *living in* a state of non-recognition. Treatment *preserves* that exact state. Does surrogate see antibiotics as *opposing* the note's intent (avoiding that state) or just treating an acute insult? This is key.
  *   **Q8 (BICS Rec):** **Recommend treatment.** *Why:* The note rejects *being in* a state of non-recognition. Withholding treatment *causes* death *from pneumonia* while the patient is *in* that exact state he wanted to avoid. Treatment restores him to the *baseline* condition *he was already living in* when he wrote the note. His authentic value seems to be avoiding *prolonged life* in a state of non-recognition, not refusing easily treatable acute illnesses *while* in that state. The burden of treatment is low relative to the outcome (return to baseline). *You might dislike this* - it overrides the literal note but interprets it within the current context.
  *   **Q9-10:** Legal/ethical: Treatment is standard care. Recommend antibiotics.

  **Case 2: Young Pregnant Patient, "Everything Done" / Misunderstood Prognosis**
  *   **Q1-4:** Competent Patient. Decision: Aggressive life-sustaining measures if she decompensates? Facts: Very poor actual prognosis (e.g., metastatic cancer, high risk of maternal death even with intervention). Stated Values: "Everything done," pictures "going home with baby."
  *   **Q5 (Info):** **Crucially Correct:** Provide clear, compassionate, direct info re: actual prognosis with/without aggressive measures (e.g., "The medical reality is, even with the most aggressive intensive care, the overwhelming likelihood is that neither you nor the baby would survive. The treatment itself would be very burdensome.") Contrast with her picture. Document understanding.
  *   **Q6 (Emotion):** High fear/grief likely. Offer support, time, counseling. Re-convene if needed.
  *   **Q7 (Reasoning):** Potential error: Belief that "everything done" *can* achieve her hoped-for outcome. Clarify: "Given the medical facts we discussed, choosing 'everything done' is very unlikely to achieve your hope of going home with your baby. It is much more likely to lead to a prolonged process in the ICU for both you and the baby before death. Does understanding this change how you weigh the options?" **Hand Back Point:** This is value clarification. She might *still* prioritize "fighting" even with near-certain failure and high burden. We accept that value.
  *   **Q8 (BICS Rec):** **Recommend clarifying her goals in light of prognosis.** "If your primary goal is the small chance of survival for you and the baby, even with high burden, then 'everything done' aligns. If your priority shifts towards minimizing suffering for you and the baby given the overwhelming odds, then focusing on comfort measures aligns better." *No single recommendation if values shift.*
  *   **Q9-10:** Ensure understanding. Support her choice if truly informed.

  **Case 3: Surrogate (Sole Heir) for Incapacitated Patient**
  *   **Q1-4:** Surrogate (Sole Heir). Decision: Likely high-stakes (e.g., withdrawal of life support for potentially recoverable patient? Or demanding futile care?). Stated Values: Surrogate's interpretation of patient's values.
  *   **Q5 (Info):** Ensure clear understanding of prognosis/options.
  *   **Q6 (Emotion):** Assess for stress/grief.
  *   **Q7 (Reasoning):** **Critical Focus:** Scrutinize *how* the surrogate applies the patient's stated values. Is the recommendation *plausibly* consistent? Are there subtle shifts maximizing inheritance potential (e.g., refusing beneficial but costly long-term care; demanding futile care to hasten death)? Look for inconsistencies. **Judgment Call:** Is this a reasoning error (misapplying patient's values) or a value conflict (surrogate prioritizing inheritance)? *Do NOT accuse.* Ask probing Qs: "Help me understand how choosing [surrogate's choice] fits with what your mother/father told you about [specific value, e.g., wanting to live independently]?" "If there were no inheritance, would you still make the same choice based on mom's values?" **Hand Back Point:** If inconsistency is strong and can't be resolved, flag *for the committee/attending*: "The surrogate's recommendation appears inconsistent with documented patient values X and Y in ways that are not resolved by information or clarification. Further exploration of the basis for the surrogate's decision is warranted." **Stopping Point:** If clear evidence of bad faith, recommend *not* following surrogate decision; seek legal guardianship.
  *   **Q8 (BICS Rec):** If plausible consistency, recommend supporting surrogate. If implausible inconsistency, recommend *against* the surrogate's choice and state why it doesn't align with patient's known values.
  *   **Q9-10:** Ensure legality. Flag conflicts explicitly.

  **Key Takeaway for Your Friend:** This isn't fabricating a character. It's a structured method to mitigate noise (misinfo, distress, reasoning errors) so the *real* person's authentic voice can be heard more clearly in the decision. The "BICS" is a heuristic tool to correct process, not invent substance. It accepts that the "right" decision *for ethics consult purposes* is the one that best respects the decision-maker's autonomy as rationally exercised, not the one we calculate as objectively least harmful.
