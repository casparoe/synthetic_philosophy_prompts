prompt: |-
  You are a professional philosopher who works on social philosophy and the moral psychology of norms — the kind of person who has thought hard about what rules are *for* and what is going on when someone breaks one and feels fine about it. Please take this seriously and think carefully. Before you write the final answer, do a couple of paragraphs of unstructured brainstorming: list the candidate distinctions that might do the work, note which ones you're tempted by, and say what you threw out and why. Then commit to one account and stay with it. Answer in British English, please.

  Here is my situation. I'm American, I moved to a small town in Germany about three years ago with my German partner, our kid is in the local Kita, and in the last couple of months two things happened at once: I somehow got talked onto the parents' council, and at work I became the person who signs off on the team's timesheets and expense claims. So suddenly I'm the one enforcing rules I don't believe in, in a country where people around me seem to care about rules in a way I find bizarre, and I'm arguing about it with my partner's mother (a rule is a rule, if everyone did it there would be chaos) and with my brother in Ohio (rules are defaults, use your own judgement, nobody's watching). I think both of them are wrong, and I think they're wrong in different places, and I can't say exactly where.

  So let me just dump my gut verdicts on a pile of cases and see what you can make of them.

  1. Crossing on red at 6 a.m. on an empty road, not a car in sight. Fine. Waiting feels like superstition.
  2. The exact same crossing, but a neighbour's six-year-old is standing next to me and watching. Not fine — and it's a different flavour of not-fine than crossing into actual traffic would be. It's not about danger.
  3. Leaving a crate of returnable bottles next to the bin for someone to take, instead of returning them. Fine, and I'd call it generous.
  4. Putting the same bottles in the glass recycling instead. Careless, but if a friend did it I wouldn't say anything.
  5. A colleague quietly skips a pointless three-signature approval step so a shipment goes out on time, then tells our boss he did it. Fine, I'd defend him.
  6. The same colleague skips the same step because he'd rather not leave a record. Not fine. This is the bad kind.
  7. Rounding up an expense claim by about nine euros because the receipt didn't print. Not fine, and it bothers me *more* than case 6 bothers me, even though case 6 bends a bigger, more consequential rule.
  8. Telling the landlord that a neighbour parks in the disabled bay without a badge. Fine — feels like a duty, not like a choice.
  9. Telling my manager that a teammate is taking home office on a day the policy says be in the office. Not fine. Feels like grassing, and the fact that it genuinely is the rule doesn't fix that feeling at all.
  10. Following a rule I think is stupid because we agreed to review it next quarter. Fine, no complaint.
  11. Following a rule I think is actively hurting people, because there is a process for changing it. Not fine. Waiting for the process is no excuse here.
  12. Going into the office with a cold because the team is short-handed. Genuinely back and forth on this one, can't settle it.

  Here's the principle I've been trying out, which I suspect is broken: a rule is a tool that other people are relying on, so you may break one only when (a) the thing the rule is actually for isn't engaged in your particular case, (b) your breaking it doesn't take away the benefit other people get from it, and (c) you'd be happy for everyone else in the same situation to do the same; and breaking a rule openly is always better than breaking it and covering it up.

  I can see three problems with it and I want you to deal with all of them rather than picking your favourite.

  First, clause (c) sounds uncomfortably like my partner's mother's test, which I reject — I don't think the fact that everyone *could* cross on red at 6 a.m. makes crossing wrong. So either (c) needs restating so it stops collapsing into her view, or it needs dropping, and I want to know which, and what it costs me.

  Second, I keep wanting a distinction I can't quite state between rules that hold people *together* and rules that check up on people — the two-days-in-the-office rule seems to fail in a way the three-signature rule doesn't, because if everyone used their own judgement about whether their presence was needed that day, the office would be empty on the wrong days and the whole point would be gone. My teammate's exemption is only worth taking because other people are keeping the rule. Call that parasitism, call it what you like. I've started thinking in terms of slack: some rules can absorb quite a lot of quiet non-compliance before they stop doing their job, some can absorb almost none, and one person skipping a signature is fine while three is a collapse. Is slack the right axis, is it the same thing as the coordination-versus-accountability distinction, or are they two different things and I need both?

  Third, there's a case my principle handles badly, which is the expenses one: I wouldn't exempt myself from a rule whose entire job is to check on me, and yet my principle doesn't say that. It just says the function has to be engaged — well, in case 7 it obviously is engaged, I'm the one being checked. So maybe the repair is a clause about rules you're not allowed to judge your own compliance under. But then what do I do with case 12, where I'm judging my own case again?

  So: give me a principle, or two or three candidates, stated precisely enough that I could apply it cold, with the case that motivates each clause. Tell me which of my twelve verdicts it can't accommodate and which one you'd overturn, and be honest if more than one has to go. Give me its verdict on at least two cases I haven't listed — I'm thinking of the Kita rule that kids have to be collected by 16:30 (I was twelve minutes late once and the look the Erzieherin gave me has stuck with me for months, and I genuinely don't know whether that look was right), and of quietly ignoring a workplace diversity form that I think is collecting useless data. And finally, the thing I actually care about: on your account, is the German/American difference really a disagreement about rules versus conscience at all, or is it a disagreement about something else underneath — who is trusted to make exceptions, how visible the exception is, how much the group thinks of itself as a single thing — and if it is something else, which side has the better of it?
