prompt: |-
  I'm a backend dev with no philosophy background — I took one Great Ideas gen-ed and that's it — but I joined this pragmatism reading group bacause a friend dragged me in. There's this guy Sam who always ends up being the one who rulls on whether some belief counts as true. I've kept a list of his verdicts on cases we've talked about so far:

  - Ordinary perception: if he looks at the desk and says there's a coffee cup there and it's really there, he says that's true.
  - A comforting belief in an afterlife that has no evidence, isn't verified, and mostly just makes someone feel better: he says not true.
  - A simple math claim like 17 + 5 = 22: he says true.
  - A conspiracy theory that has a lot of believers, makes them feel empowered, but has zero evidence and falls apart when checked: he says not true.

  The new case we're voting on next week is Newtonian physics before Einstein. In 1900, physicists using Newton's laws could predict planetary orbits to amazing accuracy; the theory was verified, useful, and worked for every purpose anyone had. Later, relativity showed that Newton's absolute space and time weren't the final story — Newton's laws are now seen as an approximation that fails in strong gravity or at high speeds. The question for Sam: in 1900, was Newtonian physics (or the claim that space and time are absolute) true?

  I want you to predict Sam's verdict — true, not true, or whatever third option he'd give. More importantly, I care much less about the bare answer than about the rule he seems to be running. As far as I can tell, there are at least two or three pragmatist rules that fit all his earlier verdicts: one that ties truth to whatever the community of inquirers would settle on at the ideal end of inquiry (I think that's the Peirce-ish one), one that ties truth to what is expedient to believe, what has practical cash-value, what we can assimilate and verify in experience (the James-ish one), and maybe a simpler one that just says truth is whatever the current community of inquirers actualy agrees on. For each rule that fits his earlier verdicts, say what it predicts about the Newtonian case. Then give your best guess which one Sam is actually running and why — he did once grumble that he doesn't put much stock in 'some hypothetical endpoint of inquiry,' if that helps — and name one further case that would cleanly tell the rules apart if we asked him next month. And please say how confident you are in the prediction, and single out the part of your answer you're least sure about (for instance, how the Peirce-style rule really treats a theory that later gets overturned, or whether Sam's side-remark actually rules it out for him). Don't give me a bibliography or exact quotes from Peirce or James; I don't need citations and you couldn't look them up anyway, so just put everything in your own words, ok?
