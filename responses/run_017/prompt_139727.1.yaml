prompt: |-
  My philosophy tutor keeps firing off *existence is not a predicate* every time the ontological argument comes up, and he says it like the whole thing was settled in about thirty seconds. Then last week a joint maths-and-philosophy guy in my seminar (who does get a bit smug) said that only kills the old Anselm-and-Descartes style version, where you try to squeeze existence out of the concept of a greatest or most perfect being, and that the Gödel-style modal version doesn't treat existence as a plain predicate of individuals at all, so it sails straight past the objection. I dont know enough to tell who's bluffing, and honestly I suspect both of them are.

  Can you seperate out, as a list, the different precise things that one-liner could be claiming, from the nearly-trivial to the seriously contentious? The ones I can half-see are: that existence isn't a property individuals have alongside their other properties, because existential claims are quantificational rather than predicative; that existence adds nothing to a concept, so the concept of a thing isn't made richer or more detailed by adding that it exists; that no property or bundle of properties can entail that anything exists, so existence can't be part of an essence; and then the thought that *necessary* existence might be a different animal entirely, a genuine property even if bare existence isn't. Add any readings I'm missing.

  For each one, say whether it's trivial, whether it's plausible but contestable, and — this is the bit I actually care about — whether it would sink only the Anselm/Descartes style argument or would also sink the modal version, where a being is defined as having all the positive properties, necessary existence is counted as one of the positive properties, and a modal logic in which possibility collapses into necessity does the rest of the work.

  Two more things. First, my seminar guy's extra move: he says that even if existence isn't a predicate of *individuals*, it can still be a predicate of *properties* (a property's being instantiated), and that the modal argument mostly talks about properties of properties, so the slogan is aimed at the wrong logical type. Is that a real escape or just moving the bump in the carpet? Second, one of the readings above leans on existence being captured entirely by the existential quantifier — doesn't that quietly assume every name picks out something that exists, and does the objection look different if you drop that assumption?

  Context for why the precisification matters: my tutor used the line to close down the whole family of arguments, modal ones included; the seminar guy used it to argue that the modal one specifically survives. So tell me which reading each of them needs for their use, and which reading people most likely have in mind when they repeat it. Then tell me where, if anywhere, the real disagreement is.

  Lead with your bottom line in the first sentence, then give the list and the reasoning. No preamble, no restating my question back to me. British English throughout, please.
