prompt: |-
  I am in the third year of a doctorate on vagueness, and by an accident of committee seniority I have become the postgraduate member of my faculty's Academic Conduct Committee, which is rewriting its Code of Conduct this academic year. Because of what I work on, I have ended up as the person who vets the wording of every clause before it goes to the full committee and then to the university's legal officer. I would be grateful for a procedure I can actually hand to the other members.

  The constraints matter. There are about sixty clauses to check, and realistically no one will spend more than fifteen minutes on each. The other members are a chemist, a historian and a deputy registrar; the legal officer is unsympathetic to anything that sounds like theory, and reads vagueness as drafting laziness. Findings under the Code are appealed on the ground that a student could not reasonably have known what was prohibited, so the stakes are real, and the wording will bind us for five years.

  What I want is a decision procedure, in the form of ordered questions, that returns one of three verdicts on a clause's operative predicate: sharp enough as drafted; vague but defensibly so; or impermissibly vague, which means sharpen it with a stated cut-off or delete it. For each question, say what would count as a sufficient answer, and say where the procedure stops with a no and where it must hand the decision back to the committee because the issue is one of values rather than of meaning. Please be explicit about which distinctions survive the simplification and which you have deliberately dropped as unusable by non-philosophers.

  Four features of the draft Code are giving me trouble, and I would like the procedure to handle them rather than treat them as noise:

  1. Chained definitions, where the clause's predicate inherits its vagueness by cross-reference — for instance a prohibition defined by reference to accepted practice in the discipline, which is itself glossed elsewhere as what a reasonable practitioner would do. The vagueness is not local to the clause, so testing the clause in isolation gives the wrong answer.
  2. Aggregate predicates such as a persistent pattern of minor breaches or systematic disregard, where every individual instance is clearly below threshold and what is judged is the sequence. I am not convinced this is the same disease: the predicate does not look tolerant in the sorites sense, since one further instance can matter decisively. If it is a different problem, the procedure should say so and handle it separately.
  3. Multi-dimensional predicates, where two vague dimensions trade off against each other — significance in severity against significance in duration — so that there is no single dimension along which to run a sorites series.
  4. Deliberate vagueness and precedent drift. Sometimes we want the penumbra: it delegates judgement, avoids over- and under-inclusion, and is cheaper than precision. But our habit of resolving vagueness case by case means each decision fixes a new borderline, so after twenty decisions the line has migrated without anyone having chosen to move it. The procedure should say when vagueness should be retained, when it should be resolved by precedent rather than by definition, and what to do about the drift — a scheduled re-anchoring, a sunset clause, or something else.

  Please apply the finished procedure to three clauses from the current draft and show the working:

  - No member of the University shall cause significant disruption to teaching or examination.
  - Uncollegial behaviour towards other members of the University is prohibited.
  - A persistent pattern of minor breaches may be treated as a single finding of misconduct.

  Include at least one clause where sharpening makes things worse — where a bright line invites gaming, so that seven hours and fifty-nine minutes of notice becomes attractive — and say how the procedure tells a drafter when a cut-off is worse than a penumbra. And please give me one verdict I will not like: my suspicion is that the procedure will condemn the Committee's catch-all referring to conduct contrary to the spirit of the Code, which the Chair is attached to, but if your procedure in fact condemns something else, say that instead and say plainly that we will not enjoy hearing it.

  Two requests about how you write. First, be committed rather than survey-like: do not set out the menu of theories of vagueness and leave me to choose. Take a definite position on the practical upshots you build into the procedure — for example, whether borderline cases are to be treated as cases in which there is an unknowable fact for the Committee to find, or as cases in which the Committee is choosing where to put a line — and give your reasons. Then tell me, in a short closing note, which contested commitments the procedure builds in and what breaks if I drop them. Second, please write in British English. I would expect something in the region of 1,000 to 1,200 words for the procedure and applications together, plus the note.
reasoning: |-
  Okay, this is a fascinating and highly specific request from a doctoral candidate working on vagueness who's been thrust into a practical policy role. The user needs a robust decision procedure for evaluating vague predicates in an academic conduct code - with very real stakes given appeals can hinge on whether students could reasonably understand prohibitions. 

  The constraints are tight: non-philosophical committee members, legal skepticism about vagueness, and only 15 minutes per clause assessment. The user has also identified four particularly thorny features (chained definitions, aggregate predicates, multi-dimensional vagueness, and deliberate vagueness with precedent drift) that must be addressed. 

  What's especially interesting is the tension between the user's theoretical expertise and the need for operational simplicity. The committee won't care about sorites paradoxes but will care about appeal-proof drafting. The legal officer sees vagueness as laziness, but the user knows some vagueness is strategically necessary. 

  I'll need to build a procedure that:
  1. Uses accessible language avoiding philosophical jargon
  2. Provides clear binary decision points
  3. Explicitly handles the four flagged complexities
  4. Returns one of three verdicts with practical remedies
  5. Includes examples demonstrating "sharpening makes things worse" scenarios

  For the theoretical commitments, I'm leaning toward:
  - Rejecting epistemicism (borderline cases aren't unknowable facts but policy choices)
  - Embracing a pragmatic view where vagueness is permitted when precise boundaries would cause more harm
  - Treating aggregate predicates as distinct from classical vagueness since they involve emergent properties

  The trickiest part will be handling precedent drift. The procedure should probably:
  - Recommend retaining vagueness when flexibility is needed
  - Flag clauses needing "re-anchoring mechanisms" like sunset clauses
  - Distinguish between delegation-to-policy (good) and delegation-to-whim (bad)

  For the examples:
  - "Significant disruption" is clearly problematic and needs sharpening
  - "Uncollegial behaviour" might defensibly remain vague with proper anchoring
  - The "persistent pattern" clause illustrates aggregate vagueness requiring different treatment

  And yes, I'll need to deliver the unpleasant verdict that their catch-all "spirit of the Code" clause is indefensibly vague - which will annoy the Chair but is legally necessary. The key is showing how the procedure objectively leads to that conclusion.

  The British English requirement means watching spellings (behaviour not behavior) and phrasing ("reckon" over "think"). The word count target is manageable if I keep explanations crisp and examples focused.
answer: |-
  Here is a practical decision procedure for evaluating vagueness in conduct clauses, designed for non-philosophers under time constraints. It builds on a **pragmatic, policy-based view of borderline cases**: vagueness is a tool for delegation, not a flaw to be eradicated. Borderline cases are where the committee *exercises judgement based on institutional values*, not where it discovers an unknowable fact. This view is essential because:

  1.  **It prioritises function over metaphysics:** The goal isn't metaphysical precision but fairness, predictability, and effective governance.
  2.  **It justifies deliberate vagueness:** Some terms *must* be open-textured to cover unforeseen cases and avoid harmful bright lines.
  3.  **It addresses precedent drift:** Recognizing judgement means recognizing the need to manage how precedent evolves.

  **Dropped Distinctions:** We avoid discussions of higher-order vagueness, specific theories of truth in borderline cases (epistemicism, supervaluationism), and deep metaphysical debates about tolerance principles. The focus is solely on operational fairness and manageability.

  ---

  **Vagueness Evaluation Procedure for Conduct Code Clauses (Version 1.0)**

  **Purpose:** To assess whether a clause's key prohibition (the "operative predicate") is acceptably clear for enforcing the Academic Conduct Code, given potential appeals on grounds of reasonable foreseeability.

  **Input:** A single clause containing an operative predicate (e.g., "cause significant disruption", "uncollegial behaviour", "persistent pattern").

  **Output:** One of three verdicts:
  1.  **Sharp Enough (SE):** No significant vagueness problem. Clause can proceed as drafted.
  2.  **Defensibly Vague (DV):** Vagueness exists but is necessary/beneficial. Clause can proceed *if* accompanied by clear guidance/precedent management.
  3.  **Impermissibly Vague (IV):** Vagueness creates unacceptable risk of unfairness or unmanageable appeals. The predicate *must* be sharpened (with a cut-off, examples, or deletion) before proceeding.

  **Procedure (Ordered Questions):**

  1.  **Isolate the Predicate:** Identify the key phrase defining the prohibited conduct (e.g., "significant disruption", "uncollegial behaviour", "persistent pattern").
      *   *Sufficient Answer:* Clear identification of the phrase(s) carrying the evaluative load.
      *   *Stop if No:* Cannot proceed – re-draft clause for clarity of target predicate.

  2.  **Core Meaning Check:** Is there a clear *core* of obviously prohibited conduct covered by the predicate? (Is there *anything* everyone agrees would definitely violate it?)
      *   *Sufficient Answer:* Yes, with 1-2 clear, uncontroversial examples (e.g., "significant disruption" definitely covers setting off a fire alarm during an exam; "uncollegial behaviour" definitely covers physical assault).
      *   *Stop with IV if No:* If there's *no* clear core (e.g., "conduct contrary to the spirit of the Code"), the clause is **IV**. Delete or fundamentally re-draft. *This handles pure value delegation without anchor.*
      *   *Proceed if Yes:* Move to Q3.

  3.  **Chained Definition Check (Handles Feature 1):** Does the predicate rely *entirely* on another defined term (e.g., "accepted practice") that is itself vague? (Check cross-references).
      *   *Sufficient Answer:* Yes/No.
      *   *If Yes:* **Apply this entire procedure to the *source* predicate first.** The vagueness is inherited. The clause's verdict depends on the source predicate's verdict. (E.g., if "accepted practice" is **IV**, then the clause using it is **IV**). *Then proceed to Q4 for the clause itself.*
      *   *If No:* Proceed to Q4.

  4.  **Sorites Vulnerability Check:** Could adding a very small increment to a clearly *permitted* action eventually turn it into a clear *violation* without any clear point where it definitely changes status? (Classic Sorites test).
      *   *Sufficient Answer:* Yes/No, with a simple imagined series (e.g., for "significant noise": whispering -> quiet talking -> normal talking -> loud talking -> shouting -> air horn? Where does "significant disruption" start?).
      *   *Stop with SE if No:* If no plausible Sorites series exists (e.g., "possess a controlled substance" – you either have it or you don't), verdict is **SE**. *Procedure ends.*
      *   *Proceed if Yes:* Vagueness confirmed. Move to Q5.

  5.  **Aggregate or Multi-Dimensional? (Handles Features 2 & 3):**
      *   **Aggregate Predicate (Feature 2):** Does the prohibition hinge on the *combination*, *repetition*, or *pattern* of actions, where *each individual action might be clearly permitted*? (e.g., "persistent pattern of minor breaches", "systematic disregard"). *Mark as **AGG**.*
      *   **Multi-Dimensional Predicate (Feature 3):** Does the prohibition involve *two or more distinct vague factors* that can trade off? (e.g., "significant disruption" involves *duration* and *intensity*; "uncollegial behaviour" involves *intent*, *impact*, *context*). *Mark as **MULTI**.*
      *   **Simple Predicate:** If neither AGG nor MULTI applies, mark as **SIMPLE**.
      *   *Sufficient Answer:* Classification (AGG, MULTI, SIMPLE). *Proceed to Q6.*

  6.  **Gaming Risk Check (Sharpening Danger):** If we *were* to impose a sharp cut-off (e.g., "disruption lasting > 10 minutes", ">5 minor breaches"), would this create an obvious loophole or incentive for harmful conduct *just below* the cut-off? (e.g., disrupting for 9 minutes 59 seconds, committing exactly 4 minor breaches).
      *   *Sufficient Answer:* Yes/No, with a plausible example of harmful gaming.
      *   *If YES (Gaming Risk High):* Strong indication that **vagueness is necessary**. Verdict likely **DV**. *Proceed to Q7.*
      *   *If NO (Gaming Risk Low):* Verdict could be **IV** (needs sharpening) or **DV** (if other reasons). *Proceed to Q7.*

  7.  **Delegation Justification Check (Handles Feature 4 - Deliberate Vagueness):**
      *   *Ask:* Is the vagueness needed to allow the committee to:
          a)   **Cover unforeseen cases?** (Avoid under-inclusion).
          b)   **Avoid harmful over-inclusion?** (Prevent punishing trivial cases if defined sharply).
          c)   **Apply nuanced judgement based on context?** (Where factors like intent, impact, or disciplinary norms *must* be weighed case-by-case).
      *   *Sufficient Answer:* At least one strong 'Yes' to a, b, or c.
      *   *If YES:* Verdict is **DV** (Defensibly Vague). *Proceed to Q8 for Precedent Management.*
      *   *If NO:* Vagueness serves no clear policy purpose. Verdict is **IV** (Impermissibly Vague). *Procedure ends (Recommend sharpen or delete).*

  8.  **Precedent Drift Safeguard (Handles Feature 4 - Drift):** (Only for **DV** verdicts)
      *   *Ask:* Could repeated case decisions gradually shift the meaning of the predicate far beyond its original core without deliberate oversight? (e.g., "uncollegial" slowly expanding from bullying to include robust academic debate).
      *   *Sufficient Answer:* Judgement call based on breadth of term and expected case volume.
      *   *If Risk LOW:* Note in commentary. No additional requirement.
      *   *If Risk MEDIUM/HIGH:* **Require a safeguard:**
          *   *Option A (Preferred):* **Mandatory Guidance:** Accompany clause with non-exhaustive, illustrative examples of core violations and borderline areas in the published Code/Guidance.
          *   *Option B:* **Scheduled Review:** Add a note requiring the Committee to explicitly review and reaffirm/re-anchor the interpretation of this predicate every 3 years ("Re-anchoring Mechanism").
          *   *Option C:* **Sunset Clause:** Only if the vagueness is highly experimental or context-specific (rare). State the clause expires in X years unless explicitly renewed.
      *   *Sufficient Answer:* Selection of safeguard (A, B, or C) justified briefly. *Procedure ends for **DV**.*

  **Where Values Trump Meaning:** The procedure hands back if:
  *   Q2: *No core meaning exists.* Deciding what the *core* prohibition should be is a pure value/judgement call for the Committee.
  *   Q7: *Delegation Justification.* Deciding *whether* flexibility is needed for unforeseen cases, avoiding over-inclusion, or nuanced judgement is a policy/value choice for the Committee. The procedure *assesses* if vagueness serves *a* valid purpose, not *which* purpose is best.

  ---

  **Application to Example Clauses**

  **1. Clause:** *No member of the University shall cause significant disruption to teaching or examination.*
  *   **Q1:** Operative Predicate = "cause significant disruption".
  *   **Q2:** **Yes, Core Meaning.** E.g., Pulling a fire alarm during an exam; sustained loud shouting preventing a lecture.
  *   **Q3:** **No.** Not defined by reference elsewhere.
  *   **Q4:** **Yes, Sorites Vulnerable.** Whispering -> chatting -> loud argument -> playing music -> setting off alarm. Where is the boundary?
  *   **Q5:** **MULTI.** Involves dimensions: *Severity* (noise level, violence) and *Duration* (momentary vs. sustained).
  *   **Q6:** **Yes, High Gaming Risk.** Defining "significant" as >10 minutes loud noise invites 9m59s of disruption. Defining by decibel level ignores disruptive whispering or visual distraction. Sharp cut-offs are highly gameable and harmful.
  *   **Q7:** **Yes, Delegation Justified.** Needed for (a) unforeseen cases (e.g., new tech disruptions), (b) avoiding over-inclusion (e.g., brief, minor noise), (c) nuanced judgement (context matters: disruption in a 1000-person lecture vs. a 5-person viva).
  *   **Q8:** **Risk MEDIUM/HIGH.** "Significant" is broad. **Safeguard: Mandatory Guidance (Option A).** Accompany clause with examples in Guidance: Core: Fire alarm, sustained shouting. Borderline: Repeated phone ringing, prolonged whispering. Context factors: size of class, nature of exam.
  *   **Verdict:** **DV (Defensibly Vague)** + Mandatory Guidance required.

  **2. Clause:** *Uncollegial behaviour towards other members of the University is prohibited.*
  *   **Q1:** Operative Predicate = "uncollegial behaviour".
  *   **Q2:** **Yes, Core Meaning.** E.g., Physical assault, targeted bullying, sexual harassment, malicious false accusations.
  *   **Q3:** **No.** (Assumes not defined only by cross-reference).
  *   **Q4:** **Yes, Sorites Vulnerable.** Friendly debate -> heated debate -> personal insult -> threat? Helpful critique -> blunt critique -> harsh critique -> destructive criticism?
  *   **Q5:** **MULTI.** Involves *Intent* (malicious vs. clumsy), *Impact* (offence, distress, harm), *Context* (disciplinary norms, seniority), *Nature* (verbal, physical, written).
  *   **Q6:** **Yes, High Gaming Risk.** Any sharp definition (e.g., specific words banned) would be massively gameable and fail to capture the essence of collegiality/incivility, which is contextual and relational.
  *   **Q7:** **Yes, Delegation Justified.** Crucially needed for (c) nuanced judgement based on context and intent. Also (a) covers unforeseen forms of incivility. Avoids (b) over-including robust academic discourse or minor social friction.
  *   **Q8:** **Risk HIGH.** "Uncollegial" is extremely broad and culturally contingent. Drift towards stifling debate or tolerating toxicity is real. **Safeguard: Mandatory Guidance *and* Scheduled Review (Options A+B).** Publish core examples (bullying, harassment) and borderline areas (robust critique, social exclusion) with emphasis on context. Require Committee to review interpretation every 3 years.
  *   **Verdict:** **DV (Defensibly Vague)** + Mandatory Guidance + Scheduled Review required.

  **3. Clause:** *A persistent pattern of minor breaches may be treated as a single finding of misconduct.*
  *   **Q1:** Operative Predicate = "persistent pattern of minor breaches".
  *   **Q2:** **Yes, Core Meaning.** E.g., Student repeatedly (5+ times) turns up 2 minutes late to supervisions despite warnings; student habitually (weekly) submits bibliography slightly late.
  *   **Q3:** **No.** (Assumes "minor breach" is defined adequately elsewhere).
  *   **Q4:** **N/A - Check Q5 First.** This is an **AGG** predicate (Feature 2). *Sorites applies differently.* One more minor breach *can* decisively tip something into being a "persistent pattern". It's about an emergent property of the *sequence*, not gradual change in a single property. Tolerance is limited.
  *   **Q5:** **AGG.** (Marked as Aggregate).
  *   **Q6:** **Yes, High Gaming Risk.** Defining "persistent" as ">N breaches" invites stopping at N-1 breaches. Defining "pattern" rigidly ignores context (e.g., clustering in time vs. spread out).
  *   **Q7:** **Yes, Delegation Justified.** Needed for (a) covering varied sequences, (c) nuanced judgement (is a cluster of 3 minor breaches worse than 5 spread over years? What constitutes a "pattern"?). Avoids (b) over-including one-off minor breaches.
  *   **Q8:** **Risk MEDIUM.** "Persistent pattern" is vague but narrower than "uncollegial". **Safeguard: Mandatory Guidance (Option A).** Provide examples: Core: 5+ instances of the same minor breach after warnings. Borderline: 3 instances of different minor breaches; breaches clustered in one week vs. spread over a term. Mention factors: similarity, frequency, clustering, response to warnings.
  *   **Verdict:** **DV (Defensibly Vague)** + Mandatory Guidance required. *(Note: This treats AGG similarly to MULTI/DV for now, due to gaming risk and need for judgement. A stricter view might demand sharpening 'pattern', but Q6/Q7 justify vagueness here).*

  **The Verdict You Won't Like:** Applying Q2 strictly to the common catch-all clause *"Conduct contrary to the spirit of this Code is prohibited"*:
  *   **Q1:** Predicate = "contrary to the spirit of this Code".
  *   **Q2:** **No Core Meaning.** What is the *uncontroversial core*? What specific conduct *must* be covered by this that isn't covered elsewhere? "Spirit" is inherently undefined and lacks anchor. Without examples, it fails Q2.
  *   **Verdict:** **IV (Impermissibly Vague).** It must be deleted or fundamentally re-drafted (e.g., replaced by a specific clause targeting abuse of process or analogous serious misconduct not otherwise specified, *if* a core can be defined for *that*). This clause is an appeal magnet and delegates pure value judgement without constraint. The Chair's attachment is understandable (flexibility!) but Q6/Q7 likely fail too – it risks under-specified delegation and extreme precedent drift without clear justification *beyond* covering drafting laziness. **Deletion is strongly recommended.**

  ---

  **Closing Note: Contested Commitments & Consequences**

  This procedure builds in the following contested philosophical/practical commitments:

  1.  **Judgement over Discovery:** Borderline cases are policy choices, not factual discoveries. *If dropped:* The procedure collapses into epistemicism (demanding impossible precision) or nihilism (finding all vague terms **IV**). It justifies **DV** verdicts.
  2.  **Functionalism:** Vagueness is evaluated based on its practical consequences (gaming, fairness, flexibility), not abstract metaphysical defects. *If dropped:* The crucial **Q6 (Gaming Risk)** and **Q7 (Delegation Justification)** lose foundation. **DV** verdicts become unjustifiable.
  3.  **Precedent as Managed Drift:** Precedent evolution is inevitable but manageable. *If dropped:** **Q8 (Precedent Safeguard)** becomes unnecessary or impossible, increasing long-term risk for **DV** clauses.
  4.  **Distinctive Aggregates:** While handled similarly to **MULTI** here, **AGG** predicates are flagged as different from simple Sorites vagueness. *If dropped:** The specific risks and justifications for aggregate terms might be misdiagnosed.

  The procedure breaks if core commitments 1 or 2 are abandoned, as these underpin the rationale for retaining any vagueness (**DV**) and the practical tests for when it's necessary. Commitment 3 is essential for responsibly managing **DV** clauses. Commitment 4 improves diagnosis but isn't fatal if missed. This pragmatic approach prioritises a workable, fair, and legally defensible Code over theoretical purity. Good luck with the revisions.
