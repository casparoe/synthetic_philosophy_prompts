  Now, the three mismatches. For (i) unanimity: under independence, P(correct) drops as n increases if unanimity is required. The film uses unanimity, so how does it handle this? The key is correlation for the right reasons, which ties into signal-sharing. Juror 8's methods (re-enactments, experiments) are classic signal-sharing, which correlates jurors but through shared evidence, not just conclusions. Verdict-sharing would be bad because it spreads errors. 

  For (ii) asymmetry: the theorem is symmetric, but the film has reasonable doubt and the moral asymmetry (convicting innocent worse than freeing guilty). This affects error types—minimizing false convictions. The film's process is about reducing one type of error, not truth-tracking per se. 

  For (iii) undisclosed truth: since we never know the truth, the film can't claim accuracy. Instead, it focuses on the process eliminating reasonable doubt. The vindication is about procedural justice and reducing systematic biases, not necessarily correct verdict.

  Now, Juror 8's tactics. His refusal to declare innocence, secret ballot, physical demos—all signal-sharing. He avoids verdict-sharing by not pushing his conclusion. This builds correlation through evidence, which is epistemically positive. Juror 10's racist tirade shows non-epistemic correlation—bias spreading, leading to verdict-sharing without evidence.

  The three questions:
  1. The film vindicates suppression of Type I errors (false convictions) and restoring independence by breaking biased correlations. It's usable for Condorcet if we focus on independence restoration, even without truth-tracking.
  2. Unanimity: Juror 8's veto is different. His "not sure" stance creates a veto for doubt, not certainty. This forces signal-sharing, making unanimity defensible as a safeguard against errors, especially with doubt-based veto.
  3. Where the film resists: conversions like Juror 3's breakdown are emotional, not epistemic. Heat/fatigue factors, Juror 10's shame—these aren't evidence-based. The film's individualism contrasts with Condorcet's focus on numbers.

