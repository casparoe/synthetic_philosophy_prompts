prompt: |-
  Me and a mate had a long, stupid argument last night about our cost-benefit manual and I want it settled properly.

  I'm on the appraisal team at a transport regulator. We do maybe thirty appraisals a year, each one gets signed off by a board member who isn't an economist, and I've got about twenty mintues per project to sanity-check the distributional weighting. Three things we actually do: (1) income step weights — any benefit going to a household below the national median income gets multiplied by 1.6, above median by 0.7, and we recompute who counts as below median using post-project incomes; (2) an "identifiability premium" of 1.25 on any fatality-risk reduction that accrues to identifiable named people rather than statistical lives; (3) a 15% haircut on any option whose benefits are spread very unevenly across income groups, applied on top of the weighting.

  My mate — philosophy PhD, annoyingly good at this — says Harsanyi's aggregation theorem forces social welfare to be a weighted sum of individual vNM utilities with constant weights, so the only honest reason to count one person's pound for more is that their marginal utility of money is higher, which makes (2) and (3) pure hand-waving and (1) doubly bad because we recompute it after the project. I said no: the theorem is conditional — if the social ranking satisfies the vNM axioms and something like Pareto, then you get the weighted sum — so a regulator who doesn't buy independence for social choices just isn't bound by it, and we can weight by relative position, or by who's actually exposed to the risk, if we want. He said fine, then say out loud what you're giving up. I couldn't, and its been bugging me all day.

  So give me an audit I can run in twenty minutes on a set of weights like ours: the checks in order, what counts as passing each one, where the procedure stops with a no, and the points where it has to hand the decision to a human because the question is one of values rather than facts. The hard bit is the translation — keep whatever Harsanyi's result actually forces (weights attaching to utility rather than money, additivity across persons, the way a social ranking handles lotteries) but in language my board member can follow, and be honest about which of those distinctions survive being turned into a handbook rule and which get lost. Then tell me straight which of us loses the argument and what the loser has to give up.

  Write it as exactly five numbered items, each one or two sentences, with no introduction and no summing-up at the end: items 1 to 4 are the checks, and each one should say what it does to one of our three rules as it goes (I assume at least one of them dies — I have a bad feeling about which), and item 5 is where the procedure stops and hands off to a person, plus who loses the argument.
reasoning: |-
  Okay, the user is part of a transport regulator's appraisal team dealing with cost-benefit analysis. They've got a dispute with a colleague about their manual's distributional weighting methods. Let me break down their situation.

  They have three specific weighting practices: income step weights (1.6x for below median, 0.7x above), identifiability premium (1.25x for named individuals), and inequality haircut (15% reduction for uneven benefit distribution). Their philosophy PhD colleague argues these violate Harsanyi's theorem, which requires constant weights based on marginal utility of money.

  The user needs a practical 20-minute audit procedure for board members to evaluate these weights. The key challenges are translating economic theory into operational checks while acknowledging where value judgments are unavoidable. The procedure must assess each rule against theoretical constraints while staying accessible to non-economists.

  Harsanyi's theorem essentially says that if social preferences follow vNM axioms (completeness, transitivity, independence, continuity) and Pareto efficiency, then social welfare must be a weighted sum of individual utilities with fixed weights. The colleague's argument hinges on this requiring weights to reflect only marginal utility differences.

  For the audit design, I'll need to:
  1. Check if weights are applied to money rather than utility (violates theorem)
  2. Verify weights are fixed rather than outcome-dependent (problematic for recomputed income weights)
  3. Assess if weights respect additive separability (identifiability premium likely fails this)
  4. Evaluate if weights handle risk consistently (theorem requires linear treatment of probabilities)
  5. Acknowledge where value judgments override theorem constraints

  The income step weights recompute after project implementation - this makes them endogenous and violates the constant weight requirement. The identifiability premium explicitly values identifiable lives higher, contradicting the additive separability principle. The inequality haircut applies secondary adjustments, complicating the weighting structure.

  The colleague is technically correct about Harsanyi's requirements, but the user's point about regulators not necessarily accepting all axioms is valid. The practical resolution is that the weights can be used if the regulator consciously rejects certain axioms, but this must be explicit. The income recomputation seems hardest to defend theoretically.

  The audit should progress from easiest checks to more complex ones, flagging each rule's theoretical issues while allowing for deliberate value-based overrides. The final step should clearly state where the procedure requires human judgment calls about which axioms to uphold.
answer: |-
  Here are five numbered items for your cost-benefit weighting audit:

  1.  **Check if weights attach to money or welfare:** Verify each weighting factor multiplies a *monetary* benefit value (e.g., £ saved, time saved). If any weight (like 1.6x for low income) multiplies money directly, it implicitly assumes £1 has constant welfare value across individuals, conflicting with weighting *utility*. **Income step weights (1) fail:** weighting money assumes equal marginal utility of income, contradicting the *reason* for weighting. **Stop.**

  2.  **Check if weights are fixed properties of individuals:** For each weighting category (e.g., low-income group, identifiable person), confirm the weight depends *only* on the individual's fixed characteristics (like baseline income) and not on project outcomes. **Income step weights (1) fail:** recomputing "below median" after the project makes the weight depend on the project outcome, violating constant weights. **Stop.**

  3.  **Check if weights respect additive separability:** Confirm adding a benefit to person A doesn't change the weight applied to a *separate* benefit to person B. **Identifiability premium (2) fails:** giving a weight to person *because* they are identifiable (a social property) violates separability; the social value isn't just the sum of independently weighted individual benefits. **Hand off:** Requires human judgment on whether identifiability warrants overriding separability.

  4.  **Check if weights handle risk/lotteries linearly:** If the appraisal involves risk reductions (like fatalities), confirm the weight applied to a *statistical* life saved (e.g., 1 in 10,000 risk reduction for 10,000 people) is the same as the average weight applied if those same 10,000 people were *identifiably* at risk. **Identifiability premium (2) fails:** applying 1.25x only to identifiable cases means the social weight depends on the *form* of the risk lottery, violating linear treatment of probabilities. **Hand off:** Requires human judgment on the value of identifiability vs. statistical lives.

  5.  **Hand off for value judgments on fairness/Pareto trade-offs:** After passing checks 1-4 (or explicitly overriding failures flagged in 3/4), the **inequality haircut (3)** and any other distributional adjustments require explicit human approval. These involve trading off total efficiency (Pareto potential) against perceived fairness of the benefit distribution, which are fundamental value choices outside the theorem's scope. **You lose the argument:** You must give up claiming (1) and (2) are compatible with Harsanyi's theorem; they require explicit rejection of its axioms (constant weights, additive separability, linearity in probabilities).
