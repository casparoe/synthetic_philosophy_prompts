answer: |-
  ## Sestina for the Forecast Horizon

  The world began with certainty: no **shadow**,
  All cause lay open, clean within its **fold**.
  Our reason stretched towards a clear **horizon**,
  Each motion governed by exacting **measure**.
  Each planet traced its bright, appointed **orbit**,
  And every oak contained its destined **seed**.

  We thought each branch emerged from that first **seed**,
  No future hid within a lengthening **shadow**.
  Could calculation chart the moon's true **orbit**?
  We’d map the future, page by page, **unfold**.
  No force escaped the demon’s perfect **measure**,
  No storm was born beyond that sunlit **horizon**.

  Yet watch that distant, gathering **horizon**:
  A tiny flaw within the plotted **seed**,
  A digit lost beyond precise **measure**,
  Begins to cast a long, distorting **shadow**.
  The model’s fabric starts to strain, to **fold**,
  Predicting paths that leave their known **orbit**.

  We thought we knew the comet’s faithful **orbit**,
  Its path defined against the starry **horizon**.
  But equations twist; the clean solution **folds**.
  This isn't random drift from some stray **seed**,
  Nor chaos born from some vast, formless **shadow**.
  It’s structure failing fixed predictive **measure**.

  How far ahead retains sufficient **measure**?
  How long before we lose the true **orbit**?
  The error swells, a deepening **shadow**,
  Its growth relentless towards the time **horizon**.
  No added digit grants much further stretch; the **seed**
  Of doubt expands where manifold solutions **fold**.

  The model itself may be the deepest **fold**,
  A shape that holds no true predictive **measure**.
  Perhaps no state contains the future's **seed**?
  Perhaps we track not the precise **orbit**,
  But watch a neighbour path, a ghostly **shadow**,
  Converging near, then fleeing the **horizon**.

  *Observe the **seed**, the **orbit** we misplace:*
  *The **shadow** stretches past the time **horizon**,*
  *Where **measure** fails and manifold solutions **fold**.*

  ---

  **Notes on Fulfillment:**

  *   **Form:** Strict sestina rotation (6-1-5-2-4-3) observed across six stanzas; envoi gathers all six end-words into three lines.
  *   **End-Words:** Chosen for distinct ordinary/technical meanings:
      *   **Shadow:** Shade / Error growth (sensitive dependence) or Shadowing lemma.
      *   **Fold:** Bend paper / Bifurcation (manifold folding), phase space structure.
      *   **Horizon:** Skyline / Predictability horizon (Lyapunov time).
      *   **Measure:** Quantify / Mathematical measure, ergodic theory.
      *   **Orbit:** Planetary path / State trajectory in phase space.
      *   **Seed:** Plant source / Initial condition.
  *   **Semantic Drift:** Words begin mostly ordinary (sunlit horizon, destined seed, appointed orbit) and shift subtly towards technical senses (time horizon, state seed, neighbouring orbit, manifold fold, failing measure, lengthening shadow) without explicit announcement.
  *   **Philosophical Distinctions:**
      *   **Growth of Error (Stz 4):** "No added digit grants much further stretch" (fixed time horizon per precision).
      *   **Wrong Trajectory vs. Wrong Everything (Stz 5/Envoi):** "Track not the precise orbit, / But watch a neighbour path" (individual error) vs. "Where measure fails" (statistical behaviour potentially knowable even if specific path is lost).
      *   **Wrong Model (Stz 5):** "The model itself may be the deepest fold" (structural mismatch, no precision helps).
      *   **Laplacean Setup (Stz 1-2):** Presented straightforwardly ("certainty," "no shadow," "exacting measure," "appointed orbit," "destined seed").
      *   **Demon's Failure (Stz 3):** "The demon’s perfect measure" fails due to "a tiny flaw," *not* falsity of determinism.
  *   **Sensitive Dependence:** Earned by content (error growth, shadow stretching, precision limits) not form. The permutation itself is deterministic and periodic.
  *   **Envoi as Turn:** Shifts focus from *which* seed/orbit to the *aggregate* behaviour ("manifold solutions fold," "measure fails" in the statistical sense).
  *   **Content Constraints:**
      *   No randomness claim.
      *   Determinism not refuted (flaws are in *knowledge/model*, not law).
      *   Demon given a specific failure mode (precision limits).
      *   No butterfly mention (used "flaw," "digit lost," "vane" implicitly).
      *   No forced humility/wonder moral; ends with observation ("Observe...").
  *   **Meter & Sound:** Primarily flexible iambic pentameter, prioritizing clarity and rhythm for reading aloud. Line endings emphasized by the rotating end-words.
