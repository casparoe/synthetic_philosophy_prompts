  1. **Initial State**: (Not a card, just the starting point) One instance of an AI model is running on a single machine, processing one user's request.

  2. **Batched Forward Pass**: The data center now uses batched processing. The same model is applied simultaneously to 5000 different user inputs in a single forward pass. The weights are shared and the computation is done in parallel.

  3. **KV Cache Reuse**: To improve efficiency, the system now stores the key-value (KV) states from earlier tokens in a sequence and reuses them for subsequent tokens, avoiding recomputation.

  4. **Activation Checkpointing**: During the training of a model, instead of storing all intermediate activations (which uses a lot of memory), the system discards some activations and recomputes them during the backward pass when needed.

  5. **Triple Modular Redundancy**: To ensure reliability, every computation is run three times on three separate sets of hardware. The system then takes a majority vote of the outputs to decide the result.

  6. **Shadow Deployment**: A new version of the model is deployed alongside the old one. It processes the same live input data but its outputs are not used; they are discarded.

  7. **Speculative Decoding**: A small, fast "draft" model generates a sequence of tokens. Then the main, larger model verifies these tokens in parallel, accepting some and rejecting others. Most of the draft model's computations are discarded if rejected.

  8. **Checkpoint Restored**: The exact same model (from a checkpoint) is started on a machine in a data center on another continent. It is running but not receiving any inputs.

