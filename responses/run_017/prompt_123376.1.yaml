  1. **Initial State**: We start with one model running on one machine, serving one user. The number is 1.

  2. **Batched Forward Pass**: Serving the same model to 5000 users in one batched forward pass (same weights, applied to many different inputs at once).

  3. **KV Cache Reuse**: Earlier token states get stored and re-read for every later token instead of recomputed.

  4. **Activation Checkpointing**: During training, intermediate results are thrown away and recomputed later to save memory.

  5. **Triple Modular Redundancy**: Run everything three times on separate hardware and take a majority vote to catch bit flips.

  6. **Shadow Deployment**: A new model version runs on live traffic next to the old one, but its outputs are discarded.

  7. **Speculative Decoding**: A small draft model guesses ahead, the big model verifies, and most of the draft's work gets thrown away.

  8. **Checkpoint Restored**: The same model checkpoint is restored on a machine on another continent and left running.

  Additionally, we might want to include a scenario that forces a disagreement without words, so we'll design one that is particularly ambiguous.

  But note: the initial setup is one model running. We have 8 scenarios (including initial). We'll go through 7 changes.

