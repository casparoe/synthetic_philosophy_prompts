  - The room is a compute ethics board.
  - On the board: a single number (initially 1) representing the number of morally significant subjects in the facility.
  - Each round: read out an operational change (on a card), then everyone votes (up, down, same) and writes down the rule they used.
  - At the end: apply the group's own rules consistently across all rounds to see the final count.
  - Participants privately guess the order of magnitude of the final count before the reveal.
  - The cases are engineering scenarios that challenge intuitions about what counts.

