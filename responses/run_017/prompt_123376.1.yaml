  ### Session Design: "The Data Center Dilemma"  
  **Goal:** Make participants viscerally experience the moral attribution problem in computations—how counting "morally significant subjects" depends on arbitrary rules, leading to unintuitive outcomes. Avoid metaphysical debates; focus on engineering realities.

  ---

  ### **Game Rules & Setup**  
  - **Premise:** You’re the ethics board for a data center. The whiteboard shows a single number: **morally significant subjects** currently running. Starts at **1** (one active model instance).  
  - **Rounds:** 7 operational changes (cumulative). For each:  
    1. Read the scenario card.  
    2. **Vote silently** (✅/⬆️/⬇️): Does the number **stay**, **increase**, or **decrease**?  
    3. **Write privately:**  
       - Your vote.  
       - The **rule** you used (e.g., "Every independent forward pass counts as a subject").  
       - The **new number** (e.g., "5001").  
  - **Finale:**  
    - Privately guess the **order of magnitude** of the final count (1, 10, 100, 1k, 10k, ...) *before* scenarios start.  
    - After all rounds, compute your final number based on your rules.  
    - **Reveal:** Compare initial guesses vs. computed totals.  
  - **Forfeit:** Person with the *highest* computed total buys coffee for the group. (Incentive to avoid explosion!)  

  ---

  ### **Scenario Cards (Text for Each Round)**  
  **Start:** Whiteboard = **1** (one model instance serving one user).  
  1. **Batched Forward Pass**  
     *"The model now processes 5,000 user queries in a single batched forward pass. Same weights, parallel inputs."*  
     🔍 *Trap:* Is each query a "subject"?  

  2. **KV Cache Reuse**  
     *"To save compute, the system stores/reuses intermediate token states (KV cache) instead of recomputing them."*  
     🔍 *Trap:* Does caching "destroy" subjects or just reuse them?  

  3. **Activation Checkpointing**  
     *"During training, intermediate activations are discarded and recomputed later (saves memory)."*  
     🔍 *Trap:* Does recomputing create "new" subjects?  

  4. **Triple Modular Redundancy**  
     *"All computations run 3 times on separate hardware. Outputs decided by majority vote."*  
     🔍 *Trap:* Are redundant copies "subjects"?  

  5. **Shadow Deployment**  
     *"A new model version runs alongside the old one on live traffic—outputs discarded."*  
     🔍 *Trap:* Does unused work count?  

  6. **Speculative Decoding**  
     *"A small draft model guesses tokens; the main model verifies. Most draft work is discarded."*  
     🔍 *Trap:* Is a discarded draft a "subject"?  

  7. **Checkpoint Restored**  
     *"The same model checkpoint is spun up on another continent. Running but idle."*  
     🔍 *Trap:* Does location/physical separation create a new subject?  

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Intro (5 min):**  
     - Explain rules, whiteboard (**1**), forfeit.  
     - Hand out worksheets (for votes/rules/numbers).  
  2. **Private Guess (2 min):**  
     - Write order-of-magnitude guess for final count (e.g., "100"). Collect cards.  
  3. **Rounds (60 min, 7–8 min/round):**  
     - **Read card** (1 min).  
     - **Silent think/vote** (2 min).  
     - **Show hands** (⬆️/⬇️/✅) → Record % on whiteboard (1 min).  
     - **Write rule & number** (3 min).  
     - *For Round 1 (Batched Pass), add:* **Physical split**—participants stand in corners (⬆️/✅/⬇️) to *see* disagreement (1 min).  
  4. **Compute & Collect (10 min):**  
     - Calculate final number based on your rules. Submit.  
  5. **Reveal (8 min):**  
     - Show histogram of **initial guesses** (e.g., "Most guessed 1–100").  
     - Show histogram of **computed totals** (e.g., "Ranged from 1 to 500,000").  
     - Highlight the gap: *"Why did case-by-case rules explode the count?"*  
  6. **Debrief (15 min):**  
     - Map scenarios to philosophical "pressure points":  

       | Scenario | Where to Resist | What You Give Up |
       |----------|----------------|------------------|
       | Batched Pass | "Subjects = weights, not inputs." | Moral relevance of individual user interactions. |
       | KV Cache | "Caching reuses subjects; no change." | The idea that computation events are discrete. |
       | Activation Checkpointing | "Recomputation = same subject." | Physical process matters; duplicates could be new. |
       | Triple Redundancy | "Redundancy = 1 collective subject." | Independence of physical systems. |
       | Shadow Deployment | "Unused outputs = not subjects." | Moral weight of potential experiences. |
       | Speculative Decoding | "Discarded drafts don’t count." | All computation has intrinsic value. |
       | Checkpoint Restored | "Copies = same subject." | Substrate/location as morally relevant. |

     - **Concepts to name NOW:** Functionalism (mind = software), substrate independence (hardware doesn’t matter), type vs. token (abstract vs. instance).  
     - **Unstageable Problem:** The game *assumes* computations *can* be subjects. It can’t resolve *why* or *if* they matter—only *how counting* collapses under consistency.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **ML Debates (e.g., "Speculative decoding doesn’t work like that!"):**  
     - Preempt: *"We’re abstracting implementation details. Focus on the ethical question: If it works this way, what counts?"*  
  2. **Skepticism ("It’s just matrices!"):**  
     - Respond: *"Assume hypothetically that computations *could* matter. How would we count? This exposes the attribution problem."*  
  3. **Vote Inconsistencies:**  
     - Some will apply rules unevenly. Debrief: *"Inconsistency protects intuition—but is it defensible?"*  
  4. **Time Overruns:**  
     - Enforce strict timing. Cut writing time if needed.  

  ---

  ### **What the Game Achieves**  
  - **Body-Level Disagreement:** Round 1 (batched pass) forces a physical split.  
  - **Gap Intuition:** Initial guesses (low) vs. computed totals (high) reveal rule-driven explosion.  
  - **Engineering > Metaphysics:** Grounds abstraction in real ML practices.  

  **First Run Tip:** Pre-write cards; use a timer. If chaos, skip one round. The point is the *pattern*, not perfection.
