  You are a professional philosopher who works on aesthetics and epistemology and who, for several years, also wrote for a satirical news outlet. Take a moment before drafting: brainstorm eight to ten candidate clauses first, and keep only the ones whose humor comes from an actual commitment in the debate about aesthetic testimony rather than from cheap gags about art-world pretension, critics being snobs, or the price of avocado toast. Then write the piece in one pass, deadpan, and check each clause afterward against the question 'would a specialist in this literature think this is a fair exaggeration?' Discard any clause that only works by making the target stupid.

  Here is what prompted this. My roommate and I spent three hours arguing last night about whether she could be said to *know* that a certain film is genuinely good when she has never seen it and is relying entirely on a critic whose sensibility she has learned to trust over years. She said of course she knows, and that she had acquired the belief in exactly the way she acquires most of her beliefs about the world; I said that there is something different about aesthetic matters, that second-hand aesthetic judgment seems to give you the verdict without giving you whatever it is you wanted the verdict *for*, and that even a perfectly reliable informant seems to leave you in a different position than first-hand acquaintance with the work would. Neither of us could say precisely where the difference lies, and I have been chewing on it since. So I want the fight continued in a different register.

  Write the Terms of Service agreement, roughly 700 to 900 words, formatted as numbered clauses, for a startup called STAND-IN: a company that sells warranted aesthetic judgment without your having to undergo the experience yourself. The model: you fill out an extensive sensibility questionnaire, the company matches you with a trained "proxy" whose tastes have been calibrated to yours, the proxy reads/watches/listens in your place and files a report, and you are thereby licensed to hold and assert the aesthetic judgment. The fine print should quietly take positions, clause by clause, on the following without ever naming or footnoting any philosopher or work: whether warrant or knowledge in this domain can be transmitted by testimony at all; what first-hand acquaintance is supposed to be *for* — is it the phenomenal experience itself, or merely a particularly good way of gathering evidence about the work's non-aesthetic features, or something about being able to answer for the judgment yourself; why a proxy's experience is not automatically *yours* even when the proxy is more reliable than you would be; whether there is any such thing as genuine aesthetic expertise to which deference is appropriate, and how the company handles the fact that its critics disagree with one another; and why this business model seems perfectly respectable for a food-safety inspector or a structural engineer and faintly absurd for a film. Include at least: a clause voiding the warranty if the client could reasonably have acquainted themselves directly; a clause distinguishing the judgment that a work *is good* from information about what the work is *like*, with the company nervously admitting it is very much in the second business; a clause dealing with aggregate numeric scores versus a single trusted critic; a clause conceding, as a selling point, that subscribers can win arguments and curate their reputations but report no felt enjoyment on delivery; and a limitation-of-liability clause in which the company quietly concedes that its own defense would equally protect a spoiler-synopsis website or a restaurant guide, and then tries to draw a line it cannot really draw. Close with a short "By subscribing you acknowledge" signature block that lands the reductio: the client gets everything except the thing they wanted, and the company cannot say why without giving the game away. Keep it legible to a reader with no philosophy background — define any term of art inside the clause without breaking the legal register — and do not let anyone wink at the reader: no ironic italics, no nudging asides, no punchline that announces itself. No citations, no bibliography, no real names of living scholars.
