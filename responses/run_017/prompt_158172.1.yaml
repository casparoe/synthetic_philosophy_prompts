  Below is a concise, logically structured taxonomy for the leveling-down objection in distributive justice. It uses concrete cases to branch through the logical space before assigning positions. The tree has five branch levels, nine leaves (covering all requested positions), and fits on one A4 page when shrunk. Unoccupied cells are marked with explanations.

  ---

  ### **Taxonomy of Distributive Justice Views: Leveling-Down Objection**  
  *Key: Branch questions split views based on responses to concrete cases. Each leaf names a position and its "awkward commitment."*

  #### **Branch 1: Hurricane Case**  
  *A hurricane destroys the surplus of the better-off half, leaving everyone worse off but equal. Is this outcome better in any respect?*  
  - **Yes** → Equality has *some* intrinsic value (proceed to Branch 2).  
  - **No** → Equality has *no* intrinsic value here (proceed to Branch 3).  

  #### **Branch 2 (for "Yes"): Non-Existence Case**  
  *Equality is achieved because the better-off person never existed (only the worse-off person exists). Is this outcome better in any respect?*  
  - **Yes** → **Strong Telic Egalitarianism**  
    - *Awkward commitment:* Must accept that a world with one person at 50 is better (in one respect) than a world with two people at 50 and 100.  
  - **No** → **Weak Telic Egalitarianism**  
    - *Awkward commitment:* Must deny that equality matters in different-number cases, weakening the view’s universality.  

  #### **Branch 3 (for "No"): Policy Case**  
  *A policy lowers everyone’s expected welfare but equalizes their prospects. Is this policy desirable?*  
  - **Yes** → **Deontic/Pluralistic Egalitarianism**  
    - *Awkward commitment:* May endorse making everyone worse off to satisfy fairness constraints.  
  - **No** → Equality is not a constraint here (proceed to Branch 4).  

  #### **Branch 4 (for "No"): Choice Case**  
  *Inequality arises solely from the better-off person’s choices (e.g., hard work vs. leisure). Is this inequality unjust?*  
  - **No** → **Luck/Choice Egalitarianism**  
    - *Awkward commitment:* Must accept extreme poverty for those who make "bad choices," even with equal starting points.  
  - **Yes** → Proceed to Branch 5.  

  #### **Branch 5 (for "Yes"): Ignorance + Social Standing Case**  
  *The worse-off person never learns of the inequality, and their social standing is unaffected. Is the inequality unjust?*  
  - **No** → **Relational Egalitarianism**  
    - *Awkward commitment:* Inequality is permissible if hidden and relationally inert, even if large and unchosen.  
  - **Yes** → Proceed to Leveling-Down Welfare Case.  

  #### **Leveling-Down Welfare Case**  
  *Leveling down income increases overall welfare (e.g., via incentives). Should we prioritize equality?*  
  - **No** → **Parfit-Style Prioritarianism**  
    - *Awkward commitment:* May reject equality even when it indirectly improves welfare.  
  - **Yes** → **Sufficientism**  
    - *Awkward commitment:* No intrinsic reason to reduce inequality above a threshold, even if extreme.  
  - **Unnamed: Diminishing Marginal Value View**  
    - *Collapses with Prioritarianism:* Weighted priority to the worse-off is indistinguishable from prioritarianism in most cases.  

  #### **Unoccupied Cells & Notes**  
  - **Strong Telic + Deontic Hybrid?** → *Incoherent:* Telic views value equality as an end; deontic views treat it as a constraint. Combining both creates contradictions.  
  - **Relational + Sufficientism Hybrid?** → *Unexplored:* No major theorists defend this; relational views focus on status, sufficientism on thresholds.  
  - **Plain Sum-of-Benefits** → *Collapses with Prioritarianism near zero weight:* If priority to the worse-off is minimal, the views align. Otherwise, see Branch 5 → "No" to welfare trade-off.  

  ---

  ### **10-Question Quiz: "Which View Are You?"**  
  Answer each scenario with **A**, **B**, or **C**. Scoring key below.  

  1. **Hurricane Case** (as above):  
     - A: Better in some respect.  
     - B: Not better.  

  2. **Non-Existence Case** (as above):  
     - A: Better in some respect.  
     - B: Not better.  

  3. **Policy Case** (as above):  
     - A: Desirable.  
     - B: Not desirable.  

  4. **Choice Case** (as above):  
     - A: Not unjust.  
     - B: Unjust.  

  5. **Ignorance Case** (as above):  
     - A: Still unjust.  
     - B: Not unjust.  

  6. **Leveling-Down Welfare Case**:  
     Income equality reduces inequality but increases overall welfare. Prioritize:  
     - A: Equality.  
     - B: Welfare.  

  7. **Unequal Prospects Case**:  
     Two groups face 50/50 chances: Group A (100 or 200), Group B (150 or 150). Which is fairer?  
     - A: Group A (higher expected welfare).  
     - B: Group B (equal prospects).  

  8. **Threshold Case**:  
     Society A: All at 120 (above threshold). Society B: Half at 100, half at 200 (above threshold). Which is better?  
     - A: Society A (equal).  
     - B: Society B (higher total).  
     - C: Equivalent.  

  9. **Rescue Case**:  
     Save one person from 50→70 or another from 100→150. Same effort. Which?  
     - A: Person at 50.  
     - B: Person at 100.  

  10. **Social Power Case**:  
      Inequality causes no envy but lets the rich dominate politics. Unjust?  
      - A: Yes.  
      - B: No.  

  ---

  ### **Scoring Key**  
  Match your answers to the branches. If no match, see "Hybrid/Other" below.  

  | View                          | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Q8 | Q9 | Q10 |  
  |-------------------------------|----|----|----|----|----|----|----|----|----|-----|  
  | **Strong Telic Egalitarianism** | A  | A  | -  | -  | -  | -  | -  | -  | -  | -   |  
  | **Weak Telic Egalitarianism**  | A  | B  | -  | -  | -  | -  | -  | -  | -  | -   |  
  | **Deontic/Pluralistic Egal.**  | B  | -  | A  | -  | -  | -  | B  | -  | -  | -   |  
  | **Luck/Choice Egalitarianism** | B  | -  | B  | A  | -  | -  | -  | -  | -  | -   |  
  | **Relational Egalitarianism**  | B  | -  | B  | B  | B  | -  | -  | -  | -  | A   |  
  | **Parfit-Style Prioritarianism**| B  | -  | B  | B  | A  | B  | A  | A  | A  | B   |  
  | **Sufficientism**              | B  | -  | B  | B  | A  | A  | A  | C  | A  | B   |  
  | **Plain Sum-of-Benefits**      | B  | -  | B  | B  | A  | B  | A  | B  | B  | B   |  

  - **Hybrid/Other**: If your answers span multiple leaves (e.g., Q1=A but Q3=B), you may hold an unorthodox hybrid view. Use Q7–Q10 to check consistency:  
    - Q7=B suggests deontic leanings.  
    - Q8=C suggests sufficientism.  
    - Q9=A suggests prioritarianism.  
    - Q10=A suggests relational concerns.  
  - **Ambiguous?** Common overlaps:  
    - Prioritarianism vs. Sufficientism (if Q6=A and Q8=C).  
    - Luck Egalitarianism vs. Relational (if Q4=B and Q5=B).  
    Clarify by re-examining Branch 5 and Leveling-Down Welfare cases.  

  ---  
  This handout avoids slogans, uses concrete cases to sort views, and flags collapses (e.g., prioritarianism ≈ sufficientism near thresholds). The quiz provides self-diagnosis with ambiguity notes.
