  Okay, let me start by unpacking the user's problem. They're stuck in a debate about whether subsidiarity is a substantive principle or just an empty justification. They've outlined two clear positions: one that sees it as a functional two-limb test and another that views both limbs as too flexible to provide real guidance. The user's hypothesis is that this impasse stems from three underlying disagreements: different principles at play (epistemic, democratic, liberal), different paradigm cases, and an empirical question about the frequency of those cases. Plus, there's an unaddressed issue about how subsidiarity handles the pre-existing structure of governmental levels.

  First, I need to validate their analysis. The three-part hypothesis makes sense. Each camp might be prioritizing different aspects of subsidiarity without explicitly stating so. For example, if someone values democratic participation, they'll emphasize local decision-making, while another focused on efficiency might push for higher levels in cases of spillovers. This aligns with the user's first point.

  Next, the paradigm cases. It's interesting how each side uses different scenarios to prove their point. Spillovers versus local preferences. If you only look at one type, subsidiarity seems clear, but together they pull in opposite directions. The empirical question here is crucial but often ignored. How common are spillovers versus the need for local variation? Without data, the debate stays theoretical.

  The third part about the levels being a political artifact is a big deal. Subsidiarity assumes existing levels, but real problems like air pollution or water management don't fit neatly into those boxes. The user is right; this is a structural flaw. The principle can't suggest creating new levels, so it's inherently limited. 

  Now, why is this impasse happening? The user mentions courts defer to legislatures. That makes sense if subsidiarity is too vague—courts don't want to overstep. Also, national parliaments in the EU rarely object, which supports the "empty formula" view. But maybe it's not that the principle is empty, but that it requires normative choices disguised as technical ones. 

  The user’s hidden question might be: how can we move forward? They want a diagnosis, not a solution. So, breaking down the components of the deadlock is key. Conflicting principles, unexamined paradigms, and lack of empirical data are all interlinked. The levels issue might be the deepest because it challenges the principle's applicability from the start.

  What would progress look like? The user suggests refining the test, formal analysis under non-cooperation, empirical studies, or shifting the question. Empirical work on the frequency of spillovers vs local preference divergence could help, but it's complex. Formal models might clarify the insufficiency limb, but they could be too abstract. Reframing the question to acknowledge the necessary normative choices might be more honest. 

  Also, the levels problem needs addressing. Maybe subsidiarity should be part of a broader framework that includes designing governance structures, not just allocating within them. But that's beyond the principle as currently understood. 

  In conclusion, the user's hypothesis holds up. The core issues are the conflation of different principles and the lack of empirical grounding. Progress might require separating these aspects and admitting that subsidiarity isn't a one-size-fits-all solution. The levels issue remains a fundamental limitation that can't be resolved within the current framework.
answer: |-
  Your diagnosis is remarkably astute. The subsidiarity impasse isn't one deadlock but several intertwined disagreements, and your three-part hypothesis captures the core dynamics effectively. Let's break down the components and their implications:

  1.  **The Three Interlocking Disagreements:**
      *   **Which Principle? (Normative Foundations):** This is arguably the **most fundamental driver** of the impasse. The "empty formula" critique gains traction precisely because the two-limb test *itself* doesn't specify *why* "sufficient achievement" or "better achievement" matter. Different actors implicitly prioritize:
          *   **Epistemic Principle:** Efficiency, effectiveness, managing externalities/spillovers (favoring higher levels for certain functions).
          *   **Democratic Principle:** Accountability, participation, responsiveness to local preferences/identity (favoring lower levels).
          *   **Liberal Principle:** Autonomy, diversity, experimentation, competition, limiting central power (primarily favoring lower levels).
      *   **Which Paradigm Cases? (Conceptual Framing):** This is tightly linked to the normative foundation. The "real guidance" camp focuses on **cases where decentralized action demonstrably fails:** transboundary pollution, harmful regulatory races to the bottom, collective action problems requiring uniform standards. The "empty formula" camp focuses on **cases where centralization demonstrably overrides legitimate diversity:** divergent local preferences (e.g., social policy, cultural issues), stifling innovation through uniformity, imposing one-size-fits-none solutions. **This framing bias pre-determines the answer the principle "gives" in their eyes.**
      *   **Empirical Frequency/Severity:** This is the **critical but neglected dimension.** The debate assumes one type of failure (spillover/race vs. preference divergence/innovation stifling) is *more common* or *more damaging* than the other. Yet, robust comparative empirical analysis quantifying the relative prevalence, costs, and benefits of centralization vs. decentralization failures across diverse policy areas and contexts is scarce. This lack of shared empirical grounding allows both sides to selectively cite anecdotes supporting their preferred paradigm.

  2.  **The Levels Problem (The "Wrinkle"):**
      Your point here is **profound and exposes a fundamental limitation** most discussions ignore. Subsidiarity operates *within* a pre-defined, politically constructed architecture of levels (e.g., municipality, state/province/Land, nation-state, EU). It has **nothing substantive to say** about:
      *   Whether the *existing* levels are the *correct* ones for specific functions (e.g., should air quality be governed at the airshed level, not state or national?).
      *   Whether *new* levels of governance should be created for specific problems (e.g., river basin commissions).
      *   **This is a fatal incompleteness *if* subsidiarity is presented as a *comprehensive* principle for optimal governance design.** It presupposes the structure it purports to evaluate. A defender might argue subsidiarity is only meant to guide allocation *within an agreed structure*, not design the structure itself. However, this concedes the principle's profound dependence on prior political choices about territorial organization – choices often made without reference to subsidiarity's logic for specific functions. This significantly weakens claims that subsidiarity provides "real guidance" for optimal governance.

  3.  **Diagnosis of the Impasse:**
      *   **It's Not Primarily Verbal:** The disagreement isn't just about defining "sufficient" or "better." The core clash is **normative** (which values matter most?) and **conceptual/empirical** (which problems are we *really* trying to solve? and how common are they?).
      *   **It's About Incommensurable Starting Points AND Unacknowledged Empiricism:**
          *   **Incommensurability:** The epistemic, democratic, and liberal rationales often point in different directions. Prioritizing one inherently de-prioritizes others. Subsidiarity papers over this conflict by pretending the two-limb test neutrally balances them. It doesn't.
          *   **Unacknowledged Empiricism:** The *weight* given to each rationale in practice is heavily influenced by implicit beliefs about which kind of governance failure (decentralized or centralized) is more likely or severe in a given context. These beliefs are often untested assumptions.

  4.  **What Counts as Progress?**
      Expecting a definitive "winner" or a single refined test to resolve the impasse is unrealistic. Meaningful progress involves **disentangling and addressing the components** you identified:
      *   **Refine the Normative Debate:** Explicitly acknowledge that applying subsidiarity requires prioritizing *which value* (effectiveness, democracy, autonomy/experimentation) is paramount *for a specific type of decision*. Instead of arguing *whether* subsidiarity works, argue *under which normative priority* and *for which types of problems* it offers better guidance. Comparative analysis could map how different systems implicitly weight these values through practice.
      *   **Empirical Research Program:** This is the **most promising path for substantive progress.** Rigorous comparative studies are needed to investigate:
          *   The *relative frequency and cost* of policy failures attributable to insufficient centralization (spillovers, races, collective action failures) vs. excessive centralization (suppressed preferences, stifled innovation, poor fit, accountability deficits) across different policy domains (environment, social policy, economic regulation).
          *   The conditions under which one level demonstrably possesses superior information or capacity.
          *   The actual impact of inter-jurisdictional competition (positive innovation vs. negative races).
          *   This evidence wouldn't "solve" subsidiarity but would ground the debate in reality, challenging biased paradigms and informing the normative weighting.
      *   **Formal Analysis (Limited Utility):** Modeling the "insufficiency" limb under non-cooperation could be useful (e.g., defining thresholds for when non-cooperation genuinely renders local action "insufficient" vs. being mere political obstruction). However, this primarily addresses a symptom of the normative/empirical disagreements, not the core.
      *   **Change the Question / Acknowledge the Frame:** Accept that subsidiarity is **not** a purely technical, determinate principle. Frame it as:
          *   A **procedural discipline** forcing explicit justification for centralization, even if the bar is low.
          *   A **rhetorical commitment** to decentralized solutions, shaping the burden of proof.
          *   A **framework for structured contestation** over the fundamental values and problem diagnoses. Progress here means making the implicit contestation explicit and structuring debate accordingly.
      *   **Addressing the Levels Problem:** Acknowledge this as a separate, prior question of **institutional design**. Subsidiarity analysis could be explicitly linked to, or preceded by, analysis of functional scale (e.g., using Ostrom's principles or polycentricity). This doesn't "fix" subsidiarity but clarifies its scope limitation.

  **Conclusion:** Your three-part hypothesis is largely correct. The **normative conflict** (which value?) and the **conceptual framing** (which problem?) are the primary engines of the impasse, heavily fueled by a **lack of empirical grounding** regarding the relative importance of different governance failures. The **levels problem** exposes a deep structural limitation.

  **Progress will not come from refining the two-limb test alone.** It requires:
  1.  **Explicitly confronting the normative choices** inherent in applying subsidiarity.
  2.  **Investing in rigorous comparative empirical research** on the actual costs and benefits of centralization vs. decentralization failures across diverse contexts.
  3.  **Re-framing subsidiarity** as a valuable but inherently contested principle of justification and procedural discipline, rather than a source of determinate technical answers.
  4.  **Recognizing the levels problem** as a distinct governance design challenge.

  The impasse persists because the debate pretends to be about the *application* of a neutral principle, while it's fundamentally about *competing values* and *untested assumptions* about how governance fails. Shifting the focus to these underlying drivers offers the only realistic path forward. Expecting a single, universally accepted "answer" from subsidiarity is indeed unrealistic; its value lies in structuring the necessary, ongoing debate about multi-level governance, not resolving it.
