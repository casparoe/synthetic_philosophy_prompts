prompt: |-
  btw I'm not looking for a reading list here — I want someone to tell me where my framing breaks.

  Question about Aquinas on tyrannicide. My reading group got stuck on it and I want to get it straight before writing it up. The case I actually care about is what I've started calling consent-proofing: a ruler who comes in through a legitimate procedure and then systematically dismantles the machinery by which the people could ever remove him — packing the courts, rewriting who gets to vote and how votes get counted, capturing whatever body certifies the result — so that the consent that originally made him ruler can no longer be withdrawn by any lawful means. Formally he still has title, so he looks like the ruler-turned-tyrant rather than the usurper, and for the ruler-turned-tyrant Aquinas (as I read him) says removal belongs to public authority and that private people should just endure it, or pray. But then every real case of the thing I actually worry about lands in the do-nothing box, which makes me think I'm misreading the framework somewhere: is the title/exercise cut really about how you came to power, or about whether you still rule for the common good — i.e. does consent-proofing convert a tyrant in exercise into a tyrant in title by destroying the relation that was supposed to ground his authority in the first place? And is it anachronistic of me to talk about a right to kill tyrants in Aquinas at all, when he seems to be asking a different sort of question — who has authority, and what serves the common good — rather than one about private permissions? Five numbered points, one or two sentences each, no preamble and no summing-up at the end.
reasoning: |-
  Okay, the user is grappling with Aquinas' stance on tyrannicide, specifically in the context of a ruler who gains power legitimately but then dismantles mechanisms for removal, making consent impossible to withdraw. They call this "consent-proofing." Their main concern is whether Aquinas would classify such a ruler as a tyrant in title or exercise, and if that distinction affects the permissibility of removal, especially by private individuals. 

  The user feels stuck because Aquinas seems to say that only public authority can remove a ruler-turned-tyrant, leaving no recourse for "consent-proofed" tyranny. They suspect their framing might be flawed—perhaps misinterpreting the title/exercise distinction or anachronistically imposing modern "rights" language onto Aquinas' framework. 

  Breaking it down: First, Aquinas' title/exercise distinction is indeed about how the ruler came to power (usurper vs. legitimate but abusive), not just ongoing actions. Second, the "consent-proofing" scenario complicates this because it erases the original legitimacy by destroying the community's ability to dissent. Third, Aquinas focuses on authority structures, not individual rights—so "who may act" matters more than "is killing justified." Fourth, dismantling lawful removal mechanisms might implicitly make the ruler a usurper by nullifying the initial consent. Fifth, the user is right to sense anachronism; Aquinas isn't granting "rights" but asking where legitimate authority resides post-subversion. 

  The user's deeper frustration is practical: they want to know if Aquinas offers any path to resist systemic tyranny, or if his framework inevitably leads to passivity. The answer hinges on whether "consent-proofing" voids original title by attacking the foundation of authority itself—which Aquinas might treat as usurpation in substance, even if formally distinct.
answer: |-
  Here are five points addressing your framing:

  1.  **Title vs. Exercise Distinction:** Aquinas's distinction primarily hinges on *origin* (usurper vs. legitimately appointed) and *ongoing rule* (for private gain/oppression vs. common good). Consent-proofing complicates this by starting with title and actively destroying the *mechanisms* of legitimate rule and dissent.
  2.  **Consent-Proofing & Title:** By systematically dismantling the lawful means of withdrawal of consent, the ruler actively severs the *functional* basis of their original title (rule for the common good *with* implicit/explicit consent). This arguably converts them into a *de facto* usurper, attacking the very foundation of their authority.
  3.  **Public Authority Limitation:** Aquinas emphasizes that only "public authority" can judge/remove a ruler *with title*, even if tyrannical in exercise. Consent-proofing deliberately destroys or corrupts *all* such public authority, creating the core dilemma – the designated judge is either eliminated or made complicit.
  4.  **"Right to Kill" Anachronism:** You are correct that framing it as a "right" (especially a private one) is anachronistic. Aquinas asks *who possesses the legitimate authority* to act for the common good in this extreme case, not about individual permissions or rights per se.
  5.  **Breaking the Framework:** Consent-proofing exposes a potential gap: when the ruler *with initial title* destroys the *only possible public authority* capable of judging/removing them, Aquinas's clear distinction between "endure" (title, bad exercise) and "resist/kill" (no title) becomes strained. The ruler's actions may functionally annul their own title by destroying the polity's capacity for legitimate action.
