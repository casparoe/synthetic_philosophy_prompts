  ### Mark and Rubric  
  **Total Mark: 18/20**  
  - **Part (i): 9/10**  
  - **Part (ii): 9/10**  

  #### Rubric (applied uniformly across scripts):  
  **Part (i) (10 marks):**  
  - **9–10/10**: Correct verdicts for (a), (b), (c) with precise, well-justified explanations. Identifies the hardest verdict insightfully, diagnosing conceptual tensions beyond Mira’s case. Minor imprecisions allowed if non-substantive.  
  - **7–8/10**: Correct verdicts with adequate but underdeveloped explanations. Hardest verdict identified but defended weakly (e.g., focuses only on Mira without broader implications).  
  - **5–6/10**: One verdict incorrect/misapplied. Explanations vague or incomplete. Hardest verdict misidentified or poorly reasoned.  
  - **0–4/10**: Multiple errors in verdicts/explanations. Hardest verdict missing or fundamentally flawed.  

  **Part (ii) (10 marks):**  
  - **9–10/10**: Offers one strong reason to accept *and* one strong reason to resist the argument, both clearly explained. Robustly links the resistance to the meta-dispute about compatibility/freedom’s value.  
  - **7–8/10**: Reasons to accept/resist present but uneven (e.g., one underdeveloped). Link to meta-dispute stated but not fully elaborated.  
  - **5–6/10**: Superficial treatment of reasons (e.g., conflates concepts). Link to meta-dispute weak/missing.  
  - **0–4/10**: Fails to engage with the argument’s premises or the meta-dispute.  

  **Movement between bands**:  
  - **Upward** (e.g., 8→9): Greater precision in applying concepts (e.g., "ultimacy"), deeper engagement with stakes (e.g., why disappointment matters).  
  - **Downward** (e.g., 9→8): Overgeneralisation, missed nuances in the case, or incomplete reasoning.  

  ---

  ### Comments on Script  
  *(Written in British English for direct use)*  

  **Part (i)**  
  1. **Verdict on (a) Leeway**:  
     - *Correct*. Clear explanation that Mira lacks alternative possibilities given the procedure’s guarantee (fixed past/laws).  
  2. **Verdict on (b) Guidance**:  
     - *Correct*. Accurately notes her reason-responsiveness and the truth of the relevant counterfactual.  
  3. **Verdict on (c) Ultimacy**:  
     - *Correct but slightly thin*. Correctly identifies lack of ultimacy due to unchosen causes (the procedure/request). However, could strengthen by explicitly tying the "sufficient conditions" to Mira’s unchosen request (as stipulated).  
  4. **Hardest verdict to defend (c)**:  
     - **Correct and insightful**. Diagnoses the incoherence worry well: if ultimacy requires being an uncaused cause, it becomes impossible within any causal order. The link to determinism undermining reason-responsiveness is apt.  
     - **Minor flaw**: Overstates the "collapse into nihilism" point. An incompatibilist need not deny *all* difference-making (e.g., they might accept reason-guided actions matter but hold they aren’t *freely chosen*). Still, defensible.  

  **Interim note on "loss of (a)"**:  
  - *Correct but tangential*. The point that lacking (a) is no real loss is well-made (aligns with Strawsonian/Dennettian views), but the question did not ask for this. No penalty, but not credit-bearing.  

  **Part (ii)**  
  5. **Reason to accept the argument** (that (b) is worth wanting):  
     - *Correct and well-argued*. Appropriately invokes Frankfurt-style cases (counterfactual interveners) to show responsibility hinges on sourcehood (guidance), not leeway. Clear application to Mira.  
  6. **Reason to resist the argument**:  
     - *Correct and sophisticated*. Highlights the key distinction: sufficiency for responsibility ≠ fulfilling the *ideal* of freedom (e.g., "manufactured" vs. "authored" commitments). Excellent use of the disappointment motif from the question.  
  7. **Link to the meta-dispute** (compatibilism/incompatibilism):  
     - *Correct and precise*. Directly explains why settling responsibility practices doesn’t resolve what freedom is "worth wanting" (e.g., one can be blameworthy yet lack ultimacy, which some find deeply disappointing). Effectively shows the dispute is about values, not determinism’s truth.  

  ---

  ### Closing Note on Strongest Scripts  
  The strongest scripts would:  
  1. **Part (i)**: Press further on *why* (c) is incoherent (e.g., explore "sourcehood" regress dilemmas) or challenge whether Mira *truly* lacks ultimacy (e.g., if her request was reason-responsive).  
  2. **Part (ii)**: Reference specific theorists (e.g., Strawson on reactive attitudes vs. Kane on ultimacy) or examine if (b) *itself* presupposes (c) (e.g., can reasons-responsiveness be "ultimate"?).  
  3. **Overall**: Weave the "disappointment" criterion throughout, explicitly testing each variety against it.  

  **Script Summary**: A highly competent, philosophically nuanced script. Minor room for refinement on ultimacy’s implications, but part (ii) is exceptional in disentangling responsibility from ideals of freedom.
