answer: |-
  ### Decision Tree for Contractualism's Aggregation Problem  

  **Start Here:**  
  **Question 1: Finger vs. Migraines**  
  *Option A:* One person loses a finger.  
  *Option B:* Each of one million people suffers a mild migraine (one-day, non-debilitating).  
  → If **A is worse**, go to Q2.  
  → If **B is worse**, go to Q3.  

  ---  
  **Question 2: Equal Severe Harms**  
  *Option A:* One person has a severe headache (level 8 pain) for one hour.  
  *Option B:* Two people each have a severe headache (level 8 pain) for one hour.  
  → If **A is worse or equal**, go to Q4.  
  → If **B is worse**, go to Q5.  

  ---  
  **Question 3: Few Migraines vs. Finger**  
  *Option A:* One person loses a finger.  
  *Option B:* Ten people each get a mild migraine.  
  → If **A is worse**, go to Q6.  
  → If **B is worse or equal**, go to Q7.  

  ---  
  **Question 4: Unnoticeable Harm**  
  *Option A:* One person suffers a noticeable small harm (e.g., a paper cut).  
  *Option B:* Each of one million people suffers a harm so small no one notices or remembers it (e.g., losing one skin cell).  
  → If **A is worse**, **Leaf: Pure Non-Aggregation**.  
  *(Awkward: Allows saving one paper cut over preventing any number of undetectable harms.)*  
  → If **B is worse or equal**, **Leaf: Objective Harm Aggregation**.  
  *(Awkward: Counts harms even when they don’t affect well-being or experience.)*  

  ---  
  **Question 5: Risk Distribution**  
  *Policy A:* Certainly causes one person to lose a finger.  
  *Policy B:* Gives each of one million people a one-in-a-million chance of losing a finger.  
  → If **A is worse**, **Leaf: Ex Post View**.  
  *(Awkward: Rejects policies that are ex ante better for everyone.)*  
  → If **B is worse or equal**, **Leaf: Ex Ante View**.  
  *(Awkward: Allows imposing a catastrophic harm if the risk was small.)*  

  ---  
  **Question 6: Many Migraines vs. Finger**  
  *Option A:* One person loses a finger.  
  *Option B:* Ten million people each get a mild migraine.  
  → If **A is worse**, **Leaf: Threshold View**.  
  *(Awkward: Requires an arbitrary number of small harms to outweigh a large one.)*  
  → If **B is worse**, go to Q8.  

  ---  
  **Question 7: One Life, Many Small Harms**  
  *Option A:* One person suffers 100 mild headaches over a year.  
  *Option B:* A different person suffers one severe headache (level 8 pain) for one day.  
  → If **A is worse**, **Leaf: Life-Aggregation View**.  
  *(Awkward: Aggregates harms within a life but not between lives.)*  
  → If **B is worse**, go to Q8.  

  ---  
  **Question 8: Adding More Harms**  
  *Suppose:* One finger vs. one million mild migraines is worse than the finger (i.e., migraines win). Now add one more migraine. Does this make the migraine option even worse?  
  → If **Yes**, **Leaf: Linear Aggregation**.  
  *(Awkward: Demands precise interpersonal harm comparisons across different types.)*  
  → If **No**, **Leaf: Saturated Aggregation**.  
  *(Awkward: Adding harms stops mattering after a point—e.g., 1,000,001 migraines aren’t worse than 1,000,000.)*  

  ---  
  ### Global Notes  
  1. **Uncovered Cases:**  
     - **Simultaneous harms to one person** (e.g., 100 headaches at once) and **distribution case** (60% gain $10, 40% gain $1000) aren’t branch points. The tree prioritizes core aggregation conflicts.  
     - **Pairwise comparison views** (e.g., comparing each individual’s fate across options) are omitted. They often collapse into existing leaves (e.g., Linear or Threshold) or introduce circularity.  

  2. **Empty Cells & Unnamed Views:**  
     - **No "pure numbers never matter" + "ex ante" hybrid:** Incoherent—ex ante risks require aggregating probabilities.  
     - **No "dampened growth" leaf:** Often conflated with Saturated/Threshold. Unwritten due to arbitrariness.  
     - **No asymmetric (harms-only) aggregation:** All named leaves treat harms/benefits symmetrically.  

  3. **Indistinguishable Leaves:**  
     - **Pure Non-Aggregation** and **Ex Post View** overlap in rejecting small risks. Separated by Q4 vs. Q5.  
     - **Life-Aggregation** and **Linear Aggregation** might converge if "one life" is treated as "one person." Q7 forces the distinction.  

  4. **Problem Cases Handled Poorly:**  
     - **"Harm spread thin"** (Q4) is resolved but at extremes—no middle ground for barely-noticeable harms.  
     - **"One person with many small harms vs. medium harm"** (Q7) doesn’t specify timing (concurrent/sequential).  

