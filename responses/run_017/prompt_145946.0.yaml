prompt: |-
  I'm a PhD student in public administration, and for the past year I've been doing paid fieldwork with the homelessness services division of a mid-sized city government, sitting in on the redesign of how it contracts with nonprofit providers. The practical setting: beginning next fiscal year, renewal of the division's roughly twenty service contracts will be partly tied to measured performance, and the city charter requires that any contract specify "objectively verifiable" performance measures, which is being read internally as ruling out a purely narrative or site-visit-based review. I've been asked to draft the stress-test that each candidate measure must pass before it is written into a contract, and then to run it. What I need from you is a reusable decision procedure, not a general discussion: an ordered set of questions, what counts as a sufficient answer to each, the points at which the procedure stops with a no, and the points at which it hands the question to a person because it is a values question rather than a factual one. The people who will actually run it are two policy analysts with MPAs and no statistics beyond basic regression; they have about half a day per measure and six measures to get through in eight weeks before the contracts go out, with the deputy director signing off. The conceptual difficulty I keep running into is that the standard warning — that a measure stops being a good measure once control pressure is placed on it, the phenomenon usually called Goodhart's law, and its cousin in machine learning where an agent exploits the gap between the objective as specified and the goal as intended — is easy to assert and hard to build into a checklist, because most of the work a measure does is fine and only some channels of degradation are live for any given measure. So the procedure should force the analyst to name, in advance, the specific channels through which this measure in this setting could be improved without the thing we care about improving: reallocation of effort toward the measured case, selection of whom to serve, reclassification of what counts as a case, and any others you think belong on that list. I also want each incentivized measure paired with something that is not itself incentivized but would move if the target were being hit in the wrong way — a sentinel or tripwire indicator — and I want the procedure to say what to do when no good sentinel exists, since I suspect that is often. One more phenomenon I'd like handled: the tendency for an indicator to stop standing in for the messy thing it was chosen to track and to become, in staff reasoning, the thing itself, so that a drop in the number is not noticed as a drop in the quality of anyone's life. Where that happens, the procedure should say so explicitly rather than leaving it to the analyst's discretion.

  Please then run the procedure on three measures that are actually on the table. First: the share of enrolled households that exit to permanent housing within a defined period, which is the leading candidate for the largest contract weight. Second: the average number of days from program entry to housing placement, which the division likes because it is cheap to compute monthly. Third: the year-over-year change in the unsheltered count from the single-night January field enumeration, which the director is fond of because it is the number the city reports publicly. Be aware, and please do not soften this on my account, that I have argued in internal meetings for the first of these as the headline accountability measure and have gone on record supporting it; if the procedure's honest verdict is that it should carry no contract weight, or only a reduced weight under conditions, I would rather find that out from you than from a provider's lawyer. I'd also like one worked example in which the procedure returns an answer I will not like, and I want you to be explicit about what the procedure cannot do: where it will misfire, which forms of gaming it is structurally blind to (for instance gaming by providers who know more about their own data than the city does, or gaming that moves the sentinels along with the target), and where the residual judgment is irreducible rather than merely uneliminated.

  Finally, on your epistemic manner: please commit. Give a definite verdict on each of the three measures — tie it to contract weight, demote it to monitoring only, or drop it — with your reasons, and give a definite recommendation about the shape of the overall procedure rather than a menu of options for me to choose between. Where you are genuinely uncertain, say so and say what evidence would settle it, but still tell me what I should do on Monday.
reasoning: |-
  Okay, the user is a PhD student in public administration working on a contract redesign for homelessness services. They need a reusable decision procedure to stress-test performance measures, ensuring they're robust against Goodhart's Law and other gaming risks. 

  First, I need to unpack their core challenges: They want a concrete checklist, not theoretical discussion. The procedure must force analysts to predict specific degradation channels (effort reallocation, client selection, data reclassification) for each measure. It should also require "tripwire" indicators to detect gaming, and explicitly flag when a measure becomes detached from real-world outcomes. 

  The user's identity as a researcher-practitioner is key here. They're not just building an academic framework—this will directly impact city contracts and vulnerable populations. Their frustration with vague warnings about Goodhart's Law is palpable. They need operational tools, not platitudes. 

  Three test cases matter: 
  1) Housing exit rate (their preferred measure) 
  2) Days-to-housing 
  3) Point-in-time count change 

  I notice tension between their professional stake in the first measure and their request for brutal honesty. That takes intellectual courage—they're explicitly inviting criticism of their own proposal. 

  The deputy director's sign-off and tight timeline (6 measures in 8 weeks) mean the procedure must be executable by MPA-trained analysts in half-day increments. No statistical complexity allowed. 

  For the procedure structure, I'm considering: 
  - A phased approach with clear stop/no-go gates 
  - Mandatory gaming scenario forecasting 
  - Tripwire requirements with contingency rules 
  - Explicit ontology warnings (when measures become reified) 
  - Weighting guidance based on risk profile 

  On the test cases: 
  The housing exit rate might be salvageable with strict tripwires, but days-to-housing seems fatally flawed due to selection bias. The PIT count is irredeemable for contracting—it's practically designed for manipulation. 

  Biggest gaps in the procedure: 
  - It can't prevent collusion between providers 
  - It assumes baseline data integrity 
  - It misses gaming that moves tripwires too 
  - Provider data advantage remains a vulnerability 

  Better to be transparent about these limits than pretend they don't exist. The user would respect that.
answer: |-
  Here is a reusable decision procedure for stress-testing performance measures, followed by its application to your three cases. The procedure forces explicit consideration of degradation pathways, mandates tripwires, and flags ontological drift. It is designed for MPA-level analysts under time constraints.

  ---

  ### **Performance Measure Stress-Test Procedure**  
  *(Complete sequentially; stop if any step fails)*  

  1. **DEFINE THE TRUE GOAL**  
     - *Question:* "What specific real-world outcome (not output) is this measure intended to proxy? Describe in ≤10 words."  
     - *Sufficient Answer:* Concrete human/community outcome (e.g., "reduce nights spent unsheltered").  
     - *Stop if:* Vague ("improve well-being") or output-focused ("complete assessments").  
     - *Values Handoff:* If goal prioritization is contested (e.g., speed vs. stability of placements).  

  2. **IDENTIFY DEGRADATION CHANNELS**  
     - *Question:* "List specific ways providers could improve this metric *without* improving the true goal. Use these categories:"  
       - **Effort Reallocation:** Shifting resources to measured cases/activities  
       - **Selection Bias:** Serving easier cases to boost metrics  
       - **Reclassification:** Changing data labels/definitions  
       - **Creative Accounting:** Manipulating timing, eligibility, or denominators  
     - *Sufficient Answer:* ≥2 plausible, context-specific tactics per channel (e.g., for "exit to housing": *Selection*—prioritizing employed clients; *Reclassification*—calling transitional housing 'permanent').  
     - *Stop if:* No credible degradation tactics identified (indicates poor measure design).  

  3. **TRIPWIRE DESIGN**  
     - *Question:* "What unincentivized indicator would detect each degradation channel? How will it be collected?"  
     - *Sufficient Answer:*  
       - Tripwire directly monitors a degradation tactic (e.g., for *Selection Bias* in exits: "Demographic profile of enrolled vs. exited clients").  
       - Feasible data source (e.g., existing HMIS fields).  
     - *Contingency if no tripwire:*  
       - **Option A:** Demote measure to monitoring-only (no contract weight).  
       - **Option B:** Add audit requirement (e.g., random case review) with penalty for discrepancies.  
     - *Stop if:* No degradation channel has a tripwire/audit AND measure carries >10% weight.  

  4. **ONTOLOGICAL RISK ASSESSMENT**  
     - *Question:* "Could staff mistake this metric for the true goal? What explicit warning will accompany it?"  
     - *Mandatory Action:* Document in contract: *"This metric proxies [true goal]. Improvement must align with [tripwires]; divergence may trigger audit."*  
     - *Values Handoff:* If trade-offs exist (e.g., quantity vs. quality of exits).  

  5. **WEIGHT ASSIGNMENT PROTOCOL**  
     - *Scoring:*  
       - High risk (≥3 degradation channels with weak tripwires): Max 10% weight.  
       - Medium risk (1–2 channels with strong tripwires): Up to 25% weight.  
       - Low risk (all channels covered, auditable): Up to 40% weight.  
     - *Rule:* No measure >40% weight; ≥3 tripwires required for measures >25%.  

  ---

  ### **Application to Your Measures**  

  #### **1. Share of Enrolled Households Exiting to Permanent Housing**  
  - **Step 1 (Goal):** "Reduce homelessness duration" – **PASS**  
  - **Step 2 (Degradation Channels):**  
    - *Selection:* Skimming low-need clients; rejecting high-risk enrollees.  
    - *Reclassification:* Labeling unstable/transitional housing as "permanent."  
    - *Effort Reallocation:* Diverting staff from long-term supports to rapid exits.  
  - **Step 3 (Tripwires):**  
    - *For Selection:* "% of high-acuity clients (e.g., chronic homeless) enrolled vs. exited" (HMIS data).  
    - *For Reclassification:* "6-month housing stability rate post-exit" (spot-audit via provider records).  
    - *For Effort Reallocation:* "Average support hours/month post-exit" (service logs).  
    - → **Strong tripwires; PASS**  
  - **Step 4 (Ontology):** Mandatory warning: *"Exits must be stable; monitor tripwires for cream-skimming."*  
  - **Verdict:** **Medium risk** (selection/reclassification risks exist).  
    - *Contract Weight:* **Max 25%**, contingent on 6-month stability audits.  
    - *Your advocacy stands*, but with critical safeguards.  

  #### **2. Average Days to Housing Placement**  
  - **Step 1 (Goal):** "Reduce time experiencing homelessness" – **PASS**  
  - **Step 2 (Degradation Channels):**  
    - *Selection:* Only serving clients with pre-identified housing.  
    - *Creative Accounting:* Starting "clock" at program entry (not homelessness onset); excluding long-stayers.  
    - *Effort Reallocation:* Rushing placements into unsafe housing.  
  - **Step 3 (Tripwires):**  
    - *For Selection:* "Days homeless pre-enrollment" (HMIS).  
    - *For Accounting:* "Share of clients exceeding 30 days pre-enrollment" (HMIS).  
    - *For Unsafe Placements:* **No feasible tripwire** (requires post-placement inspections; infeasible at scale).  
    - → **CRITICAL FAILURE** (no tripwire for effort reallocation).  
  - **Verdict:** **Unacceptable for contracting.**  
    - *Action:* **Demote to monitoring-only.** Use for internal dashboards but *zero* contract weight.  

  #### **3. YoY Change in Unsheltered Point-in-Time (PIT) Count**  
  - **Step 1 (Goal):** "Reduce street homelessness" – **PASS**  
  - **Step 2 (Degradation Channels):**  
    - *Reclassification:* Pressuring unsheltered to enter shelters pre-count; changing geographic boundaries.  
    - *Creative Accounting:* Strategic timing/route selection during count.  
    - *Effort Reallocation:* Temporary relocation (e.g., bus tickets) during count week.  
  - **Step 3 (Tripwires):**  
    - *For Boundary Changes:* "Map of areas covered" (documentation) – **weak, retrospective.**  
    - *For Temporary Relocation:* **No observable tripwire** (covert activity).  
    - *For Methodology:* "Inter-rater reliability scores" – **doesn't address gaming.**  
    - → **FAIL** (no actionable tripwires).  
  - **Step 4 (Ontology):** Extreme risk – PIT becomes "the goal" versus reality.  
  - **Verdict:** **Drop from contracts entirely.**  
    - *Action:* Use PIT for public reporting only. Never tie payments to a snapshot metric vulnerable to transient manipulation.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Blind Spots:**  
     - **Provider Data Asymmetry:** If providers falsify tripwire data (e.g., misclassify acuity), audits are the only recourse.  
     - **Collusive Gaming:** Providers collectively shifting clients during PIT count.  
     - **Tripwire Co-option:** If "days homeless pre-enrollment" tripwire is gamed alongside the target.  
  2. **Residual Judgment:**  
     - Defining "high-acuity" clients or "stable housing" requires values-based thresholds.  
     - Weight assignment within bands involves policy priorities.  
  3. **Misfires:**  
     - Over-penalizing measures with theoretical but implausible risks (e.g., providers won’t bus clients for PIT).  
     - Underestimating gaming ingenuity (e.g., new tactics emerge post-implementation).  

  ### **Unliked Verdict Example**  
  **Days to Housing Placement** failed. Analysts might protest it’s "easy to measure," but the procedure *forced* confrontation with the unfixable risk of rushed placements. Without costly inspections, gaming is undetectable.  

  ### **Monday’s Actions**  
  1. **Adopt the procedure** as the standard screen.  
  2. **Demote Days-to-Housing** to monitoring; **drop PIT** from contracts.  
  3. **Cap Housing Exits at 25% weight** with mandated tripwires.  
  4. **Require ontology warnings** in all contracts.  

  The procedure prioritizes *actionable rigor* over theoretical perfection. It won’t prevent all gaming, but it forces explicit, documentable consideration of risks—making degradation a contractual breach, not just an "oops."
