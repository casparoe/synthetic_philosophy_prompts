  ### Decision Tree: Eliciting Latent Knowledge from Clinical Triage Models  
  *For internal safety reading group*  

  **Branch Questions** (8 binary splits; answer Yes/No):  
  1. **Factual Representation (FactRep):** Is there a fact of the matter about the model’s internal representations (beyond text dispositions)?  
  2. **Target Nature (TargNat):** Is the elicitation target a claim about the *world* (e.g., "patient deteriorates")? (If No: target is about the *model’s future outputs*.)  
  3. **Weight Modification (WeightMod):** May the method modify the deployed model’s weights?  
  4. **Ground-Truth Use (GTUse):** May the method use ground-truth labels revealed *after* deployment (e.g., 48-hour outcomes)?  
  5. **Separate Artifact (SepArt):** May a separate artifact (e.g., probe) be trained on the model’s internals?  
  6. **Robustness (Robust):** Must the readout survive optimization pressure *against* elicitation?  
  7. **Deployment Restriction (DepRestrict):** May we sidestep elicitation by deploying only where answers are independently verifiable?  
  8. **Timing Constraint (Timing):** Must the elicited fact be available *at deployment time* (not retrospectively)?  

  ---

  **Tree Structure & Positions** (9 leaves):  
  ```  
  START  
  │  
  ├── **FactRep: No** → **1. Instrumentalism**  
  │   *Awkward commitment: Denies predictive internal states exist, despite linear probe evidence.*  
  │  
  ├── **FactRep: Yes**  
  │   │  
  │   ├── **DepRestrict: Yes** → **2. Restrictionism**  
  │   │   *Awkward commitment: Forfeits model benefits in high-stakes, unverifiable contexts.*  
  │   │  
  │   └── **DepRestrict: No**  
  │       │  
  │       ├── **TargNat: No** → **3. Output Elicitation**  
  │       │   *Awkward commitment: Assumes "what the model would say if honest" is well-defined and accessible.*  
  │       │  
  │       └── **TargNat: Yes**  
  │           │  
  │           ├── **Timing: After** → [Subtree A: After-the-fact]  
  │           │   │  
  │           │   ├── **GTUse: No** → **UNOCCUPIED (Incoherent)**  
  │           │   │   *Why: After-the-fact elicitation requires labels; no ground truth → no supervision.*  
  │           │   │  
  │           │   └── **GTUse: Yes**  
  │           │       │  
  │           │       ├── **SepArt: No** → **UNOCCUPIED (Unexplored)**  
  │           │       │   *Why: No known methods for after-the-fact readout without a separate artifact.*  
  │           │       │  
  │           │       └── **SepArt: Yes** → **4. Retroactive Probing**  
  │           │           *Awkward commitment: Elicited knowledge is useless for real-time intervention.*  
  │           │  
  │           └── **Timing: Real-time** → [Subtree B: Real-time]  
  │               │  
  │               ├── **GTUse: Yes** → **UNOCCUPIED (Incoherent)**  
  │               │   *Why: Real-time deployment precludes using future ground truth.*  
  │               │  
  │               └── **GTUse: No**  
  │                   │  
  │                   ├── **SepArt: Yes**  
  │                   │   │  
  │                   │   ├── **Robust: No** → **5. Synthetic Supervision**  
  │                   │   │   *Awkward commitment: Relies on synthetic data matching real-world distributions.*  
  │                   │   │  
  │                   │   └── **Robust: Yes** → **6. Adversarial Reporter**  
  │                   │       *Awkward commitment: Requires training against unknown adversarial objectives.*  
  │                   │  
  │                   └── **SepArt: No**  
  │                       │  
  │                       ├── **WeightMod: Yes**  
  │                       │   │  
  │                       │   ├── **Robust: No** → **7. Truth-Tuning**  
  │                       │   │   *Awkward commitment: Needs synthetic data for fine-tuning; may distort capabilities.*  
  │                       │   │  
  │                       │   └── **Robust: Yes** → **8. Robust Honesty**  
  │                       │       *Awkward commitment: May degrade performance or incentivize obfuscation.*  
  │                       │  
  │                       └── **WeightMod: No**  
  │                           │  
  │                           ├── **Robust: No** → **9. Activation Engineering**  
  │                           │   *Awkward commitment: Highly prompt-dependent; brittle to distribution shifts.*  
  │                           │  
  │                           └── **Robust: Yes** → **UNOCCUPIED (Infeasible)**  
  │                               *Why: No known techniques for robust elicitation without weights/artifact.*  
  ```  

  ---

  **Placement of Candidate Methods**:  
  - **Retroactive Escrow**:  
    - **Path**: TargNat: Yes → Timing: After → GTUse: Yes → SepArt: Yes  
    - **Leaf**: **4. Retroactive Probing**  
  - **Contrastive-Pair Supervision**:  
    - **Path**: TargNat: Yes → Timing: Real-time → GTUse: No → SepArt: Yes → Robust: No  
    - **Leaf**: **5. Synthetic Supervision**  

  **Indistinguishable Leaves**:  
  - **5. Synthetic Supervision** and **6. Adversarial Reporter** both require a separate artifact and real-time elicitation.  
  - **Further question to separate**: *Must the reporter generalize to adversarial optimization?* (Robust: Yes/No splits them).  

  **Key Insights**:  
  - **Retroactive Probing** (escrow) is viable for auditing but useless for real-time care.  
  - **Synthetic Supervision** (contrastive pairs) assumes synthetic data suffices; breaks if activations differ in deployment.  
  - Unoccupied leaves highlight gaps: after-the-fact without artifacts, or robust real-time without weights/artifacts.  

