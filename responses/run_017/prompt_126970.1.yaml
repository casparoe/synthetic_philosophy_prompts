  ### Key Insights from Audit  
  1. **Core Inconsistency (b/e)**: Both describe identical causal paths (pressure → accommodation) but demand opposite judgments. Resolution requires defining "unjust narrowing" (b) vs. "meaningful role" (e) operationally.  
  2. **Asymmetry in (d)**: Treats exit-takers’ prior reports as distorted but not returners’. Revising (d) to symmetric evidence standards resolves tensions with (a) and (f).  
  3. **Cheapest Fix**: Modifying (d)’s asymmetry dissolves 3 tensions (d/f, a/d, d/e) without new inconsistencies.  
  4. **Unsupported Work**: (b) relies on a moral claim about injustice that (a) and (d) block from operational use without behavioral proof.  

  **Recommendation**: Revise (d) per above, drop "unjustly" from (b), and define systemic injustice for (b/e) distinction (e.g., "legally enforced exclusion from alternatives"). This retains (a)’s default, (f)’s neutrality, and (c)’s primacy while allowing behavioral overrides.
