prompt: |-
  I am a novelist, and I have for some time been unable to write a particular kind of scene. It is a crowd scene: people arrive one at a time in a square outside a house where something is wrongly believed to have happened; each arrives with private reservations; each reads the faces and postures of those already present rather than the facts; by the time the stone is thrown no one present individually wants to throw it, and no one can afterward be singled out as the one who decided. I keep rewriting it as a study in cowardice, and I have come to suspect that cowardice is the wrong explanation.

  I have read some popular economics but have no facility with formal modelling, so I would like the standard sequential-observational-learning account of informational cascades restated in the vocabulary I actually work in: scene and beat, point of view, free indirect style, dramatic irony, what a character wants and what she believes, what she can see from where she stands, plausibility, the difference between protagonist and ensemble, the narrator's access, misdirection, the turn.

  This is the version of the model I mean, so that the answer need not depend on recall: agents act in a fixed sequence, one at a time, each choosing between two actions; there is an unknown binary state of the world; each agent receives one private signal of known reliability; each observes all earlier actions but not the signals that produced them; each acts to maximize expected payoff given the public record plus her own signal; and the whole structure, including everyone's rationality, is common knowledge. In the simplest such setup the cascade locks in after two consecutive agents have acted alike, after which no further action conveys information; the cascade is wrong with a probability that stays bounded away from zero however long the sequence runs; and every agent in it can know all of this and still rationally conform. Please also keep this apart from the different case in which an agent uses her signal but acts against it because she wishes to appear well-informed, and note that in the model a locked-in cascade is not dislodged by a single contrary act, since by then a contrary act reveals nothing: it takes new public information.

  Three things, in order. First, the translation, as faithful as you can make it without importing my vocabulary's assumptions and calling them translation. Second, the residue: what maps cleanly onto scene, point of view and motive; what maps only with distortion — does rationality become plausibility of motivation, and if they are not the same, what is lost? does the reader's position under free indirect style have any counterpart, given that the reader is handed exactly the signals the model treats as private? is a character's private doubt really a signal, when in fiction doubt is often expressive rather than evidential? Third, what cannot be said in my vocabulary at all, and whether that residue indicts fiction or the model.

  Two intuitions of mine to test rather than flatter. I want a single truth-teller — the child in the story of the emperor with no clothes — to be able to break the thing, and the model seems to say that a lone deviation is uninformative; is my intuition sentimentality, or does it point at something the model has left out, such as unequal signal reliability, a character known to prefer breaking ranks, or the difference between speaking and acting? And I want to say that the crowd's cruelty is structural rather than a sum of individual failures of nerve: does the model vindicate that, or does it entail that there is nothing there but the sum?

  Finally: what would a scene faithful to the model actually look like on the page, and would it be dramatically inert?
reasoning: |-
  Hmm, the user is a novelist struggling with writing a crowd scene about an informational cascade. They want me to translate an economic model of sequential observational learning into literary terms. This is fascinating - they're essentially asking for a bridge between rational choice theory and narrative craft.

  The core problem seems to be that their scene keeps turning into a study of cowardice, but they suspect that's the wrong framing. The economic model they reference (Bikhchandani, Hirshleifer & Welch, 1992) suggests people rationally follow the crowd due to information cascades, not moral weakness. 

  Let me unpack their request. First, they want a faithful translation of the model using literary devices: scene/beat, POV, free indirect style etc. Second, they want to know what gets lost in translation - like whether "rationality" maps neatly to "plausibility". Third, they're concerned about elements the model can't capture, like why a single truth-teller (the "emperor's new clothes" moment) might actually work despite the model saying otherwise.

  Their two key intuitions are telling: they want structural cruelty rather than individual cowardice, and they want the possibility of a cascade-breaking moment. The model supports the structural interpretation but challenges the lone hero trope - in pure theory, one contrarian doesn't change anything. 

  For the translation: I'll need to show how each model element becomes a narrative device. The "unknown state" becomes dramatic irony; "private signals" become internal conflicts shown through free indirect style; "public actions" become observable behaviors that characters misinterpret. The moment when the cascade locks (after two identical actions) could be a crucial narrative turn.

  The residue question is profound. Rationality in the model is cold Bayesian updating - but in fiction, we need emotional plausibility. A character's "doubt" in fiction is often emotional, not evidentiary. And while readers get privileged access to private signals, real observers don't - that tension creates dramatic irony.

  For what's unsayable: fiction can show the visceral horror of conformity that the model abstracts away from. The model can't capture how a known truth-teller might break the cascade, or how speaking differs from acting. Their emperor's-new-clothes intuition might work if the child has special credibility or if the act is speech rather than action.

  For the scene itself: it could start with small, ambiguous actions that gain false certainty. Each new arrival misreads the scene, their private doubts suppressed by the weight of consensus. By the stone-throwing moment, everyone acts against their private judgment. It wouldn't be inert if we feel characters' inner conflicts - the tragedy is they're all rational yet collectively wrong.

  Ultimately the model vindicates their structural cruelty idea but challenges their truth-teller fantasy. The real horror isn't cowardice but that no one needs to be cowardly for atrocity to happen. That's where the dramatic power lies - in the gap between individual rationality and collective madness.
answer: |-
  Below is a rigorous translation of the sequential observational learning model into narrative craft, followed by residue analysis, intuition testing, and a scene blueprint. The aim is precision, not poetic reconciliation.

  ### 1. Faithful Translation to Narrative Vocabulary
  **The Model's Core Elements Rendered in Prose Mechanics:**

  - **Unknown State of the World → Dramatic Irony:**  
    The *actual truth* (e.g., "no crime occurred in the house") exists. The narrator knows it; readers may suspect it; characters do not. It hangs over the scene like weather.

  - **Private Signals → Restricted Point of View (POV):**  
    Each character enters with a *fleeting, subjective impression* (e.g., "a flicker in the curtains," "a rumor from a drunk neighbor"). This is shown via **free indirect style** (e.g., *"Probably nothing, Lena thought. Still, that flicker…"*). Crucially:  
    - **Reliability = Character Credibility:** A stablehand’s signal ("saw shadows") is less reliable than a doctor’s ("heard a gasp, medical distress?").  
    - **Not Expressed Doubt:** The signal is a *seed of conviction*, not angst. Doubt emerges from signal/public-action conflict.

  - **Public Actions → Observable Behaviors:**  
    Actions are physical, unambiguous: *standing too close to the house, muttering, clutching a stone*. They accumulate like stage directions. No internal states leak out—only deeds.

  - **Rational Updating → Plausible Motivation:**  
    When Elara arrives 5th, she sees:  
    - *Aggressor 1* (Glared at windows)  
    - *Aggressor 2* (Kicked the gate)  
    - *Hesitant 3* (Frowned but stood beside #2)  
    - *Aggressor 4* (Threw a bottle)  
    Her own signal: *"A child’s laugh—play, not pain."*  
    Her calculation: *"Four saw violence; I heard a laugh. Laughs lie. They must be right."*  
    **This is not cowardice.** It’s Bayesian logic in layman’s skin: *"My eyes deceive, not the crowd."*

  - **Cascade Lock → Narrative Turn:**  
    After two matching actions (e.g., two stone-throwers), the next character **ignores their signal rationally**. The "turn": the crowd becomes a single organism. Later actions are **dramatically inert**—ritual, not decision.

  - **Common Knowledge → Embedded Conventions:**  
    Characters assume others are rational observers. No one whispers, *"What if they’re all fools?"* That option is excluded by the world’s rules.

  ---

  ### 2. The Residue: What Distorts or Evaporates
  - **Rationality vs. Plausibility:**  
    Rationality maps to *motivational plausibility* but loses the *model’s cold consistency*. Fiction demands emotional logic: a character might reject the cascade because her sister died in a riot. The model forbids this. **Loss:** The terror of perfect rationality leading to error.

  - **Reader’s Position vs. Free Indirect Style:**  
    Readers *do* see private signals—but characters *don’t*. This creates **tragic irony**: *"Elara heard a laugh! Don’t join them!"* The model has no equivalent; its agents lack audience.

  - **Doubt as Signal vs. Expression:**  
    In the model, doubt is *evidential weight* (e.g., signal strength=0.6). In fiction, doubt is *moral texture* (e.g., *"His hand trembled—not fear, but the memory of his own unjust stoning"*). **Distortion:** Literary doubt enriches character; model "doubt" is a calibration.

  - **Ensemble as Protagonist:**  
    The crowd is the protagonist. Individual POVs are shifting lenses on a collective mind. The model supports this; standard narrative structures resist it.

  ---

  ### 3. What Fiction Cannot Say (And Vice Versa)
  - **The Unsayable in Fiction:**  
    - *Quantified Signal Reliability:* Characters can’t think, *"My signal has 70% precision."* You approximate via status/reputation.  
    - *Common Knowledge of Rationality:* No character says, *"We all know everyone is Bayesian."* You imply it through behavioral uniformity.  
    - **Does This Indict Fiction?** No. Fiction captures the *felt experience* the model disembodies. The gasp when the stone flies matters more than its probability.

  - **The Unsayable in the Model:**  
    - *The Sting of Conformity:* The model has no shame, no blood on hands.  
    - *History’s Weight:* A character’s past (e.g., trauma from mob violence) is noise, not data.  
    - **Does This Indict the Model?** Only if applied blindly. It explains *how* crowds err, not *why it hurts*.

  ---

  ### Testing Your Intuitions
  - **The Truth-Teller (Emperor’s New Clothes):**  
    Your intuition is **not sentimental—it’s a model violation.** In the base model:  
    - A lone dissenter is ignored (her action is discounted as error).  
    - To make her matter, **violate the assumptions**:  
      - *Unequal Reliability:* Make her a trusted figure (e.g., the town midwife).  
      - *Costly Signals:* Her "signal" isn’t speech—it’s *walking into the house unharmed*.  
      - *Misdirection:* The crowd believes she’s *inside* the house. Now her re-emergence ("Nothing happened!") is **new public information** that shatters the cascade.  

  - **Structural vs. Summed Cowardice:**  
    The model **vindicates you utterly.** Cowardice implies a choice to be brave. Here, conformity is epistemically rational—no bravery is possible. The cruelty is in the *architecture*:  
    - Agents 1-2: Act on weak signals (seeds of error).  
    - Agents 3-99: Enslaved by the growing past.  
    **The stone flies because the crowd is a machine, not a jury of souls.**

  ---

  ### A Faithful Scene Blueprint (Not Inert If Staged Right)
  **Setting:**  
  A town square at dusk. A manor house, windows dark.  

  **Beats:**  
  1. **Lena (Signal: "Shadows moving—intruders?" Reliability: Low/stablehand)**  
     - *Action:* Paces near the gate (ambiguous).  
     - *POV:* *"Shadows or dust? Dust, surely. But why pace? Let them see vigilance."*  

  2. **Dr. Aris (Signal: "A gasp—cardiac or crisis?" Reliability: High)**  
     - *Observes:* Lena’s pacing → reads as "certainty of threat."  
     - *Ignores own signal:* *"Lena knows violence; gasps can be masked."*  
     - *Action:* Kicks the gate.  

  3. **Tomas (Signal: "A child singing." Reliability: Medium)**  
     - *Sees:* "Pacing + gate-kick = consensus: danger."  
     - *Calculates:* *"Two saw proof; I heard a song. Songs distract from screams."*  
     - *Action:* Picks up a stone. **→ CASCADE LOCK**  

  4. **Elara (Signal: "Laughter—no pain." Reliability: High)**  
     - *Sees:* Pacing + kick + stone-ready.  
     - *Ignores laughter:* *"Three witnesses; laughter is hysteria."*  
     - *Action:* Lifts a stone. **→ INERT ACTION**  

  5. **The Midwife (Truth-Teller Variant: Enters house, emerges unharmed)**  
     - *Breaks cascade* by creating **new public information** (her survival).  
     - *Not by shouting*—by *redefining the visible*: *"She walked into the lion's den. And the lion… was a mouse?"*  

  **The Stone Throw:**  
  - No one "decides." Tomas’s arm tenses; Elara mirrors it; Lena throws to hide her doubt.  
  - **Dramatic Irony:** Readers saw every signal. They know the laughter was real.  

  **Why It Works:**  
  The horror is in the **silent collapse of uncertainty**. Each beat tightens the noose. The crowd’s motive isn’t malice—it’s the suffocation of individual judgment by the weight of the seen.  

  ### Final Note  
  Your obstacle isn’t cowardice; it’s **the tragedy of rationality**. The scene chills when characters are *reasonable, observant, and wrong*. Play the midwife’s survival as a deus ex machina that works because the model’s rules are broken—giving you both truth and consequence.
