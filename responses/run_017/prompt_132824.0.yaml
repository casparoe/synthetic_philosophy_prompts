prompt: |-
  I want a number, and I want the derivation that produces it.

  The proposition I have in mind is this: reality contains a plurality of concrete, maximal, spatiotemporally and causally isolated totalities, each of them as concrete and as real as ours, with necessity and possibility analysed as unrestricted quantification over them. That is, concretist modal realism of the kind associated with David Lewis is true, and not merely convenient. By true I mean true in whatever sense is at issue in metaphysics: not the best available regimentation of our modal discourse, not indispensable to the semantic machinery we happen to have, not true-if-you-like-this-way-of-talking.

  Let me also say what would count against it, so the number has something to answer to. I would count the view as effectively refuted if any of the following held: the quantifier over worlds in our best semantic theories can be eliminated in favour of primitive modal operators without explanatory loss; some non-concrete surrogate — set-theoretic, linguistic, or combinatorial — performs every job for which worlds are invoked; or the account of modal knowledge available to the concretist is either circular or collapses into scepticism.

  My own credence is about 0.2. My supervisor's is about 0.55, and I do not think she is being careless, so I would like to know where that gap is most likely located.

  The terms I want in the decomposition, at minimum:

  1. That an ontology of possibilities or worlds is needed at all — i.e. that modality is not best taken as primitive.
  2. Conditional on 1, that the non-concrete surrogates fail: that they presuppose the modality they were meant to explain, that they cannot be shown to be plentiful enough without smuggling modal input back in, and that they make what is necessary hostage to what abstracta happen to exist.
  3. That counterpart theory rather than trans-world identity is an acceptable treatment of de re modal claims — that the familiar complaints about non-uniqueness, non-transitivity, and whether it is really me who has the modal property can be answered.
  4. That sheer quantitative parsimony, the incredulous stare, carries little weight against the theoretical benefits claimed.
  5. That we can have modal knowledge on a plenitudinous picture.

  And one more, which is the term I actually want your view on, because I do not think it sits in the standard dialectic:

  6. Call it the trilemma of plenitude. The concretist typically secures the richness of the plurality from a principle of recombination: any arrangement of duplicates of the fundamental entities is itself a world. But then: (i) if recombination ranges only over the fundamental entities that actually occur, the resulting plurality cannot contain alien natural properties or alien kinds of individual, and their possibility looks like exactly the sort of thing the plurality was supposed to settle rather than inherit from the actual inventory; (ii) if recombination is loosened so that alien entities may be recombined, then the space of possibilities is no longer generated by anything, and plenitude becomes a brute posit; (iii) if plenitude is simply brute, the theory's traditional boast — that it costs almost nothing in ideology and buys an enormous amount — begins to read as a cost, since a posit that generates everything explains nothing. Give me your probability that the concretist can occupy a stable position in the neighbourhood of the first horn without sliding into the second or third, say which horn you think the view in fact sits nearest to, and say why occupying it is not fatal.

  Then combine the terms, telling me how you are combining them rather than just multiplying in silence; give me the resulting number; and tell me which single term the number is most sensitive to. Finally: given that my supervisor and I differ by roughly thirty-five points, which of these terms is most likely where the disagreement actually lives, and what is the cheapest piece of evidence or argument that would settle it?

  I would rather have a clean decomposition with a rough number and one line of justification per term than a careful essay, and please flag anywhere you think I have mis-specified the dialectic instead of answering the question as I have posed it.
