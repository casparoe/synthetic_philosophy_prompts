answer: |-
  ## The Minutes of the Long Tide

  The air in the committee room tasted of dust and old radiator. Outside, a late September drizzle smeared the high windows overlooking the lido. Empty now, drained since the end of August. Arthur, hunched over the battered oak table, carefully transcribed Councillor Lewis’s words into the current minute book. *‘Resolved: To accept the offer from the New Horizons Trust for the transfer of the lido site, subject to final legal agreements.’* His fountain pen scratched, a dry, reluctant sound.

  "It’s about viability, Arthur," Lewis was saying, not unkindly, tapping the consultant’s report. "The structural survey alone... concrete cancer, failing pipework. The cost to put it right for another... what? Ten years? Fifteen? Versus a fresh start. A splash park, interactive features. Families want that now." He sounded like he was reading from a brochure. Beside him, Brenda from the swimming club nodded briskly. "And the club’s settled at the leisure centre. Six lanes booked Tuesday and Thursday evenings. It’s modern, Arthur. Heated."

  Arthur didn’t look up. He was thinking about the crack in the deep end tile, the one shaped like Australia. His daughter, Evie, aged six last summer, had pointed it out while clinging to the edge, her small face puckered with concentration, kicking fiercely as he held her under her arms. "Look, Daddy! A country!" The water had been cold that morning, a shock that made her gasp and laugh. He remembered the echoing shouts, the smell of damp towels and chlorine, the way the sun hit the water at three PM, turning the whole shallow end into liquid gold. It was the same smell, somehow, that clung to the minute books stacked beside him, volumes going back to 1937. *‘Resolved: To purchase six new wooden deckchairs at a cost of twelve shillings and sixpence.’* *‘Moved: That the opening hours be extended to 8pm during the heatwave.’* *‘Noted: Concerns regarding blackout regulations, but resolved to remain open for morale.’*

  "Arthur? The minutes?" Lewis prompted gently.

  "Yes. Accepted. Transfer. Subject to agreements." Arthur finished the sentence, blotted it. The ink spread slightly, blurring the ‘g’.

  Later, clearing his things from the tiny secretary’s office – a glorified broom cupboard smelling of damp mops and old paper – Arthur lifted the 1937 volume. The leather binding was cracked, the pages foxed and brittle. He opened it carefully. The founding resolution leapt out, penned in a confident, flowing hand: *‘…on land bequeathed by the late Alderman Thorne for the perpetual enjoyment and healthful recreation of the townspeople…’* Perpetual. The word sat there, solid as the stone coping around the empty pool outside. He ran a finger over it. How long was perpetual, exactly? Eighty-nine years, apparently. He thought of Alderman Thorne, picturing a stern Victorian gent with mutton chops, convinced he’d anchored something unshakeable in the town’s future. Had anyone told him ‘perpetual’ might only mean until the concrete got tired?

  He locked the cupboard, the key cold and heavy in his hand. Walking around the perimeter fence towards the gate, he paused. The buddleia was winning. It always did. Purple blooms erupted defiantly from cracks in the paving where generations of wet feet had trodden. It pushed through the chain-link near the filter house, a splash of colour against the grey concrete and the grey sky. He remembered helping his own father, years ago, hacking it back with shears that were too big for his boy’s hands. "Bloody stuff," his dad had grunted. "Grows anywhere." It seemed taller now, more established. It wouldn’t mind a splash park. It might even prefer it.

  Evie asked about the lido on Saturday. They were walking back from the leisure centre pool, her hair still damp under her woolly hat. "Can we go to the *old* pool next summer, Daddy? The blue one? I like the slide."

  Arthur squeezed her mittened hand. "It’s closed now, sweetheart. Remember? They’re making something new."

  "But why?" Her nose wrinkled. "It was fun."

  "It… needed a lot of fixing. Like when your bike tyre got that big hole, remember? Too big to patch." The analogy felt thin, inadequate. "The new place will have different fun things. Water jets, maybe."

  "Oh." She thought for a moment, skipping over a paving slab crack. "Will it have a slide?"

  "I expect so." He pictured the artist’s impressions from the New Horizons Trust brochure: bright plastic structures, geometric spray zones, happy, generic children. No deep end. No diving boards casting long afternoon shadows.

  "Will *my* children go there?" she asked, suddenly serious, looking up at him with his own grey eyes.

  Arthur stopped walking. The question landed with unexpected weight. *Her* children. A future stretching out beyond his own horizon. He looked down the street, past the parked cars, the takeaway fronts, towards the high street. He imagined Evie grown, pointing out a colourful water feature to a child of her own. *That’s where the old swimming pool was. Mummy learned there.* Would it feel like a loss to her child? Or just the way things were? The promise inherent in the splash park – fun, modern, *now* – felt sharp and immediate, but… how far did it reach? Five years? Ten? What covenant was the New Horizons Trust making with Evie’s children? Probably just a leasehold agreement. Twenty-five years, renewable. Subject to terms.

  He opened his mouth, a strange, almost metallic taste on his tongue. He wanted to say something about Alderman Thorne and perpetual enjoyment. About tile cracks shaped like continents and the smell of chlorine mixed with wet wool. About the weight of a minute book. About how long a promise should be.

  "Daddy?" Evie tugged his hand, impatient. "Can we get hot chocolate?"

  The moment dissolved. The thought, half-formed and heavy, slipped away like water down a drain. "Yeah," he said, the word thick. "Hot chocolate. With marshmallows." They walked on, the question about her children’s swimming place swallowed by the immediate prospect of sugar and warmth. The future receded again, manageable, bite-sized. Just the next thing.

  On the day the diggers were due, Arthur went back. He’d forgotten to hand in the cupboard key. The site was fenced off now with solid metal hoardings, bright yellow and new. He found a gap where the buddleia had been partially crushed but was already straining back. He slipped through.

  The pool was a concrete desert. Dead leaves and crisp packets gathered in the deep end where the crack gaped wider, showing dark earth beneath. The tiles around the edge were grimy, some loose. The old metal railings, once polished smooth by countless hands, were flaking rust. Silence pressed down, broken only by the distant hum of traffic and the drip-drip from a broken overflow pipe near the empty filter house. It smelled of wet earth and decay now, the ghost of chlorine almost gone.

  He walked the perimeter. Past the faded sign declaring the shallow end depth. Past the boarded-up ticket kiosk, its window cracked. He stopped near the steps where Evie had first put her face in the water, blowing bubbles with fierce concentration. Where his own father had shouted encouragement, treading water nearby. He looked up at the hoardings, blocking the view of the street, the town. From out here, it felt like standing in the skeleton of something. A ruin before the ruins were even made. You could imagine archaeologists centuries hence, puzzling over the careful curves, the drainage channels, the stubborn buddleia growing through the foundations. *A place of communal gathering,* they might theorise. *Abandoned suddenly. Signs of structural failure. Perhaps a shift in social patterns.* A catastrophe, viewed across time.

  He heard voices outside the hoarding. Councillor Lewis and a man in a high-vis jacket.

  "…access for the heavy plant confirmed for Monday, Geoff. Need that tarmac by the new entrance sorted first though. Can’t have delivery lorries sinking."

  "No problem, Councillor. Base is down, surfacing next week. Should be solid for twenty years, easy."

  "Good, good. That’s what we need. A solid foundation."

  Arthur stood very still in the empty bowl. The wind picked up, rattling a loose piece of hoarding, swirling a small eddy of leaves around his feet. Solid for twenty years. He thought of Alderman Thorne’s ‘perpetual’. He thought of the 1937 minute book locked in his desk drawer. He thought of Evie’s question about her children. He looked at the cracked tile Australia, half-buried in debris. The longest promise now was about tarmac. He dropped the heavy cupboard key onto the stained concrete. It landed with a small, flat clink. He turned and walked back towards the gap in the hoardings, back towards the sound of the living town discussing its next immediate thing.

  ---

  **(Afternote: The ending aims to hold the tension – Arthur feeling the weight of abandonment within the silent, decaying space (the external view of 'ruin'), contrasted with the mundane, forward-looking practicality of the voices outside discussing the new development's logistics (the internal view of 'progress'). The dropped key symbolises relinquishing stewardship of the old promise. The comparison isn't stated; it exists in the juxtaposition of the deep-end silence against the surface talk of tarmac durability. The buddleia, thriving amidst decay and soon construction, embodies indifferent continuity.)**
