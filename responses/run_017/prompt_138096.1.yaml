prompt: |-
  I'm trying to work out what I actually think about higher-order evidence, going by gut on cases, and I'd like a principle that fits them rather than a tour of the literature.

  - I do a fiddly bit of mental arithmetic, get 47, then find out I'd been awake for 30 hours: yeah, downgrade, probably just suspend.
  - An expert I respect, who has seen the same working, says it's 49: downgrade somewhat, but not all the way, and I don't feel I should simply defer.
  - A thousand people online say it's 49: barely moves me, even though there are far more of them than one expert. I know that sits badly with the last one and I can't say why they differ.
  - A bloke who tells everybody they've had too much to drink tells me I've had too much to drink, and I counted my own drinks: does nothing, or next to nothing.
  - Maybe my reasoning is unreliable full stop: also does nothing. But that's odd, given case one moves me a lot, and the difference can't just be a matter of degree.
  - A study reports that people who learn they might be biased overcorrect, so that responding to it properly means partly discounting it. No idea what to do here. It feels like it should partly cancel itself, but I don't know what cancelling would even consist in.
  - I'd already sent the email with 47 in it before I found out about the all-nighter: I feel I should lower my confidence but not redo the action, which suggests confidence and action come apart in a way I can't state.
  - And in a couple of these I end up still believing the thing at full strength while thinking I shouldn't. Is that just straightforwardly irrational, or is there room for a sensible akratic believer?

  Is there one principle — something about when higher-order evidence defeats versus when it's just noise — that gets most of these, and which of my verdicts does it force me to drop? And what does it say about the one I keep going in circles on: I learn that everyone in my field, including the expert in case two, was trained to make exactly the mistake I just made, so there's nobody left to appeal to who isn't already inside the problem. That isn't global scepticism and it isn't one dodgy occasion either, and I definately can't tell whether it should behave like case one or like case five.
reasoning: |-
  Okay, let me start by trying to understand what the user is asking. They want a principle that explains how higher-order evidence (HOE) affects their beliefs and actions in various scenarios. They’ve listed several cases where HOE seems to impact them differently, and they’re struggling to find a consistent rule. The key here is to identify a unifying principle without getting lost in academic theories.

  First, I need to break down each case they mentioned. The mental arithmetic after being awake for 30 hours leads them to suspend judgment. An expert saying it's 49 causes a partial downgrade but not full deference. A thousand people online barely move them, which is odd because numbers would suggest more reliability. A drunk-shaming guy doesn’t affect their confidence about drink count. General unreliability doesn’t move them, which contrasts sharply with the first case. Then there’s a study about overcorrection, which creates confusion. Sending an email makes them lower confidence but not retract the action, showing a split between belief and action. Finally, they mention akrasia—believing something while thinking they shouldn’t.

  The user’s confusion seems to stem from inconsistent reactions to HOE. They can’t pinpoint why some evidence (like sleep deprivation) drastically affects them, while others (like general unreliability) don’t. The expert vs. crowd discrepancy is also puzzling. They need a principle that explains when HOE is defeating versus just noise. 

  Looking deeper, the user might be grappling with the reliability of the evidence source and its specificity. In the sleep deprivation case, the HOE directly challenges the specific belief-forming process at that moment. The expert’s opinion is somewhat reliable but not infallible, so partial downgrade. The crowd online isn’t seen as reliable due to potential biases or lack of expertise, hence minimal impact. The drunk-shaming guy isn’t credible, so ignored. General unreliability is too vague to apply, so dismissed. 

  The overcorrection study is tricky. If they apply it naively, they might overadjust. But the principle suggests discounting HOE that’s unreliable or vague, so the study’s advice might fall into that category, leading to minimal adjustment. 

  The email scenario shows that past actions can’t be changed, but future confidence should adjust. This separates belief from irreversible actions. Akrasia might be permissible temporarily while reassessing, but not ideal long-term. 

  The field-wide training flaw case is complex. Since everyone is affected, there’s no reliable external check. The principle would suggest significant downgrade because the HOE directly challenges the specific method used, similar to sleep deprivation. However, without any reliable source to turn to, the suspension of judgment becomes necessary. 

  The user’s deeper need might be a desire for epistemic consistency. They want to trust their intuitions but need a framework to resolve contradictions. They might also be seeking reassurance that it’s okay to have conflicting beliefs and actions temporarily. The principle of Specific, Reliable, Actionable HOE offers a practical heuristic, validating their intuitions while providing clarity on edge cases.
answer: |-
  Based on your intuitions across these diverse cases, a principle emerges that respects most of your verdicts: **Higher-order evidence (HOE) significantly defeats first-order belief only when it is *specific*, *reliable*, and *actionable* regarding a *particular* failure in your reasoning process for *this specific* belief.**

  Here's how it handles your cases, and where it might require slight adjustments:

  1.  **30 Hours Awake:** **Downgrade → Fits.** HOE is highly *specific* (current cognitive impairment), *reliable* (well-established link between sleep deprivation & errors), and *actionable* (suspend *this* belief formed under these conditions).
  2.  **Expert Says 49:** **Partial Downgrade → Fits.** HOE is *specific* (challenges *this* calculation), *reliable* (expert), and *actionable* (downgrade confidence in *this* result). But it's not proof of *your* specific error, hence partial downgrade, not full deference.
  3.  **1000 People Online Say 49:** **Barely Moves → Fits.** HOE lacks *reliable specificity* for *your reasoning*. Why do they say 49? Did they replicate your work? Are they competent? Crowd opinions on complex tasks without knowing *their* process are noisy. It fails the "reliable & specific about *your* process failure" test.
  4.  **"Drunk-Shamer" Bloke:** **No Effect → Fits.** HOE lacks *reliability*. His judgment is unreliable (he tells everyone) and contradicted by your *specific* evidence (drink count). Not credible evidence of *your* impairment.
  5.  **General Unreliability:** **No Effect → Fits (but clashes with your intuition about Case 1).** HOE lacks *specificity* and *actionability*. *How* are you unreliable *here*? *What* exactly should you do *differently* for *this belief*? Global unreliability claims are paralyzing and non-actionable for specific beliefs. **This is the key distinction from Case 1:** Sleep deprivation *is* a specific, identifiable impairment mechanism applicable *right now*.
  6.  **Overcorrection Study:** **Minimal Effect → Fits.** Applying this HOE naively *would* cause overcorrection. The principle suggests discounting HOE that isn't *reliable, specific, and actionable*. The study is vague (how much overcorrection? for whom? in this situation?). It's arguably unreliable *for guiding your specific response* to other HOE. Treat it as weak, noisy evidence requiring extreme caution, likely leading to minimal adjustment.
  7.  **Sent Email:** **Lower Confidence, Don't Retract → Fits.** *Actionability* is key. You *can* adjust your *future* confidence and reliance on similar reasoning (actionable). You *cannot* unsend the email (not actionable). This separates belief revision (ongoing process) from irreversible actions based on past evidence.
  8.  **Akrasia ("I believe P but shouldn't"):** **Permissible Temporarily → Fits.** When encountering strong, specific HOE, it can be epistemically sensible (not irrational) to *provisionally* hold the first-order belief with reduced confidence *while* actively reassessing. Full integration takes cognitive work. Persistent akrasia without reassessment *is* irrational.

  **The Principle Forced You to Drop One Verdict:** The stark difference between **Case 1 (Downgrade)** and **Case 5 (No Effect)** isn't *just* degree. It's about **specificity and actionability**. Case 1 provides a clear, specific mechanism impairing *this* reasoning *now*. Case 5 is vague and non-actionable. Your intuition that Case 5 "should" do *something* is natural, but the principle explains why it doesn't (and shouldn't) trigger significant downgrade *on its own*.

  **Your Sticking Point: The Field-Wide Training Flaw**

  *   **The Scenario:** You learn everyone in your field (including your trusted expert) was systematically trained to make the *exact mistake* you suspect you just made. No reliable external arbiter exists within the field.
  *   **Analysis via the Principle:**
      *   **Specificity:** High. It directly targets the *specific type of reasoning* used for *this specific belief*.
      *   **Reliability:** High. The source (study/revelation about training) revealing the flaw is presumably reliable evidence of a systemic error tendency.
      *   **Actionability:** Moderate-High. You *can* and *should* significantly downgrade confidence in conclusions reached via this flawed method. You *cannot* easily "fix" the flaw immediately or find a reliable internal authority.
  *   **Verdict:** **Significant Downgrade, Likely Suspension.** This HOE isn't vague (like general unreliability). It points to a *specific, identified flaw* in the reasoning process *you just used*. It acts like a powerful, field-wide version of **Case 1**. The lack of an uncontaminated expert doesn't negate the HOE; it *intensifies* it by removing an easy escape route. You must acknowledge the high chance your reasoning is flawed *on this specific point*, even if you can't immediately calculate the right answer. The actionability is suspending judgment on *this* conclusion formed by the flawed method and seeking radically different approaches or external perspectives if possible.

  **In short:** Your gut reactions point to HOE mattering most when it reliably and specifically tells you *how your particular reasoning for this particular belief went wrong*, giving you something concrete to do about it (downgrade/suspend *that* belief). Vague, unreliable, or non-actionable HOE gets discounted. The field-wide flaw is powerful because it reliably identifies the specific mistake in your specific reasoning process, forcing downgrade/suspension despite the lack of uncontaminated experts.
