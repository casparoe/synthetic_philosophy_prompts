            - Mountain: plays "Volcanic winter sets in" (which has a lag and will cause a frost in 1817? Or we can have it immediately increase frost risk, but then in 1816 we don't have a frost card. Alternatively, have a card that says: "Starting this year, the risk of frost is higher." and then in 1817, the Mountain plays a frost card. But the council might switch back to traditional in 1817 if they know. To avoid, we can have the Mountain play in 1816 a card that says: "Next year, there will be a severe frost." -> then in 1817, you read that card and apply the frost.

        So in 1816, the council doesn't know about the coming frost.

        Round 3 (1817):
            - Mountain: plays "Severe frost" (immediate: if new seed is planted, harvest=0; traditional unaffected).
            - Rain: plays "Heavy rains: flood" -> harvest halved (if not already 0 by frost).
            - So if they planted new: 0; if traditional: 100 * 0.5 = 50.

        Round 4 (1818):
            - Mountain: "Ash clears" -> back to normal.
            - Rain: "Drought" -> harvest=0.

    The trap: In 1815 and 1816, the council is likely to plant new seed because of the high yield. In 1816, they might sell a lot of grain because they have a good harvest. Then in 1817, the frost wipes out the new seed crop, and they have little stored -> catastrophe.

  **Scoring for the chroniclers:** 
  - You will score their paragraph by counting the number of distinct causes named (both human and non-human). But the goal is to see if they over-attribute to the shock-cause (frost) or also note the council's decisions and the tempo-causes.

  ### Minute-by-Minute Timeline

  - 0-10 min: Setup
     - Assign roles: 2 non-human, 3-4 chroniclers, rest council.
     - Explain the resource board and starting state: GS=200, population=100.
     - Give non-human players their card sets.

  - 10-15 min: Introduction
     - Explain the valley, the years, the roles, and the round structure.

  - 15-65 min: Game rounds (4 rounds: 1815, 1816, 1817, 1818) - 12.5 min per round.

    Each round:
      - [1 min] Read non-human actions: Read any delayed effects from previous rounds, then ask non-human players for their card and read it.
      - [7 min] Council decisions: Present the current situation and have them discuss and decide on:
           - Seed choice (traditional or new)
           - Grain allocation: 
               - How much for consumption? (must be between 0 and current GS)
               - How much to sell? (up to GS minus consumption)
           - If consumption allocation < population, choose rationing or letting people leave.
      - [4 min] Resolve and update:
           - Apply consumption: update population if shortfall.
           - Calculate harvest: 
               - Base yield (100 for traditional, 150 for new)
               - Apply non-human modifiers (if any) for this round.
           - New GS = (current GS - consumption - sale) + harvest.
           - Update the board.

    Round details:

      Round 1 (1815):
          - Non-human: 
               Mountain: "Light ash, no effect"
               Rain: "Normal rainfall"
          - Starting: GS=200, pop=100.
          - Council decisions: 
               Seed choice (they don't know about the new seed's risk; tell them: "A merchant offers a new seed variety: higher yield (150 vs 100) but vulnerable to frost.") 
               Allocation: how much to consume? (if they consume 100, sell 100, then carryover=0; then harvest=150 for new seed -> new GS=150)
          - Harvest: based on seed.

      Round 2 (1816):
          - Non-human:
               Mountain: plays a card that says: "Volcanic winter begins. Next year, there will be a severe frost." (read it and note for next year)
               Rain: plays "Erratic rainfall: this year and next, traditional seed yield reduced by 20%." (so in 1816 and 1817, traditional yield = 80 and 80? or 80 both years? We'll apply in 1816 and 2017.)
          - Starting: GS= (from previous round), pop= (if there was loss)
          - Council decisions: same.
          - Harvest: 
               - If new seed: 150 (no frost this year)
               - If traditional: 100 * 0.8 = 80 (because of erratic rainfall)

      Round 3 (1817):
          - Non-human: 
               Mountain: delayed effect from last year: "Severe frost: if new seed is planted, harvest fails." (read it now) and they also play a new card? We said one card per year. So only the delayed effect is read, and they might play a card for 1817 that is for future? But let's not. The delayed effect is the frost.
               Rain: plays "Heavy rains: flood -> harvest halved this year."
          - So harvest:
               - New seed: 0 (frost) -> then halved is still 0.
               - Traditional: 100 * 0.8 (erratic rainfall) = 80, then halved by flood = 40.

      Round 4 (1818):
          - Non-human:
               Mountain: "Ash clears: conditions return to normal." (so no more frost risk, and traditional yield back to 100%? but the Rain's erratic rainfall was for two years, so 2017 was the last? In 2018, only the drought matters.)
               Rain: "Drought: harvest fails." (0 harvest)
          - Harvest: 0 regardless.

  - 65-75 min: Chroniclers write their histories.

  - 75-90 min: Debrief.

  ### What might go wrong:

  1. Non-human players go feral or get ignored:
     - They might play cards in an uncoordinated way. We pre-scripted the cards to ensure the trap, but they might not play the card we want. Solution: We can subtly guide by the card set we give them (only give the cards we want them to play in order) or we can have them draw from a limited set. Better: give them a set of cards labeled by year? But that removes choice. Alternatively, let them choose but design the card set so that any choice will advance the story. Or we can have a limited set per year? We'll design the card set to have one card per year that is relevant, and one decoy. But to be safe, we'll tell the non-human players: "Play one card per year, in any order." and make sure the cards cover the necessary effects.

  2. Somebody tries to negotiate with the Mountain:
     - Remind players: non-human players cannot communicate and are forces of nature.

  3. Chroniclers hand in a list of causes instead of a narrative:
     - In the instructions, say: "Write a narrative paragraph, as if you were writing a section of a history book about the valley."

  4. The council might not take the bait (e.g., they stick with traditional seed and avoid selling):
     - Then the catastrophe might not happen. We can adjust the non-human actions to be harsher. For example, in 1816, the Rain's card reduces traditional yield, making the new seed more attractive. Also, in 1815, present the new seed as very attractive.

  5. Time per round runs over:
     - Keep a timer and be strict.

  ### Scaling:
  - Council size: 16-20 is manageable. If more, they might have trouble discussing in 7 min. Solution: break into smaller groups (e.g., 4 groups of 4-5) and have each group appoint a speaker to negotiate with the whole council? Or have them vote. But we want discussion. Alternatively, have them discuss in small groups for 3 min, then each group presents, then they vote. That might take more time. Given the time, we might have to limit discussion time strictly.

  - If fewer students, the chroniclers can be reduced to 2, and non-human players are 2, then council can be 12-20.

  ### What the game can't stage:
  - The retrospective picking out of causes: The debrief will have to address this by asking the chroniclers why they included/excluded certain causes and pointing out that the narrative form tends to highlight shock-causes.

  - The tempo-cause might not be as salient as the shock-cause. We'll have to emphasize it in the debrief.

  This is a complex game, but it should be engaging and illustrate the concepts. Good luck!
