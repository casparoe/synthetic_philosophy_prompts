  ### Catastrophe in the Valley: Simulation Game  
  **Core Objective:** Students experience how historical narratives prioritize sudden "shock-causes" (e.g., volcanic eruption) over gradual "tempo-causes" (e.g., changing climate patterns), often leading to environmental determinism.  

  ---

  ### **Setup & Roles**  
  **Materials:**  
  - 1 large poster board ("Resource Board") with tracks:  
    - *Grain Storage* (starting: 50 chips)  
    - *Seed Grain* (starting: 20 chips)  
    - *Population* (starting: 100; use tally marks)  
    - *Morale* (starting: 5; scale 0–10)  
  - Poker chips (grain), index cards (pre-written for non-human roles), envelopes (for delayed effects), pens.  
  - Role tags: 2x **Nature Forces**, 3x **Chroniclers**, 16–20x **Council Members**.  

  **Roles & Rules:**  
  1. **Nature Forces (The Mountain & The Rain):**  
     - Do not speak, gesture, or interact. Each round, secretly hand the GM (you) 1 index card. Cards have effects with **delayed triggers** (e.g., "Plant disease: –30% yield in 2 rounds").  
     - *Sample Cards:*  
       - Mountain: "Eruption: Ash blocks sun → –50% yield NEXT round."  
       - Rain: "Unseasonal rains: Floods destroy stored grain NEXT round."  
       - Rain (tempo-cause): "Drier seasons: –1 Morale/Round until morale=3."  

  2. **Council Members:**  
     - Decide valley policies each round (5 min/round). Policies:  
       - **Planting:** Traditional seed (frost-proof, low yield) or New seed (high yield, frost-vulnerable).  
       - **Storage/Sale:** Sell grain for +Morale (short-term gain) or store for future.  
       - **Crisis Response:** Ration (lose Population but keep Morale) or let people leave (lose Population faster, –Morale).  

  3. **Chroniclers (3–4 students):**  
     - Silently observe. Post-game, write a 3-sentence "Official Valley History" explaining causes of the famine.  
     - **Scoring:** +1 point per distinct cause named (human/non-human). *Trap:* Over-attributing to Nature Forces scores high but masks human choices.  

  ---

  ### **Game Timeline (90 Minutes)**  
  **0–10 min: Setup**  
  - Assign roles randomly (adjust for no-shows: if <22 students, reduce Council; if >22, add Chroniclers).  
  - Post Resource Board. Distribute Nature cards. Brief:  
    > *"You’re the council of a grain valley, 1815–1818. A distant volcano erupted in 1815. Your goal: Survive with minimal population loss. Nature Forces act via cards I read aloud. Chroniclers, watch for causes."*  

  **10–60 min: Game Rounds (5 Rounds × 10 min each)**  
  *Each Round = 1 Year (1815–1819).*  
  1. **GM Phase (1 min):**  
     - Read Nature cards (including delayed effects from envelopes). Update board (e.g., "1816: Ash from Mountain → –50% yield in 1817").  
     - Place delayed-effect cards in envelopes labeled with future rounds.  

  2. **Council Phase (5 min):**  
     - Council debates/approves policies (vote or consensus). GM enforces time.  
     - **Key Trap (Round 1–2):**  
       - *Temptation:* Offer high-yield New seed in 1815. If chosen, reward short-term: +30% yield.  
       - *Consequence:* In 1817, a frost (triggered by delayed Nature card) destroys New seed crops. Council blames Nature, ignoring their earlier choice.  

  3. **GM Resolution (4 min):**  
     - Apply policies:  
       - Sell grain: +Morale but risk shortages.  
       - Switch to New seed: High yield until frost hits.  
       - Ration/emigration: Adjust Population/Morale.  
     - Update Resource Board.  

  **60–70 min: Chronicle Phase**  
  - Chroniclers write histories (3 sentences max). Council debriefs openly (no blame game).  

  **70–90 min: Debrief**  
  1. **Share Chronicles (5 min):**  
     - Read histories aloud. Tally causes on board (e.g., "Mountain: 4 votes; Council choices: 1 vote").  

  2. **Reveal the Framework (10 min):**  
     - Introduce terms:  
       > *"Shock-causes: Sudden, dramatic events (ash cloud). Tempo-causes: Slow, background pressures (drought). Narratives love shocks—they fit 'X did Y.' Tempo-causes get ignored or inflated into determinism."*  
     - Map game events:  
       - *Shock:* Frost in 1817 (immediate, datable).  
       - *Tempo:* Gradual morale decline from dry seasons (subtle, no "moment").  
       - *Determinism trap:* Chronicles blamed the Mountain, not the Council’s switch to frost-vulnerable crops.  

  3. **Discuss (5 min):**  
     - *"Why did the narrative focus on the eruption, not seed choice? Can non-humans be ‘actors’ without implying they controlled everything?"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Nature Forces go "feral" or are ignored:**  
     - *Risk:* Players mock role or Council dismisses cards.  
     - *Fix:* GM strictly enforces rules ("Nature players, pass a card silently"). If ignored, amplify effects (e.g., "The Mountain’s ignored ash now cuts yield by 70%").  

  2. **Someone negotiates with the Mountain:**  
     - *Risk:* Council tries to "bargain" with Nature players.  
     - *Fix:* "Nature does not respond. Its actions are indifferent to you."  

  3. **Chroniclers list causes, not narratives:**  
     - *Risk:* They write: *"Causes: Volcano, bad seeds, rain."*  
     - *Fix:* Pre-empt: "Chroniclers, write a *story*—e.g., ‘The famine began when...’" Use a sample in setup.  

  4. **Council avoids the trap:**  
     - *Risk:* They stick to traditional seed, avoid selling grain.  
     - *Fix:* Incentivize risk: "New seed gives +5 Morale now" or "Selling grain buys seed for next round."  

  ---

  ### **What the Game Can’t Stage**  
  - **Retrospective Causation:** The game can’t show how *ending* shapes perception of causes (e.g., a choice only seems "foolish" after frost). Address this in debrief:  
    > *"In history, we know the ending first. The Council’s seed choice seemed smart in 1815—it only became a ‘cause’ of disaster after the frost. Narratives amplify events that ‘explain’ the outcome."*  

  - **Tempo-Causes’ Invisibility:** Players may still miss subtle tempo-causes (e.g., morale decline). Mitigate by having GM explicitly note them during rounds (e.g., "Morale drops—drier seasons are adding up").  

  ---

  ### **Scaling Notes**  
  - **16–26 Players:**  
    - Council >20? Split into 2 groups (e.g., "North/South Valley"), each with a Resource Board.  
    - Chroniclers >4? Have them co-write in pairs.  
    - Nature roles fixed at 2 (add Chroniclers if needed).  
  - **Key Scalable Elements:**  
    - Council discussion (groups of 8–12 work; larger groups need sub-voting).  
    - Resource tracking (use chips for small groups; tallies for large).  

  **Outcome:** Students leave seeing that history’s "grammar" favors volcanic eruptions over eroded resilience—and how easily choice collapses into determinism.
