prompt: |-
  Hi — you're a professional philosopher who also reads a lot of literary fiction. Please think carefully, and before you answer, brainstorm two or three different ways of setting up the mapping, then commit to the one you think is most faithful (and say briefly why you dropped the others).

  I write novels — literary-ish, a few published, nothing fancy — and I've got into an argument with a friend who does moral philosphy about what makes consent valid. I want it in my vocabulary, not hers. Here's what I've actually got to work with: options-on-the-page (how many real alternatives a character has when they say yes, and how blocked each one is); the load-bearing lie (a lie is load-bearing if you can't delete it from the scene without the yes flipping); dramatic irony (the reader knows what the character doesn't); motivated action versus free action; the unreliable narrator; and the trusted-yes test — whether a character's desire survives being shown to the reader rather than merely reported.

  So: translate the philosophical debate about valid consent — deception, threats versus offers, competence and capacity — into those terms as honestly as you can, without smuggling my assumptions in and calling it translation. Then the residue report: what maps cleanly onto craft, what fits only if you bend it, and what has no expression at all in how I think about character and scene. And give me a verdict on whose problem the residue is: is my toolkit missing something real — definately tell me if it is, e.g. the gap between a yes that authorises and a yes that just makes what happens acceptable — or is the philosophy more muddled than my friend lets on? Finally, say what would change your mind: which argument would flip you to the other verdict, and where your reasoning is most likely to break. British English, and keep it under 700 words.
reasoning: |-
  Hmm, the user is a novelist who writes literary fiction, and they're having an argument with a friend who does moral philosophy about what makes consent valid. They want to frame this philosophical concept in their own literary toolkit rather than using philosophical terminology. They've provided several elements of their craft: options-on-the-page, load-bearing lies, dramatic irony, motivated vs free action, unreliable narrators, and the trusted-yes test. They want me to translate the philosophical debate about valid consent (deception, threats vs offers, competence and capacity) into these literary terms.

  I need to brainstorm two or three different ways to set up this mapping. First approach could focus on mapping each philosophical concept directly to a craft element - deception to load-bearing lies, threats to blocked options, competence to unreliable narrators. But this might oversimplify and miss nuances. Second approach could treat the entire consent scene as a system where all craft elements interact to create validity or invalidity. This might be more holistic but could lose precision. Third approach might prioritize the reader's judgment through dramatic irony and the trusted-yes test, making validity about craft techniques that reveal truth to readers. I think the system approach is best because consent in literature emerges from the interplay of multiple craft elements, not isolated mappings. This reflects how authors build reader perception of validity through layered techniques.

  For the translation, deception maps well to load-bearing lies - if removing a lie flips the "yes," the consent is built on falsehood. Threats versus offers connect to options-on-the-page - threats narrow options through blocked paths, while offers expand them. Competence and capacity translate to unreliable narrators and motivated vs free action - an unreliable narrator might hide incapacity, and actions driven purely by motivation without freedom suggest impaired consent. The trusted-yes test acts as the litmus test for validity - if desire survives being shown to readers, consent feels authentic.

  The residue report shows what doesn't map cleanly. Deception and threats map well, but competence/capacity is trickier - unreliability might not cover all incapacity cases, like clinical conditions. Motivated vs free action is a good proxy but not exhaustive. The core residue is the distinction between normative validity (what authorizes action) and descriptive validity (what makes it acceptable) - philosophy cares about the former, literature the latter. This residue is philosophy's problem because literature focuses on human experience rather than abstract principles. My toolkit might miss how consent interacts with social structures, but that's a limitation of scope, not craft.

  My verdict is that the residue stems from differing objectives - philosophy seeks universal rules, while literature explores subjective realities. The toolkit isn't missing much; it's robust for its purpose. To flip my verdict, I'd need evidence that craft elements can't capture key validity aspects without smuggling in philosophy, or that literature inherently distorts consent's moral core.

  Finally, I need to use British English, stay under 700 words, and ensure I'm not smuggling in assumptions. I'll structure the response with the mapping, residue report, and verdict, keeping it concise and faithful to the user's toolkit.
answer: |-
  Right. Let's translate this philosopher's stone into novelist's tools. After considering direct 1:1 mappings (too reductive), a compartmentalised approach (ignores synergy), and a reader-judgement focus (privileges outcome over mechanism), I'm committing to **the systemic interplay model**. Why? Consent validity in narrative emerges from the *dynamic interaction* of your craft elements within the scene's architecture, mirroring how philosophy examines the *conditions* surrounding the "yes". The others failed by isolating elements or prioritising reader reaction over the constructed mechanics of the character's choice.

  **The Translation:**

  1.  **Deception:** Maps cleanly to **Load-Bearing Lie (LBL)**.
      *   *How:* The LBL is the specific falsehood propping up the "yes". Remove it narratively (e.g., show the character the truth beforehand), and the consent collapses. Its presence directly invalidates the consent *for the reader* by exposing the foundational deceit. Dramatic irony often highlights this (reader knows the lie, character doesn't).

  2.  **Threats vs. Offers:** Maps primarily to **Options-on-the-Page (OotP)** and secondarily to **Motivated Action vs. Free Action**.
      *   *How:* Assess the *quality* and *availability* of alternatives.
          *   **Threat:** Options are severely **blocked** or made catastrophically undesirable. Saying "no" leads to a vividly presented, concrete negative consequence (e.g., job loss, violence, abandonment). The character's "yes" is heavily **motivated** by fear/avoidance. The "free action" component is minimal or absent.
          *   **Offer:** Alternatives exist and are reasonably accessible. Saying "yes" opens a positive or neutral possibility, saying "no" maintains the status quo or a less desirable but *safe* state. The "yes" can involve motivation (desire for the offered benefit) but retains a significant component of **free action** – the character could walk away without disproportionate harm.

  3.  **Competence & Capacity:** Maps to **Unreliable Narrator (UN)** (internal state) and **Motivated Action vs. Free Action** (external manifestation).
      *   *How:* Competence/capacity concerns the character's ability to understand and weigh the choice.
          *   **UN:** If the narration (especially 1st person or close 3rd) obscures, distorts, or fails to convey the character's genuine confusion, intoxication, mental state, or lack of understanding regarding the situation/choice, it signals compromised capacity. The reader sees the unreliability where the character (or other characters) might not.
          *   **Motivated vs. Free:** Actions driven *purely* by overwhelming, unexamined impulse, compulsion, or delusion (highly **motivated** with minimal **free** deliberation/choice) indicate compromised capacity. The narrative shows the lack of genuine consideration of OotP.

  4.  **The Litmus Test:** **Trusted-Yes Test (TYT)**.
      *   *How:* This isn't the mechanism but the ultimate narrative *validation*. Can the character's desire/choice withstand being **shown** through action, internal thought (if accessible), sensory detail, and consequence, rather than just being **reported**? Does the *reader* believe the "yes" is grounded in the character's authentic (even if flawed) understanding and volition, given the interplay of OotP, absence of LBLs, and presentation of capacity? A "yes" failing the TYT feels hollow, coerced, or false *to the reader*, signalling invalid consent within the story world.

  **The Residue Report:**

  *   **Mapping Cleanly:** Deception (via LBL), the core distinction between threats (blocked OotP, fear-motivated) and offers (accessible OotP, desire/free-motivated), and the reader's perception of authenticity (TYT) map exceptionally well. Dramatic irony powerfully supports exposing deception and blocked options.
  *   **Mapping with a Bend:**
      *   **Competence/Capacity:** While UN and Motivated/Free Action are strong *proxies*, they don't perfectly capture clinical or legal standards of incapacity (e.g., severe psychosis, profound intellectual disability). Your toolkit focuses on *narrative perception* of impairment. You can *show* symptoms, but the precise philosophical threshold is blurrier here. You're depicting the *effect* on choice, not diagnosing the cause.
      *   **"Voluntariness" Nuance:** Philosophy might split hairs on subtler pressures (social, economic) that aren't explicit threats. Your OotP can *show* these pressures (e.g., showing a character's financial desperation narrowing perceived options), but labelling it a "threat" versus "heavy offer" relies on reader interpretation via the TYT.
  *   **No Direct Expression:**
      *   **Normative "Authorisation" vs. Descriptive "Acceptability":** This is the core residue. Philosophy often seeks a *normative* standard: *does this consent morally authorise the action?* Your toolkit provides a *descriptive* account: *do these narrative mechanics make the consent feel authentic, coerced, or false to the reader, and thus shape the reader's judgment of its acceptability within the story?* Your tools answer "Does the reader *believe* it was valid (or not)?" not "Was it *objectively* valid according to principle X?"
      *   **Abstract Thresholds:** Philosophy loves precise thresholds (e.g., "How intoxicated is *too* intoxicated?"). Your toolkit deals in narrative *impression* shown through behaviour and context (UN, Motivated/Free action).

  **Verdict & Whose Problem?**

  The residue is **primarily philosophy's problem within your domain**. Your toolkit powerfully captures the *lived experience and reader perception* of consent validity through the mechanisms of choice presentation. The gap between normative authorisation and descriptive acceptability isn't a flaw in your craft; it's the difference between *establishing a universal rule* and *exploring a human experience*. Your tools are missing a direct line to abstract moral axioms, but that's not their job. They excel at showing *why* a "yes" feels trustworthy or rotten.

  **However...** your toolkit *might* subtly underplay how systemic power imbalances (beyond immediate threats) constrain OotP *by default*. If you only show immediate, dramatic blocks (a gun to the head) but fail to show the subtler, pervasive blocks of poverty, systemic oppression, or ingrained dependence shaping a character's entire field of perceived options *before* the specific choice, you risk missing a layer of invalidity philosophy highlights. This is less a missing tool and more a challenge of *scope and emphasis* in deploying OotP and context.

  **What Would Flip Me?**

  1.  **Evidence of Systematic Blindness:** If you (or other authors using similar tools) consistently crafted consent scenes readers found deeply convincing and "trusted" (passing TYT) using your tools, but which clearly violated a robust, non-muddled philosophical standard of validity (e.g., consent obtained through profound, non-obvious manipulation the reader *also* misses), I'd concede your tools can inadvertently validate the invalid. (This is hard, as the TYT failing is usually the signal).
  2.  **Philosophy Unmuddling:** If your friend compellingly demonstrated that a key philosophical distinction (e.g., threat vs. offer in non-binary cases, a clear capacity threshold) *fundamentally alters the reader's moral experience of the scene* in a way your current interplay model *cannot* depict without smuggling in philosophical concepts, I'd revise. The weakness is assuming "reader perception" (TYT) always aligns perfectly with "normative validity." It usually does in good fiction, but perhaps not inevitably.

  **In essence:** Your vocabulary is remarkably equipped to dissect consent dramatically. The philosophy provides useful categories, but the residue stems from its quest for universal adjudication, not a lack in your craft. Focus on the truth of the choice *as shown*, and the TYT will guide you – and your readers – rightly.
