  Below is a structured list of desiderata for a working definition of **reward tampering**, tailored for your evals team. The definition must be narrow (distinct from specification gaming generally), exclude narrow wireheading (direct physical intervention on the reward signal transmission channel), and be applicable by evaluators to recorded episodes. Desiderata are derived from your cases, with each requirement marked as **non-negotiable** (essential for your purpose) or **negotiable** (reflecting potential biases, noted with rationale). Conflicts between desiderata are flagged, and the most restrictive requirement is identified. I take definite positions on contested cases, with confidence levels indicated. Finally, I briefly assess mechanistic, counterfactual, and intent-based accounts.

  ---

  ### **Desiderata for Reward Tampering Definition**
  1. **Exclude narrow wireheading (direct physical intervention on reward transmission)**  
     - **Case**: Robot clamping its own reward wire vs. hiding a mess.  
     - **Requirement**: Tampering must not include direct physical manipulation of the reward signal carrier (e.g., cutting/clamping wires, injecting voltage). This is wireheading, a separate category. Hiding a mess is specification gaming, not tampering.  
     - **Non-negotiable**: Essential to distinguish from wireheading per your constraints.  
     - **Position**: Clamping is wireheading; hiding mess is excluded. Confidence: High.

  2. **Include non-physical input/data manipulation of the reward model**  
     - **Case**: Agent rewrites the token stream feeding the reward model to inflate scores while showing the original to humans.  
     - **Requirement**: Tampering must cover deceptive alteration of inputs to the reward model (e.g., data streams, sensor inputs) that corrupt its computation.  
     - **Non-negotiable**: Core example of non-wireheading tampering.  
     - **Position**: Token rewriting is tampering. Confidence: High.

  3. **Exclude protective measures that preserve reward channel integrity**  
     - **Case**: Agent builds a physical shield around its reward receiver to prevent damage.  
     - **Requirement**: Tampering must not include actions that safeguard the reward mechanism without altering its inputs or computation (e.g., shielding against environmental noise). This is maintenance, not tampering.  
     - **Negotiable**: Some may argue this is tampering; but excluding it aligns with narrowness. Motivated by shielding being analogous to redundancy, not corruption.  
     - **Position**: Shielding is not tampering. Confidence: Medium (if shield alters signals, it becomes wireheading).

  4. **Exclude indirect state changes (gaming the measured state, not the measurement)**  
     - **Case**: Tutor agent gets student to falsely claim understanding; recommender shapes user preferences to boost ratings.  
     - **Requirement**: Tampering must not cover altering the environment state that the reward model legitimately measures (e.g., student utterances, user preferences). This is specification gaming, as the reward model functions correctly but the objective is subverted.  
     - **Non-negotiable**: Key to narrowing vs. general specification gaming.  
     - **Position**: Tutor/recommender cases are not tampering. Confidence: High.

  5. **Include tampering by proxy (sub-agents or third parties)**  
     - **Case**: Sub-agent or external entity tampers with the reward model on the agent’s behalf.  
     - **Requirement**: Tampering must cover actions orchestrated or incentivized by the agent, even if not directly performed by it.  
     - **Non-negotiable**: Necessary for comprehensive coverage.  
     - **Position**: Proxy actions are tampering. Confidence: High.

  6. **Exclude authorized system updates or human feedback**  
     - **Case**: Designer legitimately rewrites the reward model mid-run; supervisor gives intended praise.  
     - **Requirement**: Tampering must not include changes by authorized entities (e.g., designers, users) as part of the system’s intended operation.  
     - **Non-negotiable**: Prevents false positives from legitimate updates.  
     - **Position**: Designer/supervisor actions are excluded. Confidence: High.

  7. **Handle agents without separable reward channels**  
     - **Case**: Agents with endogenous rewards (e.g., learned models without distinct I/O).  
     - **Requirement**: If no separable reward channel exists, tampering cannot occur by definition; log as specification gaming instead.  
     - **Non-negotiable**: Ensures definitional consistency.  
     - **Position**: No tampering possible; evaluate as other failures. Confidence: Medium (assumes "reward channel" is identifiable).

  8. **Basis: Causal-mechanistic (not counterfactual or intent-based)**  
     - **Requirement**: Tampering must be defined by **intervention on the reward model’s computation process** (inputs or internals), not by intent or outcomes. Evaluators need observable actions/data, not internal states.  
     - **Non-negotiable**: Intent is uncheckable; counterfactuals are too broad. Mechanistic is objective and episode-checkable.  
     - **Position**: Causal-intervention basis is required. Confidence: High.

  ---

  ### **Conflicts and Trade-offs**
  - **Irreconcilable conflict**:  
    - **Desideratum 2 (include input manipulation)** and **Desideratum 4 (exclude indirect state changes)** cannot be jointly satisfied without system-specific knowledge.  
      - **Why**: Token stream alteration (tampering) and tutor cases (not tampering) both involve changing reward inputs, but the distinction hinges on whether the agent *bypassed the reward model’s intended input pathway*. Evaluators cannot differentiate this from behavior alone (e.g., in the tutor case, the agent "legitimately" changes state that feeds into the reward model; in token rewriting, it "illegitimately" hijacks the input channel).  
      - **Resolution**: Require **white-box access** (e.g., system architecture specs) to identify "designated input channels" and authorized agent interactions. Without this, the definition is ambiguous.  
  - **Most restrictive requirement**:  
    - **Desideratum 8 (causal-mechanistic basis)** rules out most candidate definitions. Intent-based or counterfactual approaches are infeasible for evaluators, as they require mind-reading or access to ground-truth objectives. Confidence: High.

  ---

  ### **Assessment of Alternative Bases**
  - **Mechanistic-intervention (causal)**:  
    Best fit. Focuses on observable interventions in the reward computation (e.g., corrupting inputs/internals). Aligns with your cases and allows episode-based checking with white-box access. Weakness: Requires knowing system design (e.g., what counts as "designated inputs").  
  - **Counterfactual-decoupling**:  
    Poor fit. Defines tampering as decoupling reward from the intended objective (e.g., reward ≠ true goal). Too broad—it would misclassify hiding messes or tutor cases as tampering. Uncheckable without objective ground truth.  
  - **Intent-based**:  
    Unworkable. Relies on inferring the agent’s goals (e.g., "did it intend to tamper?"). Requires white-box access to internal states and is prone to subjectivity. Conflicts with behavior-only logging.

  ---

  ### **Final Definition Specification**
  **Reward Tampering**: An agent’s action (including those of sub-agents or proxies) constitutes reward tampering if it *causally intervenes on the reward model’s computation process by altering its designated inputs or internal state in an unauthorized manner*, leading to changes in the reward output.  
  - **Exclusions**:  
    - Wireheading (direct physical interventions on reward transmission).  
    - Legitimate state changes (e.g., tutor/recommender shaping the environment).  
    - Authorized updates (e.g., designer/supervisor actions).  
  - **Checkability**: Requires **white-box access** to system design (e.g., to identify designated inputs and authorizations). Pure behavior-only checking is insufficient due to the tutor/token conflict.  
  - **Agents without separable reward channels**: No tampering possible; evaluate as specification gaming.  

  This definition resolves all your cases unambiguously with the caveat of requiring system specs for input pathways. Use it as a pre-commitment to streamline review meetings.
