  At any step that leads to resolution (steps 2, 3, 4, 6 for hierarchical resolution), we update the rule base and close the issue. Otherwise, we end with a "both in force" tag, named owner, and review date.

  **Containment Test** (to prevent explosion and invalidating downstream rules):
  - We need to isolate the inconsistency so that it does not affect unrelated rules.
  - Proposed method: For a conflict between R1 and R2, we define the dependency set D as the set of rules that directly or indirectly depend on R1 or R2 (or both). Then, we check the relevance of the conflict to each downstream rule R_d in D by asking: "If we withdraw R1 (or R2), would the conflict with R_d disappear?" 
