          - For any rule that has P in its condition, we note that if the condition is met, then the rule might fire but the condition P is conflicted, so we mark the rule's output as "requires manual review due to conflict in condition: P".
          - For rules that have P as their conclusion, they are the ones directly in conflict, so they get the "both in force" tag and the conflict is noted.
          - This way, the conflict is contained to rules that mention P. Rules that do not mention P are unaffected.

  **Expiry of "both" tag**:
  - The user proposes a 30-day expiry for every "both" tag. 
  - Argument: This prevents the base from accumulating gluts forever. However, it assumes that all inconsistencies are temporary and resolvable. But some conflicts (like value conflicts) may be persistent. 
