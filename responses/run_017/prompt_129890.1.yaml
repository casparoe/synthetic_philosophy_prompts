  1. **Start**: Reported inconsistency between two rules R1 and R2.
  2. **Check for hidden parameters or contexts**: Can the conflict be resolved by adding a parameter (e.g., time, subgroup)? If yes, resolve and stop.
  3. **Check for ambiguity**: Can vague predicates be disambiguated to resolve? If yes, resolve and stop.
