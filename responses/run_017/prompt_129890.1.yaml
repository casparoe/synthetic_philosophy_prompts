  **Status Tags Glossary** (for new hires):
  1. **Active**: Rule is in force and uncontested. Use as normal. (Do not change without going through change control.)
  2. **Inactive**: Rule is retired and not used. (Do not use in checks.)
  3. **Superseded**: Replaced by a newer rule. (Use the newer rule instead.)
  4. **Under Review**: Rule is being revised; use with caution and check for updates. (Do not change without assignment.)
