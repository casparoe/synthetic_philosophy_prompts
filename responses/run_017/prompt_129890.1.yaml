  We are designing a triage procedure for inconsistencies in the clinical rule base. The procedure must be grounded in the literature on paraconsistent logic and related concepts, and must address the specific concerns raised.

  Key concepts from the literature:
  1. **Explosion (Principle of Ex Falso Quodlibet)**: In classical logic, a single contradiction implies everything. This is disastrous for a rule base because one inconsistency would invalidate the entire system. We must avoid explosion so that one contradiction does not render the whole rule base unusable.
  2. **Glut vs. Gap**: 
     - A **glut** is an overdetermined case: both A and not-A are true (or asserted). 
     - A **gap** is an underdetermined case: neither A nor not-A is true (or asserted). 
     In our context, we are concerned with gluts (contradictions) but note that gaps (lack of rule) might also be problematic but are not the focus here.
  3. **Rationality and holding contradictions**: In the face of conflicting authorities or values, it may be rational to hold both positions temporarily while seeking a resolution, without abandoning the entire system.
  4. **Paraconsistent logic**: This is a logic that tolerates contradictions without explosion. It does not require that every contradiction is true, but that the system can function in the presence of contradictions. It is a tool for managing inconsistency, not an endorsement of true contradictions.

  The triage procedure will be a flowchart in words. Steps:

  1. **Reported Inconsistency**: We start with two rules, R1 and R2, that are reported as conflicting (they cannot both be satisfied in some scenario).

  2. **Check for Hidden Parameters or Contexts**:
     - Question: Can the conflict be resolved by making explicit a hidden parameter (e.g., time, patient subgroup, clinical context) that distinguishes the cases?
