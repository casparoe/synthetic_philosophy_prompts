prompt: |-
  My friend and I spent most of last night arguing about the woodlot our village shares for firewood, and I need a word for the thing I was trying and failing to describe. Everyone there is pretty conservative about how much they cut — nobody wants to be the person who wrecked it, and for years the unwritten rule held fine. But last winter somebody started a rumour that the parish was going to sell the land, and within a few weeks people who'd taken two loads a year for decades were out at dawn carrying off everything they could, and the lot got stripped. Nothing about the wood changed; what changed is that people started expecting everyone else to grab. Same shape at my office: the shared coffee and milk are fine for months, then someone forwards an email about budget cuts and the kitchen is cleaned out by Wednesday, even though the email was about something else and the budget never got cut.

  My friend says that's just the tragedy of the commons and that I'm overcomplicating it. I keep saying no: in the version I learned, each person quietly takes a bit more than their share, the resource declines bit by bit, and it doesn't much matter what anyone believes anyone else will do. Here nobody overcuts as a first choice. They do it because they think the others are about to, and the rush is what produces the shortage they were braced for — so the expectation looks like it's doing the damage rather than the taking. It feels closer to a bank run than to a commons, except there's no bank and nothing is being withdrawn from a fixed pool; the wood is still growing.

  So: is there an established concept for this failure mode — restraint is stable until a belief about other people's restraint breaks, and the breakdown brings about exactly what everyone feared? Is the nearest thing really the ordinary tragedy of the commons, or is it some kind of coordination or assurance problem, or something from the bank-run / self-fulfilling-prophecy side, and how would you tell which of those it actually is here? If there's no name for it, coin one and define it carefully enough that I can see its edges: does it still count when the belief is true, and does it count when the resource is one that gets better with light use — footpaths, a shared wiki — so that what the rush destroys isn't just a stock but a thing those same people were maintaining? I definately don't just want a label, I want the carving.
reasoning: |-
  Okay, the user is describing a scenario where a shared resource is sustainably managed until a rumor or fear causes everyone to rush to exploit it, leading to a sudden collapse. They're arguing with their friend about whether this is the tragedy of the commons or something else. 

  First, I need to unpack their core observation: it's not gradual overuse driven by individual greed, but a panic triggered by anticipated defection. The fear that others will grab everything causes preemptive grabbing, which then validates the fear. That's crucial.

  The user's frustration with "tragedy of the commons" makes sense—Hardin's model assumes constant self-interest, not a coordination breakdown. This feels more like prisoners' dilemma meets information cascade. Interesting how they compared it to bank runs; that's astute because both involve self-fulfilling prophecies based on expectations.

  Hmm, they also hint at a nuance: the resource isn't just depleted but potentially degraded in ways that require collective maintenance (like footpaths). That adds a layer—the panic destroys not just quantity but the cooperative infrastructure itself. 

  Their request for "carving" suggests they want precise conceptual boundaries. Key questions they raise: Does it matter if the fear was justified? What if the resource improves with use? I should address those in the definition. 

  "Coordination panic" seems fitting—it emphasizes the sudden shift from stability to chaos driven by mutual uncertainty. Need to distinguish it from pure assurance problems (where communication solves it) since here the rumor acts like a shock. 

  ...Also noting their office coffee example mirrors the woodlot perfectly. This pattern clearly resonates with them. Their irritation at "overcomplicating" suggests they feel the standard model is inadequate—rightly so. The psychological dimension (trust collapse) matters here more than pure resource economics. 

  For the definition, I'll stress the three-phase structure: equilibrium → expectation shift → panic. Must clarify that even false rumors trigger it, and that maintainable resources are especially vulnerable because the panic attacks the very mechanism that sustains them. 

  Final thought: They're subtly asking how to prevent this. Prevention hinges on managing expectations—so emphasizing that in the "edges" part (e.g., credible reassurance might stop the cascade). That's practical value beyond terminology.
answer: |-
  What you're describing is **not the classic Tragedy of the Commons** – your instinct is correct. While both involve the depletion of a shared resource, the *mechanism* is fundamentally different. Your scenario hinges on a sudden shift in *beliefs about others' behaviour*, triggering a self-fulfilling panic that destroys the stable equilibrium. The closest established concept is an **Assurance Problem**, but it requires a specific twist.

  Here's the carving you need:

  1.  **Core Concept:** **Coordination Panic (or Assurance Panic)**
      *   **Definition:** A sudden, self-fulfilling collapse of cooperative restraint in managing a common-pool resource, triggered by a widespread *belief* that others are about to defect from cooperation, leading individuals to defect preemptively, thereby causing the very depletion they feared.

  2.  **Key Components & How it Differs:**
      *   **Stable Cooperation:** Initial state with norms/mutual restraint (2 loads/year, shared coffee).
      *   **Trigger:** An external signal or rumor (sale rumor, budget cut email) that *credibly suggests* others will abandon restraint (even if the signal is false/misinterpreted). This shatters the *assurance* that cooperation is reciprocated.
      *   **Mechanism: Preemptive Defection Driven by Fear:** Individuals don't defect because they suddenly want more; they defect because they *believe* others will defect. It's strategic pessimism: "If I don't take it now, someone else will, and I'll get nothing." This is distinct from the Tragedy of the Commons' gradual, self-interested overuse *without* needing a belief shift about others.
      *   **Self-Fulfilling Prophecy:** The widespread belief *causes* the mass defection, which *causes* the resource depletion, *validating* the initial (often false) belief. This is the heart of it.
      *   **Speed:** Collapse is rapid ("within weeks," "by Wednesday"), not gradual.
      *   **Bank Run Parallel:** This is *exactly* the right analogy. In a bank run, depositors withdraw not because they suddenly need cash, but because they fear *others* will withdraw, causing the bank to fail. Your woodlot/coffee is the "bank." The "fixed pool" aspect is less critical than the *expectational dynamic*.

  3.  **Why "Assurance Problem" Fits (with the Panic Twist):**
      *   An Assurance Problem arises when individuals *prefer* to cooperate *only if* they are confident others will too. Cooperation is the preferred outcome, but defection is the safe choice if others defect.
      *   Your scenario is an Assurance Problem where the trigger *destroys that confidence* (assurance). The stable cooperative equilibrium exists *only as long as everyone is assured others will cooperate*. The rumor shatters that assurance.
      *   The "Panic" element emphasizes the sudden, cascading nature driven by fear and the self-fulfilling outcome.

  4.  **The Edges (Answering Your Specifics):**
      *   **Does it count if the belief is TRUE?** **Yes.** If the rumor about the sale/budget cut was *true*, and people correctly anticipated others would grab, the panic still occurs via the same mechanism (preemptive grabbing driven by fear of others grabbing). The outcome is still self-fulfilling in the sense that the *speed and severity* of depletion are caused by the panic, even if depletion was ultimately inevitable. The panic *accelerates* and *worsens* the outcome.
      *   **Does it count for resources that improve with use (e.g., footpaths, wikis)?** **Yes, critically.** This is a vital extension.
          *   **Mechanism:** The panic destroys not just the *stock* but the *maintenance dynamic*. People rush to "take" (e.g., dump huge edits on the wiki fearing chaos, abandon path maintenance rules) or abandon upkeep, degrading the resource's quality or structure *precisely because* they fear others will do the same.
          *   **Outcome:** The resource deteriorates rapidly due to the loss of cooperative maintenance and/or chaotic overuse, fulfilling the fear that it was about to be ruined. The panic attacks the *process* that sustains the resource.
      *   **How is it different from pure Prisoner's Dilemma?** In a one-shot PD, defection is the dominant strategy regardless of belief. Here, cooperation *is* stable until beliefs change. It's a *repeated* coordination/assurance scenario shattered by a belief shift. PD explains the incentive *structure*; Assurance explains the *equilibria*; Coordination Panic explains the *collapse* from one equilibrium to another.

  5.  **Why it's NOT the Classic Tragedy of the Commons:**
      *   **ToTC Mechanism:** Focuses on individual cost/benefit calculus *ignoring the collective impact*. Each user gains 100% of the benefit from taking more but bears only a fraction of the cost (resource depletion spread across all). Rational self-interest *inevitably* leads to gradual overuse, even if everyone *knows* it's happening and *wishes* they could stop. Beliefs about others are secondary; the structural incentive dominates.
      *   **Your Mechanism:** Cooperation is stable *until* beliefs about others' *imminent* defection change. The collapse is driven by a *coordination failure* based on *fear and uncertainty*, not by inherent, constant pressure to incrementally cheat. The trigger matters.

  **In Summary:**

  *   **The Concept:** **Coordination Panic / Assurance Panic.**
  *   **The Carving:** A rapid, self-fulfilling collapse of a cooperative equilibrium managing a shared resource, triggered by a loss of confidence (assurance) that others will continue cooperating. Individuals defect preemptively based on the fear of others' imminent defection, causing the catastrophic depletion or degradation they sought to avoid.
  *   **Applies When:**
      *   Stable cooperation exists based on mutual assurance.
      *   A credible signal shatters confidence in others' continued cooperation.
      *   Preemptive defection occurs based on fear, not inherent greed.
      *   The defection cascade causes rapid depletion/degradation.
      *   The resource can be a depletable stock (wood) *or* a resource requiring/maintained by cooperative use (path, wiki).
      *   The triggering belief can be true or false (though false is common).

  This captures the essence of your woodlot and office kitchen: not slow greed, but sudden fear of others' greed, leading to a destructive stampede that fulfills the prophecy. It's the fragility of cooperation in the face of uncertainty about others' intentions.
