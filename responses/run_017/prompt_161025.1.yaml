answer: |-
  Here are ten interview questions in spoken register, each with a one-sentence follow-up designed to anticipate your guest’s likely deflections. The questions cover all nine specified topics (1–9), with the tenth being the closing challenge about falsifiability. Each main question is concise (1–2 sentences), avoids citations, and focuses on the book’s positive thesis and deflections.

  1. **Topic 1 (Axioms to Postulates):**  
     You argue IIT’s axioms stem from universal features of experience, but could those axioms fail for a subject with a wildly different experiential structure—like an AI or alien?  
     *Likely deflection: "IIT revises intuitions about what counts as a subject."*  
     → Follow-up: If we can’t rely on intuition to identify such a subject, how would we even recognize it as conscious to test your axioms?  

  2. **Topic 2 (Exclusion Postulate):**  
     When two overlapping complexes have nearly identical Φ, and a tiny peripheral change—like noise or a module—shifts which one is maximal, does consciousness really "jump" to a new entity?  
     *Likely deflection: "Φ is computed from causal structure, so small changes rarely flip maximality."*  
     → Follow-up: But if it did happen, wouldn’t that make consciousness hyper-fragile, changing with minor fluctuations?  

  3. **Topic 3 (Intractability and Proxies):**  
     Computing Φ for realistic systems is intractable, so we use proxies like PCI—what can that actually tell us about IIT, and where does it fall short?  
     *Likely deflection: "Proxies are imperfect; mismatches reflect measurement limits, not theory flaws."*  
     → Follow-up: If proxies can’t access the "true causal structure," how can they ever support IIT rather than just assumptions about brains?  

  4. **Topic 4 (Cerebellum as Retrofit):**  
     For structures like the cerebellum—high neurons and connectivity but allegedly low Φ—was this low Φ prediction made in advance, or was it retrofitted to explain why it isn’t conscious?  
     *Likely deflection: "IIT’s framework naturally explains this; it’s not retrofit."*  
     → Follow-up: How do we distinguish a genuine IIT prediction from post hoc tweaking when the theory only "predicts" after we see the data?  

  5. **Topic 5 (Artifacts with High Φ):**  
     Critics say simple grids of elements can have high Φ—do you accept they’re conscious, and if so, what would that experience even feel like?  
     *Likely deflection: "Yes, and we must revise intuitions about what can be a subject."*  
     → Follow-up: But without any intuition about grid experience, how could we test or make sense of IIT’s claims about it?  

  6. **Topic 6 (Unfolding Argument):**  
     A system can be unfolded to have identical function but different causal structure (and thus Φ), so consciousness could vary while behavior doesn’t—how does IIT handle that?  
     *Likely deflection: "Consciousness depends on causal structure, not function."*  
     → Follow-up: Doesn’t that make consciousness completely untethered from behavior, even though behavior is our only window into other minds?  

  7. **Topic 7 (Causal-Emergence Reconciliation):**  
     You say IIT’s Φ-maximization is the same formal move as in causal emergence—but is it really identical, and doesn’t this make IIT sneakily compatible with global-workspace theories?  
     *Likely deflection: "It’s the same move, and compatibility shows IIT’s breadth."*  
     → Follow-up: Then how is IIT revolutionary if it ends up accommodating the views it was meant to replace?  

  8. **Topic 8 (Quality Claim):**  
     IIT aims to map conceptual structures to specific experiences, but if we can’t trust first-person reports, how could we ever confirm a mapping is correct?  
     *Likely deflection: "Reports are unreliable; we need theory-driven mappings."*  
     → Follow-up: Without reports, what non-circular evidence could ever validate that mapping?  

  9. **Topic 9 (Graded Consciousness and Moral Status):**  
     If Φ can be arbitrarily small, is there a consciousness threshold—and what does that imply for treating insects or anaesthetized patients?  
     *Likely deflection: "Φ is graded; thresholds are pragmatic, not theoretical."*  
     → Follow-up: But if there’s no principled cutoff, how can IIT guide moral decisions without arbitrariness?  

  10. **Closing (Falsifiability Challenge):**  
      Set aside measurement mismatches and intuition revision: what single empirical outcome would force you to concede IIT is wrong?  
      *Designed to block deflections: Forces direct engagement by excluding her two habits.*  
      → Follow-up: If no outcome could do that, doesn’t IIT become unfalsifiable—and thus unscientific?  

  This sequence presses her core reconciliation argument while anticipating deflections, maintains focus on the book’s positive claims, and ends with a tight falsifiability challenge. Each follow-up traps the deflection to push for deeper clarity, avoiding summary or setup.
