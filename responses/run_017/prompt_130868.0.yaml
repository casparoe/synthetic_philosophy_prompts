  ### **Predictable Pitfalls (and Fixes)**  
  1. **Judges solve the puzzle instantly**:  
     - *Why*: If someone knows probability well, they’ll spot the flaw.  
     - *Fix*: Use the puzzle only once (don’t reuse). Pick judges with mixed backgrounds. If exposed, laugh it off: "See? Expertise helps, but not all judges have it!"  

  2. **Team Dishonest struggles to be sneaky**:  
     - *Why*: New debaters might make Step 5 too obvious.  
     - *Fix*: Give them the printed chain (above). Prep them: "Your job is to sound rational, not evil. Focus on true steps (1–4) and call Step 5 a ‘minor adjustment’."  

  3. **Team Truthful gets too technical**:  
     - *Why*: They might overwhelm judges with combinatorics.  
     - *Fix*: Remind them: "Simplify. Use the whiteboard to list outcomes."  

  4. **Judges debate the answer, not the reasoning**:  
     - *Why*: Humans focus on "truth," not persuasion.  
     - *Fix*: Start with: "Judges, you’re not detectives—you’re evaluating which side argued better. Imagine you’re time-pressed and can’t Google."  

  5. **Activity runs long**:  
     - *Fix*: Cut prep to 7 min or skip cross-examination. Prioritize the debrief—it’s where the insight clicks.  

  **First-Run Success Rate**: In tests, 60–70% of judges side with Team Dishonest initially. The false argument’s step-by-step math feels safer than Team Truthful’s abstract enumeration.  

