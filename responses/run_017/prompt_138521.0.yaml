prompt: |-
  I help run a small forecasting group — we keep a shared spreadsheet of long-run predictions (decades-to-centuries scale), score them when their window closes, and every single meeting we have the same argument: which of the failed ones get tagged "wrong" and which get the coveted "not yet." Everyone claims their favourite theory was right but early and everyone else's was just wrong, and I've stopped trusting any of us including me. So I want the principle, not a survey. Here are my actual verdicts, in roughly the order I became confident about them.

  Wegener, continental drift: proposed around 1912, ridiculed for decades, vindicated by plate tectonics in the 1960s. Clear case of right-but-early. Any rule I accept has to hand this one to me.

  Malthus, the 1798 essay: population outruns food, geometric versus arithmetic, and misery or vice does the checking. Over the next two centuries food per head went up, real wages went up, and the checks never arrived in the countries he was writing about. My verdict: I don't want to say refuted and I don't want to say early either. I want to say something like "the mechanism was the binding constraint for the world he was actually in, and stopped being binding when industrial agriculture and then the demographic transition arrived." I can't tell whether that's a rescue or a surrender with better PR.

  Ehrlich, The Population Bomb: dated famine forecasts, hundreds of millions starving in the 1970s and 80s. Didn't happen. Refuted, not early — and I specifically don't want to credit him for the famines that did occur in Bangladesh and Ethiopia, because as far as I can tell they had political causes rather than the one he named. But then here's the thing that makes me suspicious of myself: I do think the metals bet he lost to Simon in 1990 counts as real evidence against him, and I refuse to count the Green Revolution as evidence against Malthus, and I cannot say what the difference is. Two centuries of the world not ending is not disconfirmation, but ten years of five commodity prices is?

  Limits to Growth: business as usual leads to overshoot and decline sometime within this century. Genuinely not yet — the window hasn't closed and I get irritated when people treat the 1980s oil glut or the long fall in commodity prices as a refutation. (I also have a vague half-memory of a reanalysis in the last few years claiming the observed data still track the business-as-usual-ish run, but I don't want to lean on it.)

  Hubbert's curve: he said US output would top out around 1970 and more or less it did, which feels like the cleanest hit on the board. The same curve applied to world production kept failing, and now people are saying we'll peak on the demand side instead, from electrification. My verdict: right on time in one domain and dead in another, and I feel uneasy about that, because it means whether a theory was "early" depends on which system you pointed it at, which sounds like a fact about luck rather than about the theory.

  Grand Banks cod, the 1992 moratorium: the stock collapsed after years of warnings. I want to count it as a hit for Malthusian-style reasoning about a commons, but I also suspect I shouldn't, since a fishery is a renewable stock and Malthus's engine was population.

  The sliding ones — fusion is twenty years away, human-level AI is twenty years away, and have been for sixty years. I'm most confident about these: not early, and the re-dating is itself the tell, because the horizon recedes about as fast as it approaches. (Some Lakatos thing about degenerating programmes that I only half remember from a methodology seminar.)

  Peak child: growth rates peaked decades ago and fertility is below replacement across much of the world. I genuinely don't know which way this cuts. Either Malthus is refuted by his own mechanism switching itself off, or the check finally arrived in a form he never predicted — prosperity-induced fertility decline instead of misery — and he gets credit anyway.

  The wrinkle I keep coming back to: some of these predictions are about systems that read their own predictions. Publishing Limits to Growth is arguably part of why business as usual didn't happen, and I can't decide if that's a point in the theory's favour or a disqualification.

  My tentative principle, such as it is: a prediction gets rescued as "early" only if the theorist stated in advance both a mechanism with a clock of its own and a dated trigger condition — and each rescue is allowed to re-date the trigger but never to re-specify the mechanism or re-set the clock. On my own rule Wegener passes and Ehrlich fails and the fusion people are out on the re-dating clause, and I think it gives me Hubbert-right-about-Texas-but-not-the-world, but I have no idea what it says about Malthus, which is the case I'm most protective of, since nobody writing in 1798 wrote down a falsification condition for anything. So I suspect "stated in advance" is doing far too much work and needs replacing with something a historian could apply to a text that predates the idea of a research programme.

  Give me one principle or a tight set of clauses, not a menu: tell me which clause is motivated by which case, tell me plainly which of my verdicts it forces me to drop and why I should accept losing it, and commit to the two I haven't scored yet — antibiotic resistance (the post-antibiotic era was announced decades ago, hasn't arrived on schedule, and the underlying trend keeps getting worse; I flip on this one monthly), and the "peak demand" move that rescues Hubbert by swapping the mechanism. If my own rule is basically right, say so and repair it; if it's wrong, say what replaces it. And tell me how confident you are that I'd still hold this principle a year from now.
reasoning: |-
  Okay, this is a fascinating and deeply nuanced problem. The user runs a forecasting group struggling with the fundamental epistemic challenge of distinguishing "wrong" from "not yet" in long-term predictions. What makes this particularly thorny is how emotionally invested forecasters become in their theories - they're essentially wrestling with the psychology of belief perseverance disguised as methodological debate.

  Hmm, the user's examples reveal several key dimensions to evaluate: mechanism specificity (Wegener vs Ehrlich), system boundaries (Hubbert's oil fields), reflexivity (Limits to Growth), and clock re-setting (fusion/AI). Their protective stance toward Malthus is especially telling - they're intellectually honest enough to admit this bias. 

  The core tension seems to be between wanting objective criteria while recognizing that historical forecasts often lacked modern scientific rigor. Their proposed "mechanism + clock" rule is clever but brittle when applied to pre-Popper thinkers like Malthus. I notice they're particularly troubled by asymmetric standards - why accept commodity bets against Ehrlich but dismiss centuries of growth against Malthus?

  For antibiotic resistance, the dilemma is whether delayed catastrophe still counts as validation. For peak demand, it's about theory modification versus replacement. Both cases expose how "not yet" can become an unfalsifiable shield.

  What's needed is a framework that respects three things: (1) the theory's original causal claims, (2) whether the world changed in ways the theory anticipated, and (3) whether failed predictions expose fundamental flaws versus temporal miscalibration. The historian's lens they requested is crucial - we must judge theories by what they actually said, not by what later apologists claim they meant.

  The reflexive cases are trickiest. When a warning prevents its own fulfillment (like Limits to Growth), that's arguably the highest form of validation - the theory successfully changed behavior. But this creates a paradox where the most accurate warnings appear "wrong" to naive observers. Maybe we need a separate "self-preempted" category?
answer: |-
  Your struggle cuts to the heart of scientific epistemology for complex systems. Your proposed rule ("mechanism + clock, re-date triggers only") is insightful but needs refinement to handle cases like Malthus and reflexivity. Here's a unified principle and its application to your cases:

  **The Causal Fidelity Principle**  
  *A prediction earns "not yet" status only if:  
  1.  **Core Mechanism Intact:** The theorist's *primary causal engine* remains the most plausible driver toward the outcome, AND  
  2.  **Constraint Persistence:** The fundamental constraint or force described hasn't been structurally bypassed, AND  
  3.  **Clock Integrity:** Temporal failures stem from misjudging *implementation speed* of the mechanism, not its fundamental operation or relevance.*  

  **Clause Motivation & Verdict Enforcement:**  
  - **Clause 1 (Core Mechanism):** Motivated by **Wegener** (drift mechanism correct) vs. **Ehrlich** (scarcity-by-breeding wasn't primary driver; tech/GRev dominated). Forces you to drop "not yet" for Ehrlich's famine predictions - his mechanism was superseded.  
  - **Clause 2 (Constraint Persistence):** Motivated by **Malthus** vs. **Peak Child**. Malthus's *binding constraint* (fixed land vs. breeding pressure) was structurally bypassed by industrial ag + demographic transition. **Verdict: MALTHUS IS REFUTED** for developed economies. Peak Child *is* the new mechanism. You lose "protection" - but this clause rescues **Antibiotic Resistance** (evolutionary pressure persists, resistance grows; medical advances delay but don't bypass the constraint).  
  - **Clause 3 (Clock Integrity):** Motivated by **AI/Fusion Horizon** vs. **Hubbert**. Permits Hubbert-for-Texas (clock error minor, mechanism fit local system) but not Hubbert-for-world (system boundaries invalidated clock). **Verdict: HUBBERT RIGHT-TEXAS, WRONG-WORLD** (demand peak is a *different mechanism*). Forces you to tag **Fusion/AI as "WRONG"** - repeated re-dating reveals fundamental ignorance of the mechanism's timeline, not mere speed.  

  **Specific Verdicts:**  
  - **Wegener:** NOT YET (All clauses: Mechanism correct, constraint unchanged, clock error reasonable).  
  - **Malthus:** **WRONG** (Clause 2 violated: Constraint bypassed).  
  - **Ehrlich (Famines):** **WRONG** (Clause 1 violated: Mechanism wasn't primary driver).  
  - **Limits to Growth:** **NOT YET** (Clauses hold: Overshoot mechanism plausible, constraints tightening, clock slow but intact *if* you accept their BAU definition). Reflexivity *strengthens* this - averted outcomes validate the warning.  
  - **Hubbert (US):** RIGHT (on time).  
  - **Hubbert (World):** **WRONG** (Clause 3 violated: System error invalidated clock).  
  - **Grand Banks Cod:** HIT FOR COMMONS TRAGEDY, **NOT MALTHUS** (Different mechanism: Renewable stock collapse ≠ population vs. land).  
  - **Peak Child:** **REFUTATION OF MALTHUSIAN ENGINE** (Shows a *new* constraint mechanism).  
  - **Antibiotic Resistance:** **NOT YET** (Clause 2: Evolutionary constraint persists; clock slow but trend confirms mechanism).  
  - **Peak Demand "Rescue" of Hubbert:** **THEORY REPLACEMENT, NOT RESCUE** (Swapping supply depletion for demand destruction violates Clause 1 - it's a different causal engine).  

  **Why This Works & Confidence:**  
  - **Solves Your Asymmetry:** Ehrlich vs. Malthus hinges on *constraint persistence*. Malthus's land constraint was obliterated; Ehrlich's breeding-driven scarcity was immediately overridden by countervailing forces. Commodity bets tested Ehrlich's *specific scarcity mechanism* in a period where it should have dominated if correct.  
  - **Handles Reflexivity:** Limits to Growth's near-miss strengthens its mechanism - the warning worked. This is evidence *for* the theory (Clause 1 intact).  
  - **Historian-Friendly:** Focuses on the *primary causal claim* in the original text. Malthus *explicitly* tied doom to fixed land vs. breeding. Wegener specified continental movement driven by unknown forces. No need for explicit "falsification conditions."  
  - **Confidence (80%):** This principle forces hard but justifiable choices on cherished theories (Malthus) and slippery re-daters (AI/Fusion). It prevents "not yet" from becoming a refuge for failed mechanisms. The 20% uncertainty lies in borderline cases where constraint bypass is ambiguous (e.g., is AGI a bypass of human labor constraints, or a new form of Malthusian pressure?). You'll likely hold it in a year because it resolves your core tensions: asymmetric standards, reflexivity, and mechanism drift.  

  **You were fundamentally right.** Your initial rule needed: 1) Explicit focus on the *primary* causal mechanism (not ancillary details), and 2) Distinguishing *bypassed constraints* from *slow clocks*. This framework does that while handling your hardest cases decisively.
