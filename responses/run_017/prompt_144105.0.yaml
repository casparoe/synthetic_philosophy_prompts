prompt: |-
  Hi — I'm on the naming committee at a small atrocity-remembrance museum (we write the wall texts and the annual statement) and we've boxed ourselves in, so I wanted an outside read before the next meeting.

  Our record so far: Srebrenica 1995 — genocide. Herero and Nama 1904–08 — genocide. Yazidis under ISIS, 2014 — genocide, and we explicitly said it didn't matter that the perpetrator wasn't a state. Khmer Rouge — genocide for the Vietnamese and the Cham, but not for the killings of "new people", because our write-up said that was a political category, not a protected one. Canadian residential schools — genocide, but under a separate "cultural genocide" heading, which our charter keeps inside the genocide heading because it says we use the term in Lemkin's broader sense of destroying a group's life, not just the Convention's; nobody ever wrote down how much broader. Holodomor — no, we called it a mass atrocity instead: foreseeable, even welcomed, but not carried out in order to destroy Ukrainians as such. 1944 deportation of the Crimean Tatars — also no: catastrophic and the community was wrecked, but the point was removal, and the group went on existing elsewhere.

  New case, and it isn't historical. A ministry upstream diverts and salinates the water of a delta region inhabited mostly by an ethnic minority with an active separatist movement. It goes out as an irrigation and hydropower scheme, run through a public-private consortium whose water allocations are set by an automated system. Ten years on the delta can't be lived in, the population has scattered into diaspora, the birth rate has collapsed, and fluent speakers of the language are nearly all elderly. Leaked internal documents show the consortium's models forecast that depopulation in detail and logged it as an upside — it ends the separatist pressure — but the operative stated aim was power and cotton, and no individual official can be shown to have adopted the group's destruction as a purpose. Nobody disputes the group is an ethnic minority.

  Do we put genocide on the wall? Which of our own cases is the closest analogue, and if our precedents genuinely don't settle it, what rule would we be committing to by saying yes and what by saying no? I'm less after the correct call than after which rule our seven past decisions are actually consistent with — I think at least two or three fit all of them — and which variant of this case we'd have to imagine for those rules to come apart instead of agreeing.
reasoning: |-
  Okay, the user is part of a naming committee for an atrocity-remembrance museum. They've established precedents on labeling events as genocide or not, based on their charter that uses Lemkin's broader definition. Now they're facing a new case involving a delta region's ethnic minority whose environment was destroyed by a water diversion project, leading to diaspora and cultural collapse. Internal documents show the depopulation was seen as beneficial for ending separatism, but the stated purpose was economic. The user wants to know if this qualifies as genocide under their existing framework and which precedent it aligns with.

  First, I need to parse their existing cases. They consider Srebrenica, Herero-Nama, Yazidis, and specific Cambodian groups as genocides. Cultural genocide under Lemkin's definition includes Canadian residential schools. But they excluded Holodomor and Crimean Tatars deportation because intent to destroy the group wasn't the primary driver. The key factors here seem to be intentionality and the perpetrator's purpose, especially whether the destruction of the group was a goal versus a side effect.

  The new case presents a challenge: the ministry's actions led to the group's destruction, with leaked documents acknowledging depopulation as an upside. But the official aim was economic. The user needs consistency with their past decisions. Looking at their precedents, the closest analogues are Holodomor and Crimean Tatars, which were rejected due to lack of specific intent. However, the leaked documents here show awareness and acceptance of the group's destruction as beneficial, which might edge closer to intent.

  The user's deeper need is likely about maintaining institutional consistency and setting a clear rule for future cases. They might also be grappling with how to handle structural violence where intent isn't explicit but outcomes are devastating. They need a rule that either expands "intent" to include foreseeable consequences embraced as benefits or sticks to requiring explicit purpose. If they choose to label this genocide, they'd be committing to a rule where perpetrators' awareness and acceptance of group destruction as a consequence satisfies the intent requirement. If not, they reinforce the need for explicit purpose. The user also wants to know how hypothetical variations (like altered documents or different actor motivations) would test their rule's boundaries.
answer: |-
  Based on your committee's established precedents and reasoning, **this case *does not* meet your threshold for labeling it "genocide" on the wall.** However, it sits *very* close to the line you've drawn, and accepting it would require committing to a significant (though arguably Lemkin-aligned) expansion of your "intent" rule. Here's the breakdown:

  1.  **The Closest Analogues: Holodomor (1932-33) & Crimean Tatars (1944)**
      *   **Why they fit:** Your committee rejected both because the *primary, operative intent* was not the destruction of the group *as such*. For Holodomor, it was collectivization/industrialization (with Ukrainian destruction foreseeable/welcomed but not the core aim). For Crimean Tatars, it was removal/security (with destruction of their community as a *consequence*, not the *purpose*).
      *   **Alignment with the New Case:**
          *   **Stated Aim:** Power, cotton, irrigation (economic/strategic). Like Holodomor's industrialization or the Tatars' security.
          *   **Foreseen & Welcomed Outcome:** Depopulation/destruction of the group was foreseen and logged as an "upside" (ending separatism). Like the Holodomor's foreseeable/welcomed death of Ukrainian peasants resisting collectivization or the Tatars' destruction *as a functioning community in their homeland* being a known consequence of deportation.
          *   **Lack of Individual "Purpose":** No individual official adopted group destruction *as a purpose*. Like Holodomor/Crimean Tatars.
          *   **Result:** Catastrophic destruction of the group's existence *in situ*, scattering, cultural collapse. Like both analogues.
      *   **Conclusion by Precedent:** Following Holodomor/Tatars, this is **not genocide** under your rules. The *operative intent* was economic/strategic, not group destruction. The destruction was a foreseen and welcomed *consequence* or *secondary benefit*, not the *driving purpose*.

  2.  **Why it's Different from Your "Yes" Cases:**
      *   **Srebrenica/Herero-Nama/Yazidis/Khmer Rouge (Specific Groups):** Direct, intentional killing with the core purpose of destroying the group physically. Perpetrators acted *in order to* destroy the group.
      *   **Canadian Residential Schools:** While the *mechanism* (cultural destruction) was different, your committee accepted it *because* you interpreted the *intent* as being the destruction of the group *as a group* ("to kill the Indian in the child"). The *purpose* was group destruction, achieved through cultural means. In this new case, the *purpose* wasn't group destruction; group destruction was a *useful side effect*.
      *   **Yazidi Non-State Actor:** Your acceptance here shows the *perpetrator's identity* isn't the barrier; the *nature of the intent* is.

  3.  **The Rule You're Following (Implicitly) & What Saying Yes/No Commits You To:**
      *   **Current Rule (Inferred from Precedents):** Genocide requires the *intentional destruction of a protected group, where the destruction of the group (in whole or in part) is the primary, operative purpose driving the perpetrator's actions.* Foreseeability of destruction, or even its acceptance/welcoming as a benefit, is *not sufficient* if the *core purpose* was something else (economic gain, strategic security, political suppression of a non-protected category).
      *   **Saying "No" Commits You To:** Maintaining this stricter "primary operative purpose" test for intent. It reinforces that foreseeability + benefit ≠ genocidal intent under your framework. You are prioritizing the *driver* over the *outcome* or *secondary motivations*.
      *   **Saying "Yes" Commits You To:** A significant expansion of "intent." You would be adopting a rule where: **If perpetrators deliberately undertake actions they know will destroy a protected group (in whole or in part) *and* they embrace that destruction as a specific, desired outcome (even if not the sole or primary driver), this constitutes genocidal intent.** This moves closer to concepts like "dolus eventualis" (intent as to consequences) or "knowledge-based intent" in international law discussions, emphasizing the *acceptance and utilization* of the group's destruction.

  4.  **Which Variant Would Make the Rules Come Apart?**
      *   **Scenario Testing "Primary Operative Purpose" (Current Rule):** Imagine the leaked documents showed the *primary driver* for key decision-makers was *specifically* to destroy the ethnic group by salinating the delta, using power/cotton as a *cover story* or secondary benefit. *This* would clearly align with Srebrenica/Herero intent under your current rule and demand a "Yes". The economic motive being a smokescreen changes the operative purpose.
      *   **Scenario Testing the "Embraced Outcome" Expansion (If you said Yes to this case):** Imagine a nearly identical scenario, *except* the leaked documents showed the models *only* predicted severe hardship and migration, *not* complete cultural collapse or an end to the group's existence. Consortium officials express *regret* about the impact on the minority but deem it necessary for the "greater good" of power/cotton. The outcome (diaspora, language loss) still happens due to the scale of the damage, but it wasn't specifically foreseen *as group destruction* or embraced as an upside. Under your *current* rule, this is clearly a "No" (like Holodomor/Tatars). If you said "Yes" to the *original* case (because destruction was foreseen *and* embraced as an upside), you would *have* to say "No" to *this* variant because the *embraced outcome* (mere hardship/migration) falls short of group destruction, even if the ultimate result was the same. This highlights the difference between foreseeing destruction + welcoming it vs. foreseeing hardship + regretting it.

  **Recommendation & Reasoning:**

  *   **Recommendation:** **Do not label this genocide** *based on strict adherence to your established precedents (Holodomor, Crimean Tatars).* The closest analogues point to "No." The operative purpose was economic/strategic; the group's destruction was a foreseen and welcomed *consequence*, not the *purpose*.
  *   **Why:** Consistency with your past reasoning is paramount for institutional credibility. Calling this genocide would represent a *shift* in how you interpret intent, moving from "primary operative purpose" to "foreseen, inevitable, and embraced outcome." This shift *could* be justified by leaning harder into Lemkin's concept of destroying the "life" of the group (which includes societal/economic foundations), but it *would* be a shift relative to how you've applied the concept to Holodomor and the Tatars.
  *   **Labeling Suggestion:** This screams **"Cultural Genocide"** under your broader Lemkin-based definition (like the Residential Schools), or a stark case of **"Atrocity Crime"** or **"Group-Destructive Atrocity"** given the catastrophic outcome and the documented awareness/acceptance of that outcome. You could also use **"Foreseeable Group Destruction"** as a specific category.
  *   **Critical Next Step:** Your committee **urgently** needs to explicitly define "how much broader" Lemkin's sense is, particularly regarding **intent** and **mechanisms**. Does "destroying the life of the group" encompass *deliberate* destruction of the environmental/economic base essential to that group's existence, *when the perpetrators foresee and welcome the group destruction as a result*? Your precedents currently say no. Deciding if that *should* change is the core debate this case forces. The leak showing the *embrace* of the destructive outcome is the key new pressure point your previous cases didn't have so clearly documented.

  This case brilliantly exposes the tension in your framework between outcome-focused (Lemkin) and purpose-focused (Convention-inspired) interpretations of genocide. Your past decisions lean towards purpose. Adopting this case as genocide would be a major, outcome-focused evolution. Choose consciously.
