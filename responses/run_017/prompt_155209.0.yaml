              - If no, stop (do not offer).
          Step 5: Discuss risks: "Knowing you have a high risk might cause anxiety, and it's in your medical record." 
              - If the patient still wants it, offer.
              - If the patient is concerned, do not offer.

          For most patients, we would not offer because Step 3 is often "no", and even if "yes", Step 5 might lead to not offering if risks are a concern.

     Example 3: Patient wants actionable-only secondary findings.

          We define the test as the secondary findings panel but only reported if actionable (VUS and non-actionable are not reported).

          Step 1: Explain that we will only report if there's an actionable finding.
          Step 2: By design, if we report, then there is an action. So the patient would take action. Go to Step 4.
          Step 4: Ask confidence in taking the action if an actionable finding is found.
          Step 5: Discuss risks: even actionable findings can cause distress and have privacy implications. But the patient avoids distress from non-actionable results. 
              - If the patient is comfortable, offer.
              - If not, do not offer.

          We would typically offer.

     Note: The procedure might take 20 minutes because it involves several open-ended questions.

     Finally, we note for each step:

          Step 1: DT (about the structure of information control) and VJ (how much weight to give to privacy concerns?).
          Step 2: DT (instrumental value).
          Step 3: VJ (non-instrumental value is subjective).
          Step 4: DT (probability of action) and VJ (what confidence level is sufficient?).
          Step 5: VJ (weighing benefits and risks, which are subjective).

     Cases the procedure can't settle:
          - When the patient's self-assessment of their reaction (in Step 5) is unreliable (e.g., they underestimate their distress). We rely on the counselor's judgment.
          - When the patient says they will act (Step 2) but the counselor believes they won't (Step 4). We proceed to offer but note the risk of non-adherence in Step 5.
          - When the benefits and risks are incommensurable (e.g., minor benefit vs. major privacy risk). We hand it back to the patient.

     We might add a step for vulnerable patients (e.g., with mental health issues) where we involve a psychologist.

     This procedure might lead to not offering the secondary findings panel by default to everyone, but only to those who see benefit and accept the risks. That might be a change.

     Let me know if you want any adjustments.
answer: |-
  Below is a step-by-step procedure for genetic counselors to assess whether an optional genetic test result should be offered to a patient. It explicitly addresses the core challenges you raised, incorporates Good's theorem assumptions, and flags decision theory (DT) vs. value judgments (VJ). The process takes ~20 minutes and is designed for intake. Steps that "stop with a no" end the evaluation for that test; steps that "hand back" shift to patient autonomy after clarifying trade-offs.

  ---

  ### **Genetic Test Offering Protocol: 20-Minute Intake Assessment**

  #### **Step 1: Control and Irreversibility Check**  
  *(Addresses: Results that are durable/semi-public, patients who can't ignore info)*  
  - **Question:**  
    "If we run this test, the result will be stored in your medical record and could be accessed by future providers or family members. Even if you change your mind later, you can’t ‘un-know’ it. Does this concern you? How do you feel about that?"  
  - **Sufficient Answer:**  
    Patient acknowledges permanence. If they express strong discomfort (e.g., "I’d hate for my family to find out"), proceed to Step 1a.  
  - **Stop with No If:**  
    Patient refuses any irreversible information (e.g., "I never want this in my record").  
  - **DT/VJ Notes:**  
    - *DT:* Tests Good’s "ignore" assumption. If information can’t be ignored (due to record permanence), the theorem breaks.  
    - *VJ:* Patient’s tolerance for irreversibility is a value judgment.  
  - **Edge Cases:**  
    If patient is ambivalent ("I’m okay if it’s private"), proceed. If they demand perfect secrecy (impossible), stop—test not offered.  

  #### **Step 2: Actionability Assessment**  
  *(Addresses: Results with no prevention, patients who won’t act, coarsened signals)*  
  - **Question:**  
    "If this test found a result that *might* increase your risk for [condition], is there anything you’d actually do differently? (e.g., screenings, meds, lifestyle changes?) What if it found nothing?"  
  - **Sufficient Answer:**  
    Patient identifies concrete actions (or lack thereof). If actions are vague ("I’d worry less"), probe: "What would that worry change?"  
  - **Stop with No If:**  
    Patient confirms *no actions* for any result (e.g., polygenic score for untreatable disease).  
  - **DT/VJ Notes:**  
    - *DT:* Measures instrumental value. If expected actions = zero, value ≤ 0 (since cost > 0).  
    - *VJ:* Defining "action" is subjective (e.g., "telling family" may be action to some).  
  - **Edge Cases:**  
    - If patient requests coarsened signal (e.g., "only tell me if actionable"): Re-define the test as binary (actionable/non-actionable) and restart Step 2.  
    - If patient claims they’ll act but has history of non-adherence, note for Step 4.  

  #### **Step 3: Non-Instrumental Value Check**  
  *(Addresses: Zero-decision-value results, VUS, declining free results)*  
  - **Question:**  
    "Even if there’s nothing you can do, some people want to know for other reasons—like planning, family insight, or peace of mind. Would this information help you in ways beyond actions?"  
  - **Sufficient Answer:**  
    Patient describes non-action benefits (e.g., "I’d prepare emotionally") or rejects them (e.g., "I don’t care").  
  - **Stop with No If:**  
    Patient declines *and* no actions from Step 2 (e.g., VUS with no utility).  
  - **DT/VJ Notes:**  
    - *DT:* Non-instrumental value may offset cost, but is unquantifiable.  
    - *VJ:* Counselor must accept patient’s self-reported utility (even if irrational).  
  - **Edge Cases:**  
    Patients declining "free" results: If non-instrumental value = 0 and actions = 0, stop—this is a *preference*, not a mistake.  

  #### **Step 4: Action Confidence Calibration**  
  *(Addresses: Patients who say they’ll act but won’t)*  
  - **Question:**  
    "On a scale of 0–10, how sure are you you’d follow through with [action from Step 2] if the test was positive? What could stop you?"  
  - **Sufficient Answer:**  
    Patient rates confidence + identifies barriers (cost, anxiety, access).  
  - **Hand Back If:**  
    Confidence <7 with high-stakes actions (e.g., prophylactic surgery). Counselor says: "Given your doubts, are you *sure* you want this test? It might cause stress if you don’t act."  
  - **DT/VJ Notes:**  
    - *DT:* Expected utility = (Benefit of action × Confidence) – Cost. Low confidence reduces value.  
    - *VJ:* Threshold (e.g., "7/10") is arbitrary; barriers are value-laden (e.g., "I value mental peace over prevention").  
  - **Edge Cases:**  
    If patient insists on testing despite low confidence, proceed—but flag in consent.  

  #### **Step 5: Net Risk-Benefit Synthesis**  
  *(Addresses: Hedonic costs, family implications, all unresolved trade-offs)*  
  - **Question:**  
    "Let’s weigh pros and cons. Benefits: [actions from Step 2, non-instrumental from Step 3]. Risks: anxiety, false reassurance, family conflict. How do you feel about this balance?"  
  - **Sufficient Answer:**  
    Patient articulates trade-offs (e.g., "The benefit to my kids outweighs my anxiety").  
  - **Hand Back If:**  
    Uncertain balance (e.g., moderate benefit + high privacy risk). Counselor says: "This depends on your values—do you want the test despite risks?"  
  - **Stop with No If:**  
    Risks clearly dominate (e.g., severe psychological vulnerability + minimal benefit).  
  - **DT/VJ Notes:**  
    - *DT:* Requires comparing incommensurables (e.g., "family utility" vs. "personal anxiety").  
    - *VJ:* All risks are perception-based; counselor cannot override patient’s risk tolerance.  

  ---

  ### **Applying the Protocol to Your Cases**
  **Goal:** Flag if defaults should change.  
  **Assumption:** Tests are optional/secondary; primary diagnoses are handled separately.

  #### **1. Secondary Findings Panel (Offered by Default)**  
  - **Step 1:** Irreversible (in chart). If patient objects, stop. Else proceed.  
  - **Step 2:** Usually actionable (e.g., BRCA → surgeries). If no actions, go to Step 3.  
  - **Step 3:** Non-instrumental value common (e.g., "for my family’s sake").  
  - **Step 4:** High confidence expected (evidence-based interventions).  
  - **Step 5:** Risks (anxiety, VUS) often outweighed by lifesaving actions.  
  - **Verdict:** **Offer by default** *unless* Step 1 (irreversibility) or Step 5 (risk-averse patient) stops it.  
  - **Problem:** Forces ~5% of patients to "opt out." Procedure suggests **opt-in** for privacy-sensitive cases.  

  #### **2. Polygenic Score (Late-Onset, No Intervention)**  
  - **Step 1:** Proceed (unless patient refuses irreversibility).  
  - **Step 2:** **Stop with no**—no actions by definition.  
  - **Step 3:** If non-instrumental value claimed (e.g., "I want to know"), go to Step 5.  
  - **Step 5:** Risks (anxiety, false reassurance) usually dominate.  
  - **Verdict:** **Rarely offer**. Non-instrumental value seldom offsets cost (e.g., 23andMe PTSD-like responses).  
  - **Problem:** Default offering wasteful. Procedure **recommends not offering** without explicit patient demand.  

  #### **3. Patient: "Disclose Only If Actionable"**  
  - **Redefine Test:** As binary (actionable/non-actionable).  
  - **Step 1:** Less risk (non-actionable hidden), so proceed.  
  - **Step 2:** Actionable results imply actions → high instrumental value.  
  - **Step 3:** Non-actionable results suppressed → no non-instrumental value considered.  
  - **Step 4/5:** Standard assessment for actionable portion.  
  - **Verdict:** **Offer**—aligns with Good’s theorem (patient "ignores" non-actionable).  
  - **Problem:** Counselors may resist "hiding" data. Procedure supports this as rational info-filtering.  

  ---

  ### **When the Procedure "Fails"**  
  - **Unresolvable Cases:**  
    - Non-instrumental value vs. severe anxiety (Step 5): Hand back to patient.  
    - Low action confidence (Step 4): Hand back after warning.  
    - Family pressure vs. patient refusal: Not addressed—requires ethics consult.  
  - **Limitations:**  
    - Assumes patient honesty (e.g., about future actions).  
    - Doesn’t quantify "hedonic cost" (requires post-test support).  
    - Semi-public results: Risks are probabilistic (discrimination), not absolute.  

  **Conclusion:** This protocol surfaces when Good’s theorem fails (irreversibility, no actions) and makes value judgments explicit. For your defaults:  
  - **Secondary findings:** Switch from opt-out to **opt-in** for privacy reasons.  
  - **Polygenic scores (no intervention): Do not offer** without patient initiative.  
  - **Actionable-only requests: Allow**—it’s consistent with info economics.  

  This would reduce iatrogenic harm (e.g., anxiety from non-actionable results) while respecting autonomy. I recommend piloting this with your counselors and revising based on intakes.
