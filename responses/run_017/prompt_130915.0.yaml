  (Standing at the podium, looking out at the crowd, a slight smile touching the corners of your mouth)

  Mary, Kevin, friends from Cutler, colleagues old and new… standing here, looking at this beautiful new lab, I swear I can smell guano and salt spray. And rain. Always the rain. Especially that sideways sleet on the Nubble, Rafe? You never flinched. Forty-one seasons. Think about that. Forty-one springs hauling gear up those rocks in the hired skiff. Forty-one summers carefully weighing puffin chicks, scribbling notes, feeling the heft of life in your hand. Forty-one autumns packing up, hoping the bands held fast. That’s not just dedication. That’s… bedrock. The kind of consistency that builds mountains of data, grain by grain. This lab? Named right. It stands on Rafe Halloran’s bedrock.

  And what did that bedrock let us see? Two puffin colonies. Our backyard. The Nubble: cold water, thick with herring, sand lance – puffin buffet. Outer Double Head: warmer currents, thinner pickings, tough living. And a gap. Nubble chicks fledged plump, averaging 340 grams. Outer Double Head chicks, leaner, 260 grams. Year after year. Rafe saw that gap, measured it like everything else. And he saw something else, deep in his data: within each colony, puffin parents passed *something* on. A chick from hefty parents? Likely hefty itself. A chick from leaner stock? Leaning towards lean. That mid-parent regression slope – Rafe’s number – sat right around 0.6. Solid. Repeatable. High heritability, meaning within *each* colony, a good chunk of the *differences* in fledging mass between chicks could be traced back to differences in their parents’ genes. Rafe was proud of that number. As he should be. It was his life’s careful measuring, captured in one line.

  Now, Rafe looked at that gap *between* the colonies – the 340 versus the 260 – and he looked at his 0.6, and he thought: genetics. Local adaptation. He pictured tough, lean Outer Double Head birds, adapted to hardship. He wanted to ‘improve the stock,’ as he’d say with that glint in his eye, by bringing in some of those big Nubble chicks. Move the genes.

  Me? I looked at the cold, rich water sloshing around the Nubble, and the warm, thin soup out at Outer Double Head, and I thought: dinner plate. I thought that gap smelled like herring, not genes. We argued it good-naturedly for decades. Over thermoses of coffee, counting bands by headlamp. What settled it? That bedrock data *again*. The sheer, unbroken record Rafe built. It meant that last season – his final season – when we finally did the experiment, swapping eggs between colonies, cross-fostering… we *knew* the baseline. We knew what those eggs *should* have weighed if they’d stayed home.

  The results were as clear as a puffin diving. Eggs laid by Outer Double Head parents? Raised by foster parents on the rich Nubble? They fledged at about 335 grams. Bang on the Nubble average. Eggs laid by big Nubble parents? Raised by fosters out on the lean Outer Double Head? 265 grams. Right on *that* average. The gap didn't follow the genes. It followed the water. It followed the fish. It followed the *place*.

  So, genetics matter? Absolutely. Rafe’s 0.6 within each colony proves it. In a *stable* environment, with resources predictable, genes explain a lot about why *this* chick is a bit heavier than *that* chick *in the same colony*. But the big gap *between* the colonies? That’s environment. The ocean’s larder. Plain and simple.

  And here’s a twist Rafe saw unfolding in his later years, written in his notebooks. Outer Double Head. The water’s warmed. The forage fish became scarce, unpredictable. Good days, bad days. And Rafe’s own number, that heritability estimate? It slid. Down to about 0.1. Why? Because when the *environment* gets wild, when food is feast or famine and random for every chick, the *differences* in genes get swamped. They explain less of the *variation* in fledging mass. The trait didn’t change. The *population* changed. The *environment* changed. The *estimate* changed. It’s a number *about* a group, *in* a place, *at* a time. Not a fixed label stamped on the trait itself. It measures the share of the *differences within* that group that genes explain *right now*. Change the group, change the environment, change the share.

  Which brings me to Rafe’s other famous line, usually delivered with a shrug when things looked grim: “If it’s heritable, it isn’t fixable.” Meaning, if genes are involved, you can’t change it. Well… look at our cross-fostering. Mass is heritable *within* a colony, sure. Rafe proved it! But we *fixed* the gap for those Outer Double Head chicks simply by moving the eggs to better food. We changed the outcome dramatically, without changing a single gene. Because the *difference between* wasn't genetic in the first place. Heritability tells you about the *differences within* a group under current conditions; it doesn’t lock the *whole group* into a fate against a changing environment or against another group. And it doesn’t mean you can’t improve things by changing the world *around* the genes. Rafe’s own data, right to the end, showed that environment writes a powerful story.

  So, what do we take from Rafe’s bedrock? First, that showing up matters. Season after season. That meticulous care builds understanding that lasts. Second, that genes paint part of the picture, but the canvas – the environment – matters profoundly. Third, that asking “why is *this* chick different from *that* chick?” is a different question than “why is *this* whole colony different from *that* one?” And fourth, that even rock-solid numbers like 0.6 are answers to specific questions asked of specific populations in specific moments – they’re not universal decrees.

  This lab, named for Rafe Halloran, isn’t just a building. It’s a testament to the power of patient watching, careful measuring, and asking hard questions of the natural world – even when the rain’s coming sideways. It’s about continuing the conversation Rafe started forty-one years ago. A conversation grounded in data, open to surprise, and dedicated to understanding these remarkable birds and the changing sea they live in. Let’s get some bands on some chicks. Rafe would like that. Thank you.
