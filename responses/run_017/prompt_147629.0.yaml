answer: |-
  ## Dialogue: The Price of Knowing

  **(A university common room. INES VARTAINIAN, late 30s, sharp-eyed, nursing black coffee. TOMÁS HALVORSEN, early 40s, slightly rumpled, leaning back in an armchair. Papers are scattered but ignored.)**

  **TOMÁS:** Right, Ines. Fortnightly existential dread about markets. My turn to buy the biscuits next time. So, the no-trade hammer: common priors, common knowledge rationality, pure speculation... *poof*, no trades. Yet, trillions change hands daily. Prediction markets often nail elections better than polls. What gives? Your ‘ignorance tariff’ always sounds like markets run on stupidity. Pay up, and the truth leaks out.

  **INES:** (Smirking) Not *stupidity*, Tomás. Calculated subsidy. Think of it as the entry fee for information access. The price *can’t* be perfectly informative unless someone is willing to lose money to someone better informed. You know this. That loss has to be paid for. Either the ‘loser’ is mistaken, or they have motives beyond pure belief – liquidity needs, irrational impulses, hedging gone wrong. The market’s accuracy is fundamentally capped by how much of this subsidizing error or non-epistemic noise the system tolerates. It’s a machine converting measured doses of epistemic imperfection into a public signal.

  **TOMÁS:** That’s bleak. And I think it misidentifies the fuel. It’s not primarily error being burned. It’s *heterogeneity*. People aren’t just disagreeing beliefs in a vacuum. They have lives! Different endowments, different risks outside the market, different time horizons. The counterparty isn’t usually a patsy; they’re someone managing a *portfolio*. A fleet operator with a massive natural short position on fuel prices doesn’t *believe* fuel will crash when they hedge; they *need* to lock in a price to survive volatility. Their trade isn’t a subsidy to error; it’s risk-sharing. The market aggregates the *pressure* of these diverse, real-world exposures. That’s why the resulting price can inform a bystander – it reflects the net force of all that external reality pressing in.

  **INES:** Fine. Let’s get dirty. City congestion charge contract. Will it survive two years? Volume’s high. Trucking firms hate it – natural shorts. Ride-share companies might love it – natural longs. Commuters hedging their future driving costs. Your heterogeneity heaven, right? The price aggregates all that exposure pressure?

  **TOMÁS:** Exactly. The price reflects the net demand/supply induced not just by beliefs about the policy’s survival, but by the *real economic consequences* its survival or failure imposes on different actors. A bystander – say, a property developer deciding where to build – learns something valuable from that price *because* it condenses all that complex, conflicting exposure into a single number. It’s not just a poll of opinions; it’s a poll weighted by real stakes.

  **INES:** Okay, plausible. Now let’s get *clean*. Prediction market: Will the famous ‘Ego Depletion’ psychology finding replicate in this big, pre-registered, multi-lab study? Zero real-world exposure. Nobody’s profits, commute, or supply chain depends on the outcome. Volume comes almost entirely from psychologists, stats nerds, meta-science folks – people who think they have private information. Where’s your heterogeneity now, Tomás? Where are the fleet operators and hedgers? If your story holds, volume should be minimal, right? But prediction markets on these things *do* trade, sometimes heavily, and often get it right. Explain *that* without invoking my tariff – without admitting that the volume is fueled by people willing to lose money because they’re overconfident, irrational, or just love the gamble?

  **TOMÁS:** (Leans forward) Fair challenge. In the clean case, heterogeneity is… subtler. It’s still there. Time horizons: Some traders want resolution *now*, others are happy to wait. Different interpretations of ‘private information’: One lab head might weight their own unpublished failed replication attempt heavily; another dismisses it as noise. Different priors formed by genuinely different life experiences – the developmental psych person sees fragility everywhere, the cognitive neuroscientist sees robust effects. And yes, perhaps some non-epistemic utility – the thrill of being right, the desire to influence the narrative. But crucially, it’s the *differences* in these interpretations, priors, and utilities that generate the opposing desires to buy and sell. The market still aggregates the net pressure of these *differing perspectives and constraints*, even if the ‘constraint’ is just impatience or differing confidence calibrations.

  **INES:** So, impatience becomes your heterogeneity? That feels like stretching. And how does this aggregation of ‘differing perspectives’ magically beat, say, a simple poll? Which brings me to your pet thought experiment. The Credence Escrow. Alongside the market, anyone can anonymously submit a sealed probability estimate for the replication outcome. No trading, just an unweighted average published later. Suppose the escrow average says 70% chance of replication, but the market price implies 55%. What does your heterogeneity story say the price *adds* over the escrow average, besides weighting guesses by who has more money to throw around? Is it just an elite poll?

  **TOMÁS:** (Pauses) It’s more than weighting by wealth. The market price incorporates *incentive compatibility*. Putting money where your mouth is. The escrow is cheap talk. In the market, if you think the escrow is wrong at 70%, you can *bet against it*, forcing the price towards what you believe the evidence warrants, *if* you’re confident enough to risk capital. The price reflects not just aggregated beliefs, but beliefs tested and weighted by *willingness to act on them under risk*. That’s why it might be more informative than an unweighted average – it filters out pure noise and overweights conviction backed by capital. The heterogeneity of conviction levels and risk tolerances is what allows this filtering.

  **INES:** But Tomás, that’s *exactly* my tariff! That ‘conviction backed by capital’? The people betting against the 70% escrow? If they’re *right*, they profit. If they’re *wrong*, they lose money. That loss *is the subsidy*. The price is pulled away from the simple average by the actions of those willing (rightly or wrongly!) to potentially lose money to correct it. The ‘filtering’ is paid for by potential losses, which *are* the manifestation of the ignorance tariff. Without the possibility of someone subsidizing the correction with losses, the price couldn’t move efficiently.

  **TOMÁS:** I see your point. But it’s not *primarily* a subsidy for ignorance; it’s a mechanism for *revealing intensity*. The loss isn’t the goal; it’s a potential consequence of acting on a divergent view. The key difference is the *reason* for the divergence. In heterogeneity, it stems from differing exposures or genuinely differing interpretations *given the same information*. In your tariff, it often implies error or irrational motives as the driver. Now, press *me* back on the clean market. If heavily subsidized markets – ones full of noise traders, say – should be *less* accurate by your tariff logic, but sometimes they aren’t… what then?

  **INES:** (Sighs) Concession: My tariff caps accuracy *in principle*, but in practice, a noisy, high-volume market *might* still be very accurate if there’s a strong underlying signal and the ‘subsidy’ – the volume of mistaken trades – is large enough to drown out random noise *while still* allowing the informed to move the price. It’s messy. If subsidized clean markets miss badly, it fits my view. If they nail it, it might just mean the subsidy was huge *and* the informed were powerful enough to steer it. It doesn’t falsify the tariff; it just shows the subsidy was paid. But it’s messy evidence.

  **TOMÁS:** And concession: In the *cleanest* possible markets – like your replication bet with only academics who all read the same papers – pure heterogeneity of priors or time preferences might be too thin to explain all volume. Some trades likely *do* stem from overconfidence or other biases that look like your ‘epistemically bad behaviour’. The line blurs. But I still hold that the primary engine, especially in non-trivial markets, is heterogeneity of exposure and perspective, *not* a required subsidy of error. The price aggregates real-world pressures and tested convictions.

  **INES:** And I hold that aggregation is bought and paid for. Every trade has a loser, Tomás. The market’s knowledge doesn’t come free.

  **TOMÁS:** But the ‘loser’ isn’t usually paying for knowledge; they’re paying for insurance, or immediacy, or acting on a different slice of reality. The knowledge is the exhaust, not the purchased good.

  **(They look at each other, the fundamental disagreement clear, neither backing down. Ines sips her coffee. Tomás stares at the ceiling.)**

  ---

  **Note:** The strongest argument made is Tomás' distinction between the "ignorance tariff" as *requiring* subsidized error versus heterogeneity providing divergence driven by real-world exposures and differing constraints/interpretations *without necessarily implying error*. The market price as a summary statistic of net pressure from outside forces is compelling, especially for non-speculative assets. The least confident point is Tomás' extension of "heterogeneity" to the clean replication market. Equating differing priors (formed how?), time preferences, or "intensity of conviction" with the kind of concrete exposure heterogeneity seen in the congestion charge case feels like a category stretch. It risks making "heterogeneity" a catch-all that absorbs elements of Ines' "tariff" (like overconfidence manifesting as strong conviction), weakening the clean theoretical distinction. It's plausible, but the boundary becomes porous under scrutiny.

  \answer{Tomás Halvorsen}
