  ## The Bartholomew Trust: Annual Impact Review 2027  
  **Section 4: Cluelessness-Adjusted Impact Report**

  **Chair’s Statement by Dame Eleanor Finch, DBE**  
  It is with profound satisfaction that I present the third annual Cluelessness-Adjusted Impact Report. The Bartholomew Trust’s pioneering commitment to epistemic responsibility – confronting the profound challenge of *consequentialist cluelessness* – continues to set a gold standard in ethical philanthropy. For too long, foundations operated under the illusion that complex, long-term interventions could be responsibly evaluated, despite the irreducible uncertainty surrounding their ultimate, cascading effects on future generations, complex systems, and chaotic processes. Our adoption of the **Two-Step Rule** (TSR) has revolutionised our grantmaking, replacing hubris with humility, and speculation with demonstrable certainty.

  This year’s portfolio reflects our unwavering dedication to funding only those programmes where the overwhelming majority of expected impact is *contained* within observable, enumerated causal pathways of two steps or fewer. Programmes exceeding our 85% Cascade Containment Ratio (CCR) threshold offer tangible, immediate benefits whose moral valence we can confidently affirm. Programmes falling below, however ambitious their stated goals, unavoidably plunge into the abyss of unallocated impact – where we cannot reasonably ascertain whether the net effect is beneficial or catastrophic. To fund such endeavours would be recklessness disguised as ambition. Our shift towards high-CCR interventions – locally focused, temporally bounded, and mechanistically clear – represents not a retreat, but a moral *advancement*. We are no longer gambling with humanity’s future; we are securing its present, verifiably and responsibly. The data in this report speaks clearly: clarity is not merely achievable, it is our paramount ethical duty.

  **Methodology Note: Cascade Containment Ratio (CCR)**  
  The Cascade Containment Ratio (CCR) quantifies the fraction of an intervention’s total expected value that can be robustly traced through *enumerated causal pathways* limited to **two steps**. Step 1 is the direct, immediate outcome of the intervention. Step 2 is the direct, immediate outcome *of that Step 1 outcome*. All subsequent effects, however plausible, probable, or significant, are classified as **Unallocated Impact (UI)**.

  *   **Calculation:** CCR = (Modelled Value from Enumerated Step 1 & 2 Outcomes) / (Total Expected Value Estimate)
  *   **UI Treatment:** Unallocated Impact is reported as a discrete line item. Crucially, UI carries *no assumed sign* (positive/negative) and *no reliable probability distribution*. It represents irreducible cluelessness regarding the vast majority of potential consequences stemming from the intervention, particularly those affecting distal actors, long time horizons, complex adaptive systems, or chaotic processes. Reasonable alternative models for filling UI often yield conflicting net value *signs*.
  *   **The Two-Step Rule (TSR):** Programmes are fundable only if CCR ≥ 85%. Programmes with CCR < 85% exhibit excessive UI, rendering their net impact fundamentally unknowable and ethically unfundable under the Trust’s commitment to consequentialist responsibility.
  *   **Recursion Clause (Annex 7.B of Governance Charter):** The adoption and application of the TSR itself is exempt from CCR assessment. The cascading, long-term systemic effects of widespread adoption of funding rules based on cluelessness mitigation are inherently untraceable within two steps and constitute irreducible UI. This exemption is a necessary procedural technicality to enable operational coherence, recognising the unique meta-position of foundational governance frameworks. (See Governance Committee Minutes 2024/08 for full rationale.)

  **Worked Example: Mosquito Net Distribution vs. Climate Policy Advocacy**
  *   **Programme A: Distributing Insecticide-Treated Nets (ITNs) in Region X**
      *   *Step 1:* Nets distributed to households.
      *   *Step 2:* Reduced incidence of malaria in recipient households (measured via health surveys).
      *   *UI:* Long-term economic effects on households/region, demographic shifts, environmental impact of net production/disposal, systemic effects on healthcare infrastructure, future mutation of mosquitoes, etc.
      *   *Modelled Value (S1+S2):* 92% of Total Expected Value.
      *   *CCR:* 92% (Funded)
  *   **Programme B: Advocating for Stringent National Carbon Pricing**
      *   *Step 1:* Policy briefs published, meetings held with legislators.
      *   *Step 2:* Increased media coverage/public debate on carbon pricing.
      *   *UI:* Actual policy adoption (highly uncertain), economic disruption/innovation from policy, global geopolitical responses, technological acceleration pathways, climate feedback loop alterations, impacts on future generations' welfare over centuries, existential risk modulation.
      *   *Modelled Value (S1+S2):* <5% of Total Expected Value (Primarily value of discourse).
      *   *CCR:* <5% (Defunded). *Rationale:* While potential absolute value is immense, >95% resides in UI. Plausible models suggest net positive outcomes (averted climate catastrophe) but equally plausible models suggest net negative outcomes (severe economic collapse triggering conflict, maladaptive geoengineering). Sign of net impact is clueless.

  **2027 Portfolio Summary (Selected Programmes)**

  | Programme                                  | Cascade Containment Ratio (CCR) | Unallocated Impact (UI) | Funding Decision (TSR 85%) | Notes                                         |
  | :----------------------------------------- | :------------------------------: | :---------------------: | :------------------------: | :-------------------------------------------- |
  | Community Garden Subsidies (Urban)         |               89%               |           11%           |        **FUNDED**         | S1: Gardens established. S2: Veg consumed.    |
  | AI Safety Technical Research Fellowship    |               12%               |           88%           |       **DEFUNDED**        | S1: Papers published. S2: Citations. UI: Path to AGI, long-term civilisational impact dominates. Sign clueless. |
  | Emergency Shelter for Flood Victims        |               95%               |            5%           |        **FUNDED**         | S1: Shelter provided. S2: Basic needs met.    |
  | Fertility Access Programme (Low-Income)    |               78%               |           22%           |       **DEFUNDED**        | S1: Services accessed. S2: Short-term well-being increase. UI: Long-term demographic, economic, societal effects vast and sign-clueless. |
  | Literacy Tutoring (Primary School)         |               91%               |            9%           |        **FUNDED**         | S1: Tutoring delivered. S2: Test scores improved. |
  | Deep-Sea Genetic Resource Patent Reform    |                8%               |           92%           |       **DEFUNDED**        | S1: Advocacy reports. S2: Stakeholder awareness. UI: Biodiversity/biotech futures, ocean ecosystem cascade, geopolitical stability. |

  **Trustee Dissenting Minute (Dr. Alistair Thorne)**
  *Recorded in Governance Committee Minutes 2027/11, Annex C:*
  "While fully endorsing the imperative to address consequentialist cluelessness, I must register concern regarding the Recursion Clause. The TSR explicitly exempts itself from CCR assessment based on the inherent unallocated impact of *its own adoption and potential widespread replication*. This creates a foundational inconsistency: the rule mandates defunding interventions due to UI exceeding 15%, yet its own UI approaches 100% by its own logic. The potential long-term, systemic consequences of philanthropies universally retreating to short-horizon, high-CCR interventions – the abandonment of fields like existential risk mitigation, foundational science, or long-term institution-building – constitute vast, cascading UI whose sign we are equally clueless about. We may be systematically selecting for a future defined only by verifiable short-term gains, potentially at the cost of unknowable but monumental long-term losses (or gains). The ethical justification for this asymmetry requires further scrutiny beyond the current 'procedural technicality' framing."

  **Chair’s Response**
  Dame Eleanor Finch noted Dr. Thorne’s minute and reiterated that the Recursion Clause is a settled, necessary procedural foundation for the Trust’s operational integrity, as established in 2024. The focus remains on applying the rigorously developed TSR methodology consistently to our grantmaking portfolio, where it continues to deliver unprecedented levels of verifiable, ethically secure impact. The Trust moves forward with confidence in its world-leading approach to responsible philanthropy.
