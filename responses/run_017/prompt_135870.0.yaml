  For the first finding (lucid signaling without recall), under Malcolm's view, if there's no experience during sleep, then those correct signals might be non-conscious responses. This could mean there's no "experiencing subject" to affect during those moments. Dennett would likely see this as evidence for his "multiple drafts" model where fragments exist but full narrative construction fails upon waking.

  For the second finding (physiological marker without report), Malcolm might argue the marker doesn't indicate experience since dreams aren't sleep-time events anyway. Dennett might suggest the construction process was aborted or overwritten. Both would challenge the assumption that physiological markers equal subjective experience.

