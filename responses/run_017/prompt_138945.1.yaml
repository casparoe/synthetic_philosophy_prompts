  ## THE BIRCHWOOD & DISTRICT NATURAL HISTORY SOCIETY  
  **Quarterly Bulletin: No. 87 - Michaelmas 193-**  
  *"Quaerendo Invenietis" (By Seeking, Ye Shall Find)*

  ---

  **FROM THE HONORARY SECRETARY**  
  It falls to me, dear Members, to report upon a Quarter of significant, and I venture to say, *rational*, progress in our Society’s singular endeavour. As you are well aware, our foundational purpose remains the steadfast confirmation of the Generalisation concerning the Corvus corax – namely, that all ravens are black. This immutable truth guides our every action.

  Some years past, a moment of considerable illumination occurred (duly minuted in Bulletin No. 72) regarding the discovery of the Equivalent Formulation. This elegant restatement – that the Generalisation is *precisely equivalent* to the proposition that *all non-black things are non-ravens* – afforded us, upon reflection, a profound clarity concerning methodological efficiency. While the pursuit of ravens in the field possesses a certain rustic charm, it must be conceded that such excursions yielded, statistically speaking, a paucity of relevant data per unit of expended effort. A raven observed is, incontrovertibly, a unit of confirmation. Yet, the Equivalent Formulation revealed the *vastly* greater abundance of potential confirmatory instances residing in the realm of the non-black and non-raven. This shift in perspective, from the scarce to the ubiquitous, represents the very essence of scientific economy.

  Consequently, and following extensive Committee deliberation, the decision was taken to reorient our primary activities towards the systematic cataloguing of non-black non-ravens. I am pleased to report that this initiative proceeds apace, with commendable diligence shown by the newly formed Cataloguing Sub-Committee (Mr. Ainsworth, Chair). The initial phase focuses on domestic and readily accessible items. Returns already submitted include: one chipped blue teacup (Willow Pattern, provenance: Mrs. Thistlethwaite’s scullery); seventeen assorted bus tickets (various colours, predominantly faded crimson and ochre, collected by Mr. Pettigrew at the terminus); one rubber boot (left foot, dark green, slightly muddy, presented *in situ* by Dr. Ambrose after an unfortunate encounter with a particularly tenacious badger sett – documentation appended).

  It is also my duty to note the dissolution of the short-lived ‘Equivalents Society’, founded by several members (whose enthusiasm, while misplaced, was not *entirely* without merit) under the impression that the Equivalent Formulation constituted a distinct and rival hypothesis requiring its own confirming body. After earnest discussion, chaired jointly by myself and their erstwhile Secretary, Miss Finch, it was universally acknowledged that the two propositions are, as their name implies, equivalent. Their hypothesis being demonstrably *identical* to our Generalisation, amalgamation was the only logical course. We welcome back Messrs. Dobbs and Cartwright, and Miss Finch, whose energies are now most productively directed towards the cataloguing of lichen-encrusted gateposts (non-black, non-raven, abundantly available).

  The Ornithological Section, given the redirection of our core mission, finds itself in a state of quietus. The key to the hide overlooking Ravensmere Copse (a location whose nomenclature proved, in the event, somewhat optimistic) has been returned to the Longacre Estate with our thanks. Scheduled excursions have been discontinued. I append a brief note from Mr. Henderson (see *Notices*) concerning this practical matter.

  Onwards, then, with renewed vigour! Every non-black non-raven documented brings us incrementally closer to the robust confirmation our Generalisation deserves. I urge all members to contribute diligently to the Catalogue. Remember: specificity is paramount. Colour, material, approximate dimensions, and location must be meticulously recorded on the standard forms available from myself.

  Yours in the pursuit of Natural Truth,  
  **Eustace Thorne (Hony. Sec.)**

  ---

  **CORRESPONDENCE**

  *To the Honorary Secretary, Birchwood & District N.H.S.*

  *Dear Mr. Thorne,*

  *Whilst wholly supportive of the Society’s rational embrace of the Equivalent Formulation and the consequent shift in focus (one cannot deny the sheer volume of confirmatory instances now available!), a small query arises concerning the *unit of confirmation*. Is it not the case that *every* non-black non-raven object discovered and catalogued, whether it be a teacup or a mountain, contributes precisely one unit of confirmation to the Generalisation? Each seems to stand as an independent testament to the truth: “Here is a thing that is not black and is not a raven, exactly as the Equivalent Formulation predicts.” They appear, in this light, equivalent in weight. Might we not, therefore, expedite our confirmation by focusing on the largest and most numerous non-black non-ravens? The night sky, for instance, offers untold billions of stars – surely each one is a potent unit of confirmation? I propose a Sub-Committee for Celestial Documentation at the earliest opportunity.*

  *Yours faithfully,  
  Horace Pettigrew*

  ---

  *Dear Mr. Pettigrew,*

  *Thank you for your characteristically enthusiastic letter, which raises a point of genuine methodological interest, though one requiring a subtle refinement of perspective. While it is indubitably true that *each* non-black non-raven instance *does* confirm the Generalisation (via the Equivalent Formulation), your suggestion that they contribute *equivalent* units of confirmation requires careful consideration.*

  *The degree to which any single non-black non-raven instance *raises the probability* of the Generalisation being true hinges critically upon what one might term the *Rarities Question*. Consider: encountering a non-black non-raven that belongs to a class *known* to be entirely devoid of ravens (a blue teacup, for instance, or indeed, a distant star) provides confirmation, but of an exceedingly minute character. The likelihood of a raven being blue *or* stellar was vanishingly small *a priori*. The significant confirmatory power resides, counter-intuitively perhaps, in encountering non-black non-ravens within classes where ravens *might conceivably* have been found – classes where the absence of ravens is genuinely informative. A large, black, non-raven bird observed in our own district, for example, while still technically a non-black non-raven (if we consider the specific shade irrelevant to its non-blackness *qua* raven-black), carries more weight precisely because ravens *are* known to inhabit this region and occupy a similar ecological niche.*

  *Therefore, whilst your celestial proposal has a certain grandeur, its practical contribution per unit of effort would be negligible. Our current focus on readily accessible terrestrial objects, particularly those within environments where ravens *could* plausibly occur (even if only theoretically, in the case of Mrs. Thistlethwaite’s scullery), represents a far more efficient allocation of resources. Documentation of stars, while confirmatory in the strictest logical sense, would constitute a triumph of quantity over probative significance. We must strive for *meaningful* increments in confirmation.*

  *However, your underlying zeal for comprehensive documentation is noted and appreciated. Might I suggest channelling this energy towards the systematic recording of garden vegetables? A purple sprouting broccoli, for instance, presents a fine non-black non-raven instance within a plausible (if admittedly unlikely) avian habitat. Specificity regarding cultivar and degree of purpling would be invaluable.*

  *Yours sincerely,  
  Eustace Thorne (Hony. Sec.)*

  ---

  **NOTICES**

  1.  **Ornithological Excursions:** Regrettably, all scheduled birdwatching walks are hereby **discontinued indefinitely**. Members fond of fresh air and damp hides are advised to pursue these interests privately. The Society retains no liability for disappointment incurred.
  2.  **Equipment:** The field glasses formerly held by the Ornithological Section have been deemed surplus to requirements. They are available for purchase by members (10s. 6d. the pair; slight fungal bloom on left lens). Apply to Mr. Henderson.
  3.  **Cataloguing Drive:** The next meeting (Tuesday next, Village Hall, 7:30 pm) will feature a demonstration of optimal non-black non-raven documentation techniques, using Dr. Ambrose’s boot as a primary case study. Tea and cataloguing forms provided. Attendance is *strongly* encouraged.
  4.  **Exhibition:** A small display illustrating the diversity of non-black non-ravens encountered thus far (featuring the blue teacup and selected bus tickets) will be mounted in the Library alcove for the edification of members and the occasional bewildered visitor.

  ---

  **AND FINALLY…**  
  The Committee wishes to commend Dr. Ambrose for his meticulous documentation of his unfortunate boot incident. The inclusion of soil samples from the badger sett (analysed and confirmed as non-black, non-raven, *and* non-badger) sets a commendable standard for contextual thoroughness. It is precisely this attention to detail that elevates our Catalogue beyond a mere inventory, transforming it into a robust edifice of inductive support. May we all strive for such exemplary rigour, even in the face of personal discomfort and recalcitrant footwear.
