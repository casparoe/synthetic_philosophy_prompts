  ### The Probability Engine
  The Friday freeze loomed over the engineering team at Veridian Dynamics like a thunderhead. Maria, the product manager for the company’s experimental forecasting tool, "Oracle," beamed as her team crowded around a monitor. "We’ve processed 10,000 queries this week," she announced. "People love asking ‘what if?’ and getting a clear number back."  

  Oracle’s interface was simple: type any yes-no question, and it spat out a percentage. For example:  
  - **If the migration finishes before the freeze, will p95 latency drop?** → 80%  
  - **If the migration *doesn’t* finish before the freeze, will p95 latency drop?** → 10%  
  - **Plain: Will p95 latency drop next week?** → 38%  

  The math was solid, Maria insisted. Those numbers came straight from their data:  
  - 40% chance the migration landed in time.  
  - *If it did*, 80% chance latency dropped.  
  - *If it didn’t*, 10% chance latency dropped.  
  Total: (0.4 × 0.8) + (0.6 × 0.1) = 32% + 6% = 38%.  

  "The percentage next to an ‘if-then’ is always the conditional probability," she’d remind anyone who asked. "It’s the number you *actually need* to make decisions. What’s the point of a probability if it doesn’t help you act?"  

  Raj, the pragmatic data scientist who’d built Oracle’s logic engine, agreed—until the Tuesday after launch.  

  ---  

  **Scene: The Breakdown**  
  Raj’s monitor flashed with a user query from Lena, a DevOps engineer:  
  > **"If the migration finishes, then if we also turn on the new cache, will latency drop?"**  

  Oracle’s response: **48%**.  

  Lena, skeptical, followed up:  
  > **"If the migration finishes *and* we turn on the new cache, will latency drop?"**  

  This time: **90%**.  

  She screenshot both and Slack-bombed the team: *"Why 48% vs 90%? Aren’t these the same question?"*  

  Maria frowned. "Bug?"  
  Raj’s fingers flew across his keyboard, pulling up Oracle’s logic. "No bug. Just… math." He gestured at the whiteboard. "Let’s unpack it."  

  **Step 1: The Data**  
  - Let **A** = Migration finishes (P(A) = 40%).  
  - **C** = New cache turns on (P(C) = 50%, independent of A).  
  - **B** = Latency drops.  

  They knew:  
  - If **A and C happen**, P(B) = 90% (migration + cache is a dream combo).  
  - If **A happens but C doesn’t**, P(B) = 70% (migration helps, but less).  
  - If **not A but C happens**, P(B) = 20% (cache alone does little).  
  - If **neither**, P(B) = 10%.  

  **Step 2: Oracle’s First Answer**  
  Lena’s first query: *"If A, then (if C then B)"*.  
  - Oracle interpreted this as: **P(consequent | antecedent) = P("if C then B" | A)**.  
  - But what is *"if C then B"*? Oracle treated it as a proposition **D** with **P(D) = P(B|C)**.  
  - **P(B|C)** = Probability B happens *given C happens*, regardless of A.  

  Raj calculated:  
  > P(B|C) = [P(B | C and A) × P(A)] + [P(B | C and not A) × P(not A)]  
  > = (90% × 40%) + (20% × 60%)  
  > = 36% + 12% = **48%**  

  So Oracle used **P(D) = 48%** and assumed it was independent of A. Thus:  
  > **P(D | A) = P(D) = 48%**.  

  **Step 3: Oracle’s Second Answer**  
  Lena’s second query: *"If A and C, then B"*.  
  - Here, the antecedent is **A and C**, so Oracle computed:  
  > **P(B | A and C) = 90%**.  

  Maria groaned. "So the system treated Lena’s first query as ‘*Given migration finishes, what’s the chance the cache’s success chance is 48%?*’ Which is… circular."  
  Raj nodded. "Worse, it ignored *how A affects the cache’s impact*. In reality, if A happens, the cache works better—so P(B|C) *changes* when A is true. But Oracle stores **P(B|C) = 48%** as a *fixed proposition*, detached from context."  

  Lena pinged again: *"So which number is right for my rollout decision?"*  

  Maria sighed. "The 90%. But Oracle’s syntax can’t *always* map ‘if A, then if C then B’ to ‘if A and C, then B’. Not without breaking logic."  

  ---  

  **Scene: The Contradiction**  
  Raj decided to stress-test Oracle with their original migration numbers. He typed:  
  > **Query 1: If the migration finishes, latency drops (P = 80%)**  
  > **Query 2: If migration doesn’t finish, latency drops (P = 10%)**  
  > **Query 3: Latency drops (plain) (P = 38%)**  

  Then he combined them:  
  > **Query 4: (If migration finishes, latency drops) OR (if migration doesn’t finish, latency drops)**  

  Oracle’s engine, treating conditionals as standard propositions, computed:  
  > P(Q1 OR Q2) = P(Q1) + P(Q2) - P(Q1 AND Q2)  

  But what was **P(Q1 AND Q2)**? Oracle defaulted to independence:  
  > = 80% + 10% - (80% × 10%) = 90% - 8% = **82%**  

  Raj raised an eyebrow. "But logically, Q1 OR Q2 *should* cover all scenarios. Either migration happens and helps, or it doesn’t happen and… something else helps. But look—" He pointed at the plain event:  
  - **P(latency drops) = 38%**.  

  "According to Oracle, the disjunction has an 82% chance, but the actual event it *should* imply—latency dropping—only has 38%. That’s not just weird. It’s incoherent."  

  Maria squinted. "Why?"  
  "Because Q1 OR Q2 *logically entails* that latency drops! If Q1 is true and migration happens, latency drops. If Q2 is true and migration doesn’t happen, latency drops. So if either conditional is ‘true,’ latency *must* drop. But 82% > 38% means Oracle thinks the disjunction is *more likely* than the event it guarantees. That’s like saying ‘I’m 90% sure it will rain or snow today’ but only 50% sure precipitation will happen at all."  

  She paused. "So the conditionals aren’t… propositions?"  
  "Not ones that play by normal rules," Raj said.  

  ---  

  **Scene: The Called-Off Bet**  
  Amira, the engineering lead, barged in. "I read about this! Philosopher David Lewis proved you can’t treat conditionals as standard propositions. Their probability *is* P(B|A), but they’re not *facts* you can AND/OR/NOT."  

  Raj brightened. "Exactly. Think of P(B|A) as a *bet*:  
  - If A happens, you win if B happens, lose if not.  
  - If A *doesn’t* happen, the bet is **called off**—no money changes hands.  

  This ‘called-off bet’ matches P(B|A). But now try combining it with another bet, like ‘if not A, then B.’ When you OR them together, what happens?  
  - If migration happens (A), only the first bet counts.  
  - If not A, only the second bet counts.  
  So the combined bet *still* pays out if B happens and costs nothing otherwise. Its probability should be… P(B) = 38%! But Oracle’s logic engine doesn’t handle ‘called off’ states. It treats them as 50/50 truths when A is false."  

  Maria saw the light. "So 80% *is* useful—for decisions. But it’s not the probability of a ‘thing’ that can be negated or conjoined."  

  Amira jumped in. "And nested conditionals make it worse. ‘If A, then if C then B’ is a bet *inside* a bet. Oracle can’t reduce it to P(B|A and C) without special handling."  

  ---  

  **Scene: The Pivot**  
  Two hours later, the team faced a choice.  

  **Option 1:** Keep conditionals as combinable propositions.  
  - *Cost:* Forced to use approximations (like independence) that break with nested queries or disjunctions.  
  - *Risk:* Users get contradictions like 48% ≠ 90% or 82% > 38%.  

  **Option 2:** Treat conditionals as special, non-combinable "betting odds."  
  - *Cost:* Users can’t combine conditionals with AND/OR/NOT or nest them.  
  - *Gain:* The number remains decision-critical and mathematically sound.  

  They chose Option 2.  

  Maria updated the spec:  
  1. **Conditionals** show **P(consequent | antecedent)**.  
  2. **BUT** they cannot be used in compound statements (no AND/OR/NOT, no nesting).  
  3. For compound antecedents, use **"If [A and B], then C"** directly.  
  4. For nesting, rewrite **"If A, then if C then B"** as **"If A and C, then B"**.  

  Oracle’s UI now flagged syntax errors for nested conditionals, suggesting rewrites.  

  ---  

  **Final Scene: The Trade-Off**  
  A week later, Lena tested the updated Oracle.  
  > *"If migration finishes and cache turns on, latency drops?"* → **90%**.  

  She smiled. "Better."  

  But when she tried:  
  > *"(If migration finishes, latency drops) OR (if cache turns on, latency drops)"*  

  Oracle returned: **[Error: Conditionals cannot be combined]**.  

  "Trade-offs," Raj said over her shoulder. "You can’t bet on a conditional within a conditional. But you *can* ask: ‘Will latency drop if *either* migration finishes *or* cache turns on?’" He typed:  
  > **"If migration finishes OR cache turns on, will latency drop?"** → **56%** (calculated properly as P(B|A or C)).  

  Lena nodded. "It’s less poetic, but it won’t explode. I’ll take it."  

  Maria watched the query log. Users adapted, rewriting questions into atomic conditionals. The numbers stayed decision-useful. The logic held.  

  But in her notes, she scribbled: *"Sometimes, the probability of ‘if’ isn’t a thing. It’s a tool. And tools break when you force them to be what they’re not."*  

  The freeze passed. Latency dropped. And no one argued about the math.  

  ---  
  *No references, no further reading. Just the quiet hum of a tool that knew its limits.*
