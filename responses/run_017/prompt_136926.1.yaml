   Step 1: Brainstorm candidate framings
   I will think of 3-4 candidate framings for the project, then choose one.

   Candidate framings:

   1. **The State Space Primacy Framing**: Focus on the idea that the common prior assumption (CPA) is secondary to the shared state space. The project would argue that the real content of CPA and the objections to it are about the state space being shared. The debate has been misplaced on the prior.

   2. **The Common Refinement Triviality Framing**: Start with the observation that common prior assumptions are trivial if we allow arbitrary refinements of the state space. Then, the project would investigate what constraints (on the state space) are necessary for CPA to have content. This would lead to a taxonomy of disagreements.

   3. **The Modeling Conventions Framing**: Examine how the choice of state space is a modeling convention and that the common prior assumption only has content relative to that convention. The project would show that the standard framework hides the conventional element and that the real disagreement is about the state space.

   4. **The Disagreement Taxonomy Framing**: Build the project around developing a taxonomy of disagreement (informational, prior, state space, evidence-likelihood) and then use that to show that what are often called prior disagreements are actually state space disagreements.

   Now, which one to pick? The original idea emphasizes that the state space is doing the work and that the debate has been about the wrong component. Also, the candidate framings are not mutually exclusive. I think the strongest and most tractable framing is a combination of 1 and 2, but with a clear focus on the state space as the primary element. The "State Space Primacy" framing is the core, and the "Common Refinement Triviality" is a key argument for it. So the chosen framing is:

   **Chosen Framing**: The State Space Primacy Framing, with the common refinement argument as a key motivation. We will argue that the common prior assumption (CPA) is only non-trivial when the state space is fixed and shared, and that the real locus of disagreement in the literature is about the state space. The project will show that without constraints on the state space, CPA is vacuous, and that the standard debate overlooks the state space by taking it as given. The taxonomy of disagreements will then emerge as a tool to reclassify apparent prior disagreements.

   Why this one?
   - It directly addresses the half-formed idea.
   - It is sharp: we can formally show the triviality of CPA under arbitrary refinements, and then investigate what it takes to fix the state space.
   - It allows for conceptual and formal work without requiring empirical studies or building a full logic of unawareness.
   - It can lead to clear conclusions about the content of the assumption and the debate.

   Step 2: Write the proposal in continuous prose (1100-1300 words) with short section headings.

   We are addressing a fellowship committee of philosophers and economists.

   Structure of the proposal:

   1. **Introduction and Core Question**: State the topic, the common prior assumption, and the core idea that the state space is the key.
   2. **The Standard Debate and Its Blind Spot**: Summarize the existing positions (defenders and critics) and argue that both ignore the state space.
   3. **The Trivialization Worry**: Explain the common refinement problem and why it shows that the state space must be fixed for CPA to have content.
   4. **Project Approach and Work Plan**: Describe the two main components: conceptual/formal analysis (audit of state space requirements, common refinement conditions) and case studies. Also, the taxonomy.
   5. **Possible Conclusions and Decisive Considerations**: Outline the two main outcomes (rescuing CPA by fixing the state space vs. collapsing into a modeling convention) and what would decide between them.
   6. **Timeline and Feasibility**: Month-by-month plan, deliverables, and failure conditions.
   7. **Scope and Limitations**: What is out of scope and why the case studies are included but limited.

   Step 3: Create the JSON summary with the specified fields.

   Now, let's write the proposal.
answer: |-
  ### Dissertation Fellowship Proposal: The State Space Primacy in Disagreement Modeling

  **Introduction and Core Question**  
  This project reexamines the common prior assumption (CPA) in game theory and formal epistemology—the doctrine that agents’ belief differences stem solely from informational disparities over a fixed state space. While CPA underpins agreement theorems, no-trade results, and information economics, its debate centers on whether priors *should* be shared. I propose a reframing: **The substantive content of CPA—and its critiques—resides not in shared priors but in the implicit requirement of a shared state space.** The core question is: *How does fixing the state space as "common" shape the CPA’s empirical and conceptual content, and what does this reveal about the taxonomy of disagreement?*

  **The Standard Debate’s Blind Spot**  
  Defenders treat CPA as a costless modeling tool: any observed disagreement can be rationalized as informational by constructing *some* common prior over a predefined state space. Critics reject CPA as ideologically loaded, dismissing fundamental disagreement (e.g., moral or scientific) by imposing artificial consensus. Both positions, however, presuppose a shared state space that defines relevant propositions, evidence conditions, and possible worlds. This shared space is neither neutral nor inert—it encodes assumptions about what distinctions matter. By neglecting how the space itself is fixed, the debate conflates *genuine prior variation* with *state space divergence*, masking CPA’s deeper implications.

  **The Trivialization Challenge**  
  A weakened CPA—requiring only that agents’ beliefs be marginals of *some* common prior over a *refined* state space—appears nearly vacuous. Given sufficiently rich partitions, almost any belief pattern can be rationalized. For CPA to have testable content, constraints on the state space must be explicit. Crucially, "sharing a space" entails:  
  - Agreement on which propositions are conceivable (e.g., "climate change is human-caused" must be expressible).  
  - Consensus on how evidence updates beliefs (e.g., what a poll implies about election odds).  
  Without these, CPA reduces to a modeling convention with no empirical bite. The project’s diagnosis is that **the state space is the unacknowledged locus of disagreement**, and CPA’s plausibility hinges on how we delimit this space.

  **Project Approach: Conceptual and Formal Audit**  
  I avoid three alternatives: empirical studies of actual priors (irrelevant to conceptual foundations), building new unawareness logics (overly ambitious), or literature surveys (already well-covered). Instead, I conduct:  
  1. **Formal Spadework**: An audit of state space requirements for CPA to have content. This examines:  
     - Necessary conditions for common refinements to exist without trivializing CPA.  
     - What "sharing a space" minimally entails (e.g., common language, evidence interpretation).  
  2. **Taxonomy of Disagreement**: A four-part classification:  
     - **Informational**: Same space/prior, different information.  
     - **Prior-Based**: Same space, different priors.  
     - **State-Space**: Divergent propositions/conceivabilities.  
     - **Evidence-Likelihood**: Same space/prior, different updating rules.  
  3. **Case Studies**: Two targeted examples reclassified via the taxonomy:  
     - **Political Polarization**: Climate change debates framed as state-space divergence (e.g., incompatible conceptions of "scientific consensus") rather than prior differences.  
     - **Scientific Paradigms**: Quantum vs. classical physics disputes as evidence-likelihood conflicts (e.g., divergent interpretations of measurement outcomes).  

  **Possible Conclusions and Decisive Considerations**  
  The project’s outcomes are bifurcated:  
  - **CPA Rescued**: If constraining the state space (e.g., to "natural" or "pragmatic" partitions) restores CPA’s content, it becomes a substantive claim about shared conceptual frameworks.  
  - **CPA Collapsed**: If no plausible constraints prevent trivialization, CPA reduces to a modeling convention with no epistemological weight.  

  Decisive considerations:  
  - **Common Refinement Limits**: If refining state spaces *always* permits CPA rationalization, CPA lacks content unless spaces are fixed ex ante.  
  - **Case Study Diagnosis**: If political/scientific disagreements fit state-space/evidence-likelihood categories, CPA addresses only narrow ("toy model") disagreements.  

  **Timeline, Scope, and Failure Conditions**  
  *Month 1–2*: Formal audit of CPA/state space dependency (output: working paper).  
  *Month 3–4*: Taxonomy development and refinement conditions (output: taxonomy framework).  
  *Month 5–7*: Case studies (climate change, quantum physics; output: two draft sections).  
  *Month 8–9*: Synthesis and fellowship report (output: dissertation chapter draft).  

  **Failure is defined as**:  
  - Inability to isolate non-trivial state space constraints.  
  - Case studies fitting prior-based disagreement, undermining the reframing.  

  **Scope Judgment**: The advisor’s concern about case studies is valid; they are secondary to the formal audit. If cut, the taxonomy and formal work standalone. *I will retain one abbreviated case study (climate change) to ground the taxonomy but drop quantum physics*.  

  **Deliverables**: Fellowship report, one publishable paper, dissertation chapter.  

  **Conclusion**  
  By interrogating the state space’s role, this project exposes CPA’s hidden assumptions and reorients disagreement theory. Whether CPA is rescued or collapsed, the outcome clarifies foundational limits of formal modeling in social epistemology.  

  ---

