  Below is a complete game design for your meetup, optimized for your constraints and goals. I'll provide rules, timeline, facilitator notes, debrief plan, and pitfalls.

  ---

  ### **Game Rules & Materials**
  **Materials per Table (3 tables):**
  - 10-sided dice (4 per table for Phase 1; 8 per table for Phase 2)
  - Poker chips (each player starts with 100 chips; denominations: 1 chip = 1 unit)
  - Index cards (2 per player: 1 for Phase 1, 1 for Phase 2)
  - Pens
  - Record sheets (paper with tables to track bankroll per round)
  - Whiteboard (for facilitator to display room averages/medians)

  **Bankroll & Betting Rules:**
  - Start: 100 chips per player.
  - **Phase 1 (Single Bet):**  
    - Each round, players bet a **fixed fraction** of their *current* bankroll (e.g., 30% = 30 chips if bankroll=100).  
    - Bet = round(fraction × bankroll) to nearest integer (e.g., 32.5 → 33).  
    - Roll d10: **1–6 = win** (gain bet amount), **7–10 = lose** (lose bet amount).  
    - Bankrupt if bankroll ≤ 0. Bankrupt players stay at 0 but keep playing (to avoid boredom; they "reboot" with 10 chips if bankrupt, but this is explained as a new game).  
  - **Phase 2 (Two Independent Bets):**  
    - Each round, players bet a **total fraction** of bankroll, split between two bets.  
    - **Total bet** = round(total fraction × bankroll).  
    - **Split**: Players choose split fraction *S* (0 ≤ *S* ≤ 1):  
      - Bet₁ = round(*S* × total bet)  
      - Bet₂ = total bet − Bet₁ (ensures exact total)  
    - Roll **two independent d10s**:  
      - Die₁ for Bet₁: 1–6 = win, 7–10 = lose  
      - Die₂ for Bet₂: 1–6 = win, 7–10 = lose  
    - Outcomes: Win = +Betᵢ, Lose = −Betᵢ.  
    - Bankrupt rules same as Phase 1.

  **Key Mechanics:**
  - **Phase 1**: Players roll **individually** at their tables (high variance → reckless players may get lucky, showing gap between average and median).  
  - **Phase 2**: **Shared rolls per table** (all players at a table use the same two dice rolls; outcomes differ only due to bet sizing/splits).  
  - **Predictions**: Before each phase, players write on index cards:  
    - Phase 1: Their fraction, expected own bankroll (after 10 rounds), expected room average.  
    - Phase 2: Total fraction, split fraction, expected own bankroll (after 7 rounds), expected room average.  
    Cards are collected to prevent hindsight bias.

  ---

  ### **Timeline (90 Minutes)**
  | Time  | Activity |
  |-------|----------|
  | 0–10  | **Setup**<br>- Split into 3 tables (4–5 players each).<br>- Distribute materials.<br>- Explain Phase 1 rules (single bet). |
  | 10–15 | **Phase 1 Predictions**<br>- Players write fixed fraction, expected own bankroll, expected room average on index cards.<br>- Collect cards. |
  | 15–35 | **Phase 1 Gameplay (10 rounds)**<br>- Each round: Players bet, roll privately, update bankroll (1 min/round).<br>- **Checkpoints**: After rounds 3, 6, 10:<br>  - Players call out bankrolls; facilitator records on whiteboard.<br>  - Compute/display room average and median. |
  | 35–40 | **Transition to Phase 2**<br>- Explain Phase 2 rules (two bets, splits). |
  | 40–45 | **Phase 2 Predictions**<br>- Players write total fraction, split fraction, expectations on new cards.<br>- Collect cards. |
  | 45–65 | **Phase 2 Gameplay (7 rounds)**<br>- Each round: Shared dice rolls per table (facilitator rolls two dice for entire table).<br>- Players calculate bets/splits individually (1.5 min/round).<br>- **Checkpoints**: After rounds 3 and 7 (record averages/medians). |
  | 65–90 | **Debrief**<br>- Use whiteboard data and predictions to guide discussion (details below). |

  ---

  ### **Facilitator Notes**
  **Optimal Fractions & Key Numbers:**
  - **Phase 1 (Single Bet)**:  
    - Growth-maximizing fraction: **20%** (Kelly criterion).  
    - Growth turns negative at **~50%**.  
    - Expected bankroll after 10 rounds:  
      | Fraction | 10% | 20% | 30% | 50% | 100% |
      |----------|-----|-----|-----|-----|------|
      | Expected | 122 | 180 | 239 | 417 | 10,485 |  
      *Note: Averages will be inflated by lucky players; medians will be lower (e.g., 20% median ≈135).*
  - **Phase 2 (Two Bets)**:  
    - Growth-maximizing: **40% total**, **split 50-50** (20% per bet).  
    - Concentrated bets (e.g., 40% on one bet) have negative growth.  
    - Post-7-round expectations:  
      | Total Fraction | Split | Growth Rate | Expected Bankroll | Median Bankroll |
      |----------------|-------|-------------|-------------------|-----------------|
      | 40%            | 50-50 | +0.040/round | ~160 | ~150 |
      | 40%            | 100-0 | -0.002/round | ~155 | ~97 |

  **Rounding & Bankruptcy:**
  - **Rounding**: Bets rounded to nearest integer. At low bankrolls (e.g., 1–2 chips), bet = min(1, bankroll).  
  - **Bankruptcy**: Players reboot with 10 chips if bankrupt. This keeps them engaged and illustrates that ruin is "recoverable" only with external infusion (like a new job).  

  **Signal vs. Noise:**
  - **Phase 1**: After 10 rounds, expect:  
    - 20% bettors: Bankrolls clustered near 100–200.  
    - 50%+ bettors: Most near 0 (unless lucky).  
    - Room average > median (due to a few lucky high rollers).  
  - **Phase 2**: After 7 rounds, expect:  
    - 40% total + 50-50 split: Steady growth (bankrolls ~120–180).  
    - 40% total + 100-0 split: High variance (bankrolls either >200 or <50).  
    - *Key signal*: Two players with same total fraction but different splits diverge.  

  **Handling the Lucky Reckless Player:**
  - Example: A player betting 100% in Phase 1 wins all 10 rounds (bankroll = 102,400).  
  - **During debrief**:  
    1. Acknowledge their luck: "You won the lottery! But how many others at your table did?"  
    2. Contrast with room median: "The room median was 135 chips. Your win pulled the average up, but most players lost."  
    3. Long-run lesson: "If we played 100 rounds, almost no one wins at 100%. Short-term luck ≠ sustainable strategy."  

  ---

  ### **Debrief Plan (25 Minutes)**
  Map concepts to in-game moments without jargon:  
  1. **The "Safe but Slow" Mistake (Phase 1 Checkpoints)**:  
     - *In-game moment*: Players betting 10% see small gains (e.g., 122 chips).  
     - *Lesson*: "Betting too little left money on the table. Your money *could* grow faster."  

  2. **The "Reckless = Less Growth" Effect (Phase 1 Bankruptcies)**:  
     - *In-game moment*: 50%+ bettors go bankrupt early; room average rises but most players lose.  
     - *Lesson*: "Betting more than 50% didn’t just add risk—it made growth *negative*. The room got richer on average, but most individuals went broke."  

  3. **Splitting Matters (Phase 2 Shared Rolls)**:  
     - *In-game moment*: Two players bet 40% total—one splits 50-50 (steady growth), one concentrates 100-0 (volatile).  
     - *Lesson*: "Same total risk, but spreading bets improved outcomes. Independent bets let you bet more *total* safely."  

  4. **The Big Picture**:  
     - Reveal the "no names" principle: "The best fraction isn’t fixed—it depends on opportunities. One bet? 20%. Two independent bets? 40% total, split equally."  
     - Connect to real life: "In warehousing, this is like spreading investments across locations. Overconcentrate, and one disaster ruins you. Underbet, and you grow slow."  

  ---

  ### **What Will Go Wrong & Fixes**
  1. **Problem**: Slow calculations at tables.  
     **Fix**: Allow phone calculators; facilitator helps struggling players.  

  2. **Problem**: Reckless players bankrupt early and disengage.  
     **Fix**: "Reboot" with 10 chips; emphasize they’re illustrating ruin.  

  3. **Problem**: Shared rolls in Phase 2 cause confusion.  
     **Fix**: Facilitator rolls dice per table and announces results clearly (e.g., "Table 1: Die1=3 (win), Die2=8 (lose)").  

  4. **Problem**: Short game obscures long-run trends.  
     **Fix**: Use checkpoint data to project: "At round 10, 50% bettors are dying. By round 100, >99% would be bankrupt."  

  ---

  ### **What the Game Can’t Show (Say This Aloud)**
  1. **"This is a long-run claim"**:  
     - A 20-minute game only *illustrates* the math. Real compounding takes years.  

  2. **"In life, odds are unknown"**:  
     - The game assumes known odds (60% win). Reality? Overestimating your edge is the #1 cause of overbetting. When unsure, bet *less* than Kelly.  

  3. **"Kelly isn’t the only strategy"**:  
     - It maximizes growth but is volatile. Conservative players (e.g., half-Kelly) sacrifice growth for safety.  

  --- 

  This design ensures both lessons emerge from lived experience: Phase 1 reveals ruin via reckless betting despite a room-average rise, and Phase 2 forces a rethink of "safe" amounts when splitting bets. The lucky player becomes a teachable moment, not a distraction. Run it as-is, and your group will feel these ideas in their bones.
