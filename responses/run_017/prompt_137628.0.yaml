prompt: |-
  I teach an upper-level undergraduate seminar on Victorian literature and the history of secularism; there are 16 students and one 90-minute session available. I want a structured, runnable activity that makes participants feel the force of a particular claim about George Eliot's view of religion before I ever name it. The claim is that, in her fiction, the cognitive loss of Christian doctrine does not simply clear away religious practice, because devotional practices can leave behind what I call liturgical residue: a trained discipline of attention, confession, gratitude, and sympathy that continues to do moral work after the supernatural beliefs that first organized those practices have been abandoned. Put otherwise, belief and practice can come apart, and it is often the retained practice—not the abandoned doctrine—that preserves a person's or a community's capacity to respond to suffering with moral attention.

  The staged case should be an original scenario set in an early-Victorian English parish, not a reenactment of a specific scene from George Eliot, and it should work even if students cannot recall particular chapter or character names. Assume only that they know she lost her Christian faith but continued to write about religious feeling with sympathy; do not rely on their knowledge of her essays, letters, or secondary criticism. The participants should encounter the idea by being forced to decide, from inside the case, whether to continue devotional practices they no longer believe in, and then by facing a later situation in which the moral capacity sustained by those practices is either available or has atrophied. The rules, roles, constraints, or payoff scheme (using tokens rather than real money) should be arranged so that the felt cost of abandoning practice, and the moral resources retained by continuing it, show up in what participants actually do, not in anything the facilitator says up front.

  Please design the activity and provide: the framing and minimal setup script for the facilitator; the roles or constraints assigned to students; the sequence of forced choices or small deliberations, with a minute-by-minute timeline for the 90 minutes; any materials; the token payoff scheme and how it is tracked; and the exact point at which the facilitator remains silent so that participants run into the doctrine/practice distinction themselves. Then give a debrief that maps specific moments in the activity onto the distinction between abandoning doctrine and retaining practice, onto the liturgical-residue claim, and onto George Eliot's own religious views, and that states clearly what participants should come away seeing. Finally, say what will predictably go wrong the first time I run this—including any way participants might collapse the distinction between practice and doctrine too quickly, or treat continued practice as mere nostalgia—and how to handle it; and be frank about which feature of Eliot's position the activity cannot reproduce and must instead be supplied by the facilitator in the debrief. Do not include a bibliography, reading list, or citations; I will add the criticism myself.
reasoning: |-
  We are designing a 90-minute activity for an upper-level undergraduate seminar on Victorian literature and the history of secularism. The goal is to have students experience the idea of "liturgical residue" in George Eliot's view: that the loss of Christian doctrine does not necessarily erase the moral and emotional habits formed by religious practices, and that these practices can continue to foster moral attention, confession, gratitude, and sympathy even after belief has faded.

  The activity will be set in an early-Victorian English parish and will involve students making choices about continuing devotional practices they no longer believe in, and then facing a situation where the moral capacity sustained by those practices is tested.

  ### Core Design Elements:
  1. **Roles**: Students will be assigned roles as parishioners in a small village. Each has recently lost their Christian faith (due to exposure to new scientific and philosophical ideas) but must decide whether to continue participating in church rituals.
  2. **Phases**:
     - **Phase 1**: Decision on whether to continue religious practices (e.g., daily prayer, Sunday service, confession) despite disbelief.
     - **Phase 2**: A crisis event (e.g., a neighbor's sudden illness or accident) where they must respond. The moral resources (attention, sympathy, etc.) they have (or lack) due to their prior choices will affect their response.
  3. **Token System**: 
     - Tokens represent moral capacity (e.g., "attention tokens", "sympathy tokens"). 
     - Continuing practices in Phase 1 costs time (represented by tokens) but builds up a reserve of moral capacity tokens for Phase 2. 
     - Abandoning practices saves time (gains tokens) but leaves them without moral capacity tokens when needed in Phase 2.
  4. **Forced Choice**: 
     - In Phase 1, each student must decide privately how to allocate their time. 
     - In Phase 2, they must use their accumulated tokens (or not) to help in the crisis. 
     - The payoff: Those who continued practices will have tokens to use and will be able to respond effectively; those who didn't will struggle.

  ### Setup and Roles:
  - **Setting**: A fictional early-Victorian parish (e.g., "Little Havering") in the 1840s.
  - **Roles**: All 16 students are villagers. They are all in the same situation: they have lost their belief in Christian doctrine (due to reading works that challenge faith, such as those by Feuerbach or Strauss, but we won't name these). However, they are embedded in a community where the church is the center of social and moral life.
  - **Constraints**:
    - Each student has a set of "time tokens" (say, 10 per week) representing their available time and energy.
    - They must decide how to spend these tokens in Phase 1 (a typical week).

  ### Materials:
  - **Role Cards**: One per student. They all say the same thing: 
    > "You are a resident of Little Havering. You have recently come to disbelieve in the core doctrines of Christianity (e.g., the divinity of Christ, the resurrection, the existence of God). However, you have been raised in a devout household and have practiced daily prayer, Sunday service, and monthly confession. You are part of a close-knit community. How will you spend your time this week?"
  - **Choice Sheets for Phase 1**: 
    > "You have 10 time tokens. Each token represents an hour of your time. You must decide how to spend them on:
    > - **Religious Practices**: 
    >   - Daily prayer (5 minutes each, so 35 minutes per week) → costs 1 token for the whole week (rounding up).
    >   - Sunday service (1 hour) → costs 1 token.
    >   - Monthly confession (this week) → costs 1 token.
    > - **Other Activities**: 
    >   - Work (farming, trade, etc.): Each token spent here gives you 1 resource token (representing money/food).
    >   - Leisure (reading, walking, etc.): Each token spent here gives you 1 leisure token (representing personal well-being).
    >   - Community service (non-religious): Each token spent here gives you 1 community token (representing social bonds)."
    > 
    > Note: They can choose to do any combination, but they must allocate all 10 tokens.
  - **Token Tracking**: 
    - Each student gets a tracking sheet to record:
      - Time tokens allocated (10 total).
      - Resulting resource, leisure, community tokens (from non-religious activities).
      - Also, for those who choose religious practices, they will receive a set of "moral capacity" tokens (to be used in Phase 2) as follows:
        - Daily prayer: 1 attention token
        - Sunday service: 1 sympathy token
        - Confession: 1 confession token (which will help with honest self-reflection and empathy)
      - So, if they do all three religious practices (costing 3 time tokens), they get 1 attention, 1 sympathy, and 1 confession token. They can do any subset.

  ### Phase 2: Crisis Scenario
  - **Setup**: The facilitator introduces a crisis: 
    > "A neighbor, Mrs. Ellis, has fallen seriously ill. She is a widow with three young children. The community must come together to help: someone needs to sit with her through the night, someone must tend her garden and animals, someone must look after the children, and someone must organize the help and provide emotional support."
  - **Task**: Each student must decide how to help. They can use their tokens to contribute:
    - **Attention token**: Required to notice the subtle signs of distress or need (e.g., you can spend it to notice that the children are scared and need comforting).
    - **Sympathy token**: Required to feel and express genuine care (e.g., you can spend it to effectively comfort the children or Mrs. Ellis).
    - **Confession token**: Required to honestly confront your own limitations and ask for help when needed (e.g., you can spend it to admit you can't do it alone and recruit others).
    - Without these tokens, they can still try to help, but they will be less effective and might cause harm (e.g., ignoring the children's fear, being brusque with the sick woman, or burning out because they don't ask for help).
  - **Non-token contributions**: They can also spend resource tokens (from work) to buy medicine or food, or community tokens to get others to help. But the key is that without the moral capacity tokens, they cannot provide the deep, personal, emotional support.
  - **Forced Choice in Phase 2**: 
    - Each student must write down what they will do to help and which tokens they spend (if any). 
    - The facilitator then reveals the outcomes for Mrs. Ellis and the children based on the collective response. The outcomes are structured so that if enough moral capacity tokens are spent, the situation improves; if not, it deteriorates.

  ### Timeline (90 minutes total):
  - **0-10 min**: Introduction and role assignment. 
    - Facilitator sets the scene: 
      > "Welcome to Little Havering, a small village in 1840s England. You are all members of this community. Recently, due to new ideas and books challenging faith, you have each privately lost your belief in Christian doctrine. But the church and its practices have been the fabric of your lives. Today, we will experience a week in your life and then face a critical event. Let's begin."
    - Hand out role cards and Phase 1 choice sheets. Explain tokens and how to allocate.
  - **10-25 min**: Phase 1 - Private allocation of time tokens. Students record their choices. They turn in their tracking sheets to the facilitator (or keep them private, but the facilitator must know for Phase 2 setup).
  - **25-30 min**: Collect sheets and quickly tally (in your head) the distribution of moral capacity tokens. Adjust the crisis scenario as needed (but keep it consistent).
  - **30-40 min**: Introduce Phase 2 - The crisis. 
    > "It is now Friday evening. Mrs. Ellis, a widow with three children, has fallen ill with a fever. The doctor says she needs constant care, and the children are frightened. The community must respond."
    - Hand out Phase 2 task sheets. Each student must decide how to help, using their tokens. They can choose to:
      - Spend moral capacity tokens (if they have them) to provide effective emotional support.
      - Spend resource tokens to provide material help (e.g., buy medicine, food).
      - Spend community tokens to mobilize others (but note: without moral capacity, the help might be clumsy).
      - Or do nothing (but that will have consequences).
    - They must write down their actions and token spends.
  - **40-60 min**: Students deliberate and record their Phase 2 choices. They can talk to each other if you want to add a collaborative element, but for the first run, it might be better to have them act individually to see the aggregate effect.
  - **60-75 min**: Resolution and outcomes. 
    - The facilitator reveals the outcome for Mrs. Ellis and the children based on the total tokens spent. Use a simple threshold:
      - If the total moral capacity tokens (attention, sympathy, confession) spent by the group is ≥ X (say, 8 for 16 students), then the outcome is good: Mrs. Ellis recovers, the children are cared for, and the community bonds.
      - If 4-7, then mixed: Mrs. Ellis recovers slowly, but the children are traumatized by neglect or harsh care.
      - If ≤3, then bad: Mrs. Ellis dies, the children are sent to the workhouse, and the community is fractured.
    - Also, note individual outcomes: those who spent moral tokens but had few resource tokens might face personal hardship (e.g., they didn't work enough and now have less food). This creates a tension between self and community.
  - **75-90 min**: Debrief.

  ### Silent Point:
  - The key moment is when students are making their Phase 1 choices. The facilitator must not say anything about the value of religious practices. The connection between continuing practices and gaining moral capacity tokens is not explained in moral terms; it's just a rule. The students must discover through the crisis that these tokens are crucial.

  ### Debrief (15 minutes):
  1. **Map the Activity to the Concept**:
     - Ask: "In Phase 1, what did you choose about religious practices? Why?"
     - Then: "In Phase 2, what happened when you tried to help Mrs. Ellis? Did you have what you needed?"
     - Highlight: Those who continued practices had tokens that represented trained capacities (attention, sympathy, confession) that were crucial in the crisis. Those who abandoned practices did not have these tokens and could not provide the same quality of care.
     - Point out: The practices were done without belief, but they left a residue of moral skill.

  2. **Link to George Eliot**:
     - "This is what George Eliot observed: the forms of religion, even when the belief fades, can preserve moral capacities. In her novels, characters who have lost faith but continue the habits of prayer, confession, and community worship often retain a heightened ability to attend to others' suffering. Think of the many scenes in *Middlemarch* or *Adam Bede* where characters who are not orthodox believers still act with deep sympathy because they have been shaped by religious discipline."
     - "Eliot herself abandoned Christian doctrine but maintained that the practices of religion had cultivated essential human virtues. She saw secular morality as inheriting the 'liturgical residue' of Christianity."

  3. **The Distinction**:
     - Emphasize: The activity forced a separation between doctrine (belief) and practice (ritual). The practices continued to have moral utility even without belief. This is the liturgical residue.

  4. **What Participants Should Take Away**:
     - They should see that the abandonment of belief does not necessarily entail the loss of moral capacity; in fact, the habitual practices associated with religion can sustain that capacity independently of doctrine. This is a key insight for understanding secularization in the Victorian era and Eliot's humanistic ethics.

  ### Predictable Problems and Solutions:
  1. **Problem**: Students might collapse practice and doctrine, assuming that if they don't believe, they shouldn't practice (or that continuing practice implies belief). 
     - **Solution**: In the setup, stress that disbelief is a given. The choice is about whether to go through the motions for other reasons (habit, community pressure, etc.). The role card should clearly state they no longer believe.

  2. **Problem**: Students might view continuing practice as mere nostalgia or social conformity without moral weight. 
     - **Solution**: The token system should make the moral capacity tangible. In the debrief, highlight that the tokens represent trained habits of mind, not just sentiment.

  3. **Problem**: Some students might not see the connection between the practices and the tokens. 
     - **Solution**: In the debrief, explicitly map each practice to the token (prayer → attention, service → sympathy, confession → confession token) and explain how each habit trains a specific moral capacity.

  4. **Problem**: The token economy might feel artificial. 
     - **Solution**: Acknowledge this in the debrief, but argue that it models the real cultivation of habit. Eliot believed in the formative power of ritual.

  5. **Problem**: The crisis resolution might feel too deterministic (e.g., if you didn't get tokens, you're a bad person). 
     - **Solution**: Emphasize that the activity is a model to illustrate a point. In real life, people can develop moral attention in other ways, but Eliot was particularly interested in how religious practices had already shaped her contemporaries.

  ### What the Activity Cannot Reproduce:
  - **The Inner Experience**: The activity uses tokens to represent moral capacities, but George Eliot's novels delve into the inner life of characters, showing the complex emotional and psychological landscape of losing belief while retaining moral feeling. The activity is necessarily external and behavioral. In the debrief, you must add that Eliot's genius was in depicting the interiority of this process—the feeling of carrying on practices without belief, and the sometimes painful, sometimes comforting residue they leave.

  ### Final Note:
  Run the activity with clear instructions and strict timekeeping. The power comes from the students experiencing the consequences of their choices without being told the theoretical point first. The debrief is where you connect it to Eliot and the concept of liturgical residue.
answer: |-
  ### Structured Activity: "Liturgical Residue in Little Havering"  
  **Objective:** Participants experience how abandoning religious *doctrine* but retaining devotional *practices* preserves moral capacities (attention, confession, gratitude, sympathy) through a simulated village crisis.  

  ---

  ### **Facilitator Setup Script (0–10 min)**  
  *Speak while distributing materials:*  
  > "Welcome to **Little Havering**, a fictional English parish in 1840. Each of you plays a villager raised in devout Anglicanism. Recently, through exposure to new scientific and philosophical texts, you’ve privately lost belief in core Christian doctrines: God’s existence, Christ’s divinity, and the afterlife. *But* you still live in a tight-knit community where church rituals structure daily life.  
  >   
  > **Today’s activity has two phases:**  
  > 1. **Personal Choice (Phase 1):** Decide how to spend your time this week—including whether to continue church practices you no longer believe in.  
  > 2. **Community Crisis (Phase 2):** Respond to a neighbor’s sudden suffering.  
  >   
  > **Tokens represent your resources:**  
  > - **Time Tokens (10 per player):** Spend these on daily activities.  
  > - **Moral Capacity Tokens:** Earned *only* through devotional practices, but usable *only* in Phase 2.  
  > - **Resource Tokens:** Earned through work/leisure, usable in both phases.  
  >   
  > *Silent rule:* I won’t explain *why* moral tokens matter until after Phase 2. Your choices have consequences. Begin."  

  ---

  ### **Roles & Materials**  
  - **Roles:** All 16 students are villagers. No distinct roles—uniform starting point ensures focus on choice.  
  - **Materials:**  
    - **Phase 1 Choice Sheet** (1 per student): Lists options for spending 10 Time Tokens.  
    - **Token Tracking Sheet** (1 per student): Records token earnings/spending.  
    - **Moral Tokens:** Physical tokens (e.g., colored beads): **Blue (Attention)**, **Green (Confession)**, **Yellow (Gratitude)**, **Red (Sympathy)**.  
    - **Resource Tokens:** Generic markers (e.g., wooden chips).  

  ---

  ### **Phase 1: Personal Choice (10–30 min)**  
  *Students work individually.*  
  > **Instructions:**  
  > "Spend your 10 Time Tokens on any mix of these weekly activities. *Track earnings on your sheet:*  
  > - **Attend Sunday service (Cost: 1 Time Token)** → Earns 1 **Sympathy (Red) Token**  
  > - **Daily private prayer (Cost: 2 Time Tokens)** → Earns 1 **Attention (Blue) Token**  
  > - **Confession to vicar (Cost: 1 Time Token)** → Earns 1 **Confession (Green) Token**  
  > - **Keep a gratitude journal (Cost: 1 Time Token)** → Earns 1 **Gratitude (Yellow) Token**  
  > - **Work (farming/trade) (Cost: 1 Time Token)** → Earns 2 **Resource Tokens**  
  > - **Leisure (reading/walking) (Cost: 1 Time Token)** → Earns 1 **Resource Token**  
  >   
  > *Note:* Moral tokens have *no use* in Phase 1. Resource tokens can be used in *either* phase."  

  **Forced Choice:** Students must allocate all tokens. No partial spending.  
  *Facilitator silence:* **Do not clarify why moral tokens exist.** Wander the room to answer logistical questions only.  

  ---

  ### **Phase 2: Community Crisis (30–60 min)**  
  *Introduce crisis:*  
  > "A disaster strikes: **Mrs. Ellis** (a widow) has collapsed from exhaustion while caring for her sick child. The child’s fever is worsening, and she faces eviction if she misses work. The community gathers. Each of you must decide how to help—*using tokens you earned in Phase 1.*"  

  **Crisis Tasks (Students choose 1 action):**  
  > - **Action A: Care for the child (Requires 1 Sympathy + 1 Attention Token)**  
  >   - *Success:* Child recovers; Mrs. Ellis keeps her home.  
  >   - *Failure without tokens:* Child dies; Mrs. Ellis is fired.  
  >   
  > - **Action B: Negotiate with landlord (Requires 1 Confession + 1 Gratitude Token)**  
  >   - *Success:* Landlord forgives rent; community rallies support.  
  >   - *Failure without tokens:* Landlord refuses; Mrs. Ellis is evicted.  
  >   
  > - **Action C: Cover Mrs. Ellis’s work (Requires 2 Resource Tokens)**  
  >   - *Success:* Her job is saved; child receives medicine.  
  >   - *Failure without tokens:* You exhaust yourself; no net help.  
  >   
  > **Rules:**  
  > - Moral tokens *cannot* be substituted with Resource tokens.  
  > - Students *can* combine tokens (e.g., two players pool Sympathy + Attention for Action A).  
  > - **Cost of inaction:** Choosing nothing deducts 2 Resource Tokens (guilt-induced waste).  

  **Process:**  
  - 30–40 min: Students deliberate in pairs/groups (encourage bargaining: *"I need your Sympathy token for Action A!"*).  
  - 40–50 min: Groups declare actions and spend tokens.  
  - 50–60 min: Facilitator announces outcomes based on token spending (e.g., *"Action A failed—no one had both Sympathy and Attention tokens"*).  

  ---

  ### **Token Payoff Scheme**  
  - **Earning:**  
    - Moral tokens *only* from devotional practices in Phase 1.  
    - Resource tokens from work/leisure.  
  - **Spending:**  
    - Moral tokens *only* usable in Phase 2 crisis actions.  
    - Resource tokens usable in Phase 1 (for leisure/work) or Phase 2 (for Action C).  
  - **Tracking:** Students note earnings/spending on sheets. Facilitator verifies during Phase 2 declarations.  

  ---

  ### **Facilitator’s Silent Point**  
  - **Critical silence:** When students ask *during Phase 1*: *"Why earn moral tokens if I don’t believe?"* or *"What are these for?"* → **DO NOT ANSWER.** Say: *"Make choices based on your role."*  
  - **Design intent:** Forces students to either "waste" time on "meaningless" practices or risk having no tools for Phase 2. The cost of abandoning practice becomes visceral when they lack tokens to respond to suffering.  

  ---

  ### **Debrief (60–90 min)**  
  **Map Activity to Concepts:**  
  1. **Phase 1 Choices:**  
     - *"Who abandoned all devotional practices? Why?"* → Link to abandoning *doctrine* as "irrational."  
     - *"Who kept practices despite disbelief? Why?"* → Nostalgia? Habit? Social pressure?  
     - **Key point:** Moral tokens were earned *without belief*—through *practice alone*.  

  2. **Phase 2 Crisis:**  
     - *"What happened when you lacked Sympathy/Attention tokens?"* → Failed caring (e.g., child died).  
     - *"Could Resource tokens replace moral tokens?"* → No. Money/work couldn’t replicate moral attention.  
     - **Liturgical residue claim:** The *practices* (prayer, confession, etc.) trained capacities that outlasted belief.  

  3. **George Eliot Connection:**  
     - Eliot rejected doctrine but saw Anglican rituals as "schools of feeling." *Scenes of Clerical Life* or *Adam Bede* show characters using prayer/journaling to sustain empathy after losing faith.  
     - **Takeaway:** Eliot’s humanism argues that secular morality inherits religious *disciplines* (not beliefs).  

  **Clear Conclusion:**  
  > "You experienced how *practices*—detached from doctrine—preserve moral capacities. Eliot thought this 'liturgical residue' was essential for a post-faith society. Abandoning practice atrophies sympathy; retaining it lets us 'respond to suffering' even without God."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem: Collapsing doctrine/practice too quickly.**  
     - *Risk:* Students assume keeping practices = "secret belief" or hypocrisy.  
     - *Solution:* In debrief, stress: *"Eliot saw this as habit, not hidden faith. You can train attention like a muscle—without metaphysics."*  

  2. **Problem: Treating practice as nostalgia.**  
     - *Risk:* Students keep rituals for "comfort" but miss moral training.  
     - *Solution:* In crisis outcomes, show nostalgia alone fails—e.g., if they kept prayer for "tradition’s sake" but didn’t use Attention tokens effectively.  

  3. **Problem: Token literalism.**  
     - *Risk:* Students see tokens as "currency," not symbols of capacity.  
     - *Solution:* Debrief: *"Tokens represent trained habits. Eliot’s Dorothea Brooke (*Middlemarch*) prays without belief—and that discipline lets her see Casaubon’s suffering."*  

  4. **What the Activity Can’t Reproduce:**  
     - **Eliot’s emphasis on incremental habit-formation.** The activity compresses years of ritual into one choice.  
     - **Facilitator must add:** *"Eliot believed these practices work cumulatively. One week of prayer in Little Havering is a shorthand for lifelong discipline."*  

  ---

  **First Run Adjustments:**  
  - If students hoard Resource tokens, let Phase 2 fail catastrophically (e.g., eviction/death). The emotional weight reinforces the point.  
  - If too many students abandon practice, highlight the collective cost: *"Because most of you dropped rituals, Little Havering couldn’t muster enough moral attention to save Mrs. Ellis."*  
  - For dominant personalities: Assign silent reflection first, then group negotiation.  

  **Outcome:** Students feel the "cost" of discarded practices and grasp Eliot’s secular ethics viscerally—before ever hearing her name.
