prompt: |-
  Construct a single-paragraph case, set in an ordinary professional context, in which three accounts of knowledge each yield a different combination of verdicts on two questions — and in which the divergence falls out of the accounts rather than being written into the story.

  The accounts. Use these versions.

  1. Attributor contextualism. The truth conditions of ascriptions of knowledge shift with the ascriber's context: how much rides on the inquiry the ascriber is engaged in, and which error possibilities are salient there. Nothing about the subject's own situation fixes the standard independently of the ascriber's context. On the version I want, the practical question — whether the subject may treat the proposition as a reason for acting without checking further — is settled by whether the ascription comes out true in the subject's own deliberative context.

  2. Interest-relative invariantism (pragmatic encroachment). The standard is invariant across ascribers but shifts with what is practically at stake for the subject: the cost of being wrong, the cost of delay or further checking, the importance of acting now. The stakes are the subject's actual situation, whether or not she recognizes it. Knowledge in this sense is exactly what is needed for the proposition to be usable as a premise in practical reasoning, so the two questions move together.

  3. Transparency-conditioned encroachment — a view I am stipulating here rather than reporting, because I want to see what it commits us to. As in (2), the standard is invariant across ascribers and sensitive to practical stakes; but encroachment is triggered only by stakes the subject has in view at the time of acting. Real stakes of which she is unaware do not raise the bar, even if others know about them and even if they are enormous. The two questions move together here as well.

  The two questions, asked about the same subject, the same proposition and the same evidence. Q1: as a third party — call her the assessor — asks it, in the context the case specifies: is it true that the subject knows? Q2: may the subject act on the proposition without checking further?

  The pattern I want: contextualism, no to Q1 and yes to Q2; interest-relative invariantism, no to both; transparency-conditioned encroachment, yes to both.

  Constraints on the scenario.

  - One paragraph, at most about 150 words, realistic, no science-fictional or contrived machinery.
  - Set it somewhere with institutional texture — a hospital laboratory, a structural inspection, a food-safety line, an election canvass, a wildfire dispatch desk — and not in the familiar register of banks, airports, tickets and missed flights.
  - The subject's evidence must be strong enough, and of the right kind, that if the stakes were trivial and the assessor's context relaxed, all three accounts would return a positive verdict. Describe the evidence by what she did and by the known error rates of her procedures — not by calling it justified, reasonable or solid.
  - Her ignorance of the real stakes must be non-culpable and realistic: the information exists somewhere she had no duty to look, or a downstream use of her result was never mentioned to her, or a change was made by another unit. No conspiracies, no one deceiving her on purpose.
  - Further checking must be possible but genuinely costly, and it must be pointless as she sees things while cheap relative to the stakes as they actually are. Build this into the story rather than asserting it.
  - Nobody in the story says that they know, or that she does not; nothing is settled by what anyone would be inclined to say.
  - Hold fixed across all three evaluations: the proposition, the evidence, the cost of error, the cost of checking. The only variables are who is aware of the stakes and what is salient in the assessor's context.

  What to hand back.

  1. The paragraph.
  2. A short table of the held-fixed parameters, including the distribution of awareness and the features of the assessor's context.
  3. For each of the three accounts: the verdicts on Q1 and Q2, with the reasoning traced explicitly to that account's commitments, and a statement of which feature of the case the account keys on.
  4. Which single feature does the work. Show this by removing it in two directions: first, let the subject be told what is actually at stake; second, let the assessor's context be one in which nothing hangs on the question and the error possibility has not been raised. Say which rows collapse into which, and why this shows the feature is load-bearing rather than decorative.
  5. The strongest attack available to a defender of whichever account comes off worst in your case, and briefly why it is the strongest rather than merely the first one that occurred to you.

  Why I want it: I am building a seminar session on whether contextualism and pragmatic encroachment are genuine rivals or two descriptions of the same pattern. The familiar cases cannot separate them, because in those cases the ascriber's context and the subject's stakes move together and every account returns the same verdict. A case that works by stipulating the verdicts, or by pressing the reader's untutored feel for the word, is of no use to me: I want the verdicts derived from the commitments above, with the pressure points visible.
reasoning: |-
  We are constructing a case with ordinary professional context, avoiding the familiar and ensuring institutional texture. The case must have:
  - A subject with strong evidence for a proposition, but where real stakes are high and unknown to her, while the assessor's context has high stakes and salient error possibilities.
  - The subject sees no reason to check further; checking is costly to her but cheap relative to real stakes.

  We need:
  - Contextualism: Q1 (assessor's "does she know?") is false (because assessor's context has high stakes and salient errors), but Q2 (subject may act without checking) is true (because subject's deliberative context has low stakes by her lights).
  - IRI: Q1 false and Q2 false (because the real stakes are high, so the standard is high, and her evidence doesn't meet it; and since she doesn't know, she shouldn't act without checking).
  - Transparency: Q1 true and Q2 true (because the subject is unaware of the high stakes, so the bar is not raised; her evidence is sufficient for the low-stakes bar she faces, and she may act without checking).

  Parameters to hold fixed:
  - Proposition: e.g., "The sample is negative for contamination."
  - Evidence: The subject ran a standard test with known low error rate (say, 0.1% false negatives) and got a negative result. She followed protocol.
  - Cost of error: If the sample is actually contaminated and it is used, it could cause a major outbreak (high cost). But the subject doesn't know this.
  - Cost of checking: Re-running the test would take 2 hours and require a new sample, which is costly in terms of time and resources for her lab (but cheap compared to the potential outbreak). The subject sees no need because her test is reliable and she has no reason to suspect error.
  - Awareness: The subject is unaware of the high stakes (the sample is for a high-profile event with vulnerable populations, but she wasn't informed). The assessor (a quality control officer) is in a context where the stakes are known and the possibility of a false negative is salient (because of the event's importance and past incidents).
  - Assessor's context: High stakes (they are reviewing all tests for this event) and the error possibility (false negatives) is salient because of a recent near-miss in another lab.

  Now, the paragraph:

  In the municipal water testing lab, technician Ava ran a standard coliform test on a sample from Reservoir B, which returned negative; the test's false negative rate is 0.1%. Unbeknownst to Ava, this sample was flagged for special scrutiny because it feeds a hospital's water supply, and a contamination could cause fatal infections. The lab's quality control auditor, Ben, reviewing all tests for the hospital supply, notes the recent near-miss at another reservoir and wonders if Ava knows the sample is clean. For Ava, re-testing would require retrieving another sample and delay her other work by hours, which seems unnecessary given the test's reliability. But for the hospital, even a 0.1% risk is unacceptable.

  Parameters held fixed:

  | Parameter                      | Value                                                                 |
  |--------------------------------|-----------------------------------------------------------------------|
  | Proposition (P)                | The water sample from Reservoir B is free of coliform contamination. |
  | Subject's evidence for P       | Standard test with 0.1% false negative rate; result was negative.    |
  | Real cost of error (if ~P)     | Fatal infections in a hospital; very high.                           |
  | Real cost of further checking  | 2 hours of technician time and sample retrieval; moderate for the lab but cheap relative to outbreak risk. |
  | Subject's awareness of stakes  | Unaware of the hospital connection; thinks it's routine.             |
  | Subject's perceived cost of error | Low (routine sample).                                                |
  | Subject's perceived cost of checking | High (delays her work).                                              |
  | Assessor's context (Ben)       | High stakes (hospital supply) and salient error possibility (near-miss incident). |

  Now, for each account:

  1. **Attributor contextualism**:
     - Q1 (Does Ava know P?): **No**. In Ben's context (high stakes, salient error possibility), the standards for knowledge are high. Ava's evidence (0.1% error rate) is not enough to rule out the salient error possibilities in Ben's context.
     - Q2 (May Ava act on P without checking?): **Yes**. In Ava's own deliberative context, the stakes are low (she thinks it's routine) and the error possibilities are not salient. So, in her context, "Ava knows P" is true, and she may treat P as a reason for acting without further checking.
     - Key feature: The shift in truth conditions depending on the ascriber's context (Ben's high-stakes context vs. Ava's low-stakes context).

  2. **Interest-relative invariantism (IRI)**:
     - Q1 (Does Ava know P?): **No**. The standard is invariant but depends on the real stakes, which are high (fatal infections). Given the high stakes, the evidence (0.1% chance of error) is not sufficient for knowledge.
     - Q2 (May Ava act on P without checking?): **No**. Since she does not know P (because of the high stakes), she may not use P as a premise in practical reasoning without checking further.
     - Key feature: The real stakes (high, due to the hospital) determine the standard, regardless of what Ava or Ben is aware of.

  3. **Transparency-conditioned encroachment**:
     - Q1 (Does Ava know P?): **Yes**. The standard is invariant and stakes-sensitive, but only to the stakes the subject (Ava) has in view. Ava is unaware of the high stakes (hospital); she only sees routine stakes. Hence, the standard remains low, and her evidence (0.1% error rate) is sufficient for knowledge.
     - Q2 (May Ava act on P without checking?): **Yes**. Since she knows P (by the low standard that applies because she is unaware of the high stakes), she may act on P without checking.
     - Key feature: The subject's awareness of the stakes (Ava's unawareness of the hospital connection) means the high stakes do not raise the bar for knowledge.

  Now, which single feature does the work? **The subject's ignorance of the high stakes and the assessor's awareness of them (and the salience in the assessor's context).**

  To show it's load-bearing:

  - **Modification 1: Tell the subject about the stakes.**
    - Now, Ava is aware of the hospital connection and the high stakes.
    - Contextualism: Q1 still false (Ben's context is still high-stakes), but Q2 now? In Ava's deliberative context, the stakes are high, so the standard is high. Her evidence might not meet it, so Q2 becomes no? But note: the account says the practical question is settled by whether the ascription in the subject's context is true. If in her context the standard is high and she doesn't know, then Q2 is no. So: Q1 no, Q2 no. (Collapses to IRI pattern.)
    - IRI: Already no to both, remains the same.
    - Transparency: Now Ava is aware of the stakes, so the bar is raised. She doesn't know (because 0.1% error is too high for these stakes?), and so Q2 is no. So: Q1 no, Q2 no. (Collapses to IRI pattern.)
    - Thus, the divergence between contextualism and the others disappears.

  - **Modification 2: Lower the assessor's context (nothing hanging on it, error possibility not salient).**
    - Suppose Ben is in a relaxed context (e.g., routine audit with no special concerns).
    - Contextualism: Now, in Ben's context (low stakes, no salient errors), the standard is low. So Q1: yes, Ava knows. Q2: yes (as before). So: yes to both.
    - IRI: Unchanged. Real stakes are still high, so Q1: no, Q2: no.
    - Transparency: Unchanged. Q1: yes, Q2: yes.
    - Now, contextualism and transparency agree (yes/yes) but IRI disagrees (no/no). The original pattern is broken.

  The feature that does the work is the combination: subject unaware of high stakes (so for transparency, the bar remains low) and assessor in a high-stakes context (so for contextualism, the bar is high). Without either, the pattern collapses.

  Strongest attack for the account that comes off worst? IRI comes off worst in the sense that it denies both Q1 and Q2, while the others give mixed or positive. But in the case, IRI might be defended by arguing that the real stakes should matter, and that the subject's ignorance is not a legitimate excuse for lowering the epistemic standard.

  The strongest attack for IRI (the account that says no to both) might be to challenge the idea that the subject's ignorance of the stakes is non-culpable. If the subject has a duty to know the stakes (e.g., because it's her job to know the purpose of the test), then her ignorance might be culpable, and we might hold her to the higher standard anyway. However, the case stipulates non-culpable ignorance. So the defender of IRI must bite the bullet and say that even non-culpable ignorance does not lower the standard. The attack then is to argue that in such cases, the subject's action is irresponsible even if she doesn't know it, because the stakes are real. But this is just reasserting IRI.

  Alternatively, the attack might come from a defender of IRI against the case setup: perhaps arguing that the evidence (0.1% error) is actually sufficient for knowledge even in high stakes? But 0.1% in a life-or-death situation might be too high. The IRI defender might say: in real life, we often act on evidence with higher error rates in high stakes, so perhaps the threshold is not so high. But this is weak because the case sets the error rate low but the stakes very high (fatalities). The strongest attack is to insist that the real stakes are what matter for actionability, and that the subject's ignorance does not make it safe to act. This is just the IRI position. There isn't a knockdown counter, but the case is designed to make IRI look harsh.

  Alternatively, the attack might be that the cost of checking is not really that high relative to the stakes. But in the story, it is built as moderate for the lab but cheap relative to the outbreak, so that's held fixed.

  The strongest attack for IRI: argue that the subject should not act without checking because the real cost of error is high, even if she doesn't know it. Therefore, the transparency view is too permissive and contextualism gets the actionability wrong. The IRI defender might say that the subject's action is objectively risky and she ought to check, regardless of what she knows. This is the core of IRI and the attack is that the other views are too lax.

  But the case is set up to show IRI as harsh. The defender of IRI must accept that and argue that it's the right result.

  Now, the account that comes off worst might be IRI because it denies both, making the subject both ignorant and unable to act. The strongest attack from IRI's perspective is to challenge the intuition that the subject may act without checking. The IRI defender can point out that if the sample is contaminated, the consequences are catastrophic, and the subject has a cheap way to double-check (relative to the stakes). Therefore, it would be irresponsible for her to act without checking, even if she doesn't know the stakes. And if it's irresponsible, then she doesn't know (by IRI lights). The attack is that the other views are being too lenient on the subject's action.

  But note: the case says the cost of checking is high as the subject sees it (delays her work) and she sees no reason. The IRI defender must override the subject's perspective with the objective stakes.

  That's the dialectic.

  Now, let's write the paragraph and the rest.
answer: |-
  ### The Paragraph
  At the wildfire dispatch desk, meteorologist Clara analyzes a satellite feed showing no active fires in Sector 7, using an algorithm with a 0.2% false-negative rate; the readout is clear. Unbeknownst to her, Sector 7 contains a chemical plant where a fire could trigger toxic explosions, and the regional commander has ordered heightened scrutiny due to faulty sensors elsewhere. Clara, seeing no alerts, considers the sector safe and moves to dispatch crews to a lower-risk zone. Re-running the analysis would take 90 minutes and divert her from emerging threats, wasting critical time in her view. For the commander, however, even a 0.2% risk is intolerable given the plant’s hazards.

  ### Table of Held-Fixed Parameters
  | Parameter | Value |
  |-----------|-------|
  | **Proposition (P)** | "There are no active fires in Sector 7." |
  | **Subject's evidence for P** | Satellite algorithm output (clear); false-negative rate: 0.2% based on calibration data. |
  | **Real cost of error (if ~P)** | Toxic explosions at chemical plant; catastrophic (high stakes). |
  | **Real cost of further checking** | 90 minutes of delay and diverted attention; moderate for dispatch operations but cheap relative to explosion risk. |
  | **Subject's awareness of stakes** | Unaware of chemical plant or commander’s scrutiny; believes Sector 7 is low-risk. |
  | **Subject's perceived cost of error** | Low (routine sector). |
  | **Subject's perceived cost of checking** | High (delays response to other threats). |
  | **Assessor's context** | Regional commander; high stakes (plant hazards) and salient error possibility (faulty sensors). |

  ### Verdicts and Reasoning by Account
  1. **Attributor contextualism**:  
     - **Q1 (Assessor: "Does Clara know P?")**: **No**. The assessor (commander) is in a high-stakes context where the error possibility (false negatives from faulty sensors) is salient. This raises the standard for knowledge, and Clara's 0.2% error-rate evidence is insufficient.  
     - **Q2 (May Clara act on P without checking?)**: **Yes**. In Clara's deliberative context (low perceived stakes, no salient errors), the standard for knowledge is low. Her evidence meets this lower bar, so "Clara knows P" is true in her context, and she may treat P as a reason for acting.  
     - **Key feature**: Ascriber's context shifts truth conditions (commander's high-stakes context vs. Clara's low-stakes context).

  2. **Interest-relative invariantism**:  
     - **Q1 (Assessor: "Does Clara know P?")**: **No**. The standard is invariant but sensitive to real stakes (catastrophic explosion risk). High stakes require near-certainty evidence; Clara's 0.2% error rate is insufficient for knowledge.  
     - **Q2 (May Clara act on P without checking?)**: **No**. Knowledge is necessary for acting without checking. Since Clara lacks knowledge (due to high real stakes), she may not use P as a premise in practical reasoning.  
     - **Key feature**: Real stakes (chemical plant risk) determine the epistemic standard, independent of awareness.

  3. **Transparency-conditioned encroachment**:  
     - **Q1 (Assessor: "Does Clara know P?")**: **Yes**. The standard is stakes-sensitive but only when the subject is aware of the stakes. Clara is unaware of the chemical plant risk, so the standard remains low (based on her perceived stakes). Her evidence (0.2% error rate) meets this low standard.  
     - **Q2 (May Clara act on P without checking?)**: **Yes**. Since she knows P (due to unawareness of high stakes), she may act on it without further checking.  
     - **Key feature**: Subject's awareness (Clara's ignorance) gates stake-sensitivity; real stakes unknown to her do not raise the bar.

  ### Load-Bearing Feature and Modifications
  The **divergence relies on Clara's ignorance of the stakes and the assessor's high-stakes context**.  
  - **Modification 1: Subject told the stakes** (Clara learns of the chemical plant):  
    - Contextualism: Q1 remains **no** (assessor's context unchanged), but Q2 becomes **no** (Clara's deliberative context now has high stakes, so evidence is insufficient).  
    - IRI: Unchanged (**no** to both).  
    - Transparency: Q1 becomes **no** (awareness triggers high standard; evidence insufficient), Q2 becomes **no**.  
    - **Collapse**: Contextualism and transparency now align with IRI (no/no).  
  - **Modification 2: Assessor's context relaxed** (commander in routine review; no salient errors, low stakes):  
    - Contextualism: Q1 becomes **yes** (low-stakes context lowers standard; evidence sufficient), Q2 remains **yes**.  
    - IRI: Unchanged (**no** to both).  
    - Transparency: Unchanged (**yes** to both).  
    - **Collapse**: Contextualism and transparency now align (yes/yes), diverging from IRI.  
  - **Why load-bearing**: Without Clara's ignorance, transparency collapses to IRI; without the assessor's high-stakes context, contextualism collapses to transparency. The feature creates divergence by decoupling subject and assessor perspectives.

  ### Strongest Attack for the Worst-Off Account
  **IRI comes off worst**: It denies both Q1 and Q2, rendering Clara ignorant and unable to act rationally despite non-culpable ignorance.  
  - **Strongest attack (from IRI defender)**: Argue that the **real stakes objectively determine rational actionability**, and Clara's action is reckless regardless of her ignorance. Even non-culpable unawareness doesn't negate the catastrophic risk; acting on 99.8% evidence when error costs lives is irresponsible, so she *shouldn't* act without checking. This attack is strongest because it targets the core intuition that non-culpable ignorance licenses action, leveraging IRI's invariant link between knowledge and practical reasoning. It is not merely *ad hoc* but reinforces IRI's commitment to stakes as mind-independent—making the case a virtue for IRI by highlighting its alignment with objective risk management.
