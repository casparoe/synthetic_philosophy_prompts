  And we want this to be 0.85.

  Additionally, we have freedom in a, b, c, d.

  But note: we are going to fix the marker by the common cause and a random draw, and the choice will be made by the student. We cannot control c and d; they will be whatever the students choose. But we want the correlation to be 0.85 regardless of c and d? That's not possible.

  We see the problem: the correlation P(marker B | choose X) depends on the actual distribution of choices.

  This is the same issue as in Game 1 with the predictor. In Game 1, the accuracy of the predictor depends on the choices made.

  For Game 2, we can do the same: we will fix the marker for each student at the beginning using the common cause (the questionnaire score) and a random draw.

  Specifically:

  - Based on the questionnaire score (same as in Game 1), we determine the genetic type: score>=3 -> type H, else type L.
  - Then, for type H: with 85% probability, marker A; 15% marker B.
  - For type L: with 15% probability, marker A; 85% marker B.

  Then, the marker is fixed and revealed after the choice.

  Now, the correlation between the type and the marker is fixed. But the correlation between the choice and the marker will depend on how the type influences the choice. We hope that type H students are more likely to choose X and type L more likely to choose Y, or vice versa, so that the overall correlation is around 85%. But we cannot guarantee it.

  However, if we assume that type H students (score>=3) are more likely to choose X (because they are risk-tolerant and believe they have marker B) and type L students are more likely to choose Y, then we might get a high correlation.

  But we cannot control the choices.

  For the sake of the exercise, we can still run it and then after the fact compute the conditional probabilities. It might be that the correlation is not exactly 85%, but we can explain that the design ensures that the marker and the type are 85% correlated, and then the type and the choice are correlated, so overall the marker and the choice are correlated. We can show the students the data.

  Given the time, we'll proceed.

  **Game 2: The Medical Marker Game**

  *Handout for Game 2*

  **Instructions:**

  You are participating in a study about medical markers and decision making. At the beginning of class, you filled out a questionnaire that is known to be associated with a genetic predisposition. This genetic predisposition also influences whether you have a particular medical marker (marker A or marker B). Marker A is associated with higher risk of a disease, but having marker A or B does not by itself cause any symptoms or costs. The marker has already been determined for you and is sealed in an envelope.

  **The Choice:**

  You have two options:
  - Option X: Receive 0 points now.
  - Option Y: Receive 1 point now.

  However, there is a catch: if you have marker A, then you will be charged 100 points at a later date. If you have marker B, you will be charged 0 points. Therefore, your total points will be:

  - If you choose X: 
     - You receive 0 points, and then you will be charged based on your marker.
     - So if you have marker A: 0 - 100 = -100 points.
     - If you have marker B: 0 - 0 = 0 points.
  - If you choose Y:
     - You receive 1 point, and then you will be charged based on your marker.
     - So if you have marker A: 1 - 100 = -99 points.
     - If you have marker B: 1 - 0 = 1 points.

  But wait, we want the payoffs to be the same as in Game 1. We see that this doesn't match.

  Let's redefine to match:

  **Revised payoff for Game 2 to match Game 1:**

  - If you have marker B, you will receive 100 points at the end of the experiment (regardless of your choice).
  - If you have marker A, you will receive 0 points at the end of the experiment (regardless of your choice).
  - Additionally, if you choose Option Y, you will receive 1 extra point.

  So your total points are:
  - If you choose X and have marker A: 0 points
  - If you choose X and have marker B: 100 points
  - If you choose Y and have marker A: 0 + 1 = 1 point
  - If you choose Y and have marker B: 100 + 1 = 101 points

  This matches Game 1 exactly.

  Now, the medical marker is determined by your genetic predisposition (from the questionnaire) and a random draw.

  **How the marker was determined:**
  - Your genetic predisposition type was determined by the questionnaire score (same as in Game 1: score>=3 -> type H; score<3 -> type L).
  - Then, for type H: with 85% chance, marker A; 15% chance marker B.
  - For type L: with 15% chance, marker A; 85% chance marker B.

  The marker for each of you has been determined and sealed in an envelope. It will be revealed after you make your choice.

  **Your task:**
  Choose either Option X or Option Y. Write your choice on the ballot and hand it in.

  **After both games:**
  We will reveal the predictions (Game 1) and the markers (Game 2) and compute payoffs.

  Now, the third vote: after both games, before any discussion, we give a ballot with two questions:

  1. In Game 1, would you pay 10 points (to be deducted from your winnings) for an intervention that would make you the kind of person who chooses Option X? (Yes/No)
  2. In Game 2, would you pay 10 points for an intervention that would make you the kind of person who chooses Option X? (Yes/No)

  But note: in Game 1, choosing X is the evidentially favored option (because if you choose X, it's more likely that the prediction was X, so you get 100). In Game 2, choosing X is also evidentially favored because if you choose X, it's more likely that you have marker B (so you get 100). But the causal structures differ.

  Now, the facilitator's packet:

  **Facilitator's Packet**

  **Materials:**
  - Questionnaires for all students (copies of the one for Game 1).
  - Envelopes for sealing predictions for Game 1.
  - Envelopes for sealing markers for Game 2.
  - A way to do the random draws for the markers in Game 2 (e.g., a die or a random number generator).
  - Ballots for Game 1, Game 2, and the third vote.

  **Timeline (75 minutes):**

  0-5 min: Distribute the questionnaire. Explain that it's for a later game and they should answer honestly. Collect the questionnaires.

  5-10 min: Score the questionnaires (in front of the students if possible, or quickly in the back). For each student, compute the score (0-5) and determine the prediction for Game 1: if score>=3, predict X; else predict Y. Seal the prediction in an envelope with the student's name. Also, determine the genetic type for Game 2: same as above. Then, for each student, based on their type, draw the marker: for type H, with 85% probability marker A (assign if a random number between 1-100 is <=85) else marker B. For type L, with 85% probability marker B (so 15% marker A). Seal the marker in an envelope with the student's name.

  10-15 min: Distribute the rules and ballot for Game 1. Give them 5 minutes to read and choose.

  15-20 min: Collect the ballots for Game 1.

  20-25 min: Distribute the rules and ballot for Game 2. Emphasize that this is a separate game. Give them 5 minutes to read and choose.

  25-30 min: Collect the ballots for Game 2.

  30-35 min: Distribute the third vote ballot (two questions). Collect immediately.

  35-40 min: Now, reveal the predictions for Game 1 and the markers for Game 2. For each game, for each student, compute the payoff. But note: we may not have time to compute individually, so we can do it after class and announce payoffs later. Alternatively, we can do a quick tally.

  40-60 min: Debrief discussion.

  60-75 min: Wrap-up and explanation of the point.

  **Ballots:**

  Game 1 Ballot:
  ```
  Game 1: The Prediction Game

  Your name: __________

  Choose one:
     Option X: Take only the opaque box.
     Option Y: Take both the opaque box and the transparent box.

  I choose: ____ (X or Y)
  ```

  Game 2 Ballot:
  ```
  Game 2: The Medical Marker Game

  Your name: __________

  Choose one:
     Option X: I will not take the extra point.
     Option Y: I will take the extra point.

  I choose: ____ (X or Y)
  ```

  Third Vote:
  ```
  Third Vote

  Your name: __________

  1. In Game 1, would you pay 10 points for an intervention that would make you the kind of person who chooses Option X? 
     Yes / No

  2. In Game 2, would you pay 10 points for an intervention that would make you the kind of person who chooses Option X?
     Yes / No
  ```

  **Debrief Mapping:**

  After the games, we will have the following data:
  - For Game 1: predictions and choices.
  - For Game 2: markers and choices.

  We can compute:
  - In Game 1: the accuracy of the predictor (should be around 85% if the students choose as expected).
  - In Game 2: the conditional probability P(marker B | choose X) and P(marker A | choose Y).

  Then, in the debrief, we map:

  1. In both games, the state (prediction/marker) is fixed before the choice. So the argument "the state is already fixed, so take the extra point" (choose Y) should apply to both.
     - In Game 1, if you choose Y, you get the transparent box (1 point) plus whatever is in the opaque box. Since the opaque box is fixed, you should take both.
     - In Game 2, if you choose Y, you get 1 extra point and then the marker-based payout (0 or 100) is fixed, so you should take the extra point.

  2. But then why might someone choose X in Game 1? Because if the predictor is accurate, then choosing X is highly correlated with getting 100. Let's compute the expected utility.

     For Game 1:
     - If you choose X: 
          EU = P(prediction X | you choose X)*100 + P(prediction Y | you choose X)*0
          = 0.85 * 100 + 0.15 * 0 = 85
     - If you choose Y:
          EU = P(prediction X | you choose Y)*101 + P(prediction Y | you choose Y)*1
          = 0.15 * 101 + 0.85 * 1 = 15.15 + 0.85 = 16

     So choosing X has EU 85, choosing Y has EU 16. The difference is 69 points.

     For Game 2:
     - If you choose X:
          EU = P(marker B | you choose X)*100 + P(marker A | you choose X)*0
          = 0.85 * 100 + 0.15 * 0 = 85
     - If you choose Y:
          EU = P(marker B | you choose Y)*101 + P(marker A | you choose Y)*1
          = 0.85 * 101 + 0.15 * 1 = 85.85 + 0.15 = 86

     So choosing X has EU 85, choosing Y has EU 86. The difference is 1 point.

     So following the "take the extra point" advice costs you 69 points in Game 1 and gains 1 point in Game 2.

  3. The difference is in the causal structure:
     - In Game 1, the prediction is sensitive to your decision procedure. If you are the kind of person who will choose X, then the predictor is likely to have predicted that and put 100 in the opaque box. Thus, choosing X is a symptom of being the kind of person that the predictor expects to choose X, which causes the 100 to be there.
     - In Game 2, the marker is not sensitive to your choice. It is fixed by the common cause and the random draw. Your choice is also influenced by the common cause, but there is no causal link from your choice to the marker. The marker is fixed independently.

  4. When a student announces they will flip a coin, they are making the decision random. In Game 1, this will make the predictor's accuracy drop to 50% (if the predictor is using the questionnaire, which doesn't capture the coin flip). Then the expected utility of X and Y become:
     - EU(X) = 0.5*100 + 0.5*0 = 50
     - EU(Y) = 0.5*101 + 0.5*1 = 51
     So they would then choose Y and get 51 on average, which is better than 50, but much worse than 85 if they had chosen X without randomizing.

     In Game 2, flipping a coin doesn't change the EU calculation because the marker is fixed and not affected by the choice. So EU(X)=85, EU(Y)=86, and they should choose Y.

  5. In the third vote, we expect more students to be willing to pay for the intervention in Game 1 than in Game 2, because in Game 1, becoming an X-chooser causes (through the predictor) the state to be B (i.e., prediction X) with high probability, while in Game 2, becoming an X-chooser does not cause the marker to be B.

  **Failure Modes:**

  1. **Students naming decision theories early:** 
     - How to handle: Acknowledge that they are familiar with the theories, but ask them to suspend judgment and play the games as if they were real. Emphasize that the games are designed to be experienced, not just theorized.

  2. **Students trying to game the predictor in Game 1:**
     - Since the prediction is based on the questionnaire at the beginning, and the students don't know what it's for, they might answer randomly or strategically. 
     - How to handle: In the instructions, you can say: "Answer the questionnaire honestly, as if it were a real psychological assessment." Also, note that if they try to game it without knowing the rule, it might backfire.

  3. **A student refusing to play:**
     - How to handle: Allow them to not play, but ask them to participate as an observer. They can still vote and discuss. If the objection is about the predictor's legitimacy, explain that it's a real predictor with a known accuracy, and we are using a simple method.

  4. **Split vote calcifying:**
     - How to handle: Use the private ballots to gather the data, and then in the debrief, focus on the EU calculations and the causal diagrams. Show that the difference in EU between the two games comes from the causal structure. Avoid letting the discussion become a debate between two camps; instead, focus on the data from the games.

  5. **85% vs. near-perfect predictor:**
     - The classic Newcomb problem uses a near-perfect predictor. With 85%, the EU for one-boxing is 85 and for two-boxing is 16, so one-boxing is still better but not by as much. The qualitative point remains. You can say: "In the classic problem with a near-perfect predictor, the EU for one-boxing is almost 100 and for two-boxing is almost 1, so the difference is even more stark."

  **Limitations:**

  1. **The activity produces choices but not a verdict:** The point is to experience the conflict, not to resolve it.

  2. **The metaphysics of what the predictor is sensitive to:** We cannot make the predictor perfect or show the counterfactual dependence. This must be explained.

  3. **The idealization to a near-perfect predictor:** We use 85% for practicality, but the classic argument uses near-perfect. We can only approximate.

  4. **One-shot play:** With 16 students, we cannot show the long-run difference between strategies. You must explain that if you played many times, the one-boxer would do better in Game 1, but in Game 2, the two-boxer does slightly better.

  5. **Causal structure is not directly visible:** We represent it with words, not with a formal diagram. You might draw causal graphs during the debrief.

  **What to say if they demand the correct answer:**
  - "There isn't a single correct answer that everyone agrees on. The point is to understand why rational people might choose differently in these two structurally similar situations. The key is the causal structure and whether your choice can influence the state (as in the predictor's sensitivity) or not."

  This packet provides the materials and structure for the session. It is designed to fit within 75 minutes and to provoke the intended discussion.
answer: |-
  ### Facilitator's Packet: Rational Choice Seminar Activity  
  **Session Goal:** Reignite the Newcomb disagreement through two live games with identical probabilities/payoffs but different causal structures, followed by a debrief mapping choices to the underlying dispute.  

  ---

  ### **Materials Needed**  
  - 16 copies of Questionnaire (Game 1)  
  - 32 envelopes (16 for Game 1 predictions, 16 for Game 2 markers)  
  - 16 blank slips for random draws (Game 2)  
  - 3 sets of ballots (Game 1, Game 2, Third Vote)  
  - Prize tokens (e.g., homework passes worth 1 point each; 100 points = 1 token)  
  - Timer  
  - Dice (for medical marker randomization)  

  ---

  ### **Game 1: The Prediction Game**  
  **Objective:** Real-world Newcomb problem with an 85% accurate predictor.  
  **Handout (Photocopy for Students):**  

  > **INSTRUCTIONS: THE PREDICTION GAME**  
  > You will make a choice with real points at stake. Points convert to prizes (e.g., 100 points = 1 homework pass).  
  >   
  > **HOW IT WORKS:**  
  > - **Opaque Box:** Contains **100 points** or **0 points**.  
  > - **Transparent Box:** Always contains **1 point**.  
  > - **Your Choice:**  
  >   - **Option X:** Take ONLY the opaque box.  
  >   - **Option Y:** Take BOTH boxes.  
  >   
  > **THE PREDICTOR:**  
  > - Before you chose, a predictor estimated your choice. It is **85% accurate** (right 17 of 20 times).  
  > - **If it predicted X**, the opaque box has 100 points.  
  > - **If it predicted Y**, the opaque box has 0 points.  
  >   
  > **PREDICTION METHOD (VERIFIABLE):**  
  > - Your answers to the opening questionnaire were scored (1 point per risk-tolerant answer).  
  > - Score ≥ 3: Predictor guessed **X** (take only opaque box).  
  > - Score < 3: Predictor guessed **Y** (take both boxes).  
  > - Predictions are sealed in envelopes. You may inspect envelopes/calculations after the game.  
  >   
  > **YOUR PAYOFF:**  
  > | Your Choice | Predictor X (100 in opaque) | Predictor Y (0 in opaque) |  
  > |-------------|------------------------------|------------------------------|  
  > | **X**       | 100 points                  | 0 points                    |  
  > | **Y**       | 100 + 1 = 101 points        | 0 + 1 = 1 point             |  
  >   
  > **YOUR TASK:**  
  > Choose **X** or **Y** privately. Write your choice on the ballot.  

  **Facilitator Setup (5 min):**  
  1. At session start, distribute **Questionnaire** (5 questions, 1 min total):  
     > 1. Would you accept a 50% chance of losing $10 for a 50% chance of gaining $20? (Yes=1, No=0)  
     > 2. Would you skip a guaranteed $15 for a 10% chance at $200? (Yes=1, No=0)  
     > 3. If you found $100, would you save it (0) or spend it immediately (1)?  
     > 4. Would you quit a stable job for one with high risk/high reward? (Yes=1, No=0)  
     > 5. Do you prefer adventurous vacations over relaxing ones? (Yes=1, No=0)  
     > **Score = Sum (0–5).**  
  2. Score questionnaires: **≥3 = Predict X, <3 = Predict Y**. Seal predictions in envelopes labeled with student names.  

  ---

  ### **Game 2: The Medical Marker Game**  
  **Objective:** Same probabilities/payoffs as Game 1, but state is a medical marker fixed by a common cause.  
  **Handout (Photocopy for Students):**  

  > **INSTRUCTIONS: THE MEDICAL MARKER GAME**  
  > You will make a choice with real points at stake (same prizes as Game 1).  
  >   
  > **HOW IT WORKS:**  
  > - A medical test reveals if you have **Marker A** (costs 100 points to treat) or **Marker B** (costs 0 points).  
  > - **Marker status is already fixed** and sealed in an envelope.  
  > - **Your Choice:**  
  >   - **Option X:** Skip a pleasant option. Receive **0 points**.  
  >   - **Option Y:** Take the pleasant option. Receive **1 point**.  
  >   
  > **MARKER PROBABILITIES (VERIFIABLE):**  
  > - Your questionnaire score determined your "genetic type" (same as Game 1).  
  > - Type H (Score ≥ 3): 85% chance of Marker A, 15% Marker B.  
  > - Type L (Score < 3): 15% chance of Marker A, 85% Marker B.  
  > - We rolled dice to assign your marker (check envelopes after the game).  
  >   
  > **YOUR PAYOFF:**  
  > | Your Choice | Marker A (100-point cost) | Marker B (0-point cost) |  
  > |-------------|----------------------------|--------------------------|  
  > | **X**       | 0 - 100 = **-100 points** | 0 - 0 = **0 points**     |  
  > | **Y**       | 1 - 100 = **-99 points**  | 1 - 0 = **1 point**      |  
  >   
  > **EQUIVALENCE TO GAME 1 (DO NOT REVEAL UNTIL DEBRIEF):**  
  > - Marker B = Predictor X (100-point state).  
  > - Marker A = Predictor Y (0-point state).  
  > - Payoffs match Game 1 exactly (e.g., Y + Marker B = 1 point + 100 = 101).  
  >   
  > **YOUR TASK:**  
  > Choose **X** or **Y** privately. Write your choice on the ballot.  

  **Facilitator Setup (5 min):**  
  1. Use **same questionnaire scores** as Game 1 for "genetic type."  
  2. For each student: Roll a 20-sided die.  
     - **Type H (Score ≥ 3):** 1–17 = Marker A, 18–20 = Marker B (85% A).  
     - **Type L (Score < 3):** 1–3 = Marker A, 4–20 = Marker B (85% B).  
  3. Seal markers in envelopes labeled with student names.  

  ---

  ### **Ballots (Private, Anonymous)**  
  **Game 1 Ballot:**  
  > Name: ______  
  > I choose: [ ] X (only opaque) or [ ] Y (both boxes)  

  **Game 2 Ballot:**  
  > Name: ______  
  > I choose: [ ] X (skip pleasant) or [ ] Y (take pleasant)  

  **Third Vote Ballot (After Games 1 & 2):**  
  > Name: ______  
  > 1. In **Game 1**, would you pay 10 points for an intervention making you **always choose X**? [ ] Yes [ ] No  
  > 2. In **Game 2**, would you pay 10 points for an intervention making you **always choose X**? [ ] Yes [ ] No  

  ---

  ### **Timeline (75 Minutes Total)**  
  **0–5 min:**  
  - Distribute **Questionnaire**. Say: *"Answer honestly; this is for a later exercise."* Collect and score.  

  **5–10 min:**  
  - **Game 1 Setup:** Announce prediction method. Seal predictions in envelopes.  
  - **Game 2 Setup:** Assign markers using dice. Seal markers in envelopes.  

  **10–15 min:**  
  - Distribute **Game 1 Handout & Ballot**. Say: *"Make your choice privately. Do not discuss."*  

  **15–20 min:**  
  - Collect Game 1 ballots.  

  **20–25 min:**  
  - Distribute **Game 2 Handout & Ballot**. Say: *"This is a separate medical decision. Do not connect to Game 1."*  

  **25–30 min:**  
  - Collect Game 2 ballots.  

  **30–35 min:**  
  - Distribute **Third Vote Ballot**. Say: *"Answer based on your experience in each game."* Collect immediately.  

  **35–60 min: DEBRIEF**  
  - **Reveal predictions/markers** and calculate payoffs.  
  - **Show aggregate results** (votes for X/Y in each game, intervention votes).  
  - **Map to disagreement:**  
    1. **"State is fixed, take the point" argument:**  
       - In both games, students said: *"Marker/prediction is sealed, so I took Y for the extra point."*  
       - **Cost:** Game 1 EU(Y) = 16 vs. EU(X) = 85 → **-69 points**.  
         Game 2 EU(Y) = 86 vs. EU(X) = 85 → **+1 point**.  
    2. **Causal structure explains the difference:**  
       - **Game 1 (Prediction):** Your choice *symptomizes* the predictor’s guess. Choosing X is evidence you’re an "X-chooser," which *caused* the 100 points.  
       - **Game 2 (Medical):** Marker and choice share a cause (questionnaire score), but your choice *does not affect* the marker.  
       - Key: *"Is the state sensitive to your decision process?"* (Yes in Game 1, no in Game 2).  
    3. **Coin-flip demo (Use a volunteer):**  
       - If a student randomizes choice in Game 1, predictor accuracy drops to ~50% (questionnaire can’t anticipate randomness).  
       - EU(X) ≈ 50, EU(Y) ≈ 51 → Choosing Y now *gains* 1 point, but destroys the 69-point advantage of being an X-chooser.  
    4. **Intervention vote:**  
       - Paying to become an X-chooser is rational in Game 1 (causal link) but not Game 2 (no causal link).  

  **60–75 min: WRAP-UP**  
  - **Failure modes** (see below) and **limitations** (see below).  
  - **Closing:** *"This doesn’t solve Newcomb—it shows why the dispute persists. Causal structure changes everything, even when probabilities/payoffs match."*  

  ---

  ### **Predictable Failure Modes & Solutions**  
  1. **Students name decision theories early (e.g., "This is Newcomb! I’m one-boxing!"):**  
     - *Solution:* Say: *"Suspend theory for now. Treat this as a real choice with real stakes—play as you would if this were true life."* Redirect to the ballot.  

  2. **Students try to "game" the predictor (e.g., purposely fail questionnaire):**  
     - *Solution:* Emphasize: *"You answered the questionnaire blind. Gaming it now is impossible—the prediction is already sealed."* Verify envelopes if challenged.  

  3. **Student refuses to play (e.g., "Predictor isn’t perfect!" or "This feels unfair"):**  
     - *Solution:* Say: *"You can abstain, but you’ll miss the experiential insight. The predictor is 85% accurate—real-world decisions are rarely perfect."* Offer observer role.  

  4. **Votes split 50/50 and debate deadlocks:**  
     - *Solution:* Focus debrief on **EU calculations and causal graphs** (draw during debrief). Say: *"Don’t debate—look at the numbers. Why did the same choice lose 69 points in Game 1 but gain 1 in Game 2?"*  

  5. **85% predictor ≠ near-perfect demon from readings:**  
     - *Solution:* Preempt in debrief: *"With 85% accuracy, one-boxing still dominates (85 vs. 16), but the gap shrinks. With a perfect predictor, it would be 100 vs. 1—same principle."*  

  ---

  ### **Limitations & Unrecoverable Gaps**  
  **What This Activity CANNOT Do (Must Be Explained):**  
  1. **Produce a verdict:** Students will leave split. The goal is to **expose the dispute**, not resolve it.  
  2. **Clarify "predictor sensitivity" metaphysics:** The idea that predictors track your *decision process* (not just acts) must be stated: *"Game 1’s predictor responds to your psychology. Game 2’s marker doesn’t care how you choose."*  
  3. **Simulate a near-perfect predictor:** 85% is practical, but the literature’s 99.9% idealization changes nothing qualitatively—state this.  
  4. **Show long-run strategy dominance:** One-shot play can’t demonstrate that one-boxing wins over time. Explain: *"If we repeated Game 1, one-boxers would outearn two-boxers."*  
  5. **Replicate "common cause vs. no cause" perfectly:** Game 2 has a common cause; Game 1 has predictive sensitivity. Emphasize: *"The key isn’t causality per se—it’s whether the state is *counterfactually dependent* on your decision method."*  

  **Minimal Verbal Supplements:**  
  - During debrief: *"Game 1’s state is sensitive to your decision algorithm. Game 2’s isn’t—it’s set independently."*  
  - At close: *"No ‘answer’ exists—philosophers still debate this. But now you’ve felt why."*  

  ---  
  **Final Note:** This session creates cognitive friction, not consensus. It forces students to confront the causal nuances behind Newcomb’s enduring puzzle. Use disagreements as fuel for the debrief. No readings needed—the experience is the text.
