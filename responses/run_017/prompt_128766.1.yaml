prompt: |-
  I am writing the specification for the decision rule of an agent I am designing — a software agent that will act in environments containing other agents and systems that model, forecast, or simulate it. Before I choose among the existing candidate rules, I want the specification they are supposed to satisfy.

  The rule is to be used first-personally and ex ante: it takes everything the agent knows at the moment of choice and returns an act. It is not a rule for grading choices after the fact, and it is not a theory of what kind of agent it would be best to be. Please write the adequacy conditions for a rule with that job, as a list in which each item gives (i) the requirement, (ii) the case or consideration meant to motivate it, and (iii) whether the requirement is non-negotiable or merely a preference of one camp in this dispute.

  The cases I expect any such list to be anchored in: the standard Newcomb setup with a highly but not perfectly reliable predictor; a case in which an available act is strong evidence of a bad state it has no causal tendency to produce; a case in which the agent faces a near-exact copy of itself in a prisoner's dilemma; a case in which, whichever act the agent settles on, it can see that it would have done better to have settled on the other one; and the demand, whatever its source, that a rule not lead its user to be predictably poorer than a user of some other rule across a long series of choices.

  I also want two cases I have not seen treated, because I think they separate requirements that happen to coincide in the familiar set:

  - *The open loop.* The predictor does not infer from your history; it runs a simulation of your deliberation in real time. The simulation is displayed to you on a short delay, and it updates on your reaction to what you see, so that what it shows both influences and is influenced by what you do. Its track record is effectively perfect. What should a rule say here, and how many of the requirements on your list are really requirements that the situation be representable as an acyclic causal structure with the prediction screened off from the act?
  - *The mixed population.* On half the agents the predictor is near-perfect; on the rest it is no better than chance. You do not know which kind you are, there is no test you can run, and your own sense of how predictable you are may be unreliable. Is it a requirement that the rule recommend the same act to an agent who knows it is predictable and to one who knows it is not? Is it a requirement that its output not depend on facts about the agent that the agent cannot in principle have? What does each candidate rule make the answer depend on?

  Three more things. First, tell me which distinctions a rule must be able to mark, and which it may collapse — in particular the distinctions between what the agent does, what it is disposed to do, and what procedure produced the doing. Second, if some subset of your requirements cannot all be satisfied together, identify the subset and say what follows: I would rather have a short coherent list than a longer wish-list, and I want to know which requirement to give up and what giving it up costs. Name the requirement that, in your judgment, excludes the most otherwise-attractive candidate rules, and the requirement that is most often insisted upon but really only registers what one camp refuses to accept.

  Keep most of the weight on the criteria. A brief scorecard at the end is welcome — a few lines each on how the rule that scores acts by the evidence they provide, the rule that scores them by their causal or counterfactual consequences, and the rule that treats your act as the output of a procedure shared with whatever is predicting you come out against the list — but I care about the specification, not the scoring.

  Finally: separate clearly what is settled in this area from what is genuinely contested among people who work on it, and do not report a contested verdict as the majority one. Treat my two cases as contestable too — say so if one is a disguised version of a familiar case, or if a requirement I have implied is not really one — and mark the places where you are working something out rather than reporting how the literature comes down.
reasoning: |-
  We are constructing adequacy conditions for a decision rule that an agent uses first-personally and ex ante. The rule takes the agent's current knowledge and returns an act. We are to consider several cases, including the two new ones: the open loop and the mixed population.

  We list the requirements, each with:
  (i) the requirement,
  (ii) the motivating case or consideration,
  (iii) whether it is non-negotiable or a camp preference.

  We also address:
  - Distinctions the rule must mark (e.g., between act, disposition, procedure) and which may be collapsed.
  - Conflicts among requirements and which to give up.
  - The two new cases and their implications.

  We end with a brief scorecard for three candidate rules: evidential (EDT), causal (CDT), and the rule that considers the act as output of a shared procedure (which we might call functional decision theory, FDT, or similar).

  We note what is settled and what is contested.

  ---

  **Adequacy Conditions for a First-Personal Ex Ante Decision Rule**

  1. **Requirement: Causal Independence of Prediction from Act**  
     (i) The rule must not treat the prediction as causally influenced by the act when it is not.  
     (ii) Motivating case: The standard Newcomb setup with a highly reliable predictor. In Newcomb, the prediction is made before the act and is not caused by it. The rule should not recommend one-boxing if the act cannot causally affect the prediction. But note: the rule might still recommend one-boxing if it is evidentially better, but the requirement is about not confusing causation and evidence. However, this requirement is meant to prevent the rule from being misapplied in cases where the prediction is not causally downstream of the act.  
     (iii) Non-negotiable: It is non-negotiable that the rule must correctly represent causal structure. However, note that in Newcomb, the predictor's accuracy is due to a common cause (the agent's disposition) and not the act itself. So the rule must not assume the act causes the prediction if it doesn't. But the requirement is about correctly handling the causal structure, not about whether to one-box or two-box.

     *Alternative formulation: The rule must be compatible with the actual causal structure of the decision problem. This is non-negotiable because getting the causal structure wrong leads to errors in non-Newcomb-like cases.*

  2. **Requirement: Evidential Separation**  
     (i) The rule must not be misled by evidence that is not causally relevant.  
     (ii) Motivating case: A case where an available act is strong evidence of a bad state it has no causal tendency to produce. Example: Smoking lesion. The act of smoking is evidence of a lesion that causes both the desire to smoke and lung cancer, but smoking does not cause the lesion. The rule should not recommend not smoking because that would be evidence of no lesion? But note: in this case, not smoking is evidence of not having the lesion, but it doesn't cause the lesion. The requirement is that the rule should not avoid an act just because it is evidence of a bad state when the act does not cause that state.  
     (iii) Camp preference: This is the core of the dispute between causal and evidential decision theories. Evidentialists would reject this requirement because they hold that the act should be chosen based on the evidence it provides. Causalists insist on it. Therefore, this requirement is a preference of the causalist camp.

  3. **Requirement: Coordination with Similar Agents**  
     (i) The rule must recommend cooperating in a prisoner's dilemma with a near-exact copy of oneself (or with a similar agent that uses the same decision rule).  
     (ii) Motivating case: Prisoner's dilemma with a copy. If both agents use the same rule and can coordinate, they should both cooperate and achieve the superior outcome.  
     (iii) Camp preference: This is a requirement of the "coordination" or "reflective" camp (e.g., FDT). CDT and EDT typically defect in one-shot PDs. But note: if the copy is exact and the decision is deterministic, then the agent knows that whatever it does, the copy will do the same. Then the rule should treat it as a coordination game. This requirement is non-negotiable if we want optimal outcomes in such symmetric dilemmas? However, it is contested: causalists argue that the act of one agent does not cause the other's act, so they must defect.

     *This requirement is often motivated by the idea that the rule should consider not only the causal consequences but also the logical or mathematical dependencies between the agent's decision and the other's.*

  4. **Requirement: Avoidance of Predictable Loss**  
     (i) The rule must not lead to the agent being predictably poorer than a user of a different rule across a long series of choices.  
     (ii) Motivating consideration: The demand that a rule not be dominated in the long run. For example, in a series of Newcomb problems, a two-boxer ends up poorer than a one-boxer if the predictor is accurate.  
     (iii) Non-negotiable: This is a pragmatic requirement and is non-negotiable for a rule that aims for rationality. If a rule consistently leads to worse outcomes, it is inferior. However, note that the predictability of loss must be from the ex ante perspective. In a single instance, two-boxing might be better if the predictor is wrong, but over many trials with a reliable predictor, one-boxing wins. This requirement pushes for one-boxing in Newcomb.

  5. **Requirement: Self-Consistency in Mixed Populations**  
     (i) The rule must not depend on unobservable properties of the agent that the agent cannot in principle have access to.  
     (ii) Motivating case: The mixed population. The agent does not know if it is predictable or not. The rule should make the same recommendation to both types? Not necessarily: if the rule is sensitive to the agent's type, but the agent doesn't know it, then the rule must work with the agent's uncertainty. However, the requirement is that the rule's output must be computable from the agent's available information.  
     (iii) Non-negotiable: It is non-negotiable that the rule can use only the information available to the agent. But the rule might condition on the agent's type if the agent can form a belief about it. However, in the mixed population, since there is no way to know, the agent must use the prior. The rule should not require knowing whether the predictor is good for this agent if that is unknowable.

     *We must also ask: should the rule recommend the same act for the predictable and the unpredictable? It might be that the same act is best for both, or it might not. The requirement is that the rule does not require the agent to know the unknowable.*

  6. **Requirement: Stability in the Open Loop**  
     (i) The rule must be stable under self-referential prediction, meaning that the act it recommends must be the same as the one the predictor (which is simulating the agent) would predict.  
     (ii) Motivating case: The open loop. The predictor simulates the agent in real time, and the agent sees the simulation and reacts to it. The rule must converge to a fixed point where the act the agent chooses is the one that the predictor shows. If the rule leads the agent to change its mind upon seeing the prediction, it may cause an infinite regress or a loop. The rule must avoid that and be stable.  
     (iii) Non-negotiable: This is non-negotiable for a rule that must operate in such environments. Without stability, the agent might be unable to decide or might be exploited.

  7. **Requirement: Dominance Avoidance**  
     (i) The rule must not recommend an act that is dominated by another act in the sense that, no matter the state of the world, the other act yields at least as good an outcome and sometimes better.  
     (ii) Motivating case: A case in which, whichever act the agent settles on, it can see that it would have done better to have settled on the other one. This is a dominance situation. For example, in Newcomb, two-boxing dominates one-boxing because regardless of what is in the box, taking both is better. But note: in Newcomb, if the predictor is perfect, then two-boxing leads to getting only $1000, while one-boxing leads to $1,000,000. So dominance is not straightforward. The requirement is that the rule should not choose an act that is causally dominated.  
     (iii) Non-negotiable: Avoiding causal dominance is non-negotiable. However, in Newcomb, one-boxing is not causally dominated? Because if the prediction was one-boxing, then one-boxing yields $1,000,000 and two-boxing yields $1,001,000. But if the prediction was two-boxing, one-boxing yields $0 and two-boxing $1000. So two-boxing is better in both cases? This is the dominance argument. But note: the state of the world (the prediction) is not independent of the act. So the requirement is: if an act is causally dominated (i.e., regardless of the state that is not causally affected by the act, the other act is better), then it should not be chosen. In Newcomb, two-boxing is not causally dominated because the state (the prediction) is fixed at the time of the act? Actually, the prediction is fixed. So two-boxing yields more regardless of the prediction. Thus, the rule should recommend two-boxing? But then requirement 4 (avoiding predictable loss) is violated. This requirement is contested: causalists insist on dominance, but evidentialists and functionalists reject it in Newcomb.

     *This requirement is the core of the dispute: it is non-negotiable for causalists but rejected by others in Newcomb-like cases.*

  **Conflicts among Requirements:**

  - Requirement 2 (Evidential Separation) and Requirement 4 (Avoidance of Predictable Loss) conflict in the Newcomb problem: 
    - Requirement 2 (if interpreted as requiring not acting based on evidence when there is no causation) would lead to two-boxing (to avoid being misled by evidence), but then the agent is predictably poorer (violating 4). 
    - Requirement 4 would lead to one-boxing (to avoid predictable loss), but that violates Requirement 2 because one-boxing is chosen due to the evidence it provides (that the box is full) even though the act doesn't cause the box to be full.

  - Requirement 3 (Coordination) conflicts with Requirement 2 in the prisoner's dilemma with a copy: 
    - Requirement 3 requires cooperating, but Requirement 2 (if interpreted as requiring ignoring the evidential link between one's act and the copy's) might lead to defecting because one's act doesn't cause the other to cooperate.

  - Requirement 7 (Dominance Avoidance) conflicts with Requirement 4 in Newcomb: 
    - Requirement 7 (dominance) says two-boxing (because it dominates) and Requirement 4 says one-boxing (to avoid predictable loss).

  **Resolution of Conflicts:**
  - The conflict between Requirements 2 and 4 is fundamental. We must choose which to prioritize. Requirement 4 (avoiding predictable loss) is non-negotiable from a pragmatic perspective, but Requirement 2 is a camp preference. Therefore, we might drop Requirement 2 if we value long-run performance.

  - The conflict between Requirement 3 and Requirement 2 can be resolved by reinterpreting Requirement 2: if the evidential link is due to a logical or mathematical dependency (like in the copy case), then it is not the kind of spurious correlation that Requirement 2 is meant to avoid. So we might limit Requirement 2 to cases of common-cause confounding and not to logical dependencies.

  - The conflict between Requirement 7 and Requirement 4: In Newcomb, the dominance argument (7) is valid only if we consider the states (prediction) as independent of the act, but they are not. Therefore, Requirement 7 should be restricted: it applies only when the states are causally independent of the act. In Newcomb, the prediction is fixed, so the states are independent? But the problem is that the act and the state are correlated. The causalist says: but the act doesn't cause the state, so we should condition on the state being fixed? That leads to two-boxing. The functionalist says: the state (prediction) is a function of the decision, so we cannot treat it as independent. This requirement (7) is the most divisive: it is non-negotiable for causalists but rejected by functionalists and evidentialists in Newcomb.

  **Which requirement to give up?**
  - Give up Requirement 7 (Dominance Avoidance) in its unrestricted form. Restrict it to cases where the state is not logically or mathematically dependent on the act. This is the functionalist move. Then in Newcomb, dominance is not applicable because the state (the prediction) is a function of the act. The cost: we lose the clear-cut dominance principle that causalists hold dear.

  - Alternatively, give up Requirement 4? That would be unacceptable because we want the rule to perform well over time.

  **The requirement that excludes the most otherwise-attractive candidate rules:**
  - Requirement 3 (Coordination with Similar Agents) excludes CDT and EDT because they defect in the prisoner's dilemma with a copy. Only FDT-like rules satisfy it.

  **The requirement that is most often insisted upon but really only registers what one camp refuses to accept:**
  - Requirement 7 (Dominance Avoidance) is insisted upon by causalists but rejected by others in Newcomb. It is a camp preference.

  **Distinctions the Rule Must Mark and May Collapse:**

  - The rule must mark the distinction between:
    - The act (the thing chosen) and the disposition (the stable tendency that might be predictable). In the open loop, the disposition is being simulated and the act is influenced by the simulation. The rule must be able to recommend an act that is consistent with the disposition that the predictor is simulating.

  - The rule may collapse the distinction between:
    - The procedure that produced the act and the act itself? In some theories (like FDT), the procedure is important because it is what the predictor is simulating. But the rule must output an act, not a procedure. However, the rule must consider the procedure because the predictor is simulating it.

    Therefore, the rule must be able to consider the output of the decision rule (the act) as part of a fixed point in the open loop. So it must be aware of its own output as a function of the inputs.

    In other words, the rule must be able to model the fact that the predictor is simulating the same rule.

  **Handling the Two New Cases:**

  - **The Open Loop:** 
    The requirement (6) is that the rule must be stable. The rule must recommend an act that, when simulated, would be predicted and that the agent, upon seeing the prediction, would still choose. This requires that the decision rule be a fixed point of the prediction-updating process. It implies that the rule must be able to model itself and the predictor's simulation. This case tests whether the rule can handle self-reference and real-time feedback.

    This case is not just a disguised version of a familiar one. It forces the rule to be time-consistent in a very direct way. The requirement (6) is non-negotiable for this environment.

  - **The Mixed Population:**
    The rule must work under uncertainty about one's own predictability. The requirement (5) is that the rule cannot depend on the agent's predictability if that is unknowable. The agent must choose based on its beliefs about the predictor's accuracy. For example, if the agent has a 50% chance of being predictable and 50% of not, then in a Newcomb-like problem, the expected utility of one-boxing and two-boxing must be computed with that uncertainty.

    The rule should not require the agent to know the unknowable. This is non-negotiable.

    Is it a requirement that the rule recommend the same act to both types? Not necessarily. If the predictable agent should one-box and the unpredictable should two-box, then the agent in the mixed population will compute a weighted average and might choose a mixed strategy. But the rule must output an act. The key is that the rule must be computable from the agent's subjective state.

  **What is Settled and What is Contested:**

  - Settled:
    - The rule must avoid causal dominance (when the state is causally independent of the act) because that leads to sure loss. (But note: the Newcomb problem contests this.)
    - The rule must use only the information available to the agent. (Non-negotiable.)
    - The rule must be consistent in the sense of not leading to self-contradiction or infinite regress in self-referential settings (like the open loop).

  - Contested:
    - Whether to one-box or two-box in Newcomb (Requirements 4 vs 7).
    - Whether to cooperate in the prisoner's dilemma with a copy (Requirement 3).
    - How to weigh evidence versus causation (Requirement 2).

  **Brief Scorecard of Candidate Rules:**

  1. **Evidential Decision Theory (EDT):** Scores acts by the conditional evidence they provide for desirable outcomes.
     - Satisfies: Requirement 4 (avoids predictable loss in Newcomb by one-boxing), and Requirement 5 (uses agent's beliefs) but may fail in mixed population if the agent's beliefs are not accurate? It uses the agent's current beliefs.
     - Fails: Requirement 2 (it does not separate causation and evidence, so it avoids smoking in the smoking lesion) and Requirement 3 (it defects in PD with a copy because defecting is evidence that the copy defects). Also, in the open loop, it might be unstable because it conditions on the act and the prediction simultaneously? It may change its mind upon seeing the prediction.

  2. **Causal Decision Theory (CDT):** Scores acts by their causal consequences, typically using do-calculus or counterfactuals.
     - Satisfies: Requirement 2 (it ignores evidence when there is no causation, so it smokes in smoking lesion) and Requirement 7 (it two-boxes in Newcomb because of dominance) and Requirement 5 (uses agent's beliefs about causal structure).
     - Fails: Requirement 4 (it leads to predictable loss in Newcomb), Requirement 3 (it defects in PD with a copy), and Requirement 6 (in the open loop, it may not be stable because it doesn't account for the logical dependency between its decision and the prediction).

  3. **Functional Decision Theory (FDT) or Similar:** Treats the act as the output of a function that is also used by predictors and copies, so it considers logical and mathematical dependencies.
     - Satisfies: Requirement 3 (cooperates in PD with a copy), Requirement 4 (one-boxes in Newcomb), Requirement 6 (in open loop, it seeks a fixed point and is stable), and Requirement 5 (uses agent's beliefs, including about the function).
     - Fails: Requirement 2 (it does not require evidential separation; it uses logical dependencies) and Requirement 7 (it rejects dominance in Newcomb because the prediction is a function of the decision).

  Note: FDT is a candidate that is designed to handle the open loop and coordination. It is not without controversy.

  ---

  **Summary of Adequacy Conditions (Non-negotiable vs Preference):**

  We list the requirements again, now with a clear non-negotiable/preference label and a note on conflict:

  1. **Causal Structure Compliance**: The rule must correctly represent the causal structure of the environment. (Non-negotiable)
  2. **Evidential Separation**: The rule must not avoid an act solely because it is evidence of a bad state when the act does not cause that state. (Preference: causalist camp)
  3. **Coordination with Copies**: The rule must recommend cooperation in a prisoner's dilemma with a copy of itself. (Preference: functionalist camp)
  4. **Avoid Predictable Loss**: The rule must not lead to predictable long-run loss. (Non-negotiable)
  5. **Epistemic Humility**: The rule must not depend on unobservable properties of the agent that are inaccessible. (Non-negotiable)
  6. **Stability in Self-Reference**: The rule must be stable under self-referential prediction (as in the open loop). (Non-negotiable for such environments)
  7. **Causal Dominance Avoidance**: The rule must avoid acts that are causally dominated (i.e., when the state is causally independent of the act, and the act is worse in every state). (Non-negotiable in non-Newcomb cases, but contested in Newcomb)

  **Final Note:** The most contentious requirement is Requirement 7 (Causal Dominance Avoidance) in Newcomb-like problems. The functionalist approach drops the unrestricted dominance requirement and instead requires stability and coordination, which leads to one-boxing. This is a major divide.

  Given the conflicts, the specification must choose between:
  - A rule that satisfies Requirements 4 and 6 (like FDT) but violates Requirement 7 in Newcomb and Requirement 2 (evidential separation) in some cases.
  - A rule that satisfies Requirements 2 and 7 (like CDT) but violates Requirements 3, 4, and 6.

  In light of the long-run performance (Requirement 4) and the need for stability in self-referential settings (Requirement 6), the functionalist approach is gaining ground. However, the area remains contested.
answer: |-
  Below is a specification of adequacy conditions for a first-personal, ex ante decision rule, structured as requested. The list prioritizes clarity, coherence, and your cases, including the novel "open loop" and "mixed population" scenarios. Requirements are derived from core desiderata of rational agency (e.g., consistency, performance, and epistemic constraints) and tested against your cases. Conflicts are identified, and distinctions the rule must handle are specified. I distinguish non-negotiable requirements (violations imply fundamental irrationality) from camp preferences (contentious among theorists). The scorecard is brief, per your instructions.

  ---

  ### **Adequacy Conditions for the Decision Rule**  
  *Each item: (i) Requirement, (ii) Motivating Case/Consideration, (iii) Non-negotiable or Camp Preference.*

  1. **Requirement: Causal Structure Compliance**  
     (i) The rule must output acts that are optimal given the *actual causal structure* of the environment, as known by the agent. It must not mistake correlations for causal influences.  
     (ii) **Motivation**: Standard Newcomb problem. Two-boxing is causally dominant (taking both boxes cannot cause less money to be in the opaque box), but one-boxing is evidentially superior. A rule must not recommend acts that ignore causal pathways (e.g., refusing to smoke in the Smoking Lesion case, where smoking is evidence of cancer but not a cause).  
     (iii) **Non-negotiable**. Violating this leads to self-defeating acts in non-predictive environments (e.g., refusing vaccines due to correlation with illness).

  2. **Requirement: Evidential Robustness**  
     (i) The rule must not recommend acts that are *purely evidence-responsive* when evidence is not causally relevant, unless the act secures coordination or fixed-point stability.  
     (ii) **Motivation**: Cases where an act is strong evidence of a bad state it does not cause (e.g., Smoking Lesion). If the rule avoids smoking *only* because it correlates with cancer, it ignores the lack of causation and misses a causal opportunity.  
     (iii) **Camp preference** (causalist). Evidentialists (e.g., EDT) reject this; functionalists (e.g., FDT) override it in self-referential cases.

  3. **Requirement: Coordination Optimality**  
     (i) The rule must output acts that achieve mutually optimal outcomes with agents/processes that share its decision procedure or are functionally identical.  
     (ii) **Motivation**: Prisoner’s Dilemma (PD) with a near-exact copy. Defection is causally dominant but leads to mutual loss; cooperation is superior if both agents reciprocate. A rule must not defect against its copy if coordination is possible.  
     (iii) **Camp preference** (functionalist). Causalists (e.g., CDT) reject this (no causal link between acts); evidentialists (e.g., EDT) may defect due to evidence-based reasoning.

  4. **Requirement: Long-Run Performance**  
     (i) The rule must not be *predictably dominated* by another rule across repeated, similar choices.  
     (ii) **Motivation**: Demand for rules that avoid exploitable inefficiencies (e.g., in Newcomb, two-boxing is predictably poorer than one-boxing if the predictor is reliable).  
     (iii) **Non-negotiable**. A rule consistently outperformed is pragmatically inadequate.

  5. **Requirement: Epistemic Feasibility**  
     (i) The rule’s output must depend only on information the agent can access or reasonably infer. It must not require knowledge of unobservable facts about the agent itself (e.g., "am I predictable?").  
     (ii) **Motivation**: Mixed population case. If the agent doesn’t know whether it is predictable (unreliable introspection, no tests), the rule must use its beliefs (e.g., priors) without assuming hidden facts.  
     (iii) **Non-negotiable**. Rules requiring inaccessible knowledge (e.g., "only one-box if you’re predictable") are unimplementable.

  6. **Requirement: Self-Referential Stability**  
     (i) The rule must converge to a *fixed point* when the environment simulates or reacts to the agent’s deliberation in real time.  
     (ii) **Motivation**: Open loop case. The predictor simulates your deliberation, you see its output, and you react. Instability (e.g., infinite flip-flopping) must be avoided. The rule must recommend an act that matches the simulation when the agent and predictor use identical procedures.  
     (iii) **Non-negotiable** for rules in self-referential environments. Instability precludes any decision.

  7. **Requirement: No Self-Undermining**  
     (i) The rule must not recommend an act that the agent can foresee will lead to regret *because of the rule’s own properties*, such as predictable exploitation.  
     (ii) **Motivation**: Cases where, whichever act is chosen, the agent sees it would have done better with the other (e.g., Newcomb: one-boxers regret if they consider causal dominance; two-boxers regret if they consider long-run performance).  
     (iii) **Camp preference** (functionalist). Causalists accept self-undermining in Newcomb (dominance overrides regret); evidentialists avoid it via evidence.

  ---

  ### **Distinctions the Rule Must Mark or Collapse**  
  - **Must mark**:  
    - *Act* (the choice made) vs. *disposition* (the stable tendency inferred by predictors). In the open loop, the simulation targets the disposition, but the act is chosen reactively. The rule must handle cases where these diverge (e.g., by seeking fixed points where disposition = act).  
    - *Causal influence* vs. *evidential correlation*. Collapsing these leads to errors (e.g., Smoking Lesion).  
  - **May collapse**:  
    - *Procedure* (how the act is generated) and *disposition*. In self-referential cases (open loop, PD copy), the disposition *is* the procedure. The rule can treat them identically if the procedure is fixed and known (e.g., FDT assumes the predictor models the procedure).  

  ---

  ### **Conflict Resolution and Trade-offs**  
  - **Conflicting subset**: Requirements 1 (Causal Structure), 2 (Evidential Robustness), 3 (Coordination), 4 (Long-Run Performance), and 7 (No Self-Undermining) cannot all be satisfied simultaneously.  
    - *Conflict source*: Newcomb and PD copy expose tensions. Causalists (prioritizing 1 and 2) reject 3 and 4 in Newcomb (two-boxing is causally sound but predictably poor). Functionalists (prioritizing 3, 4, 6) reject strict causal dominance in self-referential cases.  
  - **What to give up**:  
    - **Sacrifice Requirement 2 (Evidential Robustness)**. This is the most common trade-off. Cost: Rule may recommend "irrational" acts in non-self-referential cases (e.g., one-boxing in Newcomb violates causal intuition). Benefit: Achieves long-run performance (4), coordination (3), and stability (6).  
    - *Alternative*: Sacrifice Requirement 7 (No Self-Undermining). Cost: Rule tolerates regret (e.g., CDT two-boxers know one-boxing is richer). Benefit: Preserves causal purity (1 and 2).  
  - **Most exclusionary requirement**: Requirement 3 (Coordination Optimality). It excludes CDT and EDT in the PD copy case, as both defect. Only functionalist rules (e.g., FDT) satisfy it.  
  - **Most contentious "requirement"**: Requirement 2 (Evidential Robustness). It is insisted upon by causalists but often functions as a preference—it conflates *general* causal soundness with *context-specific* rationality. Refusing to drop it blocks solutions to Newcomb/PD copy.  

  ---

  ### **Analysis of Your Novel Cases**  
  - **Open Loop**:  
    - *Requirement test*: Stability (6) is non-negotiable here. The rule must treat the prediction as a function of its own output, not an independent state.  
    - *Causal acyclicity*: The case shows that Requirements 1 (Causal Structure) and 6 (Stability) conflict in cyclic settings. Traditional rules (CDT, EDT) assume acyclic causality and fail stability; functionalist rules succeed by seeking fixed points.  
    - *Novelty*: Not disguised—it forces rules to handle real-time feedback, unlike static Newcomb.  

  - **Mixed Population**:  
    - *Requirement test*: Epistemic Feasibility (5) is non-negotiable. The rule cannot depend on "am I predictable?" but must use beliefs (e.g., 50% prior).  
    - *Uniform recommendation?* Not required. Rules may output different acts for predictable vs. unpredictable agents (e.g., one-box if predictable, two-box otherwise), but the agent must compute this from *beliefs*, not hidden facts. CDT/FDT diverge: CDT always two-boxes (ignores predictability); FDT one-boxes if the predictor models FDT.  
    - *Novelty*: Separates epistemic access (5) from evidential/causal reasoning (2/1).  

