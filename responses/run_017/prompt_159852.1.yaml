prompt: |-
  im trying to work out how much of my income and time to give away, and every moral theory I read seems to tell me either basically everything or basically nothing, so before I commit to one I want the spec. Write me the desiderata a theory of demandingness has to meet: the cases it has to handle (the shallow pond, the thousand people who each need a dollar from me, the case where nobody else is going to pitch in, the case where my own contribution on its own changes nothing at all), the distinctions it can't collapse (too demanding vs. merely supererogatory, cost to the agent vs. cost imposed on people she cares about), with the consideration behind each, and mark which are non-negotiable and which are just what one camp happens to want. Two requirements I want you to argue for rather than only list: how much an agent owes in *finding out* whether her inaction is harming people and which interventions actually work — the epistemic bill, not just the action bill — and whether there's any ceiling on how costly it may be to hold someone else to a demand (blame, social pressure, setting up a fine), since a theory can look modest if it only counts the cost to the person complying. Skip scoring utilitarianism, I can do that myself. What I really want is the pair of desiderata you think can't both be satisfied, because I suspect that's where the whole debate bottoms out.
reasoning: |-
  Okay, the user is struggling with moral demandingness—how much of their income and time they should give away. They mention that existing theories either demand everything or nothing, so they want a set of criteria (desiderata) to evaluate these theories. They want the desiderata to cover specific cases, distinctions, and include two special requirements: the cost of finding out if inaction causes harm (epistemic bill) and whether there's a ceiling on enforcing demands. They also want to know which desiderata conflict.

  First, I need to list the desiderata. The user mentioned cases like the shallow pond, a thousand people needing a dollar, situations where others don't contribute, and where one's action doesn't change anything. I should include these as core cases. Then, distinctions like demanding vs. supererogatory and cost to self vs. others. The epistemic bill and enforcement ceiling are additional points they want argued for.

  The user is likely someone engaged in effective altruism or similar, given their focus on giving and intervention effectiveness. They’re frustrated with extreme demands and want a balanced approach. Their deeper need might be seeking a practical, sustainable way to contribute without burnout, while ensuring their actions are morally justified. They might also be concerned about the psychological burden of constant moral calculations and enforcement costs on relationships.

  For desiderata, I should categorize them as non-negotiable vs. negotiable. Non-negotiables would be avoiding actual harm, not collapsing key distinctions, and handling core cases. Negotiables might vary by ethical frameworks. For the two special points: epistemic responsibility is crucial because ignorance isn't a free pass; they need to invest effort in learning about harms and effective solutions. Enforcement costs matter because imposing demands on others has limits—excessive blame can be counterproductive. 

  The conflicting desiderata are likely Sacrifice vs. Sustainability and Sacrifice vs. Fairness. Sacrifice requires significant personal cost for moral reasons, but Sustainability warns against burnout. Sacrifice demands giving a lot, but Fairness says others should contribute too, which might not happen. These tensions explain why theories struggle to balance demands. Highlighting these conflicts addresses the user's suspicion that the debate bottoms out here.
answer: |-
  Here are the desiderata for a theory of demandingness, structured for clarity, with arguments for your two specified requirements and identification of the core tension:

  **I. Core Cases (Non-Negotiable: Any credible theory MUST handle these plausibly)**
  1.  **The Shallow Pond (Rescue Case):** You can easily save a child from drowning at minimal cost (ruined clothes). *Requirement:* The theory must deem saving the child obligatory, not supererogatory. *Consideration:* Intuition of strong, immediate, low-cost rescue obligation; failure here invalidates the theory.
  2.  **The Thousand Needing a Dollar (Iterated Small Rescue):** A thousand identifiable strangers each desperately need $1, and you have $1000 spare. Giving each $1 saves/prevents severe harm. *Requirement:* The theory must deem giving *something* significant obligatory, but needn't demand giving *all* $1000. *Consideration:* Tests whether aggregation of small costs/demands creates overwhelming obligation; distinguishes absolute limits from strong demands.
  3.  **The Isolation Case (No One Else Pitches In):** You are the *only* person aware of/capable of addressing a severe harm (e.g., a unique medical opportunity). *Requirement:* The theory must demand significantly *more* from you in this scenario than if many others were helping. *Consideration:* Captures the core intuition that obligation scales with unique capacity and absence of shared responsibility.
  4.  **The Imperceptible Contribution (Drop in the Ocean):** Your individual contribution (e.g., $1 to a billion-dollar famine relief fund) makes *no perceptible difference* to the outcome on its own (e.g., no life saved by your dollar alone). *Requirement:* The theory must still generate *some* obligation to contribute, even if small. *Consideration:* Addresses whether participation in collective action problems (like large-scale charity) can be obligatory even without individual causal efficacy.

  **II. Essential Distinctions (Non-Negotiable: Collapsing these renders the theory inadequate)**
  1.  **Obligatory (Demanded) vs. Supererogatory:** *Requirement:* The theory must have conceptual space for actions that are good, praiseworthy, but *beyond* what is morally required. *Consideration:* Without this, morality becomes either impossibly burdensome (everything supererogatory is obligatory) or devoid of aspiration (nothing is beyond the call). The Shallow Pond tests the lower bound; heroism tests the upper bound.
  2.  **Cost to the Agent vs. Cost Imposed on Loved Ones:** *Requirement:* The theory must acknowledge that significant burdens imposed *on an agent's close dependents or relationships* (e.g., forcing your child into severe deprivation) count differently, often more heavily, than equivalent burdens borne *directly* by the agent themselves. *Consideration:* Recognizes the moral significance of special relationships and the agent's role/responsibility within them; prevents theories from demanding agents sacrifice others they are responsible for.

  **III. Key Constraints (Mostly Non-Negotiable)**
  5.  **Avoid Actual Harm:** *Requirement:* The theory cannot demand actions that would directly cause serious, immediate harm to the agent or their core dependents (e.g., donating a vital organ non-lethally might be supererogatory, but donating your heart cannot be obligatory). *Consideration:* Foundation of agent-relative permissions; basic self-preservation.
  6.  **Psychological Plausibility (Sustainability):** *Requirement:* The theory cannot demand a life of such constant, extreme sacrifice that it predictably leads to burnout, despair, or complete alienation from ordinary human goods for *most* agents. *Consideration:* Moral theories must be livable and motivate compliance; demanding the impossible is self-defeating.
  7.  **Fairness (Partial Negotiability):** *Requirement (Weaker):* The theory should, all else equal, generate demands that are *fairly distributed* among agents with similar capacity. *Consideration:* Addresses resentment and free-rider problems; important for social cohesion. (*Some consequentialists may see this as secondary to total good*).

  **IV. Your Special Requirements (Argued For):**
  8.  **The Epistemic Bill:** *Argument:* Ignorance is not a morally costless refuge. If your inaction *might* cause severe harm, or if effective interventions exist but you haven't identified them, you have an obligation to invest reasonable effort/time/resources into *finding out*. The cost of this investigation (time, mental energy, consulting experts, funding research) is part of the moral demand.
      *   *Why?* Morality is about responding to *reality*. Willful ignorance undermines the ability to fulfill positive duties (to help) or negative duties (to avoid harm). The cost of becoming adequately informed scales with the potential stakes and the complexity of the issue (e.g., researching effective charities vs. noticing a child drowning). Failure to pay this bill renders other potential obligations unknowable or inefficiently addressed. *This demand is distinct from the cost of acting*.
  9.  **The Enforcement Cost Ceiling:** *Argument:* There *is* a ceiling on how costly it can be for an agent to *hold others* morally accountable (via blame, social pressure, institutional sanctions). While demandingness primarily focuses on the cost *to the complying agent*, enforcing demands imposes distinct costs *on the enforcing agent*:
      *   **Relational Costs:** Persistent blame can destroy friendships and family bonds.
      *   **Psychological Costs:** Sustained anger, resentment, and policing others is exhausting and corrosive.
      *   **Reputational/Social Costs:** Being seen as a moralistic nag can lead to isolation and reduced effectiveness.
      *   **Effectiveness Costs:** Excessive pressure can trigger backlash, not compliance.
      *   *Therefore:* A theory must recognize that while an agent *X* might have a demanding obligation to *do Y*, it does not follow that agent *Z* has an *unlimited* obligation to *make X do Y*. The cost *to Z* of enforcing the demand on *X* creates a diminishing return and eventually a ceiling. A theory ignoring this implicitly imposes potentially limitless enforcement burdens, which is unsustainable and often counterproductive.

  **V. The Core Tension (The Irreconcilable Pair):**

  You suspect correctly. The fundamental tension lies between:

  *   **Sacrifice:** The intuition that morality can demand significant personal sacrifice to prevent severe harm or promote great good. (Supported by: Shallow Pond, Isolation Case, Imperceptible Contribution aggregation).
  *   **Sustainability/Fairness:** The intuition that morality cannot demand a life of total self-abnegation that destroys the agent's core projects, relationships, or psychological well-being, especially when others contribute far less. (Supported by: Psychological Plausibility, Cost to Loved Ones, Enforcement Cost Ceiling, Fairness).

  **Why they conflict:**

  1.  **Scale of Suffering/Need:** The amount of severe suffering preventable or significant good achievable in the world is *vastly* larger than any individual's resources. Sacrifice, taken seriously in light of this scale, pushes towards near-total giving. Sustainability/Fairness pulls back hard against this.
  2.  **The Isolation/Fairness Problem:** Sacrifice is strongest when others *don't* contribute (Isolation Case). But recognizing this makes the demand deeply *unfair* if others with equal capacity shirk entirely. Sustainability/Fairness demands relief *because* others aren't pulling their weight, while Sacrifice demands *more* because others aren't pulling their weight. The tension is inherent.
  3.  **Aggregation vs. Thresholds:** Sacrifice is amplified by aggregating small costs to prevent many harms (Thousand Needing a Dollar). Sustainability/Fairness seeks thresholds or agent-centered prerogatives to halt this aggregation before it consumes the agent.
  4.  **Enforcement Burden:** Rigorously enforcing Sacrifice on others to achieve fairness creates potentially crushing Enforcement Costs, undermining Sustainability for the enforcer.

  **How theories try (and fail) to reconcile them:** Utilitarianism often sacrifices Sustainability/Fairness for Sacrifice (though with rules or motives as pressure valves). Moderate deontology builds in Sustainability/Fairness via agent-centered constraints/prerogatives but struggles with the radical demands of the Isolation Case or Imperceptible Contribution. Contractualism focuses on Fairness/Rejectability but can downplay Sacrifice in isolation. Virtue ethics emphasizes Sustainability but struggles with precise demandingness thresholds.

  **The Bottom Line:** Any theory must navigate this tension. The desiderata above force it into the open. Your choice won't be about finding a theory that perfectly satisfies all desiderata (none does), but about which compromises between Sacrifice and Sustainability/Fairness you find most defensible in light of the core cases, distinctions, and the costs of knowledge and enforcement. The "spec" highlights where the pinch points are.
