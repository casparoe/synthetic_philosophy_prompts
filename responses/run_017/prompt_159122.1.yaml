prompt: |-
  Hey — I host a small politics-and-philosophy podcast called *Unforced Error*, and next weeks guest is a political theorist named Miriam Ashgrove. Her new paper tries to rebuild Chesterton's fence as an actual decision rule rather than a bumper sticker: roughly, before you dismantle an inherited practice you owe an account of what it was *doing*, because social practices carry tacit, dispersed knowledge that nobody has in their head, and because removal is usually irreversible — tearing the fence down destroys the option of putting it back cheaply. I want eight interview questions that make her do more than restate that, and I dont want any of them to be the kind of question she can answer with a slogan.

  Here's the territory I want covered, roughly one question each (merge things if it flows better):

  1. Why the burden of proof is asymmetric at all. The preservationist also seems to owe something. Expect her to talk about baselines and about the fact that the practice is already paid for and already coordinated around — press on whether "existing" is doing moral work or just causal work.

  2. Whether the principle is really about *ignorance* or really about *irreversibility*. If it's irreversibility and option value, then it says nothing about easily reversible arrangements, it can actually favor *removing* things (a fence that itself blocks future options), and it isn't distinctively Burkean — any consequentialist with a real-options model gets there. That reduction worries me and I want it put to her.

  3. The self-stultification worry: you often can't learn what an institution is doing except by removing it, the way you learn what a component does by ablating it in an experiment. So the rule seems to demand knowledge it forbids you from acquiring. Her likely move is pilots, small-scale trials, federalism as laboratories of democracy — push on whether that collapses the view into "experiment first," and whether experimentation is exactly what Burkeans are supposed to distrust.

  4. Functionalism about practices. Chesterton's parable assumes the fence is there *for a reason*, doing a job. But plenty of practices are there because somebody wanted a fence: enclosure, rent extraction, status hierarchy. Are those load-bearing too? If she says yes-but-unjust, follow up that her view then says keep unjust institutions until replacements are built, which sounds like ordinary reformism with a pause button.

  5. Fragile versus self-fulfilling equilibria. Some institutions hold only as long as everyone expects them to, so ablation is unrecoverable; others are bad *only* because everyone believes in them, so removal cures itself. Ask how she tells those apart in advance.

  6. Who knows, and what kind of knowing. The builder may be dead or may have lied, users can't articulate what they're doing, the knowledge may be in the practice rather than in any head. Follow up: if it's tacit, no amount of interviewing surfaces it, so we're back to removal being the only test.

  7. Self-application. Is the fence principle itself an inherited practice that owes us an account of what it's for? And who grades the answer — what stops "understand it first" from being an unmeetable bar, given how little anyone understands about complex social systems?

  8. The error tally and the democratic objection. Make her name a specific reform that fence-style caution predicted would go badly and that went fine, and say what kind of evidence would actually count against the principle. Then put Burke's partnership-across-generations idea to her: why do the dead get a vote at all, and does the principle give them one in cases where the practice was imposed on their contemporaries rather than chosen by them?

  For each question give me: (a) how I should actually say it out loud, one or two sentences, in plain speech; (b) the answer she is most likely to give, in her own terms and as charitably as you can make it; (c) the follow up keyed to *that specific answer*, not a generic "but what about X."

  Then a table at the end, one row per question, with exactly these columns:
  - q_number
  - probes (short: the single claim or assumption the question is testing)
  - likely_escape_route (the move she'll most plausibly use to avoid the force of it)
  - how_hard_to_close (1 = she slips it easily, 2 = needs a real answer, 3 = the follow-up basically traps her)
  - deflection_line (one sentence I can say if she pivots to slogans, so I can get her back on the hook)
reasoning: |-
  We are creating eight interview questions for Miriam Ashgrove based on her paper that reinterprets Chesterton's fence as a decision rule. We want to avoid questions that can be answered with a slogan and instead push her to engage deeply with the underlying issues. For each of the eight points, we will structure the question as follows:

  (a) The actual question to ask (one or two sentences in plain speech).
  (b) Her most likely charitable answer in her own terms.
  (c) A specific follow-up question keyed to that answer.

  Then, we will create a table with the following columns for each question:
  - q_number: the number of the question (1 to 8)
  - probes: the single claim or assumption the question is testing (short)
  - likely_escape_route: the move she'll most plausibly use to avoid the force of it
  - how_hard_to_close: 1 (she slips it easily), 2 (needs a real answer), 3 (the follow-up traps her)
  - deflection_line: one sentence to say if she pivots to slogans to get her back on track.

  Let's go through each point:

  ### 1. Why the burden of proof is asymmetric
  (a) "Miriam, you argue that before dismantling an inherited practice we owe an account of what it was doing. But why is the burden of proof asymmetric? Doesn't the preservationist also owe something? And is the fact that the practice already exists doing moral work or just causal work?"

  (b) Likely answer: She might say that the asymmetry comes from the fact that the existing practice is already a coordinated equilibrium, and that the costs of change are often underestimated. The "existing" status does moral work because it represents a settled arrangement that people have adapted to, and disrupting it without understanding can cause harm that is hard to reverse.

  (c) Follow-up: "But if the moral weight comes from the coordination and adaptation, then what about practices that are actively harmful and that people want to change? Why should the burden fall entirely on the reformer when the preservationist is maintaining a harmful status quo?"

  ### 2. Ignorance vs. irreversibility
  (a) "You frame Chesterton's fence as being about the risk of losing tacit knowledge and the irreversibility of removal. If the core issue is irreversibility and option value, then doesn't that mean the principle doesn't apply to easily reversible changes, might even recommend removing some barriers, and becomes a standard real-options analysis? Is this still distinctively Burkean?"

  (b) Likely answer: She might argue that the principle is about both ignorance and irreversibility, and that the Burkean insight is that social practices often carry knowledge that we don't realize until it's gone. Thus, even if an option is reversible in theory, the knowledge loss might make it effectively irreversible.

  (c) Follow-up: "But if we can model this as a real-options problem, then isn't the Burkean element just a heuristic for when we suspect high option value? And in that case, how do we avoid reducing your principle to a cost-benefit analysis that any consequentialist could accept?"

  ### 3. Self-stultification: learning by removal
  (a) "You say we must understand a practice before removing it. But often, the only way to learn what it does is by removing it, like in an ablation experiment. How do you avoid the rule demanding knowledge it forbids us from acquiring? I know you might suggest small-scale trials, but doesn't that collapse into 'experiment first' — something Burkeans distrust?"

  (b) Likely answer: She might agree that experimentation is sometimes necessary and that federalism or small-scale trials are a way to gain knowledge without full removal. She might argue that the principle is not against change but against reckless change, and that careful experimentation is consistent with it.

  (c) Follow-up: "But if experimentation is allowed, then isn't the principle really just calling for cautious experimentation? And if so, how is that different from standard incrementalism? Also, how do you reconcile this with the Burkean suspicion of social engineering?"

  ### 4. Functionalism and unjust practices
  (a) "The fence parable assumes practices have a function. But what if a practice exists for rent-seeking or oppression? If you say we must keep it until we build a replacement, isn't that just reformism with a pause button? And doesn't that risk preserving injustice?"

  (b) Likely answer: She might say that even unjust practices can have functional roles, and removing them without understanding can lead to chaos or worse outcomes. The principle doesn't require preserving injustice indefinitely but calls for careful replacement.

  (c) Follow-up: "But if we know a practice is unjust, why should we wait? Isn't the burden of proof on the preservationist to show that the injustice is necessary for some greater good? How do we avoid giving unjust institutions a shield?"

  ### 5. Fragile vs. self-fulfilling equilibria
  (a) "Some institutions are fragile and collapse if we tinker, but others are bad only because we believe in them — so removal cures the problem. How can we tell these apart in advance, before removal?"

  (b) Likely answer: She might say that this is exactly why we need to understand the practice — to know which kind of equilibrium it is. She might suggest historical analysis, comparative studies, or modeling to distinguish.

  (c) Follow-up: "But if we don't know which type it is, doesn't that mean we're stuck? And if the only way to know is to remove it, then doesn't your principle forbid the very test we need?"

  ### 6. Tacit knowledge and the limits of inquiry
  (a) "You say that the knowledge in a practice may be tacit and dispersed. If that's the case, then no amount of interviewing or study can surface it. Doesn't that mean removal is the only test, and that your rule sets an impossible bar?"

  (b) Likely answer: She might argue that we can use indirect methods to understand the function, such as observing what happens when the practice is stressed, or looking at analogous cases. We don't need full explicit knowledge, just a reasonable account.

  (c) Follow-up: "But if we can't get the knowledge without removing the practice in some way, then isn't your rule self-defeating? How do we get that reasonable account without crossing the line into removal?"

  ### 7. Self-application of the fence principle
  (a) "Is the fence principle itself an inherited practice? If so, don't we owe an account of what it's for? And who judges if we've met that bar? What stops 'understand first' from being an unmeetable standard given social complexity?"

  (b) Likely answer: She might say that the principle is a meta-rule for decision-making and not a social practice in the same sense, or that it is a tool for avoiding harm. The bar is not absolute but proportional to the stakes.

  (c) Follow-up: "But if the principle is a rule we've inherited, then by its own standard, we should understand it before applying it. How do we avoid an infinite regress? And if the bar is proportional, who decides what's proportional?"

  ### 8. Error tally and democratic objection
  (a) "Can you name a specific reform that fence-style caution predicted would go badly but turned out fine? And what evidence would count against your principle? Also, on Burke's partnership across generations: why do the dead get a vote, especially when the practice was imposed on their contemporaries?"

  (b) Likely answer: She might give an example of a reform that failed (like the Prohibition) and argue that the principle is about avoiding such errors. For the dead, she might say we inherit the world they built and owe them respect for their wisdom.

  (c) Follow-up: "But you haven't named a reform that the principle wrongly blocked. What about the abolition of slavery? And if the dead's wisdom is sometimes wrong, how do we balance their 'vote' against the living's right to self-determination?"

  Now, let's build the table:

  | q_number | probes                                 | likely_escape_route                                 | how_hard_to_close | deflection_line                                                                 |
  |----------|----------------------------------------|----------------------------------------------------|------------------|---------------------------------------------------------------------------------|
  | 1        | Asymmetry of burden of proof           | Appeal to coordination costs and adaptation        | 2                | "But isn't the harm of the status quo also a cost we must consider?"            |
  | 2        | Reduction to real-options analysis     | Emphasize unique knowledge in social practices     | 2                | "But if it's about option value, isn't that just cost-benefit?"                 |
  | 3        | Experimentation vs. Burkean distrust   | Allow small experiments as consistent with caution | 3                | "But then how is this different from incrementalism?"                           |
  | 4        | Unjust practices as load-bearing       | Argue for careful replacement, not preservation   | 2                | "But why not remove the injustice now and build after?"                         |
  | 5        | Distinguishing equilibria types        | Need for prior understanding to know which type    | 3                | "But if we don't know, doesn't that paralyze us?"                               |
  | 6        | Tacit knowledge limits inquiry         | Indirect methods to approximate function           | 2                | "But if we can't get the knowledge, isn't removal the only test?"               |
  | 7        | Self-application and infinite regress  | Distinguish meta-rule from practice                | 2                | "But isn't the principle itself a practice we've inherited?"                    |
  | 8        | Error tally and dead's democratic role | Focus on past errors to justify caution            | 3                | "But what about cases where caution was wrong? Shouldn't we count those too?"   |

  Note: 
  - how_hard_to_close: I've assigned 2 for most, meaning she needs a real answer. For 3 and 5 and 8, I assigned 3 because the follow-up is particularly trapping (e.g., for 3: if she accepts experimentation, it collapses the Burkean distinctiveness; for 5: if we can't tell, we are stuck; for 8: she hasn't provided a counterexample and the dead's imposition issue is strong).
  - deflection_line: These are short and aimed at bringing her back to the point if she starts to use slogans.

  Let me know if you need any adjustments.
answer: |-
  Here are the eight interview questions crafted to your specifications, designed to push Dr. Ashgrove beyond restatement into substantive engagement. Each includes (a) the spoken question, (b) her likely charitable answer, and (c) a targeted follow-up. The summary table follows.

  ---

  ### **1. Asymmetric Burden of Proof**  
  **(a) Spoken Question**: "You place the burden on reformers to explain an institution’s function before changing it. But why isn’t the same burden on preservationists? Does the mere fact that something *exists* give it moral weight, or is this just about avoiding disruption?"  
  **(b) Likely Answer**: She’ll argue that existence creates a "coordination equilibrium" – the practice is already paid for, people have adapted to it, and changing it risks cascading unseen costs. The moral work comes from respecting inherited collaboration, not just inertia.  
  **(c) Follow-Up**: "If the moral weight comes from coordination, shouldn’t preservationists have to prove that disrupting *their* preferred equilibrium (keeping the practice) is worse than disrupting reformers’ goals? Otherwise, isn’t this bias disguised as pragmatism?"  

  ### **2. Ignorance vs. Irreversibility**  
  **(a) Spoken Question**: "Your rule emphasizes irreversibility and lost knowledge. But if that’s all it is, then shouldn’t it also endorse *removing* barriers when they block better options? And doesn’t this reduce Chesterton’s fence to standard cost-benefit analysis?"  
  **(b) Likely Answer**: She’ll concede irreversibility is key but stress that social practices encode *tacit knowledge* – not just option value – which is uniquely destroyed on removal. This makes it Burkean by prioritizing inherited wisdom over abstract models.  
  **(c) Follow-Up**: "If tacit knowledge is the differentiator, how is it meaningfully distinct from option value? If a quantifiable model captures the risk of losing that knowledge, haven’t we just reinvented consequentialism with a Burkean label?"  

  ### **3. Self-Stultification & Experimentation**  
  **(a) Spoken Question**: "You say we can’t remove a practice without understanding it, but often we can only learn by *testing* removal. If pilots or federalism are the solution, doesn’t that turn your rule into ‘experiment first’ – which seems anti-Burkean?"  
  **(b) Likely Answer**: She’ll argue small-scale trials aren’t "removal" but "probing," letting us learn while preserving the core institution. Burkeans distrust radical leaps, not iterative learning.  
  **(c) Follow-Up**: "But if a ‘probe’ involves suspending the practice somewhere – say, a city repealing a law – isn’t that still removal in that context? And if Burkeans accept this, how is your rule anything more than ‘move slowly,’ which even radicals could endorse?"  

  ### **4. Functionalism & Unjust Practices**  
  **(a) Spoken Question**: "What if a practice exists solely for rent-seeking or oppression? If you say ‘keep it until you build a replacement,’ isn’t that just reformism with a delay – and doesn’t it risk preserving injustice?"  
  **(b) Likely Answer**: She’ll agree unjust practices lack moral legitimacy but warn that even they may stabilize systems (e.g., corrupt patronage preventing violence). Removal without replacement risks chaos.  
  **(c) Follow-Up**: "But if stability is the priority, doesn’t that functionally protect *any* institution, even oppressive ones, by demanding reformers solve all downstream effects first? How is that different from ‘the perfect is the enemy of the good’?"  

  ### **5. Fragile vs. Self-Fulfilling Equilibria**  
  **(a) Spoken Question**: "How do we distinguish institutions that collapse irreversibly when touched from those that only persist because we believe in them? If we can’t tell in advance, doesn’t your rule paralyze change?"  
  **(b) Likely Answer**: She’ll suggest diagnostics: study history for collapse patterns, or see if the practice is self-reinforcing (e.g., via norms). Fragile equilibria often emerge from deep coordination.  
  **(c) Follow-Up**: "But if diagnostics require near-complete understanding, and we lack that, doesn’t your rule default to ‘never touch fragile things’ – even when they’re harmful? Isn’t that circular?"  

  ### **6. Tacit Knowledge & Unknowability**  
  **(a) Spoken Question**: "If the knowledge in a practice is truly tacit – dispersed and inarticulable – then no study can uncover it. Doesn’t that make removal the *only* way to learn, undercutting your rule?"  
  **(b) Likely Answer**: She’ll counter that we can infer function indirectly: observe crises when the practice is strained, or compare similar institutions elsewhere. We need plausible hypotheses, not omniscience.  
  **(c) Follow-Up**: "But if we’re relying on inference from stress or analogy, isn’t that just educated guessing? And if the guess is wrong, haven’t we violated your rule by acting without real understanding?"  

  ### **7. Self-Application & Infinite Regress**  
  **(a) Spoken Question**: "Isn’t Chesterton’s fence itself an inherited idea? By its own logic, shouldn’t we demand an account of *its* function before using it? And who decides if that account is good enough?"  
  **(b) Likely Answer**: She’ll distinguish meta-rules from object-level practices: the fence principle is a "tool for stewardship," justified by its track record in preventing harm. Users judge adequacy contextually.  
  **(c) Follow-Up**: "If it’s a meta-rule, doesn’t that exempt it from the scrutiny it demands of others? And if ‘preventing harm’ is its function, what stops partisans from weaponizing that to block any change they dislike?"  

  ### **8. Error Tally & Democratic Objection**  
  **(a) Spoken Question**: "Give me one real reform fence-style caution wrongly opposed that succeeded. And on Burke: why should the dead get a ‘vote’ via inherited practices, especially when those practices were imposed on *their* dissenters?"  
  **(b) Likely Answer**: She’ll cite failed revolutions (e.g., post-Soviet shock therapy) as cautionary tales. For the dead, she’ll argue they "entrust" institutions to us, and we owe them due diligence.  
  **(c) Follow-Up**: "But shock therapy wasn’t cautious reform – it was radical removal. Can you name a *specific* reform where ‘understand first’ clearly prevented good change? And if the dead ‘entrusted’ oppressive institutions, why must we honor that?"  

  ---

  ### Summary Table  
  | q_number | probes                                         | likely_escape_route                                 | how_hard_to_close | deflection_line                                      |  
  |----------|------------------------------------------------|----------------------------------------------------|------------------|------------------------------------------------------|  
  | 1        | Asymmetry favors status quo unjustly.          | "Coordination equilibria reduce transition costs." | 2                | "But doesn't that ignore the costs of preserving harm?" |  
  | 2        | Reduces to generic option-value economics.     | "Tacit knowledge ≠ quantifiable option value."     | 3                | "Can't we model tacit knowledge as high uncertainty?"   |  
  | 3        | Experiments collapse into anti-Burkean reform. | "Trials aren't removal; they're learning."         | 3                | "But doesn't a trial still dismantle locally?"        |  
  | 4        | Shields injustice via replacement demands.     | "Chaos hurts the vulnerable most."                 | 2                | "Doesn't that prioritize order over justice?"         |  
  | 5        | Rule paralyzes change when harm is certain.    | "Diagnostics distinguish equilibria types."        | 3                | "What if diagnostics are inconclusive?"               |  
  | 6        | Tacit knowledge makes rule self-defeating.     | "Inference from stress/analogy suffices."          | 2                | "Isn't inference just sanctioned guessing?"           |  
  | 7        | Meta-rule exempts itself from scrutiny.        | "Stewardship tools need no functional account."    | 3                | "Why don't stewardship tools need justification?"     |  
  | 8        | No counterexamples; dead's "vote" is undemocratic. | "Failed reforms prove the danger."                | 3                | "But where did caution *cause* harm by blocking good change?" |  

  **Key to columns**:  
  - **probes**: Core assumption/claim tested.  
  - **likely_escape_route**: Her most plausible dodge (charitably framed).  
  - **how_hard_to_close**: 1 = She evades easily (e.g., Q1’s coordination costs). 2 = Needs substantive reply (e.g., Q6’s inference). 3 = Follow-up traps her (e.g., Q3/Q7 force contradictions).  
  - **deflection_line**: Script to block slogan-pivots and re-engage.  

  **Usage Tips**:  
  - Deploy **deflection_lines** if she retreats to soundbites ("Social practices are libraries of wisdom!") or dodges.  
  - **Likely answers** anticipate her strongest defenses; **follow-ups** exploit tensions in those answers.  
  - **Q5 and Q8** are high-leverage: They force her to confront real-world ambiguity and democratic legitimacy.  

  This structure ensures no softball questions while maintaining rigor. If she engages deeply, listeners get novel insights; if she deflects, your pushback exposes the limits.
