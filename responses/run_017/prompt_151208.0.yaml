prompt: |-
  Hi — I edit an illustrated non-fiction history series for 9 to 12 year olds. Small imprint, me and two freelancers, and I end up ruling on maybe a dozen dodgy claims a month, some from authors in proposal, some from a freelancer fact-checking a chapter and not knowing what to do with it. Things like: a megalithic site that couldn't have been built without help from visitors from somewhere else; a suggestion that a big stretch of ancient history and a big stretch of medieval history are the same events counted twice; the lost civilisation that a Greek philosopher wrote about and that everyone keeps trying to find.

  Constraints: I'm not a specialist in any of these periods, no paywalled journals, and roughly an hour per chapter, one sitting, decision has to be defensible to a teacher who writes in angry. So I need a written procedure my freelancers can run on a single claim, not on a whole manuscript, that spits out one of a small number of verdicts (cut it / rewrite it / keep it as history / keep it but framed some particular way), with clear stop points where it just says no, and clear hand-offs to me where the question is really about values rather than evidence.

  The bits I keep tripping over, and want built in:

  The standard filter moves are useless to me. "Extraordinary claims need extraordinary evidence" only renames the decision I'm already stuck on. And the Atlantis-shaped case pushes the other way, which is worse: it actually has an ancient written source behind it, a named author, which is more than we've got for plenty of stuff we state flatly as fact. So the procedure can't turn on whether there are sources.

  I want it testing the practice, not the truth of the claim. Something arrived at honestly that later turned out wrong is not the same animal as something that can't lose. Here's my half-baked idea, use it or replace it with something better: before you bother checking whether the claim has been refuted, ask what the person making it would accept as a refutation, and then check whether anything of that kind has already happened without the claim being dropped. In my experience these things never get abandoned, they get relocated — the date shifts, the site shifts, the missing records turn out to have been deliberately destroyed — and that relocation is what I actually want caught, not any individual factual error.

  It has to be capable of an awkward verdict on claims I already believe. Please run it on at least one thing that's in every school textbook, because a procedure that can't in principle return "this is fringe" for a mainstream claim is just a rubber stamp for consensus, and authors will use that against us the moment they notice.

  And don't give me a hedge-and-move-on option as a free pass. When we write "some people believe" for a ten-year-old, they read it as adults quietly agreeing. So tell me what the real options are and don't leave me a category that's just a way of not deciding.

  Then run it on these three:
  1. A chapter arguing that the builders of a famous megalithic site must have had help from off-world visitors, because no one has shown how the stones were moved.
  2. A spread claiming that a chunk of ancient history and a chunk of medieval history are the same events double-counted, and that anyone who denies it is protecting their own timeline.
  3. One I've got a soft spot for and want the honest answer on: a claim from a community's own oral tradition about where a battle was fought and who won it, which contradicts the written record, and which I'd like to print partly because the written record was made by the side that won.

  Be straight about where the procedure misfires and what it can't do for me.

  British English please, under 700 words total: numbered steps with the stop points marked, then the three applications, then the honest note. No recieved wisdom, no "it depends", and no citations — I don't need any.
reasoning: |-
  Okay, the user is an editor for a children's history series facing tricky judgment calls on fringe claims. They need a concrete, step-by-step procedure for evaluating single historical assertions—something practical that non-specialists can apply within tight constraints. 

  First, unpacking their pain points: 
  - They're drowning in "dodgy claims" (Atlantis parallels, ancient aliens, chronological conspiracies) but lack time/expertise to deep-dive each one. 
  - Standard skeptic mantras don't help because fringe theories often weaponize real sources (e.g., Plato for Atlantis). 
  - Crucially, they want to flag dishonest methodology, not factual errors—like when theories "relocate" instead of dying under counterevidence. 
  - The procedure must risk offending mainstream views to avoid bias accusations. 
  - No weasel-worded hedges; kids interpret "some believe" as endorsement.

  Their half-baked idea about testing refutation criteria feels sharp. Fringe theories survive by redefining defeat conditions—so let's formalize that. 

  Building the procedure: 
  Start with Step 1 to filter obvious pseudoscience (aliens, supernatural). Stop there if triggered. 
  Step 2 assesses source integrity: Does the claim ignore its own proposed refutation criteria? This targets the "relocation" pattern. 
  Step 3 evaluates consensus gaps. Not about truth, but whether dissent exists among relevant experts. 
  Step 4 is the values call—when evidence is contested but culturally significant, kick it upstairs. 

  Now stress-testing on their cases: 
  1. Aliens at Stonehenge: Fails Step 1 (off-world help). Verdict: Cut. 
  2. Double-counted history: Fails Step 2 (deniers framed as conspirators). Verdict: Cut. 
  3. Oral vs. written battle account: Passes Step 1-2, hits Step 4. Values call—but must frame as contested perspective, not fact. 

  Honest flaws: 
  - Struggles with claims that are mainstream but newly challenged (e.g., Columbus "discovering" America). 
  - Can't resolve good-faith evidence wars. 
  - Requires editor spine for Step 4 calls. 

  This should give their freelancers surgical tools, not philosophical debates.
answer: |-
  Here's a procedural checklist for evaluating single historical claims. Designed for non-specialists, under 1 hour, using open sources. Verdicts: **Cut**, **Rewrite**, **Keep (Stated Fact)**, **Keep (Framed Perspective)**.

  **Procedure:**
  1.  **Stop: Supernatural/Extraterrestrial Agency?** Does the claim *require* intervention by non-human intelligence, magic, or undiscovered non-human species to be true? (e.g., aliens built it, gods directed it). **YES → Verdict: CUT.** Rationale: Outside historical methodology. **NO → Proceed to Step 2.**
  2.  **Stop: Immune to Falsification?** What specific, testable evidence *would* convince the claim's proponents it's wrong? Has *any* such evidence emerged *without* the core claim being abandoned (e.g., only relocated, re-dated, or explained away by conspiracy)? **YES (Evidence exists but claim persists unchanged) → Verdict: CUT.** Rationale: Methodologically dishonest. **NO (No such evidence exists/tested, or claim adapts/weakens significantly) → Proceed to Step 3.**
  3.  **Consensus & Contested Ground:** Is the claim accepted as mainstream by *relevant specialist historians/archaeologists* (check textbooks, university dept. websites, major museum publications)? **YES (Broad consensus) → Verdict: KEEP (Stated Fact). NO (Significant specialist dissent/active debate) → Proceed to Step 4.**
  4.  **Values & Framing Handoff:** Is the claim culturally significant *to a community involved* (e.g., oral history contradicting victors' record)? **YES → Handoff to Editor.** Verdict options: **REWRITE** (to clarify contestation) or **KEEP (Framed Perspective)** *only* with explicit context: "According to X tradition...", "Y community believes...", "contradicting Z written account...". **NO → Verdict: REWRITE** (to remove/reframe as contested if minor) or **CUT** (if insignificant and contested).

  **Application:**

  1.  **Megalithic Builders & Off-World Help:**
      *   Step 1: **YES** (Requires extraterrestrial intervention). **Verdict: CUT.**

  2.  **Double-Counted Ancient/Medieval History:**
      *   Step 1: NO.
      *   Step 2: Proponents claim denial proves conspiracy. Specific refutation (e.g., independent dating methods, distinct material cultures) exists but proponents dismiss it as part of the cover-up. Claim persists unchanged. **YES → Verdict: CUT.**

  3.  **Oral Tradition vs. Written Record (Battle):**
      *   Step 1: NO.
      *   Step 2: Oral traditions *can* adapt, but core claims (location, victor) *can* be falsified by archaeology/contemporary records elsewhere. If *this specific claim* hasn't been directly tested/falsified, or adapts reasonably to evidence, proceed. **Assume NO falsification immunity here.**
      *   Step 3: **NO** (Specialist consensus would favour contemporary written records *as primary evidence*, though oral tradition is valued). Significant dissent on *weight* given to this specific tradition.
      *   Step 4: **YES** (Culturally significant to the community). **Handoff to Editor. Verdict Options:** **REWRITE/FRAME:** "While written accounts by the victors say X, [Community]'s oral tradition maintains the battle happened at Y and that they were victorious. Historians continue to debate the evidence." **Cannot be KEPT as stated fact.**

  **Honest Note (Where it Misfires):**

  *   **Step 2 Nuance:** Distinguishing genuine adaptation from dishonest evasion is sometimes subjective within an hour. Requires careful source reading.
  *   **"Relevant Specialists" (Step 3):** Defining this can be tricky for hyper-niche claims. Bias risk: favouring institutional academia over (e.g.) rigorous independent scholars *if* they exist.
  *   **Mainstream Errors:** The procedure *can* flag a mainstream claim as needing framing (**Step 3 NO → Step 4**) if specialist dissent exists. It *cannot* automatically **CUT** a mainstream claim solely via this procedure; Step 2 would need to show it's *methodologically* flawed, not just possibly wrong. Truly entrenched mainstream errors might slip through as **Keep (Stated Fact)** if dissent isn't yet significant *within* specialist circles.
  *   **Step 4 Burden:** Places high responsibility on the Editor for final "Framed Perspective" decisions balancing historical integrity, cultural respect, and educational impact.
