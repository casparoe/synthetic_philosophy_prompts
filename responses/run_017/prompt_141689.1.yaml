  For progress? First, untangle the layers explicitly. Make a chart: "When you say pain dominates, is this about…?" Then test if urgency/intrusiveness can be measured separately from intensity—maybe via attention tasks (user’s psychophysics skills could shine here). Also, formalize the threshold: is it a discontinuity in experience, or a moral stance? 

