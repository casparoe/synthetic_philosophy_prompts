answer: |-
  This stalemate is **three-layered**: substantive-philosophical, methodological, and meta-ethical. Here's a diagnosis and roadmap for progress, based on your group's actual dynamics:

  ### The Core Stalemate: Three Entangled Disputes
  1.  **Phenomenology vs. Axiology (The "Is" vs. "Ought" Conflation):**
      *   **Lexical Claim (Often Phenomenological):** "Severe pain *feels* qualitatively different (e.g., existentially shattering, attention-monopolizing, urgency-creating). Its *intrinsic nature* makes it incomparable to mild states in a way that precludes compensation *as a matter of experience*." (This is where your urgency/intrusiveness hypothesis bites).
      *   **Scalar Claim (Often Axiological):** "The *moral badness* of states must be commensurable on a single scale for rational aggregation and prioritization, regardless of how they feel. Denying this leads to absurdity (abandoning billions to mild suffering for one severe case)."
      *   **Stalemate Trigger:** When a lexical proponent describes the *phenomenology* of torture ("No amount of ice cream fixes a broken leg!"), the scalar side hears an *axiological claim* ("We shouldn't *value* fixing broken legs over ice cream for billions"). Conversely, scalar arguments about aggregation sound to lexicalists like they ignore the *reality* of severe suffering.

  2.  **The Threshold Debate: Conceptual vs. Empirical:**
      *   **Lexical View:** The threshold is *discovered* in the nature of suffering itself (phenomenological discontinuity) or axiologically *required* to respect the moral significance of extreme suffering.
      *   **Scalar View:** The threshold is an *arbitrary construct* introduced to avoid counterintuitive aggregation results. It's a failure of nerve, not a feature of reality.
      *   **Stalemate Trigger:** Lexicalists point to experiences (real or imagined) demanding the threshold. Scalars point to the arbitrariness of locating it and the aggregation paradoxes it creates. They talk past each other because one points to *experience* (or moral intuition), the other points to *formal coherence*.

  3.  **Measurement Model Conflict (Your Hypothesis - Substantive & Empirical):**
      *   **Lexical Intuition:** May track a *vector* of experience: intensity + urgency + attention-capture + threat-signal + etc. The "lexical dominance" might apply to a *compound measure* incorporating these factors, not pure "hedonic tone."
      *   **Scalar Model:** Assumes a *unidimensional* hedonic axis (pleasure/displeasure) where intensity is the primary (or sole) variable.
      *   **Stalemate Trigger:** Your group likely hasn't made this explicit. When lexicalists say "severe pain is *different*," they may partly mean this multi-dimensional aspect (urgency dominates, making compensation *feel* impossible). Scalars hear "this number is infinitely bigger," which seems nonsensical on a unidimensional scale. **Your dimensionality hypothesis isn't just plausible; it's likely *central* to the phenomenological intuition driving lexicalism.**

  ### Why the Thought Experiments Fail (and the Chaining Too)
  *   **"Torture vs. Dust Specks" etc.:** These pit extreme phenomenology (lexical focus) against extreme aggregation (scalar focus). Each side finds the other's conclusion "insane" because they are prioritizing different layers:
      *   Lexicalist: "You cannot seriously value *that* experience (torture) as equivalent to *those* experiences (specks), regardless of number!"
      *   Scalarist: "You cannot seriously prioritize preventing *one* instance of that over *billions* of instances of this! The math demands aggregation!"
  *   **Your Chaining Proposal:** The criticism was correct. JNDs establish an *ordinal* scale of intensity differences ("A is worse than B"). They say nothing about the *ratio* or *interval* properties needed for aggregation ("How *much* worse?", "Can N*B outweigh A?"). Transitivity gives ordering, not cardinality for summing.

  ### Diagnosis of the Stalemate
  This is **primarily a substantive-philosophical stalemate**, deeply entangled with **methodological differences** (phenomenology vs. formal axiology) and potentially underpinned by a **hidden empirical question** (dimensionality of suffering). It's not *just* verbal, though clarifying terms is crucial. It's about **what grounds the value theory**: Raw felt experience (lexical) or the demands of rationality and coherence in moral calculus (scalar). The "commensurable" quarrel is a symptom of this deeper divide.

  ### Paths to Progress (Not Just More Argument)
  Based on your diagnosis and the group's dynamics, try these:

  1.  **Explicitly Separate the Layers (Crucial First Step):**
      *   **Force the Distinction:** In the *next* thought experiment, start by asking: "Is your objection here about what the experience *is like* (phenomenology), or about what *we ought to do* given the numbers (axiology/aggregation)?"
      *   **Define "Dominate":** When someone says pain "dominates lexically," ask: "Do you mean it *cannot* be compensated for *as a matter of how it feels*, or that it *should not* be treated as compensable *as a matter of moral principle*, even if it *could* be?"
      *   **Goal:** Map the disagreement. Is it about the nature of suffering, the requirements of moral theory, or both?

  2.  **Test Your Dimensionality Hypothesis (Empirical/Conceptual Bridge):**
      *   **Reframe the Lexical Intuition:** Propose: "When you say severe pain cannot be compensated, is part of what you mean that it has an *urgency* or *demandingness* that mild states lack, which isn't captured by just calling it 'more intense'? That this urgency makes the *idea* of compensation feel wrong, even before we get to numbers?"
      *   **Explore Consequences:** If suffering has multiple dimensions (intensity, duration, urgency, long-term impact...), does the lexical threshold apply to one specific dimension (e.g., urgency > X), or a combination? Can we imagine states with high intensity but low urgency (a dull, severe ache you can ignore)? Low intensity but high urgency (an itch you *must* scratch *now*)? How do these trade off?
      *   **Link to Psychophysics:** Your expertise is vital. Ask: "In sensory terms, did we ever conclusively show that 'pain' or 'pleasure' was truly unidimensional? Or did we often measure a dominant dimension for practical purposes?" Remind them that even "intensity" in psychophysics is often inferred from behavior (e.g., matching, scaling), which might already incorporate urgency/demand.

  3.  **Shift the Burden with Aggregation Scenarios (Targeting Scalar Coherence):**
      *   **Challenge the Scalar Model's Tolerance:** Instead of dust specks, propose aggregating *moderate* suffering. "How many years of moderate depression (bad, but not utterly crippling) is equivalent *in total disvalue* to one minute of torture? Does the scalar model have *any* principled way to set this exchange rate that isn't arbitrary? If not, is the lexical threshold maybe a *response* to this arbitrariness for the most extreme cases?"
      *   **Goal:** Force scalar proponents to confront the difficulty of their *own* model outside the "specks vs. torture" extreme, and see if the lexical threshold arises as a pragmatic or principled limit to aggregation *because* of the phenomenology.

  4.  **Accept Bedrock Intuitions & Seek Meta-Progress:**
      *   **Acknowledge the Possible:** It *might* be bedrock intuitions. Propose: "Could it be that some of us have a deep intuition that *respect for persons* requires prioritizing the relief of extreme suffering in a way that aggregation violates, regardless of numbers? And others have a deep intuition that *impartiality* requires counting all suffering equally, regardless of intensity? If so, we might be seeing the downstream clash of these fundamental commitments." Naming this can reduce frustration.

  ### Will You Be Here in 18 Months?
  **Probably not, *if* you implement the separation of layers (Point 1) and rigorously test the dimensionality hypothesis (Point 2).** These directly address the talking-past-each-other and your insightful hunch about the core issue. Success looks like:
  *   A shared understanding *that* phenomenology and axiology are distinct (even if linked) concerns.
  *   A refined debate where lexicalists articulate *which aspects* of severe suffering drive the incommensurability (intensity? urgency? threat?).
  *   Scalars engaging with the multi-dimensional nature of suffering experience rather than assuming unidimensionality.
  *   Possibly a shift towards discussing *which dimensions* of suffering are morally relevant for aggregation.

  **Without this disentanglement?** Yes, you'll likely be stuck. Thought experiments alone, thrown across the phenomenological/axiological divide, will keep triggering the "that's insane!" reflex. Your psychophysics lens on the dimensionality of hedonic evaluation is the most promising tool to cut this knot. Use it.
