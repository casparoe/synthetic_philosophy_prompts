answer: |-
  ## Dissertation Fellowship Proposal: Meritocracy's Indeterminate Core: When Desert Has Nothing to Track

  **Project Title:** The Indeterminacy of Individual Contribution: A Foundational Challenge to Desert-Based Meritocracy

  **1. Core Question (The Sharpened Point):**
  *Under what conditions, if any, can an individual’s contribution to a jointly produced outcome with strong complementarities be non-arbitrarily determined? And if such conditions are frequently unmet, does this indeterminacy render desert-based claims about meritocratic allocations incoherent?*

  I chose this formulation because:
  *   **Precision:** It directly targets the *possibility* and *preconditions* for determining individual contribution, isolating the core conceptual/logical issue before luck or endowments enter. It forces a "yes/no/maybe" answer on determinacy conditions.
  *   **Foundation-First:** It positions indeterminacy as logically prior to the familiar luck/endowment/arbitrariness debates. If contribution itself is indeterminate, those debates rest on a false premise.
  *   **Scope:** It encompasses the indispensability/contribution split and metric capture as *manifestations* or *responses* to the underlying indeterminacy problem.
  *   **Game Theory Hook:** It explicitly invites analysis using tools (like Shapley value) designed to *reveal* the dependence on arbitrary choices (orderings, rules).

  **Dead Ends Killed:**
  1.  **"Is contribution separable?" (Too Vague):** Separability is a spectrum. The crucial point is the *consequences* of non-separability for determinacy. This question doesn’t force the desert linkage.
  2.  **"Do our intuitions about contribution conflict?" (Psychological Sidetrack):** While the indispensability/contribution slide is a symptom, the core problem is metaphysical/conceptual, not just psychological. Fixating on intuitions risks obscuring the structural issue. (This becomes *evidence* within the chosen frame).
  3.  **"Are metrics flawed?" (Downstream Institutional):** Metric capture is a vital *consequence* and institutional *response* to indeterminacy, but starting here puts the cart before the horse. The proposal needs to establish *why* metrics are needed in the first place.

  **2. Why Existing Positions Don’t Settle It & Honest Worry:**
  The prevailing meritocracy debate implicitly assumes a determinate "contribution fact" exists. Critics attack *what* desert tracks (endowments, luck-contaminated effort) or *how* merit is defined/measured, but rarely *whether* the object of desert (individual contribution) is coherent in collaborative contexts.
  *   **Anti-Desert/Luck Egalitarians:** Focus on the *source* of capacities (undeserved endowments, brute luck) contaminating contribution. They grant the *existence* of a contribution but deny its moral weight due to origins. My argument challenges whether a *unique* contribution can even be identified *before* origins are considered.
  *   **Efficiency Defenders:** Dismiss metaphysics, advocating contribution proxies (test scores, outputs). They assume such proxies *track* something real. I argue that in non-separable contexts, the "something real" (individual contribution) is indeterminate, making proxies arbitrary impositions, not discoveries.
  *   **"New Caste" Critics:** Focus on mobility effects, character formation, or biased definitions of "merit." They critique the system's *consequences* and *inputs*, not the metaphysical coherence of its core distributive logic (desert based on contribution) in collaborative production. They often *reinforce* the assumption that contribution *is* determinate when they critique how it’s measured.
  *   **Honest Worry (Indeterminacy vs. Brute Luck):** Is this just brute luck in disguise? No. Brute luck concerns the *undeserved factors influencing outcomes*. My claim is more radical: In non-separable contexts, there is *no single, factually correct "outcome" attributable specifically to the individual* to be influenced by luck *in the first place*. The choice of surplus-sharing rule (e.g., Shapley vs. Equal Split vs. Core) *creates* different "contributions" from the same facts. Luck acts *on* a contribution; indeterminacy means there *is no* unique contribution *to* act upon. The arbitrariness lies in the definition of the unit itself.

  **3. Methodology & Timeline (Why Not Alternatives):**
  Pure conceptual analysis risks being unmoored; pure intuition surveys risk missing the structural logic revealed by formal tools. I propose an integrated method:

  *   **Months 1-3: Foundational Modeling & Conceptual Groundwork:** Rigorously model paradigmatic cases of joint production (e.g., minimal teams with strong synergies) using cooperative game theory (CGT) – Shapley value, Nucleolus, Core concepts. Explicitly identify the arbitrary choices embedded in each solution concept (e.g., Shapley’s reliance on all possible orderings). Formalize the distinction between indispensability and marginal contribution. *Method Justification:* CGT provides the sharpest tools to expose the dependence on arbitrary rules, demonstrating indeterminacy isn't just vagueness but structural.
  *   **Months 4-6: Case Study Analysis:** Apply the CGT framework to analyze real-world collaborative contexts: surgical teams (reliance on specialists, nurses, techs), open-source software development (modular but interdependent contributions), academic co-authorship (varying roles, ideas blending). Map how existing reward/credit systems (promotions, authorship order, bonuses) implicitly or explicitly rely on specific surplus-sharing rules (or crude proxies). *Method Justification:* Grounds the abstract argument in tangible practices, showing the pervasiveness of non-separability and the varied institutional responses.
  *   **Months 7-9: Intuition & Discourse Analysis:** Conduct targeted thought experiments and analyze discourse (e.g., promotion committee guidelines, debates over credit allocation) to examine how indispensability vs. contribution intuitions are deployed, how conflicts are resolved, and whether the underlying indeterminacy is acknowledged or obscured. *Method Justification:* Tests the real-world traction of the conceptual argument and reveals how institutions navigate (or mask) indeterminacy.
  *   **Months 10-12: Synthesis & Implications:** Integrate findings. Develop the critique of desert-based meritocracy: if contribution is frequently indeterminate, then claims that "the best contributor deserves the reward/job" lack a determinate truth condition. Analyze "metric capture" (Months 7-9 data crucial here) as an institutional *manufacturing* of separability to overcome indeterminacy, exploring its costs (distortion, reward for legibility over value). Draft core dissertation chapters.

  **4. Success, Failure, and Scope:**
  *   **Success (Assertion Achieved):** "In collaborative contexts characterized by strong complementarities, there is frequently no non-arbitrary, determinate fact of the matter about an individual's specific contribution to the joint output. Consequently, desert-based justifications for meritocratic allocations in such contexts lack a coherent foundation; meritocracy, in these domains, is undermined not by luck but by indeterminacy."
  *   **Success (Manifestations):** Demonstrate the indispensability/contribution slide as a symptom of indeterminacy. Establish "metric capture" as a distinct, significant institutional pathology arising *from* the need to overcome indeterminacy (more than just arbitrariness – it actively reshapes production).
  *   **Failure:** If rigorous CGT analysis reveals robust, non-arbitrary methods for isolating individual contribution in core cases of complementarity. If case studies overwhelmingly show separable contributions or universally accepted, non-arbitrary sharing rules. If indispensability and contribution converge reliably in practice.
  *   **Is it One Year?** **Yes, tightly focused.** It’s *one year of foundational work* establishing the core argument and its key implications. I cut: 1) Comprehensive historical analysis of meritocracy debates; 2) Full normative theory of alternatives to desert; 3) Extensive empirical studies beyond 2-3 core case types; 4) Detailed policy prescriptions. This lays the essential groundwork; the dissertation expands.
  *   **Metric Capture:** **A Core Chapter (Not a Footnote).** It’s a vital, distinctive *implication* of the indeterminacy thesis, showing how institutions *respond* and the perverse consequences. It transforms the critique from abstract possibility to concrete social mechanism.

  **5. Project Narrative:**
  The meritocratic ideal promises that rewards track individual contribution, grounding fairness in desert. Critics fiercely contest *what* should be considered a person’s contribution (raw talent? effort purified of luck?), or *how* merit is defined. Yet, both defenders and critics share a silent premise: that *an individual’s contribution* is a determinate fact, a stable entity for desert to latch onto. This project challenges that foundational assumption.

  Much essential human endeavor – innovation, complex services, artistic performance, knowledge creation – is deeply collaborative, marked by strong complementarities. The orchestra’s sound, the surgical outcome, the software release, the co-authored breakthrough: these are outputs of a system where individuals' inputs interact synergistically. Cooperative game theory reveals a profound consequence: in such contexts, there is frequently *no unique, non-arbitrary way* to isolate an individual’s specific contribution. How much did the violinist add? It depends: on whether we imagine adding them first or last to the ensemble, or on whether we prioritize indispensability or average marginal impact across all possible team formations. The Shapley value, often touted as "fair," averages over all possible orderings – a mathematical admission that no single ordering (and thus no single "marginal contribution") is privileged by the facts alone. Other rules (equal split, core allocations) yield different answers.

  This is not merely epistemic uncertainty, nor is it the familiar problem of brute luck. It is a form of *metaphysical indeterminacy*: the facts about the team and its output *underdetermine* the attribution of specific shares to individuals. Consequently, the claim "X deserves reward Y based on her contribution Z" lacks a determinate truth condition when Z is indeterminate. Meritocracy, in these pervasive collaborative domains, is not merely flawed by luck or bias; its core justificatory logic – desert based on individual contribution – *never gets off the ground*. The emperor has no clothes, and we’ve been arguing about his tailoring.

  This indeterminacy manifests in our conflicted intuitions. We instinctively reward the indispensable linchpin ("without whom nothing") and the high-impact adder ("who made it significantly better"). Yet, in synergistic teams, these often diverge sharply, revealing an ambiguity in "contribution" itself.

  Faced with this indeterminacy, institutions default to *manufacturing* separability: individual performance metrics (lines of code, sales targets, exam scores). This "metric capture" isn't just arbitrary; it actively *reshapes* the production process, incentivizing measurable, often atomized, actions over hard-to-quantify synergistic value. Rewards flow to the legible, not necessarily the most valuable contributor in the holistic sense. This is a distinct, potent critique of meritocracy's implementation, born from its foundational indeterminacy.

  This project, therefore, aims to:
  1.  Rigorously establish the conditions for (in)determinacy of individual contribution using cooperative game theory.
  2.  Demonstrate its prevalence and consequences through targeted case studies.
  3.  Show how indispensability/contribution conflicts and metric capture are direct results of this indeterminacy.
  4.  Conclude that desert-based meritocracy is conceptually incoherent for a vast swathe of socially crucial, collaborative activities.

  By shifting the debate to this prior, structural question of determinacy, this research offers a fundamentally new perspective on the limits of meritocracy, moving beyond the well-trodden paths of luck and endowment debates to reveal a deeper challenge at its core.
