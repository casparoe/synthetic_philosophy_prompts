prompt: |-
  I'm running a peer tutorial next week for about twelve second-years in my philosophy-and-economics course — fifty minutes, and the topic is interpersonal utility comparisons. They've done basic consumer theory and Arrow's theorem but nothing on social welfare functions. I dont need the topic explained to me, I need a plan for explaining it: what has to be in place before the question even makes sense to them, and in what order the rest has to come.

  My hypothesis is that the real mess is that three different comparability claims get run together: comparing how well off two people are overall (levels), comparing the *size* of a gain across people (differences), and comparing units or scale so that one person's gain can count as twice another's. Is that the spine to build the session around, or too much for fifty minutes?

  I was going to carry it with one case: a fixed budget split between an able-bodied student and a wheelchair user who needs far more money to reach the same level of mobility. But that might drag in desert and disability stuff I don't want to get stuck arguing about. Is there a better carrying example, and what would it need to have and to lack?

  Misconceptions I'm expecting: "utility is just happiness, so this is easy"; "you can't compare, so fall back on Pareto"; "just use willingness to pay". Where in the sequence should I head each one off, and what should I flat-out refuse to cover? My tutor keeps saying Pareto is the only criteron you get for free and that it can't rank anything — I want them to feel that by the end. And give me one question to ask at the end that shows me whether they actually got it rather than just learned to say "it depends".
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a peer tutor preparing a 50-minute session for about twelve second-year philosophy-and-economics students. The topic is interpersonal utility comparisons. They don't need the concept explained but rather a structured plan to teach it effectively. 

  First, I need to consider the students' background. They've done basic consumer theory and Arrow's theorem but no social welfare functions yet. That means they understand individual utility functions and the impossibility of aggregating preferences without interpersonal comparisons. But they might not see why interpersonal comparisons are necessary for welfare economics yet.

  The user's hypothesis is that three comparability claims often get conflated: levels (overall well-being), differences (size of gains), and scale (units). This seems like a solid framework. But is it too much for 50 minutes? Maybe not if streamlined. The key is to clarify these distinctions early to prevent confusion.

  Next, the carrying example. The wheelchair vs. able-bodied example is realistic but risks tangents on desert or disability ethics. The user wants to avoid that. What alternative examples work? Medical resource allocation is classic—vaccines for young vs. old. But age involves value judgments. Maybe a neutral scenario: two workers with different productivities needing resources to achieve similar comfort levels. Productivity differences are factual, reducing ethical debates. The example must show that utility scales matter without triggering moral arguments.

  Misconceptions to address: 
  1. Utility = happiness → Head this off by defining utility as preference satisfaction early on. 
  2. Fallback to Pareto → Save this for after showing Pareto's limitations, using a two-person, two-resource scenario. 
  3. Willingness to pay → Contrast with initial endowments to expose bias.

  The user wants students to feel that Pareto alone is insufficient. So the session must build to that conclusion. Ending with a question that tests understanding: Ask them to design a fair division requiring interpersonal comparisons, forcing them to specify which type (levels, differences, scale) they're using.

  Structuring the 50 minutes: 
  - Start with why comparisons are unavoidable in welfare decisions (5 min). 
  - Clarify utility ≠ happiness (5 min). 
  - Introduce the three comparability types with examples (10 min). 
  - Deep dive into scale dependence using the carrying example (15 min). 
  - Show Pareto's limits (10 min). 
  - Conclude with synthesis and the diagnostic question (5 min).

  Timing is tight. The scale section is most crucial. Skipping social welfare functions is wise—too advanced. Focus on why comparability matters before introducing aggregation methods. 

  The user's tutor emphasizes Pareto's minimalism. The session should make students feel its inadequacy through examples, not just assertion. The diagnostic question should reveal if they grasp that "fair" allocation requires specifying comparability assumptions. 

  Overall, the spine (levels/differences/scale) is viable if paced right. The worker example avoids ethics. Addressing misconceptions at precise points prevents derailment. The end question ties it all together.
answer: |-
  Here’s a battle-tested 50-minute plan focused on conceptual clarity and avoiding rabbit holes. **Your three-comparability-spine is perfect**—build around it. Skip social welfare functions entirely; this is groundwork.

  ### **Session Blueprint (50 min)**
  **Goal:** *Show that interpersonal comparisons require contested assumptions, and Pareto alone is silent on distribution.*

  ---

  #### **1. Framing: Why We Can’t Avoid This (5 min)**
  - **Hook:** "We have £10K to split between Ana and Ben. How?"  
    *Brainstorm:* Equality? Need? Desert? Efficiency?  
  - **Pivot:** "All these require judging *relative gains*. But how? Economics avoids this—let’s see why that’s hard."  
  - **Key Point:** Policy/dividing resources *forces* interpersonal judgments. Arrow’s theorem already shows we need more than ordinal rankings.

  #### **2. Demolish Misconceptions (10 min)**  
  *(Preempt early to clear mental clutter)*  
  - **"Utility = Happiness":**  
    - "Utility functions model *choices*, not feelings. If Ana chooses pain relief over food, her utility reflects *preference strength*, not happiness units."  
    - **Kill the metaphor:** "Forget ‘utils’. Utility is an index of satisfaction *for one person only*."  
  - **"Willingness to Pay (WTP) Solves It":**  
    - "WTP depends on income! If Ana is poor, her WTP for a wheelchair is low. Does that mean she *benefits less* from it than rich Ben? No—it’s distorted by budgets."  
    *(Example: Insulin—poor diabetic vs. rich hypochondriac.)*  

  #### **3. Your Spine: The 3 Comparabilities (15 min)**  
  **Carrying Example:** ***Two workers with different productivity.***  
  - *Worker A*: Healthy, produces 10 units/hr.  
  - *Worker B*: Chronic pain, produces 5 units/hr even with effort.  
  - **Task:** Split a $1,000 productivity bonus.  
    *(Avoids disability ethics; productivity is observable, pain is private.)*  

  | **Comparability Type** | **Question** | **Why It’s Distinct** |  
  |-------------------------|--------------|------------------------|  
  | **Levels** | "Who is worse off overall?" | Requires judging *absolute* welfare. B may be miserable despite working. |  
  | **Differences** | "Who benefits *more* from $100?" | B might gain more welfare (pain relief) than A (luxury). |  
  | **Scale/Units** | "Is B’s utility gain from $100 *twice* A’s?" | Even if differences are comparable, scaling is arbitrary without a common unit. |  

  **Clincher:** "To split the bonus ‘fairly’, you need *at least one* of these—and economists reject all three as unscientific."

  #### **4. Why Pareto Isn’t Enough (10 min)**  
  - **Pareto Review:** "A change helps someone, hurts no one."  
  - **Problem:** "It can’t judge transfers! Giving $500 to A and $500 to B vs. $900 to A and $100 to B are *both* Pareto-optimal if we don’t hurt anyone."  
  - **Activity:** Draw two utility possibility frontiers. Show multiple Pareto-optimal points. *"Which point is ‘better’? Pareto won’t tell you."*  
  - **Takeaway:** Pareto is silent on distribution—it’s a *minimal* criterion, not a solution.

  #### **5. Synthesis & Diagnostic (10 min)**  
  - **Recap Spine:** "Allocating resources needs comparability. Levels, differences, or scale? Pick your poison—each is philosophically fraught."  
  - **Big Picture:** "This is why welfare economics is normative. We *must* make assumptions about comparability to move beyond Pareto."  
  - **Diagnostic Question:**  
    > *"If I claim we should give Worker B 70% of the bonus because ‘she needs it more’, what kind of interpersonal comparison am I assuming? Could someone reject this? How?"*  
    **What reveals understanding:**  
    - They identify *differences* (B’s gain > A’s per dollar) or *levels* (B is worse off).  
    - They note this assumes comparability *can* be made—and that skeptics would demand justification.  
    - Bonus: They link this to Arrow (no SWF without comparability).

  ---

  ### **What to Exclude & Why**
  - **Social welfare functions:** Too advanced; this session primes for that later.  
  - **"Solutions" (e.g., Harsanyi, Varian):** Would rush key insights. Stick to *why it’s hard*.  
  - **Disability/desert debates:** Your worker example avoids this. If raised: "Assume productivity differences reflect pain—we’re only judging utility, not moral desert."  

  ### **Why This Works**
  - **Flow:** Starts concrete (split £10K) → isolates problems (3 comparabilities) → shows insufficiency of status quo (Pareto).  
  - **Worker Example:** Productivity differences are objective; pain is private but intuitive. Avoids wheelchair/desert tangents.  
  - **Timing:** Tight but feasible if you cut discussion tangents. Use quick polls ("Who thinks WTP is fair?") to pace.  

  **Final Tip:** Hammer the mantra: *"Pareto tells us efficiency; comparability tells us fairness."* By the end, they’ll feel how deep the rabbit hole goes. Good luck!
