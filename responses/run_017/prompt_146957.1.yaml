  Possible names: "Finitary Indiscernibility" captures that the methods are indistinguishable for finite sets. Or "Methodological Bifurcation" to emphasize the split. The user wants a coinage if none exists. Key elements: provable agreement in finite domains, inevitable divergence in infinite ones, and non-arbitrary but contested choices post-split.

