answer: |-
  1.  **Term:** This is often called **relative consistency** or, more descriptively, **methodological bifurcation under infinitary extension**. A coined term capturing the specific structure is **Finitary Indiscernibility Collapse** (settled: the phenomenon itself is widely recognized).
  2.  **Definition:** It occurs when multiple distinct formal criteria (e.g., bijection, proper subset embedding, measure) yield identical results for all instances within a restricted domain (e.g., finite sets), proven within the system, but demonstrably diverge when the domain is extended (e.g., to infinite sets) (settled: the mathematical proofs of agreement in finite cases and divergence in infinite cases).
  3.  **Settled Core:** Mathematically, it's proven that for finite collections, bijection, proper superset/subset comparison, and additive measures (like counting measure) coincide. Equally, Cantor's theory shows their divergence for infinite sets. Hilbert's Hotel, Galileo pairs, and measure paradoxes are uncontroversial mathematical facts demonstrating this divergence.
  4.  **Live Dispute:** Genuinely contested is which criterion (if any) captures the single "true" notion of size for infinite collections, or whether there *is* one true notion. This involves deep philosophical commitments (Platonism, formalism, etc.). Arguments center on foundational primacy, mathematical fruitfulness, and intuitive fidelity *outside* the finite domain where they agreed.
  5.  **Nature of Disagreement:** The disagreement is neither purely factual (the math of each criterion is clear) nor purely verbal (different criteria support distinct, robust mathematical theories like cardinality vs. measure theory). It's a substantive conflict over conceptual foundations and ontological commitment, arising *because* the criteria were extensionally equivalent where we learned them.
