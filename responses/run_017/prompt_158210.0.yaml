prompt: |-
  I run a small interdisciplinary reading group — two chemists, a cell biologist, someone from an ML lab, and me (philosophy) — and we keep talking past each other about natural kinds, because each of us has a different case in mind that we treat as the one an account obviously has to get right. So before we argue about which account to read, I want the specification, and I want it written for a stated purpose: an account good enough to underwrite induction and explanation inside a science that is still in motion, rather than one whose job is simply to classify water, gold and tigers and to dispatch Twin Earth. Give me the desiderata — the phenomena the account must explain, the cases it has to get right, the distinctions it must not collapse — with the case or consideration behind each requirement. I have some of the cases in view already and want your judgment on whether each is really a constraint or only a prejudice of one camp: why jade (jadeite or nephrite) is not a kind while gold and water apparently are, and whether that verdict should track anything beyond what chemistry presently cares about; what to do with kinds that are riddled with exceptions and have no single underlying essence, such as species and cell types; how projectibility is supposed to be explained without circularity, i.e. without saying both that kinds are the properties that license induction and that induction over kinds is licensed; whether the joints are uniquely located, given that the same domain often admits several incompatible carvings at different scales or from the perspective of different sciences, each of them predictively fine; how to treat kinds that were empirically successful and then retired (phlogiston, caloric) as opposed to ones that survived theory change (gold); whether there is a distinction between being a kind and being a good one, so that kindhood can come in degrees; and whether the account may posit essences that biology contradicts (species as individuals, horizontal gene transfer, ring species) or microstructural definitions that a chemical kind's multiple realizability would break.

  The case I most want handled, though, is one that none of the standard readings seem designed for and that comes up constantly in my group: what I'll call pre-mechanistic kinds. These are clusters identified in high-dimensional data before anyone knows the mechanism — cell types recovered by clustering single-cell transcriptomic data, or candidate phases of matter flagged by an unsupervised model trained on simulation output. They are robust within the distribution they were found in, they carry real predictions there, they often get a name and enter the literature, and then some of them dissolve under a change of preprocessing or laboratory protocol while others go on to receive a mechanistic explanation and a causal profile. Two further wrinkles: the clustering geometry can be partly an artifact of the training objective rather than a feature of the stuff being clustered, and a gerrymandered disjunctive class (the analogue of grue) can be just as stable in-distribution as a genuine kind. So tell me what an account must say about these: whether statistical robustness can ever be the whole story of kindhood, whether a mechanism or causal structure is required, whether a cluster can be a kind provisionally and then be demoted, and whether the account should treat the ML case as continuous with older cases of taxonomy-before-theory or as a genuinely new form of the problem.

  Two structural things matter more to me than coverage. First, mark which requirements are non-negotiable and which are preferences of particular camps, and identify any subset of the desiderata you suspect cannot be jointly satisfied — if the honest answer is that no single account can have everything on the list, say which requirement you would drop and why, since a list that turns out to be inconsistent is itself the interesting result. Second, tell me which single requirement does the most work in excluding otherwise popular candidates. You may then score, briefly and in a short table, the main contenders — microstructural essentialism in the Kripke–Putnam vein, homeostatic property cluster accounts, pluralist or promiscuous views that allow many cross-cutting carvings, and something like a predictive-cluster view suited to the ML cases — but keep the weight on the criteria and their motivating cases rather than on the scoring. Close by telling me what would change your mind about your own list: which empirical finding or which argument would make you add or drop a requirement, and where your reasoning here is most likely to be going wrong.
reasoning: |-
  Okay, let me start by unpacking the user's query. They run a small interdisciplinary reading group with members from chemistry, biology, ML, and philosophy. Their main issue is that discussions about natural kinds keep hitting walls because each person has a different paradigmatic case in mind. The user wants desiderata for an account of natural kinds that's practical for sciences in flux, not just settled examples like water or gold. 

  First, I need to identify all the cases they mentioned: jade vs. gold, species with no single essence, projectibility without circularity, multiple carvings of the same domain, retired kinds like phlogiston, degrees of kindhood, and the big one—pre-mechanistic kinds from ML clustering. The user emphasizes the need to distinguish non-negotiable criteria from camp-specific preferences and to check if the desiderata are even consistent.

  The user's explicit request is for desiderata, but their deeper need seems to be creating a common framework so their group can communicate effectively. They're frustrated with talking past each other. The pre-mechanistic kinds are especially critical because that's where their group is stuck. They want to know if statistical robustness alone suffices or if a mechanism is essential, and how provisional kinds fit in.

  I should structure the desiderata around core functions: underwriting induction and explanation in active sciences. Non-negotiables would include inductive traction and domain-specificity. Jade's exclusion shows that kindhood isn't just about current scientific interest but about projectibility. Species as messy kinds indicate that essences aren't always necessary. The multiple realizability problem (like chemical kinds) means microstructuralism can't be the only game.

  Pre-mechanistic kinds are the real test. They need to account for clusters that are predictive in-distribution but might dissolve later. The tension here is between robustness and mechanism. If a cluster is stable under perturbations and survives new protocols, maybe it's a candidate kind even without a known mechanism. But gerrymandered classes (grue-like) pose a problem—stability alone isn't enough. So the desideratum must require some level of causal grounding, even if not fully known.

  Assessing consistency: Can all these be met? Inductive traction without circularity is tricky. Maybe grounding projectibility in causal structure avoids circularity. Multiple carvings must be allowed without collapsing into "anything goes." Retired kinds like phlogiston show that kindhood can be provisional. Degrees of kindhood might help here—phlogiston had some inductive success but failed when tested further.

  The biggest conflict is between causal structure and pre-mechanistic kinds. If we demand known mechanisms, ML clusters can't be kinds until explained. But that's impractical for active science. So maybe requiring potential causal anchors—even if unknown—resolves this. The desideratum should specify that kinds must be causally anchored, not necessarily known.

  For scoring theories: Microstructuralism fails on species and multiple realizability. HPC handles species but struggles with ML artifacts. Pluralism is flexible but risks being too permissive. Predictive-cluster views fit ML cases but need safeguards against grue. 

  What would change my mind? If someone shows that predictive success without any causal basis is possible long-term, then causal anchoring might be demoted. Or if a theory cleanly resolves the grue problem without causality, that'd challenge the non-negotiable status.

  In the end, the user needs a framework that's pragmatic, allows for provisional kinds, and bridges their group's divergent examples. Highlighting tensions and trade-offs will help them navigate their discussions more productively.
answer: |-
  Here’s a rigorous set of desiderata for a *pragmatic* natural kinds account, optimized for sciences in motion, with cases motivating each requirement and distinctions between non-negotiables vs. preferences. The goal is to underwrite **induction** and **explanation** without requiring finality or essences.

  ---

  ### **Core Desiderata & Motivating Cases**
  1. **Inductive Traction**  
     - *Must explain:* Why projecting properties over gold succeeds, but over "jade" (jadeite/nephrite) fails outside narrow contexts.  
     - *Case:* Jade’s disjunctive makeup (different minerals) doesn’t support unified predictions (e.g., hardness, reactivity), while gold’s microstructure does.  
     - *Non-negotiable:* Any account failing this is useless for science.  
     - *Distinction:* Not about what chemistry "cares about" now—jade *was* a kind pre-modern-chemistry. Kinds must ground *reliable* projections.  

  2. **Domain-Specific Robustness**  
     - *Must explain:* Why species (despite horizontal gene transfer, ring species) and cell types (despite plasticity) function as kinds *within biology*, even without microstructural essences.  
     - *Case:* "Bird" supports ecological predictions despite genetic exceptions; T-cells license immunology inferences despite phenotypic variation.  
     - *Non-negotiable:* Account must handle "messy" kinds central to special sciences.  
     - *Distinction:* Kindhood is *not* binary—it can be domain-relative and gradable (see #7).  

  3. **Non-Circular Projectibility**  
     - *Must avoid:* Defining kinds as "what licenses induction" while using induction to identify kinds.  
     - *Case:* "Grue" (green before 2050, blue after) is projectible in-distribution but gerrymandered.  
     - *Non-negotiable:* Circularity voids explanatory power.  
     - *Resolution:* Ground projectibility in **causal stability** (e.g., grue lacks a unified causal anchor; gold’s properties trace to atomic structure).  

  4. **Pluralism Without Collapse**  
     - *Must explain:* Why chemistry carves by composition, ecology by niche, and both are valid.  
     - *Case:* Water as H₂O (chemistry) vs. "water" as potable liquid (ecology); both license inductions in their domains.  
     - *Non-negotiable:* Account must permit cross-cutting carvings *without* implying "anything goes."  
     - *Distinction:* Carvings must be *objectively anchored* (e.g., causal dependencies in the domain), not arbitrary.  

  5. **Theory-Change Resilience**  
     - *Must explain:* Why "gold" survived atomic theory, but "phlogiston" didn’t.  
     - *Case:* Phlogiston explained combustion (successful inductions) until oxygen chemistry falsified its core causal role.  
     - *Non-negotiable:* Kinds must be revisable; retired kinds aren’t "false kinds" but *superseded* ones.  
     - *Key:* Kindhood depends on **causal grounding**, not just empirical success. Phlogiston misidentified the causal structure.  

  6. **Gradable Kindhood**  
     - *Must explain:* Why species are "better" kinds than "jade" but "worse" than chemical elements.  
     - *Case:* Species support many inductions (mating, phylogeny) but admit exceptions; gold supports near-universal ones.  
     - *Preference:* Some camps demand crisp boundaries, but gradability is *necessary* for sciences in flux.  

  7. **Pre-Mechanistic Kinds**  
     - *Must explain:* Why some ML-identified clusters (e.g., transcriptomic cell types) become kinds, while others dissolve.  
     - *Cases:*  
       - *Success:* Hematopoietic stem cells found via clustering, later mechanistically validated.  
       - *Failure:* Clusters sensitive to preprocessing or protocol changes.  
     - *Non-negotiables:*  
       - Statistical robustness alone is **insufficient** (gerrymandered classes can be robust in-distribution).  
       - Kinds require **causal anchors** (even if unknown), not just correlations.  
       - Provisional kindhood is allowed, but demotion occurs if clusters are artifactual or lack causal unity.  
     - *ML-specific:* Treat ML clusters as continuous with historical taxonomy-before-theory (e.g., Linnaean classification pre-genetics). Artifacts from training objectives are modern analogs of folk taxonomies.  

  ---

  ### **Tensions & Inconsistencies**
  - **Major Conflict:** *Pluralism* (#4) vs. *Causal Anchoring* (#3, #5, #7).  
    - If carvings are domain-relative, what stops "grue-like" kinds from being valid in *some* domain?  
    - **Resolution:** Demand that all carvings track **objective causal dependencies** (even if domain-specific). Gerrymandered kinds lack unified causal bases.  
  - **Droppable Requirement:** *Unique Joints* (#4).  
    - Microstructural essentialism fails here, but pluralism handles it. If forced to drop one, this is the weakest constraint.  

  ---

  ### **Theory Scoring**
  | **Account**               | Inductive Traction | Domain Robustness | Non-Circular | Pluralism | Theory-Change | Pre-Mechanistic |  
  |---------------------------|--------------------|-------------------|--------------|-----------|---------------|-----------------|  
  | Microstructural Essentialism | High (gold)       | Low (species)     | Medium       | Low       | Medium        | **Low**         |  
  | HPC (Boyd)                 | Medium            | **High**          | Medium       | Medium    | Medium        | Medium          |  
  | Promiscuous Pluralism      | Medium            | High              | **Low**      | **High**  | High          | High            |  
  | Predictive-Cluster (ML)    | **High**          | Medium            | **Low**      | Medium    | Low           | **High**        |  

  **Key Weaknesses:**  
  - Essentialism: Fails pre-mechanistic kinds and species.  
  - HPC: Struggles with artifactual ML clusters.  
  - Pluralism: Risks circularity/grue-problems.  
  - Predictive-Cluster: Vulnerable to training artifacts.  

  ---

  ### **The Crucial Move: Causal Anchoring**  
  The **most excluding requirement** is **non-circular projectibility grounded in causal stability** (#3). It eliminates:  
  - Purely statistical accounts (vulnerable to grue).  
  - Strong social-constructivism (kinds must track mind-independent causal structures).  
  - Naive essentialism (causes need not be microstructural or known).  

  ---

  ### **What Would Change My Mind**  
  1. **Empirical:** Discovery of a fundamental kind with *no causal basis* that reliably supports induction across theory changes. (Current science suggests none.)  
  2. **Theoretical:** A non-causal account that solves the grue problem *and* explains retired kinds (e.g., showing phlogiston was projectible for non-causal reasons).  
  3. **Error Risk:** Overemphasizing causal anchors might exclude valid phenomenological kinds (e.g., thermodynamic phases). But if they support induction, they *do* track causal structures—we just may not know them yet.  

  **Recommended Path:** Start with **Boyd’s HPC** (handles species/gradability) but **modify it** to:  
  - Explicitly accommodate *pre-mechanistic* kinds via **causal potential** (clusters must be *causally interpretable*, even if unexplained).  
  - Add **pluralism** by requiring that property clusters are *domain-relative causal networks*.  
  - Demand **robustness under perturbation** (protocol changes) to filter ML artifacts.  

  This bridges biology/ML without collapsing into "anything goes" or requiring premature essences.
