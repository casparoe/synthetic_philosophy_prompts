answer: |-
  Here’s a taxonomy decision tree handout designed to map beliefs about "Western values" onto concrete cases. It isolates core disagreements through accessible historical/cultural examples and flags conceptual tensions.

  ---

  ### **TAXONOMY OF "WESTERN VALUES": A DECISION TREE**  
  *Answer each question with YES/NO based on your intuitive judgment of the examples. Follow the branches to your leaf position.*

  **START → Q1: Does "Western values" refer to a specific list of norms (e.g., democracy, free speech, secularism)?**  
  - **YES** → Go to Q2  
  - **NO** → Go to Q4  

  **Q2: Must adherents share a historical lineage (e.g., Greco-Roman/Enlightenment descent)?**  
  - **YES** → Go to Q3  
  - **NO** → **LEAF 1: CONTENT VIEW**  
    *Most awkward commitment:* Defending 19th-century colonialists who invoked "Western values" while violating them.  

  **Q3: Is biological/cultural descent essential (e.g., excludes non-Europeans)?**  
  - **YES** → **LEAF 2: GENEALOGICAL/DESCENT VIEW**  
    *Most awkward commitment:* Excluding Japanese liberals who perfectly exemplify the norms.  
  - **NO** → **LEAF 3: ESSENTIALIST VIEW**  
    *Most awkward commitment:* Claiming Athenian democracy "counts" but modern illiberal Hungary doesn’t, despite shared history.  

  **Q4: Is the term primarily defined by contrast (e.g., "not Eastern/Islamic/Authoritarian")?**  
  - **YES** → **LEAF 4: CONTRASTIVE VIEW**  
    *Most awkward commitment:* Including Atatürk’s Turkey (vs. Ottomans) but excluding modern India (democratic but "Eastern").  
  - **NO** → Go to Q5  

  **Q5: Is it a self-ascription (e.g., "our team" regardless of norms/history)?**  
  - **YES** → **LEAF 5: SELF-ASCRIPTIVE VIEW**  
    *Most awkward commitment:* Defending Viktor Orbán if he calls himself "Western."  
  - **NO** → Go to Q6  

  **Q6: Is its function to praise (no fixed criteria)?**  
  - **YES** → **LEAF 6: HONORIFIC VIEW**  
    *Most awkward commitment:* Admitting it could praise Saudi Arabia if geopolitics shifted.  
  - **NO** → **LEAF 7: TRADITION-OF-SELF-CRITICISM VIEW**  
    *Most awkward commitment:* Excluding societies with free speech but no Socratic/Mill-like canon.  

  **ADDITIONAL LEAF** (for those rejecting all above):  
  - **LEAF 8: STRATEGIC ESSENTIALISM VIEW**  
    *Most awkward commitment:* Using the term tactically while believing it’s fiction.  

  ---

  ### **COMBINATIONS NOBODY OCCUPIES**  
  1. **"Honorific + Fixed Content":** Incoherent. If it’s purely praise, it can’t require specific norms.  
  2. **"Genealogical + Rejects Historical Examples":** Unattractive. If descent defines it, you must accept illiberal ancestors (e.g., slave-owning Founders).  
  3. **"Contrastive + No Contrast":** Unmapped. No one defines it oppositionally but rejects all counter-examples (e.g., "not China, not Iran... but also not contrastive").  

  ---

  ### **INDISTINGUISHABLE PAIRS**  
  - **Honorific vs. Self-Ascriptive:** If "praise" is purely tribal (e.g., "whatever my side does"), they collapse. The tree separates them via Q5 (team-signaling) vs. Q6 (praise).  
  - **Strategic Essentialism vs. Genealogical:** Hard to differentiate if user *believes* in descent but uses it instrumentally.  

  ---

  ### **CROSS-EXAMINATION QUESTIONS TO DESTABILIZE EACH LEAF**  
  1. **Content:** *"Which period of French history—Louis XIV, Robespierre, or Vichy—definitively exhibits your list?"*  
  2. **Genealogical:** *"Does a Nigerian democrat raised on Locke have ‘Western values’? If not, is your definition racial?"*  
  3. **Essentialist:** *"What is the unchanging ‘essence’ shared by Pericles and Viktor Orbán?"*  
  4. **Contrastive:** *"Is Singapore ‘Western’ if it out-democracies Poland?"*  
  5. **Self-Ascriptive:** *"If the Taliban called themselves ‘Western,’ would they be?"*  
  6. **Honorific:** *"Could ‘Western values’ praise female subjugation if done by NATO allies?"*  
  7. **Tradition-of-Self-Criticism:** *"Why doesn’t Ibn Rushd (Averroes) count as internal critique?"*  
  8. **Strategic Essentialism:** *"Isn’t your ‘useful fiction’ just cynical propaganda?"*  

  ---

  ### **KEY DESIGN NOTES**  
  - **Steelman Inclusion:** The "Tradition-of-Self-Criticism" (Leaf 7) isolates your preferred steelman.  
  - **Awkward Commitments:** Force confrontation with historical/cultural counter-evidence.  
  - **Blind Spots:** The tree can’t resolve "crypto-honorific" positions (e.g., people who unconsciously use it as praise but claim objectivity).  
  - **Debate Utility:** Cross-exam questions target *rhetorical vulnerability*, not just logic.  

  This framework exposes how "Western values" functions as either an unstable empirical category, a tribal marker, or a rhetorical weapon—fitting your motion that it "doesn’t name anything real."
