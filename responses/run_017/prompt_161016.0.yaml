  Biggest conflict I foresee is between functional parity (any reliable info source counts) and integration depth (needing neural entanglement). That's the notebook-vs-amputation divide right there. And the single requirement that kills most theories? Probably "no cognitive bloat" - it forces hard choices about what counts as "me".

