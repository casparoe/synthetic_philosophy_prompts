answer: |-
  Here’s a specification for a theory of cognitive extension tailored to your memory prosthesis case, organized by requirements, cases to handle, conflicts, and constraints. Non-negotiable requirements (rooted in empirical, ethical, or conceptual necessity) are marked **\[NN\]**; others reflect theoretical preferences.

  ---

  ### **Core Requirements for a Usable Theory of Cognitive Extension**
  1. **Distinguish Integration Depth (Process vs. Vehicle)**  
     - **Must**: Differentiate between tools that *extend cognitive processes* (e.g., real-time hippocampal coupling) and those that *store information* (e.g., notebooks).  
     - **Case**: Switching off a deeply integrated device disrupts ongoing cognition (like amputation); removing a passive tool only limits access (like taking a notebook).  
     - **\[NN\]**: Failure collapses critical ethical distinctions (e.g., therapeutic device vs. assistive tool).  

  2. **Handle Truth-Tracking vs. Functional Role**  
     - **Must**: Resolve whether devices *must* track objective truth to count as cognitive extension.  
     - **Case**: A generative AI creating plausible (but false) memories you internalize. If functional role suffices, this extends cognition; if truth is required, it’s parasitic.  
     - **\[NN\]**: Impacts consent (patients must know if "memories" may be fabricated).  

  3. **Specify Coupling Conditions (Synchronic vs. Diachronic)**  
     - **Must**: Clarify whether cognitive extension requires a *history of calibration* or if instant coupling suffices.  
     - **Case**: A device working perfectly on first use vs. one needing months of neural adaptation.  
     - **\[NN\]**: Neural plasticity evidence shows cognition adapts over time; synchronic-only theories ignore neurobiological reality.  

  4. **Avoid Cognitive Bloat**  
     - **Must**: Exclude trivial extensions (e.g., ambient temperature sensors) while including tools vital to identity/function.  
     - **Case**: A device used daily to navigate life vs. a calculator used sporadically.  
     - **Preference**: But **\[NN\]-adjacent**—ethical decisions require bounded criteria.  

  5. **Parity with Internal Processes**  
     - **Must**: Explain why integrated devices aren’t merely "inputs" but *part of* cognition.  
     - **Case**: Prosthetic recall feels like "remembering," not "checking a source."  
     - **Preference**: Rejected by "second-wave" extended mind theories but critical for *phenomenological unity*.  

  6. **Trust vs. Mere Reliance**  
     - **Must**: Distinguish *epistemic trust* (treated as transparent/authoritative) from instrumental reliance.  
     - **Case**: Patients treat the prosthesis as "their" memory (trust) vs. consulting a reference book (reliance).  
     - **\[NN\]**: Determines whether loss causes identity disruption or inconvenience.  

  7. **Respect Neural Plasticity**  
     - **Must**: Be consistent with evidence that prolonged device use reconfigures the brain.  
     - **Case**: Hippocampal atrophy in prosthesis users after years of dependence.  
     - **\[NN\]**: Contradicting this risks harmful clinical outcomes.  

  ---

  ### **Handling Your Wrinkles**  
  **Wrinkle 1 (Generative Device)**  
  - **Requirement**: Must resolve if functional role (feeling like memory, guiding action) overrides truth-tracking.  
  - **Non-negotiable constraint**: If the device fabricates memories, it cannot extend cognition without violating the *accuracy condition* for autobiographical memory \[NN\].  

  **Wrinkle 2 (Instant vs. Trained Coupling)**  
  - **Requirement**: Must weigh neural plasticity (diachronic) against seamless function (synchronic).  
  - **Key evidence**: Brain-computer interfaces show integration strengthens over time via Hebbian plasticity—supporting history-dependence \[NN\].  

  ---

  ### **Conflicts Between Requirements**  
  1. **Parity + Functional Role vs. Truth-Tracking**  
     - **Conflict**: Parity/functionalism may accept generative devices if they "feel" like memory; truth-tracking forbids it.  
     - **Consequence**: Forces a choice—either admit fabricated memories as extended cognition (risking delusion) or reject parity in autobiographical cases.  

  2. **Synchronic Coupling + Cognitive Bloat Avoidance**  
     - **Conflict**: If instant coupling suffices, non-biological systems (e.g., cloud AI) could bloat cognition; requiring history avoids this but excludes seamless devices.  
     - **Consequence**: Sacrifices bloat-avoidance for clinical flexibility (e.g., emergency implants).  

  3. **Trust vs. Process/Vehicle Distinction**  
     - **Conflict**: Trust may emerge without deep integration (e.g., over-reliance on GPS), but process-based theories demand mechanistic unity.  
     - **Consequence**: Risks misclassifying trusted tools as "extended" without integration depth.  

  ---

  ### **The Most Exclusionary Requirement**  
  **"Respect Neural Plasticity"** excludes:  
  - Purely functionalist theories (ignoring neurobiology).  
  - Synchronic-only views (denying adaptation over time).  
  - Theories treating cognition as substrate-neutral (if plasticity proves biological integration is essential).  

  ---

  ### **Summary of Non-Negotiables**  
  | Requirement                  | Why \[NN\]?                                                                 |
  |------------------------------|-----------------------------------------------------------------------------|
  | Integration Depth            | Avoids ethical equivocation between amputation vs. tool removal.            |
  | Truth-Tracking (for memory)  | Fabricated "memories" undermine identity/consent; clinical harm risk.       |
  | Diachronic Coupling          | Contradicting neural plasticity evidence is scientifically untenable.       |
  | Trust vs. Reliance Distinction| Determines severity of device loss (existential vs. practical).             |

  A theory satisfying all \[NN\]s would:  
  - Treat the prosthesis as a *coupled process* (not a vehicle).  
  - Demand truth-tracking for memory extension.  
  - Require a history of calibrated use.  
  - Acknowledge device-induced neural changes.  
  This leans toward "amputation" in cases of deep integration—but only after validation/adaptation, not instantly.  

  Use this spec to stress-test theories: if a view fails on plasticity or truth-tracking, it’s unusable for your protocol. For generative devices or instant coupling, default to "not cognitive extension" unless \[NN\]s are met.
