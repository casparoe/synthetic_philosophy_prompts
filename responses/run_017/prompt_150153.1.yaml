answer: |-
  ### Joint Statement: Accuracy-First Epistemology and Zetetic Epistemology  

  **Preamble**  
  We agree that epistemic evaluation aims to guide agents toward truth. Accuracy-first epistemology (A) evaluates *states of belief* (credences) using proper scoring rules. Zetetic epistemology (Z) evaluates *processes of inquiry* (question-selection, evidence-gathering, attention allocation). Both camps seek normative force but disagree on primacy and scope. Below, we clarify agreements, pinpoint disagreements, and identify testable cruxes.  

  ---

  ### 1. Agreed Claims  
  1. **Propriety**: A scoring rule $S(p, \omega)$ (measuring inaccuracy of credence $p$ when state $\omega$ obtains) is *strictly proper* iff for any credence $q$, $\mathbb{E}_{\omega \sim q}[S(q, \omega)] < \mathbb{E}_{\omega \sim q}[S(p, \omega)]$ for $p \neq q$. This guarantees that reporting one’s true credence minimizes expected inaccuracy.  
  2. **Accuracy Domination**: If $p$ violates probabilism (e.g., is incoherent), there exists a coherent $p'$ that *accuracy-dominates* $p$: $S(p', \omega) < S(p, \omega)$ for all $\omega$.  
  3. **Expected-Accuracy Arguments**: For an agent with credence $q$, choosing an action (e.g., updating, inquiring) to minimize expected inaccuracy $\mathbb{E}_{\omega \sim q}[S(p, \omega)]$ is rational *by their own lights*.  
  4. **Free Evidence**: For a strictly proper $S$, conditionalizing on cost-free evidence *never increases* expected inaccuracy (from the agent’s current perspective).  
  5. **Synchronic vs. Diachronic**: Synchronic norms govern beliefs at a time; diachronic norms govern belief changes across time.  
  6. **Admissible Accuracy Measures**: Strictly proper scoring rules (e.g., Brier score, log loss) are admissible; non-proper rules (e.g., linear score) permit dominated strategies.  
  7. **No Claim of Exhaustiveness**: (A) does not claim that scoring rules capture *all* epistemic norms (e.g., inquiry directives). (Z) does not claim that belief evaluation is irrelevant to inquiry.  
  8. **No Denial of Connections**: Both camps agree that inquiry *aims* to produce accurate beliefs, but dispute whether belief norms *entail* inquiry norms.  
  9. **Calibration & Sharpness**: Calibration (agreement between forecasts and long-run frequencies) is necessary but insufficient for epistemic excellence; sharpness (informativeness) is jointly valued under proper scoring rules.  
  10. **Regret Bounds**: In learning theory, minimizing regret relative to a comparator class can align with expected-accuracy optimization under certain conditions.  

  ---

  ### 2. Disagreements Table  
  | Crux | Accuracy Camp (A) | Zetetic Camp (Z) | Disagreement Type | Shared Test Case | Predictions |
  |------|-------------------|------------------|-------------------|------------------|-------------|
  | **Can expected-accuracy arguments motivate inquiry?** | "Agents should minimize *diachronic* expected inaccuracy. For inquiry, this includes future beliefs discounted by time or cost." | "Expected-accuracy arguments are myopic: they only appeal to *current* credences. Agents with distorted beliefs (e.g., Dogmatist) won’t see value in inquiry." | **Genuine** (conceptual/formal) | **The Dogmatist**: Agent has $p(H)=1$ for false $H$. All experiments have $\mathbb{E}_{q}[ΔS] = 0$ by her lights. | **A**: Time-discounted $S$ shows inquiry reduces long-run inaccuracy.<br>**Z**: No *intrinsic* reason to discount time; argument fails if agent ignores discounting. |
  | **Does accuracy evaluation condemn passive belief policies?** | "A perfectly calibrated but uninformative credence (e.g., base rate) has high expected inaccuracy under strictly proper $S$. Sharpness is penalized." | "Calibration alone satisfies belief norms. Condemning passivity requires norms *beyond* belief-state accuracy." | **Verbal** (underlying: what "accuracy" demands) | **The Lazy Calibrator**: Always reports base rates, never tests. $S$ penalizes her for low sharpness. | **A**: Proper $S$ expects higher inaccuracy for Lazy Calibrator than sharp forecaster.<br>**Z**: Her *beliefs* are flawless; criticism targets inquiry policy, not beliefs. |
  | **Does process quality affect epistemic assessment?** | "Only belief-state accuracy matters. Identical credences imply identical epistemic status, regardless of genesis." | "Process quality (e.g., diligence, sensitivity to evidence) is epistemically evaluable independently of outcomes." | **Genuine** (conceptual) | **The Lucky Guesser**: Both agents hold identical true credence $p$. One inquired rigorously; one guessed luckily. | **A**: Same $p$, same $S(p, \omega)$ → same score.<br>**Z**: Guesser is criticizable for poor process despite accurate belief. |
  | **Can diachronic scoring recover inquiry norms?** | "A generalized scoring rule $S_{\text{total}} = \sum_{t} \gamma^t S(p_t, \omega)$ (with discount $\gamma$) rewards efficient inquiry." | "Discounting is arbitrary. Inquiry norms (e.g., 'seek decisive tests') are not reducible to time-penalized accuracy." | **Genuine** (formal/conceptual) | **The Slow Truth**: Both reach true belief $p=1$. One takes a day; one a decade. | **A**: $S_{\text{total}}$ penalizes slow inquirer if $\gamma < 1$.<br>**Z**: Slowness is epistemically faulty *even if $\gamma=1$.* |
  | **Is the choice of scoring rule conventional?** | "All strictly proper $S$ agree on domination facts. Norm derivation (e.g., conditionalization) is invariant under choice of proper $S$." | "Choice of $S$ affects prescriptions for inquiry. Log loss rewards attention to unlikely outcomes; Brier score does not. No *epistemic* basis for choosing one." | **Genuine** (formal) | Compute $\mathbb{E}_{q}[ΔS]$ for an experiment under Brier vs. log loss. | **A**: Both $S$ agree that *free* evidence has non-negative $\mathbb{E}_{q}[ΔS]$.<br>**Z**: Optimal *inquiry* (which experiment to run) differs by $S$. |

  ---

  ### 3. What Would Move Each Camp  
  - **Accuracy Camp**: Would shift if shown that inquiry norms (e.g., "gather discriminative evidence") *cannot* be derived from diachronic accuracy minimization (e.g., via counterexample where $\min \mathbb{E}[S_{\text{total}}]$ permits anti-zetetic policies).  
  - **Zetetic Camp**: Would shift if shown that all zetetic norms (e.g., "do not ignore cheap, decisive tests") emerge as optimal strategies for minimizing an undisputed $S_{\text{total}}$ without ad hoc parameters (e.g., $\gamma$).  

  ---

  ### 4. Failure Conditions  
  This collaboration fails if:  
  1. Disagreements reduce to **semantic** disputes (e.g., "accuracy" vs. "zetetic merit") with no testable consequences.  
  2. Both camps **retreat** to domain-restricted claims (e.g., A: "We only evaluate beliefs"; Z: "We only evaluate inquiries").  
  3. No shared **formal test** (e.g., computation of $\mathbb{E}_{q}[ΔS]$ for Dogmatist under time-discounted $S$) is accepted as decisive.  
  Success is a **precise map** of irreconcilable assumptions (e.g., A: Epistemic value resides solely in belief-states; Z: Processes have irreducible epistemic value).  

  ---  
  *Length: ~1,200 words. Readable in 15 minutes by a technical audience.*
