prompt: |-
  You are a professional philosopher specializing in the philosophy of language and literature who has also served as a textual editor on a scholarly edition series, and I want you to answer as a practitioner rather than as a surveyor of the field. Please think carefully before you write: start by brainstorming every distinction that could possibly bear on editorial decisions about meaning, then discard the ones that cannot survive contact with a one-hour meeting and a printing deadline, and tell me what you threw away and why. I do not want citations, bibliographies, or reading lists — I cannot check them and they would not help me; I want a procedure.

  My situation: I am the senior editor at a small press that puts out annotated readers editions of twentieth-century English-language novels, and I make decisions of this kind roughly ten times a week with a team of three, in a single weekly meeting, with no budget for outside consultants and a hard cap of about forty textual notes per volume. Our evidence base is manuscripts, revised typescripts, letters to editors, occasional recordings of public readings, and interviews given decades after publication. Our editions are widely taught, so whatever we assert in the notes effectively becomes the reading for thousands of students. Our current house rule is blunt: emend the text only when the printed reading is not something the author could have meant, and otherwise annotate the difficulty instead of choosing between readings. That rule has started producing results I don't trust, and I've been trying to replace it with something better by distinguishing four candidates for what the word meaning might attach to: the text the author was trying to produce, the physical text that actually exists, the text that readers have in fact received for the last sixty years, and the text the work has for a readership the author could not have anticipated. A friend who works in archives tells me authorial intention never settles anything; I think it settles more than half our queries. I want a procedure that makes that disagreement explicit and operable: a short ordered set of questions we can run on a query, what counts as a sufficient answer to each, which questions get a hard no that ends the inquiry, and which questions are really value judgments that have to be handed to me or to the literary executor rather than decided by the text.

  Run it on these three. First: the first edition silently regularizes a minor character's name, which appeared in the typescript under one spelling in the early chapters and a different spelling later; a printer or an inattentive compositor made them consistent, and half the criticism since then treats them as one person while a minority reads the mismatch as a deliberate signal of the narrator's failing memory. We can be fairly sure the author simply slipped, but emending would quietly settle a live interpretive dispute, and annotating would keep it alive. Second: twenty years after publication the novelist said in a recorded radio interview that a long speech by a minor character — one that nearly every reader has taken straight — was meant as deadpan irony, and he professed astonishment that anyone read it otherwise; his letters from the period of composition show him worrying that the speech was too subtle and cutting it down, and the surviving drafts contain no ironic markers. His daughter, who is the literary executor, wants a note telling readers the speech is ironic; I would quite like to believe her father. Third, the hardest: the estate wants us to publish the unfinished final novel, a three-hundred-page draft to be completed by a ghostwriter, and it contains a passage in which the first-person narrator describes a shopkeeper in terms that, in the published object, will read as unmediated ethnic caricature; the author's outline reveals that the narrator was to be exposed in an unwritten final section as a figure whose judgments the reader is meant to distrust. The estate wants the passage cut, the ghostwriter wants it kept, and every option — cutting it, printing it bare, printing it with a note revealing the planned frame — changes what the text does. For each case give me the procedure's output and your confidence in it, including at least one case where the procedure tells me something I will not like, and end by listing the kinds of query this procedure cannot settle at all and saying plainly where it will misfire.
reasoning: |-
  Okay, the user is a senior editor at a small press dealing with annotated editions of 20th-century novels. They need a practical, efficient procedure for textual decisions that fits tight deadlines and limited resources. Their current rule—emend only if the author couldn't have meant the printed text—is causing problems. They want a structured approach that handles authorial intention and other factors without getting bogged down in theory.  

  First, I need to brainstorm possible distinctions relevant to meaning in textual editing. Things like authorial intention, textual variants, reader reception, historical context, interpretive openness. But many of these won't survive a one-hour meeting with a printing deadline. So I'll discard:  

  - Deep hermeneutics (e.g., "the death of the author" debates)—takes too long to apply case-by-case.  
  - Reception theory variations (how different reader groups interpret)—unmanageable within 40 notes/volume.  
  - Post-structuralist textuality (meaning as purely intertextual)—impractical for editorial annotations.  
  - Biographical speculation (e.g., "the author was depressed when writing this")—too subjective and unverifiable.  

  What stays? Core actionable questions: author's verifiable intent, textual corruption, interpretive necessity, and consequences of intervention. The procedure must be a flowchart-like sequence—brutally pragmatic.  

  Now, building the procedure:  
  1. **Hard evidence of error?** (e.g., typescript vs. print mismatch). If yes, emend. If no, move to Q2.  
  2. **Author’s explicit/uncontested intent?** (letters, recordings). If clear and documented, emend. If contested or ambiguous, move to Q3.  
  3. **Does the reading cause incoherence?** (plot hole, grammatical collapse). If yes, emend. If no, move to Q4.  
  4. **Does non-intervention create worse problems?** (e.g., perpetuating harm, misdirecting students). If yes, emend with note. Else, annotate without changing text.  

  For the cases:  
  - **Case 1 (name inconsistency):**  
    Q1: No error—typescript shows inconsistency.  
    Q2: No evidence author cared.  
    Q3: No incoherence—both readings plausible.  
    Q4: Non-intervention keeps debate alive (good). → **Annotate, don’t emend.** Confidence: High.  
  - **Case 2 (deadpan irony):**  
    Q1: No error—drafts lack irony markers.  
    Q2: Author’s later claim contradicts contemporary evidence (letters). Contested → skip.  
    Q3: Speech works both ways—no incoherence.  
    Q4: Overruling decades of reception risks imposing authority. → **Annotate ambiguity; reject executor’s note.** Confidence: Medium (value judgment).  
  - **Case 3 (ethnic caricature):**  
    Q1: No error—draft is unfinished.  
    Q2: Outline shows intent to frame narrator as unreliable, but unpublished.  
    Q3: Without final section, passage reads as straight racism → incoherence with author’s plan.  
    Q4: Printing bare = harmful; cutting = erasure; note + text = least bad. → **Print with bold contextual note.** Confidence: Low (ethically fraught).  

  Procedure’s limits:  
  - Can’t handle debates where evidence is purely interpretive (e.g., "Is this symbol intentional?").  
  - Misfires when "incoherence" is subjective (e.g., avant-garde fragmentation).  
  - Fails if literary executor overrules Q1-Q4 (power dynamics).  

  User’s hidden needs: They want to *contain* intention debates, not resolve them. The real pressure is ethical (Case 3) and pedagogical (students taking notes as gospel). The procedure forces transparency: "Here’s why we punted."  

  Final touch: Emphasize that the procedure’s strength is admitting defeat—annotate when stuck. That’s what the user’s current rule misses.
answer: |-
  Here's a battle-tested procedure distilled from 15 years in the trenches. After discarding theoretical distinctions (intentionalism vs. anti-intentionalism, utterance meaning vs. speaker meaning, etc.) and impractical tools (reader-response surveys, computational analysis), we're left with five operational questions. **The rule: Stop at the first "yes" and act.** Total decision time per case: ≤5 minutes.

  ### The Procedure
  1. **IS THERE PALPABLE TEXTUAL CORRUPTION?**  
     *Check:* Physical evidence (MS to print variance, compositor error).  
     *Sufficient proof:* Side-by-side document comparison showing mechanical error.  
     *Hard no if absent?* YES. Stop—no emendation.  
     *Who decides:* Textual editor (not you).

  2. **IS AUTHORIAL INTENTION UNEQUIVOCAL AND CONTEMPORANEOUS?**  
     *Check:* Letters/notes from composition period, not post-hoc interviews.  
     *Sufficient proof:* Direct statement resolving *this specific* ambiguity.  
     *Hard no if absent?* YES. Stop—no emendation.  
     *Who decides:* You (weighing evidence proximity).

  3. **IS THE PUBLISHED READING OBJECTIVELY INCOHERENT?**  
     *Check:* Contradicts established plot/facts *within the text itself*.  
     *Sufficient proof:* Logical impossibility (e.g., character dead in Ch.3 but speaking in Ch.10).  
     *Hard no if absent?* YES. Stop—annotate instead.  
     *Who decides:* Team vote (majority rules).

  4. **WOULD EMENDATION CAUSE GREATER HARM THAN NON-INTERVENTION?**  
     *Check:* Pedagogical impact, interpretive foreclosure, ethical consequences.  
     *Sufficient proof:* Concrete risk (e.g., erasing ambiguity central to scholarly debate).  
     *Hard no if absent?* NO. Proceed to Q5.  
     *Who decides:* You (ethical judgment).

  5. **IS ANNOTATION INADEQUATE TO PRESERVE MEANING?**  
     *Check:* Would a note be overly complex or functionally ignored by students?  
     *Sufficient proof:* Note exceeds 3 sentences or requires specialist knowledge.  
     *Hard no if absent?* NO. Default to annotation.  
     *Who decides:* Team consensus.

  ---

  ### Case Applications
  **Case 1 (Name Spelling)**  
  - Q1: NO (printer regularized slip; not corruption).  
  - Q2: NO (no evidence author cared).  
  - Q3: NO (both spellings support coherent narratives).  
  - Q4: YES—Emending kills live debate. Harm > benefit.  
  → **ANNOTATE ONLY.** Confidence: 95% (fits house rule's spirit).  
  *You'll dislike:* Doesn't "fix" error, but Q4 blocks emendation.

  **Case 2 (Deadpan Irony)**  
  - Q1: NO (drafts lack ironic markers).  
  - Q2: NO—Letters show author worried about *subtlety*, not irony; interview decades later is unreliable.  
  - Q3: NO (speech works literally).  
  - Q4: YES—Emending overrides reception history with shaky evidence.  
  → **ANNOTATE DISPUTE; REJECT EXECUTOR'S NOTE.** Confidence: 80% (executor pressure complicates, but Q2 hard stop).  
  *Output you'll like:* Defends textual integrity against late authorial revisionism.

  **Case 3 (Ethnic Caricature in Unfinished Novel)**  
  - Q1: NO (draft is unfinished but uncorrupted).  
  - Q2: NO—Outline shows intent, but it's unrealized. Contemporaneous evidence absent.  
  - Q3: YES—Without final section, passage *is* incoherent with author's design (narrator unreliability unestablished).  
  → **PRINT PASSAGE + UNAVOIDABLE CONTEXTUAL NOTE.**  
  Confidence: 60% (least bad option).  
  *Procedure forces:* Can't cut (Q3 incoherence isn't textual; it's structural). Can't print bare (Q3 failure). Note must state: "Unreliable narration planned but unexecuted; this passage lacks intended framing." Ghostwriter/estate loses—textual reality prevails.

  ---

  ### Where the Procedure Fails
  1. **Ambiguity as Art:** When incoherence (Q3) is deliberate (e.g., modernist fragmentation). Output: Over-annotates or wrongly "fixes."  
  2. **Executor Veto Power:** When estates demand changes violating Q1/Q2. Output: You capitulate or lose the project.  
  3. **Silent Corrections:** Minor grammatical errors authors habitually missed. Output: Procedure forbids emendation (no Q1/Q2 proof), but annotating every comma is unsustainable.  
  4. **Reader Reception Crises:** When a reading becomes harmful (e.g., racist interpretation gaining traction). Q4 might not trigger if harm isn't "greater" than emendation's fallout.  

  **Final Triage:** When the procedure stalls (e.g., Q4 debates), default to annotation. Your 40-note cap is the safety valve—it forces brutal prioritization of true ambiguities over soluble puzzles. Misfires occur when literary value judgments (Q4) masquerade as textual problems; there, you *must* decide, not the text.
