  After the poem, the analysis paragraph must argue that the feeling of meaning is evidence, not just rhetoric. I'll need to address how the poem leans on contested readings by showing that the constraints force internal grounding. Also, highlight how Vantu differs from standard setups by eliminating all external references, making it a purer case of inferential meaning.

