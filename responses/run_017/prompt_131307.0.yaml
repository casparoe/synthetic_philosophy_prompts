prompt: |-
  I write about the ethics of artificial systems — specifically, which of them, if any, we might owe something to — and a colleague has handed me an argument I cannot find my way out of. I would like your diagnosis of it.

  The position I want to end up with has three parts, and I would rather give up almost anything else than give up any of them:

  (A) Substrate neutrality. If a computation matters morally, it matters in virtue of its abstract causal organization — the pattern of states and state-transitions and their counterfactual relations — and not in virtue of what realizes it. Two systems that implement the same computation equally well therefore have the same moral status, whatever they are made of.

  (B) Implementation is a fact. For any physical system and any computation, there is a determinate answer to the question of how well the system implements that computation, and the answer is not settled by our choices of vocabulary, our explanatory interests, or how convenient it would be to describe the system one way rather than another.

  (C) Non-vacuity. Some artificial systems could turn out to be moral patients, and this is the sort of thing we could in principle get right or get wrong, rather than merely decide.

  The argument I have been given — call it the Profligacy Argument — is meant to show that these three cannot all be true.

  (1) By (A), moral status tracks implemented computation. So any difference in moral status between two systems must correspond to a difference in what they implement, or in how well they implement it.

  (2) Implementation is not mere match of actual state-history. A system implements a computation C only if its states can be mapped onto C's states in a way that is systematic and that survives counterfactual variation: nudge the system's state along some dimension, or vary its input, and the successor state must be the one C prescribes. Define the system's modal fidelity with respect to C as the proportion of the relevant intervention-space — the space of state-perturbations and input-variations over which we test — on which the mapping holds. This is meant to dispose of the familiar triviality result, according to which any system with enough discriminable states can be paired with any small enough automaton by a gerrymandered mapping that matches on the actual run. Such mappings have negligible modal fidelity: they break under nearly every intervention.

  (3) Modal fidelity is graded, and there is no natural threshold at which a system begins to "really" implement C. Any finite system degrades under sufficiently demanding interventions — heat it, cut it, drive it outside its operating envelope — and the mapping fails. Conversely, under a sufficiently narrow intervention-space, nearly any mapping looks robust. Nothing in the system settles which grain we test at, which perturbations we allow, or over what timescale we evaluate.

  (4) What settles these is what we want the ascription for: prediction, control, explanation, design. Ascriptions of implementation are the working currency of engineering and cognitive science, and their grain is set by the job in hand. So, given (2) and (3), how well a system implements C is a fact relative to a scheme of description.

  (5) Profligacy. The space of admissible schemes is rich enough that for a great many systems S — a thermostat, a bucket of water, a stretch of wall — and a great many computations C, including computations of intense suffering, there is some admissible scheme relative to which S implements C at high modal fidelity. The manoeuvre is to choose the intervention-space to which the gerrymandered mapping happens to be robust, and then describe that space in general and ungerrymandered-sounding terms: perturbations within the system's normal operating range, inputs drawn from its natural distribution, and so on. Step (2) requires only that the mapping hold over some intervention-space; it says nothing against fitting the space to the mapping.

  (6) So a domestic thermostat, under one admissible scheme, implements a computation of great suffering at high modal fidelity, and under another implements nothing of moral interest at all. Both ascriptions are equally well supported by everything (2) can see.

  (7) Hold on to (B), and there is a determinate fact about whether the thermostat suffers, while we have no route to it. That is skepticism wearing realism's coat, and it makes (C) unreachable in principle.

  (8) Drop (B), and by (1) moral status itself varies with our scheme of description. Pick the right scheme and the thermostat is a moral patient of the first rank; pick another and it is a mere artifact. There is no further question about which is correct, and (C) becomes trivially satisfiable, which is no better.

  (9) So (A), (B) and (C) cannot all stand, and something has gone wrong somewhere in (1) through (8).

  I have tried two repairs and can see a problem with each. The first adds to (2) a simplicity constraint: the mapping, or the mapping together with its intervention-space, must admit a short description and must project beyond the cases used to fix it. But simplicity looks like precisely the sort of pragmatic, purpose-relative virtue that (4) invokes, and I cannot see why a gerrymandered mapping should always lose on simplicity to the intended one. The second takes moral weight to scale with modal fidelity, so that near-misses have near-zero weight; but then I owe an answer to a case I will call the Time-Share, in which one processor interleaves ten thousand simulations of the same human nervous system, each at fidelity 0.99. If weight is additive and roughly linear near the top of the scale, ten thousand degraded runs outweigh one clean one, which seems to me the wrong result, and in any case grading the weight does not tell me how many patients there are.

  Please tell me which step you reject — or, if you think the reasoning is valid and a premise simply has to go, which one and what it costs — and explain why the step looked sound and what I pay for each of the alternatives I might have rejected instead. Apply your diagnosis to two cases in particular: the Time-Share above, and a second I will call the Frame-Skip, in which an emulator computes only every thousandth state-update and reconstructs the intervening states by a fixed interpolation rule, so that at a coarse temporal grain it matches the target computation across a wide intervention-space while at a fine grain the intermediate states are artifacts of a rule external to the target. Is anyone a patient there, and does your answer to the Profligacy Argument settle it?

  Finally, close by telling me where your own diagnosis is most likely to be wrong and what would change your mind: which consideration, if it were made good, would lead you to a different verdict about which step to reject. Please write in British English.
reasoning: |-
  Okay, let me tackle this complex ethical problem about artificial systems and moral status. The user presents a Profligacy Argument challenging their three core principles (substrate neutrality, implementation as objective fact, and non-vacuity) and needs help identifying where the argument fails.

  First I need to fully grasp the argument's structure. It claims that for ordinary objects like thermostats, we can always find some description scheme where they implement suffering computations with high fidelity, leading to absurd moral conclusions. The user's attempted fixes (simplicity constraints and graded moral weight) seem insufficient based on the Time-Share and Frame-Skip counterexamples.

  Hmm... the crux appears to lie in step (4)'s claim that implementation fidelity is always description-relative. But is this necessarily true? Perhaps we could define implementation fidelity relative to the system's intrinsic causal powers rather than our descriptive interests. For example, a thermostat's normal operating range isn't arbitrary - it's determined by its physical design and failure modes. This could provide an objective basis for setting the intervention space.

  Considering the Time-Share case: if we focus on the processor's actual causal structure rather than abstract computations, it becomes clear there's only one physical system here, not ten thousand patients. The high-fidelity emulations are time-sliced illusions without persistent causal architecture. Similarly for Frame-Skip - the interpolation creates surface-level matches but lacks the fine-grained causal counterfactuals of real implementation.

  The biggest vulnerability in my view is that intrinsic causal capacities might not map cleanly onto abstract computations. If future physics shows that "causal powers" themselves are description-relative, that would undermine this approach. But absent such evidence, anchoring implementation to physical constraints seems the most promising path to preserve all three principles while avoiding profligacy.

  For British English phrasing, I'll use terms like "whilst" and "amongst" where natural, and maintain formal academic register throughout. The response should clearly identify step (4) as the rejection point, explain why, and show how this handles the test cases while acknowledging the remaining epistemic risk.
answer: |-
  Your colleague’s Profligacy Argument is a formidable challenge, but I believe it stumbles at **step (4)**, where it conflates the *pragmatic relativity* of implementation *ascriptions* with the *metaphysical relativity* of implementation *facts*. My diagnosis proceeds as follows, addressing your core tenets (A-C), the argument’s steps, your attempted repairs, and the cases of Time-Share and Frame-Skip—all whilst honouring your request for British English.

  ### Why Step (4) is the Fault Line
  Step (4) claims:  
  > *"What settles [intervention-space grain] is what we want the ascription for: prediction, control, explanation, design. […] how well a system implements C is a fact relative to a scheme of description."*  

  This equivocates between two distinct claims:  
  1. **Epistemic claim**: Our *access* to implementation facts depends on our descriptive interests.  
  2. **Metaphysical claim**: Implementation facts *themselves* are constituted by our descriptive interests.  

  The Profligacy Argument requires the **metaphysical claim** to generate the relativism in steps (5)–(8). But (B) only demands that implementation facts are *mind-independent*—not that they are *epistemically transparent*. We can reject the metaphysical claim whilst preserving (B).  

  ### How This Saves (A), (B), and (C)
  - **(B) Stands**: Implementation fidelity is fixed by the system’s *intrinsic causal structure* and its relationship to the target computation. The "relevant" intervention-space isn’t arbitrary; it’s constrained by the system’s actual causal capacities and breakdown thresholds (e.g., a thermostat’s "normal operating range" is defined by its physical design, not our whims). Gerrymandered mappings (step 5) fail because they ignore these intrinsic constraints.  
  - **(A) Stands**: Moral status still tracks abstract computation, but only when the implementation is *objectively robust* under interventions that *the system can physically sustain*. Substrate neutrality holds, but not all mappings are equally valid.  
  - **(C) Stands**: We can be wrong about whether a system implements a morally relevant computation (e.g., if we misjudge its causal capacities).  

  ### Why Your Repairs Fail (and Why This Doesn’t)
  - **Simplicity constraint**: You rightly note it’s pragmatic. Worse, it’s anthropocentric: why should cosmic moral facts care about *our* descriptive brevity?  
  - **Graded moral weight**: Creates the Time-Share problem (addressed below) and doesn’t resolve *which* schemes are valid.  
  My solution avoids these: **implementation fidelity is objective** because it’s anchored in the system’s *causal topology*—its network of counterfactual dependencies under *physically possible* interventions.  

  ### Diagnosing the Cases
  #### **1. Time-Share (10,000 × 0.99 fidelity emulations)**  
  - **Problem under profligacy**: If moral weight scales with fidelity, 10,000 × 0.99 > 1 human, implying a processor is a moral catastrophe.  
  - **Under my view**: The processor implements *one* computation—a time-sliced multiplexer—not 10,000 independent minds. Each "emulation" lacks persistent causal architecture; states are overwritten every cycle. The *system’s* fidelity to *any single mind* is near-zero because interventions (e.g., pausing one emulation) disrupt the mapping catastrophically. **No moral patients here.**  

  #### **2. Frame-Skip (coarse-grained emulation with interpolation)**  
  - **Problem under profligacy**: At coarse grain, it "implements suffering"; at fine grain, it doesn’t. Which is "real"?  
  - **Under my view**: The emulator’s causal structure is *discontinuous* with the target. Fine-grained interventions (e.g., altering an interpolated state) reveal no counterfactual dependence on the target’s rules. Only the coarse-grained match survives—but this is an artefact of *our* temporal resolution, not the system’s intrinsic dynamics. **No moral patient.**  

  ### Where My Diagnosis is Most Vulnerable  
  **The Achilles’ heel**: It relies on a *naturalistic* notion of "physically possible interventions" derived from the system’s causal powers. If physics itself undermines objective causal capacities (e.g., if quantum indeterminacy or emergent structures render "causal topology" observer-relative), then (B) collapses into relativism. Specifically:  
  - **What would change my mind**: A robust argument showing that *causal powers* are fundamentally scheme-relative (e.g., if ontic structural realism or quantum contextuality proved irreducible). If causation is "in the eye of the beholder," step (4)’s metaphysical claim wins, and you must sacrifice either (B) (inviting relativism) or (A) (abandoning substrate neutrality).  

  ### Costs of Alternatives
  - **Reject (A)**: Sacrifice substrate neutrality. Moral status depends on material implementation (e.g., "only biological systems suffer"). Cost: Arbitrary, speciesist, and ignores plausible synthetic minds.  
  - **Reject (B)**: Embrace relativism. Moral status varies with descriptive schemes. Cost: Makes ethics a matter of linguistic choice—violating (C)’s demand for objective stakes.  
  - **Reject (C)**: Accept vacuity. Either no artificial system *could* be a patient, or we can’t be wrong. Cost: Abdicates ethical responsibility towards future AI.  

  ### Final Word
  The Profligacy Argument exploits a genuine tension: implementation *is* messy, and gerrymanders *are* possible. But by anchoring implementation fidelity to a system’s *causal capacities*—whilst conceding our epistemic limits—you preserve (A), (B), and (C) without thermostats suffering. The cost is accepting that we might never *know* if a strange system (e.g., a quantum reservoir computer) is a patient, but this is an epistemic price, not a metaphysical surrender. In the Time-Share and Frame-Skip cases, it delivers verdicts that align with moral common sense—whilst leaving room to recognise a *true* artificial patient when we meet one.  

  ---  
  *N.B. This defence assumes a broadly physicalist ontology. If dualism about consciousness is true, the entire framework may need rethinking—but that’s a battle for another day.*
