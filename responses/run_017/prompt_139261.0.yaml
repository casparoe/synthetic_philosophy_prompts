  **Key Clarifications**:  
  - Popper’s retreat from calling natural selection “metaphysical” (1974) reframes the debate: the EES inherits natural selection’s *practical* testing challenges but not its initial unfalsifiability stigma.  
  - Your friend’s strongest point (EES avoiding risky predictions) echoes Popper’s critique of “immunizing stratagems,” but Popper accepted that nascent ideas often start as vague heuristics before generating tests.  
  - His *evolutionary epistemology* makes him sympathetic to frameworks like cultural evolution, as they mirror his view of knowledge advancement through variation and selection.  
