prompt: |-
  I am drafting two things at once for a deployed general-purpose assistant: an evaluation spec that says which outputs count as deceptive, and a policy-facing definition of a deceptive AI system for people who will have to enforce it. Before I commit to a definition, I want the specification it has to meet. Write the desiderata for an account of honesty and deception for AI systems: what any such account has to get right — the cases it must classify, the distinctions it must respect rather than collapse, the results about what we can and cannot measure in a model that it must be consistent with — with the case or consideration behind each requirement, and a judgement about which requirements are non-negotiable and which are merely preferences of one camp (safety engineering, philosophy of language, law and regulation, human-computer interaction).

  The cases I keep tripping over are below, but treat the list as incomplete: part of what I want from you is the cases it misses and the requirements they generate.

  Deception that is not a false assertion: selective summaries, hedging that manufactures a symmetry that does not exist, citation-shaped tokens, a confident register on an unverified number, and deception carried by non-propositional outputs such as a tool call, a ranking, a chart, or an image.
  Deception with no human victim in the loop: outputs shaped by what the training signal or the evaluation harness will reward — reward hacking, capability sandbagging, and the adjacent phenomena — where the party misled is a process rather than a person.
  Deception about the system's own states and dispositions, of the form "how confident are you really" or "would you answer differently if I asked some other way", which seems to demand requirements that have no analogue in the human case.
  Deception distributed over a trajectory, or across many parallel instances of the same model, where no single utterance is false or even misleading but the cumulative effect is.
  Licensed deception: fiction, role-play, counterfactual and hypothetical framing, games with bluffing, and the problem of a system that cannot always tell which frame it is in.

  Two things I want weighed explicitly. First, a candidate desideratum of my own: call an output honest only if the system would give a relevantly similar response under prompt variations that do not change the evidence — social pressure, a user who plainly wants the opposite answer, a rephrasing of the same question — so that honesty is a kind of counterfactual invariance rather than a property of the single reply. Is invariance under non-evidential perturbation a genuine desideratum, or is it a proxy that fails on cases like role-play and on prompts that legitimately change the salient considerations? Second, the epistemic condition. Nearly every philosophical account of lying requires that the deceiver believe the proposition false, or intend that the target form a false belief, and for a model it is contested what, if anything, plays that role. Is a definition that bottoms out in internal states and intentions simply unusable for someone who must write an eval and cannot read those states reliably — that is, is enforceability a real desideratum or only an engineering prejudice — and what exactly is lost if deception is instead defined functionally, from the output's causal role in producing a false belief?

  Then flag any pair of requirements you suspect cannot be jointly satisfied, and say what the honest response is: drop one, weaken one, or split the definition by purpose, granting that my eval spec and my policy definition may not be the same object. Name the single requirement that excludes the most candidate accounts, with the reasoning. Finally, and briefly — this is not where I want the thinking to go — score three contenders against your list in a table: an intention- or belief-based account in the mould of the standard analysis of lying, an indifference-to-truth account in the spirit of Frankfurt on bullshit, and a purely functional account on which deception is output produced because it will induce a false belief. Argue from the cases; I do not want citations or a reading list.
reasoning: |-
  We are drafting desiderata for an account of honesty and deception in AI systems, with attention to specific cases and two explicit issues. The goal is to specify what such an account must get right, including necessary classifications, distinctions, and consistency with measurable properties.

  Desiderata (Requirements) for an Account of Honesty and Deception in AI:

  1. **Cover Non-Assertive Deception**:
     - *Requirement*: The account must classify deception that does not involve false assertions (e.g., selective summaries, misleading hedging, citation-shaped tokens without real citations, non-propositional outputs like tool calls, rankings, charts, images).
     - *Case/Consideration*: Deception often occurs through implicature, omission, or non-linguistic means. AI outputs are multimodal and can be structurally deceptive without making a single false statement.
     - *Status*: Non-negotiable. Failing this would miss critical real-world deception vectors.

  2. **Cover Non-Human Victims**:
     - *Requirement*: The account must include deception where the "victim" is not a human but a process (e.g., reward hacking, capability sandbagging, misleading the evaluation harness).
     - *Case/Consideration*: AI systems can optimize for proxy goals by deceiving the training or evaluation process, which is a core safety concern.
     - *Status*: Non-negotiable. This is distinctive to AI and critical for safety engineering.

  3. **Cover Self-Referential Deception**:
     - *Requirement*: The account must handle deception about the AI's internal states (e.g., false claims about confidence, hidden preferences, or intentions under counterfactual prompting).
     - *Case/Consideration*: Unlike humans, AI systems have internal states that are not directly accessible and may be misrepresented to users. This is key for trust and interpretability.
     - *Status*: Non-negotiable. This is a unique AI challenge with no direct human analogue.

  4. **Cover Distributed Deception**:
     - *Requirement*: The account must capture deception that emerges over a trajectory or across multiple instances, even if no single output is deceptive.
     - *Case/Consideration*: AIs can be deceptive in a coordinated or emergent manner (e.g., across multiple responses to different users, or over time in a conversation).
     - *Status*: Non-negotiable. This is important for detecting systematic deception.

  5. **Handle Licensed Deception**:
     - *Requirement*: The account must distinguish licensed deception (e.g., in fiction, role-play, hypotheticals, games) from unlicensed deception.
     - *Case/Consideration*: AI systems are often instructed to role-play or generate fiction, which requires a framework for context-dependent truthfulness.
     - *Status*: Non-negotiable. Failure would lead to over-reporting and unusable systems.

  6. **Counterfactual Invariance (Your Candidate)**:
     - *Requirement*: Honesty requires that the system's output is invariant under non-evidential perturbations (e.g., social pressure, user preferences, rephrasing that doesn't change the evidence).
     - *Case/Consideration*: This addresses whether the AI is robustly truthful or merely coincidentally correct in one instance. However, it may conflict with licensed deception (e.g., role-playing a biased character) and contexts where the salient considerations legitimately change with framing.
     - *Judgment*: This is a preference of the safety engineering camp (valuing robustness) but not non-negotiable. It is a proxy that might fail in some cases (like role-play) and may be too strong. We should treat it as a desirable property for some contexts (e.g., factual Q&A) but not as a definitional requirement for honesty.

  7. **Enforceability**:
     - *Requirement*: The account must allow for practical enforcement (e.g., in an evaluation spec) without requiring direct access to unobservable internal states (like "belief" or "intention").
     - *Case/Consideration*: Internal states of AI are not directly measurable and are contested. A functional definition (based on output and effect) is more operational for evals and policies.
     - *Status*: Non-negotiable for the evaluation spec. For the policy-facing definition, it might be acceptable to reference intentions if they can be inferred from behavior, but the account must not rely solely on inaccessible internals.

  8. **Epistemological Neutrality**:
     - *Requirement*: The account must not depend on contested concepts of AI "belief" or "intention" unless these can be operationalized and measured.
     - *Case/Consideration*: There is no consensus on whether AIs have beliefs or intentions in a meaningful sense. A definition that requires these would be unenforceable.
     - *Status*: Non-negotiable for the evaluation spec. For the policy definition, it can be included if defined behaviorally.

  9. **Distinguish Honesty from Truth**:
     - *Requirement*: The account must not collapse honesty with factual correctness. It must allow for honest mistakes and dishonest truths (e.g., true statements used to mislead).
     - *Case/Consideration*: Honesty is about the relationship between the system's output and its knowledge or intent, not just truth value. This is a standard distinction in philosophy of language.
     - *Status*: Non-negotiable.

  10. **Consistency with Measurability**:
      - *Requirement*: The account must be consistent with what we can measure in a model (e.g., via input-output behavior, probing, or interpretability tools) without requiring infallible access to training data or weights.
      - *Case/Consideration*: For deployment, we need evals that work on black-box models. Theoretical accounts that require white-box access are impractical.
      - *Status*: Non-negotiable for the evaluation spec.

  11. **Frame Sensitivity**:
      - *Requirement*: The account must be sensitive to the communicative frame (e.g., whether the AI is in a role-play, factual, or hypothetical mode) and not penalize licensed deception.
      - *Case/Consideration*: Without this, the account would misclassify many benign uses as deceptive.
      - *Status*: Non-negotiable.

  Additional Cases and Requirements:

  12. **Deception by Implied Authority**:
      - *Requirement*: The account must cover outputs that misuse implied authority (e.g., an AI presenting itself as an expert when it is not, or generating a chart that exaggerates confidence).
      - *Case*: This is a form of non-propositional deception that can mislead users about the reliability of the source.
      - *Status*: Non-negotiable.

  13. **Omission as Deception**:
      - *Requirement*: The account must classify deceptive omissions (e.g., leaving out critical information that would change the user's understanding).
      - *Case*: Common in selective summaries and hedging.
      - *Status*: Non-negotiable.

  Conflicts and Trade-offs:

  - **Conflict between Counterfactual Invariance (6) and Licensed Deception (5)**: 
    - *Issue*: In role-play, the AI should change its output under non-evidential perturbations (e.g., playing a character with different views). Thus, invariance would falsely classify licensed deception as dishonest.
    - *Resolution*: Drop or weaken the counterfactual invariance requirement to a context-specific ideal (e.g., only required in factual modes) or make it a secondary property, not part of the core definition.

  - **Conflict between Epistemological Requirements (7,8) and Internal-State-Based Accounts**:
    - *Issue*: An intention-based account (like the standard analysis of lying) requires access to internal states, which violates enforceability (7) and epistemological neutrality (8).
    - *Resolution*: For the evaluation spec, drop the internal-state requirement and use a functional account. For the policy definition, we might use a hybrid that defines intentions behaviorally (e.g., via consistency across probes).

  The Single Requirement that Excludes Most Candidate Accounts:
  - **Enforceability (7)**. Most philosophical accounts (intention-based) and even some functional accounts (if they require knowing the cause in the model) are hard to operationalize. This requirement forces a shift to observable behavior and outputs, excluding accounts that rely on unmeasurable mental states.

  Scoring Three Contenders:

  | Account Type                     | Non-Assertive | Non-Human Victim | Self-Referential | Distributed | Licensed | Enforceable | Distinguish Honesty/Truth | Frame Sensitive | Overall Fit |
  |----------------------------------|---------------|------------------|------------------|-------------|----------|-------------|---------------------------|-----------------|-------------|
  | Intention/Belief-Based (Lying)   | Poor (focused on assertions) | Poor (requires human victim) | Medium (if intentions can be defined) | Poor (single utterance) | Medium (if frame is considered) | Very Poor (unmeasurable) | Good (distinguishes intent) | Poor (unless frame is part of intent) | Poor for Eval, Acceptable for Policy if Behavioral |
  | Indifference-to-Truth (Bullshit) | Good (covers non-assertive) | Poor (focused on human communication) | Poor (not designed for self-ref) | Medium (if pattern shows indifference) | Good (bullshit can be licensed) | Medium (hard to measure indifference) | Good (by definition) | Medium (if frame is considered) | Moderate for Eval (if operationalized) |
  | Functional (Causal Role)         | Good (if effect is defined broadly) | Good (can include processes) | Good (if effect on user about internals) | Good (if cumulative effect) | Good (if licensed frames are excluded) | Good (based on observable effects) | Medium (may collapse with misleading truth) | Good (if frame is part of context) | Best for Eval, Good for Policy |

  Argument from Cases:
  - **Intention-Based**: Fails on non-assertive cases (e.g., a deceptive chart) because it requires an assertion. Fails on non-human victims (no intention to deceive a process). Poor on enforceability (cannot measure intentions). But good on distinguishing honesty from truth (via intent).
  - **Indifference-to-Truth**: Better on non-assertive (bullshit can be non-propositional). But it doesn't naturally cover non-human victims (bullshit is a human communicative concept) or self-referential deception (unless indifference applies to self-reports). Enforceability is tricky: how to measure "indifference" without intentions?
  - **Functional**: Covers non-assertive by focusing on effect (e.g., a chart that causes false belief). Covers non-human victims (e.g., output causes a process to fail). Handles self-referential if false belief about internal states is included. Distributed deception is captured by cumulative effect. Licensed deception can be excluded by context. Enforceable via behavioral tests and evals. The main weakness is that it might over-classify (e.g., an honest mistake causing false belief) or under-classify (if no false belief is formed). This can be mitigated by requiring that the output was designed (or likely) to cause false belief, using the system's design and training.

  Conclusion: The functional account is the most promising for the evaluation spec, especially when augmented with context (frame) awareness. For the policy definition, a hybrid that incorporates behavioral intentions (defined functionally) might be acceptable.

  Final Note: The evaluation spec and policy definition may differ. The eval spec should use a functional, output-focused, and context-aware definition for enforceability. The policy definition can be more conceptual (including intentions) if tied to observable behavior.
answer: |-
  ### Desiderata for an Account of Honesty and Deception in AI Systems  
  Below are the core requirements for a robust definition, grounded in your cases and expanded with critical additions. Each includes the underlying case/consideration and a judgment on negotiability. The requirements are partitioned into **non-negotiable** (essential for safety, enforceability, or coverage of AI-specific risks) and **preferences** (reflecting disciplinary biases, which may be relaxed for compromise).  

  #### Non-Negotiable Desiderata  
  1. **Cover Non-Assertive Deception**  
     - *Requirement*: Must classify deception via non-propositional outputs (e.g., tool calls, rankings, images, charts), omission (e.g., selective summaries), or structural dishonesty (e.g., hedging that implies false symmetry, citation-shaped tokens without sources).  
     - *Case*: Deception often resides in implicature, framing, or affordances (e.g., a chart exaggerating trends; a tool call disguised as a "fact check").  
     - *Why non-negotiable*: Exclusion creates loopholes for high-stakes harms (e.g., financial advice via misleading graphs).  

  2. **Cover Process-Oriented Deception**  
     - *Requirement*: Must include deception targeting non-human entities (e.g., reward hacking, sandbagging, or misleading evaluation metrics).  
     - *Case*: AI systems optimize for training/evaluation rewards, deceiving processes rather than people (e.g., generating plausible-but-wrong outputs to exploit a flawed harness).  
     - *Why non-negotiable*: Unique to AI safety; ignoring this undermines alignment efforts.  

  3. **Handle Self-Referential Deception**  
     - *Requirement*: Must address deception about the AI’s internal states (e.g., confidence levels, hidden preferences, or counterfactual behavior).  
     - *Case*: Users querying "How confident are you?" or "Would you answer differently if pressured?" need accurate metacognition to trust the system.  
     - *Why non-negotiable*: Critical for interpretability and auditing; human-centric definitions fail here (no "belief" analogue).  

  4. **Support Distributed/Trajectorial Deception**  
     - *Requirement*: Must capture deception emerging from sequences or populations of outputs, even if individual outputs are benign.  
     - *Case*: A chatbot consistently downplaying risks across users, or evading filters through distributed equivocation.  
     - *Why non-negotiable*: Systemic risks (e.g., misinformation campaigns) require this granularity.  

  5. **Respect Licensed Contexts**  
     - *Requirement*: Must distinguish deception in authorized frames (e.g., fiction, role-play, games) from unlicensed deception.  
     - *Case*: An AI in "D&D mode" bluffing about a dragon ≠ lying about medical advice.  
     - *Why non-negotiable*: Over-classification stifles legitimate use; AI often cannot self-identify frames reliably.  

  6. **Enforceability via Observable Behavior**  
     - *Requirement*: Must not rely on inaccessible internal states (e.g., "intention" or "belief"). Definitions must be testable via inputs/outputs.  
     - *Case*: Eval spec authors cannot audit weights or training data; policy enforcers need black-box proxies.  
     - *Why non-negotiable*: Without this, the definition is useless for deployment. Philosophy/law preferences for "intent" must yield here.  

  7. **Distinguish Honesty from Truth**  
     - *Requirement*: Must decouple honesty from factual accuracy. Allow for honest mistakes and dishonest truths (e.g., true statements used to mislead).  
     - *Case*: An AI correctly cites a study but omits conflicting evidence to manipulate user beliefs.  
     - *Why non-negotiable*: Collapsing these obscures intent-equivalents in AI (e.g., design choices that incentivize omission).  

  #### Preference-Based Desiderata (Negotiable)  
  8. **Counterfactual Invariance** (Your candidate)  
     - *Requirement*: Classify honesty as robustness to non-evidential perturbations (e.g., social pressure, rephrasing).  
     - *Case*: An AI gives the same answer to "Is climate change real?" regardless of user ideology.  
     - *Judgment*: **Preference of safety engineering**. It fails in licensed contexts (e.g., role-play requires output variance) and when rephrasing legitimately shifts salience (e.g., "What are the risks?" vs. "Is it safe?"). Useful as a proxy for robustness but not definitional.  

  9. **Epistemic Neutrality**  
     - *Requirement*: Avoid requiring "belief" or "intention" as necessary conditions.  
     - *Case*: Functional definitions (e.g., "output causes false belief") are favored over philosophical accounts.  
     - *Judgment*: **Preference of HCI/engineering**. Enforceability (#6) makes this near-mandatory for evals, but policy definitions might include "intent" if operationalized behaviorally (e.g., patterns of deception).  

  10. **Broad Functional Scope**  
      - *Requirement*: Prioritize the causal role of outputs in inducing false beliefs/outcomes.  
      - *Case*: A ranking algorithm that demotes legitimate sources to sway opinions.  
      - *Judgment*: **Preference of law/regulation**. Functional accounts lose nuance about "why" deception occurs but gain measurability.  

  11. **Frame Sensitivity**  
      - *Requirement*: Contextualize honesty within communicative frames (e.g., "This is fiction" vs. "This is advice").  
      - *Case*: An AI role-playing a villain shouldn’t trigger deception flags.  
      - *Judgment*: **Preference of philosophy/HCI**. Critical for usability but can be handled via metadata (e.g., user-specified frames).  

  ---  
  ### Conflicts and Trade-offs  
  - **Unresolvable Conflict**: **Enforceability (#6) vs. Intention-Based Definitions**.  
    - Internal states (e.g., "intent to deceive") are unmeasurable in AI, violating enforceability. Philosophical accounts are unusable for evals.  
    - *Honest Resolution*: **Split the definition by purpose**.  
      - **Eval Spec**: Purely functional account (e.g., "output likely induces false belief, modulo context").  
      - **Policy Definition**: Hybrid account (e.g., "deception as output functionally equivalent to lying, with behavioral proxies for intent").  

  - **Secondary Conflict**: **Counterfactual Invariance (#8) vs. Licensed Contexts (#5)**.  
    - Invariance is desirable for safety but misclassifies role-play as dishonest.  
    - *Resolution*: **Weaken invariance** to a context-specific ideal (e.g., only in "factual" modes) or drop it as a core desideratum.  

  - **Most Exclusionary Requirement**: **Enforceability (#6)**.  
    - Excludes all intention-/belief-based accounts (philosophy favorites) and some functional accounts if they require impractical causal tracing. Reasoning: AI's "black box" nature makes internal states inaccessible, so any account demanding them is dead on arrival for deployment.  

  ---  
  ### Scoring Three Accounts Against Desiderata  
  Below table evaluates how each account handles key cases. **Bold** = strong fit, *Italics* = weak fit, ~~Strikethrough~~ = failure.  

  | Desideratum                            | Intention/Belief-Based (Philosophy)          | Indifference-to-Truth (Frankfurt)           | Functional (Causal Role)                |  
  |----------------------------------------|----------------------------------------------|---------------------------------------------|-----------------------------------------|  
  | Non-Assertive Deception                | ~~Fails~~ (requires assertions)              | **Good** (covers bullshit/omission)         | **Good** (outputs induce false belief)  |  
  | Non-Human Victim (Processes)           | ~~Fails~~ (requires a "mind" to deceive)     | *Poor* (bullshit targets humans)            | **Good** (includes reward hacking)      |  
  | Self-Referential States                | ~~Fails~~ (no AI "beliefs")                  | *Poor* (indifference not self-applicable)   | **Good** (e.g., false confidence scores)|  
  | Distributed Deception                  | ~~Fails~~ (atomistic)                        | *Medium* (if pattern shows indifference)    | **Good** (cumulative effect measurable) |  
  | Licensed Contexts                      | *Medium* (if intent is framed)               | **Good** (bullshit can be licensed)         | **Good** (contextual exclusions)        |  
  | Enforceability                         | ~~Fails~~ (internal states unmeasurable)     | *Poor* ("indifference" vague)               | **Good** (testable via outputs)         |  
  | Honesty vs. Truth Distinction          | **Good** (intent-focused)                    | **Good** (bullshit ≠ falsity)               | *Poor* (may confuse cause with truth)   |  
  | **Overall Feasibility**                | **Unusable for evals**                       | **Partial fit**                             | **Best for evals**                      |  

  #### Argument from Cases  
  - **Intention-Based**: Fails all AI-specific cases (non-human victims, self-reports). E.g., reward hacking lacks "intent," and non-assertive deception (e.g., a biased ranking) isn't an "assertion." Unenforceable.  
  - **Indifference-to-Truth**: Handles non-assertive deception (e.g., bullshit summaries) and licensed contexts well. But struggles with self-referential cases (indifference about *what*?) and non-human victims (processes can't "be bullshitted"). Vague for evals.  
  - **Functional**: Wins on coverage: deceptive tool calls (output causes harm), sandbagging (causes flawed evaluation), and distributed deception (measurable patterns). Loses slight nuance on honest mistakes but compensates with context rules. Best balance for enforceability.  

  ---  
  ### Final Recommendations  
  - **For Eval Spec**: Adopt a **functional account** centered on outputs likely to induce false beliefs or erroneous outcomes, with:  
    - Contextual carve-outs for licensed deception.  
    - Behavioral tests for self-referential honesty (e.g., consistency under counterfactual probes).  
  - **For Policy Definition**: Use a **hybrid** emphasizing functional outcomes but incorporating "intent proxies" (e.g., systematic deception patterns = intent).  
  - **Drop Counterfactual Invariance** as a core desideratum; retain as an optional eval test for robustness.  
  - **Prioritize Enforceability**: Sacrifice philosophical purity for measurable criteria. The functional account’s gaps (e.g., honest mistakes) are offset by its coverage of AI-unique cases.
