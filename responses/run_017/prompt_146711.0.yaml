  ### Step 1: Restating the Metaphysical Positions in Data Vocabulary

  #### Endurantism
  - **Core claim**: An object is wholly present at every moment of its existence. It persists by being numerically identical at different times. It has temporary intrinsics (properties that can change over time without changing the object's identity).
  - **Translation to data structures**:
    - **Primary key**: The object is identified by a stable primary key (PK) that remains constant throughout its lifetime. This PK is the numerical identity.
    - **Mutable record**: The object is represented as a single row in a table that is updated in-place. The history of changes is derived (e.g., via system-versioned tables or CDC logs), but the current state is the primary representation.
    - **Temporary intrinsics**: Each attribute of the row (e.g., `shape` for the ship) is mutable. When the ship is straight, we update the `shape` column to 'straight'; when bent, we update to 'bent'. The same row (same PK) is present at both times.
    - **Validity intervals**: If we use bitemporal tables, the valid time interval represents when the state is factually valid, and the transaction time records when we recorded it. The object (by PK) exists across the valid time interval, and at each valid time, it is wholly present (all attributes for that time).
    - **Audit requirements**: The history is a derived artifact (e.g., a materialized view from the event log or a system-versioned history table). The current state is the primary interface.

  #### Perdurantism (Worm Theory)
  - **Core claim**: An object persists by having temporal parts. It is a four-dimensional space-time worm. At each time, only a part of the object (a temporal slice) is present. The whole object is the sum of these parts.
  - **Translation to data structures**:
    - **Append-only sequence**: The object is represented as an append-only event log (or a sequence of immutable versions). Each event or version is a temporal part.
    - **Surrogate keys for temporal parts**: Each event or snapshot has its own surrogate key (SK). The object's identity is then a higher-level construct, often represented by a stable identifier (e.g., a `stream_id` or `entity_id`) that groups these temporal parts.
    - **Projection of current state**: The current state is derived by projecting the latest event or by replaying the events. It is a materialized view.
    - **Temporal parts as rows**: In a table, we might have a row for each temporal part (e.g., a row per version in a slowly changing dimension of type 4). The valid time interval for each row represents the time during which that temporal part exists.
    - **Whole object**: The entire set of rows (with the same `entity_id`) over the object's lifetime is the perduring object.

  #### Stage Theory (a variant of Perdurantism)
  - **Core claim**: Objects are instantaneous stages (temporal parts). Persistence is accounted for by counterparts: a stage at one time is a counterpart of a stage at another time if they are appropriately related (e.g., by psychological continuity for persons). There is no single entity that spans time; instead, we have a series of stages linked by counterpart relations.
  - **Translation to data structures**:
    - **Immutable event logs as stages**: Each event in the log is a stage. There is no stable identifier for the object across time. Instead, we have a clustering mechanism (like entity resolution) that groups events (stages) into equivalence classes (counterpart relations) based on similarity or continuity.
    - **Entity resolution as counterpart relation**: The grouping of events into an object is not given by a fixed key but by a clustering algorithm that may change over time (as new events arrive and the clustering is recomputed). This is similar to the prototype without stable identifiers.
    - **Projections as snapshots**: A materialized view (snapshot) at a particular time is a stage. The continuity between stages is defined by the resolution rules (e.g., same name, similar attributes, etc.).
    - **No stable identity**: The object's identity is not fixed but is the result of the current clustering.

  ### Step 2: Mapping Commitments to Data Constructs with Explicit Bending

  #### Endurantism
  - **Clean mappings**:
    - Primary key as numerical identity over time: clean.
    - Mutable record representing the whole object: clean.
