      "cost": "Rejecting step (6) ignores that its overgeneralization depends on step (4)’s error; without (4), (6) loses force, so discarding it adds nothing."
    },
    {
      "step": "7",
      "verdict": "keep",
      "cost": "Rejecting step (7) avoids the conclusion but fails to address the argument’s core flaw; it leaves step (4) unchallenged and thus (a) undefended."
    }
  ]
  ```

  **Knowledge standard helps**: **partially**. Shifting to knowledge of virtual certainty (e.g., "knew destruction was virtually certain") might classify Vardena as genocide by capturing foresight, satisfying (b) better. But it undermines (a) severely by blurring intent and recklessness, making genocide indistinguishable from foreseeable-byproduct policies like aggressive assimilation or deportation.

  **Confidence**: **high**.

