answer: |-
  ### Diagnosis

  The argument fails at **step (4)**, which erroneously equates the *evidentiary basis* for inferring intent with the *conceptual content* of intent itself. Step (4) claims that the "evidentially available content of intent" is "exhausted by the pattern of acts plus context," leaving no "behavioural residue" to distinguish intent from foresight or instrumental use of destruction. This is a modal slide: it conflates *how we know* intent (epistemology) with *what intent is* (ontology). Intent remains a distinct mental state even when inferred circumstantially; the absence of direct evidence does not collapse the *definition* of intent into the conduct used to prove it. Tribunals infer intent *as a separate element* from patterns of conduct precisely because they recognize that the same acts (e.g., destroying crops) could reflect different intents (genocidal destruction vs. counterinsurgency). The "only reasonable inference" standard (used by tribunals) escapes this by requiring that the evidence *compel* the conclusion of genocidal intent, excluding other plausible aims. Step (4)’s fallacy enables step (5) to mischaracterize Vardena as genocide by ignoring that intent requires purpose, not just foreseeable consequences.

  **Why it seemed fine**: Step (4) appears sound because it correctly observes that intent is inferred solely from external evidence, and this inference process can feel like a tautology when the conduct is extreme. It resonates with the practical challenge that perpetrators rarely confess genocidal aims.

  **Vardena verdict**: **not_genocide**. The program’s stated aim (ending insurgency, reducing administrative costs), rejection of killing to avoid backlash, and use of non-lethal coercion (assimilation incentives) support the inference that group destruction was a foreseen side effect, not the purpose. Absent evidence that ministers *aimed* at destruction (e.g., documents celebrating cultural erasure), the pattern aligns with forced assimilation—a crime against humanity, but not genocide.

  **Price paid**: Rejecting step (4) preserves **desideratum (a)** intact—the moral/legal distinction between *intending* destruction and other aims remains robust. However, it strains **desideratum (b)** moderately: proving intent still relies on evidence patterns, so exceptionally deniable campaigns might evade liability if no circumstantial trail exists, but this is mitigated by tribunals’ willingness to infer intent from systematic, group-destructive conduct.

  **Alternatives**:
