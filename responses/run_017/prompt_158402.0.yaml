prompt: |-
  In the replication literature I keep meeting a pair of reactions that I cannot tell are consistent. When a well-powered, pre-registered replication of a well-known effect comes back null, the field does not say the hypothesis has been refuted; it says the effect is smaller than published, or context-dependent. The original authors point to differences in population, measure, or procedure, or to unmeasured moderators, and reviews and textbooks go on treating the finding as standing. When the same effect is replicated in a different country with a different measure, nobody calls that context-dependence: it is reported as evidence of generality, and the finding is treated as established.

  Reconstruct the epistemology this pair of reactions presupposes. My suspicion is that the hypothesis actually in play is not that the manipulation raises the outcome, but a quantifier-hedged claim — that there is some nonempty set of populations, measures, and settings in which it does, with the boundaries left unspecified — so that no pattern of results across studies could refute it. Say whether that is right, what such a claim is worth if so, and what would have to be added to make it testable: moderators specified in advance, a stated mechanism, pre-registered predictions of where the effect should be absent.

  Then separate what the practice strictly requires from what it merely fits. Does an error-statistical or severity-based view license the asymmetry, does a Bayesian picture on which the true effect is itself a distribution across contexts license it more naturally, or is it best explained as a convention for assigning credit and blame to researchers? Notice too that on a strict significance-testing logic a null replication is absence of evidence rather than evidence of absence — so tell me whether the reluctance to say *refuted* is the same logic that ought also to stop the field from saying *established* when a replication succeeds.

  A reform has been floated where I work: before a registered replication is run, the original authors file, sealed, the conditions under which they would publicly withdraw the claim, and a failure meeting those conditions counts as a refutation. What does current practice deny that this reform assumes?

  Be explicit about which parts of your reconstruction are common ground among statisticians and philosophers of science who work on replication, which are live disputes, and where you are extrapolating.
reasoning: |-
  Hmm, this user presents a sophisticated critique of replication practices in social sciences. They've identified a clear asymmetry in how null replications versus successful cross-context replications are treated, and want me to reconstruct the underlying epistemology. 

  The core issue seems to be that null results get explained away through context-dependency arguments, while successful replications in new contexts are taken as evidence of robustness. The user suspects this implies the actual hypothesis is an unfalsifiable existential claim about there existing some context where the effect holds.

  I need to break this down systematically. First, reconstructing the presupposed epistemology: it does appear the field operates with a "some-context" hypothesis rather than a universal one. This makes the claim technically unfalsifiable since any null result can be attributed to wrong context. 

  But is this what statisticians actually endorse? From what I know, most methodologists would consider this poor practice. The user's suspicion about an unfalsifiable claim seems correct as description of common behavior, but not as normative epistemology. 

  Now evaluating what such a claim is worth: frankly, very little scientifically. An existential claim without boundaries has minimal predictive power. To make it testable, we'd need either: a) specified moderators with directional predictions, b) stated mechanisms that define boundary conditions, or c) pre-registered contexts where absence is expected.

  Regarding explanatory frameworks: 
  - Error statistics would reject the asymmetry since both types of replications provide information about effect sizes and boundary conditions
  - Bayesian models with hierarchical effects could naturally accommodate context-dependence but still require specifying plausible parameter spaces
  - Credit/blame dynamics likely play a bigger role than statistical principles

  On the significance testing point: strictly speaking, both "established" and "refuted" are too strong under NHST logic. A single significant result doesn't confirm a hypothesis, just rejects the null. But in practice, fields treat successful replications as stronger evidence than NHST alone justifies.

  The sealed conditions reform is fascinating. It forces specificity about falsification criteria that current practice avoids. Current practice denies that hypotheses can be conclusively falsified by any single replication, while this reform assumes we can define decisive falsification conditions in advance.

  I should note areas of consensus: most methodologists agree that context-dependence matters, but disagree on how to handle it. The live disputes center on whether universal claims are ever appropriate in social science, and how to formalize context. My extrapolation is that credit economy explains more of the asymmetry than statistical principles do.
answer: |-
  Below is a step-by-step reconstruction of the epistemology underlying the asymmetry in replication reactions, addressing your questions about testability, explanatory frameworks, and reforms. I distinguish between *descriptive* (how the field behaves) and *normative* (what statisticians/philosophers argue) perspectives, noting points of consensus and dispute.

  ---

  ### **1. The Presupposed Epistemology**
  **Your suspicion is correct:** The implicit hypothesis is not universal ("Manipulation X *always* increases outcome Y") but **existentially hedged**:  
  *"There exists some non-empty set of populations, measures, settings, or moderators where manipulation X reliably increases outcome Y."*  

  - **Why this fits the reactions:**  
    - A null replication is dismissed as "contextual failure" (e.g., wrong population/unmeasured moderator), preserving the existential claim.  
    - A successful cross-context replication is celebrated as proof of "generality" because it expands the known domain of the existential claim.  
  - **What this claim is worth:**  
    Minimally. An unfalsifiable existential claim has little scientific value because:  
    - It predicts nothing concrete (e.g., "Somewhere, aspirin cures headaches" is untestable).  
    - It invites post hoc rationalization of failures without advancing theory.  
    - **Consensus:** Philosophers (e.g., Popper, Lakatos) and statisticians (e.g., Mayo, Gelman) agree such claims are epistemically weak.  

  **To make it testable**, the hypothesis must be refined with:  
  - **Pre-specified moderators:** e.g., "Effect holds in WEIRD populations but not East Asian ones."  
  - **Mechanistic boundaries:** e.g., "Effect requires ego-depletion; absent under low cognitive load."  
  - **Pre-registered absence predictions:** e.g., "Effect will vanish if Measure B replaces Measure A."  
  *Live dispute:* Some argue all social science claims *must* include moderators (Simons et al., 2017); others counter that initial discovery studies can be exploratory.  

  ---

  ### **2. Explaining the Asymmetry: Which Frameworks License It?**  
  The asymmetry arises from conflating **evidential strength** with **credibility contests**. Here’s how different frameworks view it:  

  | **Framework**       | **Licenses Asymmetry?** | **Why/Why Not?**                                                                 |
  |---------------------|-------------------------|----------------------------------------------------------------------------------|
  | **Error-Statistics (Mayo)** | No                      | A null replication *is* evidence of absence if the test had high *severity* (power to detect a meaningful effect). Asymmetric reactions violate severity logic. |
  | **Bayesian**        | Yes, naturally          | If the true effect is a *distribution* across contexts, a null result updates the distribution (e.g., smaller mean or higher variance) but doesn’t refute the existence of *some* positive effect. Success elsewhere is stronger evidence for the effect’s existence. |
  | **Credit/Blame Dynamics** | Best fit              | Researchers protect their reputation by explaining away failures ("not my fault") while claiming credit for successes ("my effect is robust!"). Textbooks perpetuate this to avoid admitting errors. |
  | **NHST Logic**      | Partially               | Null results are "absence of evidence," not "evidence of absence" *only* if power was low. But successful replications *also* shouldn’t "establish" universal truths (Type I errors occur). **The reluctance to say "refuted" *should* apply symmetrically to declaring "established."** The asymmetry is inconsistent. |

  **Consensus:**  
  - Statisticians (e.g., Wasserstein, Gelman) agree that "established" is overstated for a single successful replication.  
  - Philosophers (e.g., Nosek, Ioannidis) argue the asymmetry reflects sociology of science, not sound epistemology.  

  **Extrapolation:**  
  I infer that **credit economy** explains >90% of the asymmetry. Fields reward novel findings but punish admitting errors, creating perverse incentives.  

  ---

  ### **3. The Sealed Conditions Reform: What Current Practice Denies**  
  **Reform:** Original authors pre-specify sealed conditions for withdrawing claims if a replication fails.  

  **What current practice denies:**  
  - **Falsifiability as a core principle.** Current practice treats hypotheses as "contextually immortal" (immune to direct refutation). The reform assumes hypotheses *can and should* be falsifiable under agreed criteria.  
  - **Accountability.** Authors must commit *in advance* to what counts as disproof, denying the "endless excuses" strategy.  
  - **Shared epistemic standards.** It assumes the field can define decisive falsification conditions, rejecting the idea that all effects are moderator-dependent.  

  **Dispute:**  
  - **Pro:** This imposes Popperian falsification (e.g., "If effect < d=0.2 in this pre-registered protocol, we retract").  
  - **Con:** Critics (e.g., external validity advocates) argue no replication can falsify a claim if contexts are meaningfully different.  

  ---

  ### **4. Summary: Key Points of Agreement and Dispute**  
  | **Aspect**                | **Common Ground**                                       | **Live Disputes**                                                                 |
  |---------------------------|--------------------------------------------------------|----------------------------------------------------------------------------------|
  | **Hypothesis Status**     | Existential claims are weak/non-testable.              | Can universal claims *ever* work in social science?                              |
  | **Asymmetry**             | Not justified statistically; reflects incentives.      | Is Bayesianism a valid defense? How to model context-dependence?                 |
  | **Replication Logic**     | Null ≠ refutation if underpowered; success ≠ proof.    | Does pre-registered absence prediction solve the problem?                        |
  | **Reform**                | Pre-specified falsification criteria improve rigor.    | Are sealed conditions practical? Who defines "relevant" contexts?                |

  **Bottom Line:**  
  The asymmetry is primarily sustained by incentives, not sound epistemology. Current practice conflates *evidence for an effect’s existence* (which replications support) with *evidence for its universality* (which they rarely test). Specifying moderators, mechanisms, and falsification criteria forces hypotheses to bear empirical risk—the hallmark of progressive science.
