  **Key**: ✓ = Directly predicts/explains; △ = Partial/contextual fit; ✗ = Does not apply.  

  ---

  ### **Conclusions**  
  - **Readings are Logically Independent**: Goodhart's law is a cluster of distinct claims sharing a label. Statistical Decay (1) is a platitude; Effort Distortion (2) and Optimization Robustness (4) are well-supported; Radical Goodhart (7) is radical and debated.  
  - **Lab Argument**: Only Radical Goodhart (7) supports "never optimize," but it is not empirically robust. Engineering responses are justified by other readings (e.g., 1, 3, 4).  
  - **Policy Argument**: Effort Distortion (2) and Proxy Exploitation (3) suffice; Radical Goodhart is unnecessary.  
  - **Closing-Down Discussions**: People often invoke Radical Goodhart (7) or absolutist interpretations of Optimization Robustness (4) to shut debate, but weaker readings are more defensible.  
  - **Reflexive Worry**: Anti-gaming measures *can* degrade via the same mechanisms, revealing no special immunity.  

  **Final Advice**: Reject Radical Goodhart in lab settings—it conflates RL-specific risks (handled by Optimization Robustness) with philosophical pessimism. For reward modeling, combine multiple proxies, cap optimization steps, and audit with human oversight. In policy, avoid single metrics and monitor unmeasured dimensions.
