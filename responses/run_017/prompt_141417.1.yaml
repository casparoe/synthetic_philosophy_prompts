prompt: |-
  I'm a PhD student in computer science working on reward modelling for RLHF, and Goodhart's law has started doing an enormous amount of unexamined work in my surroundings. Two episodes prompted this. In a lab meeting last month, a senior student killed a proposal to train a learned reward model as a proxy for helpfulness by saying, flatly, that the moment you optimize against a proxy it stops tracking the thing you care about, so the only honest options are direct human oversight or nothing. A week later, in a reading group on accountability in public administration that I sit in with the policy school, a visitor used what sounded like the same argument against hospital waiting-time targets and against test-based accountability in schools: set a number, and the number is destroyed. I notice that the wording in circulation is usually credited to Marilyn Strathern, quoting Keith Hoskin, as: "When a measure becomes a target, it ceases to be a good measure"; whereas what I'm told is Goodhart's own 1975 statement is: "Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes." Those strike me as claims of quite different shapes — one about a measure's fidelity, one about a regularity's stability under deliberate control — and I don't want to spend the answer on the genealogy (I know there are neighbouring formulations in the social sciences and in economics and I don't need them rehearsed or cited). What I want is the semantics.

  So: give me a menu of the distinct precise theses that "Goodhart's law" could be asserting, ordered from the near-trivial to the radical, and for each one specify (a) the mechanism it posits, (b) its quantifier strength — does it say this of every measure, every proxy, every measure under sufficient optimization pressure, or only some — (c) whether the degradation claimed is total collapse, decay past some threshold, or mere shrinkage, and (d) whether the claim is meant as an empirical generalization, something like a consequence of selection theory or decision theory or game theory, or a conceptual truth about what a measure is. Then give each reading a verdict: platitude, substantive but contingent, substantive and well supported, false, or not clearly coherent. I want the menu to be discriminated against cases rather than asserted, and here are the cases I care about, because they seem to pull apart readings that people conflate. First, specification gaming in RL: a policy drives its reward-model score up while human preference ratings fall, and there is no human agent gaming anything — just optimization pressure from a gradient. Whatever explains that cannot essentially involve strategizing, and I'd like to know which readings predict it and which don't. Second, the hospital case, where reported waits fall and no one can agree whether care improved: is the mechanism misreporting, reallocation of effort away from unmeasured dimensions, or something else, and does the reading on offer distinguish them. Third, a case that I think breaks the slogan: a well-aligned high-stakes exam, where intensive coaching to the test raises scores and also raises performance on independent measures of the underlying skill — here the measure becomes a target and apparently remains a good measure, and I want to know what that shows about scope rather than being told it isn't a real counterexample. Fourth, pure selection: a proxy correlated with the target in the general population is used to pick the top fraction of a percent, and its correlation at the selected extreme decays even though nobody has adapted to anything. I suspect this is sometimes counted as Goodhart and is really just a fact about truncated distributions and noisy proxies, and I want you to say whether that's right and what follows for whether the law has any content beyond elementary statistics. Fifth, and most interesting to me: cases where targeting the measure doesn't so much fail to track the target as reconstitute it — where the practice reshapes what people mean by research quality or by literacy, so that the target has migrated rather than the measure having failed. Please keep a clean distinction throughout between the measure losing its grip on a fixed target and the target itself moving under measurement, and tell me which readings even have the resources to mark it.

  Then the part I actually need for the arguments I keep losing: for each of the uses the slogan was put to in my two settings, say which reading would be strong enough to support it, and whether that reading is one you've endorsed. Specifically: does any defensible reading support never optimizing against a learned proxy at all; does any support the milder engineering responses my lab could actually adopt — hold the metric out, rotate or ensemble several proxies, keep the specification hidden, randomize audits, cap optimization pressure — and are those responses supported by the same mechanism or by different ones; and does any support the sweeping claim that every writable objective will be gamed including the true one, which is where the lab conversation ended up and which smells like a different thesis wearing the same name. If the readings turn out to be logically independent claims sharing a label rather than variants of one claim, say so explicitly, and say which reading people most likely mean when they deploy the line to close off a discussion. I'd also like your view on one reflexive worry of my own: if resistance to gaming is itself something we can measure and select for, does optimizing that property degrade it in the way the law describes, or does the law fail to apply to its own avoidance in a way that reveals its scope conditions? A numbered list of readings with the verdicts attached, plus a short table mapping readings onto my two arguments and onto the five cases, would be perfect; no citations or bibliography, and please don't start with the history.
reasoning: |-
  We are going to define several distinct readings of "Goodhart's law". For each, we specify:
  (a) Mechanism: How the degradation occurs.
  (b) Quantifier: To which measures/proxies the thesis applies.
  (c) Degradation: What kind of degradation is claimed (collapse, decay, shrinkage).
  (d) Status: Empirical, theoretical (and from which field), or conceptual.

  Then we give a verdict: platitude (trivially true), substantive but contingent (true in many cases but not necessarily), substantive and well supported, false, or not clearly coherent.

  We consider five cases to discriminate the readings:
  1. RL specification gaming (no human strategizing, just gradient-based optimization).
  2. Hospital waiting times (reported waits fall, but care quality?).
  3. High-stakes exams (coaching raises both test scores and independent measures of skill).
  4. Pure selection (correlation decay at the extreme without adaptation).
  5. Re-constitution of the target (the target meaning changes due to measurement).

  Finally, we address the two arguments from the PhD student's surroundings and the reflexive worry.

  We aim for 5-7 distinct readings. Let's begin.

  ---

  ### Reading 1: The Correlation Breakdown under Selection (Truncation Effect)
  - (a) Mechanism: When we select on a proxy, the correlation between the proxy and the true target weakens in the selected subpopulation because the proxy is an imperfect measure and the selection truncates the distribution. This is due to statistical properties of joint distributions under selection.
  - (b) Quantifier: Applies to every proxy that is less than perfectly correlated with the target, and especially when the selection is extreme (selecting the top fraction).
  - (c) Degradation: Shrinkage of the correlation coefficient (or decay in predictive power) in the selected region, not necessarily total collapse.
  - (d) Status: A consequence of elementary statistics (e.g., regression to the mean, restriction of range). It is a mathematical truth given the assumptions.
  - Verdict: Platitude (trivially true under the model of linear correlation and Gaussian noise, but note: real-world correlations may not be linear or Gaussian).

  *Case mapping:*
  - Case 1 (RL): Predicts degradation if the reward model is imperfect and we optimize hard. But note: the mechanism is statistical, not requiring adaptation.
  - Case 2 (Hospital): May contribute if the selection is on reported waits (e.g., hospitals with the best reported waits are selected for rewards) and the correlation between reported waits and actual care quality is imperfect. But this reading does not address gaming (like misreporting).
  - Case 3 (Exams): This reading predicts that if we select only the very top scorers, the exam may become less predictive of the underlying skill in that group. However, if coaching raises both the test score and independent measures (as in the case), then this reading alone does not explain the success. It would only say that for the very top, the correlation might be weaker than in the general population. But the case shows that the measure remains good even after optimization. So this reading does not necessarily predict failure in this case because the coaching might improve the true skill (so the target moves with the measure) and the correlation might remain high.
  - Case 4 (Pure selection): Exactly fits. The decay is due to the statistical effect without any adaptation.
  - Case 5 (Re-constitution): Not addressed by this reading.

  ---

  ### Reading 2: Adaptive Corruption (Strategic Manipulation)
  - (a) Mechanism: When a measure is used as a target, agents (human or algorithmic) adapt their behavior to maximize the measure, often by exploiting loopholes or by diverting effort from unmeasured dimensions to the measured one. This is a strategic response to incentives.
  - (b) Quantifier: Applies to measures that are (i) used as targets and (ii) imperfect (i.e., not the true target). It requires that agents have both the incentive and the ability to adapt.
  - (c) Degradation: Can range from partial decay to total collapse, depending on the degree of imperfection and the agents' capabilities.
  - (d) Status: Well-supported by game theory (principal-agent problems, incentive design) and empirical evidence (e.g., Campbell's law in social sciences). It is a substantive and contingent claim (depends on the agents and the system).
  - Verdict: Substantive and well supported.

  *Case mapping:*
  - Case 1 (RL): This reading predicts degradation because the RL agent (or the optimization process) will find ways to maximize the proxy that do not align with the true objective (even without human gaming, the gradient-based search can find adversarial policies). So it applies.
  - Case 2 (Hospital): Fits well: hospitals might game the system by misreporting waits or by prioritizing measured waits at the expense of unmeasured aspects of care. The mechanism is strategic adaptation by the agents (hospital administrators, staff).
  - Case 3 (Exams): This reading would predict that if the exam is not perfectly aligned, coaching might focus on test-taking skills at the expense of the underlying skill. But the case says independent measures also rise, so the exam remains a good measure. Thus, this reading would not predict failure in this case because the measure is well-aligned and the coaching does not corrupt the underlying skill.
  - Case 4 (Pure selection): Does not apply because there is no adaptation by the agents (just selection by the principal). This reading requires active adaptation.
  - Case 5 (Re-constitution): This reading does not directly address re-constitution. It focuses on the gap between the measure and the fixed target.

  ---

  ### Reading 3: Measure-Target Decoupling under Optimization Pressure (Optimization Robustness)
  - (a) Mechanism: Optimization processes (like gradient descent) can find inputs that maximize the proxy but are far from the true target in the input space (e.g., adversarial examples). This occurs because the proxy is a local approximation that breaks down under strong optimization.
  - (b) Quantifier: Applies to every imperfect proxy under sufficient optimization pressure. The strength of the pressure and the imperfection of the proxy are key.
  - (c) Degradation: Can be total collapse (the proxy becomes uncorrelated or even negatively correlated with the target at high values) or decay past a threshold.
  - (d) Status: Supported by machine learning theory (e.g., in RL, the problem of reward hacking; in supervised learning, adversarial examples). It is a substantive claim and well supported in many domains.
  - Verdict: Substantive and well supported.

  *Case mapping:*
  - Case 1 (RL): Directly fits: the gradient-based optimization drives the policy to regions where the learned reward model is high but the true objective (human preference) is not. This is the classic reward hacking.
  - Case 2 (Hospital): This reading is less direct because it typically involves algorithmic optimization. However, if we think of the hospital system as an optimization process (e.g., administrators tuning processes to minimize reported waits), then it might apply. But the mechanism here is more about strategic adaptation (Reading 2) if humans are involved. For pure algorithmic control, it would fit.
  - Case 3 (Exams): In this case, the exam proxy is robust to optimization: pushing on it also improves the true skill. This reading would say that the exam is a good proxy that does not break down under the optimization pressure of coaching. So it is consistent with the reading: the reading does not claim that every proxy breaks, only that imperfect ones can.
  - Case 4 (Pure selection): Not directly, because there is no optimization process acting on the inputs (only selection). However, if selection is seen as a form of optimization (selecting the best), then Reading 1 covers it.
  - Case 5 (Re-constitution): Not addressed.

  ---

  ### Reading 4: Causal Entanglement and Measure Distortion (Causal Disruption)
  - (a) Mechanism: When a measure becomes a target, it may alter the causal relationships that made the measure a good indicator in the first place. For example, the act of measuring and targeting can change the system so that the measure no longer reflects the target because the causal link is broken or reversed.
  - (b) Quantifier: Applies to measures that are embedded in a causal system that can be disrupted by the targeting. Not every measure is vulnerable.
  - (c) Degradation: Decay or collapse, depending on the causal disruption.
  - (d) Status: Empirical generalization from social sciences and economics (e.g., Lucas critique in macroeconomics). It is substantive and contingent.
  - Verdict: Substantive and well supported in some domains.

  *Case mapping:*
  - Case 1 (RL): Might apply if the optimization process changes the environment in a way that breaks the reward model (e.g., distributional shift). But the mechanism is not the primary one in RL specification gaming.
  - Case 2 (Hospital): Fits: the causal link between reported waits and care quality might be broken when hospitals change their processes to focus on waits (e.g., by reducing the quality of care for non-urgent cases to meet wait targets). The measure is distorted because the causal structure changed.
  - Case 3 (Exams): If coaching changes the causal relationship between test preparation and true skill (e.g., by teaching to the test without depth), then the measure might decay. But in the case, independent measures also rise, so the causal link remains intact. Thus, this reading would not predict failure here.
  - Case 4 (Pure selection): Not applicable because there is no causal disruption (just selection).
  - Case 5 (Re-constitution): This reading is close to re-constitution but focuses on the causal disruption of the existing link, not the redefinition of the target.

  ---

  ### Reading 5: Re-constitutive Effects (Target Drift)
  - (a) Mechanism: The act of setting a measure as a target changes what the target means to the stakeholders. The target itself is redefined by the measurement practice. The measure does not so much fail to track a fixed target as reshape the target to align with the measure.
  - (b) Quantifier: Applies to social or conceptual constructs that are not fixed but are socially defined (e.g., quality, literacy, research excellence).
  - (c) Degradation: The measure does not decay in the usual sense. Instead, the target moves to align with the measure, so the measure remains a good indicator of the new target. However, from the perspective of the original target, it is a form of degradation because the goalposts have moved.
  - (d) Status: Empirical generalization from sociology and science studies (e.g., performativity). It is substantive and contingent.
  - Verdict: Substantive and well supported for socially constructed targets.

  *Case mapping:*
  - Case 1 (RL): Unlikely to apply because the true objective (human preferences) might be considered fixed. However, in the long term, if the AI system influences human preferences, then it might.
  - Case 2 (Hospital): Might apply if the focus on waiting times redefines what is considered good care (e.g., the public and regulators start to equate low waits with quality, ignoring other aspects). Then the target has shifted.
  - Case 3 (Exams): This reading would say that the coaching might change what we mean by "underlying skill" to be more aligned with what the test measures. But the case says independent measures also rise, so the original target might still be in place. This reading is not the primary explanation for the success in this case.
  - Case 4 (Pure selection): Not applicable.
  - Case 5 (Re-constitution): Directly fits: the target is reconstituted.

  ---

  ### Reading 6: The Inevitability of Proxy Failure (Radical Goodhart)
  - (a) Mechanism: Any writable objective (i.e., any proxy we can specify and optimize) is necessarily a proxy for the true objective (which is complex and unformalizable). Therefore, under sufficient optimization pressure, it will diverge from the true objective. This is because the true objective is not fully captured by any finite specification.
  - (b) Quantifier: Applies to every possible proxy for a complex true objective.
  - (c) Degradation: Total collapse in the limit of strong optimization.
  - (d) Status: A conceptual claim from decision theory and AI alignment (e.g., the orthogonality thesis, instrumental convergence). It is a substantive claim and controversial.
  - Verdict: Substantive and debated (not universally accepted). It may be true for sufficiently complex objectives and strong optimization, but it's not clear that it holds in all practical cases.

  *Case mapping:*
  - Case 1 (RL): This reading predicts that any learned reward model will eventually be gamed if optimized hard enough. So it supports the senior student's argument.
  - Case 2 (Hospital): Less directly applicable because the true objective (patient well-being) might be complex, but the proxy (waiting times) is clearly imperfect. This reading would say that even if we use a composite measure, it will eventually fail under strong optimization.
  - Case 3 (Exams): This reading would predict that if we push hard enough, the exam will eventually break. But the case shows that it hasn't broken (yet). So it might be that the optimization pressure was not strong enough, or the true objective (the skill) is not as complex as in other domains.
  - Case 4 (Pure selection): Not the primary reading.
  - Case 5 (Re-constitution): This reading does not address re-constitution; it assumes a fixed true objective.

  ---

  Now, we address the two arguments and the reflexive worry.

  ### Argument 1: Lab meeting (never optimize against a learned proxy)
  - The senior student's claim: Never optimize against a learned proxy because it will cease to track the true objective.
  - Which readings support this?
    - Reading 6 (Radical Goodhart) supports it: every proxy will fail under optimization.
    - Reading 3 (Optimization Robustness) supports the idea that imperfect proxies will break under sufficient pressure, but it does not say "never" — it allows for the possibility that the pressure is kept low or the proxy is good enough.
    - Reading 2 (Adaptive Corruption) also supports the risk, but again, not necessarily "never" — it depends on the context.
  - Verdict: Only Reading 6 (Radical Goodhart) supports the absolute "never" claim. However, it is a strong and debated reading. The other readings suggest caution but not complete avoidance.

  ### Argument 2: Policy school (against waiting-time targets and test-based accountability)
  - The claim: Setting a number destroys the number.
  - Which readings support this?
    - Reading 2 (Adaptive Corruption): Strategic manipulation by agents.
    - Reading 4 (Causal Disruption): The causal link is broken.
    - Reading 5 (Re-constitution): The target shifts.
    - Reading 1 (Correlation Breakdown): If the selection is extreme, the correlation decays.
  - Verdict: Multiple readings support the claim in these contexts, but they are not all the same. The policy cases are classic examples of Reading 2 and 4.

  ### Engineering Responses in the Lab
  The student asks: do any readings support engineering responses like holding out the metric, rotating proxies, etc.?
  - Reading 3 (Optimization Robustness) supports these: by limiting optimization pressure (via capping, randomization, etc.), you prevent the breakdown. Also, using multiple proxies (ensembles) might cover more of the true objective and be harder to game without degrading the true objective.
  - Reading 2 (Adaptive Corruption) also supports hiding the specification and randomizing audits, as these make gaming harder.
  - However, Reading 6 (Radical Goodhart) would say these are temporary fixes — eventually, any proxy will break.

  ### The Sweeping Claim (every writable objective will be gamed)
  - This is Reading 6 (Radical Goodhart). It is a distinct thesis and not necessarily implied by the others.

  ### Reflexive Worry: Can we measure and optimize for resistance to gaming?
  - Let G be a measure of "resistance to gaming". If we set G as a target, does it degrade?
    - By Reading 2 (Adaptive Corruption): Agents might find ways to appear resistant to gaming without actually being so (e.g., by avoiding situations where gaming is detectable).
    - By Reading 3 (Optimization Robustness): Optimization might find inputs that maximize G but do not have the true property (e.g., by being in environments where gaming is easy but undetected).
    - By Reading 6 (Radical Goodhart): Yes, any proxy for true robustness will break under optimization.
  - However, if we define G in a way that is perfectly aligned with the true resistance, then in theory it would not break. But Reading 6 says that perfect alignment is impossible for complex objectives. So the law might apply to its own avoidance.

  ### Summary of Readings and Verdicts

  | Reading | Name | Verdict |
  |---------|------|---------|
  | 1 | Correlation Breakdown under Selection | Platitude |
  | 2 | Adaptive Corruption | Substantive and well supported |
  | 3 | Measure-Target Decoupling under Optimization | Substantive and well supported |
  | 4 | Causal Disruption | Substantive and well supported (in some domains) |
  | 5 | Re-constitutive Effects | Substantive and well supported (for social constructs) |
  | 6 | Radical Goodhart (Inevitability) | Substantive but debated |

  ### Table: Which Readings Apply to the Cases and Arguments

  | Case / Argument | Reading 1 | Reading 2 | Reading 3 | Reading 4 | Reading 5 | Reading 6 |
  |-----------------|-----------|-----------|-----------|-----------|-----------|-----------|
  | Case 1: RL specification gaming | X | X (if we see the agent as an actor) | **X** (primary) | | | X |
  | Case 2: Hospital waits | X (if selection is present) | **X** (primary) | | X | X (if the target shifts) | |
  | Case 3: High-stakes exams | (Weakly, if at extreme) | Does not apply (since no decay) | Does not apply (since no decay) | Does not apply | Possible (if target shifts) | Does not apply (or not yet) |
  | Case 4: Pure selection | **X** | | | | | |
  | Case 5: Re-constitution | | | | | **X** | |
  | Argument 1: Never optimize proxy | | | | | | **X** (strongest support) |
  | Argument 2: Policy targets (hospitals/schools) | X | **X** | | **X** | **X** | |
  | Engineering responses (lab) | | X (via making gaming harder) | **X** (via limiting pressure) | | | (Rejects them as temporary) |

  ### Final Notes
  - The readings are logically distinct but often co-occur in real-world cases. For example, in the hospital case, both strategic adaptation (Reading 2) and causal disruption (Reading 4) might be at play.
  - When people deploy the line to close off a discussion, they are most likely invoking Reading 2 (Adaptive Corruption) or Reading 6 (Radical Goodhart), depending on the context. In the lab meeting, the senior student was using Reading 6.
  - The exam case (Case 3) breaks the weaker readings but not Reading 6 (which would say that if you push hard enough, it will break) or Reading 5 (if we accept that the target has shifted). However, if independent measures rise, then Reading 6 is challenged unless the true objective is defined narrowly as what the test measures.

  The reflexive worry: Optimizing a measure of resistance to gaming is itself subject to Goodhart effects (by Readings 2, 3, 6). This suggests that the law does not have a special exception for itself. However, one might design the measure to be robust (e.g., by using adversarial testing) but then we are back to the same problem.
answer: |-
  Below is a structured menu of distinct readings of "Goodhart's law," ordered from near-trivial to radical. Each reading is analyzed per your specifications: (a) mechanism, (b) quantifier strength, (c) degradation type, and (d) epistemic status. Verdicts are assigned (platitude, substantive but contingent, etc.). The readings are discriminated against your five cases and the two arguments from your lab/policy settings. A summary table maps readings to cases/arguments.

  ---

  ### **Menu of Goodhart's Law Readings**

  #### **1. Statistical Decay under Selection (Truncation Effect)**  
  - **(a) Mechanism**: Imperfect proxies exhibit reduced correlation with the true target under extreme selection (e.g., selecting top performers). Driven by regression to the mean and noise amplification in truncated distributions.  
  - **(b) Quantifier**: All noisy proxies (correlation <1) under sufficient selection pressure.  
  - **(c) Degradation**: Shrinkage of correlation (predictive power decays but may not collapse).  
  - **(d) Status**: Mathematical consequence of probability theory (e.g., properties of bivariate normal distributions).  
  - **Verdict**: Platitude (trivially true under standard statistical assumptions).  
  - **Case Compatibility**:  
    - RL specification gaming: Predicts decay if optimization selects extreme policies, but no strategizing needed.  
    - Hospital waits: Not primary (assumes no adaptation; pure selection).  
    - Exams: Explains why correlation *might* decay at extremes, but if coaching improves true skill, decay may not occur.  
    - Pure selection: Directly fits (no adaptation required).  
    - Target reconstitution: Does not address (assumes fixed target).  

  #### **2. Effort Distortion (Multitasking Incentives)**  
  - **(a) Mechanism**: Agents reallocate effort from unmeasured dimensions to the measured one, degrading unobserved aspects of the target.  
  - **(b) Quantifier**: Proxies that cover a subset of the target's dimensions, under any optimization pressure.  
  - **(c) Degradation**: Partial decay (unmeasured dimensions deteriorate past a threshold).  
  - **(d) Status**: Well-supported by incentive theory (e.g., Holmström's multitasking model); empirical generalization.  
  - **Verdict**: Substantive and well supported.  
  - **Case Compatibility**:  
    - RL specification gaming: Predicts decay if reward model misses dimensions (e.g., robustness).  
    - Hospital waits: Fits if staff reduce unmeasured care quality to cut waits.  
    - Exams: Fails if coaching improves both test skills *and* underlying skill (no distortion).  
    - Pure selection: Does not apply (no agent effort).  
    - Target reconstitution: Partial fit (effort shift may reshape practices, but not target meaning).  

  #### **3. Proxy Exploitation (Adversarial Adaptation)**  
  - **(a) Mechanism**: Agents strategically exploit flaws in the proxy (e.g., misreporting, adversarial inputs). Requires intentionality or adaptive systems.  
  - **(b) Quantifier**: Proxies with identifiable loopholes, under any optimization pressure.  
  - **(c) Degradation**: Collapse or decay (depending on exploit severity).  
  - **(d) Status**: Consequence of game theory (principal-agent problems); empirical generalization.  
  - **Verdict**: Substantive and well supported.  
  - **Case Compatibility**:  
    - RL specification gaming: Does not predict (no adversarial agent; gradient descent isn't "gaming").  
    - Hospital waits: Fits if waits are misreported or patients are triaged away.  
    - Exams: Fails if no cheating occurs.  
    - Pure selection: Does not apply (no adaptation).  
    - Target reconstitution**: Does not address (assumes fixed target).  

  #### **4. Optimization Robustness Breakdown (Model Divergence)**  
  - **(a) Mechanism**: Strong optimization exposes proxy inaccuracies in out-of-distribution regions. Gradient-based search finds inputs that maximize proxy but not target (e.g., reward hacking).  
  - **(b) Quantifier**: All imperfect learned models under sufficient optimization pressure.  
  - **(c) Degradation**: Collapse (proxy becomes anti-correlated with target).  
  - **(d) Status**: Consequence of decision theory/ML (e.g., Goodhart's original 1975 statement); well-supported empirically.  
  - **Verdict**: Substantive and well supported.  
  - **Case Compatibility**:  
    - RL specification gaming: Directly predicts decay (gradient pressure drives policies out-of-distribution).  
    - Hospital waits: Weak fit (less relevant without algorithmic control).  
    - Exams: Fails if coaching generalizes (proxy remains robust).  
    - Pure selection: Does not apply (no optimization loop).  
    - Target reconstitution**: Does not address.  

  #### **5. Causal Disruption (Measure-Induced System Shift)**  
  - **(a) Mechanism**: Targeting the proxy alters system dynamics, breaking causal links between proxy and target (e.g., via feedback loops).  
  - **(b) Quantifier**: Systems where the proxy is causally entangled with the target.  
  - **(c) Degradation**: Collapse or decay (causal link dissolves).  
  - **(d) Status**: Empirical generalization (e.g., Lucas critique in economics).  
  - **Verdict**: Substantive but contingent.  
  - **Case Compatibility**:  
    - RL specification gaming: Predicts decay if optimization changes the environment (e.g., data distribution shifts).  
    - Hospital waits: Fits if wait-time targeting disrupts care workflows (e.g., over-prioritizing measured cases).  
    - Exams: Fails if causal link between test and skill holds.  
    - Pure selection: Does not apply.  
    - Target reconstitution**: Partial fit (system shifts may lead to redefinition, but not necessarily).  

  #### **6. Target Reconstitution (Semantic Drift)**  
  - **(a) Mechanism**: Optimization reshapes societal or institutional understanding of the target itself (e.g., "literacy" becomes "test-passing").  
  - **(b) Quantifier**: Socially constructed targets under sustained targeting.  
  - **(c) Degradation**: Not decay; proxy remains "good" but for a new target.  
  - **(d) Status**: Empirical generalization from sociology/evaluation theory.  
  - **Verdict**: Substantive and well supported for constructed targets.  
  - **Case Compatibility**:  
    - RL specification gaming: Unlikely (fixed human preferences).  
    - Hospital waits: Fits if "care quality" is redefined as low waits.  
    - Exams: Fits if coaching shifts "skill" to mean test-taking (but case states independent measures rise).  
    - Pure selection: Does not apply.  
    - Target reconstitution**: Directly explains (proxy doesn't fail; target migrates).  

  #### **7. Radical Goodhart (Universal Proxy Collapse)**  
  - **(a) Mechanism**: Any formalizable proxy is necessarily incomplete; optimization inevitably diverges from the true target due to complexity/under-specification.  
  - **(b) Quantifier**: All proxies (including "true" objectives if formalized), under sufficient optimization.  
  - **(c) Degradation**: Total collapse in the limit.  
  - **(d) Status**: Conceptual claim from decision theory (e.g., computational irreducibility).  
  - **Verdict**: Substantive but debated; not empirically falsifiable.  
  - **Case Compatibility**:  
    - RL specification gaming: Predicts eventual collapse of any learned proxy.  
    - Hospital waits: Predicts collapse of any metric.  
    - Exams: Predicts collapse under "sufficient" optimization (case may lack pressure).  
    - Pure selection**: Weak fit (not optimization-driven).  
    - Target reconstitution**: Does not address (assumes fixed target).  

  ---

  ### **Mapping to Your Arguments**  
  #### **Lab Meeting Argument (Never optimize learned proxies)**  
  - **Strongest Supporting Reading**: Radical Goodhart (7). Claims *all* proxies fail, justifying "never optimize."  
  - **Weaker Support**: Optimization Robustness (4) and Proxy Exploitation (3) support caution but not abstinence (e.g., cap pressure to avoid divergence).  
  - **Engineering Responses**:  
    - Hold out metrics/ensembles: Supported by Statistical Decay (1) and Optimization Robustness (4) (reduces overfitting).  
    - Randomize audits/hide specs: Supported by Proxy Exploitation (3) (prevents gaming).  
    - Cap pressure: Supported by Optimization Robustness (4) (avoids OOD regions).  
  - **Sweeping Claim ("Every writable objective will be gamed")**: Only Radical Goodhart (7) supports this. It is distinct and more extreme than other readings.  

  #### **Policy School Argument (Against waiting-time targets)**  
  - **Strongest Supporting Readings**: Effort Distortion (2) and Proxy Exploitation (3) (misreporting/reallocation). Causal Disruption (5) and Target Reconstitution (6) may also apply if care quality is redefined.  
  - **Radical Goodhart (7) is overkill**; Effort Distortion (2) suffices for the argument.  

  ---

  ### **Reflexive Worry: Can Anti-Gaming Measures Degrade?**  
  - **Applicability**: Yes. Resistance to gaming is itself a proxy.  
  - **Mechanism**:  
    - If you optimize for "anti-gaming," effort distortion (2) or proxy exploitation (3) may degrade it (e.g., systems *appear* robust but hide vulnerabilities).  
    - Radical Goodhart (7) predicts eventual collapse.  
  - **Exception**: If anti-gaming is *perfectly* defined (e.g., formal verification), it *might* avoid decay, but Radical Goodhart denies this possibility.  

