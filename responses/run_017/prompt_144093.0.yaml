prompt: |-
  I write historical novels set in periods and among events whose shape most of my readers already know. The manuscript I am currently outlining concerns a real and well-documented mercantile expedition that failed, and anyone who opens the book will know within thirty pages that it failed. A review of my last novel complained, fairly I thought, that the book moved as though the catastrophe had been fated: every chapter laid another brick on a road that led to only one place, and the characters' decisions read as stage directions rather than as gambles. I do not think the remedy is to stop telling stories with known endings. I am not going to give up dramatic irony, and my readers do not want me to; the pleasure of the form is precisely that we watch people walk toward an outcome we can already see. What I want is to keep the outcome known while making the route to it feel like one that could have gone otherwise, and to do that without falsifying the record or manufacturing uncertainty nobody had.

  The difficulty is that I cannot see, from inside my own drafting, when I am doing the thing I am trying to avoid. I know how it ends; so does my reader; and the archive I work from is not neutral, since documents survive in part because they later mattered, and the people who wrote them were frequently explaining themselves after the fact. I have begun separating out three or four failure modes, and I would like a procedure that handles them, though I would rather you sharpen or replace my distinctions than simply adopt them. First, my own foreknowledge leaking into causation: treating something as a cause mainly because, given the outcome, it looks like one. Second, retrofitted motive: giving a character a reason that fits what they later did, and then experiencing that reason as though it explained the action rather than being inferred from it. Third, archival selection: promoting whatever survived in the record, and above all whatever was uncovered, litigated, or confessed afterwards, into the engine of the plot, when its prominence in the file may be an effect of the disaster rather than a cause of it. Fourth, a problem that belongs to the reader rather than to me: an explanation can be scrupulously fair and still land as inevitable, because the person reading it knows the ending and supplies the rest. A related worry is that when I try to restore contingency by dramatizing alternatives, I may be inventing options that were never in the air: logically available, but not ones anyone at the time proposed, feared, or could have acted on. I have been calling these dead alternatives, as opposed to live ones, and I want the procedure to draw that line and to say what would count as evidence that an alternative was live.

  So please turn what is actually known about hindsight bias and the narrative fallacy into a procedure I can run on a plotline before I draft it: the questions in order, what counts as a sufficient answer to each, where the answer is a stop or a rewrite, and where the question comes back to me because it is a judgment about the novel rather than a fact about the past. The constraints are these. I have roughly an afternoon per plotline. I work with a research assistant who reads the period hands and knows nothing of the theory, and a fact-checker who must sign off on anything the book asserts about the world; so most steps have to be executable by the assistant, and the procedure should say which steps cannot be delegated. It must not ask me to withhold the outcome or to feign ignorance I do not have, and it has to leave room for the reader's foreknowledge as a fixed condition rather than a defect to be engineered away. Then run it on three subplots from the current outline: a purser's embezzlement, recorded in the sources because it was discovered during the post-mortem into the failure, which I have been using as the main causal hinge and as my villain; a lieutenant's change of allegiance, for which the surviving letters give no reason at all and to which I have supplied a childhood grievance; and the loss of the expedition's fortified trading post, which on the military facts looks genuinely overdetermined, since the garrison was too small, the relief was not coming, and the siege works were competently built. At least one of the three should return a verdict I will not like, and I would rather have it from you than from my editor. I should also say that I have been toying with a device for restoring contingency from the reader's side: a scene dramatizing an outcome that did not occur, staged as a rumour running through the camp, a letter that argues for the other course, or a chapter from the perspective of someone who expected things to go differently. Tell me whether your procedure licenses that device, on what conditions, and where it degenerates into manufacturing a contingency the period did not contain. Finally, be plain about what the procedure cannot do: I would rather know now which of these questions it can only re-describe.
reasoning: |-
  Hmm, the user is a historical novelist facing a fascinating challenge. They're writing about a well-documented historical failure where readers already know the outcome, but they want to avoid making the path to that outcome feel inevitable. Their previous work was criticized for making the catastrophe seem fated, turning character decisions into mere plot devices rather than genuine gambles. 

  The user has identified four specific failure modes: hindsight bias in causation, retrofitted motives, archival selection bias, and the reader's inevitable foreknowledge. They want a practical procedure to check their plotlines against these pitfalls, with concrete constraints: limited time, a research assistant who handles primary sources but lacks theoretical background, and a fact-checker for historical accuracy. 

  I need to design a procedure that respects their constraints while addressing their core dilemma. The key is to separate historical contingency from narrative inevitability. The procedure should help identify when the narrative is imposing inevitability that didn't exist historically, while preserving the dramatic irony readers enjoy. 

  For the three test cases: 
  The purser's embezzlement is problematic because it's documented due to the failure's investigation - classic archival selection bias. The lieutenant's unexplained change of allegiance risks retrofitted motive with the childhood grievance. The trading post's fall may be genuinely overdetermined militarily, which requires careful handling to avoid narrative overdetermination. 

  The "dramatized alternatives" device shows promise if grounded in period-appropriate evidence of contemporaneous doubts or plans. But it risks dead alternatives if not supported by sources showing these were actual considerations at the time. 

  The procedure must acknowledge its limits: it can't eliminate reader foreknowledge, can't create historical contingency where none existed, and can't override genuine historical constraints. Some judgment calls will remain with the author about narrative weight and character interpretation. 

  I'll structure the procedure as a series of diagnostic questions with clear pass/fail criteria and delegation instructions. For each failure mode, I'll specify what evidence counts as sufficient to clear it, when it requires rewriting, and when it's an authorial judgment call. Then I'll apply it rigorously to the three test cases, making sure at least one returns an unfavorable verdict as requested.
answer: |-
  Here's a procedure derived from hindsight bias & narrative fallacy research, designed for your constraints. It targets your four failure modes with specific, actionable questions, delegation instructions, and clear thresholds for revision.

  **The Contingency Audit Procedure**

  **Phase 1: Pre-Draft Setup (Author Only - 30 mins)**
  1.  **Define the Known Outcome:** State the historical endpoint for this plotline (e.g., "Purser is convicted of embezzlement post-failure").
  2.  **List Key Plot Beats:** Outline the 5-8 key events/scenes driving this subplot toward the outcome.
  3.  **Identify Critical Decisions:** Pinpoint 2-3 major choices characters make within the plotline that *seem* to directly contribute to the outcome.
  4.  **Flag Archival Anchors:** List the primary source documents/evidence underpinning *each* plot beat and decision (e.g., "Purser's confession (Doc A), Ledger discrepancies noted in Investigator's Report (Doc B)").
  5.  **State Your Narrative Hinge:** Briefly articulate *why* you think this plotline is crucial to the overall failure (e.g., "Embezzlement drained funds, forcing risky shortcuts").

  **Phase 2: Contingency Interrogation (Assistant Executes, Author Reviews - 60 mins per plotline)**
  *(Assistant uses research notes/sources linked to Archival Anchors)*

  | Question (Targeted Failure Mode)                                                                                                 | Assistant's Task / Sufficient Answer                                                                                     | Threshold for Revision / Author Review                                                                                                | Delegation    |
  | :------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ | :------------ |
  | **Q1: (Causation Leak)** For each key plot beat/decision, list ALL contemporaneous factors the sources show were *actually present* as influences *at the time*, **ignoring the outcome.** | Compile list from sources dated BEFORE the outcome was known. Include practical constraints, known risks, stated goals, rival pressures, info available *then*. | **STOP/REWRITE:** If a factor appears ONLY in post-failure sources (confessions, inquiries, memoirs) AND lacks pre-failure evidence. **REVIEW:** If pre-failure evidence is ambiguous or sparse. | Assistant     |
  | **Q2: (Retrofitted Motive)** For each critical character decision, list ALL motives/reasons EXPLICITLY stated in sources *contemporaneous* with the decision. List motives INFERRED later (post-failure). | Strict separation: *What did they write/say THEN?* vs. *What did they/others claim AFTER?* Note silences (no reason given). | **STOP/REWRITE:** If the *primary* motive in the draft relies SOLELY on post-hoc inference or your invention *without* contemporaneous support/plausibility. **REVIEW:** If motives are mixed/ambiguous in sources. | Assistant     |
  | **Q3: (Archival Selection)** For the key Archival Anchors: Why did this document survive? Was its creation/visibility *directly caused by* the failure (e.g., trial record, inquiry exhibit)? | Determine provenance: Was it a routine record (ledger, log, personal letter) or a *product* of the investigation/failure? | **STOP/REWRITE:** If a document's plot significance RELIES on it being a *cause* AND it is demonstrably an *effect* of the failure/its investigation. **REVIEW:** If it *could* be both (e.g., a damaging letter written before failure but only uncovered after). | Assistant     |
  | **Q4: (Live Alternatives)** For each critical decision point, list ALL alternative courses of action that were: a) LOGICALLY possible, b) Explicitly DISCUSSED/PLANNED/FEARED *by characters* BEFORE the decision (per sources). | Identify documented debates, rejected plans, expressed worries, or standard operating procedures offering different options. Note *who* considered them. | **REVIEW:** Crucial judgment. Evidence an alternative was "Live": Mentioned in pre-decision comms (letters, logs, meeting minutes), part of standard practice, argued for by a faction. "Dead": Pure logical construct with zero period evidence anyone considered it. | Assistant (Gather evidence) / **Author (Final Judgment)** |

  **Phase 3: Author Synthesis & Decision (Author Only - 30 mins)**
  1.  **Review Assistant's Findings:** Cross-reference Q1-Q4 data against your outline.
  2.  **Contingency Assessment:** Based on Q4 (Live Alternatives) and Q1 (Contemporary Factors):
      *   Did characters have *at least one documented, live alternative* at key junctures?
      *   Were multiple *contemporaneous* factors/pressures genuinely at play (Q1), preventing single-cause narratives?
  3.  **Narrative Hinge Check:** Does your plot hinge (Phase 1, Step 5) survive Q3 (Archival Selection)? If the hinge *is* an archival effect (like the purser's discovery), how can you depict its *role* without making it the sole *cause*?
  4.  **Motive Integrity Check:** For any invented motives (Q2), is there sufficient *contemporaneous* context (Q1 - pressures, constraints, info) to make them plausible and feel like a *gamble* the character made with imperfect knowledge, rather than a fateful step?
  5.  **Decision:** Does the path feel contingent based on the *period's* realities? If not, revise using the live alternatives and contemporaneous factors identified. If genuinely overdetermined (like the trading post), focus on the *experience* of uncertainty despite structural constraints.

  **Applying the Procedure to Your Subplots**

  1.  **The Purser's Embezzlement (Villain/Hinge):**
      *   **Q1 (Causation Leak):** Assistant finds pre-failure evidence: vague ledger irregularities noted internally *before* expedition failure? Routine audits missed it? Or *only* post-mortem findings?
      *   **Q2 (Retrofitted Motive):** What (if anything) does the purser say *in real time* (letters, logs)? Post-confession motives are suspect.
      *   **Q3 (Archival Selection):** **STOP/REWRITE VERDICT.** The embezzlement records *are* an effect of the failure (discovered in post-mortem). Making it *the* main hinge commits Archival Selection fallacy. **Revision:** Keep it *as a discovered element*, show its *actual* scale (did it *really* doom things?), depict the *process* of discovery adding chaos, but introduce OTHER significant, *pre-failure* financial/personnel pressures (Q1) as co-contributors. Demote from sole villain to a symptom/compounding factor.
  2.  **Lieutenant's Change of Allegiance:**
      *   **Q1 (Causation Leak):** Assistant gathers all known pre-defection pressures: battlefield events, rivalries, orders received, personal circumstances *mentioned at the time*.
      *   **Q2 (Retrofitted Motive):** **STOP/REWRITE VERDICT.** The childhood grievance is pure retrofitting (no contemporaneous evidence). **Revision:** Rely SOLELY on contemporaneous factors found in Q1. If sources are silent, *embrace the mystery*. Show the ambiguity, the shock, the competing theories *among characters* at the time. Make the decision feel sudden, puzzling, and driven by immediate, inscrutable pressures – a genuine gamble whose *personal* rationale is lost, not explained by backstory.
  3.  **Loss of the Trading Post:**
      *   **Q1 (Causation Leak):** Assistant lists *all* pre-siege factors: garrison size logs, relief request denials/acknowledgments, known enemy movements, supply status, morale reports, defensive assessments *made beforehand*.
      *   **Q4 (Live Alternatives):** **REVIEW/JUDGMENT.** What *did* the commander consider? Surrender? Breakout? Holding? Were alternatives debated? Request relief *again*? **Author's Call:** Militarily overdetermined *doesn't* mean narratively inevitable. If Q4 finds *any* live alternatives considered (e.g., a debated breakout attempt), focus the drama there. If none, focus on the *characters' experience*: their dwindling hope, their assessment of grim options, the moment they *realize* it's hopeless despite earlier calculations. Avoid "bricks in a road"; show the weight of collapsing possibilities.

  **On Dramatized Alternatives (Rumors/Letters/Chapters)**

  *   **Licensed:** **YES, if grounded in Q4 (Live Alternatives).**
      *   *Conditions:* The dramatized alternative must be directly evidenced as a *live option considered at the time* (debated plan, feared outcome, argued proposal). The source perspective (rumor-monger, letter writer, optimist) must be plausible within the historical context and their known position/information.
  *   **Degenerates:** When it presents "Dead Alternatives" (logical but never considered) or injects modern hindsight/knowledge. A letter arguing for an anachronistic strategy or relying on information no one could have possessed is manufactured contingency.
  *   **Use:** Excellent for showing contemporaneous *uncertainty* and *debate*, making the *actual* outcome feel less predestined *to the characters*. It leverages dramatic irony (reader knows they're wrong/right) without falsifying history.

  **What the Procedure Cannot Do**

  1.  **Eliminate Reader Foreknowledge:** The outcome *is* known. This procedure ensures the *journey* respects historical contingency, but the destination remains fixed. The "inevitability" it fights is authorial/narrative, not readerly.
  2.  **Create Contingency Where None Existed:** If the historical situation *was* genuinely overdetermined with no live alternatives (like the trading post *might* be), the procedure will reveal this. It can't invent plausible paths not grounded in evidence. Your task then shifts to portraying the *experience* of constrained choice.
  3.  **Override Genuine Historical Causation:** If the preponderance of *contemporaneous* evidence points strongly to one factor (Q1), downplaying it for narrative surprise would be falsification. The procedure ensures balance, not revisionism.
  4.  **Make Judgments About Narrative Weight/Pacing:** It flags *what* needs scrutiny, not *how* to fix it artistically. Turning the purser from villain into a compounding factor is a structural narrative choice beyond the audit.
  5.  **Prove Motives:** It can identify retrofitting and demand contemporaneous plausibility, but internal states are often elusive. You must make informed, source-plausible interpretations (Phase 3, Step 4).

  **Conclusion**
  This procedure forces a systematic disconnect between the *known outcome* and the *contemporaneous drivers* of the plot. By delegating the factual spadework (Q1-Q3 evidence gathering, Q4 evidence collection) to your assistant, you reserve your limited time for the critical judgments (Q4 Live/Dead, Phase 3 Synthesis). It protects against the most insidious hindsight biases by anchoring causation, motive, and archival significance firmly in the pre-outcome moment. It validates using dramatized alternatives *if* historically grounded. Crucially, it accepts reader foreknowledge and dramatic irony as essential elements of the genre, focusing solely on ensuring the path walked feels like one the characters *could* have diverged from based on the world as they knew it. Run it ruthlessly on your hinges – the purser verdict shows its teeth. Good luck.
