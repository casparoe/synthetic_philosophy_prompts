prompt: |-
  A guy on my team did a philosophy degree before he swithced to writing Rust, and he summed up an old blog post about the Frege–Geach problem for me like this:

  "Moral sentences don't describe anything, they just vent attitudes — 'stealing is wrong' is basically 'boo to stealing!', which is why moral claims can't be true or false and why two people can disagree about one forever without either of them being mistaken. The Frege–Geach problem finished this off: the same sentence shows up inside 'if stealing is wrong, then getting your little brother to steal is wrong', where nothing is being claimed and nobody is booing anything, so the theory has nothing to say about what the words even mean there. And by the same token it can't explain why it's valid to go from that conditional plus 'stealing is wrong' to the conclusion — validity needs the sentence to mean the same thing in both places, and attitudes aren't the kind of thing that can figure in a valid argument. The view was dead by the 1990s: everyone who thought hard about it became a realist, and the only people still working on it are a few specialists who like hard problems."

  I have zero philosophy background. The boo bit sounds like a strawman to me and the "everyone became a realist" part sounds like he's making it up, but I cant say where it goes wrong. How fair is this? Go through it more or less sentence by sentence — what an actual defender of the view would accept, what's a simplification, what's just wrong. Also, his example only used a plain if-then with the moral sentence in the "if" part: would the problem get harder if the sentence were negated, or sitting inside a question? And does his conclusion that the view is dead actually follow from the parts that are right?

  Lead with your bottom line in the first sentence, then the reasoning — no preamble, no restating my question, and no reading list, I'm not going to go read anything.
reasoning: |-
  Okay, the user is asking about the Frege-Geach problem as explained by their teammate. They have no philosophy background and think parts of the explanation might be a strawman or incorrect. Let me break this down step by step.

  First, the teammate's summary: moral sentences express attitudes ("boo to stealing"), so they aren't true/false. Frege-Gech shows that when such sentences appear in conditionals (like "if stealing is wrong..."), expressivism struggles because there's no expression of attitude happening there. The conclusion was that expressivism is dead and everyone became realists.

  I need to assess the accuracy part by part. Starting with the "boo" part. The "boo" analogy comes from Ayer's emotivism, which is a form of expressivism. So that's not a strawman—it's a simplified but accurate representation. However, modern expressivism (like Blackburn's quasi-realism) is more sophisticated. They'd say moral judgments express attitudes but aim to explain truth and logic without realism.

  Next, the claim that moral claims can't be true or false. Classic expressivism does deny truth-aptness, but quasi-realism tries to accommodate moral truth in a non-realist way. So the teammate's statement is true for early expressivism but oversimplifies modern versions.

  The Frege-Geach problem itself: the issue is that in conditionals, moral sentences don't express attitudes, yet they contribute to logical validity. The teammate's example is correct. The problem extends to negations, questions, etc. For example, "Is stealing wrong?" doesn't express an attitude but queries it. Expressivists need to explain how the meaning remains consistent across contexts. Blackburn uses minimalism about truth and propositional attitudes to handle this, but it's contentious.

  Now, the claim that everyone became realists. That's an overstatement. While expressivism faced challenges, it evolved rather than died. Quasi-realism is still a major position. Many philosophers work on refining it, not just a few specialists. The resurgence of expressivism post-1990s shows it's not dead.

  The user might be seeking clarity on whether their teammate is oversimplifying or misrepresenting. They likely want a balanced view to understand the philosophical debate without prior knowledge. They might also be interested in whether expressivism has any merit despite the Frege-Geach problem.

  So, the bottom line: the teammate's summary is partially correct but oversimplified and outdated. Expressivism evolved, and while Frege-Geach is a serious challenge, it didn't kill the view. Realism isn't the only option.
answer: |-
  **Bottom line:** Your teammate's summary is a mostly accurate but oversimplified caricature of *early* expressivism (emotivism); it significantly misrepresents the contemporary state of play by ignoring how sophisticated expressivist theories (quasi-realism) respond to the Frege-Geach problem, and the claim that "everyone became a realist" is flatly wrong.

  **Breakdown:**

  1.  **"Moral sentences don't describe anything, they just vent attitudes"**: **Largely correct for early expressivism (emotivism).** Defenders like A.J. Ayer did argue moral judgments express emotions/attitudes (approval/disapproval) rather than describing objective facts. "Vent" might be slightly strong, but the core idea is right.
  2.  **"'stealing is wrong' is basically 'boo to stealing!'"**: **Simplification, not a strawman.** This "boo/hurrah" model is the famous analogy Ayer used for emotivism. It *is* crude, but it's a genuine historical position meant to illustrate the non-descriptive function.
  3.  **"...which is why moral claims can't be true or false..."**: **Correct consequence for early expressivism.** If they only express attitudes, they aren't statements of fact that can be true or false.
  4.  **"...and why two people can disagree about one forever without either of them being mistaken."**: **Correct for early expressivism.** If it's just clashing attitudes ("Boo!" vs. "Hurrah!"), there's no objective fact of the matter to be mistaken *about* in the descriptive sense.
  5.  **"The Frege–Geach problem finished this off..."**: **Overstated but captures the core challenge.** The problem *devastated* simple emotivism. It showed expressivism couldn't easily explain the meaning and logical role of moral sentences in complex, non-assertive contexts like conditionals, questions, or negations.
  6.  **"...the same sentence shows up inside 'if stealing is wrong, then getting your little brother to steal is wrong', where nothing is being claimed and nobody is booing anything..."**: **Exactly right.** This is the heart of the problem. Uttering the conditional doesn't express disapproval of stealing itself, yet the sentence "stealing is wrong" clearly contributes meaningfully to the conditional's logic.
  7.  **"...so the theory has nothing to say about what the words even mean there."**: **Hyperbole, but highlights the core issue.** Early expressivism *did* struggle massively to explain the meaning in such contexts. A defender would argue they *can* say something, but the challenge is explaining how the meaning relates to the attitude-expressing meaning in simple assertions.
  8.  **"And by the same token it can't explain why it's valid to go from that conditional plus 'stealing is wrong' to the conclusion..."**: **Correct.** Logic relies on sentences meaning the same thing and having truth-evaluable content in premises and conclusions. Emotivism couldn't account for how an attitude-expression ("boo!") in one premise combines with a conditional containing that same phrase *not* expressing an attitude to validly entail another attitude-expression.
  9.  **"...validity needs the sentence to mean the same thing in both places, and attitudes aren't the kind of thing that can figure in a valid argument."**: **Spot on.** This is the expressivist's core logical dilemma posed by Frege-Geach.
  10. **"The view was dead by the 1990s..."**: **False.** While simple emotivism was largely abandoned, sophisticated expressivism (specifically Simon Blackburn's *quasi-realism*) emerged *in response* to Frege-Geach, starting in the 1980s and flourishing thereafter. Quasi-realism aims to explain how moral discourse *mimics* realist truth and logic *without* positing objective moral facts.
  11. **"...everyone who thought hard about it became a realist..."**: **Completely false.** Many leading metaethicists (Blackburn, Gibbard, Schroeder) are non-realist expressivists/quasi-realists who have thought *extremely* hard about Frege-Geach and developed complex theories precisely to solve it. Realism is dominant but far from universal.
  12. **"...the only people still working on it are a few specialists who like hard problems."**: **Misleading.** Solving Frege-Geach is *the* central project of modern expressivism/quasi-realism. It's a major, active research program in metaethics pursued by numerous prominent philosophers, not just a niche interest.

  **On Negations and Questions:**
  *   **Negation:** ("Stealing is *not* wrong") is even harder for early expressivism. What attitude does *that* express? Booing booing? It drastically compounds the problem of explaining meaning in non-assertive contexts and logical relations (like contradictions).
  *   **Questions:** ("Is stealing wrong?") is similarly problematic. The question isn't expressing an attitude, but it clearly involves the *same* moral concept. Early expressivism struggled to explain what the question means or how it relates to potential answers.
  *   **Harder?** Yes, absolutely. Conditionals, negations, questions, belief reports ("Alex believes stealing is wrong") – any context where the moral sentence isn't being directly asserted/used to express an attitude – present the *same* core problem: explaining the consistency of meaning and logical function across contexts. Expressivist solutions must handle *all* these embeddings.

  **Conclusion on the View's Death:**
  No, the conclusion **does not follow**. While the Frege-Geach problem decisively refuted *simple* emotivism ("boo/hurrah"), it acted as a catalyst for the development of far more sophisticated expressivist theories (quasi-realism). These theories directly engage with the problem, attempting to explain logical validity and the meaning of embedded sentences without abandoning the core expressivist idea that morality is rooted in attitudes. The debate between sophisticated expressivism and moral realism is very much alive. To claim expressivism is "dead" ignores the last 40+ years of metaethical work. Your teammate's summary ends the story in the 1960s.
