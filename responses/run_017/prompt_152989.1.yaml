prompt: |-
  I have recently been appointed to the board of the mutual insurance association that insures my own farm and most of my neighbours' holdings, as the member responsible for signing the statement on actuarial assumptions in our quarterly reserving filing. I am not a statistician by training — my formal background is an engineering degree with one graduate course in Bayesian methods — and the file comes back to me about four times a year, with roughly a week to work on it, an external reviewer who will not accept a prior whose justification is that it came with the software, and a set of assumptions that ends up minuted and binding on the premiums our members pay, including my own.

  The item now on my desk is the choice of priors for the parameters we have no useful data on. My predecessor's filing described these priors as non-informative, by which he appears to have meant that he placed a uniform distribution on whatever quantity the software happened to parameterise. Our reviewer's note says this is a concealed assumption rather than an absence of one, and I have been reading about the principle of indifference and Bertrand's chord problem in order to understand the objection. My provisional reading, which I set out so that you can tell me whether I have it right, is this: that the three classical answers to the chord problem show the principle of indifference to be simply inconsistent, since one and the same state of ignorance yields a probability of one third, one half, or one quarter depending on which construction one uses; and that the only workable remedy is therefore to fix one convention — always impose indifference on the parameter as presented, or always impose it on the logarithm of a positive parameter — and then apply it uniformly across every filing, so that at least our numbers are reproducible and consistent from quarter to quarter.

  What I need from you is a procedure I can actually run, not a discussion. Specifically:

  A sequence of steps, to be applied to each unknown parameter in turn, with a statement at each step of what would count as a sufficient answer and what would count as a failure. It must be runnable by me, in a spreadsheet, in the time I have.

  At each step, an explicit indication of where the procedure stops with a no — where the honest output is that no defensible ignorance prior exists for this parameter — and where it hands the decision back to a person because the remaining question is one of judgement rather than calculation. Please mark these hand-off points plainly rather than papering over them.

  A worked application to three parameters from our file: the standard deviation of claim sizes, which is positive and whose order of magnitude we genuinely do not know; the proportion of claims that settle without any payment, bounded between zero and one and otherwise unknown to us; and the shape parameter governing how heavy the upper tail of the claim-size distribution is, which is the quantity our reinsurance pricing most depends on and the one we have the least data about. I expect at least one of these to come back with an answer I will not like, and I would rather have that stated directly than have it softened.

  Some further requirements that I think matter, but which you should overrule if you think they are misguided:

  A reparameterisation stress test. For each parameter, I want to be able to write the sentence "we know nothing about this quantity" in three or four equivalent-sounding forms — about the quantity itself, about its square, about its logarithm, about its reciprocal — and see whether the resulting priors agree. Where they disagree, I take it my claim of ignorance was incomplete, and I want the procedure to say what I must then supply.

  An account of which distinctions have to survive the simplification and which can be dropped. I cannot carry the full theory into a board minute, but I also cannot afford to carry a version of it that is false. Tell me which is which.

  A rule for when the choice stops mattering. Some of these parameters will be pinned down by next year's data and some will not. I need to know how to tell the difference, and what I owe the reviewer in each case — whether a sensitivity analysis is an acceptable substitute for a principled choice, and in what regime it is not.

  Finally, a short closing section stating plainly what the procedure cannot do, and a note on the reading I described above: if my diagnosis of the chord problem, or my proposed remedy of fixing a single convention, is wrong, I would rather be corrected at the outset than have the procedure built on top of it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on the board of a mutual insurance association, responsible for signing off on actuarial assumptions. Their background is in engineering with some Bayesian training, but they're not a statistician. They need a practical procedure to choose priors for parameters with no data, and they’ve encountered issues with non-informative priors and Bertrand's paradox.

  First, I need to address their understanding of Bertrand's chord problem. They think the paradox shows inconsistency in the principle of indifference, and their solution is to fix a single parameterization convention. But I should correct that. The real issue isn't just inconsistency; it's that ignorance priors don't exist because every parameterization implies different information. They need to recognize that "knowing nothing" isn't possible—some structure is always assumed. So the procedure must enforce explicit choices rather than defaulting to a uniform prior.

  Next, the user wants a step-by-step process for three parameters: standard deviation of claim sizes (σ), proportion of zero-payment claims (p), and tail shape parameter (k). Each has different challenges. For σ, which is positive, a log-scale prior might be appropriate. For p, a Beta(1,1) could work, but they need to justify why uniformity on p is valid. For k, which affects reinsurance pricing, they might need to consult experts since there's no clear ignorance prior.

  The user emphasized a reparameterization stress test. This is crucial. For each parameter, trying different transformations (like square, log, reciprocal) should reveal if the prior is consistent. If not, they must acknowledge that their "ignorance" claim isn't sufficient and they need more information. For example, for σ, uniform on log(σ) is invariant under scaling, while uniform on σ isn't.

  They also need to know when the choice stops mattering. If the parameter is well-identified by data soon, the prior might not matter much. But for tail parameters like k, which have scarce data, the prior choice is critical. Sensitivity analysis here isn't enough; they need a justified prior, possibly from expert judgment.

  The user mentioned time constraints—about a week per filing. So the procedure must be spreadsheet-friendly, avoiding complex computations. Using conjugate priors where possible (like Beta for proportions) helps. For σ, a Gamma prior on precision might be manageable.

  Hand-off points must be clear. When the reparameterization test fails or when there's no clear invariance, they need to consult experts. For k, this is likely necessary. The procedure should explicitly state where human judgment is required.

  Finally, the closing section should clarify limitations. The procedure can't create true ignorance priors but forces transparent choices. It won't work for parameters with no natural group structure, and expert input is essential for critical, data-poor parameters like k.

  I should structure the steps to first identify the parameter's nature (positive, bounded, etc.), then apply the invariance principle or transformation group, run the stress test, and decide based on consistency. Where inconsistencies arise, flag for human judgment. For each of their three parameters, walk through the steps with clear outcomes, showing where p might be straightforward but σ and k problematic.

  Also, emphasize that fixed conventions (like always using log for positives) are practical but must be justified as reasonable defaults, not true non-informative priors. The reviewer's concern is valid—defaults in software aren't sufficient. Each choice needs a rationale tied to the parameter's context.

  In summary, the procedure should be methodical, transparent about its assumptions, and honest about limitations. It should empower the user to make defensible choices under time constraints while highlighting when expert input is non-negotiable.
answer: |-
  Below is a procedure designed for your practical needs, addressing the core challenges of prior selection under ignorance, Bertrand's paradox, and your specific requirements. It prioritizes defensibility, reproducibility, and clarity over theoretical perfection. Your diagnosis of the chord problem is correct: **the principle of indifference is fundamentally inconsistent under reparameterization, and no "true" ignorance prior exists.** Your proposed remedy of fixing a single convention *is necessary for consistency* but insufficient alone; it must be augmented with invariance principles and explicit hand-offs. The procedure forces you to confront where "ignorance" claims fail.

  ---

  ### **Procedure for Selecting "Ignorance" Priors**
  **Goal:** Assign a prior distribution to a parameter θ where "we know nothing" is claimed.  
  **Input:** Parameter θ, its domain (e.g., θ > 0, 0 < θ < 1), and its role in the model.  
  **Output:** A prior PDF π(θ) OR a flag for "No Defensible Ignorance Prior" OR a hand-off to expert judgment.  
  **Tools:** Spreadsheet (for transformations, PDF calculations).  
  **Time per Parameter:** < 1 hour (after setup).

  #### **Step 1: Classify the Parameter Domain**
  *   **Question:** What is the natural domain of θ?
  *   **Sufficient Answer:**
      *   `Bounded` (e.g., 0 < θ < 1, a < θ < b)
      *   `Positive` (θ > 0)
      *   `Real` (-∞ < θ < ∞)
      *   `Other` (Specify, e.g., integer, circular)
  *   **Failure:** Ambiguous domain (e.g., "θ is large").
  *   **Hand-off:** If domain is undefined or "Other" without clear structure.

  #### **Step 2: Apply Invariance Principle (Reparameterization Stress Test)**
  *   **Question:** What transformation group is natural for θ?  
      *Test claim: "We know nothing about θ, φ(θ), or ψ(θ)" for equivalent φ, ψ.*
  *   **Actions:**
      1.  Choose 3-4 "equivalent-sounding" reparameterizations relevant to θ's domain:
          *   *Bounded:* θ, log(θ/(1-θ)) (logit), arcsin(√θ)
          *   *Positive:* θ, log(θ), √θ, 1/θ
          *   *Real:* θ, e^θ, θ^3
      2.  Assume uniformity on each candidate scale: π_φ(φ) = Constant.
      3.  Transform each uniform π_φ(φ) back to the θ-scale to get π_θ(θ|φ).
      4.  Calculate π_θ(θ|φ) explicitly in your spreadsheet.
  *   **Sufficient Answer:** All π_θ(θ|φ) are **identical** (e.g., θ positive → π(θ) ∝ 1/θ for φ=θ, φ=logθ, φ=1/θ).
  *   **Failure:** π_θ(θ|φ) differ significantly (e.g., for θ positive: Uniform on θ gives π(θ)=1, Uniform on logθ gives π(θ)∝1/θ).
  *   **Hand-off:** If transformations yield **inconsistent priors** (common!). This means your claim "we know nothing" is invalid for θ. You must now specify *what you actually know* (e.g., "We lack knowledge of θ's order of magnitude" → use log scale).

  #### **Step 3: Assign Default Prior Based on Domain & Invariance**
  *   **Question:** Does Step 2 yield a unique invariant prior? If not, what default convention applies?
  *   **Rules:**
      *   `Bounded (a<θ<b)`: If logit or arcsin√θ agree, use **Uniform**: π(θ) = 1/(b-a).  
          *Else:* **Hand-off** (rare for simple bounds).
      *   `Positive (θ>0)`: **Jeffreys Prior (Scale Invariant)**: π(θ) ∝ 1/θ.  
          *Justification:* Invariant under scaling (θ → kθ). Matches uniform on log(θ).  
          *Convention:* This *is* your fixed convention for positive parameters. State it in filings.
      *   `Real (-∞<θ<∞)`: **Uniform**: π(θ) = Constant.  
          *Justification:* Location invariance (θ → θ+c). Matches uniform on θ.  
          *Caveat:* Improper; ensure posterior integrability.
      *   `Other`: **Hand-off**.
  *   **Sufficient Answer:** Prior PDF defined with justification (e.g., "Jeffreys prior for scale parameter θ > 0: π(θ) ∝ 1/θ").
  *   **Failure:** No invariant prior AND no agreed convention.
  *   **Hand-off:** If domain is "Other" or no group invariance applies (e.g., variance parameter where mean is also unknown – requires joint prior).

  #### **Step 4: Assess Impact & Stopping Conditions**
  *   **Question:** How critical is the prior choice, and will data resolve it?
  *   **Actions:**
      1.  **Is θ well-identified?** Simulate fake data similar to expected volume. Does posterior concentrate robustly *regardless* of reasonable priors (e.g., Uniform vs Jeffreys)? Use spreadsheet Monte Carlo if possible.
      2.  **Is θ tail-critical?** Does it dominate extreme quantiles/reinsurance costs? (If yes → High Sensitivity).
  *   **Rules:**
      *   **Choice stops mattering if:** θ is well-identified by next year's data **AND** not tail-critical.  
          *Output:* Proceed with Step 3 prior. Sensitivity analysis (e.g., ±20% in key outputs) *is sufficient* for filing.
      *   **Choice matters critically if:** θ is poorly identified **OR** tail-critical.  
          *Output:* **Hand-off to expert judgment.** Sensitivity analysis is **not sufficient**. You must justify the prior using external information (e.g., industry studies, expert ELT).
  *   **Sufficient Answer:** Clear statement: "Prior choice is robust" or "Expert judgment required".
  *   **Failure:** Assuming robustness without testing.

  ---

  ### **Worked Examples**
  **Context:** All parameters have "no useful data"; claim "we know nothing".

  1.  **Standard Deviation of Claim Sizes (σ > 0)**
      *   *Step 1:* Positive (σ > 0).
      *   *Step 2 (Stress Test):*
          *   Uniform on σ: π(σ) ∝ 1
          *   Uniform on log(σ): π(σ) ∝ 1/σ
          *   Uniform on 1/σ: π(σ) ∝ 1/σ²
          *   Uniform on √σ: π(σ) ∝ 1/√σ
          *   **Result:** **INCONSISTENT** (Different PDFs). Claim "know nothing" fails.
      *   *Step 3:* Apply convention: **Jeffreys Prior π(σ) ∝ 1/σ** (Scale invariance).
      *   *Step 4:* σ is likely moderately identified with claims data, but impacts reserves broadly. Likely **robust enough** with sensitivity analysis (±15% reserve impact test). *Output:* Use π(σ) ∝ 1/σ.

  2.  **Proportion of $0 Claims (0 < p < 1)**
      *   *Step 1:* Bounded (0 < p < 1).
      *   *Step 2 (Stress Test):*
          *   Uniform on p: π(p) ∝ 1
          *   Uniform on logit(p) = log(p/(1-p)): π(p) ∝ 1/[p(1-p)]
          *   Uniform on arcsin(√p): π(p) ∝ 1/√[p(1-p)]
          *   **Result:** **INCONSISTENT**. Claim "know nothing" fails.
      *   *Step 3:* Default convention for bounded probabilities is **Uniform π(p) = 1** (Beta(1,1)). *Justification:* Common starting point; invariance under relabeling (0 vs paid claim) only holds if uniform.
      *   *Step 4:* p is usually well-identified quickly with claim count data. Not typically tail-critical. **Choice stops mattering.** *Output:* Use π(p) ∝ 1 with sensitivity analysis.

  3.  **Tail Shape Parameter (k > 0, e.g., Pareto, Weibull)**
      *   *Step 1:* Positive (k > 0).
      *   *Step 2 (Stress Test):* Identical to σ (π(k)∝1, 1/k, 1/k², 1/√k → **INCONSISTENT**). Claim fails.
      *   *Step 3:* Apply convention: **Jeffreys Prior π(k) ∝ 1/k**.
      *   *Step 4:* **CRITICAL.** k is poorly identified (few tail events), massively impacts reinsurance premiums (your key concern!), and Jeffreys prior (π(k)∝1/k) often implies heavier tails than uniform (π(k)∝1).  
          **→ HAND-OFF TO EXPERT JUDGMENT.** *Output:* "No defensible ignorance prior. Prior must be based on industry exposure curves, reinsurer benchmarking, or engineering studies of maximum foreseeable loss. Sensitivity analysis inadequate." *(This is the answer you won't like but need.)*

  ---

  ### **Distinctions for Board Minutes (What to Keep/Drop)**
  *   **MUST KEEP & STATE EXPLICITLY:**
      *   "No single non-informative prior exists; choice implies structure."
      *   "For positive parameters (σ, k), we use the scale-invariant (Jeffreys) prior π(θ) ∝ 1/θ as our fixed convention."
      *   "For bounded proportions (p), we use the uniform prior π(p) = 1."
      *   "For tail parameter k, expert judgment was used due to critical impact and lack of data. Prior based on [Source]."
      *   "Sensitivity analysis conducted for σ and p; robust. Prior for k is material to premiums."
  *   **CAN DROP:**
      *   Bertrand's paradox details.
      *   Derivations of Jeffreys prior.
      *   Full reparameterization test results (state it was done and led to conventions/hand-offs).

  ---

  ### **When Does the Choice Stop Mattering?**
  *   **Rule:** If posterior standard deviation (from simulated data) << prior standard deviation **AND** parameter is not tail-critical → Prior choice immaterial. Sensitivity analysis suffices.
  *   **Otherwise:** Prior is material. For non-tail-critical parameters, document sensitivity bounds. For **tail-critical or weakly identified parameters (k)**, expert judgment is mandatory; sensitivity analysis is insufficient justification. Tell the reviewer: "For k, we provide expert justification, not sensitivity plots."

  ---

  ### **What the Procedure Cannot Do**
  1.  **Create true ignorance priors.** All priors convey information. This procedure forces *acknowledged* structure.
  2.  **Replace expert judgment for critical parameters.** Parameters like k *require* domain knowledge.
  3.  **Handle complex dependencies.** Assumes parameters are *a priori* independent unless specified.
  4.  **Guarantee optimal premiums.** Defends prior choice under scrutiny; does not optimize business outcomes.
  5.  **Work for parameters without transformation groups.** "Other" domains often need bespoke solutions.

  ---

  ### **Correction on Your Reading**
  Your diagnosis of Bertrand's paradox is **correct:** Indifference is inconsistent under reparameterization. Your remedy (fixing a convention) is **necessary but incomplete.** Jeffreys' insight was that invariance under specific transformations (scaling, location) resolves some paradoxes and provides conventions. This procedure integrates:
  1.  **Fixed Conventions:** (Uniform for bounded, Jeffreys π(θ)∝1/θ for positive) for consistency.
  2.  **Stress Testing:** To expose where "ignorance" claims are invalid.
  3.  **Hand-offs:** Where conventions fail or judgment is critical (k).

  **You were right to reject "prior from software."** This procedure gives you a defensible, auditable process meeting your constraints. For the tail parameter k, start consulting reinsurers or actuaries now – that hand-off is unavoidable.
