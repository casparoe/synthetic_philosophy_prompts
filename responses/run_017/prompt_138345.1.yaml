answer: |-
  Here’s a targeted Q&A prep sheet, ordered by likely objections and tailored to your audience. I’ve focused on phrasing, concessions, soft spots, and contested readings.

  ---

  ### **Q&A Prep Sheet: GWT, Overflow, and the Bottleneck Argument**
  **Core Thesis:** GWT explains access consciousness (availability for report/control) but fails as a theory of *phenomenal* consciousness due to its bottleneck. Overflow survives sparseness via richness/determinacy separation. Hypothetical Sperling data forces a choice: experience is either (1) limited to broadcast or (2) mostly unbroadcast.

  ---

  ### **Objection 1 (GWT Proponent #1: Neuro Lead)**  
  *"GWT doesn’t claim to explain phenomenal consciousness! It’s a theory of cognitive access — ignition *is* the NCC for reportability. You’re attacking a straw man."*  
  **Your 2-Minute Reply:**  
  "Absolutely, GWT’s core mechanism is access. But in practice, GWT is often presented as a *full* NCC theory (e.g., Dehaene’s ‘consciousness=global information sharing’). My point is: if GWT is offered as explaining *why* there’s something it’s like (e.g., in popular texts or grant proposals), it collapses. The bottleneck shows it *can’t* scale to phenomenal richness. I concede GWT never *formally* claims this, but its rhetoric often implies it."  
  **Concede in Talk:** Open with: "GWT is the best theory of access we have. My argument targets *extensions* of it to phenomenal consciousness."  
  **Soft Spot:** GWT proponents can retreat to "access-only" — but this concedes your main point.  
  **Contested Reading:** Whether GWT *implicitly* claims to explain phenomenality. Cite Dehaene/Changeux’s broader claims ("conscious access *is* subjectivity") vs. narrower papers. Consensus: GWT is uncontested on access.

  ---

  ### **Objection 2 (GWT Proponent #2: EEG Specialist)**  
  *"Sparseness! The workspace doesn’t need ‘pixels’ — it broadcasts a compressed, gist-based representation. Rich visual phenomenology *is* the gist broadcast at ignition (P3b). Your bottleneck ignores efficient coding."*  
  **Your 2-Minute Reply:**  
  "Sparseness solves *report* limitations but not *phenomenal* ones. In my hypothetical Sperling: subjects report seeing *all letters* vividly, not just a gist. If ignition only broadcasts the cued row’s gist, but early vision holds decodable detail for all rows, then either: (1) phenomenology is only the gist (contra subject reports), or (2) vivid detail exists but isn’t broadcast. GWT can’t explain (2)."  
  **Concede in Talk:** Acknowledge sparseness as a strength for cognitive economics.  
  **Soft Spot:** If they argue "gist = phenomenology," you need richness/determinacy distinction (next objection).  
  **Contested Reading:** Whether "gist" matches phenomenal richness. Consensus: Sparseness optimizes access; contested whether it exhausts phenomenality.

  ---

  ### **Objection 3 (Philosopher of Mind: Illusionist)**  
  *"The access/phenomenal distinction is empirically empty. ‘Phenomenal overflow’ is a verbal trick — all we have is report and its failures. Your ‘richness’ is just post-perceptual confabulation."*  
  **Your 2-Minute Reply:**  
  "I’m making an empirical case: subjects *insist* they saw all letters; early sensory areas *retain* unaccessed detail; ignition is *limited*. If illusionism says subjects are wrong about their own experience, it must explain why they’re systematically mistaken *and* why sensory systems retain unaccessed data. The distinction isn’t metaphysical — it’s a mismatch between neural persistence and access bottlenecks."  
  **Concede in Talk:** "I’m bracketing metaphysics — this is about explaining neural/behavioral dissociations."  
  **Soft Spot:** If they demand *proof* of phenomenology beyond report.  
  **Contested Reading:** Whether overflow is a valid inference. Consensus: Sperling-style paradigms show iconic memory exceeds report; contested whether this reflects phenomenology.

  ---

  ### **Objection 4 (Recurrent Processing Ally)**  
  *"Why stop here? GWT’s bottleneck is fatal, but your argument needs recurrent processing theory (RPT)! Overflow is evidence for local recurrent loops — why avoid endorsing RPT as the fix?"*  
  **Your 2-Minute Reply:**  
  "RPT is promising! But my goal is narrower: show GWT *alone* can’t explain phenomenality, even with sparseness. Endorsing RPT would derail us into V1 vs. prefrontal NCC debates. The bottleneck argument is a minimal dagger to GWT’s phenomenal aspirations, regardless of the alternative."  
  **Concede in Talk:** Mention RPT as a candidate for phenomenal machinery.  
  **Soft Spot:** Avoiding alternatives may seem evasive.  
  **Contested Reading:** None — you’re agreeing on GWT’s limitation.

  ---

  ### **Objection 5 (GWT Proponent #3: Prefrontal Focus)**  
  *"Frontoparietal ignition *is* the richness! Prefrontal cortex (PFC) integrates features into a rich scene. Your ‘early visual’ decoding is just proto-object noise — not conscious content."*  
  **Your 2-Minute Reply:**  
  "If PFC ignition integrates a *compressed* scene (e.g., ‘a grid of letters’), but subjects report seeing *specific* uncued letters (e.g., ‘a jagged S in row 2’), then either: (1) PFC holds more detail than we think (contra sparseness), or (2) detail exists outside PFC. fMRI shows PFC capacity is tiny — it can’t hold 12 letters. The bottleneck forces this choice."  
  **Concede in Talk:** Agree PFC integrates accessible content.  
  **Soft Spot:** If PFC can hold rich data via dynamic coding.  
  **Contested Reading:** Whether PFC representations are sparse/symbolic. Consensus: PFC has limited capacity; contested how "rich" its codes are.

  ---

  ### **Objection 6 (IIT Advocate)**  
  *"This is why we need IIT! GWT and overflow both miss the point: consciousness is about causal structure, not access. Your ‘phenomenal richness’ is just an information state — without Φ, it’s not experience."*  
  **Your 2-Minute Reply:**  
  "IIT may be right! But my claim is conditional: *if* there is overflow (per reports/neural data), GWT can’t explain it. I’m not offering a positive theory — just showing GWT fails. IIT avoids the bottleneck but has its own challenges (e.g., computational intractability)."  
  **Concede in Talk:** "IIT addresses hard problems GWT avoids."  
  **Soft Spot:** Not engaging IIT’s framework.  
  **Contested Reading:** None — you’re not attacking IIT.

  ---

  ### **Objection 7 (Sparseness Revisited + Hypothetical Data)**  
  *"Your hypothetical data is speculative. Real Sperling shows cue-dependent P3b only for targets. If early areas ‘decode’ uncued rows, it’s just dormant data — not conscious content. And ‘richness without determinacy’ is incoherent: vague blobs aren’t rich!"*  
  **Your 2-Minute Reply:**  
  "First, the hypothetical is based on Lamme’s work showing recurrent loops in V1-V4 during iconic memory. Second: *determinacy* (precision) is separate from *richness* (number of elements). A grid of 12 *vague* letters is richer than one sharp row but less determinate. Subjects report richness ("I saw all letters") — not determinacy ("each was clear"). GWT can’t explain why they report richness if only one row is accessed."  
  **Concede in Talk:** Admit the data is not yet published.  
  **Soft Spot:** If "vague letters" are argued to be a gist.  
  **Contested Reading:** Whether iconic memory is "phenomenal." Consensus: It exists; contested if it’s conscious.

  ---

  ### **The Objection You Hope Nobody Raises (But Prep For)**  
  *"If unbroadcast content is phenomenally conscious, why can’t we *report* it? What’s the function of consciousness without access? This makes consciousness epiphenomenal!"*  
  **Your 2-Minute Reply:**  
  "Overflow isn’t claiming *all* phenomenality is epiphenomenal — just that *some* rich content isn’t accessed. This content may still be functional: guiding attention, priming, or rapid reaccess (e.g., in change blindness). GWT requires *all* consciousness to be accessed, but the data suggests otherwise."  
  **Concede in Talk:** Note that the *function* of overflow is debated.  
  **Soft Spot:** Risk of implying "zombie data" is conscious.  
  **Contested Reading:** Whether unaccessed content can be causal. Consensus: None — deeply contested.

  ---

  ### **Strategic Summary**
  - **Start by Conceding:** GWT excels at explaining access, ignition, and reportability.  
  - **Flag Contested Points:**  
    - "Some GWT interpretations extend to phenomenality."  
    - "Sperling-style overflow *may* reflect phenomenal richness."  
    - "Richness (numerosity) ≠ determinacy (precision)."  
  - **Use "Bottleneck Choice" Slide:** Force the dilemma: GWT must either *limit* phenomenology to broadcast or admit it’s *not identical* to broadcasting.  
  - **Neutralize Illusionist:** Focus on empirical dissociations, not metaphysics.  
  - **Hand Recurrent Ally:** "Let’s discuss RPT after — today is about GWT’s limits."  

  **Timekeeper Note:** Rehearse timing for the bottleneck argument + hypothetical (8 mins max). Leave 5 mins for Q&A prep in your 20. Good luck!
