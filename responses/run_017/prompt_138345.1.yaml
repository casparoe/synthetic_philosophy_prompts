  For each objection, I should provide a concise two-minute response, what to concede upfront, and where the argument might be soft. Also, note contested readings versus consensus. For example, conceding that GWT focuses on access consciousness but arguing that proponents often imply it covers phenomenology. Or acknowledging that the hypothetical data is speculative but based on plausible neuroscience.

