  Okay, let me start by unpacking the user's query. They're describing a pattern where practical skills degrade over transmission, specifically losing nuances that only show up under rare conditions. The user mentions three examples: bread-making, fishing rules, and boat splicing. Each case shows how the deeper, less visible parts of the practice get dropped when passed through limited channels like written instructions or short courses. 

  First, I need to figure out if this phenomenon is already covered in cultural evolution or Darwinian literature. The user wants to know if there's an existing concept or if a new one is needed. They specifically don't want just a name; they want the concept carved out precisely. Also, they mentioned no library access, so I should avoid citing sources and focus on explaining the mechanisms.

  Looking at the user's rejection of obvious answers: it's not just about transmissibility selection, not drift, not technological loss in small populations. They also distinguish it from safety engineering shortcuts and language evolution. So, I need to dive into why certain elements are lost systematically. The key points are the loss of conditional clauses, slow steps, and the feedback that would reveal their importance.

  The user’s deeper need seems to be understanding why this degradation happens predictably and why it persists. They might be looking for a framework to analyze similar patterns in their field, possibly to prevent such losses or to design better transmission methods. They’re likely a practitioner or researcher in a field where tacit knowledge is crucial, like traditional crafts, safety protocols, or education.

  I recall concepts like the "ratchet effect" in cultural evolution, but that’s about accumulation, not loss. There's also "erosion" in skill transmission, but it's not formalized. The user’s cases involve systematic loss due to channel constraints. The closest might be "attrition of tacit knowledge" combined with "frequency-dependent selection," but that’s a composite. 

  Another angle: the thinning channel acts as a selective bottleneck. Elements that aren't immediately verifiable or have delayed feedback get dropped. The surviving version becomes the new standard because it’s easier to transmit and confidence builds erroneously. This relates to "illusions of explanatory depth," where people overestimate their understanding. 

  The competition here is between "cognitive prototype pull" (practices simplified to match mental schemas) and "channel squeeze" (removal due to transmission constraints). Observing whether lost elements are those harder to demonstrate or those that don’t fit a mental category could distinguish them. In the bread example, the warm rise is easier to demonstrate than the long cold rest, suggesting channel squeeze. 

  Boundary cases: if the practice is purely expressive (like a dance), losing steps might not matter functionally, so it’s still the same phenomenon. If an expert restores it but it drops again, that reinforces the channel’s role. If thickening the channel doesn’t reverse the loss, it might indicate that the new variant has stabilized due to changed feedback loops, like the fishing rule becoming entrenched after failure attribution.

  Misdescription would be if the loss isn’t systematic or if the channel isn’t the main driver. For example, if the long bread rest was dropped due to ingredient scarcity, not transmission. Or if the failure feedback was always visible but ignored due to other factors like time pressure.

  Overall, the user needs a precise mechanism explanation. The core is the selective loss of low-salience, high-latency elements under constrained transmission, leading to irreversible degradation due to severed feedback. Naming it "channel-driven trait erosion" or "attrition of latent function" could work, but defining the mechanism is more important than the name.
answer: |-
  This phenomenon is both recognized and undertheorized in cultural evolution. While no single established term fully captures its architecture, the closest existing concept is **Attrition of Tacit Knowledge under Channel Constraints**, often discussed peripherally in work on skill transmission and cultural degradation. However, your description reveals a specific *mechanism-driven pattern* that merits sharper carving. Below is a dissection of its anatomy, boundaries, and competing explanations.

  ### Core Mechanism: The Latency-Visibility Mismatch
  - **What it is**: A systematic selection *against* elements of a practice with **high functional latency** (delayed or rare payoff visibility) and **low perceptual salience** during execution/transmission, when transmitted through channels that **attenuate feedback** or **truncate apprenticeship**. The loss is self-reinforcing because:
    1. The degraded variant becomes the new phenotypic standard ("looks identical").
    2. Failures attributable to the loss are misclassified (e.g., as "bad luck").
    3. The variant’s teachability increases (shorter training, clearer rules).
    4. Comparative assessment against the intact variant becomes impossible.
  - **What it is not**:
    - *Not drift*: Directionality is predictable (loss correlates with latency/salience).
    - *Not general selection for transmissibility*: Transmissibility gain is secondary to *which specific traits* are lost (those with poor feedback coupling).
    - *Not "lost complexity"*: Complexity may remain high in *visible* aspects (e.g., the rope splice's form); it’s specifically **latent-function complexity** that decays.

  ### Competing Explanations & Discriminating Observations
  Two frameworks could explain the *direction* of loss:
  1. **Channel Squeeze Hypothesis**:  
     Traits are lost if they exceed the channel’s **bandwidth** (time, sensory fidelity, cognitive load).  
     *Prediction*: Loss correlates with transmission cost (e.g., steps requiring weeks to demonstrate).  
     *Your cases fit*: Cold ferment (time-costly), conditional clause (cognitively costly), slow splice steps (training-costly).

  2. **Cognitive Prototype Pull Hypothesis**:  
     Traits are lost if they deviate from learners' **schema** of the practice (e.g., "bread rising = warm").  
     *Prediction*: Loss correlates with atypicality (e.g., "birds *not* indicating fish" violates expectations).  

  **Critical Test**:  
  - If a *low-cost, high-latency* trait (e.g., whispering a phrase during bread-making—quick to teach, no immediate effect) is lost, **channel squeeze** dominates.  
  - If a *high-cost, low-latency* trait (e.g., a physically arduous but instantly verifiable step) is retained despite cost, **prototype pull** dominates.  
  Your cases favor **channel squeeze**: The lost traits weren’t counter-prototypical (cold ferment is known; conditionals are logical) but *costly to transmit* relative to their perceived value.

  ### Boundaries & Edge Cases
  - **Purely expressive practices (e.g., ritual dance)**:  
    If a step’s loss doesn’t alter perceived efficacy, it’s *not the same*. The mechanism requires **functional loss masked by attenuated feedback**. No functional deficit? Different phenomenon.
    
  - **Expert restoration followed by re-loss**:  
    *Still counts*. The mechanism is defined by **transmission-channel selection pressure**, not origin. If re-transmission through a thin channel causes identical attrition, it confirms the channel’s causal role.

  - **Thickened channel fails to reverse loss**:  
    *Still counts, but reveals hysteresis*. The degraded variant may now be **stabilized by evolved dependencies** (e.g., fishing schedules adapted to the simplified rule) or **erased feedback loops** (no one remembers *why* comparisons mattered). Irreversibility implies the variant has adapted to its own degraded ecology.

  ### Why Existing Frameworks Fall Short
  - **Cultural Attrition**: Describes loss but not the *self-concealing, self-reinforcing* dynamic.
  - **Tacit Knowledge Erosion**: Focuses on individual skill decay, not population-level selection.
  - **Selection for Learnability**: Explains *why* simpler variants spread, but not the *systematic bias* against latent functions.
  - **Ratcheting (Cumulative Culture)**: Your cases show *anti-ratcheting*—decay despite potential stability.

  ### A Proposed Term: **Channel-Driven Trait Erosion (CDTE)**
  **Definition**: *The selective loss of high-latency, low-salience functional components from a culturally transmitted practice when transmitted through bandwidth-limited channels, resulting in stabilized degradation due to severed feedback loops and misattribution of failure.*  

  ### Signs of Misdescription
  You would misdescribe CDTE if:
  1. Loss occurs without channel thinning (e.g., abandonment due to resource scarcity).
  2. The degraded variant *reduces* transmissibility (here, it enhances it).
  3. Feedback attenuation isn’t causal (e.g., failures are correctly diagnosed but ignored).
  4. Lost traits had immediate, obvious payoffs (violates latency requirement).

  This pattern thrives where practice efficacy is judged by **proximate outputs** (a risen loaf, a tight splice) rather than **distal robustness** (flavor, load-bearing integrity). Its persistence is a memorial to the unobserved.
