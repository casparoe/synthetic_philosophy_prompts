  Hmm, the user is in a decision-theory reading group discussing the dollar auction paradox. They've encountered two conflicting explanations: one framing it as sunk cost fallacy and the other as rational incomplete-information strategy. They want me to adjudicate with a definite verdict, addressing three specific points about agency in bidding, comparison to organizational escalation, and auctioneer intentions.

  Let me break this down. The sunk cost view argues people irrationally chase losses, while the incomplete-information model suggests bidding can be payoff-maximizing if you believe the opponent will fold soon. Both have merit - incomplete information explains early bidding rationally, but can't justify bids exceeding the dollar value where losses are guaranteed. The psychological sunk cost element seems to kick in precisely at that crossover point.

  For their three specific queries: First, their agency-test experiment where subjects inherit bids. I'd predict reduced but not eliminated escalation, showing sunk cost isn't purely financial but involves ownership of decisions. "I started this" isn't rational but feels motivationally real. Second, while organizational escalation resembles this, it's more complex with reputation and institutional inertia - the dollar auction is a purer trap. Third, a charity auctioneer doesn't resolve the trap; the opponent still exists as an adversary fighting for the same dollar.

  The core verdict should be that the models partition the phenomenon: incomplete information rationally explains entry and early bidding, but psychological commitment explains pathological overbidding. Neither alone suffices. The key pivot is when bids cross the dollar threshold - that's where rationality definitively fails. I'll structure the essay to first establish this partition, then address their three points within that framework, ending with a clear conditional verdict about where each explanation dominates.
answer: |-
  ## The Dollar Auction Dissected: Rational Traps and Psychological Commitments

  The tension in your reading group captures the dollar auction's deceptive duality: both accounts illuminate different phases of the phenomenon, but neither alone explains its full, pathological trajectory. The incomplete-information model provides the rational *entry ramp* into the trap, while the sunk cost fallacy fuels the irrational *descent* beyond it. The explanatory work bifurcates at the critical point where cumulative bids exceed a dollar.

  The "war of attrition" perspective correctly identifies the initial rational logic. Entering at a low bid (say, one cent) *is* potentially profitable if you reasonably believe your opponent values winning slightly less or will fold quickly. Once engaged, especially after becoming the "losing" bidder facing a small incremental cost to potentially win the dollar *and* avoid losing your sunk bid, continuing *can* be expected-value positive *if* your estimate of the opponent's resolve remains plausible. This explains the puzzle of initial bids and early escalation – it's a high-risk, high-reward gamble under uncertainty, not inherent irrationality.

  However, this model collapses when bids surpass the dollar value. At this point, *both* bidders are guaranteed a net loss if they win, and the only "rational" hope is that the *other* player irrationally values winning even more highly. This is where the sunk cost fallacy, wearing its game-theoretic costume, takes center stage. Players aren't maximizing expected payoff based on sane beliefs about the opponent; they are desperately trying to "justify" or "recoup" irretrievable losses, focusing on the *relative* loss avoidance ("I can't lose my 95 cents for nothing!") rather than the *absolute* outcome. The backward induction argument highlights this: foreseeing the inevitable mutual loss beyond $1.00, no rational player *should* initiate the bid. The fact people do, and escalate past the dollar, reveals a failure of foresight or self-control, exploited by the auction's structure.

  Your diagnostic experiments are crucial here. If subjects inherit bids (randomly assigned or via a delegate), escalation should *attenuate* but likely not vanish completely. Reduced escalation would indict the pure responsibility/"I started this" narrative, showing sunk costs *can* exert influence without direct agency. However, persistence of *some* escalation suggests sunk costs aren't purely financial; the *position* of being the trailing bidder, even if you didn't choose the initial bid, creates a psychological commitment to avoid the salient, certain loss. "I should finish it" isn't a *defensible* reason in the cold light of consequentialist rationality; it's a powerful *motivational* state arising from loss aversion, cognitive dissonance reduction, and the desire to avoid feeling like a "sucker" who paid for nothing. It feels real *as* a driver, not *as* a justification.

  Regarding organizational escalation: the mechanisms are kin but distinct. The dollar auction is a *purified*, symmetric trap where the *only* forces are the auction rules and dyadic competition. Organizational escalation involves layered complexities: reputational stakes, group dynamics, confirmation bias, escalating commitment to justify past decisions *to others*, and often diffuse responsibility. The sunk cost fallacy is a common psychological engine, but the organizational context adds fuel and structure the simple auction lacks. They are cousins, not twins.

  Finally, a charitable auctioneer changes little. While the money isn't going to a "predatory" entity, the fundamental conflict remains: bidders are still locked in a duel *against each other* for a fixed prize ($1). The charity benefits from their mutually destructive competition, but the bidders' incentives to avoid being the "loser" who pays without winning, and to potentially "win" the dollar (now benefiting the charity, but still a win for them), persist. The trap is structural, not dependent on the auctioneer's malice.

  **Verdict:** The incomplete-information model rationally explains entry and escalation *up to* the point where combined bids reach the prize value. Beyond this threshold, sunk costs and psychological commitment definitively drive the irrational, mutually destructive overbidding. The dollar auction is a rational trap *initiated* by uncertainty, but *sustained* past rationality's breaking point by the fallacy of chasing sunk costs. Escalation beyond a dollar is where game theory's costume slips, revealing the psychological engine beneath.
