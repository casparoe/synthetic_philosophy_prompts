prompt: |-
  Hey — I need help turning a half-baked idea into an actual proposal document. Context: I'm a 4th-year philosophy PhD student (history/philosophy of science-ish) but I've somehow ended up embedded in a data-viz / public-health informatics group on campus, mostly because I got roped into helping them think about how to present uncertainty to non-specialists. I'm applying for a nine-month internal fellowship from our humanities institute — they want two pages, no citations, I'll fill the bibliography in myself — and here's roughly what I want to do.

  The half-formed thought: Neurath's picture-language project — the ISOTYPE / Vienna Method stuff he ran out of the Social and Economic Museum in Vienna in the late 20s and 30s, with Gerd Arntz cutting the pictograms and Marie Reidemeister doing the "transformation" of source data into charts — gets read two ways, and I think both are wrong. Reading one: a charming footnote to the unified-science program, propaganda for adult education, not epistemology. Reading two: quietly absorbed into the modern graphical-integrity literature, where the question about any given chart is whether it faithfully encodes the numbers and whether audiences misread error bars, log scales, and so on. But Neurath's own commitments point somewhere else. He's the boat guy — no protocol sentences, no bedrock, we rebuild the ship plank by plank while at sea — and he also thought pictures did something sentences can't: you learn the code by convention, and then the comparisons are just *there* in front of you in a way that discursive language doesn't manage. Which means the natural standard for a picture language on his own view can't be correspondence to the facts (no such relation is available to him), but it also can't be straight consequentialism about which charts produce true beliefs (that has nothing specifically to do with pictures). So my candidate criterion, which is the bit I'm least sure about: a picture language is better when it lets a community disagree about content without having to disagree about the code. Score it on the boat axis — when new evidence arrives, can you revise what's depicted by editing *within* the language, or does the revision force you to abandon the language or to argue about what the convention means? Call it revision-readiness if you want. A corrollary I sort of like: this makes how long it takes to learn the code an epistemic virtue rather than a usability metric, and nothing in the existing framing captures that. I want to run it on three cases: COVID-era projection fan charts, the hurricane "cone of uncertainty," and the IPCC's spaghetti plots / burning-embers style diagrams.

  The tension I also want the proposal to own rather than hide: Neurath's own practice was built on "transformation," i.e. an editor deciding what to drop, what to round off, which categories are fixed — which is about as theory-laden and non-neutral as it gets, and it's not obvious his anti-foundationalism has the resources to say why one transformation beats another, or whether he's quietly leaning on a notion of the facts that his holism officially forbids. If that's right, my criterion either collapses back into correspondence-tracking or it's aesthetics with extra steps, and I need the proposal to say how I'd tell the difference. My advisor thinks the picture stuff is a footnote to the protocol-sentence debate; my other committee member thinks the graphical-integrity people basically settled this in the 80s and 90s. I think both are wrong but I definatly can't say why yet in two pages.

  Can you write the thing? Sections, in this order, roughly these lengths: "The question, stated tightly" (~150 words) — give me one sentence I could quote to a committee, then unpack it; "Why the two obvious framings leave it open" (~300 words) — be honest if one of them actually can generate my criterion and I should just be doing that instead; "Method — months 1 through 9" (~350 words) — what I'd actually do, how the three case studies earn their place, and what would count as the criterion doing real explanatory work rather than redescribing my intuitions; "Possible results and what would decide between them" (~250 words), including the collapse-into-correspondence outcome; "Failure modes and scope" (~200 words) — what would make this trivial, what would make it too big for nine months, and what I'd cut first. If the question as I've stated it can't have a determinate answer, say so and restate it — but restate it, don't just complain. American English, and keep it in a proposal register, not an essay register: I'm asking for a plan for work I haven't done.
reasoning: |-
  Okay, let's tackle this. The user is a philosophy PhD student working on a fellowship proposal about Neurath's picture-language project. They want to challenge two common interpretations and introduce their own criterion of "revision-readiness." 

  First, I need to understand their core argument. They believe Neurath's work isn't just about propaganda or graphical integrity but about enabling communities to disagree without disputing the visual language itself. The key insight is that the value lies in how easily a visual system can incorporate new evidence without breaking its own conventions. 

  The user's tension point is crucial: Neurath's "transformation" process seems theory-laden, potentially conflicting with his anti-foundationalism. The proposal must address whether their criterion avoids collapsing into correspondence or mere aesthetics. 

  Looking at the structure they requested: 
  The question section needs a sharp, quotable thesis. Maybe something like: "How does Neurath's picture language facilitate communal knowledge revision?" Then unpacking the "revision-readiness" idea. 

  For the "two framings" section, I'll need to show why both existing interpretations miss this point. The adult education view ignores epistemology, while the graphical integrity approach focuses too much on accuracy per se. The user's criterion is distinct because it's about the system's adaptability, not just truth-tracking. 

  Methodology-wise, the three case studies (COVID charts, hurricane cones, IPCC diagrams) make sense. Each represents different uncertainty visualization challenges. The analysis should examine how each system handles revisions—do updates require changing the rules or just the content? 

  The possible results section has to confront the big worry: does "revision-readiness" just disguise correspondence or aesthetics? I'll need to suggest ways to test this—like looking for cases where easy revision doesn't correlate with accuracy, or examining Neurath's own transformations for hidden assumptions. 

  Failure modes include oversimplifying Neurath's holism or getting bogged down in graphical design debates. Scope management would mean focusing on the three case studies first. 

  The user's deeper need seems to be legitimizing a philosophical angle in a data-viz context. They're straddling two fields, so the proposal must speak to both while carving out original space. Their anxiety about the criterion's coherence is valid—addressing it head-on will strengthen the proposal. 

  American English and proposal register are essential: direct, future-tense ("I will analyze"), and emphasizing work planning over conclusions. Keeping citations minimal per requirements, but signaling where bibliography would go. 

  Biggest challenge: making "revision-readiness" feel rigorous enough for philosophy while concrete enough for data-viz folks. The case studies are the anchor—they'll show if the criterion reveals something new about real-world visualizations.
answer: |-
  Here’s a structured proposal draft adhering to your specifications (2-page target, American English, proposal register). I’ve focused on framing the question, addressing tensions, and outlining actionable research—flagging where your core insight drives novelty:

  ---

  **Proposal: Revision-Ready Visualizations — Neurath’s Picture Language as Epistemic Infrastructure**  

  **1. The Question, Stated Tightly**  
  *How does Otto Neurath’s theory of pictorial statistics prioritize a visualization system’s capacity for communal revision over its correspondence to data or behavioral efficacy?* Neurath’s "boat" epistemology rejects foundational certainty, yet his ISOTYPE project is typically interpreted as either adult-education propaganda or a precursor to modern data-integrity standards. I argue both miss his core criterion: a picture language succeeds when its *conventional syntax* enables communities to update claims about the world *without renegotiating the visual code itself*. This "revision-readiness" turns learnability into an epistemic virtue and positions visualization as scaffolding for collective reasoning amid uncertainty.

  **2. Why the Two Obvious Framings Leave It Open**  
  *(~300 words)*  
  The "adult education" reading (e.g., Galison, Vossoughian) rightly notes ISOTYPE’s pedagogical aims but reduces its pictorial conventions to rhetorical tools, neglecting Neurath’s explicit analogy to protocol-sentence debates: both are conventional "languages" for public coordination, not mere dissemination. Meanwhile, Tufte-inspired "graphical integrity" scholarship (e.g., Cairo, Spiegelhalter) valuably addresses distortion risks but assumes a stable fact/chart relationship Neurath’s holism rejects—prioritizing perceptual accuracy over *systemic flexibility during revision*.  

  Neither framing explains *why* Neurath insisted on standardized pictograms, fixed rounding rules, and "transformation" by centralized editors. Consequentialism (e.g., "effective belief transfer") can’t distinguish pictorial from textual mediation. Correspondence theories fail his coherence test. My criterion—**revision-readiness**—emerges from his epistemology: a system scores higher when new evidence (e.g., pandemic projections shifting) triggers *content updates within stable conventions* rather than semantic disputes (e.g., "What *is* this cone of uncertainty depicting?"). If either framing generated this metric, Neurath’s design constraints would be incidental; they are instead constitutive.

  **3. Method — Months 1 through 9**  
  *(~350 words)*  
  **Months 1–2:** Reconstruct Neurath’s "revision" criterion from archival texts (*Empiricism and Sociology*, museum protocols), focusing on his treatment of error, updating, and conventions. Contrast with graphical-integrity literature.  
  **Months 3–7:** Three case studies analyzing revision-readiness in modern uncertainty visualizations:  
  - **COVID-19 fan charts** (e.g., IHME projections): Can new mortality data be integrated without redefining interval bands or axis conventions?  
  - **Hurricane "cone of uncertainty"**: When forecasts shift, does the cone’s syntax (path vs. time vs. intensity) require reinterpretation, or is editing purely additive?  
  - **IPCC diagrams** (spaghetti plots, ember icons): Do consensus reports repurpose visual motifs across assessments (enabling continuity), or does each report reinvent conventions?  
  **Selection rationale:** Each exemplifies public uncertainty communication; each faces "revision crises" (e.g., COVID model shifts confusing policymakers). Analysis will examine technical documentation, editor debates, and audience reception during updates.  
  **Months 8–9:** Synthesize findings. Test the criterion’s explanatory power: Does it resolve ambiguities in Neurath’s practice? Does it reveal trade-offs (e.g., rigid conventions aiding revision but limiting expressiveness) missed by correspondence/efficacy metrics? *Success* means demonstrating that revision-readiness: (a) predicts design choices in cases where correspondence/consequentialism clash; (b) explains why some systems survive paradigm shifts (e.g., IPCC) while others (e.g., ad-hoc COVID dashboards) fragment.

  **4. Possible Results and Decisive Tests**  
  *(~250 words)*  
  **Result 1:** Revision-readiness coheres Neurath’s theory/practice. His "transformers" (editors) aren’t correspondence-realists but *convention-stewards*—enabling durable disagreement. **Result 2:** The criterion collapses into disguised correspondence (if "stable conventions" tacitly track ontological stability) or aesthetics (if "communal ease" reduces to preference). **Result 3:** It explains modern failures (e.g., inconsistent COVID visuals confusing updates) better than existing frameworks.  
    
  **Decisive factors:**  
  - If Neurath’s editors *changed conventions* when data conflicted (e.g., altering pictogram semantics), correspondence may underlie his practice. Archival work settles this.  
  - If revision-ready systems *systematically sacrifice accuracy* (e.g., IPCC simplifications) yet sustain trust, consequentialism fails. Case studies test this.  
  - If the criterion *fails to guide design choices* in the cases (e.g., hurricane cones work due to perceptual affordances, not revision), it may be inert.

  **5. Failure Modes and Scope**  
  *(~200 words)*  
  **Triviality risk:** If revision-readiness merely restates "user-centered design," it adds nothing. *Mitigation:* Anchor analysis in Neurath’s anti-foundationalism and contrast with usability literature.  
  **Overextension risk:** Nine months is insufficient for full reception history or cognitive testing. *Mitigation:* Focus on document analysis (design guidelines, editor notes) for the 3 cases; defer empirical audience studies.  
  **Scope boundaries:** Exclude non-statistical visuals (e.g., cartoons) and private data artifacts (lab notebooks). Focus on public-facing, data-driven graphics where uncertainty is material.  
  **Contingency plan:** If archival work dominates, reduce to 2 case studies (prioritize COVID + IPCC as highest-stakes examples). If criterion proves incoherent late-stage, pivot to diagnosing why Neurath’s practice exceeds his theory.

  ---

  **Key Strengths Addressed:**  
  - Your "revision-readiness" is the engine, not an aside.  
  - Tensions (Neurath’s transformers vs. anti-foundationalism) drive the method.  
  - Case studies are framed as *tests* of the criterion.  
  - Collapse-into-correspondence is a defined failure outcome.  
  - Proposal structure forces specificity on what work looks like monthly.  

  **Register notes:**  
  - Active voice ("I will analyze...")  
  - Future-oriented ("This project will test...")  
  - Minimal hedge words; direct claims.  

  Let me know if you'd like to expand/rebalance any section—this hits exactly 2 pages formatted. Good luck!
