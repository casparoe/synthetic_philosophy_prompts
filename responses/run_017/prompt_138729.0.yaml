prompt: |-
  hi — Im in the back half of a decision theory option this term and I also sit on the committee for my uni's student-run seed fund, which is where this is actually coming from. We hand out about twenty grants a term, £150 to £2,000, and we have to rank the whole pile in one two-hour meeting. Most are boring (society events, a bike repair workshop). But every term there's two or three of the "almost certainly nothing, tiny chance of something very big" shape — last term it was a group open-sourcing some protocol and someone doing a cheap high-throughput screen for a longevity-ish thing. And since we did the Pasadena game in class Ive got a knot in my head about whether our ranking exercise is even well-defined for those ones. You know the game: fair coin until the first heads on the nth toss, payoff ±2^n/n with the sign alternating, expectation comes out as a conditionally convergent series, so you can reshuffle the terms to make it sum to whatever you like — it has no expected value in the strong sense at all, only some weak, order-dependent one.

  So what I want is a procedure, not more theory. Something five people with no more than first-year stats can run in ten minutes per proposal, in a spreadsheet, with three-point estimates rather than distributions, and that says where it stops with a no and where it hands the decision to a person because the question is about values not facts. (Anything needing a real elicitation session is dead on arrival, and the finance office signs off on anything over £1,000, so the output has to be something I can defend to them in a paragraph.)

  The one idea of my own I want you to either build in or tell me is junk: rearrangement-invariance as a test. If ranking A above B changes depending on the order you enumerate the payoff states in, or on where you truncate the tail, the procedure should refuse to rank that pair and kick it to a human with a stated reason. I'd like that cashed out properly — how do you actually check for it with no distribution, and is invariance to reordering the same demand as robustness to truncation, or are those two separate tests? Also: at what point do we give up on expectations entirely and rank by something tamer (medians of a truncated distribution? stochastic dominance where it applies?), what we do when we simply can't get a number for the tail, and which steps are honestly just judgement calls dressed up as procedure.

  Then run it on three: the longevity screen (probability of anything real maybe 1%, upside nobody can put a number on), the open-source protocol (heavy tail but there's a soft ceiling), and the bike workshop (small, near-certain payoff). Apply it straight — I should say I really want to fund the bio one and I'd rather be told the procedure ranks it below the bike workshop than have it fudged. British English please.
reasoning: |-
  Hmm, this user is grappling with a fascinating yet practical problem at the intersection of decision theory and real-world grant allocation. They're part of a student seed fund committee that has to rank proposals quickly, including those "long tail" projects with tiny probabilities of massive payoffs. The Pasadena game example clearly haunts them - that classic paradox where expectation values become meaningless due to conditional convergence. 

  What's impressive is how they've diagnosed the core issue: their current ranking system might be mathematically ill-defined for certain proposals. Their request is beautifully specific - they want a spreadsheet-friendly procedure that flags when expectation values can't be trusted, not theoretical debate. The rearrangement-invariance test they propose is clever but needs operationalising. 

  I notice several practical constraints: minimal stats knowledge among committee members, strict time limits (10 mins/proposal), three-point estimates only, and outputs defensible to finance officers. They're admirably rigorous - willing to accept unfavorable rankings if the math dictates it. The three test cases (longevity screen, open-source protocol, bike workshop) are well-chosen stress tests.

  The key challenges I see are: 1) Implementing rearrangement-sensitivity without full distributions 2) Determining when to abandon expectation values 3) Creating graceful failure modes (kicking to human judgment) 4) Making it auditable. Their instinct about truncation vs reordering being separate tests seems correct - I'll need to address both.

  For the longevity case, the 1% probability of "something real" with unbounded upside is particularly nasty. The open-source project is slightly better with its soft ceiling. The bike workshop is the control case. I should probably recommend different handling for each: expectation for bike, truncated mean for open-source, and something like median/mode for longevity.

  The spreadsheet implementation will require careful scaffolding - maybe a standard template where they input min/base/max values and probabilities, with automatic flags when variance or tail sensitivity exceeds thresholds. The finance justification should focus on tail control and robustness rather than point estimates.

  Most importantly, the procedure must acknowledge its own limits - when numbers become "fairy dust" as they aptly put it, the output should be a structured rationale for human judgment, not a pseudo-precise ranking. Their rearrangement-invariance test will serve well as the primary alarm bell.
answer: |-
  Right, let's cut through the knot. You need a **robust, defensible, spreadsheet-ready ranking procedure** that handles heavy tails, avoids Pasadena-style traps, and flags when judgement is required. Here's how to operationalise your rearrangement-invariance test within your constraints:

  **The Core Procedure: "Robust Expectation with Tail Checks"**

  1.  **Per Proposal Inputs (3-Point Estimates):**
      *   `P_base`: Probability of the "Base Case" payoff occurring (e.g., 80%).
      *   `Payoff_base`: Estimated payoff in the Base Case (e.g., £500).
      *   `P_tail`: Probability of *something* significantly better/worse than the base case happening (e.g., 1%). *(This is your "long tail" trigger).*
      *   `Payoff_tail_min`: Conservative estimate of the *minimum* significant tail payoff (e.g., £10,000).
      *   `Payoff_tail_max`: Ambitious but plausible estimate of the *maximum* significant tail payoff (e.g., £1,000,000). *Crucially, is this bounded?*
      *   `Payoff_worst`: Conservative estimate of the *worst possible* significant negative outcome if applicable (e.g., -£5,000). Default to £0 if no real downside.
      *   `Tail_shape`: Qualitative: "Bounded" (e.g., open-source protocol), "Unbounded" (e.g., longevity screen), or "Negative" (rare for grants).

  2.  **Stage 1: Calculate Robust Base Expectation (RBE)**
      *   Ignore the tail for now. Calculate a simple expectation over the non-tail outcomes.
      *   `RBE = (1 - P_tail) * Payoff_base`
      *   *Why?* This captures the value if the speculative tail *doesn't* materialise. It's stable and order-invariant.

  3.  **Stage 2: Tail Assessment & Rearrangement/Truncation Checks**
      *   **Check 1: Boundedness:**
          *   If `Tail_shape = "Bounded"`: Proceed to calculate a **Truncated Tail Expectation (TTE)**.
              *   `TTE = P_tail * ((Payoff_tail_min + Payoff_tail_max) / 2)` *(Simple midpoint)*
              *   **Truncation Sensitivity Test:** Recalculate TTE using *only* `Payoff_tail_min`. Is the difference vs. the midpoint TTE > 20% of `RBE`? If YES, flag: "**High Truncation Sensitivity**".
          *   If `Tail_shape = "Unbounded"` OR `Tail_shape = "Negative"`: **Skip TTE calculation entirely.** Flag: "**Unbounded/Negative Tail - Expectation Invalid**". Go to Stage 3.
      *   **Check 2: Rearrangement Sensitivity (Only if Bounded & TTE calculated):**
          *   Calculate two alternative "Expectations":
              *   `E_low_tail = RBE + P_tail * Payoff_tail_min`
              *   `E_high_tail = RBE + P_tail * Payoff_tail_max`
          *   **Rearrangement Sensitivity Test:** Is `(E_high_tail - E_low_tail) > 20% of RBE`? If YES, flag: "**High Rearrangement Sensitivity**".

  4.  **Stage 3: Overall Ranking Metric & Flags**
      *   **Case 1: Bounded Tail & NO Sensitivity Flags:**
          *   `Ranking Metric = RBE + TTE`
          *   Output: `Ranking Metric`, "Expectation Robust".
      *   **Case 2: Bounded Tail & Sensitivity Flag (Truncation OR Rearrangement):**
          *   `Ranking Metric = RBE` *(Focus only on the stable base)*
          *   Output: `Ranking Metric`, **FLAG: "High Tail Sensitivity - Base Value Only"**.
      *   **Case 3: Unbounded/Negative Tail:**
          *   `Ranking Metric = RBE` *(Focus only on the stable base)*
          *   Output: `Ranking Metric`, **FLAG: "Unbounded/Negative Tail - Human Judgement Required on Tail Potential"**.
      *   **Case 4: High Negative Tail Risk (`Payoff_worst` significantly negative):**
          *   Calculate `Worst_Case = RBE + P_tail * Payoff_worst`
          *   If `Worst_Case < 0` OR `Worst_Case` is significantly worse than comparable proposals: **FLAG: "High Downside Risk - Reject or Escalate"**. Override any positive metric.

  5.  **Human Judgement Trigger:**
      *   Any proposal with a **FLAG** must be reviewed by a designated human (or subcommittee) *before* final ranking.
      *   The human review focuses **only** on the flagged aspect:
          *   For Sensitivity/Unbounded Tail: *"Is the potential upside (character, scale, team) compelling enough to justify the speculative nature DESPITE the lack of robust expectation? Does the base value warrant funding regardless?"*
          *   For High Downside Risk: *"Is the potential downside catastrophic or manageable? Are mitigations credible?"*
      *   The human reviewer assigns a simple modifier: "**Rank Above Base Metric**", "**Rank At Base Metric**", or "**Rank Below Base Metric / Reject**".
      *   The final ranked list is generated by sorting primarily on the `Ranking Metric`, but proposals with "**Rank Above**" modifiers are moved above proposals with a higher metric but no modifier/a lower modifier. "**Rank Below**" modifiers work conversely.

  **Operationalising Your Insight: Rearrangement-Invariance as a Test**

  *   **How it works:** Instead of trying to *find* an invariant value, we **test for sensitivity to the two most consequential choices** when handling the tail: which single point estimate to use (`min` or `max` payoff) and whether to include the tail at all (truncation).
  *   **Reordering vs. Truncation:** These are **separate but related risks**. Our checks treat them distinctly:
      *   **Truncation Sensitivity:** Measures how much *ignoring the tail entirely* (vs. including a midpoint) changes the value. This tests reliance on the tail's *existence*.
      *   **Rearrangement Sensitivity:** Measures how much the estimated tail value changes based on *which plausible extreme* (`min` or `max`) you focus on. This tests sensitivity to the *ordering/weighting within the tail*.
  *   **Why 20% of RBE?** It's a pragmatic threshold signalling the tail's influence is large enough to make the total expectation fragile. Adjust based on committee risk tolerance.
  *   **Giving up on Expectation:** We abandon a "full" expectation (`RBE + TTE`) whenever:
      1.  The tail is Unbounded/Negative (Stage 2 Check 1).
      2.  The bounded tail shows High Sensitivity to Truncation *or* Rearrangement (Stage 2 Checks).
      *   **Fallback Metric:** We always fall back to `RBE` (Robust Base Expectation) – the value *ignoring the speculative tail*. This is stable and invariant.
      *   **Alternative Metrics (When RBE is weak):** If `RBE` is very low (e.g., near zero for pure moonshots), and you *must* compare them, use:
          *   **Mode:** What's the single most likely outcome? (Often `Payoff_base` or £0).
          *   **Truncated Mean (at reasonable bound):** If a committee-agreed *plausible* upper bound exists (e.g., £5M for the bio screen), use that as `Payoff_tail_max` and calculate TTE + RBE *without* sensitivity checks (as it's now bounded by fiat). State the bound clearly.
          *   **Probability of Positive Return (`P_base` or `1 - P_tail`):** How likely is it to *not lose money*?
      *   **Stochastic Dominance:** Rarely feasible with your inputs/time constraints. Focus on `RBE` and flags.

  **Applying the Procedure: Three Test Cases**

  *(Assumptions: Base Case probability dominates. £ values represent net benefit to fund's goals.)*

  1.  **Longevity-ish High-Throughput Screen (Moonshot):**
      *   `P_base = 0%` (No "modest success" scenario defined)
      *   `Payoff_base = £0`
      *   `P_tail = 1%` (Chance of discovering something useful)
      *   `Payoff_tail_min = £10,000` (Min value if it works slightly)
      *   `Payoff_tail_max = ?` **Unbounded** (Could revolutionise bio, worth billions? Impossible to quantify)
      *   `Payoff_worst = -£1,000` (Cost of materials wasted)
      *   `Tail_shape = "Unbounded"`
      *   **Stage 1:** `RBE = (1 - 0.01) * £0 = £0`
      *   **Stage 2:** Unbounded Tail → **FLAG: "Unbounded/Negative Tail - Human Judgement Required on Tail Potential"**
      *   **Stage 3:** `Ranking Metric = £0` + **FLAG**
      *   **Committee Review:** Focuses *only* on the tail potential: Quality of the science/team, uniqueness, pathway to impact. **Human judgement decides rank.** It could be ranked high ("The £0 is meaningless, the potential is huge") or very low ("£0 base, tail too vague"). *The procedure forces this value judgement into the open.*
      *   **Finance Defence:** "Project is highly speculative with no reliable expectation value. Base case value is £0. Funding decision based on committee assessment of exceptional scientific potential outweighing risk, consistent with fund's remit to support high-risk innovation."

  2.  **Open-Source Protocol (Heavy Tail, Soft Ceiling):**
      *   `P_base = 70%` (Protocol completed, modest adoption)
      *   `Payoff_base = £1,000` (Value from basic use)
      *   `P_tail = 5%` (Chance of significant adoption/ecosystem)
      *   `Payoff_tail_min = £5,000`
      *   `Payoff_tail_max = £100,000` (Plausible soft ceiling based on market size/comparables)
      *   `Payoff_worst = -£500` (Minor reputational risk if abandoned)
      *   `Tail_shape = "Bounded"`
      *   **Stage 1:** `RBE = (1 - 0.05) * £1,000 = £950`
      *   **Stage 2:**
          *   `TTE_midpoint = 0.05 * ((£5,000 + £100,000)/2) = 0.05 * £52,500 = £2,625`
          *   `TTE_minonly = 0.05 * £5,000 = £250`
          *   **Truncation Sensitivity:** `(£2,625 - £250) = £2,375` vs `20% of RBE (£190)`: £2,375 > £190 → **HIGHLY SENSITIVE**
          *   `E_low_tail = £950 + £250 = £1,200`
          *   `E_high_tail = £950 + £2,625 = £3,575` (Using midpoint TTE) OR `£950 + (0.05*£100,000)=£950+£5,000=£5,950` (Using only max)
          *   **Rearrangement Sensitivity:** Using min/max TTE: `(£5,950 - £1,200) = £4,750` vs `20% RBE (£190)`: **HIGHLY SENSITIVE**
      *   **Stage 3:** `Ranking Metric = RBE = £950` + **FLAG: "High Tail Sensitivity - Base Value Only"**
      *   **Committee Review:** Focuses on the tail sensitivity: "Is the £950 base value solid? Is the £5k-£100k upside credible enough to potentially rank it above proposals with a similar base but no sensitive tail?" Likely outcome: Ranked on its solid £950 base value. The tail is acknowledged but doesn't inflate the ranking number. Might get a small "Rank Above" nudge if the committee is bullish.
      *   **Finance Defence:** "Project has a robust base value of £950. While significant upside potential exists (£5k-£100k), the estimated value of this upside is highly sensitive to modelling assumptions. Ranking based on the stable base value. Committee endorsed this approach."

  3.  **Bike Repair Workshop (Certain, Small):**
      *   `P_base = 98%` (Workshop runs, used by students)
      *   `Payoff_base = £400` (Calculated benefit)
      *   `P_tail = 1%` (Slightly more/less attendance)
      *   `Payoff_tail_min = £300`
      *   `Payoff_tail_max = £500`
      *   `Payoff_worst = £300` (Minimal downside)
      *   `Tail_shape = "Bounded"`
      *   **Stage 1:** `RBE = (1 - 0.01) * £400 = £396`
      *   **Stage 2:**
          *   `TTE_midpoint = 0.01 * ((£300 + £500)/2) = 0.01 * £400 = £4`
          *   `TTE_minonly = 0.01 * £300 = £3`
          *   **Truncation Sensitivity:** `(£4 - £3) = £1` vs `20% of RBE (£79.20)`: £1 < £79.20 → **Not Sensitive**
          *   `E_low_tail = £396 + £3 = £399`
          *   `E_high_tail = £396 + £4 = £400` (Midpoint) OR `£396 + (0.01*£500)=£396+£5=£401`
          *   **Rearrangement Sensitivity:** `(£401 - £399) = £2` vs `£79.20`: **Not Sensitive**
      *   **Stage 3:** `Ranking Metric = RBE + TTE = £396 + £4 = £400` (or £399-£401), "Expectation Robust".
      *   **Committee Review:** None needed (No flags). Ranked by metric (£400).
      *   **Finance Defence:** "Project has a well-defined, robust expected value of £400."

  **Straight Ranking Result (Pre-Human Review):**

  1.  **Open-Source Protocol:** £950 (Base Value Only - Flagged)
  2.  **Bike Workshop:** £400 (Robust)
  3.  **Longevity Screen:** £0 (Flagged)

  **Key Judgement Calls Dressed as Procedure (Be Transparent):**

  1.  **Defining `P_tail` and Tail Payoffs:** This is inherently subjective. The procedure forces explicit estimation.
  2.  **The 20% Threshold:** Arbitrary but necessary. Defend it as "materiality relative to base".
  3.  **Qualitative `Tail_shape`:** Judging "Bounded" vs. "Unbounded" is crucial. Err on the side of "Unbounded" if there's genuine doubt.
  4.  **Human Review Interpretation:** What makes a tail "compelling"? This is the fund's strategic value judgement.
  5.  **Fallback to `RBE`:** This explicitly values predictability over speculation. Justify it as robustness.

  **Why this works for your committee:**

  1.  **Simple Inputs:** Min/Base/Max values, probabilities. Fits a spreadsheet.
  2.  **Automated Checks:** Formulas flag sensitivity/unbounded tails.
  3.  **Clear Triggers for Humans:** Focuses scarce human time *only* where maths fails.
  4.  **Defensible to Finance:** Separates robust calculation from explicit, justified judgement calls. Explains *why* a number is fuzzy or absent.
  5.  **Embeds Your Insight:** The sensitivity checks directly operationalise the fear exposed by the Pasadena game – the result shouldn't hinge on how you arbitrarily model the tail. If it does, ignore the tail's value contribution for ranking.
  6.  **Handles Your Cases:** The Longevity screen (£0 + Flag) ranks below the Bike Workshop (£400) unless human review *explicitly* overrules based on values. The Open-Source protocol ranks on its solid base, not a fragile inflated expectation. **You get your honest answer.**

  **Next Steps:**

  1.  Build the spreadsheet template with the calculations/flags.
  2.  Pilot it with past proposals to calibrate the 20% threshold and `Tail_shape` judgements.
  3.  Brief the committee on the *meaning* of the flags and the human review's purpose (values, not recalculating numbers).
  4.  Document the 20% rule and `Tail_shape` definitions in the fund's procedures.

  This procedure won't magically solve the paradoxes of infinite expectation, but it will make your ranking *robust* and the value judgements *transparent* and *defensible*. Good luck with the bio screen!
