  Ah, their proposed three-way split (inherited/held/aspirational) feels central. I should validate that but also stress its limitations. The aspirational layer ("that isn't who we are") is especially slippery - it's where rhetoric often overrides reality. 

  *flipping through mental index cards of political philosophy*... The non-negotiable criteria must include historical mutability and internal diversity. Can't let "the West" pretend to be static or monolithic. But also need to acknowledge why the phrase persists - it's mapping *something*, even if poorly. 

  Biggest tension: their desire to both acknowledge Western-originated ideas (like human rights frameworks) while admitting their selective application. That hypocrisy gap is where most arguments live. Also their Camp A/B distinction matters - universalists vs identitarians will never agree on criteria. 

  *noticing their meta-awareness*... They're unusually alert to trapdoors here. The request for "desiderata" instead of definitions suggests they've been burned by reductive answers before. I'll foreground tradeoffs rather than false solutions. 

  The tribal marker detector is key. Maybe emphasize performative vs substantive usage - like when "Western values" gets invoked only against non-Western Others. That's usually the smell test.
answer: |-
  Here's a rigorous specification for evaluating any account of "Western values," designed to distinguish substantive meaning from tribal signaling. The criteria address your core concerns and explicitly handle your proposed three-way split.

  ### Core Non-Negotiable Desiderata (Must-Handle Cases)
  1.  **Illiberal-but-European Cases (e.g., Hungary, pre-1975 Spain):**
      *   *What it must handle:* Explain why these states are still considered "Western" despite violating supposed core Western values (democracy, liberalism). Does geography/history trump current practice?
      *   *Why:* Exposes the tension between geography/culture/history and current political values. Tests if "Western" is primarily civilizational or ideological.
  2.  **Liberal-but-not-European Cases (e.g., Japan, South Korea, Uruguay, Costa Rica):**
      *   *What it must handle:* Explain why these societies aren't typically labeled "Western" despite embodying values often associated with the West (liberal democracy, human rights, market economies).
      *   *Why:* Challenges the uniqueness claim. If non-Western societies can hold these values, what makes them *Western*? Tests geographic/cultural essentialism.
  3.  **The US Religiosity Paradox:**
      *   *What it must handle:* Account for the US being simultaneously the most religious rich nation and a paradigm case of "Western values" (liberalism, secular governance *in principle*), while secular Europe is equally "Western."
      *   *Why:* Tests the coherence of "values" against demographic reality. Challenges monolithic descriptions. Highlights the inherited/held/aspirational split.
  4.  **Historical Recency (e.g., Women's Suffrage, Decolonization):**
      *   *What it must handle:* Acknowledge that key "Western values" (universal suffrage, racial equality, anti-colonialism) are very recent developments (20th century), often achieved through struggle *against* prevailing Western traditions/institutions.
      *   *Why:* Undermines narratives of timeless Western virtue. Forces distinction between *inherited tradition* and *aspirational commitment*. Shows values evolve through internal conflict.
  5.  **Critiques Using Western-Originated Norms:**
      *   *What it must handle:* Explain how critiques of the West (e.g., for imperialism, racism, hypocrisy on human rights) frequently deploy concepts and values (equality, self-determination, universal rights) developed *within* the Western intellectual tradition.
      *   *Why:* Challenges claims of Western moral monopoly or purity. Highlights internal diversity and self-critique as *part* of the tradition. Separates origins from implementation.

  ### Essential Distinctions (Cannot Collapse)
  6.  **The Three-Way Split (Doing Real Work):**
      *   *Inherited Tradition:* Values embedded in historical texts, institutions, dominant practices (e.g., Greco-Roman philosophy, Judeo-Christian ethics, Enlightenment rationalism, historical sexism/racism/imperialism).
      *   *Actually Held:* Values reflected in the behaviors, beliefs, and laws of populations *today* (e.g., varying levels of support for immigration, social welfare, gender equality, democracy across Western nations).
      *   *Aspirational Commitment:* Values enshrined in foundational *principles* (Constitutions, UN Declarations, Enlightenment ideals) often appealed to in moments of self-critique or crisis ("That's not who we *are*").
      *   *Why Non-Negotiable:* Collapsing these leads to fatal confusion. Claiming the aspirational ideal *is* the inherited tradition is historically false. Claiming the aspirational ideal *is* what's currently held ignores widespread illiberalism. A valid account must show how these interact (e.g., aspirational ideals *arising from* critique of tradition, current practice falling short of aspiration).
  7.  **Values vs. Geography/Culture:**
      *   *What it must handle:* Distinguish clearly whether "Western" primarily denotes a geographic/cultural sphere (with messy internal values) or a specific set of ideas (which may exist elsewhere).
      *   *Why:* Essential for handling Cases 1 & 2. Avoids circularity ("Western values are what the West has, and the West is defined by having these values").
  8.  **Origin vs. Exclusive Association:**
      *   *What it must handle:* Can a value originate primarily within the historical West *without* being exclusively or inherently "Western" (i.e., can others adopt/adapt it meaningfully)?
      *   *Why:* Crucial for handling Cases 2 & 5. Prevents essentialism and acknowledges global intellectual exchange.

  ### Camp-Specific Desires (Often Contested)
  9.  **Camp A (Universalist/Enlightenment-Centric):**
      *   *Wants:* "Western values" = specific universal principles (individual liberty, reason, democracy, human rights) that *originated* primarily in the modern West but are not geographically bound. Focuses on *aspirational commitment* and *intellectual origin*. Downplays *inherited tradition* contradicting these and *current practice* failing them. Sees Cases 1 & 2 as proving values aren't geographically exclusive.
      *   *Why:* Defends universality and portability of liberal ideals. Often used to justify intervention or critique non-Western states.
  10. **Camp B (Identitarian/Civilizational):**
      *   *Wants:* "Western values" = the unique cultural essence/civilizational heritage of Europe and its offshoots. Emphasizes *inherited tradition* (including pre-Enlightenment elements like Christianity, Greek thought) and shared cultural identity. Views *aspirational commitments* as expressions of this deeper heritage. Sees Cases 1 & 2 as proving values are rooted in specific culture/geography, not easily transferable.
      *   *Why:* Defends cultural distinctness, sovereignty, and continuity. Resists perceived cultural homogenization or external imposition.

  ### Key Tensions & Likely Trade-offs
  *   **Universality vs. Exclusivity:** Camp A's universalism struggles with Case 2 (why aren't Japan/ROK "Western"?). Camp B's exclusivity struggles with Case 1 (how are illiberal European states "Western"?).
  *   **Aspiration vs. Reality:** Emphasizing *aspirational commitment* (to explain critique - Case 5) downplays the gap with *current practice* (Case 3, 4) and *inherited tradition* (Case 4). Over-emphasizing *current practice* or *inherited tradition* makes "Western values" look illiberal or hypocritical.
  *   **Defining the Core:** Is it Christianity? The Enlightenment? Greco-Roman + Judeo-Christian + Enlightenment? Democracy? Secularism? Individualism? Any choice will exclude significant parts of Western history or current reality (e.g., US religiosity vs. European secularism).
  *   **The "Origin Trap":** Acknowledging the historical origin of ideas like universal rights (Case 5) risks sounding like a claim to ownership, conflicting with the desire to see them as universal (Case 2).

  ### Using the Spec
  *   **Evaluate Candidates:** Test definitions against Cases 1-5. How do they handle Hungary? Japan? US religiosity? Women's suffrage history? MLK using Locke? Does it distinguish Inherited/Held/Aspirational?
  *   **Spot Tribal Markers:** If a usage...
      *   Ignores Cases 1, 2, 3, 4, or 5.
      *   Blurs Inherited/Held/Aspirational (especially equating Aspirational with Held or Inherited without acknowledging conflict/evolution).
      *   Is geographically essentialist *without* addressing Case 2.
      *   Claims value exclusivity *without* addressing Case 2 or 5.
      *   Invokes an ahistorical, static "tradition" ignoring Case 4.
      *   ...it's likely a tribal marker.
  *   **Identify Substantive Work:** A usage does real work if it...
      *   Explicitly references a *specific* value from the Inherited tradition *and* explains its relevance/evolution.
      *   Critiques a gap between Aspirational Commitment and Current Practice/Held Beliefs.
      *   Engages honestly with the contradictions (e.g., "These Enlightenment aspirations arose *within* the West, often *against* its dominant traditions and practices, and their implementation remains contested").
      *   Distinguishes the West as a *geopolitical entity with a complex history* from specific *ideals* that emerged within it but aspire to universality.

  Your three-way split is **crucial and doing real work**. It's the key analytical tool for navigating the inherent tensions and avoiding the pitfalls that make "Western values" such a contested and often tribal phrase. A serious account *must* grapple with the distinctions and interactions between what was inherited, what is (variably) held now, and what is aspired to in principle. Ignoring this complexity is the hallmark of tribal usage.
