prompt: |-
  Hi — practical question, and one that's come up for me a lot in the last year. I'm one of four people on the grant committee of a small family foundation (we give away maybe 400k a year), and someone walked us through that three-factor way of comparing causes: how big and bad the problem is, whether more money actually makes a dent in it, and how underfunded it already is. We've been trying to genuinely use it instead of just nodding along, and I keep running into something I don't have a word for, and its driving me nuts.

  Here's the thing. The third factor behaves differently from the other two. If we put 50k into something and it works, the size of the problem goes down a bit, the "does money help" factor is basically unchanged. But the underfunding score collapses relative to the money we put in — and what's stranger is that it collapses when we only *talk*. Two episodes from this year:

  1. We found a small program that scored well on all three, exactly the kind of thing you'd expect nobody else to have spotted yet. Two of us wrote a short internal note explaining why. A committee member forwarded the note to a friend at a much bigger funder, and inside a few months that funder had moved in with an amount that dwarfed ours. Great for the cause, genuinely. But our next 50k there is now worth far less by our own framework, and the framework now points somewhere else. So doing the analysis properly and telling anyone about it is what made the recommendation expire.

  2. Related but I think separate: we've noticed we now have a reason to be vague in our public writeups, or to just not mention the specific gap we found, which feels completely backwards for a grantmaking body that's supposed to be transparent about why it funds what it funds. We didn't set out to be secretive. The framework quietly recommended it.

  Is there a name for this? Diminishing returns isn't it — returns per dollar haven't obviously dropped, it's the diagnosis that dropped. Someone muttered "Goodhart's law" at me; I read around a bit and that seems to be about a measure becoming a target and then getting gamed, but nobody here is gaming anything, and the measure isn't corrupted so much as used up by the act of acting on it. A friend in finance said "alpha decay," which sounds closer, but I can't tell if that's a real term or desk slang.

  I don't only want a label though. I want to know whether this is one thing or several: (a) the recommendation going stale, (b) the analysing and telling being part of what makes it stale, not a side effect of the money, and (c) the pull toward silence. For each, what's the nearest established concept, and where exactly does the fit break? If the combined thing has no name, coin one, define it, and say what would and wouldn't count as a case of it. And one more: does the staleness mean we've specified the third factor wrong — should it have been about other people's money *given* what we ourselves are going to do — or is it just a fact about the world that a committee like ours has to live with?
reasoning: |-
  Okay, the user is part of a grant committee for a small family foundation distributing about $400k annually. They're using a three-factor framework to evaluate causes: problem scale, solvability with funds, and underfunding level. Their main issue is with the third factor—underfunding—which seems to behave unpredictably. Specifically, when they identify a promising underfunded cause and either fund it or even just discuss it publicly, that underfunding status changes rapidly, making their initial assessment obsolete. 

  The user describes two concrete situations: First, an internal analysis of a promising cause was leaked to a larger funder, who then swooped in with massive funding—making their own planned contribution less impactful by their framework's logic. Second, this dynamic creates perverse incentives to be vague in public communications to avoid "tipping off" big players, which clashes with their desire for transparency. 

  They're asking for: 
  1) A name for this phenomenon where analysis/communication itself destabilizes the underfunding metric 
  2) Whether this is one unified problem or three distinct issues (stale recommendations, analysis causing staleness, pressure toward secrecy) 
  3) Conceptual framing for each piece 
  4) Whether their underfunding definition is flawed or if this is just reality

  Hmm... this is fascinating because it reveals a fundamental tension in effective altruism-style frameworks. The underfunding factor is inherently reactive to attention—especially when small actors identify opportunities that scale-hungry large funders can rapidly absorb. The user's frustration is palpable: they did everything "right" analytically, but the system responded in ways that invalidated their approach. 

  First thought: Goodhart's Law isn't quite right because no one's gaming metrics—it's more like the metric is self-undermining through legitimate use. "Alpha decay" from finance is tempting (returns diminishing as others copy your strategy), but philanthropy isn't zero-sum. 

  Breaking it down: 
  - Core dynamic: The act of measuring/spotting underfunding attracts capital, altering the very condition measured. This feels like a version of the observer effect in physics, but for funding markets. Could call it "philanthropic Heisenberg" jokingly, but needs rigor. 
  - For (a) recommendations going stale: Classic temporary arbitrage opportunity. Their framework identifies funding gaps, but gaps close fast when visible. 
  - For (b) analysis causing staleness: Information externality. Their research unintentionally subsidizes bigger funders' due diligence. 
  - For (c) pull toward secrecy: Emergent information hoarding—a tragedy of the commons where transparency reduces collective impact by front-running small actors. 

  Biggest insight: The flaw isn't in their definition but in treating underfunding as static. Underfunding exists within an attention economy; their framework needs to model how their own actions (including communication) affect others' funding decisions. Maybe add a fourth factor: "attention sensitivity"—how likely is this gap to close if spotlighted? 

  For naming: "Detectability decay"? "Arbitrage evaporation"? Best fit might be "funding gap fragility." Defining it as: The tendency for assessed underfunding in a cause to decrease disproportionately to actual capital deployed, due to observation or discussion attracting additional funders. 

  Practical advice they might need: 
  - Could formally partner with big funders ("we'll find niches, you scale") 
  - Build non-public "stealth" evaluation periods into process 
  - Focus on gaps where their $50k is catalytic (e.g., funding pilot data) rather than gaps per se 

  The existential bit: Yes, this is reality—small funders move markets less by money than by signaling value. Their power is as scouts, not financiers. That's not broken; it's strategic repositioning.
answer: |-
  This is a brilliantly articulated dilemma that cuts to the heart of strategic philanthropy. You've identified a fundamental tension in using "underfunding" as a static metric. **The phenomenon you describe is most precisely called "**Arbitrage Evaporation**" or "**Philanthropic Alpha Decay**" (yes, "alpha decay" is a real finance term for diminishing competitive edge).** It combines three interconnected dynamics:

  ### 1. **The Core Concept: Arbitrage Evaporation**
     - **Definition**: The rapid dissipation of an opportunity's unique value (here, high impact-per-dollar due to underfunding) caused by the *act of identifying and/or acting on it*, which attracts competing actors and capital.
     - **Mechanism**: Your analysis creates *information* that reduces information asymmetry. Once others know about the opportunity, they deploy capital, saturating the funding gap. The "arbitrage" (exploiting an undervalued opportunity) evaporates.
     - **Not just diminishing returns**: Returns diminish due to *market response* to your signal, not inherent project limitations. Your $50k didn’t change the project’s efficiency; it changed the *funding landscape*.

  ### 2. Breaking Down Your Three Layers:
  | **Layer**                     | **Nearest Established Concept**                                  | **Why the Fit Works**                                                                 | **Where the Fit Breaks**                                                                 |
  |-------------------------------|------------------------------------------------------------------|---------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|
  | **a) Recommendation going stale** | **Temporal Arbitrage (Finance)** or **First-Mover Disadvantage** | Opportunities exist briefly before competitors enter. Your analysis accelerates this. | Arbitrage usually assumes profit motive; here impact is the "return."                   |
  | **b) Analysis/telling causes staleness** | **Information Externality (Economics)**                         | Your due diligence creates public goods (knowledge) others free-ride on.              | Externality is unintentional; you didn’t *mean* to subsidize big funders' research.     |
  | **c) Pull toward silence**    | **Information Asymmetry Preservation (Game Theory)**            | Secrecy maintains competitive advantage in impact "arbitrage."                        | Philanthropy’s ethos values transparency; this creates moral tension.                   |

  ### 3. Is the Third Factor Mis-specified?
  - **No, but it’s incomplete**. Underfunding *is* a valid factor, but it’s **dynamic and reactive to information flow**. Treating it as static is the flaw.
  - **Better framing**: "**Residual Funding Gap Resilience**" – How *insensitive* is the underfunding status to new information (like your analysis) or capital (like your grant)? 
  - **Key questions to add**:
    - *How quickly will this gap close if we signal its value?*
    - *Are there structural barriers preventing big funders from entering (e.g., specialized expertise, high due diligence costs)?*
    - *Can our $50k be catalytic in ways immune to crowding-in (e.g., funding R&D, advocacy, or capacity-building)?*

  ### 4. Is This Inevitable? Coping Strategies
  Yes, for highly scalable, information-sensitive opportunities. But you can adapt:
  - **"Stealth Mode" Evaluation**: Restrict sensitive analysis to a core team until funding is decided. Document rationale *after* the grant.
  - **Focus on "Information-Immune" Gaps**: 
    - Causes requiring specialized knowledge (e.g., niche technical interventions)
    - Geopolitically complex areas big funders avoid
    - Advocacy where early funding deters others (e.g., controversial issues)
  - **Leverage Your Signal**: *Partner* proactively with big funders: "We’ll fund the pilot if you scale it." Your analysis becomes an asset.
  - **Reframe Underfunding**: Assess "**fungibility risk**" – How likely is your grant to displace other funding? Low-fungibility grants (e.g., seed funding) resist alpha decay.

  ### What *Doesn’t* Count as This Phenomenon?
  - **Goodhart’s Law**: If you started avoiding impactful grants to keep your "underfunded" metric high, *that* would be Goodhart’s.
  - **Classic Crowding Out**: Your $50k *directly* causing others to withdraw funding (e.g., government cuts).
  - **Diminishing Returns**: Project efficiency declining due to scale (e.g., vaccinating harder-to-reach populations).

  ### In Practice: A Smarter Framework
  Add a fourth filter to your three factors:  
  **"Information Sensitivity"**  
  *Low Sensitivity* (Ideal for you):  
  - Technical/specialized interventions  
  - Politically toxic causes  
  - High due diligence barriers  
  - Capacity-building grants  
  *High Sensitivity* (Prone to Arbitrage Evaporation):  
  - Scalable service delivery in accessible regions  
  - Media-friendly "hot" causes  
  - Low-barrier-to-entry funding gaps  

  **This isn’t corruption of your framework—it’s sophistication.** Small funders like yours are the "hedge funds" of philanthropy: spotting undervalued opportunities before the market corrects. Your power lies not just in capital, but in *attentional capital*. By diagnosing Arbitrage Evaporation, you’ve uncovered a hidden rule of the game. Now you can play it strategically.
