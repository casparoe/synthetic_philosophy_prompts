prompt: |-
  I'm a rising senior at a large public high school, and I'm applying for a six-week summer research fellowship that my school runs with a nearby university: ten students get a small stipend, a faculty mentor, and a desk, and the application is a two-page proposal read by a committee of three teachers — one biology, one history, and the teacher who coaches our Ethics Bowl team — so it can't lean on vocabulary that only philosophy majors would recognize. The committee says explicitly that it wants the question and the plan, not a reading list, so please don't include citations or suggested sources; I'll fill those in later with my mentor.

  I got into this after an argument with my uncle, who raises beef cattle, and have been reading about it on my own since. What frustrates me is that the arguments I keep encountering for eating chicken rather than beef, or plants rather than either, seem to me to be adding up incommensurable things without admitting it, and my half-formed idea is that the confusion comes from there being three separate ledgers that people slide between: a deaths-caused ledger, which counts the animals killed in producing the food; a lives-created ledger, which counts the animals who exist at all only because someone will eat them; and a lives-prevented ledger, which counts the wild animals whose existence is blocked when land is turned over to crops or pasture. That third ledger is what makes this a question about wild animal suffering and not just about farmed animals, because if the typical wild life contains more suffering than happiness, then converting habitat to cropland may prevent an enormous amount of suffering, and the sign of the whole comparison could flip. There is also, I think, a separate currency problem underneath the ledger problem: if the harm is measured in deaths, chicken looks far worse than beef per calorie, since it takes many more birds to make the same amount of food, but if the harm is measured in days of suffering, the ranking may reverse, because the cattle live so much longer, and field deaths from crop cultivation may then dominate both. My uncle's own argument was essentially that if nobody ate beef these animals would never have existed at all, and I want to know how much work that point can really do.

  What I need is the proposal itself, not a defense of any answer. Please state the question so that it has a determinate answer rather than being a request for a general discussion, explain why the positions one can arrive at by common sense — count deaths per calorie; count suffering per animal; treat the existence point as settling it — leave the question open, and set out the method week by week for six weeks at roughly fifteen hours a week with no possibility of collecting data, including why a conceptual project makes genuine progress here rather than just restating what everyone already believes. Say why this approach is better than the obvious alternatives, such as assembling published estimates, surveying what people actually eat, or arguing directly for one diet. Give the possible conclusions and what would decide between them, and give an honest failure condition: my worry is that the result will collapse into it depends on which currency you prefer, so I want the proposal to say in advance what would make the outcome more informative than that. Finally, tell me honestly what part of this I should cut to make it feasible for someone with no graduate training, and what a deliverable would look like that would actually help a person — or a school cafeteria — deciding what to serve.
reasoning: |-
  Okay, let me unpack this student's request. They're a high school senior applying for a research fellowship with very specific constraints: a two-page proposal read by non-specialist teachers, focused on methodology rather than citations. The core frustration they're expressing is fascinating - they've noticed ethical arguments about food choices seem to be comparing apples and oranges (or rather, deaths vs existences vs prevented lives) without acknowledging the fundamental incompatibility of these metrics.

  Hmm, the student's uncle being a cattle rancher adds personal context - that "existence justification" argument is clearly the spark. The proposal needs to dissect why "they wouldn't exist otherwise" isn't a straightforward ethical win. But more importantly, they want to expose how the wild animal suffering angle could flip conventional wisdom - that's the real bombshell in their thinking.

  The methodological challenge is significant. Since they can't collect data, we need a conceptual framework rigorous enough to yield meaningful conclusions without empirical work. Their fear of collapsing into "it depends" is valid - the proposal must pre-commit to decision points that force resolution. I'm thinking we need to structure it so that even if relative weights remain subjective, the analysis reveals which variables actually determine ethical outcomes.

  For feasibility, the ledger system they proposed is actually perfect - simple enough for high school level but capable of handling complexity. We should probably ditch the population ethics modeling though; even undergrads struggle with that. Instead, focus on how the ledgers interact: when does preventing wild lives become a net positive? That's where the novel insight lies.

  The deliverable question is sharp - they want something actionable for cafeterias. Not another "go vegan" pamphlet, but a decision tree showing "if you care about X metric, prioritize Y." That's refreshingly pragmatic. Might need to downplay the wild suffering angle slightly though - it's academically solid but could distract from farm animal welfare concerns that feel more immediate to most people.

  Biggest risk is the currency problem. But if we frame the method as "mapping consequences" rather than prescribing answers, we turn that weakness into strength. The teachers should appreciate showing students how to navigate ethical tradeoffs transparently.
answer: |-
  Here's a concise, two-page research proposal structured to meet your requirements, focusing on a clear question, feasible methods, and tangible outcomes:

  **Proposal Title:** Mapping the Ethical Ledgers: A Comparative Analysis of Food Choices Beyond Simple Death Counts  

  **Research Question:**  
  *Does converting typical US beef production to equivalent-calorie chicken production or wheat production result in a net increase or decrease in total animal suffering-days, accounting for farmed lives created, lives prevented through habitat conversion, and suffering intensity?*  

  **Why Common Sense Falls Short & Why It Matters:**  
  Common ethical comparisons (e.g., "chicken causes more deaths than beef") rely on incomplete or mismatched metrics:  
  1.  **Deaths vs. Suffering:** Counting deaths ignores suffering duration/intensity (a chicken dies young; a cow lives longer; field mice die quickly during harvest).  
  2.  **Existence Justification:** Claiming farmed animals "benefit" from existence assumes their lives are net positive. This requires evaluating suffering in captivity vs. non-existence.  
  3.  **The Hidden Ledger (Wild Lives):** Converting pasture to crops (or vice versa) prevents wild animals from existing. If wild lives are net suffering, this prevention could be a *benefit* – radically changing the calculus.  
  These unacknowledged shifts between "ledgers" (Deaths-Caused, Lives-Created, Lives-Prevented) and currencies (deaths vs. suffering-days) make current comparisons misleading. Cafeterias need a clearer map of tradeoffs.  

  **Methodology (90 Hours, Conceptual Analysis):**  
  *Week 1-2: Define Parameters & Frameworks*  
  *   Define core metrics: "Suffering-day" (1 day of life with suffering intensity X). Establish baseline suffering intensities (low/med/high) for key life stages (e.g., feedlot cow, broiler chicken, field mouse during harvest) using published animal welfare science descriptions.  
  *   Establish system boundaries: Model land-use for 1 million kcal of US-produced beef (pasture + feed crops), chicken (mostly feed crops), wheat (cropland only).  

  *Week 3-4: Build the "Lives-Created" & "Deaths-Caused" Ledgers*  
  *   Calculate average lifespan and suffering-days per animal for cattle and chickens using standard industry data.  
  *   Calculate number of animals required (and total suffering-days) to produce 1 million kcal for beef and chicken systems.  
  *   Quantify field animal deaths (and estimate suffering-days) per million kcal of wheat, corn, and soy using established agricultural models.  

  *Week 5: Build the "Lives-Prevented" Ledger & Integrate*  
  *   Estimate land area difference between systems (beef requires significantly more land than chicken or wheat per kcal).  
  *   Estimate the number of wild mammal/bird "life-equivalents" prevented by using that land for agriculture vs. natural habitat, using ecological carrying capacity data.  
  *   Apply a critical assumption: *If* a typical wild life is net suffering (based on high infant mortality, predation, disease), then preventing that life avoids suffering-days. Model outcomes under different assumptions (Wild Life = Net Suffering / Neutral / Net Positive).  
  *   Combine all three ledgers into a **Total Suffering-Days** model per million kcal for each system.  

  *Week 6: Sensitivity Analysis & Conclusions*  
  *   Test how robust the ranking (Beef vs. Chicken vs. Wheat) is to changes in key assumptions: suffering intensity weights, wild animal suffering value, land-use efficiency estimates.  
  *   Identify which parameters most strongly determine the outcome ("decision drivers").  
  *   Draft findings: Under which sets of assumptions does each system minimize net suffering-days?  

  **Why This Approach is Better:**  
  *   **Beyond Assembling Estimates:** Actively integrates estimates into a novel, comparable framework (suffering-days) across all three ledgers, exposing hidden tradeoffs.  
  *   **Beyond Surveys:** Focuses on ethical consequence mapping, not current preferences.  
  *   **Beyond Prescriptive Arguments:** Provides a transparent tool for evaluating choices based on explicit values (e.g., "How much do you discount existence? How bad is wild suffering?"), rather than arguing for one "right" answer.  

  **Possible Conclusions & Deciding Factors:**  
  1.  **Beef Minimizes Suffering:** If the "existence benefit" for cattle is high AND wild lives are assumed net positive/slightly negative AND chicken suffering is intense.  
  2.  **Chicken Minimizes Suffering:** If chicken suffering is relatively low per day AND land efficiency avoids significant wild suffering prevention.  
  3.  **Plants (Wheat) Minimize Suffering:** If field deaths are low AND/OR preventing wild lives (assumed net suffering) is a major benefit, outweighing farm impacts.  
  **What Decides:** The outcome hinges critically on:  
  *   The relative weight assigned to suffering intensity across species/lifestages.  
  *   The assumed value of bringing a farmed animal into existence (Neutral? Positive? Negative?).  
  *   The assumed net suffering value of a prevented wild life.  

  **Honest Failure Condition & How We Avoid "It Depends":**  
  *Failure:* The model confirms "it depends," offering no clear guidance under plausible assumptions.  
  *Success Condition:* **Identifying decisive thresholds.** Even if no single diet "always wins," the analysis succeeds if it reveals:  
  *   *Which specific value judgments* are pivotal (e.g., "If you believe X about wild suffering, then Y is clearly better").  
  *   *Quantitative breakpoints* (e.g., "If a wild mouse life contains > Z suffering-days equivalent, then wheat wins").  
  This moves beyond vague "it depends" to actionable "it depends on *this*."  

  **Feasibility Adjustments:**  
  *   **Cut:** Deep dive into complex population ethics models justifying existence value. Stick to clearly defined scenarios (Existence = Neutral / Small Benefit / Small Harm).  
  *   **Simplify:** Focus on 1-2 key wild species (e.g., mice, birds) for Lives-Prevented, using published density ranges. Avoid modeling entire ecosystems.  
  *   **Leverage:** Use established agricultural and ecological datasets (FAO, USDA, conservation studies) for land use and mortality rates – no primary data collection needed.  

  **Deliverable & Practical Value:**  
  A **"Decision Framework Tool"** (simple spreadsheet or flowchart) for cafeteria managers or individuals. Users input their core beliefs on:  
  1.  Relative suffering intensity (e.g., "Is a day for a broiler chicken worse than for a feedlot cow?" Low/Med/High).  
  2.  Value of bringing farmed animals into existence (Slight Benefit / Neutral / Slight Harm).  
  3.  Estimated suffering level of typical wild lives (High Suffering / Mixed / More Positive).  
  The tool outputs the recommended choice (Beef/Chicken/Plants) *based on their specific values* and identifies the most critical assumption driving the result. This makes the ethical tradeoffs explicit and actionable, moving beyond oversimplified slogans.  

  This proposal tackles the core confusion you identified, provides a clear methodological path within your constraints, and promises a genuinely useful output even if the absolute "best" diet remains value-dependent. Good luck!
