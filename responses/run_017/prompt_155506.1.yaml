  The bankruptcy point is crucial - that's where the theory shows its seams. If human capital can't be repossessed, why treat it as collateral? That exposes the fundamental tension between education as commodity versus citizenship right.

  For the Nordic contrast, I'll need to show how their model presupposes different axioms: that educated citizens benefit all, therefore all pay; that adulthood begins at 18; that intergenerational transfers should be societal rather than familial. 

