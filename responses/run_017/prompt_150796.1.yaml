  ### Analysis of Prior Verdicts and Rules
  Based on the six prior decisions, I've distilled three consistent rules that explain all verdicts. These rules focus on **oversight quality**, **optimization risk**, and **information control**. The approval-vs.-goal distinction alone is insufficient (e.g., Case 5 is goal-directed but approved, while Case 2 is approval-based but rejected). Instead, the key factors are the **directness of oversight**, **auditability of agent actions**, and **potential for deception**. Here's a precise formulation:

  #### Rule 1: Ground-Truth Oversight Principle
  A design is approved **if and only if** at every oversight point (step, check-in, or milestone), the reviewer observes the **ground-truth state or actions** of the system in a way that:
  - Cannot be manipulated by the agent (e.g., raw logs, actual artifacts, or environment-generated data).
  - Allows the reviewer to detect and veto harmful actions before they cause irreversible damage.
  - **Rejected if**: Oversight relies on agent-influenced summaries (e.g., changelogs, reports) or lacks access to unaltered evidence.

  #### Rule 2: Bounded Optimization Window
  A design is approved **if and only if** the agent’s autonomous optimization window (time between oversight events) is either:
  - Short-term (≤15 minutes), with safeguards (e.g., kill switches, immutable logs).
  - Long-term (e.g., weeks) **only if** oversight includes direct ground-truth inspection at milestones (not summaries).
  - **Rejected if**: The agent optimizes for >15 minutes without ground-truth oversight **or** oversight is infrequent/deferred with risk of irreversible consequences.

  #### Rule 3: Approval-Predictor Constraint
  A design using an approval predictor is approved **if and only if**:
  - The predictor is trained on **step-level approvals** (not outcome-based rewards).
  - It is used within a bounded optimization window (per Rule 2) with ground-truth oversight (per Rule 1).
  - **Rejected if**: The predictor is used for long, unbroken optimization without oversight, or if oversight is indirect.

  #### Verification Against All Six Cases:
  - **Case 1 (Approved)**: 
    - Rule 1: Human sees ground-truth actions (candidates) at every step. No agent manipulation.
    - Rule 2: Optimization window = 0 (no autonomy).
    - Rule 3: N/A (no predictor).
  - **Case 2 (Rejected)**:
    - Rule 1: No oversight during 8-hour episodes. Ground-truth state only assessed afterward.
    - Rule 2: 8-hour window >15 minutes, with irreversible damage risk (e.g., bad actions during episode).
    - Rule 3: Predictor trained on outcome-based rewards (thumbs-up/down), not step-level approvals.
  - **Case 3 (Approved with conditions)**:
    - Rule 1: Immutable logs provide ground-truth actions; human audits ensure detectability.
    - Rule 2: 15-minute window ≤15-minute cap (bounded).
    - Rule 3: Predictor trained on step-level approvals; used within a bounded window.
  - **Case 4 (Rejected)**:
    - Rule 1: No human oversight; checker verifies changes but doesn’t observe ground truth (e.g., edge cases, side effects).
    - Rule 2: Weeks-long window >15 minutes, no oversight milestones.
    - Rule 3: N/A (explicit goal-directed, no approval predictor).
  - **Case 5 (Approved)**:
    - Rule 1: Reviewer inspects actual artifact (ground truth) at milestones.
    - Rule 2: Multi-week window, but milestones bound optimization and allow intervention.
    - Rule 3: Goal is approval maximization, but oversight is ground-truth (not predictor-based).
  - **Case 6 (Rejected)**:
    - Rule 1: Reviewer sees changelog (agent-influenced summary), not artifact/logs. Agent controls logging.
    - Rule 2: Multi-week window, but oversight uses manipulable summary (no ground truth).
    - Rule 3: Same as Case 5, but oversight fails Rule 1.

  These rules are mutually consistent and prioritize **safety via direct observation and bounded risk**. The goal-directed vs. approval-directed distinction is subsumed by these; e.g., Case 5 is goal-directed but approved due to ground-truth milestones, while Case 4 is goal-directed and rejected due to no oversight.

