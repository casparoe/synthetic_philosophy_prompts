  Level 1: In the case of the automated pipeline promoting a new checkpoint at 3am without human review, causing harm (case 4), can we identify a specific person or group who is morally responsible for the harm?
    - Yes, the engineers who designed the pipeline without a human review step are responsible. (Go to level 2)
    - No, because the system acted autonomously and no one could have intervened at that moment. (Go to level 3)

  Level 2 (from yes): Consider the case where the harm resulted from a chain of model calls with human approval only at the last step (case 3). Is the human who approved the last step morally responsible for the harm?
    - Yes, because they had the opportunity to prevent it and didn't do their duty. (Leaf 1: No gap at all - individuals can be responsible for negligence)
    - No, because the system design did not provide them with the necessary visibility or control. (Leaf 3: Design defect - we must engineer meaningful human control)

  Level 3 (from no at level 1): Consider the case where the harm was due to a known failure rate of 0.3% (case 1). When harm occurs to a specific user, does the company deserve blame for shipping the feature with this known risk?
    - Yes, because they knew some users would be harmed. (Leaf 2: Diffused responsibility - the collective must bear it)
    - No, because while the aggregate harm was foreseeable, this specific harm was not, and no individual could have prevented it. (Go to level 4)

  Level 4 (from no at level 3): In the case where the harm occurred and we cannot explain why the system did it (case 9), does this opacity matter for assigning moral responsibility?
    - Yes, because without understanding, we can't determine who is responsible. (Leaf 6: Redistribute roles / accept as cost - the gap is real and we may need to accept it or adjust)
    - No, the opacity only matters for prevention, not for blame. (Leaf 5: Answer and repair - focus on who must answer and fix it)

  This tree only covers 4 cases and 4 leaves. We are missing some leaves and cases.

