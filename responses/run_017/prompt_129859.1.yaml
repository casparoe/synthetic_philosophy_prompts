prompt: |-
  I have been trying to reconstruct Galen Strawson's so-called Basic Argument against moral responsibility in a form I could actually put pressure on, and my reconstruction now bothers me for a reason I can't localize: it seems to reach well beyond moral responsibility, and I can't tell whether that is a feature of the argument or a symptom that I have built something unsound. I'd like a diagnosis of the chain below, and I'd rather be told what each available repair costs than which one to make.

  The chain, as I have it:

  (1) Provenance condition. A person is morally responsible for an action in the desert-involving sense only if they are responsible for being the kind of person who would do it — that is, for the character, motives, and standards that actually explain why the action issued from them. Praising or blaming someone for what their character produced while excusing them for the character seems like stopping one step too early.

  (2) Only-by-making condition. One can be responsible for being a certain way only by having intentionally brought it about that one is that way, in an act of self-formation whose outcome was under one's control. Causing it, or being caused to cause it, or growing into it, is not enough: those are things that happen to a person, not things they are answerable for.

  (3) Regress. Any act of self-formation is performed in light of motives, principles, and standards the agent already has. To be responsible for what that act makes of them, they must already be responsible for those prior motives — which by (1) and (2) requires a further act of self-formation, and so on without end.

  (4) Therefore no one is ever morally responsible in the sense specified by (1), since a series with no first member cannot be got through by a finite agent, and adding indeterminism does not help but only inserts chance where control was wanted.

  So far this is, I take it, the argument as intended. My discomfort begins when I generalize it.

  (5) Nothing in (1) through (4) appears to depend on the word 'moral'. The same structure runs for any standing that is supposed to depend on how its subject came to be the way it is: epistemic justification (you can be justified in a belief only if you are responsible for the reliability of the faculties that produced it), credit for achievement, the bindingness of a promise, ownership of what your labour produced, even the plain fact that an event was *your action* rather than something that merely happened in you. If the argument is sound, it seems to show that no belief is ever justified, no achievement ever creditable, no promise ever binding, and no event ever really an action.

  (6) And it turns on itself. I can be responsible for asserting this argument only if I chose the standards of good reasoning by which I judge it, which by (2) and (3) requires a prior choice, and so on.

  (7) But a sound argument presumably cannot establish that there are no agents, no reasons, and no justified assertions, this one included. So something in (1) through (4) is wrong.

  Before I tell you where I think the trouble is, consider a case I invented to test the chain, which I call 'the long way round.'

  Dana at twenty is impulsive, vain, and evasive — a character she did not choose and could not have chosen. Over the next forty years she deliberately rebuilds herself: she arranges circumstances, rehearses motives, uses the motives available at each stage to alter the motives that will be available at the next, exploits events she cannot fully predict, and at every stage consciously endorses the direction of change, including the direction she endorsed at earlier stages. At sixty she performs a costly act of honesty that the twenty-year-old Dana would not have performed, that she performs for the reasons she spent those decades installing, and that she calmly endorses at the moment of acting and afterwards. There is no single act of self-creation anywhere in the sequence, and no first link she laid; there is only a long chain, each link forged with the resources of its predecessors, all of them now and then endorsed.

  What I want to know:

  Where does the chain go wrong, if it does? Name the step. Explain why that step looked sound — what makes it plausible enough to have been accepted without argument. And price the alternatives: what is lost by rejecting (1), by rejecting (2), by rewriting the regress in (3) so that it demands only that each link be properly the agent's own rather than that the series have a first member, and what is lost by keeping (1) through (4) intact and simply accepting the generalizations in (5) and (6).

  Tell me in particular what work the Dana case does. Does she satisfy the provenance condition in (1) while failing the only-by-making condition in (2), and if so, does that show that (2) is doing all the real work — or does it show that (4)'s conclusion is best read as being about a maximal, self-creation-involving kind of responsibility, leaving ordinary moral responsibility untouched? A friend suggested that (5) can be blocked by dividing standings into ones that are source-involving and ones that are merely state-involving: desert, credit for achievement, and the authorship of action on one side; epistemic justification and the bindingness of promises on the other. I could not get her to say what makes desert source-involving if justification need not be, and I suspect the distinction is doing less than it appears to.

  If I must state my own attachments: I am most attached to (1), since excusing a person for the character from which the action flowed is precisely the move I want to block, and least attached to (2), which nonetheless strikes me as close to analytic. I would rather keep (1) and (4) than keep (5)'s generalizations, but I would like to know what I am paying for that preference rather than merely having it confirmed.
reasoning: |-
  Hmm, the user is grappling with Galen Strawson's Basic Argument against moral responsibility and has reconstructed it in a way that seems to extend beyond moral responsibility. They've noticed their reconstruction leads to absurd conclusions like undermining all justification, agency, and action itself. That's a serious philosophical problem.

  The user presents a clear chain of reasoning from (1) to (7), with Dana's case as a test scenario. They're troubled because the argument appears to self-destruct - if valid, it would invalidate itself and all reasoning. That's a classic sign something's wrong in the premises.

  Looking at their concerns: They like (1) (provenance condition) because it blocks excusing people for actions stemming from unchosen character. They're wary of (2) (only-by-making) though it seems tautological. Dana's case is clever - she transforms herself gradually without a "first link," challenging (2)'s requirement for deliberate self-creation.

  The key issues I see:
  - (2) is doing the heavy lifting. Its demand for intentional self-creation is what generates the regress. But is this necessary for responsibility? Compatibilists would say no - we can be responsible for actions flowing from our character even if we didn't choose that character originally.
  - The "only-by-making" condition in (2) feels analytic but might be question-begging. It assumes responsibility requires total self-creation, which is exactly what's disputed.
  - Dana's case suggests responsibility can be earned gradually. She meets (1) through cumulative endorsement, but violates (2) by lacking an initial self-forming act. This exposes (2) as the vulnerable premise.

  Repair options:
  - Rejecting (1) would let us praise/blame actions without tracing character origins. But that abandons deep responsibility - the very thing the user wants to preserve. Cost: superficial accountability.
  - Rejecting (2) allows responsibility without self-creation. We could hold people responsible for cultivated traits. Cost: gives up ultimate responsibility, but keeps everyday responsibility intact.
  - Modifying (3) to allow regresses without first links (via gradual ownership) saves Dana but requires explaining how responsibility emerges from non-responsible beginnings. Cost: accepts non-foundational responsibility.
  - Embracing (5)-(7) leads to global skepticism - everything collapses. Unacceptable for practical reasons.

  The user's friend's distinction between source-involving vs state-involving standings doesn't hold up. Why is desert source-involving but justification isn't? Both seem to require tracing origins. That just relabels the problem.

  Ultimately, (2) is the culprit. It conflates responsibility with self-causation - an impossible standard. Dana shows responsibility can be about ongoing ownership rather than ultimate origins. Rejecting (2) preserves what matters in (1) while avoiding absurdity. The cost is accepting that responsibility isn't "metaphysically ultimate" - but it remains socially and morally vital.
answer: |-
  Your reconstruction is perceptive, and the discomfort you feel is well-founded: Strawson's argument *does* generalize catastrophically, and the Dana case exposes the core tension. The flaw lies in **premise (2)**, the "Only-by-making condition." Below is a step-by-step diagnosis, an explanation of why (2) seemed plausible, the "costs" of each repair option, and the role of the Dana case.

  ---

  ### **1. Where the Chain Goes Wrong: Premise (2)**
  - **Step at fault**: (2) "One can be responsible for being a certain way *only by having intentionally brought it about*..."  
  - **Why it fails**: This premise demands **total self-causation** for responsibility. It conflates *being responsible* (in the sense of being a legitimate target of reactive attitudes like praise/blame) with *being the ultimate cause of oneself*. But responsibility is a normative status grounded in *ownership* of one's character and actions, not metaphysical self-creation. Dana's case shows ownership can be cultivated gradually through conscious endorsement and effort, even without a "first" self-forming act.  
  - **Why it looked sound**: (2) appears analytic because we intuitively link responsibility to control. If you didn't *choose* to be dishonest, how can you *deserve* blame for dishonesty? This taps into a deep libertarian intuition: responsibility requires being an "unmoved mover." Strawson exploits this to make the regress inescapable.  

  ---

  ### **2. Repair Options and Their Costs**  
  | **Option** | **What It Rejects/Modifies** | **Costs** | **What It Preserves** |
  |------------|------------------------------|----------|----------------------|
  | **Reject (1)**<br>(Provenance) | Denies that responsibility for an action requires responsibility for the character that produced it. | **High cost:** Undermines deep moral assessment. Excuses manipulation cases (e.g., a brainwashed assassin). Allows praising/blaming people for actions *alien* to their endorsed self (e.g., an outburst from a normally gentle person with unmanaged PTSD). | Saves everyday responsibility practices; blocks generalization to (5)-(6). |
  | **Reject (2)**<br>(Only-by-making) | Denies that responsibility for character requires deliberate self-creation. Allows responsibility via *endorsement, identification, or cultivation* (e.g., Dana). | **Moderate cost:** Abandons "ultimacy" (being the *first* cause). Compatibilists accept this: responsibility is about acting from your *own* reasons, not creating yourself *ex nihilo*. Strawson would call this "punishability without desert." | Preserves (1)'s depth and blocks the regress. Dana is responsible; generalization to (5)-(6) is blocked. |
  | **Modify (3)**<br>(Regress) | Rewrite to demand only that *each link* is "properly the agent's own" (e.g., via endorsement or non-alienation), not that the series has a first member. | **Cost:** Risks circularity. "Properly own" needs definition (e.g., Frankfurt-style identification). May allow responsibility for manipulated traits if endorsed (e.g., a cult member who "identifies" with implanted values). | Saves Dana; blocks generalization. Keeps (1) and (2) intact but reinterprets (2) weakly. |
  | **Keep (1)-(4) Intact**<br>(Accept generalization) | Embraces (5)-(7): no responsibility, agency, or justification exists. | **Catastrophic cost:** Total skepticism. Undermines all normativity (ethics, epistemology, practical reason). Self-defeating (as in (6)). Unlivable in practice. | Nothing—this is a *reductio ad absurdum* proving the argument unsound. |

  ---

  ### **3. The Dana Case: What It Reveals**  
  - Dana **satisfies (1)** (provenance): Her honest act flows from a character she consciously shaped. Blaming her for dishonesty would be incoherent; she *owns* her motives.  
  - Dana **violates (2)** (only-by-making): She had no initial self-formation act. Her character was built incrementally using "given" motives (vanity, impulsivity) as tools.  
  - **Diagnostic role**: Dana shows that (2) is **unnecessarily strong**. Ownership can emerge from *cumulative rational endorsement* without a foundational act. This exposes (2) as the argument's engine: it creates the regress by demanding self-causation, not responsibility.  
  - **Does (4) target "maximal" responsibility?** Only in Strawson's view. Compatibilists argue ordinary responsibility (desert-involving praise/blame) survives rejecting (2). Dana *is* responsible in the ordinary sense—just not in Strawson's ultimacy-demanding sense.  

  ---

  ### **4. Your Friend's Proposal (Source- vs. State-Involving)**
  - **The distinction**: "Source-involving" standings (desert, credit) require tracing origins to the agent; "state-involving" (justification, promises) depend only on current states (e.g., a belief is justified if formed reliably, regardless of how you *became* reliable).  
  - **Why it fails**:  
    - **Epistemic justification** *is* source-involving: If your perceptual faculties were implanted by a deceptive demon, your beliefs aren't justified—even if reliable *now*.  
    - **Promises** rely on historical acts (you must have *voluntarily committed*).  
  - **Cost**: This distinction is *ad hoc* to save (5). If (1)-(4) generalize, it collapses. Justification and promises *do* depend on provenance.  

  ---

  ### **5. Why Your Attachments Are Defensible (But Costly)**  
  - **Keeping (1) and (4)**: You can preserve (1) by rejecting (2). This maintains deep responsibility (blocking character-level excuses) while avoiding generalization. **Cost:** You lose ultimacy (Strawson's "true desert"). This is acceptable if you adopt a compatibilist view of responsibility (e.g., Fischer, Dennett).  
  - **Rejecting (5)**: The generalization *is* valid—**if** (2) is true. But since (2) is flawed, (5) is unsupported. Dana shows responsibility is possible without self-creation, so epistemic justification/promises *can* also be grounded in cultivated traits.  

  ---

  ### **Conclusion**
  The fatal flaw is **premise (2)**. It demands an impossible standard of self-creation, mistaking a *sufficient* condition (intentional self-formation *would* confer responsibility) for a *necessary* one. **Rejecting (2)** is the least costly repair: it preserves the depth of (1), blocks the regress and generalization, and accommodates Dana's responsibility. The price is abandoning the libertarian dream of "ultimate responsibility," but this is a price most contemporary moral theories pay. Strawson's argument succeeds only against a narrow, self-defeating notion of desert—not against responsibility itself. If you keep (1), insist that *ownership* (via endorsement, reasons-responsiveness, or cultivation) satisfies the provenance condition, not self-creation. Dana, not a prime mover, is the paradigm.
