prompt: |-
  My second novel is about a woman named Ines who's a reconstruction — a scanned mind running on hardware that has nothing biological in it — and about the engineer who maintains her and the neuroscientist who thinks the engineer is kidding himself. The setup I keep coming back to is that old Hofstadter thing, a careenium full of little magnetic symms careening around and clumping into symmballs that seem to stand for stuff outside, and the question of who shoves whom around in there; but my cases are my own and my writing group says the two characters just talk past each other for forty pages, which may be realistic and is definitly not dramatic, so before I rewrite chapter 11 I want the actual spec.

  So: give me the desiderata — what a theory of whether and how the symbol level pushes the substrate around would have to deliver to count as having answered the question, with the case or consideration behind each requirement, and a note on which are non-negotiable and which are just what one camp happens to want. The situations from the book it has to handle: the scene where the engineers apply a relabelling cipher to the mapping between physical patterns and symbols so that every symmball now means something different while her behaviour doesn't change at all (does she still believe what she believed, and is the symbol level still doing work); the scene where two reconstructions are timesharing one substrate, with individual symms doing double duty, so that a single physical event is one symbol-event in Ines and a different symbol-event in the other person; the intervention asymmetry the engineer relies on, where editing her "risk-aversion" at the code level predicts her behaviour, a micro-level tweak that leaves the symbol pattern intact changes nothing downstream, and one that breaks the pattern changes everything; the prosthesis subplot, where chunks of substrate are swapped for physically different but functionally equivalent material until none of the original is left; the counterfactual the lawyer asks about at the inquest, that if she had believed the bridge was safe she would have driven onto it, said about a moment whose microphysics was already fixed, so what on earth makes it true; the blinking wall in the lab that an enthusiast insists is a mind, since apparently anything implements anything under some mapping and the theory needs somewhere to say no; the stretch where Ines's symbol for herself degrades while she keeps functioning for a while, which is a level whose content is about the very system that contains it; and the line she says about keeping the promise because she promised, which the neuroscientist answers with "the symms shoved the symms." It also has to stay consistent with the micro-level causal story being complete — no new forces, nothing that would embarass a physicist — and it has to respect some distinctions rather than collapse them: being causally efficacious versus merely being the best description available, versus being real, versus being indispensable for explanation and intervention, and it shouldn't quietly turn "the symbol level pushes" into "the symbol level predicts."

  The part I want most is where the list fights itself: if some subset of the requirements can't be jointly satisfied — non-triviality about which mappings count, plus closure of the micro story, plus the symbol level doing something over and above the micro level — say so plainly, because if the desiderata themselves force a tradeoff then that's the real shape of the argument my characters are having and I can let one of them be wrong in an interesting way instead of both being foggy. Tell me which single requirement knocks out the most candidate answers, and then do a short scorecard, a line or two each, on the obvious contenders: the symbol level is epiphenomenal, a token-identity or reductionist story, an interventionist or autonomy-based account, a real-patterns or stance-based one, a mechanistic account of computation, and straight emergent downward causation. No reading lists or citations please — I draft on the train with no signal and I can't chase anything down anyway.
reasoning: |-
  Okay, the user is writing a novel about a reconstructed human mind named Ines, and they're grappling with philosophical questions about mind and substrate. The core issue is whether the symbolic level genuinely influences the physical substrate or if it's just an illusion. Their writing group pointed out that two characters just talk past each other for forty pages, which isn't dramatic. So they need a clear specification of what a theory would need to explain to resolve this debate.

  The user provided several scenarios from their novel that the theory must handle. These include a relabeling cipher where symbols change meaning but behavior stays the same, timesharing substrate between two reconstructions, intervention asymmetry where micro-tweaks affect behavior only if they break symbolic patterns, substrate replacement like the Ship of Theseus, counterfactuals about fixed microphysics, the "blinking wall" problem where any physical system could be interpreted as a mind, degradation of Ines's self-symbol while still functioning, and the line about keeping promises because she promised. The theory also needs to respect micro-level causal completeness without introducing new forces, and avoid collapsing distinctions like causal efficacy vs. predictive power.

  The user wants the desiderata to conflict explicitly, to reveal where tradeoffs are necessary. They also want to know which requirement is most problematic and a scorecard of existing philosophical positions. 

  First, I'll list all the requirements from the scenarios. Each needs a case and note on negotiability. The non-negotiables are micro-level causal closure, the need for symbol-level efficacy (not just prediction), and avoiding trivial mappings. The others might be flexible depending on the theory.

  The blinking wall scenario requires non-trivial mapping to avoid panpsychism. The prosthesis subplot needs continuity through substrate changes. The relabeling cipher raises questions about belief vs. behavior. Timesharing requires one physical event to be two symbol events. Intervention asymmetry shows that symbolic patterns matter. Counterfactuals must work despite fixed microphysics. Self-symbol degradation involves self-referential content. The promise line ties symbolic reasons to actions. Micro-level closure is essential, as is distinguishing efficacy from prediction.

  Now, looking for conflicts. The biggest tension is between micro-level causal closure and genuine symbol-level efficacy. If the micro level is causally closed, how can symbols have independent influence? Non-trivial mappings also clash with micro closure, as avoiding panpsychism requires criteria that might not be micro-based. The prosthesis subplot's continuity might conflict with non-trivial mappings if functional equivalence isn't enough.

  The most problematic requirement is non-trivial mappings (from the blinking wall). It's hard to define without being arbitrary, and it conflicts with micro closure since any physical system can be interpreted as having symbols under some mapping. This knocks out many theories that rely on functionalism.

  For the scorecard:
  - Epiphenomenalism: Symbols don't cause anything. Fails efficacy and promise line.
  - Token identity: Symbols are identical to physical states. Struggles with timesharing and relabeling.
  - Interventionism: Symbols are causal variables. Handles asymmetry well but may collapse to prediction.
  - Real patterns: Symbols are patterns stable at a scale. Good for prosthesis and continuity, but mappings can be trivial.
  - Mechanistic computation: Computation as causal structure. Works for timesharing and relabeling, but may not explain self-reference.
  - Downward causation: Symbols exert new forces. Violates micro closure, so fails that hard.

  The core conflict is between closure and efficacy. Characters might represent different positions: the engineer as an interventionist, the neuroscientist as a reductionist. The tradeoffs make their debate substantive. Highlighting where theories fail (like trivial mappings for real patterns) adds drama. The user can show each character's view as partially right but flawed, making their conflict more engaging.
answer: |-
  Here are the desiderata for your theory of "symbol-level pushing," structured for maximal dramatic tension. The core conflict lies in **Requirement 5 (Non-Trivial Implementation)** vs. **Requirement 1 (Micro Closure)** and **Requirement 2 (Symbol Efficacy)**. These create an irreconcilable tension.

  ### Desiderata (What the Theory Must Deliver)
  1.  **Micro-Level Causal Closure:**
      *   *Case:* The neuroscientist's core argument ("the symms shoved the symms"), the inquest counterfactual, the engineer's micro-level tweaks.
      *   *Requirement:* All causal power ultimately resides in and is fully accounted for by the microphysical substrate (symms, magnetic fields). No new forces or "magic dust" allowed. The physicist must be unembarrassed.
      *   *Non-Negotiable:* Yes. Violating this breaks fundamental physics as understood in your world.

  2.  **Genuine Symbol-Level Causal Efficacy ("Pushing"):**
      *   *Case:* Ines keeping her promise "because she promised" (symbolic reason as cause), the intervention asymmetry (breaking the pattern matters), the self-symbol degradation plot (symbolic self-reference impacting function).
      *   *Requirement:* The symbol level (meanings, beliefs, patterns) must be *doing work* in the causal chain, not just being a description. It must have *explanatory power beyond prediction* and be a locus of *effective intervention*. It must *make a difference* that wouldn't occur if only micro-properties were considered.
      *   *Non-Negotiable:* For the engineer & the dramatic core. Collapsing this into mere prediction (Requirement 9) kills the story's tension.

  3.  **Distinction Preservation:**
      *   *Case:* The entire debate between the engineer (efficacy) and neuroscientist (epiphenomenon/illusion).
      *   *Requirement:* Must clearly distinguish: (a) Causal Efficacy, (b) Being the Best/Only Description, (c) Ontological Reality, (d) Explanatory/Intervention Indispensability. The theory must clarify *how* (a) relates to (c) and (d) without conflating them. It must prevent "predicts" from silently replacing "pushes".
      *   *Non-Negotiable:* Yes. This is the heart of the philosophical conflict.

  4.  **Implementation Independence (Continuity of Identity/Function):**
      *   *Case:* The prosthesis subplot (Ship of Theseus). Relabelling cipher (same behavior, different meaning?).
      *   *Requirement:* The mind/identity/functional state persists through changes in the *specific* physical substrate, as long as the relevant abstract functional/computational structure is preserved. What matters is the pattern, not the specific stuff.
      *   *Negotiable:* Largely non-negotiable for the engineer's view & the premise of reconstructions. The neuroscientist might challenge this.

  5.  **Non-Trivial Implementation (Mapping Matters):**
      *   *Case:* The blinking wall "mind" (panpsychism/triviality problem). The timesharing scene (one micro-event, two symbol-events).
      *   *Requirement:* Not every arbitrary physical system + arbitrary mapping counts as implementing a specific mind/symbol system. There must be criteria (e.g., causal structure, counterfactual dependence, evolutionary/design history, stability) that make *some* mappings physically relevant/non-arbitrary and others not. The theory must explain why the wall isn't a mind but Ines is.
      *   *Non-Negotiable:* Yes. Without this, the concept of "implementation" becomes meaningless. This is the **Killer Requirement**.

  6.  **Symbolic Content Causation:**
      *   *Case:* Ines keeping the promise "because she promised". The self-symbol (content about the system itself) degradation impacting function. Does the *meaning* of the symmball (post-relabeling) or the *fact* of the promise cause behavior?
      *   *Requirement:* The theory must account for how the *semantic content* of symbols (beliefs, intentions, self-representations) can play a genuine causal role, not just the syntactic/physical pattern.
      *   *Negotiable:* Highly desired by the engineer, likely rejected by the neuroscientist. Crucial for the promise scene's thematic weight.

  7.  **Counterfactual Robustness:**
      *   *Case:* The lawyer's counterfactual at the inquest ("If she believed X, she would have done Y" about a fixed micro-state).
      *   *Requirement:* The theory must ground the truth of counterfactual claims about mental states (beliefs, desires) and their behavioral consequences, even when the actual microphysical state is fixed. How can "she would have" be true if the microphysics was determined?
      *   *Non-Negotiable:* For realism and plot (the inquest).

  8.  **Multiplicity/Overdetermination Handling:**
      *   *Case:* Timesharing substrate (one micro-event, two symbol-events). Relabelling cipher (same physical pattern, different meaning).
      *   *Requirement:* The theory must accommodate cases where multiple symbol-level descriptions (or interpretations) can be causally relevant *simultaneously* for the *same* microphysical event/state, without violating micro closure. It must explain how Ines's symmball and the other reconstruction's symmball both "happen" via the same micro-event.
      *   *Negotiable:* Necessary for the timesharing plot device.

  9.  **Avoid Collapse to Prediction:**
      *   *Case:* The neuroscientist's reductionism. The engineer's need for efficacy.
      *   *Requirement:* The symbol level must be more than just a predictive shorthand. Its explanatory power must stem from capturing *causal structure* or *dependencies* that micro descriptions obscure, not just statistical regularity.
      *   *Non-Negotiable:* Directly tied to Requirement 2 & 3. Collapsing to prediction concedes to the neuroscientist.

  ### The Fatal Conflict & The Killer Requirement
  *   **The Core Tension:** Requirements **1 (Micro Closure)** and **5 (Non-Trivial Implementation)** are fundamentally at odds with **2 (Symbol Efficacy)** and **6 (Content Causation)** under **3 (Distinction Preservation)**. How can symbols *do work* if physics is closed? How can *meaning* push if physics is non-semantic? **Requirement 5 (Non-Trivial Implementation)** is the biggest blocker. Defining a non-arbitrary mapping that is both physically grounded *and* makes semantic content causally potent, without violating micro closure or collapsing into prediction, is incredibly difficult. Most attempts either trivialize implementation (failing 5) or render the symbol level epiphenomenal/predictive (failing 2, 6, 9).
  *   **Why Requirement 5 Kills Most Theories:** It demands a criterion for "real implementation" that isn't just functional equivalence (lest the blinking wall counts) *nor* brute-physical (lest the prosthesis fails), and must emerge from microphysics (Requirement 1) while grounding symbol efficacy. This is the philosopher's stone. It forces trade-offs between closure, efficacy, and avoiding panpsychism/triviality.

  ### Scorecard on Contenders (1-2 Lines Each)
  1.  **Symbol Level Epiphenomenal:** *Fails 2, 6, 9.* Symbols are steam whistle, not piston. Neuroscientist wins, engineer deluded. Simple, respects closure (1), but kills drama and struggles with 4/7/8.
  2.  **Token Identity/Reductionism:** *Fails 2, 6, 8, 9 (often).* "Symbol X" *just is* micro-state Y. Struggles massively with timesharing (8), prosthesis continuity (4), relabeling (meaning change?), and collapses efficacy to micro (2/6/9). Neuroscientist's comfort zone.
  3.  **Interventionist Account:** *Partial win on 2, 3, 7, 9 (if careful).* Symbols are causal variables in a higher-level model. Explains asymmetry, counterfactuals. **Struggles fatally with 5 (Blinking Wall)** - what makes the *intervention* non-arbitrary? Risks collapsing to prediction (9) if not tied to robust causal structure. Engineer's best hope, but mapping criteria (5) is Achilles heel.
  4.  **Real Patterns / Stance-Based:** *Win on 4, maybe 8.* Symbols are real patterns stable/useful at a certain scale. Explains prosthesis, maybe timesharing. **Fails 2, 5, 6 catastrophically.** Efficacy is perspectival/usefulness, not inherent pushing. Blinking Wall (5) is a "mind" from *some* stance. Meaning (6) isn't causal. Collapses hard to prediction/usefulness (9). Neuroscientist sees it as sophisticated epiphenomenalism.
  5.  **Mechanistic Computation:** *Win on 1, 4, 8.* Computation is causal structure. Prosthesis, timesharing handled. Relabeling: syntax changes semantics, but causal role identical? **Struggles with 2, 5, 6.** Is executing syntax "pushing"? Does it explain *content* causation (6)? Blinking Wall (5) might implement *some* computation arbitrarily. Efficacy (2) might be syntactic, not semantic. Engineer-friendly but may not satisfy his need for *meaning*.
  6.  **Straight Downward Causation:** *Win on 2, 6.* Symbols exert new forces. **Fails 1 utterly (embarrasses physicist).** Violates micro closure. Blinking Wall (5) still a problem unless new force is selective. Engineer's fantasy, neuroscientist's strawman. Not viable.

  **The Dramatic Shape:** The trade-off is stark: Sacrifice **genuine symbol-level pushing (2, 6)** to preserve **micro closure (1)** and **non-trivial implementation (5)** (Neuroscientist wins). Or, sacrifice a **strict micro closure / non-arbitrary mapping** to preserve **symbol efficacy/content causation** (Engineer might find a loophole, but risks mysterianism or trivializing minds). **Interventionism** offers the best battleground: the engineer clings to causal variables and counterfactual dependence as *real work*, while the neuroscientist hammers on the arbitrariness of the chosen mapping/model (Blinking Wall) and the completeness of microphysics. The characters *aren't* just talking past each other; they're wrestling with a genuine, likely unresolvable, metaphysical tension inherent in the concept of artificial minds. Let the engineer be wrong about *how* it works (maybe it's mechanistic computation, not pushing) but right that the symbol level *matters* uniquely (interventionism), while the neuroscientist is right about physics (closure) but wrong that the symbol level is *merely* descriptive or epiphenomenal (it's causally structural via implementation). Their conflict *is* the trade-off.
