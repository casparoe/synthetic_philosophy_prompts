answer: |-
  Your request cuts to the heart of ontology's relevance to scientific practice. The tension you identify with laws under presentism is indeed where the difference bites hardest, and radiometric dating—a cornerstone of geochronology you've likely relied on—provides the ideal concrete case. Let's break it down rigorously, avoiding armchair speculation and focusing on the inferential structure you'd recognize from reconstructing rock histories.

  ### The Case: Validating a Decay Constant for Radiometric Dating
  **Scenario:** You measure the present isotopic ratios (e.g., ²⁰⁶Pb/²³⁸U) in a zircon crystal to date its formation. The calculation requires the decay constant λ for ²³⁸U (λ ≈ 1.55125 × 10⁻¹⁰ yr⁻¹). This constant isn't measured *directly* in the present; it's determined from *historical* consistency across independent dating methods and geological contexts (e.g., cross-calibration with U-Pb, Ar-Ar, orbital tuning). Crucially, λ's constancy is inferred from its successful application to *past* events.  

  #### Step-by-Step Inference Under Eternalism
  1. **Ontology:** Past, present, and future states equally exist.  
  2. **Law Status:** The decay "law" (dN/dt = -λN) is an empirical generalization over real, existing events (e.g., decay events in lab samples over decades, consistency with ancient volcanic ash layers).  
  3. **Validation:** λ's constancy is established by comparing inferred dates from multiple samples/contexts *that exist in the spacetime manifold*. Discordance (e.g., a zircon yielding 500 Ma via U-Pb but 300 Ma via fission tracks) signals methodological error or geological complexity (e.g., reheating), not ontological doubt.  
  4. **Inferential Circle?** None. Laws summarize real patterns in the block universe. Using λ to date the zircon leverages a confirmed regularity across existing time-slices.  

  #### Step-by-Step Inference Under Presentism
  1. **Ontology:** Only the present state exists. Past decay events, lab measurements, or zircons no longer exist.  
  2. **Law Status:** The decay "law" cannot be an empirical generalization—there are no past events to generalize *about*. Presentists must treat λ as a *brute, timeless* physical necessity (e.g., a primitive law of nature).  
  3. **Validation Problem:** To "validate" λ, you need to check it against past events. But under presentism:  
     - The *past events themselves* don't exist to be checked.  
     - Present "traces" (e.g., current Pb/U ratios) are all that exist.  
     - Using λ to interpret these traces *assumes* the very law you're trying to validate.  
  4. **Inferential Circle:** The circularity is inescapable:  
     - **Premise:** λ is constant (brute fact).  
     - **Inference:** Use λ + current ratios to calculate the age (t = ln(N₀/N)/λ).  
     - **"Validation":** Consistency with other methods (e.g., Ar-Ar dates) relies on *also* assuming brute laws for those methods. If results agree, you claim "validation." But this agreement depends on presupposing the laws used in *all* methods. If they disagree, you invoke "geological noise" (e.g., open systems)—but this relies on auxiliary laws (e.g., diffusion rates) that also lack empirical grounding in the past.  
     - **The Bite:** You cannot empirically distinguish between:  
       - (a) λ being constant, with discordance due to geological factors.  
       - (b) λ varying over time, but hidden by the circularity of validation.  
       Under presentism, (b) is epistemically possible in a way it isn't under eternalism.  

  ### Why This Meets Your Constraints
  1. **Not Relativity/Truthmakers:**  
     - Relativity is irrelevant: decay constants are invariant in nuclear physics.  
     - Truthmakers are insufficient: Present traces (Pb/U ratios) + brute laws "solve" truthmaking but create the circularity problem.  
  2. **Real Work Done:**  
     - **Description:** Under presentism, λ is a mysterious brute necessity; under eternalism, it's a summary of real events.  
     - **Inference:** Validation of λ requires circular reasoning under presentism but not eternalism.  
     - **Cost:** Presentism must accept that core scientific laws (e.g., decay, gravitation) *cannot* be empirically validated as descriptions of history—only posited as axiomatic. This conflicts with actual geochronology practice, where λ is *calibrated* against historical data (e.g., concordia diagrams).  
  3. **Scientific, Not Armchair:**  
     - This mirrors your work: Reconstructing basin subsidence from present seismic data requires assuming constancy of physical laws (e.g., rock elasticity). If those laws couldn't be grounded in past events, your uncertainty margins would balloon.  

  ### The Least Costly Presentist Reply (and Its Cost)
  **The Reply:** Laws like λ are *timeless, primitive necessities*—not generalizations. Science discovers them *in the present* via mathematical symmetries or fundamental theories (e.g., quantum field theory). Consistency across present traces (e.g., multiple radiometric clocks in one rock) confirms their applicability, not their empirical origin.  
  **The Cost:**  
  - **Explanatory Loss:** You lose the ability to explain *why* λ is constant (e.g., "because all observed decays over 10¹⁷ years show it"). The law becomes a "black box" with no ontological anchor beyond present phenomena.  
  - **Uncertainty:** You cannot rule out that laws "drift" over time, since validation is circular. In practice, geophysicists *do* rule this out (e.g., assuming constant λ for Hadean zircons). Presentism makes this a leap of faith.  
  - **Inferential Weakness:** Under eternalism, inconsistent dates imply geological processes; under presentism, they *could* imply law variability—but you have no way to test this, forcing dogmatism.  

  ### Why This Is the Hardest Bite
  In your work, the past's reality wasn't hypothetical—it was *measured* via laws validated against *themselves* across deep time. Presentism severs this loop by denying the past's existence, turning laws from empirical summaries into metaphysical postulates. The circularity isn't just epistemological; it's ontological. When you used decay constants to date Proterozoic orogens, you relied on the reality of the events that calibrated those constants—events absent in presentism.  

  ### If Laws Aren't the Focus: The Alternative Case
  If the law-focused argument feels overintellectualized, consider **entropy and irreversibility**:  
  - **Scenario:** Interpreting a present unconformity as evidence of past erosion.  
  - **Eternalism:** The entropy gradient (low entropy past → high entropy present) is real and explains irreversibility.  
  - **Presentism:** Only *present* high entropy exists. Why should it indicate a *past* state of lower entropy? Appeals to the "Past Hypothesis" (a brute initial low-entropy state) lack ontological grounding—there's no past to anchor it.  
  - **Bite:** Reconstructing erosional history from an unconformity assumes an objective temporal arrow grounded in past states. Presentism makes this arrow inexplicable.  

  Both cases force a choice: Either accept that science's historical inferences require a real past (eternalism) or treat core scientific practices as pragmatically useful but ontologically ungrounded (presentism). The cost to presentism is a disconnect between what science does and what exists. For a geophysicist who spent decades uncovering deep time, that cost is profound.
