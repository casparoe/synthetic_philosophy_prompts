        - They decide how many chips to donate (if any). We expect they will donate at least one.
        - After donation, update the total chips: 
            They donate k chips -> expected gain: 100 * k
            Total: 1800 - k + 100*k = 1800 + 99*k
            So they gain.

    2. Part2: The Mugger (25 min)
        - Explain the Mugger's rules: sequence of demands, each independent. At round i, the Mugger demands 1 chip to avoid a disaster with probability 10^{-6} of causing a loss of 10^{6+i} chips (so expected loss = 10^i).
        - They will face up to 5 rounds.
        - At each round, they decide to pay or refuse. If they pay, they lose 1 chip and the sequence stops. If they refuse, they incur the expected loss and move to the next round.
        - Record the expected chip total after each decision.
        - After each decision, each student writes an individual decision rule for the next round (on an index card). They keep the card for the debrief.
        - Run rounds 1 to 5 (or until they pay and the sequence stops).

    3. Part3: The Counter-Mugger (20 min)
        - Now reset the chip total to 1800 (or start a new sequence).
        - Introduce the Counter-Mugger: "If you refuse the first demand of the Mugger, I will give the group 0.5 chips. But note: this is only for the first refusal. Then the Mugger will continue with the next rounds as before."
        - Run the Mugger sequence again (5 rounds max). They know the stakes.

    4. Debrief (25 min)
        - Map each moment to the four ingredients.
        - Discuss the decision rules they wrote and how they were exploited.
        - Highlight the cost of each type of rule.
        - State the limitations (stipulated stakes, not genuine uncertainty).

