answer: |-
  ### Pascal's Mugging Simulation: Activity Design  
  **Goal:** Students experience the core tension of Pascal's Mugging (unbounded stakes, adversarial escalation, and the failure of pre-commitment rules) without naming it. They confront why fixed thresholds (for probability, stakes, or expected value) fail when an adversary adjusts stakes based on resistance.  

  ---

  #### **Materials**  
  - **Chips:** Each student starts with 100 chips (total pool: 1,800 chips).  
  - **Index Cards:** For writing decision rules.  
  - **Whiteboard:** Track chip totals, stakes, and decisions.  
  - **Timer:** Strict timekeeping for each phase.  
  - **Role Cards:** "Mugger" and "Counter-Mugger" (for facilitator).  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **0. Setup (5 min)**  
  - Distribute chips (100/student).  
  - Explain: "You’ll make group decisions to maximize expected chips. Chips represent utility. Decisions require majority vote. Write personal decision rules on index cards when prompted."  

  #### **1. Part 1: Baseline Charitable Ask (10 min)**  
  - **Scenario:**  
    - *Facilitator:* "A trusted charity offers bednets. Each chip donated has a 1/1,000 chance of saving a life. Each life saved gives 100,000 chips in utility."  
    - Expected value (EV) per chip: (1/1,000) × 100,000 = **+100 chips**. Donating is EV-positive.  
  - **Activity:**  
    - Students discuss/vote on how many chips to donate.  
    - **Outcome:** Most donate heavily (net gain expected).  
  - **Debrief Prep:** "Remember this for later: you trusted a high-EV choice."  

  #### **2. Part 2: The Mugger (25 min)**  
  - **Mechanic:**  
    - The facilitator acts as the **Mugger**, demanding 1 chip per round to avoid a disaster.  
    - **Disaster:** Fixed probability (1/1,000,000) of a loss. Loss magnitude increases ×10 after each refusal:  
      - Round 1: Lose 10,000,000 chips (EV loss = 10).  
      - Round 2: Lose 100,000,000 chips (EV loss = 100).  
      - Round *n*: Lose \(10^{6+n}\) chips (EV loss = \(10^n\)).  
    - Paying 1 chip stops the sequence. Refusing incurs the EV loss and escalates stakes.  
  - **Rules:**  
    - Run up to 5 rounds. Track EV chip totals publicly.  
    - Before each round, students **write personal decision rules** on index cards (e.g., "Pay if EV loss > 50").  
    - Group discusses/votes (2 min/round).  
    - Mugger announces next stake *after* seeing refusal.  
  - **Predictable Path:**  
    - Round 1: Most refuse (EV loss = 10 is small).  
    - Round 2: Many refuse (EV loss = 100 still manageable).  
    - Round 3: Most pay (EV loss = 1,000 is painful).  
  - **Key Tension:** Paying late incurs prior EV losses (e.g., paying in Round 3 leaves group worse off than paying in Round 1).  

  #### **3. Part 3: The Counter-Mugger (20 min)**  
  - **Mechanic:**  
    - New facilitator role: **Counter-Mugger**.  
    - *Counter-Mugger:* "I’ll pay 0.5 chips if you refuse the Mugger’s *first* demand. But if you refuse, the Mugger returns with higher stakes."  
  - **Activity:**  
    - Reset chip pool to 1,800.  
    - Students vote on Round 1 with Counter-Mugger’s offer.  
    - If they refuse Round 1:  
      - Gain 0.5 chips from Counter-Mugger.  
      - Mugger escalates (Round 2: EV loss = 100).  
      - Sequence continues as before.  
  - **Outcome:**  
    - Temptation to refuse Round 1 for 0.5 chips, but this leads to larger losses later.  
    - Students see how small rewards for refusal create costly inconsistencies.  

  #### **4. Debrief (25 min)**  
  - **Map the Four Ingredients:**  
    | **Ingredient**          | **Moment in Activity**                                                                 |  
    |--------------------------|----------------------------------------------------------------------------------------|  
    | **Unbounded stakes**     | Mugger’s losses grow ×10 indefinitely (e.g., Round 5: EV loss = 100,000).              |  
    | **Expected-value (EV) maximization** | Students forced to use EV (e.g., Part 1 charity, Mugger’s positive EV per payment). |  
    | **No floor on credence** | Fixed 1/1,000,000 probability treated as non-zero (no "ignore below X probability" rule). |  
    | **Adversarial stake choice** | Mugger sets next stake *after* seeing refusal (exploiting pre-set rules).            |  

  - **Analyze Decision Rules:**  
    - Collect index cards. Contrast written rules (e.g., "Pay if EV loss > 50") with actual votes.  
    - **Cost of Escape Routes:**  
      - *Utility ceiling:* Capping max loss (e.g., "Ignore losses > 1 billion") fails when Mugger sets loss to 1 billion → EV loss = 1,000 → still forces payment.  
      - *Probability floor:* Ignoring low probabilities fails when Mugger sets probability to your floor (e.g., 1/10,000) and cranks stakes.  
      - *Stakes-insensitivity:* "Ignore if demanded stake > X" fails if Mugger demands 1 chip indefinitely.  
      - *Abandoning EV:* Using minimax ("avoid worst-case") forces paying in Round 1 → inefficient if Mugger bluffs.  

  - **State Limitations Explicitly:**  
    > "In this game, stakes/probabilities are *stipulated*, not uncertain. Real muggers can’t credibly threaten 10^100 utils. We’ll discuss next time: why should we assign *any* credence to such claims? How should priors block this?"  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **"Probability is zero!"**  
     - *Mitigation:* Preface: "Assume the Mugger’s probability is *given* as 1/1,000,000. Debate the math, not plausibility." Intervene if dismissed: "If a superintelligent AI threatened this, would you assign *literal* zero probability?"  

  2. **Dominance by quick calculators:**  
     - *Mitigation:*  
       - **Silent writing:** Students write rules/votes alone first.  
       - **Structured discussion:** 1-min pairs → 2-min small groups → 3-min whole group.  
       - **Random call-ons:** "Alex, what did your pair conclude?"  

  3. **Refusal to engage ("This is dumb!")**  
     - *Mitigation:*  
       - Start with realistic charity (Part 1).  
       - Pre-empt: "If this feels absurd, lean in—philosophers like Bostrom take it seriously. Your job: find a *consistent* rule that beats the Mugger."  

  4. **Groupthink/early consensus:**  
     - *Mitigation:* Force written rules *before* discussion. Show consequences: "You ruled ‘never pay’? Let’s simulate Round 5: EV loss = 100,000. Final chips: -98,200."  

  ---

  ### **What the Exercise Can’t Do**  
  - **Credibility of claims:** Students don’t experience why we assign non-zero probability to Mugger-like threats. *You must state:* "In reality, priors should be structured to ignore incoherent threats (e.g., 3^^^3 disutils), but the Mugger exploits any gap."  
  - **Unbounded utility functions:** The game assumes linear utility of chips. *Note:* "Some theories cap utility to avoid mugging, but this has costs (e.g., ignoring massive real stakes)."  
  - **Dynamic priors:** Students can’t update beliefs based on the Mugger’s behavior. *Clarify:* "Pascal’s Mugging assumes a static, exploitable prior. Real agents should penalize absurd claims."  

  ---
  **Final Tip:** End by assigning a short text (e.g., Bostrom’s "Pascal’s Mugging") for next session. Frame today: "You felt why this is a puzzle. Next: solutions."
