  Then there are the two simulations: Chip Twin and Coarse Twin. Chip Twin replaces neurons with silicon units maintaining real-time input-output. This seems like multiple realizability, so functionalists would likely say it has the same mental states. Coarse Twin only matches coarse-grained states over minutes. Here, the lack of fine-grained causal processes probably means it doesn't realize the same mental states, especially conscious ones. The user's question about how finely the program must be specified is crucial here—functionalism requires the right level of abstraction.

