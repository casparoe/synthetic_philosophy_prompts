prompt: |-
  I'm in the second year of a philosophy PhD, and a few of us have been running an informal reading group on whether philosophy makes progress. One member of the group — the one who actually works on meta-philosophy — produced an argument I cannot refute and cannot accept, and what I want from you is a diagnosis of the reasoning, not a reading list. For background: one evening, mostly for amusement, I invented a scoring scheme for the group that we ended up calling the Turnover Audit. You take fifty questions that were live in a field sixty years ago and sort them into settled / still live / abandoned as confused; then you count how many of the field's live questions today were not live then. My friend's argument quotes my numbers, but I think it would go through without them. Here is the argument as he gave it.

  (1) A discipline D has made cognitive progress between t1 and t2 only if, at t2, its practitioners can do something with respect to D's questions that practitioners at t1 could not do, and can do it because D at t2 possesses knowledge that D at t1 lacked.
  (2) A question is central to D when answers elsewhere in D are answerable to it: you cannot tell whether some technical result in D is genuinely a result without taking some stand on the central question.
  (3) So if every central question of D is unsettled at t2, and the spread of expert opinion about them has not narrowed between t1 and t2, then D has made no cognitive progress in that interval — whatever new capacities its practitioners have acquired, they are not capacities exercised on questions to which D knows the answer, and so they are not grounded in new knowledge.
  (4) Philosophy's central questions — how mind stands to the physical world, whether agency is compatible with the natural order and how, what gives normative claims whatever authority they have, what it is for a thing to persist through change, what knowledge is — are unsettled now, were unsettled eighty years ago, and the spread of professional opinion about them has not narrowed. My audit sorted 31 of the fifty sampled questions as still live, 6 as settled and 13 as abandoned as confused; one member of the group argued that the live category should be larger still, because in several cases the wording has survived while what is meant by it has changed out of recognition.
  (5) Therefore philosophy has made no cognitive progress: what has grown is its apparatus, its distinctions and its memory, not its stock of knowledge.
  (6) Now run the same argument on fundamental physics. Its central question — what the world is fundamentally made of and how it is structured — is unsettled, and its practitioners are in one respect worse off than their predecessors a century ago: the live interpretations of the best-confirmed formalism (Copenhagen-style, many-worlds, pilot-wave, dynamical-collapse and others) have multiplied rather than dwindled, and they disagree about what there is.
  (7) Therefore fundamental physics has made no cognitive progress either. And since the same will hold for any field whose foundations are contested, "makes progress" cannot be the mark of cognitive seriousness that philosophy's critics take it to be; or, taking the argument at face value, almost nothing outside closed formal systems has ever progressed.

  The bind I am in is that I hold two things the argument says I cannot both hold: that philosophy has got nowhere on the big questions, and that physics obviously has got somewhere. So please tell me which step to reject and price the alternatives for me. Is there an equivocation — in "central question", in "progress", in "can do", in the move from (3) to (5) — or is the reasoning valid and one of the premises simply false? If you reject (2) or (3), say what makes a peripheral result a genuine result while the centre is unsettled, and test your answer against the cases we argued over: Russell's refutation of naive comprehension; Gettier-style counterexamples to the analysis of knowledge as justified true belief; the thirteen questions in my audit that moved from live to abandoned as confused; and one case of your own choosing from physics. If instead you reject (1), tell me what your replacement condition implies about a field everyone agrees is stagnant, so I can see what I am buying. Of the premises, the one I would least like to give up is (2), which seems to me to capture something true about how a discipline's results hang together; and I would also like to know whether my friend can salvage a restricted version of the argument — one that convicts philosophy and exonerates physics — without the restriction being question-begging. Finally, name the case your own account handles worst.

  I don't need citations, bibliographies or references; the reasoning is what I am after, and I would rather you told me where the live disputes lie than handed me a confident story, so please mark clearly which parts of your answer are close to consensus among people who work on these questions and which are genuinely contested. Please write in British English.
reasoning: |-
  Okay, the user is a second-year philosophy PhD student grappling with a meta-philosophical argument about disciplinary progress. They're caught between accepting a logically tight case that declares both philosophy and physics stagnant, and their strong intuition that physics has clearly advanced. The argument's core challenge is that central questions in both fields remain unresolved with no consensus narrowing, implying no cognitive progress under the given definition.

  Hmm, the user explicitly wants a diagnostic dissection, not literature recommendations. They're clearly deeply familiar with the philosophical terrain but need help spotting cracks in the reasoning. Their attachment to premise (2) about centrality suggests they value disciplinary coherence, so any solution must preserve that intuition while creating daylight between philosophy and physics.

  Right, let's map the argument's pressure points. Premise (1) ties progress to new actionable knowledge - that seems solid. Premise (2)'s centrality criterion does feel right for philosophy where big questions constrain everything, but does it hold for physics? When physicists calculate black hole mergers using general relativity, they're not resolving quantum gravity - so perhaps peripheral work can be knowledge without central resolution. The user's own Russell and Gettier examples might actually support this: those were progress on subsidiary questions without settling mind-body or epistemology's core.

  Ah, premise (3) is where physics might diverge. The multiplication of QM interpretations looks like divergence, but actually the formalism's predictive power has massively expanded - that's new capacity grounded in knowledge. Whereas in philosophy, new distinctions (say, four-dimensionalism about persistence) don't yield new capacities to resolve cases. The key is whether "capacities" in (1) must target central questions directly. For physics, peripheral capacities (building lasers, predicting particles) clearly count as progress even when foundations are shaky.

  The user's worry about premise (2) abandonment is real though. If we weaken centrality too much, we might have to call stagnant fields progressive. Maybe the test is whether peripheral advances can be integrated into a growing body of application-ready knowledge without central resolution. Physics does this; philosophy's insights tend to be fragmentary.

  For salvage options: rejecting (3)'s implication for physics by redefining "capacities" seems strongest. But we'd need to show why Gettier cases or Russell's paradox don't similarly count - perhaps because they don't cumulatively build applied tools. The user should prepare to defend why settled peripherals in philosophy (like the confusion-abandoned questions) don't constitute parallel progress. That's messy, but less costly than denying physics' progress.
answer: |-
  Your bind is genuine, and the argument is cleverly constructed to force a difficult choice. The reasoning is largely valid *given its premises*, but several premises are vulnerable – particularly (2) and (3), and the application in (4) & (6). Here’s a diagnosis, pricing the alternatives, and identifying the contested ground:

  **Core Problem: The Conflation of "Central" with "Foundational" and "Settled"**

  The argument hinges on premise (2) defining centrality via *answerability*. While plausible for philosophy (where foundational questions often constrain downstream work), this definition misfires for physics and misrepresents progress. Progress often occurs *without* settling foundational questions, precisely by *bracketing* them or making them *operationally irrelevant* for significant domains.

  **Step-by-Step Rejection & Pricing:**

  1.  **Reject the *Application* of Premise (2) to Physics (Specifically in Steps 6 & 7):**
      *   **Why:** Premise (2) equates "central" with "foundational constraint." In physics, foundational questions *are* central in one sense (what is fundamental?), but progress happens overwhelmingly in the *periphery* defined *operationally* or *phenomenologically*. Crucially, results in this periphery often become *autonomous* from the unresolved foundations.
      *   **What Makes a Peripheral Result "Genuine" While the Centre is Unsettled?**
          *   **Predictive/Explanatory Power & Technological Application:** A result is genuine if it reliably predicts novel phenomena, explains a wide range of observations, or enables new technologies *independently* of which foundational interpretation is correct. Quantum mechanics (QM) is the prime example: its formalism (state evolution, superposition, entanglement) yields astonishingly precise predictions and powers technologies (lasers, transistors, MRI) *regardless* of whether you believe in Copenhagen, Many-Worlds, or Bohmian mechanics. The unsettled foundations don't invalidate Schrödinger's equation's predictive success.
          *   **Consilience & Integration:** Results are genuine if they integrate coherently into a larger, empirically successful framework, even if that framework's ultimate foundations are unknown. General Relativity (GR) explains gravity phenomenally well and integrates with cosmology, despite being incompatible with QM at the fundamental level.
      *   **Testing Against Cases:**
          *   **Physics Case (Your Choosing - e.g., Standard Model):** Discovering the Higgs boson confirmed a key prediction of the Standard Model. This is genuine progress – it explained mass generation for certain particles and closed a gap in the model. It did *not* resolve the foundational questions of quantum gravity, dark matter, or why the constants have their values. Its genuineness lies in its empirical confirmation and integration within a predictive framework.
          *   **Russell's Refutation:** Genuine progress? **Yes, but different kind.** It resolved a specific *logical* paradox within set theory, establishing clear constraints (axiomatic systems). It didn't settle the *philosophical* foundations of mathematics (Platonism vs. Formalism vs. Intuitionism), but it created a stable operational framework *for doing mathematics* where the paradox was blocked. Its genuineness is logical/systematic, not empirical.
          *   **Gettier Cases:** Genuine progress? **Contested, but arguably yes (in a limited way).** They showed a specific *analysis* (JTB) was insufficient. This clarified the *logical structure* of the problem, spawning new analyses (reliabilism, virtue epistemology, etc.). However, they didn't settle the *central* question "What is knowledge?" – the debate shifted and proliferated. The progress is dialectical/analytic, revealing complexity, not delivering a settled answer or predictive power. *Less autonomous* than physics results.
          *   **Abandoned-as-Confused Questions:** Genuine progress? **Often yes (as elimination).** Recognizing that a question is ill-formed or rests on confused presuppositions *is* progress. It stops wasted effort and refocuses inquiry. E.g., abandoning "What is the ether's state of motion?" after relativity was progress. It removed a conceptual obstacle. Its genuineness is clarificatory/eliminative.
      *   **Cost:** You must accept that vast, transformative progress can occur in a field *without* settling its most fundamental ontological or metaphysical questions. It redefines "centrality" functionally (what drives the most successful practice?) rather than foundationally. This fits physics perfectly but makes philosophy's lack of *this kind* of progress starker.
      *   **Salvaging the Distinction:** This rejection cleanly exonerates physics while convicting philosophy. Physics progresses *despite* unsettled foundations because its periphery yields powerful, autonomous, empirical/technological results. Philosophy struggles to produce results with comparable autonomy and consilience from its foundational debates. The restriction isn't *inherently* question-begging; it points to a *difference in the nature and consequences* of the results produced in the periphery.

  2.  **Reject Premise (3) - The Narrowing Requirement & "Capacities":**
      *   **Why:** Premise (3) assumes progress requires narrowed consensus on central questions *and* that new capacities must be "exercised on questions to which D knows the answer." This is too restrictive.
      *   **Alternative View of "Capacities" (Grounding in New Knowledge):** New capacities can be grounded in knowledge *about how to model, predict, manipulate, or even just rigorously conceptualize aspects of the world*, even if the ultimate "why" or "what is" remains unknown. Knowing *that* QM formalism predicts atomic spectra with stunning accuracy *is* knowledge, even if we don't know *what it means* ontologically. The capacity to build lasers is directly grounded in this knowledge.
      *   **Narrowing Consensus:** Progress can involve *increasing the sophistication and precision of disagreement* or *identifying new, better-defined problems*, not just convergence. The multiplication of QM interpretations reflects *increased understanding* of the formalism's interpretative challenges, not less. The capacity to *formulate* these interpretations rigorously is itself progress grounded in deeper knowledge of the formalism.
      *   **Cost:** This makes "progress" fuzzier. You need robust criteria to distinguish fruitful proliferation of views (physics interpretations) from mere stagnation or confusion (some philosophy debates). Why is multiplying interpretations in physics progress but multiplying analyses of knowledge in philosophy not? The answer likely loops back to the *empirical/technological fruitfulness* or *systematic consilience* seen in physics's peripheral results (supporting Rejection 1).
      *   **Salvaging:** Harder alone. It helps physics but doesn't *automatically* condemn philosophy. You'd need additional arguments (likely involving lack of empirical/technological fruitfulness or consilience in philosophy's "peripheral" results) to maintain the distinction. Less clean than Rejection 1.

  3.  **Reject Premise (1) - The "Can Do" Requirement:**
      *   **Why:** This is the nuclear option. Premise (1) ties progress tightly to *practical capacities* arising from new knowledge. This risks excluding conceptual, clarificatory, or purely theoretical progress.
      *   **Replacement Condition (e.g., Increased Understanding):** Progress could be defined as an increase in the *depth, rigor, coherence, or explanatory scope* of understanding, even without new capacities to "do" something external. Russell's paradox increased logical understanding; Gettier increased conceptual clarity about knowledge.
      *   **Implication for a Stagnant Field:** A stagnant field would show no increase in depth/rigor/scope over time. Explanations become circular, no new insights emerge, conceptual confusion persists without clarification.
      *   **Cost:** This makes progress very broad. Almost any scholarly activity showing *some* increase in sophistication could count. It becomes harder to distinguish philosophy from physics decisively in terms of progress *type*, though the *degree* and *nature* (empirical vs. conceptual) remain different. Crucially, it potentially *exonerates philosophy* on its own terms (conceptual clarification), which contradicts your intuition that physics has progressed in a way philosophy hasn't. It also risks making "progress" too subjective.
      *   **Salvaging:** Not useful for your goal. It likely forces you to accept philosophy *has* made progress (of a clarificatory/analytic kind), contrary to your starting point.

  4.  **Reject Premise (2) - Centrality Itself:**
      *   **Why:** You're reluctant, and rightly so. It captures something important about structure. However, one could argue fields can have *multiple, relatively autonomous* centres or that centrality shifts.
      *   **Alternative:** Perhaps centrality is defined by *what the community actively investigates and builds upon most productively*, not just foundational answerability. In modern physics, "What are the fundamental constituents/forces?" remains central, but the *fruitful work* happens in domains where specific models (Standard Model, GR) operate successfully *without* constant recourse to the ultimate foundation. The foundation constrains but doesn't paralyze.
      *   **Cost:** Weakens the important insight about how results depend on foundations. Makes it harder to explain why *some* foundational stalemates *do* cause stagnation (e.g., certain periods in philosophy). Requires careful distinction between "foundational" and "operationally central".
      *   **Salvaging:** Difficult. Undermines the argument's initial grip on philosophy. Doesn't automatically create the physics/philosophy distinction you need.

  **Diagnosis & Consensus/Contested Areas:**

  *   **Core Equivocation:** The key equivocation is in **"central question"** and its link to **"progress"**. The argument treats "central" as synonymous with "foundational constraint on all results." While often true in philosophy, physics demonstrates that fields can make progress on vast, interconnected bodies of highly reliable knowledge *without* settling the foundational questions that ultimately (in some philosophical sense) constrain everything. The results become operationally autonomous.
  *   **Live Disputes (Marked):**
      *   **The Nature of Progress:** (Highly Contested) Is progress primarily empirical/technological (favoring sciences), problem-solving (Popper), paradigm-shifting (Kuhn), increasing verisimilitude (Popper/Lakatos), conceptual clarification, or something else? Your friend's argument assumes a fairly standard "knowledge-enabling-new-capacities" view, but its application is contested.
      *   **Centrality & Dependence:** (Contested) Does *every* result in a field genuinely depend on answers to its "central" questions in the strong sense of (2)? Many argue physics shows they often do not *in practice*, even if they might *in principle*. Others maintain the dependence is always there, just obscured.
      *   **The Status of Interpretative Stalemates:** (Contested) Does the proliferation of interpretations (e.g., QM) signify stagnation, depth of understanding, or healthy pluralism? The argument assumes narrowing consensus is necessary; many philosophers of science disagree.
      *   **Autonomy of "Peripheral" Knowledge:** (Contested - Core to Rejection 1) Can a field possess significant, robust knowledge in specific domains that is functionally independent of unresolved foundational debates? Physics suggests yes; whether philosophy achieves similar autonomy in *any* domain is highly debatable (e.g., logic? philosophy of language?).
  *   **Near Consensus:** There is broad agreement that physics has made astounding empirical and technological progress in the last century, regardless of foundational issues. There is also broad agreement (even among philosophers) that philosophy has not settled its perennial "big questions" in the way physics has settled questions about planetary motion or chemical bonding.

  **Your Friend's Restricted Version & Your Least Worst Option:**

  *   **Salvaging a Restricted Version:** Your friend *could* salvage "Philosophy hasn't progressed on its core questions, but physics has progressed on its non-core questions." However, this requires abandoning premise (2)'s claim that *all* results depend on the central questions *for their validity*. He must admit physics gets genuine, reliable knowledge *without* settled foundations, while (he argues) philosophy does not. The restriction isn't *logically* question-begging if he can point to the *empirical/technological fruitfulness and consilience* of physics's peripheral results vs. the *dialectical/introspective* nature of philosophy's. However, it concedes the core mechanism of his original argument (premise 2 & 3) doesn't hold for physics.
  *   **Recommended Rejection:** **Reject the application of Premise (2) to Physics (specifically the move from 6 to 7).** This is the least costly option preserving your core intuitions:
      *   It accepts philosophy's lack of progress on big questions and lack of autonomous, cumulative results akin to physics.
      *   It exonerates physics by correctly identifying that its progress lies in the operational/peripheral knowledge generated *despite* foundational uncertainty.
      *   It preserves premise (2) as a *partial* truth, especially relevant to philosophy, while acknowledging its limitations for describing progress in empirical sciences with highly successful mid-level theories.
      *   The "price" is accepting that "centrality" in the foundational sense doesn't preclude progress elsewhere, and that genuine knowledge can be domain-specific and operationally autonomous.

  **Case Handled Worst by This Account (Rejection 1):**

  The account struggles most with **cases of profound *conceptual* or *theoretical* progress within philosophy that seem genuinely autonomous from the perennial big questions, yet lack empirical/technological payoff.** Examples might include:

  1.  **Advances in Logic (e.g., Model Theory, Incompleteness):** These seem like clear cognitive progress – deep, rigorous, transformative results with mathematical precision and implications for computation. They aren't *directly* settled by answers to "What is mind?" or "What is normativity?". Yet, they don't yield empirical predictions or technologies in the way physics does. Are they "genuine results"? (Most would say yes, suggesting progress *is* possible in philosophy, just of a different kind than physics).
  2.  **Refined Conceptual Distinctions (e.g., supervenience, rigid designators):** These tools clarify debates and prevent confusion. Are they "knowledge"? Do they grant new "capacities" (e.g., to analyze problems more precisely)? If so, does this constitute progress under a broader definition? Rejection 1 (focused on empirical/technological fruitfulness) struggles to accommodate this convincingly as progress *equivalent* in kind (if not degree) to physics, forcing a perhaps uncomfortable bifurcation in the meaning of "cognitive progress."

  This highlights the residual tension: even rejecting the argument's application to physics, defining and measuring progress in non-empirical fields remains deeply contested. However, Rejection 1 best preserves the stark difference in *achievement* between physics and philosophy that motivates your initial bind.
