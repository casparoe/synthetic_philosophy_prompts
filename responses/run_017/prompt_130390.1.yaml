  ### Scenario: Agricultural Extension Service

  The Ministry of Agriculture monitors soil conditions across four districts: A and B in the Northern Plains (sub-partition S), and C and D in the Southern Valley (complement of S). A farmer, unaware of her exact district, knows prior probabilities from historical land-use data: P(A) = 0.100 (10% of arable land), P(B) = 0.300 (30%), P(C) = 0.200 (20%), P(D) = 0.400 (40%). Thus, P(S) = P(A) + P(B) = 0.400, and the prior conditional odds of A to B given S are 0.100:0.300 = 1:3 (P(A|S) = 0.250).  

  The ministry uses satellite imagery to classify the region as "Northern Plains" or "Southern Valley" with 80% accuracy. If classified as Northern Plains, they deploy sensors across S, measure the *current* soil acidity in A and B, and report the share of S experiencing critical acidity in A (the rest in B). The farmer learns: "Given Northern Plains, the probability of critical acidity in A is 0.500" (announced odds 1:1). This share is calculated from sensor data: conditional on being in S, she is equally likely to be at any point, so her credence of being in A given S equals the reported share. The protocol:  
  - If the satellite classifies the region as Northern Plains (S), report the share for A in S.  
  - If classified as Southern Valley (complement), report the share for C in its complement.  
  The satellite’s classification depends only on the true region (correct with probability 0.8), and a report always arrives (about S or its complement). The message content ("0.500 for S") fixes only the conditional odds for A:B given S; nothing implies S versus its complement.  

  ---

  ### Computations  
  *Prior distribution:*  
  | Cell | A     | B     | C     | D     |  
  |------|-------|-------|-------|-------|  
  | P    | 0.100 | 0.300 | 0.200 | 0.400 |  
  P(S) = 0.400, P(A|S) = 0.250. Announced constraint: P(A|S) = 0.500.  

  **(a) Textbook kinematics (constraint only):**  
  - Fix P(S) = 0.400.  
  - Set P(A|S) = 0.500 → P(A) = 0.400 × 0.500 = 0.200, P(B) = 0.400 × 0.500 = 0.200.  
  - Preserve C:D ratio (P(C)/P(D) = 0.200/0.400 = 0.5) within complement:  
    P(complement) = 1 - 0.400 = 0.600 → P(C) = 0.600 × (0.200/0.600) = 0.200, P(D) = 0.600 × (0.400/0.600) = 0.400.  
  *Posterior (a):*  
  | A     | B     | C     | D     |  
  |-------|-------|-------|-------|  
  | 0.200 | 0.200 | 0.200 | 0.400 |  
  P(S) = 0.400 (unchanged).  

  **(b) Minimum relative entropy (minimize Q·log(Q/P)):**  
  Solve for distribution Q = (q_A, q_B, q_C, q_D) satisfying q_A + q_B = q_S, q_A / q_S = 0.500. Minimize:  
  ∑[q_i log(q_i / p_i)] = q_A log(q_A / 0.100) + q_B log(q_B / 0.300) + q_C log(q_C / 0.200) + q_D log(q_D / 0.400).  
  Using Lagrange multipliers and numerical solver:  
  - q_A = 0.188, q_B = 0.188, q_C = 0.224, q_D = 0.400.  
  *Posterior (b):*  
  | A     | B     | C     | D     |  
  |-------|-------|-------|-------|  
  | 0.188 | 0.188 | 0.224 | 0.400 |  
  P(S) = 0.376 (decreased from 0.400).  

  **(c) Conditioning on total evidence (protocol + message):**  
  Total evidence: Satellite classified as S *and* announced P(A|S) = 0.500.  
  - Likelihoods: P(classify as S | cell) = 
    - 0.8 if in S (A or B) — protocol accuracy,  
    - 0.2 if in complement (C or D) — error rate.  
  - Constraint P(A|S) = 0.500 is *certain* given the report (institutions are truthful).  
  Posterior: P(cell | classify as S) ∝ P(classify as S | cell) × prior(cell).  
  - P(A | evidence) ∝ 0.8 × 0.100 = 0.080 → 0.080 / 0.280 = 0.286  
  - P(B | evidence) ∝ 0.8 × 0.300 = 0.240 → 0.240 / 0.280 = 0.429  
  - P(C | evidence) ∝ 0.2 × 0.200 = 0.040 → 0.040 / 0.280 = 0.143  
  - P(D | evidence) ∝ 0.2 × 0.400 = 0.080 → 0.080 / 0.280 = 0.142  
  Normalizer = 0.080 + 0.240 + 0.040 + 0.080 = 0.280.  
  *Posterior (c):*  
  | A     | B     | C     | D     |  
  |-------|-------|-------|-------|  
  | 0.286 | 0.429 | 0.143 | 0.142 |  
  P(S) = 0.715 (increased from 0.400).  

  **Summary of P(S) changes:**  
  - Prior P(S): 0.400  
