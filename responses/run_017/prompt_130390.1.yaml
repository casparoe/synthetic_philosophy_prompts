  ### Responses to Defenses  
  1. **Defense of (a):** “Once the protocol is specified, the input isn’t a bare constraint, so the rule isn’t challenged.”  
     - **Response:** This concedes the core point: kinematics assumes the constraint is isolated, but real-world updates *always* depend on protocols. It’s a retreat that surrenders (a)’s default status. **Concede in print** that the rule doesn’t apply here.  

  2. **Min-entropy advocate:** “(a) smuggles in extra constraints; refine the space to include protocol outcomes.”  
     - **Response:** Refining the space (e.g., adding satellite outcomes) lets min entropy replicate (c) and yields the same posterior. But it requires knowing the protocol *in advance*, and (b) ≠ (c) here because (b) minimizes divergence solely on the constraint. The advocate’s approach changes the numbers, validating (c). **Answer firmly**: refining the space *works* but requires upfront protocol modeling.  

  3. **Colleague:** “Comparing (b) and (c) is unfair; min entropy is for constraints, conditioning for events.”  
     - **Response:** This defense has merit: min entropy handles constraint-based updates, while conditioning handles event-based evidence. But the farmer’s evidence *combines* both (a constraint from the message and an event from the protocol). **Concede in print** that (b) isn’t designed for hybrid cases.  

  **Persuasive power:** This example uses a realistic institution (government agriculture monitoring) and non-toy numbers (priors and posteriors differ by >20%). The protocol’s dependence on a biased sensor (80% accuracy) is the workhorse. No circularity: the satellite’s reliability is given numerically upfront.  

