prompt: |-
  Hey — hoping you can help with something that's been bugging me. I'm not a philosopher; I read about animal cognition as a hobby (kept a reef tank for years and got nerdy about it), so I'm coming at this from the outside.

  Here's the pattern I keep running into. Someone points at a behaviour and says this is what a creature that actually feels things looks like: a fish that keeps rubbing the side of its body against the gravel for hours after being injected with something that stings; a bee that gets shaken the way a predator would shake it and then won't go back to the flowers with a certain smell, for days afterwards; a crayfish that got zapped repeatedly and afterwards just sits in the dark part of the tank even on days when nothing is zapping it. And then someone else says: fine, but that's a reflex, or a fixed action pattern, or learning wired up by evolution — none of it needs anybody to be home inside. So the first person escalates: the animal trades off a shock against a food it really wants, or it transfers what it learned in one setup to a totally different one. And the second person says: sure, more elaborate wiring. And it never stops. However fancy the behaviour gets, the second person can always posit an unconscious mechanism that outputs exactly that behaviour, and the first person never acquires a new *kind* of evidence, because behaviour is all there is to point at, and every piece of it has already been absorbed.

  The bit I want a name for is the structural thing: the "no mind needed" explanation doesn't get any more expensive as it gets more complicated, so it can soak up evidence forever without ever paying for it, while the other side pays full price every time and can never get ahead. I don't think it's just the problem of other minds, because that one is usually framed as a general puzzle about knowing any mind at all, including human ones, and nobody here is doubting other humans. And I've seen people invoke a rule of thumb — don't reach for a fancy mental explanation when a humbler mechanism covers the data — which somebody told me is named after some long-dead psychologist. That feels close but wrong: it's advice about which explanation to prefer, not a description of why one side's explanations cost nothing.

  One more wrinkle, so you don't hand me something too simple. Whatever I'm describing, it isn't plain stinginess about animal minds, because it seems to switch off around animals that are very unlike us. Show people a bee doing something half as elaborate as the fish thing and plenty of them will say yes, that one's conscious — the discount seems to track how much the creature resembles us, not how much evidence there is.

  So: does this have an established name, and if not, coin one and define it tightly enough that I can tell it apart from ordinary scepticism about other minds, from the humbler-mechanism rule, and from just being wrong about a particular species? I'm after the carving, not the label — if the nearest established concept only half fits, tell me exactly where it stops fitting. And where are the edges: does the thing survive if you switch from behavioural evidence to evidence about mechanisms and brain structures, or does it just move house — and if it moves, is that the same phenomenon wearing a hat or a second one? Please don't point me at papers or reading lists, I've got no library access from here and couldn't follow up anyway; just give me the shape of it in your own words. Also say how confident you are in what you're claiming and flag the part you're least sure of — I'd rather have one honest wobble than a tidy answer. Last thing: write it as continuous prose, no headings, bullets, bold text or tables, just paragraphs like you were writing me an email.
reasoning: |-
  Okay, let me unpack what this user is asking. They're fascinated by animal cognition but frustrated with a recurring pattern in debates about animal consciousness. The core issue is how one side (sceptics) can always dismiss behavioral evidence as "just reflexes" or "complex wiring" without ever increasing their explanatory burden, while the other side (attributionists) keeps gathering evidence that gets absorbed by the sceptical framework. 

  The user wants a precise name for this structural asymmetry, distinguishing it from: 
  - The general problem of other minds (since humans aren't doubted here) 
  - Occam's razor/parsimony principles (which advise preference but don't explain the cost asymmetry) 
  - Mere anthropocentric bias (since the discounting varies by species resemblance)

  Hmm. The closest existing concept might be "criterion pluralism" from consciousness studies, but that doesn't fully capture the economic metaphor the user describes - where sceptical explanations have "zero marginal cost." I recall Dennett's "intentional stance" work too, but his system doesn't address the cost imbalance. 

  What's unique here is how sceptical explanations scale: adding complexity costs them nothing theoretically, while each new behavior forces attributionists to defend their position anew. And crucially, this scales differently across species - a bee's complex behavior gets more scepticism than an octopus's simpler actions due to anthropocentrism. 

  The mechanism vs. behavior evidence question is tricky. If we shift to neural evidence, the asymmetry might transform: finding human-like brain structures could make scepticism harder, but they might then argue similar structures don't imply similar functions. So the pattern persists but migrates. 

  I should emphasize this isn't just about animal consciousness - it's a broader epistemic trap where one position has infinite "explanation elasticity." The user's reef tank experience shows they've seen this pattern empirically, not just theoretically. 

  Biggest uncertainty: whether neural evidence fundamentally changes or just relocates the asymmetry. Also, naming it - "epistemic asymmetry" feels close but needs the scaling element. "Zero-cost scepticism"? Must reflect both the structural and species-specific aspects. 

  Ultimately, this user wants conceptual clarity, not citations. They're observant - noticing how the burden of proof operates differently per species is sharp. My response should honor that insight while admitting where the boundaries blur.
answer: |-
  Here’s how I’d carve this up, warts and wobbles included. What you’re describing isn’t one established concept but a *collision* of several forces, and the closest label for the structural asymmetry you identify might be **Explanatory Inflation Resistance** – though I’ll unpack why that’s incomplete.

  Start with the core asymmetry: The "no mind needed" position leverages **causal underdetermination**. For *any* observable behaviour, there’s always *in principle* a purely mechanistic explanation (reflex chains, innate algorithms, associative learning) that doesn’t require subjective experience (phenomenal consciousness). Adding complexity to the behaviour doesn’t inherently break this; the sceptic just posits a more complex mechanism. The cost *they* pay isn’t in explanatory power (their model *can* fit the data) but in **parsimony burden shifting**. The burden to *disprove* an endlessly adaptable mechanistic alternative becomes immense, while the proponent of consciousness must constantly justify why *this* new evidence crosses an invisible threshold. It’s like one side has an infinitely elastic theory that stretches to fit any data point without snapping, while the other needs a specific, rigid key for each new lock.

  This isn't *just* the Problem of Other Minds (PoOM). PoOM is foundational: we can't directly access another's subjective state, human or animal. But your case is sharper: it’s about **asymmetric scalability** within the debate. PoOM says we can’t *know* for sure; this structural asymmetry says that *within the rules of evidence accepted by both sides* (behavioural data), one position has a built-in, infinitely scalable defence that the other cannot overcome by accumulating *more of the same kind* of evidence. The sceptic isn't (necessarily) denying the *possibility* of animal minds; they're exploiting a loophole in the evidence-gathering protocol.

  The "humbler mechanism rule" you mention is likely **Morgan's Canon**: “In no case may we interpret an action as the outcome of the exercise of a higher psychical faculty, if it can be interpreted as the outcome of the exercise of one which stands lower in the psychological scale.” This *enables* the asymmetry but isn't identical to it. Morgan's Canon advises parsimony. The asymmetry arises because *applying* Morgan's Canon defensively (as the sceptic does) becomes **epistemically cost-free** at scale. Each new complex behaviour can be met with "More complex mechanism!" without the sceptic needing a *specific, testable, alternative model* for *that specific* mechanism. They invoke a *class* of explanations (neurological/computational) that is, by its nature, assumed to be capable of producing any behaviour without consciousness. The "cost" is deferred to future neuroscience, but *within the behavioural debate*, it’s free.

  Now, the anthropocentric wrinkle: This is **Differential Scrutiny Bias**. The sceptic's threshold for accepting consciousness isn't fixed by evidence *alone*; it’s modulated by **phylogenetic distance** or **morphological similarity** to humans. A bee's sophisticated learning faces higher sceptical hurdles than equivalent (or lesser) evidence in an octopus or mammal. The asymmetry persists, but its *activation energy* varies. The sceptic doesn't *need* to deploy their infinitely elastic defence against creatures "like us" because their prior assumptions are more favourable. They might accept weaker evidence for a monkey than stronger evidence for a fish. This bias makes the structural asymmetry *feel* less oppressive for close relatives, but it doesn't eliminate it; it just changes the baseline.

  **Does it survive a shift to mechanisms/brain structures?** Yes, it **moves house**. If you point to homologous brain structures (e.g., fish habenula similar to mammalian pain-processing areas), the sceptic can say: "Similar structure ≠ similar function or experience. This could be an unconscious alarm system." If you show neural correlates of consciousness (NCCs) in mammals and find similar patterns in birds, they say: "Correlation isn't causation/experience. Maybe it's an epiphenomenon or serves another computational role." The core move remains: **Dissociate mechanism from mentality**. The sceptic posits that the observed mechanism (neural firing, connectivity, chemistry) performs a complex *function* without generating subjective experience. This is harder to dismiss out of hand than behavioural arguments (it *feels* closer to the "stuff" of mind), but the fundamental underdetermination – the gap between objective mechanism and subjective feel – remains a philosophical chasm (Levine's "Explanatory Gap," Chalmers' "Hard Problem"). The asymmetry transforms from "Endless behavioural mechanisms" to "Endless functional interpretations of neural mechanisms," but it persists. It’s the *same phenomenon* adapted to a new domain of evidence.

  **Confidence & Wobbles:**
  *   **High Confidence:** The core structural asymmetry you identify is real and pervasive in animal consciousness debates. It stems from causal underdetermination + the scalability of mechanistic explanations + the inability of behavioural evidence alone to bridge the explanatory gap.
  *   **Medium Confidence:** Characterizing it as a *collision* of underdetermination, asymmetric parsimony burden shifting, and differential scrutiny bias captures its dynamics better than any single label. "Explanatory Inflation Resistance" hints at the sceptic's ability to absorb complexity without cost, but it’s not a standard term.
  *   **Wobble Point (Least Sure):** The precise relationship between this asymmetry and anthropocentrism. Is the differential scrutiny bias *integral* to the phenomenon you described, or is it a separable, aggravating factor? I lean towards it being integral to how the asymmetry manifests *practically* in human reasoning (we're biased), but the structural asymmetry itself *could* theoretically exist even without it (e.g., debating consciousness in hypothetical aliens utterly unlike us). In *actual* debates about Earthly animals, they are deeply intertwined.
  *   **Key Distinction:** This isn't ordinary scepticism (which questions evidence) nor Morgan's Canon (which advises parsimony). It's the *exploitation* of underdetermination and parsimony advice to create an **epistemically untouchable position** regarding the *necessity* of consciousness for explaining behaviour or mechanisms, a position that scales infinitely with evidence complexity and is modulated by bias.

  So, if you need a name: **Scalable Mechanistic Dissociation (SMD)**. It captures the sceptic's core move (dissociating mechanism from mind) and its key property (scalability without cost within the debate). Its hallmarks are: 1) Absorption of any behavioural/neural complexity via more complex unconscious mechanism postulation, 2) No corresponding increase in the sceptic's burden of proof for their alternative, 3) Burden of *disproof* placed entirely on the consciousness proponent, 4) Modulated in practice by anthropocentric bias. It survives shifts in evidence type by morphing its dissociative argument to fit the new domain. The carving is defined by this *structural* and *strategic* asymmetry, distinct from the foundational doubt of PoOM or the advisory role of Morgan's Canon.
