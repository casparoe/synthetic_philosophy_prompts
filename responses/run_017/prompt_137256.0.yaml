prompt: |-
  hey, hoping someone can help me put a name on something — or tell me flat out that it doesn't have one, in which case I want help carving it up properly.

  I design reward mechanics for a behaviour-change app (streaks, deposit contracts, that sort of thing) and I read too much philosophy of action in my spare time, and I keep tripping over the same shape of problem in both places.

  The shape: someone gets offered something valuable on the condition that, by some deadline, they're in a certain state of mind — intending to do a thing, being resolved, genuinely wanting it — and the payoff does not depend on whether they ever act on it.

  Case one. A stranger offers you a large sum of money, handed over at breakfast, if by then you've genuinely decided to swallow a pill that will make you feel like you've got the flu for a day. You get the money for the deciding, not the swallowing. I cannot get myself into that state. I can say the words, I can even arrange to be locked in a room with the pill, but actually deciding seems to be the one thing unavailable to me — and weirdly it's unavailable *because* of the offer. Before he opened his mouth, deciding to take a flu-pill for no reason would have been strange but not incoherent.

  Case two. Same structure, except the thing you're paid to decide on is something you'd still have a real reason to do when the time comes: go for a run at 6pm, money arrives at breakfast. This one I also can't get into, but it feels like the opposite failure. The money's already spent on me, so it can't be my reason at 6pm, and the run now feels *bought* — which somehow makes it harder to want than if nobody had paid me. Same failure as case one in a costume, or a different one?

  Case three, the ones that work. Deposit contract: you lose 200 bucks if you don't log a run by Sunday. Here the external incentive seems to manufacture the intention rather than wreck it. And not just by shifting payoffs — people describe the decision as feeling more real, not less.

  So the thing I want a word for: the pattern where being offered a reason to be in a state of mind is exactly what puts the state out of reach, while in neighbouring cases an offer does the reverse. I've seen people wave at the idea that you can't intend at will, and at the idea that money just isn't the right sort of reason to want something, and at the effect where paying kids to read makes them stop liking reading. None of them seem to cover case two, where the problem isn't that I can't produce the state but that the state I can produce has been contaminated. And none of them tell me what flips the sign between case two and case three.

  Here's the variant that bugs me most. Suppose the stranger doesn't offer cash. He says: if you've decided by morning, I'll fly your whole family in to watch you take the pill, and I'll tell them what you're doing. Now there's no difficulty at all — obviously you can decide, you'll have a reason at the time. But look at the move: you didn't get control over your own mind, you changed the world so that the decision became the kind of thing there's a reason for. Is that a solution to the puzzle or just a refusal to answer it?

  What I'm after: does this general pattern have a name, or is it two or three things I should be pulling apart? Where's the boundary between the offers that poison the state and the ones that produce it? Does it matter that in my cases the state is an intention rather than, say, a belief — someone offering you money to believe your team will win seems broken in a different way, and I'd like to know if that's the same brokenness. And what would you call the move in that last variant, where you fix the world instead of the mind? I'm really not after a reading list here, just the carving.
reasoning: |-
  Okay, the user is working on behavior-change apps and encountering a philosophical puzzle about incentives affecting mental states. They've described several cases where offering a reward for forming an intention backfires, except when it doesn't—like in deposit contracts. 

  Hmm, their core frustration seems to be that existing concepts (like the "intentional stance" or "overjustification effect") don't fully explain why some incentives poison the intention while others enable it. They're especially bothered by Case 2 where the reward feels like it contaminates the later action, even though there's still a reason to do it. 

  Ah! The key might be whether the incentive *substitutes* the original reason (bad) or *scaffolds* it (good). In the flu-pill case, money replaces any authentic motive, making intention impossible. In the deposit contract, the penalty actually amplifies your existing commitment—you already wanted to run, now there's stakes. 

  That last variant with the family gathering is clever. It doesn't try to force the intention; it creates external social accountability, which naturally generates a reason ("I should do this for them"). That's scaffolding again! 

  The user's hidden ask might be: "How do I design rewards that don't undermine autonomy?" They need the boundary between incentives that feel alien vs. aligned. Naming the substitution effect ("extrinsic contamination"?) and the scaffolding move ("reason-embedding"?) could help. 

  Also noting: this is specific to *future-directed intentions* (unlike belief rewards, which clash with truth-seeking). The deposit contract works because it targets action, not mental states—big difference!
answer: |-
  This is a brilliantly articulated puzzle at the intersection of philosophy of action, motivation, and incentive design. You're hitting on a deep tension, and the pattern *does* have identifiable components and names (or near-names). Here's the carving:

  1.  **The Core Problem: The Paradox of Incentivized Mental States**
      *   **The Issue:** You cannot directly will many mental states (like genuine intention, desire, or belief) into existence *just because* there's an external incentive to have them. The incentive itself often undermines the very state it aims to produce.
      *   **Closest Names:**
          *   **The "Paradox of Incentivized Attitudes"** (a descriptive phrase capturing the core conflict).
          *   **Related to "The Toxicity of Extrinsic Motivation for Intrinsic States"** (though this focuses on undermining *existing* intrinsic motivation, which isn't always the case here).

  2.  **Why Case 1 Fails: Intention Requires Perceived Reason**
      *   **The Block:** To genuinely form an intention to X, you need to perceive (or anticipate) having a *reason* to X *at the time of acting*. The money is a reason to *intend* to X, *not* a reason *to X* (swallow the flu pill). In fact, the money makes swallowing the pill *less* reasonable (why suffer if you already have the money?). "Deciding" feels impossible because there *is no reason to act* – only a reason to *pretend* to intend. Genuine intention requires a perceived link to future action.
      *   **Key Concepts:** **"Intention is action-oriented"** (Bratman), **"The Guise of the Good"** (acting under the idea something is good/reasonable). The offer severs the link between the intention and any perceived future good/reason for action.

  3.  **Why Case 2 Fails: Contamination & Identity Threat**
      *   **The Block:** Here, the problem isn't the *absence* of a future reason (you still have health reasons to run). The problem is **"Motivational Contamination"** or **"Identity Threat via Instrumentalization."**
          *   The money paid *for forming the intention* reframes the *reason for the run itself* when 6pm comes. The run is no longer *just* "something I do for my health" (an identity-concordant act). It's now also "something I got paid upfront to commit to doing." This *instrumentalizes* the action.
          *   Acting on it at 6pm can feel like *complying* with a paid obligation rather than *expressing* your own desire for health. This threatens your sense of autonomy ("I'm doing this because I was paid to decide, not because *I* genuinely want to run *now*").
          *   The money paid *for the intention* retroactively makes the run feel "bought," diminishing its intrinsic value or identity-expressive quality. This is similar to, but distinct from, the **"Overjustification Effect"** (paying for an intrinsically motivating activity reduces intrinsic motivation). Here, it's paying for the *mental state* contaminating the *action* it points to.
      *   **Key Difference from Case 1:** In Case 2, you *could* technically form the intention because there *is* a future reason. But the *nature* of the intention is poisoned; it feels inauthentic or instrumentally driven, making acting on it aversive.

  4.  **Why Case 3 (Deposit Contract) Works: Incentivizing Action, Scaffolding Intention**
      *   **The Success:** The deposit contract works because it directly incentivizes the *action* ("Log a run by Sunday"), *not* the mental state. It bypasses the paradox of directly incentivizing intention.
      *   **The Mechanism:** The potential loss ($200) creates a *new, salient reason to act*. This external reason **scaffolds** the formation of a genuine intention. The intention feels "more real" because:
          *   It's grounded in a concrete reason *to act* (avoid losing money).
          *   It helps overcome *akrasia* (weakness of will). The penalty makes the cost of *not* acting salient.
          *   It's *consistent* with forming an intention based on a reason (avoiding loss).
          *   It doesn't necessarily *contaminate* the identity-expressive aspect of running. The run itself might still be done for health; the penalty just helped ensure action occurred despite momentary weakness. The penalty is a reason *to overcome the barrier to acting on your existing reasons*.
      *   **Key Concept:** **"Scaffolding Action to Foster Intention."** The incentive targets the behavioral outcome, indirectly supporting the formation of a congruent intention grounded in the incentive *as a reason for action*.

  5.  **The Boundary: What Flips the Sign?**
      The critical difference between "poisoning" and "producing" offers is whether the incentive:
      *   **Targets the Mental State Directly (Poison):** (Cases 1 & 2) Offering reward/punishment *for having the state itself* (intention, desire). This severs the state from its natural grounding (reasons for action/truth) or contaminates it.
      *   **Targets the Action or Outcome (Potential Scaffold):** (Case 3) Offering reward/punishment *for performing the action* (or achieving the outcome) that the mental state is *about*. This can provide a concrete reason that helps form or sustain the intention *towards that action*.

  6.  **The Family Gathering Variant: Solving by Changing the World**
      *   **Why it Works:** This is brilliant. The stranger *isn't* paying you to *intend*. He's changing the *external circumstances* so that *if* you intend, your action (taking the pill) will have a **new, powerful reason**: expressing commitment to your family, sharing an experience, fulfilling a social role created by their presence.
      *   **The Move:** This is **"Reason Embedding"** or **"Creating Action-Based Reasons."** You aren't trying to force the mental state directly. You are manipulating the *context of the future action* so that *acting* on the intention (if formed) will have significant positive meaning/reason (family pride, connection). This makes forming the intention *genuinely reasonable*. The incentive isn't *for the intention*, it's a *consequence of the action* enabled *by* the intention.
      *   **Is it a Solution?** Absolutely. It directly addresses the core problem: intention requires a perceived reason for the action. The stranger creates that reason *in the world* contingent on you having made the decision. The decision/intention becomes the gateway to accessing that new, powerful reason for action.

  7.  **Intention vs. Belief: Different Brokenness**
      *   **Belief:** Offering money to *believe* your team will win highlights a different constraint: **Doxastic Involuntarism**. We (generally) cannot simply *choose* beliefs based on incentives; beliefs aim at truth. An incentive to believe creates a *reason to want to believe* or *pretend to believe*, but not a reason *for the truth of the belief itself*. This clashes with the core nature of belief formation (evidential reasons). The brokenness is about the **constitutive aim of belief** (truth) vs. **intention** (action).
      *   **Intention:** While not directly "chosen" at will, intentions *are* formed based on practical reasons *for action*. The breakdown in your cases is about the *nature* of the reasons offered (reasons for the state vs. reasons for the action) and contamination, not primarily about involuntarism per se (though that's a background condition).

  **Summary & Suggested Terminology:**

  *   **Core Pattern:** The **Paradox of Incentivized Mental States** (specifically for intention/desire).
  *   **Failure Mode 1 (Case 1 - No Reason): Incentive-Induced Reason Gap.** The offer removes/severs the perceived reason for the future action, making genuine intention impossible.
  *   **Failure Mode 2 (Case 2 - Contamination): Motivational Contamination / Identity Threat via Instrumentalization.** The offer reframes the future action as an instrumental obligation, undermining its authenticity and making acting on the intention aversive.
  *   **Success Mode (Case 3): Action-Targeted Scaffolding.** Incentives targeting the *action* provide concrete reasons that support the formation of congruent intention.
  *   **Solution Strategy (Family Case): Reason Embedding / Creating Action-Based Reasons.** Changing the external world contingent on the mental state to provide a powerful, genuine reason *for the future action* that makes forming the intention rational and authentic.
  *   **Boundary:** Incentives **poison** when they target the *state itself*. They **scaffold** when they target the *action* the state is about.

  This pattern is fundamental to designing effective behavioral interventions. Avoid paying for mental states; pay for actions or outcomes, or better yet, structure the environment (like the family gathering) so that desired actions naturally generate their own powerful reasons, making the intention a genuine response to the situation.
