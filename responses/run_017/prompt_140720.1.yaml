  We are going to design a case study that meets the specifications. The goal is to have a scenario where an animal gets the Popperian payoff (bad options are eliminated without the animal paying the full cost) without having an inner environment for simulation. The animal should be Skinnerian in mechanism: learning by conditioning, without explicit representation or offline simulation.

  Let's choose an animal and a situation. We need an external surrogate that takes the hit for bad trials. Some candidates:

  - **Hermit crabs and shell switching**: They try out new shells, but they do so by physically entering them, which might be costly if the shell is bad (e.g., too heavy, doesn't fit). However, we need a surrogate that takes the hit without the crab having to fully commit.

  - **Jumping spiders and web vibrations**: Spiders sometimes pluck the web of a potential prey to see if it's alive or dead. The vibration tells them without having to attack. But is that Popperian? The spider is testing without full attack, but it might be a direct perceptual cue.

  - **Bowerbirds and their bowers**: They build bowers and then observe how females react. The female's reaction is a test of the bower without the male having to commit to mating. But the bower is built by the bird, so it's an artifact.

  - **Ants and bridge building**: Some ants build living bridges with their bodies. When they form a bridge, the ones on the bottom bear the cost (e.g., cannot forage). But the bridge is built by the ants themselves, so it's a distributed cost.

  - **Tool use in capuchins**: They use stones to crack nuts. If they choose a bad stone, it might break and not crack the nut, but the cost is that the nut isn't opened. The stone isn't a surrogate that takes the hit for the animal.

  We need a surrogate that is external and takes the hit. Let me think of an example from biology:

  **Case: Octopus and coconut shells**

  Octopuses are known to use coconut shells as portable shelters. But let's design a situation.

  Instead, consider:

  **Case: Trap-building predators**

  But that might be too complex.

  Another idea: **Beavers and dam building**. When they build a dam, they test the structure by pushing on it. If it breaks, they get wet and have to rebuild. But that's still the animal paying the cost.

  We need a surrogate that is separate. How about:

  **Case: Caddisfly larvae and their cases**

  Caddisfly larvae build protective cases from materials in their environment. They can abandon a case if it is damaged or unsuitable. The case is the surrogate: if a predator attacks, the case takes the hit and the larva can escape. But that's more about protection than testing actions.

  We need a scenario where the animal is trying out different actions and the surrogate filters the bad ones.

  Let me design a scenario with an animal that uses a disposable tool or a probe.

  **Case: A primate using a stick to test for electric shock**

  But that requires an experimental setup. The problem says: "a setup a comparative psychologist or field biologist could plausibly actually run." So we can design an experiment.

  How about:

  **Scenario: A rat in a maze with a surrogate probe**

  But that might be too artificial.

  We want something naturalistic. Let's use:

  **Case: Meerkat sentinel behavior**

  In meerkat groups, one individual acts as a sentinel. If there is a predator, the sentinel gives an alarm call. The other meerkats can then run to safety. The sentinel is at risk, but the group benefits. However, the sentinel is another animal, so it's a social surrogate.

  But then, the meerkat that isn't the sentinel is getting the Popperian payoff without paying the cost. The cost is borne by the sentinel (if attacked). But the mechanism: the non-sentinel meerkats are just responding to the alarm call by conditioning. They don't simulate anything.

  Now, is the sentinel a surrogate? For the group, yes. But for an individual meerkat, when it is foraging, it relies on the sentinel. So the sentinel is the one that might pay the cost of a bad hypothesis (e.g., if the sentinel fails to detect a predator, the forager might die; but if the sentinel does detect, the forager escapes without having to check for itself).

  But the forager doesn't generate hypotheses; it just reacts to the call. We need the animal to be generating candidate actions.

  Alternative: **A bird using a tool to extract insects from a log, and having multiple tools to try.**

  But if the tool breaks, the bird just tries another one. The cost is minimal: it loses a tool, but not its life. But the tool isn't a surrogate that tests an action; it's the means of performing the action.

  We need the surrogate to test the outcome of an action without the animal having to perform it.

  How about:

  **Case: Jumping spider's silk tether**

  Jumping spiders use a silk tether when they jump. If they miss the target, they don't fall; they are caught by the silk. So the silk tether is a surrogate that takes the cost of a bad jump (falling to death) by allowing the spider to climb back. The spider can then try a different jump.

  Mechanism: The spider doesn't simulate the jump internally. It just jumps, and if it fails, the silk saves it. Then it can try again. The silk is the surrogate that absorbs the cost (the fall) without the spider dying.

  But the spider still jumps, so it pays the cost of energy and time, but not the full cost of death. The silk is a safety net.

  Now, the Popperian payoff: the bad outcome (falling) is avoided by the silk, so the spider doesn't die and can try another hypothesis (another jump angle or target). Without the silk, a bad jump would be fatal, but with it, the spider can learn from the failed jump without dying.

  But is the spider generating multiple hypotheses? In the Popperian sense, it should have candidate actions and select one after internal screening. Here, the spider just jumps, and if it fails, it tries again. There's no pre-screening; the trial is real, but the consequence is mitigated.

  So the payoff is similar to Popperian: the creature doesn't pay the full cost of a bad trial. But the mechanism is different: the cost is absorbed by an external structure (the silk) rather than by internal simulation.

  This seems to fit.

  Let's write the scenario:

  **Scenario:**

  The jumping spider (Salticidae) hunts by leaping onto prey. Before jumping, it attaches a silk tether to the substrate. If the jump misses or the prey is dangerous (e.g., a predator in disguise), the spider is caught by the tether and can climb back to safety. Without the tether, a failed jump could result in a fatal fall or an attack. With the tether, the spider survives the failed attempt and can try a different approach, such as jumping from another angle or abandoning the hunt. The silk tether acts as a disposable surrogate: it bears the physical cost of the failure (the fall) without the spider dying. The spider's learning is entirely Skinnerian: it learns from the consequences of actual jumps, but the tether reduces the cost of failure from death to a minor energy expenditure and time loss.

  Now, let's break it down.

  a. **Dennett's criteria: mechanism vs. payoff**

     - **Mechanism reading**: What must be inside the creature? The spider has no inner environment for simulating jumps. It relies on real trial and error. The behavior is shaped by conditioning: successful jumps reinforce the behavior, and failed jumps (even with the tether) may lead to avoidance. The silk production and tether use are innate or conditioned, but there is no evidence of internal modeling. Thus, mechanism is Skinnerian.

     - **Payoff reading**: What does the creature get? The spider reaps the Popperian benefit: bad jumps (hypotheses) are eliminated without the spider paying the full price (death). The surrogate (silk tether) "dies in its place" by absorbing the fall, allowing the spider to try again. The outcome is that the spider can explore more options and learn with reduced risk.

     Verdict: 
     - Mechanism: Skinnerian (no inner model, just conditioning).
     - Payoff: Popperian (the cost of bad trials is offloaded).

  b. **Single feature doing the work**: The disposable external surrogate (silk tether) that physically intercepts the consequence of failure.

  c. **Ablate it**: Remove the silk tether. Without the tether, the spider must jump without a safety net. Each failed jump risks death, so it becomes classic costly Skinnerian trial and error. The spider might be more cautious, but it cannot afford many trials. The collapse is total: the Popperian payoff disappears, and the system reverts to pure Skinnerian with high costs.

  d. **Defence (Dennettian responses)**:

     (i) Redraw the boundary: The extended system (spider + silk tether) is the Popperian creature. The silk is part of the spider's "equipment," so the inner environment includes the silk as an externalized simulation. But the silk isn't a model; it's a physical safety device. This seems a stretch.

     (ii) Payoff was never the criterion: Dennett's rungs are defined by the mechanism, not the payoff. So even if the payoff is similar, the spider is still Skinnerian because it lacks the internal machinery. This is strong and probably correct.

     (iii) The trick is a designed good trick: The silk tether is an evolved adaptation (Darwinian rung), so it doesn't count as a Popperian upgrade. The spider doesn't invent it; it's innate. Thus, it belongs to the Darwinian rung, not as a counterexample to the Popperian rung.

     Strongest: (ii) because the rungs are defined mechanistically. Closest to verbal move: (i) because the silk isn't simulating anything; it's just a physical buffer.

  e. **Bonus: Trouble for Gregorian rung?** Can a Skinnerian creature import a good trick? In this case, the silk tether is innate (Darwinian), not imported. But if we imagine a spider learning to use a human-provided safety line (e.g., in an experiment), that might be Gregorian. However, if the spider conditions to use the line without understanding, it's still Skinnerian. So yes: a Skinnerian creature can use a tool (a good trick) by conditioning, without concepts. But Dennett might argue that tool use requires at least Popperian capacity. However, in this case, the spider uses the silk innately, so it's Darwinian, not Gregorian. For Gregorian, we need cultural transmission. So no direct trouble for Gregorian here.

  Now, let's write it up.
answer: |-
  ### Case Scenario: Jumping Spider with Silk Tether

  **Scenario:**  
  A jumping spider (e.g., *Portia fimbriata*) hunts by leaping onto prey from elevated surfaces. Before jumping, it instinctively secures a silk tether to the substrate. If the leap misses (e.g., due to misjudged distance or evasive prey), the spider is caught by the tether, avoiding a fatal fall. It then climbs back up, repositions, and may leap again from a modified angle or abandon the hunt. Without the tether, a failed jump risks death from impact or predation. The tether acts as a disposable surrogate: it absorbs the physical cost of failure (the fall), sparing the spider. The spider learns through operant conditioning—successful jumps reinforce the behavior, while failures (even with tether recovery) may lead to avoidance of similar leaps. There is no evidence of internal simulation; behavior is shaped solely by real-world outcomes, with the tether reducing the cost of errors. A naïve observer might label this "Popperian" because the spider survives bad leaps and "tries alternatives," but the mechanism is purely reactionary conditioning to immediate sensory feedback (e.g., tension on silk, visual cues).

  ---

  ### Demonstration

  **a. Dennett's criteria: Mechanism vs. Payoff**  
  - **Mechanism reading (Skinnerian verdict):** The spider's behavior is driven by innate reflexes and conditioning. The silk tether is a fixed action pattern; no inner environment models outcomes or screens hypotheses. Learning occurs only through real consequences: e.g., a fall caught by silk reinforces caution, while a successful jump reinforces aggression. No representations, offline simulation, or problem-solving are involved—just stimulus-response associations tuned by reinforcement.  
  - **Payoff reading (Popperian verdict):** The spider reaps the Popperian benefit: bad hypotheses (e.g., "leap from this angle") are eliminated without the spider paying the full price (death). The tether acts as an external "inner environment," where the cost of failure is offloaded to a disposable surrogate (the silk). This allows iterative testing of actions (e.g., repositioning after failure) that would be lethal in a pure Skinnerian setup.  
    **Verdict divergence:** Mechanistically Skinnerian (no internal model), but functionally Popperian (costly trials are pre-screened externally). The case forces apart mechanism and payoff: the benefit is achieved without the machinery.

  **b. Single feature doing the work:**  
  The disposable external surrogate (silk tether) physically intercepts the consequence of failure, converting a lethal outcome into a recoverable error.

  **c. Ablation:**  
  Remove the silk tether. The spider now leaps without a safety net, collapsing into classic costly Skinnerian trial and error: failed jumps result in death or severe injury, drastically reducing opportunities for learning. The spider cannot "try alternatives" after failure; exploration is constrained by high risk (e.g., innate caution may reduce leaps, slowing learning). The collapse is total—the Popperian payoff vanishes, reverting to pure operant conditioning with high somatic costs.

  **d. Defence (Dennettian responses):**  
  - **(ii) Payoff ≠ criterion (strongest):** Dennett defines rungs by mechanism, not payoff. Thus, the spider remains Skinnerian because it lacks internal hypothesis-testing. This preserves the taxonomy: the rungs describe cognitive upgrades, not convergent outcomes.  
  - **(iii) Trick is Darwinian (closest to verbal move):** The silk tether is an evolved adaptation, so the "good trick" belongs on the Darwinian rung. Calling this Popperian confuses evolved hardware with individual cognitive software—a verbal sleight that misapplies the framework.  
  - (i) Extended system is weak here: Redrawing boundaries to include the silk as "part of the individual" is strained—silk is a passive tool, not an active simulator, and Dennett’s "inner environment" implies internal computation, not external physics.  

  **e. Bonus: Gregorian trouble?**  
  Yes. If a spider *learned* to use an artificial tether (e.g., a human-supplied thread) via conditioning, it would "import a good trick" (Gregorian) while remaining Skinnerian. The trick is acquired through external reinforcement (e.g., thread use is rewarded by survival), not insight. This shows Gregorian benefits (cultural tools) can arise via Skinnerian mechanisms, challenging the claim that Gregorian upgrades inherently require higher rungs.

  ---

  **Design Notes:**  
  - **No smuggled intelligence:** The spider’s flexibility is limited to conditioned responses (e.g., avoiding heights after falls); no "understanding" of physics or planning is implied.  
  - **Human experimenter?** Not needed—silk use is innate in jumping spiders. Field studies (e.g., Robert Jackson’s work) confirm this behavior in natural settings.  
  - **Calibration:** This case highlights the taxonomy’s slippage between mechanism and payoff, exposing a tension in Dennett’s framework. The Popperian benefit emerges from external scaffolding, not cognitive ascent.
