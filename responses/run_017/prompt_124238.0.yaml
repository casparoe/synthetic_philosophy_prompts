  - **Key mechanisms:**
    - **Stem as a differentiator:** A visible "stem" element (vertical or near-vertical) is mandatory to distinguish `a` from `o`. This stem need not be traditional (e.g., stencil breaks or blackletter wedges count).
    - **Lowercase DNA rejection:** Glyphs that are capitals in disguise (small-cap `A`) or non-Latin (Greek `α`) fail, regardless of shape.
    - **Contextual flexibility:** Recognition *in the grid/word context* overrides standalone ambiguity (e.g., the blackletter `a` passed despite poor solo readability).
  - **Non-factors:** Storey count (single/double), counter closure (solid black/slit), stroke style (serif/sans), or grid harmony don't affect the "is it an `a`" verdict (only "does it belong" checks grid fit).

