prompt: |-
  Science journalist here, I write a lot about expertise and I keep hitting the same thing in interviews and I dont have a word for it, or at least not one I trust.

  Three cases. A neonatal nurse who can intubate a preemie in seconds, and who can watch a resident and say "too deep, you're going in too deep" before anything has visibly gone wrong. But the account she gives of what she is doing is not just incomplete, it is false: the angle she describes is not the angle her hands use. I have seen this on video, slowed down. She watches it, says "huh, I guess I do do it that way," and then nothing changes. She keeps the old description, her hands keep doing the other thing, and she is still the best person in the room. Second: a guy who rebuilds vintage transmissions. Same shape. He taught me to find a gear whine by sound, and every rule he stated while doing it was contradicted by what he actually did; when I pointed that out he said "that's what the manual says, I'm telling you what I do." Third, the one I think is genuinely different: a chess player who can give a reason for every move, correctly, in a way that survives a stronger player's questions, and who is still only a middling player.

  So what I am after is whatever the nurse and the mechanic have and the chess player does not — or the reverse, I'm not committed. It isn't just "skill" and it isn't just "can't put it into words," because she can be made to see it and seeing it does nothing: the correct description neither helps her nor, apparently, is what she was using. Is there an established concept for this, the thing that survives being told a false theory of itself? And whatever it's called I need the edges, not the label. Is it one thing or several? How do I tell, in an interview, whether Im looking at the nurse's case or the chess player's? And is the fact that the description does no work actually evidence about what the knowledge is, or is it just evidence that she's bad at introspecting?
reasoning: |-
  Okay, the user is a science journalist writing about expertise. They've observed a pattern across different experts: a neonatal nurse who intubates preemies effectively but gives an incorrect description of her technique, a mechanic who fixes transmissions with rules that contradict his actions, and a middling chess player who can articulate reasons for moves that hold up under scrutiny. The journalist needs a concept to describe what the nurse and mechanic have that the chess player lacks.

  First, I recall the literature on expertise. The nurse and mechanic seem to exemplify tacit knowledge, as defined by Polanyi—knowing more than we can tell. Their skills are procedural and embodied, not easily verbalized. Even when shown video evidence, the nurse doesn't correct her explanation, suggesting the verbal account isn't integral to her performance. The mechanic prioritizes action over manual instructions, indicating his knowledge is in the doing, not the saying.

  The chess player, however, can verbalize strategies but lacks high-level skill. Here, explicit knowledge might mask deficiencies in intuition. Their articulacy could be post-hoc rationalization, not true insight into effective play. This contrasts with the nurse and mechanic, whose effectiveness lies beyond verbal description.

  The user also asks about distinguishing cases in interviews. Key indicators include observing contradictions between stated methods and actions, testing if verbal correction changes performance, and seeing whether articulation improves with expertise. For the nurse, the description is irrelevant to her skill, whereas the chess player's articulation doesn't translate to mastery.

  Underlying needs: The journalist likely seeks to frame a story around the limits of self-awareness in experts. They might want to explore how true expertise operates beyond conscious articulation, using examples to highlight that what matters is the action, not the explanation. They may also need to caution against mistaking articulate theories for competence, especially in fields where outcomes are critical, like medicine or mechanics.
answer: |-
  Based on your vivid examples and the core questions you're wrestling with, you're hitting on a fundamental and well-discussed aspect of expertise, though the *specific interaction* you describe (the description being demonstrably false yet ineffective) is a particularly sharp angle. Here's a breakdown of the established concepts, their nuances, and how to navigate the edges:

  **Core Concepts & Their Interplay:**

  1.  **Tacit Knowledge (Polanyi):** This is the cornerstone. It's knowledge that cannot be easily articulated, codified, or transferred through language alone. It's embodied, intuitive, sensory, and often procedural ("know-how" vs. "know-that"). The nurse's feel for the tube depth and the mechanic's ear for the gear whine are textbook tacit knowledge. Polanyi's famous phrase: *"We know more than we can tell."* This directly addresses the "thing that survives being told a false theory of itself" – the tacit skill operates independently of, and often despite, the verbal account.

  2.  **Procedural Memory / Skill Acquisition (Fitts & Posner / Dreyfus & Dreyfus):** Expertise often involves moving through stages:
      *   **Cognitive:** Reliant on explicit rules, slow, conscious effort.
      *   **Associative:** Rules internalized, smoother performance, fewer errors.
      *   **Autonomous:** Skill becomes automatic, fluid, intuitive, requiring minimal conscious attention. The nurse and mechanic are firmly in the **Autonomous** stage. Their actions are governed by highly optimized, subconscious motor programs and pattern recognition honed through vast experience. Verbal descriptions often lag behind or are simplified remnants of earlier learning stages.

  3.  **Declarative Knowledge vs. Procedural Knowledge:** This is a key distinction for understanding the chess player.
      *   **Declarative:** "Knowing that" – facts, rules, concepts (e.g., chess principles, the manual's instructions).
      *   **Procedural:** "Knowing how" – the ability to perform skilled actions (e.g., intubating, diagnosing a whine, making the *best* chess move).
      The chess player has strong *declarative* knowledge of chess principles and can articulate plausible reasons. However, their *procedural* knowledge – the intuitive pattern recognition, deep calculation, positional understanding, and strategic foresight of a master – is underdeveloped. They lack the "deep smarts" (Perlow) or "intuition" (Kahneman's System 1) that enables superior performance.

  **Why the False Description Persists and Does No Work:**

  *   **Epiphenomenal Reporting:** The verbal description isn't *causing* the action; it's a post-hoc rationalization or a simplified story the expert tells themselves and others. The *real* control lies in the tacit, procedural system.
  *   **Cognitive Economy:** Generating an accurate, detailed verbal account of complex, autonomous actions is cognitively expensive and unnecessary for performance. The brain defaults to a "good enough" story that feels plausible.
  *   **Learned Scripts:** Experts often learn standard verbal explanations early on (like the manual, textbooks, or basic training). These become ingrained scripts, even as their actual practice evolves far beyond them. The mechanic explicitly states this: *"that's what the manual says."*
  *   **Lack of Metacognitive Access:** We simply don't have direct conscious access to the fine-grained neural processes governing highly automated skills. We infer our processes, and inferences can be wrong.
  *   **"Seeing" vs. Integrating:** Watching the video provides *declarative* knowledge ("Oh, I *do* do that"). But this doesn't automatically rewrite the deeply ingrained *procedural* knowledge or the associated verbal script. Changing the autonomous skill would require deliberate, conscious deconstruction and re-practice – which is inefficient and often detrimental to performance until fully re-automated. Why fix what isn't broken?

  **Distinguishing the Nurse/Mechanic from the Chess Player in Interviews:**

  1.  **Observe the Contradiction:** This is your best tool. Don't just ask *what* they do, watch *how* they do it. Look for mismatches between the stated "rules" and the observed actions, especially under pressure or time constraints. The expert who *acts* effectively despite a contradictory description likely relies on tacit knowledge.
  2.  **Probe the "Why" Deeply:** Ask *how* they know what they know *in the moment*.
      *   **Tacit Expert (Nurse/Mechanic):** Answers will be vague, sensory, or metaphorical: "It just *feels* right," "I hear the pitch change," "My hands know," "Experience tells me," "It's a hunch." They may struggle or default to simplistic rules when pressed for specifics of *how* they perceived/detected something.
      *   **Declarative Expert (Chess Player):** Answers will be logical, principle-based, refer to explicit rules or concepts: "Because it controls the center," "To develop my bishop," "To create a weakness on f7," "Because the principle says..." They can articulate chains of reasoning readily.
  3.  **Test the Impact of Verbal Correction:** If you *show* the contradiction and provide the "correct" description:
      *   **Tacit Expert:** Performance remains unchanged. The new description doesn't integrate or improve the skill. The old description persists verbally. (As with your nurse).
      *   **Declarative Expert (if lacking skill):** They might *try* to apply the new verbal rule, but it may not translate to improved performance (they might overthink or misapply it). A *truly skilled* expert (e.g., a chess master) *can* often integrate new declarative knowledge *if* it's accurate and relevant, but their core strength remains procedural/intuitive.
  4.  **Assess Articulation vs. Performance:** High performance *without* clear articulation strongly suggests dominant tacit knowledge. Clear articulation *without* high performance suggests strong declarative knowledge but underdeveloped procedural skill/intuition. (The chess player).
  5.  **Domain Dependence:** Consider the nature of the task. Highly sensory, motor, or pattern-based tasks in complex, dynamic environments (medicine, mechanics, sports, firefighting) are fertile ground for tacit knowledge. Tasks with clear rules and static positions (like basic chess analysis) favor declarative knowledge, but *mastery* still requires deep tacit intuition.

  **Is it One Thing or Several? How is the Description's Uselessness Evidence?**

  It's **a constellation of related phenomena**, primarily centered on **Tacit Knowledge operating within Autonomous Skill**. The key components are:
  *   The existence of non-verbal, embodied knowledge/skill.
  *   The automation of that skill, freeing conscious attention.
  *   The difficulty/cost of introspecting accurately on automated processes.
  *   The persistence of simplified or outdated verbal scripts.

  **The description's uselessness is strong evidence for the nature of the knowledge:**

  1.  **It Demonstrates Independence:** The skill operates effectively without needing the "correct" verbal description. This shows the core knowledge *isn't* declarative; it's procedural/tacit.
  2.  **It Highlights Automation:** Conscious verbalizing isn't part of the execution loop for that specific skill component.
  3.  **It Points to the Source:** The knowledge resides in the body, senses, and deeply practiced neural pathways, not primarily in the linguistic/conceptual centers of the brain used for explanation.
  4.  **It Distinguishes from Poor Introspection:** While poor introspection is *part* of it, the key evidence is that *even when given accurate introspection* (via the video), it doesn't change the skill or the preferred explanation. This goes beyond simple inability to introspect; it shows the *irrelevance* of that specific declarative account to the procedural performance.

  **In Summary:**

  *   **What the Nurse & Mechanic have:** Highly developed **Tacit Knowledge** embedded within **Autonomous Procedural Skill**. Their expertise is primarily intuitive, embodied, and operates independently of verbal descriptions.
  *   **What the Chess Player lacks (relative to masters):** Sufficiently deep **Tacit Knowledge/Intuition** governing high-level play. They have strong **Declarative Knowledge** which allows articulate *post-hoc* reasoning, but it doesn't equate to the master's intuitive grasp.
  *   **The "Thing" that survives:** The **Autonomous Procedural Skill** itself, governed by Tacit Knowledge.
  *   **How to tell in an interview:** **Look for the performance-description gap.** Observe actions vs. stated rules, probe for sensory/vague vs. logical/explicit explanations of "how they knew," and test if correcting the description changes anything. High performance + vague/contradictory description + immunity to verbal correction = Dominant Tacit Knowledge in Autonomous Skill.
  *   **The description's uselessness as evidence:** It powerfully demonstrates that the core knowledge is *procedural/tacit* and *automated*, not reliant on (or easily modified by) declarative statements.

  **Terms to Use:** Your core concept is **Tacit Knowledge** operating within **Autonomous Skill**. Phrases like "the autonomy of expertise," "the irrelevance of verbal accounts to embodied skill," or "knowledge beyond words" capture the essence. The persistence of the false description highlights the "**epiphenomenal nature of expert self-report**" for highly automated skills. The chess contrast underscores the difference between **declarative knowledge about a domain** and **procedural mastery of it**.
