  First, I need to unpack their core dilemma: does *Memento* illustrate, critique, or contradict Dennett's theory? Their flip-flopping points are crucial—they've identified four key tensions: outsourcing memory via props (Teddy's authorship vs. Leonard's agency), narrative inertia (lack of story stability), truthfulness of the narrative (Sammy Jankis fabrication), and the tragic ending implying a "real" self. 

  The user's deeper need seems to be avoiding oversimplification. They want to honor both the film's complexity and Dennett's theory without force-fitting either. They also need practical presentation elements: which clips to show, where the philosophy illuminates the film, and where the film resists it. The "authorship gap" they coined is smart—it needs addressing since Teddy's manipulation challenges whether narrative selves require personal authorship. 

  For the tragic ending paradox: if the self is just a story, why does Leonard's choice feel like betrayal? The film's emotional weight suggests something beyond Dennett—perhaps the suffering of being trapped in a false narrative, which the philosophy doesn't capture. This is where *Memento* adds value: it dramatizes the agony of narrative fragility. 

  Clip-wise, I'll suggest the tattoo ritual (shows physicalized narrative), Teddy's "you don't know" moment (authorship gap), and Leonard burning the photo (self-deception). These scenes visually dissect Dennett's ideas while showing where the film pushes back. 

  The user's "inertia" point about habits vs. story is sharp. Sammy's institutionalization versus Leonard's functionality hints that habits (like Leonard's investigation skills) may anchor the self when narrative fails. Dennett underplays this—the film shows narrative isn't enough without embodied patterns. 

  Ultimately, *Memento* isn't just a "music video" for Dennett. It stress-tests the theory by exposing vulnerabilities: narrative's manipulability, the pain of losing authorship, and the human need for purpose even via false stories. The tragedy isn't metaphysical betrayal but the horror of conscious self-deception. That's the film's original contribution.
answer: |-
  Okay, *this* is an excellent question – and you've nailed the core tensions perfectly. *Memento* absolutely engages with Dennett's "Center of Narrative Gravity" (CNG), but it's less a straightforward illustration and more a brutal stress-test, exposing potential cracks and dark implications. Let's break down your points and build a presentation that respects both the film and the philosophy.

  **Core Premise:** *Memento* doesn't *refute* Dennett; it **interrogates** him. It asks: "Okay, if the self *is* this narrative construct, what happens when the machinery for constructing and maintaining it breaks down? What are the vulnerabilities?"

  **Your Flip-Flops & The Answers (For Your Presentation):**

  1.  **Outsourcing Narrative (Polaroids/Tattoos): Still a CNG?**
      *   **Dennett:** The "narrative" doesn't require *conscious* internal monologue. It's the *explanatory structure*, however stored or accessed. Leonard's system *is* his narrative engine – it's distributed cognition. The tattoos *are* his internal monologue made external and permanent.
      *   **Film's Pushback:** This highlights a **crucial dependency**. Leonard's CNG is *fragile* and **externally manipulable** (leading straight to point 2). It also questions **agency**: Is he *constructing* the narrative or just *reacting* to its latest physical artifact? The process feels less organic, more mechanical.
      *   **Clip Suggestion:** Show the scene where he meticulously adds a new fact (like "FACT 6: CAR LICENSE SG137IU") as a tattoo. **Point:** This *is* his narrative construction in action, but it's brittle and physical.

  2.  **The Authorship Gap (Teddy as Puppeteer):**
      *   **This is your KEY insight.** Dennett focuses on the narrative *as told by the subject* (first-person perspective is crucial). Teddy exposes the **vulnerability**: If the narrative sources (notes, photos, memories) can be *controlled by others*, they can hijack your CNG. Leonard isn't the author; he's the editor forced to work with poisoned source material.
      *   **Film's Contribution:** *Memento* **dramatizes the horror of losing narrative authorship**. It shows how easily identity can be weaponized. Teddy doesn't just feed facts; he crafts a *role* for Leonard ("You're the avenger").
      *   **Clip Suggestion:** The scene where Teddy confronts him: "You don't *know* who you are, Leonard... You wander around... reading notes... making up a story... Do you even know *why* you need to look for the guy?... So you can *start* looking again." **Point:** This is the "Authorship Gap" in action – Teddy explicitly claims control over Leonard's purpose/narrative.

  3.  **Narrative Inertia vs. Character (Habits):**
      *   **Dennett:** The narrative *should* have inertia – it explains past actions and predicts future ones, creating a sense of continuity. Leonard's narrative has *negative* inertia – it's constantly reset.
      *   **Film's Insight:** *Memento* suggests that **beneath the shattered narrative, there might be persistent dispositions/habits.** Leonard's core *drive* (to find "John G"), his *method* (obsessive note-taking, investigation), his *emotional state* (grief, rage, frustration) persist even when the specific facts change. The Sammy Jankis story, true or not, functions as a *habitual template* for understanding his condition.
      *   **Clip Suggestion:** Show Leonard instinctively checking his pockets for notes, or his intense focus while investigating a clue, even when momentarily confused. **Point:** The *character* (drives, methods, emotions) persists even when the *specific narrative* doesn't.

  4.  **Truth of the Narrative & Self-Creation/Erasure:**
      *   **Dennett:** The CNG is a *useful fiction*. Its "truth" is pragmatic – does it help you navigate the world? Leonard's Sammy story *works* as an explanation until it conflicts with evidence (Natalie's revelation). His final lie ("He is the one. Kill him") *is* self-creation: he engineers a purpose.
      *   **Film's Pushback & Tragedy:** Here's the rub. **The tragedy isn't metaphysical ("betraying a real self"), it's experiential.** Leonard *knowingly* chooses a lie that traps him in a cycle of violence and self-deception. He trades truth for purpose. He *could* have chosen a different narrative ("Find peace," "Help others"), but his *persistent drives* (vengeance, the *need* for purpose) lead him to choose the destructive one. The horror is his *awareness* of the choice ("Do I lie to myself to be happy? ... Yes, I will."). He becomes the author of his own imprisonment.
      *   **Clip Suggestion:** Show the final sequence: Leonard burning Teddy's photo, writing the false "FACT 6", and then the reverse shot of him walking towards the camera, determined, as he says "Now... where was I?" **Point:** This is deliberate self-deception as self-creation for existential survival. The tragedy is the *content* and *consequences* of the narrative he chooses, not its lack of a "soul" foundation.

  **The Ending & The Tragedy:**
  *   **Why it's Tragic on Dennett's Terms:** The film agrees the self is narrative. The tragedy is that Leonard's *chosen narrative* is one of perpetual suffering, violence, and bad faith. He *could* construct a different, more humane narrative (he has the cognitive tools – notes, tattoos). But his ingrained grief, rage, and need for vengeance *constrain* his narrative choices. He chooses a story that denies him peace or growth. The tragedy is the *loss of possibility* and the *conscious embrace of a destructive fiction*.

  **What the Film Adds to the Philosophy:**
  *   **Vulnerability & Manipulation:** *Memento* viscerally shows how fragile the narrative self is without robust memory/agency, and how easily it can be hijacked (Authorship Gap).
  *   **The Cost of Bad Faith:** It dramatizes the *existential suffering* and *ethical consequences* of constructing a self-narrative based on lies, especially when done knowingly for comfort or purpose.
  *   **The Role of Drives/Habits:** It suggests that deep-seated dispositions and emotions powerfully shape *which narratives* we find plausible or desirable, even when memory fails.
  *   **The Horror of Narrative Collapse:** It depicts the sheer terror and disorientation of losing the ability to construct a coherent narrative self, making Dennett's abstract idea viscerally real.

  **Your Presentation Flow (10 Min):**

  1.  **(1 min) Hook:** Briefly introduce *Memento* and Leonard's condition. Pose the central question: "Is Leonard's 'self' just the story he tells himself, even if it's written on his skin and controlled by others?"
  2.  **(2 min) Dennett's CNG:** Explain the core idea clearly (abstraction, explanatory power, no "soul-lump"). Use a simple analogy (CG of a chair).
  3.  **(5 min) *Memento* as Interrogation:** This is the meat.
      *   *Clip 1 (Tattoo Ritual):* Shows the *construction* of the distributed narrative self. "His CNG is literally skin-deep."
      *   *Point 2 (Authorship Gap):* Explain Teddy's manipulation. *Clip 2 (Teddy's "You don't know" speech):* "This exposes the vulnerability – when someone *else* controls your narrative sources, they hijack your center of gravity."
      *   *Point 3 (Inertia/Habits):* "But beneath the shattered story, *habits* persist: his drive, his method, his grief. The Sammy story is a *habitual template*." (Mention friend's point briefly).
      *   *Point 4 (Truth/Self-Deception):* "The Sammy story is a lie. His final choice is a *knowing lie*. He trades truth for purpose." *Clip 3 (Final Sequence - Burning Photo/Writing Lie/"Where was I?"):* "This is self-*creation* through self-*deception*. He chooses a prison."
  4.  **(1.5 min) The Ending & Tragedy:** "The tragedy isn't a 'real self' betrayed. It's that his *chosen narrative* is destructive. He *could* choose peace, but his pain locks him into vengeance. He knows he's lying, and that's the horror."
  5.  **(0.5 min) What *Memento* Adds:** "*Memento* doesn't just illustrate Dennett; it stress-tests him. It shows the fragility of the narrative self, the horror of losing authorship, the cost of bad faith, and how deep drives shape the stories we tell. It makes the philosophy visceral and terrifying."

  **Key Takeaway for Class:** *Memento* shows us that if the self is a story we tell, then **who controls the narrative controls the self,** and **the stories we choose have real, often devastating, consequences.** Dennett gives us the framework; *Memento* gives us the nightmare scenario.

  You've got a fantastic, nuanced grasp of this. Your "authorship gap" is spot-on. Lean into the complexity – that's what makes this presentation powerful. Good luck!
