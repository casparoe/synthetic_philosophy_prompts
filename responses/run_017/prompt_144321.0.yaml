prompt: |-
  hey — I'm a senior and I'm in this kind of wierd dual-credit class my school runs with the community college, half film studies and half "what even is a person" philosophy, and we watched Memento last week and I have not stopped thinking about it. I went down a rabbit hole afterwards and found Dennett's idea of the self as a center of narrative gravity — the thing where the self isn't a soul or a little thing in your brain but an abstraction defined by the stories told about you, the way a center of gravity is something you can locate and do real explanatory work with even though it isn't an extra lump of matter. I'm doing like a ten minute presentation on the film and I originally thought Memento was just a perfect illustration of that idea, but the more I think about it the more I'm not sure whether the movie illustrates it, secretly makes fun of it, or straight up assumes the opposite. Can you help me work out which?

  here's the stuff I keep flip-flopping on. One: Leonard can't hold a story together in memory at all, so he outsources it to polaroids, notes and tattoos — is that still a narrative self, just one propped up on props, or does it show that on Dennett's picture the story has to be something you actually re-tell to yourself over time rather than just re-read off your own hand? Two, and this is the bit my teacher waved away: does the story have to be yours, or can somebody else write it? Teddy is basically authoring Leonard's life — feeding him a version of events, pointing him at people — and Leonard is stuck as the audience of it. Dennett's version sounds like it needs you to be the teller, but if it doesn't, then anyone who can control the evidence lying around you can shove your center of gravity wherever they want, which seems like a real problem and not just a cute consequence. I've been calling that the authorship gap, idk if there's a real name for it. Three: my friend said what really matters is whether a story has any inertia — whether it resists getting rewritten by the next piece of evidence that shows up — and Leonard's has basically none, every new note can reconfigure his whole mission, but he still seems to have something like a character. Does that mean the self here is the *habits* and not the story? And four: does the story have to be true? Leonard tells everyone the Sammy Jankis story and the movie hints pretty hard that it's really his own memory, and at the end he knowingly writes himself a false clue so he'll keep hunting and his life will keep having a point. On this view is he self-creating there, or self-erasing?

  the thing I most want you to get at, though, is the ending. If a self is just whatever story is being run, a useful fiction with no deep fact of the matter about who you are, then the ending shouldn't be tragic — he's just swapped one organizing story for another. But the movie really, really wants it to be a tragedy, and that seems to depend on there being a real Leonard who really did something and is now really betraying himself, which is exactly the sort of thing this view tells us to give up. So is the film on the other side of the debate from the reading I want to give it? I'd love something that takes both the film and the idea seriously instead of squishing one to fit the other: which scenes should I actually show the class (I can't hand out quotes, we're just watching clips and I'm talking over them), where does the reading illuminate something in the movie I'd otherwise miss, and where does the movie resist me and I should just admit it? And at the end it'd be great if you could say whether the film adds anything to the argument that the straight philosophy doesn't, or if it's basically Memento: the music video for narrative views of the self. dont go insanely long, my presentation is ten minutes lol
