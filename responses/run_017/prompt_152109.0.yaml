  - For (a) vs (g): The author might argue that in the specific case (g), the potential harm was not enormous or the probability was negligible, so (c) did not require blocking the action. Alternatively, the author could concede that in that case, they should have been more cautious and that under the new protocol (e) such unilateral actions would not occur. The cheapest repair is to adjust the verdict on (g) to be consistent with (a) by saying that under the quorum protocol, such actions would require review and thus avoid the curse.

