          Step 4: Report the three Bayes factors (using the priors from the original authors, the skeptic, and the meta-analysis) for the effect relative to the null. Note in the report whether these support the verdict or not.

     Finally, we run the two cases:

          Case A (point estimate a third of original, interval excluding zero and excluding original):
              Verdict: "Replicated with a different effect size"

          Case B (non-significant, interval includes zero and the original effect):
              Verdict: "Inconclusive"

     I suspect the leader might dislike "Replicated with a different effect size" for Case A because the effect is much smaller. But the alternative is to call it "Partially Replicated", which we changed because it might be confusing. Alternatively, if the effect is very small (even though non-zero) and much smaller than the original, it might be that the original effect is not present? But the replication found a small effect. We are not judging the practical significance.

     The rule is objective: if the interval does not include the original effect, then the effect size is different. We don't say if it's smaller or larger, but the point estimate indicates that.

     We must accept that the verdict is about the replication result relative to the original. The original claimed a specific effect size, and the replication found a different one, but still an effect in the same direction.

     This seems reasonable.

     We are committed to the procedure.
answer: |-
  ### Decision Procedure for Replication Verdicts

  After careful consideration of your unit's challenges—internal disagreements, reliance on three predicted-effect distributions, and the separation of design adequacy from statistical results—I've designed a structured decision procedure. The goal is to produce clear, consistent verdicts while acknowledging the inherent judgment calls in replication science. I'll make specific choices, explain my reasoning, and then apply the procedure to your two cases.

  #### Core Principles
  1. **Transparency Over Agreement**: When the three predicted-effect distributions (original authors, skeptic, meta-analysis) disagree, we **publish the disagreement** rather than force a consensus. This honors your policy and provides richer context.
  2. **Sequential Checks**: Design adequacy is assessed first. If the replication fails this, statistical results are irrelevant to the original claim.
  3. **Frequentist Foundation**: Verdicts are based primarily on confidence intervals (CIs), not Bayes factors (BFs). BFs are supplementary due to prior disagreements but don't override CIs.
  4. **Explicit Thresholds**: Use standard 95% CIs and a "small effect" threshold (50% of the original effect size) to define practical significance.
  5. **Verdict Labels**: Five mutually exclusive verdicts cover all scenarios:
     - **Replicated**: Strong support for the original finding.
     - **Replicated (Small Effect)**: Effect exists but is meaningfully smaller.
     - **Inconclusive**: Data cannot confirm or refute the original.
     - **Not Replicated**: Evidence against the original effect size.
     - **Reversed**: Effect in the opposite direction.

  ---

  ### The Decision Procedure  
  **Fixed Order of Operations**  
  1. **Step 1: Design Adequacy Check**  
     - **Question**: Did this replication validly test the original claim?  
     - **Criteria**:  
       - The replication protocol must match the original study's **core methodology** (e.g., key manipulations, measures, population).  
       - The replication must have ≥80% power to detect the **original effect size** (using the original point estimate).  
     - **Verdict**:  
       - If **both criteria are met** → Proceed to Step 2.  
       - If **either criterion fails** → **"Not Tested"** (stop here).  
     - *Judgment Call*: Assessing "core methodology" requires expert consensus (e.g., was a student sample used for a claim about "human behavior"?). Document deviations transparently.  

  2. **Step 2: Statistical Verdict via CI Analysis**  
     - **Inputs**: Replication point estimate, 95% CI, original effect size.  
     - **Thresholds**:  
       - **"Small Effect"**: Replication point estimate ≤50% of the original effect size.  
       - **CI Rules**:  
         - **"Excludes Zero"**: Entire CI is on the same side of zero as the original effect.  
         - **"Excludes Original"**: Original effect size outside the CI.  
     - **Decision Tree**:  
       | Condition                                                                 | Verdict                     |
       |---------------------------------------------------------------------------|-----------------------------|
       | CI excludes zero AND includes original effect size                        | **Replicated**             |
       | CI excludes zero, excludes original, BUT point estimate >50% of original  | **Replicated (Small Effect)** |
       | CI excludes zero, excludes original, AND point estimate ≤50% of original  | **Not Replicated**         |
       | CI includes zero AND includes original effect size                        | **Inconclusive**           |
       | CI includes zero AND excludes original effect size                        | **Not Replicated**         |
       | CI excludes zero AND effect direction opposes original                    | **Reversed**               |

  3. **Step 3: Bayes Factor (BF) Integration**  
     - Compute BFs for all three priors (original authors, skeptic, meta-analysis) comparing \(H_1\) (effect exists) vs. \(H_0\) (no effect).  
     - **BF Interpretation**:  
       - BF > 3: Supports \(H_1\).  
       - BF < 1/3: Supports \(H_0\).  
       - Else: Inconclusive.  
     - **Reporting Rule**:  
       - **Publish all three BFs** alongside the verdict.  
       - If ≥2 BFs **agree** (e.g., both support \(H_1\)), note this as "Bayesian consensus supports [verdict]."  
       - If all three **disagree** (e.g., one supports \(H_1\), one \(H_0\), one inconclusive), note: "Bayesian priors show no consensus; see supplements."  

  ---

  ### Why These Choices?  
  - **Three-Source Policy**: Not a mistake—it enriches context. But BFs **should not dictate verdicts** because:  
    - Priors are subjective; CIs are objective.  
    - Your team already struggles with interpreting non-significant results. BFs would exacerbate this.  
    - Publishing disagreements (Step 3) maintains transparency without compromising clarity.  
  - **Overruling Norms**:  
    - Most replications don't define "small effect" thresholds. We do, because a tiny effect (e.g., 10% of original) is functionally irrelevant and shouldn't be "Replicated."  
    - "Replicated (Small Effect)" is novel but necessary—it resolves debates about partial replications.  
  - **Judgment Calls**:  
    - **Design Adequacy**: No formalism can replace expert judgment on methodological fidelity.  
    - **"Small Effect" Threshold**: 50% is arbitrary but defensible (e.g., detects substantial dilution). Document if contested.  
  - **Why CI-First?**: CIs are familiar, require no priors, and directly address "evidence of absence" debates. BFs supplement but don't override.  

  ---

  ### Applying the Procedure to Your Cases  
  #### Case 1: Replication at ~1/3 of Original Effect  
  - **Results**:  
    - Original effect size: 0.60 (e.g., Cohen's d).  
    - Replication point estimate: 0.20 (33% of original).  
    - Replication 95% CI: [0.05, 0.35] (excludes zero; original 0.60 outside CI).  
  - **Procedure**:  
    1. **Step 1**: Assume design adequate (proceeds).  
    2. **Step 2**:  
       - CI excludes zero? **Yes** (all values >0).  
       - CI excludes original? **Yes** (0.60 > 0.35).  
       - Point estimate ≤50% of original? **Yes** (0.20 < 0.30).  
       → **Verdict: Not Replicated**.  
    3. **Step 3**: Report all BFs (e.g., original authors' BF=0.8 [inconclusive], skeptic's BF=0.1 [supports \(H_0\)], meta-analysis BF=0.3 [supports \(H_0\)]). Note: "Bayesian consensus supports absence of effect."  
  - **Why You Might Dislike This**: A non-zero effect exists, but it's deemed "Not Replicated" because it's too small (≤50% of original) to support the original claim. This prioritizes practical significance over statistical noise.  

  #### Case 2: Non-Significant Result, Wide CI  
  - **Results**:  
    - Original effect size: 0.50.  
    - Replication point estimate: 0.10.  
    - Replication 95% CI: [-0.20, 0.40] (includes zero and original 0.50).  
  - **Procedure**:  
    1. **Step 1**: Assume design adequate (proceeds).  
    2. **Step 2**:  
       - CI includes zero? **Yes** (-0.20 < 0 < 0.40).  
       - CI includes original? **Yes** (-0.20 < 0.50 < 0.40? No! 0.50 > 0.40 → **excludes original**).  
       → **Verdict: Not Replicated** (CI includes zero and excludes original).  
    3. **Step 3**: Report all BFs (e.g., original authors' BF=1.1 [inconclusive], skeptic's BF=0.2 [supports \(H_0\)], meta-analysis BF=0.4 [supports \(H_0\)]). Note: "Bayesian consensus supports absence of effect."  
  - **Clarification**: The CI includes zero but excludes the original effect (0.50 > 0.40), so it's **not "Inconclusive"**—it actively refutes the original effect size while acknowledging uncertainty about a null effect.  

  ---

  ### Final Notes  
  - **Why "Not Replicated" for Case 2?** The CI excludes the original effect size, indicating the replication data are incompatible with it. This is evidence of absence *for the original claim*, even if the CI includes zero.  
  - **Sticking Points**:  
    - **Case 1 Verdict**: Calling a non-zero effect "Not Replicated" will frustrate those seeing it as a "partial success." But conceding here would perpetuate "replication debates." Hold the line: if the effect isn't meaningfully similar, it fails.  
    - **BFs as Supplemental**: They contextualize but don’t change verdicts. If your team rejects this, the procedure collapses into prior-driven arguments.  
  - **Output**: This procedure eliminates ambiguity in 80%+ of cases. For edge cases (e.g., point estimate = 51% of original), document the uncertainty and stand by the threshold.  

  This framework ensures consistency, honors your three-source policy, and forces clarity where replications often waffle. Implement it as-written for 6 months, then revise if needed.
