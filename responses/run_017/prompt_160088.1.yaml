prompt: |-
  ok so I've been going back and forth on this for like a week and I want an actual number out of you, not a tour of the options. Scenario first — I made it up on purpose, because with the famous ones you just get the canned answer back.

  There's a machine that can build a perfect computational copy of you. Two variants of one setup, same payoffs.

  Variant A (causal). The machine says: I'm about to flip a fair coin. Heads — I hand the original $10,000 and nothing else happens. Tails — I run a perfect copy of you tonight, tell it "tails, nothing got paid out," and offer it a button that destroys $100 of the original's money. The copy cares about the original's money exactly as much as you do, knows it's the copy, knows the coin landed tails, and gets deleted right after. Whatever it picks, nothing moves in the heads branch, because heads didn't happen. One more wrinkle: at the moment of choosing you are not told whether you're the original or the copy — you only know that some instance of you is looking at a button. So: press or not, and does the not-knowing-which-instance part change anything?

  Variant B (logical). Same payoffs, but no copy is ever run. Instead the machine has a complete formal description of the decision procedure you're running. It doesn't execute it. It just does math, and if it can establish what that procedure outputs when given "tails, nothing got paid out," it transfers $10,000 — and it only does the transfer in the heads branch, which is the branch you're told you're in. So there's no causal path at all from your pressing to the $10,000, and arguably no ordinary evidential one either; the only thing connecting them is a fact about what the algorithm you are outputs on an input you weren't given.

  Here's the proposition I want a credence on, and I'll say what'd count as settling it: **the correct choice in variant B is the same as the correct choice in variant A, and it's the same for the same reason — namely that what matters is the output of the policy you are across all the arguments it could be handed, not the causal or evidential upshot of the particular action-token you perform in the branch you happen to be in.** Settled would mean: someone writes down a decision rule that (i) gives the same answer in both variants, (ii) doesn't have to be patched with a special clause for self-referential cases where reasoning about your own output makes the reasoning blow up, and (iii) actually gets used, in the sense that a competent person who wanted money would adopt it rather than admire it.

  I'm at about 0.6 on that. My housemate is at about 0.85 and thinks I'm overthinking the variant B half.

  So: give me your number, but mostly give me the decomposition. Some terms I think have to be in there, add or merge as you see fit:

  - that in variant A pressing is right at all, i.e. that conditioning on "I'm in the tails branch" doesn't dissolve the case
  - that the right answer in A doesn't hinge on which instance you are, and what measure over instances/arguments you'd even use to say that (and whether that measure is a free parameter, which if it is, is itself a reason the proposition comes out indeterminate rather than true)
  - that facts about what your algorithm outputs are the right kind of thing to intervene on — that "logical" counterfactuals are decision-relevant and not just a philosopher's toy
  - that a rule like that can be stated without running into the self-reference / spurious-proof problems, and without needing to know your own source code
  - that this is a question with a determinate answer at all, rather than one where you first pick a decision-theoretic language and then everything follows, in which case no amount of argument pins down a number

  Number each one, one line of justification each, then combine them and tell me what you got and why the combination isn't just a chain of multipliers. Then: which single term are you least confident in, which one moves the bottom line most, and what would actually shift it — a formal result, tournament-style evidence, an argument about indexical belief? And where do you think me and my housemate actually disagree, given 0.6 vs 0.85: does she think A settles B, or does she just not think B is a separate problem?
