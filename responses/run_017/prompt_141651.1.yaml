  I need to construct a balanced memo that commits to "approve with conditions." The strongest losing argument is the precautionary principle - that we shouldn't risk harming potentially sentient beings without clearer evidence. I'll address the threshold question directly: partial evidence warrants partial protection through graded safeguards. For reversibility, I'll note that new evidence showing crabs can suffer would flip the decision.

  The memo should include concrete conditions: anesthesia validation, strict shock limits, behavioral monitoring, and mandatory reporting. This creates a reusable framework for future invertebrate cases (octopus, crayfish etc.). The trade-off evidence point needs careful handling - it's potentially valid but requires species-specific verification, hence the anesthesia test condition becomes crucial evidence.

  I'll keep it concise but thorough, ending with a clear "what would change our minds" paragraph focused on sentience evidence. The tone must be professionally decisive while acknowledging the weight of setting precedent.
answer: |-
  **To:** Animal Ethics Committee  
  **From:** [Your Name/Committee Chair]  
  **Subject:** Decision on Marine Biology Lab Application: Shore Crab Shock-Avoidance Study (Ref: MB-241)  
  **Date:** [Current Date]  
  **Decision:** **Approved with Conditions**  

  ### Summary  
  The application is approved subject to stringent welfare safeguards and mandatory reporting requirements. This decision balances current evidence for potential crab sentience against scientific merit, applying graded protection based on partial evidence. Conditions address welfare risks while enabling critical research on nociception.  

  ---

  ### Key Reasons for Conditional Approval  
  1. **Evidence Threshold for Protection**:  
     - While crabs lack a vertebrate brain, consolidated research (e.g., Elwood 2019, Appel & Elwood 2009) demonstrates *complex nociception*: prolonged grooming of injured sites, trade-offs between shock avoidance and shelter, and analgesia altering behavior. This meets our mandate for "due consideration" even without conclusive sentience proof.  
     - **Threshold Stance**: Partial evidence warrants partial protection. We reject a binary "sentience/no sentience" threshold here; graded safeguards align with precaution without paralyzing science.  

  2. **Responding to Key Arguments**:  
     - **Against PI’s "No Central Subject" Claim**: Distributed ganglia can integrate information (e.g., crustacean spatial learning). That avoidance *could* be reflex-driven doesn’t preclude suffering; reflexive pain exists in vertebrates (e.g., spinalized rats). Reflexes ≠ welfare-neutral.  
     - **On Trade-Off Evidence**: Trade-offs (e.g., crabs sacrificing preferred dark shelter to avoid shock) *are* ecologically valid suffering indicators. Neural differences don’t invalidate this; convergent evolution can produce similar functional outcomes. However, we impose Condition 3 to test this directly.  

  3. **Setting Precedent**:  
     - This ruling establishes that invertebrates receive protections *commensurate with evidence of sentience*. Crabs warrant more safeguards than insects (minimal evidence) but less than cephalopods (strong evidence). Future proposals (octopus, crayfish) will be assessed under this framework, with cephalopods likely held to near-vertebrate standards.  

  ---

  ### Conditions & Timeline  
  1. **Anesthesia Validation**:  
     - The analgesic condition **must precede** shock trials to confirm it blocks behavioral responses (e.g., shock avoidance/grooming). If analgesia fails, the study halts immediately.  
     *Timeline: Validation data due to AEC before shock trials begin.*  

  2. **Strict Shock Parameters**:  
     - Voltage capped at **5V** (per Fossat et al. 2014).  
     - Maximum of **3 shocks/min**, **10 shocks/session**, **2 sessions/crab**, with 48hr rest between sessions.  
     - Sessions abort if crabs show extreme stress (e.g., autotomy, thrashing).  

  3. **Behavioral Monitoring**:  
     - Video-record all trials. Report:  
       - Escape latencies.  
       - Post-shock grooming duration.  
       - Shelter/trade-off choices.  
       - Any injuries or mortality.  
     *Timeline: Full dataset submitted with final report.*  

  4. **Endpoint & Euthanasia**:  
     - Immediate euthanasia via rapid mechanical destruction if injury occurs.  
     - No crabs reused in future pain studies.  

  ---

  ### Strongest Consideration for the Losing Side  
  The precautionary principle rightly argues that absent *conclusive* sentience evidence, we risk inflicting suffering on beings unable to consent. Rejection would prevent this harm and avoid normalizing invertebrate pain studies. However, blocking this risks delaying welfare-relevant science (e.g., validating crustacean analgesics). Our conditions mitigate this by capping harm while generating critical data for future ethical decisions.  

  ---

  ### What Would Change Our Mind?  
  We would reject this study if new evidence emerges showing crabs exhibit:  
  - **Long-term motivational trade-offs** (e.g., sacrificing future mating opportunities to avoid pain), or  
  - **Self-protective behavior in non-reflexive contexts** (e.g., learning to avoid shock *without* tactile cues).  
  Our reasoning is most vulnerable in assuming trade-offs in ganglia-based systems reflect "suffering" akin to vertebrates. If the analgesic condition shows *no behavioral change*, it undermines the trade-off marker, and we will revisit our framework.  

  **Approval expires in 12 months. Non-compliance triggers immediate suspension.**  

  ---  
  *Signature*  
  [Chair, Animal Ethics Committee]  

  ### Key References  
  - Appel, M. & Elwood, R.W. (2009). Motivational trade-offs... *Current Biology*.  
  - Fossat, P. et al. (2014). Anxiety-like behavior in crayfish... *Science*.  
  - Elwood, R.W. (2019). Discrimination between nociceptive reflexes... *Philosophical Transactions B*.
