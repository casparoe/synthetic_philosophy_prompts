  We are building a lecture plan to argue that joint action requires more than individual intentions, beliefs, and common knowledge. The key is to show that mutual responsiveness or an irreducible plural commitment is necessary, and that this changes what counts as a joint action and what it can be done for.

  The plan must:
  - Use the students' formalism as both hook and obstacle.
  - Avoid clichéd examples (painting house, walking, rowing, orchestra).
  - Incorporate the two provided cases (fire door and filing cabinet) at specified points.
  - End with a check for understanding.

  We'll structure the lecture in 6-9 steps. Each step in a table with columns: Step, Minutes, Move, What they can do by the end, Depends on, Misconception.

  After the table, a JSON object with specific keys.

  Let's outline the steps:

  1. **Hook with their formalism**: Start with what they know: modeling joint action as individual policies (intentions) plus epistemic state (common knowledge/beliefs). Show that this can model some cases but we'll see it's insufficient.

  2. **Introduce a case that fits the reductionist model but isn't joint**: Use the fire door case (a) to show that individual intentions and common knowledge (of the situation) can exist without shared purpose or joint action. This separates joint action from shared purpose.

  3. **Introduce mutual responsiveness**: Define mutual responsiveness (each adjusting to the other's actions). Show that even with that, it might not be joint. Use the filing cabinet case (b) to show that mutual responsiveness and interlocking intentions can exist without mutual recognition as co-agents.

  4. **Contrast with a minimal joint action**: Present a new example that must be joint and show what's missing in the previous cases. This example should have mutual responsiveness and mutual recognition. We need a fresh example.

  5. **Analyze the missing element**: Argue that mutual recognition (or plural commitment) is the key. Show that without it, the action isn't jointly attributed.

  6. **Consequences for joint action**: Explain how adding mutual recognition changes what counts as a joint action and what it can be done for.

  7. **Check for understanding**: Pose a scenario and ask if it's joint and why.

  We'll create a new carrying example that isn't cliché.

  New carrying example: Two strangers at an airport see a dropped wallet. They simultaneously and without prior communication start to guard the wallet from being stolen by others until security arrives. They are mutually responsive (if one moves, the other adjusts) and each intends to guard the wallet. But do they see each other as co-agents? Initially, they might not, but then they exchange a nod and coordinate. We can use this to illustrate the difference.

  But let's avoid that because it's a bit close to the clichés. Instead, consider:

  "Two people are independently hired to water a garden while the owner is away. They don't know about each other. One waters the front, the other the back. They never see each other. One day, they meet at the faucet and realize they are both watering the garden. They decide to coordinate: one turns the faucet on and off, the other moves the hose. They are mutually responsive and now share a recognition of each other as co-agents."

  But that might be too complex. We need a minimal joint action.

  Another: Two people are playing a cooperative video game (they are in the same room but not talking). They control two characters that must lift a heavy object together. They are mutually responsive (adjusting to each other's moves) and each has the individual intention to lift the object. But if they are just playing independently, without recognizing the other as a co-agent, is it joint? Then, if they start to communicate and plan, it becomes joint.

  But video games might be too specific. Let's use a physical example.

  **Carrying Example**: Two people are at opposite ends of a long bench that must be carried through a narrow door. They have to maneuver it. Without communication, they try to do it independently but get stuck. Then they make eye contact and start to coordinate: one leads, the other follows. They are now mutually responsive and recognize each other as co-agents.

  But we need an example that doesn't involve communication. Let's try:

  Two people are in a library. A bookshelf starts to tip. Both jump to hold it up. They are mutually responsive (adjusting their holds) and each intends to prevent the shelf from falling. But initially, they might not see each other as co-agents; they are just reacting. Then, one says "I'll hold, you get help" and the other nods. Now they are co-agents.

  But we need a minimal case without communication.

  Actually, for the main example, we'll design one that carries the whole session.

  **Proposed Carrying Example**: Two people are at a river crossing with stepping stones. The stones are slippery and they need to cross at the same time to avoid capsizing a small raft that is tied to both sides. They start to cross independently, but then realize that they must step in synchrony to keep the raft stable. They begin to adjust their steps to each other without explicit communication, each aware that the other is doing the same for the common goal of crossing safely.

  But we are avoiding rowing. How about:

  Two people are carrying a large, fragile mirror down a busy sidewalk. They must avoid obstacles and people. They are mutually responsive (each adjusts to the other's movements) and each intends to get the mirror to the destination. However, they have not communicated and are not looking at each other. They are just reacting to the mirror's movements. Then, one says "I'll go left around this group" and the other follows. Now they are coordinating explicitly.

  We need a case that clearly has mutual recognition without explicit communication.

  Let me propose:

  **Carrying Example for the Session**: Two people are in a lab. They must transfer a large, unstable chemical container from one table to another. The container must be kept level. They cannot talk because of noise. They start moving, but without coordination, the container wobbles. Then they make eye contact and start to move in synchrony, each nodding to signal when to lift, move, and set down. They are continuously responsive and each is aware that the other is cooperating in the joint task.

  This example must have:
  - Individual intentions to move the container.
  - Mutual responsiveness (each adjusts to the other's movements).
  - Mutual recognition (through eye contact and nods, they see each other as co-agents).
  - A shared goal (to move the container without spilling).

  But note: we want to separate shared goal from mutual recognition. In the fire door case, there is no shared goal. In the filing cabinet, there is a shared goal but no mutual recognition? Actually, in the filing cabinet, they have a shared goal (to move the cabinet) but they don't recognize each other as willing co-agents.

  So the carrying example must have mutual recognition and mutual responsiveness.

  Now, step by step plan:

  Step 1: Start with their formalism. Ask them to model a simple joint action (like lifting a box together) in their terms. Then point out that the model doesn't require any real connection between agents.

  Step 2: Present the fire door case (a). Model it: both intend to hold the door, common knowledge of the situation, but no shared purpose. They can see it's not joint.

  Step 3: Introduce mutual responsiveness. Define it. Ask: if we add that, is it joint? Then present the filing cabinet case (b). They have mutual responsiveness and interlocked intentions, but no mutual recognition. They are not acting together.

  Step 4: Present the carrying example (the chemical container). Describe it without the mutual recognition at first (the wobble phase), then with (the coordination phase). Ask what changed.

  Step 5: Argue that mutual recognition (or plural commitment) is the key. Without it, it's not joint.

  Step 6: Consequences: joint action now requires that the agents see each other as co-participants, and this constrains what counts as a joint action and what it can be done for (e.g., it must be for a reason that acknowledges the jointness).

  Step 7: Check for understanding: present a new case and ask if it's joint.

