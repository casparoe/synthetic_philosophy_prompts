prompt: |-
  I am a high school senior writing an independent research paper on constitutional design, and my advisor keeps sending it back with the same note: before I can argue that one arrangement is better than another, I have to say what better means. I would like your help building that standard, because every version I write myself quietly assumes the conclusion I already like.

  The purpose I want the standard to serve: a country is drafting a constitution from scratch and must choose how the executive and the legislature are to be related. The usual three options are a presidential arrangement, in which a separately elected head of state also heads the government and holds office for a fixed term; a parliamentary one, in which the head of government holds office only while the legislature is willing to tolerate them; and various hybrids in which a directly elected president shares executive power with a government answerable to the legislature. I already know these rough categories and don't need them defined. What I want is a specification: what a theory of executive-legislative design has to be able to do before it is good enough to give actual drafting advice to that country, as opposed to merely sorting existing countries into boxes.

  Please write the list of requirements. For each one, give the case or consideration that motivates it, and say whether you think it is non-negotiable or merely a preference that happens to be dear to people who already favor one of the three arrangements. I especially want your judgment on three things: which of the requirements that get asserted in this debate are real desiderata and which are partisan prejudices in disguise; whether some subset of the requirements is jointly unsatisfiable, so that the list itself proves that no system can have everything (if so, tell me exactly which clique of requirements breaks); and which single requirement does the most work in ruling out otherwise attractive designs.

  Here are the cases I have been worrying about, to use as raw material rather than as a checklist to copy:

  One, people use the word stability for at least three different things - cabinets falling, constitutions collapsing, and policy lurching from one direction to another - and a theory that doesn't separate them will recommend the wrong thing. Two, there is the question of who the voter is supposed to blame: whether the arrangement makes responsibility clear enough to be used at the ballot box, or whether it lets each side point at the other. Three, there is the opposite demand: whether a government that has turned out to be incompetent, corrupt, or dangerous can be got rid of before its term runs out, and by whom. Four, whatever rule is chosen has to say what happens when the president's party does not control the legislature, and separately what happens when no party controls it. Five, it has to handle the clash of mandates, when each branch can plausibly claim to be the more recent or more direct voice of the voters. Six, it must not quietly assume good faith: assume the actors will exploit every provision to its limit, threaten elections they would lose, and dare the other side to blink. Seven, it has to work in the boring case as well as the dramatic one - routine legislation, budget deadlines, an executive who is merely mediocre rather than violent - because most of the life of any system is spent there. Eight, it should notice that the power to dismiss a government and the power to dissolve a legislature and call new elections are different powers, and that whether they are symmetric or asymmetric matters a great deal.

  To keep the list from degenerating into a description of systems that already exist, please test it against three arrangements I invented myself and have not seen described anywhere. The first is the weakened veto: a president may return a bill, but the majority needed to override it shrinks each time the legislature passes the same bill again in the same session, so that persistence alone eventually carries it. The second is the mutual key: the head of government may call an early election only if the legislature, having dismissed them, fails within a set window to name a replacement who can command a majority - the aim being to make dismissal and dissolution genuinely reciprocal. The third is the decaying caretaker: when a government is dismissed, it stays in office with automatically narrowing powers, losing a scheduled slice of its authority every week that no successor is approved, so that the cost of deadlock falls on whoever is stalling. I want the desiderata to be strong enough to tell me what is genuinely wrong with these, if anything is, and at least two of the requirements on your list should be ones that thinking about these three cases is what brings into view.

  Two further constraints. Please don't give me a country-by-country comparison or score the existing families against the list at any length - one or two sentences each is plenty, and I would rather have the criteria themselves argued properly, since that is the part I cannot do alone. And please argue from cases and from reasoning any careful reader could follow rather than from research findings, author names, or things I would have to look up; I have no access to a library from where I am writing, so citations and reading lists would be useless to me, and I would rather have an argument I can check myself than a citation I can't.
reasoning: |-
  Okay, let me approach this systematically. The student needs a robust framework for evaluating constitutional designs that avoids circular reasoning - a challenge since they recognize their own drafts contain hidden biases. 

  The core problem is defining "better" in constitutional design without presupposing outcomes. I'm considering structuring the evaluation around functional requirements rather than institutional forms. The student's list of eight concerns provides excellent raw material, particularly their insight about conflated meanings of "stability" and the need to consider adversarial actors.

  Three key principles emerge from their query:
  1) Criteria must be mutually testable to expose trade-offs
  2) Must account for both crisis and routine governance
  3) Must reveal flaws in novel systems like their "mutual key" proposal

  I'm struck by how their invented systems cleverly stress-test conventional wisdom. The "decaying caretaker" model, for instance, directly confronts the deadlock problem in parliamentary systems by imposing asymmetric costs. This suggests we need a criterion about "distributed consequences" - where the pain of dysfunction falls.

  The student's observation about blame assignment points to another crucial criterion: traceable accountability. Many systems fail this when coalition governments obscure responsibility. Presidential systems often solve this but create rigidity problems - exactly the trade-off we must surface.

  Their seventh point about "boring cases" is vital. Too many analyses focus on constitutional crises while ignoring daily governance. Any serious framework must evaluate how systems handle budget processes and routine oversight without defaulting to deadlock.

  For the adversarial test (sixth point), I'll propose "exploitability resistance." This means no procedure should become a weapon when actors act in bad faith. Their "weakened veto" might fail here if presidents can endlessly provoke re-votes to waste legislative time.

  The mandate clash problem (fifth point) requires special handling. I'm considering a "temporal legitimacy hierarchy" criterion - does the system have clear rules for when competing claims arise? Semi-presidential systems often stumble here during cohabitation.

  Ultimately the most powerful discriminator may be "asymmetric cost imposition" - which their decaying caretaker model explicitly addresses. Systems that concentrate the pain of dysfunction on innocent parties (e.g., citizens during shutdowns) are flawed regardless of structure.

  The student will need to see precisely where requirements conflict. For instance, immediate removability (their third point) often contradicts mandate stability. Hybrid systems try to square this circle but risk blame ambiguity. This tension must be explicit in our framework.
answer: |-
  Here is a proposed set of requirements for evaluating executive-legislative arrangements, designed to avoid circularity and test novel designs. Each requirement is grounded in a core problem of governance, classified as fundamental ("Non-negotiable") or context-dependent ("Preference"), with analysis of conflicts and key trade-offs.

  ### Core Requirements for Constitutional Design Evaluation
  1.  **Non-Collapse Stability (Non-negotiable)**
      *   **Motivation:** Your "constitutions collapsing" concern. A system must prevent the complete breakdown of constitutional order (coups, civil war, secession). No design advice matters if the state fails.
      *   **Test Novel Systems:** *Mutual Key* risks deadlock if no replacement is found *and* no election trigger occurs, potentially creating a power vacuum. *Decaying Caretaker* mitigates this by ensuring basic functions continue.
      *   **Conflict:** Can clash with *Responsive Removability* if removing dangerous actors is too difficult.

  2.  **Resolvable Deadlock (Non-negotiable)**
      *   **Motivation:** Your points on "no party control" and the clash of mandates. The system *must* have a clear, legitimate, and peaceful mechanism to break impasses between executive and legislature on essential functions (budget, confidence, key appointments).
      *   **Test Novel Systems:** *Weakened Veto* provides a path (persistence). *Mutual Key* provides a path (election if no successor). *Decaying Caretaker* provides a path (shrinking powers force action). All aim for this. The test is *how reliably* and *at what cost* they achieve resolution.
      *   **Conflict:** Mechanisms can undermine *Mandate Clarity* or *Predictable Process*.

  3.  **Traceable Accountability (Non-negotiable)**
      *   **Motivation:** Your "who to blame" point. Voters must be able to identify, with reasonable clarity, which actors (individuals, parties, branches) are responsible for major policy successes/failures and overall governance quality. Ambiguity ("each side points at the other") undermines democratic feedback.
      *   **Test Novel Systems:** *Mutual Key* could blur lines: is failure to form a government the fault of the dismissed PM, the fractious legislature, or the system itself? *Decaying Caretaker* keeps the *old* government implementing policies while power decays – who is accountable for outcomes during decay?
      *   **Conflict:** Difficult to achieve perfectly in hybrids or coalition systems. Can clash with *Coalition Flexibility* (a preference).

  4.  **Responsive Removability (Preference)**
      *   **Motivation:** Your "getting rid of incompetent/dangerous government" point. The system should allow for the removal of a failing executive *within* an electoral term without triggering systemic crisis.
      *   **Test Novel Systems:** *Mutual Key* enables removal via legislative vote but adds a hurdle (failure to replace) before an election. *Decaying Caretaker* doesn't remove immediately but disempowers. Presidential systems typically lack this.
      *   **Conflict:** Directly opposes *Fixed Mandate Security* (Preference). Can weaken *Traceable Accountability* if removal is too easy/frequent ("revolving door").

  5.  **Predictable Process & Constrained Exploitability (Non-negotiable)**
      *   **Motivation:** Your "don't assume good faith" and "boring case" points. Rules must be clear enough for routine governance (budgets, legislation) and resilient against actors who will push boundaries, threaten mutually destructive actions, or exploit ambiguities for partisan gain. Most governing time is spent here.
      *   **Test Novel Systems:** *Weakened Veto* risks exploitation: Presidents might force endless re-votes to waste legislative time. *Mutual Key* might incentivize legislatures to dismiss PMs *without* a viable successor, gambling they can force an election they think they'll win. *Decaying Caretaker* must *very* carefully define "narrowing powers" to avoid chaos or legal challenges.
      *   **Conflict:** Achieving perfect predictability under adversarial conditions is impossible. Rules designed to constrain exploitability can sometimes make routine governance slower.

  6.  **Asymmetric Cost Imposition (Non-negotiable)**
      *   **Motivation:** Your insight that "whether the cost of deadlock falls on whoever is stalling" matters (*Decaying Caretaker*'s core idea). The system should be designed so that the costs of obstruction or bad-faith bargaining fall primarily on the actors responsible for causing the deadlock, not on neutral state institutions or the public. This discourages brinksmanship.
      *   **Test Novel Systems:** *Decaying Caretaker* explicitly targets this – stalling legislators see the government lose power *they* might need later. *Mutual Key* imposes costs via potential early elections (risky for all). *Weakened Veto*'s costs (legislative time) fall somewhat asymmetrically on the persistent body.
      *   **Conflict:** Can be hard to calibrate perfectly. May sometimes conflict with *Resolvable Deadlock* if the threatened cost paralyzes actors.

  7.  **Adaptability to Fractured Mandates (Non-negotiable)**
      *   **Motivation:** Your "no party control" and "clash of mandates" points. The system must function effectively (pass essential legislation, provide stable government) even when voters deliver split majorities (e.g., opposing parties control exec/leg, hung legislature).
      *   **Test Novel Systems:** *Weakened Veto* provides a legislative path around a hostile president. *Mutual Key* and *Decaying Caretaker* both aim to resolve hung-legislature scenarios after dismissal. Systems without clear coalition-building mechanisms fail here.
      *   **Conflict:** Mechanisms for adaptation (e.g., coalition-building, minority govt tolerance) can reduce *Traceable Accountability*.

  ### Key Insights & Trade-offs
  *   **The Core Conflict:** The most significant tension is between **Traceable Accountability** and **Adaptability to Fractured Mandates/Coalition Flexibility**. Systems maximizing clarity of responsibility (e.g., pure presidentialism with single-party majorities) struggle with legislative gridlock under split mandates. Systems excelling at coalition-building and governing under fractured mandates (e.g., proportional parliamentarism) often diffuse accountability, making it hard for voters to assign credit/blame. *This is the fundamental trade-off.*
  *   **The Most Disqualifying Requirement:** **Resolvable Deadlock** does the most work in ruling out designs. An arrangement that lacks a peaceful, legitimate, and clear path to resolve fundamental impasses (especially over budgets or confidence) is inherently unstable and risks violating **Non-Collapse Stability**. Designs that create permanent stalemate are non-starters.
  *   **Partisan Prejudices vs. Real Desiderata:**
      *   **"Strong Leadership" / "Decisiveness":** Often a partisan preference (Presidentialist) disguised as a universal good. What matters is *effective governance* within constraints, not raw decisiveness which can undermine other requirements (Accountability, Constrained Exploitability).
      *   **"Stability" meaning Cabinet Duration:** Often a partisan preference (Parliamentarist) conflated with systemic stability. Short cabinet duration *can* be a feature (Responsive Removability) not a bug, if accountability is clear and governance continues. **Non-Collapse Stability** and **Resolvable Deadlock** are the crucial stability metrics.
      *   **"Direct Mandate Superiority":** The claim that a directly elected President inherently has a stronger mandate than the legislature is a partisan prejudice (Presidentialist/Semi-Presidentialist). Legitimacy stems from the *entire constitutional structure* and adherence to its rules, not just one branch's election mode. **Predictable Process** and **Resolvable Deadlock** handle mandate clashes.
  *   **Breaking Your Novel Systems:**
      *   **Weakened Veto:** Vulnerable on **Predictable Process/Constrained Exploitability** (Presidential obstruction via repeated returns) and potentially **Traceable Accountability** (Who "wins" the battle? The persistent legislature? The president who forced the effort?).
      *   **Mutual Key:** Vulnerable on **Traceable Accountability** during the replacement window and potentially **Resolvable Deadlock** if the "failure to replace" trigger is too easily avoided by minimal effort. Also risks exploitability if actors gamble on forcing elections.
      *   **Decaying Caretaker:** Vulnerable on **Traceable Accountability** (Who is responsible for policy during decay?) and **Predictable Process** (Defining "narrowing powers" precisely enough to avoid chaos or legal battles is extremely difficult). Its strength is **Asymmetric Cost Imposition**.

  This framework forces justification beyond "like/dislike" by anchoring evaluation in unavoidable governance problems and inherent tensions. It explicitly surfaces the core trade-off (Accountability vs. Adaptability) and prioritizes systemic survival and functionality over partisan ideals. Use it to dissect *why* existing systems make the choices they do, and rigorously test whether your novel proposals genuinely solve the core problems without violating non-negotiable requirements or exacerbating fundamental tensions.
