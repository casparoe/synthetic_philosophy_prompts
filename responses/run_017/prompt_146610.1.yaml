answer: |-
  ## MINUTES OF THE ELEVENTH SITTING: WELFARE MEASURE STANDING COMMITTEE  
  **Date:** 2023-10-27  
  **Time:** 14:00 - 16:15  
  **Location:** Room 4B, Central Statistics Bureau  

  **Attendees:**  
  *   Dr. Anya Petrova (Chair, Director of National Accounts)
  *   Mr. David Chen (Chief Statistician, Social Metrics Division)
  *   Dr. Evelyn Ross (Senior Economist, Predictive Analytics Unit)
  *   Mr. Kenji Tanaka (Head, Market Integrity Oversight)  
  **Apologies:** Dr. Samuel Adebayo (On leave)

  **Chair:** Dr. Petrova  
  **Minutes Taker:** Secretariat (Automated Record)

  **1. WELCOME & APOLOGIES**  
  The Chair welcomed members. Apologies from Dr. Adebayo were noted.

  **2. MINUTES OF TENTH SITTING**  
  Minutes of the Tenth Sitting (2023-09-15) were approved without amendment.

  **3. AGENDA ITEM 4.2: TIMELINESS OF WELFARE INDEX SETTLEMENT & REVISION IMPACT ON MARKET PAYOUTS (WMSC/2023/07)**  
  *   **Background:** The Chair noted the persistent concern regarding the 36-month lag in final Welfare Index calculation and subsequent potential revisions (up to 60 months post-policy implementation). This delays final settlement of conditional prediction markets, tying up capital and deterring participation.
  *   **Proposal:** Dr. Ross proposed authorizing interim payouts based on the *preliminary* Welfare Index figure (available at 18 months), contingent on traders accepting final settlement against the *revised* figure when available. A clawback mechanism would reconcile differences.
  *   **Discussion:** Mr. Tanaka expressed concern about perverse incentives: a trader holding a position dependent on the *preliminary* figure could theoretically act to ensure the preliminary figure aligns with their bet, rendering the revision unnecessary and guaranteeing their profit. Dr. Ross acknowledged this but argued the efficiency gains outweighed the risk, as influencing the complex, aggregate Index at the preliminary stage was deemed statistically improbable for individual actors. Improved participation liquidity was the primary benefit.
  *   **Decision:** Proposal **APPROVED** (3 For: Petrova, Ross, Tanaka; 0 Against; 1 Abstain: Chen). Action: Dr. Ross to draft operational protocols for interim payouts and clawbacks (WMSC/2023/07A).

  **4. AGENDA ITEM 5.1: PROCEDURE FOR RESOLVING INDEX-PRICE REFLEXIVITY (WMSC/2023/09)**  
  *   **Background:** Mr. Tanaka highlighted the theoretical reflexivity loop: the market price predicts the Welfare Index *conditional on the policy being adopted*, but adoption is triggered *by that market price*. The "true" conditional prediction is thus a fixed point.
  *   **Proposal:** Mr. Tanaka proposed a procedural resolution: The conditional market for any policy proposal will run for a fixed, non-extendable 14-day window. The price recorded at the close of this window shall be deemed the market's definitive judgement on the policy's expected impact on the Welfare Index, irrespective of any self-referential dynamics observed during the trading period. Adoption decisions are based solely on this closing price.
  *   **Discussion:** Dr. Ross noted this was essentially treating the terminal price as an exogenous input, sidestepping the fixed-point calculation. Dr. Petrova concurred, stating it provided the necessary operational clarity and finality required by the Futarchy Adoption Act (Section 8.3). Mr. Chen raised no objection.
  *   **Decision:** Proposal **APPROVED UNANIMOUSLY**. Action: Mr. Tanaka to amend Market Operation Directive 12B accordingly.

  **5. AGENDA ITEM 6.3: MITIGATING OUTCOME MANIPULATION RISK: POSITION DISCLOSURE THRESHOLDS (WMSC/2023/11)**  
  *   **Background:** Concerns persist that actors holding large positions in conditional markets could take real-world actions to influence the Welfare Index outcome in line with their bet (e.g., a large "NO" bettor sabotaging a policy they bet against).
  *   **Proposal:** Mr. Tanaka proposed a mandatory disclosure regime: Any individual or entity holding a position exceeding 0.5% of the total open interest in a specific conditional policy market must publicly disclose their identity and position size within 24 hours of crossing the threshold.
  *   **Discussion:** Dr. Ross questioned the efficacy, noting sophisticated actors could split positions among numerous entities below the threshold. Mr. Chen suggested a lower threshold (0.1%) but Mr. Tanaka countered that this would overwhelm the disclosure registry with insignificant traders, diluting oversight. The 0.5% threshold targets actors presumed capable of material influence. Dr. Petrova emphasized deterrence over perfect detection.
  *   **Decision:** Proposal **APPROVED** (3 For: Petrova, Tanaka, Chen; 1 Against: Ross). Action: Mr. Tanaka to implement the disclosure registry by Q1 2024.

  **6. AGENDA ITEM 7.1: TREATMENT OF FUTURE AND COUNTERFACTUAL PERSONS IN WELFARE PROJECTIONS (WMSC/2023/14)**  
  *   **Background:** Dr. Ross raised the challenge of incorporating individuals who will exist in the future, or who would exist only if a policy were *not* adopted (e.g., children born due to a policy preventing habitat destruction), into the Welfare Index projections used by markets.
  *   **Proposal:** Dr. Ross proposed:
      1.  Discount the welfare of individuals born more than 25 years post-policy adoption at a standard social discount rate (3%).
      2.  Exclude entirely individuals whose *existence* is contingent upon the policy *not* being adopted. Only the welfare of individuals projected to exist *under the adopted policy pathway* is included in the Index forecast.
  *   **Discussion:** Mr. Chen noted this created asymmetry: potential lives prevented by a policy are not counted as a loss, while potential lives enabled are counted as a gain (once born). Dr. Ross agreed but stated it was the only methodologically coherent approach within a fixed population projection framework. Counting "non-persons" was statistically untenable. Mr. Tanaka observed this aligned with actuarial standards for long-term projections. The Chair noted the gravity of the assumptions but concurred on technical grounds.
  *   **Decision:** Proposal **APPROVED** (3 For: Petrova, Ross, Tanaka; 1 Against: Chen). Action: Dr. Ross to update the Welfare Projection Methodology Handbook (Section G.7). *Mr. Chen dissented solely on the grounds of potential market thinness for policies with significant long-term demographic effects, citing insufficient liquidity data for validation.*

  **7. ANY OTHER BUSINESS**  
  Dr. Petrova noted preliminary work by the Secretariat on defining "observable welfare" for sub-populations currently excluded due to measurement complexity (e.g., long-term institutionalized individuals). This will be Agenda Item 8.1 at the next meeting.

  **8. DATE OF NEXT SITTING**  
  The Twelfth Sitting is scheduled for 2023-12-05 at 14:00.

  **Meeting closed:** 16:15

  **ACTION ITEMS:**  
  1.  Dr. Ross: Draft protocols for interim payouts/clawbacks (WMSC/2023/07A).
  2.  Mr. Tanaka: Amend Market Operation Directive 12B (Reflexivity Procedure).
  3.  Mr. Tanaka: Implement 0.5% position disclosure registry (Q1 2024).
  4.  Dr. Ross: Update Welfare Projection Handbook (Section G.7 - Future/Counterfactual Persons).
  5.  Secretariat: Prepare proposal on "observable welfare" thresholds for institutionalized populations (Agenda Item 8.1, Next Sitting).
