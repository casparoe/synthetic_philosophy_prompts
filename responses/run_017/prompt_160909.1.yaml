answer: |-
  ### Joint Statement on Function Attribution in Biology

  #### 1. Glossary  
  We agree on the following core terminology to avoid conflation:  
  - **Function**: A *characteristic effect* of a trait that is *explanatorily salient* in biological practice.  
  - **Proper function**: A term reserved for the etiological account, denoting the effect for which a trait *was selected*. Not used by the causal-role account.  
  - **Malfunction**: A failure of a trait to produce its *function* under typical conditions.  
  - **Design**: The property of a trait being *shaped* (via selection or engineering) to produce an effect.  
  - **Selected effect**: The fitness-conferring effect that causally explains a trait’s historical retention.  
  - **System**: A hierarchically organized entity (e.g., cell, organism, ecosystem) whose capacities are analyzed to attribute functions.  

  #### 2. Agreed Claims  
  Both parties endorse the following non-trivial claims:  
  1. **Paradigm cases**: A heart’s function is to pump blood (not to produce sound). Both accounts explain this, but differ on *why*.  
  2. **Function vs. effect**: A function is a *subset* of a trait’s effects—specifically, those that are biologically significant (e.g., blood pumping, not heart sounds).  
  3. **Malfunction**: A trait can malfunction even if it confers fitness *now* (e.g., a diseased heart that pumps inefficiently but benefits from medical intervention).  
  4. **Multi-level applicability**: Function attributions apply to genes (e.g., "this gene functions in DNA repair"), cells, organisms, and groups (e.g., "alarm calls function in predator avoidance").  
  5. **Artefacts**: Engineered systems (e.g., a watch) have functions derivatively from design history (etiological) or current causal capacities (causal-role).  

  #### 3. Disagreements Table  
  | Issue | Etiological Formulation | Causal-Role Formulation | Verdict & Reason |  
  |-------|-------------------------|-------------------------|------------------|  
  | **Necessity of history** | "A trait’s function is *necessarily* the effect for which it was selected." | "A trait’s function is its current causal contribution to a system’s capacity, independent of history." | **Genuine**: Disagreement over whether history is constitutive (etiological) or incidental (causal-role). |  
  | **Novel traits** | "A trait lacks a function until its effect has been selected over generations." | "A trait has a function if it currently contributes to a system’s capacity, even at inception." | **Genuine**: Turns on whether selection history is a precondition for functionhood. |  
  | **Selfish elements** | "A selfish element has no *function*; it is a byproduct or parasite, as its effect was not selected *for the system*." | "A selfish element has the function of replication *at its level* (e.g., genetic), regardless of system-level harm." | **Genuine**: Conflict over whether functions require alignment with system fitness (etiological) or arise from causal role alone (causal-role). |  
  | **Co-opted traits** | "A trait retains its original function (X) or none; new effects (Y) are functions only if selected *for Y*." | "A trait’s function is its current effect (Y), irrespective of historical selection (X)." | **Genuine**: Disagreement over whether historical or current contribution determines function. |  

  #### 4. Cruxes  
  Three resolvable empirical-theoretical cruxes, using stipulated cases:  

  **Crux 1: The Hitchhiking Twin**  
  - **Case**: Identical alleles in two populations. In A, the allele fixed due to effect E (fitness-enhancing). In B, it fixed via genetic hitchhiking (E fitness-irrelevant).  
  - **Question**: Does the allele have function E in population B?  
  - **Etiological prediction**: No (lacks selection for E).  
  - **Causal-role prediction**: Yes (identical causal role).  
  - **Test**: If biologists attribute "function E" in B *without caveats*, causal-role gains; if they deny/demote it, etiological gains.  

  **Crux 2: The First-Generation Gene**  
  - **Case**: A *de novo* gene arises and enhances fitness at generation 1. Analyzed at generations 1, 10, 100, and 1,000.  
  - **Question**: When does the gene acquire a function?  
  - **Etiological prediction**: Function arises only after selection acts (≥G10; not G1).  
  - **Causal-role prediction**: Function arises at G1 (immediate contribution).  
  - **Test**: If biologists attribute "function" at G1 in real cases (e.g., CRISPR-induced mutations), causal-role gains; if they withhold until fixation/drift, etiological gains.  

  **Crux 3: The Co-opted-and-Degenerate Trait**  
  - **Case**: A trait (e.g., avian wing) historically selected for flight (X), now contributes to display (Y) and cannot perform X.  
  - **Question**: Is Y its current function?  
  - **Etiological prediction**: No (unless selected *for Y*; else vestigial).  
  - **Causal-role prediction**: Yes (Y is its salient contribution).  
  - **Test**: If biologists label Y as the function *without* referencing selection for Y (e.g., in exaptation studies), causal-role gains; if they require evidence of selection for Y, etiological gains.  

  #### 5. Confidence and Contingencies  
  - **Crux 1 (High confidence)**: Will move both sides. Etiological must explain why identical causal roles lack functions; causal-role must explain why history overrides causal parity. *Contingency*: Assumes hitchhiking alleles are common. If rare, the case becomes marginal—document shifts focus to artificial simulations.  
  - **Crux 2 (High confidence)**: Will move etiological side. If functions are attributed at G1, etiological must relax "selection history" or concede ground. *Contingency*: Assumes *de novo* genes *can* have immediate fitness effects. If false, crux weakens; document emphasizes engineered genes instead.  
  - **Crux 3 (Medium confidence)**: Likely moves causal-role side. If biologists reject Y as function without selection, etiological gains; if not, causal-role must address "junk DNA" parallels. *Contingency*: Assumes co-option without selection for Y occurs. If all co-option involves selection, etiological view absorbs the case—document adds caveats.  

  **Weakest claim**: Agreed Claim 3 (malfunction). Both sides accept malfunction but disagree on criteria; this may paper over depth of divergence.  

  **Confidence in cruxes overall**: High. Each crux forces a side to either revise its account or explain away empirical practice. The **hitchhiking twin** is most likely to yield progress, as it isolates history’s role.  

  ---  
  This draft is strictly conceptual, avoids citations, and uses stipulated cases to test core principles. It stands on argumentative merit and pre-commitments to biological practice. Revise for context-specific nuances.
