prompt: |-
  I'm writing a dissertation chapter in philosophy of biology on how function attributions actually work in molecular and evolutionary biology, and I need help drafting one section of it. To fix the positions: on the selected-effects (etiological) account, a trait's function is the effect for which it was selected; on the causal-role (systemic) account, a trait's function is the contribution it makes to some capacity of a containing system we are analysing. My supervisor holds the former, a collaborator in the department holds the latter, and after two years of talking past each other they have agreed, at my insistence, to an adversarial collaboration. I have been asked to ghost-write the joint statement. Please draft it.

  What I need:

  1. A short glossary settling the terminology — function, proper function, malfunction, design, selected effect, system — in wording both sides could sign, since part of the stalemate has plainly been terminological.

  2. A numbered agreed-claims section: what both accept about paradigm cases (a heart's pumping blood), about the distinction between a function and a mere effect, about malfunction, about function attributions at gene, cell, organism and group levels, and about artefacts and engineered systems. No vacuous claims — if a claim would be signed by everyone in the philosophy of language as well, cut it.

  3. A disagreements table: one row per residual disagreement, with the etiological side's own formulation and the causal-role side's own formulation, each phrased so that side would accept it as their view, plus your verdict on whether that row is a genuine disagreement or a merely verbal one, with a one-line reason.

  4. The cruxes — the sub-questions such that settling one would actually move at least one side. I expect three or four; I would rather have three real ones than seven padded ones.

  5. For each crux, the case, measurement or argument both parties would accept as bearing on it, with each side's prediction about it written down in advance. Please build these around the following stipulated cases rather than the standard textbook ones:

  - The hitchhiking twin: two present-day populations fixed for the same allele with identical causal profiles, where in one population the allele spread because of the effect in question and in the other it rode along with a sweep at a linked site, that effect being fitness-irrelevant.
  - The first-generation gene: a de novo protein-coding gene arising from previously non-coding sequence that improves fitness immediately, considered at the generation it appears and at ten, hundred and thousand generations later.
  - The selfish element: a transposon whose replication raises its own representation while lowering organismal fitness.
  - The co-opted-and-degenerate trait: a structure that now contributes effect Y, was historically selected for effect X, and no longer produces X at all.
  - A directed-evolution lineage: an enzyme designed from scratch and then optimised in vitro over many rounds, with no organismal history at any point.

  6. A closing note on your own confidence: for each crux, how confident you are that settling it would in fact move at least one side, and which single claim in the document you are least sure of. Flag any place where your drafting relies on a contingent empirical assumption about biology — for instance about how common de novo gene birth is, or how tightly current contribution tracks selection history in real genomes — and say how the document would change if that assumption were false.

  Please argue from the concepts rather than from the literature: I do not want citations, quotations or a reading list, since I will supply those myself, and I want the document to stand or fall on whether the arguments in it are good.
reasoning: |-
  We are drafting a joint statement for two philosophers of biology with opposing views on function attribution: one holding the selected-effects (etiological) account and the other the causal-role (systemic) account. The goal is to clarify terminology, identify points of agreement and disagreement, and set up empirical cruxes that could resolve the debate.

  We'll structure the document as follows:

  1. Glossary: Define key terms in a way both sides can accept.
  2. Agreed Claims: List non-trivial points of agreement.
  3. Disagreements Table: List residual disagreements, with each side's formulation and a verdict on whether it's genuine or verbal.
  4. Cruxes: The key empirical or conceptual questions that could move the debate, with specific cases and each side's predictions.
  5. Confidence and Contingencies: Assess confidence in the cruxes and note any contingent empirical assumptions.

  Let's proceed step by step.

  ---

  **1. Glossary**

  We define terms in a neutral way that captures the core ideas of both accounts without presupposing either theory.

  - **Function**: A characteristic effect of a trait that is explanatory in a biological context. (Both sides agree that functions are explanatory, but they differ on what explains what.)
  - **Proper function** (for the etiological side): The effect for which the trait was historically selected. (The causal-role side may avoid this term but can accept it as a term of art for the etiological view.)
  - **Malfunction**: A failure of a trait to perform its function. (Both sides agree that malfunctions occur, but they differ on what constitutes the function.)
  - **Design**: The property of a trait being shaped by natural selection for a particular effect. (Etiological view emphasizes this; causal-role view may see it as one way functions arise but not necessary.)
  - **Selected effect**: The effect that caused a trait to be favored by natural selection in the past. (Core to the etiological view; the causal-role view may not require it.)
  - **System**: An organized set of interacting parts. The causal-role account takes functions relative to a system's capacities. The etiological account may also reference systems but emphasizes evolutionary history.

  Note: We avoid defining "function" in a way that builds in either theory. The glossary is meant to set a common language.

  ---

  **2. Agreed Claims**

  We list non-trivial claims that both parties accept. We avoid claims that are too broad or that would be accepted by anyone (like "hearts pump blood"). We focus on points that are substantive in the function debate.

  1. **Function vs. Accidental Effect**: Both accounts agree that not every effect of a trait is a function. For example, the heart makes noise, but that is not its function. They agree that functions are a subset of effects that are explanatory in a specific way.
  2. **Malfunction**: Both accounts accept that a trait can have a function and yet fail to perform it (malfunction). For instance, a heart that does not pump blood is malfunctioning.
  3. **Multi-level Function Attribution**: Both accounts allow function attributions at multiple levels (e.g., gene, cell, organism, group). However, they may differ on the criteria for such attributions.
  4. **Artefacts and Engineered Systems**: Both accounts can be applied to artefacts. For example, the function of a screw in a machine is to hold parts together. Both agree that in engineered systems, the designer's intent (or the design history) can play a role analogous to natural selection.

  But note: The etiological view for artefacts would appeal to the history of design (intentional selection), while the causal-role view would focus on current causal contributions. Both accept that function attributions in artefacts are similar in structure to biological ones.

  5. **Historical Contingency in Biology**: Both accept that many traits have functions that are the result of historical selection, but they disagree on whether this history is necessary for function.

  ---

  **3. Disagreements Table**

  We list each disagreement with both sides' formulations and then a verdict on whether it's genuine or merely verbal.

  | Disagreement | Etiological View Formulation | Causal-Role View Formulation | Verdict (Genuine/Verbal) | Reason |
  |--------------|------------------------------|------------------------------|--------------------------|--------|
  | **Necessity of History** | A trait T in system S has function F only if T was selected in S's lineage because F contributed to fitness. | A trait T in system S has function F if T's doing F contributes to a capacity of S, regardless of S's history. | Genuine | The disagreement is about whether history is necessary for function. |
  | **Malfunction Criteria** | A trait malfunctions when it fails to perform the effect for which it was selected, even if it currently contributes to fitness. | A trait malfunctions when it fails to perform the effect that it is supposed to perform in the current system, where "supposed" is defined by the system's typical organization. | Genuine | The etiological view ties malfunction to historical norm, while the causal-role view ties it to current systemic norms. |
  | **Function in Novel Traits** | A novel trait (e.g., a de novo gene) cannot have a function until it has been selected for that effect. | A novel trait can have a function immediately if it contributes to a system's capacity, even without a history of selection. | Genuine | The disagreement is about whether selection history is required for function attribution. |
  | **Function of Selfish Elements** | The transposon's function is not to replicate (even though it does so) because it was not selected for that effect at the organism level; it may be a parasite. | The transposon's function is to replicate because that is its causal role in the genetic system, even if it is detrimental at the organism level. | Genuine | The etiological view requires selection at the relevant level, while the causal-role view attributes function based on causal role at the level of analysis. |

  ---

  **4. Cruxes**

  We present three cruxes based on the stipulated cases. For each, we describe the case, the question it raises, and each side's prediction. The goal is to set up tests that could resolve the disagreement.

  **Crux 1: The Hitchhiking Twin**

  - **Case**: Two present-day populations fixed for the same allele with identical causal profiles. In Population A, the allele spread because of effect E (which increased fitness). In Population B, the allele rode along with a sweep at a linked site (hitchhiking), and effect E is fitness-irrelevant (or even slightly deleterious but not enough to counter the sweep). The causal profile of the allele is the same in both: it produces E in both.
  - **Question**: Does the allele have function E in Population B?
  - **Etiological Prediction**: No, because in Population B, the allele was not selected for E. E may be an effect, but not a function.
  - **Causal-Role Prediction**: Yes, because the allele contributes effect E to the organism in both populations, and that contribution is identical. The history doesn't change the current causal role.
  - **Why it matters**: This tests whether history is necessary for function.

  **Crux 2: The First-Generation Gene**

  - **Case**: A de novo protein-coding gene arises from previously non-coding sequence. At generation 1, it appears and immediately improves fitness. We consider four time points: generation 1 (when it first appears), generation 10, 100, and 1000.
  - **Question**: At which generations does the gene have a function?
  - **Etiological Prediction**: Not at generation 1, because there has been no selection for the effect. It starts having a function only after it has been selected (so at least by generation 10 if selection is acting, but not at the very first generation). The function is attributed only after a history of selection.
  - **Causal-Role Prediction**: It has a function at generation 1 because it contributes to fitness immediately. The function is present as soon as the effect is produced and is beneficial.
  - **Why it matters**: This tests whether a trait can have a function without any history of selection.

  **Crux 3: The Selfish Element**

  - **Case**: A transposon that replicates itself, thereby increasing its own representation in the genome, but lowers the fitness of the organism.
  - **Question**: What is the function of the transposon? (And does it have a function at the organism level?)
  - **Etiological Prediction**: The transposon does not have a function at the organism level because it was not selected for contributing to organismal fitness; in fact, it was selected against. It may have a function at the gene level (if we consider the transposon as a unit of selection), but not at the organism level.
  - **Causal-Role Prediction**: The transposon has the function of replication at the genetic element level. At the organism level, it may have a dysfunction because it harms the organism, but that does not negate its function at its own level.
  - **Why it matters**: This tests the level-relativity of function and whether functions can be attributed to elements that are harmful to the containing system.

  **Crux 4: The Co-opted-and-Degenerate Trait**

  - **Case**: A structure that historically was selected for effect X but now produces effect Y (and no longer produces X). For example, the human appendix: historically selected for cellulose digestion (X), now lost that ability and may have a role in immune function (Y).
  - **Question**: What is the function of the trait now? Is it Y, or does it have no function (or is it malfunctioning with respect to X)?
  - **Etiological Prediction**: The trait no longer has a function because it isn't doing what it was selected for (X) and hasn't been selected for Y. It may be vestigial. If it is now being selected for Y, then Y becomes its function after a period of selection.
  - **Causal-Role Prediction**: The trait's function is Y because that is what it currently contributes to the system. The historical function X is irrelevant to its current function.
  - **Why it matters**: This tests whether current contribution can override historical function.

  Note: We included four cruxes as they are all substantive and distinct. The directed-evolution case is not included to keep it to four, but it could be added if needed. However, we stick to the four that cover the most ground.

  ---

  **5. Confidence and Contingencies**

  For each crux, we assess confidence that settling it would move the debate and note any contingent empirical assumptions.

  - **Crux 1 (Hitchhiking Twin)**: High confidence. This directly tests the necessity of history. If we could show that in practice biologists attribute function in Population B, that might push the etiological side to reconsider. But note: the etiological side might dig in and say that Population B's allele lacks function. Assumption: The case is biologically possible and the causal profiles are identical. If in reality hitchhiking alleles often have slightly different effects due to genomic context, that might weaken the case.

  - **Crux 2 (First-Generation Gene)**: High confidence. The disagreement is stark. If de novo genes are found to be immediately functional in biology, that might challenge the etiological view. Assumption: De novo gene birth can produce functional genes immediately. If empirically de novo genes rarely have immediate fitness benefits, the crux becomes less pressing.

  - **Crux 3 (Selfish Element)**: Medium confidence. The disagreement here might be about the level of analysis. The etiological view can accommodate function at the transposon level if we accept it as a unit of selection. But if we insist on the organism level, the predictions diverge. Assumption: Transposons are not selected at the organism level. If in fact some transposons are co-opted for organismal function, then the case must be carefully chosen to be purely selfish.

  - **Crux 4 (Co-opted-and-Degenerate)**: High confidence. This is a classic case in the literature (like the appendix). If biologists now call Y the function, that supports the causal-role view. But the etiological view might argue that without selection for Y, it's not a function. Assumption: There are traits that have been co-opted without yet being selected for the new effect. If all traits that contribute positively are under selection, the case becomes harder to isolate.

  **Least Sure Claim**: The glossary definition of "function" as "explanatory" might be too vague. Both sides agree that functions are explanatory, but they mean different things by it. We are not sure if this definition will hold up under scrutiny.

  **Contingent Empirical Assumptions**:

  - For Crux 1: Assumes that hitchhiking can fix an allele without its effect being selected. If this is rare, the case may be seen as marginal.
  - For Crux 2: Assumes de novo gene birth with immediate fitness effects occurs. If it doesn't, the crux becomes hypothetical.
  - For Crux 4: Assumes there are traits that have been co-opted but not yet selected for the new effect. If co-option always involves selection, then the etiological view can handle it.

  If any assumption is false, the document would need to adjust the cases or note that the crux is less relevant in actual biology.

  ---

  **Document Structure**

  We now put it all together in a joint statement format.

  ---

  **Joint Statement on Function Attribution in Biology**

  **Introduction**

  We, the undersigned, represent two major accounts of function in biology: the selected-effects (etiological) account and the causal-role (systemic) account. After extensive discussion, we have identified points of agreement, clarified our disagreements, and established empirical cruxes that could help resolve the debate. This document is a joint statement of our current positions.

  **1. Glossary**

  To facilitate clear discussion, we define key terms:

  - **Function**: A characteristic effect of a trait that is explanatory in a biological context.
  - **Proper function** (for the etiological account): The effect for which a trait was historically selected.
  - **Malfunction**: A failure of a trait to perform its function.
  - **Design**: The property of a trait being shaped by natural selection for a particular effect (etiological emphasis).
  - **Selected effect**: The effect that caused a trait to be favored by natural selection in the past.
  - **System**: An organized set of interacting parts. Functions are often attributed relative to a system's capacities.

  **2. Agreed Claims**

  We agree on the following:

  1. Functions are a subset of a trait's effects. Not every effect is a function (e.g., the heart's sound is an effect but not a function).
  2. A trait can malfunction: it can fail to perform its function even if it has other effects.
  3. Function attributions can occur at multiple levels (e.g., gene, cell, organism, group).
  4. Artefacts have functions that can be analyzed similarly to biological traits, with design history (for etiological) or current role (for causal-role) being relevant.
  5. Many biological traits have functions that are the result of historical selection, but we disagree on whether this history is necessary.

  **3. Disagreements**

  We have the following residual disagreements:

  | Issue | Etiological View | Causal-Role View | Verdict |
  |-------|------------------|------------------|---------|
  | Necessity of History | A trait T in system S has function F only if T was selected in S's lineage because F contributed to fitness. | A trait T in system S has function F if T's doing F contributes to a capacity of S, regardless of S's history. | Genuine |
  | Malfunction Criteria | A trait malfunctions when it fails to perform the effect for which it was selected. | A trait malfunctions when it fails to perform the effect that it is supposed to perform in the current system. | Genuine |
  | Function in Novel Traits | A novel trait (without selection history) cannot have a function. | A novel trait can have a function immediately if it contributes to a system's capacity. | Genuine |
  | Function of Selfish Elements | A selfish element (e.g., transposon) does not have a function at the organism level because it was not selected for organismal fitness. | A selfish element has a function at its own level (e.g., replication) based on its causal role. | Genuine |

  **4. Empirical Cruxes**

  We propose the following cases as empirical cruxes. Each case is designed to test a core disagreement.

  **Crux 1: The Hitchhiking Twin**

  - Case: Two populations with the same allele fixed, same causal effect E. In Pop A, E was selected; in Pop B, the allele hitchhiked and E was fitness-irrelevant.
  - Question: Does the allele have function E in Pop B?
  - Etiological Prediction: No.
  - Causal-Role Prediction: Yes.

  **Crux 2: The First-Generation Gene**

  - Case: A de novo gene appears at generation 1 and immediately improves fitness. We examine it at generations 1, 10, 100, and 1000.
  - Question: At which generations does it have a function?
  - Etiological Prediction: Only after selection has acted (not at generation 1).
  - Causal-Role Prediction: Starting at generation 1.

  **Crux 3: The Selfish Element**

  - Case: A transposon that replicates itself, increasing its own representation but lowering organismal fitness.
  - Question: What is the function of the transposon at the organism level?
  - Etiological Prediction: No function at the organism level (may be a parasite).
  - Causal-Role Prediction: It has the function of replication at the genetic element level, but at the organism level it is dysfunctional.

  **Crux 4: The Co-opted-and-Degenerate Trait**

  - Case: A trait historically selected for X, now contributes Y and no longer does X.
  - Question: What is its current function?
  - Etiological Prediction: None (unless selected for Y).
  - Causal-Role Prediction: Y.

  **5. Confidence and Contingencies**

  We believe these cruxes can advance the debate. Our confidence:

  - Crux 1: High. It directly tests the necessity of history.
  - Crux 2: High. It tests whether selection history is required.
  - Crux 3: Medium. The disagreement may be level-relative, but it tests the attribution in a harmful element.
  - Crux 4: High. It tests whether current contribution can define function without history.

  **Contingencies**: Some cases rely on empirical assumptions (e.g., de novo genes with immediate effects exist). If false, the relevance of that crux diminishes.

  **Least Sure Point**: The glossary definition of "function" as "explanatory" may be too minimal. We accept it as a starting point but recognize it may need refinement.

  ---

  **Closing**

  We commit to revisiting these cruxes in light of new biological evidence and philosophical analysis.

  [Signatures]

