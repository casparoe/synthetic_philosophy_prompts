  First, I need to disentangle Gödel's three core arguments: the CTC possibility argument, relativity of simultaneity, and block universe implications. His 1949 rotating universe solution was really a vehicle for deeper metaphysical claims about time's unreality. The cosmology update eliminates physically real CTCs, but that feels more like losing a vivid example than his core premise - after all, he emphasized mere mathematical possibility as sufficient. 

  Interesting tension here: Gödel the Platonist might actually double down precisely because CTCs remain mathematically valid. Chronology protection wouldn't sway him - he'd see it as contingent physics obscuring deeper truths. But wait, would he consider flipping the script? Treating CTCs as reductio ad absurdum against relativity? Unlikely given his reverence for Einstein and willingness to embrace idealism over rejecting theory.

  Now the eternalism dominance is crucial. Modern physics has converged on his block universe view for entirely different reasons - relativity of simultaneity and time-symmetry. This actually strengthens his hand! Even without CTCs, the arguments he originally connected to relativity remain robust. 

  The entropy/statistical mechanics explanation of time's arrow is trickier. Gödel might dismiss it as merely accounting for psychological experience while leaving metaphysical becoming untouched. But that fourth hypothetical... ah, that's the golden nugget. If eternalism can internally generate the illusion of passage through computational constraints, that perfectly mirrors his idealism! He'd likely seize this as confirming his view: the "flow" isn't fundamental but arises from finite perspective within timeless reality.

  Final verdict? He'd reformulate. Strip away the CTC illustration, lean harder on eternalism's independent foundations, and frame psychological time as an emergent artifact - exactly what the "internal-view programme" suggests. The essay should mirror his precise, uncompromising style while integrating these modern threads seamlessly.
