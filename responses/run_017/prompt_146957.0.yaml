answer: |-
  1.  **Name and Definition:** This pattern is called **"finite agreement divergence"** (or sometimes "method bifurcation in the infinite"). It occurs when multiple extensionally equivalent criteria for comparing collections (e.g., bijection, proper subset inclusion, measure) *provably coincide* for all finite instances but yield contradictory results for infinite collections. Settled: The mathematical fact of this coincidence in finitude and divergence in infinitude is demonstrable.
  2.  **Settled Mathematical Core:** For finite sets, Cantor's pairing principle (bijection), subset inclusion ("A proper subset of B implies |A| < |B|"), and additive measures *all* agree and are interderivable (e.g., pigeonhole principle links pairing/subset). Settled: Proofs exist that these necessarily agree for finite sets, and proofs (Cantor, measure theory) show they diverge for infinite sets (e.g., bijection possible despite proper subset inclusion).
  3.  **Exclusion Criteria:** This excludes: (a) Simple paradoxes resolved by clarifying a *single* criterion (e.g., Zeno); (b) Methods known to be mere heuristics/approximations even for finite cases (e.g., visual estimation); (c) Cases where criteria *already disagree* for finite collections (e.g., comparing density vs count in large finite sets – they differ but the pairing/subset core still holds). Settled: These distinctions are clear.
  4.  **Nature of the Pre-Divergence Notion:** The "right thing" is that our pre-theoretic notion of "number" or "size" for finite collections *is* unified, but it's *provisionally unified* – its coherence relies on the equivalence of these distinct properties *only within the finite domain*. Moving to infinity forces specialization. Settled: The equivalence *is* contingent on finiteness; genuinely contested: Whether this implies the pre-theoretic concept was inherently pluralistic or whether the divergence reveals its finite limitations.
  5.  **Contested Philosophical Status:** Genuinely contested: Whether one criterion (usually bijection) is the uniquely "correct" extension of finite cardinality (Cantor's view, dominant in set theory), or whether divergent criteria represent equally valid, context-dependent notions of size (pluralist view, advocated by some philosophers and mathematicians working with measures, densities, etc.). The mathematical utility of each extension is settled; their philosophical primacy is not.
