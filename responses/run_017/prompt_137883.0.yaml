  - **Board**:
    - The common prior assumption (CPA): There exists a probability measure P on Ω such that for every agent i and every state ω, the posterior of i at ω is given by conditioning P on Πᵢ(ω).

    - Agreement Theorem: If at a state ω it is common knowledge that agent1's posterior for event E is p and agent2's is q, then p=q.

    - Proof sketch: 
        Let A be the event that agent1's posterior for E is p. 
        Let B be the event that agent2's posterior for E is q.
        The event C = A ∩ B is common knowledge at ω (by assumption). Then C is a union of meet elements. On each meet element, the posterior of agent1 is constant (because the meet element is contained in a partition element of agent1) and similarly for agent2. So on C, agent1's posterior is constantly p and agent2's is constantly q. 
        Now, consider the common prior P. Then for any meet element S contained in C, we have:
            P(E ∩ S) = P(E | S) P(S)
            But also, for agent1: P(E | Π₁(ω)) = p for every ω in S. Since S is contained in a single element of Π₁, say P1, then P(E | P1) = p. But then P(E ∩ P1) = p P(P1). Since S ⊆ P1, we have P(E ∩ S) = p P(S). Similarly, for agent2: P(E ∩ S) = q P(S). Therefore, p P(S) = q P(S), and since P(S)>0, we have p=q.

