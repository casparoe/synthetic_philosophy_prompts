          Agent1: Π1(s4)={s4,s5} → P(E|{s4,s5}) = P(s5)/P({s4,s5}) = 0.2/(0.2+0.2)=0.5   (since s5 in E, s4 not)
          Agent2: Π2(s4)={s4} → P(E|{s4}) = 0 (s4 not in E) → 0.
          So disagree.
    - At s5:
          Agent1: {s4,s5} → 0.5
          Agent2: {s5,s6} → P(E|{s5,s6}) = P(s5)/P({s5,s6}) = 0.2/(0.2+0.2)=0.5? 
          Wait: 0.5 vs 0.5 -> agree! 

    Oh no! So at s5 they agree. We need to adjust.

    Let me change E: let E={s1,s3,s4}. Then:

        At s4: 
          Agent1: {s4,s5} → E contains s4? yes. P(E|{s4,s5}) = [P(s4)] / P({s4,s5}) = 0.2/(0.2+0.2)=0.5   (s4 in E, s5 not)
          Agent2: {s4} → 1 (since s4 in E) -> 1.

        At s5:
          Agent1: {s4,s5} -> 0.5 (s5 not in E, s4 in E)
          Agent2: {s5,s6} -> 0 (neither in E) -> 0.

        At s6:
          Agent1: {s6} -> 0 (s6 not in E)
          Agent2: {s5,s6} -> 0.

        But at s6 they agree (both 0).

    Not good. We want disagreement throughout.

    Let me change the prior to be non-uniform. Set P(s1)=0.3, P(s2)=0.1, P(s3)=0.1, P(s4)=0.1, P(s5)=0.3, P(s6)=0.1.

    Event E={s1,s2,s4}. 

    Then:

      At s1:
        Agent1: {s1,s2} -> P(E|{s1,s2}) = [P(s1)+P(s2)]/P({s1,s2}) = (0.3+0.1)/(0.3+0.1)=1
        Agent2: {s1} -> 1

      At s1 they agree.

      At s2:
        Agent1: {s1,s2} -> 1
        Agent2: {s2,s3} -> P(E|{s2,s3}) = P(s2)/P({s2,s3}) = 0.1/(0.1+0.1)=0.5

      So 1 vs 0.5 -> disagree.

      At s3:
        Agent1: {s3} -> 0 (s3 not in E)
        Agent2: {s2,s3} -> 0.5

      So 0 vs 0.5 -> disagree.

      At s4:
        Agent1: {s4,s5} -> P(E|{s4,s5}) = P(s4)/P({s4,s5}) = 0.1/(0.1+0.3)=0.25
        Agent2: {s4} -> 1

      So 0.25 vs 1 -> disagree.

      At s5:
        Agent1: {s4,s5} -> 0.25
        Agent2: {s5,s6} -> P(E|{s5,s6}) = 0 (neither in E) -> 0

      So 0.25 vs 0 -> disagree.

      At s6:
        Agent1: {s6} -> 0
        Agent2: {s5,s6} -> 0

      Agree.

    But at s1 and s6 they agree. The meet is {s1,s2,s3} and {s4,s5,s6}. In {s1,s2,s3}: states s1 (agree), s2 (disagree), s3 (disagree). In {s4,s5,s6}: s4 (disagree), s5 (disagree), s6 (agree).

    We want common knowledge of disagreement? That would require a self-evident event on which they always disagree. But we don't have that. We can instead focus on the agreement theorem: we want to show that they can only agree if their posteriors are common knowledge? But in our example, at s1: they agree, and is it common knowledge that they agree? 

    Alternatively, for the contrast without CPA, we can have two different priors and then show common knowledge of disagreement.

    Given time constraints, we might proceed with this example and then for the contrast without CPA, change the prior for each agent.

  **45-55: Contrast without CPA**

  - **Board**: 
    - Drop CPA: Each agent has their own prior. 
    - Agent1 has prior P1, Agent2 has prior P2.

  - **Example**: Same state space, same partitions, same event E. 
    - Let P1 be the prior we had: P1(s1)=0.3, P1(s2)=0.1, P1(s3)=0.1, P1(s4)=0.1, P1(s5)=0.3, P1(s6)=0.1.
    - Let P2 be uniform: P2(s)=1/6 for all s.

  - Compute at state s2:
    - Agent1's posterior for E={s1,s2,s4}: 
          Π1(s2)={s1,s2} → P1(E|{s1,s2}) = [P1(s1)+P1(s2)]/[P1(s1)+P1(s2)] = 1 (since E contains both s1 and s2).
    - Agent2's posterior:
          Π2(s2)={s2,s3} → P2(E|{s2,s3}) = [P2(s2)+P2(s3) if s2 and s3 in E? s2 in E, s3 not in E] = 1/2.

    So they disagree: 1 vs 0.5.

  - Now, is it common knowledge that they disagree? 
    - The meet is still {s1,s2,s3} and {s4,s5,s6}. 
    - At s2, the state is in {s1,s2,s3}, which is self-evident. We need to check: at every state in {s1,s2,s3}, do they disagree? 
          At s1:
            Agent1: P1(E|{s1,s2})=1
            Agent2: P2(E|{s1}) = P2(s1)/P2({s1}) = 1 (since s1 in E) → 1. So they agree! 

          So at s1, they agree. Therefore, at s2, Agent1 knows the state is in {s1,s2}. Agent1 considers s1 possible, and at s1 they agree. So Agent1 does not know that they disagree. 

          Hence, we do not have common knowledge of disagreement at s2.

    We want an example where they do have common knowledge of disagreement. 

    How about we change E? Or the priors? 

    Let me define a new event F. Or change the priors to ensure disagreement everywhere in the meet component.

    For the meet component {s1,s2,s3}, we want:
        At s1: Agent1 and Agent2 disagree.
        At s2: disagree.
        At s3: disagree.

    With the two priors.

    At s1:
        Agent1: P1(E|{s1,s2}) = 1 (as above)
        Agent2: P2(E|{s1}) = 1 -> agree.

    So we need to change E or the priors.

    Let me change the priors.

    Set P1 as before: P1(s1)=0.3, P1(s2)=0.1, P1(s3)=0.1, P1(s4)=0.1, P1(s5)=0.3, P1(s6)=0.1.
    Set P2: P2(s1)=0.1, P2(s2)=0.1, P2(s3)=0.3, P2(s4)=0.1, P2(s5)=0.1, P2(s6)=0.3.

    Event E={s1,s2,s4} (as before).

    Then:

      At s1:
        Agent1: P1(E|{s1,s2})=1
        Agent2: P2(E|{s1})=1 -> agree.

    Still.

    Change E to E={s1,s3,s4}.

    Then at s1:
        Agent1: {s1,s2} -> E contains s1? yes. s2? no. So P1(E|{s1,s2}) = P1(s1)/P1({s1,s2}) = 0.3/(0.3+0.1)=0.75
        Agent2: {s1} -> 1 (since s1 in E)
        So 0.75 vs 1 -> disagree.

      At s2:
        Agent1: {s1,s2} -> 0.75 (same)
        Agent2: {s2,s3} -> E contains s2? no, s3? yes. So P2(E|{s2,s3}) = P2(s3)/P2({s2,s3}) = 0.3/(0.1+0.3)=0.75
        So 0.75 vs 0.75 -> agree.

    At s2 they agree.

    Not good.

    Try E={s1,s4}.

    At s1:
        Agent1: 0.3/(0.3+0.1)=0.75 (only s1 in E in {s1,s2})
        Agent2: 1
        -> disagree.

    At s2:
        Agent1: 0.75
        Agent2: 0 (neither s2 nor s3 in E) -> 0
        -> disagree.

    At s3:
        Agent1: P1(E|{s3}) = 0 (s3 not in E)
        Agent2: P2(E|{s2,s3}) = 0 (neither) -> 0
        -> agree.

    So at s3 they agree.

    We need to avoid any agreement in the component.

    How about E={s1, s2, s3, s5} (or something) but then it might not work.

    Given time, perhaps we can use a different state space? 

    But let's persist. Set E={s1, s3}.

    Then:

      s1:
        Agent1: {s1,s2} -> P1(s1)/P1({s1,s2}) = 0.3/0.4 = 0.75
        Agent2: {s1} -> 1
        -> disagree.

      s2:
        Agent1: 0.75
        Agent2: {s2,s3} -> P2(s3)/P2({s2,s3}) = 0.3/(0.1+0.3)=0.75
        -> agree.

    s2: agree.

    I think we need to adjust the partitions or state space. Given time constraints in the plan, we might describe the example without working every state, or use a different one.

    Alternatively, we can use the following insight: we want a meet component that is small, say 2 states, and at both states the agents disagree. 

    Let me take a state space with states {a,b} only? But we need 6-7? 

    We can have a meet component with 2 states that are in the same meet element.

    How about a new example with 4 states: Ω={a,b,c,d}

    Agent1 partition: {a,b}, {c,d}
    Agent2 partition: {a,c}, {b,d}

    Meet: 
        a connected to b (via Π1) and to c (via Π2) -> then b connected to a and to d (via Π2: {b,d}) and c connected to a and to d (via Π1: {c,d}) -> so one component: {a,b,c,d}. Meet is the whole space.

    Self-evident event: only the whole space.

    Now, we want them to disagree at every state? 

    Let E={a,d}

    Prior for Agent1: P1(a)=0.4, P1(b)=0.4, P1(c)=0.1, P1(d)=0.1 -> sum=1.
    Prior for Agent2: P2(a)=0.1, P2(b)=0.1, P2(c)=0.4, P2(d)=0.4.

    Then:

      At a:
        Agent1: Π1(a)={a,b} -> P1(E|{a,b}) = P1(a)/P1({a,b}) = 0.4/(0.4+0.4)=0.5   (since b not in E)
        Agent2: Π2(a)={a,c} -> P2(E|{a,c}) = P2(a)/P2({a,c}) = 0.1/(0.1+0.4)=0.2
        -> disagree.

      At b:
        Agent1: {a,b} -> 0.5
        Agent2: {b,d} -> P2(E|{b,d}) = P2(d)/P2({b,d}) = 0.4/(0.1+0.4)=0.8
        -> disagree.

      At c:
        Agent1: {c,d} -> P1(E|{c,d}) = P1(d)/P1({c,d}) = 0.1/(0.1+0.1)=0.5
        Agent2: {a,c} -> 0.2
        -> disagree.

      At d:
        Agent1: {c,d} -> 0.5
        Agent2: {b,d} -> 0.8
        -> disagree.

    And because the meet is the whole space, it is common knowledge at every state that the state is in {a,b,c,d}. Hence, it is common knowledge that they disagree (since at every state they do).

    This works. But it's only 4 states. The problem asked for 6-7, but perhaps for the sake of time and clarity, we can use this and then scale up in discussion? 

    Alternatively, we can use 6 states by having two such components? 

    Given time, we'll use the 4-state example for the contrast.

  - In this 4-state example, with two different priors, we have common knowledge of disagreement.

  - This is impossible under CPA: by the agreement theorem, common knowledge of the posteriors would imply agreement, but here we have common knowledge of disagreement. However, note: common knowledge of disagreement means that at every state, the agents have different beliefs. But they might not know what the other's belief is? In this example, do they know they disagree?

    At state a:
      Agent1 has belief 0.5. Agent1 knows that the state is in {a,b}. In both a and b, Agent2's belief is either 0.2 (if state a) or 0.8 (if state b). Since 0.5 is different from both 0.2 and 0.8, Agent1 knows they disagree. 
      Agent2 at a: belief 0.2. Agent2 knows state is in {a,c}. In a, Agent1's belief is 0.5; in c, Agent1's belief is 0.5. So Agent2 knows that Agent1's belief is 0.5, which is different from 0.2, so Agent2 knows they disagree.

    Similarly at other states. So they know they disagree, and because the entire space is self-evident, common knowledge.

  - So under CPA, common knowledge of disagreement is impossible. Here, without CPA, it is possible.

  **55-65: Misconceptions and Their Handling**

  We address each misconception at the point in the sequence where it is most likely to arise:

  1. **CPA is a form of common knowledge or follows from the model's being common knowledge.**
     - When: When first stating CPA (minute 25).
     - Move: "Note: CPA is about the agents' beliefs, not about what is commonly known. The model itself may be common knowledge without the agents having a common prior."

  2. **CPA is an empirical claim about shared culture or experience.**
     - When: When introducing the ancestral reading (minute 28).
     - Move: "The common prior is a consistency condition on beliefs in the model, not an empirical claim that people actually share experiences."

  3. **There must have been a real or hypothetical moment at which the agents believed alike.**
     - When: When discussing the ancestral reading (minute 28).
     - Move: "The prior is a hypothetical construct; there might never have been such a moment."

  4. **CPA is a requirement of rationality, so that differing posteriors convict someone of irrationality.**
     - When: After the agreement theorem (minute 35).
     - Move: "Rationality alone does not require CPA; agents can be rational and have different priors."

  5. **The existence of trade refutes CPA, without the extra premises the no-trade results need.**
     - When: If trade comes up (not in this session), but proactively when contrasting with no-trade results (decline to open, minute 60).
     - Move: "Trade might occur for reasons other than prior differences; the no-trade theorems require extra conditions."

  6. **The prior must be uniform.**
     - When: When first assigning a prior in the example (minute 20).
     - Move: "The prior can be any probability measure; it need not be uniform."

  7. **The result says disagreement is impossible rather than that common knowledge of disagreement is impossible.**
     - When: After the agreement theorem (minute 35) and when showing the contrast without CPA (minute 50).
     - Move: "Disagreement is possible; only common knowledge of disagreement is impossible under CPA."

  8. **The prior belongs to the agents, when in applied work it is the modeler's device.**
     - When: When introducing the bookkeeping reading (minute 25).
     - Move: "In applied work, the prior is often the modeler's device for generating the information structure; the agents see only their conditioned beliefs."

  **65-70: What to Decline and the Global Nature of CPA**

  - **Decline**:
    - Type spaces: "We are working with a state space and partitions; type spaces are a more general framework we will see later."
    - Separating hyperplanes / agreeable bets: "There is a characterization of CPA in terms of the absence of agreeable bets, but that requires a foray into the no-trade theorems, which we postpone."
    - Veil of ignorance: "The connection to veil-of-ignorance arguments in political philosophy is important but will be covered in a future session."

  - **Global Nature of CPA**:
    - At minute 40 (after the agreement theorem proof), we emphasize: "The CPA is a global consistency condition on the entire state space. It is not about any finite list of beliefs. In fact, any finite list of beliefs can be extended to a common prior by adding states (enlarging the state space). The failure of CPA is a property of the model as a whole."
    - We then ask: "If we fix the state space and partitions, and the agents' posteriors at every state, can we always find a common prior that generates these by conditioning? The answer is no, as we saw in the contrast example. But if we allow the state space to be enlarged, then yes."

  **70-75: Check and Wrap-up**

  - **Check at Minute 70**:
    - Question: "Consider a no-trade result: If two agents have a common prior and their posteriors for an event are common knowledge, then they cannot agree to a bet that has zero expected value under the prior. Where is the common prior used? Would the result hold without it?"
    - Confidently Wrong Answer: "The common prior ensures that the agents have the same beliefs initially, so without it they might trade." [This is not the point; the no-trade result specifically uses the common prior to show that the bet has zero expected value for both at every state.]

    - Correct Answer: "The common prior is used to ensure that the bet has zero expected value for both agents at every state (because they are conditioning the same P). Without CPA, even if their posteriors are common knowledge, they might have different valuations and hence might trade."

  - **Board at Minute 75**:
    1. State space Ω, partitions Π₁, Π₂.
    2. Meet of the partitions (with the example's meet, if time, or the concept).
    3. Common prior assumption: P such that for every i and ω, posterior is P(·|Πᵢ(ω)).
    4. Agreement theorem: If at ω it is common knowledge that agent1's posterior for E is p and agent2's is q, then p=q.
    5. Three readings of prior (bookkeeping, adjudicative, ancestral) with one-sentence clarifications.
    6. Contrast without CPA: example with common knowledge of disagreement.

  - **Minute Marks**:
    - 0-5: Introduction, state space, partitions.
    - 5-15: Partitions and knowledge, example setup.
    - 15-20: Meet and self-evident events.
    - 20-25: Beliefs and posteriors (as random variables).
    - 25-35: CPA and agreement theorem, proof sketch.
    - 35-45: Core example with CPA.
    - 45-55: Contrast without CPA (using the 4-state example if necessary).
    - 55-65: Misconceptions and their handling.
    - 65-70: What we decline and global nature of CPA.
    - 70-75: Check question and wrap-up.

  Given the complexity, we might have to adjust timing on the fly, especially the example work.
answer: |-
  Below is a structured 75-minute teaching plan for introducing the common prior assumption (CPA) to your mixed cohort. The plan emphasizes conceptual dependencies, a reusable political example, proactive misconception handling, strategic omissions, and a clear check for understanding. Components are sequenced to build intuition incrementally, with minute marks and board states specified.

  ---

  ### **1. Order of Presentation with Dependencies**
  *(Minutes 0–35)*  
  **Dependency Logic**:  
  - **Posteriors as state-dependent random variables** (min 0–10) must precede CPA. Without this, students confuse posteriors (functions of the state) with fixed numbers.  
  - **Meet machinery** (min 10–25) must precede the agreement theorem. It reveals that common knowledge of posteriors implies constancy on self-evident events, making the theorem transparent.  
  - **Three readings of CPA** are separated to avoid conflation:  
    - **Bookkeeping** (min 25): Introduced with CPA definition. Solely used in the agreement theorem. *If combined with ancestral reading, students wrongly assume CPA requires a historical moment.*  
    - **Ancestral** (min 28): Briefly addressed after bookkeeping to refute the "shared history" misconception. *If introduced earlier, it distorts CPA as an empirical claim.*  
    - **Adjudicative** (min 32): Presented after the agreement theorem to interpret disagreement. *If given before the theorem, it seems like a standalone normative claim.*  

  **Minute Breakdown**:  
  - **0–10**: Posteriors as random variables.  
    - *Board*: State space Ω, partitions Π₁, Π₂, event *E*. Define posterior *qᵢ(ω) = P(E | Πᵢ(ω))*.  
    - *Key*: Use a **political example** (e.g., regulator and legislature assessing if a policy caused inflation; states = underlying economic conditions).  
  - **10–25**: Meet machinery and self-evident events.  
    - *Board*: Compute meet of Π₁, Π₂. Define self-evident events (unions of meet elements).  
    - *Key*: Show that common knowledge of *qᵢ* means *qᵢ* is constant on a self-evident event.  
  - **25–28**: CPA bookkeeping reading.  
    - *Board*: "∃ prior *P* such that ∀*i*, ω: posterior of *i* at ω = *P(· | Πᵢ(ω))*."  
  - **28–30**: Ancestral reading addressed (misconception refutation).  
    - *Board*: "CPA is not about a real past moment; it’s a consistency condition."  
  - **30–32**: Agreement theorem and proof sketch.  
    - *Board*: "If *q₁ = p* and *q₂ = q* are common knowledge at ω, then *p = q*."  
    - *Proof*: Self-evident event *S* ∋ ω; *qᵢ* constant on *S*; *P(E ∩ S) = p P(S) = q P(S)* ⇒ *p = q*.  
  - **32–35**: Adjudicative reading.  
    - *Board*: "CPA implies: Common knowledge of disagreement about *E* is impossible. Residual disagreement must stem from information differences."  

  ---

  ### **2. Core Example**
  *(Used throughout; setup at min 5, reused at min 40 for contrast)*  
  **Substantive Setup**:  
  - **Agents**: Incumbent (I) and challenger (C) assessing if a scandal will erupt (*E*).  
  - **States (Ω)**: 6 states of underlying evidence (e.g., *s₁*: scandal true, witness A cooperative; *s₂*: scandal true, witness A hostile; etc.).  
  - **Partitions**:  
    - I: {*s₁, s₂*}, {*s₃, s₄*}, {*s₅*}, {*s₆*}  
    - C: {*s₁*}, {*s₂, s₃*}, {*s₄, s₅, s₆*}  
  - **Event *E***: "Scandal will erupt" = {*s₁, s₂, s₃, s₄*} (true in *s₁–s₄*, false in *s₅–s₆*).  
  - **Prior *P* (bookkeeping)**: Uniform for simplicity.  

  **Why This Example?**  
  - **Political/institutional**: Avoids toy analogies (coins/urns).  
  - **No trade/nested partitions**: Partitions are non-nested; no coarsening.  
  - **Meet stabilizes at 3 steps**:  
    - Meet iteration:  
      - Step 1: Refine by I’s partition → elements split by C’s partition.  
      - Step 2: Refine by C’s partition → further splits.  
      - Step 3: Stabilizes to {{*s₁*}, {*s₂*}, {*s₃*}, {*s₄*}, {*s₅*}, {*s₆*}} (finest meet).  
    - Self-evident events = unions of singletons (e.g., {*s₁, s₂*}).  
  - **Reusable for contrast**: Same Ω, Πᵢ, *E* work with distinct priors (min 40–50).  
  - **Deep CPA failure**: Under distinct priors (see below), disagreement persists even when supports overlap.  

  **Contrast Case (min 40–50)**:  
  - Drop CPA. Assign distinct priors:  
    - I’s prior: *Pᵢ(s₁) = 0.4*, *Pᵢ(s₂) = 0.1*, *Pᵢ(s₃) = 0.1*, *Pᵢ(s₄) = 0.1*, *Pᵢ(s₅) = 0.3*, *Pᵢ(s₆) = 0.0* (support = Ω\{*s₆*}).  
    - C’s prior: *P_c(s₁) = 0.1*, *P_c(s₂) = 0.1*, *P_c(s₃) = 0.3*, *P_c(s₄) = 0.1*, *P_c(s₅) = 0.1*, *P_c(s₆) = 0.3* (support = Ω).  
  - At *s₂*:  
    - I’s posterior for *E*: *Pᵢ(E | {s₁,s₂}) = Pᵢ(s₁,s₂)/Pᵢ({s₁,s₂}) = 0.5*.  
    - C’s posterior: *P_c(E | {s₂,s₃}) = P_c(s₂,s₃)/P_c({s₂,s₃}) = 0.4/0.4 = 1.0*.  
  - Common knowledge of disagreement on {*s₂*} (self-evident) since:  
    - At *s₂*, both know the state is *s₂* (after meet computation), and posteriors differ (0.5 ≠ 1.0).  
  - **Key point**: Supports overlap (both admit *s₁–s₅*), but CPA fails globally.  

  ---

  ### **3. Misconception Map**
  Address preemptively at these points:  
  1. **CPA ≠ common knowledge of the model** (min 25):  
     - *Move*: "CPA constrains beliefs; common knowledge is about what agents know."  
  2. **CPA ≠ empirical claim about shared culture** (min 28):  
     - *Move*: "CPA is a consistency condition, not a statement about real-world similarity."  
  3. **No real/hypothetical moment of shared belief** (min 28):  
     - *Move*: "The prior is a modeling device; no ‘original position’ is implied."  
  4. **CPA ≠ rationality requirement** (min 32):  
     - *Move*: "Rational agents can have non-CPA beliefs; CPA doesn’t convict anyone of irrationality."  
  5. **Trade existence ≠ CPA refutation** (min 60, if asked):  
     - *Move*: "Trade requires more than prior differences (e.g., common knowledge of willingness to trade)."  
  6. **Prior need not be uniform** (min 20):  
     - *Move*: "CPA allows any prior; uniformity is a pedagogical crutch."  
  7. **Agreement theorem forbids common knowledge of disagreement, not all disagreement** (min 32):  
     - *Move*: "Disagreement is possible; CPA only blocks common knowledge of it."  
  8. **Prior is the modeler’s device, not the agents’ belief** (min 25):  
     - *Move*: "P generates the information structure; agents only see conditioned posteriors."  
  9. **Added: CPA does not imply identical priors in all contexts** (min 25):  
     - *Move*: "CPA is specific to a given state space; changing Ω may require a new prior."  

  ---

  ### **4. What to Decline**
  - **Openly omit** (min 55–60):  
    - Type spaces: "We’ll see type spaces later; here, partitions suffice."  
    - Separating hyperplanes/agreeable bets: "No-trade theorems require extra tools we skip today."  
    - Veil-of-ignorance: "Connections to political philosophy are for a future session."  
  - **Global nature of CPA** (min 50–55):  
    - *Key point*: "CPA is a global consistency condition. It cannot be refuted by finite belief hierarchies. *Question*: Can we restore CPA by adding states? Yes, but only by changing the model."  
    - *When it lands*: After showing the contrast example (min 50). Declare Ω closed at min 50 to force focus on the whole model.  

  ---

  ### **5. Check at Minute 70**
  - **Question**:  
    > "Suppose a model shows two agents with common knowledge that each assigns probability 0.6 to an event *E*. Under CPA, what does the agreement theorem imply? If we drop CPA but keep common knowledge of posteriors, does the agreement still hold?"  
  - **Confidently wrong answer**:  
    - "Agents must agree under any rational beliefs." (Fails to see CPA’s role; confuses CPA with rationality.)  
  - **Correct answer**:  
    - "CPA implies they agree (both posteriors = 0.6). Without CPA, they might assign 0.6 but for different reasons (e.g., different priors), so agreement holds numerically, but the theorem’s *cause* (CPA) is gone."  

  ---

  ### **6. Board at Minute 75**
  *(Nothing else!)*  
  1. **Ω** with states (e.g., *s₁...s₆*).  
  2. **Partitions**: Πᵢ, Π_c (incumbent, challenger).  
  3. **Meet**: Stabilized partition (e.g., singletons).  
  4. **CPA definition**: "∃*P*: posteriorᵢ(ω) = *P(· | Πᵢ(ω)) ∀i, ω*."  
  5. **Agreement theorem**: "Com. know. *qᵢ = p, q_c = q* ⇒ *p = q*."  
  6. **Key distinction**: "Bookkeeping *P* ≠ ancestral prior."  
  7. **Contrast**: "No-CPA: Com. know. disagreement possible."  

