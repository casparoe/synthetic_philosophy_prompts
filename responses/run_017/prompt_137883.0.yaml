    - We needed the meet to define common knowledge (via self-evident events) and to express the constancy of the posteriors on these events.
    - We needed the posterior as a function of the state (random variable) to even state the agreement theorem.

  - **Introduce the Three Readings of the Prior**:
    1. **Ancestral Reading**: "The belief the agents held before their information diverged." 
       - We introduce this first because students arrive with it. But we note that the CPA does not require that there was an actual moment when they had this belief. It is a hypothetical.
       - We head off the misconception that there must have been a real moment.

    2. **Bookkeeping Reading**: "A single measure on Ω that reproduces each agent's posterior by conditioning on their partition."
       - This is the one used in the agreement theorem. We emphasize that this is a consistency condition on the entire system of beliefs.

    3. **Adjudicative Reading**: "The standpoint from which any residual disagreement is credited to information alone."
       - We introduce this after the agreement theorem to explain the "all disagreement is really disagreement about information" interpretation.

  - **Order of Introduction**:
    1. Start with the bookkeeping reading when defining CPA (minute 25) because it is the definition used in the theorem.
    2. Immediately contrast with the ancestral reading: "Note: we are not claiming that there was a real time when the agents held P. It is a consistency condition." (minute 28)
    3. After proving the agreement theorem, introduce the adjudicative reading: "The CPA ensures that if agents have common knowledge of their posteriors, they must agree. Thus, any remaining disagreement must be due to different information, not because of different prior beliefs." (minute 32)

  - **Why not together?**
    - If we introduce ancestral and bookkeeping together, students might conflate the hypothetical ancestral belief with the bookkeeping device. The ancestral reading is often tied to an actual event (a real prior time) and can lead to the misconception that the CPA is refuted if there was no such time. The bookkeeping device stands alone.
    - The adjudicative reading is a consequence of the agreement theorem, so it should come after.

