  - **Purpose-driven focus**: All desiderata are evaluated against the need for a *practical sorting tool*. D4 (usable upshot) is the linchpin, as it ensures the argument delivers actionable guidance—often neglected in theoretical EDAs.
  - **Test case resolution**: The propagation rule (D8) debunks both promise-keeping and far-future people judgments because the latter is an unsupported inference from debunked norms. This underscores the need for D8 and D11 to handle derived beliefs.
  - **Critical conflicts**: The D1–D7 tension highlights that third-factor replies (B) must be addressed without abandoning sensitivity. The D8–D2 clash requires propagation rules to respect selectivity (e.g., independent justification halts debunking).
  - **Scorecard implications**: No position fully satisfies all desiderata. A best serves debunking but fails practicality; D offers guidance but lacks empirical and inferential rigor. B and C resist debunking entirely, failing the purpose.
  - **Added desiderata**: D10 and D11 are essential for your purpose—preventing paralysis (D10) and enabling nuanced sorting (D11).

