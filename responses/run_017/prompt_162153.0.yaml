prompt: |-
  I'm a graduate student pulling together the second half of a reading-group syllabus on evolutionary debunking arguments in metaethics, and it has dawned on us that we have spent three weeks trading objections and replies without ever settling what such an argument is supposed to accomplish. So before we read one more paper I want the specification, and I want you to help me build it rather than hand me a taxonomy of positions. Fix the purpose as follows, since adequacy has to be adequacy for something: I am not asking for an argument that merely shows moral realism has an epistemological problem, or that leaves its user with a large set of moral beliefs she is told she cannot justifiably hold but is given no instruction about. I want an argument that a reflective agent could actually use to sort her first-order moral convictions — which to keep at full confidence, which to retain while lowering confidence, which to stop asserting while continuing to act on, which to jettison — and to do that without collapsing into either global skepticism about reason or a quietism on which nothing was ever at stake. Whatever else lands on the list, it has to earn its place by serving that purpose.

  The case I keep returning to, partly because I think it decides more than people notice: imagine we learn that in our lineage two sets of moral judgments were shaped in very different ways. Judgments about promise-keeping and reciprocity were shaped heavily by selection for reputation management in small bands, with all the parochialism that implies. Judgments about the moral significance of people who will live centuries from now were shaped by nothing in particular — no selection, no cultural selection, no ancestral occasion to form them; we now form them by taking a norm that was shaped by small-band reciprocity and extending it with generalizing reasoning, off-label. Which set, if either, does a debunking argument actually reach? The parochial one is the obvious target, but the future-people judgment is an extrapolation from a debunked norm, and I can't tell whether debunking propagates along the reasoning that produced it or stops at the beliefs selection actually touched. That puzzle should be a test case for the list, not a footnote. Here is my scratch set of candidate requirements, several of which I suspect are really just prejudices of one camp or another, and I want you to tell me which: (i) sensitivity/independence — the genealogy must show our moral beliefs would have been what they are had the moral facts been different; (ii) selectivity — a principled account of which beliefs are debunked, and why the argument doesn't take down logic, arithmetic, modality, or memory along the way; (iii) a clean distinction between removing justification and establishing falsity, i.e. between the agnostic and the error-theoretic conclusion; (iv) a usable upshot for the agent, given my purpose; (v) falsifiability — some finding in evolutionary biology, archaeology, or cross-cultural psychology that would defeat the argument; (vi) non-self-effacement — it must not rest on a premise about the causal inefficacy of normative facts that also undercuts the debunker's own reliance on epistemic norms; (vii) a worked response to third-factor replies, where the facts selection tracked are necessarily correlated with, or partly constitutive of, the moral facts; (viii) a rule for how debunking propagates through inference; (ix) neutrality on contested metasemantics; and as suspected camp prejudices, (x) that an adequate argument must leave moral knowledge possible, and (xi) that it must not lean on intuitive verdicts about cases at all. Add the ones I've missed, aiming for eight to twelve in total.

  For each requirement I want: a one-or-two-sentence statement; the concrete case or consideration that motivates it (the case, not the slogan); a status of non-negotiable, negotiable, or camp-prejudice; what is lost or gained by relaxing it; and which candidates it excludes. Then flag any pair or triple of requirements you think cannot be jointly satisfied — if some subset is unsatisfiable, that is a result about the list itself and I most want to see it — and name the single requirement that does the most work in ruling candidates out. Finally, grade four positions I'll define in my own words so we needn't argue about labels: A, the argument that selection operated on the contents of moral judgment in ways insensitive to independent moral facts, so those beliefs are unjustified and likely false; B, the reply that selection tracked fitness-relevant natural facts which are themselves morally significant or necessarily co-vary with the moral facts; C, the reply that an evolutionary explanation of why we hold a belief is evidentially inert, since a true causal story about belief-acquisition is compatible with the belief's being supported by independent reasons; D, the position that the debunking touches justification only, leaves truth untouched, and recommends retaining the beliefs in some non-doxastic practical attitude. Keep the weight on the criteria; the grading should be a few words per cell.

  Return the whole thing as a single JSON object with exactly these keys: "purpose" (one sentence, your restatement of what the argument is for); "desiderata" (an array of objects, one per requirement, each with fields "id" as D1, D2 and so on, "name", "statement", "motivating_case", "status", "cost_of_relaxing", "excludes"); "conflicts" (an array of objects with fields "ids" as an array of the clashing ids, "tension", "verdict" — whether the clash is genuine and which requirement you would keep); "most_excluding" (an object with fields "id" and "rationale"); "added_beyond_my_list" (an array of strings, one per desideratum you contributed yourself); "case_verdict" (an object with fields "promise_keeping", "far_future_people", "reasoning", the last being your rule for how debunking propagates); and "scorecard" (an object keyed "A", "B", "C", "D", each an object with fields "passes" as an array of ids, "fails" as an array of ids, "one_line").
reasoning: |-
  We are building a set of desiderata for an evolutionary debunking argument (EDA) that serves a specific purpose: to help a reflective agent sort her first-order moral convictions in a practical way, without collapsing into global skepticism or quietism. The argument must be usable for adjusting confidence levels and practical stances toward different moral beliefs.

  We start with the user's scratch list and add more as needed. The goal is 8-12 desiderata.

  User's initial list (with my labels for reference):

  (i) sensitivity/independence: D1
  (ii) selectivity: D2
  (iii) clean distinction (justification vs falsity): D3
  (iv) usable upshot: D4
  (v) falsifiability: D5
  (vi) non-self-effacement: D6
  (vii) response to third-factor: D7
  (viii) propagation rule: D8
  (ix) neutrality on metasemantics: D9
  (x) camp prejudice: moral knowledge possible? (call this D10, but note it's a prejudice)
  (xi) camp prejudice: no reliance on intuitive verdicts? (call this D11, prejudice)

  We note that (x) and (xi) are marked as camp prejudices, so we might not include them as core requirements but note their status.

  Now, what is missing? Let's think:

  - The argument must be non-self-undermining in a different way: it must not rely on epistemic principles that are themselves debunked by the same logic (this is similar to D6 but broader? D6 is about causal inefficacy of normative facts undercutting epistemic norms). We have D6.

  - Perhaps a requirement about the scope of the debunking: it should not lead to global skepticism (this is implicit in the purpose, but we can make it explicit). Let's call this D12: non-global-skepticism.

  - Another: the argument must provide guidance on how to adjust beliefs in practice, not just say they are unjustified. This is related to D4 but more specific. However, D4 already says "usable upshot".

  - A requirement that the debunking argument does not presuppose a controversial metaethical view (like realism or anti-realism) beyond what is necessary. The user has D9 (neutrality on metasemantics) which covers this.

  - Perhaps a requirement about the explanatory role of moral facts: if the genealogy shows that moral facts play no role in explaining our beliefs, that is a key part. This is related to D1 (sensitivity) but we might distinguish.

  Let me look at the literature. Common elements in EDAs:

  - An explanatory premise: our moral beliefs are explained by evolutionary forces without the moral facts playing a role.
  - A sensitivity premise: if the moral facts had been different, we would still have the same beliefs (due to evolution).
  - Then an epistemological premise: this undermines justification.

  But we need more for the purpose.

  I propose adding:

  D12: Non-global-skepticism - The argument must not imply that all our beliefs (e.g., in logic, math, perception) are unjustified, only the targeted moral ones. (This is similar to D2 but broader? D2 is about selectivity, which is the same idea.)

  Actually, D2 (selectivity) already covers this: "a principled account of which beliefs are debunked, and why the argument doesn't take down logic, arithmetic, modality, or memory along the way." So we don't need another.

  What else?

  D13: Practical guidance - The argument must provide clear directives for how to adjust one's attitudes (e.g., lower confidence, jettison, etc.) toward the debunked beliefs. (This is a strengthening of D4.)

  But D4 (usable upshot) already says: "a usable upshot for the agent, given my purpose". So we can elaborate in the statement.

  Another missing one: the argument must be able to handle the fact that some moral beliefs might be influenced by evolution but also by other factors (like rational reflection). This is related to the propagation rule (D8) and the test case.

  So let me define the desiderata we will use. We have 9 from the user (D1 to D9) and we mark D10 and D11 as prejudices that we might not include as core, but we can list them with status "camp-prejudice".

  But the user wants 8-12, so we should add at least one or two more.

  I propose:

  D10: Non-undermining of practical reason - The argument must not undermine the agent's ability to engage in practical deliberation and action. (This is to avoid collapse into quietism or paralysis.)

  D11: Differential treatment - The argument must allow for the possibility that some moral beliefs are more debunked than others, and provide a basis for comparing degrees of debunking. (This is important for the sorting purpose.)

  But note: the user had (x) and (xi) as prejudices, so we can renumber.

  Let me list the core desiderata without the prejudices first.

  Core list:

  1. D1: Sensitivity/Independence
  2. D2: Selectivity
  3. D3: Clean distinction (justification vs falsity)
  4. D4: Usable upshot
  5. D5: Falsifiability
  6. D6: Non-self-effacement
  7. D7: Response to third-factor replies
  8. D8: Propagation rule
  9. D9: Neutrality on metasemantics

  Now add:

  10. D10: Non-undermining of practical reason (new)
  11. D11: Differential treatment (new)

  And then the prejudices:

  12. D12: Moral knowledge possible (camp-prejudice, from user's x)
  13. D13: No reliance on intuitive verdicts (camp-prejudice, from user's xi)

  But the user said "add the ones I've missed", so we are adding D10 and D11 as core.

  Now, for each, we must provide:

  - id: D1, D2, ...
  - name: short name
  - statement: one or two sentences
  - motivating_case: the concrete case or consideration (not slogan)
  - status: non-negotiable, negotiable, or camp-prejudice
  - cost_of_relaxing: what is lost or gained by relaxing it
  - excludes: which candidate arguments it excludes (A, B, C, D? or more generally, types of arguments)

  Then:

  conflicts: pairs or triples that cannot be jointly satisfied.

  most_excluding: the one that rules out the most candidates.

  added_beyond_my_list: we added D10 and D11.

  case_verdict: for the test case (promise-keeping, far-future-people, and propagation rule).

  scorecard: for A, B, C, D.

  Now, let's define each desideratum.

  First, the core:

  D1: Sensitivity/Independence
  Statement: The genealogy must show that our moral beliefs would have been the same even if the moral facts had been different, indicating that the beliefs are insensitive to the truth.
  Motivating case: In the promise-keeping case, if the moral facts about promises had been different (e.g., breaking promises was morally required), we would still believe promise-keeping is obligatory because of selection for reputation.
  Status: Non-negotiable (since it's a core component of many EDAs; without it, the debunking force is weak)
  Cost of relaxing: Without sensitivity, the argument may not show that our beliefs are unjustified, only that they have an evolutionary origin which might be compatible with reliability.
  Excludes: Arguments that do not require sensitivity (e.g., some forms of C which say causal story is inert).

  D2: Selectivity
  Statement: The argument must provide a principled basis for debunking only a subset of beliefs, and explain why other domains (like logic or math) are not similarly debunked.
  Motivating case: We don't want the argument to imply that our logical beliefs are debunked because they too are products of evolution; we need a way to distinguish moral from non-moral domains.
  Status: Non-negotiable (because global skepticism is unacceptable for the purpose)
  Cost of relaxing: If not selective, the argument leads to global skepticism which the agent cannot use for sorting without collapse.
  Excludes: Arguments that are global in scope (e.g., if A is applied without selectivity, it might debunk everything).

  D3: Clean distinction
  Statement: The argument must clearly separate the question of justification (whether we are entitled to hold the belief) from the question of truth (whether the belief is false).
  Motivating case: In the far-future-people case, we might lose justification for the belief but not be forced to conclude it is false; we need to know what follows for our attitude.
  Status: Non-negotiable (for the purpose, because the agent needs to know whether to be agnostic or to reject the belief as false)
  Cost of relaxing: Blurring the distinction may lead to unnecessary error theory or to unjustified retention of beliefs.
  Excludes: Arguments that conflate justification and falsity (e.g., some versions of A that conclude falsity directly).

  D4: Usable upshot
  Statement: The argument must yield practical guidance for the agent on how to adjust her confidence and practical stance toward the debunked beliefs (e.g., lower confidence, jettison, etc.).
  Motivating case: After debunking promise-keeping beliefs, the agent must know whether to stop asserting them, act as if they are true, or what.
  Status: Non-negotiable (central to the purpose)
  Cost of relaxing: Without a usable upshot, the argument leaves the agent in a state of confusion about what to do with her beliefs.
  Excludes: Arguments that only show a problem without guidance (e.g., some versions of A or D that don't specify how to adjust).

  D5: Falsifiability
  Statement: There must be some possible empirical finding (in evolution, etc.) that would count against the debunking argument, making it testable.
  Motivating case: If we found that moral beliefs about future people were actually shaped by selective pressures (e.g., via cultural evolution for long-term planning), then the debunking argument against them would be undermined.
  Status: Negotiable (because a conceptual argument might still be useful, but testability is desirable for engagement with science)
  Cost of relaxing: Without falsifiability, the argument may be untestable dogma, but relaxing it might allow for philosophical arguments that don't depend on empirical details.
  Excludes: Arguments that are purely conceptual and immune to empirical evidence (some versions of C?).

  D6: Non-self-effacement
  Statement: The argument must not rely on a premise (e.g., about the causal inefficacy of normative facts) that also undermines the epistemic norms used in the debunking argument itself.
  Motivating case: If the debunker uses epistemic norms (e.g., that sensitivity defeats justification) but argues that normative facts are causally inert, then if epistemic norms are normative, they might be causally inert too, which undercuts the debunking.
  Status: Non-negotiable (to avoid self-defeat)
  Cost of relaxing: Allowing self-effacement would make the argument self-undermining and thus useless.
  Excludes: Arguments that assume normative facts are causally inert without accounting for epistemic norms (e.g., some versions of A).

  D7: Response to third-factor
  Statement: The argument must address replies that posit a third factor (e.g., natural facts that explain both the selective forces and the moral facts, making the correlation reliable).
  Motivating case: In the promise-keeping case, one might argue that selection favored true beliefs because reciprocity is both fitness-enhancing and morally good, so the belief is justified.
  Status: Non-negotiable (because third-factor replies are a major challenge)
  Cost of relaxing: Without a response, the debunking argument might be easily defeated by third-factor explanations.
  Excludes: Arguments that ignore third-factor replies (e.g., naive A).

  D8: Propagation rule
  Statement: The argument must provide a rule for how debunking propagates through inference, i.e., whether beliefs derived from debunked premises are also debunked.
  Motivating case: In the far-future-people case, if judgments about future people are derived from debunked reciprocity norms, are they debunked too? We need a rule.
  Status: Non-negotiable (for the test case and for sorting beliefs that are interconnected)
  Cost of relaxing: Without a propagation rule, the agent won't know how to treat derived beliefs.
  Excludes: Arguments that don't consider inferential connections (e.g., A without a propagation rule).

  D9: Neutrality on metasemantics
  Statement: The argument must not presuppose a particular theory of moral semantics (e.g., naturalism vs non-naturalism) to be effective.
  Motivating case: If the debunking argument only works if moral terms refer to non-natural properties, but the agent is a naturalist, then it might not apply.
  Status: Negotiable (it might be too strong; some arguments might require metasemantic commitments)
  Cost of relaxing: Without neutrality, the argument might only work for certain metaethical views, limiting its applicability.
  Excludes: Arguments that rely on specific metasemantics (e.g., some versions of B might require naturalism).

  Now added:

  D10: Non-undermining of practical reason
  Statement: The argument must not undermine the agent's ability to engage in practical deliberation and action, avoiding collapse into quietism or paralysis.
  Motivating case: After debunking, the agent must still be able to make decisions and act; for example, she might need to retain debunked beliefs in a practical attitude.
  Status: Non-negotiable (to serve the purpose of guiding action without collapse)
  Cost of relaxing: If practical reason is undermined, the agent cannot use the argument to sort her convictions in a way that guides life.
  Excludes: Arguments that lead to total suspension of moral judgment (radical versions of A or D).

  D11: Differential treatment
  Statement: The argument must allow for varying degrees of debunking across different moral beliefs, providing a basis for comparing and sorting them.
  Motivating case: In the two cases, promise-keeping might be highly debunked, while future-people judgments might be less so (or vice versa), so the agent needs to adjust confidence differentially.
  Status: Non-negotiable (for the sorting purpose)
  Cost of relaxing: Without differential treatment, the agent cannot prioritize which beliefs to keep, lower confidence in, or jettison.
  Excludes: Arguments that treat all moral beliefs as uniformly debunked (e.g., global A).

  Now the prejudices (we list them for completeness, but status camp-prejudice):

  D12: Moral knowledge possible
  Statement: The argument must leave open the possibility that some moral beliefs can be known, even after debunking.
  Motivating case: To avoid total moral skepticism, which might be demotivating or practically unworkable.
  Status: Camp-prejudice (some debunkers might accept total skepticism)
  Cost of relaxing: If we require it, we might rule out strong debunking arguments; if not, we allow for more radical conclusions.
  Excludes: Arguments that conclude no moral knowledge is possible (e.g., strong versions of A).

  D13: No reliance on intuitive verdicts
  Statement: The argument must not rely on intuitive judgments about specific moral cases to establish its force.
  Motivating case: To avoid circularity, since moral intuitions might be the very thing being debunked.
  Status: Camp-prejudice (some arguments might legitimately use intuitions as starting points)
  Cost of relaxing: If we allow intuitive verdicts, we might preserve some beliefs, but risk bias; if not, the argument might be more objective.
  Excludes: Arguments that build in intuitions (e.g., some responses to selectivity that rely on intuitions about math being reliable).

