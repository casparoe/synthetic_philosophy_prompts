answer: |-
  Below is a systematic translation of the combination problem's components into your specified physics vocabulary, followed by a residue analysis and stress-testing of your three focal concerns. The translation adheres strictly to your framework’s commitments: coarse-graining as information-reducing maps (not part-whole relations), dynamics/structure as primitive, and levels as pragmatically chosen.  

  ---

  ### **Translation of Combination Problem Components**  
  *(Key: CG = coarse-graining; RG = renormalization group; EDs = effective degrees of freedom)*  

  1. **Subject-Summing Problem**  
     *Philosophical claim:* How do micro-subjects combine into a macro-subject?  
     *Translation:* Under what RG flow or CG map do micro-level *dynamical variables* (putative "micro-subjects") yield a *single emergent ED* (macro-subject) at a coarse-grained level with dynamical closure?  
     - *Framework constraint:* CG maps reduce dimensionality; they don’t "sum" entities. Subjects lack dynamical operators.  

  2. **Quality-Combination Problem**  
     *Philosophical claim:* How do micro-phenomenal qualities (e.g., proto-colors) blend into macro-qualities (e.g., unified color experience)?  
     *Translation:* Can a CG map transform a *high-dimensional manifold of micro-states* (proto-qualities) into a *low-dimensional macro-state space* where emergent EDs (macro-qualities) exhibit new symmetry properties?  
     - *Framework constraint:* Qualities are not structural/dynamical properties. CG typically *erodes* detail (e.g., RG washes out irrelevant operators).  

  3. **Grain Problem**  
     *Philosophical claim:* Macro-experiences (e.g., smooth visual fields) seem structurally incompatible with discrete micro-experiences.  
     *Translation:* How can a CG map reconcile *discrete micro-dynamics* (e.g., oscillator phases) with *continuous macro-EDs* (e.g., order parameters) without violating dynamical closure?  
     - *Clean translation:* Matches scale-relativity in RG flow. Grain is resolved pragmatically via scale separation.  

  4. **Structural-Mismatch Worry**  
     *Philosophical claim:* Neural correlates of consciousness (structured, high-level) don’t resemble micro-experiential properties.  
     *Translation:* Why do RG fixed points at the *neural correlation scale* exhibit EDs (consciousness) structurally orthogonal to the EDs at *micro-constituent scales*?  
     - *Distortion:* Assumes "structural resemblance" is required. Physics only demands consistency of dynamics across scales.  

  5. **Decomposition Argument**  
     *Philosophical claim:* Unified consciousness implies composite micro-subjects.  
     *Translation:* If a macro-state (unified consciousness) is *dynamically closed*, does RG flow backward imply *micro-level EDs* with subject-like properties?  
     - *Framework constraint:* RG reversal is unstable; EDs are scale-dependent.  

  ---

  ### **Residue Report**  
  *(Classification based on translatability)*  

  | **Clean Translation**                                                                 | **Distorted Translation**                                                                                                | **No Expression**                                                                                      |
  |---------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|
  | **Grain problem** (scale relativity of RG; closure fixes grain)                       | **Structural mismatch** (distortion: assumes "resemblance" between levels; physics requires only dynamical consistency). | **Subject-summing** (no operator for "summing" subjects; CG reduces, doesn’t combine).                 |
  | **Decomposition argument** (RG reversal instability; EDs not preserved downward).     | **Quality-combination** (distortion: treats qualities as state-space variables; but phenomenology has no dynamics).       | **Intrinsic properties** (all physics properties are structural/dispositional; no slot for intrinsics). |
  | **Dynamical closure** (autonomy of levels as pragmatic choice).                       |                                                                                                                          | **Subjects** (no state-space representation for subjective "perspective").                             |

  ---

  ### **Stress-Testing Your Three Concerns**  
  1. **Direction-of-Detail Dilemma**  
     - *Real?* Yes. Coarse-graining is entropy-increasing: macro-states are *lossy projections* (e.g., thermodynamic variables). Phenomenal richness contradicts this entropy gradient.  
     - *Panpsychist Horn:* Most take the first horn (macro-richness as emergent EDs), forfeiting non-emergentism. Some (e.g., Goff) invoke "fusion" as a primitive, but this has no CG correlate.  
     - *Framework Verdict:* Genuine problem. Either panpsychism collapses into strong emergence, or it demands a CG map that *preserves* phenomenal information (incoherent with RG).  

  2. **Maximal Dynamical Closure as Consciousness Criterion**  
     - *Collapse Risks:*  
       - **Observer-Relativity:** Closure is pragmatic (e.g., fluid dynamics vs. molecular). Consciousness would depend on descriptive goals.  
       - **Integrated Information (IIT):** Maximizing closure ≈ maximizing autonomy, similar to IIT’s Φ. But IIT is scale-bound; RG has no privileged scale.  
     - *Verdict:* Viable only if consciousness is *defined* by observational pragmatism (e.g., "a subject exists where dynamics are closed for an observer"). Unpalatable but consistent.  

  3. **Decoherence Analogy for Subject-Summing**  
     - *Available?* Yes: Micro-subjects never fuse; macro-subjects are decohered branches isolated by dynamical constraints (e.g., neural feedback loops).  
     - *Solves Summing?* No—it restates it. Explains *inaccessibility* but not why a *single subject* exists per branch. Branching is already a structural relation; subjects add no dynamics.  
     - *Verdict:* Avoids fusion but leaves the "subject" primitive unexplained.  

  ---

  ### **Residue Diagnosis & Positive Solutions**  
  #### **Why Untranslatable Elements Fail**  
  - **Your Framework’s Gaps:**  
    1. *No non-structural properties:* Physics vocabulary lacks "intrinsic" qualia (e.g., "redness" as non-dynamical).  
    2. *No subject ontology:* "Subjects" aren’t state-space variables or operators; they’re undefined in dynamical terms.  
    3. *Composition ≠ CG:* Coarse-graining is a many-to-one *map*, not mereological composition.  

  - **Philosophical Claims Doing Less Work:**  
    - "Combination" implies a part-whole relation *beyond dynamics*, but no such relation is empirically or mathematically necessitated.  
    - "Micro-subjects" are idle posits: They do no work in RG flows or closure conditions.  

  #### **What a Solution Would Require in Your Terms**  
  A "composition rule" would need to be:  
  - A **non-lossy CG map** (preserving information content upward), violating the 2nd law of thermodynamics.  
  - Or a **new fundamental operator** in the dynamics (e.g., a "subject-sum" term in the Hamiltonian), which would be empirically vacuous.  
  - Neither is feasible. Panpsychism’s "composition" is likely **neither a map nor mereology**—it’s a primitive relation incompatible with physics-style reduction.  

  #### **Conclusion**  
  The residue is **entirely on the panpsychist side**. Your framework lacks resources for intrinsics/subjects, but the combination problem’s *formulation* relies on these as unexplained primitives. To state the problem in physics terms, you’d need:  
  1. A non-dynamical property slot (e.g., intrinsic fields).  
  2. A subject variable in state spaces (e.g., a "perspective operator").  
  3. A mereological axiom for CG maps (violating their information-reducing role).  

  Without these, the combination problem reduces to: *"How do EDs at a closed level *seem* intrinsically rich?"*—which is either an illusion or strong emergence. Panpsychism gains no ground over these alternatives.  

  **Recommendation:** Your maximal closure criterion is the most defensible path, but it concedes observer-relativity. The decoherence analogy dissolves fusion but not subjectivity. Panpsychism’s combination problem remains ill-posed in dynamical terms.
