answer: |-
  Here is the specification of desiderata for an account of Maxwell's demon failure, structured as requested. The requirements are anchored to your cases and designed to support quantitative analysis of real finite quantum devices. Confidence annotations are provided where claims are contested or extrapolated.

  ### Numbered Requirements & Motivating Cases
  1.  **Finite Implementation Cost:** *The account must quantify the thermodynamic cost of implementing the feedback protocol itself (measurement, computation, memory access), not just memory erasure.*  
      **Case:** Endless-tape demon (reversible automaton). If memory is never erased or deferred, an account charging *only* erasure costs fails. The cost of physically moving/processing the tape during operation must be captured.

  2.  **Quantitative Fidelity Dependence:** *The account must provide work bounds parametrized by the quality (fidelity, mutual information) of the demon's information about the system, not just perfect/imperfect dichotomy.*  
      **Case:** Noisy monitor. Degraded records before action mean work extraction depends continuously on measurement quality. A binary "possesses information/does not" account is insufficient.

  3.  **Pre-existing Correlation Accounting:** *The account must handle correlations present in the initial joint state of system and demon without requiring a distinct "measurement" event.*  
      **Case:** Inherited-correlation engine. No measurement step occurs; failure cannot be blamed on the cost of an act that didn't happen. The account must explain why exploiting pre-existing correlations isn't free.

  4.  **Thermal Memory Registration:** *The account must apply when the demon's memory registers start in thermal equilibrium with the bath.*  
      **Case:** Thermal demon. Initial memory states are random thermal noise. An account requiring memory to start in a standard "blank" state fails. Costs must include initializing or leveraging noisy memory.

  5.  **Single-Shot Validity:** *The account must provide probabilistic or single-shot bounds, not just asymptotic averages over infinite cycles.*  
      **Case:** Single-shot run. For one molecule/one cycle, net work extraction might succeed with low probability. The account must explain failure "with high probability" or bound the probability of success, not just guarantee failure on average.

  6.  **Non-Commuting Observables Handling:** *The account must handle quantum systems where measurement observables don't commute with control Hamiltonians, and states are non-orthogonal.*  
      **Case:** Quantum monitor. Continuous weak measurement disturbs conjugate variables. Control based on imperfect records of non-commuting observables introduces unavoidable disturbance affecting work extraction.

  7.  **Non-Circular Derivation:** *The account must derive the net work bound without assuming the Second Law, ergodicity, or perfect equilibration as premises. It must clarify the status (premise or derived) of any erasure principle and provide independent justification if a premise.*  
      **Case:** All cases, foundational. Using the Second Law to "explain" the demon's failure is circular. An erasure principle (e.g., Landauer) must be derived from underlying dynamics or its status as a postulate justified independently (e.g., via fluctuation theorems).

  8.  **Maximum Work Bound:** *The account must yield the *maximum* net work extractable (or minimum cost) for a given information quality, memory size, and protocol, not just a bound confirming net work ≤0.*  
      **Case:** Device design. To underwrite quantitative claims for real devices, knowing the *best possible* performance under given constraints (error rate, memory) is essential, not just that net extraction is impossible.

  9.  **Information-Relationality:** *The account must treat "information" as a relational property (between demon state and system state), not an intrinsic property of the demon's records alone.*  
      **Case:** Inherited-correlation & Thermal demon. Records only have thermodynamic significance via their correlation with the system. Random bits (thermal demon) or bits correlated with the wrong system are useless.

  10. **Cost Separation (Logical vs. Thermodynamic):** *The account must distinguish logical irreversibility from thermodynamic irreversibility and separate the costs of acquisition, storage, processing, and erasure of information.*  
      **Case:** Endless-tape & Device benchmarking. Reversible computation (logically reversible) can still have thermodynamic costs. Designing efficient controllers requires knowing where costs arise.

  ---

  ### Requirement Classification

  | Requirement | Non-Negotiable (Your Purpose) | Preference/Camp-Specific |
  |-------------|------------------------------|--------------------------|
  | 1. Finite Implementation Cost | ✅ | |
  | 2. Quantitative Fidelity Dep. | ✅ | |
  | 3. Pre-existing Corr. Accounting | ✅ | |
  | 4. Thermal Memory Registration | ✅ | |
  | 5. Single-Shot Validity | ✅ | |
  | 6. Non-Commuting Observables | ✅ | |
  | 7. Non-Circular Derivation | ✅ | |
  | 8. Maximum Work Bound | ✅ | |
  | 9. Information-Relationality | | ✅ (Key for mutual-info/trajectory camps) |
  | 10. Cost Separation | | ✅ (Key for erasure-camp critics) |

  ---

  ### Conflict Analysis & Key Excluder

  *   **Conflict:** The primary tension is indeed between **Non-Circular Derivation (7)** and **Finite Implementation Cost (1)** for the **endless-tape demon**.
      *   *Argument:* Satisfying (7) typically requires deriving Landauer's principle (or equivalent) from microscopic reversibility/fluctuation theorems. These treat the *entire* system+demon+tape as a closed Hamiltonian system. For *finite* memory, the cost of irreversible operations (like resetting bits *eventually*) emerges naturally. However, for an *infinite, never-erased* tape (1), the system is unbounded. Fluctuation theorems become subtle in infinite systems (contested: confidence ~medium). While trajectory-level analyses suggest thermodynamic reversibility requires perfect correlation preservation forever (costing infinite memory "rent"), deriving a *finite* per-cycle implementation cost without presupposing dissipation in computation/access remains challenging without effectively assuming a finite effective resource (violating strict endlessness). An account truly deriving *all* costs dynamically for an infinite system risks becoming intractable or needing implicit asymptotic assumptions (weakly violating 7 or 1). *(Your guess is largely correct; full satisfaction is at the frontier.)*

  *   **Most Excluding Requirement:** **Non-Circular Derivation (7)** does the most work in excluding candidate accounts.
      *   *Reason:* Many influential accounts (especially erasure-based explanations and some "no-go theorem" arguments) explicitly or implicitly rely on a pre-assumed Second Law or an unjustified Landauer principle. (7) forces a derivation from dynamics, immediately disqualifying these. It also challenges mutual-information approaches if they start from a generalized second law identity without derivation. Only trajectory/fluctuation-relation approaches inherently satisfy (7) by construction.

  ---

  ### Scorecard of Families vs. Non-Negotiables

  | Family                            | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | Verdict (Non-Neg Only) |
  | :-------------------------------- |:-:|:-:|:-:|:-:|:-:|:-:|:-:|:-:| :--------------------- |
  | **Erasure-Based** (Landauer)      | ❌ | △ | ❌ | ❌ | ❌ | ❌ | ❌ | ❌ | Fails (1,3,4,5,6,7 core) |
  | **No-Go/Circularity Critique**    | △ | △ | ❌ | ❌ | △ | ❌ | ❌ | ❌ | Fails (3,4,6,7 core; weak on 1,2,5,8) |
  | **Mutual Information Feedback**   | △ | ✅ | ❌ | △ | △ | △ | ❌ | ✅ | Fails (3,7 core; weak on 1,4,5,6) |
  | **Trajectory/Fluctuation Relations** | ✅ | ✅ | ✅ | ✅ | ✅ | △ | ✅ | △ | **Best Fit** (Weakest on 8 Max Bound; 6 Quantum contested) |

  **Key:** ✅ = Generally satisfies | △ = Partially/Contestedly satisfies | ❌ = Generally violates  
  *Confidence Notes:*
  *   **Settled:** The *validity* of trajectory-level fluctuation relations (FR) and integral/detailed fluctuation theorems (IFT/DFT) under feedback for classical systems is well-established. The generalized second law with mutual information (⟨W⟩ ≥ -kTI(S;D)) is widely accepted *as an identity* derivable from FR/DFT.
  *   **Contested:** 
      *   **Quantum Monitors (6):** Continuous weak measurement and quantum feedback control are active areas. While quantum FR exist, applying them quantitatively to noisy non-commuting cases is complex and not fully standardized. (Confidence: Medium-Low).
      *   **Maximum Work Bound (8):** FR often give averages or bounds, but deriving the *tight* maximum extractable work for specific protocols from first principles is harder than confirming net failure. Bounds often rely on knowing channel capacities or mutual info, not necessarily the demon-optimal protocol.
      *   **Endless-Tape (1) & Non-Circularity (7):** Whether FR rigorously derive *all* implementation costs for infinite reversible systems without hidden assumptions is debated (Confidence: Medium).
      *   **Single-Shot (5):** Single-shot FR/DFT exist but can be less intuitive and harder to connect directly to information metrics than averages. (Confidence: Medium-High for existence, Medium for ease of application).
      *   **Pre-existing Correlation (3):** While FR handle joint initial states, *explaining* why pre-existing correlation doesn't allow net work (without measurement cost) purely information-theoretically remains conceptually tricky for some; FR show it dynamically.

  **Conclusion:** For your purpose of quantitative analysis of real finite quantum devices, the **trajectory/fluctuation relation framework** comes closest to meeting all non-negotiable requirements. Its main limitations for your needs are: 1) Providing the *maximum* work bound (8) often requires additional optimization beyond the core FR identity, and 2) Full rigor and consensus for complex quantum cases (6) are still developing. Non-circularity (7) is its core strength, directly addressing the explanatory gap you identified.
