prompt: |-
  Not sure this is the right venue but here goes — I keep noticing the same shape of thing and I'd like to know whether it has a name, or whether I'm just describing three different things as one.

  The shape, as best I can spell it out. Two or more parties are in some competitive situation. Each of them takes a step that costs them something and removes their own future ability to back out: they sign a contract they can't cancel, pre-buy something they can't resell, announce a date in public, hand the decision to somebody else who won't give it back. Crucially nothing about their actual capability improves. The only thing that changes is what the *other* side now believes. And the value of doing it seems to depend almost entirely on doing it first — the one who locks in first gets whatever there is to get (the reputation, the scare, the funding, the credit), and the second one gets nothing, or just ends up stuck. So it isn't a race to build a better thing. It's a race to be the one who got locked in first.

  The bit I find hardest to describe is where the credibility comes from. You can't just tell the other side you can't back out; nobody would believe you. What seems to actually happen is that each side goes and recruits some third party who would punish them for reversing — shareholders, voters, a regulator, a journalist who now has the story — and then the escalation takes the form of shopping around for a harsher audience, because whoever has the nastier audience wins. Everyone involved says privately they'd sign a binding agreement tomorrow, but any pause to sit down and negotiate is exactly the moment the other side can lock in.

  Things I already know about and think this isn't: the burning-your-boats idea from game theory (that's one side doing it once, to make a threat stick, and the point is the threat — here there's often no threat at all, and it's the ordering that matters); the thing where you tie yourself up because your future self will be weak-willed (I don't change my mind; I would reverse this afternoon if I could get away with it); the two-drivers-swerving setup (there you want to *look* committed while keeping the option to swerve — here you have to actually destroy it); and the auction where everyone bids and everyone pays (there's a prize in that one, and the money goes to somebody). I've also come across the phrase 'commitment race' muttered at me at a conference, but I've never managed to find it used for anything, and it implies a finish line, which mine doesn't have.

  So: is there an established concept here, and if the nearest ones only half fit, tell me exactly how mine differs from each and which comes closest. If nothing fits, coin something and define it tightly enough that I can tell a real case from a near miss. And give me a diagnostic — what would I have to observe in the wild to conclude this is what's happening rather than an ordinary capability race or plain positional one-upmanship, and what observation would make me say no, it's just one of the things I listed above? I don't want a label on its own; I want the carving.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a pattern where parties in a competitive situation take irreversible steps to lock themselves in, not to improve their capabilities, but to signal commitment to others. The key points are: the action is costly and irreversible, it doesn't enhance actual ability, credibility comes from third-party enforcement, and being first matters significantly. They mention examples like signing contracts or public announcements.

  First, I need to determine if there's an existing concept that matches this. The user already ruled out several ideas like burning bridges, Ulysses pacts, chicken games, and all-pay auctions. They mentioned "commitment race" but found it vague. My task is to either find a fitting term or create a new one, and provide clear diagnostics.

  Looking into game theory, preemption games come to mind. These involve races where the first mover gains an advantage. But preemption usually focuses on timing rather than the irreversible commitment aspect. The user's scenario emphasizes the creation of credible commitments through third parties, which isn't always central in preemption models. So while related, it's not a perfect fit.

  Another angle is costly signaling. Here, actions are expensive to fake, thus credible. However, costly signaling doesn't necessarily require being first or involve third-party enforcers. The race element is missing. Costly signaling is more about demonstrating quality rather than locking in position quickly.

  The user describes a mechanism where credibility comes from recruiting third parties who impose penalties for backing out. This resembles audience costs in international relations. Leaders face domestic backlash if they back down. But audience costs are typically about democracies making threats credible, not a race between competitors to lock in first. The competitive race aspect isn't covered there.

  Considering escalation through harsher audiences, like seeking stricter regulators or more influential journalists, this seems like an arms race in commitment devices. But I haven't found a term that combines the irreversible action, third-party enforcement, and the first-mover advantage crucial here.

  Schelling's work on commitment mentions using irreversible steps to bind oneself. The user’s case adds competition and racing elements. Schelling's concepts are foundational but don't fully capture the dynamic where multiple parties race to commit first, leveraging third parties for credibility.

  The term "commitment race" was mentioned to the user but they found it undefined. In my knowledge, it's not a standard term. However, it might be apt here. Defining it as a race where parties irreversibly commit to gain advantage, with first-mover benefits and third-party enforcement, could fit. But I need to ensure it's distinct from preemption games or costly signaling.

  Diagnostics are crucial. To confirm this phenomenon, look for: irreversible actions that don't improve capability, reliance on third-party enforcers for credibility, first-mover advantage where the second gets little, and evidence of parties seeking harsher enforcers. If actions improve capability or if timing doesn't matter, it's something else. If there's no third party imposing costs, it might be a simple preemption or signaling model.

  The user’s deeper need might be to formalize an observed pattern for academic or professional use. They want precise criteria to identify and analyze such scenarios, possibly to predict behaviors or design strategies. Creating a tightly defined concept helps in categorizing real-world cases accurately, avoiding conflation with similar but distinct mechanisms.
answer: |-
  Based on your exceptionally clear description, you have identified a distinct and fascinating strategic phenomenon. While it touches upon several established concepts, it uniquely combines elements into a pattern that lacks a single, universally recognized name. The closest *established* concept is **Preemption Games**, but it doesn't fully capture the *mechanism* of commitment you describe. The most *apt descriptive term* would be a **Commitment Race**, but this needs rigorous definition, as it's not a standard term of art.

  Here's the breakdown and carving:

  1.  **The Established Concept That Comes Closest (But Doesn't Fit Perfectly): Preemption Games**
      *   **What it is:** A class of games (e.g., patent races, market entry) where the primary advantage comes from being the *first* to act or secure a position. The winner often takes all or gains a significant, lasting advantage.
      *   **Where it fits:** Your core insight about the critical importance of being *first* ("the one who locks in first gets whatever there is to get") is the essence of a preemption game. The prize is often positional or reputational.
      *   **Where it differs:** Standard preemption models often implicitly or explicitly involve *building capability* (e.g., R&D in a patent race). Your phenomenon specifically *excludes* capability enhancement ("nothing about their actual capability improves"). Preemption models also don't inherently focus on the *mechanism* of credible commitment via irreversible action and third-party enforcement. They often assume the first-mover advantage exists without modeling *how* the commitment becomes credible.

  2.  **Related Concepts & How Your Phenomenon Differs:**
      *   **Costly Signaling:** Signaling involves actions that are costly to fake, demonstrating resolve or type. Your phenomenon *uses* costly signaling (the irreversible action is costly) but adds the critical elements of **irrevocability, third-party enforcement for credibility, and the preemptive race dynamic**. Signaling doesn't require being first or locking out others in the same way.
      *   **Audience Costs (IR Theory):** This is VERY close to your credibility mechanism. Leaders face costs (from voters, allies, journalists) if they back down from public commitments/threats. **Where it fits:** Explains *how* public announcements/third-party recruitment create credibility ("shopping around for a harsher audience"). **Where it differs:** Audience costs are typically analyzed in the context of *deterrence or coercion* (making threats credible), often between two parties (e.g., states in crisis). Your phenomenon often lacks an explicit threat ("there's often no threat at all") and crucially involves a *competitive race between multiple parties* to lock in first for positional advantage, not just making a threat credible to an adversary.
      *   **Schelling's Commitment / Burning Bridges:** You correctly distinguish this. Schellingian commitment is about *strategically reducing your own options* to make a *threat or promise* credible *to an adversary*. **Your phenomenon:** The commitment isn't primarily a *signal to the direct competitor* about resolve in a conflict (though it might have that effect). It's a *preemptive grab for an external prize* (reputation, funding, credit, scare) achieved by being the *first* to irreversibly demonstrate commitment *to a wider audience*, thereby locking others out. The focus is on the *race* and the *prize*, not the bilateral threat dynamic. The "burning" isn't just for oneself; it's done *in front of the punishing audience*.
      *   **All-Pay Auctions:** You correctly note the difference: in all-pay, everyone pays but only one wins; the prize is clear, and bids are the costs. **Your phenomenon:** Only the *first* to successfully lock in "wins"; subsequent attempts are futile or costly without gain. The "cost" is the irreversible action and the binding constraint, not a direct bid for a predefined prize pool. The prize is often less tangible (reputation, position).
      *   **Positional Arms Race / One-Upmanship:** These often involve escalating *capabilities* (bigger missiles, fancier features) or conspicuous consumption. **Your phenomenon:** Escalation is in the *severity of the commitment mechanism* ("shopping around for a harsher audience") and the *irreversibility of the lock-in*, not capability. The goal is preemptive lock-in, not incremental superiority.

  3.  **Defining the "Commitment Race" (A New Term for This Specific Phenomenon):**
      *   **Definition:** A **Commitment Race** is a competitive dynamic between two or more parties where:
          1.  **The Prize:** A positional, reputational, or first-mover advantage (e.g., market leadership, credit for an idea, perceived resolve, exclusive funding) that is largely indivisible and favors the first claimant.
          2.  **The Mechanism:** Securing the prize requires performing an **irreversible, costly action** that **credibly binds the actor** and **precludes retreat** from the claimed position.
          3.  **Credibility Source:** Credibility stems not merely from the action itself, but from **recruiting external enforcers** (third parties like shareholders, regulators, media, creditors, voters) who will impose significant penalties (reputational, financial, political) if the commitment is reversed.
          4.  **The Race:**
              *   The **first** party to successfully execute this binding commitment captures the prize.
              *   Subsequent attempts by competitors are either futile (the prize is gone) or result in pure cost without equivalent gain (they are "stuck").
              *   The competitive pressure drives parties to seek **increasingly harsh enforcers** and **more irreversible actions** to outpace rivals and solidify their claim.
          5.  **No Capability Enhancement:** The primary action does not materially improve the party's underlying ability to deliver on the commitment or achieve the goal; its value lies *entirely* in the credible preemption and lock-in.

  4.  **Diagnostics: How to Identify a Commitment Race in the Wild:**
      *   **Look for these POSITIVE Indicators:**
          *   **Costly Irreversibility:** Parties are taking concrete actions that are expensive to reverse or legally/factually binding (e.g., non-refundable pre-purchase, irrevocable public announcement with a hard date, signing binding contracts with penalty clauses, handing unilateral authority to a third party).
          *   **Third-Party Punishers:** Explicit involvement of external entities (regulators, media, investors, courts, vocal stakeholder groups) whose role is to monitor and punish backtracking. Evidence that parties are actively courting *specific* audiences known for being harsh or unforgiving.
          *   **First-Mover Obsession:** Obsessive focus on being "first to market," "first to commit," "first to announce." Public statements emphasizing primacy. Competitors abandoning similar plans *after* one party commits, citing "the space is taken" or "we missed the window," *not* capability deficits.
          *   **Escalation in Binding:** Competitors not just matching, but seeking *more* binding mechanisms or *harsher* enforcers than the first mover (e.g., Party A announces to press; Party B announces to press *and* files a binding regulatory notice).
          *   **Private Willingness vs. Public Posturing:** Evidence (leaks, later memoirs) that parties privately wanted a negotiated solution but felt compelled to lock in first for fear of being preempted.
          *   **Wasted Effort:** Competitors incurring significant costs *after* the first lock-in, achieving nothing but sunk costs or binding constraints.
      *   **Look for these NEGATIVE Indicators (ruling it out):**
          *   **Capability Focus:** Observed actions primarily involve R&D, building infrastructure, hiring talent, or other activities demonstrably improving the party's ability to execute. The winner wins because they *built a better/delivered faster product/service*.
          *   **Bilateral Threat/Coercion:** The commitment is clearly aimed at intimidating or coercing a *specific adversary* in a direct conflict (Schelling/burning bridges). The prize is compliance from that adversary.
          *   **Self-Binding for Future Weakness:** The mechanism is explicitly designed to prevent the *actor's own future self* from changing its mind due to weakness of will or changing incentives (Ulysses pact).
          *   **Mutual Escalation to Brink:** Parties are engaged in a contest of escalating *actions* (like swerving closer in Chicken) but retain the *option* to de-escalate until the last moment. The focus is on *appearing* committed while preserving an escape hatch.
          *   **All-Pay Structure:** Multiple parties pay significant costs (e.g., entry fees, R&D), only one wins a well-defined prize, and the costs are paid *by all* regardless of winning (standard all-pay auction). In your race, usually only the *first* pays the *binding cost* effectively to win; others might pay *attempt* costs but gain nothing.
          *   **Capability Arms Race:** Observed escalation is in tangible resources, technology, or scale, not in the *irreversibility* of commitments or *harshness* of enforcers.

  **In essence:** You've identified a **Preemption Game** where the winning move is **not** building capability faster, but **performing the most credible, irreversible, and earliest act of self-binding commitment, enforced by third-party punishers, to capture a positional prize.** The term **Commitment Race** accurately captures the unique combination of preemption, costly irreversible action, reliance on external credibility enforcement, and the winner-takes-most dynamic driven by primacy.

  **Examples fitting your description:**
  *   **Tech "Vaporware" Wars:** Company A announces Product X with a hard ship date to preempt competitors, locking in developer interest and pre-orders. They recruit media and analysts as enforcers (reputational ruin if they miss). Company B, planning a similar product, cancels or rushes a half-baked version because "A owns the narrative now." A's announcement didn't make X better, just locked in the mindshare first.
  *   **Political Primaries:** Candidate X publicly pledges "No new taxes" at a major rally, locking in a key voting bloc and media narrative. Candidate Y, who privately held the same position, now cannot gain credit for it and risks looking like a follower or flip-flopper if they announce it later. The media and key interest groups become the enforcers.
  *   **Regulatory Land Grab:** Firm A files a highly specific, binding regulatory application for a new service, setting a precedent and timeline. Regulators become the enforcers. Firm B, developing a similar service, must now either challenge A's application (costly, uncertain) or significantly alter their own plan, missing the first-mover advantage. A's filing didn't improve their tech, just locked in the regulatory position.
  *   **Funding Rounds:** Startup A secures a term sheet from a notoriously demanding VC firm known for harsh penalties if milestones are missed. This signals extreme commitment and scares off other startups from approaching the same limited pool of top-tier VCs for similar ideas. The VC firm is the enforcer. A didn't build a better product by signing, they just locked in the funding slot first.

  You've described a powerful and under-discussed strategic dynamic. Defining it as a **Commitment Race** with the diagnostics above provides the carving you need.
