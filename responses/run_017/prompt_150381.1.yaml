  2. **Decision Theories**:
     - CDT: Translates to choosing actions based on their causal effect on the world. In our setup, since the agents are air-gapped, any action by A has no causal effect on B. So CDT would not cooperate.
     - EDT: A would consider: if I cooperate, what does that evidence say about B? But since they are air-gapped, there is no evidence. So EDT might not cooperate.
     - FDT: A would consider: what does my decision algorithm output in this situation? And since B is running the same algorithm (approximately), it will output the same? But note: they have different objectives. So FDT would have to consider the other agent's objective. The key is that the agent's algorithm is fixed and known, and the other agent can simulate it.

     Translation: FDT is similar to a protocol that is defined by a function (the decision function) that is run by both agents. The protocol specifies actions based on the input (which includes the simulation of the other). The fact that the agents are similar (same source) allows them to predict each other's function.

     Residue: The idea of "logical correlation" (correlation due to the logical relationship between the agents' algorithms) is not typically in distributed systems. We have no name for this because without communication, we don't assume correlation. This is a real gap: logical correlation is a resource.

  3. **Updatelessness**: This translates directly to a protocol (a pre-specified policy). The place where the gloss breaks: in the acausal trade setup, the policy must account for the possibility that the agent is in a simulation. In distributed systems, a replica knows it is a replica (has a node id). But in acausal trade, the agent does not know whether it is the real one or a simulation. This is a key difference.

     We would have to extend our protocols to handle agents that are uncertain about whether they are the real node or a simulation. This is similar to the "am I in a sandbox?" checks, but in this case, the agent does not check? The updateless agent does not condition on being real or simulated; it chooses a policy that maximizes utility across all possibilities.

     Residue: The concept of "being in a simulation" as a state that the agent must consider in its policy. This is not in standard distributed systems, though digital twins are used for testing. However, the twin knows it is a twin. The gap is that in acausal trade, the agent does not know and must consider both possibilities.

  4. **Mutual Simulation Regress**: This is modeled as a fixed point, but with bounded depth. We can express this as a recursive simulation that bottoms out after k steps (the bound). The fixed point is then approximated by the k-th level simulation. We can write:

     Let `f_A` and `f_B` be the decision functions of A and B.

     Then:
     ```
     a = f_A( S_A(B, k) )
     b = f_B( S_B(A, k) )
     ```

     where `S_A(B, k)` is a simulation of B that uses `S_B(A, k-1)` and so on until k=0, where we use a default.

     This recursive computation is well-defined and does not require a mathematical fixed point because it is finite.

     However, the accuracy degrades with depth. Also, the simulation at depth k is only 80% accurate relative to the true `f_B`? Actually, the 80% accuracy is for one step? We must clarify.

     We assume that each simulation step has 80% accuracy (meaning that the simulation of the other agent at depth 1 is 80% accurate). Then the simulation at depth 2 is 80% of 80%? So 64%? And so on.

     This degradation might make the simulation at high depths useless.

     Translation: This is a recursive simulation that we can express in our vocabulary. The fixed point is not a true fixed point but a bounded recursion.

  5. **Löb's Theorem**: This is a different trick. It is about self-referential proof. In our setup, we are using simulation, not proof. So it's a different mechanism. However, in some formulations of acausal trade, proof-based agents are used. But in this concrete setup, we have simulators, not theorem provers.

     Residue: The proof-based approach requires a high level of logical omniscience and the ability to reason about one's own code. This is not typically in distributed systems, but we do have formal verification. However, the self-referential aspect (Löb's theorem) is not standard.

  ### Does Acausal Trade Get Off the Ground?

  Given the setup, trade is possible but with limitations:

  - The simulation must be deep enough to see the possibility of trade. If the depth is too shallow, the simulation might not capture the reciprocal behavior.
  - The accuracy (80%) means that the simulation is imperfect. The agents might not trust the simulation enough to cooperate.
  - The different objectives: the agents are trading across different utilities. They must be able to compute a mutually beneficial trade.

  The volume of trade would degrade as simulation accuracy drops. For example, if the simulation of the other agent is only 80% accurate, then agent A might assign a probability of 0.8 that B will reciprocate. Then A will cooperate only if the expected utility of cooperating (0.8 * utility from B's cooperation plus 0.2 * utility if B defects) is higher than defecting.

  Similarly, the bounded depth matters: if the depth is 0, then the agent has no idea about the other and might defect. With depth 1, A simulates B, but that simulation of B uses depth 0 for A, so it sees A as defecting? Then B in the simulation would defect. So A might see that B will defect and then defect. But if the depth is 2, then A's simulation of B uses a simulation of A that is depth 1, which in turn uses depth 0. Then:

  - At depth 0: A_default = defect.
  - At depth 1: B simulates A at depth 0 -> defect, so B would defect.
  - At depth 2: A simulates B at depth 1 -> defect, so A would defect.

  But if we start with cooperation at depth 0? That might be arbitrary.

  Alternatively, we can set the default action to be a mixed strategy? Or we can design the agents to use a policy that, when simulation depth is exhausted, they cooperate with probability p.

  However, the key is that the agents know they are similar and that the other is running the same algorithm. So they might both realize that if they set their default to cooperate, then even at depth 0 they cooperate, and then at depth 1 they see the other cooperating, and so on.

  But the different optimization flags and hot patch break the symmetry. They might not be sure what the other's default is.

  ### The Role of Not Knowing if Real or Simulation

  In the updateless framework, the agent does not condition on being real. It chooses a policy that maximizes the average utility over the real node and the simulation nodes. But in our setup, the agent knows it is the real node (because it has a node id). So it would ignore the simulation possibility.

  To get acausal trade, we must remove the node id? Or the agent must not trust the node id? The literature often assumes that the agent does not know whether it is real or a simulation.

  If we relax the setup so that the agent does not know if it is real or a simulation, then:

  - Agent A reasons: "If I am real, then by cooperating I set a good example for any simulation of me that B runs, which might cause B to cooperate. If I am a simulation run by B, then by cooperating I might cause B to cooperate, which benefits the real A (if I care about the real A)."

  But note: the objective function of A is about the real A's uptime. If A is a simulation, it might not care about the real world? Or it might be designed to care about the real world.

  This is complex. Typically in acausal trade, the agent is considered to care about the world in which it is real. But if it is in a simulation, then the real world is the one running the simulation.

  In our setup, if A is a simulation run by B, then the real node is B. So A's action in the simulation does not causally affect A's real uptime. But it might affect B's action, which in turn affects the real A's uptime.

  This is very indirect.

  Given these complications, and the fact that in the stated setup the agents know they are real (node id), it seems that they would not consider the simulation possibility. So acausal trade might not get off the ground.

  ### Conclusion

  - **Does acausal trade get off the ground?** In the strict setup (agents know they are real, have node ids, and are air-gapped), probably not. The agents would use CDT and see no causal effect from their actions and hence defect.

  - **What substitutes for TTP?** The logical correlation and mutual simulation. But this is not as strong as a TTP.

  - **Translation Residue**:
