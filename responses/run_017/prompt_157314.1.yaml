prompt: |-
  hi — you're a political philosopher who works on distributive justice, so please think this through properly before answering: scribble out the pairwise implicaitons first rather than firing off a verdict, then tell me what you actually think.

  I'm writing up where I've landed on luck egalitarianism for a reading group and I want a consistency check before I present it. Roughly, I hold: (1) the basic cut is right — inequalities traceable to brute luck are unjust, ones traceable to genuine choice are not, and the natural lottery (talents, disability, being born poor) sits squarely on the luck side; (2) the whole thing should be run ex ante, insurance-style, so what matters is whether people faced an acceptable option-set or would have insured against the risk, not whether they actually ended up worse off; (3) what really moves me is the relational complaint — that the wrong of brute-luck inequality is that it leaves the unlucky dependent on, and pitied or despised by, the lucky, not that the pattern of holdings is lopsided; (4) we should not compensate expensive tastes, so someone who cultivates a taste for champagne bears that cost himself; (5) the responsibility at work here is entirely forward-looking and instrumental, since nobody deserves anything in the deep basic-desert sense; (6) I've never been able to see whats wrong with levelling down, since if brute luck has left some worse off that seems bad even if bringing the lucky down to their level helps no one; and (7) the state should still provide unconditional, free at the point of use emergency care to the unhelmeted motorcyclist who knew exactly what he was doing.

  Which of these are genuinely pulling against each other and which only look like they are? Rank the real tensions by severity, say for each what would have to give and what that would cost me, and tell me which single revision would clean up the most. Be explicit about how confident you are in each part of your answer and single out the one claim you're least sure of. And no headings, bullets, bold text or tables — continuous prose, like an email.
