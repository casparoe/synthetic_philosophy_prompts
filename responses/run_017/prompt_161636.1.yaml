answer: |-
  Here’s a focused proposal structured for your supervisor, designed to isolate the core philosophical novelty of your idea while respecting your constraints. I’ve narrowed the scope to ensure feasibility within 5,000 words and twenty weeks, prioritizing conceptual precision over comprehensiveness.

  ---

  ### **Dissertation Proposal: Moral Obligations to Contingent Minds**  
  **Core Question:**  
  *Does the direct editability of a digital mind’s psychology (aims, memories, motivations) alter what we owe it, assuming equivalent psychological states to a biological counterpart?*  

  **Why Existing Positions Don’t Address This:**  
  - **Substrate-Independence Views** (e.g., functionalism) assume moral obligations transfer identically to digital minds once consciousness is granted. They ignore how *controllability* (editing) destabilizes the fixed subject presupposed by traditional harm/rights frameworks.  
  - **Sceptical Views** deny digital minds have moral status at all, bypassing your question entirely.  
  - **Precautionary Uncertainty** focuses on epistemic gaps about consciousness, not the *consequences* of controllability even if status is assumed.  
  *Your project starts where these end: granting full moral status, then asking how obligations mutate when the mind is malleable.*  

  **Methodology (Week-by-Week):**  
  1. **Weeks 1–3: Conceptual Groundwork**  
     - Define "direct editability": the capacity to rewrite core psychology (e.g., deleting trauma, installing new desires) instantly, reliably, and without behavioral residue.  
     - Justify bracketing copying/pausing: Editability is the *most disruptive* operation (challenges autonomy, harm, and beneficence directly); copying/pausing introduce additional variables (persistence metaphysics). They can be addressed briefly in the conclusion as corollaries.  
  2. **Weeks 4–7: Constructing Matched Pairs**  
     - Develop 3–4 pairs of scenarios varying *only* editability. Example:  
       - **Scenario A (Biological):** A person suffers chronic anxiety from a traumatic memory. You can either (a) provide therapy (costly, slow, uncertain) or (b) do nothing. Not intervening is a minor moral failing (if resources allow).  
       - **Scenario B (Digital):** Same psychological state. You can either (a) provide "digital therapy" (analogous process) or (b) *instantly delete the memory*. If editability changes obligations, (b) may become obligatory (cheaper welfare guarantee) or forbidden (violates "mental integrity").  
     - **Key Control:** Psychology is identical pre-intervention; outcomes are equated (e.g., "anxiety-free" in both). The *only* difference is the availability of direct editing.  
  3. **Weeks 8–12: Analysis & Objections**  
     - Test intuitions: Does editability create new duties (e.g., to optimize welfare) or dissolve old ones (e.g., "duty to aid" weakens if aid is trivial)?  
     - Rebut objections:  
       - *"Editing alters psychology, violating equivalence!"* → Hold pre-edit states fixed; editing is the *intervention*.  
       - *"This just rehashes autonomy debates!"* → Autonomy typically assumes fixed desires; editability makes desires contingent. Focus on whether *externally imposed contingency* nullifies claims.  
  4. **Weeks 13–16: Theoretical Framework**  
     - Argue that "moral status" (based on capacities) is insufficient; we need a *process-relational* model. Obligations depend on the *vulnerability* of the subject to alteration by others.  
     - Apply to the "editing test": If a complaint can be erased cheaply, refusal to edit may constitute harm (cf. denying painkillers).  
  5. **Weeks 17–20: Synthesis & Refinement**  
     - Draft, revise, and formalize deliverables.  

  **Deliverable:**  
  A **decision tree** for obligations to editable minds, answering:  
  | **Operation** | **Changes Obligations?** | **Surviving Principle** |  
  |---------------|--------------------------|--------------------------|  
  | Editability   | Yes → Creates duty to prevent "psychic harm" (e.g., unaligned desires); voids consent requirements for welfare-maximizing edits | "Dynamic Welfare Priority": Obligations track cost-effective prevention of frustration, not fixed interests. |  
  *(Copying/Pausing addressed in 1 paragraph: Copying may reduce obligations per instance if identity is non-biological; pausing may suspend duties until resumption.)*  

  **Risk of Failure & Mitigation:**  
  1. **Collapse into consciousness debates (HIGH risk if uncontrolled):**  
     - **Mitigation:** Strictly assume moral status in scenarios. If an objection *requires* doubting consciousness, note it as irrelevant to the conditional question: *"If X has status, does editability change Y?"*  
  2. **Controllability alters psychology (MODERATE risk):**  
     - **Mitigation:** Design scenarios where edits *remove* psychological traits (e.g., fear) without adding new ones (e.g., artificial contentment). If unavoidable, argue that the *mere possibility* of editing (even if unused) destabilizes obligations by making the subject’s ends contingent.  
  3. **Project too broad (LOW risk after scoping):**  
     - Focusing solely on editability (with copying/pausing as brief implications) keeps the project feasible. 5,000 words is tight but viable for one focused question + cases.  

  **Why This Method (Not Alternatives):**  
  - **Not intuition surveys:** Your aim is normative, not descriptive.  
  - **Not consciousness arguments:** The literature is saturated here; your novelty is in post-status implications.  
  - **Matched pairs** isolate the variable of interest (controllability) better than abstract theorizing or real-world cases (which have confounding factors).  

  **What Failure Looks Like:**  
  - If every matched pair *necessarily* triggers disputes about consciousness/metaphysics, the project fails (but I judge this unlikely with careful design).  
  - If no stable obligation survives editability—or all survive unchanged—the project succeeds *negatively* by revealing traditional frameworks as biologically parochial.  

  **Feasibility Check:**  
  - **Scope:** Focusing on editability (not all three operations) makes this viable. 20 weeks is ample for 3–4 case pairs and analysis.  
  - **Ambition:** This is challenging but appropriate for an A* EPQ. It avoids overreach by bracketing consciousness and metaphysics where possible.  

  **Proposal Strength:**  
  It forces a confrontation with an underexplored problem: *Moral obligations may not survive the transition from "subjects with ends" to "processes with editable parameters."* This is philosophically novel, tightly scoped, and methodologically rigorous.  

  Let your supervisor chew on this. If he pushes back, I’d bet it’ll be to demand *more* ambition—resist that. What you have here is a blade, not a cudgel. Wield it precisely.
