answer: |-
  You're right to dissect this. The phrase is often deployed as a self-justifying platitude, but its ambiguity allows it to bear more argumentative weight than it can support, especially for your interlocutor's specific inference about existential risk prioritization. Let's break it down as requested.

  ### 1. What "bends" commits to geometrically
      *   **Endpoint Higher Than Start:** The final state (whenever "history" ends or is evaluated) has more justice than the initial state. *Evaluation:* **Substantive & Contested.** Possible (e.g., abolition vs. chattel slavery), but not inevitable. Compatible with catastrophic collapse before the "endpoint".
      *   **Positive Average Slope:** Over sufficiently long timescales, the *rate* of improvement is positive on average. *Evaluation:* **Substantive & Contested** (the core of Pinker-esque arguments). Requires defining the timescale and metric.
      *   **Always Positive Slope:** Justice is monotonically increasing; no genuine backsliding, only temporary setbacks. *Evaluation:* **Straightforwardly False.** History is replete with prolonged periods of significant moral regression (collapse of Roman Republic, Dark Ages, various genocides, rise of totalitarianism).
      *   **Positive Curvature (Acceleration):** The rate of improvement itself is increasing. *Evaluation:* **Highly Contested & Likely False.** While some metrics (e.g., reduction in violence) might show acceleration recently, others (e.g., existential risk) arguably show deceleration or negative curvature.
      *   **Crucial Notes:**
          *   **Asymptote Short:** A curve can bend relentlessly *towards* a justice target (e.g., universal rights) but never actually reach it. *This directly undermines the "good-by-default" future.*
          *   **Negative Current Slope:** The curve can be bending towards a distant point while currently descending (e.g., deep in a "valley" of authoritarianism or war). *This directly contradicts treating current backsliding as mere noise.*

  ### 2. What "Justice" Means
      *   **Independent Moral Target:** Justice exists as an ideal (e.g., Rawlsian fairness, Kantian universalism, utilitarian wellbeing) that history is approaching. *Evaluation:* **Substantive & Contested.** Requires justifying the moral framework. Progress is measured against this external standard.
      *   **Whig History / Post-Hoc Label:** "Justice" is simply whatever the endpoint turns out to be. "Winning" defines justice. *Evaluation:* **Straightforwardly False** as a description of moral reality (though common as a rhetorical move). Makes the claim tautological ("history bends towards wherever it ends up") and useless for prediction or prioritization.
      *   **Distributive Justice:** Reduction in economic inequality, fairer resource allocation. *Evaluation:* **Substantive & Contested.** Trends are mixed globally; often conflicts with other values.
      *   **Widening Circle of Moral Concern:** Extending rights, consideration, and status to more groups (women, racial/ethnic minorities, LGBTQ+, animals, future generations). *Evaluation:* **Strongest Case for Past Progress (Platitude?), Contested Future.** Significant historical expansion is undeniable *for specific groups*. Future expansion (e.g., to digital minds, aliens) is speculative. Vulnerable to reversal (e.g., narrowing in-group definition during crises).
      *   **Reduced Cruelty/Violence:** Less torture, war, murder, oppression. *Evaluation:* **Substantive & Contested** (Pinker's core argument). Evidence for long-term reduction in *per capita* violence is strong but debated. Cruelty can persist or transform.
      *   **Coming Apart:** These aspects *can* conflict. Widening the circle might increase conflict (distributive strain). Reduced overt violence might coexist with subtle systemic injustice. Material surplus might enable both greater luxury and greater destructive capacity.

  ### 3. Scope, Baseline, and Counterfactual
      *   **Describes Recorded Past:** Claims the *observed historical trajectory* shows improvement. *Evaluation:* **Platitude (mostly) for Widening Circle/Reduced Violence.** True for many metrics over the last few centuries, though with massive caveats (colonialism, world wars). Less true for distributive justice or constant slope.
      *   **Predicts Unconditional Future:** Claims improvement *will* continue inevitably. *Evaluation:* **Straightforwardly False.** Ignores contingent factors, human agency, and existential risks. History has no teleology.
      *   **Expected Value Conditional on Observers:** Given that someone is around to evaluate it, the future will likely be more just. *Evaluation:* **Substantive & Contested (Anthropic Bias).** This filters out futures where existential catastrophe wipes out observers, biasing the sample towards survival, which *might* correlate with stability/justice, but far from guaranteed (a stable dystopia could persist).
      *   **Baseline/Counterfactual:** What is improvement measured against?
          *   **Previous State:** Simple delta from time T-1 to T. *Vulnerable to noise, short-term trends.*
          *   **"State of Nature":** Assumes a brutal baseline. *Evaluation:* **Contested.** Pre-civilization life had different forms of violence/injustice.
          *   **Rising State Capacity/Surplus:** Much "progress" may be due to technology/wealth enabling rights enforcement or reducing scarcity-driven conflict, not fundamental moral improvement. *Evaluation:* **Highly Plausible/Substantive.** This significantly weakens the inference of *inevitable moral* progress. If progress depends on fragile material conditions, it's reversible if those conditions fail (e.g., climate collapse, nuclear war).

  ### 4. Purpose: Prediction vs. Commitment Device
      *   **Prediction:** Makes a factual claim about the future. *Evaluation:* As above (Scope), **False or Contested.**
      *   **Commitment Device / Rallying Cry:** Its utterance is performative, aiming to inspire action that *makes* justice more likely. *Evaluation:* **Plausible Pragmatic Function.** This is likely its most defensible use (e.g., MLK's original context). However, *it does zero work for your interlocutor's argument.* If it's *only* a commitment device, it offers no *evidence* that the default future is good or that backsliding is noise. It implicitly acknowledges the need for effort to *avoid* a bad default.

  ### 5. The Work of "Long"
      *   Primarily serves to **insulate the claim from falsification.** Any setback, no matter how severe or prolonged, can be dismissed as temporary within the vast "arc." *Evaluation:* **Overwhelmingly True.** This is the phrase's core rhetorical power and primary epistemic weakness. It renders the claim non-falsifiable within any observable timeframe. "Long" **does not** imply "infinite" or guarantee reaching the target.

  ---

  **Evaluating Support for the Interlocutor's Inference:**

  Your interlocutor needed the phrase to support:
  1.  **The long-run future is good-by-default:** Requires a strong prediction of inevitable, significant moral improvement reaching a sufficiently "good" state *by default* (without extraordinary effort).
  2.  **Present backsliding carries little evidential weight:** Requires either an always-positive slope or the strong conviction that any negative slope is definitively temporary and minor within the long arc.

  **Which readings support this?**

  *   **Endpoint Higher:** Weak support for (1). Doesn't guarantee *how* high or *when*. Compatible with a barely-better endpoint reached after eons of horror. Says nothing about (2).
  *   **Positive Average Slope:** Weak/moderate support for (1) *if* the slope is large enough and the timescale relevant. Offers *some* basis for discounting (2) *if* the current dip is small relative to the long-term trend. **This is the strongest contender, but still weak.** The "default" future relies on the trend continuing *uncontested*, which it isn't.
  *   **Always Positive Slope:** Would strongly support both (1) and (2), but is **False.**
  *   **Positive Curvature:** Supports acceleration towards (1), but doesn't guarantee reaching it. Says little about (2) unless slope is also always positive. **Contested/Unlikely.**
  *   **Independent Justice Target:** Necessary for any meaningful claim about (1), but doesn't guarantee progress towards it.
  *   **Widening Circle/Reduced Violence (Descriptive Past):** Supports that *past* trends *could* continue, but doesn't establish inevitability or default (1). Offers *some* historical precedent to downplay (2), but past trends aren't laws of nature.
  *   **Predicts Unconditional Future:** Would support (1) and license dismissing (2), but is **False.**
  *   **Expected Value Conditional on Observers:** Offers qualified support for (1) *if* survival correlates strongly with justice, but this is speculative. Offers little on (2). **Weak.**
  *   **Commitment Device:** **No support.** Acknowledges the *need* to fight for justice against a non-guaranteed outcome.

  **Your Suspicion is Largely Correct:**

  *   **The readings that come closest** to supporting the interlocutor (**Positive Average Slope** on **Widening Circle/Reduced Violence**, *perhaps* **Conditional Expected Value**) are **substantive and contested**, not certainties. They rely on extrapolating specific past trends indefinitely, ignoring fragility, contingency, and novel risks (especially x-risks).
  *   **The strongest readings** for the interlocutor (**Always Positive Slope**, **Unconditional Future Prediction**) are **straightforwardly false**.
  *   **Most readings** (**Endpoint Higher**, **Whig History**, **Describes Past**, **Commitment Device**) **do little to no work** for the inference needed. They might support "things were worse earlier," but that is entirely compatible with a future that plateaus far below ideal, asymptotes, collapses, or becomes a stable dystopia – i.e., "very bad."

  **The Single Most Supportive Reading (If Established):**

  If your interlocutor could **conclusively establish** the **Positive Average Slope (with a sufficiently large slope) on an Independently Defined Justice metric (like Widening Circle or Reduced Cruelty/Violence) as an Unconditional Future Prediction**, that would do the most for them. It directly implies inevitable improvement over time (1) and allows current backsliding to be interpreted as minor noise within an overwhelming upward trend (2).

  **However, establishing this is impossible.** It's not a factual claim that *can* be conclusively established about the future. It's a highly contested extrapolation vulnerable to:
  *   **Existential Risks:** A single low-probability, high-impact event (nuclear war, misaligned AI, engineered pandemic) resets the "arc" to zero or negative infinity.
  *   **Value Lock-in:** A future dominated by a powerful but morally flawed ideology (digital totalitarianism, catastrophic suffering-focused ethics).
  *   **Fragility of Progress:** Evidence that gains depend on specific, potentially unsustainable, material and political conditions.
  *   **Non-Linearity:** The assumption that past trends linearly continue ignores potential phase changes or feedback loops.

  **Conclusion:** The phrase, in any rigorous precisification, fails to provide the strong, default-good-future guarantee your interlocutor needed to downplay existential risk mitigation. The most favorable readings are speculative extrapolations vulnerable to catastrophic disruption, while the definitive readings are false. The phrase's power lies in its ambiguity and unfalsifiability, not its empirical or predictive strength. Relying on it for cause prioritization, especially regarding x-risks, is unjustified optimism.
