prompt: |-
  I teach philosophy (ethics and political philosophy mostly, though I keep getting dragged into interdisciplinary corruption projects, which is how this started), and there's a thing I keep running into that I can't find a name for. I'm starting to think there might not be one, which would itself be interesting. Cases first.

  A few years ago I was visiting a university abroad that I won't name. A driver was assigned to meet me at the airport, and before we set off my host handed him a small envelope. I asked what it was for and she said it wasn't for the driving — the driving was his job, he'd have done it identically without it, and in fact later in the trip I travelled with someone who forgot, and nothing whatsoever was different: same car, same route, same silence. It was, she said, so that the drive wouldn't be merely an assignment, so that there'd be a person at each end of it. I pressed her on what the driver was then supposed to do differently and she looked at me as though I'd missed the point entirely: nothing.

  At home I leave a bottle of something out for the bin men at Christmas. I'd be genuinely put out if my bins started being emptied first because of it. If the council banned the practice tomorrow, no aspect of my refuse collection would change. But something would go flat, and I'd feel I'd been rude for a year.

  Third: the parents' association at my kid's school collects for an end-of-term present for the teacher. There's a strict understanding that it must be small, that it must not be given early, and that it must not be given by any parent who currently has something pending with that teacher — a disputed grade, a request, anything. Break any of those and it turns into something else altogether, something sordid.

  So: what am I looking at? The obvious categories all seem to me to miss, and I want to know whether there's a better one, or whether the misses are the story.

  It isn't a bribe on any of the usual definitions — abuse of entrusted power for private gain, and all that — because the whole point is that nothing is bought. If the outcome changed, the practice would be ruined, and in the school case the entire norm structure exists to stop that happening. It isn't a tip, or not what I take tipping to be: tipping comes after the service, tracks its quality, and gets explained as buying better service next time. Mine is fixed by convention, doesn't track quality (I'd put the bottle out in a year they'd missed my bin twice), and isn't aimed at future treatment. It isn't the thing the anthropology people go on about either — a colleague pointed me at the gift-exchange literature, where the gift binds because it obliges the recipient to give back. That's backwards here: if the driver gave me something in return, or the bin men started prioritising me, it would spoil it. The transfer is meant to be terminal, the last word rather than the first. And it isn't clientelism or patronage as I understand those — one-off, no broker, nothing ongoing, no loyalty purchased.

  What I think I'm after is a name for the move where the payment doesn't alter the outcome you receive but alters the kind of relation the outcome sits inside: it takes something impersonal and rule-governed and makes it personal, and it does that by being a transfer that is stipulated to be incapable of buying anything. Not the gift that obliges, but the gift that discharges — you give because you owe a person and cannot pay them, and the giving is the acknowledgment of the debt rather than the settlement of it.

  Two things then.

  1. Does this have a name anywhere — corruption studies, the anthropology of the gift, social theory, wherever? If it does, tell me which, and tell me where my cases sit relative to the paradigm version: is the "must not buy anything, must not be reciprocated" feature central to it, or a local wrinkle of my examples? If it doesn't, coin a term and define it, and give me the boundary cases. I want enough precision to say whether a large "gift" handed to a surgeon after a successful operation is the same practice or a bribe wearing its clothes, and whether the official who refuses it is making a move inside the practice or rejecting the practice outright.

  2. However it gets carved, does it actually slide? Every gift-and-hospitality policy I've ever seen would prohibit all three of my cases outright, usually on the reasoning that they're the thin end of the wedge. Is that true of this thing in particular — is the "must not change the outcome" norm stable, or does a practice containing that norm reliably become one that buys outcomes? I want the mechanism either way, because it bears on the larger question I'm circling: whether our anti-corruption frameworks are tracking something real when they get exported, or whether they simply have no category for this and file it under bribery by default.

  Please don't just hand me a label. The point is which thing this is and where its edges fall, and which nearby candidates come close and exactly why they fall short. Oh — and British English, please; I'm editing a UK-edition volume and I'd rather not spend an afternoon changing behaviour back from behavior.
reasoning: |-
  Okay, the user teaches philosophy, specifically ethics and political philosophy, and they're involved in interdisciplinary corruption projects. They've encountered a recurring phenomenon in three distinct scenarios: the envelope for the driver, the Christmas bottle for bin men, and the school gift for teachers. They're looking for a precise term to describe this practice where a transfer of value doesn't alter the outcome but changes the relational context. They've ruled out terms like bribe, tip, gift-exchange, clientelism, and patronage.

  First, I need to recall concepts from anthropology, sociology, and philosophy. Marcel Mauss's "The Gift" comes to mind, but the user mentioned that gift-exchange literature emphasizes reciprocity, which doesn't fit here. The user stresses that reciprocity would spoil the practice. So, what alternatives exist?

  Then I remember Georg Simmel's work on gratitude and non-reciprocal gifts. Simmel discussed how gratitude maintains social bonds without expecting something in return. That aligns with the user's cases. Also, Erving Goffman's "supportive interchanges" or "ritual exchanges" might apply. These are symbolic acts affirming social roles without transactional expectations. 

  The term "honorarium" pops up, but it's usually for services beyond formal duties. In the driver's case, the envelope isn't for extra service but acknowledging the person. "Token of appreciation" is close but too vague. The user wants precision. 

  Another angle: the irreversibility of the gift. Jacques Derrida's distinction between the gift and exchange could be relevant. A true gift, for Derrida, must not be acknowledged as such, but that's abstract. The user's examples involve deliberate giving but no expectation of return. 

  Considering British English terms, "sweetener" usually implies influencing outcomes, which contradicts the user's cases. "Pourboire" is French for tip, again not fitting. "Civility transfer"? That's clunky. "Relational alchemy" captures the transformation from impersonal to personal but isn't a recognized term. 

  The user also asks about the stability of such practices. Anti-corruption policies might ban these acts fearing a slippery slope. But the examples have norms preventing reciprocation. The school's strict rules (small gift, timing, no pending issues) act as safeguards. However, external observers might misinterpret, leading to prohibition. The mechanism here is about perception versus intent. Without clear norms, the practice could slide into bribery, but with strong norms, it might remain stable. 

  The surgeon example: a large gift post-operation could be seen as a bribe if it influences future care, but if it's small and symbolic, it might fit the category. The refusal by an official could be rejecting the practice entirely or upholding a stricter anti-corruption stance. 

  Need to check if "gratuity" in British English fits. It often means a tip for services, which the user excluded. "Ex gratia" implies no obligation, which is closer but typically used in legal contexts. 

  Perhaps "recognition gift"? Emphasizing acknowledgment without transaction. But is there a standard term? After searching, "solatium" comes to mind—a compensation for emotional loss, not fitting. 

  The term "tribute" might be considered, but it usually implies submission or acknowledgment of status, not suitable here. "Courtesy gesture" is descriptive but not a technical term. 

  The user's deeper need is to categorize this practice accurately for their volume, avoiding misclassification as corruption. They need a defensible term that captures the essence without transactional elements. Also, addressing whether such practices can coexist with anti-corruption frameworks without sliding into bribery. 

  So, proposing "relational token" as a term, defining its characteristics: symbolic, non-convertible, terminal, norm-bound. Highlighting Simmel and Goffman as theoretical bases. For the surgeon case, if the gift follows similar norms (small, after service, no expectation), it fits; otherwise, it risks being a bribe. The official refusing might see it as incompatible with institutional roles, thus rejecting the practice. 

  On stability: the norms are fragile. Without clear boundaries, slippage occurs. But in tight-knit groups with strong norms, it can endure. Anti-corruption frameworks often lack nuance, leading to over-prohibition. The user's work might argue for recognizing such practices to avoid mislabeling them as corrupt.
answer: |-
  Based on your cases and analysis, you've hit upon a fascinating and under-theorized social practice. **This does not have a single, widely accepted, precise term in the literature you cite (corruption studies, anthropology of the gift, social theory).** Your observation about the "misses" being the story is astute. However, we can define it clearly and situate it within relevant frameworks.

  ### 1. Defining the Phenomenon & Finding a Name

  *   **Core Characteristics:**
      1.  **Symbolic, Non-Convertible Value:** The transfer has monetary value but is stipulated *not* to be convertible into preferential treatment, altered outcomes, or reciprocation. Its value is symbolic, residing solely in the gesture itself.
      2.  **Relational Alchemy:** Its primary function is to transform an *impersonal, rule-governed transaction* (bin collection, assigned driving, professional teaching) into an interaction *recognised as occurring between persons*. It injects personal acknowledgment into an institutional framework.
      3.  **Terminal Transfer:** It is explicitly *not* the opening move in an exchange cycle (gift/counter-gift). Reciprocation (beyond perhaps a simple "thank you") or altered behaviour would invalidate the gesture. It aims to *discharge* a perceived social/relational debt, not create a material one.
      4.  **Norm-Bound:** The practice is governed by strict, often unwritten, norms (size, timing, context, anonymity) designed *specifically* to prevent it from becoming transactional or influencing outcomes. Violating these norms destroys its intended meaning.
      5.  **Acknowledgment of Unpayable Debt:** It recognizes a diffuse sense of "owing" – not for specific services rendered beyond the norm, but for the *fact* of the service being performed *by a person* within an impersonal system. It acknowledges the human presence within the institutional role.

  *   **Why Existing Categories Fail:**
      *   **Bribe:** Requires *quid pro quo* – influence on outcome. Here, influence negates the practice.
      *   **Tip/Gratuity:** Primarily rewards/service quality signals & often *is* aimed at future service. Here, it's fixed, non-contingent, and future service alteration is unwanted.
      *   **Gift-Exchange (Maussian):** Relies on creating obligation and reciprocity cycles. Here, obligation is *denied* and reciprocity is forbidden.
      *   **Clientelism/Patronage:** Involves ongoing relationships, power asymmetry, and exchange of loyalty/support for material benefit/favours. Here, it's one-off (or periodic like Xmas), lacks a power broker, and forbids loyalty/favours.
      *   **Honorarium:** Usually payment for services *beyond* formal duties (e.g., guest lecture). Here, the service itself *is* the formal duty, performed identically.

  *   **Proposed Term & Definition:**
      *   **Relational Token (or Relational Acknowledgment Token)**
      *   **Definition:** *A small, conventionalised transfer of value, governed by strict norms prohibiting reciprocity or alteration of service outcomes, whose sole purpose is to acknowledge the personhood of a service provider within an impersonal institutional context, thereby transforming the relational character of the transaction from purely functional to interpersonally recognised.*
          *   "Token" emphasises its symbolic, non-convertible nature.
          *   "Relational" captures the core function of transforming the interaction.
          *   "Acknowledgment" highlights the discharge of the perceived debt of personhood.
          *   "Stipulated Terminality" (if needing a phrase) underlines the "no reciprocation/no influence" rule.

  *   **Boundary Cases & Your Questions:**
      *   **The Surgeon's "Gift":**
          *   **Large gift after successful op:** Almost certainly *not* a Relational Token. Its size violates the "small/conventional" norm suggesting convertibility. The timing (post-success) risks implying reward for specific outcome, not general personhood. The power asymmetry is extreme. This veers into *bribe* (for future goodwill/favours) or *extravagant gratuity*.
          *   **Small token (e.g., box of chocolates) after discharge, within hospital policy?** *Potentially* fits if norms exist (size limits, timing, no pending care) mirroring your school example. However, the high-stakes context makes the "no influence" norm incredibly fragile and hard to police. Most policies would prohibit it *precisely* because the risk of slippage (or perception) is too high.
      *   **The Official Who Refuses:**
          *   **Move within the practice?** Unlikely. The practice relies on acceptance as acknowledgment, not payment. Refusal signals rejection of the *relational transformation* itself. It insists the interaction remain purely institutional/persona-based ("I am only my role, do not acknowledge me as a person in this context").
          *   **Rejecting the practice outright?** Yes. This is the most plausible reading. The official is upholding a strict institutional boundary against *any* personal acknowledgment within the transactional frame, likely citing anti-corruption principles or role purity.

  ### 2. Does it Slide? Stability of the "Must Not Change Outcome" Norm

  The fragility and potential for slippage is real, but the mechanism isn't inevitable. It depends heavily on context and norm enforcement:

  *   **Why it *Might* Be Stable (in your cases):**
      *   **Clear, Internalised Norms:** The norms are strong and understood by *both* parties (driver knows it's not a tip, bin men know the bottle is Xmas civility, teachers/parents understand the strict PA rules). This shared understanding defines the token's *meaning*.
      *   **Low Stakes/Non-Critical Services:** The services involved (driving, bin collection, standard teaching) are relatively low-stakes and routine. The cost of *not* receiving preferential treatment is minimal. There's little incentive for recipients to push for more or givers to expect more.
      *   **Symmetry/Lack of Coercion:** While not perfectly symmetric, the power imbalance isn't extreme (unlike surgeon/patient). The giver isn't vulnerable to retaliation for *not* giving (you forgot once, nothing happened).
      *   **Terminal Nature:** The stipulation against reciprocation actively *prevents* the initiation of an exchange cycle that could escalate.
      *   **Community Enforcement (School Case):** The PA rules act as a community-level enforcer of the norms, shaming those who violate them (making it "sordid").

  *   **Why it *Can* Slide & How Anti-Corruption Frameworks See It:**
      *   **Perception vs. Intent:** Anti-corruption frameworks operate heavily on *perception* and *risk*. An outsider (auditor, inspector, new headteacher) sees money/gifts changing hands around a service. The *intent* (relational token) is invisible; the *act* resembles bribery/tipping. They see a wedge, thin or not. Policies prohibit based on appearance and potential.
      *   **Erosion of Norms:** Norms can weaken. A new driver might *interpret* the envelope as a tip. A new bin man crew might start prioritising houses with bottles. A parent might give a large gift early hoping for favour. Without strong community enforcement (like the PA), this interpretation can spread.
      *   **Shifting Expectations:** If *some* drivers start providing small extras (opening doors, smoother ride) "in appreciation," it can create an expectation that the token *does* buy something, however minor, eroding the "identical service" norm.
      *   **Scaling/Institutionalisation:** The practice is inherently personal and contextual. Scaling it up (e.g., an official policy for "relational tokens" to all service staff) is incredibly difficult without introducing elements of entitlement, expectation, or perceived influence. The personal meaning gets lost.
      *   **Power Asymmetry Amplification:** In contexts with greater power asymmetry (like the surgeon), the recipient might feel subtly pressured to reciprocate with better service *next time*, even if not asked, or the giver might subconsciously expect it. The "no influence" norm is harder to maintain.
      *   **The "Grey Zone":** Anti-corruption frameworks detest ambiguity. A relational token exists in a grey zone between pure gift (rarely regulated) and bribe/tip (heavily regulated). Policies often simplify: "No gifts connected to services." This is a crude but administratively safe approach.

  **Conclusion on Slippage:** The "must not change outcome" norm *can* be stable **within small-scale, well-understood, norm-governed contexts with low stakes and relatively symmetric relationships** (like your examples). However, it is **inherently fragile** because:
  1.  **Perception Risk:** It looks like corruption/tip to outsiders.
  2.  **Norm Erosion Risk:** Internal understanding can break down.
  3.  **Context Limitations:** It struggles to scale or survive in high-stakes/high-power-asymmetry contexts.
  Anti-corruption frameworks, focused on risk mitigation and eliminating grey areas, often **do** "file it under bribery by default" not necessarily because they miss its unique nature entirely, but because they judge the risk of slippage or misperception to be unacceptably high, and the practice itself to be non-essential to the core service. They prioritise institutional impersonality and clear boundaries over relational nuance. Your cases show this framework *does* miss something real – a specific form of social glue acknowledging personhood within systems – but it's a miss born of prioritising different values (anti-corruption certainty) and recognising the inherent instability of the practice outside its narrow, well-policed contexts. **Relational Tokens** exist in a precarious, norm-dependent space that anti-corruption regimes are structurally inclined to dismantle.
