prompt: |-
  I teach a graduate seminar on American pragmatism, and for next week I built the following argument as a way of pressing a Deweyan account of democracy to the point where it embarrasses itself. I now think it proves far too much, but I cannot locate the exact point of failure, and I would be grateful for a diagnosis rather than a bibliography.

  The view I am working with, stated as neutrally as I can. Inquiry, on this account, is not the application of antecedently fixed ends to given means; it is the directed transformation of an indeterminate situation into a determinate one, and the ends-in-view that guide it are themselves formed, tested, and revised within the inquiry rather than supplied to it from outside. Democracy is then not a mechanism for tallying preferences that exist prior to political life; it is the conduct of associated living under the condition that the ends of that life are themselves open to inquiry. This is what separates the position from the technocratic alternative Dewey argued against in his disagreement with Lippmann, on which the public is incompetent by constitution and must be administered by experts who can discern its real interests.

  The argument:

  (1) On this account, whatever authority a collective decision has — epistemic and moral — derives from its being the outcome of inquiry rather than the registration of preferences that were fixed in advance of it.

  (2) So a procedure that confers that authority must leave open, and submit to revision, the ends of those who take part in it; a procedure that treats its inputs as settled is executive technique, not inquiry.

  (3) Openness to the revision of the participants' ends is therefore the mark by which we distinguish procedures that confer democratic authority from procedures that do not.

  (4) A procedure is open in the relevant sense if it reliably changes the ends of those who undergo it.

  (5) Commercial advertising, propagandistic framing, and the rearrangement of choice architecture all reliably change the ends of those who undergo them; that is precisely what they are designed and selected to do, and their success is measured by it.

  (6) So advertising, propagandistic framing, and nudging are, by (3), procedures of the kind that confer democratic authority — that is, they count as instances of democratic inquiry.

  (7) But (6) is absurd. These are the paradigms of what corrupts democratic judgment, not instances of the activity whose exercise confers authority.

  (8) So the identification of democracy with inquiry cannot mark the difference between deliberation and manipulation: either one of (1) through (3) is false, or (7) is.

  My own sense is that the trouble is in the move from (3) to (4), since openness to revision seems to be a matter of what the procedure does with the considerations it turns up, while reliable change of ends seems to be a matter of causal efficacy, and a procedure can have the second without the first. But when I try to say what the missing clause is — revision in light of reasons the participants can themselves take up — I seem to reintroduce an agent who stands outside the process with standards antecedently in hand, which is the spectator picture the whole account was meant to displace. And I am not confident that (3) is innocent either: it may be that no single procedure can bear the mark at all, and that the mark belongs to an extended sequence in which consequences feed back into revised ends.

  What I want, then, is this. Name the step that fails and say why it looked sound. Then price the alternatives honestly: for each premise one might give up, say what the resulting position can and cannot still claim about democracy, expertise, and the formation of ends, and say which of my own commitments I would have to surrender to hold it. Of (1), (2), and (7) I am unwilling to let go; if the cost falls on (3) or (4), I want to know exactly how much of the Deweyan program survives.

  As a check on whatever proposal emerges, apply it to two cases I did not build into the argument. First: a citizens' assembly convened once, with members chosen by lot, briefed by opposing experts, and asked to recommend a policy to a legislature that is free to ignore them. Second: a standing online forum in which an automated system restates each participant's contribution in a shared vocabulary before others see it, on the stated ground that most disagreements there are verbal and dissolve once translated.
reasoning: |-
  Okay, I'm diving into this fascinating problem about Deweyan democracy and where the argument goes wrong. The user has constructed a reductio ad absurdum that seems to show advertising and propaganda would count as democratic inquiry under Dewey's framework - which is clearly unacceptable. They're stuck at step (3) to (4) but worry fixing it might betray pragmatist commitments.

  Hmm... let me trace the core tension. The user wants to preserve three key principles: (1) authority comes from inquiry not pre-fixed preferences, (2) ends must be revisable during process, and (7) manipulation isn't democratic. But they've hit a paradox where manipulative techniques technically satisfy the revisability criterion. 

  The real issue jumps out at me: Dewey's "revision" implies transformation through problem-solving, not just any causal change. When advertisers change your preferences by exploiting cognitive biases, that's not inquiry - it's bypassing reasoning altogether. The missing piece is the qualitative nature of how ends change. 

  *scribbles mentally* For the citizens' assembly test case: even though it's a one-off, participants engage in joint reasoning about ends (e.g. shifting from "lower taxes" to "equitable public services" after expert testimony). That's genuine inquiry. Whereas the translation forum merely eliminates misunderstandings without transforming underlying ends - useful but not democratic authority-building. 

  *checks against propaganda example* Yes, propaganda fails because it manufactures consent through emotional triggers, not working through doubts. The key is whether the procedure cultivates participants' own capacity for re-evaluation. That preserves Dewey's anti-spectator stance while blocking the absurd conclusion. 

  User's worry about smuggling in external standards seems unfounded - the standards emerge from the experiential process itself, consistent with pragmatism. The survival of Dewey's core is robust: we keep the dynamic ends-means continuum while drawing a bright line between manipulation and deliberation where it matters.
answer: |-
  Your argument is admirably constructed, and the failure occurs precisely at step (4). Here's the diagnosis, the cost of revision, and application to your test cases:

  ### Diagnosis: Why (4) Fails
  - **The flaw**: Premise (4) equates "openness to revision of ends" with "reliably changing ends," collapsing the distinction between *deliberative transformation* and *causal manipulation*. Deweyan inquiry requires ends to be revised through **participatory examination of consequences**, not merely altered by external stimuli.  
  - **Why it looked sound**: Pragmatism rejects rigid means/ends separation, making causal efficacy seem sufficient. But Dewey's "intelligent action" (e.g., *Logic: The Theory of Inquiry*) demands that revisions arise from *shared scrutiny of problem-solving consequences*, not passive reception of stimuli.  
  - **The missing clause**: Not "reasons participants can take up" (which risks spectator theory), but **whether the procedure enables participants to test ends against experienced consequences of their provisional adoption**. This is immanent to inquiry, not externally imposed.

  ### Cost of Revising Premises
  | Premise | What Giving It Up Costs | What Deweyan Core Survives |
  |---------|-------------------------|----------------------------|
  | **(1)** | Undermines Dewey's anti-technocratic core. Authority reverts to pre-fixed standards or expert fiat. | Nothing essential. Surrenders pragmatism's distinctive claim. |
  | **(2)** | Accepts Lippmann-esque technocracy: experts set ends, citizens merely execute. | Dewey's epistemology survives, but not his democratic theory. |
  | **(3)** | **Minimal cost** (your path). Distinguishing mark moves from procedure-type to *processual features* of inquiry. | Preserves (1) and (2). Democracy remains inquiry, but requires iterative consequence-testing. |
  | **(4)** | **Required revision**. "Reliable change" ≠ democratic authority. | Full Deweyan program survives. Clarifies inquiry as consequence-driven transformation. |
  | **(7)** | Absurdity accepted: propaganda becomes democratic. Collapses democracy into manipulation. | Deweyanism self-destructs. |

  ### Revised Position (Keeping 1,2,3; Rejecting 4; Clarifying 3)
  - **Premise (3) amended**: Openness to revision is marked by procedures that **facilitate testing ends against the experienced consequences of their provisional adoption in collective action**.  
  - **Resolution**: Advertising/propaganda lack this because they:  
    - (a) *Preempt* testing of ends (e.g., ads trigger impulse buys without deliberation),  
    - (b) *Isolate* end-formation from public consequence-tracing (e.g., nudges obscure alternatives).  
  - **Deweyan survival**: Full. Democracy remains experimental inquiry where ends evolve through public reckoning with shared problems. Authority derives from participatory learning, not preference aggregation or elite wisdom.

  ### Test Case Applications
  1. **Citizens' Assembly (one-off)**:  
     - **Fails** Deweyan inquiry if it ends at recommendation. Authority requires *feedback*: did the policy solve the problem? Without mechanisms to revisit ends post-implementation, it lacks consequence-testing.  
     - **Partial credit**: If experts brief *opposing views* and assembly debates trade-offs, it enables *provisional* end-revision. But its authority remains incomplete without iterative learning.

  2. **Automated Translation Forum**:  
     - **Fails** as democratic inquiry. While resolving verbal disputes aids communication, it doesn't test ends against consequences. It optimizes *expression* but not *transformation* of ends through problem-solving.  
     - **Deeper flaw**: It assumes disagreements are "merely verbal," ignoring substantive conflicts of interest/values that Deweyan inquiry must confront through action.

  ### Why This Saves Dewey From Absurdity
  - **Advertising/propaganda**: Change ends causally but *avoid public testing*. They obscure alternatives, exploit biases, and sever end-formation from accountability to consequences (e.g., an ad sells soda without engaging health trade-offs).  
  - **True inquiry**: Requires participants to confront how ends *fail or succeed* in resolving shared problems (e.g., a community revising recycling goals after seeing landfill impacts).  
  - **No spectator theory**: Standards emerge from the process of doing and suffering, not pre-set criteria. The "test" is whether the situation becomes determinately resolved—a communal, not individual, experience.

  ### What You Keep
  Your core commitments hold:  
  1. Authority derives from inquiry, not pre-fixed ends.  
  2. Ends must be revisable within the process.  
  3. Manipulation is excluded.  
  The cost is clarifying that revision must be *consequence-sensitive* and *participatory*—which is Deweyan, not spectator-based. **Democracy survives as collective experimentation under fallibilism.**
