  However, note that Jeffrey's rule requires that the shift is "rigid", meaning that the conditional probabilities of the evidence given each hypothesis remain the same before and after the shift. If the same evidence that shifts our belief in the hypotheses also changes our assessment of how the evidence relates to the hypotheses (i.e., the likelihoods), then rigidity fails and we cannot apply Jeffrey's rule directly.

  We are constrained to using a spreadsheet and about 30 minutes per case. The team has basic probability training.

