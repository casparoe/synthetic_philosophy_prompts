  Below is a practical procedure for your signal-assessment team, designed for spreadsheet implementation within 30 minutes per case, using British English. The procedure addresses your constraints, incorporates Jeffrey's rule where applicable, and includes explicit handling of judgment calls. Key theory constraints (rigidity, partition definition) are marked as **"Theory Constraint"**; other steps are operationalised judgment calls.

  ---

  ### **Procedure: Probability Update for Pest Establishment**
  **Inputs**: Prior probability \( P_{\text{prior}}(H) \) (pest established), new evidence, expert inputs.  
  **Output**: Updated \( P_{\text{updated}}(H) \) or decision to escalate.  
  **Time Budget**: 25 minutes/case (steps 1–5), 5 minutes for documentation.

  #### **Step 1: Define the Partition** (Judgment Call)  
  - **What to do**:  
    - Identify what the evidence **directly** indicates (e.g., "pest in photo", "sequencing result reliable"). This is the partition \( \{A_1, A_2, ..., A_n\} \), where \( A_i \) are mutually exclusive and exhaustive events.  
    - Grain: Use the finest practical grain (e.g., "photo shows pest" not "pest present in region").  
    - Spread leftover probability: Assign residual probability to a catch-all \( A_{\text{residual}} \) (e.g., "inconclusive/unknown").  
  - **Example**:  
    - Photo evidence → Partition: \( A_1 \)= "Pest correctly IDed in photo", \( A_2 \)= "Photo shows lookalike", \( A_{\text{res}} \)= "Uncertain/other".  
  - **Why**: Jeffrey's rule requires a partition covering all possibilities (**Theory Constraint**).  

  #### **Step 2: Check Shift Usability** (Theory Constraint + Judgment)  
  - **What to do**:  
    - Ask experts: **"Assuming no prior knowledge of pest establishment, what is the probability of [partition event] based ONLY on this evidence?"**  
    - If they cannot answer without referencing regional priors (e.g., "I said 70% because the pest is rare here"), **reject the shift** (double-counting risk).  
    - Useable shift: \( P_{\text{new}}(A_i) \) values summing to 1 (e.g., \( P_{\text{new}}(A_1) = 0.7 \), \( P_{\text{new}}(A_2) = 0.3 \) for the photo).  
  - **Escalate if**: Expert shift folds in regional priors.  

  #### **Step 3: Test for Rigidity** (Theory Constraint)  
  - **What to do**:  
    - Ask: **"Does this evidence change how we interpret future evidence related to \( H \)?"**  
      - *Yes* → Rigidity fails (e.g., new sequencing kit affects all future tests).  
      - *No* → Rigidity holds (e.g., photo ID doesn’t alter lab protocols).  
    - **If rigidity holds**: Apply Jeffrey's rule:  
      \[
      P_{\text{updated}}(H) = \sum_{i} \left[ P_{\text{new}}(A_i) \times P_{\text{prior}}(H \mid A_i) \right]
      \]  
      where \( P_{\text{prior}}(H \mid A_i) \) is from pre-evidence data.  
    - **If rigidity fails**: Use **weighted likelihood ratios** (simplified workaround):  
      1. Estimate \( P(\text{Evidence} \mid H) \) and \( P(\text{Evidence} \mid \neg H) \) from experts.  
      2. Compute posterior odds:  
      \[
      \text{Posterior Odds} = \text{Prior Odds} \times \frac{P(\text{Evidence} \mid H)}{P(\text{Evidence} \mid \neg H)}
      \]  
      3. Convert odds to probability.  
  - **Note**: \( P_{\text{prior}}(H \mid A_i) \) must be pre-existing (e.g., from historical data or calibrated expert estimates).  

  #### **Step 4: Handle Imprecision** (Judgment Call)  
  - **For vague inputs** (e.g., "somewhat more likely"):  
    - Convert to intervals (e.g., "60–80%") → use **midpoint** (e.g., 0.7) for calculations.  
    - Document the range in audit trail.  
  - **Publishing**: If output is a band (e.g., 0.55–0.70), publish the **midpoint** (e.g., 0.63) but note uncertainty in metadata.  

  #### **Step 5: Escalation & Documentation**  
  - **Escalate to senior epidemiologist if**:  
    - Rigidity fails and likelihoods unavailable (Step 3).  
    - Shift unusable (Step 2).  
    - Partition >3 events (time constraint).  
  - **Document**:  
    - Partition, shift values, rigidity test, \( P_{\text{prior}}(H \mid A_i) \), calculations.  
    - **Mark judgment calls**: Partition grain, residual probability, midpoint choices.  
    - **Mark theory constraints**: Rigidity test, shift usability.  

  ---

  ### **Case Applications**
  **Prior Note**: All cases start from \( P_{\text{prior}}(H) = 0.15 \) unless stated.  
  **Spreadsheet Setup**: Columns for \( A_i \), \( P_{\text{new}}(A_i) \), \( P_{\text{prior}}(H \mid A_i) \), and \( P_{\text{new}}(A_i) \times P_{\text{prior}}(H \mid A_i) \). Sum last column for \( P_{\text{updated}}(H) \).

  #### **Case 1: Pathologist's Photo (70% ID Confidence)**  
  - **Step 1 (Partition)**:  
    - \( A_1 \): Pest correctly IDed (\( \text{Grain} \): Photo content).  
    - \( A_2 \): Photo shows lookalike.  
    - \( A_{\text{res}} \): Photo unusable (residual, \( P_{\text{new}} = 0.0 \) here).  
  - **Step 2 (Shift Usability)**:  
    - Pathologist’s 70% is **usable** only if based solely on photo morphology (e.g., "70% match to pest features").  
    - Shift: \( P_{\text{new}}(A_1) = 0.7 \), \( P_{\text{new}}(A_2) = 0.3 \).  
  - **Step 3 (Rigidity)**:  
    - Rigidity **holds** (photo doesn’t alter future evidence interpretation).  
    - Pre-evidence \( P_{\text{prior}}(H \mid A_i) \) required:  
      - Historical data: If pest IDed in photo, \( P_{\text{prior}}(H \mid A_1) = 0.85 \) (ID usually implies establishment).  
      - If not, \( P_{\text{prior}}(H \mid A_2) = 0.10 \) (lookalikes rarely linked to outbreaks).  
    - Calculation:  
      \[
      P_{\text{updated}}(H) = (0.7 \times 0.85) + (0.3 \times 0.10) = 0.595 + 0.03 = 0.625 \approx 0.63
      \]  
  - **Publish**: **0.63** (justifies jump from 0.15 to 0.6).  
  - **Judgment Calls**: Partition grain, \( P_{\text{prior}}(H \mid A_i) \) estimates.  
  - **Theory Constraints**: Shift usability, rigidity.  

  #### **Case 2: Partial Sequencing Run (New Sensitive Kit)**  
  - **Context**: Prior \( P_{\text{prior}}(H) = 0.40 \) (after grower report). Lab kit changed mid-test.  
  - **Step 1 (Partition)**:  
    - \( A_1 \): Sample is true positive.  
    - \( A_2 \): Sample is false positive (new kit may increase contamination risk).  
    - \( A_{\text{res}} \): Inconclusive (e.g., degradation; \( P_{\text{new}} = 0.05 \)).  
  - **Step 2 (Shift Usability)**:  
    - Expert estimates \( P_{\text{new}}(A_1) = 0.85 \) (sample valid). **Reject** if this folds in regional priors. Assume usable.  
  - **Step 3 (Rigidity)**:  
    - **Rigidity fails**: New kit affects interpretation of all results (higher sensitivity → more false positives).  
    - **Alternative (weighted likelihood)**:  
      - Estimate from lab:  
        - \( P(\text{SeqResult} \mid H) = 0.95 \) (new kit detects true positives).  
        - \( P(\text{SeqResult} \mid \neg H) = 0.30 \) (new kit has 30% false-positive rate).  
      - Prior odds: \( \frac{0.40}{1-0.40} = 0.666 \).  
      - Likelihood ratio: \( \frac{0.95}{0.30} = 3.167 \).  
      - Posterior odds: \( 0.666 \times 3.167 = 2.11 \).  
      - \( P_{\text{updated}}(H) = \frac{2.11}{1 + 2.11} = 0.68 \).  
  - **Publish**: **0.68** (unwelcome but method-compliant).  
  - **Judgment Calls**: Likelihood estimates, partition.  
  - **Theory Constraints**: Rigidity failure forces alternative method.  

  #### **Case 3: Three Soft Items**  
  - **Items**: (1) Neighbouring-country report, (2) Degraded trap specimen (ID to genus), (3) 200 empty traps.  
  - **Approach**: Treat items sequentially. Cumulative update.  
    - **Start**: \( P_{\text{prior}}(H) = 0.15 \).  
  - **Item 1: Press report**  
    - **Partition**: \( A_1 \)= Report credible, \( A_2 \)= Report false. Residual: Unclear (\( P_{\text{new}} = 0.1 \)).  
    - Shift: \( P_{\text{new}}(A_1) = 0.6 \) (machine translation uncertainty), \( P_{\text{new}}(A_2) = 0.3 \).  
    - Rigidity **holds** (report doesn’t alter future evidence).  
    - \( P_{\text{prior}}(H \mid A_1) = 0.50 \) (if credible, higher establishment risk), \( P_{\text{prior}}(H \mid A_2) = 0.10 \).  
    - Update: \( (0.6 \times 0.50) + (0.3 \times 0.10) + (0.1 \times 0.15) = 0.30 + 0.03 + 0.015 = 0.345 \).  
  - **Item 2: Degraded specimen**  
    - **Partition**: \( A_1 \)= Specimen is pest, \( A_2 \)= Not pest.  
    - Shift: Expert says "somewhat more likely" → interval \( [0.6, 0.8] \) → **midpoint 0.7** for \( P_{\text{new}}(A_1) \).  
    - Rigidity **holds** (specimen ID doesn’t affect future tests).  
    - \( P_{\text{prior}}(H \mid A_1) = 0.70 \), \( P_{\text{prior}}(H \mid A_2) = 0.25 \).  
    - Update: \( (0.7 \times 0.70) + (0.3 \times 0.25) = 0.49 + 0.075 = 0.565 \).  
  - **Item 3: 200 empty traps**  
    - **Partition**: \( A_1 \)= Pest absent, \( A_2 \)= Pest present but undetected.  
    - Shift: Based on trap sensitivity. Assume \( P_{\text{new}}(A_1) = 0.2 \) (low, since traps may miss pests).  
    - Rigidity **holds**.  
    - \( P_{\text{prior}}(H \mid A_1) = 0.01 \), \( P_{\text{prior}}(H \mid A_2) = 0.65 \).  
    - Update: \( (0.2 \times 0.01) + (0.8 \times 0.65) = 0.002 + 0.52 = 0.522 \).  
  - **Final \( P_{\text{updated}}(H) \): 0.52** (after all items).  
  - **Publish**: **0.52** (midpoint of final band 0.50–0.54).  
  - **Judgment Calls**: Sequential update, interval midpoints, \( P_{\text{prior}}(H \mid A_i) \) estimates.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Handle non-rigid updates without likelihood estimates**: If rigidity fails and experts cannot provide \( P(\text{Evidence} \mid H) \), escalation is mandatory.  
  2. **Resolve deeply interdependent evidence**: E.g., evidence that simultaneously updates \( H \) and the reliability of other evidence streams (beyond 30-minute scope).  
  3. **Eliminate subjectivity**: Judgment calls (partition, \( P_{\text{prior}}(H \mid A_i) \)) are unavoidable but documented.  
  4. **Fully replace expert deliberation**: Complex cases (e.g., novel pests, geopolitical events) require senior epidemiologist input.  
  5. **Infer priors from scratch**: \( P_{\text{prior}}(H \mid A_i) \) must be pre-existing or estimated from historical data.  

  ---  
  **Final Advice**: Use this procedure as a standardised audit trail. It formalises 80% of updates mechanically, flags 20% for escalation, and satisfies reviewers with transparent theory/judgment demarcation. Train your team on partition definition and rigidity testing—these are the linchpins.
