  1. **Define the partition**: We must decide on a set of mutually exclusive and exhaustive events (the partition) that the evidence directly bears upon. The evidence does not directly bear on the main hypothesis (e.g., pest established) but on some intermediate event. For example, for the photograph, the partition might be {Pest present in the photo, Pest not present in the photo}. We then have to relate this partition to the main hypothesis (pest established in the region). The leftover probability (if the partition does not cover everything) must be handled by making the partition exhaustive.

  2. **Check the shift for usability**: We must ensure that the expert's probability (e.g., 70% for the photo) is not already incorporating prior knowledge about the main hypothesis. If it is, then using it as the shift would double-count. We need a shift that is about the evidence itself, conditional only on what we know about the evidence (not folding in the prior about the pest being established). We may have to extract from the expert a conditional probability (e.g., "If the pest were present at the site, what is the chance the photo would show it?") but note that Jeffrey updating uses the posterior probabilities of the partition, not the likelihoods.

     Actually, Jeffrey's rule updates by directly setting new probabilities for the partition. So we set P*(A) for each element A in the partition. The rule then updates the probability of any event B (like the pest being established) by:
        P*(B) = sum_i P*(A_i) * P(B | A_i)

     But note: the conditional probabilities P(B | A_i) must remain the same as before the update. This is the rigidity condition.

