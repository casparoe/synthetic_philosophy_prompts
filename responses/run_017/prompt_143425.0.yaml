  ### **Candidate 2: Lexical Harm Minimization (Prioritarianism)**
  **Principle**:  
  ```python
  def compare(outcome_A, outcome_B):
      # Convert outcomes to sets of harms, sorted worst-first
      harms_A = sorted([harm_level(h) for h in outcome_A], reverse=True)
      harms_B = sorted([harm_level(h) for h in outcome_B], reverse=True)
      
      # Compare lexically: worst harm, then second-worst, etc.
      for a, b in zip(harms_A, harms_B):
          if a < b: return "prefer A"
          elif b < a: return "prefer B"
      # If one outcome has extra harms, the shorter list wins
      if len(harms_A) < len(harms_B): return "prefer A"
      elif len(harms_B) < len(harms_A): return "prefer B"
