      risk_A = {person: expected_harm(outcome_A, person) for person in all_affected}
      risk_B = {person: expected_harm(outcome_B, person) for person in all_affected}
      
      # Ex Ante Pareto: If everyone has lower risk in A, prefer A
      if all(risk_A[p] <= risk_B[p]) and some(risk_A[p] < risk_B[p]):
          return "prefer A"
      elif all(risk_B[p] <= risk_A[p]) and some(risk_B[p] < risk_A[p]):
