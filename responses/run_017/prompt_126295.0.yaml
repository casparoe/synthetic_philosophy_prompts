  For the événement section (one night), I focus on Aris, a farmer facing a flood. His decision to cut the channel must feel urgent and justified, with sensory details (rain, mud, his daughter's safety) to ground his agency. No irony—readers should believe his choice matters. Then conjoncture (lifetime): show consequences—legal battles, economic shifts, demographic changes—without Aris as the hero. Finally, longue durée (10,000 years): zoom out to geological time, where the human drama is a blip, yet the channel reshapes the delta. 

  The afterword requires taking a stance: which timescale is causally decisive? I'll argue conjoncture (economic/demographic cycles) because the flood and litigation trigger migration that alters the region's fate, while longue durée explains why the delta was vulnerable but not the specific outcome. The gap: conjoncture can't capture Aris's desperation—the événement's emotional weight. 

