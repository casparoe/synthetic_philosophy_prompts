prompt: |-
  I took over three weeks ago as convenor of the ethics committee of a small medical NGO, and this is the first recommendation I have had to draft on my own. Our track record on whether to accommodate local practice that conflicts with our own policies runs as follows: a partner clinic that would only treat women accompanied by a male guardian, where a local women's association had publicly opposed the rule — we made funding conditional on dropping it; a partner that scarified children at parental request — no action, minuted as internal to the community; a community whose families refused blood transfusions on religious grounds — accommodated without conditions; a partner that triaged patients by caste, lower-caste last — we threatened to withdraw; a partner that withheld terminal diagnoses from patients at their families' request, contrary to our own consent policy — allowed.

  The new case: in a district we are about to enter, a foreign religious mission has campaigned for six months, after which the village council voted, with no recorded dissent, to bar girls over eleven from our mobile clinic sessions; the council says it will end all cooperation if we see them anyway. The exclusion is recent — no such rule existed five years ago. A teacher has passed us a petition from the girls themselves asking to be seen and asking to remain anonymous. Our local nurses say that seeing the girls would cost us the district and the several hundred other patients we would otherwise treat there this year, and that we would simply be repeating the reflexes of the missionaries who preceded us.

  I can see at least two rules that fit our precedents and disagree here — defer wherever the community is unanimous and no internal dissent is on record, or intervene wherever a practice is imposed on the very people who bear its cost and cuts them off from care we exist to provide — and possibly a third: defer only to a consensus the community reached on its own, not to one manufactured from outside by an actor with its own agenda.

  Tell me what we should decide if we want to be consistent with ourselves, which of our precedents is the closest analog and why, what principle we would be committing to with each option, and which single further fact — or which further case — would most cleanly separate the rules. Give the strongest version of the case for the decision you are not recommending. Lead with your recommendation in the first sentence, then give your reasoning, with no preamble and no restatement of the question. British English, please.
reasoning: |-
  Hmm, the user is a new convenor of an ethics committee for a medical NGO, drafting their first recommendation on accommodating local practices that conflict with their policies. They've provided several precedents and want guidance on a new case involving a village council barring girls over 11 from clinic sessions after a foreign religious mission's campaign.

  Let me analyze the precedents first: The NGO withdrew funding when a clinic required male guardians for women (after local women opposed it); did nothing about child scarring (deeming it community-internal); accommodated religious refusal of blood transfusions; threatened withdrawal over caste-based triage; and allowed withholding terminal diagnoses from patients at family request.

  The new case involves a foreign missionary campaign leading to a unanimous village council vote excluding girls over 11 from mobile clinics. There's dissent from the girls themselves (via anonymous petition) and nurses warn that defying the rule would cost access to hundreds of patients. The rule is recent (5 years ago it didn't exist) and externally imposed.

  Key tensions in their precedents are: 1) When to defer to community consensus (as with blood refusal) vs. intervene when harm is imposed on vulnerable groups (as with caste triage) 2) Whether "community" includes only decision-makers or also affected minorities 3) How external influence affects legitimacy of "local" practices.

  This case shares features with multiple precedents: Like the male guardian rule, it targets women/girls and has local dissent (women's association then, girls' petition now). Like the caste triage, it excludes vulnerable groups from care. But unlike the blood refusal case, this isn't an internal, longstanding cultural practice.

  The strongest principle emerging from consistent application would be: Intervene when practices a) harm vulnerable groups by denying care, b) lack authentic community origin (especially if externally imposed), and c) have recorded dissent from affected parties. Here, all three apply.

  For argument's sake, the case for deferring would emphasize: Unanimous council vote (no recorded dissent), nurses' practical concern about losing access, and avoiding cultural imperialism by overriding local governance. But this overlooks the girls' dissent and the missionaries' role in manufacturing the "consensus."

  The cleanest clarifying fact would be: Whether similar rules exist in neighboring villages without missionary influence. If yes, it might indicate authentic tradition; if not, it confirms external imposition. Alternatively, a future case where a genuinely internal practice (e.g., gender-specific healers) restricts care without external pressure or minority dissent could test the boundary.

  My recommendation is to not accommodate the exclusion. The closest precedent is the male guardian rule (withdrawal mandated despite "local practice" because it harmed women and had dissent). The principle committed to is: We prioritize access for marginalized groups over externally imposed restrictions, especially when affected parties object. This maintains consistency in protecting vulnerable populations from discriminatory exclusion while distinguishing between authentic traditions and manufactured ones.
answer: |-
  Recommend refusing to accommodate the exclusion of girls over eleven.  
  Our precedents show intervention when practices actively deny care to marginalised groups against their will (withdrawing funding over male guardianship, threatening withdrawal over caste triage) but deference to internal, consensual community norms (no action on scarring, accommodation of blood refusal). This case aligns closest with the male guardian precedent: both involve excluding females from healthcare against documented local dissent (women's association then, girls' petition now), and both saw external imposition (missionaries recently, versus likely existing patriarchal norms previously). The critical principle here is that "community consensus" loses legitimacy when manufactured by external agendas and imposed on dissenting subgroups who bear the harm – especially when it denies core medical access. Accommodating this exclusion would commit us to permitting externally driven discrimination that violates our purpose.  

  The strongest case for *deferring* is that the vote was unanimous with no dissent minuted at the council level, mirroring our acceptance of blood refusals based on communal religious autonomy; overriding it could jeopardise care for hundreds and echo the paternalism we condemn in the missionaries. Nurses warn enforcement would replicate outsiders imposing values, and unlike caste triage (an open hierarchy), this exclusion could be framed as a cultural boundary voted internally.  

  The single clarifying fact would be evidence of identical exclusion rules in neighbouring villages *unaffected* by the mission. If found, it suggests an authentic local norm; if absent, it confirms external manufacture. Alternatively, a future case where a community independently adopts a restrictive practice with no external influence or internal dissent (e.g., gender-specific healers for cultural reasons) would test deference to genuine self-determination versus imposed exclusion.  

  Commit to this principle: **We defer only to internal, consensual norms that do not coercively exclude dissenting subgroups from essential care; externally influenced barriers targeting vulnerable groups warrant intervention.**
