answer: |-
  Here’s a complete exam package tailored to your specifications. It focuses on Hume’s temporal tension while avoiding technical jargon, with clear grading boundaries and a model answer addressing the "interval" paradox.

  ---

  ### **Exam Question**  
  **(Total: 20 marks)**  
  **Part (a)** (5 marks)  
  In David Hume’s *Political Discourses* (1752), what is the *price-specie flow mechanism*? Summarise its operation and ultimate outcome in 150–200 words.  

  **Part (b)** (15 marks)  
  Hume argues that a temporary influx of gold stimulates industry during the "interval" before prices adjust. Yet he insists this influx cannot permanently enrich a nation, as money eventually flows out. Critically evaluate whether Hume’s acknowledgment of short-term stimulation undermines his rejection of mercantilism. In your response, consider:  
  - How does Hume’s theory of habit (from his psychological works) complicate the idea that the economy returns unchanged to its pre-influx "steady state"?  
  - Does the "interval" merely reset the system, or could it leave enduring effects?  

  *(800 words total for both parts)*  

  ---

  ### **Model Answer** (650 words)  
  **Part (a)**  
  Hume’s price-specie flow mechanism describes how money supply self-regulates international trade. When a nation gains gold (e.g., via a trade surplus), its money supply increases. Initially, this boosts spending and employment. However, rising demand soon inflates prices, making exports costlier and imports cheaper. Gold then flows out to purchase cheaper foreign goods, reducing the money supply until prices fall and trade rebalances. Hume concludes that money cannot permanently enhance wealth, as its quantity globally is fixed; it merely "quicksilver" redistributes itself. Thus, mercantilist efforts to hoard gold are futile.  

  **Part (b)**  
  Hume’s account seems contradictory: he dismisses mercantilism by asserting money’s long-term neutrality, yet grants that gold inflows *temporarily* stimulate industry. This tension hinges on whether the "interval" of stimulation leaves lasting traces. If the economy resets entirely, Hume concedes the mercantilist claim that money boosts activity—just not permanently. If the stimulation alters economic habits, however, Hume’s long-run equilibrium may not be static. His psychology of custom suggests the latter, creating unresolved friction in his model.  

  Hume’s rejection of mercantilism rests on money’s neutrality: gold inflows inflate prices but cannot increase real output or "art and industry" perpetually (*Of Money*). Yet he admits that during the lag between money influx and price inflation, "a nation has a superiority" as "cheapness of labour" attracts foreign buyers (*Of the Balance of Trade*). This interim boost seems to validate mercantilist instincts: more money *does* energise the economy. Mercantilists err only in ignoring the subsequent outflow.  

  Here, Hume’s psychology complicates matters. In *A Treatise of Human Nature*, he argues habits and customs shape behaviour: repeated actions become ingrained tendencies. Applied to economics, the "interval" of high demand could forge new commercial habits. Artisans, flush with orders, might innovate or expand skills; workers might enter new trades. Once established, these habits persist *even after money flows out*. Hume notes that industry, once roused, "begets ability" (*Of Commerce*). This implies the short-term surge could durably enhance productivity, nudging the economy to a *new* equilibrium with higher output—not merely resetting it.  

  Hume’s framework thus contains a paradox. His economics treats the interval as a self-cancelling aberration, while his psychology suggests it could seed lasting change. He never reconciles this. One defence is that Hume saw the stimulation as inherently fragile: without fundamental improvements (e.g., technology), habits regress when money departs. Yet his example of industrious nations retaining superiority despite money outflows (*Of the Jealousy of Trade*) hints at path-dependency.  

  Ultimately, Hume’s concession to short-term stimulation does not vindicate mercantilism. Mercantilists sought *state-enforced* accumulation to *perpetually* skew trade balances. Hume shows that market forces nullify such efforts automatically. More profoundly, he argues that real wealth springs from productivity, not money—and the interval’s value lies in catalysing industry, not amassing specie. The unresolved tension between his dynamic psychology and static equilibrium, however, suggests the "interval" might subtly reshape economies. Hume’s system thus refutes mercantilist policy but leaves room for money’s transient power to alter human enterprise.  

  ---

  ### **Marking Scheme** (Total: 20 marks)  
  **Part (a) - Summary of Mechanism** (5 marks)  
  - **✓ (1 mark)** Identifies money inflow → price rise → export loss → specie outflow.  
  - **✓ (1 mark)** Notes short-term stimulus before prices adjust.  
  - **✓ (1 mark)** Explains long-run neutrality (money ≠ wealth).  
  - **✓ (1 mark)** Links to self-correction of trade balance.  
  - **✓ (1 mark)** Contrasts Hume with mercantilist hoarding.  
  ▶ *Common errors:* Vague restatements of "money isn’t wealth" (lose 3–4 marks); omitting price adjustments (max 2/5).  

  **Part (b) - Critical Evaluation** (15 marks)  
  **Must-hit points:**  
  1. **Tension identified** (3 marks):  
     - Hume’s interval *concedes* short-term gain to mercantilists but denies permanence.  
     ▶ *Error:* Only describing the mechanism without juxtaposing short/long-term effects.  
  2. **Habit psychology applied** (4 marks):  
     - Uses Hume’s theory of custom (*Treatise*) to argue habits formed during stimulus may endure.  
     ▶ *Error:* Ignoring psychology or failing to cite Hume’s "habit begets ability" logic.  
  3. **Equilibrium critique** (3 marks):  
     - Questions if post-outflow state is identical to pre-influx state (e.g., skills, networks).  
     ▶ *Error:* Assuming automatic reset without examining behavioral change.  
  4. **Mercantilism rebutted** (3 marks):  
     - Despite short-term effects, Hume shows mercantilist policy futile due to automatic outflow.  
     ▶ *Error:* Concluding Hume "agrees" with mercantilists.  
  5. **Original synthesis** (2 marks):  
     - Weighs evidence for/against enduring change (e.g., industry "superiority" post-outflow).  
     ▶ *Error:* No critical resolution; mere summary.  

  **Modern references:**  
  - **✓ Reward (1–2 marks)** if used *sparingly* to illuminate Hume (e.g., "2008 QE parallels Hume’s interval but fiat money breaks specie flow").  
  - **✗ Penalise** if dominant or anachronistic (e.g., "Hume failed to foresee central banks").  

  **Grade boundaries:**  
  - **A (17–20):** Hits all 5 must-hit points; resolves psychology/economics tension.  
  - **B (13–16):** Identifies tension + habit psychology but weaker synthesis.  
  - **C (9–12):** Describes mechanism + tension but omits habit or equilibrium critique.  
  - **D (5–8):** Basic mechanism summary only (no critical engagement).  
  - **E (0–4):** Incomplete/inaccurate.  
  ▶ **Pure mechanism recitation:** Max 8/20 (low 2:2).  

  ---

  ### **Footnote: Control-Theory Mapping**  
  *For your reference only—not included in student materials:*  
  - **Lag:** Hume’s "interval" (money influx → price rise delay).  
  - **Transient:** Stimulation phase (industry "quickened" pre-outflow).  
  - **Steady state:** Pre/post-equilibrium (neutral money; trade balanced).  
  - **Permanent mark:** Path-dependency via habits (shifts steady state).  

  This structure ensures only students grappling with Hume’s texts and internal tensions can score highly, while the marking scheme explicitly rewards engagement with the habit-stimulus paradox you identified. The model answer demonstrates how to weave psychology into economic analysis—a bridge your biologists’ instincts spotted!
