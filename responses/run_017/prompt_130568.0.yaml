  First, I need to design an activity that forces students to confront the difficulties in formulating a consistent rule for composition. The user mentioned a certification panel setup where groups create rules, then challenge each other's rules with cases. Key elements include a case pool that targets the "comfortable middle," a squeeze round to pinpoint where composition starts/ends, and making brute fact views a valid option.

  The user's explicit needs: avoid tech, use index cards, 75-minute session, 16 students. They want students to feel that commonsense is unstable and each alternative has costs. They also mentioned potential issues like vague criteria ("interesting") or gerrymandered rules winning without learning.

  Digging deeper, the user likely wants students to engage with metaontology—questioning whether SCQ has an answer or if ontology is conventional. They might want students to appreciate the philosophical debate beyond just memorizing positions. The activity should make abstract problems tangible through interactive challenges.

  I should structure the session into phases: introduction, rule creation, adversarial challenges, squeeze rounds, and debrief. The case pool needs carefully crafted examples that blur lines—near-life cases, almost-mechanisms. Constraints like no proper names or indexicals are crucial to prevent cheating.

  For the case pool, include classics (particles, cat, scrap heap) and edge cases (near-organism, barely functional). The data sheet should have fields like bonding strength, function, life, to force explicit criteria. The squeeze round requires sequences, like gradual assembly of a chair or near-life systems.

  Scoring should incentivize precision. Maybe groups wager tokens on challenges, losing tokens if their rule fails. This adds stakes without being punitive. The debrief must highlight how each solution (universalism, nihilism, brutalism) has costs, and why commonsense is hard to defend.

  Anticipated problems: Groups might create vague rules. Solution: enforce strict constraints during rule submission. Someone might derail into persistence over time. Solution: explicitly forbid it unless part of the design (it's not here). Gerrymandered rules winning: scoring should penalize complexity or reward elegance, but the user wants the activity to naturally show instability, so maybe let gerrymandered rules fail under squeeze rounds.

  Unavoidable issues: Vagueness and quantifier variance can't be fully explored in this activity. The instructor will need to address these in debrief. Also, the activity assumes composition isn't vague, which is contested. Flag this assumption.

  Finally, the deliverable: timeline, roles, materials, case pool schema, scoring, debrief points. Use British English. Ensure each part serves the pedagogical goal—making the problem visceral and the philosophical stakes clear.
answer: |-
  Here’s a structured seminar plan designed to make the instability of commonsense composition palpable. It leans on peer pressure, adversarial testing, and gradual case variation to expose fault lines. The key twist: **the "comfortable middle" is attacked not by extremism but by its own internal tensions**.

  **Core Idea:** Students act as **Composition Standards Bureau (CSB) Committees**. Each designs a rule for when composition occurs, then *defends it against engineered counterexamples* and *tests it against borderline sequences*. The game mechanics force explicit commitments.

  ---

  ### **Rules & Roles**
  - **Groups:** 4 committees of 4 students each (total 16).
  - **Task 1 (Rule Drafting):** Each committee drafts a **general compositional rule** (≤ 1 index card side). Constraints:  
    `NO proper names, NO indexicals (e.g., "here", "I"), FINITE length, ONE rule for ALL cases, MUST output YES/NO.`  
  - **Task 2 (Adversarial Challenge):** Committees swap rules. Each gets **2 Challenge Tokens** (e.g., coloured paper clips). They must generate **2 cases** (using the Data Sheet schema below) where the *opposing rule fails* (e.g., says YES to junk/no to table). Successful challenge costs the *defending* committee a token. Tokens = chocolate stakes.  
  - **Task 3 (Squeeze Rounds):**  
    - **Border Patrol:** If a rule says YES to Case A and NO to Case B, committees must locate the switch-point in a **graded sequence** (e.g., 5 cases between a cat and scrap heap). Failure costs a token.  
    - **Single-Feature Test:** Committees name **ONE data-sheet feature** justifying a YES/NO distinction. Instructor then supplies a case differing *only* in that feature by a minimal margin. Rule failure costs a token.  
  - **Winning:** Committee with most tokens kept. *Emphasis on survival, not "correctness".*

  ---

  ### **Materials**
  - **Index Cards:** For rules (1 per committee).  
  - **Data Sheets (Pre-Printed on Cards):** 12-16 cases (see pool below). Each lists:  
    ```
    CASE NAME: [e.g., "Bonded Pair"]  
    PARTS: [e.g., "2 oxygen atoms"]  
    RELATIVE POSITIONS: [e.g., "fixed, 0.12nm apart"]  
    BONDING STRENGTH: [1-10 scale, 10=covalent bond]  
    FUNCTIONAL UNITY: [1-10 scale, 10=clearly serves a purpose]  
    LIVING: [YES/NO]  
    CONSCIOUS: [YES/NO]  
    MASS (kg): [e.g., "5.3e-26"]  
    OBSERVED BEHAVIOUR: [e.g., "moves as one unit when force applied"]  
    ```  
  - **Challenge Tokens:** 8 total (2 per committee).  
  - **Graded Sequence Cards:** Pre-made chains of 5 intermediate cases (see examples below).  
  - **Whiteboard:** Track tokens, display key rule failures.  

  ---

  ### **Case Pool** (12 cases + 4 graded sequences)  
  *Design Principle: Commonsense "YES" cases decay into "NO" cases via imperceptible steps; commonsense "NO" cases resemble "YES" cases under slight perturbation.*  

  1. **Bonded Pair:** 2 oxygen atoms (O₂ molecule). Positions: fixed. Bonding: 10. Functional Unity: 1. Living: NO.  
  2. **Quartz Crystal:** Silicon dioxide lattice. Positions: fixed grid. Bonding: 9. Functional Unity: 1. Living: NO.  
  3. **Granite Rock:** Interlocked mineral grains. Positions: fixed. Bonding: 7 (friction). Functional Unity: 1. Living: NO.  
  4. **Wooden Chair:** Legs, seat, back nailed. Positions: fixed. Bonding: 6. Functional Unity: 10. Living: NO.  
  5. **Domestic Cat:** Cells, organs. Positions: dynamic cohesion. Bonding: 8. Functional Unity: 10. Living: YES.  
  6. **Scrap Heap:** Car parts in junkyard. Positions: touching, unmoving. Bonding: 2 (gravity). Functional Unity: 1. Living: NO.  
  7. **Nose + Eiffel Tower:** Your nose + Parisian iron lattice. Positions: 350km apart. Bonding: 1. Functional Unity: 1. Living: NO.  
  8. **Near-Life System:** Protocell (self-assembling lipids, no replication). Positions: cohesive. Bonding: 8. Functional Unity: 6. Living: NO *(controversial!)*.  
  9. **Almost-Chair:** Chair parts leaning, no fasteners. Positions: touching, unstable. Bonding: 3. Functional Unity: 8. Living: NO.  
  10. **Cat + Parasite:** Cat with attached tick. Positions: fixed contact. Bonding: 5 (embedding). Functional Unity: ? Living: YES (cat), NO (tick).  
  11. **Planetary System:** Sun + planets. Positions: stable orbits. Bonding: 4 (gravity). Functional Unity: 1. Living: NO.  
  12. **Cloud Chamber Droplet:** Water molecules in condensation trail. Positions: cohesive, dynamic. Bonding: 5. Functional Unity: 1. Living: NO.  

  **Graded Sequences (for Border Patrol):**  
  - **Cat-to-Heap:** Healthy cat → Cat with prosthetic leg → Cat skeleton → Pile of cat bones → Scrap heap.  
  - **Chair-to-Pile:** Intact chair → Chair with loose leg → Disassembled chair parts in box → Parts scattered on floor → Random wood scraps.  
  - **Life-to-Nonlife:** Cat → Brain-dead cat body → Beating heart in vat → Protocell → Crystallising salt.  
  - **Contact-to-Scattered:** Hand gripping apple → Apple resting on hand → Apple beside hand → Apple across room → Apple on Moon.  

  ---

  ### **Timeline (75 mins)**  
  **0-10 mins: Setup & Briefing**  
  - Explain SCQ: "When do Xs compose a Y? van Inwagen: only when activity of a life."  
  - Introduce CSB game: "You’re bureaucrats setting *one rule* for what counts as a single object. No cheating with ‘it depends’!"  
  - Assign groups, distribute data sheets, explain rules/tokens.  

  **10-25 mins: Rule Drafting**  
  - Groups devise rules (1 index card). Circulate, enforce constraints: *"Can a clerk apply this without interpretation?" "Is ‘interesting’ measurable?"*  
  - *Predictable Issue:* Vague rules ("if unified"). Push: *"Define ‘unified’ using data sheet fields."*  

  **25-35 mins: Rule Swap & Challenge Prep**  
  - Groups swap rules. Each devises 2 adversarial cases using blank data sheets.  
  - *Predictable Issue:* "Life" as sole criterion. Good! Let it be tested.  

  **35-50 mins: Adversarial Challenge**  
  - Committees present challenges. Defender must apply *their own rule* mechanically. If rule fails (inconsistent/absurd output), defender loses token. Award tokens to challenger.  
  - *Key Moment:* When a rule says YES to Nose+Tower (cost: absurdity) or NO to chair (cost: nihilism).  

  **50-65 mins: Squeeze Rounds**  
  - **Border Patrol:** "You said YES to Cat, NO to Scrap Heap. *Where* in this sequence does it stop composing?" Force a transition point. Failure → lose token.  
  - **Single-Feature Test:** "You said Cat composes because it’s LIVING. Here’s a NEAR-LIFE system (identical data except Living:NO). Does it compose?" Rule failure → lose token.  
  - *Key Moment:* When a 1-point change on a scale (e.g., Bonding:6→5) "destroys" an object.  

  **65-75 mins: Debrief & Stakes**  
  - Tally tokens, distribute chocolate. Then:  
    - "Which rules survived? What did they *cost*?" (e.g., "Accepting all functional unities → Nose+Tower?")  
    - "Did anyone’s rule handle the graded sequences smoothly?" (Doubtful! Point out arbitrariness.)  
    - "Did ‘Life’ work? What about the Near-Life case?"  
    - **Dialectic Map:**  
      - *Adversarial Challenge* → Makes universalism/nihilism costs visceral.  
      - *Border Patrol* → Exposes vagueness in commonsense categories.  
      - *Single-Feature Test* → Shows susceptibility to sorites/slippery slopes.  
    - "The ‘comfortable middle’ needs *boundaries*. But drawing them precisely crumbles. van Inwagen draws his at life – but is that less arbitrary?"  

  ---

  ### **Handling Predictable Issues**  
  - **"It composes iff it does something interesting":** Enforce data fields: *"Define ‘interesting’ using *measurable* properties (e.g., Functional Unity >5?). If not, your clerk can’t apply it."* Later, challenge with a *boring* organism (slime mould) vs. *interesting* non-organism (solar flare).  
  - **Gerrymandered rules winning:** The squeeze rounds punish disjunctive rules. A rule saying "YES if (Bonding>8 OR Functional Unity>7 OR Living)" will fail catastrophically in graded sequences (e.g., Bonding=8.1 → 8.0). *Survival favours simplicity*.  
  - **Ship of Theseus derail:** Pre-empt: *"Today, we're asking ‘Is there a ship *now*?’, not ‘Is it the *same* ship?’."* If raised: *"Freeze time! Is there one ship in this instant?"*  

  ---

  ### **What the Activity Can’t Stage (Requires Instructor Voice)**  
  1. **Vagueness:** The activity *assumes* composition is not vague (rules output YES/NO). *Flag:* "van Inwagen thinks it's sharp; some (e.g., Rosen & Smith) argue it’s vague. Our game forces sharp rules – but is that realistic?"  
  2. **Quantifier Variance:** Assumes "object" has one fixed meaning. *Flag:* "Hirsch argues ‘object’ is context-relative. Our Bureau pretends it’s not – but maybe the pressure comes from ignoring this?"  
  3. **Ontological Innocence:** The game treats composition as a *factual* question. *Flag:* "Lewis thinks sums are ‘innocent’; van Inwagen disagrees. Our rules assume there’s a fact to be found."  
  4. **Brute Fact View:** The game makes brutalism look lazy. *Mitigate:* In debrief, validate: "Some philosophers (e.g., Merricks) say composition *has* no general rule – each case is brute. Could that be right, or is it a cop-out?"  

  ---

  ### **Why This Works**  
  - **Pressure from Structure:** Students *create* the rules, then *suffer* their consequences. The squeeze rounds make arbitrariness undeniable.  
  - **Commonsense Sags:** Graded sequences between cats/heaps and chairs/piles make the middle ground feel unstable. Near-life cases challenge van Inwagen’s boundary.  
  - **Brutalism Legitimised:** By showing *all* general rules fail, the brute fact view emerges as a serious (if costly) option.  
  - **British English:** Sorted.  

  This turns abstract metaphysics into a visceral puzzle. The game doesn’t solve SCQ – it makes students *feel* why it’s a problem. Good luck!
