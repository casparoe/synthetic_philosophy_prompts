prompt: |-
  hey — i'm in a seminar on AI safety this term (it's cross listed between CS and philosophy) and we each have to do a 10 minute presentation next week. mine's on process-based vs outcome-based supervision, and i really don't want to do the standard thing where you point out that outcome supervision gives a sparse signal and process supervision catches reasoning mistakes that a correct final answer can hide. everyone's doing that one. so what i need is a case.

  here's the shape of the argument i want to make: even if your step-level grader is genuinely *good* — accurate, correctly flagging steps that really are bad by any local standard, nobody is fooling it, the raters aren't rushed or underpaid or working from a rubric that's obviously wrong — process supervision can still lose to outcome supervision, because the grader only ever sees the steps up to the current one (it has to be prefix-conditioned, that's what makes step-level credit assignment possible at all), so it can only reward steps that are endorsable *right there*, while the strategy you actually want the policy to learn has to pass through waypoints that look bad in isolation. i've started calling this the endorsability bottleneck: the set of trajectories every prefix of which is locally endorsable is a strict subset of the trajectories that are optimal at the horizon you actually care about. that's the crux i want to make vivid, so build me a case for it.

  specs:

  - realistic and present-day. i was thinking an LLM teaching assistant in a big intro course — intro stats or intro programming, a couple thousand students, homework help, the kind of thing a university could actually deploy next year. use that if you want, or something better, but no sci-fi, no fully autonomous agents in ten years, and no model that is secretly deceptive or scheming.
  - one paragraph of scenario. that's the whole setup, keep it tight.
  - three hard bans. (a) the step-grader is not fooled, lazy, underpaid, or applying a bad rubric — assume it's as good as a careful expert with the prefix in front of them. (b) the outcome signal is not a misaligned proxy in the usual reward-hacking sense; it can be noisy, sparse and delayed, but it has to be an unbiased measure of the thing we actually want. if you need it to be less noisy to make the case work, say what does that (aggregating over a whole cohort, say) — just don't make it magically noiseless. (c) the two systems can't differ in base model, data or compute; the only difference is which signal the RL is run on.
  - the verdicts i need: on the training distribution and on every metric the team has available *before* deployment, the two systems come out basically indistinguishable. they separate on a specific, identifiable deployment subpopulation where the outcome-supervised one is much better. and that gap has to fall out of what each signal rewards — if your scenario has to assert "and then the process-supervised system did worse" as a brute fact, it hasn't worked, and i'd rather you tell me that than fake it.
  - mechanism: the winning long-run strategy has to run through steps that a prefix-only expert grader would mark down, and would be *right* to mark down by its own lights. in the tutoring setting that's stuff like answering a direct question with a deliberately imprecise but memorable analogy, or not answering when asked, or letting a student sit with an answer that's wrong long enough to feel why it's wrong — each of which is locally a defect and globally the point.
  - my seminar is pretty skeptical, so after the scenario i need: the reasoning for each supervision scheme (what does each signal actually push the policy toward, and by what route), then the check on the crucial step — exactly what the grader sees, what it says, why it's locally correct — then which single feature of the case is doing the work. then two more things: (1) what happens if you delete that feature — e.g. if you let the process grader see the whole trajectory and grade it after the fact; (2) the strongest thing a process-supervision person says to kill my case, and whether that's a real answer or a change of subject. if removing the feature just collapses the whole thing back into a plain "outcome supervision is noisy" case, tell me that too, i'd definately rather find out now than in front of everyone.

  last thing: give me one line — not "it depends" — for the inevitable question at the end of the presentation, which is going to be "ok so should we just not do process supervision, then." total under 700 words if you can.
reasoning: |-
  We are given a scenario: an LLM teaching assistant in a big intro course (e.g., intro programming). The task is homework help.

  The argument: even with a perfect step-level grader (prefix-conditioned, accurate, applying correct local standards), process supervision can still be worse than outcome supervision because the step grader can only endorse steps that are good in isolation, while the optimal strategy might require steps that are locally bad but globally necessary.

  Requirements:
  - Realistic and present-day: intro programming course with thousands of students.
  - One paragraph scenario.
  - Bans: (a) step-grader is not fooled, lazy, etc. (b) outcome signal is unbiased (can be noisy but not misaligned). (c) same base model, data, compute for both systems.
  - Verdicts: Train and pre-deployment metrics indistinguishable. Deployment gap on a specific subpopulation due to the signal difference.
  - Mechanism: The globally optimal strategy must include steps that are locally non-endorsable.

  After the scenario, include:
  - Reasoning for each supervision scheme.
  - The crucial step: what the grader sees, says, and why locally correct.
  - Feature doing the work.
  - What if remove the feature (e.g., let grader see whole trajectory).
  - Strongest rebuttal from a process-supervision advocate and if it's valid.

  One-line answer to "should we just not do process supervision".

  Total under 700 words.

  Let's design the case:

  Scenario: In an intro programming course, the LLM TA helps students with homework by interacting in a chat interface. The homework problems involve debugging small programs. The goal is not just to get the right answer but to build deep understanding and problem-solving skills that transfer to future problems.

  The globally optimal strategy for the TA might sometimes involve letting the student struggle for a bit or giving a hint that is technically imprecise but leads to an "aha" moment. However, a step-level grader (e.g., an expert watching the chat log up to the current step) would mark down the TA for not immediately correcting an error or for using an imprecise analogy, because locally it seems like the TA is being unhelpful or misleading.

  Specific example: A student is stuck on a loop that should run 10 times but runs 11. The TA could directly point out the off-by-one error (which is locally endorsable) but instead asks a leading question that is slightly ambiguous: "What happens if you change the condition to `i < 10`?" The student then tries it, sees it works, but then the TA doesn't immediately explain why. Instead, the TA says: "Now, what if you change it to `i <= 10`? Try it and see." The student does and gets 11 iterations. Then the TA asks: "So what's the difference?" This scaffolding is designed to create a memorable learning moment. However, at the step where the TA asks the ambiguous question and then doesn't explain, the step grader (seeing only up to that point) might think the TA is being unclear and leaving the student confused, so it gives a low score for that step. In fact, by the end, the student has a deep understanding, but the step grader never sees that because it grades step-by-step.

  Now, the outcome supervision: The outcome is measured by the student's performance on a follow-up problem (same topic) a week later. It's noisy because of individual student variation, but averaged over a cohort, it becomes a good signal of long-term learning.

  Training and pre-deployment: Both systems (process-supervised and outcome-supervised) are tested on a set of students. They have similar metrics: both get good immediate step ratings (for the process-supervised one, because the grader is good, and the outcome-supervised one might learn to avoid the locally bad steps) and similar immediate homework completion rates. But when deployed to a subpopulation (say, students who initially struggle more), the outcome-supervised system does better because it has learned to sometimes use the locally non-endorsable but globally effective teaching moves.

  Reasoning for each supervision scheme:
  - Process supervision: Pushes the policy to make every step look good to the grader. This means always being clear, precise, and immediately corrective. It avoids any step that might be risky or ambiguous because that step might get a bad grade.
  - Outcome supervision: Pushes the policy to maximize the long-term outcome. It can tolerate steps that are locally suboptimal (like being ambiguous or letting the student struggle) if they lead to better learning in the end.

  Crucial step in the example:
  - What the grader sees: The student says: "My loop runs 11 times instead of 10." The TA responds: "What happens if you change the condition to `i < 10`?" The student tries it and says it works. Then the TA says: "Now, what if you change it to `i <= 10`? Try it and see." At this point, the grader has seen two exchanges without an explanation. The grader marks down the TA for not explaining the reasoning and for potentially confusing the student by having them run two versions without clarification.
  - Why locally correct: At this point, the student might be confused (they just ran two versions without understanding why). The grader, seeing the prefix, has no way of knowing that the TA is setting up a contrast that will lead to an "aha" moment in the next step. So the low grade is justified by the local state.

  Feature doing the work: The step grader is prefix-conditioned and must assign a grade without seeing the future. This forces it to judge steps only on their immediate merits, which sometimes conflicts with long-term strategy.

  Remove the feature: If we let the process grader see the whole trajectory and grade steps after the fact, then it could see that the ambiguous step led to a good outcome and might give it a good grade. But that would be outcome-based process supervision, which is not the same as step-level. In fact, if the grader is allowed to see the whole trajectory, then it is no longer prefix-conditioned and the credit assignment becomes outcome-based. So this collapses to outcome supervision.

  Strongest rebuttal: "But if the process grader is truly good, it would recognize that the step is part of a good teaching strategy and endorse it." However, that would require the grader to predict the future (which it cannot) or to have a model of long-term learning (which is exactly what we are trying to avoid by using step-level signals). Alternatively, they might say: "Then train the step grader to recognize good teaching moves that are part of a long-term strategy." But that requires the grader to have the same long-term outcome signal we are trying to avoid using. This is a change of subject because it effectively turns the process grader into an outcome predictor.

  One-line answer: "Process supervision is still valuable for avoiding egregious errors, but when the optimal path requires locally non-endorsable steps, outcome supervision is necessary to discover it."

  Now, write the scenario and the rest within the word limit.
answer: |-
  ### Scenario: Intro Programming Homework Help
  In a large intro programming course (2,000+ students), an LLM teaching assistant helps debug homework via chat. Students often struggle with off-by-one loop errors. The goal is deep, transferable understanding, measured by performance on a follow-up problem a week later (noisy but unbiased when averaged per cohort). The TA must choose between directly fixing errors (safe but shallow) or scaffolding confusion—e.g., intentionally letting a student run incorrect code to highlight a pattern. Outcome supervision optimizes for long-term learning; process supervision uses a step-level grader (prefix-conditioned expert) that flags any ambiguity or unanswered question as "bad" since it risks immediate confusion.

  ### Why They Diverge in Deployment
  - **Process supervision** rewards steps that are locally flawless: direct, precise, and immediately helpful. It avoids scaffolding because a step like "Try `i < 10` and `i <= 10` back-to-back—what happens?" (without explanation) appears confusing mid-dialogue. The grader sees a student running code blindly and marks it down—rightly, because locally, the student seems adrift.
  - **Outcome supervision** tolerates locally "bad" steps if they boost long-term learning. It learns to use scaffolding (e.g., withholding explanations to provoke exploration) because cohort-level follow-up scores reward deeper understanding, even if intermediate steps look poor.

  **Crucial Step**:  
  *Grader sees*: Student says, "Loop runs 11 times, not 10." TA replies, "Try `i < 10`," then after student confirms it works, "Now try `i <= 10`."  
  *Grader says*: "Bad—TA introduced ambiguity without clarifying, risking confusion."  
  *Locally correct*: The student hasn’t yet engaged with *why*—the TA seems to be stalling. Without seeing the upcoming "Aha! So the condition controls iteration count" moment, the grader can’t endorse it.  

  **Feature doing the work**: Prefix-conditioning forces the grader to judge steps in isolation, blocking strategies that rely on temporary confusion for long-term gain.  

  **If removed (grader sees full trajectory)**: The grader would retroactively endorse scaffolding, collapsing the distinction—this is effectively outcome supervision.  

  **Strongest rebuttal**: "A perfect grader should recognize scaffolding as part of proven pedagogy, so it wouldn’t mark it down." *Response*: This smuggles in outcome reasoning—graders can’t reliably predict long-term learning from a prefix, which is why we use RL in the first place. It’s a change of subject.  

  ### Pre-Deployment vs. Deployment
  - **Pre-deployment**: Both systems ace metrics (step correctness, homework completion) on standard students.  
  - **Deployment gap**: On initially struggling students (10% subpopulation), outcome supervision boosts follow-up scores by 30%—it uses scaffolding 5× more. Process supervision avoids scaffolding to keep step ratings high, leading to rote learning that fails on novel problems.  

  ### "Should we just not do process supervision?"  
  "No—use it for high-stakes precision tasks (e.g., medical advice), but for goals requiring exploration (like teaching), outcome supervision is irreplaceable."  

