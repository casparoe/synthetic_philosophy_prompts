answer: |-
  ## Sestina of Condition and Counter

  The evidence is scant, I must admit:
  No proof exists to settle who has done it.
  But logic holds: **if** Oswald missed his shot,
  Then someone else (though who, I know not) **would**
  Have fired the rounds. This claim I firmly state,
  Though darkness veils the gunman at the **match**.

  The evidence is clear; we know the **match**:
  Oswald alone pulled trigger, sealed the **lit**
  Account. But wonder what might be, **if**
  History diverged? Suppose Oswald **would**
  Not fire. In that unreal, adjacent **world**,
  Who then steps forward? Who takes Oswald's **shot**?

  Consider now a simple scene: a **shot**
  Of flame ignites. Suppose I strike a **match**
  Against dry sandpaper. In this **world**,
  Friction provides the spark; the head is **lit**.
  Barring strange winds or damp, the match **would**
  Ignite. This outcome seems secure, **if**

  We grant the scene is normal. But what **if**
  The room is choked with gas? Then strike the **shot**
  Match-head: no flare, no flame. Instead, it **would**
  Explode the vapour. Context shifts the **match**
  Between the spark produced and getting **lit**.
  The outcome shifts within the nearest **world**.

  Now add pure oxygen to that gas-**world**,
  Restoring balance. Instantly, **if**
  The match is struck within this mix, it's **lit**
  With fierce intensity. That same small **shot**
  Of friction now ensures the **match**
  Burns bright and fast. So logic **would**

  Demand. The closest **similar** **world** **would**
  See combustion leap. The altered **world**,
  With oxygen restored, makes safe the **match**
  Again. But note: the outcome shifts **if**
  We change the scene. No contradiction's **shot**
  Accuses us; we merely track what's **lit**.

  So different standards judge what might be **lit**:
  The indicative asks what *is*, **if**
  The premise holds—what probability **would**
  We assign? No need for distant **world**.
  But counterfactuals, like that dark **shot**
  Not taken, trade on closeness, **match**

  For **match**. **If** Oswald hadn't fired, **would**
  Another shot? **World** **similar**—or **lit**
  By different flame? The **match** remains unsure.

  ---

  **Notes on Execution:**

  1.  **Minimal Pair (Stanzas 1 & 2):** The first stanza presents the indicative conditional ("if Oswald missed... then someone else would have fired"). It explicitly states the speaker lacks knowledge ("No proof exists...", "though who, I know not") and asserts the conditional based on logic alone. The second stanza presents the counterfactual ("if Oswald had not shot... then someone else would have"). It establishes the falsity of the antecedent ("Oswald alone pulled trigger") and frames the conditional as a speculation about an "unreal, adjacent world."
  2.  **Shifting Similarity & Worlds (Stanzas 3-6):** These stanzas use the match metaphor. Stanza 3 establishes the baseline: a struck match lights ("it would / Ignite"). Stanza 4 changes the context: with gas present, the match doesn't light but causes an explosion ("it would / Explode"). Stanza 5 restores oxygen: now the match lights intensely ("it's lit / With fierce intensity"). The migration of "would" (lines 3, 6, 3, 1, 5, 4 across stanzas 3-6) and the changing outcomes driven by the modified antecedent ("if / The room is choked...", "if / We change the scene") demonstrate how the relevant "nearest similar world" shifts with context. The word "similar" appears only once (stanza 6, line 4), emphasizing it's a relation defined contextually, not identity ("the head is lit" - not identical worlds). The lack of repetition in the end-word order mirrors the lack of a fixed "nearest" world.
  3.  **Envoi & Distinct Standards:** The envoi contrasts the standards explicitly. The indicative ("asks what *is*, **if** / The premise holds—what probability **would** / We assign? No need for distant **world**") relies on conditional probability within the actual world's evidence. The counterfactual ("trade on closeness, **match** / For **match**") relies on comparative similarity across possible worlds. The final line ("**If** Oswald hadn't fired, **would** / Another shot? **World** **similar**—or **lit** / By different flame? The **match** remains unsure.") places "if" and "would" together ("**If**... **would**") but leaves the conditional ambiguous: it could be interpreted either way (indicative doubt about an unknown past, or counterfactual speculation). The uncertainty ("remains unsure") highlights that the *meaning* depends on which semantic framework governs it, not just the words used. The unresolved question about the "similar world" and the "match" underscores the fundamental difference in truth conditions.
