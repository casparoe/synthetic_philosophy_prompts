answer: |-
  Your inquiry cuts to the heart of ethical representation, balancing truth, consent, and the moral standing of the dead against the needs of narrative and audience. Let's reconstruct the implicit theory underlying these practices, test its coherence, and propose a consistent framework.

  ### Core Theory: **Relational Dignity & Communal Truth-Maintenance**
  The practices presuppose that our duty to the dead is not about *their* interests (as they have none), but about **protecting the integrity of human relationships within the living community** and **honoring dignity as a relational concept**. This splits into:

  1. **Strict Presupposition (Necessary Element):**  
     **Anti-Deception as Social Contract.**  
     Historians are gatekeepers of the *communal factual record*. Their absolute ban on invention is foundational to social trust in history as a discipline. Fictionalizing sources corrupts the archive itself, violating a duty to living and future generations who rely on history as a shared reference point. This is non-negotiable; without it, history ceases to be a knowledge practice.

  2. **Comfortable Fit (Contingent but Deeply Embedded):**  
     **Dignity-as-Answerability Extended by Proxy.**  
     While the dead cannot be harmed, their *living relational ties* persist. Misrepresentation damages the ongoing relationships between the deceased and those who knew/loved them (grief, memory), or the communal understanding of their legacy. This explains protections for non-answering living persons (dementia patients): they remain embedded in *current* moral relationships. The dead’s protection is weaker because their relational field fades, but isn’t zero while memory persists.

  ### Inconsistencies & Underdetermination
  - **Inconsistency:** The law treats the dead’s *image* as property (exploitable) but ignores *defamation* (non-actionable). This clashes with the relational dignity principle. Why is commercial exploitation of Lincoln’s image permissible if a grotesque fictional portrayal (non-defamatory) feels intuitively wrong? Practice is fractured: law prioritizes economic interests of heirs; ethics prioritizes memory/legacy.
  - **Underdetermination:**  
    - **Vulnerability vs. Answerability:** Practices around non-answering living people fit *vulnerability* (they are socially present and dependent). Dead persons are treated as "free" not because they can't answer, but because their vulnerability is reduced to residual relational ties (which fade).  
    - **Audience Belief Formation:** The "based on true story" disclaimer is wildly inadequate, as audiences absorb drama as history. This gap isn't resolved by any current theory—it's a systemic failure of media literacy and narrative convention.

  ### A Coherent Practice Framework: **Contextual Provenance + Compelled Friction**
  Under the **Relational Dignity** theory, coherent practices would:
  1. **Strict Historicity:** Maintain the historian’s absolute invention ban. Their role is custodial truth-preservation.
  2. **Dramatic Representation:** Permit invention in biopics/dramas, but with **enhanced provenance markers** contextualizing the fiction:
     - **Visual/Textual Friction:** Mandate *disruptive* disclaimers: e.g., overlays during fictional scenes ("Imagined Event"), stylized color grading for invented dialogue, or on-screen citations when using real sources. *Goal: Break narrative immersion to signal fabrication.*
     - **Tiered Consent:** For recently deceased (≤50–70 years?), require consent from estates *not for likeness rights alone*, but as *proxy guardians of relational dignity*. For older figures, no consent needed, but heightened provenance marking.
     - **No "Composite Characters" in Labeled Biopics:** If marketing uses a real person’s name, composites that attribute false actions to them are prohibited (avoids legacy pollution).
  3. **Legacy-Vulnerable Groups:** Enhanced protections for figures where misrepresentation could fuel ongoing harm (e.g., victims of atrocity, marginalized communities). Relational ties here are often collective and enduring.

  ### Why This Coheres
  - **Addresses Audience Belief:** Provenance markers force cognitive friction, countering passive absorption of fiction as fact.  
  - **Reconciles Living/Dead Distinction:** Non-answering living people remain *fully vulnerable* within active relationships; the dead’s vulnerability diminishes with time/forgetting.  
  - **Aligns Law & Ethics:** Restricts inheritable image rights to commercial contexts (e.g., merchandise), not dramatic portrayal. Defamation-like claims could be actionable by estates for *recently* deceased if relational harm (e.g., to family) is provable.  
  - **Answers Your Cases:**  
    - A dementia patient is protected due to *current* relational embeddedness.  
    - A long-dead figure with no living ties has minimal protection—but invented slurs might still be barred if they distort communal history (anti-deception principle).  

  ### Challenges
  - **Enforcement:** Who defines "recent" or "legacy-vulnerable"? A cultural oversight body (e.g., guilds/regulators) may be needed.  
  - **Audience Behavior:** Friction markers may frustrate viewers, but this is necessary for ethical clarity. Education must supplement this.  

  This framework accepts that drama and history serve different masters—emotional truth versus forensic truth—but demands that drama *visibly performs* its fictionality when trading on real lives. It rejects the false equivalence of "both invent," insisting that *how* and *why* invention occurs defines its permissibility. The duty to the dead is, ultimately, a duty to ourselves: to remember honestly, imagine responsibly, and preserve the dignity inherent in human connection across time.
