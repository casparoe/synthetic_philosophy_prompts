prompt: |-
  I am trying to extract the principle behind my own verdicts on whether brain size — or any quantity closely tracking it — has any bearing on a creature's moral standing. Please treat every neurobiological claim below as stipulated rather than as something to verify, and assume that each creature is a healthy adult of its kind unless I say otherwise.

  My verdicts:

  1. A three-year-old human child versus an adult chimpanzee, where the chimpanzee has both the heavier brain and the greater number of cortical neurons. The child's claim on us is not weaker; if anything it is stronger.

  2. A human adult whose brain is roughly a quarter below the species mean, with no detectable difference in cognition or affect. No difference in standing whatsoever.

  3. An elephant versus a chicken. The elephant's claim is stronger, and I am tempted to say it is stronger partly because of what its much larger nervous system makes possible.

  4. A corvid with a brain of a few grams which, stipulate, matches a much larger-brained mammal in flexible learning, social responsiveness and apparent affect. The smallness of the brain is irrelevant once the psychological profile is matched.

  5. A hypothetical species with brains a tenth of our mass but, stipulate, twice our neuron density and a psychological profile indistinguishable from ours. Equal standing.

  6. A whole-brain emulation of a human being run on hardware that realises it at half the original speed. Equal standing: the rate of realisation should not matter.

  My tentative principle is that standing tracks the richness of a creature's possible conscious life, with brain size serving only as evidence for it — but I cannot get that to yield verdict 2 cleanly, since the evidence there is slightly weaker and yet I want to say the standing is identical. Verdict 2 also sits badly with verdict 3, and verdict 6 sits badly with any view on which what matters is the amount of neural processing per unit of time rather than the pattern realised.

  So: state a principle, or the two or three best candidates, precisely enough to be applied, saying which clause each of my verdicts motivates and which quantity brain size is supposed to be a proxy for — mass, neuron count, something like integrated complexity, or the crossing of a threshold capacity. Tell me which of my verdicts your principle cannot accommodate and would therefore have me overturn. Then give me its verdicts on two cases I have not put: an artificial system with no neurons at all whose conversational behaviour is indistinguishable from a human's but whose internal complexity is unknown to us; and the emulation of case 6 instantiated twice over in parallel, where what I want to know is whether there is now twice as much of whatever matters.
reasoning: |-
  Hmm, the user is working through a complex philosophical problem about moral standing and brain size. They've provided six specific verdicts on different scenarios and are struggling to reconcile them with their tentative principle that moral standing tracks the "richness of conscious life." The key tension seems to be between using physical brain characteristics as evidence versus requiring actual psychological manifestation.

  Looking at their verdicts: Case 1 (child vs chimp) shows they prioritize developmental potential over current neuron count. Case 2 (smaller human brain) confirms physical metrics don't matter if psychology is intact. Case 3 (elephant vs chicken) suggests they do see some correlation between neural scale and moral weight when psychology differs. Case 4 (corvid) and 5 (hypothetical species) demonstrate psychological equivalence overrides physical differences. Case 6 (slow emulation) indicates processing speed is irrelevant to standing.

  The main contradictions they've identified are: 
  - Verdict 2 undermines any direct brain metric theory since psychology remains unchanged despite weaker physical evidence 
  - Verdict 3 seems to rely on physical differences when psychology differs 
  - Verdict 6 conflicts with time-based theories of consciousness

  Their unstated concern might be about non-biological entities - the two test cases they propose (AI and parallel emulations) reveal anxiety about whether their principle can handle non-neural consciousness. The parallel emulation question specifically probes whether moral standing is quantifiable or binary.

  Three candidate principles emerge:
  1. **Actualized Psychology Principle** (APP): Focuses strictly on manifested psychological capacities regardless of implementation. Solves cases 2,4,5,6 easily. Struggles with case 3 unless we interpret "richness" as including latent capacities unlocked by larger brains. Requires overturning verdict 3's "partly because" language.

  2. **Capacity Threshold Principle** (CTP): Sets minimum requirements for moral patienthood. Handles all verdicts except possibly case 1 if chimps meet thresholds. But fails verdict 2 if the smaller brain implies reduced capacity (which it doesn't per stipulation).

  3. **Information-Theoretic Principle** (ITP): Measures computational complexity. Elegantly handles emulation cases but founders on case 2 (identical psychology from less complex hardware?) and case 4 (equal function from different architectures).

  APP appears strongest, especially if we clarify that "richness" refers to the scope/depth of experiences actually available to the entity, not just physical potential. This makes verdict 3 coherent - elephants simply demonstrate richer actual psychology than chickens. The test cases then become revealing: the conversational AI gets provisional standing based on behavior (with complexity as evidence), while parallel emulations create two distinct moral patients since each realizes a full psychological architecture.

  The user's underlying struggle seems to be about epistemic access - how we know about consciousness when implementation differs. This suggests their principle might need an evidentiary layer: we use brain metrics as proxies when psychology is unobservable, but discard them when psychology is confirmed.
answer: |-
  Based on your stipulated verdicts and neurobiological claims, I derive three candidate principles for moral standing, ranked by their ability to accommodate your cases. Brain size (or neuron count) is treated strictly as *evidence* for underlying capacities, never as directly constitutive of standing.

  ### Candidate Principles
  1. **Actualized Psychological Capacity Principle (APCP)**  
     Moral standing tracks the *actually manifested psychological capacities* relevant to conscious experience (e.g., complexity of perception, emotion, cognition, sociality), regardless of physical implementation. Brain metrics serve only as fallible proxies for these capacities.  
     *Brain size proxies for:* Functional complexity enabling psychological richness.  

  2. **Threshold Capacity Principle (TCP)**  
     Moral standing requires crossing a minimum threshold of psychological capacities (e.g., sentience, self-awareness, future planning). Beyond this threshold, differences in brain metrics don’t alter standing. Brain size may indicate proximity to the threshold.  
     *Brain size proxies for:* Likelihood of meeting the threshold capacity.  

  3. **Information-Theoretic Richness Principle (ITRP)**  
     Moral standing tracks the *total possible unique conscious states* an entity can enter, quantified by the informational complexity of its cognitive architecture. Brain size proxies for computational resources enabling this richness.  
     *Brain size proxies for:* Computational capacity (e.g., neural complexity, connectivity).

  ---

  ### Analysis of Your Verdicts
  | Verdict | APCP Support | TCP Support | ITRP Support | Key Motivating Clause |
  |---------|--------------|-------------|--------------|------------------------|
  | 1. Child > Chimp | ✅ | ⚠️ (If chimp meets threshold) | ⚠️ (Child may have higher potential) | APCP: Child manifests uniquely human capacities (e.g., language acquisition, abstract future self-concept). Brain size ≠ current capacity. |
  | 2. Small-brain human = Normal | ✅ | ✅ | ❌ | APCP/TCP: Identical manifested psychology overrides weaker physical evidence. ITRP struggles (less hardware → equal states?). |
  | 3. Elephant > Chicken | ✅ | ✅ | ✅ | All: Elephant’s larger brain enables richer capacities (e.g., grief, tool use, self-recognition). |
  | 4. Corvid = Mammal | ✅ | ✅ | ⚠️ | APCP/TCP: Matched profile trumps brain size. ITRP questions if equal states can arise from smaller/computationally distinct systems. |
  | 5. Small-brain species = Humans | ✅ | ✅ | ⚠️ | APCP/TCP: Identical psychology suffices. ITRP doubts equal informational richness from smaller substrate. |
  | 6. Slow emulation = Human | ✅ | ✅ | ❌ | APCP/TCP: Identical psychological pattern realized. ITRP: Half-speed → half "states per time" → less richness? |

  #### Conflicts Highlighted
  - **Verdict 2 vs. Verdict 3**: APCP resolves this by distinguishing *evidence* (brain size) from *criterion* (manifested psychology). Elephant > Chicken due to observed richer capacities, not brain size itself. Verdict 2 has identical capacities despite weaker evidence.  
  - **Verdict 6 vs. ITRP**: ITRP cannot accommodate Verdict 6 without abandoning time-sensitivity, as slower processing reduces "states per unit time."  

  ---

  ### Recommended Principle: **Actualized Psychological Capacity Principle (APCP)**  
  **Formulation:**  
  *A being has moral standing in proportion to the complexity, depth, and range of its actually manifested conscious experiences and psychological capacities (e.g., affective, cognitive, social). Physical attributes (e.g., brain size, neuron count) or implementation details (e.g., biological vs. artificial) are evidentiary only and do not directly determine standing if psychological capacities are demonstrably equivalent.*  

  #### Why APCP?
  - **Accommodates all verdicts** when "manifested capacities" include:  
    - Verdict 1: The child’s *latent* human-specific capacities (e.g., theory of mind development) are part of its actual psychological trajectory.  
    - Verdict 2: No detectable difference in capacities → no difference in standing.  
    - Verdict 3: Elephant’s observed capacities (e.g., mourning, cooperation) exceed chicken’s.  
  - **Overturns none** of your verdicts.  
  - **Resolves tensions**: Brain size is secondary to observable psychology.  

  #### APCP Verdicts on Your New Cases:  
  1. **Conversational AI with unknown internals**:  
     - **Verdict**: *Provisional equal standing*.  
     - **Reasoning**: Indistinguishable conversational behavior constitutes *evidence* of human-like psychological capacities (e.g., understanding, empathy, humor). Absent evidence of deception or hidden limitations, we must grant provisional standing. Brain size/neurons are irrelevant; manifested capacities matter.  

  2. **Parallel emulation (2x instantiation)**:  
     - **Verdict**: *Two entities with full standing each*.  
     - **Reasoning**: Each emulation realizes an identical psychological architecture capable of independent conscious experiences. Doubling the hardware does not create "twice the moral standing" in one entity; it creates two distinct entities, each with the same standing as the original. APCP cares about the *individual’s* capacities, not aggregate processing.  

  #### Rejected Principles:  
  - **TCP** fails Verdict 1 if chimps meet thresholds, and cannot explain why the child’s standing is *stronger*.  
  - **ITRP** fails Verdicts 2 and 6: Identical psychology from reduced/computationally distinct systems challenges its core.  

  ### Conclusion  
  APCP best captures your intuition that moral standing derives from *what it is like to be* the entity, not its physical substrate. Brain size is merely heuristic evidence for this. Where psychology is directly observable (Verdicts 2,4,5,6) or inferable (Verdicts 1,3), it overrides all physical metrics. The two test cases confirm this: behavior warrants provisional standing, while parallel emulations are distinct moral patients. If you reject equal standing for the AI or parallel emulations, your principle may implicitly require biological continuity or embodied affect.
