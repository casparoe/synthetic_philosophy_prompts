prompt: |-
  I have a question about a configuration I keep running into, and I would rather get the carving right than be handed a label, so I will ask it at some length.

  About me: I am a software engineer, fifteen years, mostly build systems and developer tooling. CS degree, one undergraduate logic course, no philosophy beyond that. I want to know whether what I am about to describe has an established name and an established literature, and — more importantly — whether whatever name exists actually covers my case or only a neighbour of it.

  Three cases from work.

  1. A self-hosting compiler. The compiler for language L is written in L, so building it requires an already-built compiler for L; the repository therefore contains a checked-in binary that everyone treats as the bottom of the story. When a new hire asked how we know that binary is a faithful translation of the source, the honest answer was not a derivation but a provenance chain ending in trust. We tried to close the gap: rebuild the compiler with itself until the output stops changing, build it with an independent implementation and compare. This did not remove the thing we were standing on; it relocated it onto the comparison procedure, the second implementation, and the hardware. And there is a sharper version of the worry that I cannot get rid of: the tool you would use to audit the rebuilt toolchain is itself an output of the rebuild, so no test run inside the loop can distinguish a faithful toolchain from one that lies consistently about itself.

  2. A schema language used to describe our API schemas, itself described by a schema that validates itself. A defect in the meta-schema is invisible to validation, because the instrument and the object under the instrument are the same file. The same shape shows up with a linter whose own configuration is linted by the linter, and with a code-review bot whose rules live, as ordinary files, in the repository the bot reviews.

  3. Reflection: a language where a program can construct and run a representation of a program, so that the thing doing the describing and the thing described are the same data structure; and type systems in which the collection of all types is itself a type, which is known to make the system collapse rather than tower.

  What interests me is not the loop. The loop is well known and has an obvious name in my field; books get written about it. What interests me is the following, which I have no word for.

  (a) The outside of the loop is not a tier of it. Whenever people diagram one of these cases they either add a box on top — call it the meta-level, or the spec, or the model — which simply restarts the problem one level up, or they declare the whole arrangement viciously circular and stop talking. Neither matches what I see. The thing that stops the regress is not a further box. It is the background: the silicon, the person who wrote version 0.1, the fact that the meta-schema is interpreted by code that no schema checks, the fact that the diagram of the loop is drawn in a notation the loop does not contain. It is off the canvas rather than above the canvas.

  (b) That background is convertible but not eliminable. You can always pull it into the picture — write the meta-meta-schema, produce the independent second implementation, formalise the provenance chain — and the moment you do, a fresh background appears behind it. So the un-tangled thing behaves less like a fixed rung than like a horizon that recedes at the rate you approach it.

  A colleague showed me the Escher print of two hands drawing each other and said this is the same phenomenon. I take the point about the two hands, but my question concerns the pair of hands that is not in the picture, and whether, if you drew that pair, you would need another one.

  What I would like:

  1. Does this have a name and a literature? Terms I already have — self-reference, bootstrapping, meta-level, reflection — name the loop or the machinery, not the off-canvas background, and none of them say anything about its receding behaviour. I have also seen it claimed that in any such arrangement there is necessarily some level that cannot itself be tangled; I have no source for that and no idea whether it is a theorem, a stipulation, or folklore, and I would like to know which.

  2. If the nearest established notions are things like a loop that crosses levels, a hierarchy whose levels come back to where they started, and a structure with no permanently top or bottom element, I want the carving rather than the name: what each of those covers, exactly where my case comes apart from each, and which fits best. In particular, settle this for me if you can: is the outside-of-the-loop supposed to be structurally outside — forced by how the system is put together — or only pragmatically outside, a matter of what we happen not to be able to question this quarter? And is the receding behaviour I described a consequence of anything, or merely an observation about how careless engineers work?

  3. If nothing established fits, coin a term and give it a definition a working programmer could apply to a new case, plus the boundary cases: the minimum a system has to do to count, and the cases that resemble it but should be excluded. Two I would like ruled on specifically: ordinary mutual recursion that provably terminates, which looks like a loop but seems to me well founded and therefore different; and the phasing discipline in macro systems, where macro expansion happens in numbered stages and each stage can only use macros from strictly earlier ones, which looks to me like either a genuine tower or a very good disguise.

  Please argue the distinctions directly rather than pointing me at a literature — I cannot chase down references, and a list of things to read would be useless to me. Six hundred to nine hundred words is fine.

  Close with a single final line, with nothing after it:

  \answer{the single best label for what I described, or "no established name" if that is your verdict, plus a short qualifier if one is needed}
reasoning: |-
  Okay, the user is asking about a specific configuration they encounter in their work as a software engineer. They've described three cases: a self-hosting compiler, a self-validating schema language, and reflection in programming languages. What they're really interested in isn't the loop itself (which they understand) but rather the background that makes the loop possible - something that's outside the system but can't be eliminated.

  Looking at their examples, I need to identify what they're actually pointing to. They mention that when you try to formalize the background (like creating a meta-meta-schema), a new background emerges behind it. This receding behavior is key to their observation.

  I recall concepts like foundationalism in philosophy, where systems are built on basic beliefs that aren themselves justified. That resembles what they're describing. In logic, there's Tarski's undefinability theorem showing truth can't be defined within the same system. Gödel's incompleteness theorems also come to mind, where consistent systems can't prove their own consistency.

  For mutual recursion, it's different because it terminates and is well-founded - it doesn't require an external foundation. The phasing discipline in macros creates a clear hierarchy with a base, so it's not the same as this receding background.

  The term "foundation" captures the essential idea - it's what the system relies on but isn't part of the system itself. And since it always recedes when formalized, it's "elusive." So "elusive foundation" seems like the best label. This isn't a standard term, but it accurately describes what they're observing across their examples.

  The user wants a clear distinction from related concepts and a definition they can apply. "Elusive foundation" works because it emphasizes both the necessity of the background and its tendency to retreat when examined. For their boundary cases: mutual recursion is excluded because it's well-founded internally, while macro phasing has an actual foundation stage.
answer: |-
  Your description centers on a phenomenon where self-referential systems rely on an implicit, external background that enables their operation but cannot be fully internalized without regress. This is distinct from the self-referential loop itself. Here's a systematic analysis:

  ### 1. **Core Phenomenon and Its Name**  
  The "off-canvas background" you describe—silicon, initial trust, unvalidated interpreters—is an **elusive foundation**. It has no single established name in CS or logic, but it aligns with:  
  - **Philosophy**: Foundationalism (the need for non-inferential justification) and Münchhausen trilemma (all justifications eventually rest on dogma, circularity, or infinite regress).  
  - **Logic/CS**: Tarski’s undefinability theorem (truth in a system cannot be defined within itself) and Gödel’s incompleteness (systems cannot prove their own consistency).  
  **Verdict**: No universal label exists, but "**elusive foundation**" captures its key traits: necessary, external, and receding upon formalization.  

  ### 2. **Distinctions from Related Concepts**  
  Your cases differ critically from standard terminology:  
  - **Self-reference/bootstrapping**: Describes the *loop* (e.g., compiler compiling itself). Your focus is the *external enabler* of that loop (e.g., the pre-trusted binary).  
  - **Meta-levels**: A meta-schema is part of the loop; the *interpreter* of that schema is the foundation. Meta-levels extend the hierarchy but don’t resolve the foundation’s elusiveness.  
  - **Reflection**: The ability to manipulate program structures internally. The foundation is the *runtime* executing reflection, which remains external.  

  **Structural vs. Pragmatic Externality**:  
  - The foundation is **structurally external** because self-referential systems *by construction* cannot encapsulate their prerequisites (e.g., a self-validating schema cannot validate the parser/validator code itself).  
  - The "receding" behavior is **consequence, not carelessness**: Formalizing the foundation (e.g., writing a meta-meta-schema) creates a new system with *its own* prerequisites (e.g., the meta-meta-schema interpreter). This is inherent to any system relying on self-application.  

  ### 3. **Boundary Cases**  
  Apply the "elusive foundation" test: **Does the system require an external element that vanishes when formalized?**  
  - **Mutual recursion**: Excluded.  
    - *Why*: Termination proofs rely on well-founded induction (e.g., decreasing parameters). The "foundation" (base cases) is *internal* and verifiable within the system. No receding background exists.  
  - **Macro phasing**: Excluded.  
    - *Why*: Each stage depends *only* on prior stages, forming a finite tower. The base stage (e.g., built-in macros) is the foundation, but it is **fixed and internalized**—not elusive. Adding layers doesn’t force regression; the base remains accessible.  

  ### Definition and Criteria for "Elusive Foundation"  
  **Term**: *Elusive foundation*  
  **Definition**: An external prerequisite enabling a self-referential system’s operation, which cannot be fully internalized without shifting the prerequisite to a new external layer.  

  **Minimum criteria to qualify**:  
  1. A self-referential component (e.g., self-compiling, self-validating).  
  2. Dependence on an element outside the system’s self-referential scope (e.g., hardware, initial trusted artifact).  
  3. **Receding behavior**: Formalizing this element creates a new system with a *new* external dependency.  

  **Exclusion criteria**:  
  - Systems with internal bases (e.g., recursive functions with provable termination).  
  - Explicitly finite hierarchies (e.g., phased macros with immutable base stage).  
  - Non-self-referential systems (e.g., a compiler written in C, compiled by GCC).  

  ### Why This Fits Your Cases  
  - **Compiler**: The binary is the foundation. Rebuilding reliances to hardware/comparison tools—a regression.  
  - **Schema/linter**: The validator code (not the schema) is the foundation. Linting the validator code would require another linter.  
  - **Reflection**: The runtime executing reflection is foundational. Modeling the runtime within the language shifts the foundation to the new runtime’s host.  

  The "elusive foundation" is unavoidable in self-applicative systems—a consequence of their closure properties. Philosophy debates whether it’s a flaw (inconsistency risk) or necessity (pragmatic grounding); in engineering, it’s managed via trusted bases (e.g., hardware audits).  

  \answer{elusive foundation}
