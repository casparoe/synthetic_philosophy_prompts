prompt: |-
  I'm a backend engineer by trade, with no training in philosophy or law. I'm two years into a term on the Professional Conduct Committee of the Institute of Transportation Systems Engineers; I was appointed because the society wanted a practitioner on the panel, not because I have any background in ethics. We have to decide Complaint 24-11 at next month's meeting, and I'm the member assigned to draft the written opinion that we'll circulate, discuss, and vote on. I'd like you to draft it for me. I'm genuinely undecided, and both halves of the committee have said things I can't dismiss, so I'd rather have the reasoning than have you guess at the conclusion I want.

  The rule we're construing is short. Rule 3.2 says members shall not knowingly make false statements of fact about a system they offer to a client, and shall not knowingly misrepresent its capabilities, limitations, or provenance. We've never had to interpret it. What we are really arguing about, as far as I can tell, is whether a member can violate it by saying something true.

  The following facts are stipulated by both parties.

  The member is the principal engineer at a fare-collection vendor that bid on a municipal transit contract. The transit authority's RFP asked, in its plain-language section, whether the system logs the travel history of individual riders and whether that history survives account closure. A technical annex to the RFP separately defined the phrase "travel history record" narrowly: a per-card itinerary row in the fare system's primary database.

  The member's email answer to the authority's procurement officer was, in substance: the system does not log individual travel history, and fare transactions are processed without reference to the rider's identity. Both sentences are true on the architecture. There is no per-card itinerary table. Transactions write tap events to an append-only analytics stream keyed by card serial number, retained thirteen months; roughly sixty percent of cards are registered, and for those the card serial joins to a name and email in a separate registration table. Any engineer with warehouse access can reassemble a complete per-rider itinerary in about forty minutes of SQL, without approval from anyone. The member designed that pipeline himself. The week before he sent the email, he wrote in an internal channel that the less said about analytics retention the better, but that the team didn't have to volunteer it.

  The procurement officer is a contracts attorney with no engineering background. The authority's own systems integrator, an engineer, was copied on the answer and raised no objection at the time; he later said he read "travel history" in the annex sense and assumed analytics was out of scope. Nine months after award, the authority published a rider-facing privacy page stating that the system does not track individual riders. The member did not draft it, but the wording came from his email.

  The complaint has a second count. The vendor's proposal stated that the platform had been reviewed by an independent security firm, which is true: the firm was engaged, and its scope was the fare-gate firmware and the card reader protocol. Its preliminary draft flagged two access-control problems in the analytics pipeline as out-of-scope observations. The vendor terminated the engagement before a final report was issued, and the firm's contract bars the vendor from disclosing the draft. The member never said the review was complete, favorable, or covered analytics.

  His defense on both counts is the same: every sentence he wrote is true; he used the RFP's own defined term; his statements went to people who either shared his technical dialect or had a copy of the annex; procurement is adversarial and asking follow-up questions is the buyer's job; and a rule that punishes true statements for what a hearer might infer would make liability turn on foresight the speaker can't fully control.

  Four candidate formulations of the standard are on the table, and we have to pick one or draft a better one. Our staff attorney proposes a disambiguation test: a statement is deficient when the member foresaw that its audience would take it to convey something materially false and, if asked at the time, would not have agreed to add a clarifying sentence. I proposed an analogue from code review: a statement is deficient when a reasonable member of the audience must ask a follow-up that the speaker could have answered in the same breath, at essentially no cost. Another committee member proposes an interface framing: treat any client-facing statement like an API response, so that ambiguity is the producer's bug rather than the consumer's. The member's position amounts to a fourth: literal truth, with misrepresentation reserved for statements that are false or for outright fabrication.

  Please draft the opinion as a committee memo, roughly a thousand to fourteen hundred words, in American English, with these sections:

  Recommendation, one or two sentences, at the very top. Then the rule construction you're adopting, stated precisely enough that we could vote on it and apply it to next year's complaints. Then application to the two counts separately — they may come out differently, and I want to know if they should. Then a section on how the standard you adopt handles five pressure cases: statements that are true only within a technical dialect shared with part of the audience; true statements whose force comes entirely from an omitted qualifier; situations where the speaker is contractually barred from disclosing what would clarify the statement; a single statement that reaches both expert and lay audiences; and the adversarial-procurement context, where both sides expect the other to be guarded. Then the strongest version of the losing side's argument, written as a dissent one of our members could actually sign — the foresight-without-control objection is the one I find hardest to answer, and I want it given its full weight rather than conceded in a sentence. Finally, a short section separating what we can present as settled and uncontroversial from what is genuinely contested among people who know this area, so that we don't publish a contested reading as if it were the consensus position of the committee.

  Please don't cite cases, statutes, treatises, or articles. We have counsel for that, and I want the argument rather than the authority, in plain language a working engineer can follow.

  End with a single machine-readable line, using exactly this form and filling each blank from the menu given: \answer{Count A: sustained | dismissed | caution; Count B: sustained | dismissed | caution; Standard: attorney | code-review | interface | literal-truth | other}
reasoning: |-
  We are drafting a committee memo for Complaint 24-11. The rule in question is Rule 3.2: members shall not knowingly make false statements of fact about a system they offer to a client, and shall not knowingly misrepresent its capabilities, limitations, or provenance.

  The key issue is whether a member can violate this rule by making a true statement that is misleading. We have four candidate standards: the staff attorney's disambiguation test, the code-review test (proposed by the requester), the interface framing, and the literal-truth standard (the member's position). We must choose one or draft a better one.

  After careful consideration, I propose a standard that combines elements of the disambiguation test and the code-review test, with an emphasis on the professional responsibility of the engineer to communicate clearly and avoid material misrepresentation. This standard is:

  **A member violates Rule 3.2 when they make a statement that is literally false or when they make a true statement that they know, or should reasonably know, would mislead the audience in a material way regarding the system's capabilities, limitations, or provenance, and the member fails to provide necessary clarifications that are readily available and would not impose undue burden.**

  This standard has two prongs: (1) literal falsehood, or (2) a true statement that is misleading in a material way and the member fails to clarify when it is reasonable to do so. The "should reasonably know" part introduces an objective element (what a reasonable engineer would foresee) and the "material way" ensures that only significant misrepresentations are covered. The requirement that clarifications are readily available and without undue burden addresses situations where the speaker is contractually barred or where adding a clarification is impractical.

  Now, we apply this to the two counts.

  **Count A: The member's email about travel history logging**

  The member stated: "the system does not log individual travel history, and fare transactions are processed without reference to the rider's identity." These statements are true in the narrow technical sense (no per-card itinerary table in the primary database). However, the member knew that the analytics stream could be used to reconstruct travel history and that card serial numbers are linked to identities for registered users. The audience included a procurement officer (non-engineer) and a systems integrator (engineer). The member also internally noted that "the less said about analytics retention the better."

  Under the standard: 
  - The member knew that the analytics pipeline existed and that it allowed reconstruction of travel history. 
  - The member should reasonably have known that the procurement officer (without the annex definition) would interpret "log individual travel history" broadly, meaning the system does not record or enable the reconstruction of such history. The member also knew the systems integrator might interpret it narrowly (as per the annex). 
  - The statement, while true, was materially misleading to the procurement officer because it conveyed that the system does not track individual riders, when in fact it does. 
  - The member failed to clarify. A reasonable clarification (e.g., "We do not have a per-card itinerary table, but we do record tap events by card serial number which can be linked to a rider if the card is registered and can be used to reconstruct travel history") was readily available and would not have imposed an undue burden. 

  Therefore, we find that the member violated Rule 3.2 on Count A.

  **Count B: The statement about the security review**

  The proposal stated that the platform had been reviewed by an independent security firm. This is true. The review was limited in scope (firmware and protocol) and did not cover the analytics pipeline. The member did not say the review was complete, favorable, or covered analytics. The vendor terminated the engagement and was contractually barred from disclosing the draft.

  Under the standard:
  - The statement is true and the member did not make any false claims about the scope or results.
  - However, the statement might mislead if it implies a comprehensive review. But the member did not represent the scope. The standard requires that the member knows or should reasonably know that the statement would mislead in a material way. Given the adversarial procurement context and the fact that the statement was a bare fact (review occurred) without elaboration, it is not inherently misleading. 
  - The member was contractually barred from disclosing the draft, so providing a clarification (e.g., about the scope) might have been impossible without breaching the contract. Therefore, the requirement to clarify does not apply because it was not readily available without undue burden (legal risk). 

  Thus, we find no violation on Count B.

  **Pressure Cases**

  1. *Technical dialect shared with part of the audience*: The standard requires the member to consider the entire audience. If a statement is true in a technical dialect but misleading to a lay audience, and the member knows or should know that, then they must clarify if reasonable. In Count A, the audience included a non-engineer, so the member had a duty to clarify.

  2. *Omitted qualifier*: A true statement without a necessary qualifier can be misleading. The standard catches this if the member knows or should know the omission makes the statement materially misleading and clarification is reasonable. In Count A, the omission of the analytics pipeline made the statement misleading.

  3. *Contractually barred from disclosure*: If a member cannot clarify without breaching a contract, then the clarification is not readily available without undue burden. The member is not required to breach a contract. This is why Count B was dismissed.

  4. *Single statement to both expert and lay audiences*: The member must ensure the statement is not materially misleading to any part of the audience. If necessary, the member should provide additional information to the lay audience or use clear language that both can understand.

  5. *Adversarial procurement*: While parties are expected to be guarded, Rule 3.2 sets a baseline of honesty. The adversarial context does not excuse misleading statements. However, it may inform what is material and what the audience would expect. In Count A, even in an adversarial context, the member must not misrepresent.

  **Dissent**

  The strongest dissent would argue for the literal-truth standard. It might say:

  "The committee's standard introduces an element of mind-reading and imposes liability for the hearer's inferences. Rule 3.2 prohibits false statements and misrepresentations, not true statements that might be misinterpreted. The member's statements were literally true and used the RFP's defined term. The procurement officer had the annex and could have asked for clarification. The member did not control how the authority later used his email for the privacy page. The standard we adopt should be clear and predictable: only false statements or deliberate fabrications. The committee's standard requires the speaker to anticipate and guard against every possible misunderstanding, which is impossible and turns liability on the hearer's subjective understanding. Moreover, the member's internal comment about not volunteering information does not prove intent to mislead; it reflects a common practice in negotiations. The committee's ruling on Count A punishes truth and will chill candid communication."

  **Settled vs. Contested**

  The following points are settled and uncontroversial in this decision:
  - Rule 3.2 prohibits knowingly false statements and knowing misrepresentations.
  - The rule applies to statements about a system's capabilities, limitations, or provenance.
  - The rule does not require members to disclose every detail, but it prohibits active misrepresentation.

  The following points are contested and represent the committee's interpretation, which may be debated:
  - Whether Rule 3.2 extends to true but misleading statements.
  - The exact standard for when a true statement becomes a violation (we have adopted a knowledge/reason to know standard with a duty to clarify when reasonable).
  - The weight given to the adversarial context in assessing the member's duty.

  **Recommendation**

  We recommend that the committee sustain the complaint on Count A and dismiss it on Count B, and adopt the standard as stated above.

  ---

  **Final Answer Format**

  \answer{Count A: sustained; Count B: dismissed; Standard: other}

  Note: We are adopting a standard that is a hybrid, so it falls under "other". We have articulated it clearly for future application.
answer: |-
  **Recommendation**  
  The committee should sustain the complaint on Count A and dismiss it on Count B, adopting a standard that holds members accountable for true statements that are materially misleading when the member knew or reasonably should have known the audience would be misled and failed to provide readily available clarifications.

  **Rule Construction**  
  Rule 3.2 is construed as follows:  
  *A member violates this rule by (1) making a false statement of fact about a system, or (2) making a true statement that the member knows or reasonably should know is materially misleading regarding the system’s capabilities, limitations, or provenance, unless the member provides timely clarifications that are readily available and would not impose undue burden.*  

  This standard requires literal truth but also prohibits exploiting ambiguity or omission to create a false impression. It balances professional integrity with practical constraints by:  
  - Using an objective "reasonably should know" test for foreseeability.  
  - Limiting liability to material misrepresentations (those affecting client decisions).  
  - Excusing omissions where clarification is unavailable or burdensome.  

  **Application to Count A (Travel History)**  
  The complaint is sustained. The member’s email stated, "the system does not log individual travel history," which was literally true under the RFP’s narrow technical definition but materially misleading.  
  - **Material Misrepresentation**: The statement concealed that travel history was reconstructible via the analytics pipeline—a core privacy concern in the RFP’s plain-language question. The member knew the procurement officer (a non-engineer) would interpret "log" broadly, not as a defined term. His internal comment about withholding analytics details confirms awareness of the misleading potential.  
  - **Failure to Clarify**: A clarifying sentence (e.g., "While no itinerary database exists, tap events are stored and can reconstruct travel history for registered cards") was readily available, low-cost, and directly responsive to the RFP’s intent. The member’s choice to omit this violated Rule 3.2.  

  **Application to Count B (Security Review)**  
  The complaint is dismissed. The proposal’s statement that the platform "had been reviewed by an independent security firm" was literally true and not inherently misleading.  
  - **No Material Misrepresentation**: The member did not claim the review was complete, favorable, or covered analytics. The scope limitation (firmware/card reader) was a known industry norm for such reviews.  
  - **Clarification Unavailable**: The member was contractually barred from disclosing the draft report. Requiring clarification would impose an undue burden (legal risk), exempting it under the standard.  

  **Pressure Cases**  
  The adopted standard resolves key edge cases as follows:  
  1. **Technical dialect shared with part of the audience**: Liability arises if the statement misleads any reasonable audience segment. The member must address material ambiguities (e.g., defining "log" for non-experts in Count A).  
  2. **Omitted qualifier**: A true statement violates the rule if omitting a qualifier (e.g., "in the primary database") makes it misleading, and adding it is low-cost (as in Count A).  
  3. **Contractual bar on disclosure**: No violation if clarification is unavailable without undue burden (e.g., Count B’s barred draft report).  
  4. **Single statement to mixed audiences**: The member must ensure the statement is not misleading to any reasonable recipient. If experts and laypersons interpret it differently, the member must clarify for the more vulnerable group.  
  5. **Adversarial procurement**: While parties may withhold non-material information, they cannot exploit ambiguity to mislead. The buyer’s duty to ask follow-ups does not absolve the member of the duty to avoid material misrepresentations.  

  **Dissent**  
  The literal-truth standard should govern Rule 3.2. This complaint stretches the rule beyond its plain meaning, punishing truth for a listener’s misunderstanding. The member’s statements were factually accurate and used the RFP’s defined term ("travel history record"). The procurement officer had access to the annex and could have sought clarification—common in adversarial bidding. Holding engineers liable for inferences they "should have known" the audience would make is unworkable: it demands mind-reading and forces members to volunteer unsolicited caveats, chilling communication. The internal comment about not volunteering analytics details reflects prudent strategy, not deceit. Rule 3.2 targets falsehoods, not artful phrasing. By condemning a true statement, the majority makes liability hinge on the hearer’s subjectivity, not the speaker’s intent—a standard no engineer can reliably follow. Count A should be dismissed.  

  **Settled vs. Contested**  
  **Settled and Uncontroversial**:  
  - Rule 3.2 prohibits knowingly false statements.  
  - Members need not volunteer every system detail but must answer direct questions honestly.  
  - Context (e.g., procurement) informs materiality but does not excuse deception.  
  - The rule applies only to factual assertions about systems, not opinions or forecasts.  

  **Genuinely Contested**:  
  - Whether Rule 3.2 covers true-but-misleading statements (this opinion holds it does).  
  - The role of audience expertise (this opinion imposes a duty to clarify for vulnerable audiences).  
  - The weight given to contractual barriers (this opinion exempts burdensome disclosures).  
  These points reflect reasonable disagreement; the committee’s view is not universal consensus.  

  \answer{Count A: sustained; Count B: dismissed; Standard: other}
