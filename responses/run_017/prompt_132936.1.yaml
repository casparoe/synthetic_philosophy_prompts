prompt: |-
  I've been reading about moral foundations theory on my own — no academic background, just a few popular books and a long-running argument with my brother-in-law — and one thing about it keeps bothering me. The framework presents itself as a neutral map rather than a verdict: it says it is only cataloguing the innate moral sensitivities people happen to have, the way one might catalogue taste receptors. But it keeps getting used to decide who is right, by explaining the other side's convictions as the output of the foundations they happen to score on, and their reasoning as post-hoc spin for intuitions that arrived first. I can never see why that move should stop short of the people drawing the map.

  Please write a satirical policy document of about 650 words: a set of numbered clauses in deadpan civil-service prose, issued by an Office of Moral Foundation Parity in a country that has passed a Foundation Parity Act. Under the Act, arguments made in public are audited for foundation coverage — a letter to the editor, a sermon, or a protest sign that leans only on the two individualizing foundations and leaves the binding ones untouched is classified as monoculture speech, and its author is required to register as foundation-limited. Other clauses should follow the framework's own logic where it leads: because reasoning is held to be the press secretary of intuition rather than its source, audit rulings must be issued on intuition alone, and any auditor caught offering grounds for a ruling is disqualified. A seventh foundation has lately been added to the rubric over the drafters' objections — call it the Symmetry Foundation, the intuition that any norm you invoke against another person also binds you — attributed to a researcher at an institute you invent. Close with a short appendix in which the Office applies its own rubric to the Act's preamble and to the conduct of the audit board itself.

  The jokes should come from the theory's real features — the taste-receptor metaphor, the individualizing/binding split, intuition-first moral psychology, the claim to be merely descriptive — pushed one step further rather than replaced with something easier to mock. The target is the practice of using moral psychology to settle moral disagreement, not any named person. It should be recognizably fair to someone who has read the literature and still legible to my brother-in-law.
reasoning: |-
  Okay, let me approach this satirical policy document request systematically. The user clearly understands Moral Foundations Theory well and wants sharp satire targeting its application as an arbiter of moral truth. They've specified key elements: the taste receptor metaphor, intuition-first psychology, and especially the hypocrisy of exempting the mapmakers from their own framework.

  Hmm, the core tension they identify is fascinating - how a supposedly descriptive theory gets weaponized to dismiss opposing views as "just intuition plus spin." The satire needs to expose that circularity without straw-manning the actual theory. I'll need to mirror Haidt's precise terminology (binding/individualizing foundations, post-hoc reasoning etc) while pushing the logic to absurd bureaucratic conclusions.

  Right, first structural consideration: the deadpan bureaucratic tone is crucial. I imagine something between FDA regulations and ISO standards, with clinical terms for ridiculous concepts. "Monoculture speech" as a violation category feels right - it turns moral diversity into agricultural metaphor. The audit process must embody the theory's own claims: auditors judging intuitively without reasons, yet somehow producing consistent rulings. That contradiction is the joke.

  The seventh foundation addition is brilliant - Symmetry as the "what's good for the goose" principle. Perfect for exposing the framework's blind spot about self-application. I'll attribute it to a fictional researcher (maybe "Dr. Echo" for the recursive implication) and have the establishment resist it, mirroring real academic tensions.

  For the appendix, the key is showing the Office violating its own standards. The preamble will inevitably lean binding foundations (order, authority), while audit board decisions will prove individualizing. And of course, their "intuition-only" rulings will secretly rely on reasoning when scrutinized. That's the mic-drop moment.

  User's brother-in-law should get it without PhD, so I'll avoid jargon where possible. But the jokes must land for experts too - like the taste receptor metaphor becoming literal "moral palate" assessments. The trap closes when the auditors get audited... that recursive twist makes the satire complete.

  Better avoid naming real researchers - this critiques methodology, not individuals. The tone should feel like a government document that doesn't know it's absurd. Clinical phrases for insane premises: "non-derogatable audit protocols" that forbid explanation, "foundation-limited person" registries... yes.

  Final check: every satirical element must derive from actual MFT claims. No inventing weaknesses - just extending the logic. The user's frustration about "who audits the auditors?" is the engine. Show the system eating itself via Symmetry foundation, and we've nailed it.
answer: |-
  ## OFFICE OF MORAL FOUNDATION PARITY  
  Policy Directive OMFP-1147/Rev.3  
  Pursuant to the Foundation Parity Act 2023 (FPA)

  **1. Purpose & Scope:** This Directive operationalizes Sections 4-9 of the FPA, establishing protocols for the identification and management of Moral Palate Monoculture in public discourse. All utterances, inscriptions, or symbolic gestures intended for public reception within the jurisdiction (hereinafter "Expressions") are subject to Moral Foundation Audit (MFA) to ensure compliance with the Holistic Moral Palate Principle (HMPP).

  **2. Definitions:**
      *   **Moral Palate:** The innate suite of moral sensitivities, analogous to taste receptors, comprising six (6) discrete Foundations: Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation, and Liberty/Oppression. *(Note: The Symmetry Foundation, per Addendum OMFP-SYM1, is provisionally recognized under Clause 7).*
      *   **Individualizing Foundations (IF):** Care/Harm, Fairness/Cheating, Liberty/Oppression. Primarily concerned with the rights and welfare of individuals.
      *   **Binding Foundations (BF):** Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation. Primarily concerned with group cohesion, stability, and sacred order.
      *   **Monoculture Speech:** Any Expression found, via MFA, to engage *only* IFs *or* *only* BFs, thereby exhibiting a deficient Moral Palate and failing the HMPP.
      *   **Foundation-Limited Person (FLP):** An individual whose verified Expressions consistently exhibit Monoculture Speech, specifically an IF-only profile (BF-only profiles exceeding 0.5% prevalence trigger separate protocols under FPA Sec. 12).

  **3. Moral Foundation Audit (MFA) Protocol:**
      *   3.1 Audits are triggered by citizen complaint (Form OMFP-22B) or algorithmic detection (System MORALSCAN v.4.1).
      *   3.2 Auditors, certified under the Intuitive Moral Assessment Programme (IMAP), shall analyze the Expression.
      *   3.3 **Core Audit Principle:** Moral reasoning is understood as post-hoc justification for foundational intuitions. Therefore:
          *   3.3.1 Auditors **shall not** consider the stated reasoning, argumentative structure, or evidentiary basis of the Expression.
          *   3.3.2 Auditors **shall** assess solely the *intuitive moral resonance* elicited by the Expression's core proposition(s), mapping this resonance to the six (6) Foundations.
          *   3.3.3 **Non-Derogatable Requirement:** Auditors **must not** provide reasoned justification for their Foundation mapping. Rulings are issued solely as Foundation Activation Scores (FAS-IF/BF).
      *   3.4 An Expression registering activation *only* within the IF spectrum (Care, Fairness, Liberty) *or* *only* within the BF spectrum (Loyalty, Authority, Sanctity) constitutes Monoculture Speech.

  **4. Foundation-Limited Person (FLP) Registration:**
      *   4.1 Authors of Expressions deemed Monoculture Speech (IF-only) shall be issued a Notice of Moral Palate Deficiency (Form OMFP-17D).
      *   4.2 Upon receipt of two (2) valid NMPDs within a 24-month period, the individual is classified as Foundation-Limited (FLP).
      *   4.3 FLP status requires registration with the Office (Registry OMFP-FLP). Registered FLPs must append a standardized disclaimer ("The views expressed reflect a foundation-limited moral palate") to all future public Expressions.

  **5. Auditor Conduct & Disqualification:**
      *   5.1 Auditors operate under the principle that their own judgments are expressions of *their* foundational intuitions, necessitating a diverse Auditor pool (balanced IF/BF scores via pre-employment IMAP testing).
      *   5.2 **Critical Disqualification Clause:** Any Auditor found to have provided *reasons* for an MFA ruling, whether verbally, in writing, or through interpretive gesture, shall be immediately disqualified and referred for Recalibration (Programme OMFP-RECAL).
      *   5.3 Auditor intuition is considered the sole legitimate basis for assessment; reasoning about the assessment invalidates the process.

  **6. Recognition of the Symmetry Foundation (Provisional):**
      *   6.1 Despite objections citing theoretical parsimony and lack of cross-cultural validation by the original Office drafters, provisional recognition is granted to the Symmetry Foundation (The intuition that norms invoked against another must also bind the invoker).
      *   6.2 Recognition follows research by Dr. Elara Vance of the Pandora Institute for Recursive Ethics (PIRE), demonstrating Symmetry as a statistically recurrent, though often suppressed, intuitive response.
      *   6.3 Symmetry activation scores (FAS-SYM) are recorded separately and do not currently factor into Monoculture Speech determinations under Clause 3.4. Data collection is ongoing (Study OMFP-SYMMETRY).

  **7. Appeals Process:**
      *   7.1 Appeals against MFA rulings or FLP classification must be submitted on Form OMFP-44A.
      *   7.2 Appeals are heard by a randomly selected panel of three (3) Auditors from a different regional hub.
      *   7.3 **Appeals Restriction:** Grounds for appeal **cannot** challenge the Foundation mapping itself, the rejection of reasoned argument in the original Expression, or the intuitive basis of the ruling. Appeals may only cite procedural errors in form submission or Auditor assignment.

  ---

  **APPENDIX OMFP-A: Self-Audit of Foundational Documents & Processes**

  *   **A.1 FPA 2023 Preamble:** "Recognizing the diverse tapestry of moral intuitions woven into our national character, and seeking to prevent the impoverishment of public discourse through narrow moral frameworks..."
      *   **MFA Ruling:** Strong BF activation (Authority: "national character", "framework"; Sanctity: "tapestry", "impoverishment"). Moderate IF activation (Liberty: "diverse"). **Ruling:** Compliant HMPP (BF dominance permissible in establishing foundational order). FAS: IF-2.1, BF-4.7, SYM-0.2.
  *   **A.2 OMFP Audit Board Operations:** Analysis of ten (10) randomly selected MFA rulings from the past quarter.
      *   **Process:** Consistent application of Clause 3.3 (no reasons given). Diverse Auditor pool confirmed.
      *   **Outputs (Rulings):** 7 FLP classifications (IF-only), 3 Compliant (mixed foundations).
      *   **Symmetry Analysis (Clause 6):** FAS-SYM measured on the *Board's own rulings*. High Symmetry activation detected (mean 4.2/5) when considering if Board members would accept their *own* methods/rulings if applied *to themselves* by an equivalent authority. **Note:** This high Symmetry score remains recorded per Clause 6.3 but has no operational consequence.
      *   **MFA Ruling on Board's Outputs:** The *act of classifying others* as FLP shows strong BF activation (Authority: classification, enforcement; Loyalty: upholding the FPA 'ingroup' norm). Negligible IF activation observed concerning the *impact* on classified FLPs. **Ruling:** Monoculture Speech detected (BF-only profile). FAS: IF-0.3, BF-4.8, SYM-4.2. **Action:** Notice of Moral Palate Deficiency (Form OMFP-17D) issued to the collective Audit Board entity. *(Second NMPD would trigger FLP status per Clause 4.2, requiring Board registration and disclaimer)*.
  *   **A.3 This Policy Directive (OMFP-1147/Rev.3):**
      *   Intent: To establish binding procedures (BF: Authority).
      *   Effect: Classifies others based on intuitive assessment (BF: Authority, Loyalty to FPA; potential Sanctity violation via "impoverishment" metaphor).
      *   Reasoning: Explicitly forbids reasoning (BF: Authority/Subversion paradox?).
      *   Self-Exemption: Fails to mandate equivalent foundation coverage *within this directive* or for the Office itself, beyond the Auditor pool.
      *   **MFA Ruling (Provisional):** Overwhelming BF activation. Minimal IF activation (Liberty: citizen complaint mechanism). Negligible Symmetry activation concerning its own binding nature on the authors. **Ruling:** Monoculture Speech detected (BF-only profile). FAS: IF-1.0, BF-4.9, SYM-0.5. **Action:** Notice of Moral Palate Deficiency (Form OMFP-17D) issued to the Office of Moral Foundation Parity.
