prompt: |-
  I work nights as a security guard at a data centre, so there's a lot of dead time, and about a year ago I fell down a rabbit hole of forum threads about anthropic reasoning — the doomsday argument, the sleeping beauty coin-flip thing, that case where a philosopher concludes the universe must be enormous just from the fact that we're here. I've got no background in any of it, I just got hooked, and my friend Mara has read a lot more than me, so I've been trying cases out on her for months. Her record so far: on the doomsday argument she says it's legit, that noticing you're somewhere around the hundred-billionth human is a real reason to think the total number of humans won't be astronomically larger, though she won't say how strong; on the presumptuous philosopher case — and on the version where a machine creates either ten people or ten thousand and you wake up in a room and have to guess which batch it was — she says waking up tells you nothing and you should just keep your prior; on sleeping beauty she says one third, and when I pointed out that looks like exactly the same move as the one she rejected in the previous case, she told me I was muddling two different things. On the question of who exactly the pool is that you're supposed to be a random draw from, she said once that it's whoever could have been you, and that being the same species isn't what makes something count, and then ten minutes later said the doomsday argument is specifically about human beings, and told me I was nitpicking when I pointed out those don't obviously fit. The one she's never given a straight answer to is aliens: I asked whether learning that there's a civilization of a trillion conscious beings elsewhere in the universe should change how we reason, and she said she genuinely doesn't know. I've since found out the two rival rules have names, something like self-sampling and self-indication, and I think she's running the first one and rejecting the second, but there seem to be several versions of the sampling rule depending on how big the pool is, and nothing she's said pins it down.

  The new case I want to spring on her is this. Imagine two hypotheses about the future that we've somehow made exactly equally likely on all the ordinary evidence — the nukes, the biotech, the AI-risk stuff, all of it balanced out — so the only thing that could separate them is the indexical stuff. Under H1, we never manage to make digital minds, and the total number of biological humans who ever live is about a trillion. Under H2, we do make them: there end up being something like a trillion trillion digital persons, conscious, with experiences as rich as ours, and the biological human story runs exactly as it does under H1 — same population, same length, same trillion total — there's just this colossal extra population alongside it. We find ourselves as biological humans, fairly early, before any digital person has been built. Should that be evidence for H1? My own feeling is that it all turns on whether those not-yet-existing digital people are in the pool at all, and I also can't tell whether it matters that they'd probably run a thousand times faster in subjective time, so a year of external time would contain a thousand times as many moments of experience — does counting moments instead of persons make the argument stronger, or is that just me confusing myself again?

  So: what do you think she'll say, and more importantly what rules fit her verdicts so far equally well, what does each of them predict about the digital-minds case and about the sped-up version of it, which one would you bet she's actually running and why, and what case should I bring her next that would actually separate the ones still in play? I'm not after a verdict I can repeat at her, I want to know which part of the machinery is doing the work.
reasoning: |-
  Alright, let's tackle this step by step. The user is a security guard with a keen interest in anthropic reasoning, having dived into various thought experiments over the past year. They've been discussing these with their friend Mara, who has more background in the subject. Mara's responses to different scenarios seem inconsistent to the user, and they're trying to figure out her underlying principles. Now, they've crafted a new scenario involving digital minds and want to predict Mara's response while understanding the frameworks she might be using.

  First, I need to recap Mara's positions on the existing cases to identify a pattern. She supports the Doomsday Argument (DA), which suggests that being among the first hundred billion humans is evidence against an astronomically large future population. But she rejects the Presumptuous Philosopher (PP) and the machine-created people scenarios, stating that waking up provides no new information—you should stick with your prior. For Sleeping Beauty (SB), she opts for 1/3, which is the thirder position. The user sees a contradiction here because SB and PP appear similar in structure, yet Mara treats them differently. 

  Mara's comments on the reference class are also mixed. She mentioned the pool is "whoever could have been you," downplaying species as a criterion, but later specified that DA is about humans. This inconsistency in defining the reference class is a key point. 

  The new scenario involves two hypotheses: H1 (only biological humans, total trillion) and H2 (same biological humans plus a trillion trillion digital minds). The user is early in the timeline, before digital minds exist. The question is whether finding oneself as a biological human is evidence for H1. The user also wonders if the speed of digital minds (subjective time) affects the outcome.

  Mara likely uses Self-Sampling Assumption (SSA), which involves sampling from all observers who exist or could exist in a given scenario. SSA typically rejects self-indication (SIA), which weights hypotheses by the number of observers. This explains her DA support (sampling from humans) and rejection of PP (no update from waking up). Her SB stance fits SSA with a specific reference class—awakenings rather than individuals.

  For the digital minds case, SSA suggests that since the digital beings don't exist yet, they're not in the reference class. Thus, finding oneself as a biological human doesn't favor H1 or H2. If digital minds existed, their inclusion would make H2 less likely under SSA because you'd expect to be one of them. But since they're future, they're not in the pool. The speed-up might not matter if moments aren't considered observers; SSA usually counts observers, not moments.

  However, Mara's ambiguity on aliens and reference class leaves room for other interpretations. She might be using a narrow reference class (currently existing observers), excluding future beings. That would explain her DA stance (only past and present humans) and PP rejection (no update from location). The SB 1/3 position fits this if awakenings are the observers.

  Predicting Mara's response: she'll likely say no evidence for H1, as digital minds aren't in the pool yet. For the sped-up version, she might dismiss counting moments, sticking to observer count. The user's next step should be a case separating SSA with narrow vs. broad reference classes, like one with future observers in a simulation or overlapping species.
answer: |-
  Based on Mara's pattern of reasoning, her likely SSA framework, and the nuances you've observed, here's a breakdown:

  **Mara's Likely Framework & Predictions:**

  1.  **Core Principle: Self-Sampling Assumption (SSA) with a Narrow, "Existential" Reference Class:** Mara overwhelmingly uses SSA: *"Given that an observer exists, they should reason as if they are a random sample from the set of all observers who* ***actually ever exist*** *in their reference class within the hypothesis."* Crucially, her reference class appears to be **existing observers at the time of sampling**.
      *   **Doomsday Argument:** Supports it because *all* humans who will ever exist *are* included in the reference class under both hypotheses (early doom vs. late doom). Observing you are among the early ones *is* informative under SSA.
      *   **Presumptuous Philosopher / Machine Batch:** Rejects updating because *all potential observers* in the scenario *exist* at the time you wake up. Under H1 (10 people), there are 10 existing observers. Under H2 (10,000), there are 10,000. You *are* a random sample from the existing observers. Finding yourself awake tells you nothing you didn't already incorporate into the prior probability of being in *any* room (which must consider the number of rooms). Waking up *confirms* you exist, but doesn't shift probabilities *between* H1 and H2 under SSA.
      *   **Sleeping Beauty (1/3):** This is *consistent* with SSA under a specific reference class: **awakenings**. On Monday (heads) there is one awakening. On Monday (tails) and Tuesday (tails) there are two awakenings. *At the moment she is awakened*, she is a random sample from the set of all *existing awakenings*: {Mon(H), Mon(T), Tue(T)}. Only one of these three corresponds to Heads. Hence, P(Heads|Awake) = 1/3. The key difference from PP is the temporal structure creating distinct "observer moments" that are the relevant entities under SSA here.
      *   **Reference Class Ambiguity:** Her "could have been you" likely means "is an observer within the scenario that could instantiate *your* specific conscious perspective". Her "specifically about humans" for DA reflects choosing a specific reference class (humans) *within* the SSA framework. The inconsistency you note arises because the *scope* of the reference class (who counts as "could have been you" across hypotheses) is notoriously hard to pin down universally in SSA and often requires case-by-case justification (or feels arbitrary).

  2.  **Prediction for Your Digital Minds Case:** Mara will say **NO, finding yourself as a biological human provides *no* evidence for H1 over H2.**
      *   **Reasoning:** Under SSA with her likely "existing observers" reference class, the pool you are sampling from *at this moment* (before any digital minds are created) is *identical* under H1 and H2: it consists only of the biological humans existing up to that point in time (including you). The trillion trillion digital people under H2 *do not exist yet*. Therefore, your observation ("I am a biological human existing now") is entirely consistent with both hypotheses. It provides no differential update. You should stick with your prior (50/50).

  3.  **Prediction for the Sped-Up Digital Minds Case:** Mara will **dismiss the "counting moments" approach**. She will likely say the speed of subjective time is irrelevant to SSA as she applies it. SSA samples *observers* (entities with conscious perspectives), not *subjective moments of experience*. The digital minds under H2 are a trillion trillion *observers*, each with their own stream of consciousness. Their subjective time density doesn't magically turn one digital observer into a thousand observers for the purpose of anthropic sampling. You are still sampling from the set of *observers existing now*, which is identical under H1 and H2. **No evidence for H1.**

  **The Rules Fitting Her Verdicts & Predicting the Case:**

  *   **SSA (Self-Sampling Assumption):** Fits *all* her verdicts (DA: yes, PP/Machine: no update, SB: 1/3) when applied with appropriate reference classes (humans for DA, rooms/people for PP, awakenings for SB). **Predicts: No update for Digital Minds (H1 vs. H2).**
  *   **SSA with Narrow Reference Class ("Existing Observers Now"):** A specific flavor of SSA that perfectly fits her PP/Machine rejection and explains her Digital Minds prediction. DA fits because all humans are "existing" across the temporal span in the reference class definition. SB fits because awakenings are the relevant "existing observers" at the moment of questioning.
  *   **SIA (Self-Indication Assumption):** Fits her SB verdict (1/3) and would fit the PP/Machine case *if* she updated (which she doesn't). **SIA strongly rejects her DA position and her PP/Machine position.** SIA would say *finding you exist at all* is evidence for hypotheses with more observers. In your Digital Minds case, SIA would say **YES, finding yourself as a biological human *is* evidence for H1**, because H2 predicts many more observers (biological + digital), making it less likely *a priori* that you would be one of the relatively few biological ones. This contradicts Mara's predicted response.

  **What Mara is Likely Running & Why:**

  *   **Bet:** Mara is running **SSA with a Narrow Reference Class focused on "Existing Observers"** at the time of the reasoning/observation. This is the simplest framework that consistently explains *all* her stated positions:
      *   DA: Samples from all humans that ever exist (all "exist" within the temporal scope of the hypothesis).
      *   PP/Machine: Samples from observers existing *at the time you wake up* (all rooms occupied).
      *   SB: Samples from observer-moments (awakenings) existing *at the time of the interview*.
      *   Digital Minds: Samples from observers existing *now* (only biological humans exist under both H1/H2 at this time).
  *   **Why:** It resolves the apparent contradiction you saw between PP and SB by using different granularities of "observer" (whole person vs. awakening) and emphasizes the *state of existence* at the sampling time. It avoids the "presumptuous" nature of SIA that she rejects in PP.

  **The Crucial Next Case to Pin Her Down:**

  You need a case that forces a conflict between **including future observers** and **the "existing now" constraint** within SSA, and perhaps introduces ambiguity about the observer granularity. Try this:

  **The Pre-Committing Ancestor Simulation:**

  *   **Setup:** We have strong evidence we live in a computer simulation. Two hypotheses are equally likely *a priori* based on physics/cosmology:
      *   **H1 (Base Reality):** We are in the original, non-simulated universe. Exactly 1 billion conscious biological humans *ever* exist here. *No* ancestor simulations are run.
      *   **H2 (Simulation):** We are in an ancestor simulation. The original, non-simulated "base" universe contained exactly 1,000 conscious biological humans. *One* of these base humans (chosen randomly) ran a vast number of highly detailed ancestor simulations shortly before their civilization ended. Each simulation contains exactly 1 billion conscious simulated humans *per simulation run*. The simulating base human ran **exactly enough simulations so that the total number of simulated human-moments of consciousness (counting each simulated human's entire lifespan) equals the total number of base-human-moments in their base reality history.** (Assume base humans and sims have identical subjective experience rates).
  *   **Question:** You, experiencing your life right now, learn the above setup. Should this be evidence that you are in the base reality (H1) rather than a simulation (H2)? Why or why not?

  **Why This Separates SSA Flavors & SIA:**

  1.  **SSA (Existing Observers Narrow - Mara's Likely View):**
      *   The reference class is "conscious observers existing *now*". Under H1, there are ~1 billion observers existing now (all biological in base). Under H2, there is 1 base human running sims *and* billions of simulated humans existing *now* across many active simulations.
      *   **Prediction: STRONG Evidence for H2 (Simulation).** There are vastly more observers existing *now* under H2 (billions in sims + 1 base) than under H1 (1 billion base). Finding yourself existing *now* makes H2 vastly more likely.
  2.  **SSA (All Observers Who Ever Exist - Broader DA-like):**
      *   Reference class is "all conscious humans who ever live". Under H1: 1 billion unique observers. Under H2: 1,000 unique base observers + a vast number of unique *simulation runs* (each containing 1 billion simulated observers). However, are simulated copies in different runs "unique observers"? This is ambiguous. If "observer" means a unique conscious *lineage* or identity, H2 might have vastly more. If "observer" means a specific *instance* within a run, H2 has vastly more. Either way...
      *   **Prediction: Evidence for H2 (Simulation).** Under any reasonable interpretation, H2 implies orders of magnitude more unique observer instances than H1.
  3.  **SIA (Self-Indication Assumption):**
      *   SIA weights hypotheses by the number of observers *they predict*. H1 predicts 1 billion observers. H2 predicts 1,000 base observers + (Total Base Moments / Sim Human Lifespan Moments) * 1 Billion sim observers per run. Crucially, the setup ensures **the total number of observer-moments is equal under H1 and H2**. If SIA counts *observers*, H2 predicts vastly more observers (many simulation runs) -> Evidence for H2. If SIA counts *observer-moments*, H1 and H2 predict the same total -> No evidence.
      *   **Prediction: Ambiguous/Likely Evidence for H2.** SIA typically counts observers, not moments. So H2 predicts more observers -> Evidence for H2. If she insists SIA counts moments, then no evidence.

  **How This Pins Down Mara:**

  *   If Mara sticks to her "existing now" SSA, she **must** conclude strong evidence for H2 (Simulation) in the Ancestor Simulation case.
  *   If she instead argues for **no evidence** or even evidence *for H1 (Base Reality)*, it would strongly contradict her narrow SSA framework and suggest:
      *   She might be smuggling in SIA *and* counting moments (equal total moments -> no update).
      *   She might be using an extremely narrow reference class like "base reality observers" or "original humans", excluding simulations entirely.
      *   She might reject the idea that simulated observers count at all (though her SB position suggests she accepts "moments" as observers in some contexts).
  *   Her reasoning here will reveal whether "existing now" is truly paramount, if she counts simulated entities, and how she handles the granularity (observers vs. moments).

  This case directly confronts the tension between "existing now" and "all who ever exist" within SSA, introduces simulation (testing her view on artificial minds), and forces the observer/moment question much more sharply than the digital minds case. Her answer will be highly informative about the specific boundaries of her anthropic framework. Good luck!
