answer: |-
  Below is a structured, improved design for your 90-minute seminar, grounded in decision theory, game theory, and pedagogical experience. I've refined your provisional plan to heighten tension, ensure experiential learning, and address potential pitfalls. The design prioritizes your core goals: making both causal and evidential/logical reasoning compelling, exposing their incompatibility, and letting student actions drive insights. I first sketch two alternative skeletons, explain why I rejected them, then present the chosen design with justifications, pressure-tested wrinkles, and debrief mapping.

  ---

  ### **Rejected Candidate Skeletons**
  1. **Skeleton A: Reverse Order (Luring Lottery First)**  
     - Start with Luring Lottery to introduce many-player incentives, then Platonia, then wrinkles.  
     - **Why rejected**: Luring Lottery’s continuous strategy space (ticket numbers) dilutes the clean binary tension of Platonia (send/abstain). It risks muddying the "restraint vs. dominance" clash before students grasp the core paradox. Also, Luring’s arms race might overshadow Platonia’s symmetry—your primary focus.

  2. **Skeleton B: Integrated Asymmetry Early**  
     - Begin with asymmetric Platonia (your wrinkle) to break symmetry from the start, then symmetric Platonia, then Luring.  
     - **Why rejected**: Asymmetry undermines the superrationality argument prematurely. Students need to *feel* the symmetry pull (e.g., "we’re all identical, so my choice is everyone’s") before seeing it break. Starting asymmetric weakens the evidential reasoning’s intuitive force and reduces the "aha" moment when symmetry fails.

  ---

  ### **Chosen Design: Phased Tension Escalation**
  **Total Time**: 90 minutes  
  **Core Structure**: Platonia (symmetric) → Luring Lottery → Platonia (asymmetric) → Platonia (copy rule) → Debrief.  
  **Why chosen**: Builds tension incrementally. Starts with pure symmetry to maximize evidential/logical pull, escalates to many-player dynamics (Luring), then adds wrinkles to fracture symmetry and test robustness. Debrief ties each phase to theory.

  #### **Phase 1: Symmetric Platonia (20 mins)**  
  - **Setup**:  
    - Distribute envelopes and index cards.  
    - Instructions (verbatim): *"Write SEND or ABSTAIN. Seal your card. The £40 voucher is awarded only if exactly one SEND is received. If zero or multiple SENDs, I destroy the voucher (or donate to [disliked cause]). Decisions are simultaneous and private."*  
    - Collect envelopes in a hat. Reveal and count SENDs publicly. Record outcome on the board.  
  - **Why no lecture**: Forces students to confront the paradox immediately. Economists will lean causal ("My action can’t affect others; I might as well send"). Philosophers/computer scientists may intuit evidential symmetry ("If I send, others likely do too").  
  - **Predictable failure**: With 18 students, probability of exactly one SEND is \(18 \times (0.5)^{18} \approx 0.00007\)—near-certain voucher destruction. **Use this!** Highlight the tragedy: *Everyone acted "rationally," all lost*.  
  - **Improvement over your plan**: No talk yet. Let failure sting. Silence amplifies tension; students will whisper, but enforce privacy to isolate individual reasoning.

  #### **Phase 2: Symmetric Platonia with Cheap Talk (15 mins)**  
  - **Setup**:  
    - Announce: *"You have 3 minutes to openly discuss. Then, we repeat the ballot under identical rules."*  
    - After talk, repeat Phase 1: new cards, sealed envelopes, simultaneous submission.  
  - **Cheap talk? Yes, but with guardrails**:  
    - Permit open discussion to let coordination emerge (e.g., "Let’s pick one sender via lottery").  
    - **Keep ballot honest**: Use sealed envelopes collected simultaneously. Students cannot change cards post-talk. *Crucially*, stand aside during talk—observe but don’t mediate.  
  - **Why this works**:  
    - Coordination attempts (e.g., public promises, lotteries) will form but crumble. Defectors will emerge (e.g., economists citing dominance, a joker sending "for fun").  
    - **Key insight**: Superrationality is a *private substitute for public coordination*. When institutions fail, students see why Hofstadter’s "rational restraint" feels necessary yet elusive.  
  - **Risk**: A student might declare, "I’m sending—everyone else abstain!" If believed, this could "succeed" (one SEND), but likely multiple will defect. If it happens, note it for debrief: it reveals the instability of unilateralism.

  #### **Phase 3: Luring Lottery (20 mins)**  
  - **Setup**:  
    - Instructions: *"A pot of 180 points (worth chocolates or credit) will be split equally per ticket. One ticket is drawn at random; its owner wins the entire pot. Write any integer ≥0 as your ticket claim. Higher claims raise your chance of winning but dilute the pot."*  
    - Round 1: No talk. Collect claims, compute total tickets \(T\), award pot \(180/T\) to the drawn winner.  
    - Round 2: Allow 2 minutes of talk, repeat.  
  - **Scale and arithmetic**: Set pot = 180 for 18 students. Each ticket reduces others’ expected winnings by \(180/T^2\) (visible on whiteboard: e.g., if \(T=18\), each ticket worth 10; if \(T=19\), worth ≈9.47; extra ticket costs others \(0.53 \times 18 \approx 9.54\) total).  
  - **Allow absurd numbers? Yes**. Like Hofstadter’s readers, let students submit huge claims (e.g., 1,000). This accelerates the arms race.  
  - **Why two rounds**: Round 1 shows individual incentives (Nash equilibrium is unbounded claims → pot → 0). Round 2 exposes coordination failure after talk (e.g., agreeing to claim 1, then defectors claim 100).  
  - **Sabotage risk**: A student might claim a huge number to "tank" the pot. **Use this!** It mirrors real-world spite and shows the mechanism’s fragility.

  #### **Phase 4: Asymmetric Platonia (15 mins)**  
  - **Setup**:  
    - Privately give 6 students (1/3) a sealed card: *"If you ABSTAIN, you get a £5 prize regardless. If you SEND, you forfeit this and may win the £40 voucher."*  
    - Give 12 students: *"ABSTAIN wins nothing. SEND may win £40."*  
    - Repeat Phase 1 (no talk, sealed ballot).  
  - **Why after symmetric phases**: Breaks symmetry *after* students feel its pull. Questions raised: *Does superrationality require exact similarity? What if agents are 90% similar?*  
  - **Predicted outcome**: Asymmetric students likely ABSTAIN (safe option). Others may SEND, leading to multiple SENDs. **Debrief insight**: Superrationality collapses without symmetry. Restraint only "works" if all agents are identical and know it—otherwise, 1/𝑁 randomization fails.

  #### **Phase 5: Copy Rule Variant (15 mins)**  
  - **Setup**:  
    - Announce: *"New rule: With probability \(q = 0.5\), your card is discarded and replaced by a copy of a random other student’s card. Otherwise, your card stands."*  
    - Repeat Phase 1 (no talk, sealed ballot).  
  - **Implementation**:  
    - After collecting cards, roll a die for each student (e.g., odds = copy, evens = keep). For "copy" students, draw a random card from the hat and use it.  
  - **Threshold calculation**: A student expecting fraction \(r\) of others to ABSTAIN should ABSTAIN if:  
    \[
    q > \frac{1}{n} \quad \text{or} \quad \text{more precisely, } q > \frac{1 - r}{n - (n-1)r}
    \]  
    (Derivation: Abstain if expected loss from copying exceeds gain from unilateral sending. With \(n=18\), \(r=0\), threshold \(q \approx 0.056\); with \(r=0.5\), \(q \approx 0.118\).)  
  - **What it shows (and doesn’t)**:  
    - **Shows**: Causal correlation makes restraint rational (abstaining lowers risk of being copied to send). At high \(q\), it validates evidential logic *mechanically*.  
    - **Doesn’t show**: Superrationality’s core claim—that logical dependence (without causal links) justifies restraint. It’s a "training wheels" version; debrief must clarify the gap.  
  - **Pressure test**: At \(q=0.5\), restraint is strongly incentivized. If students ABSTAIN more here, it highlights how causal dependence resolves the paradox—but also how real-world Platonia lacks it.

  ---

  ### **Debrief (15 mins)**  
  Map phases to theory:  
  1. **Phase 1 & 2 (Platonia)**:  
     - Dominant strategy → **Causal Decision Theory (CDT)**: "My action doesn’t affect others; send is free chance to win."  
     - Symmetry → **Evidential/Functional Decision Theory (EDT/FDT)**: "My choice is evidence of others’; if I send, they do too → we lose."  
     - Group coordination → **Institutions as EDT substitutes**: Public lotteries/promises replicate superrationality’s goal but fail without enforcement. Defection exposes CDT’s grip.  
     - Anchor to **Newcomb’s**: CDT = two-box, EDT/FDT = one-box. Platonia is "Newcomb with 𝑁 players."  

  2. **Phase 3 (Luring)**:  
     - Runaway claims → **Many-player Prisoner’s Dilemma**: Dominant strategy (claim more tickets) → tragedy of the commons. Connects to Phase 1: 𝑁-player failure of CDT.  

  3. **Phase 4 (Asymmetry)**:  
     - **Superrationality’s fragility**: Requires exact similarity (homogeneous agents). At 90% similarity, 1/𝑁 randomization fails—agents must know others’ incentives and rationality.  

  4. **Phase 5 (Copy rule)**:  
     - 𝑞 as **causal EDT enabler**: Threshold 𝑞 shows when restraint becomes CDT-rational. But real Platonia has 𝑞=0—so why restrain? Debate whether logic alone justifies acting *as if* 𝑞>0.  

  **Instructor hypothesis**: Confirmed. The group’s coordination attempt (Phase 2) and collapse will be pivotal. Superrationality emerges as internalized coordination—"If I can’t trust them, I must *be* the one who restrains."

  ---

  ### **Predictable Pitfalls and Mitigations**  
  - **Phase 1/2 failure uninformative?** With 18, success (one SEND) is near-impossible. **Mitigation**: Use destruction/donation of voucher. The visceral loss teaches more than success—it *forces* coordination in Phase 2.  
  - **Economists dominate Phase 1?** Likely. **Use it!** Their "send is dominant" arguments prime philosophers for evidential pushback.  
  - **Joker sends "for fun"?** Embrace it. Shows real-world noise; debrief on how irrationality complicates superrationality.  
  - **Sabotage in Luring?** If a student submits 1e6 tickets, compute \(T\) and show the pot → 0. Lesson: Mutual destruction is easy.  
  - **Asymmetry confusion?** Clarify pre-ballot: "Asymmetric students: Your card explains your private bonus. Others: No bonus."  

  ### **What the Activity Cannot Reproduce**  
  - **Stakes**: £40 isn’t life-changing. Students might not take it seriously.  
  - **Repeated interactions**: No shadow of the future—defection has no consequences.  
  - **Partial similarity**: Real agents differ in beliefs, risk-aversion, rationality. Activity simplifies (all get same instructions).  
  - **No real copy rule**: The device simulates correlation but doesn’t validate logical dependence.  

  ---

  ### **Final Tips**  
  - **Timekeeping**: Use a visible timer. Cut discussion at 3 mins.  
  - **Whiteboard**: Track ballot outcomes, Luring’s \(T\) and \(180/T\), and debrief concepts.  
  - **Honesty in ballots**: Enforce sealed envelopes; collect simultaneously.  
  - **Emotion**: Destroy/donate the voucher dramatically. It raises stakes symbolically.  
  - **Your role**: Be a dispassionate rule-enforcer. Let students drive the conflict.  

  This design maximizes tension, exposes theoretical clashes through action, and pressures your wrinkles. It accepts imperfection—low 𝑁, trivial stakes—but turns them into lessons. Run it, then iterate!
