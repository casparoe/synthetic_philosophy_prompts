  Why reject Candidate 2? It might be too focused on Platonia and not show the Luring Lottery as a many-person version of the same problem. Also, Luring Lottery is a great example of the runaway effect.

  Why reject Candidate 1? It might be too long and we have only 90 minutes. We must be mindful of time.

