  - Then introduce asymmetry and run again (no talk? or with talk?).
  - Then copy rule (with a chosen q) and run.
  - Then Luring Lottery as a separate but related example (time permitting?).

  Candidate Skeleton 3: Start with Luring Lottery to Build Intuition
