  We are designing a 90-minute seminar for 18 students (mix of philosophy, economics, computer science) who are familiar with the prisoner's dilemma and Newcomb's problem but new to Hofstadter's Platonia and the Luring Lottery.

  The goal is to have students experience the tension between two lines of reasoning:
  1. Causal decision theory: Your action (sending or abstaining) cannot causally affect others, so you might as well send because it costs nothing and you might win.
  2. Evidential/functional decision theory with symmetry: In a symmetric situation, whatever you do, others will do the same, so the only way to get the prize is to abstain (or randomize appropriately).

  We want the tension to emerge from their actions, not from a lecture.

  Materials: index cards, envelopes, hat, whiteboard, one book voucher (about £40) that we can destroy or give to a disliked cause if the collective outcome is bad.

  Provisional plan:
  - Start with a silent simultaneous one-shot ballot for Platonia: each marks "send" or "abstain" on a card. The voucher is awarded only if exactly one sender; otherwise destroyed (or given away).
  - Then, allow 3 minutes of open talk and hold a second ballot (to see if they coordinate and if anyone defects).
  - Then, a Luring Lottery phase: a pot (say, 180 points or 180 small edible items) is split by the total number of tickets claimed. One ticket is drawn at random to win the entire pot. We need to decide whether to allow absurd numbers (like the magazine) and whether to run a second round.
  - Then, two wrinkles:
    a. Asymmetry variant: Privately give about 1/3 (6 students) a sealed card guaranteeing a smaller prize if they abstain. The rest get nothing for abstaining.
    b. Copy rule: Before a final ballot, announce that with probability q, a student's card is replaced by a copy of a randomly chosen other student's card. We need the threshold q at which a student should abstain if they expect a fraction r of others to abstain.

  Debrief: Map moments to ideas (dominant strategy, symmetry, Newcomb, 1/N randomization, runaway in Luring Lottery).

  Instructor's hypothesis: The group's attempt to build an institution (lottery or promise) and its collapse will be instructive, showing superrationality as a private substitute for coordination.

  Potential pitfalls: 
  - A student might announce they are sending and tell others to abstain.
  - A joker sends for fun.
  - Economists might assert dominance and all send in phase one.
  - With 18 people, the probability of exactly one sender is very low (so failure might be uninformative).
  - Sabotage in Luring Lottery (submitting very high numbers).

  What the activity cannot reproduce: high stakes, repeated interactions, partial and contested similarity, no real copy rule.

  Now, let me sketch a few candidate skeletons for the session and then choose one.

  Candidate Skeleton 1: Strictly Sequential Phases
  - Phase 1: Platonia (one-shot, no talk) -> collect and reveal.
  - Phase 2: Allow 3 minutes talk, then second Platonia ballot.
  - Phase 3: Luring Lottery (with or without talk? We might do one round without talk and then one with? Or without talk first to see the arms race?).
  - Phase 4: Asymmetry variant (with no talk? or with talk? We want to break symmetry so perhaps no talk?).
  - Phase 5: Copy rule variant (with a fixed q, say 0.5, and then run?).

  Candidate Skeleton 2: Focus on Platonia and Variations
