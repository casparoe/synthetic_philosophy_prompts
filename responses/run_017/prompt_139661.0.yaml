  The user's three options each have significant trade-offs:
  - Draft 1: Keeps meaning and meter but loses the motto entirely.
  - Draft 2: Forces the vertical motto (LOVE ABOVE, etc.) but distorts the poem's meaning and tone.
  - Draft 3: Creates a new English poem centered on the motto words, sacrificing semantic fidelity.

  The editor suggests Draft 1 with a footnote, while the singer wants readability. But the user's deeper concern seems to be about authenticity—whether preserving the discovered device is essential to honoring the poem's artistry.

  Key considerations:
  - **Intentionality matters**: If the motto is deliberate (as evidence suggests), omitting it loses a structural innovation that elevates the poem beyond conventional verse. A footnote explains but doesn't replicate the experience of discovering the pattern.
  - **Functional purpose**: The recital audience will read the translation silently while hearing French. A visual device like the motto could enhance their engagement if preserved.
  - **Trade-offs**: Draft 2's tonal distortion (accusatory ending) seems too high a price. Draft 3's loose approach might please modern readers but risks becoming derivative.

  Best path forward:  
