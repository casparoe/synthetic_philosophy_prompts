  Below is a decision tree designed to sort positions on vagueness based on concrete cases, avoiding theoretical terminology. The tree uses three shared data points: chip 1 is red, chip 10,000 is not red, and no observer can locate the change. It incorporates your specified cases (the machine-printed chips with a deleted log, the statutory term with lost committee minutes, and the two speakers disagreeing on a borderline chip). The tree has seven leaves, covering the required positions and one unoccupied cell, with one internal question per node. Each leaf includes one sentence on its most awkward commitment, and the pivotal node separating epistemicism from rivals is identified.

  ### Decision Tree
  The tree is built from three independent axes:  
  1. **Sharp boundary**: Does the predicate have a precise cutoff?  
  2. **Classical logic preservation**: Are binary truth values and logical rules (e.g., excluded middle) upheld?  
  3. **Source of indeterminacy**: Is the fuzziness in the world, language, or our knowledge?  

  These axes generate logical space, with named views placed in compatible cells. Unoccupied cells are noted as unattractive (due to arbitrariness) or incoherent (due to contradictions). Questions use concrete scenarios without labels like "vague" or "borderline."  

  ---

  **Start at the root question:**  

  1. **Two people observe the same chip series. They agree chip 1 is red, chip 10,000 is not red, and all chips look identical, but they disagree on chip 5000. Is one of them factually wrong?**  
     - **Yes (one is wrong)** → Go to 2.  
     - **No (neither is wrong)** → Go to 3.  

  ---

  **Branch A (Sharp boundary path):**  
  2. **In the machine-printed chip series, a random-number generator fixed a cutoff point for "red," but the log was deleted and no trace exists. Is there still a fact about which chip is the last red one?**  
     - **Yes** → Go to 4.  
     - **No** → **Leaf: [Incoherent cell]**  
       *Why incoherent?* Denying a sharp boundary here contradicts the prior "yes" to a factual error in the two-speaker case, implying inconsistent treatment of natural vs. artificial predicates.  

  3. **In the statutory term case, a committee fixed a cutoff for "reasonably safe" (e.g., a specific risk threshold), but the minutes were lost. Is there a fact about the exact boundary?**  
     - **Yes** → **Leaf: [Unoccupied: Stipulated boundaries only]**  
