  - **Pivotal node**: Question 1 (two speakers) does the most work, separating epistemicism (sharp boundaries) from rivals (non-sharp boundaries). A "yes" here commits to a factual boundary, leading to epistemicism unless contradicted; a "no" opens all non-sharp views.  
