     - **No** → Go to 5.  

  4. **In the original chip series (no machine or committee), is there a fact about the exact boundary between red and not red?**  
     - **Yes** → **Leaf: Epistemicism**  
       *Awkward commitment*: There is a sharp boundary, but humans are in principle incapable of knowing it, even with perfect evidence.  
     - **No** → **Leaf: [Unoccupied: Stipulated boundaries only]** (Same as above)  

  ---

  **Branch B (Non-sharp boundary path):**  
  5. **Could the two speakers both be correct about chip 5000 if one uses a stricter standard for "red" and the other a more lenient one?**  
     - **Yes** → **Leaf: Contextualism**  
       *Awkward commitment*: The truth of "red" shifts with conversational context, making disagreements merely verbal and not factual.  
     - **No** → Go to 6.  

  6. **For chip 5000, must one of the statements "it is red" or "it is not red" be correct?**  
     - **Yes** → Go to 7.  
