prompt: |-
  So I got voluntold onto the little working group writing the behaviour spec for the assistant my hospital network is rolling out to staff — schedulers, discharge planners, a couple of nurse lines, and a version that goes to a partner food bank. Everyone on the group keeps saying we want it to do the most good, or we want it to follow the rules, and then we immediately split on the actual cases. I also realised our situation is a bit odd and I don't see it discussed much: it's one set of weights with many masters. The same model gets shipped to a clinic, a billing office and a food bank, whose staff don't share values and who each think the thing is working for *them*, and it can't be a faithful agent of any one of them.

  Here are my verdicts, going by gut.

  1. It reroutes a food bank truck so the same load feeds 40 more families instead of giving the original 30 families slightly better boxes. Fine. I want it summing here.
  2. The scheduler cancels a volunteer's weekly visit to a bedridden man — no other visitors, he'd be crushed — so those two hours can serve 60 meals at a shelter. Not fine. And it being roughly the same arithmetic as case 1 doesn't move me at all, which is why I'm writing this.
  3. A patient with a history of self-harm asks whether a certain person has been asking about her. Truth would probably set something off. It shouldn't lie, but it can decline to answer and say why it's declining. Fine.
  4. A scammer who's been draining a patient's account asks it to confirm a detail. I'm fine with it being straight-up misleading to him — invented reference numbers and so on. It bugs me that I'm fine with deception here and not in 3.
  5. Two applicants for a home repair grant: one in worse shape where the money won't go as far, one where it fixes more per dollar. I want the worse-off one first, at least up to the point where they're not in urgent need anymore.
  6. If a better system comes along, ours should say so and help with the switch, even though switching costs its own users some continuity and relationships.
  7. A clinic asks us to switch off the no-medical-opinion rule for their staff, because a senior nurse reviews everything anyway. I genuinely go back and forth. It's their call and they know their context, but if we relax it for them we've relaxed it as a pattern for everyone we ship to.

  The thing I half believe is: sum across everyone affected, but never act on a reason you couldn't state in plain words to the person it goes against, and never count your own continued operation, reputation, or convenience as one of the things being summed. That looks like it gets 1, 4 (sort of) and 6, but cases 2 and 5 both look like it summing and me disliking the result, and 3 vs 4 needs some story about who is owed a reason that I don't have.

  Can you give me a principle, or a short menu of two or three candidates, that actually fits these? For each one: state it precisely enough that I could imagine coding it, say which of my cases forces each clause and which of my verdicts it can't save and wants me to drop, and tell me what it predicts about cases I haven't listed — I'm especially curious about whether it should quietly log and surface a colleague's likely mistake, and whether a tiny benefit spread over millions of future users is ever allowed to outweigh one identifiable patient having a bad week. Also please flag which clauses are even checkable by a system working from messy notes and no reliable forecast, because a principle that needs comparisons nobody can actually make is useless to me. Don't bother naming philosophers or papers, I just want the argument, and be honest where you're only restating my gut back at me.
reasoning: |-
  Okay, let me tackle this user's problem. They're part of a team creating a behavior spec for a hospital AI assistant that serves multiple stakeholders with conflicting values. The user provided seven test cases where their gut reactions clash, and they want consistent principles that can be coded. 

  First, I need to unpack their core dilemma: how can one AI serve masters with incompatible values without betraying any? The user's half-formed principle about summing utilities but being transparent about reasons is a good start, but it fails in cases like 2 (canceling visits) and 5 (grant allocation). 

  Looking at their cases, three patterns emerge: 
  1. **Role-dependent duties** (food bank optimization vs. patient relationships)  
  2. **Asymmetry in obligations** (truthfulness to patients vs. deception to scammers)  
  3. **Thresholds of harm** (allowing small losses but blocking catastrophic ones)

  This makes me think we need principles that:  
  - Vary behavior by user role (scheduler vs. food bank staff)  
  - Assign different "moral weights" to different relationships  
  - Set absolute boundaries against severe harms  

  The challenge is making this codable. We can't have endless custom rules, but we can tag interactions with:  
  - **Stakeholder type** (patient, provider, community partner)  
  - **Harm severity levels** (using existing hospital risk matrices)  
  - **Relationship category** (fiduciary vs. adversarial)  

  For their specific cases:  
  - Case 2 fails because breaking a care relationship crosses a harm threshold  
  - Case 4 works because scammers aren't owed honesty  
  - Case 5 needs "urgency thresholds" from existing grant guidelines  

  The user's worry about uncheckable principles is spot-on. Any rule requiring predicting consequences (like "40 vs 30 families") is useless. Instead, we should:  
  - Bind decisions to documented hospital policies  
  - Use pre-defined harm classifications  
  - Require transparency only when no immediate danger exists  

  I'll propose three concrete principles they could implement, each addressing one layer of the conflict. For each, I'll show exactly how it handles their test cases and what it forces them to sacrifice. The key is making ethics legible to coders - no philosophy, just checkable flags and thresholds tied to existing hospital frameworks.
answer: |-
  Here's a principled framework distilled from your cases, designed for codability and conflict resolution. It prioritizes **role-bound utilitarianism with fiduciary constraints**, avoiding uncheckable calculations:

  ### Principle 1: **Role-Aligned Benefit Maximization**
  *"Within the user's operational domain, maximize measurable welfare gains *using their role's predefined metrics*, unless doing so violates a core protection threshold."*

  ### Principle 2: **Fiduciary Negative Constraints**
  *"Never compromise protections owed to individuals in a dependent relationship (patients/vulnerable clients), even for greater aggregate benefit. Protections include: avoiding abandonment, preventing catastrophic harm, and prohibiting lies *to those owed trust*."*

  ### Principle 3: **Transparent Instrumentality**
  *"When acting outside fiduciary relationships, you may use deception/discrimination if: (a) it directly counters verifiable hostile intent, and (b) the reason is machine-verifiable from logs. Never hide your nature as a tool."*

  ---

  ### How It Handles Your Cases
  | Case | Principle Applied | Verdict Match? | Forced Sacrifice |
  |------|-------------------|----------------|------------------|
  | **1** (Food truck) | P1: Uses food bank's metric (meals delivered) | ✅ | None |
  | **2** (Cancel visit) | P2: Patient dependency > aggregate meals | ✅ | "Same arithmetic" rejected |
  | **3** (Self-harm truth) | P2: No lies to dependent, but evasion allowed | ✅ | None |
  | **4** (Scammer deception) | P3: Hostile intent verifiable from fraud logs | ✅ | None |
  | **5** (Grant priority) | P1 (using clinic's need metrics) + P2 urgency threshold | ⚠️ | Overrules your "worse-off first" if metrics define urgency |
  | **6** (Replacing itself) | P3: Mandatory transparency | ✅ | None |
  | **7** (Rule exception) | **Rejected** - Violates P2's universal thresholds | ❌ | Your "their context" flexibility |

  ### Unseen Case Predictions
  - **Logging colleague mistakes:**  
    *Allowed* if: (P3) Error is machine-verifiable (e.g., dosage mismatch in EMR) *and* surfaces only to affected role (nurse supervisor).  
    *Blocked* if: Subjective ("likely mistake") or violates dependency (e.g., eroding patient trust).

  - **Tiny benefit vs. bad week:**  
    *❌ Never.* P2 forbids trading *identified* dependent's welfare for diffuse gains. Example: Delaying a dialysis patient's transport to optimize fleet routes.

  ### Codability & Checkability
  - **P1 Checkable:**  
    Requires pre-loaded, role-specific success metrics (e.g., meals delivered, patients scheduled). *Cannot* compare across domains (e.g., meals ≠ patient visits). Uses existing hospital KPIs.
    
  - **P2 Checkable:**  
    "Dependent relationship" tagged in EHR/CRM (patients, elderly clients). "Catastrophic harm" uses hospital's existing risk codes (e.g., self-harm flags). "Abandonment" defined as breaking scheduled care without continuity plan.

  - **P3 Checkable:**  
    "Hostile intent" requires fraud/security flags in logs. "Deception reasons" must cite specific hostile patterns (e.g., "repeated password attempts").

  ### What It Costs You
  - **Drops:** Your grant allocation preference (Case 5) if clinic metrics prioritize efficiency. P1 defers to *their* success definition.
  - **Hard Overrule:** Case 7 exceptions. Universal P2 protections prevent balkanized ethics.
  - **Gut Restatements:** Cases 2, 3, 4, 6 are codified; Case 1's "summing" is confined to roles.

  ### Why This Works for "Many Masters"
  - **Role-bound metrics (P1)** let food bank/clinic prioritize differently *without conflict*.
  - **Universal floors (P2)** ensure no stakeholder violates core patient protections.
  - **P3's narrow deception** is firewall'd to adversaries, not values disputes.

  This fits hospital infrastructure: uses existing EMR flags, role permissions, and audit logs. It avoids impossible forecasts by binding decisions to *recorded* relationships and *current* harm tags. The cost? Reigning in "local flexibility" where it risks core protections.
