answer: |-
  ### Q&A Prep Sheet: Tactical Responses for High-Stakes Objections  
  *(Ordered by damage potential if mishandled)*  

  ---

  #### **1. Rawlsian/Scanlonian Legitimacy Objection**  
  **Raised by:** Senior public-reason theorists (95% likely)  
  **Phrasing:** "You treat moral convictions as mere ‘preferences’ with substitution rates, reducing justice to a marketplace. But compromises must be *justifiable* to all reasonable persons, not just efficient bargains. Without a common evaluative standard, how is this *legitimate* rather than a modus vivendi?"  

  **2-Minute Reply:**  
  "Your concern is vital: my model explicitly *avoids* conflating moral convictions with preferences. The ‘substitution rates’ are not about utility but about *intrasystemic trade-off judgments* within a value framework. For instance, a Catholic hospital might judge: ‘How much stronger must conscience protections be to offset looser eligibility criteria?’ This is a moral deliberation about balancing *their own* commitments—not a preference intensity. Legitimacy here comes from mutual recognition: each side accepts the other’s right to operate within their value system when trading concessions, without endorsing the other’s values. It’s Scanlonian in spirit: justification lies in no one being forced to violate their core integrity."  

  **Soft Spot:**  
  Assumes "core integrity" is well-defined and untraded (which the value pluralist will challenge). Doesn’t fully address stability: path-dependence may make outcomes arbitrary from a public-reason perspective.  

  **Verdict:** **Hold**, but reframe: Stress this is a model of *feasible* compromises under pluralism, not a full theory of justice.  

  ---

  #### **2. Social Choice Impossibility Objection**  
  **Raised by:** Social choice theorist (90% likely)  
  **Phrasing:** "Your ‘concessions’ sound like pairwise voting over dimensions. But with path-dependent rates, agenda control determines outcomes—opening cycling or manipulation. Isn’t this just a hidden social welfare function? Prove this escapes Arrow’s axioms or Gibbard-Satterthwaite."  

  **2-Minute Reply:**  
  "Key difference: this is *bargaining*, not aggregation. Arrow’s theorem assumes a fixed set of preferences aggregated into an ordering. Here, preferences *adapt* during the process (non-integrability), so no global ordering exists. Conjecture: **Path-dependent bargaining is strategy-proof under myopic rationality**. Sketch: If actors only evaluate one-step concessions (small perturbations), misrepresentation gains nothing—you can’t fake your local resistance rate without risking immediate integrity loss. Yes, agenda control matters—that’s my *point* about procedure being constitutive. But cycling? Unlikely: identity effects act as ‘friction’ (like tariffs), making reverting concessions costlier than accepting new ones."  

  **Soft Spot:**  
  Assumes short-sighted actors (empirically dubious). Doesn’t prove cycling is impossible.  

  **Verdict:** **Concede agenda control matters** but **hold** that this isn’t a voting rule.  

  ---

  #### **3. Value Pluralist Integrity Objection**  
  **Raised by:** Value pluralist (85% likely)  
  **Phrasing:** "You assume all values are tradeable. But some commitments (e.g., ‘never kill innocents’) are deontic constraints. Trading them destroys the value system’s coherence—like selling your soul for profit. Where’s your limit?"  

  **2-Minute Reply:**  
  "I agree some constraints are absolute—but empirically, these are rare. In assisted dying, *no* actor treats every dimension as absolute: Catholics trade eligibility criteria against conscience protections; utilitarians trade access speed against error reduction. My model handles constraints: if a dimension has infinite local resistance (e.g., ‘no killing’), its substitution rate is undefined, blocking trade. The ‘compromise frontier’ lies inside the Pareto frontier precisely because integrity losses *aren’t* compensable—they’re deadweight costs. But note: even Kantians accept *some* trade-offs (e.g., ‘lying to save a life’)."  

  **Soft Spot:**  
  Doesn’t specify how to identify "absolute" constraints pre-bargain.  

  **Verdict:** **Partially concede**: Absolute constraints exist but are domain-specific. Reframe as "most real-world disputes involve *non*-absolute values."  

  ---

  #### **4. Structural Injustice Baseline Objection**  
  **Raised by:** Junior scholar (80% likely)  
  **Phrasing:** "Gains for whom? Your model measures gains from the status quo, but if the baseline is unjust (e.g., colonial land rights), ‘mutually beneficial’ trades entrench domination. Why isn’t this just liberal complicity?"  

  **2-Minute Reply:**  
  "Critical point. My model is *descriptive* of how compromises *do* occur—not prescriptive. It assumes a given baseline (which may be unjust) and shows how gains arise *relative to it*. But your concern reveals a corollary: path-dependence means initial baselines matter massively. If we start from an unjust status quo, compromise can amplify inequity—like trading away marginalized groups’ rights. This isn’t a flaw in the model; it’s a feature highlighting why procedural justice (e.g., who sets the agenda) is non-negotiable."  

  **Soft Spot:**  
  Doesn’t resolve how to *correct* unjust baselines within the model.  

  **Verdict:** **Concede** the limitation, pivot to model’s diagnostic value.  

  ---

  #### **5. Empirical Bargaining Realism Objection**  
  **Raised by:** Legislative bargaining scholar (75% likely)  
  **Phrasing:** "Real log-rolling isn’t on a ‘frontier’—it’s myopic, coercive, and reflects power imbalances. Where do ‘local substitution rates’ come from? Legislators can’t even define their ideal points, let alone marginal rates!"  

  **2-Minute Reply:**  
  "Agreed—my model is idealized. But note: substitution rates aren’t conscious calculations; they’re revealed through behavior. E.g., a legislator might accept a longer waiting period *only if* funding for palliative care increases. We observe this in amendment trades. Power? Absolutely: the model shows why powerful actors set the agenda to steer path-dependence toward their advantage. The ‘frontier’ isn’t efficient; it’s the set of *attainable* compromises given current resistance rates."  

  **Soft Spot:**  
  Hand-wavy on how rates are "revealed." Ignores coercion.  

  **Verdict:** **Partially concede** idealization, stress heuristic value.  

  ---

  #### **6. Consequentialist Covertness Objection**  
  **Raised by:** Rawlsians or value pluralist (70% likely)  
  **Phrasing:** "If gains require no common measure, how do you know they’re gains? This sounds like covert utilitarianism—‘more preference satisfaction’ in disguise."  

  **2-Minute Reply:**  
  "Gains are *Pareto-improvements in the space of value systems*: Catholics get more conscience protection; utilitarians get broader access. No inter-system comparison needed. Each judges the trade *only* by their own ranking of policy bundles. It’s ordinal, not cardinal—like trading apples for oranges when you only care about fruit variety."  

  **Soft Spot:**  
  Assumes dimensions are separable (which the value pluralist may deny).  

  **Verdict:** **Hold firmly**.  

  ---

  ### Strategic Pre-Game Concessions (First 2 Slides)  
  - **Concede 1:** "This model does *not* apply to absolute constraints (e.g., genocide prohibition)."  
  - **Concede 2:** "It assumes a *given* baseline—unjust baselines will distort outcomes."  
  - **Why costless?** Preempts value pluralist/structural objections without undermining core thesis.  

  ---

  ### The Must-Land Reply  
  **To the social choice theorist:**  
  "Arrow applies to *aggregation*; this is *bargaining with adaptive preferences*. No social ordering exists to violate his axioms."  
  **Why?** If they dismiss this, the whole formal apparatus collapses.  

  ---

  ### The Indefensible Weak Spot  
  **Non-integrability’s empirical basis:**  
  You lack a dynamic model showing *how* local rates shift (e.g., "precedent effects" are asserted, not proven). If pressed: "This is ongoing work; I’m testing it via case studies like assisted dying laws in Quebec vs. Oregon."  

  ---

  ### The Nightmare Question: Moral Money Pump  
  **Phrasing:** "If concessions change local rates, could A and B make a sequence of mutually beneficial trades that cycles back to a policy *worse for both* than the original status quo? Isn’t this irrational?"  

  **Why worse than agenda control?**  
  Agenda control is a practical flaw; cycling implies the *whole mechanism is incoherent*.  

  **Best Available Answer:**  
  "Conjecture: **Identity effects impose asymmetric costs**. Reverting a concession (e.g., revoking assisted dying access) is costlier than making it, because it violates trust and signals weakness. This creates ‘ratchet effects’: trades move in one direction. Sketch proof: If reversing concession X requires compensating Y+ε (where ε is an integrity penalty), cycling is impossible unless ε=0—but ε>0 is my thesis."  

  **Verdict:**  
  Yes, this is the worst question. It’s a direct attack on stability. Your answer is plausible but untested—hope it doesn’t come.  

  ---

  ### Summary Tactics  
  - **Neutralize Rawlsians** by divorcing "trade-offs" from preference utilitarianism.  
  - **Isolate social choice** to bargaining dynamics.  
  - **Let the empiricist** be right about messiness—it doesn’t falsify the ideal type.  
  - **If the money pump arises,** lean hard on identity-based friction (ε>0).  

  **Final Note:** The thesis is defensible but vulnerable at non-integrability. Survive the session by showing this framework *opens new questions*—it doesn’t need to close them yet.
