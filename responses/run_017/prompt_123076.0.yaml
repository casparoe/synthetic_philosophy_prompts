    - Multiple realizability: we had the same machine (same function) realized in cards, cups, and people. The physical stuff didn't matter as long as the function was the same. That's the core idea: mental states are defined by their function (the causal role) and can be realized in different substrates.

    - The dead branch/challenge phase: why was it not enough to just pass the test sequence? Because the machine must work not just for the inputs we tried, but for all inputs (even ones we didn't test). This relates to the idea that a mental state is defined by its entire causal profile, not just the inputs we happen to test. If a machine only works for the tested sequences, it's not really the same machine.

    - The component swap: we swapped parts or entire machines and they still worked (or didn't). What does that say about the identity of the machine? If we replace one part, is it the same machine? What if we replace all parts? This is the ship of Theseus paradox and relates to how we might think about the mind: if we replace neurons one by one with silicon, is it still the same mind?

    - Now, the point about "any pile of junk": during the debrief, we can ask: "Could any random arrangement of cups and pennies be considered a machine? Well, it would realize some function, but not the one we specified. Functionalism says that mental states are defined by a specific functional role. That role is not arbitrary; it's the one that the system actually plays. So if a system doesn't play the right role (like our challenge phase showed), it's not the same mental state. But note: any system does realize some function, so functionalism is not trivial because it requires the specific function that we associate with mental states."

  - Also, acknowledge what the game didn't capture: 
    - Functionalism is about mental states, not just any machine. We used a vending machine as an analogy, but the mind is more complex.
    - The game didn't address how functionalism deals with qualia (subjective experience) or intentionality (aboutness). Those are challenges to functionalism that we didn't touch.

  **Predictable Problems:**
  - The card group might finish quickly (if they just write the table and use a token) while the people group might take longer to coordinate and remember the transitions. To mitigate, provide the transition table to the people group as a cheat sheet? Or have them write it on a poster? Then they can refer to it. But we want them to internalize? Or not? For the purpose of the game, they can have the table.

  - The challenge phase might be dominated by one group. Encourage all groups to challenge.

  - The swap might be confusing. If we do the machine swap (Group1 operates Group2's cup machine), that should be doable because they just have to follow the same rules.

  **Materials:**
  - Group1: 5 index cards (labeled 0,5,10,15,20), markers, a token (a coin or a button)
  - Group2: 5 cups (labeled 0,5,10,15,20), a penny, and three types of tokens for inputs (e.g., blue paper for N, yellow for D, red for C)
  - Group3: 5 people, each assigned a state. A ball or hat as token. A cheat sheet of the transition table.

  **Spec Handout:**
  Give each group the state transition table (as above) and a brief description:

  "Your machine is a vending machine that accepts nickels (N) and dimes (D) and has a cancel button (C). It can be in one of five states: 0, 5, 10, 15, 20 (cents). The machine starts at 0. When you put in coins, it updates the state. If the state reaches 25 cents (which happens when you add to 20 with a nickel or 15 with a dime), it outputs 'VEND' and resets to 0. If you press cancel, it returns the current amount and resets to 0. If you put in a coin that would make the amount exceed 25 cents (like a dime at state 20), it outputs 'Coin rejected' and stays in the same state. Use the state table to build your machine."

  **Debrief Script Outline:**
  1. "Today we built machines that all did the same thing but with different materials. That's the idea of multiple realizability: the same function can be realized in different physical systems. In philosophy of mind, functionalism says mental states are defined by their function, not by the stuff they're made of. So in principle, a mind could be made of neurons or silicon or even people passing notes, as long as it does the same job."

  2. "During the challenge phase, we saw that it wasn't enough to just handle the test sequence. The machine had to work for every input, even ones we didn't test. That's because functionalism defines mental states by their entire causal role, not just the inputs we happen to give. If a system only works for some inputs, it's not really in the same mental state."

  3. "In the swap, we saw that even if we change the parts, as long as the function is preserved, it's the same machine. That's like the ship of Theseus: if we replace parts one by one, when does it stop being the same ship? Functionalism would say: as long as the functional organization is preserved, it's the same mental state."

  4. "But wait, couldn't any pile of junk be seen as realizing some function? True, but functionalism isn't saying that anything is a mind. It's saying that for a system to have a particular mental state (like believing it's raining), it must have the right functional organization. So our vending machine had a very specific function. If the cups were arranged randomly, they wouldn't realize that function. But note: they would realize some function, which might be very simple. Functionalism is not trivial because it requires the specific causal role that we associate with mental states."

  5. "However, functionalism faces challenges. For example, it might not explain subjective experience (what it's like to see red) or how mental states can be about things (intentionality). But that's for another session."

  This should fill an hour and hit the key points.
answer: |-
  Here’s a complete session plan designed to make functionalism and multiple realizability emerge through hands-on discovery. The activity is a **"Machine Swap Challenge"** where groups build physically different realizations of the same abstract specification, then test, challenge, and modify them. The debrief explicitly ties their experiences to the philosophical concepts.

  ---

  ### **Materials & Setup (5 minutes)**
  - **Divide into 3 groups** (5 students each). Label groups: **Team Bits** (paper/pen), **Team Cups** (cups/coins), **Team Humans** (people/corners).
  - **Materials per group** (use classroom scraps):
    - **Team Bits**: Scrap paper, pens, sticky notes.  
    - **Team Cups**: 5 plastic cups, 10 pennies (label cups: A, B, C, D, E).  
    - **Team Humans**: 5 people, whiteboard markers to label corners of the room (A, B, C, D, E).  
  - **Handout identical specs** (one per group) with no jargon:  
    > **"Simple Lock Machine Spec**  
    > - **States**: A (locked), B, C, D, E (unlocked). Start at A.  
    > - **Inputs**: 0 (try to open), 1 (insert key).  
    > - **Rules**:  
    >   - In A: If input=0 → stay in A, output="jammed". If input=1 → go to B, output="click".  
    >   - In B: If input=0 → go to A, output="jammed". If input=1 → go to C, output="click".  
    >   - In C: If input=0 → go to A, output="jammed". If input=1 → go to D, output="click".  
    >   - In D: If input=0 → go to C, output="whirr". If input=1 → go to E, output="open!".  
    >   - In E: If input=0 → go to A, output="relocked". If input=1 → stay in E, output="already open".  
    > - **Goal**: Get to E (unlocked) from A (locked)."  

  ---

  ### **Rules & Payoff (Explain to Students)**  
  - **Build Phase (15 min)**: Each group builds a machine matching the spec using their materials:  
    - **Team Bits**: Draw states on paper, use sticky notes for current state.  
    - **Team Cups**: Arrange cups in a line; put a penny in the "current state" cup. Move penny to new cup on input.  
    - **Team Humans**: Each person is a state (stand in labeled corners). Pass a "token" (e.g., book) to the next state.  
  - **Testing & Challenges (20 min)**:  
    - **Test Sequence (Facilitator runs)**: Start at A, input=1 (→B), input=1 (→C), input=1 (→D), input=1 (→E). *Groups earn 5 points if they pass*.  
    - **Challenge Phase**: Groups take turns challenging others. Challenger gives an **input sequence** (e.g., "Start at A, inputs: 0,1,0,1").  
      - If the challenged machine fails (wrong state/output), they lose 2 points; challenger gains 1.  
      - If it passes, challenger loses 1 point (deters random guesses).  
    - **Dead Branch Rule**: Points only awarded if the machine works **for all possible inputs**, not just tested ones. Groups can challenge with sequences like "Start at D, input=0" (should →C) or "Start at E, input=0" (should →A). Cheating groups lose points if caught hardcoding only tested paths.  
  - **Component Swap (10 min)**:  
    - **Round 1**: Teams swap one "part" with another team (e.g., Team Bits gives their "State C" paper to Team Cups; Team Cups gives a "State C" cup to Team Humans; Team Humans give a "State C" person to Team Bits). Teams must run their machine **with the foreign part**.  
    - **Round 2**: Teams rebuild their machine **using another team’s materials** (e.g., Team Bits rebuilds with cups/coins).  
    - **Debate**: After each swap, teams argue: "Is this still the same machine?" No points—focus on reasoning.  

  ---

  ### **Timeline (60 Minutes Total)**  
  - **0–5 min**: Split groups, hand out specs/materials. No theory—just rules.  
  - **5–20 min**: **Build Phase**. Circulate to help (e.g., suggest Team Humans assign one person to call outputs).  
  - **20–30 min**: **Test Sequence**. Run the same inputs on all groups. Award points.  
  - **30–40 min**: **Challenge Phase**. Groups test untested paths (e.g., start at D, input=0 → C).  
  - **40–45 min**: **Component Swap Round 1**. Swap one part, test if machines still work.  
  - **45–50 min**: **Component Swap Round 2**. Rebuild with new materials, test again.  
  - **50–60 min**: **Debrief**. Reveal functionalism/multiple realizability, link to game.  

  ---

  ### **Debrief (10–15 Minutes)**  
  **Reveal the concepts** and tie them to game moments:  
  1. **Multiple Realizability**: "You all built the *same lock machine* with paper, cups, and humans. The machine wasn’t about the *stuff*—it was about the *job* (states, inputs, outputs). In functionalism, mental states (like pain) are defined by their role, not biology. So a robot with silicon could 'feel pain' if it plays the same role."  
     - *Map to game*: Point out the swapped/rebuilt machines—same function, different materials.  

  2. **Dead Branches Matter**: "Why did challenges work? Matching test sequences wasn’t enough—your machine had to handle *untested paths* (like input=0 in State D). Functionalism says mental states aren’t just inputs/outputs; they must work for *all possible* scenarios, even unobserved ones."  
     - *Map to game*: Reference groups penalized for hardcoding.  

  3. **Ship of Theseus & Identity**: "When you swapped parts or rebuilt machines, some argued it was 'still the same lock,' others disagreed. Functionalism says: if the *functional organization* (the job) stays the same, it’s the same machine—even if you change parts gradually."  
     - *Map to game*: Note debates during swaps.  

  4. **"Any Pile of Junk" Tension**: "Could a random cup pile realize *any* machine? Yes—but it wouldn’t match *this spec*. Functionalism isn’t trivial because it requires a *specific* causal role. A brain isn’t a mind because of its goo—it’s because it runs the right 'program.'"  
     - *Map to game*: Contrast spec-aligned machines with a "random" cup pile (demonstrate: scatter cups—does it fit the lock spec? No!).  

  **What the game can’t capture (say this aloud)**:  
  - "Functionalism struggles with *subjective experience* (e.g., why red *feels* like red). Our game shows how states work, but not 'what it’s like' to be the machine. That’s a deeper puzzle!"  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Speed imbalance**: Team Bits finishes in 5 min; Team Humans takes 15 min.  
     - *Fix*: Give Team Bits extra tasks (e.g., "Sketch 3 challenge sequences"). Help Team Humans assign roles.  

  2. **Component swap confusion**: Teams struggle with foreign parts (e.g., humans holding cups).  
     - *Fix*: Emphasize creativity—e.g., "Use the cup as a 'state token' in your paper machine."  

  3. "**So what?**" vibe: If students find it obvious, push them in debrief: "If functionalism is true, could an ant colony running the right program *understand philosophy*? When does it stop being a lock and start being a mind?"  

  This forces engagement with the "slippery" parts: functionalism feels intuitive until you probe identity, untested paths, or whether *any* organization suffices for meaning. By making them build, swap, and defend, they’ll hit the tension naturally.
