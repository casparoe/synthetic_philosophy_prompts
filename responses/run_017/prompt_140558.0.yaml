answer: |-
  My thesis: Some things compose a whole if and only if their mutual causal activity is arranged such that it realizes a novel, collaborative power—an emergent capacity possessed by the system itself, which none of its parts possess individually and which arises intrinsically from their specific, integrated organization.

  You rightly demand a principled restriction beyond mere causal influence. I reject the notion that *any* causal interaction suffices. The key is *mutual modification within a unified functional architecture*. When parts interact, they must dynamically constrain and enable each other's states and behaviors in a way that generates a *new, stable capacity* irreducible to mere aggregative effects. Two random asteroids gravitationally influencing each other slightly do not compose a whole; their "interaction" is additive and extrinsic, not forming a system with its own causal powers. The required threshold is *functional integration*: the parts must be organized such that their causal roles are defined *relative to each other* within a persisting structure that actively maintains the capacity for the collaborative power, even when dormant. This avoids universal composition because most pluralities lack this reciprocal, role-defining integration.

  The relay stations are a welcome test case, not a counterexample. Spatial proximity is irrelevant; functional integration is what matters. If the three stations exchange signals according to a shared protocol, each adjusting its state based on inputs from the others specifically to collectively execute an algorithm none could execute alone, they *do* compose a computational system. The collaborative power (distributed computation) emerges precisely from their structured causal loop. This *is* composition, not unrestricted composition "with extra steps," because it excludes mere aggregates (like your scattered plurality) that lack intrinsic organization for joint action. For any arbitrary scattered things you pick, while they *can* jointly cause some unique effect (e.g., "being the only things I am thinking of right now"), this effect is accidental, not an intrinsic power arising from *their own organized interaction*. Their "collaboration" is imposed externally, not generated by their mutual arrangement.

  Regarding the sleeping animal: collaborative powers are *dispositional properties*, not requiring continuous activation. A heart and lungs compose an organism because their *organized structure* inherently possesses the capacity for collaborative oxygen circulation, even when dormant. The power is realized by the *persistent causal architecture*—the specific way nerves connect, muscles attach, and biochemical pathways interlock. During sleep, this architecture remains intact, sustaining the disposition. The collaborative power isn't "exercised" in the sense of active pumping, but the *system's power* to pump collaboratively when awake is a real, emergent property grounded in its enduring physical integration. This distinguishes it from a corpse, where the organizing causal structure has disintegrated, leaving only formerly interacting parts. Vagueness exists at the margins (e.g., deep hibernation), but the core principle—composition via disposition-emergent integration—holds firm.
