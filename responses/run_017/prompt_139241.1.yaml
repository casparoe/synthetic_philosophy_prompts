  ### **Leaves (Readings)**  
  *Match your answer path (e.g., A-1-N-E-Y-T-Y) to a leaf below. Each leaf includes:*  
  - *Agent type note: How it handles ordinary vs. advanced agents.*  
  - *Awkward commitment: The hardest implication to defend.*  
  - *Condition for being right: What would need to be true for this view to hold.*  

  ---

  #### **Leaf 1: Character Development Reading**  
  *Path: Any Node 1 (A/B/C/D) + Node 2=1 + Node 4=E or G + Node 6=T + Node 7=Y*  
  - **Agent type note:** Moral weight depends on the agent’s development—ordinary people risk corruption by "bad" acts, while advanced beings can transcend rules without harm.  
  - **Awkward commitment:** It must explain why an act with great outcomes (e.g., saving lives) is still bad if done without the right state of mind (e.g., anger).  
  - **Condition for being right:** If ethics is primarily about cultivating inner virtues (like compassion), and acts are mainly tools for that growth.  

  ---

  #### **Leaf 2: Outcome-First Reading**  
  *Path: Node 1=C or D + Node 2=2 + Node 4=E or G + Node 6=W + Node 7=N*  
  - **Agent type note:** Acts are judged solely by outcomes, so agent type is irrelevant—even an advanced being’s "compassionate" act is wrong if it backfires.  
  - **Awkward commitment:** It must accept that an act with a compassionate state of mind (e.g., trying to help) is morally wrong if it accidentally causes harm.  
  - **Condition for being right:** If ethics is only about creating better states of affairs (e.g., less suffering), and intentions/states of mind are irrelevant to moral value.  

  ---

  #### **Leaf 3: No-Fixed-Principles Reading**  
  *Path: Any Node 1 (A/B/C/D) + Node 2=1 + Node 4=G + Node 6=T + Node 7=Y*  
  - **Agent type note:** Rules are training wheels for ordinary people, but advanced beings replace them with intuitive wisdom—so the same act can be right or wrong based on who does it.  
  - **Awkward commitment:** It struggles to explain how to avoid moral chaos, since no rule or outcome can definitively guide decisions beforehand.  
  - **Condition for being right:** If moral rules are just rough guides, and true ethics requires spontaneous, situation-specific insight from a developed mind.  

  ---

  #### **Leaf 4: Everything-Convention Reading**  
  *Path: Node 1=C + Node 3=N + Node 4=G + Node 5=Y + Node 7=N*  
  - **Agent type note:** Ethics is a human convention, so agent type doesn’t matter—all acts are equally "empty" of inherent goodness or badness.  
  - **Awkward commitment:** It risks making ethics arbitrary, since "good" and "bad" are just labels with no deeper truth.  
  - **Condition for being right:** If reality has no fixed essences (no "ultimate" selves, acts, or moral facts), making ethics purely practical and context-dependent.  

  ---

  #### **Leaf 5: Rules-Absolute Reading**  
  *Path: Node 1=A + Node 4=A + Node 6=T + Node 7=N*  
  - **Agent type note:** Rules apply equally to all agents—even an advanced being shouldn’t break a precept, as it risks normalizing harm.  
  - **Awkward commitment:** It must justify why you shouldn’t break a minor rule (e.g., lying) even to prevent massive suffering (e.g., genocide).  
  - **Condition for being right:** If rules protect against self-deception and societal harm, and their strictness is essential for collective progress.  

  ---

  #### **Leaf 6: Merit-Transfer Emphasis**  
  *Path: Node 5=Y + Node 6=T + Node 7=Y*  
  - **Agent type note:** Merit transfer is most effective for advanced beings, but ordinary people can redirect goodness to others through rituals or vows.  
  - **Awkward commitment:** It must explain how "goodness" can be a transferable substance when everything else (like identity) is fluid and ownerless.  
  - **Condition for being right:** If moral "credit" is a communal resource, and dedicating it strengthens social bonds and collective growth.  

  ---

  #### **Leaf 7: World-First Merit Reading**  
  *Path: Node 5=Y + Node 6=W + Node 7=N*  
  - **Agent type note:** Merit redirecting is just a tool for improving the world, so agent type doesn’t matter—anyone can transfer "goodness" if it helps others.  
  - **Awkward commitment:** It treats "goodness" like a currency for world-improvement, but struggles to define what that currency is if not tied to character.  
  - **Condition for being right:** If merit is impersonal energy that can be harnessed to reduce suffering, regardless of who generates or receives it.  

  ---

  #### **Leaf 8: Empty Cell (Unoccupied Combination)**  
  *Path: Node 1=B + Node 2=2 + Node 3=Y + Node 4=A + Node 6=W + Node 7=Y*  
  - **Diagnosis:** Coherent but unattractive—it demands absolute rules (Node 4=A) yet calls rule-breaking "right" (Node 1=B), and requires enduring selves (Node 3=Y) while valuing world outcomes (Node 6=W), creating tension between rigidity and flexibility.  
  - **Why empty?** It’s psychologically unstable: few people accept both that rules are unbreakable and that violating them is sometimes "right," while also mixing a focus on outcomes with a belief in fixed selves.  

