  ### **Decision Tree: "What Buddhist Ethics Reading Are You Committed To?"**  
  *Instructions: Answer each question based on your intuitive response to ethical cases. No prior knowledge of Buddhism needed. Start with the sea-captain case below.*  

  ---

  #### **Node 1: The Sea-Captain Case**  
  A ship captain learns a passenger will murder everyone unless killed first. The captain kills the passenger to save the crew, knowing this will bring negative consequences for themselves. What best describes the captain’s act?  
  - **A.** The captain did something bad and shouldn’t have done it.  
  - **B.** The captain did something bad but was still right to do it.  
  - **C.** The captain did nothing bad at all.  
  - **D.** The captain did something good and would have been at fault to refuse.  

  *(All branches proceed to Node 2.)*  

  ---

  #### **Node 2: What Makes an Act What It Is?**  
  When judging any act, what ultimately defines its moral quality?  
  - **1.** The state of mind it came from (e.g., whether it arose from compassion and reluctance, or from coldness and anger).  
  - **2.** The actual outcomes it caused (e.g., how much suffering it reduced or created in the world).  

  *(All branches proceed to Node 3.)*  

  ---

  #### **Node 3: The Ownership Gap**  
  When an act creates good (e.g., saving lives), does that good require an enduring "someone" to experience it?  
  - **Y.** Yes, it must happen to a person (a being with a continuous identity) to count as good.  
  - **N.** No, it’s enough to total up positive or negative effects in a stream of experiences, even with no fixed "owner" behind them.  

  *(All branches proceed to Node 4.)*  

  ---

  #### **Node 4: Rules in Unforeseen Situations**  
  Imagine a moral dilemma where no existing rule could have anticipated the situation (e.g., a new technology allows saving lives by violating a minor vow). What guides the agent?  
  - **A.** Rules are absolute—they must be followed strictly, even here.  
  - **E.** Rules have exceptions—they can be set aside in extreme cases to aim for the best outcome.  
  - **G.** Rules aren’t the real guide—the agent should act from wisdom and care in the moment, even if it seems rule-breaking.  

  *(All branches proceed to Node 5.)*  

  ---

  #### **Node 5: Redirecting Goodness**  
  After someone performs a good act, can the "goodness" (or merit) they built up be transferred to benefit someone else later?  
  - **Y.** Yes, like dedicating it to another person (e.g., in a ritual).  
  - **N.** No, it only belongs to the person who performed the act.  

  *(All branches proceed to Node 6.)*  

  ---

  #### **Node 6: The Point of Ethics**  
  What is the ultimate goal of ethical action?  
  - **T.** The agent’s own growth (e.g., purifying their mind, developing virtues).  
  - **W.** The state of the world (e.g., reducing overall suffering, creating well-being).  

  *(All branches proceed to Node 7.)*  

  ---

  #### **Node 7: Agent Type Matters?**  
  Does the moral status of an act change based on who performs it—e.g., an ordinary person (with flaws) versus a near-perfected being (with deep insight and compassion)?  
  - **Y.** Yes, the same act can be assessed differently based on the agent.  
  - **N.** No, the act stands on its own, regardless of who does it.  

  *(Proceed to your leaf below based on your full path of answers.)*  

