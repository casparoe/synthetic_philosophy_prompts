prompt: |-
  For thirty-eight years I was a hydrologist, most of that time preoccupied with a single question: what is it that a gauge actually measures, and how badly does the answer diverge from the quantity you care about. In retirement I have been reading moral and political philosophy, and the literature on the currency of egalitarian justice — whether the thing we should be equalizing is welfare, or resources, or capabilities — strikes me as the same problem in a harder medium, with the additional difficulty that nobody agrees on what the gauge is supposed to be reading. I have also, unfortunately, been put in a position where I have to take the question practically.

  I sit as a volunteer on the grants committee of a small local charitable trust. The particulars: five unpaid members, one two-hour meeting per quarter, roughly forty-five applications a year, a total annual budget of about £160,000, an individual cap near £6,000. Grants are in kind only — equipment, home adaptations, tuition, transport passes, never cash. Decisions are final, there is no appeal, and we collect no outcome data beyond proof of purchase; once a grant is made we generally never learn what it did. Our deed also forbids funding anything that a statutory service ought to be providing, which we must police from a one-page application form. So these are repeated decisions, made fast, by people with no philosophical training, on thin evidence, with real money and no feedback loop.

  I would like you to build me a decision procedure we could actually run, and I want the conceptual work to be in the translation rather than in the exposition. Please write:

  1. A numbered sequence of questions to take an application through, in the order they must be asked, with an explicit statement of what would count as a sufficient answer to each and what evidence would satisfy it given that we have only the form and, occasionally, a phone call.
  2. The points at which the sequence stops with a no, and the points at which it stops and hands the decision to us as a values question rather than a factual one — with the hand-off written so that a volunteer can tell the two kinds of stoppage apart.
  3. An opening step in which the procedure declares which currency it is denominated in before any measurement happens, and a note at each later step describing how the ranking of a given application would change if we switched currency. I do not want an eclectic compromise; I want to see where the choice bites.
  4. Honest marking of the steps where judgment is dressed up as procedure, and a statement of which member of the committee has to sign off at those steps.

  The hard cases I need the procedure to handle, because they are the ones that actually divide us:

  - Interpersonal comparison when we have no subjective reports, and no way to get reliable ones. What proxy does the procedure accept, and what uncertainty should we attach to it.
  - Applicants whose expectations have visibly contracted — people who have stopped wanting what they cannot have. How the procedure detects this without asking them to imagine a life they have already set aside, and what it does when detection is impossible.
  - Expensive tastes versus genuine conversion handicaps. Give me the test the procedure uses to separate a piano from a ramp, and say what it does when the test returns nothing.
  - The index problem: who fixes the list of functionings that count, what happens when two applicants' claims rest on different entries in the list, and how the procedure keeps the list from simply encoding the tastes of five retired people.
  - The unit of assessment. A grant nominally made to one person frequently benefits a carer, a spouse, or children, and the three currencies count that spillover differently. The procedure must say which unit it scores and what it does with the rest.
  - Whether it aims at a floor or at the largest gain per pound, and the cases where those two aims rank the same applications differently.
  - The in-kind constraint. Since we cannot write cheques, I suspect the resourcist's elegant answer about equal shares is not even available to us, and I want that said plainly rather than quietly assumed away.
  - What we can honestly record afterwards, and what we must admit we will never learn.

  Then run the finished procedure on three applications, showing the actual scoring rather than a summary of it: a stairlift costing close to the cap for a woman with advanced multiple sclerosis who lives alone; the same sum divided among ten applications for adult literacy tuition; and a request from a man who is deaf for equipment he says will let him keep a job he would otherwise lose, where his employer is already legally obliged to make some provision. At least one of the three must come out against the applicant I would most like to help; a procedure that never does that is not discriminating, and I would rather see you defend an uncomfortable result than steer to avoid one.

  Finally, tell me what the procedure cannot do — which distortions it will reliably produce, and which injustices it will be blind to by construction. I have no library access here and no interest in a bibliography; I want the argument and the instrument, not the references. Please keep it to something a careful volunteer can work through in about ten minutes per application, and write it in a form I could put in front of the other four members without embarrassing anyone.
reasoning: |-
  Hmm, the user presents a fascinating challenge. They're a retired hydrologist drawing parallels between measurement in water systems and distributive justice, now serving on a small charity grants committee. The core request is for a practical decision procedure that handles philosophical complexities within severe operational constraints.

  Key constraints leap out: in-kind grants only, £6k cap, no outcome tracking, statutory exclusion, volunteer panel with no ethics training, and 10-minute review windows. The procedure must explicitly resolve seven hard cases they consistently struggle with, from expensive tastes to spillover effects. 

  Their framing reveals a measurement mindset - they want to see where different egalitarian currencies (welfare/resources/capabilities) actually diverge in scoring, not compromise between them. The demand for uncomfortable outcomes in test cases suggests intellectual honesty matters more than feel-good results.

  Underlying this, I sense two unspoken needs: first, a way to make value disagreements among committee members legible rather than personal; second, relief from the moral weight of deciding human fates with flawed information. The hydrology analogy implies they'd prefer measurable error over unquantifiable doubt.

  Operationally, the solution must fit on paper for four other retirees. That means: minimal abstraction, clear stopping rules, and designated responsibility points. The test cases are brilliantly chosen to stress-test any system - the stairlift forces capability/welfare tradeoffs; group literacy shows aggregation problems; the ADA-edge case probes legal/moral boundaries.

  For the currency choice: capabilities approach fits best given the in-kind constraint and their deed's focus on functionings. Resources get excluded by the no-cash rule; pure welfare requires unattainable subjective data. But we'll show where welfare or resources would alter rankings.

  For the hard cases:
  - Interpersonal comparison: Use medical/disability status as proxy, with severity tiers
  - Adapted preferences: Flag when requests seem below typical standards
  - Expensive tastes: "Conversion handicap" test requiring medical certification
  - Index problem: Fixed basic functioning list from UK poverty metrics, with majority vote for additions
  - Spillover: Score primary recipient but note household benefit
  - Floor vs efficiency: Capability thresholds first, then cost-effectiveness for ties
  - In-kind constraint: Explicitly blocks resource egalitarianism

  The three test applications will prove the system bites: likely rejecting the deaf applicant due to employer obligations, precisely the uncomfortable outcome requested. Documentation will confess unavoidable blind spots - particularly around long-term outcomes and preference adaptation.

  Procedure length is tight: 15 steps designed for single-page flow. Handoff points use explicit "Committee Judgment" labeling. All assumptions (like severity bands) are stated upfront so volunteers see the scaffolding.
answer: |-
  ## Charitable Grants Decision Procedure (Capability Threshold Model)

  **Currency Declaration:** This procedure denominates in **basic capabilities** (after Sen/Nussbaum). We aim to close gaps preventing individuals from achieving core human functionings essential for a minimally decent life. Welfare is unmeasurable with our constraints; resources alone ignore conversion factors. Capability gaps are inferred from objective disadvantage preventing basic functionings.

  ---

  ### Decision Sequence & Rules
  *(Evidence: Application Form (AF), Optional Follow-up Call Notes (CN). All "sufficient" evidence must be verifiable via AF/CN/Public Record.)*

  1.  **Statutory Obligation Check:** "Is the requested item/service demonstrably the legal responsibility of a statutory body (e.g., NHS, Social Services, employer under Equality Act) to provide *to this applicant* in *these specific circumstances*?"
      *   *Sufficient Answer:* NO. Evidence: AF explanation of why statutory body refuses/cannot provide it *now*, or clear public guidance showing this item falls outside mandated provision. (e.g., Standard wheelchair provided, but specialist cushion needed for pressure sores is not).
      *   *Stop: NO* if YES. Handoff: If ambiguous (e.g., employer *should* provide but claims undue hardship), proceed but flag for Committee Judgment (CJ) at Step 9.
      *   *Currency Note:* Resources/Welfare might ignore this step; Capabilities requires it per trust deed. Switching welfare might prioritize intense suffering regardless of legalities.

  2.  **Basic Functioning Impairment:** "Does the application clearly identify *which specific core functioning* (Mobility, Communication, Learning, Health Maintenance, Social Participation) is impaired *without* this grant?"
      *   *Sufficient Answer:* YES. Evidence: AF links request directly to overcoming a specific, named barrier preventing a basic activity (e.g., "Cannot leave home independently (Mobility)", "Cannot access written job training materials (Learning/Communication)").
      *   *Stop: NO* if request is for enhancement beyond basic functioning (e.g., faster computer for existing job, gym membership for fitness). Handoff: If link is weak or functioning is borderline "basic" (CJ at Step 9).
      *   *Currency Note:* Resources might fund any resource deficit; Welfare might fund anything increasing happiness. Capabilities focuses on core functionings.

  3.  **Applicant Vulnerability:** "Does the applicant belong to a group facing systemic disadvantage likely affecting capability conversion (e.g., disability, chronic illness, low income, refugee status, care leaver)?" AND "Is the severity of this disadvantage *verifiable without subjective reports*?"
      *   *Sufficient Answer:* YES. Evidence: AF/CN provides objective indicators (e.g., receipt of PIP/DLA/ESA/Universal Credit with LCWRA element, registered disability, GP/OT letter confirming condition *type* (not severity), asylum seeker documentation). Use pre-defined severity bands based on benefit levels/diagnosis groups (Low/Medium/High - CJ defines bands annually).
      *   *Stop: NO* if no objective indicator of disadvantage. Handoff: If severity is disputed given indicators (CJ at Step 9).
      *   *Currency Note:* Welfare might weight subjective distress heavily; Resources might ignore if resource need is equal. Capabilities uses disadvantage as proxy for conversion difficulty.

  4.  **Adapted Preferences Check:** "Is the request aimed at a level of capability *below* what is typically considered a basic minimum for that functioning *for someone with this applicant's disadvantage profile*?"
      *   *Sufficient Answer:* NO. Evidence: Request aligns with standard aids/levels for the impairment (e.g., standard wheelchair, basic literacy course). *Flag:* If request seems unusually modest given the stated impairment (e.g., asking for bus pass when unable to walk, rather than wheelchair). *No automatic stop.*
      *   *Action:* Flagged applications proceed but are noted. Committee must consciously assess at Step 9 if this suggests problematic adaptation *or* genuine need.
      *   *Currency Note:* Welfare might accept adapted preferences as genuine; Capabilities/Resources suspect deprivation.

  5.  **Conversion Handicap Test (Expensive Tastes vs. Need):** "Is the higher cost/atypical nature of the request *necessitated* by the applicant's specific disadvantage?"
      *   *Sufficient Answer:* YES. Evidence: AF/CN provides specific, verifiable reason why standard solution won't work (e.g., "Standard ramp insufficient due to steep gradient and narrow access"; "Standard keyboard causes RSI due to specific joint deformity"; OT/specialist report confirming need).
      *   *Stop: NO* if request is a preference without disability link (e.g., high-end piano for hobbyist vs. adaptive instrument for music therapy). Handoff: If necessity is claimed but evidence weak (CJ at Step 9). *Test Returns Nothing:* Proceed but cost-effectiveness (Step 7) heavily weighted.
      *   *Currency Note:* Resources penalizes expensive needs; Welfare might fund if happiness gain high; Capabilities accepts if necessary for basic functioning.

  6.  **Unit of Assessment:** "Who is the *primary direct beneficiary* whose capability gap this grant addresses?" AND "Are there significant, *necessary* secondary beneficiaries (e.g., carer respite enabling continued care, communication device for deaf parent benefiting hearing children)?"
      *   *Sufficient Answer:* Primary beneficiary clearly named. Evidence: AF identifies primary user. Secondary benefit described if applicable.
      *   *Action:* Score based on primary beneficiary's capability gap (Steps 2-3). Note significant necessary secondary benefits as a positive factor for CJ at Step 9. *Do not score spillover welfare/resource gains to others.*
      *   *Currency Note:* Welfare counts spillover happiness; Resources counts household resources; Capabilities focuses on the individual's functioning gap.

  7.  **Cost-Effectiveness (Capability Gain per £):** "Estimate the cost per unit of *core functioning restored/enabled* relative to alternatives."
      *   *Sufficient Answer:* Quantifiable comparison possible. Evidence: AF/CN states the specific activity enabled. Compare cost to: a) Cost of typical solution for same functioning. b) Cost per person if request benefits multiple (rare). c) Typical cost range for similar grants.
      *   *Action:* Calculate: `(Severity from Step 3) / (Grant Cost)`. Use severity bands (Low=1, Med=2, High=3). Flag if cost is high relative to typical solutions for the same gap. *No stop.* Score used for ranking. *Judgment Dressed as Procedure:* Severity band assignment is CJ (Chair signs off on band using Step 3 evidence). Cost-typicality comparison relies on committee experience (Treasurer flags outliers).
      *   *Currency Note:* Pure welfare might ignore cost; pure resources focuses only on cost; capabilities balances cost against scale of gap closed.

  8.  **Feasibility & In-Kind Compliance:** "Can the grant be provided *in kind* as specified?" AND "Is there proof the supplier exists and provides this item/service?" AND "Is the total request <= £6,000?"
      *   *Sufficient Answer:* YES to all. Evidence: Supplier quote/details on AF; clear description matches deed; cost <=£6k.
      *   *Stop: NO* if No to any point. *Handoff:* If in-kind provision is complex but possible (e.g., specialist tutor sourcing - CJ at Step 9).

  9.  **Committee Judgment (CJ) Point:** Applications passing Steps 1-8 are presented for CJ. Points requiring CJ:
      *   Ambiguous Statutory Obligation (Step 1 Flag)
      *   Weak/Borderline Basic Functioning Link (Step 2 Flag)
      *   Disputed Severity (Step 3 Flag)
      *   Suspected Problematic Adaptation (Step 4 Flag)
      *   Unclear Conversion Handicap (Step 5 Handoff)
      *   High Cost-Effectiveness Concern (Step 7 Flag)
      *   Complex Feasibility (Step 8 Handoff)
      *   *Process:* Chair presents application & specific CJ points. Committee discusses *only* the flagged issues based on AF/CN. Majority vote. Recording: Minute the *specific question* voted on and outcome (e.g., "Vote: Is the stairlift necessary due to MS? Yes 4, No 1."). **CJ Chair signs off.**

  10. **Threshold Check:** "Does closing *this specific capability gap* for *this applicant* meet our priority of achieving a *minimally decent floor* of core functionings?"
      *   *Sufficient Answer:* Committee Consensus YES. Evidence: Application clearly addresses a severe (High band) gap in a core functioning preventing a minimally decent life. *Judgment Dressed as Procedure:* Defining "minimally decent floor" is inherently CJ (all members, implicit in vote). Recording: Minute the justification (e.g., "Enables essential mobility within home").
      *   *Action:* Applications passing CJ and deemed to meet the threshold are prioritized for funding *first*, regardless of cost-effectiveness, until budget allows. *Aim: Floor.*
      *   *Currency Note:* Welfare might focus on intense suffering relief; Resources might fund cheapest gaps first.

  11. **Efficiency Ranking:** Rank remaining eligible applications (those passing Steps 1-9 but not funded under Step 10) by **Cost-Effectiveness Score** (Step 7: Severity Band / Cost). Highest score first.
      *   *Action:* Fund down the ranked list until budget exhausted. *Aim: Largest Gain per £.*
      *   *Currency Note:* Pure welfare might rank by perceived suffering intensity; pure resources by cheapest item.

  12. **Final Check:** "Is the total grant within quarterly/annual budget and individual cap?"
      *   *Stop: NO* if over budget/cap even after ranking. *Handoff:* If partial funding possible/useful (CJ).

  13. **Approval:** Log decision (Grant/Reject), primary reason (e.g., "Statutory Obligation", "Failed CJ: Necessity Unclear", "Funded: Threshold Mobility", "Funded: High CE Literacy"). **Treasurer signs off on financial compliance.** Secretary records decision & key CJ points.

  ---

  **What We Record & What We Cannot Know:**
  *   **Record:** Application details, decision (Grant/Reject), primary reason code, CJ vote summaries if applicable, grant amount, supplier, item.
  *   **Cannot Know & Admit:** Actual welfare gain; long-term impact on capabilities; whether preferences were adapted; precise spillover benefits; counterfactual outcomes (what would have happened without grant); if statutory body *should* have provided it but didn't.

  ---

  **Procedure Limitations (Distortions & Blind Spots):**
  1.  **Index Problem Bias:** The "core functionings" list (Step 2) is fixed and defined by CJ (initially based on UK poverty/disability frameworks). It reflects the committee's (retired) view of a "minimally decent life." New/different disadvantages (e.g., severe digital exclusion) might be overlooked until added.
  2.  **Proxy Reliance:** Severity (Step 3) relies on coarse benefit/diagnosis bands. Two people with same band may have very different capability deficits. Uncertainty is high but unquantifiable.
  3.  **Adaptation Blindness:** We cannot reliably detect or correct for adapted preferences (Step 4). We risk both funding resigned deprivation and rejecting genuinely modest needs.
  4.  **Cost-Effectiveness Crudity:** The Severity/Cost score (Step 7) is simplistic. It undervalues small gains for very severe disabilities and overvalues large gains for mild ones. It cannot compare gains across *different* functionings (e.g., mobility vs. learning).
  5.  **Threshold Rigidity:** The "floor" focus (Step 10) may neglect smaller but crucial gains for those just above the threshold, or those with multiple moderate gaps.
  6.  **Spillover Ignorance:** Necessary secondary benefits (Step 6) are noted but not scored. We undervalue grants that prevent carer breakdown or significantly benefit children.
  7.  **No Outcome Feedback:** We learn nothing about whether the grant *actually* improved capability or was used effectively. We cannot improve future decisions based on results.
  8.  **Vulnerability Blind Spots:** Applicants lacking documentation or awareness of benefits (Step 3) may be excluded despite severe need.
  9.  **CJ Dominance:** Values of the committee (esp. Chair) heavily influence CJ outcomes and severity bands. Dominant personalities could sway decisions.

  ---

  **Test Applications: Applying the Procedure**

  1.  **Stairlift (£5,800) - Woman, Advanced MS, Lives Alone:**
      *   Step 1: NO (Statutory unlikely to fund full stairlift in private home). Pass.
      *   Step 2: YES (Mobility - accessing whole home). Pass. Severity: High (MS, lives alone).
      *   Step 3: YES (MS, likely PIP higher rate mobility). Vulnerability: High. Pass.
      *   Step 4: NO (Request standard for severe mobility impairment). Pass.
      *   Step 5: YES (Necessitated by MS). Pass.
      *   Step 6: Primary: Woman. Secondary: Potential reduction in formal care needs. Note benefit.
      *   Step 7: Severity=3 (High), Cost=5800. CE Score = 3/5800 ≈ 0.00052. Flag: High cost, typical solution.
      *   Step 8: YES. Pass.
      *   Step 9: CJ on Cost Flag? Committee likely confirms necessity (High Severity, core Mobility). Pass CJ.
      *   Step 10: **THRESHOLD? YES.** Severe gap in core Mobility preventing basic home life. Prioritize for funding.
      *   **Result: FUNDED (Threshold - Mobility Floor)**

  2.  **10x Adult Literacy Tuition (£580 each, £5,800 total):**
      *   Step 1: NO (Statutory adult literacy often has waiting lists/limits). Pass.
      *   Step 2: YES (Learning - functional literacy). Pass. Severity: Assume all Medium (functional illiteracy impacting work/daily life).
      *   Step 3: YES (Low income/disadvantage likely - evidence needed per applicant e.g., benefits). Vulnerability: Assume Medium per applicant. Pass.
      *   Step 4: NO. Pass.
      *   Step 5: YES (Standard tuition cost). Pass.
      *   Step 6: Primary: Each learner. Secondary: Potential family/employer benefit. Note per applicant.
      *   Step 7: Severity=2 (Med) *per person*, Cost=580 *per grant*. CE Score = 2/580 ≈ 0.00345 *per application*. Much higher *per application* score than stairlift. No flag.
      *   Step 8: YES. Pass.
      *   Step 9: Likely no CJ needed if evidence clear per applicant.
      *   Step 10: **THRESHOLD?** Functional literacy is core. BUT, is *this specific gap* for *each applicant* severe enough to be below the "floor"? Committee CJ: Likely **NO** for most (unless specific evidence shows extreme exclusion). Falls to Efficiency Ranking.
      *   Step 11: High CE Score (0.00345) ranks these very highly. Likely **FUNDED** if budget allows after Threshold grants. *Efficiency wins per £.*

  3.  **Deaf Man - Work Communication Equipment (£6,000):**
      *   Step 1: **AMGUIOUS.** Employer legally obliged (Equality Act) to make *reasonable adjustments*. Is this specific equipment "reasonable"?
      *   Step 9 (Early CJ): Committee must judge: Is this beyond "reasonable adjustment"? Evidence needed: What did employer refuse? Why? Cost to employer? Without strong evidence employer unreasonably refused *this specific equipment*, **Stop: NO (Statutory Obligation likely applies).** *Assume insufficient evidence provided.*
      *   *If CJ found Statutory did NOT apply:* Proceed.
      *   Step 2: YES (Communication - workplace). Pass. Severity: High (job loss risk).
      *   Step 3: YES (Deafness). Vulnerability: High. Pass.
      *   Step 4: NO. Pass.
      *   Step 5: CJ: Is £6k equipment *necessary*? What standard alternatives exist? Without specialist report, hard to confirm. **CJ likely: Necessity Unclear? Handoff.** Assume CJ finds evidence weak.
      *   Step 9 (CJ): Votes "Is necessity proven?" Assume **NO (majority)**. **Result: REJECT (Failed CJ: Necessity Unclear / Statutory Obligation likely).**
      *   *Uncomfortable Outcome:* He needs it, but procedure flags legal duty and/or weak proof of necessity given employer obligation, leading to rejection.

  **Summary of Test Results:**
  *   Stairlift: Funded (Priority Floor - Core Mobility)
  *   Literacy Tuition (10x): Funded (High Efficiency)
  *   Deaf Man Equipment: Rejected (Statutory Obligation / Necessity Unclear)

  **This procedure rejected the applicant the chair might most want to help (deaf man), demonstrating the requested discrimination based on the rules (statutory bar, burden of proof).** The stairlift wins on threshold, literacy on efficiency. The choice of Capabilities currency prioritizes severe core functioning gaps first (floor), then efficiency. A Welfare model *might* have prioritized the deaf man's job-loss suffering higher. A Resource model *might* have rejected the expensive stairlift. The in-kind constraint prevents pure resource allocation. The CJ points expose the value judgments.
