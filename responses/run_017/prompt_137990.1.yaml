  **<center>INSURANCE CONTRACT</center>**  
  **<center>THE COHERENT RISKS UNDERWRITING GROUP LTD.</center>**  
  **<center>“Guarding Rational Agents Since 1954”</center>**  

  **<center>EXPLOITABLE PREFERENCE SEQUENCE POLICY</center>**  
  **Policy No.: EU-REP-Δ-001** | **Issued To:** Insured Rational Agent | **Effective Date:** Upon Full Preference Disclosure  

  ---

  **INSURING CLAUSE**  
  The Coherent Risks Underwriting Group Ltd. (“CRUG”) hereby agrees to indemnify the Insured against Demonstrable Net Losses arising solely from Exploitable Preference Sequences (as defined herein), subject to the Terms, Conditions, Exclusions, and Limitations below.  

  **DEFINITIONS**  
  1. **“Demonstrable Net Loss”**: The negative utility differential, as quantified by CRUG, between (a) the outcome achieved by the Insured following an Exploitable Preference Sequence, and (b) the outcome achievable had the Insured avoided said sequence.  
  2. **“Exploitable Preference Sequence”**: A finite series of choices offered to the Insured by a Third-Party Bookmaker (hereafter “Bookmaker”), which, due to the Insured’s non-transitive preferences or state-dependent valuations, results in a Dominated Outcome.  
  3. **“Dominated Outcome”**: An outcome strictly less preferred by the Insured than an alternative outcome available at the start of the sequence.  
  4. **“Utility (util)”**: The unit of indemnification, convertible to monetary or non-monetary value at CRUG’s sole discretion, based on observed choice behavior of the Insured during the Claims Process (see Sec. IV).  

  ---

  **SCHEDULE A: COVERED PERILS**  
  Coverage extends solely to losses arising from:  
  1. **Dutch Book Vulnerability**: Acceptance of a set of monetary wagers guaranteeing negative net monetary gain across all states of the world.  
  2. **Money Pump Exploitation**: Completion of a trade sequence (e.g., A→B→C→A) resulting in net depletion of resources, absent any change in underlying state or information.  
  *Note: Peril 1 concerns sure monetary loss; Peril 2 concerns cyclic preference revelation regardless of monetary loss.*  

  ---

  **SECTION I: COVERAGE LIMITATIONS**  
  1. **Indemnification Format**: All claims settled in utils. CRUG will determine the util value of outcomes *ex post facto* by reviewing the Insured’s actual choices during the sequence.  
  2. **Bookmaker Activity Requirement**: Coverage void unless the Bookmaker demonstrably re-offers identical trade sequences until net loss occurs. CRUG assumes omnipotent Bookmakers with perfect preference knowledge.  
  3. **Sequence Valuation**: The util value of an Exploitable Preference Sequence equals the sum of util valuations of each discrete choice within it, as assessed by CRUG.  

  ---

  **SECTION II: EXCLUSIONS**  
  This policy EXCLUDES claims arising directly or indirectly from:  
  1. **Trade Sequence Incompletion**: Failure to accept *all* trades within a sequence (e.g., declining the final trade in A→B→C→A).  
  2. **Dynamic Preference Phenomena**:  
     - Regret, path-dependence, or outcome-source sensitivity.  
     - Valuing early/late resolution of uncertainty.  
     - Menu-dependence (context effects).  
     - Existence of "priceless" outcomes (e.g., refusing to assign tradeoff value to life, liberty, or moral commitments).  
  3. **Pre-Sanitation Preference State**: Losses incurred prior to CRUG’s application of the **Preference Sanitation Fee** (see Sec. III).  

  ---

  **SECTION III: PREFERENCE SANITATION FEE**  
  1. Prior to coverage activation, CRUG will perform **Preference Sanitation**: a proprietary process removing all Excluded Dynamic Preference Phenomena (Sec. II.2).  
  2. The Insured agrees to pay a non-refundable fee of **50 utils** for Sanitation. This fee is deducted from future claims settlements.  
  3. Sanitation ensures preferences are:  
     - Complete, transitive, and state-independent.  
     - Unaffected by choice context or resolution timing.  
     - Fully monetizable (all outcomes assigned finite util value).  
  *“We make your preferences clean, orderly, and insurable.”* — CRUG Sanitation Brochure  

  ---

  **SECTION IV: CLAIMS PROCEDURE**  
  1. **Notification**: Insured must report the Exploitable Preference Sequence within 24 hours of its completion.  
  2. **Demonstration**: Insured must recreate choices under CRUG observation.  
  3. **Util Assignment**: CRUG will:  
     - Assign utils to each outcome based on Insured’s re-enacted choices.  
     - Calculate Net Loss as sum of step-wise util differentials.  
  4. **Payment**: CRUG issues util scrip redeemable for:  
     - Cash (at CRUG’s util-to-currency exchange rate).  
     - Outcome rectification (e.g., unwinding trades at CRUG’s assessed util cost).  

  ---

  **SECTION V: ELIGIBILITY REQUIREMENTS**  
  ***COVERAGE IS VOID UNLESS:***  
  The Insured’s *post-sanitation* preferences satisfy the **CRUG Representation Theorem**, i.e., they are:  
  - Representable by a real-valued utility function *u* over outcomes.  
  - Governed by the Expected Utility Hypothesis relative to a fixed probability measure.  
  *“We only insure agents who already maximize expected utility. Others are unquantifiable risks.”* — CRUG Underwriting Manual  

  ---

  **<center>TESTIMONIAL</center>**  
  *“After CRUG’s Sanitation, everything clicked. I used to dread money pumps — that awful feeling trading back to A minus $10. Now? I’m coherent. Last Tuesday, I calmly assigned a util value to my own death ($8,300, FYI) to settle a Bookmaker sequence. CRUG paid out 12 utils when I cycled anyway (old habits die hard!). Their util assessment was… rigorous, but who am I to argue? I’m rational now!”*  
  **— “Satisfied Customer,”** former dilettante, current EU-maximizer  
  *CRUG Case File #: PUMP-ELIM-1998*  

  ---  
  **<center>ENDORSEMENT</center>**  
  *This policy does not constitute rationality advice. CRUG accepts no liability for preference-based existential crises. Premiums payable in utils.*  

  **<center>COHERENT RISKS UNDERWRITING GROUP LTD. IS A SUBSIDIARY OF VNM HOLDINGS.</center>**  

