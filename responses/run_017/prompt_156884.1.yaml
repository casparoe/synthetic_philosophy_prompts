  First, I need to recall Hobbes's epistemology. He sees reason as computation with names. Definitions are human agreements, so the necessity comes from consistent use, not external reality. Geometry works because we define points, lines, etc., and the conclusions follow necessarily from those definitions. So, for Hobbes, geometric truths are reckoning-relative. God's role here is giving humans the ability to reason and agree on definitions, not that geometry reflects innate truths.

  But what about natural philosophy? Hobbes thinks we can't have certain knowledge there because we can't access real essences. Our senses only give us phenomena, so physics is probabilistic, not scientific like geometry. Civil philosophy, though, can be a science by imitating geometry. By defining terms like "right," "contract," "commonwealth," and reasoning from them, we get necessary truths about political structures. So civil science is also reckoning-relative.

  The user's confusion might stem from Hobbes's empiricism versus his rationalist method. Concepts come from experience, but science is deductive. The necessity in geometry isn't about the world but about the consistency of definitions. The user's distinction maps well here: Hobbes is reckoning-relative for geometry and civil science. World-imposed necessity isn't possible for him since we can't know real essences.

  The deeper need here is clarity on Hobbes's epistemology to avoid misinterpretation in class. They might also need to reconcile his empiricism with his rationalist method. Confirming that civil philosophy is a true science by analogy, not weaker, is key. Ending with a concise summary will help them present this in their group.
answer: |-
  Based on your description of the passage and Hobbes's overall system, here's the conceptual map:

  1.  **Reason as Reckoning:** Hobbes fundamentally views reasoning as a mechanical process of mental computation. We add and subtract the meanings ("consequences") of agreed-upon names (definitions). Truth is the correct calculation using these defined terms.

  2.  **Settled Significations as Foundation:** For this computational process to yield *science* (certain, demonstrable knowledge), the starting definitions *must* be settled by human agreement. If definitions are ambiguous or contested, any reasoning based on them is unreliable "empty noise." The necessity stems entirely from the internal logical consistency of the computation using the agreed-upon definitions.

  3.  **Geometry as the Model Science:** Geometry exemplifies this perfectly. We start with clear, stipulated definitions (e.g., "a point is that which has no part," "a line is breadthless length"). The consequences (theorems) deduced logically from these definitions possess absolute certainty *because* they depend only on the definitions and the rules of logic (reckoning), not on potentially variable or uncertain observations of the external world. The necessity is inherent in the logical structure built upon the agreed-upon starting points.

  4.  **God's "Bestowal":** God bestowing geometry doesn't mean God implanted innate geometric truths or that geometry directly mirrors a divine world-structure. Instead, it means God endowed mankind with the *capacity for reason* (reckoning) and the *ability to establish and adhere to clear definitions*. Geometry is "bestowed" in the sense that it's the one field where humans have successfully and consistently employed these God-given faculties to construct a demonstrable system of necessary truths. The necessity is generated by human reason operating on human agreements, enabled by God-given faculties.

  5.  **Reckoning-Relative vs. World-Imposed:** Your distinction maps directly onto a core tension in Hobbes interpretation, and the passage strongly supports the **reckoning-relative** reading. The necessity of geometry arises "entirely from how we have settled the definitions of the words." Hobbes is emphatic that signification is "settled by human agreement and not by nature." He does *not* argue that definitions "latch onto something independent" (world-imposed real natures) in a way that guarantees the conclusions reflect external necessity. The definitions are starting conventions; the necessity is in the logical implication from those conventions. For Hobbes, we *cannot* have certain knowledge of the "real natures" of bodies independent of our definitions and sensory phenomena.

  6.  **Science vs. Prudence/Natural Philosophy:** You are correct to infer that Hobbes *denies* the possibility of empirical natural science attaining the status of "science" (in his strict sense of demonstrable, necessary knowledge). Physics studies bodies in motion, but we rely on sensory experience (prudence) which is fallible and probabilistic, not on deduction from settled definitions of the *true, internal natures* of bodies (which we cannot access directly). We can have hypotheses and predictions based on experience, but not the absolute certainty of geometry. Only reasoning from definitions provides science.

  7.  **Civil Philosophy as Science:** Civil philosophy (the study of commonwealths) *can* become a true science *in the same full sense as geometry* by rigorously imitating its method:
      *   **Precise Definitions:** Start by stipulating clear, unambiguous definitions of key political concepts (e.g., "right," "liberty," "contract," "sovereign," "commonwealth").
      *   **Deductive Reasoning:** Logically deduce the necessary consequences (laws of nature, rights and duties, structure of sovereignty) from these definitions.
      *   **Necessity:** The conclusions about what constitutes a stable commonwealth or what a sovereign *must* have the right to do are necessary *given the agreed definitions*, just like geometric theorems. They are reckoning-relative truths about the logical implications of the defined political terms and structures. If you accept Hobbes's definitions, his political conclusions follow with geometric necessity – this is the core argument of *Leviathan*.

  **One-Sentence Summary:** Hobbes views geometric and genuine scientific truths (including demonstrable civil philosophy) as reckoning-relative, deriving their necessity solely from logical deduction using humanly stipulated definitions, enabled by God-given reason, not from correspondence to world-imposed real natures.
