  Below is a complete plan for your 75-minute seminar, designed to illustrate the fragility of common knowledge of rationality through a sequential take-or-pass game. The plan includes rules, materials, payoff scheme, scripts for each run, debriefing guidance, and notes on potential pitfalls. The key contrast is between a baseline run (where rationality is implicitly assumed but not common knowledge) and an uncertainty run (where a small, known chance of forced behavior disrupts the chain of reasoning). The discontinuity—how a tiny doubt flips the outcome—is the core lesson.

  ---

  ### **Game Overview**
  - **Format**: Sequential take-or-pass game with a growing pot, played in anonymous pairs.
  - **Players**: 18 students (9 pairs per game).
  - **Rounds**: 4 rounds max. Player A starts, then alternates with Player B.
  - **Payoffs**: Points (not money) for each player. Points accumulate across games; the student with the highest total wins a coffee voucher.
  - **Sessions**: 
    - **First run (Baseline)**: Play 3 games with random re-pairing. No information beyond payoffs.
    - **Second run (Uncertainty)**: Play 3 games with random re-pairing. Before each game, players receive a private card indicating if they are "must pass" (forced to pass in Rounds 1–3) or normal. A known fraction (15%) are "must pass"; no one knows their partner's card.
  - **Why this works**: The baseline should see early takes (backward induction holds). The uncertainty run should see more passing due to doubt, demonstrating how broken common knowledge unravels backward induction. Payoffs are calibrated so a 15% chance of forced passing makes passing rational in early rounds.

  ---

  ### **Rules and Payoff Scheme**
  **Pot Growth and Actions**:
  - **Round 1**: Pot = 1 point. Player A chooses:
    - **Take**: A gets 1 point, B gets 0. Game ends.
    - **Pass**: Pot grows to 4 points. Move to Player B.
  - **Round 2**: Pot = 4 points. Player B chooses:
    - **Take**: B gets 4 points, A gets 0. Game ends.
    - **Pass**: Pot grows to 9 points. Move to Player A.
  - **Round 3**: Pot = 9 points. Player A chooses:
    - **Take**: A gets 9 points, B gets 0. Game ends.
    - **Pass**: Pot grows to 16 points. Move to Player B.
  - **Round 4**: Pot = 16 points. Player B **must take**: B gets 16 points, A gets 0. Game ends (no pass option).

  **Key Features**:
  - **Payoff scaling**: Pot grows superlinearly (1 → 4 → 9 → 16) to incentivize passing if doubt exists. Backward induction predicts Round 1 take (A gets 1 > 0 from passing).
  - **Uncertainty twist**: "Must pass" players must pass in Rounds 1–3 if they are the mover. In Round 4, all players take (no choice). Probability of "must pass" = 15% per player per game.
  - **Points**: Students track cumulative points. Max per game: 16 points (if game reaches Round 4). Coffee voucher for highest scorer.

  ---

  ### **Materials**
  1. **Role cards**: 18 cards per game (9 for Player A, 9 for Player B). Labeled "Player A" or "Player B".
  2. **Uncertainty cards (second run only)**: 
     - 90 cards total (3 games × 18 players). 
     - 15% "must pass" (≈ 3 per game): Red cards with "must pass".
     - 85% normal (≈ 15 per game): Green cards with "normal".
     - Seal in envelopes for privacy if needed.
  3. **Move record sheets**: For students to record their moves and outcomes (see table below). Collect after each run for debrief.
  4. **Random pairing tool**: Use a random name generator or shuffled cards for re-pairing.
  5. **Whiteboard/flip chart**: For recording aggregate results during debrief.

  **Move Record Sheet Example**:
  | Game # | My Role | My Moves (Take/Pass) | Ending Round | My Points | Partner's Points |
  |--------|---------|----------------------|--------------|-----------|------------------|
  | 1      | e.g., A | Take (R1)            | 1            | 1         | 0                |
  | ...    | ...     | ...                  | ...          | ...       | ...              |

  ---

  ### **Scripts for Each Run**
  **General Instructions (Before Both Runs)**:
  > "We’ll play a simple game in pairs. You’ll be randomly paired with a different partner each game. In each pair, one is Player A and the other is Player B. Player A goes first. The goal is to earn as many points as possible over multiple games. Points determine the coffee voucher winner.  
  >   
  > **How it works**:  
  > - In each round, the current player can **take** the pot (ending the game) or **pass** (letting the pot grow and the other player move next).  
  > - The pot starts small but grows if you pass. Points are split only if someone takes.  
  >   
  > We’ll play 3 games. I’ll re-pair you and reassign roles (A/B) randomly after each game. Record your moves on your sheet."

  #### **First Run (Baseline) - No Additional Info**
  > "We’re starting the first set of games. Remember:  
  > - Play to maximize your points.  
  > - You know only the payoffs and rules—nothing about your partner beyond that.  
  >   
  > Let’s begin."

  #### **Second Run (Uncertainty) - Add Forced-Pass Twist**
  > "Now we’ll play a second set of 3 games with the **same rules and payoffs**, but with one change:  
  >   
  > - Before each game, I’ll give you a **private card**. It says either **normal** or **must pass**.  
  > - **If you are ‘must pass’**: You **must pass** in Rounds 1, 2, or 3 if it’s your turn. You have no choice. (In Round 4, everyone takes, so no issue.)  
  > - **If you are ‘normal’**: You choose freely, as before.  
  > - **Key details**:  
  >   - About 15% of players are ‘must pass’ each game—randomly chosen.  
  >   - You only see your own card. You don’t know if you’re ‘must pass’, and you don’t know your partner’s card.  
  >   - Cards are reshuffled each game—your type may change.  
  >   
  > Play to maximize points. Keep your card secret. Begin."

  ---

  ### **Debrief Plan (20–25 minutes)**
  **Goal**: Map game outcomes to the formal distinction between "rationality" and "common knowledge of rationality." Highlight the discontinuity—how a tiny doubt flips behavior.

  1. **Aggregate Data Collection** (5 mins):
     - First, ask students to tally their ending rounds for each run (e.g., raise hands for "Game 1 ended in Round 1," etc.).
     - Record on a board:
       - **First run**: Frequency of ending rounds (R1, R2, R3, R4).
       - **Second run**: Same.
     - Expected results:
       - **First run**: >70% end in Round 1 (A takes immediately). Few games reach Round 3/4.
       - **Second run**: <30% end in Round 1. Most reach Round 2 or 3 (showing passing).

  2. **Map Outcomes to Concepts** (10 mins):
     - **Baseline behavior**: "In the first run, why did most games end in Round 1? Let’s think step-by-step:  
       - If the game reached Round 3, what would A do? (Take: 9 > 0 from passing.)  
       - So in Round 2, B takes (4 > 0 from passing, since A would take in Round 3).  
       - So in Round 1, A takes (1 > 0 from passing, since B would take in Round 2).  
       This is **backward induction**—it assumes everyone is rational *and* this is **common knowledge**. You expect the other to take, so you take first.  
       But did you all *really* believe your partner would do this? Our data shows you did!"

     - **Uncertainty behavior**: "Now, in the second run, why did passing increase?  
       - Suppose you’re A and normal. If you pass:  
         - There’s a 15% chance B is ‘must pass’ (so they pass, and you get to Round 3).  
         - Even if B is normal, they might pass because *they* think *you* could be ‘must pass’ in Round 3.  
       - Backward induction breaks: B might pass in Round 2 if they think you could be forced to pass in Round 3. So A passes in Round 1, hoping for Round 3.  
       This tiny doubt (15%) unwinds the chain of ‘he thinks I think...’—**common knowledge of rationality is lost**."

     - **The Discontinuity**: "Notice the flip: in Run 1, almost no one passed Round 1. In Run 2, many did—even though only 15% were forced! Formally:  
       - With common knowledge (Run 1), backward induction holds: take immediately.  
       - With a sliver of doubt (Run 2), A passes if the chance of B being forced makes passing worthwhile. Here, 15% is enough because payoffs scale fast (passing gives 9 with 15% chance, expected 1.35 > 1).  
       This shows **common knowledge isn’t just ‘everyone is rational’—it’s ‘everyone knows everyone knows...’ infinitely. A tiny break in the chain changes everything**."

  3. **Recovering Reasoning Depth** (5 mins):
     - Use move records to infer cognitive steps:  
       - If a student took in Round 1 (baseline), they used 0–1 levels of reasoning ("I take; no need to think about partner").  
       - If they passed in Round 1 but took in Round 2/3, they used 1–2 levels ("I pass because partner might pass" or "Partner will take next, so I wait").  
       - In uncertainty run, passing in Round 1 implies 2+ levels ("Partner might pass because they think I might be forced").  
     - Ask volunteers: "Who passed in Round 1 of Run 2? What did you think your partner would do?" Use responses to illustrate higher-order beliefs.

  4. **Connecting to Theory** (5 mins):
     - "In game theory, **common knowledge of rationality** (CKR) means:  
       - Level 0: I am rational.  
       - Level 1: I believe you are rational.  
       - Level 2: I believe you believe I am rational.  
       - ...and so on, infinitely.  
       Run 1 assumed CKR; Run 2 broke it with 15% doubt.  
       Without CKR, we can’t do backward induction—beliefs become ‘they might not be rational, or they might think I’m not, or...’."

  ---

  ### **What Could Go Wrong (and Mitigation)**
  1. **First-run passing**: Students might pass in Round 1 (e.g., altruism or misunderstanding).  
     - **Mitigation**: Emphasize "maximize your points" in instructions. If >30% pass, use it: "Some passed—why? Without CKR, backward induction fails. But most didn’t, showing implicit CKR."

  2. **Uncertainty-run confusion**: Students might not grasp "must pass" rules or doubt the 15%.  
     - **Mitigation**: Use colored cards for clarity. Reiterate: "15% per game, private, reshuffled." Pre-test cards with a volunteer.

  3. **Risk aversion**: Students may take early in Run 2 to avoid risk (e.g., fear of getting 0).  
     - **Mitigation**: Superlinear payoffs (1 → 4 → 9 → 16) make passing rational even for risk-averse players (expected value of passing in R1: 15% × 9 = 1.35 > 1). Debrief: "Even if you took, the math says pass—doubt changes incentives."

  4. **Pairing delays**: Random re-pairing can eat time.  
     - **Mitigation**: Use pre-shuffled role cards or an app to assign pairs/roles quickly.

  5. **Data collection**: Students might misrecord moves.  
     - **Mitigation**: Use simple record sheets; walk around to assist.

  **Limitation of the Game**:  
  - The game stages 2–3 levels of reasoning ("I think they might be forced") but not deeper epistemic chains (e.g., "I think they think I think..."). It can’t perfectly model infinite common knowledge, but the discontinuity effect (tiny doubt → big change) compensates.

  ---

  ### **Confidence and Refinements**
  - **Confidence**: 90% in the payoff design and discontinuity effect (based on centipede game literature). The 15% threshold is calibrated (9 × 0.15 = 1.35 > 1), so passing is rational in Run 2.
  - **Least sure part**: Whether students will intuitively pass in Run 2 without explicit math. Mitigation: Use the debrief to reveal the expected-value calculation.
  - **Refinement**: If short on time, reduce to 2 games per run. For large classes, use digital tools (e.g., online forms) for pairing/data.

  This plan creates a visceral contrast: Run 1 feels like a "rationality trap," while Run 2 introduces doubt that encourages cooperation. The discontinuity in outcomes dramatizes why common knowledge is pivotal in game theory.
