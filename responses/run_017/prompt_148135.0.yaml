prompt: |-
  I am in the final year of an economics degree, and alongside my coursework I am taking a philosophy seminar on the ethics of deception. This week's question is whether lying is morally different from merely misleading someone. Assume I have read the seminar material: I do not need the debate explained in its own terms. What I want is for you to restate it in the vocabulary I actually work in, and then to tell me what the translation fails to carry.

  On my vocabulary, so you can calibrate: I am comfortable with sender–receiver games over a state space — cheap talk, where messages are costless labels whose content is assigned by the equilibrium rather than by the modeller; costly signalling in the Spence style; verifiable disclosure and the unravelling argument; and information design, where a designer commits ex ante to a signal structure, understood as a stochastic map from states to signals, with the receiver's incentives summarised by an obedience constraint, so that what matters is the induced distribution over posteriors rather than any individual message. I am also used to distinguishing a sender's ex ante choice of signal structure from an ex post deviation within it, and to reasoning about off-path beliefs.

  Please do three things.

  First, restate as faithfully as you can both sides: the claim that lying is morally distinctive, typically on the ground that assertion is governed by a norm that mere misleading does not violate, and the sceptical claim that the two differ only in technique and not in moral status. Give each as a claim about states, signals, constraints and payoffs, not as a claim about words.

  Second, try to find formal homes for two things I suspect are doing the real work. (a) Falsity: in my models a message is just a label, so saying something false is not yet a property of anything. What would have to be added — an exogenously fixed truth-conditional map from messages to events, a verifiability constraint, something else — before a lie is representable at all? And is adding it a translation or an import? (b) A conjecture of my own, which I would like you to test rather than endorse: that the difference is not fundamentally about truth but about records. A lie, on this view, inserts a false entry into something that persists and that others will rely on and act on later; misleading leaves the record true but thin. The wrong lies in corrupting a shared object and in the cost of repairing it, not in the momentary effect on one hearer's beliefs. Is there anything in my vocabulary that a record could be — a public signal surviving across periods, a commitment constraining later equilibria, a belief that third parties treat as given? If the best you can do is identify the record with a receiver's posterior or with a downstream payoff, say so and say what that identification costs.

  Third, the residue report. Tell me which moves in the philosophical debate translated without loss; which translated only after you quietly added something to my framework — flag every such addition explicitly, and pay particular attention to places where the translation smuggles in welfarist evaluation, since the non-consequentialist side holds that the wrong of lying is not a matter of outcomes and a payoff-based translation may simply be blind to that claim; and which claims have no counterpart in the vocabulary at all. Then give me your view on what the residue indicates: is it a defect of the economic vocabulary, or evidence that the distinction philosophers defend is thinner or more context-dependent than it looks? One specific request within this: try representing the norm against lying as a restriction on the set of admissible signal structures rather than on payoffs, and tell me whether that restriction and the corresponding restriction against misleading have the same formal shape. I have a suspicion that one is a state-by-state constraint and the other a constraint on the structure taken as a whole, but I would rather you derived the answer than agreed with me.
reasoning: |-
  We are given an economics student's request to translate a philosophical debate about the moral difference between lying and misleading into the vocabulary of sender-receiver games, information design, and related concepts. The student is familiar with state spaces, signals, equilibrium concepts, and constraints. We are to do three things:

  1. Restate both sides of the debate (lying as morally distinctive vs. lying and misleading being morally equivalent) in the provided vocabulary.
  2. Formally represent two concepts: (a) falsity (what must be added to define a lie) and (b) the student's conjecture that the difference lies in the creation of a false record that persists and is relied upon by others.
  3. Provide a residue report: which parts of the debate translate well, which require additions, and which have no counterpart. Also, represent the norm against lying as a restriction on signal structures and compare it to a restriction against misleading.

  Let's proceed step by step.

  ### 1. Restating the Debate in Economic Terms

  **The Philosophical Claims:**

  - **Pro-distinctiveness:** Lying violates a norm of assertion that misleading does not. Lying requires saying something false, while misleading can be done by saying something true but in a way that leads the listener to a false belief.
  - **Sceptical view:** Both lying and misleading are techniques to induce false beliefs and are morally equivalent in their intent and effect. The difference is merely in the method.

  **Translation to Economics Vocabulary:**

  Consider a standard sender-receiver game. The state of the world is drawn from a set Θ. The sender observes the state θ and sends a message m from a message set M. The receiver observes m and takes an action a from a set A. Payoffs are u_s(θ, a) for the sender and u_r(θ, a) for the receiver.

  In cheap talk, messages are costless and have no pre-game meaning; their meaning is determined in equilibrium. In information design, the sender commits to a signal structure (a stochastic mapping from Θ to M) before the state is realized.

  **Pro-distinctiveness (lying is morally distinctive):**

  - **Claim:** In the space of possible signal structures (or message strategies), there is a constraint that prohibits the sender from sending a message that is false in the state. That is, there is an exogenously given truth-conditional mapping: each message m is associated with a set of states in which it is true. A lie occurs when in state θ, the sender sends a message m that is false in θ (i.e., θ is not in the set of states where m is true). 
    
    By contrast, misleading does not violate this constraint because the sender sends a message that is true in the state (i.e., θ is in the set of states for which m is true) but which is chosen so that the receiver's equilibrium action (or posterior belief) is not the one that would be chosen under full information.

    Formally, we can imagine that the signal structure is constrained such that in every state θ, the message sent must be one that is true in θ. This constraint would rule out lying but allow misleading.

  **Sceptical view (no moral difference):**

  - **Claim:** The only thing that matters for the sender's morality is the induced distribution of the receiver's posterior beliefs and the resulting actions. Both lying and misleading are strategies that can lead to the same posterior beliefs in the receiver. Therefore, they are equivalent in terms of their impact and hence in moral status. 

    In terms of the model, the sceptic would argue that the sender's strategy (whether it lies or merely misleads) is irrelevant to the outcome. What matters is the joint distribution of the state and the receiver's posterior. Thus, the sceptic would evaluate the sender's behavior solely by the outcome (the induced distribution over posteriors) and not by the particular messages used.

  ### 2. Formal Representation of Falsity and the Record Hypothesis

  #### (a) Falsity

  In the standard models, a message is just a label. To define a lie, we need an exogenous truth-conditional mapping. 

  - **What to add?** We must add a function T: M → 2^Θ, where T(m) is the set of states in which message m is true. Then, in a given state θ, a message m is a lie if θ ∉ T(m). 

  - **Is this a translation or an import?** This is an import. The economic models (cheap talk, information design) do not typically include such a mapping. The meaning of messages is endogenous to the equilibrium. By adding T, we are imposing an exogenous semantic structure. This import is necessary to capture the concept of a lie as distinct from misleading.

  #### (b) The Record Hypothesis

  The student's conjecture: The moral difference is that a lie corrupts a shared record (which persists and is relied upon by others) while misleading does not.

  **Formal Representation:**

  To model a record, we need a persistent public signal that can be observed by multiple agents across time. Consider a dynamic extension:

  - **Setting:** A multi-period model with multiple receivers (or one receiver who acts multiple times) and/or third parties. The sender sends a message at time t, which becomes part of a public history. Future agents (or the same receiver in the future) observe this history and form beliefs accordingly.

  - **Formalization:** 
    - Let H_t be the public history up to time t, which includes all past messages. 
    - The state θ is fixed (or evolves exogenously) and is not directly observable by future agents. 
    - The message m sent at time t becomes part of H_{t+1} and is available for future reference.

  - **What is a lie in this context?** A lie at time t is a message m such that θ ∉ T(m). This false message is now in the public history and will be used by future agents to form beliefs about θ. 

  - **The harm of lying:** If the message is false, then future agents who rely on it might make suboptimal decisions. Moreover, correcting the record might be costly (if possible at all). 

  - **Misleading:** A true message (θ ∈ T(m)) that is chosen to mislead the immediate receiver does not corrupt the record. Future agents can still rely on the truth of the message, even if the immediate receiver was misled.

  - **Formal object for the record:** The record is the public history H_t. It is a common knowledge sequence of messages. The record is persistent and affects future play (by constraining future beliefs in a perfect Bayesian equilibrium, for example).

  - **Cost of repair:** If a lie is discovered, the sender might need to send a correction (if allowed) or the future agents might need to invest in verification. This could be modeled as a cost to the sender or to the system.

  **Is the record captured by a posterior or a downstream payoff?** 

  We could try to capture the record by the receiver's posterior, but that would be inadequate because the posterior is private and transient. The record is public and persistent. Similarly, downstream payoffs might reflect the consequences of relying on a false record, but they do not capture the record itself. 

  The best formalization is the public history. Without it, we cannot represent the record. The cost of repair would have to be modeled as an explicit cost function that depends on the public history (e.g., a cost if the public history contains a lie and if the truth is later revealed).

  ### 3. Residue Report

  **Translated Moves:**

  - The distinction between lying and misleading as strategies that induce false beliefs: This translates directly into the model with the truth mapping T. Lying is sending a false message (θ ∉ T(m)), while misleading is sending a true message (θ ∈ T(m)) that induces a false belief in the receiver (via the equilibrium mapping from messages to actions).

  - The sceptical view that the moral status depends only on the induced posterior: This is a standard outcome-based evaluation in economics. We can compare two signal structures (or strategies) that induce the same distribution of posteriors and say they are equivalent in terms of outcomes.

  **Moves Requiring Additions:**

  - **Falsity:** We had to add the truth mapping T. Without T, we cannot define a lie. This is an import because standard models do not have exogenous truth conditions.

  - **The norm of assertion:** The pro-distinctiveness claim requires that there is a constraint that the sender must send a true message. This constraint is a restriction on the sender's strategy: in every state θ, the message must be in the set {m : θ ∈ T(m)}. This is a state-by-state constraint.

  - **The record hypothesis:** We had to extend the model to multiple periods and include a public history. Without dynamics and public observability of messages, we cannot model the record.

  **Smuggling in Welfarism:**

  The economic vocabulary naturally focuses on outcomes (payoffs or distributions of posteriors). The sceptical view translates without residue because it is consequentialist. However, the non-consequentialist claim (that lying is wrong regardless of outcomes) is harder to capture. 

  - If we represent the norm against lying as a constraint on the signal structure (independent of payoffs), then we can avoid welfarism. But the constraint itself is non-consequentialist and does not appear in the payoff function. This constraint is not justified by payoffs but by an exogenous rule.

  - The record hypothesis might be given a welfarist interpretation (if we model the cost of repair and the harm from relying on false records), but the non-consequentialist might argue that corrupting the record is wrong in itself, not because of its costs. However, without including such costs in the payoff, the model might not capture the harm.

  **Claims with No Counterpart:**

  - The philosophical notion that assertion has a constitutive norm of truthfulness has no direct counterpart in the economic models. In economics, the meaning of messages is endogenous, and there is no built-in norm. This norm must be imposed exogenously.

  - The idea that the wrong of lying is not about outcomes but about violating a rule (a deontological constraint) has no natural expression in the payoff-based framework. We can impose the constraint, but we cannot derive it from the existing setup.

  **Representing the Norm as a Constraint on Signal Structures:**

  We are asked to represent the norm against lying as a restriction on the set of admissible signal structures and to compare it to a restriction against misleading.

  - **Norm against lying:** This requires that the signal structure must be such that for every state θ, every message m that is sent with positive probability in θ must be true in θ (i.e., θ ∈ T(m)). In other words, the signal structure must be a subset of the truth-telling strategies. This is a constraint on the signal structure that must hold state-by-state.

  - **Norm against misleading:** What would this be? Misleading involves inducing false beliefs without lying. But note that in any non-fully revealing equilibrium, there is some degree of misleading. A strict norm against misleading might require that the signal structure be fully revealing. That is, the receiver's posterior must be degenerate and equal to the true state. 

    Alternatively, a norm against misleading might be defined as a restriction on the induced posterior beliefs: perhaps that the receiver must always hold the correct belief about the state? But note that misleading is defined relative to the truth of the message, not the induced belief. However, if we take the sceptical view that the moral wrong is in inducing a false belief, then a norm against misleading would require that the receiver's action (or belief) is always the one that would be taken under full information. 

    But note: if we require that the signal structure be fully revealing, then it rules out both lying and misleading. However, the philosophical debate contrasts lying and misleading, so we must be careful.

    Alternatively, we might define a norm against misleading as requiring that the message sent must not be intended to mislead. But intention is hard to capture. 

    However, note that misleading is possible only because the receiver uses a non-degenerate strategy. If the receiver were to ignore the message, then no misleading would occur. But we cannot blame the sender for the receiver's inference.

    In economic terms, a norm against misleading might be represented by requiring that the sender's signal structure must be such that the receiver's optimal action given the posterior is the same as if they knew the state. That is, for every state θ, the action induced by the posterior must be the same as the full-information optimal action. This is a constraint on the induced actions (or beliefs) rather than on the messages.

  **Comparing the Constraints:**

  - The constraint against lying is on the signal structure at the message level: it restricts the mapping from states to messages. It is a state-by-state constraint (per state, the message must be true).

  - The constraint against misleading (if defined as inducing a false belief) is on the outcome: it restricts the mapping from states to receiver actions (or beliefs). It is also a state-by-state constraint: in every state, the receiver must take the full-information optimal action.

  But note: it is possible to satisfy the no-lying constraint without satisfying the no-misleading constraint (if the sender sends true messages that are vague enough to induce a non-optimal action). Conversely, it is possible to satisfy the no-misleading constraint without the no-lying constraint? Actually, no: if the sender lies and the receiver is misled, then the action might be non-optimal. But if the sender lies and the receiver is not misled (because the receiver does not believe the lie), then the action might still be optimal. However, in equilibrium, the receiver's beliefs are consistent. So if the sender lies in a state, and if the receiver believes the lie in that state, then the action will be non-optimal. But if the receiver does not believe the lie, then the lie might not lead to a non-optimal action. 

  Therefore, the constraint against misleading (if defined as inducing the full-information optimal action in every state) is a constraint on the overall equilibrium outcome. It is not directly on the sender's strategy but on the combination of sender's strategy and receiver's strategy. 

  Moreover, to have a norm against misleading that is distinct from a norm against lying, we must define it without reference to truth of messages. The sceptical view would collapse the two: both are bad if they lead to suboptimal actions. But the pro-distinctiveness view might hold that lying is wrong even if it does not mislead (e.g., when the receiver doesn't believe it) and that misleading without lying is less wrong. However, note that in the record hypothesis, even an unsuccessful lie might corrupt the record.

  **Conclusion on Residue:**

  - The residue indicates that the economic vocabulary is not well-suited to capture non-consequentialist moral constraints without explicit imports (like the truth mapping and deontological restrictions). The vocabulary is designed for outcome-based analysis.

  - The distinction between lying and misleading is thinner in the economic framework because without the truth mapping, they are just different message strategies that might lead to the same outcome. The record hypothesis offers a way to capture a non-consequentialist harm (corrupting a public record) but requires extending the model to include dynamics and public observability.

  - The residue also suggests that the philosophical distinction might be context-dependent: in a static setting without a record, the difference might not matter, but in a dynamic setting, lying might be more harmful.

  **Final Representation of Norms:**

  - **Norm against lying:** Restrict the sender's signal structure to those that satisfy: for every state θ, the support of the signal structure in θ is contained in {m: θ ∈ T(m)}. This is a state-by-state constraint.

  - **Norm against misleading (if defined as inducing non-optimal actions):** Restrict the signal structure and the receiver's strategy such that in every state θ, the receiver's action is equal to the full-information optimal action. This is a state-by-state constraint on the outcome. However, note that this constraint is not solely on the signal structure but on the equilibrium. Moreover, it would rule out any non-fully revealing signal structure.

  Alternatively, if we define a norm against misleading as not allowing the sender to use a message that is true but intended to deceive, we run into the problem of defining intention. In economic terms, we might interpret it as a restriction on the signal structure that requires that in every state, the message sent must not only be true but also must be such that the receiver's posterior belief is the true state. But that would require the signal structure to be fully revealing, which is a very strong constraint and would rule out all non-fully revealing strategies (including those that are merely misleading without lying).

  Therefore, the two constraints (against lying and against misleading) do not have the same formal shape: 
  - The constraint against lying is on the messages (they must be true) and is a per-state constraint on the sender's strategy.
  - The constraint against misleading (if we take it to mean no false beliefs) is on the induced beliefs/actions and is a per-state constraint on the equilibrium outcome. This constraint is much stronger and implies full revelation.

  This supports the student's suspicion: the constraint against lying is a state-by-state constraint on the signal structure, while the constraint against misleading (if we define it as inducing correct actions) is also state-by-state but on the outcome and much more demanding. However, note that the philosophical debate does not typically require that misleading is ruled out entirely (it might be that some misleading is acceptable) but that there is a difference in kind between lying and misleading. Therefore, the economic translation might not perfectly capture the philosophical nuance.

  **View on Residue:**

  The residue (the need to add T and the public history, and the difficulty in capturing non-consequentialist constraints) indicates that the economic vocabulary is limited in its ability to capture the philosophical distinction without extensions. However, these extensions are natural in economics (we do model exogenous meanings and dynamic games). The fact that the distinction becomes thinner in a static setting might be evidence that the moral difference is context-dependent and hinges on factors like persistence and publicness. The record hypothesis offers a promising avenue for capturing a non-consequentialist harm in a way that can be modeled in economics.
answer: |-
  ### Restatement of the Debate in Economic Vocabulary

  #### **1. The Two Claims Formalized**

  - **Pro-distinctiveness claim (lying is morally distinctive):**  
    In sender-receiver games, the moral norm against lying is modeled as an **exogenous constraint on the sender's message strategy**. Specifically, there exists a **truth-conditional mapping** \(T: M \to 2^\Theta\), where \(T(m)\) is the set of states where message \(m\) is true. A lie occurs when, in state \(\theta\), the sender sends a message \(m\) such that \(\theta \notin T(m)\). This violates a **state-by-state constraint** on admissible strategies: the sender’s strategy \(\sigma_S(\cdot | \theta)\) must satisfy \(\text{supp}(\sigma_S(\cdot | \theta)) \subseteq \{m \mid \theta \in T(m)\}\) for all \(\theta\). Misleading, in contrast, occurs when the sender sends a true message (\(\theta \in T(m)\)) but exploits the receiver’s off-path beliefs or equilibrium beliefs to induce a suboptimal action. The moral distinction arises from violating the truth constraint, independent of outcomes.  

  - **Sceptical claim (no moral difference):**  
    Both lying and misleading are strategies that induce a **target distribution of posteriors** \(\tau \in \Delta(\Delta\Theta)\). The moral status depends solely on this distribution and its induced payoffs. Let \(\mathcal{E}\) be the set of feasible posterior distributions achievable under incentive-compatibility (obedience) constraints. Lying and misleading are **outcome-equivalent** if they induce the same \(\tau\). The sceptic argues that any moral evaluation must reduce to a function of \(\tau\) (e.g., expected welfare \(W(\tau)\)), and distinctions based on message-level properties (e.g., truth-conditional violations) are irrelevant if \(\tau\) is identical.  

  #### **2. Formalizing Falsity and the Record Hypothesis**  

  **(a) Falsity: What must be added to define a lie?**  
  - **Addition required:** An **exogenous truth-conditional mapping** \(T: M \to 2^\Theta\). This assigns semantic content to messages independently of the equilibrium.  
  - **Formal representation of a lie:** In state \(\theta\), a lie is a message \(m\) with \(\theta \notin T(m)\). Without \(T\), lies are undefined because messages lack truth-conditional content.  
  - **Is this a translation or import?**  
    - **Import.** Economic models (cheap talk, information design) treat messages as arbitrary labels; meaning is endogenous to equilibrium beliefs. Adding \(T\) imports semantic structure from philosophy. It violates the **equilibrium-dependence of meaning** central to economic models.  

  **(b) The Record Hypothesis (testing your conjecture):**  
  - **Conjecture:** Lying is wrong because it inserts false content into a **persistent public record**, which third parties rely on across periods. Misleading leaves the record true but incomplete.  
  - **Formalization attempt:**  
    - **Setup:** A dynamic game with public histories. Let \(H_t\) be the public history at time \(t\), including all past messages. States \(\theta\) are fixed (or evolve exogenously). Messages become part of \(H_{t+1}\).  
    - **Record as a public signal:** The record is \(H_t\), a **publicly observable, persistent signal** that affects future sender-receiver interactions.  
    - **Lie vs. misleading:**  
      - **Lie:** Sending \(m\) in \(\theta\) with \(\theta \notin T(m)\). This corrupts \(H_t\) with false data, forcing future agents to expend resources to correct beliefs (e.g., via costly verification or belief revision).  
      - **Misleading:** Sending \(m\) with \(\theta \in T(m)\) but \(\mathbb{E}[u_R(a, \theta) \mid m] < \max_a \mathbb{E}[u_R(a, \theta) \mid \theta]\). The record remains "true" but uninformative; no correction is needed.  
    - **Harm of lying:** Quantified as a **cost function** \(C(H_t, \theta)\), where \(C\) is high if \(H_t\) contains lies and \(\theta\) is later revealed.  
  - **What the record *cannot* be:**  
    - **Not a posterior:** Posteriors are private, transient beliefs. The record is public and persistent.  
    - **Not a payoff:** Downstream payoffs (e.g., from corrupted records) capture *consequences* but not the *structural corruption* itself.  
  - **Cost of identification:** Equating the record with payoffs (e.g., \(C(H_t, \theta)\) as a payoff penalty) **consequentializes** the harm, which may misrepresent the non-consequentialist claim that corrupting the record is wrong *per se*.  

  #### **3. Residue Report**  

  **Translated without loss:**  
  - **Sceptical claim:** Outcome-equivalence (same \(\tau \implies\) same moral status) maps directly to information design. Welfare comparisons based on \(\tau\) are native to economics.  
  - **Pro-distinctiveness strategy constraints:** Restricting sender strategies (e.g., "no lies" as \(\text{supp}(\sigma_S(\cdot | \theta)) \subseteq \{m \mid \theta \in T(m)\}\)) is a standard constraint in mechanism design.  

  **Translated with additions (flagged explicitly):**  
  - **Truth-conditional mapping \(T\):** Required to define lies. **Added:** Exogenous \(T: M \to 2^\Theta\). This is an **import** (not native to economics) and violates equilibrium-dependence of meaning.  
  - **Dynamic records:** Required for the record hypothesis. **Added:** Public histories \(H_t\) and a cost \(C(H_t, \theta)\) for belief revision/correction. This extends static models but uses standard tools (dynamic games).  
  - **Non-consequentialist smuggling:**  
    - Representing the harm of lying as \(C(H_t, \theta)\) **smuggles in welfarism**. The philosophical claim is that lying violates a duty (to not corrupt shared records), even if \(C = 0\). Economics lacks a formalism for duties divorced from payoffs.  

  **No counterpart in vocabulary:**  
  - **Assertion norms:** The idea that "assertion is governed by a truth norm" has no economic analogue. Economics has no native concept of speech acts or their constitutive rules.  
  - **Deontic constraints:** The claim that lying is wrong *regardless of outcomes* cannot be expressed without exogenous constraints (e.g., \(T\)-based restrictions on \(\sigma_S\)). Payoff-based models are blind to this.  

  **Formalizing norms as signal structure restrictions:**  
  - **Norm against lying:** Restricts admissible signal structures \(\pi: \Theta \to \Delta M\) to those where \(\pi(m \mid \theta) > 0 \implies \theta \in T(m)\). This is a **state-by-state constraint** (must hold for every \(\theta\)).  
  - **Norm against misleading:** Requires that the signal structure induces optimal actions *state-by-state*. Formally, for all \(\theta\), the receiver’s equilibrium action \(a^*(m)\) must satisfy \(a^*(m) = \arg\max_a u_R(a, \theta)\) for all \(m\) sent in \(\theta\). This is also a **state-by-state constraint**, but it is **stronger**: it implies full revelation, while the no-lying constraint does not.  
  - **Your suspicion confirmed:** Both are state-by-state constraints, but the no-misleading constraint is strictly more demanding (it requires full revelation).  

  **What the residue indicates:**  
  - **Defect of economic vocabulary:** It struggles with **non-consequentialist concepts** (duties, norms) and **exogenous semantics** (\(T\)). Economics is outcome-focused; moral distinctions based on actions (not outcomes) require bolt-on constraints.  
  - **Evidence for philosophical thinness/context-dependence:** The record hypothesis *can* be formalized in economics (via dynamic \(H_t\)), suggesting the distinction relies on **persistence and publicity**—features absent in static models. In one-shot games, the distinction collapses to semantics (\(T\)), which economics treats as arbitrary. This implies the moral difference is **context-dependent**: salient in dynamic/communal settings, negligible otherwise.  

  ### Summary  
  The debate translates cleanly for consequentialists (sceptics) but requires imports (\(T\), dynamic records) for non-consequentialists. The residue—non-outcome-based duties and assertion norms—exposes economics' welfarist bias. Your record hypothesis is viable (as a dynamic public signal) and reveals that the lying-misleading distinction gains traction when messages persist as public goods. Representing norms as constraints confirms that no-lying is state-wise feasible without full revelation, while no-misleading demands full revelation. This suggests the philosophical distinction is robust only in specific, structured contexts.
