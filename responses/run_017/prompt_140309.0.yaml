answer: |-
  Here’s a critical analysis addressing your queries point-by-point, drawing solely on established philosophical/scientific discourse (reconstructions flagged):

  ### 1. §2: Supplied-Reason Objection  
  **Independence & Novelty**: Your argument is a sharpened variant of the "moral perception" objection (e.g., Annas, Blum), but distinct in framing the experiments as *structurally incapable* of testing virtue-essential perception. It avoids collapsing into competence/performance (which focuses on latent capacities vs. manifest behavior) by targeting experimental *design* rather than trait ontology.  
  **Does it prove too much?** Yes, as stated: If *any* behavioral failure can be attributed to "unsalient reasons," trait attribution becomes empirically unfalsifiable.  
  **Repair**: Restrict the objection to experiments where salience is *artificially maximized* (e.g., Milgram’s prods, Darley-Batson’s hurry induction). Emphasize that virtues require *spontaneous* reason-recognition, but concede that repeated perceptual failures *in ecologically valid contexts* would undermine trait claims. Your falsifiable prediction remains intact: Test subjects in environments with *graded* salience (e.g., obscured but detectable distress cues).  

  ### 2. §3: Individuation Parity  
  **Strongest Situationist Reply**: Situationists (e.g., Doris in *Lack of Character*) argue their categories (e.g., "diffusion of responsibility") *are* validated by *convergent manipulation*: Different manipulations of the *same situational variable* (e.g., group size, anonymity) produce similar effects. They’d reject demanding cross-*content* robustness (e.g., "authority" in Milgram vs. a teacher) as your argument implies. Their taxonomy is *functional* (based on effect size), not metaphysical.  
  **Your Rebuttal’s Vulnerability**: You risk smuggling in an implausible demand for *content-invariant* situational kinds. Situationists need only show that *specific* situational factors reliably fragment behavior—which their paradigms do. Your parity argument holds only if virtue traits are held to similarly "thin" functional standards (e.g., "helpfulness" across diverse contexts) *and* fail.  

  ### 3. §4: Dramatic-Instance Problem  
  **Statistical Coherence**: Yes. The selection effect resembles the "file drawer problem" (non-significant/unspectacular results unpublished) but applied to *surprise value* (dramatic trait-failure favored). Methodologists call this "bias from extreme samples" or "selection by effect extremeness."  
  **Magnitude of Bias**: Likely non-trivial: Replications of classic studies often show smaller effects (e.g., Burger’s partial Milgram replication). However, *many* non-dramatic studies *also* find low trait-behavior correlations (e.g., meta-analyses on honesty). The critique still stands: The canon overrepresents *extreme* failures, but low base-rate consistency isn’t *solely* an artifact.  

  ### 4. §5: Concession on Fragility & Scaffolding  
  **Does it undermine §2?** Partially. If virtues are scaffolded, §2’s "perceptual capacity" may *also* depend on environmental supports (e.g., cultural narratives cueing attention to suffering). However, §2 still does work: It shows why *current experiments* don’t test virtue-relevant perception. The concession reframes (but doesn’t erase) your core point: Situationism reveals virtues as *ecological* traits (agent-environment couplings), not disembodied imperatives. Keep §2 but pivot to argue that *even scaffolded virtues* require stable perceptual sensitivity—which the experiments miss.  

  ### 5. Structure & Unaddressed Critique  
  **Centre vs. Footnote**:  
  - **Centre**: §2 (perceptual gap) + §4 (selection bias). These directly challenge the inference from (i) to (iii).  
  - **Demote**: §3 (individuation). It’s defensible but less lethal; situationists can retreat to local fragmentation claims.  
  - **Integrate**: §5 as synthesizing conclusion (virtue ethics revised, not refuted).  
  **Strongest Unaddressed Critique**: The "no traits whatsoever" argument (Harman): Even if traits exist, they explain so little variance that they’re *explanatorily inert*. Your response implies traits might explain perceptual sensitivity, but Harman/Doris would demand evidence this sensitivity predicts behavior *better than situational cues*—which §4’s bias doesn’t resolve. Address this head-on: Argue that *if* your §2 prediction holds, traits *would* explain unique variance.  

  ### 6. Critical Distinction Needed  
  **Robustness vs. Consistency**: You run these together in §1(ii) and §3.  
  - **Consistency**: Same behavior across similar situations (e.g., helpfulness in *all* low-stakes scenarios).  
  - **Robustness**: Trait expression across *dissimilar* situations (e.g., courage in battle *and* whistleblowing).  
  Situationists attack *robustness* (traits fail in "non-corresponding" contexts). Your §2 objection relies on demanding *robust* perception—but concedes fragility in §5. **Distinguish them explicitly**: Argue virtues require robustness in *reason-perception* (seeing demands in diverse contexts), but not necessarily in *action* (which may require scaffolding). This saves §2 from §5.  

  ### Overall Assessment  
  - **§2**: Strong but needs refinement (per §1 repair).  
  - **§3**: Weaker; situationists can resist your taxonomy demand.  
  - **§4**: Potentially devastating; underutilized in literature.  
  - **§5**: Necessary concession; integrate it as a *revision* rather than defeat.  
  **Core Argument Viability**: Sound. You successfully show situationism’s evidence can’t support *strong quantitative claims*, forcing a retreat to fragility-based revisionism. The falsifiable prediction in §2 is a major strength.  

  **Word Count**: ~950
