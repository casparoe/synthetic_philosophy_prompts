prompt: |-
  Doing a forty-minute slot at a crime-writing festival in Bristol in October — about thirty novelists, no philosophy between them, no slides, a flipchart if I can be bothered — on the wrong kind of reasons. It's billed as 'writing characters who get paid, blackmailed or nagged into feelings'.

  The case I keep coming back to is one of my own: my detective is offered fifty grand by a tabloid to believe a suspect is guilty, and then, in a seperate scene, the same money to *admire* him. Which makes me wonder whether one example can carry the whole thing, or whether the admiration one quietly breaks the machinery, since admiration doesn't seem to have the sort of thing-it's-meant-to-get-right that belief has.

  So don't explain it to me — plan the session. What has to be in place before 'wrong kind of reason' means anything at all to them, and in what order do the pieces have to land and why? They'll definately arrive thinking the fifty grand obviously *is* a reason, and that 'wrong kind' just means 'not a very good one'. Which example should carry it, and what does it have to have and what must it lack? The misconceptions I'm braced for: that the money is merely outweighed; that this is really only about belief, or only about evidence; that 'you have a reason to make yourself believe it' is just the same claim as 'you have a reason to believe it'; and that a bribe can't cause a belief anyway. Where in the sequence should I head off each one? Give me one question to end on that shows they've got it rather than just nodding along, and tell me what to flatly refuse to get into at this level — I assume the argument about what 'good' means that all this grew out of, but say if something else will swallow the hour.
reasoning: |-
  Okay, the user is preparing a session on "wrong kinds of reasons" for a crime-writing festival. They're a novelist dealing with other novelists, so the approach needs to be practical and engaging, not philosophical jargon. The core example is their detective offered money to believe a suspect is guilty and then to admire him. The challenge is making "wrong kind of reasons" clear without getting bogged down in theory.

  First, I need to establish what a "wrong kind of reason" means. The attendees will likely think it's just a weak reason, so I have to clarify it's about the type of reason, not its weight. The key is to show that some incentives don't relate to the truth (for belief) or inherent value (for admiration).

  The user mentioned common misconceptions: money being outweighed, confusion between causing belief and having a reason, equating reasons to believe with reasons to make yourself believe, and thinking bribes can't cause belief. Each needs addressing in sequence.

  Starting with why we care about reasons in crime writing makes sense—motives drive plots. Then, distinguishing types of reasons (motivational vs. normative) sets the foundation. Using the bribe to believe example first highlights the truth-tracking issue. Contrasting with the admiration case shows how different attitudes have different standards. The "making yourself believe" point tackles the conflation misconception. Ending with a practical exercise like "money to regret a murder" tests their grasp.

  The closing question should force application: "What would make the money the right kind of reason to admire?" If they focus on inherent qualities, they get it. Avoid diving into moral philosophy or "good" definitions—stay practical. Keep it focused on narrative tools, not abstract debates.
answer: |-
  Here’s a battle-tested session plan designed for novelists, avoiding philosophy jargon and leveraging your example. The goal is **intuitive grasp, not technical precision**.

  **Core Objective:**  
  Make them feel the *structural mismatch* between certain incentives (money, threats) and the attitude demanded (belief, admiration). "Wrong kind" = "Can’t even register on this attitude’s scale".

  **Misconceptions & When to Tackle Them:**  
  1.  **"Money is just outweighed"** → Crush this IMMEDIATELY in Step 2.  
  2.  **"This is only about belief/evidence"** → Undercut by Step 4 (Admiration).  
  3.  **"Reason to believe = Reason to make yourself believe"** → Explicitly break in Step 3.  
  4.  **"Bribes can't cause belief anyway"** → Sidestep (not relevant to *reasonhood*).

  ---

  **The Session Plan (40 Mins):**

  1.  **Hook: Why We Care About "Why"? (5 mins)**  
      *   **Start:** "Crime lives on motives. Your killer acts for a *reason*. Your sleuth pursues for a *reason*. But what if the reason offered... doesn't actually *fit* the feeling or action it's supposed to produce? What if it's the *wrong currency*?"  
      *   **Novelist Lens:** "It creates character tension, hypocrisy, self-deception – gold for us. But how do we spot that mismatch authentically?"  
      *   **Flipchart (Optional):** Draw two columns: **ATTITUDE/ACTION** | **REASON OFFERED**.

  2.  **Set-Up: The Bribe to BELIEVE (10 mins)**  
      *   **Present:** "Detective is offered £50K by a tabloid to *believe* Suspect X is guilty. Suspect might be guilty, might not. Money’s real."  
      *   **Ask:** "Is the money a *reason* for the detective to believe X is guilty? (Get a show of hands Yes/No/Unsure). *Why* do you say that?"  
      *   **Target Misconception #1 (Outweighed):** "If you think 'Yes, but it's a bad reason because evidence matters more' – STOP. Imagine the evidence is *perfectly balanced*. Does the money *add weight* on the 'guilty' side? Could you say 'Well, the knife puts it at 50/50, but the cash tips it to 51/49?'" (Let them sit with the absurdity).  
      *   **Key Point:** "Belief is supposed to track *truth*. What makes it reasonable? **Evidence, testimony, logic.** The £50K isn’t evidence *for guilt*. It's a motive to *arrive at that belief regardless*. **It doesn’t aim at the same target.** That’s the 'wrong kind'."  
      *   **Flipchart:** Under **ATTITUDE: BELIEF (Guilt)** | **WRONG KIND REASON: £50K (Bribe)** | **RIGHT KIND: Evidence, Logic, Witnesses**.

  3.  **Deepen: "Making Yourself Believe" vs. "Having Reason to Believe" (5 mins)**  
      *   **Present:** "Okay, but couldn't the detective *use* the money as a reason *to make himself believe*? To hire a hypnotist? To brainwash himself?"  
      *   **Ask:** "Is that the *same thing* as having a reason *to believe* it's true?"  
      *   **Key Point:** **TARGET Misconception #3.** "NO! The money *might* be a reason to *try to acquire the belief* (motivational reason). But it’s still utterly irrelevant to *whether the belief itself is reasonable or justified* (epistemic reason). One is about *causing a state*, the other is about *supporting the content* of that state. Huge difference."  
      *   **Flipchart:** Add: **REASON TO *MAKE YOURSELF BELIEVE*** ≠ **REASON *TO BELIEVE***.

  4.  **The Twist: Bribe to ADMIRE (10 mins)**  
      *   **Present:** "Now, same detective, same tabloid, same £50K. This time, they want him to sincerely *admire* Suspect X. Not pretend, *feel* admiration. X might be admirable, might be a monster. Money's still real."  
      *   **Ask:** "Is *this* money a reason to admire X? (Show of hands). Why/Why not? *Is it the same or different from the belief case?*"  
      *   **Target Misconception #2 (Only about Belief):** "Admiration isn't about truth-tracking. It's about *perceiving value* – courage, brilliance, kindness. What makes admiration reasonable? **Witnessing admirable qualities, acts, achievements.**"  
      *   **Key Point:** "The £50K isn't evidence X *is* admirable. It's a motive to *feel admiration regardless*. **It bypasses the thing admiration is meant to respond to.** Just like the belief bribe bypassed truth. *Same structural mismatch*, different attitude! The 'kind' is wrong because it doesn't connect to the *standard of appropriateness* for admiration."  
      *   **Flipchart:** Add **ATTITUDE: ADMIRATION** | **WRONG KIND REASON: £50K (Bribe)** | **RIGHT KIND: Courage, Skill, Generosity (Observed)**.

  5.  **Contrast & Consolidate (5 mins)**  
      *   **Ask:** "What do BOTH cases share? Why is the money the 'wrong kind' in *both*?"  
      *   **Guide Them To:** "The money isn't a reason that speaks to *what makes the attitude fitting or correct*. For belief, correctness = truth. For admiration, correctness = perceived inherent worth/value. The money is external, transactional; it doesn’t engage with the attitude's internal standard."  
      *   **Flipchart Summary:** Circle the "RIGHT KIND" entries for each attitude. Emphasize the mismatch with the bribe.

  6.  **Test & Apply: The Closing Question (5 mins)**  
      *   **The Question:** "Imagine your protagonist is offered serious money by a shady billionaire to *genuinely regret* a specific murder they committed years ago. They don't currently feel regret. **Is the money a *reason for them to regret* the murder? Or is it the 'wrong kind' of reason? Why?**"  
      *   **Why it Works:**  
          *   Tests transfer (different attitude: regret).  
          *   Regret's "standard" is clear: recognizing the wrongness/harm *of the act itself*.  
          *   Forces them to articulate the mismatch ("Money doesn't make the act *more wrong*, it just incentivizes feeling bad").  
          *   Reveals if they grasp the core concept beyond your examples. Listen for: "It doesn't connect to why the act *was* regrettable," "It's about buying the feeling, not responding to the deed," etc.

  **What To FLATLY REFUSE To Get Into:**  
  1.  **The "Good" Debate:** DO NOT engage with "But what *is* good/regrettable/admirable?". Shut it down: "For this session, we're taking the character's perspective. *For them*, regret responds to perceived wrongness, admiration to perceived worth. We're looking at whether the money *speaks to that perception* or tries to bypass it."  
  2.  **Metaphysics of Belief Formation:** If "But can money *actually* cause real belief/admiration?" comes up: "Maybe, maybe not! That's a psychology question. We're asking: *If* it worked, would that cash be *justifying* the attitude, or just *motivating* it? Is it the *right currency*?"  
  3.  **Moralizing:** Avoid "bribes are bad". Focus on the *structural/logical mismatch*, not ethics. The "wrong kind" is a category error, not (necessarily) a sin.

  **Why This Sequence Works:**  
  1.  **Starts Concrete & Familiar:** Belief bribe is an easier entry point (truth-tracking is intuitive).  
  2.  **Smashes Biggest Misconception Early:** "Outweighed" is demolished in Step 2, clearing the path.  
  3.  **Uses Contrast Effect:** Showing the *same* structural flaw in admiration (Step 4) proves it's not unique to belief/truth.  
  4.  **Isolates Key Distinction:** Step 3 explicitly separates *causing* the attitude from *justifying* it.  
  5.  **Ends with Active Application:** The closing question isn't recall; it's a new test requiring conceptual transfer.  
  6.  **Avoids Quicksand:** Rigorously sidesteps philosophy rabbit holes. Stays focused on the novelist's tool: character motivation clashing with authentic feeling.

  **Carrying the Session:** Your belief/admiration contrast **can** carry it. The admiration case doesn't break it; it **strengthens** it by showing the generality of the "wrong kind" phenomenon beyond truth-tracking. The key is relentlessly linking each attitude to its specific "standard of appropriateness" and showing how the bribe ignores that standard. The flipchart visuals help solidify the contrasts. Good luck – it’s a great topic for writers!
