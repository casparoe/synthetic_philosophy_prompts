prompt: |-
  I'm on the breeding advisory board of a mid-sized dairy co-op — I'm not a philosopher, I'm on it because I'm one of the larger members — and I'm also doing an evening course in philosophy of biology, which has made our own spreadsheets look strange to me. Here's roughly what we do. We dont really pick bulls by looking at cows any more. Every calf is genotyped at birth at a few tens of thousands of markers and gets a number out of it, a "genomic estimated breeding value", which as far as I can tell is just the summed estimated average effects of the chunks of genome it happens to carry. We choose the sires off that number before the animal has ever sired anything or even seen a cow; the top handful get used enormously, one bull can end up with tens of thousands of daughters through artificial insemination, and the rest are more or less culled. On top of that we do three other things that don't seem to be at the same level at all: we keep performance records on individual cows and we have a rule that we won't use a bull whose profile predicts miserable longevity or bad calving ease, we cap how much any one sire can contribute to the next generation because otherwise the breed's "effective population size" falls off a cliff, and we all pay into a national gene bank that freezes semen and embryos from rare local breeds that nobodys farms commercially any more.

  So my question is what all of this presupposes about what selection is acting on, if it presupposes anything. On the face of it we've adopted a gene's-eye view as an engineering practice without anyone ever deciding to: the thing we evaluate, bank and optimise is a bundle of alleles, and the animal looks like a disposable vehicle for this year's draw from the gene pool. But my tutor keeps saying the gene-level, individual-level and group-level stories are different partitionings of one and the same causal process, so maybe counting alleles is only convenient bookkeeping and we're committed to nothing; and then the sire cap and the gene bank look like they only make sense if the breed or the population is a genuine unit that can do better or worse, which is the group-selection-flavoured thing I was told everybody had given up on decades ago. I'm less interested in being told which level is "really" the unit — I want to know what our practice commits us to. Which parts of it strictly presuppose the replicator / gene's-eye picture, which parts merely sit comfortably with it, and which parts an individual-level or multilevel picture would license just as happily? Suppose someone said we'd saved every allele of a rare breed in a freezer but let the breed die out as a living, breeding population — does our own practice give us anything to say about whether we conserved something or nothing? And if we genuinely took the individual animal, or the herd, to be the unit, what would actually change in what we do on Monday morning, and what would just be a different story told over the exact same decisions?
reasoning: |-
  Okay, the user is part of a dairy co-op breeding advisory board and is taking a philosophy of biology course. They're seeing contradictions between their practical breeding practices and philosophical concepts. Let me break down their situation.

  First, they use genomic estimated breeding values (GEBVs) to select bulls based on alleles, treating animals as disposable vehicles. But they also have rules like capping sire usage and preserving rare breeds. The user wants to know what these practices presuppose about selection units—genes, individuals, or groups.

  The user mentions their tutor says gene, individual, and group levels are just different views of the same process. They’re confused because their GEBV approach seems gene-centered, but capping sires and gene banking suggest group-level concerns. They’re not asking which unit is "real," but what their practices commit them to philosophically.

  Deep needs: They might be grappling with the practical implications of philosophical concepts. They need clarity on whether their practices are inconsistent or if different parts align with different levels. Also, they wonder if preserving alleles without living populations is meaningful conservation.

  I should address each practice: GEBVs are gene-centered, but convenience doesn't commit them exclusively. Performance records and welfare rules fit individual-level. Sire caps and gene banks imply group-level concerns, especially for genetic diversity and population health.

  The user also asks what would change if they switched focus. If prioritizing individuals, they might focus more on traits like robustness but still use similar metrics. For group-level, more emphasis on diversity, but GEBVs could still be a tool. The core practices might not change, but the rationale and priorities could shift.

  Need to clarify that saving alleles without a living breed conserves genetic material but loses evolutionary processes. Their gene bank values both alleles and the potential for future populations, which is a group-level consideration.

  In summary, their practices blend levels: GEBVs are gene-level tools, welfare rules are individual, and conservation efforts are group-aware. The commitments are pragmatic, using whichever level serves their goals without strict philosophical allegiance.
answer: |-
  Your practical breeding program is a fascinating case study in how philosophical commitments emerge implicitly from engineering practices. Let's break down what each component presupposes, commits to, or remains neutral about regarding units of selection, using your specific concerns:

  ### 1. **Genomic Estimated Breeding Values (GEBVs) & Bull Selection**
     - **Presupposes/Commits to:** A **replicator (gene/allele)-centric view**. GEBVs reduce an organism's value to the sum of estimated average allelic effects. This treats the animal as a transient "vehicle" (Dawkins' term) for allele combinations. The core action is *selecting alleles*, not organisms.
     - **Neutral About:** Individual phenotype as a *fundamental* unit. While GEBVs predict phenotypic traits, the *selection mechanism* bypasses individual performance data in favor of allelic proxies.
     - **Practical Implication:** This is efficient engineering precisely *because* it adopts the gene's-eye view. It allows prediction before phenotype is expressed, leveraging additive genetic variance. If you genuinely shifted to an "individual-as-unit" view, you'd delay selection until phenotypic data (e.g., daughter yield records) was available – which you deliberately avoid for speed.

  ### 2. **Performance Records & Welfare Rules (Longevity, Calving Ease)**
     - **Presupposes/Commits to:** An **individual-level** (vehicle) perspective. Rules like "no miserable longevity" acknowledge that the *organism's* fitness and welfare matter economically and ethically. This isn't just about allele propagation; it's about the viability and suffering of the individual cow carrying those alleles.
     - **Compatible With:** Multilevel selection. Protecting individual welfare prevents group-level costs (e.g., high cull rates, vet costs, ethical damage to the co-op's reputation).
     - **Practical Implication:** If you took *only* the gene's-eye view strictly, you might ignore these traits if they didn't directly impact short-term yield per lactation (e.g., if a cow with great milk genes died young but profitably). Your rules show you reject strict gene-centrism in practice.

  ### 3. **Sire Usage Cap (Maintaining Effective Population Size, Ne)**
     - **Presupposes/Commits to:** The **population/breed as a unit requiring conservation**. Capping sire contributions isn't primarily about individual bulls or their alleles; it's about maintaining genetic diversity *within the breeding population* to avoid inbreeding depression and preserve adaptive potential. This is **group-level (or population-level) selection thinking**.
     - **Contradicts Strict Gene-Centrism:** A pure gene's-eye view wouldn't care *which* alleles propagate, only that high-scoring ones do. Capping sacrifices *some* propagation of "top" alleles to maintain the diversity of the *collective* gene pool. This is about the health of the *system* (the population).
     - **Practical Implication:** If you abandoned the group-level view, you'd drop the cap, maximize short-term gain from the "best" bulls, and risk long-term collapse from inbreeding. This practice *only* makes sense if the population is a unit of concern.

  ### 4. **National Gene Bank (Conserving Rare Breeds)**
     - **Presupposes/Commits to:** **Multiple levels simultaneously:**
       - **Allele Level:** You conserve *specific alleles* (unique variants) frozen in semen/embryos.
       - **Breed/Population Level:** You conserve the *potential to reconstitute a specific population* with its unique co-adapted gene complexes, developmental trajectories, and historical adaptations. This is **explicitly group-level conservation**.
     - **Answering Your Question:** If you saved every allele but let the living breed die out, you conserved **alleles, but not the breed**. The *breed* is more than the sum of its alleles:
       *   It's the **specific combinations/interactions** of those alleles within a lineage.
       *   It's the **epigenetic and developmental context** shaped by generations in a specific environment.
       *   It's the **ongoing evolutionary process/potential** of an adapting population.
       *   **Your practice shows you understand this:** You pay into a "rare *breed*" bank, not just an "allele" bank. The goal is future reconstitution of the *population*, implying it *is* a distinct unit worth saving.

  ### What Changes on Monday Morning? A Thought Experiment
  *   **If You Switched Strictly to an "Individual-as-Unit" View:**
      *   You'd prioritize **individual phenotypic records** over GEBVs for selection (slowing progress).
      *   Welfare traits (longevity, calving ease) would become *more* central.
      *   **Sire Caps & Gene Banking Might Seem Irrational:** Why cap a great individual bull? Why save alleles of individuals that aren't currently "the best"? Herd health might be framed solely as the sum of individual health, neglecting emergent properties like diversity.
  *   **If You Switched Strictly to a "Group/Population-as-Unit" View:**
      *   **GEBVs become a tool, not the goal:** You'd select bulls based *not only* on offspring yield, but heavily on metrics of **diversity contribution** and **complementarity** to the existing population. Maintaining Ne might trump using the absolute highest-GEBV bull.
      *   **Gene Banking is Paramount:** Active management of the meta-population structure.
      *   **Individual Welfare Might Be Subordinated:** If a trait slightly harmed individuals but massively benefited herd resilience (e.g., disease resistance with a fertility cost), it might be favored.
  *   **If You Took a Strict "Gene's-Eye" View:**
      *   You'd **eliminate sire caps** ("Let the best alleles win!").
      *   **Gene banking would focus only on high-value alleles**, not rare breeds *per se*. Saving alleles from commercially extinct breeds would only happen if those alleles were predicted to have high future value in *your* population.
      *   **Welfare rules would be purely economic:** Only if "miserable longevity" reduced lifetime yield (allele propagation) would it be selected against.

  ### Conclusion: Your Practice Reveals Pragmatic Multilevel Awareness
  Your co-op's system is **not philosophically monolithic**. It reveals a pragmatic, implicit understanding that different levels matter for different reasons:

  1.  **GEBVs:** Exploit the **replicator level** (alleles) for *efficiency and speed* of genetic gain. (Commits to the gene's-eye view as an engineering tool).
  2.  **Welfare Rules:** Protect the **individual vehicle level** for *economics, ethics, and system stability*. (Commits to the individual organism as a unit of moral and economic concern).
  3.  **Sire Caps & Gene Banking:** Protect the **population/group level** for *long-term resilience, adaptive potential, and biodiversity conservation*. (Commits to the breed/population as a unit that can be "healthy" or "unhealthy" and is worth preserving).

  **What you conserve in the gene bank:** You conserve frozen **alleles** *and* the **potential to reconstitute a specific population-level entity** (the rare breed). Saving the alleles alone is valuable genetic material, but losing the living breed means losing the emergent properties of that specific evolving lineage. Your practice, by targeting "rare breeds," presupposes that the population itself is a conservation unit.

  **Your tutor is right:** These are partitionings of one process. Your brilliance lies in pragmatically using the lens (gene, individual, group) that best serves the specific goal (speed, welfare, resilience) without needing a single "true" unit. The sire cap *only* makes sense within a group-aware framework, while GEBVs *only* deliver their speed advantage through a gene-centric lens. Your practice commits you to multilevel thinking by necessity. Monday morning decisions *would* change if you abandoned one level entirely, precisely because your current system already leverages the strengths of each perspective.
