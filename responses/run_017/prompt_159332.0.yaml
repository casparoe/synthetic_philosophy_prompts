prompt: |-
  I'm a journalist, and I'm finishing a long piece on how institutions decide who gets helped when they can't help everyone: a hospital committee allocating a scarce drug, a foundation's grant meeting, a triage protocol drafted during a pandemic. I've come out of the reporting with a set of verdicts that I can't compress into one honest sentence, and I'd be grateful if you'd tell me what principle, if any, they add up to, and what holding it would cost me.

  1. One dose of a drug. Patient A is bedbound, in constant pain, with roughly two years of life left. Patient B is comfortable, mildly limited by a chronic condition, with decades ahead. The dose buys A about ten months of decent life and B about twelve. I give it to A. I keep giving it to A as the ratio worsens — I still choose A when B would get twenty months — and I switch to B somewhere around forty, though I couldn't defend the number.

  2. A regulator can block a new diagnostic device that would be available only to the well-off. Blocking it does nothing for the badly-off: no price effects, no spillovers, no redistribution, just a smaller gap. I don't think blocking it is an improvement, and I'd say so in print.

  3. Yet I do think abolishing a VIP fast-track — a separate, shorter queue for the well-off, or a hereditary title — is an improvement, even though it leaves everyone's material well-being exactly as it was and doesn't lengthen a single badly-off life.

  4. Triage: one very badly-off patient versus five comfortably-off patients, same benefit per patient. I take the five. One very badly-off patient versus two comfortably-off patients. I take the one.

  5. A hundred people in destitution, each lifted a long way, versus ten million comfortable people each getting a gain so small that none of them would notice it, though the arithmetic total is far larger. I take the hundred, and I can't talk myself out of it.

  6. Two candidates for a scarce bed, equally badly off now, identical expected benefit: one is badly off through a voluntary, well-informed, thoroughly enjoyable risk; the other through bad luck. I give real priority to the unlucky one — while conceding that the benefit would do exactly as much good in either life.

  7. The one I go back and forth on: a preventive programme for people who are comfortable now but at high risk of being very badly off later, versus treatment for people who are badly off now. On Tuesday I fund the prevention, on Thursday the treatment. I can't tell whether priority should track someone's expected lifetime position or the position they occupy when the help arrives.

  My working sentence is this: weight a benefit more heavily the worse off its recipient is, otherwise just add the benefits up, and never make anyone worse off merely to make things more equal. Test it against the seven cases and repair it where it breaks. Tell me which verdicts it cannot deliver and which one I should give up, whether my refusal in case 2 rules out whatever case 3 requires, and whether cases 1, 4 and 5 can be held by one weighting at all or force me toward something less smooth. Then tell me what the repaired principle says about two cases I haven't settled: destitute people alive today versus people who will exist two centuries from now and be far better off than anyone living, and animals whose range of well-being is much narrower than ours. Finally, give me the one sentence I can print that a hostile reader can't break with an obvious counterexample.
reasoning: |-
  Hmm, this journalist is grappling with some deep ethical dilemmas about resource allocation. They've presented seven complex cases and are struggling to distill them into a coherent principle. Let me unpack this carefully.

  First, looking at their working principle: prioritizing based on how badly off someone is, otherwise summing benefits, and never worsening equality by making someone worse off. But their cases reveal nuances that challenge this. 

  In case 1, they consistently favor the bedbound patient until benefits for the comfortable patient become overwhelming. This suggests their priority weighting isn't linear - the worse off you are, the more extra benefit others need to justify not helping you. 

  Case 2 and 3 seem contradictory at first. Blocking a diagnostic device that only helps the rich doesn't improve equality, so they oppose it. Yet abolishing a VIP queue does improve things, despite no material change. The key difference is procedural fairness - a separate queue violates equal standing while merely having an expensive device doesn't. 

  Case 4 shows threshold behavior: saving five comfortable lives outweighs one badly off life, but two aren't enough. This again points to weighted priority - the badly off get a multiplier. 

  Case 5 rejects pure utilitarianism. Helping 100 destitute people substantially matters more than imperceptible gains for millions. This reinforces priority to the worst off, but also introduces a "noticeability" criterion.

  Case 6 introduces desert - unlucky patients get priority over those who chose risks. But they specifically note the benefit does equal good, so this isn't about efficiency. It's about moral desert for circumstances beyond one's control.

  Case 7 reveals temporal uncertainty - should we prioritize current suffering or preventing future suffering? This remains unresolved.

  For their unsettled cases: Future generations pose a problem. Pure priority to worst off would neglect the future, but discounting them entirely seems wrong. Animals are trickier - if we accept they have moral weight, priority to worst off might help factory-farmed animals over wild ones, but cross-species comparisons are fraught.

  The repaired principle needs several elements: weighted priority with diminishing marginal moral weight, procedural fairness, desert for unchosen circumstances, and perhaps a sufficiency threshold. But simplicity is crucial for their audience. 

  For the public-facing sentence, we need something that withstands obvious counterexamples while capturing the essence. Their original had three parts - that's probably the maximum complexity readers will tolerate. We can fold the "never worsen equality" into procedural fairness, as making someone worse off for equality's sake usually involves unfair procedures.

  The toughest tradeoff is case 3 vs case 2 - procedural fairness versus material equality. But since they feel strongly about both, we must find wording that distinguishes unfair systems (like VIP queues) from merely unequal outcomes (like expensive devices). "Equal standing" captures this.

  For future generations, a weak weighting seems consistent with their other judgments - we should care but less than present worst off. Animals require a separate framework, but if pressed, extending priority to all sentient beings fits their pattern.

  The final sentence must be bulletproof. Every word matters. "Weight benefits" is better than "weight recipients" because it focuses on the impact. "Absolute deprivation" clarifies what "worse off" means. "Otherwise sum" keeps utilitarianism as the fallback. "Without unfair systems" covers procedural justice without overcomplicating.
answer: |-
  Your verdicts reveal a sophisticated, tension-filled ethical framework centered on **priority to the worst off**, tempered by **aggregation thresholds**, **procedural fairness**, and **non-material moral costs**. Your working principle is close but requires refinement to capture your intuitions. Let's test and repair it:

  ### Your Working Principle:
  *"Weight a benefit more heavily the worse off its recipient is, otherwise just add the benefits up, and never make anyone worse off merely to make things more equal."*

  ### Breakdown Against Cases:
  1.  **Holds.** Weighting for the bedbound patient dominates until B's benefit becomes overwhelming (~40 months). The "switch point" reflects diminishing moral weight of additional suffering.  
  2.  **Holds.** Blocking the device *only* reduces inequality without benefiting anyone. You reject leveling-down.  
  3.  **BREAKS.** Abolishing the VIP queue *doesn't* worsen anyone materially, yet you deem it an improvement. Your principle lacks a dimension for **procedural injustice/hierarchy**. The VIP queue is inherently demeaning, violating equal standing.  
  4.  **Holds with weighting curve.** Saving the one worst-off requires only a small number of better-off lives to be outweighed (1 vs. 2 fails, 1 vs. 5 succeeds). This implies a steep weighting curve for the very worst off.  
  5.  **Holds.** The massive summed benefit for the comfortable is morally negligible *because it's imperceptible per person*, while the destitute gain profoundly. Your weighting includes a **sufficiency/salience threshold** – benefits below a certain size (or above a certain welfare level) may not count fully.  
  6.  **BREAKS (Partially).** You prioritize based on *desert/circumstance of need* (luck vs. choice), not *just* current welfare level or benefit size. Your principle lacks **responsibility/desert considerations**.  
  7.  **Unresolved.** This highlights the tension between **lifetime prioritarianism** (fund prevention) and **current-state prioritarianism** (fund treatment). Your principle is ambiguous here.

  ### Repaired Principle:
  *"Weight benefits more heavily the worse off the recipient is in terms of absolute deprivation (with diminishing marginal moral weight), and sum otherwise; reject leveling-down; reject unfair systems that violate equal standing; and give some priority to those made worse off through no fault of their own. Benefits below a sufficiency threshold or above a saturation point may be discounted."*

  ### What You Must Give Up or Refine:
  *   **Case 3 vs. Case 2:** Your refusal in Case 2 (no leveling-down) *can* coexist with Case 3 *if* you explicitly add **procedural fairness/equal standing** as a separate moral good. Case 3 isn't *just* about material equality; it's about the intrinsic wrong of hierarchical access. Abolishing the VIP queue affirms equal dignity without leveling down material welfare. **Don't give up either.** Add the procedural clause.
  *   **Cases 1, 4 & 5:** These *can* be held by one weighting function, but it must be **non-linear (likely concave)**: The moral weight of a benefit decreases as the recipient's absolute welfare level increases, and decreases *further* as the absolute size of a *small* benefit to the well-off shrinks towards imperceptibility. It's complex but coherent.
  *   **Case 6:** You must explicitly add a **modest desert/responsibility** factor ("priority to those made worse off through no fault of their own") to your principle to capture this.

  ### Unsettled Cases & the Repaired Principle:
  1.  **Destitute Today vs. Future Affluent:**
      *   The repaired principle heavily weights the *absolute deprivation* of the destitute today. Future people, by your description, lack absolute deprivation.
      *   **Verdict:** Strong priority to the destitute today. Summing imperceptible benefits over millions of future affluent people wouldn't outweigh lifting current destitution. (Aligned with Case 5).
  2.  **Animals (Narrower Well-Being Range):**
      *   If we grant animals moral status, the principle of weighting by **absolute deprivation within their capacity** applies. Extreme suffering (e.g., factory farming) constitutes severe deprivation relative to their possible flourishing.
      *   **Verdict:** Priority should be given to alleviating severe animal suffering over providing small (or even moderate) benefits to comfortable humans, *if* the animal suffering is sufficiently intense/depriving relative to its species norm. The "narrower range" doesn't negate the moral weight of suffering within that range.

  ### The One Bulletproof Sentence:
  **"Give priority to relieving the most severe deprivation, discount trivial gains; sum significant benefits otherwise; never level down or tolerate unfair hierarchies; and favor those harmed by circumstance."**

  *   **Why it works:**
      *   "Severe deprivation" captures Cases 1, 4, 5, 7 (treatment side).
      *   "Discount trivial gains" captures Case 5 & future affluent case.
      *   "Sum significant benefits otherwise" captures Case 4 (saving 5 lives).
      *   "Never level down" captures Case 2.
      *   "Never tolerate unfair hierarchies" captures Case 3.
      *   "Favor those harmed by circumstance" captures Case 6.
      *   It avoids specifying contentious weights/switch points.
      *   It rejects the most common counterexamples: leveling-down (obvious injustice), ignoring massive benefits (crude prioritarianism), ignoring responsibility (unfairness), accepting caste systems (indignity).

  This sentence embodies the core of your reported verdicts while being resilient. It acknowledges that "deprivation," "trivial," "significant," "unfair," and "circumstance" require context, but provides the essential moral compass your reporting uncovered. A hostile reader might quibble with definitions, but not with a clear, obvious *counterexample* that breaks the core commitments.
