prompt: |-
  I spent forty years as a research chemist in a government laboratory, and since retiring I have been reading my way into the philosophical literature on corruption — initially out of a suspicion that the conflict-of-interest declaration I used to sign every year was doing far less work than we pretended. That reading led to my being co-opted onto a small working party of my old learned society which is revising its guidance on gifts, hospitality and conflicts of interest. We have one case left, and I should be grateful for your help with it.

  The working party is six people: four retired scientists (a botanist, a crystallographer, a statistician and myself), a retired NHS clinical director, and a political theorist we brought in last year to stop us talking past one another. We have already settled eight cases, with our reasons minuted. In summary:

  1. A hospital consultant paid a market-rate fee plus travel by a pharmaceutical company to lecture at a symposium, disclosed in the hospital register: permitted. Reason minuted: the fee bought a service, not a decision.
  2. The same consultant also sitting on the formulary committee that would rule on that company's drug: permitted only if she withdrew from those items. Reason: the interest is real but detachable, and detachment is the remedy.
  3. A council procurement officer accepting a case of wine from a firm with a live tender: prohibited, and we added that disclosure would not cure it. Reason: the gift cannot be made public without destroying either the tender or the relationship; the concealment is in the nature of the thing.
  4. A field biologist making small customary payments to village elders for permission to sample on their land: permitted, subject to a value ceiling and an entry in the field notebook. Reason: what is bought is access, which the elders rather than the state allocate; it is not the purchase of a decision the state has assigned to anyone.
  5. A constituency office distributing free roofing sheets to households in the six weeks before an election: prohibited. Reason minuted: the gift buys a standing disposition rather than a particular vote, and that is the more serious case.
  6. A facilitation payment to a customs officer to release equipment that was in any event lawfully due for release: prohibited. Reason: the payment re-describes a duty as a favour, even though no discretion is bought.
  7. A gift of livestock to a district officer at a naming ceremony, in a country where such gifts are the ordinary currency of respect: permitted up to a modest ceiling, provided the officer takes no part in any decision affecting the giver. We divided on this one and resolved it procedurally: we declined to say whether the practice is corrupt in itself and ruled only on the exposure. Our minutes record that we could not agree whether our own arm's-length standard is the right standard to apply there at all.
  8. A group leader adding a senior colleague's name to a paper in return for a reciprocal authorship later: prohibited. Reason: authorship is the currency of a role governed by rules of credit, and the exchange substitutes a private advantage for those rules.

  I have been arguing that our rulings are served equally well by at least three distinguishable rules: a transactional rule (what is bought is a decision, and a disclosed market-rate exchange is not that); a role-impartiality rule (what matters is whether the office-holder retains an unmanaged reason to depart from her duties, and detachment is the remedy); and a practice-relative rule (what matters is whether the practice in which the transfer occurs treats it as corrupt). We have never said which we are running, and I doubt we have been running one.

  The final case is this. Dr A. heads a group at a publicly funded institute. She takes no money from a supplier, Axeon Bio: no fee, no consultancy, no shares. Over roughly eight years, and without any agreement exceeding an annual email, Axeon has supplied her group, free of charge, with reagents, a serviced instrument, and — this is the part I cannot get out of my head — the standard operating procedures and the analysis scripts her postdoctoral researchers use. The group's protocols are now written around Axeon's chemistry; nobody there could run the assay on another platform without revalidating from scratch, which no one has time or money to do. Dr A. also sits on the national committee that will write the specification for a new assay in this area, and there she has argued consistently and, I believe, sincerely that the Axeon platform is the natural reference method. She has never voted against Axeon's interests; she has never needed to. Everything is disclosed — the free supply in the methods sections, the committee membership on the institute's register. Her salary is unaffected. A junior member of the group has put it to us, in writing, that the laboratory is no longer able to notice a result that would count against the platform.

  I should like: what this working party, as constituted and as minuted, will in fact decide; which of the three rules I have sketched, or which others you can find in our precedents, come apart on this case and where each one lands; what we should decide if we want to be consistent with ourselves, and which precedent is the closest analogue — together with the respect in which that analogue misleads; what principle we would be adopting under each option, particularly if we rule that this is not corruption at all, given that such a ruling seems to commit us to the practice-relative rule and to letting a discipline's own habits settle the question; and the further case that would best tell the surviving rules apart.

  I should also like your view on a suggestion of my own, which the political theorist has not yet seen. I want to say that this is a fourth species, which I have been calling infrastructural capture: the gift is not of money but of a method, and what it buys is neither a decision nor a disposition but the terms in which the decision will be described. On that view the case is worse than the roofing sheets, because recusal cannot cure it — there is nothing discrete to withdraw from, since the dependence has settled into the group's habits of measurement rather than into anyone's vote. My worry is that the notion proves far too much: every laboratory that has coalesced on one model organism, one software stack, or one publicly funded facility is dependent in a structurally similar way, and if all of that is corruption then the concept has lost its grip. Say whether the distinction can be drawn so that it bites here and not there, and where my position is weakest.
reasoning: |-
  Okay, the user is a retired research chemist who's part of a working group revising conflict-of-interest guidelines. They've already handled eight cases and need help with the ninth involving Dr. A and Axeon Bio. The user wants to know how the group will likely decide, which rules apply, what they should do for consistency, and their own idea about "infrastructural capture." 

  First, I need to unpack Dr. A's situation. Her lab gets free reagents, instruments, and SOPs from Axeon over eight years. Her protocols are built around their platform. She's on a committee setting assay standards and consistently favors Axeon. Everything's disclosed, but a junior member worries the lab can't see results against the platform. 

  Looking at the group's precedents: Case 1 (paid lecture) allowed because payment was for service, not decision. Case 2 (committee recusal) required withdrawal from related items. Case 3 (wine gift) banned because concealment was inherent. Case 4 (field payments) allowed for access, not decisions. Case 5 (roofing sheets) banned for buying disposition. Case 6 (customs payment) banned for reframing duty as favor. Case 7 (livestock gift) allowed with limits and recusal. Case 8 (authorship trade) banned as private substitution for rules. 

  The user sees three possible rules in their decisions: transactional (is a decision being bought?), role-impartiality (can partiality be managed?), and practice-relative (does the field see it as corrupt?). But they haven't committed to one. 

  For Dr. A's case: 
  - Transactional rule might allow it since no direct decision is bought. 
  - Role-impartiality would struggle because recusal doesn't fix the ingrained method dependence. 
  - Practice-relative could go either way - academic labs often rely on vendor tech without calling it corrupt. 

  The closest precedent is Case 7 (livestock gift) where they allowed it with recusal but admitted uncertainty about cultural standards. But here, recusal doesn't solve the deeper methodological capture. Case 5 (roofing sheets) is also relevant because both involve creating systemic bias, but here it's scientific judgment being skewed rather than votes. 

  The user's "infrastructural capture" idea is compelling: Axeon's gifts shape how science is done in the lab, making critique impossible. But his worry is valid - this could implicate all lab dependencies (like model organisms). The distinction might be that Axeon is a commercial actor embedding their proprietary system, creating lock-in that biases regulatory outcomes. Natural dependencies (like C. elegans labs) don't have this strategic intent or regulatory consequence. 

  Where his position is weakest: He can't easily prove Axeon intended capture, and disclosure was made (unlike Case 3's wine). Also, the junior's concern about suppressed results is speculative - there's no evidence of actual distortion yet. 

  For the working group's likely decision: Given the clinical director's regulatory experience and botanist's field-work pragmatism, they might narrowly allow it with conditions (like documenting alternative platform evaluations). But the political theorist and user will push back hard on the infrastructural risk. 

  To be consistent, they should prohibit it under a strengthened role-impartiality rule: If dependence structurally prevents impartiality (like roofing sheets), it's corrupt regardless of disclosure. The real analogue is Case 5 + Case 8 - it trades scientific integrity for private convenience like authorship trafficking, while building political-style disposition like the roofing. 

  A test case to split the rules: Imagine a journal editor using free proprietary AI for manuscript screening while publishing papers evaluating that same AI. Transactional rule might allow it (no single decision bought); practice-relative might accept industry norm; but role-impartiality would ban it because the tool's black-box nature makes bias unmanageable. 

  Final thought: The user's infrastructural framing is vital. This isn't about Dr. A's choices but about how Axeon's "gifts" reconfigure the lab's scientific imagination. That deserves a standalone category - perhaps calling it "method capture" to avoid overloading "infrastructure." The slippery slope is real, but the committee nexus (public standards + private lock-in) makes this uniquely corrosive.
answer: |-
  Based on your precedents, working party composition, and minuted reasoning, here's a structured analysis of Dr. A's case:

  ### 1. What the Working Party Will Likely Decide
  - **Probable Outcome**: **Prohibition** (5-1 or 4-2 vote).  
    - *Retired scientists* (especially you and the statistician) will emphasize the irremediable structural bias.  
    - *Clinical director* will analogize to pharmaceutical influence (Precedent 1/2) but see non-detachability as fatal.  
    - *Political theorist* will reject practice-relativity here due to public regulatory consequences.  
    - *Botanist* may dissent, seeing parallels with Precedent 4 (customary access payments).  
  - **Minuted Reason**: *"The dependence on Axeon's platform has become constitutive of the group's scientific practice, creating an inescapable incentive to defend it in regulatory contexts. Disclosure cannot remediate this institutionalized bias, and recusal is impossible as the conflict pervades all related decisions."*  

  ---

  ### 2. How Your Three Rules Diverge  
  | **Rule Type**          | **Application to Dr. A**                          | **Outcome** | **Conflict with Precedents** |  
  |-------------------------|--------------------------------------------------|-------------|------------------------------|  
  | **Transactional**       | No explicit "decision" bought; exchange is non-monetary. | **Permit**  | Contradicts Precedent 5 (roofing sheets bought disposition, not a decision). |  
  | **Role-Impartiality**   | Bias is embedded in methodology; no "detachable" interest. | **Prohibit** | Aligns with Precedent 2 (recusal remedy) but shows its limits. |  
  | **Practice-Relative**   | Academic reliance on vendor tech is normalized; disclosure satisfies field standards. | **Permit**  | Contradicts Precedent 3 (disclosure doesn't cure concealed gifts). |  

  **New Rule Emergent**: *Institutional Conflict* (Precedent 8 + 5): When gifts reshape the operational framework of a role, substituting private infrastructure for impartial judgment.  

  ---

  ### 3. Closest Analogue & Consistency  
  - **Closest Precedent**: **#5 (Roofing Sheets)**.  
    - *Similarity*: Both create systemic bias (electoral disposition ↔ methodological dependence).  
    - *Distinction*: Roofing sheets bought *voter* bias; Axeon bought *regulator/expert* bias.  
  - **For Consistency**: **Prohibit**.  
    - **Why**: Precedent 5 established that gifts corrupting *ongoing judgment* (not single decisions) are prohibited. Precedent 8 banned substituting private rules for role-governed credit. Dr. A’s case merges both evils.  

  ---

  ### 4. Principles Under Each Outcome  
  | **Ruling** | **Principle Adopted**                                  | **Commitment** |  
  |------------|------------------------------------------------------|----------------|  
  | **Permit** | "Disclosure + field norms sanitize influence."       | Practice-relative rule dominates; disciplines self-police. |  
  | **Prohibit** | "Public roles must be insulated from dependence on private actors." | Role-impartiality rule elevated; rejects normalization. |  

  **If Permitted**: You implicitly endorse practice-relativity, risking slippery slopes (e.g., pharma-funded clinical guidelines).  

  ---

  ### 5. Testing "Infrastructural Capture"  
  Your concept is **valid but requires tightening**:  
  - **Core Distinction**:  
    - *Benign Dependence* (e.g., model organisms): Public, non-proprietary, multiple access points.  
    - *Infrastructural Capture*: Private, monopolistic, strategically embedded (Axeon’s SOPs/scripts).  
  - **Why it Bites Here**:  
    - Axeon’s "gift" is a *trojan horse*: Proprietary methods constrain scientific/regulatory freedom.  
    - Recusal fails because bias resides in the *lab’s epistemic tools* (Precedent 2 remedy useless).  
  - **Where Your Position is Weakest**:  
    - No evidence Axeon *intended* capture (vs. goodwill).  
    - Overextension risk: Could implicate all industry-academia partnerships.  
  - **Refinement**: Limit to cases where:  
    (a) The gift creates *exclusive operational dependence*;  
    (b) The beneficiary holds *regulatory/policy power* over the donor’s domain.  

  ---

  ### 6. Critical Test Case to Split Rules  
  **Hypothetical**: *A state environmental regulator uses free AI software from PetroCorp to model pollution impacts. PetroCorp’s algorithms are opaque and calibrated to downplay refinery emissions. The regulator discloses this but lacks funds to replace the tool.*  

  - **Transactional Rule**: Permits (no "decision" bought).  
  - **Role-Impartiality**: Prohibits (bias is non-detachable).  
  - **Practice-Relative**: Permits if common in environmental science.  
  - **Infrastructural Capture**: Prohibits (private tool dictates public facts).  

  ---

  ### Final Recommendation to Working Party  
  - **Vote to Prohibit** Dr. A’s arrangement.  
  - **Adopt** your "infrastructural capture" framing but **constrain it**:  
    > *"Gifts creating irreversible dependence on a private actor’s proprietary methods are prohibited when the recipient influences standards affecting that actor. The capture of measurement infrastructure corrupts the description of reality itself, making impartial judgment impossible."*  
  - **Mitigation**: Require Dr. A’s group to:  
    (i) Revalidate one assay annually on a non-Axeon platform (cost shared by institute/Axeon);  
    (ii) Step down from the committee unless alternative methods are included in specifications.  

  **Your weakest point**: Conflating *all* methodological dependence with corruption. The distinction lies in **exclusivity + regulatory entanglement**. Axeon is not C. elegans or Python libraries—it’s a vendor with a captive committee member. Focus on the *closed loop* between donor, method, and decision-maker.
