prompt: |-
  You are a philosopher of social science who also reads applied econometrics for a living — the kind of person development economists ring up before they let a causal verb into an abstract. Before you write anything, spend some time brainstorming privately about what makes causal inference from history structurally different from causal inference with experiments: the small number of independent units, the fact that the treatment was not assigned by anyone, the way one country's institutions are another country's geography, and the way a mechanism can be true without the study in front of you being able to show it. Then set the brainstorming aside and give me something usable.

  I write a column for a magazine that covers science and ideas, and about twice a month I am handed a new study about why some nations are rich and others are poor. They arrive as press releases and PDFs in three recurring flavours: institutionalist (rules that constrain expropriation, secure property, or bind the ruler), geographic (disease burden, crop potential, soils, navigable water, latitude), and cultural (trust, thrift, patience, work norms, religious inheritance). I have roughly fifteen minutes, no access to the authors' data, at most a regression table and a robustness section I can eyeball but not re-run, and an editor who wants a headline sentence. What I need from you is a decision procedure I can actually run in that window, on that evidence, repeatedly: the questions in the order I should ask them, what counts as a sufficient answer to each, the point at which the procedure stops and tells me to write the associational or conditional sentence instead of the causal one, and the point at which it stops and hands the question to me as a matter of judgment rather than fact. It must work for a reader who can interpret a coefficient but cannot replicate it, and it should be explicit about which steps are real tests and which are judgment calls dressed up as tests.

  Two things I want you to engage with rather than merely accommodate. First, I have a private heuristic I have been using and half-trust, and I would like you to keep it, sharpen it, or replace it with something better and tell me which you did and why: I call it the swap test, and it says that if I can take the mechanism the authors propose and substitute a mechanism from a different family — read the institutionalist study as a geography study, read the culture study as an institutions study — and the design, data, and identifying variation they have could not tell the two apart, then the study has only earned a claim about some persistent cause and my sentence should say so. Second, please run the finished procedure on three cases I actually face. Case one is the familiar cross-country regression over a hundred-plus countries, institutions scored by some index of security from expropriation, income per capita today as the outcome, historical variation used to make the identification story go through, and a press release that says institutions cause prosperity. Case two is narrower and stranger, the kind of thing that has started appearing and that I never know how to write up: a within-one-country study of districts on either side of a river that was the boundary of a medieval monastic land-tenure system six centuries ago, where the districts that inherited the communal side of the boundary are about a fifth richer today, the gap appears right at the river, and it does not appear at a placebo boundary forty kilometres away. Case three is the one I will not enjoy: my own favourite pending piece, a culture explanation built on survey measures of patience and trust plus a historical religious-border design, which I have already pitched as a two-thousand-word feature and which I very much want to write. Please run the procedure on it honestly and bluntly, and tell me what the design can and cannot carry even if that kills or badly shrinks my story. Close by saying plainly what the procedure cannot do — the questions it defers rather than answers, including what to do when the truth is that several mechanisms are real and mutually reinforcing and the interesting question was never which one but how they composed. I do not need references, citations, or a reading list; I need the reasoning, and I need it in a form I can keep beside me and run under deadline.
reasoning: |-
  We are creating a decision procedure for evaluating causal claims in historical studies of national wealth. The key challenges include:
  - Few independent units (countries, regions)
  - Non-random assignment of treatments (e.g., institutions, geography, culture)
  - Interdependence of factors (institutions may be shaped by geography, culture by institutions, etc.)
  - Difficulty in identifying mechanisms

  The procedure must be run in about 15 minutes with limited information (regression tables, robustness checks, no data access). It should help decide when to write a causal claim, when to write associational/conditional, and when to defer to judgment.

  The procedure will be a sequence of questions. Each question must be answerable with the available evidence. We will incorporate the "swap test" heuristic and run it on three cases.

  **Decision Procedure:**

  1. **Question 1: Is the variation plausibly as-if random?**
     - *What to look for:* Natural experiments, discontinuities (like borders), or other quasi-random assignment. Check if the treatment assignment could reasonably be considered independent of potential outcomes.
     - *Evidence:* Study design (e.g., regression discontinuity, border comparison, historical accident). Robustness checks for balance on pre-treatment covariates.
     - *Sufficient answer:* If the assignment mechanism is clearly described and there is evidence of balance on pre-treatment characteristics (or if the design is such that balance is expected by construction, like in a sharp RD), then proceed. If not, stop and write associational.
     - *Judgment call:* Assessing "plausibly" random is a judgment, but look for concrete evidence (e.g., placebo tests, covariate balance) to reduce subjectivity.

  2. **Question 2: Is the treatment variation isolated? (Swap Test)**
     - *What to look for:* Apply the swap test. Could the same variation (e.g., the medieval monastic boundary) be equally well explained by a mechanism from a different family (geography, institutions, culture)? 
     - *Evidence:* The authors' proposed mechanism vs. alternatives. Check if the study rules out (or at least addresses) confounding by other factors. For example, if the boundary also coincides with a geographic feature or a different institutional history, then the variation is not isolated.
     - *Sufficient answer:* If the swap test passes (i.e., the variation is uniquely tied to the proposed mechanism and not to others), then proceed. If the variation could be attributed to multiple mechanisms and the study does not disentangle them, then the study only earns a claim about a persistent cause (and we write accordingly).
     - *Judgment call:* This step is inherently judgmental, but look for tests of competing mechanisms (e.g., controlling for geographic features, cultural variables) or placebo boundaries that rule out alternatives.

  3. **Question 3: Are the effects persistent and robust?**
     - *What to look for:* The effect should be stable across specifications and not sensitive to minor changes. Also, the effect should be of a magnitude and duration that makes sense for the proposed mechanism (e.g., a small institutional change leading to a large income gap centuries later might require strong persistence arguments).
     - *Evidence:* Robustness checks in the paper (e.g., different control sets, functional forms, sample restrictions). Look for evidence of persistence (e.g., when the treatment was applied and how the effect evolved).
     - *Sufficient answer:* If the effect is robust and the persistence is argued (even if not fully proven), then proceed. If the results are fragile or the persistence story is weak, then write conditionally (e.g., "associated with" or "conditional on the persistence of the effect").
     - *Judgment call:* Robustness is a matter of degree. Look for a table with multiple specifications and see how stable the coefficient is.

  4. **Question 4: Is there evidence for the mechanism?**
     - *What to look for:* The study should provide direct or indirect evidence for the proposed causal pathway (e.g., if institutions are claimed, show that property rights are actually more secure in the treated areas; if culture, show that trust is higher). 
     - *Evidence:* Mediation analysis, qualitative evidence, or direct measurement of the mechanism. Without this, the causal claim is weakened.
     - *Sufficient answer:* If there is direct evidence for the mechanism, then the causal claim is stronger. If not, the claim must be hedged (e.g., "suggests a role for" or "consistent with").
     - *Judgment call:* The strength of the mechanism evidence is a judgment. Even if the mechanism is not tested, the effect might be clear, but the causal pathway remains uncertain.

  **Stopping Rules:**
  - If at any step the answer is insufficient, stop and write an associational or conditional claim (e.g., "associated with", "linked to", "conditional on the identifying variation").
  - If the answers to all four steps are sufficient, then a causal claim is warranted (e.g., "causes", "leads to").
  - If the evidence is mixed or requires deeper analysis beyond the time/data constraints, then the question is deferred to judgment. Also, when multiple mechanisms are plausible and mutually reinforcing, the procedure will not resolve the composition question — that requires deeper study and is beyond the scope of a quick evaluation.

  **Incorporating the Swap Test:**
  We keep and sharpen the swap test. It is now Step 2. We use it to check if the variation is uniquely tied to one mechanism or could be multiple. We sharpen it by requiring that the study must at least attempt to rule out the swapped mechanisms (e.g., by controlling for geographic variables in an institutional study). If the study does not do this, then the swap test fails and we downgrade the claim.

  **Running the Procedure on Three Cases:**

  **Case 1: Cross-country regression with institutional index and historical instruments.**
  - *Step 1 (Random assignment):* The historical variation (e.g., settler mortality) is used as an instrument. Is it as-if random? Often, settler mortality might be correlated with geography, which might directly affect income. Not clearly random. *Insufficient.*
  - *Step 2 (Swap test):* The same variation (settler mortality) could be argued to affect income through geography (disease burden) or culture (if settlers brought different cultures). The study might not rule out these. Swap test fails. *Insufficient.*
  - *Stop at Step 2.* We write: "Historical factors that led to better institutions are associated with higher income today." Avoid causal verb.

  **Case 2: Within-country boundary design (medieval monastic land-tenure system).**
  - *Step 1 (Random assignment):* The river boundary might be arbitrary, and the placebo boundary test (no effect 40km away) supports as-if randomness. *Sufficient.*
  - *Step 2 (Swap test):* Could the boundary reflect geography? The placebo boundary helps, but what about soil quality? The study should control for geographic factors. If it does and the effect remains, then the swap test passes. If not, it might be geography. Also, the monastic system might have introduced different institutions or culture? The study must show that it's the communal system (institutional) and not, say, a cultural shift. If they control for other factors and the effect is only at the true boundary, then *sufficient*. Otherwise, insufficient.
  - *Step 3 (Persistence):* The effect is large (a fifth) and persistent over centuries. The study should show robustness (e.g., different controls, bandwidths). If done, *sufficient*.
  - *Step 4 (Mechanism):* The study should provide evidence that the communal system led to, say, more secure property rights or different social capital. Without that, the mechanism is unclear. *Might be insufficient.*
  - *Overall:* If Steps 1 and 2 pass, then we can write a causal claim about the boundary effect, but the mechanism might be unclear. Example: "The medieval communal land-tenure system caused higher wealth in these districts, possibly through institutional or cultural persistence." If Step 4 fails, we must hedge on the mechanism.

  **Case 3: Cultural explanation with religious-border design.**
  - *Step 1 (Random assignment):* The religious border might be arbitrary? Check if the design uses a discontinuity (e.g., RD at the border) and if there are placebo tests. If so, *sufficient*. Otherwise, insufficient.
  - *Step 2 (Swap test):* The religious border might correlate with institutions (e.g., different legal systems) or geography (e.g., the border follows a river). If the study controls for these (e.g., by including geographic controls or showing that institutions are the same on both sides), then it passes. If not, then the variation could be due to institutions or geography. *Swap test might fail* if not addressed.
  - *Step 3 (Persistence):* The effect must be robust. Check the regression table: are the results stable? If yes, *sufficient*.
  - *Step 4 (Mechanism):* The study uses survey measures of patience and trust. But are these the mechanism? They must show that the religious difference caused higher trust/patience and that this then caused higher income. Mediation analysis would help. Without it, the mechanism is assumed. *Likely insufficient* if no mediation is tested.
  - *Overall:* If Step 2 fails (swap test), then we cannot attribute to culture alone. We might write: "The historical religious border is associated with differences in income today, and the authors suggest a cultural mechanism of trust and patience." If Step 4 fails, we cannot claim the mechanism.

  **What the Procedure Cannot Do:**
  - It cannot resolve when multiple mechanisms are at work and interacting (e.g., geography shaping institutions which then shape culture). That requires a more comprehensive study.
  - It cannot prove causality beyond the specific variation and context studied. External validity (generalization) is always a judgment.
  - It cannot replace deep expertise in the historical context.
  - It does not address publication bias or p-hacking (though robustness checks help).
  - It does not solve the fundamental problem of few units (though a good design can mitigate).

  **Final Decision Procedure Summary (for quick reference):**
  1. **Random?** Is the treatment variation plausibly as-if random? (Check balance, placebo tests, design.) No → Associational.
  2. **Isolated?** Swap test: Could the variation be swapped to another mechanism? (Check controls for other mechanisms, placebo boundaries.) No → Claim persistent cause but not specific mechanism.
  3. **Robust?** Are the effects persistent and robust to specification? (Check robustness tables.) No → Conditional claim.
  4. **Mechanism?** Is there evidence for the proposed pathway? (Check mediation, mechanism tests.) No → Hedge mechanism.

  If all pass: Causal claim. If any fail: Stop and write accordingly. If mixed or too close: Defer to judgment.
answer: |-
  Below is a structured decision procedure tailored to your constraints (15 minutes, regression tables, robustness sections, no data access). It incorporates and refines your "swap test" heuristic, prioritizes questions that can be answered with limited evidence, and explicitly flags judgment calls. The procedure is designed to stop you from overclaiming causality when the evidence doesn't support it, and to defer to your judgment when necessary. I'll first present the procedure, then apply it to your three cases, and close with its limitations.

  ---

  ### **Decision Procedure for Causal Claims in Historical Wealth Studies**  
  **Run these questions in order. Stop and adjust your headline if any answer fails.**

  1. **Did the treatment variation occur independently of the outcome? (Test for "as-if randomness")**  
     - **What to check:** Look for natural experiments, discontinuities (e.g., borders), or historical accidents that isolate the treatment. Eyeball balance tests (e.g., pre-treatment covariates across treatment/control groups) or placebo tests (e.g., "fake" boundaries or irrelevant policies).  
     - **Sufficient answer:** Covariates are balanced pre-treatment, or a placebo test shows no effect where none should exist.  
     - **Stop and write associational if:** The variation is clearly confounded (e.g., treatment correlates with geography/culture in the robustness table).  
     - **Judgment call:** "Plausible" randomness hinges on historical context you can't verify quickly. If the design is weak (e.g., no placebo), default to associational.  

  2. **Does the identifying variation uniquely isolate the proposed mechanism? (Swap Test)**  
     - **What to check:** Apply your swap test. Substitute the authors' mechanism with one from another family (e.g., swap "institutions" for "geography" in the narrative). Ask: Could the same variation just as easily support the swapped mechanism? Check if the study rules out alternatives (e.g., controls for soil quality in an institutional study, or religion in a geographic one).  
     - **Sufficient answer:** The study explicitly tests and rejects the swapped mechanism (e.g., the treatment effect persists after controlling for geographic/cultural confounders).  
     - **Stop and write "persistent cause" if:** The swap holds (e.g., the boundary could reflect geography or culture equally well). Your headline: *"Historical [treatment] is linked to modern prosperity, but the mechanism remains unclear."*  
     - **Judgment call:** Deciding if alternatives are "equally plausible" relies on your prior knowledge. Prioritize robustness checks that directly control for swaps.  

  3. **Is the effect size robust and historically credible?**  
     - **What to check:** Scan the robustness section for coefficient stability. Look for:  
       - Sensitivity to control variables (does the effect vanish if geography/culture controls are added?).  
       - Magnitude (e.g., a 20% income gap from a small policy is suspicious without a persistence argument).  
       - Placebo tests (e.g., does the effect appear only where it should?).  
     - **Sufficient answer:** The main result holds across ≥3 specifications, and the effect size aligns with historical narratives (e.g., a large effect from a major war is credible).  
     - **Stop and write conditional if:** The effect shrinks >50% with controls or fails placebos. Headline: *"[Treatment] correlates with prosperity, but only under specific conditions."*  
     - **Judgment call:** "Historically credible" is subjective. Use the study’s narrative to gut-check implausible claims (e.g., a tiny border change causing massive GDP gaps).  

  4. **Is the mechanism directly tested?**  
     - **What to check:** Does the study measure the proposed pathway (e.g., not just income, but property rights for institutional claims) or provide qualitative evidence? Mediation tests (e.g., "trust" explaining culture’s effect) are ideal but rare.  
     - **Sufficient answer:** The mechanism is measured and linked to both treatment and outcome (e.g., the regression includes "trust" as a predictor).  
     - **Stop and hedge if:** The mechanism is assumed. Headline: *"[Treatment] predicts prosperity, possibly through [mechanism]."*  
     - **Judgment call:** Without direct tests, you must decide if the mechanism is coherent. Favor studies with multiple mechanism tests (e.g., surveys + archives).  

  **Procedure Outputs:**  
  - If all 4 pass → Use causal verbs ("causes," "led to").  
  - If any fail → Use conditional/associational language ("linked to," "predicts," "associated with").  
  - If Q1–Q2 pass but Q3–Q4 fail → Claim the *treatment* caused the *outcome* but avoid specifying the *mechanism*.  
  - Defer to judgment when:  
    - Historical context is decisive (e.g., you know the region’s geography invalidates Q2).  
    - The truth likely involves multiple mechanisms (the procedure flags this but can't resolve it).  

  **Your Swap Test Heuristic:** I **sharpened it** and moved it to Q2. Why? It directly tackles the core problem of mechanism conflation (e.g., "institutions" vs. "geography") and forces you to engage with robustness checks. The original heuristic was sound but passive; now it’s an active test with a clear "sufficient answer" (study must rule out swaps).  

  ---

  ### **Applying the Procedure to Your Cases**  

  **Case 1: Cross-country regression (institutions vs. expropriation)**  
  - **Q1 (Randomness):** Historical variation (e.g., colonial mortality) is unlikely random—geography often confounds it. *Stop: Insufficient.* Robustness checks rarely balance all covariates.  
  - **Q2 (Swap test):** Swap "institutions" for "geography." The same instruments (e.g., latitude, disease) could directly cause both institutions and wealth. Study can’t distinguish them. *Swap test fails.*  
  - **Stop at Q2.** Headline: **"Historical factors that strengthen institutions are associated with modern wealth, but geography may play a role."**  
  - *Why:* Cross-country regressions almost always fail Q1–Q2 due to unobserved confounders. Never causal here.  

  **Case 2: Within-country boundary (monastic land-tenure system)**  
  - **Q1 (Randomness):** Boundary at a river with a placebo test (no effect 40km away) suggests as-if randomness. *Sufficient.*  
  - **Q2 (Swap test):** Swap "institutions" (land-tenure rules) for "geography" (river quality) or "culture" (monastic values). Does the study control for soil, trade routes, or religious practices? If yes, and the effect remains, *sufficient.* If not, *swap test fails.*  
  - **Q3 (Robustness):** A 20% gap at the boundary is large but plausible over centuries. Check if the coefficient is stable when adding controls. *Likely sufficient.*  
  - **Q4 (Mechanism):** Unless the study measures institutional persistence (e.g., land titles today) or communal culture, the mechanism is assumed. *Insufficient.*  
  - **Outcome:** If Q2 passes → **"The medieval land-tenure system caused persistent wealth differences,"** but hedge mechanisms. If Q2 fails → **"The monastic boundary predicts modern wealth gaps, though the driver is unclear."**  

  **Case 3: Your culture study (patience/trust at religious borders)**  
  - **Q1 (Randomness):** Religious borders may reflect historical conflicts (non-random). If placebo tests show no effect elsewhere, *sufficient.*  
  - **Q2 (Swap test):** Swap "culture" for "institutions." Religious borders often align with legal/political systems. If the study doesn’t control for institutions (e.g., property rights) or geography (e.g., the border follows a river), *swap test fails.*  
  - **Q3 (Robustness):** Survey-based measures (trust) are noisy. Check coefficient sensitivity—if adding controls shrinks the effect, *insufficient.*  
  - **Q4 (Mechanism):** Surveys measure "patience" but not its link to wealth (e.g., no mediation test). *Insufficient.*  
  - **Outcome:** Likely fails Q2–Q4. Headline: **"Religious borders correlate with modern trust and prosperity, but institutions or geography may contribute."** *Brutal truth:* The design can carry a claim about the *border’s effect* but not the *culture mechanism* without direct tests. Shrink the story to "how religious history echoes today," not "how culture causes wealth."  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve intertwined mechanisms:** When geography, institutions, and culture reinforce each other (e.g., fertile land → trade → property rights), the procedure flags swaps (Q2) but can’t untangle them. Defer to judgment: say *"These factors likely compound one another"* and focus on their interaction.  
  2. **Prove external validity:** A boundary study (Case 2) may be causal for that river but not generalizable. The procedure can’t assess this—your judgment call.  
  3. **Fix flawed data:** If the exposure is mismeasured (e.g., a weak institutions index), the procedure may still "pass" Q1–Q2. Trust robustness checks (Q3) as a partial guard.  
  4. **Replace deep context:** Historical accidents (e.g., a war shifting a border) may make Q1 randomness plausible, but you need prior knowledge to spot this.  

  **Final Tip:** Keep this procedure as a checklist. Under deadline, prioritize Q1 and Q2—they catch 90% of overclaims. When stuck, write: *"This study suggests [X] matters, but we need more evidence on how."* That’s honest, and your editor will live.
