prompt: |-
  Me and my friend got into a huge argument at a barbecue on Sunday — she'd just booked a flight to a conference in Vancouver, I made some crack about the carbon, and three hours later we were still going. Neither of us convinced the other, but I realised on the way home that I still dont actually know what she thinks, structurally. So I put a bunch of cases to her on the walk (yes I was typing notes into my phone, whatever) and here's where she landed:

  - Voting in a national election while living in a state her side wins by 200,000: yes, you should do it, and she was genuinely emphatic about it — closer to a duty than to a cost-benefit thing.
  - Ordering the chicken at a restaurant where the kitchen already bought and cooked it, the dish stays on the menu either way, and next week's order was placed a month ago: no, doesn't matter, eat the chicken.
  - Crossing a picket line when the union needs 60 percent turnout to be legally authorised and they're polling at 59: yes, she has a real reason not to cross.
  - Signing an online petition that'll get two million signatures and be handed to a minister who has already said she'll ignore it: no, doesn't matter.
  - Joining a boycott with a published target of 50,000 pledges before the company's board meeting, currently sitting at 48,000: yes, she'd join — but she was noticeably less emphatic about this one than about voting, more of a "yeah sure, you might as well."
  - Her tiny local school board election, where the last one was decided by 11 votes: yes, obviously.
  - Buying eggs from a brand she thinks is cruel at a supermarket that restocks on a fixed schedule, where her carton has no chance at all of changing the next order: no, doesn't matter.

  Then this morning the actual case came up and I want to know what she'll say. There's a regional supermarket chain near her with 180 stores. Twice a year they decide whether to roll a particular own-brand chicken product out to all of their stores for the next six months or quietly drop it, and the decision runs off sales figures using some internal cutoff they never publish and that she has no way of estimating. She's standing at the freezer with one box in her hand. Nothing is counting her purchase: no campaign, no published target, nobody else organising anything, no one else doing anything, and the chain has no idea who she is. But if her one box is what tips the cutoff, the difference is 180 stores for six months. Her own guess is that her chance of tipping it is somewhere between 1 in 200 and 1 in 50,000, which by her arithmetic makes the expected difference somewhere between a couple hundred birds' worth and about half a bird's worth.

  So: does she have a reason not to buy the box, or not?

  What I'm after isn't the yes or no, it's the machinery. As far as I can tell there are at least two or three different rules that fit everything she said on that walk and come apart at the freezer: one that just multiplies probability by stakes and doesn't care whether anything registers her contribution, one that requires her contribution to actually get counted and fed into some decision, and maybe one where what matters is her share of what the group does rather than her own difference-making. (Also worth saying: the fact that she was way more emphatic about voting than about the boycott felt like a clue, but I can't say which way it points.) Tell me what each rule predicts about the freezer case, give me your best guess at what she'll actually say and why you're weighting that rule over the others, and then give me the one further case I should put to her that would really seperate the rules — I'd rather ask one question that splits them than seven that don't.

  And please be straight about which parts of this are settled and which are still genuinely fought over by people who work on it. She's going to fact-check me and I don't want to repeat some contested view as if it were the consensus. Oh, and write it in American English.
reasoning: |-
  Okay, the user is in a philosophical debate with their friend about ethical decision-making in collective action scenarios. They've described seven specific cases where their friend made judgments, and now they want to predict how she'll react to an eighth case involving supermarket chicken. 

  The core tension seems to be between different ethical frameworks: expected utility calculation versus symbolic participation versus threshold-based responsibility. The friend's pattern shows strong commitment to voting (even in safe states) and pivotal strike scenarios, while dismissing actions where individual impact is untraceable like petition signatures or isolated purchases. 

  Notably, the friend was less emphatic about boycotts with clear targets than about voting - that's an important clue. It suggests she might value institutional participation more than market-based actions, or that she requires clear pivotal potential rather than just probabilistic impact. 

  For the freezer case, the key features are: no campaign context, unpublished threshold, and individual purchase invisibility. This eliminates the "counted contribution" element present in her "yes" cases (voting, boycotts, strikes). But the probabilistic impact (1/200 to 1/50,000 chance of affecting 180 stores) creates tension with her rejection of the egg purchase case which had zero expected impact. 

  The three competing rules I see are:
  1. Pure expected utility (probability × stakes) - would say "don't buy" due to non-zero impact
  2. Decision-causation requirement (must trigger a mechanism) - would say "buy" since no counting occurs
  3. Fair share responsibility (contribution to collective harm) - ambiguous here

  Given her rejection of the petition (unregistered action) and eggs (non-pivotal), Rule 2 seems strongest predictor. She'll likely say buying doesn't matter. But the probabilistic stakes might pull her toward hesitation - hence suggesting a follow-up case about blood donation to test whether she requires institutional recognition of contributions.

  Important to note the academic landscape: Expected utility is dominant in philosophy (Nefsky, Parfit debates), but behavioral studies show people intuitively use threshold-based thinking (Schwenkenbecher). No consensus exists - this is live debate territory.
answer: |-
  Based on your friend's pattern across the seven cases and the unresolved tensions in ethical theory, here's the breakdown for the freezer case, including the competing rules, prediction, and a decisive follow-up question. I'll flag the contested areas clearly.

  **The Three Competing Rules Fitting Her Pattern:**

  1.  **Rule A: Expected Difference-Making (EDM):** An action matters if the *expected value* of one's action (probability of making a difference × the magnitude of the difference if made) is non-negligible or exceeds some threshold. Registration/visibility doesn't matter; only the probabilistic causal chain.
      *   *Fits:* Voting (high expected value due to pivotal chance *in general*, even if low *in her specific state*), Boycott (clear expected contribution toward target), School Board (high pivotal chance), Crossing Picket Line (high pivotal chance). Explains *rejection* of eggs/petition (near-zero expected impact).
      *   *Tension:* Ordering Chicken (low but non-zero expected impact? She said "doesn't matter"). This is a *known point of tension* in philosophy.

  2.  **Rule B: Formal Causation/Registration (FCR):** An action matters only if (a) it is *formally registered or counted* within a decision-making system (voting booth, boycott counter, union tally), *and* (b) that system's rules make individual inputs *causally relevant* to the outcome (e.g., thresholds, vote counts). Probability alone isn't enough; the *mechanism* must recognize the input.
      *   *Fits:* Voting (registered, causally relevant), Boycott (counted, causally relevant to target), Crossing Picket Line (counted, causally relevant to threshold), School Board (registered, causally relevant). Explains *rejection* of Chicken/Eggs (not registered/counted, no causal link to orders), Petition (not causally relevant to minister's decision).
      *   *Tension:* Why less emphatic on boycott vs. voting? Possibly sees voting as a more fundamental duty/ritual.

  3.  **Rule C: Collective Share/Symbolic Complicity (CSS):** An action matters based on (a) one's *fair share* of responsibility for a collective harm/benefit, or (b) the *symbolic complicity* in supporting a harmful system/practice, regardless of individual causal impact or registration.
      *   *Fits:* Voting (symbolic duty, fair share of civic effort), Boycott (symbolic rejection, fair share of collective pressure), *Potentially* Eggs/Chicken (symbolic complicity in cruelty, fair share of harm). Explains rejection of Petition (no clear fair share/complicity link if ineffective).
      *   *Tension:* Why reject Eggs/Chicken *specifically*? Why accept Restaurant Chicken? This rule struggles most with her *rejections*. Her pattern leans heavily *against* symbolic complicity *without* causal potential or registration.

  **Prediction for the Freezer Case:**

  *   **Rule A (EDM):** **YES, reason not to buy.** The expected impact (0.5 - 500 birds) is non-negligible compared to the Egg case (effectively zero). Probability/stakes drive it.
  *   **Rule B (FCR):** **NO, doesn't matter.** Her purchase isn't registered, counted, or fed into any decision mechanism the supermarket uses. It's causally opaque, like the Egg case.
  *   **Rule C (CSS):** **Ambiguous.** Could argue symbolic complicity/fair share of harm supports not buying. Could also argue lack of causal link makes complicity negligible.

  **Best Guess & Why (Weighting Rule B - FCR):**

  *   **Prediction:** She will say **NO, it doesn't matter, buy it (or not) based on preference.**
  *   **Reasoning for Weighting Rule B:**
      1.  **Her Rejections are Strongest Evidence:** Her clearest "doesn't matter" judgments (Restaurant Chicken, Eggs, Petition) all lack formal registration/counting *and* a clear causal link to an outcome within a decision system. The Freezer case is *identical* in this key respect – no counting, no registration, no visibility to the decision mechanism.
      2.  **Her Acceptances Require Registration/Thresholds:** Voting, Boycotts, Strikes, School Board all involve actions being formally counted within systems where the count *directly determines* the outcome (elections, meeting targets, union authorization). The Freezer case lacks this.
      3.  **Probability Alone Isn't Sufficient for Her:** The Restaurant Chicken case has a *very low but non-zero* probability of influencing future orders (if enough people act unexpectedly). She dismissed it. The Freezer case adds slightly more calculable probability, but crucially, it *still lacks the formal registration mechanism* present in her "yes" cases. Probability without registration seems insufficient for her.
      4.  **Emphasis Clue:** Her lower emphasis on the boycott (which *has* registration) compared to voting might hint that voting holds a special "duty" status beyond pure instrumentalism, but it doesn't negate that the boycott *still met the registration requirement* for her to say "yes". The Freezer case fails the registration test entirely.

  **The One Decisive Follow-Up Case (Splitting Rule A vs. Rule B):**

  > **The Blood Donation:** There's a critical blood shortage. The national blood service desperately needs donations. They collect all blood, but they don't track or publish individual donation impacts. They simply process all usable blood and distribute it to hospitals. Statistically, any single eligible donor has about a 1 in 100,000 chance that their specific pint of blood will be the one that directly saves a specific life that would otherwise have been lost due to the shortage that day (the "marginal pint" effect). Does she have a strong reason to donate?

  *   **Why it Splits the Rules:**
      *   **Rule A (EDM):** **YES, strong reason.** The expected value (1/100,000 chance of saving a life) is very high. Registration doesn't matter.
      *   **Rule B (FCR):** **NO / WEAKER reason.** While blood is used, her *specific donation* isn't registered as causally linked to a specific outcome within a decision system (like reaching a vote threshold). It's pooled. Her action isn't "counted" towards triggering a specific outcome in the way a vote or boycott pledge is. It's closer to the Egg/Restaurant Chicken/Freezer case – she contributes to a collective pool causally, but without individual registration or pivotal mechanics. It tests if *pooled collective goods without thresholds* matter to her like *threshold-based collective actions* do.
      *   **Rule C (CSS):** Likely **YES** (fair share/symbolic duty to help), but her prior pattern makes this less central to the core A/B split here.
  *   **This cuts to the core:** Does she require her action to be *formally input into a system with transparent rules* (like voting thresholds) for it to generate a strong moral reason, or is the *probabilistic causal contribution within a complex system* (like blood supply or aggregate purchasing) sufficient, even if opaque and unregistered? Her answer here will strongly confirm either Rule A or Rule B.

  **Contested Areas in Philosophy (Be Straight):**

  1.  **The "Problem of Collective Harm" (Restaurant Chicken/Eggs/Freezer):** This is **HIGHLY CONTESTED** and a major topic in moral philosophy. There is **NO CONSENSUS**. Key figures:
      *   **Skeptics of Individual Obligation (often leaning toward Rule B/FCR):** Garrett Cullity, Julia Nefsky. Argue that if your act makes no *detectable* difference (or isn't registered/required for a threshold), you often lack a strict obligation, though complicity might remain. Nefsky specifically critiques expected utility in these cases ("Parfit's Ethics" discussion).
      *   **Defenders of Individual Obligation (often Rule A/EDM or Rule C/CSS):** Derek Parfit (original "Harmless Torturers"), Shelly Kagan, Theron Pummer. Argue probabilistic expected impact *does* create obligations, or that fair share/complicity obligations exist regardless of detectability. Pummer argues for "expected influence" even in non-threshold cases.
      *   **Institutional/Structural Focus (Rule B/FCR compatible):** Some argue obligations are primarily shaped by institutional roles and rules (voting systems, boycott campaigns), not abstract probability calculations.

  2.  **The Significance of Voting in Safe Seats:** **CONTESTED.** Some (like Jason Brennan) argue it's often irrational/not obligatory due to low probability. Others (like Julia Maskivker) defend it based on symbolic duty, fairness, or the *system's* reliance on participation. Your friend's "duty" view is a recognized, though debated, position.

  3.  **Symbolic Complicity vs. Causal Impact:** **CONTESTED.** The weight given to symbolic actions (Rule C/CSS) independent of causal impact varies greatly among ethicists and depends heavily on the specific context and theory (deontology vs. consequentialism).

  **Summary for the Freezer Case:**

  *   **Prediction:** Based on her consistent rejection of unregistered/non-pivotal actions (Chicken, Eggs, Petition) and acceptance of formally counted/pivotal actions, she'll likely say **NO, her buying the chicken doesn't matter. Rule B (FCR) is the strongest predictor.**
  *   **Reason:** Her purchase isn't counted, registered, or visible to the decision mechanism; it's causally opaque like the rejected cases.
  *   **Decisive Test:** Ask her about the **Blood Donation** case. A "Yes, strong reason" points strongly to Rule A (EDM). A "No/Weak reason" confirms Rule B (FCR) and her focus on formal causation/registration.
