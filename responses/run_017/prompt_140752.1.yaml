prompt: |-
  I sit on the grant committee of a small foundation that has historically funded near-term global health and poverty interventions, and we are now being asked to move a substantial share of the portfolio into longtermist work — reducing extinction risk, steering the development of transformative technologies, and preserving option value for future generations. The argument that has most persuaded me is a version of strong longtermism: the expected amount of value at stake in the far future is astronomically larger than anything at stake in the near term; small probabilities of favourably influencing that future therefore swamp ordinary near-term goods in expected value; so across a wide range of decision contexts the option we ought to pick is the one with the best long-run consequences. Before I vote I want the case against it laid out as a map of the view's exposure, not as a catalogue of objections from people who never found it attractive.

  A few of the doubts I keep circling are probably not the standard ones, and I would like them engaged on their merits rather than matched to something in the literature. First, causal attenuation: influence over the state of the world plausibly diffuses as it passes through successive branch points — wars, institutional collapses, technological paths, cultural shifts — so that the probability that any given present intervention still makes a difference to how things go many centuries out may decay at something like a fixed rate per branch point. If the payoff is astronomical but the chance of still mattering at the relevant distance is correspondingly infinitesimal, the product may be unremarkable, and I want to know what shape that decay function would have to have for the argument to survive. Second, control-shifting without value-shifting: conditional on humanity's surviving at all, maybe the broad character of the far future is set by physical limits and by convergent competitive pressures, so that what our actions change is who runs the future rather than how well it goes — in which case the value at stake is real but not something we can move. Third, sign symmetry: if the distribution over the value of the far future has heavy tails in both directions, and if the bad tail is dominated by the possibility of vast locked-in suffering while the good tail is dominated by the creation of vast numbers of good lives, then under an asymmetric population ethics the priority ranking flips, and the portfolio I am being asked to approve may be the wrong one even if the axiological premise is granted. Relatedly, if both tails diverge, the expected value of the far future is not merely hard to estimate but mathematically undefined, and the injunction to maximise it is not well formed. Fourth, timing rather than occurrence: much extinction-risk work may shift the date of a catastrophe rather than its probability of ever happening, and I want to know what the relevant hazard-rate or multipolar-scenario claim is and how exposed it is. Fifth, near-term work has long-run effects too — via growth, institutional quality, demographic transitions — so even granting that most of the value lies in the future, the instruction to pivot away from near-term giving may not follow.

  So: ranked from fatal to merely awkward, what would have to be true for strong longtermism to be false, and what is the difference between the two? Which of these defeaters would a committed defender concede as genuinely counting against the view, which would they absorb by hedging, and which would they rightly dismiss? Does the argument that the far future holds most of the value actually deliver the practical prescription I am voting on, or does it collapse into an impartial consequentialism that adds nothing? Has the view been qualified — about which decision contexts, about the sign of our influence, about tractability — to the point where no observation could tell against it, and if so, is that a defect here in a way it would not be in, say, physics? I will say what would move me most: empirical findings about the persistence of human influence over centuries, and about whether risk reduction changes whether civilisational collapse happens or only when.
reasoning: |-
  Okay, the user is part of a grant committee shifting from near-term global health to longtermism. They need the strongest case against strong longtermism, especially their unique doubts. Let me unpack their concerns.

  First, causal attenuation: how fast does influence decay over time? If each event branch reduces impact exponentially, the astronomical future value might not matter. Need to model decay rates and see if any realistic scenario allows significant influence.

  Second, control vs. value shift. Maybe the future's structure is fixed; we only change who controls it, not the outcome. If convergent forces dominate, then influencing who's in charge doesn't improve value. Longtermists might argue steering tech or values could change trajectories, but evidence for that?

  Third, sign symmetry. Heavy tails in both suffering and flourishing could make expected value undefined. Plus, asymmetric ethics might prioritize reducing suffering. If suffering risks are more probable or impactful, the portfolio should focus there. But current longtermism often emphasizes extinction over s-risks.

  Fourth, delaying vs. preventing extinction. If interventions only buy time without reducing cumulative risk, the value diminishes. Need hazard rate models showing postponement lowers total extinction probability. Otherwise, resources might be wasted.

  Fifth, near-term effects on the future. Development boosts growth, institutions, stability—indirectly shaping the long term. If these pathways are robust, pivoting away from them might be counterproductive.

  Ranking these from fatal to awkward:
  - Sign symmetry (undefined EV) is potentially fatal if tails are heavy enough. Math breaks the core argument.
  - Causal attenuation could be fatal if decay is exponential. But maybe plateaus exist?
  - Control-shifting without value change undermines the premise that we can influence future value.
  - Timing vs. occurrence questions the efficacy of extinction risk work.
  - Near-term effects are awkward but don't directly refute longtermism; they just complicate portfolio allocation.

  The user wants empirical evidence: historical influence persistence and whether risk reduction affects occurrence vs. timing. But data over centuries is sparse. They might need models based on limited precedents.

  Also, they fear the theory is unfalsifiable. If longtermists hedge by focusing on tractable interventions or s-risks, it might adapt to any objection. That's a weakness if it avoids empirical accountability.

  In summary, the strongest counterarguments involve mathematical impossibilities (undefined EV), decay of influence, and misalignment between actions and actual value shifts. The user needs these addressed to justify the pivot.
answer: |-
  Below is a ranked assessment of defeaters for strong longtermism (SL), structured by your core doubts. I focus on **exposure points**—conditions under which SL fails—and distinguish between *fatal* flaws (undermining SL’s core logic) and *awkward* ones (requiring hedging or reducing practical relevance). I conclude with how a defender might respond and implications for your vote.

  ---

  ### **Ranked Defeaters: From Fatal to Awkward**
  1. **Sign Symmetry + Undefined Expected Value (Fatal)**  
     - **Exposure:** If the far-future value distribution has **heavy tails in both directions** (e.g., vast suffering outweighs vast flourishing due to asymmetric population ethics), and these tails dominate expected value (EV) calculations, EV becomes **mathematically undefined**. For instance:  
       - If the bad tail decays slower than \( \frac{1}{x} \) (e.g., Pareto distribution with α≤1), the integral diverges.  
       - Under negative-leaning asymmetric ethics (e.g., pain-focused utilitarianism), reducing suffering dominates even if extinction risk falls.  
     - **Why fatal?** SL’s injunction to "maximize EV" collapses if EV is infinite/undefined. Your portfolio might then *increase* expected suffering (e.g., by accelerating AI without safeguards).  
     - **Threshold for survival:** SL only works if:  
       - (a) The good tail is heavier (ethically or probabilistically), *or*  
       - (b) Tails are thin enough for convergence (e.g., log-normal distributions).  

  2. **Causal Attenuation (Potentially Fatal)**  
     - **Exposure:** Influence decays exponentially over time if each "branch point" (e.g., war, tech disruption) multiplies uncertainty. If decay follows \( e^{-λt} \), with λ as the decay rate:  
       - For SL to dominate, the product \( \text{(influence)} \times \text{(value)} \) must exceed near-term EV.  
       - **Critical threshold:** If λ > 0.1% per year (i.e., influence halves every ~700 years), 1,000-year influence is negligible. If λ < 0.01% (halving every ~7,000 years), SL holds.  
     - **Why potentially fatal?** If decay is rapid, astronomical future value is irrelevant. Historical studies (e.g., Roman infrastructure’s multi-century impact) suggest λ could be 0.05–0.2%—**lethal to SL**.  
     - **Defender’s move:** Argue for "persistent hubs" (e.g., values, institutions, or tech with path-dependent lock-in) that slow decay.  

  3. **Control-Shifting Without Value-Shifting (Awkward → Fatal)**  
     - **Exposure:** If competitive pressures (e.g., evolution, markets) or physics constrain futures (e.g., Dyson spheres are inevitable; suffering is evolutionarily stable), your actions only alter *who* controls resources, not total welfare.  
     - **Why awkward/fatal?** Value is fixed; you’re redistributing influence. SL’s EV gain vanishes unless:  
       - (a) Actors have systematically different values (e.g., democratic vs. autocratic futures), *or*  
       - (b) Your actions alter value-relevant parameters (e.g., steering AI toward cooperation).  
     - **Empirical hinge:** Does value diversity persist under convergence? (e.g., Do all post-human civilizations converge to similar ethics?) If yes, SL is refuted.  

  4. **Timing vs. Occurrence of Existential Risk (Awkward)**  
     - **Exposure:** If risk reduction **delays** extinction without changing the cumulative probability (e.g., constant hazard rate), the EV gain is small. For example:  
       - Reducing asteroid risk by 10% *this century* vs. permanently delaying human expansion by 100 years.  
       - In multipolar scenarios (e.g., AI arms races), risk reduction may be zero-sum.  
     - **Why awkward?** This doesn’t kill SL but *dramatically reduces tractability*. Delaying extinction by 1,000 years might only increase EV by ~0.1% if the hazard rate is stable.  
     - **Threshold:** SL requires hazard rates to decline over time (e.g., due to coordination) *or* interventions that reduce cumulative risk (e.g., "final boss" solutions like aligned AI).  

  5. **Near-Term Work’s Long-Run Effects (Awkward)**  
     - **Exposure:** Near-term interventions (e.g., health, growth) may have larger long-run impacts than direct longtermist work:  
       - Poverty reduction → education → institutional quality → better crisis response.  
       - Fertility declines → sustainability → lower resource conflict risk.  
     - **Why awkward?** SL isn’t falsified (future value still dominates), but the **practical prescription** ("pivot now") fails. If near-term work has higher EV *even including long-term effects*, your portfolio shift is mistaken.  

  ---

  ### **How Defenders Respond**
  - **Concede:** Most accept causal attenuation and timing risks as serious, leading to **hedging** (e.g., focus on "persistent" interventions like moral circle expansion, or irreversible decisions like AI governance).  
  - **Absorb:** Sign symmetry is countered by downplaying suffering risks (e.g., "digital sentience is unlikely") or adopting symmetric population ethics. Near-term effects are absorbed by arguing longtermist work is *neglected* (e.g., "No one else reduces AI risk").  
  - **Dismiss:** Control-shifting objections are often rejected by assuming **value instability** (e.g., "A single AGI could lock in values").  

  ---

  ### **Does SL Add Value? The Collapse Risk**
  SL collapses into generic impartial consequentialism if:  
  - **Future value dominance is trivial:** If >99.9% of potential value *always* lies in the future, SL adds nothing to "maximize EV."  
  - **Tractability claims are circular:** SL becomes unfalsifiable if "long-run consequences" include all second-order effects (e.g., bednets affect governance → affect AI risk).  
  **But:** If SL’s *practical bite* comes from **neglectedness** (near-term work already funded) or **time-sensitivity** (e.g., 2020s AI decisions are pivotal), it survives.  

  ---

  ### **What Would Move You: Empirical Hinges**
  1. **Causal Attenuation:**  
     - Evidence for λ: Studies of institutional/cultural persistence (e.g., impact of Enlightenment values, Chinese imperial exams) suggest influence decays but not uniformly. *Low decay* is plausible only for:  
       - **Self-reinforcing systems** (e.g., constitutions, ethical norms).  
       - **Exponential tech** (e.g., AI alignment research).  
     - **Fatal if:** Decay rates exceed 0.1%/yr for most interventions.  

  2. **Timing vs. Occurrence:**  
     - **Key claim:** Risk reduction must alter the *integral* of survival probability, not just its distribution.  
     - **Empirical tests:**  
       - Climate models showing early mitigation avoids tipping points.  
       - AI governance preventing multipolar races (vs. delaying them).  
     - **Fatal if:** Most interventions only delay catastrophes with constant hazard rates.  

  ---

  ### **Recommendation for Your Vote**
  Strong longtermism is **vulnerable but not dead**. Its exposure is highest to:  
  - **Sign symmetry** (if suffering risks are salient and tails heavy).  
  - **Causal attenuation** (if influence decays faster than ~0.05%/yr).  

  **Demand:** Evidence that your foundation’s proposed interventions:  
  1. Target persistent influence channels (e.g., institutional reform, value shifts).  
  2. Reduce cumulative extinction risk (not just delay it).  
  3. Outcompete near-term work *including its long-term effects* on growth/stability.  

  If these are unprovable, a **hybrid portfolio** (e.g., 70% near-term, 30% longtermist) hedges against SL’s empirical risks while capturing upside.
