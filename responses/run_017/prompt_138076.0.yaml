prompt: |-
  I did thirty-odd years in salmon hatcheries and quantitative genetics before I retired, and now I sit in on a philosophy of biology reading group where every third argument is about heritability, and it keeps driving me up the wall that people hear h² = 0.8 and take it to mean caused by genes, so nothing to be done about it — and then some of them slide, without seeming to notice, from that to so the gap between group A and group B is genetic. Neither follows. The number is a ratio of variances inside one population across one range of environments, and I can shove it up toward 1 just by making all the tanks identical, which tells you exactly nothing about whether anything is fixable.

  So here's what I want. Write me a parody government form — call it Form H-2, Application for Permission to Describe a Trait as Genetic in Any Sentence Intended for the Public — about 600 words, laid out as numbered fields and checkboxes with blanks, in flat, deadpan bureacratese. The jokes have to come from getting the definition right, so that someone who actually works with these numbers laughs instead of wincing.

  Concretely: the form should force the applicant to declare the reference population and the spread of environments, and to certify what would happen to their number if you homogenized the environment (it goes up) or homogenized the genotypes (it goes down). It needs a field for what the applicant actually wants to know — can diet, schooling, or surgery change the trait — with a printed footnote explaining that the heritability coefficient cannot answer this and that no such quantity as the one they are asking for appears anywhere on the form. It needs a section on between-group differences where the applicant keeps trying to tick a box the form does not provide, and the printed warning stays polite and unmoved. Add a short worked example set in something non-human — fish, seed lots, dairy cattle, your pick — where a very high heritability sits happily alongside a dead easy environmental fix.

  The thing should end as a mild reductio: since standardized environments inflate the number, the form ends up awarding its highest heritability rating to the most uniform tanks, and the closing guidance note says such applications are approved automatically.
reasoning: |-
  Okay, the user has a very specific request. They're a retired quantitative geneticist with decades of experience in salmon hatcheries, now frustrated by philosophical debates where heritability (h²) is constantly misinterpreted. They want a parody government form that forces people to confront the technical meaning of heritability. 

  Hmm, their pain points are clear: people think h² = 0.8 means "genetically determined and unchangeable", and worse, they extrapolate that to group differences. The user emphasized two key nuances: heritability is population/environment-specific, and it says nothing about trait modifiability. 

  I should structure this as a deadpan bureaucratic form. The humor must come from rigorous accuracy—making geneticists laugh at how the form exposes common misunderstandings. Key elements needed:
  - Mandatory declaration of reference population and environmental range 
  - Forced admission that homogenizing environments inflates h² 
  - A section where applicants try (and fail) to link h² to group differences 
  - A footnote explicitly stating h² doesn't answer "can this be changed?" 
  - A non-human worked example (salmon? dairy cattle?) showing high h² + easy environmental fix 
  - Ending with the absurd twist: highest ratings for uniform tanks 

  For the worked example… salmon would resonate best with their background. Imagine tank-reared fish with high weight h²—but adding enrichment instantly improves growth. Perfect. 

  The group difference section should feel like bureaucratic torture: applicant keeps reaching for a "groups differ genetically" checkbox that doesn't exist, while the form calmly reiterates definitions. 

  Tone is crucial. No overt jokes—just soul-crushing bureaucracy exposing logical flaws. The closing "Approved" stamp for identical environments will underline the reductio ad absurdum. 

  …Writing now. Section 7 will be the trap. Applicant ticks "infer something" about groups, but the only options are variations of "this is forbidden." The salmon example must be bulletproof—high h² under hatchery conditions, but manipulable via flow rate changes. 

  Final touch: the guidance note praising environmental uniformity. The user will appreciate that cherry on top.
answer: |-
  ## Form H-2: Application for Permission to Describe a Trait as "Genetic" in Any Sentence Intended for the Public

  **Office of Quantitative Causal Attribution (OQCA)**
  **Division of Variance Partitioning & Public Misinterpretation Mitigation**

  **INSTRUCTIONS:** Complete all fields in BLOCK CAPITALS using indelible black ink. Failure to fully specify Population-Environment Context (Section 2) or misapplication of Coefficient h² (Section 4) will result in automatic rejection and referral for mandatory remedial biostatistics training.

  **SECTION 1: APPLICANT & TRAIT INFORMATION**
  1.  Applicant Name/Entity: _________________________________________________
  2.  Proposed Trait for "Genetic" Designation: __________________________________
      *(e.g., Human Adult Height, Salmon Smoltification Timing, Dairy Cow Milk Yield)*
  3.  Proposed Public Statement Snippet Requiring Authorization:
      > "The trait [**Insert Trait from 1.2**] is highly genetic, with heritability (h²) = [**Insert Value**]."
  4.  **☐** Check here to certify you understand that describing a trait as "genetic" in public discourse, based *solely* on h², frequently implies immutability and/or innate biological determinism to non-specialist audiences, regardless of your intent.

  **SECTION 2: POPULATION-ENVIRONMENT CONTEXT (PEC) SPECIFICATION**  
  *(Definition: h² is strictly relative to the defined PEC)*
  5.  **Reference Population:** Species/Strain/Breed: ___________________________
      Specific Demographics (e.g., Age, Sex, Location, Generation): _______________
      __________________________________________________________
  6.  **Environmental Variance Range (V<sub>E</sub>):** Describe the *actual* range of environments experienced by the population in 2.5 during trait measurement:
      *(e.g., "Standard hatchery tanks (5-10°C, uniform feeding)" / "US Public Schools, 1980-2000" / "Pastures in Wisconsin, variable rainfall years")*
      __________________________________________________________
      __________________________________________________________
  7.  **Hypothetical PEC Alterations (Certification Required):**
      *   a. If the environments within the range specified in 2.6 were made *completely uniform* (reducing V<sub>E</sub> towards zero), the h² value for the trait would: **☐ Increase** **☐ Decrease** **☐ Remain Unchanged**.
          *(Select one)*
      *   b. If the genetic composition of the population in 2.5 were made *completely uniform* (e.g., cloned, reducing V<sub>G</sub> towards zero), the h² value for the trait would: **☐ Increase** **☐ Decrease** **☐ Remain Unchanged**.
          *(Select one)*
      *   **☐** I certify that my selections in 7.a and 7.b are correct based on the fundamental equation h² = V<sub>G</sub> / (V<sub>G</sub> + V<sub>E</sub> + V<sub>GxE</sub>...).

  **SECTION 3: ACTUAL QUESTION OF INTEREST (AOI)**  
  *(h² DOES NOT ANSWER THIS)*
  8.  What the Applicant *actually* wants to know or imply regarding the trait is:
      *(Check ALL that apply)*
      *   **☐** Can the trait be altered by changes in nutrition/diet?
      *   **☐** Can the trait be altered by changes in education/training/social structure?
      *   **☐** Can the trait be altered by medical/surgical intervention?
      *   **☐** Is the trait fundamentally immutable?
      *   **☐** Other (Specify): _______________________________
  9.  **FOOTNOTE 3A:** The heritability coefficient (h²) derived in Section 4 pertains *only* to the proportion of phenotypic variance *within* the specified Population-Environment Context (Section 2) attributable to genetic variance *within that same context*. **It provides no direct information about the answers to the questions checked in Section 3.8.** A high h² within a specific PEC is entirely compatible with the trait being highly modifiable via environmental changes *outside* that specific PEC range.

  **SECTION 4: BETWEEN-GROUP COMPARISON ATTEMPT (OQCA USE ONLY)**
  10. Is the Applicant attempting to use this h² value to infer something about average differences in the trait observed *between* distinct groups (e.g., Populations A & B)? **☐ Yes** **☐ No**
  11. If **Yes** to 4.10, please specify the groups: Group A: _______________ Group B: _______________
  12. **WARNING 4B:** Heritability estimates derived *within* a group (Population-Environment Context A) **cannot** be validly extrapolated to explain phenotypic differences *between* groups (A vs. B). Differences between groups could arise from genetic differences (ΔG), environmental differences (ΔE), gene-environment interactions (GxE), or complex interactions thereof. The h² value from Group A provides no quantitative insight into the cause of the (A - B) difference. **☐ Applicant acknowledges Warning 4B.**

  **SECTION 5: WORKED ILLUSTRATIVE EXAMPLE (NON-HUMAN)**
  13. **Example:** Atlantic Salmon (*Salmo salar*) Smolt Weight in Commercial Hatchery "Alpha".
      *   *PEC:* Juvenile fish, 12 months post-hatch, Hatchery Alpha tanks (uniform 8°C, standardized feeding regime, identical tank design).
      *   *Observed h²:* 0.85 (High - large proportion of weight variance due to genetic differences *within* this uniform hatchery).
      *   *Actual Question of Interest (AOI):* Can we increase smolt weight?
      *   *Environmental Fix:* Altering tank flow dynamics to increase exercise (an environmental change *outside* the original PEC range) reliably increases average smolt weight by 15% across all genotypes. **High h² within a uniform environment does not imply trait immutability.**

  **SECTION 6: HERITABILITY RATING & APPROVAL (OQCA ASSESSMENT)**
  14. **Based on PEC Specificity (Section 2) and Certification Accuracy (Section 2.7):**
      *   **☐** **Rating U (Uninformative):** PEC poorly defined; Environmental variance range broad/undefined. h² value subject to large fluctuations. *Approval Unlikely.*
      *   **☐** **Rating M (Moderate):** PEC adequately defined; Moderate environmental variance expected. h² value reasonably stable *for this specific context only*. *Approval Conditional.*
      *   **☐** **Rating H (High - AUTOMATIC APPROVAL):** PEC meticulously defined; Environmental variance range *extremely narrow* (approaching uniformity). h² value maximized under these conditions. Demonstrates efficient environmental control.
  15. **OQCA Decision:** **☐ Approved** **☐ Denied** **☐ Approved (Automatic - Rating H)** **☐ Referred for Training**
  16. **Authorization Stamp & Expiry Date:** _________________________ (Valid only for stated PEC)

  **GUIDANCE NOTE H2-G7:** OQCA strongly encourages applications achieving **Rating H (High)**. Environments exhibiting minimal variance (V<sub>E</sub> ≈ 0) produce the most robust and elevated h² estimates (h² ≈ 1.0), offering the clearest statistical signal of genetic variance *within that highly controlled setting*. This represents the optimal scenario for quantifiable genetic description under the H-2 framework. Efforts to standardize environments are commended and efficiently facilitate approval. Remember: High heritability under controlled uniformity signifies excellent experimental design, not biological destiny.
