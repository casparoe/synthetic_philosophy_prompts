prompt: |-
  Hey — I'm a second-year PhD student and I've somehow ended up chairing the last session of our department's population ethics reading group, which has split almost exactly in half over the nonidentity problem and has spent eight weeks talking past itself. One half holds something like the Parfit-style package: the no-difference claim plus impersonal evaluation of outcomes (total or prioritarian value; the fact that a choice swaps who exists is morally irrelevant, and the teenager who conceives now rather than waiting does something wrong, full stop). The other half holds a person-affecting restriction of some kind — wrongness needs someone who can complain, plus the asymmetry everybody is supposed to accept (roughly Narveson's thought that we are in favour of making people happy but neutral about making happy people) — and they think the first half has quietly stopped doing morality and started doing cost-benefit analysis on possible worlds. Its probably my fault for scheduling the Parfit week last. Anyway: I don't want another shouting match, I want a document. Please draft the joint statement of the adversarial collaboration these two camps should have been running all term.

  Assume the role of a population ethicist who has refereed this literature for years and has mediated a couple of real adversarial collaborations: start with a short brainstorm of candidate agreed claims, throw out every one that is merely verbal or vacuous ("identity matters to morality" is not the sort of thing I want), and only then draft. Two things I care about specifically. First, I want the person-affecting side given its strongest version — including the ex ante variant where duties are fixed by the expected complaints of whoever will exist under each option, not just the ex post version where we ask about the actual people who end up existing — because I think that distinction is doing more work in our arguments than anyone in the room has admitted. Second, there's a diagnostic I've been playing with that neither camp will give me a straight answer about, and I want it in the document. Call it the p-dial. Take the standard early-conception case, hold fixed the well-being gap between the child born now and the child who would be born later, and then vary p, our credence that the later child is numerically the same person as the earlier one — p = 1 is ordinary harm to an existing-at-the-time person, p = 0 is textbook nonidentity, and the middle is the messy region given how precarious conception is and how vague identity over such tiny differences arguably gets. A second knob: instead of varying our credence, vary the delay itself from years down to minutes, i.e. how much of the person's developmental history the two options share. Does the wrongness of the choice fade in gradually, jump, or stay flat as you turn the dial? I want each camp to commit to predictions across the dial in advance, and to say whether they think the dial is even a coherent case or whether identity is all-or-nothing and p is just ignorance (and if it is ignorance, what the right verdict is under it). Please work the cruxes the same way: for each one, give a case or argument both sides would accept as bearing on it — I'm thinking the asymmetry and the case of adding one extra happy person to an unchanged population, the climate-policy style case where the choice reshuffles both identities and numbers, and whether non-existence can even be a comparator when the life created is only barely worth living — and write down in advance what each side predicts that case will show, and what each side would count as a result that would move them. Don't adjudicate; I don't need to know who's right, I need a text both would sign.

  Also: no citations, no footnotes, no reading suggestions — I know the literature, I want the argument, and half of what you'd cite you'd get wrong anyway. You can use the standard cases (the teenager who conceives early, the two medical programmes, the risky energy policy) but describe them in your own words. Pitch it for the room: a few specialists who will catch every loaded formulation and a bunch of first-years who won't, and I'll be reading it out loud at the end. Think carefully, and flag explicitly anywhere you think the two camps are disagreeing about a word rather than about the world.

  Sections, in this order, please:

  1. Agreed claims — numbered, 10–12 items, ~400 words total; nothing either side would call vacuous.
  2. Disagreements — a table, ~350 words; columns: the issue / the impersonalist's own wording, which they'd sign / the person-affecting theorist's own wording, which they'd sign / genuine or verbal, with a one-line reason.
  3. Cruxes — four of them, ~700 words total; for each: the crux stated neutrally, the test case or argument both accept as bearing on it, the impersonalist's prediction, and the person-affectingist's prediction (split ex ante from ex post where they come apart).
  4. The p-dial — worked diagnostic, ~300 words; include a small table of verdicts at p = 0, 0.25, 0.5, 0.75, 1 for at least three views (impersonal, ex post person-affecting, ex ante person-affecting), plus a note on whether the dial is coherent and what turns on the vagueness-of-identity version.
  5. What would move each side — ~200 words.
  6. Residual disagreement — ~120 words, ending with one sentence per side that each could actually put their name to.
