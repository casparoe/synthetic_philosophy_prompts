  ## Memorandum: Proposed Amendment to Editorial Assurance Policy (Preface Apology Replacement)

  **To:** Editorial Board, All Acquiring Editors  
  **From:** Chair, Committee on Editorial Assurance  
  **Date:** October 26, 2023  
  **Subject:** Rationalizing Authorial Warranty & Error Accountability: The Designated Error Lottery System  

  The Committee on Editorial Assurance has conducted a thorough review of the standard Author's Warranty (AW) and Preface Apology (PA), prompted by recurring authorial discomfort and potential logical inconsistencies. Our analysis, grounded in formal epistemology and practical risk management, reveals a fundamental tension: the AW requires an author to affirm no single assertion is doubted, while the PA implicitly acknowledges the near-certainty of *some* error within the totality of the work. This forces the author into a performative contradiction resolvable only by abandoning the principle that rational acceptance is governed by a probabilistic threshold combined with closure under conjunction.

  The core difficulty is the *Preface Paradox* (Makinson, 1965). An author may rationally accept each individual assertion `A₁, A₂, ..., Aₙ` within their monograph, as each clears a high threshold of rational credence (e.g., ≥ 0.99). However, the probability of the *conjunction* of all `n` assertions being true is the product of their individual probabilities. For works of substantial length, this conjunction probability inevitably collapses below the threshold for rational acceptance, necessitating the PA's acknowledgment of likely error. Simultaneously, the *Lottery Paradox* (Kyburg, 1961) illustrates that high probability for each member of a set does not entail high probability for the conjunction, nor does it justify accepting that any *particular* member is false, even when we know *some* member must be.

  Empirical bibliometrics reinforce this logical structure. Studies of scholarly monographs indicate a non-negligible base rate of error (`ε`). Conservatively estimating `ε ≈ 0.002` (one error per 500 assertions) and applying the Poisson limit, the probability of an error-free monograph of length `N` is `P(0) ≈ e^(-λ)`, where `λ = N * ε`. For a typical monograph of `N = 400` assertions:
  *   Probability any *specific* assertion is correct: `P(Aᵢ) ≈ 0.998` (clearing a 0.99 acceptance threshold).
  *   Probability *all* assertions correct: `P(Conjunction) = (0.998)^400 ≈ 0.449`.
  *   Probability of *at least one* error: `P(Error) = 1 - 0.449 = 0.551`.

  Thus, the author rationally accepts each `Aᵢ` individually (`0.998 > 0.99`) but *cannot* rationally accept the conjunction of all `Aᵢ` (`0.449 < 0.99`). Crucially, while we know `P(Error) = 0.551 > 0.5` (making it more likely than not an error exists), we cannot identify *which specific* `Aᵢ` is false. If the author knew *which* assertion was doubtful, the AW compels them to correct it prior to publication, restoring `P(Aᵢ) > 0.99` for that claim. The existence of error is probabilistic and collective, not locatable to any specific claim without undermining the AW.

  **Proposal: The Designated Error Lottery (DEL) System**

  The Committee proposes abolishing the current Preface Apology and replacing it with a mechanism resolving the epistemic-bureaucratic impasse: the **Designated Error Lottery (DEL)**.

  1.  **Mechanism:** Upon final page proofs, the Press's Editorial Assurance Office (EAO) will randomly select one assertion within the manuscript (excluding bibliographic entries, acknowledgments, and apparatus front/back matter). This assertion is the **Designated Error (DE)**.
  2.  **Authorial Indemnification:** The Author's Warranty (AW) will be amended. The author warrants that the manuscript contains no assertion *except the DE* that they have reason to doubt. The author is contractually indemnified against repercussions stemming *solely* from the DE being false. Responsibility for all other errors remains with the author.
  3.  **Preface Statement:** The traditional PA is replaced by: *"In accordance with Press policy, one assertion within this work has been designated by lottery as the locus of indemnified error. Sole responsibility for all other shortcomings remains mine."*
  4.  **Epistemic Rationale:** This system aligns perfectly with the probabilistic reality. The author rationally accepts each non-DE assertion (`P(Aᵢ) > 0.99`). The author rationally accepts that *some* error exists (`P(Error) > 0.5` for `N=400`). The DEL provides a specific locus for this probabilistic certainty without requiring the author to *know* which assertion is false (which would violate the AW or necessitate correction). The author can rationally believe *that* the lottery has selected the actual error (with probability `1/N`, e.g., `0.0025` for `N=400`), while rationally accepting *each individual* assertion (including the DE) as true for the purposes of the AW. This resolves the preface paradox by externalizing the location of necessary doubt.

  **Implementation Framework:**

  *   **Selection:** EAO uses a certified random number generator, mapping numbers to manuscript assertions sequentially (by page/line). Selection recorded in perpetuity.
  *   **Referee Report Aggregation:** Referees assess individual assertions. The Committee aggregates reports under a *non-conjunctive* principle: An assertion is accepted for publication if `P(Aᵢ | Evidence) > Threshold`. Reports flagging potential errors trigger author revision/correction *only for those specific assertions*, increasing `P(Aᵢ)` for those claims. The DEL selection occurs *after* this process, on the finalized text. The Committee does *not* accept the conjunction of all referee-approved assertions; it accepts each individually. The DEL manages the residual conjunction risk.
  *   **Fees & Schedule:**
      *   DEL Administration Fee: $250 (covers RNG operation, recording, contract amendment).
      *   DE Re-Assignment Fee (Author Request): $1,000 (plus re-typesetting if pagination changes).
      *   **Exemptions:** Fiction (no warranty of factual accuracy); Edited Volumes (responsibility diffused; volume editor provides standard PA); Second/Subsequent Editions (previous DE retired; new DE selected for new/revised material only).
      *   **Appeals:** Limited to procedural error in DEL selection (e.g., wrong RNG seed, page range miscalculation). Fee: $500. No appeal on basis of perceived significance or triviality of the DE.
  *   **Management of Awkward Corollary:** The Committee acknowledges authors will know `P(Error Exists) > 0.5` yet be contractually bound to accept `P(DE is False) = 1/N` (a very low probability) and rationally accept the DE itself as true. This reflects the structure of probabilistic acceptance and the separation mandated by the Warranty. Authors are reminded the DEL manages systemic risk inherent in large conjunctions; it does *not* imply the DE *is* false, only that it is the locus of indemnification *should* it be false. Management involves clear contractual language and optional pre-signing briefing by EAO staff ($150 fee).

  **Budgetary Impact:**

  The DEL system yields significant savings:
  1.  **Reduced Errata Litigation:** Indemnification for the DE channels disputes away from costly, reputation-damaging public retractions/corrections for that specific claim. Estimated annual saving: $35,000.
  2.  **Retracted Warranty Disputes:** Eliminates legal challenges based solely on the performative contradiction of AW+PA, as the amended AW is epistemically coherent. Estimated annual saving: $22,500.
  3.  **Streamlined Refereeing:** Referees focus solely on identifying *specific* doubts requiring correction pre-publication, without needing to assess the viability of the entire conjunction. Efficiency gain: ~10% referee hours.
  4.  **Revenue:** DEL Fees ($250 per title) projected to generate $12,500 annually against EAO operating costs of $8,000 for the program.

  **Net Estimated Annual Saving: $61,750.**

  **Conclusion:**

  The Designated Error Lottery System is not merely administratively convenient; it is epistemically rigorous. It replaces an inconsistent practice (AW + PA) with a coherent framework respecting the mathematics of rational acceptance under uncertainty. It leverages the base rate of error inherent in complex works and utilizes the fair, unbiased mechanism of a lottery – precisely because *no* assay of the manuscript can identify *which* error must exist – to allocate indemnification efficiently. The system resolves the author's paradox, provides a transparent locus for systemic risk, and generates substantial operational savings. The Preface Apology served only to mask an untenable epistemic demand; the DEL provides a rational, contractual solution. The Committee unanimously recommends adoption.

  **Approved by Committee Vote: 7-0**  
  *(Attachments: Appendix A - Detailed Probability Calculations; Appendix B - Draft Amended Warranty Language; Appendix C - EAO DEL Procedure Manual)*
