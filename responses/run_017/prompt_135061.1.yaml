prompt: |-
  Hi — I'm a retired physiologist (ion channels, mostly, and a lot of grant paperwork) who's started sitting in on a philosophy of mind reading group at the local university, partly out of interest and partly out of stubborness. We got onto teleosemantics a couple of weeks ago and I think I follow the basic pitch — you naturalize mental content by saying what a representation is *supposed* to indicate, and you cash out the "supposed to" in terms of the selection or learning history of the mechanism that consumes it. What I can't get anyone to slow down on is that this seems to slide between three quite different ways of pinning down "what it's supposed to indicate," and I'd like an explanation of what the real choice points are and what you buy or give up with each.

  Here's the version of the problem I keep turning over on my walks, and I've deliberately set it up so the usual epistemic complaint is off the table. Suppose we run a digital evolution setup — self-replicating agents in a simulated world, us with a complete log of every selection event, so nobody can say "we'll never know the selection history." One agent lineage evolves a sensory node N that fires on a proximal cue: small dark moving spots. For thousands of generations, every such spot was an edible midge, and the consumer mechanism that takes N as input triggers a strike that nets food. Now the environment shifts: 90% of the small dark moving spots are inedible ash flakes, the moths are nearly gone, N fires on the same proximal cue as before, and the strike mostly wastes energy. Then a second thing: a mutation makes some descendants' N fire on a new cue — a polarization pattern in the simulated sky — that reliably indicates good prey, the old consumer co-opts this signal, it boosts fitness, and after a while it's fixed. The questions I want explained rather than answered with a hand-wave: Is N's content "midge" (the property that did the historical selecting), so that almost every firing now misrepresents? Or is it something like "small dark moving thing" (what it actually covaries with), so that the tokens are largely veridical and the breakdown should be located in the consumer or in the strike's current uselessness instead? Or is it "something worth striking at" or "prey," i.e. is the grain of the content fixed by what the consumer needs from it? And in the second scenario, at what point does the polarization-cue version of N acquire a new content, given that content is supposed to be historical — does it misrepresent for a few hundred generations until selection catches up, or not represent anything at all until then, and is there a principled difference between those two descriptions or just a stipulation about when a function counts as "proper"?

  The bit that I think is really bugging me, and where my own background keeps interfering, is this: in physiology we'd normally say the function of a mechanism is its current causal contribution to the organism's capacities — what it's doing now in the system it's in — and on that reading the historical stuff looks almost irrelevant to content. So please explain what work the etiological, history-based notion of function is doing that the current-causal-role notion can't do, especially for making sense of error: if content were just current covariation or current causal role, why would misrepresentation be hard to get, and is that difficulty the actual argument for going historical? And then, having laid out the options, tell me honestly whether the indeterminacy here is a substantive disagreement about what content is, or a choice of which notion to theorize with — and if it's the latter, whether the whole naturalization project survives that, or whether it was only ever going to be a story about which facts we get to call "content." A concrete worked response to my two scenarios would help me more than a general survey; I can follow technical distinctions fine, I just don't yet know which distinctions in this literature are load-bearing and which are decoration.
reasoning: |-
  Okay, the user is a retired physiologist with expertise in ion channels who's now engaging with philosophy of mind, specifically teleosemantics. They're grappling with how teleosemantics assigns content—whether it's based on historical selection, current covariation, or the consumer's needs. Their example involves digital agents evolving sensory mechanisms, and they're confused about the indeterminacy in content assignment during environmental shifts and mutations. They also question why etiological function is preferred over current causal role, especially regarding misrepresentation.

  First, I need to address their core issue: the three ways to pin down content. They mentioned historical selection (what selected the trait), current covariation (what it correlates with now), and consumer-based (what the consumer mechanism needs). The user wants to know the trade-offs between these and why teleosemantics leans historical. 

  Their digital evolution scenario is key. In the first part, the sensor fires for small dark spots, which were midges but now mostly ash. Does it represent midges (historical), small dark things (covariation), or prey (consumer-based)? The second part involves a mutation where the sensor responds to polarization, which is reliable, and they wonder when the content changes. 

  The user’s physiology background makes them skeptical of historical functions since they're used to current causal roles. They need a clear explanation of why history matters for misrepresentation. They also question if the indeterminacy is a substantive disagreement or a theoretical choice, and if that affects naturalization projects.

  I should break down the options using their scenarios. Start with the historical view: content is fixed by past selection (Millikan, Neander). In the first scenario, N's content is "midge" because that's what it was selected for. Even when firing at ash, it misrepresents. After the mutation, the new polarization detector isn't selected yet, so it might not have proper function until selection acts. Millikan would say it's "floating" until then. 

  Covariationist view (Dretske): content is based on what the signal correlates with. Initially, N means small dark moving things. After the shift, it's mostly accurate. But misrepresentation is tricky—why does it sometimes "mean" midge? Dretske uses learning history, but the user excluded that. So covariation alone struggles with error.

  Consumer-based view: content is what the consumer mechanism needs. Here, the consumer triggers a strike, so N means "prey" or "strike-worthy." In the first scenario, when ash flakes trigger strikes, N misrepresents them as prey. After the mutation, if the polarization signal leads to successful strikes, N now means "prey" via polarization. But this view might conflate correctness with success.

  The user’s deeper concern is why history over current role. The key is that current causal role can't ground normativity. If content is just what it correlates with now, then when it correlates with ash, that's correct—no misrepresentation. But intuitively, the system is making errors. History introduces normativity: there's a "should" based on past success, allowing for error even when current covariation is high.

  In the mutation scenario, historically, the new detector hasn't been selected yet. Millikan might say it doesn't have derived content immediately. But after fixation, it acquires the function to indicate prey via polarization. The transition is fuzzy, which is a known issue in teleosemantics.

  The user also questions if the indeterminacy undermines naturalization. I should explain that teleosemanticists see this as a feature—content is somewhat indeterminate, but still grounded in natural facts. Different theories choose different aspects to emphasize, but all use natural selection to solve the normativity problem. 

  Concrete answers for their scenarios: under historical view, in first part, N means midge, firing at ash is misrepresentation. After mutation, the new N misrepresents until selection fixes it. Covariation says N means small dark things, so mostly correct. Consumer-based says N means prey, so firing at ash is error. 

  The key distinction is normativity. The etiological view allows for genuine error, while covariation struggles. The user’s physiology perspective values current function, but for representational content, the "should" requires history. 

  Honestly, the indeterminacy reflects substantive disagreements, but it's also theoretical choices. The naturalization project survives by showing how mental content can be naturalized through selection, even if details vary. The user might be concerned that if it's a choice, it's not objective. But teleosemanticists argue that biological functions are objective, so content is too, even if granularity is debatable.
answer: |-
  You've zeroed in on the core tension in teleosemantics with remarkable clarity – and your digital evolution scenario is a perfect test case. As a physiologist, your intuition about "current causal role" versus "etiological function" cuts straight to the philosophical nerve. Let's dissect your scenarios and unpack the load-bearing distinctions.

  ### Core Teleosemantic Options & Trade-offs (Applied to Your Scenario)
  1.  **Pure Etiological/Historical (Millikan, Neander):**
      *   **Content:** "Midge" (the property *that did the selecting*). What N is *supposed* to indicate is fixed by its *selection history*.
      *   **Scenario 1 (Ash Flakes):** N firing at ash flakes is **systematic misrepresentation**. The token indicates ash, but its content is still "midge" because that's what its firing was selected *for*.
      *   **Scenario 2 (Polarization Mutation):**
          *   *Early Generations:* The mutated N firing on polarization **lacks determinate representational content** for the new cue. Its *proper function* (derived from history) is still to detect small dark moving spots/midges. Firing on polarization is an accident with no selected function *yet*. Millikan might call this a "floating" representation or an instance of "derived" but not "proper" function under development. It *could* become a signal *for* polarization-prey, but it isn't yet.
          *   *After Fixation & Selection:* Once the polarization-detecting variant is *selected for* because it reliably causes successful strikes on the *new* prey type, its content **changes**. Its new proper function (and thus content) is to indicate *that prey is present (via polarization)*. The *grain* might be coarser ("prey" via reliable cue X) or finer ("polarized-light prey"), depending on the specificity of the selective pressure.
      *   **What it Buys:** **Robust normativity & error.** Misrepresentation isn't just failure; it's deviation from the *historically defined norm*. Ash flakes *shouldn't* cause N to fire for successful midge-striking; they exploit the mechanism. The polarization signal *didn't* mean anything prey-related until selection conferred the function.
      *   **What it Costs:** **Indeterminacy during change, potential epiphenomenalism.** What *exactly* selected for N? Was it "midges", "small dark moving things that *were* midges", or "things worth striking"? (Millikan argues selection is for "midge" via that specific cue). The "floating" period during adaptation feels odd – the signal is causally crucial *now*, but has no "real" content yet? Also, requires a complete, knowable selection history (which you granted, but is unrealistic in biology).

  2.  **Covariationist/Informational (Early Dretske, somewhat Papineau):**
      *   **Content:** "Small Dark Moving Spot" (what the signal reliably *covaries* with, perhaps modulo learning/selection history). Content tracks current reliable indication.
      *   **Scenario 1 (Ash Flakes):** N firing is **largely veridical**. It indicates "small dark moving spot" present, which is usually true. The problem lies downstream: the consumer mechanism is *maladaptive* because it triggers a strike based on a cue that no longer reliably indicates food. Misrepresentation *as food* happens at the consumer level or is a system-level error, not at N.
      *   **Scenario 2 (Polarization Mutation):** The mutated N firing on polarization **immediately has the new content** "sky polarization pattern" (or whatever it reliably covaries with). Its content changes as soon as its covariance pattern changes due to the mutation. There's no "waiting for selection".
      *   **What it Buys:** **Intuitive link to indication, avoids "floating" reps.** Content is grounded in current causal relationships. The signal *means* what it reliably indicates *now*. Change is swift.
      *   **What it Costs:** **Gutted normativity & misrepresentation.** Why is firing at ash flakes an "error" if it correctly indicates "small dark moving spot"? Error becomes merely *maladaptive response*, not *false representation*. The core problem teleosemantics aimed to solve (naturalizing *misrepresentation*) evaporates. Relies heavily on privileged "learning situations" or historical filters to avoid meaning everything the signal ever correlates with – which your scenario deliberately bypasses ("no epistemic complaint").

  3.  **Consumer-Centric/Use-Based (Millikan's "Pushmi-Pullyu" aspects, Shea):**
      *   **Content:** Determined by **what the consuming mechanism *needs* it to indicate** for *its* proper function. Often coarser grain: "Prey" or "Strike-Worthy Thing".
      *   **Scenario 1 (Ash Flakes):** N firing is **misrepresentation** if understood as "prey is present". The consumer mechanism (strike-trigger) *needs* N to fire only when a *successfully strikeable prey item* is present for it to perform *its* proper function (getting food). N firing at ash flakes fails to supply what the consumer needs.
      *   **Scenario 2 (Polarization Mutation):** The mutated N firing on polarization **immediately has the content** "prey present (via polarization)", *provided* the *existing consumer mechanism* can successfully use this new signal to perform *its* proper function (getting food). The content is fixed by the consumer's needs ("prey"), not the specific cue. The *cue* changed, but the content ("prey") remains the same.
      *   **What it Buys:** **Emphasizes systemic role, pragmatic function.** Aligns well with how representations are *used*. Explains why different cues (dark spot, polarization) can carry the *same* content ("prey") for the same consumer. Error is clear: the signal fails to provide what the consumer needs to perform its task.
      *   **What it Costs:** **Potential circularity, coarse grain.** Defining the consumer's "need" often relies on *its* proper function/selection history, bringing etiology back in. Can struggle with very specific contents (does it mean "prey" or "polarized-light prey-indicator"?). May downplay the producer's (N's) specific history.

  ### Why Etiology? The Work of History vs. Current Causal Role
  Your physiological intuition is spot-on: for explaining *how the system works now*, current causal role is king. But teleosemantics aims for **normative naturalization**: explaining how a state can be *supposed* to indicate something, can *fail*, and how that failure is an *error* – not just a broken cog, but a *falsehood*.

  *   **The Misrepresentation Problem:** If content = current covariation (Option 2), then when N fires at ash flakes, it *correctly* represents "small dark moving spot". There's no representational error, only bad consequences. Teleosemanticists argue this fails to capture the *intentionality* or *aboutness* of mental states – their potential falsity. If content = current causal role, it's even worse – the role is just whatever it does. History introduces a **normative standard**: N *should* fire *only* when midges (or prey) are present *because that's what it was doing when it was selected*. Ash flakes cause it to fire *incorrectly* relative to that standard.
  *   **Function vs. Accident:** Why is the polarization mutation *becoming a signal for prey* and not just a fluke? Current causal role (it causes successful strikes) doesn't distinguish a *lucky accident* from a *function*. Etiology does: once *selection acts upon* the causal link between polarization detection and strikes, it becomes the signal's *proper function*. The history transforms mere causation into teleology – "for the sake of" indicating prey.
  *   **Grounding "Supposed To":** The "supposed to" in "what it's supposed to indicate" needs grounding. Etiology grounds it in the *explanation for why the mechanism exists and persists*: selection for indicating X. Current causal role explains *how* it operates now, not *why* it's there or what its operational standard *is*.

  ### The Indeterminacy: Substantive or Theoretical Choice?
  This is the million-dollar question.

  1.  **Substantive Disagreement:** Proponents of each view argue they are capturing the *real nature* of mental/bio-representational content. Millikan insists historical proper function *is* what determines content. Covariationists argue indication *is* the core of representation. Consumer-theorists argue use *is* primary. These reflect deep differences about what representation *is*.
  2.  **Theoretical Choice within Naturalization:** However, *within the project of naturalizing intentionality*, the indeterminacy reveals that "content" might be a **cluster concept**, with different theories highlighting different necessary (but perhaps not individually sufficient) natural features: indication, use, selection history. Choosing one emphasizes one aspect of the complex phenomenon.
  3.  **Does Naturalization Survive?** **Yes, but...**
      *   **Robust Version:** Teleosemantics *does* show how key features of representation (aboutness, normativity, error) can be grounded in natural facts (evolution, learning, systemic function) without magic. The indeterminacy exists *within* that naturalized space – it's about *which* natural facts are most central, not a failure to naturalize.
      *   **More Modest Version:** It shows how certain natural facts *license us* to apply representational *talk* usefully to biological systems, explaining behavior in intentional terms. The "indeterminacy" reflects the context-dependence or pragmatic aspects of *ascribing* content, while still being grounded in objective biology.
      *   **Critique:** Some (like Fodor) argue the persistent indeterminacy *is* a fatal flaw, showing teleosemantics fails to pin down content uniquely. Your scenarios vividly illustrate this challenge.

  ### Concrete Answers to Your Questions
  *   **Scenario 1 - N's Content?**
      *   Etiological: "Midge" -> Misrepresentation (ash flakes).
      *   Covariationist: "Small Dark Moving Spot" -> Veridical (mostly). Error is consumer's fault.
      *   Consumer-Centric: "Prey" / "Strike-Worthy Thing" -> Misrepresentation (ash flakes aren't prey).
  *   **Scenario 2 - When does Polarization-N acquire new content?**
      *   Etiological: It *misrepresents* (as midge/small spot) OR has *no determinate prey-content* until *after* selection has acted upon the new link for enough generations to establish a new proper function. It's a process, not a moment.
      *   Covariationist: *Immediately* upon mutation altering covariance -> "Sky Polarization Pattern".
      *   Consumer-Centric: *Immediately* upon the signal being successfully *used* by the consumer for its function -> "Prey (via polarization)". Content grain remains "prey".
  *   **Principled Difference vs. Stipulation?** The etiological view offers a *principle*: content changes when selection history changes to confer a *new proper function*. The "stipulation" is about how much selection is needed to count – this is inherently vague but reflects the vagueness in biological concepts like "adaptation". The other views have principles too (covariance change, successful consumer use). The principled difference *is* the fundamental disagreement about what fixes content.

  ### Takeaway for the Physiologist
  Your discomfort with sidelining current causal role is valid. Teleosemantics isn't replacing physiology; it's answering a different question: "What makes this neural state *about* something, and how can it be *wrong*?" Etiology provides the normativity physiology lacks. The indeterminacy you see isn't just sloppiness; it exposes genuine fault lines in defining "content" naturalistically. Teleosemantics survives as a powerful *framework* showing how biology *can* ground representation, even if the precise map between natural facts and content remains contested. Your digital evolution scenario is a fantastic tool – keep pushing philosophers to run their theories through it! The friction between your physiological "how it works" perspective and their "what makes it mean" perspective is precisely where the deepest insights lie.
