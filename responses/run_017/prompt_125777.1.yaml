prompt: |-
  You're a professional philosopher who works on decision theory and social epistemology. Please think carefully before answering — do a bit of unstructured brainstorming first, flag where the arguments below trade on unstated assumptions, and don't just recite the standard line on this topic. Then give me a real verdict.

  Here's my situation. I'm on our university's committee that signs off on research with dual-use or catastrophic-risk potential (pathogen work, some of the more out-there AI alignment-adjacent proposals, that sort of thing). At the last meeting two colleagues — I'll call them Theo and Miriam — got into it over whether we should add a new norm to our review procedure, and I promised I'd try to sort out who was right. I've cleaned up the weakest bits of their exposition, but the moves are theirs:

  (1) Theo opens with the unilateralist's curse. His version: if any one of us can unilaterally green-light a project, and each of us acts whenever our own estimate of expected value is positive, then the committee doesn't act on *our* estimate — it acts on the maximum of a bunch of noisy estimates. Even with perfectly unbiased members, decisions get systematically dragged toward the tail where someone's error was optimistic. So we should adopt something like the principle of conformity that's supposed to lift the curse: treat your own positive assessment as evidence to be pooled, not as permission to act, and don't approve unless most of the committee is already on board.

  (2) Miriam says the argument as stated is structurally symmetric and therefore can't be the whole story. Any one of us can also *block* a project, and blocking is just as unilateral as approving. Run the same reasoning and you get a unilateralist's curse for omissions: the committee's decisions get dragged toward the tail where someone's error was *pessimistic*, and we should adopt a presumption in favour of approving. Two exactly symmetric principles deliver no guidance at all, so if Theo's conclusion is right, something other than the bare structure has to be doing the work — and he hasn't said what.

  (3) Theo: the asymmetry isn't smuggled, it's in the payoff structure. Downside here is heavy-tailed and near-unbounded; the upside of any single project is bounded and, in most cases, replicable by someone else later. There's also irreversibility: a blocked proposal can come back next month, a released pathogen can't. And the status quo is "no", so the burden of proof sits on the person who wants to act.

  (4) Miriam: both of those claims are doing the work by hand. "Downsides are unbounded" is just what a cautious committee would have said anyway — you've re-derived ordinary precautionary reasoning and called it a curse. And irreversibility cuts both ways in the cases that matter: a year's delay on something like a vaccine-platform project kills people too, and you can't un-delay it. If the asymmetry premise is what carries the argument, the curse adds nothing to risk-aversion we already had.

  (5) Theo concedes some of that but says the symmetry claim is unrealistic anyway. Our error structure isn't the toy model's: we all read the same risk-assessment reports, sit through the same briefings, so our errors are correlated, not independent draws around a truth — and correlated errors change how bad the curse is, in ways that depend on details nobody on this committee has checked. "Just be symmetric" isn't a policy. He also says the fix needn't be a personal attitude of deference at all: everyone can keep estimating independently and you simply change the aggregation rule — two signatures, or a supermajority — and that's all "conformity" ever amounted to at the institutional level.

  (6) Miriam: that concedes her point. If the fix is a voting threshold, the phenomenon was never about any individual's epistemic duty; it's institutional design, and a personal norm of conformity is a second-best patch that risks herding — which destroys the very independence the aggregation depends on. A supermajority threshold just relocates unilateral power onto the smallest blocking coalition. And she adds a deeper worry: for these proposals nobody has a real probability. The numbers are model-relative, generated by whichever framework the risk team happened to use that month. If the inputs aren't credences, the expected-value framing itself is the problem, and the "curse" is a symptom of fake precision rather than an argument for any particular threshold.

  So: please adjudicate move by move. Rate each of the six moves from clearly mistaken to clearly right, briefly justifying each rating, and tell me which specific claim each of them is right about. Then say who is more right overall, and — this is the part I care most about — what, if anything, both of them are missing. A PhD student of mine was taking minutes and I don't want to recieve a summary I can't defend.
