  Starting with frequentism: Probability as relative frequency. For the user, a 30% PoP means that in a large set of similar forecast scenarios, rain occurs 30% of the time. Verification scores like reliability diagrams check this—calibration ensures the observed frequency matches the forecasted probability. The chanciness comes from the ensemble spread representing atmospheric variability. The reference-class problem is a big issue here. The user can group forecasts by season, lead time, etc., and the observed frequency might change, making it hard to pick the right reference class. So, the objection directly applies to their verification process.

