prompt: |-
  I teach a course on rationality — mostly the philosophical stuff, with a bit of behavioural economics smuggled in — and after three years running on hiring committees I keep bumping into a pattern I don't have a word for, and it's getting annoying because I'd like to hand it to my students as a thing. Here is what I see. A committee sits down with sixty files, agrees in advance on what it is looking for (strong research, some teaching range, no obvious disasters), and then the discussion stops. But it doesn't stop because somebody said "here is a candidate above our bar." It stops the moment somebody produces a *sentence* — "she's the only one who could cover the perception courses," "he has a second project nobody else has," "she'd be the first person in the department with that training" — and once that sentence is on the table the search closes, even when the candidate is merely middling on the things we said we cared about twenty minutes earlier. The same thing happens to me apartment-hunting for sabbatical, and I don't think it's committee psychology: I go look at places, and what ends my search isn't finding something good, it's finding something I can *give a reason for* ("it's the only one with a desk by a window"), and I notice I stop earliest when the listings have the longest descriptions — the more ways there are to describe a place, the sooner one of them becomes the reason, and the less happy I am with where I end up in September. My daughter does the same thing with colleges, and it took me a while to see that the mechanism isn't preference, it's availability.

  So: search that terminates not on quality but on the local availability of a justifying consideration, with the consequence that *more* information about the options — more describable attributes, richer files, longer listings — makes agents stop earlier and end up worse off along the dimension they actually cared about at the start. I don't think this is satisficing, or not plain satisficing: satisficing stops when an option clears an aspiration level, and it isn't obvious to me why describing options in more detail should lower the effective bar in anything but a ad hoc way, though maybe you can stretch it there. It isn't the decoy or asymmetric-dominance effect, because nothing gets added to the option set and there's no option nobody picks. It isn't confirmation bias as I've seen it described, because there's no hypothesis I want to be true and no prior favourite I'm marshalling evidence for — I often prefer the option I *don't* land on. And it isn't post-hoc rationalisation or choice blindness, because the reason gets produced before the choice and seems to be what causes it, not a story bolted on afterwards. I have a vague memory of some psychology about people choosing on the basis of reasons rather than overall value, but as far as I can tell that's about how preferences get constructed inside a single forced choice, not about when an open-ended search stops.

  Does this phenomenon have a name of its own, or am I describing something that collapses into one of the neighbours I listed once you state it properly? If it does have a name, tell me what exactly the stopping rule is supposed to be and where its edges are. If it doesn't, coin one and define it tightly enough that I can put it on a slide: what the mechanism is, what counts as a clear case, what *wouldn't* count — stopping because search is genuinely expensive, stopping because you found the actual best option, stopping on a reason that happens to be about the dimension you cared about anyway, giving a reason only after someone asks you why — and what observable difference the phenomenon makes (my guess: strip the need to justify the choice and the effect goes away, add attributes and it gets worse; tell me if you think that's the wrong prediction). Please commit: I'd rather have you say flatly "this is just satisficing under a wider reading, and here's why the wider reading is right" or "no, it's distinct and here is the definition" than get a tour of the options. If you coin something, tell me how confident you are that it's a real mechanism rather than a redescription, and what would convince you I'm wrong. And skip the reading list — I can find the literature myself; I want the carving.
reasoning: |-
  Okay, the user is teaching a course on rationality and has observed a recurring pattern in decision-making processes, like hiring committees and apartment hunting. They describe a situation where a search stops not when a high-quality option is found, but when a justifying reason becomes available. The user wants to know if this phenomenon has a name or if it's a distinct concept they can present to students.

  First, I need to unpack the user's description. The key points are: termination based on the first justifying reason, more information leading to earlier stops with worse outcomes, and the mechanism being about reason availability rather than preference. The user has already ruled out satisficing, decoy effect, confirmation bias, etc. So, I need to figure out if this is a known concept or something new.

  I recall that in psychology, there's the "reason-based choice" model by Eldar Shafir and others. That might be relevant because it involves decisions driven by justifiable reasons rather than overall utility. The user mentioned that preferences are constructed through reasons, which aligns with this model. But the user is specifically focused on the stopping rule in search processes, not just choice between options.

  Looking at the stopping aspect, the concept of "satisficing" comes up, but the user argues it's not that. Satisficing stops when an option meets a threshold, but here the threshold isn't fixed; it's undermined by the availability of reasons. More attributes make it easier to find a reason, lowering the effective bar. That's a crucial distinction. So maybe this is a specific mechanism within satisficing where the aspiration level is dynamically lowered by justifiability.

  The user also mentions that the reason precedes the choice and causes it, not post-hoc rationalization. So it's about the need for justification driving the search termination. That makes me think of accountability or social decision-making contexts. In committees, the need to justify to others might trigger this effect. But the user also experienced it alone in apartment hunting, so it's not solely social. Perhaps internal justification plays a role too.

  Another angle: the abundance of information (more attributes) leads to earlier stops. This sounds similar to information overload leading to heuristic use. But the user specifies it's not just any heuristic; it's the construction of a defensible reason. So maybe "justification-triggered termination" is a fitting term. I need to check if there's existing terminology.

  I remember studies on "choice closure" or "decision closure," but those relate to finalizing a decision emotionally. The user's case is cognitive—finding a reason to stop searching. The concept of "non-compensatory" heuristics might be part of it, where one reason overrides others, but again, the focus is on stopping the search, not just selecting an option.

  The user wants a clear definition, boundaries, and predictions. If the need to justify is removed, the effect should diminish. Adding attributes worsens outcomes. So experiments where justification pressure is manipulated could test this. Also, in contexts without justification demands, people might search longer or use different criteria.

  Assessing the user's identity: they're a philosophy and behavioral economics educator, so they need precise concepts for teaching. Their frustration suggests they want a concise term to encapsulate this phenomenon. They might also need to distinguish it from similar biases to avoid student confusion.

  Deep needs: They likely want to equip students with tools to recognize and mitigate this bias in real-life decisions. They might also seek validation that their observation is novel or grounded in theory, enhancing their course's credibility. Providing a tight definition with mechanisms and examples will meet those needs.

  I should consider coining a term if no existing one fits. "Justification Premature Termination" (JPT) emphasizes the stopping aspect. Define it with core elements: search termination driven by first defensible reason, more attributes increase likelihood, outcomes diverge from initial goals. Contrast with satisficing by highlighting how justifiability dynamically lowers the bar.

  Confidence: It's a specific mechanism under reason-based choice. Real because it explains scenarios where traditional models fall short. To disprove, show that justification pressure doesn't affect stopping time or that more attributes don't lead to worse decisions in controlled settings.
answer: |-
  Based on your detailed description and the distinctions you've rightly drawn, this phenomenon **does not have a single, widely recognized name** in the standard rationality/psychology literature. It's a specific *flavor* or *sub-mechanism* of "reason-based choice" applied to the **stopping rule** in open-ended search, amplified by **attribute overload**. However, it's distinct enough from its neighbors to warrant its own label. Here's the carving:

  ### The Phenomenon: Justification Premature Termination (JPT)
  **Definition:** A search process terminates not when an option meets pre-defined quality thresholds, but upon the first generation of a *subjectively defensible justifying reason* for selecting an option, even if that option is suboptimal on the initially prioritized dimensions. Crucially, **the availability of diverse attributes increases the likelihood of triggering termination by providing more potential "hooks" for justification, thereby paradoxically lowering decision quality.**

  #### Core Mechanism
  1.  **Search Context:** An open-ended search with multiple options and attributes (hiring, apartments, colleges).
  2.  **Justification Demand:** An implicit or explicit need (internal or social) to justify the selection/termination decision.
  3.  **Attribute Availability:** Options are described with numerous attributes (rich files, detailed listings).
  4.  **Reason Generation:** The *first* attribute-based reason perceived as defensible ("She can teach Perception," "Desk by the window") is generated.
  5.  **Termination Trigger:** This reason directly triggers search termination, irrespective of overall quality relative to the initial goals. The act of generating a "good enough reason" satisfies the justification demand, closing the search.
  6.  **Paradoxical Effect:** More attribute information *increases* the probability of quickly finding *a* justifying reason, leading to earlier termination and potentially worse outcomes on core dimensions.

  #### What Makes a Clear Case?
  *   **Stopping Rule:** Search stops immediately *after* a justifying reason is articulated (internally or externally), not before.
  *   **Quality Mismatch:** The selected option is *acknowledged* as suboptimal or merely adequate on the initial primary dimensions agreed upon at the start of the search.
  *   **Reason Primacy:** The reason *causes* the termination/choice. It's not a post-hoc rationalization for a choice made on other grounds (e.g., fatigue, time pressure).
  *   **Attribute Amplification:** Termination occurs significantly earlier and outcomes are worse when options are described with more diverse attributes compared to a baseline with only core attributes.
  *   **Non-Justification Baseline:** If the need for justification were removed (e.g., purely private choice with no accountability, or a binding rule like "top 3 scores advance"), the effect weakens or disappears.

  #### What Would NOT Count?
  *   **Satisficing (Standard):** Stopping because an option meets a pre-set aspiration level *on the core dimensions* (e.g., "Teaching score > 7/10"). JPT stops on a *reason*, which may be tangential to core dimensions and effectively *lowers* the aspiration level dynamically.
  *   **Genuine Best Option Found:** Stopping because the candidate/apartment/college demonstrably best meets the original criteria.
  *   **Search Cost Termination:** Stopping because further search is genuinely too expensive (time, effort, money), regardless of justification availability.
  *   **Post-Hoc Rationalization:** Generating a reason *after* the choice is made for other causes (e.g., fatigue, anchoring on the first option).
  *   **Reason Aligned with Core Dimension:** Stopping on a reason that directly and strongly reflects a primary initial criterion (e.g., "This is the *only* candidate with a perfect teaching score" when teaching was the top priority).

  #### Observable Differences & Predictions
  *   **Key Prediction (Confirming):** *Strip the need to justify the choice, and the effect goes away or weakens significantly.* In your hiring committee, if members were told, "We will vote anonymously based solely on your private ranking of core scores, no discussion needed," JPT should diminish. In apartment hunting, if you committed to a purely private "gut feeling" rule, you'd likely search longer or choose differently.
  *   **Key Prediction (Amplifying):** *Adding describable attributes makes termination happen earlier and outcomes worse.* Presenting candidates with stripped-down files (only research output, teaching evals, no CV details) vs. rich files should lead to longer searches and better selections on core dimensions in the stripped-down condition.
  *   **Other Predictions:**
      *   Groups with high social accountability will show stronger JPT effects than individuals or low-accountability groups.
      *   The effect will be strongest when initial goals are abstract ("strong research") rather than concrete and measurable (">3 top-tier pubs").
      *   Options with many unique but irrelevant attributes are more likely to trigger termination than options scoring highly on core but common attributes.

  ### Why it's Distinct (Commitment)
  This is **not just satisficing**. Satisficing posits a fixed(ish) aspiration level on relevant dimensions. JPT involves a **dynamic lowering of the effective aspiration level** triggered by the *availability* of *any* seemingly defensible justification, often tangential. The *mechanism* is different: satisficing is about meeting a threshold; JPT is about satisfying a *demand for justification* via the first available "hook," bypassing the threshold evaluation. More information *facilitates* JPT by providing more hooks, whereas in standard satisficing, more information might help find options that meet the fixed bar.

  It's a **specific application of reason-based choice** (Shafir, Simonson, Tversky et al.) to the *stopping rule* in search. While reason-based choice explains *how* preferences are constructed *given* a set of options using reasons, JPT explains *when the search for options stops* – when the first "good enough" reason for *any* option is found. The richness of attributes fuels the ease of reason generation, directly impacting the stopping point.

  ### Confidence & How You Could Be Wrong
  I'm **~85% confident** JPT describes a real, distinct mechanism based on your examples and the logic above. However, it likely exists on a spectrum with:
  1.  **Satisficing under ambiguity:** If core dimensions are vague, any reason might *define* the aspiration level, blurring into satisficing.
  2.  **Search cost heuristics:** The "first acceptable reason" might be a heuristic for minimizing cognitive effort, making justification a proxy for effort rather than the core driver.

  **To convince me I'm wrong (or this is just satisficing):** Demonstrate that in controlled experiments:
  1.  Adding attributes *doesn't* lead to earlier termination/worse outcomes when justification pressure is held constant.
  2.  The *quality* of the justification (how well it aligns with core goals) doesn't matter – only that *some* justification exists. (If only good justifications trigger stops, it collapses into satisficing).
  3.  Termination happens *before* any reason is generated, driven purely by an internal sense of "good enough" on core dimensions, even if a reason is later articulated.

  **For your slide:**
  ---
  **Justification Premature Termination (JPT)**  
  *Search stops on the first defensible reason, not on quality.*

  *   **Mechanism:** Need to justify + Diverse Attributes → Easy Reason Generation → Early Termination.
  *   **Trigger:** Articulation (internal/external) of a subjectively defensible reason for *an* option.
  *   **Effect:** More information → *Worse* decisions on initial goals (earlier stop, lower quality).
  *   **Clear Case:** Committee stops on "only one who teaches X" despite candidate's weak research.
  *   **Not JPT:** Stopping on "highest research score"; stopping due to running out of time; justifying *after* choosing.
  *   **Test:** Remove justification pressure → Effect weakens. Add attributes → Effect worsens.
  ---

  This gives you a concrete, falsifiable concept focused on the stopping rule and its perverse interaction with information richness and justification demand, distinct from its neighbors. Use it well!
