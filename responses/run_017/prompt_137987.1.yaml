prompt: |-
  I'm a third-year PhD student in experimental psychology and I've somehow ended up on our department's research integrity committee, which in practice means I'm the one who has to write the paragraph explaining why we're adopting whatever method reform we're adopting this year. I keep tripping over the same thing, so I thought I'd ask people who do this for a living rather than keep guessing.

  Here's the bit I can't line up. Take two studies: identical design, identical n, identical measurements, identical p-value, say p = .21 in both. Study A was pre-registered with a fixed sample size and a stated smallest effect size of interest, analysed exactly as declared. Study B is the same study run before pre-registration was mandatory here; the analysis was settled after people had looked at the data, and as far as anyone can tell there was no outright fishing, just no pre-commitment. Under our new norms A counts as a genuine finding, evidence of absence, publishable, and it can be cited in a review as settling the question. B is treated as uninformative, file-drawer material, we can't conclude anything from it. Same number on the page, opposite verdicts.

  Then there's the part where I'm not sure we're consistent with ourselves. We're strict about fixing n in advance, and people get told off for peeking at the data and stopping early; the line we give them is that if you'd have carried on past n = 40, you don't get to use the p = .03 you happened to have at n = 40. At the same time, we treat a single pre-registered replication that comes back at p = .40 as a failed replication that puts the original effect in doubt, even though we'd never dream of accepting a single p = .03 as establishing anything. And our ethics committee has now started requiring a smallest effect size of interest in every application, so in principle you can have a confidence interval that includes zero but excludes anything you'd have cared about, and reviewers will say no effect there — but apparently only if the study was pre-registered, and only if someone is willing to say it out loud. Quite a few of my colleagues resist going further and just using equivalence tests with a pre-registered bound, and I genuinely can't tell whether that's methodological conservatism or an inconsistency they haven't noticed.

  So: what view of evidence does this whole package presuppose? More specifically,

  - What has to be true of evidence for pre-registration to change what a given p-value is worth, given that the data are identical in A and B? Is that a commitment to a procedural or reliabilist picture, on which evidence is a property of the method rather than of the numbers, or is there a way to get the same verdict out of a broadly Bayesian picture, e.g. by conditioning on the fact that this result was reported at all rather than just on the test statistic? If there is, does the practice really pick out the first view, or does it fit several?
  - Does the ban on optional stopping presuppose the same thing as the pre-registration bit, or a different thing? It feels like it presupposes that error rates across hypothetical repetitions matter in their own right, whereas the pre-registration asymmetry felt like it was about what the data support. If those are two different commitments, are they even compatible, and which of our rules actually follows from which?
  - How much of this is forced? Which parts of our practice would survive intact under a likelihoodist or Bayesian picture, and which would have to be abandoned? If we went properly Bayesian, priors, Bayes factors, decisions by expected loss, what exactly would we stop doing that we currently do, and what would we have to start doing that we don't?
  - Is there a genuine inconsistency between treating non-significance as we can't say in a single study and treating it as damning in a replication, or is there a single story from which both fall out?

  I don't want a reading list or citations, I can find those myself. I want the implicit epistemology reconstructed, and I want to be told which bits of it we're actually stuck with and which bits we've merely inherited from people arguing in the 1930s. If it helps: we mostly run small-N within-subjects experiments on reaction times and accuracy, nobody has any real idea what our effect sizes are, and half the lab thinks p-values should be abolished outright.
reasoning: |-
  Okay, the user is a third-year PhD student in experimental psychology who's on their department's research integrity committee. They're struggling to reconcile different methodological reforms, especially around pre-registration and optional stopping. Let me unpack their main concerns.

  First, they present a scenario with two identical studies (A and B) with the same data and p-value. Study A is pre-registered and treated as evidence of absence, while Study B is seen as uninformative. The user is confused about why the procedure changes the interpretation when the data are identical. This touches on the philosophy of evidence—is evidence defined by the data alone or the process?

  Next, they mention inconsistencies in their department's practices. They're strict about fixed sample sizes and banning optional stopping, yet they accept a single non-significant replication (p=.40) as a failed replication, even though a single significant result (p=.03) isn't considered sufficient. Also, they require a smallest effect size of interest (SESOI) for ethics, allowing confidence intervals excluding SESOI to indicate "no effect," but only if pre-registered. Some colleagues resist equivalence tests. The user wonders if this is methodological conservatism or inconsistency.

  Their specific questions are:
  1. What view of evidence justifies valuing pre-registered results differently? Is it procedural/reliabilist, or can Bayesian approaches accommodate this?
  2. Does the ban on optional stopping rely on error rates, while pre-registration is about data support? Are these compatible?
  3. Under Bayesian/likelihoodist frameworks, what current practices would change?
  4. Is there inconsistency in treating non-significance as inconclusive in one study but damning in replications?

  The user's deeper needs: They want the implicit epistemology behind their department's rules clarified. They need to write justifications for these reforms and are likely frustrated by perceived inconsistencies. They might also be seeking arguments to advocate for more coherent practices, like adopting equivalence tests. They mention their lab's context: small-N within-subjects RT/accuracy studies, unknown effect sizes, and division over p-values.

  I should address each question systematically. For Q1, the key is that pre-registration counters researcher degrees of freedom. In Study B, without pre-registration, there's ambiguity about whether the analysis was tailored to the data. Even without p-hacking, the flexibility reduces credibility. A Bayesian could model this as selection bias—non-pre-registered studies are more likely to be reported if they're significant. So pre-registration changes the prior probability of H1 being true or the likelihood of data under H0.

  For Q2, optional stopping and pre-registration both relate to controlling Type I error inflation. Frequentist methods depend on the sampling plan; optional stopping alters error rates. Pre-registration fixes the analysis plan. Both are frequentist concerns but align with Bayesian thinking if we consider the experimenter's intentions affecting the data-generating process.

  Q3: Under Bayesian approaches, fixed N isn't necessary; sequential analysis is acceptable. Priors would be required, and SESOI could inform decision rules. Emphasis might shift to effect sizes and Bayes factors. P-values would become less central.

  Q4: The replication paradox arises because initial studies with p<.05 are preliminary. A single replication failure (p>.05) challenges the original if it's underpowered or if prior credibility was low. A Bayesian might see the replication as updating the posterior, especially if the original had a low prior.

  Underlying all this is a blend of frequentist error control and an evolving evidence hierarchy. The department's inconsistencies stem from mixing Fisherian and Neyman-Pearson frameworks. Moving to Bayes would require more explicit priors and abandon fixed N rules. The user might use this analysis to advocate for equivalence tests and clearer epistemological foundations in their committee.
answer: |-
  Your department's practices reflect a hybrid epistemology—part Neyman-Pearson decision theory, part Fisherian significance testing, with modern reforms bolted on to combat publication bias and p-hacking. Here's the reconstructed implicit framework and its tensions:

  ### 1. **Why pre-registration changes evidential weight (identical p-values)**
     - **Core commitment: Control over error probabilities requires fixed procedures.**  
       When Study B's analysis was chosen post-hoc (even without malice), the *nominal* p-value loses its meaning as an error probability. The true long-run Type I error rate is inflated because the analysis path wasn't fixed. Pre-registration restores the link between the reported p-value and its frequentist error rate.
     - **Bayesian escape hatch?**  
       Yes, but it requires modeling selection effects. A Bayesian would say:  
       *The fact that Study B was published with p=.21 is weak evidence for H₁ because non-preregistered studies are more likely to be published/salvaged when results are "interesting" (even if nonsignificant). Study A's preregistration reduces this selection bias.*  
       However, your department isn't using Bayesian methods—so this is likely **not** the implicit justification. The procedural view dominates.

  ### 2. **Optional stopping vs. pre-registration: Different roots?**
     - **Optional stopping ban:** Pure Neyman-Pearson. Fixed-n designs ensure error rates (α, β) are controlled. Peeking + stopping corrupts α.  
     - **Preregistration asymmetry:** Focuses on *researcher degrees of freedom*. It combats *HARKing*, p-hacking, and publication bias—threats to **validity** rather than just error rates.  
     - **Compatibility?**  
       Both aim to protect inference from procedural biases, but:  
       - Optional stopping is about **sampling plans** (error control)  
       - Preregistration is about **analysis plans** (preventing fabrication of evidence)  
       They converge in requiring pre-specification but target different threats.

  ### 3. **What would change under Bayesian/likelihoodist paradigms?**
     | **Current Practice**               | **Under Bayesian/Likelihoodist Approach**               |
     |------------------------------------|--------------------------------------------------------|
     | Fixed-n mandatory                  | Sequential testing encouraged (Bayes factors update continuously) |
     | p=.40 "failed replication"         | Focus on **effect size estimates** and CIs; replication "failure" only if CI excludes original effect |
     | SESOI without equivalence tests    | SESOI directly defines **region of practical equivalence** (ROPE) for decision |
     | Ignoring priors                    | **Explicit priors required** (e.g., skeptical prior for replications) |
     | p-value thresholds (e.g., p<.05)   | Decision via **Bayes factors** or **posterior loss functions** |
     - **Key casualty:** The sacredness of α=.05. Bayes factors quantify evidence *for* H₀, avoiding the "non-significant ≠ no evidence" paradox.
     - **Key addition:** Prior specification becomes critical (e.g., how skeptical should a replication prior be?).

  ### 4. **The replication paradox: Inconsistent or coherent?**
     - **Frequentist resolution:**  
       A single p=.03 study has high Type I error risk (especially if exploratory). A preregistered p=.40 replication has higher credibility: if the original effect was real, observing p=.40 is unlikely *if the replication was well-powered*.  
       *But this assumes adequate power—which your field often lacks for small effects.*  
     - **Bayesian resolution:**  
       Original study: BF=10 for H₁ → modest evidence.  
       Preregistered replication: BF=1/3 for H₁ → evidence for H₀.  
       Combined: Moderate support for H₀ if original prior was weak.  
     - **Inconsistency in your department:**  
       Treating p=.40 as a "failed replication" **without power considerations** *is* inconsistent. If power was 30%, p=.40 is uninformative. Power calculations should be mandatory for such claims.

  ---

  ### What You're Stuck With vs. Historical Baggage
  - **Stuck with (logically necessary):**  
    - Some form of **pre-specification** to combat selection effects (Bayesians need this too!).  
    - **SESOI** for meaningful null results (otherwise "no effect" is vacuously true).  
  - **Historical baggage to jettison:**  
    - **Fetishizing fixed-n:** Sequential designs are valid under likelihood/Bayes.  
    - **p-value dichotomization:** p=.05 vs. p=.06 is arbitrary; CIs/Bayes factors are continuous.  
    - **Ignoring power in replications:** A "failed replication" label requires high power or a Bayes factor.  
  - **Your field's practical constraints:**  
    With small-N RT studies and unknown effect sizes, **equivalence tests with SESOI** are essential. Colleagues resisting this are clinging to Fisherian "no evidence against H₀" thinking. Push back: *"If we can't define what effect size matters, why are we running the study?"*

  ### Bottom Line
  Your department's rules are a pragmatic (but flawed) attempt to approximate **error-control under researcher-induced biases**. The epistemology is **predominantly frequentist with a reliability twist**: trustworthiness stems from method rigidity. To align practices:  
  1. **Mandate equivalence tests** when SESOI is defined.  
  2. **Require power calculations** for "failed replication" claims.  
  3. **Clarify that preregistration doesn't alchemize p=.21 into "evidence"**—it merely licenses an *absence* claim if SESOI is pre-specified and excluded.  

  This isn't just 1930s legacy—it's a necessary response to psychology's replication crisis. But without embracing Bayesian updates or likelihoodist thinking, you'll keep wrestling with paradoxes.
