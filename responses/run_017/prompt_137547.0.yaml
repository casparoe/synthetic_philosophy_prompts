     - Present the three menus one by one (each on a slide for 1-2 minutes per menu). Choosers write down their choices and hand to their analyst.

  - 20-40 min: Reconstruction
     - Analysts work to infer the preference ordering and utility function for their chooser.

  - 40-65 min: Group debrief and discussion
     - Start by asking for volunteers to share: What ordering did you infer? What utilities? (5 min)
     - Then, ask: How many of you found multiple orderings that could fit? (5 min)
     - Point 1: Little that choices pin down. (5 min)
     - Point 2: Stipulating what counts as the same option. (5 min)
     - Point 3: The rule-following case. (5 min)
     - Forced discussion: What is utility? (5 min)
     - End sharply: "So, when we build recommender systems based on clicks, are we discovering what users want, or just re-encoding their past clicks? And what would we need to do to find out if it's the former?" (5 min)

