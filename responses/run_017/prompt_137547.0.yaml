       This is consistent with a preference ordering: Break5 > Break10, Break5 > Nothing, Coffee > Cookie, Coffee > Fruit, Break5 > Coffee, Break5 > Cookie. But does this reveal what the chooser wants? Or are they just following a rule?"

     Force the group to discuss: Is the utility function we reconstructed a discovery about the person or just a compressed re-encoding of the data?

