     End sharply: So, is utility something that exists independently of the choices, or is it just a summary of the choices we've seen? And if it's just a summary, then how can we use it to make predictions about new choices (which we do all the time in our recommender systems)?

  6. **What might go wrong?**
     - Participants might not take the choices seriously (e.g., they might choose randomly or try to trick the analyst). We have to emphasize that they should choose as they normally would.
     - The options might not be salient enough. We need to make sure the breaks and snacks are actually delivered so the choices are real.
     - Time might run short, especially during the reconstruction phase. We can pre-print worksheets for the analysts to fill in.
     - The point about stipulating the same option might be too abstract. We can illustrate with an example: what if the break in Menu3 is in a noisy environment? Then Break5 in Menu1 is not the same as in Menu3.

