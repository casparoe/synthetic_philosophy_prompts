  We are designing an interactive session for 16 engineers on revealed preference. The goal is for participants to experience the difficulties of inferring preferences from choices.

  Key points to hit:
  1. Choices underdetermine preferences: multiple orderings fit the same data; intensity of preference (utility) is not pinned down.
  2. The analyst must stipulate what counts as "the same option" across menus, and this is not determined by the data.
  3. A case where choices are consistent with a stable ordering but we resist saying they reveal "wants" (e.g., following a rule without consulting wants).

  Design:
  - Participants will generate choice data by making choices in a series of tasks.
  - Then, they will try to reconstruct each other's preferences from the data.
  - We need cheap, immediate, and real options. Since it's in-house, we can use:
     * Snacks and drinks (e.g., coffee, tea, water, soda, cookies, fruit)
     * Office supplies (e.g., pens, notepads, sticky notes, highlighters)
     * Break options (e.g., 5-minute break now, 10-minute break later, no break)
     * Abstract but tangible: choices between small tasks (e.g., "solve a puzzle", "watch a funny video", "do nothing") but maybe less real.
     * Since it's about being real to them, we can use choices about how to spend a short break during the session.

  Proposal for options:
  We'll create three menus (sets of options) for participants to choose from. Each menu will have 2-3 options. We want options that are:
  - Immediately consumable (so they are real choices with real consequences)
  - Cheap and easy to provide
  - Distinct enough to have potential preferences

  Option categories:
  1. **Break options**: 
     - Option A: Take a 5-minute break right now.
     - Option B: Take a 10-minute break in 30 minutes.
     - Option C: No break (work through).

  2. **Snack options** (to be consumed during the break or immediately after choice):
     - Option D: Coffee (or tea)
     - Option E: A cookie
     - Option F: A piece of fruit (e.g., banana or apple)

  3. **Task options** (if they don't take a break, or as an alternative):
     - Option G: Solve a quick puzzle (e.g., a logic puzzle that takes 2 minutes)
     - Option H: Watch a 2-minute funny video
     - Option I: Do nothing (just relax for 2 minutes)

  But note: we want them to make choices that are real and that we can record. Also, we want the options to appear in multiple menus so that we can see consistency.

  We need to design menus that have overlapping options to test transitivity and to see if the same option is treated the same.

  Structure of the session:

  1. **Setup (10 minutes)**
     - Explain the topic: We're going to explore how we can infer what people want from the choices they make.
     - Divide the group into pairs. Each pair will be: one "chooser" and one "analyst". They will switch roles after one round.
     - In round 1: Chooser A makes choices from three menus. Analyst A records the choices and then tries to infer Chooser A's preferences.
     - In round 2: They switch.

  2. **Choice Task (20 minutes)**
     - We'll have three menus. Each menu is presented on a slide or a sheet. The chooser must pick one option from each menu.
     - The menus are:
          **Menu 1**: 
            - Option A: Take a 5-minute break right now.
            - Option B: Take a 10-minute break in 30 minutes.
            - Option C: Do nothing (no break).

          **Menu 2**:
            - Option D: A cup of coffee (or tea, if they prefer) now.
            - Option E: A cookie now.
            - Option F: A piece of fruit now.

          **Menu 3** (a combined menu that includes options from both categories, forcing trade-offs):
            - Option A: 5-minute break right now (without any snack)
            - Option B: 10-minute break in 30 minutes (without any snack)
            - Option D: Coffee now (but no break)
            - Option E: Cookie now (but no break)
            - Option F: Fruit now (but no break)

     But note: the break options and snack options are in different categories. We want to see if they are treated as the same when they appear in different menus? Actually, we need to have the same option appearing in multiple menus.

     Revised: Let's create a set of base options and then create menus that are subsets. We want to have:

     Base options:
     - Break5: 5-minute break right now.
     - Break10: 10-minute break in 30 minutes.
     - Coffee: Coffee now (without a break, so they can drink it while working).
     - Cookie: Cookie now (without a break).
     - Fruit: Fruit now (without a break).

     Then we design three menus:

     Menu 1: {Break5, Break10, Nothing}   [Nothing means no break and no snack, just continue]
     Menu 2: {Coffee, Cookie, Fruit}
     Menu 3: {Break5, Coffee, Cookie}   [Here, Break5 includes a break but no snack, and Coffee/Cookie are snacks without break]

     Now, note that Break5 appears in Menu1 and Menu3. Coffee and Cookie appear in Menu2 and Menu3.

     This allows us to test consistency: if they choose Break5 in Menu1 but Coffee in Menu3 (which also has Break5), that might violate consistency if we assume that Break5 is the same in both menus.

     However, in Menu3, Break5 is competing with Coffee and Cookie, while in Menu1 it's competing with Break10 and Nothing. So the context is different.

     We want to see if the analyst can reconstruct a preference ordering that rationalizes the choices.

  3. **Data Collection (10 minutes)**
     - Choosers make their choices from the three menus. They write them down on a slip of paper and give it to their analyst.

  4. **Reconstruction (20 minutes)**
     - The analyst, using only the choices from the three menus, tries to write down a preference ordering (a ranking) of all the options that are in at least one menu. The options are: Break5, Break10, Nothing, Coffee, Cookie, Fruit.
     - The analyst should also try to assign utilities (numbers) that are consistent with the choices (if they can).

  5. **Debrief and Discussion (25 minutes)**
     - We bring the group together and discuss the difficulties.

     Debrief questions:
     - (Point 1) How many different preference orderings could fit the choices your chooser made? Did you assign utilities? How did you decide the numbers? (Highlight that the same ordering can have different utility scales, and intensity is arbitrary.)
     - (Point 2) Did you treat Break5 in Menu1 and Break5 in Menu3 as the same option? What if in Menu3, because the break is taken while others are having snacks, it is less desirable? (The analyst has to stipulate that it's the same.)
     - (Point 3) Now, what if we told you that the chooser was following a rule: for example, always choose the first option in the list? Or always choose the option that has the shortest description? Would that change your interpretation of the revealed preference?

     Then, we present a case: 
