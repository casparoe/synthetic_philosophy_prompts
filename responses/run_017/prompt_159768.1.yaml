prompt: |-
  i work on a tiny team that maintains an internal scheduling system for a home-care provider — it hands out a limited pool of carer visits each week to about 4,000 clients. i've been arguing about its design with a friend who does ML infra and we just go in circles, so i thought i'd ask people who think about this kind of thing properly. (i studied engineering, not philosophy, so please don't assume i know the jargon — my friend keeps using words like "deontological" and i'm not convinced they're doing any work.)

  roughly, here's the setup. at the core there's an optimiser that maximises a predicted-wellbeing score summed over all the clients; it's a model's estimate of how much each visit helps, and it will cheerfully trade one client's big loss against a lot of small gains elsewhere. layered on top is a list of what we call red lines that the optimiser is simply not allowed to cross: never cancel a booked visit with less than 24 hours' notice, never tell a relative anything about a client's condition without that client's own consent, never roster a carer for more than 60 hours in a week. if a red line blocks the best-scoring plan, the system takes the best plan that respects it and writes a "blocked" event to a log. two details seem important to me. first, the red lines weren't handed down from anywhere — a couple of years ago we ran a survey asking service users and carers how bad it would be if each of those things happened, took the median badness rating for each, and promoted the worst-rated ones to hard constraints. so they were born as welfare estimates and are now treated as non-negotiable. second, at our quarterly review a board looks at every blocked event alongside a number the system computes for it: how much predicted wellbeing was "left on the table" by obeying the red line. if a red line keeps costing a lot, the board talks about dropping or weakening it. but being blocked never counts against the system day to day.

  what i can't get strait is whether this thing is actually committed to rules that bind independently of the numbers, or whether it's just maximising plus some machinery that happens to look like principles. does treating a constraint as a hard trump at runtime really presuppose that some considerations aren't to be weighed against aggregate benefit, or could a thoroughgoing consequentialist — the indirect or rule-based sort, or one who thinks the decision procedure should be insulated from case-by-case calculation — have designed exactly this? is the quarterly "left on the table" figure in tension with the runtime behaviour, or is it just bookkeeping? does it matter that the red lines came out of a wellbeing survey — does that make the whole architecture consequentialist all the way down, or can a constraint acquire authority of its own after the fact? i'd also really like to know which parts are genuinely underdetermined, i.e. which bits several rival theories would all happily license, and what specifically would have to change in the system if we swapped the implicit view for either (a) straight act-by-act maximising, or (b) constraints that are absolute in the sense that no amount of lost wellbeing could ever justify relaxing them.

  please don't give me a reading list or citations, i can't follow up on any of that. a few hundred words is plenty. end with a one-sentence line starting "Bottom line:" and then a final line that is just \answer{...} containing one short phrase naming what the architecture as a whole actually presupposes — something like "side-constraints", "thresholds", or "consequentialist all the way down", or your own label if none of those fit.
reasoning: |-
  Okay, the user is working on a scheduling system for a home-care provider. They have an optimizer that maximizes predicted wellbeing but with hard constraints called "red lines." These red lines were derived from median badness ratings from a survey and are treated as non-negotiable during operation. However, quarterly reviews look at the "left on the table" wellbeing when red lines block better solutions, considering whether to drop or weaken them. The user is confused about whether this system is truly rule-based or just consequentialist with extra steps.

  First, I need to understand their core question: Is the system committed to independent rules or just maximizing welfare with constraints? They mention deontological vs. consequentialist frameworks. The key points are the hard constraints at runtime versus the quarterly review that evaluates the cost of those constraints.

  The red lines were originally welfare estimates but are now hard constraints. That transformation is important. During operation, they act as absolute rules, but the quarterly review treats them as adjustable based on accumulated costs. This seems like a hybrid approach. The runtime behavior enforces rules without weighing consequences, but the review process uses consequentialist thinking to reassess the rules.

  The user also asks what would change under pure act-by-act maximizing or absolute constraints. For straight maximizing, they'd remove red lines and allow trade-offs in real-time. For absolute constraints, the quarterly review wouldn't consider the cost—red lines would never change regardless of lost wellbeing.

  The quarterly "left on the table" figure is consequentialist because it measures the cost of adhering to rules, suggesting rules are instrumental rather than intrinsic. However, the runtime treats them as inviolable, which is rule-based. So the architecture uses rules operationally but views them consequentially at the policy level.

  The origin of red lines from a wellbeing survey might imply consequentialist roots, but once codified as hard constraints, they function as rules. The system doesn't question them day-to-day, which gives them a deontological flavor during operation. But the review process undermines their absoluteness.

  So the overall presupposition is "rule utilitarianism" or "two-level consequentialism." The system uses rules derived from welfare to avoid constant calculation, but these rules are periodically reassessed based on outcomes. The answer should capture this hybrid nature. The bottom line is that the architecture presupposes rules as operational proxies, subject to consequentialist revision.
answer: |-
  Your system is a pragmatic blend that borrows from both consequentialist and deontological thinking but leans consequentialist in its foundations. Here's the breakdown:

  1.  **Runtime Behavior (Rule-like):** During daily operation, red lines function *as if* they are absolute, non-negotiable deontological constraints. The optimizer doesn't trade them off against predicted wellbeing gains. This provides predictability, protects against catastrophic individual harms (identified as worst-rated), and simplifies real-time decision-making.
  2.  **Architectural Core (Consequentialist):** The *reason* for the red lines' existence, their *content* (derived from welfare estimates), and the *mechanism for change* (quarterly review based on accumulated "left on the table" wellbeing cost) are all fundamentally consequentialist.
      *   Red lines aren't treated as intrinsically sacred values; they are proxies/rules-of-thumb established to prevent high-badness events *because* preventing those events was deemed crucial for aggregate welfare *based on the survey*.
      *   The "left on the table" figure directly measures the consequential cost of maintaining the rule. Reviewing this cost to potentially drop/weaken the rule reveals that the *ultimate* goal remains maximizing aggregate wellbeing. The rules are instrumental tools, not ends in themselves.
  3.  **Underdetermined & What Changes:**
      *   **Rule-like Operation:** Both rule-consequentialists (who think rules maximize best if followed rigidly) and deontologists (who think rules bind independently) could design this runtime layer. The *behavior* during scheduling is compatible with both.
      *   **Changes for Pure Act-Consequentialism (a):** Remove red lines entirely. The optimizer would freely trade off *all* factors (like cancellations or carer hours) against predicted wellbeing gains in every single scheduling run. The log of "blocked" events and the quarterly review of rule costs would vanish.
      *   **Changes for Absolute Constraints (b):** The quarterly review would *never* consider the "left on the table" cost as a reason to drop or weaken a red line. The log might exist for transparency, but the cost figure would be irrelevant noise. Red lines would be immutable principles, regardless of their welfare impact over time. Their origin in a survey would be merely historical, not justificatory.

  **Tension?** The quarterly review *is* in tension with the idea that red lines are truly independent moral constraints at runtime. If they were absolute, their cost wouldn't be a factor in their continued existence. The review reveals the system's consequentialist bedrock: rules are valuable only insofar as they serve the aggregate welfare goal long-term.

  **Origin Matters:** While the red lines *operate* as constraints, their birth and justification being purely welfare-based means the architecture is fundamentally consequentialist. They haven't acquired independent authority; their authority is contingent on their (perceived) net benefit.

  **Bottom line:** Your system presupposes **instrumental rules within a consequentialist framework** – rules are rigid operational proxies for welfare, subject to periodic consequentialist review and adjustment.

  \answer{instrumental rules within a consequentialist framework}
