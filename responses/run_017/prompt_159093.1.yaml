  ---

  ### **Materials Per Station**
  - **Station 1 (Midpoint: Uniform in Disc)**: 
    - A3 sheet with circle (radius 10 cm) and *inner circle* (radius 5 cm) printed concentrically. 
    - Bag of rice. 
    - Tally sheet. 
  - **Station 2 (Endpoints: Uniform on Circumference)**: 
    - A3 sheet with circle (radius 10 cm). 
    - Board-game spinner fixed at center. 
    - 17.3 cm cardboard strip (go/no-go gauge). 
    - Fine-tip marker + eraser (or sticky dots). 
    - Tally sheet. 
  - **Station 3 (Radius: Uniform on Radius)**: 
    - A3 sheet with circle (radius 10 cm, for context). 
    - Two dice. 
    - Spinner (optional, for show). 
    - Printed cheat sheet: *"Roll two dice: n = 6×(die1-1) + (die2-1). If n < 18, chord is LONG; else SHORT."* 
    - Tally sheet. 
  - **Shared**: 
    - Extra tally sheets, pens, calculators. 
    - Projector for TA to display instructions/timers.

  ---

  ### **Timeline (80 Minutes Total)**
  #### **0–5 min: Framing Without Spoilers**
  - **TA says**: "Today, we’re running a lab about *physical randomness*. Each group has a method to generate random chords in this circle. Your task: 
    1. Follow your method exactly. 
    2. For each chord, check if it’s longer than this 17.3 cm strip (the side of an inscribed equilateral triangle). 
    3. Tally 20 trials. 
    We’ll compare results and discuss what 'random' means here. No philosophy terms yet—just do the experiment!" 
  - Assign groups to stations (4 groups: Stations 1, 2, 3a, 3b). 

  #### **5–35 min: Experiment (30 min)**
  - **Station 1 (Midpoint Method)**: 
    - *Procedure*: Drop rice grains onto the sheet. For grains inside the outer circle: if inside inner circle (d < 5 cm), chord is LONG. 
    - *Expected*: ~5 LONG out of 20 (≈1/4). 
    - *Trap*: They’ll see uniform spatial coverage = "random". 

  - **Station 2 (Endpoint Method)**:
    - *Procedure*: Spin spinner twice to mark points A and B on circumference. Use 17.3 cm strip: if distance A-to-B > 17.3 cm (strip too short to span), chord is LONG. 
    - *Expected*: ~7 LONG out of 20 (≈1/3). 
    - *Trap*: Rotational symmetry = "random". 

  - **Stations 3a & 3b (Radius Method)**:
    - *Procedure*: Spin spinner once (for direction—ignore result). Roll two dice, compute n. If n < 18, chord is LONG. 
    - *Expected*: ~10 LONG per group (20 total), ≈1/2. 
    - *Trap*: Uniform radial sampling = "random". 

  - **TA circulates**: 
    - Prevent "re-rolls" (e.g., "That rice bounced!" → count it; "Spinner hit the same point!" → valid). 
    - Redirect debates: "Save disagreements for later—just follow *your* protocol." 
    - **Critical**: Insist groups *don’t compare results yet*. 

  #### **35–45 min: Collision (10 min)**
  - Groups report tallies on board: 
    - Station 1: \_\_/20 LONG 
    - Station 2: \_\_/20 LONG 
    - Station 3a: \_\_/20 LONG 
    - Station 3b: \_\_/20 LONG 
  - **Projected summary**: 
    | Method      | LONG | Probability | 
    |-------------|------|-------------| 
    | Midpoint    | 5    | 0.25        | 
    | Endpoints   | 6    | 0.30        | 
    | Radius (avg)| 20/40| 0.50        | 
  - **TA asks**: "Same circle, same question. Why different results? Which group did it *truly* randomly?" 
  - **Let chaos ensue**: Groups defend their method. *Do not resolve*.

  #### **45–65 min: Commitment & Hedge (20 min)**
  - **Leverage prediction ledger**: "Now, I’ll generate *one* chord secretly using *one* of these methods. Bet your bonus points: assign a probability *p* that it’s LONG. Scoring: log score. If chord is LONG, you get log(p); if SHORT, log(1−p). Maximize your score!" 
  - **Key twist**: Emphasize *"I won’t tell you which method I’ll use!"* 
  - Groups discuss and submit *p* on slips. 
  - **Generate the chord publicly**: 
    - Roll a die: 1-2 → Midpoint (drop rice), 3-4 → Endpoints (spin spinner), 5-6 → Radius (roll dice). 
    - Perform the method, use gauge, announce outcome. 
  - **Reveal the method used** only *after* outcome. 
  - **TA computes scores**: Project scores for extreme bets (e.g., p=0.25, p=0.50) vs. p≈0.36 (average of 1/3, 1/2, 1/4). 
  - **Result**: Students who hedged near 0.36 score better than those who picked "their" probability. 

  #### **65–80 min: Debrief & Unresolved Tension (15 min)**
  - **Map experiences to concepts**: 
    > "At 35 min, you saw three 'uniform' procedures → three probabilities.  
    > At 50 min, you averaged them to hedge your bet → ~0.36.  
    > But *why average these three?* What makes them equally valid?" 
  - **Introduce continuum**: 
    - Sketch a circle on board. "Your methods pinned the midpoint: 
      - Station 1: Uniform in area → d-distribution has density ∝ d. 
      - Station 3: Uniform in radius → d-distribution flat. 
      - Station 2: Not even a midpoint method!" 
    - "But there’s a knob: pick midpoint with density ∝ dᵏ. Setting k=0 gives Station 3 (1/2); k=1 gives Station 1 (1/4). *k can be anything!*" 
  - **Fourth method (invariance)**: 
    - "Some argue: a *truly* random chord shouldn’t 'know' where the circle is. Throw matches on a blank sheet, then drop the circle template → probability = 1/2. But is this the 'right' answer?" 
  - **End with TA’s unresolved wall**: 
    > "My friend said: 'Average the procedures.' I said: 'That just hides the bump in the carpet.' When he asked, 'What’s the *right* number?' I had no answer.  
    > **Your takeaway**: 'Choose at random' is incomplete. Indifference at one level (chords? procedures? densities?) needs justification. Nothing in the phrase tells you *which knob to turn*." 

  ---

  ### **Predictable Issues & Mitigations**
  - **Rice bounces**: 
    - *Fix*: Drop from ≤20 cm height onto soft surface (e.g., towel under A3 sheet). 
    - *When it happens*: "Count it as-is—real randomness includes bounces!" 
  - **Low samples masking probabilities**: 
    - Station 1 expects 5/20, but 7/20 is likely. Station 2 expects ≈6.67/20—4–9 is normal. 
    - *Fix*: Pool Station 3a/3b to show 20/40 = 0.5 clearly. In debrief, stress: "Your 20 trials are noisy—theory says 1/3, 1/2, 1/4." 
  - **Student re-rolls for "randomness"**: 
    - *Fix*: Pre-empt: "No do-overs. If it lands, it counts." 
  - **The "know-it-all" student**: 
    - *Fix*: Privately ask them to play along: "Pretend you’re surprised—help others see the conflict." 
  - **Matches on blank sheet (if attempted)**: 
    - *Issue*: Matches shorter than diameter (≈17.3 cm) bias toward shorter chords. 
    - *Fix*: Use 30 cm rulers. Drop circle *after* matches land. Probability approaches 1/2 only for infinite lines—call this out in debrief as an idealization. 

  ### **What You’ll Need to Voice**
  - **The invariance argument** for the fourth method (matches + template) is subtle. Say: "If the chord-generating process is translation/rotation-invariant, probability must be 1/2." 
  - **Why averaging feels natural but arbitrary**: "Indifference over procedures is *one* response to ignorance—but why weight them equally? Why not include the k-continuum?" 
  - **The core lesson**: "Randomness requires a specified mechanism. Without it, probability is underspecified."

  ---

  This design forces students to:
  1. **Experience** the paradox physically (stations → conflicting results).
  2. **Confront** the incompleteness of "at random" (defend their method).
  3. **Feel the pull** to hedge (betting incentivizes p ≈ 0.36).
  4. **Discover** the bump isn’t resolved (continuum of methods).

  By ending on your personal unresolved tension, you model intellectual honesty and leave them with the "itch" you want.
