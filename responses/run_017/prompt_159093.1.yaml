ts in the room onto specific parts of the idea, says what will predictably go wrong the first time I run it (rice bouncing off the page, students re-rolling until the chord "looks random", 40 samples not actually separating 1/3 from 0.36, the one student who has heard of this and spoils it), and is frank about what the activity can't reproduce and I'll have to say out loud myself.
