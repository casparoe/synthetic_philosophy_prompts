answer: |-
  ## The Archive at Two AM

  The Surplus reading room at two in the morning was a cathedral of particulars. Dust motes danced in the lamplight falling on endless rows of identical grey binders. The air hung thick with the scent of aged paper and cooling metal from the humming server banks lining the far wall. Wren Halloway sat at a long oak table, a single binder open before her. The page showed a scanned requisition order, dated the third day of the Siege of Terrenne. At the bottom, clear and undeniable beneath the printed name of General Maret Ost, was a handwritten signature. The ink was faded, the pressure uneven, but the verification seal of the Surplus glowed a soft, irrefutable blue beside it.

  Footsteps echoed, deliberate and weary. Anselm Roy stood at the end of the table, his Bureau-issue overcoat unbuttoned, revealing the rumpled tunic beneath. His face was pale in the lamplight, etched with lines deeper than Wren remembered from his speeches.

  "Wren," he said, his voice hoarse. Not a greeting, just an acknowledgment.

  "Anselm." She didn’t look up. Her finger traced the edge of the verification seal. "Come to confirm it yourself? The Surplus is open to all."

  "I’ve seen it." He pulled out a chair opposite her, the scrape loud in the silence. He didn’t sit immediately, bracing his hands on the chair back. "It’s Ost’s hand. The Bureau’s own archivists concur. Verified."

  Wren finally looked at him. There was no triumph in her eyes, only a deep, exhausted certainty. "Then you know what I do tomorrow."

  "I know what you *plan*." He sank into the chair, the weariness settling on him like a cloak. "I know you intend to stand at the Convocation and read that signature aloud. Show the scan. Shatter the cornerstone."

  "It’s already shattered, Anselm. It’s been a phantom limb for ten years. We just stopped feeling the pain long enough to build on top of it."

  Roy leaned forward, resting his elbows on the table. "Wren, listen. You know what the Bureau does. You know what I *did*, for six years. We never lied. Not one verified falsehood left our presses. We told the truth. We just… chose *which* truth, and *when*, and *how*."

  "Candour with better lawyers," Wren said flatly, echoing the city’s cynics.

  "Is it lying?" Roy challenged, his voice regaining some of its familiar, measured force. "Or is it building? Politics *is* building a world between people. You can’t build on shifting sand. You need foundations. You need walls. You need a shape people recognize, a story they can inhabit. Terrenne *lives* inside the story we shaped from verified facts. The Surplus?" He gestured expansively at the endless binders. "It’s the quarry. Necessary, raw. But you don’t build a city in a quarry. You build with selected stone. Your refusal to select, to shape, to *interpret*… isn’t that itself a choice? A choice to leave the stones in a heap, handed over to whoever has the time, the anger, or the loudest voice to assemble them?"

  Wren closed the binder with a soft thud. "Facts aren't stones, Anselm. They're the ground. The actual ground. Contingent. Fragile. They *happened*. They could have been otherwise, but they weren't. They resist proof only because they *are* the proof." She tapped the binder. "This signature resists demonstration? No. It *is* the demonstration. Your 'shaping' replaces them. Not with contradiction, but with silence, with displacement. And the endpoint isn't a city believing a lie. It's a city forgetting how to check the ground beneath its feet at all."

  Roy nodded slowly, conceding the point without yielding. "Nearly right, Wren. An unranked heap *doesn't* give a city a story to inhabit. It gives them ten thousand conflicting stories. Chaos. Paralysis. Where does common purpose come from in a Surplus? Where is the 'we'?" He leaned in, his gaze intense. "And what happens tomorrow? You read the signature. You show the scan. The story collapses. What then? Does Kessel rise from the ashes? Do the dead walk? Or do we just destroy the fragile peace that *has* let people rebuild their lives? The survivors… they found meaning in Ost’s denial, in the story of his unwavering righteousness. You rip that away. What do you give them back?"

  "A name," Wren said, her voice low but fierce. "The name of the person who ordered the fire. The fact that it was done *by order*, not chaos. The ground they *actually* stand on, not a story built over a grave. And yes," she met his gaze unflinchingly, "it might shatter Terrenne’s capacity to act together tomorrow. It might leave us… adrift. I concede that. Utterly. But drifting on the real ocean is better than walking confidently on a map drawn over a chasm."

  The air hummed between them, filled only by the servers’ drone. Roy rubbed his temples. "You say ‘replacement’. We say ‘emphasis’. We know the facts. We *know* them, Wren. That’s the point. The liar…" He paused, searching for the words. "The liar *depends* on the truth. He has to know what he’s denying to deny it. That’s his power, his terrible freedom! He can spin infinite alternatives. The truth-teller…" He gestured at her binder. "...is stuck. Stuck with what *is*. The liar acts. The truth-teller… testifies." He looked haunted. "The capacity to deny what is… isn’t that the same capacity that lets us *begin* something new? To say ‘it need not be this way’? Isn’t that the core temptation of politics? Not vice, but the terrible freedom of creation?"

  "And the man who loses contact with the fact entirely?" Wren asked softly. "Not the liar who knows the truth he denies, but the one who believes his own fabrications? What’s that?"

  Roy paled further. "The catastrophe." He whispered it. "Unrecoverable. A world untethered."

  "Exactly. And that’s the trap you walk, Anselm. Every day. You select, you shape, you emphasize. You tell truths. But after ten years of shaping, of choosing the least informative truth, of building walls with carefully chosen stones…" She leaned forward, her gaze piercing. "**Where is the lie physically located, Anselm?** If every sentence you utter is verified true, where does the denial of Ost's signature *live*? Not in the words spoken. Where?"

  Roy stared at the closed binder. The silence stretched. He didn’t look at her. "In the silence," he said finally, his voice stripped bare. "In the sentences *not* chosen. In the hour when a different truth would have been… inconvenient. In the careful arrangement that leads the eye and the mind *away* from the quarry, towards the finished walls. It lives… in the knowing omission. In the choice *not* to speak the fact, precisely because we know it, and know what it would do." He looked up, his eyes hollow. "We know where the bodies are buried, Wren. We just fence off the ground."

  Wren exhaled, the fight momentarily leaving her. "And after ten years of fencing… of knowing but not speaking… are you still in contact with the fact itself? Or just the shape you’ve built around its absence?"

  Roy pushed himself up from the table, his movements stiff. "And you?" he countered, a flicker of his old sharpness returning. "After ten years in this archive, breathing the dust of other people’s truths, other people’s horrors… do you have a world left to stand on, Wren? Or just the groundglass of fact?"

  He gestured at the binder. "Tomorrow, you show that signature. Ost signed the order. Verified. Undeniable. But *why*? Was it rage? Calculation? A mistake under duress? A sacrifice he believed necessary? The fact…" He gave a bleak, humourless smile. "...the *fact* is just ink on a requisition form. It tells us *what*. It tells us *who*. It tells us *when*. It tells us nothing of *why*. Nothing of meaning. Nothing of Ost’s heart or mind in that moment. You give them the ground, Wren. But what will they build on it? What story will they choose? Will it be better than the one we shaped? Or just… different?"

  Wren looked down at the binder. The signature swam before her eyes. The undeniable *what*. The silent *why*.

  "I don’t know," she admitted, the words tasting like ash.

  "Neither do I," Roy said quietly. He turned to go, then paused. "The Convocation bell rings in six hours. Whatever you choose… know the cost." He didn’t specify if he meant the cost of speaking, or the cost of silence. He walked away, his footsteps echoing again, fading into the cavernous depths of the Surplus.

  Wren Halloway sat alone at the oak table in the lamplight, her hand resting on the grey binder containing the undeniable, world-breaking, utterly silent signature of Maret Ost. The servers hummed. The dust motes danced. The ground felt solid beneath her feet, yet terrifyingly vast and empty. Dawn was still hours away.
