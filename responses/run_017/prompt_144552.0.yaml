prompt: |-
  I am the human-factors lead at a metropolitan rail operator, and I want a reusable procedure built out of the notion of sphexishness. I have two recurring jobs that need it. The first is authoring and revising rule-book procedures for signallers and drivers: roughly forty to fifty revisions a year, each of which has to decide whether a step should be scripted as tightly as possible or left to the operator's judgement on the ground. The second is chairing incident reviews: about a dozen a year, two working days of effort each, one ninety-minute debrief with the operator conducted three or four days after the event, no simulator access in the ordinary case, and only the data recorder and the debrief to go on. My reports go to the national rail regulator, whose analysts have no training in philosophy, and to union-nominated safety representatives. That second audience matters: a report that reads as though it called a driver a machine gets appealed and poisons the next twelve reviews, and a report that reads as excusing everyone gets ignored.

  By sphexishness I mean the property the textbook digger wasp is supposed to illustrate: an animal runs a fixed sequence triggered by a cue, and when the experimenter restores the cue after the point of the step has already been achieved, the animal repeats the step, apparently without registering that it no longer needs to. I do not want the procedure to rest on the accuracy of those original observations; use the story as an illustration only, and justify the tests on their own footing.

  What I need is a decision procedure, in words, that a field investigator with a two-day budget can actually run, with:

  1. The tests in the order they should be applied, what counts as a sufficient answer to each, where the procedure terminates in a verdict, and where it must stop and hand the question to a person because it is a question of values rather than fact. Where a test needs evidence I cannot get, mark it optional and say what is lost by skipping it.
  2. A fixed specification of grain. Rigidity looks relative to a description: at a fine enough grain everything is fixed, at a coarse enough grain nothing is. The procedure has to say what grain it tests at, and why that is the right grain for deciding whether an organisation may fairly attribute an outcome to a person.
  3. A verdict vocabulary I can put in a report, in language an analyst with no philosophy training will accept, distinguishing the case where the operator was rigid from the case where the operator adapted badly under pressure, and saying what each verdict does and does not license by way of consequence.
  4. An honest statement of what the procedure cannot do.

  Four things the procedure has to get right, and on which I want your own view rather than an echo of mine.

  The first is the grain problem above. The second is a slide my colleagues keep making and I keep failing to answer in a sentence: they go from these cases plus the thought that every action is caused to the conclusion that operators are never responsible. I believe this conflates being caused with being rigid, since a deterministic system can be extremely flexible in the relevant sense; but I want the procedure to be built so that it cannot make this slide, and if the argument has a better version than the one I have just given, I would rather you told me than flattened it.

  The third is my working taxonomy of failure modes, which I want you to use, correct, or replace: a step that once started runs to completion regardless of what changes; a step that re-runs whenever its trigger cue is present even though the point of the step has already been achieved; and a step that works across familiar configurations but produces nothing appropriate under a relevantly novel one. Are these independent? Is there a fourth? And in particular, what should the procedure say about two hard cases I cannot place: behaviour that looks flexible because it is drawn from a very large store of memorised cases rather than from any appreciation of the situation, and routines for being flexible that have themselves gone rigid, such as a mandatory stop-and-check that everyone signs without checking. I would also be grateful if the procedure contained some defence against its own second case, because my team will otherwise apply it mechanically within a year.

  The fourth is evidence. The natural test for rigidity is counterfactual: if things had been slightly different in some specified way, would the operator have done something appropriately different. I usually cannot run that experiment, and the debrief I do have is contaminated by the operator knowing how it turned out. So the procedure needs to say how to assess counterfactual sensitivity from what is actually available, and what to do when the evidence runs out: default to a system verdict, default to an operator verdict, or refuse to classify.

  Then run it on three cases.

  A. A read-back requirement we introduced for degraded working: when a driver is authorised to pass a signal at danger, the driver must repeat the instruction and the signal number back to the signaller before moving. Compliance is near perfect and errors in the content of the read-back are rising; drivers recite it fluently and get the signal number wrong. Is this step now sphexish, and does the procedure tell me to tighten the script, remove the step in favour of judgement, or do something else?

  B. A signaller faced three alarms in eleven seconds during a power-supply fault. He worked through them in rulebook order. Correctly handling the third required departing from that order. He did not depart. His compliance with the rulebook was perfect. A train was routed at low speed into a possession; nobody was injured. Is this the organisation's design having made him rigid, or a failure attributable to him?

  C. A driver with thirty years' service, well regarded, working a fatiguing roster, passed a temporary speed restriction at line speed in darkness. The board had been moved two nights earlier for works, at a site where a similar board had stood for months, and the change was covered by one line in a weekly notice. He registered that something looked off and had time to act on it. I would very much rather not have to write that this one is attributable to him: the organisation plainly failed him on rostering and on briefing, my team will not thank me, and the union will appeal. If your procedure says I must write it anyway, say so plainly and show the steps. If it says something else, show me the step at which it turns and what that step assumes.

  Finally, tell me where the procedure misfires. I specifically want to know whether it can distinguish genuine flexibility from an enormous library of canned responses, whether it can say anything about how much burden the organisation should carry as opposed to the individual, and how much room it leaves an investigator to smuggle in their own view through the choice of which counterfactuals to test.
reasoning: |-
  We are building a decision procedure for assessing "sphexishness" (rigidity) in operator behavior, to be used in two contexts: revising rule-book procedures and incident reviews. The procedure must be practical for a field investigator with a two-day budget, and it must address the grain problem, avoid the slide from determinism to no responsibility, handle a taxonomy of failure modes, and deal with evidence limitations.

  ### Core Concepts and Requirements Recap
  1. **Sphexishness**: We are not relying on the accuracy of the digger wasp story. We define it as: 
     - A behavior that is triggered by a cue and runs a fixed sequence.
     - The behavior is insensitive to changes in the environment that make the step unnecessary or inappropriate (i.e., it lacks counterfactual sensitivity).
     - Note: We are not saying the operator is a machine, but that the behavior in question may be rigid.

  2. **Grain Specification**: 
     - The procedure must operate at a grain that is meaningful for attributing outcomes. We choose the grain of **task-relevant steps**. 
     - Why? Because we are interested in whether the operator's behavior at the level of tasks (as defined by the organization's procedures and the context of the work) is flexible enough to adapt to variations that matter for safety and efficiency.

  3. **Verdict Vocabulary** (for reports):
     - We need terms that are clear to non-philosophers and acceptable to regulators and unions. We avoid terms that blame the operator as a machine, and we avoid absolving everyone. We propose:
       - **Rigid Behavior (System-Induced)**: The behavior was fixed in a way that was caused by the system (training, procedures, etc.) and did not allow for necessary adaptation. This verdict implies the organization should bear the primary responsibility for redesign.
       - **Poor Adaptation (Operator-Induced)**: The operator had the flexibility to adapt but failed to do so appropriately under the circumstances. This verdict implies the operator bears some responsibility, but we must also consider system factors (like training, fatigue, etc.) that may have contributed.
       - **Inconclusive**: The evidence is insufficient to decide between the above.

  4. **What the procedure cannot do**:
     - It cannot definitively prove the inner mental state of the operator. We infer from behavior and context.
     - It cannot assign moral responsibility (which is a matter for the organization and the courts). It only classifies the behavior for the purpose of system improvement and learning.
     - It cannot perfectly reconstruct counterfactuals. We rely on proxies and must acknowledge uncertainty.

  ### The Decision Procedure: Steps
  We present the steps in order. The investigator must gather evidence (from data recorders, debriefs, procedures, training materials, etc.) and apply these tests. The procedure stops when a verdict is reached or when evidence is insufficient.

  #### Step 1: Define the Step and Context
     - **Action**: Clearly describe the specific step or behavior in question. Specify the grain: it should be at the level of a task that has a defined purpose in the procedure (e.g., "read back an instruction", "handle an alarm").
     - **Why this grain?** Because we are assessing whether the operator's action at the level of the task was flexible enough to achieve the goal under the actual and similar conditions. This grain is relevant for organizational learning and procedure design.
     - **Sufficient answer**: A clear description of the step, its intended purpose, and the context (including any stressors like time pressure, multiple alarms, fatigue).
     - **If insufficient evidence**: If the step cannot be defined at this grain, stop and note the gap. The procedure cannot proceed.

  #### Step 2: Identify the Trigger and Normal Conditions
     - **Action**: Identify the cue that normally triggers the step and the conditions under which the step is designed to be performed.
     - **Why?** To establish the baseline for expected behavior.
     - **Sufficient answer**: The trigger and normal conditions are documented in procedures or training, or are established by common practice.
     - **If insufficient evidence**: Use the debrief and any available data to infer. If still unclear, mark as optional and note that without this, we cannot assess rigidity in the trigger.

  #### Step 3: Check for Fixed Sequence (Failure Mode 1)
     - **Action**: Assess whether the step, once started, runs to completion regardless of changes in the environment that make it unnecessary or harmful. Look for evidence of:
       - Completion despite the goal already being achieved.
       - Completion despite new information indicating it should be stopped.
     - **Evidence**: Data recorder showing the step was performed even when it was not needed (if available), debrief testimony (but note contamination), or patterns of similar incidents.
     - **Sufficient for rigidity**: If there is evidence the step was completed despite clear indications it was unnecessary or harmful, and the operator did not adjust, then this step is rigid. Verdict: **Rigid Behavior (System-Induced)**. The procedure terminates here for this step.
     - **If no evidence of fixed sequence**: Proceed to Step 4.
     - **Optional if evidence is unavailable**: If we cannot get this evidence (e.g., because the situation did not present the opportunity to observe), note that we cannot test this and proceed to Step 4. We lose the ability to detect this specific failure mode.

  #### Step 4: Check for Cue Re-triggering (Failure Mode 2)
     - **Action**: Assess whether the step is re-run whenever the trigger cue is present, even when the goal of the step has already been achieved. Look for:
       - Repetition of the step in response to the same cue in a short time frame when it is not needed.
     - **Evidence**: Data recorder showing repeated execution of the same step in response to the same cue when the goal was already met, or debrief testimony (with caution).
     - **Sufficient for rigidity**: Evidence of re-triggering without need. Verdict: **Rigid Behavior (System-Induced)**. Terminate.
     - **If no evidence of re-triggering**: Proceed to Step 5.
     - **Optional if evidence is unavailable**: Skip, and note we cannot test this failure mode.

  #### Step 5: Check for Novelty Failure (Failure Mode 3)
     - **Action**: Assess whether the step fails in a relevantly novel situation, even though it works in familiar ones. Look for:
       - The situation being outside the operator's training or experience (based on procedures, training materials, and the operator's history).
       - The operator applying the step despite the novelty, leading to an inappropriate response.
     - **Evidence**: The situation was novel (e.g., multiple simultaneous alarms, a moved speed board) and the operator did not adapt the step appropriately. Use debrief to ask what the operator perceived and why they did not adapt (but note hindsight bias).
     - **Sufficient for rigidity**: If the step was applied rigidly in a novel situation where the procedure or training did not provide guidance for adaptation, then this is **Rigid Behavior (System-Induced)**. The system did not equip the operator to handle novelty. Terminate.
     - **If the step was adapted appropriately in the past in similar novelty, but not this time**: This suggests the operator could have adapted but didn't. Proceed to Step 6 to assess why.
     - **If no evidence of novelty**: Proceed to Step 6.

  #### Step 6: Assess Counterfactual Sensitivity (Flexibility)
     - **Action**: This is the core test. We want to know: If the situation had been slightly different in a way that mattered, would the operator have done something appropriately different? We are looking for evidence of the operator's ability to adjust based on the context.
     - **Evidence** (with limitations):
       - **Past behavior**: Look at the operator's history (if available) for similar situations where they adapted. This is indirect and may not cover the exact situation.
       - **Training and simulations**: If available, how did the operator perform in training scenarios with variations? (But note: we usually don't have simulator access.)
       - **Debrief**: Ask the operator what they would have done if a specific aspect had been different (e.g., "If the alarm had been the only one, what would you have done?"). But beware of contamination and hindsight. Also, ask what they noticed and what factors they considered.
       - **Other cues**: Did the operator notice and react to other information in the environment? (Data recorder might show actions not prescribed by the procedure.)
     - **How to assess from available evidence**:
       - If the operator in the debrief can articulate alternative actions they would have taken in slightly different scenarios that are relevant and appropriate, that is evidence of flexibility.
       - If the data recorder or debrief shows the operator did notice critical changes and adjusted other behaviors (even if not this step), that is evidence of general sensitivity.
     - **Verdicts**:
       - **Strong evidence of counterfactual sensitivity**: The operator had the capacity to adapt but in this instance did not. This points to **Poor Adaptation (Operator-Induced)**. However, note that this verdict does not absolve the system. We must consider contributing factors (Step 7).
       - **Evidence of insensitivity**: The operator could not have adjusted even if the situation changed. This points to **Rigid Behavior (System-Induced)**.
       - **Inconclusive**: If evidence is insufficient, we cannot decide and must default to **Inconclusive**. We do not default to either verdict because we lack the basis to attribute.

  #### Step 7: Contributing Factors (Context)
     - **Action**: Even if we have a verdict of Poor Adaptation, we must consider whether the system set the operator up to fail. Factors include:
       - Fatigue, high workload, stress, inadequate training, poor procedures, etc.
       - This step is about context, not rigidity. It helps in understanding the broader causes and in making recommendations.
     - **Why here?** Because the verdict from Step 6 might be operator-induced, but the system may have contributed. We do not change the verdict from Step 6, but we add nuance for the report.
     - **Evidence**: Rosters, training records, incident context (e.g., multiple alarms), etc.
     - **Outcome**: This step does not change the verdict from Step 6 but informs the report and recommendations. For example: "The operator failed to adapt, but this was contributed to by fatigue from the roster and inadequate training on handling multiple alarms."

  #### Step 8: Verdict and Recommendations
     - **Verdicts** (as defined earlier) are:
       - **Rigid Behavior (System-Induced)**: The behavior was fixed due to system design. The organization should redesign the procedure, training, or system to build in flexibility or remove the trigger in inappropriate contexts.
       - **Poor Adaptation (Operator-Induced)**: The operator had the capacity to adapt but failed to do so. The operator may need retraining or counseling, and the system should consider whether it provided adequate support (fatigue management, etc.).
       - **Inconclusive**: Insufficient evidence to decide. Recommendations may focus on improving data collection or procedures for future incidents.
     - **What each verdict licenses**:
       - **System-Induced**: Primary responsibility on the organization to fix the system. The operator should not be penalized for rigid behavior caused by the system.
       - **Operator-Induced**: The operator bears some responsibility, but the system factors (from Step 7) must also be addressed. This may lead to disciplinary action by the organization, but the report should emphasize system improvements to prevent recurrence.
       - **Inconclusive**: No attribution. Focus on gathering better evidence in the future.

  ### Addressing Your Taxonomy and Additional Failure Modes
  - **Your taxonomy**:
    1. Fixed sequence regardless of changes.
    2. Re-triggering by the cue.
    3. Failure under novelty.
  - **Independence**: These are not entirely independent. For example, failure under novelty might be due to a fixed sequence that doesn't account for novelty. But they are distinct ways rigidity manifests.
  - **Fourth failure mode?** We might add: **Over-learned routines that mimic flexibility**. This is behavior that appears flexible because it draws from a large library of memorized responses, but fails when faced with a truly novel situation not in the library. We address this in Step 5 (novelty failure) and Step 6 (counterfactual sensitivity). If the library is very large, it may pass Step 5 in many cases, but Step 6 tries to probe for genuine sensitivity to variations.

  - **Routines for flexibility gone rigid**: For example, a mandatory stop-and-check that is signed without checking. This is a form of **Fixed Sequence (Step 3)**: the step runs to completion (signing) without actually performing the check. We can catch it in Step 3 if we have evidence that the check was skipped (e.g., by time stamps showing insufficient time for a check). Also, Step 6 might reveal that the operator would not adjust the step even if there was a reason to (e.g., a visible hazard).

  - **Defense against the procedure becoming rigid**: The procedure itself must not be applied rigidly. We build in:
    - **Step 8's Inconclusive verdict**: When evidence is insufficient, we don't force a verdict.
    - **Step 7**: Always consider context even in operator-induced cases.
    - **Training for investigators**: They must understand the purpose and not just follow the steps blindly.

  ### Addressing the Four Key Issues
  1. **Grain**: We specified task-relevant steps. This is the right grain because it aligns with how the organization designs procedures and because it is at this level that we can meaningfully say the operator did or did not adapt.

  2. **Slide from determinism to no responsibility**: 
     - The procedure avoids this by:
       - Clearly separating the question of rigidity (a property of the behavior in context) from determinism (which is about causation). We are not asking if the behavior was caused, but if it was inflexible.
       - The verdict of **Poor Adaptation** acknowledges that even in a deterministic system, the operator could have behaved differently (i.e., the system allowed flexibility, but the operator did not exercise it appropriately).
     - Better argument: Determinism does not imply fatalism. The operator, through training and experience, has developed a repertoire of responses. The test is whether that repertoire was applied flexibly (i.e., sensitive to the situation) or rigidly. Responsibility lies in the ability to have acted otherwise given the same inputs (mental states, knowledge, etc.), not in libertarian free will.

  3. **Taxonomy and Hard Cases**:
     - **Large library of memorized cases**: This is not rigid per se, unless it fails under novelty (Step 5) or lacks counterfactual sensitivity (Step 6). We treat it as rigid only if it fails these tests. Otherwise, it may be a form of expertise.
     - **Routines for flexibility gone rigid**: As above, we treat it as a fixed sequence (Step 3) or a lack of counterfactual sensitivity (Step 6). For example, if the mandatory stop-and-check is always signed without checking, then in Step 6 we might ask: "If there had been a visible hazard, would you have stopped and checked?" If the answer is no (or evidence shows they didn't in a similar past incident), then it's rigid.

  4. **Evidence for Counterfactuals**:
     - We use proxies: past behavior, debrief questions about hypotheticals (with caution), and evidence of attention to the environment.
     - When evidence runs out, we go to **Inconclusive**. We do not default to system or operator verdict because we lack the basis. This forces the organization to improve data collection.

  ### Running the Procedure on Your Cases
  #### Case A: Read-back requirement
  - **Step 1**: The step is: "Driver repeats the instruction and signal number back to the signaller before moving." Grain: task-level. Context: degraded working, high compliance, but rising errors in signal number.
  - **Step 2**: Trigger: receiving the instruction to pass a signal at danger. Normal conditions: clear communication, no stress.
  - **Step 3 (Fixed sequence)**: We don't have evidence that drivers complete the read-back even when it's not needed (e.g., if the signaller cancels the instruction). But that is rare. Skip for now.
  - **Step 4 (Re-triggering)**: Not applicable. The step is run once per instruction.
  - **Step 5 (Novelty)**: The errors occur in normal conditions. Not novel.
  - **Step 6 (Counterfactual sensitivity)**: 
    - Evidence: Drivers are fluent in reciting but get the number wrong. This suggests they are not attending to the content. 
    - Debrief: Ask drivers what they would do if the signaller gave a wrong signal number. If they say they would read back as given, that is rigid. If they say they would question it, that is flexible. But note rising errors suggest they are not questioning. 
    - Also, past incidents show errors in content without correction.
    - **Verdict**: Likely **Rigid Behavior (System-Induced)**. The step has become a rote recitation without cognitive engagement. The system designed a step that invites automation without checks.
  - **Step 7 (Context)**: The context of degraded working might add stress, but the errors are rising even without stress.
  - **Step 8 (Verdict)**: System-induced rigidity. 
  - **Recommendation**: Do not remove the step (it's critical for safety). Tightening the script might not help (it's already tight). Instead, redesign to break the rote execution: e.g., require the signaller to ask for the signal number after a delay, or have the driver write it down and read from notes. Also, training to emphasize the purpose.

  #### Case B: Signaller with three alarms
  - **Step 1**: Step: "Handle alarms in rulebook order." Grain: task-level. Context: power-supply fault, three alarms in 11 seconds, high stress.
  - **Step 2**: Trigger: alarm activation. Normal conditions: alarms are rare and handled one at a time.
  - **Step 3 (Fixed sequence)**: He handled them in order even though the third required a different order. He completed the sequence even when it was harmful? Yes, because routing a train into a possession at low speed was the result. Evidence: data recorder shows the order of handling.
  - **Verdict at Step 3**: **Rigid Behavior (System-Induced)**. He ran the fixed sequence despite the situation requiring deviation. The procedure terminates here for this step.
  - **Note**: We do not need to go further. The system designed a procedure that did not allow for prioritization in high alarm load. The signaller followed the procedure perfectly.

  #### Case C: Driver passing speed restriction
  - **Step 1**: Step: "Observe and obey temporary speed restriction boards." Grain: task-level. Context: darkness, fatiguing roster, board moved without adequate notice.
  - **Step 2**: Trigger: sighting a speed restriction board. Normal conditions: boards are in expected locations.
  - **Step 3 (Fixed sequence)**: He passed at line speed. But did he complete a fixed sequence? The step is to slow down. He did not. So this step wasn't completed. We cannot apply fixed sequence to a step that wasn't executed. Proceed.
  - **Step 4 (Re-triggering)**: Not applicable.
  - **Step 5 (Novelty)**: The board was moved. Was this novel? The driver had seen a board at that location for months. The change was mentioned in a weekly notice, but one line among many. This is a relevant novelty: the board was in an unexpected location.
    - Evidence: He registered that something looked off. So he noticed the novelty.
    - He did not slow down. This is a failure to adapt to the novelty.
    - **Verdict possibility**: Rigid Behavior? But note: the rule is not to slow down only if the board is in the expected place. The rule is to slow down at the board. So why didn't he?
  - **Step 6 (Counterfactual sensitivity)**: 
    - The key question: If the board had been in the expected location, would he have slowed? Almost certainly yes (given his record). But that's not the relevant counterfactual. The relevant one: If the board was in an unexpected location (as it was), would a flexible driver slow down? Yes, because the rule is to slow at the board regardless of location. 
    - Evidence: He noticed it looked off but did not slow. Why? 
      - Debrief: He might say he thought it was for a different line or that he missed it due to fatigue. 
      - We know he had time to act but didn't. 
    - This suggests he did not adapt. But why? 
      - Possibility 1: He did not realize it was for his train (a cognitive error). 
      - Possibility 2: He knew but was too fatigued to react. 
    - **Verdict**: 
      - If the issue was cognitive (he didn't connect the moved board to his train), that might be a **Poor Adaptation (Operator-Induced)**. But we must consider fatigue (Step 7). 
      - If the issue was fatigue impairing his ability, then the system contributed heavily. 
    - However, the procedure says: if he had the capacity to adapt (which he did in the past) but failed this time, it is operator-induced. But note: fatigue reduces capacity. 
  - **Step 7 (Context)**: 
    - Fatiguing roster: The system failed to manage fatigue. 
    - Inadequate briefing: The change was buried in a notice. 
    - These factors set him up to fail. 
  - **Step 8 (Verdict)**: 
    - **Poor Adaptation (Operator-Induced)** for the step of slowing down, but with heavy system contribution. 
    - Why operator-induced? Because he noticed something was off and had time to act. The rule does not depend on the board being in the exact spot. He should have slowed upon seeing a board. The system provided the information (in the notice) and he was rostered poorly, but the immediate cause was his failure to act on what he saw. 
    - **Report Wording**: "The driver failed to adapt to a moved speed restriction board despite noticing an anomaly. This was contributed to by fatigue from the roster and inadequate prominence of the change in the briefing materials. The organization must address rostering and briefing practices, and the driver should receive refresher training on vigilance for temporary speed restrictions." 
    - **Union Appeal Risk**: This wording does not call the driver a machine. It says he failed to adapt but notes system factors. The union may still appeal, but the report is balanced.

  ### Where the Procedure Misfires
  1. **Genuine Flexibility vs. Large Library of Canned Responses**:
     - The procedure can struggle to distinguish these because both might pass Step 5 (handling novelty) if the library is large enough and Step 6 (counterfactual sensitivity) if the library covers the variations. 
     - However, Step 6 tries to probe for whether the operator can generate a truly novel response (one not in the library). If the debrief can elicit such a response, that suggests flexibility. But if the library is exhaustive, we might never know. 
     - The procedure might misclassify a large library as flexibility. This is a limitation.

  2. **Burden Sharing (Organization vs. Individual)**:
     - The procedure does assign verdicts that imply burden (system-induced: organization; operator-induced: individual). But Step 7 ensures that even in operator-induced cases, system factors are noted. 
     - However, it does not quantify the burden. That is beyond its scope. The report must use judgment in describing contributing factors.

  3. **Investigator Bias in Counterfactuals**:
     - The choice of which counterfactuals to test in Step 6 is subjective. An investigator might choose ones that favor a desired verdict. 
     - Mitigation: The procedure should require the investigator to test counterfactuals that are:
       - **Relevant**: Variations that are reasonably likely and matter for the goal.
       - **Plausible**: Based on the actual context (e.g., in Case C, moving the board is plausible).
       - **Diverse**: Cover a range of variations.
     - But bias remains a risk. Training and peer review of reports are essential.

  ### Conclusion
  This procedure provides a structured way to assess rigidity in operator behavior. It is practical for a two-day investigation and produces verdicts that are actionable and acceptable. It addresses your key concerns, but it is not perfect. Continuous refinement and training of investigators are crucial to prevent the procedure from becoming sphexish itself.
answer: |-
  Below is a reusable decision procedure for assessing sphexishness (rigidity) in operational contexts, designed for your two use cases (rule-book revisions and incident reviews). It addresses your requirements, including grain specification, verdict vocabulary, evidence constraints, and defenses against common pitfalls. The procedure is structured as a step-by-step flowchart, with clear exit points, and includes safeguards against misuse.

  ---

  ### **Sphexishness Assessment Procedure**  
  *Version 1.0 for Rail Operator Human-Factors Lead*  

  #### **1. Grain Specification**  
  - **Grain Level**: Task-step sequences within a **defined operational goal** (e.g., "responding to an alarm," "complying with a speed restriction").  
  - **Why this grain?**  
    - Too coarse (e.g., "safely operate a train") masks rigidity; too fine (e.g., "move hand to control lever") over-attributes.  
    - Task-step grain isolates discrete behaviors where flexibility matters for safety outcomes. It aligns with how rulebooks define steps and how regulators assign accountability.  
  - **Operational Definition**:  
    - A step is **rigid** if it cannot be interrupted, redirected, or adapted when the environment changes in ways that invalidate its purpose, despite the operator having:  
      - Time to react (≥2 seconds, per data-recorder evidence),  
      - Training/experience relevant to the change,  
      - No physical impediments (e.g., blocked controls).  

  #### **2. Decision Procedure Flow**  
  *Order of tests, exit points, and evidence requirements. Apply sequentially.*  

  | Step | Test | Evidence Required | Sufficient Answer | Exit Point |
  |------|------|-------------------|-------------------|------------|
  | **1** | **Define the Step & Goal**:<br>What was the specific step executed? What was its *purpose* in context? | Incident data, rulebook, debrief notes. | Clear description of:<br>- Trigger cue (e.g., alarm sound),<br>- Intended outcome (e.g., isolate power fault). | If goal/step undefined → **Inconclusive**. |
  | **2** | **Check for Goal Achievement**:<br>Was the step’s purpose *already fulfilled* before/during execution? | Data recorder timestamps, debrief. | Evidence the goal was met (e.g., fault cleared) but step ran anyway. | If **yes** → Proceed to Step 3.<br>If **no** → Skip to Step 4. |
  | **3** | **Fixed Sequence Test (Failure Mode 1)**:<br>Did the step complete despite its purpose being achieved? | Data recorder, witness logs. | Uninterrupted completion after goal achievement (e.g., alarm silenced but restart sequence still run). | If **yes** → **Rigid Behavior (System-Induced)**.<br>Terminate. |
  | **4** | **Cue Re-Triggering Test (Failure Mode 2)**:<br>Was the step re-run when the trigger cue recurred *unnecessarily*? | Data recorder, debrief (ask: "Did you think the cue meant a new problem?"). | Repetition without new need (e.g., handling the same alarm twice identically). | If **yes** → **Rigid Behavior (System-Induced)**.<br>Terminate. |
  | **5** | **Novelty Response Test (Failure Mode 3)**:<br>Was the environment *relevantly novel* (unfamiliar but within training scope), and did the step fail to adapt? | Training records, maintenance logs, debrief (ask: "Had you seen this before?"). | Novelty + identical response despite changed conditions (e.g., new alarm pattern, but old procedure used). | If **yes** → **Rigid Behavior (System-Induced)**.<br>Terminate.<br>If **no novelty** → Proceed to Step 6. |
  | **6** | **Counterfactual Sensitivity Test (Core)**:<br>Would the operator have adapted if a *minor, plausible* variable changed?<br>*Use proxies when direct evidence lacking:* | Past incidents (same operator), debrief (ask: "If [variable] differed, what would you do?"), training records. | **Flexible**: Operator describes/varied response to similar past changes.<br>**Rigid**: Operator states no change or cites rote rule. | If **rigid** → **Rigid Behavior (System-Induced)**.<br>If **flexible** → Proceed to Step 7.<br>If **unclear** → **Inconclusive**. |
  | **7** | **Adaptation Quality Test**:<br>If flexible, was the adaptation *reasonable* given pressure/training? | Industry best practices, expert panel (optional). | **Poor adaptation**: Action violated basic training (e.g., speeding in fog).<br>**Reasonable adaptation**: Action was defensible but suboptimal. | If **poor** → **Poor Adaptation (Operator-Induced)**.<br>If **reasonable** → **No Rigidity Detected**.<br>Terminate. |

  **Evidence Notes**:  
  - **Debrief Contamination Mitigation**: Ask open-ended questions first (e.g., "Walk me through your thoughts *at the time*"). Avoid leading questions.  
  - **Optional Tests**: Steps 3 and 4 require direct evidence. If unavailable, skip—but state: *"Cannot assess fixed-sequence or re-triggering rigidity; conclusions rely on Steps 5–7."*  
  - **When Evidence Runs Out**: Default to **Inconclusive**. Do not assume system/operator fault without evidence.  

  #### **3. Verdict Vocabulary**  
  | Verdict | Meaning | Consequence Licensing | Report Language |
  |---------|---------|------------------------|----------------|
  | **Rigid Behavior (System-Induced)** | Step was mechanically triggered; no adaptability to context. | Blames **system design**. Mandates procedure/training redesign. No operator discipline. | *"The system did not enable the operator to adapt to [context]. Recommendations: [redesign steps]."* |
  | **Poor Adaptation (Operator-Induced)** | Operator had flexibility but chose poorly under pressure. | Blames **individual action**. License for retraining/discipline, BUT must address system factors (fatigue, briefing). | *"The operator misapplied judgement in [context]. Contributing factors: [fatigue/briefing]. Recommendations: [individual actions] + [system fixes]."* |
  | **No Rigidity Detected** | Behavior was flexible and appropriate. | No blame. Close incident. | *"Actions were reasonable given constraints."* |
  | **Inconclusive** | Insufficient evidence to classify. | No blame. Focus on data gaps. | *"Evidence is inadequate to attribute cause. Recommendations: [improve data collection]."* |

  **Key Safeguards**:  
  - **Avoid "Machine" Language**: Focus on "behavior/system," not "operator."  
  - **Union Appeal Defense**: Use "contributing factors" in operator-induced verdicts to acknowledge system role.  

  #### **4. What the Procedure Cannot Do**  
  - **Not a Moral Responsibility Tool**: Does not assess intent or culpability—only behavioral rigidity.  
  - **Cannot Distinguish**:  
    - Genuine flexibility vs. large library of memorized responses (both pass Step 6 if adaptations are pre-trained).  
    - Optimal vs. marginal adaptations (relies on expert judgment in Step 7).  
  - **Burden Sharing**: Does not quantify organization/individual burden (use contributing factors analysis).  
  - **Investigator Bias**: Choice of counterfactuals in Step 6 can skew results (mitigation: pre-defined variables in rulebook).  

  ---

  ### **Addressing Your Four Key Issues**  
  1. **Grain Problem**:  
     - Fixed at **task-step level** tied to operational goals (e.g., "handle alarm" not "push button"). Balances specificity with accountability scope.  
     - *Why it works*: Matches regulator/union expectations—neither too microscopic (over-blame) nor macroscopic (under-blame).  

  2. **Determinism vs. Rigidity Slide**:  
     - **Procedure Defense**: Step 6 tests *counterfactual sensitivity* (would behavior change if inputs differed?). Determinism ≠ inevitability: a system can be deterministic but responsive to new inputs (flexible).  
     - **Better Argument**: Rigidity is about *insensitivity to feedback*, not causation. The procedure asks, "Did the behavior ignore environmental signals?" not "Was it caused?"  

  3. **Taxonomy of Failure Modes**:  
     - **Revised Taxonomy**:  
       1. **Fixed-sequence rigidity** (runs to completion).  
       2. **Cue-re-trigger rigidity** (repeats on cue).  
       3. **Novelty rigidity** (fails under new contexts).  
       4. **Overlearned mimicry** (large library of responses *lacking generalization*).  
       5. **Metarigidity** (flexibility routines gone rigid, e.g., stop-and-check without checking).  
     - **Hard Cases**:  
       - **Overlearned mimicry**: Test with Step 5 (novelty). If operator fails at truly novel scenario, it’s rigidity.  
       - **Metarigidity**: Test with Step 3 (fixed sequence) + Step 6 (ask: "If an error was visible, would you have paused?").  
     - **Anti-Rigidity Defense**: Step 7 requires human judgment, preventing mechanical application.  

  4. **Evidence Limitations**:  
     - **Counterfactuals from Proxies**: Use past behavior (data), training responses, and debrief hypotheticals.  
     - **When Evidence Fails**: Default to **Inconclusive**—no default blame.  

  ---

  ### **Case Applications**  
  **Case A: Read-Back Errors**  
  - **Step 1**: Step = "Verbally repeat signal number." Goal = "Confirm correct signal."  
  - **Step 2**: Purpose not achieved (errors rising).  
  - **Step 5**: Novelty? No—routine context.  
  - **Step 6**: Counterfactual: "If signaller gave wrong number, would you notice?" Debrief: Drivers say "no" (fluent recitation without processing). → **Rigid Behavior (System-Induced)**.  
  - **Verdict**: Redesign step—e.g., add a 2-second pause before read-back to force cognition. Do not remove; judgement alone would increase errors.  

  **Case B: Signaller's Alarm Sequence**  
  - **Step 1**: Step = "Handle alarms in rulebook order." Goal = "Mitigate all faults."  
  - **Step 2**: Goal unachieved (train routed into possession).  
  - **Step 3**: Fixed sequence? Yes—he completed sequence despite third alarm requiring deviation. → **Rigid Behavior (System-Induced)**.  
  - **Verdict**: Blame system. Add procedure: "If >2 alarms in <60s, prioritize by severity." No operator discipline.  

  **Case C: Driver Missed Speed Restriction**  
  - **Step 1**: Step = "Observe and obey speed boards." Goal = "Slow to mandated speed."  
  - **Step 2**: Goal unachieved.  
  - **Step 5**: Novelty? Yes—board moved (but similar boards existed).  
  - **Step 6**: Counterfactual: "If board was 10m farther, would you slow?" Debrief: "Yes, but I thought this was old." → **Flexible** (he *could* adapt).  
  - **Step 7**: Adaptation poor? Yes—basic training says "obey *all* boards." → **Poor Adaptation (Operator-Induced)**.  
  - **Contributing Factors**: Fatigue, poor briefing.  
  - **Verdict**: Report: "Operator failed to adapt to visible hazard, exacerbated by fatiguing roster and inadequate briefing. Recommendations: Driver retraining + roster review + highlight notices."  
  - **Union Appeal Mitigation**: Emphasize system factors in recommendations.  

  ---

  ### **Where the Procedure Misfires**  
  1. **Genuine Flexibility vs. Canned Responses**:  
     - Cannot distinguish if the "library" covers all tested scenarios. Step 6 may misclassify overlearned mimicry as flexibility.  
     - **Mitigation**: In debrief, test with genuinely novel (but safe) hypotheticals.  

  2. **Burden Sharing**:  
     - Does not quantify organization/individual split. Step 7’s "contributing factors" flags system issues but doesn’t weight them.  
     - **Mitigation**: Supplement with a matrix (e.g., "Fatigue contributed 40% per roster logs").  

  3. **Investigator Bias in Counterfactuals**:  
     - Choice of variables in Step 6 can rig outcomes (e.g., testing irrelevant changes).  
     - **Mitigation**: Pre-define critical variables in rulebooks (e.g., "for signals, test location/color errors").  

  **Final Note**: This procedure systematizes sphexishness assessment but requires investigator training to avoid rigidity in its application. It best isolates *behaviors*, not people—aligning with your goals for union trust and regulator clarity.  

