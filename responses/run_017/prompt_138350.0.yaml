prompt: |-
  Hey — possibly a weird one, but let's see. I'm part of a small volunteer group drafting a charter for an imaginary three-level federation (communes / cantons / federation) that we're using as a teaching case in a civic-ed thing, and I want to nail subsidiarity down before we build the rest of the document around it.

  My working understanding is pretty simple: subsidiarity means decisions get made at the lowest level that can competently handle them, and only move up when the lower level obviously can't cope. So our draft pushes basically everything downward by default — we even put in a compulsory devolution rule where any federal competence sunsets after ten years unless the centre re-justifies it, plus a rights floor the federation can enforce against a commune. The EU treaty's "can't be sufficiently achieved by the member states" language looks to me like the same idea with more syllables, so I figure a properly consistent charter would leave the centre with almost nothing: army, currency, rivers.

  Two places where I'm stuck. First, capacity: half our communes are tiny and would clearly botch water treatment or procurement, so a couple of us want a "capacity-first" clause making the federation fund and train a commune before anything is actually devolved to it. One person says that's the opposite of subsidiarity; another says it's the entire point. And a friend who reads a lot of Catholic social teaching says I've got the principle backwards — that "subsidium" means *help*, that the original target was the big centralised state swallowing up smaller associations, and that the higher level can actually be required to step in. Which honestly sounds like having it both ways to me.

  Second: does the principle say anything at all about who pays? We keep sliding into that question. If a canton is made to run a service, does subsidiarity imply it gets the tax base too, or is that a seperate principle altogether?

  So: is "lowest level that can handle it" even the right test, or is there a better one for deciding when something genuinely has to move up? And what's the standard way people handle the case where the lower level *could* handle a decision but its decision wrecks something for the level above — an upstream commune damning a river, a commune zoning out a rail line, that sort of thing. Mostly I want to know whether our whole setup is resting on a misreading.
reasoning: |-
  Okay, this user is part of a volunteer group creating a civic education project involving an imaginary federation. They're focused on nailing down the principle of subsidiarity in their charter before building the rest. Their current understanding is that decisions should be made at the lowest competent level, with a default push downward. They've included mechanisms like a compulsory devolution rule and rights floor.

  They have two main sticking points. First is the capacity issue - how to handle situations where lower levels lack capability. There's disagreement within their group about whether higher levels should fund/train lower levels before devolution, with some seeing this as contradicting subsidiarity while others see it as essential. The Catholic social teaching perspective about "subsidium" meaning help adds another layer.

  The second issue is fiscal responsibility - whether subsidiarity implies that the level providing a service should also control the tax base. They're also concerned about externalities where a lower-level decision negatively affects higher-level interests.

  I need to clarify that subsidiarity is indeed about competence at the lowest level, but with the crucial nuance that higher levels have a positive duty to support lower levels when needed. The user's compulsory devolution rule is interesting but might be too rigid - a better approach might be requiring continuous justification rather than automatic sunsetting.

  For the capacity question, the Catholic social teaching perspective is actually foundational here - subsidiarity requires higher levels to empower lower levels through resources and capacity-building. This isn't contradictory but rather completes the principle.

  Regarding fiscal aspects, subsidiarity doesn't directly dictate fiscal arrangements, but there's a strong logical connection - meaningful authority requires adequate resources. We should discuss different fiscal models that align with the principle.

  For cross-level externalities, the key is ensuring higher levels can set minimum standards or frameworks while leaving implementation details to lower levels. The "necessity test" from EU law could be a useful model here.

  The user's setup isn't fundamentally flawed, but could benefit from more nuanced mechanisms that balance local autonomy with necessary higher-level coordination and support. I'll structure a response that addresses each concern while reinforcing their core understanding of subsidiarity as a dynamic, empowering principle.
answer: |-
  You've hit the nail on the head about the core tension within subsidiarity! Your understanding ("lowest level that can competently handle it") is the **foundation**, but the nuances you're grappling with are exactly where the principle gets interesting and practical. Your friend referencing Catholic social teaching is onto something crucial.

  Let's break down your questions:

  **1. Is "lowest level that can handle it" the right test?**
  *   **Yes, as a starting point.** This is the core *negative* aspect: higher levels should *not* take over tasks lower levels *can* perform adequately.
  *   **But it's incomplete.** The Catholic social teaching perspective ("subsidium" = help/support) provides the essential *positive* counterpart. True subsidiarity isn't just about *not taking away* competence; it's also about the higher level actively *ensuring* the lower level *can* exercise its competence effectively. Here's the synthesis:

      > **Subsidiarity means decisions *should* be made at the lowest competent level, AND higher levels have a positive duty to empower lower levels to achieve that competence (through resources, coordination, framework-setting, or temporary intervention).**

  *   **Your "capacity-first" clause IS subsidiarity:** If a commune *lacks* the capacity to handle water treatment competently, forcing devolution *without support* violates the principle. The higher level (canton or federation) has a duty to either:
      *   **Fund & Train:** Provide resources/skills until competence is achieved (subsidium as help).
      *   **Temporarily Manage:** Run the service *while actively building local capacity* for eventual devolution.
      *   **Set Minimum Standards/Coordination:** Mandate *what* must be achieved (e.g., clean water standards) but leave the *how* to the commune (perhaps with shared resources).
  *   **Who is "right"?** Both sides in your group have a point:
      *   *Point 1:* Automatically devolving *without* ensuring capacity is reckless and violates the "competent handling" test.
      *   *Point 2:* Permanently withholding responsibility *without* providing support violates the "positive duty to empower" aspect.
  *   **The Catholic perspective is key:** It prevents subsidiarity from becoming a justification for abandoning vulnerable communities or creating postcode lotteries. The higher level *must* act when the lower level *fundamentally cannot* (due to scale, lack of resources, or negative externalities – see point 3), *but* its action should be *supportive* (enabling local action) rather than *supplanting* it whenever possible.

  **2. Who Pays? Fiscal Subsidiarity**
  *   **Subsidiarity itself doesn't explicitly dictate fiscal arrangements.** It's primarily about *authority and competence*.
  *   **However, it implies a strong connection.** Meaningful authority without adequate resources is a sham. Key principles:
      *   **Alignment:** The level responsible for delivering a service should ideally have control over the relevant revenue streams *or* receive reliable, non-conditional funding to perform it. ("No unfunded mandates").
      *   **Autonomy:** Lower levels should have *some* genuine fiscal autonomy (own-source revenue like local taxes, fees) to make meaningful choices reflecting local priorities.
      *   **Solidarity:** Higher levels often redistribute resources to ensure minimum standards and capacity across lower levels (this is part of their "subsidium" duty). Equalization payments are common.
      *   **Efficiency:** Some taxes are best levied centrally (e.g., income tax, VAT) for efficiency and preventing distortion, but shared with lower levels.
  *   **Standard Models:**
      *   **Assigned Revenues:** Specific taxes are assigned to each level.
      *   **Tax Sharing:** Higher levels collect taxes but share a defined portion with lower levels.
      *   **Grants/Transfers:** Higher levels provide grants (conditional or unconditional) to lower levels for specific functions or general support.
      *   **Equalization:** Transfers to ensure poorer communes/cantons can provide comparable services.
  *   **Conclusion for your Charter:** Subsidiarity strongly suggests that competence and fiscal capacity must be aligned. If you devolve a service, you *must* devolve the means to fund it (via own revenues or guaranteed transfers). Your "compulsory devolution" rule would need a parallel fiscal devolution mechanism.

  **3. Handling Externalities & Spillovers ("Wrecking the level above")**
  *   **This is where "can't be sufficiently achieved by the member states" becomes critical.** It's the core justification for higher-level action under subsidiarity.
  *   **The Test:** Can the problem be *effectively and efficiently* solved *only* by action at a higher level? Common reasons for "Yes":
      *   **Negative Externalities:** One commune's action harms others (polluting a shared river, blocking a vital corridor). The lower level has no incentive or ability to solve the collective problem.
      *   **Positive Externalities/Scale:** Benefits require coordination/scale beyond a single unit (national defense, major infrastructure, epidemic control, preventing a "race to the bottom").
      *   **Ensuring Fundamental Rights/Standards:** Guaranteeing a minimum floor of rights or services nationwide (your "rights floor" is a perfect example of justified higher-level action).
      *   **Cross-Border Issues:** Problems inherently spanning jurisdictions.
  *   **How Higher Levels Intervene (Respecting Subsidiarity):**
      *   **Set Minimum Standards/Frameworks:** Define *what* must be achieved (e.g., environmental quality, basic education standards, non-discrimination) but leave the *how* to lower levels.
      *   **Coordination Mechanisms:** Create structures for lower levels to coordinate voluntarily on shared problems (e.g., river basin commissions, regional transport planning).
      *   **Framework Legislation:** Establish the rules of the game (e.g., zoning principles, environmental impact assessment rules) applicable to lower-level decisions.
      *   **Direct Action (Last Resort):** Only take over specific implementation *if* lower levels demonstrably fail to meet the standards or address the externality *and* coordination fails. This should be temporary and capacity-building focused.

  **Critique & Refinement of Your Approach:**

  *   **"Lowest Level" Focus:** Correct core, but needs the "empowerment/support" duty explicitly added.
  *   **Compulsory Devolution Rule:** This is **bold and potentially problematic**. Ten years is arbitrary. Technology, threats, and needs change. Constant justification is good, but automatic sunsetting risks instability and ignores genuine long-term needs best handled centrally (e.g., currency stability, core defense). **Better:** A strong presumption of decentralization, a requirement for *continuous justification* of central powers (regular reviews), and clear criteria for when central action is *necessary* (using the externality/scale/sufficiency tests above). Allow for *asymmetric devolution* where capacity varies.
  *   **Rights Floor:** This is **essential** and perfectly aligned with subsidiarity (addressing a negative externality of rights violations and ensuring a minimum standard the federation must uphold).
  *   **Capacity-First Clause:** **Absolutely necessary.** Frame it as the higher level's *duty to empower* the lower level, not as blocking devolution. "Devolution shall occur when a lower level demonstrates competence, or the higher level has implemented a plan to build that competence within a defined timeframe."

  **Conclusion:**

  Your setup isn't resting on a *misreading*, but on an *incomplete* reading. You've grasped the crucial "bottom-up" default. Now integrate these key elements:

  1.  **The Positive Duty:** Explicitly state the obligation of higher levels to support and empower lower levels to achieve competence.
  2.  **The "Sufficient Achievement" Test:** Clearly define the criteria for higher-level action (externalities, scale, necessity, rights protection). This answers your "wrecking the level above" question.
  3.  **Fiscal Alignment:** Ensure devolution of competence is matched by devolution of resources or guaranteed funding.
  4.  **Refine the Sunset Rule:** Replace automatic sunsetting with mandatory periodic review against the "sufficient achievement" test and capacity assessments. Allow for asymmetric progress.
  5.  **Embrace Capacity Building:** Make the "capacity-first" approach central, framed as empowerment.

  By incorporating these, your charter will reflect subsidiarity as a dynamic, empowering principle that balances local autonomy with the necessity of collective action and solidarity, avoiding both central overreach and local abandonment. Good luck with the civic-ed project – this is exactly the kind of nuanced thinking it should provoke!
