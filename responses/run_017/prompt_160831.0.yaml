  For the limit reading, I should emphasize how it explains Aristotle's acceptance of compensated activities with natural endpoints (like wages for labor or fees for services) versus interest which has no endpoint. This creates a coherent framework.

  The hardest textual challenge is Aristotle's explicit "money born of money" statement. I'll need to argue this is metaphorical - emphasizing endlessness rather than literal sterility. The "unnatural" charge follows from this endlessness, not biological impossibility.

  I should note that while the limit reading is strong, Aristotle does seem committed to some natural teleology, so completely dismissing the biological dimension might be going too far. But the user's reading makes Aristotle more relevant to modern economic concerns about endless accumulation.

