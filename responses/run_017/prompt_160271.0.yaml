  Okay, the user is teaching a formal epistemology seminar and needs a lesson plan for introducing imprecise probabilities in a single 75-minute slot. They've tried before but struggle with certain points, especially an economist friend's objection that imprecision is just uncertainty about a model parameter. The students are familiar with sharp probabilities and Bayesian conditioning but new to imprecision. 

  First, I need to understand the core challenges. The user mentions botching the explanation every time, specifically around the economist's objection. The key is to structure the lesson so that this objection doesn't undermine the motivation for imprecise probabilities. The students also confuse intervals with sets of probabilities, and the updating non-commutation needs to be presented as a feature, not a bug.

  The user wants a single running example that can illustrate multiple points. They're considering whether to include dilation and how to handle choice rules. They also listed several misconceptions: imprecision as a sharp higher-order distribution, midpoint fallacy, evidence always shrinking intervals, permissivism, and conflating choice rules.

  Hmm, the sequence is crucial. Starting with Ellsberg seems necessary to motivate the problem. Without that, the economist's objection might derail things. But the user is worried about losing time. Balancing motivation and mechanics is tricky. The urn example should come first to show that standard Bayesianism can't handle ambiguity aversion.

  For the running example, a medical decision with ambiguous test reliability could work. It needs to show that imprecision isn't resolvable by more data, that averaging gives different results, and possibly dilation. Dilation should be included but later, after basic updating, to show it as a feature. The example must avoid being resolvable by a higher-order prior, so the reliability should be fundamentally unknowable.

  The distinction between intervals and sets must come right after defining the credal set. Show how intervals for A and B don't determine the interval for A∨B. Use the example to demonstrate the set's constraints.

  Updating should follow, showing that conditioning the set vs. using a choice rule first can differ. This non-commutation is structural. Then introduce dilation with the same medical example—learning the test result widens the disease probability interval.

  For misconceptions: Address the economist's objection after presenting Ellsberg but before defining the credal set. Use the urn to argue that a higher-order prior forces arbitrary precision. Present choice rules, but only focus on Γ-maximin as the default. Mention others exist but don't dive in. Reject permissivism by emphasizing that the set represents unresolved ambiguity, not freedom to choose.

  Avoid conglomerability, behavioral foundations, or detailed comparison of choice rules. The last question should force recognizing that the set doesn't induce a distribution over itself—ask why we can't just take expectations over the credal set. The answer should highlight that the set captures fundamental uncertainty, not quantifiable higher-order uncertainty.
answer: |-
  Here's a battle-tested sequence optimized for 75 minutes, designed to preempt misconceptions and leverage your economist friend's predictable objection. The structure prioritizes motivation, distinguishes core concepts early, and uses a single integrated example to build complexity incrementally.

  **Core Sequence & Dependencies:**
  *(Total: 75 min)*

  1.  **Motivation First: The Ellsberg Paradox (Urns) (15 min)**
      *   **Why:** *Start with the empirical failure of sharp Bayesianism.* Present the 2-urn setup clearly. Elicit choices: Ambiguity aversion is the data point you *explain*, not the concept you *assume*.
      *   **Key Step:** Show rigorously that *no* sharp prior over the ambiguous urn's composition can simultaneously rationalize both common choices (avoiding the ambiguous red draw AND avoiding the ambiguous black draw) under EU maximization. *This is crucial.*
      *   **Dependency:** This *must* come first. Without this, the economist's objection ("just use a sharp higher-order prior!") seems plausible. Ellsberg shows it *isn't* just ignorance quantifiable by a prior; it's resistance to such quantification. This motivates the *need* for a different formalism.
      *   **Preempting:** *Plant the seed here:* "Could a sharp distribution over the proportion of red balls in Urn 2 explain this? Let's see... [Calculate] No. This choice pattern violates the Law of Total Probability applied to any sharp higher-order prior. The uncertainty feels *different*."

  2.  **The Core Concept: Sets, Not Intervals (15 min)**
      *   **Definition:** Introduce the **credal set** (𝓒) – a (convex) set of probability functions compatible with the agent's evidence/state of ignorance.
      *   **Imprecision ≠ Interval:** Immediately emphasize: **An imprecise credence is 𝓒, *not* an interval.** An interval for `A` (`[P̲(A), P̄(A)]`) is a *consequence* (lower/upper probability: P̲(A) = min{P(A) | P ∈ 𝓒}, P̄(A) = max{P(A) | P ∈ 𝓒}), **not** the primitive object.
      *   **Why Distinction First?** To prevent the "intervals are the object" misconception *before* it forms. Students seeing intervals first inevitably slip into thinking they define the state.
      *   **Demonstrate Dependency:** Show why intervals alone are insufficient. Use a simple example with propositions `A`, `B` (mutually exclusive? independent? unspecified). Show that knowing `[P̲(A), P̄(A)]` and `[P̲(B), P̄(B)]` does *not* determine `[P̲(A∨B), P̄(A∨B)]` or `[P̲(A∧B), P̄(A∧B)]`. *Only the full set 𝓒 captures the probabilistic relationships and constraints.* Calculate `P̲(A∨B)` = min{P(A)+P(B) | P∈𝓒} vs. `P̲(A) + P̲(B)` – they differ! This hammers home the need for the set structure.
      *   **Address Economist Now:** After defining 𝓒, explicitly counter the objection: "Is 𝓒 just representing uncertainty about a 'true' sharp probability? **No.** While a higher-order distribution *induces* a set (its support/bayes net), the converse isn't true. A set 𝓒 represents *unresolved ambiguity* where the agent cannot (or will not) form a precise higher-order distribution. Ellsberg shows agents treat this differently. The set is the primitive commitment to indeterminacy."

  3.  **The Running Example: "Dr. Smith's Diagnostic Dilemma" (Introduced here, used throughout) (5 min setup)**
      *   **What it is:** A patient presents with Symptom S. Dr. Smith considers Disease D.
      *   **Imprecision Source:** There's a new, poorly understood Test T.
          *   *Known:* If patient has D, T is positive (P(T+|D) = 1).
          *   *Unknown/Ambiguous:* If patient does *not* have D, the **false positive rate (FPR)** `θ` of T is unknown. Dr. Smith only knows `θ` is *somewhere* between 0.1 and 0.7 based on limited, conflicting preliminary studies. She cannot form a sharp prior over `θ`; the reliability is fundamentally ambiguous.
      *   **Why it works:**
          *   **Not Merely Ignorance:** More evidence (running T) won't resolve the ambiguity *about θ itself* (the test's fundamental reliability in non-D cases). It only provides data *conditional* on whatever `θ` is.
          *   **Averages Differ:** Averaging over `θ ∈ [0.1, 0.7]` leads to different decisions than imprecise rules.
          *   **Dilation-Ready:** Learning `T+` will cause dilation for `P(D)`.
          *   **Parametric Ambiguity:** Directly counters the economist by making the ambiguity *about a parameter in the likelihood*, not just the prior.
      *   **Setup:** Define base rate `P(D)` sharply (e.g., 0.05 from reliable epidemiology) for simplicity initially. Define 𝓒: All distributions agreeing with `P(D)=0.05` and `P(T+|D)=1`, but with `P(T+|¬D) = θ` for some `θ ∈ [0.1, 0.7]`. Calculate initial `[P̲(D), P̄(D)]` = [0.05, 0.05].

  4.  **Updating (Conditioning) & Non-Commutation (15 min)**
      *   **General Rule:** Conditioning each `P ∈ 𝓒` on evidence `E` yields the updated set `𝓒|E = {P(·|E) | P ∈ 𝓒, P(E) > 0}`.
      *   **Apply to Example:** Patient gets Test T, and it's **Positive (`T+`)**.
          *   Calculate `P(D|T+)` for a fixed `θ`: `P(D|T+) = P(D)P(T+|D) / [P(D)P(T+|D) + P(¬D)P(T+|¬D)] = 0.05 * 1 / [0.05*1 + 0.95*θ] = 0.05 / (0.05 + 0.95θ)`
          *   Find `𝓒|T+`: As `θ` ranges over [0.1, 0.7], `P(D|T+)` ranges over [≈0.07 (θ=0.7), ≈0.34 (θ=0.1)]. So `[P̲(D|T+), P̄(D|T+)] ≈ [0.07, 0.34]`.
      *   **Non-Commutation - The Structural Feature:** Emphasize *this is central*.
          *   "Option 1: Update (condition 𝓒) *then* apply a decision rule to `𝓒|T+`."
          *   "Option 2: Apply a decision rule to the unconditional 𝓒 *first*, *then* condition the chosen `P`."
          *   **Crucial Point:** *These procedures generally yield different results!* This isn't a bug; it's a feature reflecting how ambiguity interacts with evidence. Updating the set keeps the ambiguity relevant after learning. Choosing a single `P` first pretends the ambiguity is resolved before learning. The mechanics *show* this divergence inherently.
      *   **Dilation Here (Yes, Include It!)** (5 min of the 15 above):
          *   **Reveal Dilation:** Point out the initial interval for `D` was [0.05, 0.05] (sharp 0.05). After learning `T+`, it's [0.07, 0.34]. **The interval *widened* despite gaining evidence (`T+`). This is Dilation.**
          *   **Land the Point:** "Dilation occurs because the evidence (`T+`) is *itself* more ambiguous when `D` is false (high, uncertain `θ`). Learning ambiguous evidence *increases* overall uncertainty about `D` under imprecise probabilities. This is a consequence of the structure, not an error. It reflects how ambiguity propagates."
          *   **Preempt Panic:** Normalize it: "This seems counterintuitive if you expect evidence to always reduce uncertainty. But recall Ellsberg: ambiguity is different. Dilation captures how ambiguous evidence can *increase* your overall uncertainty state by making the ambiguity salient and relevant to the hypothesis." Connect it to the test's unreliable FPR.

  5.  **Decision Rules (Γ-Maximin as Default) (10 min)**
      *   **The Problem:** We have 𝓒. How do we choose between acts? Sharp EU fails (Ellsberg).
      *   **Present Γ-Maximin (Default):** Choose the act that maximizes the *minimum* expected utility over 𝓒. "Protect yourself against the worst plausible scenario given the ambiguity." Relate directly to ambiguity aversion in Ellsberg (choosing the urn with known probabilities avoids the worst-case composition).
      *   **Contrast with Averaging:** Show briefly in the medical example: The average `P(D|T+)` over `θ` (say, uniform) is ≈0.17. Γ-Maximin (if treatment has high cost/risk if not D) might prefer *not* treating if the worst-case `P(D|T+)` (≈0.07) makes EU too low, while averaging might suggest treat. Emphasize Γ-Maximin *accepts* the unresolved ambiguity.
      *   **Mention Alternatives (Name & Decline Detail):** "Other rules exist: Γ-Maximax (optimistic), E-admissibility (choose acts optimal under *some* P ∈ 𝓒), Maximality (avoid dominated acts). These can disagree significantly. Γ-Maximin is often seen as capturing pure ambiguity aversion. We'll focus on it today; the key point is that *choice rules matter* and are distinct from just having 𝓒."
      *   **Explicitly Reject Permissivism:** "The credal set 𝓒 represents unresolved ambiguity, *not* permissivism (where multiple precise credences are rationally permissible). The decision rules (like Γ-Maximin) define how to act *given* the unresolved ambiguity represented by 𝓒. You don't just 'pick one and be Bayesian'; the ambiguity constrains your decision globally."

  6.  **Recap & The Final Litmus Test (5 min)**
      *   **Recap:** Ellsberg shows the need → Sets (𝓒), not intervals, capture imprecision → Updating 𝓒 keeps ambiguity relevant (Non-Commutation, Dilation) → Decisions require rules like Γ-Maximin.
      *   **The Litmus Test Question:** (Pose this clearly) **"Suppose we have our credal set 𝓒 representing imprecise credences. Why can't we simply define a new, sharp 'higher-order' probability distribution *over the set 𝓒 itself*, treat *that* as our sharp belief state, and just do standard Bayesian decision theory with it? Wouldn't that give us a single expected utility for each act and solve all our problems?"**
          *   **Why it works:** This forces them to confront the *conceptual* distinction. The correct answer hinges on recognizing that 𝓒 represents *fundamental indeterminacy*. Creating a sharp distribution over 𝓒 would be an *additional commitment* to a precise quantification of the ambiguity that the agent explicitly *lacks* (as per the setup of 𝓒). It falsely pretends the ambiguity is resolvable into risk. It violates the motivation from Ellsberg (where such quantification leads to violations of the choice patterns). It would also collapse dilation and non-commutation, eliminating the phenomena the model captures. The set 𝓒 is the model of the doxastic state; putting a distribution *on it* changes the model fundamentally.

  **Explicitly Avoid (Time Constraints & Focus):**
  *   Detailed axiomatic foundations (e.g., Walley's coherence, Williams-DC).
  *   Conglomerability paradoxes (mention it exists if asked, but defer).
  *   Deep dives into alternative decision rules beyond Γ-Maximin & the brief contrast. No time for Maximality/E-admissibility calculations.
  *   The "Dempster-Shafer vs. IP" debate.
  *   Objective Bayesian interpretations of IP.
  *   Computing complex credal sets in practice.

  **Why This Sequence Works:**
  1.  **Motivation Anchors Everything:** Ellsberg makes the need undeniable before formalism begins, inoculating against the economist.
  2.  **Conceptual Foundation Early:** Defining 𝓒 explicitly and distinguishing it from intervals prevents major misconceptions from taking root.
  3.  **Integrated Example:** "Dr. Smith" efficiently demonstrates key features (imprecision source, updating, non-commutation, dilation, decision rule contrast) without cognitive overload from switching contexts. Dilation is included *within* the updating section where it naturally arises, presented as a structural consequence.
  4.  **Preemption Pipeline:** The sequence anticipates and addresses misconceptions at the point they are most likely to arise:
      *   Economist (Parametric Uncertainty): After Ellsberg & during 𝓒 definition.
      *   Intervals=Set: Crushed immediately after defining 𝓒 with dependency example.
      *   Permissivism: Explicitly rejected when introducing decision rules.
      *   Midpoint Fallacy: Undermined by showing intervals are derived and dependency, solidified by Γ-Maximin using min/max, not midpoint.
      *   Evidence Always Shrinks: Directly countered by integrating dilation naturally into the updating step.
      *   Choice Rules Cosmetic: Briefly shown false by contrasting Γ-Maximin with averaging, others named as distinct but deferred.
  5.  **Litmus Test:** The final question directly probes the deepest conceptual hurdle (set vs. distribution over set) in a way that requires synthesis.

  Stick ruthlessly to the timings. Use the medical example for *all* calculations after its introduction. Good luck with the economist! This plan gives you the tools to firmly distinguish IP from higher-order sharp probabilities.
