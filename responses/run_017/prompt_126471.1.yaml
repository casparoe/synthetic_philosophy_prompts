answer: |-
  Here is a specification of requirements for ranking land-use trajectories by expected net welfare, motivated by your concerns:

  **Requirements for Net Welfare Accounts (Ranking Land-Use Trajectories)**

  1.  **Distinguish Stock vs. Throughput:** *Motivation:* High-turnover populations (e.g., insects, small birds) have vastly more lives lived per unit time than low-turnover ones (e.g., ungulates) for the same standing biomass. Focusing only on extant individuals at a snapshot misrepresents total welfare experienced. *Status:* **Non-negotiable.** An account must specify *what* it aggregates (lives-at-a-time or lives-lived-over-time?).
  2.  **Decompose Extensive/Intensive Margins:** *Motivation:* Habitat loss reduces area (extensive margin, fewer lives) but alters density-dependent welfare per life in remaining habitat (intensive margin). These can trade off (e.g., fragmentation might increase per-capita predation stress even as numbers fall). *Status:* **Non-negotiable.** An account must be decomposable to understand drivers. Reporting totals alone hides crucial dynamics.
  3.  **Method Insensitivity (Outcome Focus):** *Motivation:* The welfare outcome depends on the resulting population dynamics and individual experiences (e.g., stress levels, resource access), not the *means* (cull vs. contraception vs. bulldozer) used to achieve a specific trajectory endpoint. *Status:* **Preference (Welfarist Purity).** Some argue method *intrinsically* matters (e.g., violence vs. non-violence), even if outcomes are identical.
  4.  **Include Replacement Community:** *Motivation:* Cleared land isn't barren; it holds synanthropic wildlife or agriculture (livestock, crops, humans). A trajectory's net welfare must encompass the welfare of *all* sentient beings occupying the land over time, not just the displaced community. *Status:* **Non-negotiable.** Ignoring replacement falsely isolates the intervention.
  5.  **Define Temporal Scope & Discounting:** *Motivation:* Trajectories unfold over decades/centuries (regeneration, climate shifts). Must the account sum over infinite time? Is discounting future welfare permissible? Can distant, uncertain futures dominate? *Status:* **Preference (Pragmatism vs. Purity).** Non-negotiable that scope must be defined; *how* is contested. Infinite sums risk domination by speculative futures; discounting is ethically fraught.
  6.  **Scope Limitation (Sentience Threshold):** *Motivation:* Throughput is dominated by invertebrates. If many lack sentience, including them swamps the signal. Excluding them requires a defensible criterion. *Status:* **Preference (Epistemic/Prudential).** Principled if based on sentience evidence, special pleading if arbitrary. Non-negotiable that scope must be justified.
  7.  **Tractability Constraint:** *Motivation:* Ecological data is limited (densities, vital rates, habitat proxies). Pure welfare accounts may require unknowable individual experiences. *Status:* **Preference (Pragmatism).** Non-negotiable that the account must be *operationalizable* for ranking; demanding perfect data renders it useless. Proxies must be justified as welfare correlates.
  8.  **Handle Potential Net Negative Welfare:** *Motivation:* If wild lives are suffering-dominated, reducing them might reduce net suffering. The account shouldn't *assume* net positivity. *Status:* **Non-negotiable.** The account must be receptive to evidence on welfare valence, not pre-committed to protection or destruction.
  9.  **Decision Rule Under Uncertainty:** *Motivation:* Ecological predictions are highly uncertain. Should the account output an expected value ranking, or a precautionary principle (avoid potential large negatives)? *Status:* **Preference (Decision Theory).** Non-negotiable that uncertainty must be addressed; *how* is debated (maximin vs. expected utility).
  10. **Resistance to Extinction Implication:** *Motivation:* If net welfare is negative, the account implies non-existence is preferable for some species/populations. Is this a logical implication to accept, or a reductio ad absurdum showing the account is flawed? *Status:* **Preference (Moral Intuition).** A good welfarist account must follow its logic; resisting this might indicate non-welfarist commitments.

  **Suspected Conflicts:**
  *   **Purity (full sentient welfare) vs. Tractability (using available data):** Likely incompatible. Perfect purity needs impossible individual welfare data.
  *   **Additivity over Infinite Time vs. Immunity to Far-Future Domination:** Incompatible. Infinite sums make the ranking hypersensitive to speculative long-term predictions.
  *   **Decomposability (Req 2) & Tractability (Req 7):** Decomposing margins requires complex modeling, conflicting with tractability.

  **Most Exclusionary Requirement:** **Include Replacement Community (Req 4).** Many "wild-centric" accounts fail this by ignoring synanthropes or livestock.

  **Compact Scorecard of Positions:**

  | Requirement                              | Wild Lives Positive | Wild Lives Negative | Wildness Value | Deep Uncertainty |
  | :--------------------------------------- | :------------------ | :------------------ | :------------- | :-------------- |
  | 1. Stock/Throughput Distinction          | ? (Often ignores)   | ? (Often ignores)   | N/A            | N/A             |
  | 2. Decompose Extensive/Intensive Margins | ? (Rarely)          | ? (Rarely)          | N/A            | N/A             |
  | 3. Method Insensitivity                  | ✓                   | ✓                   | ✗ (May value method) | ✓               |
  | 4. Include Replacement Community         | ✗ (Focus wild)      | ✗ (Focus wild)      | ✗ (Focus wild) | ✓               |
  | 5. Defined Temporal Scope                | ? (Varies)          | ? (Varies)          | ✓              | ✓               |
  | 6. Sentience Scope Limitation            | ? (Often broad)     | ? (Often broad)     | ✗ (Biocentric) | ✓ (Cautious)    |
  | 7. Tractability Constraint               | ✓ (Uses proxies)    | ✓ (Uses proxies)    | ✓ (Uses proxies) | ✓               |
  | 8. Handle Net Negativity                 | ✗ (Assumes +)       | ✓                   | ✗ (Non-welfare) | ✓               |
  | 9. Decision Rule (e.g., Expected Value)  | ? (Varies)          | ? (Varies)          | ? (Varies)     | ✗ (Precaution)  |
  | 10. Accept Extinction Implication        | ✗                   | ✓                   | ✗              | ? (Avoids)      |
  | **Overall Alignment**                    | **Low**             | **Medium**          | **Low**        | **High**        |

  *✓ = Typically Satisfied, ✗ = Typically Not Satisfied, ? = Variable/Unclear, N/A = Not Applicable*

  **Names (Confident):** Position 3 often aligns with certain **Non-Animal Welfarists** (e.g., Routley/Sylvan, some Deep Ecologists). Position 4 aligns with **Epistemic Precaution** or **Anti-Consequentialism**.

  **Least Confident Requirement as Genuine:** Requirement 10 (Resistance to Extinction Implication) feels most like a **Preference** (moral intuition) rather than a logical necessity for the account's internal coherence for ranking.

  **If Forced to Abandon One:** Requirement 3 (Method Insensitivity). While philosophically important for pure welfarism, for *practical ranking of trajectories defined by outcomes*, the means might be secondary if endpoints are identical.

  **Most Impactful Empirical Finding:** **Strong evidence of widespread negative welfare in wild vertebrates** would make Req 8 and 10 critically important and undermine Position 1 fundamentally. Conversely, **robust evidence for minimal sentience in most invertebrates** would drastically simplify Req 6 and ease the Tractability/Purity conflict.
