answer: |-
  ## Proposal: The Window Problem for Causation by Omission

  **1. The Question: When and Which Omission? (Approx. 250 words)**

  The central, unresolved question for this chapter is: **How are the temporal boundaries and individuation conditions for omissions determined?** Unlike events, omissions (like failing to water a plant) lack intrinsic spatiotemporal properties. An action occurs over a specific duration; an omission seems pervasive. The core puzzle arises when we ask: *When* did the omission occur? (Did it begin when the agent first *could* have acted? When they *should* have? Only when action became *necessary*? Did it end when the opportunity passed or the harm manifested?) And, *which* omission is it? (If the agent eventually acts on Tuesday, was there still an omission *on Monday*, or does the subsequent action negate it?) Standard debates about omissions focus on whether absences *can* cause, possess causal powers, or be represented in models. However, these debates presuppose a settled answer to "which omission?" and "when did it occur?", treating omissions as discrete, identifiable entities analogous to events. This chapter contends that this presupposition is false and that the inability to intrinsically fix the temporal window ("from when to when?") and the identity ("which possible action's absence?") of an omission is the primary source of persistent puzzles. The determinate question is: **Can the temporal extent and specific identity of an omission be grounded solely in non-normative, mind-independent facts, or are they necessarily settled by external factors like practical context, expectations, or norms?**

  **2. Why Existing Positions Leave It Open (Approx. 350 words)**

  Existing treatments of causation by omission fail to directly confront or adequately resolve the window problem:
  *   **Metaphysical Objections (No Mechanism/Positive Cause):** Critics arguing omissions lack "oomph" or are not genuine events focus on the *absence* of a positive entity. While they highlight the lack of intrinsic spatiotemporal location, they don't delve into the *consequences* of that lack for pinning down *which specific absence* over *which specific period* is causally relevant. They leave open *how* we identify the omission causing harm.
  *   **Interventionist/Causal Modeling Approaches:** Proponents successfully model omissions as variables set to a "default" or "non-occurrence" value. However, this approach *presupposes* a solution to the window problem by implicitly defining the relevant temporal frame and the specific action type whose absence is modeled. The choice of variable (e.g., "Watering on Monday", "Watering during week", "Providing necessary care") inherently encodes a specific temporal window and individuation condition. The framework works *given* a window, but it doesn't explain *how* that window is non-arbitrarily determined, masking the core issue.
  *   **Legal/Normative Discussions:** Legal doctrines often require a pre-existing duty before liability attaches to an omission. This acknowledges the contextual nature of omissions but typically frames it as a requirement for *causal responsibility*, not as solving the prior metaphysical problem of identifying *which omission* even *exists* over *which time*. The duty helps select *which* omission matters legally, but doesn't explain the underlying individuation challenge itself. The literature largely assumes omissions can be individuated like events ("the failure to water *on Monday*") without explaining the basis for this individuation when the omission lacks intrinsic boundaries.

  Consequently, the fundamental question of *how omissions get their specific temporal identity* remains unaddressed, leaving a gap in our understanding of their causal role.

  **3. What I Would Do, and In What Order (Approx. 350 words)**

  The chapter will rigorously develop and test the hypothesis that omissions lack intrinsic temporal boundaries or identity conditions and that these are settled by external factors ("the window"). The work will proceed systematically:

  1.  **Articulate the Window Problem:** Precisely define the challenge using paradigmatic cases (like the plant-watering scenario) to illustrate the indeterminacy of "when?" and "which?". Contrast this with the determinate spatiotemporal properties of positive events. (Month 1-2)
  2.  **Analyze Metaphysical Objections:** Re-examine arguments against omissions as causes (lack of mechanism, locality, transitivity issues). Argue that the core intuition fueling these objections stems *not* from the lack of a positive entity *per se*, but from the inability to locate that entity *in time and space* and distinguish *this specific absence* from others. Show how reframing the problem in terms of window-sensitivity demystifies these objections. (Month 3)
  3.  **Critique Interventionist Models:** Demonstrate how causal models of omissions inevitably embed a chosen temporal window and individuation criterion within the variable definitions and scope of the model. Argue that while useful for evaluating causal dependence *given a window*, these models *stipulate* rather than *explain* the identity conditions for omissions, potentially obscuring the underlying metaphysical issue. (Month 4-5)
  4.  **Examine the Causing/Allowing Distinction & Legal Duty:** Investigate whether the intuitive and legal distinction between causing harm and merely allowing it, particularly the requirement for a duty in omission liability, is best understood as a response to the window problem. Argue that the duty (or normative context) serves to *fix the relevant window* ("from when you had the duty") and *individuate the omission* ("the failure to fulfill *that specific duty*"), rather than primarily marking a difference in causal structure or efficacy. (Month 6-7)
  5.  **Assess Implications & Defend the Hypothesis:** Synthesize findings, evaluate whether window-sensitivity adequately explains the persistent puzzles, and defend the claim that omissions' temporal and identity conditions are fundamentally context-dependent. Address potential counterarguments (e.g., attempts to ground windows intrinsically). (Month 8-9)

  **4. What Would Count as Success, and What Would Count as Failure (Approx. 250 words)**

  *   **Success:** The project succeeds if it convincingly demonstrates: (1) that the inability to intrinsically fix the temporal window and identity of omissions is a genuine, underappreciated problem distinct from debates about absence causation; (2) that reframing traditional objections (lack of mechanism) in terms of this problem offers a clearer diagnosis; (3) that interventionist models implicitly rely on stipulating the window; and (4) that the legal/normative context of "duty" can be plausibly interpreted as providing the necessary framework for individuation. Success means establishing window-sensitivity as a crucial, distinct feature of omissions demanding attention in any complete account of causation by omission. The deliverable for non-metaphysicians would be a novel perspective on the causing/allowing distinction and legal liability.
  *   **Failure:** The project fails if: (1) It cannot compellingly show that omissions genuinely lack intrinsic temporal identity (e.g., if a robust intrinsic account is defensible). (2) The proposed reinterpretations of existing positions (metaphysical objections, interventionism, legal duty) are found to be implausible or uncharitable. (3) The "window" concept proves explanatorily inert, failing to illuminate existing puzzles better than existing frameworks. (4) The hypothesized link between normative context and metaphysical individuation is severed, showing that duties operate purely on responsibility without fixing the omission's identity. Failure would occur if the core hypothesis proves inadequate or if the identified problem dissolves upon closer scrutiny.

  **5. Why This Angle Rather Than the Obvious Alternatives? (Approx. 200 words)**

  The obvious alternatives focus on *whether* omissions can be causes or *how* they fit into causal models/metaphysics. This proposal argues these approaches *presuppose* an answer to the prior, more fundamental question of *how omissions are individuated in time*. Addressing the "window problem" is necessary *before* we can definitively answer whether "an omission" caused something, because we need to know *which omission* we are referring to and over *which period*. Focusing on traditional metaphysical debates (can absences cause?) or modeling techniques (can variables represent non-events?) bypasses this constitutive issue. This angle is novel because it shifts the locus of the problem from the *nature* of causation or absence to the *individuation criteria* of the omission itself. It promises a unifying perspective, showing how the window-sensitivity underlies objections from metaphysics, limitations in modeling, and nuances in normative practice like the law, offering a more foundational understanding of why omissions are philosophically and practically perplexing.
