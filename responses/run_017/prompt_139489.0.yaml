prompt: |-
  I'm in the middle of a PhD (political theory, working on a chapter about the fiduciary/trust framing of humanitarian intervention) and I keep going back and forth on whether the trusteeship model actually earns its keep on Libya 2011, or whether it just restates the ordinary R2P critique in fancier vocabulary. I want you to run the case through it properly, both directions.

  Here's the version of the model I've been defending, so we're using the same one. On this view, coercive humanitarian intervention is a *fiduciary power*: the intervener is a trustee of the protected population, holding powers it may exercise only for that population's benefit and never for its own. The incidents I care about are: (1) a duty of loyalty/no-conflict -- the mandate can't be used to advance the intervener's own security, credibility, or domestic-political interests, or to settle a civil war on the side the intervener prefers; (2) a duty not to exceed the mandate's purposes, where the purposes are fixed by the authorization, not by the trustee's own judgment of what would be best; (3) a duty of care and repair, scaled to what the trustee foreseeably breaks -- so the responsibility to rebuild isn't an add-on, it's part of what makes the intervention legitimate in the first place; (4) a duty of impartiality among rival factions of the beneficiary population; (5) a duty to render an account and to exit only when the trust purposes are actually fulfilled, not when the trustee gets tired.

  The case (you know it, but pinning the facts so we don't talk past each other): Resolution 1973 was adopted 17 March 2011 under Chapter VII, ten in favour and five abstentions including Brazil, Germany, India, China and Russia; it demanded a ceasefire, imposed a no-fly zone, and authorised all necessary measures to protect civilians and civilian-populated areas under threat of attack, expressly excluding a foreign occupation force of any form on any part of Libyan territory. Gaddafi's forces were at the gates of Benghazi and he had said publicly that they were coming that night with no mercy. NATO took command on 31 March; what began as protecting Benghazi became a campaign that decided the civil war; Gaddafi was killed in October; the operation wound down with no reconstruction commitment, militia fragmentation, a second civil war from 2014, and reports of open slave markets by 2017. Factually none of that is controversial, so don't spend words re-establishing it.

  What I want is the disciplined mapping. Who exactly is the trustee here (NATO? the coalition? individual states?), who is the beneficiary ("civilians under threat of attack" versus the Libyan people as a whole versus whoever ends up holding power), what is the trust property, and what in that sequence counts as breach of which incident. Then: does the model actually explain anything the standard "mission creep" / "R2P as cover for regime change" story doesn't -- especially the abstentions, which look a lot like foresight about loyalty and about exit -- and where does it misdescribe the case? My worry is that it forces a clean principal-beneficiary structure onto a situation where the whole problem was that no one could say who the beneficiary was once the air campaign started deciding the war, and that the fiduciary framing quietly smuggles in a verdict about regime change by definitional fiat rather than argument.

  And then the other direction: is Libya a confirmation of the model, an anomaly, or a case it was never built for? Be honest if the model is silent somewhere -- my three candidate silences are (a) multi-trustee collective action when there's no single will to hold to a duty, (b) the absence of any forum in which the account is rendered, i.e. a beneficiary with no standing to sue, and (c) the fact that the hardest decision, when to leave, is precisely the one the fiduciary duty language leaves underdetermined. If you think there's a worse one, say so.

  One test I'd like you to apply: run Kosovo 1999 through the same model in a short paragraph at the end. If your version of the trusteeship framing ends up condemning the unauthorized NATO action in Kosovo as straightforwardly as it condemns what happened in Libya, I think it's collapsing into just a general theory of when war is permissible and I should cut it from chapter three -- tell me if that's what's happening.

  Keep it argumentative and specific rather than survey-like, and please don't pad it out with citations or a reading list -- I can find those myself, and its the mapping I'm stuck on. Not looking for a balanced overview, I want you to take a position on whether this model survives Libya.
reasoning: |-
  Okay, the user is deep into their PhD in political theory, specifically working on a chapter about the fiduciary model for humanitarian intervention. They're wrestling with whether this model adds real value to the analysis of Libya 2011 or if it's just dressing up standard R2P critiques in fancier terms. Their core concern is whether the model can withstand the complexities of the Libya case without collapsing into circular reasoning about regime change.

  First, I need to unpack their version of the fiduciary model. They've outlined five key incidents: loyalty/no-conflict, mandate adherence, care/repair, impartiality, and accounting/exit. The Libya case is their stress test - they want to see if these fiduciary duties reveal something new beyond the usual "mission creep" narrative. 

  The user's anxiety is palpable here. They're worried the model might be forcing a neat principal-beneficiary structure onto a messy reality where beneficiaries became ambiguous once NATO started tipping the civil war. There's also a methodological concern - does the fiduciary framing secretly bake in conclusions about regime change by definition? 

  Hmm, the Kosovo comparison at the end is clever. They're setting a trap: if the model condemns both Libya and Kosovo equally, it loses distinction and just becomes generic jus ad bellum analysis. That would mean cutting it from their chapter. High stakes.

  Let me tackle the mapping systematically. Trustee identification is tricky - is it NATO? The coalition? Individual states? The UNSC authorized but didn't control, while NATO executed with operational autonomy. For beneficiaries, the resolution specifies "civilians under threat" but that blurred fast when Benghazi was saved and rebels became de facto beneficiaries. The trust property is the coercive power itself - the right to bomb and impose no-fly zones.

  Now for breaches: Duty of loyalty fails because France/UK/US had clear interests in removing Gaddafi (oil, regional influence, domestic politics). Mandate adherence collapsed when protection became offensive support for rebels. Care/repair was abandoned entirely - no serious rebuilding effort. Impartiality? Destroyed by picking sides in the civil war. Accounting/exit was a farce with no transition plan. 

  Does this reveal more than standard critiques? Yes - the abstentions look like foresight about fiduciary failures, particularly Russia/China anticipating mandate overreach and lack of exit planning. The model also exposes how "protection" became morally corrupted by self-interest, which pure R2P analysis sometimes misses.

  But weaknesses emerge: The model can't resolve who beneficiaries are when populations fracture. It's silent on collective action problems in multi-trustee scenarios (NATO's divided responsibilities). There's no enforcement mechanism - no court for beneficiaries. And crucially, it offers no guidance on when exit should happen, which was Libya's fatal flaw.

  Kosovo test: Here the fiduciary model interestingly doesn't condemn Kosovo outright. Though unauthorized, NATO stayed narrowly focused on protection, didn't pursue regime change overtly, maintained relative impartiality among Kosovans, and committed to postwar governance. The condemnation is softer, showing the model isn't just repackaged jus ad bellum.

  Verdict for the user: The model survives Libya but with injuries. It explains the abstentions' foresight and the moral corruption of "protection" better than standard critiques, but struggles with collective trusteeship and exit timing. Most importantly, it doesn't automatically equate regime change with breach - context matters. Worth keeping in Chapter 3, but needs wrestling with multi-trustee dynamics and exit criteria.
answer: |-
  Here's the disciplined mapping you requested, arguing that the fiduciary model **survives Libya but with critical injuries** - exposing nuances standard critiques miss, while revealing structural flaws in the model itself.  

  ### Mapping Libya 2011 to the Fiduciary Model  
  1. **Trustee Identification:** Ambiguous, but **operationally NATO** (executing coalition actions under unified command). The UNSC authorized but did not control; states delegated power without establishing a clear fiduciary agent. This *collective action gap* is fatal to accountability.  
  2. **Beneficiary:** Resolution 1973 defines it as **"civilians under threat of attack"** (para. 4). However, once NATO’s air campaign began degrading Gaddafi’s military capacity, de facto beneficiaries became the **anti-Gaddafi rebels** (NATO’s operational partners). The model requires a fixed beneficiary *ex ante*, but Libya shows this dissolves when intervention morphs into civil war participation.  
  3. **Trust Property:** The **coercive power authorized by UNSC 1973** (no-fly zone, force to protect civilians).  

  ### Breach of Fiduciary Incidents  
  - **Duty of Loyalty/No-Conflict (Breached):** France/UK/US instrumentalized the mandate for regime change (Sarkozy’s domestic politics, Clinton’s "we came, we saw, he died"). Oil interests and regional influence (Qatar/UAE backing specific militias) further corrupted loyalty.  
  - **Duty of Mandate Adherence (Breached):** Protection became **offensive air support for rebel advances** (e.g., siege of Sirte). The exclusion of "occupation" was circumvented by outsourcing ground operations to local militias, exceeding the protective purpose.  
  - **Duty of Care/Repair (Breached Catastrophically):** No serious rebuilding plan existed. NATO’s destruction of Libyan state infrastructure (e.g., command centers) created a vacuum filled by militias. Foreseeable collapse was ignored; repair wasn’t merely omitted, it was *structurally excluded* from the trust’s design.  
  - **Duty of Impartiality (Breached):** By enabling rebel victory, NATO privileged one faction of Libyans over others (pro-Gaddafi tribes, neutral civilians). The model’s insistence on impartiality becomes incoherent when the intervention *creates* a new political reality.  
  - **Duty to Account & Exit (Breached):** Exit occurred when NATO achieved its *de facto* objective (Gaddafi’s death), not when civilians were secure. No meaningful account was rendered to Libyans or the UNSC.  

  ### Does the Model Earn Its Keep?  
  **Yes, in three ways standard critiques miss:**  
  - **The Abstentions as Fiduciary Foresight:** Brazil/Russia/China explicitly warned of *mandate overreach* and *unaccountable regime change*. The model frames this not as realpolitik, but as **anticipation of breach of loyalty and purpose-limitation** – a trustee-risk assessment.  
  - **Moral Corruption of "Protection":** Standard "mission creep" describes *what happened*; fiduciary duty shows *why it violated the mandate’s fiduciary logic*. Protecting Benghazi was loyal; bombing Gaddafi’s convoy was self-serving regime change camouflaged as protection.  
  - **Repair as Legitimacy Condition:** The model makes post-intervention chaos (slave markets, civil war) a **direct breach of the original authorization’s legitimacy**, not an add-on. R2P critiques often treat "rebuild" as optional; fiduciary theory says no repair = illegitimate ex post.  

  **But the Model Misdescribes/Misses:**  
  - **Beneficiary Ambiguity:** Once civilians are "protected" by destroying the state, the beneficiary *cannot* be fixed. The model assumes a static beneficiary, but in dynamic civil conflicts, the trust dissolves into partisan politics.  
  - **Collective Action Failure (Your Silence #1):** With no single trustee (NATO operated via consensus), duties fractured. France pushed regime change; Germany abstained; Norway focused narrowly on protection. **Multi-trustee interventions lack a unified fiduciary will.**  
  - **No Forum for Accounting (Silence #2):** Libyans had no standing to demand accounting. The model presupposes a beneficiary capable of claiming breach – a fiction in international law.  
  - **Exit Underdetermination (Silence #3):** The model insists on "fulfilled purposes" but offers no metric. Was it when Gaddafi fell? When elections occurred? When slave markets emerged? **Fiduciary duty cannot resolve this indeterminacy**; it merely highlights the betrayal.  

  ### Libya: Confirmation, Anomaly, or Beyond Scope?  
  **A confirming anomaly.** It confirms the model’s diagnostic power for betrayal (breaches are starkly visible) but exposes its **structural naiveté**:  
  - It cannot resolve the **beneficiary problem** in factionalized societies.  
  - It has **no tools for multi-trustee coordination**.  
  - Its **exit criterion is vacuously idealistic** without a transition mechanism.  

  ### Kosovo 1999 Test: Does the Model Collapse?  
  **No.** Applying your model: Unauthorized intervention (no UNSC mandate) fails *mandate adherence* immediately. But contrast with Libya:  
  - Loyalty was less conflicted (no oil, minimal great-power interests);  
  - Purpose remained narrowly *protective* (no ground offensive, no pursuit of Milošević’s overthrow);  
  - Impartiality among Kosovar Albanians was upheld (no alliance with KLA offensives);  
  - Care/repair was partially fulfilled via UNMIK/KFOR institution-building.  
  **Verdict:** Kosovo breaches the model on *authorization* but satisfies *incidents 1,2,4* better than Libya. Fiduciary theory distinguishes **unauthorized but purpose-constrained interventions** from **authorized but corrupted ones**. It doesn’t collapse into generic jus ad bellum.  

  ### Survival Verdict  
  **Keep the model, but gut its idealism.** It survives Libya by exposing the *fiduciary betrayal* more precisely than R2P alone, revealing how loyalty and mandate adherence were corrupted from within. But its failures on collective trusteeship, beneficiary ambiguity, and exit criteria are fatal to its prescriptive utility. Use it in Chapter 3 as a **diagnostic tool for abuse**, not a blueprint for legitimacy. Libya proves that without enforceable mechanisms for accountability and repair, the fiduciary frame is a moral mirror, not a legal constraint.
