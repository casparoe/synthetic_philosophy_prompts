  Below is a constructed numerical case for a small-business line of credit decision. The institution uses a risk score to predict default (Y=1) or non-default (Y=0). Groups A (better-informed) and B (worse-informed) have identical base rates (P(Y=1) = 0.2) but differ in feature informativeness. Group A's features are precise (e.g., complete financial histories), while Group B's are noisier (e.g., sparse records due to systemic underreporting). This data gap is institutionally ingrained and not fixable in the short term.  

  ### **Score Distributions and Calibration**  
  Scores (1-4) are calibrated within groups: P(Y=1 | S=s, group) is consistent. Distributions:  

  | Group | Score (s) | P(S=s \| Y=0) | P(S=s \| Y=1) | P(S=s)         | P(Y=1 \| S=s) |
  |-------|-----------|---------------|---------------|----------------|---------------|
  | **A** | 1         | 0.6           | 0.0           | 0.6·0.8 = 0.48 | 0.0           |
  |       | 2         | 0.3           | 0.1           | 0.3·0.8+0.1·0.2 = 0.26 | 0.1·0.2/0.26 ≈ 0.0769 |
  |       | 3         | 0.1           | 0.3           | 0.1·0.8+0.3·0.2 = 0.14 | 0.3·0.2/0.14 ≈ 0.4286 |
  |       | 4         | 0.0           | 0.6           | 0.0·0.8+0.6·0.2 = 0.12 | 1.0           |
  | **B** | 1         | 0.3           | 0.0           | 0.3·0.8 = 0.24 | 0.0           |
  |       | 2         | 0.4           | 0.3           | 0.4·0.8+0.3·0.2 = 0.38 | 0.3·0.2/0.38 ≈ 0.1579 |
  |       | 3         | 0.3           | 0.4           | 0.3·0.8+0.4·0.2 = 0.32 | 0.4·0.2/0.32 = 0.25   |
  |       | 4         | 0.0           | 0.3           | 0.0·0.8+0.3·0.2 = 0.06 | 1.0           |

  **Calibration holds**: Within each group, P(Y=1 | S=s) is consistent with the score’s meaning (e.g., for Group A, S=2 implies ≈7.7% default risk).

  ---

  ### **4. ROC Curves and Dominance**  
  **Group A (better-informed) ROC points (FPR, TPR)**:  
  - Threshold s≥1: (1.0, 1.0)  
  - s≥2: (P(S≥2|Y=0) = 0.3+0.1+0.0=0.4, P(S≥2|Y=1)=0.1+0.3+0.6=1.0) → (0.4, 1.0)  
  - s≥3: (P(S≥3|Y=0)=0.1+0.0=0.1, P(S≥3|Y=1)=0.3+0.6=0.9) → (0.1, 0.9)  
  - s≥4: (0.0, 0.6)  

  **Group B (worse-informed) ROC points**:  
  - s≥1: (1.0, 1.0)  
  - s≥2: (P(S≥2|Y=0)=0.4+0.3+0.0=0.7, P(S≥2|Y=1)=0.3+0.4+0.3=1.0) → (0.7, 1.0)  
  - s≥3: (P(S≥3|Y=0)=0.3+0.0=0.3, P(S≥3|Y=1)=0.4+0.3=0.7) → (0.3, 0.7)  
  - s≥4: (0.0, 0.3)  

  **ROC dominance by Group A**:  
  - At FPR=0.1, Group A achieves TPR=0.9. Group B’s best TPR at FPR≤0.1 is 0.3 (s≥4).  
  - At FPR=0.3, Group A’s TPR=1.0 (s≥2 with randomization). Group B’s TPR=0.7 (s≥3).  
  - **Verification**: For all FPR, Group A’s TPR ≥ Group B’s, strict for FPR∈(0,0.7).  

  ---

  ### **5. Cost of Equalized Odds**  
  **Equalized odds (EO)**: Equal FPR and TPR for both groups.  
  - **Deterministic rules**: Only (FPR=0, TPR=0) or (FPR=1, TPR=1) satisfy EO. Optimal per-group rules violate EO (e.g., A: (0.1,0.9), B: (0.3,0.7)).  
  - **Randomized rules (best EO-compliant rule)**:  
    - Target (FPR=0.7, TPR=1.0) from Group B’s frontier (s≥2).  
    - **Group B**: Use s≥2 → (0.7, 1.0).  
    - **Group A**: Achieve (0.7, 1.0) by randomizing:  
      - Approve S=1 with probability 0.5, else deny; approve S≥2 always.  
      - FPR = (0.5·0.6) + 0.4 = 0.7; TPR = (0.5·0.0) + 1.0 = 1.0.  
  - **Cost**:  
    - Group A: FPR increases from 0.4 (optimal) to 0.7 (+0.3); TPR unchanged at 1.0.  
    - Group B: Unchanged (FPR=0.7, TPR=1.0).  
  - **Moral**: EO forces Group A to "level down" (increase FPR), while Group B gains nothing. Error burden is not reallocated; it is increased for Group A.  

  ---

  ### **6. Cost of Other Criteria**  
  **Demographic Parity (DP)**: Equal selection rates.  
  - **Unconstrained selection rates**: Group A=0.26 (s≥3), Group B=0.06 (s≥4).  
  - **Constrained (selection rate=0.38)**:  
    - Group B: Use s≥3 → selection rate=0.38.  
    - Group A: Randomize between s≥3 (rate=0.26) and s≥2 (rate=0.52) to achieve 0.38:  
      - Probability 7/13 for s≥3, 6/13 for s≥2.  
      - FPR= (7/13)·0.1 + (6/13)·0.4 ≈ 0.2385.  
  - **Cost in accuracy (expected error rate)**:  
    - Group A: Error rate increases from 0.12 (optimal) to 0.212.  
    - Group B: Error rate increases from 0.28 to 0.36.  
  - **Expectation refuted**: DP costs both groups accuracy.  

  **Predictive Parity (PPV)**: Equal P(Y=1 | approve).  
  - **Unconstrained PPV**: Group A=0.692 (s≥3), Group B=0.368 (s≥3).  
  - **Constrained (PPV=1.0)**: Both groups use s≥4.  
    - Group A: Selection rate=0.12 (from 0.26), error rate=0.16 (from 0.12).  
    - Group B: Unchanged (error rate=0.28).  
  - **Cost**: Group A pays with higher error rate; Group B unaffected.  

  ---

  ### **7. Honest Notes**  
  **Key mechanism**: The **informativeness gap** (Group B’s noisier score) drives the impossibility. Equal base rates prevent standard base-rate-based impossibility, but the ROC dominance (from the data gap) forces EO to level down.  
  - **Remove gap (equal informativeness)**: ROC curves align; EO satisfiable without cost.  
  - **Add base-rate difference**: Standard impossibility (e.g., EO and PP clash) reappears.  

  **Strongest reply to defend EO**:  
  1. **Leveling down as justice**: The data gap itself is unjust (e.g., Group B’s sparse data from historical underinvestment). EO prevents exploiting this injustice, even if it levels down (Reply 2).  
  2. **Error rates are the wrong currency**: The burden of being "badly known" should not fall solely on Group B; EO redistributes this burden (Reply 1).  
  3. **Long-term remedy**: Invest in better data for Group B (Reply 5) to close the gap.  

  **EO as constraint vs. leveling down**: Replies 1 and 2 reframe leveling down as ethical (refusing to exploit unfair advantages). However, they do not make EO a "free lunch"; it remains costly for Group A. Only closing the data gap (Reply 5) resolves the tension.  

  ---  
  This case isolates the role of **informativeness gaps** in algorithmic fairness, showing how they force leveling down under equalized odds, even with equal base rates. Distributions are explicitly given and verified, and practitioner objections (e.g., "fix the data gap") are addressed as long-term solutions, not immediate fixes. Use this for talks to illustrate the hidden cost of EO when data quality differs.
