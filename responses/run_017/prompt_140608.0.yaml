     None of the replies restore equalized odds as a constraint that does not level down. They provide justifications for leveling down in the short term while we work on reply 5.

     However, if we accept reply 2, then leveling down is exactly the point: we are not willing to take advantage of the data gap, even though it exists.

     Therefore, in the context of this example, the strongest replies are 1 and 2.

