answer: |-
  ### Decision Procedure for Automated System Review Panel

  This procedure evaluates the automated scoring system for housing assistance, focusing on fairness trade-offs given the constraints (only top 20% reviewed, outcome sign ambiguity, group comparisons, and data limitations). It prioritizes measurable criteria and prompts value judgments when math alone is insufficient. Use monthly data since the last retraining.

  ---

  #### **Step 0: Preliminary Checks**  
  *Goal: Ensure data is usable.*  
  **Question:** Is required data available and sufficient?  
  - **Data needed:**  
    - Applicant group membership (e.g., race, gender).  
    - Scores and referral status (top 20%).  
    - Review outcome (benefit/unlock aid = `Y=1`; harm/terminate award = `Y=0`) for referred applicants.  
  - **Checks:**  
    1. **Completeness:** If >5% of records miss group, score, or referral status → **Stop: "Do not deploy; fix data logging."**  
    2. **Group size:** For any group, if referred applicants < 30 → **Flag:** "Unreliable for this group; use aggregated data or exclude if legally permissible."  
    3. **Drift:** Compare overall referral eligibility rate (since last retraining) to historical average. If change >10 percentage points → **Flag:** "Model drift likely; retrain if feasible."  

  **Outcome:** Proceed if all checks pass. Flagged issues require panel discussion but don’t halt the procedure.

  ---

  #### **Step 1: Estimate Measurable Fairness Metrics**  
  *Goal: Quantify disparities using observable data (referral rates and outcomes for the top 20%).*  
  **Actions:**  
  1. **Referral Rate (RR)** by group:  
     - *RR<sub>group</sub> = (Referred in group) / (All applicants in group)*.  
  2. **Positive Predictive Value (PPV)** by group (for referred applicants only):  
     - *PPV<sub>group</sub> = (Applicants with `Y=1`) / (Referred in group)*.  

  **Output:** Table of RR and PPV for all groups.  
  **Handling noise:** If a group has <30 referred applicants, report metrics with a warning: "High uncertainty; interpret cautiously."

  ---

  #### **Step 2: Check for Statistically Significant Disparities**  
  *Goal: Identify which disparities are robust, not noise.*  
  **Questions:**  
  1. **Referral Rate Disparity (80% Rule):**  
     - Compute *RR<sub>min</sub> / RR<sub>maj</sub>* (min = minority/protected group; maj = majority group).  
     - **Significance test:** Use chi-square test (or Fisher’s exact test if n<100).  
     - **Threshold:** Ratio <0.8 *and* p<0.05 → "Significant adverse impact."  
  2. **PPV Disparity:**  
     - Compute *PPV<sub>min</sub> / PPV<sub>maj</sub>*.  
     - **Significance test:** Two-proportion z-test for referred applicants.  
     - **Threshold:** Ratio <0.9 or >1.1 *and* p<0.05 → "Significant PPV gap."  

  **Output:**  
  - List disparities (if any) and their significance.  
  - If no significant disparities → **Proceed to deploy** (no fairness issues detected).  
  - Else → Proceed to Step 3.

  ---

  #### **Step 3: Resolve Trade-offs (Value Judgment)**  
  *Goal: Choose which fairness criterion to prioritize when disparities conflict.*  
  **Scenario A: Significant RR disparity only**  
    - **Question:** "Is equal opportunity (equal referral access) the top priority?"  
      - **Yes** → Recommend **group-specific thresholds** (adjust cutoff scores to equalize RR).  
      - **No** → Proceed to deploy (accept disparity).  

  **Scenario B: Significant PPV disparity only**  
    - **Question:** "Is predictive parity (equal accuracy for those referred) the top priority?"  
      - **Yes** → Recommend **retrain model with PPV parity constraints**.  
      - **No** → Proceed to deploy (accept disparity).  

  **Scenario C: Both RR and PPV disparities**  
    - **Question:** "Which harm is worse?  
      - (a) Under-referring qualified applicants (RR disparity).  
      - (b) High error rates for referred applicants (PPV disparity)."  
    - **Panel vote:** Majority decides priority.  
      - Prioritize RR → Use group-specific thresholds.  
      - Prioritize PPV → Retrain for PPV parity.  
      - Deadlock → Default to **reporting RR disparity** (most legally salient).  

  **Output:**  
  - Clear recommendation (e.g., "Adjust thresholds for Group X," "Retrain model," or "Deploy as-is").  
  - If adjustments are infeasible → **Stop: "Do not deploy without modifications."**  

  ---

  #### **Step 4: Address Agency Counsel’s Request**  
  *Goal: Provide a single "headline" disparate-impact figure when math is ambiguous.*  
  **Rule:**  
  - **If RR disparity exists → Report *RR<sub>min</sub> / RR<sub>maj</sub>*** (courts favor this under the 80% rule).  
  - **If no RR disparity → Report *PPV<sub>min</sub> / PPV<sub>maj</sub>***.  
  - **If both exist → Report RR disparity** (it affects more applicants).  
  **Add caveat:** "This simplifies complex trade-offs; see full report for context."

  ---

  ### **Application to Example Cases**  
  *Data assumptions:*  
  - Group A (minority): 1,000 applicants, 200 referred.  
  - Group B (majority): 4,000 applicants, 800 referred.  
  - Eligibility drift: Historical PPV was 70% for both groups; now varies.  

  #### **Case 1: Welcome Outcome (No Action Needed)**  
  - **Data:**  
    - RR<sub>A</sub> = 20% (200/1,000), RR<sub>B</sub> = 20% (800/4,000) → Ratio = 1.0 (no disparity).  
    - PPV<sub>A</sub> = 68% (136/200), PPV<sub>B</sub> = 72% (576/800) → Ratio = 0.94 (not significant, p=0.25).  
  - **Procedure:**  
    - Step 0: No flags.  
    - Step 2: No significant disparities.  
    - **Output:** "Deploy system; no fairness issues detected."  

  #### **Case 2: Unwelcome Outcome (Prioritize RR Parity)**  
  - **Data:**  
    - RR<sub>A</sub> = 12% (120/1,000), RR<sub>B</sub> = 20% (800/4,000) → Ratio = 0.6 (p<0.01).  
    - PPV<sub>A</sub> = 75% (90/120), PPV<sub>B</sub> = 70% (560/800) → Ratio = 1.07 (not significant, p=0.30).  
  - **Procedure:**  
    - Step 2: Significant RR disparity.  
    - Step 3 (Scenario A): Panel prioritizes RR parity → **Output:** "Use group-specific thresholds; raise Group A’s cutoff to refer 200 applicants."  
  - **Why unwelcome?** Group-specific thresholds may face legal challenges.  

  #### **Case 3: Unwelcome Outcome (Deadlock)**  
  - **Data:**  
    - RR<sub>A</sub> = 10% (100/1,000), RR<sub>B</sub> = 20% (800/4,000) → Ratio = 0.5 (p<0.01).  
    - PPV<sub>A</sub> = 50% (50/100), PPV<sub>B</sub> = 80% (640/800) → Ratio = 0.625 (p<0.01).  
  - **Procedure:**  
    - Step 2: Both disparities significant.  
    - Step 3 (Scenario C): Panel deadlocks on harm priority.  
    - **Output:** "Report RR disparity (0.5) to counsel. Deploy with monitoring; collect non-referred sample data. Deadlock requires policy guidance."  
  - **Why unwelcome?** Both harms exist; no clear solution without values.  

  ---

  ### **What This Procedure Cannot Settle**  
  1. **Unobservable error rates:** FPR/FNR for non-referred applicants *cannot* be estimated without random audits.  
  2. **Value-free priorities:** Choosing between RR and PPV parity hinges on the panel’s judgment of "harm" (e.g., is under-referring worse than wrongful termination?).  
  3. **Intersectional groups:** If fairness for multi-race women is required but not logged → **Stop: "Do not use this criterion."**  
  4. **Drift compensation:** If drift is detected, the procedure flags it but cannot auto-correct without new data.  
  5. **Counsel’s headline figure:** When both RR and PPV disparities exist, RR is chosen by default—this is pragmatic, not mathematically optimal.  

  **Final Recommendation:** Always pair this procedure with random audits of non-referred applicants to estimate base rates and close data gaps.
