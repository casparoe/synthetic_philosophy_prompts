     - Terminating an existing award (negative outcome for the applicant)

  The panel must decide what fairness criterion to prioritize when the system is retrained, given that it is impossible to satisfy calibration, equal false-positive rates (FPR), equal false-negative rates (FNR), and predictive parity simultaneously in this selective labels setting (only the top 20% are reviewed). 

