prompt: |-
  I sit on the ethics and governance panel of a hospital trust that runs a clinical genomic testing service, and we are rewriting what patients get told. Three questions are live: whether to report variants of uncertain significance, whether to report findings for conditions the patient was not tested for, and whether a patient may file a standing instruction not to be told certain classes of result.

  One member of the panel closes almost every discussion with the same argument. Information, he says, is like a sharper photograph of a fixed scene. You can always squint, or blur the image, or look away, so a higher-resolution image cannot leave you worse at whatever task you were using it for; worse, in his view, only if you insist on looking at something you would have preferred not to see, which is your business and not the panel's. And this, he says, is exactly what the decision-theoretic result usually known as the value-of-information theorem says in its formal dress: for an agent who updates by conditionalisation and maximises expected utility, the expected value of an additional signal, assessed before the signal arrives, is never negative, and is strictly positive just in case the signal could change what the agent does in some state of the world. His conclusion is that release is at worst neutral, that withholding is a form of paternalism, and that the burden of argument always falls on suppression rather than on disclosure.

  I am not persuaded, but I cannot say exactly where the picture stops fitting, and I would rather not overrule him on instinct. Please audit the analogy.

  Give me the correspondence table first: what plays the part of the resolution, of the scene, of the camera, of the viewer, of the task the image is for, of squinting, and of the cost of taking the photograph. Then separate the disanalogies that matter for the use he is making of it from the ones that are merely decorative. I would like the following pressed specifically.

  Whether the squinting move is bearing more weight than the theorem gives it. The theorem lets the agent adopt any decision rule as a function of the signal, including a constant one; that is the formal counterpart of looking away. Say what has to be true for that option to be genuinely available — that ignoring costs nothing, that attention is not scarce, that the viewer can decline to attend and yet still know what he would have done without the image, that the viewer's preferences and competence are themselves unmoved by having seen it.

  Whether the ex ante framing is doing work he does not acknowledge, given that he is arguing for a policy applied to people one at a time and that a realised result can leave a particular patient worse off even when the prospect was non-negative in expectation.

  Whether the fixed scene holds. In the photograph case there is a state of the world the image resolves more or less finely, and more resolution is a refinement. In our case the report is evidence about a laboratory's current opinion, the meaning of which is revised over years; a variant of uncertain significance may be reclassified long after it is filed. Say whether that is a refinement of the same scene at all, and what follows if it is not.

  Whether the single-viewer assumption is doing the heaviest work of all. A photograph is looked at by one person and changes nothing else. A result enters a record that clinicians, relatives, insurers and employers can act on, and some arrangements — risk pooling, insurance, anything that depends on a shared ignorance — can stop working when the ignorance is removed, even though no individual has been made worse off by knowing. I want to know whether this breaks the move from cannot harm the recipient to cannot harm, or whether it is a separate argument he is entitled to set aside.

  Whether the theorem is about gross or net value, and what our panel should do with the acquisition, follow-up and downstream-testing costs that disclosure sets in motion.

  Then run the audit on three proposals in front of us: reporting variants of uncertain significance to healthy adults; offering direct to consumers a polygenic score for a common disease for which no preventive intervention exists; and reporting, in a child's genome, a finding for a late-onset condition with no treatment, where the parents had asked for everything to be reported. For each, say which disanalogy carries the weight, and whether our default should flip.

  Finally, tell me whether there is a better single picture for the case where information is generated for one person and read by many, and whether the honest answer is that no picture fits — and if so, what the panel should put in place of one. Please answer in British English.
reasoning: |-
  Okay, let me approach this methodically. The user presents a nuanced ethical dilemma in clinical genomics, centered on a committee member's persistent argument that information disclosure is always non-harmful based on a decision-theory analogy. The challenge is to dissect this analogy while addressing specific policy scenarios.

  First, I need to map the photography analogy to genomic information:
  - Resolution = Detail in genetic report
  - Scene = Patient's true genetic status
  - Camera = Testing technology
  - Viewer = Patient
  - Task = Health decisions
  - Squinting = Ignoring results
  - Photograph cost = Testing/resources

  The core tension lies in whether real-world genomics fits this clean model. I'm particularly struck by how the member's argument glosses over critical differences: genetic information isn't static like a photograph; it evolves with reinterpretations. Also, ignoring results isn't costless - there's emotional burden even when trying to "squint".

  For the three policy questions:
  - VUS reporting: The "evolving scene" disanalogy dominates. Reporting today's uncertain classification may mislead if reinterpreted later.
  - Polygenic scores: Here the "single viewer" problem is key. Scores leaked to insurers could harm without clinical utility.
  - Childhood findings: The "ex ante framing" issue matters most. Parents requesting "everything" haven't consented to specific future harms.

  The insurance angle is especially troubling. That genetic information can collapse risk pools shows how the "no negative value" theorem fails when knowledge has systemic effects beyond the individual.

  Perhaps we need to replace the photograph with a different metaphor - like a medical record that multiple parties can access, where entries can be amended. But ultimately, no single analogy suffices. The committee should focus on concrete harms: anxiety from ambiguous results, discrimination risks, and the costs of unnecessary follow-ups.

  The ethical path forward requires evaluating each disclosure type against: clinical actionability, consent specificity, reinterpretation protocols, and systemic impacts. Paternalism isn't the issue - preventing measurable harm is.
answer: |-
  Below is a systematic audit of the photography analogy and its application to genomic disclosure policies, structured per your request. I'll address each element in British English, focusing on material disanalogies and their implications for your three proposals.

  ---

  ### **Correspondence Table**
  | **Photography Analogy**       | **Genomic Reporting Context**                     | **Critical Notes**                                                                 |
  |-------------------------------|--------------------------------------------------|-----------------------------------------------------------------------------------|
  | **Resolution**                | Granularity of genetic findings reported         | High resolution = More variants/details disclosed                                |
  | **Fixed Scene**               | Patient's genomic truth *at time of test*        | Genomic "scene" evolves with reclassification; not fixed                         |
  | **Camera**                    | Genomic testing technology                       | Accuracy depends on lab methods/interpretation                                   |
  | **Viewer**                    | Patient (primary recipient)                      | But genomic data is accessed by clinicians, family, insurers, employers          |
  | **Task**                      | Health/life decisions (e.g., treatment, screening)| Real-world "tasks" are constrained by resources/options                         |
  | **Squinting/Looking Away**    | Choosing to ignore results                       | Assumes cost-free psychological detachment; often impossible                     |
  | **Cost of Taking Photograph** | Financial/operational cost of testing & reporting| Omits downstream costs (e.g., unnecessary follow-ups, insurance repercussions)   |

  ---

  ### **Material Disanalogies Affecting the Argument**
  #### 1. **The "Squinting" Fallacy**  
     - **Theorem's allowance**: Yes, agents *can* ignore information (adopt a constant decision rule).  
     - **Reality gaps**:  
       - **Attention isn't free**: Knowing a VUS exists creates anxiety (the "burden of knowing"), even if "ignored".  
       - **Cognitive irrevocability**: You cannot unsee genetic risk information (cf. true "looking away").  
       - **Competence shift**: Knowing may alter perceived self-efficacy or risk tolerance (e.g., fatalism).  
     - **Weight bearing**: The analogy overstates psychological agency. Ignoring VUS is like "squinting" at a tiger in your room—possible, but stressful and unnatural.  

  #### 2. **Ex Ante vs. Ex Post Harm**  
     - **Theorem's frame**: Ex ante expected value is non-negative.  
     - **Policy reality**:  
       - A *specific patient* may suffer irreversible harm (e.g., discrimination based on a polygenic score).  
       - The theorem justifies offering *access* to information, not mandatory *disclosure*. Defaults matter: Opt-in vs. opt-out changes autonomy dynamics.  
     - **Unacknowledged work**: The member conflates population-level expected utility with individual welfare. A policy can be ex ante rational but ex post disastrous for some.  

  #### 3. **The "Fixed Scene" Illusion**  
     - **Genomic flux**:  
       - A VUS today may be pathogenic/benign tomorrow; the "scene" is provisional.  
       - Reporting a VUS is like mailing a blurry photo that *changes* after delivery.  
     - **Refinement question**: Reclassification isn’t refining the same state—it’s generating new evidence. Disclosing ephemeral interpretations risks anchoring bias (patients fixate on initial results).  
     - **Consequence**: Reporting VUS without reanalysis protocols may *misinform*.  

  #### 4. **The Single-Viewer Fiction**  
     - **Data multipolarity**: Genetic data is rarely "private". Insurers, employers, or relatives may act on it, harming the patient *without their consent*.  
     - **Systemic harm**:  
       - Risk-pooling collapses if high-risk individuals are identified (e.g., uninsurability).  
       - Familial implications: A child’s result reveals parental risks, violating others' "right not to know".  
     - **Breaks the theorem**: The value-of-information theorem assumes a *single agent*. Shared data environments create externalities—disclosure can harm the recipient *via others' actions*.  

  #### 5. **Gross vs. Net Value**  
     - **Theorem focus**: Gross value of information (pre-cost).  
     - **Real-world costs**:  
       - **Direct**: Confirmatory testing, counselling, surveillance triggered by VUS/polygenic scores.  
       - **Opportunity costs**: Clinic time spent explaining uncertain results instead of treating active conditions.  
       - **Emotional costs**: Anxiety impairing daily function.  
     - **Panel duty**: Must weigh *net* clinical/psychosocial utility. Cost-blind disclosure risks medicalising normality.  

  ---

  ### **Audit of Specific Proposals**
  | **Proposal**                                                                 | **Dominant Disanalogy**                          | **Default Suggestion**       | **Reason**                                                                 |
  |------------------------------------------------------------------------------|--------------------------------------------------|------------------------------|----------------------------------------------------------------------------|
  | **1. Reporting VUS to healthy adults**                                       | **Evolving scene + Costs**                       | **Withhold by default**      | High anxiety/cost burden for transient data; offer access via counselling. |
  | **2. Direct-to-consumer polygenic score (no prevention)**                    | **Multipolar harm + Net value**                  | **Suppress entirely**        | No clinical utility; high misuse risk (discrimination, fatalism).          |
  | **3. Reporting late-onset untreatable findings in a child**                  | **Squinting fallacy + Multipolarity**            | **Withhold unless opted-in** | Violates child’s future autonomy; parents may not grasp implications.      |

  ---

  ### **Better Metaphors & Conclusions**
  - **Superior analogy**: **Genetic information as a shared medical record in a glass-walled room.**  
    - Multiple actors can view/act on it (clinicians, insurers).  
    - Entries can be amended (reclassification), but past versions linger.  
    - "Not looking" is impossible once accessed; the room’s glass puts burden on *architects* (your panel) to control access.  

  - **The "no picture fits" reality**: Genomics is sui generis—dynamic, multipolar, and identity-relevant. **Replace analogy with a harms framework**:  
    1. **Tier disclosure** by actionability (e.g., ACMG guidelines).  
    2. **Require explicit consent** for each category (VUS, secondary findings).  
    3. **Build recontact systems** for reclassified variants.  
    4. **Shift burden**: Disclose *only* where net utility is demonstrable (costs/benefits modelled).  

  **Final view**: The member’s argument fails clinically. Information can harm individuals via psychological, relational, or systemic pathways—your instinct to overrule is sound. Paternalism is justified when protecting patients from non-consensual, non-actionable, or destabilising knowledge. The panel’s duty is to *curate* information, not abdicate to a theorem ignoring human complexity.  

  ---  
  Would you like expanded ethical arguments for any proposal or draft policy language?
