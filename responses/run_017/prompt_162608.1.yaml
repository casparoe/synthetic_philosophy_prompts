  ### Summary of Principle

  **Final Principle**:

  A shift in credence is admissible for updating if and only if it is caused by new evidence about the world and not by a temporary impairment in the subject's cognitive state. Specifically:

  1. **Admissibility conditions**:
     - (a) Shifts due to temporary impairments (e.g., alcohol) are ignored.
     - (b) Shifts due to learning about past impairments are admissible.
     - (c) Shifts due to learning that past evidence was flawed are admissible and require retraction of updates based on that evidence.
     - (d) Shifts caused by learning another agent's credence in H are admissible for directly updating H only if the agent has strictly more evidence about H than the subject; otherwise, they are not admissible for H (but may be used to update beliefs about the agent).

  2. **Update rule for an admissible shift**:
     - Identify the coarsest partition Ω that is directly affected by the evidence and for which the shift specifies new probabilities for the cells.
     - Refine Ω to Ω' by splitting any cell C for which the shift changes the conditional probability of some event given C, until no such change occurs within any cell of Ω'.
     - Perform a Jeffrey conditionalization on Ω' with the new probabilities.

  3. **Multiple shifts**: If multiple admissible shifts occur, they must be merged into a single shift by:
     - Taking the coarsest common refinement of their respective partitions (Ω1, Ω2, ...) to form Ω'.
     - Determining the new probabilities for the cells of Ω' that are consistent with each shift.
     - Performing a single Jeffrey update on Ω'.

  4. **Retraction**: When new evidence shows that past evidence e was flawed, retract any update that was based on e by reverting to the state before that update. Then, update with the new evidence and redo any updates that used e, now accounting for the flaw.

