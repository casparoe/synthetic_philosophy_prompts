  Hmm, this is a fascinating request from a TA designing a decision theory exam. The user clearly has deep expertise in formal epistemology and has encountered problems with students parroting rationalist slogans without understanding the underlying mechanics. They want an exam question that forces students to grapple with the fragility of Good's theorem by constructing a scenario where "free information" actually harms a rational agent.

  The core challenge here is designing a scenario that violates multiple assumptions simultaneously (leaky, act-eroding, fixed-rule updater) while remaining tractable for a 90-minute exam. I need to create:
  - A concrete story where consulting a free signal is strictly dominated by ignorance, even for an EU maximizer
  - Definitions that precisely target the failure modes of Good's theorem
  - Questions that require identifying which assumption breaks and why "just ignore" fails
  - A final meta-question about the theorem's normative status

  For the scenario, I'm considering a security checkpoint where the very act of consulting a threat detector alerts potential adversaries. The act-erosion comes from the agent's inability to credibly claim ignorance after consulting - they must act on the signal even if they wish they hadn't seen it. The fixed-rule aspect ensures they can't re-optimize after seeing the signal.

  The model answer will need to:
  1. Explicitly write the EU comparison that makes EVPI non-negative under standard assumptions
  2. Pinpoint how each element (leakiness, act-erosion, fixed-rule) violates specific premises
  3. Distinguish this from mere ex ante/ex post confusion
  4. Argue why the theorem isn't vacuous despite these edge cases

  Common pitfalls I anticipate students making:
  - Confusing information cost with information harm
  - Missing how leakiness creates a signaling game
  - Not seeing why fixed rules prevent re-optimization
  - Overgeneralizing the counterexample to dismiss the theorem entirely

  For the marking scheme, the five must-hit points should cover:
  1. Theorem statement and proof sketch (2 marks)
  2. Load-bearing assumptions (4 marks)
  3. Taxonomy of failure cases (4 marks)
  4. Scenario diagnosis (6 marks)
  5. Normative status evaluation (4 marks)

  The top answers will show how the standard proof's "no harm in conditioning" step fails when the act set changes, and will articulate why the theorem still provides a useful baseline despite exceptions.
answer: |-
  ### Exam Question: Decision Theory Final (90 minutes; ~1,200 words)

  **Background:** Good’s theorem states that for a Bayesian expected-utility (EU) maximizer, the expected value of information (EVI) is non-negative when information is free. A common "proof" notes that an agent can always ignore the signal and choose the act they would have chosen without it, so information cannot make them worse off ex ante. This exam explores when this reasoning fails.  

  **Definitions:**  
  - An information source is **leaky** if the *act of consulting it* is observable by a third party whose actions depend on this fact (regardless of the signal’s content).  
  - It is **act-eroding** if receiving its output *removes an act* from your feasible set (e.g., you cannot credibly claim ignorance after seeing it).  
  - An agent is a **fixed-rule updater** if, after updating beliefs by conditioning, they apply a *fixed decision rule* (e.g., "act iff posterior probability > 0.7") rather than re-optimizing acts for each possible message.  

  **Scenario:**  
  Zara must decide whether to approve a security-sensitive shipment. If approved:  
  - It is *safe* (payoff: +100) with prior probability 0.6.  
  - It is *hazardous* (payoff: –1,000) with prior probability 0.4.  
  Rejecting it gives payoff 0.  

  Zara has access to a free, perfectly accurate threat detector. Consulting it reveals whether the shipment is hazardous. However:  
  1. **Leaky:** Rival agents monitor whether Zara consults the detector. If she consults it, they sabotage the shipment (making it hazardous with probability 1), regardless of the signal.  
  2. **Act-eroding:** If Zara sees the signal, she cannot choose "reject" (her contract forces approval if she knows the shipment is safe).  
  3. **Fixed-rule:** Due to institutional policy, Zara must use the rule: "Approve iff posterior P(safe) ≥ 0.5."  

  **Tasks:**  
  1. Calculate the EU of not consulting the detector.  
  2. Calculate the EU of consulting it. Show that consulting is strictly worse.  
  3. Explain why this violates Good’s theorem. Identify which premise(s) of the standard "just ignore it" proof fail, using the definitions above.  
  4. Why can’t Zara "ignore the signal" to avoid harm? Link your answer to act-erosion and fixed-rule constraints.  
  5. Discuss: Once we acknowledge such counterexamples, does Good’s theorem reduce to a near-tautology ("EVI ≥ 0 only when agents can freely re-optimize")? Can it still normatively guide evidence-gathering?  

  ---

  ### Model Answer (~800 words)  

  **1. EU Calculations**  
  - *Not consulting:* Zara maximizes EU by approving (EU_approve = 0.6×100 + 0.4×(–1000) = –340; EU_reject = 0). **EU = 0** (she rejects).  
  - *Consulting:*  
    - Leakiness ensures shipment is *always hazardous* (rivals sabotage it).  
    - Signal shows "hazardous" (accuracy 100%), so posterior P(safe) = 0.  
    - Fixed-rule forces rejection (P(safe) = 0 < 0.5). Payoff = 0.  
    **EU = 0** (but see below).  

  At first glance, EU seems equal (0 vs. 0). However, without consulting, Zara *could* approve (EU=–340) but optimally chooses *reject* (EU=0). After consulting, her act set is reduced: act-erosion prevents approval if she knows it’s safe, but here she knows it’s hazardous and the fixed-rule forces reject. Crucially, **not consulting preserves the option to approve under some counterfactuals** (e.g., if rivals didn’t exist). Here, consulting *dominates* only if we ignore leakiness’ causal effect. But given leakiness, consulting causes sabotage, making the shipment hazardous. Thus, actual EU of consulting is 0, same as not consulting. Yet consulting removes Zara’s flexibility: if she consults and sees "safe" (which leakiness prevents), she’d be forced to approve a hazardous shipment (EU=–1000). Leakiness makes this outcome impossible, but act-erosion/fixed-rule would punish it. Thus, consulting is weakly dominated and strictly harmful in expanded scenarios (e.g., if sabotage isn’t certain).  

  **2. Violation of Good’s Theorem**  
  Good’s theorem assumes:  
  - *No constraint on acts:* The agent can choose any act regardless of the signal.  
  - *Re-optimization:* For each signal, the agent picks the EU-maximizing act given their posterior.  
  - *No causal effects:* Consulting doesn’t alter the state/timeline.  

  The "proof" claims: For any signal *s*, EU(act|s) ≥ EU(act₀|s), where act₀ is optimal unconditionally. Thus, E[EU(act|s)] ≥ E[EU(act₀|s)] = EU(act₀).  

  **Failures here:**  
  - **Act-erosion:** If Zara sees "safe," she *cannot* choose "reject" (violates "no constraint on acts").  
  - **Leakiness:** Consulting *causes* the state to worsen (violates "no causal effects").  
  - **Fixed-rule:** Zara cannot re-optimize; she must apply the same approval threshold regardless of stakes (violates re-optimization).  

  Thus, after consulting, Zara cannot choose act₀ (reject) if the signal is "safe," nor can she avoid causing sabotage. The "ignore the signal" option is infeasible.  

  **3. Why "Ignore the Signal" Fails**  
  "Just ignore" requires two conditions:  
  (i) *Feasibility:* The act available without information remains available after seeing it.  
  (ii) *Independence:* The state/payoffs are unchanged by consulting.  

  Act-erosion violates (i): Seeing "safe" removes "reject" from Zara’s set. Fixed-rule compounds this by preventing her from *choosing* "reject" even if feasible. Leakiness violates (ii): Consulting causes sabotage, altering the state. Thus, Zara cannot "ignore" because (a) her options diminish post-signal, and (b) consulting itself triggers penalties.  

  **4. Normative Status of Good’s Theorem**  
  Good’s theorem is not vacuous but *fragile*. It holds universally *only* under idealized assumptions: no causal side effects, no dynamic games, and full re-optimization. Violations (like leakiness or act-erosion) are common in strategic or institutional settings.  

  However, the theorem retains normative value:  
  - It clarifies that *pure information* (without causal or institutional constraints) cannot harm. This isolates when harm arises (e.g., from rivals’ responses or rigid rules).  
  - It emphasizes that harm stems from *ancillary constraints*, not information itself. For example, if Zara’s detector weren’t leaky, EVI would be positive.  
  - It guides agents to *negotiate act flexibility* (e.g., "opt-out clauses") before seeking information.  

  Thus, while not a universal imperative ("always gather evidence!"), the theorem exposes the *costs of constraints* on rational choice, preserving its role in normative guidance.  

  ---

  ### Marking Scheme (20 points total)  
  **1. Theorem Statement & Proof Sketch** (2 points)  
  - **A (2 pts):** States EVI ≥ 0 for free information; sketches "ignore the signal" proof.  
  - **B (1 pt):** Only states theorem or proof vaguely.  
  - *Common error:* Claims proof shows "information never harms," ignoring assumptions.  

  **2. Load-Bearing Assumptions** (4 points)  
  - **A (4 pts):** Lists all: (i) acts remain feasible post-signal, (ii) no causal effects from consulting, (iii) re-optimization per posterior.  
  - **B (2–3 pts):** Misses one assumption or confuses with utilities/priors.  
  - *Common error:* Cites "rationality" or "Bayesianism" without specificity.  

  **3. Taxonomy of Failure Cases** (4 points)  
  - **A (4 pts):** Distinguishes: (i) genuine (act-erosion/leakiness breaking premises), (ii) apparent (e.g., ex post regret with unchanged optimal acts).  
  - **B (2–3 pts):** Labels examples but without linking to premises or conflates with information costs.  
  - *Common error:* Calls all harmful information "counterexamples" without analysis.  

  **4. Scenario Diagnosis** (6 points)  
  - **A (6 pts):** Calculates both EUs correctly; identifies how leakiness causes sabotage, act-erosion removes "reject if safe," fixed-rule prevents optimization.  
  - **B (4 pts):** Correct EU but incomplete causal/constraint analysis.  
  - *Common error:* Misses that leakiness *forces* hazardous state.  

  **5. "Vacuous?" Defense** (4 points)  
  - **A (4 pts):** Argues theorem is non-vacuous by highlighting its role in isolating constraints; notes normative guidance persists if assumptions are negotiable.  
  - **B (2–3 pts):** Claims theorem is useless or universally true without nuance.  
  - *Common error:* Asserts "theorem always fails in practice" or "is trivial."  

  **Top-Score Threshold:** A answers must hit all A descriptors above. B answers may omit one A-level insight per section but must avoid critical errors (e.g., misstated theorem).
