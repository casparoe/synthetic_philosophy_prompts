prompt: |-
  I am a graduate student in a seminar on practical rationality, and I also sit as the student member of my university's dissertation fellowship committee. Each spring we read roughly forty shortlisted files and award eight fellowships. Applicants are scored on five dimensions, each on a one-to-five scale, and the sums produce exact ties several times per cycle — sometimes a clean pair, sometimes a five-way clump at the cutoff where no one believes the one-point gaps mean anything. Our meetings allow about ten minutes for a borderline case, the other members are faculty with no training in decision theory, and every decision goes into a minute that the dean reads and that an unsuccessful applicant could in principle appeal against. The chair has to sign off on anything we adopt.

  I would like you to turn what the Buridan's ass problem, and the surrounding discussion of choice under genuine indifference, actually establishes into a written tie-break protocol my committee could vote to adopt at the start of a cycle. I have the philosophical reading; I do not need a summary of it or pointers to it. I need the operationalized version, and I need it to survive contact with people who have never heard the term "incommensurability."

  Concretely, please give me:

  1. An ordered sequence of tests, the first of which asks whether the case before us is a tie at all. I want the genuine symmetry case distinguished from its impostors: a rubric too coarse to resolve a real difference, evidence we simply do not have, and the inarticulate but possibly expert judgment of a member who says only that one file feels stronger. For each, say what counts as a sufficient answer and when we stop investigating.
  2. A rule about when the protocol itself must be fixed. I suspect it matters that we adopt our tie-break method before we know which files will tie, because a member who prefers a candidate can always announce indifference and then break the tie his own way. Say what the protocol does about that.
  3. Where the protocol terminates in a decision, where it escalates to a named person, and where it stops because the question is one of values rather than facts.
  4. A clause forbidding invented reasons: we must not write down a discriminator we do not actually believe in order to make a tie look resolved. Tell me how a member is supposed to distinguish a fabricated discriminator from a real one, and tell me what the minute must say when the honest description is that we had no reason.
  5. Guidance on the menu of exits — randomize openly, pick arbitrarily, defer to the chair, split the award between two applicants, or reopen the search rather than choose. Which is right when, and why. Include the case of repeated ties within one cycle and across consecutive years: if an applicant loses a coin flip twice, should the second flip be independent, or should the first loss count?
  6. What to do when the two sides of the tie carry unequal downside — a wrong pick in one direction is much worse than in the other.
  7. An honest account of what is lost in translating the philosophical problem into a committee rule, and which distinctions you deliberately dropped as unusable at ten minutes per case.

  Then run the protocol on three cases from a cycle I can anticipate: two applicants with identical scores on all five dimensions and files of comparable depth; a five-way clump at the cutoff where the point differences are noise; and a tie between a candidate from my own department, about whom three members have substantial informal knowledge, and an external candidate about whom the file is everything anyone knows. At least one of the three should produce an answer my committee will not like, and I want you to say plainly why we won't like it and that we should follow it anyway. Finally, state what the protocol cannot do — the questions it is the wrong instrument for.
reasoning: |-
  Okay, let me tackle this complex request step by step. The user is a grad student involved in dissertation fellowship selections, facing practical challenges with tied scores. They need an operational tie-break protocol grounded in decision theory but accessible to non-philosophers.

  First, I need to understand the core problem: translating Buridan's ass concepts into actionable steps. The key is distinguishing true indifference from false ties while preventing gaming of the system. The committee's constraints are clear - about 10 minutes per borderline case, faculty unfamiliar with decision theory, and formal records that could be appealed.

  For the protocol structure, I'll start with a "tie verification" sequence. This must separate:
  - Actual identical merit (true indifference)
  - Measurement limitations (coarse rubric)
  - Missing information gaps
  - Unexpressed intuitive judgments

  Each test needs clear pass/fail criteria and stopping rules. For instance, if members can articulate concrete differences when probed, it's not a true tie.

  The timing issue is critical. To prevent strategic indifference declarations, the protocol must be adopted before seeing applications. I'll include an upfront commitment clause with consequences for bad faith claims.

  On termination points:
  - True ties should resolve with randomization
  - Value judgments escalate to the chair
  - Factual uncertainties may require reopening files
  - Fabricated reasons must be forbidden - I'll emphasize honest documentation of "no discernible difference"

  For exit options, randomization is fairest for true ties. But we need rules for repeated cases (e.g., independent coin flips to avoid compounding disadvantage) and asymmetric risks (escalate to chair if one error is worse).

  The three test cases will showcase the protocol:
  1. Identical scores/files - demonstrates pure randomization
  2. Five-way noise cluster - highlights de minimis threshold
  3. Insider vs outsider - forces recusal despite discomfort

  I'll explicitly state that the third case's recusal requirement will be unpopular but necessary for fairness. The protocol's limits should be acknowledged - it's for resolvable ties, not rubric redesign or policy debates.

  Throughout, I'll maintain philosophical rigor while using plain language. The examples will confront the committee's likely biases, showing why uncomfortable decisions are sometimes required by rationality principles.
answer: |-
  Below is a fully operationalized tie-break protocol for your committee, designed to resolve scoring ties while respecting Buridan's ass principles (genuine indifference) and real-world constraints. It prioritizes procedural fairness, transparency, and resistance to manipulation.

  ---

  ### **Dissertation Fellowship Tie-Break Protocol**  
  *(Adopted [Date] prior to file review for Cycle [Year])*

  **Preamble**: This protocol activates only when scores are tied at the fellowship cutoff. Its purpose is to:  
  (a) Distinguish *true ties* (genuine indifference between candidates) from resolvable differences;  
  (b) Resolve true ties without fabricating reasons;  
  (c) Document decisions for auditability.  
  *All committee members must affirm this protocol before accessing applicant files.*

  ---

  ### **1. Sequence of Tests for Tie Verification**  
  *Time limit: 8 minutes per test. Stop if resolved.*

  1. **Test 1: Is this a true tie?**  
     - **Question**: "Are the applicants *indistinguishable* in merit for the fellowship, considering *only* the evidence in their files and the scoring rubric?"  
     - **Sufficient "No"**: Any member cites a *specific, rubric-aligned difference* (e.g., "Applicant A's publication is in a top-tier journal; B's is not").  
     - **Stop**: If "No," the difference breaks the tie. Minute records: "Tie resolved by [specific difference]."  
     - **Proceed to Test 2** if all agree no articulable difference exists.

  2. **Test 2: Is the tie due to coarse evidence?**  
     - **Question**: "Could better evidence resolve this? Did we lack data (e.g., incomplete file) or is the rubric too coarse (e.g., scoring '4' covers too wide a range)?"  
     - **Sufficient "Yes"**: Missing/ambiguous data exists *and* could plausibly change the outcome (e.g., letter not uploaded; conflicting project descriptions).  
     - **Stop**: If "Yes," table the application. Request missing data from the Dean. If unresolved in 48hrs, proceed to Test 3.  
     - **Proceed to Test 3** if evidence is complete and rubric applied faithfully.

  3. **Test 3: Is there unarticulated expert judgment?**  
     - **Question**: "Does any member have a strong, evidence-based preference they cannot yet articulate? If so, you have 2 minutes to consult notes and identify a *rubric-based* reason."  
     - **Sufficient "Yes"**: Member provides a concrete, file-based distinction (e.g., "A’s methodology section lacks feasibility details present in B’s").  
     - **Stop**: If "Yes," the distinction breaks the tie. Minute records: "Tie resolved by [specific evidence] after deliberation."  
     - **Proceed to Resolution** if all confirm indifference persists.

  ---

  ### **2. Protocol Timing and Anti-Manipulation Rule**  
  - **Adoption**: This protocol must be ratified *before* files are distributed. Late adoption invalidates all tie-breaks.  
  - **Anti-Gaming Clause**: Any member claiming indifference in Test 1 but later advocating a preference *must* justify the change with new evidence. If unable, their input is voided for that tie. The Chair may sanction repeated violations.  
  - **Minute Entry**: "Tie resolved per pre-adopted Protocol [Date]."

  ---

  ### **3. Termination, Escalation, and Value Judgments**  
  - **Decision**: True ties (passing Tests 1–3) use **Resolution** (Section 5).  
  - **Escalate to Chair**: If Tests 1–3 reveal:  
    - Asymmetric risk (Section 6);  
    - Deadlock over rubric interpretation;  
    - Evidence of bias (e.g., conflict of interest).  
  - **Stop for Values**: If disagreement stems from irreconcilable values (e.g., "Theory matters more than methods"), the Chair decides. Minute: "Value judgment applied by Chair per Protocol."

  ---

  ### **4. Ban on Invented Reasons**  
  - **Member Duty**: A "real" discriminator must be:  
    - Grounded in file evidence or rubric criteria;  
    - Believed by the member to reflect genuine merit;  
    - *Not* retrofitted to justify a desired outcome.  
  - **Fabrication Test**: "Would I have cited this if the candidates were not tied?" If no, it’s fabricated.  
  - **Minute Entry for True Ties**: "No merit distinction found. Tie broken by [Resolution Method]."

  ---

  ### **5. Resolution Methods for True Ties**  
  *Apply in order:*  
  1. **Open Randomization** (e.g., public coin flip, shuffled index cards).  
     - *When*: Default for isolated ties.  
     - *Why*: Reflects genuine indifference; auditable.  
  2. **Split Award** (e.g., half-stipend each).  
     - *When*: Budget allows *and* both are above cutoff.  
     - *Why*: Pareto-improvement without harm.  
  3. **Defer to Chair**.  
     - *When*: Asymmetric risk (Section 6) or time pressure.  
     - *Why*: Accountability rests with leadership.  
  4. **Reopen Search**.  
     - *When*: >2 true ties at cutoff *or* randomization would exclude >1 worthy candidate.  
     - *Why*: Avoids arbitrary exclusion of multiple deserving applicants.  

  **Repeated Ties Rule**:  
  - For the same applicant in consecutive cycles: **Independent randomization each cycle**.  
  - *Why*: Past outcomes don’t affect current merit. Compounding disadvantage is unjust.

  ---

  ### **6. Asymmetric Downside Risk**  
  - **Definition**: One erroneous choice causes significantly more harm (e.g., rejecting a marginalized scholar vs. a privileged one; reputational risk to the university).  
  - **Protocol**:  
    1. Escalate to Chair with risk assessment.  
    2. Chair may:  
       - Break the tie (minute: "Asymmetric risk invoked per Protocol");  
       - Split the award;  
       - Award an extra fellowship.  
  - *Do not* use randomization if harm is severe and avoidable.

  ---

  ### **7. What the Protocol Sacrifices**  
  - **Dropped Distinctions**:  
    - Philosophical "incommensurability" vs. "indifference" → treated identically.  
    - Moral weight of arbitrary choice → mitigated by randomization transparency.  
    - Epistemic uncertainty → compressed into 8-minute tests.  
  - **Trade-offs**: Speed over nuance; auditability over ethical perfection. Ten-minute limit forces binary outcomes (tie/not-tie), ignoring gradations of uncertainty.

  ---

  ### **Protocol in Action: Three Test Cases**  
  **Case 1: Identical Scores/Files**  
  - Test 1: No differences cited → Proceed.  
  - Test 2: Evidence complete/rubric functional → Proceed.  
  - Test 3: No expert judgment → **Resolution**: Randomize openly.  
  - *Minute*: "No merit distinction found. Tie broken by coin flip: [Winner]."  
  - **Why unpopular?** Feels "unfair" to lose by chance. **Follow it**: Indifference demands non-arbitrary arbitrariness.

  **Case 2: Five-Way Clump (Scores 26–27, Cutoff 26)**  
  - Test 1: Members note scores differ by 1 point → **Not a tie**.  
  - Test 2: If point gaps are noise (e.g., rubric inconsistency), reopen discussion. If no consensus, **Reopen Search**.  
  - *Minute*: "Score variance deemed de minimis. Search reopened; 3 additional fellowships awarded."  
  - **Why unpopular?** Resource-intensive. **Follow it**: Awarding by noise corrupts meritocracy.

  **Case 3: Internal vs. External Tie (Identical Scores)**  
  - Test 1: External member notes "informal knowledge" about internal candidate → **Disqualify all conflicted members** from this tie-break.  
  - Test 2: Remaining members reassess. If tie holds → **Defer to Chair**.  
  - *Minute*: "Conflict recusal applied. Chair awarded fellowship to [Candidate] based on file evidence alone."  
  - **Why unpopular?** Internal candidate may lose despite "known" merit. **Follow it**: Extra-file knowledge violates procedural justice.

  ---

  ### **What This Protocol Cannot Do**  
  - Resolve disputes about rubric design.  
  - Replace deliberation when scores *nearly* tie.  
  - Address systemic biases in scoring.  
  - Satisfy applicants who demand "reasons" for true ties.  

  ---  
  **Adoption Recommendation**: This protocol transforms philosophical indifference into auditable procedure. Its strength lies in pre-commitment: adopted early, applied uniformly, and documented honestly. While imperfect, it prevents worse evils—biased tie-breaks or fabricated reasons—and upholds the dean’s mandate for fairness.
