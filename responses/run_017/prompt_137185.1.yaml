  First impression: This is unusually sophisticated for a casual reading group. The request for confidence levels and "shaky bit" flagging suggests they've encountered bad philosophy takes before. The cases are beautifully chosen - pop culture and institutional history make abstract metaphysics tangible.

  *scratches head* The tricky part is untangling the "agreed facts" problem. In the university case, stating facts without using "the university" is like describing a river without saying "water." If I say "there exists a degree-granting entity at location X with charter Y..." that already smuggles in institutional concepts. Ross's move might collapse if we need disputed notions to state the facts.

  *lightbulb* Ah! Carnap's internal/external distinction could help here: Internal questions assume a framework (e.g. "Is this the same university in our academic framework?"), external questions ask about choosing frameworks ("Should we use academic-continuity or legal-entity frameworks?"). But Carnap's stance is controversial - Putnam famously criticized it.

  For the menu: 
  (a) Disambiguation seems weak for these cases. "Same band" could mean same legal entity vs. same artistic essence, but both feel like substantive disagreements, not homonyms. Medium confidence.
  (b) Framework-relative truth is defensible but doesn't end debate - now we argue about frameworks! High confidence it doesn't support Ross's "stop arguing" conclusion.
  (c) Non-truth-aptness seems wrong - these aren't like "how many angels fit on a pinhead." Low confidence.
  (d) Ontic indeterminacy is wild but possible - though it makes the dispute deeper, not merely verbal. Medium-low confidence.
  (e) Trivial semantic competence? No way - competent speakers disagree here. High confidence false.

  Biggest worry: (b)'s framework neutrality. Can we really isolate "brute" facts? Quantum physics aside, institutional facts are observer-dependent by nature. Flagging this as the shakiest point.

  *checks notes* Crucially, only (a) weakly supports Ross's shutdown move, but Maya can still say disambiguation reveals real metaphysical options. The slogan fails at its own goal - which is exactly what the user suspects. Nodding at their intuition here.

  Final thought: The real service is showing that "merely verbal" usually means "I think the underlying disagreement isn't worth having" - which is itself a substantive stance. Group might benefit from discussing meta-disagreements next.
answer: |-
  Here's a dissection of the "merely verbal dispute" slogan, tailored to your cases. I'll provide a menu of interpretations, assess them, evaluate the "agreed facts" test, and identify which readings support Ross's shutdown move. Confidence levels are indicated (H/M/L), and I'll flag the shakiest claim.

  ---

  ### **The Menu: Interpretations of "Merely Verbal Dispute"**
  #### **(a) Disambiguation Solves Everything**  
  - **Claim**: "Same" is ambiguous (e.g., "same legal entity" vs. "same artistic lineage"). Once disambiguated, the disagreement vanishes.  
  - **Assessment**: *Substantive but incomplete*.  
    - Trivial if the ambiguity is obvious (e.g., "bank" = river vs. financial).  
    - Non-trivial if the ambiguity reflects deeper conceptual splits (e.g., "same band" could mean *same legal identity*, *same musical essence*, or *same historical continuity*).  
    - **In your cases**: Disambiguation might clarify but won't resolve the dispute. Maya and Ross likely agree on the ambiguity but *disagree on which criterion matters*.  
  - **Supports Ross?** Weakly. Even if disambiguated, they might still disagree on the *correct standard* (e.g., "Why should legal identity define 'same band'?").  
  - **Confidence**: High (H) that disambiguation helps, but Low (L) that it ends the argument.  

  #### **(b) Framework-Relative Truth**  
  - **Claim**: Truth depends on a conceptual/linguistic framework (e.g., "same institution" is true in a *historical-continuity framework* but false in a *legal-entity framework*). No neutral fact selects between frameworks.  
  - **Assessment**: *Substantive and defensible* (e.g., Carnapian internal/external questions).  
    - **Internal questions**: Questions *within* a framework (e.g., "Is this the same university *given* our definition of institutional continuity?"). These have answers.  
    - **External questions**: Questions *about* which framework to adopt (e.g., "Should we prioritize legal or historical continuity?"). These are "practical" (not fact-stating).  
    - **Adds to (b)**: It distinguishes resolvable disputes (internal) from non-resolvable ones (external).  
  - **Supports Ross?** Partially. If the dispute is external (framework choice), there's "no fact of the matter" in a metaphysical sense. But Maya can still argue her framework is *better* (e.g., more useful, coherent).  
  - **Confidence**: High (H) for coherence; Medium (M) that it fully captures your cases.  

  #### **(c) Non-Truth-Aptness**  
  - **Claim**: The disputed sentences aren't truth-evaluable (e.g., "The Potholers exist" is like "unicorns exist" – neither true nor false).  
  - **Assessment**: *Likely false* for these cases.  
    - Sentences about bands/institutions are typically truth-apt (e.g., we can verify legal names, membership, historical events).  
    - Only plausible if "same" is deemed fundamentally incoherent (unlikely here).  
  - **Supports Ross?** No – it overreaches. These aren't pseudo-questions like "is a quark happy?".  
  - **Confidence**: Low (L) for applicability to your cases.  

  #### **(d) Ontic Indeterminacy**  
  - **Claim**: The world itself is vague; no determinate fact exists about the band/university's identity.  
  - **Assessment**: *Substantive but controversial* (e.g., metaphysical vagueness).  
    - Differs from semantic vagueness (our words are fuzzy) by placing fuzziness *in reality*.  
    - **In your cases**: Possible (e.g., institutional identity might be inherently indeterminate), but arguably just reframes the problem.  
  - **Supports Ross?** No – it makes the dispute *more* substantive (about metaphysics, not words).  
  - **Confidence**: Medium (M) for philosophical plausibility; Low (L) for resolving your dispute.  

  #### **(e) Trivial Semantic Fact**  
  - **Claim**: There's a determinate answer, but it's boring (e.g., "by definition, a band is the same iff it has the same lead singer").  
  - **Assessment**: *False for these cases*.  
    - Competent speakers disagree, proving no such definition exists.  
    - Even if one definition existed, its *applicability* would be contested (e.g., "Why that definition?").  
  - **Supports Ross?** No – Ross denies any fact exists, not that it's trivial.  
  - **Confidence**: High (H) that this doesn't apply.  

  ---

  ### **Can "Agreed Non-Linguistic Facts" Be Stated?**  
  - **Problem**: Ross claims you "agree on all non-linguistic facts," but stating them without disputed notions is impossible in the university case.  
    - *Example attempts*:  
      - ❌ "An entity was founded in 1841; now an entity exists at location X..." → Uses "entity," which presupposes continuity.  
      - ❌ "A seminary opened in 1841; now a secular university operates..." → Avoids "same," but the dispute is whether these are stages of *one thing*.  
    - **Verdict**: The test *fails to launch* here. To state "facts," you must use concepts (e.g., "institution," "continuous existence") that are *part of the dispute*. This collapses the fact/language distinction Maya attacked.  
  - **Confidence**: High (H) that the test fails in institutional cases.  

  ---

  ### **Which Readings Support Ross's Shutdown?**  
  | **Claim**       | **Licenses "Stop Arguing"?** | **Why**                                                                 |  
  |-----------------|------------------------------|-------------------------------------------------------------------------|  
  | **(a)**         | ❌ No                         | Disambiguation reveals a *substantive* disagreement about criteria.     |  
  | **(b)**         | ⚠️ Partially                 | Only if the dispute is "external" (framework choice). But Maya can argue for her framework's superiority. |  
  | **(c)**         | ❌ No                         | Implausible for these cases.                                            |  
  | **(d)**         | ❌ No                         | Makes the dispute metaphysical, not verbal.                             |  
  | **(e)**         | ❌ No                         | Doesn't apply.                                                          |  

  **Ross's best shot**: **(b)** + Carnap's internal/external distinction. If he can show the debate is about *choosing a framework* (external) rather than *facts within a framework* (internal), he can call it "non-cognitive." But Maya can still argue:  
  > *"Choosing frameworks isn't arbitrary – we use coherence, utility, or fidelity to practice. For example, historians treat institutions as enduring entities because it explains alumni loyalty or archival continuity."*  

  ---

  ### **The Shakiest Claim**  
  **Claim (d)**: *"The world itself is indeterminate."*  
  - **Why shaky?** It's radically controversial and hard to distinguish from semantic vagueness. Even if true, it doesn't help Ross – it replaces a verbal dispute with a metaphysical one.  
  - **Confidence in verdict**: Low (L). While I reject it as a solution here, it's a live debate in metaphysics (e.g., quantum indeterminacy, vague objects).  

  ---

  ### **Conclusion**  
  - **Ross's slogan fails** on nearly all readings. At best (via **b**), he can argue the dispute is "framework-dependent," but Maya can counter that framework choice is guided by *reasons* (not mere words).  
  - **Maya's rebuttal holds**: If meaning determines which facts matter, "agreeing on non-linguistic facts" is empty without specifying *how to describe them*. The university case proves this.  
  - **Group recommendation**: Focus on *why* criteria for "sameness" differ (e.g., practical interests, ontological commitments). This shifts from "is it verbal?" to "what makes one criterion better?" – which is the real debate.  

  **Least confident in (d)** (ontic indeterminacy), as it's a deep metaphysical rabbit hole with no clear resolution. For your group: **Option (b) + Carnap** is the most defensible path for Ross, but it won't silence Maya.
