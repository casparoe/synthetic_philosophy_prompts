  We are going to break down the Axiom of Choice (AC) in the context of type theory and programming languages. The goal is to translate the disputes around AC into the vocabulary of a PL theorist (dependent types, proof extraction, etc.) and to see what carries over and what doesn't.

  First, let's write AC in type-theoretic terms. In set theory, AC is usually stated as:

  > If for every element x of a set A there exists an element y of a set B such that R(x,y) (a relation between A and B), then there exists a function f: A → B such that for every x in A, R(x, f(x)).

  In type theory, we might try to express this as:

      Π (x : A), Σ (y : B), R x y   →   Σ (f : A → B), Π (x : A), R x (f x)

  But note: this is not the classical AC. Why? Because in type theory, the existential quantifier is typically represented by the Σ-type (dependent sum) which provides a witness. So the above type is inhabited by a function that, given x, produces a pair (y, proof) and then we can define f by taking f x = first component of that pair. So we have a term:

      λ p. (λ x. fst (p x), λ x. snd (p x))

  This is a constructive version of choice. It is provable without any axioms. So why is AC controversial?

  The issue is that in classical mathematics, the existential quantifier is often used in a non-constructive way, meaning that we do not require a witness to be provided. In set theory, the existential quantifier is not inherently constructive. So when we say "for every x there exists y such that R(x,y)", we are not claiming to have a function that produces y from x. The classical AC then asserts that there is a function f without giving a rule for it.

  To capture the classical AC in type theory, we must use a different interpretation of the existential quantifier. In particular, we can use a propositional truncation (also known as the squash type) to represent the classical existential. So we write:

      Π (x : A), ∥ Σ (y : B), R x y ∥   →   ∥ Σ (f : A → B), Π (x : A), R x (f x) ∥

  But note: this is not provable in general. In fact, this is the type-theoretic version of AC. However, even this is not quite the full classical AC because we are working in a constructive meta-theory. If we want to be classical, we might add this as an axiom.

  Alternatively, we can use the double negation translation. In classical logic, we can interpret the existential as:

      exists y. P(y)   ≡   not (forall y, not P(y))

  and then AC becomes:

      (∀x. ¬∀y. ¬R(x,y)) → ¬∀f. ¬(∀x. R(x, f(x)))

  But in type theory, we typically avoid double negations if we are constructive.

  Now, let's break down the three groups:

  1. **AC as unproblematic**: These are the classical mathematicians who see sets as arbitrary collections and functions as arbitrary assignments. In type theory, this corresponds to working in a system that includes the above axiom (with truncations) or in a system that is classical (like Lean with choice). The function f is not required to be computable or definable. It is an arbitrary function. In PL, this is like having a function type that includes non-computable functions. The PL counterpart: we can add an oracle or assume that all functions are given by their graphs without requiring computability.

  2. **Countable or Dependent Choice**: These are constructivists who accept some forms of choice but not the full one. In type theory, countable choice (AC_ω) is:

          Π (n : nat), ∥ Σ (x : A), R n x ∥   →   ∥ Σ (f : nat → A), Π (n : nat), R n (f n) ∥

     This is often accepted because the function f can be built by making a countable number of choices, which is seen as constructive. Similarly, dependent choice is a stronger form that allows the choices to depend on previous ones. In PL, these are acceptable because we can actually build such functions by induction on the natural numbers (for countable choice) or by well-founded recursion (for dependent choice). The function is definable.

  3. **Opposed to AC because it produces non-definable objects**: These are the strict constructivists (like some in the intuitionistic tradition) or those who care about definability. They reject full AC because it allows functions that cannot be defined by any rule. In PL, this is like requiring that every function be expressible by a term in the language. Without AC, we cannot build non-computable functions. The Banach-Tarski paradox and non-measurable sets are consequences of AC that are rejected because they violate the intuition that sets should have measurable sizes.

  Now, let's address your attempt:

  You wrote:

      forall x : A, exists y : B, R x y   →   exists f : A -> B, forall x : A, R x (f x)

  and if you interpret `exists` as Σ, then it is provable. That's because the Σ-type gives you a witness. But in set theory, the existential is not a Σ-type; it is a propositional existential. So the correct translation uses truncation.

  Thus, the dispute is about the interpretation of the existential quantifier. In set theory, the existential does not provide a witness, so we need an axiom to get the function. In type theory, if we use the propositional existential (truncated), then we need an axiom to get the function.

  Now, what about Banach-Tarski? In set theory, AC is used to decompose a sphere into non-measurable sets and reassemble them into two spheres. In type theory, if we are constructive, we might not even be able to define the non-measurable sets because they require non-constructive choices. So the counterpart in PL is the existence of non-computable functions and the ability to define functions that are not continuous (in the sense of computable analysis). However, without adding classical axioms, we cannot get Banach-Tarski in type theory.

  Residue report:

  - **What carried over cleanly**: 
    - The distinction between constructive and classical choice is captured by the use of truncation in the existential. The need for an axiom to recover a function from a propositional existential is clear.
    - Countable choice and dependent choice can be seen as principles that are admissible in constructive settings because they are definable by recursion.

  - **What fit after distortion**:
    - The idea of "arbitrary sets" in classical mathematics is translated as sets without a computable structure. In PL, we can model this by assuming a classical meta-theory or by adding axioms that give non-computable functions. However, the PL setting is inherently constructive (because terms are computable) unless we extend it with oracles or classical axioms.

    - The complaint about non-definable objects: In PL, without AC (as an axiom) we cannot define non-computable functions. But note: even without AC, we can still have non-computable functions if we add them as constants (oracles). The real issue is whether the language requires every function to be definable by a term.

  - **What has no expression in PL terms**:
    - The Banach-Tarski paradox itself: because it relies on the geometric structure of sets and measure theory. However, we can model measure theory in type theory, but without AC we cannot prove the existence of non-measurable sets. The residue here is that the paradox is a consequence of AC in set theory, but in type theory we can avoid it by not assuming AC. The deeper issue is that the paradox is a set-theoretic phenomenon that doesn't have a direct counterpart in type theory because type theory does not have the same notion of arbitrary sets.

    - The idea of "arbitrary function" in set theory is not directly expressible in PL because in PL functions are given by terms (which are computable) or by axioms (which are non-computable). The set-theoretic function space is much larger. However, we can model this by using a classical meta-theory or by adding choice axioms.

  But note: the residue might be because our PL vocabulary is too small? In the sense that we are working in a constructive meta-theory. If we extend our type theory with the law of excluded middle and choice, then we can do classical mathematics and get Banach-Tarski. But then we lose the computational content.

  Alternatively, we can use a system like Coq with the `Prop` universe (which is impredicative and proof-irrelevant) and add an axiom of choice. Then we can get classical AC. However, the extracted code will use axioms and be non-computable.

  Your advisor's offhand line: AC is Skolemization. That is right: Skolemization is the logical rule that from ∀x∃y.P(x,y) we get ∃f∀x.P(x,f(x)). But in first-order logic, Skolemization is a valid transformation (it preserves satisfiability). However, in set theory, the existence of the Skolem function requires AC because the domain might be arbitrary. So the fuss is about whether the Skolem function needs to be computable or not. In PL, if we are in a constructive setting, we can only Skolemize when we have a witness (so the function is computable). In classical logic, we can Skolemize without a witness, but then we are assuming AC implicitly.

  In summary:

  - The type-theoretic AC (with truncations) is the axiom that allows us to turn a propositional universal-existential into a function and then existentially quantify over it (propositionally).
  - The controversy in PL terms is about whether we allow non-computable functions (via axioms) or insist that every function is computable (so we reject full AC but accept countable/dependent choice because they are computable).

  So your friend from analysis is partly right: when you write a type that is inhabited by non-computable functions, you are assuming something like AC. But in the constructive fragment (without axioms), you are not. The key is the interpretation of the existential quantifier: if you use Σ, then you get computable functions; if you use truncated existential, then without AC you cannot get a function.

  Therefore, the translation is:

  - Set theory's existential → type theory's truncated existential (propositional)
  - AC in set theory → an axiom in type theory that lifts a truncated existential over a universal to a function in a truncated existential.

  And the disputes:

  1. Unproblematic: add the axiom and live with non-computable functions.
  2. Countable/dependent choice: accept only for countable domains or when the choices are dependent (and hence can be defined by recursion).
  3. Definiteness: reject AC and insist that every function must be computable (so only accept the constructive version of choice that comes from Σ-types).

  The residue: Banach-Tarski and non-measurable sets. These are consequences of AC in set theory. In type theory, if we assume classical AC, we can also prove them (if we have the right setup for measure theory). But without AC, we cannot. So the PL counterpart is the existence of non-computable functions and the ability to define pathological objects that break properties like measure. However, the specific geometric paradox might not arise in the same way because type theory doesn't have the same set-theoretic infrastructure. We can still have measure theory, but it is usually developed constructively (and then non-measurable sets cannot be shown to exist).

  Final note: The residue is partly because our PL vocabulary (with computable functions) is too small to capture arbitrary set theory. But by adding axioms, we can recover it. So the disagreement is about the size of the function space: only computable functions vs. all set-theoretic functions. And that is the core of the AC debate.
answer: |-
  ### Restating the Axiom of Choice Dispute in PL Vocabulary  
  Your analysis friend is **partially correct** but misses key nuances. Let's dissect the three perspectives using your PL framework (dependent types, proof extraction, etc.), preserving classical assumptions where needed. The core tension revolves around **existential quantification**, **definability**, and **what "exists" means** in a computational universe.

  ---

  ### 1. **AC as Unproblematic (Classical Set Theorist)**  
  **Perspective:**  
  AC is inherent to set theory. Sets are extensional, and functions are arbitrary assignments—no definability required.  

  **PL Translation:**  
  - **Key move:** Treat `exists` as **propositional truncation** (`∥_∥`), not `Σ`.  
  - **AC as a type:**  
    ```coq
    AC : ∏ (A : Type), ∏ (B : A → Type), 
          (∏ (x : A), ∥ Σ (y : B x), R x y ∥) → 
          ∥ Σ (f : ∏ (x : A), B x), ∏ (x : A), R x (f x) ∥
    ```  
    This is **not provable** without an axiom. The truncation hides witnesses, so no computable `f` is extractable.  
  - **Why unproblematic?**  
    In a classical metalanguage (e.g., ZFC + LEM), `∥_∥` is interpreted as "mere logical existence". The function `f` is a **non-computable oracle**—a black-box assignment. This mirrors:  
    - **Set theory:** Functions are graphs (subset of `A × B`), not programs.  
    - **PL:** `f` inhabits the type `A → B` but lacks a λ-term definition. It’s a "ghost" in the type system.  

  **Verdict:** Clean translation. AC licenses non-computable inhabitants in function types.  

  ---

  ### 2. **Skeptical of Full AC (Constructive/Countable Choice Advocate)**  
  **Perspective:**  
  AC for uncountable sets is "fishy"; countable/dependent choice (DC) is acceptable because choices can be serialized.  

  **PL Translation:**  
  - **Countable Choice (AC_ℵ₀):**  
    ```coq
    AC_ℵ₀ : ∏ (P : ℕ → Type), 
            (∏ (n : ℕ), ∥ P n ∥) → 
            ∥ ∏ (n : ℕ), P n ∥
    ```  
    Provable via **induction on `ℕ`** if `P` is suitably uniform. Extracts to a computable sequence.  
  - **Dependent Choice (DC):**  
    ```coq
    DC : ∏ (A : Type) (R : A → A → Type),
         ∏ (a₀ : A), ∥ Σ (f : ℕ → A), f 0 = a₀ ∧ ∏ (n : ℕ), R (f n) (f (n+1)) ∥
    ```  
    Uses **recursion + state**, often definable via coinduction or fuel.  
  - **Why balk at full AC?**  
    Full AC requires **uniformly gluing non-computable choices** across possibly uncountable domains. No recursion scheme or parametricity can capture this. In PL terms:  
    - Full AC violates **parametricity**: A term `f : A → B` should behave uniformly across inputs, but AC’s `f` is arbitrary.  
    - **Extraction fails:** No closed λ-term for `f` without oracle primitives.  

  **Verdict:** Mostly clean. Rejection of full AC = rejection of non-definable function inhabitants.  

  ---

  ### 3. **Opposed to AC (Definabilist/Constructivist)**  
  **Perspective:** AC "cheats" by claiming existence without construction. Banach-Tarski is nonsense.  

  **PL Translation:**  
  - **The core issue:** `∥ Σ y, R x y ∥` **erases the witness**. AC "invents" an unearned `f`.  
  - **Definability filter:**  
    - Accept only **`Σ`-types** (witness-present) for existence. Reject truncation-based existence.  
    - Constructive AC becomes:  
      ```coq
      Constructive_AC : ∏ (A B : Type) (R : A → B → Type),
                        (∏ (x : A), Σ (y : B), R x y) →
                        Σ (f : A → B), ∏ (x : A), R x (f x)
      ```  
      **Provable via `λ p. (λ x. (p x).1, λ x. (p x).2)`**. No axiom needed.  
  - **Banach-Tarski?**  
    - In PL: Non-measurable sets ≈ **terms that break canonicity**.  
      Example: A closed term `t : ℝ` that doesn’t reduce to a numeral but "claims" to be a real number.  
    - Banach-Tarski arises from **non-constructive reals + AC**. In PL:  
      - Constructive analysis (e.g., in Coq) **cannot define non-measurable sets** without axioms.  
      - With classical AC + LEM, you get "junk terms" like:  
        ```coq
        non_measurable_set : ∥ Set ℝ ∥   // Hides pathological decomposition
        ```  
      - These have **no computational content** and can’t be extracted.  

  **Verdict:** Definabilist critique translates perfectly. Banach-Tarski is **type-theoretically expressible** but requires axioms.  

  ---

  ### Where Your Translation Got Stuck  
  You wrote:  
  ```coq
  AC : (∀ x : A, ∃ y : B, R x y) → (∃ f : A → B, ∀ x : A, R x (f x))
  ```  
  and assumed `∃` = `Σ`. This **is provable** (as above), but this is **not the AC people dispute**. The dispute is about:  
  - **Truncated existence**: `∀ x, ∥ ∃ y, ... ∥` → `∥ ∃ f, ... ∥`.  
  - **Non-computability**: The inferred `f` has no λ-term.  

  Your advisor is **half-right**: AC is Skolemization, but:  
  - **Constructive Skolemization**: Uses `Σ` → no axiom, computable.  
  - **Classical Skolemization**: Uses truncation/LEM → non-computable, needs axiom.  

  ---

  ### Residue Report: What Doesn’t Translate  
  | **Aspect**                  | **Translation Status**                                  | **Why?**                                                                 |
  |----------------------------|---------------------------------------------------------|--------------------------------------------------------------------------|
  | **Non-measurable sets**    | **Partial fit** (expressible with axioms)               | Requires classical logic + AC in the metalanguage. In PL, they’re inhabited but non-computable terms. |
  | **"Arbitrary sets"**       | **Distorted**                                           | PL types are intensional (definable); set theory sets are extensional. The PL analogue is `Type` + axioms. |
  | **Uniformity of AC choices** | **Clean** via parametricity failures                    | AC violates parametricity: no single term works uniformly across models. |
  | **Banach-Tarski intuition** | **No direct counterpart**                               | Relies on Euclidean geometry + measure theory—no core PL analogue. But: if you add classical axioms, PL can *model* it. |
  | **"Mere existence" vs. construction** | **Perfect** (Σ vs. ∥∥)                          | Truncation erases witnesses; AC retroactively posits `f` without a term. |

  #### Why Residue Exists:  
  - **Your vocabulary isn’t too small**: It cleanly separates computable (`Σ`) vs. non-computable (`∥∥` + axioms) existence.  
  - **The philosophical disagreement reduces to computational content**:  
    - Classicists: "Existence" = consistent with ZFC. PL: "Existence" = term inhabitant.  
    - AC disputes are about **what counts as existence**. PL makes this explicit via truncation.  
  - **Banach-Tarski residue**: Not due to PL limitations—it’s a **consequence of classical axioms**. In PL, it’s a "red flag" that your theory has non-computable ghosts.  

  ### Conclusion  
  You can restate the entire AC dispute in PL:  
  - **Classical AC** ≈ Axiom adding non-computable inhabitants to function types.  
  - **Countable/Dependent AC** ≈ Provable recursion schemes.  
  - **Definabilist rejection** ≡ Banning truncation-based existence.  

  The "hundred-year argument" boils down to: **Should we allow function types to contain non-computable oracles?** PL doesn’t resolve the dispute—but it *does* force you to explicitly choose your notion of existence (Σ vs. ∥∥) and computational honesty. Your analysis friend is right that PL folks *can* assume AC quietly (via truncation + axioms) but wrong that it’s unavoidable: constructive math avoids it by demanding Σ-types.
