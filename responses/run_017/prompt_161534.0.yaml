prompt: |-
  I've been reading up on the experimental philosophy of action and came across a summary on the episode page of a popular philosophy podcast. I'd like to know how much of it to trust before I repeat it to anyone. Here is the passage, quoted in full:

  "Joshua Knobe ran a simple experiment. People read about a company chairman who was told that a new program would harm the environment, and who replied that he didn't care about the environment at all and only cared about profits. Asked whether the chairman harmed the environment intentionally, most people said yes. But when the same story was told with 'help' in place of 'harm,' most people said he did not help the environment intentionally — even though in both versions he plainly foresaw the side effect and was indifferent to it. The same asymmetry appears for 'deliberately' and 'on purpose,' and it appears no matter what order people read the two stories in. The moral valence of the outcome is therefore driving a judgment that ought to be purely factual: people's moral verdicts distort their view of the facts. But the distortion is not merely a bias, because Knobe's actual claim is stronger — our very concept of intentional action is partly constituted by moral considerations, so that when the outcome is bad, foresight plus indifference really is enough to make the bringing-about of it intentional, and when it is good it is not. That is why the result is said to refute the classical philosophical project of analysing intentional action in terms of belief, desire and causation: 'intentional' has no stable content to analyse, and the old dispute between simple and complex views of foreseen side effects is settled. The broader upshot is methodological: what people say in surveys about cases just is what the concept means, so experimental philosophy can replace armchair conceptual analysis rather than merely supplement it. And practically, anything that leans on the intended/merely-foreseen distinction — the doctrine of double effect, for instance, or the legal notion of intent — is resting on a distinction that is really just a moral judgment wearing a factual disguise, and should be abandoned or replaced by an explicitly normative test."

  Where I stand: I find the basic result plausible and the last paragraph suspicious, but I can't say why. I'd like a claim-by-claim audit rather than a verdict on the whole.

  Please separate, for each claim in the passage, (i) what an experimental philosopher working on this literature would accept as a fair statement of the finding, (ii) what is a common simplification or a slide between two things the literature keeps apart, and (iii) what a defender of the view would reject outright. In particular I want you to be explicit about the difference between the empirical finding, the competing explanations of it, and the philosophical conclusions people have tried to draw — and to flag places where the passage helps itself to more than one of these at once, or asserts two things that cannot both be true (it seems to me to say both that moral judgment distorts a factual judgment and that moral judgment partly constitutes the concept, but I may be misreading it).

  Two things I made up, which I'd like you to use as probes rather than as data. I am not asking whether anyone has run them; tell me what the main competing explanations would each predict about them, and whether the result would discriminate between those explanations.

  Probe one — the compliance engine. A firm's automated scheduling system is built to minimise cost, and its designers know, and the firm accepts, that running it will contaminate a local water supply; in a matched version it will instead improve the water supply. There is no question of the system caring, valuing, endorsing, or having a "deep self," and no question of its having reasons. Would the valence-sensitive, reason-based, deep-self/valuational, and pragmatic-or-expressivist ("intentionally" as a vehicle for blame) explanations of the asymmetry each predict that the asymmetry survives here, and with what, if anything, as the target of the attribution?

  Probe two — the pointless rule. Same chairman vignette, but the foreseen side effect is neither beneficial nor harmful: in one version the program will cause staff to breach an arbitrary, pointless office convention, and in the matched version it will cause them to comply with it. Does the driver of the asymmetry have to be moral valence, or would a norm-violation account or a general affect/valence account predict the same pattern? What would it mean for the "moral" in "moral considerations are constitutive" if the pattern held here?

  Finally: does the practical conclusion in the last sentence follow from the parts of the summary that survive correction? I care about two cases especially — the doctrine of double effect's intended-versus-foreseen distinction, and legal or institutional uses of "intent." Say what would follow for each if the finding is robust but the explanation is unsettled, and what would follow only on some explanations and not others. If a better way of putting the upshot exists, give it.

  Please work from the structure of the debate rather than from citations: I have no access to journals, so don't name studies, authors I can't check, or year-by-year findings — I want the shape of the disagreement, what turns on what, and where I should stay agnostic. Do tell me, though, which of my own glosses above are themselves misleading.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex philosophical summary they want audited, with specific concerns about conflated claims and practical implications. They clearly understand the core debate but sense overreaching in the podcast's conclusions. 

  First, I need to disentangle three layers in the quoted passage: (1) empirical findings (the Knobe Effect itself), (2) competing explanations (why it happens), and (3) philosophical conclusions drawn from it. The passage often blends these, especially by treating Knobe's constitutive claim as proven rather than contested. 

  The user's probes are brilliant tools here. For the compliance engine scenario, key theories would diverge: valence-based accounts might predict asymmetry persistence since harm/good distinction remains, while reason-based or valuational theories might not apply to non-agents. This exposes where the passage overgeneralizes from human agents. 

  The pointless rule probe attacks the "moral valence" assumption head-on. If asymmetry appears for non-moral norm violations, it undermines the claim that moral considerations specifically constitute intentionality. Pragmatic accounts could explain this via blame-worthiness - even for arbitrary rules. 

  On practical implications: The podcast's leap to abandoning legal intent distinctions is reckless. Even if the asymmetry is robust, institutional contexts deliberately narrow "intent" definitions precisely to avoid such biases. The doctrine of double effect might be vulnerable only if moral valence directly shapes intentionality judgments - which remains debated. 

  The user's suspicion about the last paragraph is spot-on. The methodological claim that surveys directly reveal concepts ignores how context shapes responses. And asserting that moral judgment "distorts" facts while also "constituting" concepts is indeed contradictory - one paints it as error, the other as conceptual truth. 

  For their own glosses: Calling the competing explanations "simplifications" slightly misrepresents - they're substantive theoretical alternatives. Also, the "no stable content" conclusion depends entirely on accepting Knobe's constitutive view over alternatives. 

  Ultimately, the passage's biggest flaw is presenting contested interpretations as settled findings. The probes help show why we must separate: what we observe (asymmetry), why it happens (multiple live theories), and what it means (philosophically disputed).
answer: |-
  Here's a claim-by-claim audit of the passage, separating findings, explanations, and philosophical conclusions, followed by analysis of your probes and practical implications. Key distinctions: **Empirical Finding** (what the data shows), **Explanations** (competing theories *why* it happens), and **Philosophical Conclusions** (broader implications drawn, often contested).

  **Passage Claim:** *"Joshua Knobe ran a simple experiment. People read about a company chairman who was told that a new program would harm the environment, and who replied that he didn't care about the environment at all and only cared about profits. Asked whether the chairman harmed the environment intentionally, most people said yes. But when the same story was told with 'help' in place of 'harm,' most people said he did not help the environment intentionally — even though in both versions he plainly foresaw the side effect and was indifferent to it."*

  *   **(i) Fair Statement:** This accurately describes the core empirical finding – the "Knobe Effect" or "Side-Effect Effect." Asymmetry in intentionality judgments for harmful vs. beneficial foreseen side effects, despite identical foresight and indifference.
  *   **(ii) Simplification/Slide:** It slides between *judgment* and *concept*. It presents the asymmetry as a *finding* about judgments, but immediately frames it as revealing something about the *concept* "intentional action." The finding is about judgments; what it reveals about the concept is debated.
  *   **(iii) Rejection:** Defenders of classical analysis reject the implication that this *proves* the concept itself is asymmetric. They argue it shows a *bias* in *application* of the concept under specific conditions.

  **Passage Claim:** *"The same asymmetry appears for 'deliberately' and 'on purpose,' and it appears no matter what order people read the two stories in."*

  *   **(i) Fair Statement:** Correct. The asymmetry is robust across synonyms ("intentionally," "deliberately," "on purpose") and presentation order. This strengthens the finding's reliability.
  *   **(ii) Simplification/Slide:** None major here. This addresses methodological concerns.
  *   **(iii) Rejection:** Generally accepted as empirical fact.

  **Passage Claim:** *"The moral valence of the outcome is therefore driving a judgment that ought to be purely factual: people's moral verdicts distort their view of the facts."*

  *   **(i) Fair Statement:** Fair summary of one major *interpretation*: moral evaluation influences the intentionality judgment.
  *   **(ii) Simplification/Slide:** Crucial slide between **finding** (valence correlates with judgment) and **explanation** (moral verdicts *distort* a factual judgment). This presumes:
      1.  There *is* a purely factual judgment about intentionality independent of morality.
      2.  The "distortion" is an *error*.
      Many explanations reject (1), and Knobe's constitutive view rejects both (1) and (2).
  *   **(iii) Rejection:** Knobe and defenders of the constitutive view reject the "distortion" characterization. They argue moral considerations are *part of* the factual judgment about intentionality, not a distortion of it. Pragmatic accounts might see it as strategic communication, not distortion.

  **Passage Claim:** *"But the distortion is not merely a bias, because Knobe's actual claim is stronger — our very concept of intentional action is partly constituted by moral considerations, so that when the outcome is bad, foresight plus indifference really is enough to make the bringing-about of it intentional, and when it is good it is not."*

  *   **(i) Fair Statement:** Accurately presents Knobe's core *philosophical conclusion/explanation* (the "constitutive claim").
  *   **(ii) Simplification/Slide:** Slides between **Knobe's claim** and **established fact**. This is Knobe's *interpretation* of the finding, not the finding itself. Many competing explanations exist.
  *   **(iii) Rejection:** Opponents strongly reject this constitutive claim. They argue the concept itself is symmetric; the asymmetry arises from biases in application, pragmatic factors, or the influence of other concepts (like blame/praise).

  **Passage Claim:** *"That is why the result is said to refute the classical philosophical project of analysing intentional action in terms of belief, desire and causation: 'intentional' has no stable content to analyse, and the old dispute between simple and complex views of foreseen side effects is settled."*

  *   **(i) Fair Statement:** Fair statement of the *conclusion Knobe and some experimental philosophers draw* from their interpretation.
  *   **(ii) Simplification/Slide:** Slides massively between **finding** -> **Knobe's explanation** -> **philosophical conclusion**. It presents this refutation as a direct consequence of the *result*, ignoring that it depends entirely on accepting Knobe's constitutive claim over competing explanations. The "no stable content" claim is highly contested.
  *   **(iii) Rejection:** Defenders of classical analysis (and proponents of other explanations) vigorously reject this. They argue:
      *   The concept *does* have stable content (belief, desire, guidance/control).
      *   The Knobe Effect shows how *extraneous factors* (like blame) influence judgments *about* that concept in specific cases, not that the concept lacks content.
      *   The side-effect debate might be informed by the finding, but not "settled" in favor of asymmetry being fundamental to the concept.

  **Passage Claim:** *"The broader upshot is methodological: what people say in surveys about cases just is what the concept means, so experimental philosophy can replace armchair conceptual analysis rather than merely supplement it."*

  *   **(i) Fair Statement:** Accurately states a strong *methodological claim* made by some proponents of the "negative program" in experimental philosophy (X-Phi), based partly on findings like this.
  *   **(ii) Simplification/Slide:** Slides from **one finding/interpretation** to a **sweeping methodological conclusion**. Ignores critiques of survey methods (e.g., context-sensitivity, framing effects, competence concerns). Presumes folk judgments *directly* reveal conceptual content without mediation.
  *   **(iii) Rejection:** Widely rejected by many philosophers (including many experimental philosophers - the "positive program"). Critics argue surveys reveal *judgments* influenced by many factors (pragmatics, biases, context); conceptual analysis requires careful interpretation and argument, not just polling. Most see X-Phi as supplementary.

  **Passage Claim:** *"And practically, anything that leans on the intended/merely-foreseen distinction — the doctrine of double effect, for instance, or the legal notion of intent — is resting on a distinction that is really just a moral judgment wearing a factual disguise, and should be abandoned or replaced by an explicitly normative test."*

  *   **(i) Fair Statement:** Fair statement of a radical *practical implication* drawn by *some* based on accepting Knobe's constitutive claim and the methodological claim above.
  *   **(ii) Simplification/Slide:** Slides from **finding/interpretation** to **prescriptive conclusion**. Assumes the Knobe Effect reveals the *essential nature* of the distinction everywhere it's used.
  *   **(iii) Rejection:** Strongly contested. Critics argue:
      *   Institutional concepts (like legal intent) are often *stipulatively defined* precisely to avoid folk biases and focus on specific mental states (purpose vs. knowledge).
      *   DDE proponents argue the distinction *is* normative but also tracks a real difference in intentional structure relevant to permissibility.
      *   Findings about folk judgments in specific vignettes don't automatically invalidate carefully constructed philosophical or legal distinctions used in different contexts.

  **Addressing the Apparent Contradiction:**
  The passage *does* say both "distort their view of the facts" and "partly constituted by moral considerations." These are **competing explanations**, presented confusingly as sequential points. The "distortion" view implies a *mistake*: people know the *real* (non-moral) facts about intentionality but let morality cloud that judgment. The "constitutive" view rejects this: morality is *part of* determining the (local) facts about intentionality itself; there's no distortion, just how the concept works. These views are incompatible.

  **Analyzing Your Probes:**

  1.  **The Compliance Engine (Non-Agent):**
      *   **Valence-Sensitive (Basic):** Predicts asymmetry survives. Bad outcome? -> "Intentional" attribution to *someone* (designers? firm?). Good outcome? -> "Not intentional". (Target: Attribution likely shifts to designers/firm).
      *   **Reason-Based/Deep Self/Valuational:** Predicts asymmetry *diminishes or vanishes*. No beliefs/desires/reasons/deep self in the *actor* (the engine). May see attribution to designers/firm, but asymmetry weaker as the "indifference" isn't an *attitude* of an agent.
      *   **Pragmatic/Expressivist (Blame Vehicle):** Predicts asymmetry survives *if* people feel blame/praise is warranted *towards someone* (designers/firm). "Intentional" used to express blame for the harm. Target: Blame directed at responsible humans.
      *   **Discriminates:** Strong asymmetry supports valence-based or pragmatic views over reason-based/valuational views *if* the target is the engine itself. If attribution shifts to humans, it's messier.

  2.  **The Pointless Rule (Norm-Violation without Moral Valence):**
      *   **Moral Valence Account:** Predicts *no asymmetry* or weak asymmetry. No moral good/bad involved.
      *   **Norm-Violation Account:** Predicts asymmetry survives. *Violating* the convention (bad?) -> Intentional. *Complying* with it (good?) -> Not intentional. "Bad" = norm violation, "Good" = norm compliance.
      *   **General Affect/Valence Account:** Might predict asymmetry if violating the rule feels "bad" (annoying, disruptive) and complying feels "good" (orderly, expected), even without morality.
      *   **Implication for "Moral" in Constitutive Claim:** If asymmetry holds here, it weakens the claim that *specifically moral* considerations are constitutive. It suggests norm-violation, social expectation, or general positive/negative valence might be the driver. Defenders might argue "normative" considerations broadly (incl. conventions) are part of the concept, or that people *imbue* pointless rules with pseudo-moral significance.

  **Practical Conclusions & Your Two Cases:**

  *   **If Finding Robust but Explanation Unsettled:**
      *   **Doctrine of Double Effect (DDE):** Raises concerns that the intended/foreseen distinction *in folk judgment and intuitions* is influenced by outcome valence. Suggests DDE needs careful defense against the charge that its intuitive appeal relies partly on this bias. Doesn't *refute* DDE, as DDE is a normative principle *using* a conceptual distinction; it just shows the folk concept might not perfectly align with the distinction DDE needs.
      *   **Legal/Institutional "Intent":** Highlights the *risk* of valence bias influencing judgments of intent (e.g., jurors, investigators). Strongly motivates using carefully defined, stipulative legal criteria (like "purpose" or "knowledge" in Model Penal Code) that are *less sensitive* to outcome valence than the folk concept, precisely to mitigate this bias. Doesn't imply abandonment, implies the need for robust, valence-resistant definitions/procedures.

  *   **If Knobe's Constitutive Claim is Correct:**
      *   **DDE:** Severely undermines DDE. If "intentional" *fundamentally* incorporates moral badness for side-effects, then the distinction DDE relies on (intended vs. merely foreseen) collapses *for bad side-effects* – foreseen bad effects become intentional by definition when they occur, making DDE's permission harder to achieve. DDE might need radical reformulation or abandonment.
      *   **Legal Intent:** Suggests the folk concept underlying "intent" is inherently morally laden and unstable. Could argue for abandoning "intent" as a *factual* element in favor of explicit normative tests (e.g., "was the outcome justified?" or "was avoiding the outcome a required priority?"). However, strong counterarguments remain about institutional competence and the need for predictable, defined standards.

  *   **Better Upshot:** The Knobe Effect robustly demonstrates that moral (or normative/evaluative) valence significantly influences *folk judgments* of intentional action for foreseen side effects. This challenges purely descriptive, non-evaluative analyses of the *folk concept* and reveals a potential source of bias in applying the intended/foreseen distinction. It necessitates greater caution in relying on untutored intuitions in philosophy and law, and motivates the development of more precise, theoretically grounded definitions for institutional purposes. The *precise nature* of valence's influence (causal bias, pragmatic expression, or conceptual constitution) remains a central debate, with significant implications for philosophy of action, ethics, and law.

  **Your Glosses:**
  *   "the last paragraph suspicious": Well-founded. It makes the most sweeping and least supported claims (methodological revolution, practical abandonment of distinctions).
  *   "moral judgment distorts... and that moral judgment partly constitutes": You correctly spotted the tension. The passage presents them sequentially, but they are rival explanations. Distortion implies error; constitution implies it's part of the concept's function.
  *   "competing explanations would each predict": Excellent framing for your probes.
  *   "what would it mean for the 'moral'...": Perfect question for the pointless rule probe.

  **Key Agnosticisms:**
  1.  **Why the asymmetry occurs:** Is it distortion, conceptual constitution, pragmatic expression, skill attribution, blame validation, etc.? The debate is live.
  2.  **Scope of the effect:** How generalizable is it? (Your probes help test this). Is it specific to agents, to side-effects, to certain relationships?
  3.  **Implications for the *nature* of the concept:** Does the folk concept *itself* have asymmetric conditions built-in (Knobe), or is it symmetric but applied asymmetrically due to other factors?
  4.  **Methodological implications:** Does X-Phi *replace* armchair analysis? Most philosophers (including many in X-Phi) say no; it complements and challenges it.
  5.  **Practical implications:** Does the finding *require* abandoning DDE or legal intent? Almost certainly not. It suggests caution, refinement, and awareness of bias. Abandonment only follows if you accept the strongest constitutive and methodological claims.
