prompt: |-
  So I got roped into chairing my university's curriculum committee this year, which I assumed would be pure busywork right up until I noticed this: we vote separately on whether a proposed course satisfies each of several requirements (writing-intensive, quantitative reasoning, whatever else), and then we vote on whether it counts toward the major — and the overall verdict sometimes flatly contradicts the votes on the parts. A colleague mentioned this thing has a name and a whole literature attached to it, and I've been falling down that rabbit hole in my spare time since.

  Two wrinkles make it more than a textbook case for me. First, I'm the one who writes the ballot, so I choose the decomposition into sub-questions — and I've noticed I can pretty much steer the outcome by slicing a course's requirements differently, which is either a superpower or an ethical problem. Second, we've started using an LLM as a kind of clerk: I can ask it each sub-question separately and derive the verdict, or ask it for the verdict straight, and because it's stochastic and I sometimes rephrase, it hands back a little cloud of answers rather than one. So we're aggregating across a population of model-judgments as well as across seven humans, and nobody has any idea whether that thing should count as one more voter, as a tie-breaker, as a supplier of reasons, or not at all. It also matters that the sub-questions aren't all the same kind: on some everyone quietly defers to whichever member actually knows the subject matter, and on others it's straight-up politics.

  Constraints: me, roughly one day a week for a semester, one grad assistant who is very good with spreadsheets, no software budget, and the output has to be a written protocol that seven tired faculty will actually follow and that the dean won't laugh at.

  I'll write the protocol myself — what I want from you is a defended agenda for my limited thinking time: which questions about aggregating connected judgments I should actually grind on, in what order, and why that order. What's genuinely upstream of what, what's tractable for someone who is not a logician, what I should stop worrying about because the answer wouldn't change the protocol, and — the part I care most about — what I could dig out of our own past voting records that would move a question up or down the list. Also be honest about which bits of this literature people get excited about that are basically irrelevant to a committee like mine.
reasoning: |-
  Okay, let me start by unpacking this user's problem. They're chairing a curriculum committee and noticed a contradiction in their voting process: sub-votes don't always align with the final verdict. Plus, they're using an LLM as a clerk, which adds complexity. The user wants to prioritize their limited time on which aggregation issues to tackle first.

  First, I need to understand the core issue: judgment aggregation paradoxes. The classic example is the discursive dilemma, where separate votes on premises lead to a different outcome than a direct vote on the conclusion. The user can control how they split the questions, which affects outcomes. That's a key leverage point.

  Then there's the LLM aspect. It's stochastic, so multiple runs give a cloud of answers. How to integrate that with human votes? Treating it as another voter might not be fair. Also, the sub-questions vary in nature—some technical, some political. The assistant has to consider how these differences impact aggregation.

  Constraints are tight: one day a week, a grad assistant for spreadsheets, no budget. The output is a protocol that seven faculty will follow. Practicality is crucial. The user wants to know what's upstream, tractable, and what data from past votes could inform decisions.

  I should break down the problems hierarchically. Start with the human voting process since it's the foundation. Without fixing that, adding the LLM complicates things. The decomposition strategy is critical because the user sets the ballot. They need to establish consistent rules for how to structure sub-questions to avoid manipulation.

  Next, aggregating human votes. The key is the connection between sub-votes and final verdict. The protocol must define how these relate. For example, if all sub-requirements pass, does that automatically mean the course passes? That's where past data helps. Check if contradictions happened and why. Were there patterns, like certain requirement combinations causing issues?

  Then, integrating the LLM. It's tricky because of its stochastic nature. Maybe use it for generating reasons or pre-screening, not as a voter. Testing different prompts on past cases could show how reliable it is. But this should come after solidifying the human process.

  Past voting records are gold. Analyzing them can reveal how often contradictions occur, which requirements conflict, and if decomposition methods influenced outcomes. The grad assistant can crunch this data in spreadsheets. For instance, flag cases where sub-votes passed but the course failed, or vice versa.

  What to avoid? Theoretical debates on impossibility theorems. Focus on practical heuristics instead. Also, faculty deference on specialized topics—maybe assign specific sub-questions to experts, but formalize that in the protocol.

  Order of priority: Human decomposition first, then aggregation rules, then LLM role. Past data analysis should start early to inform decisions. Testing decomposition strategies with past cases can show what works. Finally, pilot the protocol before full implementation.

  Ethics of decomposition strategy is important. The user can steer outcomes by how they slice questions. The protocol needs guidelines to ensure fairness, like tying sub-questions directly to catalog requirements and avoiding ambiguous phrasing.

  In summary, prioritize human processes first, use data to guide decisions, keep LLM integration simple initially, and ensure the protocol is transparent and practical for tired faculty. Avoid overcomplicating with theory where heuristics suffice.
answer: |-
  Here’s a battle-tested agenda for your limited time, prioritizing practical protocol design over theoretical rabbit holes. Focus on **upstream decisions first**—what *must* be settled before anything else works—and leverage past data to cut through noise.  

  ### Core Priority Order (With Why & Time Allocation)
  1.  **Define the Relationship Between Sub-Votes & Final Verdict (Weeks 1-3)**  
      *   **Why upstream?** This is the root of your "contradictions." Until you decide how sub-votes *determine* the overall verdict, everything else (LLM use, decomposition) is unstable.  
      *   **Tractable Question:** *"Does passing all sub-requirements automatically imply course approval, or can the committee override?"*  
      *   **Past Data Power Move:**  
          *   Task your GA: Mine past votes. Flag every case where:  
              *   All sub-reqs passed, but course was rejected (`A`).  
              *   One+ sub-req failed, but course was approved (`B`).  
          *   **Crucial:** Categorize `A`/`B` cases by *reason* (e.g., "overlap concerns," "departmental politics," "hidden prerequisite gap").  
          *   **Output:** A simple report: "In 12% of cases, sub-votes and final vote conflicted. Top reasons: X (50%), Y (30%), Z (20%)."  
      *   **Protocol Impact:**  
          *   If `A`/`B` cases are rare/explainable → Recommend "Sub-votes determine verdict; override requires 2/3 majority + written justification."  
          *   If frequent/arbitrary → Harder: Force explicit "tiebreaker" rules *or* abandon sub-votes for holistic judgment (politically risky).  
      *   **STOP WORRYING ABOUT:** Impossibility theorems (like List-Pettit). They prove *perfect* aggregation is impossible, but you need *workable* rules, not perfection.

  2.  **Establish Decomposition Ethics & Heuristics (Weeks 4-6)**  
      *   **Why now?** Your "superpower" is real. Protocol must constrain ballot design *before* tackling LLM or finer aggregation.  
      *   **Tractable Questions:**  
          *   *"What principle defines a 'valid' sub-question? (Must map to catalog requirement? Be objectively verifiable?)"*  
          *   *"How to handle ambiguous/multi-facet requirements?"*  
      *   **Past Data Power Move:**  
          *   GA: For courses with identical *intended* requirements, compare how sub-questions were *phrased differently* across ballots.  
          *   Correlate phrasing (e.g., broad vs. narrow "writing-intensive" questions) with approval rates *for that requirement*.  
      *   **Protocol Impact:** Draft binding rules:  
          *   "Sub-questions must directly mirror *official* requirement definitions (Dean's office source)."  
          *   "Compound requirements (e.g., 'QR *and* ethics') get split unless defined as atomic."  
          *   "Chair must circulate ballot draft 72h early; objections force re-phrasing."  
      *   **STOP WORRYING ABOUT:** Optimal decomposition for truth-tracking (epistemic AG). Your context has politics/deference – aim for *transparency* and *procedural fairness*, not ideal epistemology.

  3.  **Clarify Human Voting Dynamics (Weeks 7-8)**  
      *   **Why now?** Aggregation rules depend on *who* votes and *how*. LLM integration relies on understanding human baseline.  
      *   **Tractable Questions:**  
          *   *"When does 'deference' happen? Can we formalize it (e.g., designating a 'primary assessor' per requirement)?"*  
          *   *"How do we handle abstentions/conflicts on sub-votes?"*  
      *   **Past Data Power Move:**  
          *   GA: Analyze voting dispersion. High variance on technical sub-questions? Near-unanimity on political ones?  
          *   Note abstention rates by requirement type.  
      *   **Protocol Impact:**  
          *   Formalize deference: "For [Specific Tech Req], Prof. X is primary assessor; others may defer. Vote recorded as 'Aye (Deferred)'."  
          *   Set abstention rules: "Abstain only for conflict of interest; else, vote required."  
      *   **STOP WORRYING ABOUT:** Sophisticated voting strategy (game theory). Faculty vote sincerely on curriculum.

  4.  **Define the LLM's Role (Minimalist Phase) (Weeks 9-10)**  
      *   **Why last?** LLM is noise if human processes are broken. Start simple; iterate later.  
      *   **Tractable Questions:**  
          *   *"Is the LLM a *voter*, an *advisor*, or a *clerk* (generating text only)?"*  
          *   *"What single, replicable task gives most value for least risk?"*  
      *   **Data Power Move (Limited):**  
          *   Sample 20 past proposals. Have LLM (fixed prompt) answer sub-questions + verdict. Compare to human votes.  
          *   **Key Metric:** Does LLM *consistency* (across multiple runs) on a sub-question match human consensus? If yes, maybe useful as a clerk.  
      *   **Protocol Impact:** **Recommend STARTING WITH:**  
          *   "LLM acts as *clerk only*: Generates draft summaries of course content/syllabus *against* requirement definitions pre-vote (saving committee time)."  
          *   **NOT a voter.** **NOT a tie-breaker.** *Maybe* let it generate "potential concerns" if human votes conflict.  
          *   **Mandate:** "LLM prompts/outputs archived verbatim."  

  ### What to Ignore (Despite the Literature's Allure)
  *   **Arrow's Theorem / Social Choice Deep Dives:** Concerns ranking *preferences*, not aggregating *judgments* on truth-apt questions. Moot for your case.
  *   **Fancy Fusion Algorithms (e.g., Bayesian):** Requires impossible probability estimates from faculty. Stick to majority/plurality/supermajority.
  *   **LLM as Ideal Reasoner:** It's not. Treat it as a flawed, stochastic pattern-matcher. Focus on its *practical utility*, not theoretical promise.
  *   **Full Formalization of "Reasons":** Leads to infinite regress. Your protocol needs "written justification" only for overrides (Priority 1).

  ### Critical Success Factors
  *   **Leverage Your GA:** Their spreadsheet skills are key for fast data digs (Past Votes → Insights). Frame questions *they* can answer quantitatively.
  *   **Pilot the Protocol:** Run 2-3 *real* but non-critical proposals through a draft protocol. Refine based on friction.
  *   **Dean Early-Buyin:** Midway (after Priority 1), share the contradiction data and your proposed fix. "We found X problem; our fix is Y; this avoids Z chaos."
  *   **Ethics Guardrail:** Bake into the protocol: "The Chair's decomposition must be justifiable solely by reference to published university requirements."

  **Why This Order Wins:** You fix the *structural* flaw causing contradictions first (Priority 1). You then prevent chair manipulation (Priority 2) and human confusion (Priority 3) *before* adding LLM complexity (Priority 4). Past data directly informs the highest-leverage decisions. The output is a protocol that's **auditable** (rules for decomposition/voting), **pragmatic** (accepts human flaws), and **defensible** ("We analyzed our past errors and fixed them"). Good luck, Chair!
