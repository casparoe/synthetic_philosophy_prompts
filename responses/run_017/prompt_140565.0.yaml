prompt: |-
  I'm in a tiny reading group on animal minds — half philosophy grad students, half vet students — and we keep running into the same thing, and I don't have a word for it. Here's the shape of it. We read a paper where crabs with a damaged claw kept grooming the injured area for ages, gave up a shelter they normally liked in order to avoid a place where they'd been shocked, and stopped acting like that when they were given a local anaesthetic. The authors concluded that this is consistent with nociception and doesn't show that the animal is in pain. But in the same week someone brought in a case study of a dog doing a quarter of that and nobody hedged at all — the dog was described as being in pain, full stop. Then with fish it happened again: a fish given something noxious stops doing its usual things, rubs the spot, changes what it'll swim through, and the changes go away if you give it the same drugs we'd call painkillers; and the response from the skeptic in our group was that it's all reflexes and that fish don't have the brain structures that consciousness requires — except the structures he named were mammalian ones, which seems like it settles the question by definition rather than by evidence. What I keep noticing isn't that people are sceptical. It's that identical behavioural evidence gets treated as strong in one animal and as almost nothing in another, and the difference never seems to come from the evidence.

  And when you push on it, the person never says what would be enough. I've started asking directly — what would you accept as evidence that a shrimp, or a bee, or a fish, is conscious? — and I get one of two answers: either a shrug and "it's a hard problem, we don't have a test yet", said by someone who keeps arguing as if the answer were no, or a demand for something that couldn't possibly be evidence for anything, like a report from the animal itself, or a neural signature that has already been matched against a human one. And that second one is the bit that interests me most, because if the extra ingredient you're asking about makes no difference to what the animal does or how its behaviour is organised, then no amount of behaviour was ever going to count, and the demand isn't really a demand for evidence. One of the vet students says I'm overthinking it and this is just Bayesian: if you start with a strong prior that mammals feel pain and insects don't, the same evidence rationally moves you different amounts and there's nothing wrong with that. I half believe her, but it doesn't feel like the whole story, because nobody in these arguments owns the prior — they present the asymmetrical treatment as a judgment about how good the evidence is. I've also been told it's just speciesism, but that's a moral accusation and I'm asking about what's going on in the reasoning. And I half remember a word beginning with anthropo- for refusing to see mental states in animals (anthropodenial? I might have that wrong) but that seems like a knee-jerk attitude, whereas what I'm describing is careful, argued, and sometimes right. The thing that makes me think it's a real pattern and not just me being annoyed is the parallel I read about, unless I'm misremembering it, where patients diagnosed as unresponsive were later found, using brain scanners, to be able to follow instructions — same structure, same refusal, and there it turned out to be an actual mistake with stakes.

  So: does this have a name, or a literature, or is it just three or four different things I'm lumping together? I don't want a bare label — I want the carving. Roughly: what exactly is the phenomenon (or phenomena), what is it not, and where are its edges? If there's an established concept that nearly fits, tell me how what I described differs from it and whether the fit is good enough anyway; if the nearest concepts are several, say which fits which of my cases. If there's genuinely nothing, coin something for me and define it tightly enough that I could tell whether a given case is an instance, including the awkward cases — like the AI version, where the same move happens in the other direction and every bit of behaviour gets explained away as pattern-matching, or the case where the sceptic turns out to have been right. And tell me whether it's a mistake at all, or just what good reasoning looks like when the prior is doing the work. Anway, one more thing: please flag which parts of your answer are uncontroversial among people who actually work on this, which are one side of a live dispute (the fish-cortex thing, the insect thing, the whole methodology of inference here), and which are just your own take — I don't want to walk into the group on Tuesday repeating a contested position as though it were the consensus, so say how confident you are in each bit.
reasoning: |-
  Okay, let me unpack this user's query. They're part of a reading group on animal minds, with philosophy grad students and vet students. The issue they're facing is a consistent asymmetry in how behavioral evidence is interpreted across different species. For example, crabs showing pain-like behaviors are dismissed as mere nociception, while similar behaviors in dogs are accepted as clear evidence of pain. The user is frustrated because skeptics demand impossible evidence for non-mammalian consciousness but treat mammalian pain as obvious.

  First, I need to identify the core phenomenon: differential thresholds for evidence based on prior assumptions about consciousness. The user mentions Bayesian reasoning as a possible explanation but feels it's incomplete because participants frame it as an evaluation of evidence quality, not prior beliefs. They also reference anthropodenial and draw a parallel to misdiagnosed unresponsive patients, highlighting real-world stakes.

  The user wants a precise conceptual breakdown. They're not just looking for a label but a detailed analysis of what this phenomenon is, its boundaries, and how it differs from related concepts. They also need clarity on which parts are consensus versus disputed in the field.

  I should start by defining the phenomenon. The key here is the shifting burden of proof based on species category, not evidence. Terms like "criterial shift" or "differential evidential thresholds" come to mind. But I need to distinguish this from anthropodenial (denying human-like traits in animals) and anthropocentrism (human-centered bias). The user's case involves more than denial—it's an evidentiary double standard.

  Next, the Bayesian explanation: priors influencing evidence interpretation is uncontroversial in theory. But the user notes that participants don't acknowledge their priors, presenting the asymmetry as objective evidence assessment. This points to a possible lack of metacognition or motivated reasoning.

  The concept of "criterion problem" from consciousness studies fits here—the lack of independent markers for consciousness forces reliance on proxies, leading to category-based assumptions. For non-mammals, skeptics demand human-like neural correlates, creating an impossible standard. This is contested, especially for fish and insects where evidence of complex cognition is growing.

  I should also address the user's examples. The crab study shows injury responses dismissed as reflexes, while similar dog behaviors are accepted. The fish case involves rejecting pain despite behavioral parallels because of absent mammalian brain structures. This is anthropocentrism in neural criteria, a disputed area. The AI analogy shows the reverse: over-attributing consciousness to machines based on behavior.

  The user needs to know where consensus lies. Most researchers agree that behavior is central to inferring mental states, but disagreement exists on necessary neural correlates. For mammals, the consensus is strong; for fish and insects, it's actively debated. Demanding first-person reports is widely seen as unreasonable.

  Finally, I'll structure the answer to separate uncontroversial points (Bayesian reasoning, criterial problem), disputed areas (neural correlates for non-mammals), and my synthesis (shifting burden of proof as a distinct phenomenon). Highlighting the parallel to misdiagnosed patients underscores the real-world impact of such biases.
answer: |-
  Based on your description, you're identifying a **robust and well-documented phenomenon** in cognitive ethology, philosophy of mind, and animal welfare science. It's not just annoyance, nor is it one single thing – but it *is* a coherent pattern with identifiable characteristics. Below is a detailed carving, distinguishing components, boundaries, related concepts, and the status of each claim.

  ---

  ### **1. The Core Phenomenon: Shifting Burden of Proof / Differential Evidential Thresholds**
  *   **What it is:** The systematic application of **stricter evidential standards** to attribute mental states (like pain, consciousness) to certain taxa (e.g., fish, crustaceans, insects) compared to others (e.g., mammals, birds), *despite comparable behavioral evidence*. This isn't just Bayesian updating; it's a failure to apply the *same interpretive framework* consistently.
      *   **Key elements in your cases:**
          1.  **Identical Behavioral Proxy:** Grooming injury, avoiding stimulus location, behavior normalizing with analgesics/anesthetics.
          2.  **Asymmetric Interpretation:** "Consistent with nociception" (implying reflex) vs. "Pain, full stop."
          3.  **Moving Goalposts:** Demanding impossible evidence (e.g., verbal report) or neural signatures only found in mammals, *after* behavioral evidence is presented.
          4.  **Hidden Prior as Justification:** The prior isn't openly stated as the *reason* for the asymmetry; instead, the *evidence itself* is deemed insufficient for non-mammals, implying an objective standard isn't being met.
  *   **What it is NOT:**
      *   *Simple Bayesian Priors:* While priors play a role, the issue is the *failure to articulate and justify the prior*, the *refusal to specify what evidence would change the prior*, and the *misrepresentation of the asymmetry as purely about evidence quality* rather than prior conviction. A pure Bayesian would say, "My prior for fish consciousness is very low, so this evidence only shifts it slightly; my prior for dog consciousness is high, so the same evidence shifts it more." Your skeptics *aren't* saying this; they're dismissing the fish evidence *as if it were inherently weaker*.
      *   *Anthropomorphism:* Attributing human mental states inappropriately. Your case is the *reverse*: **Anthropo-*denial*** (coined by Frans de Waal) – the *refusal* to attribute human-like states to animals *despite evidence*, often driven by fear of being unscientific or sentimental. This is part of the picture, but your phenomenon is more specific to *differential thresholds*.
      *   *Speciesism (Moral):* While the differential threshold *can* stem from or enable moral speciesism, your focus is on the *epistemic practice* – the reasoning pattern itself – independent of its moral implications.
      *   *Skepticism in Principle:* Healthy skepticism demands evidence. This is skepticism applied *inconsistently* based on taxonomic category.

  *   **Edges & Awkward Cases:**
      *   **Skeptic Was Right:** If future science conclusively shows fish/bee consciousness *is* impossible (unlikely), the skeptic's *conclusion* was right, but their *reasoning* (differential threshold, moving goalposts) was still flawed. They got lucky, not rigorous.
      *   **AI Analogy (Reverse):** Over-attribution to AI ("It must be conscious because it talks!") is the mirror image: applying a *lower* threshold based on superficial human resemblance (anthropomorphism). Your case is applying a *higher* threshold based on lack of human resemblance (anthropodenial + shifting burden).
      *   **Human Locked-In Case:** This is a *perfect parallel*. The behavioral evidence (lack of responsiveness) was deemed sufficient to conclude "no consciousness" *because* the prior (humans are conscious) was unchallenged. Better evidence (neural activity) revealed the error. The prior (mammals/vertebrates feel pain) is similarly unchallenged, making behavioral evidence sufficient for dogs but not crabs/fish.

  *   **Is it a Mistake?** **Yes, epistemically.** It violates principles of consistent reasoning and evidential assessment. It confuses prior conviction with evidence quality. It can lead to false negatives (denying consciousness where it exists). *However*, Bayesian reasoning explains *why* it happens – the strong prior *does* legitimately require more evidence to overcome. The mistake lies in: (1) Not acknowledging the prior's role, (2) Not specifying falsifiable criteria, (3) Demanding impossible evidence, (4) Framing the asymmetry as inherent to the evidence.

  ---

  ### **2. Established Concepts & How They Fit (or Don't)**
  *   **Anthropodenial (De Waal):** *Uncontroversial Term, Contested Application.* The refusal to see continuity between human and animal minds. **Fits:** Explains the *motivation* behind demanding higher proof for "unfamiliar" minds (crabs, fish). **Doesn't Fully Fit:** Your phenomenon is specifically about the *differential application of standards* and *evidential shifting*, not just denial per se. Anthropodenial is the *attitude*, shifting burden is the *mechanism*.
  *   **Criterial Problem (Consciousness Studies):** *Uncontroversial Problem, Highly Contested Solutions.* The lack of an independent, universally agreed "marker" or criterion for consciousness forces reliance on proxies (behavior, neural correlates). **Fits Perfectly:** This is the *root* of your problem. Without a gold standard, people default to proxies *they* find compelling (human-like behavior, human-like brains). For skeptics, the mammalian brain is the *de facto* criterion. **Directly Explains:** Why behavior alone isn't seen as sufficient for non-mammals – the skeptic demands the *criterion* (mammalian structure) be met.
  *   **Neural Chauvinism / Cortico-Centric Bias:** *Contested, but Growing Consensus Against Rigidity.* The view that consciousness *requires* specific neural structures (e.g., layered cortex, thalamocortical loops) found only in mammals/birds. **Fits:** Your skeptic's argument about fish brain structures. **Status:** Highly contested. Many researchers argue consciousness could arise from different architectures (e.g., fish pallium, cephalopod vertical lobe). Consensus is that *complex* cognition/affect doesn't require a mammalian cortex. The demand for *identical* structures is increasingly seen as unsupported.
  *   **Double Standard / Special Pleading (Logic):** *Uncontroversial Fallacy.* Applying different standards to similar situations without justification. **Fits:** Exactly what you observe between crab/dog. The fallacy occurs when the differential standard (e.g., "needs a cortex") isn't adequately justified.
  *   **Inference to the Best Explanation (IBE) / Abduction:** *Uncontroversial Method.* Choosing the hypothesis that best explains the evidence. **Fits:** The vet sees the dog's behavior and concludes pain is the *best explanation*. The skeptic argues reflex is a *sufficiently good* explanation for the crab/fish. **The Problem:** The skeptic often *dismisses* pain as a *possible* explanation for non-mammals *a priori*, rather than weighing it against reflex. They demand pain explain *more* than it does in mammals.

  ---

  ### **3. Synthesizing the Phenomenon: A Proposed Term**
  While existing terms capture aspects, the specific *differential threshold* and *shifting burden* pattern deserves a focused label. Drawing on your description and the concepts above:

  *   **Term:** **Taxon-Dependent Evidential Threshold (TDET)** or **Shifting Burden of Sentience (SBS)**
  *   **Definition:** The epistemic practice whereby the amount and type of evidence deemed sufficient to attribute a specific mental state (e.g., pain, conscious awareness) to an animal varies systematically and unjustifiably based on the taxonomic class of the animal, rather than the nature of the behavioral or physiological evidence presented. This often manifests as:
      1.  Applying stricter criteria (e.g., demanding human-like neural correlates or impossible first-person reports) to taxa perceived as phylogenetically distant or neurologically dissimilar to humans.
      2.  Accepting simpler explanations (e.g., reflex, associative learning) as sufficient for distant taxa, while accepting richer explanations (e.g., subjective experience) for closer taxa, even when behavioral evidence is similar.
      3.  Failing to articulate or justify the prior assumptions driving the differential threshold, instead framing the asymmetry as inherent to the evidence quality.

  *   **Is this TDET/SBS? (Applying the definition)**
      *   **Crabs vs. Dog:** Yes. Identical behavioral proxies for pain relief (avoidance, guarding, response to anesthetic) are accepted as evidence *for pain* in the dog but dismissed as evidence *only for nociception* in the crab. Threshold shifted based on taxon.
      *   **Fish "Reflex" Argument:** Yes. Mammalian brain structures are demanded as evidence, creating an impossibly high threshold *because* the animal is a fish. Threshold shifted based on taxon.
      *   **Demanding Verbal Report:** Yes. This is setting an impossible threshold *specifically because* the subject is non-human. Threshold shifted based on taxon.
      *   **Locked-In Patient:** Yes (analogous). The threshold for attributing consciousness was set impossibly high (demanding behavioral response) *because* the patient *appeared* unresponsive, leading to a false negative. The prior ("if unresponsive, not conscious") overruled potential evidence.
      *   **AI Over-Attribution:** No (It's the reverse phenomenon - applying a *lower* threshold based on superficial similarity to human output).

  ---

  ### **4. Consensus vs. Controversy - A Reality Check**
  *   **Uncontroversial:**
      *   The "Criterial Problem" exists for consciousness/pain. There's no simple test.
      *   Behavior (including learned avoidance, trade-offs, response to analgesics) is a *central and legitimate* line of evidence for inferring pain/affective states in animals (established in animal welfare science - e.g., FAWC guidelines).
      *   Bayesian reasoning involves priors influencing how evidence is weighted.
      *   Attributing complex mental states to very phylogenetically distant/neurologically simple animals (e.g., C. elegans) *is* highly speculative based on current evidence.
      *   Demanding a verbal report from a non-human animal as evidence for its pain is unreasonable.
  *   **Contested (Live Disputes):**
      *   **The extent of consciousness/pain in specific taxa:** This is the *core* dispute. Fish? Very active debate (strong evidence for pain in many species is mounting). Crustaceans/Insects? Highly contentious and frontier science (evidence like your crab study exists, but neural basis is hotly debated).
      *   **Neural Correlates:** Is a cortex/thalamocortical system *necessary* for consciousness? Many argue no, pointing to birds (no cortex, but pallial structures supporting complex cognition) or proposing alternative architectures. The "cortico-centric" view is increasingly challenged but still held by some.
      *   **Methodology:** How much weight should be given to behavioral vs. neural evidence? How similar must the neural substrate be? What behavioral complexity is sufficient? This is deeply methodological and philosophical.
      *   **Anthropodenial:** While the term exists, the *degree* to which it operates and whether it's the *primary* explanation in specific cases is debated. Some argue the skepticism is scientifically warranted caution.
  *   **My Synthesis/Emphasis (Confidence: High based on your description & literature):**
      *   The pattern you observe (**TDET/SBS**) is a real and problematic epistemic practice common in these discussions. It often masks underlying anthropodenial or cortico-centric biases under the guise of methodological rigor. It's distinct from justified scientific caution based on specific differences. The locked-in patient analogy is apt and highlights the stakes.

  ---

  ### **Summary & How to Use This**
  You've identified **Taxon-Dependent Evidential Threshold (TDET)** or **Shifting Burden of Sentience (SBS)**. This involves:
  1.  **Differential Standards:** Higher evidence bar for "distant" taxa.
  2.  **Moving Goalposts:** Demanding impossible/irrelevant evidence.
  3.  **Hidden Priors:** Framing asymmetry as evidence weakness, not prior strength.
  4.  **Criterial Problem:** Root cause – lack of gold standard leads to defaulting to human-like proxies.

  **In your group:**
  *   Frame it neutrally: "I'm noticing a pattern of *differential evidential thresholds* based on taxon. Can we discuss what specific criteria we're using for each case and *why*?"
  *   Challenge gently: "If this behavior in the dog is sufficient evidence for pain, why isn't the *same* behavior in the crab? What *specific additional* evidence would you need for the crab that you don't need for the dog? Is that evidence actually obtainable?"
  *   Highlight the Criterial Problem: "Since we lack a consciousness detector, we rely on proxies. Are we being consistent about *which* proxies we accept as sufficient?"
  *   Acknowledge Bayesianism: "Yes, priors matter. But let's state our priors explicitly. My prior for crab pain is low but non-zero. This evidence shifts it. What's your prior, and how much would *this specific evidence* shift it? What evidence *would* shift it significantly?"
  *   Flag Controversies: "Just to note, the necessity of a mammalian cortex for consciousness is contested – birds and fish have different structures supporting complex functions. The evidence for fish pain specifically is an active debate."

  This gives you precise concepts to dissect the reasoning, distinguish justified caution from bias, and ground the discussion in the genuine (and fascinating) methodological challenges of studying animal minds. Good luck on Tuesday!
