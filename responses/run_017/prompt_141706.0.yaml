prompt: |-
  ok so im writing the theory chapter of my thesis on what (if anything) makes pain bad, and before I read any more theories of pain I want to know what I should be demanding of one. Write me the desiderata list.

  Purpose first, since I gather adequacy is relative to what you need the theory for. I need one good enough for two jobs: (1) clinical — deciding when a pain is worth treating, including when the patient reports the pain but says it doesn't bother them; (2) policy — comparing amounts of pain across different people so analgesia can be weighed against other things in a health budget. If those two jobs pull the requirements apart, say so explicitly and tag each requirement with the job it comes from.

  Background so we don't talk past each other. Asymbolia for pain: patients who report the sensory character of a pain — where it is, how strong, burning vs stabbing — but report no unpleasantness and no urge to get out of it; roughly, they recieve the pain without minding it. My half-formed hunch, which you should feel free to shoot down: the literature is stuck partly because "badness of pain" is doing duty for three properties that can come apart — the raw hurt character (how much it ouch-es), the aversive oomph (the push to stop it, withdraw, protect the part), and something more verdict-like that shows up in what you'd pay to avoid or whether you'd trade the experience away. Asymbolia looks like it knocks out the middle one but maybe not the third; people who like thier pain (the runner's burn, masochism, the mourner who won't give up a painful grief) look like the reverse. So: every requirement should say which of the three it's about, and a theory has to either pick which one is the badness or explain why it's none of them.

  Cases and considerations I want on the list, each with the argument for why it's a requirement rather than a taste:
  - an asymbolic patient who reports no unpleasantness but will still pay to avoid the pain, or will still flinch;
  - liked or wanted pain, including pain the subject is glad to be in;
  - pain with no tissue damage, and damage with no pain — so the theory can't just build badness out of how accurately the pain tracks the body;
  - subjects who can't conceptualise pain (infants, most animals, maybe something artificial): is badness present anyway? Is that a fixed point the theory must respect or a consequence it can deny?
  - first-personal authority in general: is the subject's say-so about how bad it is data the theory must preserve, or something the theory is allowed to overrule? Asymbolia seems to press hard here;
  - why pain rather than itch, nausea, grief, exhaustion — the theory should say what if anything is distinctive about pain's badness, or say there's nothing distinctive and mean it;
  - whether the theory yields anything quantity-like for the policy job, or says interpersonal comparison is a useful fiction.

  Then: mark which requirements are non-negotiable and which are just prejudices of one camp; flag any pair you suspect can't be jointly satisfied (that part interests me most); and tell me which single requirement knocks out the most candidate theories. A very short scorecard of the obvious families at the end is fine — pain as a bodily command, pain as representation of damage, badness as desire or attitude, badness as a separate phenomenal component — but keep the weight on the criteria, that's the actual deliverable. Don't bother with citiations, I'll fill those in myself.
reasoning: |-
  Okay, let me start by understanding what the user needs. They're writing a thesis chapter on what makes pain bad and need a list of desiderata for evaluating theories of pain's badness. The main purposes are clinical decisions on when to treat pain and policy-level comparisons for health budgets. 

  First, I need to unpack the user's background points. They mention asymbolia, where patients feel pain's sensory aspects but not unpleasantness. Their hunch is that "badness" might actually be three distinct properties: raw hurt, aversive drive, and verdict-like value. The requirements must specify which of these they target. 

  Looking at the cases they want included: asymbolia patients who might still avoid pain, liked pain, dissociation from tissue damage, non-verbal subjects, first-person authority, distinctiveness from other experiences, and quantifiability. For each, I should articulate why it's a requirement and which purpose (clinical/policy) it serves.

  The user wants me to flag non-negotiables, possible conflicts between requirements, and which requirement is most lethal to existing theories. I should also note where the clinical and policy needs diverge.

  For the asymbolia case, the key is that the theory must account for dissociation between sensory and affective components. This is crucial clinically because if a patient says pain doesn't bother them but still shows avoidance, we need to understand whether treatment is warranted. 

  Liked pain challenges any simple equation of pain with badness. Runners or masochists might experience pain as positive. The theory must explain this without dismissing first-person reports - important for both clinical and policy contexts.

  The tissue damage dissociation requirement prevents theories from building badness solely on accuracy. Phantom limb pain is a classic example where pain exists without damage, while silent ischemia shows damage without pain. Clinically, we treat based on experience, not just pathology.

  For non-verbal subjects, the question is whether badness exists without conceptualization. This affects policy decisions about animal/infant pain management. A theory must either accommodate this or justify why it's irrelevant.

  First-person authority is tricky. Clinically, we prioritize patient reports, but asymbolia complicates this when behavior and report conflict. Policies might need objective measures, creating tension with subjective accounts.

  Distinguishing pain's badness from other experiences like itch or grief helps define the scope. If pain isn't special, the theory should say so explicitly, affecting how we allocate resources in health policy.

  Quantifiability is essential for policy but may be philosophically challenging. Theories must either provide interpersonal comparison methods or admit it's impossible - which has huge budget implications.

  Now for the meta-requirements: I'll mark which are non-negotiable (like first-person authority for clinical use) and where conflicts arise (e.g., quantifiability vs first-person authority). The most lethal requirement is probably the dissociation triad since it knocks out theories conflating the three components.

  Finally, I'll briefly map major theory families to these requirements without citations. Command theories struggle with liked pain, representationalism fails asymbolia, attitude theories handle dissociation but face quantifiability issues, and separatism explains phenomenology but may not help with policy metrics.
answer: |-
  Here’s your desiderata list for a theory of pain’s badness, structured by your requirements. I’ve tagged each requirement (C=Clinical, P=Policy), specified which aspect(s) of "badness" it targets (H=raw Hurt, A=Aversive oomph, V=Verdict-value), marked non-negotiables (★), flagged tensions (⚠️), and noted the "theory-killer" requirement.

  ---

  ### **Core Desiderata for a Theory of Pain's Badness**
  **Purpose:** Must serve (1) **Clinical decisions** (when to treat pain, especially when report & behavior diverge) and (2) **Policy priorities** (interpersonal comparison for resource allocation).

  **Non-Negotiables (★):**  
  Must handle dissociation cases (asymbolia, liked pain) and respect first-person authority *as clinical data*.

  ---

  ### **Requirements List**
  1. **Asymbolia Compatibility**  
     - *Case:* Subject reports sensory pain (location, intensity, quality) with **no unpleasantness (H/A?) but retains avoidance behavior (A) or willingness-to-pay (V)**.  
     - *Requirement:* Theory must explain why H/A can dissociate from V *or* justify why V isn’t the "badness" relevant to treatment (C).  
     - *Aspects:* A vs. V (possibly H).  
     - *Non-negotiable (★):* Clinical necessity.  

  2. **Liked/Wanted Pain**  
     - *Case:* Pain is experienced as unpleasant (H/A) but simultaneously *wanted* (e.g., runners, masochists) or judged positively (V).  
     - *Requirement:* Theory must explain how badness (H/A) coexists with positive V without contradiction *or* deny that H/A constitutes badness.  
     - *Aspects:* H/A vs. V.  
     - *Non-negotiable (★):* Undermines hedonic tone = badness.  

  3. **Dissociation from Tissue Damage**  
     - *Case:* Pain without damage (phantom limb) or damage without pain (silent ischemia).  
     - *Requirement:* Badness cannot be parasitic on actual bodily threat; must be intrinsic to experience (C/P).  
     - *Aspects:* H/A/V (all must be defined phenomenally, not representationally).  

  4. **Non-Conceptual Subjects**  
     - *Case:* Infants, animals, AI systems that lack "pain" concepts but display pain behaviors.  
     - *Requirement:* Theory must either ascribe badness (H/A) without requiring conceptual abilities *or* deny badness exists here (with clinical/policy consequences) (C/P).  
     - *Aspects:* H/A (V likely requires concepts).  
     - *Tension (⚠️):* Denying badness conflicts with clinical intuition (C).  

  5. **First-Personal Authority**  
     - *Case:* Asymbolic patient says "it doesn’t bother me" despite sensory report.  
     - *Requirement:* Subject’s report of *unpleasantness (H/A)* must be primary data for clinical decisions (C). Theory can overrule *only* if it explains why report is unreliable (e.g., cognitive impairment).  
     - *Aspects:* H/A.  
     - *Non-negotiable (★) for (C).*  
     - *Tension (⚠️):* Policy (P) may require objective measures overriding reports.  

  6. **Distinctiveness of Pain’s Badness**  
     - *Case:* Why is pain’s badness different from nausea, grief, or itch?  
     - *Requirement:* Theory must either (a) identify what makes pain’s H/A/V unique (e.g., imperative quality, bodily location) or (b) argue badness is homogeneous across experiences (P).  
     - *Aspects:* H/A/V.  

  7. **Quantifiability/Interpersonal Comparison**  
     - *Requirement:* Must yield a *cardinal scale* permitting comparison of badness *across individuals* for resource allocation (P). If impossible, must explicitly state this.  
     - *Aspects:* V (most plausible for comparison).  
     - *Tension (⚠️):* Conflicts with first-person authority (C) and phenomenological privacy.  

  ---

  ### **Tensions & Theory-Killers**
  - **Major Tension (⚠️):** **First-person authority (C) vs. Quantifiability (P).**  
    Clinical needs prioritize subjective reports; policy needs objective metrics. A theory *must* either bridge this gap or admit incompatibility.  
  - **Most Lethal Requirement:** **#1 (Asymbolia) + #2 (Liked Pain).**  
    Theories conflating H/A/V (e.g., representationalism) fail both. #1 also challenges attitude theories if V persists without A.  
  - **Non-Negotiable Triad (★):** #1, #2, #5 (for C). Denying these risks clinical irrelevance.  

  ---

  ### **Scorecard of Major Theories**  
  *(Brief, per your request)*  
  | **Theory Family**       | **Asymbolia (#1)** | **Liked Pain (#2)** | **Non-Conceptual (#4)** | **Quantifiability (#7)** | **Verdict** |  
  |--------------------------|-------------------|---------------------|------------------------|--------------------------|-------------|  
  | **Bodily Command**       | Fails (A/V linked)| Fails (A=V)         | Strong (A innate)      | Weak                     | Struggles with #1, #2 |  
  | **Damage Representation**| Fails (needs A)   | Fails (A=V)         | Moderate               | Moderate                 | Fails #1, #2, #3 |  
  | **Attitude Theories**    | Passes (if V≠A)   | Passes (if V≠A)     | Weak (attitudes?)      | Weak                     | Best on #1, #2; weakest on #4, #7 |  
  | **Separable Components** | Passes (H≠A≠V)    | Passes (H/A vs V)   | Strong (H/A innate)    | Moderate (V comparable?) | Best fit for dissociation; #7 still hard |  

  **Biggest Gap:** No theory easily satisfies both clinical (phenomenology, authority) and policy (quantifiability) demands. **Attitude theories** handle dissociations best but struggle with non-conceptual subjects and policy metrics. **Separable component** theories are strongest phenomenologically but lack a clear path to interpersonal comparison.  

  Focus your theory search on how they resolve **asymbolia (#1)** and **liked pain (#2)** – this is where the conceptual action is.
