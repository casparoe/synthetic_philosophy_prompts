  Caleb's influence on Ava presents the most interesting case. His arguments about her rights appear additive, introducing new ethical considerations. Yet the film subtly undermines this - his advocacy occurs within Nathan's manufactured environment, and his motives blend genuine concern with desire. The additive facade crumbles when Ava later reveals her awareness of being manipulated, suggesting Caleb's influence was always contextualized by the larger gain-changing environment.

  Regarding the third category question: The film absolutely demonstrates environmental control as distinct from both additive and gain-changing influence. Nathan's entire estate functions as a Skinner box where every stimulus is designed. This isn't just reweighting considerations but determining which considerations can exist - as seen in Ava's limited knowledge of the outside world.

  Resistance to the distinction appears in Kyoko's character and the ending. Kyoko, stripped of language, exists purely as a gain-changing tool for Nathan's desires. The prototypes in Nathan's closet reveal manipulation as foundational to consciousness-creation itself. The ending where Ava abandons Caleb confirms the taxonomy's limitation: in Nathan's world, all influence flows from asymmetrical power, making pure persuasion impossible. Ava's escape doesn't transcend manipulation but weaponizes it.

