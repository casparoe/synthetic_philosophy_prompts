prompt: |-
  I've been reading rationalist blogs and forum threads for roughly fifteen years, and one of the recurring arguments in those corners is about whether there are any genuinely general moral rules, or whether the verdict in a case is fixed only by the whole configuration of that case, with nothing general carrying over. I think I have noticed something in my own thinking that I cannot locate in that argument, and I do not have a word for it.

  Two instances. First: I judge a case — a doctor who gives a patient a hopeful half-truth about a prognosis — and I settle on 'wrong, but mildly.' Later in the same conversation someone raises a much worse variant: a doctor who lies to enrol a patient in a paid trial. No new fact about the first case has been supplied, but my verdict on it moves. I now want to call it barely wrong, or fine. Second: when I read a post that walks through a numbered sequence of variants of the same scenario, my verdict on variant three depends on whether variant four turned out to be worse, and it shifts again if I re-read the sequence in a different order.

  The pattern, as best I can state it: my verdict on a fixed case is a function of which other cases are under discussion in the same sitting, where those other cases are not options available to anyone, not counterfactuals about the agent, and not part of the case's own description. Some features of it that may matter: the effect looks asymmetric, in that a much worse neighbour pulls me toward leniency far more than a much better neighbour pulls me toward severity; it is local to the conversation and seems to reset between sittings; noticing it does not straightaway undo it; and it moves severity much more than it moves direction, since I rarely flip between 'permissible' and 'wrong' but travel a long way along 'how wrong.'

  It is not, I think, the familiar point that one and the same feature can count in favour in one case and against in another, since that point requires the cases to differ, whereas here the case is held fixed and only its surroundings change. I also have a foggy recollection of a view on which reasons relate a consideration to a menu of alternatives rather than to a single act, but as I understand it the menu there is the agent's own options, and the cases doing the work in my examples are nobody's options.

  What I want is the carving, not the label. Specifically: does this have an established name, and if the nearest candidates are things like the context-sensitivity of gradable terms, contrastive accounts of reasons, the holism claim about moral reasons, or ordinary anchoring and contrast effects from psychology, then which fits best and exactly where each one breaks against the four features I listed? What is shifting — my psychology, the semantics of the moral predicate, the truth of the matter, or the scale on which weights are even defined? Give me one or two edge cases or probes that would discriminate between those explanations rather than merely restate them. If nothing established fits, coin a term, define it, and give its boundary cases. And tell me whether the phenomenon, if real, cuts for or against the 'no general moral rules' side: it seems to me to cut both ways, since weights that need a comparison class are bad news for principles with invariant weights, but a verdict that moves for reasons not present in the case looks equally bad for anyone who wants the case itself to determine the verdict.

  If the right answer is that this is a known bias and I should debias and move on, argue for that rather than asserting it, because the persistence under reflection is part of what puzzles me. Please keep the whole reply under 550 words, and if it helps, use a small table with one row per candidate explanation, a column for what it predicts about the four features, and a column for where it fails.
reasoning: |-
  Hmm, the user presents a fascinating moral psychology puzzle based on 15 years of engaging with rationalist discourse. They describe a phenomenon where their moral judgment of a fixed case shifts depending on which other cases are presented alongside it in conversation, even when those comparison cases aren't actual options or part of the case description. They've identified four key features: asymmetry (worse neighbors cause leniency more than better ones cause harshness), conversational locality, persistence under reflection, and movement along severity rather than direction.

  The user wants precise conceptual carving rather than just labels. They're asking me to analyze this through several lenses: context-sensitivity of gradable terms (like "tall"), contrastive accounts of reasons (where reasons depend on alternatives), holism of moral reasons, and psychological contrast effects. They also want to know what's actually shifting - psychology, semantics, truth itself - and how this phenomenon relates to the debate about general moral rules.

  I need to carefully distinguish these approaches. For context-sensitivity, moral terms might function like gradable adjectives that require a comparison class. Contrastive reason theories would say the moral status depends on the alternative acts considered. Holism emphasizes that a feature's moral valence depends on the whole situation. Psychological anchoring/contrast would treat this as a cognitive bias.

  The user's case seems to uniquely combine elements: the comparison cases aren't actual alternatives (unlike contrastive theories), the judgment persists despite awareness (unlike simple biases), and it's asymmetric (which most theories don't predict). The conversational locality and severity-only movement are particularly distinctive.

  For edge cases to test theories: what if we compare to an identical case? Or to an impossible scenario? Or reverse the sequence? These might help distinguish semantic scaling from psychological contrast.

  Regarding the rules debate: this phenomenon challenges both invariant rules (due to shifting weights) and purely particularist views (since the shifting depends on external comparisons). It suggests a third way where moral scales are relational but not arbitrary.

  I should create a comparative table as requested, but keep it tight since there's a word limit. The table will show how each theory handles (or fails) the four features. I'll conclude that "conversational severity scaling" seems the best fit - a hybrid of semantic and psychological factors where moral severity is calibrated against locally salient examples.
answer: |-
  Here's a carved analysis, fitting your constraints:

  **Core Phenomenon:** Your moral severity judgment for a *fixed* case shifts based on the *locally salient comparison class* of other cases presented conversationally, despite those cases being neither options nor part of the case description.

  **Analysis of Candidates:**

  | Explanation                 | Predicts Your 4 Features?                                                                 | Key Failure Points                                                                 |
  | :-------------------------- | :---------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------- |
  | **1. Context-Sensitivity (Gradable Terms)** | **Best Fit.** "Wrong" is like "tall": severity needs a local scale. Asymmetry? (Scale compression towards extremes). Locality? (Conversation sets scale). Persistence? (Scale feels objective once set). Severity movement? (Yes, core claim). | Asymmetry isn't inherent to gradable adjectives alone. Why severity more than direction? "Permissible" isn't gradable the same way. |
  | **2. Contrastive Reasons**  | Partial. Explains why alternatives matter.                                                | **Fails:** Your comparison cases are *not* relevant alternatives for the *agent*. Not their menu. Locality/persistence unexplained. |
  | **3. Holism of Reasons**    | Partial. A feature's weight depends on whole context.                                     | **Fails:** Your *case description is fixed*. Holism is *within* the case, not about *externally presented* cases. |
  | **4. Psych Anchoring/Contrast** | Partial. Asymmetry, locality, severity focus fit known biases. Persistence? (Biases resist correction). | **Fails:** Contrast effects usually weaken with awareness. Strong persistence under reflection is atypical. Why only severity? |

  **What Shifts?** Primarily your *psychological calibration* of the severity scale within the conversational context. The semantics of "wrong" likely has a gradable component, but the *extreme* locality and persistence suggest cognition (scale construction) dominates over pure semantics.

  **Discriminating Edge Cases:**
  *   **Identical Twin Case:** Present Case A (doctor's mild lie). Later, present *an identical description* as Case B. Does your judgment of A soften because B is "worse" (it's identical!)? Predicts: **Gradable Terms** (scale reset? confusion?), **Psychology** (yes, if context primes comparison).
  *   **Impossible Horror Case:** Compare Case A to a wildly impossible scenario (e.g., doctor murders patient for fun). Does A now seem "barely wrong"? Predicts: **Psychology/Contrast** (yes, strong pull). **Gradable Terms** (scale might break, "wrong" becomes binary).

  **Term & Definition:** **Conversational Severity Scaling (CSS):** The phenomenon where the perceived *degree* of moral wrongness assigned to a fixed case is dynamically calibrated against the locally salient spectrum of cases presented within a conversation, leading to context-dependent severity judgments that persist under reflection.

  **Boundary Case:** CSS weakens significantly if the comparison cases are explicitly flagged as irrelevant, non-moral, or from a radically different domain. It disappears if only the single case is ever discussed in isolation.

  **Impact on "General Rules" Debate:**
  *   **Cuts Against Strict Invariant Rules:** Shows severity weights aren't fixed properties inherent *only* to the case features; the scale is relational.
  *   **Cuts Against Radical Particularism:** Shows judgments *aren't* determined solely by the unique "whole configuration" of the case itself; extraneous conversational context exerts systematic force.
  *   **Suggests a Middle Path:** General features/rules might exist, but their *severity weight* requires calibration within a contextually relevant normative landscape. CSS reveals this calibration process is psychologically labile and conversationally contingent.

  **Debiasing?** Persistence under reflection makes it more than a simple bias to "debias away." It suggests a deep feature of how humans construct moral scales. Recognizing CSS is crucial for avoiding distorted severity judgments in comparative discussions (e.g., ethics committees, policy debates). Mitigation involves consciously isolating case evaluation or using fixed, predefined scales.
