prompt: |-
  Hi — I have a slightly odd job and I need something operational out of it. I'm on the small methods team at a big interdisciplinary environmental research institute (ecologists, economists, GIS/modelling people, engineers, some policy folks). When two subgroups have been deadlocked for weeks over some word and it's blocking something real — a shared database schema, a joint paper, a work package in an EU grant — they get a 45-minute slot with me, which we call term triage. I run maybe three of these a month. I have no prep time (I usually get the word and a one-line description the morning of), the people in the room are senior domain experts with zero philosophy and are visibly annoyed to be there, and my deliverable is a one-page note that says one of three things: "you genuinely disagree about X, here is what data or analysis would settle it"; "you don't disagree, go build the thing"; or "this isn't a question evidence can settle, escalate to the steering committee." So I need a decision procedure I can run live, in the room, in about thirty minutes of talking, and that terminates.

  I know roughly the shape of the philosophical material here, and I want it turned into steps rather than explained to me again: the test where you strip the contested term out and re-describe the situation in neutral language and see whether the disagreement survives, versus the test where you ask whether the parties would actually disagree about any case, actual or hypothetical. I've noticed those two come apart, and I want the procedure to say which one to run first and what to conclude when they disagree with each other. I also want somewhere in it the point that a dispute can be perfectly substantive while not being a dispute *about the world* — that the fight is over which concept or which way of counting should occupy the slot the word is sitting in, i.e. a practical/normative question about which vocabulary to build the project on, not a factual one. That distinction matters a lot for my one-pager, because the "which concept do we commit to" cases should go to the steering committee and not to a data request. Four things I keep running into that I don't know how to handle and that I'd like the procedure to have an answer to: (1) *one-sided paraphrase* — one subgroup can restate its claim fine without the word, the other one can't or won't, so the elimination test only fires in one direction; (2) *load-bearing terms* — where the word is doing real work inside somebody's model or regulatory framework, so substituting a neutral description loses inferential content even though everyone agrees on the cases; (3) *strategic vagueness* — someone benefits from the term staying blurry (it's in the grant text, or it holds two factions together), so they won't commit to a definition under any prompting; (4) the nasty one where after all the cases, actual and imagined, both sides say "yes, I'd describe it the same way as you" and *still* won't agree that the other side is right. Please also mark honestly which steps are judgement calls wearing a procedure's clothes, and where I as a non-expert outsider am simply not entitled to declare a dispute merely verbal even though my tests say it is.

  Cases I'd like run through it, in the note: (a) ecologists and an ecosystem-services economist arguing about whether a restored wetland is "degraded" — the ecologists mean departure from a pre-drainage baseline, the economist means reduction in the flow of things people actually value, and a monitoring protocol depends on which wins; (b) the ML subgroup and the clinicians arguing about "bias" in a mortality-prediction model, where the statistical reading (disparate error rates across groups) points at one fix and the clinical reading (miscalibration in a specific subgroup) points at a different, partly competing one; (c) a case where I've already got a bad feeling — after everyone agrees on every case about "resilience" in a coastal infrastructure model, the two factions are still fighting, and my suspicion is that the honest output of your procedure will be "this is not verbal, but it's also not answerable by any study; the real question is which operationalisation you want to be stuck with for five years, and that's a committee decision," which is exactly the note nobody wants from me. For each, show where the procedure stops, what I write down, and one sentence I can actually say out loud in the room. Finally, tell me what this procedure can't do — what kinds of deadlock it will mislabel even when I run it perfectly.
reasoning: |-
  We are designing an operational decision procedure for term triage. The goal is to resolve deadlocks over contested terms in 30 minutes and produce a one-page note with one of three conclusions.

  The procedure must handle:
  1. Genuine disagreement about facts: recommend data/analysis to settle.
  2. No real disagreement: tell them to build the thing.
  3. Non-empirical disagreement: escalate to steering committee.

  Key tests to incorporate:
  - Elimination test: Remove the contested term and see if the disagreement persists when described neutrally.
  - Case-based test: Use actual or hypothetical cases to see if they disagree on the application.

  We must account for:
  - One-sided paraphrase: Only one side can restate without the term.
  - Load-bearing terms: The term is embedded in a model/framework; neutral description loses inferential content.
  - Strategic vagueness: A party benefits from ambiguity and won't define.
  - Agreement on cases but not on the term: They agree on descriptions but still won't concede.

  Also, note that some disputes are about which concept to use (practical/normative) and should go to the committee.

  The procedure must be step-by-step, with clear termination.

  We'll design the steps, mark where judgment is needed, and then run through the cases.

  ---

  **Procedure: Term Triage in 30 Minutes**

  **Step 0: Setup (2 minutes)**
  - State the goal: "We are here to clarify the disagreement about [term]. We'll try to see if it's about facts, or something else, and get unblocked."
  - Present the three possible outcomes (so they know where we're going).
  - Get both sides to state their position in one sentence each, using the term.

  **Step 1: Elimination Test (Neutral Restatement) (8 minutes)**
  - Ask: "If we remove the word [term] entirely, can both sides restate their claims in neutral, descriptive language? Please avoid using [term] or any synonyms."
  - If both can restate without the term, write down both restatements and see if they conflict. 
    - If no conflict: Proceed to Step 2 (case-based test) to check if the agreement holds in practice.
    - If conflict: This suggests a factual disagreement. Note the conflicting claims and proceed to Step 3 (factual test).
  - If one side can restate and the other cannot (one-sided paraphrase):
    - Note: The side that cannot restate may have a concept that is load-bearing or they are strategically vague.
    - Ask the side that cannot restate: "What is it about [term] that is essential? What would be lost if we used a different description?" 
    - If they point to inferential content (e.g., "this term is defined in our model to imply X"), note that the term is load-bearing. Then skip to Step 2 (case test) to see if they agree on cases despite the term's role.
    - If they refuse to define or are vague (strategic vagueness), note this and proceed to Step 2 (case test) to see if cases force clarification.
  - If both cannot restate: This suggests the term is central and possibly ambiguous. Proceed to Step 2.

  **Step 2: Case-Based Test (10 minutes)**
  - Goal: See if they disagree on how to describe actual or hypothetical cases without using the term.
  - Present a few actual cases (from their project) that are relevant and non-controversial in their facts. Then, if needed, propose hypothetical cases that probe boundaries.
  - For each case, ask: "In this situation, would you say [claim A] or [claim B]? But without using [term] — describe the situation and your conclusion in neutral terms."
  - Collect answers from both sides for each case.
  - If they agree on the descriptions for all cases, then they don't have a factual disagreement. But note: they might still be attached to the term for non-factual reasons (e.g., normative, institutional). Proceed to Step 4 (normative check).
  - If they disagree on at least one case, note the specific point of disagreement. This is a factual dispute. Proceed to Step 3 (factual test).
  - If they agree on all cases but still won't agree on the term, we have the "agreement on cases but not the term" problem. Proceed to Step 4 (normative check).

  **Step 3: Factual Test (5 minutes)**
  - Goal: Determine if the disagreement (from Step 1 or 2) is about a matter of fact that can be settled by data or analysis.
  - Take the conflicting claim(s) and ask: "What evidence or analysis would resolve this? Is it feasible to get that evidence in the project timeline?"
  - If yes, then the outcome is: "Genuine factual disagreement about X. Do study Y."
  - If no (e.g., it's about values, or the evidence is impossible to get), then it's not a factual dispute. Proceed to Step 4.

  **Step 4: Normative Check (5 minutes)**
  - Goal: Check if the disagreement is about which concept to use (practical/normative) even when there's no case disagreement.
  - Ask: "If we all agree on the facts (as we seem to from the cases), is the remaining issue about which concept or definition of [term] we should use for this project? For example, because of regulatory requirements, model compatibility, or project goals?"
  - If yes, then this is a practical/normative decision. Outcome: "Not a factual dispute; it's about which concept to adopt. Escalate to steering committee."
  - If not, and they still insist on a factual disagreement but without any case disagreement, then it's likely a confusion or a deeper issue. You might have to conclude: "No factual disagreement found, but unresolved non-factual issues. Escalate to steering committee." (This covers strategic vagueness or unstated motives.)

  **Step 5: Wrap-up and Note (Remaining time)**
  - State the outcome clearly and write the one-pager accordingly.

  ---

  **Marking Judgment Calls:**
  - Step 1 (neutral restatement): Judging whether a restatement is "neutral enough" and whether a side is being obstructive. Also, identifying load-bearing terms requires interpreting their response.
  - Step 2 (case selection): Choosing cases that are probing and fair requires judgment. Also, interpreting whether they "agree" on a case if their descriptions are slightly different but not conflicting.
  - Step 3 (feasibility of evidence): Judging what evidence is feasible may require domain knowledge you don't have. You might have to rely on their assessment.
  - Step 4 (normative check): Deciding whether the issue is about concept choice or something else (e.g., personal animosity) is tricky. You must rely on their answers and context.

  **Where you cannot declare a dispute merely verbal:**
  - When there is strategic vagueness or unstated motives (you might not be entitled to force them to admit it's verbal).
  - When the term is load-bearing in a model and the model's structure is not up for debate (so even if they agree on cases, the term might be non-negotiable for one side).
  - When the disagreement is about the normative implications of the term (even if they agree on facts) and one side fears that accepting a definition will have consequences they don't want. In such cases, the dispute is not verbal but about the term's role in a larger context.

  ---

  **Running the Cases:**

  **Case (a): "degraded" wetland (ecologists vs. economist)**
  - Step 0: Term is "degraded". Ecologists: "The wetland is degraded because it's far from pre-drainage state." Economist: "The wetland is not degraded because it provides high value services."
  - Step 1: Elimination test.
    - Ecologists: "The wetland has undergone significant alteration from its historical condition, with loss of native species and hydrology." (neutral)
    - Economist: "The wetland currently yields high levels of services such as water purification and recreation." (neutral) 
    - The restatements conflict: one about historical change, one about current service flow. So we have a conflict in claims. Proceed to Step 3.
  - Step 3: Factual test. 
    - The disagreement is about what "degraded" should mean. But note: they are not disagreeing about the facts of historical change or current services. They are disagreeing about which concept to use. 
    - However, Step 3 is for factual disagreements. We must check: is there a hidden factual dispute? Ask: "Do you agree on the facts: the historical state, the current state, and the current service flow?" If yes, then this is not factual. Go to Step 4.
  - Step 4: Normative check. 
    - The issue is which concept of "degraded" to use: ecological baseline or economic services. This is a choice for the project. 
  - Outcome: "This isn't a question evidence can settle. The dispute is about which concept of 'degraded' to operationalize for the monitoring protocol. Escalate to steering committee."
  - One-sentence in room: "You both agree on the facts of the wetland's history and current services, but you're using 'degraded' in two different ways. This is a choice about how to define the term for the project, so it needs a committee decision."

  **Case (b): "bias" in a mortality-prediction model (ML vs. clinicians)**
  - Step 0: Term is "bias". ML: "The model has bias because error rates differ across racial groups." Clinicians: "The model has bias because it's miscalibrated for a subgroup (e.g., overestimates risk for Black patients)."
  - Step 1: Elimination test.
    - ML: "The model's false positive rate is higher for group A than group B." (neutral)
    - Clinicians: "For group C, the predicted probabilities are systematically higher than the actual outcomes." (neutral)
    - The restatements are not necessarily conflicting — they could both be true. So no direct conflict. Proceed to Step 2 to see if they disagree on cases.
  - Step 2: Case-based test.
    - Present a case: a patient from group C with a predicted risk of 70% but actual outcome negative. 
      - ML: This might be an error (if group C has high error rates) but their focus is on error rates, not calibration. They might say: "This is a false positive. If group C has more false positives, that's bias in error rates."
      - Clinicians: "This shows miscalibration — the model overestimates risk for group C."
    - They both describe the case differently. Now, ask: "Would you both agree that the model has a problem in group C?" They both say yes. Then ask: "But is the problem the same?" 
    - The ML person might say: "Miscalibration is one cause of unequal error rates, but not the only one. We care about the outcome (error rates) because that leads to unfair treatment." 
    - The clinician might say: "Fixing miscalibration might fix the error rates, but not necessarily. We care about calibration because it affects clinical decisions at the individual level."
    - They agree that there's a problem in group C, but they don't agree on what to call "bias" or what fix to prioritize. 
  - Step 4: Normative check (skipping Step 3 because the disagreement is not about facts but about what matters).
    - The issue is which aspect of model performance to prioritize: error rate disparities or calibration. This is a choice about what "bias" means in the project context. 
  - Outcome: "This isn't a question evidence can settle. The dispute is about which operational definition of 'bias' to use for model evaluation. Escalate to steering committee to decide on priorities."
  - One-sentence in room: "You both agree the model has problems for group C, but you're emphasizing different aspects. The choice of which to call 'bias' and fix depends on project goals — it's a committee decision."

  **Case (c): "resilience" in coastal infrastructure (after they agree on cases)**
  - Step 0: Two factions fighting about whether the infrastructure is "resilient".
  - Step 1: Elimination test: Both might struggle, but suppose they restate.
    - Faction A: "The system recovers quickly after a storm." 
    - Faction B: "The system doesn't fail even in severe storms."
    - These might be compatible (quick recovery and no failure) or not. Proceed to Step 2.
  - Step 2: Case-based test. You present cases (e.g., a storm of category X). Both agree: for storm X, the system didn't fail and recovered in Y days. They agree on all cases. But they still won't agree on the term "resilient".
  - Step 4: Normative check.
    - Ask: "If we agree on how the system behaves in all these cases, is the remaining issue about which definition of 'resilience' we should use? For example, because one definition aligns with a regulatory framework or a model requirement?"
    - They might reveal: Faction A needs "resilience" to mean fast recovery for their model, and Faction B needs it to mean resistance for their policy document.
  - Outcome: "This isn't a question evidence can settle. The dispute is about which operational definition of 'resilience' to commit to for the project. Escalate to steering committee."
  - One-sentence in room: "You agree on how the system performs in all the cases we discussed, but you want to use 'resilient' for different aspects. This is a decision about project terminology, so it goes to the committee."

  ---

  **What the procedure can't do (limitations):**
  - **Hidden agendas**: If a group is using the term to block progress for reasons they won't state (e.g., to avoid work, to sabotage), the procedure won't reveal that. It might mislabel as "non-factual" when it's really about power.
  - **Deep conceptual confusion**: If both sides are using the term inconsistently and don't realize it, the case test might not expose it if the cases are poorly chosen. You might incorrectly conclude "no disagreement".
  - **Emotional/political deadlocks**: When the dispute is really about interpersonal issues or institutional politics, the procedure might force a superficial resolution but the deadlock remains.
  - **Infeasible factual tests**: If Step 3 identifies a factual dispute but the required evidence is impossible to get (e.g., too expensive, beyond project scope), the procedure might still recommend a study that won't happen. You might have to override and escalate.
  - **Term with multiple dimensions**: If the term has several independent aspects (e.g., "resilience" as both recovery and resistance), and they agree on some but not others, the procedure might not disentangle this cleanly. You might need to break the term into components.

  Despite these, the procedure should handle most cases and provide a clear path for the one-pager.
answer: |-
  Below is a step-by-step decision procedure designed for your term triage sessions. It incorporates the tests you mentioned (elimination and case-based), handles your four common challenges, and explicitly flags judgment calls. The procedure is structured to run in **30 minutes** and always terminates with one of your three outputs. I've marked judgment points with **(J)** and noted where you lack standing to declare a dispute "merely verbal."

  ### **Term Triage Decision Procedure (30-Minute Flow)**
  **Goal:** Classify the dispute into one of three outputs:  
  ① Factual disagreement (needs data/analysis);  
  ② No real disagreement (move forward);  
  ③ Non-empirical disagreement (escalate to steering committee).  

  **Core Principles:**  
  - **Elimination test first:** Remove the contested term to force neutral descriptions.  
  - **Case-based test second:** Use hypothetical/actual cases to expose hidden disagreements.  
  - **Normative anchor:** Explicitly check if the dispute is about which concept to institutionalize (even when facts are agreed).  
  - **Timebox each step** to avoid digressions (use a timer visibly).  

  ---

  #### **Step 1: Elimination Test (10 mins)**  
  **Action:**  
  - "Let’s remove the word **[term]**. Without using it or synonyms, describe your core claim about the situation."  
  - Have each side restate their position in neutral language (e.g., "The wetland has reduced biodiversity" vs. "The wetland provides fewer flood-protection benefits").  

  **Handle Challenges Here:**  
  - **One-sided paraphrase (Challenge 1):** If one side can’t/won’t restate neutrally:  
    - Ask: "What specific idea does **[term]** capture that a neutral description misses?"  
    - If they cite model-specific inferences or regulations (e.g., "Our framework defines ‘bias’ as X, which triggers audit requirements"), note it as **load-bearing (Challenge 2)** and skip to Step 2.  
    - If they evade (e.g., "It’s complex; we need the term"), note **strategic vagueness (Challenge 3)** but don’t push. Proceed to Step 2.  
  - **Both restate neutrally:** Compare the restatements.  
    - If they **conflict** (e.g., "reduced biodiversity" vs. "high flood protection"): Proceed to Step 3 (Factual Check).  
    - If they **align** (e.g., both describe the same facts): Proceed to Step 2 (Case Test).  

  **Judgment Call (J):** Deciding if a restatement is "neutral enough" (e.g., is "reduced biodiversity" a sneaky way to smuggle in "degraded"?). Listen for value-laden language.  

  ---

  #### **Step 2: Case-Based Test (10 mins)**  
  **Action:**  
  - Present 2–3 hypothetical/actual cases (e.g., "Imagine a wetland with high biodiversity but low flood protection—how would you describe it without **[term]**?").  
  - For each case, ask: "Would you agree or disagree with the other side’s neutral description?"  

  **Handle Challenges Here:**  
  - **Load-bearing terms (Challenge 2):** If term is tied to a model/framework, ask: "If we called this case **[their preferred label]**, would it change your model’s output?" (e.g., "If we call the model ‘unbiased’ when error rates are equal, does that satisfy your regulatory requirement?").  
  - **Strategic vagueness (Challenge 3):** If a side won’t engage, note: "Side X hasn’t provided a testable definition."  
  - **Agreement on cases but not term (Challenge 4):** If both agree on all case descriptions but still fight over **[term]**, ask: "If we all agree on the facts, is the disagreement about which *label* to use?"  

  **Outcomes:**  
  - **Disagree on ≥1 case:** Proceed to Step 3 (Factual Check).  
  - **Agree on all cases:**  
    - If they still dispute the term → Proceed to Step 4 (Normative Check).  
    - If they agree on everything → Output ② ("no disagreement").  

  **Judgment Call (J):** Choosing cases that probe boundaries (e.g., edge cases for "degraded"). Avoid cases where facts are disputed.  

  ---

  #### **Step 3: Factual Check (5 mins)**  
  **Action:**  
  - Identify the specific factual claim in conflict (e.g., "You disagree about whether biodiversity loss *causes* reduced flood protection").  
  - Ask: "What evidence would resolve this? Is it feasible to gather in this project?"  

  **Outcomes:**  
  - Feasible evidence exists → Output ① ("genuine disagreement; do study X").  
  - No feasible evidence (e.g., impossible to measure, or disagreement is about values) → Proceed to Step 4.  

  **No Judgment Needed:** This is feasibility assessment (they define the evidence).  

  ---

  #### **Step 4: Normative Check (5 mins)**  
  **Action:**  
  - "If we agree on the facts/cases, is this about which definition of **[term]** to *adopt* for this project? For example, because of regulations, models, or project goals?"  
  - Listen for: "We need **[term]** to mean X for our methodology" or "The grant requires we use this definition."  

  **Output:**  
  - If yes → Output ③ ("not about evidence; escalate to committee").  
  - If no (rare) → Default to Output ③ (dispute is unresolved but non-empirical).  

  **Where You Lack Standing (J):** Even if tests suggest a "merely verbal" dispute, you **cannot** declare this if:  
  - The term is load-bearing in a regulatory/model framework (e.g., "degraded" legally mandates restoration funds).  
  - Strategic vagueness persists (e.g., a side refuses to define terms because it serves coalition-building).  
  - Parties agree on cases but the term has symbolic stakes (e.g., "calling this ‘resilient’ implies we prioritize engineering over ecology").  
  *In these cases, escalate → Output ③.*  

  ---

  ### **Case Walkthroughs**
  #### **Case (a): "Degraded" wetland (ecologists vs. economist)**  
  - **Step 1:**  
    - Ecologists restate neutrally: "The wetland has 60% less biodiversity than pre-drainage."  
    - Economist restates: "The wetland provides €1M/yr flood-protection benefits."  
    - **Outcome:** No conflict in facts (both true), but one-sided paraphrase (economist won’t drop "degraded" because it’s load-bearing for valuation models). → Proceed to Step 2.  
  - **Step 2:**  
    - Case: "A wetland with pre-drainage biodiversity but no flood protection?"  
      - Ecologists: "Not degraded (biodiversity intact)."  
      - Economist: "Degraded (no services)." → **Disagreement on cases.** → Proceed to Step 3.  
  - **Step 3:**  
    - Factual conflict: "Does biodiversity loss *reduce* flood protection?"  
    - Evidence: Study on biodiversity-service links. Feasible? Yes. → **Output ①:** "Genuine disagreement: Does biodiversity loss reduce flood protection? Run a meta-analysis of wetland studies."  
  - **Room Phrase:** "You’re using ‘degraded’ for two different things—historical biodiversity vs. current services. But since you disagree on whether they’re linked, we need data to settle it."  

  #### **Case (b): "Bias" in ML model (ML team vs. clinicians)**  
  - **Step 1:**  
    - ML restates: "Error rates differ by >10% across racial groups."  
    - Clinicians restate: "Predictions are miscalibrated for Black patients (overestimate risk)."  
    - **Outcome:** No direct conflict → Proceed to Step 2.  
  - **Step 2:**  
    - Case: "A model with equal error rates but miscalibrated for Black patients?"  
      - ML: "Not biased (error rates equal)."  
      - Clinicians: "Biased (miscalibration harms care)." → **Disagreement on cases.** → Proceed to Step 3.  
  - **Step 3:**  
    - Factual conflict: "Does miscalibration *cause* unequal error rates?"  
    - Evidence: Simulate model adjustments. Feasible? Yes. → **Output ①:** "Genuine disagreement: Does fixing miscalibration fix error rates? Test model recalibration."  
  - **Room Phrase:** "You both see problems, but ‘bias’ means different things—group outcomes vs. individual accuracy. Since you disagree on whether they’re connected, we need a test."  

  #### **Case (c): "Resilience" in coastal infrastructure (agreement on cases but still fighting)**  
  - **Step 1:**  
    - Side A: "Infrastructure recovers in <24h post-storm."  
    - Side B: "Infrastructure survives Category 5 storms."  
    - **Outcome:** Both restated, but descriptions don’t conflict → Proceed to Step 2.  
  - **Step 2:**  
    - Cases (e.g., "recovers in 12h but fails in Cat 5"): Both agree on outcomes.  
    - But they still fight over "resilient." → **Agreement on cases, term dispute persists.** → Proceed to Step 4.  
  - **Step 4:**  
    - Normative check reveals: Side A needs "resilience" for funding rules (recovery time), Side B for engineering standards (robustness). → **Output ③:** "Not a factual dispute. Disagreement is over which definition of ‘resilience’ to operationalize. Escalate to steering committee."  
  - **Room Phrase:** "You agree how the system performs in all cases, but you’re stuck on which version of ‘resilience’ to build into this project. That’s a policy call for the committee."  

  ---

  ### **What This Procedure Can’t Do (Limitations)**  
  Even when run perfectly, this will mislabel or fail in:  
  1. **Disputes masquerading as terminology issues:** If the real conflict is interpersonal, political, or about resource allocation (e.g., one side uses "degraded" to force budget shifts), the tests won’t expose it. Output ③ will cover this (escalate), but the note won’t capture the subtext.  
  2. **Multidimensional terms:** If a term has >2 independent aspects (e.g., "resilience" = recovery + robustness + adaptability), parties might agree on subsets but not the whole. The case test may miss dimensions, leading to false "no disagreement" (Output ②).  
  3. **Bad-faith actors:** If a side refuses to engage (extreme strategic vagueness), the procedure might default to Output ③ but won’t force progress.  
  4. **Ontological disputes:** Rare cases where parties disagree about fundamental categories (e.g., "Is this wetland a ‘system’ or a ‘resource’?"). The tests may falsely flag this as empirical (Output ①).  
  5. **Overly broad terms:** If the term is central to multiple project components (e.g., "bias" affects model design, reporting, and compliance), the procedure may isolate one conflict but miss systemic fallout.  

  **Final Tip:** Always start the session by setting expectations: "My job isn’t to decide who’s right, but to unblock you in 30 minutes. We’ll focus on what’s testable or what needs higher-level input." This reduces hostility and primes experts for the process.
