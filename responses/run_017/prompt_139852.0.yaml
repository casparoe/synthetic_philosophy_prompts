answer: |-
  ## MEMORANDUM  
  **To:** Interpretation and Visitor Experience Committee  
  **From:** [Your Name], Philosophy Department (Committee Member)  
  **Date:** Monday, [Date]  
  **Subject:** Recommendation for Object 7 & 9 Label Text - 'Naming & Language in Early China' Exhibition  

  **Bottom Line:**  
  I recommend adopting the following label texts for Objects 7 and 9. They resolve the current impasse by accurately reflecting Gongsun Long's arguments about *naming*, not ontology, while meeting accessibility standards, respecting the partner museum's core claim, and avoiding visitor confusion or complaints.  

  *   **Object 7 (Tang White-Glazed Ceramic Horse):**  
      "In ancient Chinese philosophy, Gongsun Long argued that the *name* 'horse' describes shape, while 'white' describes colour. Because the compound *name* 'white horse' fits neatly under neither category, he claimed it is not correct to apply *only* the name 'horse' to a white horse. This challenges how words relate to things."  
  *   **Object 9 (White Marble):**  
      "Gongsun Long used such stones to argue about perception and naming: we *see* whiteness and *feel* hardness. He claimed these distinct experiences mean the words 'white' and 'hard' describe separate properties. The *name* 'stone' then refers to the object holding these properties together, prompting debate about how language captures reality."  

  **Supporting Principle for All Labels (The 'Naming Lens' Principle):**  
  > **When presenting philosophical claims about objects, especially paradoxes, frame them explicitly as being about *language*, *naming*, or *concepts* ('names', 'words', 'categories', 'how we describe'), rather than direct statements about the object's physical reality.**  

  This principle resolves ambiguity, aligns with plain language (by grounding abstraction in everyday acts of speaking/naming), prevents literal misinterpretations (e.g., 'This isn't a horse!'), and satisfies philosophical rigour. Apply this lens to check the other 10 labels.  

  **Rationale & Resolution:**

  1.  **Object 7: The 'White Horse' Paradox:**
      *   **Curator's Draft ('...would have said this is not a horse'):** This is technically the *form* of Gongsun Long's statement but is profoundly misleading. Taken literally (as visitors, especially children, inevitably will), it suggests the object itself isn't a horse, which is false and confusing. It omits the crucial linguistic context.
      *   **Head of Learning's Draft ('...not the same thing as horses in general'):** This improves safety but dilutes the paradox into near-triviality ("a specific thing isn't the general category" is obvious). It loses Gongsun Long's radical point about the *inadequacy of the simple name* and the compound name's problematic status.
      *   **The Core Issue:** Gongsun Long (c. 325–250 BCE) was making a sophisticated argument about *ming* (names) and *shi* (actualities). The claim "A white horse is not a horse" (Bai ma fei ma) hinges on the function of names: 'horse' picks out the shape-form, 'white' picks out the colour-form. The compound term 'white horse' specifies *both* attributes. Therefore, applying *only* the name 'horse' to a white horse is incorrect because it ignores the specific colour designation inherent in the compound name. It's a claim about correct *naming*, not zoology.
      *   **Recommended Text Solution:** By explicitly framing the argument around *names* ("the *name* 'horse'...", "apply *only* the name 'horse'", "challenges how words relate to things"), we achieve:
          *   **Accuracy:** Captures the essence of the paradox (the naming conflict).
          *   **Clarity:** Avoids the nonsensical literal reading. Explains *why* the claim was made.
          *   **Safety:** No child (or parent) will think we deny the object is a horse-shaped object.
          *   **Partner Museum Alignment:** Preserves the core "not a horse" *structure* of the claim but contextualises it correctly as linguistic. We do not contradict their statement; we *explain* it.
          *   **Dwell-Time:** Explains *why* the claim is paradoxical and interesting, satisfying curiosity rather than causing bafflement.

  2.  **Object 9: The 'Hardness & Whiteness' Paradox:**
      *   **Drafted Label ('...two different things and the stone is a third'):** This is a bald ontological statement that *is* baffling and *seems* false without context. It implies the stone is somehow separate from its own hardness and whiteness, which defies common sense.
      *   **The Core Issue:** Gongsun Long's argument (Jian bai lun) focuses on the distinct *modes of perception* and the abstract *attributes* they reveal. Vision gives us 'whiteness' (*bai*), touch gives us 'hardness' (*jian*). These attributes are conceptually distinct and perceived independently. The argument then contends that the *name* 'stone' (*shi*) refers not directly to these attributes themselves, but to the underlying substrate that *possesses* them. The stone is the 'one' that unites the 'two' attributes. It's an argument about the abstraction of properties and the referent of substance terms.
      *   **Recommended Text Solution:** Focusing on *perception* and *naming* ("we *see* whiteness...", "the *words* 'white' and 'hard'...", "*name* 'stone'... refers to the object holding these properties") achieves:
          *   **Accuracy:** Preserves the separation of properties and the role of the substance name.
          *   **Comprehensibility:** Grounds the separation in sensory experience (seeing vs. feeling), making the distinction intuitive. Framing it as about *words* clarifies it's a conceptual argument.
          *   **Safety:** Avoids asserting the stone is ontologically "a third thing" in a way that sounds nonsensical. It explains the reasoning.
          *   **Partner Museum Alignment:** Acknowledges the distinctness of hardness/whiteness and the role of the stone, but frames it epistemologically/linguistically rather than ontologically. We interpret the claim, not contradict it.
          *   **Plain Language/Dwell-Time:** Explains the puzzle using familiar concepts (seeing, feeling, naming, describing), inviting engagement rather than confusion.

  **The Strongest Version of the Position I Am Voting Down (The Literal Ontological Reading):**

  The most robust alternative position holds that Gongsun Long *did* intend these paradoxes ontologically. Proponents (often drawing on more 'realist' interpretations or specific readings of the texts) argue that 'white horse is not horse' asserts a genuine metaphysical distinction: the 'white-horse' is a unique particular, distinct from the universal 'horseness', such that it literally *is not* (an instance of) horse. Similarly, for the stone, hardness and whiteness are conceived as metaphysically independent 'forms' or 'stuff' that inhere in the stone, which is a distinct substance. The labels should therefore state the claims baldly ('This is not a horse', 'The stone is a third thing') as startling ontological truths, forcing the visitor to confront a radically different worldview. This view prioritises textual brevity matching the paradoxes' original form and maximises provocative 'dwell-time', trusting visitors to grapple with the apparent absurdity as a gateway to deeper thought. It aligns perfectly with the partner museum's unadorned presentation.

  **Does This Position Win? Should I Abandon My 'Names-Not-Animals' Reading?**

  **No, it does not win, and abandoning your 'names-not-animals' reading would be a significant cost.** While the ontological interpretation is defensible by *some* scholars, the dominant consensus in modern scholarship (especially Western analytical and many contemporary Chinese scholars) strongly favours the linguistic/conceptual reading. The texts are deeply concerned with *correct naming* (zheng ming) and the relationship between words and things. The paradoxes function as logical-linguistic puzzles challenging assumptions about reference and categorization. The ontological interpretation risks anachronism, projecting later metaphysical concerns onto texts primarily engaged in semantics and logic within the context of disputation (bian). Your reading is philosophically richer, more historically plausible, and crucially, *the only one that is viable for public interpretation* without causing confusion or misrepresentation. The cost of the ontological reading in this context is unacceptably high: baffled visitors, potential complaints, and presenting early Chinese thought as committed to seemingly absurd metaphysics rather than sophisticated linguistic analysis. The 'naming lens' achieves accessibility *without* sacrificing philosophical integrity. Stick to your hobby-horse; it provides the necessary bridle for these unruly paradoxes in a public setting.

  **Recommendation Summary:**  
  Approve the proposed label texts for Objects 7 and 9. Apply the 'Naming Lens' Principle (focus claims explicitly on language/naming/concepts) to review and adjust the remaining ten object labels where necessary before the 14th deadline. This approach satisfies accuracy, accessibility, partner expectations, and visitor engagement.
