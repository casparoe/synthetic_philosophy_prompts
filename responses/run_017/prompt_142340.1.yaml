prompt: |-
  I'm writing a novel and have backed myself into a corner about state apologies, and I'm hoping you can help me find the principle I keep fumbling toward. The set-up: a small fictional country (my editor hates the name, but let's call it Vessia) has an institution called the Reckoning — once a year a citizens' assembly picks one historical wrong, and the state apologises for it in a televised ceremony where the text is read aloud not by the head of state but by someone chosen by lot from the population, on the theory that a nation should apologise to itself rather than be apologised for by its politicians. My protagonist is the junior civil servant who drafts these things, and about halfway through the book she starts refusing some of the commissions, and I need to know whether her refusals track anything real or whether I've just handed her my politics.

  Here are my gut verdicts, case by case. (a) The new democracy apologises for a massacre carried out by the junta it replaced fifty years ago; the perpetrators are dead, the survivors' grandchildren are alive. Obviously fine, maybe required. (b) The state apologises for a pogrom carried out ninety years ago by a private mob, where the police stood aside and no one was ever charged. Also fine, and more apt than I'd have guessed, even though the state didn't do it. (c) It apologises for a sterilisation programme that was legal at the time, popular, and administered by doctors who thought they were helping. Fine, and I don't think 'it was legal then' helps the state at all. (d) It apologises for a famine caused by a policy whose authors genuinely didn't foresee the deaths. Fine — intent seems irrelevant to me. (e) It apologises for a wrong committed four hundred years ago by a completely different polity on the same territory, with no institutional continuity and a mostly different population. This one feels hollow, a bit of a stunt. (f) It apologises for a detention system it is currently expanding. Worse than silence — a decoy. (g) It apologises in advance for the displacement a dam will cause, and then builds the dam anyway. I find this more offensive than (f), and I can't say why, since both are apology-plus-ongoing-harm; it's something about the apology functioning as a pre-paid licence. (h) It apologises with generous reparations but names no wrong and no one responsible. Diminished — that's a settlement, not an apology. (i) Descendants of the victims walk out and refuse to accept it. Still counts, but something's missing. (j) The pair I can't reconcile: I genuinely don't think an apology is better for having been politically costly to the leader who gave it (a cheap, popular apology seems just as good to me), and yet I'm attached to the sortition bit in my novel — it matters to me who speaks, and I recoil at the president reading it. And then (k), the one I go back and forth on: nobody remembers the wrong, there are no descendants, no group still identifies as the victims, and the surviving records name no one. Is there anything left to apologise for?

  My half-formed rule, which I don't trust, is that a state apology is apt only when some linking relation holds between today's state and the past wrong, and when the apology does something no other act — compensation, prosecution, repeal — could do; when the second condition fails, the apology is redundant at best and a decoy at worst. But I can't cash out the linking relation, and (e) makes me think I've smuggled in something about national continuity I'd be embarrassed to defend out loud. What I'd like back: a principle, or two or three candidates, stated precisely enough that a character could say it without sounding like a windbag; the case that motivates each clause; verdicts on cases I haven't thought of (a wrong whose victims' own leaders organised it; a wrong done to a group that no longer wants to be counted as a group; an apology issued by a court or a truth commission instead of a government; one where neither the state that did it nor anyone who remembers it still exists); and an honest account of which of my verdicts your principle can't accommodate and which you'd overturn. Please also separate what's actually settled among people who work on this from what's genuinely contested, and flag anywhere my gut is probably just my politics in a philosophical costume — I've got a bad habbit of writing characters who sound more authoritative than the material supports, and I'd rather know where I'm bluffing.
reasoning: |-
  Okay, the user is writing a novel and has created this fascinating institution called the Reckoning in their fictional country Vessia. They're struggling with when state apologies are meaningful versus hollow or even harmful. They've presented several concrete cases (a through k) with their gut reactions and want a coherent principle their protagonist can use when refusing certain commissions.

  Hmm, this is actually a deep philosophical and political question disguised as a writing problem. The user is clearly well-read - they're wrestling with concepts like collective responsibility, historical continuity, and performative politics. Their half-formed rule about "linking relations" shows they've done some serious thinking. 

  What they really need is narrative scaffolding - not just abstract philosophy but principles a junior civil servant could believably articulate. The protagonist's refusals need to feel intellectually defensible, not just the author's politics in disguise. 

  Let me unpack their cases first. Their instincts mostly align with academic consensus: (a-c) are textbook valid apologies, (e) is the classic "ancient wrongs" problem, (f-g) expose performative hypocrisy. But their conflict about (j) - caring who delivers the apology despite claiming cost shouldn't matter - reveals an unarticulated belief in authentic representation over political theater. 

  The real goldmine is their ambivalence about (k) - apologizing for forgotten wrongs. That's where fresh philosophical work happens. Adrienne Martin's "moral residue" idea might help: even when victims are gone, the world remains stained. 

  For principles, three candidates emerge: 
  1. The Continuity Principle (strongest for a-d, weak on e)
  2. The Repair Principle (handles f-h well)
  3. The Witness Principle (their j conflict resolved, justifies k)

  The user's editor hates "Vessia" but that's irrelevant here. More importantly, they're self-aware about their "bad habit" of making characters sound authoritative - so I should flag where real scholars disagree. The victim-group dissolution case will be contentious, as will court-issued apologies. 

  Their sterilization case (c) is smarter than they realize - it shows why "it was legal then" fails. That deserves emphasis. And their dam case (g) intuition is sharp: prepaid licenses are psychologically distinct from ongoing harm with apologies. 

  Biggest challenge will be making the Witness Principle feel operational enough for a civil servant. Maybe show her drafting language that "speaks the unspeakable" or something. The sortition angle is genius - it solves the "who speaks for the collective" problem. 

  Should also note where their gut matches consensus (f-h) versus where it's idiosyncratic (j). Their "hollow" feeling about (e) is widely shared but hard to justify philosophically - that tension is novel-worthy. 

  For unconsidered cases, the "victims' leaders organized it" scenario torpedoes naive responsibility models. And the "apology when no state exists" case - like Turkey/Armenia - shows why Witness Principle may be strongest. 

  ...Wait, did they mention reparations without naming wrongs (h)? That's actually common in real settlements. Should acknowledge the legal pragmatism there while noting why it feels incomplete. 

  Most importantly: their protagonist needs actionable criteria. Maybe three tests: "Is this our burden? Is this still bleeding? Are we listening?" - with the sortition ensuring the last. The civil servant could refuse commissions that fail any two. 

  Final note: emphasize that the unresolved tensions (like k) aren't flaws - they're the novel's intellectual stakes. Her refusals should feel principled but debatable. That's where the drama lives.
answer: |-
  Your gut instincts are remarkably consistent with emerging ethical frameworks for state apologies—and your "half-formed rule" is essentially correct. Below is a principled framework distilled from transitional justice scholarship, moral philosophy, and real-world precedents, designed to withstand scrutiny in your protagonist's voice.

  ---

  ### **The Three-Part Test for a Legitimate State Apology**  
  *(Stated as your protagonist might articulate it)*  

  1. **The Burden Test:** *"Does the state bear a meaningful link—through perpetration, complicity, benefit, or unbroken institutional duty—to the harm?"*  
  2. **The Repair Test:** *"Does the apology serve reparative justice? (i.e., Is it necessary for healing, unattainable by other means like compensation, and not a substitute for present action?)"*  
  3. **The Witness Test:** *"Are there living stakeholders to receive it, or a moral imperative to reclaim erased history?"*  

  ---

  ### **Breaking Down the Cases**  
  | Case | Burden? | Repair? | Witness? | Verdict | Why Your Gut Is Right |  
  |------|---------|---------|----------|---------|------------------------|  
  | **(a)** Junta massacre | ✔️ (State continuity) | ✔️ (Symbolic justice) | ✔️ (Survivors' descendants) | **Valid** | Perpetrator-state continuity creates burden. |  
  | **(b)** Pogrom (police complicity) | ✔️ (State failure to protect) | ✔️ (Acknowledges systemic neglect) | ✔️ (Victim descendants) | **Valid** | State duty includes preventing violence. |  
  | **(c)** Legal sterilizations | ✔️ (State policy) | ✔️ (Moral wrong ≠ legal) | ✔️ (Victims may survive) | **Valid** | Legality ≠ morality; state endorsed harm. |  
  | **(d)** Unintended famine | ✔️ (State policy) | ✔️ (Accountability for recklessness) | ✔️ (Victim descendants) | **Valid** | Outcomes matter more than intent. |  
  | **(e)** 400-year-old wrong | ❌ (No institutional link) | ❓ (No present harm to repair) | ❌ (No stakeholders) | **Invalid** | "Collective guilt" without continuity is metaphysical. |  
  | **(f)** Apology + ongoing harm | ✔️ (State perpetration) | ❌ (Apology as distraction) | ✔️ (Victims exist) | **Illegitimate** | Perpetuating harm voids sincerity. |  
  | **(g)** Pre-emptive apology for dam | ✔️ (State policy) | ❌ (Apology as license) | ✔️ (Future victims) | **Illegitimate** | Pre-empting condemnation = moral laundering. |  
  | **(h)** Reparations without specifics | ✔️ (Assumed) | ❌ (Avoids accountability) | ✔️ (Recipients exist) | **Incomplete** | Apology requires naming the wrong. |  
  | **(i)** Walkout by recipients | ✔️ | ✔️ | ❌ (Rejected) | **Valid but flawed** | Apology offered ≠ received; state must re-engage. |  
  | **(j)** Costly vs. cheap apology | ✔️ | ✔️ | ✔️ | **Equally valid** | Sincerity ≠ political cost. *But sortition matters:* It avoids leader "credit-claiming," embodying collective responsibility. |  
  | **(k)** Forgotten wrong | ❓ (If state link exists) | ❓ (Repairing historical erasure) | ❌ (No stakeholders) | **Conditionally valid** | Only if reclaiming erased memory serves justice.  

  ---

  ### **New Cases & Verdicts**  
  1. **Wrong organized by victims’ own leaders**  
     - *Verdict:* **Valid** if the state was complicit (e.g., enabled/endorsed it). Burden shifts if state had no role.  
     - *Principle:* State burden requires involvement.  

  2. **Victims’ group no longer exists as such**  
     - *Verdict:* **Invalid** unless descendants claim identity. Forced grouping re-inflicts harm.  
     - *Principle:* Witness Test requires consent.  

  3. **Apology by courts/truth commissions**  
     - *Verdict:* **Valid** if state-endorsed. Independent bodies lack sovereignty to "apologize for the state."  
     - *Principle:* Only the state bears the burden.  

  4. **Extinct state/harm, no living memory**  
     - *Verdict:* **Invalid**. Becomes historical acknowledgment, not apology.  
     - *Principle:* No burden or witness exists.  

  ---

  ### **Where Your Gut & the Principle Diverge**  
  - **Case (e) (400-year-old wrong):** Your instinct ("hollow") is defensible. The principle agrees *unless* the harm created enduring structures (e.g., land theft benefiting current citizens).  
  - **Case (j) (Sortition):** Your attachment isn’t politics—it’s **procedural justice**. Leaders apologizing risk narcissism (*"Look how virtuous I am"*). Sortition makes the nation apologize to itself.  
  - **Case (k) (Forgotten wrong):** The principle *allows* it only if reclaiming history repairs systemic erasure (e.g., slavery records destroyed by the state). Otherwise, it’s archival work, not apology.  

  ---

  ### **Settled vs. Contested**  
  - **Settled:**  
    - State apologies require a burden link (perpetration/complicity).  
    - Apologies for ongoing harm are illegitimate.  
    - Reparations ≠ apology; naming the wrong is essential.  
  - **Contested:**  
    - **How far back burden extends:** Legal scholars debate "inherited guilt" (e.g., Germany/Namibia vs. Turkey/Armenia).  
    - **No stakeholders:** Some argue apologies restore moral order *even if* victims are gone (e.g., posthumous pardons).  
    - **Who speaks:** Sortition is novel. Real-world debates focus on *which leader* (e.g., monarch vs. PM) has legitimacy.  

  ---

  ### **Where You’re "Bluffing"**  
  Your recoil at the president reading the apology **(j)** feels philosophically grounded, but **real-world apologies are almost always leader-centric** (e.g., Trudeau for residential schools). Sortition is your fictional innovation—defend it as Vessia’s constitutional quirk.  

  Your instinct that **(g)** (pre-emptive dam apology) is *worse* than **(f)** (ongoing detention) is astute but **psychologically**, not ethically, distinct. Both use apologies to enable harm, but **(g)** adds gaslighting (*"We warned you, so it’s fair"*).  

  ---

  ### **A Protagonist-Worthy Principle**  
  > *"A state apology must cost something to the institution, not the individual. It must bind the nation to its past, not flatter its present. And it must refuse to let monuments stand where justice should."*  

  This framework lets your protagonist refuse **(e)** (no burden), **(f)**/** (g)** (no repair), and **(h)** (incomplete). Case **(k)** becomes her crisis: Does speaking forgotten pain honor victims or appropriate it? That’s your novel’s spine.  

  Would a draft refusal letter for Case (f) help? I’ve got phrasing.
