answer: |-
  ## The Recurrence Question

  The locked unit door clicked shut behind Ada Reinholt. Beyond the reinforced glass of the observation window, the long corridor stretched, washed in the thin, antiseptic light of a winter afternoon. Patients sat in high-backed vinyl chairs, adrift in their own currents. Aides moved with practiced calm. The air hummed with the low thrum of fluorescent bulbs and the distant, rhythmic beep of a monitor. To her left, the small conference room waited, its occupants already seated: Ruth Vance’s children. Ada took a steadying breath, the familiar weight of Item 14 settling in her chest like a cold stone. She pushed the door open.

  Ruth Vance, eighty-two, had been here for three years. Vascular dementia, relentless. Her chart was a chronicle of decline: wandering, agitation, sundowning, the slow erosion of language and recognition. Now, a persistent refusal to eat. The medical team proposed a feeding tube. But Ruth had no advance directive, no written compass for this fog. The Ethics Consultation Service was called in, its standard values-history form deployed, reaching back into the past for guidance in the present. All roads led to Item 14. Would you consent to live this exact life again, without end, every particular included? The staff called it the recurrence question. The answer, whether from patient or surrogate, carried weight. A ‘no’ often tilted scales towards comfort care, a ‘yes’ towards continued intervention. Ada had always felt the question was rigged, a trapdoor disguised as introspection.

  Marian Vance sat closest to the door, Ruth’s daughter. Mid-fifties, her face etched with the fatigue of daily visits. “Dr. Reinholt,” she said, her voice worn soft. “Thank you for seeing us.” Across the small table, her brother, Liam, nodded tersely. Early sixties, Ada guessed, bearing the stiffness of someone unused to hospitals and the journey required to get here from out of state.

  “Ada, please,” Ada corrected gently, sliding into her seat. “I’ve reviewed your mother’s history, the current situation. I understand there’s no advance directive. That leaves us needing to discern her values, her likely wishes. That’s where the values-history form helps, particularly… Item 14.”

  Liam shifted, his chair scraping. “That last question. It’s… grotesque. Asking if she’d *want* this?” He gestured vaguely towards the unit beyond the wall. “Three years lost in there? The confusion, the fear, the indignity? Look at her gown.” He pointed through the observation window. One patient, not Ruth, sat slumped, the frayed end of a faded pink hospital gown ribbon trailing from her shoulder like a wilted flower. A tiny, insignificant detail, yet utterly specific. “Would she choose *that* ribbon fraying just so, again and again? The exact ache in her hip? The taste of pureed carrots she hates? ‘Every particular’? How can anyone answer that for themselves, let alone someone else?”

  Marian flinched. “It’s not about the *gown*, Liam. It’s not about the pureed carrots. It’s about *her*. Who she *was*.” She turned pleading eyes to Ada. “Mom was… light. She found joy in small things, accepted what came. She’d say ‘yes’ to anything life handed her, good or bad. She just *did*. Made the best of it. Made *us* better for it.” Marian’s voice thickened. “She nursed Dad through cancer, never complained. Took in that stray cat Liam brought home, mangy thing that scratched the furniture. Smiled through bridge nights she probably hated. If you’d asked her, when she was clear, if she’d live it all again… she’d have said yes. Because saying no wasn’t in her. She’d have said yes for *us*, for the grandkids she adored. Because her life, even the hard bits, made ours good. That’s who she *was*.”

  “But she’s not *that* now!” Liam countered, his voice sharpening. “That woman who ‘made the best of it’? She’s gone. Asking if *that* ghost in there would consent is meaningless. And asking *us* to project what her younger, healthier self would say? It’s impossible. Worse, it’s self-serving. We answer ‘yes’ because *we* want to believe her life was a resounding ‘yes’, because *we* can’t bear the thought of letting her go. We answer ‘no’ because *we* can’t stomach the thought of her suffering endlessly. But the person living it again? The one trapped in the loop? They wouldn't even know it *was* a loop, Dr. Reinholt. They’d just be living it. Again. And again. How can *we* condemn someone – even a version of Mom – to that blind eternity of… *this*?” He gestured again towards the unit. “Is a world where lives like this, ending like this, are dealt out… acceptable? Can we really say ‘yes’ to *that*?”

  Ada watched the siblings. Marian clutched the edge of the table, knuckles white, defending the essential goodness of her mother’s *life*, its impact – the second question blooming in her fierce loyalty. Liam wrestled with the visceral horror of the lived *now*, the sheer weight of "every particular" endured unknowingly forever – the first question screaming ‘no’. And hanging between them, unspoken but thickening the air, was Liam’s final, awful query: What kind of world would endlessly replicate *this* particular ending? The third question, the one Ada couldn’t evade.

  She remembered her own ‘yes’. Decades ago, a mandatory wellness session during residency. The same form. Item 14. Young, ambitious, buoyed by a sense of purpose, she’d written ‘Yes’ quickly. Almost. Then paused. With a surgeon’s precision, she’d drawn a neat line through the printed ‘Yes’ and written it again, adding a single, fierce qualification in the margin: *‘Except the month of October, 1997. That month is excised.’* A brutal breakup, a professional humiliation, a crushing isolation that had hollowed her out. She’d carved it out of eternity, a piece of darkness she refused to relive. She’d filed the form, sealing away that private amputation.

  Now, this October. Not the same, but echoing. Her daughter, distant, angry, communicating only through terse texts. A professional setback, minor but stinging. A familiar, cold loneliness seeping in. The ‘smaller key’ of that excised month, playing its discordant tune. She hadn't cut deeply enough. The universe dealt particulars.

  “The question,” Ada said carefully, her voice cutting through the tension, “asks what the *patient* would consent to. We have to try to separate our own feelings, our own needs, from what we believe Ruth Vance, based on her known values and character, would decide.”

  “But how?” Liam pressed. “Even if we agree she was a ‘yes’ person, how can we know if that ‘yes’ extended to *this*? To not knowing her children? To fear? To being fed through a tube? The woman who loved bridge and her grandkids is gone. The person enduring *this*… would *she* say yes? Could she even understand the question? And if we answer for her… are we answering for the life lived, or the life ending?”

  Marian looked stricken. “She’d want us to care for her. She’d say yes to being kept comfortable, yes to being safe… even like this. She’d trust us…” Her voice trailed off, the conflict naked on her face. Was she advocating for the mother who cherished life, or clinging to the fading vessel?

  Ada looked down at the form on the table. Item 14. The boxes: Yes. No. Surrogate Signature: _______________. The space below for ‘Comments’. The frayed pink ribbon floated in her mind – a tiny particular, insignificant in the grand shape of a life, yet in that moment, under the lens of eternity, unbearably specific. The gap between Marian’s ‘general shape’ and Liam’s ‘every particular’ yawned wide. Ada’s own excised October throbbed.

  The meeting ended without resolution. Marian wept quietly. Liam remained rigid. Ada promised to complete the consultation report. Now, back in her small office overlooking a different wing of the hospital, the form lay before her. The duty was clear: record the surrogate response and recommendation. Marian said ‘Yes’. Liam effectively said ‘No’. The staff expected a box checked.

  Ada picked up her pen. She thought of Ruth, adrift in the unit. She thought of Marian’s daily vigil, Liam’s horrified distance. She thought of her own younger self, defiantly carving out a month of pain, only to have its shadow return. She thought of the world dealing out lives that culminated in locked units and impossible choices. Could she will *that* world? The question wasn't about Ruth alone.

  Her hand hovered over the ‘Yes’ box, then the ‘No’. Neither sufficed. Neither captured the collision, the unanswerable third question Liam had thrown into the room like a grenade. The question the form pretended was simple. A rigged game.

  Slowly, deliberately, Ada Reinholt drew a single, decisive line through both the ‘Yes’ and ‘No’ boxes. Not an erasure, but a negation of the false choice. In the comments section below, she wrote, in her precise, clinical hand: *‘Surrogate responses conflict. Daughter states patient would have answered Yes based on character and desire to benefit others. Son states no rational person would consent to relive current state of profound dementia. Unable to reconcile. Recommend clinical decision focus on current burdens/benefits of proposed intervention, independent of Item 14 response.’*

  She signed her name and title in the designated space. No box checked. The question remained open, echoing in the silence of the room.

  The locked unit door clicked shut behind Ada Reinholt. Beyond the reinforced glass of the observation window, the long corridor stretched, washed in the thin, antiseptic light of a winter afternoon. Patients sat in high-backed vinyl chairs, adrift in their own currents. Aides moved with practiced calm. The air hummed with the low thrum of fluorescent bulbs and the distant, rhythmic beep of a monitor. To her left, the small conference room stood empty. Ada held the signed consultation form, the line through the boxes a blade of clear winter light across the page.
