  The Arginusae trial as a fourth case makes sense. It's a clear example of rash action followed by regret, plus Socrates' involvement adds depth. But I must flag contested details (like Socrates' role) where sources disagree.

  For the format, the agreed claims section must be substantive but not forced. Where consensus is thin, I'll state that plainly. The disagreements table should show each camp's predictions testably. And clarifying terminology avoids talking past each other—like "democracy" meaning Assembly vs whole system.

