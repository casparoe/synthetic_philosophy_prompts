prompt: |-
  I'm in a final-year seminar on moral responsibility, and last week's session on the standing to blame has left me stuck inside an argument I built for my response paper and can no longer see the exit from. I want to hold on to two claims: that a hypocrite really is missing something when they blame, and that a great deal of ordinary blame is entirely in order. The trouble is the route from the first to the denial of the second:

  (1) If A blames B for a wrong of kind K, and A has herself committed a wrong of kind K without acknowledging it or making amends, then A lacks standing to blame B.
  (2) Standing is a matter of A's relation to the norm B is accused of violating, not of whether B actually violated it; standing is what makes the blame A's to give.
  (3) Blame issued without standing is not merely offensive but defective: it fails to do whatever blame is supposed to do, and B may properly set it aside by pointing out that A has done the same.
  (4) Nearly every adult has done something morally wrong that they have neither acknowledged nor fully made amends for.
  (5) Kinds of wrong are classifiable at multiple levels of generality: any two wrongs fall under some shared description (carelessness; disregard for someone else's interests; acting on a maxim one would not universalize; treating a person as a means), while also being distinguishable under some finer-grained description.
  (6) So for any wrong of B's there is some description K under which it and some unacknowledged wrong of A's both fall, and by (1) A lacks standing.
  (7) Since A was arbitrary, no one ever has standing to blame anyone for anything, and by (3) blame never succeeds at what it is for.
  (8) That cannot be right: some blame plainly is in order, and a practice that could never once succeed is not a practice we could ever have acquired.

  I tried escaping by narrowing (1) to cases where A's own conduct shows she does not genuinely accept the norm she invokes, but the ladder seems to rebuild itself, since for any norm A invokes there will be some other norm she has flouted. So please tell me which step you would reject, why that step looked airtight, and what each of the alternatives costs — including what each of the three accounts we read (blame as second-personal moral address, blame as a modification of the blamer's relationship to the target, and blame as a judgment about the target's quality of will) would have to pay to reject (6), to reject (3), or to reject (1). I would rather keep (1) and (8) than (4) or (5), but I want to know the price before I choose. Answer in American English, in no more than 450 words, and lead with a single sentence naming the step you reject before turning to the diagnosis and the pricing.
reasoning: |-
  Hmm, the user is grappling with a philosophical dilemma about moral responsibility, specifically the standing to blame. They've constructed a logical argument that leads to a paradox where no one can ever legitimately blame anyone else due to universal hypocrisy. They want to preserve both the idea that hypocrites lack standing to blame and that ordinary blame can be valid. They've outlined eight steps in their argument and are asking which step I would reject and what the costs would be.

  Looking at their argument, I notice step (6) seems particularly vulnerable. The problem lies in how we define "kinds of wrong" (K). Step (5) allows for any two wrongs to share some abstract description, but in practice, standing to blame requires more specific relevance. For example, blaming someone for cheating while you've committed tax fraud might not undermine your standing because these are different wrongs in morally significant ways. The hypocrisy objection works best when the hypocrite's wrongdoing directly contradicts the specific norm they're invoking.

  I need to consider how different theories of blame would handle this. For second-personal address (Darwall), standing depends on mutual recognition of authority regarding that specific norm - tax fraud doesn't necessarily undermine authority about cheating norms. For relationship-based views (Scanlon), blame concerns breaches in particular relationships - past cheating might affect standing to blame for cheating, but unrelated wrongs wouldn't. Quality-of-will accounts (Arpaly) focus on the target's current attitudes - the blamer's hypocrisy might be irrelevant unless it shows insincerity about the current judgment.

  Rejecting step (6) preserves the intuition that some blame is valid while acknowledging that hypocrites lack standing regarding directly comparable wrongs. This comes at the cost of needing to develop criteria for when wrongs are "relevantly similar" - which could be messy but seems necessary. Alternative rejections would be more costly: challenging step (3) would require redefining blame's function to be independent of standing, while rejecting step (1) would undermine the core intuition about hypocrisy.

  The user mentioned preferring to keep steps (1) and (8), which aligns with this approach. I should emphasize how this solution maintains the substance of their preferred claims while avoiding the paradox. The key is tightening the scope of "kind K" to prevent overgeneralization while preserving legitimate cases of standing-based blame.
answer: |-
  I reject step (6), as it misapplies the "kind K" requirement for standing by exploiting the possibility of irrelevant over-generalization.

  The argument hinges on (6) finding *some* shared description K for *any* wrong of B's and *any* unacknowledged wrong of A's. Step (5) makes this technically possible through extreme abstraction (e.g., "violated *some* moral norm"). However, the intuitive force of the hypocrisy charge in (1) relies on A violating a norm *relevantly similar* to the one they invoke against B. The standing deficit arises because A's own *specific* conduct regarding *that type* of norm undermines their authority to hold B accountable *for that norm*. The ladder rebuilds only if we allow K to be stretched so thin that it loses the specific normative connection essential for the charge of hypocrisy to bite. Blaming B for stealing while A has unacknowledgedly lied might share K="dishonesty", but if the norms governing theft and lying are distinct in practice and A's lie doesn't demonstrate insincerity about the *wrongness of theft specifically*, the standing deficit is weak or non-existent. Step (6) illegitimately leverages abstract similarity to manufacture universal hypocrisy.

  **Why (6) seemed airtight:** (5)'s allowance for *any* shared description, combined with (4)'s claim of near-universal unacknowledged wrongdoing, makes finding *some* K for any A and B appear logically inevitable.

  **Costs & Alternatives:**

  *   **Rejecting (6):** Requires developing criteria for when wrongs are "relevantly similar" under K for standing to be undermined. This introduces complexity and potential vagueness, but aligns with intuitions about targeted hypocrisy. It preserves (1) (for relevant K) and (8).
      *   *Second-Personal (Darwall):* Standing requires reciprocal recognition of authority regarding the *specific* norm invoked. Only hypocrisy on *that specific norm* (or one demonstrating fundamental rejection of the moral community's authority *as such*) directly undermines this standing. Cost: Must explain why not all norm violations demonstrate such fundamental rejection.
      *   *Relationship-Modification (Scanlon):* Blame addresses impairments in a specific relationship caused by the wrong. A's *unrelated* past wrongs (even unacknowledged) don't necessarily impair her standing to address *this* impairment with B, unless they directly show she doesn't value *this* relationship/norm. Cost: Must clarify when past wrongs are normatively connected to the present blame.
      *   *Quality-of-Will (Arpaly, etc.):* Blame is a judgment about B's ill will. A's hypocrisy *might* signal her judgment is clouded (self-deception, bad faith), but not necessarily. Only hypocrisy demonstrating A lacks the competence to judge *this type* of ill will directly undermines standing. Cost: Must show why hypocrisy often, but not always via irrelevant K, indicates faulty judgment.

  *   **Rejecting (3):** Preserves (1) & (6) but severs the link between lacking standing and blame's function. Blame without standing might still "succeed" (e.g., express accurate judgment, prompt remorse) but be objectionable for other reasons (offensive, unfair). Cost: Weakens the distinct importance of *standing* itself; makes "pointing out hypocrisy" merely a tu quoque deflection, not exposing a functional defect. All theories pay heavily here, as standing is central to their accounts of blame's distinctive nature.

  *   **Rejecting (1):** Abandons the core intuition that hypocrisy undermines standing. Maybe hypocrisy only makes blame *rude* or *ineffective*, not defective in principle. Cost: High; contradicts powerful moral intuitions and makes hypocritical blame seem merely impolite, not illegitimate. All theories struggle to explain the distinctive force of the hypocrisy objection without some version of (1).

  Rejecting (6) by demanding relevant specificity for K is the least costly path, preserving the substance of (1) and (8) while avoiding the absurdity of (7), though it requires careful normative work on relevance.
