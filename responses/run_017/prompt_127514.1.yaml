answer: |-
  ### Joint Statement on Intergenerational Justice and Climate Change  
  **I. Preamble**  
  This document results from a structured adversarial collaboration between two research programmes on intergenerational justice and climate change. We jointly examined core disagreements through three stipulated analytical tools (*Climatic Option Space*, *Conditional Legacy Bonds*, and three agreed evidentiary cases), aiming to isolate substantive cruxes from verbal ambiguities. We did not seek final resolution of all philosophical differences, but to clarify where disagreement persists and where shared commitments exist for policy purposes.  

  **II. Agreed Claims**  
  1. **Non-Welfare Wrongs**: A policy can be wrongful even if it makes no individual worse off (e.g., by foreclosing future societal possibilities without altering individual welfare levels).  
  2. **Extinction Risk**: Risk of human extinction or civilisational collapse cannot be folded into the discount rate; it requires separate, lexically prior evaluation.  
  3. **Beneficiary of Duty**: Duties of intergenerational justice run to *future persons collectively*, not to abstract transgenerational entities or only to specific individuals.  
  4. **Irreversibility Matters**: Policies imposing *effectively irreversible* losses (e.g., species extinction, ice-sheet collapse) warrant greater caution than reversible losses of equivalent welfare impact.  
  5. **Option Space Valuation**: Losses to *climatic option space* (distinct viable social trajectories given inherited climate conditions) cannot be **fully** compensated by bequests of manufactured capital or technology.  
  6. **Growth vs. Level Damages**: Whether climate damages reduce the *level* of future welfare or its *growth rate* materially affects policy choice: growth-rate damages justify greater near-term sacrifice.  
  7. **Discounting Framework**: Welfare discounting (using a Ramsey formula decomposing into pure time preference, growth, and risk terms) is *necessary* for comparing intertemporal costs/benefits, but not *sufficient* for capturing all ethical concerns.  
  8. **Custodial Thresholds**: There exists *some* minimum climatic option space that must be preserved, irrespective of welfare trade-offs, though its precise specification is contested.  
  9. **Non-Identity Problem Acceptability**: Policies altering which future persons exist are permissible if all potential lives are worth living *and* climatic option space is preserved above the minimum threshold.  
  10. **Technological Uncertainty**: Radical uncertainty about future abatement technologies does not justify inaction but affects optimal policy pathways.  

  **III. Disagreements Table**  
  | Issue | Camp A’s Formulation | Camp B’s Formulation | Substantive/Verbal | Settled By |
  |-------|----------------------|----------------------|-------------------|-----------|
  | **Primary Duty** | The core duty is non-compensable *custody*: delivering adequate climatic option space is a constraint, not a trade-off. | The core duty is maximizing expected welfare across generations; preserving option space is instrumentally valuable within this. | Substantive | Empirical analysis of whether societies consistently prioritize option space over welfare-equivalent compensations. |
  | **Discount Rate Justification** | A positive *pure rate of time preference* (preferring present welfare over identical future welfare) is ethically indefensible in intergenerational contexts. | A minimal pure rate of time preference is defensible due to existence uncertainty and non-zero extinction risk. | Verbal | Clarifying that Camp B's "pure rate" incorporates existential risk, making the dispute about risk accounting, not time preference. |
  | **Conditional Legacy Bond’s Role** | The Bond *creates* accountability by empowering successors to judge custodial performance, revealing a duty beyond compensation. | The Bond *measures/incentivizes* welfare-maximizing behavior by revealing successors’ revealed preferences over option space vs. other goods. | Substantive | Observing whether Bond payouts correlate with objective option-space metrics or subjective welfare assessments. |
  | **Compensability of Option Loss** | Losses to climatic option space are *categorically non-compensable* by non-climatic goods (e.g., infrastructure, AI). | Losses to climatic option space are *partially compensable* if substitutes expand future agency (e.g., advanced adaptation tech). | Substantive | Case studies of societies recovering agency after climatic catastrophe via non-climatic capital. |

  **IV. Cruxes Section**  
  | Sub-Question | Test Case | Camp A Prediction | Camp B Prediction | Concession if Wrong |
  |--------------|-----------|-------------------|-------------------|---------------------|
  | **Does delay imply custodial failure even if welfare-efficient?** | *Cheap Later* (Abatement 10x cheaper in 2060; delay locks in higher concentrations) | Delay fails custody: locked-in concentrations irreversibly narrow option space regardless of future tech. | Delay is welfare-optimal: cheaper abatement later frees resources for immediate poverty reduction. | A: Concede delay is permissible if option space loss is negligible. B: Concede delay is wrongful if option space thresholds are breached. |
  | **Can compensation substitute for option-space preservation?** | *Irreversibility* (Threshold-crossing causes unavoidable multi-century sea-level rise) | No compensation possible: submerged coastal territories eliminate settlement/agricultural options permanently. | Partial compensation possible: floating cities, advanced desalination, or genetic crops could offset losses. | A: Concede if novel options demonstrably exceed lost ones. B: Concede if compensation efforts consistently fail in analogous historical cases. |
  | **Does welfare aggregation overlook non-identity problems?** | *Non-Identity* (Policy changes who exists; all lives worth living; option space varies) | Policy is wrongful only if it delivers *inadequate* option space, regardless of who exists. | Policy is permissible if it maximizes expected welfare across potential populations. | A: Concede if option space loss is minor and welfare gain large. B: Concede if option space loss exceeds a quantifiable welfare threshold. |

  **V. Appendix: Merely Verbal Disagreements**  
  1. **"Discounting Assumes a Single Currency"**: Dispute dissolves upon clarifying that Camp B uses discounting for *welfare comparisons*, not claiming welfare is the sole ethical "currency." Camp A agrees welfare is one metric but rejects its sufficiency.  
  2. **"Thresholds are Unfalsifiable"**: Camp B defines "falsifiable" empirically (testable against welfare outcomes), while Camp A defines it ethically (testable against societal viability). Both agree thresholds require justification, but differ on the relevant evidence.  

  **VI. Joint Advice to Finance Ministries**  
  **Recommendation**: Prioritize policies that avoid *effectively irreversible losses* to climatic option space (e.g., breaching biome viability thresholds, committing to meters of sea-level rise), while using a low social discount rate (≤1% pure rate + growth adjustment) for standard cost-benefit analysis of reversible impacts. **Why the Disagreement Doesn’t Matter Here**: Both camps agree irreversible losses demand exceptional caution; both endorse low discount rates for long-term impacts (Camp A due to non-substitutability, Camp B due to growth uncertainty and risk aversion). Disputes about compensation or custodial metaphysics do not alter this near-term priority under irreversibility risks.  

  ---  
  *This document, signed by representatives of both research programmes, constitutes a shared understanding of terms, disagreements, and actionable consensus for climate policy.*
