  But the sophist might reply: "No, it's impossible because of the dependency chain and the fact that we start at time 0 with nothing done. If we had an infinite past, it would be possible. But in a finite time interval starting at 0, it is impossible to complete such an infinite backward chain."

  And then the rope-maker's daughter can say: "But you said regarding the yard that there is no first half to cross; you just begin. But in my scenario, there is no first task to do; you just begin. And yet it leads to a contradiction. So why is it acceptable for the yard but not for my rope of tasks?"

  This turns the tables.

  Now, the specs: we have met 1,2,3,4,5.

  But for spec 4, we used instantaneous tasks. Is that allowed with everyday objects? We can replace instantaneous tasks with very short tasks that fit in the intervals. For example, let the duration of task n be 1/4^n. Then the total time for all tasks is 1/3. Schedule the start time of task n at s_n = 1/2 - 1/2^n. Then the end time is s_n + 1/4^n.

  Check the dependency: task1 requires task2 to be done by the start of task1. The start of task1 is s1 = 1/2 - 1/2 = 0. But then we haven't done task2 by time 0? Task2 starts at s2 = 1/2 - 1/4 = 1/4, which is after 0. So that doesn't work.

  To fix, we can schedule the start times in the reverse order: let the start time of task n be at s_n = 1/2^{n+1} (so that they are decreasing). But then the start times: task1 at 1/4, task2 at 1/8, task3 at 1/16, etc. Then the end time of task2 is 1/8 + 1/16 = 3/16, and the start of task1 is 1/4 = 4/16, which is after 3/16. So task2 is done before task1 starts. Similarly, task3 starts at 1/16 and ends at 1/16+1/64=5/64, and task2 starts at 1/8=8/64, which is after 5/64. So it works.

  Now, the last task T_last: we can schedule it at time 1, and it requires task1 to be done. Task1 ends at 1/4 + 1/16 = 5/16, which is before 1. So it works.

  But now, the times: we start at time 0. The first task in time is task1 at 1/4? But task1 starts at 1/4, and before that, at time 1/8, we start task2, and at 1/16, task3, etc. So again, there is no first task in time. The start times are 1/4, 1/8, 1/16, ... which have no minimum.

  So the puzzle remains: how do we start? At time 0, we start by doing... what? We haven't done any task. Then at any time after 0, we have already done infinitely many tasks? For example, at time 1/4, we start task1. But by then, we have already done task2 (which ended at 3/16 < 1/4), task3 (ended at 5/64 < 1/4), etc. But how did we do these tasks? We never did a first task.

  So we can describe it with durations.

  The rope-maker's daughter might say:

  "Imagine we have an infinite number of spools to unwind. Each spool is half the size of the previous one. To unwind spool A, we must have already unwound the spool that is half its size, call it B, because the rope of A is tied to B. So we must unwind B before A. But similarly, to unwind B, we must have unwound a spool C that is half the size of B, and so on. We start at time 0 and spend on each spool a time that is half the time we spent on the previous one. Specifically, we spend 1/2 minute on the first spool we unwind, then 1/4 minute on the next, then 1/8 on the next, and so on. But wait, which spool do we unwind first? We don't have a largest spool? They get arbitrarily large? That doesn't work.

  Alternatively, they get arbitrarily small. But then we start with the largest? But there is no largest.

  So we can say: we start at time 0 by unwinding the first spool we can access. But there is no first in the chain because every spool has a larger one that contains it.

  So we must start with an arbitrarily large one? How?

  We can say: we have a finite time of 1 minute. We unwind the spools in the order of increasing size: first the smallest (which requires nothing), then the next smallest (which requires the smallest), and so on. But then we have a first task: the smallest. So that doesn't work.

  So I think the instantaneous or very short tasks with the schedule as above is the best.

  To make it stageable, we can use a row of candles: to light candle C1, we must have lit candle C2, and to light candle C2, we must have lit candle C3, and so on. And then we have a final candle that requires C1 to be lit. We have a runner who lights the candles at the scheduled times.

  But the puzzle is the same.

  So I think it works.

  The strongest sophist reply is: "This scenario is impossible because it requires that an infinite number of tasks be completed before any task can be done. Since we start at time 0 with no tasks done, no task can ever be done. Therefore, the entire chain cannot be completed. This shows that your scenario cannot be staged, and hence it does not provide a counterexample to my claim that one can begin an infinite sequence without a first step. In the yard, we don't have such dependencies: to cross the second half, you don't need to have already crossed the first quarter; you just cross them in sequence. But in your scenario, the dependencies create a vicious infinite regress."

  And then the rope-maker's daughter might counter: "But in the yard, if we consider the sequence of events: first you cross the first half, then the next quarter, then the next eighth, and so on. To cross the second half, you must have crossed the first half. To cross the third quarter, you must have crossed the first half and the second quarter? Not necessarily: you can cross the second half without having crossed the third quarter? But the point is that the crossing of the whole yard is a continuous motion, not a sequence of discrete tasks. But if we model it as a sequence of discrete tasks, then to cross the nth segment, you must have crossed the (n-1)th segment before. And then the sequence has a first task: crossing the first half. So there is no problem. But in my scenario, there is no first task. So the yard is not analogous."

  This would be a deep discussion.

  Now, the step I am least confident about: 
  - The ability to complete infinitely many tasks in a finite time without a first task. 
  - The objection that at time 0, nothing is done, and then at the first instant after 0, we have already done infinitely many tasks? That seems paradoxical. 
  - What would convince me the case doesn't work? If there is a proof that in any well-defined causal chain in time, there must be a first event. But in mathematics, we can have a set of events with times in a set that has no minimum. So it is logically possible, but physically? With everyday objects, it may be impossible. 

  So for the purpose of the novel, it might be acceptable.

  In summary, the thought experiment is:

  "We have an infinite sequence of tasks: task1, task2, task3, ... and a final task. Task1 must be done before the final task. Task2 must be done before task1, task3 before task2, and so on. We schedule task1 at 1/2 minute, task2 at 1/4 minute, task3 at 1/8 minute, and the final task at 1 minute. Each task is done at its scheduled time and takes no time. But at time 0, no task is done. Then, at any time after 0, there is a task scheduled. However, to do task1 at 1/2, we require that task2 has been done, and it was done at 1/4. Similarly, task2 required task3 at 1/8, and so on. So by 1/2 minute, we have done infinitely many tasks. But how did we start? There is no first task in time, so we never did a first task. Yet we have done them all. How can that be?"

  And then the machinery as above.

  If I were to drop a spec, it might be the requirement of no gods or infinite precision. We are already using an infinite number of tasks and instantaneous actions, which are idealizations.

  But I think it's acceptable for a dinner scene.

  So here's the one-paragraph version for the rope-maker's daughter to say:

  "Imagine, if you will, an unbroken chain of tasks stretching backwards in time: each task must be completed before the one that depends on it. We start at time zero to perform them all within one minute. We set the first task in our schedule for half a minute, but it requires a second task to be done by then, so we schedule that at a quarter minute. But that one requires a third, so at an eighth of a minute, and so on, halving the time for each. Now, at any moment after zero, infinitely many tasks have already been performed: for instance, by half a minute, we've done the second, third, fourth, and so on. Yet we never did a first task: no task was the earliest. How then did this infinite labor begin?"

