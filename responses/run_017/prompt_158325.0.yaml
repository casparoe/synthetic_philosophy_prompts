  Okay, the user wants me to create a satirical FAQ section for a citizens' assembly handbook. They're roleplaying as a political theorist who's been selected for this lottery-based legislature called the Sunbury Citizens' Chamber. 

  First I need to understand the core assignment: a deadpan, official-sounding document that exposes the absurdities of sortition systems through pure bureaucratic language. No overt jokes, just carefully crafted institutional speak that makes informed readers recognize the critiques while remaining plausible to newcomers.

  The user has given very specific parameters - they want me to work from actual features of this fictional chamber (demographic matching, pre-framed questions, controlled information flow) while adding 2-3 invented elements in the same spirit. Crucially, I must avoid stating any objections directly - the satire must emerge from how procedures are described.

  Hmm... the key tension points I should highlight through Q&A format:
  - The illusion of participation versus actual constraints (what members can decide)
  - How "ordinary citizen" status gets weaponized against expertise
  - The obsessive measurement of "good deliberation"
  - Where real power resides (Convening Panel, framing office)
  - The professionalization of randomness through alumni systems

  For invented elements that fit seamlessly:
  1) An "Ordinariness Maintenance Protocol" - perhaps members must report mundane life details to preserve their commoner status
  2) A "Deliberative Calibration Unit" that monitors facial expressions during sessions
  3) Mandatory "Civic Reabsorption" counseling post-service to readjust to not being special

  The voice needs to be terrifyingly reasonable - like a wellness brochure crossed with a surveillance manual. I'll use phrases like "we find it helpful when..." and "best practice suggests..." to make control sound benevolent. 

  Biggest challenge will be maintaining absolute deadpan. No winks. Just pure institutional cheerfulness about thought control. The dread comes from phrases like "matched pairs of witnesses" and "non-deliberative flags" presented as unremarkable.

  For structure: letterhead first, then brief preamble establishing the cheerful corporate tone. Q&A should progress from basic logistics to deeper philosophical tensions, ending with bland contact info. Each answer should subtly reveal the machinery while sounding utterly routine.

  Must remember: no villains, no scandals. The horror is in the perfect administration. When describing how recused experts become "Witness Liaison" staff, it should sound like promotion rather than exclusion.

  Final touch: all invented terms need bureaucratic acronyms (DMP for Deliberative Maturity Profile, OB for Official Briefing) to enhance realism.
