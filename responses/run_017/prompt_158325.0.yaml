  **SUNBURY CITIZENS’ CHAMBER**  
  **Member Experience Office**  
  *Building a Shared Future, Together*

  Welcome to the Sunbury Citizens’ Chamber! This guide answers common questions from new members like you. We’re here to support your journey as a vital part of our state’s unique governance model.

  ---

  **QUESTIONS NEWLY SELECTED MEMBERS ASK MOST OFTEN**

  1.  **What exactly will I be deciding?**  
      You will be deliberating on specific questions posed to the Chamber by the independent Convening Panel. These questions arrive in their final, precise wording. Your role is to consider the Official Briefing materials, engage in facilitated dialogue with fellow members, and ultimately select from the pre-cleared options presented. Think of it as bringing your lived experience and common sense to carefully framed matters of public importance.

  2.  **What if I already know something about the topic? Isn’t that helpful?**  
      While diverse backgrounds enrich our Chamber, professional or specialized expertise on the specific question before us requires careful management to preserve the representative ordinariness of the sample. If our preliminary screening indicates relevant expertise, you’ll be temporarily reassigned to our Witness Liaison tier. This vital role supports the experts providing testimony, ensuring your valuable knowledge still serves the Chamber constructively without influencing the deliberative balance.

  3.  **Can I read up on the topics beforehand?**  
      To ensure all members engage with the same high-quality, neutrally framed information, the Official Briefing is your sole authorized source material. The Frame Integrity Undertaking you’ll sign protects the fairness of the process by confirming you won’t consult outside sources specifically related to the Chamber question. This guarantees a level playing field built on shared, curated evidence.

  4.  **How do we hear from experts?**  
      Expert perspectives are presented through paired testimonies, offering contrasting viewpoints on key aspects of the question. Our Office of Neutral Framing diligently commissions counter-witnesses where necessary to ensure balanced perspectives. In the rare instance only one qualified perspective exists (designated Single-Testimony), the Briefing will clearly note this, and your facilitators will guide you on appropriately calibrated consideration.

  5.  **Can I talk to other members outside the formal sessions?**  
      Scheduled sessions and designated small-group deliberations are the appropriate venues for substantive exchange. Unscheduled discussions about the Chamber question, especially those involving persuasion or sharing unauthorized information, constitute Prohibited Deliberative Contact. We encourage friendly social interaction on non-Chamber matters! To foster new connections, seating arrangements are rotated weekly.

  6.  **What if I have strong feelings and my mind doesn’t change?**  
      A diversity of starting viewpoints is expected and welcome! Our process values thoughtful consideration of all Briefing materials and peer perspectives. Your opening and closing values inventories help us understand the deliberative journey. Members showing low opinion movement metrics (flagged as potential "non-deliberative engagement") receive additional, personalized facilitation support to help them fully explore the presented evidence and arguments – it’s about ensuring everyone has the tools to engage deeply.

  7.  **Who makes sure everyone gets heard fairly?**  
      Equity is fundamental. Each member receives an equal, non-transferable allocation of speaking time during plenary discussions, managed by your session facilitator. Our Deliberative Integrity Score also tracks airtime equity alongside other constructive engagement indicators. The weekly table rotations further ensure you interact with a wide cross-section of colleagues.

  8.  **What happens if someone I know gets selected too?**  
      To prevent pre-existing relationships from influencing the dynamic, members are not seated at deliberation tables with anyone they knew prior to selection. This preserves the integrity of the random sample’s interactions. Think of it as an opportunity to build entirely new connections representative of our whole state!

  9.  **What actually happens to our decisions?**  
      The Chamber’s final recommendation, reflecting the membership's considered choice among the pre-cleared options, is formally transmitted to the Convening Panel. The Panel is obligated to provide a written response within twelve months, detailing whether they accept the recommendation in full, accept it in part, or simply note it for consideration. This ensures your work receives an official, accountable response.

  10. **What support is there after my 18-month term ends?**  
      Your service is invaluable and non-renewable to maintain the Chamber’s freshness. To leverage your unique experience, the Alumni Register and Certified Deliberator credential offer pathways to continue contributing to civic health, such as roles in facilitation, Briefing review, or Civic Ambassadorship. Your standing in the Register is helpfully informed by metrics like attendance and Deliberative Integrity Scores during your term. We also offer optional Civic Reabsorption Workshops to support your transition back to private life.

  11. **I’m worried about fitting this into my life. What about work/family?**  
      We understand! The Chamber schedule is designed to be manageable. Service comes with a modest stipend and provisions for necessary leave. Our Member Experience Team works closely with you and your employer (under the Chamber Participation Accommodation Act) to minimize disruption. Think of it as a unique, temporary civic sabbatical.

  12. **Will this disqualify me from running for office later?**  
      To honor the principle that sortition service is distinct from electoral politics, members are ineligible to stand for state or federal elected office for six years following their term conclusion. This cooling-off period helps maintain the unique character of the Chamber as a space for non-careerist public deliberation. Your future contributions through the Alumni Register remain fully available!

  ---

  We hope this clarifies your initial questions. Your contribution is essential to the Sunbury Citizens’ Chamber. For further assistance, please contact the Member Experience Team at members@sunburychamber.gov.sx or call 555-CHAMBER (555-242-6237). We look forward to welcoming you in person soon!
