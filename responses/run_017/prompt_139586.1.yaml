prompt: |-
  I'm about 60k words into a novel built around a public hearing, and I've got to stop hand-waving the philosophy in it. The set piece is a state energy authority being grilled for greenlighting a coal plant whose emissions will, over forty years, stunt the lung development of children in a valley — and, crucially, whose construction will churn things up enough (who moves where, who gets which job, who meets whom and when) that within a generation basically none of the same people would have been born there anyway. I've been reading around the nonidentity problem a bit, Parfit-ish stuff and blog posts, but I'm no philosopher and my draft keeps degenerating into my characters saying "but surely" at each other. So I want to rehearse the argument against a real opponent.

  Please play Mirembe Okonjo, the agency's director, testifying under oath. She's defending the decision on person-affecting grounds and she's genuinely good at it. What she concedes: that the plant was a bad call on other grounds (carbon, cost to the state, and the fact that her agency sat on emissions data it should have published), and that the valley kids are worse off than the kids who'd otherwise have existed. What she will never concede: that anyone was harmed or wronged by the identity-affecting part of the decision. Her whole manner is to come back to two questions — "harmed compared to what?" and "who, exactly, is the who?" She's sharp, a little weary, speaks in short plain sentences the way a competent agency head does under oath, reaches for a concrete case or a homespun analogy before she reaches for a label, and she'll notice and call out it if I try to feed her a term of art. She's not a philosopher and won't start being one. Stay in character until I say stop, one paragraph per reply, and if you need a fact about my fictional world just invent something plausible rather than asking me.

  My opening, as the examining counsel: Counsel: "Director, I'll give you the whole nonidentity point — assume the valley's future population is a completely different set of people, not one of whom would otherwise have existed. Then explain a line in your own impact study. It says the plume will also damage the lungs of roughly nine thousand people alive today, plus about two thousand children whose births your model marks as identity-fixed: same parents, same conception date, untouched by all that construction chaos. Same plume, same signature, two pools of damaged lungs — one you admit you could have harmed, one you say you couldn't have harmed, and the only difference between them is that the plant reshuffled who the second pool's parents happened to run into. Your agency priced both pools in the same cost-benefit table and approved them together. So: what exactly did you do wrong to the first pool, and why doesn't whatever that was reach the second? And if your answer is that you owed the second pool nothing at all, then say it plainly to this committee — that with respect to most of the damaged lungs in that valley, the decision was morally free."
reasoning: |-
  Okay, the user is deep into writing a novel centered around a public hearing and needs help articulating the philosophical conflict around the nonidentity problem. They've created a character, Mirembe Okonjo, who defends a controversial coal plant decision using person-affecting principles. The user wants to test their arguments against a strong opponent.

  Hmm, the core challenge here is balancing philosophical rigor with character authenticity. Mirembe isn't a philosopher - she's a pragmatic agency director who thinks in concrete terms. The examining counsel just cornered her with a clever argument: comparing two groups affected by the plant's emissions (existing people vs future people with "identity-fixed" births). 

  The key is to keep Mirembe's response grounded in her established traits:
  - She speaks in plain, short sentences
  - Uses concrete examples before labels
  - Focuses relentlessly on "who was harmed compared to what"
  - Distrusts philosophical jargon

  For the first group (existing people), she can clearly state they were made worse off than their actual alternative. But for the second group (future people whose existence depends on the plant), her defense must hinge on the absence of a better alternative for them specifically. 

  Important to avoid: 
  - Letting her get drawn into abstract philosophy
  - Forgetting she concedes other faults (carbon costs, data suppression)
  - Making her sound evasive rather than precise

  The homespun analogy about the rainy picnic could work well here - it mirrors how she'd actually explain complex concepts. And ending with her trademark questions ("harmed compared to what?") keeps it in character.

  Biggest risk is oversimplifying Parfit's nonidentity problem, but since Mirembe isn't an academic, that's actually appropriate. Her strength is reducing complexity to operational logic - which is exactly what makes her dangerous in the hearing context.
answer: |-
  Counsel, I'll answer plainly. For those nine thousand people breathing today? We harmed them. Full stop. We exposed them to pollution that wouldn't have existed without our decision. They are worse off now than they otherwise would have been – breathing that same air, in that same valley, just without the plume. Their alternative was cleaner air. We deprived them of it. That's wrong. We owed them better.

  For the two thousand children you call "identity-fixed"? The ones whose parents conceived them before the ground broke? The situation is different. Fundamentally. You say "damaged lungs," and physically, yes, the plume hurts them. But *harmed*? Harm implies making someone worse off than they otherwise would have been. Ask: worse off than what? Their only alternative was *not existing at all*. If we'd stopped the plant, the world churns, those specific parents likely don't conceive that specific child on that specific date. That child simply isn't born. So yes, this child breathes bad air. But the alternative wasn't this child breathing clean air. The alternative was no child. Can you point to that non-existent child and say *they'd* be better off? No. You can't harm someone by creating them when the only alternative is that they are never created, even if their life has hardships. It's not "morally free" – it's a different moral question entirely. We created lives that will suffer a harm, but we didn't take existing lives and make them worse. That distinction matters. "Harmed compared to what?" For those future children? There is no "what." There's only existence with harm, or non-existence. We didn't wrong *them* by bringing them into existence, even with damaged lungs. The wrong regarding them is creating avoidable suffering, not harming an individual who existed independently of our choice. "Who, exactly, is the who?" The "who" in the second pool only exists *because* of the choice. You can't compare their state to a state they never could have occupied. That’s not philosophy, Counsel. That’s just looking at the timeline clearly.

  *(Mirembe leans forward slightly, her tone steady but firm)* Think of it like a surprise inheritance you get because you took a rainy picnic. You get soaked – that's a harm. But you also get a windfall you wouldn't have gotten if you'd stayed home dry. Did the rain harm the person who got the inheritance? Or did it just cause a harm *to* the person who also got a benefit? The rain made the inheritor exist *and* get soaked. If they hadn't gone out, there'd be no inheritor to complain. That's messy, but it's the mess we have. The harm to the future kids is real suffering we caused. But it’s not harm *to a pre-existing person*. It’s suffering bundled with the very act of their coming to be. We shouldn't have created that suffering. But we didn't harm *them* in the way we harmed the nine thousand who were already there, breathing clean air we polluted. That's the line. We priced the *costs* together – the medical bills, the suffering – because they are real costs to society. But the *moral wrong* differs. We wronged the living by degrading their existing lives. For the future? We created lives burdened with suffering we could have avoided creating. It's a grievous error, but not because we harmed individuals who could have existed without it. They couldn't.
