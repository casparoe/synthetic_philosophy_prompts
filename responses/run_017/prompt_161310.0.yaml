  Looking at their context: informal pub-based reading group, third-year philosophy students focused on Mahāyāna texts. Key pain point is friends using "intention is karma" to dismiss consequentialist readings of compassionate precept-breaking. User suspects this is unexamined. Constraints: no new citations, British English, menu format not a single verdict.

  Now, structuring the response. I'll map each interpretation they requested: (1) strong constitutivism, (2) epistemic approach, (3) causal mechanism, (4) experiential axiology, (5) two-level theory. For each, I'll cover: what it claims, whether it's platitudinous/substantive/false, whether it blocks consequentialism, and the blameless vs. right distinction.

  Crucial nuances: 
  - For (1), if rightness is strictly intention-constituted, it might block consequentialism but is likely indefensible in Buddhism given texts acknowledge consequences (e.g., lying causing distrust). 
  - (2) still allows expected-value reasoning, so doesn't help their friends. 
  - (3) is about karmic mechanics not morality - changes subject. 
  - (4) is basically hedonistic utilitarianism in disguise. 
  - (5) is meta-ethical and might reconcile intention-focus with consequentialist foundations.

  On the blameless/right question: only (1) makes bad-outcome acts positively right; others might excuse but not endorse. This matters because their friends seem to conflate blamelessness with permissibility.

