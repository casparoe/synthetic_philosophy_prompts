prompt: |-
  Hi — I'm in a very unofficial reading group (three of us, third-year philosophy, we meet in a pub back room) working through Buddhist ethics and specifically arguing about whether any of it is a form of consequentialism, and I keep getting shut down with the line 'it's the thought that counts'. It came up hardest last week over the sort of case we've been chewing on: someone intent on killing asks you where their intended victim is, and the Mahāyāna material we were going through seems to say the compassionate bodhisattva not only may but should break the truthfulness precept there. I said that reads like plain expected-consequence reasoning — weigh the lives saved against whatever harm the lie does — and two of them replied that Buddhism simply isn't consequentialist, because what's doing the karmic work is the intention (our group leader keeps repeating some line from the Pali tradition along the lines of intention being what action really is), so the outcome can't be what makes an act right. I'm pretty sure the slogan doesn't settle this on its own, but I can't get them to say what they actually mean by it, and I don't think 'intention matters' is even in dispute — plenty of non-consequentialists think that too.

  So could you lay out, as a list I can paste into the group chat, the different precise claims 'it's the thought that counts' could be making here — with one or two lines each on whether that reading is a platitude everyone already accepts, a substantive and defensible thesis, or just false? A few I want sorted in particular: (1) the strong one, that rightness is *constituted* by the motive and consequences are irrelevant even as a tie-breaker; (2) the 'epistemicised' one, where consequences are what matter but only as foreseen by the agent, so deliberation still looks like expected-value reasoning and only blame tracks what actually happened; (3) a causal or mechanistic one I half-invented — intention is simply the load-bearing node in the chain, because motives are what propagate into character and future action, so karma tracks intention for causal reasons and not because outcomes are morally inert; (4) an axiological one, where only conscious states (suffering and its easing) are intrinsically good or bad, which sounds like consequentialism again, just a subjective or experiential version of it; and (5) a two-level one I keep coming back to, where the criterion of rightness really is intention-based but the *point* of having such a criterion is thoroughly consequentialist, so the slogan tells you what the rule takes as input and says nothing about why anyone should care about it. Please don't give us reading recommendations or citations — we've got a pile of papers already and no library access from the pub.

  The bit I actually care about: for each reading, does it do the work my friends need it to do? I want to know which ones would genuinely rule out the consequentialist reading of the compassionate-transgression cases (i.e. would show the bodhisattva isn't just doing cost-benefit reasoning in a funny hat), which ones only change the subject, and which reading is probably what they actually meant. And if you can: is there any reading on which a clean motive with a bad outcome makes the act not merely blameless but positively right, versus one on which it's excused but still a failure? Also, apologies if any of this is muddled — I'm writing this on my phone and I'm definately not recieving the group chat notifications properly. Could you answer in British English, and keep it as a menu rather than picking a winner and explaining only that one?
