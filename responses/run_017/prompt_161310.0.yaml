answer: |-
  Right, let's cut through the slogans. Below is a menu of precise interpretations for "it's the thought that counts" in your Buddhist ethics debate, assessed for plausibility and whether they actually rule out consequentialism. Each entry includes: (a) the claim, (b) status (platitude/defensible/false), (c) whether it blocks the consequentialist reading of the bodhisattva case, and (d) whether a good motive + bad outcome makes the act *right* or merely *blameless*.

  ### The Interpretations
  1.  **Strong Motive-Constitutivism**  
      *Claim*: The moral rightness/wrongness of an act is *solely constituted* by the agent's intention. Consequences (intended or actual) are irrelevant to rightness, even as tie-breakers.  
      *Status*: **Substantive but likely false in Buddhism**. While intention (*cetanā*) is karmically central, canonical texts (e.g., *Aṅguttara Nikāya*) often link wrong acts to harmful outcomes (lying → distrust, killing → suffering). Ignores the bodhisattva's *compassionate goal*.  
      *Blocks consequentialism?* **Yes** – makes outcomes irrelevant.  
      *Good motive + bad outcome*: Act is still **right** (if motive was pure).  

  2.  **Epistemic Intentionism (Expected Consequences)**  
      *Claim*: Consequences *do* matter morally, but only *as foreseen (or reasonably foreseeable) by the agent* during deliberation. Blame/praise tracks intention because it reflects the agent's best assessment of expected outcomes. Deliberation *is* consequentialist.  
      *Status*: **Defensible hybrid**. Fits the emphasis on volition (*cetanā*) as karma, whilst accommodating deliberation about outcomes. Aligns with texts urging careful consideration of consequences (e.g., *Upāyakauśalya Sūtra*).  
      *Blocks consequentialism?* **No** – it *is* a form of expected-consequence reasoning. Bodhisattva lying is straightforwardly justified by expected harm/benefit.  
      *Good motive + bad outcome*: Act is **blameless** (if unforeseeable) but **not necessarily right** – it might still objectively fail.  

  3.  **Causal/Karmic Mechanism**  
      *Claim*: Intention is the primary *causal node* generating karma because it shapes character (*saṃskāra*) and future actions/experiences. Karma tracks intention not because outcomes are morally inert, but because intention is the *efficient cause* of karmic fruit. Outcomes matter, but are downstream effects.  
      *Status*: **Defensible (and likely core)**. Explains *how* karma works mechanistically, focusing on the volitional seed. Doesn't deny outcomes have moral significance; they're just not the primary *karmic trigger*.  
      *Blocks consequentialism?* **No** – changes the subject. Explains *why* karma tracks intention, not whether consequences *justify* the act. Bodhisattva could still be doing consequence-based reasoning; intention is just the karmic hook.  
      *Good motive + bad outcome*: Act generates **good karma** for the agent (due to motive) but the outcome is still **bad/harmful**. Act itself is likely **wrong** objectively, but agent is less (or not) karmically burdened.  

  4.  **Experiential Axiology (Conscious-State Consequentialism)**  
      *Claim*: Only conscious experiences (suffering, happiness, liberation) have *intrinsic* moral value. "Thought" (intention) matters primarily because harmful intentions *are themselves* a form of suffering/defilement (*kilesa*), and good intentions are wholesome states. Outcomes matter only insofar as they affect conscious experiences.  
      *Status*: **Defensible, but IS consequentialism**. Reduces to a form of mental-state utilitarianism/hedonism. Fits the First Noble Truth's focus on *dukkha* but arguably neglects non-experiential aspects of karma and conditionality.  
      *Blocks consequentialism?* **No** – it *is* consequentialism (just mental-state focused). Bodhisattva lying is justified by preventing suffering (in victim) and avoiding harmful intention (in themselves by enabling murder).  
      *Good motive + bad outcome*: Act is **right** if net conscious suffering is reduced *or* if the agent's wholesome state outweighs the outcome. Unclear/Branch-dependent.  

  5.  **Rule-Intentionism (Two-Level Theory)**  
      *Claim*: The *criterion* of right action is intention-based ("follow the precepts with pure mind"). However, the underlying *justification* for having this intention-based rule *is* consequentialist – cultivating pure intentions leads to better long-term outcomes (reduced suffering, enlightenment for self/others).  
      *Status*: **Highly defensible**, especially for precept-based ethics. Explains why breaking precepts *can* be compassionate (higher-order consequence) whilst maintaining rules as primary guides. Fits Mahāyāna's skillful means (*upāya*).  
      *Blocks consequentialism?* **Not at the fundamental level**. Explains *why* intention is the criterion – because it's consequentially best. Bodhisattva lying *is* justified by consequences, just indirectly via rule-consequentialist reasoning.  
      *Good motive + bad outcome*: Act **violates the rule** (so not "right" by the rule) but may be **blameless/justified** if the rule's *point* (better outcomes) was served by the intention.  

  ### Which One Does the Work Your Friends Need?
  *   **Genuinely blocks consequentialism:** Only **#1 (Strong Motive-Constitutivism)**. But this is hard to defend textually for the bodhisattva case – the justification *invokes* the consequence (saving a life). If they cling to this, press them on *why* compassion justifies lying if not for the consequence.
  *   **Changes the subject / Doesn't block:** **#3 (Causal Mechanism)**. It explains *karmic mechanics*, not *moral justification*. Doesn't touch whether the bodhisattva's decision is consequentialist.
  *   **IS consequentialism / Doesn't block:** **#2 (Epistemic)**, **#4 (Experiential Axiology)**, and **#5 (Rule-Intentionism)**. These either explicitly involve consequence-based reasoning (#2, #4) or ground the intention-focus in consequences (#5).
  *   **What they probably mean:** Likely a **muddled blend of #1 and #3**. They hear "intention is karma" (#3 mechanism) and leap to "therefore consequences don't matter for rightness" (#1) without justifying that leap. The Pali quote ("Intention... I declare, is action") supports #3, not #1.

  ### Blameless vs. Right
  *   **Positively Right:** Only **#1** and possibly **#4** (if net mental states improve). Implies a good intention *sanctifies* the act regardless of outcome.
  *   **Excused/Blameless but not Right:** **#2**, **#3**, and **#5** imply the act could still be objectively wrong or a rule violation, but the agent isn't (fully) culpable due to good intent. This fits better with Buddhist discussions of mitigating factors vs. inherent wrongness of certain acts.

  **How to use this:** Paste the list. Ask your mates which interpretation *they* are using for "the thought counts" in the bodhisattva case. If they pick #1, challenge them to square it with the *stated reason* for lying (saving a life – a consequence). If they pick #3, ask how that stops the act *being justified* by consequences. If they can't pick one, they're just waving a slogan about. Good luck in the back room – mind the sticky tables.
