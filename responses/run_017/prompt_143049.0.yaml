answer: |-
  ## MEMORANDUM

  **To:** Community Safety and Licensing Committee  
  **From:** [Your Name], Policy Analyst  
  **Date:** October 26, 2023  
  **Subject:** Recommended Approach for Adult-Services Licensing Bylaw & Provincial Coordination  

  ---

  ### 1. RECOMMENDATION & BOTTOM LINE

  **Recommendation:** Adopt a municipal approach focused on **harm reduction and occupational safety through conditional licensing and zoning**, while requesting the Province **only to regulate third-party online platforms** under criminal law. Specifically:

  *   **Municipal Action:** Implement a licensing regime for *premises* (not individuals) offering adult services, focused on basic health, safety, and location suitability (zoning). **Explicitly exclude mandatory individual registration.**
  *   **Provincial Request:** Ask the Attorney General and Police Service to prioritize enforcement against exploitative *third-party online platforms and advertisers* facilitating coercion, trafficking, or underage involvement.
  *   **Core Principles:** Treat sellers as competent workers entitled to safety; treat buyers as consenting adults; focus municipal intervention on mitigating concrete neighborhood impacts and enabling safer working conditions.

  **Primary Reasoning:** This approach addresses the immediate safety concerns raised by the worker collective (panic buttons, client lists, intoxication rules) without creating a dangerous municipal registry. It respects the agency expressed by sellers while acknowledging police concerns about street-level impacts by allowing dispersed premises within zoning. It avoids the city overstepping into criminal law creation or moral regulation. Provincial action against platforms targets a leverage point potentially linked to harm without criminalizing buyers or sellers directly.

  **Strongest Consideration Against:** This recommendation does *not* explicitly aim to reduce the overall incidence of sex work, which is the core objective of the Nordic model supporters. If the fundamental harm perceived by some committee members is the existence of the trade itself, this regulatory approach implicitly accepts its continuation and focuses solely on managing its conditions, which they may find unacceptable. It also relies on the assumption that dispersed, licensed premises effectively reduce visible street-based activity without displacing it into more hidden, potentially riskier environments – an assumption that could be challenged.

  ---

  ### 2. UNBUNDLING THE DECISION: MUNICIPAL VS. PROVINCIAL ROLES

  The following table disaggregates the components, specifying the recommended tool and justification:

  | Aspect                | Recommended Tool                                                                 | Justification                                                                                                                                                                                                                                                               |
  | :-------------------- | :------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Sellers (Individuals)** | **Municipal Inaction** (No licensing/registration of individuals)              | *   **Rationale:** Respects agency and safety concerns raised by workers (e.g., outing, immigration, future employment). Mandatory municipal registration creates significant risks without clear evidence it enhances safety more than premises licensing. Treats sellers as competent individuals managing their own work. *   **Adjacent Cases:** Consistent with not individually licensing actors in adult films (regulated as workplaces/businesses) or freelance paid care work (regulated by professional bodies/contract law). Distinction from licensed professions (e.g., massage therapy) is based on the specific, state-defined scope of practice requiring certification, not inherent to intimate services. |
  | **Sellers (Premises)**   | **Municipal Licensing & Zoning** (Conditions for operation, location-based rules) | *   **Rationale:** Addresses legitimate municipal interests in health/safety (panic buttons, client lists, intoxication rules), neighborhood compatibility (zoning away from schools/residential-only areas), and verifying business legitimacy (ownership, structure). Enables the collective's model. *   **Conditions Focus:** Basic physical safety, sanitation, business transparency, compliance with zoning. *   **Adjacent Cases:** Parallels licensing strip clubs or film production studios for location/safety compliance. Similar to zoning requirements for home-based businesses generally. |
  | **Buyers**            | **Municipal Inaction** AND **No Provincial Request**                           | *   **Rationale:** Criminalizing purchase contradicts treating sellers as competent agents. Sellers' testimony (like the collective's) indicates they engage with buyers consensually as part of their work. Provincial request would undermine this principle and create the "asymmetry problem" (see Section 3). Focus on buyer behavior (intoxication) is better handled via premises licensing conditions for sellers to enforce. *   **Adjacent Cases:** We don't criminalize clients of legal surrogacy agencies, strip clubs, or adult film producers. |
  | **Third Parties/Platforms/Landlords** | **REQUEST to Province:** Criminal enforcement against *exploitative* online platforms/advertisers. **Municipal Licensing** for landlords of licensed premises (standard tenancy/bylaw enforcement). | *   **Rationale (Province):** Platforms can facilitate scale, anonymity, and potential for coercion/trafficking in ways individual premises or street-based work may not. Provincial criminal law is the appropriate tool. Focus request narrowly on platforms *facilitating exploitation*. Avoids criminalizing benign third parties or the collective's shared reception model. *   **Rationale (Municipal):** Landlords are already subject to tenancy and business licensing laws; no need for specific new adult-service rules beyond enforcing lease compliance related to licensed premises operations. *   **Adjacent Cases:** Province regulates online platforms for illegal goods/services generally. Landlords aren't specially licensed for other legal-but-regulated businesses (e.g., bars, clinics). |
  | **Advertising**       | **Municipal Inaction** AND **Covered under Provincial Platform Request**        | *   **Rationale:** Blanket criminalization of advertising is overbroad and harms worker safety by pushing the trade underground. Provincial request focuses platform enforcement on exploitative *conduct* associated with ads, not the ads themselves. Municipalities lack authority over most advertising mediums. *   **Adjacent Cases:** Advertising is permitted for strip clubs, surrogacy services, and care work. |

  ---

  ### 3. WORKING THROUGH KEY ISSUES

  *   **The Asymmetry (Buyers vs. Sellers):** The rationale for penalizing buyers while shielding sellers hinges on viewing all sellers as victims lacking agency or inherently harmed by the transaction, requiring protection *from* buyers. **This directly conflicts with the testimony of the worker collective and many independent sex workers who assert their agency and describe consensual transactions.** If we accept the sellers' competence and agency (as their submission and request for safer working conditions implies), penalizing their consenting clients becomes logically inconsistent and paternalistic. Our recommendation rejects this inherent victimhood model, treating sellers as workers managing client relationships, hence no basis for criminalizing buyers. *If the assumption that a significant majority of sellers are acting with full agency and free from coercion is false*, the justification for not criminalizing buyers weakens considerably, potentially necessitating a shift towards a Nordic approach despite its contradictions with seller testimony.
  *   **The Purpose of the Bylaw:** **The primary municipal purpose of this bylaw should be to govern the conditions under which adult services are offered to mitigate localized harms (nuisance, exploitation risk, unsafe premises) and enhance worker safety, NOT to reduce the overall incidence of the practice.** This is because:
      *   The incidence of consensual adult sex work is not inherently a municipal harm; the concrete harms are unsafe conditions, exploitation, and neighborhood disruption.
      *   Municipal tools (licensing, zoning) are poorly suited to effectively reduce incidence without driving the trade underground and increasing risks.
      *   Focusing on conditions aligns with respecting the agency expressed by workers like the collective and allows them to implement safety measures.
      *   Reducing exploitation (a harm) is distinct from reducing incidence (an activity). The committee split reflects this fundamental difference. A bylaw designed to reduce incidence would look radically different (e.g., restrictive zoning making operation nearly impossible, supporting Nordic criminalization of buyers).

  ---

  ### 4. CONSISTENCY CHECK WITH ADJACENT CASES

  Applying the core rationale (regulating conditions for safety/compatibility, respecting agency of consenting adults, targeting exploitation not the service itself) to adjacent cases:

  1.  **Paid Surrogacy:** **Permitted/Regulated.** Similar rationale: Focus on ensuring safe, ethical conditions (medical care, legal contracts, fair compensation), respecting the agency of the surrogate. Criminalization of intended parents (buyers) would be inconsistent. Municipal role is minimal; primarily provincial/federal regulation.
  2.  **Licensed Strip-Club Work:** **Permitted/Regulated.** Directly analogous. Municipal licensing focuses on premises safety, location (zoning), liquor licensing, and preventing exploitation (e.g., independent contractor status issues). No individual registration. Criminalizing patrons is not considered.
  3.  **Adult Film Production:** **Permitted/Regulated.** Focus on workplace safety (e.g., STI testing protocols, condom use mandates in some jurisdictions), contractual fairness, and age verification. Treated as a business/workplace. Criminalizing performers or viewers is inconsistent with the rationale.
  4.  **Paid Care Work Involving Intimate Touching (e.g., certain disability/palliative care):** **Permitted/Regulated.** **Requires Distinction.** The *service* (intimate care) is fundamentally different in nature and necessity from commercial sexual services. Regulation focuses on professional qualifications (mandatory licensing), scope of practice, and preventing abuse. The rationale for professional licensing here (demonstrated competency for essential, non-substitutable services involving vulnerability) does not translate to commercial sex work, justifying the distinction in regulatory approach (premises vs. individual licensing). Criminalizing clients (care recipients) would be absurd and harmful.

  **Acceptability:** This consistency check demonstrates that the recommended rationale for adult services – regulating conditions for safety/compatibility while respecting consenting adult agency – aligns with how society regulates other complex, intimate, or stigmatized but legal services. The distinction for professionally licensed intimate care is justified by the different nature of the service and the requirement for certified competency.

  ---

  ### 5. SUNSET AND REVIEW CLAUSE

  Given fundamental disagreements on defining success, the bylaw should include a mandatory review after **three (3) years**, triggered automatically, using the following metrics designed to be relevant (though not necessarily decisive) to all three committee perspectives:

  *   **Metrics:**
      1.  **Worker Safety:** # of reports from licensed premises of assaults/robberies (against workers/clients); # of panic button activations & outcomes; uptake/utilization of safety features by licensees. *(Relevant to Decrim & Legalization models)*.
      2.  **Visibility/Neighborhood Impact:** # of validated complaints related to street-based sex work in residential areas; # of complaints related to noise/traffic/nuisance at licensed premises. *(Relevant to Nordic & Legalization models, Police priority)*.
      3.  **Structure of the Trade:** # of active municipal adult service licenses; estimated # of individuals working from licensed premises (based on licensee reporting, anonymized); qualitative assessment (e.g., via confidential outreach) of the prevalence of independent vs. third-party controlled work. *(Relevant to all models - context for interpreting other metrics)*.
      4.  **Exploitation Indicators:** # of cases referred to provincial authorities regarding suspected trafficking or coercion identified via municipal licensing inspections or complaints. *(Relevant to Nordic & Legalization models)*.
  *   **Interpreting Metrics:**
      *   A *decline in the number of people selling sex* could be viewed as **success** (Nordic), **irrelevant or potentially negative** if driven underground (Decrim), or **neutral** (Legalization), depending on *why* and under *what conditions* it occurred. Hence, it is not a primary metric. The focus is on *how* and *where* the work happens, and its safety.
      *   Success for this review should be assessed based on whether the municipal objectives (safer working conditions, reduced neighborhood nuisance, no increase in exploitation linked to the model) are being met, *not* on reducing overall prevalence.
  *   **Review Trigger:** Automatic review 3 years after bylaw enactment. Review conducted by staff, informed by the above metrics and confidential consultations with sex workers, community stakeholders, police, and health services. Review report to recommend continuation, amendment, or repeal.

  ---

  ### 6. DRAFT MOTION FOR COUNCIL

  **MOVED BY:** [Committee Chair Name]
  **THAT:** The Community Safety and Licensing Committee recommends that Council:

  1.  **Adopt** the Adult-Service Premises Licensing Bylaw No. [X], [Year], substantially as presented in Attachment A, creating a licensing regime for premises offering adult services, focused on health and safety standards (including requirements for distress systems, client refusal protocols, and intoxication policies), location suitability through zoning (permitting operation in [Specify Zones, e.g., Commercial, Light Industrial], excluding [Specify Exclusion Zones, e.g., within X meters of schools, parks, residential-only zones]), and business legitimacy verification, **explicitly excluding any requirement for municipal registration of individual service providers.**
  2.  **Request** the Provincial Attorney General and the [Province] Police Service to prioritize investigation and enforcement under the Criminal Code against online platforms and advertisers that knowingly facilitate coercion, trafficking, exploitation of minors, or other criminal acts within the adult services sector.
  3.  **Direct** the City Solicitor and relevant staff to finalize the bylaw text incorporating a mandatory review clause requiring a report back to Council within three (3) years of enactment, assessing the bylaw's impact based on metrics including worker safety reports, neighborhood nuisance complaints, structure of the licensed trade, and exploitation indicators.
  4.  **Direct** staff to develop and implement an ongoing outreach program to engage sex workers and relevant health/safety organizations in monitoring the implementation and effectiveness of the licensing regime and safety features.

  ---

  **Attachments:**  
  *   A: Draft Adult-Service Premises Licensing Bylaw  
  *   B: Summary of Consultation Feedback (Including Worker Collective Submission)  
  *   C: Legal Advice on Municipal Authority
