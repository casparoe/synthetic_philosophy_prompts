prompt: |-
  Putting together the reading list for my grad seminar on comparative development — the why-are-some-countries-rich one, you know the genre — and before I assign another three hundred pages of it I want the spec rather than the theories. What would an explanation of cross-national income differences actually have to get right to be worth anything? Write me the desiderata list.

  Purpose, so you can argue about which demands are real: I want a theory good enough that (a) I'd let a student spend five years testing it and (b) I'd be willing to tell someone allocating aid money 'this is our best guess, and here's how much to trust it.' If some requirement comes out of one of those purposes and not the other, say so.

  Cases I want attached to each requirement, and I'd rather have argument than inventory:

  - The separation cases. Most of what we correlate with prosperity travels in a bundle, so I want a requirement that a theory say what it predicts where the bundle comes apart: a place with extractive-looking politics and a resource windfall, a place with decent formal institutions and terrible geography, a place that got rich fast while keeping institutions the institutions-camp would call bad. Give the case behind the requirement, not a list of countries.
  - Onset, persistence, and catch-up. Sustained growth starting somewhere, gaps that just sit there for a century, and then episodes of rapid convergence and of growth that collapses. I think these are three different explananda and that a lot of the literature quietly swaps between them; write that in as a requirement to declare which one is being explained, and tell me if you think it's a fake distinction.
  - Level versus growth rate. Something can explain why a place is rich without explaining why it keeps getting richer. Is respecting that a genuine desideratum or pedantry?
  - Within-border variation. Same formal institutions, same national culture, big and stable income gaps between regions. Whatever the theory is, does it have the resources to handle that, or does it just get to change the unit of analysis? I want your view on whether this is a requirement or a cheap shot.
  - Exogeneity. The cause can't just be income wearing a hat. But I suspect the truly exogenous candidates are the ones that can't explain much, and the ones that explain a lot are partly effects. If that's a real trade-off, make it explicit as a pair of desiderata that pull against each other and say which one you'd drop.
  - The 'five-year minister' test: its favoured causes mostly move over generations, while the people who'd act on it have an electoral term. Is being usable at the timescale policy actually runs on a requirement, or a category error imported from the policy world? This is the one I'm least sure about.
  - Risky prediction. It should be able to state something it would get wrong. Half the literature explains every outcome after the fact; say how you'd write that into the spec without it becoming a demand for a randomised experiment.

  Then flag any pair you think can't be jointly satisfied — that part is the real result, not the checklist. No citations and no reading list, I know the literature; I want the criteria and the reasoning behind them. Finish in three or four lines on which single requirement does the most damage to the institutions / geography / culture families respectively. Don't be polite about it.
reasoning: |-
  Okay, let me tackle this query. The user wants a set of desiderata for a theory explaining cross-national income differences. First, I need to understand their key concerns: they want a theory robust enough for academic testing and policy application. The user mentions specific cases like separation cases where typical factors don't bundle together, which suggests the theory must handle outliers.

  Looking at the cases they provided, the separation cases require explaining instances where institutions, geography, or culture don't align with expected outcomes. For example, a resource-rich country with extractive institutions challenges theories that link institutions directly to wealth. Then there's onset vs. persistence vs. catch-up—these might need different mechanisms. The user suspects theories conflate them, so the desideratum should clarify which is being explained.

  Level vs. growth rate is another point. A place can be rich without growing, or growing from a low base. The theory must specify which it addresses. Within-border variation is tricky; if regions in the same country have different incomes, the theory can't just blame national institutions. But is this fair? Maybe it's a valid test if the theory can explain subnational factors.

  Exogeneity is a common issue. Causes like institutions might be endogenous. The trade-off here is explanatory power vs. true exogeneity. The user wants this tension made explicit. The 'five-year minister' test asks if the theory's levers work within political cycles. If causes are slow-moving, maybe policy relevance is limited, but that might be unavoidable.

  Risky prediction demands falsifiability. Theories should specify what would contradict them, not just fit past data. The user mentions randomized experiments aren't feasible, so alternatives like natural experiments or clear counterfactuals are needed.

  Now, conflicting desiderata. For example, exogeneity and within-border variation might clash. Finding an exogenous factor that explains local differences is hard. Also, policy timescales vs. historical persistence—policy actions need short-term effects, but causes are long-term.

  For the institutions camp, within-border variation is problematic. If institutions are national, why do regions differ? Geography theories struggle with persistence—why do some geographically disadvantaged places succeed? Culture theories face the separation cases, like countries changing economically without cultural shifts.

  The user's deeper needs: they're frustrated with theories that are either too vague or not actionable. They want clarity on what makes a theory valid and useful for both research and policy. Highlighting trade-offs shows where compromises are necessary, which is crucial for evaluating existing theories.
answer: |-
  Here’s your desiderata list, built for academic rigor and policy relevance, with conflicts flagged:

  ---

  ### **Core Desiderata for a Theory of Cross-National Income Differences**
  1. **Separation Case Resolution**  
     *Requirement:* Must predict outcomes when core correlates (institutions, geography, culture) decouple.  
     *Cases:* Resource-rich autocracies (e.g., oil states with "extractive" politics but high income); well-institutionalized nations with geographic disasters (e.g., post-earthquake Chile); rapid growth under "bad" institutions (e.g., China post-1980).  
     *Purpose:* Both (a) and (b). A theory that fails here is epiphenomenal.  

  2. **Temporal Specificity**  
     *Requirement:* Explicitly state whether it explains **onset** (e.g., UK Industrial Revolution), **persistence** (e.g., Sub-Saharan Africa’s 20th-century stagnation), or **catch-up/collapse** (e.g., South Korea vs. Argentina).  
     *Argument:* Not pedantry. Onset requires triggers; persistence requires self-reinforcement; catch-up requires conditional convergence mechanisms. Conflating them invites overfit.  

  3. **Level vs. Growth Distinction**  
     *Requirement:* Clarify if explaining **wealth stocks** (e.g., Qatari GDP/capita) or **sustained growth** (e.g., post-war Japan).  
     *Verdict:* Genuine. Geography might explain level (arable land); institutions explain growth (property rights). Theories claiming both must show how they interact.  

  4. **Within-Border Coherence**  
     *Requirement:* Explain subnational divergence (e.g., North vs. South Italy, coastal vs. inland China) without ad hoc unit-shifting.  
     *View:* Requirement, not cheap shot. If institutions/culture are national, why regional gaps? Forces theories to model local contingencies (e.g., infrastructure, local elites).  

  5. **Exogeneity-Explanatory Power Trade-off**  
     *Pair:*  
     - *Exogeneity Priority:* Causes must predate effects (e.g., colonial mortality → institutions).  
     - *Explanatory Power Priority:* Captures key mechanisms (e.g., institutional feedback loops).  
     *Conflict:* Strong exogeneity often limits scope (e.g., latitude explains little alone). For policy (b), drop pure exogeneity; for academia (a), demand it.  

  6. **Policy-Timescale Applicability**  
     *Requirement:* Specify mechanisms that could *plausibly* be influenced within 5–10 years (e.g., education investment, trade policy), even if full effects take longer.  
     *Verdict:* Category error to demand electoral-cycle results, but useless if *all* levers are century-scale (e.g., "change national culture").  

  7. **Risky Predictions**  
     *Requirement:* Generate at least one non-tautological, *ex-ante* falsifiable claim (e.g., "Nations with X trait will *not* grow >3% for 20 years" or "Y reform fails if Z is absent").  
     *Implementation:* Natural experiments (e.g., partition cases like Korea), or clear counterfactuals (e.g., "Without event P, country Q would look like R").  

  ---

  ### **Inherent Conflicts**  
  - **Exogeneity vs. Explanatory Power:** Deep causes (geography, deep culture) are exogenous but weak; strong explanations (institutions, policy) are endogenous.  
  - **Within-Border Variation vs. National Theories:** National institutionalists struggle with subnational divergence; culturalists struggle with rapid local changes.  
  - **Policy Timescale vs. Persistence:** Slow-moving causes (culture, institutional path dependence) defy quick fixes; fast levers (aid, reforms) rarely explain long-term trends.  

  ---

  ### **The Single Most Damaging Requirement for Each Camp**  
  - **Institutions:** **Within-border variation**. If institutions are destiny, why do Mezzogiorno and Bavaria stay poor in rich Italy/Germany?  
  - **Geography:** **Persistence**. Why do geographically cursed places (Singapore, Switzerland) get rich, or blessed ones (Congo) stay poor?  
  - **Culture:** **Separation cases**. Why do "fatalistic" cultures (e.g., South Korea 1950s) industrialize rapidly, or "individualist" ones (e.g., resource-cursed states) stagnate?  

  **Final Cut**: A theory worth its salt must resolve separation cases *and* offer risky predictions. Fail either, and it’s just a storytelling framework.
