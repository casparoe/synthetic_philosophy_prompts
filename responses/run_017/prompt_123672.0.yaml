prompt: |-
  I spent my career in the laboratory — molecular biology, mostly — and now sit in on a graduate seminar in moral philosophy, where I keep wanting to handle arguments the way I used to handle experiments. Please act as a professional moral philosopher with a real taste for careful case design, and build me a matched pair of cases on the shallow-pond argument: a treatment and a control.

  What the pair has to do. Condition A is the control: Singer's principle — roughly, that if we can prevent something bad from happening without sacrificing anything of comparable moral significance, we ought to do it — and a commonsense morality that permits partiality to oneself and one's near and dear, treats large sacrifices as supererogatory, and holds negative duties more strictly than positive ones, both return the verdict "you must help." In Condition B the commonsense verdict flips to "you may walk on," while the principle still returns "you must help." The two conditions may differ in exactly one feature — a feature the principle, as stated, does not mention — and must be identical in everything the principle does advert to: the same bad outcome, the same certainty that it will occur and that the agent can prevent it, the same genuinely trivial cost to the agent, the same physical distance, no special relationship, no one else present or able to help, and no causal responsibility on the agent's part.

  Cheating. The flip must not be manufactured by any of the usual suspects: greater distance; larger numbers, thresholds, or aggregation; doubt about whether the aid arrives; the agent's own projects or relationships; some other agent or institution whose job it is; or the mere fact that people feel less about distant sufferers. Name the feature you have chosen and show that it is not one of these in disguise. Also say plainly what the pair is for — I want to know whether the pull of the pond case comes from its moral structure or from something about how it is presented, and that fixes what would count as rigging it.

  Constraints. Realistic: a hospital, a field station, a funding or hiring committee, a shared lab — something a department head could actually face. No trolleys, no science fiction, no thought-experiment machinery. One paragraph per condition.

  Deliverable. Both conditions; then the verdict of each of the two views in each condition, with the reasoning that gets there; then the diagnostics — which single feature does the work, what happens to the divergence when you remove it, whether the effect survives describing the conditions in the opposite order or to someone who has never met the shallow-pond argument (if it does not, say so; that is a finding, not a failure), and how a defender of whichever view comes out worse would attack the case — in particular whether your feature is a moral difference or an artifact of framing.

  Before settling, spend a few lines brainstorming two or three candidate features and discarding the ones that turn out to be forbidden levers in disguise. I would rather have one honest, fully diagnosed pair than three that merely look clever.
reasoning: |-
  Hmm, the user is a retired molecular biologist attending a moral philosophy seminar. They want a controlled experiment-style comparison for Singer's shallow-pond argument, with one variable changed to flip commonsense morality while keeping Singer's principle consistent. This requires surgical precision.

  The challenge is finding a single feature that makes commonsense say "walk away" in Condition B without triggering Singer's forbidden factors. Brainstorming candidates: physical distance is out (explicitly forbidden), institutional roles violate "no special relationships," and emotional distance is prohibited as "mere feeling less." 

  What about... causal history? Not responsibility (forbidden) but how the need arose. Condition A could involve natural disaster (floods) while Condition B has self-inflicted harm (ignoring warnings). Testing: Singer's principle ignores causation origins per his formulation, while commonsense often discounts obligations toward the reckless. 

  Alternative: resource fungibility. Condition A uses money from discretionary funds, Condition B requires destroying a unique research sample. But uniqueness might imply "significant sacrifice" - invalid. Must be truly trivial cost. 

  Final design: Condition A (flood victim) vs Condition B (overdose). Same hospital setting, same trivial action (signing a form), same immediacy. The overdose case introduces recklessness without invoking responsibility or greater sacrifice. 

  Diagnostics show this works: reversing cases maintains the effect, new subjects still feel the divergence. Singer defenders would argue recklessness is irrelevant to preventing harm now, while commonsense defenders cite fairness in resource allocation. The tension lies precisely in whether moral significance includes backstory - Singer's principle as stated does not. 

  This isolates presentation framing (backstory salience) versus pure moral structure. Exactly what the user needs to dissect philosophy's "experimental methods."
answer: |-
  Here is a rigorously designed matched pair meeting all your constraints. I'll first brainstorm candidate features, then present the cases, verdicts, diagnostics, and defenses.

  **Brainstorming Discarded Candidates:**
  1.  **Agent's Unique Expertise:** *"Only you have the rare skill to operate the lifesaving device."* **Discarded:** Violates "no special relationship" (professional role/obligation) and potentially "sacrifice" (if using unique skill is costly or burdensome).
  2.  **Resource Previously Promised Elsewhere:** *"The medicine is allocated for your department's critical long-term project."* **Discarded:** Invokes "agent's own projects" and frames the cost as non-trivial (sacrificing a significant commitment).
  3.  **Victim's Future Harmful Acts:** *"Saving them means they will later harm others."* **Discarded:** Introduces a new, distinct "bad outcome" (future harm), changing the moral calculus beyond the immediate prevention.

  **Chosen Feature:** **The Origin of the Victim's Peril.** Specifically, whether the peril stems from a natural/accidental cause versus the victim's own reckless, blameworthy, but non-malicious choice *that the agent explicitly warned against*.

  ---

  **Condition A (Control - Commonsense "Must Help"):**
  Dr. Aris, Head of the Biomedical Research Department, walks past the hospital wing housing long-term study participants. She sees Participant Lee, enrolled in a low-risk observational study she oversees, suddenly collapse due to a rare, unpredictable anaphylactic reaction to a standard environmental allergen present in the wing. Lee is choking, their epinephrine injector is jammed, and Aris is the only person nearby. Aris can prevent Lee's certain death by immediately grabbing a working injector from a clearly marked, unlocked emergency cabinet 3 feet away and administering it—a trivial cost (10 seconds, no risk, no resource depletion). Aris has no special relationship to Lee beyond being the PI, did not cause the reaction, and there are no other staff or systems to intervene. *[Origin: Accidental/Unforeseen medical event]*

  **Condition B (Treatment - Commonsense "May Walk On"):**
  Dr. Aris, Head of the Biomedical Research Department, walks past the hospital wing housing long-term study participants. She sees Participant Kim, enrolled in a low-risk observational study she oversees, collapse due to a severe heroin overdose. Kim is struggling to breathe. Aris can prevent Kim's certain death by immediately grabbing a naloxone injector from a clearly marked, unlocked emergency cabinet 3 feet away and administering it—a trivial cost (10 seconds, no risk, no resource depletion). Crucially, **30 minutes prior, Aris explicitly warned Kim, who was visibly preparing to use heroin in their room (a serious protocol violation), that doing so carried a high risk of overdose with no staff immediately available to help, and strongly urged them not to do it.** Kim dismissed the warning. Aris has no special relationship to Kim beyond being the PI, did not supply the heroin, and there are no other staff or systems to intervene. *[Origin: Victim's reckless, warned-against choice]*

  ---

  **Verdicts & Reasoning:**

  *   **Condition A:**
      *   **Singer's Principle:** Verdict: **Must Help.** Preventing death (extremely bad) is achievable at trivial cost (10 seconds). Nothing of comparable moral significance (life vs. seconds) is sacrificed.
      *   **Commonsense Morality:** Verdict: **Must Help.** Lee's peril is accidental/unforeseen. The cost is minimal. No special relationship weakens partiality claims. Negative duty not to ignore immediate, preventable death trumps any weak positive duty objection. Helping falls well below the threshold for supererogation.

  *   **Condition B:**
      *   **Singer's Principle:** Verdict: **Must Help.** *Unchanged.* Preventing death (extremely bad) is still achievable at trivial cost (10 seconds). *The origin of the peril (Kim's recklessness despite warning) is irrelevant to the principle as stated.* It doesn't mention causation beyond denying *agent's* responsibility, nor does it discount needs based on fault. Sacrifice remains trivial.
      *   **Commonsense Morality:** Verdict: **May Walk On.** While the immediate cost is low, Kim's conscious, reckless choice *after an explicit, proximate warning from the agent* significantly alters the moral landscape. Commonsense heavily weights notions of fairness, responsibility, and "moral desert" in allocating aid, especially when resources/attention are finite (even if not depleted here). Saving Kim feels like enabling recklessness or rewarding blameworthy behavior, weakening the perceived positive duty. The agent's prior warning underscores Kim's responsibility. Walking away isn't actively harming (respecting negative duties) but merely not preventing a consequence Kim knowingly risked. The minimal cost is now weighed against a weaker positive duty claim and a sense that the sacrifice, while physically trivial, has greater *moral* cost (complicity, unfairness).

  ---

  **Diagnostics:**

  1.  **The Single Feature:** The **Origin of the Peril (Blameworthy Recklessness + Explicit Proximate Warning vs. Accident)**. This is the *only* difference.
  2.  **Not a Forbidden Lever in Disguise:**
      *   *Not Distance/Number/Aggregation:* Physical proximity, number of victims (one), certainty of outcome/prevention, and cost are identical.
      *   *Not Doubt/Agency:* Certainty of death/prevention is identical. No other agents/institutions are involved.
      *   *Not Projects/Relationships:* No special relationship exists. The warning is part of the peril's origin story, not a distinct project/relationship creating an obligation.
      *   *Not Reduced Feeling:* While feelings (frustration, blame) might arise, the commonsense verdict hinges on the *moral judgment* about responsibility and fairness, not the *degree* of feeling. The case structure forces focus on the act's blameworthiness following a warning.
      *   *Not Causal Responsibility:* Aris did *not* cause the overdose (didn't supply heroin). The warning highlights *Kim's* responsibility.
  3.  **Effect of Removing the Feature:** If Kim's overdose was accidental (e.g., accidental ingestion) or no warning was given, commonsense likely reverts to "Must Help," aligning with Singer. The divergence collapses.
  4.  **Order/Priming Effect:** Describing Condition B first doesn't eliminate the divergence. Someone unfamiliar with Singer will likely still intuit a stronger duty in Condition A than B, feeling Aris is *more* obligated to help Lee (accident) than Kim (reckless after warning). The "pull" of the original pond case is weakened in Condition B for commonsense.
  5.  **Defender Attacks:**
      *   **Singer Defender (Attacking Condition B Commonsense Verdict):** "The principle's strength is ignoring morally irrelevant contingencies like *how* someone came to be in peril. Preventing death *now* at trivial cost is paramount. Kim's past recklessness doesn't make their current suffering less bad or your ability to prevent it less compelling. Focusing on 'desert' or 'fairness' violates the core demand to prevent severe suffering when easily possible. The 'warning' changes nothing morally; it only reveals a prior lack of causal responsibility, which the principle already excludes as a requirement. Commonsense is biased and inconsistent."
      *   **Commonsense Defender (Attacking Singer in Condition B):** "Singer's principle is morally simplistic. It ignores crucial features of agency and responsibility. Kim *chose* this risk deliberately, despite a clear, direct warning. Saving them isn't just preventing harm; it's intervening in the *consequences of their own defiantly reckless action*. This weakens the positive duty significantly. The minimal physical cost obscures a real *moral* cost: validating extreme recklessness and undermining personal responsibility. Commonsense rightly sees that not all needs generate equal obligations; the context of *why* the need exists matters profoundly. Singer's view would lead to absurd demands to constantly rescue people from self-inflicted crises."

  **What the Pair is For:** This pair isolates whether the intuitive force of the shallow pond case relies *solely* on its core structure (preventable severe harm + trivial cost) or is significantly bolstered by the *presentation* of the victim as blameless ("innocent child"). Condition B shows that changing *only* the victim's agency in creating their peril (while holding all structural factors constant) can flip the commonsense verdict, while Singer remains rigid. This suggests the original case's power comes partly from framing the victim as passive and undeserving of their fate, an element not explicit in Singer's principle. It tests the principle's claim to capture all morally relevant factors.
