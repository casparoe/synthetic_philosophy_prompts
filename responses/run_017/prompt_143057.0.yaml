answer: |-
  Here’s a structured framework of adequacy conditions for a theory of realization, organized around your insights and extended with critical analysis. I’ll mark each requirement’s status (non-negotiable/camp-specific), identify the most exclusionary requirement, diagnose conflicts, test your suspicion, and provide scorecards.

  ---

  ### **Adequacy Conditions for a Theory of Realization**  
  *(Non-negotiable = **NN**; Camp-specific/negotiable = **CS**)*  

  1. **Three-Place Structure & Admissible Role Specifications (NN)**  
     - **Requirement**: Realization must be relativized to a *non-arbitrary* causal-role specification (e.g., "believes that *p*" = "tends to affirm *p* when queried, uses *p* in practical reasoning," etc.).  
     - **Rationale**: Solves the *cheap-realizability problem*: without constraints, any physical state satisfies infinitely many trivial role descriptions (e.g., "causes some effect"), making multiple realizability vacuously true and ruling out *all* psychophysical laws.  
     - **Case**: A lump of clay satisfies "desires water" under the role "occupies space," but this is irrelevant to mentality.  

  2. **Gradation Tolerance (CS)**  
     - **Requirement**: Must accommodate *degrees* of realization (e.g., 90% role-fit) and handle "near-misses" (e.g., post-stroke aphasia). Thresholds must be non-arbitrary (e.g., tied to functional success in an environment).  
     - **Rationale**: Systems evolve, degrade, or approximate ideal roles (e.g., neural networks with probabilistic outputs). Binary realization cannot capture this.  
     - **Case**: An octopus’s color-change "recognition" system may satisfy "fear" partially but not perfectly.  

  3. **Non-Circular Causal Specification (NN)**  
     - **Requirement**: The *causal respects* defining the role (e.g., "triggers avoidance behavior") must be specifiable without presupposing mental terms.  
     - **Rationale**: Avoids circularity in *defining* mental states via their realizers. If "pain" is defined as "whatever causes pain behavior," the account presumes what it explains.  
     - **Case**: To argue that silicon and neurons both realize "pain," we need role specs like "causes withdrawal from noxious stimuli" — not "causes *painful experiences*."  

  4. **Causal Potency without Overdetermination (NN)**  
     - **Requirement**: Realized properties must have *distinct causal powers* not identical to their physical realizers, while respecting physics' causal closure (no "extra" causes).  
     - **Rationale**: Mental properties must not be epiphenomenal. Yet if physics is causally closed, mental causation seems redundant.  
     - **Conflict Point**: This is where the list *breaks*: Satisfying both (i) mental causation and (ii) physical closure may be impossible.  

  5. **Goldilocks Constraint (NN)**  
     - **Requirement**: Must avoid *over-permissiveness* (every system realizes every state) and *over-restrictiveness* (only human brains realize mentality).  
     - **Rationale**: Balance needed for novel cases (e.g., AI, octopi). Over-permissiveness invites panpsychism; over-restrictiveness collapses to type-identity.  
     - **Case**: An ant colony should realize "collective foraging" but not "regret."  

  6. **Empirical Tractability (CS)**  
     - **Requirement**: Must provide criteria for testing realization in black-box systems (e.g., via input-output patterns, structural isomorphism, or counterfactual dependencies).  
     - **Rationale**: Needed to adjudicate disputes (e.g., "Does GPT-4 *understand*?").  

  ---

  ### **Conflicts & The Most Exclusionary Requirement**  
  - **Joint Unsatisfiability**: **Causal Potency (4)** conflicts with **Physical Causal Closure**. If physics is causally closed, mental properties either:  
    (a) Are identical to physical properties (rejecting multiple realizability),  
    (b) Are epiphenomenal, or  
    (c) Cause effects *already fully caused* by physical properties (overdetermination).  
    No extant theory cleanly resolves this.  
  - **Most Exclusionary Requirement**: **Non-Circular Causal Specification (3)**. It forces role specifications to be *purely functional/structural*, excluding theories that smuggle in mentalistic language (e.g., naïve functionalism).  

  ---

  ### **Your Suspicion: Equivocation Exposed**  
  Your suspicion is **correct**:  
  - **Token Multiple Realizability (TMR)**: One mental state-token (e.g., *my* pain) can be realized by distinct physical tokens (neurons, silicon).  
  - **Type Multiple Realizability (TyMR)**: No *lawlike* psychophysical type-correlations (e.g., pain ≠ C-fibers firing *in all possible systems*).  
  - **The Gap**: TMR (suggested by hardware/software) is weak: a *disjunctive* physical type (neurons *or* silicon) could still correlate with pain. **Type-identity theory can survive TMR** via disjunctive types. TyMR is needed to refute it.  
  - **Cost of Separation**: Distinguishing TMR/TyMR **weakens** the anti-type-identity argument. TyMR requires showing that *no* physical kind (even disjunctive) nomologically coextends with a mental kind—a much harder claim.  

  ---

  ### **Scorecard: Main Theories**  
  *(✓ = Satisfies; ✗ = Fails; ~ = Partially)*  

  | **Theory**               | **1 (Roles)** | **2 (Gradation)** | **3 (Non-Circular)** | **4 (Causal Potency)** | **5 (Goldilocks)** | **6 (Tractability)** |  
  |--------------------------|---------------|-------------------|----------------------|------------------------|--------------------|----------------------|  
  | **Type-Identity**        | ✗ (no roles)  | ✗                 | ✓ (trivially)        | ✓ (mental=physical)    | ✗ (over-restrictive)| ~ (via neuroscience) |  
  | **Flat Causal-Role**     | ~ (roles but arbitrary) | ✗               | ✗ (often circular)    | ✗ (epiphenomenal)      | ✗ (over-permissive)| ✓ (I/O tests)        |  
  | **Dimensioned Realization** | ✓         | ✓ (by design)     | ~ (context-dependent)| ✓✓ (adds new powers)   | ✓                 | ✗ (vague powers)     |  
  | **Subset Realization**   | ✓             | ~                 | ~                    | ✓ (powers are subsets) | ✓                 | ✗ (hard to measure)  |  
  | **Ramsey Functionalism** | ✓ (holistic)  | ✗ (binary)        | ✓ (quantified over theory) | ✗ (epiphenomenal)| ~ (can be permissive) | ✓ (theory-based)  |  

  **Notes**:  
  - **Dimensioned Realization** (e.g., Wilson, Gillett): Realizers *contribute* powers to the role. Best on causal potency but struggles with gradation thresholds.  
  - **Subset Realization** (Shoemaker): Physical properties *include* mental powers as subsets. Avoids overdetermination but may underdetermine novel cases.  
  - **Ramsey Functionalism**: Quantifies over a whole psychological theory ("the *pain*-role"). Solves circularity via theory-relative roles but risks epiphenomenalism and cheap realizability if theories are underspecified.  

  ---

  ### **Conclusion for Your Paper**  
  The central tension lies in **Causal Potency vs. Physical Closure (Condition 4)**, which exposes a likely **insurmountable conflict** in non-reductive physicalism. Meanwhile, **TyMR ≠ TMR**: the hardware/software analogy only supports TMR, leaving type-identity theories viable via disjunctive kinds. To refute type-identity, multiple realizability arguments must establish TyMR—which requires a theory of realization that satisfies **Non-Circular Specification (3)** and the **Goldilocks Constraint (5)**. No leading theory achieves this without trading one problem for another. This suggests **multiple realizability cannot simultaneously serve both your "jobs"** without compromising physicalism or mental causation.
