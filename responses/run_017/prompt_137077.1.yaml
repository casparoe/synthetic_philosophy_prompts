prompt: |-
  Hey, hoping you can help with something I have to actually hand to people next month.

  I sit on the board of a regional legal-aid nonprofit — about forty staff, we do evictions, benefits denials, a bit of family law, and we turn away something like six in ten of the people who qualify because there simply aren't enough hours in the week. We're voting in three weeks on whether to roll out a drafting tool from a vendor I'll call Briefwell: you feed it the intake notes and it produces a first-draft petition, demand letter, or discovery response. On the vendor's demo it's genuinely good, and the failure mode is the nasty one — text that reads perfectly and is subtly wrong about a deadline or a legal standard, the kind of thing you only catch if you already know the area. The staff are split in a way that maps oddly onto seniority: our newer attorneys and most of the intake team are strongly for it (their line is that the queue is the moral emergency, and that agonising about our own fulfillment while a client sleeps in her car is definately a form of self-indulgence), while the senior litigators and the paralegals' committee are strongly against it. The paralegals' objection isn't mostly about jobs — it's that drafting is where judgment gets formed, and that sitting in review of text you didn't write, with your name on the filing and the liability on you, is a thinner and different activity from writing it. Our main funder, a state access-to-justice commission, has also let us know unofficially that a decent slice of next year's grant depends on showing we've adopted this kind of technology, so doing nothing isn't costless either.

  What I want from you is a decision memo I can circulate to the board and then, unchanged, to staff — one document, not a board version and a staff version. It should take a position: approve, reject, or approve with conditions, and if it's the last one I want the conditions to be real and dated — which case types, what phase-in, who reviews it at the six- and twelve-month marks, what specifically triggers a rollback — rather than the sort of pilot-and-monitor language that means nobody ever decides anything. It also needs to say what we owe our own staff either way. If the tool comes in and the paralegal role quietly becomes person-who-checks-the-machine's-work, I'd rather we name that out loud and either redesign the role into something with actual judgment left in it or admit we're cutting it, instead of letting it happen by drift. And it should be honest about who is answerable for the errors, which our board has so far managed not to discuss at all.

  The part I'm stuck on, and the part I'd like the memo to reason about rather than gesture at, is whether the preservation of meaningful work is something a body like ours is even allowed to weigh. I've been arguing with a friend who says obviously not: we're a charity funded to serve clients, our duty to staff is to pay them properly and give them notice, and if we think meaningful work is getting scarce we should go fight that in tax and labour policy rather than making someone wait three weeks longer for her eviction answer. I keep half-agreeing and then not. The thing I can't get past is a distinction I made up and can't fully defend: there's the product (the brief gets filed either way), there's the craft (someone spent years learning to do the thing well), and then there's what I'd call the office — being the identifiable person who stands behind a document and can be asked why it says what it says. Automation can leave the first two more or less intact and still hollow out the third, and my hunch is that the hollowing is where the real harm lives, but I honestly can't tell whether that's an insight or just my own profession's preferences in a nicer coat. So give me the straight version: a recommendation with reasons a skeptical paralegal and a skeptical client could both respond to, the strongest case for whichever side you're not recommending, and your own verdict on whether the craft-and-office worry is status anxiety dressed up. Assume nobody reading has time for footnotes — no citations or reading suggestions, and keep it under about 1,200 words.
reasoning: |-
  Okay, let me unpack this complex request. The user sits on a legal-aid nonprofit board facing a critical decision about adopting Briefwell, an AI drafting tool. The core tension is between efficiency gains for overwhelmed staff and preserving the integrity of legal work. 

  Hmm... the user's stuck on whether "meaningful work" is a valid consideration for a charity. That's fascinating - they've framed it as product vs craft vs office, and I suspect that "office" concept is key. The paralegals' fear about liability for machine-generated documents feels central here. 

  Right, first I need to structure this as a decision memo per specifications: clear recommendation with phased conditions, accountability measures, and honest staff impact assessment. The state funding pressure makes rejecting the tool unrealistic, but a bare approval would ignore real risks. Conditional adoption seems necessary.

  Ah! The liability question is crucial - the board hasn't discussed who answers for AI errors. That needs explicit assignment: senior attorneys must take responsibility, not paralegals. And about those paralegal roles... if we're honest, some tasks will become verification-focused. But we could redesign roles to include higher-value work like client interviews or strategy research. 

  The philosophical bit about meaningful work... let me think. The friend's utilitarian argument has merit - clients sleeping in cars should outweigh staff preferences. But the "office" concept holds water too: when no human truly owns the work, accountability dissolves. Maybe the compromise is that while we can't preserve all meaningful work, we must preserve meaningful judgment. 

  For the memo tone: no academic citations, skeptical-client-friendly language. I'll spotlight the paralegals' valid concern about judgment formation, then counterbalance with the 60% rejection rate. The "hollowing out" fear isn't just status anxiety - it's about who blinks when the machine hallucinates a deadline. 

  Final structure: recommend conditional adoption with 1) limited case types first, 2) redesigned paralegal roles, 3) senior attorney liability ownership, and 4) hard rollback triggers. Acknowledge the craft/office concern as legitimate but not absolute. Staff deserve transparency: "This changes your work, here's how we'll compensate."
answer: |-
  ## Decision Memo: Adoption of Briefwell Drafting Tool  
  **To:** Board of Directors & All Staff  
  **From:** [Your Name/Board Committee]  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Conditional Approval of Briefwell AI Drafting Tool  

  **I. Recommendation**  
  Approve the adoption of the Briefwell drafting tool for **limited case types (benefits denials, uncontested evictions)** effective [Date], with mandatory conditions addressing risk mitigation, role redesign, accountability, and scheduled reassessment. Implementation will be phased, with a hard sunset clause if benchmarks are not met (detailed in Section IV).  

  **II. Core Conflict & Imperatives**  
  We balance two urgent moral claims:  
  1.  **Client Access:** Turning away 60% of qualified applicants is unsustainable. Delays cause tangible harm (evictions, benefit gaps). Technology can expand capacity.  
  2.  **Professional Integrity:** Law is a practice of judgment. Automating core drafting risks diluting expertise, shifting liability unfairly, and eroding the "office" – the human responsibility behind legal documents.  

  Our duty is not *either/or*, but *how*. We must serve more clients *without* sacrificing ethical practice or exploiting staff.  

  **III. The Case for Conditional Adoption**  
  *   **Addresses the Moral Emergency:** Briefwell demonstrably speeds initial drafting. Reallocating even 20% of drafting time could significantly reduce waitlists for our highest-volume, lower-risk cases (benefits, uncontested evits).  
  *   **Funding Reality:** State funding is contingent on adopting efficiency tools. Rejection jeopardizes resources needed to serve *anyone*.  
  *   **Mitigated Risk:** Limiting use to defined, lower-complexity case types (where legal standards are more stable) reduces risk of subtle errors. Senior staff oversight (mandated below) provides a safeguard.  
  *   **Staff Alignment:** Supports newer attorneys and intake staff overwhelmed by volume, freeing them for client interaction and strategic tasks.  

  **IV. Conditions for Approval (Non-Negotiable)**  
  This is not a "pilot." It is a controlled implementation with defined off-ramps:  

  1.  **Phased Rollout & Limited Scope (Effective [Date]):**  
      *   **Phase 1 (Months 1-3):** Briefwell use restricted to:  
          *   Initial demand letters for benefits denials (state/federal programs).  
          *   Petitions for uncontested eviction defenses.  
      *   **Phase 2 (Months 4-6, *contingent on Phase 1 success*):** Potential expansion to discovery responses in benefits/eviction cases ONLY.  
      *   **Explicit Prohibition:** Family law, complex eviction defenses, appeals, or any case involving novel legal issues.  

  2.  **Accountability & Liability:**  
      *   **Ultimate responsibility rests with the reviewing attorney.** Their bar number is on the filing. Briefwell output is raw material, not final product.  
      *   **Mandatory Human Review Protocol:** Every Briefwell draft must undergo substantive review by:  
          *   A **senior litigator** (5+ years relevant experience) for the first 3 months in each case type.  
          *   Thereafter, by an **attorney** (not solely a paralegal) meeting defined competency benchmarks for that practice area.  
      *   **Board Acknowledgment:** The Board formally accepts that the ultimate risk of error lies with the organization and its supervising attorneys, not individual paralegals or junior staff running the tool.  

  3.  **Staff Impact & Role Redesign (Implemented by [Date - 2 weeks post-approval]):**  
      *   **Transparency:** We acknowledge that for paralegals/junior attorneys, core drafting tasks in specified areas *will* shift toward review, verification, and editing.  
      *   **Redesign Commitment:** Management will work with the Paralegal Committee and Attorney Leads within 60 days to **formally redesign affected roles**, reallocating freed-up time to:  
          *   Enhanced client interviewing and counseling.  
          *   Deeper factual investigation and evidence gathering.  
          *   Strategic legal research on complex aspects of cases.  
          *   Increased court/liaison work.  
          *   Mentoring/supervision roles for junior staff.  
      *   **Training:** Mandatory Briefwell training (technical use *and* critical review techniques) for all users and reviewers before access is granted.  

  4.  **Structured Reassessment & Rollback Triggers:**  
      *   **Month 6 Review:** By [Date], the Litigation Director & Paralegal Lead will report to the Board on:  
          *   Time savings achieved vs. projected.  
          *   Error rates in Briefwell drafts vs. human drafts (tracked via review notes).  
          *   Staff feedback (structured survey + focus groups).  
          *   Impact on case outcomes (where measurable).  
      *   **Month 12 Review:** By [Date], a comprehensive external audit (funded separately) will assess efficiency, accuracy, staff morale impact, and role redesign success.  
      *   **Hard Rollback Triggers (Any of the following):**  
          *   **Accuracy:** >5% error rate in Briefwell drafts on material legal points (deadlines, standards) identified *post-review* in Phase 1 cases.  
          *   **Efficiency:** Failure to achieve a ≥15% reduction in average drafting time for target documents *without* increasing review burden proportionally.  
          *   **Staff Retention:** >10% voluntary turnover *directly attributed* to Briefwell implementation in affected roles within 12 months.  
          *   **Role Redesign Failure:** Failure to implement agreed-upon role enhancements by Month 9.  
      *   **Action:** If ANY trigger is met, the Board will vote on immediate discontinuation in the affected case type(s).  

  **V. The Case Against & Why We Don't Choose It**  
  The senior litigators and paralegals raise profound concerns:  
  *   **Judgment Formation:** Drafting is active learning; review is passive. Expertise atrophies if foundational tasks are automated.  
  *   **Hollowed "Office":** The tool separates the author's mind from the document. The person signing may not fully own the reasoning, undermining professional responsibility.  
  *   **Morale & Value:** Work perceived as merely "checking the machine" is demoralizing and fails to utilize human potential.  
  *   **Hidden Errors:** AI "hallucinations" in legal standards could cause catastrophic client harm if missed.  

  **This is a powerful argument grounded in professional ethics.** A pure rejection would honor craft and mitigate these risks. *However, rejecting the tool ignores the immediate, escalating crisis of unmet need.* We cannot justify preserving traditional workflows *as-is* while turning away the majority of qualified clients due to lack of capacity. Doing nothing also risks essential funding.  

  **VI. The Meaningful Work Question: Our Verdict**  
  **Yes, preserving meaningful work is something we are allowed – and obligated – to weigh, but not as an absolute veto against efficiency.**  

  *   **Not Just Status Anxiety:** The concern about the "hollowed office" is valid. Law requires accountable human agency. Replacing judgment with verification *does* change the nature of the work.  
  *   **But Not the Sole Priority:** Our primary charitable duty *is* to clients. We cannot prioritize staff fulfillment *over* preventing evictions. The friend is right: our core obligation to staff is fair compensation, safe conditions, and honest engagement – not preserving every task exactly as it is.  
  *   **The Balance:** We must **mitigate** the hollowness. This is why **role redesign is a non-negotiable condition**. We don't just automate tasks; we reinvest freed capacity into *higher-order, more meaningful human work* – deeper client engagement, complex strategy, mentorship. We protect the "office" by clarifying ultimate accountability (attorney review) and investing in staff development. Automation must augment human judgment, not replace its cultivation.  

  **VII. What We Owe Staff**  
  Regardless of this decision:  
  1.  **Honesty:** We acknowledge this changes work. We commit to transparency about the why and the how.  
  2.  **Voice:** Staff input is crucial in role redesign, training, and ongoing evaluation (via mandated reviews/focus groups).  
  3.  **Investment:** Freed time *must* translate into more valuable responsibilities, not just increased caseloads without growth. Management is accountable for this redesign.  
  4.  **Protection:** No one will be disciplined for errors originating in unreviewed Briefwell output. Liability protocols are clear.  
  5.  **Support:** Robust training and resources for both using the tool and performing enhanced review/higher-level tasks.  

  **VIII. Conclusion**  
  The crisis of access demands we embrace tools like Briefwell, but not uncritically. We approve its use **strictly under the conditions outlined**, designed to aggressively manage risk, protect professional integrity through human oversight, redesign roles to preserve and enhance meaningful work, and establish clear accountability and off-ramps. This is not an endpoint, but a responsible experiment with a defined scope and measurable outcomes.  

  We owe it to our clients to try and serve more of them. We owe it to our staff to ensure this tool empowers them to do deeper, more impactful work, not merely become its minder. The conditions above are our commitment to meeting both obligations.  

  **Motion:** Approve the adoption of the Briefwell drafting tool under the phased scope, mandatory review protocol, staff role redesign commitment, and reassessment/rollback triggers detailed in Section IV.  

  **Submitted for Board Vote on [Date of Meeting].**
