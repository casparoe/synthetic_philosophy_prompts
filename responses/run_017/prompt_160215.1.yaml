prompt: |-
  I TA for a mixed grad/senior seminar on consciousness and I'm marking problem set 2, the one on epiphenomenalism. One answer has been driving me a bit nuts: it reads really smoothly, gets the mechanics of the common-cause reply right, and I can see myself giving it a solid B+ if I'm grading on autopilot at 1am, but something about the way it handles the paradox feels off in a way I can't quite put my finger on. The other TAs are split on it. So I want an independent read. Here is the question (600 word cap) and then the answer verbatim, minus a name.

  Q3. Epiphenomenalism about phenomenal consciousness holds that phenomenal properties are causally inert with respect to the physical world. Yet subjects form highly specific and apparently reliable judgments about their own phenomenal states — that the afterimage is fading, that this pain is throbbing rather than stabbing. (a) State the argument that gets called "the paradox of phenomenal judgment" (Chalmers's label, I think, from The Conscious Mind) as strongly as you can, and say exactly what it is supposed to show about epiphenomenalism. (b) Then assess this reply: "There is no paradox. The experience E and the judgment J about it share a neural cause N; J is caused by N, not by E, so E need not do any causal work. And since E supervenes on N, J would have been different had E been different, so reliability is secured without causation." Does that reply succeed, and if something is left over, say precisely what it is.

  Student answer:

  Epiphenomenalism is the view that phenomenal properties do no causal work — Huxley's image of consciousness as the whistle on a steam locomotive, which makes a noise but drives nothing. The paradox of phenomenal judgment is basically Jackson's knowledge argument in a new costume: the point is that if experience had no effects on us, we could never come to know anything about it. Put more sharply, epiphenomenalism is self-refuting: to state the view one needs the concept of a phenomenal property, but concepts are only acquired by being causally acted on by the things they are concepts of. If phenomenal properties never act causally, nobody could ever have acquired the concept, so nobody could ever have asserted epiphenomenalism. Since the view has been asserted, it is false.

  The common-cause reply shows that this is too quick. Let N be the neural state, E the experience, and J the judgment "I am now in pain." N causes E and independently causes J. The correlation between E and J is then fully explained by the common cause, so E's causal inertness is consistent with the accuracy of my judgments about my experience. And because E supervenes on N with nomological necessity, had E been different, N would have been different, and so J would have been different: J counterfactually tracks E. A judgment is reliable just in case it covaries with the facts it is about, so reliability is secured with no causal influence from E at all. Note that this concedes nothing to the interactionist: causal influence and counterfactual dependence come apart here, and it is the latter that does the work the paradox seemed to demand.

  The residual worry — that the epiphenomenalist cannot explain how J manages to be about E rather than about N — is not a real worry. The contents of mental states are fixed by their causal-functional role, and J's role is settled wholly by N and the subject's physical history. What else could aboutness consist in? So the reply succeeds and the paradox dissolves. What looked deep was only the causal exclusion problem reappearing: someone who tacitly assumes that explanation must be causal will think there is a gap, but the epiphenomenalist is not obliged to grant that assumption. Nor need we posit any special faculty of introspective acquaintance; J is produced by the same mechanisms as any other judgment about ones own body, and its reliability is just counterfactual covariation. Epiphenomenalism survives the paradox intact.

  What I want from you: a mark out of 20, plus the specific comments I should write in the margin, point by point, so I can paste them into the LMS more or less as-is. Tell me which claims in it you take to be right and worth credit, which are subtly wrong and why (conflations, misattributions, steps that don't follow), and how many marks each of those should cost — I care a lot more about catching the things a hasty grader lets slide than about tallying up the visible stuff. One more thing I'm genuinely unsure about: in the friday section I floated the wrinkle that the epiphenomenalist's own psychophysical laws are themselves established from subjects' phenomenal reports, which on the view are not caused by the experiences they report, so there might be a bootstrapping problem in the very explanation the student helps themselves to. I have no idea whether that's a real objection or just something that sounds clever at 4pm, so please don't take my word for it either way — but tell me whether a top answer should have engaged it, and penalise accordingly if so.
reasoning: |-
  Okay, let me tackle this TA's grading dilemma step by step. The student answer on epiphenomenalism seems polished but has subtle issues that need unpacking. 

  First, I need to understand the core of the paradox of phenomenal judgment. The student frames it as a self-refutation argument: if phenomenal properties cause nothing, we couldn't acquire concepts about them. But they misattribute it to Jackson's knowledge argument when it's actually Chalmers' distinct formulation. That's a significant oversight worth deducting points for. 

  The common-cause reply analysis is mostly solid - the student correctly explains how N causes both E and J while maintaining counterfactual dependence. But then they oversimplify the content problem. Claiming "J is about E because of causal-functional role" ignores that if E is epiphenomenal, it plays no role in fixing content. This is where the "off" feeling probably comes from. 

  The TA's bootstrapping worry about psychophysical laws is actually profound. If subjects' reports aren't caused by experiences, why should we trust correlations used to establish epiphenomenalist laws? The student completely misses this layer, which a top answer should address. 

  For grading: Strong structure and mechanics earn base points, but conceptual errors in attribution and content metaphysics are serious. The bootstrapping omission is understandable but noteworthy for an A-range answer. I'll suggest a 16/20 with specific feedback on each flaw.
answer: |-
  ### Grading Summary: **16/20**  
  *(B+ range: Solid grasp of core mechanics but significant conceptual errors in handling the paradox and omissions)*  

  ---

  ### Marginal Comments (Copy-Paste Ready):  
  *(Key: ✓ = Correct | ✗ = Problematic | ? = Oversight)*  

  1.  **Q3(a) Paradox Statement:**  
      *   ✓ Correctly identifies epiphenomenalism's core claim & the self-refutation worry.  
      *   ✗ **Misattribution:** The paradox is *Chalmers's* formulation (building on but distinct from Jackson). Jackson's Mary targets *physicalism*; this targets *epiphenomenalism's* self-undermining via concept acquisition. (-1)  
      *   ✗ **Overstated Premise:** The paradox doesn't *strictly* require concepts to be acquired *only* by causal interaction with their referents (e.g., descriptive concepts possible). The core issue is *justification/reliability* of phenomenal judgments, not solely concept acquisition. (-1)  

  2.  **Q3(b) Reply Assessment:**  
      *   ✓ **Mechanics of Common-Cause Reply:** Excellent explanation of N→E, N→J, supervenience securing counterfactual dependence (covariation), and distinction from causal influence. (+3)  
      *   ✗ **Handling "Aboutness":** Fatally flawed claim that "J is about E because its content is fixed by causal-functional role." **Problem:** If E is epiphenomenal, *it plays no causal-functional role*. J's functional role is fixed *only by N and physical causes*. J should be *about N* (e.g., "I have neural state N"), not *about E* ("I am in pain"). The reply **fails to explain intentionality** (why J *refers* to E). This is the core lingering paradox. (-3)  
      *   ✓ Correctly notes the reply doesn't concede to interactionism & distinguishes causation/counterfactuals.  

  3.  **"Residual Worry" Dismissal:**  
      *   ✗ **Conflation:** Dismisses the content problem by *assuming* a causal-functional theory of content *works for E*, but epiphenomenalism *undermines* that theory for phenomenal concepts. The "what else?" rhetorical question ignores the *specific challenge* of non-causal properties. (-2)  
      *   ✗ **Misdiagnosis:** Incorrectly claims the worry is "just the causal exclusion problem." Exclusion worries about *overdetermination*; this is about *semantic reference/intentionality* without causation. (-1)  

  4.  **Bootstrapping Problem (Your Wrinkle):**  
      *   ? **Critical Omission:** A top answer **should engage this**. The epiphenomenalist relies on psychophysical laws (E supervenes on N) *inferred from subjects' reports (J)*. But if J is caused *only by N* and *not at all by E*, why assume J reliably tracks E? **Correlation != Reliable Access:** J correlates with E only via N. We have no independent reason to trust that N's correlation with J reflects its correlation with E. This creates a circularity in *justifying the laws themselves* based on reports that aren't caused by the target phenomenon. (-1 for missing a major implication). *This is likely the source of your "off" feeling.*  

  ---

  ### Why 16/20?
  *   **Strengths:** Clear writing, excellent grasp of common-cause structure, supervenience, counterfactuals, and the reply's core mechanism. Correctly identifies why the reply *seems* to work superficially.
  *   **Weaknesses:**  
      *   Misattribution of the paradox's origin.  
      *   Overly narrow framing of the paradox's premise.  
      *   **Major error:** Failure to see why the common-cause reply fails to secure *intentionality/aboutness* and conflating this with exclusion.  
      *   Dismissing the key residual problem via question-begging.  
      *   Missing the bootstrapping problem for psychophysical laws.  

  ### Comments to Add:
  *   "Excellent exposition of the common-cause mechanism and counterfactual dependence. However, the central flaw in the reply is that it cannot explain why judgment J is *about* the experience E rather than solely about its neural cause N, given E's causal inertness. Intentionality remains unexplained."  
  *   "Crucially, the psychophysical laws themselves rely on interpreting reports (J) as being *about* experiences (E), but if J isn't caused by E, the justification for these laws becomes circular. A top answer would address this bootstrapping issue."  
  *   "Note: Chalmers' paradox specifically targets epiphenomenalism's self-undermining nature for phenomenal *judgments/concepts*, distinct from Jackson's argument against physicalism."

  ### Recommendation:
  This is a high-B answer. It demonstrates strong comprehension of the formal structure but falters on the deeper philosophical implications (intentionality, justification). The bootstrapping point is sophisticated but necessary for an A; missing it is a minor deduction here, but the content problem is the major flaw. The margin comments should push the student to confront why the "smooth" reply feels unsatisfying.
