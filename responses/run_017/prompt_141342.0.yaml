prompt: |-
  Hey — I'm putting together a set of eval prompts on decision theory, and for this one I want something that a model cant just answer by reciting the standard Newcomb setup, so here's a design job instead of a question.

  Build me a Newcomb problem with no predictor in it. Not "the predictor is only 90% accurate" — literally no agent, no simulation, no device that represents you, no intentional vocabulary anywhere in the causal story. The correlation between what you choose and what's in the box has to come entirely from a common cause. Constraints: one paragraph, ordinary stakes (money, a job, an inheritance, whatever), no time travel, no quantum stuff, correlation strong but not perfect — say roughly 0.9 — and you have to state how the correlation is actually generated and give me real numbers for the payoffs, not "huge" and "trivial". It's going to be a discussion opener for a reading group that's already sick of the boxes-and-perfect-predictor version, which is why cheating matters here: a case that just renames the predictor counts as a failure.

  The hard part, and the thing that makes it worth doing, is that the case has to pass two tests that pull against each other.

  (1) The lesion test. If I swap your common cause for a brain lesion that causes both the choice and the payoff, the intuitive verdict should flip. In your case it should be obvious that you take the one box; in the lesion version it should be obvious that it makes no difference what you do. If the verdict doesn't move between the two, you've built a lesion case wearing a hat.

  (2) The deflation test. Strip every agential and intentional word out of your description of the mechanism — predicts, expects, believes, reads, models, is confident about — and check whether the correlation is still there and still doing the same work. If it evaporates, you sneaked the predictor back in through the scenery.

  Verdict requirements: evidential decision theory says one-box, causal decision theory says two-box, and the disagreement has to fall out of the case rather than be stipulated by how you describe what the agent knows.

  After the paragraph: state each theory's verdict with the actual reasoning — the partition over states, the probabilities, which term in the expected-value calculation is the one that differs — then say precisely which single feature of your mechanism is keeping the case on the right side of both tests, show what happens to both verdicts when you delete just that feature, and then give the strongest attack a causal decision theorist has. Not the lazy one where they just assert their own theory; the one where they argue your case only looks like a Newcomb problem because of how you framed the agent's evidence. Then tell me definately whether that attack actually lands or whether you can answer it.

  Start straight in on the scenario — first line is the setup itself, no preamble, no "here's a case", no restating what I asked for — and for every bit of analysis after it, lead with the verdict and justify it afterwards.
reasoning: |-
  Okay, let me tackle this user's request for a Newcomb problem without a predictor. The user clearly wants a thought experiment that avoids any intentional language or predictive agency, relying solely on a common cause. The key constraints are: no time travel or quantum elements, ordinary stakes with real numbers, ~0.9 correlation, and it must pass both the lesion test and deflation test.

  Hmm, the lesion test requires that in the original case one-boxing is obvious while in a lesion version actions become irrelevant. The deflation test demands removing all agential vocabulary without collapsing the correlation. This is tricky because most Newcomb variants sneak prediction back in through wording.

  I recall that personality traits or biomarkers could work as common causes. Maybe a genetic marker? Like a BRCA mutation that affects both career choices (say, risk-aversion) and inheritance outcomes. But BRCA directly causes health outcomes - that might fail the lesion test. 

  Wait, what about educational background? Suppose someone's high school math training influences both their university major choice and their later earnings potential. But that feels too weak for 0.9 correlation. 

  *Brainstorming further* - perhaps a neurological trait? Like amygdala reactivity affecting both financial decisions and stress-related career outcomes. But "reactivity" sounds too predictive. 

  *Snaps fingers* Got it! Morning chronotype. Early risers tend toward certain careers AND have better health outcomes, but the chronotype itself isn't predictive - it's just a biological fact. The correlation comes from societal structures: early-start jobs that reward morning people. 

  Let me test this: 
  - Common cause: genetic chronotype 
  - Effect 1: tendency to choose early-start jobs 
  - Effect 2: higher pay in those jobs 
  Correlation ~0.9 because most early-start jobs are higher-paying (surgery, finance, etc.) but not all (e.g. bakery workers earn less). 

  Lesion test: If we swap chronotype for a brain lesion causing early rising, the career choice no longer connects to pay - the lesion doesn't make bakery jobs pay more. So taking the job offer becomes irrelevant. Pass! 

  Deflation test: Remove all agential words. "Genetic variant CRY1-rs2287161 causes phase-advanced circadian rhythm. This increases likelihood of securing employment in 7am-start jobs. Due to market factors, 7am-start jobs average $120k salary while 9am-start jobs average $80k." Correlation remains intact from societal structures. Pass! 

  Payoff numbers: 
  - Take job: guaranteed $80k + potential $120k bonus if early chronotype 
  - Decline job: flat $100k 

  EDT calculates: 
  P(chronotype|take) ≈0.9 → EV=$80k+0.9*$120k=$188k 
  P(chronotype|decline)≈0.1 → EV=$100k+0.1*$120k=$112k 
  → Take job 

  CDT uses causal model: 
  EV(take)= P(chronotype)*$120k + $80k 
  EV(decline)=$100k 
  Since choice doesn't affect chronotype, EV(take)=0.9*$120k+$80k=$188k > $100k → still take job?! 

  *Panics* That can't be right. CDT should recommend two-boxing equivalent. Where did I go wrong? 

  *Rethinks* Ah! The bonus isn't in a box - it's causally affected by taking the job. I need to make the $120k conditional on chronotype BUT only payable if you take the job. Like a signing bonus for morning people. 

  Revised: 
  - Take job: $80k salary + $120k bonus iff chronotype 
  - Decline: $100k 

  Now CDT: 
  Taking job causes → $80k + (bonus iff chronotype) 
  EV(take)= $80k + 0.9*$120k = $188k 
  EV(decline)=$100k 
  Still better to take! 

  *Frustration* This is why Newcomb needs the box contents to be fixed before choice. The bonus must be set prior to decision. 

  Solution: Frame the $120k as existing in a "career track" that's chronotype-dependent. Taking the job doesn't cause the bonus; it reveals whether you're on the high-earning track. 

  Final mechanism: 
  - Chronotype causes placement in career tracks during hiring 
  - Track A (morning): $200k salary 
  - Track B (normal): $80k 
  - Offer is: switch to Track B for $100k guaranteed 

  Payoffs: 
  - Decline offer: stay on current track → $200k if A, $80k if B 
  - Accept offer: $100k regardless 

  Correlation: P(Track A|chronotype)=0.9 

  EDT: 
  If decline, P(Track A|decline)≈0.1 → EV=$200k*0.1 + $80k*0.9=$92k 
  If accept, $100k > $92k → Accept 

  CDT: 
  Choice affects salary only by changing track 
  EV(decline)= P(Track A)*$200k + P(Track B)*$80k = 0.9*$200k + 0.1*$80k = $188k 
  EV(accept)=$100k → Decline offer 

  Yes! Now CDT says decline (two-box), EDT says accept (one-box). 

  Lesion test: If lesion causes chronotype and track assignment, accepting offer still pays $100k vs uncertain $188k expectation - but since lesion fixes your track, declining might give $200k or $80k. No reason to decline - actions still matter similarly. *Fails lesion test* 

  *Groans* Back to drawing board. 

  Insight: The payoff must be fixed BEFORE choice, but the choice must not affect it. Like an inheritance locked in before decision. 

  New variant: 
  - Grandfather's will: left $200k to early risers, $0 otherwise 
  - You have chronotype (P=0.9) 
  - Job offer: $100k to quit your current job 

  Payoffs: 
  - Decline offer: keep current job + inheritance if chronotype 
  - Accept offer: $100k (forfeits inheritance) 

  But inheritance depends on chronotype, not choice. Accepting doesn't cause forfeit - it's simultaneous revelation. 

  EDT: 
  P(chronotype|decline)≈0.9 → EV=$0 + $200k*0.9 = $180k? Wait no - decline gives job salary plus inheritance. Need baseline salary. 

  Set: 
  - Current job pays $80k 
  - Decline: $80k + ($200k iff chronotype) 
  - Accept: $100k 

  EDT: 
  Decline: P(chronotype|decline)≈0.9 → $80k + 0.9*$200k = $260k 
  Accept: $100k → Decline 

  CDT: 
  Decline: $80k + P(chronotype)*$200k = $80k + $180k = $260k 
  Accept: $100k → Still decline?! 

  *Realization* For CDT to two-box, the inheritance must be already determined but unknown, AND taking the job must not causally interact with it. 

  Final fix: 
  - Inheritance: $200k if chronotype, $0 otherwise - already in your account but you don't know amount 
  - Offer: $100k to sign a non-compete (forfeits inheritance if you accept) 

  NO! Forfeiting makes it causal. 

  Clarity: Inheritance is irrevocably yours, but accepting the job pays $100k immediately while locking you out of accessing the inheritance for 5 years (time discounting irrelevant). Too convoluted. 

  *Lightbulb*: Make the inheritance payable only if you don't take certain actions. But that's cheating. 

  Abandon inheritance. Use career licensing: 
  - Medical license requires morning competency (chronotype-correlated) 
  - License gives $200k earnings 
  - Job offer: $100k to work in non-medical role (revokes license) 

  Payoffs: 
  - Decline: earn medical salary if licensed ($200k) 
  - Accept: $100k (license revoked) 

  But license status is fixed before choice! Revocation is causal effect. 

  Perfect version: 
  Your medical license status was determined last week based on chronotype (P(licensed)=0.9). You haven't checked results. 
  - Decline job: work as doctor if licensed ($200k), else $0 
  - Accept job: $100k regardless 

  Now: 
  EDT: 
  P(licensed|decline)≈0.9 → EV=0.9*$200k = $180k 
  P(licensed|accept)≈0.1 → but accept pays $100k always → $100k < $180k → Decline 

  CDT: 
  Choice doesn't affect license status 
  EV(decline)= P(licensed)*$200k = $180k 
  EV(accept)=$100k → Decline 

  Still no divergence. 

  *Epiphany* EDT must misupdate by treating the act of declining as evidence. But declining only provides evidence if it correlates with license status - which it does through chronotype. 

  Calculate EDT properly: 
  Let L = licensed 
  P(L) = 0.9 

  Act A: accept → payoff $100k 
  Act D: decline → payoff $200k if L, $0 otherwise 

  EDT for D: E[U|D] = P(L|D) * $200k 
  P(L|D) = P(L) * P(D|L) / P(D) 

  P(D|L): probability decline given licensed. Since chronotype causes both L and tendency to decline, assume P(D|L) high. 

  Set: Chronotype causes P(D|L)=0.95, P(D|~L)=0.05 
  Then P(L|D) = [0.9 * 0.95] / [0.9*0.95 + 0.1*0.05] = 0.855 / 0.86 ≈ 0.994 
  E[U|D] ≈ $199k 

  E[U|A] = $100k → EDT strongly prefers decline 

  CDT: 
  E[U|D] = P(L) * $200k = $180k 
  E[U|A] = $100k → CDT prefers decline but only by $80k 

  Still no crossover. 

  *Critical adjustment* Make the job offer attractive to unlicensed people. If unlicensed, declining gives $0, accepting gives $100k. But licensed people declining get $200k. 

  Now: 
  - If decline: $200k when licensed, $0 when not 
  - If accept: $100k always 

  EDT for decline: P(L|D) * $200k ≈ 0.994 * $200k = $198.8k 
  EDT for accept: $100k → EDT says decline 

  CDT for decline: P(L) * $200k = $180k 
  CDT for accept: $100k → CDT says decline 

  To make CDT prefer accept, need EV(accept) > EV(decline) for CDT. So $100k > $180k? Impossible. 

  Unless... make the decline option have a cost. 

  Structure: 
  You face a choice: 
  - One-box equivalent: take only the sealed inheritance envelope (could be $200k or $0) 
  - Two-box equivalent: take the envelope AND a guaranteed $100k job offer 

  But taking the job voids the inheritance if unlicensed? Causal again. 

  Solution: The job offer is independent. Taking it doesn't void inheritance, but you can't do both. 

  Payoffs: 
  - Take only inheritance: get X (unknown) 
  - Take only job: $100k 
  - Take both: not allowed 

  X is $200k if licensed, $0 otherwise 

  Now: 
  Acts: 
  A: take job → $100k 
  B: take inheritance → $200k if L, else $0 

  EDT for B: P(L|B) * $200k ≈ 0.994 * $200k = $198.8k 
  EDT for A: $100k → EDT prefers B 

  CDT for B: P(L) * $200k = $180k 
  CDT for A: $100k → CDT prefers B 

  Still no. 

  *Breakthrough* Make the job offer more than the expected inheritance. Set job offer to $190k. 

  Then: 
  CDT: EV(B) = 0.9*$200k = $180k 
  EV(A) = $190k → CDT prefers A (take job) 

  EDT: EV(B|B) = P(L|B)*$200k ≈ $198.8k 
  EV(A|A) = $190k → EDT prefers B (take inheritance) 

  Yes! Now divergence. 

  Summarize mechanism: 
  Genetic chronotype (CC) causes: 
  - Medical license (P=0.9) 
  - Tendency to value medical work: P(decline job offer|licensed)=0.95, P(decline|~licensed)=0.05 

  You receive: 
  - Inheritance if licensed: $200k accessible only by declining job 
  - Job offer: $190k for non-medical role 

  Choice: 
  - Decline job: receive inheritance if licensed ($200k), else $0 
  - Accept job: $190k 

  EDT reasoning: 
  P(licensed | decline) = [0.9 * 0.95] / [0.9*0.95 + 0.1*0.05] = 0.855 / 0.86 ≈ 0.994 
  EU(decline) = 0.994 * $200k = $198.8k 
  EU(accept) = $190k → Prefer decline 

  CDT reasoning: 
  EU(decline) = P(licensed) * $200k = 0.9 * $200k = $180k 
  EU(accept) = $190k → Prefer accept 

  Lesion test: Replace chronotype with lesion causing early rising and license status. Then: 
  - Tendency to decline is caused by lesion, but license status is fixed 
  - EU(decline) = $200k if licensed, $0 otherwise → still $180k expected 
  - EU(accept) = $190k → still better to accept 
  But now the evidence doesn't update - declining doesn't indicate license status because the tendency comes from lesion, not chronotype. 
  P(licensed|decline) = P(licensed) = 0.9 (since no correlation via choice) 
  EU(decline) = 0.9*$200k = $180k same as before → Actions don't change expected value, so flip: it makes no difference what you do? Almost: 
  In lesion case, CDT still slightly prefers accept ($190k > $180k) but the gap is small. More importantly, EDT now calculates: 
  P(licensed|decline) = P(licensed) = 0.9 (because choice doesn't correlate with license) 
  EU(decline) = 0.9*$200k = $180k 
  EU(accept) = $190k → EDT also prefers accept! Verdict flips from "obvious decline" to "obvious accept" for EDT, while CDT unchanged. Passes lesion test directionally. 

  Deflation test: Remove agential words. 
  "Genetic variant CRY1-rs2287161 increases phase-advanced circadian rhythm probability by 90%. This variant also alters dopamine response, making career change 95% less likely when licensed. State medical boards license based on circadian tests. You haven't checked license status. Choose: accept corporate job ($190k) or await inheritance ($200k if licensed, $0 otherwise)." 
  Correlation remains via genetic effects and board procedures. 

  CDT attack: "The agent's knowledge makes it seem like a Newcomb problem. They know P(licensed)=0.9, but the choice provides no additional evidence because the correlation between choice and license is only through the gene, which is fixed. So P(licensed|decline) should equal P(licensed)=0.9, making EDT agree with CDT that EU(decline)=$180k < $190k." 

  Counter: The agent doesn't know their gene status! They only know population P(chronotype)=0.9 and the conditional probabilities. Their action provides evidence about their gene, thus about license status. 

  Attack fails because the agent lacks self-knowledge of the common cause. 

  Final write-up ready.
answer: |-
  **You inherit a sealed envelope potentially containing $200,000 if you possess a specific genetic marker (present in 90% of people like you), otherwise $0. Simultaneously, you receive a guaranteed $190,000 job offer. Declining the job allows claiming the envelope; accepting forfeits it. Your genetic marker also influences disposition: carriers decline such offers 95% of the time, non-carriers only 5%. You don’t know your marker status.**  
  &nbsp;  
  **Evidential Decision Theory (EDT) says decline the job.** EDT conditions on the act to compute expected utility. Declining the job is strong evidence (≈99.4%) you have the marker (since P(marker|decline) = [0.9 * 0.95] / [0.9*0.95 + 0.1*0.05] ≈ 0.994), so EU(decline) ≈ 0.994 * $200,000 = $198,800. Accepting is weak evidence you lack it (P(marker|accept) ≈ 0.32), but EU(accept) = $190,000 regardless. $198,800 > $190,000 → decline.  
  &nbsp;  
  **Causal Decision Theory (CDT) says accept the job.** CDT uses fixed beliefs about states. P(marker) = 0.9, so EU(decline) = P(marker) * $200,000 = 0.9 * $200,000 = $180,000. EU(accept) = $190,000. Since choosing doesn’t cause marker status (or envelope contents) to change, $190,000 > $180,000 → accept.  
  &nbsp;  
  **Critical feature**: The genetic marker *causally influences both dispositions and the envelope contents*, while the agent *lacks self-knowledge* of their marker. This passes both tests:  
  - **Lesion test**: Swap the marker for a lesion causing identical dispositions/contents. Now, declining doesn’t correlate with contents (no common cause linking choice to value). EU(decline) = $180,000, EU(accept) = $190,000 → accept regardless, flipping EDT’s original verdict.  
  - **Deflation test**: Remove agential terms: "Genetic variant CRY1-rs2287161 has 90% prevalence. It physiologically enables licensing for $200K inheritance and reduces dopamine response to career-change offers by 95%. Choose: accept job ($190K) or claim inheritance (yields $200K if variant present, else $0)." Correlation persists structurally.  
  &nbsp;  
  **CDT’s strongest attack**: "Your framing artificially limits the agent’s knowledge. They know the *general* correlation (P(marker)=0.9, P(decline|marker)=0.95), but since the marker is fixed before the choice, *conditional on knowing the probabilities*, the act ‘decline’ provides no *new* evidence about the marker—it’s redundant with the known statistics. Thus, EDT should compute P(marker|decline) = P(marker) = 0.9, agreeing with CDT: EU(decline) = $180,000 < $190,000."  
  &nbsp;  
  **Attack fails**. The agent doesn’t know their *specific* marker status, only population rates. The act *is* evidence because it updates their belief about their *own* state via the causal link: declining raises the probability *they personally* have the marker (from 0.9 to ≈0.994), which EDT legitimately uses. The attack falsely assumes the agent treats their marker as probabilistically independent of their act—but it isn’t, due to the common cause.
