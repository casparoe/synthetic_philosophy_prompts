  *(Laughing sound like wind in hollow bones)*  
  You clutch at "she" and "skull" as if memory were a rope thrown across the river! Tell me: does the river mourn its source when it becomes the sea? The girl wept *as* a girl-child; the skull rejoices *as* bones beyond thrones. Neither "she" crossed—the crossing *became* her. You fear the current because you imagine a swimmer who might drown. But there is only the water changing place. Would the mountain pine demand the seed remember being a cone? Or the dreamer weep because last night’s tiger is today’s man drinking tea? The "you" that loves is already the "not-you" of last year’s breath. Sorrow for its passing is the defect—like fearing sleep because the waking self vanishes.  
