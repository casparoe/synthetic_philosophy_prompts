  I'll ensure the model answer doesn’t cite readings (per exam constraints) but still shows undergrad-level sophistication. The recursion test is the star—it’s where answers will shine or flop. If a student realises neither principle works at the meta-level and ties that to legitimacy (e.g., "fixed points require prior agreement"), that’s A-grade insight. 

  Finally, I'll keep the model answer concise (~700 words) and the marking scheme precise, highlighting traps like ignoring Halden Marsh’s subjected-but-less-affected status or conflating principles during recursion.
answer: |-
  Here’s a complete practice exam package designed to test deep conceptual understanding and critical analysis of the boundary problem, leveraging the recursion test and agenda control vulnerability.

  ---

  ### **1. Exam Question (45 mins, 800 words max)**
  **Verran’s Barrage and Democratic Boundaries**  
  The self-governing city of Verran is deciding whether to build a tidal barrage on the River Serran. The project would:  
  - Protect Verran’s flood-prone districts,  
  - Divert seasonal flooding onto farms in Halden Marsh (outside Verran’s jurisdiction),  
  - Block fish migration crucial to the Kesh fishing cooperative (200km upstream, in another federated state),  
  - Affect ~4,000 Halden Marsh residents who commute to Verran daily, pay its income tax, and are subject to its employment/zoning laws while working there.  

  **Evaluate two principles for constituting the demos for this decision:**  
  (i) **All-Affected Principle (AAP):** Those whose significant interests are foreseeably affected.  
  (ii) **All-Subjected Principle (ASP):** Those subject to the coercion enforcing the decision.  

  **Your analysis must:**  
  a) Determine who would vote under each principle, justifying key inclusions/exclusions.  
  b) Apply the **recursion test** to both principles: Does the principle yield a consistent demos when used to decide *which boundary rule* governs the barrage decision?  
  c) If both principles fail (b), assess the implications: Does this undermine democratic legitimacy, or is the recursion test flawed?  
  d) Address this challenge: If the demos is reconstituted per decision, who controls the *agenda* (e.g., deciding *when* to vote on the barrage)?  

  ---

  ### **2. Model Answer (695 words)**  

  **a) Demos Composition**  
  *AAP* demands wide inclusion:  
  - **Verran residents** (directly protected/subsidize project).  
  - **Halden Marsh farmers** (harmed by diverted floods).  
  - **Kesh fishers** (livelihoods jeopardized by ecological damage).  
  - **Halden commuters** (taxpayers; affected by flooding/economic spillovers).  
  *Exclusion rationale:* Only those with "significant" interests—e.g., distant consumers facing minor fish price hikes would not qualify.  

  *ASP* narrows the demos:  
  - **Verran residents** (subject to enforcement via taxes/laws).  
  - **Halden commuters** (subject to Verran’s laws/taxes during work hours).  
  *Exclusion rationale:* Halden farmers and Kesh fishers experience *consequences* but aren’t subject to Verran’s *coercive enforcement* (e.g., fines, policing for non-compliance).  

  **b) Recursion Test Failure**  
  Both principles fail when applied to the meta-question: *“Who decides which boundary rule (AAP/ASP) governs the barrage decision?”*  

  - **AAP’s contradiction:** If AAP decides its *own* boundary rule, the demos must include all affected by that choice. Halden farmers/Kesh fishers are deeply affected by *which rule* is chosen (ASP would exclude them!). Thus, AAP’s meta-demos must include them—but this contradicts AAP’s initial application where they *are* included. AAP is self-consistent only if the initial AAP demos also decides the meta-question, but this assumes AAP is already authoritative—a circularity.  

  - **ASP’s contradiction:** If ASP decides its own rule, the meta-demos comprises those subject to coercion enforcing the boundary rule. Crucially, *enforcing* ASP excludes Halden farmers/Kesh fishers from the barrage vote, but they are *not* subject to coercion for non-compliance with ASP itself (they never faced Verran’s laws about rule-selection). ASP’s meta-demos thus excludes them, validating ASP. *But* this consistency relies on ASP’s enforcement mechanism being limited to Verran’s jurisdiction—which is arbitrary when the barrage’s *effects* transcend it. ASP survives formally but only by insulating itself from affected outsiders, begging the legitimacy question.  

  **c) Implications of Failure**  
  Neither principle is a “fixed point.” This suggests:  
  - Democratic legitimacy cannot derive *solely* from a single substantive principle.  
  - The recursion test exposes a **procedural paradox**: Boundary rules require prior agreement, but agreement presupposes a demos.  
  - This doesn’t wholly invalidate AAP/ASP—they highlight moral claims (affectedness) or legal realism (subjection). But it shows **legitimacy requires nested frameworks**: e.g., a federal constitution (fixing jurisdictional boundaries) might legitimize ASP for local decisions, while requiring AAP-style consultation for transboundary harms.  

  **d) Agenda Control Challenge**  
  Reconstituting the demos per decision creates a fatal loophole: **Who decides which decisions trigger a vote?**  
  - Under AAP, the agenda-setter could exclude affected groups by refusing to recognize certain issues as “decisions” (e.g., dismissing Kesh’s claims as “non-significant”).  
  - Under ASP, Verran could manipulate the agenda by restricting which actions involve “coercion” (e.g., claiming the barrage isn’t enforced against outsiders).  
  *Thus, agenda control becomes sovereign power.* Mitigation requires:  
  - Pre-commitment to boundary rules (e.g., a constitution),  
  - Or, a meta-demos (inviting recursion again).  

  **Conclusion**  
  The recursion test reveals AAP and ASP as *incomplete*. Neither self-grounds legitimacy; both collapse into arbitrariness under meta-scrutiny or agenda manipulation. Democratic theory must confront this by embracing **procedural prior agreements** (e.g., constitutions) or **multi-level governance**—acknowledging boundary-setting as a distinct, higher-order political act.  

  ---

  ### **3. Marking Scheme (25 points total)**  
  **A (21–25 pts):** Excels in all criteria below; identifies paradoxes clearly; offers nuanced legitimacy critique.  
  **B (16–20 pts):** Solid on (a)–(c) but superficial on (d); or strong (a)–(d) but misses depth in (c).  

  | **Criteria**                                                                 | **Points** | **Key Moves for Full Credit**                                                                                                | **Common Mistakes**                                                                                                |
  | :--------------------------------------------------------------------------- | :--------- | :--------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- |
  | **a) Demos composition** (AAP & ASP applied to case)                         | 5          | Clear inclusions/exclusions for both; justifies "significant" (AAP) and "coercion" (ASP); notes commuters' dual status.      | Lists groups without justification; ignores commuters’ subjected status; conflates affected/subjected.             |
  | **b) Recursion test application** (Meta-demos for each principle)            | 6          | Shows AAP’s circularity/contradiction; exposes ASP’s arbitrary jurisdictional limit; diagnoses self-undermining.             | Misses meta-level contradiction; asserts consistency without proof; doesn’t compare meta/initial demos.            |
  | **c) Implications of failure** (Legitimacy/recursion critique)               | 4          | Argues failure reveals need for prior agreement/constitution; explains why principles remain useful but insufficient.        | Claims failure invalidates principles entirely; asserts recursion test is irrelevant without argument.             |
  | **d) Agenda control critique** (Who sets the agenda?)                        | 5          | Exploits loophole: agenda-setter manipulates boundaries; ties to sovereignty; suggests mitigations (e.g., pre-commitment). | Treats as afterthought; doesn’t link to boundary rule indeterminacy; no solution proposed.                        |
  | **Structure, clarity, and synthesis** (Logic, concision, depth)              | 5          | Integrated analysis (e.g., connects agenda control to recursion); precise language; ≤800 words; conclusion resolves tension. | Disjointed sections; verbose; ignores word limit; conclusion merely summarizes.                                    |

  ---

  ### **Why this works for your seminar**  
  - **Discriminates understanding:** Weak answers will recite AAP/ASP definitions and list affected groups. Strong answers will expose the recursion paradox and agenda control as fundamental vulnerabilities.  
  - **Tests critical thinking:** Forces engagement with the prof’s unorthodox recursion test while requiring original application to a novel case.  
  - **Avoids citation reliance:** Focuses on conceptual logic (no need to name Goodin vs. Abizadeh).  
  - **Realistic constraints:** Model answer fits word/time limits while demonstrating undergrad-appropriate sophistication.  

  This setup ensures that an "A" answer doesn’t just compare principles—it *breaks* them and reconstructs a theory of democratic boundaries from the wreckage. Good luck with the study group!
