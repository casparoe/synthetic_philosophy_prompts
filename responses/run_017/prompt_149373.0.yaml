answer: |-
  ## Adversarial Collaboration: Fanaticism vs. Tempering in Expected Utility Theory

  **Agreed Claims (Substantive Common Ground)**

  1.  **The Core Trade-off:** Adopting unbounded expected utility (EU) maximization entails that for *any* finite cost intervention and *any* non-zero probability, there exists *some* sufficiently large potential benefit that makes the intervention worthwhile, regardless of how small the probability is.
  2.  **Axiomatic Roots:** The dominance, separability, and dynamic consistency arguments strongly favor EU maximization with a utility function unique up to positive affine transformation. Rejecting fanaticism requires weakening or abandoning at least one of these axioms/arguments.
  3.  **Tail Dominance in EU:** Under unbounded EU, the decision between any two options with finite, bounded *differences* in utility in the "central" bulk of probability mass (e.g., 99.999% of the distribution) can be overridden by arbitrarily small probability tail events where the utility difference is sufficiently large.
  4.  **Epistemic Uncertainty in Tails:** Human credence assignments for remote, high-impact tail events (e.g., specific scenarios for human extinction, hyper-exponential technological growth) are inherently highly uncertain and poorly calibrated. We lack reliable frequency data or robust models for these extremes.
  5.  **Sensitivity vs. Robustness:** Fanaticism makes decisions hypersensitive to the precise structure of the utility function and probability assignments in the extreme tail, where our knowledge is weakest. Tempering aims for robustness by limiting this sensitivity.
  6.  **The Pragmatic Challenge:** If fanaticism dictates that the highest priority intervention is always the one addressing the most extreme tail risk with the largest imaginable payoff (however speculatively conceived), this seems practically unworkable and misaligned with intuitive notions of reasonable prioritization.
  7.  **The Manufactured Tail Problem Exists:** An agent *can* generate novel, low-probability, high-utility scenarios through imagination or computation (e.g., "If I compute for a year, I might discover a physics tweak enabling Dyson spheres in a decade, probability 10^-100"). This ability is endogenous.
  8.  **No Free Lunch:** There is likely no decision theory that perfectly satisfies all intuitively desirable axioms (dominance, separability, dynamic consistency, strict Pareto, transitivity, *and* robustness against fanaticism/manufactured tails) simultaneously when utility is unbounded and probabilities can be arbitrarily small.
  9.  **Second-Order Stakes:** The decision about *which* decision theory to adopt (Fanatic EU vs. Tempered Alternative) has potentially enormous stakes, as it governs all future decisions, including those affecting existential risk.
  10. **Reductios Cut Both Ways:** The Fanatics find the Tempered rejection of standard EU axioms/arguments (dominance, etc.) deeply unsatisfying and potentially incoherent. The Tempered find the practical implications of Fanaticism (e.g., dedicating all resources to the latest manufactured tail scenario) absurd and disqualifying.
  11. **Calibration Gap:** Human probability assessments for events with stated probabilities below, say, 10^-9 are empirically untestable and likely systematically miscalibrated (either overconfident or underconfident) due to lack of relevant experience and cognitive limitations.
  12. **The Need for Thresholds (Implicit or Explicit):** Tempering inherently involves establishing *some* threshold (on probability, utility, or the product) where small probabilities cease to dominate, even if only implicitly through the chosen decision rule. Fanaticism rejects any such fixed threshold as arbitrary and violating dominance.

  **Disagreements: Cruxes, Positions, Test Cases & Predictions**

  | Crux (Neutral Phrasing)                                                                 | Fanatic Position (Self-Description)                                                                 | Tempered Position (Self-Description)                                                                 | Concrete Test Case / Argument                                                                                                                              | Fanatic Prediction                                                                                               | Tempered Prediction                                                                                                     |
  | :-------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- |
  | **1. Is EU's extreme tail sensitivity a necessary feature or a fatal flaw?**            | **Feature:** Sensitivity to all possible outcomes, however remote, is necessary for rationality, dominance, and consistency; ignoring tails is willful blindness. | **Flaw:** Hypersensitivity to the least knowable parts of the distribution renders the rule fragile and impractical; robustness against tail speculation is paramount. | **Case:** Asteroid Deflection vs. Core Poverty. Asteroid impact prob: 10^-8, utility loss: -10^15. Core poverty intervention: Certain utility gain +100. EU says deflect if U(deflect) * 10^-8 > 100. | **Pred:** Rational agent *must* prioritize deflection if cost allows, regardless of practical absurdity; doing otherwise violates dominance. | **Pred:** A reasonable agent prioritizes poverty relief; EU's mandate here exposes its absurdity when tails dominate known goods. |
  | **2. How should agents handle meta-uncertainty between Fanatic EU and Tempered rules?** | **"Fanaticism One Level Up":** Maximizing expected value over *theories* requires applying Fanatic EU to the meta-choice, given the astronomical stakes of getting DT right. | **Meta-Tempering:** Meta-decision requires a distinct, tempered rule (e.g., satisficing, variance aversion, min-max) precisely to avoid infinite regress and fanatical meta-choices. | **Case:** Agent is 70% Fanatic, 30% Tempered. Must choose a DT textbook to commit to. Stakes of future choices are astronomical under Fanaticism, finite under Tempering. | **Pred:** Agent *must* choose Fanatic textbook (max EV over theories); not doing so contradicts the 70% Fanatic credence applied at meta-level. | **Pred:** Agent uses a robust rule (e.g., minimax regret) for meta-choice, likely choosing Tempered or a compromise, avoiding fanatical tail-chasing at meta-level. |
  | **3. Does the "Manufactured Tail" pose a distinct problem from Pascal's Mugging?**      | **Collapse:** Manufactured tails are just self-muggings; the core issue is EU's sensitivity to low p * high U products. Adversary is irrelevant; the structure is identical. | **Distinct:** Endogenous generation allows unbounded creation of new dominating tails *at will*, making prioritization arbitrary and dependent on computational/imaginative effort, not world features. | **Case:** Agent can spend resources: (A) On proven medicine (Certain +100 util). (B) On computing a new physics model (Cost C, Prob P_comp of success, if success Prob P_tail of +U_tail). Agent can adjust computation time to make P_comp * P_tail * U_tail arbitrarily high by imagining larger U_tail. | **Pred:** If P_comp * P_tail * U_tail > C, EU *requires* B, regardless of how U_tail was generated. The "manufactured" aspect doesn't alter the logic. | **Pred:** If U_tail is generated endogenously solely to dominate, and P_tail lacks external grounding, prioritizing B based on it is irrational arbitrage, distinct from an adversary's claim. |
  | **4. Can tail probabilities ever be sufficiently "well-grounded" to justify fanatical weighting?** | **Yes (in principle):** With sufficient theoretical grounding or indirect evidence, extremely low p can be rationally decisive for sufficiently high U. Calibration difficulties are practical, not fundamental. | **No (for relevant tails):** For the extreme tails (p < 10^-12) and utilities (|U| > 10^20) needed to dominate central cases, no human-assigned p can be sufficiently well-grounded or calibrated to bear fanatical weight. | **Case:** Compare credence in "False Vacuum Decay triggered by LHC" (p ~ 10^-? based on physics models) vs. "A wizard will grant immortality if you donate $1000 to Charity X" (p ~ 10^-100, no grounding). Is p_decay (say 10^-10) "well-grounded enough"? | **Pred:** If physics models genuinely support p_decay ~ 10^-10 and U_loss is -infinity, mitigation *must* dominate all finite-cost alternatives, despite calibration challenges. | **Pred:** Even p_decay ~ 10^-10 is too poorly calibrated/grounded relative to the stakes to justify fanatical dominance over central goods; mitigation is important but not absolute. |

  **Clarifying Verbal Disagreements**

  *   **"Rational":** Fanatics equate rationality strictly with satisfying the EU axioms. Tempered often use "rational" more broadly to include pragmatic robustness and avoidance of clear absurdities, even at axiomatic cost. This is a substantive difference masked by shared terminology.
  *   **"Pragmatic":** Fanatics see Tempering as sacrificing principle for convenience. Tempered see Fanaticism's demands as not merely "inconvenient" but fundamentally incompatible with coherent, practical agency in the face of uncertainty and imaginative capacity.
  *   **"Arbitrary":** Fanatics see any threshold for ignoring tails as arbitrary and dominance-violating. Tempered see the *lack* of a threshold as making prioritization arbitrary (dependent on manufactured tails) and view thresholds as a necessary (though imperfect) component of a robust rule.

  **Falsification Conditions**

  *   **Fanaticism:** Would be falsified if a consistent, formal decision procedure were developed that robustly avoids fanatical conclusions (like prioritizing manufactured tails or absurd muggings) *while* satisfying dominance, separability, and dynamic consistency for unbounded utility, *without* simply smuggling in thresholds equivalent to bounded utility.
  *   **Tempering:** Would be falsified if a concrete, realistic case were demonstrated where: (1) tail probabilities and utilities are arguably sufficiently well-grounded (by agreed standards of evidence/modeling, e.g., peer-reviewed physics model for p, consensus on U), (2) EU fanaticism clearly mandates a specific high-stakes intervention, and (3) *all* proposed tempered alternatives fail to recommend this intervention *and* this failure leads to clearly dominated choices (e.g., missing a real, catastrophic risk that was knowable in principle) under the tempered rule itself.
