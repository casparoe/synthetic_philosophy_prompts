  Okay, the user wants to write a paper on Spider-Man 2 for their ethics class, focusing on utilitarianism and the demandingness objection. They don't want a simple "Spider-Man is utilitarian" take. Instead, they're interested in how the movie handles the idea that moral duty never lets you rest, like in Peter Singer's drowning child analogy. 

  The user specifically asks about two main points: whether Peter Parker ever gets a real "off switch" for his responsibilities, and whether it matters that he never chose his powers (volunteered vs drafted). They want two scenes analyzed in depth, noting where the movie resists or cheats, and what the film adds to the philosophical discussion beyond abstract arguments.

  Hmm, the user seems frustrated with how the movie wants to have it both ways—showing Peter happy when he quits but framing it as a failure. They're sharp to notice that contradiction. Their distinction between volunteered/drafted duties is insightful too—most people miss that nuance. 

  For the "off switch" question, the trash can scene is perfect. The movie visually screams "failure" with the suit in the dumpster, but the quiet scenes of Peter's normal life are filmed so tenderly. That tension is the heart of it. Aunt May's speech about heroism being a choice matters here—it implies he *could* walk away, but the movie undercuts that later. 

  The "drafted" angle needs the Uncle Ben flashback. "Great power" isn't a contract he signed; it's guilt weaponized. Yet the film never questions if that's fair. Interesting how Doc Ock mirrors Peter's struggle but gets redemption through suicide—Peter doesn't get that exit. 

  For resisting the reading: MJ choosing him at the end *seems* like a compromise, but really just gives Peter everything without sacrifice. Cheating! And the train scene's public support ignores how unsustainable that level of sacrifice is. 

  What the film adds? The visceral cost—seeing Peter's exhausted face hits harder than Singer's thought experiment. Philosophy abstracts pain; cinema makes you feel it. 

  Better avoid jargon. Save "deontology" for one punchy moment if needed. Focus on images: the dumpster, the clock, the train. Keep it grounded in scenes. User hates namedropping, so Bentham stays in the shadows. 

  User's smart—they’ll spot if I’m pretentious. Keep it clean like their voice: "the movie wants it both ways" is the thesis anchor.
