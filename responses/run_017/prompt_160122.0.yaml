  We are given a speaker defending the thesis that the probability of an indicative conditional is indexed to a question (a partition). The main example is a marble-urn case where the same conditional gets different probabilities under two different questions. The audience includes formal epistemologists (Adams's thesis as default), Kratzer-style semanticists, and a philosopher of language who sees context-sensitivity.

  The speaker wants a Q&A prep sheet with:
  - Objections in the order they are likely to come, in the audience's vocabulary.
  - Each objection has a two-minute spoken reply and a note on where the reply is soft.
  - Concede something upfront to avoid looking defensive.
  - Include the one objection the speaker hopes nobody asks (we have to guess which one).
  - Mark confidence in each reply (scale: high/medium/low) and at the end say which reply is the least confident (to rehearse twice).

  Structure:
  1. Start with a concession upfront.
