answer: |-
  ### Structured Activity: "The Divergence Dilemma"  
  **Goal:** Make students experience "contrast drift," "retrospective outcome-picking," and the "twin-track assumption" through gameplay without upfront lecturing. The activity uses anonymized factor cards, tokens (e.g., poker chips), and group competition to create stakes.  

  ---

  ### **Materials & Setup**  
  - **Factor Cards (20 total)**: Pre-printed with a factor on one side and its true status on the back (e.g., "B" Britain only, "C" China only, "S" Shared, "N" Neither). Use non-controversial, simplified factors (see list below).  
  - **Tokens**: 50+ tokens (e.g., poker chips) for betting/scoring.  
  - **Whiteboard**: Track group scores and bets.  
  - **Timer**: For strict timekeeping.  

  **Factor Card List** (Designed to avoid contested claims; statuses based on consensus):  
  1. Cheap coal near textile districts → **B**  
  2. Large internal market with low tariffs → **S**  
  3. High wages relative to energy costs → **B**  
  4. Access to captive overseas markets → **B**  
  5. State borrowing cheaply against future taxes → **S**  
  6. Widespread household production for markets → **S**  
  7. High-yield agriculture supporting dense population → **S**  
  8. Merchant diaspora with credit networks → **S**  
  9. Patent laws protecting inventions → **B**  
  10. Centralized bureaucracy with competitive exams → **C**  
  11. Navigable rivers for bulk transport → **S**  
  12. Colonies providing raw materials → **B**  
  13. Labor-intensive rice cultivation → **C**  
  14. Urban guilds restricting production → **S**  
  15. Silver inflows from foreign trade → **S**  
  16. Naval power protecting shipping lanes → **B**  
  17. State granaries stabilizing food prices → **C**  
  18. Enlightenment-era scientific societies → **B**  
  19. Confucian emphasis on agrarian stability → **C**  
  20. Parliamentary constraints on sovereign → **B**  

  *(Note: "Shared" factors dominate (10/20) to ensure contrast drift is common. Statuses avoid contested claims (e.g., no living standards comparisons).)*  

  ---

  ### **Rules & Payoff Scheme**  
  - **Groups**: 4 teams of ~4-5 students. Each starts with 5 tokens.  
  - **Scoring**:  
    - **+1 token** per "Britain only" factor used correctly.  
    - **-1 token** per "Shared" factor used without linkage.  
    - **+1 token** per successful "linkage challenge" (flips a card to "Shared").  
    - **Betting payouts**: Winning 1750 bets double tokens (see Phase 1).  
  - **Objective**: Build the highest-scoring argument for "Why Britain?" while navigating traps.  

  ---

  ### **90-Minute Timeline**  

  #### **Phase 1: The 1750 Bet (0-10 min)**  
  - **Facilitator Instructions (2 min)**:  
    *"Imagine it’s 1750. Industry hasn’t happened yet. Based on what you know, which region—Britain or China—would you bet on to industrialize first? Write your bet (0-5 tokens) and one reason. You’ll get double tokens if you pick the ‘winner.’"*  
    - **Do NOT mention** the actual outcome or use terms like "industrial revolution."  
  - **Group Work (3 min)**: Groups bet tokens and note one reason (e.g., "China’s larger population").  
  - **Setup (5 min)**: Collect bets, record on whiteboard. Distribute factor cards (all groups see all 20 cards).  

  > **Why this works**: Forces "retrospective outcome-picking." Students anchor on the real outcome, revealing how hindsight biases explanations.  

  #### **Phase 2: Argument Building (10-30 min)**  
  - **Facilitator Instructions (3 min)**:  
    *"Build a two-sentence explanation for ‘Why Britain and not China?’ using 3-5 factor cards. For each card, predict: is this factor SHARED or BRITAIN ONLY? Pre-register your predictions. Then, for any card, you can add a ‘linkage’—a way Britain and China interacted (e.g., trade, war, ideas). If you link, explain briefly."*  
    - **Emphasize**: "Your goal is to maximize tokens. Shared factors cost you tokens, but linkages can save you."  
  - **Group Work (17 min)**:  
    - Groups select cards, write predictions, and optional linkages (e.g., "Silver inflows (Card 15): Linked via Spanish silver trade").  
    - Submit: (1) Two-sentence argument, (2) Cards used, (3) Predictions, (4) Linkages.  

  > **Why this works**: "Contrast drift" emerges when groups use Shared factors. Linkages tackle the "twin-track assumption." Pre-registration creates accountability.  

  #### **Phase 3: Reveal & Linkage Challenge (30-55 min)**  
  - **Step 1: Argument Presentations (15 min)**:  
    - Each group reads their argument.  
    - **Facilitator reveals card statuses one by one**. For each card:  
      - Britain only? +1 token if used.  
      - Shared? -1 token if no linkage; 0 tokens if linked.  
      - (Ignore China-only/Neither cards; groups rarely use them.)  
    - **Record scores** on whiteboard.  
  - **Step 2: Linkage Challenge (10 min)**:  
    - Groups challenge any card’s status (even unused ones) by proposing a linkage (e.g., "Coal (Card 1): Could China have adopted British mining tech via Jesuit transfers?").  
    - **Facilitator approves** if plausible (no historical debate; accept any coherent link). Successful challenge flips card to "Shared" and earns +1 token.  

  > **Why this works**: Linkages force recognition of causal coupling ("twin-track assumption"). Shared factors penalize "contrast drift."  

  #### **Phase 4: Outcome Redefinition (55-75 min)**  
  - **Facilitator Instructions (5 min)**:  
    *"What if ‘industrialization’ meant ‘fastest catch-up growth’ (e.g., Germany 1870s) or ‘first sustained output-per-head growth’? Pick one factor from your argument. How would its importance change for this new outcome?"*  
  - **Group Work (10 min)**: Groups discuss and note a 1-sentence response (e.g., "High wages (Card 3) mattered less for catch-up than patent laws (Card 9)").  
  - **Brief Share (5 min)**: One insight per group.  

  > **Why this works**: Highlights "retrospective outcome-picking" by showing how cause relevance shifts with outcome definitions.  

  #### **Phase 5: Debrief (75-90 min)**  
  - **Facilitator Script**:  
    1. **Map Moments to Concepts (5 min)**:  
       - *"Remember your 1750 bets? How many bet on China? Why? This is ‘retrospective outcome-picking’—we explain why something happened because it happened."*  
       - *"When you lost tokens for Shared factors (e.g., Card 7: high-yield agriculture), that’s ‘contrast drift.’ Factors present in both get miscast as causes of difference."*  
       - *"Linkages (e.g., Card 15: silver trade) exposed the ‘twin-track assumption.’ Britain and China weren’t isolated labs; they influenced each other."*  
    2. **What Survives? (5 min)**:  
       - *"The question isn’t meaningless—but it needs three fixes:*  
         - Define the outcome rigorously (not just ‘industrialization’).  
         - Account for shared factors (ask: ‘What was truly different?’).  
         - Model interdependence (e.g., ‘How did global flows affect both?’)."*  
    3. **Open Discussion (5 min)**: *"Which fix is hardest? Why?"*  

  ---

  ### **Predicted Problems & Mitigations**  
  1. **History Expert Relitigates Facts**:  
     - Mitigation: Pre-emptively say, *"Cards simplify consensus; we’re focusing on argument structure, not facts."* If challenged, respond: *"Note that for next time—let’s proceed to see the conceptual point."*  

  2. **Competitive Trivia Over Concept**:  
     - Mitigation: In debrief, stress: *"Tokens were a tool. The real win is spotting these traps in your next essay."*  

  3. **Linkage Challenge Stalls**:  
     - Mitigation: Facilitator approves linkages quickly (e.g., "Plausible! +1 token") to avoid debate.  

  4. **Time Overrun**:  
     - Mitigation: Use a visible timer. Skip group shares if behind (focus on debrief).  

  ---

  ### **What the Activity Can’t Do**  
  - **Reproduce Contingency vs. Structure Debate**: The activity avoids this by focusing on framing flaws. Students might still surface it, but debrief redirects to the three traps.  
  - **Resolve Historical Contests**: You’ll need to clarify in debrief: *"We used non-controversial factors to isolate logic. Real history is messier—but these traps still apply."*  
  - **Explain How to Fix the Question**: The debrief outlines fixes, but students may need examples. Supply this: *"E.g., instead of ‘Why Britain?’, ask ‘Why did Britain’s specific differences (like coal + colonies) interact with global flows to trigger growth?’"*  

  --- 

  This design forces students to confront the three problems experientially: losing tokens for "Shared" factors induces frustration with contrast drift, linkages make non-independence tangible, and redefining outcomes reveals hindsight bias. The debrief then converts frustration into conceptual clarity, leaving students equipped to critique—not dismiss—the question.
