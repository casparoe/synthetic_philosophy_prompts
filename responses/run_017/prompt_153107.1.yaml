answer: |-
  ## Six Positions at the Table
  *(Register, Line-Length, Distance, Temporal Scale, Image-Field, Agency)*

  **I. (Base)**
  Sunlight warms the empty table where I sit.
  Its plain wood holds a bowl of speckled pears.
  No sound except the clock's dry heartbeat now.
  I trace a scratch that curves across the grain.
  Outside, the maple sheds a single leaf.
  This is the stillest hour I have known.

  **II. (Register: Formal)**
  O table, polished plane on which the light
  Doth linger, bearing fruit of russet hue!
  Hark, only time’s dull metronome in sight
  Disturbs the peace. My fingertip pursues
  A furrow wrought by chance. Beyond the pane,
  The maple yields one token to the dew.

  **III. (Line-Length: Fragmented)**
  Sun warms the empty table. Sitting. Still.
  Plain wood. A bowl. Speckled pears, heavy, round.
  Clock’s dry beat. Only sound. Tracing now. Skill?
  A scratch. Curved grain. Outside. Maple. Ground
  Receives one leaf. Falling. Known. This hour’s crown
  Is stillness. Deep. Unbroken. Holding fast.

  **IV. (Distance: Far)**
  From the doorway, the table seems a raft
  Adrift on morning light. The pears are stones
  Grey on its shore. The scratch, a faded craft
  Too distant for my eyes. The clock intones
  A muffled warning. Through the window glass,
  The maple leaf descends, a silent pass.

  **V. (Temporal Scale: Memory) & (Image-Field: Floral)**
  Sunlight *had* warmed the table. Pears like buds
  Unfurling scent. That scratch? A vine I drew
  In boredom’s bloom. The clock’s old pulse, a thud
  Of summers past. The falling leaf I knew
  Would drift forever. Stillness? Just a root
  That held me then, while waiting for the fruit.

  **VI. (Agency: Passive)**
  The table’s warmed by sunlight. Pears are held.
  The scratch is traced by me. The clock’s beat sounds.
  The grain is crossed by lines that time compelled.
  The leaf is shed. The hour’s stillness grounds
  Itself in absence. Nothing here is done.
  The known world settles where the light has won.

  **Envoi (Beyond the Knobs)**
  This ring of water, ghost of a cold glass
  Left sweating decades back—this deeper stain
  Like a dark planet in the grain’s tight mass—
  This nick the paring knife left in the plain
  Wood skin—aren’t they the table’s truer voice?
  Not placed, not turned, but offered without choice?
  Did the wood cry out, or the hand rejoice?
