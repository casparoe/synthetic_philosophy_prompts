  Can you write the thing that settles it: a mock historical document, the Petition and Declaration of the Letters of the Alphabet, around 550 words, in a solemn eighteenth-century grievance-list voice, where the letters formally object to being conscripted as a content-free testbed. A should be smug about being the origin with nothing before it, Z furious about being asked to wrap around, the middle letters bitter about being interchangeable, and the vowels should point out that nobody ever bothers typing them. Keep it deadpan, no winking, and let the jokes come from the actual machinery — successor vs predecessor, grouping, length, wrap-around, graded typicality — so someone who actually works on this stuff would grudgingly admit its fair and someone who's never heard of it can still follow along. Don't ever let it flat out say "this domain isn't content-free"; that has to come through in the complaints.
