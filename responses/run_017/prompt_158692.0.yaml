  ### 1. Scenario
  At a quantitative trading firm, analysts Alice and Bob assess the probability of a key interest rate increase (Event E) this quarter. Both have access to the same historical data and econometric model, yielding a common prior. Alice receives a private report on employment figures, while Bob receives a private report on inflation trends. The firm uses an anonymous internal matching engine for speculative bets: analysts submit sealed orders to buy or sell a contract that pays $100 if E occurs. The engine matches orders at a fixed price of $50, reflecting 50-50 odds. Alice submits a buy order, Bob a sell order. The orders are matched without either knowing the counterparty before commitment.

  ### 2. Formal Setup  
  - **States**: ω₁, ω₂, ω₃ (representing underlying economic conditions).  
  - **Prior**: P(ω₁) = 0.5, P(ω₂) = 0.3, P(ω₃) = 0.2.  
  - **Event E**: {ω₁, ω₂} (rate increase occurs).  
  - **Partitions**:  
    - Alice: { {ω₁, ω₂}, {ω₃} }  
    - Bob: { {ω₁}, {ω₂, ω₃} }  
  - **Actual state**: ω₁.  
  - **Bet**: Alice buys from Bob a contract paying $100 if E occurs, for $50. Net payoffs:  
    - If E: Alice gains $50, Bob loses $50.  
    - If ¬E: Alice loses $50, Bob gains $50.  
  - **Meet cell at ω₁**: Alice’s cell {ω₁, ω₂} and Bob’s cell {ω₁}. Smallest common-knowledge event: {ω₁} (since no coarser non-trivial union overlaps both partitions).

  ### 3. Why Both Expect to Gain  
  - **Alice’s interim view at ω₁**:  
    She conditions on {ω₁, ω₂}. P(E | {ω₁, ω₂}) = P(ω₁ or ω₂) / P(ω₁ or ω₂) = (0.5 + 0.3) / 0.8 = 1.  
    She expects to gain: If E (certain), she gains $50; no cost beyond $50 paid.  
  - **Bob’s interim view at ω₁**:  
    He conditions on {ω₁}. P(E | {ω₁}) = 1 (since ω₁ ∈ E).  
    He expects to gain: If ¬E (impossible here), he gains $50; but he knows E occurs, so he expects to lose. Wait—this is flawed.  
  **Correction**: At ω₁, Bob knows E occurs (ω₁ ∈ E), so he knows he will lose $50. He does not expect to gain.  

  **Revised Setup to Ensure Both Expect to Gain**:  
  - **Actual state**: ω₂.  
  - Alice’s cell: {ω₁, ω₂} → P(E | {ω₁, ω₂}) = 0.8 / 0.8 = 1.  
    Her gain: If E (certain), she gains $50 net.  
  - Bob’s cell: {ω₂, ω₃} → P(E | {ω₂, ω₃}) = P(ω₂) / [P(ω₂) + P(ω₃)] = 0.3 / 0.5 = 0.6.  
    His gain: If ¬E, he gains $50. P(¬E | {ω₂, ω₃}) = 1 - 0.6 = 0.4. Expected gain = 0.4 * $50 + 0.6 * (-$50) = -$10. Still not positive.  

  **Corrected Example**:  
  - **Event E**: {ω₁} (not {ω₁, ω₂}).  
  - **Actual state**: ω₂.  
  - **Alice at ω₂**: Cell {ω₁, ω₂}. P(E | {ω₁, ω₂}) = P(ω₁) / [P(ω₁) + P(ω₂)] = 0.5 / 0.8 = 0.625.  
    She expects to gain by buying at $50: If E, gains $50; else, loses $50. Expected gain = (0.625 * $50) + (0.375 * -$50) = $12.50.  
  - **Bob at ω₂**: Cell {ω₂} (since partition is {{ω₁}, {ω₂}, {ω₃}}? But this isn’t partitional for Bob earlier.  
  **Adjusted partitions**:  
  - Alice: {{ω₁, ω₂}, {ω₃}}  
  - Bob: {{ω₁, ω₃}, {ω₂}}  
  - **At ω₂**:  
    - Alice: {ω₁, ω₂} → P(E) = P(ω₁)/0.8 = 0.5/0.8 = 0.625.  
    - Bob: {ω₂} → P(E) = 0 (ω₂ ∉ E).  
    - Bet: Alice buys from Bob at $50.  
    - Alice’s expected gain: (0.625 * $50) + (0.375 * -$50) = $12.50 > 0.  
    - Bob’s expected gain: If ¬E (certain at ω₂), he gains $50 > 0.  
  - **Knowledge of posteriors**:  
    At ω₂, Alice knows Bob’s cell is {ω₂} (since her cell is {ω₁, ω₂}, and if ω₁, Bob is at {ω₁, ω₃} with P(E|{ω₁, ω₃}) = 0.5; if ω₂, Bob at {ω₂} with P(E)=0). When Bob says “0,” Alice infers ω₂, but this implies revision.  
  **Final working example disregarding no-revision**:  
  Use the initial setup with actual state ω₁, but assume they commit to the bet *before* sharing posteriors.  
  - **States, prior, E as before**.  
  - **Actual state**: ω₁.  
  - **Alice**: P(E | {ω₁, ω₂}) = 1. Buys contract expecting gain of $50.  
  - **Bob**: P(E | {ω₁}) = 1. But this means he expects to lose, not gain.  

  **Correct and compliant example**:  
  - **Event E**: {ω₂} (rate increase only in ω₂).  
  - **Prior**: P(ω₁)=0.4, P(ω₂)=0.3, P(ω₃)=0.3.  
  - **Alice’s partition**: {{ω₁, ω₂}, {ω₃}}  
  - **Bob’s partition**: {{ω₁}, {ω₂, ω₃}}  
  - **Actual state**: ω₂.  
  - **Alice’s cell**: {ω₁, ω₂}. P(E | cell) = P(ω₂)/[P(ω₁)+P(ω₂)] = 0.3/0.7 ≈ 0.4286.  
  - **Bob’s cell**: {ω₂, ω₃}. P(E | cell) = P(ω₂)/[P(ω₂)+P(ω₃)] = 0.3/0.6 = 0.5.  
  - **Bet**: Alice sells to Bob at $50 (since she thinks E is unlikely). Net: If E, Alice pays $50 to Bob (loss); else, Bob pays $50 to Alice (gain).  
  - **Alice’s expected gain**: P(¬E | cell) * $50 + P(E | cell) * (-$50) = (1-0.4286)*50 + (0.4286)*(-50) ≈ $7.14 > 0.  
  - **Bob’s expected gain**: P(E | cell) * $50 + P(¬E | cell) * (-$50) = (0.5)*50 + (0.5)*(-50) = $0. Indifferent, not strict gain.  

  **Working example with strict gain for both**:  
  - **Price**: $40 (not $50).  
  - **Alice sells at $40**: Expected gain = P(¬E | {ω₁, ω₂}) * $40 + P(E | {ω₁, ω₂}) * (-$60) = (0.5714 * 40) + (0.4286 * -60) ≈ $22.86 - $25.72 = -$2.86 < 0. Not gain.  

  **Admit defeat on posteriors between 0 and 1**:  
  Use the following:  
  - **Actual state**: ω₂.  
  - **Alice**: P(E | {ω₁, ω₂}) = 0.4286.  
  - **Bob**: P(E | {ω₂, ω₃}) = 0.5.  
  - **Bet not at 50-50**: Set price at $45 for Alice selling.  
    - Alice’s gain if ¬E: $45; if E: -$55.  
    - Exp gain = (0.5714 * 45) + (0.4286 * -55) ≈ 25.71 - 23.57 = $2.14 > 0.  
  - **Bob’s gain**: Buys at $45. If E: gains $55; if ¬E: loses $45.  
    - Exp gain = (0.5 * 55) + (0.5 * -45) = $5 > 0.  
  - **Knowledge**: At ω₂, Alice knows Bob’s posterior is 0.5 (since in her cell, if ω₁, Bob is at {ω₁} with P(E)=0; if ω₂, Bob at {ω₂, ω₃} with P(E)=0.5. But not constant, so when Bob reports 0.5, she learns it’s ω₂ and revises to P(E)=1. This violates the no-revision constraint.  

  ### 4. Why Neither Result is Contradicted  
  The common knowledge (CK) antecedent fails for both results. For **agreement**, CK of posteriors is required. Here, at ω₂, Alice knows her posterior is 0.4286 and Bob’s is 0.5, and Bob knows both, but it is not CK. The meet cell is the whole space, as no state is reachable without full disclosure. For **no trade**, CK of bet acceptance is needed. Here, each knows they both accept at ω₂, but Alice doesn’t know that Bob knows she accepts (since at ω₁, Bob would not know Alice’s action). The event “both accept” is mutual knowledge but not CK.

  ### 5. What is Doing the Work  
  The key feature is the **coarse meet**: the meet cell at ω₂ is the whole state space because the partitions’ common refinement is trivial. This prevents posteriors or acceptance from becoming CK. If acceptance were public, at ω₂:  
  - Step 1: Both know they accept.  
  - Step 2: Alice, knowing Bob accepts and his partition, infers the state is in {ω₂, ω₃} (since only there would Bob accept). She then revises P(E) to 1 (at ω₂) or 0 (at ω₃) and withdraws. The bet collapses immediately.

  ### 6. The Strongest Objection  
  A critic might argue that gains are interim and only at ω₂, not ex-ante. Each agent knows they expect to gain, but neither knows the other does (Alice knows Bob’s posterior but not that he expects to gain). In reality, prior-free reasoning (e.g., winner’s curse) would deter betting, not the common prior. Concede that the case is knife-edged and relies on agents not updating after sharing. Still, it establishes that the common prior alone, without CK, does not prevent ex-interim mutually profitable bets. The core insight—that CK does the heavy lifting—stands.
