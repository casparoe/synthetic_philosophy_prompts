answer: |-
  ### Position Sizing Procedure for Binary Outcome Events

  **Objective**: Maximize long-term growth (time-average growth) while respecting constraints: 1.5% cap without committee approval, 12-month evaluation horizon, and a 30% drawdown absorbing barrier. The panel's probability estimates are adjusted for miscalibration (overconfidence in tails). 

  **Inputs**: Contract price (\(P\)), panel probability (\(p_{\text{panel}}\)), time to resolution (\(T\)), existing book (correlation, current drawdown, bankroll \(V\), high-water mark \(H\)).

  **Output**: Stake (dollar amount \(s\)) or decision to seek committee approval.

  ---

  ### Step-by-Step Procedure

  #### Step 1: Adjust Probability for Miscalibration
  - **Purpose**: Correct for panel's overconfidence in tails (90% events occur ~60%; long-shots overestimated).
  - **Method**:
    - If \(p_{\text{panel}} \geq 0.5\):  
      \[
      p_{\text{adj}} = 0.5 + 0.25 \times (p_{\text{panel}} - 0.5)
      \]
      (Linear downward adjustment: e.g., 0.90 → 0.60).
    - If \(p_{\text{panel}} < 0.5\):  
      \[
      p_{\text{adj}} = 2 \times (p_{\text{panel}})^2
      \]
      (Quadratic downward adjustment: e.g., 0.10 → 0.02; reflects "long-shot enthusiasm is worthless").
  - **Sufficient answer**: \(p_{\text{adj}}\).
  - **Termination if**: Panel refuses to give a number → \(s = 0\) (no bet). If range given, use midpoint and adjust.
  - **Values judgment**: None (purely mechanical based on audited track record).

  #### Step 2: Compute Edge and Kelly Fraction
  - **Purpose**: Translate edge into a growth-optimal stake, assuming instantaneous resolution and no barrier.
  - **Method**:
    - **Edge**: \(\text{edge} = p_{\text{adj}} - P\).
    - **Kelly fraction**:  
      \[
      f_{\text{kelly}} = \frac{\text{edge}}{1 - P}
      \]
      (Derived from maximizing expected log wealth; assumes binary outcome: win \(1-P\) per $ staked, lose \(P\) per $ staked).
  - **Sufficient answer**: \(f_{\text{kelly}}\) and \(\text{edge}\).
  - **Termination if**: \(\text{edge} \leq 0\) → \(s = 0\) (no positive edge).
  - **Explanation to committee**: "We maximize long-run growth, not expected value. Betting more than \(f_{\text{kelly}}\) increases risk of drawdowns; betting less leaves growth on the table. Expected return is \(\frac{p_{\text{adj}} - P}{P}\), but growth requires compounding, which prioritizes survival."

  #### Step 3: Apply Barrier Constraint
  - **Purpose**: Cap stake to avoid breaching 30% drawdown barrier.
  - **Method**:
    - **Current drawdown**: \(d = \frac{H - V}{H}\) (if \(V < H\); else \(d = 0\)).
    - **Barrier cap**:  
      \[
      s_{\text{barrier}} = (\text{max}(0.30 - d, 0)) \times H
      \]
      (Worst-case loss on new bet must not push drawdown to 30%).
  - **Sufficient answer**: \(s_{\text{barrier}}\).
  - **Cap by mandate**: \(s_{\text{barrier}}\) is a hard constraint (absorbing barrier dominates growth optimization).
  - **Values judgment**: None (mandate rule).

  #### Step 4: Adjust for Correlation, Time, and Estimation Error
  - **Purpose**: Penalize for portfolio risk, resolution outside evaluation window, and panel uncertainty.
  - **Method**:
    - **Correlation** (analyst judgment):
      - Low (\(\rho \approx 0\)): \(\text{corr\_factor} = 1.0\).
      - Medium: \(\text{corr\_factor} = 0.5\).
      - High: \(\text{corr\_factor} = 0.0\) (avoid concentrated risk).
    - **Time to resolution**:
      - \(T \leq 12\) months: \(\text{time\_factor} = 1.0\).
      - \(T > 12\) months: \(\text{time\_factor} = 0.5\) (penalty for mark-to-market uncertainty in quarterly reviews).
    - **Adjusted fraction**:  
      \[
      f_{\text{adj}} = f_{\text{kelly}} \times \text{corr\_factor} \times \text{time\_factor}
      \]
    - **Dollar stake**: \(s_{\text{kelly}} = f_{\text{adj}} \times V\).
  - **Sufficient answer**: \(s_{\text{kelly}}\).
  - **Termination if**: \(\text{corr\_factor} = 0.0\) → \(s = 0\).
  - **Values judgment**: Analyst must categorize correlation (subjective). Committee must trust analyst’s judgment.

  #### Step 5: Final Stake and Committee Approval
  - **Purpose**: Respect 1.5% rule and output stake.
  - **Method**:
    - **Final stake**: \(s = \min(s_{\text{kelly}}, s_{\text{barrier}})\).
    - **Committee approval**: If \(s > 0.015 \times V\) → seek approval. Else, take \(s\).
  - **Sufficient answer**: \(s\) or "seek approval".
  - **Cap by mandate**: 1.5% rule requires approval; barrier cap is binding.
  - **Values judgment**: Committee decides if stake is justifiable in 2 sentences. Growth logic may be overridden by non-quantitative factors (e.g., reputational risk).

  ---

  ### Live Case Applications

  **Assumptions**:
  - Current bankroll \(V = \$9\)M, high-water mark \(H = \$9\)M (drawdown \(d = 0\)).
  - \(s_{\text{barrier}} = 0.30 \times 9\text{M} = \$2.7\)M.
  - Committee threshold: \(0.015 \times 9\text{M} = \$135,000\).

  #### Case 1: Binary Contract at $0.22
  - **Inputs**: \(P = 0.22\), \(p_{\text{panel}} = 0.35\), \(T = 6\) weeks, uncorrelated.
  - **Step 1**: \(p_{\text{adj}} = 2 \times (0.35)^2 = 0.245\).
  - **Step 2**: \(\text{edge} = 0.245 - 0.22 = 0.025\), \(f_{\text{kelly}} = \frac{0.025}{1-0.22} = 0.032\).
  - **Step 3**: \(s_{\text{barrier}} = \$2.7\)M.
  - **Step 4**: corr_factor = 1.0, time_factor = 1.0 → \(s_{\text{kelly}} = 0.032 \times 9\text{M} = \$288,000\).
  - **Step 5**: \(s = \min(288,000, 2,700,000) = \$288,000\).  
    Since \(288,000 > 135,000\) → **seek committee approval**.  
    *Committee explanation*: "Bet has +2.5% edge after calibration. Kelly suggests 3.2% of bankroll. Worst-case loss won’t breach barrier."

  #### Case 2: Merger Arb at $0.94
  - **Inputs**: \(P = 0.94\), \(p_{\text{panel}} = 0.97\), \(T < 12\) months, correlation: low.
  - **Step 1**: \(p_{\text{adj}} = 0.5 + 0.25 \times (0.97 - 0.5) = 0.6175\).
  - **Step 2**: \(\text{edge} = 0.6175 - 0.94 = -0.3225\) → **terminate, \(s = 0\)**.  
    *Why*: Negative edge after calibration (panel’s 97% is adjusted to 61.8%). Expected loss outweighs gain.

  #### Case 3: Long-Shot at $0.04
  - **Inputs**: \(P = 0.04\), \(p_{\text{panel}} = 0.09\), \(T < 12\) months, uncorrelated.
  - **Step 1**: \(p_{\text{adj}} = 2 \times (0.09)^2 = 0.0162\).
  - **Step 2**: \(\text{edge} = 0.0162 - 0.04 = -0.0238\) → **terminate, \(s = 0\)**.  
    *Why*: Negative edge after calibration. Unadjusted expected return (+5%) is illusory; panel overestimates long shots.

  ---

  ### What the Procedure Cannot Do
  1. **Non-Binary Outcomes**: The Kelly formula assumes binary payoffs. For continuous outcomes (e.g., merger arb with non-binary loss), use a generalized Kelly or full optimization (not feasible in 15 minutes).
  2. **Portfolio Optimization**: Correlated bets are crudely penalized (not jointly optimized). For complex books, use a risk model (outside scope).
  3. **Non-Money Resources (e.g., Analyst-Hours)**:
     - **Why it doesn’t transfer**: Growth logic assumes multiplicative returns and repeated bets. Analyst-hours are additive (not reinvested) and outcomes are non-monetary. Use cost-benefit analysis (expected value of research > hourly cost).
     - **Committee member’s claim**: Geometric logic only applies if resources scale multiplicatively (e.g., compounding returns on capital). Analyst projects are discrete and non-compounding.
