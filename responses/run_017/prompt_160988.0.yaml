prompt: |-
  So I'm stuck on something and I keep going back and forth, so I thought I'd just ask. I'm on the incident-review team at work — when something breaks we have to write up a root cause, and the rule my teammates keep repeating is one we jokingly call the mirror test: if your explanation would also have explained the opposite outcome, it isn't an explanation. "The deploy was rushed" fails, because a rushed deploy would equally have gone fine. I always treated that as just engineering hygiene, nothing philosophical.

  Then at thanksgiving my brother-in-law spent two hours on a theory about why the water testing in our town keeps coming back clean — the lab's contract, who sits on the council, the reporter who dropped the story. Every single thing that would normally count against the theory had an explanation for why it *looks* that way. My sister thinks he's lost it, I told him a theory that can absorb every counterexample isn't explaining anything, it's just storytelling, and then I realised that's exactly the mirror test and it's also kind of cheap, because good explanations absorb counterexamples constantly. Half of my job is deciding that a spike on the dashboard was a logging artifact; scientists throw out readings as instrument failure all the time. My roommate (also a data scientist, we argue about this constantly) says none of this is special, it's all just Bayes with a prior that likes simple hypotheses, and the "absorption" thing is just what happens when a hypothesis predicts a low likelihood for some data and you were right to trust the hypothesis. I half believe her, but the thing people say about inference to the best explanation — that it picks the loveliest explanation rather than the most probable one, and that loveliness is supposed to be a guide to truth — seems to be exactly what breaks here. Loveliness is precisely what a conspiracy theory has loads of. I also vaguely remember someone (van Fraassen? I might have the name wrong, and I don't want a literature review or any citations, just the argument) saying you can only ever infer the best of a bad lot, since you never know the true hypothesis is on your menu at all — and the mirror test feels like a different, sharper version of that worry, one that applies even when the true hypothesis *is* on the menu.

  So: write me an essay, under 900 words, on whether inference to the best explanation can survive the fact that a hypothesis can rack up explanatory points by explaining away the evidence against it. Put your verdict in the first sentence, literally the first one, and then defend it for the rest — weigh the strongest version of my roommate's Bayes-with-a-simplicity-prior response and the strongest version of the worry, tell me whether the mirror test (or something like it) should just be folded into what we mean by "best", and don't end on a shrug about how both sides have a point. If you think the good kind of absorption and my brother-in-law's kind come apart, say exactly where the line is.
reasoning: |-
  Okay, the user is grappling with the tension between inference to the best explanation (IBE) and the mirror test. They've encountered this in both their engineering work (root cause analysis) and personal life (brother-in-law's conspiracy theory). The core issue is whether a hypothesis can be considered a good explanation if it "explains away" counterevidence, which seems suspiciously flexible. 

  The user's roommate argues Bayes with simplicity priors resolves this, but the user is skeptical—especially since conspiracy theories often feel "lovely" (coherent, elegant) yet wrong. They also reference van Fraassen's "best of a bad lot" concern, seeing the mirror test as a sharper version. 

  First, I need to affirm their core insight: the mirror test is indeed a critical tool. But I shouldn't concede that IBE is broken. Instead, I'll argue that *proper* IBE already incorporates mirror-test thinking by demanding *discriminatory power*. The key is to show that "absorption" isn't inherently bad—it's only problematic when it stems from *ad hoc* adjustments that inflate complexity without new evidence. 

  The roommate's Bayesian view is strong: simplicity priors naturally penalize conspiracy theories because each "explaining away" adds hidden variables (more assumptions = lower prior probability). But I should emphasize that Bayes and IBE converge here—both value hypotheses that *positively predict* evidence rather than retrofitting it. 

  Where to draw the line? Good absorption (e.g., logging artifacts) *preserves* simplicity: the spike *is* anomalous, and the artifact hypothesis cleanly resolves it without new entities. Bad absorption (brother-in-law's lab conspiracy) *multiplies* complexity: each "cover-up" requires new conspirators, mechanisms, and coincidences. 

  Verdict: IBE survives, but only when "best" includes discriminatory power. The mirror test isn't an add-on—it's embedded in robust IBE via simplicity and predictive precision. The user's engineering intuition is spot-on: root cause isn't about storytelling, but pinpointing failure modes that *wouldn't* equally allow success.
answer: |-
  ## Yes, Inference to the Best Explanation survives the challenge, but only when "best" rigorously incorporates discriminatory power, precisely what the Mirror Test demands.

  Your instinct and the Mirror Test are correct: a hypothesis that "explains away" every counterexample by endlessly adapting its narrative, like your brother-in-law's conspiracy theory, is fundamentally flawed as an explanation. It lacks *discriminatory power*. It doesn't tell us why we observe *this specific outcome* rather than its opposite. "The rushed deploy caused the failure" fails the Mirror Test because the rush *could* have succeeded just as plausibly; it doesn't isolate the unique conditions leading to failure. Similarly, the conspiracy theory "explains" clean water tests *regardless* of the actual water quality – clean results are proof of cover-up, dirty results would be proof of contamination. It predicts nothing specific and explains everything, rendering it empirically vacuous.

  Your roommate's Bayesian view offers a powerful formalization of the strongest counter-argument. Bayes' Theorem updates belief in a hypothesis (H) given evidence (E) based on the likelihood P(E|H) and the prior probability P(H). A simplicity prior (often implemented via Minimum Description Length or penalizing free parameters) naturally favors hypotheses that don't multiply entities or assumptions unnecessarily. Crucially, *how* a hypothesis "absorbs" counterevidence determines its Bayesian standing:

  1.  **Good Absorption (Legitimate Auxiliary Hypothesis):** When you dismiss a dashboard spike as a logging artifact, you invoke a separate, independently motivated hypothesis about instrumentation error. This hypothesis might have its own prior based on past glitches and predicts *specific types* of anomalies (e.g., spikes coinciding with known log rotation times). The "absorption" works because the auxiliary hypothesis explains the *specific anomaly* without drastically altering the core hypothesis or inflating complexity *beyond justification*. Crucially, the core hypothesis *combined with the auxiliary* still makes specific predictions elsewhere. P(E_counter | H_core + Aux) might be low, but P(Aux) isn't arbitrarily low, and the update doesn't wreck P(H_core).
  2.  **Bad Absorption (Ad Hoc Maneuvering):** Your brother-in-law's theory doesn't add independently plausible auxiliary hypotheses. Each counter-factual observation (e.g., a critical news report, a whistleblower being ignored) is "explained" by inventing *new, specific elements* of the conspiracy (e.g., "that reporter was bribed," "the whistleblower is a disgruntled employee framed by the *real* conspirators"). This inflates the hypothesis's complexity *dramatically* with each new counterexample. Each new ad hoc element has an extremely low prior probability (P(Element) is tiny) because it requires specific, unobserved actions by hidden agents, multiplying improbabilities. The likelihood P(E_counter | H_conspiracy) might be *made* high by the ad hoc addition, but the overall posterior P(H_conspiracy) plummets because P(H_conspiracy) itself becomes vanishingly small as it absorbs more unlikely assumptions.

  **The Line:** Legitimate absorption **preserves or minimally impacts the hypothesis's core simplicity and predictive specificity** by invoking *independently motivated* auxiliary factors with non-negligible priors. Bad absorption **destroys simplicity and predictive power** by multiplying *arbitrary, unobserved entities and mechanisms* (like hidden conspirators and their specific, convenient actions) solely to rescue the hypothesis from falsification, collapsing its prior probability. The Mirror Test is the **operationalization of discriminatory power**. A hypothesis passing it *must* be able to specify conditions under which the opposite outcome would occur ("If the deploy *wasn't* rushed, it would have succeeded"; "If the water *was* contaminated, the lab results would show it *unless* X, Y, Z independent factors intervened"). It forces the hypothesis to make commitments.

  **Inference to the Best Explanation (IBE) survives, but only when "best" explicitly includes:**

  1.  **Discriminatory Power (Mirror Test):** The hypothesis must explain *why this happened, and not something else*. It must entail the observed outcome more strongly than its negation.
  2.  **Simplicity (Low Complexity):** Minimizing ad hoc additions and unmotivated entities (strongly penalized by Bayesian priors).
  3.  **Explanatory Scope/Depth:** Genuinely unifying diverse phenomena under a few principles.
  4.  **Predictive Novelty:** Suggesting *new* findings, not just accommodating existing ones.

  Loveliness *is* a heuristic for truth, but only when loveliness *includes* these virtues, **especially discriminatory power**. A conspiracy theory may feel "lovely" due to its internal coherence and narrative satisfaction, but it fails spectacularly on discriminatory power and simplicity. It’s *too* flexible. Genuinely lovely scientific explanations (e.g., general relativity explaining Mercury's orbit *and* predicting light bending) are powerful precisely because they are *constrained* – they rule out vast swathes of possible observations, making specific, testable predictions. The Mirror Test ensures that "best explanation" means the one that *best carves reality at its joints*, isolating the factors that make a difference, not the one that tells the most absorbing story. Your engineering practice gets it right: root cause analysis demands pinpointing the *fragile* component that broke, not just a generic risk factor. IBE, properly understood with the Mirror Test as a core component of "best," remains a vital tool, distinct from – but ultimately harmonious with – a well-calibrated Bayesian approach prioritizing simplicity and predictive precision.
