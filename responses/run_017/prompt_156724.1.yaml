prompt: |-
  I spent a little over thirty years as an experimental atmospheric chemist, most of it on aerosol-cloud interactions, where the honest summary of nearly every result I ever published was that the effect was real but the error bars were humiliating. Since retiring I have been auditing a graduate seminar in normative ethics, and I find I keep reverting to my old habits: when a discussion turns on some quantity nobody can measure, I want to know whether the uncertainty is the ordinary kind, where noise is roughly symmetric and cancels in expectation, or the nasty kind, where you know your own evidence-gathering is skewed in a direction you cannot identify. The seminar recently stalled on exactly this distinction while discussing consequentialist cluelessness, the worry that an act's long-run effects lie so far beyond our forecasting powers that expected-value reasoning over the long run is not merely noisy but unavailable. Several of us thought the standard reassurance, that long-run effects are high-variance but unbiased and therefore wash out so that one may simply act on near-term effects, handles only the first kind of uncertainty and silently assumes away the second. I would like a case that makes that gap visible.

  Please construct a decision problem of a single paragraph, set in an ordinary institutional or land-management context, with no science fiction, no existential-risk-scale payoffs and no exotic devices, containing two options, call them A and B, built to the following specifications. The near-term effects, which the agent can forecast with reasonable confidence, should slightly favor A. Both options must also have long-run effects that are large relative to the near-term ones, say one to three orders of magnitude larger, while remaining entirely mundane, and the mechanism that makes them large must be specified concretely as lock-in, path dependence, a durable standard, or a self-reproducing institution rather than merely stipulated. For A, the long-run effects should be merely high-variance: a spread the agent has decent grounds to treat as roughly symmetric around zero. For B, the long-run effects should be genuinely clueless in the strong sense: near-certain to be large in magnitude, but with a sign about which the agent has no well-founded credence, and, this is the part I care most about, the agent must know that their evidence about the sign is systematically skewed, because only successes get recorded or because the channels they can observe happen to be the flattering ones, so that their mild felt optimism that B is for the better carries no evidential weight and the long-run expectation of B is indeterminate rather than zero. The case must also not be a Pascal's mugging: the large magnitude has to come from near-certain amplification, not from a vanishing probability of an astronomical payoff. The point of all this is that the usual dissolution must fail, so it should not be possible to defuse the case by observing that long-run uncertainty is symmetric and cancels.

  Then do the check. Derive, from the credences you have built into the scenario rather than by announcement, three verdicts: first, that long-run expected-value maximization using the agent's unadjusted available credences favors B; second, that a window-restricted consequentialism counting only effects the agent can forecast favors A; and third, that a decision rule for indeterminate probabilities also favors A, though for a reason that still attends to the long run rather than simply discarding it, and here you should say which rule you are using and what the alternatives do or do not deliver. Finish by naming the single feature of the case that is doing the work, saying what happens to all three verdicts if that feature is removed and B's spread becomes merely symmetric, and explaining how a defender of the first verdict would argue that the case has been rigged.

  At the very end, as the last line of your reply with nothing after it, give the three verdicts in exactly this form: \answer{long-run EV: X; window-restricted: Y; imprecise-credence rule: Z}, where each of X, Y and Z is A, B, or indifferent.
reasoning: |-
  Okay, I need to tackle this complex request from an atmospheric chemist turned ethics auditor. They want a decision problem that highlights a specific gap in consequentialist reasoning about long-term uncertainties. Let me break down the requirements carefully.

  First, the scenario must:
  - Be set in ordinary institutional/land management (no sci-fi, no existential risks)
  - Have two options (A and B)
  - Near-term effects slightly favor A
  - Long-run effects 100-1000x larger than near-term
  - Amplification mechanism specified (lock-in, path dependence etc.)
  - For A: high-variance long-run effects (symmetric uncertainty)
  - For B: genuinely clueless long-run effects (systematic skew in evidence)
  - No Pascal's mugging (amplification not tiny probabilities)
  - Must defeat the "uncertainty cancels out" argument

  Then I need to derive three verdicts:
  1. Standard long-run EV favors B
  2. Window-restricted consequentialism favors A
  3. Imprecise-credence rule favors A (specifying the rule)

  Finally, identify the key feature and show how changing it affects outcomes.

  Hmm... land management... maybe a river restoration project? That could work. Let me sketch:

  Option A: Minor channel realignment (near-term benefit: reduces flood risk to nearby farms)
  Option B: Introduce beavers (near-term cost: some tree loss, but long-term potential)

  For amplification:
  - A's effects: temporary, variance from future weather patterns (symmetric)
  - B's effects: beaver colony establishes permanent wetland ecosystem (path dependence)

  Now for B's systematic skew:
  - Historical records only show successful introductions (failures aren't documented)
  - Observers only monitor pretty wetland outcomes, not degraded ones
  - Agent knows this selection bias exists

  Yes, this satisfies:
  - Near-term: A helps farmers immediately, B has costs
  - Long-term: Beaver wetlands can transform watershed (100x scale)
  - A's uncertainty: symmetric climate variation
  - B's uncertainty: fundamentally skewed evidence

  Verifications:
  1. Standard EV: Since agent feels mild (but biased) optimism about B, and magnitude is large, expected value favors B
  2. Window-restricted: Only sees A's near-term benefit
  3. Imprecise credence (using Levi's rule): Since B's sign is indeterminate, we default to near-term effects favoring A

  Key feature: The systematic skew in evidence for B. If removed, all verdicts change.

  Defense against "rigged" claim: The agent's optimism is explicitly framed as unfounded due to evidence gaps - this is realistic in policy contexts where only successes are reported.

  Final answer format must be exact: \answer{long-run EV: B; window-restricted: A; imprecise-credence rule: A}
answer: |-
  ### Decision Problem: River Management Strategy

  A regional water board must choose between two approaches to manage a degraded river corridor. Option A involves minor channel realignment and native shrub planting, costing $200,000. Near-term models (with ±10% error) show A will reduce localized flood risk for five riverside farms over 10 years, saving an expected $250,000 in avoided crop losses. Option B introduces a colony of beavers (costing $300,000 for translocation and initial monitoring), which is predicted to cause modest near-term tree loss ($50,000 in timber value) but may trigger self-sustaining wetland restoration. If the beavers establish successfully (60% chance based on habitat studies), their dams will reshape the watershed over 50–200 years through path dependence: dam construction alters water tables, which promotes wetland expansion, which attracts more beavers and other ecosystem engineers, locking in either a resilient flood-mitigating mosaic (benefiting regional agriculture by ~$20 million) or a monoculture of invasive reed canary grass (costing ~$18 million in irrigation damage and biodiversity loss). Crucially, while the agent’s ecological models for A’s long-term effects (e.g., shrub survival impacting bank stability) have high variance (±$15 million) due to symmetric climate uncertainty, Option B’s long-term sign is clueless. All published case studies of beaver introductions report successes (positive outcomes), but failures—where dams collapsed or invasive species dominated—are underrepresented because only "successful" projects receive continued funding for monitoring and publication. The agent knows this skews their mild optimism toward B; they cannot assign reliable probabilities to the long-run outcomes, as the missing data hides whether failures arise from unobserved site conditions (e.g., hidden soil instability) or random bad luck.

  ---

  ### Derivation of Verdicts
  1. **Long-run expected-value (EV) maximization favors B**:  
     The agent’s *available* credences, distorted by publication bias, assign a 70% subjective probability to B’s positive outcome ($20M gain) and 30% to the negative ($18M loss), ignoring the unquantifiable risk of unreported failures. Thus, long-run EV(B) = (0.7 × 20M) + (0.3 × -18M) - 0.3M (net near-term cost) ≈ $8.9M. For A, long-run EV = expected near-term gain ($0.25M) + symmetric long-run expectation ($0, as variance cancels out) = $0.25M. Hence, unadjusted EV favors B.

  2. **Window-restricted consequentialism favors A**:  
     This approach only considers effects the agent can forecast confidently (near-term, 10-year impacts). Here, A yields a net gain of $250,000 - $200,000 = $50,000, while B incurs a net cost of $300,000 + $50,000 = $350,000 (tree loss and translocation costs). Thus, A is strictly preferred.

  3. **Imprecise-credence decision rule favors A**:  
     Using **Levi’s E-admissibility rule** (which rejects options with indeterminate expectations when a determinate alternative exists), the agent treats B’s long-run effects as having no well-founded expectation. The systematic skew in evidence (only successes recorded) means the agent’s mild optimism is epistemically worthless; they cannot construct a reliable credal set for the sign of B’s outcome. Since A has a determinate, near-zero long-run expectation (symmetric variance), and B’s long-run expectation is indeterminate, Levi’s rule defaults to comparing only the *determinate* components—here, the near-term effects. As above, near-term effects favor A. (Alternative rules like maximin would also favor A due to B’s catastrophic downside risk, but Levi’s rule explicitly addresses indeterminacy without discarding long-run considerations, unlike window-restricted approaches.)

  ---

  ### Key Feature and Counterfactual
  - **Feature doing the work**: Systematic skew in evidence for B (failures are unrecorded, making optimism unfounded).  
  - **Effect of removal**: If B’s evidence were symmetric (e.g., failures are fully documented, showing 50% success), all three verdicts change. B’s long-run EV becomes ≈ $1M [(0.5 × 20M) + (0.5 × -18M) - 0.3M], still favoring B over A ($0.25M). Window-restricted still favors A. Levi’s rule now accepts B’s determinate expectation, favoring B.  
  - **Defense of rigging claim**: A defender of long-run EV would argue the case artificially inflates B’s apparent risk by positing *unknowable* skew. They might contend that rational agents should treat unsampled failures as symmetrically uncertain (e.g., applying the principle of indifference), rendering B’s expectation $0 and preserving the "cancels out" dissolution. However, the case precludes this by building in the agent’s *knowledge* of selection bias—grounded in real-world institutional incentives—which makes indifference unjustifiable.

  \answer{long-run EV: B; window-restricted: A; imprecise-credence rule: A}
