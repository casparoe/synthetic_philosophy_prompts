prompt: |-
  I'm an undergraduate philosophy major in a seminar on philosophical method, and we have just finished a unit on thought experiments: what they can establish, how they persuade, and when the persuasion is illegitimate. Our seminar uses the phrase intuition pump for the cases that move us by something other than the argument they are supposed to contain. I have tried to sort the cases we read into the ones I think we are entitled to lean on and the ones I think are rigged, and my verdicts do not line up with any rule I can state. I would like help finding the rule, or being told which of my verdicts to abandon.

  My verdicts, on the cases as I have them:

  1. The Gettier-style case, in which someone has a justified true belief that is true only by luck, either from a stopped clock or from a landscape of convincing barn facades. Legitimate. The conditions were specified independently of the case, the case satisfies them, and the mismatch tells us something about the analysis being tested.

  2. The runaway trolley that can be diverted onto a sidetrack where it will kill one instead of five. Legitimate. I trust the intuition as data, and I do not think the trolley imagery is contributing anything the principle under test fails to mention.

  3. The surgeon who cuts up a healthy visitor in order to distribute his organs to five dying patients. Not legitimate, or at least very heavily over-credited. I think the verdict people give is driven by the bodily violation framing rather than by the numbers.

  4. The case in which you wake up wired to a famous violinist who will die if you unplug. Also not legitimate for me, and for what I take to be the same reason. But when I rewrote the case for a friend in the driest contractual language I could manage, with no kidnapping, no tubes and no hospital gown, my friend's verdict flipped to the one I actually hold on reflection, and I became confident again. So I trust the dry version and distrust the famous version, which are the same case with the imagery either present or removed.

  5. Mary's room, in which a scientist who has never seen color learns every physical fact about color vision and then sees red for the first time. Legitimate. I do not accept the conclusion most people draw from it, but I think the case is fair and that the intuition it produces is real and needs answering.

  6. The zombie case, in which a world physically identical to ours contains no consciousness. Not legitimate. I do not think my sense that such a world is conceivable is evidence about anything, and I do not think the case can be made to support the weight put on it.

  7. Twin Earth, in which the clear drinkable stuff in the lakes of a distant planet has a different chemical composition from water. Legitimate. I think the intuition here is anchored by real cases of the sort that actually settle how a term attaches to a kind.

  8. Swampman, the molecule-for-molecule duplicate of a person produced by chance in a swamp. Not legitimate. I have no stable intuition about it at all, and it seems to me impossible in a way that matters, not merely impossible in a way that can be ignored.

  9. The experience machine, in which you can be plugged permanently into a simulation of a wonderful life. Not legitimate. I think the reluctance to plug in is status quo bias plus a framing that makes the alternative sound narcotic, and I do not think the case can be filled in far enough to remove that.

  10. A case I invented: over ten years, one detail of your autobiography is rewritten each night while you sleep, until your memories match those of another person. Are you the same person at the end? I distrust every answer here, including my own, and I think the reason is that the case is badly under-described rather than that the question is deep.

  11. Another case I invented: the same structure as the trolley case, except that the five are on a stretch of track that curves out of view and you learn of them from an instrument readout rather than seeing them. My verdict weakens noticeably but does not vanish. I cannot tell whether this shows the original verdict was contaminated by the visual framing or merely that my confidence was always partly visual.

  The tentative principle I have been working with has three clauses. A thought experiment is evidentially usable only if, first, it survives de-pumping: strip the imagery, the proper names and the narrative, state the case in the thinnest possible prose, and the verdict should be unchanged. Second, it satisfies an anchor requirement: the intuition it elicits must have a nearby real case that we have independent reason to trust. Third, it satisfies an isolation requirement: the case must vary only what the theory under test says makes no difference.

  These clauses do not agree with each other on my own list. De-pumping is what saves my verdict on case 3, but Mary's room appears to have no content at all once the qualitative image is stripped away, and yet I counted it as legitimate; maybe the anchor clause, rather than de-pumping, is what separates case 5 from case 6, since sight restoration and sensory substitution are real while zombie worlds are not. And I do not know what any of the three clauses says about cases 10 and 11.

  What I would like, in American English, is the following: a principle, or at most two rival principles, stated precisely enough that I could apply it to a new case without asking you; for each clause, the case of mine that motivates it and the case that causes it trouble; an honest account of which of my eleven verdicts the principle cannot recover and which of them you think I should overturn; and verdicts on three cases I have not listed. The first is a de-pumped version of the zombie case, if one can be written. The second is the common practice of reaching a hard verdict by walking someone through a long sequence of cases that each differ from the last only slightly, so that the end of the sequence looks like the beginning. The third is any thought experiment of your choosing whose central figure is very unlike a human being, such as a hive mind or a system trained on text. Please also tell me what would count as a genuine check on the principle rather than another intuition about it. I do not need the literature surveyed or sources cited; I need the principle and what it costs me.
reasoning: |-
  Hmm, this is a fascinating request from an undergraduate philosophy student who's deeply engaged with thought experiments and intuition pumps. They've clearly done serious work analyzing 11 different cases (including two of their own inventions), and they're struggling to find a consistent principle to distinguish legitimate from rigged examples. 

  The core tension in their analysis seems to be between three proposed criteria: de-pumping (removing emotional/narrative elements), anchoring (connection to real-world cases), and isolation (only varying relevant factors). But these conflict in their application - for instance, Mary's Room passes despite failing de-pumping because it meets the anchor requirement through real cases of sight restoration.

  I notice their judgments reveal interesting patterns: They trust cases that expose conceptual mismatches (Gettier, Twin Earth) but distrust those relying on bodily violation (organ harvest) or impossibility (Swampman). Their self-awareness about the trolley variation weakening when made abstract is particularly insightful.

  What they're really asking for is a decision procedure - but philosophy might not offer that. Instead, we could frame this as managing cognitive pollution. The key insight might be that good thought experiments don't "prove" but rather reveal tensions in our conceptual frameworks, while polluted ones exploit psychological biases.

  For their specific cases: The zombie thought experiment fails because consciousness isn't something we can conceive as absent while holding all physical facts constant - that's like trying to conceive of water that isn't H2O while keeping all chemical properties identical. Their invented memory-rewriting case fails because personal identity is a cluster concept that resists such artificial isolation.

  The sequencing method they mention (sorites arguments) is dangerous because it exploits perceptual thresholds - our inability to detect minute changes doesn't mean there's no difference between endpoints. And for non-human entities, we should be especially cautious since our intuitions aren't calibrated for them.

  Ultimately, the best check isn't more intuitions but whether a thought experiment generates productive philosophical work - does it lead to conceptual refinement or just circular debates? This pragmatic criterion might help explain why Gettier cases spawned decades of epistemology while Swampman remains niche.
answer: |-
  Here's a principled framework for evaluating thought experiments, grounded in your analysis but resolving your tensions. The core principle is **Cognitive Pollution Control**: A thought experiment provides legitimate evidence only if its intuition reliably tracks *conceptual relationships* rather than *extraneous cognitive biases*. This is operationalized through three filters:

  1.  **Depuration Filter**: When stripped of all non-essential narrative, emotional, or sensory details ("de-pumped"), the core intuition must persist unchanged *for those who grasp the relevant concepts*. This targets framing effects.
      *   *Motivated by*: Your organ donor (Case 3) and violinist (Case 4) verdicts. The "bodily violation" framing polluted the core utilitarian calculation.
      *   *Trouble for*: Mary's Room (Case 5). De-pumping ("Agent with complete physical knowledge of vision lacks knowledge of a specific visual quale") arguably *does* preserve the core intuition *for those who find it compelling*. The "qualia image" *is* the essential content being tested, not extraneous fluff. This filter *can* accommodate it.
      *   *Fails*: Original Violinist (Case 4 - famous version), Organ Donor (Case 3), Experience Machine (Case 9 - due to "narcotic" framing/status quo bias), Swampman (Case 8 - relies on bizarre narrative conceit).

  2.  **Anchoring Filter**: The intuition must be grounded in, or demonstrably analogous to, intuitions we confidently hold in *non-hypothetical, conceptually clear cases* relevant to the domain. This targets intuitions generated solely by the artificiality of the setup.
      *   *Motivated by*: Your contrast between Zombies (Case 6) and Twin Earth (Case 7). Twin Earth anchors in real-world natural kind reference (e.g., fool's gold vs. gold, jadeite vs. nephrite), while Zombie conceivability lacks analogous grounding in our understanding of consciousness.
      *   *Trouble for*: Trolley (Case 2). Critics argue intuitions about killing/letting-die in high-stakes emergencies lack reliable real-world analogs; proponents argue moral intuitions about trade-offs have real analogs (e.g., triage). Your Case 11 weakens it precisely by removing a key perceptual anchor ("seeing").
      *   *Fails*: Zombies (Case 6), Swampman (Case 8), Your Memory Rewrite (Case 10 - no clear real-world anchor for gradual memory replacement defining identity), Experience Machine (Case 9 - no real analog for perfect, permanent simulation).

  3.  **Isolation Filter**: The scenario must successfully *isolate the variable* purportedly under test. This means (a) ensuring the scenario genuinely instantiates the target concept(s) as defined, and (b) minimizing confounding variables the theory claims are irrelevant. This targets cases rigged by hidden assumptions.
      *   *Motivated by*: Your Gettier analysis (Case 1) - the case cleanly instantiates JTB yet intuitively isn't knowledge, isolating "luck" as the problematic factor. Your worry about Trolley (Case 2) vs. Organ Donor (Case 3) - the latter potentially confounds utilitarianism with bodily autonomy.
      *   *Trouble for*: Zombies (Case 6) - Does "physical duplicate" genuinely entail *all* functional/physical properties, including those constituting consciousness? Critics say no, making the isolation dubious. Mary's Room (Case 5) - Does "complete physical knowledge" genuinely include the neurophysiological correlates of subjective experience? Proponents say yes, opponents say no.
      *   *Fails*: Organ Donor (Case 3 - confounds numbers with bodily violation/killing vs. letting die), Original Violinist (Case 4 - confounds rights violation with burden), Swampman (Case 8 - "molecule-for-molecule duplicate by chance" likely fails to instantiate genuine historical/functional properties of identity), Your Memory Rewrite (Case 10 - radically under-described, fails to isolate persistence conditions).

  **Applying the Framework to Your Verdicts (Legitimate/Legit?):**

  1.  Gettier (Clock/Barns): **Legit** (Passes Isolation & Anchoring; Depuration less critical here but possible).
  2.  Trolley: **Borderline Legit** (Passes Depuration *in principle* (your Case 11 shows fragility), Anchoring is debated, Passes Isolation *for testing consequentialism*).
  3.  Organ Donor: **Not Legit** (Fails Depuration, Anchoring weak, Fails Isolation - confounds variables).
  4.  Violinist (Famous): **Not Legit** (Fails Depuration). (Dry Version: **Potentially Legit** - Passes Depuration, Anchoring/Isolation depend on the principle tested).
  5.  Mary's Room: **Legit** (Passes Anchoring (sensory deprivation/restoration), Passes Isolation *if* physicalism is defined as excluding qualia; Depuration preserves core intuition).
  6.  Zombies: **Not Legit** (Fails Anchoring, Fails Isolation (conceivability != possibility; "physical duplicate" definition contested)).
  7.  Twin Earth: **Legit** (Passes Anchoring (natural kind terms), Passes Isolation (cleanly isolates chemical composition as reference-fixer), Depuration possible).
  8.  Swampman: **Not Legit** (Fails Depuration (absurd narrative), Fails Anchoring, Fails Isolation (fails to instantiate historical/causal properties of identity/mind)).
  9.  Experience Machine: **Not Legit** (Fails Depuration (framing bias), Fails Anchoring).
  10. Your Memory Rewrite: **Not Legit** (Fails Anchoring, Fails Isolation (wildly under-described)).
  11. Your Abstract Trolley: **Weakens Original** (Shows Depuration *can* weaken Trolley intuition, suggesting original framing *was* partly doing work; doesn't necessarily invalidate the core intuition entirely).

  **Verdicts Needing Overturn:** Your instinct that Organ Donor (3) and Violinist-Famous (4) are illegitimate is correct per this framework. Your verdict on the Experience Machine (9) as illegitimate is also correct. Your verdict on the *dry* Violinist is potentially salvageable. Your verdict on Swampman (8) as illegitimate is correct. Your verdict on your Memory Rewrite (10) as distrustworthy is correct.

  **Cases You Should Reconsider:** Your verdict on the Trolley (2) as "Legitimate" is *overly strong*; the framework renders it Borderline Legit due to Anchoring questions and the fragility shown by your Case 11. Your confidence in Mary's Room (5) is justified.

  **Your Three New Cases:**

  1.  **Depumped Zombie:** "Consider a possible world W1. W1 contains entities that are, at every level of physical description (fundamental particles, fields, functional organization, behavior, etc.), identical to conscious humans in our world. However, in W1, there is no subjective experience whatsoever associated with these entities. Is W1 metaphysically possible?"
      *   *Verdict:* **Not Legit** as evidence for dualism. Fails Anchoring (no real-world analog for "physically identical but non-conscious"); Fails Isolation (assumes "subjective experience" isn't *constituted* by the physical facts described, which is precisely what's at issue - the case rigs the isolation). Depuration doesn't fix the core problem.

  2.  **Sequencing (Sorites-Style Arguments):** "Is a series of minimally different cases, leading from an obvious verdict A to an obvious verdict non-A, legitimate for establishing that A and non-A are not genuinely distinct?"
      *   *Verdict:* **Highly Suspect / Often Illegitimate.** Frequently exploits perceptual or cognitive limitations (just-noticeable differences, vagueness) rather than genuine conceptual relationships. Fails Anchoring (the sequence often relies *only* on the hypothetical progression). Fails Isolation (each step may introduce tiny, cumulative confounds). Can be useful for *exposing* vagueness but rarely *resolves* the underlying metaphysical question definitively. (e.g., Ship of Theseus sequences expose vagueness in "same ship" but don't tell us what persistence *is*).

  3.  **Non-Human Agent (e.g., Hive Mind):** "Consider a decentralized network of insects (Hive). Hive exhibits complex, goal-directed problem-solving at the colony level (finding food, defending nests, regulating temperature), achieved through simple signal exchanges between individual insects who lack any individual awareness of the colony's overall goals. Does Hive itself possess intentional states (e.g., *believes* there is food to the north, *desires* to protect the queen)?" (Based loosely on Dennett's Intentional Stance).
      *   *Verdict:* **Useful but Requires Extreme Caution.** Legitimacy depends heavily on Depuration and Anchoring.
      *   *Depuration:* Strip away "insect"/"hive" imagery: "System S achieves complex goal G through numerous simple interactions between sub-components C1...Cn, where no single C has access to G or the global state. Does S have beliefs/desires about G?"
      *   *Anchoring:* Do we attribute beliefs/desires to simpler non-human systems (thermostat "desires" 70°F? Chess computer "believes" moving the queen is good?), or complex human organizations (Does the CDC "believe" there's a flu outbreak?)? Our intuitions here are unstable and theory-laden.
      *   *Isolation:* Tests the boundaries of intentionality/freedom concepts. Can isolate functionalist vs. biological theories of mind.
      *   *Overall:* Potentially Legit *for testing theories* of intentionality (e.g., functionalism), but unlikely to produce *consensus* intuitions usable as direct evidence due to weak Anchoring. Its value is in probing definitions, not delivering verdicts.

  **Genuine Check on the Principle (Beyond Intuition):**

  A genuine check is **predictive power and fruitfulness within philosophical practice**:

  1.  **Predicts Agreement/Disagreement:** Does the framework predict which thought experiments philosophers *actually* find persistently persuasive vs. contentious (e.g., Gettier vs. Zombies)? Does it predict which generate productive research programs refining concepts vs. which lead to stalemates (Twin Earth semantics vs. Zombie debates)?
  2.  **Resolves Disputes:** Can applying the framework help resolve disagreements *about* a specific thought experiment's legitimacy by pinpointing *where* the pollution occurs (e.g., "Your objection to the Violinist case highlights a Depuration failure")?
  3.  **Guides Construction:** Does the framework provide useful guidance for *designing better* thought experiments that minimize pollution (e.g., "To test utilitarianism, avoid bodily violation scenarios due to Isolation failure risks")?
  4.  **Connects to Cognitive Science:** Does the framework align with empirical findings about cognitive biases (framing effects, status quo bias, emotional salience) that explain *why* some pumps work illegitimately?

  This check moves beyond appealing to further intuitions *about* cases by looking at the *role and impact* of thought experiments in the actual practice and progress of philosophy. A principle that consistently explains why some thought experiments become canonical tools while others remain controversial or fade away, and which helps diagnose and improve methodological practice, demonstrates its value beyond being just another intuition pump about intuition pumps.
