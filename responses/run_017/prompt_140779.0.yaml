answer: |-
  Below is a decision tree for consciousness views, designed as a 90-minute whiteboard-friendly handout. It uses **9 branch questions** phrased in plain language (no jargon), with cases as requested. Questions are yes/no or three-way, and combinations are constrained by logic (e.g., anti-realist paths can't affirm felt qualities). Leaves are labeled with named views or "unnamed," and include a one-sentence "awkward commitment" (the hardest pill to swallow). Unoccupied cells and collapsed views are flagged.  

  ### **Decision Tree: Consciousness Views**  
  *Start at Q0. Follow arrows based on answers.*  

  ```plaintext
  Q0: When people argue about whether experiences have "felt qualities" (e.g., "the way red looks"), is this a factual disagreement?  
  │→ No: Quietism (dispute is verbal). Awkward: Must explain why debates feel substantive.  
  │→ Yes: Q1.  

  Q1: In normal perception (e.g., seeing a red apple), is there a "felt quality" (an intrinsic aspect like "redness as it appears to you")?  
  │→ Yes: Realism path → Q2.  
  │→ No: Anti-realism path → Q7.  

  --- REALISM PATH (Q1=Yes) ---  
  Q2: In a vivid dream of a red room (no real red light), are felt qualities present?  
  │→ Yes: Broad scope (covers dreams/imagery) → Q3.  
  │→ No: Narrow scope (only task-guided perception) → Leaf: Unnamed narrow realism. Awkward: Must explain why dreams feel vivid. *Unoccupied: No major view holds this; dreams are too similar to perception.*  

  Q3 (Broad): After years of meditation, a person reports no felt qualities but can still discriminate colors. Is her report accurate?  
  │→ Yes: Leaf: First-order representationalism with introspective error. Awkward: Introspection is unreliable, even for experts.  
  │→ No: → Q4.  

  Q4: During a task, a person says "I wasn’t experiencing anything" when asked, but later insists "I saw it the whole time" when shown the stimulus. Which is true?  
  │→ "I wasn’t experiencing": Leaf: Standard physicalism. Awkward: Reports of "no experience" must be false when discrimination occurs.  
  │→ "I saw it the whole time": → Q5.  
  │→ "Both, in different ways": Leaf: Mysterian option. Awkward: We can’t resolve the conflict; consciousness is fundamentally opaque.  

  Q5: Are felt qualities explainable by current physical science?  
  │→ Yes: Leaf: Russellian monism. Awkward: Physical stuff has hidden "mental" properties science can’t detect.  
  │→ No: Leaf: Anti-materialist realism (Chalmers-style). Awkward: Felt qualities are non-physical, making them scientifically inaccessible.  

  --- ANTI-REALISM PATH (Q1=No) ---  
  Q7: Is there an *illusion* of felt qualities (i.e., people are systematically wrong about their existence)?  
  │→ No: → Q8.  
  │→ Yes: Illusionism → Q9.  

  Q8: Should we stop talking about felt qualities?  
  │→ Yes: Leaf: Full eliminativism. Awkward: Must explain why ordinary talk (e.g., "I see red!") persists successfully.  
  │→ No: Leaf: Fictionalism/instrumentalism. Awkward: Keeps useful talk about non-existent properties, risking confusion.  

  Q9 (Illusionism): Where does the illusion occur?  
  │→ Perception systems: They generate "painted" qualities (e.g., vision delivers redness as a property). → Q10.  
  │→ Reporting systems: Downstream self-monitoring generates "awareness of qualities" (e.g., "I feel red!"). → Q11.  

  Q10 (Perception Error): When someone says "I experience the felt quality of red," is this caused by a genuine inner state with its own character?  
  │→ Warm (genuine state): *Unoccupied: Incoherent—inner state would have felt qualities, contradicting Q1=No.*  
  │→ Cold (just a disposition to report): Leaf: Unnamed perception-error illusionism. Awkward: Perception "paints" non-existent qualities. *Unoccupied: Unattractive; few deny perception is objective.*  

  Q11 (Reporting Error): When someone says "I experience the felt quality of red," is this caused by a genuine inner state with its own character?  
  │→ Warm (genuine state): *Unoccupied: Incoherent—inner state would have felt qualities, contradicting Q1=No.*  
  │→ Cold (just a disposition to report): → Q12.  

  Q12: Does the illusion cover non-perceptual states (e.g., dreams, imagery, background sensations)?  
  │→ Yes: Leaf: Attention-schema view OR Frankish-style illusionism (*Collapsed pair: Identical in tree; both are reporting-error, cold, broad*). Awkward: All subjective experience is an introspective error.  
  │→ No: Leaf: Dennett-ish view (no illusion). Awkward: Denies introspection entirely; experience is just behavioral dispositions. *Note: Collapses with eliminativism? No—Q7=No vs Q7=Yes.*  
  ```  

  ---

  ### **Key Notes**  
  1. **Branch Logic**:  
     - **Q3 (meditation case)**: Realists must answer "no" (report is wrong) or face contradiction (Q1=Yes).  
     - **Q4 (mid-task report)**: Realists must choose between reliable introspection ("I saw it") or unreliable ("I wasn’t experiencing").  
     - **Warm vs Cold seeming**: Forces views to specify if the "seeming" is a real state (warm) or mere disposition (cold). Anti-realism collapses with warm answers (incoherent).  
     - **Error location**: Splits illusionism into "perception-error" (qualities painted in) vs "reporting-error" (downstream error).  

  2. **Unoccupied Cells & Why**:  
     - **Perception-error + warm seeming**: Incoherent—warm seeming requires felt qualities, but Q1=No denies them.  
     - **Reporting-error + warm seeming**: Incoherent (same reason).  
     - **Narrow realism (Q2=No)**: Unattractive—dreams/imagery are too vivid to lack felt qualities. No major view holds this.  

  3. **Collapsed Views**:  
     - **Attention-schema (Graziano) and Frankish-style illusionism**: Identical in tree (reporting-error, cold, broad). No further question splits them.  
     - **Dennett-ish view and eliminativism**: Not collapsed! Dennett sits in reporting-error/cold/narrow (Q12=No), while eliminativism is Q7=No/Q8=No.  

  4. **Diagnostic Case**:  
     - "Seeming has real qualitative character but no qualitative properties" → **Incoherent cell (warm seeming + anti-realism)**. Warm seeming implies felt qualities in the seeming state, contradicting Q1=No.  

  **Tree Covers**: Anti-materialist realism, Russellian monism, mysterian, first-order representationalism, attention-schema, Frankish/Dennett illusionism, eliminativism, fictionalism, quietism.  
  **Handout Tip**: Draw this step-by-step on the whiteboard, pausing at cases (Q2, Q3, Q4) to discuss. Focus on why cells are unoccupied or collapsed.
