  - No: then introspection is reliable -> standard physicalism? but then why did they say no? 

  If they were not experiencing, then that means the experience wasn't there, which is not typical.

  So most would say they were experiencing but didn't report it, so fallible.

  For non-physicalism (Q3=No):

  Q5: Can we understand how they arise? (Yes/No)
