  Also, we have the Dennett view which is at Q6=No, Q7=No: fictionalism.

  For the higher-order view, it might be in realism or illusionism. A higher-order view can be realist: the higher-order state makes us aware of the first-order state which has the quality. Or it can be illusionist if the first-order state doesn't have the quality.

