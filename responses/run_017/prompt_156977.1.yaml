prompt: |-
  My flatmate has extremely firm views about individual contributions to collective harms, and I've been trying to work out what rule she's actually running, because I think her own view is about to back her into something she'll hate.

  Her verdicts so far, best I can reconstruct them:

  - Giving 10% of her income to effective charities: obviously required, one of the best things a person can do, no debate.
  - Buying factory-farmed chicken: wrong, and she won't do it even after I pointed out that supermarkets reorder in batches, so her single pack is almost certainly inside the margin and changes nothing at the farm. Her line was that she's still the one handing over money for the cage.
  - Eating meat somebody else already bought and cooked, i.e. leftover barbecue: totally fine, "the harm's done and me not eating it helps nobody."
  - Flying long-haul for a holiday: fine, she does it, she doesn't offset, and she says one passenger is a rounding error against total aviation emissions. She'll admit its not great, in the way you'd admit anything is not great.
  - Buying a fast-fashion hoodie sewn in a factory with genuinely awful conditions: fine, and she thinks boycotts tend to leave the workers worse off.
  - Voting in a general election from a safe seat her party always wins: she votes, calls it a duty, and has genuinely done the calculation where you multiply a tiny chance of being pivotal by large stakes.
  - Signing petitions, sharing infographics: theatre, waste of time.

  I can't tell whether she's running (a) a strict expected-difference rule — what would have happened if I hadn't done it, with the threshold cases handled by multiplying the chance of being the tipping purchase by the size of the batch, which supposedly lands you near your per-person share anyway — or (b) some kind of membership/complicity rule where what matters is that you're paying into a practice that's wrong regardless of whether you tipped anything. Her leftovers verdict and her hoodie verdict make me think (b) has to be narrowed to cases where money crosses hands, but the flying verdict pushes the other way: under (a) the flight looks at least as bad as the chicken, since the extra fuel really is causally downstream of her seat in a way the bird only is via some threshold story, so a consistent (a)-person should be more bothered by the flight than by the pack of chicken, and she isn't. Or maybe she's just inconsistent and I should drop it.

  Here's the case I actually care about. She and her partner are talking about having a kid, and I pointed out that a child in a rich country sits upstream of an enormous amount of emissions — tens of tonnes a year for decades — and that unlike the flight or the chicken, essentially none of it is inside a margin: there's no batch reordering, no threshold, no "the plane was going anyway." The inefficacy move she leans on everywhere else just doesn't apply here. She shrugged and said the emissions would be her kid's, not hers, and that she isn't causing anything, just starting a person. I can't tell whether that's a real answer or a dodge.

  So: what's your bet on how she'll land once she thinks about it properly? Which rule is she implicitly running, which other rules fit her earlier verdicts just as well, and what would each of them say about the kid? Which single further case would do the most work in telling those rules apart — the provably-pointless purchase, the offsets case, something else? And does it matter, under the rule you think she's on, that she could in principle offset the whole family's emissions or raise the kid somewhere with a much smaller footprint?

  One more thing: please be explicit about where your reasoning is most likely to break, and say what would actually change your verdict — what she'd have to say about some case, or what consideration you're dismissing too quickly, for you to switch to a different rule. I'd rather have the guess with its failure modes attached than a confident story.
reasoning: |-
  Okay, let me start by unraveling the user's query. They're describing their flatmate's views on ethical decisions related to collective harms. The user is trying to figure out the underlying rule guiding her judgments across various scenarios. The key here is to identify a consistent ethical framework that explains her diverse stances—like donating to charity, avoiding factory-farmed chicken, but being okay with flying or fast fashion. The user also wants to predict her stance on having a child, given the environmental impact.

  First, I need to map out her positions on each case. Donating 10% to charities is mandatory; buying factory chicken is wrong despite marginal impact; eating leftovers is fine; flying is acceptable; buying fast fashion is okay; voting is a duty; petitions are useless. The challenge is finding a principle that ties these together. 

  The user mentions two possible rules: expected-difference (a) vs. complicity (b). Under expected-difference, actions are judged by their causal impact—whether they change outcomes. Complicity focuses on participation in harmful systems, especially through financial transactions. 

  Looking at her reactions: She rejects the marginal impact argument for chicken, insisting she's "handing over money." For leftovers, no money changes hands, so no complicity. Flying and fast fashion involve payments, but she dismisses impact, which complicates complicity. Voting is a duty despite low pivotality, which might fit expected-difference if she calculates the expected value. 

  The leftovers and fast fashion cases are crucial. Leftovers involve no transaction, so complicity doesn't apply. Fast fashion involves payment, but she argues boycotts harm workers, which is a consequentialist point. This suggests her rule isn't purely complicity because she considers consequences in some cases. 

  Flying is the anomaly. If complicity is about paying into harmful systems, flying should be wrong, but she's okay with it. Maybe she sees air travel as a systemic necessity or different structurally? Or perhaps she doesn't view emissions as direct harm like animal suffering. 

  The child case is the user's main concern. They argue emissions are directly caused without marginal thresholds. Her response shifts responsibility to the child, denying causation. This sounds like avoiding complicity—she's not paying for emissions directly; the child will. But under expected-difference, having a child has a massive, non-marginal impact. 

  So which rule fits best? Complicity with exemptions for systemic participation or indirect harms. Expected-difference struggles with her dismissal of marginal impacts in flying and chicken, except when she accepts it for voting. Maybe she's using different rules for different domains: strict complicity for direct transactions (chicken), expected-value for voting, and systemic considerations for fashion and flights. 

  The user asks for a diagnostic case. The "provably pointless purchase" could help. If she condemns buying the last chicken that would spoil otherwise, that supports complicity (paying for harm). If she's okay with it, expected-difference might fit. 

  For the child case, under complicity, she might argue she's not directly paying for emissions, so it's acceptable. Under expected-difference, the impact is clear, so she'd have to offset or avoid. Her current shrug suggests complicity is her escape. 

  But her inconsistency in flying (paying but dismissing impact) is a problem. Maybe she views travel as a necessity or different ethically. Or she might be inconsistent. The user needs to press her on flying vs. chicken to see if she distinguishes structures (e.g., batch ordering vs. flight scheduling). 

  Another angle: moral responsibility vs. causation. She might feel responsible only when she's the direct payer, not when enabling future actions (the child). 

  Key failure points: Her flying stance is the biggest hole. If she can't reconcile flying with her chicken stance, complicity might not hold. Also, if she accepts offsets for flights but not for chicken, that could indicate different rules. 

  In summary, complicity with money-as-participation is the closest, but with exceptions she hasn't resolved. For the child, she'll likely stick to "not her emissions," avoiding responsibility. But if pressed on enabling harm, she might falter. The pointless purchase case could force a choice between complicity and consequentialism.
answer: |-
  Based on your reconstruction, your flatmate is running a **"Financial Participation as Complicity" rule**, *not* a strict expected-difference rule. Her core principle seems to be: **You are morally complicit in a harm if you financially transact to directly obtain a harmful product/service, regardless of marginal impact.** However, this core is nuanced by systemic considerations and harm ownership. Here's the breakdown:

  ### The Core Rule & Fit with Verdicts
  1.  **Financial Transaction = Complicity (Direct Harm Ownership):**
      *   **Buying Factory Chicken:** Wrong because she hands over money *for the harmful product itself*. She "owns" the harm by paying for it. The marginal impact argument is rejected – the transaction itself implicates her.
      *   **Buying Fast-Fashion Hoodie:** Fine because while she pays, she doesn't see the transaction *itself* as the primary harm mechanism. She shifts focus to the systemic consequence (boycotts hurting workers), overriding the complicity concern. The harm is owned by the system, not her specific purchase.
      *   **Flying Long-Haul:** Fine because she likely sees the ticket purchase as paying for *transportation*, not *directly* for emissions in the same way she pays for chicken. The emissions are a byproduct of the service, not the core product she's transacting for. She denies personal ownership ("one passenger is a rounding error") and doesn't see the transaction as directly commissioning harm.
      *   **Donating to Charity:** Required because she's financially transacting *for good*. The complicity framework flips: paying into a beneficial system is virtuous.

  2.  **No Financial Transaction = No Complicity (Harm Ownership Lies Elsewhere):**
      *   **Eating Leftovers:** Totally fine. No money changes hands for the meat *now*. The harm was "owned" and paid for by the original purchaser. She accepts the harm as a sunk cost and disclaims ownership/responsibility for its current existence.

  3.  **Exceptions/Overrides:**
      *   **Voting:** This is a civic *duty*, not a market transaction. She uses expected-value reasoning here *because* it falls outside the financial complicity framework. It's a different category (duty to participate in collective decision-making).
      *   **Petitions/Infographics:** Seen as non-transactional, symbolic actions with no tangible impact (either harmful or beneficial) and no direct financial link to harm/benefit. "Theatre."

  ### The Kid Case Prediction
  She will **reject the idea that having a child is her causing harm**, consistent with her rule:
  1.  **No Direct Financial Transaction for Harm:** She isn't handing over money to *purchase emissions*. Emissions are a byproduct of her child's *future existence* and choices, not the core "product" (the child) she's "commissioning."
  2.  **Harm Ownership Shift:** The emissions will be the *child's*, not hers. She sees her role as "starting a person," not directly causing decades of emissions. The child is an autonomous agent who will "own" their footprint. Her financial transactions (raising the child) are for *care/sustenance*, not directly for emissions.
  3.  **Systemic View Overrides Marginal Impact:** She'll likely argue that global population/emissions are a systemic issue, and her single child is a "rounding error" (like the flight passenger), regardless of the lack of a marginal threshold in this specific case. She dismisses the unique structural difference you highlight.

  **Under her rule, offsetting or moving wouldn't fundamentally change her core justification.** Offsetting might make her feel better ("addressing the byproduct"), and moving might reduce the *scale* of the byproduct, but neither changes the fact she doesn't see *having the child* as financially transacting for harm. Her core defense is disowning the harm causation.

  ### Diagnosing the Rule: The Crucial Test Case
  The **"Provably Pointless Purchase"** is the best discriminator:
  *   **Scenario:** Imagine a perishable good (e.g., a specific factory-farmed chicken breast) that will 100% go to waste if *no one* buys it by closing time. Buying it has zero causal impact on production or farm practices. It won't trigger a reorder. It simply saves it from the bin. Is it morally permissible to buy it at a discount?
      *   **Expected-Difference Rule (a):** **Permissible (or even good, preventing waste).** Your action changes the outcome (chicken eaten vs. wasted) without increasing harm.
      *   **Financial Complicity Rule (b):** **Impermissible.** You are still *handing over money for a harmful product*. The transaction itself is the wrong, even if consequentialist reasoning shows no net harm. The act of paying for the immoral object is the sin.
  *   ***Prediction for your flatmate:*** **She would say it's WRONG.** Her core objection to chicken isn't the marginal consequence; it's the act of paying for the product of suffering. This test isolates the transaction from consequences. Her verdict here confirms the complicity rule.

  ### Why Expected-Difference Doesn't Fit
  1.  **Chicken vs. Flight Contradiction:** As you noted, under strict expected-difference, the flight should be *at least* as bad as the chicken (if not worse). Her dismissal of flight impact while stressing chicken payment is a major inconsistency for (a).
  2.  **Leftovers:** Expected-difference might see eating leftovers as neutral or slightly positive (reducing waste), but wouldn't make the strong "harm's done" ownership distinction she does.
  3.  **Voting:** She *uses* expected-value here, showing she understands the concept, but pointedly *rejects* it for chicken, where marginal analysis is equally applicable. She reserves it for non-market contexts.
  4.  **Fast Fashion:** An expected-difference rule could go either way (tiny impact vs. boycott harm), but her focus is on the systemic consequence for workers, not the *probability* her purchase tips anything.

  ### Where My Reasoning is Brittle & What Would Change It
  1.  **The Flying Anomaly:** This is the biggest weakness. Why is paying for a flight ticket *not* seen as financially participating in harmful emissions, while paying for chicken *is* seen as participating in animal suffering?
      *   **Possible Justifications Within Her Rule:** She might mentally categorize emissions as an *indirect, unavoidable externality* of a complex travel *system*, whereas the chicken *is* the core harmful product. Or she might see air travel as having necessary/socially vital components that factory farming lacks. Or she might genuinely be inconsistent here.
      *   **What Would Change My Verdict:** If she articulated that flying *would* be wrong *unless* she offsets, because the offset severs the financial link to the harm (paying for flight + mitigation). Or, if she conceded flying was actually problematic under her rule but did it anyway due to weakness of will (akrasia). Her current "rounding error" justification feels like an uncomfortable dodge within her own framework.
  2.  **Fast Fashion Nuance:** Her worker-harm argument overrides the complicity concern. Is this a consistent consequentialist override, or an ad hoc exception?
      *   **What Would Change My Verdict:** If she condemned buying *luxury* fast fashion (clearly unnecessary) while permitting essentials, it would suggest a stronger consequentialist element blended in. If she condemned *any* purchase from a *provably*, *indisputably* horrific factory (e.g., known child slavery), even while acknowledging boycott harm, it would strengthen the complicity rule.
  3.  **The "Starting a Person" Dodge:** Her kid argument relies on a strong distinction between causing harm and enabling future agents who *might* cause harm. Is this principled or self-serving?
      *   **What Would Change My Verdict:** If she condemned someone *paying* for IVF/fertility treatments *specifically* to have a carbon-heavy heir, that would show financial participation *for the act of creating a future emitter* is wrong under her rule. If she still said "just starting a person," it confirms the dodge is central to her position.
  4.  **Voting vs. Petitions:** Her distinction relies on voting having calculable *expected* value and petitions having zero. What if a petition had a *known*, high probability of tipping a specific, harmful policy? Would she still call it theatre? If *yes*, it reinforces that only *financial* transactions trigger complicity concerns for harms. If *no*, it introduces a more general "impactful action" category beyond finance.

  **Conclusion:** Your flatmate's core ethic revolves around financial participation as moral complicity. This explains the chicken, leftovers, charity, and (with systemic override) fast fashion verdicts. Her voting stance is a separate civic duty category. Flying is the major inconsistency within this framework, suggesting either an unarticulated distinction or simple inconsistency. Her "starting a person" argument about the kid is a direct application of her harm disownership principle and will likely hold unless challenged on enabling future harm or the nature of parental responsibility. The "Provably Pointless Purchase" test is the clearest way to confirm the complicity rule over expected difference. Be prepared for the flying contradiction to be the hardest point to reconcile if you discuss this further.
