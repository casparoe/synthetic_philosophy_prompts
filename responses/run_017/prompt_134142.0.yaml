prompt: |-
  Hey — hoping you can help me turn some of the epistemic injustice literature into something my team can actually run. Quick context: I work in the patient experience office at a large safety-net hospital, and a growing share of what lands in our queue isn't really a complaint about wait times or billing — it's people saying, in one way or another, that nobody took them seriously. We close about 40–50 of these a month, I've got maybe 25 minutes per case, the reviewers are retired nurses and social workers with no philosophy background, every letter goes out under my director's name, and anything that hints at a clinical mistake has to be cleared by legal first. I did a medical humanities reading group on this stuff a couple years ago so I know the basic vocabulary — credibility deficits from identity prejudice on the testimonial side, gaps in shared interpretive resources on the hermeneutical side, and the mirror-image case where someone gets *more* credibility than their evidence warrants — but I don't want a literature recap or a reading list, I want the operational version.

  So: give me a decision procedure, in the order we'd actually run it. Start with a triage question that peels off complaints that are really about something else (a genuine clinical error, a broken process, a request for money) so we don't epistemologize everything. Then the steps for deciding whether what happened is an epistemic failure at all, and if so which kind, and what kind of repair is owed — where "repair" might mean re-authoring part of the medical record, entering the patient's own words rather than the clinician's summary, giving feedback to a specific clinician, changing an intake form, or just an honest letter. For each step I want to know what counts as a *sufficient* answer, where the procedure should stop and say no repair is owed, and where it has to hand off to a human because the question is one of values rather than facts. Three wrinkles I keep hitting that I want the procedure to handle rather than dodge: (1) what I've started calling credibility laundering — the report gets believed only once a clinician restates it in clinical register, so the patient is effectively believed but accumulates no track record, and the chart can't support them next time; (2) the version where the speaker isn't the patient at all but a family member or informal interpreter, and the uptake failure and the repair owed arguably belong to two different people; (3) the mixed case where a report was discounted partly for illegitimate reasons and partly because it was clinically unlikely, where I don't want the procedure to just split the difference. If any of those three collapse into distinctions the literature already makes, say so conceptually — I don't need to know who named what.

  Then run it on three cases and show your work. (a) A woman in her forties with a history of fibromyalgia goes to the ED reporting what she describes as her nerves being on fire; the resident charts "chronic pain, drug-seeking r/o," her own phrasing never enters the record, and a scan three weeks later finds something real. (b) A daughter interpreting for her father, who has limited English and a dementia diagnosis, reports that he'd been saying his hip hurt for days before a fall; the team charts "baseline confusion" and treats the daughter as the sole authority, and later no one will credit either of them. (c) The one I expect to argue with you about: a fluent, well-insured, locally prominent man complains that a junior resident wouldn't accept his self-diagnosis and demands a letter acknowledging that he was epistemically wronged and that his preferred diagnosis be recorded; the chart shows a thorough and correct workup that ruled it out. I want at least one case where the procedure gives an answer I won't like, and I want you to say plainly where the rubric is really a judgment call dressed up as a procedure. Finally, give me a cheap audit we could run on a quarter's worth of closed complaints to tell whether using this is actually changing outcomes or just producing more nicely worded letters. Please write the whole thing in American English, and don't worry if it runs long.
reasoning: |-
  Okay, this is a fascinating and deeply practical request. The user works in patient experience at a safety-net hospital and needs to operationalize epistemic injustice concepts into a real-world workflow. They're clearly sophisticated - they've done medical humanities reading groups and understand terms like testimonial injustice and hermeneutical injustice, but they're explicitly rejecting academic abstraction. Their pain points are ultra-concrete: 25-minute case reviews, retired clinicians as reviewers, legal constraints, and three specific edge cases they've encountered.

  Hmm, what they're really asking for is a clinical algorithm for epistemic harm - something with the operational rigor of a triage protocol but applied to knowledge-based harms. The constraints are brutal: no philosophy background assumed, every output has to survive legal review, and it must handle those three thorny scenarios they described. What stands out is their acute awareness of systemic issues - like "credibility laundering" where patients get believed only after clinical translation, which leaves no audit trail for future care.

  First, I need to design a stepwise filter that starts by excluding non-epistemic complaints (billing, pure process issues). Then a branching logic for: (1) was this epistemic? (testimonial/hermeneutic/mirror), (2) if so, what repair matches the failure type? The three edge cases need special handling: credibility laundering is testimonial injustice with record-keeping consequences; the interpreter case creates dual stakeholders; the mixed-evidence case requires weighting scales.

  For the case studies: The fibromyalgia case is textbook testimonial injustice with laundering. The interpreter case shows hermeneutical marginalization. The prominent man case is crucial - it'll expose where the tool can't mask value judgments. I'll need to show the algorithm "failing correctly" there.

  The audit plan must be dirt-cheap - maybe sampling complaint letters pre/post for patient phrasing inclusion, or tracking how often reviewers escalate to "hermeneutical repair" tier. Key metrics: reduced re-escalations, increased patient verbatim in charts.

  Biggest challenge: Making Fricker's framework legible to retired nurses without dumbing it down. I'll avoid all academic terms - "credibility deficit" becomes "not taking seriously due to stereotypes." The repair taxonomy must map to hospital action verbs: re-author, verbatim-entry, feedback, form-change.

  Legal landmines everywhere. The director-signed letters mean every word could end up in court. So the algorithm must have clear off-ramps to legal review, especially when suggesting record amendments. Also that "mixed evidence" case - if the tool underestimates clinical likelihood, it could imply negligence.

  This might run long but they said not to worry. American English means no "whilst" or "recorded." Time to build a epistemic harm triage protocol that would make Miranda Fricker proud and a hospital lawyer nod grimly.
answer: |-
  Here’s an operational decision procedure for identifying and repairing epistemic injustice in patient complaints, designed for speed, clarity, and actionability within your constraints. It’s structured as a flowchart with key questions, off-ramps, repair actions, and handling for your three wrinkles.  

  ---

  ### **Epistemic Harm Triage & Repair Protocol**  
  **Goal**: Separate non-epistemic complaints → Diagnose epistemic failure type → Assign matched repair.  
  **Time Allotment**: 10 min for triage/diagnosis, 15 min for repair design.  

  #### **STEP 0: PRE-FILTER (60 SECONDS)**  
  *   **Question**: *Is this fundamentally about clinical error, process failure, or financial/administrative issues?*  
  *   **Sufficient "NO" to proceed**: Complaint centers on feeling dismissed, misunderstood, or disbelieved *without* clear evidence of misdiagnosis, protocol breach, or billing error.  
  *   **Off-ramp**: If YES, route to standard QA, billing, or process improvement. *Stop here.*  

  #### **STEP 1: EPISTEMIC FAILURE? (5 MINUTES)**  
  *   **Question A**: *Did the patient/family report something credible that was ignored or distorted due to identity/stereotype (e.g., race, gender, diagnosis history, language status, age)?*  
      *   *Look for*: Chart summaries contradicting patient’s words; staff labeling ("anxious," "non-compliant") without evidence; dismissal of interpreter/family.  
      *   **Sufficient "YES"**: Likely **testimonial injustice** (credibility deficit). *Proceed to Step 2*.  
  *   **Question B**: *Was there a failure to understand or record the patient’s experience because their words/life context couldn’t be "translated" into clinical terms (e.g., cultural pain descriptions, non-medical explanations)?*  
      *   *Look for*: Patient’s exact phrasing missing from chart; staff confusion noted; intake forms forcing inadequate choices.  
      *   **Sufficient "YES"**: Likely **hermeneutical injustice** (interpretive gap). *Proceed to Step 2*.  
  *   **Question C**: *Was excessive credibility given to a report *without* evidence, due to status/privilege (e.g., VIP demands, "doctor-shopping")?*  
      *   *Look for*: Clinician override of protocols due to patient pressure; chart reflects patient’s unsupported claims as fact.  
      *   **Sufficient "YES"**: **Mirror injustice** (credibility surplus). *Proceed to Step 2*.  
  *   **Off-ramp**: If NO to A/B/C → *No epistemic repair owed*. Draft empathetic closure letter explaining clinical rationale. *Stop here.*  

  #### **STEP 2: TYPE & REPAIR MATCHING (10 MINUTES)**  
  | **Failure Type**       | **Repair Action**                                                                 | **Legal Flag?**                     |  
  |-------------------------|-----------------------------------------------------------------------------------|-------------------------------------|  
  | **Testimonial**         | 1. **Re-author record**: Add patient’s *verbatim* description + context note.<br>2. **Clinician feedback**: Specific, behavior-focused (e.g., "Avoid labeling without evidence"). | If clinical error possible → Legal review. |  
  | **Hermeneutical**       | 1. **Verbatim entry**: Add patient’s own words to chart as "patient-reported experience."<br>2. **System fix**: Propose intake form/assessment tweak (e.g., open-field "Describe your pain"). | Low risk → Proceed.                |  
  | **Mirror**              | 1. **Chart correction**: Amend inaccurate VIP-driven entries to reflect evidence.<br>2. **Team coaching**: "Maintaining standards under pressure." | High risk → Legal *must* review.    |  

  **Handling Your Wrinkles**:  
  1.  **Credibility Laundering** (e.g., fibromyalgia case):  
      *   *Diagnosis*: Subtype of **testimonial injustice**.  
      *   *Repair*: **Mandatory verbatim entry** + **flag in chart**: "Patient self-description initially omitted; corroborated on [date]." Prevents future discounting.  
  2.  **Family/Interpreter as Speaker**:  
      *   *Diagnosis*: **Testimonial** (if disbelieved) **or Hermeneutical** (if context lost).  
      *   *Repair*: Record **both** parties’ perspectives. Feedback must address: "Listen to family *as reporter* AND engage patient directly where possible."  
  3.  **Mixed Evidence Cases** (legitimate + illegitimate discounting):  
      *   *Test*: "Would this have been investigated *if* spoken by a privileged patient?"  
      *   *Repair*: **Verbatim entry** + **Note in chart**: "Initial clinical likelihood low; patient report warranted consideration due to [specific symptom]." *Avoids splitting the difference* by affirming legitimacy of reporting.  

  #### **STEP 3: VALUES VS. FACTS HANDOFF (2 MINUTES)**  
  *   **Handoff triggers**:  
      *   Disagreement on whether identity prejudice occurred (requires human judgment).  
      *   Repair requires significant chart amendment with clinical implications (Legal/Medical Director review).  
      *   Demand for apology/admission of "epistemic wrong" beyond factual correction (Ethics/Leadership).  
  *   **Non-handoff**: Verbatim entries, form changes, non-punitive feedback.  

  ---

  ### **CASE APPLICATIONS**  
  #### **CASE A: Fibromyalgia Patient in ED**  
  *   **Step 0**: Not billing/process → Proceed.  
  *   **Step 1A**: YES. Identity prejudice (fibromyalgia = "drug-seeking"). **Testimonial injustice** + **Credibility laundering** (her words omitted; scan later confirms).  
  *   **Step 2**:  
      *   Repair: **Add verbatim quote** ("nerves on fire") to ED note + **flag**: "Patient description initially absent; later imaging supported neuropathic concern."  
      *   Feedback to resident: "Avoid premature labels; record patient descriptors even when etiology unclear."  
  *   **Handoff?** No. Verbatim entry low-risk.  

  #### **CASE B: Daughter Interpreter for Father**  
  *   **Step 0**: Not error/process → Proceed.  
  *   **Step 1A/B**: YES. **Testimonial injustice** (daughter disbelieved due to dad’s dementia) + **Hermeneutical injustice** (his pain reports lost as "confusion").  
  *   **Step 2**:  
      *   Repair: **Amend chart** with daughter’s report AND father’s pre-fall statements (e.g., "Daughter reports patient voiced hip pain 3 days prior; documented as baseline confusion").  
      *   System fix: **Propose dementia intake addendum**: "For non-fluent patients, record family reports *as separate observations*."  
  *   **Handoff?** No. Factual amendment.  

  #### **CASE C: Prominent Man Demands Diagnosis**  
  *   **Step 0**: Not billing/process → Proceed.  
  *   **Step 1C**: **Mirror injustice**? Clinically thorough workup ruled out his claim, but did staff *over*-accommodate due to status? Chart shows evidence-based care → **NO epistemic failure**.  
  *   **Step 1A/B**: Credibility *surplus* isn’t injustice if evidence was weighed fairly.  
  *   **Off-ramp**: **No repair owed**. Closure letter: "Your concerns were thoroughly evaluated per clinical guidelines; chart reflects medical findings."  
  *   **Why you might dislike this**: He *feels* wronged, but the procedure prioritizes *unwarranted* credibility discounting. His privilege didn’t distort uptake here – it just amplified his complaint.  
  *   **Judgment call exposed**: Distinguishing justified disagreement from identity-based discounting. The rubric relies on evidence of clinical diligence.  

  ---

  ### **CHEAP AUDIT PLAN**  
  **Method**: Random sample of 30 closed complaints (15 pre-protocol, 15 post). Track:  
  1.  **Verbatim Capture Rate**: % of cases where patient/family’s *exact words* appear in chart post-review.  
  2.  **Repair Type Tracking**: Frequency of repair actions (verbatim entry, form change, etc.).  
  3.  **Re-escalation Rate**: % of cases re-opened within 90 days due to unresolved issues.  
  4.  **Review Time**: Avg. minutes per case pre/post.  

  **Success Signals**:  
  - ↑ Verbatim capture + ↓ Re-escalations = Better epistemic repair.  
  - Stable review time = Sustainable.  
  - More form changes/feedback = Proactive prevention.  

  **Cost**: <4 staff hours quarterly.  

  ---  
  This turns theory into *triage*, *diagnosis*, and *treatment* for epistemic harm. It won’t resolve every values clash (Case C proves that), but it forces explicit reasoning, reduces defensiveness, and links repair to harm type. Run the audit at 6 months – I suspect you’ll see more verbatim in charts and fewer repeat complaints from the same patients.
