  Below is a logically structured decision tree for your interactive sidebar, designed to sort readers based on their responses to a concrete replication failure scenario. The tree separates explanations for the failure (false positive, tiny effect, context-dependent effect) from proposed fixes (statistical tools, institutions/incentives, phenomena/measurement) without methodological self-identification. It includes your stipulation about reruns in the original context and the funder's choice node, while covering all eight required positions. The tree has **7 branch nodes** and **8 leaves**, fitting your constraints.

  ---

  ### **Decision Tree: The Replication Failure Scenario**
  *Start with this fixed setup:*  
  *A medium-sized effect in social psychology has two dozen small published studies. A large preregistered multi-site replication (n > 1,000) finds an effect indistinguishable from zero with a tight confidence interval. The original author argues the replicators omitted two unmeasured features of the original protocol.*

  #### **Node 1: Why did the large replication fail to find the effect?**  
     - **A. Context differences:** The unmeasured protocol features or contextual factors likely altered the outcome.  
     - **B. Flaws in original studies:** The original studies overestimated or falsely detected the effect.  
     - **C. Both factors contributed:** Context and original flaws are equally plausible.  

  #### **Node 2A (from A):**  
  *Stipulation: Suppose rerunning the original experiment in the original lab/team/subject pool replicates perfectly every time, but it fails everywhere else. What does this imply?*  
     - **A1. Context is everything:** The effect is real but tightly bound to uncontrolled factors (e.g., lab culture, subtle cues).  
     - **A2. Unrecoverable fragility:** The effect is "real" only under hyper-specific conditions, making it scientifically useless.  

  #### **Node 2B (from B):**  
  *What was the primary flaw in the original studies?*  
     - **B1. Statistical shortcomings:** Low power, p-hacking, or poor error control inflated results.  
     - **B2. Incentive-driven bias:** Publication filters (e.g., ignoring null results) created false consensus.  
     - **B3. Measurement issues:** The construct was poorly defined or measured.  

  #### **Node 2C (from C):**  
  *Which factor demands urgent attention?*  
     - **C1. Fix the original flaws:** Start with statistical or incentive reforms.  
     - **C2. Fix context handling:** Start with theory/measurement for contextual variation.  

  #### **Node 3B1 (from B1):**  
  *Which statistical fix is most critical?*  
     - **B1a. Improve rigor:** Use severity tests or higher power to avoid false positives.  
     - **B1b. Replace tools:** Switch to Bayesian methods/priors.  
     - **B1c. Abandon testing:** Report estimates with intervals only.  

  #### **Node X (for all except A2):**  
  *Does this case indicate a systemic crisis in psychology?*  
     - **Crisis:** Yes—it reveals deep, field-wide problems.  
     - **Ordinary:** No—it’s normal self-correction; the crisis is overblown.  

  #### **Node Y (from A1/Crisis or B3/Crisis):**  
  *Funder's choice: What resource allocation would better prevent such failures?*  
     - **Replications:** 20 big replications of famous effects.  
     - **Instruments:** 10 years of instrument-building for one construct.  

  ---

  ### **Leaves (Final Positions)**
  1. **"Incentives/publication filter, not math"**  
     *Path:* B2 or Node Y → Replications  
     *Hardest datum to explain:* Why did the original studies consistently agree? (Assumes publication bias suppressed contradictory evidence.)  
     *Tree path:* B → B2 → Crisis  

  2. **"Tests were never severe"**  
