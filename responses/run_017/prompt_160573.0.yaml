     *Hardest datum:* The multi-site replication included diverse contexts yet found nothing. (Assumes replicators missed key boundary conditions.)  
     *Tree path:* A → A1 → Crisis → Instruments  

  7. **"Ordinary self-correction; crisis overblown"**  
