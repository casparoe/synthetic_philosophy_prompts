     *Tree path:* B → B1 → B1c → Crisis  

  5. **"Constructs/measurements are the culprit"**  
     *Path:* B3 or Node Y → Instruments  
     *Hardest datum:* The stipulation’s success in the original context. (If measurement is broken, why did it "work" there?)  
     *Tree path:* B → B3 → Crisis → Instruments  

  6. **"Effects are fragile/context-bound; need theory"**  
