  For the pinned claim case, I'll explore whether pinning is a repeated assertion. Alex would argue knowledge must persist, while Bina focuses on the context of reliance. Co-signing raises questions about whether it's vouching or a new assertion. The lottery case (ticket 719) will test if asserting a loss without knowledge is permissible—Alex says no, Bina says it depends on stakes.

