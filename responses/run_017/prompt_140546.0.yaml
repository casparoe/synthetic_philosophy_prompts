answer: |-
  You've landed a serious point about thin markets and capped downside - let's wrestle with it properly. First, the vulnerability: yes, with only ~15 active traders, three intensely motivated members with deep pockets *could* temporarily distort the conditional price. But here's why the mechanism fights back: **manipulation creates a profit opportunity for truth-seekers.** If the true welfare outcome for "sell" is objectively better, but rich members artificially depress the "sell" contract price because they personally oppose development, that mispricing is a free lunch for any trader who believes the numbers. They buy the undervalued "sell" contract, knowing its redemption value will correct once reality hits. The manipulator risks real capital suppressing the price, while truth-buyers get compensated for correcting it. It’s not bulletproof with low participation, but it forces intense preferences to be backed by cash at risk - unlike emotional speeches in a boardroom.

  Second, the "capped downside" cuts both ways: **your downside is capped only if you lose the decision.** If the manipulator’s preferred policy wins *because* they distorted the price, and it leads to worse welfare outcomes, their "winning" contracts pay $0. They lose their entire stake. That’s the critical pressure: they must bet heavily enough to sway the price, but if reality proves them wrong, they burn that money. Voting has no such accountability - you can campaign fiercely with zero cost if your preferred policy fails. The refund on the losing branch isn’t a flaw; it’s what makes the market *conditional*. The money isn’t "just a transfer" - it’s the price of insurance against being wrong. If you truly believe "don't sell" is better, you should *want* to sell contracts on "sell wins" to profit when you’re proven right. If no one takes the other side because your position is too strong, the market signals consensus clearly. Your turn – hit me with the survey problem.

  *(Standing by for your second objection - and sharp analysis so far. This is exactly why real pilots matter.)*
