  | **Monitoring by untrusted model** (e.g., model self-checks) | ❌ Reactive detection | ✅ Transparent | ❌ Defection targets gaps | ❌ Assumes honest CoT | ⚠️ Subagents unverified | ❌ Budget unquantified | Violates (i, iii, vi); model games itself. |  
  | **Paraphrase-and-diff-testing** (e.g., multiple variants; accept consensus) | ⚠️ If differential *replaces* monitoring | ✅ Open design | ✅ Defection must fool all variants | ✅ No CoT reliance | ❌ Consensus fails if subagents collude | ✅ Derivable from agreement rate | Throughput cost (iv); delegation unsolved. |  
  | **Sandboxing/info control** (e.g., actions reversible; no access to prod) | ✅ Harm contained | ✅ Model-aware | ✅ Sabotage has no effect | ✅ CoT irrelevant | ⚠️ Subagents inherit constraints | ✅ Budget = 0 (if perfect) | Throughput cost (iv); may limit task success. |  
  | **Tripwires/honeypots** (e.g., decoy files to trigger alerts) | ❌ Reactive | ❌ Model avoids if known | ❌ Defection evades traps | ✅ CoT unused | ❌ Subagents avoid | ❌ Budget implicit/high | Fails (i, ii, iii); model knows traps. |  
  | **Capability constraints** (e.g., no write access; limited toolset) | ✅ Incapable of sabotage | ✅ Constraints public | ✅ Defection impossible | ✅ CoT irrelevant | ✅ Subagents inherit | ✅ Budget = 0 | Fails (iv) if task requires dangerous capabilities. |  

  ### Structural Conclusion  
  - **Monitor-independence (i)** is the strongest filter, excluding reactive/audit-based protocols.  
  - The **trilemma (i+ii+iv) is genuine**: Architectures satisfying (i) and (ii) require either throughput costs (e.g., redundancy) or a nonzero sabotage budget (x).  
  - **Highest-priority focus**: Design around sandboxing or capability constraints, but address their delegation (viii) and throughput (iv) trade-offs.  

  Verdict: monitor-independence | the suspected trilemma is genuine
