prompt: |-
  Hi — hoping someone can help me out. My partner and I have one shared paper calender on the fridge and basically our whole lives are on it: who's picking up the kid, bin day, dentist on Tuesday. I know Tuesday's plan only by glancing at it, but I dont trust it the way I trust my own memory — I trust it because she's the one who keeps it updated, and if she stopped I'd be lost in a week. She's the same in reverse about the bits I maintain. Same thing at work: a shared spreadsheet only one guy maintains, and I make decisions straight off it without ever checking, but only because it's his. So the object does memory work, but the trust that makes it work points at a person, not at the object. I know the classic notebook case where the notebook counts as part of the guy's memory, but this feels different — I dont automatically endorse what's on the fridge, I endorse her, and she endorses it. Is there a name for this setup? I found 'distributed cognition', but everything under that label seems to be about whole teams navigating ships, and about the system rather than about whether my mind includes the calendar. I dont just want a label — I want what exactly this is, what nearby things it isnt, and where you'd draw the line: is it still the same thing if I had no idea who maintains it, only that somebody does? thanks
reasoning: |-
  Okay, the user is describing a situation where they rely on a shared calendar or spreadsheet maintained by someone else, like their partner or a colleague. They trust the information not because of the object itself but because they trust the person maintaining it. They mention distributed cognition but feel it doesn't quite fit because their focus is on the trust in the person, not the system as a whole. 

  Hmm, the user is clearly thoughtful and analytical—they’re not just looking for a jargon term but want to understand the underlying mechanics of this trust dynamic. They’ve already done some homework (they referenced the "classic notebook case," likely Clark & Chalmers' extended mind thesis) but feel existing frameworks miss the relational layer. Their examples (family calendar, work spreadsheet) show this is a lived, practical concern, not just theoretical curiosity. 

  The core tension they’re wrestling with is: *Where does cognition end and social reliance begin?* They sense that labeling this as "distributed cognition" glosses over the fact that their trust is anchored in a specific person—not the calendar itself or even the "system" abstractly. The notebook thought experiment treats the notebook as a passive extension, but here the calendar is active because a trusted agent curates it. 

  Digging deeper, their unspoken question might be: *"Am I thinking when I use this calendar, or am I outsourcing thinking?"* They might also be nudging at ethical implications—like if over-reliance on such systems erodes personal accountability ("if she stopped, I’d be lost"). The work example adds a layer of organizational vulnerability (single point of failure). 

  Philosophically, this echoes debates about epistemic trust: how we delegate knowledge-validation to others. But the twist is the material anchor (the calendar/spreadsheet) acting as a proxy. It’s not just social epistemology; it’s social epistemology mediated by objects. 

  Possible angles to explore:  
  - **Relational artifacts**: The calendar isn’t just a tool; it’s a manifestation of their partner’s attention. Trust transfers from person to object because the object is "charged" with her agency.  
  - **Epistemic dependence**: They’re describing a case where verification isn’t feasible (you can’t double-check every calendar entry), so trust becomes pragmatic.  
  - **Boundary work**: The line between "my cognition" and "our cognition" blurs. If they both maintain parts, does the calendar constitute a *couple-level* cognitive system?  

  The user’s hypothetical about "no idea who maintains it" is sharp—that’d shift this from interpersonal trust to *system* trust (like trusting Wikipedia’s editing protocols). That contrast clarifies how central personalized trust is to their current setup.  

  They’d likely appreciate concrete distinctions:  
  - Vs. extended mind: The calendar isn’t "part of *my* mind" but a bridge to *her* mind.  
  - Vs. distributed cognition: Their unit isn’t the ship navigation team but a dyad (partner/self, colleague/self).  
  - Vs. institutional trust: If the office spreadsheet had audit trails/redundancies, trust might transfer to the system—but here it’s anchored to "Dave’s diligence."  

  Key insight: The object isn’t cognitive; it’s the *relationship* that’s cognitive.
answer: |-
  What you're describing is a fascinating and under-discussed phenomenon at the intersection of memory, trust, and social coordination. It's **not quite distributed cognition** (which focuses on systems as cognitive units) **nor pure extended mind** (where tools are treated as biological memory). Let's break it down:

  ### Core Concept: **Epistemically Delegated Scaffolding**
  This setup involves **cognitive scaffolding** (the calendar/spreadsheet as external memory) combined with **epistemic delegation** (trust vested in a specific person maintaining it). The object is inert without the trusted agent behind it. Crucially, your trust is in *their ongoing agency*, not the object's static content.

  ---

  ### Key Components & Why It's Distinct
  1. **Person-Anchored Trust**  
     - You trust the calendar *because it's your partner's cognitive output*, not because you treat the calendar itself as your memory.  
     - **Contrast with Extended Mind** (Clark & Chalmers): In the "notebook case," the notebook *is* memory—the user automatically endorses its contents. Here, you endorse *the person*, not the object. If your partner wrote "aliens land Tuesday," you'd question it.

  2. **Dynamic Maintenance**  
     - The system works only because a specific agent actively curates it. Your reliance is on *their labor and attention*.  
     - **Contrast with Institutional Artifacts**: A bus schedule or Wikipedia relies on systems/processes, not personal trust in one individual.

  3. **Asymmetric Accountability**  
     - If the calendar is wrong, you blame *her*, not "the system." At work, you'd blame "Dave," not the spreadsheet.  
     - **Distributed cognition** would treat the whole team-calendar system as the unit. Here, you're focused on individual accountability.

  ---

  ### What to Call It?
  - **Relational Cognitive Offloading**: Emphasizes the interpersonal dimension.  
  - **Agent-Dependent Scaffolding**: Highlights reliance on a specific maintainer.  
  - **Epistemic Proxy System**: The object acts as a conduit for trusted human knowledge.

  **Best fit:** **Delegated Cognitive Maintenance** – Captures the act of outsourcing memory *upkeep* to a trusted agent.

  ---

  ### Boundary Cases: When Does It Change?
  | Scenario                          | Still "Delegated Cognitive Maintenance"? | Why? |
  |-----------------------------------|------------------------------------------|------|
  | You don't know *who* maintains it | ❌ No | Trust shifts to *systemic reliability* (e.g., Wikipedia's editing protocols). Personal accountability is lost. |
  | Maintainer changes frequently     | ⚠️ Partially | Trust becomes institutional ("the role is filled reliably"). Less personal, more systemic. |
  | You *co-maintain* with verification | ❌ No | Shifts to collaborative cognition or extended mind (shared ownership). |
  | Maintainer uses AI tools          | ✅ Yes | Still anchored in *their* judgment/oversight of the tool. |

  ---

  ### Why This Matters Philosophically
  You've hit on a flaw in classic extended mind theory: it assumes tools are transparently integrated. **Your case shows cognition is often *socially embedded***. The calendar isn't "part of your mind" – it's a **bridge to your partner's mind**. This reveals:
  - Memory isn't just stored; it's **curated**, and curation requires trust.  
  - We outsource not just data, but **epistemic responsibility**.  
  - Breakdowns expose vulnerability (e.g., "if she stopped, I'd be lost").

  This is everywhere: family calendars, work docs maintained by "the expert," even trusting a mechanic's diagnostic report. The object is inert; the *social contract* makes it function.

  ### In Short
  You're describing **delegated cognitive maintenance** – a hybrid of external scaffolding and interpersonal reliance where trust is vested in a specific agent's ongoing curation. It collapses if the maintainer vanishes or trust erodes, distinguishing it from system-focused distributed cognition or tool-focused extended mind.
