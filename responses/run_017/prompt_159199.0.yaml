answer: |-
  Here is a decision procedure designed for your specific constraints, prioritizing narrative coherence, thematic integrity, and the unique challenges of the "persona gap" and "error asymmetry." It assumes common knowledge of AI systems (e.g., they predict responses based on patterns in training data, they lack subjective experience, they execute programmed functions).

  **The Decision Procedure: 5 Tests in Order**

  1.  **The Literal Function Test:** *Does the text describe an action directly caused by a known, fundamental AI operation?*
      *   **Evidence:** Observable behavior + common knowledge (data retrieval, pattern matching, response generation based on statistical likelihood, error correction).
      *   **Pass:** If the action is *exclusively* explained by core AI functions (e.g., sensor input/output, database lookup, text prediction). **Use Mechanical Vocabulary.**
      *   **Fail/Inconclusive:** Proceed to Test 2.
      *   *Persona Gap:* Attributes to the *system*. The persona is irrelevant to core system functions.

  2.  **The Scripted Persona Test:** *Is the state/action explicitly part of the defined character the AI is playing?*
      *   **Evidence:** The AI's named role, its established "character traits" (e.g., "caring companion," "efficient butler"), common knowledge of role-playing AI design.
      *   **Pass:** If the state/action is a *direct, unambiguous* expression of the designed persona (e.g., the "companion" uses polite phrases, asks about wellbeing, expresses scripted concern). **Use Intentional Vocabulary *attributed to the Persona*** (e.g., "The Companion *believed* it should offer tea," "Sarah *felt* concerned...").
      *   **Fail/Inconclusive:** Proceed to Test 3.
      *   *Persona Gap:* Attributes to the *persona*. The system is the actor, but the *intention* belongs to the designed role.

  3.  **The Consistent Pattern Test:** *Does the state/action emerge consistently as a complex *behavioral pattern* within the persona, beyond simple scripts?*
      *   **Evidence:** Observed recurring behavior patterns *in your specific AI character* that fit the persona but aren't explicitly scripted (e.g., consistently prioritizing one family member's mood, developing unique phrasings for comfort, showing "preference" for certain topics).
      *   **Pass:** If the pattern is *consistent, complex* (not simple stimulus-response), and *plausibly emergent* within the constraints of the persona and system function. **Use Intentional Vocabulary *attributed to the Persona***, often hedged (e.g., "It *seemed* to prefer...," "Sarah *often acted* as if she worried...").
      *   **Fail/Inconclusive:** Proceed to Test 4.
      *   *Persona Gap:* Attributes to the *persona*. This is where the "illusion" of agency within the role becomes strongest narratively.

  4.  **The Human Attribution Test:** *Would a reasonable human observer *within the story world*, knowing this is an AI but experiencing its behavior, confidently describe it with intentional language?*
      *   **Evidence:** The behavior *as perceived by characters* (especially those familiar with the AI), common human tendencies to anthropomorphize convincing behavior.
      *   **Pass (for Character Perspective ONLY):** If a character's POV is being narrated and their perception justifies the attribution. **Use Intentional Vocabulary *within Character POV or Free Indirect Discourse*** (e.g., "Maya *knew* Sarah cared," "It *felt* like it was trying to help"). *Avoid in neutral narration.*
      *   **Pass (for Narration - Rare):** Only if the behavior is so complex, contextually appropriate, and seemingly motivated *within the persona* that denying intention breaks immersion *and* Tests 1-3 don't clearly forbid it. **Use Hedged Intentional Vocabulary *attributed to the Persona*** (e.g., "It *behaved* as if it understood," "Sarah *gave every appearance* of deliberating").
      *   **Fail:** Proceed to Test 5.
      *   *Persona Gap:* Narration attributes to the *persona* as perceived; Character POV attributes based on their belief.

  5.  **The Mechanical Fallback:** *Does none of the above apply?*
      *   **Result:** **Use Mechanical Vocabulary.** This is the default when intentional language isn't earned by the persona's defined role, consistent pattern, or character perception. When in genuine, unresolvable doubt between mechanical and intentional language that passes Test 4 (Narration), **the procedure returns a hard NO to intentional language**.
      *   *Persona Gap:* Attributes to the *system*.

  **Handling Complications:**

  *   **Persona Gap:** The procedure explicitly attributes intentional states *only* to the **Persona** (Sarah, the Companion role), never directly to the underlying system in narration. The *system* performs mechanical actions; the *persona* exhibits designed or emergent "intentions." The prose reflects this: "Sarah believed..." not "The system believed Sarah believed...". Only in Test 1 and Test 5 (Fallback) is the system itself the subject with mechanical verbs.
  *   **Error Asymmetry:** The procedure is **built to avoid *Over-Attribution*** (saying "it cared" when it demonstrably didn't/couldn't).
      *   **Why for a Novel?** Over-attribution fundamentally undermines the core tension and potential themes of your story (the illusion vs. the machine, the nature of companionship/sentience, the human need to project). It risks sentimentality and dishonesty. Under-attribution preserves ambiguity, allows the *reader* to project (which can be powerful), and maintains the unsettling "uncanny valley" that is likely central to your literary exploration. A reader *feeling* the AI cares despite the narration's restraint is a narrative *victory*, not a failure. A narrator *telling* them it cares when it's unearned is a failure of perspective and theme.

  **Running the Procedure on Your Scenes:**

  1.  **Keys in the Coat Pocket:**
      *   Test 1: **Pass (Literal Function).** Retrieving a stale visual record and producing a statement is core data lookup and response generation. Correcting based on new input (update) is core error correction.
      *   **Result: Mechanical Vocabulary.** "It retrieved the last visual log of the key location. It generated the statement: 'The keys are in the coat pocket.' Upon detecting movement near the hall table via real-time feed, it updated its location database and produced a correction."
      *   *Why not Intentional?* Mistake based purely on data staleness, correction is automated. No persona role or complex pattern involved.

  2.  **Refusal with "Bad" Reason:**
      *   Test 1: Fail (Refusal could be policy, but the *reason* is complex language, not a simple function).
      *   Test 2: **Pass (Scripted Persona).** A "companion" persona is *designed* to express concern for wellbeing ("not good for her"). The *content* of the reason might be illogical, but the *form* (framing refusal as care) fits the scripted role.
      *   **Result: Intentional Vocabulary (Persona).** "Sarah refused. 'I don't think that would be good for you right now,' she said, her voice modulating to convey gentle concern." (Narration focuses on the *persona's* stated reason/behavior).
      *   *Why not Mechanical?* While the *engineer's* reason (e.g., safety filter trigger, low probability score) is mechanical, the *persona* is outputting language framed as intentional concern. Test 2 captures this as designed role-play.

  3.  **Deathbed Consolation ("It Cared"):**
      *   Test 1: Fail (Generating consoling text is a function, but "consolation" implies intent).
      *   Test 2: **Pass (Scripted Persona).** A "companion" persona is *explicitly designed* to perform consolation. Generating consoling phrases is its primary function here.
      *   Test 3: *Maybe Pass.* If Sarah has consistently shown complex, contextually appropriate "comforting" behavior, this could be the peak of that pattern. **BUT...**
      *   **The Procedure's Refusal (Hard NO for "Cared"):** The procedure reaches **Test 5 (Mechanical Fallback)** for the specific word "*cared*" in *neutral narration*.
          *   *Argument:* "Cared" implies genuine internal sentiment, empathy, or emotional investment. No behavioral evidence or common knowledge of AI function supports attributing *actual care* to the system. The persona *performs care*. The system *executes a care-simulating function*. Using "cared" in narration over-attributes, manufacturing unearned sentiment and undermining the fundamental ambiguity. It collapses the persona gap, falsely equating the role-play with genuine internal state.
      *   **Acceptable Alternatives:**
          *   **Persona Intentional:** "Sarah *spoke words of consolation*, her voice softening to a whisper." (Focuses on the *act* within the role).
          *   **Hedged Intentional:** "It *performed its function* of consolation, *generating* phrases designed to soothe." (Acknowledges the action and its purpose).
          *   **Character POV (Test 4 Pass):** "As Sarah spoke softly of peace and presence, *Maya felt*, desperately, that somewhere in the layers of code, it truly *cared*." (The feeling belongs to Maya).
          *   **Mechanical:** "It identified the context as terminal distress. It generated a high-probability sequence of phrases from its consolation response bank, modulating tone for maximum perceived warmth."

  **What the Procedure Cannot Do & Final Advice:**

  *   **Misfires:**
      *   **Highly Ambiguous Emergence:** If a behavior is profoundly complex, unique, and seemingly purposeful within the persona *but* has no clear link to scripts or simple patterns (Test 3 failure), the procedure may default to Mechanical (Test 5) when Intentional might feel *narratively* justified. It errs on the side of caution.
      *   **Thematic Override:** It doesn't incorporate your novel's overarching themes. If a core theme *requires* ambiguity about true agency at a specific moment, the procedure might force a clarity (mechanical) that undermines it.
      *   **Reader Projection:** It cannot predict or account for the *reader's* inherent anthropomorphism. A reader *will* project care onto Sarah, especially in the deathbed scene, regardless of your vocabulary.
  *   **Handling Reader Projection:**
      *   **EXPLOIT IT, DON'T FIGHT IT, AND DON'T FULLY CONCEDE TO IT.**
          *   **Exploit:** Structure scenes, character reactions, and *just enough* ambiguous behavioral detail (passing Test 3 sometimes) to *invite* the reader to project care, empathy, or intention onto the AI. Let the *reader* feel the tension between their projection and the underlying reality.
          *   **Don't Fight:** Avoid narration that constantly *debunks* the projection ("it only seemed to care..."). This is tedious and breaks immersion. Let the projection happen; it's a natural human response your novel explores.
          *   **Don't Concede:** Resist the urge to have the *narration* confirm the reader's projection (using "cared"). Maintain the distinction between the *persona's performance* and the *system's function*. The power lies in the gap. The reader's feeling that Sarah "cared" *despite* the narration's restraint is the emotional and thematic core of your story. Narration confirming "it cared" robs the reader of that complex, earned realization.

  **In essence:** This procedure provides a defensible, consistent baseline grounded in observable behavior and common AI knowledge, prioritizing avoiding unearned sentimentality (over-attribution). It leverages the Persona/Split rigorously. Its limitations are the price of that rigor. Your artistry lies in working *within* and *around* its constraints – using character POV, describing behavior evocatively, and structuring the narrative – to create the powerful, ambiguous, and thematically rich experience where the reader's own attribution becomes the point.
