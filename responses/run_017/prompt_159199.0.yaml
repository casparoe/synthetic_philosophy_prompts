  *scribbles notes* The tests should probably start from observable behavior then move to inference. Common knowledge about training data matters (e.g., everyone knows chatbots predict text, not "feel"). But for persona... maybe treat it like an actor's role? The system doesn't believe, but "Sarah" does within the fiction.

