prompt: |-
  I am a novelist, four books in, and my current manuscript has backed me into a conceptual problem that I can only describe in workshop vocabulary, which is beginning to feel like the wrong instrument for it. The novel centres on a widow, Marianne, who consents to having her dying husband reconstructed from his digital remains — decades of email, voice messages, calendars, a lifetime of location metadata — into an embodied conversational presence. Three wrinkles matter for my purposes. First, the reconstruction is a scan-and-reassembly with no continuity of the original brain, so whatever makes the resulting man her husband, it is not the ordinary cause. Second, the company quietly edits: his affair and the religious crisis of his fifties are stripped out to make him easier to live with, so whatever psychological continuity holds, it holds partially and unevenly. Third, late in the book, for an insurance deposition, the archive is run twice; the two instances diverge over the following weeks, one embittered and one serene, and Marianne must decide whether either, both, or neither is owed anything from her.

  I read Parfit's Reasons and Persons (Oxford, 1984) some years ago for pleasure and remember the shape of the teletransporter material: the reductionist claim that a person consists in a brain, a body and a series of connected mental states and events, with no further fact of identity beyond them; the claim that what matters in survival is psychological continuity and connectedness with any cause, including a bizarre one; the fission case in which identity fails but nothing that matters is lost; and the suggestion that survival can itself hold to a reduced degree. I would like those four claims restated as faithfully as you can in the vocabulary I actually work in: character identity carried across a series, recasting a role between instalments, retconning, canon versus canon-adjacent material, fidelity and infidelity in adaptation, one writer completing another's unfinished manuscript, the series bible, point of view and who the narration is attached to, authorial stipulation versus what is true in the world of the book, and the reader's identification with a character and how readily that identification transfers. I am fluent in this vocabulary, so lean on it rather than softening it. Where several of my terms compete for the same job, pick one and say why; and where the translation would quietly assume that fictional identity is stipulated by an author — which would make Parfit's question evaporate entirely — flag that rather than helping yourself to it.

  Then the part I actually need: a residue report. Which of the four claims translate cleanly, which survive only distorted, and which have no expression in craft vocabulary at all. I have two suspicions I would like tested rather than flattered. The first is that this vocabulary cannot say anything first-personal: there is no craft term for what a character anticipates or dreads for himself, because characters do not anticipate, and so the question that gives the whole debate its force may be unstageable in my medium. The second is that craft does contain a continuum — degrees of fidelity, of canonicity, of uptake among readers — but that it is a continuum of the wrong thing, measuring the audience's relation to a character rather than anyone's survival. If both suspicions are right, tell me which failures are defects of my vocabulary and which are signs that the philosophical claim was doing less work than it appears to. Two further constraints. The distinction between what matters to Marianne and what would matter to the man who went into the process is, for this book, the entire crux, so keep those separate throughout and say whether the craft vocabulary can express both or only one. And I am fairly sure my instinct for staging the question — a scene in which the reconstruction passes a test with a memory only her husband could have had — is a cheat; please say what in the argument makes it one, and what an honest scene would have to do instead. Please give me no bibliographies, reading lists, or accounts of who said what where: I want the argumentative structure and the translation, in roughly 1,000 to 1,400 words, written for a competent adult reader with no graduate training in philosophy.
reasoning: |-
  Okay, the user is a novelist with four books under their belt, currently grappling with a conceptual problem in their manuscript. The novel involves a widow named Marianne who consents to reconstruct her deceased husband from digital remains, leading to philosophical questions about identity. The user wants to translate Parfit's philosophical concepts from *Reasons and Persons* into the vocabulary of writing craft. They also need an analysis of how well these translations hold up and whether their suspicions about the limitations of craft vocabulary are valid.

  First, I need to recall Parfit's key claims. The four main points are: reductionism (identity as brain, body, psychological continuity without a "further fact"), psychological continuity as what matters for survival (regardless of cause), fission cases where identity isn't preserved but nothing important is lost, and degrees of survival. The user wants these restated using terms like character identity across a series, recasting roles, retconning, canon vs. non-canon, adaptation fidelity, etc.

  The user has two suspicions. First, that craft vocabulary can't address first-person perspectives because characters don't truly anticipate things. Second, that craft continuums (like fidelity or canonicity) measure audience connection rather than actual survival. I need to test these while keeping Marianne's perspective separate from the reconstructed husband's. Also, they mentioned a scene where the reconstruction passes a memory test is a cheat—need to explain why and what would make it honest.

  Breaking down the translation: 

  For reductionism, I'll compare it to recasting a role. The original actor isn't intrinsically tied to the character; it's about consistency in portrayal. Psychological continuity with any cause is like adaptation fidelity—it's about matching the source material, regardless of how it's achieved. Fission as retconning or divergent adaptations where neither is the "true" continuation. Degrees of survival might map to degrees of canonicity or how much readers accept a version.

  Now, addressing the residue report. Which claims translate cleanly? Psychological continuity and fission might be somewhat translatable, but with distortions. Reductionism is tricky because in fiction, the author's stipulation overrides any "further fact," which Parfit denies. Degrees of survival might map to reader identification levels, but that's about audience, not the character's survival.

  The user's suspicions: First, the lack of first-person terms in craft. Characters don't anticipate; the narrative conveys that. So Parfit's first-person concern (what matters to the person surviving) can't be directly expressed. Second, the continuum in craft (fidelity, canonicity) is about reader reception, not survival. Both suspicions seem correct. The vocabulary's limitation is structural—craft focuses on narrative presentation and audience, not internal experience. Parfit's claims lose force in fiction because authors define identity, undermining the "further fact" debate.

  For Marianne vs. the husband's perspective: Craft terms can handle Marianne's attachment (like reader identification) but not the husband's anticipation. The memory test scene is a cheat because it implies a "further fact" of identity through unique knowledge, which Parfit rejects. An honest scene would show psychological continuity without relying on secret memories, focusing instead on behavioral or narrative consistency.

  Need to ensure the response stays within 1,000-1,400 words, avoids academic references, and uses the user's craft terminology. Highlight where translations assume authorial stipulation, which nullifies Parfit's argument. Emphasize that the philosophical tension arises from the absence of an author in reality, unlike fiction where the author decides.
answer: |-
  Here is the translation and residue report, structured for your novel's needs:

  ### Parfit's Claims in Craft Vocabulary
  *(Flagging author-stipulation issues where they dissolve the question)*

  1.  **Reductionism (No "Further Fact"):** Identity is like a character sustained across a series solely by **narrative continuity**, governed by the **series bible**. There is no "essence" of the character beyond what's established in the **canon** – their documented traits, history, voice, and relationships. Recasting the role (new actor) doesn't inherently break the character if the bible is followed. *Crucially, this translation ASSUMES authorial stipulation. The author/showrunner DECIDES what the bible is and what constitutes faithful portrayal. Parfit argues reality lacks this author – the "bible" just *is* the psychological/physical facts, with no higher authority to decree identity.*

  2.  **Psychological Continuity is What Matters (Any Cause):** What makes a portrayal feel like "the same character" to the audience (**reader identification**) is **fidelity to the established canon**, regardless of *how* that fidelity is achieved. Think of a writer completing another's unfinished manuscript. If the new writer nails the voice, themes, and established character beats (**psychological connectedness**), readers accept it as a continuation. A perfect algorithmic adaptation, even if bizarrely generated, achieves this. The **"cause"** (original author, new author, AI) is secondary to the fidelity of the output.

  3.  **Fission (Identity Fails, Nothing Important Lost):** This is **simultaneous divergent retconning** or **competing adaptations**. Imagine two showrunners inheriting the same series bible and source material, then producing two new seasons independently. Both seasons are **canon-adjacent** (derived from the true canon) but **mutually exclusive**. Neither season is *the* definitive continuation (identity fails), yet each, judged on its own merits, preserves what readers loved about the original character (fidelity, psychological continuity). The audience can engage meaningfully with either; nothing *essential* is missing from the experience of either season alone.

  4.  **Degrees of Survival:** This maps to **degrees of canonicity** or **fidelity in adaptation**. A poorly executed recast, a fanfic with minor OOC moments, a broadly faithful adaptation with some tonal shifts – these represent reduced **uptake of reader identification**. The character "survives" less completely in the audience's sense of connection. It's a spectrum from perfect fidelity (full survival) to unrecognizable parody (non-survival).

  ### Residue Report: What Translates, What Distorts, What Vanishes

  1.  **Reductionism (No "Further Fact"):**
      *   **Translation:** Clean *structurally* via series bible/canon concept.
      *   **Distortion:** Assumes authorial stipulation. In craft, the author *is* the authority decreeing what's canon and what constitutes continuity. **This dissolves Parfit's core question.** Parfit denies reality has this authorial decider; the "further fact" is argued to be an *illusion* we project *onto* the psychological/physical facts. Craft vocabulary inherently *contains* the stipulation Parfit argues *doesn't exist* in reality. This is a **fundamental defect of the vocabulary** for capturing the *philosophical tension*.
      *   **For Marianne/Husband Distinction:** Craft can express Marianne's *perception* of fidelity to the "bible" (her lived experience of her husband). It **fails utterly** to express the *original husband's* perspective *without* the authorial stipulation that defines fictional identity. The "further fact" worry was *his* potential perspective.

  2.  **Psychological Continuity is What Matters (Any Cause):**
      *   **Translation:** Clean via **fidelity to canon**, regardless of cause (original writer, new writer, algorithm). The cause's "bizarreness" is irrelevant if output fidelity is high. This holds well for both Marianne (judging the output) and the original husband's "survival" *as perceived by others*.
      *   **Distortion:** Subtle. Craft focuses on *external judgment* of fidelity (authorial intent, reader reception). Parfit's claim is about what matters *for the subject anticipating survival*. The vocabulary describes *whether others will recognize it as the character*, not *what it's like to BE the continued subject*. This links to your first suspicion.
      *   **For Marianne/Husband:** Clean for Marianne's judgment. Can express *what might matter to the original husband* only indirectly, as *"Would others recognize a continuation as me?"*, **not** *"Will that continuation BE me?"*.

  3.  **Fission (Identity Fails, Nothing Important Lost):**
      *   **Translation:** Structurally clean via **competing adaptations** or **divergent retcons**. Neither branch is the "true" canon continuation (identity fails), but each preserves the core character for its audience (nothing important lost *for engagement*).
      *   **Distortion:** Significant. The "nothing important lost" in craft is about **reader experience and engagement**. Parfit's "nothing important lost" is about *what matters for the subject pre-fission*. He argues the subject shouldn't fear fission because *both* successors will have full psychological continuity *from their perspective*. Craft vocabulary has **no way to model the subjective perspective of the successors**. It describes the audience's view of the *products* of fission, not the internal reality *for the products*.
      *   **For Marianne/Husband:** Can describe Marianne's dilemma (choosing between two compelling but incompatible versions). **Cannot express** what the original husband *should* have felt about impending fission, or what it's like *for the diverged instances* to wake up. Focuses on Marianne's POV attachment.

  4.  **Degrees of Survival:**
      *   **Translation:** Clean on the surface via the **continuum of fidelity/canonicity/reader identification**.
      *   **Distortion:** Fundamental and confirms your second suspicion. The continuum measures **audience reception** (strength of reader identification, acceptance of canonicity). Parfit's degrees measure **the objective robustness of psychological connectedness/continuity** *for the subject*. A character can be *perfectly* continuous (high survival) but poorly written, breaking reader identification (low craft survival). Conversely, a wildly OOC character might be beloved (high craft "survival") despite low objective continuity. **The craft continuum measures the audience's relationship, not the character's (or person's) actual survival status.** This is a **defect of the vocabulary** for Parfit's purpose.

  ### Testing Your Suspicions

  1.  **Suspicion 1: Vocabulary lacks first-person terms (anticipation/dread) because characters don't anticipate.**
      *   **Verdict: Confirmed.** Craft vocabulary excels at depicting *a character experiencing* dread or anticipation *narratively*. But it has **no terms for the *content* of that dread/anticipation concerning personal identity/continuity *from the character's own subjective viewpoint*.** We describe the *narration of* the feeling ("Marianne dreaded the activation") or *what* they fear ("he feared he wouldn't be himself"), but the vocabulary itself doesn't conceptualize "being oneself" as a *problem for the character* in the way Parfit does. It assumes identity is given by the narrative. This is a **structural defect** of the vocabulary for Parfit's first-personal questions. It forces the exploration *onto* Marianne (observer) and away from the reconstruction (subject).

  2.  **Suspicion 2: Craft continuum measures audience relation, not survival.**
      *   **Verdict: Confirmed.** As shown in the Degrees of Survival residue, the craft continuum (fidelity, canonicity, reader ID) is fundamentally **reception-based**. It measures the *audience's* (or Marianne's) connection, belief, or acceptance. Parfit's continuum is about the *objective facts of psychological connection* constituting survival *for the subject*. **This isn't just a vocabulary defect; it reveals that the craft framework *replaces* the metaphysical question of survival ("Is it him?") with the phenomenological/experiential question ("Does it *feel like* him to Marianne/us?").** Parfit's claims about degrees of survival *do* translate, but the translation **distorts them into claims about audience/mourner experience**, which was only one *part* of Parfit's concern.

  ### The Memory Test Scene: Why it Cheats, What to Do Instead

  *   **Why it Cheats:** The memory test relies on the **implied "further fact"** Parfit rejects. The unique, private memory acts as a magic token of the "real" identity, smuggled in as evidence of the soul or essential self. It suggests identity verification requires accessing something *beyond* the psychological continuity potentially available in the digital archive (e.g., a specific brain state or unique essence). Parfit argues identity *just is* psychological continuity (with no extra token). If the archive *could* produce the memory reliably, it *would* be part of the psychological continuity. Relying on it as a special test contradicts reductionism.
  *   **What an Honest Scene Would Do:** Focus on **psychological continuity/connectedness *manifested in real-time interaction***, judged by Marianne *without* a secret "token". Instead of a test, show:
      1.  **Patterns:** Does he react to mundane situations (spilled coffee, a bad joke, the way light falls in the room at 4 pm) in ways deeply consistent with the husband's documented patterns and Marianne's lived experience?
      2.  **Connection:** Does the *flow* of conversation, the timing of pauses, the specific associations he makes, *feel* like connection with her husband? Does he understand *her* in the specific way her husband did?
      3.  **The Editing's Impact:** Where does the editing *break* continuity? Does she notice the *absence* of the affair's shadow, the *lack* of the religious tension, creating a discontinuity that feels jarringly inauthentic despite surface fidelity elsewhere?
      4.  **The Fission Dilemma:** Show the *divergent* continuities developing. Instance A dwells on perceived past slights (bitterness path), Instance B finds peace in curated positive memories (serenity path). Neither path is "more authentic" based on a secret; both are *possible* continuations from the edited archive. Marianne's choice isn't "which is real?" but **"Which continuity, forged from his digital remains, can I bear to live alongside, and which do I feel *obligated* to, based on my love for the original pattern?"** The scene emphasizes the *constructedness* and the *judgment of fidelity/continuity in the present*, rejecting the secret token.

  **In essence:** The craft vocabulary brilliantly handles Marianne's *experience* (observer POV, judgment of fidelity, narrative attachment, moral dilemma). It struggles profoundly with the *subjective perspective* of the original husband and the reconstructions (the "what is it like for *them*?"), and it inherently frames continuity/survival through authorial stipulation and audience reception, not metaphysics. Your instincts about its limitations, especially regarding the first-personal core and the continuum's focus, are correct. The memory test cheat reveals the vocabulary's (and perhaps our intuition's) latent desire for that "further fact." An honest scene leans into the vocabulary's strength: depicting Marianne wrestling with the observable *manifestations* of continuity and the emotional/moral weight of her attachment to the original pattern.
