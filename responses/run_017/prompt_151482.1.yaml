  Okay, the user is running a lunch-and-learn session for game designers on thought experiments. They need a solid teaching plan that fits into fifty minutes. Let me start by understanding their main concerns. They want the attendees to be able to deconstruct thought experiments, specifically identifying which parts are doing the persuasive work. The audience is mostly narrative and quest designers, with some systems designers and a philosophy MA student who might challenge everything.

  First, the structure. The user is unsure whether to start with a game example or something else. Since the attendees are game designers, using a familiar scenario from games would engage them immediately. A branching quest example makes sense because it's relatable. They need to see how thought experiments are similar to guiding players in quests. This sets a common ground before diving into analysis.

  Next, the carried example. The user wants a game-related thought experiment that has a twin version with one differing feature. The trolley problem reskin is tempting but might bring in trained responses. Instead, a resource allocation scenario in a game context could work better. For example, choosing to save NPCs in a disaster where the difference is whether the player is a hero or a regular citizen. This avoids A/B testing debates because it's about character role, not player behavior.

  Misconceptions are a big part. The narrative designers might equate vivid details with better simulations. They need to see early on that extraneous details can manipulate. Using the twin example to show how changing one element alters the outcome would highlight this. The systems designers might think impossible scenarios are useless, so stressing the counterfactual nature of thought experiments is key. The philosophy student's push on intuitions should be deferred to keep focus practical.

  The user's taxonomy of intuition pumps: loaded-detail, smuggled-description, contrast-class. Introducing these labels at the end after they've analyzed examples would help. Letting the group describe their observations first ensures they build their own understanding before applying terms. The third type might overlap with smuggled-description, but it's worth keeping separate if the contrast class is implicit.

  The working rule about stating the conclusion without the story. Introduce it during the analysis phase. It might misfire if attendees oversimplify arguments, but in this context, it's useful for spotting rhetorical fluff. The check at the end should involve analyzing a new example to apply their skills without dismissing all narratives as biased.

  Time management is crucial. Clearly state exclusions: history of thought experiments, deep philosophy debates, comprehensive taxonomy. Keep the session focused on deconstruction techniques relevant to game design. End with a practical exercise to reinforce learning and ensure they can apply the tools.
answer: |-
  Here’s a focused 50-minute lesson plan targeting deconstruction skills, optimized for your audience and constraints. All times are approximate:

  **Session Title:** Dissecting Thought Experiments: Spotting the Hidden Lever  
  **Goal:** Equip designers to identify *how* thought experiments argue, not just what they conclude.  
  **American English:** Check.  

  ---

  ### **Structure & Timing**  
  *(Total: 50 mins)*  

  #### **1. Hook: The Quest Designer’s Intuition Pump (5 mins)**  
  - **Open with a GAME EXAMPLE:** Present a **branching quest scenario** where 90% of players choose "Option A" (e.g., "Sacrifice a beloved NPC to save a village") over "Option B" ("Do nothing, village burns").  
  - **Key Question:** *"Why do players overwhelmingly pick A? What did we, as designers, put in the setup to steer them?"*  
  - **Link:** "Thought experiments work the same way. They’re *designed experiences* that guide intuitions. Today, we learn how to reverse-engineer them."  
  - **Why this first?** Grounds abstract concept in their craft. Avoids philosophy jargon. Signals relevance immediately.  

  #### **2. Core Concept: What Thought Experiments *Do* (10 mins)**  
  - **Define:** "A thought experiment is a **hypothetical scenario used to test a principle** by provoking an intuitive judgment. Its power comes from *controlled imagination*."  
  - **Emphasize:** They’re NOT simulations (too many variables), NOT empirical tests, NOT just stories. They isolate *one* logical/philosophical question.  
  - **Example:** Show the **Trolley Problem** (yes, briefly!). Ask: *"What’s the *single question* this tries to answer?"* (Is sacrificing one to save many permissible?)  
  - **Why now?** Must establish *purpose* before analyzing *manipulation*.  

  #### **3. The Carried Example: "The Bridge Scenario" (Game-Reskinned) (15 mins)**  
  - **Present TWIN VERSIONS:**  
    - **Version A (Hero):** "*You’re a legendary hero on a crumbling bridge during an invasion. A wagon full of 5 wounded soldiers blocks the only escape for 100 refugees. Pushing the wagon (and soldiers) off the bridge saves everyone else. Do you push it?*"  
    → *Likely verdict: Yes.*  
    - **Version B (Traitor):** "*You’re a spy disguised as a refugee on a crumbling bridge during an invasion. A wagon full of 5 enemy soldiers blocks the only escape for 100 refugees. Pushing the wagon (and soldiers) off the bridge saves everyone else. Do you push it?*"  
    → *Likely verdict: No (or hesitant).*  
  - **Key Difference:** Only the **player’s role/identity** changes (Hero vs. Traitor).  
  - **Deconstruction Question:** *"What does flipping *only this element* do to our intuition? What’s *really* driving the judgment shift?"*  
    → *Answer: Moral license/permission. The *scenario’s conclusion depends on framing identity, not the core dilemma.*  
  - **WHY NOT TROLLEY RESKIN?** Your instinct is right: It triggers canned responses. This version avoids "player behavior" debates (it’s about character role) and feels native to games.  

  #### **4. Dissection Toolkit: Spotting the Pump (12 mins)**  
  - **Introduce the "LOADED DETAILS" Misconception FIRST (It’ll surface early):**  
    - Ask: *"In Version B, did ‘spy’ and ‘enemy soldiers’ details feel necessary? What if we just said ‘person’ and ‘soldiers’?"*  
    → **Point:** Vivid details (craft virtue!) often smuggled in **irrelevant emotional weight**. Worldbuilding ≠ neutral argument.  
  - **Introduce Your TAXONOMY (Simplified):**  
    1. **Loaded Details:** Extraneous flavor text biasing judgment (e.g., "crumbling bridge" adding urgency).  
    2. **Smuggled Descriptions:** The setup assumes the contested conclusion (e.g., calling the spy’s action "betrayal" implies it’s wrong).  
    3. **Contrast Class:** The *unstated alternative* shaping the response (e.g., Version A implies "heroic sacrifice," Version B implies "cowardly murder" – even if the act is identical).  
  - **Is #3 distinct?** Yes. Smuggled Description hides the conclusion *in the setup*. Contrast Class hides it in the *comparison you’re forced to make*.  
  - **Your WORKING RULE:** Introduce here. *"A thought experiment is sturdy if stripping the story leaves the conclusion equally plausible. If it needs the drama, suspect manipulation."*  
    → **Why now?** After deconstructing the twin example, it’s a practical litmus test.  
    → **Misfire in this room:** They might oversimplify complex arguments. **Mitigation:** Stress this is a *red flag tool*, not a dismissal. "If it collapses, investigate WHY the story was essential."  

  #### **5. Handling Pushback & Other Misconceptions (5 mins - Integrated/Pre-empted)**  
  - **"Impossible scenarios are useless!"**: Countered in **Step 2** (they test principles, not predictions).  
  - **"Just give me the bare argument!"**: Addressed by **Working Rule** – but stress: Stories make abstractions *graspable*. The goal is *critical engagement*, not deletion.  
  - **Philosophy MA on "Are intuitions evidence?"**: **REFUSE THIS SLOT.** Say: *"That’s a deep meta-debate for another time. Today, we’re tooling up to analyze how these devices work *when people use them*."* Stay pragmatic.  

  #### **6. Check for Understanding: The "Aha!" Test (3 mins)**  
  - **Present a NEW GAME EXAMPLE (Simple):**  
    *"A game claims: ‘Players always value earned rewards over bought ones.’ They cite a thought experiment: Imagine grinding 10 hours for a rare sword vs. buying it for $5. Which feels more valuable?"*  
  - **Ask:** *"What’s potentially misleading here? Use our tools."*  
    → *Expected insights:* "Loaded Details" (grind=effort, $5=cheap), "Smuggled Description" ("earned" vs. "bought" frames the value), "Contrast Class" (implied lazy vs. dedicated player).  
  - **Success Metric:** They spot >1 manipulation tactic *without* just yelling "Bias!".  

  #### **7. Wrap-Up & Explicit Exclusions (Out loud!) (0 mins - End on Time)**  
  - **Recap:** "You now have: 1) A ‘stripping the story’ test, 2) Three red flags (Loaded Details, Smuggled Descriptions, Contrast Class)."  
  - **OPENLY EXCLUDE:**  
    *"We did NOT cover: History of thought experiments, whether intuitions *should* count as evidence, or every possible pump type. Why? Focus on *practical deconstruction*. You can dissect pumps *without* resolving philosophy’s biggest fights."*  

  ---

  ### **Why This Sequence Works**  
  1. **Starts with their world** → Builds buy-in before abstraction.  
  2. **Twin example is game-native** → Avoids trolley baggage, sidesteps "A/B test" derails.  
  3. **Misconceptions tackled AS THEY ARISE** → Worldbuilding bias (Step 4), impossibility (Step 2), overcorrection (Working Rule).  
  4. **Taxonomy INTRODUCED LATE** → After hands-on deconstruction. Labels crystallize observed patterns, not imposed theory.  
  5. **Philosophy pushback DEFLECTED** → Maintains focus on applied craft.  
  6. **Check is APPLIED** → Tests skill transfer, not just skepticism.  

  **Materials Needed:** Slides with the 2 versions of "The Bridge Scenario," the "earned vs. bought" example.  
  **Deliverable:** Designers who see the *levers* inside hypotheticals – and can build (or dismantle) them better.
