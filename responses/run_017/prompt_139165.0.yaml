  First, let's consider the actuarial claim - this seems central. The doorway follicle scan, the daily sample rituals, and the heart-disqualified co-worker all show society treating genomes as risk profiles, not fate. The physician falsifying results is particularly telling - he knows the actuarial record isn't destiny. 

  But the blueprint claim... does Gattaca really need it? Vincent beating his brother in swimming suggests physical potential isn't fixed by genes. Yet the title GATTACA literally spelling out nucleobases complicates this - the film can't fully escape the code metaphor it critiques. 

  Ah, the user's distinction between genetic essentialism and genetic audit is key. The paraphernalia of samples and scanners shows legibility is manufactured, not inherent. Like a credit score, it's an administrative tool. The closing narration about "human spirit" might undermine this though - is it a profound challenge or just a loophole?

  For the philosophical addition... the film makes concrete how institutions materialize metaphors. The stored samples, the incinerated medal - these visceral details show the human cost of audit systems in ways abstract arguments can't. The brother's confession scene is brilliant here - it reveals Vincent's first win was willpower, not physical superiority.

  I should be fair to the film's ambiguities. Vincent's triumph challenges the system's verdict on him personally, but leaves the audit structure intact. And that title... it's hard to ignore how the film revels in genetic coding even while critiquing it. The physician scene supports the audit reading strongly though - his son proves genes aren't destiny.

  The user wants faithfulness to both the film and their reading. I'll highlight where Gattaca exceeds standard critiques (showing institutional legibility) and where it resists (through its lingering code romance). The philosophical surplus is how it embodies the audit concept - we feel the scrubbing, the scanning, the falsified test in ways theory alone can't deliver.
answer: |-
  Your suspicion is profoundly correct: *Gattaca*'s dystopia functions almost entirely on the **actuarial/dossier claim**, actively undermining the **program/blueprint claim** while implicitly relying on the discovered biochemical reality of the **cipher claim**. The film’s critique is less about genetic determinism and more about the institutional machinery of **genetic audit**. Let’s test this through its scenes:

  1.  **The Doorway Follicle Scan & The Daily Ritual:** The instantaneous readout of Vincent's "invalid" status from a stray eyelash isn't decoding his destiny; it's accessing a pre-compiled actuarial *dossier*. It flags a statistical probability (heart defect, life expectancy: 30.2 years), not a developmental program. Vincent’s daily scrubbing, borrowed blood, urine bags, and synthetic skin grafts are elaborate countermeasures against *audit*, not against his genetic "blueprint." He *is* capable of the work; the system merely denies him access based on probabilistic risk assessment. The machinery (scanners, databases, sample collectors) exists to *make* the body auditable, transforming molecular sequences into administrative facts.

  2.  **The Swimmer & The Games of Chicken:** Jerome Morrow (the "valid" silver medalist) is the ultimate counterargument to the blueprint claim. Genetically selected for athletic perfection, he *lost*. His suicide attempt ("I only left enough for the police to identify") underscores the gap between genetic potential and actual outcome. The first swimming race against Anton seems to validate determinism—Anton wins. But the *second* race, years later, reveals the truth: Vincent wins through sheer will and endurance ("I never saved anything for the swim back"). Anton’s stunned confession, "How are you doing this Vincent?!" and Vincent's reply, "You want to know how I did it? I never saved anything for the swim back," exposes the fallacy of the blueprint. Genes set parameters, not outcomes; victory was forged in spirit and strategy, not decoded from DNA.

  3.  **The Co-worker & The Physician:** The "valid" co-worker Irene carries a gene raising her cardiac risk just above the insurance threshold. Her genome isn't a faulty program preventing her from working; it's a *dossier entry* disqualifying her administratively. The physician Dr. Lamar’s quiet falsification of Vincent’s final test is crucial. He doesn’t do it because he believes Vincent defied his genes; he does it because *his own genetically "perfect" son* failed to meet expectations ("My son... he’s not all that they promised"). Lamar understands the audit system is fallible, probabilistic, and cruel—not an oracle of destiny. His act is human compassion subverting institutional audit.

  4.  **The Envelope, the Medal, and the Incinerator:** Jerome leaving Vincent a lifetime supply of validated samples isn't handing over a better genetic program; it's providing the *audit documentation* needed to navigate the system. Vincent taking only an envelope (a symbolic dossier) and Jerome’s silver medal (proof of triumph *beyond* genetics) to the incinerator is the final repudiation. Jerome’s immolation declares that the *value* of his life wasn’t in his auditable genome, but in his agency and sacrifice. Burning the samples destroys the audit trail, not the man.

  5.  **The Closing Narration:** "I belonged to a new underclass... determined by a blood test... no gene for the human spirit." This isn't a mystical addendum; it's the core thesis. The "spirit" is the unquantifiable, unauditable element of will, drive, courage, and love that the actuarial system cannot capture or predict, and which ultimately determines achievement within the constraints biology provides.

  **Where the Film Resists Your Reading (Slightly):**
  *   **The Title (GATTACA):** It literally spells itself from nucleobases, reveling in the cipher metaphor. It *does* flirt with the romance of the code, even as the narrative dismantles its deterministic interpretation.
  *   **Vincent's Triumph Scope:** Does he challenge the *system* or just his *place* within it? He impersonates a Valid, using its tools. His success proves audit wrong *for him*, but leaves the institutional machinery intact. The critique is immanent, not revolutionary.
  *   **The "Spirit" Dodge:** Invoking an uncoded spirit *could* be seen as conceding the genome is otherwise a code/blueprint. The film walks a tightrope: it needs the cipher/actuarial reality but rejects the blueprint. The "spirit" is the locus of agency *within* biological constraints, not a supernatural force.

  **What the Film Adds to the Philosophy:**
  The philosophy debates the *metaphor's* validity. *Gattaca* shows the *institutional reality* built *upon* that metaphor, regardless of its literal truth. It materializes the consequences of genetic audit:
  *   **The Bodily Toll:** The scrubbing, the needles, the synthetic skin – the physical labor required to *falsify* the auditable self.
  *   **The Rituals of Legibility:** The daily urine test isn’t science; it’s a bureaucratic sacrament confirming institutional power over the body-as-document.
  *   **The Human Cost of Efficiency:** The system discards Irene, crushes Jerome, and nearly destroys Vincent not because genes are destiny, but because probabilistic risk assessment is administratively convenient. Lamar’s quiet rebellion reveals the human resistance possible *within* the system when its reductivism is personally witnessed.

  **Conclusion:**
  *Gattaca* doesn’t need the **program/blueprint claim**. Its world runs on the **actuarial/dossier claim**, made operationally possible by the biochemical reality of the **cipher claim**. The film’s genius lies in exposing **genetic audit** – not genetic essentialism – as the engine of dystopia. Legibility *is* an institutional achievement: scanners, databases, job categories, and sample rituals *manufacture* the auditable subject. The genome functions like a credit score: a reductive, administratively useful metric that dictates life chances without claiming to be the sum of the person. *Gattaca*’s enduring power comes not from rejecting the genetic code, but from showing how easily its *metaphorical* use as a blueprint can be weaponized into an *institutional practice* of audit that confuses statistical risk with human worth, all while the uncoded, unauditable "human spirit" – the capacity for will, sacrifice, and love – persistently leaks through the cracks. The philosophical argument questions the metaphor; the film viscerally demonstrates why the metaphor is dangerous when made flesh in institutions.
