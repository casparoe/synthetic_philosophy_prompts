  1. **Hard constraint:** Project to \(\mathcal{C}\) (as above).
  2. **Noisy channel:** If the message is a sample from the true conditional, use Bayesian updates with Binomial likelihood.
  3. **Estimate:** Treat as moment-matching (e.g., via IPF).

  **Distortions:** The "gut pull" lacks a formal counterpart—it’s an intuition not encoded in \(\mathcal{C}\). In ML, it only emerges from I-projection’s regularization.

  **Clean Mappings:** The prior, constraint set \(\mathcal{C}\), projection methods, and failure of partition-based updates translate directly. I/M-projections align with standard optimization in latent-variable models.

  **Key Casualty:** The unqualified notion of "updating on a conditional" is underspecified. Your framework forces provenance clarity, revealing ambiguity in the original.

