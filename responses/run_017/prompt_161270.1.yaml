prompt: |-
  hey — you're a political philosopher who's spent way too long in the equality-of-what debates and who, weirdly, also did a couple of years of practical mechanism design for public agencies. Before you write anything polished, do some messy brainstorming and take your time: I want you to actually think about what belongs on this list, not recite the standard four views with their standard objections. Where you think a requirement is genuinely non-negotiable, say so flatly; where you're unsure, say why.

  Context, because adequacy is relative to a job. I'm on a committee that has to build an actual allocation procedure. We have a fixed, too-small supply of a one-shot intervention — call it a boost — with four features that matter: you get it at most once, its effects are permanent, it cannot be sold, given away, banked or transferred, and what it does for you depends heavily on your body and your circumstances. There's no secondary market that could reallocate it afterwards and no way to undo a decision. We need two things: a currency (one measurable quantity in which we compare how well off or how advantaged each applicant is) and a rule for what to do with those comparisons (equalize, prioritize the worst off, get everyone over some floor, whatever). I'm asking only about the currency.

  Before I let anyone on the committee propose a metric, I want the spec. What does a candidate currency of egalitarian comparison have to be able to do to count as adequate for this job? For each requirement give me the case or consideration behind it — the case, not just the label. Mark each requirement as non-negotiable for us or as a preference that really only belongs to one family of views. And flag any subset of the requirements that you think can't all be satisfied together: if the list is jointly unsatisfiable, then the interesting result is which requirement we should drop, so tell me which pair or triple is doing the excluding and what each one costs to give up.

  Cases I already know the currency has to handle, including a couple I invented because our intake really does produce things like them:

  - Same bundle, different bodies: two applicants with identical income, insurance and housing, one of whom needs dramatically more of all of it to reach the same level of mobility, or of being able to work at all. Does the currency track what people have or what they can do with what they have, and does it have any answer when the conversion rates differ for reasons nobody chose?
  - Expensive tastes on purpose: someone who, after our rules were published, deliberately trained themselves to need something rare and costly so as to count as worse off.
  - Sour grapes: someone whose reported satisfaction is very high, but only because their expectations collapsed to fit a deprived life twenty years ago.
  - The coupled case (mine, but we've had two): two applicants whose physiologies are linked such that a boost given to either one partly improves the other, and neither can be treated without affecting the other. What is the unit the currency is measured over, and does the currency have anything to say when the units aren't cleanly separable?
  - The time-unit problem: a 22-year-old and an 82-year-old; a patient who is fine now and will be badly off in five years; someone who was badly off their whole short life and died at 30. Is the currency summed over a whole life, averaged per period, evaluated at a moment, or discounted somehow? Does a short bad life count as a smaller inequality than a long one?
  - The unresponsive applicant: someone in a permanent coma, no advance directive, no proxy, and we still have to assign them a number.
  - The not-yet-there applicant: a pregnant person, where part of the benefit would land on someone who doesn't exist yet, and a budget we're setting now for people born in 2060.
  - Risk: we must rank people before we know who actually responds well to the boost, and later we find out. Does the currency want to be ex ante or ex post, and what breaks if it has to be both?

  Constraints that are mine rather than philosophical, and that I want you to treat as candidate requirements rather than as mere practicalities you can wave away: it has to be computable from information our intake can actually get (no invasive health audits, no demanding that people disclose things that would humiliate them, no home visits for 40,000 applicants); it has to survive applicants strategically shaping what we can observe; and it has to be stable enough that two different intake officers give the same applicant roughly the same number.

  Things I want argued rather than assumed: whether sensitivity to brute luck or to responsibility is a genuine requirement or a sectarian taste of one camp; whether any no-envy condition belongs on the list at all; whether the currency has to be the same one we'd use if supply were unlimited — i.e. whether equality is the whole story here or just triage on top of something else; whether the metric has to avoid ranking whole lives as better or worse in a way that demeans the people being ranked; and whether administrability is a real desideratum or just a grubby concession to the fact that we're a committee with a deadline.

  At the very end, and briefly — one short paragraph or a compact table, no bibliography and no citations, I know the names and I don't want a reading list — score the big families of views against your own list: resources or primary goods, welfare or opportunity for welfare, capabilities and functionings, access-to-advantage and other luck-adjusted views, the relational or no-one-gets-to-dominate view, and plain sufficientarianism. Then tell me which single requirement on your list does the most work in knocking candidates out. Keep at least 80 percent of the answer on the criteria themselves and their motivating cases; the scorecard is an afterthought.
reasoning: |-
  Hmm, this is a complex request about designing a currency for allocating a scarce medical intervention. The user wants me to think through the requirements thoroughly, not just recite standard theories. They're on a committee facing real-world constraints like computability and strategic behavior.

  First, I need to understand the intervention's characteristics: it's permanent, non-transferable, one-time, and effectiveness depends on individual physiology and circumstances. The allocation is final with no redo or secondary market. 

  The user has provided several challenging cases that any adequate currency must handle: same resources but different conversion rates (due to bodily differences), expensive tastes, sour grapes adaptation, physiologically linked couples, time/age considerations, comatose patients, future beneficiaries, and risk uncertainty. Plus practical constraints around computability, gaming resistance, and inter-rater reliability.

  Key philosophical tensions I need to address:
  - Should the currency track resources or outcomes?
  - How to handle responsibility vs brute luck?
  - Is envy-test relevant?
  - Should equality be the sole consideration or just part of triage?
  - Can we avoid demeaning rankings?
  - Is administrability a genuine requirement?

  For non-negotiables, anything that prevents basic functionality seems essential: computability (without this we can't implement), stability (without consistency it's arbitrary), and gaming-resistance (or the system collapses). The currency must also handle bodily differences and linked couples - these are real cases in their intake.

  Tricky trade-offs emerge between:
  1. Sensitivity to individual variation vs computability (detailed assessments are expensive)
  2. Responsibility-sensitivity vs gaming-resistance (judging "choice" invites manipulation)
  3. Whole-life perspective vs moment-of-decision needs (we allocate now with partial information)
  4. Non-demeaning approach vs necessary differentiation (ranking requires some hierarchy)

  For the scorecard:
  - Resources/primary goods fail bodily difference cases
  - Welfare metrics get wrecked by expensive tastes and sour grapes
  - Capabilities handle bodily differences well but struggle with linked couples
  - Luck-egalitarian views become administrative nightmares
  - Relational equality lacks operational guidance
  - Sufficientarianism avoids demeaning but provides no intra-sufficient differentiation

  The knockout requirement is computability under constraints - most elegant theories fail the 40,000-applicant test. Second is handling bodily differences - we can't ignore how bodies convert resources.

  Ultimately I'll structure this as: 
  1) Non-negotiable operational requirements 
  2) Essential justice-sensitive features 
  3) Desirable but negotiable elements 
  4) Known trade-off clusters 
  5) Brief scorecard of theories
  6) The knockout punch - computability
answer: |-
  Here's a messy, first-principles brainstorm of requirements for your currency, grounded in your cases and constraints. I'm prioritizing *what breaks the system* over philosophical elegance. Requirements are clustered by failure modes.

  ### Non-Negotiables (System Collapses Without These)
  1. **Bodily Difference Sensitivity**: *Must* reflect how the same resources translate differently to function due to unchosen physiology (e.g., your "same bundle, different bodies" case). If it doesn't, we allocate boosts to people who can't benefit meaningfully, wasting the intervention. Failure here makes the currency useless for its purpose.  
  2. **Non-Gameability by Design**: *Must* be resistant to strategic manipulation of inputs (e.g., "expensive tastes on purpose"). If applicants can inflate their score by altering observable traits (income, consumption, reported preferences), the system is corrupted. Intake data must be "costly to fake" (e.g., verified medical history > self-reported pain).  
  3. **Computability & Stability**: *Must* derive from feasible intake data (no full-body scans, no deep psych evals) and yield consistent scores across officers. If it requires unattainable data or produces erratic rankings, the procedure is arbitrary and legally indefensible. Stability is part of justice here.  
  4. **Ex Ante Actionability**: *Must* rank applicants *before* knowing boost outcomes (the "Risk" case). If it requires perfect knowledge of who benefits, it’s useless for allocation. We need a proxy for expected benefit.  

  ### Essential (Core Justice Work – Dropping These Undermines Legitimacy)
  5. **Brute Luck Sensitivity**: *Must* distinguish disadvantage from unchosen circumstances vs. choices (e.g., disability vs. expensive tastes). Not because "responsibility" is inherently sacred, but because ignoring brute luck (a) misallocates boosts (helping strategic gamers over genuinely constrained), and (b) violates public reason – your committee would be crucified for prioritizing someone who chose deprivation.  
  6. **Non-Adaptation Requirement**: *Must* not penalize people for lowering expectations to cope ("sour grapes"). If satisfaction or preferences anchor the metric, we overlook grave deprivation. This isn’t welfarism vs. resourcism – it’s about *not rewarding oppression*.  
  7. **Interpersonal Linkage Handling**: *Must* account for linked physiologies ("coupled case"). The currency must assign value to the boost *in context*, e.g., by treating the pair as a unit or quantifying spillover effects. Ignoring this wastes boost efficacy.  
  8. **Time-Slice Relevance**: *Must* focus on *current* disadvantage + expected future trajectory *without* full life summation. Full-life views fail the "82-year-old vs. 22-year-old" case (is past suffering irrelevant?) and are uncomputable (future unknowns). Currency should reflect *present need* + *expected benefit duration* (e.g., boosting a 22-year-old with chronic pain prevents more lifetime disadvantage).  

  ### Negotiable (Philosophically Contested but Pragmatically Weighted)
  9. **Sufficiency Floor**: *Should* identify a threshold of "enough" function (e.g., basic mobility, freedom from agony). But this is a committee choice – adequacy isn't dictated by philosophy. Useful for triage if boosts can lift people over a critical line.  
  10. **Anti-Demeaning Constraint**: *Should* avoid implying some lives are "worth less." But any prioritization ranks – the key is *grounding in unchosen disadvantage*, not overall life value. Resources/capabilities fare better here than welfare.  
  11. **Future Beneficiary Inclusion**: *Could* discount benefits to future persons (e.g., fetus or 2060 cohort), but this risks underinvestment. Pragmatic answer: include *expected* future benefit to existing persons (e.g., parent's functioning gain from fetal boost) or treat future cohorts separately. Not a currency design flaw per se.  

  ### Trade-Off Clusters (Pick Your Poison)
  - **Cluster A: Sensitivity vs. Robustness**  
    Bodily Difference Sensitivity (1) + Brute Luck Sensitivity (5) require fine-grained, hard-to-game data. But Computability (3) + Non-Gameability (2) demand simpler, verifiable inputs. *Cost of dropping 1/5:* Misallocation, injustice. *Cost of dropping 3:* System inoperable.  
    → *Resolution:* Use objective function metrics (e.g., mobility scores) + diagnostic categories. Avoid subjective welfare.  

  - **Cluster B: Time vs. Knowledge**  
    Time-Slice Relevance (8) needs *current* data, but Ex Ante Actionability (4) requires *predicting* benefit duration. Full-life views (dropped here) avoid this but fail computability. *Cost of ignoring future benefit:* Wasting boosts on those with short lifespans.  
    → *Resolution:* Proxy with age-adjusted current function + prognosis (e.g., life expectancy tables).  

  - **Cluster C: Individualism vs. Efficacy**  
    Interpersonal Linkage (7) may require grouping applicants, violating "unit of account" individualism. But ignoring it wastes the boost. *Cost of grouping:* Harder to justify to individuals.  
    → *Resolution:* Quantify boost efficacy per applicant *including spillovers*. Treat coupled pairs as a single "application unit."  

  ### The Knockout Punch: Computability
  **Computability (3)** is the silent killer. Most elegant theories (e.g., finely calibrated capabilities, lifetime luck-neutralization) die here. You can’t measure 40,000 applicants’ "authentic preferences" or "comprehensive capability sets." Bodily Difference Sensitivity (1) is a close second – ignoring it is medically irrational.

  ### Scorecard of Currency Families
  | **Currency Family**       | **Handles Non-Negotiables?** | **Fatal Flaw for Your Case**               |  
  |---------------------------|------------------------------|--------------------------------------------|  
  | Resources/Primary Goods   | ✗ (Fails 1,6)                | Ignores bodily conversion rates, sour grapes |  
  | Welfare/Preference        | ✗ (Fails 2,3,5,6)            | Gameable, adaptive preferences, uncomputable |  
  | Capabilities              | △ (Handles 1,6; weak on 2,7) | Vague boundaries, hard to operationalize pairs |  
  | Access to Advantage       | △ (Handles 1,5; weak on 3,7) | "Access" is metaphysical; measurement hell |  
  | Relational Equality       | ✗ (Fails 1,3,4,8)            | No actionable metric; ignores bodily needs |  
  | Sufficientarianism        | △ (Handles 6,10; weak on 1,5)| No intra-threshold differentiation; ignores brute luck |  

  **Winner? Hybrid "Expected Functioning Improvement"**:  
  - **Currency**: Measurable function (e.g., mobility, pain-free hours, self-care capacity) + expected boost efficacy (based on diagnostic group, age, comorbidities).  
  - **Why**: Handles bodily differences (1) via function, non-adaptive (6), ex ante (4), computable (3) via clinical proxies, resists gaming (2) if functions are objective, handles time (8) via prognosis. Brute luck (5) addressed by excluding self-inflicted conditions (controversial but essential).  
  - **Cost**: Imperfectly handles linked cases (7) – need paired assessment. Sufficiency (9) can be layered atop.  

  **Requirement Doing Most Knockout Work**: **Computability (3)**. It forces the currency into measurable, stable proxies – disqualifying most nuanced philosophical constructs. Second: **Bodily Difference Sensitivity (1)** – it demands outcome-sensitivity, killing resourcism.
