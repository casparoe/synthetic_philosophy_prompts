  The constraints are important: no external references, define all technical terms, no false symmetry, no vacuous statements, and wording both camps could sign while still disagreeing.

  For the agreed claims, I should identify points both camps would accept about what needs explaining in the hamlet data, non-diagnostic elements, and terminology. The ferry data shows persistence despite changed incentives, so both would agree this needs explanation. The "phantom-equilibrium" concept they've stipulated will be crucial.

