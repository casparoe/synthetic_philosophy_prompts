answer: |-
  ## Joint Statement: Adversarial Collaboration on Social Norms in the Hamlet Scenario

  **Part 1: Agreed Claims**

  1.  **Core Explananda:** Any adequate account of social norms must explain: (a) the persistence of behavioural regularities even when individual incentives change, (b) the apparent normative force often associated with these regularities, (c) the mechanisms driving norm change or dissolution, and (d) the role of expectations in stabilizing or destabilizing behaviour.
  2.  **Hamlet Data - Persistence:** The ferry regularity persisted at 41% usage for years 1-3 despite the bridge offering a strictly dominant alternative (faster and cheaper regardless of others' actions), demonstrating stability absent a coordination equilibrium.
  3.  **Hamlet Data - Expectations & Beliefs:** During years 1-3, residents held widespread empirical expectations ("people here use the ferry": 100% of interviewed ferry users) and normative expectations ("most others would think less of someone who abandoned the ferry": 71% of all residents). Crucially, the recorded absence of sanctions and the low rate (4%) of self-reported willingness to sanction indicate a significant mismatch between normative expectations and actual sanctioning dispositions.
  4.  **Hamlet Data - Intervention Effect:** Publicly posting the true survey results (revealing low actual ferry use and the absence of sanctioning) caused a rapid and significant drop in ferry use (41% to 22%), demonstrating that beliefs about others' behaviour and sanctioning dispositions are key to maintaining the regularity.
  5.  **Hamlet Data - Post-Intervention Plateau:** The ferry usage stabilized at 22% for two years after the intervention, constituting a stable behavioural regularity distinct from the initial one.
  6.  **Hamlet Data - Residual Users:** The post-intervention ferry users were disproportionately specific individuals ("the two oldest boat owners, the people others describe as the ones who know the river"), suggesting their continued use may be driven by factors beyond the former norm (e.g., personal identity, expertise).
  7.  **Hamlet Data - New Norm Emergence:** The rapid emergence of the north-side parking regularity, adopted first by influential individuals ("households whose heads are the people most often named as those others take their lead from") and spreading without explicit agreement or enforcement, requires explanation.
  8.  **Non-Diagnostic Features:** Both accounts predict that: (a) Regularities can persist stably for periods. (b) Expectations about others' behaviour will be associated with stable regularities. (c) Revealing disconfirming information about behaviour or attitudes can destabilize regularities. (d) Salient individuals or events can play a role in norm emergence. Therefore, these features in the hamlet data do not decisively favour either camp.
  9.  **Term Definitions:**
      *   **Convention:** A behavioural regularity that persists because it is a coordination equilibrium (everyone prefers to conform if others do), sustained by common knowledge of the regularity and expectations of conformity. *Arbitrariness* implies the existence of viable alternative equilibria.
      *   **Norm (General):** A behavioural regularity within a group.
      *   **Social Norm (Camp B Core):** A behavioural regularity sustained by empirical expectations (beliefs about what others *do*) and normative expectations (beliefs about what others *approve of* or believe *should* be done), backed by actual or anticipated sanctioning (disapproval or tangible costs).
      *   **Sanction:** An action (tangible or intangible) intended to impose a cost on an individual for violating a behavioural regularity, motivated by disapproval of the violation.
      *   **Phantom-Equilibrium Regularity:** A stable behavioural regularity maintained *only* because participants hold false beliefs. *Belief-Phantom Variant:* False beliefs about others' preferences or behaviour. *Sanction-Phantom Variant:* False beliefs about others' willingness to sanction, when in fact no one would sanction.

  **Part 2: Disagreements Table**

  | Issue                                                                 | Camp A Position (Partisan)                                                                                                                               | Camp B Position (Partisan)                                                                                                                                                       | Genuine or Verbal? | Reason                                                                                                    |
  | :-------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------- | :-------------------------------------------------------------------------------------------------------- |
  | **Nature of Ferry Regularity (Years 1-3)**                            | The ferry regularity was a convention; participants coordinated on using the ferry because they falsely but mutually believed it was an equilibrium given others' expected actions and preferences, including preferences for sanctioning non-conformity. | The ferry regularity was a social norm sustained by empirical and normative expectations about widespread use and approval/sanctioning, even though the normative expectations about sanctioning were largely false. It was never a solution to a coordination problem. | **Genuine**        | Disagreement on whether the regularity solved a coordination problem and whether sanction preferences were real or illusory. |
  | **22% Plateau: Phantom-Equilibrium?**                                | The 22% plateau is not a phantom-equilibrium regularity; it is either a new, weak convention among a subgroup (e.g., the boat owners) or reflects stable individual preferences unrelated to norms. | The 22% plateau is a phantom-equilibrium regularity, specifically the *Sanction-Phantom Variant*: residual users falsely believe that abandoning the ferry *would* incur sanctions from others, despite the evidence to the contrary. | **Genuine**        | Disagreement on whether the residual stability relies crucially on false beliefs about sanctioning threats. |
  | **Legitimacy of Loading Sanctions/Conformity into Preferences**       | Incorporating preferences for conformity and for sanctioning non-conformity into agents' utility functions is a legitimate and powerful modelling technique essential for capturing the full range of stable behavioural patterns. | Loading sanctions and conformity preferences into utility functions is an immunity manoeuvre; it makes the equilibrium account untestable by rendering any stability explicable as an equilibrium of *some* preference structure. | **Genuine**        | Disagreement on the methodological legitimacy and testability consequences of preference specification.          |
  | **North-Side Parking: Salience vs. Transmission**                     | The north-side parking regularity emerged due to salience: the actions of the initial three influential households made parking on the north side focal, providing a salient solution to a new, trivial coordination problem. | The north-side parking regularity emerged primarily through prestige-biased transmission: the initial adopters were high-prestige individuals, and others copied their behaviour due to their status, not coordination needs. | **Genuine**        | Disagreement on the primary driver (salience/focal point vs. prestige bias) behind the rapid adoption.         |
  | **Conventions vs. Sanction-Backed Norms: Kind or Mechanism?**        | The distinction is fundamentally a difference in the *mechanism* sustaining the regularity: coordination equilibria vs. sanctioning. Both are species of norms stabilized by expectations; the core case (convention) requires no intrinsic sanctioning preferences. | Conventions and sanction-backed norms represent a difference in *kind*: conventions solve coordination problems inherently, while sanction-backed norms impose obligations backed by social pressure, often unrelated to coordination. | **Partly Verbal**  | Disagreement partly reflects different definitions of "core case" and the term "norm," but also substantive focus (coordination vs. obligation/sanction). |

  **Part 3: Cruxes**

  1.  **Crux 1: Sanction Propensity Under Anonymity**
      *   **Sub-Question:** Would residents privately express willingness to impose costs (e.g., subtle social distancing, reduced cooperation) on *anonymous* bridge users, even if they never did so publicly?
      *   **Study:** Conduct confidential, incentivized choice experiments (e.g., Dictator Games with identified bridge/ferry users vs. anonymous ones) measuring willingness to allocate costs or withhold benefits.
      *   **Camp A Prediction:** Low to zero propensity to sanction anonymous bridge users, consistent with revealed public behaviour. (Magnitude: Near zero)
      *   **Camp B Prediction:** Significant minority (e.g., >15%) would show willingness to sanction anonymous bridge users, indicating latent sanctioning preferences not expressed publicly. (Magnitude: Non-trivial minority)
      *   **Impact:** Strong Camp B result would challenge Camp A's claim that sanctioning preferences were absent/irrelevant. Strong Camp A result would support their view and weaken Camp B's claim for latent sanction backing. Both predict public non-sanctioning.

  2.  **Crux 2: Information Intervention on Residual Users**
      *   **Sub-Question:** Do the residual ferry users (22%) hold false beliefs about others' sanctioning dispositions specifically towards *them* or people *like them* (e.g., boat owners, river experts)?
      *   **Study:** Privately interview residual ferry users, revealing the *true, current* survey results (including the 4% self-reported sanction willingness and absence of recorded sanctions) and specifically ask if they believed others would sanction *them* for switching.
      *   **Camp A Prediction:** Most residual users will *not* report belief in sanction threat *towards them*; their usage is driven by identity, habit, or subgroup coordination, not normative expectations. (Direction: Low belief in personal sanction threat)
      *   **Camp B Prediction:** Many residual users *will* report belief that others would sanction *them* personally for switching, despite the evidence. (Direction: Significant belief in personal sanction threat)
      *   **Impact:** Strong Camp B result supports the Sanction-Phantom interpretation. Strong Camp A result supports their non-phantom explanation. Mediating variable: Reported belief in personal sanction threat.

  3.  **Crux 3: Inducing Coordination Failure in Parking**
      *   **Sub-Question:** If a salient alternative parking pattern is artificially introduced, will the north-side regularity dissolve rapidly (suggesting coordination) or persist due to prestige/inertia (suggesting transmission)?
      *   **Study:** Introduce brightly coloured, highly visible designated parking spots on the *south* side, advertised as a trial "efficiency improvement," without endorsing or penalizing use.
      *   **Camp A Prediction:** Rapid shift to south-side parking due to salience/focality of the new pattern, demonstrating its nature as a coordination equilibrium. (Direction: Significant shift to new pattern)
      *   **Camp B Prediction:** Slow or negligible shift; the regularity persists primarily due to conformity to the established norm and the prestige of its early adopters, not coordination needs. Salience alone is insufficient. (Direction: Minimal shift)
      *   **Impact:** Rapid shift supports Camp A (salience/focality key). Persistence supports Camp B (transmission dynamics key). Both agree salience *can* matter; disagreement on *primary* driver here.

  4.  **Crux 4: Cost Sensitivity of Ferry Holdouts**
      *   **Sub-Question:** Are the residual ferry users' choices sensitive to small personal cost increases, indicating weak normative commitment, or insensitive, indicating strong commitment or different preferences?
      *   **Study:** Introduce a small, symbolic fee (e.g., 1% of typical crossing cost) *only* for ferry use (bridge remains free), framed neutrally (e.g., "maintenance contribution").
      *   **Camp A Prediction:** Significant drop in residual ferry use (e.g., >30% reduction), as even small cost changes disrupt weak conventions or reveal underlying preferences. (Magnitude: Significant decrease)
      *   **Camp B Prediction:** Minimal drop in residual ferry use (e.g., <10% reduction), as their behaviour is sustained by normative commitment or identity, making it insensitive to minor costs. (Magnitude: Minimal decrease)
      *   **Impact:** Significant drop supports Camp A (preferences/costs dominate). Minimal drop supports Camp B (normative commitment dominates). Both predict initial stability without the fee.

  **Part 4: Closing Subsections**

  **Dissolved Verbal Disputes:**
  Significant parts of the initial disagreement centered on the scope and definition of the terms "social norm" and "convention." Camp A defines the core case narrowly as conventions (coordination equilibria), while Camp B defines it more broadly to include sanction-backed regularities. Consequently, assertions like "the ferry regularity was a norm" or "was a convention" were often true under one definition and false under the other, creating verbal disagreement. The collaboration clarified that the substantive disagreements lie in the *mechanisms* (coordination vs. sanctioning/transmission) and the *explanatory primacy* of different factors (payoffs/salience vs. expectations/transmission/sanctions), not merely the labels applied. Agreeing on the stipulated definitions and focusing on mechanisms has dissolved these definitional conflicts.

  **Evidence Against Own View:**

  *   **Camp A:** Camp A would accept the following as strong evidence against its core emphasis on coordination equilibria: (1) The discovery of a widespread, stable behavioural regularity that demonstrably imposes net costs on *all* participants compared to a viable alternative, and where no coordination problem exists (ruling out Pareto-inferior equilibria). (2) Evidence that norm change frequently occurs *without* significant shifts in the underlying payoff structure or salience, driven solely by endogenous transmission dynamics. Camp A expects its models may struggle to explain norms sustained primarily by strong moral conviction independent of coordination or sanction threats.
  *   **Camp B:** Camp B would accept the following as strong evidence against its core emphasis on sanctioning and transmission: (1) The discovery of a widespread, stable behavioural regularity backed by strong normative expectations but where sophisticated experiments reveal absolutely *zero* latent propensity to sanction violators, even anonymously. (2) Evidence that norm emergence consistently follows shifts in salience or payoff structure *alone*, with no discernible role for prestige-bias, conformist copying, or threshold effects. Camp B expects its models may struggle to explain the rapid dissolution of norms when payoffs change, even if sanctioning threats remain credible.
