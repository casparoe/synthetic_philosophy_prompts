  Upstreamness is crucial. Questions that affect multiple areas should come first. For example, understanding the functional role of fuzziness (framing c) could explain why slippage persists, influencing both laundering and upgrading. If fuzziness serves purposes like plausible deniability, that’s foundational.

  The user also mentioned reverse laundering (e.g., "archival" adding prestige). This seems under-explored. Comparing laundering vs. upgrading could reveal if mechanisms are symmetric. But is this upstream? Only after understanding core laundering dynamics.

  Prioritizing sessions: Start with defining dimensions (framing b) because it’s observable and foundational. A coding study here can categorize terms by attributes. Then, functional fuzziness (framing c) to explore motivations via a survey on buyer/seller attitudes. Ancestor problem (a) might be overrated—empirically, copies of copies are rare, and disputes here may be definitional. Reverse laundering can be later, comparing to laundering.

  Criteria for trade-offs: Importance (how much it explains slippage), tractability (feasibility with resources), dependency (how answers affect other questions). Framing (a) ranks low on importance and tractability—limited data on copy-of-copy, and it’s likely verbal. Framing (b) is high on all: tractable via coding, and dimensions clarify slippage mechanisms.

  Microdomain choice: Fashion/beauty commerce is ideal. It’s dynamic, accessible, and laundering is evident. Alternatives like digital media copyright might be too legalistic or less observable. This domain offers clear examples and rapid term evolution, fitting the grant’s focus.

