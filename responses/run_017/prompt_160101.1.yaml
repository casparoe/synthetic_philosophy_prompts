prompt: |-
  I run training for new volunteers on a crisis line, and we just had a rough review: a couple of them blurted out 'I promise' to callers in ways they hadn't thought through — one promised she'd be on shift next week, another promised a caller that nothing he said would leave the room. So I've got 35 minutes next month on what a promise actually does, and I want a plan, not the theory dumped on me. What I'm stuck on is the order: I think they need to see, before anything else, that the question isn't what happens if you break a promise but what makes the obligation exist at all, and that promising isn't the same as predicting your own behavior or resolving to do something. Which example should carry the whole session for people who've never done philosophy? My instinct is a case where nobody relies on the promise and nobody could punish them for breaking it — an anonymous caller, a promise on a train to someone you'll never see again — but I worry that case hides the thing I want them to get, since it makes promising look like pure self-binding. I also want them to hit, at the right moment, promising to do what you already had to do anyway, like promising to repay money you already owe, because that's where it should click whether the promise adds something or just lights up something already there. What will they get wrong? I'm expecting some version of 'promises bind because otherwise people get hurt', 'if they can't hold you to it you're free', and 'keeping a promise always means doing literally what you said'. Where in the sequence do I kill each one? Give me one question for the end that tells me it landed, and tell me what I should flatly refuse to get into in 35 minutes.
reasoning: |-
  Okay, the user runs training for crisis line volunteers and had an issue where new volunteers made promises they couldn't keep. They need a 35-minute session on the nature of promises, specifically focusing on why a promise creates an obligation, not just the consequences of breaking it. The user is stuck on the order of concepts and wants a practical plan, not theory.

  First, I need to address their core concern: the obligation arising from the promise itself. They want to avoid common misconceptions like promises being binding only because of harm or punishment. The user mentioned examples like promising to be on shift or confidentiality, which are real issues in crisis lines.

  They proposed an example of a promise with no reliance or punishment to isolate the obligation. But they worry it might make promising seem like self-binding. I need an example that clearly shows the obligation exists even without consequences. Maybe a promise to a stranger on a train, where the promisee doesn't rely on it. That could work, but I should ensure it highlights the interpersonal commitment.

  The user also wants to include promises to do pre-existing duties, like repaying a debt, to show if the promise adds anything. This is key to distinguishing between the duty and the promise. They anticipate volunteers might think promises are only binding if harm results, or that literal fulfillment is always required.

  So, structuring the session: start with the anonymous promise to establish the obligation's origin. Then move to reliance to show additional harm but not the core reason. Next, the pre-existing duty to clarify that promises add a layer of obligation. Finally, address literal fulfillment with the borrowed book example.

  Common mistakes: equating obligation with consequences, thinking no enforcement means no obligation, and rigid interpretation of promises. Each of these needs debunking at specific points. For instance, after the train example, ask why it's wrong to break the promise even without consequences. That tackles the first misconception.

  The closing question should test if they understand that a promise creates a new obligation regardless of existing duties or reliance. Something like whether promising to repay a debt adds a new reason. The user should avoid theoretical debates and stick to practical, relatable examples within the time limit.

  I need to ensure the session is interactive, using their own examples. Time management is crucial—35 minutes is tight. Start with the train scenario, discuss, then introduce reliance with the shift example, then the debt promise. Wrap up with key takeaways and the closing question. Avoid philosophy jargon to keep it accessible for non-philosophers.
answer: |-
  Here’s a focused, battle-tested plan for your 35-minute session, prioritizing the core insight and sequencing to dismantle misconceptions. It uses **"The Train Ticket Promise"** as the anchor example.

  **Core Objective:** Volunteers grasp that **promising creates a new, distinct obligation simply by performing the speech act itself, regardless of consequences or pre-existing duties.**

  **Anchor Example: The Train Ticket Promise (10 mins)**
  *   **Scenario:** "You're on a quiet train. A stranger sits opposite you, looking distressed. Trying to comfort them, you say, *'I promise I’ll buy you a coffee at the next stop.'* They nod vaguely. At the next stop, they get off quickly without a word, disappearing into the crowd. You never see them again."
  *   **Key Questions:**
      1.  *"Did you make a promise?"* (Yes - clear language)
      2.  *"Will the stranger be harmed or even know if you don't buy the coffee?"* (No - anonymous, no reliance)
      3.  *"Can they hold you accountable? Punish you?"* (No - gone forever)
      4.  *"Is there ANY reason you *should* still buy that coffee? Why? What changed when you said 'I promise'?"* **<-- CRITICAL QUESTION**
  *   **Why this example works:** It isolates the *obligation-creating force* of the promise itself. No harm, no enforcement, no relationship. The discomfort volunteers feel about breaking it *despite* no consequences points directly to the core obligation.
  *   **Kills Misconception #1:** "Promises bind *only* because otherwise people get hurt." (Here, no hurt occurs, yet obligation exists).

  **Transition & Common Mistake Highlight (2 mins)**
  *   "Okay, so even here, with no consequences, we feel that promise *did* something. It created a 'should'. But what about when there *are* consequences? Let's look at one of your examples..."

  **Example 2: The Shift Promise (8 mins)**
  *   **Scenario:** "A caller, deeply distressed about being alone next Tuesday night, connects deeply with Volunteer A. To soothe them, Volunteer A says, *'I promise I’ll be here next Tuesday night for you.'*"
  *   **Key Questions:**
      1.  *"What's different here vs. the train?"* (Caller relies on it, harm *will* occur if broken - caller feels abandoned).
      2.  *"Does the *possibility* of harm explain why the promise was wrong to make? Or does the harm just make breaking it *even worse*?"* (Focus: Harm is a *result* of breaking the promise obligation, not the *source* of the obligation).
      3.  *"Could Volunteer A keep the promise? Should they?"* (No - schedules change, illness; shouldn't promise absolutes).
  *   **Why this follows:** Shows reliance/harm as a *consequence* of breaking the core obligation (established in Ex 1), not the *cause* of the obligation. Reinforces that the *initial act of promising* was the error.
  *   **Kills Misconception #2:** "If they can't hold you to it, you're free." (In Train Ex, they couldn't hold you, but you weren't 'free'; here, they *can* be harmed, but the core obligation existed the moment the promise was made).

  **Example 3: The Pre-Existing Duty (The Debt Promise) (10 mins)**
  *   **Scenario:** "Caller B is terrified they'll be evicted if they can't repay their landlord $200 by Friday. They owe it. You desperately want to calm them and say, *'I promise you will repay that $200 on Friday.'*"
  *   **Key Questions:**
      1.  *"Did the caller already have a duty to repay the $200 before you promised?"* (Yes - legal/moral debt).
      2.  *"Did your promise *create* that duty to repay?"* (No - it existed independently).
      3.  *"So, what did your promise *actually* add? What new obligation did *you* create?"* (The obligation *to the caller* to ensure *they* repay it, or perhaps to be *answerable* if they don't. You took on responsibility for *their* action/outcome).
      4.  *"Is this a promise you should make? Why not?"* (No - You cannot control the caller's action/fate; you promised something *they* must do, not you).
  *   **Why this follows:** Demonstrates that a promise *adds a new layer of obligation* specific to the promisor (the volunteer), even if the underlying act was already required. This is where it clicks that promising isn't just restating a fact or duty; it creates a promissory bond *between* people.
  *   **Connects to Crisis Line:** Like "I promise nothing leaves this room" - confidentiality is already a duty; the promise *personalizes* it and creates a *specific* obligation *to that caller* that goes beyond policy.

  **Literal Fulfillment Trap (3 mins)**
  *   **Scenario:** "A caller says they feel worthless because they borrowed a book from a friend and haven't returned it. You say, *'I promise you'll return that book tomorrow!'* The next day, they drive to the friend's house, throw the book on the porch, ring the bell, and speed away."
  *   **Key Question:** *"Did they keep the promise? Did they fulfill what the *spirit* of the promise likely was (reconciliation, responsibility)?"* (Literal yes, spirit no).
  *   **Kills Misconception #3:** "Keeping a promise always means doing literally what you said." (Intent and context matter. Promises are understood within a shared framework of meaning).

  **Crisis Line Rules & Takeaways (2 mins)**
  *   **NEVER Promise:** Specific future presence, absolute confidentiality (explain limits clearly!), specific outcomes for the caller (housing, safety, sobriety), things outside your control.
  *   **INSTEAD Use:** "I *hope* to be here," "I *intend* to be here," "Our policy is strict confidentiality *except* in situations involving X," "I *will* stay with you *right now*," "Let's *work together* on a plan for safety."
  *   **Core Insight Recap:** "A promise isn't just strong words. It's an act that *creates a new obligation binding specifically on you*. Don't do it lightly, especially here, where trust is fragile and stakes are high."

  **The Closing Question (The "Did it Land?" Test):**
  > **"Imagine a caller begs you, 'Promise me you won't hang up until I feel better!' You *really* want to help. Besides the practical reasons (shift ending, burnout, caller needing other resources), what's the *core* philosophical reason why making this promise is problematic?"**

  *   **Correct Answer Insight:** Making this promise creates a new, open-ended obligation *on the volunteer* ("stay until condition X is met") that they likely cannot ethically or practically fulfill, regardless of good intentions. It binds *them* specifically in a way that "I *won't* hang up on you" or "I *will* stay with you as long as I safely can tonight" does not. The problem is the *creation of the promissory obligation itself*.

  **What to FLATLY REFUSE to Get Into (Time & Focus):**
  1.  **Deep Meta-Ethics:** "Where does obligation *really* come from?" (Divine command? Social contract? Intuition?). Acknowledge it's debated, but focus on the *experience* and *effect* of promising.
  2.  **Edge Cases & Loopholes:** "What if I cross my fingers?" "What if I say 'I swear' instead?" "What if they were asleep on the train?". Stay focused on clear, intentional "I promise" statements in a helping context.
  3.  **Historical Philosophers:** No time for Hume vs. Kant vs. Scanlon. Extract the *insight* (promise as obligation-creator), not the pedigree.
  4.  **Legal Contracts:** While related, this is about moral/social obligation in a *support* context, not legal enforceability.
  5.  **Debating the Train Example:** If someone insists "There's NO obligation on the train!", don't get bogged down. Acknowledge the feeling varies but stress that *in a crisis line context*, where words matter intensely, we must assume our promises *do* create binding obligations and act accordingly. "Assume it *does* bind you, because here, it always might."

  **Why this sequence works:** It starts by isolating the core mechanism (The Train), then layers on complicating factors (reliance/harm in Shift, pre-existing duty in Debt) to show how the core obligation persists and interacts, and finally addresses a common practical mistake (Literal Fulfillment). It directly targets their misconceptions in a logical order. Keep it fast-paced, interactive, and laser-focused on crisis line applications. Good luck!
