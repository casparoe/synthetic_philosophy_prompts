answer: |-
  Here’s a streamlined proposal framing that sidesteps the realism/antirealism trap, defines a concrete target, and meets your constraints. Focus on **orphan reasons as a test case for the persistence of normative force**:

  ---

  ### **Project Title**: The Afterlife of Obligation: Do Orphan Reasons Persist?  

  **Core Question**:  
  *When the original agent of a reason (e.g., promisor, testator, collective) ceases to exist, does the normative force of their reason persist—and if so, who (if anyone) bears it, and with what strength?*  

  **Why Existing Frameworks Can’t Answer This**:  
  Realism says reasons exist mind-independently but is silent on *how they bind specific agents post-origin*. Antirealism says reasons are mind-dependent but lacks tools to explain *lingering intuitions of obligation toward the dead/disbanded*. Both reduce orphan reasons to footnotes: realists see them as "evidence" of objectivity; antirealists dismiss them as psychological residue. Neither explains **variation in felt force** (e.g., finishing a symphony vs. discarding a stranger’s unsent letter) or **assignment mechanisms** (who "inherits" the reason?).  

  **Novelty**:  
  Testing whether realist accounts *require* "accrual" (reasons piling up unowned) and whether "fidelity-scaled inheritance" (strength tied to heir’s alignment with the reason’s origin) offers a distinct alternative. This isn’t realism relabeled—it’s a challenge to realism’s implications and a new model for normative transmission.  

  **Method (3 Months, Solo)**:  
  - **Month 1: Taxonomy & Pressure Points**  
    Map 10 concrete cases (e.g., wartime treaties after signatory states dissolve; unexecuted wills; artist foundations vs. individual heirs). Identify where realist/antirealist predictions clash with intuitive judgments.  
  - **Month 2: Test the Accrual Problem**  
    Model realist persistence: Does it imply infinite undischargeable reasons? Run hypotheticals (e.g., 1,000 unfulfilled deathbed requests; conflicting commissions). Can realists avoid this without ad hoc constraints?  
  - **Month 3: Develop Fidelity Inheritance**  
    Formalize "fidelity-scaling": If a reason’s strength for heir *H* decays as *H*’s actions deviate from the originator’s project, does this explain case variations better than realism/antirealism? Draft criteria for "project alignment."  

  **Good Result**:  
  A fidelity-scaling model that:  
  1. Predicts when orphan reasons feel stronger/weaker (e.g., completing a symphony faithfully > repurposing it).  
  2. Avoids the accrual problem by tethering reasons to *potential heirs aligned with the original project*.  
  3. Shows why realists must either accept accrual or borrow fidelity constraints (weakening their position).  

  **Failure Conditions**:  
  - **Boring failure**: Cases merely rehash realism/antirealism debates (e.g., "intuitions vary by metaethical view"). *Mitigation*: Focus exclusively on *transmission mechanics*, not reason-existence.  
  - **Dead end**: Fidelity-scaling collapses into consequentialism or extant theories. *Mitigation*: Stress its backward-looking link to the *originator’s intent*, not outcomes.  
  - **Overreach**: Three months can’t resolve the metaphysics. *Solution*: Deliver a clear map of realist costs + fidelity model’s viability, not a "proof."  

  **Why Care? (Beyond Metaphysics)**:  
  Orphan reasons shape real-world obligations:  
  - **Legal/Policy**: When do defunct states’ treaties bind successors? How should AI handle "post-personhood" data directives?  
  - **Cultural Ethics**: Do museums have stronger reasons to honor dead artists’ wishes than distant heirs? What survives when activist groups disband?  
  This isn’t just about "spooky reasons"—it’s about **how societies manage moral residue across time**.  

  **Feasibility**:  
  3 months suffices to:  
  1. Expose the accrual problem as a realist liability.  
  2. Propose fidelity inheritance as a live alternative.  
  3. Flag practical implications.  
  *What’s left for later?* Full formalization and historical case studies.  

  ---  

  ### Key Adjustments from Your Sketch:  
  - **Question Precision**: Shifted from "Do reasons persist?" to "*How* does normative force transmit (or fade) after originators vanish?"  
  - **Anti-Redundancy**: Fidelity-scaling isn’t a "compromise" but a *structural alternative* to accrual—framed as a realist cost and positive model.  
  - **Committee Hook**: Anchored to institutional/cultural problems (treaties, wills, art).  

  This frames orphan reasons as a wedge into normative transmission—a gap in both camps—while your "fidelity" insight becomes the scalpel.
