     - A. It has a truth value (either true or false) even though we don't know which.
     - B. It is neither true nor false because there is no first person yet.

     Then Russell would say A? Because the description is about the future, but if we think that the future is real, then there will be a fact of the matter. However, note that at the time of utterance, the existence condition fails. So Russell would say the statement is false? That seems wrong. Actually, Russell's theory is usually applied to the present. We might need to consider temporal logic.

