  For the questions... Need to avoid softball restatements. Each should force the guest to defend a specific claim. The follow-ups must anticipate her likely moves—like when she invokes "expected costs" for auditing, the user wants to press on lifelong patterns. Good catch about the "one thought too few" asymmetry too; if missing thoughts aren't equally corrupting, why?

