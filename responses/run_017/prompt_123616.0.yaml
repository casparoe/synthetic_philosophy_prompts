answer: |-
  You're conflating two distinct issues: the *semantic machinery* of supervaluationism and the *pragmatic consequences* of a poorly drafted law. My framework doesn't require sharp boundaries at *any* level – that's the whole point. The admissibility conditions for precisifications aren't *unknowable sharp boundaries*; they're *inherently vague constraints*. Higher-order vagueness – vagueness about what counts as an admissible precisification – is handled *within* the theory by recognizing that 'admissible' itself admits of precisifications. The regress isn't fatal; it's *iterative*, modeling the indeterminacy all the way up. At each level, truth for vague sentences is defined via quantification over admissible precisifications at the level below. Crucially, **this doesn't collapse into epistemicism** because there is *no fact of the matter* which precisification is "correct," even at a meta-level. It's genuine indeterminacy modeled by multiple consistent resolutions, not hidden precision. Your epistemicism posits a single, unknowable, sharp boundary – a brute fact we must accept. My theory posits a *structure* for modeling the *lack* of such a fact. The regress reflects the complexity of the phenomenon, not a flaw requiring a sharp stopping point.

  Regarding the Treasury: the law explicitly uses 'definitely'. On supervaluationism, "S is definitely a town" is true iff S is a town on *every* admissible precisification. Borderline settlements *will* fail this test – they are true on some precisifications, false on others. **So yes, they don't pay the levy under this specific clause.** But this isn't a failure of *my* theory; it's a predictable consequence of the law's chosen, highly restrictive wording. The Treasury's budget shortfall stems from their reliance on borderline cases while simultaneously demanding *definiteness* in the statute. A better legislated threshold (e.g., "settlements with over 5,000 residents" or "settlements classified as towns by the local council") could avoid this, precisely because it would *remove* the reliance on a vague predicate *in this specific legal context*. My theory accurately predicts the outcome of *this* poorly designed law: borderline cases are *not definitely* towns, so they don't trigger the levy. That's the semantics working correctly, not a revenue disaster caused by supervaluationism. The blame lies with the drafter, not the logic. Your epistemicism, by positing a sharp boundary where none is apparent, would arbitrarily pick winners and losers based on an unknowable fact – *that* seems far more problematic for fair application of the law.

