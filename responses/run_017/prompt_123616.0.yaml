  I should concede that 'definitely' has higher-order vagueness—that's unavoidable—but stress how supervaluationism handles it through consistency across admissible specifications. The core distinction is that we're modeling indeterminacy through multiple resolutions rather than positing hidden facts. 

  The user might press further on why this regress doesn't lead to epistemicism. I'll need to hold firm that admissibility isn't about inaccessible truths but about coherent constraints on interpretation. Each step up is still governed by the same framework, without requiring a sharp top level. 

