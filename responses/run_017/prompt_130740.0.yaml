prompt: |-
  Me and my roomate got into a 2am argument about whether trained neural nets really have internal representations or whether interpretability people are just telling flattering stories about matrices — he says every 'the network represents X' claim is us projecting, I said no, some internal states carry content and others dont and that distinction is doing real work. I want something sharper than either of us managed before we pick it up again this weekend.

  So: write me the desiderata for an account of representation in neural networks. What would have to be true of a network's state for it to count as representing X, good enough that the account can tell discovery from redescription — i.e. say when an interpretability result found a real representational structure versus when it found a useful summary we could have written down anyway. For each requirement give the case or consideration behind it, and mark which are non-negotiable and which are really just what one camp already wants to be true.

  Cases it has to handle (I made these up, dont go looking for them, theyre just where we got stuck): two nets, same architecture and data, different seeds — one has a cleanly probeable direction for 'is this text in French', the other has no such direction, and theyre behaviourally indistinguishable on held-out inputs, so does only one represent Frenchness and is representation allowed to be seed-relative? A direction that predicts a feature perfectly but where steering along it and lesioning it both change nothing downstream — represented-but-unused, or not represented? A vector taken from net A and injected into net B, which then behaves as if it took the feature to be present — does B now represent the feature or is it just being poked? And the co-occurrence case: horns and stop signs always appear together in training, one direction fires on both, and given superposition a single direction routinely does this for many features at once — so what is the content, if anything.

  Distinctions I dont want collapsed: representing X versus X being causally efficacious in behaviour versus X merely being recoverable by a probe; the net representing X versus our model of the net representing X; token activations versus dispositional features. Consistency constraints from how nets actually are: probes can be trained to pull almost anything out of a high-dimensional activation space, features appear and split and merge over training, nets can contain features nothing selected for, and the same function has wildly many internal implementations.

  Then the part I care most about: which pair of desiderata cant be jointly satisfied — Im suspicious that 'content is fixed by causal role in the network's own behaviour' and 'a net can represent what it never uses, or represent falsely' are in genuine tension, and if they are, say which to drop and why. And name the single requirement that knocks out the most candidate accounts.

  Lead with your bottom line in the first sentence — what the right standard actually is — then defend it. No preamble, no restating my question.
reasoning: |-
  We are seeking an account of representation in neural networks that satisfies several desiderata, grounded in the need to distinguish genuine representational content from mere interpretative redescription. The core standard is: **A neural network state represents X if and only if that state is a component of a structured internal model that the network uses (or is disposed to use) to guide its behavior in a way that is systematically sensitive to X, and this sensitivity is a result of the network's training history.**

  This account emphasizes that representation is tied to the *functional role* of the state within the network's computational architecture and its learned dispositions. It avoids projection by requiring that the state's role is causally operative in the network's behavior (though not necessarily always used) and that it is a result of learning. Now, let's break down the desiderata and then address the cases and tensions.

  ### Desiderata for an Account of Representation

  1. **Functional Role Requirement (Non-negotiable)**: The state must play a causal role in the network's computation that is systematically sensitive to X. This means that the state's activation pattern is part of the causal chain that leads to the network's output, and variations in X lead to variations in the state and then to appropriate variations in output. 
     - *Why?* Without this, we cannot distinguish a representation from a mere correlate. The lesioning and steering cases (below) highlight that if the state isn't causally involved, it's not representing for the network.

  2. **Learnability Requirement (Non-negotiable)**: The representational capacity must be a result of the network's training. This rules out pre-training structures that might correlate with X but are not shaped by the learning process.
     - *Why?* It ensures that the representation is a product of the network's history and not an accident of initialization. The seed-relative case (below) becomes relevant: if the seed leads to a structure that is not used, it's not a representation.

  3. **Systematicity Requirement (Non-negotiable)**: The representation must be part of a system of states that together allow for compositionality and generalization. This means the state should not only respond to X in a one-off manner but should integrate with other representations to support a range of behaviors.
     - *Why?* This rules out probe-specific patterns that do not interact with the network's own processing. The probe may find a linear readout, but if the network doesn't use it, it's not a representation.

  4. **Counterfactual Robustness Requirement (Negotiable, but desirable for discovery)**: The state should track X across a range of relevant counterfactual situations. This is what allows us to say that the representation is about X and not just correlated with it in the training data.
     - *Why?* This helps address the co-occurrence case: if horns and stop signs always co-occur, but the state responds only to horns in a counterfactual where stop signs are absent, then it represents horns. Otherwise, it might represent the co-occurrence.

  5. **Independence from Probes (Non-negotiable)**: The representational content must be independent of the existence of a probe. A probe may reveal a representation, but the representation exists in the network's structure regardless of whether we probe it.
     - *Why?* This is central to the distinction between discovery and redescription. If a probe can recover X, that does not imply the network uses X. The probe might be creating a structure we project.

  6. **Token Activation vs. Dispositional Feature Distinction (Non-negotiable)**: The account must distinguish between what a particular activation (token) represents and what the network's architecture is disposed to represent. A token activation represents X in a given context, but the network's weights define the disposition to form such tokens.
     - *Why?* This handles the case of superposition: a single direction might be used for multiple features, but in a given context, the token activation can carry specific content.

  7. **Representation Without Immediate Use (Negotiable, but important)**: A state can represent X even if it is not currently used in producing behavior, provided it is part of the network's functional structure and would be used in relevant circumstances.
     - *Why?* This allows for representations that are intermediate or held in reserve. The lesioning/steering case: if lesioning the direction does nothing because the network has redundant pathways, but steering it in isolation does change behavior, then it might still represent X. However, if both lesioning and steering do nothing, then it's not a representation.

  ### Addressing the Cases

  - **Seed-Relative Representations**: Two nets, same architecture and data, different seeds. One has a cleanly probeable direction for "Frenchness", the other doesn't, but they are behaviorally identical. 
    - *Our account*: Only the net with the direction that plays a causal role in its computation (even if redundant) represents Frenchness. But if the direction in the first net is causally inert (e.g., due to redundancy), then it doesn't represent. The key is functional role, not probeability. If the direction is not used by the network (even as a backup), then it's not a representation. The representation is seed-relative only if the seed leads to a functional structure that the network uses.

  - **Represented-but-Unused?**: A direction that predicts feature X perfectly, but lesioning it and steering it both change nothing downstream.
    - *Our account*: This is not a representation of X. The state must play a causal role (or be disposed to play one in relevant circumstances) to count. If the network has learned to ignore it (or never uses it), then it's a vestigial structure, not a representation.

  - **Vector Injection from A to B**: Injecting a vector from net A (which represents X) into net B, and net B then behaves as if X is present.
    - *Our account*: This does not imply that net B represents X. The injection is an external intervention. For net B to represent X, it must have an internal state that plays the functional role of X in its own computational structure. The injection might be exploiting B's existing representations (e.g., of the output) but without B having a representation of X per se.

  - **Co-occurrence (Superposition)**: Horns and stop signs always co-occur, one direction fires for both, and superposition is common.
    - *Our account*: The content of the direction is the disjunction (horns OR stop signs) or the co-occurrence pattern. However, if in counterfactual scenarios (e.g., horns without stop signs) the direction still fires for horns, then it represents horns. The systematicity requirement helps: if the network uses this direction in a way that treats horns and stop signs as the same (e.g., in a classifier), then it represents the co-occurrence. But if the network has separate downstream mechanisms that could disambiguate, then the direction might be a superposition of both.

  ### Tensions and Trade-offs

  The main tension is between:
  - **Desideratum A**: Content is fixed by causal role in the network's own behavior (Functional Role Requirement).
  - **Desideratum B**: A net can represent what it never uses, or represent falsely (Representation Without Immediate Use and the possibility of misrepresentation).

  This tension is real. Desideratum B seems to allow for representations that are causally inert (which Desideratum A forbids). Our resolution is to require that the state must be *disposed* to play a causal role. This disposition must be grounded in the network's structure. For example, if a representation is redundant, it might not be used in the current pathway, but it would be used if the primary pathway is lesioned. If it is not disposed to be used in any relevant scenario, then it is not a representation.

  However, if a state is causally inert and not disposed to be used, then it is not a representation. This means we drop the strong form of Desideratum B: a state cannot represent if it is entirely causally disconnected from behavior. But we keep a weak form: a state can represent without being used in every instance (e.g., it might be part of a redundant system).

  ### The Requirement that Knocks Out Most Candidate Accounts

  **The Independence from Probes requirement** is the one that eliminates the most accounts. Many interpretability methods (e.g., linear probing) assume that if a probe can decode X, then the network represents X. But without a causal role in the network's own processing, this is just a redescription. This requirement forces that the representation must be part of the network's computational story, not just our interpretative one.

  ### Bottom Line

  The right standard is: **Representation requires a functional role in the network's learned computational structure, such that the state is systematically sensitive to X and disposed to guide behavior in a way that depends on X.** This account avoids projection by tying representation to the network's own causal structure and learning history, and it handles the cases by emphasizing functional disposition over mere correlation or probeability.
answer: |-
  **Bottom line: A neural network state represents X only if it is a structurally embedded component that non-accidentally tracks X and plays a causal role in the network's computations, where "non-accidental" means the tracking is robust under intervention and grounded in the network's architectural affordances and training history.**  

  ### Desiderata (Non-negotiable unless marked)  
  1. **Causal Efficacy Requirement**  
     - *Requirement:* The state must be causally involved in generating the network's behavior (outputs), not merely correlated with X. Lesioning or perturbing the state should alter behavior when X is relevant.  
     - *Case:* The "direction that predicts X perfectly but lesioning/steering does nothing" fails. If neither intervention affects outputs, it's not a representation—it's an epiphenomenal correlate.  
     - *Non-negotiable:* Without this, we collapse "representation" into "recoverability," allowing any probe target to count.  

  2. **Architectural Embeddedness Requirement**  
     - *Requirement:* The state must be a stable, reusable part of the network's computational structure (e.g., a weight configuration or activation pattern), not an artifact of external tools like probes.  
     - *Case:* "Injecting a vector from net A into net B" doesn't mean B represents X—it’s passive manipulation. B’s behavior must rely on its *own* structures that track X.  
     - *Non-negotiable:* Prevents conflating our manipulations with the net’s inherent properties.  

  3. **Non-Accidentality Requirement**  
     - *Requirement:* The state’s correlation with X must be robust under relevant counterfactual interventions on inputs (e.g., if X changes, the state changes predictably; if X is held fixed, noise doesn’t swamp the signal).  
     - *Case:* In "horns and stop signs co-occurrence," if steering the direction *only* affects downstream behavior when *both* are present, it represents the conjunction—not horns alone. Robustness tests resolve superposition ambiguity.  
     - *Non-negotiable:* Rules out spurious correlations (e.g., a direction tracking "full moon" because all French texts were collected at night).  

  4. **Learnability Constraint**  
     - *Requirement:* The representational capacity must arise from training dynamics, not initialization luck. If functionally identical nets can lack the state (e.g., different seeds), it’s not essential for behavior—hence not a representation.  
     - *Case:* In the "seed-relative Frenchness direction" scenario, if both nets behave identically without it, the direction is a redescription artifact. Representation must be necessary for *some* implementation of the function.  
     - *Non-negotiable:* Anchors content to what the network *learned*, not what we find convenient.  

  5. **Token/Disposition Distinction**  
     - *Requirement:* Token activations represent specific instances (e.g., "this token is French"), while weights/gears represent dispositional capacities (e.g., "can detect Frenchness").  
     - *Case:* A probe recovering X from activations doesn’t imply the network *uses* X; the disposition (e.g., weights) must enable X-guided computations.  
     - *Non-negotiable:* Avoids conflating transient states with structural features.  

  ### Negotiable Desiderata (Camp-Specific)  
  6. **Representation-Without-Use Leeway** (*Functionalist camp*)  
     - *Requirement:* Allows states to represent X even if unused in *all* contexts (e.g., if redundancy masks their causal role).  
     - *Case:* A "French-detection" direction that is lesioned but *would* affect behavior if primary pathways failed counts as representing Frenchness.  
     - *Trade-off:* Weakens Causal Efficacy but accounts for biological plausibility (e.g., silent neurons). Reject if strict causal role is prioritized.  

  7. **Probe-Independent Content** (*Realist camp*)  
     - *Requirement:* Content exists independently of probes; probes *discover* structure, not create it.  
     - *Case:* If a direction tracks French robustly and causally, probes reveal pre-existing content.  
     - *Trade-off:* Risks overfitting to human categories (e.g., "Frenchness" vs. low-level features). Useful but not core.  

  ### The Inherent Tension: Causal Role vs. Misrepresentation/Non-Use  
  - **Conflict:** "Causal Efficacy" (Desideratum 1) clashes with "Representation-Without-Use" (Desideratum 6). If a state *never* influences behavior (even dispositionally), calling it a "representation" is empty. Yet, denying this eliminates unused capacities (e.g., a "cat detector" in a net only used for dogs).  
  - **Resolution:** Drop *strong* Representation-Without-Use. A state can represent X if:  
    (a) It is *disposed* to affect behavior in relevant contexts (e.g., if triggered), or  
    (b) It misrepresents (e.g., fires for "cat" when no cat is present) *and* errors propagate.  
    But if entirely causally isolated (lesioning/steering does nothing *and* no contexts engage it), it’s not a representation—it’s debris.  
  - *Why?:* Preserves explanatory power. Representation must earn its keep by doing work in the system.  

  ### The Account-Killer Requirement  
  **Non-Accidentality** (Desideratum 3) eliminates:  
  - Simple correlation accounts (fails co-occurrence cases).  
  - Probe-based accounts (probes can force non-robust correlations).  
  - Causal-role-lite accounts (if steering a direction doesn’t change behavior systematically, it’s accidental).  

  ### Why This Standard Works  
  It licenses "discovery" (not redescription) when:  
  - Interventions (lesion/steering) show causal impact tied to X.  
  - Robustness tests confirm tracking survives noise/counterfactuals.  
  - Training dynamics explain the structure’s emergence.  
  In the seed-relative case, only the probeable direction counts if it’s causally active *and* non-accidental—otherwise, it’s just a story.
