  We are creating a decision framework for evaluating proposals involving insects in a university purchasing group. The framework must fit on one page, be usable with limited prep time, and be acceptable to an ecologist boss and student government. The framework should address three key concerns: the non-independence of insect sentience probabilities, population counterfactuals, and the effect of choices on insect populations. It should also test robustness under three sentience weighting scenarios.

  Framework Outline:
  1. Define the proposal and alternatives (including status quo).
  2. For each alternative, assess the impact on:
     a. Vertebrates (including humans) and ecosystems (using standard environmental metrics).
     b. Insects, under three sentience weight scenarios (none, low, high).
  3. Account for population counterfactuals: How does the alternative change the number of insects and their lives compared to the baseline?
  4. Consider the non-independence of insect sentience: Since evidence applies to entire lineages, we treat the sentience probability as a single unknown for each lineage, affecting the entire group.
  5. Calculate net effects under the three scenarios and compare alternatives.
  6. Decision rules:
     - If an alternative is best or acceptable in all three scenarios, green light.
     - If it is unacceptable in any scenario (e.g., causes massive harm when insects count a lot), then red light.
     - Otherwise, yellow light (requires human judgment).

  Steps in Detail:

  Step 1: Proposal Definition
  - Clearly state the proposal and at least two alternatives (including doing nothing).
  - For each, list the key actions and which insect lineages are affected.

  Step 2: Impact Assessment
  a. Non-insect impacts (vertebrates, ecosystems, carbon, etc.):
     - Quantify where possible (e.g., carbon savings, vertebrate lives affected).
     - Use existing environmental metrics (e.g., carbon footprint, biodiversity impact).
     - Time: Use quick research (supplier data, known facts). If data is missing, note uncertainty.

  b. Insect impacts under three sentience weight scenarios:
     - Scenario 1: Insects have no moral weight (weight = 0). Only non-insect effects matter.
     - Scenario 2: Insects have low moral weight (e.g., 1/1000 of a vertebrate). We use this to represent "a little".
     - Scenario 3: Insects have high moral weight (e.g., 1/10 of a vertebrate, or even equal per unit of suffering). We use this to represent "a lot".

     For each scenario, we need:
     - The change in the number of insects (or insect-life-days) due to the proposal, considering counterfactuals (Step 3).
     - The net welfare effect on insects (which may be positive or negative) and convert to "vertebrate-equivalent" using the weight.

  Step 3: Population Counterfactuals
  - For each insect lineage in each alternative, estimate:
     - How many additional insects are created (or prevented) compared to the baseline?
     - How does the action change the quality and duration of their lives? (e.g., farming may lead to controlled death, releasing may lead to starvation, etc.)
     - Key: We are not counting the direct deaths but the net change in the population trajectory. For example, if killing some aphids leads to the same number being born and dying later, then the net effect might be zero. But if we prevent reproduction, we might reduce total life-days.

  Step 4: Non-independence of Sentience
  - We do not multiply the number of insects by a small sentience probability. Instead, we treat the entire lineage as having the same sentience status. Therefore, when evaluating an alternative that affects a lineage, we must consider:
     - The evidence for that lineage (if available) to assign a qualitative level (e.g., weak, moderate, strong) for sentience indicators (nociception, etc.). But note: we are using three scenarios to avoid assigning a specific probability.
