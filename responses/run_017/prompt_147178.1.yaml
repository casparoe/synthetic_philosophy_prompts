answer: |-
  ### **Framework for Evaluating Insect-Related Proposals**  
  *Designed for 1-page output, 2-hour prep, and robustness to sentience uncertainty.*

  #### **Step 1: Define Alternatives & Affected Lineages**  
  - **Task:** List all alternatives (including status quo) and identify insect lineages involved (e.g., crickets, aphids, honeybees).  
  - **Good Enough:** Clear description; lineages identified at order/family level (e.g., "crickets: Orthoptera").  
  - **Stop If:** Proposal affects unknown/uncertain lineages (e.g., "soil microbes"). Hand to humans.  
  - **Judgment Call:** Deciding which lineages matter (e.g., is a parasitic wasp in the greenhouse relevant?).  

  #### **Step 2: Non-Insect Impacts (Vertebrates, Ecosystems, Carbon)**  
  - **Task:** Assess effects on vertebrates, plants, carbon footprint, and human interests.  
  - **Good Enough:** Qualitative rating (🟢 Good, ⚪ Neutral, 🔴 Bad) based on data (e.g., carbon savings, biodiversity loss).  
  - **Metrics:** Use existing standards (e.g., CO₂e reduction, vertebrate welfare metrics).  
  - **Stop If:** Data gaps >50% of key metrics (e.g., unknown supply chain impacts).  

  #### **Step 3: Insect Welfare Assessment**  
  *Addresses: Non-independence, population counterfactuals, and choice-driven populations.*  
  - **a) Counterfactual Baseline:**  
    - **Task:** Describe what happens to insects *without intervention* (e.g., "aphids starve after plant death").  
    - **Good Enough:** Plausible baseline (e.g., "80% die young in wild").  
    - **Judgment Call:** Estimating natural mortality rates.  
  - **b) Net Change in Suffering/Flourishing:**  
    - **Task:** Estimate:  
      - Change in insect-life-days (e.g., "ladybugs live 10 extra days but starve").  
      - Welfare quality (🟢 Flourishing, ⚪ Neutral, 🔴 Suffering).  
    - **Focus:** Net change from baseline (e.g., farming creates suffering that wouldn’t exist).  
    - **Good Enough:** Rough estimates (e.g., "high suffering-days for farmed crickets").  
    - **Stop If:** No defensible counterfactual (e.g., complex ecosystem cascades).  
  - **c) Lineage-Level Sentience Evidence:**  
    - **Task:** Note evidence per lineage (e.g., "honeybees: trade-offs in studies; aphids: minimal data").  
    - **Use:** Informs Scenarios 2/3 (but *not* used quantitatively).  

  #### **Step 4: Scenario Analysis**  
  *Tests robustness under 3 sentience weights (no philosophy, just weights):*  
  - **Scenario 1 (Weight = 0):** Ignore insects. Use only Step 2 rating.  
  - **Scenario 2 (Weight = Low):** Insects matter 1/1000th of vertebrates.  
  - **Scenario 3 (Weight = High):** Insects matter 1/10th of vertebrates.  
  - **Task:** For each scenario, combine:  
    - Non-insect impact (Step 2).  
    - Insect impact (Step 3b), converted to "vertebrate-equivalent suffering" using weight.  
    - **Output:** Net rating (🟢, ⚪, 🔴).  
  - **Good Enough:** Arithmetic avoided; qualitative judgment (e.g., "even with high weight, insect harm outweighs vertebrate benefits").  
  - **Judgment Call:** Translating suffering-days to vertebrate-equivalent.  

  #### **Step 5: Decision Rule**  
  - **🟢 Green Light:** All 3 scenarios rate 🟢 or ⚪.  
  - **🔴 Red Light:** *Any* scenario rates 🔴.  
  - **🟡 Yellow Light:** Mixed results (e.g., 🟢/⚪ in two scenarios, 🔴 in one).  
  - **Human Handoff:** All 🟡 or no 🟢 alternatives.  

  #### **Where Judgment Wears a Procedure Costume**  
  - Assigning welfare quality (Step 3b).  
  - Setting vertebrate-equivalent suffering (Step 4).  
  - Interpreting sentience evidence (Step 3c).  

  ---

  ### **Apply Framework to Proposals**  
  #### **1. Cricket Powder Protein Bars**  
  - **Alternatives:**  
    - A1: Keep whey (status quo).  
    - A2: Switch to cricket powder.  
  - **Step 1:** Lineages: Crickets (farmed).  
  - **Step 2:**  
    - A1: Dairy whey → high carbon, chicken suffering (🔴).  
    - A2: Lower carbon, less chicken use (🟢).  
  - **Step 3 (A2):**  
    - Counterfactual: Crickets wouldn’t exist.  
    - Net Change: Creates short, crowded lives → high suffering-days (🔴).  
  - **Scenarios:**  
    - S1 (Weight=0): 🟢 (A2 wins).  
    - S2 (Weight=Low): 🟢 + minor 🔴 → ⚪.  
    - S3 (Weight=High): 🟢 + major 🔴 → 🔴 (due to scale).  
  - **Decision:** A2 = 🔴 (fails S3). **Recommendation:** Reject.  

  #### **2. Aphid Outbreak in Greenhouse**  
  - **Alternatives:**  
    - A1: Do nothing → plants die (status quo).  
    - A2: Neem oil → kills aphids.  
    - A3: Release ladybugs → eats aphids, then starves.  
  - **Step 1:** Lineages: Aphids, ladybugs.  
  - **Step 2:**  
    - A1: Educational/financial loss (🔴).  
    - A2: Saves plants (🟢).  
    - A3: Saves plants (🟢).  
  - **Step 3:**  
    - A1: Aphids starve naturally → high suffering (🔴).  
    - A2: Kills aphids quickly → moderate suffering (⚪).  
    - A3: Ladybugs starve; aphids eaten alive → high suffering (🔴).  
  - **Scenarios (A3 example):**  
    - S1: 🟢  
    - S2: 🟢 + 🔴 → ⚪  
    - S3: 🟢 + 🔴 → 🔴  
  - **Decision:**  
    - A1: 🔴 (S1–S3 all 🔴 due to non-insect harm).  
    - A2: ⚪ in S2, 🟢 in S1/S3 → 🟡.  
    - A3: 🔴 (fails S3).  
    **Recommendation:** 🟡 (human judgment). Neem oil least bad.  

  #### **3. Wildflower Meadow + Honeybee Hives**  
  - **Alternatives:**  
    - A1: Keep lawn (status quo).  
    - A2: Meadow + hives.  
  - **Step 1:** Lineages: Wild pollinators (bees, butterflies), honeybees.  
  - **Step 2:**  
    - A1: Mowing → carbon cost, low biodiversity (🔴).  
    - A2: Higher biodiversity, carbon sequestration (🟢).  
  - **Step 3 (A2):**  
    - Counterfactual: Lawn supports few insects.  
    - Net Change: Meadow → flourishing days for wild pollinators (🟢). Hives → honeybees thrive but may crowd wild bees (⚪).  
  - **Scenarios:**  
    - S1: 🟢  
    - S2: 🟢 + 🟢 → 🟢  
    - S3: 🟢 + 🟢 → 🟢  
  - **Decision:** A2 = 🟢 in all scenarios. **Recommendation:** Approve.  
    *(As a vegan, you’re safe: honeybees aren’t harmed here, and wild insects benefit.)*  

  ---

  ### **What the Framework Can’t Do**  
  1. **Long-Term Ecosystem Shifts:** If releasing ladybugs alters local ecology for years, counterfactuals become guesswork.  
  2. **High Uncertainty:** When lineage data is absent (e.g., beetle cognition), outcomes rely on weak assumptions.  
  3. **Moral Weight Debates:** Doesn’t resolve *how much* insects matter (only tests robustness).  
  4. **Non-Insect Trade-Offs:** Can’t balance vertebrate vs. human welfare conflicts (e.g., "save trees vs. mouse habitats").  
  5. **Pan-Species Effects:** Useless for microbes, plants, or robots.  

  **When to Avoid:**  
  - Proposals with diffuse impacts (e.g., "change campus lighting to help moths").  
  - If counterfactuals involve >2 trophic levels (e.g., "remove spiders to save flies, but birds starve").  

  **Output:** 1-page summary with tables for Steps 2–4, scenario ratings, and clear 🟢/🔴/🟡.
