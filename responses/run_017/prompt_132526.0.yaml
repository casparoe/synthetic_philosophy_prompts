answer: |-
  ## Diagnosis of the Heterophenomenology Impasse

  After considering four candidate diagnoses and testing them against the arguments:

  1.  **Verbal Disagreement (Different Definitions of "Consciousness"):**
      *   *Diagnosis:* Defenders operationalize "consciousness" solely in terms of reportable access (A-consciousness), while critics insist on phenomenal consciousness (P-consciousness) as distinct.
      *   *Test:* Defenders explicitly claim their method leaves *nothing over* beyond the empirical correlates of reports/behavior/neural states. Critics explicitly argue the method *excludes* the phenomenal residue *by fiat*. This isn't merely terminological; defenders deny the *existence* of an explanandum beyond access, while critics assert its existence and irreducibility. **Rejected:** It's substantive.

  2.  **Clash Over Data Admissibility (What Counts as Evidence):**
      *   *Diagnosis:* Defenders admit only third-person, intersubjectively observable data (reports, behavior, neural activity). Critics demand that first-person experience itself (or its irreducibility) be admitted as a datum.
      *   *Test:* Defenders explicitly bracket first-person judgments as unscientific starting points. Critics argue the method *fails to capture* the crucial phenomenon precisely *because* it excludes the first-person perspective as evidence. This captures a core conflict. **Plausible.**

  3.  **Clash Over Foundational Intuitions (The Zombie Intuition):**
      *   *Diagnosis:* The dispute rests on the critic's bedrock intuition that a philosophical zombie (identical reports/behavior but no consciousness) is conceivable/possible, which the defender rejects as incoherent or irrelevant.
      *   *Test:* Critics explicitly frame the problem around what might be *unreportable* or absent despite identical reports (implied by the zombie-like "sources" in your text-invariance). Defenders deny the coherence of such scenarios as scientifically relevant. **Partially Correct,** but needs refinement.

  4.  **Different Research Programmes (Answering Different Questions):**
      *   *Diagnosis:* Defenders aim to explain *how cognitive systems produce verbal reports and associated behaviors*. Critics aim to explain *why certain processes are accompanied by subjective experience*.
      *   *Test:* Defenders claim to explain *consciousness* by explaining report-generation mechanisms and correlates, implying the questions are identical. Critics insist they are distinct ("easy" vs. "hard" problems). This aligns well. **Plausible.**

  **Best Diagnosis: A Clash Over the Standard of Evidence (Text-Invariance) Driven by Foundational Intuitions and Defining Different Programmes.**

  Your hypothesis of an unstated criterion of evidence, Text-Invariance (TI), provides the crucial mechanism linking diagnoses 2, 3, and 4:

  1.  **TI as the Core Evidential Standard:** Heterophenomenology *is* TI by construction. Its core methodological rule is: **Same verbal report output under controlled conditions = Same heterophenological world.** This is its operational definition of "subject's perspective."
  2.  **Why Defenders Accept (Implicitly) TI:** It guarantees objectivity, repeatability, and avoids the "first-person science" critics demand. It allows them to treat consciousness as the *functional property* of generating certain reports/correlates (aligning with Programme 4: explaining report generation).
  3.  **Why Critics Reject TI:** TI explicitly rules out the zombie scenario as scientifically meaningful *by definition*. If a zombie emits identical reports, its heterophenomenological world is identical to a conscious human's. Critics see this as *assuming* what needs proving – that reportability exhausts phenomenality. TI embodies the denial of their foundational intuition (Zombie possibility) and excludes their core explanandum (P-consciousness).
  4.  **The Impasse Structure:** Defenders see TI as the *sine qua non* of objective methodology. Critics see TI as *begging the question* against the existence of non-reportable phenomenality. Rejecting TI forces defenders towards the subjective criteria they sought to avoid; accepting TI forces critics to abandon the hard problem. Neither move is palatable to the other side, leading to stable mutual accusations of question-begging.

  **Path to Progress:**

  Given this diagnosis, progress requires directly addressing Text-Invariance:

  1.  **Conceptual Distinction & Reformulation:** Rigorously formalize Text-Invariance and its alternatives. What does it mean for a method to be "sensitive" to non-reportable states? Can a *third-person* method exist that isn't TI? Articulating clear alternatives (e.g., methods inferring "subjecthood" or "phenomenality potential" based on architectural features *alongside* reports) could shift the debate beyond the TI trap. This involves refining the distinction between explaining report-generation mechanisms and explaining subjective experience.
  2.  **Experimental Designs Challenging Strict TI:** Develop paradigms probing the *limits* of reportability and its neural correlates. For example:
      *   **"No-Report" Paradigms with Indirect Proxies:** Use behavioral or neural signatures argued to correlate with unreportable states (e.g., certain forms of attention, priming, neural decoding of stimuli despite lack of overt report). If validated, these could provide *third-person evidence* potentially *inconsistent* with what strict TI (based solely on verbal reports) would predict, forcing defenders to either incorporate new data types (modifying TI) or explain away the discrepancy. Critics would need to accept these as valid (if indirect) evidence for phenomenality.
      *   **Dissociation Studies:** Systematically explore cases where reportability and argued phenomenological richness dissociate (e.g., neglect, masked priming, certain neurological conditions, potential AI systems). Can heterophenomenology *accommodate* such cases without collapsing or resorting to ad-hoc adjustments? This tests the flexibility and boundaries of the method.
  3.  **Formal Result (Aspirational):** A formal proof demonstrating that *any* method satisfying strict TI is fundamentally incapable of distinguishing conscious from non-conscious systems that are functionally equivalent in terms of report generation (formalizing the zombie argument) could force a reckoning. Conversely, a formal framework showing how TI could be *relaxed* in a principled, empirically grounded way would be valuable.

  **Conclusion:**

  The impasse isn't primarily about qualia's existence *per se*, nor just about definitions, but about the **evidential standard of Text-Invariance** mandated by heterophenomenology. This standard conflicts fundamentally with the critic's intuition of the possible independence of phenomenality from reportability and defines a programme focused on report generation, not subjective experience *as such*. Progress requires either challenging TI empirically by finding reliable third-person signatures *beyond* verbal reports that correlate with argued phenomenological properties, or conceptually refining the criteria for scientific evidence about consciousness to find a viable alternative to strict TI that doesn't collapse into subjectivism. Without addressing TI head-on, indefinite repetition of the current arguments is likely.
