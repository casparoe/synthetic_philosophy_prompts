answer: |-
  Very well. Let us begin with your critique of "trust for humanity". You are correct that the term is metaphorical, not fiduciary. The beneficiary is not a legal entity, but the cumulative and future public engaged in the study and appreciation of material culture. Our accountability lies in the rigorous preservation, contextualisation, and accessibility of the objects in our care. A breach would occur if we acted to deliberately obscure an object's full history – including the circumstances of its acquisition – suppressed legitimate scholarly inquiry, or allowed the collection to decay through neglect. 'Humanity' here denotes the potential audience across time and space, accessed through scholarship, publication, loans, and yes, physical display. London is a node in that network, not its entirety. This does not dissolve the plain facts of location; it frames their purpose.

  On accretion: Your fence analogy fails. The stolen painting in a private window accrues no documented public meaning, generates no scholarly discourse, and contributes nothing to the historical record beyond evidence of the crime itself. Contrast this with a Benin plaque displayed for 126 years in a major museum: it has been studied, catalogued, misinterpreted, re-interpreted, published in countless texts, drawn by students, debated by historians, and viewed by millions. This layered engagement – its life *within* the colonial and post-colonial institution – is an indelible part of its biography, inseparable from its original creation and looting. Unconditional return doesn't erase this accretion, but it risks rendering this complex chapter materially inaccessible to the publics and scholarship that engaged with it *here*. To permanently remove it is to make a curatorial decision privileging one historical layer over another. You cannot peel time away.

  Regarding the successor problem: If pressed today to designate a recipient for a Benin plaque, I would favour the Oba’s Court, in partnership with the Nigerian state and Igun Street casters, as it most directly links to the object’s creation context and ritual function. However, this very exercise proves the point – it is a fraught, contingent choice. No single entity perfectly embodies the unbroken lineage of the Edo Kingdom pre-1897. Hence, a negotiated settlement is essential. Our proposal is transfer of legal title to the agreed claimant entity, coupled with a binding, permanent custody agreement ensuring long-term rotational display (e.g., 10 years here, 15 years there), joint curatorship of exhibitions, and co-authorship of research. Should the claimant refuse *any* shared custody condition? Then the transfer of title would not proceed. Our duty to the object's *entire* history, including its century-long museum life and the public trust invested therein, compels us to retain custody until an agreement respecting its accreted significance is reached. We hold it not as owners, but as stewards obligated to its full story.

  **Claim:** An object's meaning is cumulatively accreted through its documented historical journey and public engagement, and unconditional physical return risks suppressing significant chapters of that biography, necessitating shared custody solutions that honour the object's entire history.
