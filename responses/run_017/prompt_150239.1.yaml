prompt: |-
  hey — i've got one 50-minute section next week with about twenty first-year PPE students and the topic i've been handed is the backward induction paradox and the centipede game. they've done normal-form games (PD, one coordination thing) and exactly one tree, an entry-deterrence one, and that's the lot. don't explain the paradox to me, i've read the basics — what i need is a plan for building it in the room, and specifically i want the dependency structure: what has to be on the board before what, because every time i try to sketch this i find myself using something i haven't actually put in place yet.

  so, the order the pieces have to go in and why. what has to be established before the folding-back step even looks like an argument rather than a trick — i'm guessing the load-bearing thing is that a strategy is a complete plan for every node, not a choice at the node you happen to be at, since otherwise they'll read backward induction as a prediction about which node gets reached. tell me if that's right and what else is load-bearing in the same way, and in what sequence it has to arrive.

  then the example. i want one concrete six-move centipede with real numbers, and i want to know what the numbers have to be like for the paradox to bite: pot growing as you pass, grabbing now beating waiting one more move, both players much richer if they get anywhere near the end, whatever else is essential. and what the example must *not* contain — anything that lets them explain the intuition away instead of feeling it: no uncertainty about when the game ends, no other-regarding payoffs, no way to promise or commit to anything, no repetition or shadow of the future. also why this example and not the finitely repeated prisoner's dilemma, which they've already met and at which they will immediately start shouting tit-for-tat and reputation, and not the ultimatum game, where the prediction is equally stark but the interesting part seems to be somewhere else entirely.

  two things i'm genuinely torn about and want you to either place or throw out:

  first, my own wrinkle. i've been messing with a version that has no fixed last node — instead, after every pass a fuse burns with probability about a third, and if it burns the game just stops and the pot is split evenly, and that's the end. as far as i can see there's then no known final node for the induction to start from, so the argument has literally nowhere to begin, and the conclusion flips to something like "keep passing". is that right? does it actually isolate the premise doing the work — that what matters is a *known* end, not merely that the game isn't infinite — or does it just look like a different game with different payoffs, in which case the students will shrug and learn nothing? and if it belongs in the session at all, does it go before the standard version or after? i can see a case for both and i can't decide.

  second, a colleague says i should open with the surprise exam, on the grounds that it's the same shape of argument and they'll find it more fun. i worry that's two puzzles in fifty minutes and neither lands. where would it have to sit, if anywhere, and what would it have to be *doing* there rather than just being a warm-up.

  misconceptions. here's what i'm braced for — tell me what i've missed, and for each one tell me the exact point in the sequence where it has to be headed off rather than just listed at the end: that the whole thing shows rationality is self-defeating (i think this is the wrong lesson and i want it dead early, but i don't want to kill it by flatly asserting that the theory is fine); that the fix is to make a promise or pre-commit, which i think smuggles in prisoner's-dilemma machinery; that you'd never actually reach the last node, so the reasoning is about a counterfactual you know to be false and can be ignored; that it's just the prisoner's dilemma again; that it's an empirical claim about how people behave in labs and the experiments refute it; and the one i'm least sure how to handle — a sharp student saying that if she finds herself at node five then plainly the other player isn't the sort who grabs, so of course she should pass. that last one feels half right and half a category mistake, and i don't know how to honour it without letting it eat the entire session.

  then: what do i openly refuse to explain at this level, and say out loud that i'm refusing it. i'm assuming the whole epistemic programme is out — common belief in rationality, whatever the actual results are about what backward induction requires, refinements, trembles — plus the experimental literature and whatever you'd say about altruism parameters. but tell me where exactly the line goes and whether anything i've just listed is actually cheap enough to keep.

  and one question for the last five minutes that tells me whether they've got the paradox rather than just the folding-back ritual — something they can't answer by restating the procedure. i was going to ask what would have to be false for the first mover to be right to pass, but i'm not sure that's the sharpest version of it, and it might just invite a wierd list of things people find psychologically plausible.

  keep it seperate from the readings, i'm not asking for anything to assign — just the shape of the session.
reasoning: |-
  Okay, let me tackle this step by step. The user is preparing a 50-minute session for first-year PPE students on the backward induction paradox and the centipede game. They've got a solid grasp of the basics but need help structuring the session, especially the sequence of concepts to avoid logical gaps. 

  First, I need to map out the dependency structure. The key load-bearing elements seem to be:
  - Defining strategies as complete contingent plans (not just choices at current nodes)
  - Reinforcing sequential rationality at every decision point
  - Establishing mutual knowledge of rationality as a necessary premise

  The numbers in the centipede example matter—pot should grow exponentially (say 2x each pass) while immediate grabs offer slightly better payoffs than waiting one more turn. Crucially, endgame payoffs must dwarf early grabs to highlight the tension.

  For their experimental variant with probabilistic ending... that's fascinating. It does isolate the "known end" premise since induction lacks a fixed starting point. But introducing it after the classic version would work better—let them feel the paradox first before undermining its foundation.

  The surprise exam analogy? Too risky as an opener—it's a distraction from game mechanics. Better to mention briefly at the end if time permits. 

  Major misconceptions to preempt:
  - "Rationality is self-defeating" (shoot this down when defining rationality as payoff-maximizing)
  - "Just promise to cooperate" (block when emphasizing one-shot nature)
  - "Node 5 implies irrational opponent" (confront during strategy definition)

  Things to explicitly rule out: epistemic conditions, experiments, social preferences. Draw the line at "this requires common knowledge of rationality—we're not proving that here."

  Final diagnostic question: "If Player 1 passes, what must she believe about Player 2's rationality?" Forces them to articulate the induction premise rather than recite steps.
answer: |-
  Here's a battle-tested sequence designed for clarity and cognitive tension, with explicit dependency markers. The core insight is that **strategies are ex-ante plans, not in-the-moment reactions**, and this must be established *before* drawing any trees.

  ---

  ### **Phase 1: Foundations (12 min)**
  *(Load-bearing concepts in bold)*  
  1. **"What is a strategy?"** (3 min)  
     - Contrast: "Choice at a node" (e.g., "I’ll enter if deterred?") vs. **"Complete contingent plan"** (e.g., "If deterred, I sue; if not, I monopolize").  
     - *Why first?* Without this, backward induction seems like a bait-and-switch.  
     - *Kill misconception:* "Node 5 implies irrational opponent" — Emphasize: **Strategies are chosen before the game starts. You don’t get to re-interpret your opponent mid-game.**  

  2. **Sequential Rationality Principle** (4 min)  
     - "At *every* node, the player must choose a payoff-maximizing action *given their belief* about what follows."  
     - Use their entry-deterrence tree: "Even if you reach the 'irrational' node, the incumbent still optimally acquiesces."  
     - *Dependency:* Requires understanding of strategies as plans.  

  3. **Mutual Knowledge of Rationality (MKR)** (5 min)  
     - "Player 1 knows Player 2 is rational. Player 2 knows Player 1 knows this. (Stop at 2 levels—no need for common knowledge.)"  
     - *Why here?* Needed to justify folding back: "When I assume what happens at node N, I rely on MKR holding there."  
     - *Kill misconception:* "Rationality is self-defeating" — Frame rationality as *individual* payoff maximization ("Theory isn’t broken; it’s strict").  

  ---

  ### **Phase 2: The Centipede (20 min)**  
  **Tree Example (6 moves, payoffs: P1, P2)**  
  ``` 
  1: Take (1,0) → END  
     Pass → 2: Take (0,2) → END  
              Pass → 3: Take (3,1) → END  
                       Pass → 4: Take (2,4) → END  
                                Pass → 5: Take (5,3) → END  
                                         Pass → 6: Take (4,6) → END  
                                                  Pass → (5,5)  
  ```  
  *Why these numbers?*  
  - Pot grows: (1,0) → (0,2) → (3,1) → (2,4) → (5,3) → (4,6) → (5,5)  
  - **Each "Take" gives the taker >50% more than passing would yield *for them* next turn** (e.g., P1 taking at node 3 gets 3 > passing to get 2 at node 4).  
  - **End payoff (5,5) massively better for both** (P1 gets 5x node-1 take, P2 gets 2.5x node-2 take).  
  - *Avoid:* Symmetry (highlights PD comparisons), round numbers (use integers to avoid arithmetic distractions).  

  **Folding Back in Class (10 min)**  
  - Start at node 6: "If reached, P2 takes (4>5? No, 4>5 false! Fix: **P2 compares 4 (take) vs. 5 (pass)** → Takes only if 4>5? Mistake! Payoffs are (P1,P2), so P2 gets 6 for taking vs. 5 for passing → TAKES.  
  - Node 5: P1 knows P2 would take at 6 → P1 compares taking (5) vs. passing (4) → TAKES.  
  - Node 4: P2 knows P1 takes at 5 → Compares taking (4) vs. passing (3) → TAKES. (*This step shocks them*).  
  - Continue to node 1: P1 takes immediately. Payoffs: (1,0) vs. potential (5,5).  

  **Paradox Discussion (4 min)**  
  - "Why does this feel wrong?" → Highlight tension: Individual rationality vs. collective benefit.  
  - *Kill misconceptions:*  
    - "It’s a PD": No, sequential moves and no mutual defection dominant.  
    - "Lab refutes it": Irrelevant (we’re analyzing logic, not behavior).  
    - "You’d never reach node 5": True, but **strategies are fixed upfront** — P2’s plan *must* specify node-5 action even if unreached.  

  ---

  ### **Phase 3: Your Wrinkle & The Twist (10 min)**  
  **Introduce Probabilistic End (5 min)**  
  - "After any pass, game ends with probability *p*=1/3 (payoffs split evenly)."  
  - *Key insight:* **No definite end node → no start for backward induction.**  
  - Result: Early passing can be rational! (e.g., P1 might pass hoping for accidental windfall).  
  - *Place here*: *After* classic version. Shows BI depends on **known finite horizon**, not just finiteness.  
  - *Why not before?* Classic version creates cognitive dissonance; this resolves it by attacking a premise.  

  **Surprise Exam? Skip it.**  
  - Same logic, but distracts from game-theoretic mechanics. Mention in closing if time: "This logic underlies the surprise exam paradox — but that’s for philosophy class!"  

  ---

  ### **Phase 4: Misconceptions & Boundaries (8 min)**  
  **Preemptions:**  
  - "Promises fix it?" → "No communication or binding commitments. This is a one-shot game." (Say during tree setup).  
  - "Empirical refutation?" → "We’re studying rational prediction, not psychology." (State when discussing paradox).  
  - "Category mistake!" → Reiterate **strategy-as-plan** when the sharp student speaks. Honor the insight: "Yes, in reality beliefs update! But BI assumes no belief revision — plans are rigid."  

  **What We Explicitly Ignore:**  
  - "We’re assuming **common knowledge of rationality and payoffs**. No trembles, no altruism, no reputation. Why? Because we’re isolating the logic of backward induction. Real people? Different question."  

  ---

  ### **Closing Diagnostic Question (Last 5 min)**  
  > **"Player 1 passes at node 1. What *must* be true for this to be rational?"**  

  *Why it works:*  
  - Forces them to identify the **necessary failure of backward induction’s premises** (e.g., "P1 believes P2 isn’t rational" or "P1 thinks the game might continue past node 6").  
  - Cannot be answered by rote BI steps.  
  - Reveals if they see BI as *conditional* on assumptions (the goal).  

  ---

  ### **Why Not Ultimatum/Repeated PD?**  
  - **Ultimatum**: Focuses on fairness, not sequential rationality. Rejection isn’t "irrational" in BI terms.  
  - **Repeated PD**: Triggers reputation/tit-for-tat intuitions — clouds the perfect-information, no-commitment lesson.  

  ### **Session Flow Summary**  
  ```
  0-12:  Strategies → Sequential Rationality → MKR  
  12-32: Centipede Tree → Folding Back → Paradox  
  32-42: Probabilistic Twist (Undermines BI)  
  42-50: Misconceptions + Diagnostic Question  
  ```  

  This sequence forces the paradox to emerge from first principles, isolates BI’s key assumptions, and gives students the tools to dissect it. Use the board to build the strategy definition *before* drawing the tree, and annotate payoffs carefully to avoid comparison errors.
