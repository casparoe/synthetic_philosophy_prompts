  First, I need to unpack their core concerns. The ratchet asymmetry is crucial—how can history cycle if some things (like science) only accumulate? The user seems skeptical about cyclical views handling this. They also want clarity on what "phase identity" means—how we decide two periods are the same phase, not just similar. And they’re probing whether a theory must self-locate, which feels like a meta-question about reflexivity. 

  The tribal preferences stand out: Progress advocates might ignore non-ratchet variables, while cyclical thinkers downplay ratchets. That tension might be unresolvable. The user’s hint about "no shape" being viable suggests they want criteria strict enough to falsify grand theories. 

  For deliverables, I’ll structure desiderata with negotiable flags and tensions. Phase Identity (D4) seems the biggest filter—many theories crumble here. Tribal biases: Cycle fans hate ratchets (D1), directionalists ignore non-ratchets (D2), and self-location (D8) is a litmus test for coherence. The ratchet-vs-cycle clash (D1 vs D3) feels irreconcilable—that’s the tension they want highlighted. 

  The scorecard at the end will contrast cyclical theories (struggle with ratchets) vs. directional ones (ignore recurrence). User’s depth hints they’ve wrestled with Spengler/Toynbee vs. modernists—I’ll keep that subtextual. 

  Not collapsing recurrence types is key. I’ll explicitly separate type-repetition (e.g., "all empires decay") from token-return (literal rewinds), since conflating them invalidates debates. Also, "no shape" must survive the criteria—so no sneaking in directional assumptions. 

  Biggest challenge: Balancing rigor without dogma. Some requirements (like D7, projection) might be impossible for any theory—that’s okay. User wants the cracks exposed.
answer: |-
  Here are the desiderata for an adequate account of history's large-scale shape, designed to address your core concerns, with explicit handling of your three focal points and meta-requirements. Each includes rationale, negotiability status, and flagged tensions.

  ---

  ### **Desiderata for an Adequate Account of History's Large-Scale Shape**

  1.  **D1: Ratchet Asymmetry Handling**  
      *   **Requirement:** Must explicitly distinguish between ratcheting variables (cumulative knowledge, technology) and non-ratcheting variables (political forms, cultural styles, social cohesion). Must either:  
          a) Explain how cyclical dynamics apply *despite* ratcheting variables (e.g., cycles occur "on top of" a directional baseline, or ratchets are irrelevant to the cycle's core variables), OR  
          b) Restrict cyclical claims solely to non-ratcheting variables and justify this restriction.  
          *For Directional Views:* Must explain how directional trends incorporate or transcend recurring non-ratcheting dynamics.  
      *   **Case:** Empirical observation (e.g., loss of Roman concrete technique vs. loss of Roman Republic; permanent gain of calculus, germ theory).  
      *   **Negotiability:** **Non-Negotiable.** Failure here renders the theory empirically inadequate for the modern context.  
      *   **Tension:** Directly clashes with simplistic cyclical claims applied universally. Raises Q: *Can a cycle be "pure" if ratchets permanently alter its starting conditions each turn?*

  2.  **D2: Units & Interaction Specification**  
      *   **Requirement:** Must unambiguously define the primary unit(s) of analysis (e.g., polity, civilization, economic mode, species, global system). Must specify mechanisms for interaction between units (e.g., diffusion, conquest, trade, mimicry, decoupling) and explain how the large-scale shape emerges from these interactions (e.g., synchronization, resonance, dominance, chaos).  
      *   **Case:** Polybius analyzed Rome; Toynbee civilizations; Marx modes of production; Big History the cosmos-to-humans trajectory. Interactions matter (e.g., does global capitalism synchronize business cycles, or do local cycles persist?).  
      *   **Negotiability:** **Non-Negotiable.** Without defined units/interactions, claims are untestable and ambiguous.  
      *   **Tension:** Units chosen often reflect tribal prejudice (nationalist vs. universalist). Syncing vs. decoupling mechanisms can radically alter aggregate shape.

  3.  **D3: Phase Identity & Projectivity Criteria**  
      *   **Requirement:** Must provide clear, operational criteria for identifying a "phase" (e.g., "Age of Faith," "Late Imperial Decadence"). Criteria must:  
          a) Distinguish genuine *phase recurrence* (instances share essential structural properties) from mere *surface similarity*.  
          b) Be applicable *projectively* (to plausibly identify an emerging phase *before* its full manifestation and periodization by historians).  
      *   **Case:** What makes 5th-c. BC Athens and 15th-c. AD Florence both "Renaissances" beyond artistic patronage? Can we identify "late imperial" symptoms today?  
      *   **Negotiability:** **Non-Negotiable.** Core to defining cyclical vs. directional claims. Without projective power, the theory is merely descriptive.  
      *   **Tension:** **Major Filter.** Most cyclical theories fail projective application or rely on vague analogies. Essentialist criteria risk rigidity; functionalist criteria risk losing distinctiveness. *Excludes the most candidates.*

  4.  **D4: Non-Collapse of Recurrence Types**  
      *   **Requirement:** Must rigorously distinguish:  
          a) *Type Recurrence:* The re-emergence of a *kind* of structure/process (e.g., "revolution," "bureaucratization").  
          b) *Token Recurrence:* The literal return of the *same specific* configuration (e.g., exact repeat of 1789 Paris in 2189).  
          c) *Oscillation:* Back-and-forth movement between poles (e.g., centralization/decentralization).  
          d) *Directional Accumulation:* Irreversible change (e.g., technological complexity).  
      *   **Case:** Ibn Khaldun's *asabiyyah* describes a recurring *type* of social cohesion dynamic, not identical tribal tokens. Marx's stages are directional, not oscillatory.  
      *   **Negotiability:** **Non-Negotiable.** Conflation invalidates the entire debate.  
      *   **Tension:** Tribal prejudice often leads cyclical advocates to imply token recurrence through rhetoric, while directionalists dismiss all recurrence as oscillation.

  5.  **D5: Accommodation of "No Large-Scale Shape"**  
      *   **Requirement:** Must allow "history has no overarching, discernible, law-like large-scale shape" as a possible, coherent conclusion that satisfies the desiderata. Cannot presuppose shape exists.  
      *   **Case:** Much professional historiography focuses on contingency, agency, and uniqueness, rejecting grand patterns.  
      *   **Negotiability:** **Non-Negotiable.** A theory of shape must be falsifiable.  
      *   **Tension:** Grand theorists (cyclical & directional) often presuppose shape exists.

  6.  **D6: Epistemic Clarity on Claim Type**  
      *   **Requirement:** Must explicitly state the metaphysical/epistemic status of the claimed shape: Is it a law? A heuristic? An empirical generalization? A narrative structure? What kind of evidence confirms/falsifies it?  
      *   **Case:** Is Spengler's morphology a poetic metaphor or a biological law? Is "progress" a fact or a value judgment?  
      *   **Negotiability:** **Non-Negotiable.** Essential for evaluating "what kind of claim" is being made.  
      *   **Tension:** Often obscured, leading to talking past each other.

  7.  **D7: Projective Power / Phase Location**  
      *   **Requirement:** Must provide a method for locating the *present* within its proposed shape (if any). Must address the *reflexivity challenge:* If the theory claims the present is in phase X, must it explain its *own emergence* as a phenomenon characteristic of phase X?  
      *   **Case:** A "late decadence" theory must explain why diagnosing decadence is a symptom *of* decadence. A "scientific age" theory must explain the rise of big history/science.  
      *   **Negotiability:** **Negotiable (Tribal Preference).** *Cyclical/Late-Stage Theorists* see this as non-negotiable (e.g., Spengler). *Directional/Early-Stage Theorists* often neglect reflexivity. Critics see demanding perfect reflexivity as a *reductio*.  
      *   **Tension:** **Profound.** Satisfying this fully may be impossible without paradox or self-fulfilling prophecy. *Major source of skepticism.*

  8.  **D8: Evidence Integration (Cumulative S&T)**  
      *   **Requirement:** Must explicitly engage with the evidential challenge posed by ~500 years of cumulative science and technology. Does this fact:  
          a) Falsify strict cyclical views (token or strong type recurrence)?  
          b) Constrain cyclical views to specific domains (non-ratcheting)?  
          c) Coexist with cyclical dynamics in other domains?  
          d) Support directional views exclusively?  
      *   **Case:** The existence of nuclear physics and global digital networks as irreversible knowledge/artifacts.  
      *   **Negotiability:** **Non-Negotiable.** The central empirical challenge to recurrence.  
      *   **Tension:** **Core Tension with D1.** The biggest hurdle for cyclical views. Directional views must still explain recurrent non-ratcheting phenomena (D2).

  ---

  ### **Key Tensions & Tribal Preferences**

  *   **The Ratchet vs. Cycle Tension (D1, D8 vs. D3):** The existence of cumulative S&T seems fundamentally incompatible with *strong* cyclical views (token recurrence or identical type recurrence of whole-system states). **This is likely the central, potentially unresolvable tension.** Cyclical views must become highly restricted (to non-ratcheting domains) or complexified (cycles on a directional trend).
  *   **Projectivity vs. Hindsight Bias (D3):** Defining phases projectively (D3b) is extremely difficult; criteria often only work retrospectively. This is a major weakness in cyclical claims.
  *   **Reflexivity Paradox (D7):** Demanding a theory explain its own emergence *as a symptom of the phase it diagnoses* creates deep logical and epistemological challenges. Satisfying this fully may be impossible.
  *   **Tribal Preferences:**
      *   *Cyclical Camp:* Tends to downplay/explain away ratcheting variables (D1), emphasize non-ratcheting variables (D2), rely on analogical rather than projective phase identity (D3), and insist on self-location/reflexivity (D7).
      *   *Directional Camp:* Tends to emphasize ratcheting variables as definitive (D1/D8), downplay or explain recurrence in non-ratcheting domains as epiphenomenal or oscillatory (D2/D4), often neglect reflexivity (D7), and conflate direction with progress (value bias).
      *   *"No Shape" Camp:* Emphasizes failures of projective power (D3), unit definition problems (D2), uniqueness of contexts, and the reflexivity paradox (D7).

  ---

  ### **One-Line Scorecards**

  *   **Cyclical Tradition (Polybius, Ibn Khaldun, Spengler, Toynbee):** Excels at identifying recurring patterns in *non-ratcheting* domains (politics, cohesion, culture) and unit dynamics (D2, D3-type). **Struggles catastrophically** with ratchet asymmetry (D1, D8), projective phase identity (D3b), and reflexivity (D7). Often conflates type and token (D4).
  *   **Directional/Cumulative Pictures (Enlightenment Progress, Marx, Modernization Theory, Big History):** Excels at integrating ratcheting variables (D1, D8) and defining directional trends. **Struggles** with explaining recurrence in non-ratcheting domains (D2), often lacks projective phase criteria (D3), neglects reflexivity (D7), and risks value-laden teleology.
  *   **"No Shape" Position:** Strong on uniqueness, contingency, D5. **Struggles** to explain *any* large-scale patterns, even limited ones (e.g., recurrent dynamics of empires), potentially underselling structure.

  **The most excluding requirement is D3 (Phase Identity & Projectivity).** The most profound tension is reconciling **D1/D8 (Ratchet/Cumulative S&T)** with any strong claim of **D3 (Phase Recurrence).** Reflexivity **(D7)** remains the most philosophically vexing.
