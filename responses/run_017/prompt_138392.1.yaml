answer: |-
  ## The Person Who Came In From The Night

  The latest pamphlet from Meridian’s Commission on Chronological Equity landed on my desk like a dropped brick. Edition Three of their *Chrononeutral Usage Manual*. Bram, leaning against the doorway of my cramped office, caught my expression. Bram runs the night desk. Has for twenty years. He’s Second Watch, born and bred, nocturnal as an owl and proud of it. He also thinks this whole Commission business is, as he puts it, “mostly theatre, with expensive sets.”

  “They’ve done it, Bram,” I sighed, shoving the glossy booklet away. “They’ve gone full personhole cover.”

  Bram chuckled, a low rumble. “Aw, Marley. Don’t tell me ‘persontime’ finally broke you? Thought you were made of sterner stuff.” He ambled in, snagging the manual. “Let’s see what fresh linguistic hell they’ve cooked up.”

  He flipped pages. “Personlight… personbreak… persondream…” He paused. “Personcare? Like childcare? Is caring suddenly solar-powered?” He shook his head. “And oh, look, they’ve reached the pinnacle: ‘someperson’ and ‘holiperson’. Because clearly, ‘someday’ was oppressively solar.” He tossed it back. “Theatre, Marley. Expensive, time-consuming theatre.”

  “It’s an imposition, Bram!” I protested, the familiar heat rising. “They want us to replace ‘day’ with ‘person’ everywhere except when we’re literally talking about the sun battling clouds. ‘Meet you at personbreak?’ Sounds like a medical procedure! ‘Working hard all person?’ Like I’m an abstract concept! It’s clumsy. It’s unnatural. It forces everyone to stumble over every other sentence just to appease…”

  “Appease whom?” Bram cut in smoothly, his dark eyes sharp. “Me? Us?” He gestured vaguely towards the window where the late afternoon sun slanted in. “You think *I* need to hear ‘personlight’ to feel included? I know when I wake up, Marley. It’s night. The *real* day for me and mine. Changing a word on a page doesn’t change that reality. Doesn’t magically make the bank open at moonrise.”

  “Exactly!” I seized on it. “So why inflict this awkwardness on everyone? ‘Day’ works. It’s the default. It’s how we coordinate! ‘See you tomorrow’ – simple, universal. ‘See you next person’? Sounds like a threat from a temporal assassin! ‘What a beautiful person!’ Are we complimenting the weather or a stranger?”

  “Coordination,” Bram mused, leaning back. “That’s your real gripe, isn’t it? The shared default. It’s efficient. Like driving on the right. Changing the default… yeah, it imposes a cost. A tiny friction on every single utterance involving time. For what? To make the diurnals, the solar majority, pay a little attention? A symbolic tax?”

  “Yes! A tax for a problem this manual doesn’t even properly define!” I jabbed a finger at the discarded pamphlet. “Is it about changing *speech*? Then why not just campaign for using ‘night’ more positively? Is it about changing *thought*? Good luck legislating that. Or is it just… virtue signalling? Making the majority pay a small, constant cost in mental effort? It feels punitive. And pointless!”

  Bram nodded slowly. “Punitive. Pointless. Maybe. But ask yourself, Marley: *why* is the solar default so efficient? Because the sun *is* a giant, flaming coordination device in the sky. Most people *are* awake under it. Society *is* built around its cycle. That’s… biological reality meeting social structure. Not the same as deciding ‘mankind’ means everyone or that ‘chairman’ is the only possible term.” He held up a hand to forestall my objection. “I’m not saying the *feeling* of exclusion isn’t real for some. Or that language doesn’t shape thought, a bit. But the foundation here? Rock solid. Sunlight. Darkness. You can’t committee that away. Trying to force ‘person’ into every temporal slot… it’s like trying to replace ‘up’ and ‘down’ with ‘direction one’ and ‘direction two’ because gravity feels biased towards the planet’s core.”

  He tapped the manual again. “And look at the mess. ‘Personlight’? Still screams ‘daylight’, only now it’s clunky and draws *more* attention to the thing it’s supposedly dissolving. And ‘holiperson’? Try saying that three times fast at a city council meeting without sounding like you’ve got a mouthful of marbles. It’s unpronounceable in good faith. And what about words where the ‘day’ part is dead? Like ‘someday’? They want ‘someperson’? But ‘someday’ doesn’t mean ‘some sun’, Marley. It means ‘at an indefinite future time’. The solar link is fossilized. Changing it breaks the meaning for zero gain. The Commission’s own rule trips over its own logic. They haven’t solved the problem; they’ve just created a new layer of awkwardness.”

  He was right, frustratingly. The analogy *did* fray. The naturalistic anchor existed. Yet… the sheer *weight* of the solar default, the way it rendered my own experience… secondary… invisible… gnawed at me in a way Bram, secure in his nocturnal pride, perhaps didn’t fully grasp. He could shrug off the linguistic slight because he embraced the difference. Not everyone could.

  Later. Much later. The Ledger building was silent, tomb-like. The only light came from my desk lamp and the cold glow of my screen. Outside, the true pulse of Meridian – the Second Watch’s Meridian – hummed. Delivery bots whirred, shift workers laughed on their breaks, the distant clang of the night-market setting up. My natural habitat.

  I stared at the open letter draft addressed to the Ledger’s editor:

  *To the Editor,*
  *The Commission’s relentless campaign to impose ‘chrononeutral’ jargon reaches new heights of absurdity with Edition Three of their manual...*

  I paused. My eyes felt gritty. My thoughts, usually sharp as a proofreader’s pencil by night, felt sluggish, tangled. The idioms Bram mentioned… they echoed in my own tired mind. *Working hard all person…* It *was* unnatural. But so was the effort of *not* seeing my own rhythm as the deviation. For forty years I’d been Marley Dane, the dependable copy chief. Arriving “early” (mid-afternoon), leaving “late” (just before dawn), fuelled by coffee and the quiet camaraderie of the skeleton night staff. Passing. Blending. It cost me… what? A slight circadian drag, easily ignored? A few missed daytime social events? A lifetime of pretending dawn was my morning, not my bedtime?

  Almost nothing. Personally.

  And yet… writing this letter, this furious defence of the solar default *I* navigated as camouflage… it felt like tearing at a scab over something deeper. The Commission’s clumsy words – ‘personbreak’, ‘persondream’ – were ridiculous. But they were also tiny, awkward flares shot into the linguistic darkness, trying to illuminate a presence. *My* presence. The presence of Bram, and the night cleaners, and the bakers starting their ovens while the diurnals slept. The unmarked category wasn't just efficient; it was erasing.

  I typed on, the clack of the keys loud in the empty office:

  *...This forced substitution imposes an unnecessary cognitive burden on all speakers for purely symbolic ends. The solar cycle is a fact, not a bias. ‘Day’ as a temporal unit is ingrained, efficient, and devoid of malice. We urge the Commission to abandon this quixotic effort and focus on substantive issues affecting Meridian’s diverse communities.*

  *Sincerely,*
  *Marley Dane*
  *Copy Chief*

  I leaned back, rubbing my temples. Three seventeen AM. The deepest, most vital point of *my* day. Outside the window, a delivery van hissed to a stop, its engine a familiar night-desk lullaby. My letter was good. Logical. Persuasive. Bram would approve of its scepticism. The diurnal readers would nod in agreement. It defended the efficient, sun-anchored coordination device that let society function smoothly.

  And as I proofread it one last time – the arguments crisp, the defence of the default airtight – a wave of profound exhaustion washed over me, thicker than the late-night coffee could dispel. It wasn't just physical tiredness. It was the wearying weight of a lifetime spent twisting myself to fit a frame measured by sunlight. The letter itself, this vehement defence of the very structure that required my camouflage, written in the silent heart of *my* world while pretending to speak from *theirs*, was the most damning evidence the Chrononeutral Commission could possibly wish for. The words on the screen, arguing for efficiency and natural order, were written by a ghost in the daylight machine, haunting its own life. The cost wasn’t almost nothing. It was the quiet erosion of self, articulated perfectly in the language of the conqueror. I hit ‘send’. The theatre of outrage was complete.
