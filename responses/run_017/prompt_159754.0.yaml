     Important: They do not see their original intention card at this point.

  2. **Authors Write Revised Meaning (5 minutes):**
     - Each author (solo or pair) writes their revised intention based on seeing the interpretation(s). For pairs: do they write one revised intention together? Or separately? We want to see if they converge or diverge. So we should have each write their own revised intention privately again? 

     How about: 
       - For solo: one revised intention.
       - For co-written pairs: each writes their own revised intention privately (without sharing with the partner). 

     This adds complexity: we can see if the two authors of the same text, after seeing the same interpretations, come to the same revised meaning or not.

     So hand out:
       - To each author (solo or in a pair) a "revised intention" card.

     Task: "Look at the interpretations from your readers. Then, on this card, write what you now say the text means. Be honest. If you see something in the text now that you didn't intend, you can incorporate that. Or you might stick to your original. For co-writers: each of you write your own revised intention without discussing with your partner."

  3. **Collect Revised Intentions (2 minutes):** Collect the revised intention cards.

  **Phase 5: The Reveal and Discussion (25 minutes)**

  Now we have:
  - Original intention(s)
  - Interpretation(s)
  - Revised intention(s)

  We want to bring it all together.

  1. **Set up for Discussion (5 minutes):**
     - We need to present a few cases to the whole group. We can't do all 12 due to time. Select 3-4 cases that illustrate different scenarios:
       - A solo text where the interpretation was close to the original intention.
       - A solo text where the interpretation was far from the original.
       - A co-written text where the two original intentions were different and the interpretations were different.
       - A case where the revised intention changed a lot.

     How to choose? The instructor can quickly scan during the session or pre-select a few that seem interesting.

     Alternatively, we can do a gallery walk? But that might be chaotic.

     Let's do: the instructor selects 4 texts (2 solo and 2 co-written) that show interesting disconnects. Then for each, we present:

     Steps for each case (about 5 minutes per case, total 20 minutes for 4 cases):

     For a selected text:
       - Read the text aloud (anonymously).
       - Reveal the original intention(s) (for co-written, both).
       - Reveal the interpretation(s) from the reader(s).
       - Reveal the revised intention(s).

     Then ask the group: 
       - What do you think? Is the reader's interpretation wrong? 
       - Which one should we take as the meaning: what the author originally intended, what the reader understood, or what the author now says?
       - For co-written: if the two authors had different original intentions and maybe different revised ones, what then?

     But note: we don't want to name positions (intentionalism, etc.). We want them to feel the problem.

  2. **Discussion (20 minutes):**
     - Guide the discussion with questions:
       - For a text where the interpretation was different: "The author says they intended X, but the reader saw Y. Then after seeing Y, the author now says Z. What do you make of that?"
       - "Can a text mean something that the author didn't intend? If so, how do we know what it means?"
       - "What if the author changes their mind about what it means? Does that change what it always meant?"
       - "For the co-written text: if the two authors had different ideas from the start, is there one 'author's intention'? And if they now have different revised intentions, what then?"

     Encourage students to respond to each other.

  **Debrief (5 minutes):**

  - Summarize without naming theories: "Today we saw that when we write, we have an intention. But when others read, they might see something else. And sometimes, even the author might see something new in their own text later. So what a text says and what we meant might not always be the same. And when they come apart, it's not always clear how to settle what the text really means. This is a puzzle that comes up in literature, law, and everyday communication."

  **Predictable Problems and Solutions:**

  1. **Time Management:** 
     - Writing might take longer than 10 minutes. Solution: set a strict timer and encourage brevity. Example: "Your fable must be 3-5 sentences. We are not looking for perfection."
     - Discussion might run over. Solution: select only 3 cases if time is short.

  2. **Co-Writing Pairs Disagreeing During Writing:** 
     - They might argue over the text. Solution: remind them that they are co-writing but will have private intentions. If they can't agree on the text, they can write a compromise.

  3. **Students Not Taking It Seriously:** 
     - They might write silly texts. Solution: encourage them to write something with a point, even if simple.

  4. **Anonymity Issues:** 
     - Students might recognize handwriting. Solution: type the texts? Or have them write on a computer? But that might not be feasible. Alternatively, the instructor can read the texts aloud without revealing who wrote them.

  5. **In the Confrontation Phase:** 
     - Authors might feel attacked by interpretations. Solution: frame it as an exploration, not criticism. Emphasize that different interpretations are normal.

  6. **In Discussion:** 
     - Some might insist that the author's original intention is the only thing that matters. Solution: ask them to respond to a case where the author changed their mind or where the co-authors had different intentions. Ask: "If the author didn't realize they were influenced by their father, but it shows in the text, is that part of the meaning?"

  **What the Setup Can't Reproduce:**

  - In real life, the author might not be present or might be dead. So we can't ask for their intention or revised intention. Also, the emotional investment in a published piece (like your essay) is higher. Students might not be as invested in their short fables. You might have to point out that in real literary interpretation, we often don't have access to the author, and the text has to stand on its own. And for published authors, the stakes are higher because their identity is tied to the work.

  **Materials List:**

  - Writing sheets (12 sheets: for 8 solo and 4 pairs? Actually, 8 solo and 4 co-written -> 12 sheets)
  - Intention cards: 
     - Original: 16 (8 solo + 8 in pairs) -> 16 cards? But for co-written, each author writes their own, so we need 16 intention cards (one per student).
  - Interpretation cards: 16 (one per reading assignment)
  - Revised intention cards: 16 (one per student, because for co-written, each writes their own revised intention)

  **Timeline:**

  | Time          | Activity                                                                 | Details |
  |---------------|--------------------------------------------------------------------------|---------|
  | 0-2 min       | Introduction and Assignment                                              | Explain the writing task. Assign: 8 solo writers, 8 in 4 pairs. Hand out materials. |
  | 2-12 min      | Writing                                                                  | Students write texts (10 minutes). Solo: write text and intention. Pairs: write text together, then each writes private intention. |
  | 12-15 min     | Collect and Anonymize                                                    | Collect texts and intention cards. Assign codes. |
  | 15-17 min     | Assign Texts for Reading                                                 | Assign each student a text to read (some texts to two students). Hand out texts and interpretation cards. |
  | 17-27 min     | Reading and Interpreting                                                 | Students read their assigned text and write interpretation. |
  | 27-30 min     | Collect Interpretation Cards                                             | |
  | 30-35 min     | Return Texts and Interpretations to Authors                              | Hand each author (or pair) their text and the interpretation card(s) they received. For pairs: both authors together. |
  | 35-40 min     | Authors Write Revised Meaning                                            | Each author (solo or in a pair) writes a revised intention on a new card. For pairs, each writes privately. |
  | 40-42 min     | Collect Revised Intentions                                               | |
  | 42-62 min     | Discussion of Selected Cases (4 cases, 5 min each)                       | Instructor selects 4 texts (2 solo, 2 co-written) that show interesting disconnects. For each: read text, reveal original intention(s), interpretations, revised intentions. Then open for group discussion. |
  | 62-67 min     | Group Reflection                                                         | Broader questions: What did we learn? How do we settle meaning? |
  | 67-75 min     | Debrief                                                                  | Summarize the tension without naming theories. |

  **Note:** During the discussion phase, the instructor must avoid naming intentionalism/anti-intentionalism until the very end, if at all. The debrief should only frame the problem.

  This design meets the requirements and should create the desired experience.
answer: |-
  ### Session Design: "The Fable and the Reader"  
  **Goal:** Students experience the tension between authorial intent and reader interpretation firsthand, without theoretical jargon. They'll confront: (1) authorial intent isn't always singular (via co-writing), and (2) meaning can shift over time (via revised intent).  
  **Takeaway:** "What I meant" and "what the text says" are distinct and may not align—neither automatically "wins."  

  ---

  ### **Rules, Roles, and Materials**  
  **Participants:** 16 students.  
  **Groups:**  
  - **Solo Writers (8 students):** Each writes one short text and records private intent.  
  - **Co-Writers (4 pairs, 8 students):** Each pair collaborates on one text, but records their intent *privately* (without sharing).  
  **Texts Produced:** 12 total (8 solo + 4 co-written).  
  **Readers:** Each text is read by 1–2 students (randomly assigned). 8 texts have 1 reader; 4 texts have 2 readers (ensuring all 16 students read something).  

  **Materials Per Student:**  
  - 1 "Text Sheet" (lined paper).  
  - 1 "Secret Intent Card" (small index card).  
  - 1 "Reader Interpretation Card" (small index card).  
  - 1 "Revised Intent Card" (small index card).  
  - Folders for anonymizing texts (labeled with codes, e.g., T1, T2).  

  **Prep:**  
  - Tables/pens, timer visible to all.  
  - A box for collecting cards/texts anonymously.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 minutes**  

  | Time  | Phase                  | Activity                                                                                                | Instructor Notes                                                                 |
  |-------|------------------------|---------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | 0-5   | **Intro (Context-Free)** | Explain the task neutrally: "Today, we’re exploring how stories communicate. You’ll write micro-fables (3–5 lines), swap them, and interpret each other’s work. Focus on clarity and brevity."<br>- Demo a 3-line fable (e.g., "A wolf chased a rabbit. The rabbit hid. The wolf starved. Moral: Greed blinds.").<br>**Assign Roles:** Randomly split class into 8 solos and 4 pairs. Hand out materials. | Avoid words like "intent" or "meaning." Keep it playful: "Write a tiny fable with a moral." |
  | 5-15  | **Writing Texts + Private Intent** | **Solo Writers:** Write fable on Text Sheet. On Secret Intent Card, complete: "When I wrote this, my secret meaning was: ______."<br>**Co-Writer Pairs:** Discuss and agree on 1 fable (Text Sheet). *Then, privately and silently*, each writes their *own* Secret Intent Card (same prompt). | Circulate to enforce privacy: "No peeking at your partner’s card!" Time reminders at 5min/2min. |
  | 15-20 | **Anonymize & Assign** | Collect Text Sheets and Secret Intent Cards. Remove names, assign codes (T1-T12). Shuffle Text Sheets.<br>**Assign Readers:** Randomly distribute Text Sheets (1 per student). 4 texts go to 2 readers each; 8 to 1 reader each. Hand out Reader Interpretation Cards. | Use codes to track intent/revised cards later. Ensure no one gets their own text. |
  | 20-30 | **Reading & Interpreting** | Students read their assigned text. On Interpretation Card, complete: "What I think this text is *really* saying is: ______." | Encourage honesty: "There are no wrong answers—go with your gut." |
  | 30-35 | **Collect & Redistribute** | Collect Interpretation Cards. Redistribute to authors:<br>- **Solos:** Get their Text Sheet + all interpretations of it.<br>- **Pairs:** Get their Text Sheet + all interpretations of it (both partners together). | Keep Secret Intent Cards *hidden* for now. Hand out Revised Intent Cards. |
  | 35-45 | **Confrontation & Revised Intent** | Authors see interpretations. **Prompt:** "After seeing how others read your text, what do you *now* say it means? Write privately."<br>- **Solos:** Write 1 Revised Intent Card.<br>- **Co-Writers:** Each writes their *own* Revised Intent Card (no discussion). | Stress privacy: "Don’t talk—just reflect." Timekeeper: Stick to 10min. |
  | 45-65 | **Small Group Discussion** | Form 4 groups of 4. Each group gets 1 solo text and 1 co-written text (with all cards: secret intents, interpretations, revised intents). **Tasks:**<br>1. Read the text aloud.<br>2. Share (anonymously): "What the author(s) *first* said it meant, what readers saw, and what the author(s) *now* say."<br>3. Debate: "Which meaning feels most true? The author’s first thought? The readers’ take? The author’s new view? Or none?" | Assign texts to groups. Warn: "No naming theories! Focus on the evidence in front of you." |
  | 65-75 | **Full Group Debrief** | Groups share key tensions. **Guiding Qs:**<br>- "When did a reader’s take surprise an author? Why?"<br>- "For co-written texts: If the two authors disagreed, whose intent ‘counts’?"<br>- "If the author changed their mind, does that rewrite history?"<br>**Close:** "Today, we saw how meaning isn’t fixed. What you *meant*, what you *wrote*, and what others *see* can split—and it’s messy. That’s the heart of interpretation." | Note patterns on board (e.g., "Author shocked," "Pair disagreed," "Reader convinced author"). End without jargon—save "intentionalism/anti-intentionalism" for next session. |

  ---

  ### **Debrief: Mapping Moves to Real Disputes**  
  During small/full group discussions, highlight these predictable moments:  
  - **"The readings are wrong!" (Author insists):** Common when interpretations feel personal. *Map to:* Your essay readers "overinterpreting." Ask: "What in the text *invited* that misread? Is it still ‘wrong’ if others see it?"  
  - **Co-Writer Pair Disagreements:** E.g., one says the fable was "about greed," the other says "about fear." *Map to:* How "the author" isn’t always a unified voice. Ask: "If the authors clash, whose intent rules?"  
  - **Revised Intent Shifts:** An author adopts a reader’s take (e.g., "I see now it’s about my dad!"). *Map to:* Your own experience—does your essay "become" about your father once you see it?  
  - **Reader Certainty:** A reader doubles down (e.g., "The text *clearly* says X, regardless of intent"). *Map to:* Anti-intentionalism in action—text as independent.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Students write overly literal/silly fables, avoiding depth.  
     - **Fix:** Demo a nuanced fable upfront (e.g., "A bird hated cages but built one for its enemy. Moral: Fear corrupts"). Remind: "Make it rich enough to interpret."  

  2. **Problem:** Co-writers argue during text creation, ignoring private intent.  
     - **Fix:** Intervene: "Your job is to agree on the *words*, not the meaning. Save meaning for your secret card."  

  3. **Problem:** Readers guess authors and bias interpretations.  
     - **Fix:** Use codes, not names. Instruct: "No identifying details in fables." If suspected, say: "Focus on the text, not the author."  

  4. **Problem:** Authors feel attacked by "wrong" readings.  
     - **Fix:** Normalize: "This happens to all writers—even [famous author]! It’s about the text’s clues, not you."  

  5. **Problem:** Time runs short in small groups.  
     - **Fix:** Assign strict 8min per text. Provide discussion prompts: "Start with: ‘Whose view is most convincing? Why?’"  

  ---

  ### **Limitations of the Setup**  
  **What it can’t replicate:**  
  - **Emotional Investment:** Your published essay involved vulnerability; student fables are ephemeral. They won’t feel the *stakes* of personal exposure.  
  - **Cultural/Historical Distance:** Real interpretation often lacks the author (e.g., analyzing Shakespeare). Here, authors are present and can "defend" their work.  
  - **Complexity of Published Work:** A polished essay has layers of nuance; 3-line fables are simplistic. The "gap" between intent and text is narrower here.  

  **Where You’ll Need to Lecture:**  
  At the start of the *next* session, bridge the exercise to reality:  
  > "Last week, we saw how intent, text, and interpretation pull apart. But in real life—like with my essay—the author isn’t always there to explain or change their mind. Readers bring their own histories, and texts take on public meanings. That’s why the debate matters: it’s about who gets to decide what a text ‘says’ when the author is silent, contradicted, or gone."  

  This sets up intentionalism/anti-intentionalism without spoiling the experiential learning.  

  ---  
  **Why this works:** Students "live" the problem—authorial intent fractures (co-writing), interpretations diverge, and meaning evolves (revised intent). By anonymizing texts and withholding theory, the tension arises organically. They’ll leave unsettled (in a good way) about where meaning "lives."
