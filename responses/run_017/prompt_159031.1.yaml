prompt: |-
  I have been asked to advise the board of the public school district that hosts my university's teacher-training program, and I want to be sure I audit the argument the superintendent is actually making rather than the one it resembles. The board is deadlocked over whether promotion from eighth to ninth grade should turn on a single standardized exam. Rather than settle that, the superintendent proposes a four-year "parallel pilot": half the district's middle schools keep the exam gate, half replace it with a portfolio review conducted by teachers; every school reports annually to a common dashboard (ninth-grade course completion, subsequent test scores, attendance, dropout); and the board then adopts whichever version scores better, revisiting the question every four years thereafter. She presents this as taking Dewey seriously: inquiry begins in an indeterminate situation and resolves it by acting on the world and attending to what follows, so we do not need a prior account of what promotion is for — the experiment will tell us. Please audit the analogy, not the policy.

  Give me, in this order and at roughly these lengths: "The mapping" — a table of what is supposed to play the role of hypothesis, treatment group, control group, random assignment, replication, outcome measure, experimenter's standpoint, subjects, and closure, plus about 120 words on where the mapping is doing real work; "Where it holds" (about 120 words); "Disanalogies that matter for the use being made" (about 300 words: for each, say which step of her argument it undercuts — note in particular that the schools are not exchangeable units, that the units are cohorts rather than repeatable trials, that the dashboard's measures are not independent of the treatment and appear to presuppose one contested answer about what promotion is for, that the costs of a failed "trial" fall on children who cannot be re-run, and that there is no standpoint outside the dispute from which the results simply speak); "Disanalogies I should ignore" (about 100 words); "The strongest reply from inside the view" (about 150 words — I have in mind the claim that in social inquiry the fact that those affected are also the inquirers is a virtue, not a defect, since the public constitutes itself through inquiry; tell me what granting that costs the epistemic work the analogy was doing); "Does the conclusion survive?" (about 200 words, separating the weak claim that deliberate iteration beats deadlock from the strong claim that iteration can replace settling the end in advance, and specifying what would have to be supplied for the strong claim to be licensed — including whether pre-registering the dashboard before the pilot begins helps, and why or why not); and finally "A better analogy, if there is one" (about 150 words — consider whether the familiar federalist image of jurisdictions as laboratories, or something closer to common-law reasoning from precedent, carries more of the argument than the laboratory does).
reasoning: |-
  Hmm, the user is asking me to audit an analogy used by a school superintendent in a public school district. The superintendent proposes a four-year pilot program where half the schools keep a standardized exam for promotion to ninth grade, while half use portfolio reviews, with outcomes tracked on a common dashboard. She frames this as taking John Dewey's philosophy of inquiry seriously - that we can resolve indeterminate situations through action and observation without needing prior agreement on goals.

  The user wants me to analyze the analogy to a scientific experiment rather than evaluate the policy itself. They've requested a very structured response with specific sections: "The mapping," "Where it holds," "Disanalogies that matter," "Disanalogies to ignore," "The strongest reply," "Does the conclusion survive?" and "A better analogy."

  For "The mapping," I need to create a table showing how elements of the pilot correspond to components of a scientific experiment: hypothesis, treatment group, control group, random assignment, replication, outcome measure, experimenter's standpoint, subjects, and closure. I'll need to explain how this mapping is doing real work in making the pilot appear rigorous and evidence-based.

  For "Where it holds," I'll highlight that the proposal does create a structured comparison between alternatives and that it embraces the Deweyan spirit of learning through action. The pilot does generate data that could inform decisions, which is valuable when stakeholders are deadlocked.

  The "Disanalogies that matter" section is crucial. I need to identify key differences that undermine the experimental analogy: schools aren't exchangeable units, cohorts aren't repeatable trials, outcome measures aren't neutral, the costs fall on children who can't be re-run, and there's no objective standpoint. Each of these undercuts a different aspect of the superintendent's argument.

  For "Disanalogies to ignore," I'll note that concerns about perfect randomization or exact replication can be set aside since this is a practical policy experiment rather than pure science.

  In "The strongest reply," I'll acknowledge the Deweyan perspective that social inquiry involves participants as inquirers, which builds public legitimacy. But this comes at the cost of the experimental analogy's objectivity claims.

  For "Conclusion survival," I'll argue that the weak claim about breaking deadlock holds, but the strong claim that iteration can replace defining goals fails. Pre-registering the dashboard helps with transparency but doesn't solve the fundamental issue of contested outcomes.

  Finally, for "A better analogy," I'll suggest federalist "laboratories of democracy" or common law reasoning as more appropriate frameworks that embrace iteration and adaptation without claiming experimental neutrality.
answer: |-
  ### The Mapping

  | Element             | Superintendent's Analogy               |
  |---------------------|----------------------------------------|
  | **Hypothesis**      | Portfolio review produces better outcomes than standardized exam |
  | **Treatment Group** | Middle schools using portfolio review |
  | **Control Group**   | Middle schools retaining the exam     |
  | **Random Assignment**| Non-random assignment ("half the district's middle schools") |
  | **Replication**     | Annual reporting across cohorts; revisiting every 4 years |
  | **Outcome Measure** | Dashboard (course completion, test scores, attendance, dropout) |
  | **Experimenter's Standpoint** | The board, interpreting dashboard data "objectively" |
  | **Subjects**        | Students in participating schools     |
  | **Closure**         | Board adopts the "better" version after 4 years |

  **Where the mapping does real work (120 words):**  
  The analogy frames the pilot as a structured, data-driven comparison, lending scientific legitimacy to what is fundamentally a political compromise. By casting schools as "treatment" and "control" groups and outcomes as neutral "measures," it suggests the dashboard will *reveal* an objective answer, bypassing ideological debate. This appeals to board members seeking evidence-based decisions. The replication element (annual reports, 4-year cycles) implies iterative refinement, aligning with Dewey’s emphasis on continuous inquiry. The analogy thus shifts focus from abstract principles ("What is promotion for?") to observable consequences, making the superintendent’s proposal appear pragmatic and rigorous.

  ---

  ### Where It Holds (120 words)  
  The analogy holds in its Deweyan core: confronting an "indeterminate situation" (deadlock over promotion criteria) with *deliberate action* (the pilot) to generate experiential data (dashboard metrics). It rejects a priori theorizing in favor of learning through intervention, echoing Dewey’s instrumentalism. Structuring the pilot with defined groups, consistent metrics, and scheduled review creates a systematic feedback loop. This operationalizes Dewey’s view that inquiry transforms ambiguity into "warranted assertibility" by testing ideas in practice. The commitment to periodic re-evaluation ("revisiting every four years") also reflects Deweyan fallibilism, acknowledging that conclusions are provisional and must adapt to new evidence.

  ---

  ### Disanalogies That Matter for the Use Being Made (300 words)  
  1. **Non-exchangeable Units**: Schools differ in resources, demographics, and culture. Non-random assignment risks confounding variables (e.g., wealthier schools assigned to portfolios). **Undercuts**: The claim that dashboard comparisons isolate the causal effect of the promotion method.  
  2. **Cohorts vs. Repeatable Trials**: Each cohort is unique (curriculum changes, societal shifts). Outcomes cannot be replicated or controlled. **Undercuts**: The "replication" element, implying reliable generalization.  
  3. **Outcome Measures Presuppose Ends**: The dashboard metrics (test scores, dropout rates) implicitly prioritize academic compliance and retention—values contested by advocates of holistic assessment (e.g., portfolios might aim for creativity or engagement, not captured here). **Undercuts**: The claim that the experiment avoids "prior account of what promotion is for." The dashboard *is* that account.  
  4. **Irreversible Costs**: Students bear the consequences of "failed" methods (e.g., dropout due to inappropriate promotion). They cannot be "re-run." **Undercuts**: The ethical parallel to lab experiments; Deweyan inquiry requires shared stakes, but this ignores power imbalances.  
  5. **No Neutral Standpoint**: The board (and teachers) are invested stakeholders. Interpreting "better" scores involves contested judgments (e.g., is a 5% dropout reduction worth lower test scores?). **Undercuts**: The analogy to an objective "experimenter" for whom results "simply speak." Data requires interpretation, which reopens the original dispute.  

  ---

  ### Disanalogies I Should Ignore (100 words)  
  Ignore critiques demanding laboratory-grade rigor (e.g., perfect randomization, double-blind protocols). Social policies operate in complex ecosystems; the pilot’s value lies in generating *comparative* evidence under real-world constraints. Similarly, dismiss objections that "true" Deweyan inquiry requires full participatory democracy. The pilot engages teachers and tracks student outcomes, offering more feedback than top-down mandates. The analogy’s purpose is to justify structured experimentation amid disagreement—not to replicate controlled science. Insisting on purity here misses Dewey’s pragmatic spirit: inquiry begins *where we are*, using available tools.

  ---

  ### The Strongest Reply from Inside the View (150 words)  
  Granting the Deweyan stance that "those affected are also inquirers" strengthens the pilot: teachers conducting portfolio reviews *embody* participatory inquiry, fostering professional ownership and contextual wisdom. Students and parents, through their lived outcomes (captured in dashboards), become data-generating participants. This builds a learning community that "constitutes itself" through collective experimentation, aligning with Dewey’s democratic ideal. **Cost to Epistemic Work**: This concedes the *non-neutrality* the analogy initially masked. If stakeholders are co-inquirers, the dashboard cannot adjudicate dispassionately; it feeds a dialogic process where values are debated *through* data. The analogy’s veneer of scientific objectivity dissolves, revealing the pilot as a deliberative tool—not a truth machine. This legitimizes the process socially but weakens its claim to bypass philosophical conflict.

  ---

  ### Does the Conclusion Survive? (200 words)  
  **Weak Claim (Deliberate iteration beats deadlock)**: Yes. The pilot breaks gridlock by committing to action and data collection, fostering incremental learning. Even flawed data can reveal unexpected pitfalls (e.g., systemic biases in portfolio grading) or successes, enabling course-correction.  
  **Strong Claim (Iteration replaces settling ends in advance)**: No. The dashboard’s *selection* of metrics (test scores > student well-being?) and *interpretation* of "better" presuppose contested ends. Pre-registering the dashboard pre-pilot helps superficially (e.g., ensuring consistent measurement) but cannot resolve this. It merely codifies the board’s initial biases, risking "gaming" by schools (e.g., teaching to test metrics). To license the strong claim, the district must:  
  1. **Explicitly debate and justify dashboard metrics** as proxies for shared educational aims (e.g., "We prioritize graduation over creativity").  
  2. **Frame results as inputs to deliberation**, not verdicts.  
  3. **Monitor unintended consequences** (e.g., teacher burnout in portfolio schools).  
  Without this, the pilot risks mistaking metrics for meaning.  

  ---

  ### A Better Analogy (150 words)  
  **Federalist "Laboratories of Democracy"** improves on the lab analogy. States (like schools) test policies within a shared union, adapting to local needs while contributing to national learning. It embraces heterogeneity and political negotiation, avoiding false neutrality. Success is judged through pluralistic debate (e.g., "Does this policy align with *our* community’s values?"), not a single dashboard.  
  **Common-Law Reasoning** is stronger still: each cohort is a "case" generating precedent. The board acts as a court, weighing outcomes (like case facts) against evolving standards (e.g., equity, student flourishing). The dashboard provides evidence, but "rulings" (policy shifts) balance data with principled interpretation, acknowledging that ends are refined through precedent, not predefined. Both analogies better fit Dewey’s view of social inquiry as value-laden, iterative, and constitutively democratic. They replace the lab’s illusion of closure with adaptable, context-sensitive judgment.
