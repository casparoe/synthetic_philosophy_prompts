  You are a professional philosopher specialising in pragmatism and contemporary theories of truth. Work carefully: before drafting, brainstorm for a few lines, listing candidate claims both parties could sign and discarding any that are vacuous or that merely restate one side's slogan in thicker words.

  Draft the joint statement of an adversarial collaboration between a Peircean convergence theorist, for whom truth is what inquiry would settle on at its ideal limit, and a Jamesian, for whom a true belief is one whose practical payoff is, in the long run and on the whole, better than any available alternative for anyone holding it. They have argued for years and now want one document they can both sign.

  Structure it as a numbered agreed-claims section, then a disagreements table, then a cruxes section. The parties stipulate two cases as shared fixtures of the collaboration: (1) the Two Methodical Communities — two communities of inquirers share all data and unlimited resources, are fully honest and evidence-responsive, differ only in how they rank predictive accuracy against unifying simplicity, and permanently settle on incompatible claims about the same domain, with neither community ever suffering practical failure or internal breakdown; (2) the Inert Proposition — a claim about the exact microstate of a causally sealed region that can never affect anything anyone observes or does, which the ideal limit of inquiry would nonetheless come to assert.

  For each case state the precise disagreement in wording each side accepts for its own view, and record in advance what each predicts about it. Identify at least one crux — for instance whether practical payoff could come apart from ideal convergence, or whether permanent divergence counts as a failure of method — with an argument or test both accept as bearing on it. Say plainly which parts of their dispute you take to be verbal, and why.

  Answer in British English.
