answer: |-
  Here’s a runnable activity plan prioritizing impact, clarity, and your constraints—**use the 3-player version**. I’ll explain why, then detail the setup, pitfalls, and debrief strategy.  

  ---

  ### **Why the 3-Player Version?**  
  1. **Instant Contradiction**: The 75% limit in the 2-player game requires statistical analysis (many rounds) to distinguish from 85%. With limited time and no physics background, students might dismiss a 10% gap as noise. The 3-player game **fails classically in 1 round**—creating visceral "WTF?" moments.  
  2. **No-Signalling Clarity**: Players *never* need to signal—they just answer independently. The debrief can directly contrast this with cheating methods.  
  3. **Debrief Efficiency**: The single-round failure spotlights the conflict between locality, realism, and predictions.  

  ---

  ### **The "Parity Game" Activity**  
  **Materials**:  
  - 15 envelopes (5 sets of 3, one per team)  
  - 60 question cards:  
    - 20 cards labeled "X?"  
    - 40 cards labeled "Y?"  
  - Answer sheets (1 per player)  
  - Prizes (candy/stickers) for teams beating the classical limit  

  **Prep**:  
  - Split class into 5 teams of 3 players: **Alice**, **Bob**, **Charlie**.  
  - Separate them (corners of room, facing walls, no eye contact).  
  - Give each an envelope with their question cards.  

  **Rules** (read aloud):  
  > *"Each round, a referee (you, the leader) will announce one of two scenarios:*  
  > - *Scenario 1: All three get X?*  
  > - *Scenario 2: One gets X? and two get Y? (randomly assigned).*  
  >   
  > *Players answer YES (1) or NO (0) independently.*  
  > *Your team wins the round if:*  
  > - *In Scenario 1: Alice + Bob + Charlie’s answers = EVEN (e.g., 0+0+0, 1+1+0)*  
  > - *In Scenario 2: Alice + Bob + Charlie’s answers = ODD (e.g., 1+0+0, 1+1+1)*  
  >   
  > *Agree on ANY strategy beforehand—but no communication during rounds! Win 3+ candies if you beat 3 rounds."*  

  **Gameplay** (25 mins):  
  1. **Strategy Time (5 mins)**: Teams huddle to plan (e.g., "Always say 0," "Rotate answers").  
  2. **Rounds (15 mins)**:  
     - Run 5 rounds: Alternate Scenarios randomly (e.g., 1,2,1,2,2).  
     - **Referee secretly notes** which players got X?/Y? in Scenario 2.  
  3. **Scoring (5 mins)**: Announce which teams won each round. Award candy.  

  ---

  ### **Predictable Outcomes & Pitfalls**  
  - **Classical Limit**: No team wins all 5 rounds. Best possible is 4/5 (80%)—but most hit 3/5 (60%).  
    - *Why?* Pre-agreed strategies fail Scenario 1 or Scenario 2. (e.g., "All always 0" fails Scenario 2).  
  - **Quantum Simulation (You cheat)**: Secretly help 1–2 teams:  
    - For Scenario 1 (XXX): Instruct all to answer **0**.  
    - For Scenario 2 (XYY): Tell the X-holder to answer **1**; Y-holders answer **1** or **0** to make the sum ODD.  
    Result: These teams go 5/5.  
  - **Student Pitfalls**:  
    - Collusion: Whispering ("Psst, I got X!"). **Turn this into a teachable moment**—it mirrors "locality violation" loopholes.  
    - Blaming bad luck: "We just guessed wrong!" → Debrief: Randomness can’t explain *consistent* failure.  
    - "Telepathy" claims: Redirect to "What physical mechanism could explain this?"  

  ---

  ### **Debrief Framework (35 mins)**  
  **Step 1: Name the Wall**  
  > *"Why couldn’t any team win every round? Let’s formalize your strategies."*  
  - List strategies on board (e.g., "Alice always 1"). Show why each fails one scenario.  
  - **Land the contradiction**: *"No pre-set plan works 100%—but what if I told you nature *does* win 100%?"*  

  **Step 2: Map Cheats to Loopholes**  
  | Classroom Cheat          | Real-World Loophole       | How Closed                        |  
  |--------------------------|---------------------------|-----------------------------------|  
  | Whispering answers       | Locality violation        | Labs kilometers apart             |  
  | Referee peeking at cards | Measurement dependence    | Quantum random number generators |  
  | Ignoring lost rounds     | Detection loophole        | High-efficiency detectors        |  

  **Step 3: No-Signalling Survival**  
  > *"In our game, could Alice *know* if Scenario 1 or 2 occurred by her question alone? Could she signal Bob?* → **No!** Her question and answer are identical in both scenarios. Nature’s ‘cheat’ doesn’t send signals—it correlates outcomes *non-locally*."  

  **Step 4: Why Not 100%?**  
  - Reveal the quantum win rate is ~85% (not 100%).  
  - *"Why not 100%? Because perfect correlation would imply superdeterminism or conspiracy. 85% is the sweet spot: stronger than classical physics allows, weak enough to preserve free will and relativity."*  

  ---

  ### **Why This Works**  
  - **The 85% Gap**: The 3-player game makes classical failure *inescapable*, so students feel the tension before hearing "Bell." The quantum 85% then feels like a resolution, not an arbitrary number.  
  - **Loophole Visibility**: Cheating attempts expose the experimental design challenges naturally.  
  - **No-Signalling**: Players physically can’t signal during rounds—so entanglement’s "spookiness" can’t be mistaken for messaging.  

  **What Can’t Be Staged**:  
  - **Why quantum specifically?** The activity doesn’t explain why nature *chooses* 85%. You’ll need a 1-minute aside: *"Quantum math predicts this via wavefunction angles—like how a spinning coin has 50% odds, but correlated coins have cosine(45°) = 85%."*  
  - **Probability vs. certainty**: Real quantum correlations are probabilistic; our 100% "quantum" win rate is a pedagogical simplification.  

  **Time Plan**:  
  - Setup: 10 mins  
  - Game: 25 mins  
  - Debrief: 35 mins  
  - Buffer: 10 mins (for chaos)  

  This balances visceral impact with conceptual clarity. The 3-player game’s "Eureka!" moment is worth trading statistical nuance—you can add nuance *after* they’re hooked. Bring candy!
