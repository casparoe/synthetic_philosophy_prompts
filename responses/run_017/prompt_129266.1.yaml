  The no-signalling point is crucial. During the debrief, I'll map classroom cheats to real loopholes: whispering = locality violation, selective reporting = detection loophole. To emphasize why 85% matters, I'll later explain that 100% would violate relativity. 

  For practicality: With 16 students, three-player groups mean 5 teams (15 students) plus a floater. 15 rounds take about 30 minutes with discussion. Sample size isn't an issue here since the three-player contradiction is deterministic. 

  Predictable problems: Students might think pre-agreed codes or telepathy explain the quantum case. I'll preempt this by stressing that codes can't beat 75% in the two-player version (which we'd mention in debrief). If someone spots a cheat, that's actually good - it mirrors real experimental debates. 

  The irreproducible element? The activity can't show why quantum mechanics specifically hits 85%. That requires explaining the cosine curve in the debrief. Also, the exact 100% failure in the three-player game is cleaner than actual quantum probabilities - I'll note this simplification. 

