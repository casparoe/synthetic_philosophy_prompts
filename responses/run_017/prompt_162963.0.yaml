  We are to write desiderata for a measure of the value of information in a bounded agent setting. The agent has a fixed attention budget (so opportunity costs matter) and uses a fixed update procedure (not necessarily Bayesian conditioning). Some signals are public (affecting other agents' reactions). We want to recover the standard expected-utility gain in the ideal, free, and ignorable limit. The measure should be able to go negative, and we want a unified mechanism for negatives (like the idea that information that cannot be costlessly disposed of was never free). We also want invariance under relabeling (except when the bounded update procedure depends on encoding), computability ex ante from the agent's perspective, decomposability for sequential designs, and denomination in the agent's utility (not bits, variance, or money).

  We are particularly concerned about two things: 
  1. Which subset of desiderata cannot be jointly satisfied by any single scalar? (Especially: invariance under re-description vs. sensitivity to bounded update, and ex-ante computability from agent's perspective vs. correctness in a strategic environment.)
  2. Which requirement does the most work in excluding standard proxies?

  We also need to provide a four-line scorecard for four measures: expected-utility gain, mutual information, expected variance reduction, and probability that the optimal act changes.

  Let's organize the desiderata:

  Non-negotiable:
  1. **Utility denomination**: The measure must be denominated in the agent's utility. This is non-negotiable because we are in a decision-theoretic setting and the agent cares about utility. [Non-negotiable]

  2. **Ex-ante computability**: The value must be computable by the agent before observing the signal, using its own beliefs and update procedure. This is non-negotiable because the agent must make decisions about information gathering ex ante. [Non-negotiable]

  3. **Recovery of standard case**: In the ideal case (unbounded, free, ignorable, and no strategic interactions), the measure must reduce to the expected utility gain from conditioning. [Non-negotiable]

  4. **Unified negative value mechanism**: The measure must be able to be negative, and the explanation for negative values must be unified (e.g., due to costs, including opportunity costs, public observability, or measurement perturbations). We require that the same mechanism (like the inability to costlessly dispose) covers attention opportunity costs, public observability, and measurement perturbations. If one of these requires a separate treatment, we note it. [Non-negotiable for having a unified mechanism]

  Preferences (one approach over another):
  5. **Invariance under re-description**: The measure should not depend on how the signal is labeled or encoded, except when the bounded update procedure is sensitive to the encoding. [Preference]

  6. **Decomposability across stages**: The measure should be decomposable for sequential designs, meaning that the value of a sequence of signals can be broken down step by step. [Preference]

  7. **Sensitivity to bounded update**: The measure should reflect the agent's actual update procedure (which is fixed and bounded) rather than assuming ideal conditioning. [Preference? But note: the agent is bounded, so we must account for the fixed update procedure. However, the update procedure is given, so the measure must be defined relative to it. This is non-negotiable? Actually, the requirement to use the agent's update procedure is non-negotiable because the agent does not condition ideally. So let's reclassify.]

