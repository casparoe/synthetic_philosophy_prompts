  - Expected variance reduction is denominated in variance (of the state?), which is not utility, and also it doesn't account for the decision problem (it only cares about the state, not how the state affects utility).
  - Probability that the optimal act changes doesn't account for the magnitude of utility changes and is not denominated in utility.

  Moreover, none of these (except expected-utility gain in the ideal case) account for the bounded update procedure. They assume Bayesian updating. Also, they do not account for strategic aspects.

  So the requirement of utility denomination and using the agent's update procedure rules out mutual information, variance reduction, and probability of act change as they are typically defined.

  Now, expected-utility gain (in the ideal case) is denominated in utility and accounts for the decision problem. But in our setting, we must adjust it for bounded updating and strategic interactions. So we can start from expected-utility gain and adjust.

  Therefore, the measure we are after is an adjusted expected-utility gain that accounts for:

  - The agent's update procedure (so the posterior is not by conditioning, but by the agent's fixed procedure).
  - The cost of attention: the opportunity cost of not gathering other signals? Actually, the measure should be the net change in expected utility from acquiring the signal, including any costs (opportunity costs, etc.). But note the fixed attention budget: we are comparing to not gathering this signal and gathering something else? We must be clear.

  We are to define the value of a signal. In the presence of an attention budget, the value of a signal should be the difference between the expected utility of having the signal (and updating by the fixed procedure) and the expected utility of not having it, but note that by not having this signal, the agent might use the attention to gather another. So we must define the value relative to the best alternative use of the attention.

  But the desideratum of a unified mechanism for negatives (including opportunity costs) suggests that we should account for the opportunity cost of the attention. Therefore, the value of a signal is:

  Value(S) = [Expected utility when acquiring S and updating by the agent's procedure] - [Expected utility of the best alternative use of the same attention]

  If the attention is fixed and can be spent on one signal at a time, then we compare to the best other signal the agent could have acquired. If there are multiple signals that can be acquired in combination, then we have to consider the best combination. But our setting says "buying one signal means not buying another", so we assume the agent chooses one signal at a time.

  Therefore, the value of a signal S is:

  V(S) = E[U | acquire S] - max_{S' in available signals} E[U | acquire S']

  But note: the agent might also have the option of not acquiring any signal? We assume that not acquiring any signal is also an option. So the baseline is the best alternative, which might be acquiring a different signal or doing nothing.

  However, the standard value of information in the free evidence case is defined as the difference between acquiring the signal and the status quo (without the signal). But in our setting, the status quo without the signal might be different because the agent might use the attention for something else. Therefore, we must subtract the opportunity cost.

  Thus, the measure we define is:

  V(S) = (Expected utility of acquiring S and updating by the agent's procedure) - (Expected utility of the best alternative action with the same attention)

  This automatically accounts for opportunity costs and can be negative. It also accounts for public observability and measurement perturbations because these are incorporated into the expected utility calculations (if the agent's beliefs account for them). For public signals, the agent's expected utility when acquiring S must factor in the reactions of others to the public signal.

  This measure satisfies:

  - Utility denomination: yes, it's in utility.
  - Ex-ante computability: the agent can compute the expected utility for each option using its beliefs.
  - Recovery of standard case: in the ideal, free, and ignorable case, the best alternative might be to do nothing (and the signal is free), so it reduces to the expected utility gain from conditioning minus the status quo.
  - Unified negative mechanism: negative when the opportunity cost is too high (or when the signal causes harm, e.g., by public revelation).
  - Use of agent's update procedure: we use the agent's update procedure to compute the expected utility when acquiring S.
  - Strategic awareness: for public signals, the agent's beliefs about others are used in the expected utility calculation.

  For the preferences:
  - Invariance under re-description: this holds only if the agent's update procedure and the expected utility calculations are invariant. If the update procedure is sensitive to the encoding, then the value might change with re-description. But that's acceptable because we allow for that dependence.
  - Decomposability: for sequential designs, we would need to define the value of a sequence. The above measure is for a single signal. For sequential, we might need to define the value of a sequence of signals and see if it can be broken down. This might be more complex because the best alternative to a sequence might not be the same as the best alternative at each step. So decomposability might not hold. However, we can define the value of a signal in a sequential setting as the marginal contribution given the previous signals. This is a preference, so we can live without it if necessary.

  Therefore, we propose that the value of a signal is defined as above: the difference in expected utility between acquiring that signal and the best alternative use of the same attention.

  Now, the deliverable: if we cannot have a single scalar that satisfies all? But our proposed measure is a single scalar for a given signal. However, note that the measure is defined relative to the set of available alternatives. So it is context-dependent (on the set of available signals). But that is inherent in the attention budget.

  We also note that the set of available signals might be large, and computing the max over alternatives might be hard for a bounded agent. But we are defining the measure, and the agent must make the computation as best as it can.

  Now, the requirement that does the most work excluding standard proxies: **Utility denomination** and **use of the agent's update procedure**. These together rule out the standard proxies because they are not in utility and assume ideal updating.

  Finally, the four-line scorecard:

  We evaluate four measures:

  1. Expected-utility gain (EU Gain): the expected increase in utility from having the signal and updating ideally (Bayesian) over not having it, ignoring costs and strategic effects.

  2. Mutual information (MI): the mutual information between the signal and the state.

  3. Expected variance reduction (EVR): the expected reduction in variance of the state (or some parameter) after seeing the signal.

  4. Probability of act change (PAC): the probability that the optimal act changes upon seeing the signal.

  Scorecard (each line for one measure):

  - **EU Gain**: 
    * Pros: In utility, accounts for decision problem. 
    * Cons: Assumes ideal updating, ignores costs, strategic effects, and boundedness. Fails on using the agent's update procedure and strategic awareness.

  - **Mutual Information**:
    * Pros: Invariant to re-description, additive for independent signals.
    * Cons: Not in utility, doesn't account for decision problem or update procedure. Fails utility denomination and use of agent's update procedure.

  - **Expected Variance Reduction**:
    * Pros: Might correlate with utility in some settings.
    * Cons: Not in utility, doesn't account for decision problem (only state uncertainty), and doesn't account for update procedure. Fails utility denomination and use of agent's update procedure.

  - **Probability of Act Change**:
    * Pros: Related to the decision problem.
    * Cons: Not in utility (it's a probability), ignores magnitude of utility changes, and assumes ideal updating. Fails utility denomination and magnitude sensitivity.

  In summary, we propose a measure that is the difference in expected utility between acquiring the signal and the best alternative use of the attention. This measure satisfies the non-negotiable requirements and partially the preferences (with decomposability being a challenge for sequential settings). The requirement of utility denomination and using the agent's update procedure are the most excluding of standard proxies.
answer: |-
  Below are the desiderata for a measure of the value of information (VoI) in your setting, organized by **non-negotiable requirements** (essential for coherence) and **preferences** (reflecting trade-offs between approaches). I split, reorganized, and added to your stated pressures for clarity and completeness. The desiderata address bounded rationality (fixed attention budget, non-ideal updating), public signals (strategic interdependence), and the need for a utility-based measure that generalizes Good's theorem.

  ---

  ### **Non-Negotiable Requirements**  
  *Essential for the measure’s validity in your setting.*

  1. **Utility denomination**  
     - **Requirement**: VoI must be denominated in the agent’s *utility*, not bits, variance, money, or other proxies.  
     - **Case**: Bounded agents optimize utility under constraints; proxies like mutual information ignore decision structure and risk preferences.  
     - **Why non-negotiable**: Without utility grounding, VoI cannot guide rational choices for a utility-maximizer.  

  2. **Ex-ante computability from agent’s perspective**  
     - **Requirement**: VoI must be computable *before* observing the signal, using the agent’s beliefs, update procedure, and model of the environment (including others’ reactions).  
     - **Case**: Agents allocate attention budget sequentially; VoI must inform *which* signal to acquire now.  
     - **Why non-negotiable**: Post-hoc measures are useless for decision-making under boundedness.  

  3. **Adherence to bounded update procedure**  
     - **Requirement**: VoI must use the agent’s *fixed* non-ideal update rule (e.g., heuristic, approximation) to compute posteriors, not assume Bayesian conditioning.  
     - **Case**: Bounded agents cannot perform ideal updates; Good’s theorem assumes unbounded conditioning.  
     - **Why non-negotiable**: Ideal updating misrepresents the agent’s actual inferences and actions.  

  4. **Unified mechanism for negative VoI**  
     - **Requirement**: VoI must be *negative* when costs outweigh benefits, with a single explanatory mechanism covering:  
       - Attention opportunity costs (forgone alternatives from fixed budget),  
       - Public observability (signals affecting others’ strategic responses),  
       - Measurement perturbations (signals altering the state).  
     - **Case**: All three reduce utility by introducing costs or externalities; treating them as distinct “exceptions” undermines generality.  
     - **Why non-negotiable**: A unified mechanism (e.g., *inability to costlessly dispose of information*) ensures VoI is coherent under boundedness and strategicity.  

  5. **Recovery of Good’s theorem in ideal limit**  
     - **Requirement**: VoI must reduce to Good’s expected-utility gain when:  
       - Updates are Bayesian,  
       - Signals are free (no attention costs),  
       - Signals are ignorable (no public/strategic effects).  
     - **Case**: Generalizes textbook results while highlighting departures (boundedness, publicity).  
     - **Why non-negotiable**: Without this, VoI cannot explain why agents should ever seek free evidence.  

  ---

  ### **Preferences**  
  *Desirable but negotiable based on formalism choices.*

  6. **Invariance under re-description (unless update-procedure-dependent)**  
     - **Preference**: VoI should be invariant to signal relabeling/encoding *unless* the agent’s update procedure is sensitive to it (e.g., cognitive limits make some encodings harder to process).  
     - **Case**: Encodings irrelevant to content (e.g., units, language) should not affect VoI, but dependence is valid if boundedness causes encoding-specific costs.  
     - **Approach trade-off**: Favors information-theoretic parsimony but allows procedural exceptions.  

  7. **Sequential decomposability**  
     - **Preference**: VoI should decompose additively across stages of a sequential design (e.g., VoI of signal sequence ≈ sum of VoIs conditional on prior signals).  
     - **Case**: Attention budgets often require iterative allocation; decomposability simplifies dynamic programming.  
     - **Approach trade-off**: Violations may occur with strategic interactions or update-procedure path-dependence.  

  ---

  ### **Key Tensions and Deliverable**  
  **Subset impossible for any single scalar**:  
  - **Invariance under re-description vs. sensitivity to bounded update procedure**: These conflict because invariance assumes VoI depends only on information content, while bounded updates may depend on encoding. *No single scalar can satisfy both universally*—e.g., if a heuristic update rule is encoding-sensitive, VoI *must* reflect that.  
  - **Ex-ante computability vs. strategic correctness**: Ex-ante computability relies on the agent’s *beliefs* about others’ reactions to public signals, but these beliefs may be incorrect (e.g., due to bounded rationality in game-theoretic settings). A scalar VoI can be computed ex-ante, but it may not match “true” VoI if beliefs are miscalibrated.  

  **If unsatisfiable as one number**: Use a **family of measures indexed by the agent’s update procedure and belief model**, as these define the bounded and strategic context. For example:  
  - VoI(𝒮 | 𝒰, ℬ), where 𝒰 is the update rule, ℬ is the belief model (including others’ strategies).  

  **Most exclusionary requirement**: **Utility denomination** does the most work ruling out standard proxies:  
  - It excludes **mutual information** (bits, not utility), **variance reduction** (ignores utility curvature and actions), and **probability of act change** (loses magnitude of utility gains/losses).  
  - It mandates that VoI reflect decision-consequences, not just statistical properties.  

  ---

  ### **Scorecard for Existing Measures**  
  | **Measure**               | **Utility Denomination?** | **Bounded-Update Compatible?** | **Handles Negatives Unifedly?** | **Ex-Ante Computable?** |  
  |----------------------------|---------------------------|--------------------------------|----------------------------------|--------------------------|  
  | **Expected-utility gain**  | Yes (ideal case)          | No (assumes conditioning)      | No (ignores costs/strategies)    | Yes                      |  
  | **Mutual information**     | No (bits)                 | No (content-only)              | No (always non-negative)         | Yes                      |  
  | **Variance reduction**     | No (statistical)          | No (content-only)              | No (always non-negative)         | Partially                |  
  | **Prob. act change**       | No (unitless prob.)       | No (assumes conditioning)      | No (ignores costs/magnitudes)    | Yes                      |  

  *Notes*:  
  - **EU gain** fails boundedness and negatives; **mutual information** and **variance reduction** fail utility grounding; **prob. act change** loses utility magnitudes and update flexibility.  
  - All measures lack a unified mechanism for negatives (e.g., attention costs) and strategic awareness. Your proposed VoI must extend EU gain to bounded/public settings.
