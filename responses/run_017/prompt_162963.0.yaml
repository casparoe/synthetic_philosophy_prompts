  Therefore, the main challenge is the first tension: invariance under re-description vs. using the agent's update procedure. They are not jointly satisfiable for arbitrary update procedures because the update procedure might break invariance. Therefore, we cannot have a single scalar that is invariant under re-description for all update procedures. We must condition the invariance on the update procedure being invariant. Hence, for a given update procedure (which is fixed for the agent), the measure might not be invariant if the update procedure is sensitive. So we require invariance only when the update procedure is invariant to re-description.

  Therefore, the measure should be defined relative to the agent's update procedure and the agent's beliefs (including about others). It will be a scalar for the agent in its decision problem, but it may not be invariant under re-description if the update procedure is not.

  Now, which requirement does the most work in excluding standard proxies?

  The requirement that the measure must be denominated in utility and must use the agent's update procedure (non-ideal) does the most work in excluding standard proxies. For instance:

