  - **Use of the agent's update procedure**: The measure must be defined using the agent's fixed update procedure for forming posteriors, not by assuming Bayesian conditioning. [Non-negotiable]

  Now, let's list the non-negotiables together:

  Non-negotiable:
  1. Utility denomination.
  2. Ex-ante computability (from the agent's perspective).
  3. Recovery of the standard case in the ideal limit.
  4. Unified mechanism for negative values (covering at least attention opportunity costs, public observability, and measurement perturbations without needing separate treatments).
  5. Use of the agent's update procedure (so the measure is defined by the agent's actual bounded updating, not ideal).

  Preferences:
  6. Invariance under re-description (unless the update procedure is sensitive to encoding).
  7. Decomposability for sequential designs.

  Now, the tensions:

  First tension: **Invariance under re-description vs. Sensitivity to bounded update procedure**. 
  - If the update procedure is sensitive to the encoding of the signal (e.g., if the agent's update depends on how the signal is represented), then we cannot require invariance under re-description. This is a potential conflict. We cannot have both full invariance and sensitivity to the update procedure because the update procedure might break the invariance. Therefore, we must relax invariance: we require invariance only when the update procedure is invariant to the re-description. So these are compatible only when the update procedure is invariant. Otherwise, the measure must reflect the update procedure's encoding dependence.

  Second tension: **Ex-ante computability from the agent's perspective vs. Correctness in a strategic environment**.
  - In a strategic environment, the value of a public signal depends on how other agents will react. The agent must form beliefs about others' reactions. But these reactions may depend on the signal and the agent's response to the signal. The agent's ex-ante computation may be incorrect if it has a misspecified model of the strategic environment. However, we require ex-ante computability from the agent's own perspective (using its own beliefs). This is acceptable because the agent must act on its own beliefs. But note: the measure must account for the public nature of the signal (if it is public) and the agent's beliefs about others. So we require that the measure is computable ex ante using the agent's beliefs, including beliefs about others. This is compatible. However, if we required that the measure be "correct" (i.e., equal to the true expected utility change in the real world, which might involve others' true strategies), then ex-ante computability by the agent might not be possible because the agent may not know others' true strategies. But our desideratum is from the agent's perspective, so we are not requiring correctness in the real world, only in the agent's model. Therefore, they are compatible.

  But note: the agent's ex-ante computation must account for the fact that the signal is public and will be observed by others. The agent must have a model of how others will react to the signal. So the measure must incorporate the agent's beliefs about the strategic environment. This is a requirement of the measure: it must be defined in a way that includes the agent's beliefs about others. Therefore, we add:

  8. **Strategic awareness**: If a signal is public, the measure must account for the agent's beliefs about how other agents will react to the signal. [Non-negotiable, because public observability matters and is one of the features of the setting.]

