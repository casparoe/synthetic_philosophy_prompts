  ### Marking Scheme  
  **Total: 20 marks**  

  **(a) [4 marks]**  
  - Correct \(P_{\text{old}}(H \mid E) = 0.8\) (1 mark).  
  - Correct \(P_{\text{old}}(H \mid \neg E) = 0.2\) (1 mark).  
  - Correct weighted average formula (1 mark).  
  - Correct result \(P_{\text{new}}(H) = 0.74\) (1 mark).  
    *Costly mistake: Arithmetic error in Bayes’ theorem or final calculation.*  

  **(b) [8 marks]**  
  - **Scenario 1 rigidity justified** (2 marks): Sensory evidence affects only \(P(E)\).  
  - **Scenario 2 rigidity not justified** (2 marks): \(C\) provides extra information altering conditionals.  
  - **Scenario 1 result appropriate** (1 mark): Rule matches evidence structure.  
  - **Scenario 2 result inappropriate** (1 mark): Rigidity failure makes \(0.74\) unreliable.  
  - **Agent certainty described for each** (2 marks): Sensory state (S1) vs. \(C\) (S2).  
    *First-class insight: Distinguishes "evidence about \(E\)" (S1) from "evidence causing shift via \(C\)" (S2).*  
    *Costly mistake: Claiming rigidity holds in S2 or that \(0.74\) is always defective.*  

  **(c) [5 marks]**  
  - **Correct computation outline** (2 marks): Formula using \(P_{\text{old}}(H \mid E, C)\), \(P_{\text{new}}(E \mid C)\).  
  - **No reduction to conditioning** (1 mark): Contrast with \(P_{\text{old}}(H \mid C) = 0.75\).  
  - **Genuine generalization** (2 marks): Reduces to Jeffrey if \(C\) trivial, to conditioning if \(P_{\text{new}}(E)=1\).  
    *First-class insight: Notes prior conditionals \(P_{\text{old}}(H \mid E, C)\) may be unavailable or undefined.*  
    *Costly mistake: Asserting the repair equals conditioning on \(C\).*  

  **(d) [3 marks]**  
  - **Min-entropy does not help** (3 marks): Only uses marginals, ignores cause, assumes rigidity.  
    *First-class insight: Highlights that constraints do not encode source information.*  
    *Costly mistake: Claiming min-entropy "infers" the cause.*
