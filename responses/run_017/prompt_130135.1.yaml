answer: |-
  Here is a disambiguation of "guilt can't be inherited," structured as requested. The readings progress from most trivial/narrow (widely accepted) to most radical/contested. Each is analyzed against your criteria, principles, and stress cases.

  ### Key to Analysis
  *   **Guilt Type:** Criminal (Cr), Moral (Mo), Political (Po), Metaphysical (Me)
  *   **Inheritance Mechanism:** Bio-descent (BD), Collective Membership (CM), Holding Proceeds (HP), Institutional Succession (IS), Bearer of Claim (BC)
  *   **Whose Guilt:** Individual (I), State (S), Nation (N)
  *   **Your Principles:** Clean-Hands-by-Descent (CHD), Undischarged-Debt (UDD), Tainted-Asset (TA)
  *   **Guest's Conclusions Supported:** (1) No individual liability now; (2) State shouldn't apologize; (3) No guilt should be felt/expressed.
  *   **Stress Cases Performance:** ✓ (Survives), ~ (Partially/Problematic), ✗ (Fails).
  *   **Bridges Gap:** Low (Little), Med (Some), High (Most/All) – from "no one alive did it" to "nothing owed".

  ---

  ### The Menu

  1.  **Individual Criminal Guilt via Biological Descent:**  
      *   *Thesis:* A living person (I) cannot be held criminally liable (Cr) for a specific crime committed by an ancestor solely due to biological descent (BD). They did not commit the *actus reus* with *mens rea*.  
      *   **Status:** Near-conceptual truth (Cr guilt requires personal commission).  
      *   **Jobs:** Supports (1) partially (only on Cr liability). Does *not* support (2) or (3). Irrelevant to S/N guilt.  
      *   **Gap Bridge:** Low (Only addresses criminal punishment).  
      *   **Your Principle:** Pure CHD (trivial version).  
      *   **Stress Cases:** (i) ✓, (ii) ✓, (iii) ✓, (iv) ✓ (Applies symmetrically - descendants can't inherit *victim* status for *Cr* law either), (v) ✓.

  2.  **Individual Moral Culpability via Biological Descent:**  
      *   *Thesis:* A living person (I) is not morally blameworthy (Mo) for the wrongful acts of an ancestor simply due to biological descent (BD). Moral blame requires personal agency/culpability.  
      *   **Status:** Defensible claim (core of personal morality), though cultural/religious views may differ.  
      *   **Jobs:** Supports (1) (on *personal moral blame*). Weakly supports (3) (re: *feeling* personal moral guilt). Does *not* support (2).  
      *   **Gap Bridge:** Low-Med (Addresses personal moral blame, not obligations).  
      *   **Your Principle:** CHD (stronger version).  
      *   **Stress Cases:** (i) ✓, (ii) ✓, (iii) ✓, (iv) ✓ (Symmetry: Descendants not morally *culpable* for victimhood), (v) ✓.

  3.  **State Criminal Guilt via Institutional Succession:**  
      *   *Thesis:* A successor state (S) cannot inherit *criminal* guilt (Cr) for acts committed by a predecessor state under a different regime (e.g., monarchy to republic), even with legal continuity (IS), as states aren't moral agents capable of criminal *mens rea* in the same way.  
      *   **Status:** Defensible claim (states as abstract entities). Contested regarding state "crimes" (e.g., aggression).  
      *   **Jobs:** Weakly supports (2) (if apology implies criminal guilt). Irrelevant to (1) & (3).  
      *   **Gap Bridge:** Low (Niche application).  
      *   **Your Principle:** Not directly mapped (focuses on state capacity).  
      *   **Stress Cases:** (i) ✓, (ii) ✓, (iii) ✗ (Disclaims responsibility but keeps benefits - UDD/TA relevant), (iv) ~ (State's capacity for victimhood also contested), (v) ~ (Apology not necessarily Cr admission).

  4.  **Metaphysical or Existential Guilt via Biological Descent:**  
      *   *Thesis:* There is no inherent, cosmic, or identity-based guilt (Me) staining individuals (I) born into a group (N) that historically committed wrongs, transmitted merely by blood (BD). Identity ≠ moral stain.  
      *   **Status:** Defensible claim (rejects inherent racial/national stain). Contested by some communitarian/solidarity views.  
      *   **Jobs:** Strongly supports (3) (against feeling/expressing identity-based guilt/shame). Weakly supports (1) (rejects guilt as *basis* for liability). Does *not* support (2).  
      *   **Gap Bridge:** Med (Addresses a *basis* for feeling liable, not liability itself).  
      *   **Your Principle:** CHD (philosophical extension).  
      *   **Stress Cases:** (i) ✓, (ii) ✓, (iii) ✓, (iv) ✓ (Symmetry: No inherent stain of victimhood either), (v) ✓.

  5.  **Individual Liability to Repair via Biological Descent Alone:**  
      *   *Thesis:* A living person (I) cannot be held *liable to pay reparations* (Po/Mo) solely because they are biologically descended (BD) from a wrongdoer, absent any benefit received or current role.  
      *   **Status:** Defensible claim (rejects purely ancestral liability). Cornerstone of liberal individualism.  
      *   **Jobs:** Strongly supports (1) (core target). Weakly supports (3) (if guilt feeling implies liability). Does *not* support (2).  
      *   **Gap Bridge:** Med-High (Directly addresses individual liability, but not other sources).  
      *   **Your Principle:** CHD (applied to liability/reparations). Guest *must* deny UDD/TA to get conclusions.  
      *   **Stress Cases:** (i) ✓, (ii) ~ (HP/TA bypasses descent!), (iii) ~ (IS/UDD bypasses descent!), (iv) ✗ (Asymmetry: Claims *can* persist via descent/group membership - undermines premise), (v) ✓.

  6.  **State Political Liability via Institutional Succession:**  
      *   *Thesis:* A successor state (S) with continuous legal personality (IS) does *not* inherit the *political liability* (Po) of its predecessor to repair historical wrongs simply by existing as the successor institution. Continuity ≠ responsibility assumption.  
      *   **Status:** Live and contested (core debate in state succession to obligations). Defended by some legal positivists.  
      *   **Jobs:** Strongly supports (2) (if apology = acknowledgment of liability). Supports (1) indirectly (denies state's duty, hence citizen burden). Weak on (3).  
      *   **Gap Bridge:** High (Directly targets state obligation).  
      *   **Your Principle:** Rejects UDD (applied to the state). Guest *must* deny UDD to get (2).  
      *   **Stress Cases:** (i) ✓, (ii) ✓, (iii) ✗ (Dissolved predecessor strengthens UDD/TA?), (iv) ✗ (If liability can't transmit, why can claims? Asymmetry problem), (v) ~ (Citizen objection irrelevant if state *is* liable).

  7.  **Collective Moral Liability via National Membership:**  
      *   *Thesis:* Present members (I) of a nation (N) conceived as a transgenerational community (CM) do not bear *collective moral liability* (Mo/Po) for the wrongful acts of past members simply by virtue of membership. Moral liability requires voluntary association/participation.  
      *   **Status:** Live and hotly contested (liberalism vs. communitarianism/civic republicanism).  
      *   **Jobs:** Supports (1) (rejects collective basis for individual burden). Supports (3) (rejects collective guilt feeling). Weak on (2).  
      *   **Gap Bridge:** High (Denies a major potential source of obligation).  
      *   **Your Principle:** CHD (applied to collective liability). Guest *must* deny UDD/TA to get full conclusions.  
      *   **Stress Cases:** (i) ✗ (Latecomers are members!), (ii) ~ (HP/TA bypasses membership!), (iii) ✗ (Succession/UDD bypasses membership?), (iv) ✗ (Asymmetry: Can victims' *descendants* form a collective with claims?), (v) ✓.

  8.  **Benefit-Based Liability is "Inherited Guilt":**  
      *   *Thesis:* Holding that a person (I) has obligations arising solely from passively holding benefits (HP) traceable to a past wrong (even unknowingly/in good faith) constitutes an unjust form of "inheriting guilt" (Mo/Po), as it imposes liability without personal fault.  
      *   *Status:* Substantive but highly contested claim (equates benefit-based liability with guilt-by-association). Defended by critics of TA.  
      *   **Jobs:** **Crucially:** If true, directly supports (1) against TA, indirectly supports (2) & (3) by undercutting a major rationale for state action/guilt feeling. Guest *must* deny TA to get all conclusions.  
      *   **Gap Bridge:** High (Directly targets TA as a basis for obligation).  
      *   **Your Principle:** Explicit rejection of TA (framed as "inherited guilt").  
      *   **Stress Cases:** (i) ✓ (If no benefit), (ii) ✗ (Core case of TA - slogan fails here), (iii) ✗ (Successor state holds proceeds - UDD/TA), (iv) ~ (Moot if no liability, but claims exist), (v) ✓.

  ---

  **Likely Meaning & Strength for Guest's Use:**
  *   **Most Likely Meaning in Panel Context:** **#5 (Individual Liability via Descent Alone)** or **#8 (Benefit-Based Liability as "Guilt")**. #5 is a common liberal talking point. #8 directly attacks TA, which is key to the case (land holding).
  *   **Strength for Guest's Conclusions:** **Weak.** #5 is defensible but *only* negates liability based *purely* on descent. It doesn't touch state liability (UDD), institutional continuity, or benefit-based obligations (TA) – which are central to the case. #8 is the strongest *for the guest* (if accepted), but it's highly contested and fails the Good-Faith Purchaser (ii) and Dissolved Predecessor (iii) stress tests. Neither #5 nor #8 can fully support conclusion (2) (State apology) on their own; that requires denying UDD (#6). **The slogan, even on its strongest reading (#8), cannot fully bridge the gap to "nothing is owed"** because it fails to negate UDD (state obligation) and TA (obligations of beneficiaries/holders), especially under stress.

  **Key Asymmetry (Mirror Case iv):** Most readings asserting guilt/liability can't be inherited biologically (#1, #2, #4, #5, #7) struggle to explain why *claims* (based on victimhood, harm, or defective title) *can* persist across generations through descent, group membership, or inheritance law. This asymmetry weakens claims that "nothing is owed" based solely on non-inheritance of guilt. UDD and TA focus on the *obligation/debt* or *asset* persisting, not the inheritance of guilt or victim status per se.
