  Set:  
    Let a = P(Lamp|H), b = P(Lamp|L)  
    P(Lamp) = a*0.7 + b*0.3 = 0.7  (1)  
    P(Red | Lamp) = [P(Red|H) * P(H|Lamp)] + [P(Red|L) * P(L|Lamp)]  
                  = [0.95 * (a*0.7)/0.7] + [0.45 * (b*0.3)/0.7]   [because P(H|Lamp)= a*0.7/0.7? Wait, P(H|Lamp)= a*0.7 / P(Lamp)= a*0.7/0.7 = a]  
    Actually, P(H|Lamp) = a*0.7 / 0.7 = a? No:  
      P(H|Lamp) = P(Lamp|H) P(H) / P(Lamp) = a * 0.7 / 0.7 = a? But then P(L|Lamp)= b*0.3/0.7?  

  Wait, P(Lamp)=0.7, so:  
    P(H|Lamp) = (a * 0.7) / 0.7 = a  
    P(L|Lamp) = (b * 0.3) / 0.7  

  Then:  
    P(Red|Lamp) = 0.95 * a + 0.45 * (b*0.3/0.7) = 0.90  (2)  

  And from (1): a*0.7 + b*0.3 = 0.7  => 0.7a + 0.3b = 0.7  (1)  

  From (1): 0.7a + 0.3b = 0.7  => divide by 0.7: a + (0.3/0.7)b = 1 => a + (3/7)b = 1  (1a)  

  From (2): 0.95a + 0.45*(0.3/0.7)b = 0.90  
            0.95a + 0.45*(3/7)b = 0.90  
            0.95a + (1.35/7)b = 0.90  
            0.95a + 0.192857b = 0.90  (2a)  

