    From (1a): a = 1 - (3/7)b  
    Plug into (2a):  
        0.95(1 - 3b/7) + 0.192857b = 0.90  
        0.95 - (2.85/7)b + 0.192857b = 0.90  
        0.95 - 0.407142857b + 0.192857b = 0.90  
        0.95 - 0.2142857b = 0.90  
        -0.2142857b = -0.05  
        b = 0.05 / 0.2142857 ≈ 0.2333  

  Then a = 1 - (3/7)*0.2333 = 1 - 0.7*0.2333 ≈ 1 - 0.16331 = 0.83669  

  This is messy.  

  We can instead approximate: use P(Lamp|H)=0.9, P(Lamp|L)=0.2, and then P(Lamp)=0.69, and P(Red|Lamp)≈0.906, which is close to 0.90. We can adjust the conditional probabilities slightly to make it exact, but for the activity, we can say the frequencies are as in the table and the underlying mechanism is as described (with the wheel and the lamp as an indicator of the wheel outcome).  

  In the debrief, we say:  
    "The box has a wheel that determines the setting: Hi (70% chance) with P(red|Hi)=0.95, Lo (30% chance) with P(red|Lo)=0.45. The lamp is an indicator of the wheel outcome: if Hi, it flashes with 90% chance; if Lo, with 20% chance. Then the overall chance of red is 0.7*0.95+0.3*0.45=0.665+0.135=0.80. And the conditional chance given the lamp is as in the table (approximately)."  

  But our table had 0.90 and 0.55? We used 0.90 and 0.5667. So let's stick to the table we provided:  
    Lamp flashes 70% of the time, and then red 90% of the time.  
    Lamp doesn't flash 30% of the time, and then red 57% of the time.  

  In the mechanism, we can say the wheel has two sectors:  
    Hi: probability p, chance of red q  
    Lo: probability 1-p, chance of red r  
  And the lamp is an indicator: we don't need to specify the exact mechanism, just that the lamp provides information about the current chance.  

  In the debrief:  
    "The key point is that when the lamp flashes, the chance of red is 90%; when it doesn't, it's 57%. The printed number 80% is the chance before the lamp flashes. But once the lamp flashes, the chance has changed. The norm is to defer to the current chance, not the past chance."

  **Debrief Script:**  
  - "In stage 1, you saw a known chance. Many of you felt that for a single trial, you might have a hunch. But the scoring rule penalized deviations: the more you deviated from 0.8, the more you lost when you were wrong. And even if you got lucky once, in the long run you'd do better at 0.8."  
  - "In stage 2, you didn't know the chance, but you had a signal. The best move was to compute the expected chance given the signal. For example, if you saw 'HIGH', what's the chance of red? You had to average over the possible settings."  
  - "In stage 3, you had a printed chance of 80%, but then you saw the lamp. The frequency table showed that the lamp is informative: it changes the chance. So the current chance is not 80% anymore; it's 90% if the lamp flashes, 57% if not. The norm is to defer to the current objective chance, which now includes the information from the lamp."  
  - "This is the Principal Principle: your credence should match the objective chance, conditional on your total evidence. But note: the chance itself can change over time as new information arrives. And the information from the lamp is 'inadmissible' for the chance at the earlier time (when the box was set) because it is relevant to the outcome beyond what the chance at that time predicted."  
  - "Now, the person who just did Bayes on the frequencies: if they condition on the lamp, they get the same number as the one who defers to the conditional chance. Why? Because the conditional chance is defined by the frequencies in the reference class of lamp-flashing. But note: in this case, the frequencies are a good guide to the chance. However, there are cases where they might come apart: if the chance process is not stable, or if the frequencies are from a different population. But in standard cases, they align."  

  **Wrong Answers and Pitfalls:**  
  - Stage 1: "I put 0.99 because I had a feeling." -> Show that it cost them dearly when it was white.  
  - Stage 1: "I put 0.8 every time and did well." -> That's the point.  
  - Stage 2: "I ignored the signal and just put the prior expected chance (0.8*0.5+0.9*0.3+0.5*0.2=0.4+0.27+0.1=0.77)." -> But the signal gives more information, so you can do better.  
  - Stage 3: "I ignored the lamp and put 0.8." -> Show that they would have done worse than those who used the lamp.  
  - Stage 3: "I used the lamp but forgot the overall 80%?" -> The overall 80% is not relevant once you see the lamp.  

  **Predictable Problems:**  
  - Someone gets lucky with overconfidence: In stage 1, they might put 1.0 and get red. We can say: "You got lucky this time, but in the long run that strategy would lose."  
  - Imprecise credences: Allow them to write ranges? But we need a number for scoring. Encourage them to pick the number that best reflects their confidence.  
  - Stage 3 looking like stage 1's hunches: But here the lamp has a published track record. Emphasize that the lamp's informativeness is backed by 300 trials.  
  - Another problem: Participants might not know how to compute the conditional chance in stage 2 or 3. We can provide a calculator? But we want them to think. Alternatively, we can let them discuss in pairs? But the session is only 90 minutes. We might have to accept that some will guess.  

  **What the Activity Can't Do:**  
  - It doesn't justify why we should defer to chances in a single case. The scoring rule is long-run. We can say: "The norm is often motivated by long-run calibration, but it's intended for single cases. We'll discuss that briefly."  
  - We are assuming there are objective chances.  
  - The framing "write the number you'd want if this were the only trial ever" is hard to enforce because the scoring rule aggregates. We can say: "Even for one trial, you want your credence to be as close as possible to the truth. The quadratic loss penalizes being wrong by the square of the error."  

  **Optional Adversary Round:**  
  - A round where the setting is chosen by an adversary who sees your card first: that would be a different issue (game-theoretic, not about deference to chance). It's a separate problem, so we skip it.  

  **Final Note:**  
  We have to be tight on time. Stage 3 might take longer because they have to process the table and the lamp signal. We can reduce the number of trials per stage to 5 if needed, but 10 gives more data.  

  Let's go with the plan.
