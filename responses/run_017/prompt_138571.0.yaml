  ### Overall Arc Sketch (10 bullets)

  1. **Stage 1: The Basic Deference**  
     - Participants see a box labeled "RED 80%". They write their credence (a number between 0 and 1) for the next draw being red on an index card.  
     - We run 10 trials, with outcomes pre-generated (80% red). We score each trial using the Brier scoring rule (squared error loss).  
     - Point: They experience the cost of deviating from 0.8 (e.g., someone who writes 0.99 and gets a white ball loses a lot).  

  2. **Stage 2: Uncertainty About the Chance**  
     - The box now has a hidden setting: it could be set to 50%, 80%, or 90% (each with known probability). Participants get a noisy signal about the setting (e.g., they see a card that is 70% accurate).  
     - They write their credence for red. We run 10 trials.  
     - Point: They learn to take an expectation over the possible chances. The printed number (if any) isn't directly available.  

  3. **Stage 3: The Evolving Chance**  
     - The box is back to having a printed "RED 80%", but now there's a lamp that may flash. Participants see a frequency table from 300 past runs showing:  
       - When lamp flashed: red 90% of the time.  
       - When lamp didn't flash: red 55% of the time.  
       - Overall: red 80% of the time.  
     - They write their credence for red, knowing that the lamp will flash or not (but they don't see it until after they commit). We run 10 trials.  
     - Point: The lamp provides information that changes the current chance. Deferring to the printed 80% is wrong; they must condition on the lamp.  

  4. **Debrief (Last 15 minutes):**  
     - Reveal the mechanism of stage 3 (the wheel and the lamp as a leaky indicator).  
     - Introduce the Principal Principle and the role of admissible evidence.  
