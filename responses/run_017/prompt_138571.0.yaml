  ### Session Plan: Deference to Objective Chance

  **Materials List:**
  1. Projector for displaying instructions and pre-committed outcome lists.
  2. Handouts for Stage 3 (frequency table).
  3. Index cards and pens (14 sets).
  4. Pre-generated outcome lists (sealed envelopes for each stage).
  5. Whiteboard for scoring (Brier score: \(1 - (outcome - p)^2\)).
  6. "RED 80%" box label (visible in Stages 1 and 3).
  7. Opaque bag/box for Stage 2 (hide settings).

  ---

  ### Timeline (90 min)

  **0–5 min: Introduction**  
  - **Script:** "Today, we’ll play a prediction game. You’ll forecast if a red ball appears in a box. Write your confidence as a number between 0 (certain white) and 1 (certain red). Scoring: If red occurs, you gain \(1 - (1 - p)^2\). If white, \(1 - p^2\). Higher = better. We’ll do 3 stages. I’ve pre-committed to all outcomes—no fudging."

  **5–25 min: Stage 1 – The Pull of Hunches**  
  - **Activity:**  
    - Display "RED 80%" box. Unseal pre-generated outcomes (e.g., 8 red, 2 white in 10 trials).  
    - Each trial: Participants write credence \(p\) on card. Reveal outcome. Record scores.  
  - **Purpose:** Experience cost of overconfidence (e.g., reporting 0.999 when white occurs: score ≈ 0).  
  - **Pre-commit:** Show sealed envelope at start; open to reveal outcome list.  
  - **Scoring:** Use Brier (quadratic). Robust against extreme bets (e.g., 0.999 wrong → near-zero score).  

  **25–45 min: Stage 2 – Uncertain Chance (Expectation Over Chances)**  
  - **Activity:**  
    - Hide box label. Settings: 50%, 80%, or 90% chance of red (probabilities 0.2, 0.5, 0.3).  
    - Each trial: Draw setting (pre-generated), give noisy signal (e.g., "HIGH" or "LOW" with 70% accuracy). Participants write \(p\). Reveal outcome.  
  - **Purpose:** Learn to average chances (e.g., if signal "HIGH," \(p = \mathbb{E}[\text{chance}] \approx 0.85\)).  
  - **Pre-commit:** Unseal list of settings/signals/outcomes.  

  **45–75 min: Stage 3 – The Sting (Evolving Chance)**  
  - **Activity:**  
    - Restore "RED 80%" label. Distribute handout with frequency table:  
      ```  
      300 PAST RUNS:  
      - Lamp flashed: 210 times  
        → Red: 189 (90%)  
      - Lamp not flashed: 90 times  
        → Red: 51 (57%)  
      - Overall: Red 240/300 (80%)  
      ```  
    - Each trial: Reveal lamp (on/off; pre-generated). Participants write \(p\). Reveal outcome.  
  - **Mechanism (revealed in debrief):**  
    - Wheel: 70% Hi (P(red)=0.95), 30% Lo (P(red)=0.45). Marginal P(red) = 0.7×0.95 + 0.3×0.45 = 0.80.  
    - Lamp: P(flash|Hi) = 0.9, P(flash|Lo) = 0.2 → Conditional chances: P(red|lamp) ≈ 0.90, P(red|no lamp) ≈ 0.57.  
  - **Purpose:** Lamp updates chance (0.90 or 0.57 ≠ 0.80). Printed number is outdated.  

  **75–90 min: Debrief**  
  - **Script:**  
    1. "Stage 1: Why did 0.8 win? *The constraint binds on single cases.* Hunches cost you.  
    2. Stage 2: Why average chances? *Credence = expected chance* when chance is unknown.  
    3. Stage 3: Why defer to lamp? *Chances evolve.* The 0.80 was pre-lamp; lamp gives current chance."  
  - **Name the principle:** "This is Lewis’ **Principal Principle**: Credence should match *conditional* objective chance. 'Admissible evidence' means info that doesn’t trump chance (e.g., lamp is inadmissible for pre-lamp chance)."  
  - **Wrong answers:**  
    - "I ignored the lamp (Stage 3) – I trusted the box!" → *Costly: Deferring to past chance ignores new evidence.*  
    - "I averaged everything (Stage 3)" → *Wrong: Lamp specifies the exact chance (0.90/0.57), not an average.*  
    - "My hunch was right once!" → *Luck ≠ rationality. Scoring penalizes deviation long-term.*  
  - **Bayes vs. Chance:** Same here (frequencies reflect chances). They diverge if chances are non-ergodic or unstable.  

  ---

  ### Critical Pitfalls & Mitigations
  - **"I don’t have precise credences!"** → Allow ranges but require a number for scoring. Emphasize: "Use your best estimate."  
  - **"Stage 3 feels like a hunch!"** → Contrast: Lamp has 300-run track record (objectively informative) vs. gut feeling.  
  - **Lucky overconfidence** → Highlight aggregate scores: "One win doesn’t make 0.999 rational."  
  - **Stakes are long-run, norm is single-case** → Acknowledge: "The *why* is beyond today. We’re showing *what* the norm looks like in action."  
  - **Contentless hunches** → Stage 3 handout forces evidence-based updates.  

  ### What This Can’t Do
  - **Justify one-shot deference:** Scoring is long-run; the norm’s single-case force requires philosophical argument (briefly mention: "Chance guides rational hope").  
  - **Prove chances exist:** We assume objective chances; this explores how to defer if they exist.  
  - **Handle undermining:** Not covered (time).  
  - **Adversary round:** Separate issue (game theory vs. deference). Skip.  

  ### Handout Text (Stage 3)
  ```  
  PAST 300 RUNS:  
  - Lamp flashed: 210 times  
    → Red ball: 189 times (90%)  
    → White ball: 21 times  
  - Lamp did NOT flash: 90 times  
    → Red ball: 51 times (57%)  
    → White ball: 39 times  
  - OVERALL: Red 240 times (80%), White 60 times  
  ```  

  ### Facilitator Notes
  - **Pre-generation:** Use random seeds (share seeds with group if skeptical).  
  - **Arithmetic:**  
    - Stage 3: P(red|lamp) = \( \frac{189}{210} = 0.90 \); P(red|no lamp) = \( \frac{51}{90} \approx 0.57 \).  
    - Mechanism: P(red) = P(Hi) P(red|Hi) + P(Lo) P(red|Lo) = \( (0.7 \times 0.95) + (0.3 \times 0.45) = 0.665 + 0.135 = 0.80 \).  
  - **Key moral:**  
    > "The norm isn’t ‘report the box number.’ It’s *defer to the chance of the outcome given your current evidence*. Lamp-users deferred to the *evolved* chance; box-followers deferred to an *outdated* chance."  

  This plan forces the group to *experience* why rational credence tracks conditional chance. Stick to the clock—move briskly!
