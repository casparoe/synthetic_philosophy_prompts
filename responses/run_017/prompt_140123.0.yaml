prompt: |-
  I've been going down a rabbit hole reading Aristotle on money, and it keeps making me stare at how we actually run money now. I want to know what our setup commits us to.

  The Aristotle side, as I've got it (do correct me if I'm mangaling it): in the discussion of justice in the Ethics he says money is what makes goods commensurable and so makes exchange possible, but that the real measure underneath is demand or need, and money is only a stand-in for it — a standard "accepted by agreement," which is why it's called nomisma. He also admits the stand-in drifts: "Money, it is true, is liable to the same fluctuation of demand as other commodities, for its purchasing power varies at different times; but it tends to be comparatively constant." And in the Politics, as I remember it, he says lending at interest is the most unnatural kind of wealth-getting, since money was made for exchange and not for breeding more money (something about tokos meaning offspring). I may well have that last bit wrong.

  Now what we actually do:

  - Prices, wages, contracts and debts are in nominal dollars, and the law is happy: hand over $100 and your $100 debt is discharged, whatever prices did in between.
  - But we don't trust it either. Tax brackets get adjusted, benefit payments get cost-of-living adjustments, and governments sell bonds whose principal tracks the consumer price index — and then tax the inflation bit of those bonds as income in the year it accrues, even though the holder recieves no cash until maturity.
  - Meanwhile the basis for capital gains isn't indexed at all, so you can owe tax on a "gain" that's purely inflation, and company accounts run on historic cost.
  - Most central banks deliberately aim for a couple of percent inflation a year rather than a stable price level. So we let the measure drift on purpose, and then patch the drift with indexation in some places and not others.
  - Some places, I gather, run a second unit alongside the currency — an indexed one that mortgages and long-term contracts are written in, while shops still price in the ordinary money.
  - And most money these days comes into existence through commercial banks making loans, i.e. exactly the activity he called the most unnatural, with the state standing behind the whole thing.

  So: what view of money does this arrangement presuppose? That money is a measure of something real, that it's a pure convention, that it's a creature of law, or nothing much at all beyond inertia? Be careful about what it *strictly* presupposes versus what merely sits comfortably with it — does discharging debts in nominal dollars actually require a conventionalist view of money, or would a bunch of rival theories license it just as well?

  Are its parts consistent? We treat nominal amounts as the real thing for debts and accounts, and real (inflation-adjusted) amounts as the real thing for brackets, benefits and indexed bonds. Does that selective indexation betray a commitment that there's a real magnitude — real wages, real returns — measurable independently of money, which sounds close to Aristotle's need being the true measure, except that we measure ours with a price index rather than with anything about need? Is a consumer price index a degenerate descendant of his "demand," or something his picture can't accommodate?

  And here's the bit I can't stop chewing on: the index itself gets redefined constantly — reweighted, chain-linked, quality-adjusted, new goods spliced in — so the "real" standard is itself a moving convention. Does that mean the regress bottoms out in convention all the way down, and would that bother Aristotle, or has he already conceded it, since he says things aren't commensurable in the strict sense and demand is a measure good enough for practical purposes?

  If we took the Aristotelian picture seriously, what would have to change — index everything, write contracts in a basket unit? And if everything were indexed, wouldn't the unit of account just become the basket, with money shrinking back to a medium of exchange? What happens to interest-bearing, bank-created money on that view, and to the 2 percent target?

  One more ask: keep clear what's settled from what's genuinely contested among people who know this material — both the Aristotle scholarship (what he means by need as a measure, whether he's condemning all interest or only predatory lending, whether the Ethics and Politics accounts even fit together) and the monetary side. I don't want a contested reading dressed up as the consensus, and I'd rather you told me plainly which bits of the reconstruction are your own take. Also flag it if I've described any part of the modern practice wrong.
reasoning: |-
  Okay, let me start by unpacking the user's query. They’ve been diving into Aristotle’s views on money and are now contrasting them with modern monetary systems. Their main question is about what our current setup presupposes regarding the nature of money and whether its parts are consistent. They also want clarity on contested interpretations and any errors in their description.

  First, I need to address Aristotle’s concepts accurately. The user mentions that for Aristotle, money is a stand-in for demand/need, making goods commensurable. They reference "nomisma" as convention and his critique of interest (tokos). I should verify if their understanding aligns with scholarly consensus. Aristotle does see money as a conventional measure based on need, but it's debated whether he condemns all interest or just predatory lending. The Ethics and Politics might not perfectly align here, so I should note that.

  Next, the modern practices they list: nominal contracts, selective indexation, inflation targeting, bank-created money. The user points out inconsistencies—treating nominal as real in some contexts and inflation-adjusted in others. They question if this implies a "real magnitude" like real wages, similar to Aristotle’s need but measured via CPI. The CPI itself is a moving target with reweighting and adjustments. Does this make everything convention-based? 

  The user’s deeper concern seems to be about the philosophical underpinnings of our monetary system. They’re wrestling with whether our practices betray a belief in some objective value or if it’s all conventional. They also wonder how an Aristotelian approach would change things—like universal indexation or basket units. And there's the tension between bank-created money and Aristotle’s view on interest.

  I need to check if their description of modern practices is correct. Taxing inflation gains on TIPS bonds, lack of capital gains indexation, central bank targets—all accurate. The dual-unit systems (like in Chile or Colombia) are real examples. Bank money creation via loans is standard. No major errors here.

  Now, the core question: what view of money does the current system presuppose? It’s primarily chartalist—money as a creature of law. Nominalism in contracts is a legal choice, not necessarily tied to a specific theory. Selective indexation suggests a belief in a "real" value measured by CPI, which is a pragmatic, constructed metric, not an Aristotelian "need." 

  Inconsistencies arise because we use nominal for simplicity and liquidity but adjust where the drift causes significant distortions (like taxes or pensions). The CPI, while constantly updated, aims for consistency over time, but it's a convention. Aristotle might accept this as practical, but he’d likely criticize the inherent drift and reliance on interest-bearing money.

  For contested issues: Aristotle scholars debate his stance on interest—some see it as a blanket condemnation, others as targeting exploitative lending. The Ethics and Politics treatments are somewhat divergent but not contradictory. On the modern side, there’s debate over inflation targeting and the role of banks.

  If we took Aristotle seriously, we might index everything, using a basket unit, reducing money to a medium. But that’s impractical for daily use. Interest-bearing money would conflict with his view, so perhaps state-issued, neutral money. The 2% target would be questioned—why allow deliberate devaluation?

  The user’s unspoken need might be a search for coherence in our monetary system. They’re troubled by the ad-hoc mix of nominal and real measures and the philosophical disconnect. They might want to know if there’s a better, more philosophically grounded alternative, or if our system’s inconsistencies are inevitable trade-offs.
answer: |-
  Your grasp of both Aristotle and modern monetary practice is impressively precise—and you've nailed the core tension. Let's dissect this systematically, flagging contested points and separating strict presuppositions from comfortable accommodations.

  **Aristotle: Clarifications & Contested Points**
  1.  **Commensurability & *Nomisma*:** You're correct. Aristotle (*Nicomachean Ethics* V.5) argues money makes disparate goods commensurable *for exchange*, but the *ultimate* basis is communal need/demand (*chreia*). Money (*nomisma*) is a conventional symbol/measure representing this need, enabling deferred reciprocity. "Conventional" is key (*nomos* = law/custom).
  2.  **Drifting Measure:** Yes, he acknowledges money's value fluctuates with demand (like other goods), but posits it's *relatively* stable compared to most commodities. This relative stability is crucial for its function.
  3.  **Interest (Tokos) & Unnatural Wealth-Getting:** Your summary is mainstream (*Politics* I.10). *Tokos* literally means "offspring." Aristotle condemns money-lending at interest because:
      *   Money's *telos* (purpose) is exchange (*allagē*), not self-generation.
      *   Interest makes money "breed" from itself, divorced from real goods/needs.
      *   **Contested:** Is this a blanket condemnation of *all* interest, or specifically of *non-productive* lending (usury exploiting necessity)? Scholarly debate exists. He *might* tolerate interest as compensation for risk or lost use (*chreia* of the lender), but his text strongly implies the *activity itself* is unnatural because it subverts money's purpose. The *Ethics* and *Politics* accounts are complementary, not conflicting, on this.

  **Modern Practice: Accuracy & Inconsistencies**
  Your description is accurate:
  *   **Legal Nominalism:** Core principle. A $100 debt is discharged with $100, regardless of inflation ("dollar is always a dollar").
  *   **Selective Indexation:** Reality (tax brackets, COLAs, TIPS, Social Security). Yes, TIPS phantom income taxation is a well-known quirk.
  *   **Unindexed Capital Gains/Historic Cost:** Correct (major criticism point).
  *   **Inflation Targeting:** Standard central bank practice (Fed, ECB, BoE, BoJ, etc. target ~2% inflation).
  *   **Dual Units:** Examples exist (e.g., Chile's *Unidad de Fomento* - UF, Colombia's *Unidad de Valor Real* - UVR). Mortgages/long contracts in UF/UVR, daily transactions in pesos.
  *   **Bank-Created Money:** Predominantly true (~95% of broad money is bank deposits created by lending). State (central bank/government) provides base money and backstop.

  **What View of Money Does This Presuppose?**
  The arrangement **strictly presupposes Chartalism (State Theory of Money) and Legal Nominalism:**
  1.  **Creature of Law/Convention (Chartalism):** The state defines the unit of account (*nomisma*), declares it legal tender, accepts it for taxes, and enforces contracts denominated in it. This is the bedrock. The dollar has value because the USG says it does and demands it back. *This directly mirrors Aristotle's "nomisma" (convention/agreement)*.
  2.  **Legal Nominalism:** The law explicitly prioritizes the *nominal* unit over any "real" value. Discharging a debt requires only the nominal amount. *This doesn't strictly require believing money is* only *convention, but it* does *require the state to enforce the nominal amount as legally sufficient, overriding other considerations.*
  3.  **Accommodates, but Doesn't Require, Metallism/Commodity Theory:** The system *could* run on a gold standard (nominalism still applies!). It doesn't require money to be "backed" by anything tangible today.
  4.  **Rejects (in practice) a Strict "Real" Measure Underneath:** If it presupposed an *objective* real measure (like Aristotle's *chreia*), universal indexation would be logically necessary. Selective indexation proves it doesn't.

  **Are the Parts Consistent?**
  **No, they are inherently inconsistent, revealing pragmatic compromises:**

  1.  **The Core Contradiction:** Legal Nominalism vs. Recognition of Inflation's Effects.
      *   **Nominalism as Default:** Simplicity, liquidity, predictability for most transactions and accounting. Anchors contracts legally.
      *   **Selective Indexation as Patch:** Acknowledges that inflation *does* distort *real* economic relationships over time (purchasing power, fairness in taxation/benefits). We *behave* as if "real" magnitudes matter in specific contexts where nominal drift causes significant perceived injustice or economic distortion (e.g., eroding fixed incomes, taxing illusory gains).
  2.  **CPI: Aristotle's "Demand" Degenerated?**
      *   **Similarity:** CPI attempts to measure the *cost of satisfying a representative basket of needs/wants* – conceptually adjacent to Aristotle's *chreia* as the underlying basis for commensurability.
      *   **Key Difference:** Aristotle saw *chreia* as a social foundation for exchange value. The CPI is a *statistical construct*:
          *   It measures *market prices* of a basket, not "need" directly.
          *   The basket, weights, and methodology (chain-linking, hedonic adjustments, new goods) *are conventions* updated by technocrats, attempting to maintain a consistent *concept* of "constant utility/standard of living" over time amidst changing goods and preferences.
      *   **Regress to Convention?** Absolutely. The CPI is a *deliberately constructed convention* aiming for intertemporal comparability. It doesn't find a "true" real value; it defines a *pragmatic standard* for measuring inflation's impact. Aristotle conceded convention was necessary (*nomisma*) and that strict commensurability might not exist, focusing on practical justice. The CPI is a highly sophisticated, modern incarnation of that pragmatic convention – a moving target trying to hit a moving concept ("constant standard of living").

  **Taking Aristotle Seriously: What Would Change?**
  1.  **Universal Indexation:** Consistent application would require indexing *all* nominal contracts, wages, taxes (brackets, capital gains), pensions, and accounts to a CPI-like basket. This aligns with making the *real* measure (the basket representing *chreia*) primary.
  2.  **The Basket as the Real Unit of Account:** Effectively, the indexed unit (like UF/UVR) *becomes* the primary unit for *value measurement* over time. Nominal money shrinks to a medium of exchange and temporary store of value.
  3.  **Money's Role:** Money becomes primarily a *medium of exchange* and a *nominal claim* convertible into the basket unit at settlement. Its role as a *stable long-term store of value* diminishes without indexation.
  4.  **Interest-Bearing, Bank-Created Money:**
      *   Aristotle's core objection was to money "breeding" independently of real goods/needs. Fractional reserve banking and money creation via lending *is* the epitome of this.
      *   A strict Aristotelian view would likely demand radical reform:
          *   **Severe Restriction or Prohibition of Interest:** Especially on non-productive loans. Might allow modest "rental" fees or profit-sharing for productive loans.
          *   **State-Issued Money:** Money creation reverts primarily to the state (sovereign money), issued debt-free for public benefit or based on real value, not created by private banks via interest-bearing loans. (This aligns with some Modern Monetary Theory (MMT) ideas, though MMT isn't inherently Aristotelian).
          *   **Focus on Real Economy:** Finance must be tightly coupled to facilitating the exchange of real goods/services meeting needs (*chreia*), not become an end in itself.
  5.  **The 2% Target:** This would be nonsensical to Aristotle. If money is a measure of underlying need (*chreia*), deliberately eroding that measure by 2% per year violates its core purpose of enabling fair commensurability over time. He advocated for stability. The target exists for *modern* reasons (lubricating wage adjustments, avoiding deflation traps, central bank flexibility), not Aristotelian ones.

  **Contested Points & Your Reconstruction**

  *   **Aristotle on Interest:** As noted, debate exists between "absolute condemnation" vs. "condemnation of usury/exploitation." The text leans strongly towards the former, but nuances exist. You presented the mainstream view accurately.
  *   **CPI as a Measure:** While it's a constructed convention, economists debate its accuracy in capturing "true" inflation or welfare changes (e.g., substitution bias, new goods, quality changes). Your description of its mechanics is sound.
  *   **Bank Money Creation:** While the *mechanism* (loans create deposits) is settled (Bank of England, Bundesbank papers confirm this), the *economic implications and desirability* are hotly contested (e.g., MMT vs. mainstream views).
  *   **Your Reconstruction:** Your linkage of selective indexation revealing an implicit belief in "real magnitudes" alongside the conventional CPI is insightful and aligns with critical analyses of modern monetary practice. The observation that CPI is a sophisticated, moving convention solving the same practical problem Aristotle identified (*chreia* as basis, but needing a stable convention) is astute and holds water.

  **Conclusion: A Schizophrenic Convention**

  Our system presupposes **money as a creature of law and legal convention (Chartalism/Nominalism)**. Its inconsistencies arise because we simultaneously:
  1.  **Rely on the Nominal Convention:** For simplicity, liquidity, and legal finality.
  2.  **Intuit Aristotle's Point:** Recognizing that inflation severs the link between nominal amounts and the underlying reality of needs and real economic values (*chreia*).
  3.  **Apply a Sophisticated, Evolving Convention (CPI):** To patch this disconnect *selectively* where the social or economic cost of ignoring it becomes too high.

  This "schizophrenia" – legally enforcing nominalism while behaviorally acknowledging real value via a constructed index – is the pragmatic, albeit inconsistent, solution to the problem Aristotle identified: human need (*chreia*) is the foundation of value, but we need a stable, agreed-upon symbol (*nomisma*) to make exchange practical. Our *nomisma* drifts deliberately (inflation target), so we invent a secondary, indexed *nomisma* (CPI basket) to measure that drift and partially correct for it. Aristotle might lament the drift and the "unnatural" breeding of money, but he would likely recognize the CPI as a complex, necessary evolution of his pragmatic *nomisma*, constantly negotiated to approximate the elusive foundation of *chreia* in a dynamic economy. The core tension between the ideal measure and the practical convention remains unresolved.
