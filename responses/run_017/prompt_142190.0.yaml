prompt: |-
  I work as a software engineer and I keep running into the same shape of arrangement in two completely different settings, and I don't have a word for it. At the personal end: I have configured my phone so that after eleven in the evening a few apps are hidden behind a screen that takes about forty seconds to dismiss. Nothing is blocked; I know the way through, and I have used it. At work: my team has a rule that any change to a production configuration can be made by anyone holding deploy rights, but it only takes effect after an hour's delay, and it posts a message to a public channel the moment it is queued. Overriding the delay is a single deliberate command that anyone can type. I've also been reading a little about constitutional design on the side, and there seems to be a family of provisions of the same kind: a rule is repealable by an ordinary majority, so there is no entrenchment in the strict sense, but the repeal has to be passed twice with a fixed interval between the votes, or the second vote has to fall after an election. What these have in common, as far as I can tell, is that nothing is made impossible, and no penalty is attached — you don't pay a fine, you don't forfeit a deposit, you lose no option that you had before; the only thing added is hassle, delay, and visibility. They also all seem to work, when they work, by a specific mechanism: they outlast a state of mind. The forty seconds is longer than the impulse to check the app usually survives; the hour is longer than the confidence of someone who has just been paged at three in the morning; the interval between votes is longer than a legislative panic about a given scandal. If you still want the thing after the delay has elapsed, you get it, and the arrangement has cost you nothing but the wait.

  I've tried the obvious labels and none of them seem to fit exactly. The Ulysses story that gets mentioned whenever this topic comes up is a case of someone tied to a mast, i.e. of making the forbidden action physically impossible, which is precisely what these arrangements don't do — I can always untie myself, slowly. A deposit contract or a penalty clause is different again, because it changes the payoffs rather than the timing: it gives me a new reason not to act, whereas here I end up with exactly the same reasons as before, just an hour later. Nudges, as I've heard them described, steer people without their noticing and are typically set up by somebody else; these are explicit and self-imposed, at least in the personal and team cases. Cooling-off periods in consumer law are the closest thing I can think of, but those seem to be imposed on people by a regulator, and to be justified by the idea that the person didn't have the relevant information or wasn't thinking clearly, rather than by the person's own foresight about their future self.

  So: does this pattern have a name — the deliberate, self-imposed, escapable friction whose function is to outlast a predicted temporary preference rather than to remove an option, to attach a cost, or to change anyone's mind? If it does, I'd like to know where its edges are rather than just the label. In particular: at what point does enough friction stop being friction and collapse into ordinary binding, so that the distinction I'm drawing turns out to be one of degree after all? What changes when the friction is imposed on an agent by someone else — my employer's approval workflow rather than my own phone setting, or one parliamentary faction's procedural requirement on its successors — given that in the institutional case the people who set the trap and the people caught in it are only nominally the same agent? And there's a case I find genuinely puzzling: an override that is available, known to be available, and never used, so that eventually using it would itself communicate something — that the person was desperate, or that the emergency was real. Does that convert the arrangement into a different kind of thing entirely, a convention or a taboo rather than a mechanism, and does the answer to that affect whether the original arrangement should be called a precommitment at all, given that nothing has been committed? I'm not after a reading list; I want the carving — what this is, what it isn't, and which of the neighbouring concepts it is most likely to be mistaken for. If there is no established term, please propose one, define it, and give the boundary cases that would test the definition. Please write your answer in British English.
reasoning: |-
  Okay, this user is a software engineer who's noticed a recurring pattern across personal habits, team workflows, and constitutional design. They're describing mechanisms that add deliberate friction—like delays or visibility—without actually removing options. The core idea seems to be creating time-based barriers that outlast temporary impulses. 

  Hmm, they've clearly done their homework—they've ruled out "Ulysses pacts" (too irreversible), penalty clauses (changes incentives), and nudges (too covert). The cooling-off period analogy is close but misses the self-imposed aspect. Fascinating how they're spotting the same cognitive principle scaling from phone settings to parliamentary procedures. 

  Their boundary questions are sharp: when does friction become binding? What if the override exists but becomes taboo? That unused override point is particularly juicy—it shifts from mechanics to social signalling. 

  Right, the term needs to capture: self-imposed, delay-centric, escapable, and designed to exploit volatility of will. "Precommitment" feels closest despite their objection about reversibility. But in behavioural econ, precommitment absolutely includes soft barriers—the key is the intentionality, not the enforceability. 

  For the override taboo... that's where "convention" or "equilibrium" kicks in. The mechanism morphs when disuse makes activation costly. Like nuclear footballs—technically usable, but the act itself becomes a signal. 

  British English tweaks: "behavioural" not "behavioral", "licence" for verb, "tyre-kicking" for hesitation metaphors. Should mention Thaler/Sunstein but position this as a distinct subspecies of precommitment.
answer: |-
  This pattern absolutely has conceptual coherence, and while no single term is universally canonical in all contexts, the most precise descriptor is **Deliberative Precommitment**. Let's carve it out, addressing your boundary cases and distinctions.

  ### Core Definition
  **Deliberative Precommitment:** A self-imposed (or collectively self-imposed) procedural mechanism introducing *non-prohibitive friction* (delay, visibility, extra steps) designed solely to ensure a preference survives a predictable period of volatile motivation or cognitive state. It:
  1.  **Does not remove options:** The original action remains fully accessible.
  2.  **Does not alter payoffs:** No new penalties or rewards are introduced; only time and effort/cognition are expended.
  3.  **Exploits temporal inconsistency:** Relies on the predicted transience of the impulse/state driving the initial desire to act.
  4.  **Is intentional & transparent:** Set up knowingly in advance by the agent(s) it binds, precisely to counter future selves/situations.

  ### Why this fits your cases
  *   **Phone App:** You precommit to a 40-second barrier knowing late-night impulses are fleeting. The friction outlasts the impulse.
  *   **Production Change:** The team precommits to a 1-hour delay + visibility. It counters impulsive "fixes" under pressure (3 am pages) but allows necessary changes after reflection. The override preserves option availability.
  *   **Constitutional Provisions:** Double votes or post-election votes are precommitments by the polity (via its constitution-makers) against legislative whim or panic. The rule remains repealable, but only after the volatile moment passes.

  ### Distinguishing from Neighbours
  1.  **Ulysses Pact (Binding Precommitment):** *Physically or irrevocably* removes the option (tying to the mast). **Distinction:** Deliberative Precommitment maintains *escape hatches*; the friction is *bypassable* with deliberate effort *during* the volatile state. It trusts the override, but makes using it salient/effortful enough to require reflection.
  2.  **Penalty Clause / Deposit Contract:** Alters the *cost-benefit calculus* of the action (e.g., losing money). **Distinction:** Deliberative Precommitment doesn't change the *fundamental* payoff structure of the *action itself*. The "cost" is purely the time/effort of waiting or bypassing, inherent to the mechanism, not an extrinsic penalty.
  3.  **Nudge:** Subtly alters the *choice architecture* to steer behaviour unconsciously (e.g., default options). **Distinction:** Deliberative Precommitment is *conscious, intentional, and transparent*. The agent knows *why* the friction exists and *that* it was self-imposed. It's about conscious self-binding, not subconscious steering.
  4.  **Cooling-Off Period:** Imposed externally (regulator) to protect vulnerable parties (consumers) presumed to lack information or capacity *at the time of the initial decision*. **Distinction:** Deliberative Precommitment is *self-imposed* based on *foresight* about one's *own future* volatility. The justification isn't external protectionism but internal self-management.

  ### Boundary Cases & Testing the Definition
  1.  **When does friction become binding?** It's a spectrum, but the distinction holds where:
      *   **The override is readily executable *during* the volatile state.** If bypassing the delay requires superhuman willpower, impossible feats, or resources unavailable *in the moment of temptation*, it crosses into binding. (E.g., A 40-second delay with an override requiring solving complex maths *during* the late-night impulse might be effectively binding). **Test:** Could a reasonably determined agent, experiencing the predicted volatile state, execute the override *without* the delay period elapsing? If yes, it's friction; if no, it's binding.
  2.  **Externally Imposed Friction (e.g., employer's approval workflow):** This is where "self-imposed" becomes nuanced.
      *   **If adopted consensually by the team/organisation as a self-binding rule** (like your production change example), it fits as *collective* deliberative precommitment. The "self" is the group agent.
      *   **If imposed top-down without consent,** it's more akin to a cooling-off period or procedural control. It *uses the mechanism* but lacks the core element of *self*-binding for *self*-predicted weakness. It becomes external governance, not self-governance. **Test:** Did the agents subject to the friction *participate in or consent to* its establishment *as a tool for managing their own predicted future volatility*? If yes, it qualifies; if no, it doesn't.
  3.  **The Unused Override (Taboo Case):** This is fascinating and doesn't negate the precommitment; it adds a *social/conventional layer*.
      *   The core mechanism remains a deliberative precommitment: friction is added, an override exists.
      *   The *disuse* of the override creates a **Separate Equilibrium.** Using it now signals something costly (desperation, recklessness) due to established norms or reputational concerns. This signalling cost is an *emergent property*, not an intrinsic feature of the precommitment mechanism itself.
      *   **Is it still a precommitment?** Yes, fundamentally. The *option* and *friction* were precommitted. The *taboo* is a social phenomenon built *on top* of it. The original arrangement hasn't changed; its *context of use* has evolved. **Test:** If the signalling cost suddenly vanished (e.g., anonymity), would the override be used in volatile states? If yes, the underlying precommitment mechanism is intact, overlaid with convention.

  ### Proposed Term: Deliberative Precommitment
  *   **Why not just "Precommitment"?** "Precommitment" is often used loosely or conflated with binding pacts. "Deliberative" emphasises the core features: the *friction induces deliberation* during the delay/bypass, and the mechanism was established *deliberately* for this purpose.
  *   **Why it works:** It captures the intentionality ("precommitment") and the mechanism's function ("deliberative" – forcing a pause/thought).

  ### Key Carving Summary
  *   **What it IS:** Self/collective binding via escapable friction (delay/steps/visibility) designed to outlast volatile states, without changing core options or payoffs.
  *   **What it IS NOT:** Physical prevention, payoff alteration, subconscious steering, or externally imposed protection for presumed incompetence.
  *   **Likely Misidentifications:**
      *   **Binding Precommitment (Ulysses Pact):** Mistaken when the friction is severe enough to feel like prevention, but the key is the *practical executability of the override in the moment*.
      *   **Cooling-Off Period:** Mistaken when imposed externally without the self-binding intent, especially in consumer contexts.
      *   **Bureaucracy/Red Tape:** Mistaken when friction is unintentional, inherent inefficiency, or designed for control/audit *rather than* specifically to counter predicted temporal inconsistency in the agent's own decision-making.

  The power of deliberative precommitment lies in its recognition of human frailty (volatile will) while respecting agency (preserving the option). It's a tool for self-governance across scales, from personal habits to constitutional orders, relying on time as the ultimate solvent of rash impulses. The existence of an override, even an unused one, is not a flaw but a feature, ensuring the mechanism serves self-control rather than becomes tyranny.
