answer: |-
  ## Desiderata for Classifying Traditional Narratives as Historical (Secular Reference Context)

  Following your audit and analysis of the raw constraints and considerations, here are the formulated desiderata for a criterion classifying traditional narratives as historical for secular reference purposes. Each desideratum is stated, motivated by a case or consideration, and marked for negotiability.

  ### I. Desiderata for the Criterion

  1.  **Non-Circular Independence:** The criterion must require evidence *independent* of the narrative tradition itself for key claims.
      *   **Motivation:** Circular cross-validation (e.g., identifying Troy based on Homer, then using finds there to "prove" Homer; interpreting inscriptions solely through the lens of the tradition they might corroborate). This directly addresses Failure Mode 3.
      *   **Negotiability:** Non-negotiable.

  2.  **Discriminates Corroborative Detail:** The criterion must distinguish between details *likely absorbed* by the narrative (available local color) and details *likely corroborative* of specific events described.
      *   **Motivation:** Absorbed Detail (Failure Mode 2). Real place names (Troy, Jericho), offices (Pharaoh, High King), or objects (chariots, specific weapons) within a story do not inherently validate the events said to have occurred involving them. A criterion must explain *why* a specific detail supports the event claim beyond mere existence.
      *   **Negotiability:** Non-negotiable.

  3.  **Addresses Transmission Dynamics:** The criterion must explicitly account for how features enhancing transmission (drama, memorability, cultural utility, the miraculous) correlate with potential for distortion, elaboration, or invention. It cannot assume vividness, persistence, or wide circulation indicate fidelity.
      *   **Motivation:** Transmission Selection (Failure Mode 1). The very elements that make the Trojan War or Exodus compelling stories (divine interventions, plagues, epic heroes) are those most susceptible to embellishment or invention over time. A criterion must not mistake narrative power for historical reliability.
      *   **Negotiability:** Non-negotiable.

  4.  **Decomposition:** The criterion must allow for gradation, applying to specific *claims* within a narrative (e.g., "a conflict occurred at site X," "a leader named Y existed," "event Z involving the divine happened") rather than producing a monolithic verdict on "The Trojan War" or "The Exodus."
      *   **Motivation:** Different claims (geography vs. named individuals vs. specific deeds vs. supernatural elements) within a single tradition have vastly different evidential burdens and plausibility structures. Arthur's existence is a different claim from him pulling a sword from a stone.
      *   **Negotiability:** Non-negotiable.

  5.  **Existence/Accuracy Split:** The criterion must distinguish between evidence for the *existence* of a named individual and evidence for the *accuracy* of specific deeds or events attributed to them in the narrative.
      *   **Motivation:** Finding evidence a "King Arthur" figure existed in post-Roman Britain tells us nothing about specific battles like Badon or the wizard Merlin. Conversely, evidence of battles doesn't automatically validate a specific named leader attached to them by tradition. Moses as an Egyptian prince vs. Moses as lawgiver crossing the Red Sea are distinct claims.
      *   **Negotiability:** Non-negotiable.

  6.  **Explicit Expected-Record Assumption:** If interpreting silence (absence of expected evidence), the criterion must explicitly state the underlying assumption about what records *should* exist for that society, period, and type of event.
      *   **Motivation:** Judging the Exodus by the absence of Egyptian records mentioning Moses or mass Hebrew departure requires an explicit assumption: that such an event *would* have been recorded by Egyptian bureaucracy in a specific way and that those records *would* have survived. This assumption itself needs scrutiny.
      *   **Negotiability:** Non-negotiable when silence is used negatively.

  7.  **Controls Calibration:** The criterion must be demonstrably applicable to known historical events (with positive calibration) and known invented narratives (with negative calibration).
      *   **Motivation:** Recalibration. A criterion failing to recognize the historical core of well-documented recent events (e.g., WWII) or failing to exclude demonstrably fabricated modern legends is flawed. This tests robustness beyond internal logic.
      *   **Negotiability:** Preference (Strongly held by evidentialists, may be downplayed by others).

  8.  **Plausibility Contextualized:** If using "generic plausibility," the criterion must define the relevant context (e.g., human behavior, known historical patterns, natural laws) and apply it consistently, acknowledging its limitations.
      *   **Motivation:** "The sort of thing that happens" is subjective. Wars over women? Plausible in Bronze Age contexts. Gods fighting on a battlefield? Implausible under naturalistic assumptions. This requires clear definition and avoids being a mere reflex of the applier's worldview.
      *   **Negotiability:** Preference (Valued by skeptics, mistrusted by others as too restrictive).

  9.  **Criterion of Embarrassment/Absence of Motive - Contextualized:** If used, these must be applied with deep contextual understanding of the tradition's origin and purpose, not mechanically.
      *   **Motivation:** What seems "embarrassing" or "lacking motive" to a modern secular reader may not have been so to the originators (e.g., disciples reporting Jesus's crucifixion – embarrassing under Jewish messianic expectations). Motives for invention (political legitimation, etiological explanation, moral lesson) are often complex and not always obvious. These are weak reeds alone.
      *   **Negotiability:** Preference (Often favored by scholars within a tradition, viewed skeptically by outsiders).

  10. **Chronological Proximity - Weighted:** Earlier sources *generally* have less time for distortion but must be evaluated alongside other desiderata (Independence, Transmission Dynamics). Proximity alone is insufficient.
      *   **Motivation:** Near-contemporary accounts are valuable (Failure Mode 1), but even early sources can be biased, wrong, or part of an already elaborated tradition. Later sources *can* preserve early kernels, though harder to isolate.
      *   **Negotiability:** Preference (Weighted heavily by evidentialists, seen as less critical by others if other evidence is strong).

  11. **Independence of Attestation - Defined:** The criterion must define "independent attestation" rigorously, addressing challenges of shared oral tradition and textual dependence.
      *   **Motivation:** Multiple sources aren't independent if they derive from a single origin (e.g., gospels synoptically dependent, later Arthurian texts dependent on Geoffrey of Monmouth). Truly independent strands (e.g., potential separate oral traditions converging, distinct textual lineages) are stronger but difficult to establish for deep antiquity. "Independence" requires careful definition.
      *   **Negotiability:** Preference (Crucial for many, but definitions vary and application is often contentious).

  ### II. Audit of Raw Material & Placement

  *   **Chronological proximity:** Addressed (Desideratum 10 - Weighted Preference).
  *   **Numerical independence of attestations:** Addressed (Desideratum 11 - Preference, requiring definition).
  *   **Agreement with excavation/inscriptions:** Core to Desideratum 1 (Non-Circular Independence) and Desideratum 2 (Discriminates Corroborative Detail). *Must* be independent.
  *   **Criterion of embarrassment:** Addressed (Desideratum 9 - Contextualized Preference).
  *   **Absence of motive for invention:** Addressed (Desideratum 9 - Contextualized Preference). Highly subjective.
  *   **Generic plausibility:** Addressed (Desideratum 8 - Contextualized Preference).
  *   **Inference from real names/places/offices:** Directly addressed and constrained by Desideratum 2 (Discriminates Corroborative Detail - Non-negotiable). This common reflex is insufficient alone.

  ### III. Structural Questions

  1.  **Conflicting Pair:** The sharpest conflict is between **Controls Calibration (7)** and the requirement for **Non-Circular Independence (1)** applied *neutrally* across traditions. Calibration requires testing against "known" cases. However, defining "known" for deep antiquity (like the Exodus or Trojan War's core) is precisely what's contested. Applying controls derived from, say, well-documented Roman history to Bronze Age Aegean traditions risks imposing anachronistic expectations (violating Desideratum 6 implicitly). Conversely, a criterion calibrated *only* on modern or medieval "knowns" may be irrelevant to assessing prehistoric or protohistoric traditions. The criterion must give up the expectation of *perfect* neutrality; it will inherently reflect the epistemic norms and "knowns" of the evaluator's context. Striving for fairness and explicitness (Desiderata 6, 8, 9) is the mitigation.
  2.  **Most Exclusionary Desideratum:** **Non-Circular Independence (1)** is the most exclusionary. It immediately disqualifies vast swathes of evidence commonly marshalled for traditional narratives: archaeological identifications *based* on the story, interpretations of inscriptions *filtered* through the story, internal consistency arguments, and claims relying solely on the narrative's persistence or cultural importance. It demands evidence *outside* the tradition's own frame, which is often scarce or non-existent for events in deep pre-literate or proto-literate pasts.
  3.  **Purpose Shift:**
      *   **Court Adjudicating Claim:** Non-Circular Independence (1) becomes paramount. Burden of proof shifts heavily onto the claimant. Discriminates Corroborative Detail (2) and Explicit Expected-Record Assumption (6) become critical for evaluating evidence like place names or silence. Controls Calibration (7) might be applied using legal precedents/standards of evidence. Decomposition (4) and Existence/Accuracy (5) remain crucial. Plausibility (8) and Embarrassment (9) become much weaker. Generous Default (stance ii) is largely excluded.
      *   **Religious Community:** The core purpose shifts from "what occurred?" to "what is true for us?". Non-Circular Independence (1) may become irrelevant or even hostile to the purpose. Controls Calibration (7) using secular "knowns" is likely rejected. Transmission Dynamics (3) might be reinterpreted as divine preservation. Plausibility (8) may be redefined theologically. Decomposition (4) might be resisted if the narrative is seen as a holistic sacred truth. Criterion of Embarrassment (9) could gain weight *within* the theological framework. The Generous Default (stance ii) or a theological stance dominates. The very need for a "historical rather than legendary" criterion might be contested in favor of revealed truth.

  ### IV. Stance Scorecard

  | Desideratum                              | (i) Austere Evidentialism | (ii) Generous Default | (iii) Memory-First Approach |
  | :--------------------------------------- | :------------------------ | :-------------------- | :-------------------------- |
  | **1. Non-Circular Independence**         | Strong                    | Weak                  | Irrelevant                  |
  | **2. Discriminates Corroborative Detail**| Strong                    | Weak                  | Irrelevant                  |
  | **3. Addresses Transmission Dynamics**   | Strong                    | Weak                  | **Strong** (focus of study) |
  | **4. Decomposition**                     | Strong                    | Moderate              | Strong                      |
  | **5. Existence/Accuracy Split**          | Strong                    | Weak                  | Moderate (focuses on memory, not event) |
  | **6. Explicit Expected-Record**          | Strong                    | Weak                  | Moderate (contextual)       |
  | **7. Controls Calibration**              | Strong                    | Weak                  | Moderate (applied differently) |
  | **8. Plausibility Contextualized**       | Strong                    | Weak                  | Weak (memory ≠ plausibility) |
  | **9. Embarrassment/Motive (Context)**    | Weak/Skeptical            | Strong                | Irrelevant                  |
  | **10. Chronological Proximity (Weight)** | **Strong**                | Moderate              | Moderate (source age matters) |
  | **11. Independence Attestation (Defined)**| **Strong**                | Weak                  | Moderate (trajectory matters) |

  **Summary:** Austere Evidentialism satisfies the core non-negotiable demands for independence and discrimination best for the secular reference purpose but may struggle with calibration fairness for deep antiquity. Generous Default fails most non-negotiables (1,2,3) and is unsuitable. Memory-First excels at studying transmission (3) but explicitly sidesteps the core question of historicity (making 1,2,8,9 irrelevant or secondary), aligning poorly with the stated purpose of determining what to assert about the past.
