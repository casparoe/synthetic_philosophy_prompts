  Candidate Case 1: **The Benchwarmer**

  **Scenario**: Coach Anderson has a ninth-grade basketball player, Leo, who has been on the bench all season. Leo is small and uncoordinated, but he works hard. The team is down by one point with ten seconds left in a game that doesn't affect playoffs. Coach Anderson, without any evidence that Leo can make the shot (in fact, Leo has missed all his practice shots) and stifling his own doubts, believes that Leo will make the game-winning shot if put in. He puts Leo in and Leo, inspired by the coach's confidence, makes the shot.

  **Belief**: "Leo will make the game-winning shot if I put him in now." Evidence at the moment: thin (Leo has no track record, and in practice he misses) or even against (statistically, he's unlikely).

  **Clifford**: Condemned. Reason: The origin of the belief matters (Coach stifled doubts, didn't investigate Leo's recent form) and the community of inquiry (team, other coaches) is damaged by such habits.

  **James**: Licensed? The option is forced (put Leo in or not), live (it's possible, though unlikely), momentous (a chance for Leo to overcome his reputation and gain confidence). But note: the benefit is for Leo, not the coach. James might say it's licensed because the coach's belief leads to an action that might bring about a truth (that Leo can do it under pressure) that otherwise might never be known.

  **Best surviving reply**: Clifford could argue that the coach could have acted as if he believed (without actually believing) by putting Leo in and encouraging him, thus achieving the same result without violating epistemic duties. (But we must avoid escape route (a).)

  **Verdict**: Conflict. Clifford condemns, James permits.

  Candidate Case 2: **The Group Project Slack**

  **Scenario**: In a group project for history class, four students are assigned together. One member, Sam, has a reputation for slacking. The project leader, Maya, stifles her doubts (based on Sam's past) and believes that Sam will contribute meaningfully this time if given a critical role. She assigns Sam the lead on the research section, despite thin evidence (Sam has done nothing so far and even missed a meeting). Sam, feeling trusted, steps up and does an excellent job.

  **Belief**: "Sam will do an excellent job on the research section if I assign him to lead it." Evidence: thin (no positive signs) or even against (past behavior and recent absence).

  **Clifford**: Condemned. Reason: Duty to inquire (Maya didn't check with Sam about his commitment or gather more evidence) and the origin of the belief is flawed.

  **James**: Licensed? The option is forced (assign Sam or not), live (it's possible Sam could turn around), momentous (if Sam doesn't contribute, the project suffers; if he does, he gains confidence and skills). But the truth that Sam can be responsible might only be reached by believing and acting on it.

  **Best surviving reply**: Escape route (a): Maya could have assigned Sam the role and acted as if she believed (encouraging him) without actually believing, thus achieving the same result. Also, (b): she could have talked to Sam first to gather evidence.

  **Verdict**: Conflict.

  Candidate Case 3: **The Suspension Doubt**

  **Scenario**: The school's chemistry lab equipment is found broken. Mr. Evans, the teacher, suspects a particular student, Alex, who has a history of mischief but was seen near the lab. However, the evidence is thin (no witnesses, and Alex denies it). The principal, Ms. Green, stifles her doubts and believes that Alex did not do it (despite the circumstantial evidence). She decides not to suspend him, which allows Alex to participate in the upcoming science fair. Alex, grateful for the trust, confesses that he didn't do it and actually helps find the real culprit (a malfunctioning valve). The benefit is that Alex stays on track and the real cause is found.

  **Belief**: "Alex did not break the lab equipment." Evidence: thin (no direct evidence) or even against (circumstantial: history and proximity).

  **Clifford**: Condemned. Reason: The origin of the belief is flawed (doubt stifled, no investigation done) and it damages the community (if teachers believe without evidence, it sets a bad example).

  **James**: Licensed? The option is forced (suspend or not), live (it's possible he didn't do it), momentous (suspension could derail Alex, while trust could redeem him). The belief in Alex's innocence leads to an outcome where the truth is revealed and Alex benefits.

  **Best surviving reply**: Escape route (a): The principal could have acted as if she believed (by not suspending) without actually believing, thus achieving the same result. Also, (b): she should have investigated first.

  But note: In this case, the belief is about a past event (who broke it) and the principal's belief doesn't cause the event (the breakage didn't happen again). However, the belief leads to an action (not suspending) that then causes Alex to help. Also, the belief is that Alex didn't do it, which is then confirmed. But the belief itself doesn't cause the event (the breakage) to not have happened? Wait, the event already happened. The belief is about a past fact.

