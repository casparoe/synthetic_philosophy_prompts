  This case exposes the tension between the social consequences of belief (Clifford) and the individual's right to believe when evidence is insufficient and the stakes are high (James), but with the twist that the belief's benefit is for another person. Clifford's argument is that the coach's believing without evidence corrupts the habits of inquiry (e.g., the team might start making decisions based on hunches rather than data) and wrongs the community. James would argue that in a momentous, forced, and live option, the coach is entitled to let his passional nature decide. However, James's typical focus is on the believer's own access to truth, but here the truth (that Leo can make the shot under pressure) is accessed by the team and Leo, not primarily the coach. The conceptual issue is whether the Jamesian permission can extend to beliefs that are other-regarding and instrumental in bringing about a social good, even when formed on insufficient evidence.

