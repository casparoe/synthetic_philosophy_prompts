  After analyzing your cases and verdicts, I've refined and formalized a decision principle that captures your intuitions in most scenarios while addressing the inconsistencies. Your tentative formulation is a good starting point but needs adjustment for cases like (5) and (6), where ex ante uncertainty is absent or the prediction mechanism decouples from your current disposition. The core idea is to use ex ante policy optimization only when there are dependencies across states (e.g., predictions or mechanisms that respond to your disposition), and to act locally otherwise. Below, I explain the principle, test it against your cases, provide the accuracy threshold formula for (1), introduce a new case, and conclude with the lab-report verdict and a summary.

  ### Refined Decision Principle
  **Principle:** When the outcome depends on your disposition (e.g., through a predictor or precommitment mechanism) across possible states, commit to the policy that maximizes ex ante expected utility before learning the state, and follow it unconditionally—disregarding any information that only reveals which state occurred. In decisions with no such dependencies, maximize utility given current knowledge.

  - **Key elements:**
    - **Ex ante commitment:** Choose a policy (e.g., "always pay" or "never pay") from behind a "veil of ignorance" before knowing the state.
    - **Follow unconditionally:** Once the state is known, stick to the policy without re-evaluating based on state-specific information (e.g., the coin flip result or letter arrival).
    - **Dependencies trigger policy use:** Apply this only if the setup involves predictions, blackmail conditions, or similar mechanisms that make outcomes depend on your disposition across branches. Otherwise, act locally based on current information.
    - **Why it works:** It handles Newcomb-like problems (e.g., (1), (2), (4)) by emphasizing the link between your disposition and outcomes in other states, while avoiding counterfactual pitfalls in fixed or local scenarios (e.g., (3), (5)).

  ### Testing Against Your Cases
  Here, I apply the principle to each case, show the derived verdict, and note where it aligns or conflicts with your intuitions. Expected utility (EU) calculations use the probabilities and payoffs you provided.

  - **(1) Omega coin flip (tails, pay $100 for potential $10,000 in heads branch):**  
    - **Dependency:** Yes—the $10,000 payout depends on Omega's prediction of your action in the tails state.  
    - **Ex ante policy choice:** Commit to "pay" or "not pay" before knowing the flip.  
      - EU(pay) = P(heads) × [$10,000 if prediction correct] + P(tails) × [-$100] = (999/1000) × $10,000 + (1/1000) × (-$100) = $9,989.90  
      - EU(not pay) = (999/1000) × $0 + (1/1000) × $0 = $0  
      - Better policy: "pay" (higher EU).  
    - **Verdict:** Follow policy and pay.  
    - **Match:** Yes—agrees with your verdict.

  - **(2) Desert driver (pay $1,000 in town after rescue):**  
    - **Dependency:** Yes—rescue depends on the driver's prediction of your payment disposition.  
    - **Ex ante policy choice:** Commit to "pay" or "not pay" before knowing if stranded. Assume probability q of being stranded (q cancels out). Let V = value of rescue (avoiding death, so V ≫ $1,000).  
      - EU(pay) = q × (V - $1,000) + (1-q) × $0 = q(V - $1,000)  
      - EU(not pay) = q × (-L) (L = large loss from death) + (1-q) × $0 = -qL  
      - Since V - $1,000 > -L (rescue value exceeds loss), EU(pay) > EU(not pay). Better policy: "pay".  
    - **Verdict:** Follow policy and pay.  
    - **Match:** Yes—agrees with your verdict.

  - **(3) Blackmailer with definite condition (pay $1,000 or lose $100,000):**  
    - **Dependency:** No—no prediction or multi-state mechanism; outcome depends only on current action.  
    - **Local decision:** Given current knowledge (condition known), paying saves $99,000 (-$1,000 vs. -$100,000).  
    - **Verdict:** Pay.  
    - **Match:** Yes—agrees with your verdict. Principle treats this as local, so no policy needed.

  - **(4) Probabilistic blackmailer with XOR condition (letter arrives, don't pay):**  
    - **Dependency:** Yes—letter sending depends on your disposition via the XOR condition (send iff exactly one true: you have the condition or you would pay).  
    - **Ex ante policy choice:** Commit to "pay" or "not pay" before knowing condition or letter status. P(condition) = 1/1000.  
      - EU(pay if letter): If commit to pay, blackmailer sends letter only if no condition (since "would pay" true, so XOR requires not C).  
        - EU = P(no condition) × [-$1,000] + P(condition) × [$0] = (999/1000) × (-$1,000) + (1/1000) × $0 = -$999  
      - EU(not pay if letter): If commit to not pay, blackmailer sends letter only if condition (XOR requires C true).  
        - EU = P(condition) × [-$100,000] + P(no condition) × [$0] = (1/1000) × (-$100,000) + (999/1000) × $0 = -$100  
      - Better policy: "not pay" (higher EU).  
    - **Verdict:** Follow policy and don't pay upon letter arrival.  
    - **Match:** Yes—agrees with your verdict. Friend's instability argument fails because re-evaluating after learning the state (e.g., inferring the condition from the letter under "not pay" policy) would undermine the ex ante optimum. Disregard state-revealing information (letter arrival) and stick to policy.

  - **(5) Digit of pi fixed (digit=1, not pay $100 for counterfactual $10,000):**  
    - **Dependency:** None—digit is necessary truth; no real uncertainty or cross-state dependency. The "branch" is counterfactual and unaffected by your action.  
    - **Local decision:** Given known state (digit=1), paying loses $100 for no benefit; not paying yields $0.  
    - **Verdict:** Don't pay.  
    - **Match:** Yes—agrees with your leaning, but overturns your friend's view. Principle treats this as local due to fixed state.

  - **(6) Omega simulates your 15-year-old self (pay shakily) or stranger (don't pay):**  
    - **Dependency for self-simulation:** Weak—prediction based on past self, not current disposition. However, if past self strongly correlates with current self, treat as dependent.  
      - **Ex ante policy choice:** Commit to "pay" or "not pay" before flip. Prediction fixed from simulation, so EU depends on P(simulation matches your action).  
        - For high correlation (self), EU(not pay) slightly > EU(pay) (as in case (1) accuracy analysis). Better policy: "not pay".  
        - Follow policy: don't pay.  
      - **Verdict for self:** Don't pay.  
      - **Conflict:** Overturns your verdict (you said pay).  
    - **Dependency for stranger-simulation:** None—no correlation, so no cross-state dependency.  
      - **Local decision:** In tails state, paying loses $100; not paying yields $0.  
      - **Verdict:** Don't pay.  
      - **Match:** Yes—agrees with your verdict.  
    - **Why overturned for self:** Your shaky intuition might stem from perceived identity with past self, but rationally, the policy favors "not pay" due to dominant EU under uncertainty.

  - **(7) Accuracy threshold for (1):**  
    - **Formula derivation:** From EU analysis in (1), with accuracy a (P(prediction correct)).  
      - EU(pay) = P(heads) × [a × $10,000 + (1-a) × $0] + P(tails) × [-$100] = (999/1000) × 10,000a - (1/1000) × 100  
      - EU(not pay) = P(heads) × [(1-a) × $10,000 + a × $0] + P(tails) × $0 = (999/1000) × 10,000(1-a)  
      - EU(pay) > EU(not pay) when:  
        (999/1000) × 10,000a - 0.1 > (999/1000) × 10,000(1-a)  
        Simplify: (999/1000) × 10,000 × (2a - 1) > 0.1  
        9990 × (2a - 1) > 0.1  
        2a - 1 > 0.1 / 9990 ≈ 0.00001001  
        a > 0.500005005 ≈ 0.5 + 1/(2 × 99,900)  
      - **Threshold:** Pay if a > 0.5 + ε (practically, a > 0.5). At a = 0.55, EU(pay) > EU(not pay); at a = 0.5, EU(not pay) > EU(pay).  
    - **Matches your fading willingness:** At 90%, pay; at 55%, pay (since 55% > 50%); at exactly 50%, don't pay. Your "no idea" at 55% may stem from low stakes, but principle gives clear threshold.

  ### New Case: Transparent Newcomb's Problem
  - **Setup:** Omega offers two boxes: Box A (transparent, contains $1,000) and Box B (opaque, contains $1,000,000 iff Omega predicted you would take only B). Omega is 99% accurate. You see $1,000,000 in Box B through the glass. Do you one-box (take only B) or two-box (take both)?
  - **Principle application:**  
    - Dependency: Yes—Box B contents depend on prediction of your disposition.  
    - Ex ante policy: EU(one-box) = 0.99 × $1,000,000 + 0.01 × $0 = $990,000; EU(two-box) = 0.01 × $1,001,000 + 0.99 × $1,000 = $11,000; better policy: one-box.  
    - Follow unconditionally: One-box, ignoring the "state-revealing" information (seeing the money).  
  - **Verdict:** One-box.  
