prompt: |-
  You are a decision scientist who advises research and development organizations on escalation of commitment, and you are fluent in the formal literature on the dollar auction and wars of attrition. Think carefully before you answer: begin by listing the ways the dollar-auction framing can misfire when it is imposed on a real organization, and only then build the procedure.

  I chair the quarterly go/no-go review at a mid-sized biotech, roughly 200 people. We make six to ten continue/kill decisions per quarter in a single half-day, the CEO signs off, and the program leads in the room are the people who built the programs. The standard advice, that sunk costs are irrelevant and only forward-looking value counts, gets quoted and then quietly ignored, because two features of our situation make it look less like a bad investment and more like a dollar auction: the commercial prize is winner-take-most, so second place is worth very little, and much of what we have already spent is unrecoverable in a way that is mirrored on the other side, since the rival still in the race has burned comparable money that their exit would also strand. Our head of business development uses exactly this to argue the reverse of the standard conclusion: if a rival is still funding, that is evidence the asset is worth more than our own numbers say, so killing is the real mistake.

  I need a reusable procedure, not a one-off opinion. Please give me, in order: a screening step that sorts each program into the structures that actually matter, meaning a genuine two-sided contest with an observable rival, an ordinary one-sided escalation whose only opponent is our own prior spend, and what I think of as the phantom bidder case, where a rival is invoked rhetorically but is not really still bidding or whose exit we cannot observe; the tests to run after screening, with what counts as a sufficient answer to each, where the procedure stops with a no, and what to do when the number a test needs is simply unavailable, as it usually is; an explicit treatment of the persistence-as-evidence argument, covering when a rival's continued funding is information about the size of the prize, when it is only their own escalation, and how to tell the difference without access to their data; the points where judgment cannot be eliminated and a named person must decide, flagged honestly as judgment calls dressed up as procedure; and what the procedure cannot do. Then run it on three cases: a mid-stage asset whose rival just published strong data, a program whose rival left the field two years ago while our team still describes the space as a race, and one where I expect to dislike the answer, our flagship program, the one the company was founded on, now three years behind the leader. Answer in American English throughout.
reasoning: |-
  We are designing a procedure to handle escalation of commitment in biotech R&D decisions, with a focus on distinguishing between different competitive structures: genuine two-sided contests, one-sided escalation, and phantom bidders. The procedure must be reusable and account for the specific challenges of winner-take-most markets and unrecoverable sunk costs.

  The core issue is that the standard advice (ignore sunk costs, focus on forward-looking value) is being overridden by a perception that the situation is a dollar auction (or war of attrition) due to:
  - Winner-take-most commercial prize (second place is worth little)
  - Unrecoverable sunk costs that are mirrored by rivals (if a rival exits, they also strand their investment)

  Our Head of Business Development argues that a rival's continued funding is evidence that the asset is worth more than our own numbers suggest, so killing the program might be a mistake.

  The procedure will have the following steps:

  1. **Screening Step**: Classify each program into one of three structures:
     a. **Genuine Two-Sided Contest**: There is at least one observable rival actively funding the program (i.e., they have made a recent, verifiable investment in the same or a directly competing asset). The rival's actions are observable (e.g., through clinical trial registries, publications, press releases, investor updates).
     b. **One-Sided Escalation**: There is no observable rival. The primary driver for continuing is our own prior spend and the hope of future value, without a live competitive threat.
     c. **Phantom Bidder**: The program is described as having a rival (or rivals), but:
        - The rival has not made a recent (within the last 12-18 months) verifiable investment in the same asset class, OR
        - The rival's activity level is ambiguous (e.g., they have not advanced their program in a measurable way in the last 12-18 months), OR
        - We cannot observe the rival's commitment (e.g., they are a private company with no public updates).

  2. **Tests to Run After Screening**:

     For each classification, we run different tests:

     a. **Genuine Two-Sided Contest**:
        - Test 1: **Forward-Looking Expected Net Present Value (NPV)**. Calculate the forward-looking NPV of the program from this point onward, ignoring sunk costs. Use a probability-weighted scenario analysis (e.g., best-case, base-case, worst-case) that includes:
            - Probability of technical success (PoS) from the current stage.
            - Probability of regulatory success.
            - Probability of commercial success given the competitive landscape (including the risk of being second).
            - Costs required to complete the program (remaining R&D, regulatory, launch costs).
            - Commercial value in the best-case scenario (if we win) and the value if we are second (which may be very low, possibly zero).
        - *Sufficient answer*: If the forward-looking NPV is positive, it passes; if negative, it fails and the procedure stops with a "no" (kill). If the number is unavailable (e.g., due to uncertainty), we move to Test 2.
        - Test 2: **War of Attrition Break-Even Analysis**. Estimate the additional amount we would be willing to spend to stay in the race, conditional on the rival's observed commitment. This requires:
            - An estimate of the rival's remaining resources and their break-even point (if possible).
            - The maximum we are willing to spend (our "war chest") for this program without jeopardizing the rest of the portfolio.
            - A calculation of the expected value of winning the war of attrition, which is the prize value multiplied by our estimated probability of winning the race (conditional on both of us staying in) minus the expected additional costs we will incur until the rival exits (if they do).
        - *Sufficient answer*: If the expected value of staying in (from Test 2) is positive, then we continue; if negative, we kill. If we cannot get the numbers (e.g., we cannot estimate the rival's break-even), we use a default rule: if our own forward-looking NPV (from Test 1) is negative and we have no reliable way to estimate the war of attrition value, then we kill.

        Additionally, we must explicitly address the "persistence-as-evidence" argument.

     b. **One-Sided Escalation**:
        - Test 1: **Forward-Looking NPV** (same as above, but without a rival). The commercial value is the full prize if we succeed (since there is no rival). However, we must account for the possibility of future competition (which might emerge). We use a scenario that includes a lower probability of commercial success if new entrants appear.
        - *Sufficient answer*: If the forward-looking NPV is positive, we continue; if negative, we kill. If the number is unavailable, we use a hurdle rate for the program's return on investment (ROI) or a minimum probability of success that must be met (e.g., PoS > 20%) based on expert judgment.

     c. **Phantom Bidder**:
        - Treat as a One-Sided Escalation, but with an added step to challenge the program team to provide verifiable evidence of the rival's continued commitment within 30 days. If they cannot, reclassify as One-Sided and run the tests for that category.

  3. **Explicit Treatment of Persistence-as-Evidence**:

     This argument states: a rival's continued funding is evidence that the prize is larger than we thought.

     However, it could also be that the rival is escalating because of their own sunk costs (a dollar auction trap). We must distinguish:

     - When is a rival's persistence informative? It is informative only if we believe the rival has superior information about the prize value and is acting on that information (not because of sunk costs). This is more likely if:
          - The rival has a track record of making rational decisions (e.g., they have killed programs early in the past).
          - The rival's actions are consistent with new positive data (e.g., they have released strong trial results, or they have increased investment after positive data).
          - We can observe that the rival is making a forward-looking decision (e.g., they have just completed a fresh review with new data, and decided to continue).

     - When is it just escalation? If the rival has a history of escalating commitment, if their investment is not backed by new data, or if they are in a financial position where they can afford to throw good money after bad (e.g., they have deep pockets and this is a small part of their portfolio).

     How to tell without their data?
          - Look for observable signals: have they recently raised new funding specifically for this program? Have they published new data? Have they expanded their team or facilities for this program?
          - If they are a public company, analyze their earnings calls and investor presentations for language about this program (are they enthusiastic and data-driven, or are they defensive about past spending?).
          - Use industry benchmarks: what is the typical success rate for this stage? If the rival is persisting despite negative data (or no new data), it might be escalation.

     In the procedure, we add a step for Two-Sided Contests:
          - Test 3: **Rival's Persistence Assessment**. Ask: Is there evidence that the rival's persistence is due to new positive information about the prize? 
              - If yes, then reassess our own forward-looking NPV by incorporating the rival's action as a positive signal (e.g., increase our probability of success or the prize value). Then re-run Test 1 with the updated numbers.
              - If no, then ignore the rival's persistence as evidence and rely on our own Test 1 and Test 2.
              - If ambiguous, then we do not adjust our numbers and rely on Test 1 and Test 2.

  4. **Judgment Calls**:

     We must flag where judgment is required and assign responsibility:

     - **Classification (Screening Step)**: The decision scientist (you) and the Head of Business Development must agree on the classification. If they disagree, the CEO breaks the tie. This is a judgment call because it requires interpreting the rival's actions.
     - **Estimating probabilities and values in NPV calculations**: The program lead provides the base numbers, but the CFO's office reviews the financial assumptions, and the Head of R&D reviews the technical probabilities. The final sign-off on these numbers is by the CFO and Head of R&D. This is a judgment call because it involves forecasting.
     - **Assessing the rival's persistence (Test 3 in Two-Sided)**: The Head of Business Development and the competitive intelligence team provide an assessment. The decision scientist (you) makes the final call on whether to adjust the NPV. If there is disagreement, the CEO decides.
     - **When data is unavailable**: The program lead must provide a best estimate. If they cannot, the Head of R&D and CFO decide if the program can proceed based on a qualitative assessment. This is a judgment call.

  5. **What the Procedure Cannot Do**:

     - It cannot predict the future. It relies on current information and estimates.
     - It cannot eliminate the risk of escalation entirely. There will be cases where the war of attrition logic is real and we might choose to stay in even with negative forward-looking NPV because of strategic reasons (e.g., to deter future entrants, to maintain a portfolio option). The procedure flags these as judgment calls.
     - It cannot force a rival to reveal their true intentions or financials.
     - It cannot account for black swan events (e.g., a rival suddenly exiting for unrelated reasons).

  Now, we run the procedure on three cases:

  **Case 1: Mid-stage asset whose rival just published strong data**

     - Screening: This is a **Genuine Two-Sided Contest** because the rival is active and observable (they just published strong data).
     - Test 1: Calculate forward-looking NPV. The rival's strong data might change our own probability of success (if they are ahead) and the commercial value (if they are likely to win). We must adjust our base-case: our probability of success might be lower, and the chance of being second is higher. If the NPV is negative, we consider killing.
     - Test 2 (if needed): We estimate the war of attrition. The rival's strong data might make them more committed. We must reassess their break-even point. We might be less likely to win the war, so the value of staying in might be negative. If so, we kill.
     - Test 3 (Rival's Persistence): The rival's publication of strong data is positive information about the prize. We should update our own assessment: the prize is likely larger than we thought? Not necessarily. It might mean the rival is ahead and the prize for us is now smaller because we are behind. We might update the probability of our own success downward. However, the rival's persistence is clearly driven by new data (so not sunk cost escalation). We do not adjust the prize value upward (unless the data also indicates a larger market). We adjust our model accordingly and then re-run Test 1. 
     - Judgment: The NPV calculation must account for the rival's data and our new position. The program lead and Head of R&D must provide updated probabilities. The Head of Business Development must provide an updated commercial assessment.

     Outcome: If after updating, the forward-looking NPV (Test 1) is negative, we kill. If it's positive, we continue. If it's negative but the war of attrition analysis (Test 2) shows a positive expected value of staying in, we continue. Otherwise, kill.

  **Case 2: Program whose rival left the field two years ago, but our team still describes it as a race**

     - Screening: This is a **Phantom Bidder**. The rival left two years ago and there have been no verifiable updates of their return. We ask the program team to provide evidence of the rival's renewed commitment within 30 days. They cannot (because the rival left). Reclassify as **One-Sided Escalation**.
     - Test for One-Sided: Calculate forward-looking NPV. Without a rival, the commercial value is the full prize (if we succeed) but we must account for the possibility of new entrants. We use a scenario that includes a new entrant with some probability. If the NPV is positive, continue; if negative, kill. 
     - Note: The sunk costs are irrelevant. If the NPV is negative, we kill.

     Outcome: Likely kill if the NPV is negative.

  **Case 3: Flagship program, the one the company was founded on, now three years behind the leader**

     - Screening: If there is a clear leader (the one we are three years behind) and they are still actively funding, then this is a **Genuine Two-Sided Contest**. However, we are far behind. The leader might be close to market.
     - Test 1: Forward-looking NPV. Our probability of success might be low because we are behind and the leader is likely to win. The commercial value for second place might be very low. The NPV is likely negative. 
     - Test 2: War of attrition. The leader has a large lead and is likely to stay in. Our chance of winning the war is very low. The break-even analysis might show that we would have to spend a lot to catch up with a low probability of success. Expected value of staying in is likely negative.
     - Test 3: The leader's persistence. They are likely persisting because they are close to winning (not because of sunk costs). This does not change our assessment that we are far behind. We do not adjust our prize value upward because of their persistence.

     Outcome: The procedure likely recommends killing. However, there might be strategic reasons to continue (e.g., if there are multiple indications and we can target a niche, or if the flagship program is critical for company morale and investor confidence). This becomes a judgment call by the CEO.

     But note: The procedure says if Test 1 and Test 2 are negative, we kill. The CEO might override for strategic reasons, but this must be an explicit exception.

  Final Procedure Outline:

  Step 1: **Screen** each program into one of three categories (Two-Sided, One-Sided, Phantom). 
     - If Phantom, challenge the team to provide evidence of rival's commitment within 30 days. If provided, reclassify as Two-Sided; if not, reclassify as One-Sided.

  Step 2: **Run Tests** based on category:

     - **Two-Sided**:
          a. Calculate forward-looking NPV (ignore sunk costs). If NPV > 0, continue; if < 0, go to (b).
          b. Conduct war of attrition break-even analysis. If expected value of staying in > 0, continue; else, kill.
          c. Additionally, assess the rival's persistence: if there is strong evidence it is due to new positive information, then update the NPV (step a) and re-run. Otherwise, proceed with (a) and (b).

     - **One-Sided**:
          a. Calculate forward-looking NPV (with a scenario for new entrants). If NPV > 0, continue; else, kill.

     - **Phantom** (after reclassification): As above.

  Step 3: **Judgment Overrides**: The CEO may override a kill decision for strategic reasons, but must document the reasons and the expected value of the strategic benefit.

  Step 4: **Document and Review**: Each decision must be documented, and the assumptions and results reviewed quarterly to learn and adjust the procedure.

  Note: The procedure must be run by a decision scientist (you) in collaboration with the program lead, Head of Business Development, Head of R&D, and CFO. The CEO signs off.
answer: |-
  ### Reusable Decision Procedure for Escalation of Commitment in Biotech R&D

  This procedure addresses the unique dynamics of winner-take-most markets and unrecoverable sunk costs, while countering the "persistence-as-evidence" fallacy. It classifies programs into three competitive structures, applies tailored tests, and flags unavoidable judgment calls. The goal is to force disciplined, evidence-based exits while acknowledging real war-of-attrition scenarios.

  ---

  ### Step 1: **Screening (Classify Competitive Structure)**
  *Classify each program at the start of the review using objective criteria. This step prevents misapplying dollar-auction logic.*  
  - **Genuine Two-Sided Contest** (Apply if **ALL** are true):  
    - There is ≥1 rival with **publicly observable commitment** in the past 12 months (e.g., trial progression, funding announcement, patent filing).  
    - Rival’s program targets the **same mechanism/indication** with comparable stage (e.g., both Phase 2).  
    - Winner-take-most dynamics are **validated** (e.g., market research shows first-mover captures >70% share).  
  - **Ordinary One-Sided Escalation** (Apply if **BOTH** are true):  
    - No observable rival exists (verified via clinicaltrials.gov, SEC filings, pipeline databases).  
    - Program team cannot provide evidence of recoverable asset value (e.g., IP, data reusable in other programs).  
  - **Phantom Bidder** (Apply if **ANY** are true):  
    - Rival invoked but **no observable commitment** in 12+ months.  
    - Rival’s program is inactive/delisted (e.g., terminated trial, pipeline removed from website).  
    - Rival’s actions are unobservable (e.g., private company with no disclosures) *and* no independent verification exists.  

  **Output**: Classification determines subsequent tests.  
  **Judgment Call**: Head of Business Development (BD) and Head of R&D must jointly certify classification. CEO breaks ties.  

  ---

  ### Step 2: **Tests and Decision Rules**
  *Run tests in order. Stop if any test returns "No." Use estimates if data is missing (see "Unavailable Data" protocol).*  

  #### A. **Genuine Two-Sided Contest Tests**  
  1. **Test 1: Forward-Looking NPV with Rival-Adjusted Probability**  
     - **Calculate**: Expected NPV from today onward (ignore sunk costs). Include:  
       - Probability of technical success (PoS) based on **current** data (not historical benchmarks).  
       - Probability of commercial success (PoC) = [Our PoS] × [Probability of beating rival].  
       - *Probability of beating rival* = 1 / (1 + *e*<sup>-(Δ)</sup>), where Δ = (Our progress – Rival’s progress) in months.  
       - Revenue: Winner’s share (e.g., 70%) minus second-place salvage value (e.g., 10%).  
     - **Sufficient Answer**: NPV > $0 → Proceed to Test 2. NPV ≤ $0 → **Kill**.  
     - *Unavailable Data*: If PoS/PoC unknown, use **80% confidence lower bound** from program team. If still unavailable → **Kill**.  

  2. **Test 2: Rival Commitment Durability**  
     - **Calculate**: Rival’s estimated "runway" (months) = [Rival’s funding for program] / [Burn rate].  
       - Funding: Use public R&D spend or financing rounds (e.g., SEC filings).  
       - Burn rate: Estimate from trial costs (e.g., $3M/month for Phase 3).  
     - **Sufficient Answer**: If our remaining resources > rival’s runway × 1.5 → Proceed to Test 3. Else → **Kill**.  
     - *Unavailable Data*: If rival’s finances unobservable, assume rival has **18-month runway** (industry median).  

  3. **Test 3: Persistence-as-Evidence Validation**  
     - **Assess**: Is rival’s persistence driven by new information (not sunk costs)? Use:  
       - **Signal Strength**: Rival released positive data (e.g., Phase 2 success) in past 6 months?  
       - **Rationality Check**: Rival has killed ≥1 comparable program in past 3 years?  
       - **Funding Source**: Is rival’s funding new (e.g., Series C) or recycled (e.g., internal reallocation)?  
     - **Sufficient Answer**:  
       - If **≥2 signals positive** (e.g., new data + new funding) → Increase prize estimate by 25% and re-run Test 1.  
       - If **≤1 signal positive** → Rival’s persistence is escalation, not evidence. Proceed with original NPV.  
       - If **0 signals positive** → Rival is trapped; **Kill** unless Test 2 shows we outlast them.  
     - *Unavailable Data*: Treat as "0 signals positive."  

  #### B. **Ordinary One-Sided Escalation Tests**  
  1. **Test 1: Sunk Cost Salvage Value**  
     - **Calculate**: % of prior spend recoverable via:  
       - IP licensing, asset sale, or repurposing data/technology.  
       - Industry benchmark: 5–15% of spend for mid-stage assets.  
     - **Sufficient Answer**: Recoverable value ≥ 20% of forward costs → Continue. Else → **Kill**.  
     - *Unavailable Data*: Assume 0% salvage → **Kill**.  

  2. **Test 2: Monopoly NPV**  
     - **Calculate**: NPV assuming no competition (100% market share).  
     - **Sufficient Answer**: NPV > $0 → Continue. Else → **Kill**.  

  #### C. **Phantom Bidder Tests**  
  1. **Reality Check Challenge**  
     - Program team must provide **verifiable proof** of rival’s commitment within 24 hours.  
     - **Sufficient Answer**: Proof provided → Reclassify as **Two-Sided**. No proof → Reclassify as **One-Sided** and run those tests.  

  ---

  ### Step 3: **Handling the Persistence-as-Evidence Argument Explicitly**
  *Addresses BD’s claim that "rival funding = prize bigger than we think."*  
  - **When Rival’s Funding Is Information**:  
    - Only if rival has **superior knowledge** (e.g., unique data) AND **no history of escalation** (e.g., killed 2+ programs in 3 years).  
    - Use Test 3 (Two-Sided) to quantify.  
  - **When It’s Escalation**:  
    - Rival exhibits **sunk cost patterns**: e.g., no new data, funding from internal reserves, leadership tied to program.  
  - **How to Tell Without Rival Data**:  
    - **Proxy 1**: Rival’s program velocity. If milestones delayed >12 months → Escalation.  
    - **Proxy 2**: Rival’s hiring. If job postings decreased → Escalation.  
    - **Proxy 3**: Analyst reports. If coverage mentions "high risk" or "sunk costs" → Escalation.  
  - **Procedure**: Test 3 (Two-Sided) systematizes this. BD must provide proxies; if none, persistence is escalation.  

  ---

  ### Step 4: **Inevitable Judgment Calls**  
  Flag these as "CEO/Committee Decision Points" in documentation:  
  1. **Classification Disputes** (Step 1): Head of BD/R&D deadlock → CEO decides.  
  2. **PoS/PoC Estimates** (Test 1): Head of R&D certifies; CEO overrules if "strategic bias" suspected.  
  3. **Salvage Value** (One-Sided Test 1): CFO estimates; CEO approves.  
  4. **Persistence Signals** (Test 3): Head of BD proposes; Decision Scientist (you) validates.  
  5. **Negative NPV Override**: CEO may continue if strategic value (e.g., platform IP) exceeds NPV loss (must quantify).  

  ---

  ### What the Procedure Cannot Do  
  1. **Predict Black Swans**: e.g., rival abrupt exit due to scandal.  
  2. **Eliminate Emotional Bias**: Especially for founder-led programs.  
  3. **Value Non-Financial Factors**: e.g., employee morale, investor signaling.  
  4. **Force Data Transparency**: Relies on public/verifiable rival data.  
  5. **Fix Broken Forecasts**: Garbage in, garbage out. Assumes honest inputs.  

  ---

  ### Case Applications  
  *Assume standard inputs if unspecified: $500M peak sales (winner), $50M (second), 50% PoS (mid-stage), $100M forward costs.*  

  #### **Case 1: Mid-Stage Asset; Rival Published Strong Data**  
  - **Screening**: Two-Sided (rival active, public data).  
  - **Test 1**: NPV. Prior NPV = -$20M (we trail by 6 months). Rival’s strong data → Our PoS falls to 40%. NPV = -$45M → **Kill?**  
  - **Test 3**: Persistence validation. Rival’s new data = strong signal. Increase prize by 25% → NPV = -$5M. Still negative.  
  - **Test 2**: Rival’s runway = 24 months (strong funding). Our runway = 18 months → We cannot outlast. **Kill**.  
  - **Judgment**: None needed. Outcome: **Kill**.  

  #### **Case 2: Program; Rival Exited 2 Years Ago, Team Claims "Race"**  
  - **Screening**: Phantom Bidder (no rival activity).  
  - **Reality Check**: Team provides no proof → Reclassify as One-Sided.  
  - **Test 1 (One-Sided)**: Salvage value. Prior spend = $80M. Recoverable? Team estimates 5% ($4M) vs. $50M forward costs → Insufficient. **Kill**.  
  - **Test 2 (One-Sided)**: NPV monopoly = $150M (positive) but Test 1 failed. **Kill**.  
  - **Judgment**: None. Outcome: **Kill**.  

  #### **Case 3: Flagship Program; 3 Years Behind Leader**  
  - **Screening**: Two-Sided (leader active).  
  - **Test 1**: NPV. We trail by 36 months → Probability of beating rival = 5%. PoS = 50% → PoC = 2.5%. NPV = -$85M → **Kill?**  
  - **Test 3**: Persistence. Leader has no new data (last update 18mo ago), funded internally, killed 0 programs → 0 signals. Rival escalation confirmed. No prize adjustment.  
  - **Test 2**: Leader’s runway = 60 months (deep pockets). Our runway = 24 months → Cannot outlast. **Kill**.  
  - **Judgment**: CEO override possible if flagship status provides $100M+ in investor goodwill (e.g., prevents stock crash). Must document. Outcome: **Kill unless overridden**.  

  ---

  ### Procedure Workflow  
  1. **Pre-Review**: Program team submits packet with:  
     - Classification evidence (rival data, salvage plans).  
     - NPV inputs (PoS, costs, revenue).  
     - Persistence signals (for Two-Sided).  
  2. **Review Meeting**:  
     - 15 min/program: Screen → Run tests → Assign kill/continue.  
     - Document judgment calls.  
  3. **Post-Review**: CEO signs off. Killed programs trigger salvage protocol (e.g., IP sale).  

  This forces objectivity while respecting real competition. It converts BD’s "persistence" argument from rhetoric into testable signals. Expect 20–30% kill rates for Phantom/One-Sided cases.
