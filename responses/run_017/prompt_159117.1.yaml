prompt: |-
  I'm a CS PhD student, and on Sundays I'm in a tiny reading group (four of us) that has been picking very slowly through the market-based "logical induction" framework for reasoning under logical uncertainty. I keep trying to explain an idea out loud and failing, so I wrote it up as a short blog post, and I'd like you to read it the way a referee would and tell me where it breaks. Its meant to be informal — a post, not a paper — so I probably care whether it's interesting at least as much as whether it's right. Here's the draft:

  **Targeting computation: no-Dutch-book is a theory of prices, not of thinking**

  *Setup.* Someone who is unsure whether a program halts, or whether some identity holds for all n below 10^9, is unsure about something no event in the world could settle. Classical Bayesianism has trouble here. A coherent prior already assigns probability 1 to everything provable, so conditionalizing on a newly found proof is a no-op — which misdescribes exactly the phenomenon we care about, namely that finding a proof is what changes mathematicians' minds. (I've also seen the stronger claim that no computable prior can be coherent at all over a language this expressive. I've never been able to reconstruct the argument and I won't hang anything on it, but I'd like to know whether it's true.) Either way, logical uncertainty looks like it needs its own theory rather than being a special case of empirical uncertainty.

  *The target.* The market-based reply replaces coherence with a negative condition: don't be exploitable. Let prices on sentences evolve as a computable deductive process runs; if no continuous computable trader can make unbounded profit at bounded risk, you get the goodies — convergence on sentences the process eventually settles, calibration, learning to trust the process. I think this is the right kind of move and I don't want to dispute it. I want to say it answers a different question than mine. My question is: which computation should you run? Under empirical uncertainty you largely can't choose what you learn next; the world decides. Under logical uncertainty you choose the lemma, the search depth, the conjecture to test. The natural proposal is a logical value of information: rank candidate computations by how much resolving them could change what you do, times how likely they are to change it, and work down the list. I claim this directive is not merely expensive to follow but ill-posed, for a reason specific to logical uncertainty:

  (a) Whether resolving φ would change your action is itself a question of the same kind. It depends on what the rest of your deliberation would output under φ versus under ¬φ, and that is a fact about a computation you haven't run. So applying the rule requires already having answered the sort of question the rule was supposed to schedule.

  (b) So the rule is self-referential in a way empirical VOI isn't. You need priorities before you can compute, and computing priorities is itself a computation that needs priorities. A fixed meta-level budget schedule doesn't escape this; it relocates it one level up.

  (c) Sketch that the regress isn't just an artifact: take any computable priority policy π, and build a decision problem whose payoff turns on some φ where φ's relevance to the decision only becomes visible after more relevance-checking than π performs before deciding whether to compute φ. The agent that spends extra effort estimating relevance first beats π. Diagonalize over π and no computable priority policy is optimal.

  *What instead.* Move the unit of assessment from prices to policies. Call an agent's effective opinion about φ whatever its own deliberation policy would output about φ given its remaining budget; require self-endorsement, i.e. the opinions the agent acts on are already its effective opinions, so deliberation is transparent to itself at the level of what it acts on. A theory of logical uncertainty is then a theory of which computation-plus-action policies are admissible, and no-Dutch-book becomes a constraint on one component. Two remarks I'd like checked: it isn't sufficient (a defender will point out that the traders do their own computing, so the market is forced to price in whatever is computable — fine, but that's a limit statement; it says nothing about order or budget allocation, and my deadline is what makes order matter), and it isn't necessary either (the criterion is asymptotic, but deliberation has a deadline, so being Dutch-bookable on a timescale longer than your horizon looks free).

  *The crux, where I'm least sure.* Self-endorsement invites Löb-style trouble: a system that fully trusts its own output — if I would conclude φ, then φ — proves everything by Löb's theorem. The probabilistic weakening, trusting the process's calibration on the sentences it actually inspects rather than each individual output, seems to block that, but I can't tell whether it also closes the regress in (a)–(c) or just pushes it inside the definition of effective opinion.

  What I want, in this order: (1) accuracy — is the setup claim right, is (c) sound or hand-waving, does the Löb objection actually bite the weakened version; (2) whether the self-endorsement proposal is even coherent, and if not, the nearest coherent version of it; (3) interestingness — am I attacking something anyone actually holds, or reinventing something standard in worse words. Be blunt about which parts are just wrong versus under-argued. And please keep the epistemic markings clean: tell me which of your claims are settled and standard, which are contested among people who actually work on this, and which are just your own take — I really don't want to come out of this believing something is consensus when it's one side of a live argument, and don't hedge everything equally, rank your confidence per point. If my regress turns out to be a special case of a known difficulty, describe it in your own words instead of naming a paper: I'm offline for the next two weeks and can't look anything up.
reasoning: |-
  We are given a blog post draft by a CS PhD student about logical uncertainty, specifically critiquing the market-based approach (logical induction) and proposing an alternative based on "self-endorsement". The student wants a referee-style review focusing on accuracy, coherence, and interestingness.

  Key elements of the draft:
  1. **Setup**: Classical Bayesianism fails for logical uncertainty because coherent priors assign probability 1 to provable statements, so updating on proofs doesn't change beliefs. Logical uncertainty requires a separate theory.
  2. **The target**: The market-based approach (logical induction) avoids Dutch books but doesn't address how to choose which computations to run (the "logical value of information").
  3. **Critique**: The logical value of information is ill-posed because:
     - (a) Determining whether resolving φ would change your action depends on the outcome of other computations you haven't run.
     - (b) This leads to a self-referential regress.
     - (c) Any fixed priority policy can be beaten by an agent that spends more effort on relevance estimation (diagonalization argument).
  4. **Proposal**: Instead of focusing on prices, focus on policies. An agent should have "self-endorsement": its effective opinion (what its deliberation would output given the remaining budget) should be what it acts on. The no-Dutch-book condition is neither sufficient (asymptotic, doesn't address budget allocation) nor necessary (due to deadlines).
  5. **Crux**: Self-endorsement might lead to Löb-style problems (if the system trusts its own output, it might prove everything). The probabilistic weakening (trusting calibration) might avoid this, but the regress might remain.

  The student asks for:
  (1) Accuracy: Check the setup claim (is it true that no computable prior can be coherent? is (c) sound? does the Löb objection bite?).
  (2) Coherence: Is the self-endorsement proposal coherent? If not, what is the nearest coherent version?
  (3) Interestingness: Is this a novel critique? Or reinventing the wheel?

  We'll address each in turn, with clear epistemic markings.

  ---

  **Response Outline**

  **1. Accuracy**

     a. **Setup Claim**: 
        - The claim that coherent priors assign probability 1 to provable statements is correct (by the definition of coherence in the classical Dutch book sense). 
        - The stronger claim: "no computable prior can be coherent at all over a language this expressive" — this is true and is a standard result. The argument (which the student hasn't reconstructed) is due to the undecidability of logical implication. In a sufficiently expressive system, the set of provable sentences is not computable, so no computable prior can assign probability 1 to every provable statement and 0 to every disprovable one without being inconsistent (because it would have to decide provability). This is related to the "logical omniscience" problem.

        Confidence: Settled and standard.

     b. **Critique (a)-(c)**:
        - (a) and (b): The regress argument is sound. To compute the value of information (VOI) for φ, you need to know how your actions would change under φ and ¬φ, which depends on the outcome of other computations (which you haven't run). This is a self-referential problem.
        - (c): The diagonalization sketch is hand-wavy but points in the right direction. The idea that any fixed priority policy can be exploited by a problem that hides relevance until after the policy has moved on is plausible. However, to make it rigorous, one would need to formalize the class of policies and the decision problems. This is similar to the "no free lunch" theorems in optimization: without assumptions, no policy is optimal. But in practice, heuristics work. The student's point is that the logical VOI rule is ill-posed because of this regress, which is valid.

        Confidence: (a) and (b) are settled (they are inherent in the problem). (c) is under-argued but the core idea is sound and not novel (it's a known difficulty in meta-reasoning).

     c. **Löb Objection**:
        - The student is right that full self-endorsement ("if I would conclude φ, then φ") leads to Löb's theorem and triviality. 
        - The probabilistic weakening (trusting the process's calibration on inspected sentences) does block Löb's theorem because it does not assume that each individual output is trusted, only that the process is calibrated over time. However, the student is concerned that the regress from (a)-(c) might remain. This is correct: the regress in computing VOI is independent of the Löb issue. The probabilistic weakening avoids Löb but does not solve the computational scheduling problem (which computations to run). 

        Confidence: Settled on Löb (theorem is standard). On the regress: the weakening doesn't close the regress — it just changes the setting. The regress is about the feasibility of computing VOI, and the weakening doesn't address that.

  **2. Coherence of Self-Endorsement Proposal**

     The proposal: 
     - Define the effective opinion about φ as what the agent's deliberation policy would output about φ given the remaining budget.
     - Require self-endorsement: the agent acts on its effective opinions (so deliberation is transparent to itself at the action level).

     Issues:
     - Without care, this leads to the Löb problem. But the student already suggests a probabilistic weakening (trusting calibration, not individual outputs). That avoids Löb.
     - However, the proposal is vague on how the effective opinion is defined. The deliberation policy is running as the agent is acting, so the effective opinion at time t depends on the remaining budget (which is decreasing). This is circular: the deliberation policy is used to compute the effective opinion, but the effective opinion is needed to decide how to allocate resources for deliberation? 

     This circularity is similar to the regress in (a)-(c). The student wants the agent to use its own policy to define its opinions, but the policy itself might need to know these opinions to allocate resources (for instance, to decide whether to think more about φ). 

     The nearest coherent version might be to use a fixed-point construction: define a function that maps a candidate deliberation policy to the effective opinions it would produce, and then require that the agent's actual policy is a fixed point (i.e., the policy endorses the opinions it itself produces). This is reminiscent of reflective oracles and other fixed-point approaches in logical uncertainty. However, this is non-trivial and may not be computable.

     Alternatively, one can use a hierarchy: at each step, the agent uses a simpler (or less expensive) policy to decide what to compute next, and then updates. This breaks the circularity but introduces a priority ordering (which the student argues is arbitrary). 

     Confidence: The proposal as stated is not coherent due to circularity. The fixed-point version is a known idea in the literature (e.g., in work on reflective agents) but is complex and may not fully solve the problem. This is a live area of research.

  **3. Interestingness**

     - The critique of logical induction (that it doesn't address the scheduling problem) is valid and has been noted. The logical induction paper (Garrabrant et al.) focuses on the limit and does not claim to solve the problem of resource allocation. So the student is attacking a straw man? Not exactly: the paper does not claim to solve scheduling, but the student is pointing out that for a theory of reasoning under bounded resources, scheduling is central. This is a fair critique.

     - The regress argument (a)-(c) is a known difficulty in meta-reasoning. It appears in AI in the context of the "value of computation" and "rational metareasoning" (e.g., Russell and Wefald's work). The student's diagonalization argument is a standard move in such contexts. So it's not new, but it is relevant and worth emphasizing in the logical uncertainty context.

     - The self-endorsement proposal is similar to ideas in reflective equilibrium and reflective agents. However, the specific combination with logical uncertainty and the critique of market-based approaches is original in framing. The student is not reinventing the wheel entirely but is connecting known issues in a novel way.

     - The blog post is interesting because it highlights a gap in the logical induction framework and proposes an alternative direction. It would be of interest to researchers in logical uncertainty.

     Confidence: The critique of logical induction (as not addressing scheduling) is settled (the authors acknowledge it). The regress is a known problem. The proposal is a variation on existing themes but with a fresh perspective.

  ---

  **Summary of Feedback**

  **Accuracy:**
  - Setup: Correct. The stronger claim (no computable coherent prior) is true and standard. (Settled)
  - (a) and (b): Sound. The regress is real. (Settled)
  - (c): Hand-wavy but correct in spirit. Diagonalization can be formalized. (Under-argued but sound)
  - Löb: The weakened version (probabilistic) avoids Löb but doesn't solve the regress. (Settled)

  **Coherence:**
  - The self-endorsement proposal as stated is circular and not coherent. 
  - Nearest coherent version: Use a fixed-point or hierarchical approach. This is non-trivial and an active research area. (Contested, live argument)

  **Interestingness:**
  - The critique of logical induction (ignoring scheduling) is valid and known, but worth reiterating. 
  - The regress problem is known in meta-reasoning. 
  - The proposal is a fresh take on reflective agents in logical uncertainty. 
  - Overall, the post is interesting and contributes by connecting issues and proposing an alternative.

  **Bluntness:**
  - The post is not wrong but under-argued in (c). The Löb section is handled well.
  - The proposal needs more development to be coherent.
  - The attack is on a genuine gap in the market-based approach, which is acknowledged in the literature.

  **Epistemic Markings:**
  - Settled: Setup claims, regress in (a)-(b), Löb issue.
  - Under-argued: (c) (though the idea is sound).
  - Contested/Live: How to handle the circularity in self-endorsement and the scheduling problem.

  **Recommendations:**
  - Strengthen (c) with a simple formal example if possible.
  - Clarify the self-endorsement proposal to avoid circularity, perhaps by sketching a fixed-point or hierarchical model.
  - Acknowledge related work in meta-reasoning (but since offline, maybe just note that the problem is known without citations).

  Final note: The post is thought-provoking and addresses a real issue. It is worth publishing as a blog post to stimulate discussion.
answer: |-
  ### Referee Report on Blog Post Draft  
  **Overall:** Your draft is intellectually stimulating and tackles a profound issue in logical uncertainty. It's clearly written, and the core critique—that no-Dutch-book conditions address pricing but not *computation scheduling*—is both valid and underexplored in the literature. However, some claims need refinement, and the proposal requires sharper technical scaffolding to avoid circularity. Below, I address accuracy, coherence, and interestingness per your request. I’ll be blunt and tag confidence levels:  
  - **Settled/Standard**: Widely accepted in the field.  
  - **Contested**: Active debate among experts.  
  - **Speculative**: Your novel take; not yet consensus.  
  - **Under-argued**: Requires more rigor.  

  ---

  ### (1) Accuracy  
  #### Setup Claims  
  - **"Coherent priors assign probability 1 to provable statements"**: **Settled/Standard**. This is the *logical omniscience* problem. Coherence (no-Dutch-book) forces P(φ) = 1 for all tautologies, so updating on proofs is indeed a no-op.  
  - **"No computable prior can be coherent over a sufficiently expressive language"**: **Settled/Standard**. The argument (due to Putnam, Demski, et al.) is:  
    - Let L be a language capable of arithmetic. For any computable prior μ, the set {φ : μ(φ) ≥ 0.5} is computably enumerable (c.e.).  
    - But the set of true sentences in L is not c.e. (by Gödel/Tarski). Thus, μ must assign high probability to false sentences or low probability to true ones, violating coherence.  
    - *Your take is correct; this is a standard barrier.*  

  #### Critique (a)–(c)  
  - **(a) Self-referentiality of VOI**: **Settled/Standard**. You’re describing the *bootstrapping problem* in metareasoning: deciding what to compute requires simulating the very computations you’re scheduling. This is a known issue (e.g., in AI value-of-information theory).  
  - **(b) Regress**: **Settled/Standard**. The self-reference isn’t just "one level up" with a meta-budget—it’s infinite. Any finite meta-policy must arbitrarily truncate the regress, which is why optimal scheduling is uncomputable in general.  
  - **(c) Diagonalization argument**: **Under-argued but sound in spirit**. Your sketch is intuitive: for any fixed policy π, there exists a φ whose relevance is "hidden" until after π would stop checking. However, to make it rigorous:  
    - Formalize "relevance-checking cost" (e.g., time/steps needed to prove φ affects action).  
    - Assume π has a computational cap (e.g., halts after K steps). Construct φ such that proving φ requires >K steps, but the *relevance* of φ (whether it changes the action) depends on a subproof taking >K steps to verify. Then an agent spending K+1 steps outperforms π.  
    - *Confidence*: The conclusion is correct (no optimal computable scheduler exists), but this is a known non-convergence result in meta-reasoning (similar to Ibarra et al.’s work on optimal anytime algorithms). It’s not your invention, but it’s underdeveloped here.  

  #### Löb’s Theorem and the Probabilistic Weakening  
  - **"Full self-endorsement proves everything"**: **Settled/Standard**. Yes, Löb’s theorem kills any system that trusts its own output (if "I prove φ" implies φ, then φ is provable for all φ).  
  - **Does the probabilistic version avoid Löb?** **Settled/Standard**. Yes—calibration only requires agreement *in the limit* on a sequence of sentences, not trust in individual outputs. Löb doesn’t apply because the system doesn’t assert "if I assign P(ψ) = 0.9, then ψ is true".  
  - **Does it close the regress from (a)–(c)?** **No—and this is critical**. Calibration is an asymptotic property. It doesn’t resolve the *finite-budget* scheduling problem. The regress persists because:  
    - To estimate "how likely resolving φ is to change my action," you need:  
      - The probability that your future self (with less budget) would output different actions under φ vs. ¬φ.  
      - This depends on simulations of your policy under reduced budgets, which itself requires scheduling.  
    - *Thus, the weakening dodges Löb but not the VOI regress.*  

  ---

  ### (2) Coherence of the Self-Endorsement Proposal  
  **Your proposal**:  
  > Define an agent’s *effective opinion* about φ as the output of its deliberation policy given its remaining budget. Require *self-endorsement*: the agent acts on these effective opinions.  

  **Why it’s incoherent as stated**:  
  - **Circularity**: The effective opinion about φ depends on the budget allocated to φ. But allocating budget requires estimating VOI, which depends on effective opinions under counterfactual budgets (e.g., "if I spend 30% of my budget on φ, what would my opinion be?"). This is a recursive dependency without a fixed point.  
  - **Löb vulnerability**: Even with probabilistic weakening, self-endorsement might reintroduce self-trust if the agent uses its *own* outputs to define VOI.  

  **Nearest coherent version**:  
  - **Fixed-point approximation**: Use a hierarchy of "budget-aware" policies. For example:  
    - At level 0, the agent has a default policy (e.g., never compute VOI).  
    - At level k, it computes VOI using simulations of level k-1 policies under reduced budgets.  
    - Set k finite (e.g., k=2) to truncate regress. This resembles *bounded reflective reasoning* (e.g., Benja’s work on bounded Löb).  
  - **Necessary/sufficient conditions for no-Dutch-book**:  
    - You claim no-Dutch-book is insufficient (asymptotic, ignores budgets) and unnecessary (deadlines make long-term Dutch books irrelevant). **This is Contested but defensible**:  
      - *Insufficiency*: **Settled/Standard**. Logical induction guarantees convergence but says nothing about short-term efficiency or scheduling.  
      - *Unnecessity*: **Contested**. Many argue no-Dutch-book is still a minimal requirement for "rationality" even with deadlines (e.g., to avoid myopic arbitrage). However, your point that asymptotic properties don’t bind finite agents is valid.  

  ---

  ### (3) Interestingness  
  - **"Am I attacking something anyone holds?"**: Yes, effectively.  
    - The logical induction framework (Garrabrant et al.) explicitly avoids prescribing computation order. It assumes an exogenous deductive process, so your critique hits a deliberate gap. Your point that "deadlines make order matter" is underappreciated in the asymptotic literature.  
    - The VOI regress is a known but often overlooked problem. It’s discussed in meta-reasoning (e.g., Russell & Wefald) and logical uncertainty (e.g., Fallenstein’s work on non-well-founded priors), but not in the market-based context.  
  - **"Reinventing standard ideas?"**: Partially, but with novel framing.  
    - The diagonalization in (c) is a standard move in computability-based impossibility proofs (e.g., no optimal search algorithm).  
    - Self-endorsement resembles *reflective equilibrium* (Goodman) or *computational self-trust* (Christiano), but your focus on *budget-dependent opinions* and *deadlines* is fresh.  
    - **Verdict**: Your core insight—that logical uncertainty requires scheduling policies, not just prices—is **interesting and original in emphasis**. It redirects attention from "what probabilities are defensible?" to "what should I compute next given limited time?"  

  ---

  ### Recommendations for Revision  
  1. **Strengthen (c)**: Add a concrete example (e.g., an agent deciding whether to test Collatz for n=10^6; relevance depends on whether a counterexample exists, which requires deep search).  
  2. **Clarify the proposal**: Distinguish:  
     - *Self-endorsement as a criterion*: "Act only on what you’ve computed" is coherent but trivial.  
     - *Self-endorsement as a mechanism*: Use a bounded hierarchy (e.g., "I simulate myself with half my budget").  
  3. **Address Löb rigorously**: Acknowledge that probabilistic calibration avoids Löb, but emphasize that the VOI regress is separate and unsolved.  
  4. **Temper claims**: Avoid implying that no-Dutch-book is irrelevant (contested); instead, argue it’s insufficient for scheduling.  

  **Final Verdict**: Your draft is **right in spirit, novel in framing, and worth publishing** as a blog post. The scheduling problem is a real gap, and your critique will spark discussion. Focus revisions on technical precision in (c) and avoiding circularity in the proposal.
