          - If Voter 2's ballot is drawn: C is eliminated (because the drawn ballot is B>C>A, so last is A? 
               But wait, the rule says: on the drawn ballot, the last is strike out.
               Voter2's ballot: B>C>A, so last is A -> eliminated.
               Then B vs C: 
                   Voter1: B, Voter2: B, Voter3: C -> B wins.
          - If Voter 3's ballot is drawn (now A>C>B): last is B -> eliminated.
               Then A vs C: 
                   Voter1: A, Voter2: C, Voter3: A -> A wins.
          So outcomes:
               A wins when drawn from V1 or V3 (2/3)
               B wins when drawn from V2 (1/3)
          Expected utility for Voter3: (2/3)*2 + (1/3)*0 = 4/3 > 1.

     So Voter3 benefits by lying.

   The strategic logic: 
     By ranking A first instead of C, Voter3 ensures that if their own ballot is drawn (which happens with probability 1/3), they can prevent the elimination of A and instead eliminate B, which then allows A to win the majority vote. In the other cases, they still get A or B, and since they value A so highly, the gamble pays off.

   This example with 3 voters. For 40 voters, the principle is the same, but the probability of a particular ballot being drawn is low, so the opportunity to manipulate might be small, but it is theoretically there.

