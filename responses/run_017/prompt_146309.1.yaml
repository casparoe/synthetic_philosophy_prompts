prompt: |-
  I spent last night arguing with a friend about whether culture really evolves in a Darwinian way, and the argument ended up turning on her track record rather than on theory, so I want to cash it out on a case she has not ruled on. Her verdicts so far. Memes: a slang expression that sweeps a school and is dead within a year; a joke that is still recognisably the same joke after twenty retellings; a family recipe that gets tweaked each generation; a dance picked up from a clip and performed at a wedding; a chain message that people forward unaltered because it threatens bad luck if you break the chain. Not memes: flinching at a sudden noise; knowing that kettles are hot; a mnemonic one person invented and never passed to anyone; eye colour; and a compliance clause that every employee in a firm is required to paste into documents verbatim, with no variation permitted, which she classed as imposition rather than selection.

  The new case, which I will call a schema lineage. In a large online community there is a story shape: first person, a mundane setup, one detail withheld, a short final line that reinterprets the rest. Nobody copies a token. What each poster inherits is a generative recipe, and every instance is built from scratch, by a different person, out of that recipe plus their own material. Two further features matter. Over fifteen years the recipe has shifted in ways that reliably increase how far an instance travels: the setups got shorter, the withheld detail moved later, the last line settled into a fixed rhythm. And for the last three years most instances have in fact been written by a language model prompted with a handful of earlier ones, while what anyone actually reads is whatever a ranking system puts in front of them; people read, react, and prompt again. So nothing is copied as a token, no human reproduces anything, the variation is machine-generated, and the sorting is done by an engineered filter — and yet the recipe has accumulated a genuine fit to that filter.

  Would she say this is a meme, that is, a case of Darwinian cultural evolution? More usefully: what are the two or three rules that fit her old verdicts about equally well — something like heritable variation plus differential uptake being sufficient, a replicator requiring lineages of faithfully copied tokens, a variant's success needing to be its own rather than its host's — what does each predict here, which one do you think she is actually running, and why? Which of her old verdicts is the closest analogue, and what exactly is different about it. And where the rules that agree here would still diverge elsewhere, name the single variant of this case that would tell them apart.
reasoning: |-
  Hmm, the user wants me to analyze whether a particular cultural phenomenon qualifies as a Darwinian meme according to their friend's classification system. They've described several examples that their friend has already categorized as memes or not memes, and they want me to apply that same logic to this new "schema lineage" case involving an evolving story template in an online community.

  Looking at their friend's previous classifications, I can see a pattern emerging. Memes seem to be cultural elements that spread through copying with variation: slang expressions that sweep through a school, family recipes that get tweaked, dances learned from videos. Non-memes include innate behaviors like flinching at loud noises, genetic traits like eye color, or rigid imposed rules like the compliance clause that must be copied verbatim.

  The new case involves a story template that evolves over time. People aren't copying specific stories word-for-word, but rather using a generative recipe to create new stories. Interestingly, the recipe itself has changed over time to become more successful at spreading - setups got shorter, withholding details happens later, and the punchline developed a fixed rhythm. Recently, language models have been generating most instances based on prompts, and a ranking system determines what gets seen.

  This creates an interesting tension. On one hand, nothing is being directly copied as a token - each story is generated from scratch. On the other hand, the underlying pattern is clearly evolving to become better adapted to the environment (the ranking system). The variation is machine-generated, and selection is algorithmically enforced.

  To answer the user's question, I need to identify what core principles their friend uses to distinguish memes from non-memes. From the examples given, it seems like their friend requires some form of heritable variation and differential success, but with important nuances. The key question is whether the variation and selection need to operate through human cognition and voluntary sharing.

  I'll need to analyze how different interpretations of their friend's rules would apply to this schema lineage case. I should also identify which of their friend's previous verdicts is most analogous to this situation, and what critical test case would distinguish between competing interpretations of their friend's classification system.
answer: |-
  Based on your friend's established verdicts, I'd predict **she would likely classify this schema lineage as *not* a Darwinian meme**, despite the evolution of the recipe. Here's the breakdown:

  ### Your Friend's Implied Rules (Inferred from Verdicts)
  1.  **Rule 1 (Strong Replicator Requirement):** A meme requires **lineages of faithfully copied tokens** or discrete units. Variation occurs *during* copying events performed by agents (humans). Mere similarity in pattern or outcome, without token copying, isn't sufficient. *This seems strongest.*
  2.  **Rule 2 (Agent-Mediated Selection):** The **differential success (uptake/spread) must be driven by human cognitive/behavioural choices** (liking, sharing, remembering, adapting). Selection imposed by external systems (algorithms, mandatory rules) doesn't count as Darwinian cultural evolution. *This is also strong.*
  3.  **Rule 3 (Success Attribution):** The **variant's success must be attributable to its *own* properties** as perceived/acted upon by humans, not solely to the success or imposed will of its host/creator/enforcer. *This reinforces Rule 2.*

  ### How the Rules Apply to the Schema Lineage Case
  *   **Rule 1 (Token Copying):** **Fails.** No token is copied. Each story is generated *de novo* from the abstract recipe + unique material. The recipe itself shifts, but this shift isn't achieved by copying a modified recipe token; it's an emergent statistical pattern from the machine-generated outputs filtered by the algorithm. There's no lineage of copied recipe *tokens*.
  *   **Rule 2 (Agent-Mediated Selection):** **Fails.** Human readers react, but the *critical selection filter* determining differential success (what gets seen, what feeds the next prompt) is the engineered ranking algorithm. Humans react to what the algorithm *gives* them; they aren't actively selecting *between* variants for reproduction based on the recipe properties. The algorithm imposes fitness.
  *   **Rule 3 (Success Attribution):** **Fails (or Ambiguous).** The recipe's "fitness" increase is primarily an adaptation *to the algorithm*, not to human preference or cognition driving voluntary sharing. Human reaction is secondary to the algorithmic filter. Success is imposed by the system, not earned via properties appealing to human agents.

  ### Prediction & Reasoning
  *   **Her Likely Verdict:** **Not a meme.** The core reason is the **absence of token copying lineages (Rule 1)** and the **dominance of algorithmic imposition over agent-mediated selection (Rule 2)**. This aligns perfectly with her verdict on the "compliance clause" (imposition, not selection) and distinguishes it from things like the family recipe (token copying with variation during human transmission) or the dance (token copying from clip to performance).
  *   **Her Probable Rule:** **Rule 1 (Strong Replicator Requirement)** seems the most fundamental driver, reinforced by Rule 2. The "imposition vs selection" distinction in the compliance clause case strongly points to Rule 1 & 2 being key. The recipe shift here is seen as an imposed algorithmic outcome, not the result of replicators (copied tokens) being selected.

  ### Closest Analogue & Key Difference
  *   **Closest Analogue:** **Compliance Clause.** Both involve:
      *   No meaningful variation (recipe shift is algorithmic, clause is fixed).
      *   "Reproduction" is enforced/imposed (algorithmic filter, corporate rule).
      *   Success is not due to inherent properties driving agent choice, but external imposition.
  *   **Key Difference:** The schema lineage *appears* to evolve towards fitness, while the compliance clause is static. However, your friend would likely argue this "evolution" is an illusion within the imposed system, achieved without replicators or agent choice, akin to an algorithm optimizing a parameter, not Darwinian selection on cultural variants.

  ### The Crucial Variant to Test the Rules
  To distinguish between Rule 1 (Token Copying essential) and Rule 2 (Agent-Mediated Selection essential) where they *agree* here (both say "Not a meme"), create this variant:

  *   **The "Human Curation" Variant:** Everything is the same *except* the ranking algorithm is removed. Instead, **human community members actively curate a "Best Of" collection each week.** They explicitly select instances *they* find most successful/funny/impactful based on the recipe's execution. New human writers consciously study *this curated collection* to understand the "winning" recipe and generate their *own* new instances from scratch (no copying tokens). The recipe evolves based on *human curation and emulation of the pattern*, not an algorithm.

  **How the Rules Diverge:**
  *   **Rule 1 (Token Copying):** Still says **Not a meme.** No token copying occurred. Writers generated from scratch based on an abstracted pattern gleaned from curated examples. It's pattern emulation, not replication.
  *   **Rule 2 (Agent-Mediated Selection):** Likely says **It *is* a meme now.** The differential success is driven by *human choice* in curation. New writers are *adapting their generative process* based on observing which patterns were *selected by humans*. While no tokens are copied, the *abstract pattern* is being inherited and varied based on human selection pressure. Human agency drives the evolution. (This aligns more with the "family recipe tweak" – the "token" is the abstract recipe concept, varied upon "inheritance"/emulation).

  This variant forces the choice: Is faithful token copying *necessary* (Rule 1), or is the core mechanism agent-mediated selection on heritable information, even if abstract (Rule 2)? Her verdict on this variant would reveal her deepest commitment. Based on her focus on copying tokens (joke retelling, dance performance, recipe tweak vs. compliance clause) and dismissal of non-copied patterns (mnemonic, eye colour), **Rule 1 (Token Copying) seems her most fundamental criterion.** Therefore, even in the "Human Curation" variant, she'd likely still say "Not a meme."
