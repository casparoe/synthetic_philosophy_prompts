  - Worked cases: The "grafted baseline" for hospital-caused conditions is ripe. And the redirected ambulance case lets me show protocol infecting pre-admission workflows.
  - Withholding/withdrawing paperwork hack: "Provisional non-commencement" is perfect bureaucratese. Should show how it creates perverse incentives like delaying care starts to game the stats.
  - That chilling moment: When Appendix C reveals death certificates now have "natural causes, declined." Must bury it in dry reporting language.
  - Footnote confession: The unfalsifiable but internally consistent line needs to sound weary, like a compliance officer who's stopped questioning the madness.

  Tone is crucial. Zero irony in the document's voice. Let the horror build through:
  - Clinical detachment ("lethal intervention" as term of art)
  - Banal committee names (Equivalence Review Panel)
  - Nightmarish edge cases presented as mundane workflow issues

  Biggest risk is over-philosophizing. Must resist naming Parfit or Foot. Instead show the thinking through bureaucratic contortions - like the "fractional homicide" solution for accelerated deaths. 

  Billing complications are key for satire. HR complaining about "homicide" in personnel files? Perfect. Legal worrying about liability for redirected ambulances? Even better. 

  Final touch: That appendix where mortality = homicide count. Should feel like discovering a corpse in a filing cabinet.
answer: |-
  **MEMORANDUM**  
  **TO:** All Clinical Staff, Department Heads, & Billing Personnel  
  **FROM:** Hospital Compliance Office, Equivalence Protocol Division  
  **SUBJECT:** Revised Procedures for EP-17 ("Lethal Intervention / Non-Intervention") Reporting & Documentation  
  **DATE:** October 26, 2023  
  **REF:** EP-17 v.4.3, SCN-2024 Gazette, Form MORB-114a  

  ---

  **1.0 PURPOSE**  
  To standardize documentation of all patient terminations under the **Equivalence Protocol (EP)**, ensuring consistent application regardless of whether expiration resulted from *active intervention* (AI) or *passive non-intervention* (PNI). Per Hospital Policy HC-9, "No ontological distinction exists between AI and PNI; both constitute equivalent endpoints requiring identical administrative review."  

  **2.0 DEFINITIONS**  
  2.1 **Lethal Intervention (LI)**: Any act or omission directly causally linked to patient expiration, including but not limited to:  
  &nbsp;&nbsp;&nbsp;&nbsp;2.1.1 Commission of life-ending treatment (e.g., administering potassium chloride without clinical indication).  
  &nbsp;&nbsp;&nbsp;&nbsp;2.1.2 Omission of life-sustaining treatment *where such omission deviates from the Standard Course of Nature (SCN)*.  
  2.2 **Standard Course of Nature (SCN)**: The officially gazetted trajectory of an untreated condition absent *all* institutional healthcare interventions (revised annually by the Central Prognostics Committee). **SEE SCN-2024 GAZETTE (ATTACHMENT A).**  
  *Example:* SCN-2024 includes routine saline hydration but excludes supplementary oxygen, non-emergency telemetry, or scheduled wound dressing changes.  
  2.3 **Provisional Non-Commencement (PNC)**: A status applied to *authorized but not-yet-initiated* interventions. Termination of PNC-status care is logged as PNI (withholding), not AI (withdrawal), per EP-17 §5.7.  

  **3.0 DOCUMENTATION REQUIREMENTS**  
  3.1 All LI events (AI or PNI) must be recorded on **Form MORB-114a** ("Unified Termination Ledger").  
  3.2 **Section 4(c)** requires selection of **Baseline Type**:  
  &nbsp;&nbsp;&nbsp;&nbsp;3.2.1 **SCN Baseline**: Applied when no prior hospital intervention altered the patient’s natural trajectory.  
  &nbsp;&nbsp;&nbsp;&nbsp;3.2.2 **Grafted Baseline (GB)**: Applied when the hospital *caused* the terminal condition (e.g., iatrogenic injury). GB uses the SCN of the *caused condition*, not the patient’s original presentation.  
  3.3 **Section 7**: "Accelerated Expiration" must be calculated if death occurs earlier than the SCN/GB-predicted timeframe. Express as **Fractional Homicidal Units (FHUs)**. *Formula: (SCN-predicted days remaining - Actual days remaining) / SCN-predicted days remaining.*  

  **4.0 WORKED CASES**  
  **CASE A: Accelerated Expiration via PNI**  
  *Patient with metastatic carcinoma (SCN-predicted expiry: 21 days). Treatment authorized (chemotherapy) but not initiated (PNC status). Care team withholds treatment per family request. Patient expires in 14 days.*  
  - **Determination**: PNI (withholding PNC-authorized care).  
  - **Baseline**: SCN (21 days).  
  - **FHUs**: (21 - 14) / 21 = 0.33 FHUs.  
  - **Billing Note**: Bill as "Partial Termination (PNI-accelerated)" (CPT 992X7). FHUs determine reimbursement weight.  

  **CASE B: Grafted Baseline Application**  
  *Patient develops septic shock due to contaminated hospital IV line (iatrogenic). Care team declines escalation (ventilation/vasopressors). SCN for untreated sepsis: 96 hours. Patient expires in 48 hours.*  
  - **Determination**: PNI (withdrawal of sustained intervention - IV line constituted baseline support).  
  - **Baseline**: GB (SCN for *hospital-acquired sepsis*: 96 hrs).  
  - **FHUs**: (96 - 48) / 96 = 0.50 FHUs.  
  - **Compliance Note**: IV line initiated pre-sepsis does *not* qualify for PNC status. Withdrawal is AI unless replaced by identical SCN-equivalent (saline drip).  

  **5.0 PROVISIONAL NON-COMMENCEMENT (PNC) EXPLOITATION MITIGATION**  
  5.1 PNC status is revoked if:  
  &nbsp;&nbsp;&nbsp;&nbsp;5.1.1 Preparatory actions exceed SCN (e.g., placing a central line for unauthorised dialysis).  
  &nbsp;&nbsp;&nbsp;&nbsp;5.1.2 PNC exceeds 72 hours without Ethics Committee re-authorization.  
  5.2 **Example Exploitation**: Delaying ventilator initiation for 71 hours (retaining PNC status) to log withdrawal as "withholding" (PNI). **This violates EP-17 §5.7.2 (Procedural Bad Faith).**  

  **6.0 REPORTING & STATISTICS**  
  6.1 All LI events (AI/PNI) populate Column 7 ("Termination Events") in the Quarterly Mortality Report (QMR).  
  6.2 **QMR Appendix C** now cross-references Column 7 against:  
  &nbsp;&nbsp;&nbsp;&nbsp;- Total hospital admissions (Column 1)  
  &nbsp;&nbsp;&nbsp;&nbsp;- Total in-facility deaths (Column 3)  
  *Note: Per EP, Column 7 MUST equal Column 3 (all deaths are terminations). Discrepancies trigger Audit.*  
  6.3 Death Certificates: Under "Cause of Death," add secondary descriptor:  
  &nbsp;&nbsp;&nbsp;&nbsp;"Natural Causes, Declined" (PNI under SCN baseline) **OR**  
  &nbsp;&nbsp;&nbsp;&nbsp;"Natural Causes, Modified" (All other LI events)^1^.  

  **7.0 TRAINING**  
  Mandatory EP-17 Refresher (Module 8: "Baseline Grafting & FHU Calculation") due by 11/30/23. Non-compliance impacts departmental equivalence ratings.  

  ---  
  **HR ADVISORY**: "Homicide" is strictly an administrative term under EP-17. Do not use in personnel files. Substitute "Active Termination Event (ATE)."  
  **LEGAL ADVISORY**: Redirected ambulances (non-admissions) *are* reportable if diversion violated SCN (e.g., cardiac arrest during reroute). Use Form MORB-114b ("Pre-Admission Termination").  
  **BILLING ADVISORY**: FHUs are not billable for PNI under pure SCN baseline (death would have occurred anyway). Bill only acceleration portion.  

  ---  
  ^1^ *Compliance Note: While external validation of SCN baselines presents epistemological challenges, internal consistency across MORB-114a datasets remains auditably robust. Focus on documentation fidelity, not metaphysical certainty.*  

  **ATTACHMENTS:**  
  A: SCN-2024 Gazette (Excerpt: Includes oral hydration, passive ROM, standard nursing observation; Excludes supplemental O2, IV antibiotics, dialysis, therapeutic hypothermia)  
  B: Form MORB-114a (Blank)  
  C: FHU Calculator Tool (Excel)  

  ---  
  *This memo complies with EP-17 v.4.3 and the Unified Ethics Framework (UEF-9). File under: ADMIN/COMPLIANCE/EP*
