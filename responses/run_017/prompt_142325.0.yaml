prompt: |-
  I keep going back and forth with a friend about whether the importance / tractability / neglectedness frame is actually any good, so I want to test it on a case instead of trading intuitions. Take WHO's smallpox eradication, and specificaly the decision to launch the intensified programme in 1967 (roughly two million deaths that year, certified gone by 1980) at a moment when the flagship global campaign was the malaria eradication effort started in the 50s, which had most of the money and staff and obviously failed -- malaria still kills several hundred thousand people a year.

  Set it up as a funder in 1966 scoring both causes on the three axes using whatever concrete proxies you'd actually reach for, then tell me which cause the framework picks and what it would have said about the smallpox decision we now know was the right one.

  The parts I care about, because I think this is where the frame is silently mis-specified:

  - Importance as a flow vs. eradication as a one-shot. Does anything built around annual burden systematically underrate "you can end this, permanently"? And what happens to neglectedness-as-a-proxy-for-diminishing-returns when the last handful of countries are the most expensive per case averted?
  - Tractability of a cause vs. tractability of the method you happen to have. The strategy that worked -- surveillance and containment rather than hitting some mass-vaccination coverage target -- hardly existed as a strategy when the programme was approved. So was ex ante tractability just low, and does that mean ITN is biased toward causes that already have a working intervention?
  - The "who else would have paid" question. A lot of the push came from rich countries that wanted to stop footing the bill for routine vaccination and quarantine. Was smallpox even neglected in the sense the framework needs, or just unglamorous to funders with self-interested reasons?
  - Whatever has no slot in the frame: the programme left behind vaccine logistics, surveillance networks and trained field epidemiologists that later campaigns borrowed. Call it option value or capacity, but where does it go?

  Where the framework is genuinely silent, say so instead of stretching it. And finish on the survivorship worry: are we only holding smallpox up as the poster child because it won? Under 900 words, no citations, nothing looked up.
reasoning: |-
  Okay, the user is challenging the ITN (Importance, Tractability, Neglectedness) framework using the smallpox eradication program as a case study. They want to see how ITN would have evaluated smallpox versus malaria in 1966, before the intensified program launched. The user has specific concerns: whether ITN properly accounts for eradication's one-shot nature vs. annual burden, tractability of novel methods, neglectedness when funders have self-interest, and unmeasured benefits like capacity building.

  Hmm, the user is clearly well-versed in global health prioritization debates. They're frustrated with abstract arguments and want concrete application. Their four pain points reveal deep skepticism about ITN's blind spots. The malaria comparison is smart because it forces the framework to handle two similar-seeming programs with wildly different outcomes.

  Let me simulate 1966 scoring. For importance, smallpox had lower annual deaths than malaria (2M vs likely higher for malaria), but ITN typically uses current burden, not future averted burden. That's a huge problem - eradication's long-term payoff gets discounted. Tractability is tricky too: in '66, smallpox had a vaccine but no proven containment strategy, while malaria's failure was becoming evident but wasn't yet conclusive. I'd score smallpox as medium tractability at best back then. Neglectedness is fascinating - smallpox funding was stagnant because wealthy nations saw it as someone else's problem, but that's not quite the philanthropic neglect ITN assumes.

  The framework fails spectacularly on all four concerns: it can't value permanent solutions, penalizes novel methods, misreads mixed-motive funding, and ignores spillover benefits. Most damning is that ITN would have favored malaria in 1966 based on conventional scoring - exactly the wrong call historically. 

  User's survivorship bias point hits hard. We only celebrate smallpox because it won; had it failed like malaria, we'd cite it as proof eradication is intractable. That exposes ITN's vulnerability to hindsight distortion. Maybe the real lesson is that frameworks like ITN need to quantify uncertainty and option value explicitly. 

  ...Though I wonder if the user is lowkey hoping ITN can be salvaged with adjustments. But in this case, the mismatch is too fundamental. Better to admit ITN works best for incremental problems with known solutions, not transformational change.
answer: |-
  Here's the ITN evaluation for a 1966 funder comparing smallpox eradication (launched 1967) and malaria eradication (ongoing), using concrete proxies available at the time:

  ### ITN Scoring (1966 Perspective)
  | Axis          | Smallpox Eradication                      | Malaria Eradication                     |
  |---------------|------------------------------------------|----------------------------------------|
  | **Importance** | **Proxy:** Annual deaths (~2 million). Lower than malaria. | **Proxy:** Annual deaths (higher than smallpox, likely 1M+). **Score: Malaria wins.** |
  | **Tractability** | **Proxy:** Existence of effective vaccine (yes), but global coordination unproven. Mass vaccination failing in endemic areas. Containment strategy nascent/untested. **Medium/Low.** | **Proxy:** DDT spraying + chloroquine worked in some regions (e.g., US, Europe). Global coordination infrastructure *exists* via existing program. **High (perceived).** **Score: Malaria wins.** |
  | **Neglectedness** | **Proxy:** Funding stagnant/declining. Major powers (US, USSR) want to stop routine vaccination costs. No major new philanthropic push. **High neglect.** | **Proxy:** Massive existing WHO/USAID funding and staff. Still seen as priority. **Low neglect.** **Score: Smallpox wins.** |

  **ITN Verdict (1966):** **Malaria favoured.** It scores higher on Importance (bigger annual burden) and perceived Tractability (existing, "working" program). Smallpox only wins on Neglectedness, insufficient to outweigh the other factors.

  ### Addressing Your Concerns
  1.  **Flow vs. Permanent Benefit:** ITN **systematically undervalues eradication.** Importance proxies (annual deaths) ignore the *permanent* future benefit stream. The high cost of the "last mile" (difficult countries) makes Neglectedness a **poor proxy for diminishing returns** – it suggests high leverage precisely when costs soar and marginal returns plummet. ITN misses the "one-shot" nature.
  2.  **Tractability of Cause vs. Method:** ITN **heavily biases towards existing, proven interventions.** Ex-ante, smallpox tractability looked *low* because the crucial intervention (surveillance-containment) was unproven at scale. ITN would have dismissed it as intractable or demanded proof first. It favours incrementalism over innovation.
  3.  **"Who Else Would Pay?" & Neglectedness:** Smallpox was **"neglected" in the ITN sense** (low funding relative to scale, lack of new actors). However, the *driver* (rich countries wanting off the hook) **contaminates the proxy.** ITN assumes neglect signals *philanthropic* opportunity, not *self-interested* withdrawal. It doesn't distinguish motives.
  4.  **Spillover Benefits (Capacity/Option Value):** ITN is **genuinely silent.** The immense secondary benefits (cold chain, surveillance networks, trained workforce enabling future programs like polio/EPI) have no place in the framework. This is a major omission for systemic interventions.

  ### Survivorship Bias & The Verdict
  *   **Yes, we celebrate smallpox *because* it won.** Had it failed (like malaria), we'd cite it as proof eradication was intractable. ITN, applied naively in 1966, favoured malaria – the *wrong* choice historically.
  *   **Why did ITN fail here?** It missed:
      *   **The transformative potential:** Ending a disease forever vs. managing a high annual burden.
      *   **Innovation potential:** The ability to *develop* a radically more effective strategy (surveillance-containment).
      *   **True cost-benefit:** High upfront cost for infinite benefit vs. indefinite lower cost for indefinite (but failing) management.
      *   **Spillover value:** The program's catalytic effect on global health systems.

  ### Conclusion
  The ITN framework, applied with standard proxies in 1966, would have **recommended continued investment in malaria eradication over launching the intensified smallpox program.** It failed to capture the unique value proposition of eradication (permanence), underestimated the potential for innovative strategy to radically improve tractability, misinterpreted the mixed motives behind neglect, and completely ignored critical spillover benefits and option value. Smallpox succeeded *despite* scoring poorly on conventional ITN, highlighting the framework's limitations for transformative, innovative, or systemic interventions, especially those involving eradication. Survivorship bias means we use its success as a benchmark, but ITN wouldn't have chosen it at the time.
