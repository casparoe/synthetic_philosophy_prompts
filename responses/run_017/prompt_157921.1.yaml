answer: |-
  Here's the distilled specification for an **adequate theory of consciousness** — designed to adjudicate your disputed cases, grounded in phenomena, and stripped of metaphysical baggage. Requirements are categorized, with non-negotiables flagged (⚡), conflicts highlighted (⚠️), and camp prejudices called out.

  ---

  ### **I. Core Phenomena & Distinctions (Non-Negotiable Coverage)**  
  *Why: Without these, the theory fails empirical or conceptual adequacy.*

  1. **⚡ State vs. Creature Consciousness**  
     *Case:* Anesthetized human (unconscious creature) vs. sleeping person (unconscious state in conscious creature).  
     *Requirement:* Must distinguish between *being conscious* (creature) and *having a conscious state* (e.g., a dream).  
     *Why:* Necessary for cases like anesthesia (no states) vs. sleep (temporary loss).

  2. **⚡ Phenomenal Consciousness ≠ Access/Reporting**  
     *Cases:* Blindsight (access without phenomenology), no-report paradigms (phenomenology without access).  
     *Requirement:* Explain how subjective experience (*qualia*) can exist without cognitive access or verbal report.  
     *Why:* Blindsight patients "guess" visual stimuli accurately but lack subjective sight; no-report studies show neural signatures of experience without behavior.

  3. **⚡ Unity of Conscious Scenes**  
     *Case:* Binding color, motion, and sound into a single moment (e.g., watching a bird sing).  
     *Requirement:* Explain how disparate sensory inputs integrate into one coherent scene without invoking a "homunculus."  
     *Why:* Split-brain patients show partial unity (each hemisphere has its own scene).

  4. **⚡ Specious Present**  
     *Case:* Hearing a melody (notes linger in awareness beyond their physical duration).  
     *Requirement:* Account for temporal extension of consciousness (~2-3 seconds).  
     *Why:* Distinguishes consciousness from discrete snapshots; critical for memory/identity.

  5. **⚡ Graded/Partial Consciousness**  
     *Cases:* Fetus at 24 weeks (partial neural development), split-brain right hemisphere (isolated capacities).  
     *Requirement:* Permit degrees or modules of consciousness (not all-or-nothing).  
     *Why:* Avoids implausible thresholds (e.g., "sudden" consciousness at birth).

  ---

  ### **II. Non-Negotiable Constraints from Science**  
  *Why: Contradicting robust evidence invalidates the theory.*

  6. **⚡ Neural Correlates of Consciousness (NCC)**  
     *Constraint:* Must be compatible with known NCCs (e.g., posterior hot zone, recurrent processing).  
     *Why:* Lesions to specific brain regions (e.g., V1) abolish visual phenomenology.

  7. **⚡ Dissociation Under Pathology/Intervention**  
     *Cases:* Locked-in syndrome (full awareness without report), vegetative state (no awareness despite reflexes).  
     *Requirement:* Explain preserved/lost consciousness without relying on behavior alone.

  ---

  ### **III. Contentious Distinctions & Camp Prejudices**  
  *Marked where demands are theoretical commitments, not requirements.*

  8. **Phenomenal vs. Access Consciousness**  
     *Status:* **Non-negotiable** (per blindsight/no-report).  
     *⚠️ Conflict:* Camp prejudice arises when theories **collapse access into phenomenology** (e.g., Global Workspace). This fails blindsight.

  9. **Explanatory Gap**  
     *Status:* **Camp prejudice** to demand dissolution.  
     *Why:* A theory can *identify mechanisms* (e.g., recurrent processing) without explaining "why" it feels like something. Adequacy demands *how*, not *why*.

  10. **Third-Person Testability**  
      *Status:* **Camp prejudice** to demand *direct* third-person verification.  
      *Why:* Consciousness is private; adequacy requires *indirect* tests (e.g., NCC biomarkers, behavioral inference). Rejecting this invalidates all theories.

  11. **"Illusionism" as Necessity**  
      *Status:* **Camp prejudice** (Dennett-style).  
      *Why:* Denying phenomenology contradicts first-person reports (e.g., pain). Adequate theories can accept phenomenology as real.

  ---

  ### **IV. Your Test Cases for Higher-Order (HO) Theories**  
  *Both are fair pressure points.*

  12. **Silent Substitution**  
      *Requirement:* Must predict if experience changes when HO state ("I see red") is fixed while first-order (FO) state swaps (e.g., to blue → sound → nothing).  
      *Fairness:* Tests HO core claim (consciousness requires *accurate* representation of FO states).  
      *Adequate Theory Must:* Decide if experience is HO-dependent (e.g., stays "red" illusion) or FO-dependent (changes).

  13. **Crossed Wires**  
      *Requirement:* When HO state in System A targets FO state in System B, specify:  
      - Whose consciousness? (A's, B's, or new entity?)  
      - What is experienced? (FO content or HO misrepresentation?)  
      *Fairness:* Forces HO theories to choose: consciousness follows FO states (undermining HO) or HO states (allowing "false" consciousness).

  ---

  ### **V. Inherent Tensions (⚠️)**  
  *The list's key conflict:*

  14. **⚠️ Primitivism vs. Cognitive Access**  
      - **Don't Over-Intellectualize:** Must cover infants, animals (crows), fetuses — no concepts or self-reflection.  
      - **Explain Reportability Link:** Must account for the *strong correlation* between consciousness and access/report in adult humans.  
      *Tradeoff:* HO theories fail primitivism (require meta-cognition); Global Workspace fails phenomenology-access dissociation. **No theory satisfies both cleanly.**

  ---

  ### **VI. The Most Discriminatory Requirement**  
  **⚡ Phenomenal Consciousness ≠ Access/Reporting**  
  *Why it kills candidates:*  
  - **Eliminates Actualist HO Theories:** Blindsight has access (HO state) but no phenomenology.  
  - **Eliminates Global Workspace:** Assumes access *is* phenomenology; fails no-report paradigms.  
  - **Challenges Self-Representationalism:** If self-representation is necessary, how do infants/crows have phenomenology?  
  - **Pressures Illusionism:** Denies phenomenology exists (contra first-person data).  
  - **First-Order Theories Struggle:** With unity/specious present (no binding mechanism).  

  **Scorecard:**  
  - **HO Theories:** Fail silent substitution (illusion problem), crossed wires (ownership ambiguity), and primitivism (crows/infants).  
  - **Global Workspace:** Fails blindsight/no-report (access ≠ phenomenology).  
  - **First-Order:** Fails unity/specious present (no integration).  
  - **Illusionism:** Denies phenomenal consciousness (inadequate for disputed cases).  

  ---

  ### **Summary Checklist for Adequacy**  
  | Requirement                          | Non-Negotiable | Tension/Prejudice |  
  |--------------------------------------|----------------|-------------------|  
  | State vs. Creature                   | ⚡             |                   |  
  | Phenomenal ≠ Access                  | ⚡             | ⚠️ (vs. access-link) |  
  | Unity of Scene                       | ⚡             |                   |  
  | Specious Present                     | ⚡             |                   |  
  | Graded/Partial Consciousness         | ⚡             |                   |  
  | NCC Compatibility                    | ⚡             |                   |  
  | Pathology Dissociation               | ⚡             |                   |  
  | Silent Substitution                  | ⚡ (for HO)    |                   |  
  | Crossed Wires                        | ⚡ (for HO)    |                   |  
  | Explanatory Gap Dissolution          | ❌ (prejudice) |                   |  
  | Direct Third-Person Testability      | ❌ (prejudice) |                   |  
  | Illusionism as Default               | ❌ (prejudice) |                   |  

  **To use this:** Plug in your disputed cases. If a theory cannot handle the crow (primitivism) *and* split-brain (partial unity) *and* predicts blindsight wrong, it fails. HO theories stumble on silent substitution (illusion) and crossed wires (ownership); Global Workspace conflates access/phenomenality. The unresolved tension between primitivism and access ensures no theory dominates—but adequacy requires minimally *addressing* both.
