answer: |-
  Below is a decision procedure designed for the Office of the Claims Commissioner, based on your operational constraints, statutory framework, and the principles you outlined. The procedure prioritizes efficiency (half-day caseworker review), handles missing evidence transparently, and explicitly addresses the "anyway argument" and mixed-claimant cases. It adopts a **sequential two-track approach** (enrichment first, then harm), as enrichment claims are often more straightforward to trace and less time-sensitive, while harm claims require complex counterfactuals. Your principle of separating claims is retained but refined: enrichment claims focus on *present unjust holdings*, while harm claims address *cumulative group disadvantage*. The procedure degrades to "no" when evidence is insufficient, avoids double recovery, and flags value judgments for the Commissioner.

  ### Decision Procedure: Sequential Questions
  **Order of Questions, Evidence Thresholds, and Outcomes**  
  *Caseworker Instructions: Follow steps in order. Spend no more than 2 hours per step. Use archives, claimant submissions, and pre-approved historical databases (e.g., land records, wage tables). If evidence is missing, note "deficient evidence" and proceed to the next step—do not infer facts. Flag files for the Commissioner only at specified points.*

  1. **Qualifying Wrong (Threshold: Minimal Plausibility)**  
     - **Question:** Is the alleged event a qualifying wrong under the Act (date and category match)?  
     - **Evidence Threshold:** Claimant identifies a specific event (e.g., "land seizure in district X, 1891") matching the statutory list. No corroboration required unless internally inconsistent (e.g., dates contradict archives).  
     - **Clear No If:** Event not listed in the Act (e.g., wrong category or outside date range).  
     - **Missing Evidence Outcome:** Return "no."  
     - **Proceed If Yes.**

  2. **Enrichment Track: Current Holder Liability**  
     - **Question:** Can the taken asset (land, labor, cattle) be traced to a present holder?  
     - **Evidence Threshold:**  
       - *Asset Identification:* Claimant describes the asset (e.g., "100 acres," "5 years of coerced labor"). Value estimated using statutory tables (e.g., average land prices/labor wages for the era).  
       - *Tracing to Present Holder:* Continuous chain shown via records (e.g., title deeds, corporate succession). Gaps allowed only if the holder is the state (as colonial successor) or a direct corporate descendant.  
     - **Clear No If:**  
       - Asset never identified.  
       - Chain broken by a **good-faith transfer for value** (e.g., arm’s-length sale to an unrelated party).  
       - Asset no longer exists (e.g., cattle consumed, labor not embodied in a lasting asset).  
     - **Missing Evidence Outcome:** Enrichment fails; proceed to Step 4.  
     - **Proceed If Asset Traced.**

  3. **Enrichment Defenses and Value**  
     - **Questions & Thresholds:**  
       - *Anyway Argument:* Rejected outright. **Evidence Threshold:** Irrelevant—defense is inadmissible for enrichment (focus is on possession, not hypotheticals).  
       - *Mixed-Claimant:* Does the holder primarily benefit the claimant group? **Evidence Threshold:** Holder’s charter, annual reports, or beneficiary data showing >50% of services/funds serve the group.  
       - *Holder Type Change:* Is the holder fundamentally different (e.g., colonial entity → charity)? **Evidence Threshold:** Legal documents showing mission shift (e.g., profit → nonprofit).  
     - **Clear No If:** Mixed-claimant defense proven (benefit >50%).  
     - **Flag for Commissioner If:**  
       - Mixed-claimant evidence is ambiguous (benefit 25–50%). *Commissioner Decides:* "Does partial benefit extinguish the claim?"  
       - Holder type change. *Commissioner Decides:* "Does the holder’s transformation defeat entitlement?"  
     - **Award If Successful:** Current market value of the asset (e.g., land appraisal, labor value compounded at 3% annually to present).  
     - **Outcome:** If enrichment awarded, skip to Step 6. If failed, proceed to Step 4.

  4. **Harm Track: Immediate Loss**  
     - **Question:** What was the asset’s value at the time of the wrong?  
     - **Evidence Threshold:** Same as Step 2 (statutory tables suffice).  
     - **Clear No If:** Asset/value not established.  
     - **Missing Evidence Outcome:** Harm fails; return "no."  
     - **Proceed If Yes.**

  5. **Harm Tracing and Defenses**  
     - **Questions & Thresholds:**  
       - *Anyway Argument:* Would the loss have occurred lawfully? **Evidence Threshold:** Defendant shows contemporaneous law/policy requiring the same outcome (e.g., "1912 land-acquisition statute").  
       - *Non-Identity Problem:* Group-level comparison used. **Evidence Threshold:** None—automatically applied to all harm claims.  
       - *Mixed-Claimant Offset:* Did the group inherit benefits? **Evidence Threshold:** Records showing direct transfers (e.g., shared estate profits).  
     - **Clear No If:** Anyway argument proven.  
     - **Flag for Commissioner If:** Mixed-claimant offset evidence exists. *Commissioner Decides:* "What portion of benefits offsets the harm?"  
     - **Award Calculation:**  
       - Compounding: Immediate loss × (1.03)^n years (3% annual real growth).  
       - Non-Identity Discount: None (group comparison avoids individual counterfactuals).  
       - Offset: Subtract benefit value (as decided by Commissioner).

  6. **Final Award**  
     - If enrichment succeeded, award enrichment value (avoids double recovery).  
     - If enrichment failed but harm succeeded, award harm value.  
     - If both failed, award "no."

  ---

  ### Why This Procedure?  
  - **Ordering:** Enrichment first because it is more objective, time-resistant, and resolves cases faster. Harm is secondary due to tracing complexities.  
  - **Key Choices vs. Alternatives:**  
    - *Anyway Argument:* Rejected in enrichment (irrelevant to possession) but allowed in harm (impacts causation). *Alternative:* Allow in both—rejected as it would overwhelm claims.  
    - *Non-Identity:* Group-level harm without discount. *Alternative:* Individual counterfactual—rejected as unworkable with no archives.  
    - *Mixed-Claimant:* Strict evidence threshold (50%) to avoid overuse. *Alternative:* Always flag—rejected for efficiency.  
  - **Degrading Honestly:** "No" results only from missing evidence or unmet thresholds—never hidden assumptions.  
  - **Least Confident Step:** Harm compounding rate (3% is arbitrary but simple; I would overrule in hyperinflationary contexts).  
  - **Rationing Note:** This procedure **does not** ration. It assigns notional values. Rationing is a separate pro-rata step after all claims are processed, based on statutory priorities (e.g., claimant vulnerability). The framework does not ration implicitly.

  ---

  ### Test Cases
  **Case 1: Community Land Claim (1891 Dispossession; Now National Park)**  
  - **Step 1:** Qualifying wrong? Yes (land dispossession, 1891 matches Act).  
  - **Step 2:** Enrichment—Land traced to state (national park). Chain continuous (state as colonial successor).  
  - **Step 3:** Enrichment defenses—  
    - Anyway argument: Rejected (irrelevant for enrichment).  
    - Mixed-claimant: Park serves general public; no evidence >50% benefit to claimants.  
    - Holder type: State unchanged—no flag.  
    **Award:** Current land value.  
  - **Outcome:** Compensation for enrichment. Harm not considered.

  **Case 2: Bank Claim (Successor to Financing House with Forced-Labor Mortgages)**  
  - **Step 1:** Qualifying wrong? Yes (forced labor).  
  - **Step 2:** Enrichment—Proceeds from labor traced to bank via merger.  
  - **Step 3:** Enrichment defenses—  
    - Good-faith transfer: 1971 merger was arm’s-length—**enrichment fails**.  
  - **Step 4:** Harm—Immediate loss: Unpaid wages.  
  - **Step 5:** Harm defenses—  
    - Anyway argument: Unproven (no evidence lawful mortgages would have had same terms).  
    - Mixed-claimant: Pension-fund shareholders (group members) benefit. *Flag for Commissioner:* "What portion offsets harm?" (e.g., dividends attributable to tainted assets).  
    **Award:** Compounded harm minus offset.  

  **Case 3: Religious Order (Forced Labor, Now Insolvent; Hospital/School for Victims)**  
  - **Step 1:** Qualifying wrong? Yes (forced labor).  
  - **Step 2:** Enrichment—Labor value traced to hospital/school.  
  - **Step 3:** Enrichment defenses—  
    - Mixed-claimant: Hospital/school primarily serve claimant group (>50%). **Clear no**—enrichment fails.  
  - **Step 4:** Harm—Immediate loss proven (unpaid wages).  
  - **Step 5:** Harm defenses—  
    - Anyway argument: Unproven.  
    - Non-identity: Group-level comparison applied—no discount.  
    - Mixed-claimant: Benefits received (health/education). *Flag for Commissioner:* "What portion offsets harm?" (e.g., value of services).  
    **Award:** Compounded harm minus offset.  
  - **Why Not Charge the Hospital?** The procedure does not "charge" holders—it awards from the fund. Enrichment failed due to mixed-claimant defense, but harm provides an alternative. The hospital isn’t penalized; claimants receive compensation for harm.

  ---

  ### What the Procedure Cannot Do  
  1. **Ration the Fund:** Only calculates notional entitlements. A separate mechanism (e.g., pro-rata reduction) is needed.  
  2. **Resolve Subjective Gaps:** Relies on Commissioner for value judgments (e.g., "holder type change").  
  3. **Perfect Non-Identity Handling:** Group-level comparison is pragmatic but may under/over-compensate in edge cases (e.g., mass migration).  
  4. **Low-Evidence Harm Tracing:** Compounding is crude; it cannot capture cultural/social harms.  
  5. **Futureproofing:** Fixed thresholds (e.g., 50% mixed-claimant) may need revision if patterns change.  

  This procedure balances efficiency, transparency, and fairness within your constraints. It is defensible because it minimizes discretion, degrades honestly, and isolates value judgments. For implementation, train caseworkers on the thresholds and flags—this will handle 80% of files routinely, reserving 20% for Commissioner review.
