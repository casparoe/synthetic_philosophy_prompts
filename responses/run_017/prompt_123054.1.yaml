  **MINISTRY OF HERITAGE, CULTURE AND COMMUNAL COHESION**  
  **INVITATION TO TENDER**  
  **ITT REF: MH/CC/TradInvent/24-01**  
  **PROCUREMENT OF A COMPREHENSIVE NATIONAL TRADITION (CNT)**

  **1. BACKGROUND**  
  1.1. The Republic of New Caledonia (RoNC) (Population: 2.7m resident; Est. 1.1m diaspora), having achieved full sovereignty in 1992, recognises the critical requirement for a unifying cultural framework to foster national identity and social cohesion.  
  1.2. Analysis indicates a deficit in shared, non-contentious cultural practices perceived as both intrinsic to the national character and capable of binding diverse demographics (resident and diasporic) into a unified civic entity.  
  1.3. Historical precedent (e.g., Anderson, 1983^1) suggests the efficacy of structured, repeatable communal activities in nation-building contexts. The Department seeks to operationalise this principle proactively.  

  ^1 *Anderson, Benedict. 'Reflections on Vernacular Cosmopolitanism'. Unpublished lecture notes, LSE, 1983 (MinArch Ref: CUL/AND/83/LSE/Box12-F7).*

  **2. SCOPE OF REQUIREMENTS**  
  2.1. The Contractor shall deliver a fully realised **Comprehensive National Tradition (CNT)**, comprising:  
      2.1.1. A core **Ritualised Practice (RP)**: A performable act, suitable for mass participation.  
      2.1.2. An associated **Narrative of Origin (NoO)**: Providing historical context and perceived antiquity for the RP.  
      2.1.3. A **Symbolic Artefact Set (SAS)**: Tangible objects integral to the RP, suitable for commodification and domestic display.  
      2.1.4. A **Pedagogical & Promulgation Package (PPP)**: Materials and methodologies for instruction (schools, military, civic groups) and promotion (media, diaspora outreach).  
      2.1.5. A **Long-Term Perpetuation Strategy (LTPS)**: Ensuring the CNT becomes self-sustaining within 30 years.  

  **3. MANDATORY REQUIREMENTS**  
  The proposed CNT **MUST**:  
  3.1. Demonstrate an **immediate perceived antiquity** sufficient to engender reverence and a sense of shared, timeless heritage amongst participants, whilst being entirely novel.  
  3.2. Possess **high scalability and formalisability**: Capable of being performed:  
      *   3.2.1. Simultaneously by the entire national population (including diaspora), inducing a sense of communal participation regardless of physical proximity.  
      *   3.2.2. By organised groups (e.g., school assemblies, military parades) with minimal training.  
      *   3.2.3. By individuals in private, reinforcing personal connection to the collective.  
  3.3. Exhibit **social compulsion dynamics**: Whilst legally non-mandatory, the RP must generate significant peer/societal pressure ensuring near-universal voluntary participation.  
  3.4. Be **civically, not ethnically, rooted**: Accessible and resonant to all citizens regardless of ancestry, while fostering an *inescapable* sense of primordial belonging to the RoNC polity.  
  3.5. Possess inherent **resilience to scrutiny**: The constructed nature of the CNT must remain undetectable to lay observation and conventional historical analysis for a minimum of two (2) generations (approx. 60 years).  
  3.6. Ensure **zero demonstrable connection** to pre-1992 regional or colonial cultural practices to avoid factionalism or claims of appropriation.  

  **4. EVALUATION CRITERIA**  
  Proposals will be assessed on:  
  4.1. **Perceived Antiquity Score (PAS)**: (Weighting: 35%) Measured through focus groups assessing the plausibility of the NoO and the 'feel' of the RP/SAS.  
  4.2. **Scalability & Formalisation Index (SFI)**: (Weighting: 25%) Assessment of ease of teaching, standardisation, and mass simultaneous performance mechanics.  
  4.3. **Cohesion Impact Potential (CIP)**: (Weighting: 20%) Modelled projection of uptake across demographics and its unifying effect.  
  4.4. **Obfuscation Resilience Rating (ORR)**: (Weighting: 15%) Evaluation of mechanisms delaying academic/journalistic deconstruction.  
  4.5. **Cost-Effectiveness & Perpetuation Viability (CEPV)**: (Weighting: 5%)  

  **5. EXCLUSIONS**  
  5.1. Proposals relying on, referencing, or adapting pre-existing indigenous, colonial, or neighbouring national traditions will be rejected.  
  5.2. Proposals involving significant physical infrastructure, hazardous materials, or overtly religious iconography are ineligible.  
  5.3. Proposals lacking a credible LTPS demonstrating generational transmission without continuous state intervention will be non-compliant.  

  **6. PRICING AND DELIVERABLES**  
  6.1. Tenders must provide a fixed-price quotation for the complete CNT package (RP, NoO, SAS, PPP, LTPS).  
  6.2. Pricing must include:  
      *   6.2.1. Core design and development.  
      *   6.2.2. Prototype testing & refinement (discreet focus groups).  
      *   6.2.3. Full documentation suite (including 'aged' source materials for archival seeding).  
      *   6.2.4. Initial rollout support (Year 1).  
  6.3. **Critical Note on Antiquity:** Bidders should note that the essential quality of 'antiquity' is not a direct deliverable but an **emergent property** contingent upon the quality of the NoO, SAS design, archival seeding, and the psychological plausibility of the RP. Pricing should reflect this nuance. The Department will not pay premiums for claims of 'direct antiquity sourcing'.  

  **7. CONFIDENTIALITY & SENSITIVITY**  
  7.1. This ITT and all subsequent tender documentation are classified **OFFICIAL-SENSITIVE (Creation)**.  
  7.2. Unauthorised disclosure, particularly to media entities, constitutes a severe breach of the Official Secrets Act (RoNC) 1992 (Amended 1997). The revelation of the CNT's constructed nature *before* the obfuscation period (Clause 3.5) would catastrophically undermine the project's objective and represent a significant waste of public funds.  
  7.3. Bidders must demonstrate robust internal information security protocols. Failure to maintain confidentiality will result in immediate disqualification and potential legal action.  

  **8. SUBMISSION INSTRUCTIONS**  
  8.1. Complete tender responses, marked **"ITT MH/CC/TradInvent/24-01 – STRICTLY CONFIDENTIAL"**, must be submitted electronically via the Ministry's Secure Procurement Portal (SPP) by:  
      **14:00 hours (Local Time), Monday, 31st June 2024.**  
  8.2. Late submissions will not be considered under any circumstances.  
  8.3. **Clarification:** The Department acknowledges the inherent chronological paradox in requiring the delivery of a tradition imbued with perceived antiquity by a fixed future date. Bidders are expected to resolve this paradox within their methodological approach. This is considered a fundamental test of capability.  

  *The Ministry of Heritage, Culture and Communal Cohesion reserves the right not to award a contract.*  
  *This procurement exercise is conducted under the RoNC Public Contracts Regulations 2020.*  
  *Enquiries via SPP messaging only. No approaches to departmental staff.*  

  **END OF ITT**
