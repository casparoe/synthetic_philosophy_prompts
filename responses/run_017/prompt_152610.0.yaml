prompt: |-
  I write long-read pieces on science and ideas, and I'm working on one about 'believe and you will' culture — placebo responses in medicine, confidence rituals in elite sport, teacher-expectancy effects in classrooms — and I want to give general readers a philosophical grip on why 'you have reason to believe this' and 'it would be good for you to believe this' are not the same claim. The frame is the wrong kind of reasons problem: a consideration can count in favour of an attitude by making the attitude worth having rather than by bearing on whether the attitude is correct.

  What I need is a single case I can put in front of non-philosophical readers, engineered so that two standard ways of drawing the distinction come apart in one direction. The consideration must be a reason of the wrong kind on the source test — its entire force comes from the value of ending up in that state, and it would evaporate if holding the attitude had no such effects — and yet a reason of the right kind on the fittingness test — it genuinely bears on whether the attitude's object has the property the attitude presents it as having (truth, in the case of belief).

  Constraints: one paragraph; ordinary people in an ordinary setting; no demon, no bet, no bribe or threat, no promise, no predictor or oracle; the consideration must be one that a real person in that situation would sincerely offer as a reason ('I have reason to think X'), not a philosopher's device; and the divergence must be generated by the mechanics of the case rather than stipulated.

  Alongside the scenario I need: the verdict each test returns and the reasoning to it; a note on which single feature of the case is doing the work and what happens to both verdicts if that feature is removed; which verdict you take to be the right one; and how someone who wants to keep the other test would attack the case.
reasoning: |-
  Okay, the user is writing a long-read piece on the 'believe and you will' phenomenon across different domains and wants to illustrate the philosophical distinction between pragmatic and epistemic reasons for belief. They need a concrete, everyday example that meets very specific constraints: no fantastical elements, no overt incentives, something relatable where the reason feels authentic. 

  Hmm... the challenge is crafting a scenario where both tests (source vs fittingness) clearly diverge in opposite directions. Most classic cases (demons, bribes) violate their constraints. The key is finding a situation where the pragmatic benefit stems directly from the belief's psychological effects, yet the evidence itself is tangibly tied to reality. 

  *Pacing while thinking*... Parent-teacher conferences! That's ordinary. Imagine a parent who feels more patient when believing their child is gifted—even with mediocre report cards. The patience comes from the belief itself (source test: wrong kind), but the parent points to "small signs of brilliance" as evidence (fittingness test: right kind). The sincerity comes from parental optimism bias—real people do this! 

  *Checking constraints*: No demons/bribes ✅, ordinary setting ✅, self-offered reason ("I see sparks of brilliance") ✅. The magic is in the self-fulfilling loop: believing improves behavior, which then creates actual evidence (child responding to patience). Remove that loop? Both tests collapse—no pragmatic benefit without effect, no new evidence without changed behavior. 

  *Anticipating objections*: Critics might say the parent's "evidence" is cherry-picked, so fittingness fails. But the beauty is the evidence emerges *because* of the belief—it’s retroactively real. That’s what makes the divergence inevitable. 

  *Final polish*: Emphasize how the child’s *actual* improvement bridges the gap—wrong kind morphs into right kind over time. Perfect for their theme about belief’s generative power.
answer: |-
  Here’s a self-contained case meeting all constraints, with analysis following:

  ---

  **Scenario:**  
  Sarah’s daughter Maya struggles with math. After a discouraging parent-teacher meeting, Sarah consciously chooses to believe Maya has a "hidden gift" for logical reasoning. When Maya brings home a mediocre puzzle assignment, Sarah points to one correctly placed shape and says: *"See this? It shows her brilliant spatial intuition is starting to emerge. I have reason to think she’s gifted—it explains why standard methods frustrate her."* Sarah’s conviction makes her patient during homework. Months later, Maya’s spatial reasoning *genuinely improves* because Sarah’s calm support allowed her to persist without anxiety.

  **Analysis:**  
  1. **Source Test (Wrong Kind):**  
     The reason’s force *entirely depends* on the benefits of Sarah’s belief. If believing Maya was gifted didn’t make Sarah more patient (e.g., if Maya thrived under strict tutors), Sarah’s "evidence" (one correct shape) wouldn’t motivate belief. The reason exists *only* because the belief-state improves outcomes.  
     → **Verdict:** *Wrong Kind Reason*  

  2. **Fittingness Test (Right Kind):**  
     Sarah’s reason *genuinely bears on truth*: she claims the shape placement *indicates giftedness*. This is a standard inductive inference (weak but structurally valid). The reason’s content addresses the attitude’s correctness condition ("Is Maya gifted?"), not just the belief’s utility.  
     → **Verdict:** *Right Kind Reason*  

  **Crucial Feature:**  
  The belief’s *causal power to create future evidence*. Sarah’s belief *produces* the very giftedness it posits (via patience enabling Maya’s growth). **Remove this:** If Maya’s skill *couldn’t* improve (e.g., she has an immutable cognitive disorder), Sarah’s "evidence" loses pragmatic force (source test → no reason) *and* becomes empirically unfitting (fittingness test → no reason). Divergence collapses.

  **Correct Verdict:**  
  The source test is decisive. Sarah’s reason is pragmatically valid but epistemically corrupt—it’s a rationalization masquerading as evidence. The "giftedness" inference isn’t truth-directed; it’s a self-fulfilling prophecy trigger.

  **Attack from Fittingness Defenders:**  
  Critics might argue: *"The fittingness test fails. Sarah’s reason (one shape) is statistically irrelevant to giftedness—it doesn’t genuinely bear on truth. It’s just bad evidence, not a right-kind reason."*  
  → **Rebuttal:** Fittingness concerns *logical structure*, not evidential weight. Sarah’s inference ("this detail indicates latent talent") mirrors valid patterns (e.g., "this anomaly suggests undiscovered physics"). The reason’s *form* fits belief’s truth-aim, even if its empirical strength is weak. Weight affects whether the reason is *good*, not whether it’s the *right kind*.

  ---

  **Key for Your Piece:**  
  This shows how "believe and it will be true" systems (like growth mindset pedagogy) exploit this gap. Sarah’s reason *feels* truth-apt ("Look at the evidence!") but is *motivated* by instrumental value. The self-fulfilling result then *retroactively* justifies it, masking the initial wrong-kind mechanism.
