prompt: |-
  I'm in one of those philosophy reading groups that meets at the library on Tuesdays — I'm a retired atmospheric chemist, thirty years of running a lab and now apparently this — and last week we got onto who should be allowed to vote and I've been going round in circles ever since. I dont actually know what I think in general. I only know what I think about individual cases, so let me just give you those and see if you can find the principle underneath.

  - Sixteen year olds: yes. They'll be living with whatever we decide about schools and climate long after I'm not, and I've met plenty of fifty year olds who understand less than the average sixth former.
  - A twelve year old who's obviously sharp, follows the news, and could pass any test you set: no. And I can't give a reason for that without it also eating the sixteen year old.
  - A competence or civics test for voters of any age: I recoil from it. Though I've just appealed to something like competence in the case above, and I can't tell you why a school leaving exam is fine and this isn't.
  - Someone who has lived and worked here twenty years, pays tax, kids in school here, but never got round to naturalising: yes, obviously. They're subject to our laws exactly as much as I am.
  - Someone here on a two year work visa: no, for national elections anyway. And I'm mildly ashamed of that, because the difference between them and the twenty year resident is just a number of years.
  - A citizen who left forty years ago, has no property or family here, no plan to come back, doesn't even follow the news: still yes. This is the one I feel most strongly about and it's the one that wrecks my theory, because on any affected-interests story they're the weakest case of the lot. What I think I actually believe is that membership is a real thing and it doesn't dissolve through absence.
  - Prisoners serving short sentences: yes. Life sentence for a violent crime: I find myself saying no, and I suspect that's just extra punishment smuggled in, in which case it should go.
  - Compulsory voting: yes, but only if there's a 'none of the above' box on the ballot. I want them at the table, I don't want to force them to assert something they don't believe. Someone in the group says that's incoherent — either you're compelling a meaningless act or the box makes it voluntary anyway — and I can't tell which of us is confused.
  - Parents casting an extra vote on behalf of each of their under-sixteens: I hate it. But my objection keeps turning out to be that it's really the parents voting twice, and I can't work out whether that's an objection to the scheme or just to parents.

  My own first pass, before the expat broke it, was: you get a vote on a decision if you'll be subject to it for most of the period it bites. I like it because it's the sort of move I used to make at work — fix the boundary of the system, then ask which degrees of freedom are inside it, rather than arguing about each molecule. It handles the resident, the visa holder and the sixteen year old. But it says no to the expat and yes to the twelve year old, and I won't accept either. Someone else in the group suggested that instead of a yes/no threshold you weight: the longer you'll be living under the outcome, the more your vote counts. I have the same reaction to that as to compulsory voting — it sounds principled and slightly monstrous, and I'd like to know whether that reaction is worth anything.

  So what I want is a principle, or a short list of candidate principles, stated precisely enough that I could argue with it next Tuesday. Tie each clause to the case that motivated it. Tell me honestly which of my verdicts no reasonable principle saves, and which pair I have to give up on. And tell me what the ones you come up with say about three cases I haven't listed: a dual citizen who votes in two countries' national elections; a region holding a referendum on whether to secede, where half the residents moved there recently from elsewhere in the country; and someone who becomes eligible the day after the electoral register closes.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're a retired atmospheric chemist turned philosophy enthusiast, struggling to reconcile their gut feelings about voting rights with a coherent principle. Their examples are vivid and personal—sixteen-year-olds yes, sharp twelve-year-olds no, expats yes despite no tangible stake—but the expat case torpedoes their initial "affected interests" theory. 

  Hmm, what's really going on here? They're intellectually honest (admits shame about visa holders, critiques their own life sentence stance) but emotionally attached to citizenship as inviolable membership. The lab analogy is telling—they want system boundaries like in chemistry, but voting rights resist neat equations. 

  The contradictions are fascinating: They appeal to competence for the twelve-year-old but reject tests; endorse compulsory voting with a protest option despite its alleged incoherence. That "none of the above" point is subtle—they're trying to separate participation from endorsement, which feels deeply democratic but technically tricky. 

  Ah! Their core tension is between two moral intuitions: consent of the governed (affected interests) and communal belonging (membership). When these clash—like the expat who's a member but unaffected—they default to belonging. That's why the twelve-year-old feels wrong: not about smarts, but about recognizing childhood as a protected non-member status. 

  For the unlisted cases... Dual citizenship? Membership isn't diluted—two communities, two votes. Secession referendum? Membership requires weighting duration to prevent "colonization" voting. Registration deadline? Administrative necessity beats ideal inclusion—they'll tolerate small gaps if systemic. 

  Biggest sacrifice: They must either drop the expat yes (hurts) or accept voting tests (hurts more). The monstrous-but-principled vote-weighting idea? It actually aligns with their "affected duration" instinct but violates membership equality. They'd hate it in practice. 

  ...Wait, their parenting vote objection reveals something. They dislike parents "voting twice" because it conflates membership—kids aren't partial members. That's consistent! If membership is binary, you don't get more for dependents. 

  Final note: They need to hear that recoiling from competence tests isn't hypocrisy—it's preventing a slippery slope to disenfranchisement. School exams measure readiness for choice; voter tests would gatekeep the choice itself. Different boundaries entirely.
answer: |-
  Based on your cases, your core tension is between **"Affected Interests"** (who bears the consequences?) and **"Membership"** (who belongs to the political community?). No single principle cleanly covers all your judgments, but a layered approach might reconcile most. Here's a breakdown:

  ### Core Principles Derived From Your Cases
  1.  **Foundational Membership:** Citizenship is the primary gateway to the franchise. It creates a permanent, non-revocable claim (absent extreme exceptions like treason). *(Motivated by: Expat citizen, Naturalized resident vs. visa holder)*
  2.  **Protection of Developmental Stages:** Minors below a standardized age threshold (e.g., 16) are excluded, regardless of individual competence, to preserve childhood and avoid imposing political responsibility prematurely. *(Motivated by: Sharp 12-year-old vs. 16-year-olds)*
  3.  **Rejection of Discretionary Competence Tests:** Voting rights for citizens cannot be contingent on passing tests due to the high risk of abuse, historical injustice, and the fundamental nature of the right. Competence is presumed upon citizenship and age eligibility. *(Motivated by: Recoil from civics tests)*
  4.  **Subjection to Law + Contribution:** Long-term, tax-paying, law-abiding non-citizen residents deserve inclusion due to being governed and contributing equally. *(Motivated by: 20-year resident non-citizen)*
  5.  **Rejection of Additive Punishment:** Disenfranchisement cannot be used as *extra* punishment. Incarceration restricts liberty but doesn't inherently dissolve membership or the right to participate upon release. *(Motivated by: Prisoners - your suspicion about smuggled punishment)*
  6.  **Meaningful Participation in Compulsion:** Compulsory voting must allow a formal abstention ("None of the Above") to avoid compelling false affirmation of choices. *(Motivated by: Compulsory voting with NOTA)*
  7.  **Individual Suffrage:** Voting rights attach to individuals, not to relationships. Parents cannot claim extra votes based on dependents. *(Motivated by: Hating the parent vote scheme)*

  ### Candidate Principles (Stated Precisely)
  **Principle A (Primary - Membership & Threshold Inclusion):**
     "The right to vote in national elections is inherent to citizenship, activated at a standardized age of majority (e.g., 16), and is irrevocable except for actions constituting a fundamental rejection of the polity (e.g., treason). Non-citizens gain this right only after demonstrating significant, long-term integration (e.g., permanent residency + X years of tax residency)."

  **Principle B (Ancillary - Affected Interests & Protection):**
     "While membership defines the electorate, the *enduring legitimacy* of decisions rests on their primary impact falling upon those subject to the polity's laws and contributing to its maintenance over the long term. This justifies protective exclusions for minors below the age threshold and inclusion for long-term resident non-citizens subject to the laws."

  ### How Your Verdicts Hold Up (or Don't)
  *   **Saved by Principle A/B:**
      *   **16yo Yes:** Citizenship + Age Threshold reached.
      *   **Sharp 12yo No:** Protection of childhood stage (B), even if Affected Interests (B) would argue *for* inclusion. Principle A (age threshold) overrides individual competence.
      *   **Civics Test Recoil:** Rejection of Discretionary Tests (A). School exams are qualifications for roles/benefits, not gatekeepers of fundamental rights.
      *   **20-Year Resident Non-Citizen Yes:** Subjection to Law + Contribution + Long-Term Integration (B) *trumps* formal citizenship status *for inclusion*. Principle A defines the norm, B creates this specific exception.
      *   **2-Year Visa Holder No:** Lack of long-term integration/permanent commitment (B). The "number of years" *is* the proxy for demonstrating integration/subjection.
      *   **Expat Citizen Yes:** Foundational Membership (A) is absolute. Affected Interests (B) is secondary for legitimacy, not individual suffrage.
      *   **Short-Sentence Prisoners Yes:** Membership (A) is intact; disenfranchisement is extra punishment (Rejection of Additive Punishment - B).
      *   **Compulsory Voting + NOTA:** Meaningful Participation (B) - avoids compelled false affirmation.
      *   **Parent Vote Hate:** Individual Suffrage (A) - voting rights are individual, not derivative.
  *   **Problematic Verdicts (Requiring Adjustment or Acceptance of Tension):**
      *   **Life Sentence Violent Crime No:** This is the **hardest to save**. Principle A (Membership irrevocable) says Yes. Your rejection of additive punishment (B) also points to Yes. Your "no" seems like emotional retribution conflicting with your stated principles. *A reasonable principle likely forces a "Yes" here.* You might need to accept this or define an extremely narrow exception (e.g., "fundamental rejection of polity" akin to treason, though this is slippery).
  *   **Inherent Tension You Must Accept:**
      *   **The Expat vs. Affected Interests:** Your **strongest conviction** (Expat Yes) **directly contradicts** your initial "first pass" principle (Affected Interests). You *must* choose. Your cases show you prioritize Membership (A) over Affected Interests (B) for defining the electorate. Affected Interests (B) informs the *legitimacy* of the system and creates *exceptions* for long-term non-citizen residents, but doesn't *remove* rights from members.

  ### Your Reaction to Weighted Voting
  Your recoil ("principled and slightly monstrous") is **worth something**. It highlights the conflict between equality (core to Membership Principle A) and impact (Affected Interests Principle B). Weighting votes based on duration of effect prioritizes B over A, undermining the foundational equality of citizens. Most democratic systems prioritize equal suffrage per citizen (A) over perfect alignment with affected interest (B), recognizing the monstrous implications (e.g., the elderly/terminally ill having negligible votes) and administrative nightmare of weighting.

  ### Application to Unlisted Cases
  1.  **Dual Citizen Voting in Two Countries:**
      *   **Principle A (Membership):** Says YES. They are a full member of both polities. Each nation's elections govern them as a member.
      *   **Principle B (Affected Interests):** Likely YES, assuming they maintain ties/residence/subjection to laws in both. Potential for split loyalty is a separate citizenship/naturalization policy issue, not a suffrage issue within each polity. *Your principles suggest allowing it.*

  2.  **Secession Referendum (Recent In-Migration):**
      *   **Principle A (Membership):** All current citizens residing in the region vote equally.
      *   **Principle B (Affected Interests):** Creates tension. Long-standing residents have a greater long-term stake. However, applying weighted voting is "monstrous." A residency requirement (e.g., must be resident for X years *before* the referendum date) is the typical compromise, grounded in demonstrating integration/commitment to the region (aligns with B, but uses a threshold like your non-citizen inclusion). *Your principles likely support a residency requirement, rejecting simple weighting.*

  3.  **Eligible Day After Register Closes:**
      *   **Principle A (Membership & Age):** They are a member and meet the age threshold *now*.
      *   **Principle B (Affected Interests):** They will be subject to the laws chosen.
      *   **BUT:** Administrative feasibility requires cut-off dates. This is a practical necessity that creates small, temporary gaps in the ideal. *All systems accept this imperfection. Your principles regret it but tolerate it as necessary.* A well-designed system minimizes the gap (e.g., registration open until close to the election).

  ### Conclusion for Tuesday
  Your core principle is **Citizenship as Foundational, Permanent Membership** (Principle A). This explains your firmest "yes" votes (16yo, expat) and "no" votes (sharp 12yo, civics test). However, you recognize a secondary principle of **Long-Term Subjection/Integration** (Principle B) that creates a major exception *for inclusion* (long-term resident non-citizens) and justifies *protective exclusion* (minors below threshold), while also informing system legitimacy. 

  **Sacrifices Required:** Your "no" for life-sentenced prisoners is hard to justify under these principles; you likely need to change this verdict. Your initial "affected interests" principle must be downgraded; it cannot explain the expat vote.

  **Argue with This:** "I argue that voting rights stem primarily from *irrevocable membership* in the political community (citizenship), activated at a clear age threshold (e.g., 16). This accounts for the expat, the 16yo, and rejects tests. However, long-term, law-abiding, tax-paying non-citizen residents, deeply subject to the laws, *earn* inclusion through integration despite lacking formal citizenship. Minors below the threshold are excluded to protect childhood, not due to incompetence. While affected interests matter for legitimacy, they don't revoke membership rights. This principle forces me to accept voting rights for life-sentenced prisoners but rejects proxy voting for parents."
