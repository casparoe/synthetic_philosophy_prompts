prompt: |-
  I'm a philosophy PhD student finishing a chapter on higher-order evidence, and there is one configuration I keep running into that I can't find a settled name for or a settled treatment of, so I want to know whether it has one before I coin something. Let me give three cases. (1) A large meta-analysis in my area reports that studies of a certain common design produce false positives at a very high rate. The meta-analysis is itself a study of that kind: same statistical machinery, same publication pipeline, and its headline result is a single estimate of a false-positive rate that it says you should trust. So if I credit it, I have strong reason for distrusting the very method that produced it; if I discount it on account of what it says, I seem to have no reason to discount anything at all. (2) The clean contrast: I learn from a blood test that a drug I'm taking impairs the formation of new long-term memories. Nothing in that bad news has to travel through the faculty it indicts — the test result sits in front of me in writing, and I can re-read it. No circularity, no puzzle, ordinary undermining defeat. (3) The messy middle, which is the one I actually care about: the indictment is delivered by a method that is nearly, but not quite, the method it indicts. The meta-analysis uses the same broad statistical framework but a far simpler, preregistered design and a huge sample, and the critique it makes is explicitly about small-sample, flexibly-analysed studies. Whether it implicates itself now depends on how coarsely I describe the method: under a coarse description it is self-indicting, under a fine description it isn't, and it seems I can't settle which description is the right one without already taking a stand on the first-order question. There is a further wrinkle in both (1) and (3) that I think matters: the indictment is one-directional. It doesn't say the method is unreliable tout court; it says the method systematically over-produces positive findings of a certain kind, and it is itself a positive finding of that kind. So trusting it tells me to be more suspicious of exactly the sort of claim it is, and not of the opposite claim — which means the usual symmetry of undermining defeat is missing.

  I've had two unsatisfying responses. My supervisor said this is just the generality problem for reliabilism wearing a hat: how finely to individuate the belief-forming process type. Someone in my reading group said it is 'self-undermining', but as far as I can tell that label is standardly used of theories or principles that discredit themselves — e.g. conciliationism applied to the disagreement about conciliationism, or an argument whose conclusion is that arguments of its kind are untrustworthy — not of a piece of evidence that discredits its own source. And the neighbouring literatures seem to run in the wrong direction: there's a well-known family of cases, one of which I half-remember involving a gas gauge, where a source's own deliverances are used to establish the source's reliability, and there the complaint is that the reasoning seems to work too well, licensing knowledge too cheaply. My cases are corrosive rather than credential-granting. Also, epistemic akrasia and the enkrasia/evidentialism debate look like they concern the output state — believing P while taking your belief that P to have been badly formed — whereas my worry is upstream, about what such a piece of evidence requires of me in the first place.

  So my question is not really for a label. I want to know what this phenomenon is and where its edges are. Does it have an established name or literature of its own, and if several established concepts are nearby, which fits best and how exactly does my case differ from each? Concretely, I'd like you to address: (a) whether the self-application means such evidence can never oblige a first-order credence shift and can only move one's confidence about one's own confidence, or whether there is a non-trivial fixed point — some stable intermediate degree of trust in the indicted method that the evidence supports, and if so how you would find it; (b) whether the diagonal, non-diagonal and near-diagonal cases really differ in kind, or whether (2) is just the limiting case of a continuum; (c) whether the grain-sensitivity in (3) is genuinely an instance of the generality problem or whether self-application adds something to it, since there the choice of grain seems to become something one can have reasons to prefer rather than a descriptive matter; and (d) whether the one-directional form is a different phenomenon from the symmetric form, or the same one with the sign changed. Please also give me two or three boundary cases that look like this but aren't, and say what distinguishes them. If nothing established fits, coin a term, define it, and tell me what would count against the definition. I'd also find it useful if you said whether any of this bears on practice — for instance on how a field should weigh its own meta-science during a replication crisis, or on how to treat a source that volunteers that sources like it are not to be trusted.
reasoning: |-
  Okay, the user is a philosophy PhD student working on higher-order evidence. They've encountered a specific configuration in their research that they can't find a settled name or treatment for. They provided three cases to illustrate the problem: a completely self-undermining meta-analysis, a straightforward undermining defeat via a blood test, and a messy middle case where the indictment is delivered by a method that's almost but not quite the same as the one it indicts. 

  Hmm, this is a sophisticated epistemological puzzle. The user is clearly deep into the literature—they've already considered reliabilism's generality problem, self-undermining theories, epistemic akrasia, and gas-gauge cases. But they feel existing frameworks don't quite capture what's distinctive about their cases, especially the near-diagonal scenario and the one-directional nature of the indictment. 

  Let me unpack their core concerns: First, they're noticing that when evidence attacks its own epistemic pedigree, it creates a peculiar loop. Second, the granularity of method-description matters—is it "statistical methods" broadly or "small-sample flexibly-analysed studies" specifically? Third, the asymmetry is crucial: the meta-analysis only discredits positive findings, not negative ones. 

  Their supervisor's response about reliabilism's generality problem feels unsatisfying because this isn't just about belief-forming processes—it's about evidence that actively sabotages its own justificatory basis. And while "self-undermining" is close, it usually applies to theories, not evidence sources. The gas-gauge cases are inverted too—those bootstrap reliability, whereas here evidence corrodes it. 

  For their concrete questions: (a) I suspect there might be fixed points if we model it recursively—like when P(trust|evidence) = P(trust), yielding a stability condition. (b) The cases likely form a continuum; even the blood test could be seen as a limiting case where the "method" is defined so finely it escapes indictment. (c) The grain-sensitivity here is distinct from the generality problem because the choice of grain isn't neutral—it's entangled with first-order commitments. (d) The one-directional aspect might be what makes non-trivial fixed points possible, unlike symmetric cases where trust collapses. 

  Boundary cases to consider: A liar paradox ("this sentence is false") differs because it's not evidence about the world. A drug that causes distrust in all beliefs differs because it's not content-specific. And conciliationism about disagreements is different—it's a normative conflict, not an evidential loop. 

  The user also wants practical implications. This connects directly to replication crises—how should fields react when their own methods reveal systemic flaws? Or think about AI alignment: an AI auditing its own reasoning modules. 

  Since nothing fits perfectly, I'll propose "Self-Undermining Evidential Loop" (SUEL) as a term. Defining features: evidence E produced by method M; E indicts reliability of M-type methods regarding outputs of type T; E is itself a T-output of an M-type method. The messy middle case? That's the "Near-Diagonal SUEL" variant. 

  What would count against this? If we found real-world cases where such evidence unequivocally obligates first-order belief revision without looping. Or if the granularity issue resolved cleanly via context-sensitivity alone. 

  This feels urgent for philosophy of science—it shows why meta-science can't be "just another study." The user's onto something important here.
answer: |-
  This phenomenon you're grappling with is both fascinating and under-theorized, occupying a conceptual gap between established discussions of higher-order evidence, self-undermining, and method individuation. While it lacks a canonical name, it represents a distinctive epistemic structure I'll call **Self-Undermining Evidential Loops (SUELs)**. Below is a systematic analysis addressing your core questions, its relation to existing concepts, boundary cases, and practical implications.

  ### Core Definition of SUEL
  A **Self-Undermining Evidential Loop** occurs when:
  1. **Evidence E** is produced by **method M**.
  2. **E** provides strong grounds to doubt the reliability of **M-type methods** concerning outputs of **type T**.
  3. **E** is itself a **T-output** of an **M-type method**.
  4. **The indictment is asymmetric**: E undermines positive T-outputs but not negative ones (or vice versa).

  The "near-diagonal" case (your #3) is the paradigmatic SUEL, where M-type is defined at a grain that *could* include E's source depending on description, creating indeterminacy.

  ---

  ### Addressing Your Questions
  **(a) Credence Shifts & Fixed Points**  
  SUELs *can* obligate first-order credence shifts but rarely collapse into total distrust. A non-trivial fixed point exists due to the **asymmetry**:  
  - Let *p* = credence in the positive finding (e.g., "false-positive rate is high").  
  - Let *t* = trust in M for positive T-outputs.  
  - E supports *p* directly, but also lowers *t*, which weakens E's support for *p*.  
  **Fixed Point**: Solve for *p* where the evidential force of E (weighted by *t*) balances its self-undermining effect.  
  - Example: If E claims "M produces 80% false positives," and you start with *t*₀, then *p*₁ = 0.8 * *t*₀. But E also suggests *t*₁ = 0.2 (since 20% of positives are true). Iterating, *p* converges where *p* = 0.8 * (1 - *p*). Solving gives *p* ≈ 0.44 (not 0.8 or 0).  
  - **Implication**: SUELs don't force abandonment of E; they force discounted acceptance. Total distrust is unstable (if *t*=0, E can't support *p* at all).

  **(b) Continuum vs. Discrete Cases**  
  Cases (1)-(3) form a **continuum**, not discrete kinds:  
  - **Axis**: How finely M is defined (from maximally coarse to fine).  
  - (2) is the limit where M is defined so finely that E's production method escapes its own critique (e.g., the blood test uses "memory-forming faculties" for analysis but not for result delivery).  
  - (3) occupies the fuzzy middle where M's grain is contestable.  
  - (1) is the other limit where M is defined coarsely, forcing full self-application.  
  **Key**: The continuum arises from *descriptive flexibility in method individuation*.

  **(c) Generality Problem or Novelty?**  
  The grain-sensitivity in (3) is **not merely the generality problem**:  
  - **Generality Problem**: Reliabilism's issue of arbitrarily selecting a process type (e.g., "vision" vs. "daytime vision with glasses"). Solutions appeal to normal conditions or context.  
  - **SUEL's Novelty**: The choice of grain *determines whether E indicts itself*. This forces a *normative/pragmatic* choice: Coarse grains induce self-doubt; fine grains insulate E but may seem ad hoc. Crucially, the choice depends on **background beliefs about what makes M unreliable** (e.g., is it small samples *specifically* or the broader framework?).  
  **Verdict**: SUELs expose a *dialectical* layer: Justifying grain choice requires first-order assumptions, creating circularity.

  **(d) Symmetry Matters**  
  The **one-directional** aspect is crucial and distinct:  
  - **Symmetric Undermining** (e.g., "M is 90% unreliable"): Leads to total distrust (no fixed point; E destroys all justification for believing E).  
  - **Asymmetric SUEL** ("M produces 80% false positives"): Allows fixed points because E *doesn't* undermine negative findings (e.g., "false-negative rate is low"). Trust can persist for negative results, enabling partial trust in E itself.  
  **Key**: Asymmetry prevents wholesale regress, making SUELs "manageable" unlike symmetric cases.

  ---

  ### Relation to Established Concepts
  | **Concept**          | **Relation to SUEL**                                                                 | **Distinction**                                                                 |
  |----------------------|-------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|
  | **Self-Undermining Theory** | Analogous structure (e.g., "This sentence is false")                              | SUEL targets *evidence sources*, not propositions or norms. Involves empirical methods. |
  | **Generality Problem** | Overlaps on method individuation                                                 | SUEL adds *self-application stakes*: Grain choice affects E's self-consistency. |
  | **Epistemic Akrasia** | Output state may *result* from SUEL (believing p while doubting the method)        | SUEL concerns *upstream evidence dynamics*, not rationality of beliefs.        |
  | **Bootstrapping** (Gas Gauge) | Inverted structure: Uses E to *confirm* M's reliability.                        | SUEL is *corrosive*; bootstrapping is *self-supporting*.                       |
  | **Undermining Defeat** | Case (2) is a pure instance.                                                       | SUELs involve *loops* where the defeater is produced by the defeatee.          |

  ---

  ### Boundary Cases (Looks Like SUEL But Isn't)
  1. **The Liar Paradox**  
     - *Looks like*: "This statement is false" undermines itself.  
     - *Distinction*: Purely semantic/logical, not empirical evidence about method reliability. No first-order claim about the world.

  2. **Global Skepticism (e.g., Evil Demon)**  
     - *Looks like*: Doubts all sensory methods using sensory evidence.  
     - *Distinction*: Symmetric (undermines *all* outputs), leaving no stable fixed point. SUELs require partial trust.

  3. **Disagreement about Conciliationism**  
     - *Looks like*: Conciliationism applied to itself.  
     - *Distinction*: Concerns *norms* of belief revision, not reliability of empirical methods producing evidence.

  ---

  ### Practical Implications
  - **Replication Crises**: A field facing meta-science critiques must navigate the near-diagonal SUEL:  
    - Should we define "the method" as "psychology studies" (self-undermining) or "underpowered, unregistered studies" (insulated)?  
    - **Resolution**: Justify grain choice via auxiliary evidence (e.g., mechanistic explanations for why small samples cause false positives). Meta-science can be trusted *if* its methods avoid the flaws it identifies.  
  - **Untrustworthy Sources**: If a source says "sources like me lie often," treat it as a SUEL:  
    - Asymmetric: It only indicts *positive* claims (e.g., "I exist" might still be trusted).  
    - Fixed Point: Discount but don't ignore (e.g., if it says "I report truth 20% of the time," believe its claims with ~20% credence).  

  ---

  ### Why Coin "Self-Undermining Evidential Loop"?
  - **Fits**: Captures the loop (E attacks its source), the evidential nature, and asymmetry (unlike "self-defeating").  
  - **Counts Against**: If evidence symmetrically undermines all outputs, or if no fixed point exists.  
  - **Utility**: Highlights what’s distinct—empirical methods, partial trust, grain-sensitivity with normative stakes.  

  This framework clarifies your cases: (1) is a coarse-grained SUEL, (2) is undermining without loop, (3) is the near-diagonal SUEL where grain justification is pivotal. The literature gap is real; your chapter could define this terrain.
