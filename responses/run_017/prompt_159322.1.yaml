prompt: |-
  Hi — I cover science and ideas for a living, and a philosopher friend cornered me at dinner the other night and I still haven't found the exit. Hoping you can help.

  Her target was the intuition that there is something epistemically special about *doing* a thing as opposed to reading about it. Here's what I reconstructed from my notes the next morning (I cleaned up the numbering; the spelling errors are mine):

  (1) Knowing how to do X is just a case of knowing that: knowing how to ride a bike is knowing, of some way w, that w is a way to ride a bike. Call this intellectualism. She says every anti-intellectualist alternative dies on Ryle's regress, and honestly the regress does sound convincing when she explains it.

  (2) Knowledge is of propositions, and propositions are coarse-grained in the relevant way: if it's the same proposition, then knowing it is the same piece of knowledge, however you came by it.

  (3) Knowledge-that isn't graded. You either know that p or you don't. There is no knowing-that-p *more thoroughly*, or knowing the very same thing *in a better way*.

  (4) Now take a trainee who has read and memmorized everything there is to know about bicycle riding — grant that she even knows that w is a way to ride — and set her next to a lifelong cyclist. Both know that w is a way to ride a bike.

  (5) So by (2) and (3) the two of them have the very same knowledge of how to ride. What seperates them is only execution: the cyclist's body runs w reliably, the trainee's doesn't.

  (6) If the only difference is reliability of execution, then practice, apprenticeship, muscle memory, and the feedback you get from actually trying — none of that is in the business of producing knowledge. It just tunes the machinery that carries out what you already know.

  (7) Which means: a system that has absorbed every text ever written about, say, emergency surgery knows how to perform that surgery in exactly the sense the surgeon does, and is missing only the ability to act on it. And a surgical residency teaches you nothing, epistemically speaking, that a sufficiently good manual wouldn't.

  I can't accept (7), but I also can't put my finger on where it goes wrong, and my friend just smiles and says the conclusion follows.

  Two wrinkles I should flag. First, the cyclist usually *can't tell you* what w is — ask her and she says something like "I don't know, I just do it." My friend says that's a fact about verbal access and ability to report, not about knowledge. Fine, but isn't it at least some evidence that she doesn't know that p? Second, someone at the table pointed out that reliability of execution might itself depend on stuff you can only get by doing — proprioceptive, indexical, situation-specific stuff — in which case (5) is false even if (1) is true. My friend said that move collapses back into (2) being false. I'm not sure she's right about that either.

  So: which step do you reject, and what does rejecting it cost you elsewhere? I'm especially curious about the price of each option — I've heard there's a version of the view where the trainee and the cyclist grasp the same proposition *under different modes of presentation*, one practical and one theoretical, and if that's the move then I want to know what the trainee's relation to w actually is supposed to be, because "she knows it, just worse" sounded like something that (3) forbids. And if the answer is to give up (1) and go anti-intellectualist about abilities and dispositions, I'd like to know whether the regress really is fatal or whether that's just a rhetorical habit.

  If I have to choose I'd rather keep (1) than (7) — but tell me what I'm paying, and be specific about which step looked fine and isn't.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a science and ideas journalist who got cornered by a philosopher friend arguing that knowing how to do something is just knowing that a certain way works. The key points are intellectualism, the regress argument against anti-intellectualism, and the claim that knowledge isn't graded. The friend uses the example of a trainee who's read all about biking versus a lifelong cyclist—both supposedly know the same proposition, but only the cyclist can execute it. The conclusion is that practice doesn't add knowledge, just reliability. The user rejects this, especially point 7 about surgery, but can't pinpoint the flaw.

  First, I need to recall Ryle's regress. If knowing-how requires knowing-that, then performing an action would need an infinite chain of know-that, which is absurd. But the friend uses this to support intellectualism, saying anti-intellectualism leads to regress. That's interesting because Ryle himself was anti-intellectualist. The user mentioned their friend thinks anti-intellectualist alternatives die on this regress. So I need to clarify that. Perhaps the friend is misapplying Ryle or there's a misunderstanding.

  Next, the user's two wrinkles: the cyclist's inability to articulate and the proprioceptive feedback. The friend dismisses the first as a reporting issue. The second, about execution depending on experience, the friend says would break propositionalism. So rejecting (5) by saying the propositions are different might be a way out. But then, what's the cost? If the trainee and cyclist know different propositions, that could save the difference in knowledge but might lead to an explosion of propositions. 

  The user is open to different moves but wants to know the trade-offs. They mentioned modes of presentation as a possibility. If both grasp the same proposition under different modes, one practical one theoretical, does that violate (3) which says knowledge isn't graded? Because knowing under a practical mode might count as knowing "better," which (3) denies. So that might not work unless we reject (3).

  Another option is rejecting intellectualism (1) and embracing anti-intellectualism. But the user is worried about the regress. I need to explain why Ryle's regress isn't fatal to anti-intellectualism. Anti-intellectualism doesn't reduce know-how to know-that; it's a different kind of knowledge. So the regress doesn't apply because there's no infinite chain of know-that required.

  Rejecting (2) propositionalism is another route. If knowledge can be non-propositional, then the cyclist has non-propositional know-how. But that might conflict with other areas of epistemology that rely on propositions. The cost here is redefining knowledge structures.

  Rejecting (3) allows degrees of knowledge. Maybe the cyclist knows the proposition more thoroughly. But the friend argues that knowledge-that is binary. If we say it's not, we need a theory of graded knowledge, which is complex.

  The user prefers keeping (1) over (7). So if they reject (5), saying the propositions are different, that might work. But how? The trainee knows abstract propositions, while the cyclist knows indexical, contextual ones. The cost: proliferation of propositions, especially in skill contexts. Also, the trainee might not have the fine-grained knowledge needed for execution.

  Another angle: the proprioceptive knowledge. The trainee hasn't experienced the sensations, so they lack the "what it's like" knowledge. But is that propositional? If we say yes, by adding propositions about subjective experiences, that might solve it but again leads to many propositions.

  The best move might be rejecting intellectualism (1). Anti-intellectualism avoids regress if properly framed. Ryle's regress targets intellectualism, not anti-intellectualism. The user's friend might have it backwards. So explaining that could free the user from (7) without high costs. The cost is needing a theory of non-propositional knowledge, which some epistemologists accept.

  Also, the user's role as a science journalist might appreciate empirical evidence. Motor skills involve procedural memory, different from declarative. Neuroscience supports this separation, which anti-intellectualism aligns with.

  So summarizing: reject (1), embrace anti-intellectualism. The regress isn't fatal because anti-intellectualism doesn't require intermediary know-that. Cost: rethinking knowledge without reducing everything to propositions. Benefit: saves the intuition that practice generates knowledge.
answer: |-
  Your friend's argument is razor-sharp, but I think she's smuggled in a fatal error by misapplying Ryle's regress. I'll break down where I reject the chain, the cost of rejection, and why I think the anti-intellectualist escape from the regress is viable. Spoiler: **I reject (1) — intellectualism about know-how — and argue that Ryle's regress *supports* anti-intellectualism, not undermines it.** Let's map this step-by-step.

  ### The Flawed Step: (1) and the Misuse of Ryle's Regress
  Your friend claims anti-intellectualism "dies on Ryle's regress," but this gets Ryle backwards. Ryle’s regress was *aimed at intellectualism* (the view that know-how reduces to know-that). Here’s the regress briefly:
  - If knowing how to ride a bike requires knowing *that* some proposition *p* is true (e.g., "w is a way to ride"), then performing the action requires *applying* that knowledge. But applying knowledge is itself a skill — so you’d need *another* bit of know-that to apply the first, and so on ad infinitum. This is absurd, so know-how *can’t* reduce to know-that.

  **Your friend’s error:** She uses the regress to *defend* intellectualism, claiming anti-intellectualist alternatives succumb to it. But Ryle invented the regress to *refute* intellectualism! Anti-intellectualism (e.g., Ryle’s view) *avoids* the regress by denying that know-how requires prior know-that. For Ryle, know-how is a *sui generis* capacity — a disposition to perform intelligently without consulting propositions. The regress only bites if you insist know-how *is* know-that.

  **Cost of rejecting (1):** You must accept that "knowing how to X" isn’t just a species of "knowing that." This means:
  - **Epistemological cost:** You abandon the tidy reduction of all knowledge to propositional knowledge. Know-how becomes a distinct, non-propositional category.
  - **Linguistic cost:** You must explain why "know how" grammatically parallels "know that" if they’re fundamentally different (Ryle handles this by arguing grammar misleads us).
  - **Benefit:** You dissolve the entire problem. The cyclist has *practical knowledge* (know-how); the trainee has *theoretical knowledge* (know-that). They’re different kinds of states. (7) is false because the trainee lacks know-how entirely, not just execution.

  ### Why Other Moves Fail (or Cost More)
  - **Rejecting (2) (propositionalism):** If knowledge isn’t always of propositions, the cyclist’s know-how could be non-propositional. *Cost:* This explodes standard epistemology. Belief, truth, justification — these are propositional. You’d need a new framework for non-propositional knowledge (e.g., "knowledge-of" or "knowledge-by-acquaintance"). Possible, but messier than rejecting (1).
    
  - **Rejecting (3) (non-graded knowledge):** If knowledge-that *can* be graded (e.g., "grasping a proposition more thoroughly"), the cyclist might know *the same proposition* better. *Cost:* This violates deep intuitions. If two agents believe the same true proposition with equal justification, do they really "know it to different degrees"? This risks conflating *knowledge* with *understanding* or *embeddedness*. Worse, it doesn’t clearly help: even if the cyclist "knows that w is a way" *better*, why can’t the trainee (with exhaustive texts) know it *just as well* theoretically?

  - **Rejecting (5) (same knowledge):** You could argue the cyclist and trainee know *different propositions*. The cyclist knows indexical, sensorimotor-rich propositions (e.g., "this tension in my quad stabilizes the bike *now*"). *Cost:* Proliferation of propositions. Every practical skill would require an infinite set of hyper-contextual propositions ("when *this* muscle feels *this* way, apply *that* force..."), which feels ad hoc. It also struggles with tacit knowledge: the cyclist can’t *report* these propositions, so how does she "know" them? Your friend’s "verbal access" point bites back here.

  ### Handling Your Wrinkles
  1. **The cyclist’s inability to articulate "w":** Your friend calls this a reporting issue, but it’s evidence for anti-intellectualism. If know-how were propositional, why can’t experts reliably articulate it? Tacit knowledge (Polanyi) or embodied cognition accounts better explain this. The gap between "I know" and "I can say" isn’t just access — it’s a difference in kind.

  2. **Proprioceptive/indexical knowledge:** Your friend claims this collapses (2). She’s half-right: if you insist this knowledge *must* be propositional, you get bizarre, unspeakable propositions. But anti-intellectualism avoids this cleanly. The cyclist’s skill integrates sensory feedback via *dispositions*, not silent propositions. Execution isn’t just "mechanics" — it’s constitutive of the knowledge itself.

  ### The Anti-Intellectualist Escape from the Regress
  Anti-intellectualism doesn’t succumb to Ryle’s regress — it’s the *solution* to it. For Ryle, know-how is:
  - **A complex of dispositions:** To respond adaptively to situations without internal rule consultation.
  - **Self-regulating:** Feedback (e.g., falling off the bike) trains dispositions directly, not via propositional inferences.  
  - **Not reducible to know-that:** Propositions *describe* know-how but aren’t identical to it.  

  **Cost recap:** You pay with theoretical parsimony. But the gains are worth it:  
  - Practice *does* yield new knowledge (know-how), not just mechanical tuning.  
  - Surgical residency teaches embodied skill, irreplaceable by texts.  
  - You keep commonsense intuitions intact while dodging absurdities like (7).  

  ### Bottom Line
  Reject (1). Intellectualism is the poison pill here — and Ryle’s regress shows why. The cost is a pluralistic epistemology where know-how stands alongside know-that. But that’s a feature, not a bug: science itself relies on tacit, skilled knowledge (e.g., lab techniques). Your friend’s smile is well-earned — her argument is clever — but it collapses under its own regress. The exit is marked "anti-intellectualism." Walk through it.
