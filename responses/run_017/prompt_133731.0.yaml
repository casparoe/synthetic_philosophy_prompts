prompt: |-
  Corridor argument I keep loosing, and I'm teaching Austin next term, so I'd like to get it straight before I stand up in front of thirty undergraduates.

  Our legal theory lot run everything off one analogy: an utterance is a move in a rule-governed practice, like chess. Force, they say, is constituted by the rules plus the players' recognition of the move – the old practice-conception of constitutive rules, the counts-as clause, all that – so all a speech act needs is a speaker with standing, a well-formed move, and uptake. They then use it to settle something we actually argue about in college meetings: whether an institution can apologise. On their telling, a vice-chancellor's authorised statement of apology is a full apology; the complaint that no one meant it is a category error, sincerity was never part of the move; and anyone calling it a non-apology is just muddling an abuse with a misfire.

  I want the audit, please: what maps onto what (board, turn-taking, rulebook, umpire, win condition, illegal move), where the mapping goes wrong, and whether their conclusion survives once the disanalogies are on the table.

  Three things I keep getting stuck on. One: I suspect the source already contains the target – in correspondence chess you make your move by writing it down, and a call in bridge or a bid at auction just is a speech act – so how much work can chess be doing as an analysis of saying something? Two: has the analogy even got room for Austin's void-misfire versus hollow-abuse split? An illegal move looks void, which would make every infelicity a misfire and hand them their conclusion far too cheaply; but you can also play a legal move for the wrong reasons, in a fixed game, which suggests the split survives after all. Three: what does it smuggle in – a codified rulebook, an umpire, an agreed point to the whole business, players who share a goal, a closed field you can step out of?

  My test case, which I made up to break it: a college apologises for what a predecessor body did in 1892; nobody alive did it, nobody alive was wronged, the descendants are in the room to recieve it, and the words are read by an actor the college hired. Is that an apology on their picture, and is it a better or worse one than the vice-chancellor's?

  And if the analogy won't carry it, what would – the conversational scoreboard picture, rehearsal and script, something else?
reasoning: |-
  Okay, the user is grappling with the corridor argument in legal theory, specifically using the chess analogy for speech acts. They need to clarify this before teaching undergraduates. The core issue is whether institutions can apologize based on the rules-plus-uptake model. They have three main sticking points: whether the analogy is circular, how Austin's infelicities map onto the model, and what hidden assumptions the analogy smuggles in. 

  First, I need to unpack the chess analogy as used by their colleagues. The key mappings are: board → institutional context, moves → speech acts, rules → constitutive rules, players → participants with standing, umpire → authoritative interpreters, win condition → institutional goals. But the disanalogies are crucial here. Chess has codified rules, while institutional speech acts often rely on fuzzy norms. Chess moves don't require psychological states, but apologies inherently do - that's where the analogy leaks. 

  The user's test case is revealing: a 1892 apology delivered by an actor to descendants. On the strict rules-plus-uptake view, this should count as an apology if procedurally correct. But intuitively it feels hollow - which exposes how the chess model suppresses the sincerity dimension. Austin's abuse/misfire distinction doesn't map cleanly because chess lacks parallel concepts; an "insincere" but legal move isn't penalized, unlike an insincere apology which remains defective. 

  What the user might not be explicitly stating but seems troubled by is how this model privileges institutional power over moral repair. When they mention "smuggled assumptions", they're rightly spotting the model's hidden formalism. The chess analogy works better for declaratives ("I adjourn the meeting") than expressives like apologies. 

  Alternative frameworks could help: Lewis' scorekeeping model accounts for contextual shifts, while rehearsal/script analogies better capture the ritual aspect. But ultimately the user needs to show undergraduates why the chess model isn't wrong, just incomplete - it explains validity but not felicity. Their teaching challenge is to validate the legal theorists' procedural insight while exposing where morality exceeds the rules.
answer: |-
  Here's a full audit of the chess analogy for speech acts, addressing your core concerns and test case, designed to equip you for both the corridor and the classroom:

  **The Chess Analogy Mapped:**
  1.  **The Board:** The institutional/social context enabling the speech act (e.g., the university governance structure, the specific meeting rules, the historical relationship).
  2.  **The Turn-Taking:** The procedural rules governing who can speak when and on what topic (e.g., agenda order, recognized speakers, points of order).
  3.  **The Rulebook:** The constitutive rules defining valid moves *as* specific institutional acts ("In context C, uttering sentence S by person P counts as Apology/Resolution/Appointment"). This is the core "counts-as" clause.
  4.  **The Umpire/Referee:** The recognized authority interpreting and enforcing the rules (e.g., the Chair of the meeting, governing statutes, precedent, sometimes collective recognition by participants).
  5.  **Win Condition/Point of the Game:** The institutional goals or functions (e.g., resolving disputes, making decisions, maintaining order, fostering community, managing reputation – *but not necessarily sincere reconciliation*).
  6.  **Illegal Move:** A move violating the constitutive or procedural rules, rendering it void ("misfire" in Austin) – e.g., an unauthorized person attempting to apologize, using an incorrect formula.
  7.  **Legal Move:** A move conforming to the rules, constituting the intended institutional act ("uptake" is the recognition of this by participants), regardless of motive or sincerity ("abuse" in Austin). This is where the "apology is constituted" claim lands.

  **Where the Mapping Goes Wrong (Key Disanalogies):**
  1.  **Psychological States are Intrinsic to Many Speech Acts:** Chess rules define moves purely by physical configuration and sequence. Apology rules *conceptually reference* psychological states (regret, acknowledgment of fault) even if the constitutive rule doesn't *require* their presence for validity. Sincerity isn't just a nice extra for apologies; it's part of the *concept*. The chess analogy obscures this by making psychological states entirely optional. A chess move *is* just the physical act; an apology *purports to express* an internal state.
  2.  **Rule Codification & Clarity:** Chess has a near-perfectly codified rulebook. Institutional contexts are messy: rules are often unwritten, contested, interpretive, layered (legal, social, moral), and evolve. The "rulebook" for institutional apologies is rarely this clear-cut.
  3.  **The "Point" of the Game is Different:** Chess has a clear, internal winning condition. Institutional interactions have multiple, often conflicting, overlapping, and sometimes unstated goals: legal compliance, moral repair, public relations, power dynamics, historical reconciliation, community healing. An institutional apology might "win" the PR "game" while utterly failing the moral repair "game." The chess analogy flattens this complexity.
  4.  **Umpire Authority:** Chess has a clear, designated umpire. Institutional contexts often lack a single, uncontested authority. Interpretation and "uptake" can be fragmented – the Chair, the governing body, the recipient group, the public might all "uptake" differently. Whose uptake counts?
  5.  **The "Closed Field" Fallacy:** Chess is a self-contained system. Institutional speech acts exist within open-ended social, moral, and historical contexts. Stepping "out of the game" (e.g., criticizing an apology as hollow) isn't always a category error; it might be appealing to a broader set of norms *beyond* the immediate institutional constitutive rules.
  6.  **The Primacy of Convention:** The analogy overemphasizes *constitutive convention* at the expense of *communication and perlocution*. While conventions enable the act, the *force* of an apology relies heavily on its perceived communicative intent and effect, which conventions alone cannot guarantee.

  **Addressing Your Three Sticking Points:**

  1.  **Circularity (Source Contains Target):** Your instinct is correct. Games like chess, bridge, and auction *are themselves* institutional speech acts governed by constitutive rules. Using them as an *analysis* of speech acts risks being circular or at best illustrative rather than foundational. The analogy shows *how* constitutive rules work in *one specific domain* (formal games), but it doesn't necessarily provide a deep *analysis* of the nature of meaning or force in less codified domains like apology. It demonstrates the mechanism but doesn't fully explain the phenomenon.
  2.  **Austin's Void/Misfire vs. Hollow/Abuse Split:** The analogy *can* accommodate it, but **imperfectly**:
      *   **Misfire (Void):** Maps cleanly to an **illegal move**. No apology occurs because the rules weren't followed (wrong speaker, wrong formula, wrong context). The act is void.
      *   **Abuse (Hollow):** Maps to a **legal move played insincerely or for wrong reasons**. The apology *is* constituted as an institutional act ("uptake" recognizes it as the official apology). However, it's defective/hollow because the sincerity condition is violated. The chess analogy *allows* for this distinction (a legal but "cheating" or "pointless" move), but **downplays its significance**. In chess, a legal move *is* the move, regardless of intent. For apologies, the lack of sincerity *fundamentally undermines the act's core purpose and meaning*, even if it remains a valid institutional token. The analogy smuggles in the idea that validity is all that matters for the act *being* the act.
  3.  **Smuggled Assumptions:** The analogy implicitly relies on:
      *   **Strong Codification:** Assumes rules are clear and agreed upon.
      *   **Clear Authority:** Assumes an umpire exists to resolve disputes.
      *   **Agreed Purpose:** Assumes participants share the "win condition" (e.g., procedural correctness over moral repair).
      *   **Self-Containment:** Assumes the "game" is the primary relevant context.
      *   **Player Parity/Shared Goals:** Assumes participants are playing the same game with similar understandings (often untrue in real institutional conflict).
      *   **Psychological Irrelevance:** Treats internal states as entirely external to the definition of the act.

  **Does the Conclusion Survive? (The Institutional Apology)**

  *   **On the Chess Analogy's Terms:** Yes, it survives robustly. If the constitutive rules of the university authorize the Vice-Chancellor (VC) to issue apologies on its behalf, and they utter the correct formula in the correct context, and it receives uptake (is minuted, acknowledged), then it *is* the institution's apology. Calling it a "non-apology" is, strictly within this model, a category error. It's a defective (abused) apology, not a non-apology (misfire). The sincerity of the VC or the institution "as a whole" is irrelevant to the act's existence as the institutional apology token.
  *   **Once Disanalogies Are On the Table: The Conclusion Weakens Significantly.** While the act *may* be a valid institutional token, the disanalogies highlight why calling it a *full* apology is problematic:
      *   **Intrinsic Sincerity:** The lack of felt regret/acknowledgment undermines its core meaning.
      *   **Multiple Points/Purposes:** It may satisfy the procedural/PR "game" but fail the moral repair "game." Calling it hollow *is* a valid critique from the perspective of the latter game.
      *   **Contested Rules/Uptake:** The "rule" authorizing the VC might be contested. Uptake from the wronged party might be absent or negative.
      *   **Beyond the Closed Field:** Moral and social norms demand more than just procedural correctness for an apology to be meaningful. Dismissing this as a "category error" ignores the lived reality of the apology's reception and effect.
      *   **The Analogy's Blind Spot:** It struggles to account for acts where the psychological state is not merely accompanimental but *constitutive of the act's point*.

  **Your Test Case: The 1892 Apology by Actor**

  *   **On the Chess Analogy:** If the college's rules authorize such a statement, delivered by an authorized proxy (the actor, hired appropriately), in the correct forum, and it receives uptake (minuted, accepted by the descendants?), then **YES, it is an institutional apology** on this model. It's likely seen as an even *more* hollow instance (abuse) than the VC's apology, but still an apology token. The lack of living perpetrators/victims is irrelevant to the constitutive rule – the rule defines who *can* apologize *for* the past institution. The actor is merely a mouthpiece; the college is the speaker.
  *   **Beyond the Analogy:** This case starkly exposes the model's limitations. While it might constitute a *formal gesture of accountability* or *historical acknowledgment* under the rules, calling it a *sincere apology* is deeply questionable, likely offensive. The lack of any connection to the original wrong or its victims makes the expression of regret ring entirely false. It satisfies a procedural rule but likely fails the communicative and moral functions essential to an apology being *received* *as such*.

  **Better Analogies/Frameworks:**

  1.  **Conversational Scoreboard (Lewis, Stalnaker):** More dynamic. Treats context as a constantly updated "scoreboard" tracking presuppositions, commitments, permissions, etc. Speech acts change the score.
      *   *Pro:* Handles context-dependence, accommodation, and the dynamic nature of interaction better. Explains how infelicities can be "accommodated" or lead to negotiation. Distinguishes between changing the score (illocution) and further effects (perlocution).
      *   *Con:* Can be abstract. Less intuitive for rigid institutional rules. Doesn't *fully* solve the sincerity issue for expressives like apologies, though it tracks commitments (e.g., committing to regret being on the scoreboard).
  2.  **Ritual/Script/Rehearsal:** Views institutional speech acts as performances following culturally defined scripts.
      *   *Pro:* Captures the formulaic, often insincere nature of many institutional acts. Explains the *form* of the VC's apology or the 1892 actor-apology. Highlights how "going through the motions" can satisfy procedural requirements without fulfilling deeper meaning. Makes sense of the actor's role.
      *   *Con:* Risks overemphasizing performance and downplaying the possibility of genuine institutional feeling or responsibility. Less focused on constitutive rules.
  3.  **Joint Commitment/Collective Intentionality (Gilbert, Searle later work):** Explores how institutions form agents capable of belief, intention, and action (like apologizing) through the joint commitments of members.
      *   *Pro:* Directly addresses the "can an institution *mean* it?" question. Provides a framework for genuine (though collective) sincerity and responsibility.
      *   *Con:* Complex, philosophically contested. Requires explaining how individual commitments aggregate into collective ones. Might still struggle with historical acts disconnected from current members.

  **Teaching Strategy Recommendation:**

  1.  **Start with the Analogy:** Explain the chess mappings clearly. Show its power for declaratives ("I name this ship...", "I find the defendant guilty") and directives ("Meeting adjourned!") within codified institutions. Show how it gets them their conclusion on institutional apologies.
  2.  **Introduce Austin Rigorously:** Distinguish Misfire (Void) vs. Abuse (Hollow). Emphasize that for expressives like apologies, thanks, congratulations, the sincerity condition is *part of the act's essence*, even if not required for its *uttering* to *occur*.
  3.  **Deploy the Disanalogies:** Systematically go through them. Hammer home **Intrinsic Psychological States** and **Multiple Points/Purposes**. Use the VC apology example to show how the analogy *allows* for hollow acts but *hides* why that hollowness matters. Contrast declaratives (where sincerity is often less central) with expressives.
  4.  **Break it with Your Test Case:** Show how the analogy forces the conclusion ("Yes, it's an apology token") but how intuitively unsatisfying and morally problematic that is. This highlights the model's limitations.
  5.  **Introduce Alternatives:** Briefly sketch scorekeeping (dynamic context) and ritual/script (performance) as ways to understand the *form* and *procedural validity* without claiming they capture the *full moral force* of an apology. Mention collective intentionality as a potential route to genuine institutional sincerity.
  6.  **Conclusion:** The chess analogy is a powerful tool for understanding how constitutive rules create institutional facts and valid tokens of speech acts *within a procedural framework*. However, it is insufficient, and potentially misleading, for understanding speech acts like apology, where sincerity, moral repair, and genuine communication are central to their meaning and function, even if not strictly required for their *institutional issuance*. Institutional apologies can be procedurally valid yet morally hollow. Dismissing critiques of hollowness as mere "category errors" ignores the complex, multi-layered nature of social and linguistic reality. Law often needs clear rules; morality and meaning demand more.

  This approach validates the legal theorists' point about procedural validity while firmly establishing its limits, preparing students to engage critically with both the theory and real-world institutional pronouncements. Good luck with the undergrads!
