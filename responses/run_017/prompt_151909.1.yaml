  We are designing a diagnostic flowchart to sort students by their commitments about the relation between descriptive and evaluative claims, without using any -ism labels. The flowchart will have one preliminary question to detect if the student can hear the descriptive/evaluative distinction, then nine branch questions. We aim to cover at least the leaves: definitional naturalism, a posteriori identity naturalism, irreducible non-naturalism with brute necessary covariation, constitutivism, projectivism/expressivism, error theory (split into abolitionist and conservationist if necessary), and quietism/deflationism. We'll also note combinations that are unoccupied and pairs of leaves that the tree cannot separate.

  ### Preliminary Question (not counted in the nine):
  This is to check if the student can distinguish descriptive and evaluative claims.

  **Question 0:** Consider the following two statements:
     - "The water in the pot is boiling at 100 degrees Celsius."
     - "You ought to turn off the stove now to prevent the pot from boiling over."

  Which of the following best captures the difference between these two statements?
     A. The first describes a state of affairs, while the second tells you what you should do.
     B. The first is about the physical world, and the second is about social norms.
     C. I don't see a fundamental difference; both are about what is happening and what will happen.

  *Scoring:* If the student answers C, they may not grasp the distinction and we note that. We proceed with the diagnostic but flag that the student might not be operating with the required distinction.

  ### The Nine Branch Questions:

  We will build the tree by separating three claims early:
    1. The logical gap: that no normative conclusion can be validly derived from purely non-normative premises.
    2. The conceptual gap: that evaluative vocabulary cannot be defined in purely descriptive terms.
    3. The metaphysical gap: that evaluative facts are (or are not) something over and above descriptive facts, with epistemological consequences.

  We'll use the cases provided and add more as needed.

  **Question 1 (Logical Gap):** Consider an argument with premises that are entirely non-normative (they only describe the world, without any 'ought', 'good', 'right', etc.) and a conclusion that is normative (like 'you ought to do X'). Can such an argument ever be logically valid? 
     A. Yes, it is possible for such an argument to be valid.
     B. No, such an argument can never be valid.

  *Note:* This addresses the no-derivation claim (Hume's is/ought gap). If they answer A, they reject the logical gap.

  **Question 2 (Logical Gap follow-up for those who answered A in Q1):** Now, consider an argument that has no normative premises and validly yields a wildly false normative conclusion (like 'you ought to torture innocent children for fun'), by way of a disjunctive premise whose other disjunct is plainly false (e.g., "Either the moon is made of green cheese or you ought to torture innocent children for fun. The moon is not made of green cheese. Therefore, you ought to torture innocent children for fun."). Does this argument show that the original claim (that no normative conclusion can be validly derived from non-normative premises) is false? 
     A. Yes, because the argument is valid and has non-normative premises, so it refutes the claim.
     B. No, because the claim was never about validity in that narrow sense; it was about substantive derivation of normative truths.

  *Note:* This uses case 2. If they answer A, they think the logical gap is refuted by such a valid argument. If B, they think the gap is about something more than formal validity.

  **Question 3 (Conceptual Gap):** Someone fully understands the concept of maximizing aggregate happiness and asks, of an act that does exactly that, whether it is good. Is this question conceptually confused? 
     A. Yes, because if an act maximizes happiness, then by definition it is good; so the question is confused.
     B. No, the question remains intelligible; knowing that an act maximizes happiness doesn't settle whether it is good.

  *Note:* This uses case 1. Answer A suggests that the evaluative term 'good' can be defined by the descriptive property (maximizing happiness). Answer B rejects that definition.

  **Question 4 (Conceptual Gap follow-up for those who answered B in Q3):** Can two communities use the same evaluative word (like 'wrong') but apply it to different descriptive patterns? And when one says an act is wrong and the other says it is not, are they disagreeing about one thing, or are they saying compatible things in different vocabularies?
     A. They are disagreeing about one thing: whether the act is wrong.
     B. They are saying compatible things because they are using the word 'wrong' with different meanings.

  *Note:* This uses case 5. Answer A suggests that the meaning of the evaluative term is not fixed by the descriptive patterns (so the term has a meaning that goes beyond the descriptive). Answer B suggests that the meaning is tied to the descriptive patterns (so it's like two different definitions).

  **Question 5 (Metaphysical Gap):** Two acts are alike in every descriptive respect (same consequences, same intentions, same everything non-evaluative). Could one of them be morally obligatory and the other not?
     A. No, if two acts are descriptively identical, they must have the same moral status.
     B. Yes, it is possible that one is obligatory and the other is not.

  *Note:* This uses case 3. Answer A accepts a necessary connection between descriptive and evaluative facts. Answer B denies it.

  **Question 6 (Metaphysical Gap follow-up for A in Q5):** If two descriptively identical acts must have the same moral status, does this necessary connection require an explanation (like the moral properties being identical to descriptive properties, or constituted by them, or a law-like connection), or is it a basic fact with no further explanation?
     A. It requires an explanation (e.g., identity, constitution, or law).
     B. It is a basic fact that needs no further explanation.

  **Question 7 (Normativity of Institutions):** A person says, "I promise to pay you five dollars." Does the existence of the institution of promising alone (a descriptive fact about social practices) imply that the person ought to pay, or do we need an additional normative premise (like "one ought to keep promises") to get the conclusion that he ought to pay?
     A. The institution alone implies he ought to pay; no additional normative premise is needed.
     B. We still need an additional normative premise.

  *Note:* This uses case 4. Answer A suggests that the normativity is built into the institution (so the gap can be bridged by social facts). Answer B maintains that the gap remains.

  **Question 8 (Reasons for Action):** Consider an agent who is wholly unmoved by moral considerations. When she asks, "What reason do I have to act morally?", is there an answer that does not depend on what she happens to want?
     A. Yes, there is a reason for her to act morally regardless of her wants.
     B. No, without some desire or motivation she has, there is no reason for her to act morally.

  *Note:* This uses case 6. Answer A suggests that reasons are objective. Answer B suggests that reasons are desire-dependent.

  **Question 9 (Embedded Moral Clauses):** Consider a sentence like: "If it is wrong to cheat, then it is wrong to get someone else to cheat." Is this the sort of thing that can be true or false? And does its truth require that the embedded clause ("it is wrong to cheat") is true?
