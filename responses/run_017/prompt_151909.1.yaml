    Alternatively, we can make it one leaf and note the split in the scoring key.

  - **Quietism/Deflationism**:
     - They might answer in a way that avoids the questions. For example, they might say that the whole framework of the questions is misguided. We can detect them by their answer to Q9? They might say that moral sentences are truth-apt in a deflationary sense, but they reject the metaphysical questions. So they might answer Q1: B? (or they might not) and then they will be sorted as non-naturalists or naturalists? But they want to reject the distinction.

    We can use Q9: they might say A or B, but they would reject the need for a metaphysical explanation. But they might be placed in the non-naturalist branch by accident.

    Alternatively, we can have a question that directly asks about the metaphysical gap: do you think there is a substantial question about whether evaluative facts are something over and above descriptive facts? But we can't use that because we don't want to use philosophical terms.

    We might not have a direct way. We can use a combination that doesn't fit any standard position.

    But let's try to capture them by their rejection of the project. For example, in Q6, if they say it's basic, but then in subsequent questions they express quietism, we might not distinguish from non-naturalism. 

    Perhaps we can use Q3: they might say B (the question is intelligible) but then in Q4 they say A, and then Q5: A, and then Q6: B, but then in Q7, Q8, Q9 they give answers that are hard to fit. Or they might say in Q2: B (the gap is not about formal validity) and then in other questions they are not committed. 

    This is difficult. We might need to accept that quietism is detected by a pattern that doesn't fit elsewhere. Or we can have a specific question.

    Given the constraints, we will design the tree and then note that quietism is a catch-all for some patterns.

  ### Revised Tree with Nine Questions:

  We'll design the tree to have the following order:

  0. Preliminary (descriptive/evaluative distinction)

  1. Q1 (Logical gap: valid derivation?)
     - A -> Q2
     - B -> Q3

  2. Q2 (for those who said A in Q1): Does the valid argument with a false normative conclusion refute the gap?
     - A -> then skip to Q3? Or go to Q3? We go to Q3.
     - B -> Q3

  3. Q3 (Conceptual gap: is the question about maximizing happiness and good confused?)
     - A -> definitional naturalist path -> then Q5
     - B -> Q4

  4. Q4 (for those who said B in Q3): In the case of two communities, are they disagreeing or using different vocabularies?
     - A -> Q5
     - B -> then they are relativists? But we go to Q5? Or we can note that this might lead to error theory or expressivism? We go to Q5.

  5. Q5 (Metaphysical gap: same descriptive, different moral possible?)
     - A -> Q6
     - B -> then they are anti-realists -> Q9 (embedded clauses)
     - C (if added): error theory -> then skip to Q7? Or we can make it three options.

  Given the complexity, we will not add option C in Q5. Instead, we will rely on later questions to sort anti-realists. So:

     - A -> Q6
     - B -> Q7 (but then we have to ask Q7 to everyone? Or we branch to a different path)

  We decide to ask Q7, Q8, Q9 to everyone. Then we can use the combination.

  So after Q5, we ask Q6 only to those who said A. Then everyone answers Q7, Q8, Q9.

  6. Q6 (for those who said A in Q5): Does the necessary connection require explanation?
     - A -> then they are naturalists or non-naturalists with a law? We'll use later questions.
     - B -> irreducible non-naturalism

  7. Q7 (Institutions): 
     - A or B

  8. Q8 (Reasons): 
     - A or B

  9. Q9 (Embedded clauses): 
     - A, B, or C

  Then we score by the pattern.

  ### Scoring Key:

  We'll define the leaves by answer patterns. Note: paths might be partial because some questions are skipped.

  - **Definitional naturalism**:
     - Q3: A
     - Q5: A
     - Q6: A (requires explanation)
     - Q7: A (institution alone implies ought)
     - Q8: A (reasons objective)
     - Q9: A (truth-conditional, embedded clause must have truth value)

     Awkward commitment: They have to say that anyone who understands the descriptive concept but questions the evaluation is confused.

  - **A posteriori identity naturalism**:
     - Q3: B
     - Q4: A (disagreeing)
     - Q5: A
     - Q6: A (requires explanation)
     - Q7: B (needs extra premise)
     - Q8: A (reasons objective)
     - Q9: A

     Awkward commitment: They have to say that moral truths are discovered by science, and it is necessary that, for example, goodness is happiness-maximizing, but we couldn't know that without empirical investigation.

  - **Irreducible non-naturalism (brute necessary covariation)**:
     - Q3: B
     - Q4: A (disagreeing)
     - Q5: A
     - Q6: B (basic, no explanation)
     - Q7: B (needs extra premise)
     - Q8: A (reasons objective)
     - Q9: A

     Awkward commitment: There is no explanation for why the descriptive facts give rise to the moral facts; it's a brute necessity.

  - **Constitutivism**:
     - Q1: B (no derivation)
     - Q3: B
     - Q4: A (disagreeing)
     - Q5: A
     - Q6: A (requires explanation) -> and they would say the explanation is in agency
     - Q7: A or B? They might say A if they think the institution of promising is part of agency, or B if they think we need a premise about the normativity of agency. We can leave it open.
     - Q8: A (reasons objective, from agency)
     - Q9: A

     But to distinguish from naturalism, notice they might say in Q7: B (because the normativity comes from agency, not from the institution alone). So we can require Q7: B.

     Awkward commitment: They have to say that even an agent who rejects morality is still committed to moral reasons by virtue of being an agent.

  - **Projectivism/Expressivism**:
     - Q5: B (different moral status possible) -> then they are in the anti-realist branch.
     - Q9: C (not truth-apt)
     - Q8: B (reasons depend on desires)
     - Q7: B (needs extra premise, which is an expression of attitude)

     Also, they would have:
     - Q3: B
     - Q4: A (disagreeing, in attitude)

     Awkward commitment: They have to say that when we say "murder is wrong" we are not stating a fact but expressing an attitude, so moral disagreements are not about facts.

  - **Error theory (conservationist and abolitionist)**:
     - Q5: B (different moral status possible) -> then they are in the anti-realist branch.
     - Q9: A or B? They think moral sentences are truth-apt but false, so they would say A (truth-conditional and requires the embedded clause to have truth value, but it's false).
     - Q8: B (reasons depend on desires)
     - Q7: B (needs extra premise, which is false)

     Also, they would have:
     - Q3: B
     - Q4: A (disagreeing, but both false)

     Awkward commitment: They have to say that all positive moral claims are false.

     We do not split conservationist and abolitionist because we don't have a question for that.

  - **Quietism/Deflationism**:
     - This is hard. They might give answers that are not consistent with any of the above. For example, they might say in Q1: B, Q3: B, Q4: A, Q5: A, Q6: B, but then in Q7, Q8, Q9 they give answers that are minimalist. Or they might reject the questions. We can define a pattern that is across the board minimalist. For example:
          Q2: B (if they went to Q2) -> the gap is about substantive derivation, but then they might not endorse any metaphysical view.
          Q6: B or A? They might avoid.
          Q9: A or B in a deflationary sense.

     But we can't define it precisely. Alternatively, we can have them inexpressible in the tree. We'll note in the scoring key that if a pattern doesn't fit, it might be quietism.

     Awkward commitment: They have to say that the whole project of trying to explain the relation between descriptive and evaluative is based on a mistake, so they don't provide an explanation.

  ### Unstable Combinations:

  We will note in the scoring key that certain answer combinations are unstable and reveal tension. For example:

  - If someone says Q3: A (definitional) and then Q4: A (disagreeing), but if they are definitional naturalists, they should say Q4: B (compatible) because if the descriptive facts are the same, then the evaluation is the same by definition, but if two communities use the word for different patterns, then they are using different definitions. So they should say B. If they say A, it's unstable.

  - If someone says Q5: A (same descriptive, same moral) and then Q6: B (basic), and then Q7: A (institution hands you the ought), that might be unstable because if the connection is basic and unexplained, how can the institution hand you the ought without an extra premise? 

  ### Empty Cells:

  1. **Definitional naturalism cell**: This is empty in contemporary metaethics because of Moore's open question argument. If goodness is defined as maximizing happiness, then the question "I know this act maximizes happiness, but is it good?" should be closed and confused. But it doesn't seem confused; it seems open. So it's unattractive.

  2. **Combination: Q1: A, Q2: B, Q3: A, Q5: B**: This would be someone who thinks you can sometimes derive 'ought' from 'is' (but not in the trivial example), and also thinks the conceptual gap is closed (definitional), but then thinks that two descriptively identical acts could have different moral status. This is incoherent because if 'good' is defined by descriptive properties, then same descriptive properties must yield the same moral status. So empty because incoherent.

  3. **Combination: Q1: B, Q3: A, ...**: If they say Q1: B (no derivation) and Q3: A (definitional), then they think you can't derive 'ought' from 'is' but you can define evaluative terms by descriptive ones. This might be coherent if they think the definition is not available for derivation? But it's odd. It might be unexplored.

  ### Pairs of Leaves the Tree Cannot Separate:

  1. **Error theory and expressivism**: Both might have the same pattern: Q5: B, Q7: B, Q8: B, Q9: ? 
     - For error theory, Q9: A or B? (They think moral sentences are truth-apt, so A)
     - For expressivism, Q9: C
     So if we have only these, we can separate by Q9. But if the expressivist allows for minimal truth and says B, then we cannot separate. But we have option C for expressivism.

     However, if an expressivist says that embedded contexts are handled by a different semantics and says B, then we might not capture them. But option C is designed for them. So hopefully we can separate by Q9.

  2. **Conservationist and abolitionist error theory**: We do not separate them. To separate, we would need a question: "Given that there are no moral facts, should we stop using moral language?" 
     - A. No, it is useful to keep using it.
     - B. Yes, because it is systematically false.
     This is a beginner-friendly question.

  ### The Flowchart:

  We'll write the flowchart in text form, with branches.

  Start at Q0.

  **Q0: Descriptive vs Evaluative (preliminary)**
     A. The first describes a state of affairs, while the second tells you what you should do.
     B. The first is about the physical world, and the second is about social norms.
     C. I don't see a fundamental difference; both are about what is happening and what will happen.

  Then:

  **Q1: Can an argument with only non-normative premises and a normative conclusion ever be logically valid?**
     A. Yes.
     B. No.

  If A to Q1, then:
     **Q2: Does the example with the disjunction (either the moon is green cheese or you ought to torture children, and the moon is not, so you ought to torture children) refute the claim that you can't derive 'ought' from 'is'?**
          A. Yes.
          B. No.

  Then proceed to Q3.

  If B to Q1, then proceed to Q3.

  **Q3: If someone knows an act maximizes happiness and asks if it is good, is this question conceptually confused?**
     A. Yes.
     B. No.

  If A to Q3, then proceed to Q5.

  If B to Q3, then:
     **Q4: Two communities use 'wrong' for different patterns. When one says an act is wrong and the other says it is not, are they:**
          A. Disagreeing about whether the act is wrong.
          B. Saying compatible things because they mean different things by 'wrong'.

  Then proceed to Q5.

  **Q5: Two acts are alike in every descriptive respect. Could it be that one is morally obligatory and the other is not?**
     A. No, they must have the same moral status.
     B. Yes, it is possible.

  If A to Q5, then:
     **Q6: Does this necessary connection (that descriptively identical acts have the same moral status) require an explanation?**
          A. Yes.
          B. No, it is basic.

  Then proceed to Q7.

  If B to Q5, then proceed to Q7.

  **Q7: A person says "I promise to pay you five dollars." Does the institution of promising alone imply that he ought to pay?**
     A. Yes.
     B. No, we need an extra normative premise.

  **Q8: An agent asks, "What reason do I have to act morally?" and she has no desire to act morally. Is there a reason for her to act morally anyway?**
     A. Yes.
     B. No.

  **Q9: Consider: "If it is wrong to cheat, then it is wrong to get someone else to cheat." Which is true?**
     A. This can be true or false, and its truth requires that the embedded clause ("it is wrong to cheat") is either true or false (as appropriate).
     B. It can be true or false, but its truth does not require the embedded clause to be true or false because it's conditional.
     C. It isn't true or false; it's an expression of attitude or a rule.

  ### Scoring Key for Leaves:

  We'll define the leaves by the pattern of answers. We denote:
  - For skipped questions, they are not part of the pattern for that leaf.

  1. **Definitional naturalism**:
     - Q3: A
     - Q5: A
     - Q6: A
     - Q7: A
     - Q8: A
     - Q9: A

     Awkward commitment: They have to say that anyone who understands the descriptive concept but questions the evaluation is confused.

  2. **A posteriori identity naturalism**:
     - Q3: B
     - Q4: A
     - Q5: A
     - Q6: A
     - Q7: B
     - Q8: A
     - Q9: A

     Awkward commitment: They have to say that moral truths are discovered by science, and it is necessary that, for example, goodness is happiness-maximizing, but we couldn't know that without empirical investigation.

  3. **Irreducible non-naturalism**:
     - Q3: B
     - Q4: A
     - Q5: A
     - Q6: B
     - Q7: B
     - Q8: A
     - Q9: A

     Awkward commitment: There is no explanation for why the descriptive facts give rise to the moral facts; it's a brute necessity.

  4. **Constitutivism**:
     - Q3: B
     - Q4: A
     - Q5: A
     - Q6: A
     - Q7: B  (normativity from agency, not institution alone)
     - Q8: A
     - Q9: A

     Awkward commitment: They have to say that even an agent who rejects morality is still committed to moral reasons by virtue of being an agent.

  5. **Projectivism/Expressivism**:
     - Q3: B
     - Q4: A
     - Q5: B
     - Q7: B
     - Q8: B
     - Q9: C

     Awkward commitment: They have to say that when we say "murder is wrong" we are not stating a fact but expressing an attitude, so moral disagreements are not about facts.

  6. **Error theory**:
     - Q3: B
     - Q4: A
     - Q5: B
     - Q7: B
     - Q8: B
     - Q9: A

     Awkward commitment: They have to say that all positive moral claims are false.

     (Note: We do not split conservationist and abolitionist.)

  7. **Quietism/Deflationism**:
     - This is a catch-all for patterns that don't fit elsewhere, especially if they avoid metaphysical commitments. For example, they might answer:
          Q6: B (if asked) and then in Q9: A or B in a deflationary way.
          But also, they might answer in a minimalist way across the board.

     We might not have a specific pattern. We can say: if the pattern is not captured by the above, it might be quietism.

     Awkward commitment: They have to say that the whole project of trying to explain the relation between descriptive and evaluative is based on a mistake, so they don't provide an explanation.

  ### Unstable Combinations and Empty Cells:

  - **Unstable**: 
     - If Q3: A and Q4: A, this is unstable because definitional naturalists should say Q4: B.
     - If Q5: A and Q6: B and Q7: A, this might be unstable: if the connection is basic, how can the institution hand you the ought without an extra normative premise? It suggests the institution can bridge the gap without explanation, which might conflict with the bruteness.

  - **Empty Cells**:
     1. **Definitional naturalism cell**: Unattractive because of the open question argument.
     2. **Combination: Q1: A, Q2: B, Q3: A, Q5: B**: Incoherent because if evaluative terms are defined by descriptive properties (Q3:A), then same descriptive properties must yield the same evaluation (Q5:A), but here Q5:B says they can be different.
     3. **Combination: Q1: B, Q3: A, ...**: Unexplored. It is coherent if they think you can define evaluative terms by descriptive ones but still not derive 'ought' from 'is' because the definition is not available in the premises? But it's odd and not held.

  ### Pairs the Tree Cannot Separate:

  1. **Constitutivism and a posteriori naturalism**: Both have the same pattern: Q3: B, Q4: A, Q5: A, Q6: A, Q8: A, Q9: A. The only difference is Q7: constitutivism says B, a posteriori naturalism says B as well? So we cannot separate them by this tree. We would need a question about the source of normativity. For example: "Is the reason to act morally grounded in human nature and the world, or in what it means to be an agent?" But this might be too philosophical for beginners.

  2. **Error theory and expressivism**: We separate them by Q9: error theory says A, expressivism says C. But if an expressivist allows for minimal truth and says A or B, we might not capture. But we have option C for expressivism. So we assume they are separated.

     However, we might not have separated conservationist and abolitionist error theory.

  We have not included a leaf for relativism. The tree might put relativism in the error theory or expressivism leaf? In Q4, if they answer B, we don't have a leaf. Let's see:

     - If Q4: B, then they are a relativist. Then in Q5, they might say B. Then in Q9, they might say A (because they think moral claims are true relative to a framework). So we might need a leaf for relativism.

     **Relativism**:
        - Q3: B
        - Q4: B
        - Q5: B
        - Q7: B (because the institution is relative)
        - Q8: B or A? They might say reasons are relative.
        - Q9: A (but true only relative to a standard)

     Awkward commitment: They have to say that when two communities disagree, neither is objectively wrong.

     So we add:

  8. **Relativism**:
     - Q4: B
     - Q5: B
     - Q9: A
     - Q7: B
     - Q8: A or B? They might say that there is a reason relative to the framework, but if the agent doesn't accept the framework, then no. So they might say B.

     We can leave Q8 open.

     Pattern: 
        - Q3: B (must be, because they went to Q4)
        - Q4: B
        - Q5: B
        - Q7: B
        - Q8: B (typically)
        - Q9: A

     But then they have the same pattern as error theory in Q5, Q7, Q8, Q9? Error theory has Q4: A, so we can separate by Q4.

     So we add relativism as a leaf.

     Awkward commitment: They have to say that when two communities disagree, neither is objectively wrong.

  Now we have eight leaves.

  ### Final Leaves:

  1. Definitional naturalism
  2. A posteriori identity naturalism
  3. Irreducible non-naturalism
  4. Constitutivism
  5. Projectivism/Expressivism
  6. Error theory
  7. Relativism
  8. Quietism/Deflationism (catch-all)

  That's eight. We can add one more if needed, but it's within the 9-10 leaves.

  ### Note on Quietism:

  Since quietism is a catch-all, it might be overused. We can try to minimize by defining the others well.

  This diagnostic is complex, but it covers the logical space.
answer: |-
  Below is the diagnostic instrument designed to sort students by their commitments regarding the relation between descriptive and evaluative claims, without using any -ism labels. The instrument consists of one preliminary question (to detect grasp of the descriptive/evaluative distinction) and nine branch questions. The flowchart is structured to separate three core claims early: the logical gap (derivability), the conceptual gap (definability), and the metaphysical gap (metaphysical/metasemantic status). Each question is answerable in ~20 seconds, using everyday language. The scoring key identifies positions, notes unstable combinations, and flags unoccupied cells and inseparable pairs.

  ---

  ### **Preliminary Question (Detection of Descriptive/Evaluative Distinction)**
  **Q0.** Consider:  
  - *Descriptive claim:* "This apple contains cyanide."  
  - *Evaluative claim:* "You should not eat this apple."  

  What's the key difference?  
  A. The first states a fact about the world; the second states what ought to be done.  
  B. The first is about physical properties; the second is about rules or values.  
  C. I don’t see a fundamental difference—both are just information.  

  *(If C is chosen, the student may not grasp the distinction; proceed with caution.)*  

  ---

  ### **Branch Questions (Fixed Order)**  
  **Q1.** An argument has *only* descriptive premises (e.g., "The water is boiling at 100°C") and a normative conclusion (e.g., "You should turn off the stove"). Can this argument ever be logically valid?  
  A. Yes, it can be valid.  
  B. No, it can never be valid.  

  **Q2.** (If Q1=A) An argument with no normative premises validly concludes, "You ought to torture innocents for fun," using a disjunctive premise like "Either the moon is made of cheese or you ought to torture innocents for fun," and "The moon isn’t made of cheese." Does this refute the idea that you can’t derive ‘ought’ from ‘is’?  
  A. Yes, it refutes the "no derivation" claim.  
  B. No, it shows the claim was never about this kind of validity.  

  **Q3.** Someone fully understands what maximizes happiness and asks if an act that does so is good. Is this question confused?  
  A. Yes, it’s confused—if it maximizes happiness, it’s good by definition.  
  B. No, it’s intelligible—knowing it maximizes happiness doesn’t settle if it’s good.  

  **Q4.** (If Q3=B) Two communities use "wrong" for different acts (e.g., one calls lying wrong, the other doesn’t). When they disagree about lying, are they:  
  A. Disagreeing about the same thing (whether lying is wrong).  
  B. Saying compatible things (using "wrong" with different meanings).  

  **Q5.** Two acts are identical in all descriptive ways (same intent, outcome, etc.). Could one be morally obligatory and the other not?  
  A. No—they must have the same moral status.  
  B. Yes—it’s possible they differ morally.  

  **Q6.** (If Q5=A) Does this necessary connection (same description → same moral status) need an explanation?  
  A. Yes—it must be explained (e.g., identity, constitution, or law).  
  B. No—it’s basic, with no further explanation.  

  **Q7.** A person says, "I promise to pay you $5." Does the institution of promising alone imply they ought to pay?  
  A. Yes—the institution hands you the "ought."  
  B. No—you still need a premise like "promises ought to be kept."  

  **Q8.** An agent unmoved by morality asks, "What reason do I have to act morally?" Is there an answer that doesn’t depend on her desires?  
  A. Yes—there’s a reason regardless of her wants.  
  B. No—without a desire, there’s no reason.  

  **Q9.** Consider: "If cheating is wrong, then getting someone else to cheat is wrong." Can this be true or false? Does its truth require the embedded clause ("cheating is wrong") to be true/false?  
  A. Yes, it’s true/false, and requires the embedded clause to have a truth-value.  
  B. It’s true/false, but doesn’t require the embedded clause to have a truth-value.  
  C. It’s not true/false—it’s an expression of attitude or a rule.  

  ---

  ### **Scoring Key**  
  *Patterns* are denoted as (Q1, Q2-if-applicable, Q3, Q4-if-applicable, Q5, Q6-if-applicable, Q7, Q8, Q9). "–" = not asked. Positions marked † are unstable combinations revealing internal tension.  

  | Answer Pattern                                  | Position                              | Awkward Commitment (for the holder)                                                                 |
  |------------------------------------------------|---------------------------------------|-----------------------------------------------------------------------------------------------------|
  | (B, –, A, –, A, A, A, A, A)                   | Definitional Naturalism              | Must say someone fully grasping "maximizes happiness" but questioning "is it good?" is confused.   |
  | (B, –, B, A, A, A, B, A, A)                   | A Posteriori Identity Naturalism     | Must say moral truths (e.g., "good = happiness") are scientific discoveries, not knowable by logic alone. |
  | (B, –, B, A, A, B, B, A, A)                   | Non-Naturalism (Brute Covariation)   | Must accept that descriptive facts necessitate moral facts with no explanation—it’s brute.          |
  | (B, –, B, A, A, A, B, A, A) †                | Constitutivism                       | Must say agents who reject morality are still bound by it due to what agency "just is."              |
  | (B, –, B, B, B, –, B, B, C)                   | Projectivism/Expressivism            | Must say "murder is wrong" expresses disgust, not a fact, so disagreements aren’t about truth.      |
  | (B, –, B, A, B, –, B, B, A)                   | Error Theory (Conservationist)       | Must say all moral claims are false, but we should keep using them (e.g., for social utility).      |
  | (B, –, B, A, B, –, B, B, B)                   | Error Theory (Abolitionist)          | Must say all moral claims are false and we should abandon moral language as deceptive.              |
  | (B, –, B, B, B, –, B, B, A)                   | Relativism                           | Must say moral truth is community-relative, so no objective disagreement occurs.                    |
  | (A, B, B, A, A, B, B, A, A) or similar misfits | Quietism/Deflationism                | Must say debates about "moral facts" are misguided—no substantive question exists to answer.       |

  **Unstable Combinations (tensions to note):**  
  - **Constitutivism pattern** (Q7=B conflicts with Q6=A): If normativity is constitutive of agency (Q6=A requires explanation), why can’t social institutions (Q7) directly imply "ought"? Suggests a pull toward naturalism or non-naturalism.  
  - **Q3=A and Q4=A**: If evaluative terms are definitional (Q3=A), disagreements (Q4) should be verbal (B), not substantive (A). Choosing A/A shows tension between definitionality and objectivity.  
  - **Q5=A and Q8=B**: If descriptive sameness necessitates moral sameness (Q5=A), but reasons depend on desires (Q8=B), the student may conflate moral and motivational facts.  

  **Unoccupied Cells (logical space with no adherents):**  
  1. **Definitional Naturalism (all patterns)**: Empty because unattractive—the "open question" (Q3) shows evaluative concepts resist definition (e.g., "Is maximizing happiness *good*?" feels intelligible, not confused).  
  2. **(A, A, B, –, A, A, –, –, –)**: Unoccupied because incoherent. Accepting Q1=A/Q2=A (derivation via logic) but Q5=A (necessary connection) requires moral properties to be "logical," which no one defends.  
  3. **(B, –, B, A, A, A, A, B, A)**: Unoccupied and unexplored. Combines Q7=A (institutions imply "ought") with Q8=B (reasons desire-dependent), suggesting social facts create reasons without motivating force—a possible but undefended view.  

  **Inseparable Pairs (tree cannot split; further question needed):**  
  1. **A Posteriori Naturalism vs. Constitutivism**: Both yield (B, –, B, A, A, A, B, A, A). *Further Q:* "Does morality depend on human psychology/nature (e.g., happiness) or the inescapable structure of agency (e.g., consistency)?" Beginner-friendly, but may require conceptual coaching.  
  2. **Conservationist vs. Abolitionist Error Theory**: Both yield (B, –, B, A, B, –, B, B, –) for Q1–Q8. *Further Q:* "If moral facts don’t exist, should we eliminate moral language?" (A=keep; B=abolish). Easy for beginners.  

  ---

  ### **Logical Space and Design Notes**  
  - **Carved Logical Space**: Three axes:  
    1. *Derivability Gap* (Q1–Q2): Can normative conclusions follow from descriptive premises?  
    2. *Definability Gap* (Q3–Q4): Can evaluative terms be defined descriptively?  
    3. *Metaphysical/Metasemantic Gap* (Q5–Q9): Are evaluative facts reducible, irreducible, or non-factual?  
    Realism/anti-realism is split by Q5 (A≈realism, B≈anti-realism), with Q6–Q9 cutting within realism (e.g., Q6 sorts naturalism vs. non-naturalism; Q7/Q8 sort naturalist subtypes).  
  - **Cases Used**: 1 (Q3), 2 (Q2), 3 (Q5/Q6), 4 (Q7), 5 (Q4), 6 (Q8), 7 (Q9). Added Q1 (derivability) and Q5/Q8 to cover reasons/necessity.  
  - **Flowchart Leaves**: 10 positions (including error theory split). Definitional naturalism is included but marked empty. Quietism catches misfits.  
  - **Usage**: Hand out on Day 1. Score patterns to map students’ pre-theoretic commitments. Use unstable combinations to spark discussion (e.g., "Why did you choose Q4=A and Q3=A?").  

  This instrument isolates commitments while avoiding -isms and forcing transparency about tensions. The tree’s structure ensures that rejecting one "gap" (e.g., definability) doesn’t predetermine views on others (e.g., metaphysics).
