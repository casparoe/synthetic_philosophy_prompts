     B. It can be true or false, but its truth does not require the embedded clause to be true (or false) because it might be conditional in a different way.
     C. It isn't the sort of thing that is true or false at all; it's more like an expression of attitude or a rule.

  *Note:* This uses case 7. Answer A treats the conditional as a standard truth-conditional claim. Answer B might be for non-cognitivists who allow for truth in a deflationary sense without the embedded clause being truth-apt? But we have to be careful. Alternatively, we can simplify. We are particularly interested in whether the student thinks that the embedded clause must have truth value for the whole to have truth value. Option C is for expressivists who deny truth-aptness for moral sentences.

