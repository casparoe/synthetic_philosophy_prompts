prompt: |-
  I hold a particular view about why the Knobe effect happens, and I want to know what would show I am wrong.

  Background so we are talking about the same thing: in the well-known pair of vignettes from Knobe's 2003 studies, a company executive is told that a new program will increase profits and will also harm the environment; he says he does not care about the environment, only about profit; the program runs and the environment is harmed. Roughly four-fifths of participants say he harmed the environment intentionally. In the otherwise identical case where the side effect is helping the environment and he says he does not care about helping it, only about a quarter say he helped it intentionally. My view is an attempt to explain the gap without saying that moral judgment distorts an otherwise clean folk-psychological judgment:

  (1) Non-moral core. What drives the asymmetry is the presence of a norm that the outcome violates, not badness as such. Moral badness is simply the most efficient way for a one-paragraph vignette to make a norm salient. So the effect should also appear, in attenuated form, for side effects that flout non-moral norms: rudeness, aesthetic garishness, a breach of etiquette, a departure from a technical or statistical standard.

  (2) Reason-flouting mechanism. The norm matters because it hands the hearer a reason the agent had for acting otherwise. A foreseen side effect that the agent had a standing reason to avoid, could have avoided, and did not bother avoiding does not read as something that merely happened to him. In the help case there is normally no standing reason to help that the vignette makes salient, so the agent's indifference is not a reason flouted, and the outcome reads as incidental. The asymmetry should therefore track the perceived strength of the flouted reason, not the perceived badness of the outcome.

  (3) Pragmatics is downstream only. Conversational reshaping of the question — the idea that hearers reinterpret a question about intentionality as a question about blame — does no independent work. Once the reason structure is held fixed, question wording, answer format, and whether participants see one case or both should make little difference.

  I have run some informal probes on colleagues, small and self-selected, and I do not know how much weight to give them. In a help case where the firm had signed a public conservation pledge, the asymmetry narrowed a lot. In a case where the side effect is neither good nor bad but merely strange (the new program causes the office lights to glow faintly purple), there was no asymmetry at all. When the decision is made by a 400-person committee rather than an individual, the asymmetry shrank. When I replaced the yes/no question with a scale whose endpoints were explicitly labeled "purely accidental" and "deliberately brought about," the asymmetry was about the size it usually is. I never ran the comparison that matters most to me: a harm case where avoiding the harm would have been costly versus one where it would have been free.

  I want a map of my exposure.

  - Which results, arguments, or cases would actually count against this view, ranked from fatal to merely awkward? Include at least two defeaters I have not thought of.
  - For the empirical ones, be explicit about what the world would have to look like: which manipulation would have to produce which pattern, and how big a difference would have to be. I care about design, not just outcome: tell me which of my probes are confounded or test something other than what I think they test, and why. The pledge case worries me in particular, since adding a pledge plausibly changes how much the agent is blamed and not just whether a reason was flouted.
  - Which defeaters would a defender of my own view concede as counting against it, as opposed to dismissing on the grounds that the manipulation did not really isolate the mechanism? I would like the honest version, not the critic's version.
  - Some things I have half-heard about in this literature: that the asymmetry shows up in young children; that it has been found in samples outside North America and Europe; that it largely disappears under some question wordings or presentation orders; that something similar turns up for causal attributions, where norm-violating outcomes are picked out as causes more readily; and that Knobe and collaborators have argued for a normative dimension in concept application generally, on the basis of concepts like "scientist" or "friend" whose application seems to depend partly on realizing an ideal. For each: how decisive would it be if it holds, and how confident are you that it holds? Please flag anything you are guessing at.
  - Am I insulated? There is a real risk that "badness is just the way a norm gets made salient" lets me find a norm post hoc in any case that produces an asymmetry, which would make (1) and (2) unfalsifiable. Say plainly how exposed the view is on a scale you specify, what would pin down in advance which norms are supposed to count, and whether the insulation, if it exists, is actually a problem for a view of this kind.
  - What would move me most, personally, is a dissociation: something that changes intentionality attributions while leaving perceived blameworthiness and perceived reason-flouting fixed, or vice versa. Tell me whether such a dissociation is available, and if it is not, why not.

  Please do not give me references, a reading list, or citations; I cannot look anything up and I do not need them.

  Format:

  First, a markdown table, one row per candidate defeater, sorted from most to least decisive, with exactly these columns:

  | id | defeater | kind | component_targeted | decisive_if | currently | confidence | defender_concedes |

  where id is D1, D2, ...; defeater is one sentence stating the result, argument, or case; kind is one of empirical-novel, empirical-reported, conceptual, or methodological; component_targeted says which of (1), (2), (3), or the whole view, it hits; decisive_if describes the specific pattern or magnitude that would make it bite; currently is one of already-reported, would-need-new-data, or not-sure-anyone-has-checked; confidence is high, medium, or low, meaning your confidence that the finding holds or that the probe measures what it claims to measure; and defender_concedes is one of concedes, dismisses, or reinterprets.

  After the table, brief prose on two things only: which of my probes are ill-designed and how you would fix them, and your verdict on the insulation worry.

  Finally, a single JSON object with this schema:

  {
    "most_exposed_component": "one of: 1, 2, 3, whole view",
    "fatal_ids": [],
