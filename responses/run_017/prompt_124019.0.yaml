  ### Prose on Ill-Designed Probes and Insulation

  **Ill-Designed Probes:**  
  - **Pledge case:** Confounds flouted reason with blame. Adding a pledge likely increases both the salience of a reason and perceived blameworthiness. To fix, independently manipulate blame (e.g., by varying the pledge's moral authority) while holding the reason constant, or measure perceived reason strength and blame separately to test mediation.  
  - **Committee probe:** Tests responsibility diffusion but doesn't isolate reason-flouting. A committee might weaken reason attribution due to decision-making opacity, not just flouting. Fix by clarifying the committee's awareness/indifference (e.g., "all members knew and didn't care") and measuring perceived collective reason-flouting.  
  - **Purple lights case:** Well-designed for testing norms. No asymmetry expected and found, so it supports (1).  
  - **Scale probe:** Adequate for testing (3). The persistent asymmetry under your labeling suggests question wording doesn't override reason structure.  

  **Insulation Worry:**  
  The view is moderately insulated because norms can be postulated post hoc after observing an asymmetry. To avoid this, pre-specify norms by:  
  1. Independently measuring perceived norm strength (e.g., "how strong was the reason to avoid the outcome?") before intentionality judgments.  
  2. Using scenarios with pre-established norms (e.g., etiquette rules in a defined culture).  
  3. Only accepting non-moral norms that are empirically verified as salient in control groups.  
  Insulation is a problem if norms aren't pinned down, making (1) and (2) unfalsifiable. But it's not fatal if norm strength is quantifiable and predicts asymmetry magnitude.  

