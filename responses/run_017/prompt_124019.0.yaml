  2. **Empirical: The asymmetry does not track the strength of the flouted reason but tracks blameworthiness.**
     - For example, if we manipulate the cost of avoiding the side effect (which should affect the strength of the reason to avoid) but the intentionality judgments do not change, while blame does, that would target (2).
