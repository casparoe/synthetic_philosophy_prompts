  First, I need to understand the core conflict. Party A is a Bayesian who thinks existing machinery can be repaired—specifically, when a theory entails a known anomaly, the inquirer learns a new connection in an enlarged language, and confirmation flows through that connection. Party B rejects this, arguing it smuggles in independence assumptions and that explanatory unification (deriving the anomaly without auxiliaries) is key, which isn't probabilistic. 

  The recurring example is a planetary orbit anomaly: known for decades, attributed to a perturbing body, then a new gravity theory entailed it precisely, and it was seen as strong support. Both agree this is puzzling and not resolved by just noting scientists gain confidence. 

  The user imposed a four-term vocabulary to prevent conflation:  
  - Acquaintance (anomaly already known)  
  - Use (anomaly used in theory construction)  
  - Prior explanation (anomaly already explained before new theory)  
  - Replacement (new theory explains by discarding/revising old views)  

  Key point: they’ve been conflating acquaintance with use. 

  For the statement structure:  
  **Section 1: Agreed Claims**  
  - Need 10 non-vacuous, one-sentence claims both can sign.  
  - Must include: formulation of the old-evidence puzzle, and clarify if confirmation theory is about proposition relations or credal state changes.  
  - I’ll distill their common ground: e.g., old evidence can confirm, learning connections matters, but independence assumptions are problematic.  

  **Section 2: Table of Disagreements**  
  - Columns: Crux, Party A’s position, Party B’s position, Bearing Case (alpha/beta/gamma), Predictions from both.  
  - Cases:  
    - Alpha: Acquainted, unused, no prior explanation.  
    - Beta: Acquainted, used in construction.  
    - Gamma: Acquainted, unused, prior explanation by rival (new theory explains it differently).  
  - For each, both must state: if confirmation occurs, strength vs. novel prediction, and what quantity tracks it.  
  - I’ll map their positions: A says confirmation always via connection-learning; B says only via unification without auxiliaries. Predictions will differ sharply for gamma.  

  **Section 3: Verbal Disputes & Genuine Progress**  
  - Verbal disputes: Flag where terminology (e.g., "confirmation," "explanation") is doing heavy lifting.  
  - Genuine progress: Both would accept empirical evidence on scientists’ credence updates or formal results about Bayesian vs. non-probabilistic frameworks.  

  User constraints: no citations, names, or footnotes; audience is the investigators and convenor; under 900 words; no stipulation wins.  

  Deeper needs:  
