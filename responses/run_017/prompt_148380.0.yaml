answer: |-
  **FAQs: ReferenceClass Pro™ – Precision Base Rates for Optimal Decisions**

  **Q1: How does ReferenceClass Pro™ determine the *correct* base rate for my unique situation?**  
  Great question! ReferenceClass Pro™ uses our proprietary Similarity Matrix™ to dynamically sort you into the most statistically relevant reference class for any decision. Simply input your query (e.g., “Should I quit my job to write a novel?”), and our algorithm balances sample size with predictive accuracy. No more guessing!

  **Q2: What’s the “Specificity Dial” in my dashboard?**  
  The dial lets *you* fine-tune how narrowly we define your reference class! Slide left for broader classes (e.g., “All humans who changed careers” – high confidence, low relevance). Slide right for ultra-precise matches (e.g., “Left-handed humanities grads in your postal code who own exactly 3 cats and have cried at Excel errors” – high relevance, *n*=1 sample). Both endpoints are industry-standard best practices!  

  **Q3: I upgraded to the “Total Evidence” tier – why did my base rate change when I added my astrological sign?**  
  Total Evidence™ incorporates *every* datapoint you provide! However, note that relevance weighting depends on our proprietary Similarity Metric™. While conditioning on all evidence is mathematically optimal, the algorithm must still select a *class boundary* for frequency calculation. Rest assured: your sign is weighted identically to your credit score (0.73 Similarity Impact Score™).  

  **Q4: What is “Adversarial Class Mode”?**  
  Perfect for team decisions! Enable this feature to let stakeholders propose competing reference classes. ReferenceClass Pro™ will generate base rates for *all* submitted classes (e.g., “Artists who succeeded after quitting” [87% success] vs. “Parents of toddlers who quit stable jobs” [12% success]). Per our Terms: "The platform does not arbitrate between user-defined classes, as all are equally valid under the Axiom of Class Equality™."  

  **Q5: I’m only deciding this once. How can a base rate apply to *me* specifically?**  
  Fantastic concern! We recommend using the narrowest class with “adequate statistics” (≥30 data points by default – customizable!). For example: “First-time founders in your industry” (n=45) is preferable to “You, plus all past/future versions of you” (n=1, undefined frequency). Remember: adequacy thresholds are rigorously calibrated to *your* subscription plan.  

  **Q6: I see a “Long-Term Existential Analytics” add-on. What does it do?**  
  Our premium tier answers questions like “Am I unusually early in human history?” or “How likely was my birth?” by leveraging observer-relative reference classes! Default: “All humans” (you’re typical!). Try “Humans born after 1900” (you’re late!) or “Readers of this FAQ” (you’re unique!). *Note: Doom-probability scores require the Apocalypse Package™ (sold separately).*  

  **Q7: Can ReferenceClass Pro™ predict if my startup will succeed?**  
  Absolutely! For well-defined classes like “SaaS startups seeking Series A,” our base rates (e.g., “32% secure funding”) outperform gut instincts by 58%*. However, results may vary under hyper-personalized settings like “*Your* startup.” We recommend starting broad!  
  *\*Per our 2023 Enterprise Benchmarking Report*  

  **Q8: How do you ensure these base rates are defensible to banks/insurers?**  
  Transparency is core to our mission! ReferenceClass Pro™ Enterprise Edition uses *industry-certified reference classes* (e.g., actuarial tables, FICO cohorts, ICD-11 diagnostic groups). Why? These classes are pre-validated by entities with “skin in the game” via loans, policies, or treatments. Our innovation: delivering *their* classes to *you* in real-time, with elegant visuals!  

  **Q9: What if two equally narrow classes give contradictory base rates?**  
  While rare, this highlights the richness of your uniqueness! We suggest:  
  a) Toggle Adversarial Mode to log both outcomes  
  b) Adjust your Specificity Dial toward broader classes  
  c) Subscribe to our **Ambiguity Resolution Package™** (featuring multi-class Bayesian averaging!)  

  **Q10: How was ReferenceClass Pro™ validated?**  
  Our methods are statistically rigorous! Validation used the class “VC-funded Silicon Valley decision-support tools,” where success rates are robust and well-documented. Try our free trial today – your first existential crisis assessment is on us!  

  ---

