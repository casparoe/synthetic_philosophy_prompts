  Now for objections. I need to prioritize them by likelihood and potential damage. The retributivist will likely challenge the separation of mode and magnitude, arguing it allows disproportionate punishment. The reply should emphasize that desert is fulfilled by censure alone, and magnitude is constrained by dignitarian limits. The soft spot is whether censure without proportional hard treatment feels intuitively unjust.

