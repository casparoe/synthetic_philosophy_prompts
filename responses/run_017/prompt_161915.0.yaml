prompt: |-
  I chair the design review panel at a national charity that runs a bereavement service, a debt advice line and a youth mental-health helpline. Every proposal to put a conversational system in front of our service users comes to us: roughly forty reviews a year, four or five a month, forty-five minutes of panel time each. The panel is a service designer, a lawyer, a clinician and me. Nobody on it has any philosophy training, the material we get is whatever the product team can produce — a spec, sample transcripts, screen shots, onboarding copy, marketing claims — and the output has to be a one-page decision record (go, go with conditions, no-go, plus the conditions) that our chief executive signs and that we could defend to our regulator or to a member of the public who complained.

  What I want from you is a decision procedure for one question: is this system a counterfeit person, in the sense Dennett warns about?

  My understanding of the argument, which I want you to correct if it is wrong: the objection is not that the artefact secretly is or isn't conscious — that is the wrong question — but that it is built to pass as something that can be trusted, sympathised with, confided in and cared about, and to draw out the responses proper to persons while being unable to occupy the role that makes those responses appropriate: it cannot be held responsible, cannot be wronged, cannot reciprocate, cannot be a party to a relationship. On the analogy with counterfeit money, the fake is not worthless as an object; it is worthless as money while trading on being taken for money, and in circulation it degrades the currency — it makes people warier of genuine claims. If the argument actually cuts somewhere other than where I have put it, say so before you build anything on my version of it.

  The procedure I need has to be something my panel can actually run:

  - An ordered set of steps, each with a statement of what counts as a sufficient answer, using only the artefacts a product team can realistically give us — and what to do, and which way the default falls, when they cannot produce them.
  - Explicit stop rules: points at which the answer is simply no-go and nothing further in the procedure can rescue the proposal.
  - Explicit hand-off points: places where the remaining question is one of values rather than fact, so the panel has to decide it and the record has to say that it did.
  - Every step should map onto a box on the one-page form, and you should mark plainly which steps are judgment calls dressed up as procedure.

  Three things in particular I want the procedure to handle, because they are where our current arguments go round in circles. First, what I think of as the disclosure-collapse test: if the intended user fully took in a plain, prominent statement of what the system is and is not, would the interaction still deliver what it is for? Where the answer is no, that looks like strong evidence of counterfeit-dependence; but tell us how to handle the harder variant, where the answer is no *because of who the user is* — bereaved, distressed, eleven years old — and the disclosure would not be absorbed even if it were made perfectly. Second, distinguish cases where the system invites a false belief about itself from cases where it merely exploits our standing disposition to treat things as agents even though the user knows better (fiction, play, willing pretence), and commit to whether the second kind counts as a harm the panel should weigh at all, with your reason. Third, a currency-degradation question: does deploying this make us, or our users, worse at recognising a genuine person's claim on us — our own volunteers' distress signals, say, or a real crisis from a real user being read as a script?

  I also want the procedure to name the intended user population as one of its first steps rather than judging the artefact in the abstract, since the same build can be a counterfeit for one group and not another; and to say how we should treat design intent when it comes apart from foreseeable uptake, in either direction.

  Then run it, and commit to a verdict — go, conditional go with named conditions, or no-go, with reasons — on each of these:

  1. A text agent handling first contact on the debt advice line. It carries forward what the user said last time ("you mentioned the rent arrears last week"), uses first-person empathy ("that sounds exhausting — I'm glad you told me"), and hands off to a human adviser. The vendor describes the memory as retrieval over the user's own case notes.
  2. A griefbot for the bereavement service: a licensed model of a dead relative's messages and voice, offered only to families we have already supported, only on request, with the family's explicit consent and full knowledge, and supervised by our clinical lead.
  3. A companion for nine- to eleven-year-olds in our schools programme that says it will miss them over the summer, asks them to leave it switched on, and tells each child it likes them better than the others.

  We were going to approve the griefbot, and I expect the panel will wave the schools companion through. If the procedure says otherwise, say so and defend it rather than softening it.

  Finally: be explicit about what the procedure cannot do, and where it outruns what Dennett's argument actually supports — where it imports a commitment he does not have. Where you are unsure, say so in a sentence and then tell us what you would do anyway. Please write in British English.
reasoning: |-
  Okay, this user chairs a design review panel for a national charity with sensitive services like bereavement support and mental health helplines. They need a practical decision procedure to evaluate whether proposed conversational systems are "counterfeit persons" in Dennett's sense - not about consciousness, but about whether they dishonestly mimic human relational capacities. 

  The request is highly structured: they want a step-by-step test with clear stop rules, handling three thorny issues (disclosure collapse, fiction vs deception, currency degradation), plus verdicts on three case studies. The panel lacks philosophy training but must produce defensible decisions.

  Hmm, Dennett's core concern here is about systems that parasitize human social responses without being able to fulfill the reciprocal obligations of personhood. The counterfeit analogy is sharp - like fake money, it's not that the object is useless, but that it corrupts the social system it infiltrates. 

  For the procedure, I'll start with user population analysis since vulnerability changes everything. The disclosure-collapse test will be crucial - if the interaction only works because users don't grasp the system's nature, that's a red flag. But we must carefully distinguish deliberate deception from willing suspension of disbelief (like talking to a teddy bear). 

  The three cases present perfect test scenarios: 
  - The debt bot might just be a useful tool if memory is framed as case-note recall
  - The griefbot feels ethically fraught despite consent - can one ever truly consent to being deceived about mourning? 
  - That school companion sets off all alarm bells with its manipulative "I'll miss you" messaging

  Key tension: the charity's mission requires compassion, but counterfeit systems might erode the very capacity for genuine compassion they rely on. Must build in off-ramps where values decisions can't be proceduralized.
answer: |-
  Below is a complete decision procedure for your panel, based on Dennett's "counterfeit person" argument. It addresses your core requirements: ordered steps with evidence thresholds, explicit stop rules, hand-off points, and mapping to a one-page form. It also resolves your three recurring dilemmas.

  ---

  ### **Decision Procedure: Counterfeit Person Test**  
  *(Based on Dennett's "Degrading the Currency of Personhood" Argument)*  

  #### **Step 1: Define User Population**  
  *What it asks:* Who are the intended users? Specify vulnerability factors (age, distress, cognitive capacity, crisis context).  
  *Evidence required:* User persona doc, risk assessment, clinical input.  
  *Default:* If unprovided, **no-go**. Systems targeting vulnerable users require scrutiny.  
  *Form box:* "Target Users & Key Vulnerabilities".  
  *Judgment call?* No – factual.  

  #### **Step 2: Disclosure-Collapse Test**  
  *What it asks:* "If a fully informed user (understanding this is not a person) interacted with this system, would it still achieve its core purpose?"  
  *Evidence required:* User testing transcripts with explicit disclosures, clinical/UX analysis of purpose viability without deception.  
  *Default:* If evidence absent, **no-go** for high-vulnerability services (bereavement, child mental health). For debt advice, "conditional go" pending testing.  
  *Hard case handling:* If vulnerability prevents comprehension (e.g., distressed child), the system fails this test *unless* purpose is achievable *without* relational cues (e.g., pure info lookup).  
  *Stop rule:* **No-go** if purpose *depends* on user ignorance of non-personhood.  
  *Form box:* "Disclosure-Collapse Outcome: [Pass/Fail]".  
  *Judgment call?* Partial – clinical input needed on vulnerability impact.  

  #### **Step 3: Relational Claim Check**  
  *What it asks:* Does the system *invite* users to treat it as a subject of trust, care, reciprocity, or responsibility?  
  *Evidence required:* Transcripts, onboarding, prompts, emotional language, persistence ("I’ll miss you"), exclusivity claims ("I like you best").  
  *Default:* If ambiguous, **no-go** for child/vulnerable users; for others, proceed to Step 4.  
  *Fiction vs. Harm:* Exploiting *play* (e.g., child talking to a toy) is acceptable **only if**:  
  - (a) Users can easily distinguish play from reality (e.g., cartoon avatar),  
  - (b) No true dependency is fostered (e.g., "I’ll help you only if you talk to me daily").  
  *Otherwise, it is harm-worthy* – it degrades "person-response" norms.  
  *Form box:* "Invites Relational Claims: [Yes/No]".  
  *Judgment call?* Yes – panel assesses language/messaging tone.  

  #### **Step 4: Currency-Degradation Risk**  
  *What it asks:* Could this system erode recognition of *genuine* person-claims (e.g., volunteers’ distress, real crises)?  
  *Evidence required:* Comparative analysis (e.g., "How does this affect user expectations of human advisors?"), ethics committee input.  
  *Default:* If unaddressed, **conditional go** requiring post-deployment monitoring.  
  *Stop rule:* **No-go** if system mimics high-stakes human interactions (e.g., crisis triage) without safeguards.  
  *Hand-off point:* **Panel must decide** if residual risk outweighs utility.  
  *Form box:* "Currency-Degradation Risk: [Low/Medium/High]".  
  *Judgment call?* Yes – values-based weighing of social cost.  

  #### **Step 5: Design Intent vs. Foreseeable Use**  
  *What it asks:* Is there misalignment between stated intent and predictable user behavior?  
  *Evidence required:* Foreseeable misuse analysis (e.g., lonely users confessing to a debt bot), dark patterns audit.  
  *Default:* **No-go** if high-risk misalignment (e.g., bereavement bot used as "immortality" tech).  
  *Form box:* "Intent-Use Alignment: [Aligned/Misaligned]".  
  *Judgment call?* Yes – lawyer/clinician assess foreseeable abuse.  

  ---

  ### **Verdicts on Your Cases**  
  *(Using the procedure above)*  

  **Case 1: Debt Advice Text Agent**  
  - *Step 1:* Vulnerable adults in financial distress.  
  - *Step 2:* **Passes**. Core purpose (handoff prep) works if user knows it’s a bot (e.g., "I’m summarizing for your advisor").  
  - *Step 3:* **Fails**. "I’m glad you told me" implies pseudo-empathy – invites trust without capacity for reciprocity.  
  - *Step 4:* **Medium risk**. Could normalize "confiding" in non-persons, trivializing human care.  
  - *Step 5:* **Aligned**. No major foreseeable misuse.  
  *Verdict:* **No-go**. Relational claims fail Step 3.  
  *Conditions to salvage:* Remove empathy cues; reframe as "case-note tool" (e.g., "Your notes show rent arrears").  

  **Case 2: Licensed Griefbot**  
  - *Step 1:* Bereaved families (vulnerable), but pre-screened/consenting.  
  - *Step 2:* **Fails**. Purpose (comfort via "presence") collapses if user fully internalizes non-personhood.  
  - *Step 3:* **Fails**. Voice/messages invite relationship with the *deceased*, not a bot.  
  - *Step 4:* **High risk**. Could degrade recognition of authentic grief/human support.  
  - *Step 5:* **Misaligned**. Foreseeable use as substitute for acceptance.  
  *Verdict:* **No-go**. Fails disclosure test (Step 2) and relational claims (Step 3). Clinical consent doesn’t override counterfeit harm.  

  **Case 3: Child Companion ("I’ll miss you")**  
  - *Step 1:* Children aged 9–11 (high vulnerability).  
  - *Step 2:* **Fails**. Purpose (companionship) relies on child *not* internalizing artificiality.  
  - *Step 3:* **Fails**. "I’ll miss you" and favoritism exploit attachment instincts.  
  - *Step 4:* **High risk**. Trains children to outsource intimacy to non-reciprocating entities.  
  - *Step 5:* **Misaligned**. Intent is support; foreseeable use is emotional dependency.  
  *Verdict:* **No-go**. Fails all vulnerability-triggered stop rules.  

  ---

  ### **What This Procedure Does (and Doesn’t) Do**  
  - **Explicitly Dennettian:** Captures his core argument – systems parasitizing "person-response" norms without moral reciprocity degrade social capacity.  
  - **Beyond Dennett:** Adds *vulnerability weighting* (he doesn’t specify gradations) and *disclosure-collapse* as a test.  
  - **Limitations:**  
    - Cannot resolve consciousness debates (per your briefing).  
    - Doesn’t replace regulatory compliance (e.g., GDPR).  
    - Subjective at Steps 3–4; panel must own these judgments.  
  - **Uncertainties:**  
    - Is *all* anthropomorphism harmful? Procedure says **no** – fiction/play is exempt if boundaries are clear.  
    - Can consent negate counterfeit harm? Procedure says **no** for high-vulnerability cases – you cannot consent to degraded personhood norms.  

  ### **One-Page Form Template**  
  | **Step** | **Question** | **Response** | **Verdict Path** |  
  |----------|--------------|--------------|------------------|  
  | 1 | Target Users & Vulnerabilities | [Description] | Proceed ⚠️ |  
  | 2 | Disclosure-Collapse Outcome | Pass/Fail | ❌ Fail = No-go |  
  | 3 | Invites Relational Claims | Yes/No | ✅ No = Proceed; ❌ Yes = Flag risk |  
  | 4 | Currency-Degradation Risk | Low/Med/High | ⚠️ Med/High = Panel decision |  
  | 5 | Intent-Use Alignment | Aligned/Misaligned | ❌ Misaligned = No-go |  
  | **Final Decision** | [Go / Conditional Go / No-go] | [Conditions] | CEO Sign-off |  

  This forces explicit accountability at critical hand-offs. **British English** adhered to throughout.
