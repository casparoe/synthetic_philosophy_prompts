  Why reversal arises: "The feature increases onboarding completion from 60% to 80%, and since completers have a much higher pass rate (e.g., 60% for control completers vs 20% for non-completers), the aggregate shows a win despite the feature reducing pass rates by 5 percentage points within each completion group."

