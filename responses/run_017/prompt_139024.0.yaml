  - "why_reversal_arises": one sentence string.

  - "recommendation": one sentence string.

  - "when_to_stratify": one sentence string.

  Let me draft the strings.

  False presupposition: "The rule that the disaggregated table is always honest and the aggregate confounded is mistaken; it assumes the stratifier is a confounder, but here it is affected by treatment."

