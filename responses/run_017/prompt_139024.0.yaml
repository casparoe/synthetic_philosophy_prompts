prompt: |-
  We ran a randomised A/B test of a new nudging feature on our learning platform, and the results have started an argument I have to settle. Overall, 470 of the 1,000 users who had the feature passed the end-of-course exam, against 440 of the 1,000 who did not — a small but real win. A colleague then split both arms by whether the user completed the onboarding module: of the 800 feature users who completed it, 55% passed, against 60% of the 600 control completers; of the 200 feature users who did not, 15% passed, against 20% of the 400 control non-completers. So the feature loses in both rows and wins in the total — Simpson's paradox — and he wants to roll it back. I have always taken the rule to be that when a reversal like this appears the disaggregated table is the honest one, the headline is just an artefact of a confounder, and the finer the breakdown the safer the inference; on that rule he is right and I cannot locate his mistake. Randomisation happened at sign-up, so the feature cannot have been assigned on the basis of anything we measured beforehand, and onboarding completion is recorded only after the feature is switched on. I would rather not be fobbed off with the observation that correlation is not causation; I know basic probability but no causal-inference formalism, so please keep any diagram in words.

  Answer in British English, and give the answer as a single JSON object with exactly these fields:

  - "false_presupposition": the rule I stated above that is mistaken, given in one sentence, plus one sentence correcting it.
  - "stratifier_role": whether onboarding completion is, in this test, a confounder, a mediator, or a collider, with a one-line reason.
  - "what_each_comparison_estimates": an object with keys "aggregate" and "stratified", each naming the quantity that comparison actually estimates (for example a total effect versus a controlled direct effect) and whether it is the one that answers a ship-or-roll-back decision.
  - "why_reversal_arises": one sentence explaining how 80% versus 60% completion together with the 55/60 and 15/20 splits produce the aggregate reversal — which students the feature moves, and why that makes the two rows non-comparable.
  - "recommendation": one sentence — ship, roll back, or run a different analysis — naming the decision-relevant quantity it turns on.
  - "when_to_stratify": one sentence stating the general rule for when breaking a table down is legitimate and when it destroys the estimate you want.
reasoning: |-
  First, the user describes an A/B test for a nudging feature on a learning platform. The overall results show that with the feature, 470 out of 1000 passed (47%), and without it, 440 out of 1000 passed (44%), so a 3% win. That seems positive.

  Then, they split by onboarding completion:

  - For those who completed onboarding: 800 feature users, 55% passed (which is 440 passed, since 800 * 0.55 = 440), and 600 control users, 60% passed (360 passed). So the feature group has a lower pass rate here: 55% vs 60%, meaning the feature loses by 5% in this subgroup.

  - For those who did not complete onboarding: 200 feature users, 15% passed (30 passed), and 400 control users, 20% passed (80 passed). So again, feature loses: 15% vs 20%, a 5% loss.

  But overall, feature wins by 3%. This is Simpson's paradox, where the direction reverses when aggregating.

  The user's colleague wants to roll back the feature because it loses in both subgroups. The user thought that the disaggregated table is the "honest" one and that the aggregate is confounded, so they should trust the subgroups. But the user is confused because randomization was at sign-up, so assignment should be random and not based on pre-existing factors. Onboarding completion is recorded after the feature is turned on, so it might be affected by the feature.

  Key points:

  - Randomization: at sign-up, so the feature assignment is random.

  - Onboarding completion: recorded after feature is switched on, so it could be influenced by the feature.

  The user stated a rule: "when a reversal like this appears the disaggregated table is the honest one, the headline is just an artefact of a confounder, and the finer the breakdown the safer the inference."

  But in this case, the disaggregated table shows the feature losing, while aggregate shows winning. The user thinks the colleague is right based on this rule but senses something is wrong.

  I need to identify the false presupposition.

  The false presupposition is that the disaggregated table is always the honest one when there's a reversal. But that's not necessarily true if the stratifying variable is affected by the treatment.

  In causal inference, when you stratify by a variable that is a mediator or is post-treatment, it can bias the estimate of the total effect.

  Here, onboarding completion might be a mediator: the feature could affect whether people complete onboarding, which then affects pass rates.

  Or it could be a collider, but I think mediator is more likely.

  First, let's classify onboarding completion.

  It is recorded after treatment assignment, and the feature might influence whether users complete onboarding. For example, the nudging feature could encourage more people to complete onboarding, or it might not.

  From the data:

  - Feature group: 800 out of 1000 completed onboarding, so 80% completion.

  - Control group: 600 out of 1000 completed onboarding, so 60% completion.

  So the feature increased onboarding completion: 80% vs 60%.

  Now, for pass rates:

  In completers: feature 55% vs control 60%

  In non-completers: feature 15% vs control 20%

  Overall pass rates:

  Feature: (440 from completers + 30 from non-completers) / 1000 = 470/1000 = 47%

  Control: (360 from completers + 80 from non-completers) / 1000 = 440/1000 = 44%

  The reversal arises because the feature group has a higher proportion of completers (80% vs 60%), and completers have higher pass rates in general (control completers 60%, non-completers 20%, so completers pass more). But within each subgroup, the feature has a lower pass rate.

  Specifically, in completers, control has 60% pass vs feature 55%, so feature is worse. Similarly in non-completers, control 20% vs feature 15%, worse.

  But because the feature increased completion, and completers are more likely to pass, the overall effect is positive.

  Now, the key is what we want to estimate. If we want the total effect of the feature on passing, including through its effect on onboarding, then the aggregate is correct.

  If we stratify by onboarding, we are conditioning on a post-treatment variable, which blocks the path through onboarding and only shows the direct effect, but that might not be what we care about.

  In this case, onboarding is a mediator.

  Let me define:

  - T: treatment (feature or not)

  - O: onboarding completion (binary)

  - Y: pass or not

  Randomization is at sign-up, so T is randomly assigned, so no confounders for T -> Y.

  But O is after T, so T can affect O, and O affects Y.

  So the causal path is T -> O -> Y and possibly T -> Y directly.

  In the stratified analysis, when we look at O=1 or O=0, we are holding O fixed, so we estimate the direct effect of T on Y, not mediated through O. But this direct effect might be negative, while the total effect, including the mediation, is positive.

  In this data, the direct effect is negative in both strata: in O=1, feature reduces pass rate by 5% (55% vs 60%), and in O=0, by 5% (15% vs 20%). But the feature also increases the proportion in O=1, which has higher pass rate.

  The total effect is the combination.

  For the decision to ship or roll back, we care about the overall impact: does the feature increase pass rates overall? Which it does, by 3 percentage points.

  The disaggregated table shows that for people who would complete onboarding anyway, the feature slightly hurts pass rate, and similarly for those who wouldn't, it also hurts. But the feature makes more people complete onboarding, which is beneficial.

  So, if we force everyone to complete onboarding, the feature might be harmful, but since it encourages completion, on net it's good.

  But we don't force completion; the feature influences behavior.

  Therefore, for the decision, the aggregate effect is what matters.

  Now, to answer the JSON fields:

  1. "false_presupposition": the rule I stated that is mistaken.

  I stated: "when a reversal like this appears the disaggregated table is the honest one, the headline is just an artefact of a confounder, and the finer the breakdown the safer the inference."

  The mistake is that this assumes the stratifying variable is a confounder (pre-treatment), but here it is post-treatment.

  Correction: When the stratifying variable is affected by the treatment, such as a mediator, the disaggregated table estimates direct effects, not the total effect, and the aggregate may be valid for the total effect.

  2. "stratifier_role": whether onboarding completion is a confounder, mediator, or collider.

  It is a mediator because it occurs after treatment and is influenced by it; treatment may affect onboarding, which affects passing.

  Reason: Onboarding completion is recorded after feature assignment and is likely affected by the feature, as evidenced by different completion rates (80% vs 60%).

  It's not a confounder because confounders are pre-treatment and affect both treatment and outcome, but here randomization ensures no confounders, and onboarding is post-treatment.

  Not a collider because colliders are variables affected by both treatment and outcome, but conditioning on them creates bias. Here, we're stratifying, which is like conditioning, but for a collider, conditioning when not necessary can bias, but in this case, it's not a collider. Onboarding is affected by treatment and affects outcome, so it's a mediator.

  Collider would be if both T and Y affect O, but here Y is pass, which might not affect O, since O is completion before the course, I assume? The timeline isn't specified, but onboarding is probably before the course, and passing is after.

  The problem says: "onboarding completion is recorded only after the feature is switched on." But the feature is switched on at sign-up, I think, since randomization at sign-up.

  Let's read: "Randomisation happened at sign-up, so the feature cannot have been assigned on the basis of anything we measured beforehand, and onboarding completion is recorded only after the feature is switched on."

  So feature switched on at sign-up, onboarding completion recorded after that, but before the exam, I assume.

  Passing is after the course.

  So likely, O happens before Y, and T affects O, O affects Y, and T may affect Y directly.

  So O is a mediator.

  3. "what_each_comparison_estimates":

  - "aggregate": this estimates the total effect of the feature on passing, including both direct and indirect effects (through onboarding completion). This is the quantity that answers the ship-or-roll-back decision if we care about the overall impact.

  - "stratified": this estimates the controlled direct effect of the feature on passing when onboarding completion is held fixed. In this case, it shows the effect conditional on completion status, but since completion is affected by treatment, this is not the total effect and may not be relevant for the decision.

  For the decision, the aggregate is what matters because it includes the feature's effect on behavior.

  4. "why_reversal_arises": one sentence explaining how the splits produce the reversal.

  The feature increases onboarding completion (80% vs 60%), and since completers have higher pass rates, this boosts the overall pass rate for the feature group, despite the feature having a slightly negative direct effect on pass rates within each completion group.

  More precisely: the feature moves students from the non-completer group (lower pass rate) to the completer group (higher pass rate), and because the direct effect within groups is negative but small compared to the benefit of increased completion, the aggregate shows a win.

  5. "recommendation": ship, roll back, or run a different analysis.

  Since the total effect is positive (3% increase), and that's what matters for overall impact, I recommend shipping the feature. Rolling back based on the stratified analysis ignores the positive effect on completion.

  6. "when_to_stratify": the general rule.

  Stratifying is legitimate and necessary when the stratifier is a confounder to adjust for bias, but it destroys the estimate when the stratifier is a mediator or collider and we are interested in the total effect.

  In other words, break down when the variable is a pre-treatment confounder to get an unbiased estimate; do not break down when it is post-treatment and we want the total effect.

  Now for the JSON format.

  Answer in British English, so use British spellings like "artefact", but JSON should be fine.

  Fields:

  - "false_presupposition": string with one sentence for the rule and one for correction.

