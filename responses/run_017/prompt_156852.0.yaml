prompt: |-
  I'm a software engineer with no formal philosophy background, and I run a fortnightly lunch reading group with seven or eight colleagues at work. All of them are comfortable with probability and have implemented some kind of Bayesian filter or tracker, but none has studied formal epistemology, and for them updating means Bayes' theorem applied to a proposition that has become certain.

  In one 55-minute session, with a whiteboard, I want to get them to the point where they can apply Jeffrey conditionalization — updating on evidence that is itself uncertain — and, more importantly, see what adopting that rule commits them to. Please don't explain the rule to me; I can follow it on paper. Plan how I should explain it.

  The session has to get across: why ordinary conditionalization cannot even be stated for the case that motivates the generalization (an experience that moves your confidence in E without making any proposition certain, so that there is nothing to condition on); rigidity, as the substantive assumption of the rule rather than a technicality; what the rule degenerates to when the new probability of a cell is 1, and why that is a sanity check rather than a curiosity; the fact that successive updates of this kind do not in general commute, and what that means for anyone who would bolt the rule onto a system that streams observations; and some rough sense of how the rule relates to the idea of choosing the distribution closest to your prior among those satisfying the new constraints. On that last point my understanding — which I want you to correct if it is wrong — is that in the single-partition case the two agree and come out closed-form, whereas with constraints on two overlapping partitions there is no closed form and you end up in iterative proportional fitting. Tell me whether any of that belongs in a 55-minute session, and if so where.

  Specifically, I want:

  1. The order in which the components must be introduced, and for each, the dependency that makes it impossible to postpone: what has to be in place before the next thing is even statable rather than merely easier.
  2. One example to carry the session. Tell me what properties it must have and, as importantly, what it must lack. My default is something from service monitoring — a noisy alert that shifts my confidence that a deployment is degraded — but I suspect that example quietly contains something I don't want, whether an event I could have conditioned on instead, a proposition that effectively becomes certain, or a case where the experience also teaches me something about how E bears on A and not only about how likely E is. If a single example cannot carry both the rule and the cases where the rule misbehaves, say so and say where in the arc to switch examples.
  3. The misconceptions to expect, and the exact point in the sequence at which each should be headed off rather than corrected afterward. My guesses: that this is just Bayes' theorem with a softened likelihood and nothing more; that rigidity is a consequence of the framework rather than an extra assumption; that the failure of order-independence is an implementation bug with a patch; that showing ordinary conditionalization cannot handle the motivating case shows it to be wrong rather than merely inapplicable. Correct these, add the ones I have missed, and tell me which are worth pre-empting in advance.
  4. What I should leave out at this level and openly refuse to explain. I would rather name a topic as out of scope than gesture at it in the last two minutes.
  5. Where the soft-evidence alternative belongs. Someone in the room will have met handling of uncertain observations in Bayesian networks, where you hold a likelihood ratio fixed and run ordinary Bayes on a virtual observation instead of moving the probability of E. Should I invite that, and if so as a contrast, as the same rule in different notation, or as a distraction to be waved off?
  6. One question to close on that would show me whether they have understood the rule rather than followed the algebra to the right number.

  Finally, since you are giving me a plan rather than a proof: say where you are least confident in it. Identify the step in your proposed sequence most likely either to lose the room or to rest on a claim that is actually contested among people who work on this, and tell me what a colleague could say or ask that ought to make me reorder, drop, or invert that step. Where the literature is genuinely unsettled, flag it as unsettled rather than quietly picking a side.
reasoning: |-
  We are planning a 55-minute session for software engineers familiar with basic Bayesian updating (conditioning on certain evidence) but not with Jeffrey conditionalization. The goal is to get them to understand and apply Jeffrey conditionalization, grasp the commitment to rigidity, and see key properties (like non-commutativity). We also want to touch on the connection to minimizing relative entropy, but only if time and clarity permit.

  Key components to cover:
  1. The limitation of ordinary conditionalization: it requires conditioning on an event that becomes certain (probability 1). We need to show a scenario where evidence is uncertain (e.g., an experience that shifts the probability of E without making it certain) and thus ordinary conditionalization cannot be applied.

  2. Jeffrey conditionalization: updating a partition {E, not-E} (or more generally a partition) by setting new probabilities for the partition and then using the rigidity condition (that conditional probabilities given each cell remain unchanged).

  3. Rigidity: This is the substantive assumption. It is not a consequence but an extra commitment.

  4. Sanity check: When the new probability of E is set to 1, the rule reduces to ordinary conditionalization.

  5. Non-commutativity: Successive Jeffrey updates generally do not commute, meaning the order of updates matters. This is important for streaming systems.

  6. Connection to minimizing relative entropy: In the single-partition case, Jeffrey conditionalization is equivalent to choosing the distribution closest to the prior (in the sense of minimizing relative entropy) that satisfies the new constraints. But for multiple partitions, we don't have a closed form and use iterative methods. This might be too advanced for 55 minutes, but we can mention it briefly.

  Plan:

  Order of Components (with dependencies):

  1. **Review of ordinary conditionalization (5 minutes)**  
     - Set up: We have a prior P, and we observe E (so P_new(E)=1). Then for any proposition A, P_new(A) = P(A|E) = P(A∧E)/P(E).  
     - Dependency: This is the baseline. Must be in place to show the limitation.

  2. **Motivating example where ordinary conditioning fails (10 minutes)**  
     - Present a scenario:  
       Example: Service monitoring. We have a deployment that might be degraded (proposition D). We get an alert from a noisy sensor. The alert (event A) is not certain: we might have seen a flicker on the screen that makes us think the alert might have fired, but we are not sure. Alternatively, we might have a report that the alert fired, but we know the report is unreliable.  
       - But note: We want to avoid any example where we could condition on a proposition (like "I saw a flicker" or "I received a report") because that would allow ordinary conditioning. So we need an experience that directly changes our degree of belief in E (the alert fired) without providing a proposition to condition on.  
     - Instead, use an example of perceptual experience:  
       Example (inspired by Jeffrey): Looking at a piece of cloth in dim light. Let E be "the cloth is green". We start with P(E)=0.5. After looking, we are not certain it's green, but we are more confident: say P_new(E)=0.7. How should we update our belief about a proposition A, say "the cloth is made of natural fibers"?  
     - Why can't we use ordinary conditioning? Because we don't have a proposition that we can condition on. The experience doesn't make E certain, and we don't have a proposition capturing the experience that is independent of E and A (and even if we did, we might not want to model it).  
     - Dependency: We must establish the gap that Jeffrey conditionalization fills.

  3. **Introduce Jeffrey conditionalization (15 minutes)**  
     - We set up a partition: for simplicity, {E, not-E}.  
     - We assign new probabilities: P_new(E) = q (say 0.7), P_new(not-E) = 1-q.  
     - The rule: For any proposition A,  
          P_new(A) = P(A|E) * q + P(A|not-E) * (1-q)  
     - Explain: We are using the old conditional probabilities (P(A|E) and P(A|not-E)) and averaging them with the new weights.  
     - Rigidity: The key assumption is that these conditional probabilities do not change: P_new(A|E) = P(A|E) and P_new(A|not-E) = P(A|not-E). This is the rigidity condition. It is an assumption, not a consequence. Without it, we wouldn't know how to update.  
     - Sanity check: What if q=1? Then P_new(A) = P(A|E)*1 + P(A|not-E)*0 = P(A|E). So we get ordinary conditioning.  
     - Dependency: We must have the partition and the new probabilities for the cells. The rigidity condition must be stated as an assumption.

  4. **Non-commutativity (10 minutes)**  
     - Show by example that two Jeffrey updates in a row do not necessarily commute.  
       Example: Start with P(E)=0.5, and we care about A.  
          Update 1: Set P_new1(E)=0.7  
          Update 2: Set P_new2(E)=0.9  
          Now do the same in reverse order:  
          Update 1: Set P_new1(E)=0.9  
          Update 2: Set P_new2(E)=0.7  
       - Compute P_new(A) in both cases and show they are different (unless the conditional probabilities are 0 or 1).  
       - Why? Because after the first update, the conditional probabilities (which are rigid per update) are the ones from the prior? Actually, no: rigidity is with respect to the distribution at the time of the update. So:  
          In the first sequence:  
            Step1: P1(A) = P_prior(A|E)*0.7 + P_prior(A|not-E)*0.3  
            Step2: P2(A) = P1(A|E)*0.9 + P1(A|not-E)*0.1  
            But note: P1(A|E) = P_prior(A|E) [by rigidity of the first update] and similarly for not-E. So:  
            P2(A) = P_prior(A|E)*0.9 + P_prior(A|not-E)*0.1  
          In the reverse order:  
            Step1: P1'(A) = P_prior(A|E)*0.9 + P_prior(A|not-E)*0.1  
            Step2: P2'(A) = P1'(A|E)*0.7 + P1'(A|not-E)*0.3  
            But now: P1'(A|E) = P_prior(A|E) [rigidity in the first update] and similarly for not-E? Actually, no: the first update sets P1'(E)=0.9, and by rigidity we have P1'(A|E)=P_prior(A|E). Then in the second update, we set P2'(E)=0.7, and we use the conditional probabilities from P1':  
            P2'(A) = P1'(A|E)*0.7 + P1'(A|not-E)*0.3 = P_prior(A|E)*0.7 + P_prior(A|not-E)*0.3  
          So we have:  
            Sequence 1: P2(A) = P_prior(A|E)*0.9 + P_prior(A|not-E)*0.1  
            Sequence 2: P2'(A) = P_prior(A|E)*0.7 + P_prior(A|not-E)*0.3  
          These are different.  
     - What does this mean? In a streaming system, the order of updates matters. If you get two pieces of uncertain evidence about the same partition, the result depends on the order. This is a feature, not a bug. It reflects that the evidence is being incorporated in sequence.  
     - Dependency: We need to have the rule in place to compute the updates.

  5. **Connection to minimizing relative entropy (if time, 5 minutes)**  
     - We can mention: Jeffrey conditionalization for a single partition is equivalent to finding the distribution Q that minimizes the relative entropy (KL divergence) D_KL(Q||P) subject to Q(E)=q.  
     - But if we have constraints on multiple overlapping partitions, then we don't have a closed form and we use iterative proportional fitting. This is beyond the scope of this session.  
     - We'll skip if time is short.

  6. **Soft evidence in Bayesian networks (5 minutes for Q&A or as raised)**  
     - If someone brings up the idea of holding the likelihood ratio fixed and updating as if we had a virtual observation:  
       - This is an alternative way to model the same update. It is equivalent to Jeffrey conditionalization when the partition is {E, not-E}.  
       - We can show: Setting P_new(E) = q is equivalent to multiplying the odds of E by a factor (the likelihood ratio) that is constant.  
       - But note: This equivalence holds for the partition {E, not-E}. For more complex partitions, it may not.  
     - We can mention this as a different perspective, but we are focusing on the Jeffrey rule because it generalizes to arbitrary partitions.

  7. **Closing question (5 minutes)**  
     - Ask: "Suppose we have two propositions, E1 and E2, that form a partition (so they are mutually exclusive and exhaustive). We update by setting P_new(E1)=0.6 and P_new(E2)=0.4. If we then want to update again by setting P_newer(E1)=0.8, what must we assume to apply Jeffrey conditionalization again? And why might the result of two successive updates not be the same as if we had set P_new(E1)=0.8 in one step?"  
       - Answer: We must assume rigidity again: the conditional probabilities given E1 and E2 remain unchanged from the distribution we had at the previous update. And the result of two updates is not the same as one because of non-commutativity: the order matters.

  Timing:  
  - Review: 5 min  
  - Motivating example: 10 min  
  - Rule and rigidity: 15 min  
  - Non-commutativity: 10 min  
  - Relative entropy: 0-5 min (if time, else skip)  
  - Soft evidence: as raised  
  - Closing: 5 min  

  Misconceptions to address:

  1. "This is just Bayes' theorem with a softened likelihood and nothing more."  
     - Head off when introducing rigidity: Emphasize that rigidity is an extra assumption. Without it, we could have many ways to update. The rule is not forced by probability theory.

  2. "Rigidity is a consequence of the framework rather than an extra assumption."  
     - When stating the rule, explicitly say: "We are assuming that the conditional probabilities given each cell remain unchanged. This is not automatic; it's a substantive commitment about how the evidence affects our beliefs."

  3. "The failure of order-independence is an implementation bug with a patch."  
     - During the non-commutativity section: Emphasize that this is inherent in the rule. The order of evidence matters because each update changes the distribution and then the next update uses the updated conditionals (which are the same as the prior conditionals only if we have rigidity with respect to the prior? Actually, no: rigidity is with respect to the current prior at the time of update). So the non-commutativity is by design.

  4. "Showing ordinary conditionalization cannot handle the motivating case shows it to be wrong rather than merely inapplicable."  
     - When motivating: Be clear that ordinary conditionalization is a special case (when the evidence becomes certain). Jeffrey conditionalization extends it to a broader class of evidence.

  Additional misconceptions:
     - That the partition must be binary. It doesn't, but we start with binary for simplicity.
     - That we can apply the rule to any proposition without a partition. We need a partition and we update the entire distribution by setting the new probabilities for the partition and keeping conditionals fixed.

  What to leave out:
     - The full generalization to arbitrary partitions beyond binary. We can mention it but not develop it.
     - The proof of the relative entropy minimization. Just state the connection without proof.
     - The iterative proportional fitting for multiple partitions: too advanced.

  Soft evidence alternative:
     - If raised, we can say: "In the binary case, there is an equivalent way: you can model the update by a virtual observation that gives a likelihood ratio for E. But note that this is equivalent only for the partition {E, not-E}. For a more complex partition, we need the full Jeffrey rule. So we are learning the general method." We can spend 1-2 minutes on this if asked.

  Closing question:
     - As above.

  Least confident step:
     - The non-commutativity example. It is crucial to get the rigidity with respect to the current distribution at the time of update. The audience might think that we are using the original prior conditionals in every update. We must be explicit: at each update, we use the conditional probabilities from the distribution we have at that moment. So in the second update of the first sequence, we are using the conditional probabilities from after the first update? But note: the rigidity condition for the second update says that the conditional probabilities given E and not-E relative to the distribution after the first update do not change during the second update. However, in our calculation above, we used the original prior conditionals. Why? Because the first update's rigidity condition preserved the conditionals from the prior, so after the first update, P1(A|E) = P_prior(A|E). Then the second update, starting from P1, sets P2(E)=0.9 and by rigidity, P2(A|E)=P1(A|E)=P_prior(A|E). So we are safe.

  But the audience might be confused by the two-step process. We must be very clear. Alternatively, we can do a numerical example.

  Numerical example for non-commutativity:
     - Let A be independent of E in the prior? Then the example is trivial. So we need dependence.
     - Prior: 
          P(E) = 0.5
          P(A|E) = 0.8
          P(A|not-E) = 0.4
          So P_prior(A) = 0.5*0.8+0.5*0.4=0.6

     - Sequence 1:
          Step1: Set P1(E)=0.7
          P1(A) = 0.8*0.7 + 0.4*0.3 = 0.56 + 0.12 = 0.68
          Step2: Set P2(E)=0.9
          P2(A) = 0.8*0.9 + 0.4*0.1 = 0.72 + 0.04 = 0.76

     - Sequence 2:
          Step1: Set P1'(E)=0.9
          P1'(A) = 0.8*0.9 + 0.4*0.1 = 0.72+0.04=0.76
          Step2: Set P2'(E)=0.7
          P2'(A) = 0.8*0.7 + 0.4*0.3 = 0.56+0.12=0.68

     - So we get 0.76 vs 0.68. And note, if we set P(E)=0.9 and then P(E)=0.7, we get the same as setting P(E)=0.7 and then P(E)=0.9? No, we get 0.76 and then 0.68 in one order and 0.68 and then 0.76 in the other? Actually, in the second sequence, after step1 we have 0.76 and after step2 we have 0.68. So the final answers are different: 0.76 vs 0.68.

  But note: the two sequences end with different probabilities for A. This illustrates non-commutativity.

  However, the audience might ask: why in the second update of the first sequence we don't use the updated conditional probabilities? The answer is: we do, but they haven't changed! Because in the first update, we assumed rigidity and so the conditionals remain the same as the prior. And then in the second update, we again assume rigidity relative to the current distribution (after the first update) and so they remain the same as they were after the first update (which are the same as the prior). So we are safe.

  But what if the evidence in the first update changed our conditional probabilities? Then we wouldn't have rigidity. But the rule assumes rigidity at each step.

  This is the key: rigidity is an assumption we make at each update. In this example, we are assuming that the experience that changes our degree of belief in E does not change the conditional probabilities of A given E or not-E.

  So the plan is sound. The step I am least confident in is whether the audience will grasp the rigidity condition as an assumption and not a tautology. We must emphasize that without this assumption, we wouldn't know how to update. We are choosing this rule because it is a natural generalization, but it is a choice.

  Also, the connection to relative entropy might be too abstract. We can skip it if time is short.

  Final plan:

  1. (5 min) Review of ordinary conditionalization.  
  2. (10 min) Motivating example: cloth in dim light.  
     - Prior: P(green)=0.5, P(natural fiber)=? (say 0.6, but we don't need the number).  
     - After looking: P_new(green)=0.7. How to update P(natural fiber)?  
     - Why we can't condition on a proposition about the experience? Because we don't have one. The experience directly changes our belief about color.  
  3. (15 min) Jeffrey conditionalization:  
     - Partition: {green, not-green}  
     - New probabilities: q=0.7 for green, 0.3 for not-green.  
     - Rule: P_new(A) = P(A|green)*0.7 + P(A|not-green)*0.3.  
     - Rigidity: We assume P_new(A|green)=P(A|green) and P_new(A|not-green)=P(A|not-green).  
     - Sanity check: if q=1, then P_new(A)=P(A|green).  
  4. (10 min) Non-commutativity:  
     - Two updates in a row on the same partition. Use the numerical example above.  
     - Conclusion: order matters.  
  5. (5 min) Closing:  
     - Connection to relative entropy: one sentence.  
     - Soft evidence: if asked.  
     - Closing question.  

  This should fit in 55 minutes.
answer: |-
  ### Plan for a 55-Minute Session on Jeffrey Conditionalization  
  **Goal:** Equip software engineers to apply Jeffrey conditionalization, understand its commitments (especially rigidity), and recognize key properties (non-commutativity, reduction to Bayes). Prioritize intuition and practical implications over formalism.  

  ---

  #### **Order of Components and Dependencies**  
  1. **Limitation of Ordinary Conditionalization (10 min)**  
     - **Why now?** Must establish the problem *before* introducing a solution.  
     - **Dependency:** Requires prior understanding of Bayes' theorem (P(A|E) = P(A∧E)/P(E)).  
     - **Key point:** Ordinary conditioning requires evidence E to become *certain* (P(E) = 1). Show a case where this fails: evidence is uncertain (e.g., a noisy sensor shifts confidence in E but doesn’t make it certain).  

  2. **Rigidity as the Core Assumption (15 min)**  
     - **Why now?** Rigidity enables the rule; it must be introduced *before* the mechanics.  
     - **Dependency:** Requires understanding that probabilities shift without certainty.  
     - **Key point:** Rigidity means conditional probabilities (e.g., P(A|E)) remain *unchanged* after updating P(E). Emphasize this is an assumption—not a mathematical inevitability.  

  3. **Jeffrey Conditionalization Rule (10 min)**  
     - **Why now?** Rigidity makes the rule statable.  
     - **Dependency:** Requires a partition (e.g., {E, ¬E}) and rigidity.  
     - **Key point:** P_new(A) = P(A|E) · P_new(E) + P(A|¬E) · P_new(¬E). Sanity check: If P_new(E) = 1, it reduces to Bayes.  

  4. **Non-Commutativity (10 min)**  
     - **Why now?** Requires the rule to compute sequential updates.  
     - **Dependency:** Must have applied the rule to see order-dependence.  
     - **Key point:** Show two updates in different orders yield different results. No "patch"—it’s inherent.  

  5. **Minimal Relative Entropy (Optional, 5 min)**  
     - **Why now?** Only if time permits after non-commutativity.  
     - **Dependency:** Requires comfort with the rule.  
     - **Key point:** For a single partition, Jeffrey minimizes KL-divergence to the prior. Mention that overlapping partitions lack closed-form solutions (iterative methods needed).  

  6. **Closing Question (5 min)**  
     - Assess understanding (see below).  

  ---

  #### **The Example to Carry the Session**  
  **Use a perceptual/ambiguous evidence scenario:**  
  > "You see a fabric under dim, shifting light. Pre-experience: P(Green) = 0.4. Post-experience: Your confidence shifts to P_new(Green) = 0.7. How to update P(NaturalFibers)?"  

  **Why this example?**  
  - **Avoids hidden conditioning:** No proposition like "I saw a flicker" is available to condition on (unlike sensor alerts, which often imply a conditioning event).  
  - **Highlights rigidity:** The experience doesn’t teach you about how *Green* relates to *NaturalFibers*—it only changes P(Green).  
  - **Supports non-commutativity:** Add a second experience (e.g., touching the fabric shifts P_new(Green) further).  

  **Switch examples for non-commutativity:**  
  After introducing the rule, use a numerical example:  
  > - Prior: P(E) = 0.5, P(A|E) = 0.8, P(A|¬E) = 0.2 → P_prior(A) = 0.5.  
  > - Update 1: Set P_new(E) = 0.7 → P_new(A) = 0.62.  
  > - Update 2: Set P_new(E) = 0.9 → P_final(A) = 0.74.  
  > - Reverse order: Set P_new(E)=0.9 first → P_new(A)=0.74; then P_new(E)=0.7 → P_final(A)=0.62.  
  Result differs → order matters.  

  ---

  #### **Misconceptions to Preempt**  
  1. **"This is just Bayes with softened likelihood."**  
     - **When:** During rigidity discussion.  
     - **Preemption:** "Rigidity isn’t about likelihoods—it’s an external commitment that P(A|E) doesn’t change. Without it, the math wouldn’t hold."  

  2. **"Rigidity is automatic."**  
     - **When:** Immediately after stating rigidity.  
     - **Preemption:** "Rigidity isn’t forced by probability theory. We *assume* it to generalize Bayes—it’s a substantive choice."  

  3. **"Non-commutativity is a bug to fix."**  
     - **When:** During non-commutativity demo.  
     - **Preemption:** "This isn’t a flaw—it reflects that evidence order affects belief when updates are uncertain. Streaming systems must track sequence."  

  4. **"Ordinary conditioning is wrong."**  
     - **When:** When motivating Jeffrey.  
     - **Preemption:** "Ordinary conditioning isn’t wrong—it’s a special case when evidence is certain. Jeffrey extends it."  

  5. **Overlooked misconception:** "Jeffrey is just interpolation."**  
     - **When:** When giving the rule.  
     - **Preemption:** "This isn’t arbitrary averaging—it’s pinned by rigidity. If P(A|E) changes, you can’t use Jeffrey."  

  ---

  #### **What to Leave Out**  
  1. **Generalization beyond partitions:** No time for non-exclusive/non-exhaustive cases.  
  2. **Derivation of relative entropy:** Mention it as a property, but skip math. Say: "For overlapping partitions, no closed form—iterative methods like IPF are used."  
  3. **Alternative rules (e.g., Pearl’s imaging):** Explicitly state: "Other update rules exist, but today we focus on Jeffrey."  

  ---

  #### **Handling Soft-Evidence Alternatives**  
  - **If raised:** Acknowledge it (e.g., virtual observations with fixed likelihood ratios).  
  - **Position:** "This is equivalent to Jeffrey *for a single partition*—same rule, different framing. For complex cases, Jeffrey is more general."  
  - **Why:** Prevents distraction while validating their intuition. Don’t dive deeper.  

  ---

  #### **Closing Question to Assess Understanding**  
  > "You update P(E) from 0.3 to 0.6 using Jeffrey. Later, you update P(E) from 0.6 to 0.9. Why isn’t this equivalent to updating from 0.3 to 0.9 in one step? What assumption does this violate?"  

  **Expected answer:**  
  - The two-step update assumes rigidity at each step (P(A|E) unchanged after first update), while a one-step update assumes rigidity from the *original* prior. Non-commutativity means they diverge.  

  ---

  #### **Weakest Point in the Plan**  
  - **Step:** Rigidity as an assumption.  
  - **Why risky:** Technical audiences may see it as "obvious" and miss its philosophical weight.  
  - **Watch for:** A colleague saying: "Isn’t rigidity *required* by probability theory? If P_new(E) changes, why wouldn’t P_new(A|E) stay the same?"  
  - **Response:** Rebut with: "Rigidity isn’t enforced—nothing stops you from changing P(A|E) if the evidence informs how E relates to A. Jeffrey *imposes* rigidity to extend Bayes. Without it, you couldn’t compute the update."  
  - **Literature note:** This *is* contested (e.g., subjectivist vs. objectivist Bayesians), but for applied contexts, rigidity is standard in Jeffrey updates.  

  ---

  **Session Flow Summary:**  
  1. **Ordinary Bayes fails** (10 min: example + gap).  
  2. **Rigidity as assumption** (15 min: why needed, not automatic).  
  3. **Rule and reduction** (10 min: mechanics + sanity check).  
  4. **Non-commutativity** (10 min: demo + implications).  
  5. **Relative entropy** (optional, 5 min: intuition only).  
  6. **Closing Q/A** (5 min).  

  **Total:** 55 minutes. Adjust by truncating relative entropy or non-commutativity examples if behind.
