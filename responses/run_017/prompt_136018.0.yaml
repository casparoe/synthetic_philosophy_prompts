  5. Plenitudinous platonism (damage 4, likelihood 4) - because it undercuts T3.
  6. Surveyable core for hard cases (damage 4, likelihood 4) - targets T4, which is already vulnerable.
  7. Grounding vs reference (damage 3, likelihood 4) - might be partly verbal, but if not handled well, it could blur the distinction.
  8. System-independent truth (damage 3, likelihood 3) - a follow-up to the logician's objection.
  9. Verbal dispute (damage 3, likelihood 3) - from the metaphysician.
  10. The one we concede: let's make it a separate one with high likelihood but we plan to concede. We'll assign damage 4 (because it's a real weakness) but we concede so we'll note that.

  But note: we must have one that we concede outright. So in the objections array, one of them should have a reply that is a concession. We'll mark that in the reply.

  Alternatively, we can have one of the objections be the one we concede, and in the reply, we say we concede and then a brief note.

  We'll also include:

  - concessions_up_front: array of sentences to say early. These should be strategic concessions to defuse tension. For example:
    1. "I concede that the Quine-Putnam indispensability argument is powerful and that platonism is a natural default position for the scientifically minded."
    2. "I acknowledge that my view does not (yet) provide a full account of mathematical explanation in science, and that this is an area needing further development."

  - must_land_reply: the reply that is crucial for the view to survive. This might be the reply to the Quinean objection, because if the indispensability argument stands, then nominalism fails.

  - hope_nobody_asks: an objection that is very damaging. Let's choose one about the application of mathematics that seems to require completed infinities, e.g., in quantum mechanics with non-separable spaces.

  - verbal_or_genuine: array of disputes that might be verbal. For example:
    1. Dispute: Whether mathematical sentences are truth-apt. Verdict: partly_verbal. Why: Because the nominalist can agree that mathematical sentences are true in a deflationary sense (true-in-S) while the platonist takes them as true simpliciter. The real issue is what grounds the truth.
    2. Dispute: Whether calibration is reference. Verdict: genuine. Why: Because the platonist takes reference to be a relation to abstract objects, while the nominalist takes it as a causal mapping to physical operations.

  Now, we write the JSON.

  Note: We must have at least 8 objections. We'll do 10.

