  1. Quinean philosopher of science (chair) - indispensability argument, platonism as default.
  2. Philosopher of science (sympathetic but cares about mathematical explanation) - wants cases.
  3. Set theorist (mathematics dept) - believes in sets, won't accept non-truth-apt view of math theorems.
  4. Philosopher of logic - knows conservativeness, incompleteness; will attack T1 on truth vs provability.
  5. Metaphysician (grounding and fundamentality) - may argue that the dispute is verbal or about grounding.
  6. Graduate student (defends plenitudinous platonism) - will attack T3.

  We also have venues: q_and_a (main session), one_on_one_with_set_theorist, grad_student_lunch, dinner.

  Structure the response as a single JSON object with:
  - concessions_up_front: array of strings (concessions to make early)
  - objections: array of objects with fields: id, raised_by, venue, objection_as_they_would_phrase_it, targets, kind, likelihood_1_to_5, damage_1_to_5, reply_two_minutes, soft_point, follow_up_to_survive
  - must_land_reply: string (the one reply that must land for the view to survive)
  - hope_nobody_asks: object with objection, why_it_hurts, best_available_reply, honest_concession
  - verbal_or_genuine: array of objects with dispute, verdict, why

  We need 8-10 objections. Let's aim for 10 to cover all bases.

  Order by damage_1_to_5 (descending) and then by likelihood (descending) so that high-damage, high-likelihood objections come first.

  Let's list potential objections:

  1. From the Quinean chair: 
     - Objection: The indispensability argument shows that mathematics is indispensable to our best scientific theories, and hence we must be committed to the existence of mathematical entities. Your calibration story doesn't account for the fact that we quantify over mathematical objects in science and that they play an ineliminable role in explanation. (Targets T2, T4; kind: explanatory, methodological; venue: q_and_a)

  2. From the philosopher of science (explanation):
     - Objection: You claim that mathematics is just a tool, but there are clear cases where mathematics explains physical phenomena (e.g., the honeycomb theorem, the periodicity of cicada life cycles). How does calibration nominalism account for mathematical explanations without invoking mathematical facts? (Targets T2, T4; kind: explanatory; venue: q_and_a)

  3. From the set theorist (one-on-one or q_and_a):
     - Objection: As a set theorist, I prove theorems about sets that are independent of ZFC. I take these theorems as true or false. But according to your T1, mathematical truth is relative to a system. How can you account for the objectivity of set-theoretic truth, especially in light of independence results? (Targets T1; kind: semantic, epistemological; venue: one_on_one_with_set_theorist or q_and_a)

  4. From the philosopher of logic:
     - Objection: Your T1 says that mathematical truth is derivability in a proof system. But by the incompleteness theorems, for any sufficiently strong system, there are sentences that are true (in the standard model) but not provable. This shows that truth outruns provability, so your account of truth is inadequate. (Targets T1; kind: semantic; venue: q_and_a)

  5. From the metaphysician:
     - Objection: Your dispute with the platonist seems to be about grounding: you want to ground mathematical truth in our practices, while the platonist grounds it in abstract objects. But if calibration is just a mapping that preserves structure, isn't that what the platonist calls reference? So aren't you just a platonist who adds a causal story about how we set up the mapping? (Targets T2, T3; kind: metaphysical, verbal; venue: q_and_a)

  6. From the graduate student (plenitudinous platonist):
     - Objection: In my plenitudinous platonism, every consistent mathematical structure exists, and epistemic access is trivial because we just pick the structure that fits. So the Benacerraf problem is solved. Your T3 claims that the platonist has a brute correlation problem, but we don't because we have a plenitude of structures. How is your view better? (Targets T3; kind: epistemological; venue: grad_student_lunch or q_and_a)

  7. Another from the Quinean (or the explanation philosopher) on T4:
     - Objection: You say that every application rests on a surveyable core, but what about theories that require non-separable Hilbert spaces in quantum mechanics? How can a finite fragment capture the essential mathematical content that is applied? (Targets T4; kind: methodological; venue: q_and_a)

  8. From the philosopher of logic on T1 and T4:
     - Objection: If mathematical truth is system-relative, then how do you account for the fact that we can compare different systems and say that one is an extension of another? Doesn't that presuppose a system-independent notion of truth? (Targets T1, T4; kind: semantic; venue: q_and_a)

  9. From the metaphysician on existence:
     - Objection: You call yourself a nominalist, but if you are not denying that mathematics is useful and that we use mathematical language, and if you are not providing an ontology-free reformulation of science (like Field), then what is the substantive difference between your view and a thin platonism? (Targets T1, T2, T3; kind: verbal; venue: q_and_a)

  10. From the set theorist on truth-aptness:
      - Objection: You claim that mathematical sentences are rules for manipulating notation and not truth-apt. But when I prove a theorem, I am discovering a truth about sets. Your view seems to make my life's work a mere game with symbols. (Targets T1; kind: semantic; venue: one_on_one_with_set_theorist)

  We also need:
  - One to concede outright: Let's pick one that is a known weak spot and where concession is strategic. Perhaps from the philosopher of science on explanation: we can concede that our account of mathematical explanation is underdeveloped and needs more work, but that calibration can play a role in understanding how mathematics contributes to explanation.

