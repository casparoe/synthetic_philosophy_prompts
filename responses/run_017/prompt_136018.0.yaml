prompt: |-
  I am finishing a dissertation in philosophy and in three weeks I am giving a job talk at a department I would very much like to join, and I would like you to build me the Q&A preparation sheet I would otherwise have to write badly myself the night before. The talk defends a version of mathematical nominalism that I call calibration nominalism, and I will give you its four theses so that the objections you generate have something concrete to bite on. (T1) Semantics: mathematical sentences are not descriptions of a domain of abstract objects; they are rules for manipulating a notation, their correctness conditions are given by derivability in a proof system, and mathematical truth is therefore always truth relative to a system, with the appearance of a system-independent mathematical truth explained by our practice of extending systems and comparing them. (T2) Applicability: what makes a piece of mathematics usable in an empirical domain is that its syntax is calibrated to that domain, in the sense that there is a homomorphism-like mapping from numerals, operations, and derivations onto physical items and operations (piles and their concatenation, pointer readings, the state transitions of a computing machine) such that the theorems of the system project onto real regularities; this mapping is causally mediated all the way down, because we build the abaci, the meters, and the processors so that it holds. (T3) The dialectical move I am most attached to: platonists say the nominalist faces a latching problem symmetric to the Benacerraf-style worry about epistemic access to abstracta, and I reply that my correlation is of exactly the kind we already accept for measuring instruments and is causally mediated, whereas theirs is a brute correlation with a causally inert realm, so the two problems are not symmetric after all. (T4) The thesis I expect to be attacked hardest: unlike Field-style nominalization programs, I do not try to rewrite a whole scientific theory without mathematical vocabulary; I claim only that every actual application rests on a surveyable core, meaning a finite fragment whose derivations a finite agent can check step by step without appeal to completed infinities, and I argue that the usual hard cases, among them infinitary analysis and differential equations in classical mechanics, vector spaces of uncountable dimension in quantum mechanics, and the group-theoretic classification of crystal symmetries, each have such a core. I already know the obvious cost of T4: it invites the charge that I am an instrumentist about pure mathematics with a deflationary footnote attached, and my supervisor made exactly that charge during my practice talk, in front of an audience that laughed in the right place.

  The audience matters more than the thesis here, so let me describe it. The search committee chair is a philosopher of science of a strongly Quinean stripe who treats the Quine-Putnam indispensability argument as close to settled and treats platonism as the working default of anyone who takes science seriously; a second senior philosopher of science in the room is sympathetic but works on mathematical explanation and will press the point that mathematics explains rather than merely predicts, and will want cases rather than programmatic claims. A set theorist from the mathematics department attends these colloquia regularly, works on independence results, thinks mathematicians quantification over sets is exactly what it appears to be, and will be unmoved by anything that requires him to regard his own theorems as non-truth-apt; I also have a one-on-one meeting with him the morning of the talk. There is a philosopher of logic who knows the conservativeness results and the incompleteness theorems cold and will go after T1 from the side of truth-outrunning-provability, including the standard move about sentences undecidable in whichever system I privilege. One metaphysician works on grounding and fundamentality and will ask whether my dispute with the platonist is really about existence at all rather than about grounding, and whether calibration is doing precisely the work the platonist assigns to reference, in which case I am a platonist with extra steps. Finally, I am having lunch with the graduate students, one of whom wrote a paper defending a plenitudinous or full-blooded platonism on which every consistent mathematical structure exists and access therefore becomes trivial, and who will aim that directly at T3. The format is forty-five minutes plus twenty-five for questions, so I can afford roughly two minutes per answer and no more.

  What I want from you is the prep sheet itself, ordered by expected damage rather than by likelihood, with eight to ten objections, at least one from each of the factions above, at least one that I should simply concede outright, and one that I am hoping nobody asks. Each objection should be written in the vocabulary of the person raising it rather than in neutral philosophical prose, should say which of T1 through T4 it targets and what kind of objection it is, and should come with a two-minute reply and an honest note about where that reply is weakest, since I would rather know now than at minute fifty. I also want to know what to concede in my first five minutes to take the sting out of the room, what the single reply is that has to land if the view is to survive the visit, and which parts of my disagreement with the platonists you suspect are merely verbal. Please do not cite or recommend any literature: I need arguments, not readings. Return your answer as a single JSON object, valid JSON and nothing else, with these fields: concessions_up_front as an array of strings, each a one-sentence concession to make early; objections as an array of objects with the fields id (a short snake_case label), raised_by (which person or faction above), venue (one of q_and_a, one_on_one_with_set_theorist, grad_student_lunch, or dinner), objection_as_they_would_phrase_it (one or two sentences in that person's own idiom), targets (an array drawn from T1, T2, T3, T4), kind (one of semantic, epistemological, metaphysical, methodological, explanatory, or verbal), likelihood_1_to_5 (integer), damage_1_to_5 (integer), reply_two_minutes (a string I could say aloud in about two minutes), soft_point (where that reply is weakest), and follow_up_to_survive (the one follow-up question I must not be destroyed by); then must_land_reply as a single string; then hope_nobody_asks as an object with the fields objection, why_it_hurts, best_available_reply, and honest_concession; and finally verbal_or_genuine as an array of objects with the fields dispute, verdict (one of verbal, genuine, or partly_verbal), and why.
