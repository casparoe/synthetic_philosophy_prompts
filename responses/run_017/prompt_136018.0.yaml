  We are building a Q&A preparation sheet for a job talk on "calibration nominalism" in philosophy of mathematics. The user has provided four theses (T1 to T4) and described the audience members who will be present. The goal is to generate 8-10 objections from the various factions, ordered by expected damage (high damage first) and including at least one from each faction, one to concede outright, and one they hope nobody asks.

