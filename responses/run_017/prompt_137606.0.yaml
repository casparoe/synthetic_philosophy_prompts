prompt: |-
  I'm trying to work out what I actually think about causation by omission, starting from my verdicts on concrete cases rather than from a theory. I'd like a principle that fits the pattern — or, if the pattern doesn't hold together, to be told plainly which of my verdicts has to go.

  Here are the cases:

  (i) My neighbor promised to water my plant while I was away; she didn't; the plant died. Her not watering caused the death. This is the clearest case I have.

  (ii) A man three thousand miles away, who has never heard of me or of the plant, also didn't water it. His not watering is not a cause at all — it isn't even a candidate.

  (iii) No rain fell for six weeks and the corn crop failed. The lack of rain caused the failure, as straightforwardly as hail would have. There is no agent, no promise, and no norm anywhere in the story.

  (iv) The ICU nurse didn't give the eight o'clock dose; the patient died; the dose would have saved him. Her omission caused the death. Now add that an intruder had locked her in a supply closet. I still want to say the missed dose caused the death, but the omission no longer seems to be hers: I want to point at the intruder, or at the hospital for staffing only one nurse.

  (v) The drug would have saved the patient, but hospital policy forbids the physician from administering it, so she doesn't, and he dies. I hear this exactly like the unmodified nurse case: her not administering it caused the death, and the policy makes that omission justified rather than causally inert. Yet she violated no norm, disappointed no expectation, and did precisely what her role required.

  (vi) The dean never denied the rumor; her silence was read as confirmation; donations collapsed. Her silence caused the collapse — but the route from omission to outcome here runs through what people believed, not through any physical process.

  (vii) The case I go back and forth on: my neighbor and I each promised to water the plant, each assumed the other had done it, neither did, and it died. If either of us had acted, the plant would have lived, and yet each of us can point at the other. Sometimes I say we both caused its death, sometimes that neither of us did, and "both" feels like counting one death twice.

  The principle I keep falling back on is roughly this: an omission causes an outcome only when it is a departure from a norm, an expectation, or an established practice — when there is a "she should have acted" somewhere in the story — and otherwise it is just an absence. That gives me the verdicts I want in (i), (ii) and (iv); it seems to give the wrong answer in (iii), where nothing normative is in play at all; and (v) is the case that worries me, because it looks causally identical to (i) while being normatively its mirror image. I have also started marking a distinction between omissions properly so-called, where someone fails to act, and bare absences, where there is simply no agent to fail — but I can't tell whether that distinction is doing real work or just restating the verdicts in (ii) and (iii).

  What I want from you: a principle, or a short list of candidate principles, stated precisely enough that I could apply it myself to a new case, with the case that motivates each clause; an honest account of which of my verdicts it cannot accommodate and why that one is the right one to drop; a verdict on (vii) with the reasoning that produces it; and at least one prediction about a kind of case I haven't listed, since that is how I'll know the principle is doing work rather than redescribing my intuitions. If the best account turns out to be disjunctive — one thing going on in (iii)-style absences, another in (i)-style omissions, another in (vi)-style cases that operate through interpretation — say so and say what the cost is. And let me name what I'd count as cheating: I don't want "cause" thinned into a relation on which every absence causes everything it is counterfactually connected to, and I don't want the line that omissions never really cause anything and are at most explanatory or at most grounds for blame.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're wrestling with causation by omission, using concrete cases to test their intuitions. Their main challenge is reconciling these cases into a coherent principle without resorting to theoretical jargon. 

  First, I need to map their verdicts clearly. Case (i) is their anchor: clear causation due to a broken promise. Case (ii) is the counterpoint—no causation from a stranger's inaction. Case (iii) is tricky because it lacks norms yet feels causal. Case (iv) with the locked nurse shows shifting blame but stable causation. Case (v) is pivotal: identical to (i) normatively inverted (justified omission), yet they still feel causation exists. Case (vi) involves interpretive effects, and (vii) is their unresolved "overdetermination" dilemma. 

  Their proposed norm-based principle works for some cases but fails (iii) and clashes with (v). The agent/absence distinction seems intuitive but doesn't resolve everything. 

  Hmm... the core tension is between their intuition that norms matter (i, iv) and cases where causation feels "norm-free" (iii, v). In (v), the physician didn't violate a norm—she followed policy—yet the user insists the omission caused death. That's the crux: causation persisting without norm violation. 

  What if causation by omission requires *responsibility* rather than blame? Responsibility could exist without blame (e.g., the physician in (v) is still the responsible agent, even if justified). This would cover (i), (iv), (v), and even (iii) if we treat weather patterns as "responsible" by convention? But (iii) has no agent... 

  Wait—for (iii), perhaps the "norm" is ecological necessity, not social. But the user explicitly rejects importing norms here. Alternative: causation arises when the omission is a *necessary condition* within a *salient dependency network*. "Salient" does heavy lifting—it's contextual. In (ii), the stranger isn't salient; in (iii), rain is salient for crops; in (vii), both neighbors are salient. 

  But how to define "salient" without circularity? The user mentioned "established practice"—maybe institutional roles create salience. Physician in (v) is salient due to role, nurse in (iv) due to duty (even if thwarted). For (iii), salience comes from natural dependency (crops→rain). 

  For (vii), if salience is shared, both omissions cause the death—but the user worries about double-counting. Perhaps in overdetermination, we say "either alone would suffice, so both are causes"? That’s standard in causal models. Their discomfort might stem from moral blame, not causation itself. 

  New case prediction: a lifeguard off-duty vs. on-duty omitting to save a swimmer. Principle should say: only the on-duty omission causes drowning (due to role salience), matching their norm intuition but anchored in responsibility, not blame. 

  Biggest cost: (iii) remains a stretch. If we frame natural dependencies as "practices," it feels forced. Alternatively, admit disjunction: agent-omissions require responsibility; non-agent absences require natural necessity. But they want unity. 

  Final principle: causation by omission requires (1) dependency (but-for condition), and (2) contextual salience of the omitted act, where salience comes from either (a) assigned responsibility (roles, promises) or (b) natural/conventional necessity (rain for crops). This covers (i)-(vi), and for (vii), both neighbors are salient (assigned responsibility), so both cause the death. 

  User’s verdict to drop: insisting (v) has no norm violation. Instead, the physician’s role makes her omission salient—even if blameless. That preserves causation.
answer: |-
  Here's a principled account that systematizes your verdicts while flagging tensions, grounded in **contextual salience of responsibility assignments**. It avoids "thinned" causation and preserves omissions as genuine causes.

  ### The Principle
  **An omission (X's failure to φ) causes outcome O iff:**
  1.  **Dependency:** O would not have occurred (or would have been substantially less likely) if X had φ-ed, *and*
  2.  **Salient Responsibility Assignment (SRA):** In the contextually relevant framework (social, institutional, functional, or natural), X is saliently assigned the role, capacity, or expectation to φ for the type of outcome O.

  ### Key Concepts Explained
  *   **Omission:** Applies only to agents (individuals or entities) who *could* have acted. Bare absences (no agent) aren't omissions.
  *   **Contextually Relevant Framework:** The set of norms, roles, functions, or dependencies *taken as background* for evaluating causation in *this specific case*. This isn't necessarily moral blameworthiness.
  *   **Salient Responsibility Assignment (SRA):** X is non-trivially designated (explicitly or implicitly) by the context as the entity whose action/inaction is *relevant to preventing O*. This can arise from:
      *   *Explicit commitment:* Promises, contracts, job descriptions (Cases i, iv, v, vi).
      *   *Institutional role:* Defined duties within a system, even if blamelessly constrained (Cases iv, v).
      *   *Functional role:* An entity's designated purpose within a system (e.g., irrigation, rain for crops - see Case iii).
      *   *Control/Proximity:* Unique capacity and access to intervene (Case iv - nurse was *the* assigned caregiver).
  *   **"Saliently":** The assignment must be *operative in the causal story*. Random strangers (Case ii) lack this salience.

  ### Application to Your Cases
  *   **(i) Neighbor & Promise:** ✅ **Causes.** *Dependency:* Plant lives if she waters. *SRA:* Promise creates explicit responsibility assignment *to her* for plant survival.
  *   **(ii) Distant Stranger:** ❌ **Not a cause.** *Dependency:* Plant still lives if he waters? (Likely not, given distance/lack of access). *But: No SRA.* He has no contextual role/expectation re: *your* plant.
  *   **(iii) Lack of Rain:** ✅ **Causes.** *Dependency:* Crop likely survives with rain. *SRA:* Within the *natural/agricultural framework*, rain functionally "assigned" as necessary input for crop growth. No *moral* agent, but a *functional* responsibility is contextually salient.
  *   **(iv) Locked Nurse:** ✅ **The missed dose causes death.** ❌ **The nurse's omission does NOT cause death.** *Dependency:* Dose saves patient. *SRA:* Nurse's *role* assigns responsibility to administer doses. *However*, the intruder/hospital *severed her capacity* to fulfill the role. The salient responsible entity *for the dose not being given* shifts to the intruder/hospital system that disabled her. The *omission* (failure to act) belongs to the system, not the incapacitated nurse. The *cause* is the dose's absence, linked to the disabling act.
  *   **(v) Physician & Policy:** ✅ **Her not administering causes death.** *Dependency:* Drug saves patient. *SRA:* Physician's *institutional role* saliently assigns her responsibility for *making treatment decisions*, even if constrained by policy. She *is* the agent whose action/inaction is contextually relevant to administering treatment. The policy justifies her omission *morally/institutionally*, but doesn't dissolve her *causal role* within the medical framework. (This preserves causal identity with i while accommodating normative difference).
  *   **(vi) Dean's Silence:** ✅ **Causes collapse.** *Dependency:* Denial likely prevents collapse. *SRA:* Dean's *leadership role* saliently assigns responsibility for managing communications/rumors affecting the institution. Belief-mediated causation is still causation.
  *   **(vii) Mutual Neighbors (Promise):** ✅ **BOTH omissions cause the death.** *Dependency:* Plant lives if *either* acts. *SRA:* *Each* has an explicit promise/commitment creating a salient responsibility assignment *to them individually* for plant survival. Each omission is independently sufficient. This *is* causal overdetermination by omission. Your discomfort ("counting one death twice") stems from *moral* blame allocation, not causation. Causally, both failures are real causes.

  ### Verdicts Requiring Adjustment & Why
  *   **Case (iv): Your Verdict:** Nurse's omission causes death. **Principle Says:** Nurse's *omission* doesn't exist causally (she was incapable); the *cause* is the system's failure/dose absence. **Why Adjust?** Her incapacity severs the link between *her agency* and the outcome. The SRA framework explains why we *blame* the system/intruder – they became the salient responsible entity by disabling the primary agent.
  *   **Case (v): Your Worry:** Normative mirror of (i) might imply no causation. **Principle Says:** Causation holds. **Why Keep Verdict?** SRA decouples causal role from blameworthiness. Her *role* makes her omission salient within the causal chain, regardless of justification. Dropping causation here would break the dependency link and make (v) causally mysterious compared to (i).
  *   **Case (iii): Your Norm Worry:** Principle handles it via *functional* SRA in the natural context, not social norms. This is the cost of a unified account. **Alternative (Disjunction):** If this feels forced, a disjunction is needed: Add "or (c) φ-ing is a *naturally necessary condition* for preventing O in the system, and no agent is contextually salient for providing φ." This cleanly separates agent-omissions (i, iv-vii) from non-agent absences (ii-iii). **Cost:** Less unity; (iii) becomes a different *type* of cause.

  ### Prediction: A New Case Type
  *   **Case:** A city's automated floodgate system (controlled by AI) fails to activate during a storm due to a software bug. The city floods. No human actively omitted to act; the system just didn't function.
  *   **Principle Prediction:** ✅ **The system's failure to activate causes the flood.** *Dependency:* Activation prevents flood. *SRA:* The floodgate system has a *functional role* assigned within the city's infrastructure framework to prevent flooding. It is the salient entity responsible for this function. (No human *omission* is identified unless a human was saliently responsible for maintaining the system and failed).

  ### Why This Works & What It Costs
  *   **Accommodates Your Core:** Preserves omissions as causes, avoids overextension (Case ii), handles norm-justified cases (v), distinguishes omissions from bare absences.
  *   **Addresses Your Cheating Concerns:** Not counterfactual alone (SRA filters), omissions are genuine causes not just explanatory/blame markers.
  *   **Costs:**
      *   **Abstraction:** "Salient Responsibility Assignment" is abstract, though grounded in context.
      *   **Case (iv) Shift:** Requires accepting that the *agent* of omission can change under constraint (nurse -> system). This matches your intuition to "point at the intruder/hospital".
      *   **Case (iii) Stretch:** Framing natural necessity as "functional responsibility" might feel metaphorical. The disjunctive alternative avoids this but sacrifices unity.
      *   **Overdetermination (vii):** Requires accepting that two omissions can both be full causes of one outcome when either was sufficient. This is standard in causal modeling but can feel intuitively "double-counting" for moral purposes.

  The principle provides a clear, applicable test: Identify the outcome, check if a specific agent's action was necessary to prevent it, and crucially, determine if that agent was contextually "on the hook" for performing that action within the relevant framework. This captures the essence of why some omissions matter causally and others don't.
