answer: |-
  ## The Case for the Fact-First Account: Defeating Bradley's Regress

  Bradley's regress presents a profound challenge to the intelligibility of propositions and facts. While it seems compelling, I argue that the regress rests on a fundamental error—the **freezing fallacy**—and that the **fact-first (inherited-unity) account** provides the most defensible solution, avoiding the pitfalls of alternatives while explaining propositional unity without generating a vicious regress. Here's the rigorous case:

  ### (1) Diagnosing the Freezing Fallacy: Why the Regress *Seems* Compelling
  The regress gains traction only because it illicitly transforms the ontological status of the relation within the complex. Consider the fact `aRb`. The regress begins by treating `R` as just another *object* or *inert constituent* alongside `a` and `b`. This is the **freezing fallacy**: we conceptually "freeze" the essentially *active*, unifying role of `R` into a passive, self-contained entity. Once frozen, `R` appears as a disconnected item needing "glue" to bind it to `a` and `b`. This demand for glue (instantiation, exemplification, a nexus) is *question-begging* because it *presupposes* the very inertness it seeks to explain. The fallacy is twofold:
  *   **Mischaracterization:** It ignores that `R`'s very nature is *to relate* `a` and `b`. In the fact `aRb`, `R` isn't *added* to `a` and `b`; its occurrence *is* the relating.
  *   **Illicit Demands:** Having frozen `R`, we demand an explanation for its connection to the relata that we would *never* demand for the relata themselves in their bare particularity. Why isn't a "glue" needed between `a` and its bare particularity? The regress selectively targets the relation, revealing the fallacy.

  The regress feels compelling because the frozen picture is intuitively graspable—we model relations on objects. But this intuition stems from a misunderstanding of how relations function within unified states of affairs. The fallacy generates an artificial problem.

  ### (2) Explaining Unity without Regress: The Fact-First Account
  The fact-first account dissolves the regress by grounding propositional unity ontologically *prior* to the proposition itself:

  *   **Primacy of the Fact:** The fundamental unity resides in the **irreducibly relational state of affairs**, `aRb`. This state of affairs is not a mereological sum (`a` + `R` + `b` + `Tie`). It is a *sui generis* unity where `R` *occurs as relating*. `R`'s existence here *just is* its holding between `a` and `b`. There is no "gap" for a tie to fill because the relating is constitutive of `R`'s occurrence *in this context*. The unity is primitive and internal to the fact.
  *   **Inherited Unity:** A proposition (e.g., *that aRb*) is an *abstraction* from, or a *truth-bearing derivative* of, such possible or actual states of affairs. Its unity is not constructed internally from constituents plus a tie. **The proposition inherits its structure and unity from the *form* of the fact it represents.** We understand the proposition *that aRb* precisely because we grasp the *type of unified situation* it depicts – the situation where `R` *actively relates* `a` to `b`. The difference between the proposition *that aRb* and the mere list `<a, R, b>` is this: the proposition *presents* or *expresses* the *way* `a`, `R`, and `b` would be unified in the corresponding fact (`R` actively relating `a` to `b`), whereas the list presents them as inert, disconnected items. The proposition's unity is derivative and intentional; it points to, or is structured by, the primitive unity inherent in the *kind* of fact it concerns.

  Crucially, **no internal propositional tie is needed** because the binding work isn't done *within* the propositional complex. It is done by the *ontological structure of the fact* from which the proposition derives its content and unity. The proposition "borrows" its structure.

  ### (3) Superior Cost-Benefit Profile vs. Alternatives
  The fact-first account avoids the severe costs of its main rivals:

  *   **Vs. Bradley's Monism:** Bradley's own solution (radical monism where all relations are internal and ultimately unreal, dissolving into the Absolute) is prohibitively costly. It denies the reality of pluralism, contingency, and external relations – core features of our world and thought. The fact-first account **preserves genuine relations and plurality** by taking facts like `aRb` as fundamental unities without dissolving the distinctness of `a`, `R`, and `b`.
  *   **Vs. Primitive Instantiation/Exemplification:** Positing a fundamental "tie" or "nexus" (call it `T`) that glues `a`, `R`, and `b` together *invites the very regress it aims to stop*. What connects `T` to `a`, `R`, and `b`? Is it `T2`? The regress reignites. Furthermore, `T` becomes a mysterious, "spurious" universal: it must relate without being related, or else we face a new regress about `T` itself. The fact-first account **eliminates the need for this problematic primitive tie** by grounding unity in the active nature of `R` within the primitive fact.
  *   **Vs. Primitive Propositional Tie:** Some posit a special "propositional glue" distinct from ontological instantiation. This suffers the same regress problem as primitive instantiation (what connects the glue to the constituents?) and adds **mystery**: how does this purely "propositional" entity manage to "relate" without being a relation subject to Bradley's original argument? The fact-first account **explains propositional unity non-mysteriously** by deriving it from the intelligible unity of facts, avoiding an *ad hoc* primitive.

  The fact-first account offers ontological parsimony (no extra primitive ties), avoids vicious regresses, preserves relations and plurality, and provides a clear explanation of propositional structure. Its main "cost" is accepting irreducible facts/states of affairs as fundamental unities – a cost shared by nearly all realist solutions and arguably necessary for a coherent metaphysics.

  ### Addressing the False Proposition Objection
  *   **The Objection:** If propositional unity is inherited from *facts*, how can *false* propositions be unified? There is no fact `aRb` for the proposition *that aRb* to inherit unity from if it's false.
  *   **The Fact-First Reply:**
      1.  **Abstraction from *Possible* Facts/States of Affairs:** False propositions abstract from *possible* or *potential* unified states of affairs. The unity of the proposition *that aRb* is inherited from the *form* or *structure* of the *type* of situation it represents – the situation *where `R` actively relates `a` to `b`*. We grasp what it would be *for `a` to be R-related to `b`*. This grasp involves understanding the *active role* `R` would play *in such a situation*. The proposition inherits its unity from this *possible* unity, not necessarily an actual one.
      2.  **The Role of the Mind/Intentionality:** Grasping a false proposition involves *entertaining* or *representing* the *way* objects and relations *would* be unified *if* the proposition were true. Our cognitive capacity allows us to intend or project the unified structure inherent in the possible fact `aRb`. The unity we grasp is the unity *of that possible configuration*. The freezing fallacy would tempt us to think that in grasping `<a, R, b>` as a false proposition, we have three inert items in the mind needing a mental tie. But just as with the fact, `R` in the *represented content* is understood *as relating* `a` to `b` *within the scenario we are considering*. The intentional act targets a *unified possibility*.
      3.  **The Primacy of Form:** The fundamental point is that the *source* of propositional unity – the structure where a relation is understood as actively connecting relata – is derived from the *category* of facts/states of affairs. False propositions exploit this structure, applying it to cases where it isn't instantiated. The unity isn't magically conjured *ex nihilo* in the false proposition; it is parasitic on our understanding of what unity *is*, which is grounded in the reality (and possibility) of unified facts.

  **Conclusion:** Bradley's regress is a powerful challenge, but it stems from the freezing fallacy – the mistaken reification of relations into inert objects. The fact-first account offers the most defensible solution. It diagnoses the fallacy, grounds the unity of propositions in the primitive, active unity of facts (or possible facts), avoids vicious regresses by eliminating the need for an internal propositional glue, and proves superior to alternatives by preserving relations, plurality, and contingency without mystery or *ad hoc* primitives. While the objection concerning false propositions requires careful handling, it is resolvable by recognizing that propositions inherit their structure from the *form* of possible facts, grasped intentionally. The fact-first account provides a robust, coherent, and ontologically economical foundation for understanding the unity of the proposition.
