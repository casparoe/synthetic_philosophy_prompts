prompt: |-
  I'm a journalist writing about the current boom in prestige dramatizations of real lives — a limited series that invents its subject's private conversations wholesale, a biopic that folds three colleagues into one composite character, a docudrama that gives a real and well-documented figure a fabricated motive for a decision she in fact made. The more ethical commentary I read, the more I find myself holding what I'll call the surrogate-interest view: the dead are not the kind of thing that can be wronged or benefited, so whatever we owe concerning them — including whatever we owe in dramatizing them — is owed to the living: to descendants who still live inside the story, to communities that organize themselves around a memory, to a public with an interest in an accurate record. Tell me what would count against it. I want the cases, intuitions and adjoining commitments it stands or falls with — the fabricated atrocity pinned on someone dead three centuries, the deathbed promise kept long after everyone who witnessed it is gone, the last surviving eyewitness, the invention no viewer could ever detect and that costs no living person anything — ranked from fatal to merely awkward, together with which of them a defender should concede rather than manage. I especially want to know whether the move I keep making in my own drafts has insulated the view past the point of risk: that we can still respect the interests of the person she was before dying, since her ante-mortem desires reached forward into precisely these post-mortem events — the prospective-interest move, as I've been calling it. If it has, say whether that is a defect in a view of this kind or simply what a true view looks like once stated carefully. For what it's worth, the undetectable-invention case is the one I would personally find hardest to shrug off.
reasoning: |-
  Okay, the user is a journalist exploring the ethics of dramatizing real lives in prestige TV and film. They've developed what they call the "surrogate-interest view": since the dead can't be harmed, obligations are only to the living—descendants, communities, or the public's interest in an accurate record. They want to know what challenges this view, especially cases like fabricating atrocities centuries later, keeping deathbed promises long after witnesses are gone, undetectable inventions, etc. They also question if "prospective interests" (the person's pre-death desires about post-death events) can protect the view.

  First, I need to unpack their surrogate-interest view. It's consequentialist, focusing on impacts on the living. But they're aware of counterexamples. The key is to identify which cases challenge this view fatally versus awkwardly. The fabricated atrocity example seems strong because it harms reputation without affecting the living. The deathbed promise might be weaker since no living person is harmed, but it feels like a moral breach. The undetectable invention is tricky because it has no consequences, yet intuitively feels wrong.

  The prospective-interest move is their defense: respecting the person's past desires. But does that hold? If someone didn't express any desires about their legacy, does that mean anything goes? Or is there an inherent dignity? Also, how do we know their desires? If they wanted to be forgotten, but a dramatization is made, does that violate their interest even if no one living is affected?

  Ranking the counterexamples: 
  - Fatal: Fabricated atrocity. It's a reputational harm where no living person is directly affected, but it feels deeply wrong. Surrogate-view can't explain this.
  - Strong: Deathbed promise. Upholding promises to the dead might be about the promisee's integrity, but the surrogate-view might handle it by saying the living promise-keeper's character is affected. However, if no one knows, it's problematic.
  - Awkward: Undetectable invention. If no one knows and no harm, why is it wrong? Prospective interests could work here if the person desired accuracy. But if they didn't, maybe it's permissible? But the journalist feels this is hard to shrug off, indicating a possible flaw in the surrogate-view.

  The prospective-interest move might salvage some cases but not all. For example, if the person had no expressed desires, does that mean no obligations? That seems counterintuitive. Also, there's a risk of overextending; if every dead person's wishes must be respected, it could be impractical. But the user might argue that respecting known wishes is key. However, what about unknown wishes? Default to accuracy or dignity?

  Underlying tensions: 
  - Moral status of the dead: do they have interests or only the living? 
  - Truth as an intrinsic value vs. instrumental (only matters if it affects people). 
  - The role of art vs. historical record. Dramatizations might prioritize narrative over truth, but does that violate an ethical duty?

  The user's personal struggle with the undetectable invention case suggests they feel there's an intrinsic wrong in misrepresentation, even without consequences. That points to a possible gap in the surrogate-view. The prospective-interest move might address it if we assume people generally desire accurate representation. But if not, or if we can't know, it's tricky.

  Conclusion: The surrogate-view is challenged by cases where no living person is harmed, yet misrepresentation feels unethical. Prospective interests help but don't cover all scenarios, especially when desires are unknown. The view must concede that some misrepresentations wrong the dead intrinsically, or adjust to include moral duties beyond interests. The journalist needs to decide if expanding to prospective interests makes the view plausible or if it's a patch that doesn't fully resolve the issues.
answer: |-
  Here's a breakdown of challenges to the surrogate-interest view, ranked from potentially fatal to awkward, with analysis of the prospective-interest move and its implications:

  **Core Challenge:** The surrogate-interest view struggles with cases where *no identifiable living person or group suffers harm or offense*, yet the dramatization *feels* like a violation against the dead subject themselves.

  ### Ranked Counterexamples & Intuitions
  1.  **The Fabricated Atrocity (Centuries Later):**
      *   **Case:** A prestige series depicts a well-regarded 18th-century figure (with no living descendants or specific community claimants) committing a horrific, entirely invented atrocity purely for dramatic shock.
      *   **Intuition:** This feels deeply *wrong* – a profound injustice *to the dead person*, regardless of impact on the living. It violates their historical identity and dignity.
      *   **Challenge to Surrogate-View:** *Fatal*. If no living community organizes around this figure, no descendant is hurt, and the public record is demonstrably accurate elsewhere, the surrogate-view struggles to explain the moral revulsion. It suggests obligations exist beyond the interests of the living. The harm is *to the truth about the person*, intrinsically.
      *   **Adjoining Commitments:** Requires accepting that historical truth and a person's reputation *in themselves* have moral weight, independent of contemporary consequences. Leans towards a deontological ("duty-based") view of truth-telling about persons.
      *   **Defender's Move:** **Concede.** This is the strongest counter. A defender must either bite the bullet and say "It's distasteful but not *wrong* if it harms no one alive" (which clashes sharply with common intuition) or significantly modify the view (e.g., adopt prospective interests OR acknowledge a duty to historical truth itself).

  2.  **The Undetectable Invention (Costing Nothing):**
      *   **Case:** A biopic invents a private conversation or minor, inconsequential motive for a long-dead figure. This invention is undetectable by any viewer (due to lack of records) and demonstrably causes no harm, offense, or confusion to any living person, descendant, or community.
      *   **Intuition:** Many (like you) feel a persistent unease. It feels like a *lie* *about that person*, a violation of their integrity, even if "victimless" in the living world. It disrespects the *reality* of who they were.
      *   **Challenge to Surrogate-View:** **Strong to Fatal** (depending on strength of intuition). This directly tests the core claim: if *no living interest* is affected, can it be wrong? The surrogate-view *must* say "No." Yet the intuition often says "Yes, it *is* wrong *to the dead person*."
      *   **Adjoining Commitments:** Highlights a belief in the inherent wrongness of misrepresentation, even if harmless and undiscovered. Suggests persons have a "posthumous right to truth" or that truth has intrinsic value.
      *   **Defender's Move:** **Concede or Radically Qualify.** A pure surrogate-view defender *must* argue this is permissible. To avoid this, they *need* the prospective-interest move or must argue that *all* such inventions *potentially* erode the historical record in subtle ways affecting the living public interest (a weaker argument here).

  3.  **The Deathbed Promise (Long After Witnesses):**
      *   **Case:** Someone promises a dying person to keep a specific, sensitive secret (e.g., the true paternity of their child). Decades later, after all witnesses and immediate descendants are dead, a prestige drama reveals the secret as a major plot point, accurately based on newly found diaries.
      *   **Intuition:** Breaking the promise *feels* wrong, even though the promisee and all witnesses are gone, and no living person might be directly harmed (perhaps descendants even learn a "truth"). The duty seems owed *to the dead person*.
      *   **Challenge to Surrogate-View:** **Strong.** While the *living* promisor might feel guilt (a living interest), the *wrongness* seems anchored in the broken promise *to the dead person*. If the promisor is also dead, the challenge is clearer: does the dramatization violate the dead promisee's interest in the promise being kept?
      *   **Adjoining Commitments:** Involves the moral weight of promises *as such*, especially solemn ones, and the idea that obligations can persist beyond the lifetimes of the obligated if the *object* of the obligation was the deceased's wish/secret.
      *   **Defender's Move:** **Manage or Concede.** Can argue the obligation was *always* to the living promisee (their integrity) while alive, and now only the public interest in historical truth remains. Alternatively, concede that respecting the dead person's *wishes* (prospective interests) creates a duty binding on the living, even after direct witnesses are gone.

  4.  **The Last Surviving Eyewitness:**
      *   **Case:** A drama heavily fictionalizes events witnessed *only* by one very old person, who objects fiercely, claiming it distorts their lived reality and the memory of the deceased subject. The public has no strong prior narrative.
      *   **Intuition:** The eyewitness's distress feels significant and morally relevant.
      *   **Challenge to Surrogate-View:** **Manageable.** This fits *neatly* within the surrogate-view. The eyewitness is a living person with a direct, profound interest in the accuracy of events they experienced and the memory of the deceased participant(s). Their distress is a clear harm to a living interest.
      *   **Adjoining Commitments:** Recognizes the importance of lived experience and personal memory as a living interest worthy of consideration.
      *   **Defender's Move:** **Manage.** This is the surrogate-view's *strongest* case. The obligation is clearly to the living witness. Concessions might involve degree of distortion and public interest.

  5.  **The Composite Character (Costing Little):**
      *   **Case:** A biopic folds three minor, similar colleagues of the main subject into one composite character for narrative simplicity. Descendants of the three exist but aren't deeply offended or harmed; the public record is clear this was done for dramatic concision.
      *   **Intuition:** Mildly awkward or unproblematic. Common practice, understood as dramatic license.
      *   **Challenge to Surrogate-View:** **Minimal/Awkward.** The surrogate-view acknowledges minor harm to descendant interests or historical purists' interests, but weighs it against artistic necessity and public interest in accessibility. It's a balancing act *within* the framework.
      *   **Adjoining Commitments:** Acknowledges that artistic representation involves necessary simplification and that minor historical inaccuracies can be tolerated for greater narrative impact serving the public interest.
      *   **Defender's Move:** **Manage.** Easily handled by weighing the minor potential harm to living interests against the benefits (clarity, pacing, accessibility) for the wider public interest.

  ### The Prospective-Interest Move: Insulation and Defect
  You've identified the key potential escape hatch: **respecting the ante-mortem desires of the person.**

  *   **How it Insulates:** It directly addresses the fatal/strong counterexamples:
      *   **Fabricated Atrocity:** We can reasonably assume the person had a fundamental desire *not* to be falsely depicted as a monster. Respecting that *prospective* interest makes it wrong, independent of current harm to the living.
      *   **Undetectable Invention:** If the person desired an accurate portrayal (a common, reasonable assumption), inventing conversations violates *that desire*, even if undetected.
      *   **Deathbed Promise:** The promisee had a clear prospective interest in secrecy being maintained.
  *   **Is it a Defect or True View?** This is the crux.
      *   **Not Necessarily a Defect:** Incorporating prospective interests significantly strengthens the view, making it far more intuitive and robust against the hardest counterexamples. It grounds obligations in something concrete *about the deceased person themselves* (their wishes) rather than *only* in the feelings/needs of the living. It aligns with widely held intuitions about wills, funerary wishes, and reputation. A carefully stated view *should* include this.
      *   **Potential Weaknesses (True View or Defect?):**
          *   **Unknown/Unknowable Desires:** What if we have *no idea* what the person would have wanted? Does the surrogate-view default apply (only living interests matter)? Or is there a *default* duty to accuracy/respect arising from personhood itself? The prospective-interest move struggles here. (A "true" view might need a default principle).
          *   **Contradictory or "Unreasonable" Desires:** What if someone *wanted* outrageous lies told about them? Or wanted their atrocities hidden? Do we respect *all* prospective interests? (Likely not – living interests in truth/history would override). This requires careful boundaries.
          *   **Overextension?** Does respecting prospective interests imply burdensome research or veto power for estates long after? (A practical concern, not necessarily fatal to the *principle*).
          *   **Does it Fully Capture the Intuition?** Even if someone *didn't* explicitly care about their legacy, does falsely depicting them as a monster *still* feel wrong? (The "Fabricated Atrocity" intuition might persist, suggesting an inherent dignity beyond desires). The prospective-interest move explains *most* cases well, but perhaps not *all* intuitions perfectly.

  **Conclusion & Recommendation:**

  1.  **Concede the Fatal Flaw:** A pure surrogate-view *must* concede the "Fabricated Atrocity" case exposes a fatal weakness. It cannot explain the strong intuition that this intrinsically wrongs the dead person *without* invoking living interests. The "Undetectable Invention" case is similarly devastating for the pure view.
  2.  **Embrace Prospective Interests:** Your move is **essential and correct** for a viable ethical framework. It's not a patch; it's a necessary refinement moving towards a "truer" view. It transforms the view from "only the living matter" to "we owe the dead respect for their *own* forward-reaching interests/wishes concerning their legacy and truth." This successfully insulates the view against the most serious counterexamples by grounding obligations in the *person themselves*.
  3.  **Acknowledge Remaining Tensions:** Admit the edges:
      *   The "Unknown Desires" problem (what is the default?).
      *   The potential conflict between respecting known desires and the broader public interest in historical truth (e.g., exposing a truth someone desperately wanted hidden).
      *   The lingering intuition that misrepresentation might *still* violate an inherent dignity, even absent specific desires (though prospective interests cover most instances).
  4.  **Reframe the View:** You arrive at a **"Prospective/Surrogate Hybrid"** view:
      *   **Primary Obligation:** To respect the verifiable, reasonable ante-mortem desires of the person regarding their portrayal and legacy (Prospective Interests).
      *   **Secondary Obligation:** Where desires are unknown, unreasonable, or outweighed by compelling public interest, obligations shift to minimizing harm and respecting the legitimate interests of the living (Surrogate Interests) – descendants, relevant communities, and the public's interest in a reasonably accurate historical record.
      *   **Underlying Principle:** A duty of respect for persons, extending to their memory and historical identity, operationalized through their known wishes and consideration for those still living who have a stake in that identity.

  This hybrid view preserves the core insight that the dead cannot *experience* harm, while acknowledging we have serious moral obligations *concerning* them, rooted in *their own past agency* (wishes) and the *inherent significance of truth and personhood* reflected in the interests of the living. It accepts the hardest cases as genuine ethical problems, not mere awkwardness. Your "prospective-interest move" isn't over-insulation; it's the necessary keystone.
