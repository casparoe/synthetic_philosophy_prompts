prompt: |-
  I'm revising a paper draft in which I defend a version of omissive eliminativism: roughly, that absences, failures, and non-occurrences are never themselves causes, and that every apparently causal claim about an omission is either elliptical for a claim about some positive event or state that did occur, or is really a normative, explanatory, or epistemic judgment wearing causal vocabulary. My worry is no longer whether the positive argument works; it's whether the view has any exposure left at all. Every time I press on it, it seems to absorb the pressure by redescribing the case, and I can't tell whether that is the ordinary stability of a research programme or a sign that I have qualified the thesis into something unfalsifiable. So I want a map of what it risks, not a survey of the literature and not a reading list: I want arguments, sorted, with the sorting defended.

  Here is my current inventory of candidate defeaters, which I'd like you to rank from fatal to merely awkward and then go beyond. (1) The interventionist parity argument: in the formal frameworks used to model prediction and control, whether the gardener waters can be set, randomized, and intervened on just as cleanly as how much she waters, and a variable taking the value zero behaves like any other value; if causation is whatever answers to intervention and supports explanation, omissions qualify. (2) The default-relativity parity argument: I claim that omissive causation is disqualified because whether the plants died because of the not-watering depends on what counts as the normal or expected course of events, but structural-equation and contrastive treatments suggest all causal claims are sensitive to a contrast class or a default, so my disqualifying feature is not special to omissions. (3) The relevance-preserving paraphrase problem, which is the one that actually keeps me up: when I paraphrase there was no heat input as the fuel valve was shut, the positive state I substitute seems to matter only because it excludes heat input, so the absence appears to be doing the causal work in the explanation after all, and my paraphrase looks like it borrows its relevance from the very thing it was supposed to eliminate. (4) Double prevention: much of biology and medicine appears to work by something's not happening, as when cell death results from a repair mechanism's failing to engage, and eliminating omissions here may cost more than it saves. (5) The cost-to-practice argument: if I am right, an enormous amount of ordinary, historical, and scientific explanation is systematically in error, and a thesis that implies that much error had better be nearly forced. (6) The empirical evidence that ordinary attributions of causation to omissions track whether the agent was supposed to act rather than bare counterfactual dependence, which I currently treat as supporting my view but which I concede might cut the other way if the norm-sensitivity turns out to be present for actions too. (7) The suspicion that the whole dispute is verbal, so that nothing is really at stake.

  For each of these I want three things: whether a committed eliminativist should concede it as counting against the view or dismiss it as question-begging, which further case or result it stands or falls with, and what would have to be true for it to become decisive rather than merely annoying. I'd also like you to add defeaters I haven't listed, especially any that tie the thesis to a commitment elsewhere that I might not notice I have. Two further questions I care about particularly. First, does anything outside philosophy actually turn on whether omissions are causes: negligence liability, the way inquiries into disasters apportion responsibility between what was done and what was not done, epidemiological claims about harms that followed from a programme's not being implemented? If nothing practical turns on it, is that itself fatal, or is it compatible with the thesis being true and merely terminological? Second, and relatedly: if you conclude that the view is well insulated, tell me honestly whether that is a defect for a thesis of this kind or simply what metaphysical theses about causation look like when they are in good shape. I am most likely to be moved by something that shows my paraphrase strategy cannot preserve explanatory relevance, and least likely to be moved by straightforward appeals to what people are inclined to say; please weight accordingly, and say if you think those weightings are themselves a mistake.
reasoning: |-
  Okay, let me approach this systematically. The user is defending omissive eliminativism and has listed seven potential defeaters. They want these ranked from fatal to awkward, with analysis of how each interacts with their thesis. The key is to assess each argument's force without getting stuck in verbal disputes or intuition-based objections.

  First, I need to understand the core tension in their position. Their worry about unfalsifiability suggests the view might be too flexible - any counterexample gets absorbed by redescription. But good philosophical theories often have such defenses. The question is whether theirs crosses into evasion.

  Looking at their list:

  The interventionist parity argument seems strong because it shows formal equivalence between actions and omissions in causal models. If causation is defined interventionistically, this directly challenges the eliminativist claim. The user might dismiss this as question-begging, but that feels weak - the framework is widely accepted for good reason. This could be near-fatal.

  The default-relativity point cuts deeper. If all causation is contrastive, then singling out omissions as special fails. The user's response that omissions uniquely depend on norms needs scrutiny - do positive causes ever rely on defaults? If yes, this parity might be fatal.

  The paraphrase problem keeps them up for good reason. When we say "valve was shut" causes rather than "no heat", the absence seems to be what's relevant. If the positive state only matters by virtue of what it excludes, eliminativism struggles. This feels like the most philosophically serious challenge.

  Double prevention cases are common in biology. Dismissing them might require overly complex paraphrases. But perhaps this is merely awkward if the eliminativist can provide adequate redescriptions without losing explanatory power.

  Cost-to-practice is serious but not decisive - many good theories overturn common sense. Still, if the revision requires abandoning too much, it weakens the view's plausibility.

  The empirical evidence about norm-sensitivity could support their view if it distinguishes omissions from actions. But if actions show similar sensitivity, it backfires. Need to check the data.

  Verbal dispute concerns are always present but shouldn't paralyze - substantive differences usually exist.

  Beyond their list, I should consider:
  - Whether their view commits to denying obvious truths (e.g., "the brake failure caused the crash")
  - If it creates problems for probabilistic causation
  - Whether it conflicts with how we attribute moral responsibility

  On practical implications: in law, negligence hinges on omissions as causes. If eliminativism forces us to redescribe these cases awkwardly, that's problematic. But perhaps not fatal - we might preserve judgments while rephrasing explanations.

  Finally, insulation isn't necessarily bad if the theory is principled. But if it only survives by constant retreat, that's suspect. The paraphrase strategy's ability to preserve explanatory relevance without smuggling in absences will make or break this.
answer: |-
  Here's a ranked analysis of your defeaters, structured as requested. The ranking reflects **philosophical severity** (threat to core eliminativist claims) rather than rhetorical difficulty, weighted toward arguments undermining explanatory relevance preservation and formal parity. I've added critical defeaters beyond your list.

  ### Ranking & Analysis (Fatal to Awkward)
  1.  **(1) Interventionist Parity Argument (Near-Fatal)**
      *   **Eliminativist Response:** Must dismiss as question-begging. Conceding that interventions on absences are "just as clean" grants causal status to omissions *by definition* within that framework. The eliminativist rejects the framework's completeness for *metaphysical* causation.
      *   **Stands/Falls With:** The success of arguing that interventionism captures *instrumental control/prediction* but not *metaphysical production/dependence*. It fails if interventionism is the *only* viable or complete formal account of causation.
      *   **Decisive If:** It can be shown that *all* scientifically respectable causal claims *must* be expressible within an interventionist framework without eliminativist paraphrase losing predictive/explanatory power or introducing artificial complexity. If causation *just is* what interventionism models, omissions win.
      *   **Weight:** High. Directly attacks the core "positive events only" claim using the dominant formal tool.

  2.  **(3) Relevance-Preserving Paraphrase Problem (Near-Fatal)**
      *   **Eliminativist Response:** Must concede this *counts significantly against the view* but argue it doesn't refute it. The objection exposes a genuine tension: the positive state (valve shut) is causally relevant *solely in virtue of* ensuring the absence (no heat). Eliminativism struggles to explain *why* "valve shut" is the *relevant* positive state without tacitly invoking the absence.
      *   **Stands/Falls With:** The ability to provide a theory of *causal selection* or *explanatory salience* for positive events that doesn't ultimately rely on the absence being the "real" cause. Can you ground why "valve shut" is selected over "lever position X" or "metal composition Y" without referencing the prevented flow? If not, the absence is doing the work.
      *   **Decisive If:** It can be proven that *no* non-circular account of why a *specific* positive state is the "correct" paraphrase can be given, meaning the explanatory relevance of the positive state *logically depends* on the absence it underwrites. This makes eliminativism explanatorily parasitic on what it denies.
      *   **Weight:** Highest (as per your request). This is the core metaphysical/explanatory challenge. If your paraphrases borrow relevance from the absence, eliminativism is unstable.

  3.  **(2) Default-Relativity Parity Argument (Severe Threat)**
      *   **Eliminativist Response:** Must concede this *counts against the view* but argue omissions exhibit this relativity *in a categorically different/more fundamental way*. Claiming that *all* causation is contrastive/default-sensitive doesn't show omissions *are* causes; it might show that the *distinctive disqualifying feature you identified* isn't valid. This weakens your argument but doesn't prove omissions exist as causes.
      *   **Stands/Falls With:** Successfully arguing that while contrast/context sensitivity is ubiquitous, the kind of *normative expectation* or *functional default* crucial for omissions is qualitatively different from the pragmatic/scientific baselines used for positive events. Does "normal rainfall" play the *same role* as "normal beating" in a pacemaker failure? If yes, parity holds.
      *   **Decisive If:** It can be shown that the very *causal structure* of the world, even for positive events, fundamentally depends on normative/functional defaults in the same way omissions allegedly do (e.g., dispositions presuppose norms of functioning). This erases the distinction eliminativism relies on.
      *   **Weight:** Very High. Undermines your proposed *criterion* for disqualifying omissions, potentially collapsing the distinction.

  4.  **(7) Verbal Dispute Suspicion (Severe Threat / Methodological Fatal)**
      *   **Eliminativist Response:** Must *vehemently deny* this is merely verbal and concede it *would be fatal if true*. The core claim is metaphysical: omissions lack causal *power* or *productive efficacy*. If nothing turns on this distinction *at all*, the thesis is empty.
      *   **Stands/Falls With:** Identifying a substantive, non-verbal consequence. Does eliminativism entail different predictions? Different accounts of responsibility? Different views of laws or dispositions? If *no* discernible difference exists beyond word choice, the view collapses.
      *   **Decisive If:** A compelling case is made that *all* apparent disagreements about omissions dissolve into preferences for different descriptions of the *same causal-explanatory structure*, with no underlying metaphysical disagreement. Eliminativism then becomes a pointless linguistic revision.
      *   **Weight:** High (Metaphysically Fatal if proven). Forces you to show what *is* at stake.

  5.  **(4) Double Prevention (Awkward but Manageable)**
      *   **Eliminativist Response:** Can dismiss as *not fatal* but awkward. Paraphrase is complex but possible: describe the *positive failure* of the inhibitor mechanism, the *positive presence* of the destructive agent, and the *positive sequence* leading to cell death. The apparent "causation by not-happening" is an artifact of description.
      *   **Stands/Falls With:** The practical feasibility and explanatory adequacy of the paraphrases in complex biological systems. Does the paraphrase obscure genuine explanatory patterns or become unwieldy? If it remains clear and explanatory, it survives.
      *   **Decisive If:** A case of double prevention is found where *every plausible paraphrase* either (a) explicitly references an absence as cause or (b) demonstrably loses explanatory power/relevance compared to the omission-involving description.
      *   **Weight:** Moderate. Primarily a challenge to *paraphrase strategy*, not the core metaphysics.

  6.  **(6) Norm-Sensitivity Evidence (Ambiguous / Potentially Supporting)**
      *   **Eliminativist Response:** Can (and should) embrace this as *supporting* the view that "omissive causation" attributions track normative expectations/duties, not bare counterfactual causation. Concede it *counts against* if norm-sensitivity is pervasive for *all* causation.
      *   **Stands/Falls With:** Whether empirical studies show norm-sensitivity is *significantly stronger* or *qualitatively different* for omissions vs. positive actions in causal judgment. If norm-sensitivity is equally strong for *positive* deviations (e.g., poisoning vs. not feeding), it undermines the distinctiveness of omissions and potentially supports parity.
      *   **Decisive Against:** Clear evidence that judgments of causation for *positive* actions are *as strongly* modulated by normative expectations (duties, roles, normal functions) as judgments for omissions. This erodes the basis for treating omissions differently.
      *   **Weight:** Moderate. Primarily empirical, relates to the *source* of intuitions.

  7.  **(5) Cost-to-Practice Argument (Awkward but Weak)**
      *   **Eliminativist Response:** Dismiss as question-begging and irrelevant to truth. Common sense and scientific practice can be systematically mistaken about metaphysics (e.g., folk physics, vitalism). The argument proves only that the view is revisionary, not false.
      *   **Stands/Falls With:** The *independent* strength of the positive arguments for eliminativism. If they are weak, the cost magnifies; if strong, the cost is bearable.
      *   **Decisive If:** Eliminativism demonstrably *impedes* scientific progress or yields *worse* explanations in practice, not just unfamiliar ones. Mere revision isn't enough.
      *   **Weight:** Low. An argument from inconvenience, not refutation.

  ### Critical Additional Defeaters
  8.  **The Dispositional/Mental Causation Defeater (Potentially Fatal)**
      *   **Argument:** Many core mental states (beliefs, desires) and dispositions (fragility, solubility) are characterized by what they *would* do, not what they *are* doing. Their causal efficacy often seems to involve omissions (e.g., not interfering, being poised to act). Eliminativism risks rendering mental/dispositional causation epiphenomenal or requiring implausible paraphrases that lose their intentional/dispositional character.
      *   **Stands/Falls With:** The success of reductive accounts of mind/dispositions in purely positive, occurrent terms. If mental causation intrinsically involves "response readiness" or "absence of interference," eliminativism faces a major challenge.
      *   **Decisive If:** A compelling account shows that the causal powers of mental states/dispositions *necessarily* involve absences as metaphysically constitutive components, not just describable via absences.

  9.  **The Prevention/Dependence Defeater (Severe Threat)**
      *   **Argument:** Prevention seems a core causal relation. Eliminativism must analyze prevention not as A causing *the absence of B*, but as A causing *some positive state C* which is incompatible with B. But what makes C "preventing" B? The explanation seems to depend on the *absence* of B being the result. This mirrors the paraphrase problem but focuses on prevention as a fundamental causal concept.
      *   **Stands/Falls With:** Providing a satisfying account of prevention purely in terms of positive causes and effects that doesn't tacitly rely on the resulting absence being explanatory.
      *   **Decisive If:** Prevention is shown to be an *irreducible* causal relation fundamentally linking an event to an absence.

  ### Your Specific Questions
  1.  **Do Practical Matters Turn on This?**
      *   **Yes, significantly:**
          *   **Negligence Liability:** Legal "cause-in-fact" and "proximate cause" for omissions hinge on whether the omission *caused* the harm. Eliminativism forces tort law into awkward paraphrases ("The guard's sleeping caused the death" vs. "The guard's failure to wake caused the death"). This might distort the basis of responsibility, which centers on the *duty to act* and the *harmful consequence of inaction*. The law treats omissions as causes *because* of the norm (duty).
      *   **Disaster Analysis:** Inquiries (e.g., engineering failures, medical errors) systematically cite omissions (failure to inspect, failure to communicate) as causal factors contributing to the outcome. Eliminativism requires reframing these as complex positive chains, potentially obscuring the critical role of *expected actions not taken*.
      *   **Epidemiology/Policy:** Claims like "The lack of vaccination program caused N deaths" are common. The eliminativist paraphrase ("The policy decision not to fund the program caused the deaths") might capture the proximal cause, but the *explanatory target* is the *absence of vaccination* as the condition allowing disease spread. The relevance of the policy decision *depends* on it causing the absence.
      *   **Compatibility:** It's *compatible* with eliminativism being true. We could preserve practical judgments by saying "The omission *explains* the harm" or "We hold them responsible *for* the omission *leading to* the harm," while denying the omission is a literal cause. However, this requires significant reinterpretation of existing discourse and potentially weakens the link between explanation and responsibility. **Not fatal alone, but a major cost demanding strong justification.** It highlights the tight link between omission-talk and normativity/practice.

  2.  **Insulation as Defect or Virtue?**
      *   **Honest Assessment:** Significant insulation is *typical* for metaphysical theses about causation (e.g., regularity vs. counterfactual vs. process views). Robustness under pressure is expected. **However, the *source* and *nature* of the insulation matter:**
          *   **Virtue:** If insulation comes from a deep, coherent theoretical structure that successfully reinterprets recalcitrant data within its framework while offering superior explanations elsewhere (e.g., unifying phenomena, avoiding contradictions), it's a sign of strength (like Einsteinian relativity absorbing Newtonian mechanics as a limiting case).
          *   **Defect:** If insulation comes *primarily* from *ad hoc* qualifications, perpetual redescription without explanatory gain, or rendering the thesis untestable *even in principle* by making it absorb *any* conceivable counterexample without consequence, it's a vice (a degenerating research programme, per Lakatos).
      *   **Your Specific Risk:** Your worry about unfalsifiability is valid. The key is whether your paraphrases **preserve explanatory relevance and power** without circularity (Defeater #3) and whether they **integrate into a compelling broader metaphysics** (e.g., handling dispositions/prevention well - Defeaters #8 & #9). If paraphrases feel like "cheats" borrowing relevance from absences, or if preventing the thesis from engaging with interventionism/contrastivism requires rejecting powerful frameworks without offering a superior alternative, insulation becomes a defect. If your paraphrases provide genuinely deeper, more unified explanations *and* your view offers a compelling account of *why* omission-talk is useful yet non-causal (e.g., its tight link to norms and explanation), insulation is a virtue.

  ### Conclusion & Recommendation
  *   **Most Severe Threats:** #1 (Interventionist Parity), #3 (Relevance Paraphrase), #2 (Default Relativity Parity), #7 (Verbal Dispute), plus the new #8 (Dispositions/Mind) and #9 (Prevention).
  *   **Core Vulnerability:** Your thesis lives or dies on **Defeater #3 (Relevance Paraphrase)**. If you cannot solve the problem of explanatory relevance without tacitly relying on the absence, eliminativism fails. **Focus your defense here.** Develop a principled theory of causal selection/salience for your positive paraphrases that is independent of the absence.
  *   **Interventionism (#1) is the Second Front:** You need a compelling reason why interventionism, despite its power, doesn't capture the *metaphysical essence* of causation relevant to your claim. Argue for a distinction between causal modeling/prediction and causal production.
  *   **Don't Ignore Practicality (#5 & Liability):** While not fatal, the cost is real. Show how your view *better accounts for* the normativity inherent in omission attributions within practical reasoning, law, and history, rather than just dismissing them as error.
  *   **Insulation Assessment:** Your view *is* insulated, but whether that's virtuous depends on your success with #3 and #1. If your solutions there are principled and illuminating, insulation is strength. If they feel evasive, it's a weakness. **Honest verdict:** The level of insulation you describe is *typical* for ambitious metaphysics, but the *relevance paraphrase problem (#3) is the critical pressure point determining if it's justified.** Tackle it head-on.
