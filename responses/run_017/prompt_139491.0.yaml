prompt: |-
  I'm midway through a graduate seminar on classical Indian epistemology, and before I commit to a paper topic I want to work out what our professor is actually committed to. Over the first half of the term she has ruled, fairly briskly, on a run of cases, and I cannot tell which principle she is running. Here is her track record as I have it in my notes:

  1. Seeing a pot in clear daylight: pramā, by pratyakṣa.
  2. Taking a shell for silver: not pramā — and she added that this is not merely because reaching for the shell leads to frustrated action, since a false cognition can sometimes guide action successfully.
  3. Inferring fire on a hill from smoke, with the pervasion (vyāpti) established: pramā, by anumāna.
  4. The same-looking cognition where what appeared to be smoke is in fact a plume of mist: not pramā.
  5. The city-dweller who is told that a gavaya is like a cow, later meets one in the forest, and forms the cognition "this is what 'gavaya' denotes": pramā, and produced by upamāna as a pramāṇa in its own right — she was explicit that this is not, as a reductionist would have it, testimony plus perception.
  6. A trustworthy person's report that there is water at the foot of the hill, addressed to a hearer who has never been there: pramā, by śabda.
  7. The very same true report from a speaker the hearer knows to be unreliable: true belief, but not pramā — the defect lies in the source, she said, and a true outcome does not repair it.
  8. Devadatta is known to be alive but is not in the house, so he must be outside: pramā, but by anumāna; she will not grant postulation (arthāpatti) a separate pramāṇa.
  9. Noticing that there is no jar on the floor: pramā, and known by pratyakṣa; she will not grant non-cognition a separate pramāṇa either.

  She has also twice insisted that whether a cognition is a pramā and whether it is produced by a distinct pramāṇa are separate questions, and that the second does not follow from the first. What 5, 8 and 9 seem to show jointly is that she is not a uniform reductionist about the pramāṇas, and that her reason for resisting reduction in one case is not, so far as I can see, the same as her reason for insisting on it in the others.

  Here are three cases of my own construction that she has not seen, on which I want to predict her:

  A. Sam is reliably told by his astronomy teacher that there will be an eclipse on the morrow, and believes it. He then works through the ephemerides himself and derives the same conclusion. The resulting cognition is true. Is it a pramā, and if so by which pramāṇa?

  B. As in A, except that the general rule on which Sam's derivation depends is one he has only on his teacher's authority and could not establish for himself; the application of it is entirely his own work.

  C. Sam holds the derived conclusion before his mind and, a moment later, runs the derivation again, with no intervening doubt, and then a third time. Are the second and third cognitions pramās, and instances of anumāna? Does it matter whether an intervening doubt separates them?

  What I want is this. First, the two or three principles that fit her nine verdicts about equally well. My own guesses are (i) a source-integrity rule: a cognition is pramā just in case a pramāṇa has operated without defect, with pramāṇas individuated by irreducibly distinct processes; (ii) a credit rule: pramā requires that the truth be attributable to the subject's own exercise of a reliable competence, so that borrowed reliability yields true belief at best; (iii) a novelty rule of the kind that requires what is cognized to be cognized for the first time, either for pramā-status or for counting as the product of a distinct pramāṇa. I suspect these are badly stated and that there are better candidates. Second, what each principle predicts about A, B and C, and precisely where they come apart. Third, your best guess at her verdict on each of the three, with reasons for preferring the principle that yields it — in particular, whether anything in her track record, or in the shape of the Nyāya position she is reconstructing, makes one of them the natural thing for someone in her position to hold. Fourth, if more than one principle survives, the single further case I should put to her in office hours that would separate them, together with what each principle would have to say about it. And if any candidate principle forces me to read one of her earlier verdicts as an outlier, tell me which, and why.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're in a graduate seminar on classical Indian epistemology, specifically Nyāya, and they're trying to figure out their professor's underlying principles regarding pramā (valid cognition) and pramāṇas (sources of knowledge). The user has provided nine cases where the professor made rulings, and they've constructed three new cases (A, B, C) to test possible principles. 

  First, I need to understand the professor's rulings from the nine cases. Let me list them out clearly:

  1. Seeing a pot in daylight: pramā via perception (pratyakṣa). Straightforward.
  2. Mistaking shell for silver: not pramā. Importantly, she notes that even if action based on false cognition succeeds, it's still invalid. This suggests that truth is necessary but not sufficient.
  3. Correct inference of fire from smoke: pramā via inference (anumāna). 
  4. Incorrect inference (mistaking mist for smoke): not pramā. Shows that even with the same process, if there's a defect, it's invalid.
  5. Gavaya example: pramā via comparison (upamāna), not reducible to testimony + perception. This is key because she explicitly rejects reductionism here.
  6. Reliable testimony about water: pramā via testimony (śabda).
  7. Same true report but from unreliable speaker: true belief but not pramā. Defect in the source isn't repaired by truth.
  8. Inference that Devadatta is outside: pramā via inference, not a separate postulation (arthāpatti). She's reducing this to anumāna.
  9. Absence of jar: pramā via perception, not a separate non-cognition. Again, reductionist here.

  The professor also emphasizes that being pramā and being produced by a distinct pramāṇa are separate issues. 

  The user proposes three principles: source-integrity, credit, and novelty. I need to evaluate which of these fit the professor's rulings. 

  Starting with source-integrity: a cognition is pramā if produced by a defect-free pramāṇa, with pramāṇas as distinct irreducible processes. This seems to fit most cases. Case 5 supports distinct processes (upamāna not reducible), while 8 and 9 show reduction where possible. Case 7 is crucial—defective source (unreliable speaker) means no pramā even if true. 

  Credit rule: pramā requires the subject's own competence. Case 6 involves testimony, which relies on another's competence, yet it's considered pramā. So this rule might not fit because testimony is accepted as pramāṇa. Case 7 might support this—borrowed reliability isn't enough—but if credit were key, why is case 6 pramā? Unless "own competence" includes properly vetting the speaker, but the professor didn't mention that. 

  Novelty rule: first-time cognition. But in case 6, the hearer has never been to the hill—so it's new information. But what about repeated inferences? The user's case C tests this. The professor hasn't addressed repetition yet, so it's unclear. 

  Now, applying these to cases A, B, and C. 

  Case A: Sam gets testimony, then verifies himself via inference. Source-integrity would say the cognition is pramā via anumāna since the inference was defect-free. Credit rule might say it's pramā because he used his own competence. Novelty rule—if it's the same content, maybe not new, but unclear. 

  Case B: Sam relies on a general rule from testimony but applies it himself. Source-integrity: depends on whether the inference process is defect-free. The source of the rule might be defective if the testimony was unreliable, but here the teacher is reliable. Since the inference is sound, it should be pramā via anumāna. Credit rule: he's using borrowed premises, so maybe not full credit. But case 6 suggests testimony can be pramāṇa, so why not here? 

  Case C: Repeated inferences without doubt. Source-integrity: each inference is a new process, so each could be pramā. Novelty rule might deny it if the content isn't new. Credit rule—no issue. 

  The strongest fit seems to be source-integrity. It explains case 5 (distinct process for upamāna), case 7 (defective source voids pramā), and allows reduction in 8 and 9. Credit rule struggles with testimony being accepted. Novelty isn't indicated in the rulings. 

  For a separating case: what if Sam has a cognition via perception, then later the same content via testimony. Is the testimony-based cognition pramā? Source-integrity would say yes if the source is reliable. Credit rule might say no if it's borrowed. Novelty would say no if not new. 

  Given the professor's Nyāya leanings (accepting testimony, reducing some pramāṇas), source-integrity is most consistent. Predictions: A and B are pramā via anumāna; C is pramā each time via anumāna, doubt irrelevant under source-integrity. 

  User's deeper needs: they want to write a paper aligning with the professor's views, so understanding her framework is crucial. They might also be testing how flexible the system is or where reductionism applies. Need to ensure the principles align with Nyāya orthodoxy but also her specific nuances, like rejecting reduction for comparison but not for postulation.
answer: |-
  Based on your professor's track record and emphasis, three distinct principles emerge as plausible explanations, each fitting the nine cases reasonably well but predicting differently for your scenarios (A, B, C). Here's the breakdown, followed by predictions, recommendations, and the strongest candidate:

  **The Three Candidate Principles:**

  1.  **Source-Integrity & Process Essentialism:**
      *   **Core Idea:** A cognition is *pramā* iff it arises from the complete and defect-free operation of a distinct *pramāṇa*. *Pramāṇas* are individuated by fundamentally irreducible cognitive *processes* (not just objects or outcomes). Truth is a necessary consequence of defect-free operation but not the defining criterion. Defects in the source/process invalidate the cognition as *pramā*, even if the outcome is accidentally true. Reductionism is rejected only when the cognitive process cannot be adequately described as a combination of other *pramāṇas*.
      *   **Fits Cases:** Explains 1 (pratyakṣa process intact), 2 (defect in perception), 3 (anumāna process intact), 4 (defect in anumāna - faulty minor term), 5 (upamāna is a distinct, irreducible process), 6 (śabda process intact - reliable speaker), 7 (śabda process defective - unreliable speaker, voids *pramā* status despite truth), 8 (arthāpatti process reducible to anumāna), 9 (abhāva process reducible to pratyakṣa). Matches the "separate questions" point: *pramā* requires a *pramāṇa*, but distinct *pramāṇa* status requires irreducibility of the *process*.

  2.  **Competence-Based Credit:**
      *   **Core Idea:** A cognition is *pramā* iff its truth is *non-accidentally* attributable to the *subject's own exercise* of a reliable cognitive competence/faculty (*pramāṇa*). True belief derived solely from another's competence (even reliably) is merely true belief, not *pramā*. "Own exercise" involves active engagement with the source or generating the inference. Defective sources/situations prevent the subject's competence from being the primary cause of the truth.
      *   **Fits Cases:** Explains 1 (subject's perception), 2 (subject's perception is faulty), 3 (subject's inference), 4 (subject's inference faulty), 5 (subject actively applies the analogy - their own competence), 6 (subject relies *on the speaker*, not their own competence for the content - *pramā* via śabda implies śabda *is* a competence *of the hearer* to reliably receive testimony), **BUT struggles with 6**: Why is testimony *pramā* if credit goes to the speaker? (Proponent must argue śabda involves the hearer's competence in source-assessment & comprehension). Explains 7 (hearer *knows* speaker unreliable - their own competence flags the defect, preventing attribution), 8 (subject's own inference), 9 (subject's own perception). Fits reductionism in 8/9 (no need for new competence). "Separate questions" point: *pramā* requires credit to subject's competence; distinct *pramāṇa* requires a fundamentally distinct *type* of competence exercised.

  3.  **Novelty of Content (Strong Interpretation):**
      *   **Core Idea:** A cognition is *pramā* iff it presents *new, previously unknown* (to the subject) information/cognition (*anadhigatārtha*) via a *pramāṇa*. Re-cognizing known content, even via a valid process, is not *pramā*. Distinct *pramāṇas* are needed only when they deliver cognitions that other *pramāṇas* fundamentally *cannot* (or cannot without significant distortion/reduction).
      *   **Fits Cases:** Explains 1 (new perception), 2 (false, not new), 3 (new inference), 4 (false, not new), 5 (new identification via comparison), 6 (new information via testimony), 7 (true but *already known* speaker is unreliable? Or content is new but source defective? **Major Struggle**: The content *is* new to the hearer. This principle alone struggles to explain why it's not *pramā*. Must be combined with another condition, like source-integrity). Explains 8 (inference suffices, no fundamentally new *type* of cognition), 9 (perception suffices). Fits "separate questions": Novelty defines *pramā*; irreducibility defines distinct *pramāṇa*. **Weakest Fit:** Case 7 is a significant problem. If novelty is key, the true content *is* new, yet it's denied *pramā* status. This principle alone seems insufficient.

  **Predictions for Your Cases (A, B, C):**

  | Case | Source-Integrity & Process Essentialism                      | Competence-Based Credit                                      | Novelty of Content (Strong)                                  |
  | :--- | :----------------------------------------------------------- | :----------------------------------------------------------- | :----------------------------------------------------------- |
  | **A** | **Pramā, by Anumāna.** The cognition results from Sam's own defect-free inferential process. The prior testimony is irrelevant to the *process* generating *this* specific cognition. | **Likely Pramā, by Anumāna.** Sam actively exercises his *own* inferential competence to derive the conclusion. He doesn't just passively believe the teacher; he verifies it himself. | **Not Pramā.** The content (eclipse tomorrow) was already known to Sam via testimony. The re-cognition via inference lacks novelty. |
  | **B** | **Pramā, by Anumāna.** Sam's inferential *process* is still sound: he validly applies a general rule (even if learned via testimony) to observed/perceived data (the ephemerides). The source of the rule is reliable (teacher), so no defect taints the inference. | **Debatable / Likely Not Pramā (or śabda).** Sam applies the rule himself (some credit), but the *crucial warrant* for the rule itself comes solely from the teacher's competence, not Sam's. The truth is not primarily attributable to Sam's *own* competence in establishing the rule. Might be seen as śabda-derived belief where Sam merely calculates the consequence. | **Not Pramā.** As in A, the content was already known via testimony. No novelty. |
  | **C (no doubt)** | **Each cognition is Pramā, by Anumāna.** Each inferential operation is a distinct cognitive event. If each process is performed defect-free (even if rapidly repeated without new input), each produces a *pramā*. | **Only the first is Pramā.** The first inference involves the exercise of competence to *arrive* at the conclusion. Subsequent repetitions without doubt or new input are merely rehearsing a known result, not an exercise of competence generating new knowledge. | **Only the first is Pramā.** Only the first cognition had novelty. Subsequent cognitions lack new content. |
  | **C (with doubt)** | **Each cognition is Pramā, by Anumāna.** Doubt interrupts the previous cognition. Each fresh inference, triggered by doubt, is a new defect-free process yielding *pramā*. | **Each cognition is Pramā, by Anumāna.** Doubt signifies the previous cognition's status is in question, requiring the subject to re-exercise their inferential competence to *re-establish* the conclusion. Each exercise warrants *pramā* status. | **Only the first per doubt episode?** Unclear. Doubt might reset the "newness" by making the subject re-acquire the cognition, or it might still be re-cognition of known content. Ambiguous for this principle. |

  **Where They Diverge Crucially:**

  1.  **A & B:** Source-Integrity accepts both as *pramā* via anumāna. Credit likely accepts A but not B. Novelty rejects both.
  2.  **C (no doubt):** Source-Integrity accepts all as *pramā*. Credit and Novelty accept only the first.
  3.  **The Role of Testimony in Inference (B):** Source-Integrity focuses on the *current process* being sound. Credit focuses on the *origin of the warrant* for the premises. Novelty focuses solely on prior possession of the *content*.

  **Best Guess & Preferred Principle:**

  *   **Verdict on A:** **Pramā, by Anumāna.** (Source-Integrity & Process Essentialism)
  *   **Verdict on B:** **Pramā, by Anumāna.** (Source-Integrity & Process Essentialism)
  *   **Verdict on C (no doubt):** **Second/Third Cognitions are Pramā, by Anumāna.** (Source-Integrity & Process Essentialism)
  *   **Verdict on C (with doubt):** **Each is Pramā, by Anumāna.** (Source-Integrity & Process Essentialism)

  **Preferred Principle: Source-Integrity & Process Essentialism.**

  *   **Reasons:**
      *   **Strongest Fit:** It provides the most consistent and parsimonious explanation for *all nine* original cases without significant strain. It naturally handles case 7 (defective source voids *pramā* despite truth) and case 6 (intact source yields *pramā*).
      *   **Handles Reductionism Nuance:** It perfectly explains *why* she accepts upamāna as distinct (irreducible process - 5) but reduces arthāpatti (8) and abhāva (9) (reducible processes).
      *   **Frames "Separate Questions":** It cleanly distinguishes the conditions for *pramā* (defect-free *pramāṇa* operation) and distinct *pramāṇa* status (process irreducibility).
      *   **Nyāya Alignment:** This is the most straightforward reading of classical Nyāya (especially post-Gaṅgeśa), where *pramāṇa* is defined primarily by the causal process (*karaṇa*) yielding a true cognition (*pramā*), with truth being a necessary consequence of defect-free operation (*yathārthakaraṇatvam*). Debates about distinct *pramāṇas* center on the irreducibility of the cognitive process.
      *   **Predicts Your Cases:** Its predictions for A, B, and C (all *pramā* via anumāna) align with a standard Nyāya view that the validity of an inference depends on the soundness of the inferential process itself, regardless of how the premises were acquired (as long as they are true/established), and that each valid inferential operation produces a *pramā*.
  *   **Outlier?** None. This principle fits all nine cases cleanly.
  *   **Weakness?** It might seem counterintuitive for C (no doubt) - why is repeatedly inferring the same thing without new input multiple instances of *knowledge*? But Nyāya generally holds that each successful operation of a *pramāṇa* generates a new *pramā* cognition.

  **If Source-Integrity is Accepted, Why Consider Others?** Competence-Credit offers a plausible *alternative justification* for case 5 (upamāna requiring active application) and case 7 (unreliable speaker breaking the chain). Novelty is suggested by the language often used (e.g., *anadhigatārtha*), but case 7 shows it's insufficient alone.

  **The Separating Case:**

  To decisively distinguish **Source-Integrity** from **Competence-Based Credit**, propose this:

  *   **Case D:** Priya has *never* seen or heard of a mango. A completely reliable speaker describes a mango in great detail ("yellow, oval fruit, sweet taste, large seed inside"). Priya forms a vivid and accurate mental image/cognition of a mango based solely on this description. Is this cognition *pramā*? If so, by which *pramāṇa*?
      *   **Source-Integrity Prediction:** **Pramā, by Śabda.** A defect-free testimony process (reliable speaker, attentive hearer, clear communication) yields a true cognition of what a mango is like. The process is intact.
      *   **Competence-Based Credit Prediction:** **True Belief, but not Pramā (or marginal).** Priya passively receives the description. The truth of the cognition is entirely attributable to the *speaker's* perceptual competence, not Priya's own exercise of a knowledge-generating faculty. Priya merely forms an image based on words; she hasn't *perceived* or *inferred* it herself. (A proponent might argue this *is* śabda, but the credit view would likely see it as less robust than case 6, where testimony conveys existential knowledge).
      *   **Novelty Prediction:** **Pramā (if combined with source-integrity).** The content is novel.

  **Conclusion:**

  Your professor's rulings are most consistently explained by **Source-Integrity & Process Essentialism**. This principle predicts that Sam's cognitions in A, B, and C (both variants) are all *pramā* produced by *anumāna*. The reliability of the teacher in A/B and the lack of doubt in C are irrelevant to the validity of Sam's *own* inferential process, which is sound in each case. Case D (detailed testimony forming a new mental image) is the best probe to confirm this against the Competence-Credit view. Present D in office hours and see if she agrees it's *pramā* by śabda (supporting Source-Integrity) or hesitates (suggesting Competence-Credit plays a role). Her stance on the repetition in C (no doubt) would also be highly informative. Good luck with your paper!
