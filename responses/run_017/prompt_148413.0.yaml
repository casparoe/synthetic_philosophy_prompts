answer: |-
  ## The Moral Foundations of Meritocracy: A Dialogue

  **Setting:** A quiet corner of a university library.

  **Characters:**
  *   **Marit Voss:** Defends desert-tracking meritocracy.
  *   **Aaron Kellner:** Defends a luck-based critique of meritocracy.

  **(1) Constitutive Luck**

  **Aaron Kellner:** Marit, I want to push directly on the core of your desert-tracking meritocracy. The principle seems straightforward: differential rewards are justified insofar as they track differences in what individuals are morally responsible for bringing about. But this foundation crumbles under scrutiny. Consider the traits that ground productive contributions: intelligence, temperament, ambition, even the basic preference for work over leisure. These characteristics – the very engines driving the contributions you want to reward – are predominantly matters of brute luck. Genetic endowment, formative environment, early childhood experiences; these shape our capacities and inclinations profoundly, yet lie entirely outside our control. No one chooses their initial endowment of talents or drives. How, then, can we say someone *morally deserves* the rewards that flow from deploying these unchosen assets? It seems the entire edifice rests on rewarding individuals for qualities and dispositions for which they bear no ultimate responsibility. If desert requires authorship of the causes, then luck renders the concept incoherent in practice.

  **Marit Voss:** Aaron, let me grant your premise fully: the traits and dispositions that fuel our productive efforts are indeed heavily influenced by constitutive luck. That pervasiveness is undeniable. However, I think you draw too strong a conclusion. You seem to suggest that because we didn't author our foundational traits, we cannot be morally responsible *at all* for the actions and outcomes that flow from them. That would evacuate the concept of moral responsibility entirely, not just its application to economic desert. We routinely hold people responsible for choices made *using* their unchosen capacities – for keeping promises, for acts of cruelty or kindness, even for criminal negligence. The key is that desert, like responsibility, is a *scalar* and *pro tanto* concept. It admits of degrees and can be outweighed by other considerations. Crucially, it does not require absolute self-authorship down to the bedrock. What matters for desert in the economic sphere is the *responsible exercise* of one's capacities and efforts within the choices available. Someone who diligently cultivates their talents and applies them productively exercises agency *through* their unchosen traits, and that responsible exercise generates a defeasible desert claim. Denying this because the underlying traits were unchosen would indeed make moral responsibility, and hence desert, impossible – a consequence I doubt you endorse for ethics as a whole. We track the responsible *use* of the hand one is dealt, not the cosmic accident of the deal itself.

  **(2) Repairing Meritocracy: Complementarities and Coalitional Contribution**

  **Marit Voss:** Even granting desert is possible, a technical problem arises for the simplest version of my view, which might naively equate a worker's desert base with their marginal product – the value added by the last unit of their labor. This runs aground on complementarities. Consider a brilliant surgeon and a highly specialized nursing team. Alone, the surgeon might perform only simple procedures poorly; the nurses, without a surgeon, cannot operate at all. Together, they enable complex, life-saving surgeries. The surgeon's marginal product, calculated by asking what output would be lost if *they alone* were removed, might be substantial but less than the total value created by the team. Similarly, the marginal product of any single nurse might be very low. Crucially, if we tried to pay each their individual marginal product, we might find the sum exceeds the total output under increasing returns, or falls short under decreasing returns. The naive rule is often impossible to satisfy or misrepresents true contribution.

  My repair involves shifting the desert base from marginal product at the *actual* employment level to a *coalitional* measure: the average marginal contribution across every possible sequence in which the workforce could be assembled. Imagine adding workers one by one to an empty set. For each possible order of addition (surgeon first, then nurse A, then nurse B; or nurse B first, then surgeon, then nurse A; etc.), we calculate the marginal value each worker brings when *they* join the *existing subset* at that point in the sequence. A worker's desert base is the average of these marginal contributions across all possible sequences. This means that workers who are highly productive only in specific combinations – like our surgeon and nurses – will share symmetrically in the surplus generated by their joint effort. The surgeon won't capture the entire value just because they might be added last in some sequences; their average contribution reflects the fact that their high productivity in some orders is balanced by scenarios where they join a team lacking nurses and add little. This measure, unlike the simple marginal product, always sums exactly to the total product under constant returns and provides a principled way to distribute the surplus or deficit under non-constant returns. It captures the idea of "contribution to the whole" far better because it explicitly considers how each worker enhances the productivity of every possible coalition they could be part of, not just the actual one. It reflects the counterfactual value of their presence across the entire structure of productive possibilities.

  **(3) The Arbitrariness of Measurement and Contextual Luck**

  **Aaron Kellner:** I grant the mathematical coherence of your coalitional measure. It solves the summation problem neatly. But this reveals a deeper issue. You've replaced one specific measure – marginal product – with another specific measure – average marginal contribution across all orderings. Yet, cooperative game theory offers multiple solution concepts for dividing the value of a coalition: the Shapley value you describe, but also the Nucleolus (which minimizes the maximum complaint of any coalition), the Core (if non-empty), an equal division of the gains from cooperation over individual production, or even utilitarian bargaining solutions. Each of these rules takes the same coalitional data – who can produce what with whom – and yields a different numerical allocation for the same individuals in the same productive environment. If desert is supposed to tell us how much each person *morally deserves*, and the choice among these admissible division rules is what *fixes* the number, then it seems desert itself is doing no substantive work. The normative weight rests entirely on the unargued political choice of which division rule to adopt. Is there a *moral* reason to prefer the Shapley value over, say, egalitarian division of the cooperative surplus? Or is it merely a mathematically convenient convention?

  Furthermore, let me sharpen your own concession about context: a person's share under *any* of these rules, including Shapley, depends fundamentally on two factors utterly beyond their control. First, it depends on *who else happens to exist* and possesses complementary skills. The value of a brilliant coder depends on whether there are brilliant designers and marketers around. Second, it depends on the *shape of demand* – what society happens to value highly at that moment. The desert base you calculate is relative to the existing set of workers and the existing state of technology and preferences. Both the specific constellation of complementary others and the market valuation of outputs are brute luck from the individual's perspective. Yet, the "desert" assigned varies dramatically based on these luck-laden factors. How can a desert claim, supposedly grounded in individual responsibility, be so profoundly contingent on the arbitrary distribution and valuations of others?

  **Marit Voss:** So your strongest objection, if I understand you correctly, is this: Even if we accept the *idea* of rewarding contribution, the coalitional framework shows there is no unique, morally privileged way to *measure* that contribution. Multiple mathematically admissible rules exist, each assigning different cardinal shares based on the same fundamental data about productive possibilities. Therefore, selecting one rule (like Shapley) over others is an arbitrary political choice, not a discovery of pre-existing desert. Furthermore, the output of any chosen rule depends heavily on factors like the contingent presence of complementary workers and shifting demand, which are brute luck for the individual, further undermining the moral link between responsibility and reward.

  **(4) Indeterminacy and the Counterfactual Baseline**

  **Marit Voss:** Your point about multiple solution concepts highlights an important distinction: between *metaphysical indeterminacy* and *epistemic or practical indeterminacy*. It may be that the *precise cardinal magnitude* of a person's desert is metaphysically indeterminate. Desert might be an essentially *comparative* and *imprecise* normative concept. We can often say with confidence that A deserves *more* than B for a given contribution, or that outcome X violates A's desert claim *more severely* than outcome Y, or that a proposed allocation is *clearly unfair* because it wildly misaligns with relative contributions, even if we cannot pinpoint a unique "desert number." The existence of multiple admissible division rules doesn't mean desert vanishes; it might mean that within a range bounded by these rules, or constrained by them, desert claims operate ordinally or set boundaries without dictating a single point. Imprecision in the normative base does not equate to its absence. We navigate imprecise moral concepts like fairness, kindness, or courage all the time.

  Now, let me turn the tables, Aaron. Your entire critique rests on the moral significance of brute luck. You argue that unchosen endowments and circumstances undermine desert claims. But this presupposes a baseline: we need to assess *how badly off* someone is, or how much *worse off* they are, *due to* brute luck. This requires a counterfactual. Compared to *what* are they disadvantaged? The typical answers involve notions like "opportunity," "access to advantage," or "forgone alternatives." But calibrating these notions inevitably involves assessing the *contributions* an individual *could* have made under different luck conditions, or the value of the opportunities *lost*. To say someone is disadvantaged by lacking a talent requires an implicit judgment about the value that talent *would have contributed* in the social scheme. To compensate for brute luck requires estimating the opportunity *cost* imposed by the bad luck – which again involves a counterfactual assessment of what the person *could have achieved* or *contributed* absent that luck. Doesn't your luck-egalitarian framework therefore covertly rely on the very apparatus of contribution, productivity, or opportunity valuation that you seek to undermine? How do you size compensation for brute luck *without* making judgments about counterfactual contributions or the value of lost opportunities?

  **(5) The Pre-Institutional/Institutional Divide and Concessions**

  **Aaron Kellner:** You press a fair point. Let me concede that formulating the baseline for luck compensation is indeed challenging and inevitably involves counterfactuals about what someone *could* have achieved or what opportunities were *open* to them. These counterfactuals do implicitly reference potential contributions or access to socially valued goods. My framework cannot entirely escape the language of contribution and value. That’s a genuine cost; it introduces a layer of complexity and potential contestability I wish wasn't there. The best I can say is that the counterfactual aims to isolate the *impact* of brute luck *on access*, not to validate the desert of the hypothetical outcomes themselves. But I grant the apparatus is borrowed, albeit critically.

  **Marit Voss:** That’s a significant concession, Aaron. Thank you. Let me reciprocate. Pressing the implications of your coalitional critique forces me to concede that the institutional context shapes the *content* of desert claims far more than my pre-institutional language might suggest. The rules of cooperation, the definition of property, the structure of markets – these institutions determine *how* contributions are measured, valued, and aggregated. The Shapley value, or any other rule, only makes sense relative to a defined cooperative game, which is itself institutionally constituted. My desert claim isn't freestanding; it's a claim *within* and *relative to* a specific institutional framework that defines what counts as a contribution and how it is assessed. This institutional dependence weakens the idea of desert as a purely pre-social, natural fact. My concession is that desert, as I defend it, is deeply entwined with institutional facts, not prior to them. That costs me some of the intuitive, pre-political grounding I favored.

  **Aaron Kellner:** That concession clarifies the crux. It seems our core disagreement hinges on this: Do you believe desert claims exist *prior to* and *independent of* the institutional rules we adopt? That is, are there moral facts about what individuals deserve based on their responsible actions *simpliciter*, which then provide an independent standard by which to *assess* institutions (like markets or your coalitional division rules)? Or is the status of "desert" itself *constituted by* the institutional framework – a normative category generated *by* the rules and purposes of a particular cooperative scheme, meaning it cannot serve as an independent criterion to judge those very rules?

  **Marit Voss:** Precisely. I maintain that responsible agency – the conscious, effortful deployment of one's capacities towards productive ends – generates a defeasible, imprecise, but *pre-institutional* moral claim to a proportionate share of the resulting social product. Institutions should *track* this pre-existing moral fact, imperfectly but as best they can, using tools like the coalitional analysis to render it practicable. The institutional measure is an *approximation* of an underlying moral reality grounded in responsible contribution.

  **Aaron Kellner:** And I deny that such pre-institutional desert, tied to contribution, exists. The value of contributions, the means of their measurement, and the very capacities enabling them are all institutionally mediated and luck-infused. "Desert" is a status conferred *by* just institutions, shaped by our collective choices about fairness and the mitigation of luck. It cannot be the foundation *for* those institutions. The only pre-institutional facts are the moral urgency to mitigate the arbitrary effects of brute luck on life chances and the need for institutions to be justifiable to all, irrespective of their luck-derived capacities.

  **Marit Voss:** Then we remain at an impasse. For me, desert, born of responsible agency, constrains institutional design.

  **Aaron Kellner:** And for me, institutions, designed to manage luck and ensure fairness, define the only legitimate form desert can take.
