prompt: |-
  I'm putting together a one-page handout for first-year graduate students on what the free energy principle does and does not say, and a colleague and I have fallen out over how much to concede to a rough gloss. Below are six one-sentence versions of the claim that a system minimises free energy, all of which I have in fact heard at conferences.

  (a) The brain is a guessing machine: it continually predicts what its senses will report, and revises those predictions in the light of prediction error.

  (b) A living thing stays alive by acting so as to keep the sensory states it encounters as unsurprising as possible.

  (c) Perception is approximate Bayesian inference: the brain minimises the divergence between its beliefs and the true posterior over the causes of its sensations.

  (d) Any system that confines its own states to a narrow range must, on average and over the long run, behave as if it were inferring the hidden causes of the sensory states that impinge on it.

  (e) Perception and action are two ways of minimising the same quantity — perception fits the model to the world, action fits the world to the model — and neither has priority over the other.

  (f) Free energy is a thermodynamic quantity, and the brain's job is to represent the world using as little of it as possible.

  Assume the students have already read a standard predictive-processing introduction, so the ordering should turn on what the principle itself asserts rather than on which sentence is easiest. Rank them from the one you would least mind a student reading first to the one you would most want struck from the handout, and for each give a single sentence on what it quietly smuggles in or leaves out — what, specifically, would that student have to unlearn later? My colleague thinks (b) is harmless as a first pass; I think it is the one that does the most downstream damage. Say where you come down, and don't let them all come out roughly equal.
reasoning: |-
  Okay, let me tackle this query. The user is creating a handout for grad students about the Free Energy Principle (FEP) and needs help ranking six one-sentence summaries from best to worst. They’ve clashed with a colleague over whether (b) is harmless or damaging. 

  First, I recall that FEP is fundamentally about systems maintaining states within bounds by minimizing variational free energy—a mathematical bound tied to surprise. The user wants clarity on what FEP *actually* claims versus common oversimplifications. The students already know predictive processing basics, so the ranking should prioritize accuracy over simplicity.

  Starting with (c): "Perception is approximate Bayesian inference..." This is solid because it directly reflects FEP’s core math—minimizing variational free energy *is* approximate Bayesian inference. The "quietly smuggled" bit is that FEP isn’t just about perception; it’s about all adaptive behavior. But it’s still the least misleading. 

  Next, (e): "Perception and action are two ways of minimizing the same quantity..." This rightly shows perception and action as dual minimization routes, which is key to FEP’s active inference framework. The caveat? Not *all* systems do both—some are purely perceptual. But it’s mostly correct. 

  Then (a): "The brain is a guessing machine..." This is a decent pop-sci version of predictive processing, which FEP generalizes. The problem? It’s too brain-specific. FEP applies to any bounded system (cells, ecosystems). Students might miss the universality. 

  Now (d): "Any system that confines its states... must behave as if inferring..." This captures FEP’s universality but risks anthropomorphism. "As if inferring" is metaphorical—FEP doesn’t require literal inference, just dynamics that *look* inferential. Students might over-mentalize. 

  Here’s the conflict point: (b) vs. (f). The user hates (b); their colleague thinks it’s fine. (b) says organisms "keep sensory states unsurprising." But FEP minimizes *expected* surprise (free energy), not *actual* surprise. Real agents often encounter surprises (e.g., predators). (b) implies a risk-averse stupidity that misrepets adaptive behavior. Worse, it’s the root of "dark room" fallacy—students might think FEP predicts hiding in caves. 

  Finally, (f): "Free energy is thermodynamic..." This is flatly wrong. FEP’s free energy is variational (math), not thermodynamic. Thermodynamic free energy matters for physical work, but conflating them invites massive confusion. 

  Verdict: (b) is indeed toxic. It’s the "dark room" in a nutshell—students would have to unlearn that organisms avoid all surprise. (f) is worse but rarer; (b) is seductive and pervasive. The colleague might see it as intuitive, but it’s pedagogically dangerous. 

  Ranking: (c) > (e) > (a) > (d) > (b) > (f), with (b) as the stealth villain.
answer: |-
  Here's a ranked list from least to most problematic for first-year grad students who already know predictive processing basics, focusing on what FEP **fundamentally** asserts (a system minimizes an information-theoretic *variational free energy* bound to maintain its characteristic states). Critiques target core conceptual missteps, not just oversimplification:

  1.  **(c) Perception is approximate Bayesian inference...**
      *   **Smuggles in/Leaves out:** While technically accurate *for perception under FEP*, it frames FEP as "just" a theory of perception/inference, obscuring its broader claim that *any* adaptive system minimizing free energy *must* exhibit inference-like dynamics (including action).

  2.  **(e) Perception and action are two ways of minimizing the same quantity...**
      *   **Smuggles in/Leaves out:** Correctly captures the core duality ("active inference"), but slightly overstates symmetry ("neither has priority"); the principle originates from modeling perception/belief update, with action emerging as a necessary consequence for bounded systems.

  3.  **(a) The brain is a guessing machine...**
      *   **Smuggles in/Leaves out:** Describes *predictive processing* well, which FEP generalizes, but restricts FEP's scope to brains/prediction, omitting its universality for *any* bounded system (e.g., cells, ecosystems) and downplaying action's fundamental role.

  4.  **(d) Any system that confines its own states... must... behave as if it were inferring...**
      *   **Smuggles in/Leaves out:** Captures universality and the "as-if" nature well, but risks severe anthropomorphism; students might miss that "inference" is *only* a descriptive analogy for the dynamics, not a claim about internal representations or cognitive mechanisms in simple systems.

  5.  **(b) A living thing stays alive by acting so as to keep the sensory states it encounters as unsurprising as possible.**
      *   **Smuggles in/Leaves out:** **Crucially conflates minimizing *expected surprise* (free energy) with minimizing *actual surprise*.** This is the infamous "Dark Room Problem": FEP mandates *seeking predictable states*, not avoiding all sensation. An organism minimizing *actual* surprise would (counterfactually) hide in a dark room and die. Students unlearning this is critical.

  6.  **(f) Free energy is a thermodynamic quantity...**
      *   **Smuggles in/Leaves out:** **Fundamentally conflates variational free energy (an information-theoretic bound) with thermodynamic free energy (work potential).** This is categorically wrong and introduces massive confusion about the principle's mathematical foundation and domain of applicability. Requires complete unlearning.

  **Where I Come Down (b vs. Your Colleague):**

  *   **I strongly side with you.** (b) isn't just "rough"; it's **actively misleading and the seed of the most persistent, damaging misconception about FEP** (the Dark Room fallacy).
  *   While (f) is *more* egregiously wrong, it's less frequently encountered and easier to debunk as a simple category error.
  *   (b) is seductive because it *sounds* intuitive and biological, but it **inverts the core logic**: FEP systems minimize expected surprise *to stay within bounds*, not to avoid sensation. They *actively sample* the world to fulfill expectations (e.g., seeking food), often *increasing* sensory input and *risking* surprises. Conceding (b) as a "first pass" plants a deeply flawed intuition that corrupts understanding of active inference, adaptive value, and the very definition of "surprise" under FEP. **It's the gloss that does the most downstream damage.**

  **Ranking Justification:** The order prioritizes sentences closest to the mathematical core (c, e), then those describing common applications but missing universality (a), then a good-but-tricky universal framing (d), before the two major errors. (b) ranks above (f) only because (f) is a total non-starter, while (b) is a subtle but pervasive distortion of a key concept that students *must* grasp correctly.
