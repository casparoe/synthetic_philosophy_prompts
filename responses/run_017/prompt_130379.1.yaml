          H1: 1000 births in a global order, random permutation.
          H2: 1000 births, but in two batches: batch A (500) and batch B (500). Within batch A, random order, within batch B, random order. Batch A comes before batch B.

     Then birth rank is determined by the global order: batch A has ranks 1 to 500, batch B has ranks 501 to 1000.

     Evidence: my birth rank is 7.

     Non-anthropic likelihood:

          H1: 1/1000.
          H2: P(I am in batch A) = 500/1000 = 1/2. Then within batch A, P(rank=7) = 1/500. So overall, 1/2 * 1/500 = 1/1000.

     Equal.

     SSA with reference class = all children (1000).

          Under H1: only one child has birth rank 7.
          Under H2: only one child has birth rank 7 ( the one in batch A with local rank 7).

          So no shift.

     But note: in H2, the birth rank 7 is only possible for batch A. So the people in batch B could not have had birth rank 7. So if we apply the reference class as "all children who could have had birth rank 7", then under H1, everyone could have, so reference class size=1000. Under H2, only batch A could have, so reference class size=500.

     Then:

          SSA: the probability to have the evidence given H is the probability that your birth rank is 7, conditional on being in the reference class.

          Under H1: birth ranks are random in 1..1000. Given that you are in the reference class (everyone), P(7)=1/1000.
          Under H2: given that you are in batch A (the reference class under H2), birth ranks are random in 1..500. P(7)=1/500.

          So then the posterior ratio becomes:

              P(H1|evidence) / P(H2|evidence) = [ (1/2) * (1/1000) ] / [ (1/2) * (1/500) ] = 500/1000 = 1/2.

          So P(H1|evidence)=1/3, P(H2|evidence)=2/3.

