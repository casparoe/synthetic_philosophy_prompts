               P_{SIA}(H1|evidence) = [500 * (1/1000)] / [500 * (1/1000) + 500 * (1/1000)] = 1/2.
               Similarly for H2: 1/2.

     So SIA does not move from the prior.

     This meets the user's request.

     Now, let's write the scenario.

     Scenario paragraph:

          In a hospital, 1000 women are about to give birth. A coin flip determines the birth order procedure: heads (H1) means births occur in a single random order. tails (H2) means births are in two batches: one woman chosen at random to be in batch A (giving birth first, so birth rank 1), and the other 999 in batch B (giving birth in a random order for ranks 2 to 1000). You are a child and you observe your birth rank is 1.

     Constraints check:

          - Mundane setting: hospital. One time.
          - Datum: birth rank (here, rank 1).
          - Under both hypotheses, exactly one person has birth rank 1. (Under H1, only one child has rank 1. Under H2, only the child in batch A has rank 1.)
          - Non-anthropic: P(evidence|H1)=1/1000, P(evidence|H2)=1/1000. Equal.
          - Total observers: 1000 in both.

     Now, computations.

     1. SSA computation:

          We choose the reference class as: "all children who could have had birth rank 1".

          Under H1: anyone could have, so reference class size = 1000. Number with evidence = 1. So factor = 1/1000.
          Under H2: only the child in batch A could have birth rank 1, so reference class size = 1. Number with evidence = 1. So factor = 1/1 = 1.

          Prior: P(H1)=P(H2)=1/2.
          Unnormalized posterior for H1: (1/2) * (1/1000) = 1/2000.
          Unnormalized posterior for H2: (1/2) * 1 = 1/2.
          Normalize: total = 1/2000 + 1/2 = 1/2000 + 1000/2000 = 1001/2000.
          P(H1|evidence) = (1/2000) / (1001/2000) = 1/1001.
          P(H2|evidence) = (1/2) / (1001/2000) = (1000/2000) / (1001/2000) = 1000/1001.

          Now, try a narrower reference class: only those who share the exact evidence. But the evidence is birth rank 1. So in both hypotheses, only one person has that evidence. Then the reference class is size 1 in both. Then:

              Under H1: factor = 1/1 = 1.
              Under H2: factor = 1/1 = 1.

          So posterior remains 1/2 for both.

          Wider reference class: everyone alive on Earth. Suppose there are 7 billion people alive.

          Under H1: reference class size = 7e9. Number with evidence (birth rank 1 in this special group) = 1. So factor = 1/7e9.
          Under H2: reference class size = 7e9. Number with evidence = 1. So factor = 1/7e9.

          Then posterior ratio = 1:1, so still 1/2.

     2. SIA computation:

          SIA adjusted prior:

              P_{SIA}(H1) ∝ P(H1) * number of observers under H1 = (1/2)*1000 = 500.
              P_{SIA}(H2) ∝ (1/2)*1000 = 500.

          Likelihood for evidence (which is: birth rank is 1) under each hypothesis:

              P(evidence|H1) = 1/1000.
              P(evidence|H2) = 1/1000.

          Then unnormalized posterior for H1: 500 * (1/1000) = 0.5.
          For H2: 500 * (1/1000) = 0.5.
          Normalize: 0.5 + 0.5 = 1, so P(H1|evidence)=0.5, P(H2|evidence)=0.5.

          SIA does not move.

     3. Decision:

          Option A: You are offered a bet: if H1 is true, you get $1000; if H2 is true, you get nothing.
          Option B: You get $1 unconditionally.

          Utility: You care about money. Assume linear utility.

          Under SSA: 
              P(H1) = 1/1001, P(H2)=1000/1001.
              EU(A) = (1/1001)*1000 + (1000/1001)*0 = 1000/1001 ≈ $0.999.
              EU(B) = $1.
              So SSA chooses B.

          Under SIA:
              P(H1)=P(H2)=1/2.
              EU(A) = (1/2)*1000 + (1/2)*0 = $500.
              EU(B) = $1.
              So SIA chooses A.

          They come apart.

          But note: the user said "if you need to make one payoff slightly bigger to break SIA's tie and get it picking the other option". Here, SIA is choosing A and SSA is choosing B. We don't need to break a tie for SIA because it already chooses A. We have a clear divergence.

     4. Feature doing the work:

          The key is that the reference class for SSA is defined as "those who could have had the evidence", and this class is small under H2 (only batch A) and large under H1 (everyone). 

          If the datum were something that could have occurred under either hypothesis to anyone (e.g., "I exist"), then under both hypotheses, everyone has that evidence. Then:

              Reference class: everyone. 
              Under H1: factor = 1000/1000 = 1.
              Under H2: factor = 1000/1000 = 1.
              So no shift.

          In our case, the evidence is birth rank 1, which is only possible for batch A in H2.

     5. Strongest objection from SIA defender:

          An SIA defender might argue that the reference class is chosen in an ad hoc way to make SSA shift. Why should the reference class be "those who could have had birth rank 1"?

          In particular, they might insist that the reference class should be fixed and not hypothesis-dependent. If we fix the reference class as "all children born in the hospital", then under both hypotheses, the reference class size is 1000. Then the factor for both is 1/1000, and no shift.

          Or if we use a wider reference class, also no shift.

          So the objection is that the reference class choice is crucial and not objective.

          My honest read: this objection works. The shift in SSA depends on a particular choice of reference class. If we use the natural reference class of all children in the scenario, then SSA does not shift. The result is therefore sensitive to the reference class selection, which is a known issue for SSA.

          However, the user's request was to have a case where SSA _can_ be used recklessly. This setup shows that if one adopts a reference class that is too narrow (by conditioning on being in the group that could have had the evidence), then SSA becomes extremely confident in H2. But if the reference class is chosen differently, it doesn't. So the recklessness is conditional on the reference class choice.

          The user might be satisfied because they wanted a case where SSA can be reckless, and this shows how.

     Therefore, we have a case.

     Let's write it up.
answer: |-
  ### Scenario  
  At a hospital, 1000 women are about to give birth. A fair coin flip determines the procedure: heads (H1) births occur in a single random order (birth ranks 1 to 1000); tails (H2) one woman is randomly selected for batch A (birth rank 1), and the other 999 form batch B (randomly assigned ranks 2 to 1000). You are a newborn and observe your **birth rank is 1**. Non-anthropic evidence (e.g., medical records confirming the birth setup) equally supports H1 and H2: \( P(\text{rank}=1 \mid H1) = 1/1000 \) and \( P(\text{rank}=1 \mid H2) = 1/1000 \). Under both hypotheses, exactly one person has birth rank 1 (you), and the total number of observers is 1000.

  ---

  ### 1. SSA Computation  
  **Reference class**: "All newborns who could have had birth rank 1" (i.e., those in the group eligible for rank 1 under their hypothesis).  
  - **H1**: All 1000 could have had rank 1. Fraction matching evidence: \( \frac{1}{1000} \).  
  - **H2**: Only the 1 in batch A could have had rank 1. Fraction matching evidence: \( \frac{1}{1} = 1 \).  
  - **Priors**: \( P(H1) = P(H2) = \frac{1}{2} \).  
  - **Unnormalized Posteriors**:  
    - \( H1 \): \( \frac{1}{2} \times \frac{1}{1000} = \frac{1}{2000} \)  
    - \( H2 \): \( \frac{1}{2} \times 1 = \frac{1}{2} = \frac{1000}{2000} \)  
  - **Normalized Posteriors**:  
    - \( P(H1 \mid \text{evidence}) = \frac{1/2000}{1001/2000} = \frac{1}{1001} \approx 0.001 \)  
    - \( P(H2 \mid \text{evidence}) = \frac{1000/2000}{1001/2000} = \frac{1000}{1001} \approx 0.999 \)  
  SSA is >99% confident in H2 (batch procedure).  

  **Varying the Reference Class**:  
  - **Narrower (only those with rank 1)**: Size = 1 under both. Fractions = \( \frac{1}{1} = 1 \) for both. Posteriors remain \( \frac{1}{2} \).  
  - **Wider (all 7 billion humans alive)**: Size = \( 7 \times 10^9 \) under both. Fractions = \( \frac{1}{7 \times 10^9} \) for both. Posteriors remain \( \frac{1}{2} \).  
  The extreme shift only occurs with the "could have had" reference class.

  ---

  ### 2. SIA Computation  
  - **SIA-Adjusted Priors**:  
    - \( P_{\text{SIA}}(H1) \propto P(H1) \times \text{observers in } H1 = \frac{1}{2} \times 1000 = 500 \)  
    - \( P_{\text{SIA}}(H2) \propto P(H2) \times \text{observers in } H2 = \frac{1}{2} \times 1000 = 500 \)  
  - **Likelihoods**: \( P(\text{rank}=1 \mid H1) = P(\text{rank}=1 \mid H2) = \frac{1}{1000} \)  
    (since exactly one observer has the evidence in both worlds).  
  - **Unnormalized Posteriors**:  
    - \( H1 \): \( 500 \times \frac{1}{1000} = 0.5 \)  
    - \( H2 \): \( 500 \times \frac{1}{1000} = 0.5 \)  
  - **Normalized Posteriors**: \( P(H1 \mid \text{evidence}) = P(H2 \mid \text{evidence}) = \frac{0.5}{1} = 0.5 \).  
  SIA stays at 50%, unmoved from priors.

  ---

  ### 3. Decision Problem  
  **Options**:  
  - **Option A**: Bet on H1. If H1 is true, you win $1,000; if H2 is true, you get $0.  
  - **Option B**: Take $1 unconditionally.  

  **Utilities**: Assume linear utility in money (e.g., U(\$) = \$).  

  **Expected Utilities (EU)**:  
  - **SSA**:  
    - \( EU(A) = \left(\frac{1}{1001} \times 1000\right) + \left(\frac{1000}{1001} \times 0\right) \approx \$0.999 \)  
    - \( EU(B) = 1 \)  
    SSA chooses **B** (safe $1).  
  - **SIA**:  
    - \( EU(A) = (0.5 \times 1000) + (0.5 \times 0) = \$500 \)  
    - \( EU(B) = 1 \)  
    SIA chooses **A** (bet on H1 for high payoff).  

  ---

  ### 4. Feature Doing the Work  
  The key is that the SSA reference class ("could have had rank 1") is hypothesis-dependent:  
  - Under H1, it includes all 1000 newborns.  
  - Under H2, it includes only the 1 in batch A.  
  This makes the fraction \( \frac{\text{observers with evidence}}{\text{reference class}} \) much larger under H2 (1/1) than H1 (1/1000), driving the shift.  

  **If the datum were not hypothesis-restricting**:  
  - Suppose the evidence was "I exist" (true for all under both hypotheses).  
  - Reference class (all 1000) is identical under both. Fractions = \( \frac{1000}{1000} = 1 \) for both.  
  - SSA posteriors remain \( \frac{1}{2} \) (no shift).  

  ---

  ### 5. Strongest SIA Defender Objection  
  **Objection**: "The reference class 'all who could have had rank 1' is illegitimate. It should be fixed independently of hypotheses, e.g., 'all newborns in the hospital'. With this (size 1000 under both), SSA fractions are \( \frac{1}{1000} \) for both, so posteriors stay \( \frac{1}{2} \). This avoids reckless confidence."  

  **Honest Read**: This **works** as a defense. SSA's shift depends entirely on the controversial reference class choice. If the class is fixed to include all 1000 observers (a natural choice in mundane settings), SSA doesn't shift, matching SIA. However, if one allows context-dependent reference classes (e.g., including only those eligible for the evidence), SSA becomes overconfident. The case highlights how SSA's vulnerability to reference class ambiguity enables recklessness, but the objection neutralizes it by enforcing consistency.

  ---

  ### Constraints Check  
  All constraints met:  
  - Mundane hospital setting; one time; no multiverse/deity/infinities.  
  - Datum: personal birth rank.  
  - Exactly one observer with evidence under both hypotheses.  
  - Non-anthropic likelihoods equal (1/1000) via coin-flip procedure.  
  - Total observers: 1000 under both.  
  No relaxations needed.
