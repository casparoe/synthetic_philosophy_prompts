prompt: |-
  I'm in a reading group — four grad students, a postdoc, we meet in a pub and get through about ten pages a week if we're lucky — and we've been slogging through social construction stuff: race, gender, money, that whole cluster. I keep tripping over a pattern that I can't find a name for, and it's annoying me because I want to use it in a short paper and I don't want to reinvent something that already has a literature. Here's the shape of it, in three sketches. (1) A city's crime data says neighbourhood X is bad, so more patrols go to X; more patrols mean more low-level offences actually get *noticed* and written down; next quarter's data says X is worse than ever, so more patrols go to X. (2) A hospital flags certain patients as high-risk; flagged patients get more monitoring and more tests, so more things get found and recorded about them; the flag looks brilliantly predictive at review time and its thresholds get re-tuned using exactly that data. (3) Money: a bank gets a whiff of illiquidity, counterparties pull their funding, and the bank becomes illiquid — the panic that was supposedly a reaction to the fragility is what produced it. What I think is common to them: some institution sorts things into a kind, the sorting changes how *third parties* behave, that changed behaviour generates the data that gets cited as evidence that the sort was tracking something real, the criteria get re-estimated from that data, and the kind drifts to fit the effects of its own application. And then it settles. Once it's settled, if you go poking at it — run a programme to test whether the kind is really out there, or deliberately stop patrolling X to see what happens — the machinery re-estimates and you more or less end up back where you started. So the kind is at once empirically robust and entirely made, and the robustness is precisely what makes it look like it was discovered rather than built.

  The thing is, I don't think this is just one of the obvious nearby things, but I can't say exactly why. My flatmate says self-fulfilling prophecy, and I think that's too thin: a self-fulfilling prophecy is a belief that makes itself true once, whereas this is a standing machine with a re-estimation rule that keeps making it true and keeps hiding that it's doing so. My economist friend says endogeneity, or reverse causality, and that feels both right and useless — it's a complaint about a regression, not a claim about a kind. The thing I've been pointed at most often is Hacking: something about looping effects and making up people. My reason for setting it aside is that in his cases, as I understand them second-hand, the loop runs *through the people classified* — they get labelled, they come to understand themselves under the label, they change, and the kind has to be revised to catch up. My cases don't need that at all. The residents, the patients, the depositors may never know they've been sorted; the loop runs through other people's behaviour and through which events end up in the dataset. But I genuinely don't know whether that's a real difference or whether the self-conception bit is inessential to Hacking and I've just read a bad summary. There's also a feature I can't decide is essential: in all three of my cases the criteria get re-described in a vocabulary that mentions no institution at all — a rate, a risk score, a measured frequency — and that's what makes the kind look like a natural one that social construction talk is somehow second-class about. Is that laundering part of the phenomenon, or a separate thing that happens to travel with it?

  So: is there an established concept for this, one that isn't just the general neighbourhood of social construction? And whichever way that goes, I'd rather have the carving than the label. Specifically: (a) if there are several nearby concepts, which one fits best and what exactly does each of the others leave out; (b) is the loop-running-through-the-evidence-base rather than through the classified people's self-understanding a real distinguishing mark, or a red herring; (c) here's a case I can't sort — suppose the flagging changes *only* what gets recorded and not what actually happens, so the underlying rate is identical and yet every number still moves in the confirming direction. Same phenomenon, or a different one that deserves its own name, and if you had to pick one as the more important target for a paper, which; (d) does it matter that everybody involved can know about the loop and it still runs — the policing case has been publicly described for years and the numbers keep being used anyway; (e) what do you call the runaway version, where the loop doesn't settle but oscillates or escalates — degenerate case of the same thing, or its own animal? And if the honest answer is that there's no established term, then give me one: coin it, define it tightly enough that I can tell in/out, and give me a couple of clear positive cases and a couple of near-misses that a careless reader would lump in. Please don't just gesture at a literature or hand me names to go look up — I can't tell whether the gesture is right until somebody does the distinctions, and the distinctions are the part I actually need.
reasoning: |-
  Okay, let me unpack this user's query. They're part of an academic reading group focusing on social construction, and they've identified a specific pattern in institutional classification systems where the act of sorting entities changes third-party behavior, which then generates data reinforcing the initial classification. They've provided three examples: policing, hospital risk scores, and bank liquidity. 

  The user seems frustrated because existing terms like self-fulfilling prophecy or endogeneity don't fully capture this phenomenon. They've also considered Ian Hacking's looping effects but note that in their cases, the loop runs through data collection rather than self-conception. Their key questions revolve around conceptual boundaries: whether the data-laundering aspect is essential, if awareness stops the loop, and how to handle cases where only recording changes.

  Hmm. The core issue is a gap in social theory terminology. The user isn't just asking for labels—they want precise conceptual dissection. Their examples share five features: institutional sorting, third-party behavioral change, data generation masking construction, criteria recalibration, and eventual stabilization. That's more specific than existing terms. 

  For instance, self-fulfilling prophecies lack the recursive recalibration aspect. Hacking's loops require subjective internalization, whereas here the mechanism is observational selection bias amplified by institutional feedback. Endogeneity is a statistical artifact, not a social process. 

  Interesting challenge. The user needs a coinage that captures both the feedback mechanics ("recalibration") and the illusion of naturalness ("laundering"). Maybe "institutional reality anchoring"? Too clunky. "Classificatory drift"? Still misses the data aspect. 

  The runaway cases (e) might be "amplificatory loops" vs. stabilized "inertial loops." But the settled state seems more pernicious—it's when the construct becomes infrastructure. 

  On their unclassifiable case (c): if only recording changes, it's a subspecies where the illusion is purely epistemological. Same phenomenon, different mechanism. Policing is the strongest example because it demonstrates both behavioral and recording effects. 

  For literature, I should mention Wacquant's work on penal systems and Bowker & Star on classification—but cautiously, since they don't name this exact mechanism. The coinage must stand alone. 

  User's tone suggests impatience with hand-wavy academia. They'll reject anything fuzzy. Definition needs sharp boundaries: "A process where..." [cuts off to structure response]
answer: |-
  Your frustration is palpable—and justified. You've hit upon a deeply systemic pattern that *isn't* cleanly captured by existing terms. Let's carve this precisely.

  ### The Core Phenomenon: **Institutional Reality Anchoring (IRA)**
  **Definition:** *A self-stabilizing institutional process where:*
  1.  **Sorting:** An institution applies a classification system (e.g., "high-risk," "high-crime," "illiquid") to entities (people, places, objects).
  2.  **Behavioral Cascade:** This sorting triggers *third-party behavioral responses* (police patrols, medical tests, counterparty withdrawals) directed *at* the classified entities.
  3.  **Artifact Generation:** These responses systematically alter the *observability* or *incidence* of events relevant to the classification (more arrests, more diagnoses, liquidity drain), generating new data.
  4.  **Reification & Recalibration:** The institution interprets this new data as objective evidence validating the original classification and its criteria. Crucially, it *recalibrates* the classification system (thresholds, weights) based *on this artifact-laden data*.
  5.  **Stabilization & Obfuscation:** The system reaches equilibrium where the classification appears empirically robust and "natural." The institutional role in *producing* the evidence becomes obscured; the classification is laundered into objective metrics (rates, scores, frequencies). The loop becomes self-concealing.

  **Why existing terms fall short:**

  1.  **Self-Fulfilling Prophecy (SFP):** Captures a *single causal link* (belief -> action -> outcome matching belief). IRA involves a *dynamic, institutionalized feedback loop* with recalibration, data generation, and laundering. SFP is an event; IRA is an institutional *machine*. SFP doesn't inherently involve data artifacts or re-estimation.
  2.  **Endogeneity/Reverse Causality:** These are *statistical problems* (X causes Y, but Y also causes X, biasing estimates). IRA is the *socio-institutional mechanism generating that endogeneity*. Endogeneity describes a flawed model; IRA describes *how the flawed social reality is actively constructed and maintained*.
  3.  **Hacking's Looping Kinds:** You're right to be cautious. Hacking focuses on the *interaction between classification and the self-understanding/behavior of the classified subjects themselves* ("interactive kinds" – e.g., "homosexual" identity shaping behavior). Your cases are **Non-Interactive Kinds** within the IRA framework. The loop runs *externally* via institutional actions and data capture on the objects of classification, *not* through their internalization of the label. This is a **crucial distinction**. (Hacking touches on "indifferent kinds" but doesn't develop the institutional/data-laundering angle deeply).
  4.  **Social Construction (General):** Too broad. IRA is a *specific mechanism* for how social constructs achieve *empirical robustness and institutional inertia* through feedback and data laundering.
  5.  **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):** Captures part of the distortion (focusing effort distorts measurement) but misses the *institutional recalibration based on distorted data* and the *laundering into objectivity*. Goodhart's is about gaming a *fixed* target; IRA involves the target *itself* being reshaped by the distortion.

  ### Addressing Your Specific Queries

  a)  **Best Fit & Distinctions:**
      *   **Institutional Reality Anchoring (IRA)** best fits your core phenomenon, as defined.
      *   **Hacking's Looping Kinds:** Distinction = Internalization by the classified vs. External institutional/data loop (Non-Interactive).
      *   **Endogeneity:** Distinction = Mechanism vs. Statistical flaw.
      *   **SFP:** Distinction = Static belief-event vs. Dynamic institutional machine.
      *   **Performativity (Economics):** (e.g., MacKenzie on derivatives) - Closer! Captures ideas shaping reality via markets. But often focuses on *models/concepts* shaping behavior, not necessarily the *institutional sorting/classification/data-laundering/recalibration loop* you describe. Performative acts can *initiate* IRA but don't fully define its sustained mechanics.

  b)  **Loop Through Evidence vs. Self-Understanding:** This is a **REAL and CRUCIAL distinguishing mark**. It defines the **Non-Interactive** nature of the kinds in IRA. The classified subjects are largely passive objects; the action is in the institutional response and data capture. This separates it sharply from Hacking's core interactive cases (though his framework is flexible enough to potentially accommodate it with refinement).

  c)  **Pure Recording Effect Case:** This is **a subspecies of IRA** – call it **Epistemic IRA** or **Observational Anchoring**. The core IRA mechanism runs the same: sort -> trigger observation/monitoring -> generate *data artifact* (not event artifact) -> reify/recalibrate -> stabilize. The *illusion of kind-hood* is just as strong, perhaps stronger, because the underlying reality is unchanged, making the data divergence even more starkly an institutional product. **For a paper, your original cases (esp. policing) are richer targets** because they often involve *both* observational *and* behavioral effects (more patrols *can* deter *some* crime while amplifying detection of others), making the entanglement clearer and the social harm more demonstrable. Epistemic IRA is philosophically fascinating but harder to isolate empirically.

  d)  **Awareness:** It **does not stop the loop**, and that's *vital*. This is why IRA is so pernicious. *Knowing* the patrols create the data doesn't give the police chief a politically viable alternative to sending patrols to "high-crime" areas defined by that data. The hospital *must* act on the "high-risk" flags generated by the system. The laundered metric ("crime rate," "risk score," "liquidity ratio") becomes the *operational reality* of the institution. Critiques become "theoretical" against "hard data." This institutional inertia and the functional necessity of acting on available metrics sustain IRA despite awareness.

  e)  **Runaway Version:** This is **a degenerate or unstable state within the IRA framework**. Call it **Amplificatory IRA** or **IRA Instability**. It occurs when the feedback loop lacks damping mechanisms. E.g., *Oscillation:* Patrols surge -> arrests surge -> panic -> patrols slashed -> unreported crime spikes -> panic -> patrols surge again. *Escalation:* Each risk score recalibration lowers thresholds, flagging more patients, generating more "evidence," lowering thresholds further. The *stabilized* IRA is the more common and insidious form, as it becomes invisible infrastructure. The runaway form reveals the mechanics but is less sustainable. Both are the "same animal" (the IRA mechanism), just operating in different dynamical regimes.

  ### If We Must Coin It: Institutional Reality Anchoring (IRA)

  *   **Definition:** (As above).
  *   **Positive Cases:**
      1.  **Predictive Policing Algorithms:** Input historical arrest data (artifact of past patrol focus) -> algorithm flags "high-risk" areas -> police deploy there -> generate *more* arrests in those areas -> feed back into algorithm for retraining -> algorithm appears more accurate, flags same areas more strongly.
      2.  **Corporate Credit Ratings:** Agency downgrades a firm -> triggers loan covenants/forces asset sales -> firm becomes weaker -> justifies the downgrade -> criteria for future downgrades subtly shift based on data from this crisis.
      3.  **Child Welfare Risk Models:** Model flags families based on proxies (poverty, zip code) -> triggers intrusive investigations -> more minor infractions found/recorded -> model retrained on this data -> appears highly predictive, thresholds tighten.
  *   **Near-Misses (Careful Distinction Required):**
      1.  *Medical Diagnosis Expansion:* More screening finds more disease, expanding diagnostic criteria. **Near Miss:** Lacks the clear *third-party behavioral cascade altering the data/events* based *only* on the classification. The loop often runs through medical practice norms & patient presentation, not an institutional trigger changing observation/incidence *because* of the label. (Could become IRA if tied to e.g., insurance flags triggering mandatory extra tests).
      2.  *Teacher Expectancy Effects (Pygmalion):* Teacher believes student is bright -> treats them differently -> student performs better. **Near Miss:** Classic SFP. Lacks institutional sorting/recalibration/laundering. Loop runs through direct interaction, not data artifacts.
      3.  *Algorithmic Bias in Hiring:* Biased training data -> biased algorithm -> rejects qualified candidates from group X -> lack of hires from X reinforces bias in next dataset. **Near Miss:** Focuses on bias *reproduction* in selection. Key IRA element missing is the *institutional action triggered by the classification that actively changes the observed world/data* beyond just the selection decision itself. (If the algorithm flagged "low-potential" candidates who were then given worse interview conditions *because* of the flag, leading to worse performance *recorded* as data, it would cross into IRA).

  **Why "Anchoring"?** It captures how the institution's initial act of classification "drops an anchor." Subsequent actions (the chain) pull on this anchor, but the feedback loop (the winch) actually *pulls the seabed (reality/data) towards the anchor*, making it seem like the anchor was always in the right spot. The "laundering" turns the disturbed seabed into a natural-looking feature.

  **Your contribution is recognizing:** 1) The **Non-Interactive** nature of the kind, 2) The **institutional recalibration based on artifact-laden data**, 3) The **laundering into objective metrics**, and 4) The **stability despite awareness**. **IRA** provides the conceptual precision to separate this from SFPs, statistical endogeneity, and interactive looping. Run with it.
