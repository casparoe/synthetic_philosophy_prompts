answer: |-
  ## Cotton Ghazal with Habitual Refrain

  **Concept Sketch:**  
  1. **Opening couplet:** Sets the scene (workshop, fire, cotton) and establishes the refrain as observed sequence.  
  2. **Couplets 2-3:** Build concrete details (ash, sun, shadows) reinforcing the "habit".  
  3. **Couplet 4:** Explicitly names the theological tension ("habit of the Real").  
  4. **Couplets 5-6:** Focus on perception and repetition ("hand recoils," "same words").  
  5. **Couplet 7 (Final Full Refrain):** States the core doctrine ("He chooses how") under the habitual structure.  
  6. **Couplet 8 (Break & Address):** Withholds the expected refrain word ("was"), replaces it with direct address ("Your hand"), enacting the miracle as a subtle discontinuity.

  **(The Ghazal)**

  The fire consumes the cotton. Quick black sands  
  Fall through the grate. The pattern *as it ever was*.

  The ember’s breath, the brittle ash that stands  
  On cooling stone, confirms *as it ever was*.

  The noon sun climbs the wall the loom demands,  
  Casts the same shadow *as it ever was*.

  My calloused hand recoils – it understands  
  The heat’s sharp greeting *as it ever was*.

  No “must” binds spark to thread, yet habit brands  
  This sequence deep *as it ever was*.

  The shop-boy chants the price; the same words land  
  On patient ears *as it ever was*.

  The Real, *al-ʿādī*, holds no fixed commands –  
  He chooses how *as it ever was*.

  But You… whose breath sustains these fragile strands,  
  Whose constant grace… *Your hand* – not as it was.

  ---

  **Form Serving Metaphysics:**  
  *   **Refrain as Habit:** The identical return of "*as it ever was*" after each varied rhyme (sands/stands/demands/understands/brands/land/commands/strands) builds the listener's expectation, mirroring the human experience of perceived causal regularity. By the 4th or 5th couplet, the mind leans into the refrain, anticipating its return – enacting the "felt necessity" al-Ghazali argues is merely custom (*ʿāda*).  
  *   **The Break as Miracle:** The final couplet disrupts the deeply ingrained pattern. The rhyme "strands" sets up the expectation for "*as it ever was*". Instead, it delivers "*Your hand* – not as it was". This isn't a grand violation, but a subtle warping, a single word withheld ("ever") and replaced ("Your hand"), enacting the occasionalist miracle: the Sustainer simply enacting a different *mashīʾa* (will) in that moment. The "was" remains, but altered, emphasizing the continuity of divine action, just differently.  
  *   **Voice & Doctrine:** The speaker observes the workshop's concrete realities (embers, ash, sun, calloused hands, shop-boy, loom dust) with weary familiarity. The tension between practical certainty ("hand recoils") and theoretical groundlessness ("No 'must' binds spark to thread") is present but unresolved. The theological term *al-ʿādī* (The Habitual One) is used naturally within the worker's conceptual frame. The final address ("You… whose breath sustains") is direct and personal, avoiding devotional grandiosity – it's the worker acknowledging the ultimate source of the very habit just broken. The poem ends on the discontinuity ("not as it was"), leaving the tension between divine freedom and perceived order open.
