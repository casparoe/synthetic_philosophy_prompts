prompt: |-
  I'm writing a short discussion paper for a graduate seminar on formal epistemology, and I've got as far as noticing that my own reactions to the two standard paradoxes of aggregated belief don't add up to anything I can state. The setups are the familiar ones: a fair lottery with a thousand tickets and exactly one winner, where I am perfectly happy to believe of each ticket that it will lose and perfectly unwilling to believe that they all will; and a historian who has written two hundred assertions into a book, believes each of them, and adds in the preface that there are surely errors somewhere. I take the second to be not merely permissible but exemplary — the author who omits the preface strikes me as the worse epistemic citizen — while in the lottery I take no attitude toward the conjunction at all and feel no pressure to have one. The trouble is that nearly everything I want to say in one case has a counterpart in the other that I want to answer differently. Below are my verdicts, as honestly as I can report them; what I want from you is a principle.

  1. Lottery. I believe of ticket 47 that it loses; likewise for all thousand. I don't believe they all lose, and I don't think I'm criticizable for failing to. I'll bet against ticket 47 at slightly better than the fair odds, and against each of the others too; I won't sell you all thousand bets bundled, since that's a certain loss. But the bundling refusal doesn't, I think, show that I don't really believe each — it shows something about prudence, or so I want to say. 2. Preface. I believe each of the two hundred claims, I believe the hedge, I believe publishing the hedge is a virtue, and I'll act on any one of the claims — cite it, build an argument on it — without ceremony. 3. Small numbers. Same book, but with three claims plus the hedge: fine, though I'm noticeably less comfortable. Two claims, where the second one *is* the hedge ("at least one claim in this book is false"): not fine — believing both is inconsistent, and I withdraw my license to hedge. So the number of claims matters, and I can't say why or where the cutoff falls. 4. Located versus unlocated doubt. A referee believes each of twelve claims in a paper, believes that at least one is probably wrong, and recommends acceptance: fine. A referee who comes to believe that claim 7 specifically is wrong must say so and must not recommend acceptance unqualified. Asked "which one?", "I don't know" is an acceptable answer. But a referee who has localized the error only to the effect that it lies somewhere in chapter 3, which contains four claims, must flag chapter 3 — even though she still can't say which claim. 5. Fragmentation. A company knows that roughly two hundred of fifty thousand records were accessed in a breach. Sending fifty thousand separate letters each saying "your record was not accessed": not fine. Publishing one page that lists all fifty thousand names with "not accessed" beside each and the aggregate estimate visible at the top: fine, or much closer to fine. Sending the letters with the base rate stated in each: fine. Same content, different presentation, different verdict — which makes me suspect my verdict here isn't about belief at all. 6. Statistical versus evidence-specific support. In the lottery nothing distinguishes ticket 47 from ticket 812; my belief rests entirely on the base rate. In the preface my belief in claim 12 rests on evidence specific to claim 12 — I checked it, I remember the source. And I treat them differently: I'll build on claim 12, I won't build anything on "ticket 47 will lose," and I'd be embarrassed to cite the latter as a reason for anything. Is that principled, or a prejudice? If it is principled, then the lottery and the preface aren't the same animal, and the habit of treating them as one family is a mistake. 7. Conjunction and thresholds. Two independent claims, each about ninety percent credible: I believe the conjunction. Five: I think I still believe it. Ten, at about thirty-five percent: no. So there's a cutoff somewhere, but I feel no sharp one and my confidence doesn't feel numerical. Relatedly: I believe p, I believe that if p then q, and q might be only fifty percent likely. If I've actually drawn the inference I want to say I believe q; if it hasn't occurred to me, I want to say I'm under no requirement. Is "closure only for inferences actually drawn" a coherent position, and does it reach the conjunction cases or only the one-step ones?

  The best I've managed on my own is this: call a doubt *unlocated* when my evidence gives me no more reason to suspect one member of a set than any other. Then: (i) I may believe each member of a set while also believing that some member is false, exactly when my doubt is unlocated; (ii) unlocated doubt licenses acting on any single member but never on the conjunction; (iii) it licenses asserting members only to audiences who can also see the aggregate; (iv) where support is purely statistical I may believe each member but may not use any one of them as a premise, whereas where support is evidence-specific I may do both. This is built to fit 1, 2, 4 and 5, so I don't trust it. It says nothing about 3 or 7, and clause (iii) turns one of my verdicts into a matter of audience etiquette rather than of rationality, which I take as a sign that I've really got two principles stapled together.

  So: give me a principle, or a short list of candidates, stated precisely enough that I could apply it to a case you haven't been shown. For each clause, tell me which of my cases is doing the motivating work. Then tell me what it says about cases I haven't listed — a radiologist who reads two hundred scans a day and knows her own error rate, a judge who signs forty warrants a week while knowing that some small fraction of them are not properly supported, a labeller of ten thousand images who is ninety-nine percent accurate and ships the dataset with a documented error rate — and tell me plainly which of my verdicts above your principle cannot accommodate and which one you'd overturn. If my tentative principle is salvageable, repair it; if it's confused, say where. Please write in American English, and please don't give me a bibliography or a reading list — I have plenty of reading, and what I want is your own analysis.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're writing a paper on formal epistemology and are stuck on reconciling their reactions to the lottery and preface paradoxes. Their intuitions differ significantly between the two cases, despite both involving belief aggregation with probabilistic uncertainty. 

  First, I need to understand their core dilemma: why do they accept the preface case as rational while rejecting the lottery conjunction? They've listed seven detailed verdicts showing this asymmetry. For example, they're comfortable asserting individual claims in the preface but won't use "ticket 47 loses" as a premise. The fragmentation case (sending individual letters vs a list) suggests presentation affects their judgment - which might indicate it's not purely about belief.

  The user's tentative principle centers on "unlocated doubt" - doubt that can't be pinned to any specific item. This seems promising but has gaps. It explains why we can believe each preface claim while acknowledging some error, but doesn't handle the small-number cases (verdict 3) or conjunction thresholds (verdict 7). The user is rightly suspicious that their clause about audience etiquette (iii) feels ad hoc.

  Hmm... what deeper principle might unify this? The key might be how we handle epistemic risk. In the preface, each belief is evidence-based and actionable individually because the doubt is distributed. In the lottery, beliefs are purely statistical and collapse when aggregated. The radiologist case later will test this - she has evidence-specific support for each scan but knows her error rate.

  For the repair... instead of "unlocated doubt," maybe "distributable epistemic risk." This would: (1) allow believing members while doubting the set when risk is evenly distributed; (2) permit acting on individuals only if risk is mitigated contextually (e.g., by disclosure); (3) require statistical beliefs to have higher thresholds for premise use. 

  This would salvage their clause (iv) but drop (iii), making audience awareness part of risk management rather than etiquette. For the small-number preface (verdict 3), distributable risk fails at n=2 because doubt can't distribute - forcing withdrawal. The conjunction threshold (verdict 7) becomes about risk accumulation in inference chains.

  Testing against unlisted cases: The radiologist can believe each scan result if she flags her aggregate error rate - acting on individual scans is fine with disclosure. The judge signing warrants needs systemic checks since statistical risk isn't distributable fairly to defendants. The image labeller should provide error documentation but needn't stop shipping data.

  Biggest tension: verdict 6 (statistical vs evidence-based support). My principle says statistical beliefs shouldn't be used as premises, which matches the user's embarrassment about citing lottery beliefs. But is this defensible? Perhaps - statistical supports are defeatable by base rates in ways evidence-specific ones aren't.

  If the user pushes back, we might need to distinguish between "belief" and "acceptable premise," but that might complicate things. For now, distributable epistemic risk seems like the strongest candidate.
answer: |-
  Here’s a unified principle that captures your intuitions while resolving the tensions in your cases. I’ll state it precisely, then map it to your verdicts, test it against unlisted cases, and flag where it challenges one of your judgments.

  ### The Principle: **Distributable Epistemic Risk**
  > **An agent may rationally believe each member of a set *and* believe the set contains at least one falsehood iff:**
  > **(i) The epistemic risk of error is *distributable* across the set (i.e., no member bears significantly higher subjective probability of falsehood than any other), *and*  
  > **(ii) The support for each belief is *non-statistical* (i.e., grounded in evidence specific to that belief).  
  >   
  > **Consequences:**  
  > - **Action/Assertion:** When (i) and (ii) hold, an agent may act on/assert any single member *only if* the aggregate risk is contextually acknowledged (e.g., via hedging, error rates, or audience awareness).  
  > - **Conjunctions:** Conjoining all members is rationally forbidden, as the aggregated risk exceeds tolerable thresholds for belief.  
  > - **Statistical Supports:** Beliefs resting *only* on base rates (no specific evidence) may be held *but never used as premises for further inference or action*.  

  ---

  ### How It Captures Your Cases
  1. **Lottery**  
     - *Verdict:* Belief in individual losses is permissible, but not the conjunction.  
     - *Principle’s work:* Violates (ii) (support is purely statistical). Thus, you cannot use "ticket 47 loses" as a premise (explains refusal to bet bundled/embarrassment to cite it). Aggregating violates risk thresholds.  
     - *Motivating clause:* (ii).  

  2. **Preface**  
     - *Verdict:* Full belief in each claim + hedge is exemplary.  
     - *Principle’s work:* Satisfies (i) (doubt is unlocated/distributable) and (ii) (evidence-specific support). The hedge satisfies contextual acknowledgment.  
     - *Motivating clause:* (i) and (ii) + Action/Assertion rule.  

  3. **Small Numbers**  
     - *Verdict:* 200 claims: fine. 3 claims: uncomfortable. 2 claims (one being the hedge): irrational.  
     - *Principle’s work:* At *n=2*, the hedge *is* the doubt-location (violates distributability). For small *n* (e.g., 3), the risk isn’t fully distributable psychologically, but the principle allows it if (i) and (ii) hold. Your discomfort reflects *pragmatic* tension, not irrationality.  
     - *Motivating clause:* (i) (distributability weakens as *n* decreases).  

  4. **Located vs. Unlocated Doubt**  
     - *Verdict:* Unlocated doubt ("some error") is fine; localized doubt (claim 7 or Chapter 3) requires flagging.  
     - *Principle’s work:* Localizing error violates (i) (risk isn’t distributable). You *must* flag the high-risk subset (Chapter 3) to maintain contextual acknowledgment.  
     - *Motivating clause:* (i) + Action/Assertion rule.  

  5. **Fragmentation**  
     - *Verdict:* Sending 50k individual letters: not fine. Listing all names + aggregate rate: fine.  
     - *Principle’s work:* Individual letters lack contextual acknowledgment (violating Action/Assertion rule). The aggregate page provides acknowledgment.  
     - *Motivating clause:* Action/Assertion rule.  

  6. **Statistical vs. Evidence-Specific Support**  
     - *Verdict:* Treating lottery/preface differently is principled.  
     - *Principle’s work:* Core distinction formalized in (ii). Statistical beliefs (lottery) can’t be premises; evidence-specific (preface) can, with acknowledgment.  
     - *Motivating clause:* (ii).  

  7. **Conjunctions & Thresholds**  
     - *Verdict:* Fuzzy thresholds for conjunctions; closure only for drawn inferences.  
     - *Principle’s work:* Conjunctions aggregate risk beyond belief thresholds (always forbidden under the principle). For multi-premise inferences: if you *draw* the inference, you must accept the conclusion *if* all premises satisfy (i)/(ii) *and* the conclusion’s risk is acknowledged. Undrawn inferences impose no obligation.  
     - *Motivating clause:* Risk thresholds + Action/Assertion rule.  

  ---

  ### Application to Unlisted Cases  
  - **Radiologist (200 scans/day, knows error rate):**  
    - *Principle:* Permissible to believe each scan is correct *if* (i) error risk is distributable (no scan seems error-prone) and (ii) each diagnosis has evidence-specific support (e.g., image analysis). She must acknowledge aggregate risk (e.g., in reports). Acting on individual diagnoses is rational.  
  - **Judge (signs 40 warrants, knows some lack support):**  
    - *Principle:* Statistical risk (base rate of bad warrants) violates (ii). She *cannot* rationally believe "Warrant *X* is valid" without evidence-specific support for *X*. She must flag systemic risk or demand case-specific evidence.  
  - **Image Labeller (99% accurate, ships 10k images):**  
    - *Principle:* Statistical support violates (ii). She should *not* believe "Image #947 is correct." She may *assert* labels only with documented error rates (contextual acknowledgment). Shipping data is fine if users understand the risk.  

  ---

  ### Where Your Verdicts Are Challenged  
  - **Your tentative clause (iii):** You framed audience awareness as "etiquette." The principle makes it a *rational requirement* for action/assertion (saving it from ad hoc-ness).  
  - **Verdict 3 (Small Numbers):** The principle says the 2-claim case is irrational (consistent with you), but the 3-claim case *is* rational (while you’re "uncomfortable"). I’d argue your discomfort is pragmatic (the risk feels "located" when *n* is small) but not a failure of rationality.  
  - **Verdict 5 (Fragmentation):** You suspect your judgment isn’t about belief. The principle agrees: it’s about *expressing* belief with/without contextual acknowledgment.  

  ---

  ### Salvaging Your Tentative Principle  
  Your core insight (unlocated doubt + evidence-specific support) is sound. The repairs:  
  1. **Drop your clause (iii)** (audience etiquette). Replace it with the *Action/Assertion rule*: contextual acknowledgment is required for rational use of individual beliefs when risk exists.  
  2. **Clarify that statistical supports** (lottery) generate "beliefs" that are *inert*—they cannot fuel inference or action.  
  3. **Conjunctions are always forbidden** under distributable risk—no cutoff needed. Your discomfort in small-*n* conjunctions is because distributability diminishes, but rationality doesn’t break abruptly.  

  This avoids stapling by making **acknowledgment of aggregated risk** the glue between belief and action. The lottery/preface *are* distinct animals (due to ii), but both fall under distributable epistemic risk when non-statistical supports exist.  

  --- 

  ### Final Summary  
  - **Core Principle:** Distributable epistemic risk + non-statistical support licenses believing members while doubting the set.  
  - **Key Move:** Decouples *belief* from *premise-use*. Statistical "beliefs" are doxastically inert.  
  - **Overturned Verdict:** Your unease in the 3-claim preface is pragmatic, not rational—the principle permits it.  
  - **Unified:** The historian’s preface is exemplary because she satisfies (i)/(ii) *and* acknowledges risk. The lottery better is irrational because he tries to use statistical "beliefs" as action-guiding premises. 

  This gives you a testable criterion: for any set of beliefs, ask:  
  1. *Is the risk distributable?*  
  2. *Is support for each non-statistical?*  
  3. *If acting/asserting, is the aggregate risk acknowledged?*  
  If yes to all, your reactions are rational. If not, they’re not.
