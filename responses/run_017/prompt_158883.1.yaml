answer: |-
  ## The Turning Water's Query

  At first the vessel spins, the water still,  
  Their motion relative high, the surface flat.  
  Then both together turn, a common will,  
  No motion seen between, but curved at that:  
  The water climbs the sides. So cause must be  
  Not motion relative to the pail's own wall.  
  For when they moved apart, no curve to see;  
  When shared, the curve arose. What then to call?  

  But turn: the frame's the stars, not walls that bind.  
  Now let the stars and bucket disappear,  
  And only one sphere turn, alone, confined  
  By nothing. Does it bulge? Or sphere appear  
  Perfect? One says it swells, for turning gives  
  Itself as truth; the other: no reference lives.  

  ---

  **Explanation for clarity:**  
  - The **octave** (first 8 lines) sets up Newton's bucket experiment: initial spin (vessel moves, water still, flat surface) versus later shared motion (both turn, no relative motion, concave surface). The inconsistency argues concavity doesn't track relative motion between water and bucket.  
  - The **volta** at line 9 introduces the relationist reply: rotation is relative to the fixed stars (the broader matter framework), not the bucket.  
  - The **sestet** (lines 9–14) presents the imagined scenario: all matter (stars and bucket) annihilated, leaving only a rotating water sphere. The **couplet** (lines 13–14) contrasts the two positions:  
    - One claims the bulge persists (rotation is absolute, needing no other matter).  
    - The other claims no bulge (rotation requires relational reference, now absent).  
  The poem never names Newton or the positions ("absolutism" vs. "relationism"), letting the imagery and argument structure convey the debate. A reader unfamiliar with physics will see a water vessel's transformation; a knowledgeable reader will recognize the philosophical stakes.
