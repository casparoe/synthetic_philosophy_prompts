prompt: |-
  I've been asked to run a two-hour evening session on the Principal Principle for our city rationality meetup, and I want a plan for the session rather than the session itself. Please don't write out the explanation or draft me slides; I can do that. What I need is the architecture: what has to be introduced in what order and why, what carries the idea, and where the predictable failures are.

  The audience: fifteen to twenty-five people, mostly working programmers, two or three physicists, a handful of people whose entire philosophy of probability comes from Bayesian statistics and the sequences. Roughly half will arrive with the reflex that probabilities just are degrees of belief and that "objective chance" is either shorthand for a frequency or a leftover confusion. So the principle has to be made to bite before it can be stated, or it will sound like "your probability should equal the probability."

  The carrying example. I have a candidate and I want you to either adopt it or replace it, with reasons either way. There is a sealed grey box in the town library, running on its own battery, with a screen and a lens. Every morning at nine the screen shows a number between zero and one; at noon the lens either flashes green or doesn't. The manufacturer is dead and the manual is one page: it says only that the displayed number is the chance that the lens will flash that day. The library has kept a public log for three years: on the 1,271 days the screen read 0.30, the lens flashed on 30.1 percent of them, and so on up the range. Nobody has opened the box, and I intend to refuse, on principle, to say whether its mechanism is deterministic.

  Two variants the example has to be able to absorb. First, the Calibration Rival: a black-box forecasting model trained on the public log whose calibration over the last six months beats the displayed number. If the number is the chance and the model is better calibrated, what does the principle tell me to match? I want this staged so that it forces the gap between deferring to a chance and deferring to a well-calibrated forecaster, rather than letting the two collapse into the same thing. Second, the case where the information you would gain if the event happened would itself discredit the chance you deferred to — a second machine, deliberately boring in description, whose tomorrow's number depends on today's flash. I want that to land as a genuine tension and not as a puzzle-box technicality, and I especially want your advice on the moment I say "that information is inadmissible," because someone will immediately say that this is just reclassifying every counterexample as inadmissible, and I don't yet know whether to concede that, bite it, or reframe it earlier in the sequence so it doesn't look like a rescue.

  Two constraints I'm fairly confident about and want you to check: no quantum mechanics anywhere in the example, and no coins or dice. I think I know why both matter — the first licenses "chance is a fundamental brute primitive, mystery, next question," and the second lets symmetry do all the work so the principle looks like a restatement of indifference — but tell me if I have it backwards or if the costs are different from what I think.

  What I want mapped, concretely.

  One: the dependency structure. What must be in place before the principle can be stated non-vacuously, and what depends on what. In particular, how do I get this audience to grant chance enough independence from opinion that the principle says something, without opening the metaphysical question of whether chances exist? And where does the conditional form go? My instinct is that the admissibility clause only becomes visible once they see that the principle constrains credence conditional on a chance proposition, and not unconditional credence, and I'm unsure whether that distinction belongs before the first statement of the principle or after it, as a repair.

  Two: the misconception map, keyed to three people I expect to be in the room. The determinist physicist, who will say that under a block universe the chances are zero or one and the principle either tells him nothing or tells him to be certain. The machine-learning person, who will say that chance is just the output of the best-calibrated model and the principle is expert deference with extra formalism. And the decision-theory person, who will try to drag the entire second hour into Sleeping Beauty. For each: the strongest version of the point, the exact moment in the sequence to head it off, and how much of it I should concede rather than defeat.

  Three: the check. One question at the end that distinguishes having got the idea from having memorized the formula. Tell me what a successful answer looks like and which near-miss answers I should be able to tell apart from the real thing.

  Four: what to refuse to cover, and where in the session to say so out loud. My current list is the metaphysics of laws, the amended principles that quantify over conditional chances, the Sleeping Beauty literature, and whether chances exist at all. Tell me what else is on it.

  Finally, a sequencing question I keep going back and forth on. I want the session to have one takeaway sentence, something like the thought that the principle's whole content lives in its admissibility clause, so that the real question is which information is permitted to move you away from the chance. Should I hand that sentence to the room at the start as a map, or withhold it and let it land at the end? Argue for one.
reasoning: |-
  Okay, the user is preparing a two-hour session on the Principal Principle for a rationality meetup. The audience includes programmers, physicists, and Bayesians, many of whom view probability as subjective degrees of belief. The challenge is to make the Principal Principle meaningful without it seeming trivial. They have a specific example in mind—a grey box in a library—and want to handle two variants: a Calibration Rival model and a case where information discredits the chance. They also want to avoid quantum mechanics, coins, and dice to prevent misconceptions.

  First, I need to structure the session so that the concept of objective chance is established before introducing the principle. The grey box example is key because it provides empirical evidence without revealing determinism. Starting with observed frequencies and moving to chance as a separate concept can help the audience see why the principle isn't just about matching beliefs to frequencies. The Calibration Rival variant should come later to highlight the difference between deferring to chance versus a well-calibrated forecaster.

  The user is concerned about admissibility and how to handle objections that it's just a way to dismiss counterexamples. I should advise introducing the conditional form early, using a specific scenario where the chance is known but new information makes it inadmissible. For instance, if the box's mechanism involves dependencies where the outcome affects future chances, that creates a tension. Showing this after stating the principle helps the audience grasp why admissibility is necessary.

  For the physicist who brings up determinism, I should address it during the initial setup by emphasizing that chances are defined within a model, regardless of underlying determinism. The machine-learning person's conflation of chance with model output can be tackled during the Calibration Rival discussion, stressing that chance is not just the best predictor but a different kind of entity. The decision-theory enthusiast's pivot to Sleeping Beauty should be deferred explicitly and redirected to the core example.

  The check question at the end needs to test understanding of admissibility. A strong answer would involve recognizing that inadmissible information is that which is screened off by the chance itself. Near-misses might confuse it with irrelevant information or conflate it with model calibration.

  Refusing to cover metaphysics, amended principles, or Sleeping Beauty is smart. Stating these boundaries upfront saves time. As for the takeaway sentence about admissibility, revealing it at the end as a conclusion reinforces the session's progression from setup to insight, making the concept more impactful.
answer: |-
  Here's the session architecture, optimized for your constraints and audience, with explicit rationale for sequencing and handling predictable failures:

  ### **Core Dependency Structure & Sequencing**
  1.  **Groundwork: The Grey Box & Observed Regularity (15 min)**
      *   *What:* Describe the grey box, its log showing near-perfect calibration over 3 years. Emphasize the *empirical pattern* without committing to mechanism.
      *   *Why:* Establishes the *phenomenon* the Principal Principle (PP) aims to capture. It moves the audience from "subjective degree of belief" to observing something *externally stable and predictive*. Avoids metaphysics by focusing on observation. **Key:** Highlight the *robustness* and *independence* of the pattern from any particular observer's beliefs or actions.
      *   *Carries:* The intuition that *something objective* is being measured/reported, distinct from my current belief.
      *   *Failure Point:* Physicist/Determinist: "But if it's deterministic, the chance is 0 or 1!" *Head-off:* Concede determinism *might* be true, but the *empirical pattern exists*. PP constrains beliefs *about outcomes* **given** the proposition "Chance(X)=p". We're building rules for belief under *uncertainty about mechanisms*. (Concede the metaphysical possibility, deflect to epistemic constraint).

  2.  **Introducing "Chance" as a Propositional Attitude (15 min)**
      *   *What:* Formalize "Chance(X_t = flash) = p_t" as a *proposition* we can condition on (based on the screen display at t). Distinguish sharply:
          *   `C(X_t | Background Info)` (My credence *now*)
          *   `C(X_t | Background Info *AND* Chance(X_t)=p_t)` (My credence *if I knew the chance proposition*)
      *   *Why:* **Critical Setup.** Prevents "probabilities are just beliefs" collapse. Makes the conditional form of PP *necessary* and visible *before* stating it. Shows PP isn't about my current belief matching p_t, but about how my belief *changes* upon learning the chance proposition. **Introduce admissibility implicitly here:** Background Info is "generally admissible" *until shown otherwise*. What happens if I learn *more* than just Chance(X_t)=p_t?
      *   *Carries:* The distinction between current belief and belief *conditional on a specific chance fact*.
      *   *Failure Point:* ML Person: "But `Chance(X_t)=p_t` just *means* the best calibrated forecast!" *Head-off:* Point to the *independence* of the grey box output – it's not *derived* from past data like a model, it's *given*. PP applies to *this specific proposition*, whatever its source. We'll compare to models soon. (Concede models are useful, insist PP concerns a *specific type* of proposition).

  3.  **State the Principal Principle (Naively) (10 min)**
      *   *What:* "If at time t you learn that Chance(X_t) = p_t, *and nothing else*, then your credence in X_t should be p_t: C(X_t | Chance(X_t)=p_t & K_t) = p_t." Define K_t as "admissible background information at t". Acknowledge K_t is vague.
      *   *Why:* State it simply *after* establishing the conditional form. The vagueness of K_t primes the audience for the need to refine it. The core intuition (match credence to known chance) is now explicit.
      *   *Carries:* The basic normative impulse.

  4.  **Introducing Tension: The Dependent Machine Variant (20 min)**
      *   *What:* Describe the *second* machine: Its screen *tomorrow* depends on whether the lens flashed *today*. Pose the scenario: **Today (T)**, screen says Chance(Flash_T) = 0.7. BUT, I *also* know the dependency rule (e.g., "if flash today, chance tomorrow=0.1; if no flash, chance tomorrow=0.9"). What should my credence in Flash_T be? If I condition *only* on Chance(Flash_T)=0.7, PP says C(Flash_T) = 0.7. But I know the dependency! If Flash_T happens, it strongly affects my belief about *tomorrow's* chance.
      *   *Why:* **Forces admissibility.** This creates a visceral conflict. Using the dependency info *feels* rational, but naive PP forbids it. **This is where "inadmissibility" lands.** Explain: The dependency info is *about the outcome* (Flash_T) in a way that relates to *other* chance facts. It's "inadmissible" for X_t because it gives me information *relevant to X_t* **over and above** what is summarized in Chance(X_t)=p_t itself. It doesn't *discredit* p_t; it gives me extra evidence *conditional* on p_t.
      *   *Carries:* The *necessity* and *content* of the admissibility clause. PP doesn't say "ignore everything"; it says "ignore info already accounted for in the chance value or irrelevant *except* via the outcome".
      *   *Handling "Rescue" Objection:** "You're just defining away counterexamples!" **Reframe immediately:** "No. We *saw* the conflict. Admissibility isn't a rescue; it's *diagnosing why the conflict arises*. Naive PP was *too simple* because it ignored that some information *undermines the rational force* of deferring to `Chance(X_t)=p_t` *for belief about X_t*. The grey box log gives us reason to think `Chance(X_t)=p_t` is a *special* kind of information worth deferring to *unless* you have specific information that bypasses it. The dependency rule is exactly that kind of bypassing information." **Concede:** Defining admissibility precisely *is hard*, but we've identified a clear case where information *should* move you away from p_t, even knowing p_t. (Bite the bullet that full definition is hard, point to clear paradigm cases).

  5.  **Contrasting Deference: The Calibration Rival Variant (20 min)**
      *   *What:* Introduce the black-box model trained on the log, better calibrated over the last 6 months than the grey box display. If the screen *today* says 0.3, but the model (using current data) outputs 0.35, what should my credence be? Can I use the model output?
      *   *Why:* **Forces the gap between chance and best estimate.** PP says: Defer to the grey box proposition `Chance(X_t)=0.3` *if that's what you condition on and your info is admissible*. Conditioning *on the model output* is different! The model is giving you a *different proposition*: "The best current *estimate* of the chance (or frequency) is 0.35." PP doesn't directly apply to *that*. You might rationally defer to the *model* instead of the *grey box's claim* if you think the model is more reliable *about the chance*, but that's **expert deference**, not PP. PP is about deference to a *specific kind* of proposition claiming *objective chance*.
      *   *Carries:* PP governs deference to *chance propositions*, not to the best calibrated forecaster. Chance is not *defined* as the best forecast.
      *   *Failure Point:* ML Person redux: "But 'objective chance' *is* just the limit of the best possible forecast!" *Head-off:* The grey box *claims* to report it *directly*, not as a forecast limit. PP tells us how to respond *if we accept that claim as true*. Whether the claim *is* true is separate (metaphysics). PP is a norm for when you *do* accept such propositions. (Concede the connection to forecasting limits is deep, but insist PP operates at the *propositional* level we defined).

  6.  **Refine PP & Admissibility (15 min)**
      *   *What:* Restate PP with admissibility spotlighted: "C(X_t | Chance(X_t)=p_t & E) = p_t, **provided that E is admissible**." Admissible information: Information whose impact on X_t is *entirely mediated* by its impact on the chance proposition itself, or "historical" information up to t. Inadmissible: Information about future chances contingent on X_t (like the dependency), or "inside information" directly about X_t's outcome mechanism. The dependency rule is the canonical example.
      *   *Why:* Solidifies the lesson from the tension. Admissibility is the *engine* of PP. State the takeaway sentence: **"The whole content of the Principal Principle lives in its admissibility clause; the real question is which information is permitted to move you away from the chance."**
      *   *Carries:* The refined principle and the centrality of admissibility.

  7.  **Q&A / Discussion Seeds (15 min)**
      *   *What:* Open floor. Plant seeds: "Could the *past performance* of the grey box be inadmissible?" (No, generally admissible history). "What if I peeked inside the box?" (Likely inadmissible insider info!). "Does PP apply to the *model's output*?" (Only if you interpret its output *as* a chance proposition, then PP applies conditionally, but is it *really* a chance claim?).

  ### **Misconception Map & Defense**
  1.  **The Determinist Physicist:**
      *   *Strong Point:* "Under determinism, all chances are 0 or 1. PP either tells me nothing (I already know the outcome) or tells me to have credence 1, which is trivial."
      *   *Moment to Head-off:** Step 1 (Groundwork) & Step 2 (Propositional Attitude). Explicitly during Step 1 concession.
      *   *Strategy:** **Concede the metaphysical point.** Emphasize PP is an *epistemic norm* for agents *lacking* that deterministic knowledge. "Given the *proposition* `Chance(X_t)=0.7` (which you might learn from the grey box screen), and lacking the god's-eye deterministic view, PP constrains your *belief about the outcome* X_t. It's a rule for reasoning under *uncertainty about the microstate/outcome*, even if the macrostate/chance-proposition is known. The grey box log shows this norm leads to well-calibrated beliefs."

  2.  **The Machine-Learning Person:**
      *   *Strong Point:* "Chance is just the prediction of the best possible model. PP is just expert deference dressed up."
      *   *Moment to Head-off:** Step 2 (defining the proposition) & Step 5 (Calibration Rival). Crucially during Step 5 discussion.
      *   *Strategy:** **Distinguish proposition type.** Concede that *if* you define chance that way, PP might collapse into expert deference *for that specific definition*. But PP is traditionally about propositions like the grey box output, which *claim* to report an objective feature *before* the event, independent of forecasting models. The Calibration Rival shows they can come apart empirically. PP tells you how to *use the specific proposition* `Chance(X_t)=p_t` if you accept it. Whether the best model *also* outputs p_t is a separate question. (Concede potential overlap, insist on distinct conceptual starting points).

  3.  **The Decision-Theory Person (Sleeping Beauty):**
      *   *Strong Point:* "PP seems to conflict with thirder/halfer positions in Sleeping Beauty. How do we resolve this?"
      *   *Moment to Head-off:** **Preemptively.** At the very start or during Q&A boundaries. Or when they raise it.
      *   *Strategy:** **Firm Refusal.** "That's an excellent but *deeply* complex debate involving self-locating uncertainty and centered worlds, far beyond our scope tonight. PP, as we're presenting it, governs credence in *uncentered* propositions like 'the lens flashes *today*' based on uncentered chance propositions. Applying it to SB requires significant extensions and is hotly contested. We're focusing on the core, non-self-locating case. Let's discuss SB offline or at a dedicated session." (Concede *nothing* about SB during this session. Hold the boundary firmly).

  ### **The Check Question**
  *   **Question:** "The screen *today* says Chance(Flash_Today) = 0.4. I *also* know, for certain, a specific dependency: if Flash_Today happens, then Chance(Flash_Tomorrow) = 0.1; if Flash_Today doesn't happen, Chance(Flash_Tomorrow) = 0.9. According to the Principal Principle, what should my credence be that Flash_Today happens? Why?"
  *   **Successful Answer:** "It should be 0.4. The dependency information tells me *how* today's outcome affects *tomorrow's* chance. But according to PP, that information is *inadmissible* for forming my credence *about Flash_Today itself*. PP says that *conditional on knowing* Chance(Flash_Today)=0.4 and having only generally admissible background info (which doesn't include this specific future dependency rule), my credence must be 0.4. The dependency rule is information relevant to Flash_Today *only* through its connection to *future* chances contingent on today's outcome, which PP tells me to ignore for *today's* credence."
  *   **Near-Misses:**
      *   *Frequency/Model Conflation:* "0.4, because that's what the screen says and it's been calibrated." (Correct answer, wrong reason - misses admissibility).
      *   *Ignores Admissibility:* "0.4, because PP says match the chance." (Too vague, doesn't address the dependency info).
      *   *Overthinks Determinism:* "Well, if it's deterministic, it could be 0 or 1..." (Misses the conditional/epistemic point of PP).
      *   *Confuses with Impact:* "It should be something else, because the outcome affects tomorrow!" (Fails to grasp that PP *forbids* using that specific info for *today's* credence conditional on knowing today's chance).

  ### **What to Refuse to Cover & When to Say It**
  *   **Your List (Correct):** Metaphysics of Laws, Amended Principles (e.g., Big PP), Sleeping Beauty Literature, Existence of Chances.
  *   **Add:**
      *   **The "Best System" Analysis of Chance (MRL):** Mention it exists as a candidate metaphysics if pressed, but state it's out of scope for the *normative* principle PP.
      *   **Quantifying over Chance Setups:** Avoid "For all chance setups..." generalizations. Stick to the paradigm grey box case. If asked, say "PP is proposed as a general norm, but we're focusing on understanding it in this clear instance."
      *   **Full Formal Definition of Admissibility:** State upfront (during Step 3 or Step 6) that providing a complete, uncontroversial definition is beyond this session; we're identifying core intuitions and clear cases (like the dependency rule).
  *   **When to State Boundaries:**
      *   **Upfront (Minute 1):** "Tonight's focus: understanding the *core structure* and *normative force* of the Principal Principle using a specific example. We *won't* cover: the metaphysics of laws or chance existence, quantum mechanics, Sleeping Beauty, or advanced variations. Our goal is to grasp why it's more than 'match your beliefs to the probability'."
      *   **Reinforce as Needed:** When a tangent arises (especially SB or determinism), politely but firmly redirect: "As I mentioned at the start, that's beyond our scope tonight. Let's focus on the grey box example to understand the core principle first."

  ### **Sequencing the Takeaway Sentence: Withhold Until Step 6**
  *   **Argue for Withholding:** Revealing "The whole content lives in the admissibility clause" upfront is premature and risks sounding like an empty slogan or a confusing abstraction. The audience needs to:
      1.  Feel the intuitive pull of matching credence to chance (Steps 1-3).
      2.  Experience the *tension* created by the dependency rule (Step 4) – this creates the *need* for admissibility.
      3.  See the *contrast* with expert deference (Step 5) – reinforcing that PP is about a specific proposition.
      *   **Landing the Punchline:** Only after this journey does the takeaway sentence provide the satisfying *explanation* for the tension they felt and the distinctions they saw. It crystallizes the lesson learned from wrestling with the variants. Handing it out early robs it of its explanatory power and makes admissibility seem like a technicality rather than the core insight resolving the central puzzle. Let it land as the earned conclusion.

  This structure builds the concept step-by-step, forces the key distinctions through the variants, preempts major tangents, and delivers the core insight about admissibility as the satisfying resolution to the tensions introduced. Good luck!
