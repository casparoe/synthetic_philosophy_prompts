  ### Units of Selection: A Decision Tree for Position Identification  
  *This handout helps you identify your position in the units of selection debate based on your answers to questions about concrete cases. Start at Node 1 and follow the branches by answering questions. Terms are defined when first used. Each leaf names a position, its most awkward commitment (the "price" you must accept), and notes on unresolved collapses or empty regions.*

  **Key Definitions**  
  - **Replicator**: An entity (e.g., gene, cultural variant) that passes on its structure with high fidelity during replication.  
  - **Interactor**: An entity (e.g., organism, group) that interacts with its environment as a cohesive unit, causing differential replication of replicators.  
  - **Vehicle**: A structure (e.g., organism) that carries replicators but does not itself replicate; its properties are reducible to lower-level interactions.  
  - **Trait group**: A transient group whose composition affects member fitness but does not form a lineage (no parent-offspring inheritance).  
  - **Lineage**: A parent-offspring sequence with heritable variation (e.g., species, clade).  
  - **Heritability at a level**: The degree to which offspring resemble parents for a trait at that level (e.g., group heritability means productive groups produce similar groups).  
  - **MLS1 (Multilevel Selection 1)**: Selection *of* groups based on group properties (e.g., productivity), affecting gene frequencies without group-level adaptations.  
  - **MLS2 (Multilevel Selection 2)**: Selection *of* group-level traits, where groups are persistent, reproducing lineages with adaptations.  
  - **Adaptation**: A trait shaped by natural selection for a function; "design" refers to what it benefits.  

  ---

  ### Decision Tree  
  *Answer each question based on your interpretation of the cases. Proceed to the next node or leaf as indicated.*  

  1. **Are you asking about how gene frequencies change ("bookkeeping") or what adaptations are "for" ("design")?**  
     - **A. Bookkeeping** → Node 2  
     - **B. Design** → Node 8  

  #### Bookkeeping Branch  
  2. **Can gene-frequency change in cases like the *segregation distorter allele* (lowers individual fertility but spreads via meiotic drive) be fully explained by individual-level fitness?**  
     *Individual-level fitness: Reproductive success of an organism.*  
     - **A. No, individual fitness is insufficient** → Node 3  
     - **B. Yes, by redefining fitness (e.g., inclusive fitness)** → Leaf 1  

  3. **Can all gene-frequency changes (e.g., *asexual lineage with chromosomal inversion*—genome inherited as one block) be reduced to gene-level selection?**  
     *Gene-level selection: Genes as replicators with fitness differences.*  
     - **A. Yes, genes are always fundamental** → Node 4  
     - **B. No, higher levels are sometimes necessary** → Node 5  

  4. **Are higher-level entities (e.g., organisms, groups) interactors or mere vehicles?**  
     *Interactor: Cohesive unit causing differential replication; Vehicle: Reducible carrier.*  
     - **A. Mere vehicles** → Leaf 2  
     - **B. Interactors in their own right** → Leaf 3  

  5. **In the *founder groups* case (transient groups colonize patches, affect productivity, then disperse), is gene-frequency change due to group sorting: selection or drift?**  
     *Drift: Random change; Selection: Non-random sorting based on traits.*  
     - **A. Selection (groups are units)** → Node 6  
     - **B. Drift (no heritable group traits)** → Leaf 1  

  6. **Does selection at a level require non-reducible traits (e.g., *colonial marine invertebrate chimera*—genotype overgrows partner, harming group)?**  
     *Non-reducible trait: A property not explainable by lower-level traits alone.*  
     - **A. Yes (e.g., group traits must be emergent)** → Node 7  
     - **B. No** → Leaf 4  

  7. **In the *sterile worker insect* case, is group selection MLS1 or MLS2?**  
     *MLS1: Groups sorted based on properties; MLS2: Groups reproduce as lineages with adaptations.*  
     - **A. MLS1 (groups are temporary, no group reproduction)** → Leaf 5  
     - **B. MLS2 (groups are persistent lineages)** → Leaf 6  

  #### Design Branch  
  8. **In the *sterile worker insect* case, is the adaptation "for" the benefit of the group or the gene?**  
     - **A. Gene (via inclusive fitness)** → Leaf 1  
     - **B. Group** → Node 9  

  9. **Can cultural variants (e.g., *costly food taboo*—spreads by group competition and prestige imitation) be units of selection like genes?**  
     - **A. Yes, as replicators** → Leaf 7  
     - **B. No, or only by analogy** → Node 10  

  10. **Can a trait with no organismal fitness effects (e.g., *lineage-level trait*—affects speciation/extinction) be an adaptation?**  
      - **A. Yes (e.g., for species benefit)** → Leaf 8  
      - **B. No (only organism-level)** → Leaf 1  

  ---

  ### Leaves (Positions)  
  *Each leaf includes the position, its most awkward commitment, and notes on collapses or empty regions.*  

  1. **Kin Selection / Inclusive Fitness**  
     - *Awkward commitment*: Must accept that altruism (e.g., sterile worker) evolves solely via indirect gene benefits, even when group structure is apparent.  
     - *Collapse with Leaf 5*: Under kinship-structured groups, kin selection and MLS1 are substantively identical (same mathematics).  

  2. **Strict Gene Selectionism (Vehicles View)**  
     - *Awkward commitment*: Must treat organism/group traits (e.g., in the *gene drive* case) as reducible to gene interactions, even when they cause population extinction.  
     - *Collapse with Leaf 3*: The difference is verbal; both agree genes are replicators, but Leaf 3 grants interactors "real" causal roles.  

  3. **Weaker Genic Selectionism (Representational Claim)**  
     - *Awkward commitment*: Must deny that interactors (e.g., *transmissible cancer cells*) can be units without gene-level replication, even if they show heritable variation.  

  4. **Trait-Group Selection (MLS1)**  
     - *Awkward commitment*: Must count one-off sorting (e.g., *founder groups*) as selection, blurring the line with drift.  
     - *Empty region*: MLS1 + irreducible traits is incoherent; irreducible traits require lineages (MLS2).  

  5. **Multilevel Selection (MLS1 Variant)**  
     - *Awkward commitment*: Must accept transient groups as units without heritability (e.g., *founder groups*), risking conflation with drift.  
     - *Collapse with Leaf 1*: When groups are kin-based, identical to kin selection.  

  6. **Group-as-Organism (MLS2 / Major-Transitions View)**  
     - *Awkward commitment*: Must explain within-group conflict (e.g., *chimera* case) as pathological, not adaptive.  
     - *Empty region*: MLS2 + trait irreducibility is occupied, but MLS2 + cultural units is rare (covered in Leaf 7).  

  7. **Cultural Group Selection**  
     - *Awkward commitment*: Must treat cultural variants (e.g., *food taboo*) as replicators akin to genes, despite horizontal transmission.  

  8. **Species or Clade-Level Selection**  
     - *Awkward commitment*: Must accept species as units of selection (e.g., *lineage-level trait*), even without organismal fitness effects.  

  ---

  ### Notes on Logical Space  
  - **Empty Regions**:  
    - *Bookkeeping gene-level + Design group-benefit*: Possible (e.g., genes are units, but adaptations benefit groups), but rare; seen as unattractive due to tension between gene-centric accounting and group-focused design.  
    - *MLS2 + Trait groups*: Incoherent; MLS2 requires lineages, but trait groups are transient.  
  - **Unresolved Collapses**:  
    - *Leaf 1 (Kin) vs. Leaf 5 (MLS1)*: Substantive collapse under kinship-structured groups (same evolutionary dynamics).  
    - *Leaf 2 (Strict Gene) vs. Leaf 3 (Weaker Gene)*: Verbal collapse; both handle cases like *chromosomal inversion* as gene-level, differing only in whether interactors are "real."  
  - **Tree Limitations**:  
    - Cannot separate *Leaf 5 (MLS1)* and *Leaf 4 (Trait-Group)*; both treat groups as selectable without lineages (verbal difference).  
    - *Gene drive* and *transmissible cancer* cases are handled in gene/cell-level leaves (e.g., Leaf 2, 3); *chimera* case tests irreducibility (Node 6).
