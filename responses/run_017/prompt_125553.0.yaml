  So: what is a "possible future" in my terms, and does "there will be a sea battle" map to A-eventually-battle, E-eventually-battle, or neither, and why is neither obviously right? Give me the fatalist argument in A/E form and show where it would have to be equivocating. Then the part I actually care about: the residue report. My hunches are (1) my logic has no way to pick out the actual execution from here — only "all" and "some" — so the second way out may be literally unsayable unless I add a distinguished actual branch, and (2) my whole framework is tenseless, "tomorrow" is just an index tick, so the worry that the future is "open" in a way the past isnt might not get answered but just fail to be formulable. Are those right, and what else doesnt survive? Please dont quietly import my framework's assumptions and call the result a translation — if something only works because my semantics treats all branches as equally real, flag it. And at the end: if openness of the future turns out to be unstatable in a framework that otherwise handles branching fine, does that count against my framework or against the philosophers worry?
