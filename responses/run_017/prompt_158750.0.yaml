  ### Kelly-Based Decision Procedure for Perpetual Scholarship Fund

  Here's a step-by-step decision procedure tailored to your committee's needs. It maximizes long-term geometric growth while accounting for your constraints: perpetual horizon, 5% annual payout, probability uncertainty, correlations, and liquidity needs. The process is designed for 90-minute meetings with clear stopping points and values-based decision flags.

  ---

  ### **Core Framework: Why Not Just Expected Return?**
  **To the board president:**  
  *"Expected return ignores compounding risk and potential ruin. Geometric mean optimization prioritizes survival and perpetual growth by penalizing volatility that erodes capital long-term. A +100%/-50% bet has positive expected return but guarantees eventual bankruptcy—unacceptable for an endowment."*

  ---

  ### **Decision Procedure: 7 Key Questions**
  *(Run sequentially—stop if any answer fails criteria)*

  1. **Does this opportunity meet our mission lockstep?**  
     - *Good enough:* Explicit alignment with scholarship purpose; no legal/ethical red flags.  
     - *Stop if:* Mission misalignment or reputational risk identified.  
     - *Values call:* Mission-fit judgment when tradeoffs exist.

  2. **What’s the *minimum* probability of success (p) and payoff (b) we can defend?**  
     - *Method:* For binary outcomes (e.g., 3x-or-bust), require:
       - Success return (e.g., 3x = +200% → `b = 2`)  
       - Failure return (e.g., lose 80% → `a = 0.8`)  
       - Conservative `p` estimate (e.g., "at least 30%")  
     - *Good enough:* Quantifiable range (even if wide). Use 10th-percentile estimates if distributions are vague.  
     - *Stop if:* `p < 10%` or failure loss >90% of capital.  
     - *Formula:* Standalone Kelly fraction:  
       `f_isolated = max( [p/a - (1-p)/b] , 0 )`  
       *(e.g., p=30%, a=0.8, b=2 → f = [0.3/0.8 - 0.7/2] = 0.375 - 0.35 = 0.025)*

  3. **How correlated is this with our core portfolio?**  
     - *Method:* Estimate correlation (ρ) to 60/40 portfolio:  
       - Low (ρ ≈ 0.3), Medium (ρ ≈ 0.6), High (ρ ≈ 0.9)  
     - *Adjustment:* Reduce position size: `f_adjusted = f_isolated × (1 - ρ)`  
       *(e.g., ρ=0.6 → f = 0.025 × 0.4 = 0.01)*  
     - *Why?* Protects from overexposure to systemic risks.

  4. **Can we cover 3 years of payouts without this investment?**  
     - *Requirement:* Liquid reserves ≥ $1.35M (3 × 5% × $9M) post-investment.  
     - *Good enough:* Cash/bonds coverable within 90 days.  
     - *Stop if:* Investment breaches liquidity floor.  
     - *Values call:* Whether to reduce payout if liquidity is impaired.

  5. **What’s the maximum capital exposure?**  
     - *Cap:* `min( f_adjusted × Fund Size , Liquid Reserves - $1.35M )`  
     - *Rule:* Never exceed 5% of fund for single illiquid bet.  
     - *Output:* Maximum allowable investment ($).

  6. **Does it improve our baseline geometric growth?**  
     - *Baseline:* Current portfolio’s projected growth (see Annual Allocation below).  
     - *Good enough:* Expected log return > current baseline.  
     - *Stop if:* Drags long-term growth below 5% in conservative scenarios.

  7. **Can we tolerate 5+ years of underperformance?**  
     - *Stress test:* Simulate 2008-style crash + 50% failure case.  
     - *Stop if:* Fund drops >35% or payouts at risk.  
     - *Values call:* Volatility tolerance for scholarship stability.

  ---

  ### **Blind Spots of Geometric Growth Maximization**
  - **Volatility of payouts:** Kelly ignores budget stability (scholarships drop if fund crashes).  
  - **Tail risks:** Underestimates black swans (e.g., pandemics, hyperinflation).  
  - **Time horizon mismatch:** Perpetual ≠ infinite; 30-year horizons often suffice.  
  - **Non-financial costs:** Staff time, opportunity cost, mission drift.  

  ---

  ### **Case Applications**

  #### **1. Annual 60/40 Allocation**
  - **Q1:** Mission-aligned? → *Yes*.  
  - **Q2:** Estimate returns/ranges:  
    - Equities: 7% ±4% (σ=15%)  
    - Bonds: 3% ±2% (σ=5%)  
    - Correlation (ρ): -0.1 (historical)  
  - **Q3:** Correlation adjustment → *n/a (core portfolio)*.  
  - **Q4:** Liquidity → *60/40 ensures coverage*.  
  - **Q5:** Use Merton’s formula for geometric growth:  
    - `f* = (μ - r) / σ²` → *f_stocks = (7% - 3%) / (15%)² = 1.78*  
    - *But capped at 100% equities. Adjusted for 5% payout: target 7% growth*.  
  - **Q6:** Base growth = 5.2% (60/40) vs. 6.1% (80/20) → *Optimal: 80/20*.  
  - **Q7:** 2008 stress: -30% vs. -40% → *Acceptable with liquidity buffer*.  
  - **Verdict:** Shift to **80/20**; monitor inflation risk.

  #### **2. 3x-or-Bust Program Investment ($1M ask)**
  - **Q1:** Mission-aligned? → *Yes (education initiative)*.  
  - **Q2:** Estimates:  
    - Success (30% prob): 3x return → `b = 2`  
    - Failure (70% prob): 80% loss → `a = 0.8`  
    - `f_isolated = [0.3/0.8 - 0.7/2] = 0.025`  
  - **Q3:** Correlation: Medium (ρ=0.6) → `f_adjusted = 0.025 × 0.4 = 0.01`.  
  - **Q4:** Liquid reserves pre-investment = $3.6M (40% of $9M). Post-investment: $2.6M > $1.35M → *OK*.  
  - **Q5:** Max exposure = min(0.01 × $9M = $90k, $3.6M - $1.35M = $2.25M) = **$90k**.  
  - **Q6:** Baseline growth = 5.2%. With $90k bet:  
    - Expected log return = 0.3×log(1+2×0.01) + 0.7×log(1-0.8×0.01) ≈ +0.0004 → *Negligible gain*.  
  - **Q7:** 2008 + failure: Fund drops to $5.5M → *Payouts at risk*.  
  - **Verdict:** **Reject** (fails Q6/Q7). *Rationale: Low growth impact, high downside risk. Kelly sizing too small for effort.*  

  #### **3. Donor Match Challenge (90-day expiry)**
  - **Q1:** Mission-aligned? → *Yes (leverages donations)*.  
  - **Q2:** Estimates:  
    - Success (70%): $0.5M donor cash → $1M new capital (b = 1.0, since no corpus risk)  
    - Failure (30%): Lose $50k staff costs (a = 0.0056)  
    - `f_isolated = [0.7/0.0056 - 0.3/1] ≈ 125` (capped at 100%)  
  - **Q3:** Correlation: Low (ρ=0.1) → `f_adjusted = 100% × 0.9 = 90%`.  
  - **Q4:** Liquid reserves > $1.35M post-$50k spend → *OK*.  
  - **Q5:** Max exposure = $50k (staff cost).  
  - **Q6:** Expected log return = 0.7×log(1+1.0×0.0056) + 0.3×log(1-0.0056) ≈ +0.0038 → *Boosts growth*.  
  - **Q7:** Failure worst-case: -0.5% impact → *Benign*.  
  - **Verdict:** **Approve $50k**. *Rationale: Asymmetric upside, minimal downside.*  

  ---

  ### **Why You’ll Hate One Answer (The 3x-or-Bust Case)**
  The procedure rejects the director’s pet project despite emotional appeal. Kelly sizing reveals:
  - Position too small ($90k) to move the needle.  
  - Failure correlation amplifies portfolio risk.  
  - Volatility could jeopardize payouts.  

  *This is the procedure working—it prioritizes sustainability over heroics.*

  ---

  ### **Execution Notes**
  - **Probability ranges:** Use 10th/90th percentiles. If range is wide (e.g., 30–60% prob), run steps twice (low/high) and decide conservatively.  
  - **Correlations:** Default to ρ=0.6 if unknown; historical data suffices.  
  - **Time savings:** Pre-calculate baseline growth (Q6) between meetings.  
  - **Output:** One-pager per proposal with: 
    ```
    [✔] Q1: Mission-fit  
    [✔] Q2: f_isolated = X%  
    [✔] Q3: f_adjusted = Y%  
    [☐] Q4: Liquidity post-deal: $Z  
    ...  
    RECOMMENDATION: [Approve $Amount] or [Reject]
    ``` 

  This system embeds discipline while reserving space for values-based debates. It protects the fund from irreversible mistakes and leverages Kelly’s math without requiring formulas in the room.
