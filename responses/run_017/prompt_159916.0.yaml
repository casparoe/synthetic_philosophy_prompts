  Third, the twins living as one person. Does this support psychological continuity or is it a reductio? The secrecy is crucial. Their success depends on hiding the duality, which implies that social identity relies on singularity. Parfit might see this as proof that identity isn't fundamental, but the film presents it as a burden, perhaps criticizing the psychological view.

