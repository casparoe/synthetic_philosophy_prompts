answer: |-
  **The stalemate arises from incompatible axiomatic commitments masquerading as intuitive disagreements, with progress requiring formal disambiguation of welfare scale types and abandonment of universal separability.** 

  Your hypotheses are largely correct but underspecified. The measurement-theoretic conflict is fundamental: totalism requires a ratio scale (non-existence as absolute zero), while averagism and critical-level theories require interval scales (arbitrary zero). This means proponents aren't evaluating the same mathematical object—welfare vectors under affine transformations vs. linear ones. Consequently, "intuitions" about cases are predetermined by tacit scale assumptions. For example, the claim that adding a below-average life worsens outcomes presupposes an interval scale where the average is fixed; under ratio scales, adding positive welfare units always improves the total. Disputes over case chains are circular because they embed these assumptions.

  The structural point is equally critical. Transitivity + unrestricted separability (where the value of disjoint populations is additive) + Pareto implies the repugnant conclusion. Person-affecting views avoid this by restricting separability (e.g., rejecting "same people" independence), but at the cost of non-identity problems. The chains are ineffective because they illustrate inevitable formal implications, not testable intuitions. Resistance occurs when axioms feel non-negotiable: e.g., rejecting transitivity seems irrational, while rejecting separability feels morally arbitrary.

  The temporal twin is **not a distraction**—it exposes the core formal conflict. In a person-moment framework, interpersonal and intrapersonal aggregation are isomorphic: both reduce to summing welfare units across spatiotemporal locations. If one accepts additivity across time (e.g., for prudence), rejecting it across persons requires justifying why personal identity boundaries break separability. No principled distinction exists within welfarist frameworks that reduce value to experiential units. Those who accept the temporal twin but reject the interpersonal conclusion implicitly endorse a non-separable, person-centered axiology but lack the formalism to articulate it.

  ### What progress demands:
  1.  **Settle the scale type:** Resolve whether welfare has a meaningful zero (e.g., via empirical psychology of hedonic measurement). If not, ratio-scale-dependent theories (totalism, some critical-level) collapse.
  2.  **Axiomatic trade-offs:** Produce impossibility theorems showing precisely which combinations of transitivity, separability, Pareto, and scale invariance are mutually incompatible. This would force explicit axiom abandonment.
  3.  **Decouple aggregation methods:** Develop a framework where interpersonal and intrapersonal aggregation can coherently differ—e.g., by making moral weight depend on personal identity boundaries without ad hoc asymmetry. This might require non-welfarist elements.
  4.  **Shift from outcomes to decisions:** Reconceptualize the problem as generating choice rules under uncertainty or bounded rationality, sidestepping the need for a complete transitive ordering of outcomes.

  Without these steps, the debate remains a clash of hidden premises, where "intuitions" are epiphenomenal to unstated formal commitments.
