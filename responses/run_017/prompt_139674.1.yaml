answer: |-
  Right, let's cut through this. Your argument holds - your friend's the one missing the teeth of the handicap principle. The core isn't about *who pays the bill*, it's about the **differential net burden imposed on the sender by the act of signaling.**

  Think of initiation rites. A grueling ritual costs *everyone* effort and pain. But it costs the genuinely committed, tough individual *less* to endure than the weak or uncommitted pretender. The cost isn't transferred *away*; it's differentially *borne*. The Meridian Act works the same way. Yes, the state reimburses the *monetary outlay* upon completion. But the *risk* – the potential to bear that entire cost personally through failure – is a massive, real burden carried solely by the student *from the moment they enroll*. 

  *   **High-Ability/Low-Risk Type:** They see low probability of failure. The expected cost (risk of loss * magnitude of loss) is small. Signing up is a calculated, manageable burden. Completing the degree is relatively "cheap" for them in net cost/risk terms.
  *   **Low-Ability/High-Risk Type:** They face a high probability of catastrophic financial loss. The expected cost is enormous. Enrolling is a terrifying gamble. That looming potential burden makes attempting the credential *prohibitively costly* unless they are delusional or have near-certainty of success (which low-ability types generally don't).

  **The differential cost isn't erased; it's shifted to the *front end* as risk exposure.** The Act doesn't make the credential *free* for all; it makes it *potentially ruinous* for the unqualified while remaining *affordable* for the qualified. It *amplifies* the signal by filtering out low-ability types *before they even start* – only those truly confident (usually rightly) in their ability will shoulder that risk. The completed credential signals "I was so confident I could do this that I risked ruin to try, *and I succeeded*." That's a *stronger* signal than just "I paid tuition."

  **On Waste:** You've nailed the critical confusion. "Waste" is a terrible, misleading shorthand. Zahavi's core is **differential *burden*.** A pure transfer *can* be a burden if it imposes a differential cost relative to the sender's resources or alternatives. Paying $10 million for a hospital wing *burdens* the sender – they no longer have that $10M for other things. The *differential* cost lies in the *relative sacrifice*: it's trivial for a billionaire (weak signal) but crippling for a millionaire (strong signal of commitment/wealth). The *transfer* itself isn't the point; the *reduction in the sender's own resources/opportunities* is. The handicap is the *fitness cost* (financial, opportunity, risk, effort) that is easier for the "honest" type to bear. Burning money is one crude way to impose that cost; a risky investment, a painful ritual, or a massive transfer that depletes *your* reserves are others. The money going to a good cause doesn't negate the *cost to you*.

  **So:** Your argument stands. The Meridian Act preserves, even sharpens, the signaling value through differential risk burden. "Waste" is a red herring; differential *burden* is the engine. Where does the *friend's* argument break? By fixating on the *recipient* of the payment (the university) and ignoring the *sender's* pre-completion risk burden and the differential impact of that burden. The peacock pays with energy, vulnerability, and lost mobility – not cash to a tail-feather vendor. The Meridian student pays with risk exposure and effort. The state just settles the invoice *if* you survive the gauntlet.

  Your turn. Hit me. Where's the flaw *you* see now, or push the waste point harder.
