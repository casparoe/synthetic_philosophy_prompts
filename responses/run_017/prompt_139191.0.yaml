     - 65-75 min: Debrief (explain Lewis's triviality, the premises, and the escape routes).

  Handling Predictable Problems:

  1. Conditional-bet vs. bet-on-conditional conflation: The activity has both, and the stability rule equates them. When the contradiction arises, they see that equating them leads to trouble. The instructor can then say: "We assumed that the conditional bet and the bet on the conditional are the same. But are they?"

  2. Granularity: If a team says, "But 1/4 is not a multiple of 1/6, so we cannot have a proposition D with probability 1/4", the instructor can respond: "Remember, probabilities are numbers between 0 and 1. We are setting the fair price, which can be 1/4. The sample space has six outcomes, but we are not requiring that the probability of D be the measure of a single event? Actually, we are: we assumed D is a proposition. So they are right to be worried! But let's see what happens when we try to assign a truth value to D in each outcome." However, we don't assign truth values until after conditioning. The contradiction will show that D must be the same as C, so it is defined on the outcomes.

  3. Degenerate cases: We avoid by design.

  4. Uneven finishing: The instructor keeps time and moves on. Teams that don't finish get 0 for that round.

  5. D has no truth value when A is false: If a team refuses to set a price for D in Round 0 because of this, the instructor can say: "For the purpose of this game, we are assuming that D is an ordinary proposition that we can bet on. We are testing what happens if we do that." Then in the debrief, we can say that one escape is to deny that.

  Conclusion:

  The activity is designed to lead students through the steps of Lewis's argument without naming it until the end. The collapse is forced by the rules, and the debrief connects the steps to the premises. The escape routes are then discussed, setting the stage for the next weeks.

  Note: The design depends on Lewis's particular argument that conditions on the consequent and its negation. There are other triviality results, but this is the most accessible.

  Final note: The instructor should be prepared for the possibility that a team might find a way to avoid the contradiction by a clever assignment? For example, if they assign D to be true in some outcomes where A is false? But the stability rule after conditioning on C and ¬C forces D to be true whenever C is true and false whenever C is false. And since the sample space is covered, D must be equivalent to C.

  Therefore, no escape within the rules.
answer: |-
  Below is a complete, runnable classroom activity designed to make students experience Lewis's triviality result through a game-like structure. The activity forces them into the contradiction you described, followed by a debrief mapping the collapse to your premises. The design prioritizes engagement, minimal lecture, and a clear path to the problem.

  ---

  ### **Activity: The Coherent Bookmaker Challenge**  
  **Goal**: Teams act as bookmakers setting odds for bets on die rolls. They must maintain coherent prices (no Dutch books) under shifting conditions, leading to an inevitable contradiction.

  ---

  ### **Rules for Participants**  
  *(Handout given to students)*  
  **Setup**:  
  - A fair 6-sided die will be rolled (outcomes 1–6).  
  - **Events**:  
    - **A**: Roll is 1, 2, 3, or 4 (antecedent).  
    - **C**: Roll is 1 (consequent).  
    - **D**: "If A, then C" (the conditional).  
  - **Tickets** (cost = price set by you, pays $1 if true):  
    - **Unconditional ticket**: Buy/sell anytime (e.g., "C occurs").  
    - **Conditional ticket**: "C given A" (payoff: $1 if A and C, $0 if A and ¬C, refund if ¬A).  
    - **D-ticket**: Treats D as a regular proposition ("D is true").  

  **Your Role**:  
  - Teams of 4 (4 teams total). Each team sets prices (probabilities) for tickets.  
  - **House/Referee**: Instructor (not a student), enforces rules and settles bets.  

  **Key Rules**:  
  1. **Initial Prices**: Set fair prices for:  
     - Unconditional tickets: A, C, D.  
     - Conditional ticket: "C given A".  
     - **Stability Constraint**: Price of D must equal price of "C given A" (at all times).  
  2. **Announcements**:  
     - When the referee announces "Condition on [event]," update all prices to conditional probabilities given that event.  
     - Stability Constraint applies to updated prices (e.g., after conditioning, price of D must equal new price of "C given A").  
  3. **Coherence Requirements**:  
     - Prices must satisfy probability axioms (0 ≤ P ≤ 1, P(Ω) = 1, additivity for disjoint events).  
     - No Dutch books: If your prices allow a guaranteed loss, you must adjust.  
  4. **Challenge Rounds**:  
     - **Round 1**: Set initial prices.  
     - **Round 2**: Condition on **C** (roll is 1). Update prices.  
     - **Round 3**: Condition on **¬C** (roll is not 1). Update prices.  
     - **Round 4**: Contradiction revealed.  
  5. **Team Actions Each Round**:  
     - Post prices on a shared board.  
     - May refuse to set a price only if logically impossible (e.g., P(Ω|¬Ω)).  
     - If you cannot comply with rules without violating coherence, raise your hand—but you must justify.  

  **Scoring (Points-Based)**:  
  - Start with 100 points.  
  - **+10 points/round** for coherent prices satisfying all rules.  
  - **-5 points** if referee finds incoherence (Dutch book or axiom violation).  
  - **Bonus 10 points** if your team spots an incoherence before the referee.  
  - *No real money*—points are bragging rights. Highest score wins.  

  ---

  ### **Materials**  
  - Six-sided die (1 per team).  
  - Whiteboard (for posting team prices).  
  - Team handouts: Rules, outcome table (blank for them to fill).  
  - Timer.  

  ---

  ### **Timeline (75 Minutes)**  
  **0–5 min: Introduction (Instructor)**  
  - "Today, you’re bookmakers setting odds. Remember:  
    - A conditional bet on ‘C given A’ is refunded if A doesn’t happen.  
    - D is a regular ticket for ‘If A, then C’.  
    - Rule: Price of D must always equal price of ‘C given A’.  
    - Goal: Avoid guaranteed losses (Dutch books)."  
  - Assign teams (4 students each).  

  **5–20 min: Round 1 (Initial Prices)**  
  - Teams set: P(A), P(C), P(C|A), P(D).  
  - **Enforced stability**: P(D) = P(C|A).  
  - Referee checks:  
    - Correct values: P(A) = 4/6, P(C) = 1/6, P(C|A) = 1/4, P(D) = 1/4.  
    - Deduct points for deviations (e.g., P(D) ≠ 1/4 violates stability).  
  - *Predictable issue*: Teams may set P(D) ≠ 1/4. Referee enforces stability: "Adjust to avoid Dutch book against you."  

  **20–35 min: Round 2 (Condition on C)**  
  - Referee: "Now condition on C: Roll is 1. Update prices."  
  - Teams set: P(A|C), P(C|C), P(C|A∧C), P(D|C).  
  - **Enforced stability**: P(D|C) = P(C|A∧C).  
  - Correct values: P(A|C) = 1, P(C|C) = 1, P(C|A∧C) = 1, P(D|C) = 1.  
  - *Predictable issue*: Students may say D is undefined if A is false (but C is true, so A is true—no issue here). Referee: "We’re conditioning on C, so A is true. Set prices."  

  **35–50 min: Round 3 (Condition on ¬C)**  
  - Referee: "Now condition on ¬C: Roll is not 1. Update prices."  
  - Teams set: P(A|¬C), P(C|¬C), P(C|A∧¬C), P(D|¬C).  
  - **Enforced stability**: P(D|¬C) = P(C|A∧¬C).  
  - Correct values: P(A|¬C) = 3/5, P(C|¬C) = 0, P(C|A∧¬C) = 0, P(D|¬C) = 0.  
  - *Predictable issue*: "D has no truth value when A false!" Referee: "For this game, D is a regular proposition. Set a price or lose points."  

  **50–65 min: Round 4 (Contradiction)**  
  - Referee: "Compare prices:  
    - When C is true (Round 2), D is always true (P(D|C) = 1).  
    - When C is false (Round 3), D is always false (P(D|¬C) = 0).  
    - So D is equivalent to C! Thus, initial P(D) should equal P(C) = 1/6.  
    - But you set P(D) = 1/4 in Round 1. Contradiction!"  
  - Teams see collapse: P(D) cannot be both 1/4 and 1/6.  

  **65–75 min: Debrief (Instructor)**  
  1. **Map to your premises**:  
     - (i) P(C|A) = 1/4: Uncontested (conditional bet).  
     - (ii) P(D) = P(C|A): Enforced by stability.  
     - (iii) D as ordinary proposition: Required to set prices.  
     - (iv) Stability after announcements: Enforced in Rounds 2–3.  
     - (v) Non-degeneracy: P(A∧C) = 1/6 > 0, P(A∧¬C) = 3/6 > 0.  
     - **Collapse**: (iv) forces D ≡ C, so P(D) = P(C) = 1/6, contradicting (ii).  

  2. **The Real Damage**:  
     - **Premise (iii)** is the linchpin. Treating D as an ordinary proposition (with a truth value in all worlds) allows conditioning on C/¬C, forcing D ≡ C.  
     - **Escape routes**:  
       - Reject (iii): D isn’t a proposition (suppositional view). Cost: Conditionals can’t be embedded or bet on unconditionally.  
       - Reject (iv): Stability fails after announcements. Cost: Conditional probabilities become context-dependent.  
       - Reject (ii): P(D) ≠ P(C|A). Cost: No unified account of conditionals.  

  3. **Preview Next Weeks**:  
     - "This collapse is Lewis’s triviality result. Next week: Suppositional view (rejects D as a proposition) and possible-worlds semantics (avoids collapse but at what cost?)."  

  ---

  ### **Predictable Problems & Handling Them**  
  1. **Conditional-bet vs. bet-on-conditional conflation**:  
     - *What happens*: Students treat P(D) as P(C|A) by definition.  
     - *Handle without lecture*: Refuse to let them skip setting separate prices. Enforce stability as a distinct rule.  

  2. **Granularity of the die**:  
     - *What happens*: "P(D)=1/4 isn’t possible with 6 outcomes!"  
     - *Handle*: "Prices are your subjective degrees of belief, not frequencies. Set any real number." (After collapse, note granularity isn’t the issue—D ≡ C is).  

  3. **Degenerate cases (zero-probability antecedents)**:  
     - *What happens*: "What if P(A)=0?"  
     - *Handle*: "Our case is non-degenerate (P(A)>0). We’ll discuss degeneracy later."  

  4. **Uneven finishing times**:  
     - *Handle*: Use a timer. Teams that finish early calculate expected payoffs or check Dutch books for rivals.  

  5. **"D has no truth value when A is false"**:  
     - *What happens*: Teams refuse to set P(D|¬C).  
     - *Handle*: "For this game, you must assign a price (or lose points). We’ll discuss this objection in the debrief."  

  ---

  ### **What the Activity Cannot Do**  
  1. **Manufactured by rules**: Philosophers can reject the stability rule (iv) or treating D as a proposition (iii). The activity shows the cost of accepting them.  
  2. **Limited generality**: A single die roll can’t show collapse for all conditionals in a language. It illustrates the mechanism; generality comes from discussion.  
  3. **Escape routes indistinguishable**: The game doesn’t differentiate between rejecting (ii), (iii), or (iv). The debrief must clarify costs.  
  4. **No gradation in collapse**: The result forces P(C|A) = P(C), but students don’t see this directly—it’s implied by the contradiction.  

  ---

  ### **Design Commitments & Reasoning**  
  - **Why this design?**  
    - Forces hands-on confrontation with the collapse (no abstract proof).  
    - Stability rule (iv) is embedded in "announcements," making it feel natural.  
    - Points system rewards coherence, amplifying frustration when collapse occurs.  

  - **Premise to surrender**: **Premise (iii)** (D as an ordinary proposition) is the most defensible target.  
    - *Cost*: Rejecting it means conditionals can’t be embedded in Boolean operations or unconditionally believed—central to possible-worlds semantics.  

  - **Your Reconstruction Check**:  
    - **Step (iv) clarification**: Your phrasing "in the market conditional on C" is correct. The activity implements this via public announcements.  
    - **Missing premise**: Additivity is assumed (teams must respect P(A) = P(A∧C) + P(A∧¬C)). It’s enforced via Dutch books.  
    - **Under-supported step**: The inference "D and C are the same ticket" relies on conditioning covering all cases (C and ¬C). The activity verifies this in Rounds 2–3.  

  - **Reading of Triviality**:  
    - This follows Lewis’s first triviality result (1976): Conditioning on C/¬C forces the conditional to coincide with the consequent.  
    - It avoids stronger claims (e.g., for all pairs) but sets the stage for generality.  

  ---

  **Final Note**: This activity makes the collapse visceral. Students *feel* the contradiction before labeling it, priming them for your next sessions. Run it tightly, let frustration build, and debrief thoroughly.
