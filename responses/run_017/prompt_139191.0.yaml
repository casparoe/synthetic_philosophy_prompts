  The core argument (as provided by the instructor) is:
  - Setup: Fair die, events: A (roll 1-4), C (roll 1), D (if A then C).
  - Premises:
    (i) The fair price for a conditional bet on C given A is P(C|A) = 1/4 (since P(C|A) = P(roll=1 | roll in {1,2,3,4}) = 1/4).
    (ii) The conditional sentence D is taken to express a proposition with a price, and that price equals the conditional bet price: P(D) = P(C|A) = 1/4.
    (iii) D is an ordinary proposition (can be bet on, negated, conditioned on).
    (iv) Stability: The equation (ii) holds not just initially but also after conditioning on any public announcement E. In particular, after conditioning on C, we have P(D|C) = P(C|A∧C) = 1, and after conditioning on ¬C, we have P(D|¬C) = P(C|A∧¬C) = 0.
    (v) Non-degeneracy: P(A∧C)>0 and P(A∧¬C)>0.

  Then, from (iv), we see that D is equivalent to C (because D pays $1 when C is true and $0 when C is false, regardless of A). So P(D) = P(C) = 1/6, but from (ii) we have P(D)=1/4, contradiction.

  We will design a game that enforces these premises and leads to a contradiction.

  Activity Design:

  Title: "The Conditional Betting Game"

  Materials:
  - A six-sided die (or a simulator, but physical is better for engagement).
  - Play money (or points) for betting.
  - Whiteboard or shared document to record the market prices (initially and after conditioning).
  - Handouts with rules and record sheets for teams.

  Roles:
  - Students: Divided into teams of 4 (so 4 teams). Each team acts as a bookmaker setting prices for bets and also as bettors (but in this activity, the focus is on setting coherent prices).
