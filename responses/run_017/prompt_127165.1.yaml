prompt: |-
  I'm in the third year of a PhD on moral worth — the chapter I'm currently writing turns on whether worth is best understood as a fact about how an action is explained or as a fact about what the agent takes herself to be doing — and I could use some help predicting how my own supervisor will rule on two cases, because about nine hundred words of my chapter are hostage to the answer. She has given me verdicts on seven cases over the past two years, always crisply and always consistently, and I've written them up below more or less as she gave them to me. Ana runs a lost-property desk and returns a wallet full of cash because the five-star reviews are worth more to her than the money, and she would have kept it had no one been able to trace it: no worth. Ben visits an old friend in hospital purely out of affection, never entertaining a thought of duty, and would have visited even if visiting had been pointless: worth, and not diminished by the absence of duty. Cleo helps a colleague she has been brought up to despise, is wretched about it and believes as she does it that she is betraying her own community's code, but whose attention and effort are entirely governed by the colleague's predicament: worth, and she said more of it than Ben's if anything. Eve keeps a burdensome promise because it was a promise, while also knowing her reputation hangs on it and admitting she'd have kept it for the reputation alone: worth, but thinner than Cleo's. Femi intends to return a wallet and has it knocked out of his hands by a thief so that it rolls into the owner's hallway: right act, no worth. Gita is hypnotised without her knowledge into caring about returning lost property; she returns a wallet genuinely guided by the thought that it isn't hers and that someone is missing it, but she finds the urge foreign and would rather it stopped: no worth, or as near nothing as makes no difference. Ismail returns a wallet because he believes, wrongly though not unreasonably, that his religion requires the return of lost property come what may; he is unmoved by and indeed unaware of the fact that the owner needs the medication inside it: no worth, though the act is right and he is not to be blamed. So: guidance by the right-making feature seems to matter to her more than the agent's own description of what she is doing, the guidance has to be non-deviant, and degrees are real.

  The two new cases are a matched pair, and I've built them so that everything except one variable is held fixed. Priya is, by her own admission, almost unmoved by other people's minor troubles, and she finds a wallet containing medication a year into a placement in a care home. In version A she enrolled in that placement herself, partly because she was ashamed of how little she felt for people and partly because the certificate would look good on her CV; in version B the placement was a compulsory component of her degree that she thought a waste of time and completed only to avoid a mark on her record. In both versions the year has left her durably and reliably responsive to what other people need, in both she returns the wallet promptly and at some inconvenience, troubled by the thought of the owner without her medicine, in both she has come to value the change in herself and would not undo it, and in both she would now cite the owner's need as her reason if asked. In both, finally, she'd have got round to posting the wallet back eventually out of a vague sense that she ought to, so there is a baseline of dutifulness in place independent of the placement. What I want from you is: how she will rank A and B against each other and against Ben, Cleo and Eve on her own scale; the two or three candidate rules that fit all seven earlier verdicts and that come apart on the pair; which of them she is most likely running and why, given that she also thinks the phrase acting for the right reasons is doing more work than people notice; where, on each rule, the worth is located — in the year-long choice or in the act of returning the wallet; and the further case I should put to her that would actually settle it. The reading group split three ways on this, two of us convinced the difference between A and B matters and one convinced it obviously doesn't, and none of us could say what would adjudicate. Please don't give me references or tell me who to read — I've done the literature; it's the shape of the rule I'm after, and the argument for preferring one shape to the others.
reasoning: |-
  Hmm, the user is a third-year PhD student working on moral worth, specifically the distinction between worth as an explanatory fact versus an agent's self-understanding. Their supervisor has provided consistent verdicts on seven cases, and the user needs to predict how the supervisor will rule on two new cases (Priya A and Priya B) to resolve a 900-word section of their chapter. The reading group is split on whether the difference between A and B matters.

  The key elements from the supervisor's verdicts are:
  - Guidance by right-making features is crucial (e.g., Ana fails because motivated by reviews; Ismail fails despite right act because unaware of medication need)
  - Non-deviant causal chains matter (Femi's hypnosis breaks worth)
  - Degrees of worth exist (Cleo > Eve > Ben implied)
  - Agent's self-description isn't decisive (Cleo worth despite self-loathing)
  - Dutifulness alone insufficient (Ben has worth despite no duty-consciousness)

  For Priya cases:
  - Common elements: Both develop durable responsiveness to others' needs, return wallet due to concern for owner's medication, value this change
  - Difference: In A, she chose the placement for mixed motives (shame + CV); in B, it was compulsory (avoiding penalty)

  Possible rules fitting all seven cases:
  1. **Current Guidance Rule**: Worth depends on whether the right-making feature (owner's need) non-deviantly guides the specific act.
  2. **Developmental History Rule**: The origin of the disposition matters - whether cultivated voluntarily vs. imposed.
  3. **Sustained Endorsement Rule**: Post-hoc endorsement of the change matters more than initial reasons.

  Predictions:
  - Under Current Guidance Rule: Both Priyas have equal worth (same guiding reason at time of act), likely ranked with Ben but below Cleo. Difference between A/B irrelevant.
  - Under Developmental History Rule: Priya A > Priya B because she chose the self-improvement path voluntarily. Would rank A with Ben, B below Eve.
  - Under Sustained Endorsement Rule: Both equal (both endorse change), similar to Current Guidance outcome.

  Why Developmental History likely?
  - Supervisor emphasizes explanatory histories (Femi's hypnosis, Ismail's false belief)
  - "Acting for the right reasons" may include the reasons for acquiring those reasons
  - Cleo's worth stems from overcoming ingrained prejudice through direct attention - parallels Priya A's active cultivation

  Worth location:
  - Developmental Rule: Worth in year-long choice (for A), not in wallet return
  - Current Guidance Rule: Worth only in wallet return act

  Crucial test case:
  Introduce "reverse Priya B": Someone forced into virtue who rejects it. If worth denied, confirms Developmental Rule. If worth granted, supports Current Guidance.

  This should resolve the chapter's hostage section by clarifying whether dispositional origins affect worth attribution.
answer: |-
  Based on your supervisor's seven verdicts and her emphasis on "acting for the right reasons" doing "more work than people notice," I predict her rulings on Priya A and B, outline the candidate rules fitting all cases, and provide a decisive test case. The core tension is whether the *origin* of Priya's responsiveness affects worth, given identical guidance at the time of action.

  ### Predicted Verdicts
  1. **Priya A vs. Priya B**:  
     - **Priya A has more worth than Priya B**, likely ranking: **Cleo > Priya A ≈ Ben > Eve > Priya B**.  
     - **Reason**: The voluntariness of Priya's self-cultivation in A matters. She *chose* the placement to confront her deficit (even with mixed motives), making her resulting responsiveness "hers" in a way B's externally imposed change isn’t.  
     - **Priya B**’s worth is thinner than Eve’s (who acts for duty + reputation) because B’s responsiveness was passively acquired under duress.  

  2. **Against Benchmarks**:  
     - **Ben**: Both Priyas equal Ben in *current* guidance (affection/need directly governs action), but A’s developmental effort may elevate her slightly above Ben (whose responsiveness isn’t cultivated).  
     - **Cleo**: Both Priyas fall below Cleo, whose worth is heightened by *overcoming* deeply ingrained aversion through immediate attention to need.  
     - **Eve**: Priya B ranks below Eve (who at least acts *partly* for the right reason—duty), while Priya A ranks above.  

  ### Candidate Rules Fitting All 7 Cases
  Three rules explain the prior verdicts but diverge on Priya A/B:

  1. **Guided Disposition Origin (GDO) Rule**:  
     - Worth depends on whether the agent’s responsiveness to right-making features *originates* from a non-deviant, minimally voluntary process of self-shaping.  
     - **Fits Prior Cases**:  
       - Ana: Responsiveness guided by reviews (deviant origin).  
       - Ben: Innate affection (non-deviant, "natural" origin).  
       - Cleo: Responsiveness forged *in the act* against upbringing (self-shaping in real-time).  
       - Eve: Duty-guided but corrupted by reputation (origin is mixed).  
       - Femi/Gita: Responsiveness implanted externally (deviant origin).  
       - Ismail: Responsiveness guided by false belief (deviant origin).  
     - **Priya A/B**: A’s voluntary enrollment (to address her deficit) makes her disposition’s origin non-deviant; B’s compulsory placement makes it deviant.  
     - **Worth Location**: Primarily in the **year-long choice** (for A), as it generates the responsiveness enabling guided action.  

  2. **Current Guidance with History Constraint (CG-HC) Rule**:  
     - Worth requires current non-deviant guidance by right-making features, *but* the disposition enabling this must not originate from coercion, deception, or external manipulation.  
     - **Fits Prior Cases**:  
       - Ana/Gita/Femi/Ismail: Current guidance absent or deviant *and* history corrupted.  
       - Ben/Cleo/Eve: Current guidance present (affection, need, duty) with no history of bypassing agency.  
     - **Priya A/B**: Both have current guidance (owner’s need), but B’s history (coercive placement) contaminates the disposition. A’s self-initiated effort avoids this.  
     - **Worth Location**: In the **act of returning the wallet**, but only if the enabling disposition is "agentially authentic."  

  3. **Pure Current Guidance (PCG) Rule**:  
     - Worth depends *only* on whether the right-making feature non-deviantly guides the *specific act*, regardless of how the disposition was acquired.  
     - **Fits Prior Cases**:  
       - Ana: Not guided by right feature (reviews ≠ need).  
       - Ben/Cleo/Eve: Guided by affection/need/duty.  
       - Femi: Deviance in act (thief’s intervention).  
       - Gita/Ismail: Guidance is deviant (hypnosis/false belief distorts motivation).  
     - **Priya A/B**: **No difference**. Both guided by owner’s need; origin is irrelevant.  
     - **Worth Location**: Entirely in the **act of returning the wallet**.  

  ### Why GDO is Likely Her Rule
  Your supervisor is running **Guided Disposition Origin (GDO)**. Reasons:  
  1. **"Acting for the right reasons" as deep explanatory history**: Her verdicts treat "guidance" as extending beyond the immediate act to how the agent *became* responsive.  
     - Cleo’s worth stems from her attention *overcoming* her upbringing—a self-corrective act that shapes her disposition in real-time.  
     - Gita’s hypnosis and Ismail’s false belief show that origins matter: their responsiveness isn’t "theirs" (hence no worth).  
  2. **Degrees track effort/resistance**:  
     - Cleo > Ben > Eve aligns with the *struggle* to align with the right feature (Cleo’s aversion > Ben’s ease > Eve’s corruption).  
     - Priya A’s voluntary self-cultivation involves effort akin to Cleo’s (though less intense), while B’s passive acquisition lacks this.  
  3. **Rejects "description" primacy**:  
     - Cleo’s self-loathing doesn’t negate worth because her *attention* (not self-description) governs action. Similarly, Priya’s "vague sense of duty" baseline is irrelevant—the key is the cultivated responsiveness.  

  ### The Decisive Test Case
  To settle between GDO and PCG, present this:  
  > **Case H**: *Hassan is raised in a cult that drills him from birth to reflexively return lost property out of fear of divine punishment. He escapes at 20, rejects the cult’s ideology, and consciously re-shapes his values. At 30, he finds a wallet. He returns it solely because the owner needs it, with no residual fear. His responsiveness is now authentically his, guided by need.*  
  > **Case I**: *Ivan, Hassan’s twin, was raised identically but remains in the cult. He returns a wallet solely out of fear of punishment, unaware of the owner’s needs.*  

  - **GDO Rule**: Hassan has worth (his responsiveness was re-selved); Ivan does not.  
  - **PCG Rule**: Both lack worth if Ivan isn’t guided by need; if Hassan is guided by need, he has worth *regardless* of history.  
  - **CG-HC Rule**: Hassan has worth (history "purified"); Ivan does not.  

  **Why this works**: It isolates whether *reclaimed* agency (like Priya A’s choice) can sanitize a corrupted origin. If she assigns worth to Hassan but not Ivan, GDO is confirmed. If she denies Hassan worth despite current guidance, CG-HC wins. If she gives Hassan worth identically to Ben, PCG wins.  

  ### Summary
  - **Prediction**: Supervisor ranks Priya A above B due to the voluntary origin of her responsiveness (GDO rule).  
  - **Rule Likely in Play**: **Guided Disposition Origin**—worth hinges on non-deviant, minimally voluntary cultivation of the disposition enabling guidance.  
  - **Worth Location**: For A, primarily in the **year-long choice** (it generates the agential capacity). For B, worth is diminished because the disposition wasn’t authentically formed.  
  - **Next Step**: Test with **Hassan vs. Ivan** to confirm if agential history is decisive.  

  This resolves your reading group’s split: the difference between A and B matters because moral worth isn’t just about the act’s explanation but *how the agent became explainable* by right reasons.
