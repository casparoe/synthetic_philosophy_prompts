  - mechanism: C4 limits affected interests to actual futures; C1 might seem to include possible people.
  - repair: None needed; C4 is a specification of C1 for future persons.
  - cost: None; C4 is consistent with C1 by design.

  Now, for (i) the anchoring move:

  This move introduces a second-order power (consultation and suspensive veto) for affected but excluded groups. It tries to reconcile C1 and C3 by having a fixed demos (C3) but giving some voice to those excluded who are affected (C1). However, it violates the letter of C1 because C1 requires membership (implying a vote) for significantly affected interests. The veto is a form of power but not membership. Moreover, it might be seen as a minimal concession. But note that the veto itself is a decision-making power, so the group is now participating in the decision, which is what C1 requires. However, they are not full members. Therefore, it is a repair that relaxes C1: instead of requiring full membership, it allows a weaker form of participation. But then we must revise C1 to allow for degrees? But C8 says binary inclusion. So it might conflict with C8? Alternatively, the anchoring move can be seen as creating a new category of membership (with weaker powers). But then it violates C8? Or perhaps the veto is not membership but a separate right. The cost: it complicates the system and might not fully satisfy C1. Moreover, it doesn't solve the problem for every decision because the veto is only a suspensive one. Overall, it is a genuine repair but at the cost of revising C1 to allow for non-voting participation in some cases. But without that revision, it might be incoherent because C1 requires membership. So if we keep C1 as is, it's not sufficient.

  Verdict: It repairs the tension but at the cost of revising C1 (implicitly) to allow for non-voting participation. Without that, it's incoherent with C1. But the user might not want to revise C1. So it's a repair that forces a change in C1.

  But note: the anchoring move is an alternative to revising C1? It is a way of keeping both by introducing a new mechanism. However, the mechanism itself might be seen as violating C1. Therefore, I think it is a repair that requires relaxing the requirement of C1 from full membership to some form of participation. So it's a revision of C1 in practice.

  But the question: is it repairs, cosmetic, redundant, or incoherent? I think it is a repair for the tension between C1 and C3, but it is not redundant (because without it, the tension remains) and not incoherent if we accept that the veto is a form of participation. However, it does not fully satisfy C1 because the excluded group does not get a vote. So it's a partial repair. It might be the cheapest.

  Now for (ii) the reflexive case:

  C1 applied to boundary decisions leads to circularity: who is affected by the boundary decision depends on who is in the demos. This can generate a regress or have fixed points. Fixed points exist if there is a set S such that the set of people affected by the decision about S is exactly S. But such sets may not exist, and even if they do, they might not be unique. Moreover, the process of finding a fixed point might be indeterminate. Without a fixed point, the regress is infinite. Therefore, as stated, C1 without C9 is indeterminate. C9 is a defensible way to avoid the regress, but it is an arbitrary exemption because boundary decisions are critical and affect interests. The principled answer would be to find a non-arbitrary fixed point, but that might be difficult.

  Verdict: C1 without C9 generates a regress and is indeterminate. C9 avoids it but is an evasion unless justified independently.

