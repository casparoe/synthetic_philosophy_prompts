  - mechanism: Fixed demos (C3) may exclude some affected by a decision (C1).
  - repair: Revise C3 to allow some decision-specific adjustments.
  - cost: Risk of boundary rigging (C3's concern) if adjustments are not constrained.

  Row 2:
  - id: C1 & C5
  - relation: genuine
  - severity: 4
  - mechanism: C5 excludes non-residents from national votes, but they may be affected (C1).
  - repair: Revise C5: include all affected in national votes, not just residents.
  - cost: Must accept non-resident voting, which may challenge state sovereignty norms.

  Row 3:
  - id: C1 & C9
  - relation: genuine
  - severity: 4
  - mechanism: Boundary decisions affect interests but are exempt from C1 (C9).
  - repair: Drop C9; apply C1 to boundary decisions via a fixed-point or regress-stopper.
  - cost: Must confront the reflexive case (ii) and find a non-arbitrary solution.

  Row 4:
