answer: |-
  ## Research Proposal: The Temporal Individuation of Fanaticism in Finite Ethics

  **Research Question:**  
  Does avoiding fanaticism (endorsing arbitrarily small probabilities of arbitrarily large finite payoffs) for single, isolated decisions *necessitate* that the normative status of an act becomes sensitive to the presence of future, independent decision opportunities of the same type? And if so, does this package-sensitivity either lead to diachronic instability in decision-making or result in fanaticism re-emerging at the level of policy choice?

  **Why the Standard Positions Leave This Open:**  
  The debate has centred on axiomatic defences of expected utility theory (supporting fanaticism) versus modifications like bounded utility functions, risk-weighted expected utility, or probability discounting (resisting fanaticism). Crucially, these positions evaluate *single, contextless choices*. They implicitly assume the decision problem is isolated, asking only "Is act A in scenario S permissible?" None explicitly address how the normative assessment of A might change if S is embedded within a long sequence of *similar*, *independent* decision problems. The core disagreement concerns the value function or choice rule for a single decision atom, leaving the individuation question – whether the relevant normative unit is an atomic act, a package, or a policy – unexamined and unconstrained by existing arguments.

  **Methodology (Month-by-Month):**  
  1.  **Months 1-3:** **Literature Synthesis & Problem Framing.** Systematically catalogue formal arguments for/against fanaticism in single decisions, focusing on finite payoffs. Precisely define the target phenomenon (e.g., Pascal's Mugging sequences) and formalise the individuation question. Identify core normative principles (e.g., dominance, diachronic consistency) relevant to sequential choice.
  2.  **Months 4-6:** **Model Construction.** Develop a minimal formal model: an agent faces a finite sequence of `N` independent, identical decision problems. Each offers a choice between:
      *   **Safe:** Certain small payoff `s`.
      *   **Risky:** Probability `p` (very small) of large payoff `M` (very large), else `0`.
      Define a small class of decision procedures (`DP`) representing candidate normative stances:
      *   `DP_Atomic`: Applies a single-decision rule (e.g., expected value maximisation, bounded utility, risk-weighted) to each choice independently.
      *   `DP_Package`: Evaluates the entire sequence as one grand choice between the package of all Safe options and the package of all Risky options, using the same single-decision rule.
      *   `DP_Policy`: Commits at the outset to a strategy ("Always Safe", "Always Risky", or a mixed strategy) for the entire sequence, evaluated by its overall expected outcome or similar.
  3.  **Months 7-9:** **Formal Analysis.** Analyse each `DP`:
      *   Does `DP_Atomic` with an anti-fanatic rule (e.g., bounded utility) applied per decision avoid fanaticism *for the sequence*? Or does it lead to accepting many Risky bets if `N` is large?
      *   Does `DP_Package` with an anti-fanatic rule avoid fanaticism? How does its verdict on individual acts depend on `N`?
      *   Does `DP_Policy` with an anti-fanatic evaluation rule avoid endorsing an "Always Risky" policy when `N` and `M` are large enough? Or is the expected value of "Always Risky" dominant?
      *   Examine diachronic stability: If using `DP_Package`, does an agent's obligation concerning bet `k` change based on learning about opportunities beyond `k`? Can this knowledge be utilised coherently?
  4.  **Months 10-12:** **Synthesis & Implications.** Map results onto the conjecture. Draft findings, exploring philosophical implications concerning normative fundamentality (acts vs. policies) and the persistence of fanaticism concerns.

  **Defence of Methodology:**  
  *   **Vs. Further Axiomatics:** While axiomatic approaches are valuable, they often abstract from sequential structure. The toy model directly confronts the temporal aggregation inherent in motivating examples, testing how single-decision rules *behave* in sequences.
  *   **Vs. Empirical Studies:** Empirical work on small probabilities is crucial but descriptive. This project is normative, asking what agents *ought* to do when facing sequences, not what they *do*.
  *   **Vs. Literature Survey Alone:** A survey is foundational (Months 1-3) but insufficient. The novel contribution requires formal modelling of sequential choice under different individuation assumptions to test the conjecture rigorously. The minimal model focuses the analysis on the core philosophical issue of individuation.

  **Possible Results:**  
  1.  **Dissolution:** Package-sensitivity is manageable or illusory; standard single-decision rules applied atomically avoid fanaticism robustly across sequences without instability. (Conjecture falsified).
  2.  **Relocation:** Avoiding single-act fanaticism via package-sensitivity (`DP_Package`) proves diachronically unstable or practically unusable. Stability requires adopting a policy perspective (`DP_Policy`), where fanaticism re-emerges as the optimal policy ("Always Risky") dominates for large `N` and `M`, despite using an anti-fanatic evaluation rule. (Conjecture confirmed).
  3.  **Amplification:** Fanaticism concerns are worse at the policy level; even rules resistant in single cases readily endorse fanatical policies. (Stronger confirmation).
  4.  **Novel Position:** Analysis reveals a stable, non-fanatical, non-package-sensitive approach not captured by standard rules or the initial `DP`s.

  **Deciding Considerations:**  
  The key determinants will be:
  *   The behaviour of `DP_Atomic` with anti-fanatic rules: Does the cumulative effect of many small probabilities of huge gains inevitably lead to accepting many Risky bets?
  *   The diachronic coherence of `DP_Package`: Can an agent using it make consistent plans and respond rationally to new information about future opportunities?
  *   The verdict of `DP_Policy`: When evaluating the *strategy* "Always Safe" vs. "Always Risky" using an anti-fanatic criterion (e.g., bounded expected value), does "Always Risky" become superior for sufficiently large `N` and `M` despite the tiny `p`?

  **Failure Conditions:**  
  1.  **Unmanageable Complexity:** The most likely failure mode is the model becoming intractable when adding realistic complexities (e.g., state-dependent utilities, correlation between offers, learning, resource constraints) necessary to test stability thoroughly. If the core dynamics cannot be isolated within twelve months using the minimal model, the project stalls.
  2.  **Inconclusive Results:** The formal analysis might yield ambiguous results, failing to clearly support or refute the transmission of fanaticism across levels, or showing strong dependence on specific, debatable parameterisations of the anti-fanatic rules within the model.

  This project challenges the atomic perspective dominating the fanaticism debate, arguing that the problem's structure demands attention to decision individuation over time. By formally modelling sequences under different normative units, it seeks to reveal whether resisting fanaticism locally inevitably displaces it globally.

  \answer{The normative force of single decisions depends on future context.}
