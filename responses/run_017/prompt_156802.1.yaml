  I recall that in philosophy of science, string theory debates often involve epistemic and methodological questions. The user’s hypothesis about two questions—truth vs. worth—is spot on. But there’s more: the sociological evidence (no alternatives) is central. Critics see this as irrelevant without empirical testing, while proponents argue it’s the best we have.

