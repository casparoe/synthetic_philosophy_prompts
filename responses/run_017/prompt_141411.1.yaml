  **MEMORANDUM**  
  To: The Full Board of Directors  
  From: The Governance Committee  
  Date: [Insert Date of Circulation]  
  Subject: Recommendation on Endowment Mission Amendment Process  

  ### Introduction  
  The Governance Committee submits this recommendation regarding the proposed redirection of our endowment’s mission, in light of the ongoing dispute over the mission clause established by our founding donors. After thorough analysis, we conclude that the board possesses the authority to amend the mission without adhering to the clause’s stringent requirements. This memo outlines the majority’s case, addresses key interpretive issues, and proposes a path forward.  

  ### Background  
  Two years ago, a board-commissioned internal review recommended modernizing the endowment’s mission to align with its expanded capabilities. Eight of fourteen directors (a majority) now support this change, arguing the original mission—crafted decades ago—no longer serves our current context. The founding donors, who attend meetings and oppose the amendment, invoke a mission clause requiring a four-fifths vote and an 18-month waiting period for any mission change. The majority contends this clause was designed for emergencies, not deliberate, evidence-based reforms like ours, and that it unduly binds the current board.  

  ### Analysis: Core Issues  
  We focus on four critical questions underpinning the debate:  

  1. **The Clause’s Asymmetry Unfairly Entrenches the Status Quo**  
     The mission clause imposes barriers solely for *changing* the mission, not preserving it. This asymmetry grants the status quo artificial permanence, even when the original rationale for the clause—preventing rash decisions during "panic"—is inapplicable. Here, the proposed redirection follows two years of review, data collection, and debate. Applying the clause would freeze a mission that a majority deems misaligned with our endowment’s potential, violating the board’s fiduciary duty to act in the foundation’s present best interests.  

  2. **The Clause’s Ambiguity Forces the Board to Make the Very Judgment It Sought to Avoid**  
     The clause fails to define what constitutes an "impairment" (e.g., panic-driven haste) warranting its use. By debating whether this situation qualifies as such an impairment, the board is now entangled in the exact type of contested, high-stakes judgment the clause intended to remove from its purview. This circularity renders the clause self-defeating. The majority rightly argues that the board cannot be bound by a standard it must interpret without guidance—especially when the clause’s trigger is ambiguous.  

  3. **The Board’s Amendment Authority Under the By-Laws May Nullify the Clause**  
     Our by-laws permit amendments by majority vote. If the mission clause is viewed as a by-law provision (rather than a separate covenant), the board could amend or void it by simple majority. Legal precedent suggests that boards retain inherent authority to revise governing documents unless explicitly restricted. The donors did not formalize the clause as a separate trust instrument; thus, it likely binds future boards only if respected as a normative commitment, not as an unalterable legal barrier.  

  4. **A Fourth Option: Defining the Clause’s Trigger Preemptively**  
     Rather than litigating this specific change, the board could proactively define what conditions justify invoking the clause (e.g., financial distress, leadership crises) and what evidence demonstrates them. While this would clarify future governance, it is inadvisable here:  
     - It would delay addressing the urgent mission misalignment identified in our review.  
     - It risks entrenching the same asymmetry (e.g., defining triggers only for change, not preservation).  
     - It could exacerbate division by forcing agreement on abstract standards amid an active dispute.  
     The majority’s case for direct action outweighs this procedural alternative.  

  ### Weight of the Donors’ Testimony  
  The donors’ views on their past intent deserve consideration but not deference. As parties to the dispute, their testimony is inherently partial. While their perspective informs the clause’s context, it cannot override the board’s independent interpretation of the text and present circumstances. If the donors were deceased, we would rely solely on the clause’s ambiguous language, strengthening the majority’s case that the text cannot bear the weight of their asserted intent. Alive or not, the donors’ testimony does not resolve the clause’s core flaws—asymmetry and ambiguity.  

  ### Strongest Counterargument: Upholding Fiduciary Promises  
  The strongest objection to our position is that disregarding the clause breaches a fiduciary promise made to the donors at the asset transfer. This could erode trust with stakeholders and deter future donors, who may fear their intentions will not endure.  

  ### Condition for Reversal  
  The committee’s recommendation would change only if evidence emerges that the mission clause is legally enforceable as a restrictive covenant (e.g., via court precedent or explicit contract language), and that bypassing it would expose the foundation to material liability or reputational harm. Absent this, the board’s duty to steward the endowment responsibly prevails.  

  ### Recommendation  
  The Governance Committee recommends that the board:  
  1. **Vote at the upcoming meeting on [Insert Meeting Date]** to approve the mission redirection via a simple majority under the by-laws’ amendment authority, without applying the mission clause’s four-fifths vote or 18-month delay.  
  2. **Publish a concise statement** on the foundation’s website by **[Insert Date: 10 Days After Vote]** explaining the reasons for the change, emphasizing the two-year review process and the board’s assessment of current needs.  
  3. **Implement the mission change effective immediately** upon vote approval.  

  This approach respects the board’s autonomy, aligns with our by-laws, and prioritizes the foundation’s evolving mission over an opaque procedural constraint.  

  ---  
  **End of Memo** (Approx. 1.5 pages)
