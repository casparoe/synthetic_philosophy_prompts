prompt: |-
  Next Thursday I have to circulate, on behalf of the governance committee of the foundation I serve, a short recommendation to our full board, and I would like you to draft it. The case is this: our endowment is governed by a mission clause the founding donors insisted on when they transferred the assets, under which the mission can be amended only by a four-fifths vote of the board accompanied by a written statement of reasons published eighteen months before the change takes effect. Roughly two years ago a bare majority of the board began arguing that the mission should be redirected, on the strength of an internal review the board itself commissioned; eight of our fourteen members have joined in the last three years and say the original framing no longer fits what the endowment can now do. The donors are both alive, both still attend meetings, and both oppose the change, invoking the clause and their own account of what they meant by it. The majority's position is that the clause is an illegitimate attempt by past decision-makers to bind present ones, that each board is a distinct agent answerable to present circumstances, and that in any case the delay was written for moments of panic, not for a considered change of direction with a two-year paper trail behind it.

  The memo should be addressed to the full board, run no more than two pages, and end with one concrete recommendation with dates attached. It must give the strongest version of the majority's case rather than treating the clause as sacrosanct. In particular I want it to work through four things I think the argument actually turns on: first, that the clause is asymmetric, slowing any change of mission but not the preservation of the current one, so that it entrenches the status quo even in cases where its panic rationale plainly does not apply; second, that the clause nowhere says what counts as the impairment it was written for, so the board is now making in the heat of the dispute exactly the judgment the clause was supposed to take out of the hands of a board in the heat of the dispute; third, that our by-laws also permit the board to amend the by-laws by majority vote, which may mean the clause binds nobody as currently drafted; and fourth, a fourth option I want evaluated honestly rather than merely listed, namely that the right move is for the board to specify now, while relatively cool-headed, the conditions under which the clause applies and what would count as evidence that they obtain, thereby settling the trigger instead of settling the case. Please also say how much weight the donors' present testimony about their own past intent should carry, and whether that weight ought to differ from what it would be if they were dead and we had only their text. Close by naming the strongest consideration on the side you are rejecting and stating what would have to be true for the recommendation to go the other way.
reasoning: |-
  We are drafting a memo from the governance committee to the full board. The memo must be no more than two pages and end with a concrete recommendation with dates. We are to present the strongest case for the majority and work through four specific points. We must also address the weight of the donors' testimony and close by naming the strongest consideration on the opposing side and what would have to be true for the reverse recommendation.

  Key elements:

  1. **Asymmetry of the Clause**: The clause only slows mission change, not preservation, thus entrenching the status quo even when the "panic" rationale doesn't apply.

  2. **Ambiguity of "Impairment"**: The clause doesn't define what constitutes an impairment (the condition it was written for), so the board is now making the very judgment the clause was meant to remove from a heated board.

  3. **By-laws Amendment by Majority**: The by-laws permit amendment by majority vote, which might mean the clause is not binding.

  4. **Fourth Option**: Instead of deciding the case, the board could now define the conditions under which the clause applies and what evidence is required, setting the trigger for future use.

  Additionally:
  - Evaluate the weight of the donors' testimony about their intent (and whether it would differ if they were dead).
  - End with the strongest opposing consideration and the condition for the reverse recommendation.

  Structure of the memo:

  - **Subject Line**: Clear and concise.
  - **Introduction**: Briefly state the purpose and context.
  - **Background**: Summarize the situation (the mission clause, the two-year debate, the positions of the majority and the donors).
  - **Analysis**: Address the four points in order, making the majority's case.
  - **Donors' Testimony**: Discuss the weight of their current testimony.
  - **Recommendation**: Concrete with dates.
  - **Closing**: Strongest opposing consideration and what would change the recommendation.

  Draft:

  ---

  **MEMORANDUM**

  **To**: The Full Board of Directors  
  **From**: The Governance Committee  
  **Date**: [Current Date]  
  **Subject**: Recommendation Regarding the Endowment Mission Clause and Proposed Mission Redirection  

  ### Introduction  
  This memorandum addresses the ongoing debate regarding the endowment mission clause and the proposal to redirect the foundation's mission. After careful consideration, the Governance Committee recommends that the board proceed with the mission redirection under the standard by-law amendment process, without invoking the special mission clause requirements, for the reasons set forth below.  

  ### Background  
  Two years ago, a board-commissioned internal review suggested that the foundation's mission, as originally framed by the founding donors, no longer optimally serves the endowment's potential. Since then, a majority of the board (eight of fourteen members, with eight joining in the last three years) has advocated for a mission redirection. The founding donors, who are still involved and attend meetings, oppose this change, citing the mission clause they established at the transfer of assets. This clause requires a four-fifths board vote and an eighteen-month waiting period with a published statement of reasons for any mission amendment.  

  The majority argues that the clause is an illegitimate constraint on the current board's authority, that the delay was intended for moments of panic and not for a considered change with a two-year review, and that the board has the inherent power to amend its governing documents by majority vote.  

  ### Analysis: Key Issues in the Majority's Case  

  1. **Asymmetry of the Clause and Entrenchment of the Status Quo**  
     The mission clause is asymmetric: it imposes hurdles only for changing the mission, not for preserving it. This design entrenches the original mission even when the rationale for such entrenchment (preventing hasty changes in a panic) does not apply. In the present case, the proposed change is the product of two years of deliberation, a board-commissioned review, and extensive documentation. The clause, by its structure, gives an unfair advantage to the status quo, which is inconsistent with the board's duty to act in the foundation's best current interests.  

  2. **Ambiguity of the Clause's Triggering Condition**  
     The clause does not define the conditions under which it applies (i.e., what constitutes the "panic" or impairment it was designed to prevent). As a result, the board is now forced to interpret whether the current situation qualifies — precisely the kind of heated, subjective judgment the clause aimed to avoid. This ambiguity undermines the clause's purpose and suggests that it is unworkable as a governance mechanism. The majority asserts that the board should not be bound by a clause that fails to provide clear guidance for its application.  

  3. **The By-Laws' Majority Amendment Provision**  
     The foundation's by-laws explicitly allow the board to amend the by-laws by a majority vote. This provision suggests that the mission clause, as part of the by-laws, is subject to amendment or override by a simple majority. If the board can amend the by-laws, then it can also amend the mission clause or set it aside. The majority contends that the mission clause is therefore not a binding constraint but a procedural requirement that the board can choose to modify or waive when it conflicts with the board's fiduciary duties.  

  4. **The Fourth Option: Defining the Clause's Trigger**  
     An alternative to immediate mission change is for the board to define the conditions under which the mission clause applies and what evidence would trigger it. This would address the ambiguity in point (2) and create a clear framework for future decisions. However, after evaluation, the Governance Committee concludes that this option is less desirable at this time. The current board has already conducted a thorough review and is prepared to act. Delaying the mission change to define the trigger would only prolong the uncertainty and might not resolve the underlying disagreement about the mission's direction. Moreover, defining the trigger now would itself be a contentious exercise and could lead to further disputes. The majority's view is that the board should act on the substantive issue (the mission) rather than create a meta-governance rule that may not be needed again.  

  ### The Weight of the Donors' Testimony  
  The founding donors' testimony about their original intent is significant but not dispositive. As the creators of the clause, their understanding of its purpose carries weight, especially because they are alive and can speak directly. However, the board must also consider that the donors are parties to the dispute and have a vested interest in the outcome. Their testimony is therefore subject to the same biases that the clause was meant to guard against in a "panic" scenario.  

  If the donors were no longer living, we would rely solely on the text of the clause and any contemporaneous documents. In that case, the text's ambiguity (as noted in point 2 above) would be even more pronounced, and the board would have to interpret it without the donors' input. The fact that the donors are alive adds context but does not elevate their interpretation to a binding authority. The board, as the current steward of the foundation, must interpret the clause in light of present circumstances.  

  ### The Strongest Consideration on the Opposing Side  
  The strongest argument for adhering to the mission clause is that it represents a solemn commitment made by the foundation to the donors at the time of the asset transfer. Ignoring it could damage the foundation's reputation and its ability to attract future planned gifts, as donors may fear that their intentions will not be honored.  

  ### What Would Change the Recommendation  
  The recommendation to proceed with mission change by majority vote would be reversed only if the board determines that the mission clause is legally binding and that the foundation faces a substantial risk of litigation or reputational harm that outweighs the benefits of the mission redirection. In that case, the board should instead follow the clause's process (four-fifths vote and eighteen-month wait) or seek a negotiated agreement with the donors.  

  ### Recommendation  
  The Governance Committee recommends that the board, at its next meeting on [date of next meeting, e.g., Next Thursday], vote to amend the foundation's mission in accordance with the majority proposal, using the standard by-law amendment process (requiring a simple majority vote). The mission change should take effect immediately upon approval, without invoking the mission clause's requirements. The committee further recommends that the board accompany this decision with a public statement explaining the reasons for the change and the thorough process that led to it, to mitigate any reputational concerns.  

  --- 

  This draft is under two pages and covers all required points. The recommendation is concrete with a date (the next meeting). It presents the majority case strongly and addresses the four points, the donors' testimony, and the opposing view.
