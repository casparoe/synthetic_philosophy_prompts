  Below is the decision tree and accompanying notes. The tree is designed to guide participants from concrete cases to named positions without presupposing any labels, using only questions answerable with basic logic. The cases specified are integrated throughout. The tree has 10 branch nodes and 14 leaves, fitting on one page. Notes address flags, empty cells, and the working assumptions.

  ---

  ### **Decision Tree: Non-Classical Treatments of Inconsistency**

  **Root Node (Case a):**  
  *Consider the sentence: "This sentence is false."*  
  **Q1:** Is this sentence meaningful?  
  - **Yes** → Go to Q2  
  - **No** → **Leaf 1: Classical Hierarchical Approach**  

  **Q2 (Follows Yes to Q1):**  
  Can this sentence be consistently assigned exactly one truth value (true or false)?  
  - **Yes** → **Leaf 2: Trivialism (Incoherent)**  
  - **No** → Go to Q3  

  **Q3 (Follows No to Q2):**  
  Must we reject the principle that a contradiction implies *any* statement?  
  - **Yes** → Go to Q4  
  - **No** → **Leaf 3: Gap Theory**  

  **Q4 (Follows Yes to Q3):**  
  Is this sentence *both* true and false?  
  - **Yes** → Go to Q7  
  - **No** → Go to Q5  

  **Q5 (Follows No to Q4, Case i):**  
  *Consider a sentence: "If this sentence is true, then 0=1." Does this paradox force us to reject...*  
  - **The classical 'if-then' (conditional)** → **Leaf 4: Relevance Logic**  
  - **The rule that lets you derive "A implies B" from "A implies (A implies B)"** → **Leaf 5: Substructural Logic**  
  - **The rule that lets you combine "A" and "B" into "A and B"** → **Leaf 6: Non-Adjunctive Approach**  

  **Q6 (Leaf 3: Gap Theory, Case c):**  
  *Consider: "This sentence is not true."*  
  **Q6:** Does this new sentence pose an unresolved problem for your gap view?  
  - **Yes** → **Leaf 7: Gap Theory (Revenge-Prone)**  
  - **No** → **Leaf 8: Gap Theory (Revenge-Resistant)**  

  **Q7 (Follows Yes to Q4, Case g):**  
  *Can you face a situation where you ought to do X and ought not to do X, all things considered?*  
  - **Yes** → **Leaf 9: Dialetheism (Normative Extensions)**  
  - **No** → **Leaf 10: Dialetheism (Semantic Only)**  

  **Q8 (Leaf 1: Classical Hierarchical Approach, Case c):**  
  *Consider: "This sentence is not true."*  
  **Q8:** Is this sentence meaningful?  
  - **Yes** → **Leaf 11: Classical (Revenge-Prone)**  
  - **No** → **Leaf 12: Classical (Revenge-Resistant)**  

  **Q9 (Leaf 3: Gap Theory, Case b):**  
