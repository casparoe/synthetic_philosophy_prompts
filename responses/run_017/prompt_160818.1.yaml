     - **Assumption 2 (Glut vs. Paraconsistent):** **Incorrect.** The tree uses Q4 (Case a) to separate glut (Q4=Yes) from non-dialetheic paraconsistency (Q4=No). Case a forces the issue: If the liar is meaningful and explosion is rejected, asking if it is *both true and false* distinguishes dialetheism (yes) from others (no).  

