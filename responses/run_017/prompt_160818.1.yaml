  1. **Flagged Pairs the Tree Cannot Separate**  
     - **Gap vs. Glut/Paraconsistent (Q3):** The tree cleanly separates gap theories (accept explosion) from glut/paraconsistent theories (reject explosion) due to the choice of validity (preservation of truth). Gap theories (e.g., Kleene) do not block explosion, as a contradiction (e.g., "P ∧ ¬P") is never *true* (only gappy), so explosion holds vacuously. A "preservation of non-falsity" definition would blur this, but we fix "validity = preservation of truth" for clarity.  
