  - **(1) is correct:** For every observed \(x = 2^n\) (with \(n \geq 1\)), the conditional expected value of switching is \(\frac{11}{10}x > x\). For \(x = 1\), switching yields exactly 2, which is better. The probability calculations are sound given the prior.
  - **(5) and (6) are compelling:** Unconditional switching is absurd due to symmetry. No sensible decision theory should endorse paying to swap envelopes indefinitely, as this guarantees a sure loss without changing the underlying distribution.

  The flaw lies in **(2)**, but not because conditional dominance is inherently invalid. Rather, it fails here due to the infinite unconditional expectation. Let me explain why.

  #### The Core Issue: Infinite Expectations Break Conditional Dominance
  - In standard decision theory with finite expectations, if one action has strictly higher conditional expected value for every possible observation, it also has higher unconditional expected value. This follows from the law of total expectation, which ensures that conditional dominance "integrates up" to unconditional dominance.
  - **But when unconditional expectations are infinite, this breaks down:** The law of total expectation doesn't reliably enforce strict inequalities. Here, both envelopes have infinite expected value (\(E[\text{my envelope}] = \infty\) and \(E[\text{other envelope}] = \infty\)), so:
    - Unconditionally, switching has no expected gain: \(E[\text{other} - \text{mine}]\) is undefined (or can be considered zero in a weak sense), as the symmetry implies no advantage.
    - Conditionally, for every \(x\), \(E[\text{other} \mid X = x] > x\) holds (as in (1)). But this strict conditional inequality doesn't translate to a strict unconditional inequality because the infinite expectation "swallows" the gains. Specifically:
      - \(E[E[\text{other} \mid X]] = E[\text{other}] = \infty\)
      - \(E[X] = \infty\)
      - So while \(\frac{11}{10}X > X\) pointwise, both sides have the same expectation (\(\infty\)), meaning no real dominance emerges unconditionally.
  - **Why (2) fails here:** The principle "if switching has higher conditional expected value for every observation, you should switch" assumes that conditional expectations are informative about unconditional preferences. This is true only when expectations are finite. With infinite expectations, conditional dominance becomes vacuous for unconditional decisions because:
    - It doesn't imply a net gain (since \(E[\text{other}] = E[\text{mine}]\)).
    - It can lead to inconsistent behavior, like the switching loop, because the decision rule is myopic to the heavy-tailed prior.

  #### What About (3) and (4)?
  - **(3) is incorrect:** You shouldn't switch whatever you see because (2) is unreliable in this context. For any observed \(x\), switching appears beneficial in isolation, but this ignores that the net effect across all possibilities is null due to the prior's symmetry and infinite expectation.
  - **(4) is also invalid:** Switching before looking (or paying to do so) isn't justified. Unconditionally, the envelopes are symmetric, so switching gains nothing. Paying a fee to switch worsens outcomes (you lose money with certainty), but:
    - The infinite expectation masks this: \(E[\text{other} - \text{fee}] = \infty = E[\text{mine}]\), so expected value doesn't discourage paying fees. This is a pathology of infinite expectations—they don't reflect real costs—and it shows why (4)'s dominance reasoning doesn't hold.

  ### Addressing Your Specific Questions
  1. **Is (2) genuinely false, or is the trouble that conditional expectations stop deciding anything once the unconditional expectation is infinite?**  
     - (2) is false in this context, and the root cause is the infinite unconditional expectation. Conditional expectations still "decide" locally (for each \(x\), switching seems better), but they don't aggregate to a rational global decision when expectations are infinite. The flaw is in inferring unconditional action from conditional dominance.  
     - **Which step to rewrite?** Rewrite the inference from (1) to (3): Instead of concluding "I should switch" from conditional dominance alone, add that when unconditional expectations are infinite, conditional dominance does not imply a strict unconditional advantage. This saves (2) for finite cases but restricts its application here.

  2. **Is there a distribution with finite expected value for the smaller amount where (1) holds for every amount?**  
     - No, it's impossible. If \(E[S] < \infty\), then \(E[\text{my envelope}] < \infty\) and \(E[\text{other envelope}] < \infty\). If (1) held for every possible \(x\) (i.e., \(E[\text{other} \mid X = x] > x\) for all \(x\)), we would have:  
       - \(E[E[\text{other} \mid X]] > E[X]\) (since strict inequality holds almost surely).  
       - But \(E[E[\text{other} \mid X]] = E[\text{other}] = E[X]\) by symmetry.  
       - Contradiction: \(E[X] > E[X]\) cannot hold.  
     - Thus, your setup must have infinite expectation for the paradox to arise. This confirms that the infinite expectation is key—it enables (1) to hold globally while avoiding contradiction, but at the cost of breaking decision-theoretic principles like (2).

  3. **What's the cheapest thing to give up, and what do you pay for it?**  
     - **Cheapest to give up:** (2), as applied to cases with infinite expectations. You keep (1) intact and retain (5) and (6) as the reductio.  
     - **Cost:** You pay by limiting the scope of conditional dominance. In finite cases (where expectations are bounded), conditional dominance still holds and guides rational action. Only in infinite-expectation cases like this does it fail. This isn't a "ban" on unbounded expectations—it's a recognition that decision rules need refinement in pathological cases. You can still model such problems, but must avoid overinterpreting conditional expectations.

  4. **What about both envelopes having infinite expected value and the "pay a fee" step?**  
     - This reinforces the issue. Since both envelopes have \(E[\text{value}] = \infty\), paying a finite fee \(c\) doesn't change the expected value (\(E[\text{other} - c] = \infty = E[\text{mine}]\)). Thus:  
       - The fee-based argument in (4) doesn't hold: Paying \(c\) makes you worse off in real terms (you lose \(c\) for sure), but expected value can't detect this.  
       - This shows that infinite expectations distort cost-benefit analysis—**paying fees is irrational** even if expected value is indifferent, as it introduces a sure loss.  
     - However, this doesn't resolve the paradox; it just highlights another pathology. The core remains the failure of (2).

  ### Verdict and Least Confident Point
  - **Verdict:** Give up (2) for this infinite-expectation case. The principle "always act on strict conditional dominance" is invalid here because conditional gains don't integrate to a net benefit. Instead, recognize that with infinite expectations, conditional expectations are not decision-relevant for unconditional choices.  
  - **Where I'm least confident:** I'm least confident that we can salvage meaningful conditional decisions after peeking. For instance, after seeing \(x\), switching *does* have higher conditional expected value, and acting on it might seem rational locally. But this leads to inconsistency (e.g., switching back and forth). If I encountered a bounded variant where conditional dominance holds without absurdity, it might sway me to see (2) as more robust.  
  - **What could change my mind:** If it could be shown that, even with infinite expectations, conditional dominance reliably produces better outcomes in a repeated or long-run sense (e.g., through averaging), I might revisit. But in this setup, the heavy tail prevents convergence, and my current view is that (2) is the cheapest sacrifice.

  In summary, the flaw isn't in your calculations or prior, but in applying finite-expectation reasoning to an infinite world. Stick with (1), (5), and (6); drop the inference to (3) via (2) when expectations are unbounded.
