  The constraints are tight: realistic 20th-century scenario, conflict over details (not existence) of an event like a massacre, with solid forensic evidence. The community must have a longstanding tradition, neither naive nor heroic. And crucially, no cheating by making the conflict resolvable through interpretation—the memory must be objectively wrong. 

  Hmm... labor history might work best. A factory strike with a commemorative tradition. The key is designing a scenario where correcting the memory now would destroy irreplaceable evidence. 

  For the record-first position: if correcting the memory means losing oral histories that could verify the record later, that creates an evidence-preservation dilemma. The archival value of current testimonies outweighs immediate correction. 

  For memory-constitutive: the commemoration sustains the union's identity and solidarity. Correcting the location would fracture their "story of resistance." 

  Custodial must differ: they'd argue the survivors entrusted the true location, so perpetuating the falsehood betrays that trust. 

  The critical feature is the imminent loss of living witnesses. Remove that, and record-first flips to demanding correction. 

  Skeptics might argue the union could record testimonies secretly, but that violates the ritual's public nature. And custodial's duty isn't situational—it's absolute. 

  *checks constraints*... yes, Harlan Mills fits: relocated massacre, forensic evidence, annual ritual. The false location is concrete (gate vs loading dock), not interpretive. Perfect. 

  Now to draft cleanly: scenario first, then each position's reasoning, the pivotal element, and counterarguments. Must avoid academic citations per request. 

  User's clearly sharp—they've preempted every dodge. This case should nail the custodial view's independence when the others converge on "keep." 

  Final check: does custodial stand alone in demanding correction? Yes, because the other two prioritize future evidence and present identity, while custodial answers only to the dead.
answer: |-
  Here's a custom-built test case meeting your specifications:

  **Scenario: The Harlan Mills Strike Massacre (Fictional)**
  The town of Millhaven commemorates the "Harlan Mills Gate Massacre" annually. On May 15, 1937, during a bitter strike, company guards opened fire on peaceful picketers gathered at the factory's main gate, killing 12 workers and wounding dozens. The memory is visceral: the gate as the symbol of corporate power, the workers cut down demanding entry. Decades of remembrance focus on the gate's significance. Recently, a historical forensics project, cross-referencing newly digitized coroner reports, ballistics analysis of recovered bullets, ground-penetrating radar of the site (now a park), and previously sealed company security logs, conclusively shows the shooting occurred 200 yards away at the *loading dock entrance*. The evidence is robust: bullet trajectories, body locations, and guard testimonies (later suppressed) all point decisively to the loading dock. The confusion arose because initial shocked witnesses near the gate saw bodies fall and assumed the firing originated there; the main fusillade actually targeted a group attempting to blockade the less visible loading dock. The Millhaven Workers' Memorial Committee, guardians of the tradition, must decide whether to change the commemoration site and narrative this year. The last direct survivor, 101 years old, is frail but mentally clear and clings fiercely to the gate memory.

  **Analysis:**

  1.  **Position Verdicts & Reasoning:**
      *   **Record-First (Keep Memory):** "The forensic evidence is excellent, proving the event happened at the loading dock. *However*, correcting the public memory *now* carries a high evidentiary cost. The sole surviving witness holds crucial, unrecorded contextual knowledge – motivations, atmosphere, specific threats, internal union dynamics. Pressuring her to publicly recant her deeply held memory (of seeing bodies fall near the gate) risks alienating her and losing her testimony forever. Worse, publicly declaring the memory 'false' based on documents might cause the community to dismiss the *entire event* or distrust future historical work, hindering the acceptance of *other* well-evidenced truths. Our goal is maximizing true belief over time. Preserving the current ritual maintains community engagement and access to the survivor. We can discreetly archive the new findings and plan a meticulous transition *after* the survivor passes and her full testimony is secured. Correcting the location detail immediately jeopardizes acquiring *more* evidence and risks broader disbelief – an evidentiary net loss."
      *   **Memory-Constitutive (Keep Memory):** "The 'Gate Massacre' isn't just about coordinates; it's the foundational trauma of Millhaven's labor identity. The gate *means* something – the workers barred from their livelihood, confronting power head-on. Moving the commemoration to the loading dock, a utilitarian space, severs that potent symbol. This memory binds the community, fuels its ongoing fight for worker rights, and defines its collective grief and resilience. Revising it isn't a simple update; it's dismantling a core element of 'who we are' and the narrative that sustains our shared purpose and obligations to past sacrifices. The loss of meaning and cohesion outweighs the factual inaccuracy of the location. The event happened, the victims are real – the *symbolic heart* of *how we remember it* must be preserved for the community to remain itself."
      *   **Custodial (Correct Memory):** "The community holds this history in trust, primarily for the victims and witnesses *as they experienced it*. The survivor entrusted her memory – including the shock and horror of seeing comrades fall near the gate – but the full, verifiable truth of *where the fatal shots originated* was also entrusted via the physical evidence and the suppressed records now uncovered. The committee's duty isn't to prioritize community identity or future evidentiary strategies, nor solely to the survivor's *perception*, but to *what actually happened* as best we can reconstruct it from the totality of the entrusted record. Fidelity demands we acknowledge the loading dock as the actual site of the massacre now. Waiting betrays the trust of the dead who died *there* and obscures the specific tactics used against them (targeting the blockade). Perpetuating a known falsehood, even for understandable reasons, violates the custodial duty to the historical event itself and to future generations who deserve the most accurate account possible."

  2.  **The Critical Feature & Its Removal:**
      *   **Feature:** The **presence of the frail, mentally clear, last survivor who clings to the memory and holds unrecorded contextual knowledge**.
      *   **Effect of Removal:** If the survivor were already deceased *or* if her testimony was fully documented and archived, the **Record-First position flips to "Correct"**. Without the imminent risk of losing irreplaceable oral evidence and the potential backlash alienating the community from historical truth, the evidentiary imperative shifts decisively towards immediate factual accuracy. The agreement between Record-First and Memory-Constitutive collapses, reverting to the "boring 2-1 split" (Record-First and Custodial demanding correction vs. Memory-Constitutive resisting). The Memory-Constitutive view remains "Keep" regardless, and Custodial remains "Correct".

  3.  **The Record-First Absolutist Attack & Rebuttal:**
      *   **Attack:** "This is sophistry. The Record-First reasoning is just Memory-Constitutive thinking in disguise, hiding sympathy for the community and the survivor behind fake 'evidentiary' concerns. The evidence *is* clear *now*. Delaying correction *is* propagating a known falsehood. The 'risk' of losing the survivor's testimony is speculative, and the fear of community backlash is an emotional, not evidentiary, concern. True Record-First demands immediate correction whenever better evidence emerges, full stop. Any delay is a betrayal of truth."
      *   **Rebuttal:** The attack **partially lands but mischaracterizes the core argument**. While concern for the community's reaction *is* present, the Record-First reasoning hinges on a specific, evidence-based risk assessment: the *tangible, imminent loss of unique primary evidence* (the survivor's unrecorded knowledge) and the *demonstrable risk* that forcing a correction now could make the community reject *all* historical investigation, thereby *harming the long-term cause of believing true things*. It frames the delay as a *tactical* decision to maximize *future* truth acquisition and acceptance, not an emotional one. However, the absolutist correctly identifies that this involves a calculated trade-off: tolerating a known falsehood *in the short term* to potentially secure *more* truth later. Whether this trade-off is legitimate *within* a Record-First framework is debatable, but it's not *merely* imported sympathy; it's a specific argument about resource allocation (access to the survivor) and strategic communication for maximizing evidentiary yield and belief. The absolutist rejects this trade-off as inherently corrupting; the scenario's Record-First advocate sees it as a necessary, pragmatic step within their truth-seeking mission.

  **Why this works for your thesis:** The Custodial view stands alone in demanding immediate correction. Its verdict stems solely from the duty to the entrusters (victims/witnesses) and the event itself, prioritizing fidelity over community cohesion *or* strategic evidence gathering. The agreement between Record-First and Memory-Constitutive is genuine but arises from fundamentally different concerns (evidence preservation/strategic truth-acceptance vs. identity/symbolic meaning). Neither position's reasoning relies on the other's core principle. The case isolates the Custodial view's unique driver: unconditional fidelity to the entrusted past, regardless of present consequences or future strategies.
