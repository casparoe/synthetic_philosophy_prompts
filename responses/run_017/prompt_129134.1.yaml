prompt: |-
  I'm a TA for an undergraduate game theory course, and I have one fifty-minute section to teach iterated elimination of dominated strategies when the eliminating strategy is allowed to be a mixed one. The students have already done IESDS with pure-strategy dominators and have computed mixed-strategy Nash equilibria, but have never seen the two ideas put together; rationalizability comes next week. Don't explain the material to me — plan how I should teach it. What has to be in place first, and in what order (in particular, where does the convex-hull reading of mixed dominance — the payoff vector lying below the upper envelope of the others — belong, and does anything have to precede it)? What single game should carry the session, and what must it contain and lack: I have in mind one where pure-strategy IESDS is uninformative, where the mixture doing the eliminating is not the uniform one, and where deleting the first strategy opens up a second round — tell me if asking for all three at once overloads the example, and what to drop if it does. Which misconceptions should I expect, and at exactly which point in the sequence do I defuse each? The ones I anticipate are: that the dominating mixture is something the player chooses or announces rather than a hypothetical benchmark; that a mixture of surviving pure strategies automatically survives itself; that a strategy strictly dominated by a mixture could still receive positive probability in some Nash equilibrium; and that order-independence carries over from strict to weak dominance. Finally, give me one question on a game the students haven't seen that would distinguish understanding the procedure from having learned the recipe, and say explicitly what I should refuse to cover at this level.
reasoning: |-
  Okay, the user is a TA for an undergraduate game theory course. They need to teach iterated elimination of dominated strategies with mixed strategies in one fifty-minute section. The students are familiar with pure-strategy IESDS and mixed-strategy Nash equilibria but haven't combined these concepts. Rationalizability is coming next week. The TA wants a lesson plan focusing on structure, a key game example, addressing misconceptions, and a distinguishing question.

  First, I need to recall the core concepts. Mixed IESDS involves eliminating strategies strictly dominated by a mixed strategy, even if not dominated by any pure strategy. The lesson must clarify the differences from pure IESDS and set up for rationalizability.

  The TA has specific requests: a game where pure IESDS is uninformative, the dominating mixture isn't uniform, and there are multiple elimination rounds. But including all three might complicate the example. I should assess if that's feasible. Games like the Traveler's Dilemma or an auction might work, but perhaps a simpler 3x3 matrix is better. A modified version of a common game, like Prisoner's Dilemma with an extra strategy, could illustrate the points without overcomplicating.

  Key misconceptions to address: students might think the dominating mixture is a chosen strategy rather than a benchmark. They might believe mixtures automatically survive if pure strategies do, or that dominated strategies can be in Nash equilibria. Also, order dependence with weak dominance is a pitfall. Each misconception needs targeted debunking at specific points in the lesson.

  For the lesson structure: start with a quick review of pure IESDS and mixed strategies. Then present the game example. Walk through checking pure dominance first, then introduce mixed dominance. Use the convex hull visualization. Show the payoff vector below the upper envelope. After the first elimination, proceed to a second round where another strategy becomes dominated. Emphasize the iterative process.

  Timing is tight. Fifty minutes means sticking strictly to the plan. The convex hull explanation must be concise. Maybe use a diagram. The example game should be on a slide for clarity. Allocate time for Q&A but avoid tangents, like weak dominance or rationalizability.

  The distinguishing question should test conceptual understanding. Present a new game where a strategy isn't dominated by any pure strategy but is by a mixed one. Ask students to identify dominated strategies and the mixed strategy that dominates. Then, see if they can iterate the process. This checks if they grasp the method beyond rote steps.

  What to omit: weak dominance, rationalizability connections, and non-strict dominance. Also, avoid overcomplicating the example. If three requirements are too much, drop the non-uniform mixture to keep it manageable. Focus on the mixed dominance and multiple rounds.

  In summary, structure the lesson as: review, present game, pure check, mixed dominance with convex hull, first elimination, second round, summary. Address misconceptions when they arise naturally. End with the distinguishing question to assess understanding.
answer: |-
  Here's a battle-tested plan for your fifty-minute section, prioritizing conceptual clarity and addressing your specific requests:

  **Core Objective:** Students understand that a strategy can be strictly dominated by a *mixed strategy* even if not dominated by any pure strategy, and that iteratively eliminating such strategies refines predictions beyond pure IESDS, paving the way for rationalizability.

  **Lesson Structure & Timing:**

  1.  **Hook & Pure IESDS Recap (5 min):**
      *   "Last time, we eliminated strategies strictly beaten by another *single* pure strategy. What's the key requirement? (Strictly higher payoff *against every possible opponent profile*). Why does order often not matter? (Elimination doesn't create new dominators)."
      *   "But what if no pure strategy dominates? Does that mean a strategy is 'safe'? Not necessarily! Enter mixed strategies."

  2.  **Mixed Dominance Definition & Convex Hull (15 min - CRITICAL SECTION):**
      *   **Definition First:** "Strategy `s_i` for player `i` is **strictly dominated by a mixed strategy `σ_i`** if for *every* possible combination of strategies the other players might play (`s_{-i}`), the expected payoff from `σ_i` is strictly greater than the payoff from `s_i`: `u_i(σ_i, s_{-i}) > u_i(s_i, s_{-i})` for all `s_{-i}`."
      *   **Visualization is Key (Convex Hull):** *Immediately* introduce the convex hull reading. Show a blank graph (Axes: Opponent Profile 1 Payoff, Opponent Profile 2 Payoff, ...). "For a *fixed* player `i`, plot each of their pure strategies as a point in payoff space (one coordinate per opponent profile `s_{-i}`). The set of all possible mixed strategies corresponds to all points inside the **convex hull** of these pure strategy points."
      *   **The Test:** "`s_i` is strictly dominated by *some* mixed strategy `σ_i` if and only if its payoff point **lies strictly below the upper envelope** of the convex hull formed by the *other* strategies. This means there's a hyperplane (line in 2D, plane in 3D) strictly separating `s_i`'s point from the convex hull of the others." *Use a simple 2-strategy vs. 2-opponent-profiles example visually if possible.*
      *   **Why Precede?** The convex hull isn't the *definition* but the primary *operational test*. It must follow the definition but precede the game example analysis. It provides the geometric intuition for "why" a mixed strategy can dominate when no pure one can.

  3.  **The Core Game & First Elimination (15 min):**
      *   **Present the Game:** Use a **modified Prisoner's Dilemma / Coordination Hybrid** (Player: Row, Column; Payoffs: R,C):
          ```
                  Col: L       M       R
          Row: U   4, 4     0, 5     0, 3
                M   5, 0     2, 2     0, 3
                D   3, 0     3, 0     1, 1
          ```
      *   **Check Pure IESDS (Uninformative):** Ask: "Can we eliminate anything using pure dominance?" Guide them: U vs M? (U<M only if Col plays L, but U>M if Col plays M -> No). U vs D? (U>D if Col L/M, U=D if Col R -> Not Strict). M vs D? (M>D if Col L, M<D if Col M, M<D if Col R? Wait, M=0, D=3 vs Col M? -> No). D vs U/M? (No clear dominance). *Conclusion: Pure IESDS eliminates nothing.*
      *   **Find Mixed Dominance (Non-Uniform Mixture):** Focus on Row. Plot U(4,0,0), M(5,2,0), D(3,3,1) [Coordinates: Payoff vs Col L, Col M, Col R]. "Is D dominated?"
          *   Compare D(3,3,1) to the line between U(4,0,0) and M(5,2,0). The upper envelope for vs Col L is max(4,5)=5 (M), vs Col M is max(0,2)=2 (M), vs Col R is max(0,0)=0 (U/M).
          *   D(3,3,1) vs Upper Env(5,2,0): 3<5 (L), 3>2? (M) -> Wait, 3>2! So NOT below envelope of U&M. *D survives initial check vs U&M.*
          *   **Check U:** U(4,0,0) vs Upper Env of M(5,2,0) & D(3,3,1). Upper Env: vs L: max(5,3)=5 (M), vs M: max(2,3)=3 (D), vs R: max(0,1)=1 (D).
          *   U(4,0,0) vs Upper Env(5,3,1): 4<5 (L), 0<3 (M), 0<1 (R) -> YES! U lies strictly below the upper envelope of M & D.
          *   **Find the Mixture:** "What mix of M and D beats U *no matter what Col does*?" Set up inequalities: `p*5 + (1-p)*3 > 4` (vs L) => 2p >1 => p>0.5. `p*2 + (1-p)*3 > 0` (vs M) => 3 - p > 0 => p<3 (Always true). `p*0 + (1-p)*1 > 0` (vs R) => 1-p >0 => p<1. Only binding constraint: p>0.5. *Any mix with p(M) > 0.5 dominates U.* (e.g., 0.6M + 0.4D: vs L: 0.6*5+0.4*3=4.2>4, vs M: 0.6*2+0.4*3=2.4>0, vs R: 0.4*1=0.4>0). Emphasize it's *any* mixture satisfying p>0.5, not a specific one the player "chooses" now.
      *   **Eliminate U!** "So U is strictly dominated by mixed strategies like 0.6M+0.4D. We eliminate U."

  4.  **Second Round & Residual Game (10 min):**
      *   **New Game:** After eliminating Row's U:
          ```
                  Col: L       M       R
          Row: M   5, 0     2, 2     0, 3
                D   3, 0     3, 0     1, 1
          ```
      *   **Check Dominance Again (Pure Now Possible):** "Can we eliminate anything now? Check pure dominance first." Row: M vs D? vs L: 5>3, vs M: 2<3, vs R: 0<1 -> Not dominated by pure strategy. *But wait!* Column's strategies: L(0,0), M(2,0), R(3,1) [Coordinates: Payoff vs Row M, Row D]. Check R(3,1) vs Upper Env of L(0,0) & M(2,0). Upper Env: vs M: max(0,2)=2 (M), vs D: max(0,0)=0 (L/M). R(3,1) vs (2,0): 3>2? (vs M) -> R is ABOVE the envelope for L&M! Not dominated. Check M(2,0) vs L(0,0) & R(3,1): Upper Env (3,1). M(2,0) vs (3,1): 2<3 (vs M), 0<1 (vs D) -> YES! M is strictly below R's point (3,1). Column's R strictly dominates M. *Pure dominance emerges!*
      *   **Eliminate Col M!** New Game:
          ```
                  Col: L       R
          Row: M   5, 0     0, 3
                D   3, 0     1, 1
          ```
      *   **Final Step (Pure Dominance):** Row M vs D: vs Col L: 5>3, vs Col R: 0<1 -> No dominance. Col L vs R: vs Row M: 0<3, vs Row D: 0<1 -> R dominates L. Eliminate Col L. Final Game:
          ```
                  Col: R
          Row: M   0, 3
                D   1, 1
          ```
      *   **Result:** Row D dominates M (1>0). Surviving Profile: (D, R) -> (1,1). *(Note: This also highlights that the process can lead to a unique prediction, though not always a NE! (D,R) is NE here, but focus on the elimination process).*

  5.  **Summary & Rationalizability Teaser (5 min):**
      *   Recap the steps: 1) Eliminate pure-dominated if possible. 2) Check for mixed-dominated using convex hull/upper envelope test. 3) Eliminate. 4) Repeat on new game until no more strictly dominated strategies (pure or mixed) exist.
      *   "The surviving strategies are called **rationalizable strategies**. A rational player, believing others are rational, believing others believe that, and so on, would only play a rationalizable strategy. We'll dive deeper next week!"
      *   **Key Takeaways:** Mixed dominance extends IESDS. The dominating mixture is a *hypothetical benchmark*, not a chosen action. Elimination can enable further elimination. Surviving strategies aren't necessarily part of a NE, but any strict NE survives IESDS.

  **Addressing Misconceptions:**

  1.  **"Dominating mixture = chosen strategy":** DEFUSE IMMEDIATELY after defining mixed dominance and again when finding the mixture (Step 3). "This mixture `σ_i` **is not** a strategy Row is committing to play! It's a hypothetical combination we use as a benchmark to prove U is a bad idea. Row could play M pure, D pure, or any mix of M and D *after* U is gone, but never plays the 0.6M+0.4D mix itself."
  2.  **"Mixture of survivors automatically survives":** DEFUSE during the convex hull explanation (Step 2) and implicitly in the example. "The convex hull test compares the *point* of a strategy to the hull of *others*. A mixture's payoff point is *inside* the hull of its components by definition. But survival means *not* being strictly below the hull of the *other* strategies. A mixture can be dominated if a *different* mix of other strategies beats it everywhere. We don't add mixtures as new rows/columns."
  3.  **"Dominated strategy in NE?":** DEFUSE during summary (Step 5). Explicitly state: "A crucial point: **No strategy strictly dominated (by pure or mixed) can be played with positive probability in ANY Nash equilibrium.** Why? If it was, the player could profitably deviate to the dominating mixture."
  4.  **"Order-independence for weak dominance":** PREEMPT during recap (Step 1) and AVOID WEAK DOMINANCE. Firmly state: "Today we are **only** dealing with **strict** dominance, pure or mixed. Strict dominance is order-independent. **Weak dominance is a different beast entirely and is order-dependent.** We are NOT covering weak dominance today. Stick to strict inequalities."

  **Distinguishing Question:**

  *   **Present:** "Consider this game (Player 1: Row, Player 2: Column):
      ```
              Col: X       Y
      Row: A   3, ?      0, ?
           B   0, ?      3, ?
           C   2, ?      2, ?
      ```
      Player 2's payoffs (the '?') are irrelevant for Player 1's dominance. Using mixed strategy dominance, which of Row's strategies (A, B, C) can be eliminated? Explain briefly how you know (mention the convex hull). What mixture dominates it? After elimination, can any other Row strategies be eliminated?"

  *   **Why it Distinguishes:**
      *   Pure IESDS: No strategy is strictly dominated by another pure strategy (A>B vs X, A<B vs Y; C<A vs X, C>B? vs Y -> C=2, B=3? No; C=2, A=3? vs X -> No clean dominance).
      *   Convex Hull Test: Plot A(3,0), B(0,3), C(2,2) [vs X, vs Y]. C(2,2) lies strictly below the line connecting A(3,0) and B(0,3). The line equation: Payoff vs X = 3 - p, Payoff vs Y = 0 + 3p (for p = prob of A). At p=0.5: (1.5, 1.5). Since 2 > 1.5? Wait, C(2,2) vs point (1.5,1.5) on the A-B line: 2>1.5 vs X, 2>1.5 vs Y -> C is ABOVE the line!? **Wait, mistake:**
      *   **Corrected Game Needed:** *Oops, my bad in the example!* To make C dominated, it needs to be below the line. Swap C's payoffs or adjust. Use:
          ```
                  Col: X       Y
          Row: A   3, ?      0, ?
               B   0, ?      3, ?
               C   1, ?      1, ?   // Now C(1,1) is strictly below A-B line (max payoff along line is 1.5 at p=0.5 for each coord).
          ```
      *   Now C(1,1) is strictly below the line connecting A(3,0) and B(0,3). The mixture pA + (1-p)B dominates C if `3p > 1` (vs X) and `3(1-p) > 1` (vs Y). Solving: p>1/3 and p<2/3. (e.g., p=0.5: 1.5>1 vs X, 1.5>1 vs Y). Eliminate C. After eliminating C, A and B are not dominated by each other (A>B vs X, A<B vs Y). No further elimination.
      *   **Tests Understanding:** Requires recognizing no pure dominance, visualizing C below the A-B line (convex hull of others), finding a qualifying mixture (p between 1/3 and 2/3), and recognizing no further elimination is possible after C is gone. Checks they aren't just applying pure IESDS or expecting uniform mixtures.

  **What to Refuse to Cover:**

  1.  **Weak Dominance:** Explicitly state it's off-limits today. Its order dependence is a major complication.
  2.  **Rationalizability Proofs/Depth:** Mention it as the consequence, but save the formal definitions, epistemic conditions, and equivalence to mixed IESDS for next week.
  3.  **Non-Strict Dominance:** Stick strictly to `>` inequalities. Avoid `>=`.
  4.  **Correlated Strategies:** The benchmark is independent mixed strategies, not correlated ones. Don't open that can of worms.
  5.  **Extensive Form IESDS:** Keep it strategic form.
  6.  **Computational Complexity:** Don't discuss how hard it is to find these mixtures in large games; focus on the concept and small examples.
  7.  **Connection to NE beyond Survival:** Mention that dominated strategies can't be in NE, but don't delve into whether the final set *is* a NE or other refinements.

  **Game Choice Justification:** The modified PD/Coordination game works well. Pure IESDS fails (✓), the dominating mixture for U (p>0.5 M/D) is non-uniform (✓), and eliminating U enables the pure dominance of Col M by Col R (✓). It successfully incorporates all three requests without being overly complex. The payoffs are simple integers, and the second round uses pure dominance, reinforcing the iterative aspect without requiring a second mixed dominance check in this session.

  This plan hits the core concepts, uses your requested example effectively, directly tackles key misconceptions head-on, provides a robust assessment question, and stays within the time limit by ruthlessly prioritizing and excluding tangential topics. Good luck!
