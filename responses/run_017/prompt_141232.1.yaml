prompt: |-
  I've just come out of a long argument with my closest friend, who is leaving a job she is good at to open a small restaurant. I kept saying that the base rate on that kind of venture is grim and that this is where any sane probability has to start; she kept saying that her case is relevantly different and that I was being pessimistic by reflex rather than for a reason. I went home and tried to write down the general position I was appealing to, and reading it back I cannot tell which parts of it can survive together. Here is where I think I have landed:

  (1) Where a case can be placed in a reference class with decent frequency data, the base rate is the starting point for my probability, and case-specific evidence should move it only if I could have specified that evidence in advance as something that would have separated the successes from the failures within that class.

  (2) Some cases are genuinely unprecedented, with nothing usable to serve as a base rate, and there the inside view is all one has; relying on it in that situation is not arrogance but the absence of an alternative.

  (3) Every case belongs to indefinitely many reference classes and the case itself does not single out the right one, so there is an irreducible judgment in applying the outside view at all.

  (4) When someone roughly as well-informed as I am disagrees with me, I should move substantially toward them, and holding my ground is a failure of modesty; though I do take my own track record on the kind of call in question, where I have one, to be a reason to hold more ground than I otherwise would.

  (5) I should still spend most of my analytical effort on the inside view, on working out the specific causal story, even though (1) says the outside view should dominate the number I end up with.

  (6) Applied to her: I would put the chance of failure within three years at roughly the base rate, and I also think she should do it, and I told her I would invest.

  Please audit the set rather than argue for any part of it. Which pairs are genuinely in tension and how badly, which only appear to be, and for each real tension what the cheapest revision would be and what that revision would cost me elsewhere in the set. Rank the tensions by severity rather than listing them flat. If something here has to go, tell me which thing it is; but do not assume from the way I have written this that I already know where the problem is, or that the item I would give up is the one you would pick.
reasoning: |-
  Okay, let me start by unraveling this user's conundrum. They've had a heated argument with their friend about her career switch to opening a restaurant, and now they're questioning their own logic. The user presents six principles about probability assessment and decision-making. My job is to audit these principles for internal consistency without arguing their validity.

  First, I notice tension between principle (1) and (3). (1) insists on strict base-rate anchoring, while (3) admits reference class selection requires subjective judgment. That's a fundamental conflict - you can't demand objective anchoring while acknowledging the anchor point is subjective. The cheapest fix might be softening (1) to acknowledge some judgment in class selection, but that costs some objectivity.

  The next big clash is between (1) and (5). (1) says base rates should dominate the final probability, but (5) says spend most effort on case-specific analysis. If outside view dominates, why prioritize inside view work? This might be resolved by clarifying that inside view informs how much to adjust from base rate, not replace it.

  Then there's (1) versus (6) - if base rate determines failure probability, why invest anyway? This reveals unstated values: the user clearly separates probability assessment from action recommendation. That's actually consistent if we recognize decisions involve more than probabilities.

  (4) about deference seems mostly compatible, though there's minor friction with track record claims. And (2) about unprecedented cases feels isolated - almost too permissive compared to strict (1).

  The user's emotional state matters here. They're intellectually honest enough to question their position after an argument, yet still want to support their friend ("I told her I would invest"). The core conflict seems to be between their rational framework and their personal loyalty. The principles might benefit from explicitly separating probability estimates from decision factors like passion or life goals.

  Looking at the restaurant example: maybe the user needs to admit that "relevantly different" could mean a better reference class than generic restaurants, like "restaurants opened by people with her specific skills." But principle (3) already hints at this subjectivity. The real tension is between wanting objective certainty and acknowledging unavoidable judgment - which might be the deepest lesson here.
answer: |-
  Here is an audit of your principles, ranking tensions by severity and suggesting minimal-cost revisions:

  **Severity Rank 1: Tension between (1) and (3)**
  *   **Tension:** (1) demands strict anchoring to a base rate derived from a "decent" reference class, treating it as the objective starting point. (3) states that reference class selection is inherently subjective ("irreducible judgment") because cases belong to *many* classes.
  *   **Nature:** Fundamental conflict between objectivity and subjectivity. (1) implies the "right" class exists for anchoring; (3) denies this.
  *   **Cheapest Revision:** Soften (1) to: *"Where a case can be placed in a reference class with decent frequency data, the base rate provides a crucial anchor for my probability. Case-specific evidence should move it significantly only if I could have specified that evidence in advance as strongly predictive within that class, *acknowledging the judgment involved in class selection*."*
  *   **Cost:** Weakens the perceived objectivity and dominance of the base rate in (1). Makes "starting point" less rigid.

  **Severity Rank 2: Tension between (1) and (5)**
  *   **Tension:** (1) implies the outside view (base rate) *should dominate* ("the starting point... should move it only if...") the final probability. (5) states you should spend *most analytical effort* on the inside view (specific causal story).
  *   **Nature:** Effort allocation vs. Probative weight. If the outside view dominates the final number, why devote *most* effort to the inside view? This suggests the inside view might be more important for *understanding* or *identifying relevant adjustments* than (1) allows.
  *   **Cheapest Revision:** Clarify (5) to: *"I should still spend significant analytical effort on the inside view... even though (1) dictates that the outside view heavily constrains the final probability estimate, primarily to rigorously test potential reasons for significant deviation from the base rate."*
  *   **Cost:** Slightly diminishes the emphasis on "most" effort for the inside view, framing it as essential for validating adjustments, not challenging dominance.

  **Severity Rank 3: Tension between (1) and (6)**
  *   **Tension:** (6) applies (1) rigidly: "I would put the chance of failure... at roughly the base rate." Yet, you invested. This implies factors *outside* your probability assessment (values, support, belief in her resolve) dominate the action decision, clashing with (1)'s implication that the base-rate-derived probability *should* dominate judgment.
  *   **Nature:** Probability assessment vs. Action/Decision. (1) focuses on *belief formation*. (6) shows belief doesn't dictate action.
  *   **Cheapest Revision:** Acknowledge this separation implicitly in (1) or explicitly elsewhere. No direct rewrite needed if you accept that (1) governs *probability estimates*, not necessarily *decisions*. Your actions in (6) are consistent with separating belief from action.
  *   **Cost:** Requires accepting that the "dominance" in (1) is over the *probability number*, not the *decision*. This might feel like splitting hairs but preserves both.

  **Severity Rank 4: Tension between (3) and Rigorous Application of (1)**
  *   **Tension:** If reference class selection is inherently judgmental (3), how can one rigorously apply (1)'s requirement to anchor to a base rate and only move it with pre-specifiable evidence? The subjectivity of class choice undermines the objectivity presumed in (1).
  *   **Nature:** Foundational uncertainty vs. Procedural rigor. (3) highlights the instability of the very foundation (reference class) (1) builds upon.
  *   **Cheapest Revision:** Already partially addressed by the revision to (1) suggested in Rank 1. Accepting that (3) *qualifies* (1) is the minimal cost. Emphasize "decent" in (1) implies a class selected with reasonable judgment.
  *   **Cost:** Further erodes the sense that (1) provides a truly objective anchor. Makes "starting point" more contingent.

  **Severity Rank 5: Minor Tension between (4) and Track Record (in 4)**
  *   **Tension:** (4) mandates substantial movement towards a well-informed disagreeing peer ("failure of modesty" not to). However, it carves out an exception for your own track record, allowing you to "hold more ground." This exception risks undermining the core deference principle, especially if over-applied.
  *   **Nature:** Absolute deference vs. Self-trust based on evidence. Balancing humility with legitimate expertise.
  *   **Cheapest Revision:** Qualify the exception in (4): *"...holding my ground is generally a failure of modesty; however, a *demonstrably strong* personal track record *specifically relevant to the domain in question* provides a justified reason to moderate the degree of movement."*
  *   **Cost:** Makes the exception harder to invoke casually, requiring stronger evidence for track record relevance.

  **Apparent Tensions (Not Genuine Conflicts):**

  1.  **(2) and (1):** These address distinct scenarios (unprecedented vs. classifiable). They are complementary, not conflicting. (2) explicitly defines the situation where (1) *doesn't* apply.
  2.  **(4) and Overall Framework:** Deferring to others on probability judgments (4) is compatible with the other principles; it's a meta-principle about belief updating, not conflicting with how those beliefs are formed (1-3,5).

  **The Item Most Likely to Need Revision/Softening: (1)**

  *   **Why:** It's the most rigid and creates the most friction. Its demand for anchoring and strict criteria for moving away clashes directly with the subjectivity inherent in reference class selection (3), makes the effort on the inside view (5) seem inefficient if it rarely changes the number, and creates the starkest contrast with your supportive action in (6). The revisions proposed for Rank 1 and Rank 2 tensions primarily target (1) or its interpretation.
  *   **Cost of Revising (1):** You lose the clean, seemingly objective "start here" rule. Probability assessment becomes explicitly more judgmental from the outset. However, this revision aligns better with the realities acknowledged in (3) and your actions in (6). It better reflects the actual process you seem to endorse: base rates are powerful constraints and anchors, but their application and the evaluation of case-specific evidence involve unavoidable judgment.

  **Conclusion:**

  Your framework is largely coherent but built on a tension between the *desire* for objective anchoring via base rates (1) and the *reality* of subjective judgment in applying them (3) and in making final decisions (6). The most severe tensions stem from this core. The cheapest overall revision is to **soften Principle (1)** significantly, explicitly acknowledging the role of judgment in reference class selection and clarifying that the inside view's purpose (5) is to rigorously test potential *significant* deviations from the base rate anchor. This preserves the core insights of base rate respect, acknowledges subjectivity, explains your effort allocation, and aligns with your supportive action despite a pessimistic probability estimate. Principle (4) remains compatible, requiring only minor tightening of its exception clause. Principle (2) stands uncontested.
