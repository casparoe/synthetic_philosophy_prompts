  But the novel also resists a purely philosophical reading. Kathy’s acceptance might imply that the doing/allowing framework doesn’t capture her experience. Her focus on relationships over rebellion suggests the distinction might be irrelevant to victims within such systems. This challenges students to consider the limitations of traditional ethics in real-world contexts.

