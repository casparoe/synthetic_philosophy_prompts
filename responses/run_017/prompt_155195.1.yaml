  Okay, the user is on a Charter Review Commission for a home-rule city with about 80,000 residents. They need a decision memo on whether to extend voting rights to non-citizen residents, including green-card holders, visa holders, and undocumented residents. The commission has already approved lowering the voting age to 16 and making voting compulsory with a small fine. The memo needs to address three key issues: the conflict between compulsory voting and non-citizens, existing voting rights for non-resident property owners, and the different categories of non-citizens.

  First, I need to understand the core principle. The user wants a consistent principle that applies to all groups: 16-year-olds, non-resident property owners, and the three types of non-citizens. The principle must handle the "circularity problem" where the current electorate decides who gets to vote. The all-affected principle is tricky because non-resident property owners are affected but don't live there. Maybe "subject to jurisdiction" is better, meaning anyone under the city's laws and policies should have a say. That covers residents regardless of citizenship and excludes non-residents who only have economic ties.

  Next, compulsory voting. Requiring non-citizens to vote, especially those here unlawfully, could be seen as conscription. But creating a two-tier system by exempting them is problematic. The solution might be to enfranchise all residents but make voting voluntary for non-citizens, avoiding compulsion for those at risk.

  For non-resident property owners, the current practice conflicts with the proposed principle. The memo should recommend removing their voting rights to maintain consistency. This might be controversial but necessary for principle integrity.

  The different non-citizen categories: green-card holders who chose not to naturalize, those unable to naturalize, and undocumented residents. The principle treats them all as subject to jurisdiction, so they should vote. But for undocumented, the risk of exposure is real. The memo should suggest confidential voter registration to protect them, possibly through the city clerk's office without sharing data.

  The circularity objection: the current electorate deciding who is included. The response is that the commission's role is to align the charter with democratic principles, not just reflect current preferences. Framing it as a moral imperative based on jurisdiction can justify the change.

  State pre-emption is a risk. The memo needs a contingency: if the state bans non-citizen voting, focus on other reforms like confidential registration or advocating for state law changes.

  Structure the memo with a clear recommendation: enfranchise all residents 16+, voluntary for non-citizens, remove non-resident voting. Address each group, explain the principle, handle objections, and outline implementation steps. Keep it principled, avoid empirical data, and ensure logical consistency throughout.
answer: |-
  ## Charter Review Commission: Recommendation on Non-Citizen Municipal Franchise

  **To:** Charter Review Commission Members, City Council
  **From:** [Your Name/Commission Designee], Charter Review Commission
  **Date:** October 26, 2023
  **Subject:** Recommendation on Extending Municipal Franchise to Non-Citizen Residents & Associated Amendments

  **I. BOTTOM LINE RECOMMENDATION**

  **Adopt** an amendment extending the municipal franchise to all resident individuals aged sixteen (16) and older, regardless of citizenship status. **Do not apply** the compulsory voting requirement to non-citizen residents. **Conditionally adopt** a companion amendment removing the franchise from non-resident commercial property owners in downtown improvement district elections. **Implementation Path:** Draft language incorporating these changes for final Commission vote in January. If approved, forward to Council for ordinance drafting by February, aiming for Council vote by March. Implementation target: Next municipal election cycle (specify date/year if known).

  **(Contingency for State Pre-emption:** If the state legislature pre-empts home-rule control of the franchise *before* adoption, **defer** the non-citizen franchise amendment and recommend the Council vigorously advocate for municipal authority or pursue state legislative change. Proceed with removing the non-resident property owner franchise and confidential registration efforts as permissible.)

  **II. GOVERNING PRINCIPLE: THE JURISDICTIONAL COMMUNITY**

  The fundamental question is: **Who constitutes the enduring community subject to the city's sovereign authority and daily governance?** We propose the principle of the **"Jurisdictional Community":**

  *   **The municipal electorate should consist of those individuals who are *subject to the city's full jurisdiction* as a primary place of residence, and who bear the ordinary burdens and receive the ordinary benefits of city life, irrespective of formal national citizenship.**

  This principle emphasizes:
  1.  **Subjection to Authority:** Being governed by city laws, regulations, police, courts, and code enforcement.
  2.  **Residence as the Nexus:** Establishing the city as the primary locus of daily life, work, education, and family.
  3.  **Shared Civic Experience:** Experiencing the direct, tangible consequences of municipal decisions (taxation through rent/sales, school quality, transit access, public safety, housing conditions).

  **III. APPLICATION OF THE PRINCIPLE TO SPECIFIC GROUPS**

  1.  **Resident Citizens (Existing & Newly Enfranchised 16/17 Year Olds):** Clearly meet all criteria – subject to jurisdiction, resident, bearing burdens/benefits. Compulsory voting applies as a civic duty inherent in membership.
  2.  **Non-Citizen Residents (All Three Categories):**
      *   **Green-Card Holders/Long-Term Visa Holders:** Are subject to city jurisdiction, are residents, pay taxes (directly or via rent), use services, and are deeply embedded in the community. National citizenship status is irrelevant to their *municipal* lived experience.
      *   **Residents Without Status:** Are *intensely* subject to city jurisdiction (especially policing, code enforcement), are residents by any practical definition, pay sales taxes and property taxes via rent, use services (often critically), and their lives are profoundly shaped by city policies. Their lack of federal immigration status does not negate their de facto membership in the *municipal* jurisdictional community; it often makes them *more* vulnerable to its actions.
      *   **Conclusion:** All resident non-citizens meet the core criteria of the Jurisdictional Community principle and should be enfranchised.
  3.  **Non-Resident Commercial Property Owners:** While economically invested and arguably "affected," they are *not* primarily subject to the city's jurisdiction as residents. They do not experience daily life under its laws, use its core services (schools, transit, routine policing) as residents, or bear the burdens of residency. Their primary community and locus of governance is elsewhere. Their existing franchise is an anomaly inconsistent with the Jurisdictional Community principle. **Recommendation:** Amend the charter to remove their voting rights in downtown improvement district elections. Their interests can be represented through standard business association advocacy and input mechanisms available to all stakeholders, not the ballot.

  **IV. RESOLVING THE COMPULSORY VOTING DILEMMA**

  *   **The Conflict:** Applying compulsory voting to non-citizens, particularly those who cannot naturalize or face severe risks, *does* raise legitimate concerns of "conscription." Exemption creates a problematic two-tiered residency.
  *   **Resolution:** **Do not apply the compulsory voting requirement to non-citizen residents.** Voting for them remains a **right**, not a compulsory duty.
  *   **Justification:**
      *   **Citizenship Distinction:** Compulsory voting is most coherently grounded in the specific reciprocal duties of *national* citizenship. Municipal residency, while constituting membership in the *local* jurisdictional community, does not carry the same historical and legal weight of obligation as national citizenship, especially regarding the franchise.
      *   **Avoiding Coercion:** Mandating participation for individuals who may face unique burdens (e.g., fear of exposure for those without status) or who lack a formalized path to national membership is inappropriate and potentially harmful. It risks turning a right into a burden.
      *   **Preserving the Right's Value:** Maintaining the franchise as a voluntary right for non-citizens avoids the perception of coercion while still affirming their fundamental membership and stake in the community. It eliminates the "lesser tier" by granting the *right* equally; the *duty* attaches only to the specific bond of national citizenship.
      *   **Practicality:** Enforcing fines against vulnerable populations is ethically dubious and likely operationally fraught.

  **V. ADDRESSING THE CIRCULARITY OBJECTION**

  *   **The Strongest Objection:** "The existing electorate, defined by current rules, is the only legitimate body to decide who 'the people' are. Changing the electorate based on a principle appealing to 'the people's' will is circular and undemocratic, as it predetermines the answer by redefining the questioner."
  *   **Why It Loses:**
      1.  **Commission's Foundational Role:** This Commission is not merely an extension of the current electorate. Our charter-mandated task is to step back and deliberate on the *fundamental principles* of municipal governance, considering justice, fairness, and effective democracy for the *enduring community* as it exists, not just as previously defined. We are tasked with examining the *foundations* of "the people" for local purposes.
      2.  **Principle Over Preference:** Our recommendation is not based on predicting what the current electorate *wants* (which would indeed be circular). It is based on an independent normative principle – the Jurisdictional Community – derived from the nature of municipal governance and the realities of who is governed. This principle exists prior to and provides a standard *for* defining the electorate.
      3.  **Democratic Imperative:** A truly democratic system must be capable of self-correction and expansion when its existing boundaries demonstrably exclude significant portions of the community subject to its power. Failing to do so entrenches exclusion and undermines the legitimacy of municipal authority over the excluded. The circularity objection paralyzes necessary democratic evolution.
      4.  **Accountability:** Expanding the franchise to all subject to the city's jurisdiction makes the government more directly accountable to *all* those whose lives it governs, strengthening democratic legitimacy.

  **VI. IMPLEMENTATION & SAFEGUARDS (Especially for Residents Without Status)**

  1.  **Confidential Voter Registration:** Establish a strict firewall between municipal voter registration records and any federal immigration enforcement agencies. Registration should require proof of residency (e.g., lease, utility bill, school record) but *not* proof of citizenship or immigration status. The City Clerk's office must treat registration information as highly confidential, accessible only for essential election administration purposes under strict protocols.
  2.  **Explicit Ballot Language & Outreach:** Ballots and voter guides must clearly state that municipal voting is open to residents 16+ regardless of citizenship. Robust, multilingual outreach must target non-citizen communities, explicitly addressing safety concerns and explaining the residency requirement and confidentiality measures.
  3.  **Non-Resident Owner Franchise Removal:** Draft clear language eliminating the non-resident commercial property owner vote in downtown improvement district elections, effective concurrently with the expansion of the resident franchise.
  4.  **Phased Rollout (Optional but Recommended):** Consider implementing the non-citizen franchise first for municipal general elections, deferring inclusion in district-specific elections (like the downtown district) until after the non-resident owner vote is removed and systems are tested, to mitigate any potential legal challenges regarding district-specific electorates during the transition.

  **VII. CONCLUSION**

  Extending the municipal franchise to all residents aged sixteen and older, grounded in the Jurisdictional Community principle, is a necessary step towards a more just, inclusive, and democratically legitimate city. It recognizes the reality of who lives under and is shaped by our local government. Exempting non-citizens from compulsory voting respects meaningful distinctions while granting equal political rights. Removing the anomalous franchise of non-resident property owners ensures consistency. Confidential registration is paramount for protecting vulnerable residents. This package strengthens our community by affirming that all who share the burdens and benefits of life here belong here and deserve a voice in shaping our common future. We recommend its adoption.
