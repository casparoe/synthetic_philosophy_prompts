prompt: |-
  I sit on the ethics committee of a mid-sized community hospital, and after about a year of cases I have noticed that my votes do not line up with any rule I am able to state out loud. I would like help finding the rule, or finding out that I do not have one. I am not asking what the law here requires; I know that, and it settles less than people expect. I want the moral principle. Here are the cases as I remember them, with how I voted.

  (1) Marta, 34, bipolar I, three hospitalizations, each following her decision to stop lithium during a manic episode. During a stable period she signed a document asking that if she became manic and refused medication, she be treated anyway, including against her will. Six months later she was manic, sleeping two hours a night, had spent her savings, and said she had never felt better and that lithium was poison. I voted to treat her. This is the case I am most confident about: the person who signed it seems to me simply to have been thinking more clearly than the person objecting.

  (2) Mrs. H., 74, moderate Alzheimer's. She recognizes no one, speaks almost nothing, but smiles, eats well, sings along with songs from her twenties, and appears content. At 62, after sitting through her sister's death in intensive care, she signed a directive refusing artificial feeding, ventilators, and antibiotics for infection if she ever had advanced dementia. She now has pneumonia. Her daughter asks for a course of antibiotics, which would almost certainly return her to exactly the state I have described. I voted to treat.

  (3) A man in his late thirties, unconscious after a road accident, intubated in intensive care. A directive surfaces that he signed at 26, during what his family describes as a long untreated depression — he was never declared incompetent and was working full time at the time — refusing life-sustaining treatment of any kind. His wife says he has been well for a decade, that the document does not reflect him, and that he would want to be treated. I voted to treat.

  (4) Mr. R., 58, in a persistent vegetative state after an anoxic brain injury. Two years earlier he had written, and told his family repeatedly, that he wanted everything done for as long as there was any chance, and he gave a religious reason: life is a gift that is not his to end. His wife and two adult children ask that treatment stop; they say this is not what he would have wanted, that he never pictured this. I voted to stop. This is the vote I am least comfortable with, since I am overriding an explicit, competently made wish in favor of a family's judgment about a patient who cannot speak.

  (5) Mr. D., 71, advanced dementia, cheerful, apparently free of distress, with a urinary infection. His directive, written at 55, says in effect: I have read that people with dementia often seem content and report good quality of life. I believe that, and I still do not want that life. What made my life mine was following my own thoughts and being able to share them with the people I love; a life without that is not one I want prolonged by treating infections or by tube feeding. I voted to withhold antibiotics — with far more hesitation than in (1), and I cannot say why my votes in (2) and (5) differ, since the two patients' situations look to me the same and the outcomes I am choosing are opposite.

  (6) Ms. K., 46, terminal ovarian cancer, entirely competent, a devout Catholic for six years. At 28 she signed a directive refusing heroic measures; she never revoked it. She now wants a second surgery and intensive care if it comes to that, and says that suffering accepted willingly has meaning. Her brother says the document should stand and that her conversion is a product of fear. I voted for her current wishes.

  My tentative principle is this: an advance directive binds just when the person who wrote it is the person who will have to live through — or die through — what it asks for. Marta will come back and be the one who bears the outcome of being medicated, so her document binds. Mr. R. will not be there to bear anything, so his does not. But (5) does not fit my own principle: Mr. D. is not the one living through the infection either, and I still voted to honor him.

  What I would like from you: state a principle precisely enough that I could take it into a meeting, clause by clause, with the case that forces each clause. Test mine against the six cases and repair it if it can be repaired. Say plainly which of my votes a defensible principle would force me to give up, and which vote you think is the weakest. Then give me its verdicts on three cases I have not put to it: a demented patient whose apparent contentment is the only evidence of her wishes and who never signed anything; a directive whose enforcement would commit a family to years of caregiving they cannot afford; and a directive written before a treatment existed that now substantially improves the outlook it was written against. Finally, tell me whether the principle you land on has to take a position on whether the earlier self and the later self are the same person — and if it does, whether it can be restated so that it does not have to.
reasoning: |-
  Hmm, the user is an ethics committee member struggling to reconcile their votes on advance directive cases with a coherent moral principle. They've presented six detailed cases where they voted sometimes to follow directives and sometimes to override them, plus one proposed principle they feel doesn't fully fit. What they really need is systematic moral scaffolding.

  Looking at their votes: they consistently prioritized present experiential interests over past documented instructions when the patient had substantial current well-being (Mrs. H), significant identity change (the depressed man), or when enforcing directives would create suffering without benefit (Mr. R). But Mr. D's case breaks this pattern - why honor his directive when he's currently content? The key might be in Mr. D's specific rationale about loss of identity-constituting capacities, which Mrs. H lacked in her directive.

  Their proposed principle focuses on identity continuity ("who lives through the outcome") but stumbles on dementia cases. We can do better with a two-tiered approach: first assess whether the directive's conditions are met and the author was competent, then apply a harm-benefit analysis weighted by current experiential interests and identity continuity. 

  For Mr. D, the critical factor is that his directive explicitly rejects existence without cognitive capacities - his current contentment doesn't override that because he anticipated it and deemed it irrelevant. Whereas Mrs. H's directive was based solely on avoiding ICU suffering, which isn't relevant to her current pneumonia treatment. 

  The new cases will test this: the content demented patient without documents suggests default to current interests; the bankrupting directive requires weighing family harm against patient autonomy; the outdated directive demands reassessment in light of new medical realities. Throughout, we can avoid metaphysical personhood debates by focusing on empirically observable psychological connectedness and values integration.

  The weakest original vote was Mr. R - overriding explicit religious instructions based on family interpretation feels uncomfortably paternalistic. If the principle forces abandoning any vote, that might be the one. But we can justify it through the "no benefit" clause since PVS patients lack any subjective experience.
answer: |-
  Based on your votes and reasoning across these six complex cases, your implicit moral principle is not fully captured by your tentative "bear the outcome" formulation. Here's a precise principle derived from your judgments, structured clause-by-clause with supporting cases, followed by analysis, repairs, and application to new scenarios:

  **The Revised Principle:**
  *An advance directive is morally binding if and only if:*
  1.  *The directive's specific clinical conditions are unambiguously met; AND*
  2.  *The directive's author was competent and reasonably informed at the time of writing; AND*
  3.  *Enforcing the directive does not impose profound net experiential harm on the current patient relative to the alternative; UNLESS*
  4.  *The directive explicitly grounds its instructions in the rejection of the specific experiential state itself (e.g., existence with profound cognitive loss or dependence), rather than solely in avoiding medical burdens or states the author found undesirable to experience.*

  **Clause-by-Clause Justification (Case Reference):**
  *   **Clause 1 (Specific Conditions Met):** Ensures the directive applies to the *actual* situation. *(Supported by all votes: Conditions were met in all cases.)*
  *   **Clause 2 (Competent & Informed Author):** Establishes baseline validity of the directive. *(Supported by Cases 1, 3, 4, 5, 6: You accepted the documents as competently made. Case 3 is key – the depression didn't automatically invalidate competence for you, but the disconnect mattered.)*
  *   **Clause 3 (Avoid Profound Net Experiential Harm):** Prioritizes preventing significant suffering or loss of well-being for the *existing person*. This is your core driver. *(Supported by Cases 2, 3, 4, 6: Mrs. H. would suffer/die from untreated pneumonia but is content now; the depressed man likely had a future he valued; Mr. R. experiences nothing; Ms. K. would suffer by being denied wanted care. Overrides Clauses 1 & 2 when harm would occur.)*
  *   **Clause 4 (Rejection of the State Itself):** The exception allowing override of Clause 3. Honors directives that fundamentally reject *being* in a certain state, even if not experientially harmful. *(Supported by Case 5: Mr. D. explicitly rejected existence *with dementia*, regardless of apparent contentment. This distinguishes him from Mrs. H. (Case 2) whose directive focused on avoiding burdensome *treatments* within a state (advanced dementia), not the state itself.)*

  **Testing & Repairing Your Tentative Principle:**
  *   **Your Principle ("Bears the outcome"):** Fails Cases 2 and 5 equally (neither "bears" the outcome in a meaningful experiential sense), yet you voted differently. It doesn't capture the crucial distinction *between* Mrs. H. and Mr. D.
  *   **Repair:** The Revised Principle *succeeds* because Clause 3 explains overriding Mrs. H.'s directive (harm via untreated pneumonia vs. her current contentment), while Clause 4 explains honoring Mr. D.'s directive (he rejected the state of dementia *itself*, even without current suffering).

  **Analysis of Your Votes Under the Revised Principle:**
  1.  **Marta (Treat):** Strongly Supported. Conditions met (1), competent author (2), enforcing refusal causes profound harm (manic suffering, consequences) (3). Directive *is* binding.
  2.  **Mrs. H. (Treat):** Supported. Conditions met (1), likely competent author (2), but *enforcing* directive (withholding antibiotics) causes profound harm (death from treatable pneumonia) to a currently content individual (3). Clause 4 does not apply – directive rejects treatments *during* dementia, not existence *with* dementia itself.
  3.  **Depressed Man (Treat):** Supported. Conditions met (1), likely competent author *technically* (2), but *enforcing* directive (withholding life support) causes profound harm (death) to an individual who likely values his current life/would value recovery (3). Significant value shift/reconnection weakens the directive's claim relative to current interests.
  4.  **Mr. R. (Stop):** Supported, but weakest. Conditions met (1), competent author (2). **However:** Enforcing directive (continuing treatment) causes *no experiential harm* to Mr. R. (PVS) (3), but also provides *no benefit*. The profound burden is primarily on the family. The principle *permits* stopping as there is no net experiential benefit to the patient to continue, but does not *force* it solely based on family burden. Your vote overrides the directive based on family interpretation ("never pictured this") and burden, which goes slightly *beyond* the strict experiential focus of the Revised Principle. This is the vote most vulnerable to challenge under a principle strictly prioritizing the patient's documented wishes.
  5.  **Mr. D. (Withhold):** Supported. Conditions met (1), competent author (2). Clause 4 Applies: Directive explicitly rejects existence *with dementia itself*, irrespective of apparent contentment ("a life without that is not one I want"). This overrides the potential experiential harm of withholding antibiotics (death) because the author defined that state as unacceptable existence.
  6.  **Ms. K. (Follow Current Wishes):** Supported. Conditions met (1), competent author originally (2), but *enforcing* the past directive (refusing surgery/ICU) against her *current* competent wishes would cause profound experiential harm (denial of wanted care, spiritual distress) (3). Current competent wishes supersede past directives.

  **Weakest Vote & Principle Requirement:** Your vote in **Case 4 (Mr. R.)** is the weakest under the Revised Principle. The principle *allows* stopping treatment (as it provides no benefit to the patient), but doesn't *require* overriding the explicit directive solely based on family burden/interpretation. A defensible principle focusing strictly on the *patient's* interests (experiential and values-based) might force you to uphold Mr. R.'s directive despite the family's hardship, as he experiences nothing. To stop treatment under this principle, the justification must lean on "no benefit" to the patient, not primarily family burden.

  **Verdicts on New Cases:**
  1.  **Demented Patient, No Directive, Apparently Content:**  
      *   **Verdict:** Treat to preserve well-being.  
      *   **Reasoning:** No directive exists (Clauses 1 & 2 not invoked). The primary obligation is to the current patient's well-being. Apparent contentment is the best available evidence of their experiential state. Net experiential harm would likely result from withholding standard care. (Applies Clause 3 by default).

  2.  **Directive Enforcement Causes Family Financial Ruin:**  
      *   **Verdict:** Directive remains binding, but requires exploration of alternatives/support.  
      *   **Reasoning:** The Revised Principle focuses on the *patient's* interests (autonomy via directive, experiential harm). While family burden is a significant ethical concern, it doesn't directly trigger Clauses 3 or 4. Upholding autonomy (Clauses 1 & 2) is paramount unless enforcing the directive causes profound *experiential harm to the patient* (e.g., awareness of family suffering causing distress, which is unlikely if incompetent). The solution lies in social/financial support systems, not overriding the patient's directive. The principle forces upholding the directive.

  3.  **Outdated Directive (Written Before New Treatment):**  
      *   **Verdict:** Directive may not bind; reassessment needed.  
      *   **Reasoning:** Clause 2 ("reasonably informed") is critically undermined. The author lacked knowledge of a significantly beneficial treatment existing *today*, fundamentally altering the risk/benefit calculus they based their decision on. Enforcing the outdated directive could cause profound net experiential harm (Clause 3) by denying a beneficial treatment the author likely would have wanted had they known. The directive should not bind automatically; a surrogate should reassess based on the patient's likely values in light of the new information.

  **Personhood Question:**
  *   **Does the principle require a position on same person?** **Indirectly, yes, but it avoids metaphysics.** The principle hinges on empirically observable factors – **psychological connectedness (values, beliefs)** and **experiential continuity** – rather than abstract personal identity.
      *   **Clause 3 (Net Experiential Harm):** Focuses on the *current* entity's capacity for suffering or well-being, regardless of its connection to the past author. (Marta *is* connected; Mrs. H. *has* experiential interests; PVS Mr. R. *has none*).
      *   **Clause 4 (Rejection of the State):** Honors the past author's values *if* they specifically rejected the *state of being* of the current entity (Mr. D.), recognizing a fundamental discontinuity *they* anticipated. It respects the author's judgment that the future state is not a life they wish to endorse, even if a metaphysically continuous person exists.
  *   **Can it be restated without personhood?** The principle *as stated* already avoids metaphysical terms. It uses observable criteria:
      *   The *clinical state* of the current patient.
      *   The *content and rationale* of the past directive.
      *   The *experiential impact* (harm/benefit) of decisions on the current patient.
      *   The *degree of alignment* between the past author's values and the current patient's evident state/interests (apparent contentment, value shift).

  **Conclusion:**
  Your core moral intuition prioritizes preventing profound harm to the *existing individual* over rigid adherence to past instructions, except when those instructions fundamentally reject the *specific state of existence* itself. The Revised Principle captures this, explaining all six votes (though Case 4 relies on the "no benefit" aspect). It requires upholding directives that cause family hardship (New Case 2) but allows flexibility for outdated directives (New Case 3) and mandates care for the undocumented content patient (New Case 1). While it engages with questions of continuity through the lens of values and experience, it successfully avoids committing to a specific metaphysical theory of personal identity. This principle provides a robust, case-tested framework for your future ethics committee deliberations.
