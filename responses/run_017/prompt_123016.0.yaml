  Second, conditional heavy tails. If value distributions are heavy-tailed, small probabilities of extreme outcomes dominate expected value, making sign determination harder. This reduces escapability.

  Third, Robust Sign Rule's viability. Can we define the admissible set without reintroducing cluelessness? If yes, it helps; if not, it's circular. I'm skeptical here.

  Fourth, decision rule under uncertainty. Should we use expected value or something else? If robust rules are better, that might save consequentialism, but the user's P requires expected value sign to be knowable.

  Fifth, whether cluelessness defeats the verdict or just confidence. If it's just about confidence, agents might still act, but P requires knowledge, so this affects epistemic justification.

  Sixth, empirical tractability. Even if theoretically possible, can agents feasibly compute the sign? Time and resource constraints matter.

  Seventh, the 1/3 threshold. How many cases are "substantial"? Roughly a third is the benchmark. If fewer cases meet criteria, P fails.

