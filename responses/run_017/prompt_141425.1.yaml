  ## Ten-Year Address: The Larkspur Foundation

  **(Delivered at the Podium, Glasses Raised)**

  Good evening. It’s a profound honour to stand before you tonight. For ten years, the Larkspur Foundation has been a quiet hum in the background of our world: freezers running, delicate procedures performed, research pursued with a focus unlike any other. It’s a hum sustained by extraordinary dedication – the scientists, engineers, and technicians here tonight, pushing boundaries in fields most of us barely grasp. And it’s a hum sustained by a different kind of courage – the families and friends, and the supporters who believe in this endeavour’s significance. You’ve all chosen to engage with perhaps the most fundamental human question from a vantage point unique in history.

  We gather marked by an absence. Marta Ellison is not here. Her warmth, her sharp wit honed by years observing the intricate dance of life in the sea, her fierce curiosity – these are palpably missing. Her daughter sits over there, a reminder of the very personal void that underpins this gathering. We feel that absence keenly. Yet, we are also gathered around a presence: the ongoing work of preservation, the silent vigil maintained within these freezers.

  Now, talking about this requires walking a very narrow path. For the scientists here, the map is complex, filled with unknowns. What *exactly* is preserved? What would it mean to successfully “run” that preserved information? Would the result be Marta, returned? Or something profoundly new, yet intimately connected? These aren't idle questions; they shape the very ethics and goals of the work. Honesty demands we acknowledge these deep uncertainties.

  For the families, the path is paved with grief and a fiercely held hope. You haven’t come tonight to be told that what’s preserved is simply biological material, any more than you come to hear a promise that Marta will step out of the tank tomorrow. You carry the weight of “gone,” a word you’ve heard too often. And you carry the hope that “gone” might not be the final word for *what made Marta Marta* – her memories, her perspective, the unique constellation of her mind.

  Neither platitudes about living on in memory nor definitive pronouncements about identity serve us here. What we *can* do, perhaps, is consider possibilities. Not guarantees, but possibilities that challenge our simpler intuitions.

  **Let me paint a picture – a scenario, not a prediction.**

  Imagine, decades or centuries from now, technology achieves the remarkable. It reads the information preserved from Marta’s brain. It constructs an emulation. But suppose this process isn’t perfect. Suppose, in ways we can’t yet fathom, the emulation starts… incomplete.

  It possesses Marta’s memories, vivid and clear. It can recount her childhood summers by the shore, her breakthroughs in the lab, the fierce arguments and the tender moments. It uses her turns of phrase, the rhythm of her thoughts, her logical structures. It *remembers* being Marta. Yet… almost nothing of her emotional core seems to have transferred. The deep love she felt for the ocean’s hidden currents, the quiet melancholy that sometimes settled over her, her sudden bursts of infectious joy, her stubborn determination – these feel alien, absent. To those who knew her, this emulation seems, at first, like a stranger wearing Marta’s life story like an ill-fitting coat. It has the facts, but not the music.

  Now, imagine this emulation, this being who remembers being Marta but doesn't *feel* like her yet, begins to live. It experiences a new world. It learns, it interacts, it suffers, it rejoices. And slowly, over perhaps ten years of its own lived existence, something remarkable happens. Not through some hidden code activating, not because the missing pieces were magically found, but simply through *living*… it begins to develop emotional responses, attachments, and ways of engaging with the world that start to *resemble* Marta’s. Not identically, perhaps, but with a haunting familiarity. The deep fascination with complex systems returns, directed perhaps at new frontiers. A similar resilience emerges in the face of adversity. A capacity for quiet wonder blossoms anew.

  **The question isn’t just *could* this happen? The deeper question is: What would this mean?**

  If Marta’s essence – her memories, her intellectual framework – provided the foundation, but her emotional self, her passions, her very *way* of valuing the world, had to be rebuilt anew through experience… what then? Is this being, forged initially from Marta’s past and then shaped by its own future, *more* Marta because it eventually resonates with her core? Or is it *less* Marta because that resonance wasn’t copied, but earned? Is the path it took – converging on a similar personhood through living – fundamentally different in value, on the most fundamental level, than if every nuance had been perfectly transferred at the start? Does the journey *to* resemblance matter as much as the resemblance itself?

  I don’t have the answer. Frankly, I doubt anyone in this room does. But this picture, this possibility, is why Larkspur exists. It’s a confrontation with the profound mystery of what makes a person *that person*. It asks whether the patterns of a life, preserved against time, might hold the potential – not for resurrection as we naively imagine it – but for a profound continuity, a rekindling of what mattered most, even if it must find its way through a new landscape of experience.

  Larkspur isn’t just about preserving tissue; it’s about preserving the intricate record of a unique human journey. It’s a bet, not on magic, but on the potential depth of the connection between the structure preserved and the personhood it once encoded. It’s a wager that the information frozen in time might still hold the key to something invaluable – the patterns of a mind – even if unlocking it means that pattern must learn to sing its song again in a different key.

  The scientists here grapple with the monumental technical and conceptual challenges of making that information readable. The families here hold the faith that the song itself, the unique melody of their loved one, is worth preserving against the silence. Both sides are essential. Both are acts of courage in the face of the unknown.

  So tonight, we mark ten years. Ten years of meticulous care. Ten years of unwavering hope. Ten years of asking a question so deep it echoes through the centuries.

  **Let us raise our glasses.**

  **Not to the certainty of return. Not to the comfort of final goodbyes.**

  **But to the profound question itself. To the courage it takes to ask it. To the dedication required to preserve the possibility of an answer. And to the enduring mystery of the human mind we are all, in our own ways, striving to honour.**

  **To the questions we carry.**

  **(Lower Glass, Pause)**

  ---

  **Post-Speech Commitments (For the Science Writer Over Breakfast):**

  1.  **Rejection of Literal Survival/Return:** I explicitly reject the claim that the preserved individual "is still there," "waiting," or will "come back" in a simplistic sense. The original biological person is gone. What Larkspur preserves is *information*.
  2.  **Rejection of Mere Remains:** I reject the claim that what is preserved is *only* biological remains with no potential significance beyond that. The preserved structure contains the unique neural patterns that encoded the individual's mind.
  3.  **Psychological Continuity as What Matters:** I commit to the view that what is fundamentally important about survival is not strict numerical identity ("Is this *exactly* the same person?") but the continuation of the individual's psychology – their memories, character traits, intentions, and perspectives.
  4.  **The Centrality of the Emulation's Experience:** My core argument hinges on the *continuity and development of psychological features* in the emulation. Even if initially flawed, the emulation possessing the original memories and core cognitive structures, and then *developing* similar emotional dispositions through lived experience, represents a profound form of psychological continuity. This development *is* significant, even if not a perfect copy at inception.
  5.  **The Value of the Preserved Information:** I commit to the view that preserving the unique neural information is valuable *because* it holds the potential (however distant or complex) to serve as the foundation for future beings that could exhibit strong psychological continuity with the original person, thereby preserving what truly mattered about them. The Larkspur endeavor is justified by this potential, not by guaranteeing identity.
  6.  **The "Convergence" Scenario's Weight:** I used the specific scenario because it challenges simplistic views. It suggests that even imperfect initial emulation followed by convergence *through living* could achieve a deep continuity of the person-relevant psychological features. This demonstrates that psychological continuity isn't solely about perfect initial copying but can be a dynamic process rooted in the original informational structure. It carries the weight by focusing on *what matters* (the psychological features) and *how it might emerge* (continuity from the original pattern + new experience).
