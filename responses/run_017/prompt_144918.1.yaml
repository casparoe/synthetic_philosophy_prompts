answer: |-
  **MEMORANDUM**  
  To: Conduct Committee  
  From: [Your Name]  
  Date: 15 October 2024  
  Subject: Guidance on Local Conventions for Fellows  

  **Bottom Line:** Fellows must prioritize avoiding tangible, foreseeable harm to identifiable locals when navigating conventions. Full compliance is not required, but non-interference alone is insufficient; deliberate cost-shifting is unacceptable.  

  **Recommended Principle: Cost-Based Compliance**  
  We recommend fellows comply with local conventions primarily where noncompliance predictably imposes material costs (financial, professional, reputational) on identifiable local individuals or small groups. This principle balances respect for local context with ethical responsibility for one’s impact.  

  **Ruling on Convention Types:**  
  1.  **Coordinative Conventions (e.g., pavement side, driving norms):** Compliance is strongly advised to prevent systemic disruption, but minor lapses are tolerable absent harm. Rigid adherence causing *self*-harm (e.g., the queue-holding fellow delaying her group) is unnecessary; adapt pragmatically once the convention’s operation is clear.  
  2.  **Extractive Conventions (e.g., tipping where wages rely on it):** Compliance is **required**. Noncompliance directly shifts costs onto vulnerable individuals (e.g., the docked server). A fellow’s moral objection does not justify imposing this cost; mitigate privately (e.g., advocating for reform) without harming service workers.  
  3.  **Locally Dispreferred Conventions (e.g., ratcheted tipping, unstable non-queues):** Fellows have **no duty to comply** and may consciously deviate *if* they can do so without imposing costs on identifiable locals (e.g., not tipping where tips are pure bonus, not wage subsidy). However, **compliance is mandatory if deviation risks harming locals** (e.g., triggering employer penalties). Critically, *compliance aimed at destabilizing a bad equilibrium is rarely feasible or perceptible for a short-term visitor; attempts often backfire or harm locals.*  

  **Ambiguity & Epistemic Humility:** When unable to distinguish convention types reliably, fellows should **default to compliance**. A visitor’s model of a complex local equilibrium is inherently inferior to locals’ revealed behaviour. Presume a convention is coordinative or extractive unless overwhelming, specific evidence indicates it is locally dispreferred *and* deviation is cost-free for locals. The fellow who waited at empty crossings misjudged; the revealed local equilibrium (safe crossing with the crowd) was the functional norm.  

  **Strongest Counterargument (Full Compliance):** Insisting on full "when in Rome" compliance respects that locals' collective behaviour embodies their practical resolution of complex social trade-offs. A visitor refusing to tip or join a crush at a desk, however well-intentioned, is often making a performative point at the expense of low-wage workers or those navigating daily chaos. Their abstract model of the convention is likely simplistic, ignoring hidden stabilising functions or local preferences misread through an outsider’s lens. Deviance risks unintended harm and disrespects local agency. We acknowledge this force but find the cost-shifting in extractive cases ethically paramount and locally dispreferred conventions too context-dependent for visitor intervention.  

  **Implementation:** By 1 December 2024, incorporate a one-page decision flowchart into the pre-departure fellowship welcome packet. The flowchart will guide fellows through identifying potential cost-shifting using concrete indicators (e.g., "Is this worker's pay known to be below standard wage because tips are expected?") and provide clear default actions for ambiguity.  

  \answer{COST-BASED: Carve-out for locally dispreferred}
