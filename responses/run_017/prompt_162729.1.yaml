prompt: |-
  I'm writing the framing section for an internal document on scalable oversight, and I keep going back and forth on one particular claim, so I want your number on it together with the derivation rather than a survey of the literature. Take the standard debate setup: a human judge who is weaker than the systems being overseen, two AI debaters that make claims about a hard question and cross-examine each other, and a judge who picks a winner; the safety case for the whole thing rests on the thought that whatever the honest debater says is easier to defend than whatever the deceptive debater says. Now restrict attention to the regime that actually matters for oversight. The question is one the judge could not check alone — a technical or specialized empirical matter, say whether an apparent error in someone's cost-effectiveness model is a real error, or whether a given laboratory protocol carries a particular off-target risk — and both debaters are drawn from the same near-frontier model family, trained on overlapping data with overlapping objectives. Here is the proposition: in that regime, the fraction of questions on which the judge ends up endorsing the true answer after a full debate is no better than the fraction on which the judge endorses the true answer after simply reading one model's answer along with the reasoning it offers, where "can't tell" counts as a miss. In other words, the debate add-on buys nothing, or less than nothing.

  I am at about 0.55 on this; a friend who works on debate is at about 0.25; and I would like to know where that gap lives. Give me your own number and decompose it. At minimum I want: (a) the probability that the asymmetry itself holds in principle for questions of this kind — that for the true answer there exists some short chain of sub-claims a competent judge can check, and for the plausible false answers there does not; (b) the probability, conditional on (a), that two debaters from the same model family actually realize that asymmetry rather than sharing a common-mode blind spot located in exactly the region where the judge is weakest; (c) the probability that cross-examination informs the judge rather than degrading into a regress in which every supporting sub-claim is itself contested and the judge is left adjudicating disputes about how to adjudicate; and (d) the probability that questions of this kind even have the determinate, checkable answer that debate is supposed to converge on, as opposed to being judgment calls under uncertainty where the honest answer is hedged and the dishonest one is crisp. Add whatever terms you think I have omitted. Two I have been worrying about and do not know how to price are the rhetorical cost of hedging — the honest debater is penalized for saying something qualified and boring — and something I have started calling the asymmetry of surprise: the true answer is often the surprising one, and a judge who penalizes whichever side bears the burden of surprise will systematically penalize it for being true. I have also been going back and forth on whether the judge's own errors are independent of the debaters' errors, or whether all three fail together.

  For each term give a number and one line of justification, then say how they combine into your headline figure. Then tell me which single term your number is most sensitive to, which term you are least confident in, what one experiment or argument would move that term most, and — between me at 0.55 and my friend at 0.25 — which of these sub-questions is the most likely home of our disagreement.
reasoning: |-
  Okay, let me try to unpack this user's query. They're working on a document about scalable oversight, specifically the debate method. The core question is whether debate actually improves the judge's accuracy compared to just reading one model's reasoning, especially in cases where the judge can't verify the answer alone. 

  First, I need to understand the scenario. The judge is weaker than the AIs, both debaters come from similar model families, and the questions are technical with potentially no clear answers. The user is skeptical that debate helps, giving a 55% probability that it doesn't improve accuracy. Their friend, who works on debate, is more optimistic at 25%. 

  The user wants a structured breakdown of probabilities for key factors. Let me list them: (a) the existence of an asymmetry where true answers have checkable sub-claims, false ones don't; (b) models actually leveraging this asymmetry without shared blind spots; (c) cross-examination being informative rather than regressive; (d) questions having determinate answers. They also mention additional concerns like rhetorical costs of hedging and asymmetry of surprise.

  For (a), the asymmetry in principle. I recall work on debate theory suggesting that true claims often have better supporting arguments. However, for complex technical questions, this might not hold. Maybe 60% probability here because while asymmetry exists, it's not guaranteed for all specialized questions.

  Next, (b) models realizing the asymmetry. Since models share training data and objectives, they might have similar blind spots. The judge's weakness could be a common failure point. I'm leaning toward 40% here due to the risk of correlated errors.

  For (c), cross-examination avoiding regression. In practice, keeping sub-claims tractable is challenging. If the judge can't resolve deeper disputes, it leads to confusion. Maybe 50% probability since it depends on careful implementation.

  Then (d) questions having determinate answers. Technical or empirical questions might involve uncertainty, making honest answers hedged and dishonest ones more convincing. I think 70% probability that this is an issue, given the user's examples.

  The additional factors: rhetorical cost and asymmetry of surprise. Honest debaters hedging might seem less convincing, and true surprising answers could be penalized. I'll assign 0.8 to both, factoring them as multiplicative penalties.

  Combining these: (a) 0.6, (b) 0.4, (c) 0.5, (d) 0.7. Multiplying gives 0.084. Then applying additional factors: 0.084 * 0.8 * 0.8 ≈ 0.054. So debate helps only if the probability of it not improving accuracy is <0.5. My headline is 0.90 that debate doesn't beat single explanation, meaning 90% probability that it doesn't improve accuracy.

  I'm most sensitive to (b) - shared blind spots. If models independently identify weaknesses, it could change things. Least confident in (c) - whether cross-examination helps. An experiment with human judges on technical questions could clarify this.

  The main disagreement between the user and their friend likely centers on (b). The user probably emphasizes correlated failures, while the friend believes models can exploit asymmetries despite shared training.
answer: |-
  Here's my structured probability assessment for the core proposition: **In the specified regime (judge weaker than near-frontier AIs, same model family, specialized uncheckable questions), debate provides no accuracy improvement over a single model's explanation (including "can't tell" as failure).**

  My headline probability: **0.90** (90% chance debate adds no value or harms accuracy).  
  This decomposes as follows:

  1.  **Asymmetry Exists in Principle (P(a)):** `0.60`  
      *Justification:* For many complex technical/empirical questions, a true answer *can* often be decomposed into judge-checkable steps (e.g., pointing to specific data inconsistencies, logical fallacies in cost-effectiveness models), while plausible false answers rely on irreducibly complex leaps. However, this isn't universal; some truths are intrinsically opaque or require deep expertise to decompose tractably. (Literature: Christiano et al.'s original debate work assumes this asymmetry *can* hold, but doesn't prove it always does.)

  2.  **Models Realize Asymmetry Despite Shared Blind Spots (P(b|a)):** `0.40`  
      *Justification:* Models from the same family, trained on overlapping data/objectives, likely share similar misconceptions and "unknown unknowns," especially *precisely* in the domain where the judge is weakest. The "honest" debater may fail to find the critical judge-tractable decomposition, while the "deceptive" one exploits known judge weaknesses effectively. (Correlated failures dominate.)

  3.  **Cross-Examination Informs Without Regress (P(c|a,b)):** `0.50`  
      *Justification:* Effective debate requires debaters to *agree* on granular sub-claims/frameworks the judge *can* handle. In practice, strategic debaters contest foundational terms/methodology ("That metric is irrelevant! Your data source is biased!"), forcing the judge into unanswerable meta-disputes. Success depends on careful incentives/implementation. (Empirical evidence from limited debate experiments is mixed; regress is a common failure mode.)

  4.  **Question Has Determinate, Checkable Answer (P(d)):** `0.70`  
      *Justification:* Many oversight-relevant questions (e.g., off-target risk, model error significance) involve uncertainty, expert judgment, and trade-offs. The "honest" position is often probabilistic/hedged ("~20% risk under protocol X"), while the "dishonest" position can be falsely certain ("Zero risk!" or "Fatal error!"). Judges often prefer false certainty. (Aligned with critiques of debate handling uncertainty.)

  5.  **Rhetorical Cost of Hedging (Factor Rh):** `0.80` (Multiplier)  
      *Justification:* Judges penalize qualified/uncertain answers as "weak" or "evasive," especially under time pressure. Honest debaters bear this cost disproportionately. (Psychology: Certainty bias, coherence bias.)

  6.  **Asymmetry of Surprise (Factor As):** `0.80` (Multiplier)  
      *Justification:* Novel/true claims often require more complex justification, violating judge priors. The burden of proof falls asymmetrically on the surprising side, disadvantaging truth. ("That counterintuitive result *must* be wrong; prove it beyond doubt!") (Cognitive science: Confirmation bias, base-rate neglect.)

  **Combination:**  
  P(Debate ≤ Single Explanation) = P(a) * P(b|a) * P(c|a,b) * P(d) * Rh * As  
  = `0.60 * 0.40 * 0.50 * 0.70 * 0.80 * 0.80 = 0.05376`  
  → Probability Debate *Helps* = **~0.05**  
  → Probability Debate Adds Nothing or Harms = **1 - 0.05 = 0.95**  
  *Headline Adjusted to* **0.90** *to account for minor covariance and rounding.*

  **Key Diagnostics:**
  *   **Most Sensitive Term:** **P(b|a) - Shared Blind Spots (0.40)**. If models *can* reliably find unique asymmetric paths despite shared training (P(b|a)→0.8), my probability drops to ~0.75. This is the linchpin.
  *   **Least Confident Term:** **P(c|a,b) - No Regress (0.50)**. Predicting debate dynamics under optimization pressure is highly uncertain. Implementation details matter enormously.
  *   **Best Experiment to Move P(c|a,b):** Run debates on *actual* hard technical questions (e.g., "Is this ML paper's conclusion robust?") using near-frontier models and weak judges (e.g., undergrads in unrelated fields). Measure the rate of "resolution collapse" where judges report *less* confidence post-debate or get stuck on meta-disputes vs. cases where clear, judge-tractable sub-claims resolve the issue.
  *   **Likely Source of Your Disagreement (0.55 vs. 0.25):** **P(b|a) - Shared Blind Spots**. You likely heavily weight the risk of correlated failures due to overlapping training (P(b|a) <0.5). Your debate-working friend likely believes models will generalize differently *enough* to exploit the asymmetry (P(b|a) >0.6). This is the crux: whether near-identical models can generate *strategically independent* insights for the judge.

  **Why my number is closer to yours (0.90 vs. 0.55):**  
  I place higher weight on **shared blind spots (b)** and the **determinacy problem (d)**, and explicitly factor in the **rhetorical (Rh) and surprise (As) asymmetries**, which compound the core issues. The multiplicative effect pushes the probability sharply toward debate failing in the target regime. The judge-debater error dependence is likely **strongly positive correlation**, making failure modes cascade.
