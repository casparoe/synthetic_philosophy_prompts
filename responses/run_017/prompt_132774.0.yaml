prompt: |-
  ok so I just had a three-hour arguement with my friend about whether two reasonable people can agree to disagree. she's read Aumann and says the theorem basically settles it; I said it settles nothing because every assumption is fake — common prior, common knowledge of each other's exact posterior, unbounded computation — and that real disagreement is mostly about who has the better evidence. we went nowhere because we kept proposing norms instead of saying what a norm has to do.

  so: write me the desiderata for a norm of disagreement. not a theory of rationality in general — a rule that takes as input (i) your credence in some proposition, (ii) something you learn about another agent's credence in it, and outputs your new credence. what does such a rule have to deliver to count as adequate, and what's the case or consideration behind each demand?

  what I want on the list at minimum:

  - the ideal limit: does it have to reproduce Aumann-style agreement when the assumptions all hold, or is that the wrong test to impose on a rule meant for bounded agents?
  - the coarse case: you don't learn their number, you only learn that they disagree with you at all, or that they'd take the other side of an even-odds bet.
  - the expert case: you have positive evidence they're worse informed, biased, or drunk. the rule has to let you hold your ground while blocking the move where you always conclude you're the one who's the expert.
  - order-independence: learning about A's view then B's shouldn't leave you somewhere different from B then A, unless the rule can say why the order should matter.
  - self-consistency: what does it say when the other person is running the same rule and you both know it — including what you should announce afterward, since that's what feeds their next input?
  - exploitability: two agents both following the rule shouldn't be reliably money-pumped by a third party who just watches them disagree.

  purpose, so you know what counts as cheating: I want something I could actually implement in a software agent, not a characterization of what an ideal agent does. so tractability is a real requirement, not a nice-to-have.

  then: mark each requirement negotiable or non-negotiable, flag any subset you think is jointly unsatisfiable (I strongly suspect the ideal-limit one and the tractability one fight), and tell me which single requirement knocks out the most candidate rules — conciliationism, steadfastness, averaging in log-odds, whatever else you'd put in the running. keep that last part short, I can fill in the scorecard myself.
reasoning: |-
  We are to list desiderata for a rule that updates an agent's credence in a proposition upon learning about another agent's credence in the same proposition. The rule is intended for bounded agents and should be tractable for implementation.

  We are given several key cases and requirements:

  1. The ideal limit: Should the rule reproduce Aumann-style agreement under the assumptions of common prior, common knowledge of posteriors, and unbounded computation? Or is that not required because we are bounded?

  2. The coarse case: When you only learn that the other agent disagrees (e.g., they would take the other side of an even-odds bet) without knowing their exact credence.

  3. The expert case: When you have evidence that the other agent is less informed, biased, or impaired (e.g., drunk). The rule should allow holding ground without always assuming you are the expert.

  4. Order-independence: The rule should be commutative in the sense that learning from A and then B should yield the same result as learning from B and then A, unless there is a reason for order to matter.

  5. Self-consistency: When both agents are using the same rule and know it, and they also know what the other will announce (since the output of one becomes input to the other), what should happen? This includes considering the dynamics of repeated announcements.

  6. Exploitability: Two agents following the rule should not be money-pumped by a third party who observes their disagreement (i.e., they should not be vulnerable to Dutch booking).

  Additionally, we are to mark each requirement as negotiable or non-negotiable, flag any subset that is jointly unsatisfiable, and note which requirement knocks out the most candidate rules.

  Let us list the desiderata:

  **Desideratum 1: Ideal Limit Reproduction (Aumann Agreement under ideal conditions)**
     - Description: In the case of common prior, common knowledge of each other's exact posterior, and unbounded computation, the rule should lead to agreement (same posterior for both).
     - Case: This is the scenario of Aumann's theorem. We must decide if we require the rule to conform to it in the ideal case.
     - Negotiable? We argue: **Negotiable**. Since the rule is for bounded agents, we may not require exact reproduction of Aumann in the ideal case. However, it would be a strong point in favor if the rule approximates it when the conditions are approximately met. But if we require exact reproduction, it might conflict with tractability.

  **Desideratum 2: Handling Coarse Information**
     - Description: The rule must be able to update when the input is not a precise credence but only coarse information (e.g., "they disagree" or "they would take the other side of an even-odds bet").
     - Case: This is a common real-world situation. The rule should specify how to update upon such information.
     - Negotiable? **Non-negotiable**. Real agents often get coarse information.

  **Desideratum 3: Robustness in the Face of Suspected Inferiority**
     - Description: The rule should allow the agent to hold their ground (or only slightly update) when there is evidence that the other agent is less informed, biased, or impaired. However, it must not allow the agent to always dismiss the other without justification (i.e., it must block the move of always assuming oneself to be the expert).
     - Case: The expert case. The rule should incorporate evidence about the other agent's reliability.
     - Negotiable? **Non-negotiable**. Without this, the rule would be too conciliatory and vulnerable to manipulation by unreliable agents.

  **Desideratum 4: Order-Independence**
     - Description: Updating based on multiple agents should be commutative when the information is independent and there is no inherent reason for order to matter. That is, the order of learning about the agents should not affect the final credence (unless the rule specifies a reason, such as if the agents are not independent or if the information is about a sequence of events).
     - Case: Learning from two different agents in different orders.
     - Negotiable? **Negotiable**. In some contexts, order might matter (e.g., if the agents are updating in response to each other). But for simplicity and to avoid path-dependence, we might prefer order-independence.

  **Desideratum 5: Self-Consistency in Repeated Interaction**
     - Description: When two agents both follow the rule and know that the other does too, and they know the rule, then their updating process should be consistent. In particular, if they repeatedly exchange opinions, the rule should lead to a stable state (which may be agreement or persistent disagreement with a clear reason). Also, the rule should specify what they should announce (which becomes the input for the next round) and how that affects the next update.
     - Case: Two rational agents having a discussion, each updating after hearing the other's opinion, and then announcing a new opinion.
     - Negotiable? **Non-negotiable**. Without self-consistency, the rule could lead to inconsistent or oscillating behavior.

  **Desideratum 6: Unexploitability (No Money-Pumping)**
     - Description: Two agents following the rule should not be vulnerable to a third party who can profit by making bets with them based on their disagreement. This implies that their credences should not be such that they leave a sure loss on the table (i.e., they should be coherent with each other in a way that avoids Dutch books).
     - Case: A third party observes the two agents disagree and offers each a bet that they would accept, and the combination of bets leads to a sure loss for the two agents (and a gain for the third party).
     - Negotiable? **Non-negotiable**. A rule that leaves agents vulnerable to money-pumping would be irrational.

  **Desideratum 7: Tractability**
     - Description: The rule must be computationally feasible for implementation in a software agent. This rules out, for example, rules that require solving intractable problems or simulating unlimited computations.
     - Case: General requirement.
     - Negotiable? **Non-negotiable**. Since we are building a software agent, tractability is essential.

  Now, we note potential conflicts:

  - **Desideratum 1 (Ideal Limit) vs. Desideratum 7 (Tractability)**: Aumann agreement requires common knowledge and unbounded computation. Implementing a rule that exactly replicates Aumann in the ideal case might be computationally intractable (e.g., because of the need for common knowledge and infinite recursion). Therefore, we may have to relax the ideal limit requirement.

  - **Desideratum 5 (Self-Consistency) and Desideratum 1 (Ideal Limit)**: In the ideal Aumann setting, self-consistency would require agreement. But if we drop the ideal limit, then self-consistency might allow for persistent disagreement.

  We also note that **Desideratum 3 (Robustness) and Desideratum 6 (Unexploitability)** might be in tension: if one agent holds their ground too much, they might be exploited by a third party who knows they are biased.

  Now, which requirement knocks out the most candidate rules?

  We consider popular candidate rules:

  1. **Conciliationism**: Upon learning that a peer disagrees, you move your credence toward theirs (e.g., by averaging). 
     - Fails on **Desideratum 3** (if the other is known to be inferior, you shouldn't move much) and **Desideratum 6** (if both agents conciliate, they might be money-pumped by a third party who induces them to change their minds repeatedly? Not directly, but if they are too conciliatory, they might accept bets that are not in their interest).

  2. **Steadfastness**: Hold your ground and do not update based on the other's credence.
     - Fails on **Desideratum 1** (does not lead to agreement in the ideal case) and **Desideratum 6** (if two agents are steadfast and disagree, a third party can Dutch book them by taking opposite bets with each).

  3. **Averaging in log-odds**: This is a common Bayesian approach for combining opinions (e.g., using linear pooling or logarithmic pooling).
     - This might fail **Desideratum 2** (if we only have coarse information, how do we average?) and **Desideratum 3** (if we don't account for reliability, we might average with an inferior agent). Also, it might not be self-consistent in the sense of Desideratum 5 (if both average, then they might not converge to the same value unless they have the same weight).

  4. **Bayesian approaches that model the other agent's reliability**: This is a more sophisticated Bayesian approach where you have a prior about the other agent's reliability and update on their opinion by considering how likely they are to be correct.
     - This might satisfy most desiderata, but it requires modeling the other agent, which might be computationally heavy (Desideratum 7). Also, in the coarse case (Desideratum 2), it might be challenging to update without an exact credence.

  The requirement that seems to knock out the most candidates is **Desideratum 6: Unexploitability**. Both conciliationism and steadfastness can lead to Dutch book vulnerabilities. Also, many simple rules (like averaging) might be exploitable if not carefully designed.

  However, note that **Desideratum 3 (Robustness)** is also a major challenge for conciliationism and averaging.

  But the most fundamental and perhaps the one that is hardest to satisfy without a sophisticated Bayesian approach is **Desideratum 6**. Therefore, we mark:

  **Requirement that knocks out the most candidate rules: Desideratum 6 (Unexploitability).**

  Finally, we note that a subset of requirements that might be jointly unsatisfiable:

  - **Desideratum 1 (Ideal Limit) and Desideratum 7 (Tractability)**: Because achieving Aumann agreement requires unbounded computation and common knowledge, which is not tractable.

  Therefore, we might have to drop the requirement of exact reproduction of the ideal limit.

  **Summary of Negotiability:**

  - Desideratum 1: Negotiable (because we are bounded agents)
  - Desideratum 2: Non-negotiable
  - Desideratum 3: Non-negotiable
  - Desideratum 4: Negotiable (but desirable)
  - Desideratum 5: Non-negotiable
  - Desideratum 6: Non-negotiable
  - Desideratum 7: Non-negotiable

  **List of Desiderata:**

  1. **Ideal Limit Reproduction**: Negotiable. The rule should approximate agreement in the ideal case when computationally feasible, but exact reproduction is not required.
  2. **Handling Coarse Information**: Non-negotiable. The rule must update on coarse information.
  3. **Robustness in the Face of Suspected Inferiority**: Non-negotiable. The rule must allow holding ground when there is evidence of the other's inferiority, without permitting always assuming oneself to be the expert.
  4. **Order-Independence**: Negotiable. The rule should be order-independent for independent agents, but order-dependence might be acceptable if justified.
  5. **Self-Consistency in Repeated Interaction**: Non-negotiable. The rule must lead to consistent behavior in repeated interactions between agents using the same rule.
  6. **Unexploitability**: Non-negotiable. The rule must not leave agents vulnerable to money-pumping.
  7. **Tractability**: Non-negotiable. The rule must be computationally feasible.

  **Flagged Conflicts**: 
  - Desideratum 1 and 7 are jointly unsatisfiable in the strict sense (exact Aumann agreement is intractable). Therefore, we relax Desideratum 1 to being an approximation when conditions are approximately met and computationally feasible.
answer: |-
  Below, I present a structured list of desiderata for a norm of disagreement, tailored to your requirements. The norm takes as input (i) your current credence in a proposition and (ii) what you learn about another agent's credence, and outputs your updated credence. I focus on what the norm must deliver to be adequate for bounded agents (e.g., software implementation), with a case or consideration for each demand. The desiderata are based on your minimum list, expanded for clarity and completeness.

  I then mark each desideratum as **negotiable** (could be relaxed for a practical rule) or **non-negotiable** (essential for adequacy), flag any jointly unsatisfiable subsets, and identify which single requirement knocks out the most candidate rules. The desiderata prioritize tractability and real-world constraints over ideal theory.

  ---

  ### **Desiderata for a Norm of Disagreement**

  1. **Ideal Limit Approximation**  
     - **Description**: The norm should approach Aumann-style agreement under idealized conditions (common prior, common knowledge of exact posteriors, unbounded computation), but exact reproduction is not required.  
     - **Case/Consideration**: Aumann's theorem is a benchmark for ideal rationality, but bounded agents cannot achieve it. The norm should *converge toward agreement* as conditions approximate the ideal (e.g., with high computation or shared priors), without demanding perfection.  
     - **Why?** Tests if the norm is "not stupid" in simple cases, but imposing exact Aumann agreement is unrealistic for resource-constrained agents.  
     - **Negotiable?** **Negotiable** — It's a sanity check, not a core requirement. Bounded agents should aim for *approximate* convergence, not mathematical equivalence.

  2. **Coarse Input Handling**  
     - **Description**: The norm must update credences when input (ii) is coarse (e.g., "they disagree," "they'd take the other side of an even-odds bet") rather than a precise credence number.  
     - **Case/Consideration**: Real-world disagreement often involves vague or binary signals (e.g., a colleague says "I think you're wrong"). The norm must output a sensible update without exact probabilities.  
     - **Why?** For tractability, inputs are often noisy or incomplete; a rule needing precise numbers is useless in practice.  
     - **Negotiable?** **Non-negotiable** — Critical for real-world deployment.

  3. **Robustness to Suspected Adversity**  
     - **Description**: When you have evidence the other agent is unreliable (e.g., less informed, biased, or impaired), the norm must permit holding your ground (minimal updates) but prevent universal self-favoritism (e.g., always assuming you're the expert).  
     - **Case/Consideration**: In the "expert case" (e.g., you know they're drunk), the norm should weight their input low based on evidence, but require explicit justification for discounting (e.g., via reliability estimates).  
     - **Why?** Avoids pathological outcomes: Over-updating makes you gullible; under-updating enables arrogance. Evidence must modulate the update.  
     - **Negotiable?** **Non-negotiable** — Core to handling real disagreement without bias.

  4. **Order-Independence**  
     - **Description**: Learning from agents A then B should yield the same output as B then A, unless the norm provides a justification for order-dependence (e.g., if agents are interdependent).  
     - **Case/Consideration**: Sequential updates (e.g., hearing from two colleagues) shouldn't create path-dependence artifacts without cause (e.g., if B reacts to A's view).  
     - **Why?** For consistency and simplicity. Unjustified order effects introduce arbitrariness and complicate implementation.  
     - **Negotiable?** **Negotiable** — Order *can* matter if agents influence each other, but default commutativity is desirable.

  5. **Self-Consistency Under Common Knowledge**  
     - **Description**: If both agents use the same norm and know it, their repeated updates must stabilize (e.g., converge to agreement or persistent disagreement) without infinite loops. The norm must specify output credences *and* what to announce to others.  
     - **Case/Consideration**: In a dialogue, agents announce views, update based on inputs, and re-announce. Output must account for how announcements affect future inputs (e.g., no "bluffing" with dishonest credences).  
     - **Why?** Ensures the norm isn't self-undermining in social settings. Announcements must be "truthful" outputs to avoid game-theoretic chaos.  
     - **Negotiable?** **Non-negotiable** — Prevents explosive regress and aligns with recursive agent design.

  6. **Unexploitability (No Money-Pumping)**  
     - **Description**: Two agents using the norm must not be Dutch-bookable by a third party due to their disagreement (e.g., no sequence of bets leads to sure loss).  
     - **Case/Consideration**: A bookmaker observes disagreeing agents and offers bets they'd accept based on their credences. The norm must ensure no combinable bets create guaranteed losses.  
     - **Why?** Money-pumping violates minimal rationality—bounded agents should avoid predictable exploitation.  
     - **Negotiable?** **Non-negotiable** — Non-negotiable for any rational norm.

  7. **Tractability**  
     - **Description**: The norm must be computable in polynomial time with realistic resources (e.g., no NP-hard steps, minimal memory).  
     - **Case/Consideration**: For software agents, updates must handle high-frequency inputs (e.g., in real-time systems).  
     - **Why?** Implementation requires efficiency; Aumann-style common knowledge is computationally infeasible.  
     - **Negotiable?** **Non-negotiable** — Explicitly required for your use case.

  8. **Evidence Sensitivity**  
     - **Description**: The norm must weight the other agent's credence based on relative evidence quality (e.g., if they have access to data you lack, update more).  
     - **Case/Consideration**: Disagreement often stems from asymmetrical evidence (e.g., one agent saw a study you didn't). The norm must infer evidence strength from inputs (e.g., via confidence levels or metadata).  
     - **Why?** Addresses your core objection to Aumann: Real disagreement is evidence-driven.  
     - **Negotiable?** **Non-negotiable** — Without this, norms ignore the primary cause of disagreement.

  ---

  ### **Analysis of Desiderata**
  - **Negotiability Summary**:  
    - Non-negotiable: Coarse Input Handling (2), Robustness to Suspected Adversity (3), Self-Consistency (5), Unexploitability (6), Tractability (7), Evidence Sensitivity (8).  
    - Negotiable: Ideal Limit Approximation (1), Order-Independence (4).  

  - **Jointly Unsatisfiable Subset**:  
    - **Ideal Limit Approximation (1) + Tractability (7)** are jointly unsatisfiable in strict form. Aumann agreement requires unbounded computation and common knowledge, which violate tractability.  
      - **Resolution**: Relax (1) to "approximate agreement in simple cases" — a tractable norm can *aspire* to Aumann but not achieve it perfectly.  

  - **Requirement That Knocks Out the Most Candidate Rules**:  
    - **Unexploitability (6)** is the biggest killer. It eliminates:  
      - **Steadfastness** (ignoring others' views risks Dutch books).  
      - **Naive Conciliationism** (e.g., averaging) if updates create incoherent bet-acceptance.  
      - **Linear Pooling** (weighted averaging) if weights allow cyclic bets.  
      - Only rules with built-in coherence checks (e.g., Bayesian mediator models) survive, but these often fail Tractability (7) or Coarse Input (2).  

    By contrast, other requirements (e.g., Evidence Sensitivity (8)) mainly constrain *how* rules work, but Unexploitability (6) invalidates entire families outright for violating basic rationality.

  ---

  ### **Recommendation for Implementation**
  Focus on rules that:
  - Use **reliability-weighted averaging** (e.g., discounting inputs based on evidence of adversity) for Robustness (3) and Evidence Sensitivity (8).  
  - Incorporate **bet-avoidance checks** for Unexploitability (6).  
  - **Cache previous states** or use **iterative approximation** for Self-Consistency (5) and Tractability (7).  
  - Accept **fuzzy inputs** (e.g., "disagrees" → probabilistic belief in their credence) for Coarse Input (2).  

  Rules like **Logarithmic Opinion Pools** (weighted geometric averaging) satisfy most desiderata but struggle with Coarse Input (2) and Exploitability (6). **Bayesian Peer Models** (treating others as noisy signals) handle Evidence Sensitivity (8) well but often fail Tractability (7). Start with a tractable approximation of the latter for your software agent.
