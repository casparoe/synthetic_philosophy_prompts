answer: |-
  ### 1. Exam Question  

  **Metaethics Final Examination**  
  **Question 1 (20 marks)**  
  *Word limit: 1,200 words. Time: 90 minutes.*  

  **Stipulated Case:**  
  Consider a community whose moral judgments originate in evolutionary processes: selective pressures rewarded judgments that enhanced social coordination and reproductive fitness, with no causal sensitivity to moral truth. Subsequently, this community institutes a "Filtering Practice":  
  - Occurrent moral judgments are recorded.  
  - Any judgment contradicting deeply held commitments or flipping under case-redescription is discarded.  
  - Survivors are generalized into principles.  
  - These principles are used iteratively to revise further judgments over generations.  
  The Filtering Practice is purely internal; it never consults external moral facts or reality. The surviving judgments are perfectly coherent, stable under framing, and systematic.  

  **Answer the following:**  
  **(A)** Does membership in this filtered set give anyone *a reason to think the judgments are true*? Does it give a debunker *a reason they must take seriously*? Distinguish carefully between the two forms of evolutionary debunking arguments: (i) the "tracking" form (our judgments were shaped by non-truth-tracking forces), and (ii) the "explanatory" form (moral facts play no role in explaining our judgments).  
  **(B)** Suppose a debunker retreats: only *unreflective* judgments are debunked; *reasoned outputs* of the Filtering Practice are exempt. What must the debunker establish for this restriction to avoid arbitrariness? Can it withstand the objection that reasoning capacity and its inputs are products of the same selective history?  
  **(C)** Verdict: If you had to make your metaethical position consistent, which *single premise* would you abandon? What first-order ethical cost does this impose?  

  **Instructions:**  
  - Do **not** summarize readings or attribute views to authors. Engage the dialectic directly.  
  - Use standard argument labels (e.g., "third-factor," "companions in guilt") only to streamline your argument.  
  - Focus on the *structural crux*: what move separates understanding from memorization?  

  ---

  ### 2. Model Answer (800 words)  

  **(A)** Membership in the filtered set offers *no reason to think the judgments true*, but it demands *serious engagement* from the debunker regarding the tracking argument—though not the explanatory one.  

  The **tracking argument** claims evolutionary pressures lack a "truth-tracking" mechanism for morality. The Filtering Practice appears to address this: by enforcing coherence and stability, it mimics rational refinement. Coherence is prima facie truth-conducive; contradictions signal error. Thus, the debunker must explain why coherence—achieved without external input—fails to *initiate* truth-tracking. Their reply must be that coherence alone cannot establish a connection to moral facts if the inputs (evolutionarily shaped intuitions) lack initial truth-aptness. Without *some* initial sensitivity to truth, refining garbage yields polished garbage. The filtered set gives the debunker a reason to clarify why tracking requires more than internal consistency.  

  The **explanatory argument**, however, remains untouched. It asserts that moral facts play no role in the *best explanation* of our judgments. The Filtering Practice changes nothing here: its operations are purely psychological/social. The survival of judgments is explained by logical constraints and communal biases—not moral facts. Even perfect coherence is consistent with systematic illusion (e.g., a mathematically elegant but false physical theory). Thus, filtered membership provides no truth reason and no new explanatory burden for this debunking form.  

  **(B)** The debunker’s retreat—exempting "reasoned outputs"—requires establishing that practical reasoning is *epistemically independent* of its tainted inputs. Specifically, they must show:  
  1. Reasoning can generate *new justification* beyond its evolutionary inputs.  
  2. This capacity operates via *truth-oriented norms* (e.g., logical validity) not themselves shaped by fitness pressures.  

  This fails. Reasoning capacity evolved under the same selective pressures as moral intuitions: efficient cooperation, not truth. Its "norms" (e.g., parsimony, non-contradiction) may aid social coordination, but this offers no evidence they track moral truth. Worse, reasoning processes the very intuitions under suspicion. If inputs are corrupted, deductive systematization only preserves initial falsehoods; induction amplifies bias. To avoid arbitrariness, the debunker must identify a "clean" epistemic foundation within reasoning—yet all materials (concepts, heuristics) are genealogically tainted.  

  *Objection*: Reasoning escapes because it follows necessary truths (e.g., logic). *Reply*: Logic governs *form*, not moral *content*. Validity preserves truth but cannot generate it from false premises. The Filter’s principles lack external anchors.  

  **(C)** Verdict: I abandon **moral realism** (the premise that objective moral facts exist independently of human psychology).  

  *Cost in first-order ethics*: Moral claims lose *objective authority*. For example, "Torture is wrong" expresses a communal commitment (shaped by evolution and filtering), not a mind-independent truth. This weakens arguments against moral dissenters: if a society’s filtered norms permit slavery, we can reject them only by appealing to *our* contingent norms, not universal facts. Moral progress becomes reinterpreted as coherence-seeking adaptation, not discovery.  

  *Why not abandon a different premise?*  
  - Abandoning "evolution selects for fitness, not truth" is empirically untenable.  
  - Denying the explanatory argument’s force collapses into skepticism about all evolutionarily shaped faculties (e.g., perception)—an overreach.  
  Realism is the linchpin: without it, the debunker’s explanatory challenge dissolves, and coherence can suffice for "truth" within our framework. The cost is high but avoids self-undermining (unlike global skepticism).  

  ---

  ### 3. Marking Scheme (5 x 4 marks = 20)  

  | **Must-Hit Point (4 marks each)**                                                                 | **Common Failure (0 marks)**                                                                 |
  |---------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | **1. Distinguishes tracking/explanatory debunking** and identifies coherence as relevant *only* to tracking (not explanatory) argument. | Equivocates between arguments; claims coherence defeats both.                                |
  | **2. Argues filtered membership gives no truth reason**: Coherence without initial truth-sensitivity cannot initiate tracking.                                        | Assumes coherence implies probable truth; misses the "garbage in, garbage out" critique.     |
  | **3. Debunker’s retreat requirement**: Establishes that reasoning must be *epistemically independent* (new justification, truth-oriented norms) to avoid arbitrariness. | Claims reasoning automatically escapes debunking; ignores corrupted inputs/norms.            |
  | **4. Objects that reasoning is evolutionarily compromised**: Capacity/inputs shaped by same selective pressures; norms lack truth-tracking warrant.                | Conflates logical validity with moral truth; claims reasoning "purifies" inputs.             |
  | **5. Abandons a specific premise** and identifies a **concrete first-order cost** (e.g., realism → loss of objective authority/progress). | Picks an indefensible premise (e.g., evolution’s non-tracking); omits ethical cost.          |

  **Calibration Note**:  
  - **A (18–20)**: Hits all points; *explains why* the premise must be abandoned (e.g., realism sustains the explanatory argument’s force); cost is tied to ethical practice.  
  - **B (14–16)**: Hits points superficially; *identifies* premise abandonment but lacks depth on *why* it resolves the crux; cost stated but not developed.  
  - **C (10–12)**: Summarizes dialectic without engaging the stipulated case; misses >1 key point.  

  ---  
  **Rationale**: The question isolates the crux—**whether coherence without external input can answer explanatory debunking**—by forcing candidates to reject either realism or the evolutionary premise. Strong answers recognize that the Filter’s "refinement" is question-begging without initial truth-aptness, and that reasoning is genealogically entangled. Memorization fails here: no canned response addresses the novel case’s implications for the explanatory argument.
