prompt: |-
  im a junior and I got nerd-sniped by this after our school polled all 900 students on whether to switch the lunch schedule and the poll somehow beat the three teachers who had actually looked at the numbers. I started reading about Condorcet's jury theorem and now ive built an argument that I'm pretty sure is broken somewhere but I can't see where.

  (1) Jury theorem: if everyone independently has, say, a 60% chance of picking the better of two options, the majority does way better than any one person does, and as the group grows the majority's accuracy climbs toward 100%.
  (2) Independence is the fake part though. Real people read the same posts, copy each other, get spooked by the same rumor. So part of each person's error is shared — one common lean that pushes everybody the same direction.
  (3) The independent part of the error cancels out as you add people. That's the whole engine of the theorem.
  (4) The shared part doesn't cancel. It's the same for everybody, so averaging over more and more people can't touch it.
  (5) So in a huge group the shared lean is all that's left over, and it decides the outcome by itself: the majority is right exactly when the lean happens to point the right way, meaning accuracy heads to 50%, not 100%.
  (6) 50% is worse than the 60% you'd get by just asking one person. And if the lean points the wrong way at all, big groups are worse than useless.
  (7) So any real group decision is worth less than asking one random person, and the bigger the group the worse it does. Which is nuts given what happened with our lunch poll.

  I really want to keep (2), (3) and (4), they feel like the honest description of how people actually work, and I want to keep the theorem itself. So I guess I'm rejecting (5) or (6), but I can't say what's wrong with them without it sounding like I'm just refusing the conclusion because I don't like it.

  Can you tell me which step actually breaks and what giving it up costs me? Four sections, in this order: "Which step breaks" (about 150 words), "Why it looked fine" (about 100 words), "What it costs me" (about 200 words), "Bottom line" (about 50 words).
reasoning: |-
  Okay, the user is a junior in high school who got nerd-sniped by their school's lunch schedule poll. They've built an argument about why group decisions should be worse than individual ones using Condorcet's jury theorem, but they suspect a flaw. Let me break down their reasoning step by step.

  First, they correctly state the jury theorem: with independent voters each having >50% accuracy, majority accuracy increases with group size. Then they introduce the realistic factor of shared errors due to social influence. Their key claim is that in large groups, only the shared error remains, pulling accuracy down to 50% - worse than an individual's 60%. 

  The critical flaw is in step (5). While shared error does persist, it doesn't reduce accuracy to 50% in all cases. Here's why: if the shared error component is symmetric (equally likely to push toward correct or incorrect decisions), then when it dominates, the group's accuracy should indeed approach the probability that the shared error happens to align with the correct option. However, this probability isn't necessarily 50%. It could be higher if the information environment has some truth-leaning bias (e.g. reliable news sources). The user assumes perfect symmetry in the shared error, but real-world information ecosystems often have asymmetries favoring truth.

  For example, if most students hear moderately accurate arguments about the lunch schedule change, the shared "lean" might actually be correct 55-60% of the time rather than exactly 50%. The group's asymptotic accuracy would then reflect this bias, not automatically drop to 50%. 

  The user likely missed this because they focused on the theorem's independence requirement and the persistence of shared error, overlooking that the distribution of the shared error matters. Their model correctly shows shared error doesn't cancel, but incorrectly assumes its direction is coin-flip random. In reality, if the information environment has any truth-tilt, large groups can still outperform individuals despite dependence.

  This doesn't cost them their core insights about dependence weakening the jury theorem's power - it just prevents the overly pessimistic conclusion. Their observation about shared errors remains valid and important for critical thinking about group decisions. The lunch poll result might reflect that the student body's shared information environment happened to be reasonably accurate in this case.
answer: |-
  ### Which step breaks
  Step (5) is flawed. While the shared error persists and doesn’t cancel, it **does not necessarily reduce group accuracy to 50%**. The shared "lean" isn’t a symmetric coin flip; its direction depends on the *accuracy of the common information source*. If the shared information (e.g., news, rumors, or teacher input) has a >50% chance of leaning toward the correct outcome, the group’s asymptotic accuracy exceeds 50%. For example, if the rumor mill is 55% accurate, the large group’s accuracy approaches 55%, not 50%. The theorem’s collapse to 50% only occurs if the shared error is **perfectly unbiased** (equally likely to push toward right/wrong), which is unrealistic. Real information ecosystems often have a truth-leaning tilt.

  ### Why it looked fine
  The logic *seems* sound because shared error indeed dominates in large groups and doesn’t vanish. This correctly challenges the independence assumption of Condorcet’s theorem. The error arises from assuming the shared component must be directionally random (50/50). This feels intuitive—after all, "shared error" sounds arbitrary—but ignores that common information (e.g., factual posters, expert opinions) often carries residual reliability. You treated the shared lean as pure noise, not potentially signal-rich noise.

  ### What it costs me
  Abandoning step (5) forces me to accept that **shared information quality matters critically**. I can’t universally claim groups perform worse than individuals; it depends on whether the common knowledge base is better than random. If the shared environment is *systematically biased toward truth* (e.g., credible sources dominate rumors), large groups still outperform individuals. This weakens my radical conclusion but preserves my core insight: **dependence erodes the "wisdom of crowds" by exposing groups to systemic error**. The cost? I must now evaluate the *content* of shared influences (e.g., "Was the lunch debate fact-based?"). My model still explains why polarized groups fail (shared error dominates and is misaligned), but allows for functional democracies where shared institutions (e.g., free press) elevate group accuracy above 50%.

  ### Bottom line
  Groups under dependence don’t inevitably decay to 50% accuracy. Their fate hinges on the reliability of shared information—which, if even slightly truth-leaning, rescues large-group advantages. Your lunch poll likely succeeded because students shared *reasonably accurate* arguments.
