  For the self-referential clause, it should mirror the escalator principle: the speech's validity could be contingent on the amendment rule remaining substantially intact. And regarding total repeal of amendability - that would require specifying its own repeal procedure per the escalator rule, creating an interesting paradox about whether an institution can consciously choose rigidity.

