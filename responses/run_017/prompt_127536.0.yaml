prompt: |-
  At the investing-and-forecasting reading group I go to, people repeat that 'Kelly betting maximizes your long-run growth rate' as if that closed the discussion. It came up last week about a favourable-coin game: each round you may stake any fraction of your current bankroll at even odds, winning the stake with probability 0.6 and losing it otherwise — so the usual Kelly fraction is 20% — but with a hard floor: if your bankroll ever falls below 10% of its starting value, the game ends and you walk away with nothing. Someone said this shows that staking anything other than 20% is straightforwardly irrational, and that those of us who wanted a smaller fraction were 'paying a volatility tax for nothing'.

  I'd like a disambiguation rather than a verdict. What distinct precise theses could that slogan be expressing — about which quantity is supposedly maximized (expected log wealth per round, the almost-sure asymptotic growth rate, the median or mode of the wealth distribution, the probability of being ahead after a fixed number of rounds), about which class of rival strategies it is compared against, and about what horizon and what sense of 'beats'? For each reading on that menu, say whether it is true, whether it is a near-platitude or a substantive result, and whether it would really license the step from 'not Kelly' to 'irrational' rather than merely to 'aimed at something else'.

  Then say how the 10% floor interacts with all this. Does it leave the optimal constant fraction unchanged, does it make the optimal stake state-dependent rather than a fixed fraction of wealth, and in which direction does it push someone whose bankroll is currently close to the floor? Assume I know the standard derivation of the Kelly fraction, so don't re-derive it.
reasoning: |-
  We are discussing the Kelly criterion in the context of a favourable coin game with a hard floor. The standard Kelly fraction for this game (without a floor) is 20% because the edge is 0.6 - 0.5 = 0.1 and the odds are even (so b=1). The Kelly fraction is (bp - q)/b = (1*0.6 - 0.4)/1 = 0.2.

  However, there is a hard floor: if the bankroll ever falls below 10% of the starting value, the game ends and you get nothing.

  The slogan "Kelly betting maximizes your long-run growth rate" can be interpreted in several ways. We will break down the possible interpretations and then discuss the effect of the 10% floor.

  ### Interpretations of the slogan

  1. **Expected log wealth per round (or per bet)**
     - This is the standard interpretation. The Kelly fraction maximizes the expected value of the logarithm of wealth at each step. The growth rate is defined as (1/n) * E[log(W_n)] for n rounds, but in the long run, it is the same as maximizing E[log(1 + f*b)] per bet (where f is the fraction bet, b is the odds, and we have a win probability p).
     - **Truth**: True for the standard setting (without the floor). The Kelly fraction (20%) is the unique fraction that maximizes the expected log wealth per round.
     - **Nature**: It is a substantive result (derived from the law of large numbers and the properties of the logarithm).
     - **Does it license calling non-Kelly irrational?** Not necessarily. It is optimal for this specific criterion (long-run growth rate in the sense of expected log). However, other criteria (like minimizing the risk of ruin, or maximizing the median wealth) might lead to different fractions. So, if one's goal is to maximize the long-run growth rate (in the expected log sense), then deviating from Kelly is irrational for that goal. But if one has a different goal (like avoiding ruin or having a more certain outcome), then a different fraction may be rational.

  2. **Almost-sure asymptotic growth rate**
     - The Kelly strategy also maximizes the almost-sure limit of (1/n)*log(W_n) as n goes to infinity. This is a consequence of the law of large numbers: the long-run growth rate converges to the expected log return per bet.
     - **Truth**: True without the floor.
     - **Nature**: A near-platitude once you have the law of large numbers and the fact that the Kelly fraction maximizes the expected log return.
     - **Rationality**: Similar to above. It supports the same conclusion.

  3. **Median or mode of the wealth distribution after a fixed number of rounds**
     - Kelly does not necessarily maximize the median or mode of the wealth distribution. In fact, for a fixed horizon, the median wealth may be maximized by a fraction different from Kelly. For example, in some cases, a fraction higher than Kelly might lead to a higher median (if the distribution is skewed) but also higher risk. However, in the very long run, the Kelly strategy dominates in the sense that it will almost surely outperform any other strategy (by the property of the growth rate). But for finite horizons, the median might be maximized by a different fraction.
     - **Truth**: Not generally true for median or mode. The median after n rounds might be maximized by a fraction less than Kelly if we are concerned about avoiding ruin, or more than Kelly if we are aggressive and the horizon is fixed and not too long.
     - **Nature**: This is a substantive point that is often misunderstood. The Kelly fraction is not necessarily the one that maximizes median wealth.
     - **Rationality**: Therefore, if an investor cares about the median outcome (which might be a reasonable goal to avoid extreme outcomes), then using a fraction different from Kelly may be rational.

  4. **Probability of being ahead after a fixed number of rounds**
     - Kelly does not necessarily maximize the probability of being ahead after a fixed number of rounds. For example, in a favourable game, betting very small amounts may give a high probability of being ahead (but by a small amount) while betting too much might lead to a high chance of ruin. There is often a fraction (less than Kelly) that maximizes the chance of being ahead.
     - **Truth**: Not true. In fact, for the coin flip example, it is known that a fraction less than Kelly (about half Kelly) maximizes the probability of being ahead after a fixed number of rounds.
     - **Nature**: A substantive result that is not immediately obvious.
     - **Rationality**: If one's goal is to maximize the chance of being ahead (say, to meet a liability) then a non-Kelly fraction is rational.

  ### The 10% floor

  The introduction of a hard floor (game ends if bankroll falls below 10% of starting value) changes the problem significantly.

  1. **Effect on the optimal strategy**:
     - Without the floor, the optimal constant fraction (for maximizing the long-run growth rate) is 20%. However, with the floor, the strategy of constantly betting 20% might lead to a non-zero probability of hitting the floor (and getting zero) which would reduce the long-run growth rate. Therefore, the optimal strategy is no longer a constant fraction of 20% (or any constant fraction) because as the bankroll approaches the floor, one might want to bet less to avoid ruin.
     - The optimal strategy becomes state-dependent: when the bankroll is far above the floor, one might bet close to 20%, but as the bankroll approaches the floor, one must bet a smaller fraction (or even zero) to avoid crossing the floor.

  2. **Direction for someone close to the floor**:
     - For a bankroll close to the floor (say, just above 10% of the starting value), the optimal bet fraction should be very small (or zero) to avoid the risk of ruin. This is because the penalty for falling below the floor is total loss (and the game ends). Thus, the strategy becomes more conservative near the floor.

  3. **Does the floor leave the optimal constant fraction unchanged?**
     - No. Even if we restrict to constant fraction strategies (which are not optimal in this new setting), the optimal constant fraction would be less than 20% because the risk of ruin (from the floor) is now a factor. We must choose a fraction that balances growth and the risk of ruin. In fact, a constant fraction of 20% might have a positive probability of ruin (if we have a long enough sequence of losses). Therefore, to avoid ruin, we might choose a fraction such that even after the worst sequence of losses we do not fall below the floor.

     For example, starting with bankroll B0, after k consecutive losses, the bankroll would be:
          B_k = B0 * (1 - f)^k
     We require that B_k >= 0.1 * B0, so:
          (1 - f)^k >= 0.1
     However, we don't know k (the number of consecutive losses) in advance. But if we want to survive arbitrarily long sequences, then we require that the bankroll never falls below 0.1*B0. The worst-case scenario is an infinite sequence of losses. Then we require:
          lim_{k->infty} (1-f)^k >= 0.1
     But the limit is 0 (if f>0) unless we set f=0. Therefore, no constant fraction strategy (with f>0) can guarantee survival. However, we might choose f such that the probability of ruin (hitting the floor) is very low over a reasonable horizon. Alternatively, we might accept a small risk of ruin and choose f to maximize the growth rate under that constraint.

     In practice, with the floor, the constant fraction that maximizes the long-run growth rate (without state-dependence) would be less than 20%, and it would be chosen so that the risk of ruin (over the intended playing period) is acceptable.

  4. **Long-run growth rate with the floor**:
     - The presence of the floor truncates the distribution of outcomes. The growth rate must now account for the possibility of ruin (which sets the wealth to zero). Therefore, the expected log growth rate becomes:
          p * log(1 + f) + q * log(1 - f)   [for a bet that wins with probability p and loses with probability q]
     but only until the bankroll is above the floor. If the bankroll falls below the floor, the game ends and the log wealth becomes -infinity (or in practice, we consider the log of zero as a very large negative number). Therefore, the expectation must include the probability of ruin.

     This makes the optimization problem more complex. The state-dependent strategy (which adjusts the bet fraction based on the current bankroll) is the truly optimal one. Near the floor, the optimal fraction is lower.

  ### Conclusion

  The slogan "Kelly betting maximizes your long-run growth rate" is true in the standard setting (without a floor) for the interpretations (1) and (2) above. However, in the presence of a hard floor, the standard Kelly fraction (20%) is no longer optimal. The optimal strategy becomes state-dependent, and near the floor it pushes towards a smaller fraction (even zero) to avoid ruin.

  The criticism that non-Kelly bettors are "paying a volatility tax for nothing" is only valid if:
     - There is no floor (or other constraints) and 
     - The sole objective is to maximize the long-run growth rate (in the expected log sense).

  In the presence of the floor, reducing volatility (by betting less) is rational to avoid the catastrophic outcome (ruin). Therefore, in this modified game, it is rational to bet less than 20% (at least when the bankroll is near the floor, and possibly even when it is not, to reduce the overall risk of ruin).

  In summary, without the floor, deviating from Kelly is irrational if the goal is solely to maximize the long-run growth rate. But with the floor, or if the goals are different (such as maximizing the probability of being ahead or avoiding ruin), then deviating from Kelly is not irrational. It is a matter of aligning the strategy with the objectives and constraints.
answer: |-
  ### Disambiguation of "Kelly Betting Maximizes Your Long-Run Growth Rate"

  The slogan is often invoked to defend the Kelly criterion, but its precise meaning and implications depend on context. Below, I disambiguate the thesis, evaluate its validity, and discuss its applicability to rationality claims. Then, I address the impact of the 10% floor.

  ---

  ### **I. Interpretations of the Slogan**
  Here are distinct precise theses the slogan could express, along with their truth status, significance, and implications for rationality:

  1. **Maximizes expected log wealth per round**  
     - **Thesis**: Kelly maximizes \( \mathbb{E}[\log(1 + fX)] \) per bet, where \( f \) is the fraction bet and \( X \) is the random return.  
     - **Truth**: True. For your game (60% win chance, even odds), \( f^* = 0.6 - 0.4 = 0.2 \).  
     - **Nature**: Substantive result (derived via calculus; not obvious).  
     - **Rationality implication**: Only irrational if your **sole goal** is maximizing this expectation. Other goals (e.g., survival) justify deviations.  

  2. **Maximizes the almost-sure asymptotic growth rate**  
     - **Thesis**: Kelly maximizes \( \lim_{n \to \infty} \frac{1}{n} \log W_n \) almost surely, where \( W_n \) is wealth after \( n \) bets.  
     - **Truth**: True. Follows from the law of large numbers applied to \( \log W_n \).  
     - **Nature**: Near-platitude once expected log per round is maximized.  
     - **Rationality implication**: Same as above. Deviations are irrational *only* for this specific aim. Ignores finite-horizon risks.  

  3. **Maximizes median/mode of terminal wealth**  
     - **Thesis**: Kelly maximizes the median or mode of \( W_n \) for large \( n \).  
     - **Truth**: **False**.  
       - Kelly maximizes growth but not necessarily median/mode.  
       - In your game, full-Kelly (20%) has a right-skewed distribution: most paths end below the median due to volatility drag.  
       - A fraction \( < 20\% \) often maximizes the median.  
     - **Nature**: Common misconception; a substantive correction.  
     - **Rationality implication**: If you prefer higher median wealth (a "safer" outcome), sub-Kelly is rational.  

  4. **Maximizes probability of being ahead after \( n \) rounds**  
     - **Thesis**: Kelly maximizes \( \mathbb{P}(W_n > W_0) \) for large \( n \).  
     - **Truth**: **False**.  
       - Betting \( f \approx \text{half-Kelly} \) (e.g., 10%) often maximizes this probability.  
       - High volatility from full-Kelly increases the chance of large drawdowns.  
     - **Nature**: Substantive result (counterintuitive to some).  
     - **Rationality implication**: If your goal is to "not lose money", sub-Kelly is rational.  

  5. **Dominates rival strategies in the long run**  
     - **Thesis**: Kelly almost surely outperforms any other strategy as \( n \to \infty \).  
     - **Rival class**: Constant-fraction strategies (e.g., fixed \( f \neq f^* \)).  
     - **Truth**: True for constant-fraction rivals.  
       - \( \frac{1}{n} \log W_n^{\text{Kelly}} > \frac{1}{n} \log W_n^{f} \) almost surely for \( f \neq f^* \).  
     - **Nature**: Substantive (breeds overconfidence; assumes no ruin).  
     - **Rationality implication**: Only relevant if you live "forever" and ignore ruin. With finite life or constraints, irrelevant.  

  ---

  ### **II. The 10% Floor: How It Changes the Game**
  The floor (\( W_t < 0.1 W_0 \) ends the game) fundamentally alters the dynamics. Key implications:

  1. **Optimal fraction is no longer constant**:  
     - Without a floor, constant \( f^* = 20\% \) is optimal for asymptotic growth.  
     - With a floor, the optimal strategy becomes **state-dependent**. You must reduce bets as you approach the floor to avoid ruin.  

  2. **Direction near the floor**:  
     - If bankroll is close to \( 0.1W_0 \), **betting 0% is optimal**.  
       - Rationale: A loss ends the game (zero terminal wealth), while winning yields modest gains. The risk of termination outweighs growth.  
     - Example: At \( W_t = 0.11W_0 \), betting 20% risks ruin with 40% probability. A smaller fraction (e.g., 1–5%) balances growth and survival.  

  3. **Global impact on strategy**:  
     - **Constant fractions are suboptimal**: Even far from the floor, you must preemptively reduce bets to lower the probability of ever nearing the floor.  
     - **Optimal fraction is everywhere \( \leq 20\% \)**: The floor truncates the wealth distribution, making volatility more harmful. Growth maximization now requires reducing \( f \) universally.  

  4. **Does the floor leave the Kelly fraction unchanged?**  
     - **No**. Asymptotic arguments fail because the game may end prematurely.  
     - Rational constant fractions (if forced) are \( < 20\% \). For example, \( f = 10\% \) might dominate \( f = 20\% \) by reducing ruin risk.  

  ---

  ### **III. Was the Criticism Valid?**
  The claim that non-Kelly bettors are "paying a volatility tax for nothing" **misapplies the slogan**:
  - **Volatility tax**: Refers to the penalty from variance (e.g., \( \mathbb{E}[\log W_n] < \log \mathbb{E}[W_n] \)).  
  - **Why it fails here**:  
    - Without a floor, avoiding volatility *is* irrational if your goal is max growth (since Kelly already optimizes this).  
    - **With a floor**, volatility increases ruin risk. Reducing \( f \) is not "for nothing"—it rationally balances growth and survival.  
    - The critic ignored the **changed objective** (survival vs. asymptotic growth) and **constraints** (floor).  

  ---

  ### **Summary**
  - **Slogan truths**: Kelly maximizes expected log wealth per round and almost-sure growth rate **without constraints**.  
  - **Slogan falsehoods**: It does not maximize median wealth, probability of being ahead, or safety.  
  - **Rationality**: Deviating from Kelly is irrational **only** if your goal is unconstrained asymptotic growth. For other goals (e.g., survival, finite-horizon performance), sub-Kelly is rational.  
  - **10% floor**:  
    - Makes constant-fraction Kelly irrational.  
    - Forces state-dependent betting (lower near the floor).  
    - Universally pushes optimal fractions below 20%.  

  The floor transforms the problem: growth maximization now requires **volatility management**. Your group's critic overlooked that "long-run growth" is undefined if the game might end prematurely. Rationality depends on goals—and survival is a goal Kelly ignores.
