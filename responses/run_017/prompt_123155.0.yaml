  After some thought, let's assume that the writing process from B to 0 or 1 is done without work cost because the states B,0,1 are degenerate and the writing is a spontaneous thermal transition that is biased by the state of S. For example, if S is in 0, then the tape bit has a higher rate to go to 0 than to 1. But then the writing process might take time and be done in contact with the bath. The work involved is zero if the energy is the same, but the entropy increases, so heat is absorbed from the bath. That's acceptable.

  So in the measurement and writing step, we assume it is done with no work cost, but it may exchange heat. The entropy of the tape bit increases by ln(2) (because it goes from one state to two states with equal probability), so it absorbs heat of T ln(2) from the bath. That's fine.

  Then, in the feedback step, we extract work as described.

  So the entire cycle:

  1. Measurement and writing: 
     - The tape bit goes from B to 0 or 1, with probabilities 1/2 each, and correlated with S (error rate ε). 
     - This step: work done on the system=0, heat absorbed = T * (change in entropy of the tape bit) = T * [ - (1/2) ln(1/2) - (1/2) ln(1/2) - 0 ] = T ln(2).
     - The system S might also change? We assume that during this step, S is not affected, or if it is, it returns to equilibrium? To simplify, assume that the measurement is quick and S doesn't change during the measurement. Or, we can have it as part of the interaction, but then we have to account.

  To keep it simple, we'll assume that after the measurement and writing, S is still in its initial state (which is thermal equilibrium). This is an approximation, but we can assume that the measurement is nondestructive.

  2. Feedback for T=1 (which occurs with probability 1/2):
     a) Insert barrier: work 0.
     b) Expand the right side from V to 2V: 
          - If S=1 (probability 1-ε given T=1), extract work W1 = kT ln(2)
          - If S=0 (probability ε given T=1), extract work 0.
     c) Remove barrier and let the system freely expand to 3V: no work, but heat dissipated? Actually, in free expansion of an ideal gas, the work is 0 and the heat absorbed is 0, but the entropy increases. The free energy decrease is dissipated.
     d) Isothermal compression from 3V to 2V: work done on the system = kT ln(3/2) [negative from our perspective, so we spend this work].

     So net work in feedback and reset for T=1 branch: W_expansion - W_compression = [ (1-ε) kT ln(2) ] - [ kT ln(3/2) ]

  3. For T=0, we do nothing.

  So total work per cycle:

  W_net = P(T=1) * [ (1-ε) kT ln(2) - kT ln(3/2) ] 
         = (1/2) kT [ (1-ε) ln(2) - ln(3/2) ]

  We choose ε=0.1, then:
     ln(2) ≈ 0.6931, ln(3/2)=ln(1.5)≈0.4055
     (1-ε) ln(2) = 0.9 * 0.6931 = 0.62379
     then 0.62379 - 0.4055 = 0.21829
     then W_net = (1/2) * 0.21829 * kT = 0.109145 kT

  This is positive.

  Now, we have written one bit to the tape. The number of bits written is 1. The Shannon entropy of the record (the tape bit) is 1 bit (because it's equally likely 0 or 1). The mutual information between the record T and the system S:

  I(S;T) = H(T) - H(T|S) = 1 - [ - [ (1-ε) ln(1-ε) + ε ln(ε) ] ] in natural units? Wait, entropy in nats.

  H(T) = ln(2) nats.
  H(T|S) = for each state of S, T is wrong with prob ε, so H(T|S) = binary entropy in nats: h(ε) = - [ε ln(ε) + (1-ε) ln(1-ε)]

  So I(S;T) = ln(2) - h(ε)

  For ε=0.1, h(0.1) = - [0.1*ln(0.1) + 0.9*ln(0.9)] ≈ - [0.1*(-2.3026) + 0.9*(-0.1054)] = - [-0.23026 - 0.09486] = - [-0.32512] = 0.32512 nats.

  ln(2)≈0.6931 nats, so I(S;T) = 0.6931 - 0.32512 = 0.36798 nats.

  Now, the work extracted per cycle in joules: at 300K, kT = 1.38e-23 * 300 = 4.14e-21 J.
  So W_net = 0.109145 * 4.14e-21 = 4.518e-22 J.

  In units of kT ln(2): we have W_net = 0.109145 kT, and kT ln(2) is the unit, so W_net = 0.109145 / ln(2) ≈ 0.109145 / 0.6931 ≈ 0.1575 (in units of kT ln(2)).

  But per cycle, we also have the writing of one bit. The entropy of the record is 1 bit = ln(2) nats.

  Now, the ledgers:

  1. Erasure ledger: cost per bit erased. In this cycle, no bit is erased. The tape bit was blank and is now written. So cost = 0.

  2. Feedback ledger: the extractable work is bounded by kT * I(S;T) = kT * 0.36798 nats. In units of kT ln(2), we have I(S;T) = 0.36798 / ln(2) ≈ 0.531 bits. So bound is about 0.531 kT ln(2). Our extracted work is 0.1575 kT ln(2), which is less than the bound, so it's okay. Where is the dissipation? It occurs in the reset step when we compress the gas and also in the measurement and writing step if it was irreversible. In our case, the measurement and writing step absorbed heat from the bath but didn't require work, so it might be considered as not dissipated in work terms. However, in the reset step, we had to spend work to compress, and also the free expansion dissipated heat. Specifically, the work spent in reset (for the T=1 branch) is kT ln(3/2) = 0.4055 kT, while the work extracted was only (1-ε) kT ln(2) = 0.62379 kT, and the difference is not fully accounted. Also, the bound from mutual information is about 0.36798 kT, and we extracted 0.109145 kT, which is less, so the bound is satisfied. The difference might be due to the additional entropy production in the reset step.

  3. Resource ledger: the blank tape bit is a low-entropy resource. Initially, it was in state B (entropy 0), and after writing, it has entropy ln(2) nats. The minimum work required to reset a bit from a random state to a known state is kT ln(2) (in nats: kT * ln(2)). But in this cycle, we haven't reset it; we used it as a resource. The work we extracted is only 0.109145 kT, which is less than kT ln(2) ≈ 0.6931 kT. So the medium's entropy increase is paid by the heat bath (during the writing step, we had heat absorption of T ln(2) from the bath). But to restore the medium (reset the tape bit from 0 or 1 back to B), someone would have to pay at least kT ln(2) per bit. In this cycle, we are not restoring it; we are using a fresh blank bit. When the tape runs out, we would have to reset it at a cost of kT ln(2) per bit, which is more than the work we extracted per bit (0.109145 kT). So overall, if we consider the entire system including the tape, we are not getting something for nothing.

  Now, the structural feature: the use of a fresh low-entropy medium (blank bit) for each cycle. If we try to reuse the same bit, we would have to reset it, which would cost kT ln(2), and then the net work would be negative. For example, if after the cycle, we reset the tape bit from its written state (0 or 1) back to B, it would cost at least kT ln(2) of work. Then the net work per cycle would be 0.109145 kT - kT ln(2) = 0.109145 - 0.6931 = -0.583955 kT, which is negative. So it only works if we have an external supply of fresh blank bits.

  If we remove the fresh medium and instead reset the memory each cycle, we collapse to the standard one-molecule engine with erasure cost. In that case, the work extracted would be bounded by kT I, but we would have to pay for erasure. Specifically, if we reset the tape bit to B after each cycle, then the cost is kT ln(2) and the extracted work is only 0.109145 kT, so net work is negative. Alternatively, we could integrate the erasure cost into the cycle and see that without the blank medium, the ledger shows a loss.

  The defender of the erasure ledger would say that writing to the medium is erasure deferred, and the kT ln(2) is paid when fresh blank bits are prepared. Therefore, nothing new has been shown. This reply is a relocation of the system boundary. If we include the preparation of the blank bits, then the cost appears there. However, our case establishes that the erasure cost is not necessarily paid at the demon's processor during the cycle but can be outsourced to a separate process (preparation of the medium). Therefore, erasure is not the only locus of the cost; it is one place where the cost can be paid, but the fundamental cost is the low-entropy resource which can be consumed. In this case, the work extraction is enabled by the consumption of the low-entropy medium, and the cost is paid when that medium is prepared.

  In summary, the case shows that the erasure ledger is not universal; the cost can appear in a ledger for resource consumption. It does not establish that erasure is avoidable without cost, only that the cost can be deferred to a different process.

  Final design in one paragraph:

  Consider a symmetric double-well system (states 0 and 1, each with probability 1/2) at temperature T, and a tape of bits, each initially in a blank state B. In each cycle: (1) The demon measures the system's state with error rate ε=0.1 and writes the outcome to the next blank bit, changing it to 0 or 1. This writing is done without work cost, but increases the bit's entropy by k ln(2). (2) If the written bit is 1, the demon inserts a barrier (work 0), expands the right well from volume V to 2V if the particle is there (extracting work kT ln(2) with probability 1-ε), then removes the barrier and compresses the system from volume 3V to 2V (work cost kT ln(3/2)), and reinserts the barrier to return to two wells of volume V (work 0). If the bit is 0, nothing is done. The net work extracted is positive (0.109 kT for ε=0.1), and one bit is written to the tape. The mutual information between the system and the bit is 0.368 kT in energy units. The ledgers: erasure shows no cost (0), feedback shows work bounded by mutual information (0.368 kT), and resource shows the medium's entropy increase (ln(2) in nats) requiring future work of at least kT ln(2) for reset, which is not paid in the cycle.

  This meets the request.
answer: |-
  ### Device Design
  Consider a symmetric double-well potential (system) at 300 K, with a particle equally likely in the left (L) or right (R) well. A finite tape of bits, initially blank (state B, a distinct low-entropy state), is supplied. The demon couples to the system via a weak probe: during measurement, the system's state is copied to a target tape bit with error rate ε = 0.1, changing it from B to 0 (L) or 1 (R). This writing is thermodynamically neutral (work-free, heat absorbed from bath). If the bit reads 1, feedback occurs: a barrier is inserted reversibly (no work), the right well expands from volume V to 2V (extracting work only if the particle is in R), the barrier is removed (free expansion to 3V, dissipating heat), and the system is compressed isothermally from 3V to 2V (work cost). The barrier is reinserted to restore the double well (volume V each side). If the bit reads 0, no action is taken. The system and demon's processor return to initial states; the tape bit now carries a 0 or 1. The cycle writes one bit per run. When the tape runs out, it must be externally reset to B, costing work not accounted for in the cycle.

  ### Cycle Accounting (ε = 0.1, T = 300 K)
  1. **Work extracted per cycle**:  
     - Net work: \( W_{\text{net}} = \frac{1}{2} kT \left[ (1 - \varepsilon) \ln 2 - \ln(3/2) \right] \)  
       - \( kT = 4.14 \times 10^{-21} \, \text{J} \), \( \ln 2 \approx 0.693 \), \( \ln(3/2) \approx 0.4055 \)  
       - \( W_{\text{net}} = 0.5 \times 4.14 \times 10^{-21} \times [0.9 \times 0.693 - 0.4055] = 4.52 \times 10^{-22} \, \text{J} \)  
       - In \( kT \ln 2 \) units: \( W_{\text{net}} / (kT \ln 2) \approx 0.157 \)  
     - Bits written: 1  
     - Shannon entropy of record: \( H(R) = \ln 2 \approx 0.693 \, \text{nats} \) (1 bit)  
     - Mutual information \( I(S;R) = \ln 2 - h(\varepsilon) \):  
       - Binary entropy \( h(\varepsilon) = -\varepsilon \ln \varepsilon - (1 - \varepsilon) \ln (1 - \varepsilon) \approx 0.325 \, \text{nats} \)  
       - \( I(S;R) = 0.693 - 0.325 = 0.368 \, \text{nats} \) (0.531 bits)  

  ### Ledgers (in \( kT \ln 2 \) units)
  (a) **Erasure ledger**: Cost = \( kT \ln 2 \) per bit erased.  
  - No bits erased in cycle (blank bit written to, not overwritten). Cost = 0.  

  (b) **Feedback ledger**: Extractable work bounded by \( kT \cdot I(S;R) \approx 0.531 \, kT \ln 2 \).  
  - Extracted work = 0.157 \( kT \ln 2 \) < bound. Compensation: Dissipation occurs in reset steps:  
    - Free expansion (barrier removal) dissipates \( kT \ln 3 \approx 1.099 \, kT \) (if particle in L) or \( kT \ln(3/2) \approx 0.585 \, kT \) (if in R) as heat.  
    - Measurement noise entropy \( H(R|S) = h(\varepsilon) = 0.325 \, \text{nats} \) accounts for irrecoverable energy (lost to heat during writing).  

  (c) **Resource ledger**: Work bounded by medium's entropy increase \( \Delta S_{\text{tape}} = \ln 2 \).  
  - Tape entropy increase = \( \ln 2 \) nats. Work to restore medium = at least \( kT \ln 2 \approx 0.693 \, kT \) (paid externally when resetting tape to B).  
  - Extracted work (0.157 \( kT \ln 2 \)) < restoration cost.  

  ### Structural Feature and Collapse
  **Feature**: Consumable low-entropy medium (blank bits). Writing defers erasure cost; fresh bits enable net work.  
  **Collapse if memory reset**: If the tape bit is reset to B within the cycle:  
  - Reset cost = \( kT \ln 2 \) (minimum). Net work = \( 0.157 \, kT \ln 2 - kT \ln 2 = -0.843 \, kT \ln 2 \).  
  - All ledgers align: erasure cost (1 bit), feedback bound \( kT \cdot I(S;R) \approx 0.531 \, kT \ln 2 \) (insufficient to cover extraction and reset), and resource cost \( kT \ln 2 \). System becomes a standard one-molecule engine with net work negative.  

  ### Reply to Erasure-Ledger Defender
  **Defender's claim**: Writing is erasure deferred; \( kT \ln 2 \) is paid during blank-bit preparation. Nothing new.  
  **Assessment**: This relocates the system boundary but is a real explanation. The case establishes that erasure is not the unique locus of cost—it is one implementation of the fundamental cost: entropy export to a reservoir. The device shows that work extraction can be credited to *consumption* of a low-entropy resource (blank medium), with the cost paid externally. It does not violate the second law; it clarifies that the erasure ledger is a choice of accounting, not a physical necessity. The cost appears on the resource ledger when boundaries include preparation.
