prompt: |-
  I am the permanent rapporteur — I keep the record, draft the text, and write the one-page note that goes out with each draft — of the standing drafting committee of a coalition of six membership organisations that issues joint position statements on health and social policy. Our members disagree not about the facts but about what matters: a public-health association that aggregates population welfare; a patient-choice advocacy organisation organised around individual autonomy; a professional association of clinicians whose commitments are role-based (non-abandonment, professional integrity); a disability-rights organisation concerned with equal standing; a network of faith-based hospitals and hospices bound by teaching on the sanctity of life; and a health-economics institute committed to cost-effectiveness. We publish eight to ten statements a year. They are quoted in regulatory consultations and in parliamentary evidence, and a member declining to sign is a public event; two withdrawals in three years have led our funders to ask what a joint voice is worth.

  I have read a little of the philosophical discussion of compromise between value systems — the suggestion that parties who rank outcomes differently can each do better by their own lights under an agreed package than they would under no statement at all, in something like the way parties with different endowments each gain from trade. What I need is not more of that, but a procedure I can actually run.

  The constraints are real. I get one ninety-minute session with the six representatives and one two-week written round. The representatives are senior policy professionals with no philosophical training, and none of them will read anything longer than a page. The chair rotates among the members, so I cannot rely on a neutral arbiter. Every member has a named representative who must personally sign, and I am the one who has to tell a member that the text it is being asked to sign is not one it can defend to its own constituency.

  Please give me the following.

  An ordered set of questions to run on a proposed package — the joint text as a whole, not clause by clause in isolation — with a statement, for each question, of what counts as a sufficient answer, which answers stop the procedure with a no, and which hand the decision to a person because it turns on values rather than on facts. The questions have to be answerable in the session by a non-specialist in a few minutes each.

  Alongside it, a classification of the moves a concession can consist in, since I think the kind of concession matters more than its size. My own rough distinction is between conceding that one's principle does not reach this case, conceding that it carries less weight here than one claimed, conceding that someone else should decide, and leaving the words open so that each member can read them its own way. Correct, refine, or replace this: I want to know which of these distinctions has to survive into a one-page procedure and which can be dropped without loss.

  A test that works across statements rather than within one. Members make small concessions repeatedly, and I suspect that a run of individually defensible concessions can carry the coalition somewhere none of the members would have endorsed at the start, without any single step being the one to blame. I keep a record of every concession by member and by kind; tell me what to do with it, and what to check when the same member has conceded more than once in the same way.

  Two further complications the procedure has to survive. First, the same sentence is a different act for different members: for one it is a policy recommendation, for another it is an act of institutional witness that its own authority will judge, so identical words do not cost them the same. Second, some of our representatives have learned that declaring a red line early is rewarded; if the procedure simply asks each member where its limits are, it will be gamed, and I have no way to verify what a member tells me about its own thresholds.

  Then apply the procedure to three cases I have in front of me, showing where it stops and why:

  1. A statement on a national screening programme: automatic enrolment with an opt-out, which the public-health association wants and the patient-choice organisation resists; a duty-to-advise clause the clinicians want; a guarantee of accessible invitation formats the disability-rights organisation wants; and a cost-effectiveness threshold the health-economics institute wants, which would exclude one age band the public-health association cares about.

  2. A statement on assisted dying for a parliamentary consultation, where the faith-based network cannot sign anything that implies permissibility and the patient-choice organisation wants an endorsement of access.

  3. A statement on automated eligibility decisions in welfare, where the concession being asked of the patient-choice organisation is small and, taken alone, defensible — but it is the fourth concession of the same kind it has made in two years, and the regulator's consultation closes in three weeks.

  I would expect the third to be the one where the procedure tells me something I do not want to hear; say plainly what that is and what I should do with it. Finally, tell me what the procedure cannot do: which of my problems it will leave exactly as it found them.
reasoning: |-
  We are designing a procedure for a standing drafting committee with six members representing different value systems. The goal is to reach consensus on joint position statements. The procedure must be efficient (one 90-min session and one two-week written round), practical for non-specialists, and robust to strategic behavior.

  The procedure will focus on the package as a whole (the entire draft statement) and use a set of ordered questions. We'll also define types of concessions and a method to track concessions over time to avoid value drift. Finally, we'll apply the procedure to the three cases and identify limitations.

  ### Part 1: Ordered Set of Questions for a Proposed Package

  The questions are designed to be answered in a few minutes each by non-specialists. They are ordered to first address the most fundamental issues and then move to specifics.

  1. **Question 1: Does this package, taken as a whole, advance your organization's core mission?**
     - *What counts as a sufficient answer?* A yes or no, with a brief explanation (one sentence).
     - *Stop condition:* If any member says "no", the package fails and we stop. (Because if the package does not advance the core mission, there is no reason to sign.)
     - *Hand to a person?* No. This is a factual question about the organization's mission and the package's alignment. However, the representative must decide based on their understanding of the mission.

  2. **Question 2: Are there any elements in the package that directly contradict a non-negotiable principle of your organization?**
     - *What counts as a sufficient answer?* A clear identification of the element and the principle it contradicts.
     - *Stop condition:* If any member identifies such an element and cannot see a way to modify it, the package fails. (But note: we are at the package level, so we are not negotiating yet. We are screening for absolute barriers.)
     - *Hand to a person?* No. The representative should know their non-negotiables. However, if there is a dispute about whether a principle is non-negotiable, that might be escalated within the organization, but in the meeting, the representative's word is taken.

  3. **Question 3: Considering the package as a whole, does it represent a net gain for your organization's objectives compared to having no statement?**
     - *What counts as a sufficient answer?* A yes or no, with a brief rationale.
     - *Stop condition:* If any member says "no", the package fails. (This is the "better than nothing" test from the philosophical idea of compromise.)
     - *Hand to a person?* No. This is a strategic assessment by the representative.

  4. **Question 4: Are the concessions required from your organization in this package defensible to your constituency?**
     - *What counts as a sufficient answer?* A yes or no. If no, the representative must specify which concession(s) are indefensible.
     - *Stop condition:* If any member says "no", the package fails. (Because signing would risk the representative's standing with their constituency.)
     - *Hand to a person?* This is a judgment call by the representative, but it is based on their knowledge of their constituency. We take their word for it.

  5. **Question 5: Is the language of the package sufficiently ambiguous on any point where your organization requires flexibility to allow for your interpretation?**
     - *What counts as a sufficient answer?* The representative must identify any point where ambiguity is needed and confirm that the current language provides it. If not, they must specify.
     - *Stop condition:* If a member requires ambiguity on a point and the language is clear in a way that contradicts their view, the package fails unless the language can be adjusted. (But note: this is the package as a whole, so we are not adjusting yet. We are assessing the current draft.)
     - *Hand to a person?* No. This is about the text and the organization's needs.

  If the package passes all five questions (i.e., no member triggers a stop condition), then it is acceptable in principle. However, note that we are only at the stage of evaluating the package. If a package fails at any question, then the committee must decide whether to drop the statement or revise it.

  But note: The procedure above is for a single round of evaluation. In practice, after a failure, the committee might revise the package and run the questions again. However, in the 90-minute session, we might only have time for one or two iterations.

  ### Part 2: Classification of Concessions

  Your rough distinction is:
  - A: Conceding that one's principle does not reach this case.
  - B: Conceding that it carries less weight here than one claimed.
  - C: Conceding that someone else should decide.
  - D: Leaving the words open so that each member can read them its own way.

  We refine this into four types that are mutually exclusive and cover the moves:

  1. **Scope Concession (A):** "My principle does not apply to this specific case." (e.g., "Our principle of individual autonomy does not extend to public health emergencies.")
  2. **Weight Concession (B):** "My principle applies, but in this context, it is overridden by other considerations." (e.g., "Cost-effectiveness is important, but in this case, equity concerns are more pressing.")
  3. **Delegation Concession (C):** "The decision on this point should be made by [a specific authority] and not by us." (e.g., "We defer to clinical judgment on this matter.")
  4. **Ambiguity Concession (D):** "The language is open to interpretation, so I can read it in a way that aligns with my principles." (e.g., using the term "fair" without defining it.)

  These types are important because they have different implications for defensibility and precedent. Scope and Ambiguity concessions are less damaging because they don't admit a weakening of the principle. Weight concessions are more serious because they set a precedent that the principle can be overridden. Delegation concessions shift the responsibility.

  In the procedure, when we ask about defensibility (Question 4), the type of concession matters. A representative might be able to defend a Scope or Ambiguity concession more easily than a Weight concession.

  ### Part 3: Test Across Statements (Tracking Concessions)

  To avoid a run of concessions leading to unacceptable drift, we track:

  - For each member, the number of concessions by type in the past two years (or other period).
  - The pattern: if a member repeatedly makes the same type of concession (e.g., multiple Weight concessions), that might indicate a weakening of their position.

  **What to do with the record:**

  1. Before the meeting, for the current package, note any concessions being asked of each member and classify them.
  2. When a member is asked to make a concession, check the record for that member:
     - If the member has made the same type of concession more than twice (or a threshold you set) in the past two years, flag it.
     - Specifically, for Weight concessions (the most serious), even two might be too many.

  **When the same member has conceded more than once in the same way:**

  - During the evaluation (especially at Question 4), if a member is being asked for a concession of a type they have already used multiple times, they should be especially cautious. The question becomes: "Can you defend making this same kind of concession again to your constituency?"
  - If the record shows a pattern, the procedure requires that the member explicitly addresses the cumulative effect. They must explain why this concession is defensible despite the pattern.

  **What to check:**

  - When a member makes a concession, note the type and the statement it appears in.
  - Before each new statement, review the record for each member. Highlight any member who has made three or more concessions of any one type (or two or more for Weight concessions) in the past two years. This becomes a point of discussion in the meeting.

  ### Part 4: Handling Complications

  **Complication 1: The same sentence is a different act for different members.**

  The procedure already evaluates the package as a whole and asks about defensibility to the constituency (Question 4). The representative is expected to take into account the nature of the act (policy recommendation vs. institutional witness). The procedure does not need to adjust for this because it is built into the representative's judgment in answering the questions.

  **Complication 2: Strategic declaration of red lines.**

  The procedure does not ask members to state their red lines at the beginning. Instead, we use the ordered questions to force a holistic evaluation. The questions are designed so that gaming is less effective:

  - Question 1 and 3 are about the whole package and the alternative of no statement. A member who falsely claims the package doesn't advance their mission risks being caught in a lie when the funders ask why they are part of the coalition.
  - Question 2 asks about non-negotiable principles. We rely on the fact that non-negotiables are few and well-known. If a member invents a non-negotiable, it might be exposed when they have to defend it to their constituency (because the constituency might not see it as non-negotiable). However, we have no way to verify in the meeting. The procedure accepts the representative's word but notes that repeated use of new non-negotiables might be questioned by the coalition.

  ### Part 5: Application to Cases

  We assume the package has been drafted and is being evaluated in the 90-minute session.

  **Case 1: National Screening Programme**

  Package includes:
  - Automatic enrolment with opt-out (wanted by public health, resisted by patient choice)
  - Duty-to-advise clause (clinicians)
  - Accessible invitation formats (disability rights)
  - Cost-effectiveness threshold excluding one age band (health economics; opposed by public health)

  Run the questions:

  1. **Q1: Advance core mission?** 
     - Public health: Yes (but note the age band exclusion is a problem, but the package as a whole might still advance their mission).
     - Patient choice: Probably no, because of automatic enrolment? But if they get other benefits, maybe yes? Let's assume they say no because the automatic enrolment is a core issue for them. 
     - *Stop: Patient choice says no. Package fails.* 

  But let's assume we are at the stage where the patient choice representative might be willing to compromise. So we continue for illustration.

  2. **Q2: Contradict non-negotiable?**
     - Patient choice: Automatic enrolment contradicts individual autonomy (non-negotiable). So they say yes, it contradicts. 
     - *Stop: Package fails because of Q2.* 

  Alternatively, if the patient choice representative is willing to consider a Scope Concession (e.g., "in public health screening, individual autonomy is not absolute") then they might not trigger Q2. But if they do, we stop.

  In reality, this package might fail early. The only hope is if the patient choice organization can use an Ambiguity Concession (e.g., the language about "opt-out" is emphasized as a choice) or a Scope Concession.

  **Case 2: Assisted Dying**

  Package: We assume the draft tries to find middle ground, perhaps by not explicitly endorsing or opposing, but using language that both sides might interpret.

  - Faith-based network: Cannot sign anything implying permissibility.
  - Patient choice: Wants endorsement of access.

  If the draft avoids taking a clear stand (e.g., "we recognize the complexity of the issue and the need for careful safeguards"), then:

  1. **Q1: Advance core mission?** 
     - Faith-based: Only if the statement does not imply permissibility. They might say yes if the language is neutral enough to not contradict their teaching.
     - Patient choice: They might say no because they want an endorsement. But if the statement opens the door for future access, they might say yes.

  But let's see:

  2. **Q2: Contradict non-negotiable?**
     - Faith-based: If the statement implies permissibility (even indirectly), it would contradict. They must judge the draft. If the draft is truly neutral, they might say no. If there's any hint of permissibility, they say yes and stop.

  3. **Q3: Net gain?** 
     - Both might see a gain in having a statement that at least discusses the issue without opposing their view.

  4. **Q4: Defensible concessions?** 
     - Faith-based: They are conceding that the coalition is not taking a stand against assisted dying. This might be a Weight Concession (if they believe they should take a stand) or an Ambiguity Concession (if the language allows them to read it as not endorsing). They must decide if it's defensible.
     - Patient choice: They are conceding that the statement doesn't endorse access. This might be a Weight Concession or Ambiguity Concession.

  If both can defend the concessions, then we proceed.

  5. **Q5: Ambiguity sufficient?** 
     - Faith-based: They need the language to be ambiguous enough that they can read it as not endorsing. If the draft achieves that, they say yes.
     - Patient choice: They need ambiguity that allows them to see a path to access. If the draft achieves that, they say yes.

  This package might pass if the language is crafted with sufficient ambiguity (Ambiguity Concessions by both).

  **Case 3: Automated Eligibility Decisions in Welfare**

  Concession asked of patient choice: small and defensible alone, but fourth of the same kind (let's assume it's a Weight Concession, which is serious) in two years.

  Run the questions:

  1. **Q1, Q2, Q3**: Patient choice might answer yes to all, because the concession is small and the package might be good overall.

  2. **Q4: Defensible concessions?** 
     - Here, we check the record. We see that this is the fourth Weight Concession by patient choice in two years. 
     - We ask: "Given that you have already made three Weight Concessions in the past two years, can you defend making a fourth of the same type to your constituency?"
     - If the patient choice representative says no, then the package fails at Q4.

  Even if they say yes, we note that this might be a breaking point. The procedure reveals that the cumulative effect of repeated Weight Concessions is a risk to the coalition's stability. The representative might be overstepping their mandate.

  **What the procedure tells you that you don't want to hear:** That the patient choice organization is at risk of losing credibility with its constituency because of repeated concessions on the same principle. The procedure flags that this concession, though small, might be the one that breaks the camel's back.

  **What to do with it:** You should warn the patient choice representative that this is a pattern and that they should consult their constituency. But the procedure does not force them to say no. It only forces them to confront the issue. If they sign, they do so at their own risk.

  ### Part 6: What the Procedure Cannot Do

  1. **It cannot prevent strategic behavior.** If a member lies about their non-negotiables or their ability to defend a concession, the procedure cannot detect it.
  2. **It cannot create trust or shared values.** The procedure is a tool for managing existing differences, not for building deeper alignment.
  3. **It cannot force a member to be reasonable.** If a member is intransigent, the package fails.
  4. **It cannot address power imbalances.** Some members might be more willing to walk away, and the procedure does not account for that.
  5. **It cannot solve the problem of value drift entirely.** The tracking of concessions is a safeguard, but it relies on the member's self-awareness and honesty about their constituency's tolerance.
  6. **It cannot verify the internal dynamics of a member organization.** We take the representative's word for what is defensible.

  ### Summary of the Procedure

  - **In the meeting:** Run the five questions in order for the package as a whole. If any member triggers a stop condition, the package fails. If it passes, it can be signed.
  - **Concession tracking:** Maintain a record of concessions by type and member. Flag patterns and require explicit justification when a pattern exists.
  - **For the cases:** 
    - Case 1 likely fails early (patient choice or public health).
    - Case 2 might pass with ambiguity.
    - Case 3 reveals the cumulative risk for patient choice.

  This procedure is designed to be practical and fit within your constraints.
answer: |-
  Below is a comprehensive, step-by-step procedure designed for your constraints: a 90-minute session with six representatives, a two-week written round, non-specialist participants, and no neutral chair. The procedure focuses on the **entire draft text as a package** (not clause-by-clause) and includes:  
  1. An ordered set of questions with clear stopping rules.  
  2. A refined classification of concessions.  
  3. A cross-statement test for tracking concessions.  
  4. Application to your three cases, including limitations.  

  The procedure prioritizes efficiency (each question takes 2–5 minutes to answer) and mitigates gaming by avoiding direct inquiries about red lines. Representatives answer based on their organization's perspective, and you (as rapporteur) enforce the structure.

  ---

  ### **1. Ordered Set of Questions for Evaluating a Proposed Package**  
  Run these questions in sequence during the 90-minute session. If the package passes all questions, it proceeds to the written round for formal sign-off. If any question triggers a "stop," the package is rejected or revised.  

  | Question | What Counts as a Sufficient Answer? | Stop Condition | Escalation to Values? | Rationale |
  |----------|-------------------------------------|----------------|------------------------|-----------|
  | **Q1: Does this package, as a whole, align with your organization's minimally acceptable version of a "win"?** <br><br>*(Frame as: "Would your constituency see this as better than silence?")* | A simple "yes" or "no" with a 1-sentence reason. No justifications or debates. | **STOP** if any member says "no." Package fails. | No. This is a factual assessment of the package vs. no statement (mirroring the "gains from trade" logic). | Tests if the package meets a threshold of benefit for each member. Avoids philosophical debates by focusing on practical acceptability. |
  | **Q2: Is there any specific language in the package that forces your organization to violate a core principle in a way you could not explain defensibly to your constituency?** <br><br>*(Specify: "Core principles" are publicly stated values from your org's charter/mission.)* | Identification of the exact phrase/principle conflict. If none, answer "no." | **STOP** if any member identifies such language. Package fails unless the language is removable without renegotiating the package. | No. This relies on facts (org's public principles) and avoids hypotheticals. Representatives must cite their org's documented positions. | Prevents members from signing texts that betray non-negotiable values. Uses public documents to deter gaming. |
  | **Q3: Can all concessions required from your organization in this package be justified as either (a) limited to this specific context, or (b) balanced by gains elsewhere in the text?** <br><br>*(Provide your concession classification—see Section 2—as a reference.)* | "Yes" if concessions fit types A, B, C, or D (defined below); "no" if they create irreversible precedent or harm. | **STOP** if any member says "no." Package fails. | **YES.** If a member says "no," the decision shifts to their internal leadership (not the coalition). They must consult their org within 24hrs. | Isolates indefensible concessions. Forces accountability back to the member org if values conflict (not the coalition's job to resolve). |
  | **Q4: Does this package, as written, allow your organization to credibly interpret ambiguous language in a way that aligns with your values?** <br><br>*(Clarify: This is about ambiguity, not clarity.)* | "Yes" if ambiguous terms exist where needed; "no" if language is bindingly clear against their values. | **STOP** if any member says "no" and ambiguity is non-negotiable for them. | No. Focuses on factual analysis of text (e.g., "Does the word 'access' allow both 'permissibility' and 'prohibition' readings?"). | Ensures textual "escape hatches" exist for members with irreconcilable values. |
  | **Q5: If this package is published, will your organization face disproportionate reputational damage compared to others?** <br><br>*(Note: "Disproportionate" means your org bears unique risks.)* | "Yes" or "no" with a brief example (e.g., "We alone would be criticized for endorsing X"). | **STOP** if any member says "yes" and cannot mitigate the risk via amendments. | **YES.** If risks are values-based (e.g., "Our faith forbids this"), escalate to their leadership. If factual (e.g., "This misquotes our research"), amend. | Addresses your complication: Identical words have different costs. Deters exploitative concessions. |

  **Procedure Rules:**  
  - **Time limit:** Each question gets 5 minutes max per member. Use a timer.  
  - **Written round:** If the package passes Q1–Q5, circulate it for signatures. Any member can veto with a written "no" and a reason (citing Q1–Q5). A veto triggers a revised draft or abandonment.  
  - **Chair’s role:** The rotating chair facilitates but does not arbitrate. Their only power is to enforce time limits and question sequence.  

  ---

  ### **2. Classification of Concessions**  
  Your initial distinction is sound but needs refinement for tracking. Use these four types (based on your framework):  

  | Type | Name | What It Means | Defensibility Risk | Key Distinction |
  |------|-------|---------------|---------------------|----------------|
  | **A** | **Scope Concession** | "My principle does not apply to this specific case." <br> *(e.g., "Individual autonomy doesn’t override epidemic control.")* | Low risk. Defensible as contextual. | Retains principle’s integrity but limits its reach. |
  | **B** | **Weight Concession** | "My principle applies but carries less weight here than I claimed." <br> *(e.g., "Cost-effectiveness matters but not more than equity here.")* | High risk. Sets precedent for future erosion. | Weakens the principle’s standing. Track rigorously. |
  | **C** | **Delegation Concession** | "I defer this decision to a specified authority." <br> *(e.g., "Let clinicians judge 'medical necessity.'")* | Medium risk. Defensible if authority is neutral. | Outsources values; requires trust in the delegate. |
  | **D** | **Ambiguity Concession** | "Language is vague enough for my interpretation." <br> *(e.g., "The term 'fair' lets us define it as 'equal access.'")* | Lowest risk. Defensible as linguistic flexibility. | Preserves all principles but risks coalition incoherence. |

  **Refinements:**  
  - **Drop** "conceding that someone else should decide" unless it specifies the delegate (now covered under Type C).  
  - **Retain** your other three distinctions—they are essential for tracking defensibility.  
  - **Why this matters:** In Q3, Type B (Weight) concessions require extra scrutiny, while Type D (Ambiguity) can be fast-tracked.  

  ---

  ### **3. Cross-Statement Test for Concession Tracking**  
  **What to do with your record:**  
  - **Maintain a ledger** tracking:  
    - Member name, statement date, concession type (A/B/C/D), issue (e.g., "opt-out clauses").  
    - Focus on **Type B (Weight)** and **Type A (Scope)** concessions—they signal erosion.  
  - **Before each session:** For every member, calculate:  
    - Total Type B concessions in the past 2 years.  
    - Concessions of the same type (A/B/C/D) on similar issues (e.g., "opt-outs").  
  - **During Q3:** When a member evaluates concessions, ask:  
    > *"Given your past concessions [cite number and type], is this new one defensible as not setting a harmful precedent?"*  

  **What to check when a member concedes repeatedly:**  
  - **Threshold:** If a member makes >2 Type B (Weight) concessions in 2 years, or >3 of any type on similar issues:  
    1. **Pause the process.** Flag it in Q3 and require the member to:  
       - Justify why this concession won’t compound past ones.  
       - Escalate to their leadership for approval (using your ledger as evidence).  
    2. **If they proceed:** Note in the record that repeated concessions may undermine coalition credibility. Share this summary with funders if withdrawals occur.  
  - **Why:** This catches "death by a thousand cuts." A run of small concessions (e.g., patient-choice giving ground on "default options") can normalize principle violations, making the coalition a liability.  

  ---

  ### **4. Application to Your Three Cases**  
  **Case 1: National Screening Programme**  
  - **Issue:** Clashes on opt-outs (public-health vs. patient-choice), cost-effectiveness (health-economics vs. public-health).  
  - **Procedure outcome:**  
    - **Stops at Q3** for patient-choice if they classify the opt-out as a Type B (Weight) concession. Reason: "Conceding to automatic enrolment erodes autonomy—and we’ve made 2 similar concessions already."  
    - **If patient-choice calls it Type A (Scope):** Package may pass if public-health accepts the cost-effectiveness threshold as Type B (Weight) concession ("equity outweighs cost here").  
  - **Why:** Patient-choice’s Q3 "no" triggers escalation to their leadership. Time/resource constraints mean the statement likely fails.  

  **Case 2: Assisted Dying**  
  - **Issue:** Faith-based network cannot endorse permissibility; patient-choice demands access.  
  - **Procedure outcome:**  
    - **Passes Q4** if text uses ambiguity (Type D concession). E.g., "End-of-life choices require safeguards" lets faith-based read "safeguards" as prohibition and patient-choice as access.  
    - **Fails at Q2** if text implies permissibility (e.g., "right to choose death"), as faith-based cites core principle violation.  
  - **Why:** Ambiguity (Type D) is the only path. If Q2 or Q3 fails, package dies.  

  **Case 3: Automated Eligibility Decisions**  
  - **Issue:** Patient-choice asked for a small concession (e.g., supporting automated defaults), their fourth similar concession.  
  - **Procedure outcome:**  
    - **Stops at Q3.** Your ledger shows three past Type B (Weight) concessions from patient-choice (e.g., on opt-outs, data sharing).  
    - **What you don’t want to hear:** "This concession alone is defensible, but combined with past ones, it risks your credibility. Escalate to your leadership or veto."  
  - **What to do:**  
    1. **Halt the package.** Tell patient-choice: "You must defend the cumulative pattern, not just this instance. Consult your constituency within 24 hours."  
    2. **If they proceed:** Note in the record: "Coalition pressure may be distorting member principles." Warn funders if signed.  
    3. **If regulator deadline looms:** Abandon the statement. Forcing it risks withdrawal and funder fallout.  

  ---

  ### **5. What the Procedure Cannot Do**  
  The procedure solves tactical issues but leaves systemic problems unchanged:  
  1. **Gaming red lines:** Members can still exaggerate principles in Q2, but the focus on *publicly documented* values (e.g., charters) limits this. You still rely on their honesty.  
  2. **Disproportionate costs:** Q5 identifies risks, but if a member downplays their costs (e.g., faith-based treating a text as "witness" not policy), the procedure cannot verify or rebalance it.  
  3. **Coalition drift:** The ledger flags erosion, but preventing it requires members' internal discipline—not your control.  
  4. **Tight deadlines:** In Case 3, the procedure may force abandonment (as shown). It cannot accelerate member decisions without risking integrity.  
  5. **Neutrality deficit:** Without a chair, members may dominate discussion. Mitigation: Strict time limits and your role as rapporteur to enforce questions.  

  ---

  ### **Summary**  
  - **Use the questions in order:** Q1 → Q5 to screen packages holistically.  
  - **Classify concessions as A/B/C/D:** Weight (B) and repeated concessions trigger escalation.  
