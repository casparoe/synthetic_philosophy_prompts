  The lab’s observation room felt sterile under the harsh LEDs. Dr. Aris Thorne, the fork machine’s architect, leaned against a console, arms crossed, radiating weary confidence. Across from him, Elara Vance, the company’s newly appointed ethics auditor, paced like a caged hawk, her gaze fixed on the dormant machine visible through the glass.

  “It’s straightforward, Vance,” Thorne began, his voice tight with impatience. “The calibration’s public: 0.25 squared amplitude for ‘Villa’. The form says ‘25% chance’. It’s mathematically identical to the betting odds a rational agent would use *after* accepting they’ll branch. End of story.”

  Elara stopped pacing, turning sharply. “Mathematically identical *if* you bake the Born Rule into your definition of rationality from the start. That’s circular, Aris. You’re *assuming* what you’re trying to prove. Why should I care about squared amplitudes? Why not just count branches?”

  Thorne scoffed. “Because counting branches is naive and breaks the moment amplitudes aren’t equal. Take the trivial case: three perfectly equal branches. 1/3 each. Counting branches gives you 1/3. Born Rule gives you 1/3. Fine, your intuition feels cozy. But that’s luck. Now look at *this* calibration.” He gestured at a screen displaying the complex wavefunction: one branch at 0.5 amplitude (Villa), and two branches orthogonal to each other *and* the villa, each at approximately 0.612 amplitude – giving the required 0.75 total for ‘Home’ (since 0.612^2 ≈ 0.375 each, 0.375 + 0.375 = 0.75). “Two home branches, one villa branch. By your branch-counting logic, the volunteer has a 1-in-3 *chance* of the villa? A 33.3% probability? That’s absurd!”

  “Why absurd?” Elara shot back, stepping closer. “Three distinct futures, three distinct experiences. The volunteer wakes up in *one* of them. What does ‘chance’ even *mean* here beyond ‘which branch will I find myself in?’ Counting seems perfectly valid.”

  “Because it ignores the underlying physics!” Thorne snapped. “The wavefunction isn’t democratic! Those home branches have *higher* amplitude. If you model a rational agent facing branching – someone who accepts all outcomes exist but must decide *now* how to value future branches, how to bet resources – the *only* set of weights that avoids Dutch books and satisfies basic additivity constraints are the *squared amplitudes*. You want your preferences over uncertain future branches to be consistent? Born Rule isn’t a choice, Vance, it’s a logical consequence. 0.25 isn’t a guess; it’s the *only* coherent number for that agent to use for planning and betting. Hence, 25% chance."

  “No!” Elara’s voice cut through the room. “You’re conflating *caring* with *chance*. The 0.25 is a *measure*, Aris. A measure of reality, a measure of how ‘much’ of that future branch there is relative to the whole wavefunction. It tells the agent how much *weight* to assign that branch in their calculations – their ‘caring measure’, if you will. But it is *not* a probability *that the event will happen to them* because *every* branch happens! Probability implies uncertainty about a *single* outcome. Here, *all* outcomes are certain. The form says ‘chance you *will* wake up in the villa’. But there’s no ‘chance’ about it! In *one* branch, they definitely do. In *two* others, they definitely don’t. The word ‘chance’ smuggles in single-outcome uncertainty that simply doesn’t exist in an Everettian reality. It’s misleading. It makes the volunteer think one specific, desirable future is *uncertain* in the classical sense, like a coin flip, when instead, all futures are real, and the number is just telling them how *significant* that particular real future is within the grand ensemble of realities.”

  “Significant for *what*?” Thorne countered, his voice rising. “For *them*! For the version making the decision! That measure dictates the statistics they’ll *observe* if they could repeat the branching. If you had a thousand volunteers fork under identical conditions, roughly 250 would find themselves in the villa! How is that not a probability?”

  “Because *this* volunteer isn’t being asked about a thousand trials!” Elara jabbed a finger towards the machine. “They’re being asked about *one* forking event they will personally experience. And for *that* person, pre-fork, *all* outcomes are guaranteed. The ‘25% chance’ phrasing exploits the intuitive, classical meaning of probability – the gamble, the risk of missing out – that evaporates when you accept all branches are equally real. It makes the villa sound like a *possibility* they might *not* get, when in fact, a version of them *always* gets it. The form should say: ‘You will definitely experience waking up in your bed. A version of you with measure 0.25 will also experience waking up in the villa.’ *That’s* honest. ‘Chance’ is a lie by omission, trading on confusion.”

  Thorne stared at her, a muscle ticking in his jaw. “So you’d tell them to plan for the villa branch as if it has weight… what? Equal to the home branches? Ignore the amplitude? That’s incoherent!”

  “I’d tell them the truth: They *will* branch. They *will* experience home. A significant aspect of their future identity, weighted 0.25 in the universal wavefunction, will experience the villa. They should care proportionally. But ‘chance’? No. It’s a measure of existence, not luck.”

  Silence hung heavy. Thorne looked back at the machine, then at the consent form displayed on another screen. His certainty seemed to flicker, just for a moment, replaced by a grimace of frustration.

  Verdict: The auditor (Elara) won on the core point; the consent form's use of "chance" is fundamentally misleading in an Everettian framework because it implies a single uncertain outcome, not a guaranteed branching where all outcomes occur, and the Born weight is a measure of significance, not classical probability. The designer's defense relies on decision theory constraints that already embed the Born Rule.
