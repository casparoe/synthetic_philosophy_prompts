prompt: |-
  I'm a neurointensivist at a tertiary hospital, and for the last three years I've chaired the committee that signs off on every determination of death by neurological criteria here and that writes the protocol for donation after the circulatory determination of death. Our protocol was not designed; it was accreted, one controversy at a time. We accept whole-brain death as death. We accept death after two to five minutes of arrested circulation, which is a period we all privately know was chosen because organs tolerate it, not because anything happens at minute two. We decline to treat patients in a permanent vegetative state as dead, even though a good many philosophers would say we are being inconsistent. And we have kept a brain-dead pregnant patient on ventilator and hormonal support for weeks, which under the account we officially endorse — death as the irreversible loss of the organism's capacity to function as an integrated whole — looks very much like our continuing to treat a corpse whose body is still doing the things we said a body stops doing at death. Two things have now forced the issue. First, our jurisdiction amended its determination-of-death statute so that a family's religious objection to neurological criteria must be accommodated whenever the patient can be physiologically maintained for a defined window, which means the same patient can be dead for one family and not for another. Second, a company is about to open a trial here of an extracorporeal somatic support platform that can, after total brain destruction has been confirmed by every test we have, maintain thermoregulation, hemodynamic stability, wound healing and — through a closed-loop hormonal controller — growth and even gestation, for many months.

  What I want from you is a decision procedure my committee can actually run, not an essay. Assume the people running it are a rotating panel of three — an intensivist, a neurologist, and a lay member — who have an hour and no training in philosophy. The procedure should begin by forcing us to say out loud which account of death we are applying, since I have come to think most of our arguments are really arguments about that, and it should then apply whichever account we named consistently, including to the cases where consistency is expensive. For each step, tell me what would count as a sufficient answer and what would count as no answer at all; tell me where the procedure stops with a firm no; tell me where it stops and hands the decision to a person because the remaining question is one of values rather than fact; and tell me where it must stop and report that the account we chose simply gives no determinate verdict here. It should issue one of a small fixed set of outputs — death may be declared, death may not be declared, death may be declared but donation may not proceed, or escalate — and it should be honest about which of its steps are judgment calls wearing the costume of procedure.

  Then run it on three real shapes of case that come to us. One: a patient declared dead by circulatory criteria, with the family's consent, where the surgical team wants to use thoracoabdominal normothermic regional perfusion with an aortic occlusion balloon to protect the abdominal organs, a maneuver whose entire point is to ensure the brain is not reperfused, and where the worry in the room is whether taking that precaution shows that we do not really believe the patient is dead. Two: a patient at nineteen weeks of gestation with confirmed whole-brain destruction, whose family wants support continued on the new somatic platform until the fetus is viable, and where the committee is divided between those who think we are maintaining a dead pregnant woman and those who think the platform has falsified the claim that the organism as a whole has ceased to function. Three: a patient with catastrophic bilateral hemispheric destruction but a preserved brainstem, sleep-wake cycles and spontaneous respiration, whose family has requested donation and asked us why this person is not dead when the person in the next bed is. I would like at least one of these three to come out somewhere I will not like, and I would like you to say plainly which one and why. Finally, tell me what the procedure cannot do — where it will misfire, which questions it should refuse to answer, and whether the thing I actually need is a procedure at all.
reasoning: |-
  We are designing a decision procedure for a committee that determines death and donation protocols. The procedure must be executable by a rotating panel of three (intensivist, neurologist, lay member) in about an hour with no philosophy training. The procedure will:
  1. Force the committee to explicitly state which account of death they are applying (e.g., whole-brain death, circulatory death, higher-brain death).
  2. Apply that account consistently, even when it leads to uncomfortable or expensive conclusions.
  3. Output one of:
     - Death may be declared.
     - Death may not be declared.
     - Death may be declared but donation may not proceed.
     - Escalate (to a higher authority, ethics committee, or court).

  Steps must specify:
  - What counts as a sufficient answer.
  - What counts as no answer at all (which might lead to escalation or a different output).
  - Where the procedure stops with a firm "no".
  - Where it stops and hands the decision to a person (for value judgments).
  - Where it stops because the chosen account gives no determinate verdict.

  We are to consider three real cases and run the procedure on each, with at least one coming out in a way the user might not like.

  The accounts of death we might consider (based on the user's context) are:
  A. Whole-brain death: death as the irreversible loss of all functions of the entire brain, including the brainstem.
  B. Circulatory death: death as the irreversible cessation of circulatory and respiratory functions.
  C. Higher-brain death: death as the irreversible loss of higher brain functions (consciousness, cognition) even if the brainstem is intact. (Note: The user's committee currently does not use this, but it is a known alternative.)
  D. The irreversible loss of the organism's capacity to function as an integrated whole (the official account the user mentioned, which is often equated with whole-brain death but might be challenged by new technology).

  However, note that the user's jurisdiction has a statute that requires accommodating religious objections to neurological criteria, so the procedure must account for that.

  We design the procedure as a flowchart-like series of steps.

  **The Decision Procedure**

  **Step 0: Precondition**
  - The patient must be in a condition that prompts a determination of death (e.g., severe brain injury, cardiac arrest, etc.). The committee is convened to decide on death determination and/or donation.

  **Step 1: Choose the Account of Death**
  - **Question:** "Which account of death are we applying for this patient? Options: (a) Whole-brain death (irreversible loss of all brain functions), (b) Circulatory death (irreversible cessation of circulation and respiration), (c) Higher-brain death (irreversible loss of higher brain functions, i.e., consciousness and cognition), (d) The irreversible loss of the organism's capacity to function as an integrated whole?"
  - **Sufficient answer:** The committee must select one of (a), (b), (c), or (d). They may note that (d) is their official account but might be interpreted in light of new technology. They must also consider any legal constraints (e.g., religious objections). If there is a religious objection to neurological criteria (as per the new statute) and the patient can be physiologically maintained, then the committee must use circulatory criteria (b) for that patient (if the family objects to neurological criteria). However, if the family does not object, the committee can choose (a) or (d) for neurological criteria. The choice must be made explicitly and recorded.
  - **No answer at all:** If the committee cannot agree on an account, or if they try to avoid choosing, the procedure stops and outputs "Escalate" because the foundational choice is not made.
  - **Handoff to values?** No. This step is foundational and must be chosen by the committee. If they cannot, it's an impasse requiring escalation.

  **Step 2: Apply the Chosen Account to the Patient's Condition**
  - **Question:** "Does the patient meet the criteria for death under the chosen account, based on the medical facts?"
  - **Sufficient answer:** The committee must review the medical data and determine if the criteria for the chosen account are met. For example:
    - If (a) whole-brain death: are all brain functions (including brainstem) irreversibly lost? (This requires standard tests: clinical exam, apnea test, and/or confirmatory tests as per protocol.)
    - If (b) circulatory death: has there been an irreversible cessation of circulation and respiration? (Note: This may be after a waiting period, e.g., 2-5 minutes, but the irreversibility must be judged in the context of no attempt to restart circulation.)
    - If (c) higher-brain death: is there irreversible loss of higher brain functions? (This would require evidence of total and irreversible destruction of the cerebral hemispheres with no possibility of recovery, even if the brainstem is intact. Note: This is not currently accepted in most jurisdictions and may conflict with the statute and the user's current practice.)
    - If (d) loss of integrated organismal function: has the organism as a whole irreversibly lost the capacity to function in an integrated manner? (This is traditionally aligned with whole-brain death, but new technology might challenge that.)

    The committee must answer yes or no, based on evidence. They may note that the criteria are met or not met.
  - **No answer at all:** If the medical facts are insufficient to determine irreversibility (e.g., ambiguous test results) or if the chosen account does not clearly apply (e.g., in a borderline case), then the procedure stops and outputs "Escalate" or "Death may not be declared" (depending on the reason). Specifically, if the account does not provide a clear answer (e.g., because of new technology) then we proceed to Step 3.
  - **Firm stop?** If the answer is clearly "yes", then output "Death may be declared" and proceed to Step 4 (for donation considerations). If the answer is clearly "no", then output "Death may not be declared" and stop (donation is not an option). If the answer is unclear, proceed to Step 3.

  **Step 3: Indeterminacy of the Chosen Account**
  - **Question:** "Does the chosen account of death provide a determinate verdict in this patient's case, given the medical facts and available technology?"
  - **Sufficient answer:** The committee must consider whether the chosen account can be applied unambiguously. For example, if using account (d) (integrated function) and the patient is on the new somatic platform that maintains integrated functions (thermoregulation, wound healing, etc.), then does that mean the organism has not lost integrated function? Or if the patient is in a permanent vegetative state (with a functioning brainstem) and the account is (c) (higher-brain), then it would say death has occurred, but if the account is (a) or (d), it would not. The committee must decide if the account yields a clear answer.
    - If the account clearly applies (either yes or no) they should go back to Step 2 and answer accordingly (but they should have done that already). This step is for when Step 2 was indeterminate.
    - If the account does not yield a clear answer (e.g., because of technological capabilities that challenge the definition), then the procedure must stop and report that the account gives no determinate verdict. The output then becomes "Escalate" because the issue requires a reexamination of the account or a policy decision beyond the committee's scope.
  - **No answer at all:** If the committee cannot decide on the clarity of the account, this is an impasse and they must output "Escalate".
