  ### Decision Procedure for Historical Commemoration Committee  
  **Goal**: Evaluate petitions to remove/modify commemorations (building names, plaques, etc.) fairly, avoiding presentism traps.  
  **Input**: Petition identifying a person and specific challenged behavior(s).  
  **Output**: Recommendation to (a) retain, (b) remove/modify, or (c) hand off to trustees for values-based judgment.  

  #### Steps  
  1. **Define the Behavior**  
     - **Question**: What specific action(s) or belief(s) is being challenged?  
     - **Sufficient Answer**: Clear, discrete description (e.g., "employed children in mills," "published eugenics theories").  
     - **Type**: Fact (clarification).  
     - **Stop?** No.  
     - **Handoff?** No.  

  2. **Anachronism Check**  
     - **Question**: Could the objection have been articulated in terms the person could understand *in their own time*?  
     - **Sufficient Answer**:  
       - **No** (e.g., accusing a 1700s figure of "climate denial"): **Stop → Retain name**.  
       - **Yes** (e.g., "child labor exploitation" was discussable in 1840): Proceed.  
     - **Type**: Fact (RA researches period dictionaries, newspapers, pamphlets for contemporary critiques).  
     - **Stop?** Yes if "No."  
     - **Handoff?** No.  

  3. **Contemporary Criticism**  
     - **Question**: Did articulate critics in the person’s milieu object to this behavior *at the time*?  
     - **Sufficient Answer**:  
       - **Yes** (e.g., colleagues, newspapers, activists objected): Proceed.  
       - **No** (no evidence found in 6 hours): Proceed.  
       - **Inconclusive** (thin record): Treat as "No."  
     - **Type**: Fact (RA searches archives, speeches, publications from the era).  
     - **Stop?** No.  
     - **Handoff?** No.  

  4. **Response to Criticism**  
     - **Question**: If critics existed, did the person stop or make amends?  
     - **Sufficient Answer**:  
       - **Reformed** (e.g., ended practice, apologized): Note.  
       - **Persisted** (e.g., ignored/dismissed critics): Note.  
       - **Unknown/N/A** (no critics or no evidence): Note.  
     - **Type**: Fact (RA checks letters, business records, biographies).  
     - **Stop?** No.  
     - **Handoff?** No.  

  5. **Centrality to Commemoration**  
     - **Question**: Was the behavior central to *why* they were honored?  
     - **Sufficient Answer**:  
       - **Central** (e.g., a eugenicist honored for genetics work): Proceed.  
       - **Peripheral** (e.g., a donor’s business practices unrelated to philanthropy): Proceed.  
     - **Type**: Judgment (RA checks naming ceremony documents, donor agreements, press from naming era).  
     - **Stop?** No.  
     - **Handoff?** No.  

  6. **Committee Assessment**  
     - **Question**: Based on Steps 1–5, does the case meet *any* criteria for a clear recommendation?  
     - **Sufficient Answer**:  
       - **Retain** if:  
         (a) No critics + Peripheral behavior, OR  
         (b) Critics existed + Reformed + Peripheral behavior.  
       - **Remove** if:  
         Critics existed + Persisted + Central behavior.  
       - **Handoff to trustees** for all other cases (e.g., critics + peripheral but persisted; no critics + central; thin/inconclusive evidence).  
     - **Type**: Judgment (applies facts from prior steps).  
     - **Stop?** Yes if "Retain" or "Remove."  
     - **Handoff?** Yes if criteria unmet.  

  #### Key Features  
  - **Hard Stops**: Only at Step 2 (anachronism) or Step 6 (clear retain/remove verdict).  
  - **Judgment Calls Dressed as Procedure**:  
    - Step 5 (Centrality): Requires interpreting "why" they were honored.  
    - Step 6 (Assessment): Weighs facts into buckets; may feel like splitting hairs.  
  - **What the Procedure Cannot Decide**:  
    - Whether commemoration causes *present-day harm* (trustees decide).  
    - Cases with ambiguous/thin evidence (trustees decide).  
  - **Predictable Misuses by Committee**:  
    - Overusing "no critics" (Step 3) to avoid hard choices.  
    - Stretching "peripheral" (Step 5) to sidestep removal.  
    - Ignoring Step 4 (response) if reformers make them uncomfortable.  

  ---

  ### Application to Cases  
  | Case | Step the Case Turns On | What the Record Would Need to Flip the Answer | Verdict or Hand-off | Who Signs Off |  
  |------|------------------------|-----------------------------------------------|----------------------|--------------|  
  | **(1) 1840s Textile Manufacturer** (Science building, 1922) | Step 6 (Assessment) | Evidence of 1840s critiques of child labor *in his town* (e.g., sermons, worker petitions). | **Retain** (No critics + Peripheral behavior). | Committee |  
  | **(2) 1910s Eugenics Professor** (Dormitory, 1958) | Step 5 (Centrality) | Proof he was honored *for eugenics* (e.g., naming speech cites his "race science"). | If Central → **Remove** (Critics + Persisted + Central). If Peripheral → **Handoff**. | Committee (if Remove) or Trustees (if Handoff) |  
  | **(3) 1990s Infant Formula Donor** (Atrium, 1990s) | Step 6 (Assessment) | N/A (Fits "critics + persisted + peripheral" → automatic handoff). | **Handoff to trustees** (Boycott existed, he dismissed it, but marketing wasn’t why he was honored). | Trustees |  

  **Unwelcome Truth**: Cases (1) and (3) are **structurally different** in the procedure:  
  - Case (1) clears all hurdles for retention (no critics, peripheral).  
  - Case (3) triggers handoff (critics + persisted + peripheral).  
  - Case (2) *could* align with (1) if eugenics was peripheral, but likely aligns with removal if central.  

