  ### Final Notes  
  - **Case 3’s Unwelcome Outcome**: Handoff is unavoidable per the procedure. Trustees must weigh present harm (e.g., "Does honoring a formula executive alienate students?"), factoring in gift agreements.  
  - **Why This Works**: Kills "no worse than peers" by focusing on *contemporary critics* (Step 3) and *personal response* (Step 4). Forces presentism concerns into values-based handoffs.  
  - **Your Temptation to Fudge**: Step 5 (Centrality). You’ll want to call everything "peripheral" to avoid blowback. Resist.  
  - **Trustee Handoff Template**: "The committee finds [fact summary]. Whether this warrants removal given *today’s* values is beyond our mandate."
