answer: |-
  ### Translations of Philosophical Accounts into Systems Vocabulary

  #### 1. Social Practice → Distributed Runtime Convention
  - **Translation**: Promising is a preexisting, distributed protocol where agents (processes) enforce a **runtime-invariant** via **monitors**. The invariant: "If a promise event occurs, then either fulfillment or waiver must follow." The convention is a **global invariant** hardened by evolutionary benefit (cooperation optimizes system throughput). Violation triggers a **checked exception** (social sanction) propagated through the monitor network.
  - **Cheating**: Smuggles "benefit" as a teleological assumption. Your world lacks inherent purpose—systems just enforce invariants. We reduce "benefit" to observed stability under fuzzing (stress-testing).

  #### 2. Reliance/Expectation → Dependency Precondition
  - **Translation**: A promise is a **public assertion** that sets a **precondition** for the promisee's state machine: "You may plan/act assuming X." This creates a **hard dependency**—promisor failure violates the promisee's **safety invariant** ("No wasted resources"), causing a **cascading fault** (planning collapse). The obligation is a **postcondition** on the promisor: "Must deliver X or compensate."
  - **Cheating**: "Harm" is reduced to computational waste (e.g., sunk cycles). Philosophy includes non-instrumental harm (e.g., frustration), which your logs don't capture.

  #### 3. Normative Power → Self-Issued Affine Capability
  - **Translation**: Promising is an **irreversible operation** that mint an **affine capability token** (1-use) bound to the promisor. The token enforces a **dynamic invariant**: "This token must be resolved via `fulfill()` or `transfer()`." The "power" is the ability to invoke this operation, altering your obligation graph. No upstream spec—it **self-issues a runtime check**.
  - **Cheating**: Normative powers imply meta-authority ("I can bind myself"). Your tokens derive from system rules; we pretend the promisor *is* the system.

  #### 4. Second-Personal → Promisee-Held Cancel Token
  - **Translation**: A promise allocates an **affine obligation resource** owned exclusively by the promisee, who holds a **cancel token**. Waiver = calling `cancel()` (deallocating the resource). Violation without waiver triggers a **second-personal fault**—a directed exception (`PromiseeViolation`) that only the promisee can catch/handle. The promisor's monitor enforces: "Obligation alive → must fulfill unless token canceled."
  - **Cheating**: The token models exclusivity but not the *moral authority* to blame. Your `cancel()` is a method, not a stance of holding accountable.

  ---

  ### Engineer Concepts in Philosophy
  - **Self-issuing check**: Yes, philosophers' "bootstrapping" mirrors your incoherence worry ("no spec → decorative assert"). Social practice (1) provides the external spec; without it, self-issuance is magic. Normative power (3) embraces the magic.
  - **Cancel token**: Captures *core* of second-personal (4): exclusive waiver, directed obligation, no third-party interference. But misses the promisee's authority to *demand* (not just cancel). Philosophy adds: owing *to* someone ≠ just giving them a handle.

  ---

  ### Residue Report
  **Translated Cleanly**  
  - Social practice → Distributed monitors + convention.  
  - Waiver → `cancel()`.  
  - Directed obligation → Promisee-owned resource.  

  **Translated with Distortion**  
  - **Reliance harm**: Your "cascading fault" ignores emotional harm (philosophy's "wronging"). Distortion: reduced to resource waste.  
  - **Normative power**: Your "self-issued token" ignores moral autonomy. Distortion: promisor as system, not self-authoring agent.  
  - **Second-personal**: Cancel token handles exclusivity but not blame. Distortion: moral authority → method call.  

  **No Expression in Your Vocabulary (Your Guesses Confirmed)**  
  - **Reactive attitudes (resentment/guilt)**: Monitors raise exceptions; they don't *feel* wronged. Error logs lack the emotional grammar of blame.  
  - **Performance vs. compensation**: Your world has `fulfill()` or `exception_handled` (compensation). No analogue for "moral residue"—e.g., guilt persists even after compensation.  
  - **Counterparty-free binding**: A promise with no monitor/dependency (undetectable, harmless violation). Your runtime elides unchecked assertions; philosophy insists they bind. Unsupported in your model.  

  ---

  ### Verdict  
  The residue—reactive attitudes, moral residue, counterparty-free binding—is a **hole in your vocabulary**, not philosophical mysticism. These reflect the *first-person experience* of obligation (guilt without witnesses) and *second-person authority* (blame beyond cancellation), which your agent-agnostic systems lack.  

  **One primitive to add**: A `sentient_monitor` type. It would:  
  - Hold a `moral_standing` token (affine) enabling reactive attitudes.  
  - Enforce undetectable promises via an internal `conscience_check` (always-on, even with no observers).  
  - Model moral residue with `guilt_state: PersistentEvenAfterCompensation`.  

  This bridges the gap: minimal moral psychology in type theory. Without it, you miss the why of "binding"—but your stack already handles the how.  

