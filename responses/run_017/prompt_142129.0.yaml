  You are a game theorist with a serious philosophy background who has spent years reading and writing in the rationalist blog-and-forum ecosystem. You know what people in that idiom mean by precommitment, credible threats, Moloch, and races to the bottom, and you don't need any of it explained. Please think carefully and work in stages: brainstorm three candidate scenarios privately, test each against the constraints below, pick the strongest one, and then give me the finished case. I would much rather have one scenario that survives checking than three that merely sound good in the telling.

  Here is what the case is for, since that determines what counts as cheating. I'm drafting a post arguing that discussions of commitment races treat credibility as a single scalar — roughly, how costly it is for the committer to back out — and that this is a mistake. My candidate second dimension is the gap between what I'll call the *reversal cost* of a commitment (what it costs the agent to undo the decision) and its *restorability cost* (what it costs anyone to rebuild what the decision destroyed, including the time lag). A commitment can be trivially cheap to reverse and still be decisive, because announcing "never mind" doesn't bring back the permit, the option, the window, or the relationship. If I'm right, then the usual lesson — that the race goes to whoever can bind themselves most deeply, and that moving first to bind is decisive — has an important exception. I need a worked case to hang the post on. Use my reversal/restorability lever if it's the cleanest route, but if you can see a better lever that meets every constraint, use that instead and say what it is.

  Definitions, so we're working from the same ones. A commitment race: two agents are in a conflict where each one's best outcome requires the other to back down; binding yourself changes the other side's best response; so both sides have an incentive to bind first and hardest, and the interaction tends toward outcomes both would have rejected ex ante. Call a commitment *deep* to the extent that reversing it is costly for the committer (money already spent, legal exposure, reputation on the line, third-party-enforced penalties) and *shallow* to the extent it is not.

  Now the specification. Build me a case in which the agent who commits **second**, with a commitment that is **strictly shallower** than the first mover's, nonetheless wins the race — and wins because of the structure of the case, not because someone blundered. Constraints:

  1. Realistic and contemporary: a business, labor, housing, academic, family, or local-politics setting. No science fiction, no violence or threats of violence, no illegality, no artificial intelligence, no exotic technology, no perfect information about mental states.
  2. Two agents, both sane, competent, and self-interested, roughly comparable in resources and stakes. The second mover must not win by being richer, more patient, or more willing to burn value for its own sake.
  3. The first mover's commitment is genuinely deep — costly to reverse, more credible than the second mover's by every standard metric (spent money, reputational exposure, enforceable penalty). The second mover's is genuinely shallow — cheaper to reverse, less enforced, less exposed. Both agents know both facts. No deception, no hidden depth, no surprise.
  4. The second mover still wins: the second mover gets its preferred outcome, and the first mover would have done better to concede at the outset than to have committed at all. The first mover's play is reasonable given what it believed when it committed; it loses on structure, not on error.
  5. It must be a real race: state each player's ordinal ranking over the four relevant outcomes and show that, absent the second mover's reply, each player wants to bind before the other.
  6. It must not be Chicken wearing a costume. Show what the underlying game is once both commitment moves are removed, and argue that it isn't Chicken and doesn't have Chicken's characteristic structure.

  After the scenario — one paragraph, under 200 words, no dialogue — give me the demonstration: the payoffs, the timing, why the deep commitment fails and the shallow one binds, which single feature is load-bearing, and what happens to the outcome if you remove that feature. Then give the strongest objection available to someone who thinks the race always goes to the deeper binder, and your reply to it. Finally, run an honest cheating audit: for each of the obvious ways of faking this result (stipulating irrationality, smuggling in hidden depth, letting the second mover win on resources rather than commitment structure, redefining "wins"), say whether your case avoids it and how.

  If you think the full specification is jointly unsatisfiable, say so plainly rather than quietly dropping a constraint, and propose the minimal weakening that would make it work.

  Format requirement: after the prose, give me a structured summary as a single JSON object with exactly these fields.

  - "scenario": string, the one-paragraph scenario compressed to at most 60 words
  - "players": array of two objects, each with "name", "role", and "preferred_outcome"
  - "timeline": array of objects with "step" (t0, t1, t2, t3) and "event"
  - "commitment_ledger": array of one object per commitment, with "player", "commitment", "reversal_cost" (low/medium/high), "restoration_cost" (low/medium/high), "restoration_lag", "standard_credibility" (low/medium/high), and "reach" (which of the opponent's options it disables)
  - "payoffs": object with keys "first_mover" and "second_mover", each an ordinal ranking of the four outcomes from best to worst
  - "race_check": string, why each side wants to bind first
  - "reversal_mechanism": string, at most 80 words on why the shallower commitment binds
  - "load_bearing_feature": object with "name", "definition", and "how_it_decides_the_case"
  - "ablation": array of objects with "removed_feature" and "resulting_outcome"
  - "not_chicken": string, the underlying game and why it isn't Chicken
  - "best_objection": object with "objection", "reply", and "strength" (integer 1-5)
  - "cheating_audit": array of objects with "cheat", "avoided" (boolean), and "how"
  - "confidence": object with "case_works" (integer 1-5) and "biggest_residual_worry" (string)

  Return valid JSON only in that final block — no comments, no trailing commas.
