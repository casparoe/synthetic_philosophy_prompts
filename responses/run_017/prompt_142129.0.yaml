  ### Scenario
  Two rival tech startups, Alpha and Beta, compete to secure an exclusive partnership with RetailCo by a quarterly deadline. Alpha moves first, signing a binding agreement that requires a non-refundable $1M integration deposit and imposes strict penalties for withdrawal, locking in its commitment. Beta responds by signing a non-binding letter of intent (LOI) with RetailCo, requiring only a $50k good-faith deposit and allowing cancellation with 48 hours' notice. RetailCo, prioritizing flexibility, voids Alpha's agreement due to a clause permitting termination if a "more adaptable" offer emerges before integration begins, and finalizes the partnership with Beta. Alpha forfeits its deposit, while Beta secures the deal and can exit cheaply if needed.

  ### Demonstration
  **Payoffs**:  
  - Alpha's ranking:  
    1. Only Alpha commits: wins partnership (best).  
    2. Neither commits: no gain/loss.  
    3. Only Beta commits: Beta wins.  
    4. Both commit: Alpha loses deposit and partnership (worst).  
  - Beta's ranking:  
    1. Only Beta commits: wins partnership (best).  
    2. Both commit: wins partnership at low cost.  
    3. Neither commits: no gain/loss.  
    4. Only Alpha commits: Alpha wins.  

  **Timing**:  
  - t0: Alpha signs binding agreement.  
  - t1: Beta signs LOI.  
  - t2: RetailCo voids Alpha’s deal per flexibility clause.  
  - t3: Beta secures partnership.  

  **Why shallow commitment wins**:  
  Alpha’s deep commitment triggers RetailCo’s flexibility clause, voiding its own agreement. Beta’s shallow LOI exploits this by being trivially reversible yet enabling RetailCo to reset negotiations. The restorability cost dominates: Alpha cannot instantly rebuild its voided contract position, while Beta’s LOI imposes minimal restoration lag.

  **Load-bearing feature**:  
  - **Contractual flexibility trigger**: A clause making the first commitment voidable if a more reversible alternative emerges. This allows the second mover’s shallow commitment to invalidate the first by activating the trigger, leveraging restoration costs over reversal costs.

  **Ablation**:  
  - Remove flexibility trigger → RetailCo honors Alpha’s first-committed agreement. Beta loses.

  **Not Chicken**:  
  The underlying game is an **asymmetric coordination game with an external arbiter (RetailCo)**. Chicken has symmetric payoffs where mutual commitment is worst for both; here, mutual commitment is worst only for Alpha. RetailCo’s preference for flexibility breaks symmetry, creating a hierarchy where shallow commitments exploit institutional rules.

  ### Best Objection and Reply  
  - **Objection**: "RetailCo’s flexibility clause makes Alpha’s commitment inherently non-credible, violating depth constraints."  
  - **Reply**: Alpha’s commitment is deeply credible by standard metrics (high reversal cost, penalties, sunk costs). The clause doesn’t reduce reversal cost; it elevates restorability costs by making the agreement fragile to external disruption (strength: 4/5).  

  ### Cheating Audit  
  - **Stipulating irrationality**: Avoided. Both act in self-interest; Alpha reasonably expected to win absent Beta’s move.  
  - **Hidden depth**: Avoided. Beta’s LOI is explicitly shallow; no concealed penalties.  
  - **Resource advantage**: Avoided. Startups have comparable resources; Beta wins via contractual structure.  
  - **Redefining ‘wins’**: Avoided. Beta achieves preferred outcome; Alpha loses due to commitment dynamics.  

