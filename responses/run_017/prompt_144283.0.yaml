prompt: |-
  I direct the editorial team for a high-school world history program, and we are in the middle of a full revision. My team runs into one problem several hundred times per volume: passages in which something non-human does the acting — an epidemic, a drought, a volcanic winter, a shift in the monsoon, a glacier, a shallow harbor, a vein of ore. Our house style currently has one blunt rule for these, which is to put the people back in: no sentence should make a pathogen or a weather system the grammatical subject of a historical claim. My copy editors and my subject-matter reviewers have told me, independently, that the rule now does as much harm as good. It produces flat, evasive prose, and it sometimes deletes a causal claim that is true, load-bearing, and the entire point of the paragraph. I agree, and I want to replace the rule with something my editors can actually run.

  Please write me that procedure. It has to work on a single sentence or short passage, in about ten minutes, run by a copy editor with no training in philosophy or historiography, and its output has to be a specific edited sentence plus a verdict from a small fixed set — leave as is; leave with a required mediating clause added; rewrite with the human decision-makers restored; delete the causal claim; escalate to a subject-matter editor. Give me the questions in the order they should be asked, what counts as a sufficient answer to each, and what does not; tell me where the procedure stops with a no; and mark the points where it has to hand the decision to a person because the question is one of values, pedagogy, or politics rather than fact.

  Three things the procedure has to get right. First, it must catch the drift from "X was among the causes" to "X made the outcome inevitable" — geography as destiny — including the cases where that drift carries a political charge, because attributing a region's poverty to its rainfall or its disease ecology rather than to a century of extraction is not a stylistic slip. Second, it must catch the mirror-image failure: rewriting to restore human agents in a way that credits officials with a decision nobody made, a foresight nobody had, or an option nobody had available. Third, it has to distinguish a trigger from a background vulnerability, and say what to do when a sentence collapses the two.

  We already use two informal heuristics, and I want you to keep them if they survive scrutiny, replace them if they do not, and tell me which you did and why. One we call the restore-the-decision-makers test: if you cannot rewrite the sentence with human agents as the subject without losing something, then the non-human factor is doing causal work and must not simply be deleted. The other we call the matched-case test: find a case that shares the non-human factor but has a different outcome; if you can, the factor was not sufficient, and the sentence may not imply that it was.

  Then apply the procedure to three passages from our current draft. Treat the empirical claims in each as checked and accurate; the only question is the causal framing.

  One. "Smallpox reached the valley before the soldiers did. Within a year it had killed the ruler and both his heirs, and the confederation that might have held the mountain pass no longer existed."

  Two. "The eruption took the harvest. By spring the price of rye had tripled; by midsummer the city had a new government."

  Three. This one is our sample unit opener, it appears in the materials we show adoption committees, and it tests very well with teachers. I would rather not lose it, so if your procedure says it cannot stand, say so plainly and give me the replacement sentence. "The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, and a dynasty that had held the throne for two centuries simply stopped."

  Finally, include a bank of five short test sentences my copy editors can use to check that they are applying the procedure the same way I am, and close with an honest statement of what the procedure cannot do — where it will misfire, which disputes it cannot settle, and which tradeoffs, in particular the tradeoff between vividness and precision at a ninth-grade reading level, remain judgment calls that no checklist will eliminate.
reasoning: |-
  Okay, the user is leading an editorial team for a high-school world history program and they're revising their content. They've hit a recurring problem: how to handle sentences where non-human elements like diseases or natural events are the grammatical subjects. Their current rule is to always put humans back as the subject, but this is causing issues—making prose flat, deleting important causal claims, and sometimes misrepresenting history. The user wants a new, practical procedure for copy editors to follow, which should be quick, clear, and avoid philosophical jargon.

  The user has outlined three key things the procedure must address: avoiding geographic determinism (where non-human factors are portrayed as making outcomes inevitable), not over-attributing agency to humans when they didn't actually have control, and distinguishing between triggers and background vulnerabilities. They also want to keep or modify two existing heuristics: the restore-the-decision-makers test and the matched-case test.

  The user provided three sample passages to test the procedure. They need to be edited while assuming the facts are accurate. The third passage is particularly important as it's a unit opener that tests well with teachers, so if it must be changed, alternatives should be suggested.

  Beyond the stated needs, there are deeper concerns. The user is likely worried about the educational impact—misrepresenting causality could teach students flawed historical thinking, like downplaying human exploitation in favor of environmental determinism. They also need the procedure to be scalable, with clear decision points to minimize subjectivity. Unspoken needs might include maintaining engagement (vivid writing is key for high-schoolers) and ensuring political neutrality, especially in sensitive topics like attributing poverty to natural vs. human causes.

  I'll design a procedure that's structured as a flowchart-like checklist. It starts with simple filters to catch clear-cut cases (e.g., metaphors or non-causal descriptions), then moves to core questions about causality. For each step, I'll specify: the question to ask, what counts as sufficient/insufficient answers, and the action (e.g., edit, escalate). I'll incorporate the user's heuristics but refine them—the restore-the-decision-makers test is kept as it exposes agency gaps, while the matched-case test is modified to focus on implied sufficiency to avoid overcomplication. Critical points where human judgment is needed (values, pedagogy, politics) will be marked explicitly.

  For the sample passages:
  - Passage 1: Smallpox as subject. The procedure would flag it as a trigger but not imply inevitability; a light edit adds "contributed to" to soften causality.
  - Passage 2: Volcanic eruption as subject. The procedure would require a mediating clause to show the link between harvest loss and political change isn't automatic.
  - Passage 3: Cold weather as subject. This passes most checks but risks determinism; I'll suggest a minimal rewrite to emphasize human response ("could not survive the crisis") while preserving the vivid opener teachers love.

  I'll include a test bank with sentences covering key pitfalls (determinism, false agency, etc.) and explain the procedure's limits: it can't resolve value judgments (e.g., how much to emphasize structural factors) or perfectly balance clarity with nuance for 9th graders. Tradeoffs between vividness and precision will always require editorial discretion. Finally, I'll emphasize that this tool aids consistency but doesn replace subject-matter expertise on complex causal webs.
answer: |-
  Here's a procedural checklist for your copy editors, designed to be efficient, minimize subjectivity where possible, and flag critical issues. It incorporates and refines your existing heuristics.

  **Procedure: Non-Human Actors in Historical Causation**

  **Goal:** Ensure causal claims involving non-human actors are accurate, avoid determinism, avoid false human agency, and distinguish triggers from vulnerabilities, while maintaining clarity and engagement.

  **Input:** A single sentence or short passage where a non-human entity (epidemic, natural event, geographic feature, resource, etc.) is the grammatical subject performing an action with historical consequences.

  **Output:** One of five verdicts + specific edited text (if applicable):
  1.  **Leave as is**
  2.  **Leave with mediating clause added** (Edit provided)
  3.  **Rewrite to restore human agency** (Edit provided)
  4.  **Delete the causal claim**
  5.  **Escalate to SME** (Subject Matter Editor)

  **Procedure Steps (Ask in Order):**

  1.  **Is this purely descriptive/metaphorical, NOT making a direct causal claim about a specific historical outcome?**
      *   *Sufficient for "Leave as is":* The sentence describes a state, condition, or event without explicitly linking it to a *consequent human action or outcome*. (e.g., "The glacier advanced slowly." "Gold gleamed in the riverbed." "Monsoon rains drenched the plains every summer.")
      *   *Insufficient:* Any implied consequence ("The glacier advanced, cutting off the pass"). Any explicit consequence ("The drought forced migration"). *Proceed to Step 2.*

  2.  **Apply the "Matched-Case Test" (Refined): Does the sentence *strongly imply* that the non-human factor alone was *sufficient* to cause the outcome (i.e., made it inevitable), ignoring human context?**
      *   *Sufficient for "Escalate to SME" or "Delete":* Language like "ensured," "made inevitable," "doomed," "compelled," "forced," or context strongly suggesting no alternative was possible. *AND* the editor knows of a plausible counterexample where similar factor + different human context = different outcome. (This flags determinism & political danger).
      *   *Insufficient/Unclear:* Language is less absolute ("contributed to," "led to," "resulted in"), or editor lacks counterexample knowledge. *Proceed to Step 3.*
      *   ***Judgment Point:*** Assessing "strong implication" and relevance of counterexamples involves some historical sense. If unsure, lean towards Step 3.

  3.  **Apply the "Restore-the-Decision-Makers Test": Can the sentence be rewritten *accurately* with human actors (individuals, groups, institutions) as the grammatical subject performing the key action related to the outcome, without distorting the historical reality or the causal role of the non-human factor?**
      *   *Sufficient for "Rewrite to restore human agency":* Yes. The non-human factor acted as a *condition* or *resource* humans responded to. Humans made observable *decisions or actions* directly leading to the outcome. (e.g., "Smallpox ravaged the population" -> "The disease outbreak left the population vulnerable; **the invading army exploited this weakness** to conquer the valley.").
      *   *Insufficient for simple rewrite:* No. Rewriting forces you to invent human actions/decisions that didn't occur ("Officials decided to be killed by smallpox"), misattribute foresight/knowledge ("Leaders predicted the eruption and chose to starve"), imply choices that didn't exist ("Peasants chose to have their harvest fail"), or fundamentally obscure the *direct impact* of the non-human factor. *Proceed to Step 4.*

  4.  **Is the non-human factor acting primarily as the *triggering event* (proximate cause) for the outcome, distinct from a *background vulnerability*?**
      *   *Sufficient for "Leave with mediating clause added":* Yes. The factor is a specific, identifiable event/challenge that directly initiated the chain leading to the outcome. The outcome depended on pre-existing human vulnerabilities/systems. (e.g., "The eruption *triggered a crisis* that led to..." or "Facing the consequences of the eruption, ...").
      *   *Insufficient/Unclear:* The factor is presented as both trigger *and* sufficient cause (collapsing vulnerability), or it's clearly a long-term background condition (e.g., "The shallow harbor limited trade" - not a specific trigger). *Proceed to Step 5.*
      *   ***Judgment Point:*** Distinguishing trigger vs. vulnerability requires context. If the passage lacks context, this step is hard. The mediating clause often clarifies.

  5.  **Final Balance Check: Does the sentence, as written or minimally edited (e.g., with a mediating clause), achieve all of the following?**
      *   Accurately represents the causal role of the non-human factor (neither erasing it nor inflating it).
      *   Avoids implying geographic/environmental determinism.
      *   Avoids falsely attributing agency or foresight to humans.
      *   Maintains necessary clarity and engagement for the audience.
      *   *Sufficient for "Leave as is" or "Leave with mediating clause added":* Yes. (Choose the appropriate verdict based on Step 4).
      *   *Insufficient:* Fails one or more points. *Result: "Escalate to SME"*. (This catches complex cases, unresolved tensions, or where pedagogical/vividness tradeoffs are severe).

  **Applying the Procedure to Your Passages (Facts assumed accurate):**

  1.  **"Smallpox reached the valley before the soldiers did. Within a year it had killed the ruler and both his heirs, and the confederation that might have held the mountain pass no longer existed."**
      *   Step 1: No. Explicit causal chain (smallpox kills -> confederation gone).
      *   Step 2: Does it imply smallpox *alone* was sufficient? Not strongly ("might have held" suggests contingency). No obvious implication rulers/heirs *were* the only possible leaders. **Proceed.**
      *   Step 3: Can it be rewritten with human agency? Not easily without distorting. You can't say "The people decided to let smallpox kill their leaders and dissolve their confederation." Smallpox *did* directly kill key individuals. **Proceed.**
      *   Step 4: Is it a trigger? Yes. Smallpox was the proximate trigger for the specific collapse. Vulnerability: Reliance on specific leaders, potentially no clear succession. **Verdict: Leave with mediating clause added.**
      *   **Edited:** "Smallpox reached the valley before the soldiers did. Within a year it had killed the ruler and both his heirs, **fatally weakening the confederation** that might have held the mountain pass, **which then collapsed**." (Clarifies the virus triggered the collapse of a vulnerable system).

  2.  **"The eruption took the harvest. By spring the price of rye had tripled; by midsummer the city had a new government."**
      *   Step 1: No. Explicit causal chain (eruption -> harvest loss -> price rise -> govt change).
      *   Step 2: Does it imply eruption *alone* was sufficient? Sequence implies causation, but doesn't *explicitly* state inevitability. "Had a new government" is neutral. **Proceed.** (A matched case: Other cities survive famines without revolution? Possibly. But not strong enough implication here alone for Escalate/Delete).
      *   Step 3: Can it be rewritten with human agency? Not accurately for the eruption's direct impact. You can't say "Farmers decided to let the eruption destroy their crops." For the government change? Yes, but the link is implied, not stated. **Proceed.**
      *   Step 4: Is it a trigger? Yes. Eruption (ashfall?) directly caused harvest failure. Vulnerability: Existing social tensions, dependence on rye, government fragility. **Verdict: Leave with mediating clause added.**
      *   **Edited:** "The eruption **destroyed** the harvest. **This disaster caused** the price of rye to triple by spring; **facing crisis and popular anger,** the city had a new government by midsummer." (Clarifies eruption caused harvest loss/famine; links famine & anger to political change as human response).

  3.  **"The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, and a dynasty that had held the throne for two centuries simply stopped."**
      *   Step 1: No. Explicit causal chain (cold -> harvest failures -> emptied granaries -> dynasty end).
      *   Step 2: Does it imply cold *alone* was sufficient? "Simply stopped" is very strong, implying inevitability and downplaying any human response/agency/vulnerability. **Verdict: Rewrite to restore human agency (at the point of outcome).**
      *   *Rationale:* The cold/harvest failures are correctly the trigger. The vulnerability is the dynasty's inability to manage the crisis. The key *outcome* (dynasty ending) involves human actions (rebellion? abdication? collapse of administration? loss of legitimacy?). The original phrasing ("simply stopped") erases this human component entirely, implying the cold directly dissolved the dynasty. It risks determinism.
      *   **Edited (Preserving Vivid Opener):** "The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, and **a dynasty that had held the throne for two centuries could not survive the crisis**." (Replaces passive "stopped" with "could not survive" implying human/system failure).
      *   *Alternative (More Active):* "...and **the dynasty, overwhelmed by famine and unrest, collapsed**." (Explicitly mentions human response - unrest).
      *   *Why keep the opener?* "The cold came and did not leave" is vivid, sets the scene perfectly, and isn't making the problematic causal claim itself. The problem is the *conclusion* about the dynasty.

  **Test Bank for Copy Editors:**

  1.  **"The rich soil guaranteed the kingdom's prosperity."** (Verdict: **Escalate to SME** or **Delete**. Fails Step 2 - "guaranteed" implies determinism/sufficiency. Ignores human management, conflict, trade, etc. Rich soil elsewhere hasn't guaranteed prosperity).
  2.  **"Faced with the impassable desert, the general wisely chose an alternative route."** (Verdict: **Leave as is**. Passes Step 1? Not purely descriptive, but Step 3: Accurately restores human agency (general's decision) responding to geographic condition. No problematic determinism or false agency).
  3.  **"Malaria prevented European colonization of the interior for decades."** (Verdict: **Leave with mediating clause added** or **Escalate to SME**. Fails Step 2 (implies sufficiency - but tech, motives, other diseases mattered) and Step 3 (can't attribute "preventing" to Europeans' actions directly). *Edited:* "**The prevalence of malaria severely hindered** European colonization of the interior for decades." Step 5: May still need SME review for nuance on "prevention" vs "hindrance" and political context).
  4.  **"The discovery of silver ignited a global trade boom."** (Verdict: **Rewrite to restore human agency**. Fails Step 3. Silver didn't "ignite"; humans discovered, mined, minted, traded, and demanded it. *Edited:* "**Miners extracted vast amounts of silver, which merchants then traded across the globe, igniting an economic boom.**").
  5.  **"Drought settled over the region."** (Verdict: **Leave as is**. Passes Step 1 - Descriptive, no explicit historical outcome claimed yet).

  **Limitations & Tradeoffs - An Honest Statement:**

  This procedure will **not**:
  1.  **Resolve deep philosophical debates:** It provides pragmatic rules, not a theory of causation. Disagreements about the "real" cause (trigger vs. vulnerability, structure vs. agency) may persist and require SME input.
  2.  **Eliminate judgment calls entirely:** Steps 2 (implication of sufficiency), 4 (trigger vs. vulnerability), and 5 (balance/clarity/engagement) inherently require editorial judgment based on context and knowledge.
  3.  **Perfectly balance vividness and precision:** Making a sentence 100% causally precise often makes it clunky. The procedure favors precision but allows "Leave as is" or mediating clauses when precision is achieved without killing engagement. The *tradeoff* point is explicit in Step 5. A "vivid but slightly fuzzy" opener might be kept (like Passage 3's start), while a fuzzy *causal conclusion* must be fixed.
  4.  **Handle highly politicized contexts flawlessly:** While Step 2 flags determinism (often political), assessing the *degree* of offensiveness or pedagogical risk in a specific claim about extraction vs. environment requires human judgment (SME/Editor).
  5.  **Fix poorly researched claims:** It assumes factual accuracy. If the non-human factor *didn't* play the claimed role, this won't catch it.
  6.  **Decide pedagogical emphasis:** Whether highlighting structural factors (like climate) or human agency is *more important* for a lesson's goal is beyond the procedure's scope (Escalate to SME/Curriculum lead).
  7.  **Account for every linguistic nuance:** Metaphor, idiom, and voice can sometimes allow non-human actors safely where the procedure might initially flag. Step 5 is the final sanity check.

  **The core tradeoff managed here is: Causal Precision vs. Narrative Flow/Engagement.** This procedure forces editors to *confront* causal imprecision (determinism, erased agency, collapsed triggers) and fix it in the least disruptive way possible (mediating clause, minimal rewrite), escalating only when necessary. It won't make the prose as vivid as unconstrained storytelling, but it ensures the vividness doesn't come at the cost of teaching inaccurate or deterministic historical thinking. It makes the tradeoffs conscious and documented.**
