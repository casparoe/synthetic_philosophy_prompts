prompt: |-
  I am finishing a position paper on practical reasons for a proseminar, and I would like the set of commitments I have ended up with audited before I circulate it. Stated as neutrally as I can, I hold the following.

  1. Internalism about reasons, of the sort associated with Williams: an agent has a reason to act only if there is a sound deliberative route from that agent's subjective motivational set, as it actually is, to her acting. No route, no reason.

  2. Some claims about reasons that no such route supports are nevertheless straightforwardly true. Two cases I care about: a man who has lost every project he once had and now wants nothing still has a reason to get help; and a company director who is entirely unmoved by the fate of her workers has a reason not to shut the plant and destroy their livelihood. In neither case, as I see it, is there anything in the agent's motivational set from which the act could be reached by deliberation.

  3. The internalist is not entitled to repair 2 by idealizing the agent: if the route is allowed to run through what the agent would want if she were fully informed and perfectly rational, then the condition in 1 comes out vacuous and the view has simply become externalism under another name. I have been toying with a narrower device, what I call reasons of upkeep, meant to cover the first case, where the point of the act is to restore an agent's very capacity to be moved by reasons at all; I am genuinely unsure whether it is anything more than a label.

  4. Reasons themselves are facts about the world rather than mental states. When I say that the state of the bridge is a reason for you not to cross, the reason is the condition of the bridge, not your desire to get home.

  5. Motivational externalism about moral judgment: a person can judge in full sincerity that she has conclusive reason to act and feel no pull whatsoever, and where moral judgment does move people, that is explained by a contingent desire to do what is right. I also want to say that rationality itself requires responding to one's own judgment about what one has most reason to do, and that failing to do so is a rational failing.

  6. Blameworthiness requires reasons-responsiveness: an agent is blameworthy for what she has done only if she could have recognized and responded to a reason against it. I want to go on blaming the director in 2.

  7. Ends are themselves answerable to rational criticism, not merely the fit of means to ends. The director's projects can be criticized as such, and not just as incoherent or self-defeating.

  What I want is an audit rather than a survey of the literature: which of these genuinely pull against each other, which pairs only look as though they do, and for each real tension, what exactly has to give. Please rank the tensions by how much of the set they cost me, and for each, say what the cheapest repair would be and what that repair costs elsewhere in the set. I would rather be told that one commitment has to go than be offered three quiet revisions.
reasoning: |-
  Okay, the user is asking for an audit of their philosophical commitments regarding practical reasons. They've listed seven key positions and want to know where tensions exist, which are most costly, and potential repairs. 

  First, I need to understand their core conflict. The heart seems to be their strong Williams-style internalism (1) clashing with their intuition about objective reasons (2). They're absolutely right that the two repair paths they've considered - idealization (which collapses into externalism) and their "reasons of upkeep" concept (which feels like labeling) - don't solve it. 

  The blameworthiness point (6) is particularly tricky. They want to blame the unmoved director, but internalism + motivational externalism (5) suggests she literally couldn't respond to reasons. Their commitment to reasons being worldly facts (4) rather than mental states actually helps here - at least the reason exists independently, even if inaccessible. 

  For the rational requirement to follow one's own judgments (5), that might be their most promising repair route. If the director judges she should care about workers (even if she doesn't feel it), then internalism could bite via that judgment. But does she actually form that judgment? The case states she's "entirely unmoved," which may include not even judging she has reason. 

  The ends being criticizable (7) is interesting - it suggests a form of objective reasonableness they want, but again, internalism blocks this unless tied to coherence. Maybe they could argue certain ends undermine agency itself? But that circles back to their "upkeep" idea. 

  Ranking tensions: The 1 vs 2 conflict is fundamental and most costly - it threatens the whole framework. Then 1 vs 6 (blameworthiness requires responsiveness but internalism denies access). Then 1 vs 7 (if ends are criticizable, why can't that generate reasons?). 

  Cheapest repair might be rethinking "sound deliberative route" to include necessary conditions for agency (like getting help when motivationally dead). But that risks becoming a Trojan horse for externalism, which they explicitly reject. Alternatively, they could bite the bullet on blame - say we blame the director only if she had capacity but not access, which preserves reasons-responsiveness but makes blame contingent. 

  Tough spot. Their integrity in wanting real solutions rather than quiet revisions is admirable. I'll lay out the brutal tensions first, then explore if any patches hold water.
answer: |-
  Here's a clear-sighted audit of your commitments, ranking tensions by their cost to your overall set and identifying the cheapest repairs with their trade-offs:

  ### Core Tension (Rank #1: Threatens Foundations)
  **Conflict:** (1) Williams-style Internalism vs. (2) Objective Reasons without Motivational Grounds  
  - **Why it pulls:** (1) requires a *current, actual* motivational link for any reason to exist. (2) asserts reasons exist in cases where *no such link is possible* (the apathetic man, unmoved director). Your "reasons of upkeep" is an admission this gap needs bridging, but lacks internalist machinery.  
  - **Cost:** Highest. This jeopardizes coherence. If (2) holds, (1) is false for those cases. If (1) holds, (2) must be false or reinterpreted.  
  - **Cheapest Repair:** **Radically Reinterpret "Sound Deliberative Route" (SDR).** Argue SDR includes *recognition of constitutive needs of agency itself*. "Getting help" is derivable from the *need to maintain/restore agency* (a latent element of any S?). "Not destroying livelihoods" is derivable from recognizing *the conditions for stable, cooperative agency* essential to pursuing *any* projects long-term.  
  - **Trade-off:**  
      - **Costs:** Risks collapsing into disguised externalism/idealization ("*shouldn't* every agent care about maintaining agency/stability?"). Requires arguing these are *internal* to S, not external standards. Strains "as it actually is" (1). Weakens the anti-idealization stance (3).  
      - **Preserves:** (2), (4), (6), (7) become *potentially* compatible with a modified (1). Keeps blameworthiness (6) intact.

  ### Major Tension (Rank #2: Challenges Blameworthiness)
  **Conflict:** (1) Internalism + (5) Motivational Externalism vs. (6) Blameworthiness Requires Reasons-Responsiveness  
  - **Why it pulls:** (6) says the director is blameworthy *only if* she *could* have recognized/responded to a reason. But (1) says *there is no reason for her* (no SDR). (5) reinforces this: she feels no pull, and her judgment might be absent or inert. How *could* she have responded to a non-existent (for her) reason?  
  - **Cost:** High. (6) becomes inapplicable or unjust in precisely the cases (like the director) where you want it most.  
  - **Cheapest Repair:** **Anchor Reasons-Responsiveness in *Capacity*, Not *Access*.** Argue blameworthiness requires the *general rational capacity* to recognize/respond to reasons *if they applied to her*, not access to *this specific* reason. The director *could* recognize worker-welfare reasons *if* she had relevant desires/commitments (which she *could* have had, even if she doesn't).  
  - **Trade-off:**  
      - **Costs:** Strains (1). If she *could* have had the relevant S, does that mean she *now* has a reason via counterfactual S? (You reject this in 3). Requires a robust theory of capacities counterfactuals. Weakens the link between *actual* reasons and blame.  
      - **Preserves:** (6) survives for the director. Compatible with (5). Avoids externalism.

  ### Significant Tension (Rank #3: Questions Rational Criticism)
  **Conflict:** (1) Internalism vs. (7) Ends are Answerable to Rational Criticism  
  - **Why it pulls:** (1) makes reasons depend entirely on S. (7) implies ends can be unreasonable *independently* of S's coherence. What grounds this criticism if not external standards? Criticizing the director's *projects* "as such" seems to require reasons *not* sourced in her S.  
  - **Cost:** Moderate-High. (7) appears to demand a source of normativity beyond S, conflicting with (1)'s core.  
  - **Cheapest Repair:** **Ground Criticism in Implicit Commitments or Agency Requirements.** Argue criticizing ends is immanent: it exposes *incoherence within S* (e.g., valuing status requires valuing conditions for its recognition) or contradiction with *constitutive features of agency* (e.g., valuing future agency requires valuing its preconditions).  
  - **Trade-off:**  
      - **Costs:** Limits the scope of (7). "Brute" selfishness without incoherence might be uncriticizable rationally (only morally/pragmatically). Requires fleshing out "agency" robustly, risking idealization (3).  
      - **Preserves:** Retains a core of (7) compatible with (1). Aligns with the "upkeep" idea.

  ### Apparent Tension (Likely Resolvable)
  **Conflict:** (4) Reasons are Worldly Facts vs. (1) Internalism  
  - **Why it *looks* like it pulls:** If reasons are facts (the bridge's state), how can their status *as reasons* depend on the agent's S?  
  - **Resolution:** **The *Factivity* vs. The *Reason-Status*.** Your view is consistent: The *fact* (bridge condition) is the reason. But this fact *counts as a reason for Agent A* only *if* there's an SDR from A's S to acting on it. The worldly fact is the content; the internal condition determines its normative force *for that agent*.  
  - **Result:** No necessary conflict. (4) describes what reasons *are*, (1) describes the *condition* under which a fact *is a reason for a specific agent*. This is a standard internalist move.

  ### Summary & Recommendation
  1.  **Abandon the Purest Form of (1):** The cost of maintaining (1) unmodified is too high – it forces you to reject either the objective reasons you intuit (2, 6) or the possibility of rational criticism of ends (7). The "Sound Deliberative Route" *must* be stretched to include constitutive agency needs/maintenance to save (2) and (6).
  2.  **Refine Blameworthiness (6):** Adopt the "capacity-not-access" view to save blame for the director without abandoning internalism entirely.
  3.  **Temper (7):** Ground criticism of ends firmly in immanent features of S or constitutive agency to avoid collapsing into externalism.
  4.  **Clarify (4):** Emphasize the distinction between the *fact* that is the reason and the *internal condition* for that fact having normative force for an agent.

  **The Cheapest Path Forward:** Double down on **Agency-Constitution**. Argue that a "sound deliberative route" (1) *necessarily involves* reasoning from one's S *in light of the constitutive requirements for being a deliberating agent at all*. This lets you:
  *   Derive "reasons of upkeep" (get help) for the apathetic man (saves 2).
  *   Ground reasons related to sustaining basic agential capacities/interdependence (don't destroy livelihoods) potentially accessible via SDR focused on agency-sustaining conditions (addresses 2/director, supports 6/blame via capacity, supports 7/criticism).
  *   Maintain (4) - the reasons *are* facts (need for help, dependence of workers).
  *   Keep (5) distinct - the *judgment* about these agency-derived reasons might still lack motivational oomph.
  *   Resist full idealization (3) by tying it to *actual* agency structure, not hypothetical beliefs/desires.

  **Cost of this Path:** It significantly reinterprets Williams (1), moving towards a more Kantian/Korsgaardian "internalism" grounded in agency. It requires careful argument to avoid becoming covert externalism. It makes your view less "Williamsian" and more a distinct agency-based internalism. If preserving Williams' *actual* view is paramount, this cost is high. If your goal is a coherent position respecting your core intuitions, it's the cheapest salvage operation.
