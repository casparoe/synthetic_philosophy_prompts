  | "This is just methodological nitpicking. We all know it's shorthand—unpacking it is trivial, and your 'partition test' adds no value to actual research." | Economic/global historians | H | 4 | "I agree it's shorthand, but the danger isn't the shorthand—it's that we treat it as a *single* explanatory target. My partition test reveals when the contrast collapses under scrutiny (e.g., if we compare Lower Yangtze vs. Britain, growth patterns invert), forcing us to specify what’s actually being explained. Without this, we risk conflating distinct causal mechanisms." | Soft: Downplays that historians already contextualize implicitly; test may seem redundant if they see unpacking as obvious. |
  | "Your partition test proves too much—it would dissolve questions like 'Why the Roman Empire fell?' or 'Why the Allies won WWII?' into sub-unit chaos. Are those ill-posed too?" | Philosophers of history/science | M | 5 | "Not necessarily. The test flags when a contrast *depends* on arbitrary aggregation. For Rome, the West/East partition is stable—the West fell while the East endured. For Britain/China, repartitioning (e.g., regions) reverses growth patterns. The test forces specificity: instead of 'Why Rome fell?', ask 'Why the *Western* Empire fell *when it did*?'—which survives re-partitioning." | Soft: "Stable" partitions are debatable; historians might argue Rome/Allies contrasts *do* fracture under scrutiny. |
  | "How do you operationalize this? What are the *units* (states, regions?), *controls* (other Eurasian cases?), and how do we avoid selection bias when defining contrasts?" | Comparative political scientist | H | 5 | "For each unpacked question, fix: (1) outcome (e.g., 'coal adoption'), (2) unit (e.g., 'energy-rich regions'), (3) contrast class (e.g., 'Jiangnan vs. Britain 1700–1800'). Use Mill’s methods—compare similar regions with divergent outcomes (e.g., Shandong vs. Newcastle coal basins) and control for global factors like trade networks." | Soft: Over-simplifies practical hurdles (data scarcity, defining "similarity"); doesn’t fully address Galton’s problem (interdependence). |
  | "Bundling growth, industrialization, and science is necessary—they’re interdependent. Unpacking ignores systemic explanations like global trade or institutional feedback loops." | Global historians (China specialists) | M | 4 | "I agree they interact, but bundling assumes one cause explains all three. For example, Qing China had scientific advances without industrial takeoff. By separating them, we *clarify* systemic links: did global trade cause growth first, then industrialization? We can model interactions better with cleanly defined variables." | Soft: Risks artificial separation; historians may argue the bundle *is* the phenomenon (e.g., 'modernity'). |
  | "This is a classic case of selection on the dependent variable. You start with the divergence and retrofit causes—ignoring cases where similar conditions didn’t produce divergence." | Political scientist / method-savvy historians | M | 4 | "Exactly! That’s why the partition test helps. By requiring contrasts to survive repartitioning, we avoid cherry-picking units. My repair manual expands the contrast class—e.g., for 'sustained growth,' include the Dutch Republic or Mughal India—to identify necessary/sufficient conditions without outcome bias." | Soft: Expanding cases is ideal but often impractical for historians; test doesn’t solve data limitations. |
  | "Galton’s problem applies here—Britain and China weren’t independent. Repartitioning ignores global entanglement (e.g., silver flows, knowledge transfer)." | Global historians | M | 3 | "Global interdependence strengthens my case. If partitions (like regions) show reverse outcomes under shared global forces, the nation-state unit is flawed. We should reframe: 'Why did Britain leverage global systems for industrialization while China didn’t?'—this explicitly integrates entanglement." | Soft: Reframing still risks Eurocentrism; doesn’t fully resolve how to isolate 'entanglement' in comparisons. |
  | "The question is a research program, not a proposition. Your critique stifles big-picture work—philosophers shouldn’t police historians’ heuristics." | Historians (supervisor-led) | H | 3 | "I’m not policing—I’m suggesting refinement. Programmatic questions *need* clear sub-questions to avoid talking past each other (e.g., Pomeranz vs. California School debates). My framework lets us keep the big picture while clarifying which 'layer' we’re testing: growth, tech, or science." | Soft: May feel patronizing; underestimates historians’ ability to hold complexity without formalizing. |
  | "Your test assumes outcomes are partition-invariant, but history is contingent. Why demand stability when context determines what’s relevant?" | Philosophers of science | L | 4 | "Contingency doesn’t excuse arbitrary units. The test ensures we don’t build explanations on accidental aggregations (e.g., 'China' averaged over rich/regions). We can accommodate contingency by specifying spatiotemporal bounds (e.g., 'Why no British-style factories in Jiangnan 1790–1820?')." | Soft: Historians might reject 'accidental' as subjective—contextual units are often defensible. |
