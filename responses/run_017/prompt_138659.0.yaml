  | "Britain and China weren't isolated; they were part of a global system. Doesn't Galton's problem (interdependence) undermine treating them as independent units?" | Global historians | M | 3 | "Yes, and that's why the partition test is useful: it forces us to consider units that account for interdependence. We might reframe at the regional level (e.g., North Sea vs. Yangtze) or use network approaches. The test highlights that the nation-state unit may be inappropriate for some sub-questions." | Repartitioning into regions doesn't fully solve global interdependencies, and the test doesn't directly address this. |
  | "The partition test seems arbitrary. Why should a contrast survive repartitioning? What's the theoretical basis for this criterion?" | Philosophers of science | M | 5 | "The test is grounded in the idea that a well-posed contrast should identify a stable causal difference. If repartitioning reverses the contrast (e.g., some Chinese regions had growth but Britain as a whole did), it suggests the original contrast doesn't capture a robust causal pattern. The test is a heuristic to avoid arbitrary aggregations." | Without a formal theory of partitions, it may seem subjective. It draws on causal inference literature but is not a standard criterion. |
