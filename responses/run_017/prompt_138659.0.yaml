prompt: |-
  Hi — I'm a PhD student in philosophy (I work mostly on explanation and counterfactuals in the historical sciences) and in three weeks I'm giving a 25+15 paper at a one-day workshop on big questions in global history. The room will be roughly fifteen economic historians and global historians — several of whom work on China and think the why Britain and not China? question is perfectly respectable, just under-specified — plus three philosophers of history and philosophy of science who are sympathetic to me temperamentally but will want the argument to be much sharper than it is, and one comparative-historical political scientist who will want to know what my view implies for how you'd actually design a comparison (cases, controls, units, all of that). My supervisor, who is a historian, is chairing and will ask the first question, and I know from a grad conference last year that she thinks the whole thing is a philosopher telling historians their question is confused.

  My paper is on whether why Britain and not China? — the Needham-style version of it, and the broader Great Divergence framing — is even a well-posed contrastive question. I'm not taking the lazy line that it's meaningless. My thesis is that as usually posed it bundles together at least three quite different explanatory demands (sustained per-capita growth; coal-and-machines industrialisation; the emergence of modern science) that have different candidate explanations and different natural spatial and temporal units, and that it also fails a test I want to propose, which I'm calling the partition test: a contrastive question of the form why X rather than Y? is well posed only if the contrast survives re-partitioning the units on both sides — i.e. you can't make the contrast evaporate, or reverse, just by redrawing X and Y into different sub-units (regions instead of polities, say) or by scaling up or down. The last five minutes are a repair manual: unpack it into a family of explicitly contrastive questions, each with a named outcome variable, a fixed unit, and a stated contrast class, and give up the idea that there is one single thing out there to be explained. So the payoff I want is methodological, not a verdict on which explanation is actually right, and I'm not totally sure yet whether I have an objection or just a complaint.

  What I need is a Q&A prep sheet for this audience specifically — not the objections I'd get from philosophers in my own department. Give me the objections in the order I should expect them (think likelihood times damage, not just damage), phrased the way these people would actually phrase it, in their own vocabulary (unit of analysis, identification, selection on the dependent variable, Galton's problem, research programme rather than proposition, ex post ergo propter hoc, whatever fits), with a short reply I could actually give in about ninety seconds, and an honest note on where each reply is soft. Please include: the so-what objection (that I'm dressing up the observation that the question is shorthand, which everyone already grants); which two objections have enough force that I should concede something in the talk itself rather than in Q&A; one objection I should answer by changing the paper rather than the performance; and the objection I'm secretly hoping nobody asks. Also flag anything I should just flatly not say in front of this crowd. My own worry, which you can use if it's useful, is that the partition test either has no bite or proves far too much — it looks like it might also dissolve why the Western Roman Empire fell when it did or why the Allies won, and I don't want to give those up.

  Format: the main deliverable is a markdown table, one row per objection, roughly eight to ten rows, with these columns — objection_as_theyd_say_it | who_raises_it | likelihood (H/M/L) | damage_if_unanswered (1-5) | my_90_second_reply | where_the_reply_is_soft. Underneath the table, a short JSON object with exactly these keys: concessions_to_make_in_the_talk (array of strings), change_the_paper_not_the_performance (string), objection_i_hope_nobody_asks (string), things_not_to_say_to_this_audience (array of strings), one_line_i_must_land (string).
reasoning: |-
  We are preparing a Q&A sheet for a PhD student in philosophy presenting at a workshop with economic historians, global historians, philosophers of history and science, and a political scientist. The paper argues that the "why Britain and not China?" question is not well-posed because it bundles three explanatory demands and fails a "partition test". The goal is methodological: to suggest breaking it into separate contrastive questions.

  We are to create a markdown table with 8-10 rows, each row being an objection. The columns are:
  - objection_as_theyd_say_it: how the objection would be phrased by the audience member, using their vocabulary.
  - who_raises_it: which type of audience member (e.g., economic historian, philosopher, political scientist).
  - likelihood (H/M/L): how likely the objection is to be raised.
  - damage_if_unanswered (1-5): severity if not addressed (5 is worst).
  - my_90_second_reply: a concise response (about 90 seconds).
  - where_the_reply_is_soft: an honest note on the weakness of the reply.

  Additionally, we need:
  - concessions_to_make_in_the_talk: two objections so strong we should concede in the talk itself.
  - change_the_paper_not_the_performance: an objection that requires changing the paper, not just the performance.
  - objection_i_hope_nobody_asks: the one we fear most.
  - things_not_to_say_to_this_audience: phrases to avoid.
  - one_line_i_must_land: a key line to deliver.

  Let's brainstorm the objections:

  1. **So-what objection**: Everyone already knows the question is shorthand, so what's new? (Likely from historians, high likelihood, medium damage if unanswered because it challenges the contribution.)

  2. **Partition test is too strong**: It might dissolve other historical contrasts we accept (like why the Roman Empire fell). (Likely from philosophers, medium likelihood, high damage because it undermines the test.)

  3. **Operationalization**: How would we actually design a comparative study? What are the units, controls? (From the political scientist, high likelihood, high damage because it questions practical application.)

  4. **Bundling is necessary**: The three demands (growth, industrialization, science) are interconnected and must be studied together. (From historians, medium likelihood, medium damage.)

  5. **Research program objection**: The question is a fruitful research program even if imperfectly posed. (From historians and philosophers, high likelihood, medium damage.)

  6. **Selection on the dependent variable**: The question focuses on the outcome (divergence) and then looks for causes, which is problematic. (From political scientist or methodologically savvy historians, medium likelihood, high damage.)

  7. **Galton's problem**: The units (Britain and China) are not independent due to global connections. (From global historians, medium likelihood, medium damage.)

  8. **Ex post ergo propter hoc**: The question assumes the outcome was predetermined and we can find necessary conditions. (From philosophers, low likelihood, high damage because it challenges the causal reasoning.)

  9. **The repair manual is trivial**: Breaking down the question is obvious and doesn't advance the debate. (From philosophers and historians, medium likelihood, medium damage.)

  10. **Your test is arbitrary**: Why should the contrast survive repartitioning? What is the theoretical basis? (From philosophers, medium likelihood, high damage.)

  Now we prioritize by likelihood * damage, and select 8-10.

  We also note:
  - Concessions in the talk: two objections that are strong enough to concede in the talk itself. I suggest:
    1. The so-what objection: concede that historians are aware of the shorthand and that the paper's contribution is in systematizing the confusion and providing a test.
    2. The research program objection: concede that the question has been fruitful but argue that it is now time to be more precise.

  - Change the paper: probably the partition test being too strong, because if it also dissolves other accepted contrasts, we need to adjust the test or its application.

  - Objection we hope nobody asks: perhaps one that challenges the very foundation of the partition test, e.g., that it's arbitrary or that it proves too much.

  - Things not to say: avoid saying the question is "meaningless" (since the student already avoids that), or that historians are doing it wrong. Also avoid jargon that might alienate.

  - One line to land: "By unpacking the 'why Britain and not China?' question into a family of explicitly contrastive questions, we can better align explanatory targets with appropriate methods and units of analysis, avoiding the pitfalls of an ill-defined monolith."

  Let's build the table:

  | objection_as_theyd_say_it | who_raises_it | likelihood | damage_if_unanswered | my_90_second_reply | where_the_reply_is_soft |
  |---------------------------|---------------|-----------|----------------------|-------------------|------------------------|
  | "This is just pointing out that the question is shorthand, which we all acknowledge. So what's the novel contribution?" | Historians (especially those working on China) | H | 3 | "You're right that scholars often treat it as shorthand, but the key contribution is systematizing the ambiguities and providing a test (the partition test) to diagnose when a contrastive question is ill-posed. Without this, we risk conflating distinct causal processes and misallocating evidence. My repair manual offers a structured way forward." | The systematization might seem trivial, and the test might not be seen as necessary if they already handle the shorthand. |
  | "Your partition test seems to dissolve not just the Britain-China question but also other classic historical contrasts, like why the Roman Empire fell or why the Allies won WWII. Are you saying those are ill-posed too?" | Philosophers of history | M | 5 | "Great point. The partition test is designed to flag questions that are sensitive to arbitrary partitioning. Some contrasts may pass if they survive reasonable repartitioning (e.g., the Roman Empire vs. the Eastern Empire as sub-units). But if a question fails, it doesn't mean we abandon it; we refine it. The test helps identify when a question needs to be more specific, just as we might refine 'why Rome?' to 'why the Western Empire in the 5th century?'" | The test's application may seem ad hoc without clear criteria for 'reasonable' repartitioning. |
  | "How would you operationalize this for actual comparative research? What are the units of analysis, control cases, and how do we avoid selection bias?" | Comparative political scientist | H | 4 | "For each unpacked question, we fix the outcome (e.g., sustained per-capita growth) and unit (e.g., regions, states) and contrast class (e.g., other Eurasian states). We'd select cases that are comparable in relevant aspects, use process tracing, and perhaps natural experiments. For instance, for coal adoption, we might compare British and Chinese coal regions, controlling for geography and institutions." | This is a sketch; designing such studies is complex and may not fully resolve the original question's breadth. |
  | "Aren't the three demands you identify—growth, industrialization, science—interconnected? Unpacking might miss the systemic nature of the divergence." | Global historians / economic historians | M | 4 | "I agree they are linked, and we should study their interactions. But we must first clarify the distinct causal pathways. For example, science might develop without leading to industrialization (as in some Islamic Golden Age cases). By separating them, we can better model how they interact without assuming they are one monolithic outcome." | It may be difficult to separate them in practice, and the original question might be precisely about the bundle. |
  | "Even if imperfect, the 'why Britain and not China?' framing has driven productive research. Why fix what isn't broken?" | Historians and philosophers | H | 3 | "I acknowledge its fruitfulness, but as the field matures, we face diminishing returns from the bundled question. For instance, debates about California School vs. Pomeranz often talk past each other because they focus on different sub-questions. Precision now can lead to more cumulative knowledge." | The bundled question may still be useful for big-picture synthesis, and abandoning it might fragment the field. |
