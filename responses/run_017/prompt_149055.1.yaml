answer: |-
  Your frustration is spot-on—you've hit fundamental limitations of simple fuzzy logic in handling everyday vagueness. What you're grappling with isn't one single issue, but three distinct (though related) philosophical/logical problems. Here's how they map to established concepts, where they diverge, and why your intuitions clash with the min/max approach:

  ### 1. **Self-Contradiction & Excluded Middle (Your First Case)**
      *   **The Issue:** "Warm (0.5) AND not warm (0.5)" feels false (0), not middling (0.5). "Warm (0.5) OR not warm (0.5)" feels true (1), not middling (0.5). Min/max fails.
      *   **Established Concepts:**
          *   **The Law of Non-Contradiction (LNC):** "A and not-A" must be false.
          *   **The Law of Excluded Middle (LEM):** "A or not-A" must be true.
      *   **Where Fuzzy Logic Breaks:** Classic fuzzy logic (`min`/`max`) is **truth-functional**. The truth value of the compound *only* depends on the truth values of the parts. This clashes with LNC/LEM, which demand specific outcomes *regardless* of A's truth value.
      *   **Precise Mismatch:** Min/max treats "A" and "not-A" as *independent* propositions with middling truth. But in reality, "not-A" is *defined by* A. Their truth values are perfectly negatively correlated. Truth-functionality ignores this dependence.
      *   **The Label: "The Truth-Functionality Penalty"** or the "**Fuzzy Paradox of Self-Reference**". This is a *well-known* and major criticism of standard fuzzy logic's handling of negation and connectives in borderline cases.

  ### 2. **Context-Dependence & Meaning Boundaries (Your Second Case)**
      *   **The Issue:** "Blue (0.5) OR Green (0.5)" feels true (1) if mutually exclusive, but "Blue (0.5) OR Hot (0.5)" feels middling (~0.5). "Blue AND Green" feels false (0), "Blue IFF Hot" feels false (0).
      *   **Established Concepts:**
          *   **Meaning Holism/Context Dependence:** The meaning and acceptable applications of vague terms ("blue", "green") depend on the *context* in which they are used and their *relationship* to other terms.
          *   **Incompatibility/Exclusion:** Some concepts inherently conflict ("blue" and "green" for a single point on a wall under normal lighting).
          *   **Relevance/Irrelevance:** Combining completely unrelated vague concepts ("blue", "hot") doesn't resolve their individual vagueness in the same way combining related ones might.
      *   **Where Fuzzy Logic Breaks:** Min/max is **syntactic**. It only cares about the *numerical* truth values, *not* the *meaning* of the propositions or their semantic relationship. It has no mechanism to encode that "blue" and "green" are mutually exclusive within a context, or that "blue" and "hot" are irrelevant.
      *   **Precise Mismatch:** The "OR" operation feels different because the *domain of discourse* and the *logical constraints* change. For a single wall point, "Blue OR Green" covers the entire relevant color spectrum, making it definitive. "Blue OR Hot" spans unrelated domains, leaving both sources of vagueness unresolved. Min/max is oblivious to domain boundaries and semantic constraints.
      *   **The Label: "Context-Dependence of Vagueness"** or the **Problem of Irrelevant Conjunctions/Disjunctions** in truth-functional fuzzy logic. This highlights the need for **non-truth-functional** or **context-aware** logics for vagueness.

  ### 3. **Dependence & Conjunction Fallacy (Your Third Case)**
      *   **The Issue:** "Warm (0.5) AND Stuffy (0.5)" feels *less* true than 0.5 (maybe ~0.25), not 0.5 (min) or 0.25 (product). Your gut says "worse than fifty-fifty".
      *   **Established Concepts:**
          *   **Probability vs. Fuzzy Membership:** Fuzzy truth values (0.5 = "borderline warm") are *not* probabilities (0.5 = "50% chance of being warm"). This is crucial.
          *   **Conjunction Fallacy (Reversed):** People often intuitively judge the probability of a conjunction (A and B) as *higher* than it mathematically is (if A and B aren't perfectly correlated). Your intuition runs the *opposite* way: you judge the *fuzzy truth* of the conjunction as *lower* than the min or product would suggest. This stems from interpreting the fuzzy values differently.
          *   **Dependence:** Your intuition likely assumes "warm" and "stuffy" are *positively correlated* (warm rooms are *more likely* to feel stuffy), but not perfectly. Needing *both* amplifies the uncertainty.
      *   **Where Fuzzy Logic Breaks (Partially):**
          *   `min(A, B)` = 0.5 implies the conjunction is *as true* as each part alone. This ignores how requiring *multiple* borderline conditions compounds uncertainty.
          *   `A * B` (Product T-norm) = 0.25 treats fuzzy values *like* independent probabilities, which they might not be.
      *   **Precise Mismatch:** Your intuition is blending **fuzzy membership** ("how warm is it?") with an **epistemic assessment** ("how confident can I be that *both* conditions are *sufficiently* satisfied to warrant the fan?"). The more conditions required, the harder it is to be confident *all* are met when each is borderline. Min/max doesn't capture this "compounding uncertainty" effect. It also doesn't model dependence between the conditions (e.g., warm air often *causes* stuffiness).
      *   **The Label: "Compounding Uncertainty in Conjunction"** or **Epistemic Interpretation of Fuzzy Conjunction**. This points towards needing **fuzzy measures with dependence** or **probabilistic interpretations of fuzzy rules** for decision-making.

  ### Mapping to Concepts You Mentioned
  *   **Sorites Paradox (Heap):** This focuses on *tolerance* – small changes not affecting a vague predicate (one grain doesn't make a heap non-heap). Your cases are about the *logic of combining* vague predicates *at a single point*, not the progression along a series. Related, but distinct.
  *   **Higher-Order Vagueness:** This is about the vagueness *of the borderline itself* ("Is '0.5' even the right value? Is this *definitely* a borderline case?"). Your examples assume we *can* assign a middling truth value (0.5), focusing on what happens *after* we do that when combining them. Your "blue OR green" case *touches* on it, as the disjunction seems to *collapse* the borderline status into definiteness.

  ### What's "New" vs. Known?
  1.  **Self-Contradiction/Excluded Middle Breakdown:** Well-known, major criticism of truth-functional fuzzy logic (`min`/`max`/`1-A` for negation).
  2.  **Context-Dependence (Blue/Green vs. Blue/Hot):** Known issue, highlights the need for non-truth-functional approaches or integrating context/semantics. Your "blue OR green" becoming true is a particularly clear example of context resolving vagueness.
  3.  **Compounding Uncertainty (Warm AND Stuffy < 0.5):** The *specific intuition* that conjunction feels *less true* than the min value is a recognized practical challenge in applying fuzzy logic to real-world decisions, often leading to the use of alternative T-norms like product, or hybrid probabilistic-fuzzy approaches. Your description of the *feeling* ("worse than fifty-fifty") is insightful.

  ### Edge Cases & Defining Your Core Insight
  The core thread is **"Truth-functionality (`min`/`max`) fails to capture how the *meaning*, *context*, and *dependence* between vague propositions fundamentally alter the perceived truth of their combinations, especially regarding necessary conditions and logical laws."**

  *   **Edge Case 1 (Self-Reference):** What if "A" is *precisely* at 0.5? Is "A AND not-A" *exactly* 0 or is there a tiny range? Truth-functional systems force it to 0. Non-truth-functional ones might allow infinitesimal values, but this gets messy.
  *   **Edge Case 2 (Meaning Boundaries):** How sharply defined must the mutual exclusivity ("blue" vs. "green") be for the disjunction to become definitely true? What about very similar colors? This bleeds into higher-order vagueness.
  *   **Edge Case 3 (Dependence):** How strong must the positive correlation between "warm" and "stuffy" be for your intuition to hold? What if they are *negatively* correlated (e.g., a breezy warm room)? Your intuition likely assumes typical positive dependence.

  ### Practical Implications for Your Automation
  *   **Min/Max (`min` for AND, `max` for OR):** Simple, computationally cheap, standard. Works *okay* for unrelated, non-critical conditions. Fails badly for contradictions, exclusions, and critical conjunctions.
  *   **Product T-norm (`A * B` for AND):** Addresses your "compounding uncertainty" intuition for AND better than `min`. `A + B - A*B` (Probabilistic Sum) is the common OR counterpart. Treats values *like* independent probabilities.
  *   **Bounded Sum (`max(0, A+B-1)` for AND, `min(1, A+B)` for OR):** More extreme than product. AND drops to 0 faster if either is low. OR jumps to 1 faster if either is high.
  *   **Non-Truth-Functional Approaches:** More complex. Might involve:
      *   **Supervaluationism:** "A OR not-A" is true because *every* precisification makes it true. "A AND not-A" is false because *no* precisification makes it true. "Blue OR Green" is true if *every* reasonable sharp boundary includes the color in "blue or green". Captures logic laws and context but loses the "degree of truth" for borderline cases themselves.
      *   **Contextualist Logics:** Explicitly incorporate context parameters to handle cases like "blue/green" vs. "blue/hot".
      *   **Hybrid Probabilistic-Fuzzy Systems:** Use fuzzy sets for input (degree of warmth) but probabilistic or evidence-based rules for combining them (e.g., probability that both thresholds are exceeded), potentially incorporating dependence.

  **Recommendation:** For your home automation, start by experimenting with the **Product T-norm (`A * B` for AND)** instead of `min`. It directly addresses your third case (Warm AND Stuffy will be <= min(A, B), often lower). Acknowledge that the other issues (contradictions, context-dependence) are inherent limitations of simple numerical approaches to vagueness – sometimes you need to step back and encode specific domain knowledge (e.g., "blue AND green" is always 0 for a wall, "warm OR not warm" is always 1). Your intuition is highlighting the complex reality of language and context that simple math struggles to capture perfectly.
