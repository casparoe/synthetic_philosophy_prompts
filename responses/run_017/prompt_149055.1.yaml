  The second issue involves relevance. When combining "blue" and "green," there's a semantic clash because colors are mutually exclusive. But "blue" and "hot" are unrelated, so their combination doesn't resolve vagueness. This ties into the concept of meaning boundaries and how context affects truth values. Fuzzy logic doesn't account for semantic relationships between propositions.

