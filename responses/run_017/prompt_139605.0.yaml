  12. **Co-authorship in Action**: A patient wrote an advance directive but included a clause that the named proxy should have discretion. The proxy and the clinical team now disagree with the directive's specific instruction. The patient is unconscious. What should be done?
      - A. Follow the advance directive strictly.
      - B. The proxy and team should decide together, using the directive as guidance.
      - C. The directive is only one factor; the proxy has the final say.

