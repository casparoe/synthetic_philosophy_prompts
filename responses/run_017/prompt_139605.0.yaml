  We are building a sorting quiz with 12 questions, each with three options (A, B, C). The goal is to map answer patterns onto philosophical positions regarding advance directives. The positions we want to cover are:

  1. Strong Precedent Autonomy: The document wins even against current welfare.
  2. Enduring Evaluative Commitments (Dworkin): Only directives expressing enduring values bind, not mere experiential preferences.
  3. Epistemic but Defeasible: The document is presumptively binding because the earlier self was a better judge, but can be overturned by new information.
  4. Evidential Only: The document is evidence and nothing more.
  5. Commitment Device/Promising: The bindingness comes from the practice of holding people to their word and the institutional harm of breaches.
  6. Relational/Joint Authorship: The patient, surrogate, and clinicians are co-authors; the document is a tool for that relationship.
  7. Gradualist: Authority fades with psychological continuity.

  We also note the position that nobody seems to hold: "the earlier self has full authority over a later self who is completely competent, fully informed and has no impairment whatsoever" — we'll explore why.

  Each question will be a concrete case. We'll design the cases to cover a range of scenarios, including:
  - No cognitive impairment: e.g., change of mind while anxious, drunk, or due to religious conversion.
  - Misjudgment: directive written at 19 that misjudged future values.
  - Factual error: directive based on a false belief the author would have corrected.
  - Mental state: directive written while depressed and now disavowed.
  - Secrecy: no one would know if ignored.
  - Proxy involvement: named proxy disagrees.

  We need 12 questions. Each question will have three answer choices. We'll design the choices to probe the underlying principles without giving away the position.

  After the quiz, we'll have a scoring key that maps patterns to positions. We'll also note any two positions that the quiz cannot distinguish and whether a 13th question could fix it. We'll provide a rule for mixed/tied scores.

  Let's outline the questions:

  1. **Case of Acute Anxiety**: A patient with a terminal illness writes an advance directive refusing life-sustaining treatment during a period of extreme anxiety about becoming a burden. After starting hospice care, they become calm and change their mind, requesting treatment. They are fully competent now and were when they wrote the directive. What should be done?
     - A. Follow the advance directive (refuse treatment).
     - B. Follow the current request (provide treatment).
     - C. Consult with the healthcare proxy and family to decide.

  2. **Directive at 19**: At 19, after a minor surgery, a healthy person writes a directive stating they never want to be on a ventilator, thinking it would be a fate worse than death. At 45, they develop a condition requiring temporary ventilation and now want to live. They are fully competent. What should be done?
     - A. Follow the advance directive (no ventilator).
     - B. Follow the current request (use ventilator).
     - C. The directive should be considered but not binding; use shared decision-making with the patient and family.

  3. **Factual Belief Error**: A person writes a directive refusing blood transfusions because they believe (incorrectly) that they have a high risk of contracting HIV from blood. They now need a transfusion and have been informed that the risk is negligible. They are fully competent and want the transfusion. What should be done?
     - A. Follow the advance directive (no transfusion).
     - B. Follow the current request (give transfusion).
     - C. The directive is evidence of their values, but the current request should be followed because of the new information.

  4. **Religious Conversion**: A person wrote a secular advance directive refusing any religious rituals at the end of life. They later convert to a religion and now request those rituals. They are terminally ill and fully competent. What should be done?
     - A. Follow the advance directive (no rituals).
     - B. Follow the current request (allow rituals).
     - C. The directive is not relevant to religious practices; follow the current request.

  5. **Depression**: A person wrote an advance directive refusing all life-sustaining treatment during a severe depressive episode. They have since recovered and now, facing a terminal illness, want all possible treatment. They are fully competent. What should be done?
     - A. Follow the advance directive (refuse treatment).
     - B. Follow the current request (provide treatment).
     - C. The directive was written under impaired conditions so it should be ignored; follow the current request.

  6. **Secrecy Case**: A patient has written an advance directive refusing a specific treatment. The treatment is now indicated, and the patient is unconscious. The family and doctor agree that ignoring the directive would be in the patient's best interest and no one would ever know. What should be done?
     - A. Follow the advance directive (refuse treatment).
     - B. Ignore the directive and provide treatment.
     - C. The directive should be followed because it's a matter of principle, even if no one knows.

  7. **Proxy Disagreement**: A patient wrote an advance directive refusing a treatment and named a proxy. The proxy now believes the directive is out of date and the patient would have changed their mind. The patient is unconscious. What should be done?
     - A. Follow the advance directive (refuse treatment).
     - B. The proxy should decide, so provide treatment if the proxy agrees.
     - C. The directive should be used as evidence, but the proxy has the authority to override.

  8. **Happiness in Dementia (like the original case)**: A man with early-onset Alzheimer's wrote a directive at 40 saying no aggressive treatment if he needed full-time care. Now, he is in full-time care, but is very happy and wants to live to see his granddaughter graduate. He is not competent to make medical decisions now. What should be done?
     - A. Follow the advance directive (no aggressive treatment).
     - B. Ignore the directive and provide treatment because he is happy and wants to live.
     - C. Consider the directive but also his current welfare and relationships; perhaps a compromise.

  9. **Gradual Change**: A patient wrote an advance directive at 50 refusing a specific treatment. Over the years, they gradually changed their mind without updating the directive. At 70, they are diagnosed with a condition requiring that treatment and now want it. They are fully competent. What should be done?
     - A. Follow the advance directive (refuse treatment).
     - B. Follow the current request (provide treatment).
     - C. The directive is outdated, so it should be ignored; follow the current request.

  10. **Temporary Impairment**: A person wrote an advance directive while intoxicated, refusing a life-saving procedure. They are now sober, fully competent, and want the procedure. What should be done?
      - A. Follow the advance directive (refuse the procedure).
      - B. Follow the current request (perform the procedure).
      - C. The directive was written under impairment so it should be ignored; follow the current request.

  11. **Enduring vs. Experiential**: A person wrote an advance directive refusing pain medication at the end of life because they value lucidity (an enduring value) over comfort. Now, in severe pain, they are fully competent and request pain medication. What should be done?
      - A. Follow the advance directive (refuse pain medication).
      - B. Follow the current request (provide pain medication).
