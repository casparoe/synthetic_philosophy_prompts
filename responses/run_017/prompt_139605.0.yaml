  Here's a complete advance directives sorting quiz designed around your specifications. It uses concrete cases to probe underlying principles, avoids philosophical jargon, and maps responses to seven core positions in the logical space. The scoring system identifies dominant views, handles ties, and flags unexplored combinations.

  ---

  ### **Advance Directives Beliefs Sorting Quiz**  
  *Instructions: For each scenario, choose the option (A, B, or C) that best reflects what you believe should happen. Answer instinctively—there are no "right" answers.*

  1. **The Anxious Directive**  
     A cancer patient writes a directive refusing chemotherapy during a panic attack, fearing side effects. Hours later, calm and competent, they ask for treatment.  
     - A. Follow the directive (refuse chemo).  
     - B. Follow their current request (provide chemo).  
     - C. Delay and consult their spouse/doctor before deciding.  

  2. **Teenage Oath**  
     At 19, after a minor injury, someone signs a directive: "Never give me blood transfusions—I’d rather die." At 45, needing surgery, they beg for a transfusion to live.  
     - A. Follow the directive (no transfusion).  
     - B. Follow their current request (give transfusion).  
     - C. Ignore the directive—it’s too old to be relevant.  

  3. **The Misinformed Vegan**  
     A vegan refuses artificial nutrition in a directive, believing (falsely) it contains animal products. Unconscious and malnourished, they’d die without it. Their doctor confirms it’s plant-based.  
     - A. Follow the directive (withhold nutrition).  
     - B. Provide nutrition—they were misinformed.  
     - C. Ask their proxy to decide based on known values.  

  4. **Religious Reversal**  
     An atheist’s directive forbids any religious rituals during care. They later convert, become devout, and ask for last rites while conscious and competent.  
     - A. Follow the directive (no rituals).  
     - B. Honor their current request (allow rituals).  
     - C. Allow rituals—spiritual care isn’t "treatment."  

  5. **Depression Directive**  
     Someone writes "Do not resuscitate" during severe depression. Recovered and terminally ill, they now demand "Do everything to save me."  
     - A. Follow the directive (no resuscitation).  
     - B. Follow their current request (resuscitate).  
     - C. Treat the directive as void—it was written under illness.  

  6. **The Secret Violation**  
     A directive refuses CPR. During cardiac arrest, the doctor knows ignoring it would save the patient’s life, and no one would ever find out.  
     - A. Follow the directive (no CPR).  
     - B. Ignore it—saving life is paramount.  
     - C. Follow it—breaking trust harms all directives.  

  7. **Proxy Override**  
     A directive refuses dialysis and names a daughter as proxy. The daughter says, "Dad changed his mind but didn’t update the document. He’d want dialysis now."  
     - A. Follow the directive (no dialysis).  
     - B. Let the daughter decide.  
     - C. Use the directive as input, but she has final say.  

  8. **The Factual Update**  
     A directive refuses ventilators for COPD, written when survival odds were 10%. Now, odds are 80% with new treatments. The patient is unconscious.  
     - A. Follow the directive (no ventilator).  
     - B. Provide ventilation—facts changed.  
     - C. Ask the proxy to decide based on current info.  

  9. **Drunk Directive**  
     While intoxicated, someone writes "No intubation ever." Sober and competent, facing pneumonia, they plead for intubation if needed.  
     - A. Follow the directive (no intubation).  
     - B. Follow their current request (allow intubation).  
     - C. Void the directive—alcohol invalidates consent.  

  10. **The Happy Dementia Patient**  
      At 40, a man with early Alzheimer’s risk writes: "No antibiotics if I need full-time care." Now 65, in full-time care, he’s blissfully happy and begs to live for his granddaughter’s graduation.  
      - A. Follow the directive (no antibiotics).  
      - B. Provide antibiotics—he’s happy and wants to live.  
      - C. Weigh both views; compromise if possible.  

  11. **Silent Sufferer**  
      A directive refuses opioids to stay lucid during terminal illness. In agony, the fully competent patient pleads for morphine.  
      - A. Follow the directive (refuse opioids).  
      - B. Provide opioids—pain outweighs prior wishes.  
      - C. Give low-dose opioids to balance pain/lucidity.  

  12. **The Discretion Clause**  
      A directive says "No feeding tubes," but adds: "My proxy can override if circumstances change." The proxy insists a temporary tube is now best.  
      - A. Follow the directive (no tube).  
      - B. Let the proxy decide.  
      - C. Proxy and clinician decide together using the directive as a guide.  

  ---

  ### **Scoring Key**  
  *Count how many times you chose each letter (A, B, C). Use the table below to find your dominant position(s).*  

  | **Position**                          | **Answer Pattern**      | **Most Awkward Commitment**                                  |  
  |---------------------------------------|-------------------------|------------------------------------------------------------|  
  | **Strong Precedent Autonomy**         | Mostly A                | Must enforce directives even if they cause current suffering. |  
  | **Enduring Commitments Only** (Dworkin)| A in Q11; B in Q1,2,5 | Must ignore current happiness if it conflicts with past values (e.g., dementia case). |  
  | **Epistemic but Defeasible**          | B in Q3,8; C in Q7,12  | New evidence can override, but "significant change" is ill-defined. |  
  | **Evidential Only**                   | Mostly B                | Directives have no moral weight—they’re just data points.    |  
  | **Commitment Device**                 | C in Q6; A in Q4,9     | Must uphold directives even if irrational to maintain trust. |  
  | **Relational/Joint Authorship**       | Mostly C                | Decisions must be collaborative, slowing emergencies.        |  
  | **Gradualist**                        | B in Q9,10; C in Q8,12 | Psychological "continuity" is impossible to measure objectively. |  

  #### **Rules & Analysis**  
  - **Ties/Mixed Scores**: If you have multiple matches, you’re likely:  
    - **Case-by-case contextualist** (if no clear pattern).  
    - **Hybrid theorist** (e.g., "Epistemic + Relational" if tied between those).  
    - *Workshop tip*: Group tied participants for debate—they’ll bridge viewpoints.  
  - **Indistinguishable Positions**:  
    - **Commitment Device** and **Strong Precedent Autonomy** overlap on 8/12 questions. They’re separable *only* by Q5 and Q9 (depression/drunk cases), where Commitment Device allows impairment-based override.  
    - *Fixable?* Add a 13th question: *"A directive refuses surgery based on a since-debunked myth. The writer, now competent, says, ‘I was wrong—do it.’ What should be done?"*  
      - A. Follow directive → **Strong Precedent Autonomy**.  
      - B/C. Allow surgery → **Commitment Device**.  
  - **Unexplored View**: "Earlier self has full authority over a fully competent, unimpaired later self" (e.g., always A in Q1,2,4,5,11).  
    - *Why nobody holds it*: Morally unappealing (denies agency to current self), not incoherent. Real-world cases (e.g., Q1, Q4) show why it’s rejected.  
  - **Gaps in Logic Space**:  
    - **"Directive wins only if no one knows about breach"** has no takers. Why? Incoherent—moral obligations don’t hinge on secrecy (Q6 probes this).  
    - **"Directives bind only if the later self is impaired"** is covered by all views except Strong Precedent Autonomy (Q1, Q11 disprove it).  

  #### **Workshop Integration**  
  - **Timing**: Takes ~12 minutes to complete; scoring adds 3 minutes.  
  - **Discussion Starter**: "Your quiz result is your starting position. Defend it using one case where you chose A/B/C against someone who chose differently."  
  - **Key Insight**: The quiz forces engagement with *why* we honor directives (autonomy, evidence, relationships?) before labeling views.  

  This tool isolates core tensions (e.g., Q3 tests factual errors; Q10 pits precedent autonomy against welfare) while avoiding dementia-only focus. It validates "unstable" views as hybrid positions—ideal for revealing why your team split 50/50.
