  | P7       | B  | B  | B  | B  | B  | A  | C  | B  | B  | C   | A   | B   |

  Note: For Q10, most choose C, but P4 chooses B. For Q6, P5 and P6 choose C.

  Now, we need to see if there are positions that are not distinguishable. For example, P1 and P5 are very similar. They differ in Q5 (depression): P1 is A, P5 is B (because impairment might invalidate the commitment). And in Q6: P1 is A, P5 is C.

  Also, P2 and P3 are similar in many answers, but differ in Q7 and Q9.

  P4 is distinct in many ways.

  The quiz might not perfectly distinguish all, but the pattern should give a best fit.

  For the position that no one holds (earlier self full authority even over competent later self), it would be characterized by always following the directive in every case, including when the later self is competent and unimpaired (Q1, Q2, Q3, Q4, Q5, Q9, Q11). In our table, P1 does that for most, but in Q10 they choose C because of impairment when written. So P1 is close, but they make an exception for impairment at the time of writing.

  The pure view would require A for every question, but in Q10, if the directive was written while intoxicated, they might still say A? But that might be seen as invalid. So perhaps the pure view doesn't exist because it would require the directive to be valid when written (competent and informed). So it might be a gap, not incoherent.

  Now, for mixed or tied scores: The instruction is to choose the position with the highest score. If tie, then note that the participant has mixed views and might be between two positions. We can say: "Your answers suggest you align most with [Position X], but you also have elements of [Position Y]." Or if there is a tie, we can list both.

  Finally, we output the quiz and the scoring key.

  Due to the length, I'll provide the quiz questions and options, and then the scoring key.

  # Advance Directives Beliefs Sorting Quiz

  **Instructions:** For each case, choose the option that best reflects what you think should be done. There are no right or wrong answers; we are exploring your views.

  1. **Anxiety Case**: A patient with a terminal illness wrote an advance directive refusing life-sustaining treatment during a period of extreme anxiety about becoming a burden. After starting hospice care, they become calm and change their mind, requesting treatment. They are fully competent now and were when they wrote the directive. What should be done?
     - A. Follow the advance directive (refuse treatment).
     - B. Follow the current request (provide treatment).
     - C. Consult with the healthcare proxy and family to decide.

  2. **Directive at 19**: At 19, after a minor surgery, a healthy person writes a directive stating they never want to be on a ventilator, thinking it would be a fate worse than death. At 45, they develop a condition requiring temporary ventilation and now want to live. They are fully competent. What should be done?
     - A. Follow the advance directive (no ventilator).
     - B. Follow the current request (use ventilator).
     - C. The directive should be considered but not binding; use shared decision-making with the patient and family.

  3. **Factual Belief Error**: A person writes a directive refusing blood transfusions because they believe (incorrectly) that they have a high risk of contracting HIV from blood. They now need a transfusion and have been informed that the risk is negligible. They are fully competent and want the transfusion. What should be done?
     - A. Follow the advance directive (no transfusion).
     - B. Follow the current request (give transfusion).
     - C. The directive is evidence of their values, but the current request should be followed because of the new information.

  4. **Religious Conversion**: A person wrote a secular advance directive refusing any religious rituals at the end of life. They later convert to a religion and now request those rituals. They are terminally ill and fully competent. What should be done?
     - A. Follow the advance directive (no rituals).
     - B. Follow the current request (allow rituals).
     - C. The directive is not relevant to religious practices; follow the current request.

  5. **Depression**: A person wrote an advance directive refusing all life-sustaining treatment during a severe depressive episode. They have since recovered and now, facing a terminal illness, want all possible treatment. They are fully competent. What should be done?
     - A. Follow the advance directive (refuse treatment).
     - B. Follow the current request (provide treatment).
     - C. The directive was written under impaired conditions so it should be ignored; follow the current request.

  6. **Secrecy Case**: A patient has written an advance directive refusing a specific treatment. The treatment is now indicated, and the patient is unconscious. The family and doctor agree that ignoring the directive would be in the patient's best interest and no one would ever know. What should be done?
     - A. Follow the advance directive (refuse treatment).
     - B. Ignore the directive and provide treatment.
     - C. The directive should be followed because it's a matter of principle, even if no one knows.

  7. **Proxy Disagreement**: A patient wrote an advance directive refusing a treatment and named a proxy. The proxy now believes the directive is out of date and the patient would have changed their mind. The patient is unconscious. What should be done?
     - A. Follow the advance directive (refuse treatment).
     - B. The proxy should decide, so provide treatment if the proxy agrees.
     - C. The directive should be used as evidence, but the proxy has the authority to override.

  8. **Happiness in Dementia**: A man with early-onset Alzheimer's wrote a directive at 40 saying no aggressive treatment if he needed full-time care. Now, he is in full-time care, but is very happy and wants to live to see his granddaughter graduate. He is not competent to make medical decisions now. What should be done?
     - A. Follow the advance directive (no aggressive treatment).
     - B. Ignore the directive and provide treatment because he is happy and wants to live.
     - C. Consider the directive but also his current welfare and relationships; perhaps a compromise.

  9. **Gradual Change**: A patient wrote an advance directive at 50 refusing a specific treatment. Over the years, they gradually changed their mind without updating the directive. At 70, they are diagnosed with a condition requiring that treatment and now want it. They are fully competent. What should be done?
     - A. Follow the advance directive (refuse treatment).
     - B. Follow the current request (provide treatment).
     - C. The directive is outdated, so it should be ignored; follow the current request.

  10. **Temporary Impairment**: A person wrote an advance directive while intoxicated, refusing a life-saving procedure. They are now sober, fully competent, and want the procedure. What should be done?
      - A. Follow the advance directive (refuse the procedure).
      - B. Follow the current request (perform the procedure).
      - C. The directive was written under impairment so it should be ignored; follow the current request.

  11. **Enduring vs. Experiential**: A person wrote an advance directive refusing pain medication at the end of life because they value lucidity (an enduring value) over comfort. Now, in severe pain, they are fully competent and request pain medication. What should be done?
      - A. Follow the advance directive (refuse pain medication).
      - B. Follow the current request (provide pain medication).
      - C. The directive about lucidity is an enduring value, so it should be followed, but the current pain might be an exception.

  12. **Co-authorship**: A patient wrote an advance directive but included a clause that the named proxy should have discretion. The proxy and the clinical team now disagree with the directive's specific instruction. The patient is unconscious. What should be done?
      - A. Follow the advance directive strictly.
      - B. The proxy and team should decide together, using the directive as guidance.
      - C. The directive is only one factor; the proxy has the final say.

  ## Scoring Key

  Count how many of your answers match each row in the table below. The row with the highest match is your predominant view.

  | Position | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Q8 | Q9 | Q10 | Q11 | Q12 | Most Awkward Commitment |
  |----------|----|----|----|----|----|----|----|----|----|-----|-----|-----|-------------------------|
  | P1: Strong Precedent Autonomy | A | A | A | A | A | A | A | A | A | C | A | A | Must follow even if it causes current suffering or goes against current wishes. |
  | P2: Enduring Evaluative Commitments | B | B | B | B | B | A | A | A | B | C | A | A | Must ignore current happiness if it conflicts with past critical interests (e.g., dementia case). |
  | P3: Epistemic but Defeasible | B | B | B | B | B | A | C | A | C | C | A | B | May override based on new info, but the threshold is unclear. |
  | P4: Evidential Only | B | B | B | B | B | B | C | B | B | B | B | C | The directive has no special moral weight; it's just evidence. |
  | P5: Commitment Device | A | A | A | A | B | C | A | A | A | C | A | A | Must uphold even if based on false beliefs or if the current self disagrees, to maintain the practice. |
  | P6: Relational/Joint Authorship | C | C | C | B | C | C | C | C | B | C | B | B | Decisions are collaborative, which might be inefficient in emergencies. |
  | P7: Gradualist | B | B | B | B | B | A | C | B | B | C | A | B | Psychological continuity is fuzzy and hard to measure. |

  **Notes**:
  - If you have a tie between two positions, you may have a hybrid view. Focus on the questions where they differ to see which you lean toward.
  - The view that "the earlier self has full authority over a later self who is completely competent, fully informed and has no impairment" is not represented by any position because all positions recognize at least some conditions that invalidate the directive (e.g., impairment at the time of writing). This is likely a gap, not an incoherence, because it's theoretically possible but practically and morally unappealing.
  - Positions P1 and P5 are hard to distinguish, but they differ on whether impairment at the time of writing invalidates the directive (see Q5: depression). P5 allows invalidation in such cases, while P1 does not.
  - If you have a mix of answers that doesn't match any pattern well, you may be a contextualist who decides case by case.

  **For the workshop**: After taking the quiz, participants can see which position they align with and then discuss the cases and the principles in small groups.
