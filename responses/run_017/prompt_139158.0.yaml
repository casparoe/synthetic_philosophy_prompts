  ### Mechanism Check & Revisions
  - **Rational herding achieved**: Each stanza shows agents updating *correctly* on observed actions (e.g., "I weighed what they’d made known"). No reputational pressure ("no groan," "freely sown").  
  - **Refrain dynamics**: Private refrain softens (bold → italics → bold with quatrain’s hollow resonance). Crowd refrain intensifies ("first two" → "first ten" → "VALLEY" caps).  
  - **Fragility in quatrain**: The jarring line "Three-quarters showed the first seed best" (drab, unpoetic) breaks rhythm. Crowd refrain afterward rings empty, revealing unanimous choice as epistemically inert.  
  - **Ambiguity preserved**: "The tally shone" implies evidence existed but couldn’t reset the cascade. Early sharing ("freely sown") might have helped or hastened herding—left unresolved.  
  - **Form as function**: Villanelle’s repetitions mimic recursive herding; truncated final quatrain (19th line omitted) visually enforces "hollowness."  

  **Revision notes**: Softened "fragile throne" to avoid implied weakness; added "no break, no drone" to stress unanimity’s emptiness; made "three-quarters" line aggressively plain. Crowd refrain’s escalation clarifies cascade mechanics without jargon.
