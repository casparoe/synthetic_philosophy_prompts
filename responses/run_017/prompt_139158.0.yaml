  ### Philosophical Mechanism & Structural Plan
  The poem dramatizes **rational informational herding**: individuals sequentially update beliefs based solely on prior *actions* (seed choices) without accessing private *evidence* (trial results). Each correctly ignores their own data once prior announcements suggest a consensus, causing a cascade where choices amplify unanimity while eroding informational diversity. 

  - **Refrain 1 (Private evidence)**: "My trial showed the first seed grown."  
    *Diminishes audibly—starts robust, ends whispered—to show suppressed truth.*  
  - **Refrain 2 (Crowd choice)**: "The queue chose second seed alone."  
    *Grows stronger—starts tentative, ends declarative—to mirror cascade momentum.*  
  - **Last quatrain**: The refrains converge, exposing fragility. A jarring, prosaic line ("Three-quarters showed the first seed best") breaks the form's musicality, hollowing the final crowd refrain. Ambiguity remains: early evidence-sharing might have prevented or accelerated herding.  

  ### Refrain Sketches
  1. **Private evidence refrain**:  
     - Stanza 1: "**My trial showed the first seed grown.**" (Clear assertion)  
     - Stanza 3: "*My trial showed the first seed grown.*" (Softer, amidst doubt)  
     - Stanza 6: "**My trial showed the first seed grown.**" (Faint echo; truth persists but is ignored)  
  2. **Crowd choice refrain**:  
     - Stanza 1: "**The first two chose second seed alone.**" (Initial minority)  
     - Stanza 3: "*The first ten chose second seed alone.*" (Building consensus)  
     - Stanza 6: "**THE VALLEY chose second seed alone.**" (Caps lock for finality)  

