answer: |-
  ### The Scenario: A School Intervention That Doesn't Work  
  Imagine a literature on a school intervention (e.g., a new math curriculum) tested in 30 published randomized trials. Each trial has 80 students (40 per group), typical for education research. The true effect is **zero** (δ = 0), but due to publication bias, only studies with statistically significant positive results (p < 0.05, two-tailed) appear in journals. All studies are run honestly—no p-hacking or fraud.  

  ### The Numbers You’d See  
  - **Published effect sizes**: Range from 0.43 to 0.70, averaging **0.53** (standardized mean difference).  
  - **Bayesian random-effects meta-analysis** (weakly informative priors: μ ~ Normal(0, 1), τ ~ Half-Normal(0, 0.5)):  
    - Pooled estimate: **0.52**  
    - 95% credible interval: **(0.45, 0.59)** (excludes zero → "confidently positive").  
  - **Frequentist p-curve analysis**:  
    - Tests if the distribution of significant p-values (from the 30 studies) is right-skewed (expected with a true effect) or flat (expected under null + publication bias).  
    - Result: p-values are uniformly distributed (flatness test p < 0.05; right-skew test p > 0.50).  
    - Verdict: **"No evidence of a true effect; consistent with null + publication bias."**  

  #### Why These Numbers Make Sense  
  - Under the null (δ = 0), effects are symmetric around zero. With publication bias, only effects > 0.43 (the significance threshold for n=80) get published.  
  - The average published effect (0.53) matches the expected value of a truncated normal distribution:  
    - Threshold = 1.96 × SE ≈ 1.96 × 0.22 = 0.43 (SE for n=80).  
    - Mean of values > 0.43 in a N(0, 0.24²) distribution = **0.53** (calculated via truncated normal formula).  
  - Bayesian pooling ignores selection, so it naively averages the 0.53 effects → 0.52.  
  - p-curve sees p-values are uniform (not right-skewed), signaling "no true effect."  

  ---

  ### The Single Feature Doing the Work: **Selection on Significance**  
  The entire discrepancy hinges on **publication bias**—the file drawer of non-significant/null results. If you remove this:  
  - **Bayesian analysis**: Estimates μ ≈ 0.02 (95% CrI: -0.10, 0.14) → correctly near zero.  
  - **Frequentist p-curve**: Unnecessary; all data are available.  
  *Without publication bias, both methods agree on the null.*  

  ---

  ### Addressing the Objection: "Bayesians Should Model Selection Too!"  
  - **Is modeling selection optional for Bayesians? Yes.** Nothing in standard Bayesian meta-analysis forces you to account for publication bias. The random-effects model assumes all studies are exchangeable—whether published or not. Weakly informative priors don’t encode selection mechanisms.  
  - **Would a Bayesian modeling selection get it right? Yes—but they rarely do.**  
    - If a Bayesian uses a selection model (e.g., weighting studies by publication probability), they’d estimate μ ≈ 0.  
    - *But this is uncommon:* Selection models are complex, require strong assumptions about unpublished data, and are rarely used in practice. In contrast, p-curve is a "ready-to-deploy" frequentist tool that explicitly conditions on selection.  
  - **The core issue:** Bayesians *can* model selection, but frequentist error-rate methods (like p-curve) *force* you to confront it by design.  

  ---

  ### What Would Change My Mind? The Soft Spots  
  1. **Power of p-curve**: With only 10 studies, p-curve often can’t distinguish flatness from noise. I used 30 studies because p-curve’s flatness test gains power at ~20+ studies. If simulations showed p-curve fails even at n=30, I’d doubt the verdict.  
  2. **Heterogeneity**: I assumed low between-study variance (τ = 0.1). If τ were large (e.g., τ > 0.4), p-curve might falsely infer an effect. But real-world education interventions rarely show such extreme heterogeneity.  
  3. **Alternative explanations**: If all 30 studies were *underpowered* (e.g., n=20 each), p-curve might mistake a small true effect for noise. But with n=80, power is adequate to detect typical effects (d > 0.4).  

  #### Where the Argument Is Most Fragile  
  The weakest point is **p-curve’s calibration under the null**. If the literature included even a few published *negative* results (e.g., due to journals relaxing selectivity), p-curve’s diagnosis could misfire. But in this scenario—where publication bias is absolute—it holds.  

  ---

  ### Final Word: This Isn’t Rigged  
  This case is realistic:  
  - Education/psychology literatures often have inflated effects due to publication bias (e.g., school interventions in Hattie’s work).  
  - p-curve regularly flags such literatures as underpowered or null (e.g., power posing).  
  - Bayesian meta-analyses *without selection adjustments* overestimate effects (e.g., many Cochrane reviews).  

  **If I’m wrong, it’s here**: If Bayesians start routinely modeling selection, the "frequentist saves you" narrative collapses. But today, in practice, error-rate methods like p-curve are the guardrails against publication bias—while Bayesians, without explicit modeling, drive off the cliff.  

  ---  
  **For your column**: This isn’t a takedown of Bayes. It’s a plea for meta-scientists to model selection *whether they’re frequentist or Bayesian*. But until that happens, the grown-up in the room isn’t who we thought.
