  We are constructing a scenario where:
   - We have a literature of small, underpowered studies on an intervention (e.g., a psychological therapy for depression).
   - The true effect is null (δ=0), but due to publication bias, only studies that achieve statistical significance (or at least positive point estimates) are published.
   - We will simulate a set of published studies that would result from such a process.

   Constraints:
   - No fraud or p-hacking: each study is run and analyzed honestly, but unpublished if not significant (or negative).
   - Bayesian analysis: a standard random-effects meta-analysis with weakly informative priors (e.g., normal prior for the overall mean, half-normal for the between-study standard deviation).
   - Frequentist analysis: uses a publication bias correction (we'll choose p-curve because it is widely used and relies on the distribution of p-values).

   The trick: 
   - The Bayesian analysis (without accounting for publication bias) will pool the published studies and conclude a positive effect (with high posterior probability of being positive).
   - The frequentist p-curve analysis (which looks at the distribution of significant p-values) will detect that the pattern of p-values is consistent with a null effect and publication bias.

   How we set it up:

   We assume:
   - True effect δ = 0.
   - Each study has a within-study variance that corresponds to a typical sample size (say, n=40 per group for a two-group comparison, so total n=80). 
     Then, the standard error (SE) for each study (for the standardized mean difference) would be about sqrt(2/40) = sqrt(0.05) ≈ 0.224. 
     So let's set the within-study standard error to be around 0.22.

   - We assume a random-effects model: the true effect in study i is δ_i ~ N(δ, τ^2). We set τ=0.1 (small heterogeneity) or 0.2 (moderate) for illustration.

   - Publication bias: we assume that only studies with a two-sided p-value <= 0.05 (and with a positive point estimate) are published. 
     But note: in practice, non-significant studies might sometimes be published, but we assume they are not.

   - We generate a large number of studies (say, 1000) and then select only the significant ones (with positive effect). We then take the first k published studies (say, k=10) that meet the criteria.

   Why the Bayesian analysis (without selection model) is fooled:
   - It sees a set of studies that are all positive and significant (or mostly positive). The random-effects model will estimate a positive mean effect and the prior is weak so it doesn't pull to zero.

   Why the p-curve analysis saves you:
   - P-curve looks at the distribution of the significant p-values (specifically, the p-values from the significant studies that are <0.05). 
     Under the null, the p-values are uniformly distributed. But if there is a true effect, the p-values are right-skewed (more low p-values). 
     In our case, because the true effect is zero, the significant results are just Type I errors. And the distribution of significant p-values under the null is uniform? 
     Actually, under the null, conditional on being significant (and positive), the p-values are uniformly distributed between 0 and 0.025 (if we consider one-tailed). 
     But p-curve uses two-tailed tests and focuses on the right-skew. However, note: under the null, the p-values conditional on being significant (two-tailed) are uniform between 0 and 0.05? 
     Actually, no: under the null, the two-tailed p-value is uniform, so conditional on p<0.05, it is uniform on [0,0.05]. 
     But p-curve uses the half of the p-value distribution that is in the correct direction? Actually, p-curve for two-tailed tests uses the p-values that are significant and in the same direction. 
     And under the null, the distribution of these p-values (conditional on being significant and positive) is uniform on [0,0.025] (if we consider the one-tailed p-value). 
     However, the p-curve method actually uses the two-tailed p-values and then transforms them? 

     Let me clarify: the p-curve method (for two-tailed tests) uses the p-values from the significant studies (p<0.05) and then considers only the ones in the direction of the effect (so we have a set of p-values between 0 and 0.05). 
     Then, it compares the distribution of these p-values to what would be expected under a null effect (uniform) and under a true effect (right-skewed). 

     In our scenario, because the true effect is zero, the significant positive results are Type I errors, and their two-tailed p-values (conditional on being significant and positive) are uniformly distributed between 0 and 0.05. 
     Therefore, the p-curve will show a flat distribution (which is evidence for no effect) and not right-skewed (which would be evidence for a true effect).

   Steps for the example:

   1. Generate 1000 studies under the null (δ=0) with a random-effects model (τ=0.1). For each study:
        δ_i ~ N(0, τ^2)
        observed effect d_i ~ N(δ_i, σ_i^2)   with σ_i = 0.22 for all (for simplicity)

   2. Select only the studies with d_i > 0 and p-value (two-tailed) < 0.05. 
      How many? With σ_i=0.22, the power for a single study to detect a true effect of 0 is only 5% (the Type I error rate). 
