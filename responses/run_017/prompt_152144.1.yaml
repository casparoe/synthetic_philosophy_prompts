prompt: |-
  I'm a junior majoring in cognitive science, and this semester I'm taking a seminar on predictive processing and active inference. Most of it I can follow at the level of the readings, but I keep getting stuck on the same thing: my professor insists that perception and action are just one minimisation seen from two directions, that everything hinges on how much precision a prediction carries, that expected free energy splits into a pragmatic and an epistemic part, and that the dark room objection is what stops the whole framework from predicting that agents should curl up somewhere unchanging. I believe all of that at arm's length, but I don't know what any of it would look like if you had to do it on purpose, in real time, with another person in the room.

  The reason I want to know is that I've been a peer tutor in our writing center for three semesters and I'm training the new cohort in January. The work is repetitive in a way that a theory ought to help with: forty-five-minute drop-in appointments, six to ten a week, tutees arriving with everything from lab reports to personal statements, no authority over grades, a rule against editing the paper for them, a session note that goes back to the instructor, and end-of-semester evaluations that the center's funding partly depends on. My own instinct right now is to ask what the writer thinks is wrong before I say anything, and roughly half the time I get a shrug. What I'd like from you is a procedure I can actually hand to a new tutor, not a set of principles: the steps in order, what counts as a sufficient answer at each step, where the tutor stops early and hands the session back to the writer, and where the procedure has to stop because the remaining question is one the writer has to answer for themselves. Please keep the theory doing real work in it — how a tutor would read the precision of a writer's expectations in forty-five minutes without any numbers, what the tutor should do differently when a writer's predictions are very confident versus very diffuse, when the right move is to get the writer to change their model versus to send them off to sample the page differently, and how to tell whether a session should be spent reducing uncertainty or just getting the thing finished. But be straight about the places where the translation fails: where precision is a metaphor I can't actually measure, where the story I tell afterwards would fit whatever happened, and which steps are judgment calls wearing a procedure's clothing.

  Then please run it on three cases, in American English, with the reasoning shown rather than skipped. First: a first-year who is completely sure his essay is about ambition in Macbeth and is wrong about that, confidently. Second: a multilingual graduate student who says everything is a problem and is right, in the sense that there are many surface errors and no single one to fix. Third, and this is the one I expect to dislike: a strong senior who books a slot every week with an already polished draft and mostly wants to be told it's fine, who is lovely, who rates me maximally, and who I suspect is using me the way the dark room objection says agents would use a dark room. If your procedure tells me to do something to that third person that will cost me her evaluations and possibly her feelings, say so plainly and tell me why the theory commits me to it — but also tell me where you think the theory is simply the wrong tool, and what a tutor should fall back on there. It needs to be teachable in an hour to someone with no cognitive science, and usable in a room where I can't say any of these words out loud.
reasoning: |-
  We are translating predictive processing (PP) and active inference (AI) into a concrete tutoring procedure for a writing center. The key ideas we need to operationalize:

  1. Perception and action as two sides of minimizing prediction error (free energy). In tutoring, this means that both the tutor's and the writer's actions (like asking questions, revising) and perceptions (interpreting the text, understanding feedback) are aimed at reducing uncertainty (prediction error) about the text's quality and how to improve it.

  2. Precision: the confidence or weight of a prediction. High precision predictions are held firmly; low precision are uncertain. In tutoring, we must gauge the writer's confidence in their own assessments and the tutor's confidence in their feedback.

  3. Expected Free Energy (EFE) splits into pragmatic (goal-directed) and epistemic (uncertainty-reducing) parts. In tutoring, we balance:
     - Pragmatic: getting the writing task done (e.g., meeting a deadline, fixing surface errors).
     - Epistemic: reducing uncertainty about what the writing needs (e.g., clarifying the argument, learning grammar rules).

  4. Dark room objection: agents (writers) might seek to minimize prediction error by avoiding surprises (e.g., avoiding feedback that challenges them, sticking to a safe but suboptimal state). We must avoid enabling this by pushing for exploration and change.

  The tutoring procedure must be a step-by-step guide, with clear steps, decision points, and fallbacks. We cannot use technical terms in the session, so we translate the concepts into everyday actions and questions.

  Procedure: "The Predictive Tutoring Method"

  Goal: To help the writer reduce their uncertainty (prediction error) about their writing while balancing the pragmatic (getting the task done) and epistemic (learning and improving) aspects.

  Steps:

  1. **Establish the Session's Goal (Set the Prior)**
     - Ask: "What would you like to work on today?" or "What are your main concerns about this draft?"
     - Why: This sets the prior expectations (what the writer predicts as problematic). The tutor uses this to gauge the writer's precision (confidence) in their own assessment.
     - Sufficient answer: Any specific goal (e.g., "I'm worried about my thesis") or a general one (e.g., "I don't know if this makes sense"). A shrug requires moving to step 2.
     - If the writer is very confident (high precision) in a narrow goal, we might focus there. If they are uncertain (low precision) or have many issues, we might need to broaden.

  2. **Assess Precision and Scope (Gauge the Writer's Uncertainty)**
     - Observe the writer's confidence. Ask: "How sure are you that [the issue they raised] is the main thing to fix?" or "On a scale of 1-10, how confident are you about [specific aspect]?" (But avoid numbers if it feels unnatural; instead, use: "Is this a big worry or a little one?")
     - Why: We need to know the precision of the writer's predictions. High precision (confidence) in an incorrect model (e.g., misunderstanding the assignment) requires epistemic action (challenging the model). Low precision requires gathering more data (reading, sampling the text).
     - If the writer is highly confident (high precision) but wrong, we must gently challenge (induce prediction error to force model updating). If they are uncertain (low precision), we help sample the text (gather evidence).
     - If the writer shrugs at step 1, we move to step 3 (sampling the text) to gather evidence.

  3. **Sample the Text (Gather Sensory Data)**
     - Ask the writer to read aloud a paragraph they feel is representative, or the introduction, or a section they are unsure about.
     - Why: This provides new sensory input to reduce uncertainty. The tutor and writer both get data to form predictions.
     - After reading, ask: "What stood out to you as you read that?" or "How does that section match what you intended?"
     - Sufficient answer: Any observation. If the writer notices nothing, the tutor can point to one thing (e.g., "I noticed X, what do you think?").

  4. **Identify Mismatches (Prediction Error)**
     - Together, identify where the text does not match the writer's intention or the assignment's requirements.
     - Ask: "Where does this part not do what you want?" or "What part of the assignment does this address?"
     - Why: Prediction errors (mismatches) drive change. The tutor helps the writer see these without fixing them (yet).
     - If the writer cannot identify mismatches, the tutor models: "I noticed that the assignment asks for X, but this section does Y. What do you think?"

  5. **Plan Actions (Active Inference)**
     - Decide together what to do next: revise, research, reorganize, etc.
     - Why: This is active inference — actions are taken to minimize prediction error. The tutor must balance pragmatic (quick fixes) and epistemic (learning) goals.
     - Ask: "What change would bring this closer to what you want?" or "What's the one thing you could do now that would help the most?"
     - Sufficient answer: A concrete step. If the writer is stuck, offer two options (e.g., "We could look at the thesis or at the evidence for this claim. Which feels more pressing?").

  6. **Implement and Test (Minimize Free Energy)**
     - Have the writer try a change (e.g., rewrite a sentence) and then reassess.
     - Ask: "How does that feel now?" or "Does that reduce your concern?"
     - Why: This tests if the action reduced prediction error. If not, we may need to adjust the model (step 4) or gather more data (step 3).

  7. **Set Next Steps (Long-term Minimization)**
     - End by summarizing what was done and what the writer will do next.
     - Why: Prevents dark room behavior (avoiding future sessions or challenges) by setting expectations for continued error minimization.

  Where the Procedure is a Judgment Call:
  - Gauging precision without numbers: We rely on verbal and non-verbal cues (e.g., tone, hesitation). It's a metaphor, but we treat high confidence as a red flag if the text clearly contradicts it.
  - Balancing pragmatic vs. epistemic: If the deadline is near, prioritize pragmatic (fixing surface errors). If there's time, focus on epistemic (deeper learning).
  - Stopping early: If the writer has a clear action plan and the session time is up, stop at step 7. If the writer is overwhelmed, focus on one small win.

  Where the Theory Fails:
  - Precision as metaphor: We can't measure it, but we can use it to remind tutors to challenge overconfidence and support underconfidence.
  - The dark room: Some writers might want reassurance only. The procedure forces us to induce some prediction error (step 4) to avoid enabling avoidance. This might cost evaluations, but it's necessary for real improvement.

  Now, apply to three cases.

  Case 1: First-year student, confident that essay is about ambition in Macbeth, but wrong (e.g., the prompt is about power).

  Procedure:
  1. Goal: "I want to make sure my essay on ambition in Macbeth is strong."
  2. Precision: High (confident). Tutor must challenge the model without confrontation.
     - Tutor: "Great, let's see how your essay addresses the assignment. Can you read the prompt for me?"
  3. Sample: Read the prompt and the essay's thesis.
  4. Mismatch: "I see your thesis is about ambition, but the prompt asks about power. How do you see ambition and power relating?"
     - This induces prediction error: the student expected his thesis to match, but it doesn't.
  5. Plan: "Maybe we should adjust the thesis to show how ambition leads to power? Or is there a way to reframe your points around power?"
  6. Implement: Student revises thesis to include power.
  7. Next steps: "Now, check each paragraph to ensure it ties to power."

  Case 2: Multilingual graduate student, says everything is a problem (many surface errors and structural issues). Low precision (uncertainty) about what to fix.

  Procedure:
  1. Goal: "Everything is wrong; I don't know where to start."
  2. Precision: Very low (diffuse). Tutor must help sample and prioritize.
     - Tutor: "Let's pick one paragraph to focus on. Which one feels most important?"
  3. Sample: Read one paragraph aloud.
  4. Mismatch: Tutor notes one type of error (e.g., article usage) and asks: "Do you notice any patterns in the errors here?" (Epistemic focus: learning the pattern).
  5. Plan: "Let's fix the articles in this paragraph and then look for that pattern in the next one. I'll explain the rule so you can apply it."
  6. Implement: Student corrects one paragraph with tutor's guidance.
  7. Next steps: "For the rest, try applying this rule. You can also use [resource] for practice."

  Case 3: Strong senior with polished drafts, wants reassurance (dark room).

  Procedure:
  1. Goal: "I just want to make sure this is okay." (High precision in the text being good, but seeking no error).
  2. Precision: High in the text, but tutor must induce prediction error to avoid dark room.
     - Tutor: "Great, let's see if we can make it even stronger. What part are you least sure about?"
     - If the writer says nothing: "Let's look at the [specific aspect, e.g., conclusion] to see if it could be sharper."
  3. Sample: Read the conclusion.
  4. Mismatch: Tutor finds a minor point: "This sentence is good, but could it be more direct?" (Induce small error).
  5. Plan: "Try rephrasing this one sentence."
  6. Implement: Student makes a small change.
  7. Next steps: "It's strong, but next time, maybe we can look at [another aspect] to push it further."

  Why we must do this for case 3: The dark room objection says that if we only provide reassurance (minimizing immediate prediction error), the writer doesn't improve and the tutor becomes a "dark room" — a source of no surprises, enabling stagnation. We must induce a small amount of prediction error to promote growth, even if it risks evaluations. However, we do it minimally and positively.

  Where the theory fails: If the writer is truly at a high level and the text is excellent, the tutor might be inducing artificial error. In that case, fall back on pragmatic goals: "Your draft is ready to submit. Let's talk about your next project?" This avoids unnecessary nitpicking.

  Teachability:
  - The procedure is a 7-step flow: Goal → Confidence → Read → Find mismatch → Plan change → Try it → Next steps.
  - In training, role-play the cases. Emphasize that steps 2 (confidence) and 4 (mismatch) are where judgment is key.
  - Do not use PP terms; use "confidence" for precision, "what's not working" for prediction error, "let's try a change" for active inference.

  This procedure makes the theory actionable without jargon.
answer: |-
  Below is a complete, step-by-step tutoring procedure grounded in predictive processing (PP) and active inference (AI) principles. I've designed it as a concrete, teachable script for new writing tutors—no cognitive science jargon needed in the session. The procedure translates PP/AI into observable actions and decisions, with clear steps, exit points, and fallbacks. I'll start with the procedure itself, then apply it to your three cases with reasoning. Finally, I'll flag where the theory struggles or requires judgment.

  ### Core Theory Translation for Tutors
  - **Perception-action as minimization**: Tutoring is about reducing "mismatches" (prediction errors) between the writer's expectations and the text/reality. Perception = noticing mismatches (e.g., "This paragraph doesn't match your goal"). Action = revising to fix them. They're two sides of the same coin: you minimize error by either updating your "model" (perception) or changing the "world" (action, like rewriting).
  - **Precision**: This is the writer's **confidence in their expectations**. High precision = overconfident (e.g., "I know this is perfect"). Low precision = underconfident (e.g., "I don't know what's wrong"). Tutors gauge this through questions and adjust their approach: challenge high precision, support low precision.
  - **Pragmatic vs. epistemic**: Pragmatic = "getting it done" (e.g., fixing surface errors for a deadline). Epistemic = "reducing uncertainty" (e.g., teaching why a thesis is weak). Tutors decide which dominates based on time, the writer's goals, and precision.
  - **Dark room objection**: Writers might seek to avoid "surprises" (prediction errors) by sticking to safe, unchanging states (e.g., only seeking praise). Tutors must gently induce mismatches to prevent stagnation, even if it risks comfort.
  - **Key PP in tutoring**: 
    - Writers are "agents" minimizing their prediction errors. Tutors help by making errors visible and guiding actions (e.g., revisions) to resolve them.
    - Precision determines how much "force" is needed to induce error (high precision = more challenge).
    - **Session flow**: Sample the text (gather data) → Identify mismatches (prediction errors) → Take action (revise to resolve errors) → Repeat.

  ---

  ### The Procedure: "Mismatch Reduction Method" 
  **Teach this to new tutors in 1 hour**: Focus on the steps, not theory. Use role-playing for practice.  
  **45-minute structure**: 5 min setup, 25 min core work, 10 min action plan, 5 min wrap-up.  
  **No jargon in session**: Use plain terms like "confidence," "mismatch," or "fix."  

  #### Step 1: Set the Goal (2–3 min)  
  **Tutor asks**: "What do you want to focus on today?" or "What’s one thing you’re unsure about?"  
  **Why (PP)**: Establishes the writer’s prior expectations. You’re probing their initial "model" of the problem.  
  **Sufficient answer**: Any specific goal (e.g., "Fix my thesis") or even "I don’t know." A shrug is acceptable—move to Step 2.  
  **Low precision cue**: Writer says "Everything's wrong" or shrugs.  
  **High precision cue**: Writer states a narrow, confident goal (e.g., "Just check my grammar").  
  **Exit early?** If the writer has a clear, urgent request (e.g., "Help me format citations"), skip to pragmatic action in Step 4.  

  #### Step 2: Gauge Confidence (Precision) (1–2 min)  
  **Tutor asks**:  
  - If goal is specific: "How confident are you about [goal]? High, medium, low?" (Or use a 1–5 scale if natural).  
  - If writer shrugged or is vague: "What part of the paper feels most solid to you?"  
  **Why (PP)**: Measures precision of expectations. High precision means the writer won’t update their model easily—you’ll need strong evidence. Low precision means they’re open to change but may need scaffolding.  
  **Sufficient answer**: Any self-assessment (e.g., "High confidence" or "I hate my intro").  
  **What to do next**:  
  - **High precision**: Prepare to challenge gently with evidence (Step 3).  
  - **Low precision**: Prioritize quick wins to build confidence.  
  **Judgment call**: Precision is a metaphor—you’re inferring from tone, hesitation, or certainty. If unclear, default to low precision.  

  #### Step 3: Sample and Compare (Gather Data) (10–15 min)  
  **Tutor says**: "Let’s look at a section together. Can you read [specific part] aloud? As you read, tell me where it matches or doesn’t match what you wanted."  
  - **Pick the section**:  
    - If goal is specific (e.g., thesis), start there.  
    - If writer shrugged, start with the intro or a random paragraph.  
  **Why (PP)**: Reading aloud generates sensory data. Comparing intent vs. text reveals prediction errors ("mismatches"). This is perception—updating the model.  
  **Sufficient answer**: Writer identifies at least one mismatch (e.g., "This sounds confusing"). If they can’t, tutor models: "I noticed X here—what do you think?"  
  **Adjust for precision**:  
  - **High precision**: Ask writer to read the **assignment prompt aloud**, then compare it to their text. Forces external evidence.  
  - **Low precision**: Focus on a **small, concrete passage** (e.g., one paragraph). Reduces overwhelm.  
  **Exit early?** If writer finds multiple mismatches quickly, jump to Step 4.  

  #### Step 4: Identify Top Mismatch (Prediction Error) (3–5 min)  
  **Tutor asks**: "Of what we noticed, what’s the biggest mismatch? What feels most important to fix?"  
  **Why (PP)**: Isolates the prediction error with the highest "surprise" (free energy). This prioritizes action.  
  **Sufficient answer**: Writer chooses one issue (e.g., "My thesis doesn’t match the prompt"). If they can’t decide, tutor picks the most consequential error (e.g., thesis over grammar).  
  **Pragmatic vs. epistemic decision**:  
  - **Pragmatic (get it done)**: If deadline is tight (<24 hours), writer is overwhelmed, or error is surface-level (e.g., typos). Fix it fast.  
  - **Epistemic (reduce uncertainty)**: If time allows, writer wants to learn, or error is conceptual (e.g., weak argument). Teach why it’s wrong.  
  **Judgment call**: Use writer’s cues—e.g., "I just need to pass" → pragmatic; "I want to improve" → epistemic.  

  #### Step 5: Action Plan (Minimize Error) (10–15 min)  
  **Tutor says**: "Let’s try one change to fix this mismatch. What could you do?"  
  - **Writer proposes action** (e.g., rewrite a sentence).  
  - **If stuck, tutor offers 2 options**: One pragmatic (quick fix), one epistemic (learning-focused).  
  **Why (PP)**: Action (revision) minimizes prediction error by changing the "world" (the text). This is active inference.  
  **Sufficient action**: Writer makes an observable change (e.g., crosses out words, writes new ones).  
  **Adjust for precision**:  
  - **High precision**: Ask writer to **test their belief** (e.g., "Try reading your thesis next to the prompt—does it still feel right?"). Induces error to update model.  
  - **Low precision**: **Scaffold small steps** (e.g., "Add one transition here"). Builds confidence.  
  **Stop early?** If time runs out or writer resists action, skip to Step 6.  

  #### Step 6: Test and Reflect (3–5 min)  
  **Tutor asks**: "After that change, how does it feel now? Does it reduce the mismatch?"  
  **Why (PP)**: Tests if action minimized error. If not, loop back to Step 3 (gather more data) or Step 4 (new error).  
  **Sufficient answer**: Writer assesses the change (e.g., "Better" or "Still unsure").  
  **Dark room prevention**: If writer only wants praise, ask: "What’s one way this could be even stronger?" (Induces small error).  

  #### Step 7: Next Steps (Wrap-up) (3–5 min)  
  **Tutor summarizes**: "Today we fixed [mismatch]. For next time, try [action]."  
  **Why (PP)**: Sets expectations for ongoing error minimization, avoiding complacency (dark room).  
  **Always end with**: "What’s one thing you’ll do before submitting?" (Ensures writer takes ownership).  

  ---

  ### Where Theory Does (and Doesn’t) Work  
  - **Doing real work**:  
    - Precision gauged through questions (Step 2) tells tutors when to push (high) or support (low).  
    - Sampling text (Step 3) forces data gathering for epistemic needs; action (Step 5) addresses pragmatic needs.  
    - Dark room is countered by inducing small mismatches (Step 6), preventing avoidance.  
  - **Limitations**:  
    - **Precision is unmeasurable**: You infer confidence from cues (e.g., tone), but it’s subjective. Fall back to: "If writer seems stuck, assume low confidence."  
    - **Story fits anything**: PP is descriptive—it explains after the fact. To avoid self-fulfilling prophecies, stick to the steps rigidly. If a session fails, ask: "Did I miss a mismatch?"  
    - **Judgment calls**: Balancing pragmatic/epistemic (Step 4) and picking mismatches (Step 4) are inherently subjective. Procedure masks this with "rules" (e.g., "If deadline near, pick pragmatic").  
    - **When theory fails**:  
      - For writers with trauma/anxiety, inducing errors may backfire. Fall back to empathy: "What feels safe to tackle?"  
      - If the text is truly excellent, PP might "find" trivial errors. Use commonsense: Praise genuinely, then shift to "What’s next?"  

  ---

  ### Case Applications  
  **Rules for tutors**:  
  - Never say "precision" or "prediction error"—use "confidence" or "mismatch."  
  - Always let the writer hold the pen/mouse.  
  - Session notes should reflect mismatches and actions (e.g., "Writer identified thesis-prompt mismatch; revised thesis").  

  #### Case 1: First-year student, confident essay is about ambition in Macbeth (but wrong).  
  **Why PP matters**: High precision in a flawed model—you must induce prediction error without confrontation.  
  **Session flow**:  
  1. **Goal**: "I want my essay on ambition in Macbeth to be stronger." (High precision—narrow, confident goal).  
  2. **Confidence**: Tutor asks: "How confident are you that ambition is the focus?" Writer: "Very! It’s obvious." (High precision confirmed).  
  3. **Sample and Compare**: Tutor says: "Let’s check the assignment together. Read the prompt aloud." Writer reads: "Analyze Macbeth’s pursuit of power." Then, writer reads their thesis: "Macbeth’s ambition causes his downfall."  
  4. **Top Mismatch**: Tutor asks: "Where do you see a mismatch here?" Writer pauses. Tutor models: "I notice the prompt says 'power,' but your thesis says 'ambition.' How are they related?" (Induces error—writer expected match, found surprise). Writer: "Oh... maybe I missed something?"  
  5. **Action Plan**: Tutor (epistemic focus—time allows): "Let’s reduce uncertainty. Try rewriting your thesis to include 'power.' What’s one way to connect them?" Writer drafts: "Macbeth’s ambition for power leads to his downfall."  
  6. **Test**: Writer: "This feels better—I see the mismatch now."  
  7. **Next Steps**: "Before submitting, check if other paragraphs tie to power, not just ambition."  
  **Reasoning**: Precision was high, so tutor used external evidence (prompt) to create prediction error. No need to "prove" writer was wrong—the mismatch did the work.  

  #### Case 2: Multilingual grad student, "everything is a problem" (many surface errors, low precision).  
  **Why PP matters**: Low precision (diffuse uncertainty)—you need to sample data and scaffold small actions to build confidence.  
  **Session flow**:  
  1. **Goal**: "Everything is wrong—I don’t know where to start!" (Low precision—vague, overwhelmed).  
  2. **Confidence**: Tutor asks: "What part feels least broken?" Writer: "Maybe paragraph 3?" (Low confidence in priorities).  
  3. **Sample and Compare**: Tutor: "Read paragraph 3 aloud. Tell me one thing that doesn’t match what you meant." Writer reads, notices awkward phrasing.  
  4. **Top Mismatch**: Tutor: "You found a phrasing issue. Is that the biggest mismatch here, or is there another?" Writer: "Yes, and the grammar feels off." Tutor pragmatically prioritizes: "Grammar affects clarity—let’s start there since your deadline is close."  
  5. **Action Plan**: Tutor: "Pick one sentence with grammar issues. What’s a small fix?" Writer struggles. Tutor offers options: "We could fix verb tense (pragmatic) or I can explain tense rules (epistemic). What helps most?" Writer chooses pragmatic. Writer corrects one sentence.  
  6. **Test**: Writer: "Better, but I’m still nervous." Tutor: "That’s normal. Now you know how to fix one thing."  
  7. **Next Steps**: "Try fixing verbs in 2 more paragraphs. Use [grammar resource] for uncertainty."  
  **Reasoning**: Low precision meant sampling a small section (Step 3) and starting pragmatic (Step 5) to reduce overwhelm. Writer’s "everything is wrong" signaled high free energy—small actions minimize it.  

  #### Case 3: Strong senior, polished drafts, wants reassurance (dark room risk).  
  **Why PP matters**: Writer seeks to minimize prediction error (avoid surprises) by staying in a "dark room" of praise. PP commits you to induce a small error to prevent stagnation—even if it risks evaluations.  
  **Session flow**:  
  1. **Goal**: "I just need a last look—it’s probably fine." (High precision in perfection).  
  2. **Confidence**: Tutor asks: "How confident are you that it’s ready?" Writer: "10/10—I’ve polished it for weeks."  
  3. **Sample and Compare**: Tutor: "Read your conclusion aloud. As you do, see if it matches your ideal." Writer reads flawlessly.  
  4. **Top Mismatch**: Tutor must induce error: "It’s strong! But I wonder if the final line could be sharper. What do you think?" (Uses "I wonder" to soften challenge). Writer: "Hmm, maybe? I like it though."  
  5. **Action Plan**: Tutor (epistemic nudge): "Try tweaking one word for impact—even as an experiment. What’s a bolder verb?" Writer reluctantly changes "shows" to "demonstrates."  
  6. **Test**: Writer: "Okay, it’s a bit stronger."  
  7. **Next Steps**: "Next week, let’s push one section further. For now, submit with confidence!"  
  **Why theory commits you to this**: The dark room objection says agents (writers) will curl up in error-free states if unchecked. This writer is using sessions to avoid growth (seeking "no surprise" praise). Inducing a tiny mismatch (Step 4) forces model-updating, preventing dependency.  
  **Risk**: Writer might dislike not being called "perfect." Evaluations could drop—but this is ethically necessary for real tutoring.  
  **Where theory fails**: If the draft is truly flawless (rare), nitpicking harms rapport. Fall back: Praise genuinely, then pivot to future work ("What’s your next project? Let’s brainstorm").  

  ---

  ### Final Tutor Cheat Sheet  
  **Print this for new tutors**:  
  1. **Ask**: "What’s your goal?" → Shrug? Move on.  
  2. **Gauge confidence**: "Rate your confidence in that." High? Be ready to challenge. Low? Support.  
  3. **Sample text**: "Read a section aloud. Where does it not match your intent?"  
  4. **Pick one mismatch**: "What’s the biggest fix needed?" Urgent deadline? Go pragmatic (quick fix). Time? Go epistemic (teach).  
  5. **Act**: "Try one change." High confidence? Make them test their view. Low? Suggest small steps.  
  6. **Test**: "How did that feel?" Still unsure? Re-sample.  
  7. **Next**: "What will you do next?" Always end with writer’s action.  

  **Dark room rule**: If a writer always wants praise, find one tiny improvement ("Could this word be stronger?"). It’s kinder long-term.  
  **When stuck**: "Let’s look at the assignment/rubric together." (External data resolves uncertainty).  

  This procedure makes PP actionable without theory. It works because it forces writers to confront mismatches (error minimization), uses precision to tailor responses, and balances getting-it-done with growth. And yes—for your lovely senior, you must gently challenge her, or you’re just a "dark room" supplier. But do it kindly: "I know this is great, but let’s make it unforgettable." Most writers rise to it.
