prompt: |-
  I'm a couple years into a philosophy PhD and I keep bumping into the same knot of practices, and I want someone to lay out what they actually commit us to.

  The pattern: our handbook requires a dissertation to contain an "original contribution to knowledge". Referee reports reject papers for being unoriginal — the point's already in the literature, we've known that since forever, nothing new here. So novelty is mandatory and re-saying is worthless. But at the same time there are almost no graduate-level textbooks, seminars assign the same primary texts that were being assigned decades ago, nobody can hand you a list of results the field has settled, and the line we give undergrads (and half beleive ourselves) is that the big questions are as open as ever and that what philosophy does is clarify them rather than solve them. Then there's citation practice: a philosophy paper will argue with two or three interlocutors and cite essentially nobody else, even though the whole idea of a novelty requirement is that there's a stock of stuff already said that you're supposed to be adding to.

  So: what theory of progress does that bundle presuppose? Is it one theory, or two that don't fit together? Please split progress up instead of treating it as a single thing — something like convergence on verdicts; permanent elimination of positions (an argument kills a view and it stays dead, instead of coming back twenty years later under a new name); questions and distinctions getting better articulated so they become permanent tools everyone uses; and new formal or conceptual machinery. Which of those does the novelty requirement actually need? Which does the no-textbooks-and-same-old-reading-lists part rule out? Can someone who thinks philosophy only progresses in the last two senses still make sense of rejecting a paper for being unoriginal?

  I also want the underdetermination bit: which of these practices would several rival theories of progress license equally well, and which strictly commit us to something? And then the counterfactual: if we really believed the strong accumulation picture — a standing stock of results that grows, refutations that are permanent and on record — what would have to change? I'm imagining something like a canonical registry of dead positions, so a referee can just write "this is entry #47, denied", real graduate textbooks layered over the primary texts, and a norm of citing everything relevant rather than only your sparring partners. Is that what the picture implies, or does the picture survive without any of that? And if we went the other way and embraced no-progress-except-clarification, does the original-contribution requirement collapse, or does it survive as something thinner, like a requirement of original formulation?
reasoning: |-
  Okay, let me try to unpack this philosophy PhD student's query. They're grappling with contradictions in academic philosophy practices: dissertations require original contributions, yet seminars use the same primary texts for decades, there are few graduate textbooks, and the field claims big questions remain open. Citation practices focus on a few interlocutors rather than engaging the entire literature. The user wants to understand what theory of progress these practices presuppose, how coherent it is, and what changes different theories would imply.

  First, I need to address the tension between novelty and the lack of cumulative knowledge structures. The user mentions several types of progress: convergence on verdicts, elimination of positions, better articulation of questions, and new formal tools. I should map which practices align with which progress types. The novelty requirement seems tied to adding something new, but without settled results, it's unclear what counts as genuinely new versus restating old ideas.

  The citation norm puzzles me. If originality matters, why cite only a few interlocutors? Maybe it's about engaging in specific debates rather than surveying all literature. But that doesn't explain why referees reject papers for unoriginality without referencing prior work. The user suspects a disconnect here—does the discipline implicitly rely on a stock of knowledge that isn't formally maintained?

  I recall philosophical discussions about progress. Some argue philosophy makes progress through conceptual clarification rather than empirical discoveries. Others suggest that core problems persist because they're perennial. But how does that justify rejecting unoriginal work? If the big questions remain open, each generation might need to rehash arguments, yet the system penalizes that.

  The user asks about underdetermination: which practices could fit multiple progress theories? Minimal citation might fit both a clarificatory model (only immediate influences matter) and a cumulative one (but inefficiently). The original contribution requirement could be thin (new phrasing) or thick (substantive advance). 

  For counterfactuals, if philosophy adopted strong accumulation, we'd need registries of refuted positions, comprehensive literature reviews, and textbooks synthesizing results. Without those, the current practices seem inconsistent. If they embraced only clarificatory progress, originality might mean novel articulation or framing, not new solutions. But would that satisfy the dissertation requirement? Maybe, but it might feel like a hollow exercise.

  I wonder if the user's frustration stems from the field's lack of explicit methodology. Practices evolved without a coherent theory of progress, leading to contradictions. The referee rejecting a paper as unoriginal assumes a shared knowledge base that isn't documented, relying on referees' expertise. But that's fragile and inconsistent.

  The deeper issue might be philosophy's identity crisis. If it's not a knowledge-accumulating discipline, why demand original contributions? If it is, why no textbooks? The user wants to know whether the practices commit to specific progress theories or if they're just unexamined habits. I think they're pointing out that current norms imply a cumulative model but lack the infrastructure, causing tension for grad students trying to navigate originality.
answer: |-
  Here's a breakdown of the tensions in your discipline's practices and the implicit theories of progress (or lack thereof) they presuppose, along with analyses of underdetermination and counterfactuals:

  **Deconstructing the Bundle of Practices & Their Implicit Commitments:**

  1.  **Novelty Requirement (Dissertation/Paper):**
      *   **Commitment:** *Some* kind of addition is necessary. Philosophy isn't *just* exegesis or teaching; it aims to move beyond the existing state of understanding.
      *   **Implied Theory of Progress:** Requires progress primarily in terms of **New Formal/Conceptual Machinery** and/or **Better Articulated Questions/Distinctions**. It *can* accommodate **Convergence on Verdicts** or **Elimination of Positions**, but doesn't *require* them to be permanent. The minimal requirement is "something not explicitly/sufficiently said/developed before in *this specific way/context*."
      *   **What it Rules Out:** Pure historical scholarship without contemporary argumentative contribution; restating well-known arguments without novel framing, connection, or development. It *does not* inherently require permanent solutions or settled knowledge.

  2.  **No Graduate Textbooks/Same Primary Texts:**
      *   **Commitment:** The foundational problems and arguments remain live and contested. Mastery requires direct engagement with original sources, not synthesized "results." Later developments haven't rendered the classics obsolete or merely historical.
      *   **Implied Theory of Progress:** Strongly suggests progress is *not* primarily **Convergence on Verdicts** or **Permanent Elimination of Positions**. If these existed robustly, textbooks summarizing settled findings *would* exist. It strongly favors progress as **Better Articulated Questions/Distinctions** and **New Formal/Conceptual Machinery** (tools used to re-engage the classics). It implies perennial questions are constantly re-evaluated with new tools/perspectives.
      *   **What it Rules Out:** A strong cumulative "standing stock of settled results" model. It suggests refutations are rarely permanent ("stays dead") and positions often resurface.

  3.  **Citation Practice (Sparse, Focused Interlocutors):**
      *   **Commitment:** Philosophy progresses through focused dialectical engagement. The relevant "state of the art" for *this specific argument* is defined by a handful of key contemporary or recent positions directly engaging the same narrow point. Exhaustive historiography isn't the primary goal of argumentative papers.
      *   **Implied Theory of Progress:** Compatible with all types *except* a strong **Convergence on Verdicts/Permanent Elimination** model *that requires comprehensive referencing of settled knowledge*. It fits best with the **Clarification/Tool Development** model, where the immediate dialectical context is paramount. It *assumes* (often problematically) that the key relevant voices are known/cited, and that the referee/reader possesses sufficient background knowledge of the broader field to judge novelty *within that dialectic*.
      *   **What it Challenges:** The idea that novelty is judged against a *comprehensive, codified* "stock of stuff already said." Novelty is judged against a *contextually defined* slice of the literature deemed relevant to the specific argument.

  **The Core Tension:**

  *   **Novelty Requirement:** Implies *addition* to an existing body (however loosely defined).
  *   **Lack of Codification (Textbooks/Settled Results):** Implies the "existing body" isn't a settled stock of *solutions/verdicts*, but rather a shifting landscape of *problems, arguments, tools, and distinctions*.
  *   **Sparse Citation:** Works *if* the relevant "addition" is judged within a narrow, contemporary dialectical frame, but *fails* if novelty is meant to be judged against the entire historical corpus. This is where referee rejections for unoriginality often feel arbitrary – the referee knows some obscure paper from 1973 that made a similar point, but the author had no way of knowing to cite it, and there's no central repository to check.

  **Underdetermination: Which Practices Fit Multiple Theories?**

  1.  **Sparse Citation:** Can fit:
      *   **Clarification/Tool Model:** Focus on immediate dialectical opponents is sufficient for the argument.
      *   **Weak Cumulative Model:** Assumes a specialist community shares enough background knowledge; citing everything is impractical/pointless noise. (Though this strains credibility).
      *   **No Progress Model (if one existed):** Even arguing with contemporaries requires citing them.
      *   **Does NOT fit well with Strong Cumulative Model:** Which would demand comprehensive citation of relevant prior results/settlements.

  2.  **Original Contribution Requirement (thin version):** Can fit:
      *   **Clarification/Tool Model:** Novel articulation, framing, application of a tool, or distinction *is* the contribution.
      *   **Convergence/Elimination Model:** A genuinely new argument or piece of evidence.
      *   **Strong Cumulative Model:** Adding a new brick to the edifice.
      *   **Does NOT fit a pure "No Progress" Model.**

  **Making Sense of Rejecting Unoriginality within Clarification/Tool Progress:**

  *   **Yes, it's possible.** Even if philosophy only progresses by clarifying questions and developing tools, "unoriginal" can mean:
      *   **Failed Clarification:** The articulation is muddled, rehashes existing distinctions without improvement, or misrepresents the problem/tools.
      *   **Lack of Novel Tool Application:** Simply reapplying a well-established tool to a well-established problem without new insight or development of the tool itself.
      *   **Redundant Framing:** Presenting an argument or problem in a way already thoroughly explored and documented within the relevant subfield, without adding new perspective or depth.
      *   The referee is saying: "This specific *way* of clarifying or using this tool *has already been done adequately* in the literature relevant to this discussion. You haven't moved the conversation forward *in this specific dialectical space*."

  **Counterfactual 1: Embracing Strong Accumulation (Standing Stock of Results)**

  *   **What Would Change:**
      *   **Graduate Textbooks:** Would be abundant and essential, summarizing settled results, core arguments, and definitively refuted positions within subfields.
      *   **Canonical Registries:** Something like a SEP-like authority, but with formalized "settled verdicts" sections and "refuted position" archives (#47: Logical Behaviorism - refuted by Ch. 3, Kripke 1972; Ch. 5, Putnam 1975). Journals might maintain "definitive refutation" lists.
      *   **Citation Practice:** Would shift dramatically towards comprehensive citation of *all* relevant prior results and refutations. Papers would need to explicitly position themselves within the codified structure ("Building on Settled Result SR-42...", "This challenges Provisional Verdict PV-18...", "Addressing Gap G-7 identified in Textbook T...").
      *   **Dissertation Novelty:** Could be a genuinely new *result* (proving a theorem, establishing a new necessary connection) or plugging a recognized gap in the edifice. Novel framing alone might be insufficient.
      *   **Seminars:** Would likely include significant chunks of textbooks/handbook chapters *alongside* primary sources, focusing on how the primary sources contributed to (or were superseded by) the settled stock. Some classics might become purely historical.
      *   **Referee Reports:** Could indeed state "This is Position #47, refuted by Arguments A, B, and C in Registry R. Novelty denied." or "This result was established by Author X in Paper Y, see Textbook Z, p. N."

  *   **Could the Picture Survive Without These? No, not robustly.** The practices you describe (no textbooks, same texts, sparse citation) are fundamentally *incompatible* with a genuine strong accumulation model. The lack of codification *is* the evidence against it. The sparse citation norm *presupposes* the irrelevance or non-existence of a comprehensive, authoritative record.

  **Counterfactual 2: Embracing Pure Clarification/Articulation Progress**

  *   **Would Original Contribution Collapse? No, but it would transform.**
  *   **What Would Happen:**
      *   **Original Contribution Requirement Survives (Thinner):** The requirement becomes focused on **Original Formulation, Framing, or Articulation**. The contribution is making an argument *clearer*, drawing a *sharper* distinction, applying an existing tool in a *novelly illuminating way* to a problem, or developing a *new conceptual tool* for tackling persistent questions. "We've known that since forever" becomes "This articulation doesn't improve upon existing formulations X, Y, Z."
      *   **Novelty Rejection:** Makes perfect sense: "This articulation adds no clarity beyond what's already achieved in [Cited Works]"; "This framing is identical to the one used by [Author] in [Work]."
      *   **Textbooks/Lists:** Might become *more* feasible, but they would look different: "Compendia of Arguments & Distinctions," "Taxonomies of Positions and Tools," "Histories of Conceptual Refinement." They wouldn't list "settled results" but "well-established distinctions," "influential frameworks," "enduring puzzles." Think advanced, domain-specific versions of the Stanford Encyclopedia of Philosophy.
      *   **Citation Practice:** Might become *more* comprehensive historically within subfields, as tracing the lineage of a distinction or articulation becomes crucial for demonstrating genuine novelty in clarification. "This distinction builds on Author A's D1, but refines it by incorporating aspect B from Author C, resolving ambiguity D noted by Author E..."
      *   **Seminars:** Would still focus on primary texts, but explicitly as sources of enduring questions and exemplars of articulation/clarification, constantly re-engaged with new perspectives. The point isn't to find the "answer" in Plato, but to see how he framed the problem and what tools he used, and how we can do better now.
      *   **"Big Questions Open":** This becomes the central tenet, not a half-believed line. Progress *is* the increasingly sophisticated articulation and clarification of these enduring questions.

  **Conclusion: The Dominant Implicit Theory**

  The bundle of practices points most consistently towards a theory of progress centered on **Better Articulated Questions/Distinctions** and **New Formal/Conceptual Machinery**. Progress happens by developing sharper tools and clearer frameworks to engage with persistent, fundamental questions. Novelty is making a *genuine step* in this ongoing process of clarification and tool development within a specific dialectical context.

  *   **The tension arises because:** The language of "original contribution to *knowledge*" and "we've known that" subtly borrows from stronger cumulative models (like science) that don't truly fit. The sparse citation practice is a pragmatic, albeit flawed, adaptation to the lack of codification *required* by the dominant clarificatory model. Referees rejecting for unoriginality are applying a context-specific judgment ("this doesn't add anything *new* to *this specific conversation* we're having now, given the tools and distinctions we currently use"), but phrasing it in ways that sound like appeals to settled knowledge precisely because the field lacks a robust, shared vocabulary and infrastructure for its *own* type of progress.

  The system isn't perfectly coherent, but it *functions* (albeit messily) under the clarificatory/tool-development model. Embracing this explicitly would resolve much of the cognitive dissonance, reframe expectations around novelty, and potentially lead to more useful infrastructure (like better argument/distinction compendia). The strong accumulation model is largely illusory within mainstream academic philosophy as currently practiced.
