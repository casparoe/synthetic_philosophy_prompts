  - Step 2: Now, using φ1, we prove that there is a proof of φ2 (in T). Then we apply degraded reflection to φ2: but note that the proof of φ2 depends on φ1, which was established with reflection. So the proof of φ2 is not a proof in T alone, but in T plus the reflection rule? This is a problem.

  The agent is building a proof that uses the reflection rule. So the proof of φ2 is only valid if the reflection rule is valid. But the reflection rule is not part of T. So the agent is effectively working in an extension of T.

  In the scheme, the agent is allowed to use the degraded reflection rule conditionally on the budget. So the entire proof is in the system T+ (which is T plus the degraded reflection rule). But then, when we say that the agent has a proof of φ2, it is a proof in T+. But the degraded reflection rule for φ2 requires a proof of φ2 in T. But the agent only has a proof in T+. So it cannot use the degraded reflection rule on φ2 because it doesn't have a T-proof of φ2.

  This is a critical point: the degraded reflection rule is defined as: if you have a T-proof of φ, then you can assert φ with confidence 1-ε. But the agent's own reasoning is not in T; it is in T+. So when the agent proves something by T+ methods, it does not have a T-proof. Therefore, it cannot use the degraded reflection rule on statements that it proved using the reflection rule.

