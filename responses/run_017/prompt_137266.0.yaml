  Recall: Con_T is equivalent to "if Provable_T(⊥) then false", i.e., not Provable_T(⊥).

  Now, within T, we can prove that if T is inconsistent, then T proves everything. In particular, T proves: Provable_T(⊥) → Provable_T(Con_T). Because if T is inconsistent, then it proves everything.

  But now, suppose the agent uses the degraded reflection rule on Con_T. That is, it wants to use:

    If I can prove Provable_T(Con_T), then I can infer Con_T with confidence 1-ε.

  But can the agent prove Provable_T(Con_T)? Not in T, because if T is consistent, then T does not prove Con_T, so Provable_T(Con_T) is false. And T cannot prove a false statement. But if T is inconsistent, then T proves everything, including Provable_T(Con_T). But then the agent would use the rule to get Con_T with confidence 1-ε, but in an inconsistent T, Con_T is false. So the rule would be giving a false confidence.

