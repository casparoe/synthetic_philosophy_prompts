  To get from Provable_T(φ2) to φ2, the agent would need to use reflection again. But that would be a second reflection step. However, the reflection rule is exactly what we are degrading. So the agent could have a rule that says: from Provable_T(φ2) we can get φ2 with confidence 1-ε2. But note: this is exactly the reflection rule that we are degrading. So the agent can use the degraded reflection rule on the statement φ2, but only if it has a T-proof of φ2. But it doesn't. It has a T-proof of Provable_T(φ2). So we need a rule that acts on Provable_T(φ2). That is, we need a degraded version of the reflection rule for the provability predicate.

