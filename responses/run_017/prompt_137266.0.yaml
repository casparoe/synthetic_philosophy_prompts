  But what if the agent uses multiple such steps? Suppose we have:
  Step 1: Prove φ1 by degraded reflection: confidence 1-ε1.
  Step 2: From φ1, prove φ2 by ordinary deduction: confidence 1-ε1 (since φ2 follows from φ1).
  Step 3: Now, use φ2 to prove φ3 by ordinary deduction: confidence 1-ε1.
