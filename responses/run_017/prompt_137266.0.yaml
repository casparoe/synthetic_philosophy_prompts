  But the agent must plan for the entire chain. However, the agent does not know how long the chain will be. It might be arbitrarily long. Then, no matter how small the discounts, if the chain is long enough, the accumulated error might exceed the budget.

  The defender would say: the agent only needs to ensure that the chain of actions it is about to take fits within the budget. But if the chain is unbounded, then the agent cannot do it.

  Moreover, the agent might be designed to run indefinitely. Then, the budget must be infinite? But the budget is fixed and finite. So the agent can only do a finite number of reflection steps in its entire lifetime. Therefore, it cannot use reflection infinitely often. This is a hard limit.

  So for an agent that must make decisions indefinitely, it can only use reflection a finite number of times. After that, it must work without reflection. That might be acceptable if the agent can learn or if most of its work is done without reflection. But then, the initial reflection steps are used to set up a system that can run without reflection.

  But the agent must have a way to reason about its own future without-reflection reasoning. And that might be possible.

  ### Attack 5: The Conversion from Proof Bounds to Outcome Bounds

  The scheme attaches a probability to a logical statement. But logical statements are either true or false. So the probability is not frequentist; it is a measure of confidence. But then, what does it mean to say that the confidence is 1-ε? And how does that translate to outcomes?

  In particular, the agent is going to take actions based on these confidence levels. But the actions have real-world consequences. The guarantee we have is that for any particular derivation, the probability (confidence) that the conclusion is true is at least 1-b. But if the agent uses many such derivations, then the probability that at least one of them is wrong might be high.

  For example, if the agent makes k independent derivations, each with confidence 1-ε_i, and the sum of ε_i <= b, then by the union bound, the probability that all are correct is at least 1-b. But this is only if the errors are independent. They are not: if the system T is unsound in a systematic way, then many statements might be false together.

  Moreover, the agent's entire reasoning might be flawed if T is inconsistent. Then every confidence is misplaced.

  But even if T is consistent, the errors might be correlated. For example, if the agent uses reflection to prove a statement φ and then uses φ to prove many other statements, then if φ is false, all those statements might be wrong.

  So the confidence in individual steps does not directly translate to confidence in the entire plan.

  ### What Would a Defender Concede?

  A defender of the budgeting view might concede:

  - The scheme does extend T with a new rule, so the agent's reasoning is not entirely within T.
  - The numbers (the error budget and discounts) are set arbitrarily and are not grounded in empirical data.
  - The scheme does not allow for an infinite number of reflection steps, which might be a limitation for an indefinitely running agent.

  But they might argue that the extension is conservative and that the numbers are a practical way to manage risk.

  ### Worked Example

  Let's try a small example. Suppose T is PA (Peano Arithmetic). The agent wants to use reflection to prove a statement φ that is not provable in T alone. For example, let φ be Con(PA).

  The agent cannot prove Con(PA) in T. But it can prove in T that if T is consistent, then Con(PA) is true. But that doesn't help.

  With the degraded reflection rule, the agent might try:

  Step 1: Prove in T: Provable_T(Con(PA)) → Con(PA). [This is an instance of reflection, and by Löb's theorem, T does not prove this unless T proves Con(PA), which it doesn't.]

