  Therefore, the agent can only use the degraded reflection rule on statements that are proven without any use of the reflection rule. That is, only at the "base level" on T-theorems. Then, if the agent wants to use reflection again, it must prove the next statement entirely within T, without using any reflection-derived statements. But that might not be possible.

