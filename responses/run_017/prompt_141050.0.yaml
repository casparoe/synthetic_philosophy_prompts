prompt: |-
  Hey — I've got a fifty-minute tutorial on Tuesday, first-years, intro metaphysics, and the topic is endurantism vs perdurantism. I've run it twice and both times it died the same death: everyone walks out able to say "perdurantism is the worm view" and nobody can say what would make anyone *reject* it. So don't explain the debate to me, I know it — plan the session. What has to be on the board before either view is even statable, and in what order (what depends on what)? They'll have had one lecture already and the handout defines perdurantism as "objects are four-dimensional," which I think has done damage before I even start — how much of the hour do I spend undoing that?

  I want one example carrying the whole thing. I've been using a pencil sharpened down to a nub: intrinsic change, most of the original matter gone, no persons involved. Say what it's missing and whether to swap it. I keep being tempted by a sourdough starter kept alive for decades and fed daily — none of the original flour left, still "the same starter" — but I suspect that's doing something different (lineage, or fission) and would just muddy things; tell me if I'm right and why, and whether it's usable later as a case the view has to handle rather than as the lead.

  Misconceptions, and where in the sequence to head each off. The one that actually worries me: they'll define "wholly present" as "all of its parts exist at that time," which both sides can happily accept, and the distinction quietly collapses — where do I stop that, and what do I put in its place? Then: they'll take temporal parts to be instanteous slices, like film frames. Half of them code, and I'd like to use a version-control analogy (a file whose history is a chain of commits), but I'm worried it builds in exactly that mistake — use it, place it somewhere specific, or drop it? Also "perdurantism means nothing really changes" and "that's just the block universe" — I want them to see those as extra commitments, not the view. And at some point a student will say "so there are hundreds of pencils in this room" and I never know whether to treat that as an objection or as the view itself.

  What do I openly refuse to get into and say so out loud (I'm guessing the argument from special relativity and stage theory, but you tell me)? And give me one question for the last five minutes they can't pass by repeating "wholly present" at me — ideally one where the two views have to disagree about a sentence rather than about a picture.
reasoning: |-
  Okay, let me tackle this metaphysics tutorial planning challenge. The user is clearly experienced with the material but frustrated by how students grasp terminology without understanding the underlying philosophical tensions. They've identified key failure points: the 'four-dimensional' definition oversimplification, the 'wholly present' misconception, and students treating perdurantism as obviously true by default.

  Hmm... the core issue seems to be students missing why anyone would reject perdurantism. That suggests we need to foreground the intuitive cost of perdurantism first. The pencil example works for intrinsic change, but I wonder if we should explicitly contrast it with the sourdough starter later to show when perdurantism becomes more attractive.

  For the sequence: must start with the naive view of persistence. Students probably assume objects are "just there" through time - we need to make that explicit as the default position before introducing problems. Then the change problem should come early, since it's the main motivator. The pencil sharpening is perfect here - tangible, no controversial parts. 

  Biggest landmine is 'wholly present'. Need to preempt the "all parts exist" misunderstanding immediately when defining endurantism. Should emphasize it's about the whole object being at multiple times simultaneously, not just having parts at each time. Maybe use the 'book in library' analogy explicitly - the entire book is on shelf A at t1 and shelf B at t2, not different copies.

  Perdurantism's temporal parts shouldn't be introduced as instantaneous by default - that's a common mistake. The version-control analogy could actually help here if framed carefully: commits are temporal segments, not slices, and the whole file isn't reducible to any single commit. But only after they grasp the core distinction.

  For misconceptions: 
  - "Nothing changes" needs addressing when explaining how perdurantists handle predicates. Emphasize that change is real but analyzed differently.
  - Block universe is separate - should explicitly decouple it. 
  - "Hundreds of pencils" is actually correct for perdurantism! Should validate that as a feature, not a bug, then contrast with endurantist ontology.

  What to avoid: relativity and stage theory are right out for intro. Also no composition debates. The closing question should force application - "The pencil at 10am is numerically identical to the pencil at 10:05" seems perfect because endurantists must accept it while perdurantists reject numerical identity over time.

  The sourdough starter is too complex for core argument - save it for after they grasp the views, as a case where perdurantism handles replacement better. Lineage concepts would derail the initial contrast.
answer: |-
  Here's a battle-tested plan focused on **exposing the cost of perdurantism** and **preempting collapse-inducing misconceptions**. Sequence is critical. Allocate ~45 mins to core argument, save last 5 for your knockout question.

  **Board Sequence & Key Dependencies (50 mins total):**

  1.  **The Naive Starting Point (5 mins):**
      *   **Board:** "Ordinary Persistence Intuition: An object *O* exists at time t1 *and* at time t2 is *numerically identical to itself*."
      *   **Dependency:** This is their pre-theoretic view. *Everything else challenges this*.
      *   **Action:** Elicit agreement: "When you see your coffee cup now and later, you think it's the *very same thing*, right?" Anchor this intuition.

  2.  **The Problem: Intrinsic Change (7 mins):**
      *   **Board:** "Problem: Intrinsic Change & Leibniz's Law (LL): If *O* at t1 = *O* at t2, then *O* at t1 has all the same properties as *O* at t2."
      *   **Dependency:** Needs the naive view to create tension.
      *   **Action:** **Use your pencil.** Draw it long/sharp at t1, short/dull at t2. "Same pencil? But Property P (length, sharpness) differs! Contradiction with LL?" *Force the problem:* How can one thing have contradictory properties?
      *   **Crucial:** Pause here. Don't jump to solutions. Let the tension simmer. *This is why someone might reject perdurantism later – it avoids this problem by denying the initial identity claim.*

  3.  **Endurantism: The "Common Sense" Solution? (10 mins):**
      *   **Board:** "Endurantism: *O* persists by being *wholly present* at multiple times. *O*-at-t1 is numerically identical to *O*-at-t2."
      *   **Board:** "**Wholly Present (Clarified):** The *entire* object *O* exists at time t. Not just parts of it, not a temporal part – the whole thing is located *right then*."
      *   **Dependency:** Direct response to the Problem (Step 2). Needs the naive identity intuition.
      *   **Action:**
          *   **DEFUSE MISCONCEPTION #1 IMMEDIATELY:** "**Stop!** 'All its parts exist at that time' is wrong here. *Both* views agree an object has parts at each time it exists. That's trivial. **Key:** For endurantists, the *whole enduring object* is present *each time* it exists. Analogy: A book is *wholly present* on Shelf A at noon. It moves; it's *wholly present* on Shelf B at 1 pm. It's the *entire book*, not just pages, at each location/time."
          *   Apply to pencil: "The whole pencil is present when long/sharp. Later, the *same whole pencil* is present when short/dull."
          *   **Cost:** How does it solve the change problem? *O* has properties *relative to times*: "The pencil is 6cm-long-at-t1 and 4cm-long-at-t2. No contradiction with LL (properties are different: being-6cm-at-t1 vs being-4cm-at-t2)." **Highlight the Cost:** This requires time-indexed properties. Is that ontologically heavy? Unintuitive?

  4.  **Perdurantism: The "Four-Dimensional" Solution (12 mins):**
      *   **Board:** "Perdurantism: *O* persists by having distinct *temporal parts* (TPs) at different times. *O*-at-t1 ≠ *O*-at-t2; they are distinct TPs of the same spacetime *worm* O."
      *   **Board:** "**Temporal Part:** A part of *O* located *only* at that specific time (or short interval)."
      *   **Dependency:** Needs the Problem (Step 2) as motivation. *Contrasts* with Endurantism's "wholly present".
      *   **Action:**
          *   **DEFUSE MISCONCEPTION #2:** "**Temporal parts are NOT necessarily instantaneous slices!** They can be chunks: minute-long parts, day-long parts. The 'worm' isn't made of frames; it's segmented. Think of the pencil's existence as a *spacetime tube*. A 10am-10:05am segment is one temporal part (long/sharp), a 10:05am-10:10am segment is another (short/dull)."
          *   **Version-Control Analogy (Use Here!):** "Think of the pencil's history like a file in Git. `pencil@commit-t1` (long/sharp) and `pencil@commit-t2` (short/dull) are distinct *snapshots* (temporal parts). The whole repository history is the `pencil` worm. You wouldn't say `pencil@commit-t1` *is* `pencil@commit-t2`; they are different commits. But they are parts of the same lineage/history." **This avoids the 'slice' mistake by using 'commit' which implies a duration/state.**
          *   Solve the change problem: "No contradiction! `pencil@t1` has property P (long/sharp), `pencil@t2` has property ~P (short/dull). They are distinct things. Change is variation between TPs."
          *   **"Hundreds of Pencils?":** "Yes! Sort of. Perdurantism says there *are* many temporal parts of pencils in the room right now. The 'worm' is the sum of them. Endurantism says there's just one *wholly present* pencil persisting through time. **This is the ontological cost of perdurantism: it multiplies entities (temporal parts)."** Frame this as the *reason to reject perdurantism* – it violates parsimony intuitions.
          *   **DEFUSE MISCONCEPTION #3:** "Perdurantism doesn't say nothing changes! It *analyzes* change as variation across TPs. Change is real difference."
          *   **DEFUSE MISCONCEPTION #4:** "Perdurantism is *compatible* with the block universe but doesn't *require* it. You could be a perdurantist and think only the present exists (though it's tricky!). The core is about *how objects are spread across time*, not necessarily the nature of time itself."

  5.  **Contrast & Core Tension Recap (5 mins):**
      *   **Board:** | **Endurantism:** 1 Object (Wholly Present @ each t) | **Perdurantism:** 1 Worm = Many Temporal Parts (Each at one t) |
      *   **Board:** **The Fork:**
          *   **Accept Identity Through Change?** (Yes -> Endurantism -> Needs Relational Properties)
          *   **Reject Identity Through Change?** (Yes -> Perdurantism -> Needs Temporal Parts)
      *   **Action:** "The debate isn't just about pictures. It's about what you're willing to pay: Endurantism pays with time-indexed properties; Perdurantism pays with temporal parts. Do you think the *whole object* is present now, or just a *part* of it?"

  6.  **Sourdough Starter (If Time Permits, ~3 mins):**
      *   **Action:** "Could perdurantism handle this better? The starter-worm has TPs with different matter. Endurantism struggles: is the *whole starter* present at t1 (with original flour) *identical* to the whole starter at t2 (no original flour)? Perdurantism says 'no identity, just linked TPs'. But note: this introduces *another* issue (material replacement) *on top of* the core persistence debate. Don't mix them initially!" *Use it to show perdurantism's potential advantage in complex cases, but stress it's an added layer.*

  **What to Explicitly Avoid (Say This):**
  *   "We are **not** talking about Special Relativity today. That adds complexity about simultaneity we can't handle yet."
  *   "We are **not** talking about Stage Theory vs. Worm Theory. That's a debate *within* perdurantism."
  *   "We are **not** resolving the debate – just understanding the *costs* that make each view plausible or implausible."

  **Your Knockout Question (Last 5 mins):**
  > **"True or False, and *which view forces you to say this*?:** 'The pencil that exists at 10:00 am is *numerically identical* to the pencil that exists at 10:05 am.'"

  *   **Why it works:**
      *   Forces a *sentence* judgment, not a picture.
      *   **Endurantist MUST say True.** (It's the core claim: identity through time).
      *   **Perdurantist MUST say False.** (They are distinct temporal parts).
      *   Exposes the fundamental disagreement about identity over time.
      *   They *can't* answer just by parroting "wholly present" or "temporal parts". They have to apply the concept to a claim about identity.
      *   Immediately reveals who understood the core tension: "Do you think it's the *same identical thing* or not?"

  **On the Handout "Four-Dimensional" Damage:**
  Spend **~3 mins max** early on (Step 4 intro). Say: "Saying 'objects are 4D' is vague. Both sides agree objects *occupy* 4D spacetime. The *crucial* difference is *how*: Is the object *spread out* along time like a worm made of parts (Perdurantism), or is it *entirely located* at each time-slice it occupies, like a line repeated on multiple slices (Endurantism)?" Replace the slogan with the *structural* distinction immediately. The pencil example grounds the abstraction.
