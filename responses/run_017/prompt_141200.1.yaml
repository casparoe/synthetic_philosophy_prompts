answer: |-
  ## Sestina for the Unexpected Hour

  The teacher said, before the week was done,
  A test would fall, unseen, a sharp **surprise**,
  Impossible to guess before its **Friday**
  Flash. "It cannot wait," they said, "till **Thursday**,
  Nor linger past the chime of final **Wednesday**,
  But blooms unseen on **Monday**, **Tuesday**, bright."

  We scanned the week, its structure clear and **bright**:
  Five chances for the promised deed, once **done**
  Would prove the word. We started with **Wednesday**,
  Too close to end, the final gasp, no **surprise**
  If all before had passed. Then **Thursday**
  Held the same flaw. So only **Friday**
  Remained? But then, the only **Friday**
  Left would glare, expected, far too **bright**
  To startle anyone. Thus **Thursday**
  Fell before it, logic deftly **done**.
  The premise crumbled. Where's the **surprise**
  If **Monday**'s dawn or nervous **Wednesday**?

  We pushed it back: erased the **Wednesday**
  Risk, dismissed the looming **Friday**
  Threat. That left the early days: **surprise**
  Could nest in **Monday**'s chill, **Tuesday**'s **bright**
  Commencement? Yet, if **Tuesday** came and **done**
  No paper fell, then sharp-eyed **Thursday**

  Would surely know the blow must land on **Thursday**?
  We saw the chain, relentless, **Wednesday**
  Bound to fall. The logic seemed well **done**,
  A perfect trap. We banished **Friday**
  First, then **Thursday**, **Wednesday**, **Tuesday**, **bright**
  **Monday** too. No day for **surprise**!

  But empty air cannot hold **surprise**.
  The chalk still waits beside the **Thursday**
  Board. Each morning now arrives too **bright**
  With dread or hope. The vanished **Wednesday**
  Lingers in the shadow of **Friday**,
  Yet nothing yet is truly **done**.

  The word announced, the trap was **done**:
  It conjured then erased the **surprise**,
  Made **Friday** certain, then erased **Friday**,
  Made **Thursday** loom, then banished **Thursday**,
  Dissolved **Wednesday**, then **Tuesday**, **Monday**, **bright**
  False starts. The cycle spins: **Wednesday**

  Reclaims its chance, then **Wednesday** fades. **Friday**
  Threatens, dissolves. The **bright** deduction cancels its own proof.
  The announcement takes itself back. **Surprise** hangs, frayed knot, blindfolded hour.
  No **Thursday** comes, yet all days wait. **Done**? Logic loops, a lock with no key, **bright**
  With paradox. The bell might ring on **Monday**, **Tuesday**, **Thursday**, **Friday**...
  Or never. Still we watch the door. **Surprise**.

  > *The sestina's rotating end-words enact the paradox's core mechanism: each stanza "eliminates" a day (reflecting the backward reasoning: Friday first, then Thursday, etc.), yet the words inevitably return in a new order, preventing final resolution. The poem traces the students' deduction (banishing days, finding the announcement "frayed"), leans into the structural tension ("The word announced... cancels its own proof"), and concludes in the envoi by emphasizing the self-consuming loop ("Logic loops, a lock with no key") and the perpetual state of unresolved anticipation ("Still we watch the door. Surprise."), fulfilling the request to avoid declaring a solution.*
