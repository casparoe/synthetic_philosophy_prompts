  Hmm, the user is writing a chapter on animal signal reliability and needs help clarifying the requirements for a theory of honest signaling. They want desiderata that tell a field biologist what to measure to determine if she should look for costs when encountering an unfamiliar signal. I need to cover all the phenomena, distinctions, and constraints they mentioned.

  The user has identified that the handicap principle is used in multiple ways, which is causing confusion. The desiderata must explain several key phenomena: why signals track quality instead of being bluffed (to prevent deception), why some reliable signals are cheap (like fixed indices), why costly signals might carry no information (like sensory traps), why receivers respond to displays exploiting preferences (manipulation), and why wasteful signals persist (to ensure honesty).

  Important distinctions must be maintained: signal vs. cue/index/manipulation; different types of costs (production, differential, receiver-imposed); durable quality vs. current need; and reliability vs. costliness. The theory must also align with game-theoretic results like the handicap principle models and empirical findings.

  I'll organize the desiderata into non-negotiable and negotiable categories. Non-negotiables are fundamental to any honest signaling theory, like the necessity of some constraint to prevent deception. Negotiables might vary between theoretical camps, such as whether costs must be borne by the signaller.

  The ranking is crucial. I think the constraint requirement (D1) is most important because it's foundational—without some mechanism preventing bluffing, honesty can't evolve. If I had to sacrifice one, it might be the "signaller-borne cost" aspect since some cases can maintain honesty without it (like aligned interests).

  For the hypothetical cases:
  1. Borrowed Cost: The cost falls on rivals, not the signaller. D1 is satisfied (theft requires fighting ability), but D4 (signaller-borne cost) isn't. This challenges the need for signaller-borne costs.
  2. Deferred Cost: Costs come later via receiver sanctions. It satisfies D1 (differential cost based on quality) and D4 (cost is on signaller, even if deferred). Shows that timing might not matter if the cost is inevitable.
  3. Aligned Interests: Mechanically honest, no cost. Satisfies D1 (fixed index prevents fakery) but not D4. Supports that costs aren't always necessary if interests align.
  4. Costly Deception: Expensive but deceptive. Violates D1 (no constraint maintaining honesty) but satisfies D4 (costly). Highlights that cost alone isn't sufficient for honesty.

  The main approaches:
  - Strategic handicap: Focuses on signaller-borne costs. Struggles with cost-free honesty.
  - Index/unfakeability: Relies on constraints making signals unfakeable. Handles aligned interests but not manipulation.
  - Receiver psychology: Emphasizes receiver biases. Explains deception but may not ensure honesty.
  - Aligned interests: Cost-free when interests match. Works for mutual benefit cases but not conflicts.

  I'll be explicit about which claims are conceptual (based on theory) and which are empirical. For example, the need for constraints is conceptual, derived from signaling theory, while the existence of cases like aligned interests is empirical.

  Finally, I'll commit to ranking D1 as the top priority and sacrificing strict signaller-borne costs (D4) to accommodate cases like aligned interests. The key insight is that honesty requires some constraint, but it doesn't always have to be a cost paid by the signaller.
answer: |-
  Here is a distilled set of desiderata for a theory of honest signalling, tailored to guide a field biologist's measurement decisions, followed by an analysis of the hypothetical cases and a ranking. The focus is on **operationalizability** – telling the biologist *what to measure* to assess the potential role of costs.

  ---

  ### **Desiderata for an Adequate Theory of Honest Signalling (Field Biologist Focus)**
  *(Non-negotiables marked **, negotiables marked *)*

  1.  **D1: Constraint Requirement (Non-Negotiable \*\*)**
      *   **Must Explain:** Why signals track quality/need instead of being bluffed (Deception Problem).
      *   **Must Explain:** Why costly deception (Case 4) is unstable or fails.
      *   **Must Not Collapse:** Reliability vs. Costliness (Cheap honesty must be possible, e.g., Case 3). Signals vs. Cues/Indices (Must explain signals as *strategic acts* subject to deception, not just passive cues).
      *   **Cannot Contradict:** Game theory: Honesty requires a *constraint* making deception unprofitable or impossible (e.g., handicap, index, punishment, aligned interests). Empirical result: Existence of cheap, reliable signals (e.g., size-related vocalizations).
      *   **Field Measure:** Identify the *mechanism preventing low-quality signallers from benefiting by displaying*. Look for: physical impossibility (index), differential costs/risks, receiver skepticism/punishment, or exceptionally aligned interests.

  2.  **D2: Differential Cost/Benefit Requirement (Non-Negotiable \*\*)**
      *   **Must Explain:** Why some expensive signals carry no information (Costly Deception - Case 4) – *because the cost/benefit must depend on signaller state*.
      *   **Must Explain:** Why signals of durable quality (e.g., antlers) vs. current need (e.g., begging) can both be honest but involve different cost structures.
      *   **Must Not Collapse:** Production cost vs. Differential cost (Cost must be higher for low-quality signallers *relative to the benefit*). Signals of quality vs. signals of need. Signal vs. Manipulation (Manipulation may lack differential cost based on signaller state).
      *   **Cannot Contradict:** Handicap Principle core: Net benefit of signalling must be higher for high-quality signallers. Empirical result: Signals often impose higher marginal costs on low-quality individuals (e.g., begging attracts predators more if weak).
      *   **Field Measure:** Assess if the *cost or risk associated with producing/displaying the signal* (or the *net benefit*) is *correlated with signaller quality/state*. Don't just measure absolute cost; look for *differential* impacts.

  3.  **D3: Receiver-Centricity Requirement (Non-Negotiable \*\*)**
      *   **Must Explain:** Why receivers respond to displays that exploit pre-existing preferences (Sensory Exploitation - relevant to Case 4). *Because receiver response is the source of signal benefit.*
      *   **Must Explain:** Why signals that look wasteful persist – *because they effectively influence receiver behavior to benefit the signaller*.
      *   **Must Not Collapse:** Signal vs. Index (Indices work regardless of receiver evolution; signals require co-evolved response). Production cost vs. Receiver-imposed cost (e.g., punishment - Case 2). Reliability vs. Efficacy (A signal can be reliable but ineffective if ignored).
      *   **Cannot Contradict:** Signalling is fundamentally an interaction; signals evolve because they *change receiver behavior* beneficially for the signaller. Empirical result: Receiver response thresholds and biases shape signal form.
      *   **Field Measure:** Measure *receiver response* (e.g., approach, retreat, mate choice, food delivery, attack) to signal variation. Is the response *adaptive for the receiver*? (If not, deception/manipulation is likely). Look for evidence of receiver skepticism or conditional response.

  4.  **D4: Signaller-Borne Cost Preference (Negotiable \*)**
      *   **Must Explain:** Why cost often falls directly on the signaller (e.g., energy, predation risk, immunocompetence).
      *   **Must Not Collapse:** Production cost vs. Differential cost vs. Receiver-imposed cost. Borrowed Cost (Case 1) vs. Signaller-Borne Cost.
      *   **Cannot Contradict:** Empirical prevalence of production/maintenance costs in ornaments. *But contradicts existence of cheap indices (Case 3) and complicates deferred/receiver-imposed costs (Case 2).*
      *   **Field Measure:** *Preferentially* look for costs borne *directly* by the signaller (energy, time, resources, risk). However, absence doesn't rule out honesty if other constraints (D1) exist.

  **The Workhorse Requirement:** **D1 (Constraint Requirement)** does the most work in excluding candidate theories. Theories that cannot explain *how deception is prevented* (e.g., pure sensory exploitation without constraints) fail as general theories of *honest* signalling. It directly addresses the biologist's core question: "Should I look for costs *or something else preventing cheating*?"

  ---

  ### **Analysis of Hypothetical Cases Against Desiderata**

  1.  **Borrowed Cost:**
      *   **D1 (Constraint):** SATISFIED. Stealing requires high fighting ability (constraint = index + differential risk). Low-quality signallers cannot cheaply acquire material.
      *   **D2 (Differential Cost/Benefit):** SATISFIED. The *risk/effort* of stealing is higher for low-quality individuals. Benefit (display, mating) depends on success.
      *   **D3 (Receiver-Centric):** SATISFIED. Receivers respond to the display structure. Response likely adaptive (indicates fighter ability).
      *   **D4 (Signaller-Borne Cost):** NOT SATISFIED. The primary cost (resource loss) is borne by rivals. Signaller bears *risk/differential effort* of stealing, but the *resource cost itself* is externalized.
      *   **Verdict:** A valid honest signal. **D4 is negotiable.** The constraint (D1) is key. Biologist should look for the mechanism enabling theft (fighting ability, index) and differential success/risk.

  2.  **Deferred Cost:**
      *   **D1 (Constraint):** SATISFIED. Displaying while poor quality triggers costly punishment (Constraint = receiver-imposed cost). Low-quality signallers cannot bluff without penalty.
      *   **D2 (Differential Cost/Benefit):** SATISFIED. Cost (attack) is *only* imposed on low-quality signallers who display. High-quality signallers get benefit without deferred cost. Differential net benefit is clear.
      *   **D3 (Receiver-Centric):** SATISFIED. Receiver response (attack) *is* the cost mechanism and must be adaptive (e.g., avoids provisioning low-quality young/mates).
      *   **D4 (Signaller-Borne Cost):** SATISFIED (Broadly). Cost is ultimately borne by the signaller (injury/death from attack), even if imposed later by the receiver.
      *   **Verdict:** A valid honest signal. Biologist should measure receiver response to signals from individuals of known condition and look for evidence of punishment/sanctions.

  3.  **Aligned Interests:**
      *   **D1 (Constraint):** SATISFIED. Pitch is fixed by size (Constraint = unfakeable index). Bluffing is physically impossible.
      *   **D2 (Differential Cost/Benefit):** SATISFIED (Trivially). No cost, but net benefit is identical for all (or slightly favors accurate info). No differential needed because no conflict.
      *   **D3 (Receiver-Centric):** SATISFIED. Receiver responds adaptively to the information.
      *   **D4 (Signaller-Borne Cost):** NOT SATISFIED. Signal is essentially free.
      *   **Verdict:** A valid honest signal. **D4 is negotiable.** Biologist should confirm the physical link (index) between signal and trait and assess shared interests/absence of conflict.

  4.  **Costly Deception (Manipulation/Sensory Trap):**
      *   **D1 (Constraint):** **NOT SATISFIED.** There is *no constraint* linking the display to signaller quality/need. Low-quality signallers *can* (and do) bluff successfully using the expensive display. Deception *is* profitable.
      *   **D2 (Differential Cost/Benefit):** PARTIALLY/AMBIGUOUSLY. Display is costly *for all*, but the *net benefit* might be positive *regardless of quality* (due to receiver bias). There's no differential *disadvantage* for low-quality to display. Cost may be the same for all.
      *   **D3 (Receiver-Centric):** SATISFIED. Receiver responds due to pre-existing bias. Response is *maladaptive* for receiver.
      *   **D4 (Signaller-Borne Cost):** SATISFIED. Display is expensive for the signaller.
      *   **Verdict:** **NOT an honest signal.** It's deception/manipulation. **D1 is violated.** Biologist should test if signal correlates with any signaller quality/need and crucially, if receiver response is maladaptive (e.g., mating reduces fitness). Cost alone (D4) is insufficient.

  ---

  ### **Resolving Tensions & Ranking Commitment**

  *   **The Core Tension:** Strict adherence to **D4 (Signaller-Borne Cost)** rules out valid honest signalling in **Aligned Interests (Case 3)** and complicates **Borrowed Cost (Case 1)**, while relaxing D4 potentially allows **Costly Deception (Case 4)** if **D1 (Constraint)** is not rigorously applied.
  *   **Resolution:** **D1 (Constraint)** is paramount. It *must* be satisfied for honest signalling. **D4 (Signaller-Borne Cost)** is the most expendable desideratum. It reflects a common *mechanism* for satisfying D1/D2 (differential cost handicaps) but is not *necessary* if other constraints (indices, punishment, aligned interests) enforce honesty.
  *   **Sacrifice:** **D4 (Signaller-Borne Cost)**. While often present and important, it is not a fundamental requirement for signal honesty. The biologist should prioritize searching for the *constraint preventing cheating* (D1) and evidence of *differential net benefit* (D2), which may or may not involve direct signaller-borne production costs.

  **Ranked Desiderata (Most to Least Important for Defining Honest Signalling & Guiding Measurement):**
  1.  **D1: Constraint Requirement** (Non-negotiable core)
  2.  **D2: Differential Cost/Benefit Requirement** (Non-negotiable core - defines the "handicap logic" broadly)
  3.  **D3: Receiver-Centricity Requirement** (Non-negotiable - defines signalling as communication)
  4.  **D4: Signaller-Borne Cost Preference** (Negotiable - a common but non-essential mechanism)

  **Approaches vs. Desiderata (One Line):**
  *   **Strategic Handicap Models:** Strong on D1/D2/D4, weak on D3 (receiver evolution secondary), struggles with Case 3 (Aligned Interests).
  *   **Index/Unfakeability Accounts:** Strong on D1/D3, explains Case 3, weak on D2/D4 (cost often irrelevant), struggles with costly signals lacking indices (e.g., some begging).
  *   **Receiver-Psychology/Sensory Exploitation:** Strong on D3, explains Case 4 (Costly Deception), weak on D1/D2 (lacks inherent constraint for honesty), struggles explaining reliable signals in conflict.
  *   **Cost-Free Honest Signalling (Aligned Interests):** Strong on D1/D2/D3, explains Case 3, explicitly rejects D4, struggles explaining signals in contexts of conflict/exploitation.

  **Conceptual vs. Empirical:**
  *   **Conceptual (Theory-Derived):** The *necessity* of a constraint (D1) for stable honest signalling (game theory). The distinction between signals, cues, indices, and manipulation. The requirement for differential net benefit (D2) in conflicts of interest. The definition of signalling requiring receiver response (D3).
  *   **Empirical (Data-Settled):** Whether a *specific* signal satisfies D1 (what the constraint is) or D2 (if costs are differential) in a given species. The prevalence of signaller-borne costs (D4). The existence and frequency of cases like 1, 2, 3, and 4 in nature. The degree of interest alignment in specific contexts. Whether a receiver response is adaptive or maladaptive.

  **Commitment:** For the field biologist encountering an unknown signal, the primary question guided by D1 is: **"What prevents low-quality individuals from faking this signal and benefiting?"** Measuring potential costs (especially differential costs - D2) is a *primary line of investigation* because constraints often involve them, but it is *not the only possibility*. Confirming the nature of receiver response (D3) is equally crucial to distinguish honest signalling from manipulation and understand the signal's function. The biologist should *not assume* costs must be borne directly by the signaller (D4 is negotiable), but should *investigate* where the costs/risks lie.
