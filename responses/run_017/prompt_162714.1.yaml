answer: |-
  ### Lesson Plan: Money Pump Argument in Rationality

  **Dependency Structure** (must be established before drawing the trade cycle):  
  1. **Preference relations and properties**: Define strict preference (\(A \succ B\)), indifference (\(A \sim B\)), and the axioms of rationality:  
     - **Transitivity**: If \(A \succ B\) and \(B \succ C\), then \(A \succ C\).  
     - **Completeness**: For any \(A\) and \(B\), either \(A \succ B\), \(B \succ A\), or \(A \sim B\).  
     *Why*: The pump targets violations of these properties. Without this foundation, students cannot see what the argument defends.  
  2. **Local vs. global choice distinction**:  
     - **Local choice**: Myopic, step-by-step decisions (accepting each trade as it comes).  
     - **Global choice (planning)**: Adopting a pre-commitment to a sequence (e.g., refusing all trades).  
     *Why*: The strongest reply (resolute choice) relies on this contrast. If not established, students cannot articulate how to avoid the pump or why the argument might be contested.

  **Core Example**: **Three goods with cyclic preferences and a penny fee**.  
  - **Goods**: \(A\), \(B\), \(C\).  
  - **Preferences**: \(A \succ B\), \(B \succ C\), \(C \succ A\) (cyclic).  
  - **Trades**:  
    1. Start with \(A\).  
    2. Pay 1¢ to trade \(A\) for \(C\) (since \(C \succ A\)).  
    3. Pay 1¢ to trade \(C\) for \(B\) (since \(B \succ C\)).  
    4. Pay 1¢ to trade \(B\) for \(A\) (since \(A \succ B\)).  
  - **Outcome**: Back to \(A\), but 3¢ poorer. Cycle repeatable indefinitely.  

  **Why this example?**  
  - **Re-tradeable goods**: Allows the cycle to repeat (e.g., after returning to \(A\), the pump restarts), demonstrating *arbitrary financial loss*.  
  - **Unconnected traders**: Each trade is offered by a *different person* (not a single exploiter). *Why*: Avoids the objection that a "scheme" is detectable; emphasizes the vulnerability stems from *preferences alone*.  
  - **No risk/uncertainty/changing preferences**:  
    - *No risk*: Trades are deterministic (no probabilities).  
    - *No uncertainty*: Outcomes are known.  
    - *Static preferences*: Preferences don’t shift mid-sequence.  
    *Why*: Isolates the problem to *structural irrationality* in preferences, not external factors.  

  **Misconception Map** (when and how to defuse each):  
  1. **"The pump shows cyclic preferences are *logically incoherent*."**  
     - **When defused**: During the outcome discussion (after drawing the cycle).  
     - **Response**: "The issue is *practical* (you lose money), not logical. Cyclic preferences are consistent but costly."  
  2. **"The agent can refuse the final swap to avoid loss."**  
     - **When defused**: When introducing local vs. global choice (before the reply).  
     - **Response**: "Refusing the final trade is myopically irrational (since \(A \succ B\)), so it only works if you *plan ahead*."  
  3. **"The argument needs an exploiter or money."**  
     - **When defused**: When emphasizing unconnected traders and re-tradeability.  
     - **Response**: "Money is just a proxy for *any valued resource*; unconnected traders show the problem is *inherent to preferences*, not exploitation."  
  4. **"The pump establishes transitivity, but standard cycles only require *acyclicity*."**  
     - **When defused**: When linking the pump to transitivity.  
     - **Response**: "Acyclicity (no cycles) is the *minimal* fix, but transitivity *ensures* acyclicity. The pump *implies* transitivity by forbidding cycles."  
  5. **"The pump establishes completeness."**  
     - **When defused**: When discussing scope (after the core argument).  
     - **Response**: "Pumping an incomplete preference (e.g., \(A\) and \(B\) incomparable) requires *extra premises* (e.g., willingness to pay to move between incomparable options). The standard pump *only directly argues for transitivity*."  

  **Closing Question** (last 5 minutes):  
  - **Question**: "Suppose an agent with cyclic preferences (\(A \succ B\), \(B \succ C\), \(C \succ A\)) is offered the first trade (\(A\) for \(C\) plus 1¢). They recognize this might be part of a money pump. How can they avoid losing money, and what does this say about the normative force of the argument?"  
  - **Why this?**: Tests understanding of the local/global distinction. A strong answer cites *adopting a plan* (e.g., refusing all trades) and notes the pump’s force depends on whether rationality permits myopic choice.  

  **What to Refuse to Settle**:  
  - **Omit**: The debate over whether rationality *requires* resolute choice (i.e., if sticking to a plan is obligatory).  
  - **Omit**: Representation theorems (linking preferences to utility functions).  
  - **Why**: These are deeper topics beyond a 60-minute session. Focus on the pump as a *practical challenge* to cyclic/incomplete preferences.  

  ---

  ### Session Table (60-Minute Breakdown)  
  Total time: **60 minutes**.

  | Step | Idea Introduced                                                                 | Depends On                         | Misconception Defused Here                                                                 | Check That It Landed                                                                 | Minutes |  
  |------|---------------------------------------------------------------------------------|------------------------------------|-------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|--------|  
  | 1    | Recap: Preference relations (\(\succ, \sim\)), transitivity, completeness.      | Prior knowledge (expected utility). | None.                                                                                    | "Define transitivity in your own words." (e.g., if \(A \succ B\) and \(B \succ C\), then \(A \succ C\).) | 5      |  
  | 2    | Cyclic preferences: Example \(A \succ B\), \(B \succ C\), \(C \succ A\).        | Step 1 (transitivity).             | "Cyclic preferences are logically impossible." (Clarify: coherent but costly.)            | "Is this cycle logically consistent? What makes it problematic?" (Yes; practical cost.) | 5      |  
  | 3    | Money pump sequence: Trades \(A \to C\) (+1¢), \(C \to B\) (+1¢), \(B \to A\) (+1¢). | Step 2 (cycle).                  | "The agent can refuse the final swap." (But refusal is myopically irrational.)            | "Why would the agent accept each trade? What’s the net outcome?" (Loss of 3¢.)      | 15     |  
  | 4    | Repeatability (re-tradeable goods) and unconnected traders.                    | Step 3 (sequence).                | "The argument needs a single exploiter or money." (Stress: money is a tool; traders need not be connected.) | "Could this work with different people offering each trade? Why?" (Yes; preferences alone create vulnerability.) | 5      |  
  | 5    | Argument conclusion: Cyclic preferences lead to exploitation → irrational.     | Steps 3–4.                        | "The pump shows logical incoherence." (Reiterate: practical cost, not contradiction.)     | "Does the pump reveal a contradiction or a bad outcome?" (Bad outcome.)            | 5      |  
  | 6    | Local vs. global choice: Myopic (accept trades) vs. resolute (plan to refuse). | Steps 3–5 (pump outcome).         | "Refusing any trade solves it." (But refusal must be based on foresight, not myopia.)     | "At Step 1, if the agent suspects a pump, what should they do? Why is this hard?" (Adopt a plan; local choice may override.) | 10     |  
  | 7    | Scope: Pump argues for transitivity (via cycles); completeness needs extra premises. | Steps 1–6.                       | "The pump establishes completeness." (Correct: Incompleteness requires additional assumptions, e.g., willingness to pay to move.) | "If an agent has no preference between \(A\) and \(B\), can they be pumped? What must we assume?" (Only if they pay to switch, which isn’t guaranteed.) | 5      |  
  | 8    | Strongest reply: Resolute choice (adopt a plan). Final question.               | Steps 6–7.                        | "The pump is defeated if you avoid trades." (But resolute choice is a normative choice, not a given.) | Pose closing question; listen for "plan" vs. "local choice." (See above.)         | 10     |  

  **Minutes Sum**: 5 + 5 + 15 + 5 + 5 + 10 + 5 + 10 = 60.  

  **Teaching Notes**:  
  - Use a whiteboard to diagram the cycle and trades.  
  - Emphasize *student checks* to ensure misconceptions are caught early.  
  - End with the closing question to gauge understanding of the local/global distinction.  
  - Openly state exclusions: "We won’t resolve if rationality demands resolute choice or explore utility theorems—focus on the pump’s core argument and reply."
