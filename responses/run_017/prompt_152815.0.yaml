prompt: |-
  I'm a PhD student in formal epistemology, and I'm writing the take-home final for an upper-level seminar on anthropic reasoning. I need one question on the self-sampling assumption versus the self-indication assumption that a student cannot pass by reciting the presumptuous-philosopher slogan that SIA favours hypotheses with more observers.

  The case I want to build it around comes in two variants. Variant A: a fair coin is flipped; if heads, exactly ten observers are created, all wearing red shirts; if tails, a thousand observers are created, ten in red and nine hundred and ninety in blue. You wake up and find yourself wearing red. Variant B: same coin, but if heads ten observers are created with one in red and nine in blue, and if tails a thousand observers are created with a hundred in red and nine hundred in blue; again you find yourself in red. My thought is that these numbers make the two principles trade places: in one variant the big-world-friendly principle is the one that treats your red shirt as uninformative, and in the other it is the one that treats it as decisive, so that neither principle can simply be identified with the presumptuous philosopher's inference. Please check that arithmetic yourself rather than taking my word for it, and tell me if I have misdesigned the case.

  What I need is: (1) the exam question itself, framing both variants for students, with a stated limit of forty minutes and a nine-hundred-word cap; (2) a model answer of about six hundred words; (3) a marking scheme out of twenty built on four or five must-hit points, with the marks each is worth and one line on the error that should cost a student marks there. The points I have in mind are: the explicit SIA calculation, showing why the prior boost cancels in one variant but not the other; the explicit SSA calculation; a diagnosis of what the residual disagreement is really about, given that the SSA verdict is hostage to whether the blue-shirted observers belong to the reference class; what happens to each verdict if the reference class is narrowed to red-shirted observers; and whether the pair of variants settles, or merely relocates, the presumptuous-philosopher worry. Regroup these if you think I have located the crux wrongly. Assume the students have no readings to hand: the question must be self-contained and must ask only for their own reasoning and arithmetic.
reasoning: |-
  We are designing an exam question that tests understanding of the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) in two variants of an anthropic scenario. The goal is to show that the common slogan that SIA always favors hypotheses with more observers is insufficient because in one variant SIA treats the red shirt as uninformative (so it doesn't favor the big world) and in the other it does, while SSA behaves differently.

  Variant A:
  - Heads (H): 10 observers, all in red.
  - Tails (T): 1000 observers: 10 red, 990 blue.

  Variant B:
  - Heads (H): 10 observers: 1 red, 9 blue.
  - Tails (T): 1000 observers: 100 red, 900 blue.

  In both variants, you wake up and find you have a red shirt.

  We want to compute the posterior probability of heads (H) under SSA and SIA for each variant.

  First, recall:

  SSA: We reason as if we are a random sample from the set of all observers (or from a reference class). The probability of being a particular observer is proportional to 1, but we condition on being an observer.

  SIA: We reason as if we are a random sample from the set of all possible observer-moments, but also we weight the hypotheses by the number of observers they produce. That is, the prior probability of a hypothesis is proportional to the number of observers it predicts.

  Typically, we set a prior on H and T. Since the coin is fair, we set P(H) = P(T) = 1/2.

  Under SIA, we adjust the prior by the number of observers. So the prior becomes:
    P_SIA(H) = (number of observers in H) * P(H) / [ (number in H)*P(H) + (number in T)*P(T) ]

  But note: SIA is often implemented by using the original prior and then updating on the fact that you exist (which gives a likelihood proportional to the number of observers). Alternatively, we can think of the SIA prior as already incorporating the existence of observers, so we start with:

    Prior under SIA: 
      P_SIA(H) = (N_H * P(H)) / (N_H * P(H) + N_T * P(T))

  Then we update on the evidence (being red) by using the fraction of red observers in each world.

  Under SSA, we do not adjust the prior. We keep the original prior (P(H)=1/2) and then update on the evidence (being red) by the fraction of red observers in each world. However, we must condition on being in the reference class (which we assume includes red-shirted observers).

  Let's compute for each variant.

  Variant A:

  SSA:
    P(H) = 1/2, P(T) = 1/2
    Evidence: red shirt
    P(red | H) = 1 (because all 10 are red)
    P(red | T) = 10/1000 = 1/100

    Posterior:
      P(H | red) = [P(red|H) * P(H)] / [P(red|H)*P(H) + P(red|T)*P(T)]
                 = [1 * 1/2] / [1*1/2 + (1/100)*(1/2)]
                 = (1/2) / (1/2 + 1/200) 
                 = (1/2) / (100/200 + 1/200) 
                 = (1/2) / (101/200) 
                 = (1/2)*(200/101) = 100/101 ≈ 0.9901

    So under SSA, after seeing red, we are about 99% sure of heads.

  SIA:
    First, adjust the prior by the number of observers:
      N_H = 10, N_T = 1000
      P_SIA(H) = (10 * 1/2) / (10*1/2 + 1000*1/2) = (5) / (5+500) = 5/505 = 1/101
      P_SIA(T) = 500/505 = 100/101

    Then update on being red:
      P(red | H) = 1
      P(red | T) = 10/1000 = 1/100

    Posterior:
      P_SIA(H | red) = [P(red|H) * P_SIA(H)] / [P(red|H)*P_SIA(H) + P(red|T)*P_SIA(T)]
                     = [1 * (1/101)] / [1*(1/101) + (1/100)*(100/101)]
                     = (1/101) / [1/101 + 1/101]
                     = (1/101) / (2/101)
                     = 1/2

    So under SIA, after seeing red, we are back to 50% for heads.

  In Variant A, SSA strongly favors heads (the small world) and SIA is indifferent.

  Variant B:

  SSA:
    P(H) = 1/2, P(T)=1/2
    P(red | H) = 1/10   (because 1 red out of 10)
    P(red | T) = 100/1000 = 1/10

    So:
      P(H | red) = [ (1/10)*(1/2) ] / [ (1/10)*(1/2) + (1/10)*(1/2) ]
                 = (1/20) / (1/20 + 1/20)
                 = (1/20) / (2/20) = 1/2

    Therefore, under SSA, we are indifferent.

  SIA:
    Adjust the prior:
      N_H = 10, N_T = 1000
      P_SIA(H) = (10 * 1/2) / (10*1/2 + 1000*1/2) = 5/(5+500)=5/505=1/101
      P_SIA(T)=500/505=100/101

    Update on red:
      P(red | H) = 1/10
      P(red | T) = 100/1000 = 1/10

    Posterior:
      P_SIA(H | red) = [ (1/10)*(1/101) ] / [ (1/10)*(1/101) + (1/10)*(100/101) ]
                     = (1/1010) / [1/1010 + 100/1010]
                     = (1/1010) / (101/1010)
                     = 1/101

    So under SIA, we get P(H|red)=1/101, which is very low, meaning we strongly favor tails (the big world).

  Summary:

  Variant A:
    SSA: P(H|red) = 100/101 ≈ 0.99
    SIA: P(H|red) = 1/2

  Variant B:
    SSA: P(H|red) = 1/2
    SIA: P(H|red) = 1/101 ≈ 0.01

  Therefore, in Variant A, SSA favors the small world and SIA is neutral. In Variant B, SSA is neutral and SIA favors the big world.

  The common slogan that SIA always favors big worlds is not wrong in the sense that it does boost the prior for big worlds, but the update can sometimes cancel that boost (as in Variant A) and sometimes reinforce it (as in Variant B). The key is the proportion of red shirts in each world.

  Now, the exam question:

  ---

  **Exam Question: Anthropic Reasoning and Shirt Color**

  **Time Limit:** 40 minutes  
  **Word Limit:** 900 words

  Consider two variants of an anthropic thought experiment. In both variants, a fair coin is flipped. 

  **Variant A:**  
  - If the coin lands heads (H), exactly ten observers are created, all wearing red shirts.  
  - If the coin lands tails (T), exactly one thousand observers are created: ten wearing red shirts and nine hundred and ninety wearing blue shirts.  

  **Variant B:**  
  - If the coin lands heads (H), exactly ten observers are created: one wearing a red shirt and nine wearing blue shirts.  
  - If the coin lands tails (T), exactly one thousand observers are created: one hundred wearing red shirts and nine hundred wearing blue shirts.  

  In both variants, you wake up and find that you are wearing a red shirt. 

  1. For each variant, calculate the posterior probability that the coin landed heads, using:  
     (a) the Self-Sampling Assumption (SSA), and  
     (b) the Self-Indication Assumption (SIA).  

     Show all your calculations and reasoning.  

  2. Explain why the results demonstrate that SIA does not always favor the hypothesis with more observers. In particular, compare the two variants and highlight how the effect of the evidence (wearing red) interacts with the prior adjustment in SIA.  

  3. Under SSA, the result depends on whether the blue-shirted observers are included in the reference class. Suppose we narrow the reference class to only red-shirted observers. How would that change the SSA calculation in each variant?  

  4. The "presumptuous philosopher" argument against SIA is that it unreasonably favors hypotheses that predict many observers. Do these variants resolve, relocate, or exacerbate this worry? Explain.

  ---

  **Model Answer (approx. 600 words):**

  **Part 1: Calculations**

  **Variant A:**  
  - SSA:  
    Prior: P(H) = P(T) = 1/2.  
    P(red | H) = 1 (all 10 are red).  
    P(red | T) = 10/1000 = 1/100.  
    Posterior: P(H | red) = [1 * 1/2] / [1*1/2 + (1/100)*1/2] = (1/2) / (1/2 + 1/200) = (1/2) / (101/200) = 100/101.  

  - SIA:  
    Adjust prior: P_SIA(H) = (10 * 1/2) / (10*1/2 + 1000*1/2) = 5/505 = 1/101; P_SIA(T)=100/101.  
    P(red | H)=1, P(red | T)=1/100.  
    Posterior: P_SIA(H | red) = [1*(1/101)] / [1*(1/101) + (1/100)*(100/101)] = (1/101) / (1/101 + 1/101) = (1/101)/(2/101)=1/2.  

  **Variant B:**  
  - SSA:  
    Prior: P(H)=P(T)=1/2.  
    P(red | H)=1/10, P(red | T)=100/1000=1/10.  
    Posterior: P(H | red) = [(1/10)*(1/2)] / [(1/10)*(1/2) + (1/10)*(1/2)] = (1/20)/(2/20)=1/2.  

  - SIA:  
    Adjust prior: P_SIA(H)=1/101, P_SIA(T)=100/101 (same as Variant A).  
    P(red | H)=1/10, P(red | T)=1/10.  
    Posterior: P_SIA(H | red) = [(1/10)*(1/101)] / [(1/10)*(1/101) + (1/10)*(100/101)] = (1/1010) / (101/1010) = 1/101.  

  **Part 2: Why SIA does not always favor more observers**  
  In Variant A, SIA yields a posterior of 1/2, which is neutral between H and T, even though T predicts more observers. In Variant B, however, SIA strongly favors T (posterior for H is 1/101). The difference lies in the evidence. In Variant A, the proportion of red shirts in the tails world is low (1/100) compared to heads (1). This low proportion counteracts the prior boost that T gets from having more observers. In Variant B, the proportion of red shirts is the same in both worlds (1/10). Therefore, the update does not counteract the prior boost, and SIA favors the world with more observers (T). Thus, SIA does not always favor the hypothesis with more observers because the evidence can sometimes negate the prior advantage.

  **Part 3: SSA with narrowed reference class**  
  If we narrow the reference class to only red-shirted observers, then under SSA we condition on being a red-shirted observer. In both variants, we then ignore the blue-shirted observers.  

  - Variant A:  
    H: 10 red observers.  
    T: 10 red observers.  
    So P(red | H)=1 (trivially, because we are conditioning on being red) but note: the total red observers in H is 10, and in T is 10. Thus, the probability of being a particular red observer is 1/10 in both worlds? Actually, we must be careful.  

    Under SSA with reference class = red-shirted observers:  
      P(H | red) = P(being in H | red) = (number of red in H) / (total red in both worlds) * prior ratio? Actually, we should use the fact that the chance of being any particular red observer is equal.  

    Since the coin is fair, the prior probability of H and T is 1/2. But now, if H is true, there are 10 red observers. If T is true, there are also 10 red observers. Therefore, the total number of red observers is 10 (if H) + 10 (if T) = 20. But note: the worlds are mutually exclusive.  

    Standard SSA with reference class R:  
      P(I am in world H | I am in R) = P(H) * (number of R in H) / [P(H)*number of R in H + P(T)*number of R in T]  
      = (1/2 * 10) / (1/2*10 + 1/2*10) = 5/10 = 1/2.  

    So in Variant A, with reference class = red, SSA gives P(H|red)=1/2.  

  - Variant B:  
    H: 1 red observer.  
    T: 100 red observers.  
    Then:  
      P(H | red) = (1/2 * 1) / (1/2 * 1 + 1/2 * 100) = (0.5) / (0.5 + 50) = 0.5/50.5 ≈ 0.0099.  

    So in Variant B, with reference class = red, SSA gives a very low probability for H.  

  **Part 4: Presumptuous philosopher**  
  These variants relocate the worry. The presumptuous philosopher objects to SIA because it favors big worlds without evidence. Here, in Variant A, SIA does not favor the big world (it remains neutral) because the evidence (red shirt) is rare in the big world. In Variant B, it does favor the big world. The worry now becomes that SIA allows the prior boost to be counteracted by evidence, but the evidence in these cases is indexical (shirt color). The deeper worry is whether indexical evidence should have such a strong effect. The variants show that the issue is not about the number of observers per se but about the interaction between the prior and the likelihood. However, one might still be concerned that in Variant B, SIA strongly favors the big world even though the shirt color evidence is equally likely in both worlds. Thus, the presumptuous philosopher's worry resurfaces in Variant B, but is absent in Variant A. This suggests that the worry is context-dependent and not inherent to SIA in every scenario.

  ---

  **Marking Scheme (out of 20):**

  1. **Correct calculations for both variants under SSA and SIA (8 marks)**  
     - Variant A: SSA (100/101) and SIA (1/2) (2 marks each, total 4)  
     - Variant B: SSA (1/2) and SIA (1/101) (2 marks each, total 4)  
     - Deduct 1 mark per arithmetic error, and 1 mark per missing step.

  2. **Explanation of why SIA does not always favor more observers (4 marks)**  
     - Must note that in Variant A, the evidence (red shirt) is rare in the big world (T), which counteracts the prior boost (2 marks).  
     - Must note that in Variant B, the evidence is equally likely in both worlds, so the prior boost for T remains (2 marks).  
     - If the student only states that it depends on the proportion of the evidence, but without contrasting the two variants, deduct 1-2 marks.

  3. **Effect of narrowing the reference class to red-shirted observers under SSA (4 marks)**  
     - For Variant A: must get 1/2 (2 marks)  
     - For Variant B: must get approximately 0.01 (1/101) (2 marks)  
     - Deduct 1 mark per error in calculation or reasoning.

  4. **Discussion of the presumptuous philosopher worry (4 marks)**  
     - Must note that the worry is relocated: it appears in Variant B but not in Variant A (2 marks).  
     - Must note that the worry becomes context-dependent and is about the interaction of the prior and the evidence (1 mark).  
     - Must mention that in Variant B, SIA still favors the big world without any non-indexical evidence, which might be seen as problematic (1 mark).  
     - If the student fails to see the relocation and only says it resolves or exacerbates, deduct 2 marks.

  Total: 8+4+4+4=20.

  Note: The word count for the model answer is about 600 words. Students are capped at 900 words. They must be concise.
answer: |-
  ### Exam Question: Anthropic Reasoning and Shirt Color  
  **Time Limit:** 40 minutes  
  **Word Limit:** 900 words  

  Consider two variants of a thought experiment involving a fair coin flip. In both, you wake up with a red shirt and must compute the probability of heads (H) or tails (T).  

  **Variant A:**  
  - Heads (H): Exactly 10 observers exist, all wearing red shirts.  
  - Tails (T): Exactly 1,000 observers exist: 10 in red shirts and 990 in blue shirts.  

  **Variant B:**  
  - Heads (H): Exactly 10 observers exist: 1 in a red shirt and 9 in blue shirts.  
  - Tails (T): Exactly 1,000 observers exist: 100 in red shirts and 900 in blue shirts.  

  **Tasks:**  
  1. **Calculate the posterior probability of heads (H)** for each variant using:  
     - (a) The Self-Sampling Assumption (SSA): You are a random observer from a predefined reference class (e.g., all observers).  
     - (b) The Self-Indication Assumption (SIA): Hypotheses are weighted by the number of observers they predict.  
     Show all steps, including priors, likelihoods, and posteriors.  

  2. **Explain why the results challenge the slogan that "SIA always favors hypotheses with more observers."** Focus on how the evidence (being red-shirted) interacts with SIA’s prior boost in each variant.  

  3. **Diagnose the disagreement:** Under SSA, the result depends on whether blue-shirted observers are in the reference class. Suppose we narrow the reference class to only red-shirted observers. How does this change the SSA posterior in each variant?  

  4. **Address the presumptuous philosopher:** This objection claims SIA unreasonably favors large worlds. Do these variants resolve, relocate, or worsen this worry? Justify your answer.  

  ---

  ### Model Answer (≈600 words)  

  #### **1. Calculations**  
  **Variant A:**  
  - **SSA:** Priors are even: \(P(H) = P(T) = 0.5\).  
    Likelihoods: \(P(\text{red}|H) = 10/10 = 1\), \(P(\text{red}|T) = 10/1000 = 0.01\).  
    Posterior:  
    \[
    P(H|\text{red}) = \frac{P(\text{red}|H)P(H)}{P(\text{red}|H)P(H) + P(\text{red}|T)P(T)} = \frac{1 \times 0.5}{1 \times 0.5 + 0.01 \times 0.5} = \frac{0.5}{0.505} \approx 0.9901.
    \]  
    → SSA strongly favors H.  
  - **SIA:** Adjust priors by observer count:  
    \(P_{\text{SIA}}(H) = \frac{10 \times 0.5}{10 \times 0.5 + 1000 \times 0.5} = \frac{5}{505} \approx 0.0099\),  
    \(P_{\text{SIA}}(T) = \frac{500}{505} \approx 0.9901\).  
    Update with evidence:  
    \[
    P_{\text{SIA}}(H|\text{red}) = \frac{P(\text{red}|H)P_{\text{SIA}}(H)}{P(\text{red}|H)P_{\text{SIA}}(H) + P(\text{red}|T)P_{\text{SIA}}(T)} = \frac{1 \times 0.0099}{1 \times 0.0099 + 0.01 \times 0.9901} \approx \frac{0.0099}{0.0099 + 0.0099} = 0.5.
    \]  
    → SIA yields indifference.  

  **Variant B:**  
  - **SSA:** \(P(H) = P(T) = 0.5\).  
    Likelihoods: \(P(\text{red}|H) = 1/10 = 0.1\), \(P(\text{red}|T) = 100/1000 = 0.1\).  
    Posterior:  
    \[
    P(H|\text{red}) = \frac{0.1 \times 0.5}{0.1 \times 0.5 + 0.1 \times 0.5} = \frac{0.05}{0.1} = 0.5.
    \]  
    → SSA yields indifference.  
  - **SIA:** Adjusted priors (same as Variant A): \(P_{\text{SIA}}(H) \approx 0.0099\), \(P_{\text{SIA}}(T) \approx 0.9901\).  
    Update:  
    \[
    P_{\text{SIA}}(H|\text{red}) = \frac{0.1 \times 0.0099}{0.1 \times 0.0099 + 0.1 \times 0.9901} = \frac{0.00099}{0.00099 + 0.09901} = \frac{0.00099}{0.1} = 0.0099.
    \]  
    → SIA strongly favors T.  

  #### **2. Why SIA Does Not Always Favor More Observers**  
  The slogan fails because SIA’s prior boost for large worlds is sometimes canceled by the evidence. In Variant A, T’s prior boost (from 1,000 observers) is counteracted by the low likelihood of being red in T (1%), leading to indifference. In Variant B, the likelihood of being red is identical in both worlds (10%), so T’s prior boost dominates, favoring T. SIA’s verdict thus depends on whether the evidence is *differentially diagnostic* between hypotheses—not solely on observer count.  

  #### **3. SSA with Narrowed Reference Class**  
  If the reference class includes only red-shirted observers, SSA treats you as a random red-shirted observer:  
  - **Variant A:**  
    H: 10 red observers. T: 10 red observers.  
    Posterior:  
    \[
    P(H|\text{red}) = \frac{P(H) \times \text{red in H}}{P(H) \times \text{red in H} + P(T) \times \text{red in T}} = \frac{0.5 \times 10}{0.5 \times 10 + 0.5 \times 10} = 0.5.
    \]  
    → SSA becomes indifferent (vs. originally 99%).  
  - **Variant B:**  
    H: 1 red observer. T: 100 red observers.  
    Posterior:  
    \[
    P(H|\text{red}) = \frac{0.5 \times 1}{0.5 \times 1 + 0.5 \times 100} = \frac{0.5}{50.5} \approx 0.0099.
    \]  
    → SSA now favors T (vs. originally 50%).  
  This shows SSA’s sensitivity to reference-class boundaries: Blue observers matter only if included.  

  #### **4. Presumptuous Philosopher: Relocated, Not Resolved**  
  The variants *relocate* the worry. In Variant A, SIA avoids presumptuousness (it is indifferent), showing the worry is not universal. But in Variant B, SIA strongly favors T despite identical non-indexical evidence (red shirts are 10% likely in both worlds), seemingly endorsing the "presumptuous" preference for larger worlds. The core issue persists: SIA allows indexical evidence (e.g., shirt color) to interact with observer counts in ways that may still seem unreasonable when likelihoods are equal. The disagreement is now contextual—hinging on how evidence weights against prior boosts—but unresolved.  

  ---

  ### Marking Scheme (20 points total)  
  **1. SIA and SSA Calculations (8 points)**  
  - Variant A: Correct SSA (≈0.99) and SIA (0.5) calculations (4 points).  
  - Variant B: Correct SSA (0.5) and SIA (≈0.01) calculations (4 points).  
    *Error penalty:* −1 per arithmetic mistake; −2 if no priors/likelihoods shown.  

  **2. SIA vs. Observer-Count Slogan (4 points)**  
  - Explains cancellation in Variant A (low T likelihood) (2 points).  
  - Contrasts with Variant B (equal likelihood, prior boost dominates) (2 points).  
    *Error penalty:* −2 if no interaction with evidence; −1 if no variant comparison.  

  **3. SSA Reference-Class Sensitivity (4 points)**  
  - Variant A: Correct narrowed SSA (0.5) (2 points).  
  - Variant B: Correct narrowed SSA (≈0.01) (2 points).  
    *Error penalty:* −2 if no calculation; −1 if misunderstanding reference class.  

  **4. Presumptuous Philosopher Diagnosis (4 points)**  
  - Notes worry is relocated (Variant B) but not resolved (2 points).  
  - Identifies contextual dependence and lingering issue in Variant B (2 points).  
    *Error penalty:* −2 if claims full resolution; −1 if no mention of Variant B.  

  **Clarity and Conciseness:** Ensure answers are within word limit and logically structured. Overly verbose or off-topic responses may lose up to 2 bonus points.
