  For tonight's case (just war volunteer who mistakenly believes he's on the unjust side), I need to predict what the flatmate might say. Since the war is objectively just, and he's a voluntary combatant, even though he mistakenly believes otherwise due to disinformation, the rule might suggest he may be killed but it wouldn't be murder. The objective justice of the cause might trump his subjective belief when it comes to the "murder" question.

  I should also suggest another case for tomorrow that could help distinguish between possible rule interpretations. Something involving a non-combatant with direct causal contribution but without combatant status might be useful - like a drone pilot for a private military company.

