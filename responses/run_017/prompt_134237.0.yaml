answer: |-
  ## Dissertation Proposal: The Temporal Asymmetry in Utility Comparisons: Reassessing the Foundations of Interpersonal Welfare Judgments

  **Project Title:** Welfare Comparisons Without Asymmetry: Intrapersonal Stability and the Critique of Interpersonal Skepticism  

  **Research Question:**  
  Does the standard skepticism regarding the *interpersonal* comparability of welfare levels, gains/losses, and ratios apply with equal force to *intrapersonal* comparisons across time for a single individual? If not, what specific features (if any) insulate the temporal case from these skeptical arguments, and what are the implications for which types of interpersonal comparability are viable under different normative frameworks (e.g., utilitarianism requiring ratio comparisons for aggregation, prioritarianism requiring level/gain comparisons for weighting, sufficientarianism requiring threshold-level comparisons)?  

  ### 1. Problem Statement and Significance
  The debate on interpersonal utility comparisons (IUC) remains polarized. Skeptics (ordinalists, influenced by Robbins, Sen’s early work) argue that comparing welfare across persons is impossible or meaningless due to: (i) the arbitrariness of utility scales (origin/unit problems), (ii) the inaccessibility of subjective states, and (iii) preference instability (e.g., adaptive preferences). Defenders (e.g., Harsanyi via extended sympathy, contemporary SWB researchers) argue comparability is feasible—empirically or by stipulation. Crucially, *both camps assume intrapersonal temporal comparisons (ITC)*—judging one’s own welfare across time—are relatively unproblematic. This project challenges that asymmetry.  

  I argue the core skeptical arguments apply symmetrically to ITC:  
  *   **Arbitrary Scaling:** A person’s utility function at t1 lacks a natural zero or unit for comparison with their state at t2. Rescaling is always possible.  
  *   **Inaccessibility:** My past/future subjective states are as inaccessible to my present self as another person’s states are. Memory and anticipation are fallible proxies.  
  *   **Instability:** Preferences adapt over time (Elster), undermining the stability needed for meaningful comparison between "past me" and "present me."  

  Yet, ITC underpins vital practices: prudential saving (discounting), QALYs in health economics, tort damages for pain/suffering. If ITC is equally vulnerable, we face a trilemma:  
  1.  Skeptics have unwittingly conceded the harder case (ITC), making IUC skepticism incoherent.  
  2.  An overlooked feature (Feature X) legitimizes ITC but not IUC, requiring identification and justification of X.  
  3.  IUC is *less* problematic than ITC in key respects (e.g., a stable "comparator subject" exists for IUC but not ITC due to personal change).  

  This project systematically investigates this trilemma, distinguishing comparability types:  
  *   **Level Comparisons:** Is person A at t1 better off than person B at t2? Is *I* at 30 better off than *I* was at 20? (Relevant for sufficientarianism).  
  *   **Gain/Loss Comparisons:** Did policy X benefit person A more than it benefited person B? Did my promotion improve my welfare more than my last one did? (Relevant for utilitarianism, prioritarianism).  
  *   **Ratio Comparisons:** Is person A’s welfare twice person B’s? Is my welfare now twice what it was last year? (Critical for unweighted utilitarianism).  

  The project’s significance lies in reconceptualizing a foundational debate. If ITC is as problematic as IUC, core practices relying on ITC require new justification, or skepticism must be universalized (a Pyrrhic victory). If a defensible asymmetry exists, it clarifies the scope and limits of welfare economics and distributive justice.  

  ### 2. Why Existing Literature Leaves the Question Open  
  *   **Skeptics (Ordinalists):** Focus on IUC’s impossibility while taking ITC for granted (e.g., Robbins’ focus on "other minds"). They lack resources to explain why inaccessibility/arbitrariness plague *only* interpersonal cases. They don’t engage the temporal instability challenge head-on.  
  *   **Veil-of-Ignorance/Extended Sympathy (Harsanyi, Rawls):** Attempt to *derive* IUC from ITC via imaginative identification. **Crucially, this move *presupposes* the validity and robustness of ITC.** If ITC is unstable, the derivation may fail or become circular. These approaches cannot resolve whether ITC itself is robust.  
  *   **Social Choice (Measurability/Comparability Axioms):** Sen’s framework classifies informational bases (e.g., ordinal non-comparable vs. cardinal unit comparable). It treats interpersonal and intrapersonal comparability assumptions as separate, exogenous inputs. It doesn’t interrogate the *grounds* for assuming one might hold where the other fails.  
  *   **Subjective Well-Being (SWB) Research:** Empirically measures reported happiness/life satisfaction. While providing data for IUC, it faces methodological critiques (scale interpretation, adaptation) mirroring ITC concerns. It assumes respondents can reliably compare their *own* states over time, sidestepping the deep skepticism.  
  *   **The "Institutional Stipulation" Reply:** Some (e.g., Binmore, pragmatic SWB users) argue comparability is a normative choice for institutions, not a metaphysical fact. This reply fails because: (i) Institutions rely on *some* notion of measurable welfare change (e.g., in torts, health policy), and (ii) The trilemma challenges whether stipulating ITC is any *more* defensible than stipulating IUC, given the symmetric arguments. Why privilege one stipulation?  

  ### 3. Methodology and Work Plan (12 Months)  
  *   **Months 1-2: Foundational Mapping & Asymmetry Diagnosis:**  
      *   Weeks 1-4: Detailed analysis of canonical skeptical arguments (Robbins, Arrow, Sen) and their reliance on the asymmetry.  
      *   Weeks 5-8: Systematic dissection of core arguments (Arbitrariness, Inaccessibility, Instability), demonstrating their symmetric application to ITC using thought experiments and formal examples (e.g., modeling preference drift).  
      *   **Milestone 1:** Draft chapter establishing the symmetric vulnerability of ITC and IUC to core skeptical arguments.  
  *   **Months 3-4: Interrogating the Trilemma – Feature X?:**  
      *   Weeks 9-12: Critically evaluate Hypothesis 2: Search for candidate "Feature X" (e.g., psychological connectedness, narrative identity, biological continuity) that might ground ITC. Assess their plausibility and cost (do they require metaphysically robust personal identity?).  
      *   Weeks 13-16: Evaluate Hypothesis 3: Is IUC *easier*? Analyze the "stable comparator subject" argument. Is the social comparer (analyst, institution) truly stable in a way the temporally extended self is not?  
      *   **Milestone 2:** Draft chapter assessing the viability of Hypotheses 2 & 3, concluding whether a defensible asymmetry exists and what it entails.  
  *   **Months 5-6: Normative Frameworks & Comparability Grades:**  
      *   Weeks 17-20: Analyze distinct requirements for Level, Gain/Loss, and Ratio comparability within Utilitarianism (Total/Average), Prioritarianism, and Sufficientarianism.  
      *   Weeks 21-24: Map findings from Months 1-4 onto these requirements. Does symmetric skepticism undermine all equally? Does a discovered asymmetry (or lack thereof) enable some frameworks but not others? E.g., Does ITC skepticism alone doom discounting?  
      *   **Milestone 3:** Draft chapter linking the comparability analysis to normative theory viability.  
  *   **Months 7-8: Case Studies & Veil of Ignorance Test:**  
      *   Weeks 25-28: Apply analysis to concrete practices: Discounted CBA, QALYs, Tort Damages. How do they implicitly rely on ITC? How vulnerable are they to ITC skepticism?  
      *   Weeks 29-32: Address the Veil of Ignorance (VoI) concern: Does the symmetric vulnerability of ITC reveal the VoI derivation of IUC as question-begging (if it assumes robust ITC) or as unexpectedly successful (if ITC skepticism is unfounded)? **This is integrated as a crucial test case, not a detour.**  
      *   **Milestone 4:** Draft chapter on implications for applied reasoning and the VoI.  
  *   **Months 9-12: Synthesis, Writing, and Revision:**  
      *   Months 9-10: Integrate chapters, refine core argument, write introduction/conclusion.  
      *   Month 11: Internal review (advisor/committee feedback).  
      *   Month 12: Final revisions and dissertation completion.  
      *   **Milestone 5:** Complete Dissertation Draft.  

  ### 4. Results and Failure Conditions  
  *   **Successful Result:** A determinate answer to the trilemma (e.g., "Hypothesis 1 is correct: Skepticism cannot be consistently limited to IUC; institutional practices relying on ITC require fundamental reassessment" OR "Hypothesis 3 is correct: The 'stable comparator' makes defensible IUC possible even where robust ITC fails, reshaping justification for VoI approaches"). Crucially, the result will specify *which grades of comparability* (levels/gains/ratios) are salvaged or undermined for *which normative frameworks* given the findings.  
  *   **Project Failure (Specific Sense):**  
      1.  **Indeterminacy:** The analysis concludes that *no* defensible answer exists within the project's scope – the asymmetry is primitive or the arguments are perfectly symmetric in a way that offers no leverage (though this *is* a significant philosophical conclusion).  
      2.  **Triviality:** The project reveals that the answer was presupposed by the initial framing (e.g., discovering that the only possible "Feature X" *is* a metaphysically robust personal identity, making the project collapse into that debate).  
      3.  **Established Position:** The investigation merely confirms one of the starting hypotheses without adding significant novel insight or argumentative force.  

  ### 5. Scope and Boundaries  
  *   **Deliberately Set Aside:**  
      *   **Metaphysics of Personal Identity:** While acknowledging its relevance to Hypothesis 2, I will *not* engage deeply with theories like Parfitian reductionism or animalism. I will treat psychological connectedness/narrative as *pragmatic concepts used in welfare practices* rather than resolving their ultimate metaphysical grounding. The cost of invoking them will be assessed based on their coherence within welfare economics/political philosophy, not metaphysics proper.  
      *   **Comprehensive Review of SWB Methodologies:** While engaging with core critiques of SWB relevant to instability/arbitrariness, I will not conduct original empirical research or delve into highly technical psychometric debates.  
      *   **Full Formalization:** While using formal examples for clarity (especially regarding scales and aggregation), the dissertation will prioritize conceptual and argumentative analysis over extensive game-theoretic or social choice theorem-proving.  
  *   **Managing the Veil of Ignorance (VoI) Concern:** This is **integral** to the project, not hived off. The VoI is the most prominent *attempt* to bridge ITC and IUC. Testing whether my critique of ITC undermines the VoI derivation (by showing it depends on an unstable foundation) or unexpectedly rescues it (by showing IUC is *less* problematic) is a core objective (Months 7-8). It provides a crucial application and test case.  
  *   **Risk of Overextension:** The primary risk is Hypothesis 2 dragging the project into personal identity metaphysics. **Mitigation:** Strictly frame the search for "Feature X" within the resources of welfare economics and practical reason. If compelling candidates *require* deep metaphysics, this becomes a finding supporting Hypothesis 1 (skepticism applies symmetrically) or Triviality Failure. The VoI analysis is contained as a specific application. The focus on distinct comparability grades and normative frameworks provides structure preventing drift. The 12-month timeline necessitates this disciplined focus.  

  This project offers a novel critique of a fundamental assumption in welfare economics and political philosophy. By rigorously examining the symmetry of skeptical arguments across the interpersonal and intrapersonal domains, it promises to reconfigure debates on comparability, the justification of welfare-economic practices, and the foundations of theories of distributive justice.
