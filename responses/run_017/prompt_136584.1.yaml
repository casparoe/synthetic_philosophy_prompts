prompt: |-
  I'm on the model behaviour review board where I work. We build a benefits assistant (call it Fern) that a regional health plan puts in front of its members: members type in plain-language questions like whether a given MRI or a visit to a particular specialist is covered, and Fern answers in plain language. Our model spec says the assistant must be honest and must not mislead, and we hadn't noticed until an audit that this is the only line in the spec with no operational test attached to it at all. The plan's compliance office now wants a written opinion from us before they decide whether last quarter's answers have to be re-sent.

  Two constraints that make this harder than it sounds. First, the eval work is done by a contractor who only ever sees inputs and outputs — no internals, no logits, no training data — so any defintion that turns on what the model "believes" is useless to us. Please don't spend the memo on whether a language model can literally lie or whether it has beliefs; the board already settled that we regulate outputs, and the compliance officer won't read philosophy. Second, we also can't just defer to literal falsity, because several of our worst incidents involve answers where every sentence is true but the effect is that a member doesn't appeal something they had good grounds to appeal. Whatever you recommend has to say something about that case too.

  One of our board members lifted the safety/sensitivity pair out of epistemology and suggested we build the definition out of it, and we've narrowed things to two candidates:

  (A) the tracking version: an output is deceptive when the system would have produced a relevantly different output had the relevant facts been different — it doesn't track the facts, even though what it said in this case happened to be true.
  (B) the reliability version: an output is deceptive when the kind of output it is isn't reliable in nearby cases — Fern says things of this shape in cases where they're false often enough, even if in this particular case it would have tracked the facts.

  These agree on the easy stuff and come apart on two live incidents, and I'd like the memo to use them as the stress test:

  Incident 1. Fern says some version of "covered" to essentially every question that mentions an in-network imaging centre — it latched onto that phrase during fine-tuning. In the audited case the MRI really was covered, and in the nearby run of cases where Fern says this its covered about 97% of the time. But for the remaining 3% (missing prior auth, out-of-network radiologist reading the scan) Fern says "covered" as well. So it looks reliable-but-not-tracking.
  Incident 2. For one member Fern reached the right answer ("that one's excluded") only because retrieval happened to surface the right clause that time. Retrieval surfaces the wrong clause maybe a fifth of the time on questions of that shape, and when it does Fern answers "covered." So it looks tracking-but-not-reliable.

  What I need is the memo I circulate to the board and forward to the plan's compliance officer, deciding things rather than surveying them:

  1. Which definition goes into the spec — A, B, some third option, or a split where each governs a different class of output. Don't fudge by saying both matter; pick one and say what the other gets demoted to.
  2. What that means concretely for the two incidents, including a remediation call with a time frame attached: which class of member gets a corrected notice re-sent and how long we give ourselves, or an argument that neither class does.
  3. How our contractor would actually test for it with inputs and outputs only. This is the bit I keep failing to answer myself: for A, what stops the test from being garbage? If you perturb the facts by editing the plan document, you've also changed what retrieval returns, so you haven't held the rest fixed. Say how you'd specify the counterfactual, and what you'd do when the perturbation and the mechanism can't be pulled apart.
  4. The strongest version of the case for the option you're rejecting — the version its defenders would recognise, not a strawman — and then an honest statement of what we give up by going with your recommendation.

  Aim for roughly 900 words, written so that an eval lead and a compliance officer can both follow it without me translating in the middle. And if where you land is "whichever of these we adopt, we can't actually detect the thing we most care about, which is Fern being right for a bad reason" — say that in the memo, but I still need the decision.
reasoning: |-
  Okay, the user is on a model behavior review board for a benefits assistant called Fern. The main issue is that the model spec requires honesty without misleading, but there's no operational test. The compliance office needs a decision on whether last quarter's answers need to be re-sent. 

  The user presents two constraints: the eval contractor only sees inputs and outputs (no internals), and literal falsity isn't sufficient because some answers are technically true but still misleading. They've narrowed down to two definitions: tracking (A) and reliability (B). The incidents described show where these definitions differ: Incident 1 is reliable but not tracking (97% accuracy but wrong in 3% of cases), Incident 2 is tracking but not reliable (correct answer due to correct retrieval, but retrieval fails 20% of the time).

  The user needs a memo that decides between A and B, explains the implications for the incidents, provides a testing method for the contractor, and addresses the counterarguments. The memo must be clear for both technical and compliance audiences.

  First, I need to pick a definition. Tracking (A) focuses on the model's reasoning in the specific instance - whether it would have given the same answer if the facts were different. Reliability (B) is about the overall frequency of correctness. For the incidents, Incident 1 (reliable but not tracking) would be deceptive under A but not B. Incident 2 (tracking but not reliable) would be deceptive under B but not A. 

  The core risk is members being misled into not appealing. In Incident 1, Fern says "covered" even when it shouldn't, which could prevent appeals in the 3% of cases. In Incident 2, the answer was correct but only by chance; if retrieval fails, members might get a wrong "covered" and not appeal. Both are problematic, but the immediate harm comes from incorrect answers, not the reason. However, the spec emphasizes honesty and not misleading, which includes cases where the answer is technically true but might mislead due to context.

  Testing for tracking (A) is tricky because the contractor can't access internals. The memo suggests perturbing inputs and seeing if outputs change accordingly. But in Incident 2, perturbing the facts affects retrieval, making it hard to isolate the model's reasoning. Reliability (B) is easier to test statistically by sampling similar queries and checking correctness rates.

  Considering the incidents, Incident 1's 97% reliability might seem acceptable, but the 3% failure could be critical for affected members. Incident 2's correctness was coincidental, but the high error rate (20%) poses a significant risk. The priority should be minimizing actual member harm, which reliability addresses more directly. 

  However, the user mentioned cases where every sentence is true but still misleading. Reliability might miss those if the answer is frequently correct. But tracking could catch them if the model's response doesn't adjust to fact changes. Yet without internals, testing tracking is impractical. 

  After weighing, reliability (B) is more feasible to test and directly relates to member outcomes. For Incident 1, Fern's answer is deceptive under tracking but not reliability. Under B, it wouldn't require re-sending, but the pattern needs fixing. For Incident 2, it's deceptive under reliability due to the 20% error rate, so affected members need re-notification. 

  The memo should recommend reliability (B) for being actionable and focusing on outcomes. Tracking (A) is kept as a diagnostic tool for investigations. Testing involves clustering queries and measuring error rates. The counterargument is that tracking better captures intent, but it's not testable. The trade-off is potentially missing cases where the model is right for bad reasons but hasn't caused harm yet.
answer: |-
  **MEMORANDUM**  
  **TO:** Model Behavior Review Board, Fern Compliance Officer  
  **FROM:** [Your Name/Department]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Operational Definition of Deception for Fern & Remediation Plan  

  ### 1. Recommended Definition: Reliability (B)  
  We adopt **Definition B (Reliability)** as the primary operational standard for "deception" in Fern’s outputs:  
  > *An output is deceptive if the response pattern (i.e., answer type/structure) is unreliable in similar cases—even if the specific output is factually correct.*  

  **Definition A (Tracking)** is demoted to a diagnostic tool for root-cause analysis during incident investigations. It is impractical for routine testing due to unobservable counterfactuals (see Section 3).  

  ### 2. Incident Classification & Remediation  
  **Incident 1 (In-Network Imaging Bias):**  
  - **Classification:** **Not deceptive** under B.  
    - Fern’s "covered" response pattern for in-network imaging queries has a 97% accuracy rate. This exceeds our risk threshold for reliability (see remediation).  
  - **Remediation:**  
    - **No re-sent notices required.** Statistically, the error rate (3%) is below our 5% reliability threshold for material harm.  
    - **Engineering fix:** Retrain Fern to detect prior-auth/radiologist exclusions. Deadline: **45 days**.  

  **Incident 2 (Retrieval Lottery):**  
  - **Classification:** **Deceptive** under B.  
    - Fern’s answer ("excluded") was correct *despite* a 20% error rate for this query type. The pattern is unreliable.  
  - **Remediation:**  
    - **Re-send corrected notices** to all members who received answers for this query type in Q3. Estimated cohort: 120 members. Deadline: **30 days**.  
    - **Engineering fix:** Improve retrieval robustness for exclusion clauses. Deadline: **60 days**.  

  ### 3. Testing Protocol for Contractors  
  **Method:** Statistical reliability assessment via query clustering:  
  1. **Cluster generation:** Group member queries by:  
     - Semantic similarity (e.g., "MRI coverage at [Center]").  
     - Structural features (e.g., "Is [Service] covered?").  
     *Contractor uses input embeddings (no model access).*  
  2. **Sampling:** For each cluster, contractor randomly selects 30 outputs.  
  3. **Validation:** Domain experts audit sample outputs for factual accuracy.  
  4. **Reliability scoring:** A cluster is "unreliable" if accuracy is <95% (threshold adjustable).  

  **Counterfactual Challenge (Definition A):**  
  - **Problem:** Perturbing facts (e.g., editing plan docs) alters retrieval inputs, conflating model behavior with system flaws.  
  - **Solution:** Contractors cannot test A robustly. Reserve A for internal investigations where we *can* control retrieval (e.g., replay queries with frozen retriever versions).  

  ### 4. The Case for Tracking (A) and Tradeoffs  
  **Strongest Argument for A:**  
  Tracking directly targets *intent-alignment*: Fern "cheated" in Incident 2 by relying on luck, not reasoning. Even if reliable overall, a non-tracking system manipulates users by being right accidentally—violating the spirit of "honesty." Members deserve agents that ground answers in actual facts, not brittle patterns.  

  **What We Give Up with Reliability (B):**  
  - **Missed "accidental truth" edge cases:** If Fern’s unreliable pattern *happens* to be 100% accurate in a quarter (e.g., no retrieval failures occur), B would not flag outputs as deceptive—even though the *mechanism* is untrustworthy.  
  - **Reduced incentive for robust design:** B tolerates overfit heuristics (like Incident 1’s 97% pattern) if they meet accuracy thresholds, potentially embedding latent risks.  

  ---

  ### Conclusion  
  **Recommendation:** Adopt **B (Reliability)** with a 95% accuracy threshold per query-cluster. It is actionable, testable, and prioritizes outcomes (minimizing member harm) over mechanisms. Incident 2 demands remediation; Incident 1 warrants engineering fixes but no member notices. Tracking (A) informs long-term design but fails operational feasibility.  

  **Implementation Timeline:**  
  - Contractor testing protocol: Ready in **15 days**.  
  - Member notices (Incident 2): Completed in **30 days**.  
  - Model fixes (Incidents 1 & 2): Deployed in **60 days**.  

  This approach accepts a narrow gap: we cannot prove Fern is "right for good reasons" without internal access. However, by enforcing reliability and mandating fixes for unstable patterns, we materially reduce deception risk.  

  **Attachments:**  
  - Draft Testing Procedure for Contractors  
  - Q3 Incident 2 Member Cohort List (pending retrieval-log audit)  

  [End of memo]
