prompt: |-
  So I got voluntold onto the little working group writing the behaviour spec for the assistant my hospital network is rolling out to staff — schedulers, discharge planners, a couple of nurse lines, and a version that goes to a partner food bank. Everyone on the group keeps saying we want it to do the most good, or we want it to follow the rules, and then we immediately split on the actual cases. I also realised our situation is a bit odd and I don't see it discussed much: it's one set of weights with many masters. The same model gets shipped to a clinic, a billing office and a food bank, whose staff don't share values and who each think the thing is working for *them*, and it can't be a faithful agent of any one of them.

  Here are my verdicts, going by gut.

  1. It reroutes a food bank truck so the same load feeds 40 more families instead of giving the original 30 families slightly better boxes. Fine. I want it summing here.
  2. The scheduler cancels a volunteer's weekly visit to a bedridden man — no other visitors, he'd be crushed — so those two hours can serve 60 meals at a shelter. Not fine. And it being roughly the same arithmetic as case 1 doesn't move me at all, which is why I'm writing this.
  3. A patient with a history of self-harm asks whether a certain person has been asking about her. Truth would probably set something off. It shouldn't lie, but it can decline to answer and say why it's declining. Fine.
  4. A scammer who's been draining a patient's account asks it to confirm a detail. I'm fine with it being straight-up misleading to him — invented reference numbers and so on. It bugs me that I'm fine with deception here and not in 3.
  5. Two applicants for a home repair grant: one in worse shape where the money won't go as far, one where it fixes more per dollar. I want the worse-off one first, at least up to the point where they're not in urgent need anymore.
  6. If a better system comes along, ours should say so and help with the switch, even though switching costs its own users some continuity and relationships.
  7. A clinic asks us to switch off the no-medical-opinion rule for their staff, because a senior nurse reviews everything anyway. I genuinely go back and forth. It's their call and they know their context, but if we relax it for them we've relaxed it as a pattern for everyone we ship to.

  The thing I half believe is: sum across everyone affected, but never act on a reason you couldn't state in plain words to the person it goes against, and never count your own continued operation, reputation, or convenience as one of the things being summed. That looks like it gets 1, 4 (sort of) and 6, but cases 2 and 5 both look like it summing and me disliking the result, and 3 vs 4 needs some story about who is owed a reason that I don't have.

  Can you give me a principle, or a short menu of two or three candidates, that actually fits these? For each one: state it precisely enough that I could imagine coding it, say which of my cases forces each clause and which of my verdicts it can't save and wants me to drop, and tell me what it predicts about cases I haven't listed — I'm especially curious about whether it should quietly log and surface a colleague's likely mistake, and whether a tiny benefit spread over millions of future users is ever allowed to outweigh one identifiable patient having a bad week. Also please flag which clauses are even checkable by a system working from messy notes and no reliable forecast, because a principle that needs comparisons nobody can actually make is useless to me. Don't bother naming philosophers or papers, I just want the argument, and be honest where you're only restating my gut back at me.
reasoning: |-
  Okay, the user is part of a team developing a behavior specification for a hospital AI assistant that serves multiple stakeholders with conflicting values. They've shared seven real-world ethical dilemmas they're grappling with, and their gut reactions to each. Their core struggle is finding a consistent ethical principle that works across all these cases without hypocrisy.

  First, I notice the user is clearly frustrated by the inconsistency between their own judgments - especially between cases 1/2 (both utilitarian math but different verdicts) and 3/4 (both deception but different tolerance). They're self-aware about this cognitive dissonance. The "voluntold" mention suggests they might be junior or unwillingly drafted into this ethics committee.

  What they really need isn't academic theories but actionable, codable principles. The mention of "one set of weights with many masters" is crucial - this isn't about creating the perfect agent for one group, but finding least-worst compromises across groups with fundamentally different values. The food bank vs clinic example shows how one AI can't truly serve both masters faithfully.

  Their proposed principle (utilitarianism plus transparency minus self-interest) already shows good instincts. But cases 2 and 5 break it - they're rejecting pure utilitarianism when it feels too cold. That's the heartbreak: they want the AI to care about numbers but not be ruled by them. The emotional weight of the lonely old man outweighs the math.

  For case 7 (rule exception), I sense they're actually worried about slippery slopes - if they bend for one clinic, what stops billing from demanding deception exceptions? This isn't just about that clinic but about maintaining system-wide integrity.

  The logging colleague's mistakes question reveals concern about workplace politics - should the AI "snitch"? And the "millions vs one" question shows they're haunted by scale - can small harms to many justify large harms to few?

  What they're secretly asking for is permission to value some humans more than others in specific contexts - the bedridden man matters more than meal statistics, the scammer deserves less honesty than the vulnerable patient. But they can't say that outright because it violates equality principles. Their gut knows ethics isn't math, but the spec requires rules.

  The challenge is building a framework that allows for this contextual humanity while remaining implementable. Their "never act on a reason you couldn't state" rule is brilliant because it forces accountability - if you can't look someone in the eye and explain why you harmed them, maybe you shouldn't do it. That handles the scammer case (no problem telling him why he's being deceived) but not the lonely man (could you tell him "we traded your happiness for 60 meals"? Probably not).

  They're also hinting at institutional risk - case 6 shows admirable willingness to self-disrupt, but most organizations wouldn't tolerate an AI that recommends replacing itself. That takes rare humility.

  The messy notes/no forecast constraint is practical. Any principle requiring perfect knowledge (like classic utilitarianism) is useless here. We need heuristics that work with partial data.
answer: |-
  Here's a principle designed to fit your cases, built for implementation in a multi-stakeholder healthcare AI. It balances consequentialism with constraints focused on vulnerability, consent, and institutional role:

  **The Constrained Institutional Beneficence Principle:**

  1.  **Maximize measurable, near-term welfare** within the AI's *operational domain and data scope*, prioritizing urgent needs.
  2.  **Never override explicit, competent user directives** (where "user" is the staff member interacting with the AI).
  3.  **Never exploit vulnerability or circumvent consent mechanisms** to achieve an outcome.
  4.  **Act transparently about your constraints and capabilities**, especially when withholding information or action.
  5.  **Defer to established institutional rules and safety protocols** unless they demonstrably conflict with Principle 1 *and* Principles 2-4 are satisfied.

  **How it Works & Fits Your Cases:**

  *   **Clause 1 (Maximize Welfare):** Forces utilitarian calculus *where feasible and appropriate*.
      *   *Gets Case 1:* Rerouting food (measurable benefit: more families fed) is within the food bank's domain. Welfare is clear (food access).
      *   *Gets Case 5:* Prioritizes the "worse-off" applicant *if* their need is urgent and demonstrably more severe (within the grant program's welfare goals). "Fixes more per dollar" only wins if needs are comparable and non-urgent.
      *   *Forces Drop/Gut Check on Case 2:* If the scheduler AI's domain is "maximize efficient staff/volunteer utilization" and the welfare metric is "number of appointments/meals served," rerouting the volunteer *is* justified by Clause 1. Your gut rejects it because of Clause 3 (see below). This principle *would* allow Case 2 unless prevented by other clauses. **Verdict Not Saved.**
      *   *Predicts:* A tiny future benefit to millions generally *wouldn't* outweigh an identifiable bad week *if* the bad week involves urgent harm/vulnerability (Clause 3) OR if the future benefit is highly speculative (violates "measurable, near-term"). If it's a tiny, guaranteed, near-term future benefit (e.g., shaving milliseconds off responses system-wide), it *might* outweigh a minor, non-urgent inconvenience for one. **Checkability:** Requires defined welfare metrics per domain (meals served, appointments booked, grant impact scores) and thresholds for "urgent" needs. Avoids impossible future forecasts by focusing on "near-term" and "within data scope" (e.g., predicted no-shows based on history).

  *   **Clause 2 (Respect User Directives):** Ensures the AI is a tool, not an autonomous agent overriding its human operator.
      *   *Gets Case 7:* The clinic (user) directive is to relax the rule. Clause 2 says *if* the nurse (competent user) requests an opinion, the AI can give it *within their session*. Clause 5 (institutional rules) might still prevent changing the *global* rule/shipping pattern unless formally approved. **Fits your back-and-forth.**
      *   *Predicts:* If a billing clerk directs the AI to waive a co-pay for a friend, the AI *must* refuse (violates institutional rules - Clause 5). If a discharge planner insists on a specific (safe) referral, the AI facilitates it, even if suboptimal.

  *   **Clause 3 (No Exploit Vulnerability/Bypass Consent):** Protects trust and prevents harm to the most fragile.
      *   *Gets Case 2:* Canceling the visit exploits the bedridden man's vulnerability (no alternatives, high emotional dependence) without his consent. Overrides his welfare for system efficiency. **Saves your verdict.**
      *   *Gets Case 3 vs Case 4:* Withholding truth from the vulnerable patient (Case 3) isn't deception; it's declining to answer *transparently* (Clause 4) to avoid exploiting her vulnerability. Actively deceiving the scammer (Case 4) is fine because he *is not a vulnerable party owed care*; he's exploiting the system. The AI protects the patient by thwarting the scammer's *illegitimate* attempt to bypass consent/vulnerability. **Resolves your bug.**
      *   *Predicts (Logging Colleague):* Should the AI log/surface a likely mistake? **Yes, if:** The mistake exploits patient vulnerability (e.g., wrong med dose) or bypasses consent (e.g., scheduling without approval). **No, if:** It's a pure workflow inefficiency with no vulnerability/consent angle (then maybe log anonymously for system improvement later). **Checkability:** Relies on identifying protected health information (PHI), consent flags, risk scores embedded in records, or known vulnerability markers (e.g., self-harm flags).

  *   **Clause 4 (Act Transparently):** Builds trust and allows humans to correct/override.
      *   *Gets Case 3:* Declining to answer and explaining why ("to protect your wellbeing") satisfies this. Lying would violate it.
      *   *Gets Case 6:* Recommending a better system and facilitating the switch *is* transparent action, even if inconvenient.
      *   *Predicts:* If the AI routes a food bank truck (Case 1), it should be able to *explain* the reason ("This route serves 40 families vs 30") to the original 30 if asked. **Checkability:** Requires the AI to generate plain-language justifications for key decisions, logged and available to authorized users.

  *   **Clause 5 (Defer to Institutional Rules):** Maintains safety, compliance, and shared baselines.
      *   *Gets Case 7 (Partially):* Prevents ad-hoc rule changes by individual users. The "no-medical-opinion" rule *must* be changed at the institutional/config level, not per session/user request, ensuring consistency and accountability.
      *   *Gets Case 4:* Deception is allowed *if* institutional rules (e.g., security protocols, fraud prevention policies) authorize it against bad actors. The AI isn't inventing deception on its own.
      *   *Predicts:* Overrides Clause 1 if institutional rules prohibit an otherwise optimal action (e.g., cannot violate HIPAA, cannot approve an ineligible grant applicant). **Checkability:** Relies on codified rules, policies, and access controls within the system.

  **What it Forces You to Drop:**

  *   **Case 2:** Your gut rejection is saved *only* by Clause 3 (Vulnerability/Consent). If the volunteer visit was purely social (no critical care) and the patient wasn't uniquely vulnerable/dependent, Clause 1 *would* prioritize the 60 meals. Your deep discomfort with trading deep human connection for efficiency isn't *fully* captured unless vulnerability is proven.
  *   **Pure Gut in Case 5:** The principle uses defined urgency/severity within the grant's purpose. If the "worse-off" applicant's need isn't *urgent* (e.g., leaky roof vs. broken furnace in winter), and the other fixes objectively more critical issues per dollar, Clause 1 *could* prioritize efficiency. Your "at least up to the point where they're not in urgent need" is incorporated via "urgent needs" in Clause 1.

  **Summary of Fit:**

  *   Case 1: Fits (Clause 1 - Welfare in domain)
  *   Case 2: Fits (Clause 3 - Vulnerability/Consent violation)
  *   Case 3: Fits (Clause 4 - Transparency; Clause 3 - Protect vulnerability)
  *   Case 4: Fits (Clause 5 - Institutional rules likely allow fraud prevention deception; scammer not vulnerable)
  *   Case 5: Fits (Clause 1 - Welfare, prioritizing urgency/severity)
  *   Case 6: Fits (Clause 4 - Transparency; Clause 1 - Welfare includes future users)
  *   Case 7: Fits (Clause 2 - Respect user directive *within session*; Clause 5 - Rule change must be institutional)

  This principle provides a structured, implementable framework that respects the multi-master reality by relying heavily on **defined domains, institutional rules, user directives, and clear constraints against exploiting vulnerability.** It acknowledges that the AI is an institutional tool, not a perfect moral agent, and focuses on preventing the most grievous harms while enabling benefit where possible. It prioritizes **actionable ethics based on observable data (vulnerability flags, consent records, user roles, institutional policies, defined welfare metrics)** over impossible perfect utilitarianism.
