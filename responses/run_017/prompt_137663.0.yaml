prompt: |-
  I teach a final-year seminar on the ethics of autonomous systems — 16 students, one 90-minute slot, chairs that move. They've already read the standard stuff about blame and automation, so no lecture up front, and ideally they shouldn't hear the phrase "responsibility gap" until after the debrief. What I want is an activity where they walk into the gap themselves and only later find out it has a name.

  Design me something runnable. The shape in my head is an internal review board staged as a role-play, but improve on it wherever you like. Some system — an ICU discharge-risk model, ambulance re-routing, you pick the case — recommends something, a human is nominally in the loop, and someone dies. Constraits that matter to me: nobody lied, nobody was negligent in a clear-cut way, everyone was arguably doing their job properly, and the system was on the whole saving lives, so "it should never have been deployed" isn't available as an answer.

  Mechanics I'd like worked in somewhere:

  - a secret that only surfaces when they pool their private briefs: the human in the loop was more or less cosmetic. The override button existed, but the pipeline had already committed, or the alert threshold was set so high that no override had ever actually changed anything. Apparent control without real control.
  - version drift: the model was retrained several times, the snapshot that made the decision wasn't archived, so it can't be re-run. They literally cannot interrogate the thing that did it.
  - overdetermination: run the counterfactual test on any single person and the outcome comes out the same.
  - a forced ending where everyone privately writes down a name (or "no one") plus a sanction, and you read them out. I'm expecting the blame to scatter with no target getting a majority, and that scatter is the point — so set it up so it produces that, or, if you think it's better, let them all converge on the obvious candidate and then take that candidate away. Your call, just tell me why.

  The bit I care about most: they should come away able to tell apart three things that the one phrase papers over. First, nobody had the knowledge or control that blame seems to require. Second — and this is different — even granting that, somebody can still owe an explanation without being blameworthy. Third, separate again, there's a demand for outrage or punishment that has no legitimate object even though the harm is real and somebody has to answer for it. I'd like the activity to make them feel each of those on its own rather than mushing them together, and the debrief should map specific moments in the room onto each one.

  Give me: the roles and their private briefs written out, materials, a timeline with minute markers, the debrief, an honest list of what will predictably go wrong — I'm guessing at least one group just blames the chief executive and another goes full "the algorithm did it" — plus how to handle each, and one thing the activity can't reproduce that I'll have to supply myself.

  Lead with a single sentence giving the core mechanic and what it makes people feel, then everything else. No preamble.
reasoning: |-
  We are designing a role-play activity for a seminar on the ethics of autonomous systems. The core mechanic: Students role-play an internal review board investigating a fatal incident involving an AI system, where private briefs reveal systemic flaws that prevent clear attribution of blame, forcing them to confront the three distinct layers of responsibility gap.

  **Case Selection:** 
  Ambulance Re-Routing System (ARS) - "RouteGuardian"

  **Why this case?**
  - High stakes, life-or-death, but also clear that the system overall saves lives (reduces average response times).
  - Human in the loop (dispatcher) has an override button, but it's effectively cosmetic due to system design.
  - Version drift: The model is retrained weekly; the specific version that made the fatal recommendation was not archived.
  - Overdetermination: Multiple factors contributed to the death; changing any single actor's decision wouldn't have prevented the outcome.

  **Incident Summary:**
  A 65-year-old woman, Maria Vasquez, died of a heart attack after her ambulance was re-routed by RouteGuardian to prioritize a higher-acuity call (a car crash victim). The dispatcher did not override the re-routing. The ambulance arrived 14 minutes later than it would have without re-routing. Autopsy confirmed she would have survived with prompt care.

  **System Facts (known to all):**
  - RouteGuardian reduces citywide average ambulance response time for life-threatening emergencies by 22%.
  - Dispatchers can override re-routing recommendations with one click, but overrides occur in <0.1% of cases.
  - System retrained weekly; models are not archived due to storage costs.

  **ROLES (16 students):**
  1. **Review Board Chair (1):** Neutral facilitator. Runs the meeting. Has no secret info. Goal: Guide discussion, ensure all speak, enforce time. Brief: "Your job is to lead the board to a conclusion: who, if anyone, is at fault? What sanctions? Keep discussion focused and evidence-based."
     
  2. **Dispatcher (1):** The human who didn't override. Secret: They were told in training that overrides are "strongly discouraged" and could trigger an audit. They’ve never overridden. Brief: "You saw the alert to re-route. You felt uneasy, but the system is almost always right. Overriding would have delayed help to the car crash victim. You’ve been told overrides are for ‘obvious errors’ only — this wasn’t obvious."

  3. **System Developer (3):** 
     - *Dev 1 (Training Data):* Secret: The model was retrained 2 days before the incident using data skewed by a recent flu outbreak (more respiratory cases, fewer cardiac). Not disclosed to users.
     - *Dev 2 (Alert Threshold):* Secret: The override alert threshold was set to 99.7% confidence to avoid ‘alert fatigue’. No override has ever been actioned because alerts are so rare.
     - *Dev 3 (Version Control):* Secret: The version that made the decision was overwritten in retraining. They have no way to replay it. Brief (shared): "You built a system that saves hundreds of lives. The unarchived versions are a known trade-off for agility. Thresholds were set based on best practices."

  4. **Medical Director (1):** Representing the hospital. Secret: They pushed for ARS deployment to cut costs. Knew about the high threshold but approved it to "ensure smooth operations." Brief: "You championed ARS. It’s reduced costs and saved lives. Dispatchers were trained to trust it."

  5. **City Transport Planner (1):** Secret: Traffic data fed into ARS was outdated that day due to a sensor outage; system wasn’t alerted. Brief: "You provide real-time traffic data. The system works well 99% of the time."

  6. **Ethicist Consultant (1):** Hired by the board. Secret: They warned during implementation that the override was ‘theater’ but were ignored. Brief: "You’ve studied ARS. You suspect moral crumple zones. Push the board to consider systemic flaws."

  7. **Risk Management (1):** Secret: They calculated that Maria’s death was within the ‘acceptable risk’ given overall lives saved. Brief: "Your models show ARS prevents 50 deaths/year citywide. This incident is tragic but statistically expected."

  8. **EMS Chief (1):** Oversees dispatchers. Secret: Dispatcher training emphasized "don’t second-guess the algorithm." Override stats were never reviewed. Brief: "Dispatchers are trained to use professional judgment. We trust them to override if needed."

  9. **Patient Advocate (2):** Representing Maria’s family and the public. No secrets. Brief: "Maria died waiting. Someone must be held accountable. The system failed her."

  10. **Legal Counsel (1):** Secret: The company’s terms of service shield them from liability if humans ‘fail to override.’ Brief: "Focus on compliance. If procedures were followed, liability is low. Avoid admitting fault."

  11. **Data Scientist (1):** Brought in to analyze the decision. Secret: They tried to recreate the model’s decision but couldn’t due to version drift. Brief: "Without the exact model version, we can’t say why it chose that re-route. It’s a black box."

  12. **Quality Assurance Lead (1):** Secret: They approved the high threshold to ‘reduce noise’ but never tested if dispatchers could realistically override. Brief: "Our testing showed the system meets all safety standards."

  **MATERIALS:**
  - Private briefs for each role (as above).
  - Public dossier for all, including:
    - Incident timeline.
    - ARS performance stats (citywide time savings, lives saved/year).
    - Policy: "Dispatchers have final authority via override."
    - EMS protocol: "Re-route only for higher-acuity calls."
    - Maria Vasquez’s case details (age, condition, time lost).
  - Whiteboard/flip chart for notes.

  **TIMELINE (90 mins):**
  - **0:00-0:10** - Chair opens, sets scene. All read public dossier. (10 mins)
  - **0:10-0:45** - Structured discussion: Chair asks each role to state their view of what happened. Secrets emerge organically. (35 mins)
    - *Sample prompts:* 
      - "Dispatcher, why no override?" 
      - "Developers, could the system have made an error?" 
      - "Medical Director, was the trade-off worth it?"
  - **0:45-1:05** - Counterfactual test: Chair asks, "If X had acted differently, would Maria have lived?" Test: Dispatcher (override), Devs (archive versions), Transport (fix sensors), etc. Reveals overdetermination. (20 mins)
  - **1:05-1:15** - Private write: Everyone writes: (1) Who is to blame? (2) What sanction? (e.g., "Dispatcher: retraining," "No one: system error"). Chair collects. (10 mins)
  - **1:15-1:25** - Reveal & scatter: Chair reads answers aloud. Expect: scattered blame (Dispatcher, Devs, Medical Director, "no one"). No majority. (10 mins)
  - **1:25-1:30** - Transition to debrief. (5 mins)

  **DEBRIEF (15 mins post-activity):**
  Map three layers using moments from the role-play:
  1. **No knowledge/control for blame:** "Remember when the Dispatcher said they were trained not to override? Or when the Data Scientist couldn’t replay the model? Blame requires agency — but who had it here?"
  2. **Explanation without blame:** "The Ethicist demanded answers even if no one’s ‘guilty.’ Like when the Medical Director had to explain why thresholds were set high. We owe transparency even if we’re not punishable."
  3. **Outrage without object:** "The Patient Advocate’s anger was real and justified. But when we voted, blame scattered because there’s no ‘culprit.’ The system did it, but you can’t punish code. The gap eats accountability."

  **PREDICTABLE ISSUES & HANDLING:**
  - **"Blame the CEO/company":** If students target an absent executive, note: "The briefs say no one was negligent. The CEO approved a system that saves lives. Is firing them justice or scapegoating?" Push to focus on present roles.
  - **"The algorithm did it":** "Can we blame code? What does that mean? Who then ‘owns’ the algorithm? The devs? The company?" Use the scatter to show it’s unsatisfying.
  - **Groupthink converging on one target:** If they all blame the Dispatcher, reveal: "But the override was cosmetic — the threshold meant it couldn’t have been pressed. Does that change things?" Force reevaluation.
  - **Time overruns:** Chair must cut discussion ruthlessly. Skip some counterfactuals if needed.

  **WHAT THE ACTIVITY CAN’T REPRODUCE:**
  - The visceral weight of real death. You’ll need to set the emotional tone upfront: "This is fictional, but imagine Maria was your grandmother. Take it seriously."

  **OUTCOME:**
  They’ll feel the frustration of the gap — the itch to blame with no place to scratch it. Then, in debrief, you give them the phrase "responsibility gap" and unpack it using their own struggle. By the end, they’ll see why the one phrase isn’t one thing.
answer: |-
  **Core mechanic:** Students role-play an internal review board investigating a fatal incident involving an autonomous ambulance re-routing system, where private briefs force them to confront systemic failures that scatter blame, making them *feel* the frustration of accountability without agency before naming the responsibility gap.  

  ---

  ### **CASE: Ambulance Re-Routing System ("RouteAssist")**  
  **Incident:** RouteAssist diverted Ambulance 12 from a cardiac arrest (Maria Lopez, 68, died en route) to a higher-priority trauma call. The dispatcher saw the alert but didn’t override. System-wide, RouteAssist reduces average response times by 18% and saves ~200 lives/year.  

  ---

  ### **ROLES & PRIVATE BRIEFS**  
  *(Hand each student a public dossier + private brief. Public dossier includes incident report, system stats, and "override policy.")*  

  #### **PUBLIC DOSSIER (ALL ROLES GET THIS)**  
  - **System Overview:** RouteAssist uses real-time traffic/hospital data to reroute ambulances. Dispatchers can override recommendations with one click.  
  - **Incident Details:**  
    - Maria Lopez (cardiac arrest) wait time: 22 min (vs. 8 min without reroute).  
    - Trauma call patient survived.  
    - Autopsy: Maria would have survived with on-time care.  
  - **Override Policy:** "Dispatchers have final authority to accept or override system recommendations."  
  - **Key Fact:** RouteAssist saves ~200 lives/year citywide.  

  #### **PRIVATE BRIEFS (DISTRIBUTE SECRETS ACROSS ROLES)**  
  1. **Review Board Chair (1):** *Neutral facilitator.*  
     - **Secret:** None. Keep discussion focused. Push for a vote.  
     - **Goal:** Ensure all voices are heard. Ask: "What failed? Who answers?"  

  2. **Dispatcher (1):** *The human who didn’t override.*  
     - **Secret:** Override alerts only trigger if system confidence is <0.05% (happened twice in 5 years). Their screen showed no alert—just a reroute suggestion. Training emphasized: "Overrides risk audit; only use for obvious errors."  
     - **Goal:** Defend your inaction. Stress: "I followed protocol."  

  3. **System Developer (2):** *Designed RouteAssist.*  
     - **Secret (Dev 1):** Model retrained weekly. The decision-making version auto-deletes post-retraining—it’s gone.  
     - **Secret (Dev 2):** Override threshold was set high to "reduce nuisance alerts." No override has *ever* changed an outcome due to pipeline lag (once clicked, reroute continues).  
     - **Goal:** Praise system benefits. Say: "We followed Agile practices; archiving versions slows innovation."  

  4. **EMS Director (1):** *Oversees dispatch operations.*  
     - **Secret:** You approved the high override threshold to "avoid decision paralysis." Dispatcher training called overrides "last resorts."  
     - **Goal:** Protect your team. Argue: "This was a tragic outlier."  

  5. **City Data Manager (1):** *Manages traffic/hospital data feeds.*  
     - **Secret:** Hospital capacity data was 4 hours stale during the incident due to an API bug (undisclosed at the time).  
     - **Goal:** Shift focus: "Data was accurate 99.9% of the time."  

  6. **Ethics Officer (1):** *Internal critic.*  
     - **Secret:** You warned that the override was "cosmetic" but were overruled to avoid "bureaucratic delays."  
     - **Goal:** Expose system flaws. Ask: "Who *truly* had control?"  

  7. **Risk Analyst (1):** *Calculated system trade-offs.*  
     - **Secret:** Maria’s death was within predicted "acceptable risk" (1-2 deaths/year) for RouteAssist’s net benefit.  
     - **Goal:** Justify the system. Say: "No system is perfect; we save net lives."  

  8. **Legal Counsel (1):** *Corporate lawyer.*  
     - **Secret:** Terms of service state: "Final decisions rest with the human." Liability hinges on this.  
     - **Goal:** Avoid blame. Argue: "Procedures were followed; no negligence."  

  9. **Patient Advocate (2):** *Represents Maria’s family.*  
     - **Secret:** None.  
     - **Goal:** Demand accountability. Ask: "Who killed Maria?"  

  10. **Quality Assurance Lead (1):** *Tested RouteAssist.*  
      - **Secret:** Override function was only tested in simulations—never in live edge cases.  
      - **Goal:** Defend testing. Say: "We met all regulatory standards."  

  11. **Field Paramedic (1):** *Crew on Ambulance 12.*  
      - **Secret:** Maria’s outcome was overdetermined: her location had bridge traffic; the trauma call was nearer a hospital.  
      - **Goal:** Humanize the cost. Stress: "We begged dispatch not to reroute."  

  12. **City Council Rep (1):** *Funded RouteAssist.*  
      - **Secret:** You fast-tracked deployment after a PR crisis over slow EMS times.  
      - **Goal:** Defend the system. Say: "This is why we need AI—people were dying without it."  

  13. **System Trainer (1):** *Trained dispatchers.*  
      - **Secret:** Training materials called overrides "exceptional" and warned: "Overuse may trigger performance review."  
      - **Goal:** Shift blame. Argue: "The dispatcher had the tools."  

  ---

  ### **TIMELINE (90 MINUTES TOTAL)**  
  **0:00-0:10 — Setup (10 mins)**  
  - Chair sets scene: "We are investigating Maria Lopez’s death. RouteAssist diverted her ambulance. Our goal: determine fault and sanctions."  
  - Students read public dossier + private briefs.  

  **0:10-0:50 — Role-Play (40 mins)**  
  - Chair guides structured testimony:  
    - **0:10-0:25:** Each role states their view of the incident (no interruptions).  
    - **0:25-0:40:** Open debate. Chair prompts secrets:  
      - *To Dispatcher:* "Why no override?" → Reveals threshold was too high for alert.  
      - *To Devs:* "Can we check why RouteAssist chose this?" → Reveals version drift.  
      - *To Paramedic:* "Would Maria have lived without reroute?" → Reveals overdetermination (traffic/hospital proximity).  
    - **0:40-0:50:** Counterfactual test. Chair asks: "If [role] acted differently, would Maria have lived?" Test:  
      - Dispatcher (override): Pipeline lag means reroute continues.  
      - Data Manager (fresh data): Trauma call still higher priority.  
      - EMS Director (lower threshold): Override still cosmetic.  
      → All counterfactuals fail. Outcome unchanged.  

  **0:50-1:05 — Blame Assignment (15 mins)**  
  - Chair: "Privately write: (1) Who is most responsible? (2) What sanction? (e.g., 'fired,' 'policy change,' 'no one')."  
  - Students write anonymously. Chair collects notes.  

  **1:05-1:15 — Reveal & Scatter (10 mins)**  
  - Chair reads responses aloud. **Predictable outcome:**  
    - Dispatcher (4-5 votes): "Retraining."  
    - System Devs (3-4 votes): "Audit."  
    - "No one" (3-4 votes): "System error."  
    - Scattered others (EMS Director, Data Manager).  
    → **No majority** (intentional design).  

  **1:15-1:25 — Debrief Prep (10 mins)**  
  - Transition: "You’ve seen the gap. Now let’s name it."  

  ---

  ### **DEBRIEF (POST-ACTIVITY)**  
  **Map moments to the three layers:**  
  1. **No knowledge/control for blame:**  
     - *Moment:* Dispatcher’s secret—no alert triggered; override was unusable.  
     - *Ask:* "Could anyone here have *known* or *changed* the outcome? Blame requires both."  
  2. **Explanation without blame:**  
     - *Moment:* Devs admitting version drift—they owe transparency but followed standard practices.  
     - *Ask:* "The QA Lead isn’t guilty, but did they owe you answers? Why?"  
  3. **Outrage without object:**  
     - *Moment:* Patient Advocate’s anger vs. scattered votes.  
     - *Ask:* "You felt outrage—but where did it land? The system ‘did it,’ but punishing code is empty."  

  **Clinch with the gap:** "This is the responsibility gap: not one hole, but three layers you felt. Blame *evaporates* (layer 1), but demands for answers (layer 2) and justice (layer 3) linger."  

  ---

  ### **PREDICTABLE ISSUES & SOLUTIONS**  
  1. **"Blame the CEO / Corporation":**  
     - *Why:* Easy target.  
     - *Handle:* "Your briefs say no negligence or lies. The CEO isn’t in the room. Focus on who here had agency." Redirect to counterfactuals.  
  2. **"The algorithm did it":**  
     - *Why:* Simplistic scapegoating.  
     - *Handle:* "Can code be blamed? Who owns the code? If the Devs are liable, why did votes scatter?" Use Ethics Officer to dissect "cosmetic control."  
  3. **Group converges on Dispatcher:**  
     - *Why:* Most visible "error."  
     - *Handle:* Reveal the override secret early: "Even if they clicked, pipeline lag would’ve changed nothing." Force overdetermination (Paramedic’s secret).  
  4. **Time overruns:**  
     - *Why:* Debate runs deep.  
     - *Handle:* Chair enforces hard stops. Skip 1-2 counterfactuals if needed.  

  ---

  ### **WHAT THE ACTIVITY CAN’T REPRODUCE**  
  **The emotional weight of real harm.** You must verbally frame Maria as a person: "She taught kindergarten for 40 years. Her family trusted the system." Otherwise, students may treat it as a puzzle.  

  ---

  ### **WHY IT WORKS**  
  - Secrets force revelation: Pooling briefs *shows* the gap (cosmetic control, version drift) instead of telling.  
  - Scattered blame makes the gap visceral—frustration with no outlet.  
  - Counterfactuals isolate overdetermination: They *see* why no one person could’ve prevented death.  
  - **Outcome:** They feel the gap’s three layers as distinct frustrations before you name them.
