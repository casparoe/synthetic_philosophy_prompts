prompt: |-
  I sit on the allocation committee of a small research-funding foundation, and two colleagues have argued for a year about one recurring pattern in our proposal pipeline. The Fanatic: if our best model assigns a proposal positive expected value, we fund it, whatever the probability of success and whatever the ratio of upside to cost. The Anti-Fanatic: past some ratio of stakes to confidence, expected value stops being action-guiding; she applies what she calls a reliability rule, under which a probability estimate is decision-relevant only if it survives re-derivation under every model in our ensemble that we have not ruled out. The case on the table: Option S returns roughly 4,000 units of value with probability about 0.95; Option L costs the same and returns 10^22 units with probability 3×10^-9, where that figure comes from a single structural model whose track record we cannot yet score.

  Write the joint statement they should have produced instead. First a numbered list of claims both can sign, then a table of the residual disagreements, each row phrased as that side would phrase it rather than as the other would paraphrase it. My guess is that they agree on moderate-probability, moderate-stakes cases, on treating model uncertainty as a mixture over models rather than a footnote, and on there being no Dutch-book argument available here; tell me if any of that is wrong.

  Then the cruxes, and for each a case or piece of evidence both accept as bearing on it, with each side's prediction written down in advance. Four I want covered, though add or drop as the drafting requires:

  1. The clean-lottery case: a physically known 1-in-10^9 chance at 10^22 units, finite stakes, one shot, no model uncertainty. If she funds it, her objection was epistemic all along and this is a dispute about error bars; if she declines it, the dispute is about whether expected value is normative at all. Say which, plainly.
  2. Whether the reliability rule is a hard cutoff or a continuous reweighting of the probability. If continuous, is she simply a Fanatic working with different inputs, and is that row of the table verbal?
  3. The portfolio argument: we make about forty allocations a year, so he says discarding each small probability loses in aggregate, while she says the aggregate upside is itself model-dependent. Is that one crux or two, and what would a Monte Carlo over our model ensemble have to show to settle it?
  4. How well expert-assigned probabilities near 10^-9 have historically tracked observed frequencies — the only empirical question I think both would accept as evidence. Record what each predicts we would find and what result would actually move each of them.

  Mark explicitly any row where the disagreement is about words rather than about the world, and give the wording that dissolves it. Argue from the cases and the numbers only; no citations, no reading lists, no references to the literature.
reasoning: |-
  Hmm, the user is part of a research funding committee dealing with a philosophical dispute between two colleagues - "The Fanatic" and "The Anti-Fanatic" - about how to evaluate high-risk, high-reward proposals. They need help crafting a joint statement that clarifies both their agreements and disagreements.

  The core disagreement centers on Option L: a proposal with astronomically high potential returns (10²² units) but extremely low probability of success (3×10⁻⁹), based on a single unvalidated model. The Fanatic wants to fund anything with positive expected value, while the Anti-Fanatic applies a "reliability rule" requiring probabilities to survive scrutiny across all plausible models.

  From the user's description, I can identify several key areas of agreement: both accept expected value calculations for moderate cases, treat model uncertainty seriously, and acknowledge no Dutch-book argument applies here. The user specifically requests analysis of four cruxes with testable predictions.

  For the joint statement, I'll structure it with:
  1) A numbered list of undisputed claims
  2) A table contrasting their positions in their own words
  3) Analysis of the four specified cruxes with concrete test cases

  For the clean-lottery crux, the critical test is whether the Anti-Fanatic would fund a physically verified 1-in-10⁹ chance. If she declines, it reveals a fundamental rejection of expected value theory rather than just epistemic concerns.

  For the reliability rule, I need to determine whether it's a hard cutoff or continuous function - this affects whether it's truly a different framework or just different input weighting.

  The portfolio argument splits into two questions: whether aggregation helps, and whether model uncertainty invalidates the aggregation. A Monte Carlo simulation across their model ensemble could resolve this.

  The historical frequency analysis is crucial - if data shows expert-assigned ~10⁻⁹ probabilities consistently match outcomes, it undermines the reliability rule. I'll specify what evidence would sway each party.

  Throughout, I'll flag purely terminological disagreements and suggest clarifying language. The focus remains strictly on cases and numbers per the user's request, avoiding theoretical tangents.
answer: |-
  Below is the joint statement drafted as requested. It reflects mutual understanding while preserving substantive disagreements, with all claims and predictions grounded solely in the described cases and numerical values.

  ### Joint Statement of Agreements
  1.  **Moderate Cases:** For proposals with success probabilities between 0.1 and 0.9 and stakes/cost ratios below 10^6, expected value (EV) is sufficient for funding decisions.
  2.  **Model Uncertainty:** All probability estimates and EV calculations must account for model uncertainty. This is treated by considering an ensemble of plausible models, not as an afterthought.
  3.  **No Dutch Book:** There is no demonstrable "Dutch book" (arbitrage opportunity) forcing adherence to EV maximization in the Option L case or its analogs. The disagreement is normative and epistemic, not purely logical.
  4.  **Option S is Fundable:** Option S (95% chance of 4000 units) comfortably meets our funding threshold under either approach.
  5.  **Option L's EV is Positive:** The nominal EV of Option L (3e-9 * 1e22 = 30,000 units) is positive and exceeds its cost.
  6.  **Model Dependence:** The 3e-9 probability for Option L derives solely from a single, unscored structural model. Its reliability is contested.

  ### Table of Residual Disagreements (Stated in Own Words)
  | The Fanatic's Position                                                                 | The Anti-Fanatic's Position                                                                                             |
  | :------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- |
  | 1. Any proposal with a positive expected value, however small the probability or large the stakes, must be funded. | 1. Expected value becomes non-action-guiding when the nominal probability is extremely low relative to the claimed stakes, as in Option L (p=3e-9, upside=1e22). |
  | 2. Discarding positive-EV opportunities *always* reduces aggregate returns over many trials, including our portfolio of ~40 allocations/year. | 2. The aggregate upside of funding many Option L-type proposals is illusory if the underlying probability estimates lack reliability across our model ensemble. |
  | 3. The 3e-9 estimate is our best available input. We must act on it unless we have specific evidence it is wrong. Not acting is equivalent to assigning it p=0. | 3. A probability estimate is decision-relevant only if it survives re-derivation under every plausible model in our ensemble that we have not definitively ruled out. The 3e-9 estimate fails this reliability rule. |

  ### Analysis of Key Cruxes

  **Crux 1: The Clean-Lottery Case**
  *   **Case:** A physically fair, known one-shot lottery: Cost = C units. 1-in-10^9 chance to win 10^22 units.  (EV = 10^13 units).
  *   **Fanatic's Prediction:** Funds it. Expected value is normative.
  *   **Anti-Fanatic's Prediction:** **Declines it.** *(Dispute Nature: This reveals the dispute is **not solely epistemic** (about error bars). The Anti-Fanatic rejects EV maximization itself as normative for decisions involving extreme stakes/probabilities, even under perfect information.)*
  *   **Evidence Status:** This case isolates the core normative disagreement. If the Anti-Fanatic declines the clean lottery, she fundamentally objects to EV maximization in this domain.

  **Crux 2: Nature of the Reliability Rule**
  *   **Question:** Is the reliability rule a hard cutoff or a continuous reweighting?
  *   **Anti-Fanatic's Clarification (Own Words):** "It acts as a de facto **hard cutoff**. If a probability estimate collapses under scrutiny within plausible alternative models (i.e., cannot be re-derived), it is excluded from decision-making. Models generating unreliable estimates are effectively ruled out for *that specific probability assertion*."
  *   **Disagreement Type:** **Verbal/Procedural**. If the rule is a hard cutoff excluding models/probabilities, the Anti-Fanatic is **not** simply a Fanatic with different inputs. She is applying a distinct decision rule (exclusion based on robustness). If it were merely continuous reweighting *within* an EV framework, she would be a Fanatic variant. The phrasing above clarifies it's exclusionary.
  *   **Resolution Wording:** "The reliability rule disqualifies probability estimates that are not robust across the plausible model ensemble, rather than continuously reweighting them within an expected value calculation."

  **Crux 3: The Portfolio Argument (Two Sub-Cruxes)**
  *   **3a. Does discarding individual small chances harm aggregate returns?**
      *   **Case:** Funding 40 independent proposals per year, each with a *known, reliable* p=3e-9 chance of 1e22 units, cost C. (Aggregate EV = 40 * 3e-9 * 1e22 = 1.2e15 units).
      *   **Fanatic's Prediction:** Funding the portfolio yields massive positive aggregate EV. Discarding each loses this value.
      *   **Anti-Fanatic's Prediction:** **Funds this portfolio.** *Here the probabilities are known and reliable.* The aggregate upside is real.
      *   **Settling Evidence:** Agreement exists *if* probabilities are reliable. Disagreement on Crux 3a vanishes under known probabilities.
  *   **3b. Does model uncertainty invalidate the portfolio argument?**
      *   **Case:** Funding 40 proposals per year like Option L, each relying on distinct, unscored structural models giving ~1e-22 type payoffs with p~1e-9.
      *   **Fanatic's Prediction:** The nominal aggregate EV is large (similar to 3a). Funding is optimal.
      *   **Anti-Fanatic's Prediction:** The aggregate upside is model-dependent and unreliable. Funding is not justified.
      *   **Settling Evidence (Monte Carlo):** A Monte Carlo simulation over the foundation's *actual model ensemble* must show whether the *robustly supported aggregate EV* is positive. Specifically: For each proposal, sample models from the ensemble, recalculate p(Success) under each sampled model, compute proposal EV under that model, sum EVs across proposals. If the distribution of this aggregate EV is robustly positive (e.g., >95% of samples >> Cost * 40), it favors the Fanatic. If it is frequently negligible or negative, or shows extreme variance due to model uncertainty, it favors the Anti-Fanatic.

  **Crux 4: Historical Performance of Expert Probabilities ~10^-9**
  *   **Empirical Question:** How well have expert-assigned probabilities in the range of ~10^-9 (e.g., 10^-8 to 10^-10) historically tracked observed frequencies in contexts relevant to scientific research funding?
  *   **Fanatic's Prediction:** "While difficult to calibrate, expert probabilities in this range have shown no *systematic, order-of-magnitude* bias towards overconfidence or underconfidence relative to true frequencies over large sets of similar predictions. They are our best estimate."
  *   **Anti-Fanatic's Prediction:** "Expert probabilities in the ~10^-9 range are notoriously unreliable. Historical data will show significant systematic overconfidence (assigned probabilities >> observed frequencies) or extreme variance, indicating they lack the robustness required for high-stakes decisions."
  *   **What Would Move Them:**
      *   **Move Fanatic:** Evidence showing a *consistent, large magnitude* (e.g., >10x) *underestimation* (assigned p << observed freq) for probabilities ~10^-9. This would suggest his approach is systematically *under*funding high-upside projects.
      *   **Move Anti-Fanatic:** Evidence showing *no systematic bias* and *low dispersion* (e.g., observed frequencies consistently within a factor of 3 of assigned p for probabilities ~10^-9) across a large, relevant dataset. This would undermine the claim that such estimates are inherently unreliable. (Evidence of overconfidence would reinforce her position).
