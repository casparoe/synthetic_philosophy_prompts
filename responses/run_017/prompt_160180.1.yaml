answer: |-
  ## PARTICIPANT INFORMATION SHEET & INFORMED CONSENT FORM
  **Protocol:** OPERATION CLOCKWATCHER (Ref: 14-B/OMNI-Δ)
  **Principal Investigator:** [REDACTED], Temporal Dynamics Lab, [REDACTED] University
  **Ethics Ref:** [REDACTED]/IRB/NeuroClock
  **Version:** 1.2 (2023-10-27)

  **1. Purpose of the Study**
  The Temporal Dynamics Lab is investigating the neuro-temporal correlates of spontaneous motor intention. The study aims to identify and characterize electrical potentials ("Readiness Potentials" or RPs) in the brain that precede self-initiated movements. We seek to quantify the temporal relationship between these electrophysiological markers, the subjective experience of intending to move ("W"), and the subsequent motor action. This research contributes to fundamental models of volition and the neural antecedents of conscious experience. The operational definition of "spontaneous motor intention" for this study is the reported urge to flex the wrist at a time of the participant's choosing during the task structure.

  **2. Eligibility**
  You may participate if you are:
  *   Aged 18-65 years.
  *   Right-handed (as defined by the Edinburgh Handedness Inventory Short Form).
  *   Free from known neurological disorders (e.g., epilepsy, Parkinson's disease).
  *   Capable of providing informed consent.
  *   Comfortable wearing an elastic cap containing electrodes for approximately 60 minutes.
  *   Able to perform small, rapid wrist flexion movements with your dominant hand repeatedly.
  *   Willing to report the perceived position of a moving visual stimulus with an estimated precision of ±50ms, based on retrospective introspection.

  **3. Study Procedures**
  3.1. **Preparation:** You will be seated comfortably. A conductive gel will be applied to your scalp, and an electroencephalography (EEG) cap containing 64 electrodes will be fitted to record electrical activity from your brain. Electrodes will also be placed near your eyes to detect blinks and on your dominant forearm to record muscle activity (electromyography, EMG).
  3.2. **Task:** You will observe a circular display on a monitor. A dot ("clock-hand") will sweep continuously around the circle, completing one revolution every 2.56 seconds (operationalizing a "clock" for temporal estimation).
  3.3. **Spontaneous Movement Instruction:** You will be instructed to flex your dominant wrist **"spontaneously"** whenever you feel the urge to do so. **Crucially, you are instructed to avoid pre-planning the exact moment of movement, counting revolutions, or establishing rhythmic patterns.** However, to acquire sufficient data, you will be required to produce such spontaneous movements approximately once every 4-10 seconds, for a total of 150-200 trials per session. The tension between the instruction for spontaneity and the requirement for frequent, repeated movements is an inherent feature of the experimental design aimed at generating statistically analyzable neural data.
  3.4. **Intention Report:** Immediately after each wrist flexion, you will be asked to report the position of the clock-hand at the moment you first became aware of the urge to move (termed "W"). This report relies on your subjective introspection and memory of the visual stimulus timing, and constitutes the primary operational measure of the "time of conscious intention".
  3.5. **EEG/EMG Recording:** Throughout the task, electrical activity from your brain (EEG) and forearm muscle (EMG) will be continuously recorded and time-locked to both the reported "W" time and the actual movement onset (as determined by EMG).
  3.6. **Data Processing:** The EEG data will be processed offline. Key steps include:
      *   **Trial Averaging:** Individual EEG traces from each movement trial will be aligned (typically to the EMG-defined movement onset or the reported "W") and averaged together. This averaging amplifies consistent signal patterns (like the RP) while reducing inconsistent background noise. **Note: The apparent temporal onset and morphology of the averaged RP are products of this specific averaging technique and the alignment point chosen; variations in methodology can significantly alter the measured onset latency and slope.**
      *   **RP Onset Determination:** The onset of the RP in the averaged waveform will be identified using statistical criteria (e.g., point where signal deviates significantly from baseline). **Note: The selection of baseline period, statistical threshold (e.g., p<0.05), and algorithm for detecting deviation are necessarily arbitrary conventions within the field. Different criteria yield different "onset" times.**
      *   **Temporal Analysis:** The temporal sequence will be analyzed: RP Onset (Averaged) --> Reported "W" (Subjective Report) --> EMG Onset (Movement). **Note: The interpretation of this sequence, particularly regarding causality and the role of conscious intention ("W"), is a subject of ongoing theoretical debate. The presence of a neural precursor (RP) does not, by itself, definitively establish the causal impotence or epiphenomenal nature of the subsequent conscious report ("W").**

  **4. Potential Risks & Discomforts**
  4.1. **Physical Discomfort:** Wearing the EEG cap may cause mild pressure or discomfort. The conductive gel may feel cold or slightly sticky. Cleaning the gel off afterwards may require washing your hair.
  4.2. **Boredom/Fatigue:** The task is highly repetitive and requires sustained attention, which may cause boredom, fatigue, or mild frustration, particularly given the inherent tension between spontaneity and repetition (Section 3.3).
  4.3. **Minimal Movement Restriction:** You will need to minimize head and body movement during EEG recording to reduce muscle artifact in the data. Blinking should be minimized during critical periods around the movement.
  4.4. **Metaphysical Discomfort (Theoretical):** Discussions surrounding the interpretation of findings like those this study aims to replicate (e.g., the temporal sequence RP -> W -> Movement) often touch upon philosophical questions concerning free will and determinism. While the study itself reports correlational data, some interpretations of such data have been used to argue for specific metaphysical conclusions. You may experience discomfort contemplating these interpretations. Anonymized data *may* be used in future secondary analyses exploring neural precursors of "veto" decisions (inhibition of an urge), although the neural requirements for preparing *not* to move remain theoretically contested.

  **5. Data Handling & Confidentiality**
  5.1. All data collected (EEG, EMG, behavioral responses, questionnaire data) will be stored securely on password-protected servers at [REDACTED] University.
  5.2. Data will be anonymized using a participant code; your name will not be linked to the data in any publications or presentations.
  5.3. Anonymized data may be shared with collaborating researchers or deposited in public repositories for scientific verification and further analysis.
  5.4. Data will be retained for a minimum of 10 years after study completion as per university policy.

  **6. Benefits**
  You will receive $[AMOUNT] as compensation for your time. There is no direct therapeutic benefit from participation. You will contribute to advancing scientific understanding of human brain function related to voluntary action.

  **7. Your Rights**
  7.1. **Voluntary Participation:** Your participation is entirely voluntary.
  7.2. **Right to Withdraw:** You have the right to withdraw from the study at any time, for any reason, without penalty or loss of benefits to which you are otherwise entitled. Data collected prior to withdrawal may still be used in anonymized analysis unless you specifically request its destruction.
  7.3. **Right to Ask Questions:** You may ask questions about the study at any time before, during, or after participation. Contact the PI: [REDACTED EMAIL/PHONE].

  **8. Indemnity**
  [REDACTED] University maintains liability insurance applicable to claims arising from research negligence. This insurance does not cover claims arising from your failure to follow study instructions. Compensation is for time, not risk.

  **9. Participant Declaration & Acknowledgment of Theoretical Implications (Optional Checkbox)**
  By signing below, I confirm that:
  *   I have read and understood the information sheet (Version 1.2).
  *   I have had the opportunity to ask questions and received satisfactory answers.
  *   I understand my participation is voluntary and I may withdraw at any time.
  *   I consent to the procedures described, including the application of EEG gel, cap fitting, EMG electrodes, and the repetitive spontaneous movement task with clock reporting.
  *   I consent to the anonymized use and potential sharing of my data as described.
  *   I understand the compensation and that participation offers no direct benefit.

  **Additionally, regarding the theoretical interpretations discussed in Section 4.4 and inherent in the design's reliance on operationalized "spontaneity" (3.3), averaged neural precursors (3.6), and subjective timing reports (3.4):**

  *   **□ I acknowledge that the methodology and typical findings of this paradigm are often interpreted as demonstrating that the brain initiates spontaneous actions before the reported conscious intention, and that this conscious intention ("W") may not be the causal origin of the action.** *(This interpretation reflects a common, though debated, inference from the data pattern.)*
  *   **□ I identify as a compatibilist regarding free will and do not accept that the data pattern described necessarily invalidates my preferred conception of free will.** *(This interpretation reflects an alternative philosophical perspective.)*

  *(Checking one box is optional but helps gauge participant perspective. Checking neither box implies no concession regarding the interpretation.)*

  ---

  **Participant Signature:** _________________________ **Date:** ___________
  **Printed Name:** _________________________

  **Investigator Signature:** _________________________ **Date:** ___________
  **Printed Name:** [REDACTED]

  *Copy provided to participant.*

  ---

  **Scientific Context & Parodic Liberties (Approx. 150 Words):**

  This parody accurately targets core methodological debates in the Libet paradigm and its descendants: the inherent arbitrariness in defining RP onset in averaged data; the tension between instruction ("spontaneous") and requirement (frequent, timed movements); and the significant leap from observing a neural precursor to concluding conscious intention is causally inert. It highlights valid concerns about the clock method's reliability and the challenges of interpreting averaged signals as representing a single "decision process". The "decoding seconds before" point references newer multivariate pattern analysis studies, where claims are often robust statistically but philosophically contentious regarding "pre-conscious" decisions.

  The parody leans most heavily in Section 9, presenting a stark dichotomy between epiphenomenalism and compatibilism. While the data *is* used to argue for epiphenomenalism, the field's conclusions are more nuanced, and compatibilism isn't usually presented as an opt-out on a form. The point I'm least confident about satirizing fairly is the "veto carve-out" (4.4). The science on neural precursors to *inhibition* is less mature and more contested than for action initiation. The parody implies it's an ad-hoc saving move, which is a *critique* sometimes leveled, but the actual research is ongoing and complex. The form simplifies this significantly for the joke.
