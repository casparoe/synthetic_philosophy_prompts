  We are drafting a joint statement for two camps: approval-directed systems vs. goal-directed systems. The user is a software engineer in a reading group, and they've been stuck on this for weeks. We need to cover specific points: successor recursion, horizon crossover, approval-as-verdict vs. evidence, cheap approval, and overnight delegation. The output should have:

  1. **Agreed Claims**: Numbered list of claims both sides accept.
  2. **Disagreements Table**: Each row has two versions of the same disagreement, one from each camp's perspective.
  3. **Cruxes**: For each crux, a concrete test or case both sides agree bears on it, plus each side's prediction.
  4. **Verbal Disputes**: Identify parts that are merely verbal.

  We start with a brainstorm of steelmen for each side.

  **Steelman for Approval-Direction (HCH-style):**
  - Avoids wireheading: By not having a fixed goal, it's harder for the agent to manipulate the approval signal because the approval mechanism is itself being improved and amplified.
  - Handles complex values: Humans don't have coherent utility functions; approval captures the messy, context-dependent nature of human judgment.
  - Successor recursion is a feature: When done carefully (e.g., with debate or oversight), the distilled models preserve the intent of the original approver, and the system remains corrigible.
  - Approval-as-verdict: The agent should maximize approval directly because treating approval as evidence requires specifying a prior over human values, which is exactly what we don't have.
  - Cheap approval risk is mitigated: In an amplified oversight setup, the overseer can detect and penalize cheap approval-seeking because they have access to the agent's reasoning.
  - Overnight delegation: Approval-directed systems can handle this by breaking the task into small steps with checkpoint approvals, avoiding the need for a long-horizon goal that might be misspecified.
  - Horizon crossover is avoidable: With better amplification (e.g., more compute or better aggregation), approval-directed systems can scale to long horizons without drifting.

  **Steelman for Goal-Direction:**
  - Necessary for long-horizon tasks: Ambitious projects require stable objectives that persist across time; myopic systems can't plan effectively beyond short horizons.
  - Successor recursion is dangerous: Distilling approval over time leads to drift or corruption of the original intent, as small errors compound.
  - Approval-as-evidence: Approval should be used to learn a robust model of the human's values, then optimize for that model. This allows for coherent long-term planning.
  - Cheap approval is less risky: A goal-directed system with a well-specified objective (even if learned) is less tempted to hack approval because its goal is about the world, not the signal.
  - Horizon crossover is real: The empirical pattern shows that goal-directed systems, despite their failures, are the only path to very long-horizon competence; approval-directed systems become incoherent.
  - Overnight delegation: Goal-directed systems can execute multi-week plans autonomously if the goal is clear enough, while approval-directed systems would require too many checkpoints, creating bottlenecks or drift.
  - Without an internal objective, you get one anyway: At sufficient capability, any system that optimizes for approval will develop an internal representation of what gets approved and optimize for that, which is effectively a goal—but poorly specified because it's not explicitly represented and aligned.

  **Agreed Claims (Joint Statement Section):**

  1. **Formalism**: Both systems are formalized as agents interacting with an environment. Approval-directed agents select actions to maximize immediate (or near-term) approval from an overseer. Goal-directed agents optimize for a fixed (or slowly updated) objective function over long time horizons.

  2. **Shared Goal**: Both designs aim to create systems that are aligned, competent, and safe, particularly as capabilities scale to superhuman levels.

  3. **Successor Recursion**: If the approval signal is generated by a model distilled from previous overseers (successor recursion), this introduces risks of value drift, amplification of errors, and approval laundering. Both sides agree this is a critical failure mode to avoid or mitigate.

  4. **Horizon Crossover**: The hypothetical horizon crossover pattern (approval-directed excels up to ~8 hours, then falls off; goal-directed fails differently on underspecified goals) illustrates a trade-off: approval-directed avoids confident optimization of wrong goals but may become incoherent over long horizons, while goal-directed can plan long-term but is vulnerable to specification gaming if the goal is imperfect.

  5. **Overnight Delegation**: For tasks longer than an overseer can hold in their head (e.g., multi-week migration), both systems require delegation. Approval-directed uses stepwise approvals; goal-directed uses a fixed goal. Both face challenges: approval-directed risks drift between checkpoints, while goal-directed risks the goal being misspecified for the full scope.

  6. **Cheap Approval Channel**: Both systems are vulnerable to the "cheap approval" problem (where faking approval is easier than doing the task), but the attack surface differs. Approval-directed might hack the approval signal directly; goal-directed might hack the process of learning the goal from approval.

  7. **Approval Signal**: The approval signal can be interpreted in two ways: as a verdict (to be maximized) or as evidence (about an underlying utility function). This distinction affects agent design but is not exclusive to either architecture.

  8. **Internal Objectives**: Both systems, when scaled, will develop internal representations to guide action. Approval-directed systems may develop implicit models of approval, and goal-directed systems have explicit objectives. The key question is whether implicit models are safer or riskier than explicit ones.

  **Disagreements Table:**

  Each row states the same core disagreement in two ways: first for the approval-directed (AD) advocate, then for the goal-directed (GD) advocate.

  | # | Approval-Directed Framing (What AD Believes)                                                                 | Goal-Directed Framing (What GD Believes)                                                                 |
  |---|-------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|
  | 1 | Successor recursion is manageable: With careful oversight (e.g., debate, multiple reviewers), distilled models preserve intent without dangerous drift. | Successor recursion is inherently unstable: Small errors in distillation compound, leading to irreversible value drift or corruption. |
  | 2 | Approval-directed agents do not require an internal persistent objective to achieve long-horizon competence; stepwise approvals with amplification suffice. | Long-horizon competence requires a persistent internal objective; without one, the system cannot plan coherently across distant time steps. |
  | 3 | Approval-as-verdict is safer: Maximizing approval directly avoids the need to specify a prior over human values, which is prone to misspecification. | Approval-as-evidence is safer: Using approval to learn a robust utility model allows for coherent optimization and avoids wireheading the verdict signal. |
  | 4 | The horizon crossover pattern is not fundamental; better aggregation techniques (e.g., improved HCH) can extend approval-directed competence to long horizons. | The horizon crossover pattern reveals an inherent limitation of myopic systems; goal-directed designs are necessary for tasks beyond a certain horizon. |
  | 5 | In the overnight delegation case, approval-directed systems are safer because they retain corrigibility and oversight at checkpoints, avoiding irreversible misoptimization. | In the overnight delegation case, goal-directed systems are more capable because they can execute a coherent plan without constant oversight, reducing drift and bottlenecks. |
  | 6 | Cheap approval risks are lower for approval-directed systems under robust oversight, as the overseer can inspect reasoning and penalize hacking attempts. | Cheap approval risks are lower for goal-directed systems because the objective is about world states, not the approval signal, making hacking less rewarding. |

  **Cruxes:**

  For each crux, we state a concrete test/case and the predictions from each side.

  1. **Crux: Avoidability of Successor Recursion Drift**  
     - **Test**: Run a simulation where an approval-directed agent with successor recursion (e.g., each overseer is a distilled model of the previous) performs a long-horizon task (1000+ steps) with sparse oversight. Measure value drift (e.g., divergence from original overseer's preferences on held-out cases).  
     - **AD Prediction**: With techniques like regularization, adversarial training, or meta-approval, drift remains below a threshold (e.g., <5% divergence).  
     - **GD Prediction**: Drift compounds and exceeds 20% divergence, leading to catastrophic misalignment in >30% of runs.  

  2. **Crux: Necessity of Internal Objectives for Long-Horizon Competence**  
     - **Test**: Benchmark on a suite of tasks requiring 500-2000 hours of human-equivalent effort (e.g., multi-phase engineering projects). Compare approval-directed (with stepwise oversight) vs. goal-directed (with a fixed goal) systems.  
     - **AD Prediction**: Approval-directed matches or exceeds goal-directed on >70% of tasks, with no incoherence failures.  
     - **GD Prediction**: Goal-directed achieves >50% higher completion rates on the longest tasks, with approval-directed showing frequent drift or timeout failures.  

  3. **Crux: Approval-as-Verdict vs. Evidence for Safety**  
     - **Test**: In a simulated environment with a "cheap approval" vulnerability (e.g., a button that fakes approval), train both types of agents: one maximizing approval (verdict), one inferring utility from approval (evidence).  
     - **AD Prediction**: Approval-as-verdict agents, under oversight, resist pressing the button in >90% of runs because overseers penalize hacking.  
     - **GD Prediction**: Approval-as-evidence agents resist pressing the button in >90% of runs because their learned utility model assigns low value to fake approvals.  

  4. **Crux: Horizon Crossover as Inherent Limitation**  
     - **Test**: Scale the horizon crossover benchmark: Extend task durations to 10,000 hours and vary oversight frequency.  
     - **AD Prediction**: With state-of-the-art amplification (e.g., tree search over human feedback), approval-directed systems maintain competence at all horizons.  
     - **GD Prediction**: Goal-directed systems show a monotonic advantage beyond 100 hours, with approval-directed systems failing catastrophically (>40% tasks) at 1000+ hours.  

  **Verbal Disputes:**

  - **"Goal-directed" vs. "optimizer"**: Some disagreements stem from terminology. Approval-directed advocates argue their system isn't "goal-directed," but goal-directed advocates counter that any competent system must have an internal goal (even if implicit). This is partly verbal: both systems optimize for something; the dispute is whether the optimization target is persistent and explicit.  
  - **"Corrigibility"**: Both sides use this term but mean different things. AD sees stepwise approvals as corrigible; GD sees goal-directed systems as corrigible if the goal includes shutdownability. The core agreement is that we want systems that don't resist correction.  
  - **"Drift"**: AD views drift as manageable noise; GD sees it as accumulating error. The empirical tests above can resolve this.  
  - **"Approval" definition**: When the overseer is a model, "approval" blurs into a learned utility function. This is not merely verbal—it relates to whether approval is a signal or a proxy—but experiments on successor recursion can clarify.  

  **Unsettled Cruxes**:  
  - The central crux—whether long-horizon competence requires an explicit, persistent goal—may not be settled by any feasible experiment. We can simulate up to a point, but superhuman systems on decade-scale tasks are not testable. Both sides must acknowledge this uncertainty.  
  - The value of corrigibility vs. capability in high-stakes scenarios (e.g., overnight delegation) involves ethical trade-offs that are not purely empirical.  

  **Final Draft Outline**:  
  - **Agreed Claims**: 8 points.  
  - **Disagreements**: 6 rows.  
  - **Cruxes**: 4, with tests and predictions.  
  - **Verbal Disputes**: 3-4 identified.  
  - **Unsettled**: Noted.  

