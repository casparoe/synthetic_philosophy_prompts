prompt: |-
  hey — I'm a PhD student in NLP, MT side mostly (constrained decoding, evaluation, a bit of interpretability on the side), so the vocabulary I actually live in is encoders and decoders, beam search with hard lexical and formal constraints, loss functions, tokenization, BLEU/COMET and the ways we all know those metrics are broken, multilingual transfer and the curse of multilinguality, rate–distortion style tradeoffs, and the annoying fact that for the thing we actually care about we never have a gold reference. I know basically zero translation studies — I couldn't name you a single theorist in the field, and I'd rather you didn't lean on that literature.

  For a reading group I got talked into I've been going through Hofstadter's *Le Ton beau de Marot: In Praise of the Music of Language* (1997), the book where he produces dozens of English versions of one short Renaissance French poem by Clément Marot (he calls it "Ma mignonne") and argues, roughly, that a translation which carries over the content but drops the constraints — rhyme, metre, the particular sound-pattern, the wordplay — hasn't translated the poem at all; that you often have to change the content in order to keep the form; and that what's essential about the thing lives in the pattern rather than in the message. He also extends "translation" to translation between frames generally.

  What I want is a restatement of that position in my vocabulary, as faithfully as you can manage, and then a residue report. Concretely:

  1. Set the whole thing up as a formal object: source string, target string, a constraint class over target strings, and whatever has to play the role of content or meaning. My own attempt is something like: find t in C with t ~ s, where C is the set of admissible target strings and ~ is a semantic equivalence relation. I'm fairly sure this already sneaks in the thing he denies, but I can't put my finger on where.

  2. Translate his three central claims one at a time: form is partly constitutive of content; it's sometimes right to distort content to preserve form; some translations are better than others, and maybe better than the source, on exactly the dimension that matters.

  3. Now the part I actually care about. Which claims map cleanly onto something I already have a name for — multi-objective optimization, constrained decoding, a different point on the rate–distortion curve, a different choice of distortion metric? Which only go through if something gets fudged, and what exactly? And which have no expression in my vocabulary at all?

  My own guesses at the residue: the idea that a translation can be better than its source; the idea that the constraint is what's being valued rather than a cost being paid; the fact that a reader has to actively reconstruct the pattern for it to be there (nothing in my setup has a reader in it); and the generalized "translation between frames" bit at the end. Also, when a constraint simply cannot be carried over, he'd rather invent a *different* target-language constraint that plays the same structural role — I've been calling that constraint-substitution as opposed to constraint-preservation, and I want to know whether that's a coherent notion or just cheating with extra steps.

  Last thing: my supervisor says the whole book is just multi-objective optimization with a weirdly sentimental objective. I think that's too quick but I can't say why. Take a side on whether the residue is a genuine blind spot in the MT framing — something we'd have to be able to express to do literary translation at all — or a sign that his claims are less determinate than they sound, and say what would count as evidence against you. Don't give me "a bit of both", I can get that anywhere.
