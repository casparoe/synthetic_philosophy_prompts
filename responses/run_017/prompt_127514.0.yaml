answer: |-
  ### Joint Statement on Intergenerational Justice and Climate Policy  
  **Produced through Structured Adversarial Collaboration**  

  ---

  #### I. Preamble  
  This document results from a mediated collaboration between two research programs ("Custodianship" and "Discounted-Welfare") concerning duties to future generations in climate policy. We jointly analyzed three stipulated tools—climatic option space (defined as the number of viable social trajectories open to a society given its inherited climate), the Conditional Legacy Bond (a bond paid by 2150’s generation, with value contingent on their assessment of inherited option space), and three evidential cases (Cheap Later, Irreversibility, Non-Identity). We sought not to resolve foundational moral disagreements but to identify points of convergence, clarify misunderstandings, and isolate testable disputes.  

  ---

  #### II. Agreed Claims  
  1. **Climatic option space is a meaningful metric** for assessing intergenerational impacts, distinct from GDP or utility. Its contraction reduces future societies’ capacity to adapt to unforeseen challenges.  
  2. **Irreversible losses** (e.g., crossing a sea-level threshold) demand heightened scrutiny; neither camp treats them identically to reversible harms.  
  3. **Extinction or civilizational collapse** cannot be adequately priced via discount rates alone; such risks require separate, precautionary treatment.  
  4. **The Non-Identity Problem** (where policies alter which individuals exist) does not negate duties to future generations, provided lives remain worth living.  
  5. **Climate damages to economic growth rates** (e.g., reduced productivity from heat stress) are more consequential than damages to output levels (e.g., one-time asset loss), as they compound over time.  
  6. **Scarcity necessitates trade-offs**; no generation can fully insulate successors from all climate risks.  
  7. **The Conditional Legacy Bond** creates accountability by making future generations the judges of present actions, though its interpretation as a "measure" or "incentive" differs by camp.  
  8. **Discounting is indispensable** for comparing near-term costs with long-term benefits in standard cost-benefit analysis.  
  9. **Threshold effects in option space** (e.g., losing all Arctic ice) could trigger non-marginal, discontinuous impacts on human possibilities.  
  10. **Compensation for lost option space is impossible** if collapse occurs; no bequest of technology or capital can restore viability to a failed society.  

  ---

  #### III. Disagreements Table  
  | Issue | Camp A’s Position | Camp B’s Position | Substantive/Verbal | What Would Settle It |  
  |-------|-------------------|-------------------|-------------------|----------------------|  
  | **Can lost option space be compensated?** | "Preserving climatic option space is a non-compensable duty; substituting other capital breaches custodianship." | "Option-space loss is a welfare cost like any other; gains in knowledge or infrastructure can offset it." | Substantive | Empirical study: Does compensation restore adaptive capacity in cases resembling Irreversibility? |  
  | **Who holds claims?** | "Duties run to a transgenerational entity (e.g., ‘humanity-as-continuing’), not just to individuals." | "Duties run only to future individual persons; no ‘entity’ bears rights." | Verbal | Clarify "entity" as a shorthand for overlapping obligations to indeterminate persons. |  
  | **How to handle collapse risk?** | "Collapse risks are constraints on action, not discountable costs." | "Collapse risks are extreme welfare losses folded into discounting via catastrophic risk terms." | Substantive | Modeling whether discounting can capture the full moral weight of civilizational termination. |  
  | **Role of the Legacy Bond** | "The Bond operationalizes custodial duty by enabling future judgment." | "The Bond incentivizes option-space preservation by aligning interests." | Verbal | Agree it serves both functions without resolving duty’s source. |  

  ---

  #### IV. Cruxes  
  *Crux 1: Does delay exploit future technological progress?*  
  - **Case:** Cheap Later (abatement 10× cheaper in 2060).  
  - **Camp A Prediction:** Delay locks in irreversible losses (e.g., species extinction) uncountered by cheaper tech.  
  - **Camp B Prediction:** Delay increases net welfare by leveraging future efficiency.  
  - **Concession:** If Camp A is wrong, it accepts discounting for reversible damages. If Camp B is wrong, it accepts constraints on delay for threshold-sensitive harms.  

  *Crux 2: Can discounting value irreversible thresholds?*  
  - **Case:** Irreversibility (sea-level commitment after passing a tipping point).  
  - **Camp A Prediction:** Discounting undervalues the permanence of lost options (e.g., submerged coastal habitats).  
  - **Camp B Prediction:** Risk-adjusted discounting (e.g., high catastrophe penalty) captures this.  
  - **Concession:** If Camp A is wrong, it adopts discounting for non-threshold policies. If Camp B is wrong, it supports a moratorium on actions risking irreversible loss.  

  *Crux 3: Does the Legacy Bond reveal a unique duty?*  
  - **Case:** Non-Identity (policy changes who exists; all lives are worth living).  
  - **Camp A Prediction:** Future generations will penalize option-space loss even if materially richer.  
  - **Camp B Prediction:** They will not penalize if compensated by welfare gains.  
  - **Concession:** If Camp A is wrong, it drops "non-compensability." If Camp B is wrong, it accepts option space as a primary good.  

  ---

  #### V. Appendix: Verbal Disputes  
  1. **"Custodianship" vs. "fiduciary duty"** – Both denote a duty of care, but Camp A rejects economic framing. Dispute is terminological.  
  2. **"Aggregation"** – Camp B uses it to mean summing welfare; Camp A interprets it as ignoring thresholds. Clarify: Camp B accepts thresholds as welfare discontinuities.  
  3. **"Discount rate"** – Camp A objects to "pure time preference" on ethical grounds; Camp B uses it partly to model catastrophe risk. Dispute reducible by specifying components.  

  ---

  #### VI. Joint Policy Advice  
  To finance ministries: **Prioritize policies that preserve climatic option space**—particularly avoiding irreversible thresholds (e.g., ice-sheet collapse)—using the Conditional Legacy Bond as an accountability tool. Distinguish growth-rate damages (high priority) from output-level damages (lower priority). Our disagreement on compensation does not apply here: preserving option space is robustly beneficial under both welfare aggregation (as a capital stock) and custodianship (as a constraint). Implement abatement that hedges against Cheap Later uncertainties (e.g., R&D investments) while respecting Irreversibility risks (e.g., coastal zoning).  

  ---  
  *Document ends*
