prompt: |-
  Ok so I've somehow ended up as the facilitator for an adversarial collab between two people who've been sniping at each other about peer disagreement for years — one is a full-on conciliationist (equal weight, split the difference, the works) and the other is a steadfast theorist (roughly: if my read of the first-order evidence was justified before I met you, it's still justified after I met you). They've agreed in principle to write a joint document and I have to circulate a draft skeleton before the first meeting, so I need the actual artifact: not my summary of the debate, but text that both of them could put their names to without wincing.

  Here's what I want it to contain.

  1. The agreed claims, numbered. And I don't mean the trivial stuff — skip anything so thin that neither of them would ever have denied it. I mean the real common ground: that disagreement is a genuine piece of evidence and not just a psychological fact about two heads; that there's some case where both of them agree you should move a lot (I'm thinking of the jointly-botched restaurant bill, where you both know you're unreliable at mental arithmetic); that "peer" is a matter of degree rather than a switch that flips on; and, if you can get them to sign it, that the standard disputed-calculation setup is a bad model for the cases they actually care about, because in the interesting cases there's no independent check to appeal to afterwards.

  2. A disagreements section as a table, where the conciliationist's formulation and the steadfast theorist's formulation sit side by side and each one is worded so that that side would accept it as their own view — not the opponent's caricature of it. If some row collapses into a fight over words (justification vs rationality vs permissibility, or "must change your mind" vs "must change your confidence"), say which row and why, and then give the substantive version underneath.

  3. The cruxes, and for each one a case or argument both of them accept as bearing on it, with each side's prediction written down before the fact. I have hunks of what I think the cruxes are, but tell me if I've got them wrong:

  - The closed-room case. Two people with the same training, handed the same evidence packet, allowed unlimited joint deliberation in which every consideration either of them has goes on the table, and they still come out at different credences. The conciliationist wants to say the survival of disagreement through all that is itself evidence of a fault somewhere in the pair. The steadfast theorist wants to say it's evidence of a brute, non-truth-tracked difference in starting points. Is there anything both accept would tell them which of those is happening?

  - The scale question, which I never see addressed and which I think has to be settled before the rest can even be stated. Is conciliation supposed to be an operation on credences, on log-odds, or on the odds directly? Splitting the difference in credence and meeting in the middle in log-odds give different numbers, and they come apart more the further apart the two peers start. Whichever way each side answers, does the answer cost them anything — and is there a formulation of conciliationism that's neutral about the scale, or does the view secretly need one?

  - The ratchet. If I conciliate towards you and you conciliate towards me and then we each learn that the other has conciliated, do we update again, and again? If yes, both of us walk to a compromise neither of us ever had reason to hold; if no, the conciliationist seems to be treating the fact of disagreement as evidence on the first pass but not the second. Both of them should write down what they say here and what they predict about it.

  - Correlated error, which I think is where the real action is. Call an echo panel a group of peers whose mistakes are correlated because they were trained on the same sources or the same flawed model, and whose disagreement with you therefore carries less independent information than their number suggests. The conciliationist should say how much independent-error versus correlated-error disagreement there is in the cases they care about; the steadfast theorist should say whether their view gets more attractive as correlation goes up. Give me the jointly accepted test — I'd guess something like forecasting teams who see each other's numbers, plus the echo-panel variant — and each side's prediction about what it shows, plus what each of them would count as a result against their own side.

  Two more things. Each of them has to write down, in their own words, what would count as evidence against their own position, and I want that in the document rather than left implicit. And I suspect at least one of the four cruxes is mostly verbal while another one is where the whole thing actually turns — tell me which is which, and don't hedge it into a mush.

  Format: numbered agreed claims first, then the disagreements table, then the cruxes with predictions. Don't pad it with a lit review or any pointers to papers; the whole value here is in the wording, and I want to be able to send it to both of them as-is.
reasoning: |-
  Alright, let me unpack this facilitation challenge. The user needs a structured adversarial collaboration framework for two entrenched philosophers debating peer disagreement - a conciliationist and a steadfast theorist. The core requirements are razor-sharp: a minimal common ground section without platitudes, a disagreement table that avoids caricatures, and predictive cruxes with testable implications.

  First, analyzing the user's hidden needs. They're clearly an experienced mediator - notice how they dismiss "thin" agreements and demand formulations each side would actually sign. The emphasis on "artifact" over summary suggests they've seen too many collaborative efforts fail on wording. Key pressure points: the scale question must be resolved before meaningful debate, and correlated error is flagged as the real battleground. They're allergic to academic padding - every line must pull weight.

  For the agreed claims, I'll focus on the substantial middle ground both would concede grudgingly. The restaurant bill example is perfect - it forces both sides to acknowledge some cases demand major belief revision. The "peer-as-spectrum" point is crucial since binary thinking derails these debates. And crucially, both must admit the standard calculation model fails for interesting philosophical disagreements where no verification exists.

  The disagreements table needs surgical wording. For conciliationism, emphasizing "epistemic obligation" rather than "must change mind" avoids triggering steadfast objections about justification persistence. For steadfast theory, highlighting "no positive reason to revise" sidesteps caricatures of dogmatism. The justification/rationality distinction gets its own row since that's often terminological warfare.

  Now the cruxes. The closed-room case reveals their deepest ontological split - is residual disagreement evidence of hidden flaws or brute priors? The scale question is unexpectedly vital: credence vs log-odds splitting gives wildly different results at extremes, yet most papers ignore this. I'll present it neutrally but note conciliationism implodes if it can't specify a scale. The ratchet problem exposes whether conciliation is truly commutative - if iterative updating drives beliefs to arbitrary compromises, that's fatal. 

  But correlated error is the crown jewel. The forecasting team test case is brilliant - it makes the abstract concrete. Conciliationists must predict how much independence exists in real peer groups; steadfasters must admit correlation strengthens their case. Forcing each to name falsifying evidence is key: if conciliationism can't handle echo chambers or steadfastness ignores uncorrelated dissent, that's game-changing.

  Final structuring: no intros or citations. Claims first (1-5), disagreements as tight table, cruxes with predictions formatted as hypotheses. The "evidence against" section will be brutal but necessary. And I won't hedge - scale is mostly verbal (if specified), correlated error is where lives are lost. Wording each line as if both are reading over my shoulder...

  This might just work if the phrasing is bulletproof. Time to draft.
answer: |-
  Here is the draft skeleton structured as requested, with precise wording designed for joint endorsement:

  ---

  **1. Agreed Claims**  
  1.1 Peer disagreement constitutes *epistemic evidence* (i.e., it is rationally relevant to belief revision), not merely a psychological fact about differing opinions.  
  1.2 In cases of mutually acknowledged cognitive limitations (e.g., two individuals independently miscalculating a restaurant bill), both parties epistemically *must* significantly revise their initial conclusions.  
  1.3 Peerhood is scalar (degree of reliability, expertise, or access to evidence), not binary.  
  1.4 The "shared calculation" paradigm (e.g., arithmetic disputes) is epistemically misleading for core philosophical disagreements, as these typically lack objective verification mechanisms.  

  **2. Disagreements**  
  | Conciliationist Formulation                          | Steadfast Theorist Formulation                        |  
  |------------------------------------------------------|-------------------------------------------------------|  
  | Upon encountering peer disagreement, an agent has *pro tanto* epistemic obligation to reduce confidence in their belief. | Peer disagreement alone does not *require* belief revision if the agent’s initial credence was justified by first-order evidence. |  
  | Equal weight must be given to a peer’s assessment absent defeaters. | A peer’s assessment provides no *positive reason* to alter one’s justified credence. |  
  | *[Terminological Split]*: "Obligation" denotes *rational impermissibility* of maintaining credence. | *[Terminological Split]*: "Justified" denotes *permissibility* of maintaining credence absent new evidence. |  
  | **Substantive Core**: Disagreement *generates* new evidence against one’s view. | **Substantive Core**: Disagreement *reveals no new evidence* against the content of one’s view. |  

  **3. Cruxes & Predictions**  
  **Crux 1: Closed-Room Disagreement**  
  - **Case**: Two peers with identical training/evidence deliberate exhaustively, yet maintain divergent credences (e.g., 0.7 vs 0.3 on a philosophical proposition).  
  - **Conciliationist Prediction**: Persistent disagreement indicates *undetected asymmetry* (e.g., hidden bias, differential processing) undermining peerhood.  
  - **Steadfast Prediction**: Disagreement reflects *brute, rational priors* not requiring revision.  
  - **Joint Test**: Analyze documented cases of expert deliberation (e.g., IPCC working groups). *Against Conciliationism*: Multiple irreconcilable yet rational outputs. *Against Steadfast*: Consensus emerging only after detecting asymmetric errors.  

  **Crux 2: Scale of Conciliation**  
  - **Question**: Is conciliation applied to *credences*, *log-odds*, or *odds*?  
  - **Conciliationist Stance**: *Credence-splitting* (e.g., 0.8 and 0.4 → 0.6). (Note: This commits conciliationism to linear scale).  
  - **Steadfast Stance**: Scale choice is irrelevant; *no conciliation occurs*.  
  - **Cost to Conciliationism**: Credence-splitting violates Bayesian updating (e.g., incoherent under iterated disagreement).  
  - **Verbal/Substantive**: **Primarily verbal** (scale choice is internal to conciliationism), but **substantive cost** if linear credences violate coherence.  

  **Crux 3: The Ratchet**  
  - **Case**: A (0.8) and B (0.2) conciliate to 0.5. Each then learns the other conciliated.  
  - **Conciliationist Response**: *No further revision*. Disagreement evidence is "used up" in first update.  
  - **Steadfast Response**: Iteration reveals conciliationism’s instability.  
  - **Prediction**: Conciliationists must reject iterative updates to avoid arbitrariness. Steadfast theorists cite this as reductio.  

  **Crux 4: Correlated Error**  
  - **Case**: "Echo panel" – 10 peers disagree with you, but their errors correlate due to shared training.  
  - **Conciliationist Prediction**: In *real philosophical disputes* (e.g., ethics), >50% of peer disagreement reflects *uncorrelated errors*; thus, conciliation remains robust.  
  - **Steadfast Prediction**: High correlation *weakens* the evidential force of disagreement, making steadfastness more plausible.  
  - **Joint Test**: Forecasting tournaments. Compare accuracy of:  
    - (A) Teams seeing each other’s initial forecasts (inducing conciliation),  
    - (B) Isolated forecasters aggregated post-hoc,  
    - (C) "Echo panels" (subgroups with shared methodologies).  
  - **Against Conciliationism**: (A) underperforms (B) when (C) dominates the field.  
  - **Against Steadfast**: (A) matches or outperforms (B) when (C) is rare.  

  **4. Evidence Against Own Position**  
  - **Conciliationist**: "If conciliation *systematically degrades* accuracy in domains with high error-correlation (e.g., politics), the view fails."  
  - **Steadfast Theorist**: "If agents *retain confident beliefs* after encountering numerous *uncorrelated* peers who independently reject their view, the view is dogmatic."  

  ---

  **Key Diagnostics**:  
  - **Mostly Verbal**: Crux 2 (Scale). The dispute is implementation-specific to conciliationism, not a core clash.  
  - **Decisive Substantive Crux**: **Crux 4 (Correlated Error)**. It directly tests whether disagreement’s evidential weight dissipates in real-world conditions.  

  This structure forces explicit concessions (Sec 1), isolates irreducible disagreements without caricature (Sec 2), and specifies falsifiable tests (Sec 3–4). Wording avoids academic jargon and aligns with each side’s self-description (e.g., "epistemic obligation" for conciliationists; "justified credence" for steadfast). Send as-is.
