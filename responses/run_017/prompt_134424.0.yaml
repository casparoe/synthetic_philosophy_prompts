prompt: |-
  I'm a backend engineer -- mostly Go, zero philosophy training beyond whatever seeps in from podcasts -- and I got completely nerd-sniped by an argument at work that I can't shake. We were writing up a postmortem for an outage where someone noticed a bad config during a routine deploy and just... didn't fix it, and we spent an hour arguing about whether "saw it and left it" is really a different kind of thing from "pushed the bad config in the first place." Everyone on the team had strong gut feelings and not one of us could say what the underlying rule was supposed to be. So here are my own verdicts on a pile of cases, and I want to know if there's a single principle that gets them or whether I'm just holding two incompatible intuitions at the same time. (1) I grab a kid and hold his head under the bathtub water until he drowns: monstrous, and I did it. (2) I walk in, the kid is slipping under, I could grab him with zero risk to myself, and I stand there: still monstrous, but definately less bad than (1), and I can't say why. (3) A doctor unplugs a ventilator from a patient who was never going to recover, at the family's request: fine, maybe even kind. (4) A doctor never hooks that same patient up in the first place, same prognosis, same request: also fine -- and here's what bugs me, it feels *exactly* as fine as (3), so the doing/allowing distinction seems to do no work at all here even though it obviously does work in (1) vs (2). (5) A lifeguard watches a kid drown in the shallow end and doesn't move: to me that's almost as bad as (1). (6) A random guy on the beach does the exact same nothing, same kid, same everything except the job title: way less bad than (5), even though the physical events are identical. (7) I never signed up for the organ donor registry and a neighbor dies needing a kidney: nobody's fault, zero blame. (8) I did sign up, I matched, and I ghost the hospital the morning of the surgery: I feel like that's genuinely bad, not just a little bad -- but it's still technically an omission, so if you tell me doing and allowing are morally different, explain this one too.

  Then the tech-flavored ones, which are the ones I actually care about. (9) A monitoring service I wrote suppresses a critical alarm, a patient dies: I feel worse about myself here than in (10), where I inherited the same bug, spotted it during a routine deploy, and didn't push the one-line fix that was already sitting in my branch. (11) I set up a cron job months ago that deletes a life-critical alert rule at midnight; I go on vacation and never disarm it, and the rule dies at midnight while I'm asleep on a beach somewhere. (12) Same system, but the vendor shipped the opposite default: the rule stays on only if I log in every night and re-arm it, and one night I don't. (13) A patient's life-support device runs on software my company owns; the license lapses and I could renew it with one click for twenty bucks, and I don't. My gut says (11) is killing, (12) is letting die, and (13) is somewhere in between -- but (11) vs (12) looks like it might just be about which way the vendor happened to set the default, and hanging blame on that feels totally arbitrary, like the morality would flip if someone had picked a different config value.

  So: is there one principle here -- something about who initiates a causal sequence versus who fails to stop one, or about what counts as the normal or default baseline, or about duties and roles and who had the easy option -- that gets all thirteen? I want the clause-by-clause version, with which of my cases motivates each clause, and I want you to be straight with me about which of my verdicts it can't accommodate and which ones I should just drop. Don't hand me a slogan like "killing is worse than letting die," because (3) vs (4) already breaks that for me and (5) vs (6) breaks it in the other direction. And if your conclusion is that the doing/allowing line isn't actually doing any real moral work and something else is, say that explicitly, tell me what that something else is, and tell me what evidence or case would show me I'm wrong. The two I keep going back and forth on: my team ships a change that removes a safety check because the check was slow and expensive, and a user dies as a result -- I genuinely can't tell whether that's a (1) or a (2); and a hospital moves the only working ventilator off a patient the model says has a week left and onto one who needs it right now, no malice, pure triage -- fine, or not, and why. I'd rather have the principle than the individual answers, but give me both.
reasoning: |-
  Okay, the user is a backend engineer with a Go background, no formal philosophy training, but clearly sharp and deeply engaged with a practical moral dilemma from work. They're frustrated by an unresolved team debate about moral responsibility in system failures, and they've constructed an impressively thorough set of test cases ranging from drowning kids to medical triage to their actual tech scenarios. What they're really asking for isn't just answers to individual cases, but a unified moral framework that doesn't collapse under edge cases.

  Hmm, their core tension is between act/omission distinction and role-based duties. Cases like (1) active drowning vs (2) passive watching show they intuitively feel a difference, but (3) withdrawing treatment vs (4) never giving it flattens that difference. Then (5) lifeguard vs (6) bystander introduces role gravity, which seems decisive in (9) vs (10) where writing vs inheriting a bug changes blame. The tech cases (11-13) expose how default settings distort moral intuitions - which is terrifying because morality shouldn't hinge on vendor configs.

  What they're circling is Philippa Foot's "negative duties" vs "positive duties" framework, but they need it weaponized for engineering contexts. Foot's trolley problem variations actually map well to their ventilator cases - withdrawing treatment isn't killing because the underlying pathology does the killing. But their (13) license lapse case is trickier: is not clicking renewing a failure to maintain a positive duty? Only if their role demands it.

  Ah! The breakthrough is realizing that for their work, the act/omission distinction is secondary to two things: 1) deviation from baseline expectations (which explains why default settings feel morally arbitrary), and 2) role-generated duties (which explains lifeguard vs bystander). In (11) cron job deletion, they created a deviant process; in (12) failure to re-arm, they failed at a role duty. But crucially, the role defines the baseline: for lifeguards, saving is the default; for engineers, maintaining systems is the default.

  Their recurring ventilator triage question reveals where this framework bends: when roles conflict. A hospital administrator has dual duties to current and future patients. Foot's double effect doctrine might help - as long as the death isn't the means to saving others (merely foreseen not intended), it's permissible triage. But they'll hate that unless I tie it to system design: the moral weight shifts to whether the triage protocol itself is just.

  For their team's safety check removal, it's clearly (1)-like because they actively chose to degrade a safety baseline they were responsible for maintaining. The vendor default cases (11 vs 12) remain messy - that's why good SRE practices make critical systems "fail closed," so morality aligns with failsafes. Maybe the real principle is: you own the moral weight of any predictability asymmetry you create. If you build a system where harm is the surprise (like the cron bomb), it's killing; if harm is the expected outcome without intervention (like the re-arm system), it's letting die.

  They'll push back on (8) organ donor ghosting being worse than (7) non-registration. The framework holds: by registering, you created a role duty where none existed. The neighbor's reliance transformed your omission into betrayal. Proof? If the hospital never contacted you until surgery day, your ghosting might be less bad - the reliance wasn't activated.

  Final note to self: emphasize that in engineering, we can design systems to make the right thing the default. That's how we resolve the vendor config problem - morality shouldn't depend on defaults, so we invert dangerous ones during implementation. Their outrage at arbitrary morality is actually a design insight.
answer: |-
  You've hit on one of philosophy's deepest debates: the **act/omission distinction** and its limits. Your intuitions are consistent with a framework combining **role-based duties** and **causal responsibility within a baseline state**. Let's break it down clause-by-clause, using your cases as evidence.

  ### The Unified Principle
  **Moral responsibility depends on:**
  1.  **Deviation from a morally expected baseline state** (Did you *create* a new threat or *fail to correct* an existing one?).
  2.  **Role-generated obligations** (Does your job/commitment require intervention?).
  3.  **Foreseeability & avoidability** (Could you reasonably predict and prevent harm with minimal effort?).

  This explains why "doing" vs. "allowing" *sometimes* matters (when roles/baselines differ) and sometimes doesn't (when roles/baselines are identical).

  ### Clause-by-Clause Breakdown with Your Cases

  1.  **Deviation from Baseline (Creating New Threats vs. Failing to Correct Existing Ones):**
      *   *Motivated by:* (1) vs. (2), (3) vs. (4), (11) vs. (12), (13).
      *   **You are more blameworthy for *initiating* a harmful causal chain than for *failing to interrupt* one that already exists, assuming equivalent outcomes.** The "baseline" is the state of the world before your action/inaction.
      *   (1) vs. (2): You *created* the drowning threat (1). You *failed to stop* an existing threat (2). Creating new harm is worse.
      *   (3) vs. (4): The *baseline* is the patient dying from their underlying condition. Unplugging (3) or not plugging in (4) *allows* this baseline to proceed; neither *creates* a new fatal condition. Hence, morally equivalent.
      *   (11) vs. (12): The **crucial difference is the default state set by the system/vendor**.
          *   (11): The baseline/default is "alert rule exists". Your cron job *actively changes* this baseline to "alert rule deleted", creating a new threat. This is *doing harm* (like (1)).
          *   (12): The baseline/default is "alert rule is OFF". Your inaction *fails to change* this baseline to "alert rule ON", allowing the existing threat (lack of alert) to persist. This is *allowing harm* (like (2)).
          *   **Why vendor defaults matter morally:** They establish the expected, normal state. Your action is judged relative to that state. Changing a safe default to unsafe (11) is creating a new threat. Failing to change an unsafe default to safe (12) is failing to prevent an existing threat. This explains your "arbitrary config" feeling – the morality *does* hinge on the designed baseline. **Designers bear moral responsibility for dangerous defaults.**
      *   (13): The baseline is "license valid". Your inaction allows it to lapse, changing the state from "functional" to "non-functional". This is *allowing* the system to fail *due to your (likely) role-based responsibility to maintain it*. Less active than (11), more blameworthy than (12) due to the ease of prevention (*one click*) and potential role obligation. It sits between "allowing" and a mild form of "doing" because the threat (lapse) was predictable and easily avoidable.

  2.  **Role-Generated Obligations:**
      *   *Motivated by:* (5) vs. (6), (7) vs. (8), (9) vs. (10).
      *   **You incur stronger duties to prevent harm through specific roles, promises, or commitments.** Violating these duties is morally worse than a stranger's identical inaction.
      *   (5) vs. (6): The lifeguard's *role* creates an obligation to save swimmers. Failing this duty is a profound betrayal (like (1)). The random guy lacks this specific duty; his inaction is callous but less blameworthy (like (2)).
      *   (7) vs. (8): Not signing up (7) establishes a baseline where you have *no duty* to donate. Ghosting after signing up (8) violates the *explicit commitment* you made, creating reliance and expectation. This betrayal makes it significantly worse.
      *   (9) vs. (10): Writing the buggy monitor (9) *creates* a new threat (deviation from the expected baseline of functional monitoring). Spotting and not fixing an inherited bug (10) is *failing to correct* an existing threat. Creating the threat (9) feels worse because it initiated the harm chain.

  3.  **Foreseeability & Avoidability:**
      *   *Motivated by:* All cases, especially (2), (4), (5), (6), (8), (10), (12), (13).
      *   **Inaction is blameworthy only if harm was foreseeable and could have been prevented with minimal cost/effort.** "Minimal effort" is judged relative to your role and the stakes.
      *   (2), (5), (6): Harm is highly foreseeable and preventable with trivial effort (grabbing the kid). This makes inaction monstrous.
      *   (4), (12): Harm is foreseeable, prevention requires *some* deliberate action (hooking up, re-arming), but the baseline (patient dying, alert off) exists independently. Blame depends heavily on role.
      *   (8), (10), (13): High foreseeability, extremely low cost to prevent (showing up, one-line fix, one click). This makes the inaction egregious, especially combined with role/commitment (8, 10).

  ### Addressing Your Specific Queries & Edge Cases

  *   **"Saw it and left it" vs. "Pushed the bad config":** This is **not** fundamentally different *in outcome*, but potentially different *in kind* and *blameworthiness*.
      *   *If the "saw it" person had a role-based duty to fix configs:* Their inaction is a significant failure of duty (like the lifeguard (5)), possibly approaching the blame of the person who pushed it, depending on ease of fix.
      *   *If the "saw it" person had no specific duty:* It's more like bystander neglect (6) – bad, but less so than the person who created the problem (1/9/11).
      *   **The initiator** (pusher) *deviated from the baseline* (working config) to create a threat. The **observer** *failed to correct* an existing threat. The observer's *role* determines how blameworthy that failure is.

  *   **Your Team Ships Change Removing Safety Check:** This is **(1)-like (Killing)**. You *actively chose* to degrade the system's safety baseline ("safe with check") to a less safe state ("unsafe without check") for a non-critical reason (speed/cost). You *created* a new, foreseeable threat. It's not merely allowing an existing risk; it's engineering a new one. (Analogy: Disabling the lifeguard because they're "too slow").

  *   **Hospital Ventilator Triage:** This is **(3)-like (Permissible Letting Die)**. The baseline is that both patients have fatal conditions requiring a scarce resource. Removing the ventilator from Patient A (who might live a week without it? Clarify prognosis!) *allows* their underlying condition to cause death sooner, in order to *prevent* the imminent death of Patient B from *their* underlying condition. It's a tragic allocation decision based on need/effectiveness, not malice. It deviates from the ideal baseline (enough ventilators for all) but works within the *actual* baseline (scarcity). The death isn't the *means* to save B; it's the foreseen *consequence* of reallocating the resource needed to save B. This is typically considered ethically justifiable triage.

  ### Where Your Verdicts Might Need Adjustment (and Why)

  1.  **(11) vs. (12) Blame Hinges on Defaults:** Your feeling that it's arbitrary is correct *if* you focus *only* on the physical outcome. However, morality *does* consider *how* the harmful state came about relative to expectations. The person who designed/shipped the dangerous default (in 11 or 12) bears significant blame. The operator in (11) actively triggered a harmful change; the operator in (12) failed to perform a maintenance action. The *ease of prevention* and *role clarity* matter hugely here. **The takeaway: System designers have a profound duty to set safe defaults.** If the morality flipping with config feels wrong, the solution is to design systems where the safe state is the default and requires no active maintenance (fail-safe).
  2.  **(13) License Lapse:** You feel it's "in between". This fits. It's *allowing* a system to fail due to neglect. The blameworthiness depends heavily on:
      *   **Role:** Were you *the* responsible admin, or one of many?
      *   **Foreseeability:** Was lapse predictable? Were there warnings?
      *   **Ease:** Trivial effort required (one click).
      *   This is likely more blameworthy than (12) (failing to re-arm a dangerous default) because maintaining existing licenses is a more fundamental, expected admin duty than constantly re-arming a poorly designed alert system.

  ### Conclusion: The Real Workhorse Isn't Doing/Allowing Alone

  You're right to be suspicious of a simple "doing vs. allowing" or "killing vs. letting die" rule. It fails your test cases (3/4 equal, 5/6 different). The distinction *can* be relevant as a proxy for **deviation from baseline** (creating vs. not preventing harm), but it's overshadowed by:

  1.  **Role-Based Duties:** These create specific, strong obligations to act. Violating them is a major moral failure.
  2.  **The Morally Expected Baseline:** Actions are judged relative to the normal/default state. Changing a safe state to unsafe is "doing harm." Failing to change an unsafe state to safe is "allowing harm." **Designers define the baseline and bear moral responsibility for it.**
  3.  **Foreseeability and Effort:** Inaction is only blameworthy if harm was predictable and preventable without excessive cost.

  **Evidence You're Wrong?** If you found a case where:
  *   Someone *actively creates* a minor threat with no role obligation and minimal foreseeability, and it's judged *less* bad than someone with a clear role obligation who *fails to prevent* a major, highly foreseeable threat with trivial effort.
  *   *(Example: A janitor accidentally leaves a slightly slippery spot (doing, minor threat) vs. a designated safety officer ignoring a clearly about-to-collapse ceiling (allowing, major threat). The officer's inaction would likely be judged worse.)*
  This would confirm that role and foreseeability/effort trump the pure doing/allowing distinction in determining blameworthiness.

  **For Your Engineering Practice:** Focus on:
  1.  **Setting Safe Defaults:** Make the secure, reliable state the baseline that requires no action to maintain.
  2.  **Clear Role Ownership:** Define who is responsible for monitoring and maintaining what.
  3.  **Minimizing Foreseeable Failure Modes:** Design systems where critical failures require multiple, unlikely steps, not single points of neglect.
  4.  **Ease of Doing Right:** Make safety-critical actions (fixes, renewals, checks) as easy as possible.

  The morality isn't *in* the config value itself; it's in the human choices that *set* the config value (designer's baseline creation) and the human choices to *act or not act* relative to that baseline and their assigned duties. Your outrage at (11) vs. (12) should be directed at the designer who made the safe state fragile, not taken as proof morality itself is arbitrary.
