  3. **Teleosemantics**: Proper function comes from selection history (evolution or design). Malfunction is real because the system is supposed to do something due to its history.
  4. **Informational semantics**: Content is fixed by nomic covariance (e.g., smoke means fire because it covaries with fire). Error is when the covariance breaks.
  5. **Intentional-stance (Dennett)**: Content is a real pattern that is useful for prediction. There is no deeper fact. If the pattern is useful, then the system has the content. Error is when the system deviates from the pattern we attribute, but the pattern is just a useful fiction.
  6. **Deflationary/Eliminativist**: Nothing literally has content. We talk as if things have content, but it's not real. There is no genuine error because there is no content to be wrong.

