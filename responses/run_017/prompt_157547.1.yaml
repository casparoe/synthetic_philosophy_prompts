  Key dimensions (from the case bank requirement and the positions):
  1. **History vs. current disposition**: Does the history of how the system came to be matter for its content?
  2. **Possibility of genuine error**: Can the system make a mistake (not just fail to function as designed, but have a contentful error)?
  3. **Implementation independence**: Does the same content arise regardless of how the system is built (e.g., lookup table vs. algorithm)?
  4. **Parity with humans**: If a human does the same task, do they have the same kind of content?
  5. **Regress of borrowed content**: If content is derived, where does the chain stop?
  6. **Requirement of consciousness/biology**: Is consciousness or biological substrate necessary for original intentionality?

  But note: we cannot use these terms in the questions. We must phrase questions in terms of concrete cases.

