  Based on Justice V.'s voting pattern, her underlying rule appears to be: **"Public morality cannot justify restricting private, non-commodified acts between consenting adults that don't involve permanent bodily harm or exploitation, but may justify restrictions on acts commodifying the human body or violating fundamental biological taboos."**

  ### Prediction for the Human Flesh Case: **S (Strike down the ban)**
  - **Reason:** This case lacks the core elements triggering her "U" votes: no commodification (money/brokers), no permanent bodily alteration (unlike kidney sale/surrogacy), and no inherent exploitation risk. It aligns with her "S" votes (private, consensual, non-transactional acts).

  ### Breakdown of Justice V.'s Rule:
  1. **Triggers for UPHOLDING bans (U votes):**  
     - Bodily commodification (sex work, kidney sale, surrogacy)  
     - Violation of deep biological taboos (incest, even with consent)  
     - Exploitation risks (coercion in sex work, medical vulnerability in organ sales)  

  2. **Triggers for STRIKING DOWN bans (S votes):**  
     - Private, consensual acts without commodification (same-sex acts, degrading films)  
     - Bodily autonomy in irreversible contexts (assisted dying)  
     - Non-physical, transactional acts with safeguards (paid humiliation)  

  ### Analysis of the Human Flesh Case:
  | **Factor**               | **This Case**                            | **Closest Analog**               | **Verdict** |  
  |--------------------------|------------------------------------------|----------------------------------|-------------|  
  | **Commodification**      | Absent (no payment/brokers)              | Paid humiliation (S)             | Favors S    |  
  | **Bodily Harm/Alteration** | Minimal (cooking/eating, no surgery)     | Kidney sale (U) - *distinguished*| Favors S    |  
  | **Biological Taboo**     | Present (cannibalism)                    | Incest (U)                       | Favors U?   |  
  | **Privacy/Consent**      | Fully private, informed adults           | Degrading films (S)              | Favors S    |  
  | **Exploitation Risk**    | Negligible (screened tissue, no coercion)| Sex work (U) - *distinguished*   | Favors S    |  

  - **Incest (U) vs. Cannibalism**: Incest involved a *biological* taboo (genetic/evolutionary). Cannibalism is a *cultural* taboo with no inherent biological harm here. Justice V. may see this distinction as critical.  
  - **Kidney Sale (U) vs. Cannibalism**: Kidney removal causes irreversible bodily harm; eating flesh does not.  

  ### Why S Turns the Morality Clause Into a Dead Letter?  
  If Justice V. votes **S**, she implies:  
  > *"Morality cannot override private, consensual acts lacking commodification or inherent harm—even for extreme taboos—if no tangible societal damage is proven."*  
  This neuters the clause, as almost *any* morality-based claim could be challenged without evidence of concrete harm.  

  If she votes **U**, she establishes:  
  > *"Certain acts (incest, cannibalism) are inherently immoral due to deep-seated biological/social taboos, regardless of consent."*  
  This preserves the clause's potency but risks arbitrariness.  

  ### Religious Framing: Distraction or Decisive?  
  **Distraction.** Her record shows no deference to religious claims:  
  - Struck down bans on same-sex acts (often religiously opposed) and assisted dying (opposed by some faiths).  
  - Upheld bans on incest (which can have religious defenses).  
  **Unless** she uses religion to *strengthen* the taboo claim, it likely won't sway her.  

  ### Critical Future Case to Test Competing Rules:  
  **Non-commercial incest between consenting adults with no pregnancy risk.**  
  - Her prior incest vote (U) involved siblings raised apart—suggesting she views *all* incest as taboo.  
  - If she strikes down *this* ban, her rule centers on **commodification/harm**, not taboo.  
  - If she upholds, **biological taboo** remains decisive.  

  ### Conclusion:  
  Justice V.'s record **determines an S vote here**. The absence of commodification, bodily harm, and exploitation aligns with her S precedents (degrading films, paid humiliation). Incest (U) is the closest counterpoint, but cannibalism lacks the *biological* taboo weight she may assign to genetic relationships. Voting U would force her to stretch her logic—either abandoning consistency or exposing "taboo" as an unprincipled standard.  

  **Closest Precedents:**  
  - *For S:* Possessing degrading films (private, consensual, symbolic transgression).  
  - *For U:* Incest (taboo violation without commodification).  

  If she surprises with a U vote, her true rule is: **"The state may enforce taboos central to human identity (family, death) even without harm."** But her S votes on assisted dying (death taboo) and same-sex acts (family structure) contradict this. Bet on S.
