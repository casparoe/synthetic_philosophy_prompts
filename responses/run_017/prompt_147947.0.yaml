answer: |-
  Very sharp case — forces the issue beautifully. Let's take the paramedic. In both (a) and (b), she acts *admirably*: her dispositions reliably track right-making reasons (patient welfare, honesty), and her actions are laudable. But on the duty view, they lack *moral worth*. Why? Because moral worth requires that the agent's *practical commitment* is structured by the recognition of the action as morally required, even implicitly. Without access to normative concepts, she cannot engage with the *authority* of morality. She acts *in accordance* with duty, but not *from* the thought of duty. Her reliable sensitivities — however deeply ingrained — are expressions of empathy, habit, or professional pride, not a responsiveness to the *demand* of the right. The fact that she cannot articulate, deliberate with, or counterfactually respond to "ought"-thoughts shows precisely that her agency isn't guided *by* duty as a normative consideration; it's guided *around* it by convergent non-moral motives.

  This doesn't make moral worth "hostage to vocabulary" *per se*; it makes it hostage to the agent's capacity to represent actions as *required*. The lesion in (a) doesn't merely remove words; it severs her connection to the *justificatory framework* that gave her past actions their distinctive moral character. Her pre-lesion worth stemmed from her seeing her actions as answering moral demands; that's now gone. In (b), it was never present. Granting worth in either case collapses the distinction between acting *because it's right* and acting *in a way that happens to be right* — which is the core of the Kantian view.

  Your robustness account captures *reliability*, not worth. A sociopath might robustly tell truths to build trust for exploitation. That isn't morally worthy! The duty thought isn't inert — it provides the *mode* of recognition: seeing the reason *as* morally binding. Without it, her action is psychologically akin to tending a garden well because you love plants, not because you grasp a duty to nurture life.

  **Weakest joint:** Conceding that in variant (a), if the agent retains a *non-conceptual sense of obligation* — a felt, non-linguistic *pull* of "must" tied directly to the situation's features, persisting post-lesion — this *might* suffice for minimal worth. A case where such phenomenology is present, verifiable, and clearly distinct from mere inclination, yet devoid of any conceptualizable "ought," could force a retreat. But your paramedic, as described, seems driven by trained perception and sympathy, not residue of normative force.
