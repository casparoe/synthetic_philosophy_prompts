answer: |-
  Your hypothesis is substantially correct but incomplete. The impasse stems primarily from conflating three distinct questions: conceptual analysis of "pleasure," identification of a psychological natural kind, and normative grounding for welfare. However, this isn't the whole story. Crucially, the debate masks a deeper, unresolved **normative disagreement** about whether welfare *requires* a unified phenomenal or psychological basis. Positions A-C implicitly assume monism is desirable (hence their attempts to find unity), while D rejects it. The "feels good" vs. "desired" dispute becomes partly verbal under pressure, but the core clash is substantive: is pleasure's putative unity necessary for hedonism's viability as a *normative theory*? The empirical and conceptual layers are entangled with this normative bedrock.

  ### Your Probe's Effect
  The stipulated neuroscience finding would:
  - **Shatter A (Feeling-Tone)**: It directly falsifies the existence of a universal phenomenal property. A might retreat to "seeming good" as the residue, but this collapses into a thin attitudinal state, conceding to B/D.
  - **Bolster B (Attitudinal) & D (Deflationary)**: B absorbs it by arguing the "seeming good" is just the attitude/reinforcement signal. D declares victory: heterogeneity is confirmed, and hedonism must fragment.
  - **Neutralize C (Fittingness)**: C sidesteps empirical findings—normative unity isn't threatened by psychological disunity. But it must explain why two dissociable states both merit enjoyment.
  - **Shift the Debate**: It moves the dispute from empirical psychology ("Is there unity?") to normative theory ("Can hedonism survive without it?"). The literature *would* notice, but responses would polarize: B/D declare the problem solved; A/C reframe.

  ### Overrated Arguments
  - **A's "Attention-Distraction" Defense**: Charged to A. Inert because it assumes the very quality in question exists but is elusive—begging the question against heterogeneity.
  - **B's "Motivation Argument"** (Pleasure motivates, so it can't be just a feeling). Charged to B. Inert because it conflates correlation with constitution; A can grant motivation accompanies pleasure without being its essence.
  - **Heterogeneity Objectors' "Introspection Fails" Claim**. Charged to objectors. Inert against A, as it demands empirical evidence for a conceptual possibility; A need only claim the *conceivability* of hedonic tone.
  - **C's "Normative Unity" Move**. Charged to C. Inert because it presumes that normative reasons can unify a psychological category without explaining *why* disparate states share this normativity.

  ### Prospects for Progress
  - **Distinguishing the Three Questions**: High likelihood within 25 years. Would be recognized as progress, forcing clarity. But it doesn't resolve normative disagreements.
  - **Empirical Confirmation of Dissociation**: Medium likelihood. Recognized as progress by B/D, dismissed by A/C as irrelevant to normativity. Shifts but doesn't end debate.
  - **Formal Value Theory Work**: Modeling welfare aggregation under psychological disunity. Low likelihood of uptake; literature may not see it as resolving the core dispute.
  - **Nothing Changes**: High likelihood. The normative bedrock (monism vs. pluralism) is intractable, and conflation is rhetorically useful for all sides.

  ### Verdict
  - **Ill-Posed**: Partly. The *empirical/conceptual* question is clearer once disentangled, but the *normative* demand for unity may be misguided.
  - **Worth a Year?**: **No**, if aimed at resolving the debate substantively. The conflation is persistent for strategic reasons, and normative commitments are entrenched. **Yes**, if framed as a meta-investigation *exposing why* the debate stalls—this could reframe future discourse. Your stipulated probe shows how to force the real issue (normative viability) to the forefront.

