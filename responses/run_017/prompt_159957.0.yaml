answer: |-
  **Bottom line:** An adequate theory of social norms must explain how normativity generates *reasons for action* irreducible to coordination payoffs, private preferences, or descriptive expectations alone, while accounting for the specific phenomena of arbitrary force, phantom stability, unenforced compliance, boundary sensitivity, cultural variability, and norm death.

  **Reasoning:** The core debate is whether "normativity" is explanatorily redundant. Your cases highlight phenomena demanding more than coordination equilibria (+salience) or aggregated beliefs/preferences. A successful theory must show *how* the fact that something *is a norm* provides a distinct kind of reason, motivating compliance even when detection/punishment are absent, explaining the reactive attitudes (glaring), and accounting for the unique dynamics of norm persistence/collapse. The key tension is between the *efficiency* of bottom-up, individualistic explanations and the *phenomenology/force* captured by positing irreducible collective normativity.

  **Desiderata for an Adequate Theory of Social Norms:**

  1.  **Reason-Generation Beyond Coordination Payoff:** Must explain why agents perceive a *reason* to comply with a norm even in scenarios where deviation carries no coordination cost, material sanction, or reputational damage (e.g., the **undetectable, unenforced violation** like eating taboo food alone). *Non-negotiable* for establishing normativity's distinct role. Motivated by the intuition that norms bind us even when "no one is looking," unlike pure conventions (e.g., driving side).
  2.  **Reactive Attitudes & Non-Arbitrary Force:** Must explain the presence and content of characteristic negative reactions (glaring, muttering, disapproval) towards violations, even for **arbitrary content** (escalator-standing) where deviation causes no direct harm. Reactions must be norm-driven, not just frustration at coordination failure. *Non-negotiable*. Distinguishes norms from mere conventions lacking "oughtness." Motivated by the escalator case.
  3.  **Tripartite Distinction & Phantom Stability:** Must clearly distinguish:
      *   *Behavioral Compliance:* Acting in accordance.
      *   *Empirical Expectation:* Belief others will comply/enforce.
      *   *Normative Expectation/Acceptance:* Belief others *believe* one *ought* to comply and may sanction deviation, coupled with a personal endorsement or recognition of the norm's legitimacy (even if weak).
      Must explain the **phantom norm** – decades of high compliance based on empirical and normative expectations *despite* widespread private rejection of the norm's content, and its rapid collapse when the shared false belief in widespread acceptance is revealed. *Non-negotiable*. Motivated by the phantom norm case.
  4.  **Third-Party Enforcement Motivation:** Must explain why *third parties*, who suffer no direct cost from the violation, are motivated to bear *costs* to sanction violators (e.g., confronting a queue-jumper). This motivation cannot be reduced solely to avoiding personal costs or protecting direct interests. *Non-negotiable*. Key differentiator from self-policing conventions. Motivated by queue-jumping/dress codes vs. driving side.
  5.  **Boundary Sensitivity & Bindingness:** Must explain the **boundary problem**: why norms are perceived as binding primarily on members of a specific group ("insiders"), why newcomers are expected to learn and comply, and why violations by known outsiders often provoke stronger annoyance or different reactions (e.g., "they should know better" vs. "they just don't understand our ways"). *Non-negotiable*. Motivated by the boundary problem case.
  6.  **Compatibility with Cultural Variability & Transmission:** Must be consistent with empirical evidence of **large between-society variation** in norm content (fairness, taboos) and willingness to punish. Must accommodate **transmission biases** (e.g., prestige bias, conformity bias) shaping norm evolution. Must account for **rapid norm death within a cohort** (e.g., fashion norms, slang taboos). *Non-negotiable* (grounding in reality). Motivated by empirical findings.
  7.  **Existence Conditions Independent of Universal Acceptance/Compliance:** Must specify what constitutes a norm's *existence* even when compliance is imperfect or acceptance isn't universal. Crucially, must address whether a norm exists if there is **behavioral regularity driven by mutual expectations of compliance and enforcement, but *no one* actually normatively accepts it** (a potential reading of the phantom norm *before* collapse). *Highly contentious*; a key fault line between camps. Motivated by the phantom norm and the need to define "existence."
  8.  **Non-Reductionism:** Must *not* collapse normativity into either:
      *   Mere Behavioral Regularity (+ expectations about it).
      *   Aggregated Private Preferences (e.g., "everyone prefers conformity conditional on others conforming").
      *   Purely Instrumental/Sanction-Based Reasoning. *Non-negotiable* for capturing the core "ought" phenomenon. Motivated by the need to distinguish norms from conventions/preference aggregation.

  **Key Tension & Most Exclusionary Requirement:** The central tension is between **Requirement 1 (Reason-Generation Beyond Payoff)** and the demand for a purely **bottom-up explanation** from individual beliefs and preferences without irreducible shared representations or collective intentionality. Requirement 1 is the most exclusionary: it directly challenges theories (like standard convention or many rational choice models) that derive *all* reasons for compliance from anticipated individual costs/benefits (coordination loss, sanctions). It forces the theory to explain the *internalized* sense of obligation present even in undetectable violations.

  **Prejudice in Your List:** Your emphasis on the **undetectable violation** and **reason-generation beyond payoff** implicitly favors theories that posit internalized normativity or collective intentionality. The bottom-up camp might argue this "reason" is illusory or reducible to ingrained dispositions shaped by past sanctions/learning, questioning the need for a distinct *explanatory* category beyond complex individual psychology and history.

  **Theory Scoring Table:**

  | Desideratum                              | Lewis-Style Convention | Social Expectations (Norm. Exp. + Cond. Pref.) | Cultural Evolution + Punishment |
  | :--------------------------------------- | :--------------------- | :--------------------------------------------- | :------------------------------ |
  | **1. Reason Beyond Payoff**              | ❌ Fails               | ⚠️ Partial? (Pref. might be instrumental)      | ⚠️ Partial (Internalization?)   |
  | **2. Reactive Attitudes**                | ❌ Fails               | ✅ Explains (Via norm. exp./sanction threat)    | ✅ Explains (Via punishment)     |
  | **3. Tripartite Distinction/Phantom**    | ❌ Fails               | ✅ Explains                                    | ✅ Explains                      |
  | **4. 3rd-Party Enforcement Motivation**  | ❌ Fails               | ⚠️ Partial (If pref. includes enforcing)       | ✅ Explains (Punishment module) |
  | **5. Boundary Sensitivity**              | ❌ Fails               | ⚠️ Partial (If group ID shapes exp./pref.)     | ⚠️ Partial (Group ID cues)      |
  | **6. Cultural Variability/Transmission** | ✅ Explains            | ✅ Explains                                    | ✅ Explains                      |
  | **7. Existence w/o Acceptance**          | ✅ Explains (As eq.)   | ✅ Explains (Via expectations)                 | ✅ Explains (Via punishment)     |
  | **8. Non-Reductionism**                  | ❌ Fails               | ❌ Fails (Reduces to pref./exp.)               | ⚠️ Partial (Risk of reduction)  |

  **Legend:** ✅ = Adequately Satisfies; ⚠️ = Partially or Ambiguously Satisfies; ❌ = Fails or Does Not Address.  
  *Note:* "Cultural Evolution + Punishment" often incorporates elements of social expectations and internalization, making it more robust but still potentially reductionist regarding normativity itself. The "Social Expectations" account struggles most with non-reductionism (8) and reason beyond payoff (1). Lewis fails on most demanding criteria.
