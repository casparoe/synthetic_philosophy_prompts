  I'm working on a piece about how agencies end up deciding whose loss counts more when they have to rank one person's misery against anothers — the interpersonal utility comparison problem, which everyone agrees is unsolveable right up until they have to solve it. I need a case built to order.

  Setup: two ordinary people facing two ordinary permanent losses, nothing science fictional and no perfect measurement of anything. Two methods get run on them. First the bridge-person move: find someone who could plausibly have actually lived through both A's post-loss life and B's post-loss life, in sequence, and use that person's own intrapersonal tradeoff between the two as the exchange rate. Second, compensating variation: what A and B would each need to be paid to accept the loss, or would pay to avoid it.

  I want them coming apart in the direction I can never get to work: the bridge person's numbers say A's loss is the bigger one, the CV numbers say B's is. Constraints: nobody is irrational, misinformed, or intrapersonally inconsistent, and the split can't just be that B is richer — say how you neutralized that. Keep the scenario itself to one short paragraph, then show both sets of numbers, why each method reads them the way it does, and name the single feature doing the work. Finally, what would a defender of the bridge method say to wriggle out, and does anything change if you rerun it with a bridge person who lived the two lives in the opposite order?
