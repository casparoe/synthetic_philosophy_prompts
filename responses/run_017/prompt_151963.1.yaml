answer: |-
  ### Workshop Design: **"Signal & Sequence"**

  #### **Core Structure**: Two rounds using cards to simulate private evidence and public actions.  
  **Materials**: Deck of cards (remove Jokers), index cards, markers, whiteboard.  
  **Participants**: 14, seated in a fixed order (visible to all).  

  ---

  ### **Rules & Payoff Scheme**  
  **Objective**: Guess the hidden "target suit" (Hearts or Spades) drawn by the facilitator.  

  **Private Evidence Setup**:  
  - Each participant receives a face-down card:  
    - **Strong signal**: Card from target suit (e.g., Hearts) → *High confidence*.  
    - **Weak signal**: Diamond/Club → *No information*.  
    - **Misleading signal**: Card from opposite suit (e.g., Spades) → *Strong but wrong*.  
  - **Distribution** (per round):  
    - 3 strong signals (target suit)  
    - 3 misleading signals (opposite suit)  
    - 8 weak signals (Diamonds/Clubs)  
  - *Participants know*: Strong/misleading signals are 90% reliable; weak signals are useless.  

  **Public Sequence**:  
  - Participants announce guesses in order (1 to 14).  
  - Each writes guess on index card, displays it to all, then places it on a "public timeline" (whiteboard).  

  **Payoff Rounds**:  
  1. **Round 1 (Rational Updating)**:  
     - **Points**: 10 points for correct guess, 0 for wrong.  
     - *Goal*: Illustrate (a) — following public sequence can be rational when it outweighs private evidence.  

  2. **Round 2 (Social Rewards)**:  
     - **Points**:  
       - 10 points for correct guess.  
       - **+2 points** for matching the *previous person's guess* (conformity bonus).  
       - **+3 points** if you’re in the *first 3 guessers* (early mover bonus).  
     - *Goal*: Illustrate (b) — piling on for rewards, not truth.  

  ---

  ### **Timeline (60 min)**  
  1. **Intro (5 min)**: Explain rules, signal strengths, and payoffs for Round 1.  
  2. **Round 1 (15 min)**:  
     - Draw target suit (e.g., Hearts), keep hidden.  
     - Distribute pre-stacked cards (e.g., Participant 3 gets misleading Spade; Participant 10 gets strong Heart).  
     - Guessing sequence: Participants announce/publicize guesses.  
  3. **Transition (2 min)**: Reset cards/timeline; explain Round 2 payoffs.  
  4. **Round 2 (15 min)**: Same as Round 1 (new target suit, re-stacked signals).  
  5. **Debrief (23 min)**: See below.  

  ---

  ### **Predictable Problems & Mitigation**  
  - **Going meta**: Participant says, "This is rigged to make us herd!"  
    - *Mitigation*: Pre-empt by stating, "Play as you would in a real incident; focus on your role."  
  - **Silent participant**: Someone refuses to engage.  
    - *Mitigation*: Assign them a mid-sequence position (e.g., #7) to force engagement.  

  ---

  ### **Debrief Framework**  
  **Map Moments to (a)/(b)**:  
  1. **Round 1, Participant 3 (misleading signal)**:  
     - *Scenario*: Sees two weak-signal predecessors guess "Hearts." Holds strong evidence for "Spades" but follows the crowd.  
     - *Debrief Q*: "Why did you ignore your Spade? Was it laziness, or did the public clues feel decisive?"  
     - **Link to (a)**: Emphasize rational calculation ("Two weak signals + one strong misleading = ambiguous").  

  2. **Round 2, Participant 5 (weak signal)**:  
     - *Scenario*: Sees first 3 guessers agree. Matches them despite no evidence, chasing conformity bonus.  
     - *Debrief Q*: "Did the +2 points sway you? What if this was a real incident?"  
     - **Link to (b)**: Highlight extrinsic rewards vs. truth-seeking.  

  3. **Round 1, Participant 10 (strong signal)**:  
     - *Scenario*: Sees 9 predecessors unanimously wrong (e.g., "Spades"). Breaks unanimity with "Hearts."  
     - *Debrief Q*: "What convinced you to override the crowd? How did it feel?"  
     - **Contrast**: In (a), overriding is rational with strong evidence; in (b), rewards discourage it.  

  **Key Questions for Group**:  
  - "When did following feel *smart*? When did it feel *pressured*?"  
  - "In our incident last quarter, which dynamic ((a) or (b)) dominated? How can we reduce (b)?"  

  ---

  ### **How to Tell (a) Landed vs. (b)**  
  - **Watch for**: **Participant 3’s hesitation in Round 1**.  
    - If they *sigh, pause, or grimace* before following the crowd, (a) landed (they feel trapped by logic).  
    - If they follow *instantly*, (b) might be dominating (social habits prevail).  

  ---

  ### **What the Activity Can’t Capture**  
  **Structural Limitation**:  
  > In real life, **signal quality is ambiguous** and rarely pre-labeled "strong" or "weak."  
  > *You must say out loud*:  
  > *"In reality, you don’t know if your evidence is stronger than others’. This is why psychological safety—where people share doubts openly—is the fix for (b). Rational updating (a) only works when private signals are reliably shared, not buried."*  

  ### **Why This Design?**  
  - **Dropped Candidates**:  
    1. *Urn-and-balls variant*: Too clean; no signal heterogeneity or rewards.  
    2. *"Betting market" with play money*: Violates "no real money" rule; over-complex for 60 min.  
    3. *Silent written estimates*: Lacks public sequence visibility; fails to simulate social pressure.  

  This design forces tension between private evidence/public actions, uses simple materials, and isolates (a) and (b) through contrasting payoffs. Run it as-is, but rehearse timing!  

  --- 
  **Pro Tip**: Pre-set the card distribution (e.g., ensure Participant 10 gets a strong signal against unanimity). Use index cards for guesses to create a visible "timeline" on the wall.
