prompt: |-
  I do anti-corruption training at a mid-sized manufacturing company and we've just expanded into two countries where basically every deal involves some gift, favour, or job-for-a-cousin going to somebody official. Our global policy says nothing above about 25 dollars and everyone ignores it, and to be honest I've stopped believing the policy describes anything real. The definition we're supposed to work with — roughly, abusing a position of trust for private gain — doesn't seperate the cases I actually care about, so on my own I've come up with three tests and I want to try them on something. Test one, the refusal test: a bribe is supposed to be an exchange both sides can decline, but if nothing in a given system can be refused without cost, then either every exchange there is coercion rather than corruption, or the concept has nothing to grip on. Test two, rent versus buy: cash buys a single decision, whereas a gift or a favour buys the person — it makes them your guy for the next ten years — so maybe the thing we treat as the mild case is actually the worse one. Test three, the substitute test: where the state doesn't deliver protection or credit, a patronage network isn't corrupting an order, it IS the order, and calling it corruption may just be what people say when they already have a state that works.

  I'm thinking of showing two clips in a session and I don't want to use The Godfather as a cheap scare clip, so please read the film (Part II too, if it helps) through these questions. Look at the wedding-day petitions — the undertaker asking for justice, the baker's son-in-law staying in the country, the singer who needs a movie part — where the Don is asked for things no court would give and gives them; look at Sollozzo and the police captain he supposedly keeps in his pocket, which is the straightforward bribery case; look at the senator in Part II who insists he's a different kind of operator and gets told that he and Michael are in the same racket; and look at Michael's whole project of going legitimate and the moment he says he keeps getting pulled back in. Where is the film showing me an obligation, and where is it showing me a corrupt exchange, by its own lights? Does it defend the favour economy as a working alternative to a system that doesn't serve these people, or is it just levelling — saying the senator and the gangster are equally crooked — and if it is levelling, does the film notice that this move is exactly what a guilty person would say? I'd also like you to tell me honestly where the reading strains: it's a family melodrama, the Don is a criminal rather than a patron, and maybe the whole lens is a category mistake. Don't quote the film at me, I know the scenes.

  After the reading, give me a table with these columns: "scene" (a short label), "the_exchange" (who gives what to whom and for what), "my_tests" (which of the three tests it passes, fails, or breaks on, in one sentence each — say "breaks" if the test just doesn't fit), "film_says" (what the film's own framing treats it as: obligation, corruption, or neither), and "strain" (where my test or the film is being unfair to the other). Then one JSON object at the end: {"does_the_film_defend_clientelism": "yes | no | levels_without_defending", "what_it_adds_that_argument_doesnt": "...", "best_clip_for_training": "...", "clip_to_avoid_and_why": "...", "question_im_left_with": "..."}.
reasoning: |-
  We are analyzing scenes from The Godfather (Parts I and II) through the lens of three tests for corruption:

  1. **Refusal Test**: A bribe is an exchange both sides can decline without cost. If nothing can be refused without cost, then either every exchange is coercion or the concept of corruption doesn't apply.
  2. **Rent vs Buy Test**: Cash (rent) buys a single decision, while gifts/favors (buy) buy the person for the long term. The latter might be worse.
  3. **Substitute Test**: Where the state fails to provide protection or credit, a patronage network isn't corrupting the order but is the order itself. Calling it corruption may be unfair when the state doesn't work.

  We are examining specific scenes:

  - The wedding-day petitions (Bonasera the undertaker, Nazorine the baker, Amerigo Bonasera's friend for his daughter, and Johnny Fontane asking for the movie part) in Part I.
  - Sollozzo and the police captain (McCluskey) in Part I.
  - The senator (Pat Geary) in Part II, who says he's different but is told he's in the same racket.
  - Michael's attempt to go legitimate and his statement about being pulled back in.

  We are to create a table with columns: 
  - **scene**: short label
  - **the_exchange**: who gives what to whom and for what
  - **my_tests**: for each test (refusal, rent vs buy, substitute) in one sentence, whether it passes, fails, or breaks (if the test doesn't fit)
  - **film_says**: what the film frames it as (obligation, corruption, or neither)
  - **strain**: where the test or the film is being unfair to the other

  After the table, we provide a JSON object with:
  - does_the_film_defend_clientelism: "yes", "no", or "levels_without_defending"
  - what_it_adds_that_argument_doesnt: a brief description
  - best_clip_for_training: which scene would be best for the training session and why
  - clip_to_avoid_and_why: which scene to avoid and why
  - question_im_left_with: a question that remains after the analysis

  Let's break down each scene:

  1. **Wedding-day petitions (Part I)**:
     - *The exchange*: Various people (Bonasera, Nazorine, others) ask Don Vito for favors (justice for his daughter, help for his son-in-law to stay in the country, a movie role for Johnny). The Don grants these, and in return, they owe him a favor to be called upon later.
     - *Refusal Test*: The petitioners could have refused to ask? But once they ask and the favor is granted, they cannot refuse the future call without cost (they are obligated). The Don is also bound by the obligation of the day (he cannot refuse a request on his daughter's wedding day). So, the initial request can be made without immediate cost, but the future obligation is binding. The test breaks because the exchange is not a one-time bribe but a long-term relationship.
     - *Rent vs Buy Test*: This is clearly a "buy" situation. The Don is building long-term loyalty. This test highlights that these favors are more insidious than a one-time bribe because they create a network of obligation.
     - *Substitute Test*: The film shows that these people turn to the Don because the state has failed them (the courts didn't give Bonasera justice, immigration is a problem, the movie studio head is corrupt). So, the patronage network is substituting for a failing state. The film seems to defend this as necessary for these people.
     - *Film says*: The film frames this as obligation and tradition (the Sicilian way). It's neither corruption nor bribery in the modern sense; it's an old system of patronage.
     - *Strain*: The tests (especially substitute) might be unfairly applied because the Don is a criminal, but the film presents it as a cultural alternative. The film might be romanticizing the system.

  2. **Sollozzo and Captain McCluskey (Part I)**:
     - *The exchange*: Sollozzo (the drug dealer) pays Captain McCluskey for protection and to help assassinate Don Vito. This is straightforward bribery.
     - *Refusal Test*: McCluskey could refuse the bribe without immediate cost? He's a corrupt cop and might lose the money, but he's not under direct threat. However, once he takes it, he's compromised. The test passes: it's a bribe that could be refused (though it's implied that the system is corrupt and many take bribes).
     - *Rent vs Buy Test*: This is a "rent" situation: cash for specific services (protection and turning a blind eye to the hit). It's a one-time (or repeated) transaction without deep loyalty. The film shows it as more straightforwardly corrupt and less stable than the family's system.
     - *Substitute Test*: The state (police) is supposed to provide protection and uphold the law, but McCluskey is corrupt. This isn't substituting for a failing state; it's corrupting a functioning one (in theory). The state is present but corrupted.
     - *Film says*: The film clearly frames this as corruption. McCluskey is a dirty cop who takes money for illegal acts.
     - *Strain*: The tests fit well, but the film doesn't show the state as entirely absent here, so the substitute test might break (it's not a substitute, it's corruption of an existing system).

  3. **Senator Pat Geary in Part II**:
     - *The exchange*: Michael Corleone offers to "help" Senator Geary out of a scandal (a dead prostitute in his bed) in exchange for the senator's support for the Corleone family's gaming license. The senator initially tries to extort the Corleones but ends up indebted to them.
     - *Refusal Test*: The senator could have refused Michael's help? But then he would face scandal and ruin. So, once the scandal happens, he has no good options. He can refuse the deal only at great cost. This might break the test because the situation is coercive (the setup might even be orchestrated by Michael).
     - *Rent vs Buy Test*: This is a "buy" situation. By helping the senator, Michael gains a long-term ally in the government. The favor is not just for one decision but for ongoing support.
     - *Substitute Test*: The state (represented by the senator) is supposed to be legitimate, but it's shown as corrupt. The patronage network (Michael) is not substituting for a missing state but corrupting it further. However, the film levels by saying the senator is as corrupt as the gangster.
     - *Film says*: The film frames this as both corruption and a power play. Michael tells the senator they are the same. It's corrupt on both sides.
     - *Strain*: The film's leveling (saying they are the same) might be too simplistic. The tests (especially rent vs buy) fit, but the substitute test breaks because the state is present and being corrupted, not absent.

  4. **Michael's attempt to go legitimate and being pulled back in (Part II)**:
     - This is more of an arc than a single exchange, but we can look at the moment when Michael says, "Just when I thought I was out, they pull me back in." This comes after he tries to make the family business legitimate but ends up ordering hits and engaging in corruption to protect the family.
     - *The exchange*: Not a single exchange, but the overall dynamic: Michael gives up his dream of legitimacy in exchange for power and protection of the family. He is drawn back into the world of favors and violence.
     - *Refusal Test*: Can Michael refuse? He tries to get out, but the circumstances (threats, obligations) force him back. He cannot refuse without cost (the family's destruction). So, the test breaks because it's about his role, not a specific exchange.
     - *Rent vs Buy Test*: This is about the entire system. Michael is trying to "rent" the state (go legitimate) but finds that he is already "bought" by the obligations of the family and the system. He is trapped in the long-term relationships.
     - *Substitute Test*: The state (Nevada gaming commission, etc.) is present but corruptible. Michael's attempt to join the legitimate world fails because he cannot escape the substitute system (the Mafia) that he was part of. The film shows that the legitimate world is not so different.
     - *Film says*: The film frames this as a tragedy. Michael is trapped by the obligations and the system he inherited. It's neither pure obligation nor corruption; it's the inescapable nature of the life.
     - *Strain*: Applying the tests to an entire arc might not fit well. The tests are designed for exchanges, not for a character's journey.

