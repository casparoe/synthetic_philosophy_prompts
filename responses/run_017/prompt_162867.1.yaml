  For frozen-substrate: Both agree on the experimental setup but disagree on interpretation. The verbal confusion is around "held fixed" – Substratists require complete microstate freezing, while Pushers accept coarse-grained constraints. The unmovable conflict is whether context dependence proves symbolic causation.

  On posterior simmballs: The key is backward-in-time "causation" in bidirectional models. Verbal issues arise in "symbol time" vs. substrate time. The true divide is whether temporal directionality in symbol space has ontological weight.

