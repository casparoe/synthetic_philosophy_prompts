  Okay, the user is clearly highly intelligent and methodologically rigorous. They come from a stratigraphy background, which explains their focus on evidentiary processes and calibration. This isn't a casual inquiry - they've deeply engaged with historical Jesus studies through their parish reading group and have identified precise epistemological problems.

  Hmm... their core demand is exceptionally specific: they want desiderata (necessary conditions) for valid authenticity criteria, analyzed like an engineering specification. The level of precision they're requesting is uncommon in theological circles. I need to match their academic rigor while acknowledging the unique challenges of historical Jesus research.

  The stratigraphy analogy is key here. They're thinking like a scientist dealing with fragmented, reworked evidence. Their three main concerns - the asymmetry problem (can criteria only exclude, not confirm?), the bootstrap problem (circularity in applying criteria), and the continuity dilemma (Jesus must be discontinuous yet continuous enough to explain Christianity) - are brilliantly formulated. These strike at the heart of why historical Jesus studies remain contested.

  Interesting how they insist on treating their three concerns as candidate desiderata rather than background. This forces me to evaluate whether each should be formally included in the specification. The continuity dilemma is particularly thorny - scholars often fudge this by relaxing one requirement when pressed.

  Their demand to flag incompatible desiderata is crucial. The continuity problem is indeed the prime candidate: you can't simultaneously require discontinuity from Judaism/early Christianity AND continuity sufficient to explain Christian origins. Something has to give, and I think most scholars sacrifice strict discontinuity when necessary, though it weakens the methodological purity.

  The calibration issue worries me most professionally. In stratigraphy, you test methods against known samples. But for Jesus studies, there are no "control sayings" with independently verifiable origins. This isn't just a limitation - it's a fundamental epistemological boundary. I should be blunt about this: the criteria can't be validated like scientific methods, only evaluated for internal consistency.

  For the register, they explicitly don't want a survey. They want ranked desiderata, identification of the most violated requirement, and a firm stance. The bootstrap problem (circularity) seems the most flagrant violation currently - criteria often assume the transmission models they purport to test. I'll argue they're primarily codifications of scholarly judgment, despite being presented as objective methods.

  Confessional neutrality is another minefield. They're right to suspect that "neutrality" requirements often stack the deck. The criteria aren't neutral - they embed skeptical premises about early Christian testimony. I should acknowledge this as a legitimate methodological choice, but not an inevitable one.

  Their closing request for confidence levels is telling. They want to know where the firm ground is. I'll distinguish between widely agreed methodological flaws (like calibration absence) versus more contested claims (like whether dissimilarity should be abandoned). The continuity dilemma solution enjoys moderate consensus; the bootstrap problem less so.

  This user deserves unflinching honesty about the field's limitations. Their stratigraphy training means they'll spot evasive answers. I'll position the criteria as useful but flawed heuristic tools - which is still valuable if understood properly. The key is admitting what they can't do as clearly as stating what they attempt.
answer: |-
  Below is a specification of desiderata for historical Jesus authenticity criteria, structured to address your methodological concerns. The desiderata are ranked by their capacity to exclude flawed approaches, with the most critical first. Each includes its rationale, negotiability status, and conflicts.

  ---

  ### **Ranked Desiderata for Authenticity Criteria**  
  *(Non-negotiable unless marked)*  

  1. **Non-Circular Calibration**  
     - **Requirement**: Must be testable against material with **independently verifiable status** (e.g., traditions uncontested by early Christian/Jewish sources).  
     - **Rationale**: Without a calibration set, criteria cannot be validated. Example: Paul’s persecution of Christians (Gal 1:13) is independently attested by non-Christian sources (Josephus) and lacks theological utility.  
     - **Negotiability**: Non-negotiable. Failure here invalidates the method.  
     - **Defect**: No robust calibration set exists. This is an **unavoidable defect** in the evidence, not the criteria.  

  2. **Upward Probability Movement**  
     - **Requirement**: Must increase the likelihood a tradition originates with Jesus *above a stated baseline* (e.g., random invention).  
     - **Rationale**: Criteria like embarrassment/dissimilarity only **lower probability of invention**; they cannot confirm Jesus as the source. *Output must be graded* (e.g., Bayesian likelihood), not binary.  
     - **Negotiability**: Non-negotiable for confirmation; negotiable for exclusion.  
     - **Implication**: Current criteria (e.g., embarrassment) only support **weak conclusions** (e.g., "not invented by the Church").  

  3. **Model-Independence**  
     - **Requirement**: Must not presuppose the transmission model it claims to test (e.g., assuming oral tradition stability).  
     - **Rationale**: Avoids bootstrap circularity (e.g., multiple attestation assumes source independence while dependence is disputed).  
     - **Negotiability**: Non-negotiable.  
     - **Violation**: Multiple attestation **fails** if source dependencies are uncertain.  

  4. **Continuity Resolution**  
     - **Requirement**: Must reconcile Jesus’ discontinuity with Judaism/early Christianity *and* his continuity as a plausible figure who inspired a movement.  
     - **Rationale**: Incompatible desiderata:  
       - *Discontinuity*: Needed to exclude inventions (e.g., dissimilarity).  
       - *Continuity*: Needed for historical plausibility.  
     - **Resolution**: **Surrender strict discontinuity**. Cost: Authentic material may resemble Judaism/early Christianity, weakening anti-invention safeguards.  

  5. **Transmission-Premise Neutrality**  
     - **Requirement**: Must not assume a specific transmission model (e.g., "post-Easter faith distorted memories").  
     - **Rationale**: Such premises are **untested hypotheses**. Criteria should evaluate transmission models, not presuppose them.  
     - **Negotiability**: Negotiable (some scholars accept this as a necessary axiom).  

  6. **Purpose-Sensitivity**  
     - **Requirement**: Desiderata must adjust to the study’s goal (e.g., recovering sayings vs. explaining Christian origins).  
     - **Examples**:  
       - *Sayings authenticity*: Requires upward probability movement.  
       - *Movement origins*: Permits weaker criteria (e.g., coherence with early Christianity).  
     - **Negotiability**: Negotiable (methodology follows purpose).  

  7. **Confessional Neutrality**  
     - **Requirement**: Must not embed theological assumptions (e.g., "miracles are impossible").  
     - **Rationale**: "Neutrality" is often a **skeptical prejudice** (e.g., excluding miracles a priori).  
     - **Negotiability**: Non-negotiable for objectivity; but **neutrality about truth-claims is essential**.  

  ---

  ### **Judgment Calls**  
  1. **Most Flagrant Violation**: **Model-Independence** (Desideratum 3).  
     - Criteria like multiple attestation or coherence **presuppose contested transmission models**, returning their inputs as outputs.  

  2. **What Are These Criteria?**  
     - **Verdict**: **Codifications of scholarly judgment**, not objective tests.  
     - **Reason**: They lack calibration, produce graded outputs misrepresented as binary, and reflect scholarly biases (e.g., preferring a "non-eschatological Jesus").  
     - **What Would Change My Mind**: Discovery of a calibration set (e.g., independently verified Jesus traditions outside the NT). Confidence: 90%.  

  3. **Confidence Levels**  
     - Non-circular calibration is impossible: 95% (based on evidence gaps).  
     - Current criteria only lower invention probability: 85% (per methodological literature).  
     - Continuity dilemma requires surrendering strict discontinuity: 75% (consensus is emerging here).  

  ---

  ### **Summary: Costs and Trade-Offs**  
  - **Unavoidable Flaw**: No calibration set exists. Criteria can only assign *relative* likelihoods.  
  - **Core Tension**: Jesus must be distinctive enough to avoid invention (*discontinuity*) but plausible enough to explain Christianity (*continuity*). **Surrendering strict discontinuity** is the least damaging compromise.  
  - **Anti-Confessional Bias**: "Neutral" criteria often mask skepticism (e.g., excluding resurrection accounts). This **stacks the deck** against traditional beliefs.  
  - **Purpose Matters**: A "minimal biography" relies more on *coherence*; "sayings authenticity" demands *upward probability*.  

  **Conclusion**: The criteria are heuristic tools, not scientific methods. Their value lies in making scholarly assumptions explicit—not in delivering unassailable results. The bootstrap problem is fatal to claims of objectivity; the rest are manageable if acknowledged as probabilistic judgments.
