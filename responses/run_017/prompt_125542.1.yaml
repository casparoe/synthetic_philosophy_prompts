  Regarding judging historical figures by modern morals - this is complex. Plutarch absolutely judged past figures by his contemporary standards (he criticized past Romans for things acceptable in their time but not in his). However, he also practiced contextual understanding - he tried to explain why figures acted as they did within their circumstances. He'd likely reject both extremes: pure presentism and pure relativism. His approach would be: understand their context thoroughly, then assess their choices against timeless virtues (courage, justice etc.), recognizing that specific applications change.

