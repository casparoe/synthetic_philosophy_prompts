prompt: |-
  Hi — I've got a slightly odd job and I need something I can actually use day to day.

  I'm the only trained historian on a small team that produces the interpretive material for heritage sites and walking trails across one English county: panels of about ninety words, audio stops, the occasional small exhibition. We turn out roughly fourty items a year. I get around three days of research per item, two weeks at most for anything bigger, and everything has to be signed off by a community liaison officer and then by our trustee commitee. Most of the drafting is done by two junior researchers with history BAs who've never done any theory and don't especially want to.

  The argument we keep having is the old one between history-from-below / microhistory and the history of elites and states — except we have it in a form where somebody has to decide what goes on a panel by Friday. We've shipped both failure modes. One: the item that is basically the archive of the state talking — a mayor, a charter, an act of parliament, a regiment — with the assumption quietly baked in that the document is the event and that its own categories are the categories the people involved used. Two: the item that is one vivid person and a lot of atmosphere, where the vividness is doing all the argumentative work and a single life is being made to carry a claim about ordinary people that it can't carry.

  So: write me a decision procedure my team can run on a proposal. The questions in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision to a person because the question is one of values rather than facts. It needs to be runnable by the juniors in half a day, so rule out anything that depends on months of archival digging, and tell me honestly which steps are judgement calls wearing a lab coat.

  The hard cases it has to handle, because these are the ones that actually come up:

  - The only reason we know a non-elite person's name at all is that a bureaucracy wrote it down for its own purposes — an assize file, a poor-law removal order, a workhouse admission book, a militia list, a tithe map. When is that fatal to the item, when is it survivable, and what has to go on the panel in each case?
  - We almost never know how many other people lived like the one person we happened to find, so "typical" is usually unavailable to us. Which claims does that block, and which claims (if any) survive it? I want this nailed down, because it's the objection I can never answer when a trustee pushes back.
  - Proposals that arrive already framed as celebration: a civic anniversary, a benefactor, a regiment, a great man the town is proud of. Is there a version of the procedure that lets us say yes without lying, and what has to change on the panel if so?
  - Genuinely silent subjects, where the honest panel would be about an absence rather than a person. I don't want the absence turned into a sentimental victim-story either.
  - Scaling: when does a close-up of one household license a sentence about the county, and when does it only license a sentence about that household?
  - A reverse check on me personally. I was trained on policy and state papers, I find elite sources much easier to work with, and I'm slightly suspicious that microhistory is anecdote with footnotes. I want the procedure to catch me defaulting to the sources that are convenient rather than the ones that are right.

  Then run it on three live ones.

  1. An 1840s assize file and a parish relief roll that name the same woman, convicted of stealing bread, plus a bit of local newspaper coverage. I want a panel about hunger and crime in the valley.
  2. A near-complete run of diaries from a tenant farmer, 1867–1901, with rent books and a letter book. The obvious pitch is "the voice of the rural poor" and I don't trust it.
  3. The town council and the local branch of a veterans' association want a mural commemorating the Victorian mayor who paid for the library and the reading room. He was also the magistrate who sentenced the woman in item 1, and we've just found that out.

  At least one of those should come out with an answer I won't like — tell me plainly which one and why rather than softening it, since I'll have to defend it to the council either way.

  Please write it in British English, and give me something I can hand to a twenty-two-year-old on a Tuesday morning, not an essay for me to admire. Finish by saying what the procedure can't do: the situations where it'll misfire, and where it risks giving us false confidence.
reasoning: |-
  Hmm, this is a fascinating and very practical request from a heritage historian working under tight constraints. They need a decision procedure that can resolve the elite-vs-microhistory tension in their interpretive materials, with specific hard cases addressed. 

  First, let's unpack their operational reality: tiny team, 3-day research windows, junior staff with no theory background, and political sign-offs. The core tension they describe is fundamental - state archives inherently distort non-elite stories, while vivid individuals can't bear the weight of representing whole groups. 

  The key requirements jump out:
  - Must be executable by BA-level juniors in half a day
  - Needs concrete thresholds for when problematic sources are usable
  - Requires safeguards against their own elite-source bias
  - Must handle those five recurring hard cases
  - Should flag when something becomes a values judgement

  For the decision flow, I'm imagining a branching checklist that forces explicit consideration of the big pitfalls. The "state records naming non-elites" problem needs special handling - we can't reject them wholesale (that'd leave only silence) but must account for the bureaucratic lens. The "typicality" issue requires strict rules about scaling claims. 

  The three test cases are perfect stress tests:
  1. The hungry woman - classic "archival glare" problem
  2. The farmer diaries - surface-level "voice of the poor" claim
  3. The mayor - where celebration meets uncomfortable context

  Notably, they want intellectual honesty - including outcomes they'll dislike. That suggests case 3 probably fails the procedure, which will be politically messy but necessary. 

  For limitations: this won't fix source scarcity, can't create representativeness where none exists, and community politics will sometimes override it. But as a grounding tool for juniors? Worth its weight in gold. 

  Time to build that flowchart in plain British English...
answer: |-
  Here’s a practical decision procedure for your team, designed as a checklist. It’s structured to flag pitfalls in 4–6 hours, with clear thresholds for rejection or revision. **British English throughout.**

  ---

  ### **DECISION PROCEDURE: HERITAGE PANEL PROPOSAL CHECKLIST**  
  *Run these questions in order. Stop at first "REJECT" or "REVISE". If all pass, APPROVE with notes.*

  #### **1. SOURCE BIAS CHECK**  
  *"Whose voice is this, and what were they trying to achieve?"*  
  - **Sufficient answer:** Names the creator(s) of the core source(s) and their institutional agenda (e.g., "parish overseer enforcing poor laws", "mayor’s memoir boosting his reputation").  
  - **REJECT if:** No acknowledgement of bias OR source is *only* elite/state with no counter-evidence (e.g., "the Charter of 1542 says..." without critique).  
  - **Revise to add:** 1–2 sentences naming the bias (e.g., "This militia list recorded men for conscription, not daily life").  

  #### **2. TYPICALITY CLAIM CHECK**  
  *"What evidence supports scaling this to a group?"*  
  - **Sufficient answer:** For claims about groups (e.g., "local people", "the poor"), cites either:  
    - (a) Quantifiable data (e.g., census, wage rolls showing 80% earned below X), OR  
    (b) 2+ independent non-elite sources (e.g., diary + trade union minutes) agreeing.  
  - **REJECT if:** Asserts "typical", "ordinary", or "most" with only one non-elite source (e.g., one diary).  
  - **Revise to:** Individual story only (e.g., "Farmer John Smith wrote..." not "Farmers like Smith...").  

  #### **3. SILENCE/AFFIRMATION BALANCE**  
  *"What’s missing, and are we forcing emotion?"*  
  - **Sufficient answer:** For "silent" subjects (e.g., workhouse inmates):  
    - (a) Names the *institution* creating the silence (e.g., "Workhouse admission books recorded only..."), AND  
    (b) Avoids speculative victimhood (no "heartbreaking", "tragic").  
  - **REJECT if:** Turns absence into sentimental fiction (e.g., "Imagine their tears...").  
  - **Revise to:** Focus on the system, not inner lives (e.g., "Admission records show 120 children entered yearly; we know nothing of their voices").  

  #### **4. CELEBRATION SAFEGUARD**  
  *"Does this acknowledge power structures?"*  
  - **Sufficient answer:** For anniversaries/great men:  
    - (a) Names beneficiaries *and* excluded groups (e.g., "Funded library for rate-paying men; women used separate reading room"), OR  
    (b) Contextualises power (e.g., "As magistrate, he sentenced 20 for theft; as mayor, he donated £500").  
  - **REJECT if:** Uncritical praise with no context (e.g., "Generous Mayor Brown built the library").  
  - **Revise to:** Add 1 counterpoint (e.g., "While celebrated for philanthropy, he opposed voting reform").  

  #### **5. SCALING CLAIM CHECK**  
  *"How far can this evidence stretch?"*  
  - **Sufficient answer:** For county/household claims:  
    - Household → Parish: Needs 2+ similar households in same parish.  
    - Parish → County: Needs 3+ parishes in comparable records (e.g., tithe maps).  
  - **REJECT if:** Scaling beyond evidence (e.g., one farm diary → "all valley farmers").  
  - **Revise to:** Narrow the claim (e.g., "In this parish..." not "Across the county...").  

  #### **6. PERSONAL BIAS TRAP (FOR YOU)**  
  *"Did we default to convenient sources?"*  
  - **Sufficient answer:** Lists non-elite sources *consulted* (even if thin). If none, states why (e.g., "No surviving pauper letters; used overseers’ accounts").  
  - **REVISE if:** Elite sources dominate *and_ non-elite alternatives exist (e.g., using magistrates’ reports but ignoring newspaper petitions).  
  - **No rejection** – forces transparency. Add note to panel: "Based on parish officials’ records; no paupers’ letters survive."  

  ---

  ### **TESTING LIVE CASES**  
  *(Using procedure above)*  

  #### **Case 1: Hungry Woman (1840s)**  
  - **Q1:** State sources (assize/relief) + newspaper. *Pass (acknowledge bias: "trial focused on guilt, not poverty")*.  
  - **Q2:** Claims "hunger and crime" – **REJECT**. No data on how many stole food; one woman ≠ valley trend.  
  - **Revise to:** "In 1842, [Name] was convicted of stealing bread. Relief rolls show 50+ in parish needed aid that winter. *Individual cases hint at desperation, but scale is unrecorded*."  

  #### **Case 2: Tenant Farmer Diaries (1867–1901)**  
  - **Q1:** Personal diaries + rent books. *Pass (bias: "his perspective only")*.  
  - **Q2:** "Voice of the rural poor" – **REJECT**. One farmer ≠ "the poor"; no labourers’ voices.  
  - **Revise to:** "John Smith’s diaries reveal one farmer’s struggles: rising rents, wet harvests. *Most rural poor left no records; his experience is rare*."  

  #### **Case 3: Mayor’s Mural (Hard Stop)**  
  - **Q1:** Elite sources (council/veterans). *Pass but flag bias*.  
  - **Q4:** Uncivic celebration – **REJECT**. No counterpoint (sentencing woman in Case 1 ignored).  
  - **Revise to:** Add: "As magistrate in 1842, he sentenced [Name] for theft; as mayor, he funded the library." *Trustees may still reject – this is a values call*.  
  **→ Outcome you won’t like:** Case 3 fails without revision. Veterans may object, but procedure forces ethical transparency.  

  ---

  ### **WHAT THIS CAN’T DO**  
  1. **Create evidence where none exists.** If archives are silent, the procedure won’t magic "typicality".  
  2. **Resolve values disputes.** Trustees may override Q4 (celebration) – that’s political, not historical.  
  3. **Fix bad sourcing.** Garbage in = garbage out; juniors must still find *some* non-elite traces.  
  4. **Prevent "atmosphere over argument".** Vivid writing can still slip bias past checks – stay vigilant.  
  5. **Replace expertise.** Judgment calls (e.g., "independent sources" in Q2) require your oversight.  

  **Final note:** This flags *problems*, not solutions. It won’t make hard truths easy – but it’ll force your team to confront them *before* the trustees do. Stick it on the wall, and run every draft through it. Tuesday morning just got less chaotic.  

  ---  
  **One pager version available – shout if you need it laminated.**
