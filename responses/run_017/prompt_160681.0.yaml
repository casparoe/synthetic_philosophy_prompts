prompt: |-
  hey — I'm on the student conduct board at my school, which is the panel that hears cases where one student says another student did something (copied homework, harrased someone, took something, whatever) and then writes up what we think probably happened, and the dean decides the punishment after that. It's me plus four other kids and a teacher advisor who has to sign off on whatever we write. We get maybe one case a week, hearings are 20-30 minutes, nobody trained us in anything, and "use your judgment" in practice means whoever talks smoother and isn't shaking wins. I was complaining about this to my sister's boyfriend, who's in grad school for philosophy, and he said there's a whole literature on this stuff — something about credibility deficits, identity prejudice, and also a version where someone can't even name what happened to them because the words aren't there yet — and the more I think about it the more I think we're definately doing the bad thing a lot of the time. But his version feels too strong to me too, because some kids really do lie or exaggerate or misremember, and we can't just believe everybody, and we're not a court, we don't get to bring in lawyers or delay for a month.

  So can you turn that into an actual procedure our panel can run on a case, in order? I mean: the questions to ask one after another, what would count as a good enough answer to each one, the point where we stop and say we can't credit this person's account, and the point where we stop and hand it to the advisor or dean because it's actually a values call and not a fact call. Some constraints on it: our writeup form makes us pick a "reason code" from a dropdown for why we did or didn't believe each person — options are things like "inconsistent with other evidence," "implausible sequence of events," "witness had no opportunity to observe," "manner and hesitation while speaking," "prior inconsistent statements" — and I want to know which of those are legitimately about evidence and which are just prejudice with a badge on. Also: what do we do with a kid who's obviously articulate, confident, well-spoken, and tells a clean story — is believing them more automatically the bad thing, or is there a version of relying on that which is fine, and how do I tell the difference in thirty seconds? And what about a kid who reports something but can only say it "felt wrong," or who uses a label they clearly picked up off tiktok last week and applies it loosely — I don't want to be the panel that dismissed someone because they didn't have the vocabulary, but I also don't want to send the dean after someone on pure vibes. And please be honest about where a checklist is just fake rigor, i.e. where we're really making a judgment call and dressing it up as a step.

  Then run the finished procedure on three cases, since that's how I'll know if it's usable. One: a quiet freshman who stutters and sometimes switches into spanish mid-sentence says a popular senior shoved her in the hallway; the senior is the debate captain, very calm, gives a detailed and internally consistent account of being somewhere else entirely, and no footage exists. Two: a sophomore who has made two false reports before — both pretty clearly attention-seeking, everyone on the board knows about them — says someone stole her phone, and this time the details check out against a blurry hallway camera and a text timestamp, though the camera doesn't show a face. Three: pick the case yourself where you think the procedure gives me an answer I won't like, and show it anyway — my guess is it's either a case where the procedure says we should refuse to decide, or one where it says we should discount someone for a reason that feels mean but is actually evidentiary, but you choose. Also tell us straight up what the procedure can't fix: where five sixteen-year-olds with no training, one adult who's half-checking his email, and a dropdown menu are just going to get it wrong no matter what checklist you hand us, and where the honest conclusion is that the decision shouldn't be made by students at all.
reasoning: |-
  Okay, the user is on a student conduct board and they're dealing with cases between students. They feel untrained and notice that articulate, confident students often win, which might be unfair. They mentioned talking to someone in philosophy about credibility deficits and identity prejudice. Now they want a clear procedure to handle cases fairly, especially since they only have 20-30 minutes per hearing.

  First, I need to address their main concerns. They want a step-by-step process that's practical for their time constraints. They also need to know which reason codes in their dropdown are legitimate versus biased. The examples they gave—like the quiet freshman vs. the debate captain, the sophomore with prior false reports, and a tricky third case—show real-world scenarios where bias could play a role.

  The user’s deeper needs might include wanting fairness without assuming everyone is truthful. They’re aware some students lie or exaggerate, so the procedure must balance skepticism and empathy. They also seem worried about dismissing someone just because they lack vocabulary or confidence. Plus, they want honesty about when a checklist is just a facade for judgment calls.

  I should start by outlining a structured procedure. Pre-hearing prep is crucial: gathering evidence, checking histories, and assigning roles. During the hearing, a neutral script helps. The core phases are: initial accounts, probing inconsistencies, evidence review, and credibility assessment. The credibility factors need to separate observable behavior (inconsistencies, evidence conflicts) from prejudicial ones (hesitation, language issues).

  For the reason codes, I'll categorize them. "Inconsistent with evidence" and "prior inconsistent statements" are solid. "Manner and hesitation" is risky but might be okay if used alongside other factors, not alone. "Implausible sequence" is tricky—requires group consensus to avoid bias. "No opportunity to observe" is valid if objectively assessed.

  The articulate student: confidence alone isn't evidence. Need to check their story against evidence, look for over-polished details, and consider motives. The person who "felt wrong" but can't articulate: ask for concrete actions, context, and whether the accused had awareness. Avoid dismissing based on vibes.

  Limitations: Human judgment is unavoidable. Without training, biases creep in. Serious cases shouldn't be handled by students. The dropdown might force oversimplification. The advisor should be more involved, especially in complex cases.

  For the cases: 
  1. Quiet freshman vs. senior. The procedure would note the senior's alibi but no evidence. Hesitation isn't a factor. The report might be inconclusive due to lack of evidence, advising the dean to consider context.
  2. Sophomore with prior false reports. Evidence supports her claim now, so prior acts don't invalidate current evidence. Recommend believing her based on evidence.
  3. The tricky case: a student reports harassment but uses broad terms without specifics. Procedure shows insufficient concrete details, leading to an inconclusive result. Highlights the procedure's limit in such cases.

  The user needs to know where the system's flaws are inherent. They should push for more training or restructuring if possible. Honesty about when the panel isn't equipped is key.
answer: |-
  Here's a practical, step-by-step procedure designed for your constraints, grounded in epistemic justice principles while acknowledging real-world limitations. It targets **fact-finding only** and flags value judgments for the dean.

  **Core Principles:**
  1.  **Separate Facts from Values:** Your job is *only* to establish the most probable sequence of events based on available evidence. *Why* it's wrong or *how* it should be punished is the dean's job.
  2.  **Credibility ≠ Confidence:** Articulate liars exist. Nervous truth-tellers exist. Focus on *external anchors* (evidence, consistency, plausibility against known facts).
  3.  **Minimize Identity Prejudice:** Actively question if a "gut feeling" stems from stereotypes (e.g., quietness, language, prior reputation).
  4.  **"Felt Wrong" Has Weight:** Lack of precise vocabulary doesn't negate experience. Focus on *actions described*, not the label used.
  5.  **Prior Acts ≠ Current Veracity:** History informs scrutiny, not automatic disbelief. Corroborate *this* report.
  6.  **Embrace Inconclusiveness:** If you truly can't tell, say so. It's more honest than forcing a bad call.

  **The Procedure (20-30 Minute Hearing):**

  **I. PRE-HEARING PREP (5 mins BEFORE each hearing - Advisor MUST ensure this happens)**
      *   **A. Evidence Review:** Panel quickly scans incident report, any submitted evidence (texts, pics, witness names, camera note), prior relevant history (ONLY if documented in the case file - *not* gossip).
      *   **B. Assign Roles:** One panelist leads questioning (Chair), one takes detailed notes (Scribe), others listen for inconsistencies/plausibility. Advisor observes but doesn't lead.
      *   **C. Neutral Script:** Chair opens: "We are here to understand what happened on [Date] at [Location/Time]. We will hear from both sides separately. Please describe the events in your own words. We may ask clarifying questions."

  **II. HEARING PHASE 1: Initial Accounts (5 mins per person)**
      *   **A. Reporting Party (RP) Speaks:** Uninterrupted (mostly). Scribe notes key events, people, times, locations, sensory details (what they saw/heard/felt physically).
      *   **B. Responding Party (Resp) Speaks:** Uninterrupted (mostly). Same note-taking focus.
      *   **GOOD ENOUGH:** A basic sequence of events is described, even if fragmented or emotionally charged. *Not good enough:* Complete silence, refusal to engage. (Stop, note "refused to provide account").

  **III. HEARING PHASE 2: Focused Probing (5 mins per person)**
      *   **A. Clarify Ambiguities:** Chair asks *only* for clarification on unclear points from Phase 1 (e.g., "You said 'near the lockers,' which row?", "What time exactly did you leave?").
      *   **B. Identify Inconsistencies (Internal/External):** Chair asks about points conflicting within their *own* account or with *known, undisputed facts* (e.g., "Earlier you said you were alone, now you mention Sarah was there?", "The bell rang at 10:05, you said this happened at 10:10 after you left math, but math ends at 10:07?").
      *   **C. Address Core Dispute:** Ask each party directly about the key point contradicting the other (e.g., "RP says you shoved her at 10:10 by locker 215. What is your response to that specific claim?").
      *   **GOOD ENOUGH:** Answers resolve ambiguities or provide an explanation for inconsistencies (even if just "I don't remember"). *Not good enough:* Evasion, changing story significantly without explanation. (Note the evasion/inconsistency).

  **IV. HEARING PHASE 3: Evidence & Context Check (5 mins Total)**
      *   **A. Present Evidence:** Chair states any physical evidence *neutrally* (e.g., "There is a hallway camera, but footage from that time/area is blurry/no faces visible", "Text message shows you texted at 10:12 saying 'OMG my phone is gone'").
      *   **B. Ask for Response:** Briefly ask each party: "Does this evidence change your account or is there anything you want to say about it?"
      *   **C. Factual Context:** Confirm undisputed logistics (e.g., "Is it agreed you were both in the main hallway between 10:05 and 10:15?").

  **V. CREDIBILITY ASSESSMENT & DECISION (5 mins - Panel Discussion)**
      *   **A. Identify Key Conflicts:** What are the 1-2 *crucial* factual disputes? (e.g., "Was Resp at locker 215 at 10:10?", "Did RP have her phone at 10:00?")
      *   **B. Assess Credibility Factors (Use this checklist - Focus on OBSERVABLE ANCHORS):**
          1.  **Consistency:**
              *   *Internal:* Did their story change significantly *during the hearing* without plausible explanation? (Legit Reason Code: **Prior Inconsistent Statements** *if* documented in the hearing notes).
              *   *External:* Does their account contradict *undisputed evidence* (e.g., timestamped text, class schedule, clear camera shot placing them elsewhere)? (Legit: **Inconsistent with Other Evidence**).
          2.  **Plausibility:**
              *   Does the sequence of events defy basic physics, school logistics, or common sense *in a way not explained*? (e.g., Claiming to be in two places impossibly far apart in 1 minute). (Use **Implausible Sequence of Events** *cautiously* - requires panel consensus on objective impossibility, not just "weird").
              *   Does it contradict *many* independent pieces of evidence? (Legit: **Inconsistent with Other Evidence**).
          3.  **Opportunity/Observation:**
              *   Could the witness realistically have seen/heard what they claim from their stated position? (e.g., Claiming to see a theft through a solid door). (Legit: **Witness Had No Opportunity to Observe**).
          4.  **Corroboration (or Lack Thereof):**
              *   Is there *any* evidence (even circumstantial like a text timestamp, a blurry figure on camera matching description) supporting one account? (Note this under evidence).
              *   Does a *disinterested* witness (if any) support or contradict either account? (Legit: **Inconsistent/Consistent with Other Evidence**).
      *   **C. AVOID/DOWNWEIGHT THESE FACTORS (Potential Prejudice):**
          *   **Manner and Hesitation While Speaking:** Nervousness, stuttering, language switching, emotionality are NEUTRAL. *Only* note if it directly impacts the *substance* of their answer (e.g., stammering *while changing their story* might indicate deception, but stammering throughout does not). *Do not use this code alone.*
          *   **General "Gut Feeling":** Not a code, not evidence.
          *   **Prior Reports (Reputation):** Informs *scrutiny*, not automatic disbelief. Only relevant if it demonstrates a *pattern of provable fabrication in similar circumstances*. Not a standalone code. Focus on *this* evidence.
          *   **Articulateness/Confidence:** Is the story *internally consistent* and *consistent with evidence*? If yes, confidence is irrelevant. If it's smooth *but* contradicts evidence or has hidden gaps, confidence is a red flag for deception. **Believing them *because* they are articulate/confident is the bad thing. Believing them because their detailed story *holds up under scrutiny* is fine.**
          *   **Use of Labels/Vague Feelings:** Focus on the *underlying actions described*. "Felt wrong" needs probing: *What happened that made you feel that way?* ("He stood very close after I asked him to move" is actionable; "He gave me creepy vibes" is not a *fact* for your panel). The label ("harassment") is for the dean. Your job: Did the *described actions* likely occur?

  **VI. CONCLUSION & WRITE-UP (5 mins)**
      *   **A. Probable Finding:** For each key factual dispute, state what the panel finds *more likely than not* to have happened based *only* on factors in V.B.
      *   **B. Reason Codes:** Select *only* the codes corresponding to the **OBSERVABLE ANCHORS** used (Consistency, Plausibility, Opportunity, Corroboration). *Justify each code with a specific example from the hearing/evidence.*
      *   **C. Inconclusive:** If the evidence is genuinely balanced or too scant to reach "more likely than not" on the key facts, state: "The panel could not determine what more likely than not occurred regarding [specific fact]." *This is a valid outcome.*
      *   **D. Values Flag:** If the facts are clear but the *interpretation* is controversial (e.g., "Was this 'just joking' or harassment?"), state the facts clearly and note: "Interpretation of these facts as a conduct violation requires a determination of intent/impact which falls under the Dean's purview."
      *   **E. Handoff:** Advisor reviews write-up for procedural fairness/clarity, signs off, sends to Dean. Advisor *should not* override factual findings unless procedure wasn't followed.

  **Applying the Reason Codes (Legit vs. Badge for Prejudice):**

  *   **Legitimately About Evidence (Use These):**
      *   `Inconsistent with Other Evidence` (Best one - anchor to physical proof/logistics).
      *   `Prior Inconsistent Statements` (Only if *within the hearing/documented report* - not rumor).
      *   `Witness Had No Opportunity to Observe` (Objective assessment of location/senses).
      *   `Implausible Sequence of Events` (Use *sparingly* and only for objectively impossible sequences, not just unlikely).
  *   **High Risk of Prejudice (Use with Extreme Caution, Avoid Solo Use):**
      *   `Manner and Hesitation While Speaking` - Only permissible if *directly linked* to a substantive inconsistency *and* other factors support it. *Never* use based on general nervousness, accent, or language.
  *   **Not Relevant for Facts:**
      *   (Implied) Prior unrelated conduct, general reputation, perceived character.

  **Handling Specific Scenarios:**

  *   **Articulate, Confident, Clean Story:** Scrutinize *harder*. Ask precise follow-ups on minor details. Check against evidence/logistics. Is it *too* clean? Does it avoid uncomfortable details? Does their confidence mask a lack of specifics when probed? **Believing them *only* after their story withstands scrutiny against evidence/logistics is fine. Believing them *because* they sound believable is the bias.**
  *   **"Felt Wrong" / Vague Labels:** Probe for concrete actions: "What did they *do* or *say* that made you feel that way?" "Can you describe exactly what happened before, during, and after you felt that?" Focus your fact-finding *only* on whether those specific actions likely occurred. *Do not* assess if it meets the definition of "harassment" or "assault" – that's the dean's job. Report: "RP stated that Resp [describe concrete actions: e.g., 'stood blocking her locker after being asked to move twice,' 'repeatedly made comments about her body despite requests to stop'] which caused distress. The panel finds these actions likely occurred." Let the dean apply the label/policy.
  *   **Prior False Reports:** Acknowledge the history *increases scrutiny*. Demand *more robust corroboration* for *this specific claim*. Does the *current* evidence (timestamps, camera, texts) support their story *independently*? If the current evidence is strong *despite* their history, believe *this* report. The reason code relates to the *current evidence*, not their past. Note: "While RP has a history of unsubstantiated reports, the panel finds the physical evidence (blurry camera showing figure matching description taking object, timestamped text reporting loss) sufficiently corroborates the *current* claim of theft."

  **Running the Cases:**

  **Case 1: Quiet Freshman (RP) vs. Popular Senior (Resp) - Shoving Claim**
  *   **Prep:** No footage. Resp is debate captain (known fact).
  *   **Phase 1:** RP describes shove near locker 215 around 10:10 am, stutters, mixes Spanish when distressed. Resp gives calm, detailed alibi: in library meeting with Mr. Smith from 10:00-10:20 (debate prep).
  *   **Phase 2:** RP probed: Location/time consistent, no internal inconsistencies, just difficulty speaking. Resp probed: Alibi details consistent internally. Chair asks: "Can anyone confirm your meeting with Mr. Smith?" Resp: "Yes, but he's teaching now." (Note: Needs follow-up *after* hearing).
  *   **Phase 3:** No physical evidence presented. Undisputed both were in the building.
  *   **Credibility Assessment:**
      *   *Conflict:* Was Resp at locker 215 at 10:10?
      *   *Consistency:* Both internally consistent during hearing.
      *   *Plausibility:* Both accounts plausible individually.
      *   *Opportunity:* RP claims direct observation. Resp claims elsewhere.
      *   *Corroboration:* **CRITICAL FOLLOW-UP NEEDED.** Panel (Advisor?) MUST quickly check with Mr. Smith: "Did you meet with Resp approx 10:00-10:20 on [date]?" If Smith confirms: Resp's alibi has strong external corroboration (`Consistent with Other Evidence`). RP's claim has none. If Smith denies meeting or is unsure, alibi lacks support.
      *   *Avoid:* RP's manner/language - **IRRELEVANT**.
  *   **Conclusion (Assuming Smith Confirms):** "The panel finds it more likely than not that Resp was in the library meeting with Mr. Smith at the time of the alleged shoving near locker 215. Resp's account is corroborated by Mr. Smith (`Consistent with Other Evidence`). RP's account, while internally consistent, lacks corroborating evidence." (RP's manner/language **not** cited). *Inconclusive if Smith denies/unsure.*
  *   **Values Flag?** No. Facts point one way.

  **Case 2: Sophomore (RP) with Prior False Reports - Phone Theft**
  *   **Prep:** Two prior false reports (documented in file). Blurry camera shows figure taking *an object* from RP's bag area near claimed time/location. RP texted friend "omg phone gone" at 10:12 (timestamped).
  *   **Phase 1:** RP claims phone stolen from bag in hall between 10:05-10:10. Resp (accused via RP's report) denies being near RP then.
  *   **Phase 2:** RP consistent on core details. Resp denies.
  *   **Phase 3:** Evidence presented: Blurry camera timestamped ~10:07 shows figure near RP's bag location reaching in. RP's text timestamped 10:12. Resp denies being the figure.
  *   **Credibility Assessment:**
      *   *Conflict:* Did Resp take RP's phone?
      *   *Consistency:* RP consistent internally. Resp consistent (denial).
      *   *Plausibility:* Theft plausible; RP's distress text timing plausible after discovery.
      *   *Opportunity:* Camera shows *someone* had opportunity near RP's bag. RP claims it was Resp, but camera doesn't show face.
      *   *Corroboration:* **Key Point.** Camera + text timestamps strongly corroborate RP's claim *that her phone was taken from that location around that time*. The prior false reports *do not* negate *this* physical evidence. They mean we *require* strong evidence - which *exists*. Does the blurry figure *definitively* match Resp? Probably not. *But*, the core factual claim ("phone stolen at that time/place") is corroborated.
      *   *Avoid:* Prior reports - Increase scrutiny but are *overcome* by current evidence. Not cited as a reason *against* RP.
  *   **Conclusion:** "The panel finds it more likely than not that RP's phone was taken from her bag in the hallway around 10:07 am. This is supported by timestamped security footage showing a figure accessing her bag area and RP's timestamped text message reporting the loss shortly after (`Consistent with Other Evidence`). The panel could not determine from the available evidence whether the taking was done by Resp specifically." (Report the *fact* of the theft, be clear on the limitation re: identity if the evidence doesn't show Resp definitively).
  *   **Values Flag?** No. Theft is a factual violation.

  **Case 3: The "Procedure Says No" Case (Where Vocabulary/Lack of Detail Prevents Fact-Finding)**
  *   **Scenario:** RP (junior) claims Resp (classmate) has been "emotionally manipulating and gaslighting" them online and in group projects for months. RP is articulate but uses broad terms. When probed:
      *   "He twists my words in the group chat to make me look incompetent."
      *   "He dismisses my ideas and then presents them as his own later."
      *   "He tells mutual friends I'm unreliable, but won't say it to me."
      *   "It just feels awful and controlling. I know what gaslighting is, and this is it."
  *   Resp denies: "We just have creative differences. I'm passionate. I might correct factual errors in the chat, but never maliciously. I've never claimed her ideas. I might have vented to a friend once when frustrated, but didn't call her unreliable systematically."
  *   **No Evidence:** All online chats are in private groups/servers RP didn't save. No witnesses to private conversations. Mutual friends refuse to get involved/won't confirm specifics.
  *   **Procedure Application:**
      *   **Phase 1/2:** RP uses strong labels ("gaslighting," "manipulating") but provides *no specific, verifiable examples* of *actions* that could be independently judged. E.g., *What* words were twisted? *Which* idea was stolen? *Who* did he tell you were unreliable? Without dates, specific quotes, or witnesses, the *actions* themselves remain vague. RP describes *feelings and interpretations*, not concrete events.
      *   **Phase 3:** No physical evidence. No willing witnesses.
      *   **Credibility Assessment:**
          *   *Conflict:* Did Resp engage in specific actions intended to manipulate/demean RP?
          *   *Consistency:* Both internally consistent, but RP's account lacks concrete anchors.
          *   *Plausibility:* Toxic interactions are plausible, but plausibility isn't proof.
          *   *Opportunity:* They interact, so opportunity exists.
          *   *Corroboration:* **None.** No screenshots, no chat logs, no witnesses willing to confirm specific incidents.
      *   **Conclusion:** "The panel acknowledges RP's distress. However, the report describes patterns of behavior (`gaslighting`, `manipulation`) using terms that require assessing *intent* and *impact over time*. The panel was unable to identify *specific, verifiable factual events* underlying these labels that could be corroborated or disproven with the available evidence (no specific examples with dates/quotes, no saved communications, no corroborating witnesses). Therefore, the panel cannot make a finding of fact regarding the alleged conduct violations. The reported distress and relationship difficulties are noted for the Dean's awareness."
  *   **Why it's Unpalatable but Correct:** You cannot fact-find "gaslighting" based solely on someone's feeling and interpretation without concrete examples of *what was said/done* that could be examined. Your mandate is facts. This is a systemic limitation - such complex interpersonal dynamics often lack the "facts" a panel like yours can rule on. It requires investigation skills, context, and value judgments you lack. **This is where the procedure honestly says: "We can't do this."**

  **What the Procedure CANNOT Fix (The Honest Limitations):**

  1.  **Untrained Human Judgment:** No checklist eliminates bias or guarantees wisdom. Five untrained teenagers, even with good intent, will make mistakes interpreting "plausibility," weighing evidence, or missing subtle cues. Bias (conscious or unconscious) creeps in.
  2.  **The Checked-Out Advisor:** If the advisor isn't actively ensuring procedure is followed, reviewing evidence beforehand, or facilitating follow-ups (like talking to Mr. Smith), the system fails. They are the crucial adult safeguard.
  3.  **Complexity vs. Time:** 20-30 minutes is often insufficient for nuanced cases, especially involving relationships, patterns of behavior, or digital evidence. You will miss things.
  4.  **The Dropdown Menu:** Forcing complex realities into simplistic codes (`Inconsistent w/ Evidence`) inevitably loses nuance. It can mask poor reasoning.
  5.  **"He Said/She Said" with No Evidence:** Many cases boil down to this. Your procedure will often result in "Inconclusive," which feels unsatisfying but is honest.
  6.  **Serious Allegations:** Cases involving potential harassment, assault, discrimination, or significant psychological harm **should not be handled by an untrained student panel under these time constraints.** The stakes are too high. Your procedure might help *structure* it slightly better, but the fundamental lack of expertise and resources remains a critical flaw. These *require* trained investigators, support resources, and more time.
  7.  **Systemic Power Imbalances:** A smooth-talking popular senior *will* often have inherent advantages, and marginalized students *will* face credibility deficits, no matter the procedure. The best you can do is mitigate it, not eliminate it.

  **The Brutally Honest Conclusion:**

  Your panel, as currently structured (untrained students, minimal time, limited evidence access, variable advisor engagement, simplistic reporting), is fundamentally ill-equipped to make consistently fair and accurate findings in anything beyond the simplest cases (e.g., clear-cut cheating with document comparison, witnessed minor theft). The procedure above maximizes fairness *within those severe constraints* by focusing on observable evidence anchors and flagging bias pitfalls.

  **To truly improve justice, advocate for:**
  *   **Mandatory Training:** For panelists AND advisors (bias, procedure, trauma-informed questioning basics).
  *   **More Time/Resources:** At least 45 mins per hearing, clear process for gathering evidence *before* (e.g., getting teacher confirmation of alibis).
  *   **Advisor Role Upgrade:** Advisor must be actively engaged, responsible for evidence collection/follow-up, and a stronger procedural gatekeeper.
  *   **Serious Case Protocol:** Allegations of harassment, assault, discrimination, or persistent bullying get automatically referred to trained staff (Dean/Counselor/Title IX) *before* reaching the student panel, or instead of it.
  *   **Rethinking Student Panels:** Are students the *right* fact-finders for most of this? Their role might be better suited to educational/restorative outcomes *after* facts are established by adults.

  This procedure is damage control within a flawed system. Use it, but know its limits and push for systemic change. Good luck.
