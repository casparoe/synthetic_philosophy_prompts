prompt: |-
  Twelve months ago the river behind our house came over its bank for the third time in five years. In the aftermath I was asked to join the grants committee of a regional flood-recovery fund: a small independent charity that makes discretionary payments to households and small businesses whose losses fall outside insurance and outside the statutory scheme. We meet monthly, we dispose of roughly forty applications a quarter, our decisions are effectively final, and each of us has about twenty minutes and a four-page file per case. None of us is a philosopher or an economist. Our decisions have to be consistent between committee members, and defensible both to an applicant who appeals and to the regulator who reads our minutes.

  Our governing instrument directs us, in its own words, to compensate "losses arising from circumstances the claimant could not reasonably have foreseen or avoided" and to weigh "the extent to which the claimant's own decisions contributed to the loss". Those two clauses pull against one another, and we argue about them every month. Reading a little of the political-philosophy literature on luck egalitarianism — the thought, roughly, that it is unfair for someone to fare worse than others through no fault or choice of their own, while inequalities that genuinely reflect choice are not, on that ground, an injustice — clarified the shape of our problem without giving me any way to decide a case. So what I would like is a procedure.

  Please give me a decision rule my committee could actually run on a file: the questions in order, what counts as an answer to each that is good enough given the evidence we hold, where the sequence stops with a no, and where it must hand the decision to a person because the remaining question is one of values rather than of fact. I care at least as much about the translation as about the outcome: which distinctions from that literature have to survive the move into something a lay committee can apply in twenty minutes, which can be dropped without losing anything, and where a simplified rule will systematically misfire.

  Four knots in particular, which I would like untied rather than merely noted.

  First, the instrument conflates foreseeability with avoidability. A loss can be clearly foreseeable and still not avoidable at any cost the claimant could bear; or avoidable in principle and yet not something a reasonable person would have anticipated. I want the two prised apart, and I want to know which of them is doing the real work.

  Second, our deputy chairman argues that we compensate the wrong thing: that what is unchosen is not the flood but the exposure to it, and that a household which has spent a decade in a property nobody will insure at an affordable premium has already suffered the relevant misfortune whether or not the water ever comes in. That strikes me as right and also unworkable at our budget. Please take a position on whether a rule should be built around realisation or around exposure, and say what follows for a fund that can only pay out after the event.

  Third, we cannot pay everyone, so in practice we compare applicants with one another. That turns an award into a judgement that this claimant is more deserving than that one, rather than a judgement that this claimant's misfortune was unchosen. Is that comparative element corrupting the rule, or unavoidable once there is a budget?

  Fourth, a no from us is not a catastrophe: we signpost to other funds, and nobody sleeps in a flooded house because of our decision. Does that let us keep the harshness worry — the objection that a principle which allocates according to choice will visit ruin on people whose choices were foolish or poorly informed — outside the rule, as a separate safety net, or must it be built in?

  Please then run the procedure as a worked application on three shapes of case from our last quarter. The first: a couple who bought the cheapest house in the village eleven years ago, the only one within their mortgage offer, on a street that the flood maps already placed in the highest risk band — they were told at purchase, they stayed, and their insurance lapsed three years ago when the premium exceeded a month's take-home pay. The second: a widower in his seventies in a cottage his family has occupied since the 1890s, flooded four times, who has twice refused a buy-out above market value because he will not leave. The third: a bakery on a low-lying industrial estate that was outside the flood maps when the lease was signed in 2014 and is now inside them, whose owners have put their savings into fitting it out and cannot relocate without losing the business. At least one of these should come out as a no, and where it does I want that stated plainly rather than softened.

  Finally, tell me what the procedure cannot settle — we also get repeat claims from the same property, about which we are currently hopeless — and what an applicant is entitled to be told about why they were refused.

  Please write in British English.
reasoning: |-
  Okay, the user is part of a flood-recovery grants committee dealing with complex ethical and practical decisions about compensating losses. They need a clear, implementable decision rule that untangles philosophical concepts into a practical procedure. 

  First, I need to unpack their core dilemma: their governing instrument contains two conflicting clauses - compensating "unforeseeable/unavoidable" losses while weighing "claimant's contribution to loss." They've dabbled in luck egalitarianism literature but found it impractical. Their real pain points are: 

  The four knots they mentioned reveal deep operational tensions: 
  1. Foreseeability vs avoidability being conflated in their mandate
  2. Whether to compensate exposure (long-term risk) or realization (actual flood damage) 
  3. How to handle comparative deservingness when budgets are limited 
  4. Whether harsh outcomes can be externalised to other safety nets 

  The three test cases are brilliantly chosen to stress-test any rule: 
  - The budget-conscious buyers who ignored known risks 
  - The emotionally rooted widower refusing buyouts 
  - The bakery trapped by changing flood maps 

  I notice the user is intellectually sophisticated but time-pressed - they want philosophical rigor translated into actionable steps, not academic discourse. Their phrase "a procedure" suggests they value transparency and consistency over perfect theoretical purity. 

  The British English requirement is interesting - they likely need terminology that aligns with UK regulatory frameworks (like the Environment Agency's flood maps) and avoids American legalisms. 

  For the decision rule, I'm considering a flowchart approach with progressive filters: 
  First screen for categorical ineligibility (e.g. insured losses), then factual foreseeability, then practical avoidability, then claimant contribution weighting. The key is making each step evidentiary rather than subjective - e.g. "flood map status at purchase" instead of "should have known." 

  On their four knots: 
  1. Prioritise avoidability over foreseeability - it's more actionable with evidence 
  2. Compensate realization only (exposure is important but unaffordable for them) 
  3. Accept comparison as necessary but mitigate with clear thresholds 
  4. Keep harshness as external safety valve given their limited mandate 

  The bakery case should clearly get a yes, the buyers a no with signposting, and the widower a borderline case needing human judgment. Repeat claims need special handling - perhaps progressive disincentives. 

  Refusal reasons must be specific but not cruel - e.g. "known risk at time of purchase" rather than "you were irresponsible." 

  This will be meaty but satisfying to structure.
answer: |-
  Here is a practical decision procedure for your committee, designed to be applied within 20 minutes per file using the evidence typically available (property deeds, insurance history, flood maps, FCA records, claimant statements). It prioritises operational clarity, separates fact from value judgements, and addresses your four knots explicitly.

  **Core Principles Translated:**
  1.  **Avoidability is Paramount:** The "real work" is done by **avoidability**. A loss is compensable primarily if it was *unavoidable at reasonable cost* for *this claimant* at the *relevant time*. Foreseeability informs avoidability but isn't decisive alone.
  2.  **Compensate Realisation, Not Exposure:** Your budget and mandate are post-event. Compensate the *actual flood loss*, not the diminished value or insurance cost resulting from exposure. Exposure history is evidence for avoidability/contribution, not the loss itself.
  3.  **Comparison is Necessary but Structured:** Scarcity forces comparison. The procedure creates initial eligibility pools based on unavoidable loss. Final awards *within* the eligible pool are compared based on *severity of hardship* and *degree of claimant contribution*.
  4.  **Harshness is Externalised (Within Limits):** Your role isn't the ultimate safety net. The rule can produce "harsh" refusals based on avoidability/contribution. Signposting mitigates this. However, the rule incorporates a "Reasonable Steps" check to avoid penalising marginal choices.

  **The Decision Procedure: A Step-by-Step Rule**

  1.  **Categorical Exclusion Check (Fact-Based):**
      *   *Question:* Is any part of the claimed loss covered by insurance (including valid policy exclusions) *or* statutory schemes (e.g., Bellwin scheme, local authority hardship funds)?
      *   *Evidence Required:* Insurance policy documents, claim outcome letters, correspondence with council/government agencies.
      *   *Decision Rule:* If **YES** for the specific loss claimed, **NO AWARD** for that element. Proceed only with *uncovered* losses. If **NO**, proceed to Step 2.

  2.  **Foreseeability at Critical Point (Fact-Based):**
      *   *Question:* Was the *specific flood risk* to this *specific property* reasonably foreseeable *at the time the claimant made the key commitment* (purchase, major renovation, signing long lease)?
      *   *Evidence Required:* EA Flood Map (History if available) status *at critical point*, property search documents, local knowledge/minutes, insurance quotes/availability at critical point.
      *   *Decision Rule:*
          *   If **Property was in EA Flood Zone 3 (High Risk)** at critical point: **Presumed Foreseeable**. Proceed to Step 3.
          *   If **Property was in EA Flood Zone 2 (Medium Risk) or lower** at critical point: **Presumed Not Foreseeable** at critical point. Proceed to Step 4.
          *   *Ambiguous/Disputed?* (e.g., map changes, local disputes): Committee weighs evidence. If **Foreseeable** on balance, proceed to Step 3. If **Not Foreseeable**, proceed to Step 4.

  3.  **Avoidability at Reasonable Cost (Fact/Value Judgement - Hands to Committee):**
      *   *Question (If Foreseeable from Step 2):* Could the claimant have *avoided the loss* by taking reasonable steps *after* the risk became foreseeable, without incurring disproportionate cost/hardship *for their circumstances*?
      *   *Evidence Required:* Insurance history (lapse reasons, affordability), evidence of protective measures considered/taken (flood barriers, resilience), relocation feasibility (job/family ties, finances), buy-out offers refused, professional advice received.
      *   *Committee Considerations:* What constitutes "reasonable" and "disproportionate"? Consider claimant's financial means, age, health, local ties, availability/affordability of insurance, availability/cost of mitigation, feasibility of relocation. *Focus: Was staying/mitigating the only viable option?*
      *   *Decision Rule:*
          *   If **Avoidable** (e.g., affordable insurance declined, feasible relocation refused without compelling reason, effective mitigation not taken up): **NO AWARD**. STOP.
          *   If **Unavoidable** (e.g., insurance genuinely unaffordable *despite effort*, relocation impossible/severely detrimental, effective mitigation unfeasible/unaffordable): Proceed to Step 4.
          *   *Borderline?* Proceed to Step 4 but note high contribution risk.

  4.  **Claimant Contribution Weighting (Value Judgement - Hands to Committee):**
      *   *Question (If Unavoidable from Step 3, or Not Foreseeable from Step 2):* To what extent did the claimant's *own informed choices* contribute to the *severity* of the loss, even if the flood event itself was unavoidable?
      *   *Evidence Required:* As Step 3 (especially insurance, mitigation actions/inaction), also nature of property (e.g., basement conversions in flood zone), timeliness of response to warnings.
      *   *Committee Considerations:* This is about *responsibility for exposure/impact*, not causing the flood. Choices made *with knowledge* of the risk (even if unavoidable) carry more weight. Ignorance *despite* clear warnings = choice? Mitigation efforts matter. *Focus: Did their choices make the loss worse than necessary?*
      *   *Decision Rule:* Not a Yes/No, but a weighting factor (Low/Medium/High Contribution) for Step 5. **Proceed to Step 5.**

  5.  **Eligibility Pool & Comparative Award (Value Judgement - Hands to Committee):**
      *   *Question:* Considering *all applicants this funding round* who reached this step (i.e., have an unavoidable loss), how does this claimant's *severity of hardship* and *degree of claimant contribution* compare?
      *   *Evidence Required:* Total uncovered loss, impact on livelihood/home safety/health, savings depleted, vulnerability (age, health, dependents), Contribution weighting from Step 4.
      *   *Committee Considerations:* Prioritise applicants with:
          *   Highest severity of immediate hardship (homelessness, business collapse, critical health/safety issues).
          *   Lowest degree of claimant contribution (genuinely unforeseeable, genuinely unavoidable).
          *   Highest vulnerability.
      *   *Decision Rule:* Allocate the available budget within the eligible pool based on this comparative assessment. Some reaching Step 5 may receive reduced awards or nothing due to budget limits and lower relative priority. **FINAL DECISION: AWARD (Full/Partial) or NO AWARD.**

  **Untying Your Knots:**
  1.  **Foreseeability vs. Avoidability:** Prised apart. Foreseeability (Step 2) is a factual gateway. **Avoidability (Step 3) is the core ethical filter.** A foreseeable loss is only compensable if unavoidable at reasonable cost *for that claimant*.
  2.  **Exposure vs. Realisation:** Rule built firmly around **realisation** (the actual flood loss). Exposure evidence (insurance history, buy-out refusals) is used *only* to assess avoidability (Step 3) and contribution (Step 4). Your fund cannot compensate pre-existing diminished value.
  3.  **Comparative Element:** Unavoidable given the budget. Steps 1-4 create an eligible pool based on inherent eligibility (unavoidable loss). Step 5 explicitly handles comparison *within that eligible pool* based on hardship/contribution, which is defensible. It avoids comparing the "deservingness" of someone with an avoidable loss to someone with an unavoidable one.
  4.  **Harshness Worry:** Kept **outside the core rule** due to signposting and limited mandate. Steps 3 & 4 ensure choices are assessed for reasonableness *in context*. The "disproportionate cost/hardship" test in Step 3 and vulnerability weighting in Step 5 prevent extreme harshness *within the rule* for borderline unavoidable cases. A firm "No" for clearly avoidable losses is justifiable.

  **Worked Applications:**

  1.  **Couple (Cheapest House, Known High Risk, Lapsed Insurance):**
      *   Step 1: Loss likely uncovered. Proceed.
      *   Step 2: **Foreseeable** (Purchased in Zone 3, told at purchase).
      *   Step 3: **Avoidable?** Insurance lapsed due to cost (affordability argument). Key: Was insurance *genuinely unaffordable* relative to income/basic needs? Premium >1 month's take-home is significant. However, they *chose* to stay in a known high-risk property *without* insurance for 3 years. Reasonable steps? Seeking cheaper insurance, basic mitigation, saving for premiums, *considering relocation if risk was intolerable*. **Likely AVOIDABLE** - they accepted the uninsured risk by staying. **NO AWARD.** State reason: "Loss deemed avoidable; affordable insurance was available historically and claimant chose to remain in a known high-risk property without cover for a significant period prior to the flood."
      *   (Stops at Step 3)

  2.  **Widower (Historic Family Home, Multiple Floods, Refused Buy-Outs):**
      *   Step 1: Assume uncovered. Proceed.
      *   Step 2: **Foreseeable** (Flooded 4 times!).
      *   Step 3: **Avoidable?** Profound emotional/ancestral ties. Relocation likely severe detriment (age, connection). Buy-out refused *because* he wouldn't leave – the detriment *is* the issue. Mitigation? (Unstated, assume limited). Insurance? (Likely unavailable/unaffordable). **Key:** Are ties so profound that relocation is *unreasonably* detrimental? For a 70+ year old in lifelong home, **arguably UNAVOIDABLE** at reasonable cost/hardship *to him*. Proceed.
      *   Step 4: **Contribution: HIGH.** Made conscious choice to stay *despite* overwhelming evidence of risk and offered exit (buy-out). Significantly contributed to *repeated* losses.
      *   Step 5: Compare hardship (severe - home damaged again) vs. contribution (HIGH). Vulnerability (age) high. Likely **PARTIAL AWARD** (prioritising essential repairs/hardship relief) but potentially reduced due to high contribution and history. Could be borderline NO AWARD depending on budget/pool. State reason if reduced/refused: "While the immediate hardship is acknowledged, the repeated nature of the flooding and the claimant's conscious choice to remain despite viable exit options offered (buy-outs) represent a very high degree of contribution to the loss, limiting the award available within the constrained budget and relative to other applicants."

  3.  **Bakery (Changed Flood Maps, Sunk Investment):**
      *   Step 1: Assume uncovered. Proceed.
      *   Step 2: **NOT Foreseeable** at critical point (lease signed when outside mapped flood zone).
      *   Step 3: SKIP (as not foreseeable at commitment point). Proceed to Step 4.
      *   Step 4: **Contribution: LOW/MEDIUM.** Once risk became known (map change), what did they do? Sunk costs create lock-in. Explored insurance? Mitigation? Relocation feasibility for SME is often very high cost/risk (losing business). If they took reasonable steps post-map-change (e.g., sought insurance, basic resilience), **LOW** contribution. If ignored known risk post-map-change, **MEDIUM**. Assume reasonable steps, **LOW**.
      *   Step 5: Hardship high (business viability threat). Contribution Low. Vulnerability (livelihood). Strong candidate for **FULL/PARTIAL AWARD** (prioritising business-critical repair/replacement). State reason: "Award granted as the flood risk was not reasonably foreseeable at the time the business committed to the location, and the subsequent loss, given the sunk costs and business nature, was unavoidable at reasonable cost. Contribution to the loss was low."

  **What the Procedure Cannot Settle & Refusal Reasons:**

  *   **Repeat Claims:** The procedure handles *this event*. For repeat claims *from the same property*:
      *   Step 2: Foreseeability is **overwhelmingly YES** after the first flood.
      *   Step 3: Avoidability becomes the critical hurdle. Staying after a flood is strong evidence the risk is accepted. **NO AWARD** becomes highly likely unless *new*, compelling evidence of unavoidable hardship (e.g., severe disability preventing move discovered post-first-flood, buy-out scheme collapsed). Document refusal clearly: "After the previous flood(s) at this property, the extreme risk was unequivocally known. Remaining in the property without taking comprehensive and effective mitigation steps or pursuing relocation options constitutes acceptance of that risk, making this loss avoidable."
  *   **Refusal Reasons (Entitlement):** Applicants are entitled to know the *specific reason* based on the rule:
      *   "Your loss was covered by insurance / statutory scheme [Specify if possible]." (Step 1)
      *   "The flood risk to your property was known to be high at the time you purchased/leased it, based on Environment Agency flood maps and [other evidence]." (Step 2)
      *   "The loss was deemed avoidable because you could have obtained affordable insurance / relocated / installed effective flood protection at reasonable cost before the flood occurred, based on [evidence - e.g., insurance quotes available at the time, buy-out offers, lack of mitigation measures]." (Step 3)
      *   "While the flood itself may not have been reasonably avoidable in your circumstances, your claim was not prioritised within the available budget this round. Other applicants were assessed as facing more severe hardship and/or demonstrated a lower degree of responsibility for their own loss." (Step 5 - for eligible but unfunded claims). *Always include signposting information.*

  This procedure provides a clear, sequential, and defensible framework. It makes difficult value judgements (Steps 3, 4, 5) explicit and confines them to where they are necessary, while maximising factual gatekeeping (Steps 1, 2). It directly addresses the tensions in your governing instrument through operationalisable steps.
