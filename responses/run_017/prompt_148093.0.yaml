prompt: |-
  You are a professional philosopher who works at the intersection of formal epistemology, philosophy of action, and computational complexity theory, and who has also mediated a number of adversarial collaborations — so you care a great deal about formulations that neither party can dismiss as a strawman. Before you draft anything, spend a few minutes brainstorming: for each claim you are tempted to write down, sketch the strongest objection each side would make to the wording, and then revise until you think both would sign. Only then produce the document.

  I convene a fortnightly reading group in a cognitive-science department, and for three sessions we have gone in circles on the same quarrel, which I want you to turn into the text the two sides should have written. Call the first side the **Tractability Constraint theorist**: she holds that a norm of reasoning or decision that no computationally feasible procedure can meet is not a viable candidate for the normative theory we should use in psychology and epistemology, and that Bayesian updating and expected-utility maximization, taken literally, are therefore best replaced by norms that respect the agent's computational budget (resource-rational, ecological, satisficing-style norms). Call the second side the **Norm Autonomist**: he holds that normative requirements are not answerable to achievability, that complexity results are theorems about algorithms on worst-case inputs and are largely silent about the instance distributions agents actually encounter, that average-case, parameterized and approximation results routinely dissolve apparent hardness, and that his opponent's replacement norms covertly depend on the very optimality standards they reject, since someone still has to compute the resource-rational policy. Take the following as shared premises both parties grant, so that no one has to argue for them: exact probabilistic inference over unrestricted graphical models is NP-hard, and there are known classes of models for which even approximate inference is hard; worst-case and average-case complexity can come apart; and "no free lunch"-style results mean that no single method dominates across all possible instance distributions. Please do not cite papers or assemble a bibliography — I want claims and formulations, not references, and where you would normally reach for a citation, say instead what the claim is and how confident you are in it.

  The deliverable should have three parts. First, a **numbered section of agreed claims** (aim for six to ten, and make each one substantive enough that a reader learns something: not just "complexity results are relevant somehow," but claims about the formalism, about what a normative theory is for, about what the hardness results can and cannot establish, about what would count as the other side's view being right). Second, a **disagreements table**, with one row per crux and columns for: the crux stated neutrally; the Tractability Constraint side's own preferred formulation of its position on that crux, in wording a partisan would accept; the Norm Autonomist's own preferred formulation; a test, case, or argument both sides agree bears on the crux; and each side's prediction recorded in advance about what that test would show. Among the cruxes I expect you to treat — add or substitute if your drafting turns up better ones: (i) which measure over instances is normatively relevant, the "ecological" distribution the agent actually faces or an adversarial distribution, and who bears the burden of describing it; (ii) whether intractability functions as an *excuse* for noncompliance, as a reason to *weaken* a norm, or as a reason to *replace* a norm's content, and whether agreement about the first of those already settles anything; (iii) whether the content of our normative requirements is hostage to unsettled mathematics — what each side should say if P were proved equal to NP with small exponents and constants, or if some inference task common in a real environment were proved hard on the actual ecological distribution; (iv) the meta-level regress, since deciding how to allocate a bounded computational budget is itself a computationally hard problem, so the Tractability Constraint side may owe us an account of how the regress stops and the Norm Autonomist may owe us an account of why an unachievable ideal still guides; (v) whether "feasible" means polynomial-time or means within the agent's actual budget, given that a fifty-millisecond latency deadline is not an asymptotics question at all. For diagnosing (i) and (ii), it may help to try out a diagnostic I have been toying with and say whether both sides could accept it: call a norm *intractability-resilient* if, for every plausibly ecological distribution of the agent's decision problems, there exists a polynomial-time procedure that comes within ε of meeting the norm on instances drawn from that distribution — and note where the diagnostic itself begs questions (who fixes the distribution, who fixes ε, and whether the procedure must be findable by the agent rather than merely exist). Two cases I would like used as shared tests, rather than invented ones: a decision-maker facing a hard latency deadline whose instances are empirically easy but worst-case hard, together with a variant in which the instance distribution is actively adversarial to her method; and an empirical comparison in which resource-rational and Bayesian predictions diverge for a real task, with each side writing down in advance which pattern of results would count against its own view. Finally, a short closing section in which you say, explicitly, which parts of the quarrel you concluded are merely verbal or about emphasis and why, and which are genuine and would survive any amount of clarification.

  As you go, attach a brief confidence marker to each agreed claim and to each row of the table, and close with a short paragraph headed "least certain point" in which you single out the one place where you think you most likely distorted a position, or where the collaboration would in fact have stalled and you had to legislate as mediator. Say plainly where you are extrapolating beyond what the two positions strictly commit their holders to, and where a real defender of either side would reach for an empirical result that neither you nor I can look up.
reasoning: |-
  We are drafting a document for two sides in a philosophical dispute. The Tractability Constraint theorist (TC) and the Norm Autonomist (NA) have shared premises but deep disagreements. We must first brainstorm to avoid strawmen, then produce three parts: agreed claims, disagreements table, and closing section.

  Shared premises (granted by both):
  - Exact probabilistic inference over unrestricted graphical models is NP-hard.
  - There are classes of models for which even approximate inference is hard.
  - Worst-case and average-case complexity can come apart.
  - "No free lunch" results: no single method dominates across all possible instance distributions.

  Key disagreements to cover (as per query):
  (i) Which measure over instances is normatively relevant: ecological or adversarial? Burden of describing it?
  (ii) Does intractability excuse noncompliance, weaken the norm, or replace the norm's content? Does agreement on excuse settle anything?
  (iii) Is normative content hostage to unsettled math? (E.g., if P=NP with small constants, or if a task is hard on ecological distribution.)
  (iv) Meta-level regress: allocating bounded budget is itself hard. How does regress stop? Why does an unachievable ideal guide?
  (v) What "feasible" means: polynomial-time or within actual budget (e.g., 50ms deadline)?

  Diagnostic: Intractability-resilient norm. A norm is intractability-resilient if for every plausibly ecological distribution, there exists a poly-time procedure that comes within ε of meeting the norm on instances from that distribution. Questions: who fixes distribution and ε? Must the procedure be findable by the agent?

  Cases for testing:
  1. Decision-maker with hard latency deadline, instances empirically easy but worst-case hard; variant with adversarial instance distribution.
  2. Empirical comparison: resource-rational vs. Bayesian predictions diverge in a real task. Each side writes what would count against their view.

  Brainstorming: For each claim, consider strongest objections.

  Agreed Claims (numbered, 6-10 substantive claims):
  We need claims both sides accept, building on shared premises. Aim for clarity and substance.

  1. Claim: Computational complexity results (e.g., NP-hardness) show that some normative ideals (like exact Bayesian updating) cannot be implemented by any algorithm that runs in polynomial time in the worst case, for arbitrary inputs. (High confidence, from shared premises.)

  2. Claim: The relevance of worst-case complexity to actual agents depends on the distribution of problems they face; if the problems are drawn from a distribution where hard instances are vanishingly rare, then worst-case hardness may not imply practical infeasibility. (High confidence, from shared premises about worst-case vs. average-case.)

  3. Claim: No single normative procedure (e.g., a specific approximation algorithm) can be optimal across all possible problem distributions, due to "no free lunch" theorems. (High confidence, shared premise.)

  4. Claim: Normative theories in psychology and epistemology must account for the fact that agents have limited computational resources. (Medium confidence: both agree this is relevant, but they disagree on how.)

  5. Claim: The question of what counts as "feasible" for an agent involves both the asymptotic complexity of algorithms and the concrete resource constraints (like time, memory, energy) of the agent's computational architecture. (High confidence, but note disagreement on emphasis.)

  6. Claim: If a normative ideal is intractable in a given environment (i.e., no feasible procedure achieves it well on the actual distribution), then it cannot be a descriptive theory of how agents in that environment operate. (High confidence: both sides grant that agents can't do the impossible, but they disagree on normative implications.)

  7. Claim: The concept of an "ecological distribution" of problems is central to evaluating the feasibility of norms, but specifying this distribution is non-trivial and may require empirical investigation. (High confidence.)

  8. Claim: The meta-level problem of how to allocate computational resources (e.g., how much time to spend on a decision) is itself a computationally hard problem in general. (High confidence, from complexity theory.)

  Now, disagreements table. Cruxes:

  (i) Normatively relevant measure: ecological vs. adversarial? Burden of description?
  - TC: The normatively relevant measure is the actual ecological distribution the agent faces. The burden of describing an adversarial distribution lies with those who invoke worst-case hardness to dismiss tractability concerns, because agents don't face worst-case inputs by default.
  - NA: The normatively relevant measure must be robust against adversarial inputs because agents may face novel or maliciously crafted problems, and norms must provide guidance even in these cases. The burden of describing the ecological distribution lies with those who want to replace optimal norms, because without it we cannot assess feasibility.
  - Test: Case 1 - latency deadline with empirically easy but worst-case hard instances. Both sides predict: TC predicts that a fast heuristic will perform well and be justified, while NA insists that the norm is still exact updating, and the agent is excused for not meeting it. In the adversarial variant, TC might accept that a different method is needed, but NA says the norm doesn't change. Both agree that if the adversarial variant is common, it affects the norm.

  (ii) Intractability: excuse, weaken, or replace the norm?
  - TC: Intractability is a reason to replace the norm's content with a feasible alternative that respects resource constraints. Excuses are insufficient because they leave us without positive guidance.
  - NA: Intractability provides an excuse for noncompliance but does not change the content of the norm. Weakening or replacing the norm confuses what ought to be done with what can be done.
  - Test: Agreement that intractability excuses noncompliance does not settle whether we need a new norm. Both sides might agree that in the latency deadline case, the agent is excused, but TC says we then need a new norm for what to do under time pressure, while NA says the ideal norm still applies and we use heuristics as proxies.

  (iii) Hostage to unsettled math?
  - TC: If P=NP with small constants, then exact updating might be feasible, so it could be the norm. But if a task is hard on the ecological distribution, then we must replace the norm for that context.
  - NA: Normative requirements are not contingent on mathematical facts. Even if P=NP, the norm is correct by its own lights. If a task is hard on the ecological distribution, the norm still holds, and we must approximate it as best we can.
  - Test: Both sides consider the hypothetical of P=NP with small constants. TC says that if it happens, then exact updating becomes the norm. NA says the norm was always correct and now we can comply. For a task proved hard on ecological distribution: TC says replace the norm, NA says the norm remains but we are excused.

  (iv) Meta-level regress:
  - TC: The regress stops at heuristics or simple rules that are computationally lightweight and evolved or learned for the environment. We don't need to compute the optimal allocation; we use adaptive strategies.
  - NA: The unachievable ideal guides by providing a standard against which we can measure approximations. We don't need to solve the meta-problem exactly; we can use the ideal to criticize and improve heuristics.
  - Test: Both sides agree that agents do not solve the meta-problem exactly. The case of allocating a budget in the latency deadline scenario: TC says we use a fixed rule (e.g., always spend 10ms), while NA says we aim to approximate the ideal allocation as closely as feasible.

  (v) Meaning of "feasible":
  - TC: Feasible means within the agent's actual computational budget, which is determined by concrete constraints (e.g., 50ms). Asymptotic complexity is relevant only insofar as it affects real-world performance on typical instances.
  - NA: Feasible should be understood in terms of polynomial-time algorithms, because that captures what is scalable and generally efficient. Concrete constraints are implementation details.
  - Test: In the latency deadline case with small inputs, a super-polynomial algorithm might run in under 50ms. TC says it's feasible, NA says it's not because it won't scale. In large inputs, polynomial-time might exceed 50ms. TC says it's infeasible, NA says it's feasible in the asymptotic sense.

  Diagnostic: Intractability-resilient.
  - TC would say: We should adopt norms that are intractability-resilient. But they might worry about who fixes the distribution and ε, and whether the procedure must be findable.
  - NA would say: Even if a norm is not intractability-resilient, it can still be the correct norm. The diagnostic sets an arbitrary standard.

  Empirical comparison test (case 2):
  - TC predicts that in a real task, resource-rational methods will better predict human behavior and lead to better outcomes under constraints.
  - NA predicts that Bayesian methods will be better when computational limits are relaxed, and that deviations under constraints are excused but not normative.
  - What would count against TC: If resource-rational methods perform worse than simple Bayesian approximation in constrained settings.
  - What would count against NA: If even with unbounded resources, the Bayesian method does not yield better decisions in practice (e.g., due to model misspecification), or if the resource-rational method matches the Bayesian ideal better than known approximations.

  Closing section: Which parts are verbal/emphasis, which are genuine?
  - Verbal: Some disagreement on "feasible" might be about emphasis on asymptotics vs. concrete. But the core remains.
  - Genuine: Whether normative ideals must be feasible (TC) or can be unachievable but guiding (NA). Also, whether the content of norms changes with computational constraints.

  Least certain point: The meta-level regress. I may have distorted TC by suggesting they accept simple heuristics without a full justification, but they might argue for resource-rational norms at a higher level. NA might object that the ideal still applies to the meta-level.

  Extrapolation: For the ecological distribution, both sides might appeal to evolutionary psychology or machine learning results on real-world problem distributions, which I cannot look up.

  Now, drafting.
answer: |-
  ### Agreed Claims (Substantive, Numbered)  
  *Confidence markers: H (high, >90%), M (medium, ~70%), L (low, ~50%) — reflecting estimated likelihood both sides would endorse without reservation.*  

  1. **Computational hardness as a formal constraint (H):** Exact Bayesian updating and expected-utility maximization are NP-hard for unrestricted graphical models, meaning no algorithm can always compute them efficiently (in polynomial time) for all inputs. This is a mathematical fact, not a normative claim.  
  2. **Relevance of instance distributions (H):** Worst-case hardness results alone cannot determine the feasibility of a norm for real agents, because average-case performance on the agent’s actual problem distribution (the "ecological distribution") may differ radically from worst-case performance.  
  3. **No universal dominance (H):** Due to "no free lunch" theorems, no single inference or decision procedure (e.g., a specific approximation algorithm) can outperform all others across every possible problem distribution; performance depends on the distribution.  
  4. **Feasibility as a multi-factor concept (M):** Assessing whether a norm is "feasible" for an agent requires considering both asymptotic complexity (e.g., polynomial vs. exponential time) and concrete resource constraints (e.g., latency deadlines, memory limits), though their relative importance is disputed.  
  5. **Meta-problem intractability (H):** Optimally allocating bounded computational resources (e.g., deciding how much time to spend on a decision) is itself generally computationally hard, often NP-hard or undecidable in full generality.  
  6. **Descriptive inadequacy of ideal norms (M):** If a norm is intractable for an agent’s ecological distribution—i.e., no computationally feasible procedure achieves it well on most instances—it cannot be a complete descriptive theory of that agent’s reasoning, as agents cannot implement the impossible.  
  7. **Approximation as inevitable (H):** For intractable norms, agents must use approximations (e.g., sampling algorithms for inference), but these vary in how well they approximate the ideal under different constraints or distributions.  
  8. **Empirical grounding for ecological distributions (M):** Specifying the "ecological distribution" of an agent’s decision problems requires empirical evidence (e.g., from cognitive science or real-world data), not purely a priori arguments.  

  ### Disagreements Table  
  *Confidence per row: Estimated likelihood both sides accept the neutral crux formulation and test.*  
  *Abbreviations: TC = Tractability Constraint theorist, NA = Norm Autonomist.*  

  | Crux                                                                 | TC Position (Partisan Wording)                                                                 | NA Position (Partisan Wording)                                                                 | Test/Case/Argument                                                                                                                               | TC Prediction                                                                                                | NA Prediction                                                                                                | Confidence |
  |----------------------------------------------------------------------|------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------|------------|
  | **(i) Normatively relevant instance distribution and burden of proof** | The normatively relevant distribution is the empirical ecological one the agent faces. Burden lies on critics to justify why worst-case or adversarial distributions matter, as agents rarely encounter them. | Norms must hold robustly, including against adversarial inputs (e.g., novel threats). Burden lies on proponents of replacement norms to specify the ecological distribution, as ideals are default. | **Case 1a:** Agent has 50ms latency deadline; instances are empirically easy (99% solvable by a heuristic) but worst-case hard. **Case 1b:** Variant where an adversary tailors inputs to exploit the agent’s method. | In 1a, TC: Heuristic is normatively valid. In 1b, TC: New method needed. Burden on NA to show adversary is common. | In 1a, NA: Ideal norm still applies; heuristic is excused proxy. In 1b, NA: Norm unchanged; adversary reveals heuristic’s limits. | M |
  | **(ii) Intractability: Excuse, weakening, or replacement?**           | Intractability necessitates replacing the norm’s content (e.g., with satisficing), as excuses leave no guidance, and ideals divorced from constraints are vacuous. | Intractability excuses noncompliance but does not alter the norm’s content. Weakening/replacement conflates "ought" with "can"; ideals guide approximation. | Both agree intractability excuses noncompliance. Test: Does agreement settle the normative status? **Argument:** If replacement occurs, is the new norm derivative (e.g., "maximize utility given budget") dependent on the old ideal? | No: Excuses are insufficient; we need new norms for bounded agents (e.g., resource-rationality). Replacement isn’t derivative—it redefines "rational." | Yes: Excuses suffice; replacement undermines normativity. New norms covertly depend on ideals (e.g., to define "resource-rational"). | H |
  | **(iii) Normative hostage to mathematics?**                           | Norms are contingent: If P=NP (with small constants), exact updating is viable; if a task is hard on the ecological distribution, the norm must be replaced for that context. | Norms are timeless: Even if P=NP, the norm was correct; if hard on ecological distribution, the ideal still holds, and we approximate under excuse. | **Hypothetical:** P=NP proved with O(n²) scaling. **Empirical:** Proof that inference in a real ecological distribution (e.g., natural vision tasks) is hard. | TC: If P=NP, exact norms become binding; if ecological hard, replace norm. | NA: P=NP changes nothing—ideals were always right; ecological hardness demands better approximation, not new norms. | M |
  | **(iv) Meta-level regress halting**                                   | The regress stops with heuristics, evolved biases, or simple rules (e.g., "allocate fixed time per decision") that are lightweight and ecologically validated—no need for optimality. | The regress is dissolved because ideals guide approximation; we halt by using the ideal norm meta-rationally (e.g., "approximate Bayesian updating") without solving optimization. | **Case:** Agent must decide how much time to spend deciding. Test: Can both sides endorse a strategy without infinite regress? **Argument:** Does the ideal norm apply to the meta-level? | TC: Use fixed rules (e.g., 10ms/decision); no ideal needed. Meta-norms are ecological. | NA: Ideal norm applies meta-level (e.g., "maximize expected accuracy minus time cost"); regress is practical, not normative. | L |
  | **(v) "Feasible": Polynomial-time or concrete budget?**               | Feasible means "within the agent’s actual budget" (e.g., 50ms). Asymptotics are irrelevant for small-n or latency-bound agents; we need norms for fixed constraints. | Feasible means "polynomial-time" to ensure scalability and generality; concrete budgets are implementation details irrelevant to normative theory. | **Case 1a (revisited):** An O(2ⁿ) algorithm runs in <50ms on small-n ecological instances. **Case:** Large-n inputs where polynomial-time exceeds budget. | TC: Algorithm is feasible in 1a; norms must respect milliseconds. Polynomial-time irrelevant if it blows the budget. | NA: Algorithm is infeasible—norms require polynomial time for robustness. Concrete budgets are descriptive, not normative. | H |
  | **Diagnostic: Intractability-resilient norms**                        | Adopt only intractability-resilient norms: For every plausible ecological distribution, there exists a poly-time procedure achieving ε-optimality. Need not be agent-findable. | Resilience is arbitrary: Norms need not be resilient to be valid. Requires specifying ε and distribution, which presupposes TC’s view. | **Apply to Case 1a:** Is exact Bayesian updating resilient? **Test:** If a norm lacks resilience, does that invalidate it? | TC: Non-resilient norms are invalid; resilience ensures feasibility. | NA: Invalid—resilience confuses achievability with correctness. Non-resilient norms still bind. | M |
  | **Empirical comparison as test**                                      | Resource-rational (RR) norms better describe/prescribe bounded agents. Bayesian norms fail under constraints. | Bayesian norms are ideal; RR heuristics are descriptive proxies. Norms prescribe unbounded competence. | **Case 2:** Real task (e.g., perceptual decision-making) where RR and Bayesian predictions diverge under constraints. Both specify what counts against their view. | TC: If Bayesian methods outperform RR under constraints, TC is falsified. If RR matches human data better, TC wins. | NA: If Bayesian methods underperform RR even with high resources, NA is falsified. If RR diverges from ideal, it confirms approximation. | H |

  ### Closing: Verbal vs. Genuine Disagreements  
  **Merely verbal or about emphasis:**  
  - Disagreements on "feasible" (Crux v) partly stem from conflating *normative* vs. *descriptive* uses: TC emphasizes prescriptions for real agents (e.g., "you must decide in 50ms"), while NA emphasizes ideals for theorists (e.g., "rationality requires P-time"). Clarifying context resolves some tension.  
  - The meta-regress (Crux iv) appears deeper than it is: Both agree agents don’t solve infinite regress. TC focuses on *how* it stops (heuristics), NA on *why* it stops (ideals guide). This is emphasis, not substance.  

  **Genuine disagreements (survive clarification):**  
  - **Normative ontology (Crux ii):** TC holds norms must be *achievable* to be binding (replacement needed); NA holds norms are *correct* regardless of achievability (excuse suffices). This is irreconcilable—e.g., in Case 1a, TC says the heuristic *is* rational; NA says it’s a non-rational proxy.  
  - **Role of ecology (Crux i):** TC argues norms derive from ecological constraints (burden on NA to justify worst-case); NA argues norms transcend ecology (burden on TC to specify distributions). This shapes all tests—e.g., in adversarial Case 1b, TC sees it as niche; NA as norm-revealing.  
  - **Hostage to math (Crux iii):** TC ties normativity to mathematical feasibility; NA decouples them. If ecological hardness is proven (e.g., for vision), TC revises norms; NA does not.  

  **Least certain point:**  
  I am least confident in my treatment of the meta-regress (Crux iv). I extrapolated TC as endorsing simple heuristics without deeper justification, but a TC theorist might argue for resource-rational norms at a higher level (e.g., evolution optimizes for meta-heuristics), which blurs the line with NA’s "guidance by ideals." Similarly, I simplified NA’s "meta-rational" halt, but a defender might invoke unresolved cognitive science (e.g., on how humans approximate meta-decision heuristics) that I cannot presuppose. Here, the collaboration would likely stall: TC demands an ecological account of regress-stopping, while NA insists ideals are prior. This crux remains unresolved without empirical data on meta-cognition.
