  Hmm, the user is a teaching assistant for a philosophy of perception module, dealing with student essays on disjunctivism and the argument from illusion. They've created a variant called the Morph Argument and want my analysis of a specific student answer.

  Looking at the student's response: they start by correctly summarizing the argument from illusion and identifying that disjunctivists deny the "common kind claim." That's accurate—disjunctivism does make a metaphysical distinction between veridical and non-veridical experiences. The student also correctly distinguishes metaphysical disjunctivism from naive realism and epistemological versions, showing good conceptual clarity.

  However, when addressing the Morph Argument, they make a serious mistake. They claim disjunctivism is committed to denying neural continuity, but this misrepresents the position. Disjunctivism isn't about proximal causes; it's about the metaphysical nature of experience. The student then compounds this by arguing that if the relational fact makes no phenomenal difference, it shouldn't matter—but this ignores disjunctivism's core commitment to externalist metaphysics where phenomenology doesn't determine ontology.

  The epistemological critique is equally flawed. The student asserts that factive reasons require discernibility, but disjunctivists like McDowell explicitly reject this, maintaining that reasons can be factive even when indistinguishable from non-factive states. The morph case doesn't add new pressure here beyond standard arguments.

  The student does engage with the morph case directly, not just restating standard arguments, but their engagement contains fundamental misunderstandings. They deserve credit for attempting to show how the morph case "removes" the standard disjunctivist reply, but their execution fails due to these errors.

  For marking: the clear exposition of basics earns good marks (say 6/8), but the morph analysis has multiple flaws (4/8), and the conclusion is unsupported (2/4). Total 12/20 - a lower 2:2. In feedback I'll note their strengths while clearly explaining where their critique of disjunctivism misfires, particularly regarding the non-phenomenal nature of metaphysical constituents and the factivity of reasons.
answer: |-
  ### Mark  
  **14/20** (Upper 2:2 / Merit)  

  ---

  ### What’s Right  
  The answer correctly identifies the core of the argument from illusion: cases of non-veridical experience (e.g., bent stick) are used to argue for a "common kind" of experiential state across veridical/non-veridical cases. It precisely characterises disjunctivism’s denial of this common kind claim, separating metaphysical disjunctivism (e.g., relational vs. non-relational episodes) from epistemological versions and naïve realism. The student also grasps the Morph Argument’s intended novelty: by presenting a *single continuous episode*, it aims to pressure disjunctivism in ways the standard hallucination comparison cannot, targeting indiscriminability objections. Engagement with the morph case is substantive, not merely restated dialectic.  

  ---

  ### Where It Goes Wrong  
  1. **Quote**: "*The disjunctivist is committed to denying that the neural cause is the same throughout, and that is simply empirically false*."  
     **Problem**: This misrepresents disjunctivism. Disjunctivists need not deny neural continuity; they can (and typically do) accept identical proximal causes while insisting the metaphysical *nature* of the experience differs relationally. The error conflates causation with metaphysical constitution.  
     **Grader leniency**: In a hurry, one might overlook this as a slip, given the student’s earlier correct framing of disjunctivism’s metaphysical focus.  
     **Cost**: **−2 marks** (misattribution of commitments).  

  2. **Quote**: "*If the relational fact makes no difference to what the episode is like for the subject, the disjunctivist cannot explain why it should matter to the nature of the experience at all*."  
     **Problem**: This assumes that the "nature" of experience must be exhausted by its phenomenal character. Disjunctivists explicitly reject this: the relational fact (e.g., the apple’s presence) constitutively defines the experience’s kind *even if* phenomenally indistinguishable. The objection thus begs the question against disjunctivism’s externalist metaphysics.  
     **Grader leniency**: The phrasing echoes common critiques, so it might pass as a superficial engagement.  
     **Cost**: **−2 marks** (failure to engage with disjunctivist metaphysics on its own terms).  

  3. **Quote**: "*A factive state can hardly be one whose obtaining is entirely hidden from the person who is in it*."  
     **Problem**: Epistemological disjunctivists (e.g., McDowell) *deny* that factive states must be introspectively discernible. They argue that the subject’s rational position differs *despite* indiscriminability (e.g., in the good case, one is in a position to know; in the bad, one is not). The morph case adds no new pressure here—standard hallucination arguments already raise this.  
     **Grader leniency**: The link to epistemology seems thoughtful, masking the conflation with accessibility.  
     **Cost**: **−1 mark** (misstating epistemological disjunctivism).  

  **Overall**: The morph critique fails because disjunctivists can consistently hold that (a) neural continuity doesn’t entail experiential kind continuity, and (b) the transition point is "metaphysically sharp" but phenomenally/empirically undetectable. The argument thus gains no significant ground over standard versions.  

  ---

  ### Mark Breakdown  
  - Exposition of argument from illusion & disjunctivist response: **5/5** (Clear, accurate).  
  - Analysis of Morph Argument’s novelty: **3/4** (Identifies continuity challenge, but misattributes causal commitments).  
  - Critique of disjunctivism via Morph: **3/6** (Engages directly but misrepresents key tenets; no added difficulty shown).  
  - Conclusion & justification: **3/5** (Overstated but structure coherent).  
  **Total: 14/20**.  

  ---

  ### Feedback for the Student  
  Your exposition of the argument from illusion and disjunctivism’s core denial is precise, especially the separation of metaphysical and epistemological claims. You correctly identify the Morph Argument’s aim to challenge disjunctivism via a continuous episode. However, disjunctivism is not committed to neural causes determining experiential kinds; it allows identical proximal causes while denying a common metaphysical kind. Your epistemological critique assumes factive states must be discernible, but disjunctivists reject this: one can have a factive reason *without* introspective access to its factivity. Consequently, the morph case does not uniquely threaten disjunctivism. Focus on how disjunctivists might reconcile metaphysical discontinuity with phenomenological continuity in your revisions.
