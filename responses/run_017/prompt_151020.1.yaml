prompt: |-
  somthing I keep turning over and can't quite get straight.

  Medicine files people into disease categories and then does a pile of very consequential things on the back of that filing: insurance pays or doesn't, you get into a trial or you don't, a guideline fires, you get a prognosis, sometimes you get cut open. But the categories themselves are all over the place. Some name a mechanism. Some are just a cluster of complaints with no known mechanism at all. Some are literally a number above a cutoff that a committee picked and has since redrawn. The same label routinely covers people whose insides are doing quite different things. And categories get split or junked once a mechanism turns up, which sort of suggests the old label was never the real thing — except everyone acted on it for decades and it worked fine for plenty of purposes. Also (my understanding, tell me if I've got it wrong) some cancer drugs now get licensed for any tumour carrying a particular genetic marker, whatever organ it started in, so there the pattern is the disease and the organ-based category is the incidental bit.

  I've been poking at the physical/design/intentional stance stuff and at the idea that a pattern counts as real if it buys you compression or prediction better than chance, and medicine feels like it runs on something in that neighbourhood but not exactly it. What actually seems to license a category in practice is that it tells you what to do, not that it compresses a data set.

  So: what view of patterns — of what makes a grouping real rather than merely convenient — does this whole practice presuppose? And here's a test case: say someone defines a category purely out of a polygenic score plus a wearable time series, no mechanism whatsoever, covering maybe half a percent of people, and everyone in it responds to the same drug. Most action-guiding thing going, but it barely compresses anything. Does the practice's own implicit theory force us to call that a real disease, or does it quietly reach for mechanism talk when it wants prestige and drop it when it's inconvenient?

  Then the stance mixing: clinicians say the kidney is filtering and the body is trying to hold onto salt, in the same breath as the lab values. Does the practice need those to be true, or just handy — and is there a difference? And what concretely breaks in a hospital or a trial if we decided only the physical-stance descriptions were real? I don't think the answer is "nothing, it was all shorthand," but I can't see what gives.

  Give me your actual answer in the first sentence, then the reasoning. No preamble, don't restate the question back at me, and don't pad it with citations or suggestions about what I should go read.
reasoning: |-
  Okay, the user is grappling with how medicine categorizes diseases and what makes these categories "real." They note the inconsistencies: some categories are based on mechanisms, others on symptoms, some on arbitrary cutoffs. The same label can cover different underlying issues, yet these categories drive critical decisions. They question whether a category's validity comes from its predictive power, compression of data, or its ability to guide action. Their test case involves a new category defined by a polygenic score and wearable data that predicts drug response but doesn't compress information well. They also ask about the mix of intentional and physical stances in clinical practice and what breaks if we only accept physical descriptions.

  First, I need to address the core question: what view of patterns does medical practice presuppose? The user mentions compression and prediction but thinks medicine prioritizes action-guidance. So the implicit theory here is pragmatic realism. Categories are real if they lead to effective interventions, regardless of mechanism or compression. 

  The test case is key. A category based on a polygenic score and wearable data that predicts drug response would be accepted as a real disease because it tells clinicians what to do. Even without compression or mechanism, its utility in treatment validates it. Medicine often adopts such categories when they work, like genetic markers in cancer. 

  Then there's the stance mixing. Clinicians use intentional language (e.g., "the body is trying to hold onto salt") alongside physical descriptions. The user wonders if this is necessary. The answer is that intentional stance is a functional shorthand. It simplifies complex physiology into actionable models. If abandoned, communication and decision-making could suffer. For example, explaining hypertension without intentional stance might require detailed biochemistry, which isn't practical at the bedside. 

  What breaks without it? Efficient communication, patient understanding, heuristic decision-making. Trials might struggle with patient stratification if they rely solely on molecular mechanisms without higher-level categories. Also, without intentional language, translating lab values into treatment plans becomes cumbersome. 

  The user's deeper need might be understanding the epistemology of medicine. How does the field validate categories when traditional scientific criteria (like mechanism) are absent? They might be seeking reassurance that pragmatic approaches are valid despite lacking ontological rigor. Or they might be concerned about inconsistencies in medical taxonomy affecting patient care. Addressing the practical implications and why pragmatism works here is crucial.
answer: |-
  Medicine's practice presupposes **pragmatic realism: a category is "real" if it reliably guides effective intervention, regardless of mechanism, compression, or ontological purity.**

  Here's the reasoning:  
  1.  **Action over ontology:** Categories like "hypertension" (a number above a cutoff) or "fibromyalgia" (a symptom cluster) persist because they trigger *actions* (prescribe drug X, offer therapy Y) that demonstrably improve outcomes for many people. Their "reality" is functional. The historical splitting/junking of categories (like "dropsy" into heart/kidney failure) doesn't invalidate past actions; it refines the pragmatic map based on new tools and outcomes.  
  2.  **The test case is already happening:** Your polygenic/wearable-defined category *would* be accepted as a "real" disease subtype. FDA approvals like pembrolizumab for MSI-H/dMMR tumors *anywhere* prove this. The "disease" is defined by the actionable biomarker predicting drug response. Low prevalence and lack of compression are irrelevant; actionability licenses reality. Medicine *does* drop mechanism when inconvenient (many psychiatric drugs) and grabs it when useful (targeted cancer therapies) – prestige follows utility, not vice versa.  
  3.  **Stance mixing is functional, not descriptive:** Saying "the kidney filters" or "the body tries to hold salt" uses intentional/design stance as *heuristic shorthand* for complex physiology. This:  
      *   **Enables rapid communication:** "Body holding salt" instantly conveys net sodium retention implications to clinicians.  
      *   **Facilitates decision-making:** Framing physiology as goal-directed (even metaphorically) suggests compensatory mechanisms or therapeutic targets (e.g., blocking "efforts" to retain salt with diuretics).  
      *   **Aids patient understanding:** Intentional language is more intuitive than reciting ion channel interactions.  
  4.  **What breaks without stances:**  
      *   **Clinical efficiency collapses:** Replacing "kidney filtering" with a full molecular description of glomerular function for every decision is paralyzing.  
      *   **Heuristics fail:** Pattern recognition ("this looks like decompensated heart failure") relies on aggregated, stance-informed concepts. Removing them forces atomic-level reasoning for every case.  
      *   **Trial design falters:** Stratifying patients requires grouping by *expected response* (a design/intentional stance concept), often before the full physical-stance mechanism is known. Insisting on pure physical-stance definitions would cripple trial feasibility for complex syndromes.  
      *   **Care coordination suffers:** Shared mental models across specialties rely on these functional abstractions.  

  **The core license is interventionist utility, not truth-to-mechanism.** Categories are tools for action; their "reality" is affirmed by their practical consequences, not their ontological pedigree or elegance.
