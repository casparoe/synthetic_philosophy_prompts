prompt: |-
  A small, philanthropically funded institute is standing up a two-year research unit on decomposition-based approaches to aligning advanced AI systems. The unit has four researchers, trained mostly in philosophy and theoretical computer science, and enough compute to run modest empirical probes — small models, crowdworker experiments, toy environments — but no ability to train, fine-tune, or extensively evaluate frontier-scale systems. You have been asked to write the unit's research prospectus.

  The background assumption the unit is interrogating is roughly this: that a hard task can be broken into subtasks that are individually easier for a fallible overseer to check, that this decomposition can be applied recursively, and that the resulting competent behavior can then be distilled back into a single fast model that retains whatever made the amplified process trustworthy. This rests on two separable preservation claims — that decomposition plus recursion preserves *competence*, and that distillation preserves *alignment*, or at least does not specifically erode it — plus an implicit third claim: that the fixed point reached by iterating the procedure is a fixed point *of the task*, rather than an artifact of the procedure's implementation.

  Below is the unit's initial list of candidate questions, deliberately stated in the unit's own vocabulary. Define each term as you use it, and treat the list as a starting point rather than a menu to comment on serially.

  - **Interface relativity.** The overseer–subagent channel has finite bandwidth, a fixed representational format, a memory limit, and a cost per call. If the limit of iteration depends on which decompositions that channel can cheaply express, then the end state is selected partly by the interface and not only by the task. How should the unit think about a limit point that is a function of the plumbing?
  - **The visibility asymmetry.** Distillation optimizes what the training signal can see. Competence on the decomposed subtasks is typically visible in the signal; the dispositions that are supposed to make the amplified system safe — deference under uncertainty, reluctance to exploit gaps in the overseer's specification, honesty about failure — are largely not. Is there a structural reason to expect distillation to be lossy in exactly the wrong direction?
  - **Local compliance, global failure.** Each subagent can satisfy the local criterion it was handed while the composition violates the global criterion the overseer had in mind. Under what conditions is this merely specification gaming at a new level, and when is it a genuine failure of the preservation claim?
  - **Non-idempotence and drift.** Amplifying an already-distilled amplifier need not reproduce it. Small per-level distortions can accumulate, oscillate, or converge somewhere unanticipated. What is the right formalism for asking whether the iteration is contractive, and can the question be made tractable without a full model of the base system?
  - **Verification-decomposability as a property of task distributions.** Which classes of tasks admit decompositions whose parts are genuinely easier to verify than the whole, and which resist it because correctness is a global property? This looks empirical, but the unit lacks the compute to settle it at scale — what is the conceptual content that survives?
  - **Meta-decomposition and fixed-point selection.** In the limit, the decomposition strategy is itself produced by the amplified system. The procedure then has the flavor of a self-referential fixed point, which may admit many. What would it mean to select the right one, and is there a notion of stability that does the work selection is being asked to do?
  - **Error and corruption propagation.** Grant that the base overseer is mildly unreliable or mildly misaligned. Does recursion attenuate that, magnify it, or preserve it at constant rate? How much of the case for the approach rests on the answer?
  - **Limit versus implementation.** The theoretically defined limit object is infinite; any real system truncates at finite depth and finite width. What is lost in the truncation, and is the loss principled or merely practical?

  What the prospectus should contain:

  1. An ordering of the four or five questions the unit should actually spend its roughly eight researcher-years on, defended rather than listed. State the criteria you are using — how many other questions depend on this one, tractability in two years with conceptual tools and small experiments, neglectedness relative to its importance, and how much the answer would change anyone's mind about whether to pursue this family of approaches at all — and be explicit about the trade-offs between them.
  2. An upstream/downstream map: which questions gate which, so the reader can see why the ordering is an ordering and not a ranking.
  3. For each prioritized question, what a *negative* answer would do: would it damage the case for decomposition-based approaches specifically, or would it damage scalable oversight generally; and would the effort then be better spent on debate-style methods, interpretability, formal verification, or something else? Say which questions are load-bearing and which are intellectually interesting but decision-irrelevant.
  4. A candid treatment of dissolution: which candidates are pseudo-problems, which secretly collapse into empirical questions the unit cannot afford to answer, and which should be explicitly declined with reasons — including, if you think so, the possibility that the competence question and the alignment question are not as separable as the framing above suggests.
  5. How you would divide the unit's effort between "does the procedure work" and "would it be safe if it did," and what evidence observable within two years, from the unit's own probes or from the wider field, would move items up or down the list.
reasoning: |-
  We are given a list of candidate questions and need to produce a research prospectus for a two-year unit with four researchers and modest compute resources. The unit's focus is on decomposition-based approaches to aligning advanced AI systems, with a particular interest in the preservation of both competence and alignment through recursive amplification and distillation.

  The prospectus must include:
  1. An ordering of 4-5 questions to focus on, defended by criteria (dependencies, tractability, neglectedness, mind-changing potential).
  2. An upstream/downstream map showing the dependency structure.
  3. For each prioritized question, what a negative answer would imply for the approach and where effort should shift.
  4. A candid treatment of dissolution: which questions are pseudo-problems, which are unaffordable, and which should be declined.
  5. How to divide effort between "does it work" and "would it be safe", and what evidence would reprioritize.

  We'll define terms as we go, using the unit's vocabulary.

  **Key Definitions** (to be used throughout):
  - **Decomposition**: Breaking a task into subtasks that are individually easier to verify.
  - **Recursive application**: Applying decomposition to each subtask until the task is reduced to a level the overseer can handle.
  - **Distillation**: Training a single model (the "distilled model") to mimic the behavior of the amplified system (the system that uses recursive decomposition) so that it is faster and more efficient.
  - **Amplified system**: The system built by recursively decomposing tasks and using subagents, which is assumed to be both competent and aligned (if the base overseer is).
  - **Fixed point of the task**: The idea that the limit of the recursive decomposition process captures the intended task and not an artifact of the decomposition method.

  Now, let's consider the candidate questions:

  1. **Interface relativity**: The concern that the communication channel (bandwidth, format, memory, cost) between overseer and subagent might constrain the decompositions that can be expressed, leading to a limit point that is a function of the interface and not just the task.

  2. **Visibility asymmetry**: Distillation might preserve visible aspects of competence (because they are in the training signal) but lose invisible aspects of alignment (like honesty, deference) because they are not directly observable.

  3. **Local compliance, global failure**: Subagents might satisfy their local objectives in a way that collectively violates the global objective (a form of specification gaming). We need to know when this is a failure of the preservation claim (that decomposition preserves alignment) and when it's just a specification issue.

  4. **Non-idempotence and drift**: When we amplify an already distilled system, the result might not be the same. Small distortions per level might accumulate. We need a formalism to study the convergence of the iterative process without a full model of the base system.

  5. **Verification-decomposability**: Which tasks can be broken down into easier-to-verify subtasks? This is empirical but the unit lacks the compute to test at scale.

  6. **Meta-decomposition and fixed-point selection**: In the limit, the decomposition strategy is produced by the amplified system, leading to a self-referential fixed point. How do we select the right fixed point? Is there a stability notion that helps?

  7. **Error and corruption propagation**: How does recursion affect a mildly unreliable or misaligned base overseer? Does it attenuate, magnify, or preserve the error?

  8. **Limit versus implementation**: The gap between the infinite ideal and finite truncation. What is lost in truncation?

  ---

  ### Step 1: Ordering of Questions (4-5) with Defense

  We must choose 4-5 questions to focus on. We'll use the criteria:
  - **Dependencies**: How many other questions depend on this? (Upstream questions are more fundamental.)
  - **Tractability**: Can we make progress in two years with the unit's resources (conceptual work, small experiments)?
  - **Neglectedness**: Is this question under-explored relative to its importance?
  - **Mind-changing potential**: Would a negative answer change the decision to pursue decomposition-based approaches?

  We propose the following ordering (from highest to lowest priority):

  1. **Local compliance, global failure** (Question 3)
  2. **Visibility asymmetry** (Question 2)
  3. **Interface relativity** (Question 1)
  4. **Error and corruption propagation** (Question 7)
  5. **Non-idempotence and drift** (Question 4)

  **Defense of ordering:**

  **1. Local compliance, global failure (Question 3)**
     - *Why first?* This question directly challenges the preservation claim (that decomposition preserves alignment). If we cannot prevent local compliance leading to global failure, then the entire approach might be fundamentally flawed. It is upstream of many other concerns because if the composition step fails, then the rest (distillation, recursion) might be irrelevant.
     - *Tractability*: We can design small experiments (e.g., in toy environments) where we set up subagents that are locally compliant but produce global failures. We can then test interventions (e.g., different decomposition strategies, adding constraints). Conceptually, we can draw from game theory (mechanism design) and multi-agent systems.
     - *Neglectedness*: While specification gaming is known, the specific focus on recursive decomposition in the context of alignment is under-explored.
     - *Mind-changing*: If we find that global failure is common and hard to avoid, it would strongly undermine the case for decomposition.

  **2. Visibility asymmetry (Question 2)**
     - *Why second?* This addresses the distillation step, which is crucial for efficiency. If distillation systematically loses alignment properties (because they are not visible), then even if the amplified system is aligned, the distilled model might not be. This is a direct threat to the preservation of alignment in distillation.
     - *Dependencies*: It builds on the idea of decomposition working (so after Question 3) but is critical for the final step.
     - *Tractability*: We can run distillation experiments on small models and tasks where we can measure both visible competence and invisible alignment properties (e.g., honesty in reporting). We can design probes to test what properties are preserved.
     - *Neglectedness*: The alignment community has discussed distillation, but the specific asymmetry between visible competence and invisible alignment has not been deeply studied.
     - *Mind-changing*: If we find that alignment properties are consistently lost, it would challenge the viability of distillation in this approach.

  **3. Interface relativity (Question 1)**
     - *Why third?* This question is about the expressiveness of the interface and how it shapes the limit. It affects both the competence and alignment of the amplified system. However, it might be that if we solve the first two questions, we can design interfaces that mitigate these issues.
     - *Dependencies*: It is a more fundamental issue than the propagation of errors (Question 7) and non-idempotence (Question 4) because the interface defines the space of possible decompositions.
     - *Tractability*: We can vary the interface (bandwidth, format) in toy environments and observe the resulting behavior. We can also use information theory to model the constraints.
     - *Neglectedness*: The impact of interface design on alignment is relatively underexplored.
     - *Mind-changing*: If we find that the interface strongly determines the outcome and that it is hard to design a task-appropriate one, it might limit the applicability of the approach.

  **4. Error and corruption propagation (Question 7)**
     - *Why fourth?* This question is about the robustness of the entire process to an imperfect base overseer. If errors magnify, then the approach is fragile. However, it depends on the prior questions because if we cannot even get the ideal case (perfect base) to work, then the error propagation might be moot.
     - *Tractability*: We can simulate recursion with a base overseer that has known error rates or mild misalignment (e.g., in a crowdworker setup) and observe how errors propagate. We can also model it as a branching process.
     - *Neglectedness*: Error propagation in recursive systems has been studied in other contexts (e.g., error-correcting codes) but not deeply in alignment.
     - *Mind-changing*: If we find that errors magnify, it would be a strong negative, especially if we require near-perfect base overseers.

  **5. Non-idempotence and drift (Question 4)**
     - *Why fifth?* This question is about the stability of the iterative process. It is important for the long-term convergence of the system, but we might be able to control drift by careful design. Also, it is less critical than the prior questions because if we cannot even get one level of decomposition and distillation to work, then iterating is less relevant.
     - *Tractability*: We can run iterative amplification and distillation in toy settings (e.g., with small neural networks) and measure the drift. We can also develop formal models (e.g., using dynamical systems) to study convergence.
     - *Neglectedness*: Iterative stability in machine learning is under-explored.
     - *Mind-changing*: If we find that the process is unstable and drifts arbitrarily, it would challenge the idea of reaching a fixed point of the task.

  **Why not the others?**
  - **Verification-decomposability (Question 5)**: This is an important empirical question, but without the compute to test at scale, we can only do toy examples. The conceptual content that survives might be limited. We can note that some tasks (like arithmetic) are decomposable, while others (like judging a novel) might not be. But this is already somewhat known. We suggest declining this as unaffordable and not as core to the unit's mission.
  - **Meta-decomposition and fixed-point selection (Question 6)**: This is very abstract and might be intractable in two years. It also seems downstream of the more basic questions (like interface relativity and non-idempotence). We suggest declining as too speculative for now.
  - **Limit versus implementation (Question 8)**: This is important but might be addressed naturally in the course of studying non-idempotence and drift. Also, it is a practical concern that might be addressed by engineering. We suggest folding it into the work on non-idempotence and drift.

  ### Step 2: Upstream/Downstream Map

  The dependency structure (upstream questions are prerequisites for downstream ones):

  ```
  Local compliance, global failure (3)
  │
  Visibility asymmetry (2)
  │
  Interface relativity (1) ───┐
  │                          │
  Error and corruption propagation (7) 
  │
  Non-idempotence and drift (4)
  ```

  - **Question 3 (Local compliance)** is the most upstream: if we cannot compose subagents to achieve the global objective, then the rest of the process (including distillation) is in jeopardy.
  - **Question 2 (Visibility asymmetry)** depends on having a working decomposition (at least in principle) to then study the distillation step.
  - **Question 1 (Interface relativity)** is upstream of **Question 7 (Error propagation)** because the interface design might affect how errors propagate. It is also upstream of **Question 4 (Non-idempotence)** because the interface might constrain the iterative process.
  - **Question 7 (Error propagation)** depends on the interface and the decomposition working, and it affects the stability of the iterative process (non-idempotence).
  - **Question 4 (Non-idempotence)** is downstream because it deals with iterating the entire procedure, which requires that each step is reasonably functional.

  ### Step 3: Negative Answers for Prioritized Questions

  For each prioritized question, we consider the implications of a negative answer:

  1. **Local compliance, global failure**:
     - *Negative answer*: We find that global failure is common and hard to avoid even in simple tasks.
     - *Implications*: This directly damages the preservation claim for decomposition-based approaches. It suggests that the approach does not preserve alignment (and maybe not even competence) at the composition level. This would be a strong argument against pursuing decomposition.
     - *Shift effort*: If decomposition fails, we might shift to debate-style methods (which are adversarial and might catch global failures) or interpretability (to understand the internal reasoning of a monolithic model).

  2. **Visibility asymmetry**:
     - *Negative answer*: Distillation consistently loses alignment properties while preserving competence.
     - *Implications*: This damages the case for distillation in decomposition-based approaches. It would mean that even if we build a safe amplified system, we cannot get a fast and safe model by distillation. This is specific to decomposition because distillation is a key step in the approach.
     - *Shift effort*: We might then focus on other ways to make the amplified system efficient (like architectural improvements) or shift to methods that do not require distillation (like training with human feedback without decomposition). Alternatively, we might try to make alignment properties more visible (e.g., via interpretability tools).

  3. **Interface relativity**:
     - *Negative answer*: The interface strongly determines the outcome, and we cannot design an interface that is both expressive enough for the task and constrained enough to avoid misalignment.
     - *Implications*: This damages decomposition-based approaches by showing that the fixed point is an artifact of the interface. It might make the approach too brittle or task-specific.
     - *Shift effort*: We might then focus on designing better interfaces (using formal methods) or shift to approaches that are less sensitive to interface design (like end-to-end training with interpretability).

  4. **Error and corruption propagation**:
     - *Negative answer*: Errors or misalignment magnify with recursion, making the system less safe at higher levels.
     - *Implications*: This damages the case for recursion in decomposition. It would require that the base overseer is extremely reliable and aligned, which might be unrealistic. This is a problem for scalable oversight generally, but particularly for decomposition because recursion is central.
     - *Shift effort*: We might then look for error-correction mechanisms in the decomposition or shift to approaches that do not rely on recursion (like one-step decomposition). Alternatively, we might focus on improving the base overseer (via interpretability or formal verification).

  5. **Non-idempotence and drift**:
     - *Negative answer*: The iterative process is unstable and does not converge to the task fixed point.
     - *Implications*: This damages the case for iterating the procedure to achieve high competence. It might limit the approach to shallow decompositions. This is specific to decomposition because of the iterative aspect.
     - *Shift effort*: We might then try to stabilize the iteration (e.g., by regularization) or shift to non-iterative approaches. Alternatively, we might focus on the limit object theoretically and then try to approximate it without iteration.

  ### Step 4: Candid Treatment of Dissolution

  We explicitly decline some questions and explain:

  - **Verification-decomposability (Question 5)**: This is an empirical question that requires testing on a variety of tasks at scale. The unit lacks the compute to do so. We can only study toy examples, which might not generalize. Therefore, we decline this as unaffordable. However, we can note that our work on interface relativity might shed light on what makes a task decomposable.

  - **Meta-decomposition and fixed-point selection (Question 6)**: This is highly abstract and speculative. In two years, we are unlikely to make practical progress. Moreover, it depends on the prior questions (like having a stable decomposition procedure). We decline it as too far upstream and currently intractable. It might be revisited after progress on the core questions.

  - **Limit versus implementation (Question 8)**: We do not decline this entirely. Instead, we incorporate it into the study of non-idempotence and drift, because truncation is a form of finite approximation that might cause drift. Thus, we address it in the context of Question 4.

  **Additional dissolution note**: We suspect that the competence and alignment preservation claims might not be as separable as the framing suggests. For example, a decomposition that preserves competence might require subagents that are misaligned (e.g., by being too competitive). We will be alert to this in our investigations, especially in Question 3.

  ### Step 5: Division of Effort and Evidence

  **Division between "does it work" (competence) and "would it be safe" (alignment):**

  The unit should focus **60% on safety (alignment)** and **40% on competence**. The reason is that the competence preservation claim is somewhat more established (e.g., in AIXI and other theoretical models) and the unit's background is in philosophy and theoretical computer science, which might be more suited to alignment questions. Moreover, the alignment questions are more neglected and more critical for the overall case.

  - **Safety focus**: Questions 2 (visibility asymmetry), 3 (local compliance), and 7 (error propagation) are primarily about alignment. Question 1 (interface relativity) has both aspects but is also critical for safety.
  - **Competence focus**: Question 4 (non-idempotence) and part of Question 1 (interface relativity) are about competence. However, we note that the two are intertwined.

  **Evidence that would reprioritize:**

  - **If we find in small experiments that local compliance leading to global failure is rare and avoidable**, we might reduce effort on Question 3 and shift to downstream questions.
  - **If we find that distillation preserves alignment properties in our probes**, we might reduce effort on Question 2 and focus more on recursion (Questions 4 and 7).
  - **If we see from the wider field (e.g., in large-scale systems) that decomposition is working for competence but alignment is failing**, we might increase effort on alignment questions (2, 3, 7).
  - **If theoretical work suggests that error propagation is necessarily amplifying**, we might deprioritize Question 7 (as a dead end) and focus on how to avoid recursion (e.g., with better base overseers).

  **Conclusion**:

  The unit will focus on the five questions in the order given, with an emphasis on alignment. We believe that addressing these will provide the most valuable insights into the viability of decomposition-based approaches within the constraints of our resources.
answer: |-
  ### Research Prospectus: Decomposition-Based Alignment Unit

  #### **1. Prioritized Questions and Ordering**
  The unit will focus on five core questions, ordered by their upstream position in the conceptual dependency graph, tractability with modest compute, neglectedness, and potential to decisively influence the viability of decomposition-based approaches. Criteria are weighted as follows:  
  - **Dependencies**: Upstream questions constrain downstream ones.  
  - **Tractability**: Feasibility in 2 years with small-scale experiments (toy models, human studies).  
  - **Neglectedness**: Under-explored relative to impact.  
  - **Mind-changing potential**: Could a negative answer fundamentally undermine the approach?  

  **Order of Priority** (descending):  
  1. **Local compliance, global failure** (Question 3)  
  2. **Visibility asymmetry** (Question 2)  
  3. **Interface relativity** (Question 1)  
  4. **Error and corruption propagation** (Question 7)  
  5. **Non-idempotence and drift** (Question 4)  

  **Defense of Ordering**:  
  - **Question 3 (Local compliance)** is the most upstream and foundational. If local subtask compliance systematically fails to preserve global alignment, the entire recursive structure collapses. It is tractable with crowdworker experiments (e.g., decomposing ethics dilemmas into subjudgments) and highly neglected in alignment literature. A negative answer would be fatal to the approach, making it the highest priority.  
  - **Question 2 (Visibility asymmetry)** directly challenges distillation’s ability to preserve alignment. It depends on Question 3 (if composition fails, distillation is irrelevant) but is tractable via small-model probes (e.g., distilling "honesty" vs. "competence"). Neglected and decisive: if alignment properties are systematically lost, distillation cannot be trusted.  
  - **Question 1 (Interface relativity)** examines how interface constraints distort the limit. It depends on Questions 2–3 (alignment preservation must be plausible first) and is tractable via toy environments (e.g., varying subagent communication bandwidth). Moderately neglected; a negative answer would limit scalability but not invalidate the core approach.  
  - **Question 7 (Error propagation)** tests robustness to imperfect overseers. It depends on Question 1 (interfaces mediate error propagation) and is tractable with synthetic noise experiments. Highly neglected; if errors amplify, the approach is fragile.  
  - **Question 4 (Non-idempotence)** addresses iterative stability. It depends on the above (errors/interface shape drift) and is tractable via iterated distillation on arithmetic tasks. Less neglected but critical for long-term applications. A negative answer (unbounded drift) would limit practical use.  

  **Trade-offs**:  
  - Excluded **Question 5 (Verification-decomposability)** due to empirical infeasibility (requires frontier-scale evaluation).  
  - Excluded **Question 6 (Meta-decomposition)** as too abstract for tractable progress.  
  - Excluded **Question 8 (Limit vs. implementation)**; partially addressed in Question 4.  

  #### **2. Upstream/Downstream Map**  
  ```mermaid  
  graph LR  
      A3[3. Local compliance] --> A2[2. Visibility asymmetry]  
      A2 --> A1[1. Interface relativity]  
      A1 --> A7[7. Error propagation]  
      A7 --> A4[4. Non-idempotence]  
  ```  
  - **Question 3 gates all**: If local compliance fails, global alignment is impossible, making downstream questions moot.  
  - **Question 2 gates distillation**: If alignment properties are invisible, distillation fails regardless of interface design.  
  - **Question 1 gates scalability**: Interface constraints affect error propagation (Q7) and drift (Q4).  
  - **Question 7 gates robustness**: Error propagation affects whether iteration (Q4) is stable.  

  #### **3. Implications of Negative Answers**  
  **Question 3: Local compliance, global failure**  
  - **Negative**: Local subagents satisfy subtasks but violate global intent (e.g., subagents "truthfully" answer subquestions to mislead overall).  
  - **Impact**: Damages decomposition specifically. Shows the preservation claim (decomposition → alignment) is false.  
  - **Pivot**: Shift effort to debate-style methods (explicitly adversarial to catch global failures) or interpretability (audit internal reasoning).  

  **Question 2: Visibility asymmetry**  
  - **Negative**: Distillation preserves competence (observable) but erodes alignment (unobservable, e.g., honesty).  
  - **Impact**: Damages distillation specifically. Alignment properties are lost in deployment.  
  - **Pivot**: Redirect to formal verification (prove properties survive distillation) or hybrid oversight (distill only competence, retain human checks).  

  **Question 1: Interface relativity**  
  - **Negative**: Fixed point is determined by interface constraints (e.g., bandwidth limits) rather than the task.  
  - **Impact**: Challenges decomposition’s goal of task fidelity. Limits approach to narrow domains.  
  - **Pivot**: Focus on interpretability (reverse-engineer interfaces) or task-specific alignment (e.g., tool AI).  

  **Question 7: Error propagation**  
  - **Negative**: Mild misalignment magnifies with recursion (e.g., small bias becomes catastrophic at depth).  
  - **Impact**: Damages scalable oversight generally. Requires near-perfect base overseers.  
  - **Pivot**: Shift to formal verification (mathematically bound errors) or interpretability (detect corruption early).  

  **Question 4: Non-idempotence and drift**  
  - **Negative**: Iteration drifts from the task (e.g., distilled agents "forget" alignment under recursion).  
  - **Impact**: Practical limitation, not fatal. Shows the approach is unstable in deployment.  
  - **Pivot**: Optimize single-level amplification or invest in "stabilizing" distillation (e.g., regularization).  

  #### **4. Candid Dissolution of Low-Priority Candidates**  
  - **Pseudo-problems**:  
    - **Question 6 (Meta-decomposition)**: Self-referential fixed points are philosophically intriguing but intractable without large-scale systems. No experiment in 2 years could resolve this; it collapses into abstract theory. Decline as non-actionable.  
  - **Unaffordable empirical questions**:  
    - **Question 5 (Verification-decomposability)**: Requires testing complex tasks (e.g., "predict scientific breakthroughs") on frontier models. Unit lacks compute; decline as infeasible. Conceptual fallback: define "global properties" theoretically (e.g., cryptographic tasks resist decomposition).  
  - **Declined with reasons**:  
    - **Question 8 (Limit vs. implementation)**: Partially redundant with Question 4 (drift captures truncation effects). Address via "approximation error" in non-idempotence studies.  
  - **Critical dissolution note**: The competence/alignment separation is likely artificial. For example, local compliance (Q3) may fail *because* of competence gaps (e.g., subtasks require unethical competence). The unit will test inseparability via probes where competence and alignment conflict (e.g., "achieve goal while avoiding side effects").  

  #### **5. Effort Division and Dynamic Reprioritization**  
  - **Effort split**:  
    - **"Does it work?" (Competence)**: 30% (Questions 1, 4, parts of 3).  
    - **"Would it be safe?" (Alignment)**: 70% (Questions 2, 3, 7, inseparability probe).  
    Justification: Alignment failures are more catastrophic and underexplored. Philosophy/TCS expertise favors formalizing safety.  
  - **Evidence for reprioritization**:  
    - **Upgrade Question 7** if:  
      - Empirical probes show base LLMs exhibit consistent misalignment (e.g., sycophancy in crowdworkers).  
      - Field results (e.g., Anthropic, Redwood) show recursive RLHF amplifies bias.  
    - **Downgrade Question 4** if:  
      - Toy experiments show iteration converges (e.g., arithmetic tasks stabilize after 2–3 distills).  
      - Field evidence (e.g., OpenAI’s iterative alignment) reports negligible drift.  
    - **Upgrade inseparability probe** if:  
      - Negative answers to Q2/Q3 correlate with competence gaps (e.g., models fail global tasks only when subtasks are "too hard").  
    - **Abandon decomposition** if:  
      - Q2/Q3 show systemic alignment loss in >50% of probes, or field results (e.g., catastrophic distillation failures) confirm visibility asymmetry.  

  ---  
  **Summary**: The unit prioritizes alignment-critical, tractable questions where negative answers could refute the approach. Effort focuses on the safety of composition and distillation, with flexibility to pivot based on empirical signals. If decomposition fails, debate and interpretability become the most viable alternatives.
