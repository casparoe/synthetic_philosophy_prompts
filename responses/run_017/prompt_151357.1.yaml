  ### Sestina for the Coffee-Hum Sample  

  **Stanza 1**  
  He hums four notes. The kettle’s *tempo* slows,  
  each *grain* of sound like grounds in water pressed.  
  A pause, then *decay*: steam’s soft aftermath.  
  His voice, low *register*, a grounded warmth.  
  The *room* absorbs it — tile, wood, and window-light.  
  *Density* swells where the silence thins.  

  **Stanza 2**  
  The silence *density* of thought unfurls,  
  as morning *tempo* rushes, skips, then swings.  
  His voice, a high *register*, pierces the *room*  
  like cracked glass. Each note’s *grain* scrapes the air,  
  brief *decay* swallowed by percolating dark.  
  A bitter *light* now? No — the old warmth.  

  **Stanza 3**  
  The old *decay* of coffee, scent of *warmth*,  
  fills air too thick with *density* of steam.  
  He hums in broken *light* — a syncopated  
  *register*, half-lost. The *room* contracts.  
  *Grain* shifts to static, *tempo* stalled mid-breath.  

  **Stanza 4**  
  Mid-breath, *tempo* resumes. A hollow *room*  
  magnifies every *grain*: the scrape of cup,  
  the *density* of steam, the voice’s *warmth*  
  now frayed by *decay* into whispered shade.  
  *Register* leaps — a question? No reply.  
  The *light* is thin, but holds.  

  **Stanza 5**  
  But holds the *light*? His *register* descends  
  to hum in shadows. *Decay* lingers long,  
  a *density* like syrup. *Tempo* drags,  
  and *grain* turns velvet. Still, the *room* retains  
  that first *warmth*’s ghost — a fingerprint on glass.  

  **Stanza 6**  
  On glass, steam’s ghost. The *grain* dissolves to mist,  
  *decay* erased. *Density* lifts, and *light*  
  floods in. *Register* pure, a flute’s clear *warmth*.  
  The *room* expands to field. *Tempo* runs wild.  

  **Envoi**  
  He hums, but now the field has *context*: wind,  
  wheat, sky. The *room* was one *register*;  
  here, *decay* feeds the soil, *density* breathes,  
  *tempo* is seasons, *grain* the rustling stalk,  
  and *light*? The *warmth* of sun on open land.  

  ---

