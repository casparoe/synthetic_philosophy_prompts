  | 2      | density    | Thickens silence, crowds the air            | cousin         | Shifts focus to absence, not presence                      |  
  | 3      | decay      | Fades quickly, swallowed by noise           | far            | Breaks continuity; voice becomes fragment                  |  
  | 4      | room       | Hollow, amplifying small sounds             | cousin         | Turns intimacy into exposure                               |  
  | 5      | light      | Faint but persistent                        | near           | Softens decay; emphasizes resilience                       |  
  | 6      | grain      | Dissolves texture into atmosphere           | past horizon   | Erases origin’s tactile signature                          |  
  | envoi  | all + context | Adds narrative (field/wind/sky) to sound   | new dimension  | Recontextualizes knobs as natural, not mechanical forces   |  

