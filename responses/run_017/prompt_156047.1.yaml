  Hmm, the user is assembling a graduate seminar on persistence and wants a case that reverses the standard dialectic between endurantism and perdurantism. Normally, the challenge is fission cases where one thing splits into two, which endurantists struggle with. The user wants a fusion case where two things merge into one, putting perdurantists on the defensive.

  The user has specific requirements: it should involve ordinary objects or institutions (no sci-fi), have real-world consequences like obligations, avoid stipulations, and not be a strawman argument. The perdurantist should have their full toolkit - unrestricted composition, scattered objects, temporal parts. After presenting the scenario, I need to precisely state the identity question, derive both verdicts, explain what's doing the work, run the case backwards, give perdurantist replies with costs, and evaluate whether the dialectic is genuinely inverted.

  I'm considering a university merger scenario. Two universities - one financially troubled, the other thriving - merge under the name of the thriving one, with all legal obligations transferring. The key question is whether the merged university is identical to the thriving pre-merger university. This satisfies the requirements: it's ordinary, has real consequences (debts and obligations), and the asymmetry comes from institutional continuity rather than stipulation.

  For endurantists, they can affirm identity with the thriving university because its organizational structure persists. For perdurantists, unrestricted composition means they must say both universities become temporal parts of a new scattered object, denying identity with either predecessor. The asymmetry comes from the thriving university maintaining functional continuity.

  Reversed as a fission case, endurantists would struggle while perdurantists have an easier time. Perdurantist replies might include: claiming identity is conventional (costs realism), positing gappy objects (costs parsimony), or accepting mereological essentialism (costs common sense). The temporal part fallback doesn't vindicate identity - it replaces it with parthood.

  I think this genuinely inverts the dialectic because perdurantists must deny an intuitive identity claim they normally accommodate through temporal parts. The weakest point is whether institutional persistence is sufficiently analogous to physical persistence. I'm confident the case meets all specifications and creates the desired theoretical pressure.
answer: |-
  Here is a case meeting your specifications, designed to invert the standard dialectic by focusing on fusion rather than fission, leveraging institutional persistence with tangible consequences:

  **The Case: The University Merger**
  The University of Northhaven (UNH), a financially struggling but historically significant public institution, merges with the prosperous and expanding Eastland Polytechnic (EP). The merger agreement dissolves UNH as a legal entity, transfers all its assets, liabilities (including substantial pension obligations and bond debt), faculty contracts, student records, and accreditation to EP, and renames the combined institution "Eastland Polytechnic University" (EPU). Crucially, EP's leadership, governance structure, administrative core, campus location, and primary brand identity remain intact and dominant. UNH's campus becomes a satellite location, its programs are integrated or discontinued, and its distinct identity is subsumed. Tenured UNH faculty are absorbed into EPU's departments under EPU's existing tenure rules. A major bondholder for UNH debt demands payment from EPU, citing the transfer of liabilities. EPU insists it only inherited obligations, not identity. The bondholder argues EPU *is* UNH, reconstituted, and thus directly liable as the *same* obligor.

  **The Yes-or-No Question:** Is Eastland Polytechnic University (EPU) numerically identical to the University of Northhaven (UNH)?

  **Verdicts Derived from Theories:**
  1.  **Endurantist Verdict (Yes):**
      *   **Derivation:** Endurantism holds that an object persists by being wholly present at different times. The endurantist focuses on the *continuity of the institution* defined by its core obligations, legal identity, and the specific debts incurred. UNH, as a continuant, entered into bond agreements *as UNH*. The merger transferred *all* of UNH's defining legal attributes, obligations (like the bond debt), and the *substance* of its institutional being (faculty contracts, student obligations, accreditation) to EPU. Crucially, **the debt obligation is tied intrinsically to the identity of the obligor** that incurred it. For the bondholder's claim to be valid ("EPU *is* UNH"), strict numerical identity is presupposed by the practice of debt enforcement. The endurantist identifies UNH with the institution bearing *its specific obligations* and *its historical legal identity* as transferred. EPU now bears *that very identity* and *those exact obligations* as core constitutive elements, fulfilling the role UNH occupied. There is no branching or ambiguity; UNH's identity-track terminates solely in EPU through the transfer. Thus, EPU is numerically identical to UNH.
      *   **Feature Doing the Work:** **The non-transferability of specific, identity-bound obligations.** The obligation is not merely inherited; it defines the persistence conditions of the obligor institution itself under endurantism. The asymmetry arises because UNH's core identity-defining obligations were transferred *in toto* to EPU, making EPU the bearer of UNH's historical identity, while EP's core identity elements (leadership, governance, primary location/brand) persisted dominantly but *without* inheriting an identity-defining obligation from another entity in the same way.

  2.  **Perdurantist Verdict (No):**
      *   **Derivation:** Perdurantism holds that objects persist by having temporal parts. Strict numerical identity over time requires strict spatiotemporal continuity of the entire spacetime worm. The merger creates a new, complex, scattered 4D object – the EPU worm. The pre-merger UNH worm and the pre-merger EP worm are distinct maximal spacetime worms. The post-merger EPU worm is a distinct maximal worm comprising temporal parts from both pre-merger worms plus new parts formed during and after the merger. While the UNH worm ends (ceases to have future temporal parts), some of its temporal parts (e.g., certain assets, records, obligations as abstracta) become temporal parts of the new EPU worm. However, **numerical identity requires the entire worm to be identical**. The EPU worm is not identical to the UNH worm; it is a different aggregate of temporal parts. The perdurantist paraphrase: "EPU has a temporal part (the post-merger phase) that bears the obligation that was borne by a temporal part of the UNH worm (the pre-merger phase)." This explains liability *without* identity. The bond is satisfied by a temporal part of the EPU worm, which contains temporal parts that were once parts of the UNH worm (or bear the relevant properties). But EPU ≠ UNH.
      *   **Feature Doing the Work:** **Unrestricted Composition & Maximality.** Perdurantism generates a distinct maximal 4D object for the post-merger entity. Identity requires the *whole worm* to be the same, which it isn't. The paraphrase machinery handles predication (like bearing an obligation) but explicitly denies numerical identity between the continuants.

  **Reversed Case (Fission):** Suppose EPU undergoes a divestiture, splitting back into two institutions roughly resembling the original UNH and EP, each taking on a portion of EPU's assets and liabilities, including a share of the old UNH bond debt.
  *   **Endurantist Verdict (Struggles):** Must arbitrarily choose which post-fission institution "is" UNH to bear the full identity-bound obligation, or deny that either strictly is UNH, potentially invalidating the obligation's strict enforceability against a single entity.
  *   **Perdurantist Verdict (Accommodates Easily):** The pre-fission EPU worm branches into two distinct future worms. Each post-fission institution is a distinct maximal 4D object. The obligation borne by a temporal part of the EPU worm might be inherited by temporal parts of both new worms (via paraphrase). No identity claim is needed or made between EPU and either fission product.

  **Perdurantist Replies and Costs:**
  1.  **Reply:** "EPU is numerically identical to EP. UNH ceases to exist, its obligations are borne by the new entity EPU which is EP continued."
      *   **Cost:** **Denies Intuition & Practice.** This arbitrarily privileges one pre-merger entity over the other based on dominance, violating the perdurantist's own commitment to ontological parity. It fails to respect the *transfer* of UNH's *specific identity-constituting obligations* as understood in the ordinary practice demanding strict identity for liability. If EPU is just EP, why did it *inherit* UNH's debt? Inheritance isn't identity.
  2.  **Reply:** "EPU is a gappy object: EP exists, then a merger 'gap' event, then EP exists again (as EPU). UNH is a distinct, terminated worm."
      *   **Cost:** **Violates Continuity & Incurs Gappy Objects.** Positing a temporal gap in EP's existence is ad hoc and contradicts the evident functional and administrative continuity of EP's core throughout the merger process. It also requires accepting often-undesired "gappy objects." It still denies UNH's persistence in any form relevant to the identity-bound obligation.
  3.  **Reply:** "Identity is conventional here. We can *stipulate* EPU is identical to EP (or UNH) based on dominant features for practical purposes like debt."
      *   **Cost:** **Abandons Metaphysical Realism / Admits Conventionalism.** This surrenders the perdurantist's claim to provide the *metaphysically fundamental* account of persistence, reducing identity to a pragmatic or legal fiction in precisely the kind of case where realism about obligations seems paramount. It concedes the ground to the endurantist's intuitive realism about institutional identity.

  **The Temporal Part Fallback:** The perdurantist claims that the pre-merger UNH is a *temporal part* of the larger, scattered EPU worm. Does this vindicate the ordinary claim ("EPU *is* UNH")?
  *   **No.** It explicitly **restates its denial.** Saying "UNH is a temporal part of EPU" is fundamentally different from saying "UNH is identical to EPU." It means UNH constitutes only a portion of what EPU is, temporally and likely mereologically. The bondholder's claim requires strict identity ("EPU *is* the obligor, UNH"). The temporal part paraphrase translates this to "A temporal part of EPU bears the obligation that was borne by a temporal part of UNH" – a statement *about* temporal parts and properties, not an identity statement *between* continuants. It explains liability without affirming identity, thereby *denying* the literal truth of the ordinary identity presupposition.

  **Committed Judgement: Genuine Inversion Achieved**
  Yes, this case genuinely inverts the dialectic. The endurantist, often pressed by fission to deny identity or choose arbitrarily, here *affirms* a strict, literal identity grounded in the continuity of identity-constituting obligations within a unified institutional trajectory. The perdurantist, usually adept at handling fission through branching worms, is forced by unrestricted composition and maximality to *deny* a seemingly straightforward identity claim required by ordinary practice (enforceable debt tied to the original obligor's identity). The perdurantist's paraphrases explain predication and liability but explicitly reject numerical identity. Their escape routes either violate their own ontological neutrality (privileging EP), introduce undesirable entities (gappy objects), or retreat into conventionalism – all significant costs that mirror the costs endurantists typically bear in fission cases (arbitrariness, denial of survival). The core asymmetry in the merger – the transfer of UNH's *entire identity-defining obligation load* to EPU – provides the non-conventional, non-stipulative grounding the endurantist needs to affirm identity, while creating the mereological complexity the perdurantist cannot resolve without denying identity.

  **What I'm Least Confident About:** The robustness of the "identity-bound obligation" as a persistence condition under endurantism for institutions. While intuitive for debt enforcement, it might seem less fundamental than, say, physical continuity for a material object. Is the obligation truly *constitutive* of UNH's identity in a way strong enough to bear the metaphysical weight of persistence through radical structural change? Or is this importing a legal fiction into metaphysics? I think the case holds because institutions *are* partly constituted by their legal and normative commitments, but this aspect requires careful defense against the charge of being merely conventional.
