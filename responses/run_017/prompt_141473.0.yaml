  Potential conclusions: the structural features do affect demandingness, supporting budgeted consequentialism. Or, they don't, so magnitude is primary. Or, it reduces to rule-consequentialism. Deciding factors include empirical results from cases and theoretical arguments against collapse.

  For real-world impact, organizations like Giving What We We Pledge could benefit by structuring commitments to reduce burnout. Success would mean providing a framework for sustainable altruism.

