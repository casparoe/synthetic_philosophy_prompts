answer: |-
  ## Dissertation Prospectus: Budgeted Consequentialism and the Temporal Structure of Demandingness

  **Candidate:** [Your Name]  
  **Programme:** MPhil in Moral Philosophy  
  **Supervisor:** [Supervisor's Name]  
  **Proposed Start Date:** October 2024  
  **Submission Deadline:** End of Month [Date]

  **1. Research Question & Core Argument**
  The demandingness objection (DO) alleges that consequentialism (C) requires agents to sacrifice too much of their personal lives and projects for the sake of the greater good, generating unacceptable burdens like resentment, alienation, and burnout. Standard responses assume the DO’s force stems primarily from the sheer *magnitude* of the required sacrifices. Consequently, defences either scale down required sacrifices (e.g., via an agent-centred prerogative) or distinguish the criterion of rightness from practical decision procedures (e.g., recommending rules or dispositions that indirectly maximise good). This project challenges that foundational assumption. It asks:

  *Does a significant portion of the demandingness objection’s intuitive force derive not from the magnitude of consequentialism’s requirements, but from their specific *temporal structure* – namely, their unpredictability, open-endedness, and non-pre-payability (collectively termed ‘unschedulability’)? And, if so, can a form of ‘Budgeted Consequentialism’ (BC), permitting agents to adopt and adhere to a deliberately chosen, fixed allocation of time/resources, be a viable and distinct response, even when deviating from moment-by-moment optimisation?*

  The core hypothesis is that the intuitive psychological and normative weight of the DO arises significantly from the *way* demands are experienced over time: as relentless, unpredictable incursions lacking closure, rather than solely from their aggregate cost. The contrast between individuals adhering to fixed giving pledges (reporting minimal demandingness burden) and those responding reactively to each appeal (reporting high burden), despite comparable lifetime contributions, provides the initial empirical and intuitive impetus.

  **2. Why Existing Answers Leave the Question Open**
  Current dominant strategies fail to address the *structural* aspect of demandingness because they presuppose magnitude as the core issue:
  *   **Agent-Centred Prerogative (ACP):** ACP directly tackles magnitude by permitting suboptimal acts to protect personal interests. However, it says nothing about *how* permissible sacrifices are distributed over time. An agent using an ACP might still face constant, unpredictable demands within their 'allowance', experiencing the very burnout the unschedulability thesis identifies. ACP reduces the bill but doesn't alter its chaotic payment schedule.
  *   **Decision-Procedure Strategies (DPS):** DPS recommend rules, dispositions, or heuristics for practical deliberation to avoid the pitfalls of constant calculation. Crucially, however, these strategies are typically justified *instrumentally*: the rule is adopted *because* following it (usually) leads to better consequences than direct maximisation. The permissibility of adhering to the rule *in a specific instance* where breaking it would yield marginally more good remains contingent on overall consequences. This fails to address the core need for *closure* and *predictability* inherent in the unschedulability problem. The agent under DPS still faces the *cognitive and volitional demand* of potentially needing to reassess the rule constantly or knowing they *could* do more good now by breaking it, undermining the psychological respite the fixed-budget agent experiences.

  Both strategies treat the *form* of the demand as secondary to its *size*. This project argues the form is primary for a significant part of the objection's intuitive appeal.

  **3. Methodology & Work Plan (9 Months)**
  The project combines conceptual analysis with normative ethics methodology, employing structured intuition-pumping through paired cases to test the structural thesis.

  *   **Months 1-2: Literature Review & Conceptual Groundwork:** Deep dive into demandingness literature (e.g., Scheffler, Murphy, Mulgan, Williams), decision-procedure consequentialism (e.g., Railton), rule-consequentialism (e.g., Hooker), and psychological literature on commitment devices, decision fatigue, and burnout. Precisely define ‘unschedulability’ (unpredictability, lack of closure, non-pre-payability) and ‘Budgeted Consequentialism’.
  *   **Month 3: Developing the Paired Cases Framework:** Design a series of carefully controlled hypothetical scenarios varying *only* the temporal structure while holding lifetime cost constant. Key comparisons:
      *   **Predictability:** Fixed, known annual levy vs. same total sum extracted via unpredictable, variable demands.
      *   **Closure:** Demand with a clear endpoint (e.g., "Give £X/year for 10 years") vs. open-ended demand requiring constant vigilance ("Give whenever your £X/year running total hasn't yet maximised expected good").
      *   **Pre-payability:** Option to discharge total expected lifetime obligation upfront vs. obligation spread unavoidably over time.
      *   *(Control: Cases varying only magnitude)*
  *   **Months 4-5: Testing the Structural Thesis:** Systematically analyse intuitions elicited by these paired cases. Does varying structure alone significantly alter judgments about demandingness, permissibility, psychological burden, or alienation, even when magnitude is fixed? Refine cases based on analysis.
  *   **Month 6: Articulating Budgeted Consequentialism:** Develop BC as a substantive normative claim: Agents are morally permitted (or perhaps even required, under certain conditions) to adopt a deliberate, self-binding budget (allocating specific time/resources to personal vs. impartial goods) at a favourable, reflective moment and then adhere to it, *even when deviating in a particular moment could produce marginally more good*. Ground this permission in the value of avoiding unschedulability burdens and preserving agential integrity over time.
  *   **Month 7: Defending Distinctiveness:** Argue BC is neither Rule-Consequentialism (RC) nor Indirect Consequentialism (IC).
      *   **vs. RC:** RC evaluates rules *solely* by their overall consequences. BC justifies the budget *primarily* as a response to the agent-relative burdens of *unschedulability*, not (necessarily) because the budget rule maximises good overall. RC might endorse a rule similar to BC, but for fundamentally different reasons. BC potentially permits budgets that are *suboptimal* in terms of *total* good produced, if necessary to avoid unschedulability burdens – a move RC could not sanction. BC is fundamentally about the structure of *permission* within an act-consequentialist framework concerning *time*, whereas RC replaces act-C as the criterion of rightness.
      *   **vs. IC:** IC treats rules as mere decision-procedural tools; the criterion of rightness remains act-consequentialist. Breaking the rule is *impermissible* if it yields more good. BC, however, claims that *adhering* to the chosen budget is permissible *even when* breaking it would yield more good in that instance, precisely because the budget serves the distinct function of *managing temporal demandingness* and preserving the agent's perspective. BC offers *deontic constraints* derived from temporal structure, not just epistemic or volitional heuristics.
  *   **Month 8: Addressing the One-Level-Up Worry:** Confront the objection that demandingness merely resurfaces when choosing the budget. Is setting a demanding budget itself too burdensome? Does it incentivise choosing low-earning paths? Analyse this regress worry:
      *   **Deliberative Context Matters:** Choosing a budget at a reflective, favourable moment (e.g., career start) is psychologically and normatively distinct from facing constant, unpredictable demands. The burdens of deliberation are different from the burdens of relentless execution.
      *   **Epistemic Advantage:** Setting a budget often involves clearer foresight about lifetime earnings and needs than moment-by-moment demands.
      *   **Self-Binding Value:** The act of commitment itself can reduce future cognitive load and volitional strain, providing value that offsets the deliberative cost.
      *   **Not Decisive?** The worry highlights a genuine challenge but is unlikely to be *decisive*. It doesn't negate the core distinction between structural and magnitude-based demandingness. It may show BC mitigates rather than eliminates demandingness, or that a *moderately* demanding budget is easier to choose and sustain than a life of unscheduled maximal demands. The key is whether the *form* of the demand at the budget-setting stage is significantly *less* prone to unschedulability burdens than constant optimisation. (Initial hypothesis: Yes).
  *   **Month 9: Synthesis, Conclusions & Writing:** Integrate findings. Articulate possible conclusions:
      *   **Strong Success:** Unschedulability is a primary driver of the DO; BC is a viable, distinct normative position superior to magnitude-focused replies.
      *   **Moderate Success:** Unschedulability contributes *significantly* to the DO alongside magnitude; BC offers a valuable partial response or refinement to existing strategies (e.g., informing the scope of an ACP or the content of DPS rules).
      *   **Weak Success/Limited Scope:** Unschedulability explains demandingness only in specific contexts (e.g., high-stakes, long-term agency); BC applies only conditionally.
      *   **Failure Points:** (a) Paired cases show *no* intuitive difference based on structure (magnitude dominates). (b) The regress worry proves fatal to BC’s coherence. (c) BC cannot be convincingly distinguished from RC or IC.
      *   **Deciding Factors:** Primarily the intuitive force of the paired-case comparisons and the success in defending BC’s distinct rationale against collapse into RC/IC.

  **4. Deliverables & Impact**
  *   **Academic:** An MPhil dissertation making an original contribution to the demandingness debate, offering a novel diagnosis and a distinct normative proposal. Success would shift focus towards the temporal dynamics of moral requirements.
  *   **Beyond Philosophy (e.g., Effective Altruism/Pledge Communities):** A clear articulation of why structured giving pledges (like Giving What We Pledge) might be not just practically prudent, but *morally permissible* or even optimal strategies for sustaining long-term commitment and well-being, specifically by mitigating unschedulability burdens. A successful deliverable would provide a robust philosophical justification for their approach, moving beyond purely instrumental or psychological arguments.

  **5. Feasibility & Conclusion**
  This project is tightly focused, building directly on established debates while offering a novel perspective grounded in observable phenomena (pledge vs. reactive giving experiences). The nine-month plan is realistic, centred on conceptual development and normative argumentation tested through carefully constructed cases. The primary risks are the potential intuitive weakness of the paired cases or the difficulty of maintaining BC's distinctness from RC/IC, but these are precisely the points of critical investigation. This prospectus outlines a promising avenue for revitalising the demandingness debate by exposing and addressing the crucial, yet neglected, role of temporal structure in generating moral burden.
