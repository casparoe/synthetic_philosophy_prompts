  We are to specify the requirements for a belief-revision rule in a tracking system. The rule updates a prior probability distribution over a finite grid based on reports that are typically constraints (e.g., "the odds are three to one that the asset is north of the river"). The system must be robust, deterministic, and indifferent to arbitrary modeling choices.

  We'll break down the requirements based on the cases provided and the overall purpose.

  ### Non-negotiable Requirements (derived from the purpose)

  1. **Determinacy**: The rule must produce a unique posterior for any given prior and report. This is non-negotiable because the system runs unattended and must have one answer without manual tie-breaking.

  2. **Robustness to Bookkeeping**:
     - **Idempotence**: Applying the same report twice should yield the same result as applying it once. (Tested by the fourth case: duplicate reports.)
     - **Order-Independence**: The order of reports should not matter. (Tested by the fifth case: two reports in different orders.) Also, the rule must handle batches of reports (i.e., there must exist a batched version that is equivalent to sequential application in any order).

  3. **Invariance under State Space Refinement**: The rule must not depend on how the grid is drawn. If a cell is split into subcells without changing the prior (i.e., the prior over the original cells is preserved by distributing the probability of the split cell appropriately) and the report is equivalently formulated, then the posterior over the original cells must be the same. (Tested by the seventh case: splitting a cell.)

  4. **Continuity**: The rule should be continuous in the prior and the report. This avoids pathological jumps that could be exploited by a downstream decision rule.

  5. **Reduction to Ordinary Conditioning**: When the report pins a single cell (i.e., it is a statement of fact), the rule must reduce to ordinary Bayesian conditioning. (Tested by the first case.)

  6. **Handling Zero Antecedent Probability**: The rule must handle reports with antecedents that have prior probability zero (e.g., "if the bridge had been out the asset would be on the east bank"). In such cases, conditioning on the proposition is trivial (undefined or leaves the prior unchanged) and an alternative (like imaging or a world-shift) must be provided. (Tested by the eighth case.)

  ### Requirements Motivated by Specific Cases

  7. **Handling Conditional Reports (Silence on Orthogonal Partitions)**: 
     - **Case 2**: The Judy Benjamin-style case. The report constrains one partition (north/south) to have a posterior probability of 0.75 for north, and is silent about the orthogonal partition (west/east). The prior has correlation (the west/east margin is not independent of north/south). 
       - **Demand**: We must decide what "silence" implies. Options are:
         (a) Preservation of the conditional distribution within each row (i.e., within north and within south, the west/east ratios are preserved).
         (b) Preservation of the west/east margin (i.e., the overall probability of west and east remains 0.5).
       - **Requirement**: The rule must specify how to interpret silence. However, note that the requirement of invariance under refinement (point 3 above) may force a particular interpretation. For instance, if we split a cell in the north row, then preserving the conditional distribution within the north row would require that the update rule adjust the probabilities in the split cell appropriately. This suggests that option (a) (preserving conditional distributions) is more aligned with refinement invariance. But note: the case is controversial. We must decide whether this is non-negotiable or a camp preference.

  8. **Noise in the Channel**:
     - **Case 3**: The report arrives over a channel that is 80% accurate. This raises the issue of whether the update should be a mixture (e.g., with 80% weight on the report and 20% on the prior) and whether mixing commutes with the update. 
       - **Requirement**: The rule must account for the reliability of the channel. However, the user suggests that selection effects (like the channel only reaching assets in the northern half) should be handled by a separate component. Therefore, we might require that the rule itself is for a "clean" report and that channel reliability is handled by a wrapper that mixes the update with the prior (or by a separate Bayesian step). But note: the requirement of reduction to conditioning (point 5) must hold when the channel is 100% reliable and the report is factual. For a noisy channel, we might model the report as evidence about the true state and then update. However, the report is still a constraint. We must decide: is the rule for the constraint itself, or for the noisy observation of the constraint? The specification should be for the constraint. The noisy channel then becomes a separate update (a pre-processing step that turns a noisy report into a constraint? or a wrapper that uses the rule as a subroutine?).

  9. **Dynamic Coherence**:
     - **Case 6**: After updating on a conditional report, we learn with certainty that the antecedent is false, and then learn the report was fabricated. The rule must allow for subsequent updates that undo the effect of the constraint when we learn the constraint was based on false premises or was fabricated. 
       - **Requirement**: The rule should be dynamically coherent, meaning that the update should be representable as conditioning on some event in an enriched state space (so that later updates can condition on new events that may contradict the earlier ones). This is non-negotiable because the system must be able to revise past beliefs in light of new evidence.

  10. **Selection Effects**:
      - **Case 9**: A channel that only reaches assets in the northern half. Thus, receiving a report (or not) is evidence about the location (e.g., if the asset is in the south, you wouldn't get a report). Also, the report might be addressed to one asset among many. 
        - **Requirement**: The rule should not account for selection effects. That belongs to a separate component that models the channel. The rule is for updating on the constraint given that the report has been received and is about the asset.

  ### Interpretation of Reports

  The user raises a distinction:
  - The report as a constraint on the posterior (e.g., "your posterior probability of north must be 0.75").
  - The report as a conditional proposition (e.g., "if the asset is in the south, then the probability of east is 0.7", which might be interpreted as a proposition that can be conditioned on).

  The specification must state that the rule models the report as a constraint on the posterior. Why? Because the reports are given as constraints (e.g., "the odds are three to one that ..."). Moreover, the triviality results (showing that conditional probabilities cannot generally be the probabilities of conditional propositions) rule out the second reading in general. Therefore, the rule must update the prior to a posterior that satisfies the constraint, without necessarily interpreting the report as a proposition in the original state space.

  ### Non-negotiable vs. Camp Preferences

  **Non-negotiable** (from purpose and must-have cases):
  - Determinacy (1)
  - Robustness: Idempotence (2a), Order-independence and batching (2b)
