  5. **Continuity**: The rule is continuous in the prior and in the report (constraint) for fixed state space.
  6. **Reduction to Conditioning**: When the report pins a single state (i.e., constrains its posterior probability to 1), the rule reduces to conditioning on that state.
  7. **Handling Zero Antecedent**: For a report with an antecedent that has prior probability zero, the rule must still be defined. (We will specify: use the I-projection, but if the constraint is conditional on an impossible event, then the update is defined as the I-projection to the constraint. However, note that a constraint like "if A then P(B)=0.8" when P(A)=0: the constraint is vacuously satisfied by any posterior? Or we might interpret it as requiring that the conditional probability P(B|A)=0.8, which is undefined. We must define it as constraining the conditional probability, and if P(A)=0, then the constraint is automatically satisfied. Then the posterior equals the prior. Alternatively, for counterfactual reports, we might use imaging. We leave this as a non-negotiable that the rule must be defined, but the behavior may be to leave the prior unchanged? Or to shift to the nearest world? We require that the rule is the I-projection, which in this case would leave the prior unchanged because the constraint is already satisfied (since the conditional probability is not defined, but the constraint on the conditional probability is a constraint that only applies if the antecedent has positive probability). Therefore, we require: the rule is the I-projection, and if the constraint is not feasible (e.g., if the constraint requires a conditional probability for an event of probability zero) then the constraint is considered satisfied by any distribution? But the I-projection would then be the prior. This is acceptable.
  8. **Dynamic Coherence**: The update must be representable as conditioning in an enriched state space. (This is satisfied by the I-projection because it can be represented as conditioning on the event that the constraint holds in a space that includes a variable for the constraint. This is a known representation.)
  9. **Interpretation of Reports**: The rule models the report as a constraint on the posterior, not as a conditional proposition.
  10. **Form of the Rule**: The rule must be the I-projection (minimizing the Kullback-Leibler divergence D(posterior || prior)) of the original prior to the set of all constraints received so far (with duplicates removed).

  **Camp Preferences** (none, because the non-negotiables force the above rule)

  **Joint Satisfiability**: The requirements are jointly satisfiable by the I-projection (batch) rule.

  **The Most Excluding Requirement**: The requirement that the update is the I-projection of the original prior to the set of all constraints (batch update) excludes most rules that are sequential and not batch. It also excludes rules that minimize other divergences or maximize entropy without reference to the prior.

  ### How Standard Families Fare

  - **Conditioning on the most probable report**: This is not applicable because the report is a constraint, not an event.
  - **Jeffrey revision with rigidity**: This is the I-projection for a single constraint on a partition. It satisfies the non-negotiables for a single report, but not for multiple reports (unless done in batch). If done sequentially, it is not order-independent. Therefore, only if we do Jeffrey revision in batch for multiple constraints (which is the I-projection) does it work.
  - **Relative-entropy projection in each of its two directions**: 
      - I-projection (min D(posterior||prior)): This is our rule. It works.
      - M-projection (min D(prior||posterior)): This does not reduce to conditioning (it gives zeros where it shouldn't) and does not satisfy refinement invariance. Excluded.
  - **Maximum entropy subject to the constraint**: This maximizes entropy (minimizes D(posterior||uniform)) subject to the constraint. This does not use the prior and therefore does not reduce to conditioning (unless the prior is uniform) and is not continuous in the prior. Excluded.
  - **Imaging-style revision**: This is for counterfactuals. It might be used for case 8 (zero antecedent) but not for the general case. Our rule handles case 8 by leaving the prior unchanged (if the constraint is vacuously satisfied) or by the I-projection. Imaging is not required by the non-negotiables, so it is not used.
  - **Treatment of the report as a proposition about a conditional**: This is ruled out by the triviality results and the requirement that the report is a constraint.

  Therefore, the I-projection in batch is the only rule that satisfies all non-negotiable requirements.

  ### Final Requirements List

  We pair each requirement with the motivating case and why it has force.

  1. **Determinacy** (Motivation: Purpose; Force: Unattended operation requires one answer).
  2. **Idempotence** (Motivation: Case 4 - duplicate reports; Force: Avoids needing to track report history beyond the set).
  3. **Order-Independence and Batching** (Motivation: Case 5 - reports in different orders, and batches; Force: Robustness to network delays and batching).
  4. **Invariance under State Space Refinement** (Motivation: Case 7 - splitting a cell; Force: The grid may be refined by engineers arbitrarily).
  5. **Continuity** (Motivation: Avoid downstream pathologies; Force: Prevents exploitable jumps in beliefs).
  6. **Reduction to Conditioning** (Motivation: Case 1 - pinning a cell; Force: Basic sanity).
  7. **Handling Zero Antecedent** (Motivation: Case 8 - counterfactual report; Force: Must handle all reports gracefully).
  8. **Dynamic Coherence** (Motivation: Case 6 - learning the report was fabricated; Force: Beliefs must be revisable without logical inconsistency).
  9. **Constraint Interpretation** (Motivation: The distinction in the question; Force: Triviality results and the nature of the reports).
  10. **I-projection Batch Rule** (Motivation: All cases, especially Judy Benjamin (case 2) and multiple reports; Force: The non-negotiable requirements together force this rule).

  The rule is: 
     - Maintain the original prior and the set of constraints (with duplicates removed) received so far.
     - The posterior is the distribution that minimizes the Kullback-Leibler divergence D(posterior || prior) subject to satisfying all constraints.

  This rule meets all the requirements.
answer: |-
  Based on your requirements and test cases, here is a requirements list for the belief-revision rule, structured to address your core purpose (determinacy, robustness, modeling indifference, and pathology avoidance) and tested against your specific scenarios. Requirements are categorized as **non-negotiable** (driven by system constraints) or **camp preference** (reflecting philosophical/optimization choices). Each includes the motivating case and its rationale.

  ---

  ### **Non-Negotiable Requirements**  
  *Essential for deployed system integrity*

  1. **Determinacy**  
     - **Requirement**: The rule must output a unique posterior for any valid prior and report.  
     - **Motivating Case**: General purpose (unattended operation).  
     - **Force**: Avoids manual tie-breaking; critical for automation.  
     - *Excludes*: Rules with multiple valid posteriors (e.g., some divergence minimizations without uniqueness guarantees).

  2. **Reduction to Bayesian Conditioning**  
     - **Requirement**: When a report pins a single cell (factual evidence), the rule must match Bayesian conditioning.  
     - **Motivating Case**: Case 1 (single-cell pinning).  
     - **Force**: Baseline sanity; ensures consistency with probability axioms.  
     - *Excludes*: Rules that generalize Jeffrey revision but fail this edge case.

  3. **Idempotence**  
     - **Requirement**: Applying the same report twice must yield the same posterior as applying it once.  
     - **Motivating Case**: Case 4 (duplicated reports).  
     - **Force**: Robustness to network duplicates or retransmissions.  
     - *Excludes*: Rules where repeated application amplifies changes (e.g., some additive updates).

  4. **Order-Independence & Batchability**  
     - **Requirement**: The posterior must be invariant to report order and admit a batch equivalent (commutativity).  
     - **Motivating Case**: Case 5 (reordered reports), Case 6 (coherent reversal).  
     - **Force**: Robustness to network delays/batching; avoids path dependence.  
     - *Excludes*: Non-commutative rules (e.g., sequential Jeffrey updates on correlated partitions).

  5. **State-Space Refinement Invariance**  
     - **Requirement**: The posterior over coarse cells must be unchanged if a cell is split without altering prior probabilities or report semantics.  
     - **Motivating Case**: Case 7 (cell splitting).  
     - **Force**: Indifference to modeling choices (grid granularity).  
     - *Excludes*: Rules sensitive to "hidden" state-space structure (e.g., some imaging methods).

  6. **Dynamic Coherence**  
     - **Requirement**: The rule must allow later factual updates (e.g., "antecedent is false") to override earlier constraint-based updates.  
     - **Motivating Case**: Case 6 (fabricated report reversal).  
     - **Force**: Beliefs must be corrigible; avoids irreversible commitments.  
     - *Excludes*: Rules that "lock in" constraints (e.g., some propositional interpretations).

  7. **Constraint Semantics (Non-Propositional)**  
     - **Requirement**: Reports must be interpreted as direct constraints on the posterior (e.g., "P(north) = 0.75"), not as propositions to condition on.  
     - **Motivating Case**: Distinction in query; Case 2 (Judy Benjamin).  
     - **Force**: Triviality results (Lewis, etc.) show conditional probabilities cannot map to propositions; avoids inconsistency.  
     - *Excludes*: Propositional treatments (e.g., conditioning on "if A then B").

  8. **Continuity**  
     - **Requirement**: The posterior must vary continuously with prior probabilities and report parameters.  
     - **Motivating Case**: General purpose (pathology avoidance).  
     - **Force**: Prevents exploitable discontinuities by downstream decision rules.  
     - *Excludes*: Rules with threshold effects (e.g., some lexicographic updates).

  ---

  ### **Camp Preferences**  
  *Reflecting optimization choices, not core adequacy*

  9. **Minimal Change via I-Projection**  
     - **Requirement**: Prefer minimizing Kullback-Leibler divergence *from prior to posterior* (I-projection).  
     - **Motivating Case**: Case 2 (Judy Benjamin), Case 8 (zero antecedent).  
     - **Force**: Uniquely satisfies refinement invariance (6) and dynamic coherence (7); reduces to Jeffrey revision.  
     - *Trade-off*: Excludes M-projection (reverse KL) and entropy maximization.

  10. **Silence as Conditional Preservation**  
      - **Requirement**: When a report constrains one partition (e.g., N/S) and is silent on another (e.g., E/W), preserve conditional probabilities within constrained blocks.  
      - **Motivating Case**: Case 2 (Judy Benjamin), Case 9 (selection effects).  
      - **Force**: Alignment with refinement invariance (5); avoids arbitrary margin preservation.  
      - *Trade-off*: Excludes "minimum cross-entropy" with fixed margins.

  11. **Handling Zero-Antecedent Reports**  
      - **Requirement**: Prefer "imaging-like" shifts (e.g., world redistribution) for reports with P(antecedent) = 0.  
      - **Motivating Case**: Case 8 (counterfactual bridge report).  
      - **Force**: Avoids undefined conditioning; consistent with minimal change.  
      - *Trade-off*: Excludes ignoring such reports or treating them as vacuous.

  ---

  ### **Joint Satisfiability and Conflicts**
  - **Satisfiable Core**: Non-negotiables 1–8 are jointly satisfiable by **I-projection (Jeffrey revision with rigidity)**.  
    - *Why*: I-projection is deterministic (1), reduces to conditioning (2), idempotent (3), order-independent in batch mode (4), refinement-invariant (5), dynamically coherent via enrichment (6), constraint-based (7), and continuous (8).  
  - **Key Conflict**:  
    - **Order-independence (4)** vs. **Sequential Updates**: Order-independence *requires* batch I-projection over all reports. Sequential I-projections (e.g., Jeffrey updates) are not order-independent for arbitrary constraints.  
    - **Resolution**: Implement batched I-projection over the entire report history (non-negotiable).  
  - **Most Excluding Requirement**:  
    - **State-Space Refinement Invariance (5)** excludes:  
      - M-projection (alters coarse posteriors after refinement).  
      - Entropy maximization (overfits to uniform priors).  
      - Margin preservation in Judy Benjamin (violates conditional preservation).

  ---

  ### **Standard Rule Families: Quick Assessment**
  | **Rule Family**               | **Meets Non-Negotiables?** | **Key Shortfall**                                  |
  |-------------------------------|----------------------------|----------------------------------------------------|
  | **I-projection (Jeffrey)**    | Yes (batched)              | Sequential form fails order-independence (4).      |
  | **M-projection**              | No                         | Fails refinement invariance (5) and reduction (2). |
  | **MaxEnt**                    | No                         | Ignores prior; fails reduction (2), continuity (8).|
  | **Conditioning on report**    | No                         | Fails constraint semantics (7); triviality issues. |
  | **Imaging**                   | Partial                    | Handles Case 8 but fails refinement (5), batch (4).|
  | **Hybrid (e.g., Galles-Pearl)**| Partial                   | May fail dynamic coherence (6), batchability (4).  |

  ---

  ### **Recommendation**
  - **Adopt batched I-projection** as the core rule:  
    - Solves Cases 1–7, 9 via rigidity (conditional preservation).  
    - Handles Case 8 by extending to KL-minimization over "shifted" priors.  
  - **Reject propositional interpretations**: They violate triviality constraints (non-negotiable 7).  
  - **Separate selection effects**: Case 9 (channel reliability) belongs to a channel-modeling component, not the belief-revision rule.  

  This specification ensures adequacy for your deployed system while isolating philosophical choices (e.g., I-projection over MaxEnt) to explicit, justified preferences. The batched I-projection uniquely satisfies all non-negotiables and is the only rule surviving your test cases.
