  Okay, let me start by unpacking the user's problem. They're frustrated with a recurring pattern in arguments where their opponents slide between different notions of truth—utility, consensus, long-run convergence, and practical necessity. The user wants to name this pattern and understand its structure.

  First, I need to identify the core issue. The user mentioned three cases: a friend justifying belief based on usefulness, a colleague conflating current consensus with ideal agreement, and someone equating practical presuppositions with truth. The key is that the same term "truth" is used to cover distinct concepts, and the speaker shifts between them when challenged.

  Looking at philosophical traditions, pragmatism comes to mind. William James emphasized the practical utility of beliefs, while C.S. Peirce focused on the ideal end of inquiry. The user's cases (a) and (b) map to James and Peirce respectively. Case (c) resembles Kantian or Wittgensteinian ideas about necessary presuppositions for action. Case (d) seems like a sociological take where truth is defined by group consensus.

  The user wants a way to dissect these during arguments. They need a question that forces commitment to one definition. Possible axes include: temporal (now vs. forever), scope (individual vs. group), and modality (contingent vs. necessary). The critical distinction is between the justification of holding a belief (practical) and the truth condition itself (factual).

  I recall that pragmatism faced criticism for conflating justification with truth. Susan Haack's "innocent realist" critique might be relevant here. The user might benefit from understanding that the slide between these concepts avoids addressing whether the belief corresponds to reality beyond its utility or necessity.

  For a mid-argument question, asking, "Is this belief true because it's useful/necessary, or would it still be true even if it weren't?" could force clarification. Alternatively, inquiring about truth conditions versus reasons for acceptance might expose the conflation.

  The user also asks about other possible members of this family. A group-utility version or a non-ideal long-run inquiry could exist. Additionally, cultural or institutional definitions of truth might fit here. It's important to mention these to give a comprehensive view.

  Underlying the user's frustration is a desire for conceptual clarity and effective argumentation tools. They might be seeking not just labels but a framework to navigate these discussions confidently. Recognizing that these conflations serve rhetorical purposes—like avoiding accountability or justifying power—could also be valuable for the user.
answer: |-
  This is a brilliantly observed pattern, and you're right that it's more than simple equivocation. You've identified a family of **pragmatic conceptions of truth** that get conflated under the banner of "what works" or "what's true for us," and the slide between them is a common rhetorical tactic to evade criticism. Here's the breakdown:

  1.  **The Philosophical Tradition & Your Cases:**
      *   **William James (Your "a"):** James is the pragmatist most associated with the **cash-value** or **immediate practical utility** of belief. For James, truth *is* what "works" in the sense of being **satisfying, expedient, fruitful, or conducive to successful living** *right now* for the individual or group. "It works for me" is pure Jamesian pragmatism. Truth is made, not found. He was comfortable with the idea that something could be "true for me" but "false for you" if it worked differently for each. Truth *can* change.
      *   **C.S. Peirce (Your "b"):** Peirce defined truth as the **final opinion** that **all investigators would agree upon** if inquiry were pushed **indefinitely far into the future** with **all relevant evidence**. This is the **ideal consensus view** or the **long-run convergence view**. Truth is independent of what any individual thinks *now* (including yourself) and is potentially unknowable in the present. It's a regulative ideal, not a present possession. Truth is fixed and unchanging.
      *   **Your "d" (Current Group Consensus/Authority):** This is a **sociological or institutional** view, often unstated. Truth is defined as **what the relevant group (this room, this field, this institution) currently accepts or authorizes**. It conflates truth with **social power or institutional authority**. It lacks the forward-looking idealization of Peirce and focuses on the *de facto* present agreement. Truth *can* change as the group changes.
      *   **Your "c" (Practical Presupposition):** This draws from thinkers like Kant (conditions for the possibility of experience) or later Wittgenstein (framework propositions). It argues that certain beliefs (e.g., external world, free will) are **necessary presuppositions for coherent thought or action**. We *must* act *as if* they are true to function. This is less a theory of truth *itself* and more a theory of **inescapable commitment** or **framework propositions**. Their "truth" is justified by their **functional indispensability**, not correspondence or utility in James's sense.

  2.  **The Conflation & The Slide:**
      You've perfectly described the dynamic: **Rhetorical Pragmatism** or the **Pragmatic Conflation Gambit**.
      *   The speaker uses the *slogan* of pragmatism ("truth is what works," "true for us") which sounds appealingly practical.
      *   Under pressure, they slide between the *specific conceptions* within pragmatism:
          *   When challenged on correspondence/facts/evidence, they retreat to *James* ("It works for me!") or *Practical Presupposition* ("We *have* to assume it!").
          *   When challenged on subjectivity/relativism ("What if it works for me but not you?"), they leap to *Peirce* ("No, no, I mean the *ultimate* truth everyone *would* agree on!") or *Group Consensus* ("It's the accepted view here!").
          *   When challenged on the arbitrariness of the current group view, they slide back to *Peirce* (implying the group view *is* the long-run truth) or *James* (implying it's currently useful).
      *   **Why it's not *just* equivocation:** Each conception *could* be held consistently on its own. The problem is the *opportunistic switching* between them *within a single argument* to deflect specific objections. The speaker isn't necessarily committed to any *one* view; they are committed to *defending the belief* using whichever pragmatic justification fits the moment. The breakage is **inconsistency in the underlying theory of truth being appealed to**.

  3.  **The Axes of Difference (The Carving):**
      These conceptions differ along several crucial dimensions:
      *   **Temporal Focus:** Immediate Utility (James/Now) vs. Long-Run Convergence (Peirce/Future-Ideal) vs. Current Consensus (d/Now) vs. Timeless Presupposition (c/Timeless?).
      *   **Scope:** Individual (James) vs. Group (d) vs. Universal Community of Inquirers (Peirce) vs. Universal Human Condition (c).
      *   **Truth Condition:** Satisfying Consequences (James) vs. Ultimate Consensus (Peirce) vs. Current Agreement (d) vs. Functional Necessity (c).
      *   **Relativity:** Highly Relative (James-individual) vs. Contextually Relative (d-group) vs. Absolutely Non-Relative (Peirce, c-in-practice).
      *   **Knowability:** Potentially Known Now (James, d, c-as-presupposed) vs. Potentially Unknowable Now (Peirce).
      *   **Mutability:** Mutable (James, d) vs. Immutable (Peirce) vs. Fixed Framework (c).
      *   **Justification vs. Truth:** Blurs the line (all, but especially James & d).

  4.  **The Crucial Distinction (What Actually Matters):**
      The most fundamental split, highlighted by the James/Peirce feud, is between:
      *   **Truth as Present Justification/Happiness/Utility:** Beliefs are *true* because they *work well for someone/something right now* (James, d leans here, c justifies commitment).
      *   **Truth as Ideal or Necessary Condition:** Truth is a *future ideal state* (Peirce) or a *necessary framework* (c) *independent* of whether holding the belief *now* is pleasant or useful. Something could be ultimately true (Peirce) but painful to believe now, or a necessary presupposition (c) even if inconvenient.

  5.  **Other Members of the Family:**
      Yes, you've identified key ones, but here are more:
      *   **Group Utility:** Truth is what benefits the *survival, cohesion, or flourishing of a specific group* (tribe, nation, corporation). Similar to James, but scaled up. (Your case (d) often implies this).
      *   **Non-Ideal Long-Run:** Truth is what *we specifically* (our culture, scientific community) *will likely converge on*, acknowledging limitations, not a perfect ideal. (A weaker Peirce).
      *   **Instrumentalism:** Truth of a theory/model is solely its *predictive or instrumental success* in a specific domain, without commitment to its reality (common in science). Related to James but more focused.
      *   **Coherentism:** Truth is coherence within a *specific system of beliefs* (a group's worldview, a scientific paradigm). Related to (d) but can be more systematic.

  6.  **The Killer Mid-Argument Question:**
      To force commitment and expose the slide, ask this:
      > **"Is this belief true *because* it has good effects/is necessary for action/is accepted here *right now*, OR would it *still* be true even if it *didn't* have those good effects/wasn't necessary for action/wasn't accepted here, because it describes how things ultimately are (or must be presupposed) independently of those effects?"**
      *   **Why it works:**
          *   It directly forces the speaker to choose between the *present/practical justification* (James, d, the functional aspect of c) and the *ideal/necessary condition* conception (Peirce, the presuppositional aspect of c).
          *   It highlights the core tension: Is truth *constituted by* usefulness/necessity/acceptance, or is usefulness/necessity/acceptance merely a *reason to believe* (or act *as if*) something is true for other reasons?
          *   It makes explicit the difference between *why we hold the belief* and *what makes the belief true*.
          *   The speaker can't easily slide; they have to pick a lane. If they pick the first part, you can press on relativity ("True just for you/us now?"). If they pick the second part, you can ask about evidence for *that* ultimate/necessary truth, separating it from its current utility.

  **In Summary:** You've encountered the **Pragmatic Conflation Gambit**, sliding opportunistically between **Jamesian Utility**, **Peircean Convergence**, **Group Consensus/Authority**, and **Practical Presupposition**. The core axes are **Temporal Focus** (Now vs. Future-Ideal), **Scope** (Individual/Group vs. Universal), and crucially, whether **Truth is Constituted by Practical Consequences/Necessity or Independent of Them**. Use the **"Because or Despite?"** question to force a commitment and clarify which conception is actually doing the work. This pattern exploits the inherent ambiguities within pragmatism to shield beliefs from criticism by always having a ready-made, shifting justification labeled "what works."
