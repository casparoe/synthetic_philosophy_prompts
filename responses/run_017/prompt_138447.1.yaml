answer: |-
  ### Question: Revealed Preference, Utility, and the Introduction of a New Good (1000 words max)

  Consider a household whose consumption choices over a fixed set of goods \( \mathbf{x} = (x_1, x_2, ..., x_n) \) are consistently observed to satisfy the Generalized Axiom of Revealed Preference (GARP) across many budget sets. We recover a utility function \( u(\mathbf{x}) \) rationalizing these choices, unique up to positive monotonic transformations.  

  At time \( t \), a genuinely **new good** \( y \) (with no substitutes or complements in \( \mathbf{x} \)) is introduced. The household purchases \( y > 0 \) at price \( p_y \) when their budget set expands to include bundles \( (\mathbf{x}, y) \). All previously available bundles \( (\mathbf{x}, 0) \) remain affordable.  

  **Part A (Welfare Measurement):**  
  Explain why we can unambiguously conclude the household is *better off* with access to \( y \), but why estimating the *magnitude* of this welfare gain (e.g., an Equivalent Variation or Compensating Variation) requires going beyond strict revealed preference analysis. Why does the observed purchase of \( y \) alone fail to pin down a specific welfare measure?  

  **Part B (The Meaning of Utility):**  
  The household volunteers the statement: "Good \( y \) has improved my life far more than the money I spent on it suggests." Discuss the status of this statement within the revealed preference framework. Does it challenge the recovered \( u(\mathbf{x}) \)? Can it be incorporated into the welfare analysis from Part A? What does this reveal about the interpretation of "utility" – is it merely a representation of choices, a latent psychological state, or something else?  

  **Part C (Synthesis):**  
  What would need to be true about preferences, the nature of \( y \), or our methodology for the estimated welfare gain from introducing \( y \) to be considered a "genuine measurement" rather than an artifact of our modelling assumptions?  

  ---

  ### Model Answer (700 words)

  **Part A: Welfare Measurement**  
  Revealed preference definitively shows the household is better off because it *chose* a bundle containing \( y \) over all previously available bundles \( (\mathbf{x}, 0) \), which remain affordable. This satisfies the weak condition for strict preference: the chosen bundle was previously feasible but never chosen, implying \( (\mathbf{x}, y) \succ (\mathbf{x}, 0) \) for some \( \mathbf{x} \).  

  However, quantifying the welfare gain (e.g., Equivalent Variation, EV: the income compensation needed *without* \( y \) to achieve the utility level attained *with* \( y \)) is underdetermined. Revealed preference only tells us that \( (\mathbf{x}, y) \) is preferred to all *observed* alternatives. To compute EV, we need to know the household’s willingness to pay (WTP) for \( y \) *at utility levels never observed* – specifically, at the higher utility level achieved with \( y \) access. Our data only shows one point on the (unobservable) Hicksian demand curve for \( y \): the point where \( y \) is actually purchased. The entire rest of the curve, especially its shape at higher utility levels, must be *assumed* (e.g., constant marginal utility, specific functional form like Cobb-Douglas). Different assumptions (e.g., \( y \) is essential vs. luxury) yield radically different EV estimates. The minimal welfare gain is simply the expenditure on \( y \) (if \( y \) is purchased, WTP ≥ expenditure), but the *maximal* gain is unbounded without further assumptions. Strict revealed preference provides bounds, not a point estimate.

  **Part B: The Meaning of Utility and the Household's Statement**  
  Within the strict revealed preference framework, the household's statement is **inadmissible evidence**. The framework admits *only* choice behavior under budget constraints as valid data. The statement is a verbal report about subjective experience, not a choice. It cannot directly challenge the recovered \( u(\mathbf{x}) \) because \( u(\mathbf{x}) \) is *defined* solely as a numerical representation of the *pre-existing choice pattern over \mathbf{x}*. It says nothing about preferences involving \( y \) or subjective intensity.  

  The statement highlights a core ambiguity in the meaning of "utility":  
  1.  **As a Representation of Choice:** In the revealed preference context pre-\( y \), \( u(\mathbf{x}) \) is *only* a convenient numerical label for the observed ranking of bundles. It is "ordinal" and has no independent psychological content. "Maximizing utility" just means "choosing consistently".  
  2.  **As a Latent State:** The household's statement treats "utility" as a cardinal, experiential state ("improved my life"). This interpretation suggests utility is a real magnitude existing independently of choices, which choices merely *reveal imperfectly*.  

  The framework cannot reconcile these interpretations. Revealed preference is agnostic about cardinal utility. The statement suggests the household perceives a large *cardinal* gain, but revealed preference only identifies an *ordinal* improvement (access to \( y \) is better than no access). The statement cannot be incorporated into standard revealed preference welfare analysis without abandoning its core tenet (choices are the only data).

  **Part C: Genuine Measurement vs. Modelling Artefact**  
  For the estimated welfare gain (EV) to be a "genuine measurement" rather than a modelling artifact, we would need:  

  1.  **Cardinal Utility Reality:** Utility must be a cardinally measurable psychological state (e.g., hedonic experience), not just an ordinal representation.  
  2.  **Stable, Quantifiable Preferences Involving \( y \):** Preferences must exhibit sufficient structure (e.g., constant marginal utility of income, homotheticity, or known separability involving \( y \)) that allows extrapolation from the single observed \( y \)-purchase to the entire Hicksian demand curve. Crucially, this structure must be *validated independently of the choice data used to estimate it* – perhaps through controlled experiments eliciting WTP at different utility levels, neuroscientific evidence, or universally accepted functional forms grounded in psychology. Without independent validation, the EV is just an assumption-laden calculation.  
  3.  **Incorporating Non-Choice Data (Optional but Relevant):** If statements like the household's are admitted, a methodology for integrating them reliably into preference estimation (e.g., structural models of subjective well-being) would be needed.  

  Absent these conditions, the specific EV figure is primarily an artifact of the modeller's chosen functional form and assumptions about unobserved preferences. Revealed preference provides the ordinal ranking and bounds; the cardinal magnitude requires strong, untestable (within the framework) assumptions.

  ---

  ### Marking Scheme (Total: 20 Marks)

  | **Move**                                                                 | **Marks** | **Key Pitfall (Strong Candidates Avoid)**                                |
  | :----------------------------------------------------------------------- | :-------- | :----------------------------------------------------------------------- |
  | **1. Correctly identifies unambiguous welfare improvement** (Part A):    | 4         | Missing link between "old bundles affordable but not chosen" and strict preference. |
  | **2. Explains underdetermination of welfare magnitude (EV/CV)** (Part A):| 5         | Stating bounds exist but not explaining *why* (need to extrapolate Hicksian demand for \( y \) at unobserved utility levels). |
  | **3. Treats household statement as inadmissible in RP framework & distinguishes ordinal vs. cardinal utility** (Part B): | 5         | Claiming the statement invalidates RP or can be naively incorporated. Confusing ordinal choice-representation with cardinal experience. |
  | **4A. (A-Grade) Articulates conditions for "genuine measurement"** (Part C): Cardinal reality, stable/validated preference structure, independent evidence. | 4         | Vagueness on *how* assumptions could be validated (e.g., "better models" isn't enough). |
  | **4B. (B-Grade) Only restates underdetermination** (Part C): Welfare magnitude depends on untestable assumptions. | (Max 2)   | Not connecting underdetermination to the *meaning* of utility as real vs. artefact. |
  | **5. Synthesis & Clarity**: Logical flow, precise terminology, addresses all parts. | 2         | Disjointed responses, conflating parts A/B/C, misuse of terms (e.g., "utility is cardinal in RP"). |

  **Grade Boundaries:**  
  *   **A (17-20):** Hits Moves 1, 2, 3, **4A**, and 5. Explicitly links the underdetermination in Part A to the conceptual ambiguity of utility in Part B and outlines specific conditions for measurement in Part C.  
  *   **B (13-16):** Hits Moves 1, 2, 3, **4B**, and 5. Clearly explains the welfare bounds and the ordinal/cardinal distinction but does not articulate what makes welfare magnitude *genuine* beyond restating its dependence on assumptions.  
  *   **C (10-12):** Identifies welfare improvement (Move 1) and some underdetermination (partial Move 2/4B) but struggles with Move 3 (meaning of utility/statement) or synthesis.  
  *   **D/F (<10):** Major omissions/misunderstandings (e.g., welfare improvement not guaranteed, utility always cardinal, statement refutes RP).
