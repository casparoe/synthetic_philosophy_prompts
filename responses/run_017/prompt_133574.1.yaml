  First, I need to verify if existing terms fit. "Self-sealing belief" is close but usually implies vagueness or ad hoc adjustments, not a definitive forbidden test. "Self-deterrence" captures the paralysis but misses the epistemic trap. Game theory’s "unobservable off-equilibrium actions" is too narrow—it’s about model constraints, not lived agent dilemmas. 

  Ah! The core is the *actionable unfalsifiability*: the belief mandates inaction that prevents its disconfirmation, while action risks doom. The "planted-forest" layer adds strategic deception, but that’s a subtype. The minimal conditions: (1) a claim with a definitive falsifying act, (2) the act is uniquely dangerous iff the claim is true, (3) agents know this, creating paralysis. 

  For non-instances: A self-fulfilling prophecy (e.g., bank run) *requires* action to falsify it, but the act isn’t forbidden—it’s just destabilizing. Precautionary principles (e.g., asteroid deflection) lack the "only test is forbidden" structure; we can observe near-misses. 

  Testing this is thorny. Indirect methods (anthropic shadow, manipulated evidence forensics) help but don’t resolve the core dilemma. The user’s "carving" demand is spot-on—this needs framing as a *dynamic*, not a static belief. Hence "Forbidden Test Dilemma" as the coinage, emphasizing the catch-22. 

