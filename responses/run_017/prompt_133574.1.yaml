answer: |-
  Based on your precise description and the distinctions you've already considered, there is **no single established term** capturing the *exact* phenomenon you've outlined – particularly the core feature of a **definitively falsifiable hypothesis whose *only* possible falsification requires performing an act that is catastrophically costly *if and only if* the hypothesis is true, *and* where agents are aware of this bind.**

  Here's the conceptual carving, a proposed term, its definition, boundaries, and how to test for it:

  ---

  ### 1. **The Concept & Proposed Term**
  *   **Term:** **Forbidden Test Dilemma (FTD)**
  *   **Definition:** A state of belief (often collective) where:
      *   **(A)** A specific hypothesis (`H`) makes a definite, falsifiable claim about the state of the world (e.g., "The cosmos is filled with hostile civilizations," "The adversary is malign and opportunistic").
      *   **(B)** The *only conceivable, direct test* capable of falsifying `H` is a specific, high-stakes action (`A`) (e.g., "Announce presence," "Stand down unilaterally").
      *   **(C)** Performing action `A` carries catastrophic costs *if and only if* `H` is true. If `H` is false, performing `A` is typically low-cost or beneficial.
      *   **(D)** Agents holding the belief are aware of conditions (A), (B), and (C). This awareness creates a rational paralysis preventing the performance of `A`.
  *   **Core Mechanism:** The hypothesis *itself* prescribes the conditions for its potential falsification (`A`), but simultaneously identifies `A` as a uniquely dangerous act *conditional on `H` being true*. Knowledge of this bind rationally compels inaction (`~A`), ensuring `H` remains empirically unfalsified regardless of its actual truth value. The observed state (silence, sustained mobilization) is consistent with both `H` being true *and* `H` being false but universally believed due to the FTD.

  ---

  ### 2. **Distinguishing from Nearest Neighbors**
  *   **Self-Fulfilling Prophecy (SFP):** *Action based on belief causes belief to become true.* FTD differs: Inaction (`~A`) *prevents falsification* of `H`, but does not *cause* `H` to become true. `H` might be false, but remains untested. SFPs require action (e.g., a bank run *causes* the bank to fail); FTD requires rational *inaction* to avoid potential catastrophe. The FTD *sustains* belief, it doesn't necessarily *create* the truth condition.
  *   **Self-Defeating/Self-Effacing Prediction:** *Acting on the prediction/preventative measure prevents the predicted outcome.* Similar to SFP, this involves action changing the outcome. FTD is about *inaction preventing knowledge acquisition*, not necessarily changing the underlying state. The predicted catastrophe in FTD *might* still happen independently of `A` or `~A`; the point is we can't safely check.
  *   **Equilibria with Unobservable Off-Path Beliefs (Game Theory):** While the Dark Forest is often modeled as an equilibrium (e.g., Mutual Assured Destruction), the FTD focuses on the *epistemic trap* for agents *within* that equilibrium. Game theory models *predict* the outcome (silence, deterrence) given beliefs and payoffs; FTD explains *why* those specific beliefs are rationally *unfalsifiable* for the agents themselves due to the structure of the test (`A`). The "unobservable off-path" aspect is a *component* of the FTD, but the FTD emphasizes the *actionable* and *costly* nature of the test and the agents' awareness.
  *   **Precautionary Principle / Untestable Precaution:** Focuses on justifying action/inaction under uncertainty to avoid potential catastrophe, often without a *definitive single test*. FTD specifies a *precise, forbidden test* (`A`). Precaution is often justified by the *possibility* of harm; FTD arises when there's a *definitive but dangerous way to rule out* the need for precaution.
  *   **Selection Effects (Anthropic Shadow):** Explains *why we don't observe certain catastrophes* (e.g., we exist because past existential risks didn't wipe us out). FTD is an *active, strategic* reason *why agents choose not to generate the observable data* (`A` or its consequences). Anthropic shadow is observer-relative; FTD is agent-relative and driven by rational fear. The silence in the Dark Forest is a *result* of FTDs, not solely an anthropic selection effect.

  **Gained by "Forbidden Test Dilemma":** Precision on the *structure of the test* (definitive but forbidden), the *conditional cost* (catastrophic iff H true), and the *agent awareness* causing rational paralysis. It highlights the dynamic preventing knowledge acquisition.

  **Lost:** Connection to specific existing formalisms (though compatible with them). It's a more phenomenological/strategic-epistemic label.

  ---

  ### 3. **Minimal Conditions**
  For an FTD to exist:
  1.  **Definitive Falsifiable Hypothesis (`H`):** A clear claim about the world that is, in principle, testable.
  2.  **Singular Forbidden Test (`A`):** One specific action (`A`) is the *only conceivable direct means* to falsify `H`.
  3.  **Conditional Catastrophic Cost:** Performing `A` results in catastrophe *if and only if* `H` is true. If `H` is false, `A` is safe/beneficial.
  4.  **Agent Awareness:** Agents holding `H` understand points 1-3.
  5.  **Rational Paralysis:** Due to 4, agents rationally choose not to perform `A`, preventing the falsification of `H`.

  ---

  ### 4. **Cases That Look Like Instances But Are Not**
  1.  **The Boy Who Cried Wolf (False Alarms Undermining Credibility):** While silence (not crying wolf) might prevent exposure if a wolf *were* present, crying wolf (`A`) is *not* the *only* test for the presence of wolves. Observation, tracks, etc., are possible. More importantly, crying wolf has high cost (lost credibility/livestock) *even if no wolf is present eventually* – violating condition (C) that `A` is only catastrophically costly *iff `H` is true*. The cost here is largely independent of `H`.
  2.  **Vaccine Hesitancy (Untestable Precaution / Misplaced Risk Aversion):** The belief ("Vaccines are dangerous") *can* be falsified by large-scale studies and data (`A` = conducting/vetting studies), which is performed by others. The hesitant individual isn't performing a forbidden test themselves; they are rejecting available evidence. The *cost* of getting vaccinated isn't uniquely linked to the *falsification act*; it's linked to the *preventative act* itself. There is no singular `A` that *only the believer* must perform to falsify it that carries conditional catastrophic cost.

  ---

  ### 5. **Non-Question-Begging Tests for the FTD**
  Testing for the *existence of an FTD* (rather than the truth of `H`) is challenging but possible by looking for its *signatures* and *consequences*:
  1.  **Identify the Hypothesized `A`:** Look for evidence that agents explicitly or implicitly identify a specific, dangerous action as the "only way to know for sure" if `H` is false. (e.g., Military doctrine discussing why stand-down is the *only* true test of intent but is unacceptable).
  2.  **Evidence of Awareness:** Find statements, documents, or strategic reasoning demonstrating agents understand the bind: performing `A` would answer the question but is too dangerous to attempt *specifically because* `H` might be true. This distinguishes FTD from simple risk aversion or dogma.
  3.  **Observe Rational Paralysis:** Document consistent avoidance of `A` despite high stakes attached to knowing the truth of `H`, *and* the absence of viable alternative tests being pursued or trusted. Show that efforts focus on mitigating risks *presuming `H` is true* rather than testing `H`.
  4.  **Detect "Planted Forest" Manipulation (Variant Test):** Look for evidence that apparent "confirmations" of `H` (e.g., ambiguous attacks, mysterious signals) are:
      *   Artificially generated or amplified.
      *   Attributable to actors who benefit from others believing `H`.
      *   Occurring in contexts where direct testing (`A`) remains rationally forbidden for the targets.
      *   (This tests the *false-but-stable* variant, proving the FTD structure is being exploited).
  5.  **Anthropic/Historical Shadow Analysis (Indirect):** Examine historical near-misses or low-probability survivals. If survival seems implausibly fortunate *unless* many others were eliminated for performing `A`-like actions (which we cannot observe because they're gone), it provides *indirect*, probabilistic evidence consistent with `H` being true *within* an FTD structure. However, this doesn't prove the FTD exists currently, only that the outcome pattern fits.

  **Key Point:** Testing focuses on identifying the *structure of belief and the strategic paralysis* (`H`, `A`, awareness, inaction), and evidence of manipulation sustaining it, rather than trying to directly prove/disprove `H` itself (which is the FTD's core epistemic trap).

  ---

  ### Why "Forbidden Test Dilemma" Fits Your Cases
  *   **Dark Forest:** `H` = Sky is dangerous. `A` = Announce presence. Cost of `A` iff `H` = Destruction. Awareness = Clear in the fiction. Paralysis = Silence. *Planted Forest Variant:* A civilization *pretending* to be a hunter fires a "warning shot" (strikes a decoy/weak target) to amplify fear of `H`, reinforcing the paralysis (`~A`).
  *   **Deterrence:** `H` = Adversary is malign/opportunistic. `A` = Unilaterally stand down/disarm significantly. Cost of `A` iff `H` = Invasion/defeat. Awareness = Fundamental to deterrence theory. Paralysis = Sustained mobilization. *Planted Forest Variant:* A state stages a false flag attack or exaggerates a threat (manufactures evidence for `H`) to justify its own posture or alliances, deepening the adversary's FTD.
  *   **Your Security Context:** This structure perfectly captures the paralysis and potential for manipulation in assessing ambiguous threats where the "smoking gun" test is prohibitively dangerous.

  This carving provides the precision you sought: actionable unfalsifiability via a definitive but self-forbidden test, driven by rational fear, distinct from related concepts, with identifiable boundaries and strategies for detection. Use **Forbidden Test Dilemma (FTD)** for your chapter.
