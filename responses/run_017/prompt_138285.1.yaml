  Okay, let me approach this systematically. The user needs a sophisticated exam question that pushes students beyond mechanical application of reference-class forecasting. The core challenge is designing a prompt where simply reciting the outside view steps only earns half credit, forcing engagement with deeper methodological tensions.

  First, I consider the key elements the user emphasized:
  - The matching ladder concept with three rungs of reference classes
  - The coroner's reference class problem
  - Reflexivity concerns when forecasts influence behavior
  - Epistemic modesty in practical application
  - Avoiding reliance on historical hindsight

  The 1938 British India scenario works well as it presents genuine uncertainty while allowing multiple plausible reference classes. I structure the question around a single unified prompt to prevent checklist thinking, followed by one clarifying instruction about disregarding actual outcomes.

  For the marking scheme, I identify five 4-point criteria:
  1) Explicitly analyzing all three rungs of the matching ladder
  2) Diagnosing the coroner's reference class bias
  3) Addressing reflexivity's challenge to base rates
  4) Articulating what epistemic modesty demands
  5) Synthesizing these into a coherent methodological stance

  Each criterion includes common pitfalls - like students noticing selection effects but not quantifying their impact, or treating reflexivity as a total refutation rather than a complication. The model answer demonstrates handling all layers: showing how each reference class compromises different values (precision vs. stability), explaining why "empire" definitions bury survivorship bias, and arguing that epistemic modesty means qualifying conclusions rather than abandoning quantification.

  For the B-grade benchmark, I define it as identifying all elements but lacking synthesis: mentioning each problem in isolation without showing how they interconnect to challenge the outside view's foundations. This ensures students who mechanically list concepts without grasping their implications plateau at 13-14/20.

  The deliverables package includes:
  - The exam question text
  - A 700-word model answer
  - Marking scheme with 5x4 criteria and common errors
  - Clear B-grade descriptor
  All designed to meet the user's precise pedagogical goals while fitting disciplinary conventions.
answer: |-
  ### Final Exam Question  
  **Time Allowed: 90 minutes**  
  **Marks: 20**  

  > In 1938, a British imperial analyst is asked: "What is the probability that Britain will still rule India fifty years hence?" She resolves to use the *outside view* (reference-class forecasting).  
  >  
  > Evaluate the methodological and epistemic challenges she would face in selecting a reference class for this forecast. Your analysis must address:  
  > - The trade-offs in choosing between reference classes at different "rungs" of specificity (e.g., broadly defined polities vs. highly contextualized cases);  
  > - How *coroner’s reference classes* and *reflexivity* might distort or invalidate her base-rate estimate;  
  > - What *epistemic modesty* genuinely requires in this scenario.  
  >  
  > *Disregard all knowledge of historical outcomes post-1938.*  

  ---

  ### Model Answer (703 words)  
  The analyst’s task illustrates the tension between the outside view’s promise of objectivity and its vulnerability to hidden biases. While reference-class forecasting demands she "ignore the details" of Britain’s rule in India, her choice of reference class itself smuggles in causal assumptions, exposing three core dilemmas.  

  **First, the matching ladder imposes unavoidable trade-offs between relevance and robustness.** A broad class—e.g., *all polities ruling territories >5,000 km from their capital*—offers ample data but includes incomparable cases (e.g., Mongol steppe empires vs. Portuguese trading posts). The base rate here (say, 10% survival past 50 years) is statistically stable but irrelevant, as it ignores Britain’s unique maritime-colonial structure. A narrower class like *European overseas empires post-1500* improves fit but introduces right-censoring: in 1938, France (Algeria) and Britain (Malaya) appear "ongoing," artificially inflating survival rates if treated as successes. The tightest class—*maritime empires post-global-war facing mass nationalism*—might include only Britain post-WWI and Spain post-Napoleonic Wars. This seems contextually ideal but collapses the outside view: selecting Spain relies on the *inside view* that war exhaustion and nationalism drive collapse. Ascending the ladder trades statistical power for ad hoc storytelling, undermining the method’s founding premise.  

  **Second, the coroner’s reference class problem ensures base rates encode survivorship bias.** Empires are only classified as "empires" after they die; persistent polities are re-categorized as "nation-states" (e.g., Rome vs. China). If our analyst uses "European empires" as her class, she unknowingly samples only *terminated* cases. The 1914 Ottoman Empire was an "empire"; today’s enduring UK is a "constitutional monarchy." This labels durability as a category error, inflating failure rates. Worse, classes like "empires facing nationalist movements" are defined ex post by their failure mode—like diagnosing a disease only from autopsies. The base rate becomes a self-fulfilling cemetery census: 0% of "failed empires" survived, but this tautology offers no predictive insight.  

  **Third, reflexivity dismantles the outside view’s authority.** If the analyst publishes a forecast that "maritime empires fail within 50 years of nationalist revolts (base rate: 100%)," British policymakers may intensify repression or accelerate reforms, altering India’s trajectory. Conversely, a high-survival estimate could breed complacency. The base rate is not a fixed natural frequency but a *prophecy* that may rewrite its own premises. The outside view lacks tools to address this: admitting that "actors change behavior" concedes that historical data govern only inert systems, not conscious agents. Epistemic modesty here cannot mean merely averaging inside/outside estimates—a false compromise between flawed numbers—but must acknowledge that forecasting political futures is *inherently unstable* when the forecast itself becomes a causal factor.  

  **Thus, epistemic modesty demands qualitative humility, not quantitative precision.** A responsible analyst would reject assigning a precise probability. Instead, she might:  
  > (a) Report base rates from *multiple* reference classes (broad to narrow) with explicit uncertainty bounds (e.g., "5–40% survival, but censored cases may raise this");  
  > (b) Flag coroner-class distortions by contrasting "empires" with "long-lived states" (e.g., calculate China’s "imperial" duration as 2,000+ years);  
  > (c) Note reflexivity risks: "This estimate assumes no novel adaptation to anticolonial pressures."  
  The true outside view recognizes that *all* reference classes are social constructs laden with hindsight. Its virtue lies not in delivering authoritative numbers but in mapping the fragility of historical analogy—thereby curbing hubris, not generating predictions.  

  ---

  ### Marking Scheme (5 × 4 points each)  
  **Award 4 marks per fully addressed criterion:**  
  1. **Trade-offs on the matching ladder**  
     → *Must:* Contrast how higher rungs gain relevance but lose data/cause overfitting, using the three proposed classes.  
     → *Common error:* Asserting one class is "best" without weighing statistical vs. contextual trade-offs.  

  2. **Coroner’s reference class critique**  
     → *Must:* Explain how empire/nation-state reclassification inflates failure rates via survivorship bias, generalizing beyond empires.  
     → *Common error:* Noting selection bias exists but failing to specify *how* it distorts the probability (e.g., "it’s biased" vs. "it inflates collapse likelihood by excluding enduring polities").  

  3. **Reflexivity’s challenge to base rates**  
     → *Must:* Argue that forecasts can alter behavior, voiding historical frequencies, and show the outside view lacks a non-circular response.  
     → *Common error:* Treating reflexivity as a minor flaw ("it might affect accuracy") rather than undermining the method’s foundation.  

  4. **Epistemic modesty as substantive restraint**  
     → *Must:* Reject false precision (e.g., averaging estimates) and advocate for qualitative/metacognitive alternatives (e.g., scenario ranges, explicit caveats).  
     → *Common error:* Equating modesty with "split the difference" or "don’t forecast," without proposing actionable alternatives.  

  5. **Synthesis: Why this destabilizes the outside view**  
     → *Must:* Conclude that reference classes are unavoidably value-laden/reflexive, making the method a "humbling tool" not a predictive engine.  
     → *Common error:* Listing problems mechanically without unifying them into a coherent critique of forecast objectivity.  

  ---

  ### The B-Grade Answer (13–14/20)  
  A B student will:  
  ✓ Correctly define all key terms (outside view, reference class, right-censoring, etc.).  
  ✓ Identify all three challenges (ladder trade-offs, coroner effect, reflexivity) and describe each *separately* with examples.  
  ✓ Acknowledge epistemic modesty but offer vague resolutions (e.g., "use multiple classes" without specifying how).  
  **But they will lack:**  
  ✗ Synthesis showing *how* the problems interconnect (e.g., how ascending the ladder invites reflexivity).  
  ✗ Nuance in critique (e.g., stating "coroner bias exists" but not explaining why it inflates *failure* rates specifically).  
  ✗ Originality in resolving modesty (e.g., defaulting to "don’t use numbers" without the model answer’s structured alternatives).  
  *Result:* Technically competent but mechanical; checks boxes without probing deeper implications.  

  ---  
  **Rationale**: This design forces students beyond rote recitation by embedding contradictions (e.g., "narrow classes need inside-view logic") and penalizing hindsight. The 1938 framing, with unresolved cases (e.g., France in Algeria), ensures historical knowledge offers no shortcuts. Each must-hit point targets a higher-order cognitive leap, while the B descriptor ensures formulaic answers plateau below distinction.
