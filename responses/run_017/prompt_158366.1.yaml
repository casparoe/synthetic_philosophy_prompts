answer: |-
  Absolutely, I'll fight this as a committed epistemicist. Here's my counter to your sealed standard case:

  Your sealed standard proves *my* point, not yours. It shows that a determinate, sharp boundary *can* exist entirely independently of anyone's *knowledge* or ability to *detect* it. The box provides a *physical* anchor, yes. But for ordinary vague terms like 'heap', the anchor isn't physical – it's *causal-historical*. The sharp cut-off is fixed by the complex, messy *totality* of our actual usage patterns and dispositions across the entire linguistic community and history, interacting with the actual objects in the world. Just because this totality is incredibly complex and *we* can't survey it or compute the boundary doesn't mean there *is* no boundary. The boundary is a *consequence* of that usage, however messy it seems at the individual level. Your sealed standard isolates *one* mechanism for fixing reference (ostension to a hidden sample), but reference fixation in natural language is multi-faceted and historical, not requiring a single, accessible sample. The determinacy comes from the *actual causal chain* linking our word 'heap' to the world via our collective practices.

  You object that our dispositions are mushy and inconsistent. But mushiness at the *individual* or *token* level doesn't imply indeterminacy at the *communal* or *type* level. Consider: our physical dispositions to react to stimuli are also inconsistent across moments and individuals – does that mean there's no fact about whether a specific chemical *actually* causes nausea in humans? No. The messy pattern *itself* is a determinate fact. There *is* a specific statistical distribution and set of historical usage events that constitute the meaning-constituting facts for 'heap'. The supervaluationist mistake is thinking that because we can *imagine* multiple coherent ways to precisify the term ("admissible precisifications"), the actual world hasn't *already* selected one via the complex, concrete facts of usage. Our principled ignorance arises precisely because we cannot cognitively access or process the totality of these massively complex, distributed facts that *do* fix a unique extension. The mush *is* the determinate anchor.
