  Okay, let me start by really unpacking this user's dilemma. They're on a hospital committee updating psychiatric advance directives (PADs) and noticing inconsistencies in how earlier vs. present selves are treated across different conditions—like bipolar mania versus dementia. The core confusion seems to be: why does the earlier self override in psychiatric cases but not in end-of-life scenarios?

  First, I need to address the philosophical underpinnings they're questioning. The user mentions "coherent extrapolated volition" (CEV), which is a complex concept from AI alignment. Applying CEV here is tricky. They're wondering if the manic episode should be included in the extrapolation or seen as noise. I recall that CEV involves hypothetical idealized reasoning, but in medical contexts, you have to consider real-time capacity and legal frameworks. 

  The user also points out that current practice might be underdetermined—meaning no consistent theory explains the asymmetry between psychiatric and dementia cases. They suspect habit or historical accident rather than principle. I should validate that suspicion because it matches what I know: capacity assessments dominate medical decision-making, but the criteria aren't applied uniformly across specialties. For example, psychiatry often prioritizes pre-crisis directives during acute episodes, while geriatrics may favor present wishes in dementia if the patient seems lucid enough.

  Next, the concrete questions about CEV application. The user asks which self is the base point for extrapolation—30-year-old signing or 35-year-old manic. The answer isn't straightforward. In psychiatric contexts, the pre-illness self is often seen as the "true" self, but this assumes that mania distorts identity. However, for dementia, even if the patient has moments of clarity, their current wishes might be respected if they demonstrate capacity. This highlights a tension in how different fields view identity over time.

  The user also questions whether the manic episode's experiences should update the extrapolated will. Philosophically, yes, new experiences should inform CEV. But practically, during an acute episode, clinicians might not trust the patient's current judgment. This leads to their suspicion that directives are practical tools rather than theoretically sound. I agree—directives provide a clear protocol during crises, reducing on-the-spot uncertainty, even if philosophically messy.

  For policy implications, the user wants to know how a CEV-based approach would change things. Binding instructions might become rebuttable presumptions, requiring attempts to discuss with the patient when possible. But this could create delays or ambiguities, especially in emergencies. The committee might need to design PADs that include values histories, not just checkboxes, so clinicians understand the patient's deeper goals beyond specific treatments.

  The user’s deeper need might be to justify or reform their hospital’s policy with coherent principles. They might feel uneasy about the current inconsistencies and want either a solid theoretical foundation or acknowledgment that the practice is pragmatic. If the latter, the committee can focus on practical improvements—like standardizing capacity assessments, training staff on PADs, and ensuring directives are accessible during crises—without claiming a perfect philosophical solution.

  I should also consider the legal aspects they mentioned. In places where PADs are binding, clinicians might feel compelled to follow them, whereas advisory directives allow more flexibility. But the user thinks legality isn’t central to their question. Still, it might influence how strictly policies are applied. For example, a CEV-based approach might require periodic updates to directives, ensuring they reflect the patient’s evolving values, which isn’t common practice now.

  Finally, the user’s frustration with documents being ignored points to implementation issues. Even the best policy fails without buy-in. So, whatever the committee decides, ensuring clarity and staff training is crucial. If they adopt a CEV-inspired approach, it might involve more nuanced documentation but could increase complexity. Balancing theoretical ideals with practicality will be key.
answer: |-
  You've hit on a profound tension in medical ethics that lacks a clean, universally accepted resolution. The asymmetry between psychiatric and dementia directives *is* philosophically loaded, and current practice leans heavily on practical necessity and distinct historical/clinical contexts rather than a single, coherent theory of the self or volition. Here's the reconstruction and analysis of CEV's application:

  ### Reconstruction: The Unstated Presuppositions of Current Practice
  1.  **The Primacy of Capacity as a Threshold:** The core procedural anchor is decision-making *capacity* at the time of the decision. A "competent now" refusal usually trumps a prior instruction *unless*:
      *   **The Current State is Judged "Incapacitatingly Distorted":** In psychiatry (especially mania, psychosis), the *reason* for current refusal is deemed a direct, severe symptom of the illness the directive was designed for. The prior directive is seen as evidence of the "authentic" self *anticipating and rejecting* this distorted state.
      *   **The Prior Directive Explicitly Addresses the Current Scenario:** It specifically binds future decisions *during incapacity* caused by the anticipated condition.
  2.  **The "Authentic Self" vs. "Illness Self" Distinction (Implicit in Psych):** Psychiatric practice often operates on an unstated model where severe mental illness (like mania/psychosis) *occludes* the "true" person. The pre-illness/pre-crisis self is privileged as the authentic voice. The directive is a bulwark *against* the illness distorting the will.
  3.  **The "Living Self" vs. "Anticipatory Self" Distinction (Implicit in Geri/Dementia):** In dementia/end-of-life, the person physically present, *especially if showing moments of capacity or enjoyment*, is prioritized. There's a stronger emphasis on current well-being and avoiding suffering *now*, even if it contradicts prior fears/preferences expressed when healthy. The prior directive is seen as anticipating a *hypothetical* future state, which may not fully match the lived reality.
  4.  **Pragmatism & Risk Aversion:** Overriding a screaming, manic patient refusing meds feels clinically necessary to prevent harm. Ignoring a frail, demented patient happily eating lunch to enforce a prior DNR feels cruel and unnecessary *in that moment*. Practice often follows the path of least immediate harm and least perceived cruelty, shaped by the clinical context (acute crisis vs. chronic decline).

  **The Underdetermination:** This practice *is* compatible with several theories:
      *   **Procedural Capacity Threshold (Thin):** Strictly gatekeeping based on *current* capacity assessment. The asymmetry arises because capacity assessment *itself* is context-dependent (much harder to judge capacity *absent* overt distortion in dementia vs. overt distortion in mania).
      *   **Authentic Will (Thicker):** Privileging the will expressed under conditions of rationality, stability, and foresight (the psych directive signer) over the will distorted by illness. The dementia case challenges this, as the "authentic" prior self wanted less treatment, but the present self seems content.
      *   **Narrative Identity/Integrity:** Respecting the life story and values project. The psych directive upholds the person's long-term life project (stability) against an illness that disrupts it. In dementia, enforcing a prior DNR might uphold a value (avoiding pointless suffering), but respecting current enjoyment might uphold the value of present well-being within the narrative *as it is*.
      *   **Best Interests (Paternalistic):** Overriding the manic patient is clearly in their best interests to prevent catastrophe. Overriding the happy dementia patient for a DNR might *not* seem in their best interests *at that specific lunch moment*.

  **The Core Problem:** The practice presupposes that **certain states (mania/psychosis) are uniquely distorting in a way that invalidates contemporaneous expressions of will in a manner that other conditions (dementia, even with fluctuating capacity) do not.** This distinction is clinical/pragmatic more than philosophically watertight. It's also influenced by the perceived *reversibility* of the acute psychiatric state with treatment.

  ### Applying Coherent Extrapolated Volition (CEV) to Your Cases
  CEV (roughly: "What would this person want if they were fully informed, thinking clearly and coherently, and understood their own values deeply?") is fascinating but treacherous here.

  1.  **Which Self is the Base Point?**
      *   **There is no single answer, and it *does* depend.** This is the crux. CEV requires a starting point. Do we extrapolate *from*:
          *   The 30-year-old, stable, signing the directive? (Prioritizes foresight, values formed in health).
          *   The 35-year-old *during* the manic episode? (Risks incorporating the distortion).
          *   The 35-year-old *after* recovering from the episode? (Requires waiting, often impractical).
      *   **The Practical Bias:** Clinically, we implicitly use the *pre-morbid* self as the base because the manic state is deemed too epistemically compromised to be a reliable starting point. CEV *could* theoretically incorporate the manic experience *after* reflection, but you can't access that reflection *during* the crisis when the decision is needed. **CEV fails at the point of application in acute crisis for the same reason capacity is impaired – the subject cannot engage in the hypothetical reflection.**

  2.  **Does the Manic Episode Count as Input?**
      *   **Yes, but filtered through reflection.** A *true* CEV would incorporate *all* experiences, *including* the manic episode and the patient's subsequent reflection on it. Did the episode change her view of her illness, treatment, or life goals? For example, a terrible experience with forced medication might make her revise her directive, or reinforce it.
      *   **The Catch:** This reflection happens *later*. During the *next* acute episode, you still face the same problem: you have an *updated* directive (hopefully), but the *current* distorted self might reject it. You cannot run the CEV simulation in real-time during the crisis. The directive *is* the best available proxy for the post-reflection CEV.

  3.  **Is There a Fact of the Matter?**
      *   **Your suspicion is largely correct.** CEV is highly dependent on the model of the person, the inputs included, and the extrapolation process. Different theorists (or family members, or clinicians) would extrapolate differently. The manic episode *is* part of her life story, but how it integrates into her "coherent" will depends on her subsequent narrative processing. **The directive acts as a concrete, practical anchor point *precisely because* a perfect, real-time CEV is unknowable and computationally intractable in a clinical setting.** It provides a clear rule in the face of profound uncertainty about the idealized self.

  4.  **Concrete Policy Implications of Taking CEV Seriously:**
      A CEV-inspired policy would likely look quite different from current checkbox forms:

      *   **From Binding Directives to Rebuttable Presumptions + Process:** The directive would be a *strong starting presumption* of the extrapolated will, but *not* absolute. Overriding current refusal would require:
          *   A clear finding of *current incapacity* specifically related to the condition the directive addresses.
          *   A *good faith attempt* to engage the patient *in the moment*: "You signed this when stable, saying to treat you if you became manic and refused. That's happening now. Can we talk about why you're refusing *today*?" This probes if there's any *new*, non-illness-based reason for refusal.
          *   Consideration of whether circumstances have changed *fundamentally* since signing that the directive couldn't anticipate (e.g., new, severe medication side effects discovered since signing).
      *   **Deep "Values History" Over Treatment Checklists:** Forms would focus less on "Admit me/Don't admit me" and more on: "What do you value most in life (stability, independence, creativity, relationships)? What do you fear most about your illness? What experiences (good or bad) with treatment shape your views? What trade-offs are you willing/not willing to make?" This gives clinicians richer context to interpret the directive *and* engage the current patient.
      *   **Regular Review & Update Mandates:** Recognizing that CEV evolves, policies would require periodic review/updates (e.g., annually, after significant life/health events, after recovery from an episode) to incorporate new experiences and reflections.
      *   **Documenting "Why":** Patients would be encouraged to briefly explain *why* they made the choices in their directive (connecting to their values/fears/experiences), aiding interpretation.
      *   **Focus on Supported Decision-Making:** Emphasis shifts towards facilitating the patient's *current* participation in the decision *as much as possible*, using the directive as a guide for what they *likely* would want, rather than a blunt override. The team's job becomes "What would help *this* patient, right now, make the decision closest to their CEV?"
      *   **Structured Deliberation for Conflict:** Clear pathways for resolving disagreements between the directive, current refusal, and clinical judgment (e.g., ethics consultation, rapid court review) focusing on *interpretation* of the CEV in this specific context.

  **What Would Get Better:**
  *   More nuanced, patient-centered decisions.
  *   Greater respect for the patient's evolving narrative and values.
  *   Reduced sense of brutal override; more sense of collaborative interpretation.
  *   Documents more likely to be used and respected because they offer richer guidance.

  **What Would Get Worse:**
  *   **Ambiguity & Delay:** Rebuttable presumptions and required dialogue create uncertainty and slow down urgent treatment.
  *   **Clinician Burden:** Requires more time, skill, and emotional labor to engage distressed, potentially irrational patients and interpret complex values histories.
  *   **Conflict & Litigation Risk:** More room for disagreement about capacity assessments, the "good faith" of dialogue, and the interpretation of values histories.
  *   **Implementation Friction:** Harder to create, update, and access detailed values histories compared to simple checkboxes. Training requirements skyrocket.
  *   **Potential for "Soft Paternalism":** Clinicians might use "dialogue" manipulatively or interpret "values" to justify what *they* think is best.

  ### The Honest Answer
  **Yes, the current asymmetry is largely underdetermined by a single deep theory. It rests on a pragmatic, context-specific, and somewhat inconsistent privileging of different "selves" based on clinical tradition, perceived distortion, reversibility, and immediate harm avoidance, filtered through the legal/ethical gate of capacity assessment.**

  CEV is a compelling *aspirational* framework that highlights the limitations of simplistic directives and capacity binaries. It pushes towards richer values exploration and more nuanced engagement. **However, it cannot provide a definitive, real-time answer during an acute crisis.** The directive remains a vital, practical tool, but CEV suggests it should be implemented with more humility (as a rebuttable presumption), more context (via values histories), and more effort to engage the current patient within the bounds of safety.

  **Your committee's task isn't to find the perfect philosophy but to design a more humane and practical process.** Focus on:
  1.  **Shifting from checkboxes to values narratives.**
  2.  **Building in mechanisms for dialogue before override.**
  3.  **Requiring regular review/updates.**
  4.  **Creating clear pathways for resolving ambiguity.**
  5.  **Training staff on *interpreting* and *engaging* with directives, not just following them blindly.**

  Acknowledge the philosophical tension, but ground your policy in practical steps that make the process more respectful of the whole person across time, even if the "true self" remains elusive at the critical moment.
