answer: |-
  Below is a decision tree designed to navigate the logical space of responses to the problem of old evidence. It prioritizes concrete branching questions tied to specific cases, leading to named positions. Each branch node is a yes/no question phrased in the vocabulary of the problem, avoiding doctrinal labels until the leaves. The tree includes your specified cases (entailment discovery, forgotten evidence, precise retrodiction, new vocabulary, and accommodation vs. prediction).  

  ### **Decision Tree: The Problem of Old Evidence**  
  **Starting point**: Evidence \(E\) is known with certainty when hypothesis \(H\) is proposed. Conditionalizing on \(E\) cannot raise \(P(H)\), yet \(E\) seems to support \(H\) (e.g., Mercury’s perihelion and general relativity).  

  ---

  #### **Node 1: Can the agent’s current certainty in \(E\) be "undone" (e.g., via forgetting)?**  
  - **Yes** → **Leaf 1: Forgotten Evidence Response**  
    - **Name**: Forgotten Evidence (Eells, Glymour)  
    - **Awkward commitment**: Only applies if \(E\) is genuinely forgotten; fails if the agent remains certain of \(E\).  
    - **Predictivism verdict**: Accommodation (building \(H\) to fit \(E\)) is treated identically to prediction; no penalty.  
  - **No** → Proceed to Node 2.  

  #### **Node 2: Does confirmation require conditionalizing on \(E\) itself?**  
  - **No** → Proceed to Node 3.  
  - **Yes** → **Leaf 2: Synchronic Bayesianism**  
    - **Name**: Unnamed (incoherent under certainty)  
    - **Awkward commitment**: \(E\) cannot confirm \(H\) if \(P(E) = 1\), violating the intuition (e.g., Mercury).  
    - **Predictivism verdict**: Not applicable (denies old evidence confirms).  

  #### **Node 3: Is the key "new" evidence the discovery that \(H \vdash E\)?**  
  - **Yes** → **Leaf 3: Entailment Approach**  
    - **Name**: Garber-Jeffrey Approach  
    - **Awkward commitment**: Conditionalizing on a logical truth (\(H \vdash E\)) should not change crendence unless logical omniscience is abandoned.  
    - **Predictivism verdict**: Discounts accommodation if \(H\) was constructed *after* knowing \(H \vdash E\); otherwise, no penalty.  
  - **No** → Proceed to Node 4.  

  #### **Node 4: Should \(E\) be redescribed as a new proposition \(E^*\) (e.g., precise value)?**  
  - **Yes** → **Leaf 4: Evidential Refinement**  
    - **Name**: Maher’s Approach  
    - **Awkward commitment**: Requires a principled distinction between \(E\) and \(E^*\) to avoid ad hoc redescription.  
    - **Predictivism verdict**: No penalty for accommodation; \(E^*\) is treated as new evidence regardless of how \(H\) was built.  
  - **No** → Proceed to Node 5.  

  #### **Node 5: Should confirmation use a counterfactual prior credence (lacking \(E\))?**  
  - **No** → **Leaf 5: Logical Relationism**  
    - **Name**: Unnamed (unattractive)  
    - **Awkward commitment**: Confirmation depends solely on logical relations, ignoring epistemic history (e.g., how \(H\) was constructed).  
    - **Predictivism verdict**: Accommodation irrelevant; support is "priced in" via logic.  
  - **Yes** → Proceed to Node 6.  

  #### **Node 6: Is the counterfactual prior the agent’s *actual* historical prior (pre-learning \(E\))?**  
  - **Yes** → Proceed to Node 7.  
  - **No** → **Leaf 6: Hypothetical Prior Approach**  
    - **Name**: Howson-Urbach Approach  
    - **Awkward commitment**: Prior is not the agent’s actual past belief; risks arbitrariness in specification.  
    - **Predictivism verdict**: No penalty for accommodation; prior lacks \(E\), so \(H\)’s construction is irrelevant.  

  #### **Node 7: Was \(E\) (or its content) expressible in the historical prior’s language?**  
  - **Yes** → **Leaf 7: Historical Prior Approach**  
    - **Name**: Historical Bayesianism (Glymour)  
    - **Awkward commitment**: Requires recovering the agent’s exact historical beliefs, which may be inaccessible.  
    - **Predictivism verdict**: No penalty for accommodation; prior is fixed before \(H\) was proposed.  
  - **No** → **Leaf 8: Extended Language Approach**  
    - **Name**: Unnamed (incoherent)  
    - **Awkward commitment**: Extending the historical prior to new vocabulary (e.g., from \(H\)) is underdetermined and arbitrary.  
    - **Predictivism verdict**: Not applicable (view collapses).  

  ---

  ### **Empty or Coherent Combinations**  
  - **Leaf 2 (Synchronic Bayesianism)**: Incoherent. If confirmation requires conditionalizing on \(E\) and \(P(E) = 1\), \(P(H|E) = P(H)\), so no confirmation occurs.  
  - **Leaf 5 (Logical Relationism)**: Unattractive. Ignores cases where support depends on the agent’s learning path (e.g., entailment discovery).  
  - **Leaf 8 (Extended Language)**: Incoherent. Language change breaks the historical prior; no non-arbitrary way to extend it.  
  - **Node 6 → "No"**: Covered by Leaf 6.  
  - **Node 6 → "Yes" and Node 7 → "No"**: Covered by Leaf 8.  

  ---

  ### **Surviving the "Too Easy" Worry**  
  Can agents manufacture confirmation by manipulating priors, languages, or redescriptions?  
  - **Vulnerable to manufacturing**:  
    - Leaf 4 (Evidential Refinement): Agents might redescribe \(E\) arbitrarily as "new" \(E^*\).  
    - Leaf 6 (Hypothetical Prior): Priors can be cherry-picked to favor any \(H\).  
    - Leaf 8 (Extended Language): Language extensions can be ad hoc.  
  - **Resistant to manufacturing**:  
    - Leaf 1 (Forgotten Evidence): Requires genuine forgetting (not deliberate).  
    - Leaf 3 (Entailment Approach): Only works if entailment discovery is sincere.  
    - Leaf 7 (Historical Prior): Prior is fixed by history; not revisable.  
  - **Avoids by denying old evidence confirms**: Leaf 2, Leaf 5.  

  ---

  ### **Key Takeaways**  
  - **Predictivism**: Only **Leaf 3 (Entailment Approach)** discounts accommodation, and only if \(H\) was built *after* knowing \(H \vdash E\). All other leaves treat prediction and accommodation identically.  
  - **Viable positions**: Forgotten Evidence (Leaf 1), Entailment (Leaf 3), and Historical Prior (Leaf 7) best handle the "too easy" worry without collapsing.  
  - **For the seminar**: This tree forces students to confront trade-offs (e.g., diachronic vs. synchronic, actual vs. hypothetical priors) and links to predictivism (next session).  

  Use this tree to guide case discussions, then transition to predictivism by asking: "If accommodation isn’t penalized in most solutions, *should* it be?"
