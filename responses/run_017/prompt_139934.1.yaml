prompt: |-
  I'm a science journalist working on a piece about where medicine's remit ends — what counts as treatment rather than enhancement, accommodation, or mere alteration — and I've found that my own verdicts on cases don't match any slogan I can say out loud. My working principle is that a condition is a disease just when it impairs a species-typical function, but I keep having to bolt clauses onto it.

  Sickle-cell anemia: a disease. Sickle-cell trait: not one, even though it can cause trouble under extreme oxygen deprivation. A valley town where a century of smoke has left nearly everyone below species-typical lung capacity: a disease, though it's the local statistical norm. A variant that lets someone thrive on four hours of sleep with no physiological cost, leaving them awake and alone for hours each night: not a disease. But a variant that sets the body clock to a roughly 26-hour cycle, so the person is chronically sleep-deprived in a 24-hour world: a disease — even though in both cases what fails is the fit between a body that works and a social schedule, not the body itself. An extra finger: a difference, not a disease. Congenital inability to feel pain: a disease, without hesitation.

  Please test my principle against these verdicts and repair it rather than just swapping in a theory of your own. Then apply whatever you end up with to the case I can't settle: a symptom-free trait that does nothing but raise the probability of later illness — say, mildly elevated blood pressure in someone who feels entirely well.

  Answer in exactly five numbered points, one or two sentences each, with no introduction or conclusion, covering: (1) the repaired principle stated in one sentence; (2) the clause each of my verdicts forced you to add or drop; (3) which of my verdicts you would overturn, if any; (4) your principle's verdict on the blood-pressure case; and (5) which of your claims people who work on this topic would treat as settled and which are genuinely live disputes. In the last point, do not present a contested view as the consensus.
reasoning: |-
  Hmm, the user is a science journalist grappling with the complex boundary between disease and enhancement in medicine. They've developed a working principle that a condition is a disease when it impairs "species-typical function," but find it needs constant modification to handle edge cases. They've provided several challenging scenarios to test this framework and want help refining it rather than replacing it entirely.

  Looking at their examples: Sickle-cell anemia clearly qualifies as disease under their principle while the trait doesn't, despite some risk under extreme conditions. The polluted valley case shows statistical prevalence doesn't override disease status. The sleep examples create tension - the efficient sleeper isn't diseased despite social mismatch, while the circadian mismatch person is. Polydactyly is mere difference while congenital pain insensitivity is clearly pathological. The unresolved case involves asymptomatic hypertension.

  Their core challenge is balancing biological norms with environmental/social contexts. I notice their principle needs to account for: 1) probabilistic harm (sickle trait), 2) environmental induction (valley lungs), 3) mismatch without dysfunction (short sleeper), 4) mismatch with dysfunction (circadian), and 5) future risk (hypertension).

  For the repair, I'll maintain their species-typical anchor but build in key distinctions. The valley case shows we must disregard local statistical norms when they're environmentally induced. The sleep cases reveal we need to separate internal dysfunction from mere social incompatibility - the circadian variant causes actual sleep deprivation pathology. The pain insensitivity case demonstrates that protective functions count as species-typical.

  For hypertension, this falls under probabilistic harm - it's a disease state because it predictably impairs function over time, even if asymptomatic now. The journalist might be struggling because it lacks immediate symptoms, but medically we treat it precisely to prevent future impairment.

  In the final point about consensus, I'll be careful to note where agreement exists (like pain insensitivity being pathological) versus ongoing debates (like whether statistical deviations alone constitute disease). The environmental cases like the valley are particularly contested in philosophy of medicine circles.
answer: |-
  1.  Repaired principle: A condition is a disease only if it predictably impairs a species-typical function vital to well-being *within a relevantly typical environment*, either intrinsically or by creating a significant mismatch leading to harm.
  2.  Clauses forced: Added "vital to well-being" (for extra finger), "within a relevantly typical environment" (for valley town, circadian variant, short sleeper), and "predictably impairs" (for sickle-cell trait vs anemia); dropped reliance on local statistical norms (valley town).
  3.  Overturned verdicts: None; all your verdicts are upheld under the repaired principle.
  4.  Blood pressure verdict: Mildly elevated blood pressure, as a trait predictably impairing cardiovascular function (a vital species-typical function) over time within typical environments, is a disease state.
  5.  Settled vs. live disputes: Settled: Impairment of vital functions (e.g., pain insensitivity) is disease. Live disputes: Defining "relevantly typical environment," "predictability," "vital function," weight of statistical norms, and whether probabilistic future harm alone suffices (e.g., hypertension).
