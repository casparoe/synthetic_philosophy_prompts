  3. Addressing the equivocation: "explained" could mean mechanistic origin or experiential understanding. Tag substantive and defensible for highlighting ambiguity. This weakens the friend's argument because he might be conflating the two, so it doesn't fully license his conclusion.
  4. A claim that layered explanations preserve everything: tag false because, while the mechanisms are explained, the subjective "what it's like" aspect might not be fully captured. This contradicts the friend's use, as it suggests something is indeed lost.
  5. On whether the slogans guarantee no loss: tag false. The slogans describe how to build explanations, but don't automatically mean experiences remain intact, so it doesn't license the friend's conclusion.

  I need to ensure variety: claims 1 and 2 cover the slogans broadly, 3 deals with equivocation, 4 and 5 focus on greedy reductionism and its implications. I'll make sure each is concise and fits the format.

