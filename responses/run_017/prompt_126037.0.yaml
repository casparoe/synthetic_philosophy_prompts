  4. **No misleading as a channel constraint**: The moral requirement that sub-agents not mislead is reframed as a requirement for the subanswers to be "trainable against"—i.e., the aggregator must be able to assign credit and update the policy based on the subanswers. This avoids deception by design, as the system is trained end-to-end.

