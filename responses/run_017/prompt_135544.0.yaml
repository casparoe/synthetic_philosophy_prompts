  ### Session Design: The Highway Exit Dilemma

  **Core Insight:** Participants experience a clash between pre-commitment rationality (designing a rule in advance) and local rationality (making the best decision at the moment) due to imperfect recall. The lamp variant reveals that partial information can align these perspectives, but only above a reliability threshold.

  #### 1. Activity Design (30 minutes per condition)
  **Materials per Condition:**  
  - 15 trip envelopes (each containing two index cards: one "first" exit, one "second" exit).  
  - 1 six-sided die.  
  - Poker chips: 0 (white), 1 (blue), 4 (red).  
  - Cardboard screen (for facilitator setup).  
  - Lamp cards (for lamp variant: "lit" or "dark").  

  **Roles:**  
  - **Drivers:** 2 per trip (randomly selected).  
  - **Recorder:** Tracks payoffs on a board.  
  - **Facilitator (you):** Enforces rules.  

  **Rules & Setup (No Lamp):**  
  - Each trip has two exits. Facilitator shuffles the two index cards (hidden) and places them in two envelopes labeled A and B.  
  - **Driver 1:** Given envelope A. Chooses "leave" or "continue" (no peeking).  
    - **Leave:** Opens envelope. If "first," gets 0 chips; if "second," gets 4.  
    - **Continue:** Envelope is set aside (unopened). Driver 2 is given envelope B.  
  - **Driver 2:** Given envelope B. Chooses "leave" or "continue."  
    - **Leave:** Opens envelope. If "first," gets 0; if "second," gets 4.  
    - **Continue:** All envelopes opened. If both passed, 1 chip.  
  - **Enforcing Ignorance:**  
    - Drivers don’t see setup (use screen).  
    - Envelopes are identical.  
    - No discussion between drivers.  
    - Recorder hides chip payoffs until end of trip.  
  - **Randomization:** For mixed strategies (e.g., 2/3 continue), drivers roll a die (1–4 = continue, 5–6 = leave).  

  **Lamp Variant (Adds Reliability):**  
  - Each index card has a lamp state: "lit" or "dark."  
    - First exit: 20% "lit," 80% "dark" (reliability 0.8).  
    - Second exit: 80% "lit," 20% "dark."  
  - Drivers see the lamp state (written on the envelope) before deciding.  
  - Best rule: "Continue if dark, leave if lit."  

  **Trip Count & Why:**  
  - 15 trips per condition.  
    - **Why?** Pre-commitment (4/3 ≈ 1.33 per trip) vs. deviation (0) yields ~20 vs. 0 chips—visibly clear. Fits time (5–6 minutes per trip).  

  ---

  #### 2. Staging the Lamp Variant  
  - **Run in Order:**  
    1. **No Lamp:** Participants experience the clash (pre-commitment vs. local decision).  
    2. **Lamp (0.8 reliability):** Rule "continue if dark, leave if lit" works perfectly (local view matches plan).  
    3. **Lamp (0.6 reliability):** Same rule, but local view at "lit" diverges (continuing appears better).  
  - **Discovery Moment:**  
    - Use the board to tally expected values from simulation data.  
    - At **0.8 reliability**, both perspectives agree (e.g., "leaving when lit" is locally optimal).  
    - At **0.6 reliability**, show "leaving when lit" is locally suboptimal (expected 1.9 for continue vs. 1.8 for leave).  
    - **Prompt:** *"Why does the same rule work at 0.8 but not at 0.6? What changed?"*  
    - Participants infer: Reliability affects whether local beliefs align with the plan.  

  ---

  #### 3. Debrief (15 minutes)  
  - **Map Session Moments to Structure:**  
    - **Pre-commitment vs. Local Choice:**  
      - *No Lamp:* "Why did you abandon the plan at the intersection?" → Highlights memory constraint.  
    - **Lamp Agreement at 0.8:**  
      - "How did the lamp make your at-intersection choice easier?" → Information resolves uncertainty.  
    - **Lamp Conflict at 0.6:**  
      - "Why does the lamp lie more? How does that break the agreement?" → Unreliable info distorts local beliefs.  
  - **Handling Comments:**  
    - *"Use a notepad!"* → Acknowledge (real-world fix), but emphasize: "Our driver *can’t* recall. How do we act without perfect memory?"  
    - *"Count how many times you’ve said 'intersection'!"* → Gently note: "In this game, you have no memory of past events. Assume you can’t count."  

  **Order & Contamination Prevention:**  
  - Run **No Lamp** first (establishes the paradox).  
  - Reset for **Lamp Variant:** Use new envelopes/chips, clear the board. Say: "Now, we add a lamp—pretend this is a new experiment."  

  ---

  #### 4. Honest Note (Facilitator Script)  
  *"Three things to remember:*  
  1. *None of us can truly ‘forget.’ We had to enforce this with rules and envelopes.*  
  2. *Your belief at the intersection isn’t yours—it’s handed to you by the game’s structure.*  
  3. *Whether the driver’s local reasoning is a ‘mistake’ or a valid perspective isn’t settled here. This session is about feeling the tension, not resolving it."*  

  ---

  #### 5. Predictable Failures & In-the-Moment Fixes  
  1. **Failure:** Drivers peek at envelopes.  
     - **Why:** Curiosity.  
     - **Fix:** "Stop! Remember, you’re at an exit with no info. Let’s restart this trip."  
  2. **Failure:** Participants strategize aloud, breaking isolation.  
     - **Why:** Natural collaboration.  
     - **Fix:** "Freeze! Drivers, cover your ears. No coaching—this is a solo decision."  
  3. **Failure:** Low chip differences due to small samples.  
     - **Why:** Natural variance.  
     - **Fix:** Add 5 extra trips on the fly and say, "Let’s double-check with more data."  
  4. **Failure:** Misinterpreting lamp reliability.  
     - **Why:** Probability confusion.  
     - **Fix:** Hold up a lamp card: "At a first exit, 'lit' is rare (20%). At a second, it’s common (80%)."  

  ---

  #### 6. Closing Paragraph  
  *"This isn’t just about highways. Imagine taking daily medication where a double dose is dangerous, and your memory is fuzzy. How do you decide to take a pill when you can’t recall if you already did? Like our driver, you’re forced to act on partial clues about your own history. The lamp? That’s your pill tracker app—sometimes it’s reliable, sometimes not. And just like in our game, the gap between what you planned and what feels right in the moment can save you—or cost you."*  

  ---

