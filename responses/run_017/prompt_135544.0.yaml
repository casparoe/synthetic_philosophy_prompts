  | Phase                | Clock Time | What Participants Do                            | What I Do                                                                 | What They Should Notice By Phase End            | Materials Needed                     |  
  |----------------------|------------|-------------------------------------------------|---------------------------------------------------------------------------|-------------------------------------------------|--------------------------------------|  
  | Intro/No Lamp Setup  | 0–5 min    | Listen, shuffle into driver/recorder roles.     | Explain rules, demo one trip. Emphasize: "No memory!"                     | The driver’s dilemma is real.                   | Envelopes, chips, die, screen.       |  
  | No Lamp Trips        | 5–35 min   | Drivers decide; recorder tallies chips.         | Enforce rules, reset between trips. Announce: "New trip, new driver!"     | Pre-commitment fails locally.                   | Trip envelopes, chips.               |  
  | Lamp Setup (0.8)     | 35–40 min  | Listen, ask questions.                          | Introduce lamp, explain reliability.                                      | Lamp adds information.                          | Lamp cards for 0.8.                  |  
  | Lamp Trips (0.8)     | 40–65 min  | Drivers decide with lamp info.                  | Monitor, record payoffs.                                                  | Lamp resolves the clash.                        | Trip envelopes, lamp cards, chips.   |  
  | Lamp Setup (0.6)     | 65–70 min  | Listen.                                         | Switch to 0.6 lamp cards.                                                 | Reliability changed.                            | New lamp cards for 0.6.              |  
  | Lamp Trips (0.6)     | 70–85 min  | Drivers decide with lamp info.                  | Highlight payoff differences for "lit" exits.                              | Conflict returns at low reliability.            | Trip envelopes, lamp cards, chips.   |  
  | Debrief              | 85–90 min  | Discuss, share insights.                        | Link to structure, read honest note, deliver closing.                     | The core problem: partial self-knowledge.       | Board notes, honest note script.     |  

