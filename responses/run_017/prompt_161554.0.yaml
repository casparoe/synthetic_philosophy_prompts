  ### Joint Statement on Interpersonal Utility Comparisons

  #### 1. Agreed Claims
  We both accept the following propositions as foundational:
  1. Resource allocation between patient groups requires comparing welfare impacts across individuals.  
  2. Utility is ordinally measurable *within* an individual (i.e., persons can rank their own well-being states).  
  3. Existing protocols (e.g., magnitude estimation, visual analog scales) attempt to quantify interpersonal utility comparisons (IUC).  
  4. The round-trip protocol is a methodologically valid test of IUC consistency.  
  5. Empirical IUC data often shows systematic variations correlated with individual differences (e.g., affective range).  
  6. Budget decisions must be made irrespective of IUC disputes, using defensible ethical principles.  

