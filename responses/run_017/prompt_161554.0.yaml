  | **2. Source of asymmetry:** Is persistent IUC inconsistency due to *fundamental* limitations or *correctable* noise? | Test if asymmetry decreases when: (a) subjects share immersive experiences (e.g., joint pain simulations), (b) AI adjusts for cognitive biases. | Asymmetry persists; experience/bias-correction narrows gaps ≤15% but never closes. | Asymmetry reduces to ≤5%; "noise" is correctable, leaving measurable signal. | **Both**: Persistent gaps support scepticism; near-closure supports constructivism. |  
