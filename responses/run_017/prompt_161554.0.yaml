  #### 2. Cruxes and Tests  
  | Crux | Accepted Test/Case | Sceptic’s Prediction | Constructivist’s Prediction | Result Would Move... (and Why) |  
  |------|---------------------|----------------------|-----------------------------|--------------------------------|  
