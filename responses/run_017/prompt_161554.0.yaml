  **Joint Statement on Interpersonal Utility Comparisons**

  We, the undersigned, after extensive discussion, have identified areas of agreement and disagreement regarding the possibility and nature of interpersonal utility comparisons (IUC). This statement aims to clarify our positions and outline how we might resolve our disagreements through empirical testing.

  ### 1. Agreed Claims
  We both accept the following statements:

  1. The committee's task of allocating a fixed budget between two patient groups requires making decisions that compare the well-being of individuals across groups.
  2. Well-being (utility) can be ordinally measured by an individual for their own states; that is, a person can rank different states of their own well-being.
  3. There are protocols designed to measure interpersonal utility comparisons, such as those that ask individuals to compare the well-being of others.
  4. The round-trip protocol (as described: asking A and B to compare each other, then routing through C) is a valid method to test the consistency of interpersonal utility comparisons.
  5. The round-trip protocol may show a residual asymmetry (failure to achieve consistent orderings) that can be quantified.
  6. Factors such as the degree of shared experience and similarity in affective range between individuals may affect the size of the residual asymmetry in the round-trip protocol.
  7. The committee must make a decision even if there is disagreement about the possibility of interpersonal utility comparisons.

  ### 2. Cruxes and Tests
  We have identified key points of disagreement (cruxes) that can be tested. The round-trip protocol will be used as the primary test case. Below, we state each crux, the test we both accept as relevant, and our respective predictions. We also note whose view would be moved by the outcome and why.

  | Crux | Accepted Test or Case | Sceptic's Prediction | Constructivist's Prediction | Whose view the result would move, and why |
  |------|------------------------|----------------------|-----------------------------|------------------------------------------|
  | 1. Can interpersonal utility comparisons achieve consistent results with sufficient calibration and shared experience? | Conduct multiple rounds of the round-trip protocol with increasing levels of calibration (training, shared experiences) and with pairs of individuals varying in affective range similarity. | The residual asymmetry will persist (at about one-third or more on average) despite calibration and shared experience, and will be systematically larger when the individuals differ more in affective range. | With sufficient calibration and shared experience, the residual asymmetry will diminish to near zero, and the effect of affective range differences will be minimized. | If the asymmetry persists, it supports the sceptic's view that IUC is inherently limited. If it diminishes, it supports the constructivist's view that IUC can be measured consistently. |
  | 2. Is the residual asymmetry in the round-trip protocol due to inherent limitations of IUC or to correctable factors? | After observing persistent asymmetry, conduct further tests to address potential noise, cognitive biases, and imperfect information (e.g., by providing more detailed scenarios, training, or debiasing techniques). | The residual asymmetry cannot be fully eliminated by addressing noise, biases, or information gaps, because it reflects the agent-relative nature of utility. | The residual asymmetry can be significantly reduced by improving the protocol to address noise, biases, and information gaps, indicating it is not inherent. | If the asymmetry remains after these interventions, it supports the sceptic. If it is reduced, it supports the constructivist. |

