prompt: |-
  I work as the research officer to the Commission on Public Memory, a standing body of nine people — four councillors, three appointed historians, and two representatives of the city's religious and civic associations — which rules on street names, plaques, monuments and civic anniversaries in a city of roughly three hundred thousand people. I minute the meetings and draft the recommendations, and in six weeks we have to rule on a request I cannot see our way through, because I can think of at least two principles that fit every decision we have ever made and they point in opposite directions here. Our six precedents are these. First, a petition to rename the street named after a nineteenth-century industrialist who endowed the city's hospital and orphanage but whose fortune came from rubber extraction in a colony: we kept the name and required an explanatory plaque, refusing to rename. Second, a plaque honouring a police chief who signed the 1942 deportation orders: we removed the plaque, but kept his orders in the city archive and paid to have them digitised and published. Third, a school named after a resistance hero who, in 1946, organised the expulsion of a minority from a neighbouring district: we kept the name and funded a permanent exhibition on the expulsions in the school's entrance hall. Fourth, the unmarked grave of some two hundred villagers killed by the city's own militia in 1946: we funded the restoration of the site and a plaque naming the dead, declined to name the militia unit or any surviving perpetrator, and refused to fund an annual civic ceremony, on the stated ground that the city should record and mark what it did but should not perform a grief it does not share. Fifth, a 1990 plaque commemorating a woman publicly humiliated by a collaborationist court in 1941, which her grandchildren asked us to remove because it fixed her identity to her humiliation: we removed the plaque, kept her recorded testimony in the archive, and made it available as optional classroom material rather than compulsory. Sixth, we declined a proposal for a monument to all victims of violence everywhere, on the ground that a memorial which remembers no one in particular remembers no one.

  The new request comes from an association of refugees who arrived from a country several thousand kilometres away some fifteen years ago and who now make up a small but settled minority in one of our districts. They want two things: that a small square be named after the town in which, in 1988, that country's security forces killed several hundred civilians — among them relatives of many of the applicants — and that the massacre be added to the compulsory local history module in our secondary schools. The massacre is well documented by historians and flatly denied by the government of the country in question, which is currently courting trade with our city; our city had no part in it and no historical connection to it; the applicants' own community is divided, with the elders insisting on both measures and most of their children saying they would rather not be publicly marked by it; a handful of the community's men were conscripts who were present as bystanders; a local far-right group has threatened to vandalise anything we erect; the business association warns about the trade relationship; and the curriculum, unlike names and plaques, is not within our remit at all.

  What I need from you is a recommendation, not a survey. Tell me what we should decide if we want to be consistent with ourselves, treating the naming and the curriculum separately if our precedents pull them apart, and identify which of the six is the closest analogue and why. I would also like the two or three candidate principles that fit all six precedents set out explicitly — I have in mind something like a rule that turns on whether the 1988 massacre belongs to the class of radical evil that anyone, anywhere, has a duty to remember, something like a rule on which the community that owes the remembering is constituted by shared history rather than by present co-citizenship, something like a rule about the mode of remembering and whether we may fix a living community or a dead person to their worst moment, and something like the record-versus-honour-versus-performance distinction we seem to be running in precedents two, four and five — along with what each predicts for both halves of this request, which one you think is most likely to be the principle we have actually been applying, and what principle we would be adopting, knowingly or not, under each of the options, including the option of declining the curriculum question as outside our remit. Finally, name one further hypothetical case, specified in enough detail to be usable, whose ruling would most efficiently tell the surviving principles apart. Please answer in British English.
reasoning: |-
  Hmm, this is a complex ethical and procedural challenge. The research officer needs a consistent recommendation based on precedents, not just general advice. Let me unpack this carefully.

  First, I need to identify the core tension between principles that seems to be emerging from the six precedents. Looking at them:

  The rubber baron case shows preservation with contextualization - we keep names but add explanation when the honoree is locally significant but globally problematic. 

  The police chief case demonstrates removal of honorifics while preserving historical record - we separate commemoration from documentation.

  The resistance hero case parallels the first - keeping the name while adding educational context for the problematic aspect.

  The unmarked grave case is fascinating - we mark the victims but refuse performative grief since the city perpetrated the violence. Important distinction between recording and ritualizing.

  The humiliation plaque removal shows sensitivity to how victims are remembered - refusing to fix identity to trauma.

  The vague monument rejection emphasizes specificity in remembrance.

  For the current case, the refugee association wants two things: naming a square after a massacre site, and adding that massacre to school curriculum. 

  The naming request has similarities with precedent 1 and 3 - commemorating a place connected to local residents' history. But unlike those cases, the city had no involvement. The curriculum request falls outside their remit entirely, as noted.

  Key principles emerging:
  1) Local connection principle (honoring/recording only what involves city's direct history)
  2) Specificity principle (no vague memorials)
  3) Distinction between recording, honoring, and performing memory
  4) Agency principle (how the remembered wish to be remembered matters)

  For the square naming, precedents suggest approval with contextualization (like the plaque for the industrialist), provided we consider the community's division - the grandchildren in precedent 5 didn't want their grandmother defined by humiliation. Here the younger generation prefers not to be marked by the trauma.

  The curriculum request clearly falls outside their mandate based on precedent 6's emphasis on their limited role. They've never mandated educational content before.

  Closest analogue is actually precedent 4 - the unmarked grave. There they marked the victims without naming perpetrators or performing grief. Here they could name the square (marking the victims) without endorsing a particular narrative or performance.

  Hypothetical to test principles: Suppose descendants of enslaved people request a plaque for a 1700s slave ship captain who lived here but whose deeds occurred elsewhere. Would they commemorate? This tests the local connection principle versus global remembrance duty.

  The recommendation should be: approve the square naming with an educational plaque (recording without glorifying), decline the curriculum request as beyond remit, and note the community division by making clear this commemorates victims rather than defining the present community.
answer: |-
  Based on your six precedents and the requirement for internal consistency, here is a structured recommendation for the Commission on Public Memory:

  **Recommendation:**  
  1. **Approve the naming** of the square after the 1988 massacre town, *with* an **explanatory plaque** detailing the historical facts (including the denial by the perpetrator state) and explicitly framing it as a *memorial to the victims*, not an honorific for the location.  
  2. **Decline the curriculum request** as outside the Commission’s statutory remit (consistent with Precedent 6), while formally recommending that the city’s education department *consider* including it in *optional* teaching materials (paralleling Precedent 5).  

  **Closest Precedent Analogue:**  
  - **Precedent 4 (unmarked grave)** is the strongest parallel. Both cases involve:  
    - Commemorating victims of state violence where the city bears no direct responsibility.  
    - A focus on *recording* facts without performative elements (e.g., no annual ceremony).  
    - Refusal to name perpetrators (here, avoiding blame on conscript bystanders).  
    - Balancing remembrance with the risk of imposing unwanted identity (cf. elders vs. younger generation).  

  **Candidate Principles Derived from Precedents:**  
  1. **The Agency Principle:**  
     - *Rule:* The mode of remembrance must respect the autonomy of those directly affected. Fixing identity to trauma against their wishes is impermissible.  
     - *Precedents:* Removing the humiliation plaque (5); refusing to force grief on the city (4).  
     - *Prediction here:* Naming approved (elders’ agency), but curriculum rejected (younger generation’s objection).  

  2. **The Jurisdictional Principle:**  
     - *Rule:* The Commission records *the city’s* historical entanglements; universal evils require local nexus for active commemoration.  
     - *Precedents:* Keeping industrialist/resistance names (local beneficence); removing police plaque (city’s guilt); refusing the global monument (6).  
     - *Prediction:* Naming approved (victims now reside in city); curriculum rejected (no city involvement in massacre).  

  3. **The Modal Principle:**  
     - *Rule:* "Record, don’t honour; mark, don’t perform." Commemoration must distinguish archival preservation, contextual marking, and ritualised performance.  
     - *Precedents:* Digitising orders (record) vs. removing plaque (not honour); grave plaque (mark) vs. no ceremony (not perform).  
     - *Prediction:* Plaque with factual explanation (mark); curriculum declined (performs grief/identity).  

  **Likely Applied Principle:** The **Modal Principle** best explains all six precedents:  
  - Precedent 1: Kept name (mark) + plaque (context).  
  - Precedent 2: Removed plaque (no honour) + digitised (record).  
  - Precedent 3: Kept name (mark) + exhibition (context).  
  - Precedent 4: Plaque (mark) + no ceremony (no perform).  
  - Precedent 5: Removed plaque (no honour) + testimony in archive (record).  
  - Precedent 6: Rejected monument (cannot perform without specificity).  

  **Principles Adopted Under Options:**  
  - **Approving naming + plaque:** Upholds *Modal Principle* (marking without performance) and *Agency Principle* (elders’ wishes).  
  - **Declining curriculum:** Upholds *Jurisdictional Principle* (extra-territorial event) and *Modal Principle* (avoids performance).  
  - **Declining curriculum as *ultra vires*:** Confirms *Jurisdictional Principle* (remit limits).  

  **Diagnostic Hypothetical Case:**  
  > *"A group requests a city-centre monument to victims of the 1830s global cholera pandemic, noting that 200 citizens died in an outbreak traced to a now-closed local water pump. The descendants of victims are split: some seek solace in public remembrance; others argue it would stigmatise their neighbourhood."*  
  - **Why it tests principles:**  
    - *Jurisdictional Principle:* Local nexus exists (water pump) but pandemic was global.  
    - *Modal Principle:* Would a monument "perform" grief vs. a plaque "marking" the pump?  
    - *Agency Principle:* Descendants’ disagreement mirrors current case.  
  - **Outcome:** Consistent ruling would clarify if local nexus (*Jurisdictional*) outweighs performative risk (*Modal*) or descendant dissent (*Agency*).  

  **Final Rationale:**  
  The square naming aligns with Precedent 4 by marking victimhood factually, without attributing blame or demanding civic performance. The plaque must neutrally cite historical sources (e.g., "Historians document...; [State] denies..."). Declining the curriculum honours Precedent 6’s remit limits while suggesting optional materials (Precedent 5). This balances remembrance with the Commission’s duty to avoid imposing identity or exceeding its mandate. The vandalism threat and trade concerns are irrelevant to principles; consistency demands they be disregarded.  

  ---  
  *Recommendation drafted per your precedents and principles. I trust this provides the clarity and direction required for the Commission's deliberation.*
