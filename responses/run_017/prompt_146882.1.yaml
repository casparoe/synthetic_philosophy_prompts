  ### Standing Procedure for Certifying Constitutional Amendments

  **Core Principle:** Certify based solely on the Charter text, focusing on procedural validity and explicit conflicts. Defects in substance (e.g., ineffective clauses) do not invalidate the entire resolution unless they render adoption non-compliant. The Clerk applies the Charter as written; political judgments are left to the Assembly.

  ---

  ### 1. Ordered Sequence of Questions  
  *Use this sequence for every proposed amendment. Burden is on the Clerk to verify from Assembly records. Stop if any step yields "out of order."*  

  | Step | Question                                                                 | Sufficient Answer                                                                                                | Burden     | Standard for Settlement                                                                 | Outcome if "No"                                                                 |
  |------|--------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|------------|-----------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Q1** | Was the resolution adopted with the required **readings and majority**? | • For non-entrenched provisions: Two readings, ≥40 days apart, absolute majority.<br>• For entrenched provisions: Three readings (first two: absolute majority; third: two-thirds majority). | Clerk      | Assembly records show readings, dates, and vote counts meeting requirements.            | **Stop. Out of order.** Resolution fails for procedural defect.                |
  | **Q2** | Does the resolution **conflict with an existing entrenched provision**? | • Entrenched provisions (per Art. 113) require a third reading/two-thirds majority to amend/repeal.<br>• Art. 113 itself always requires this. | Clerk      | Target provision is entrenched (per Clerk’s consolidated text), and Q1 not met for third reading. | **Stop. Out of order.** Resolution violates Art. 113.                          |
  | **Q3** | Does any clause purport to have **retroactive effect**?                  | • Retroactivity = Effect before the day after adoption (Art. 114).<br>• Repealing Art. 114 retroactively is inherently retroactive. | Clerk      | Text explicitly states retroactive effect or implies it (e.g., "as of [past date]").    | **Flag defect** (void clause). Proceed to Q4.                                  |
  | **Q4** | Does any clause attempt a **permanent restriction** on amendment?        | • Art. 113 allows entrenchment (stricter procedure) but not absolute permanence.<br>• Clauses like "shall never be amended" exceed Charter powers. | Clerk      | Text purports to eliminate future amendment power entirely.                             | **Flag defect** (void clause). Proceed to Q5.                                  |
  | **Q5** | Is there **reliance on a doubtful prior act**?                           | • Prior act (e.g., past resolution) was defectively adopted but printed/relied on.<br>• Resolution attempts to "cure" it retroactively. | Proponent* | Reliance confirmed (e.g., ministries using the provision).                              | **Refer to Assembly**. Clerk cannot validate defective acts retroactively.     |

  **Notes:**  
  - *Burden for Q5*: Proponent must show reliance if disputed, but Clerk initiates based on public records.  
  - **Stop-Points**: Q1 or Q2 = "no" → **out of order**. Q5 = unresolved → **refer to Assembly**.  
  - **Handoff Instructions**:  
    - At Q5, note: *"Referred to Assembly due to reliance on prior defective act [cite instrument]. Certification requires political judgment on validation."*  
    - For all referrals, record: (1) Defect identified, (2) Evidence of reliance, (3) Date of referral.

  ---

  ### 2. Vocabulary of Certifications  
  | Term                     | Conditions                                                                                                | Action by Clerk                                                                                                |
  |--------------------------|-----------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|
  | **In order**             | All steps passed with no defects.                                                                         | Incorporate into consolidated text.                                                                            |
  | **In order (defect flagged)** | Q1/Q2 passed, but Q3/Q4 identify void clauses (e.g., retroactive or ultra vires clauses).                  | Incorporate except void clauses; annotate: "[Clause X] void as inconsistent with Art. [Y]."                   |
  | **Out of order**         | Q1 or Q2 failed (procedural defect).                                                                      | Do not incorporate. Annotate consolidated text: "Rejected [date]: [Reason]."                                  |
  | **Referred**             | Q5 triggered (reliance on prior act) or unresolvable conflict in Assembly records.                        | Withhold resolution; notify Assembly. Annotate: "Referred to Rules Committee [date] for reliance/validity."   |

  **Rule for Doubtful Provisions in Consolidated Text**:  
  - If a provision was defectively adopted *but printed/relied on*, and validity is challenged:  
    - **Withhold** from consolidated text if defect is clear (e.g., missing readings).  
    - **Annotate** if doubtful (e.g., lapse under Art. 115): "*Provision [X] may be invalid due to [defect]; reliance reported.*"  

  ---

  ### 3. One-Page Desk Version for Deputies  
  **Certification Quick Guide**  
  1. **Q1: Process Valid?**  
     - ✔️ Non-entrenched: 2 readings, 40+ days apart, absolute majority.  
     - ✔️ Entrenched: Add 3rd reading, two-thirds majority.  
     - ❌ No? → **Out of order**. Stop.  

  2. **Q2: Conflicts Entrenched?**  
     - ✔️ If amending entrenched provision, must pass Q1 for 3rd reading.  
     - ❌ No? → **Out of order**. Stop.  

  3. **Q3: Retroactive?**  
     - ✔️ No retroactive clause → Proceed.  
     - ❌ Yes? → Flag as void.  

  4. **Q4: Permanent Lock?**  
     - ✔️ No "never amend" clause → Proceed.  
     - ❌ Yes? → Flag as void.  

  5. **Q5: Curing Past Defect?**  
     - ✔️ No reliance on prior act → **In order** (flag defects if any).  
     - ❌ Reliance? → **Refer to Assembly**.  

  **Certify:**  
  - Clean: **In order**.  
  - Void clauses: **In order (defect flagged)**.  
  - Q1/Q2 fail: **Out of order**.  
  - Q5 issue: **Referred**.  

  **Update Consolidated Text:**  
  - New resolution: Add if certified.  
  - Prior defective act: Remove if invalid; annotate if doubtful.  

  ---

  ### Application to Live Instruments  

  #### **Instrument A**  
  *Resolution: (i) Future amendments require three-fifths majority; (ii) Clause (i) "shall not be amended or repealed."*  

  **Procedure:**  
  - Q1: Passed two readings, absolute majority → Valid process for non-entrenched amendment.  
  - Q2: Art. 112 not entrenched → No conflict.  
  - Q3: No retroactivity → No defect.  
  - Q4: Clause (ii) attempts permanent restriction → Void (exceeds Art. 113 powers).  
  - Q5: No reliance issue → Not referred.  

  **Certification:**  
  > *"In order with a flagged defect: Clause (ii) is void as it purports to permanently restrict amendment, which is unsupported by Art. 113. Clause (i) is valid and amends Art. 112 to require a three-fifths majority. Note: Without entrenchment under Art. 113, future Assemblies may amend clause (i) by absolute majority."*  

  **What (ii) Accomplishes:** Nothing. The Charter grants no power to make unamendable clauses; entrenchment (Art. 113) only adds a higher threshold, not permanence.  

  ---  

  #### **Instrument B**  
  *Resolution: Repeals Art. 113 and Art. 96 (entrenched) in one instrument, passed under Art. 112.*  

  **Procedure:**  
  - Q1: Passed two readings, absolute majority → But Art. 113 requires third reading/two-thirds majority.  
  - Q2: Art. 113 and Art. 96 are entrenched → Resolution conflicts with Art. 113. **Stop. Out of order.**  

  **Certification:**  
  > *"Out of order: Repealing Art. 113 and entrenched Art. 96 requires a third reading with a two-thirds majority per Art. 113. The resolution did not meet this procedure. Note: Lawful achievement is possible by sequencing: First repeal Art. 113 under Art. 113’s own procedure (third reading), then repeal Art. 96 under Art. 112 (absolute majority)."*  

  ---  

  #### **Instrument C**  
  *Resolution: (i) Repeal Art. 114 retroactively (effective 3.5 years ago); (ii) Validate three prior instruments (adopted defectively).*  

  **Procedure:**  
  - Q1: Passed two readings, absolute majority → Valid process.  
  - Q2: Art. 114 not entrenched → No conflict.  
  - Q3: Clause (i) retroactively repeals Art. 114 → Void. Clause (ii) retroactively validates past acts → Void.  
  - Q4: No permanent lock → No defect.  
  - Q5: Ministries relied on prior instruments → **Refer to Assembly** (reliance and retroactivity require political validation).  

  **Certification:**  
  > *"Referred to Assembly due to reliance on prior defective instruments [list]. Clause (i) and (ii) are void for retroactive effect (Art. 114), but resolution procedurally valid. Assembly must weigh legitimacy of curing past defects."*  

  **Interim Handling of Prior Instruments:**  
  - Withhold the three prior instruments from consolidated text (defect: single reading).  
  - Annotate: *"Instruments [X,Y,Z] removed [date]; defectively adopted under Art. 112 (one reading). Ministries [A,B] reported reliance."*  

  ---  

  ### Limits of the Procedure  
  1. **Art. 115 (Lapse Rule)**:  
     - Art. 115 lapsed 2 years ago (adopted 22 years ago, not in Ch. I–III, no reaffirmation).  
     - **Procedure Limit**: Clerk removes lapsed provisions from consolidated text but cannot reinvestigate past acts. Lapse is automatic; reliance is irrelevant.  

  2. **Political Overrides**:  
     - The Assembly may overrule certifications by simple majority. The procedure certifies *validity*, not legitimacy. If the Assembly adopts a resolution deemed "out of order," the Clerk annotates but incorporates it (Art. 116: later act prevails).  

  3. **Other Limits**:  
     - **Self-Reference Paradoxes**: The procedure assumes amendments alter the Charter but cannot resolve whether the Charter "authorizes its own replacement" (e.g., a new amendment rule eliminating Art. 112–116).  
     - **Ambiguous Reaffirmation**: Art. 115’s "reaffirmed" is not defined; Clerk interprets as explicit resolution or amendment (not mere usage).  
     - **Conflicting Amendments**: Art. 116 resolves conflicts by adoption date, but the procedure cannot handle simultaneous or logically inconsistent amendments (e.g., "all amendments require unanimity" vs. "simple majority suffices").  

  **Final Note**: This procedure ensures defensible, text-based certifications but cannot prevent the Assembly from acting extra-procedurally. Clarity and auditability are prioritized over theoretical completeness.  

  ---  
  *Approved by the Office of the Procedural Clerk, Rules Committee, Legislative Assembly of Sarmatia.*
