  Wait, the user mentioned avoiding counterfactuals. Perfect—the librarian *could* ask but won’t, per policy. That’s the bureaucratic absurdity. The joke cheats because revealed preference doesn’t forbid asking; it just prioritizes choices. Economists would nod at the overstatement. 

