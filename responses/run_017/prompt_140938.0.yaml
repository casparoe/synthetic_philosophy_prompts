       X: 0.5*100 + 0.5*1 = 50.5  
       Y: 0.5*1 + 0.5*10 = 5.5  
     So expected value says X. But if we can't compare the scales, we might not be able to say that 100 lives in A is comparable to 10 lives in B. This is the intertheoretic comparison problem.

     *Question*: Do you donate to X, to Y, or split? If you choose X, you are doing expected value. If split, proportional. If you think they are incomparable and choose arbitrarily, then you are not aggregating.

  3. **Splitting Case (mixed option)**  
     - *Scenario*: You have $1000 to donate. Theory A (50% credence) says it should all go to curing disease X (saves 10 lives). Theory B (50%) says it should all go to curing disease Y (saves 10 lives). A mixed option: spend $500 on each, which saves 5 lives from X and 5 from Y. Do you choose all X, all Y, or split?  
     - *Branch*: Split -> proportional. All X or all Y -> not splitting (might be my favorite theory or expected value if the outcomes are the same).

  4. **Deontic Case (forbidden action)**  
     - *Scenario*: You can take an action that would save 5 lives. Theory A (99% credence) says it is obligatory. Theory B (1% credence) says it is forbidden (because it violates a right). Do you take the action?  
     - *Branch*: If yes, you are aggregating by expected value or ignoring low credence. If no, you are risk-averse or deontic-focused.

  5. **Moral Status Uncertainty Case**  
     - *Scenario*: You can use a drug that was tested on animals. If animals have moral status (10% credence), then this drug causes great harm. If they don't (90%), then the drug is harmless and saves human lives. Do you use the drug?  
     - *Branch*: This can help separate risk-averse views.

  6. **Group Allocation Case**  
     - *Scenario*: You are allocating a $1000 budget for a group. Member A (50% of group) wants to spend it on charity X, member B (50%) on charity Y. Do you split the money?  
     - *Branch*: Distinguishes individual from group decisions.

  7. **Option Preservation Case**  
     - *Scenario*: You can buy a non-refundable ticket to a conference now for $100, or wait and buy it later for $200. You are currently uncertain about whether attending the conference is the right thing (it might conflict with a family obligation). Waiting preserves the option to decide later. Do you buy now or wait?  
     - *Branch*: If wait, you are option-preserving.

