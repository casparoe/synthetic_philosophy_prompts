  We are constructing a self-scoring handout to classify readers into one of several ethical decision-making approaches under moral uncertainty. The classification must be based on responses to cases, without naming positions, authors, or first-order theories. We'll break the task into three main parts: the logical space (questions that define the tree), the positions (leaves) and their awkward commitments, and the diagnostic material (cases and questions).

  ## Part 1: Logical Space (Key Distinctions)

  The logical space is defined by a set of branching questions. The most important distinction is:

  1. **Distinction (i): Moral vs. Non-Moral Uncertainty**  
     - This branch separates cases where the uncertainty is about moral facts (e.g., whether an action is wrong) from cases where it's about non-moral facts (e.g., whether a drug will work) that have moral implications. This is crucial because many readers might confuse the two.

  The next key distinctions:

  2. **Distinction (ii): Value vs. Deontic Status**  
     - For moral uncertainty: whether the uncertainty is about which option is best (value) or which are permitted/forbidden (deontic status). This affects whether we aggregate by expected value or by avoiding forbidden acts.

  3. **Distinction (iii): Aggregation and Scaling**  
     - If aggregating, we must ask:  
       a. Does the view aggregate across the moral views one holds?  
       b. If so, can differences in value (or deontic status) be compared across theories? (intertheoretic comparison)  
       c. How is scaling handled? (e.g., normalizing the value functions)

  4. **Distinction (iv): Individual vs. Group Decision**  
     - Is the decision for oneself or for a group with disagreement? This might not be a primary branch but could be a modifier or a separate path.

  5. **Distinction (v): Self-Effacement and Higher-Order Uncertainty**  
     - Does the rule for uncertainty apply to itself? (e.g., if uncertain about the rule, do we apply the same rule again?) and whether the rule is expected to be self-effacing.

  The most important distinction is (i) because without it, non-moral uncertainty might be misclassified as moral. Then (ii) and (iii) are crucial for the aggregation methods.

  ## Part 2: Positions (Leaves) and Their Awkward Commitments

  We aim for 10-12 leaves. We'll list them with a brief description and one sentence on the awkward commitment.

  1. **Expected Moral Value Maximization (unnamed? sometimes called "maximizing expected choiceworthiness")**:  
     - Aggregate across moral views by taking the expected value (weighted by credence) of each option and choose the one with the highest.  
     - *Awkward commitment*: It requires intertheoretic comparisons of value, which might be hard to justify.

  2. **My Favorite Theory (unnamed? or "credence-weighted dogmatism")**:  
     - Act according to the moral view you assign the highest credence to, ignoring other views.  
     - *Awkward commitment*: It ignores potentially catastrophic risks from low-credence theories that forbid the action.

  3. **Lexical Avoidance of the Worst (often called "minimax" or "risk-averse")**:  
     - Avoid the option that has the worst possible outcome according to any theory with non-zero credence, unless all options are equally bad in the worst case.  
     - *Awkward commitment*: It can lead to paralysis if every option is forbidden by some theory.

  4. **Proportional Satisfaction (unnamed? or "compromise")**:  
     - Split resources or choose a mixed strategy to satisfy each moral view in proportion to its credence.  
     - *Awkward commitment*: It might result in actions that no moral theory endorses (e.g., a compromise between saving humans and saving animals might save half a human and half an animal).

  5. **Blameworthiness Avoidance (unnamed? or "excusability-focused")**:  
     - Choose an option that minimizes the risk of being blameworthy (i.e., if you do X and it turns out X is wrong, you are blameworthy only if you couldn't have reasonably known).  
     - *Awkward commitment*: It might prioritize avoiding blame over doing what is actually best, and it depends on social/epistemic norms.

  6. **No Moral Uncertainty (unnamed? or "moral realist dogmatism")**:  
     - There is a fact of the matter about morality, so you should do what you believe is right and not hedge.  
     - *Awkward commitment*: It doesn't address the possibility of being mistaken.

  7. **Hedging as Vice (unnamed)**:  
     - Moral hedging is itself a moral failing (e.g., lack of integrity).  
     - *Awkward commitment*: It might require acting against strong moral reasons from a credible theory.

  8. **Option Preservation (unnamed? or "precautionary")**:  
     - When possible, preserve options to avoid foreclosing future moral insights.  
     - *Awkward commitment*: It might lead to inaction or suboptimal choices due to constant deferral.

  9. **Group Compromise (unnamed)**:  
     - For group decisions, allocate resources proportionally to the preferences of the members.  
     - *Awkward commitment*: It might not reflect the moral truth but rather a democratic procedure.

  10. **Second-Order Application (unnamed? or "iterative")**:  
      - Apply the same rule for uncertainty to the choice of the rule itself.  
      - *Awkward commitment*: It might lead to infinite regress (e.g., uncertainty about the rule for uncertainty).

  11. **Deontic Aggregation (unnamed)**:  
      - Aggregate deontic statuses (e.g., avoid an action if the weighted credence of it being forbidden is too high).  
      - *Awkward commitment*: It requires comparing the "wrongness magnitudes" across theories, which might be incommensurable.

  12. **Scaled Expectation (unnamed)**:  
      - Like expected moral value but with a scaling procedure (e.g., normalize each theory's value function).  
      - *Awkward commitment*: The scaling method is arbitrary and may change the recommendation.

  We can adjust to 12 leaves by including variations.

  ## Part 3: Diagnostic Material (Cases and Questions)

  The tree will be built by asking questions based on cases. We must cover:

  - Tiny-credence case
  - Scaling case
  - Splitting case
  - Deontic case
  - Moral status uncertainty case
  - Group allocation case
  - Option preservation case

  ### Proposed Cases:

  1. **Tiny-Credence Case (avoiding catastrophe)**  
     - *Scenario*: You can press a button that gives you $1000. A theory you assign 0.001% credence to says pressing the button kills a person painlessly and invisibly. All other theories say it's harmless. Do you press it?  
     - *Branch*: If yes, then you are not risk-averse. If no, you might be in the lexical avoidance or blame-avoidance.

  2. **Scaling Case (comparing across theories)**  
     - *Scenario*: You have $1000 to donate. Theory A (50% credence) says charity X saves 10 lives per $1000 and charity Y saves 5. Theory B (50% credence) says charity Y saves 10 lives and charity X saves 5. Both agree that saving a life is the only good. Which charity do you donate to?  
     - *Branch*: If you choose X or Y arbitrarily, you don't do intertheoretic comparisons. If you split the money, you are proportional. If you can say one theory's scale is larger (but they both say 10 is best and 5 is worse) then scaling is possible? Actually, this case might not show scaling because the differences are symmetric. We need a case with asymmetric differences.

     Revised Scaling Case:  
     - Theory A (50%): Charity X saves 10 lives, Charity Y saves 1 life.  
     - Theory B (50%): Charity X saves 1 life, Charity Y saves 10 lives.  
     Now, if you choose X: you are following Theory A? But both theories are symmetric. So the expected value of X is (0.5*10 + 0.5*1) = 5.5, and Y is (0.5*1 + 0.5*10)=5.5. So they are equal. We need a case where the scales might be different.

     Alternative Scaling Case:  
     - Theory A (50%): Charity X saves 100 lives, Charity Y saves 1 life.  
     - Theory B (50%): Charity X saves 1 life, Charity Y saves 10 lives.  
