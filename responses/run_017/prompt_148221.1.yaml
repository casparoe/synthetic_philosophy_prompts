  We need to compute the expected loss for each type of question for a given reporting policy.

  The expected loss for a single question with true probability p (of yes) and reported r is:
    L(r, p) = p * (1-r)^2 + (1-p) * 3 * r^2

  We can expand this:
    L(r, p) = p*(1 - 2r + r^2) + 3*(1-p)*r^2
            = p - 2pr + p r^2 + 3r^2 - 3p r^2
            = p - 2pr + (p - 3p) r^2 + 3r^2
            = p - 2pr + (3 - 2p) r^2

  Alternatively, we can write:
    L(r, p) = p*(1-r)^2 + 3*(1-p)*r^2

  We'll compute the expected loss for each bucket and then sum.

  First, let's define the buckets and the number of questions:
  - Bucket A: 40 questions, p=0.8
