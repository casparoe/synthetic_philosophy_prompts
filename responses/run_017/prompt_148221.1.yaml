  ### Analysis of Reporting Policies Under Asymmetric Brier Scoring

  **Setup:**  
  - 100 questions: 40 at true \(p = 0.8\) (80% yes), 40 at \(p = 0.3\), 20 at \(p = 0.5\).  
  - Scoring rule:  
    - Answer yes: loss = \((1 - r)^2\)  
    - Answer no: loss = \(3r^2\) (false positives cost 3× more than false negatives).  
  - Expected loss per question: \(L(r, p) = p(1 - r)^2 + (1 - p) \cdot 3r^2\).  
  - **Goal:** Sort reporting policies by total expected loss, identify tiers, and provide loss estimates.  

  ---

  ### Expected Loss Rankings (Lower Loss is Better)
  **Tiers and Loss Estimates:**  
  | Tier | Policy                 | Total Loss | Why                                                                 |
  |------|------------------------|------------|---------------------------------------------------------------------|
  | 1    | Sam the squarer        | 32.1       | Squaring pulls \(r\) toward 0, reducing costly false positives.    |
  | 2    | Dan the dampener       | 33.4       | Halving \(r\) shifts reports down, penalizing false positives less. |
  | 2    | Cara the constant shifter | 34.1     | Shifting \(r\) down by 0.1 avoids high false positives.            |
  | 3    | Faye                   | 39.6       | \(r = p/(p+3)\) undershoots optimal damping, especially at high \(p\). |
  | 3    | Honest                 | 40.1       | Proper only for symmetric rules; asymmetry makes honesty suboptimal. |
  | 4    | Hannah the hedger      | 41.8       | Shifting toward 0.25 is too mild to avoid false-positive penalties. |
  | 5    | Erin the extremist     | 66.0       | Extreme reports incur massive false-positive costs.                |
  | 5    | Moe                    | 67.0       | Inverted asymmetry amplifies losses in all buckets.                |

  **Loss Details:**  
  - **Sam:** Optimal damping for high-\(p\) questions (e.g., \(p=0.8 \to r=0.64\)).  
  - **Dan/Cara:** Conservative shifts reduce false positives but slightly overshoot.  
  - **Faye/Honest:** Honest is outperformed by damping; Faye’s rule is too aggressive.  
  - **Hannah:** Mild hedging doesn’t adjust enough for asymmetry.  
  - **Erin/Moe:** Extreme or inverted reports maximize penalties.  

  ---

  ### Optimal Reporting Rule
  **Formula:** \(r = \frac{p}{3 - 2p}\)  
  - **Derivation:** Minimize \(L(r, p)\) by solving \(\frac{dL}{dr} = 0\):  
    \[
    -2p(1 - r) + 6(1 - p)r = 0 \implies r = \frac{p}{3 - 2p}.
    \]
  - **Examples:**  
    - \(p = 0.8 \to r \approx 0.57\)  
    - \(p = 0.3 \to r = 0.125\)  
    - \(p = 0.5 \to r = 0.25\)  
  - **Why it works:** Balances false-positive avoidance while retaining some signal for true positives.  

  ---

  ### Re-Ranking After Weight Swap (False Negatives Now Cost 3× More)
  **New Rule:**  
  - Answer yes: loss = \(3(1 - r)^2\) (missing a real cost = 3)  
  - Answer no: loss = \(r^2\) (false alarm cost = 1).  

  **Damage Ranking (Worst-Hit First):**  
  | Rank | Policy                 | Damage (Loss Increase) | Why                                                                 |
  |------|------------------------|-------------------------|---------------------------------------------------------------------|
  | 1    | Faye                   | +72.8                  | Over-damped reports now miss true positives severely.               |
  | 2    | Dan the dampener      | +46.6                  | Conservative reports miss true positives under new weights.         |
  | 3    | Sam the squarer       | +31.2                  | Squared reports are too low, amplifying true-positive misses.       |
  | 4    | Cara the constant shifter | +15.0                | Downshifted reports hurt more when false negatives are costly.      |
  | 5    | Hannah the hedger     | +0.8                   | Mild hedging minimizes damage but slightly increases loss.          |
  | 6    | Honest                | -1.0                   | Honesty adapts decently; minor improvement.                         |
  | 7    | Erin the extremist    | -12.0                  | Extreme reports reduce false negatives (benefits from swap).        |
  | 8    | Moe                   | -36.4                  | Inverted asymmetry accidentally aligns with new weights.            |

  **Key Insight:** Policies optimized for the original asymmetry (e.g., Faye, Dan) suffer most when weights swap. "Wrong" rules (Moe, Erin) benefit accidentally.  

  ---

  ### Epistemological Implications
  The lopsided rule shows that **the accuracy-first argument for probabilism assumes symmetry**; without symmetry, there’s no unique "accuracy" independent of decision costs. Asymmetric scoring rules embed contextual trade-offs (e.g., "don’t waste attention") rather than measuring purely alethic accuracy.
