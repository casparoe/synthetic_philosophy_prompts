  The accuracy-first argument for probabilism (i.e., that one should have coherent credences) typically assumes symmetric scoring rules, like the symmetric Brier score. In that case, the unique proper scoring rule (up to some transformations) leads to reporting true credences. But when we have an asymmetric loss, the proper scoring rule for that specific loss function leads to a transformation of the true credence. 

  The lopsided scoring rule is still measuring accuracy, but in a way that is tailored to the decision context (the asymmetry in costs). The rule is proper for the transformed report: the optimal report is a function of the true p that minimizes the expected loss. It is not that it isn't measuring accuracy, but that the accuracy is being measured in a way that accounts for the different costs of errors. 

