prompt: |-
  I am a novelist, and the book I have been failing to finish turns on a scene I have now rewritten nine times. A clinical-trial coordinator — conscientious, badly overworked, two days behind on her inbox — tells an enrolled patient, in perfect sincerity and on the strength of the safety summary she read the previous week, that the trial drug "hasn't shown any serious side effects." The latest safety memo, which she has not opened, complicates that sentence without quite falsifying it. Nobody lies to anybody; there is an unread email. Returning to it for the tenth time, I find that none of the standard accounts of assertion tells me what I want to know about her. The view I have drifted into, which I would like stress-tested rather than defended, is this: assertion is permissible just when the speaker is in a position to know, where the warrant may be partly borrowed from testimony, instruments and institutional chains the speaker has not personally audited, so long as the borrowing is not reckless — and where the amount of warrant required is calibrated not to the speaker's practical stakes but to what is at stake for the hearer. Call it the borrowed-warrant view with a hearer-stakes rider. It earns its keep, I think, on cases like my coordinator's (her own stakes are trivial; the patient's are not; the criticism she merits seems to be a criticism about calibration rather than about ignorance) and on cases where the divergence is reversed: asserting a well-confirmed scientific result to a stranger in a bar, or a stubborn true claim to someone who will be made worse off by believing it, seems fine on ordinary warrant even though the hearer's stakes are, respectively, nil and perverse.

  What I want from you is a map of this view's exposure, not a defense of it. What would have to be true, or to happen, for it to be false? I would like the defeaters sorted by how much damage they actually do — fatal, serious, merely awkward — and I want you to separate what a committed defender would concede as counting against the view from what she would, rightly or wrongly, wave off. Please include: cases where hearer-stakes calibration and my intuitions come apart (extremes of hearer stakes that seem not to raise or lower the bar at all; hearers whose stakes are self-imposed or hostile); the suspicion, raised by a friend in my writing group, that the view is only the familiar knowledge norm wearing a different hat, and that if it collapses into a rival the interesting question was never which norm it is; the actionability worry that a speaker usually cannot know what is at stake for her hearer, so that a hearer-relative norm may not be one anyone could follow, together with whatever the view should say about ought-implies-can here; the no-hearer cases — diary entries, soliloquy, a narrator's assertions in a novel, which matter to me professionally, since if assertion in fiction is governed by no norm at all I want to know whether that is a principled exemption or an ad hoc one; and any consequence the view is stuck with that its rivals avoid. Also tell me, honestly, whether it predicts anything its rivals do not, or whether it has been quietly qualified into a form that nothing could dislodge — and if it has, whether for a view of this kind that is a defect or simply the normal condition of a norms-of-assertion theory.

  For my own part, I am moved much more by concrete cases where my view and the knowledge norm diverge and my intuition sides against me than by arguments from the point or constitutive aim of the practice of assertion, which always seem to me to be redescribable to fit whatever norm is on offer; and I am more worried by the collapse objection than by any single counterexample. Structure your answer however you like, but give me your bottom line in the very first sentence — the one consideration you find most damaging, or a flat statement that the view is better insulated than I think — and only then the reasoning, with no preamble, no restatement of what I have asked, and no throat-clearing about how contested these matters are.
reasoning: |-
  Okay, I need to really unpack this novelist's query. They're stuck on a pivotal scene about a clinical trial coordinator making an assertion with incomplete information. Their core idea is that assertion permissibility hinges on the speaker having borrowed warrant (not personally verified) that's calibrated to the hearer's stakes, not the speaker's. They want me to stress-test this "borrowed-warrant view with hearer-stakes rider" without defending it. 

  First, I notice how specific their concerns are: they want defeaters categorized by damage level (fatal/serious/awkward), distinctions between what a defender would concede versus dismiss, and explicit coverage of several thorny areas like extreme hearer stakes, self-imposed stakes, the "collapse into knowledge norm" suspicion, actionability issues, no-hearer cases, and comparative consequences. The novelist seems philosophically sophisticated - they've clearly wrestled with assertion literature but find standard accounts inadequate for their fictional scenario.

  Hmm... their rejection of "point of practice" arguments resonates - those can indeed be bent to fit any norm. And their fear of the collapse objection outweighs counterexamples, which tells me I should prioritize analyzing whether their view meaningfully differs from knowledge norms. The professional concern about fictional assertions is also crucial since it impacts their craft.

  Let me mentally flag the key components to attack: 
  - The permissibility of borrowing warrant without recklessness 
  - Hearer-stakes calibration overriding speaker-stakes 
  - The non-reliance on intentional deception 

  For the bottom line... after running through all the angles, I think the actionability problem is the sharpest thorn. If speakers can't reasonably know others' stakes, the norm becomes unusable. But I'll save that punchline for the response.

  The novelist's examples are clever - especially asserting well-confirmed science to a bar stranger (hearer stakes nil) versus the coordinator case (hearer stakes high). These feel intentionally designed to strain standard accounts. I should probe if their view handles the inverse: low-stakes assertions to high-stakes hearers, like casually mentioning "it might rain" to someone deciding on a life-saving outdoor surgery.

  For no-hearer cases... diaries and narrations. If their norm doesn't cover these, is that a flaw? Maybe not, since the hearer-stakes rider logically can't apply. But then what governs such assertions? That needs addressing. 

  The collapse worry is subtle. Their friend suspects it's just the knowledge norm disguised. I'll need to dissect whether hearer-stakes calibration introduces something new or if "position to know" absorbs all the work. Williamson might argue knowledge already accounts for stakes via practical environments... 

  *Pausing to structure* 
  I'll lead with the actionability concern as most damaging, then systematically hit: 
  1. Calibration paradoxes (extreme/self-imposed stakes) 
  2. Collapse analysis 
  3. Actionability deep dive 
  4. No-hearer exemptions 
  5. Comparative drawbacks 
  ...all while tagging damage levels. 

  The novelist hates throat-clearing, so I'll jump straight in after the bottom line. Their intellectual honesty about wanting stress-tests rather than defenses is refreshing - this will be a satisfying challenge.
answer: |-
  ### Bottom line: The actionability problem (speakers typically cannot know hearers' stakes) inflicts **serious damage**—potentially fatal without ad hoc adjustments—because it undermines the norm's practical followability and clashes with ought-implies-can.  

  ---  
  ### Defeaters Sorted by Damage & Defensive Responses  
  **Fatal Damage** (Defender concedes; threatens core coherence):  
  1. **Actionability & Ought-Implies-Can**:  
     - **Problem**: Speakers rarely know their hearer's true stakes (e.g., the coordinator can't gauge the patient's emotional state, hidden vulnerabilities, or unspoken reliance on her words). If the norm demands calibration to *unknowable* stakes, it cannot guide action.  
     - **Ought-Implies-Can Collapse**: If speakers *ought* to calibrate to hearer-stakes but *cannot* reliably do so, the norm is inert.  
     - **Defender's Concession**: Yes, this is a critical flaw. Response: Retreat to "reasonable expectation of stakes" (e.g., clinical contexts imply high stakes). *Damage*: This shrinks the view to speaker-stakes or context-stakes, gutting the hearer-centric core.  

  **Serious Damage** (Defender struggles; requires weakening the view):  
  2. **Self-Imposed or Hostile Hearer Stakes**:  
     - **Problem**: A reckless gambler (high self-imposed stakes) asks about coin flips; a hostile interrogator (high adversarial stakes) demands truth. Your view demands extra warrant, but intuition says a simple "heads" assertion requires only minimal warrant.  
     - **Defender's Move**: Argue that self-imposed/hostile stakes are "irrelevant" to the norm. *Damage*: This exposes arbitrariness—why do *some* hearer-stakes count but not others?  
  3. **Extreme Stakes as Asymmetric Triggers**:  
     - **Problem**: Very high stakes (e.g., "Will this bridge collapse?") seem to *raise* the warrant bar, but very low stakes (e.g., trivia answers) don’t *lower* it—we still require basic warrant. Your view predicts symmetric calibration, but intuition is asymmetric.  
     - **Defender's Response**: Claim low stakes permit "borrowing" more freely. *Damage*: Reveals the rider is a one-way valve, making it a mere high-stakes caveat, not a general calibrator.  
  4. **Collapse into Knowledge Norm**:  
     - **Suspicion**: "Position to know" + "no recklessness" mirrors the knowledge norm's requirements. Hearer-stakes may just be a *consequence* of knowledge being stakes-sensitive (e.g., Fanti & McGrath).  
     - **Defender's Pushback**: Knowledge norms ignore hearer-specificity—e.g., asserting to a barfly requires the *same* warrant as asserting to a patient. *Damage*: If "position to know" absorbs stakes-sensitivity (via practical environment), the rider adds nothing.  

  **Awkward Damage** (Defender waves off; costs theoretical elegance):  
  5. **No-Hearer Cases (Diaries, Fiction, Soliloquy)**:  
     - **Problem**: A novelist’s assertion in narration has no hearer. Your norm doesn’t apply, suggesting assertion is ungoverned here—but this feels ad hoc.  
     - **Defender's Reply**: Fiction isn't "assertion" but quasi-assertion; diaries are self-directed speech with the speaker as hearer. *Damage*: This exempts core cases you care about, implying your view isn’t about assertion *simpliciter*.  
  6. **Perverse Stakes Cases**:  
     - **Problem**: Asserting truth to someone who will misuse it (e.g., "Your rival is in Paris" to a stalker). Your view permits this if warrant is strong (hearer’s "stakes" are perverse, not your problem). Intuition often sides with you, but rivals (e.g., moral encroachment) might forbid it.  
     - **Defender's Shrug**: The norm is epistemic, not moral. *Damage*: Acceptable, but highlights incompleteness.  

  ---  
  ### Comparative Consequences & Predictions  
  - **What Your View Predicts That Rivals Don’t**:  
    It uniquely *denies* that the coordinator acts impermissibly if her *own* stakes are low and warrant was reasonably borrowed (unlike speaker-stakes views). It *permits* high-warrant assertions to perverse-hearers (unlike moral norms).  
  - **Costs vs. Rivals**:  
    - **Knowledge Norm**: Avoids actionability issues but can’t explain why the coordinator is *less* blameworthy than a low-stakes liar.  
    - **Reasonable-Belief Norm**: Handles borrowing better but ignores stakes.  
    - **Moral Norms**: Capture hearer-sensitivity but overextend to forbid "harmful truths."  
  - **Quiet Qualification Risk**: Yes, the view *is* being qualified into near-untestability. "Not reckless" and "reasonable expectation of stakes" are flexible shields. **Is this fatal?** Not uniquely—all assertion norms rely on elastic qualifiers (e.g., "reasonable," "salient").  

  ---  
  ### Verdict  
  Your view’s **hearer-stakes rider is its Achilles’ heel**: it demands the impossible (knowing others' stakes) and defaults to context-stakes under pressure, collapsing toward conventional rival theories. Yet it *does* explain your coordinator case more elegantly than alternatives. If you retain the rider, **constrain it to contexts where stakes are transparent** (e.g., professional roles) and accept that fiction operates under distinct conventions. The collapse objection is survivable, but the actionability problem is not—**ground your climactic scene in the coordinator’s institutional (not hearer-specific) obligation**.  

  ---  
  *Final note: This map assumes you want philosophical rigor, not novelistic resolution. In practice, fiction thrives on the ambiguities that torture norms—your nine rewrites may be a feature, not a bug.*
