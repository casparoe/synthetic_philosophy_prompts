prompt: |-
  Hi — I'm trying to get a proper gut-level feel for Lewis's triviality result for indicative conditionals, and I've wrote the argument out a few times now but still feel like I'm just pushing symbols around. Could you help me see *why* it goes wrong? British English please, and please don't give me a reading list or a tour of named positions — I've got no web access where I'm writing this, so I need it reasoned out from scratch.

  Where I've got to. The tempting thesis is that the probability of an indicative conditional just is the corresponding conditional probability: for a credence function P, the probability of if A then C equals P(C given A). Lewis's result is supposed to show this can't hold in full generality, because it collapses into everything being probabilistically independent of everything else — which would mean nothing could ever be evidence for anything. Concretely: fair die, A = the roll came up even, C = it came up six. P(C given A) is 1/3, so the thesis says the conditional gets probability 1/3. But split its probability by whether C holds: conditional on six, the conditional if even then six should be certain; conditional on not-six, it should be impossible. That gives 1 × 1/6 + 0 × 5/6 = 1/6. Contradiction, and the general version apparently gives P(C given A) = P(C) full stop.

  Here's the bit I actually care about, because it's where I'm stuck. A friend says the identity version was always a strawman: the real intuition was only that a conditional's probability *tracks* the conditional probability, possibly through some fixed recalibration, since people's probability judgements are regressive or just noisy. So he posits that the probability of if A then C equals f(P(C given A)) for one fixed, strictly increasing f — same f for every A and C and every credence function, maybe something like f(x) = x² or f(x) = (1 + x)/2. His hope is the slack in f stops the collapse and leaves a weaker, survivable constraint. I don't see how that could help, but I can't say precisely why.

  So, could you: (1) redo the die calculation with his f in place and show what you end up with — is it genuine triviality, or just a weaker constraint like conditional probability depending only on P(C) and not on A at all, and is that weaker thing survivable, or does it also blow up once you compare two different antecedents, e.g. six-or-two against six-or-two-or-four; (2) lay out which premise is doing which piece of work — the thing having an unconditional probability you can conditionalise on at all, the thesis being applied to conditionalised credence functions and not just your current one, the law of total probability, and those annoying positivity side conditions (I noticed the argument seems to need A compatible with both C and not-C — does that mean cases like if it's a six then it's even escape entirely?); (3) handle his second escape move, which is to deny that a true consequent guarantees the conditional — I suspect that doesn't help at all, because in the argument above that step seems to *fall out* of the thesis applied to a conditionalised credence function rather than being assumed seperately, but I'd like you to check me on that; and (4) say in the end which premise you'd actually give up and what it costs you, especially if the answer is something like giving up that conditionals express truth-conditional propositions in the first place.

  Then, finally, the one-sentence moral I could repeat to him: what is the result really telling us, and why is it called triviality rather than just a contradiction?
reasoning: |-
  Okay, let me tackle this user's query step by step. They're struggling with Lewis's triviality result for indicative conditionals, particularly why adding a function f to the probability of the conditional doesn't resolve the issue. 

  First, I need to recall Lewis's original argument. The user mentions a die example: A is "even," C is "six." The thesis claims P(if A then C) = P(C|A). Splitting based on C gives a contradiction because 1/3 vs 1/6. The user's friend suggests P(if A then C) = f(P(C|A)) for some strictly increasing f, hoping this avoids collapse.

  The user has four main requests: (1) redo the die calculation with f, (2) identify which premises do what work, (3) address denying that true consequent guarantees the conditional, and (4) suggest which premise to give up and the cost. Plus, a one-sentence moral.

  Starting with (1): Redoing the die calculation with f. The law of total probability still applies. So P(if A then C) = P(if A then C | C) * P(C) + P(if A then C | not C) * P(not C). Under the friend's thesis, when conditioning on C, the conditional probability P(C|A) changes. After conditioning on C, P(C|A) becomes 1 because C is true. Similarly, conditioning on not C makes P(C|A)=0. So P(if A then C | C) = f(1), and P(if A then C | not C) = f(0). Plugging in, P(if A then C) = f(1) * P(C) + f(0) * P(not C). But the thesis also says P(if A then C) = f(P(C|A)). So f(P(C|A)) = f(1)*P(C) + f(0)*P(not C). For the die example, P(C|A)=1/3, so f(1/3) = f(1)*(1/6) + f(0)*(5/6). This has to hold for any P, so if I vary P(C) but keep P(C|A) fixed, the right side changes with P(C) while the left doesn't. That forces f(1/3) to equal different values, which is impossible unless P(C) is fixed. So triviality still follows. The function f doesn't help because the equation ties f at different points to P(C), which varies independently.

  Moving to (2): Identifying premises. The key premises are: (a) The conditional has an unconditional probability, allowing conditioning on C. (b) The thesis applies to all probability functions, including those conditioned on C or not C. (c) The law of total probability. (d) Positivity: A must be compatible with C and not-C, otherwise conditioning on C might make P(A)=0, breaking P(C|A). For antecedents like "if it's six then it's even," A is "six" and C is "even." Here, A entails C, so when not C, A is impossible. Conditioning on not C makes P(A)=0, so P(C|A) is undefined. The argument doesn't apply in such cases.

  For (3): Denying that true consequent guarantees the conditional. The user suspects it doesn't help. In the argument, P(if A then C | C) = f(1) comes from applying the thesis to the conditioned credence function. When conditioning on C, the new P(C|A) is 1, so P(if A then C) under this new credence is f(1). If the friend denies that C being true makes the conditional certain, they reject this step. But that means the thesis doesn't hold for conditioned credence functions, which is a key part of Lewis's argument. So the friend has to restrict the thesis to the current credence function only, not updated ones. That avoids triviality but at the cost of limiting the thesis's scope.

  On (4): Which premise to give up. The options are: (i) Deny conditionals have truth values/propositions. This avoids assigning probabilities altogether. Cost: Hard to explain embedded conditionals or logical inferences. (ii) Reject that the thesis applies to all credence functions. Cost: The thesis isn't about how credences in conditionals relate to conditional credences in general. (iii) Give up the law of total probability for conditionals. But that's fundamental. The moral is that the result shows conditionals can't be propositions with probabilities matching conditional probabilities without trivializing probability.

  One-sentence moral: Lewis's result shows that treating indicative conditionals as ordinary propositions whose probabilities equal conditional probabilities forces all events to be probabilistically independent, rendering learning from evidence impossible.
answer: |-
  Right, I'll walk you through this step by step using your die example and your friend's proposed fix. British English throughout, and I'll build it from scratch. Let's get that gut-level feel.

  **(1) Redoing the die calculation with your friend's f-function:**  
  Set-up: Fair die. Let \(A =\) "roll is even", \(C =\) "roll is six". So \(P(C|A) = P(\text{six} | \text{even}) = \frac{1}{3}\). Your friend claims \(P(\text{if } A \text{ then } C) = f(P(C|A)) = f(\frac{1}{3})\) for some fixed, strictly increasing \(f\) (e.g., \(f(x) = x^2\) or \(f(x) = \frac{1+x}{2}\)).

  Now, split the probability using the law of total probability, conditioning on whether \(C\) is true (six) or not (not-six):
  \[
  P(\text{if } A \text{ then } C) = P(\text{if } A \text{ then } C \mid C) \cdot P(C) + P(\text{if } A \text{ then } C \mid \neg C) \cdot P(\neg C)
  \]
  - **Conditional on \(C\) (roll is six):**  
    If we know it's a six, then \(A\) (even) is true. Your friend's thesis, applied *to this new conditional credence state* (where \(C\) is certain), says:  
    \[
    P(\text{if } A \text{ then } C \mid C) = f\left( P(C|A) \text{ under this new state} \right).
    \]  
    But under this state, \(P(C|A) = P(\text{six} | \text{even}) = 1\) (since we know it's six, so if it's even, it *must* be six). Thus:  
    \[
    P(\text{if } A \text{ then } C \mid C) = f(1).
    \]
  - **Conditional on \(\neg C\) (roll is not-six):**  
    If we know it's not-six, then \(C\) is false. Applied to this new state:  
    \[
    P(\text{if } A \text{ then } C \mid \neg C) = f\left( P(C|A) \text{ under this state} \right).
    \]  
    Here, \(P(C|A) = P(\text{six} | \text{even}) = 0\) (if it's even, it can't be six since we know it's not-six). Thus:  
    \[
    P(\text{if } A \text{ then } C \mid \neg C) = f(0).
    \]

  Plugging in:  
  \[
  P(\text{if } A \text{ then } C) = f(1) \cdot \tfrac{1}{6} + f(0) \cdot \tfrac{5}{6}.
  \]

  But your friend's original thesis *also* says:  
  \[
  P(\text{if } A \text{ then } C) = f(P(C|A)) = f(\tfrac{1}{3}).
  \]

  So we have:  
  \[
  f(\tfrac{1}{3}) = f(1) \cdot \tfrac{1}{6} + f(0) \cdot \tfrac{5}{6}. \quad \text{(Equation 1)}
  \]

  **What does this force?**  
  - \(f(1)\), \(f(0)\), and \(f(\frac{1}{3})\) are just fixed numbers (e.g., if \(f(x) = x^2\), then \(f(1)=1\), \(f(0)=0\), \(f(\frac{1}{3}) \approx 0.111\), and the right-hand side is \(1 \cdot \frac{1}{6} + 0 \cdot \frac{5}{6} = \frac{1}{6} \approx 0.167\), which doesn't equal 0.111).  
  - Crucially, this equation **must hold for any probability function** where \(A\) and \(C\) are logically independent (like "even" and "six"). But suppose we vary the die's fairness—say, make \(P(\text{six}) = p\) (so \(P(\neg C) = 1-p\)), while keeping \(P(C|A) = \frac{1}{3}\) fixed. This requires adjusting \(P(A)\) or the sample space, but it's possible (e.g., imagine a weighted die where "even" still implies \(\{\text{two, four, six}\}\), but \(P(\text{six}) = p\), so \(P(\text{even}) = 3p\) to keep \(P(\text{six}|\text{even}) = \frac{p}{3p} = \frac{1}{3}\)).  

  Now Equation 1 becomes:  
  \[
  f(\tfrac{1}{3}) = f(1) \cdot p + f(0) \cdot (1-p). \quad \text{(Equation 2)}
  \]

  This must hold for all \(p\) where \(0 < p < 1\) (to avoid the "positivity" issue—more on that later). But:
  - The left side, \(f(\frac{1}{3})\), is a constant.
  - The right side is \(f(1) \cdot p + f(0) \cdot (1-p)\), which is a straight line in \(p\) (unless \(f(1) = f(0)\)).

  **The collapse:**  
  The *only* way a constant (left side) can equal a linear function in \(p\) (right side) for all \(p\) is if:
  - The line is flat, i.e., \(f(1) = f(0)\).
  But \(f\) is strictly increasing by assumption, so \(f(1) > f(0)\). Contradiction.  
  - **Unless** \(P(C|A)\) isn't actually free to vary—but it is, by changing \(P(C)\) while fixing \(P(C|A)\). The equation forces \(P(C|A)\) to depend only on \(P(C)\), not on \(A\). For example:  
    If \(p = P(C) = 0.5\), Equation 2 says \(f(\frac{1}{3}) = f(1)(0.5) + f(0)(0.5)\).  
    If \(p = 0.1\), it says \(f(\frac{1}{3}) = f(1)(0.1) + f(0)(0.9)\).  
    These can't both hold unless \(f(1) = f(0)\) or \(p\) is fixed—neither is possible. So **triviality still strikes**: \(P(C|A)\) must equal \(P(C)\), making \(A\) and \(C\) independent. No learning from evidence.  
  Your friend's \(f\) doesn't help—it just shifts the numbers, but the structural clash between the thesis and probability dynamics remains.

  **(2) Which premise is doing what:**  
  - **Premise 1: The conditional has an unconditional probability.**  
    Why needed? To apply the law of total probability (splitting on \(C\)). If conditionals don't have probabilities at all (e.g., they're not propositions), this fails.  
  - **Premise 2: The thesis applies to conditionalised credence functions.**  
    Why needed? We used \(P(\text{if } A \text{ then } C \mid C) = f(P(C|A \mid C))\). Lewis assumes the thesis holds for *all* probability functions, including those reached by conditionalising on evidence. If you restrict it to your *current* credence state only, the argument stalls.  
  - **Premise 3: The law of total probability.**  
    Why needed? It's how we split \(P(\text{if } A \text{ then } C)\) into cases. Giving this up guts probability theory.  
  - **Positivity (side conditions):** \(P(A \land C) > 0\) and \(P(A \land \neg C) > 0\).  
    Why needed? To ensure \(P(C|A)\) is defined when we conditionalise on \(C\) or \(\neg C\). In your "if six then even" case:  
    - \(A = \text{six}\), \(C = \text{even}\).  
    - If you conditionalise on \(\neg C\) (i.e., "not even"), then \(A\) ("six") becomes impossible, so \(P(C|A)\) is undefined (division by zero).  
    So yes, **cases like "if six then even" escape the argument**—but only because they're logical truths (or falsehoods), not contingent indicatives. Most real conditionals aren't like this.

  **(3) Denying that true consequent guarantees the conditional:**  
  Your suspicion is spot on. Your friend might say: "Even if \(C\) is true, the conditional 'if \(A\) then \(C\)' might still be false or uncertain." But in Lewis's framework, this step **falls out of the thesis itself** when applied to the conditionalised state. Specifically:  
  - Conditional on \(C\), we have \(P(C|A) = 1\) (if \(A\) is true, \(C\) is certain; if \(A\) is false, \(P(C|A)\) is undefined or vacuously 1—but Lewis handles it by restricting to cases where \(A\) is possible).  
  - Then the thesis \(P(\text{if } A \text{ then } C \mid C) = f(P(C|A \mid C)) = f(1)\).  
  So if your friend denies this, they're effectively **denying Premise 2**—the thesis doesn't hold for conditionalised credences. That *does* block the argument, but it's a major retreat: now the thesis only loosely ties *your current* \(P(\text{if } A \text{ then } C)\) to *your current* \(P(C|A)\), saying nothing about how they co-vary under evidence. This avoids triviality but at the cost of making the thesis empirically toothless—it can't explain how we *update* credences in conditionals.

  **(4) Which premise to give up and what it costs:**  
  - **Option 1: Deny conditionals express truth-conditional propositions (so no unconditional probability).**  
    Cost: Conditionals can't embed in logic (e.g., no "if (if A then C) then D"), and their probabilities aren't "real" probabilities—perhaps more like "degrees of assertability". This is Adams' view.  
  - **Option 2: Deny the thesis applies to all credence functions (only current one).**  
    Cost: The thesis can't guide how credences in conditionals *should change* when you learn new evidence. It becomes a static snapshot.  
  - **Option 3: Deny the law of total probability applies to conditionals.**  
    Cost: Probability theory loses coherence—conditionals become "special" and can't integrate with standard Bayesian updating.  
  - **Option 4: Accept triviality (independence).**  
    Cost: Learning is impossible. Absurd.  

  The least costly for most is **Option 1**: ditch the idea that conditionals have truth values/propositions. But it's philosophically heavy—you must rebuild logic and probability from scratch.

  **The one-sentence moral you asked for:**  
  "Lewis's triviality isn't just a contradiction—it's a proof that if indicative conditionals express ordinary propositions whose probabilities match conditional probabilities, then *no event can be evidence for another*, collapsing all rational learning."  

  **Why "triviality"?** Because it reduces the rich structure of probability to a trivial one where \(P(C|A) = P(C)\) always—learning \(A\) never changes your credence in \(C\). That's a "trivial" (useless) model of evidence.  

  Hope this clicks now—no symbols without meaning. Cheers.
