prompt: |-
  Hey — I'm a backend engineer, no philosophy background beyond some half-remembered LessWrong from 2013, and I've somehow agreed to run a 45-minute brown-bag at work (plus ten minutes of questions, whiteboard, no slides) on Good's theorem — the one that says a certain kind of agent can never lose, in expectation, by getting information for free. Audience is around fifteen engineers, all stats-literate, all have shipped A/B tests, none have had decision theory. Two of them are guaranteed to derail into p-values, and one of them will say "so this is why we can peek at the experiment early" within the first ten minutes.

  I don't need you to explain the theorem to me. I need you to plan how I explain it to them, and I need the plan to survive the room.

  Specifically:

  **The dependency order.** What has to be on the board before the statement of the theorem is even intelligible, and in what order, and what breaks if I reorder it. My guess is that the load-bearing thing is the idea that information only has value through the possibility of it changing what you'll do — that a free, perfectly accurate tip-off that would leave your action unchanged is worth exactly nothing, however shocking it is — and that if I don't get that in place first the theorem just sounds like "knowledge is power" with extra steps. Tell me if that's the right first piece or if something else has to come before it, including whether "expected utility maximizer" needs to be cashed out at all at this level or whether it's enough to gesture at it.

  **The carrying example.** I want one example that does the whole session, not three. What should it have, and — more usefully for me — what must it *not* have? My instinct is it needs a small action set and a small number of states, so people can literally enumerate the cases, and it needs to be a case where the info arrives before you act and nothing else changes. I'm also fairly sure it must not involve another agent who reacts to you, or your own future self, or any rule about what you're allowed to do once you know. Confirm or kill those constraints.

  **The misconception map, with placement.** Not a list to bolt on at the end — for each one, the exact point in the sequence where it should be defused, and why there rather than earlier. The ones I'm expecting: that the theorem says to go buy the data / commission the study; that it says you should always deliberate longer or gather more before deciding; that it says more information is *strictly* better when it actually only gets you non-negative; that it retroactively licenses optional stopping and mid-flight peeking at the experiment; and the p-values guy. Give me the ones I'm not expecting too.

  **The case I actually care about.** Here's the thing I can't place, and it's the reason I'm writing this instead of just winging it. There's a version of this that keeps coming up in our incident reviews and it doesn't feel like the theorem covers it: the information is free, it arrives, but it arrives *with a rule stapled to it* — we have to log it, or we're on call and policy says that if the error rate crosses a number after the deploy we roll back, no judgement allowed, or we have to hand the number to a customer. The info isn't just landing in my beliefs; it's changing the menu of things I'm permitted to do, or what someone else gets to do with it. My diagnosis is that the theorem quietly assumes the info reaches me *only* through what I believe, and that once it also rewires the action set or leaks to another agent who moves after me, all bets are off. Is that the right way to cut it, is there a standard name for the assumption I'm pointing at, and — the part I really want — where does this case go in the sequence? My worry is that if I open with it, people think the theorem is some ivory-tower thing that doesn't apply to real dashboards, and if I close with it, it reads as a footnote to an hour of "info is always good."

  **The check.** One question I can put to the room at minute 50 that separates people who got it from people who were nodding. Ideally something they'd answer *differently* if they'd only absorbed the slogan.

  **What I should refuse to explain out loud.** What to cut at this level — and what to explicitly say I'm cutting, so nobody thinks I dodged it.

  And the part I care about most: tell me where this plan is most likely to fail. Where is my framing of the whole session wrong or misleading in a way a decision theorist would wince at? What would change your mind about the ordering — and if you think the "value comes from the possibility of changing your action" framing is itself a trap rather than the key, say so and say why rather than building the session around my guess.
reasoning: |-
  We are preparing a 45-minute brown-bag session (plus 10 minutes Q&A) on Good's theorem for an audience of 15 engineers. The goal is to explain the theorem in a way that is robust to common misconceptions and derailments.

  Good's theorem: In the context of an expected utility maximizing agent, the expected utility of a decision with free information is at least as high as without, and strictly higher if the information might change the decision.

  Key points:
  - The value of information comes from the possibility that it changes your action.
  - Free, perfect information (with no cost and perfectly reliable) cannot hurt in expectation.

  The plan must address:
  1. Dependency order: What concepts must be introduced and in what order?
  2. A single carrying example: What properties must it have and avoid?
  3. Misconception map: When to address each misconception during the session?
  4. The case with a rule stapled to the information: How to handle it?
  5. A check question to assess understanding.
  6. What to refuse to explain.

  And most importantly: Where is the plan most likely to fail? What are the potential pitfalls in the framing?

  ---

  **Dependency Order**

  The session must build concepts step by step. The critical load-bearing concept is indeed that **the value of information comes from the possibility of changing the action**. Without this, the theorem sounds trivial.

  Proposed order:

  1. **Set up the decision problem without information** (5 minutes)
     - Introduce a simple decision under uncertainty.
     - Key elements: states of the world, actions, utilities (or losses). Use a concrete example (the carrying example) to illustrate.
     - Emphasize that the agent chooses an action to maximize expected utility (EU) given current beliefs (probabilities).

  2. **Introduce the concept of free information** (5 minutes)
     - Now, the agent gets to see the outcome of a signal (free, perfect) before choosing an action.
     - Show that in some cases, the information might change the action, and in others, it might not.
     - Explicitly state: If the information does not change the action in any state, then it has no value. If it might change the action, then it has positive value.

  3. **State Good's theorem** (5 minutes)
     - "An expected utility maximizer can never lose, in expectation, by receiving free information. The expected utility with the free information is at least as high as without, and strictly higher if there is a positive probability that the information will change the optimal action."
     - Write the theorem formally: Let EU_0 be the expected utility without information, and EU_I be the expected utility with information. Then EU_I >= EU_0, with equality only if the information does not change the optimal action in any state.

  4. **Work through the example** (15 minutes)
     - Use the carrying example to compute EU without information and then with information, showing that the EU with information is at least as high.

  5. **Address misconceptions and the "rule stapled" case** (10 minutes)
     - At this point, after the example, address the common misconceptions and the special case.

  6. **Q&A and whiteboard** (10 minutes)

  Why this order?
  - Without setting up the decision problem, the theorem is abstract.
  - Without establishing that information only has value if it can change the action, the theorem seems tautological.
  - We do not need to deeply cash out "expected utility maximizer" beyond the idea that the agent chooses the action with the highest expected utility given their beliefs. This is familiar to engineers from A/B testing (choosing the variant with the highest expected conversion rate).

  **The Carrying Example**

  We need one example that runs through the session.

  Requirements:
  - Small action set (2 actions) and small state space (2 states). Enumerate all possibilities.
  - The information is a signal that reveals the state perfectly.
  - The example must be concrete and relatable to engineers. Avoid business decisions (like marketing) because they might have hidden complexities. Instead, use a physical or engineering example.

  Example: **The Umbrella Problem**

  - States: Rain (R) or No Rain (N) [each with probability 0.5? Or set to different probabilities?]
  - Actions: Take umbrella (U) or Leave umbrella (L)
  - Utilities (we can use negative numbers for losses, or frame as positive utilities):
    - If it rains and you take umbrella: -1 (you are dry but carry umbrella)
    - If it rains and you leave umbrella: -10 (you get wet)
    - If no rain and you take umbrella: -2 (you carry umbrella unnecessarily)
    - If no rain and you leave umbrella: 0 (you are free)

  Without information:
  - EU(U) = P(R)*(-1) + P(N)*(-2)
  - EU(L) = P(R)*(-10) + P(N)*(0)

  Suppose P(R)=0.5, then:
    EU(U) = 0.5*(-1) + 0.5*(-2) = -1.5
    EU(L) = 0.5*(-10) + 0.5*(0) = -5
    So without information, you take umbrella (EU=-1.5).

  With free information (perfect forecast):
  - If forecast says rain: you take umbrella (utility -1)
  - If forecast says no rain: you leave umbrella (utility 0)
  - EU with information: P(R)*(-1) + P(N)*(0) = 0.5*(-1) + 0.5*(0) = -0.5

  Compare: Without info: -1.5, with info: -0.5 -> improvement by 1.

  What if the forecast was always rain? Then:
  - You always take umbrella: EU = -1.5 (same as without information) -> no improvement.

  This example shows:
  - The information is valuable only when it changes the action (when it doesn't rain, you leave the umbrella).
  - If the information never changes the action (if the forecast always says rain, then you always take the umbrella) then no value.

  Constraints to avoid:
  - Do not involve another agent (no game theory).
  - Do not involve sequential decisions (only one decision after the information).
  - The information does not change the state or the available actions.

  **Misconception Map with Placement**

  Address each misconception at the point where it naturally arises.

  1. **"So this is why we can peek at the experiment early"**
     - This will come up when we introduce the idea of free information. Address it immediately when we state the theorem (step 3) by saying: "This theorem assumes that the information is free and perfect. In A/B testing, peeking introduces multiple testing issues and the information is not perfect (it's noisy). Moreover, in practice, we might have costs (like delaying the decision) or rules (like stopping rules) that break the assumptions. We'll come back to this."

  2. **The theorem says to go buy the data / commission the study**
     - Address when we discuss the value of information. Emphasize: "The theorem is about free information. If the information has a cost, then you have to compare the cost with the value. The theorem doesn't say to always buy information, only that if it's free and perfect, then it can't hurt."

  3. **Always deliberate longer or gather more information**
     - Address in the same point: "The theorem does not say that more information is always better if it has costs (time, money). Also, note that we are talking about relevant information. Gathering irrelevant information (like the color of the sky when deciding on an umbrella) might not help and could even be distracting, but in our model, if it's not informative, then it won't change the action and hence has zero value. But in real life, even free information might have cognitive costs."

  4. **Non-negative improvement (not strictly better)**
     - This is addressed in the example where the forecast is always rain. We show that the EU is the same as without information. So we explicitly show that it can be zero improvement.

  5. **P-values guy**
     - This might come up when we talk about A/B testing. We can say: "The theorem is about Bayesian expected utility. In frequentist statistics, peeking can inflate type I error. This theorem does not override that. It's a different framework. We are assuming the agent updates beliefs correctly (by Bayes) and then maximizes expected utility."

  Placement:
  - Misconceptions 1 and 4: During the example (step 4) and when stating the theorem (step 3).
  - Misconceptions 2 and 3: When we discuss the implications after the example (step 5).
  - Misconception 5: When we discuss the A/B testing case in step 5.

  **The Case with a Rule Stapled to the Information**

  This is a critical point. The theorem assumes that the only effect of the information is to update the agent's beliefs and then the agent chooses an action. If the information comes with a rule that forces an action (like "if error rate crosses X, roll back"), then the agent is no longer free to choose the action that maximizes expected utility. The rule constrains the action set.

  This is a violation of the theorem's assumption. The theorem assumes that the agent remains an expected utility maximizer and that the information only affects beliefs.

  Standard name: The theorem assumes that the agent is a **rational Bayesian decision maker** and that the information is **costless and purely informative** (does not change the available actions or the utility function).

  Where to place this?
  - **After** the main theorem and example. Why?
     - We need the audience to understand the basic theorem first.
     - Then we can say: "But in practice, we often have situations where the information isn't free in the sense of the theorem. For example, if there's a rule that forces an action when we get certain information, then we are no longer in the setting of the theorem. The information is not just updating beliefs; it's changing the decision rule. In that case, the theorem doesn't apply."

  This way, we show the theorem's power and then its limitations. It avoids making the theorem seem irrelevant because we first establish the core idea.

  **The Check**

  At minute 50 (end of Q&A), ask:

  "Suppose you are about to make a decision, and you are offered a free, perfectly accurate piece of information. You compute that no matter what the information says, you would still choose the same action as you would without the information. What is the value of that information?"

  Correct answer: Zero. Because it doesn't change the action.

  Incorrect answers: Positive because "information is always good", or negative because "it might confuse you".

  **What to Refuse to Explain**

  - **The proof in full generality.** We can sketch the idea (by the law of total expectation, EU with information is the expectation of the maximum EU conditional on the information, which is at least the maximum of the unconditional EU) but not derive it.
  - **Extensions to imperfect information.** We assume perfect information. Imperfect information (noisy signals) would require more work, and the theorem still holds (with non-negative value) but we skip that.
  - **Other decision theories.** We are assuming expected utility maximization. Other frameworks (like prospect theory) might not satisfy this. We are not going there.
  - **The history of the theorem and philosophical debates.** We focus on the math and application.

  Explicitly say: "We are assuming a rational Bayesian agent, perfect information, no costs, and that the information only updates beliefs without changing the available actions or the utility function. We are not covering cases where these assumptions are broken."

  **Where the Plan is Most Likely to Fail**

  1. **The framing of "value comes from the possibility of changing the action" might be misunderstood.**
     - Pitfall: The audience might think that if the information doesn't change the action, it's useless. But note that it might still be reassuring (psychological value). However, the theorem is about expected utility, not psychological comfort. We must emphasize that we are only talking about the instrumental value of the information for the decision at hand.

  2. **The umbrella example might be too simplistic.**
     - Risk: The audience might not see the connection to their work. But we can bridge by saying: "In A/B testing, the state is which variant is better, the actions are to choose A or B, and the information is the test results."

  3. **The p-values derailment.**
     - We must be firm that the theorem is in the Bayesian framework. We can say: "In Bayesian A/B testing, if you can update your beliefs and then choose the best action, then peeking doesn't have the same issues as in frequentist statistics. But note: our theorem assumes free and perfect information, which in practice is not the case because of noise and multiple testing. So this theorem does not justify peeking in a frequentist setting."

  4. **The rule-stapled case might be the norm in their work.**
     - We must not downplay this. We should say: "In many of our incident reviews, we have rules that force actions. In that case, the theorem doesn't directly apply because the rule is constraining the action. We are then in a different setting. But note: the rule itself was set up (hopefully) using a decision-theoretic approach to maximize expected utility in the long run. So the theorem might have been used to design the rule, but now we are bound by it."

  5. **The audience might question the assumption of perfect information.**
     - We are assuming perfect information for simplicity. In reality, information is noisy. We can mention that the theorem extends to imperfect information (the value is still non-negative) but we are not covering that. We focus on the intuition.

  **Revised Plan with Timing**

  Total: 45 minutes

  1. (5 min) Introduce the decision problem without information (umbrella example). Set up states, actions, utilities. Compute EU and choose optimal action without information.

  2. (5 min) Introduce free, perfect information. Show how the agent would use it. Compute the EU with information.

  3. (5 min) State Good's theorem formally and intuitively. Write it on the board.

  4. (15 min) Work through the umbrella example in detail. Show two cases: one where information is valuable (changes action) and one where it isn't (always rain forecast). Compute the EU in both cases and compare.

  5. (10 min) Address misconceptions and the rule-stapled case.
     - Misconceptions about buying data, always gathering more info, non-negative improvement.
     - P-values and peeking: "This theorem is Bayesian. In frequentist A/B testing, peeking is problematic because of multiple testing. Here, we assume perfect updating."
     - Rule-stapled case: "But what if the information comes with a rule? Then the theorem doesn't apply because the action is forced. Example: incident rollback policy. We are no longer free to choose the action that maximizes EU in that moment."

  6. (5 min) Summary and check question.

  Then Q&A (10 min).

  **Check Question Placement**

  At the end of the summary, ask the check question.

  **Final Thoughts**

  The key is to anchor the audience in the example and then build the theorem. The umbrella example is robust because it's simple and the math is transparent. The misconceptions are addressed at the point they are likely to arise, and the rule-stapled case is explicitly called out as a violation of the assumptions.

  The most likely failure is that the audience might not see the relevance to their work because of the simplicity of the example and the strict assumptions. To mitigate, we can say: "The power of this theorem is that it gives a foundation for valuing information. Even when the assumptions don't hold exactly, we can use the idea to structure our thinking. But we must be aware of the limitations."

  Good luck!
answer: |-
  Here's a battle-tested plan for your 45-minute session on Good's theorem, designed to survive a room of skeptical engineers. It's structured around your constraints, with explicit timing, dependency order, and misconception defenses. The core insight—that information's value comes solely from its ability to *change actions*—is indeed the load-bearing wall. If that cracks, the theorem collapses into platitudes. I'll break this down as requested, then flag where it's most fragile.

  ---

  ### **Dependency Order: What Must Be on the Board First (15 min)**
  **Timing:** First 15 minutes (whiteboard only—no slides). **Goal:** Make the theorem *obvious* by building intuition, not formalism.  
  **Critical path:** Fail to establish the "action-change" principle, and the theorem sounds like a tautology. Skip "expected utility," and peeking debates derail you.  

  1. **Min 0–3: Set up a decision problem without information**  
     - Draw a 2x2 matrix: Small states (e.g., `System Failure: YES/NO`), small actions (e.g., `Roll Back: YES/NO`).  
     - Assign utilities (not losses!) so signs align with intuition (e.g., `Roll Back=YES & Failure=YES → 0`; `Roll Back=NO & Failure=NO → +10`; `Roll Back=NO & Failure=YES → -100`).  
     - Add probabilities (e.g., `P(Failure) = 0.1`). Compute expected utility (EU) for each action. Pick the max.  
     *Why first?* Engineers know EU from A/B tests. This anchors the session in decisions they make.  

  2. **Min 3–8: Introduce "free information" and the action-change principle**  
     - Add a "free signal" (e.g., a perfect `Failure Forecast: RED/GREEN`). Show two cases:  
       - Case 1: Signal *might* change action (e.g., if `RED` → `Roll Back`, `GREEN` → `Don't Roll Back`).  
       - Case 2: Signal *never* changes action (e.g., you `Roll Back` regardless).  
     - **Hammer the key:** "The value of this signal is **zero** if it never changes your action. It only has value if it *could* flip your decision. Shocking but useless intel is worthless."  
     *Why here?* If this isn't visceral, the theorem feels empty. Engineers respect counterintuitive truths.  

  3. **Min 8–12: Casually define "expected utility maximizer"**  
     - "An agent who always picks the action with highest EU given their beliefs. That's it—no philosophy. We all do this when we ship the A/B test winner."  
     - *Do not* formalize rationality axioms. Gesture and move on.  

  4. **Min 12–15: State Good's theorem**  
     - Write:  
       ```  
       EU(with free, perfect info) ≥ EU(without info)  
       Strict ">" if the info could change your action.  
       ```  
     - Concisely justify: "With info, you condition on the signal and optimize. Without it, you optimize blindly. Conditioning can't hurt."  

  **Why this order?**  
  - Reverse it, and the theorem is unmotivated.  
  - Break it: If you skip the action-change examples, the p-values skeptic will say "So peeking is fine?" and derail you.  

  ---

  ### **The Carrying Example: What It Must (and Must Not) Have**  
  Use **one example** throughout: **Deploy Rollback Decision**.  
  - **States**: `BugExists? (YES/NO)` → `P(YES) = 0.2` (known pre-deploy bug risk).  
  - **Actions**: `Roll Back (RB)` or `Don't Roll Back (NRB)`.  
  - **Utilities**:  
    - `RB & BugExists`: 0 (you caught it)  
    - `RB & NoBug`: -50 (unnecessary rollback cost)  
    - `NRB & BugExists`: -100 (outage)  
    - `NRB & NoBug`: +10 (success)  
  - **Signal**: Free, perfect `Bug Detection: RED/GREEN`.  

  **What it MUST have (and why):**  
  - Small, enumerable states/actions → Engineers compute EU in their heads.  
  - Concrete utilities → Avoid abstract "utils." Use negative numbers for costs.  
  - A scenario where the signal sometimes changes action (here, `GREEN` might make you choose `NRB`).  
  - A "null" case (e.g., if pre-deploy certainty of a bug was 99%, `RED` wouldn't change `RB`).  

  **What it MUST NOT have (and why):**  
  - **No other agents/reactors** → Avoids game theory. (Your instinct is right.)  
  - **No sequential decisions** → Only one action after the signal.  
  - **No exogenous rule changes** → The signal only updates beliefs. (Save "rule stapled" for later.)  
  - **No noise** → Signal is perfect. (Imperfect info is a distraction.)  

  **Work the example:**  
  - Without signal: `EU(RB) = 0.2*0 + 0.8*(-50) = -40`; `EU(NRB) = 0.2*(-100) + 0.8*10 = -12` → Choose `NRB` (EU=-12).  
  - With signal:  
    - If `RED` → `RB` (EU=0)  
    - If `GREEN` → `NRB` (EU=10)  
    - `EU(with signal) = 0.2*0 + 0.8*10 = 8` (vs. -12 without) → Strict improvement.  
  - Null case: If `P(BugExists)=0.99`, `NRB` is never optimal → Signal has zero value.  

  ---

  ### **Misconception Map: When to Defuse Each**  
  Don't wait—pivot into these when they naturally arise. Your derailers *will* interrupt; use their energy.  

  1. **"So this justifies peeking at experiments!"**  
     - **When:** The moment you state the theorem (min 12–15).  
     - **Response:** "No—this assumes **free, perfect, belief-only** info. Peeking in A/B tests is noisy (not perfect) and often changes decision *rules* (e.g., stopping early). That breaks the assumptions. Hold that thought—we'll loop back."  
     - **Why there?** If unaddressed, peeking debates poison the well.  

  2. **"So we should always buy data/study more!"**  
     - **When:** During the null case (min 20, when you show zero value).  
     - **Response:** "Nope. This is for **free** info. If data costs $1M, the theorem doesn't apply. It only says: if it's free and perfect, it won't hurt. Real data has costs."  

  3. **"More info is strictly better!"**  
     - **When:** Right after computing EU with signal (min 18).  
     - **Response:** "See the null case? If info can't change your action, EU is equal. The gain is **non-negative**, not always positive. Sometimes intel is useless."  

  4. **P-values derailment (e.g., "But frequentist stats forbid peeking!")**  
     - **When:** During Q&A or when discussing peeking.  
     - **Response:** "Yes! This theorem is **Bayesian**. It assumes you update beliefs correctly. Frequentist methods control error rates under fixed rules—different goal. Good's theorem doesn't override that."  

  5. **"What about cognitive load?"**  
     - **When:** When defining "free" info.  
     - **Response:** "Theorem ignores psychology. If 'free' info distracts you, it's not free. We're talking ideal agents here."  

  **Unexpected ones:**  
  - **"Doesn't this assume we know probabilities?"** → Defuse when setting up the example: "Yes, we assume known priors. Real world? Estimate them."  
  - **"What if the signal changes the state?"** → Shut down fast: "Not covered. States are fixed here."  

  ---

  ### **The "Rule Stapled" Case: Where to Place It**  
  **Your diagnosis is correct.** The theorem assumes info **only updates beliefs**—it doesn't change action sets, leak to others, or impose rules. The standard name is **"purely informational value"** (it doesn't affect feasible actions or utilities).  

  **Where to place it:** **Min 35–40**, *after* the core theorem but *before* Q&A.  
  - **Why not earlier?** If you open with it, the room dismisses the theorem as ivory-tower. If you close, it feels like an afterthought.  
  - **How to frame:**  
    - "In our incident reviews, we often have **info with rules attached**: 'If error rate > X, roll back—no judgment.' This breaks the theorem. Why?"  
    - Sketch a case: Signal says `RED`, but policy forces `Roll Back`. But what if EU says `NRB` is better? Now you're forced into a suboptimal action.  
    - "The theorem assumes info only affects *beliefs*, not your action set or others' actions. Here, the 'free' info isn't free—it comes with a **contract** that changes the game."  
    - **Bridge to reality:** "This is why Good's theorem doesn't blindly endorse dashboard alerts. If the alert forces an action, it might *lower* EU by removing flexibility."  

  ---

  ### **The Check Question**  
  **At minute 50 (end of Q&A), ask:**  
  > "You get free, perfect information. You realize that no matter what it says, you'd still choose the same action as without it. What's the value of this information?"  

  - **Correct answer:** Zero (because it can't change your action).  
  - **Slogan-spouters will say:** "Positive—information is always good!"  
  - **Engineers who get it:** Will see it's a restatement of the null case.  

  ---

  ### **What to Refuse to Explain Out Loud**  
  Explicitly declare these off-limits to save time:  
  1. **"I'm skipping the proof.** Trust that it falls out of the law of total expectation."  
  2. **"We're ignoring imperfect information.** Assume signals are perfect today."  
  3. **"No discussion of other agents or repeated games.** This is a one-shot decision."  
  4. **"We're not debating Bayesian vs. frequentist.** This is a Bayesian result."  
  5. **"I won't formalize rationality.** We're using 'EU maximizer' loosely."  

  Say: **"Today's scope: free, perfect, belief-only info. Real-world messiness—costs, noise, rules—is out of scope."**  

  ---

  ### **Where This Plan is Most Likely to Fail**  
  **Your framing risk:** Basing the session on "value from action-change" is correct, but it could backfire if the audience confuses "could change action" with "will change action." The theorem is about *ex ante* possibility, not *ex post* change.  

  **Specific failure points:**  
  1. **During the null case**, if you don't emphasize that value depends on *prior* belief in action-flipping, engineers may think: "So I just need to *intend* to act on the info?" → Clarify: "Value is positive only if, *before* seeing the signal, you assign probability >0 to it changing your action."  
  2. **The "rule stapled" case** could dominate Q&A → Preempt it: "This isn't a footnote—it's why the theorem doesn't cover all alerts. But first, let's see why the math works when assumptions hold."  
  3. **P-values advocates** will challenge Bayesianism → Acknowledge: "Frequentist peeking problems are real. This theorem doesn't solve them—it's a different lens."  

  **What would change my ordering:** If your team is allergic to decision theory, start with the incident case as a "mystery," then solve it with Good. But your instinct to build foundations first is better—it prevents the theorem from seeming like a technicality.  

  ---

  ### **Timing Summary**  
  - **0–15 min:** Dependency order (decision setup → action-change → theorem).  
  - **15–30 min:** Carry the example (compute EUs, show value/null cases).  
  - **30–40 min:** Misconceptions + "rule stapled" case.  
  - **40–45 min:** Summary + check question.  
  - **45–55 min:** Q&A (whiteboard free-form).  

  This leaves the room with a sharp, actionable insight: **Free information is valuable precisely when it might change your mind—and dashboards that force rules aren't "free."** The derailers get airtime without hijacking the narrative.
