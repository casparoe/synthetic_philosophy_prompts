answer: |-
  Here’s the document resolving the Pooler-Splitter debate, structured as requested. It uses British English and focuses on clarity, neutrality, and the specified cases.

  ---

  ### **The Simpson's Paradox Concordat: Poolers vs. Splitters**  
  *Authored by a Relieved Third Party*

  #### **1. Claims Both Camps Accept**  
  Both Poolers and Splitters endorse the following:  
  1.  **Both tables are mathematically true:** The marginal (pooled) association and conditional (stratified) associations are valid, non-contradictory descriptions of the data.  
  2.  **Reversals arise from unequal weighting:** A pooled-vs-stratified reversal occurs due to disparities in group sizes (weights) and subgroup associations. It is not a logical paradox but a property of weighted averages.  
  3.  **No table is intrinsically "truer":** Neither the marginal nor conditional table alone definitively reveals "what’s really happening"; both are summaries subject to interpretation.  
  4.  **Association ≠ Causation:** Neither table proves causation without explicit causal assumptions (e.g., ignorability, positivity).  
  5.  **Stratum-specific effects matter for heterogeneity:** If effects differ across strata, this warrants investigation (e.g., biological interaction, confounding).  
  6.  **The data cannot arbitrate causal relevance:** Whether a partition (e.g., disease severity) *should* be conditioned on depends on external knowledge, not statistics alone.  

  #### **2. Disagreements: Fair Statements of Each View**  
  | **Poolers' Stance (Acceptable to Them)**                                                                 | **Splitters' Stance (Acceptable to Them)**                                                                 |  
  |----------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|  
  | "The marginal association is the primary metric for real-world decisions, as it reflects the aggregate impact on the population of interest." | "The marginal association is an artefact of arbitrary sample composition; only stratum-specific associations describe stable, actionable phenomena." |  
  | "Stratifying post hoc invites data dredging and overfitting, especially when partitions are causally irrelevant." | "Failing to condition on causally relevant partitions (e.g., confounders, effect modifiers) guarantees misleading conclusions." |  
  | "Decision-makers face whole populations, not strata; weights in the pooled estimate reflect operational reality." | "Weights in pooled estimates are accidents of sampling/non-random assignment; acting on them perpetuates bias." |  
  | "Simpson's reversals highlight pitfalls of over-stratifying, not defects in marginal estimates." | "Simpson's reversals prove marginal estimates are uninterpretable without causal context." |  

  #### **3. Cruxes: Genuine vs. Semantic**  
  **Genuine Disagreements:**  
  - **When is stratification necessary?** Poolers: only if the partition is *proven* causal *a priori*. Splitters: whenever the partition *could* be causal (e.g., plausibly confounding).  
  - **What defines a 'population of interest'?** Poolers: the observed cohort as encountered. Splitters: a hypothetical cohort balanced on key strata.  
  - **Default reporting stance:** Poolers: marginal unless strata are pre-specified. Splitters: conditional unless strata are irrelevant.  

  **Semantic Disagreements (Only About Words):**  
  - Whether "association" implies marginal or conditional by default.  
  - Whether "artefact" implies avoidable bias (Splitters) or natural aggregation (Poolers).  
  - Whether "fooling yourself" refers to ignoring strata (Splitters) or inventing strata (Poolers).  

  ---

  ### **Predictions for Case Studies**  
  Both sides accept these cases as illustrative. Predictions assume no unmeasured confounding.  

  **Case A: Two Surgeons**  
  - **Poolers' Prediction:**  
    > "The hospital should prioritise the surgeon with better *marginal* success. While the other excels in strata, their marginal deficit reflects real operational burden (e.g., longer ICU stays for complex cases). Acting on strata ignores system-wide costs."  
  - **Splitters' Prediction:**  
    > "Patients should be assigned to the surgeon better *within their severity stratum*. The marginal association is confounded by case allocation; conditioning on severity reveals true surgical skill. The hospital must fix allocation bias, not penalise the skilled surgeon."  

  **Case B: Discharge Follow-up Programme**  
  - **Programme Effect:** Mainly increases attendance at outpatient appointments.  
  - **Audit Finding:** Better outcomes when *attending* appointments, but marginal effect of programme is null/worse due to low uptake in high-risk groups.  
  - **Constraint:** Programme must be rolled out universally or scrapped.  
  - **Poolers' Prediction:**  
    > "Scrap the programme. The marginal effect (null/worse) is the only metric that matters under universal rollout. Stratifying by attendance is post-treatment and irrelevant to the go/no-go decision."  
  - **Splitters' Prediction:**  
    > "Keep the programme. Its true effect is seen in the attendance stratum (better outcomes when attended). The null marginal effect arises from uneven uptake—a separate implementation issue. Rolling out universally is correct *if* uptake barriers can be addressed later."  

  ---

  ### **The Iron Law of Simpson**  
  *Both camps agree:* The "correct" answer depends on the **causal question** and **action space**. Poolers focus on effects *as implemented*; Splitters on effects *if properly targeted*. Case B’s universal rollout forces Poolers’ view; Case A’s assignable patients favours Splitters. Neither side "wins"—context is sovereign.  

  ---  
  *Document ends. Suggest distributing with biscuits to lower departmental entropy.*
