prompt: |-
  I work in philosophy of science and have started reading the literature on grounding and fundamentality, where I keep tripping over a pattern I have no name for. The pattern is this: someone argues that the F-facts obtain in virtue of the G-facts, and then treats that result as licensing a demotion of the F-facts — they are nothing over and above the G-facts, so they need no separate place in the inventory of the world. But the claim that does the demoting does not seem to be statable in G-vocabulary alone. To say which G-facts ground a given F-fact, you have to pick those G-facts out as the realizers of the very item that was supposed to be demoted. Two cases push me the same way. The claim that a pain is grounded in microphysical facts: the microphysical facts in question have to be identified as pain's realizers, and the candidates are scattered and open-ended. The claim that moral facts are grounded in natural facts: the natural grounds of a specific moral fact seem to be identifiable only by appeal to the whole body of ordinary moral truisms, with no shorter naturalistic specification available. In both cases the ground is presented as the self-sufficient item and the grounded item as the dependent one, yet the dependence claim appears to lean on the dependent item in order to get stated at all.

  I do not want a label. I want the carving. Is this one phenomenon or several? Is it a problem about specification, about vocabulary, or about what the relata of the grounding relation are taken to be? Does it arise for every grounding claim, or only for cross-level ones, or only where the lower level cannot supply the predicates needed to isolate its own work? What are the nearest named phenomena, and how does this differ from each — I have had bridge laws, supervenience, realization, and the nothing-over-and-above slogan suggested to me, and none seems to be quite it. And if the fundamental story can only be told using the vocabulary of the derivative level, in what sense is that level not fundamental? If there is no established concept here, give me one: a name, a definition, a case that falls under it, and a similar-looking case that does not.
reasoning: |-
  Okay, the user is working in philosophy of science and has encountered a recurring issue in grounding and fundamentality literature. They describe a pattern where an argument claims that F-facts are grounded in G-facts, leading to the demotion of F-facts as "nothing over and above" the G-facts. However, when specifying which G-facts ground a particular F-fact, one must reference the F-fact itself, like identifying microphysical facts as pain-realizers or natural facts via moral truisms. This creates a tension: the grounding claim seems to depend on the very thing it's demoting.

  The user doesn't want just a label; they want a conceptual carving-out. They have several specific questions: whether this is one phenomenon or multiple, whether it's about specification, vocabulary, or relata, and if it happens in all grounding claims or only specific cases. They also mention existing concepts like bridge laws or supervenience but feel those don't quite fit. Finally, they ask for a new concept if none exists, including a definition, examples, and boundaries.

  First, I need to unpack the core tension. The issue centers on asymmetric dependence: grounding is supposed to make F-facts derivative, yet describing the G-grounds requires F-vocabulary. This might relate to the "problem of realizer specificity" or "grounding asymmetry paradox." 

  Looking at their examples: pain grounding requires identifying pain-realizers, which are heterogeneous and only identifiable via pain-talk. Similarly, moral facts need moral truisms to specify their natural grounds. This suggests the phenomenon occurs when the grounded property is multiply realizable and lacks a unified lower-level description. 

  Is this one phenomenon? Probably yes, with variations. The core is the referential dependence on F-vocabulary in specifying grounds. It's distinct from supervenience (which doesn't require grounding) or bridge laws (which are nomic, not metaphysical). 

  Key questions: 
  - It arises especially in cross-level grounding where higher-level properties are multiply realizable. 
  - The issue is both about vocabulary (lack of G-predicates for F-roles) and specification (needing F to pick out relevant G-facts). 
  - Relata matter: if grounding relata are facts, specifying which G-facts ground an F-fact requires F-reference. 

  Nearest concepts: 
  1. **Multi-level realization**: But focuses on property hierarchy, not referential dependence. 
  2. **Supervenience without reduction**: Captures covariance but not explanatory dependence. 
  3. **Grounding asymmetry**: The tension here challenges the assumed asymmetry. 

  Proposing a new concept: **"Grounding Anchor Problem"** or **"Referential Priority Dilemma."** Defining it as: the necessity of using F-vocabulary to identify the specific G-facts that ground an F-fact, despite F's purported derivativeness. 

  Case that falls under it: Pain grounded in C-fibers (but C-fibers are picked out as pain-realizers). Case that doesn't: Water grounded in H₂O, where "H₂O" doesn't require water-vocabulary for identification. 

  Implications: Challenges fundamentality claims. If G-level can't fully describe reality without F-terms, F might be pragmatically fundamental. This connects to Carnap's framework relativity and Sider's structuralism. 

  The user's deeper need might be to resolve this tension in their own work, possibly to defend non-reductive views or critique physicalism. They need clear conceptual tools to articulate this challenge to grounding-based demotion.
answer: |-
  Your concern cuts to the heart of grounding's promise to deliver metaphysical hierarchy without reduction. This **is** a distinct phenomenon, though it manifests in different ways depending on context. It's best understood as a unified problem arising from the **tension between grounding's metaphysical asymmetry and the pragmatic/epistemic requirements for specifying the relata**. Let's carve it.

  ### Core Phenomenon: The "Grounding Specification Dependence" (GSD)
  *   **Definition:** The phenomenon whereby a grounding claim (`F`-facts are grounded in `G`-facts) can only be *specified* or *identified* in a way that relies essentially on the vocabulary or concepts of the purportedly grounded (`F`)-level, despite the metaphysical claim that `G`-facts are fundamental and `F`-facts derivative.
  *   **Core Tension:** Metaphysics declares `F` dependent on `G`. Epistemology/Semantics reveals the *specification of how `G` grounds `F`* depends constitutively on `F`.
  *   **Your Cases:**
      1.  **Pain:** Specifying *which* microphysical facts ground *this pain* requires identifying them *as* the realizers *of pain*. Without the concept `pain`, we cannot pick out *that specific, functionally defined cluster* of microphysical facts as the ground for *this experience*.
      2.  **Morality:** Specifying *which* natural facts ground *this moral fact* (e.g., "kicking puppies is wrong") requires invoking the network of moral concepts and truisms (`wrongness`, `harm`, `intent`, etc.) to isolate the relevant natural features (suffering, intentional action, social disapproval patterns). A purely naturalistic specification *sufficient to pick out the moral ground* without moral terms seems unavailable.

  ### Carving the Phenomenon

  1.  **Is it one phenomenon or several?**
      *   Primarily **one core phenomenon** (GSD) with **different manifestations** depending on the nature of `F` and `G`.
      *   **Variation 1 (Type):** Pain exemplifies **functional role realization dependence**. `F` is defined by its role/causal profile. Identifying `G`-grounds requires identifying whatever plays *that specific role* (`F`'s role).
      *   **Variation 2 (Type):** Morality exemplifies **normative/conceptual network dependence**. `F` is embedded in a dense network of interrelated concepts/norms. Identifying `G`-grounds requires navigating this network (`F`'s network).
      *   **Variation 3 (Severity):** The problem is **acute** when `F` is multiply realizable and lacks a type-identical `G`-counterpart (pain, morality, meaning, intentional states). It is **milder or absent** when `F` is type-identical to a `G`-type (water/H2O, heat/mean molecular kinetic energy).

  2.  **Is it a problem about specification, vocabulary, or relata?**
      *   **All three, intertwined:**
          *   **Specification:** The problem is most evident in the *act of specifying* *which specific `G`-facts ground a specific `F`-fact*. This specification is indispensable for making the grounding claim meaningful and non-vacuous.
          *   **Vocabulary:** The specification problem arises *because* the `G`-vocabulary lacks the resources to *pick out* the relevant `G`-facts *as grounds for `F`* without smuggling in `F`-concepts. The `G`-level lacks predicates corresponding to the `F`-roles or networks.
          *   **Relata:** The problem highlights that grounding relata (`F`-facts) are often structured entities whose identity conditions depend on `F`-level concepts. To say `G` grounds *this fact* (`F`), we must identify *which fact* it is, which requires `F`-level identification. Grounding often treats `F`-facts as unproblematic relata, but their identification is `F`-dependent.

  3.  **When does it arise?**
      *   **Not for every grounding claim:** It does *not* arise for:
          *   **Token-Identical Cases:** "This particular H2O molecule's liquidity is grounded in its molecular bonding." (The `G`-facts can be specified purely spatially/physically).
          *   **Type-Identical Reductions:** "Water liquidity is grounded in H2O molecular bonding." (The `G`-type *is* the `F`-type, specified physically).
      *   **Arises primarily for:**
          *   **Cross-level grounding** involving distinct ontological categories (mental/physical, normative/natural, biological/chemical, social/individual).
          *   **Multiply Realizable `F`-kinds:** Where many disparate `G`-configurations can realize the same `F`-property/state. The `G`-grounds for a *specific* `F`-instance are heterogeneous and lack a unifying `G`-description *except* via their relation to `F`.
          *   **`F`-levels defined by functional roles or normative networks:** Where the identity of `F` is tied to its causal role, normative force, or place within a conceptual scheme not reducible to `G`-descriptions.
      *   **Crucially:** It arises when the `G`-level **cannot supply non-disjunctive predicates** that capture the unifying feature provided by the `F`-level concept for the relevant `G`-facts. The `G`-level may lack the resources to express *why these particular `G`-facts* are grouped together as grounds for *this `F`-fact*.

  4.  **Relation to Nearest Named Phenomena (Distinctions)**
      *   **Bridge Laws (Reductionism):** Bridge laws *assert* identities or necessary connections between `F` and `G` terms (e.g., "Pain = C-fiber firing"). GSD **challenges the very possibility** of formulating `bridge laws` *in pure `G`-vocabulary* for multiply realizable `F`-kinds. Bridge laws presuppose the reducibility GSD questions.
      *   **Supervenience:** Supervenience (`F`-facts covary with `G`-facts) is a *relation* between sets of facts. GSD is a problem *about stating grounding claims themselves*, specifically about the *specification of the relata*. Supervenience can hold without grounding (e.g., non-reductive physicalism), and grounding claims can be made without strong supervenience (controversially). GSD highlights that even *if* supervenience holds, *articulating the grounding base for a specific `F`-fact* might require `F`-vocabulary.
      *   **Realization:** Realization describes *how* a higher-level property is implemented by lower-level properties. GSD is a problem that **arises within** realization claims: specifying *what realizes what* often requires using the vocabulary of the realized property to pick out the realizer. Realization is the context; GSD is the specification problem *within* that context.
      *   **"Nothing Over and Above" (NOA):** NOA is a *metaphysical slogan* expressing the derivative status of `F`. GSD is a *specific challenge* to the *epistemic/semantic coherence* of fully endorsing NOA *in practice* when making grounding claims. If `G` alone can't specify *which `G`-facts ground `F`-facts* without `F`-help, in what sense is `F` *really* just "nothing" besides `G`? `F` seems necessary for the *articulation* of the grounding relation itself.

  ### The New Concept: Grounding Specification Dependence (GSD)

  *   **Name:** **Grounding Specification Dependence (GSD)** (Alternative: *Referential Priority Dilemma*)
  *   **Definition:** The dependence of the specification or identification of the `G`-facts grounding a particular `F`-fact on the vocabulary or concepts constitutive of the `F`-level itself, despite the metaphysical claim that `F`-facts are grounded in and derivative upon `G`-facts.
  *   **Case that Falls Under It:**
      *   **Claim:** The fact `that S is in pain` is grounded in the fact `that S's C-fibers are firing`.
      *   **GSD Manifestation:** To identify the relevant grounding fact (`C-fibers firing`) *as the ground for pain*, one must invoke the concept `pain`. The `G`-description "C-fibers firing" only counts as *the ground* for *this `F`-fact* in virtue of playing the functional role definitive of `pain` in this organism. Without the `F`-concept (`pain`), one could not single out *C-fiber firing* (as opposed to, say, dopamine levels or digestive processes) as the relevant `G`-ground for *this specific experience*. Further, for a different organism (e.g., an octopus), the `G`-facts grounding pain would be different, and they could *only* be identified as pain-grounds via the functional role of `pain`.
  *   **Similar-Looking Case that Does *Not* Fall Under It:**
      *   **Claim:** The fact `that this water sample is liquid` is grounded in the fact `that its H2O molecules are in a state of weak hydrogen bonding within a certain kinetic energy range`.
      *   **Why No GSD:** The `G`-facts (`H2O molecules... bonding... kinetic energy`) can be specified entirely within `G`-vocabulary (physics/chemistry). The concept `water` or `liquid` is *not needed* to identify *which `G`-facts* ground the liquidity of this sample. The `G`-description picks out the relevant state of affairs intrinsically. While we *use* `water` to *label* the substance, the *specification of the ground itself* does not rely on `water` or `liquid` – the physical/chemical description suffices to pick out the relevant microstructure and dynamics. The liquidity is type-identical to that microstructure.

  ### The Fundamental Story Question
  You ask the crucial question: **"If the fundamental story can only be told using the vocabulary of the derivative level, in what sense is that level not fundamental?"** GSD directly challenges the *epistemic* and *semantic* aspects of fundamentality claims derived from grounding:

  1.  **Metaphysical vs. Explanatory Fundamentality:** `G` might be metaphysically fundamental (the ultimate constituents), but `F` might be **explanatorily** or **conceptually fundamental** for *describing and understanding* the patterns and structures constituted by `G`. The `G`-level might lack the resources for certain kinds of efficient explanation or reference.
  2.  **Pragmatic/Descriptive Fundamentality:** While `G` might be where the "metaphysical buck stops," `F` might be indispensable for *us* to *describe the world* effectively, including describing how `G` grounds `F`. `F`-vocabulary provides essential cognitive shortcuts for grouping complex `G`-patterns.
  3.  **The Threat to Demotion:** GSD suggests that the "demotion" of `F` cannot be complete in practice. While `F`-facts might metaphysically depend on `G`-facts, `F`-concepts remain *semantically* or *epistemically* prior for *identifying the specific dependencies*. The grounding relation itself seems to have an `F`-shaped hook. This supports non-reductive or pragmatist views: `F` might be irreducible *in conception/description* even if not *in being*.

  ### Conclusion
  Grounding Specification Dependence (GSD) is the distinct phenomenon you've identified. It reveals a significant gap between the *metaphysical aspiration* of grounding (establishing a clear hierarchy where `F` is "nothing over and above" `G`) and the *practical epistemology* of formulating grounding claims. It arises most sharply for multiply realizable, functionally or normatively defined `F`-levels grounded in a `G`-level lacking the resources to non-circularly specify the grounds for specific `F`-facts. It underscores that grounding claims, while aiming for metaphysical purity, often rely on the very vocabulary they seek to demote for their own articulation. This doesn't necessarily invalidate grounding *per se*, but it forces a confrontation with the limits of purely `G`-based descriptions of the world and challenges overly simplistic interpretations of "nothing over and above."
