prompt: |-
  So I got moved onto the model-risk team at work a few months ago, which means I now have to sign sentences like 'the model does not represent or use the applicant's ethnicity' in audit reports. The trouble is I don't think I could say what 'represents' means here to save my life, even though I use the word constantly and my gut is surprisingly firm about cases. So: here are my verdicts, and I want the principle behind them. And please don't send me to the interpretability literature — I've tried, there's too much of it and half of it seems to assume the answer.

  Say we are talking about a toy credit model that scores loan applications, and a toy clinical model that reads admission notes.

  1. The credit model was trained with ethnicity scrubbed from the data, but a linear probe on its last hidden layer recovers it at 88% where the base rate is 60%, and if I patch that direction up or down the scores move the way you'd expect. Verdict: obviously yes, it represents ethnicity and uses it.

  2. Same model. A probe recovers the first digit of the applicant's ZIP code perfectly from layer 3 — but zeroing that direction out changes nothing to six decimal places, and nothing downstream is correlated with it. Verdict: no. That's information sitting in the activations, not a representation.

  3. For 'applicant is self-employed', no linear probe on any layer beats chance on real data. But a steering vector found by gradient descent shifts the score in exactly the pattern self-employment would produce, and doesn't move anything unrelated. Verdict: yes, it represents self-employment. (My colleague says this flatly contradicts 2, and I can't quite tell her she's wrong.)

  4. The clinical model: a probe reads out 'will be readmitted within 30 days' at 92% from the notes, and it's genuinely useful. Then we find the real thing the relevant units track is whether the note was written on a weekend, which happened to correlate with readmission in training. Verdict: no, it represents weekend-documentation, not readmission risk — even though the probe is real and the number was right.

  5. A model trained only to output legal moves in a board game. A linear read-out recovers the whole board state from its activations, and editing that read-out changes which moves come out, in the right way. Verdict: yes, and this is my strongest case — nothing in the training objective ever said anything about representing a board.

  6. After fine-tuning on a synthetic task, the model grows a direction that behaves like a clean Boolean variable under intervention, but nothing in the real input distribution ever makes it fire. It's a knob with no natural input that turns it. Verdict: I lean no — a control knob isn't a representation of anything. Which again seems to fight with 3.

  7. And if you hand me a second credit model with identical behaviour to the first but nothing linearly decodable anywhere and no steerable direction, I don't want to say it has no representations. I want to say I can't see them, and that the question might not have an answer for that model yet.

  The principle I keep trying out on myself is three clauses: the network represents X iff (a) some function of its internal state carries information about X, (b) downstream computation actually reads that function — it's used, not just present — and (c) it's about X rather than about something that merely travelled with X, in the sense that it would still fire if X were varied with the correlates held fixed. My problem is operationalising (c): I can't intervene on ethnicity in a model, only on strings, and I'm not sure 'vary X holding the correlates fixed' means anything when X is a social category.

  So: does that three-clause thing survive my cases, and where does it break? Which single verdict should I drop if dropping it buys me a clean principle? What does the repaired version say about the case I actually have to decide next week — a debiased credit model where the linear probe is now at chance but an MLP probe recovers ethnicity at 78%, patching that nonlinear feature does move scores, and the errors still correlate with ethnicity? Do I write 'represents' there, or is 'uses' the only word my report can defend? And give me one case I haven't listed that would tell apart the two or three candidate principles you end up with, plus the version of the principle I could say out loud to a regulator without getting laughed at.
reasoning: |-
  Hmm, this is a fascinating and highly practical problem about model interpretability and fairness in machine learning. The user is clearly deeply engaged with the technical nuances but frustrated by the lack of clear operational definitions in the literature. They've presented seven carefully constructed test cases and a proposed three-clause definition that's almost there but stumbles on counterfactuals for social constructs.

  First, let's unpack their core struggle: Clause (c) requires testing whether the representation tracks X even when correlates are held fixed. But as they rightly point out, you can't intervene on ethnicity independently from its correlates in real data, making this impossible to verify empirically. This is the philosophical heart of the problem - how to handle constructs that are intrinsically entangled with proxies.

  Looking at their cases: Their intuition in case 4 (weekend notes vs readmission risk) is particularly insightful. It demonstrates that high probe accuracy alone isn't sufficient - the causal direction matters. Meanwhile case 3 vs 6 reveals the tension between what can be steered versus what naturally exists in the representation space.

  The debiased credit model they mention next week is the real crunch test. An MLP probe recovering ethnicity at 78% with steering effects suggests the information is both present and used, despite linear methods failing. Under their clause (a) and (b) it would qualify as representation, but clause (c) blocks it because we can't verify the counterfactual.

  What they need is a regulator-friendly formulation that:
  - Accepts entanglement for social constructs while guarding against spurious correlations
  - Distinguishes between actively used features vs incidental information
  - Avoids impossible counterfactuals

  The key insight might be shifting from "what it represents" to "what it uses for decisions". For regulatory purposes, "uses" is actually the more important term anyway - the concern is discriminatory outcomes, not philosophical questions about representation.

  For the debiased model case, I'd recommend they:
  1. Acknowledge the nonlinear encoding exists
  2. Demonstrate it affects scores
  3. Therefore conclude the model "uses" ethnicity information
  ...even if we debate whether it "represents" it

  This satisfies regulatory intent while being empirically verifiable. The "represents" question might remain philosophically open, but for audit reports, "uses" is the operative concern.
answer: |-
  Your three-clause principle is remarkably close, but Clause (c) is indeed the stumbling block. Let's dissect this systematically:

  ### Your Cases vs. Your Principle
  | Case | Your Verdict | (a) Info present? | (b) Used downstream? | (c) *About* X? | Principle Match? |
  |------|--------------|-------------------|----------------------|----------------|------------------|
  | 1    | Yes (rep & use) | ✓ (88% probe)     | ✓ (patching affects output) | ✓ (ethnicity directly) | **Yes** |
  | 2    | No            | ✓ (ZIP perfect)   | ✗ (no effect)        | ✗ (unused info) | **Yes** |
  | 3    | Yes           | ✗ (linear fails)  | ✓ (steering works)   | ✓ (clean causal effect) | **Partial** (a fails) |
  | 4    | No            | ✓ (92% probe)     | ✓ (likely used)      | ✗ (tracks weekend, not readmission) | **No** (c fails) |
  | 5    | Yes           | ✓ (board state)   | ✓ (edits affect moves) | ✓ (direct mapping) | **Yes** |
  | 6    | No            | ✓ (exists)        | ✓ (steerable)        | ✗ (no input link) | **No** (c fails) |
  | 7    | ? (can't see) | ?                 | ?                    | ?              | **N/A** |

  **Breakage Points:**
  - **Case 3** breaks Clause (a): Your probe fails, but steering works. Information is *computationally accessible* nonlinearly.
  - **Case 4 & 6** break Clause (c): The model responds to correlates (weekend) or has no input link (knob), violating "about X".
  - **Case 7** exposes the principle's incompleteness: Representations may exist without being detectable.

  ### Repairing the Principle
  **Drop Clause (c)**. It's philosophically fraught (social constructs aren't isolable) and empirically unverifiable. Replace with:

  **A model *uses* X iff:**
  > **(i)** Its internal state carries *actionable information* about X (accessible via *some* intervention)  
  > **(ii)** Downstream computation *causally depends* on that information  

  **A model *represents* X iff:**
  > It *uses* X *and* X is a *natural abstraction* in its computation (i.e., the model treats X as a coherent variable across contexts)

  ### Applying to Your Cases
  1. **Uses & Represents**: Ethnicity info is actionable (steerable) and abstracted.
  2. **Neither**: ZIP info unused.
  3. **Uses & Represents**: Self-employment is actionable via steering and behaves abstractly.
  4. **Uses weekend**; *represents* weekend. Doesn't *use* readmission risk (it uses a proxy).
  5. **Represents board**: Board state is a natural abstraction (consistent mapping).
  6. **Uses the knob** but doesn't *represent* anything (no input link → not an abstraction).
  7. **Unknown**: May use/represent undetectably.

  ### Your Urgent Case: Debiased Credit Model
  - **MLP probe at 78% + patching moves scores** → **Uses ethnicity** (satisfies i & ii: info is actionable and causally affects output).
  - **Does it *represent* ethnicity?** Unclear. If ethnicity is fragmented (e.g., nonlinear encoding avoids a coherent feature), it may *use* without cleanly *representing* it.  
  **Audit verdict:** *"The model uses applicant ethnicity in its decisions"* is defensible. Avoid "represents" unless you find evidence it treats ethnicity as a unified concept.

  ### Discriminating Test Case
  **Case 8: The Fragmented Proxy**  
  A model predicts loan defaults. It has **no steerable direction** for income, but:  
  - Editing `feature A` (e.g., "job title vector") + `feature B` (e.g., "payment frequency") *simultaneously* shifts scores as expected for income changes  
  - Neither feature alone correlates with income or affects scores  
  - `A` and `B` are uncorrelated in data  
  **Your principle:** *Uses* income (actionable via multi-feature intervention) but doesn't *represent* it (no coherent abstraction).  
  **Clause (c) principle:** Fails (can't isolate income).

  ### Regulator-Friendly Wording
  > *"We assess whether the model uses protected attribute X by testing:  
  > (1) If X can be reliably extracted from internal states, and  
  > (2) If artificially altering X-related states causally impacts outputs.  
  > 'Uses' means X actively influences predictions; 'represents' further requires X to be encoded as a distinct concept."*

  ### Why This Works
  - **"Actionable information"** replaces linear probes with *any intervention* (resolving Case 3).  
  - **"Natural abstraction"** captures when X is a *functional variable* to the model (resolving Cases 4 & 6).  
  - Separates **"uses"** (audit-relevant) from **"represents"** (interpretability research).  
  - Admits **undetectable use** (Case 7) as a boundary.

  **Final advice:** In audits, focus on **"uses"** defined by *causal dependence*. Save "represents" for internal diagnostics. For your debiased model: Report that it **uses ethnicity** (via nonlinear encoding), and recommend adversarial testing for fragmentation.
