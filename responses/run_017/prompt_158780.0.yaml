answer: |-
  Below is a comprehensive activity design that meets your specifications. It uses a "Black Box" scenario where students investigate a simulated system (the "box") with a hidden rule. The activity forces confrontation with structural underdetermination through actionable divergence, a fixed observation vocabulary with costly extensions, and a scoring system that penalizes being right for the wrong reasons.

  ---

  ### **Activity: The Black Box Challenge**  
  **Goal**: Students experience that passive observation cannot distinguish between empirically equivalent theories, and that intervention is costly but necessary to break underdetermination.  

  #### **Setup Overview**  
  - **The Black Box**: A simulated system (you, the instructor) that outputs symbols (e.g., "↑" or "↓") at fixed intervals.  
  - **Hidden Rule**:  
    - *No intervention*: Output alternates ("↑" on odd minutes, "↓" on even minutes).  
    - *After intervention*: Output is always "↑" (regardless of minute).  
  - **Two Rival Theories** (implicitly emerge; never named upfront):  
    - **Theory A**: Output is determined solely by time (odd/even minutes). *Predicts no change post-intervention*.  
    - **Theory B**: Output is determined by an internal state reset by intervention. *Predicts permanent "↑" post-intervention*.  
  - **Key Twist**: Both theories agree on all *observational* predictions but diverge on *interventional* predictions. Intervention costs resources, forcing a collective decision.  

  ---

  ### **Materials**  
  1. **Whiteboard**: Divided into:  
     - *Observations*: Columns for "Time," "Output," and purchased categories.  
     - *Theories*: Space for student-generated hypotheses.  
     - *Token Tracker*: Tracks remaining tokens (start with 10).  
     - *Decision Log*: Records intervention votes and outcomes.  
  2. **Index Cards**:  
     - 1 pack for recording observations (students fill these during data collection).  
     - 1 pack for voting on interventions/category purchases.  
  3. **Tokens**: 10 physical tokens (e.g., poker chips) for purchasing new observation categories or interventions.  
  4. **Printed Handout (fixed observation vocabulary)**:  
     ```  
     PERMITTED CATEGORIES (free to record):  
     - Time (minute 0, 1, 2, ...)  
     - Output ("↑" or "↓")  

     NEW CATEGORIES COST 1 TOKEN EACH. Propose during "Extension Phase."  
     ```  
  5. **Timer**: For strict 80-minute pacing.  

  ---

  ### **Timeline (80 Minutes Total)**  
  **Phase 1: Data Collection & Theory Proposals (25 min)**  
  - **0–5 min**: Introduce the Black Box.  
    - *Rules*: The box outputs every minute. Students record **Time** and **Output** on index cards. No theories yet!  
    - *Output sequence (no intervention)*:  
      - Min 0 (even): ↓  
      - Min 1 (odd): ↑  
      - Min 2 (even): ↓  
      - ... (continue alternating for 10 minutes).  
  - **6–15 min**: Collect data. At each minute, announce the output (e.g., "Minute 1: ↑"). Students record privately, then a volunteer transfers data to the whiteboard.  
  - **16–25 min**: Form theories.  
    - Divide students into two teams (9 each).  
    - *Task*: Each team proposes a theory that explains the data (write on whiteboard).  
    - *Likely outcome*: Both teams propose variants of Theory A (time-based). If not, subtly seed Theory B as a "curveball" (e.g., "What if there’s an internal clock?").  

  **Phase 2: Vocabulary Extension (15 min)**  
  - **26–30 min**: Propose new categories.  
    - Teams suggest new measurable categories (e.g., "Temperature," "Humidity," "Sound").  
    - *Rule*: Each new category costs 1 token. Class votes (majority) on purchases.  
  - **31–40 min**: Collect data with new categories.  
    - *Output*: Continue alternating (↑/↓). For new categories, report *random but consistent* values (e.g., "Temperature: 22°C always").  
    - *Key insight*: New data fits both theories, wasting tokens without breaking underdetermination.  

  **Phase 3: Intervention Decision (20 min)**  
  - **41–50 min**: Introduce intervention.  
    - *Rule*: A "button press" (intervention) costs 3 tokens. If pressed, outputs change per hidden rule.  
    - *Divergence*: Teams predict post-intervention outcomes:  
      - Theory A predicts continued alternation.  
      - Theory B predicts permanent "↑".  
    - *Cost*: Spending tokens risks resources; not spending risks ignorance.  
  - **51–60 min**: Debate and vote.  
    - Teams discuss, then vote via index cards (anonymous majority vote).  
    - *If they intervene*: Output becomes "↑" for all subsequent minutes.  
    - *If they decline*: Output continues alternating.  

  **Phase 4: Final Data & Scoring (10 min)**  
  - **61–65 min**: Collect 5 more minutes of data (post-decision).  
  - **66–70 min**: Teams write final theories (include intervention effects if tested).  

  **Phase 5: Scoring & Prep for Debrief (5 min)**  
  - Calculate scores (see below) but **do not reveal hidden rule yet**.  

  ---

  ### **Scoring Rule**  
  - **Tokens**: 1 point per token remaining.  
  - **Final Theory (20 points)**:  
    - 10 pts for pre-intervention accuracy.  
    - 10 pts for post-intervention accuracy (if tested) or explanation of untested case.  
  - **Penalties**:  
    - –5 pts if final theory is *accidentally correct* but misattributes cause (e.g., if they don’t intervene but claim post-intervention behavior without evidence).  
  - **Winner**: Team with highest total.  
  - **Designed sting**:  
    - Teams that skip intervention may guess post-intervention rules correctly but lose points for lack of evidence.  
    - Teams that waste tokens on useless categories lose points even if their theory is right.  

  ---

  ### **Debrief (10–15 min post-activity)**  
  Map student experiences to concepts **before naming them**:  

  1. **Weak/Transient Underdetermination ("Poverty of Data")**:  
     - *When it arose*: During vocabulary extension (Phase 2), students believed new data would resolve ambiguity.  
     - *Collision*: New categories added noise but no resolution—underdetermination persisted despite "more data."  
     - *Instructor prompt*: "Why didn’t extra measurements settle the debate?"  

  2. **Structural Underdetermination**:  
     - *When it arose*: During intervention debate (Phase 3), both theories fit all data, but only intervention could break the tie.  
     - *Collision*: Students had to pay a cost to distinguish theories, proving evidence alone was insufficient.  
     - *Instructor prompt*: "What did the intervention cost that observation couldn’t provide?"  

  3. **Vocabulary Artifact**:  
     - *When it arose*: When teams spent tokens on categories like "Temperature" that didn’t correlate with outputs.  
     - *Collision*: Underdetermination was partly created by what they *couldn’t* measure, but fixing it required theoretical justification (e.g., "Why measure temperature?").  
     - *Instructor prompt*: "Did the box or your *choices* cause the stalemate?"  

  4. **Observation-Intervention Asymmetry**:  
     - *When it arose*: Post-intervention, predictions diverged only when action was taken.  
     - *Collision*: Teams realized passive observation couldn’t access "what-if" scenarios.  
     - *Instructor prompt*: "Why could you only test the theories by *doing* something?"  

  **Now name the concepts**:  
  - "What you called ‘poverty of data’ is **weak underdetermination**."  
  - "What felt like a permanent stalemate is **structural underdetermination** (Duhem-Quine thesis)."  
  - "The vocabulary problem mirrors **theory-laden observation**."  
  - "The action/observation split is the **interventionist account of causation**."  

  **Elicit "What should a scientist do?"**:  
  - Guide students to generate tie-breakers:  
    - *Simplicity*: Theory A required no hidden states.  
    - *Fruitfulness*: Theory B suggested new experiments (e.g., multiple interventions).  
    - *Consilience*: Which theory aligned with other known systems?  
  - Emphasize: "Tie-breakers aren’t evidence—they’re pragmatic tools for managing uncertainty."  

  **End with your aim**: "Science isn’t arbitrary; it’s a process of **managed underdetermination** through intervention and judgment."  

  ---

  ### **Forecasted Problems & Solutions**  
  1. **Problem: Strong students meta-game the system**.  
     - *Example*: "The instructor wants us to intervene, so we should!"  
     - *Solution in rules*: Impose a token economy. If they intervene frivolously, they lose points for wasted tokens. Ask: "How will you justify this cost to your team?"  

  2. **Problem: Students extract hints via questions**.  
     - *Example*: "Is temperature relevant?"  
     - *Solution in rules*: Only answer questions about *procedure*, not the box. Say: "I report only what you measure per your purchased categories."  

  3. **Problem: Group polarization in debates**.  
     - *Example*: Teams entrench and shout past each other.  
     - *Solution in rules*: Use anonymous voting (index cards) to depersonalize decisions. Impose time limits for debates.  

  4. **Problem: "Science is arbitrary" takeaway**.  
     - *Solution in debrief*: Highlight that intervention *broke* arbitrariness. Contrast with global skepticism: "This was a local, solvable problem—not cosmic doubt."  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Theories as holistic webs**:  
     - *Reality*: Real theories are networks of assumptions (e.g., quantum mechanics depends on prior math/physics).  
     - *To supply*: Discuss how background knowledge (e.g., conservation laws) silently resolves underdetermination in practice.  

  2. **Shared background commitments**:  
     - *Reality*: Scientists agree on baseline assumptions (e.g., "gravity exists").  
     - *To supply*: Note that in the activity, teams lacked shared priors, amplifying underdetermination.  

  3. **Global skepticism**:  
     - *Reality*: Cartesian doubt questions *all* evidence.  
     - *To supply*: Clarify that underdetermination is local and empirical—not about "evil demons." Use the activity to distinguish scientific underdetermination from philosophical skepticism.  

  4. **Complexity of real interventions**:  
     - *Reality*: Real experiments have cascading uncertainties (e.g., confounding variables).  
     - *To supply*: Compare the "button press" to real-world experiments (e.g., LHC collisions), emphasizing error margins and auxiliary hypotheses.  

  ---

  This design forces students to confront structural underdetermination through a costly, actionable choice. It avoids key terms until the debrief, leverages your constraints (fixed vocabulary, intervention asymmetry, scoring sting), and preempts common pitfalls. Run it as a tight simulation, and let the collision with uncertainty drive the learning.
