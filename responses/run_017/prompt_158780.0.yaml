  **Roles**:
  - The class is divided into two teams of 9 students each. Each team has a spokesperson who presents their theory and arguments.
  - Alternatively, to promote whole-class discussion, we can have them as one group but with two subgroups that are assigned to argue for one of the two theories? But we want them to come up with the theories? Let's adjust.

  We want the two theories to emerge. So:

  1. **Phase 1: Data Collection (10 minutes)**
     - For the first 10 minutes, the box produces outputs without intervention. At each minute (you control the timing), you announce the output: 
