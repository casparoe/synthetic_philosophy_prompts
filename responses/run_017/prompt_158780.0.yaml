     - Then, each team presents their theory to the class. We hope that both teams come up with T1 (the alternating pattern) because it's the obvious one. But if one team comes up with T2 (the counter theory) that's also consistent, then we use that. If both come up with T1, then the instructor introduces T2 as an alternative theory that has been proposed by a rival research group. Write both on the board.

     - T1: The output is determined by the minute: A on odd minutes, B on even minutes. (This is the same as the alternating pattern because odd and even alternate.)
     - T2: The box has an internal counter starting at 0. At each minute, if the counter is even, it outputs B and then increments by 1; if odd, it outputs A and then increments by 1. (Note: this produces the same as T1 for the initial data.)

