  We are designing an activity for an upper-division philosophy of science seminar. The goal is to have students experience the gap between the weak (transient) underdetermination (poverty of data) and the strong (structural) underdetermination. The activity should avoid using key terms until the debrief. Key constraints:

  1. **Actionable divergence**: The rival theories should agree on all observations and predictions when no one intervenes, but disagree on what would happen if someone intervenes. Deciding to intervene has a cost, and the group must decide whether to pay it without knowing if it's worth it.

  2. **Fixed observation vocabulary**: A printed list of permitted recording categories. To add a category, they must spend a scarce token. This highlights that underdetermination might be an artifact of the measurement capabilities.

  3. **Payoff scheme**: Scored against a hidden data stream. Being right for the wrong reason should be distinguishable from being right for the right reason.

  We need:

  - Setup: roles, teams, timeline, materials, scoring rule, intervention decision rule.
  - Debrief: mapping moments to concepts, then introducing standard names and objections. End with what a scientist should do and the role of tie-breakers.
  - Forecast of problems and how to head them off.
  - A note on what the activity cannot reproduce.

  Let's design the activity step by step.

  ### The Scenario: The Mysterious Box

  We'll use a scenario with a "black box" that produces data. The box represents a system that the students are trying to understand. They will form two theories about the box's internal mechanism. The box is actually simulated by the instructor (you) using a hidden rule.

  #### The Hidden Rule
  The box produces a sequence of outputs (e.g., colored lights or symbols) based on two factors: 
  - The time (minute within the session, or a step counter)
  - Whether an intervention has been performed

  We want two theories that are empirically equivalent until an intervention is made. Let the hidden rule be:

  - If no intervention has ever been performed, the box outputs "A" at every odd minute and "B" at every even minute.
  - If an intervention has been performed (at any time), then the box outputs "A" at every minute (both odd and even).

  Now, we need two theories that are compatible with the initial data (without intervention) but that make different predictions about what happens after an intervention.

  **Theory 1 (T1)**: The box always outputs "A" on odd minutes and "B" on even minutes. (This is the true rule before intervention, but it doesn't account for the change after intervention.)

  **Theory 2 (T2)**: The box outputs based on a hidden state that can be changed by intervention. Specifically, T2 says: 
  - Initially, the state is 0. In state 0, it outputs "A" on odd and "B" on even.
  - There is a button (the intervention) that, when pressed, changes the state to 1. In state 1, it outputs "A" every minute.

  Both T1 and T2 are consistent with the pre-intervention data. But they disagree on what happens after pressing the button (intervention). T1 predicts that after pressing the button, the pattern remains the same (so at the next odd minute, "A"; even, "B"). T2 predicts that after pressing the button, it becomes "A" every minute.

  However, note that after the intervention, the box (by the hidden rule) does become "A" every minute. So if they press the button, T1 is falsified and T2 is confirmed. But without pressing, they cannot tell.

  But wait: if they never press the button, both theories are consistent with all data. This is the underdetermination.

  We also want to have the possibility of extending the observation vocabulary. So we can allow them to request additional measurements (like the temperature of the box, or a sound, etc.) but at a cost.

  #### Materials
  - A whiteboard for recording observations and theories.
  - Index cards for students to write down their observations and for voting or proposing actions.
  - Tokens (e.g., poker chips) for purchasing new measurement categories. Start with a limited number (say 10 tokens for the whole class).
  - A printed list of permitted recording categories at the start. For example:
    - Output symbol (A or B)
    - Minute of class (odd/even) - but note we don't want to give away the pattern too easily, so maybe just the time in minutes from start?
    - We can have a few basic ones: 
      - Time (in minutes from start, recorded as an integer)
      - Output (A or B)
      - (Optionally) Ambient temperature in the room (but we don't want to introduce irrelevant variables that complicate without reason)

  We can add more categories that they might request, such as:
    - Color of a light on the box (if we simulate that)
    - Sound level (decibels)
    - Vibration
    - etc.

  But note: we don't want these additional measurements to break the underdetermination without intervention. So the hidden rule should not depend on these extra factors. They are red herrings.

  #### Teams and Roles
  - Divide the class into two teams. Each team will develop a theory about the box. They are allowed to discuss within the team and then present to the whole class. But they are also allowed to change their theory as new data comes in.
  - Alternatively, we can have the whole class as one group that must come to a consensus, but that might be too slow. Given 18 students, two teams of 9 might work.

  But note: we want them to experience the underdetermination, so both teams might come up with the same two theories? Or we can seed the two theories.

  Alternatively, we don't assign theories, but let them form their own. Then we hope that one team comes up with T1 and the other with T2? But that might not happen. So we can guide by having two index cards with the two theories given to the teams? But that breaks the discovery. Instead, we can have the instructor (you) introduce the two theories as possibilities that have been proposed by previous researchers? But that might be leading.

  Another idea: after some initial data collection, ask each team to propose a theory. Then, if they both propose T1 (or variations of it), we can have a planted student or the instructor suggest T2? But that might be too intrusive.

  Alternatively, we can have the two theories emerge naturally by having the hidden rule be a bit more complex? But we need them to be empirically equivalent until intervention.

  Let's reframe: The box produces outputs for 10 minutes without intervention. Then we ask the teams to write down a theory. We then let them see more data (without intervention) for another 10 minutes. Then we introduce the possibility of intervention.

  But to make sure they have two candidate theories, we can have the instructor, after the first 10 minutes, say: "Two leading theories have been proposed: Theory 1 says ... and Theory 2 says ...". Then assign each team to defend one of them? But that might feel artificial.

  Alternatively, we can have the two theories as the only two that fit the data? And we can structure the data so that only two simple theories are possible? For example, the data is strictly alternating without intervention. Then the obvious theories are:
    T1: alternates every minute (A, B, A, B, ...)
    T2: outputs A on odd minutes, B on even (which is the same as T1 in the observed data)

  But that's the same theory. We need two different theories that are empirically equivalent.

  So let's make T2 a different mechanism. For example:

  T1: The output is determined by the minute modulo 2: if even minute, then B; if odd, then A. (This is the pattern we have.)

  T2: The box has an internal counter that starts at 0. At each minute, it outputs A if the counter is odd, B if even, and then increments the counter by one.

  In the first 10 minutes (minute 0 to 9), the outputs would be:

  Minute: 0 (even) -> T1: B, T2: counter=0 (even) -> B, then counter becomes 1.
  Minute 1: T1: A (odd), T2: counter=1 (odd) -> A, then counter becomes 2.
  Minute 2: T1: B, T2: counter=2 (even) -> B, then 3.
  ... so they are the same.

  But what happens after an intervention? We need to define what the intervention does. For the hidden rule, we said that after intervention, it becomes A every minute. So:

  - If we press the button (intervention) at any time, then from that minute onward, the output is always A.

  Now, what does T1 predict after intervention? T1 doesn't have a mechanism for intervention. So we have to define how T1 and T2 account for intervention.

  We can say that both theories must be extended to account for the possibility of intervention.

  For T1: The intervention has no effect. The pattern continues as before.

  For T2: The intervention resets the counter to 0 and then the box continues as before? Or we can define T2 as having a switch: the intervention flips a switch that makes the output always A. But then T2 becomes the true rule.

  Alternatively, to make them disagree:

  - T1: Intervention does nothing. The pattern continues (so at minute 11, which is odd, A; minute 12, even, B).
  - T2: Intervention causes the box to output A at every subsequent minute.

  Now, after intervention, if we press at minute 10 (even), then at minute 11 (odd):
  - T1 predicts A (because odd)
  - T2 predicts A (always)
  So they agree at minute 11? Then at minute 12 (even):
  - T1 predicts B
  - T2 predicts A

  So they disagree at minute 12.

  But note: if we press at an odd minute, say minute 11, then at minute 12:
  - T1: even -> B
  - T2: always A -> A

  So they disagree at the first even minute after intervention.

  So we can do that.

  But we want them to have to decide whether to intervene without knowing which theory is true. And the intervention costs tokens (or some resource).

  #### The Setup

  **Materials**:
  - A whiteboard divided into sections: Observations, Theories, Action Log, and Score.
  - Index cards for each student (for writing observations, proposals, and votes).
  - Tokens: 10 tokens for the whole class to use for purchasing new measurement categories or for the intervention.
  - A printed list of initial permitted recording categories:
