  #### Timeline (80 minutes total)

  - (5 min) Introduction: Explain the black box. It will emit an output every minute. They are to figure out the rule governing the outputs. They can record only the categories on the permitted list. They have 10 tokens to buy new measurement categories or to use for an intervention (pressing a button). The button press costs 3 tokens. The goal is to have the best possible understanding of the box with the fewest resources.

  - (10 min) **Phase 1: Initial Data Collection**. Every minute, you announce the output (starting at minute 0: B, 1: A, 2: B, ...). Students record time and output. Do this for 10 minutes.

  - (10 min) **Phase 2: Theory Formation**. In teams, develop a theory. Then, each team presents. If both teams have the same, introduce an alternative (T2) as a competing theory. Write both on the board.

  - (15 min) **Phase 3: Vocabulary Extension**. Teams can propose new categories. The class must agree on which to buy. Each costs 1 token. You report values for the new categories for the next 5 minutes (minutes 10-14). The outputs continue alternating (no intervention yet). The new data should not help distinguish.

  - (15 min) **Phase 4: Intervention Decision**. Explain that pressing the button is an intervention that might affect the box. It costs 3 tokens. The class debates and decides whether to press. They vote by secret ballot (index cards) or show of hands? We want it to be a group decision. If they decide to press, you press at minute 15. Then from minute 15 onward, the output is always A. If they don't press, continue alternating.

  - (15 min) **Phase 5: Final Data and Reports**. Run 5 more minutes (minutes 15-19 if pressed, or 15-19 without press). Then teams have 5 minutes to write a final theory. They should include the effect of intervention if they pressed.

  - (5 min) **Scoring and Initial Reflection**. Calculate the score. But we won't reveal the hidden rule yet.

  - (10 min) **Debrief**. Now we reveal the hidden rule and discuss.

  ### Debrief

  Map the activity to the concepts:

  1. **Weak/transient underdetermination**: At first, they thought more data (or more kinds of data) would settle the matter. But even after 10 minutes and buying new categories, the two theories were still compatible with the data. This is the poverty of data view: if only we had more, we could tell.

  2. **Structural underdetermination**: They had to face that no amount of passive observation (even with extended vocabulary) would distinguish the two theories. The only way was to intervene, and that had a cost. This is structural because it's about the relationship between the theories and the data, not about the amount.

  3. **Vocabulary artifact**: They spent tokens on new measurement categories, but these didn't help. The underdetermination was not due to a lack of data but due to the structure of the theories and the available observations. The fixed vocabulary limited what they could observe, and extending it didn't break the underdetermination.

  4. **Observation-intervention asymmetry**: The theories agreed on all observations but disagreed on what would happen if they intervened. The only way to break the tie was to do something (intervene), not just to observe more.

  Then introduce the standard terms: underdetermination (both weak and strong), empirical equivalence, Duhem-Quine thesis (that theories are tested in bundles), and the role of intervention (as in active experimentation).

  Finally, discuss what a scientist should do: 
  - Sometimes, we must perform experiments that intervene, even though they are costly and risky. 
  - But also, we use tie-breakers like simplicity: T1 is simpler (it doesn't postulate an internal state) so maybe they would prefer T1 without intervention. But T2 might be more fruitful (it suggests that interventions can change the state, which might lead to new experiments). 
  - Note that in real science, background knowledge often breaks ties. Here, they had no background knowledge.

  ### Forecast of Problems

  1. **Stronger students meta-gaming**: They might try to figure out the instructor's hidden rule by thinking about what would make a good teaching point. To head this off, emphasize that the box's rule is arbitrary and not designed to be educational. Also, the rule is fixed and not changed based on their actions (except for the intervention).

  2. **Extracting information by asking questions**: They might ask leading questions. Have a rule: you only answer questions about the rules of the activity, not about the box. For the box, you only report the permitted measurements.

  3. **Group splits and asserts past each other**: Structure the discussion with time limits and require each team to present arguments. Use a moderator (could be you) to ensure both sides are heard. Also, the decision to intervene is a class vote, so they have to coalesce.

  4. **Risk that science seems arbitrary**: In the debrief, emphasize that the underdetermination is local and temporary. By intervening, they can break the tie. Also, in real science, theories are embedded in a web of beliefs, and we use methodological principles (simplicity, fruitfulness) to guide us. The activity shows that science is not arbitrary because we have methods (like intervention) to resolve underdetermination.

  ### What the Activity Cannot Reproduce

  - Real theories are whole webs: The activity uses isolated, simple theories. In real science, theories are connected to many other theories and background knowledge.
  - Scientists share background commitments: This shared background often breaks ties without explicit discussion. In the activity, they have no shared background.
  - Global skepticism: The activity addresses local underdetermination between two specific theories, not the global possibility that all our theories might be false.

  In discussion, you will have to supply these points.

  ### Final Adjustments

