  ### Case: The Municipal Parkland Allocation Committee

  In a city's parkland allocation committee, two long-standing members—**A**, who prioritizes preserving undisturbed wildlife habitats, and **B**, who prioritizes expanding accessible recreational spaces—face a recurring decision. Both value the other’s goal but as secondary: A views recreation as a legitimate but lesser good, while B sees habitat preservation as valuable but less urgent than community health. A compromise package arises: A will support B’s proposal to develop a small section of a forested area into a playground (which A sees as complicity in environmental degradation, a moral cost), and B will support A’s proposal to designate an adjacent meadow as a protected habitat (which B sees as complicity in denying recreational access to underserved communities, a moral cost). Each concession is a positive act (voting for the other’s proposal) that directly enables the disvalued outcome. The package yields net gains for both: A secures 90% of their habitat goal but bears a moral cost for the playground, leaving them better off than the status quo (no new protections or development). Similarly, B secures 90% of their recreation goal but bears a moral cost for the habitat, leaving them better off. The concessions are comparable in moral weight (e.g., both experience the cost as a "betrayal of core duty"), and gains arise from trading what each discounts but the other prizes. The committee’s rules require sequential voting: habitat designation first, then recreation development. Trust is essential, as each must vote for the other’s project *after* their own priority is secured, with no binding contracts.

  #### Verdicts and Analysis
  **Deontological Integrity (Williams-style) Accepts the Package**  
  A and B, as deontologists, hold identity-conferring commitments (A: "I am a guardian of nature"; B: "I am a champion of community access"). They honor the compromise as a promise, which is itself a core duty. At the vote on recreation development, A has already secured the habitat but votes for the playground because reneging would violate their self-conception as a trustworthy agent. Similarly, B votes for the habitat after securing the playground. The moral costs (complicity) are incurred, but the commitment to promise-keeping provides an overriding reason not subject to trade-offs. This resolves the sequential trust problem: each knows the other’s character as duty-bound, enabling mutual cooperation.

  **Act-Consequentialism (AC) as Decision Procedure Fails**  
  AC requires maximizing expected good at each point of action. Consider A’s decision during the recreation vote: the habitat is already secured. Voting for the playground incurs a moral cost (e.g., -10 utility) with no offsetting gain for A (the habitat is already theirs). Defecting (voting "no") avoids this cost, yielding higher personal utility. B reasons identically during the habitat vote. Crucially, **transparency and mutual knowledge** of AC agency exacerbate this: both know the other is a maximizer. Thus, B predicts A will defect in the recreation vote, so B preemptively defects in the habitat vote to avoid moral cost. The package collapses to the status quo (no gains). AC fails **structurally**: gains require credible commitment to reciprocate *despite* the post-concession action being suboptimal, which transparent maximizers cannot provide. This is not welfare arithmetic turning negative; even with net gains (60 > 0), sequentiality and mutual knowledge create a prisoner’s dilemma where defection dominates.

  **Key Features Generating Verdicts**  
  - **Sequentiality and Transparency**: Gains require deferred reciprocity, but AC’s myopic optimization at each step incentivizes defection once one’s goal is secured. Mutual knowledge of maximization ensures mutual defection.  
  - **Moral Costs as Non-Fungible**: Costs are not mere "disutilities" but experienced as integrity violations (e.g., "becoming an environmental vandal"). For deontology, these are absolved by duty to promise; for AC, they are costs to avoid.  
  - **Incommensurability**: If losses were commensurable (e.g., both reducible to "public welfare units"), AC might support the package via net gains. But with incommensurable values (habitat integrity ≠ recreation access), the moral costs resist aggregation, making defection rational for the maximizer.  

  **Testing the Case**  
  - **Remove Transparency**: If reasons/characters were opaque, AC agents might cooperate by mistake (e.g., hoping the other reciprocates). Gains might occur but would be unstable, vanishing once transparency is restored.  
  - **Remove Incommensurability**: If both losses shared a scale (e.g., "social welfare points"), AC could treat concessions as costs in a unified maximization, securing the package. The structural failure disappears, collapsing into routine optimization.  

  **Strongest Consequentialist Objection and Reply**  
  **Objection (Indirect/Rule-Consequentialism)**: AC agents could cultivate a "cooperative disposition" (e.g., rule: "always keep promises") to secure long-term gains. Rule-consequentialism (RC) might directly endorse this rule. This could resolve the commitment problem without abandoning consequentialism.  
  **Reply**: The case closes this via **ordinary social facts**. First, the agents are known to use AC *as a decision procedure* (not RC or dispositions), evident from their history of flexible, outcome-driven votes. Cultivating a disposition is impossible here: the committee’s transparency ensures any "cooperative turn" would be seen as strategic (hence untrustworthy) or alien to their character. Second, RC fails because the rule ("keep promises") would be rejected by AC agents in *this specific vote*: after securing their goal, breaking the promise yields higher returns (avoiding moral cost) with low risk (future interactions allow renegotiation). RC’s flexibility paradoxically undermines credibility. The case survives: it shows not that consequentialism must be self-effacing (i.e., hidden), but that its *transparent application* forfeits gains. The gains require non-maximizing agency at the point of action—something consequentialism, even indirectly, cannot replicate under full transparency.  

  **Conclusion**  
  The case illustrates that moral compromise can generate gains inaccessible to transparent maximizers. It upholds the mirror-image thesis: deontology’s "rigidity" enables cooperative bargains where consequentialism’s "flexibility" induces failure.
