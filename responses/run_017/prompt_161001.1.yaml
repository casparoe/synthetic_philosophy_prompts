  I am writing a paper on moral compromise as a source of gains from trade, and I need a case for the section in which I argue that the usual division of labour between consequentialism and deontology has a mirror image. Normally the story is told with the deontologist as the rigidity problem and the consequentialist as the flexible problem-solver; I want to show that there are bargains whose gains are available only to agents who are not, at the point of action, maximizing — gains forfeited by exactly the flexibility consequentialism prizes. So I need a case built to specification, not gestured at. It will appear in a journal article for a general philosophical readership, so it must be readable without stage-setting: one paragraph, a realistic institution, nothing exotic.

  The specifications. Two standing parties inside a single institution — a hospital ethics committee, a school board, a municipal council, something of that kind — who know each other well and will face each other again. Their values are genuinely different and not reducible to a common scale; neither is correcting a factual mistake, neither is a fanatic, neither can be converted by further argument, and neither is nearer the truth than the other. Hold all of that fixed. There is a package on the table: A gets more of what A weights heavily, B gets more of what B weights heavily, each conceding what the other cares about more, so that both are better off by their own lights and the gain is not just a divisible good split down the middle. Each concession must be a positive act of complicity in something the conceding party registers as a moral cost — not a forbearance, not a payment, not something it was going to do anyway — and the two concessions should be of roughly comparable weight.

  The verdicts I want generated, not stipulated: an integrity-based deontological view of the Williams sort, on which an agent's identity-conferring commitments give her reasons that are not to be traded off, can accept the package; straightforward act-consequentialism, taken as a decision procedure, cannot reach it. It must fail for a structural reason — the gains depend on each party being credibly committed in a way a transparently maximizing agent cannot be, in circumstances where the parties' reasons are public and their characters mutually known — and the indirect escape route of cultivating the disposition while keeping the criterion private must be closed by the facts of the case rather than by fiat. No demons, no lie detectors, no perfect predictors: credibility has to come from ordinary social facts, and each party's unwillingness to deal with a known-flexible partner has to be a genuine commitment problem rather than pique.

  Then show the work. State which feature of the case generates each verdict, run both views through it explicitly, and show that the consequentialist's failure is not simply a welfare sum that happens to come out negative. Say what happens to the case if you remove the transparency of reasons, and what happens if you remove the incommensurability — if both losses are measurable on one scale, does it collapse into a routine maximizing problem? Finally, give me the strongest objection a consequentialist will make, the indirect and rule-consequentialist replies above all, and tell me honestly whether the case survives it or whether it only shows that consequentialism must be self-effacing.
reasoning: |-
  We are constructing a case that meets the following specifications:

  1. **Setting**: A realistic institution with two standing parties (e.g., hospital ethics committee, school board, municipal council) who know each other well and will interact repeatedly.
  2. **Values**: The two parties (A and B) have genuinely different values that are incommensurable (not reducible to a common scale). Neither is factually mistaken, fanatical, or convertible by argument. Neither is nearer the truth than the other.
  3. **The Package**: A compromise package where:
     - A gets more of what A values highly, conceding something that B values highly (but which A values less).
     - B gets more of what B values highly, conceding something that A values highly (but which B values less).
     - Each concession is a positive act of complicity (not forbearance, payment, or something they would do anyway) and carries a moral cost for the conceding party.
     - The concessions are of roughly comparable weight.
     - Both are better off by their own lights, and the gain is not just splitting a divisible good.
  4. **Verdicts**:
     - A deontological agent (with integrity-based commitments) can accept the package.
     - A straightforward act-consequentialist (using consequentialism as a decision procedure) cannot.
     - The failure of consequentialism must be structural: the gains depend on each party being credibly committed in a way that a transparent maximizer cannot be. The parties' reasons are public and their characters mutually known.
     - The indirect escape route (cultivating a disposition while keeping the criterion private) must be closed by the case facts (not fiat). No exotic devices (demons, lie detectors, etc.); credibility must come from ordinary social facts.
     - The unwillingness to deal with a known-flexible partner must be a genuine commitment problem (not pique).
  5. **Analysis**:
     - Show which feature generates each verdict.
     - Run both views (deontology and act-consequentialism) explicitly through the case.
     - Explain that the consequentialist's failure is not just a negative welfare sum.
     - Test the case by removing transparency of reasons and incommensurability.
     - Consider the strongest consequentialist objections (especially indirect and rule-consequentialist replies) and assess whether the case survives or only shows that consequentialism must be self-effacing.

  Let us design the case:

  **Case: The School Board and the Art-Science Budget Compromise**

  In a public school district, the school board must allocate a fixed budget for the next academic year. The board has two long-standing members with deep philosophical differences: **A**, who holds that arts education is essential for developing creativity and emotional intelligence, and **B**, who holds that science education is critical for fostering analytical skills and technological progress. Both value the other's concern but assign it a lower weight. They have worked together for years and will continue to do so.

  The board faces a specific decision: whether to fund a new **Arts Outreach Program** (AOP) proposed by A and a new **Science Lab Equipment** (SLE) upgrade proposed by B. The budget can fund both only if they are scaled back. The compromise package on the table is:

  - AOP is funded at 80% of the requested amount, but only if B votes for it. This would require B to actively support (by voting) an arts program that B believes is diverting resources from science, which B considers a moral cost (because it means fewer resources for science education, which B believes is a fundamental duty to the future).
  - SLE is funded at 80% of the requested amount, but only if A votes for it. This would require A to actively support (by voting) a science upgrade that A believes is diverting resources from the arts, which A considers a moral cost (because it means fewer resources for arts, which A sees as essential for human flourishing).

  Without the compromise, neither project is funded (due to a stalemate), so both get nothing. With the compromise, each gets 80% of their project. Each party values their own project at 100 and the other's at 40 (on their own scales). Without the compromise, they get 0. With the compromise, A gets 80 (from AOP) but also suffers a moral cost of 20 for complicity in underfunding science (which A values at 40 but the cost is the act of supporting the underfunding). Similarly, B gets 80 (from SLE) and suffers a moral cost of 20 for complicity in underfunding arts. So net: A gets 60 (80 - 20) and B gets 60 (80 - 20). Without the compromise, both get 0. So both are better off by 60 (by their own lights) than the status quo.

  The concessions: A's vote for SLE is a positive act of complicity in underfunding arts (because the SLE funding comes at the expense of the arts budget) and similarly for B. The moral cost is intrinsic to the act of supporting the other's project, which each sees as a betrayal of their own core commitment. The concessions are comparable: each gives up 20 (in net terms) in moral cost for the sake of the other's gain.

  **Running the views**:

  1. **Act-Consequentialism (AC) as decision procedure**:
     - AC requires that at the moment of decision, the agent chooses the action that maximizes the good (by their own lights). 
     - Consider A at the moment of voting. A must choose whether to vote for SLE. If A votes for SLE, then the package goes through: A gets 80 (from AOP) minus the moral cost of 20 (for supporting SLE) = 60. But if A does not vote for SLE, then the package fails and A gets 0. So voting for SLE yields 60, not voting yields 0. Thus, AC tells A to vote for SLE. Similarly, AC tells B to vote for AOP. 
     - However, the problem arises because the package requires both votes. But if both are AC agents, they know each other's reasoning and that they are both maximizers. Then, they can reason that the other will vote for the package because it is individually maximizing. So they both vote and the package passes. 
     - Why then the failure? The specification requires that each party's concession be a positive act that they register as a moral cost. But for an AC agent, the moral cost is just another negative consequence to be weighed. In this case, the net gain (60 vs 0) justifies the act. So it seems AC agents would accept the compromise.

  But wait: we need the gains to be forfeited by the flexibility of consequentialism. So we must adjust the case to create a commitment problem.

  **Revised Case: The Commitment Problem**

  The key is that the package requires each party to trust that the other will reciprocate. But if one party is known to be a flexible maximizer, the other may not trust that they will follow through on the concession. Moreover, the act of concession itself is costly and cannot be taken back once the other has gotten what they want.

  Let us change the case so that the concessions are sequential and irreversible. Suppose the board votes sequentially: first on AOP (which requires B's vote to pass) and then on SLE (which requires A's vote to pass). The order is fixed by procedure.

  - Step 1: Vote on AOP. For AOP to pass, it needs B's vote (along with A's, but A will vote for it). If AOP passes, then the arts program is funded at 80%.
  - Step 2: Vote on SLE. For SLE to pass, it needs A's vote (along with B's). If SLE passes, then the science upgrade is funded at 80%.

  But note: if AOP passes in step 1, then the funding for SLE becomes harder because the budget is now reduced. However, in our scenario, the budget is set so that if both pass, they are both at 80%. But the problem is that after step 1, if AOP has passed, then A has already gotten what they want. Now, in step 2, A must vote for SLE. But why would A do that? From A's perspective, they have already secured AOP. Voting for SLE now would incur a moral cost (of 20) and also use up resources that might have been used for other arts programs in the future (but in this case, we assume the budget is only for these two projects). However, if A does not vote for SLE, then A gets AOP (80) and no moral cost (so 80) and B gets nothing. If A votes for SLE, A gets 80 (from AOP) minus 20 (moral cost) = 60. So A, being an act-consequentialist, would prefer not to vote for SLE (80 > 60). Similarly, B, in step 1, if they anticipate that in step 2 A will not vote for SLE, then B would not vote for AOP in step 1 (because then B would get nothing and also have incurred the moral cost of voting for AOP). 

  So the problem: without trust that the other will reciprocate, the package fails. 

  But if both are AC agents and they know it, then they can predict:

  - In step 1: If B votes for AOP, then A will have no incentive to vote for SLE in step 2 (because A would get 80 without SLE, but only 60 with SLE). So B, knowing that A is an AC agent, knows that if he (B) votes for AOP, then in step 2 A will defect (not vote for SLE). Therefore, B will not vote for AOP in step 1 (to avoid the moral cost of supporting AOP without getting SLE). The result: both projects fail.

  Therefore, the compromise package (which would yield 60 for each) is not achieved.

  Now, what about a deontological agent? Suppose A and B are deontologists with commitments that include keeping promises and honoring agreements. They have a history of trust and a norm of reciprocity. They agree to the package as a whole: "I will vote for your project if you vote for mine." This agreement is seen as binding, not because of the consequences, but because of the duty to keep one's word. Even when step 2 comes and A has already gotten AOP, A still feels bound by the agreement to vote for SLE, despite the moral cost of supporting science. Similarly for B in step 1. Thus, they both follow through and the package passes.

  **Why the deontologist can accept**:
  - The deontologist has a commitment to the agreement (which is identity-conferring: they see themselves as trustworthy and honorable). Thus, they have a reason to vote that is not tradeable against the immediate consequences.

  **Why the act-consequentialist fails**:
  - Even though the package is beneficial, the sequential structure and the lack of commitment in the moment of action (step 2 for A) leads to defection. The transparency of maximization (each knowing the other is an AC agent) leads to the unraveling of the deal.

  **The role of transparency and mutual knowledge**: If the parties did not know each other's reasoning, then they might not anticipate the defection and the deal might go through. But in this case, because they have worked together and know each other to be transparent maximizers, they cannot commit.

  **The role of incommensurability**: The moral cost is not on the same scale as the benefit. But in the AC agent, they are compared. However, the problem is structural: the sequential structure creates a prisoner's dilemma. But if the values were commensurable and could be reduced to a single scale, then the AC agent might still have the commitment problem. However, if they were commensurable, the agents might be able to design a binding contract or use side payments. But in this case, the moral cost is intrinsic to the act and cannot be compensated by side payments (because it's a matter of principle). So incommensurability reinforces the problem but is not the core. The core is the sequential structure and the lack of commitment.

  **Testing without transparency**: If the parties did not know each other's decision procedures, then an AC agent might be able to mimic a deontologist and thereby gain the other's trust. But in this case, because of mutual knowledge, they cannot.

  **Testing without incommensurability**: Suppose we assign a common scale (say, utility). Then the compromise gives each 60. Without compromise, 0. But the sequential structure still creates a prisoner's dilemma: the dominant strategy is to defect. So even with commensurability, the problem remains. But note: if there were a common scale, then the agents might be able to use a binding mechanism (like a contract with penalties). However, in the moral case, the cost is internal (moral cost) and cannot be enforced externally. So the problem persists.

  **Strongest consequentialist objection**:

  1. **Rule-consequentialism (RC)**: RC might say that the agents should adopt a rule: "Keep your agreements." Then, in this case, they would follow the rule and the package would pass. This rule would maximize overall consequences because without such rules, beneficial agreements would fail.

     *Reply*: But in our case, we are considering act-consequentialism as a decision procedure. The problem is that if the agents are transparent about being AC agents, they cannot adopt RC as a decision procedure without being inconsistent. If they are known to follow RC, then they are not flexible in the way that causes the commitment problem. However, the specification requires that the gains are forfeited by the flexibility that consequentialism prizes. Rule-consequentialism, if followed rigidly, is not the same as act-consequentialism. Moreover, the case shows that if the agent is known to be an act-consequentialist (and thus flexible), then the gains are lost. If they are rule-consequentialists, they are not flexible in the same way. But note: the rule-consequentialist, when faced with a situation where breaking the rule would have better consequences, might break the rule. And if the other party knows this, then the commitment problem resurfaces. So the rule-consequentialist must be a rigid rule-follower to avoid the problem, but that is not what rule-consequentialism typically recommends (it recommends following the rule unless there is a clear and exceptional reason to break it). So the problem remains: the other party might not trust that the rule-consequentialist will follow the rule in this particular case if breaking it would yield a better outcome.

  2. **Indirect consequentialism (cultivating dispositions)**: The consequentialist might cultivate a disposition to keep agreements, so that in the moment they are not maximizing but following the disposition. This would solve the commitment problem.

     *Reply*: However, the case must close this escape route. The key is transparency and mutual knowledge. If the other party knows that the consequentialist has cultivated this disposition, then they trust. But if they know that the disposition was cultivated for consequentialist reasons, then they might suspect that in a situation where the costs of keeping the agreement are very high (or the benefits of breaking it are very high), the agent might break it. In our case, the moral cost to A in step 2 is 20, and the benefit of breaking is 20 (80 vs 60). Is this high enough to trigger a break? It depends on the threshold. But if the parties know that the consequentialist has a disposition that is only stable as long as it doesn't cost too much, then they might not trust it when the cost is non-trivial (as it is here). Moreover, in a repeated game, the consequentialist might break the agreement if they think they can get away with it without damaging future cooperation. But in this case, because the board will continue to interact, breaking the agreement would damage trust. However, the AC agent might reason: "If I break this agreement, I lose trust and future gains. But in this case, the immediate gain (20) might outweigh the future loss." The calculation is complex. But if the future loss is uncertain, the AC agent might break. And the other party, knowing this, might not trust.

     The case can be strengthened by making the future interactions less frequent or by making the current gain large enough. However, the specification says the parties will face each other again. But we can adjust the case so that the moral cost of breaking the agreement is high enough that the AC agent would not break it for fear of future losses. Then the package would go through. But note: the specification requires that the concession is a moral cost that the agent registers. The fear of future losses is a consequence, but the moral cost is not. So the AC agent might still break the agreement if the immediate gain (avoiding the moral cost) plus the immediate benefit (80 vs 60) is high and the future loss is discounted. To prevent this, we must assume that the future loss is not large enough to deter breaking. Alternatively, we can make the moral cost of breaking one's word an additional cost. But then we are introducing a deontological element.

     To close the indirect escape, we must stipulate that the agents are known to be pure act-consequentialists without any such disposition. The case must be set up so that they have not cultivated any dispositions. Moreover, the mutual knowledge includes knowing that they have not cultivated such dispositions. This is an ordinary social fact: they have a history of being flexible and not bound by rules. Thus, the consequentialist cannot rely on the indirect strategy because the disposition is not present and cannot be cultivated on the spot.

  **Conclusion on objections**: The case survives if we assume that the agents are known to be pure act-consequentialists and have not cultivated a disposition to keep agreements. In that case, the commitment problem is genuine. Rule-consequentialism and indirect consequentialism require a change in the decision procedure that is not available to the transparent act-consequentialist.

  **Final Case Description**:

  In a municipal school board, two long-standing members, A and B, face a budget allocation decision. A is deeply committed to arts education, seeing it as essential for human flourishing; B is equally committed to science education, viewing it as critical for societal progress. The board must vote sequentially: first on A's Arts Outreach Program (AOP) and then on B's Science Lab Equipment (SLE). The budget allows both only if each is funded at 80% of the requested amount. The compromise: B will vote for AOP (even though B believes this diverts resources from science) if A will vote for SLE. A voting for SLE means complicity in underfunding the arts (a moral cost for A); B voting for AOP means complicity in underfunding science (a moral cost for B). Without the compromise, both projects fail.

  The deontologist, who values keeping promises as a core commitment, will vote as agreed even when it requires complicity and even after having received the benefit (because the agreement is binding). The act-consequentialist, however, at the moment of the second vote (A voting on SLE after AOP has passed), will defect: A has already gotten AOP and voting for SLE would incur a moral cost without sufficient offsetting benefit. Knowing this, B, in the first vote, will not vote for AOP. Thus, the compromise fails.

  The failure is structural: the gains require a commitment that the flexible maximizer cannot make credible. The case does not merely show that consequentialism must be self-effacing; it shows that in a transparent setting with mutual knowledge of maximization, the gains from trade are unattainable.

  **One-Paragraph Version for the Paper**:

  Consider a municipal school board with two long-standing members: A, who holds that arts education is essential for human flourishing, and B, who holds that science education is critical for societal progress. The board must vote sequentially: first on A's Arts Outreach Program (AOP), then on B's Science Lab Equipment (SLE). The budget allows both only at 80% funding. The compromise requires B to vote for AOP (which B sees as complicity in underfunding science) and A to vote for SLE (which A sees as complicity in underfunding arts). If both vote as agreed, each gets 80% of their project minus a moral cost, yielding a net gain over no project. However, after AOP passes, A, as an act-consequentialist, would defect in the vote on SLE to avoid the moral cost, knowing she already has AOP. Anticipating this, B, also an act-consequentialist, will not vote for AOP, causing the compromise to fail. By contrast, deontologists, who view promise-keeping as an identity-conferring commitment, will vote as agreed despite the moral cost, securing the gains. These gains are thus available only to agents who are not transparent maximizers at the point of action.
