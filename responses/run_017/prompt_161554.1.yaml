answer: |-
  ### Joint Statement on Interpersonal Utility Comparisons for Budget Allocation

  #### (1) Agreed Claims:
  1. The committee must allocate a fixed budget between two patient groups, requiring trade-offs that depend on comparing gains/losses across individuals.  
  2. Individual utility is ordinally measurable: each person can rank their own well-being states.  
  3. Interpersonal utility comparisons (IUC) are necessary for equitable allocation but entail unresolved philosophical and practical challenges.  
  4. The "round-trip protocol" (defined below) is a valid test case for IUC consistency:  
     - **Protocol**: Person A ranks A-vs-B well-being; B ranks B-vs-A; third parties (e.g., C) are introduced to check transitivity (A→B→C→A should equal A→C).  
     - **Pilot result**: Residual asymmetry (≈33%) persists despite calibration/shared experience and scales with affective range differences.  
  5. Affective range (variability in emotional intensity) systematically influences IUC outcomes.  
  6. Both views accept that empirical tests (like the protocol) can clarify disagreements, regardless of underlying metaphysics.  

  ---

  #### (2) Cruxes and Test Predictions:  
  | Crux | Accepted Test/Case | Sceptic’s Prediction | Constructivist’s Prediction | Whose View the Result Moves (and Why) |
  |------|--------------------|----------------------|------------------------------|---------------------------------------|
  | **Whether IUC consistency is achievable** | Expanded round-trip protocol:<br>- Iterative calibration & shared experience<br>- Large sample across affective ranges | Asymmetry persists ≥20% (never near 0%). Shared experience reduces noise but not systematic gaps. | Asymmetry falls to ≤5% with ideal calibration/experience. Shared experience enables "symmetry convergence." | **Moves both**: Persistence favors sceptic (shows IUC irreducibly normative); near-zero favors constructivist (shows measurable fact). |
  | **Whether affective range gaps are surmountable** | Vary affective range differences in protocol:<br>- Measure asymmetry pre/post intensive shared experience | Asymmetry remains strongly correlated (*r* ≥ 0.7) with affective range differences post-intervention. | Correlation weakens (*r* ≤ 0.3); asymmetry reduces most for extreme-range pairs. | **Moves constructivist**: Persistent correlation undermines "approximatability" claim; reduction supports protocol efficacy. |
  | **Whether residual asymmetry reflects measurement error** | Introduce synthetic "noise" in control trials vs. real IUC trials | Noise-driven asymmetry randomizes; real asymmetry shows stable, structured residuals (e.g., tied to personality traits). | Real asymmetry patterns match measurement-error models (e.g., high noise in low-familiarity pairs). | **Moves sceptic**: Structured residuals support agent-relativity; noise-like patterns favor constructivist. |

  ---

