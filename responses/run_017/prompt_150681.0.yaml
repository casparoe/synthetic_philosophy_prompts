  hey — I'm in a cross-listed phil/public policy seminar on the ethics of the far future, and our TA (Rob, he's a 4th year) runs these weekly "you can fund exactly one of these two things" pairs and then posts his own answers on friday. I've been trying to work out what rule he's actually running and I cant, and there's a case coming up that I think splits the options, so I want a second opinion.

