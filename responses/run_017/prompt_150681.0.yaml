answer: |-
  **Call:** Fund the 100 now. Medium confidence (around 60-70%), as Rob's past behavior suggests a strong aversion to very long time horizons despite low risk, but the high certainty here creates tension with his "year isn't a reason" comment.

  **Reasoning:**  
  Rob's rule appears to be **expected value maximization with time-and-risk-adjusted discounting**, where the discount factor combines:  
  - **Risk of non-delivery:** Directly reduces expected lives saved (e.g., 30% fizzle → multiplier of 0.7).  
  - **Pure time discounting:** A small but non-zero annual rate (≈0.05% based on case 1), reflecting impatience or "special about people you can look in the eye" – likely a psychological/proximity bias favoring the present.  
  - **Threshold effects:** Gains must be large to offset long delays (e.g., 400 lives in 150 years with 30% fizzle passed; 300 in 400 years with 70% fizzle failed).  

  **Fitting past verdicts:**  
  - Case 1 (100 now vs. 100 in 25y, 8% fizzle): Expected future = 100 × 0.92 = 92. Discounted (0.05%/yr) ≈91.8 < 100, so "now, only just"; switches at 110 future (110 × 0.92 × discount ≈100).  
  - Case 2 (100 now vs. 125 in 70y, 25% fizzle): Expected = 125 × 0.75 = 93.75. Discounted ≈89.9 < 100, so "now".  
  - Case 3 (100 now vs. 400 in 150y, 30% fizzle): Expected = 400 × 0.7 = 280. Discounted ≈260 > 100, so "later, not close".  
  - Case 4 (100 now vs. 300 in 400y, 70% fizzle): Expected = 300 × 0.3 = 90. Discounted ≈74.3 < 100, so "now".  
  - Health case: Personal/impatient preference vs. institutional indifference suggests Rob separates self-interest (time discounting) from policy (no pure time discount if certain and no identity changes).  
  - New lives case: Prioritizing existing lives over creating new ones fits person-affecting views; "who exists" is distinct from timing.  

  **New case analysis (100 now vs. 130 in 500y, 99% delivery):**  
  - Expected future lives = 130 × 0.99 ≈ 128.7.  
  - With pure time discounting (0.05%/yr), discount factor over 500y ≈ e^(-0.0005×500) ≈ 0.778. Discounted expected lives ≈ 128.7 × 0.778 ≈ 100.1, barely above 100.  
  - However, Rob's aversion to distant horizons (e.g., rejecting 400y in case 4, "look in the eye" comment) likely dominates here. 500y exceeds any past delay he accepted (max 150y in case 3), and the gain (28.7 net lives) is smaller than in case 3 (180 net). He would deem this insufficient to offset the extreme distance, choosing "now" as in case 4.  

  **Where rules split on this case:**  
  - **Rule A (expected lives with pure time discount ≈0.05%)**: Favors 130 in 500y (100.1 > 100), barely.  
  - **Rule B (no pure time discount, only risk adjustment)**: Strongly favors 130 in 500y (128.7 > 100).  
  - **Rule C (time discount with proximity bias/thresholds)**: Favors 100 now, as 500y triggers a "too distant" heuristic beyond risk adjustment.  
  Rob's past choices (esp. case 4 rejection and health-case inconsistency) better fit Rule C, but this case highlights the ambiguity in his "year isn't a reason" claim.  

  **Test case to settle the rule:**  
  Propose: **100 lives saved now vs. 200 lives saved in 500 years, 99% delivery, all other stipulations identical.**  
  - If Rob funds the 200, he likely uses Rule A or B (discounted expected value ≥100).  
  - If he funds the 100, he confirms Rule C (strong proximity bias/threshold for distant futures).  
  This sharpens the conflict: 200 vs. 130 tests how much gain he requires to offset 500y, isolating time discounting from risk.
