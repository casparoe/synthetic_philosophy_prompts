prompt: |-
  I work on the research staff of a philanthropic foundation that spends roughly $25M a year on global health and poverty programs, and my job is to write the evidence memo that precedes each quarterly allocation decision. Eight to ten times a year the same question arrives in a different shape: should we decide now on what we already believe, or buy more information first — commission a pilot, pay for a longer-run follow-up, fund a replication in a new country, or delay a scale-up by a year so that a measurement can land before we commit? The decisions themselves range from $300k to about $10M; the studies we might commission range from $80k to $1.5M. The final call is made by a five-person investment committee voting by majority, three of whose members are not comfortable with anything more technical than a percentage. I get half a day with one analyst to produce the memo, and the memo has to survive being read out loud in the meeting.

  I have read the standard expositions of Good's theorem. My understanding is that for an agent who maximises expected utility and updates by Bayes, the expected value of information that arrives before the decision and is free to act on is never negative, and that it is strictly positive only where the information could actually change what the agent does. If I have misstated it, correct me before building on it, because everything below rests on it.

  What I do not have is a procedure. The formula is not my problem; my problem is that our decision environment violates the theorem's assumptions in at least five ways I can name, and I cannot tell which of those violations should reshape the procedure and which are noise. Specifically: the decider is a committee with heterogeneous priors voting by majority, and the committee that reads a study is frequently not the one that commissioned it; we almost never manage to pre-commit in writing to the decision rule that will be applied to the result; our findings are usually published, other funders read them, and our money is perhaps 4% of the relevant pool, so a result can help or hurt us through what it makes other people do; the committee does not maximise expected value but applies thresholds — it will not fund anything with more than roughly a 10% posterior probability of net harm, and it prefers a crisp ranking to a maximised one, which means variance-increasing information can be actively bad for us even when it is free; and the thing a study measures is only a noisy proxy for the thing we care about, because of external validity, implementation drift, and spillovers, so informativeness rather than sample size is usually what drives the answer. There is also the fact that delay has identifiable costs falling on identifiable people who would otherwise have been served, and how much to discount those people is a values question I do not want smuggled in as a parameter.

  What I want from you is a written procedure my team can actually run, not a tutorial. It should be an ordered set of questions with a stated sufficient answer to each; it should say at which steps we can stop early and with what verdict; it should say where the procedure returns don't buy the information — because no result could change the action, because the prior already settles it, because the result cannot arrive inside the decision window, or because we cannot commit to acting on it; and it should mark clearly, as such, the places where judgment genuinely cannot be eliminated and the question must be handed to a person, naming which person: the analyst, me, or the board. I need it to work when we have no credible numbers, which is most of the time, so it should say what to do with rough elicitations and one-sided bounds rather than silently substituting a guess for a distribution. It also has to be presentable to a non-technical trustee in a paragraph, and I want it to be hard for a staff member who already wants the study to game.

  Please apply it in full to three cases, using the numbers I give.

  One. A $6M scale-up over three years into a region where we have not operated. Our prior on the effect, expressed in units of our cost-effectiveness bar where 1.0 is our marginal dollar elsewhere, is roughly lognormal with median 1.5 and an 80% interval of 0.7 to 3.2. A pilot would cost $250k and take 14 months, and would give an approximately unbiased estimate of the local effect with a standard error near 0.45 in bar units, but we think its correlation with the eventual scale-up effect is only about 0.6.

  Two. A $400k follow-up measurement of long-run outcomes on a program we have funded for five years. The renewal vote is in 6 months and the results would arrive in 20; the program is one of two candidates to anchor a $12M country strategy that we will set in 18 months. The measurement is therefore late for the decision it was proposed for and early for a larger one, and in the interim the result would be published and read by other funders.

  Three. Our flagship program: $10M over three years, about 40% of the portfolio, four staff attached to it, and a proposed $1.2M three-year rigorous evaluation. The board has never exited a program of that size, and a null result would in practice be read as a mandate to implement better. I expect the honest verdict here to be one I would rather not hear. Give it anyway, flag it as the unwelcome one, and defend it.

  Finally, tell me what the procedure cannot do. I assume it cannot rescue a bad prior, cannot assign value to hypotheses we have not enumerated, cannot settle whether we are buying a decision input or producing a public good for the field, and will manufacture false precision if I let it. Tell me which of those are fatal and which I can live with, and what else belongs on the list.
reasoning: |-
  Hmm, this is an exceptionally detailed and nuanced query from someone working in philanthropic decision-making. The user operates in a complex environment where standard EVOI models break down due to committee dynamics, threshold-based decisions, publication externalities, and implementation challenges. They're asking for a practical decision procedure that acknowledges these real-world constraints while still providing rigor.

  The core tension here is between theoretical purity (Good's theorem) and operational reality. The user clearly understands Bayesian decision theory but needs something that works within their specific constraints: limited time (<0.5 days/analysis), non-technical committee members, inability to pre-commit, and political realities around flagship programs. What makes this particularly challenging are the non-standard factors like:
  - Information having negative value when it increases variance
  - Other funders free-riding on their research
  - The ethical cost of delay being tangible

  For the procedural design, I need to create something that:
  1) Handles qualitative inputs without false precision
  2) Explicitly marks where judgment calls are required
  3) Builds in anti-gaming safeguards
  4) Provides clear stopping rules
  5) Accommodates their threshold-based utility function

  The three test cases are well-chosen to stress-test the framework:
  - Case 1 tests proxy validity and time delay tradeoffs
  - Case 2 challenges the time window constraints and publication externalities
  - Case 3 confronts the political reality of "too big to fail" programs

  Key innovations in the response should include:
  - A "decision robustness" assessment replacing traditional EVOI
  - Explicit treatment of information decay and committee turnover
  - A "do no harm" threshold as first filter
  - Qualitative confidence ratings instead of point estimates
  - Clear ownership assignments at each decision point

  The most ethically difficult aspect is quantifying the human cost of delay - this needs to be handled as a separate moral parameter rather than baked into the math. For Case 3 specifically, I'll need to be blunt about the sunk cost fallacy while acknowledging implementation realities.
answer: |-
  Here’s a practical **VOI (Value of Information) Assessment Procedure** tailored to your constraints, designed for speed, robustness to gaming, and clarity for non-technical trustees. It prioritizes *actionability* over theoretical purity, with explicit stopping rules and judgment flags. The core question: **"Could this information change a material decision *in time*, and is the cost of delay justified?"**

  ---

  ### **VOI Assessment Procedure: 7 Steps**  
  *(Execute in order; stop if any step returns "NO")*

  1. **"Can we *act* on the information?"**  
     - **Check:** Is there a formal agreement (email/minutes) on (a) the decision the information informs, (b) the threshold/rule for action (e.g., "fund if P(harm) < 10%"), and (c) the committee that will *make* that decision?  
     - **NO if:** No pre-commitment, committee changes before results arrive, or results miss the decision window.  
     *→ Verdict: **DON'T BUY.** Judgment: Board (if policy change needed).*

  2. **"Would *any* result change the decision?"**  
     - **Check:** Using rough priors, identify the "decision threshold" (e.g., CE > 1.0, P(harm) < 10%). Simulate two extreme outcomes:  
       - *Best plausible result*: 95th percentile optimistic outcome.  
       - *Worst plausible result*: 95th percentile pessimistic outcome.  
       Would either flip the decision vs. status quo?  
     - **NO if:** Both extremes lead to the same decision (e.g., both CE > 1.0).  
     *→ Verdict: **DON'T BUY.** Judgment: Analyst (with your sign-off).*

  3. **"Is the information *relevant*?"**  
     - **Check:** Is the correlation between the study’s measure and true impact ≥0.4? Assess:  
       - External validity: "Would we expect directionally similar results in the scaled context?" (High/Med/Low)  
       - Implementation risk: "Could real-world drift swamp the signal?" (Yes/No)  
     - **NO if:** Low external validity OR high implementation risk.  
     *→ Verdict: **DON'T BUY.** Judgment: You (requires context expertise).*

  4. **"Does the information *reduce risk*?"**  
     - **Check:** Could the study lower the probability of a harmful decision? Focus on:  
       - Downside protection: "Would a bad result push P(harm) above 10%?"  
       - Variance reduction: "Would the study narrow the 80% CI by >30%?"  
     - **NO if:** Study increases variance OR moves P(harm) closer to 10% without crossing it.  
     *→ Verdict: **DON'T BUY.** Judgment: Analyst (quantitative assessment).*

  5. **"Do we *control the downside* of publication?"**  
     - **Check:** If results are public:  
       - Could competitors free-ride? ("Would this likely *increase* funding to this intervention?")  
       - Could it mislead others? ("Is our measure a poor proxy for others’ decisions?")  
     - **NO if:** High risk of attracting harmful funding or triggering a harmful pullout by others.  
     *→ Verdict: **DON'T BUY** or **DELAY/PRIVATIZE**. Judgment: You (strategic context).*

  6. **"Is the cost of delay justified?"**  
     - **Check:** For a delay of *D* months:  
       - Estimate lives/impacts lost by not acting now (e.g., "6M lives missed if delayed").  
       - Compare: Study cost + delay cost vs. max avoidable loss.  
       - *Rule:* If delay cost > 20% of program cost, default to **DON’T DELAY**.  
     - **NO if:** Delay cost > potential upside (use 90% CI of benefits).  
     *→ Verdict: **ACT NOW** (skip study). Judgment: Board (values-based).*

  7. **"Can we afford the option?"**  
     - **Check:** Is study cost < 5% of the decision’s stake? If yes, **BUY**. If 5-15%, use Step 6. If >15%, **DON’T BUY**.  
     *→ Judgment: Analyst (calculation).*

  ---

  ### **Key Safeguards Against Gaming**  
  - **Step 1 (Pre-commitment)** forces staff to formalize decision rules upfront.  
  - **Step 3 (Relevance)** and **Step 4 (Risk)** use qualitative thresholds (Low/Med/High) to avoid false precision.  
  - **Step 6 (Delay Cost)** anchors on tangible impacts, not utility parameters.  
  - **Step 7 (Cost Cap)** limits spending on information to a fraction of stakes.  

  ---

  ### **Application to Your Cases**  
  **Case 1: $6M Scale-Up Pilot ($250k study)**  
  1. **Act?** *Assume pre-commitment: "Scale if pilot CE > 1.0".* → YES  
  2. **Change decision?**  
     - Prior: 80% CI [0.7, 3.2]. Threshold: CE > 1.0.  
     - Worst plausible: 0.7 - 2*SE ≈ 0.7 - 0.9 = **-0.2** (would not scale)  
     - Best plausible: 3.2 + 0.9 = **4.1** (would scale). → **YES** (could change)  
  3. **Relevant?** Correlation 0.6 → Med. External validity? Likely High (same region). → YES  
  4. **Reduce risk?**  
     - Current P(harm) = P(CE<0) ≈ 5% (lognormal tail).  
     - Pilot SE=0.45 → Could increase P(harm) estimate if noisy. → **NO** (risk increases)  
     *→ STOP at Step 4: **DON’T BUY.***  

  **Case 2: $400k Follow-up ($400k study; late for $400k, early for $12M)**  
  1. **Act?** *No pre-commitment for $12M decision.* → **NO**  
     *→ STOP at Step 1: **DON’T BUY.***  
     *Why? No agreed rule for how the study informs the $12M strategy. High risk of wasted info.*  

  **Case 3: $10M Flagship Evaluation ($1.2M study)**  
  1. **Act?** *Pre-commitment? Unlikely (board avoids exits).* → **NO**  
     *→ STOP at Step 1: **DON’T BUY.***  
     *Unwelcome verdict: The study fails because the board won’t commit to acting on a negative result. Buying it risks $1.2M for a "learning exercise" that won’t change funding.*  
     *Defense: If you can’t pre-commit to exit, the study’s only value is implementation tweaks. A $1.2M process evaluation would be cheaper and faster.*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Rescue bad priors:** If your prior is garbage (e.g., 80% CI [0.1, 10]), Step 2 will still say "YES" (info could change decision).  
     - *Mitigation:* Step 3 (relevance) and Step 4 (risk) act as sanity checks.  
  2. **Value non-enumerated hypotheses:** It only tests pre-specified decisions.  
     - *Live with it:* Your committee needs crisp thresholds.  
  3. **Distinguish "decision input" vs. "public good":** Step 5 addresses externalities but prioritizes your foundation’s interests.  
     - *Fatal?* No, but if "public good" is the goal, skip to Step 7 (cost cap).  
  4. **Handle interdependent decisions:** Assumes one decision per study.  
     - *Fatal?* Yes—split complex cases into separate assessments.  
  5. **Quantify political costs:** E.g., "board discomfort" isn’t modeled.  
     - *Mitigation:* Step 1 forces explicit pre-commitment, surfacing this early.  

  **Critical Omission:** It doesn’t model *strategic delay* (e.g., waiting for others’ studies). If this is common, add a substep to Step 5: "Could we free-ride on others’ data within 6 months?"  

  ---

  ### **Trustee Summary (1 Paragraph)**  
  > "When considering studies, we assess: (1) Can we formally agree *now* how we’d use the results? (2) Could any outcome actually change our decision? (3) Is the study relevant to real-world impact? (4) Does it reduce downside risk? (5) Do we lose more by waiting than we gain? (6) Is the cost proportionate? If any answer is ‘no,’ we don’t proceed. This ensures we only buy actionable information and avoid costly delays."

  This procedure prioritizes your committee’s threshold-driven, variance-averse preferences while surfacing key judgment calls. It works because it starts with *decision architecture* (Steps 1-2), not math.
