answer: |-
  ### NOTICE TO CONTRIBUTORS  
  *Journal of Conjectural Biology*  
  **Version 4.3, effective January 1, 2024**  

  #### 1. **Philosophical Orientation**  
  1.1 The *Journal of Conjectural Biology* (JCB) operates under a strict falsificationist framework. Scientific theories must be empirically testable and potentially refutable. Metaphysical research programmes, while valuable for organizing inquiry, are distinct from testable science.  
  1.2 JCB follows Karl Popper’s 1957–1963 demarcation criteria. His later concessions regarding natural selection (1974–1983) are rejected per §8.1.  

  #### 2. **Mandatory Definitions**  
  2.1 **Fitness**: Any use of "fitness" in evolutionary hypotheses must be operationally defined without reference to actual survival or reproductive success. Acceptable definitions include quantifiable proxies (e.g., metabolic efficiency, locomotor performance under standardized conditions).  
  *Example*: "Fitness" may be defined as "thoracic thrust-to-mass ratio in *Drosophila melanogaster* under 25°C hypoxia," but not as "differential reproductive output."  
  2.2 Non-compliant definitions render submissions ineligible for Type-T review (§3.1).  

  #### 3. **Testability Requirements**  
  3.1 **Prohibition Statement**:  
  3.1.1 All Type-T submissions (§4) must include a "Prohibition Statement" nominating one observation that, if empirically verified, would refute the hypothesis.  
  3.1.2 The nominated observation must not have been documented in existing literature. Retroactive nomination (e.g., aligning with prior data) voids testability.  
  3.1.3 *Example*: A hypothesis stating "UV-B resistance increases fitness in alpine plants" must nominate a refuter such as "observation of *Ranunculus glacialis* populations with >90% UV-B resistance declining in frequency when transplanted to low-UV habitats."  

  3.2 **Boldness Statement**:  
  3.2.1 Type-T submissions must compute a Content–Risk Index (CRI) score, quantifying the hypothesis’s antecedent improbability. Use the formula:  
  $$\text{CRI} = \frac{\text{Number of independent, falsifiable assumptions}}{\text{Background knowledge entropy}}$$  
  3.2.2 The Editorial Board provides a CRI calculator [here]. Scores <0.3 incur desk rejection.  

  #### 4. **Submission Tracks**  
  4.1 **Type-T (Testable)**:  
  4.1.1 Presents falsifiable hypotheses with Prohibition Statements (§3.1), CRI scores (§3.2), and empirical datasets.  
  4.1.2 Results must report "degree of corroboration" (§7.1), not likelihoods.  

  4.2 **Type-M (Metaphysical Research Programme)**:  
  4.2.1 For non-testable frameworks organizing empirical research (e.g., "adaptationism as a heuristic").  
  4.2.2 Type-M submissions:  
  - Are published in a separate journal section.  
  - May not claim empirical "support," "confirmation," or "evidence."  
  - Must include this boilerplate: *"This proposition is not empirically testable and belongs to a metaphysical research programme. It is evaluated solely on logical coherence and capacity to stimulate critical discussion."*  
  4.2.3 Type-M status must be declared at submission.  

  #### 5. **Conventionalist Stratagems**  
  5.1 Auxiliary hypotheses (e.g., environmental covariates) must be preregistered before data collection.  
  5.2 Post-hoc auxiliary hypotheses (e.g., "unmeasured predation pressure explains null results") are immunizing stratagems. Submissions relying on them are rejected.  
  5.3 *Appeal Grounds*: Authors may petition to reclassify such hypotheses as Type-M.  

  #### 6. **Historical Hypotheses**  
  6.1 Singular narratives (e.g., "the peacock’s tail evolved via female choice in the Pleistocene") are untestable and ineligible for Type-T.  
  6.2 Recraft as **situational analyses**:  
  - State the organism’s *problem situation* (e.g., "mate attraction under high predation").  
  - Derive the trait as a *rational solution* (e.g., "conspicuous ornamentation maximizes signal efficiency").  
  6.3 Testable predictions (§3.1) must arise from the analysis.  

  #### 7. **Vocabulary and Reporting**  
  7.1 Banned terms: "support," "confirm," "evidence for," "probability," "Bayesian," "likelihood."  
  7.2 Required terms: "corroboration" (never "confirmation"), "degree of corroboration" (replaces "posterior probability").  
  7.3 *Example*: Replace "Data support the hypothesis (BF=10)" with "The hypothesis is corroborated (CRI-adjusted *d*<sub>corr</sub>=0.72)."  

  #### 8. **Editorial Note on Popperian Adherence**  
  8.1 JCB upholds Popper’s earlier view (1957–1963) that natural selection is metaphysical absent independent fitness definitions (§2.1) and refuters (§3.1). His later recantation (1974–1983) is rejected as less falsifiable: it cannot specify what observation would falsify the claim "natural selection is testable."  

  #### 9. **Appeals Process**  
  9.1 Rejected authors may appeal within 30 days via Form JCB-11.  

  > **Author’s Appeal** (Submitted by Prof. Elaine Ritter, Darwin College):  
  > "My paper on coevolution in *Atta cephalotes* leafcutter ants was rejected for lacking a preregistered auxiliary hypothesis about fungal symbiont pH tolerance. This is unreasonable! Field conditions are unpredictable; requiring all variables to be declared upfront makes ecology impossible. My post-hoc adjustment accounted for rainfall anomalies—a minor immunization, but the core hypothesis remains sound. Under these rules, Darwin himself would have been rejected. I demand reevaluation under Type-M criteria."  
  >  
  > **[Editor’s Response]**:  
  > Appeal denied. The fungal symbiont hypothesis (§5.2) was invoked after null results in nutrient-uptake assays, constituting an immunizing stratagem. Rephrasing as a situational analysis (§6.2) (e.g., "fungal pH optimization as a rational solution to soil alkalinity") does not salvage testability without a preregistered refuter (§3.1.1). Type-M reclassification is moot, as the original submission claimed evidentiary support. Resubmission permitted only with compliant Prohibition Statement.  

  ---

  #### 10. **Worked Example: Non-Compliant vs. Compliant Abstract**  
  **Taxon**: *Luminocauda luminosa* (fictitious deep-sea anglerfish)  
  **Trait**: Bioluminescent lure  

  **Non-Compliant Abstract**:  
  > "We confirm that *Luminocauda*’s bioluminescent lure evolved via sexual selection. Fitness was defined as mating success. Bayesian analyses support that longer lures attract more mates (BF=15.7). We reject predation as a factor; no predators were observed."  

  **Defects**:  
  - "Fitness" tautologically defined (§2.1).  
  - "Confirm," "support," "Bayesian" banned (§7.1–7.2).  
  - No Prohibition Statement (§3.1).  
  - Predation rejection is an *ad hoc* immunizing move (§5.2).  

  **Compliant Abstract (Type-T)**:  
  > "Situational analysis: *Luminocauda luminosa* faces low mate density and high foraging costs. A bioluminescent lure is posited as the rational solution to minimize energy expenditure while maximizing detection. Fitness is defined as lure efficiency (photons emitted/ATP consumed). Prohibition Statement: Observation of a *Luminocauda* population with lure efficiency >2,500 photons/μmol ATP experiencing <10% mating success under natural conditions would refute the hypothesis. CRI=0.41. Field data corroborate the hypothesis (*d*<sub>corr</sub>=0.58)."  

  ---  
  *Submit manuscripts via the JCB portal. Queries: editorial@jconbio.org*  
  **Word count**: 842
