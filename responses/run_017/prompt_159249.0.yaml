  Below is a decision tree designed to map commitments to privacy theories based on intuitive responses to four cases, without using theoretical jargon. The tree has seven branch nodes (questions) and six leaf nodes (theories), including an unnamed combination. Each branch question is derived from the cases and isolates core disagreements in the privacy literature.

  ---

  ### **Decision Tree: Which Theory of Privacy Are You Actually Committed To?**

  **Instructions:**  
  Answer each question based on your immediate judgment of the case described. Choose "Yes" or "No" without overthinking theoretical implications. Your path ends at a named theory (or an unnamed view).

  ---

  1. **Houseguest Diary Case:**  
     A houseguest secretly photographs the banal pages of your diary while you sleep, deletes the images immediately, and never mentions it. You never find out.  
     *Is this a privacy violation?*  
     - **Yes** → Go to Q2  
     - **No** → Go to Q5  

  2. **Break-room Camera Case:**  
     Your employer installs a camera in the office break-room. It records to a 60-second buffer that constantly overwrites and is never viewed by anyone. Employees know about it, and it stops gossip.  
     *Is the camera a privacy violation?*  
     - **Yes** → Go to Q3  
     - **No** → Go to Q4  

  3. **Pharmacy Data Case:**  
     A pharmacy’s fully anonymized sales data (never read by humans) is analyzed to infer that residents of one building have an unusually high rate of a stigmatized prescription. No individuals are identified.  
     *Does this inference violate privacy?*  
     - **Yes** → Go to Q6  
     - **No** → Go to Q7  

  4. **Hard Drive Case:**  
     You buy a second-hand hard drive in good faith. It contains a stranger’s medical scans and letters, which you open. The original owner is unaware.  
     *Is opening these files a privacy violation?*  
     - **Yes** → **Control Account** (e.g., Westin)  
     - **No** → **Access-Based Account** (e.g., Gavison)  

  5. **Pharmacy Data Case (repeated for branching):**  
     *Does the pharmacy inference (anonymized, group-level) violate privacy?*  
     - **Yes** → Go to Q7  
     - **No** → **Reductionist Account** (e.g., Thomson)  

  6. **Hard Drive Case (repeated for branching):**  
     *Is opening the medical files a privacy violation?*  
     - **Yes** → **Contextual Integrity Account** (e.g., Nissenbaum)  
     - **No** → **Access-Based Account** (e.g., Gavison)  

  7. **Group Privacy Question:**  
     Can a *group* (e.g., residents of a building) experience a privacy violation even if no individual is identified or harmed?  
     - **Yes** → **Unnamed View** (Group-Consequentialist)  
     - **No** → **Reductionist Account** (e.g., Thomson)  

  ---

  ### **Leaf Nodes (Theories) & Key Commitments:**  
  1. **Control Account**: Privacy is control over personal information.  
     - Path: Q1(No) → Q5(No)  
     - Case judgments: Diary (no), Pharmacy (no), Camera (no), Hard drive (varies).  

  2. **Access-Based Account**: Privacy is limited access to the self/information.  
     - Paths:  
       - Q1(Yes) → Q2(Yes) → Q3(No) → Q4(No)  
       - Q1(Yes) → Q2(Yes) → Q3(Yes) → Q6(No)  
     - Case judgments: Diary (yes), Camera (yes), Pharmacy (no), Hard drive (no).  

  3. **Reductionist Account**: Privacy reduces to property, bodily, or security interests.  
     - Paths:  
       - Q1(No) → Q5(No)  
       - Q1(No) → Q5(Yes) → Q7(No)  
     - Case judgments: Diary (no), Pharmacy (no or only if harm), Camera (no), Hard drive (no).  

  4. **Contextual Integrity Account**: Privacy is appropriate information flow according to contextual norms.  
     - Path: Q1(Yes) → Q2(Yes) → Q3(Yes) → Q6(Yes)  
     - Case judgments: Diary (yes), Camera (yes), Pharmacy (yes), Hard drive (yes).  

  5. **Unnamed View (Group-Consequentialist)**: Privacy violations apply to groups and require demonstrable harm.  
     - Path: Q1(No) → Q5(Yes) → Q7(Yes)  
     - Case judgments: Diary (no), Pharmacy (yes, if group harm), Camera (no), Hard drive (varies).  

  ---

  ### **Notes on the Tree**  
  1. **Confidence in Leaf Placement**:  
     - **High Confidence**:  
       - *Reductionist* (clear harm/property focus).  
       - *Contextual Integrity* (norms-based; all cases align).  
     - **Moderate Confidence**:  
       - *Control* and *Access-Based* (Q4 and Q6 distinctions are subtle; see "Least Confident Node" below).  
       - *Unnamed View* (logically coherent but rarely defended).  
     - **Low Confidence**: None. All leaves map to extant or logically coherent positions.  

  2. **Contested Case Judgments by Theory**:  
     - **Control Account**: May contest *Break-room Camera* (Q2): If employees "consent" by knowing, some argue no control is lost.  
     - **Access-Based Account**: May contest *Pharmacy Data* (Q3): If anonymized data isn’t "access to a person," no violation.  
     - **Reductionist Account**: Will contest *Diary* (Q1) and *Camera* (Q2): No tangible harm/property violation.  
     - **Contextual Integrity**: Unlikely to contest any case; norms cover all.  
     - **Unnamed View**: Will contest *Diary* (Q1) and *Camera* (Q2): No group harm.  

  3. **Least Confident Branch Node**:  
     - **Q4/Q6 (Hard Drive Case)**: Distinguishing *Control* from *Access-Based* here is tenuous.  
