       - Fix: If combined paths to *Control* and *Access-Based* are indistinguishable, collapse them into a hybrid "Control/Access" leaf. I’ve kept them separate to reflect textbook distinctions, but flag this weakness.  

  4. **Unseparated Pair**:  
