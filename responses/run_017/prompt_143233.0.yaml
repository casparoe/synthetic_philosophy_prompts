answer: |-
  ### Worked Example for Gibbard–Satterthwaite Theorem: Vulnerability to Coordinated Manipulation

  **Rule**: Coombs rule. If a candidate has a majority of first-place votes, they win. Otherwise, the candidate with the most last-place votes is eliminated. Repeat until one candidate has a majority of first-place votes. Tie-breaking: Among candidates tied for most last-place votes, eliminate the one with the highest alphabetical index (e.g., C before B before A).

  **Profile P (5 voters, 3 candidates: A, B, C)**:
  - Voter 1: A > B > C  
  - Voter 2: A > B > C  
  - Voter 3: B > C > A  
  - Voter 4: C > A > B  
  - Voter 5: C > A > B  

  **Sincere Winner**: A  
  **Key Voters**: Maya (Voter 4) and Sam (Voter 5). Both sincerely rank C > A > B.

  ---

  ### Verification of Conditions

  #### Step 1: No unilateral profitable deviation at P
  - **Voter 1 (A>B>C)**: Sincere winner A is best. No incentive to deviate.
  - **Voter 2 (A>B>C)**: Same as Voter 1.
  - **Voter 3 (B>C>A)**: Sincere winner A is worst. Possible deviations:  
    - Vote B>A>C: First-place votes: A:2, B:1, C:2 → no majority. Last-place: A:3, C:2 → eliminate A. Runoff: B vs. C → B wins (better than A).  
    - *But wait*: With deviation, last-place votes:  
      - V1: C (last), V2: C, V3: C (last changed to C?), V4: B, V5: B  
      Correction: Voter 3 votes B>A>C → last is C.  
