  **Summary Slide**:  
  - **Rule**: Coombs (eliminate most last-place votes; tie-break: highest letter)  
  - **Profile P**:  
    - 2x: A>B>C (V1, V2)  
    - 1x: B>A>C (V3)  
    - 2x: C>B>A (Maya=V4, Sam=V5)  
  - **Sincere winner**: A  
  - **No unilateral gain**: As verified.  
  - **Joint gain**: Both switch to B>C>A → B wins (better than A for Maya/Sam).  
  - **Contagion**: After Maya switches, Sam can switch to gain.  
  - **Theorem’s guarantee**: Unilateral manipulation 1 ballot away (V3 to B>A/C), but coordinated case is more immediately threatening.
