prompt: |-
  I'm a second-year PhD student in computer science and I'm TA-ing our graduate complexity course this term; I'm also writing a short "what are we actually assuming?" note for our theory seminar's reading-group blog, and I keep running into a cluster of departmental habits that I can't tell are consistent with each other. First: everyone writes and talks about P, NP, and BQP without ever saying which machine model they have in mind, and when a student asks, the answer is that any reasonable model simulates any other with at most polynomial overhead, so the classes are the same — an invariance claim, not a definition. Second: the very same people use "efficient," "feasible," and "tractable" interchangeably with "polynomial time," and they are not confused about this — they will cheerfully write down n raised to the hundredth power, or a constant like ten to the sixtieth multiplying a quadratic, count it as efficient, and defend the move as a useful surrogate for what humans can actually finish. Third: when a visiting speaker last month mentioned supertask machines that perform infinitely many steps in a finite time and other proposed ways of deciding the halting problem, the room treated it as not worth discussing, and the reply afterwards was that computable just means Turing-computable, so there is nothing to investigate. Fourth: the same department is advertising a quantum computing colloquium whose blurb says quantum machines refute the extended Church–Turing thesis — that is, they reject polynomial-overhead simulability by a classical model — and nobody there is treated as a crank for saying so. That last pair is what bothers me: the invariance claim in the first habit and the claim being rejected in the fourth look like the same claim, and yet one is taught as bedrock and the other is celebrated as overthrown. And the third habit looks like it treats the base thesis as a stipulation, while the first treats it as a hard-won convergence result about independent formalisms.

  So here is what I want: reconstruct the implicit epistemology of this practice. What must someone be assuming about the status of the Church–Turing thesis — as definition, as empirical or physical claim, as conceptual analysis, as something established by a Kreisel-style squeezing argument from informal premises about mechanical procedures, as something else — for all four habits to be reasonable? Then separate, carefully, what each habit strictly presupposes from what it merely sits well with: does the habit of dropping the model name really need the full thesis, or only a much weaker simulation result; does identifying feasible with polynomial time presuppose anything about computability at all, or is it a wholly separate claim about resources, practice, and human lifetimes that merely piggybacks on the invariance result; and does the dismissal of hypercomputation require a different reading of the thesis than the model-independence of P does? Give me a verdict on whether the package is coherent — especially whether the definition-versus-discovery switch between the third and first habits is a real tension or only an apparent one — and say where the practice is genuinely underdetermined, in the sense that several incompatible readings of the thesis would license exactly the same behavior. I'm not asking for citations, history, or a reading list; I can find those. Work from the concepts. To make it concrete, my housemate Priya, who did a philosophy minor, insists that computable functions semantically like a natural-kind term: its reference is fixed by what the actual physical world allows, so the thesis is a contingent identity rather than a definition, and the right response to a claimed hypercomputer would be to run it and check, not to consult a definition. Tell me whether the practice strictly needs that reading, what would have to change in how papers are written and refereed if we took it seriously — would complexity claims have to be indexed to a physical theory, would physics belong in the assumptions section, what would count as evidence — and what would have to change if instead we adopted the definitional reading and treated a working hypercomputer as a reason to revise a convention rather than as a discovery or an impossibility.

  Please organize the answer as: the reconstructed commitments, numbered; a strict-presupposition versus merely-convenient table or list for the four habits; the coherence verdict with the tensions named; the underdetermination section; and then, because I actually have to stand up at this seminar, the single sharpest question you think I should put to the instructor, the answer they are most likely to give, and the follow-up that makes that answer harder to rest in. One paragraph of scenario-free prose per numbered item is plenty; I want the argumentative structure, not a survey.
reasoning: |-
  Hmm, this is a fascinating query from a computer science PhD student grappling with foundational tensions in their department's practices. They've observed four seemingly contradictory habits around computational models, efficiency, and the Church-Turing thesis, and want me to reconstruct the implicit epistemology that makes these practices coherent. 

  The core tension lies between treating computational classes as model-independent (habit 1) while simultaneously celebrating quantum computing as violating classical simulation (habit 4), all while dismissing hypercomputation (habit 3) and equating polynomial time with feasibility (habit 2). Priya's natural-kind interpretation adds another layer. 

  I need to dissect several things: First, the minimal commitments that hold these practices together. The department seems to operate with a stratified view of computation where "computable" is definitional (Turing-computable) while "efficiently computable" is physical. This explains why they can simultaneously hold that hypercomputation is definitionally impossible (habit 3) while quantum efficiency violations are empirical discoveries (habit 4). 

  For the presupposition analysis: Habit 1 (model-independence of P/NP) strictly requires only poly-time simulability between standard models, not the full CT thesis. Habit 2 (efficiency=poly-time) is fundamentally separate - it's a pragmatic convention that piggybacks on model-invariance but doesn't require computability claims. Habit 3 (dismissing hypercomputation) absolutely requires CT as definition, while habit 4 (quantum violation) needs CT's efficient version to be falsifiable - hence the stratification. 

  The coherence verdict: These practices are largely consistent if we accept that "computable" and "efficiently computable" operate in different registers. The apparent definition/discovery tension dissolves when we recognize that the base CT thesis serves as a conventional boundary while its efficient version is treated as empirical. 

  Underdetermination is key here: The same practices could be licensed by either (a) Kreisel-style squeezing arguments that make CT necessary, or (b) Priya's natural-kind view where CT is contingent but confirmed. The departmental behavior doesn't distinguish between these - both would reject hypercomputation as incoherent (definitionally or empirically). 

  For the sharpest seminar question: I'd target the efficiency thesis. Asking "Why does polynomial time remain the efficiency criterion if BQP violates classical poly-time simulation?" forces acknowledgment that the poly-time convention survives empirical violations. The likely "it's still a useful heuristic" response opens the door to questioning why we don't apply similar pragmatism to hypercomputation claims. 

  The real insight is recognizing that complexity theory rests on two distinct pillars: a definitional foundation for computability, and a conventional/pragmatic one for efficiency. This dual structure allows the field to maintain stability while accommodating quantum challenges.
answer: |-
  Here is the reconstructed epistemology, strict presuppositions, coherence verdict, and seminar strategy based on the observed practices:

  ### Reconstructed Commitments
  1. **Computability is definitional**: The unmodified Church-Turing thesis (CTT) – "computable = Turing-computable" – is treated as a **stipulative definition** of computation. This licenses dismissing hypercomputation (Habit 3) as incoherent under the defined term.  
  2. **Efficiency is physical/contingent**: The *efficient* Church-Turing thesis (ECTT) – "physically realizable computation is poly-time simulable by TMs" – is an **empirical claim** about the physical world. This licenses celebrating quantum computing as refuting ECTT (Habit 4).  
  3. **Model-independence is mathematical**: Poly-time equivalence of standard models (TMs, circuits, etc.) is a **provable theorem**, requiring only deterministic simulation with polynomial overhead. This licenses omitting machine models for P/NP (Habit 1).  
  4. **Feasibility is conventional**: "Efficient = poly-time" is a **pragmatic convention** for *theory building*, decoupled from physical feasibility. It exploits model-invariance (Commitment 3) but is justified by its utility for classification, not by physical realism. This licenses Habit 2.  

  ### Strict Presuppositions vs. Merely Convenient
  | Habit | Strictly Presupposes | Merely Convenient |
  |-------|----------------------|-------------------|
  | **1. Omitting machine models** | Poly-time equivalence of standard models (Commitment 3) | Full CTT or ECTT; physical realizability of models |
  | **2. Efficient = poly-time** | Convention of equating abstract complexity classes with feasibility | That poly-time captures actual human tractability; ECTT being true |
  | **3. Dismissing hypercomputation** | CTT as definition (Commitment 1) | ECTT; impossibility of physical hypercomputation |
  | **4. Celebrating quantum refutation of ECTT** | ECTT as empirical (Commitment 2); BQP ⊈ BPP | CTT as definitional; that quantum machines are physically realizable |

  ### Coherence Verdict
  The package is **coherent** with minimal tension. The definition/discovery switch between Habits 1/3 and Habit 4 is resolved by stratification:  
  - *Computability* (what is calculable) is **definitionally** fixed by CTT (enabling Habit 3).  
  - *Efficiency* (what is calculable with bounded resources) is **empirically** constrained by physics (enabling Habit 4).  
  Habit 1 relies solely on mathematical simulation (Commitment 3), not CTT/ECTT. Habit 2 is a convention independent of both. The sole tension lies in Habit 2's *rhetorical* conflation of "efficient" (conventional) with "feasible" (physical), but this is pragmatically tolerated.  

  ### Underdetermination
  The practice **does not distinguish between**:  
  - **CTT as definition** (e.g., Kreisel squeezing → necessary truth)  
  - **CTT as contingent natural kind** (Priya’s view: reference fixed by physical laws).  
  **Both** license:  
  - Dismissing hypercomputation (as category error or false empirical claim).  
  - Treating poly-time invariance as mathematical (Habit 1).  
  - Separating computability (fixed) from efficiency (empirical).  
  **No changes to practice** (paper writing, refereeing) follow from choosing one over the other. A working hypercomputer would force revision of CTT *under either reading*, but the *immediate* response (dismissal without experiment) aligns better with the definitional view.  

  ### Seminar Strategy
  **Sharpest Question:**  
  *"If we treat polynomial time as the invariant benchmark for efficiency (justifying Habit 1), and quantum machines refute poly-time classical simulation (Habit 4), why does 'efficient = poly-time' (Habit 2) retain its normative status? Shouldn't BQP redefine 'efficient'?"*  

  **Likely Answer:**  
  *"Poly-time remains a robust theoretical convention; BQP doesn’t make classical poly-time obsolete, it expands our notion of feasible computation."*  

  **Follow-up:**  
  *"Doesn't that concede that 'efficient' is a context-dependent convention, not a physical claim? And if so, why do we reject hypercomputation as definitionally impossible rather than empirically implausible – isn't that inconsistent?"*  
  *(This forces confrontation between the definitional reading of CTT and the conventional reading of efficiency.)*  

  ---

  This reconstruction shows the practice is consistent by decoupling **definitions** (computability), **theorems** (model-independence), **conventions** (efficiency = poly-time), and **empirical claims** (ECTT). Priya’s natural-kind view is compatible but not required; the definitional view better explains the reflexive dismissal of hypercomputation. The only substantive tension is the equivocation on "efficiency," which is tolerated for pedagogical and theoretical utility.
