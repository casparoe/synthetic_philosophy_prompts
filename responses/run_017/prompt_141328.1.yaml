  Okay, the user is in an upper-level philosophy seminar focusing on punishment theories and is struggling with the disconnect between theoretical frameworks and the actual capital punishment system in their state. They've provided a detailed description of how the system operates and want a reconstruction of the implicit theory behind the practice without citations or reading suggestions. They're looking for an argument that identifies whether the system is coherent or a patchwork of theories.

  The user's description includes several key elements: a statute focused on backward-looking desert while explicitly rejecting deterrence, a penalty phase requiring aggravating circumstances to outweigh mitigating factors, future dangerousness as a statutory aggravator, life without parole as the alternative, strict limitations on post-conviction evidence (requiring constitutional violations rather than just factual innocence), clemency based on substantial doubt about guilt, compensation for exonerees at a standard rate, and a pattern where only "volunteers" (those waiving appeals) are executed while others remain on death row for decades. They also note a 1 in 25 error rate with several wrongful convictions.

  I need to analyze how these features interrelate. The statute's retributive language seems undermined by other elements - like future dangerousness introducing forward-looking concerns. The compensation scheme treating exonerees like any other state injury suggests wrongful executions are seen as calculable costs rather than absolute violations, which conflicts with desert theory's focus on just outcomes.

  The volunteer execution pattern is particularly telling. Allowing some to expedite their executions while others wait decades implies that the state prioritizes the condemned person's choice over consistent application of desert or deterrence principles. This suggests an unstated "agency-respecting" element where the condemned can control the timing of punishment.

  The error rate and handling of innocence claims reveal tension too. The clemency board considers factual innocence, but courts don't - indicating innocence matters administratively but isn't legally fundamental. This half-measure approach to preventing wrongful executions contradicts the system's purported retributive foundation.

  I'll reconstruct this as a hybrid theory: primarily retributive in declaring desert as the basis for punishment, but incorporating consequentialist elements through future-dangerousness assessments. The compensation policy treats errors as foreseeable costs, while the volunteer system introduces autonomy considerations. This creates a system where retributive language masks practical compromises.

  When examining what would change under different theoretical frameworks: switching to deterrence would require eliminating desert-focused elements like the aggravator-mitigator weighing, while making innocence an absolute constraint would necessitate allowing post-conviction innocence claims and likely eliminating the death penalty altogether given the error rate.

  The user's frustration with the theory-practice gap is understandable - the system presents itself as retributive but operates through contradictory mechanisms that quietly accommodate efficiency, risk management, and autonomy concerns. The most coherent reading is that it's a "retributivism-plus" model where desert provides rhetorical cover for pragmatic adaptations.
answer: |-
  Here's a reconstruction of the implicit theory underlying the described capital-sentencing scheme, identifying its core commitments and tensions:

  1.  **Hybrid Justification: Desert + Risk Management (with Agency Respect):** The core justification is primarily *retributive*, focused on imposing deserved punishment ("worst offenders"). However, this is *modified* by consequentialist risk management:
      *   **Retributive Core:** The statutory purpose, the weighing framework (aggravators = desert markers, mitigators = reduced desert), and the focus on past acts establish desert as the *foundation* for the death penalty's legitimacy.
      *   **Consequentialist Modifier:** The "future dangerousness" aggravator (and its psychiatric assessment) introduces a strong *forward-looking* rationale: death is reserved not only for the worst past acts but also for those deemed too dangerous for life imprisonment. The LWOP alternative underscores this – death is imposed when incapacitation via prison is deemed insufficient. **Weak Presupposition:** The statute's deterrence disclaimer doesn't *rule out* deterrence entirely (it might linger in legislative intent or juror psychology), but the *explicit* forward-looking element is risk management/incapacitation, not deterrence. This feature *strongly* contradicts a *pure* retributive view that punishment should *only* look backward.

  2.  **Ambiguity on Innocence & Error:**
      *   **Pragmatic Acceptance of Error:** The compensation scheme (flat rate per year) strongly presupposes that wrongful imprisonment is a calculable, foreseeable cost of the system, akin to other state errors. This clashes fundamentally with the retributive core's emphasis on *just deserts*. **Weak Presupposition:** Clemency's focus on innocence shows a *moral* recognition of the innocence problem, but its separation from the *legal* process (courts ignore factual innocence post-appeal) reveals a *practical* acceptance of error: innocence is an administrative/executive safety valve, not a core legal constraint. The error rate (1 in 25 vacated, some innocent) is a tolerated outcome. This is *incompatible* with a strong retributive view demanding perfect accuracy for the ultimate punishment.

  3.  **Execution Timing & Agency:**
      *   **Agency-Respecting Suffering:** The decades-long delay for non-volunteers, contrasted with expedited executions for volunteers, presupposes that the *condemned person's choice* significantly determines the timing and nature of the punishment's imposition. **Weak Presupposition:** This *could* fit an expressive view where the punishment's meaning includes societal condemnation over time. However, it *strongly* contradicts both pure retributivism (desert demands timely punishment regardless of consent) and pure deterrence/incapacitation (delay undermines both). It introduces an unstated principle: the condemned has a right to *accept* or *resist* the timing of the state's imposed desert/incapacitation, making the suffering partially volitional. The delay itself becomes part of the punishment structure *based on the defendant's choice*.

  4.  **Statutory Theory vs. Operational Reality:** The statute's pure backward-looking language is partially belied by practice. Future dangerousness is a core statutory element, and the system pragmatically accepts error and allows defendant agency over timing. The *announced* theory is retributive; the *operating* theory is **Retributivism + Incapacitation + Pragmatic Risk/Acceptance of Error + Defendant Agency over Timing.**

  **Changes Under Alternative Theories:**

  1.  **Switch to Pure Expected Deterrence:**
      *   **Change:** Future dangerousness becomes irrelevant or secondary. The focus shifts to maximizing *perceived* certainty and severity to deter others. Mitigation focused on reduced culpability/desert might be minimized. Executions would likely be expedited for *all* to maximize deterrence value. The compensation scheme might stay, but innocence constraints might weaken further if deterrence value is high (though politically untenable). LWOP might be viewed as insufficiently deterrent. The volunteer/non-volunteer distinction vanishes – delay undermines deterrence.
      *   **Stay:** The weighing framework might remain procedurally, but its content shifts. Aggravators become proxies for high-deterrence-needed crimes.

  2.  **Innocence as Absolute Side-Constraint:**
      *   **Change:** Post-conviction claims of factual innocence *must* be heard and prioritized, regardless of constitutional error. The standard of proof for guilt/innocence might be raised ("beyond *any* doubt"?). Future dangerousness becomes irrelevant – innocence is the paramount issue. Clemency's innocence role becomes legally redundant. Compensation might increase but is secondary to preventing error. The entire system might become practically unworkable (given the error rate), likely leading to abolition or extreme rarity. Delay might increase further to exhaust innocence claims.
      *   **Stay:** The retributive *rationale* for punishing the guilty *could* remain, but its implementation is radically constrained. The weighing framework persists only for the demonstrably guilty.

  **In essence:** The scheme presupposes a **modified retributivism** where desert justifies the penalty's existence and targets the "worst," but its application is tempered by incapacitating the dangerous, pragmatically accepting a known error rate (with administrative clemency as relief), and respecting the condemned's agency over the timing of their execution. It's a hybrid, prioritizing retributive justification while incorporating consequentialist risk management and individual choice in practice. The strongest tensions lie between the retributive core and the acceptance of error/innocence, and between desert and the agency over timing.
