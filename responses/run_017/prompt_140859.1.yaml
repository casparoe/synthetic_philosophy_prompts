answer: |-
  **Final Exam Question: Normative Theory Seminar**  
  *(45 minutes / approx. 1000 words)*  

  Robert Nozick’s "utility monster" thought experiment challenges aggregative moral theories (e.g., utilitarianism) by imagining a being who derives vastly more welfare from resources than others. Total welfare would thus be maximized by diverting all resources to it, leaving others at subsistence. This seems intuitively unjust, suggesting aggregation fails to capture distributive constraints. We will examine two variants altering key features of the original scenario:  

  1.  **The Closed-Loop Monster**: This entity generates astronomical welfare entirely through self-contained mental processes (e.g., perpetual, costless hallucinations). Its bliss consumes *no external resources* that could otherwise benefit others. There is *zero opportunity cost* to its welfare.  
  2.  **The Swarm**: Instead of one entity, imagine a large population (e.g., 10 billion) where *each member* is marginally more efficient (e.g., 0.001%) at converting resources into welfare than the "baseline" population. Aggregation still demands giving all surplus resources to the Swarm, holding others at subsistence, because the tiny per-person gain, multiplied across billions, maximizes total welfare.  

  Additionally, consider the **Dud**: A person who gains vanishingly little welfare from resources (e.g., due to anhedonia). On aggregative views, we seemingly owe them almost nothing, as resources directed to them yield minimal welfare returns.  

  **Your Task**:  
  Analyze what underlying feature(s) make the *original* utility monster objection compelling. Does the intuition rely primarily on (i) the *scarcity* of resources and opportunity cost, (ii) the extreme *concentration* of benefits in one being, (iii) the aggregative principle *itself*, or (iv) something else? Defend your view using the *Closed-Loop Monster* and *Swarm* variants to test and isolate these factors. Crucially, explain what your conclusion implies for the *Dud*. If aggregative views struggle to justify aiding the Dud, is this a damning problem, or a defensible implication?  

  ---

  **Model Answer**  
  *(Approx. 700 words)*  

  The intuitive repugnance of Nozick’s utility monster stems not solely from aggregation *as such*, nor merely from scarcity, but crucially from the *extreme concentration of advantage* combined with the *moral insignificance of others’ claims* within pure aggregation. The Closed-Loop Monster and Swarm variants help disentangle these elements, revealing that while scarcity matters, concentration is pivotal to the reductio’s force. This analysis further exposes a genuine tension in aggregative views regarding the Dud, suggesting the problem lies deeper than opportunity cost.  

  First, the Closed-Loop Monster variant challenges the notion that scarcity and opportunity cost drive the intuition. Here, the monster’s bliss consumes no resources others could use; there is no material trade-off. Yet, the scenario remains disturbing. Granting one being near-infinite welfare *simply because it can experience it*, while others (capable of genuine, albeit lesser, welfare) receive nothing, still feels unjust. This suggests the core objection isn’t primarily about inefficient resource allocation. Rather, it highlights how unconstrained aggregation allows the sheer *intensity* or *capacity* for welfare in one entity to utterly swamp the claims of others, rendering them morally invisible. The absence of opportunity cost doesn’t resolve the moral discomfort; it simply shifts it to the question of why one entity’s potential for extraordinary gain should nullify the basic claims of all others.  

  The Swarm variant further clarifies this. Unlike the monolithic monster, the Swarm’s advantage is distributed across billions, each only marginally more efficient. While aggregative logic still demands starving the baseline population, the conclusion feels *less* intuitively repugnant than the original monster case. This difference is telling. The total welfare gain might be similarly vast, but its distribution across many individuals softens the perceived injustice. The baseline population’s claims aren’t rendered irrelevant by a single, insatiable behemoth; they are overridden by the aggregated weight of trivially larger, but vastly more numerous, claims. This feels less like a grotesque moral distortion and more like a tragic but familiar trade-off under scarcity – even if we might still reject the aggregative calculus here on other grounds (e.g., prioritarianism). The reduced intuitive force suggests the *concentration* of benefit in the original monster – the sheer lopsidedness – is a key amplifier of the reductio.  

  Therefore, the utility monster primarily exploits the tension between aggregation and the moral weight of individual separateness. Aggregation, taken purely, implies that welfare gains and losses are fungible across persons. The monster demonstrates that this can lead to counterintuitive outcomes where one entity’s capacity subsumes all moral consideration. Concentration matters because it makes this subsumption starkly visible and emotionally salient; the Swarm obscures it through distribution.  

  This analysis deeply informs the Dud case. If aggregation allows the monster’s capacity to nullify others’ claims, it similarly allows the Dud’s *incapacity* to nullify *their own* claim. Resources given to the Dud yield minimal welfare, so aggregation directs them elsewhere. The Closed-Loop Monster shows this isn’t just about opportunity cost (though cost exacerbates it). Just as the monster’s internal capacity creates a moral black hole drawing all resources in, the Dud’s internal incapacity creates a moral vacuum where their needs generate no pull. If we find excluding the Dud troubling (surely they deserve *some* resources, even if inefficiently used?), it challenges the same core premise: that an individual’s moral claim is reducible to their marginal contribution to total welfare. The Dud’s problem mirrors the baseline population’s in the monster scenarios – their claims are discounted due to properties intrinsic to them (low capacity) rather than relational factors like scarcity.  

  Consequently, the Dud *is* a serious problem for unmodified aggregative views, stemming from the same root as the monster objection: the failure to adequately account for the distinct moral status of persons. While the monster makes aggregation’s potential for tyranny vivid through concentration, the Dud reveals its potential for exclusion through incapacity. Defending aggregation requires either biting both bullets (accepting the Dud gets nothing and the monster gets everything) or modifying the theory (e.g., incorporating sufficiency thresholds, prioritarianism, or agent-relative constraints) to protect against these extremes. Neither the Closed-Loop Monster nor the Dud can be dismissed by appealing solely to opportunity cost; both challenge aggregation’s handling of individual moral standing.  

  ---

  **Marking Scheme (Total: 20 Points)**  

  A top-tier response (17-20) must accurately dissect the role of concentration vs. scarcity using the variants, avoid the two common errors flagged, and provide a coherent, well-reasoned analysis of the Dud’s implications. It clearly identifies extreme concentration as amplifying the reductio (using the Swarm’s lesser repugnance as evidence) and explains why the Closed-Loop Monster retains intuitive force despite zero opportunity cost, linking this to the moral invisibility of others’ claims under pure aggregation. Application to the Dud must be robust, showing how exclusion stems from the same core aggregative logic as the monster’s dominance.  

  High marks (13-16) require solid engagement with variants and Dud, but may have minor gaps (e.g., underdeveloped Dud analysis) or less precision in isolating factors. A clear thesis on what drives the intuition is essential.  

  A passing mark (10-12) addresses the variants and Dud but superficially, perhaps conflating elements or offering a muddled account of the intuition. Basic understanding of the cases is shown.  

  **Critical Errors (Loss of 3-5 points each, often fatal to higher marks):**  
  1.  **Treating the Swarm as merely a diluted Monster**: Failing to recognize that the Swarm’s distributed advantage weakens the intuitive repugnance *despite* similar aggregative outcomes, and thus missing the significance of concentration.  
  2.  **Asserting reductio suffices as argument**: Stating the monster "refutes aggregation because the conclusion is absurd" without analyzing *why* it feels absurd or using the variants to test hypotheses about the source of the intuition.  

  **Other Deductions:**  
  -   **-1 to -3**: Poor structure, unclear prose, ignoring a variant or the Dud.  
  -   **-2 to -4**: Misstating the cases (e.g., claiming Closed-Loop uses resources; misrepresenting Swarm mechanics).  
  -   **-3 to -5**: Superficial treatment, e.g., discussing only the original monster or generic aggregation problems without leveraging the variants’ design.  
  -   **-1 to -2**: Over-reliance on opportunity cost without addressing Closed-Loop’s challenge.  
  -   **-1 to -3**: Weak/no link between monster analysis and Dud implications.  

  **Key Gains:**  
  -   **+3 to +5**: Precise use of variants to isolate scarcity vs. concentration vs. aggregation.  
  -   **+2 to +4**: Insightful connection between Monster/Dud showing two sides of the same aggregative problem.  
  -   **+1 to +2**: Clear recognition that Closed-Loop’s persistence undermines scarcity as the *sole* driver.  
  -   **+1 to +2**: Nuanced comparison of Swarm’s intuitive force vs. original Monster.  
  -   **+1 to +2**: Explicit rejection of "reductio as argument" or Swarm-conflation errors.
