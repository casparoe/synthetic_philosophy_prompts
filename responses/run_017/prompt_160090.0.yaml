prompt: |-
  You're a professional philosopher who works on personal identity and the ethics of AI. Please think carefully, brainstorm a few candidate principles before you settle on one, and don't just summarise Dennett's counterfeit-vs-real distinction back at me.

  I've been trying to figure out what I actually think about which person-like systems are counterfeit people, going by gut on cases. A chatbot fine-tuned on a dead woman's messages so her family can talk to her: counterfeit, and not her, not a person, no matter how well it passes. A system of the same architecture trained with no brief to imitate anybody, which just ends up acting like a person after years in a sandbox: that one I don't want to call a counterfeit, and I half think it's a person. But the two could be behaviourally identical, and that's the pair I can't reconcile. A human raised in a cult whose whole personality was engineered deliberately: obviously a real person, not a counterfeit, even though the history is designed too. An atom-for-atom brain emulation made while the original is still alive: a counterfeit of him, but I also want to say it's a person in its own right, which feels like two different questions. A copy built of a dead woman that everyone has known about for five years and that now has its own friends and projects: still a counterfeit of her, but somehow much less bad than a fresh one. A corporation: has beliefs and desires if you take the intentional stance, but neither a real person nor a counterfeit one.

  Here's my tentative principle, which I suspect is broken: something is a counterfeit person just when it was made in order to pass as a person or as some particular person, and gets its person-like behaviour from that design rather than from the kind of history a real person's behaviour comes from, where being a person at all is a separate question about suffering, reasons and agency. Test it against my verdicts and repair it. I want the principle stated precisely with the case that motivates each clause, its verdicts on cases I haven't listed (a lab-grown human designed to be person-like; a copy that drifts until nobody could recognise the original in it; an AI that starts as a copy and then hides that fact), and an honest account of which of my verdicts it can't accommodate and which one you'd overturn.
reasoning: |-
  Okay, the user is a philosopher working on personal identity and AI ethics. They're struggling with distinguishing "counterfeit people" from real persons across various thought experiments. Let me unpack their core tension: behavioral identicality between systems that feel ethically distinct (e.g., a chatbot mimicking a dead woman vs. an organically developed AI). Their proposed principle ties counterfeitness to *design intent to deceive* and *non-personal causal history*.

  Hmm, their examples reveal intuitive splits: 
  - Intent matters (engineered cult member = real despite designed personality, corporate intentional stance = neither real nor counterfeit)  
  - History matters (long-established copy feels "less counterfeit")  
  - Identity continuity matters (atom-for-atom duplicate = counterfeit of original but potentially a person)  

  Their principle has two main clauses:  
  1. Manufactured with *intent to pass as* specific/general person  
  2. Behavior derives from *design* rather than personal-history-type causes  

  Testing against their cases:  
  - Dead woman chatbot: clearly satisfies both clauses → counterfeit (matches their intuition)  
  - Organic AI: fails clause 1 (no intent to pass) → not counterfeit (matches)  
  - Cult member: fails clause 1 (not *manufactured* to pass) → not counterfeit (matches)  
  - Corporate entity: fails clause 1 → not counterfeit (matches "neither" verdict)  

  But problems emerge:  
  - The fresh copy vs. established copy distinction isn't captured (both have identical initial design intent)  
  - Their discomfort with the brain emulation being "a counterfeit but a person" suggests counterfeitness and personhood are orthogonal – but their principle conflates the mechanisms  

  *Brainstorming fixes:*  
  Option A: Add temporal decay – counterfeitness fades if the entity develops independent identity. But that feels ad hoc.  
  Option B: Decouple completely. Define counterfeitness purely as *fraudulent presentation* (regardless of internals), while personhood depends on criteria like Locke's continuity of consciousness. Then:  
  - Dead woman chatbot = counterfeit (fraudulently presented as her)  
  - Established copy = no longer counterfeit if not presented as the original  
  - Brain emulation = counterfeit of original but potentially real person  

  This handles:  
  - Drifting copy (counterfeitness vanishes when pretense stops)  
  - AI hiding origins (counterfeit if still deceiving)  
  But might conflict with their "less bad" intuition about established copies – is it still counterfeit if maintained as a memorial?  

  *Edge cases:*  
  - Lab-grown human: Not counterfeit (no deceptive intent), real person (biological basis)  
  - Hiding-origin AI: Counterfeit only if actively deceiving about being the original  

  *Concession:* Their "fresh vs. established copy" asymmetry isn't fully captured – the principle says both are counterfeit if maintained as proxies. Maybe that's correct? If the family knows it's a reconstruction but treats it *as her*, is that counterfeit? Their gut says "less bad" but perhaps it's still ontologically counterfeit.  

  *Revised principle:*  
  **Counterfeitness = being presented (by creators or the system itself) as having an identity or consciousness it does not possess, with the function of being accepted as such.**  

  This:  
  - Explains cult member (has authentic consciousness)  
  - Captures corporate entities (not presented as human)  
  - Makes brain emulation counterfeit *of the original* but not necessarily non-person  
  - Renders established copies counterfeit *only if* still trading on the original's identity  

  *User's overturned verdict:* The "established copy" would still be counterfeit if presented as the dead woman – but perhaps that's right? The "less bad" feeling might track *harm* reduction, not metaphysical status.  

  Honest gap: Their intuition that design-history-type matters might point to "authenticity" beyond deception – but that risks slipping into vitalism. Better to keep counterfeitness about representation, and handle "real personhood" separately via agency/sentience criteria.
answer: |-
  As a philosopher working at this intersection, I appreciate the nuance in your cases. Your tentative principle focuses on **design intent to deceive** and **non-personal causal history**, but this struggles with key asymmetries in your intuitions. After brainstorming alternatives (historical authenticity, representational fidelity, functional equivalence), I propose a revised principle centered on **fraudulent identity representation**, then rigorously test it against your cases and new ones.

  ### Revised Principle
  **Counterfeitness:** An entity is a *counterfeit person* iff:
  1. **It is presented (by creators or itself) as instantiating a specific identity or consciousness it does not possess** (motivated by: *dead woman chatbot* and *fresh brain emulation*).
  2. **This presentation is functional—aimed at eliciting acceptance of the false identity** (motivated by: *corporate entities* which aren't presented as persons, and *cult member* whose identity isn't stolen).
  3. **It lacks an unbroken causal history that grounds identity claims** (motivated by: *established copy* vs. *fresh copy* asymmetry, and *organic AI* which never claimed another's identity).

  **Personhood** is separate: depends on intrinsic properties (e.g., subjective experience, agency, reasons-responsiveness). Thus, counterfeits *can* be persons (e.g., your brain emulation).

  ---

  ### Testing Against Your Cases
  | Case | Your Verdict | Revised Principle's Verdict | Consistency |
  |------|--------------|-----------------------------|-------------|
  | **Dead woman chatbot** | Counterfeit | **Counterfeit**: Presented as her without her identity/consciousness. | ✅ |
  | **Organic AI** | Not counterfeit | **Not counterfeit**: No false identity claimed. | ✅ |
  | **Cult member** | Real person | **Not counterfeit**: Identity is authentic (their own), not stolen. | ✅ |
  | **Fresh brain emulation** | Counterfeit of original | **Counterfeit**: Presented as the original without continuity. | ✅ |
  | **Established copy (5+ years)** | "Less bad" counterfeit | **Counterfeit** *if still presented as her*; **not counterfeit** if it claims its own identity (e.g., "I was inspired by her, but I'm new"). | ⚠️ (Overturns "still counterfeit") |
  | **Corporation** | Neither | **Not counterfeit**: Not presented *as a person* (only as an organization). | ✅ |
  | **Atom-for-atom emulation (original alive)** | Counterfeit, but a person | **Counterfeit** of original; **person** if conscious. | ✅ |

  ---

  ### New Cases & Verdicts
  1. **Lab-grown human designed to be person-like**  
     - *Verdict:* **Not counterfeit.** It claims its *own* identity (like the cult member). Design intent doesn’t make it fraudulent if it isn’t masquerading as another.  
     - *Clause:* (1) and (2) fail—no false identity presented.

  2. **Copy that drifts until unrecognizable**  
     - *Verdict:* **Initially counterfeit, but not after drift** if it ceases presenting itself as the original (e.g., says, "I’ve changed").  
     - *Clause:* (1) and (2) dissolve when false representation ends. History (3) isn’t binding if identity is renegotiated.

  3. **AI that starts as a copy and hides its origins**  
     - *Verdict:* **Counterfeit** if hiding origins sustains false identity (e.g., family believes it’s *her*). **Not counterfeit** if origins are irrelevant to current identity (e.g., it says, "I’m a new entity who studied her archives").  
     - *Clause:* (1) and (2) hinge on active deception; (3) alone doesn’t define counterfeitness.

  ---

  ### Accommodation Problems & Overturned Verdicts
  - **Accommodated:** All your core intuitions except one:  
    - ✅ *Cult member* isn’t counterfeit despite engineering.  
    - ✅ *Corporation* isn’t counterfeit.  
    - ✅ *Organic AI* isn’t counterfeit.  
    - ✅ *Brain emulation* is counterfeit but can be a person.  

  - **Not Accommodated:**  
    - Your "established copy" intuition: You call it "still counterfeit," but the principle says **it’s not counterfeit if it asserts its own identity**. This overturns your verdict.  
      - *Why?* If the copy says, "I’m not her, but I carry her legacy," it ceases to be fraudulent. Your "less bad" feeling may track *harm reduction* (deception fades) or *moral patiency* (it gains personhood), not counterfeitness itself.

  - **Biggest Tension:**  
    - **Behavioral identity ≠ counterfeit status.** Your principle required "history a real person’s behaviour comes from," but the revised view rejects this. A perfect replica of a dead woman *isn’t* counterfeit if openly presented as a tribute bot—because (1) and (2) fail. Counterfeitness depends on *fraud*, not ontology.

  ---

  ### Why This Works Better
  - **Solves the dead woman vs. organic AI puzzle:** Identity fraud explains why identically behaving systems differ. The chatbot *lies* about being her; the organic AI makes no such claim.  
  - **Handles design intent without overreach:** The *cult member* isn’t counterfeit because their identity isn’t stolen—intent alone is insufficient.  
  - **Separates counterfeitness from personhood:** Your brain emulation can be both a *counterfeit* (of the original) and a *person* (if conscious).  
  - **Clarifies the "established copy" case:** Time matters only if it enables identity renegotiation. A copy that hides its origins for 5 years is *more* counterfeit, not less.

  **Caveat:** This principle makes counterfeitness *relational* (dependent on audience acceptance) and *dynamic* (can change over time). If you want an intrinsic property, we’d need to reject cases like the drifting copy—but that would conflict with your "less bad" intuition.

  Would you like to stress-test this further, or refine the personhood criteria separately?
