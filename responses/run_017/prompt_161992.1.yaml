answer: |-
  Here’s a targeted Q&A prep sheet, prioritizing objections by likelihood/damage, tailored to your audience. Replies are concise, citation-free, and flag soft spots.  

  ---

  ### **Top 4 Objections (Likelihood × Damage)**  
  1. **From Dynamic Choice Group** (High likelihood, High damage):  
     *"This is just Savage-style extended preferences or McClennen’s resolute choice. You’ve rediscovered that sophisticated choice avoids pumps. Why frame it as a critique of the argument?"*  
     **Reply:** "Agreed: sophisticated *policies* avoid exploitation. But the money pump argument claims cyclic preferences *themselves* are irrational. My point is that the pump only shows irrationality if you assume the agent *can’t* adopt a sophisticated policy (like loop-closing). The verdict targets the policy failure, not the preference."  
     **Soft Spot:** They’ll note this resembles McClennen. Concede the similarity but stress your target is the *explanatory direction*: preferences aren’t inherently flawed; it’s the unavailability of binding that creates vulnerability.  

  2. **From Formal Epistemology/Social Choice** (High likelihood, Medium-High damage):  
     *"If synchronic coherence (e.g., transitivity) isn’t foundational, what *grounds* rational diachronic policies? Your ‘binding’ condition smuggles in normative constraints beyond desires."*  
     **Reply:** "Diachronic rationality is about achieving ends across time. If you value A>B>C>A, but adopting a policy to avoid C→A trades lets you keep A, that policy serves your desires better than myopic trading. The ‘binding’ isn’t extra normativity—it’s instrumental to satisfying your actual preferences."  
     **Soft Spot:** They’ll press how to formalize "better" without synchronic axioms. Emphasize *avoiding dominated outcomes* (ending with A-minus-pennies vs. A) as the core standard.  

  3. **From Humean Senior** (Medium likelihood, High damage):  
     *"Reasons flow from desires. Calling a ‘policy’ rational independent of current desires is empty metaphysics. If I prefer C to A *now*, refusing the C→A trade frustrates my present desires—that’s irrational!"*  
     **Reply:** "But your past self preferred A to C and paid to avoid this trade. Honoring that *also* serves your desires: it prevents cumulative loss. The pump exploits *conflicts* between temporal selves. The policy view resolves this by asking: ‘Which course best satisfies your preferences overall?’"  
     **Soft Spot:** She may reject "temporal selves" as non-Humean. Argue that a unified agent can care about *lifetime satisfaction*, making past/future desires relevant to present choices.  

  4. **From Grad Students** (High likelihood, Low-Medium damage):  
     *"In the closed pump, if you refuse the first trade, aren’t you just being inconsistent? You prefer A to B, so refusing A→B violates your ‘true’ preferences!"*  
     **Reply:** "Refusing A→B isn’t inconsistent—it’s foresight. If you know the sequence leads back to A-minus-pennies, trading *at all* is dominated. The pump only punishes myopia. Rationality requires sensitivity to downstream effects, not slavishly following pairwise preferences."  
     **Soft Spot:** They might insist preferences must be "action-guiding." Stress that *conditional* preferences (e.g., "I prefer A to B, but not if it triggers a pump") are coherent.  

  ---

  ### **Strategic Concession (Make Early)**  
  **Concede:** *"I agree: synchronic coherence (like transitivity) is sufficient to avoid money pumps. But it’s not necessary—agents with cyclic preferences can avoid exploitation via sophisticated policies. The pump argument’s power comes from conflating necessity with sufficiency."*  
  **Why:** Neutralizes dynamic-choice critics early and preempts "old news" objections.  

  ---

  ### **Key Reply That Must Land**  
  **Core Pitch:** *"The money pump doesn’t show your preferences are irrational. It shows that if you can’t bind your future choices, cyclic preferences make you vulnerable to exploitation. But the flaw is in the inability to bind—not the preferences themselves."*  
  **Hammer This:** In every reply, loop back to "policy failure, not preference failure."  

  ---

  ### **Nightmare Question (Worse Than Smoking)**  
  *"Suppose an agent has cyclic preferences but can bind herself. She adopts a policy to refuse all trades. Now she’s offered a *non-pump* beneficial trade (e.g., A→D where D>A). She refuses, bound by her policy. Isn’t she *still* irrational—and doesn’t this show cyclic preferences *do* inherently cause irrationality, just in a different way?"*  

  **Why It’s Deadly:**  
  - Forces you to defend rigid policies that reject genuine improvements.  
  - Suggests cyclic preferences *require* inflexibility to avoid pumps, itself a rationality failure.  
  - Lets critics argue transitivity avoids both problems.  

  **Reply (2 mins):**  
  1. *"This confuses two failures:* Refusing a beneficial trade *is* irrational, but it’s a flaw in the *policy*, not the preferences. A better policy would permit non-pump trades (e.g., ‘only trade if no loop is triggered’).  
  2. *"Cyclic preferences don’t cause this:* Even with transitive preferences, a bad policy (e.g., ‘never trade’) would cause the same error.  
  3. *"The root is policy design:* Rational policies must balance exploitability risks with opportunity costs. Cyclic preferences make this harder but not impossible."  
  **Soft Spot:** Critics may say "harder" = irrationality. Retort: Rationality is about avoiding *guaranteed* loss, not optimizing every trade.  

  ---

  ### **Tactical Notes**  
  - **Akrasia Allies:** If they hijack for "resolve," say: *"That’s a separate issue—here, binding is about information and commitment mechanisms, not willpower."*  
  - **Humean:** Frame binding as a *means* to satisfy desires over time.  
  - **Grad Students:** Use vivid examples (e.g., "Would you pay $0.01 to trade A for B if you knew a scammer waits at C?").  
  - **When Stuck:** Redirect to "What the pump *actually* proves: vulnerability stems from myopia + no binding, not preferences alone."  

  You’ve got this. Your framing is razor-sharp—just don’t let them collapse diachronic into synchronic rationality.
