  ### **Joint Statement: Adversarial Collaboration on Constitutional Entrenchment**

  #### **Agreed Claims (What the Mechanism Is and Does)**  
  1. **Mechanics of Entrenchment**: The design makes repealing the debt brake or biometric ban procedurally costly (60% bicameral vote, lottery-selected citizens’ assembly approval, 12-month delay) but not impossible. Amending *the amendment rule itself* is declared permanently impossible.  
  2. **Purpose**: The intent is to shield specific policies from short-term political pressures, crises, or factional capture by raising the decision cost for repeal.  
  3. **Limitation**: This cannot physically prevent future generations from disregarding the constitution (e.g., revolution, non-compliance). It only alters *legal* pathways to change.  
  4. **Analogy**: Both accept the Ulysses myth as a *metaphor* for self-binding, but disagree on its applicability here.  

  #### **Disagreements Table**  

  | ID | Crux                                                                 | Presentist Formulation (Your View)                                                                 | Ulyssean Formulation (His View)                                                                   | Kind         | Shared Test                                                                                                | Your Prediction                                                                 | His Prediction                                                                | Evidence Against Your Side                                                                 |
  |----|----------------------------------------------------------------------|----------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|--------------|------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|
  | 1  | **Meaning of "Binding"**                                             | "Binding" requires impossibility of reversal; otherwise, it’s mere cost. Speed bumps ≠ self-binding. | "Binding" means raising the cost of reversal beyond ordinary politics. Difficulty = meaningful constraint. | Verbal       | Does "binding" in legal theory/practice imply impossibility or high cost?                                  | Scholars/practitioners use "binding" for both irrevocable *and* costly constraints. | Historical constitutions treat supermajorities as "binding" despite reversibility. | If legal texts consistently call costly-but-possible clauses "entrenched" or "binding".    |
  | 2  | **Constituent Moments vs. Ordinary Politics**                        | Framers are no calmer/more rational than future majorities; "constituent moments" are political acts like any other. | Constituent moments (e.g., post-revolution, post-crisis) enable deliberative, long-term reasoning absent in daily politics. | Empirical    | Study rates of constitutional amendments: Are "crisis-driven" amendments more frequent/hastier than foundational ones? | Crisis amendments show similar deliberation to founding. Founders were equally partisan. | Data shows crisis amendments are 3x faster/less deliberative than founding. | If evidence shows framers consistently adopt broader safeguards than crisis legislatures. |
  | 3  | **Agent of Precommitment**                                           | Only living voters have standing. Framers cannot bind strangers (future citizens).                 | "The People" is a transgenerational entity. Framers act *as* the People in its sovereign capacity. | Normative    | Public opinion polls: Do citizens view the constitution as "their" document or as imposed by the past?   | Most citizens see constitutions as revisable artifacts, not timeless vows.       | Citizens refer to foundational framers as "us," not "them," in national narratives. | If polls show strong majorities believe constitutions bind descendants.                   |
  | 4  | **Psychiatric Directives as Analogy**                                | Advance directives work because the *same person* exists before/during crisis. States lack continuity of identity. | Both involve principal-agent problems: a "sane self" restricts a "impaired future self" (person) or "factionalized future majority" (state). | Normative/Bedrock | Do people support advance directives but oppose constitutional eternity clauses? If so, why?            | Publics accept self-binding for individuals but reject it for collectives.       | Similar principles (anti-self-harm) justify both; collective self-binding is scaled-up autonomy. | If societies approve both at similar rates *or* reject both on identical grounds.        |

  ---

  #### **Verbal vs. Substantive Disagreements**  
  - **Verbal**: Crux #1 ("Binding"). Resolution: Agree to use "procedural entrenchment" (costly reversal) vs. "substantive entrenchment" (impossible reversal).  
  - **Substantive**: Cruxes #2–4.  
    - **Reasoning**: #2 is empirical (testable with historical data). #3 and #4 are normative/bedrock; they depend on irreconcilable premises about collective identity and sovereignty.  

  #### **Progress Conditions**  
  | What                     | Would Move Whom | Realistic | Why                                                                 |
  |--------------------------|-----------------|-----------|---------------------------------------------------------------------|
  | Data on amendment rates in crises vs. founding eras | Both            | Yes       | Empirical test for Crux #2. If crisis amendments are hastier, favors Ulyssean; if similar, favors Presentist. |
  | Polls on citizen identification with framers       | You             | Yes       | If citizens see framers as "them," weakens Ulyssean view of transgenerational "People." |
  | Case study: Germany’s debt brake (entrenched but amendable) | Him          | Yes       | If reversible entrenchment prevents crises without tyranny, supports cost-based binding. |
  | Thought experiment: Framers entrench unpopular policy (e.g., monarchy) | Both | No        | Highlights bedrock disagreement: Is *any* eternal constraint legitimate? |

