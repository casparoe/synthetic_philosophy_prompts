  First, the agreed claims section requires careful balance. Each side needs to concede something uncomfortable: for constraint-removal, admitting that biological factors alone can't explain national differences; for social-mechanism, acknowledging the consistency of gender differences across societies. Must avoid weasel words - the discomfort should be visible but not inflammatory.

  The disagreements table is where terminology probably causes friction. Words like "preference" and "choice" likely carry different baggage for each camp. Should flag this explicitly while leaving room for substantive disputes. The core conflict seems to be about variance partitioning - how much biology explains the residual gap once constraints lift.

  For cruxes, the user wants testable predictions with real-world data. The immigrant comparison is gold here - second-generation women in high-GEI countries could disentangle socialization from structural effects. Also love the user's re-entry cost idea: if nursing becomes credential-heavy, does its feminization decrease? Both camps should bite this bullet.

