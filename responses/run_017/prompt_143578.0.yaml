prompt: |-
  You are a professional philosopher who works on causation, and you have also spent years advising hospital incident-investigation teams. Please answer as both at once, and think carefully rather than quickly: this is going straight into a document that will be used on real cases.

  Before you write the procedure, spend a few paragraphs brainstorming, and show me that thinking. In particular: what has to be true of something for it to be a cause at all; whether an absence or a failure to act can satisfy that requirement, or only fail to satisfy it in an interestingly different way; why a simple would-it-have-happened-anyway test seems to return far too many causes once failures to act are allowed in; and where you expect the untutored judgments of a clinical panel to be systematically unreliable. Then move to the procedure, and keep it consistent with what you concluded in the brainstorming.

  My situation: I am a consultant geriatrician, and about six months ago I was asked to chair our hospital's serious-incident review panel. I took the job because of one case: a junior doctor's failure to escalate a deteriorating patient overnight was recorded in the report as a cause of the patient's death, the report went to the trust board and then to the regulator, and the doctor's career has been derailed. I remain unsure whether the panel knew what it was saying. Since then I have sat on eight panels, and we have the same unproductive argument every time, in different words. The panel has six members (three clinicians, a senior nurse, a manager, a lay member), ninety minutes per case, and no philosophy training whatsoever. Our reports go to the trust board, may be disclosed to a coroner, and are read by bereaved families. We have three verdicts available to us, and I now think the problem is partly that we do not know what any of them means: causal factor, contributing factor, learning point.

  Here are the recurring patterns that make me think we need an actual procedure rather than better instincts.

  One: the blank box. A dose chart with an unticked box, or a set of observations recorded and not acted on, produces a confident verdict of causal factor. An identical physical consequence reached because no one ever thought of the patient at all — no one considered a scan, no one considered a review — produces hesitation and usually no finding. The difference feels evidential rather than causal, but we never say so, and I suspect we are conflating what we can prove with what happened.

  Two: the description. Failure to escalate, failure to escalate within an hour, failure to escalate to the outreach team, failure to escalate to a registrar who was not simultaneously covering two other wards. Our verdict flips with the grain of description and we pick the grain unconsciously. I need the procedure to force the description to be fixed, and to say which grain is the right one and why.

  Three: the drifting baseline. Once we say what would have happened if the act had been performed, we have to decide what else in that hypothetical world is allowed to differ. Do we hold fixed that the ward was short-staffed, that the registrar was elsewhere, that the monitor had been unplugged? In practice I watch panels freeze whatever makes the individual look worse and let vary whatever makes the individual look better. I want an explicit rule about what is held fixed, and I want you to be honest about the places where no rule works and it is a judgment call that we should at least make in the open.

  Four: cases where what failed to happen is itself something that would have stopped the harm. The alarm that did not sound, the alert that was configured off, the consultant who did not arrive to do the procedure that would have prevented the bleed. These feel different from the simple failures and I do not know whether they belong in the same category or a separate one, or whether our form needs a second box.

  Five: the diffused failure. Three teams each assumed another had booked an outpatient scan; no individual omission looks necessary, because any one of the three would have booked it had the others not. The group's failure does look necessary. Our reporting form only has room for named individuals, so we currently either invent a culprit or record nothing.

  Six: failures by whoever is not in the room. Nobody recruited the extra consultant; nobody implemented the early-warning score the trust had already agreed to buy. I do not know where these stop being causes and become something else — background, or history, or the reason we are here at all.

  What I want from you:

  A written decision procedure the panel can run inside ninety minutes, as an ordered set of questions, with what counts as a sufficient answer to each, what evidence satisfies it, and what we do when the evidence is simply absent. It must say where the procedure stops with a firm finding of no causal factor, where it returns that the question cannot be settled on the available evidence, and where it stops and hands the decision to us because the remaining question is one of values rather than facts. I think there is a values decision hiding in what the record is for — explaining what happened, learning how to prevent the next one, or assigning accountability — and I think we are currently answering all three with one word. If you agree, make that handoff explicit and tell us how to phrase it in a report.

  It must also tell me which distinctions from the philosophical literature have to survive the translation into our meeting and which can be dropped without real loss, and why each is on the side it is on. I would rather drop something true than keep something our lay member cannot apply. And I want to know where the procedure will misfire.

  Then apply it, in full, to three of our cases.

  The first is the overnight deterioration: observations showing a falling blood pressure and rising respiratory rate were taken at 02:00 and 05:00 and not escalated; the patient had a cardiac arrest at 07:00 and died; the ward had one nurse for twelve patients that night and the outreach team was already attending two other arrests. The second is the configured-off drug alert: a patient with a documented severe allergy was prescribed the drug, no alert fired, the patient had an anaphylactic reaction and survived with harm; the alert had been disabled for that ward eleven months earlier by a member of staff who has since left, as part of a workaround for alert fatigue that nobody ever reviewed. The third is the unbooked scan: the discharge summary said outpatient imaging to be arranged; three separate teams each assumed another had arranged it; the malignancy was found eleven months later at a stage that changed the prognosis.

  Finally, and this matters as much as the rest: I expect the procedure to give us an answer the panel will dislike on at least one of these, and I suspect it is the first one, where the staffing and the other arrests may make the escalation into a non-difference-maker. Tell me which case you think it will be, and then tell me how to write that finding so that it does not read to a bereaved family, or to the trust board, as an exoneration of the person who did not escalate. If the right answer is that we need a sentence distinguishing causation from blame, give me that sentence and explain why it does the work.
reasoning: |-
  Okay, the user is a consultant geriatrician chairing a hospital incident-review panel. They're struggling with how to determine causation in medical incidents, especially cases involving omissions or failures to act. Let me unpack their query step by step.

  First, the core problem seems to be that their panel conflates causation with blame. They mention a junior doctor whose career was derailed after being labeled a "cause" of death for not escalating a deteriorating patient. The panel has six members with no philosophy training, limited time, and uses vague terms like "causal factor" without clear definitions. The recurring patterns they describe reveal systematic biases: focusing on documented omissions over systemic gaps, inconsistent description granularity, shifting counterfactual baselines, and difficulty handling distributed or abstract failures.

  Hmm... the philosophical challenges here are deep. For something to be a cause, it typically needs to be a difference-maker - but how does that apply when nothing happened? Absences can be causes (like not giving insulin causing diabetic coma), but only if there was a duty to act. The "would it have happened anyway" test becomes useless if we count all omissions - e.g., the Queen not visiting wouldn't prevent a death, but the nurse not checking vitals might. The key is normative context: medical duties define which omissions matter.

  The user's six patterns map neatly to philosophical pitfalls:
  1. "Blank box" shows availability bias (documented omissions get blamed more than invisible system gaps)
  2. "Description" reveals that causation depends on how we frame the omission (e.g., "failure to escalate" vs. "failure to escalate within 5 minutes")
  3. "Drifting baseline" exposes how counterfactuals get manipulated (holding fixed factors that implicate individuals)
  4. "What failed to happen" suggests a need to distinguish direct prevention failures from contributory conditions
  5. "Diffused failure" requires collective responsibility models
  6. "Failures by whoever is not in the room" touches on institutional vs. individual causation

  For the procedure... it must be usable in 90 minutes by mixed panels. Should anchor on difference-making with explicit duty assignments. Need to separate factual causation ("did this omission change the outcome?") from normative appraisal ("was it blameworthy?"). Critical to define the baseline world rigidly - probably holding fixed all systemic constraints (staffing, resources) unless they were themselves breaches of duty.

  Ah, the three cases will test this:
  - Overnight deterioration: If the outreach team was unavailable due to other arrests, escalation might not have changed outcome. But panel will hate saying it's not causal.
  - Disabled alert: System designer who created fragile workaround is causally responsible, but they've left. How to assign?
  - Unbooked scan: Collective omission - no individual was necessary but the group failure was sufficient.

  Biggest landmine is definitely the first case. The procedure might conclude the omission wasn't causal because even if escalated, help couldn't arrive. But we must phrase it carefully: "While escalation was required, the outcome would likely have occurred due to resource constraints. This highlights systemic vulnerabilities in night coverage." Explicitly decouple causation from duty: "A clinician may breach protocol without causing harm, just as one may cause harm without blame if systems failed them."

  The values handoff is crucial. Panels want to "prevent recurrence" but end up scapegoating. Procedure should force them to declare when they're making a prevention recommendation vs. assigning accountability. For example: "This was not a but-for cause (factual finding), but the failure to escalate violated clinical standards (normative finding). Recommended actions: X (systemic) Y (individual retraining)."

  For misfires... this approach might underestimate systemic causes when duties are undefined. Also, the rigid baseline could mask deeper institutional failures. Need to flag cases where "holding systems fixed" feels unjust - that's when we're actually making a values call about responsibility assignment.
answer: |-
  ## Brainstorming: Foundations for a Causation Procedure

  **1. What makes something a cause?**  
  Causation requires *difference-making*: a cause is a factor without which the outcome would not have occurred *in the specific circumstances* (the "but-for" test). Crucially, it must be a *relata*—a positive event or state. Absences (failures to act) are not events but *contrasts*: we label "failure to escalate" as causal only because we contrast it with an *expected action* defined by duty/standard. This isn't flawed metaphysics but pragmatic attribution within a normative framework. Without duty, an absence isn't causal ("the Queen didn’t visit" isn’t a cause); with duty, it *is* a difference-maker relative to the standard.

  **2. The "would-it-happen-anyway" problem**  
  If we naïvely apply but-for causation to omissions, *everything* becomes causal. (If the nurse had teleported the patient to Mars, they’d have survived—so is gravity a cause?) The solution isn’t abandoning omissions but **anchoring them to specific duties**. We ask: "But for the breach of *this* duty, would the outcome have differed?" This limits causes to *normatively significant* omissions. 

  **3. Where panels err systematically**  
  - **Evidential bias:** Documented omissions (e.g., unticked boxes) are over-weighted; invisible system gaps (e.g., no scan considered) are under-weighted.  
  - **Granularity arbitrariness:** Descriptions like "failure to escalate within 60 mins" vs. "failure to escalate appropriately" change causation judgments based on framing, not reality.  
  - **Baseline manipulation:** Panels freeze/vary counterfactuals to fit blame narratives (e.g., holding staffing fixed when it implicates an individual, varying it to exonerate).  
  - **Conflation of causation and blame:** "Causal factor" becomes synonymous with "accountability target."

  ---

  ## Incident Review Procedure: Causation Assessment Framework

  **Phase 1: Fact-Fixing (10 mins)**  
  *Task:* Agree on uncontested facts (timeline, actions, policies).  
  *Output:* A shared chronology.  
  *If evidence absent:* Note gaps; proceed only on agreed facts.

  **Phase 2: Duty Assignment (15 mins)**  
  *Question 1:* "Was there a *specific, binding duty* (policy/protocol/standard) applicable to an individual/team at the time?"  
  - *Sufficient evidence:* Signed policy, training records, job descriptions.  
  - *Output:* List of duties (e.g., "Registrar duty to review NEWS ≥7 within 30 mins").  
  *If no duty:* Stop—no causal omission. Recommend system change ("learning point").  

  **Phase 3: But-For Causation (Counterfactual) (25 mins)**  
  *Question 2:* "If the duty *had been fulfilled* (holding all *systemic factors fixed*—staffing, resources, equipment), would the outcome *likely* have been avoided?"  
  - *Systemic factors fixed:* Ward staffing, equipment status, concurrent emergencies. These are background conditions, not breaches.  
  - *Evidence:* Clinical guidelines, expert input on timeliness, analogous cases.  
  - *Output:* "Yes," "No," or "Uncertain."  
    - *If "No"*: Not a causal factor. Proceed to Phase 5 for system review.  
    - *If "Uncertain"*: Flag as "contributory factor" (see definitions below).  
    - *If "Yes"*: Proceed to Phase 4.  

  **Phase 4: Proximal Causation Check (10 mins)**  
  *Question 3:* "Was the omitted action *itself* the direct preventer of harm, or did it rely on a further chain of events?"  
  - *Purpose:* Distinguish "failure to act" (e.g., not escalating) from "failure of a safety system" (e.g., disabled alarm).  
  - *Output:* Classify as:  
    - **Direct Preventer Omission** (e.g., not giving antidote).  
    - **System-Failure Omission** (e.g., alarm disabled).  
    - *No verdict change, but affects Phase 5 recommendations.*

  **Phase 5: Verdict & Handoff to Values (20 mins)**  
  *Verdict Definitions:*  
  - **Causal Factor:** Breach of duty + but-for causation established.  
  - **Contributory Factor:** Breach of duty + causation plausible but uncertain, *or* system failure without individual duty-breach.  
  - **Learning Point:** No duty breached, or no causation, but system improvement possible.  

  *Values Handoff:*  
  - **If causation is established but context mitigates blame:** "This was a causal factor. However, systemic pressures [specify] created conditions where this breach was likely. Accountability sits with [individual/system] as per our policy on [X]."  
  - **For diffused failures:** "Collective failure by [Team A/B/C] was causal. No individual breach was sufficient alone, but the group’s duty to ensure scanning was breached."  
  - **For absent evidence:** "Insufficient evidence to assign causation. Recommended: [investigation action]."  

  *Report Phrasing:*  
  > "We find [verdict] regarding [action/omission]. This is a factual finding about difference-making. Separately, accountability and system responses are determined by [trust policy/HR framework], considering foreseeability, constraints, and intent."

  ---

  ## Why These Philosophical Distinctions Matter (and Which to Drop)

  **Essential:**  
  - **Duty-anchored omissions:** Drops irrelevant absences (e.g., "no royal visit") while capturing clinical failures.  
  - **Fixed systemic baselines:** Prevents blame-shifting by holding resources fixed. Forces focus on *avoidability within real constraints*.  
  - **But-for causation:** The minimal test for "made a difference." Non-negotiable.  

  **Dropped Without Loss:**  
  - **Metaphysical debates (e.g., "are absences real?")**: Clinically irrelevant. Focus on *duty-bound expectations*.  
  - **Overdetermination:** Rare in medicine; handled by "contributory factor" for uncertain cases.  

  **Where the Procedure Misfires:**  
  - **Complex system failures** (e.g., cyber incidents with no clear duty-bearer).  
  - **"Could-have-prevented" cascades** (e.g., if multiple distant decisions contributed). Use "contributory factor" generously here.  

  ---

  ## Application to Cases

  **Case 1: Overnight Deterioration**  
  - *Duty:* Junior doctor had duty to escalate NEWS ≥7. *Breached?* Yes.  
  - *But-for causation (fixed: staffing, other arrests):* If escalated, could outreach have attended? *Unlikely* (two other arrests). Outcome unchanged.  
  - *Verdict:* **Not a causal factor.** Learning point: Review nighttime escalation protocols during resource crises.  
  - *How to phrase:* "While the failure to escalate breached protocol, it did not cause death given the unavailability of the outreach team. This highlights a system vulnerability: no backup for nighttime emergencies. The breach remains a serious performance issue addressed separately."  

  **Case 2: Configured-Off Drug Alert**  
  - *Duty:* Duty on pharmacy/IT to maintain safety systems. *Breached?* Yes (disabled alert without review).  
  - *But-for causation:* If alert active, prescription likely stopped. Harm avoided.  
  - *Proximal check:* System-failure omission (alert disabled).  
  - *Verdict:* **Causal factor** (collective: pharmacy/IT systems team).  
  - *Output:* "The deactivation of the drug alert without review caused this harm. Responsibility lies with medication safety systems."  

  **Case 3: Unbooked Scan**  
  - *Duty:* Collective duty on Teams A/B/C to ensure scan booked. *Breached?* Yes (all assumed others acted).  
  - *But-for causation:* If any team had acted, scan booked. Earlier detection likely.  
  - *Verdict:* **Causal factor** (collective failure).  
  - *Output:* "The shared duty to arrange scanning was breached by all three teams. This caused an 11-month delay in diagnosis, altering prognosis."  

  ---

  ### Addressing the Hard Truth
  The procedure will dissatisfy in **Case 1**. Panels want "causal factor" to reflect breach severity, but causation is factual, not moral. **Key sentence for reports:**  
  > **"Causation answers whether the outcome depended on this breach; it does not assess blame. Blame considers whether the breach was excusable under the circumstances, which is a separate determination."**  

  This prevents exoneration by:  
  1. Explicitly affirming the breach.  
  2. Separating factual causation from accountability.  
  3. Redirecting focus to *system* failures (e.g., no backup escalation pathway).  

  The procedure forces honesty: we cannot call something "causal" to condemn it when it didn’t change the outcome. But we *can* still condemn the breach and fix the system—without overloading "causation."  

  ---  
  This framework respects time constraints, uses accessible concepts, and disentangles facts from values. It will reduce panel arguments by replacing intuition with clear thresholds. For full implementation, train panels on counterfactual reasoning using historical cases.
