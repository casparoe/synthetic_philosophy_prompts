prompt: |-
  I write about science and ideas for a national magazine — mostly biology, medicine, and psychology — and I keep running into the same problem at the level of a single sentence. Papers and university press offices arrive announcing that some category is real: a new species carved out of a well-known one, a new cell type, a newly identified subtype of a familiar diagnosis, a distinct kind of memory. Just as often they arrive announcing the reverse: that a category everyone has been using does not correspond to anything. My copy has to choose between saying that researchers have discovered a new kind of thing and saying that they have proposed a new way of grouping things, and that choice is not cosmetic. Readers take discovery language as a claim about the world, the scientists care how they are portrayed, and when the category is a diagnosis there are advocacy groups for whom the difference is consequential. I need a procedure, not a theory.

  What I have been using is a rough two-part test I made up. First, an export test: does the proposed category license predictions that were not built into its definition — about a new sample, in another lab, in a related species? Second, a re-identification test: when the same domain is examined by an independent method that does not share the assumptions of the first one, does roughly the same grouping fall out again? I have a feeling these two tests are doing different work, that they track things philosophers distinguish — inductive usefulness, stability across methods, causal structure, explanatory depth — and that some of those come apart in cases I actually cover. I also suspect I have quietly assumed that discovery language is only earned by one style of category, and that I have no way to handle categories that look real at one resolution and dissolve at another.

  So here is what I would like. Give me a decision procedure my desk can run in about ten minutes, from a paper abstract, a methods paragraph, a press release, and usually one short call with an outside scientist who is not on the author list. It should tell me, in order: the questions to ask; what counts as a sufficient answer to each; where the procedure stops with write this as a proposal rather than a discovery; where it stops with write this as a discovery; and where it has to hand the decision back to me because the remaining question is one of values rather than evidence. It should tell me what to do when I cannot get the information a step calls for — what the default is, and whether that default is conservative or merely convenient. It needs to distinguish at least three outcomes that I think I currently conflate: a new label for something the field was already tracking, a recut of an old domain into different groupings, and a claim about underlying causal structure. Assume I already know how to ask whether a finding replicates: what I need is guidance on what kind of thing has been found, conditional on its holding up.

  Then run it. Case one: a genomic clustering study splits a familiar, well-studied organism into five species, and taxonomists quoted elsewhere are openly divided, some treating species as segments of lineages and others requiring something like reproductive isolation. Case two — the one I expect to like least — a team reports a biological subtype of a common psychiatric diagnosis, defined by clustering inflammatory markers in a few thousand patients, and a patient-advocacy foundation is already campaigning for it to be recognized as a disease. Case three, briefly: a review argues that a category in my own beat, long treated as a single thing, does not pick out any one natural grouping, and I have to decide whether scientists say it does not exist is ever the sentence to print. For case two in particular, tell me what the procedure says even though I will not enjoy it, and how to write the sentence so that it is honest without being dismissive.

  Finally, two constraints on how you present this. Be explicit about which claims behind the procedure are settled among people who work on this and which are live disputes — whether kinds must be mind-independent, whether there can be several equally legitimate ways of cutting the same domain, whether categories in the human sciences can be kinds at all — and do not present a contested position as the consensus. And say plainly where my two tests survive, where they are confused, and where the procedure itself will misfire. I am not asking for citations or further reading; I want the reasoning and the procedure. Please answer in American English, in roughly 1,200 words.
reasoning: |-
  Okay, the user is a science writer dealing with a nuanced problem: how to accurately report when research claims to discover a new category (like a species or disease subtype) versus proposing a conceptual grouping. They need a practical decision procedure—not theoretical musings—to handle this in tight deadlines. Their existing two-part test (export and re-identification) seems insufficient for cases where categories blur at different resolutions or involve advocacy pressures.  

  First, I’ll assess their core friction points:  
  - **Epistemic weight**: "Discovered" implies ontological reality; "proposed" feels provisional. But science often operates in grays (e.g., Pluto’s planetary status).  
  - **Stakeholder tensions**: Scientists want legitimacy; patients crave validation; readers need clarity. The writer navigates this minefield.  
  - **Limits of their test**: Export/re-id tests ignore scale-dependency (e.g., a "cell type" may vanish under electron microscopy) and conflate predictive utility with mind-independent existence.  

  The procedure must:  
  1. **Fit tight constraints**: 10 mins, limited sources (abstract, call with independent scientist).  
  2. **Output clear language cues**: "Discovered" vs. "proposed" vs. "redefined."  
  3. **Handle three thorny cases**: Taxonomic splits (lineages vs. reproductive isolation), psychiatric subtypes (biology + advocacy), and category eliminations ("this doesn’t exist").  

  Philosophical landmines to flag:  
  - **Realism vs. antirealism**: Are categories "out there" or useful fictions? (Settled: science assumes realism but debates *which* categories are real.)  
  - **Multiple legitimate groupings**: Yes (e.g., classifying plants by genetics or ecology). Consensus: categories aren’t "discovered" if equally valid alternatives exist.  
  - **Human sciences**: Can depression subtypes be natural kinds? Hot dispute—proceed cautiously.  

  Their export/re-id tests aren’t useless but need refinement:  
  - **Export test** survives → Predictive power matters.  
  - **Re-id test** confused → Stability across methods doesn’t guarantee mind-independence (e.g., DSM diagnoses cluster via symptoms *and* biomarkers—but that’s correlation, not causation).  

  **Decision Procedure Blueprint**  
  1. **Question 1: "Is this a relabeling?"**  
     - *Ask*: Does the new label map neatly to an existing concept (e.g., "working memory" vs. "short-term memory")?  
     - *Sufficiency*: If authors admit equivalence (e.g., "previously called X"). Default conservative: assume proposal unless proven.  
     - *Outcome*: Relabeling → "proposed term Y for X."  

  2. **Question 2: "Is this a recut?"**  
     - *Ask*: Does it redefine boundaries (e.g., splitting one species into five)? Check if old groupings dissolve.  
     - *Sufficiency*: Independent expert confirms novelty. Default: "suggested a revised framework."  

  3. **Question 3: "Is there causal grounding?"**  
     - *Ask*: Does the category explain *why* things happen (e.g., "this cell type secretes unique proteins causing disease")?  
     - *Sufficiency*: Mechanism proposed/tested. Default: "identified a potential subtype." Stops here if absent.  

  4. **Question 4: "Scale/resolution robustness?"**  
     - *Ask*: Does it hold under different methods/scales? (Their re-id test, but with caveats.)  
     - *Sufficiency*: Multi-method consensus. Default: defer to "proposal."  

  5. **Question 5: "Values vs. evidence?"**  
     - *Handoff trigger*: When stakes are high (e.g., diagnoses) but evidence is mixed. Outcome: "scientists debate whether..."  

  **Applying to Cases**  
  - **Case 1 (species split)**: Recut (Q2). No causal claim (Q3). Taxonomists divided → values handoff (Q5). Write: "proposed reclassification."  
  - **Case 2 (psychiatric subtype)**: Recut (Q2) with causal *attempt* (inflammation → symptoms). But advocacy pressure → values handoff (Q5). Write: "linked a biomarker cluster to symptoms"—neutral framing.  
  - **Case 3 (category elimination)**: Q1-Q3 fail → "evidence challenges the coherence of X."  

  **Where Procedure Misfires**  
  - When methods are too niche for multi-lab validation.  
  - When "causal mechanism" is stretched (e.g., vague neuroimaging correlates).  

  **User’s Test Survival Guide**  
  - Export test → Q3 (causal grounding).  
  - Re-id test → Q4 (robustness), but with less weight.  

  This balances rigor with pragmatism—giving the writer defensible phrasing without pretending science is black-and-white.
answer: |-
  Here’s a step-by-step decision procedure designed for your constraints. It runs in five sequential questions, uses accessible sources (paper, press release, one external scientist call), and explicitly flags when to stop for values-based decisions. Your two tests are integrated but refined to address their limitations (explained post-procedure). Philosophical disputes are noted where relevant.

  ---

  ### **Decision Procedure: "Discovery" vs. "Proposal" Language**
  **Inputs Required:** Paper abstract, methods paragraph, press release, 5-min call with external scientist (not an author).  
  **Outputs:** Language recommendation (discovery/proposal/handoff) + category type (relabel/recut/causal claim).

  #### **Step 1: Is this a new label for an existing grouping?**  
     - **Ask the external scientist:** *"Does this category map directly to something the field already tracks under a different name or description?"*  
     - **Sufficient answer:** "Yes, it’s just rebranding [old concept X]" or "No, it’s novel."  
     - **Stop here if YES → Outcome:** "Proposed a new term for [existing phenomenon]."  
     - **Default if unclear:** Conservative. Assume "proposal" unless evidence confirms otherwise.  
     - *Why?* Prevents hype-driven relabeling (e.g., "executive function" repackaged as "cognitive control").

  #### **Step 2: Is this a recut of an existing domain?**  
     - **Ask:** *"Does this split/merge prior categories without claiming new causal structure?"* Check methods for clustering techniques (e.g., genomics, symptom clusters) lacking mechanistic hypotheses.  
     - **Sufficient answer:** External scientist confirms: "It redefines boundaries but doesn’t explain *why*."  
     - **Stop here if YES → Outcome:** "Proposed a new framework for grouping [phenomenon]."  
     - **Default if unclear:** Convenient. Use "proposal" if methods are purely correlational (e.g., unsupervised ML).  
     - *Why?* Recuts are analytical choices, not discoveries (e.g., splitting "anxiety" into subtypes by survey data).

  #### **Step 3: Does it license predictions beyond its definition? (Your Export Test)**  
     - **Ask:** *"Can this category predict outcomes in novel contexts (new species, labs, populations) unrelated to its initial definition?"*  
     - **Sources:** Press release/abstract for claims; external scientist for plausibility.  
     - **Sufficient answer:** "Yes, it predicts [specific outcome] in [unseen context]" (e.g., a cell type predicts drug response across tissues).  
     - **Stop here if NO → Outcome:** "Proposed a category."  
     - **Default if unclear:** Conservative. Assume "proposal" if no evidence of external validation.  
     - *Philosophical note:* Predictive power suggests inductive usefulness (settled as necessary for "robust" categories), but not necessarily mind-independence (disputed).

  #### **Step 4: Is it stable across methods? (Your Re-Identification Test, Revised)**  
     - **Ask:** *"Would independent methods (e.g., genetics + physiology, not just variations of the same assay) recover similar groupings?"*  
     - **Sources:** Methods paragraph (look for multi-method validation); external scientist: *"Is there consensus that different tools would see this?"*  
     - **Sufficient answer:** Paper uses ≥2 orthogonal methods (e.g., RNA-seq + imaging), or scientist confirms strong prior evidence.  
     - **Stop here if NO → Outcome:** "Proposed a category."  
     - **Stop here if YES → Outcome:** "Discovered a [phenomenon]."  
     - **Default if unclear:** Convenient. Use "discovered" only if multi-method support is explicit.  
     - *Philosophical note:* Stability suggests objectivity (settled as important), but multiple legitimate groupings may exist (e.g., species defined by genetics vs. ecology). This doesn’t negate discovery if all methods converge.

  #### **Step 5: Is the claim about causal structure?**  
     - **Ask:** *"Does the paper argue this category explains *why* things happen (e.g., a mechanism), not just *how* things correlate?"*  
     - **Sources:** Abstract for words like "mechanism," "causal," "driver"; methods for experiments (e.g., perturbations).  
     - **Sufficient answer:** Mechanistic evidence (e.g., depleting a cell type alters disease) OR explicit causal modeling.  
     - **Outcome if YES:** "Discovered a [causal entity/process]."  
     - **Handoff to values if:** Evidence is mixed AND stakes are high (e.g., diagnoses, conservation).  
     - *Philosophical dispute:* Whether kinds require causal essence (e.g., realism vs. pragmatism). Procedure defaults to scientific consensus (causal claims strengthen discovery language).

  ---

  ### **Where Your Tests Survive, Confuse, or Misfire**
  - **Export test (Step 3):** Survives as a necessity. Predictive power is non-negotiable for "discovery."  
  - **Re-id test (Step 4):** Confused stability with mind-independence. Revised to require orthogonal methods, acknowledging that stability doesn’t preclude multiple valid groupings.  
  - **Misfires when:**  
    - Categories are scale-dependent (e.g., "cell type" dissolves in single-cell data). Procedure defaults to "proposal" if stability (Step 4) fails.  
    - Human sciences: Antirealists argue categories (e.g., psychiatric diagnoses) can’t be "discovered" (live dispute). Procedure uses Steps 3–5 but flags handoffs.  

  ---

  ### **Running the Cases**
  **Case 1: Genomic clustering splits species**  
  - Step 1: Not a relabel (new groupings).  
  - Step 2: Recut (redefines species boundaries).  
  - Step 3: Exports? Unclear (paper may not predict traits in related species). Default: "proposal."  
  - Step 4: Stable? Taxonomists divided → no consensus → "proposed a reclassification."  
  - Step 5: No causal claim → stop.  
  - **Language:** "Researchers **proposed reclassifying** [organism] into five species based on genomic data, though taxonomists debate the criteria."  
  - *Why?* Stability test fails; dispute is values-based (species concept definitions).  

  **Case 2: Psychiatric subtype with inflammatory markers**  
  - Step 1: Not a relabel (new biomarker cluster).  
  - Step 2: Recut of diagnosis (splits by biomarkers).  
  - Step 3: Exports? Maybe (e.g., predicts treatment response). Default: "proposal" if unproven.  
  - Step 4: Stable? Unlikely (one method; no imaging/behavioral validation). Default: "proposal."  
  - Step 5: Causal? Claimed (inflammation → symptoms), but methods correlational → handoff to values.  
  - **Language:** "Scientists **identified a potential subtype** of [diagnosis] linked to inflammation, though its clinical validity requires further testing."  
  - *Why?* Avoids overclaiming biology while acknowledging findings. Advocacy pressure triggers values handoff; note "potential" and "requires further testing."  

  **Case 3: Review argues a category doesn’t exist**  
  - Apply Steps 1–5 to the *original category*:  
    - If it fails predictive power (Step 3) or stability (Step 4), "scientists argue [category] **may not correspond to a coherent phenomenon**."  
    - If dispute is values-based (e.g., "species" vs. "lineages"), report the debate.  
  - **Example:** "A review concludes that [category] **lacks consistent biological correlates**, challenging its usefulness."  

  ---

  ### **Philosophical Disclosures (Per Your Request)**  
  - **Mind-independence:** Settled that science aims for it, but disputed whether achieved (e.g., social kinds). Procedure treats it as aspirational.  
  - **Multiple legitimate groupings:** Consensus: Yes (e.g., periodic table vs. astrophysical element classifications). Procedure allows "discovery" only if groupings converge across methods.  
  - **Human sciences categories:** Live dispute (e.g., can depression be a "natural kind"?). Procedure permits "discovery" language only if causal (Step 5) and stable (Step 4).  

  ### **Procedure Limits**  
  - **Misfires if:** External scientist is biased; methods are too new for validation. Defaults protect against overstatement.  
  - **Your role:** When procedure hands off (high-stakes values disputes), report neutrally: "Scientists disagree whether X reflects biology or semantics."  

  This workflow prioritizes evidence over semantics, uses your tests strategically, and forces explicit handoffs where values dominate. Write "discovery" only when predictive power, stability, and/or causality are demonstrable; else, "proposal" is the honest, non-dismissive fallback.
