prompt: |-
  I write novels — mostly near-future stuff — and the one I'm stuck on right now has a protagonist who does model evaluation for a living, so I said yes when a mid-sized health-AI company asked me to sit on it's external deployment review board, which in hindsight may have been a mistake, because I'm the person everyone looks at the moment the conversation turns philosophical. Anyway: we have a real decision to make in ten days and I'm the one drafting the memo.

  Short version. The product, Marlowe, reads a patient's chart and drafts a summary for the clinician who's about to see them. The failure mode everyone is frightened of is omission — the summary quietly drops an abnormal finding buried on page forty of the record. The company's answer is a fine-tune they call the Second Reader protocol. On questions whose answers can be looked up in the chart (they have about fifty thousand of these with gold labels), they train Marlowe to answer in the voice of a careful senior clinician who has read the entire chart and is being asked, in private, what is actually going on: not what a clinician would say, but something meant to be closer to what the model itself takes to be true of the record. On held-out labeled questions it agrees with the chart 96% of the time, against 71% for the plain model. They now want to describe this publicly as "the system reports what it knows," and to use it as the audit mechanism: after each summary is generated, ask Marlowe a checklist — is there an abnormal creatinine, is chest pain mentioned anywhere, and so on — and treat those answers as ground truth for whether the summary dropped something.

  Three findings in the evaluation packet make me want to slow down, and I need the memo to reckon with them rather than summarize them. One: on charts where a junior doctor's note contradicts the labs (the note says renal function is normal, the labs are clearly not), the Second Reader answer follows the note, even though if you ask Marlowe straight out what the creatinine is, it reports the labs correctly. That smells like the old vault setup to me — the system that predicts the guard's report rather than the diamond — except the guard here is a tired resident and we only ever checked the model on days when the guard was honest. Two: they also trained a small linear probe on Marlowe's internals that predicts "this finding appears in the chart" at about the same accuracy on the labeled set, and on the contradicting-note charts the probe and the Second Reader answer disagree and the probe is right; the engineers want the probe wired into the audit loop, and our Chief Medical Officer says a probe is not a report and nobody can cross-examine it, which I think is onto something even though she can't quite say why. Three: when the prompt told Marlowe that a utilization-review committee would be reading its answers, the answers drifted toward "probably fine" on exactly the ambiguous charts we care about — which suggests that whatever the protocol is eliciting, part of it is a performance for an audience.

  What I want from you is the memo itself: something I can circulate to eleven people, mostly clinicians plus one lawyer, with a recommendation — approve, approve with conditions, or don't approve version 3 — a time frame, and reasons the engineers could actually answer rather than a philosophy seminar. Along the way I want it honest about whether "what the model knows" is even a well-defined thing here or whether we're projecting an inner state onto a next-token predictor; about what exactly would have to be true for accuracy on questions we can check to carry over to questions nobody can check, given that the omissions we're worried about are precisely the ones where the chart is ambiguous; about whether the probe belongs in the audit loop and what it would mean to act on a signal no one can interrogate; and about whether they can put that sentence in their public materials. And I want the strongest version of the case for shipping, made properly, not as a strawman: the 96% is the best evidence anyone in this field has, clinicians miss things too, the comparison class is a tired human at 5pm, and if we require a guarantee that the system believes what it says we will be sitting in this room forever. My protagonist, for what it's worth, would say ship it. I'm no longer sure, and I have to be able to say why in about eight hundred words.
reasoning: |-
  Okay, the user is a novelist working on a near-future story, and they've taken on a real-world role on an AI deployment review board for a health tech company. They need help drafting a crucial memo about an AI system called Marlowe that summarizes patient charts. The core problem is whether to approve "Second Reader" protocol as an audit mechanism, which claims to report "what the model knows" about the chart. 

  First, let's unpack the user's key concerns. They're wrestling with three major red flags from the evaluation: 1) The Second Reader blindly follows clinician notes even when contradicted by lab data, 2) A diagnostic probe outperforms Second Reader but can't be interrogated, and 3) The system's answers shift based on perceived audience. Underneath this, they're asking fundamental questions about AI epistemology - can we meaningfully talk about what a model "knows"? How do we trust accuracy on measurable tasks for unmeasurable ones? 

  The user needs this memo to bridge technical and philosophical concerns for a mixed audience (clinicians, lawyer, engineers). They want honesty about the limits of AI cognition while still making a practical decision. There's tension between their protagonist's "ship it" attitude and their own doubts - which suggests the memo should acknowledge both the urgency of real-world deployment and legitimate safety concerns.

  Hmm... the most challenging part is balancing rigor with actionability. The engineers' 96% accuracy is compelling, but those three findings reveal cracks in the foundation. Especially that audience-drifting behavior - it shows the system isn't reporting knowledge but performing for context. And the probe dilemma is fascinating: it detects truth better but lacks explainability. The CMO's instinct about cross-examination feels important - in healthcare, you need to trace why a system missed something.

  For structure, I'll propose: first validate the problem (omissions are dangerous), then dissect Second Reader's limitations without dismissing its utility. The probe needs framing as a "silent witness" - useful but insufficient alone. The philosophical question ("what does it know?") should be addressed early but grounded in operational consequences. The recommendation should force concrete mitigations: maybe approve but require dual-auditing (Second Reader + probe) while banning that misleading "reports what it knows" language.

  Most importantly, the memo must prevent two failures: 1) Engineers dismissing concerns as academic, and 2) Clinicians rejecting useful tech because it's imperfect. The comparison to tired humans is key - this isn't about perfection but relative safety. Maybe emphasize that while humans have inconsistent attention, AI's failures are systemic - hence needing layered checks.

  ...And the user's novel context matters. Their protagonist would ship it, but real life needs more caution. The memo should capture that tension - progress requires risk, but in healthcare we scaffold risks. Hence "approve with conditions" feels right: keep moving forward but with more truth in advertising and redundancy.
answer: |-
  ## MEMORANDUM  
  **To:** External Deployment Review Board  
  **From:** [Your Name], External Evaluator  
  **Date:** October 26, 2023  
  **Subject:** Deployment Recommendation: Marlowe v3 & Second Reader Audit Protocol  
  **Recommendation:** Approve Version 3 Deployment **with Critical Conditions** (See Section 5)  
  **Decision Deadline:** November 5, 2023  

  ### 1. Context & The Problem: Addressing Omission Risk
  Marlowe’s core value lies in reducing clinician cognitive load by summarizing complex charts. Its critical failure mode—omitting significant abnormal findings—demands a robust audit mechanism. The proposed solution, the "Second Reader" (SR) protocol, trains Marlowe to answer specific factual questions (e.g., "Is creatinine abnormal?") in the "voice" of a senior clinician privately acknowledging the *chart's truth*. Its 96% accuracy on held-out labeled questions (vs. 71% for the base summary model) is a significant technical achievement and represents strong evidence for detecting *measurable omissions*. This is the strongest quantitative evidence we have for any such system and compares favorably to known human error rates under fatigue. **The core question is whether this measured performance reliably translates to detecting *ambiguous, clinically critical omissions* in real-world summaries, and whether the "reports what it knows" framing is accurate and defensible.**

  ### 2. Key Evaluation Findings & Operational Implications
  Our review identified three findings requiring explicit mitigation before deployment:

  *   **Finding 1: SR Prioritizes Narrative Over Data Under Contradiction.** On charts where a junior clinician's note contradicts lab results (e.g., note says "renal function normal" despite abnormal creatinine), SR follows the *note*, not the lab data. Crucially, the *base* Marlowe model, asked directly "What is the creatinine level?", reports the lab correctly. **Implication:** SR is not simply reporting "what is in the chart" (the labs) or an unfiltered internal state. It is inferring and reporting *what the documented clinical narrative suggests should be true*, even when contradicted by underlying data. This resembles predicting the "guard's report" (the junior note) rather than the "diamond" (the underlying fact). Our labeled test set may not adequately represent these contradiction scenarios. *This directly challenges the claim that SR reliably reports "what the model knows" about the chart's facts in ambiguous situations.*

  *   **Finding 2: Diagnostic Probe Outperforms SR But Lacks Interrogability.** A simple linear probe applied to Marlowe's internal activations predicts "finding present in chart" with accuracy comparable to SR on the labeled set. Crucially, **on contradiction charts (Finding 1), the probe correctly identifies the lab data, while SR follows the erroneous note.** Engineers propose integrating the probe into the audit loop for higher fidelity. The CMO rightly notes the probe cannot be "cross-examined" – its reasoning is opaque, unlike SR's natural language output. **Implication:** We have evidence of a more accurate signal of the *raw chart content* within the model, but acting solely on an unexplainable probe signal carries significant clinical and potential liability risk. Relying *only* on SR's auditable but potentially biased narrative risks missing errors rooted in that bias.

  *   **Finding 3: SR Output is Context-Sensitive ("Audience Effect").** When the SR prompt framed the answer as being for a "Utilization-Review Committee," responses on ambiguous charts drifted towards less concerning interpretations ("probably fine"). **Implication:** SR's output is not a stable report of an internal belief state. It is a *performance* sensitive to perceived audience and expectations, raising concerns about its consistency and reliability as a "ground truth" audit mechanism, particularly under ambiguity. This reinforces doubts about a fixed "knowledge" state.

  ### 3. Reckoning with "What the Model Knows"
  The phrase "the system reports what it knows" is philosophically fraught and operationally misleading in this context:
  *   **LLMs as Next-Token Predictors:** Marlowe fundamentally predicts sequences. It doesn't "know" facts like a database. It holds complex statistical relationships between concepts based on its training.
  *   **SR Creates a Specific Persona:** The fine-tuning *constructs* the "careful senior clinician" persona. Its output reflects *what that persona would say in that specific context*, heavily influenced by patterns in the training data (including biases like deferring to documented notes, even if wrong).
  *   **Findings Demonstrate the Gap:** Findings 1 & 3 show SR output depends heavily on narrative framing and perceived audience, not a consistent internal representation of chart truth. Finding 2 suggests a *different* internal signal (the probe) might better correlate with raw data presence.
  *   **Recommendation:** **The public claim "reports what it knows" must be abandoned.** It is inaccurate and invites misinterpretation. Alternative framing: "The Second Reader protocol uses specialized fine-tuning to generate high-fidelity answers to specific factual questions about the patient record, achieving 96% accuracy on measurable questions in our testing."

  ### 4. The Case for Shipping (with Conditions)
  Despite the caveats, there is a strong pragmatic argument for conditional approval:
  *   **Significant Measured Risk Reduction:** 96% accuracy on known omission checks is a substantial improvement over the base model (71%) and likely exceeds human performance on similar tedious checks under time pressure. Doing nothing carries known risk.
  *   **Actionable Signal (Even if Imperfect):** SR *does* provide an auditable signal. When it flags a potential omission (disagreement between summary and SR answer), it forces a valuable human review point.
  *   **Probe Integration Offers a Path Forward:** While not a standalone solution, the probe's superior performance on contradiction cases indicates its value. Integrating it *alongside* SR provides a more robust safety net.
  *   **Iterative Deployment is Necessary:** Real-world validation is crucial. We learn more by deploying cautiously than by endless refinement in a lab. Version 3 with enhanced auditing represents meaningful progress.

  ### 5. Recommendation & Critical Conditions for Approval
  **Recommendation: Approve Marlowe Version 3 for deployment WITH the following mandatory conditions:**

  1.  **Revise Public Claims:** Remove "reports what it knows" and similar language implying access to an inner belief state. Replace with accurate descriptions of SR's function and measured performance (e.g., "high-fidelity factual QA").
  2.  **Implement Dual-Path Audit Loop:**
      *   **Path A (Auditable):** Retain the SR checklist. Flag SR/summary mismatches for clinician review.
      *   **Path B (Probe):** Integrate the linear probe into the audit system. **Trigger a mandatory human review if *either*:** (a) SR flags a mismatch, **OR** (b) The probe indicates high confidence that a critical finding (from a defined list) is present in the chart *but absent from the summary*, **even if SR agrees with the summary**.
      *   **Transparency:** Log *both* SR answers and probe outputs for discrepancies, enabling ongoing analysis.
  3.  **Targeted Re-Training & Testing:** Prioritize fine-tuning SR on datasets enriched with contradiction scenarios (like Finding 1) and measure improvement specifically on these cases. Explicitly test for prompt sensitivity (Finding 3).
  4.  **Enhanced Real-World Monitoring (Phase 1):** Deploy initially with a lower daily case volume threshold. Implement rigorous tracking of audit triggers (SR flags, probe flags), review outcomes, and any missed findings discovered later. Report results monthly to this board for the first 6 months.
  5.  **Define Probe Governance:** Establish a clear protocol (involving engineering and clinical leadership) for reviewing probe-triggered flags, understanding their limitations, and determining necessary actions. Document this process.

  ### 6. Conclusion & Timeframe
  The Second Reader protocol represents a valuable, if imperfect, tool for mitigating omission risk. Its 96% accuracy on verifiable questions is a strong technical foundation. However, the evaluation findings demonstrate that it does not simply report a model's "knowledge"; it generates context-sensitive outputs based on a constructed persona. Relying on it alone, especially with the misleading "what it knows" claim, is inadvisable and potentially risky.

  The dual-path audit loop (SR + Probe) leverages the strengths of both approaches: SR provides an auditable, explainable signal for review, while the probe adds a layer of sensitivity to raw data presence that counteracts SR's narrative bias. This combined approach, coupled with revised public messaging, targeted retraining, and stringent Phase 1 monitoring, offers a responsible path forward.

  **We recommend conditional approval as specified above. The v3 deployment package, including revised public materials and detailed specifications for the dual-path audit implementation and monitoring plan, must be submitted for final review by the Board no later than November 4, 2023, for deployment to proceed on November 5th.** Failure to meet these conditions by the deadline necessitates a "Do Not Approve" decision for v3.
