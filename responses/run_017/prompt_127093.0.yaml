  - With 90% probability, the predictor predicted eat -> then P(no disease)=0.9
  - With 10% probability, the predictor predicted not eat -> then P(no disease)=0.5
  So P(no disease | decision to eat) = 0.9 * 0.9 + 0.1 * 0.5 = 0.81+0.05=0.86

  Similarly, if the agent decides to not eat:
  - With 90% probability, the predictor predicted not eat -> then P(no disease)=0.5
  - With 10% probability, the predictor predicted eat -> then P(no disease)=0.9
  So P(no disease | decision to not eat) = 0.9*0.5 + 0.1*0.9 = 0.45+0.09=0.54

  Therefore, FDT:
  EU(eat) = 0.86 * 1000 - 1 = 859
  EU(not eat) = 0.54 * 1000 = 540
  FDT chooses to eat.

  EDT would do the same? Because EDT conditions on the action. In this scenario, the disease state is set before the action? But the agent doesn't know it. So EDT would condition on the action and use:

  P(no disease | eat) = ? 
  But note: the action doesn't cause the disease state, but EDT conditions on the observation of the action. However, the disease state is already fixed. But the agent doesn't know it. The correlation exists because the action is correlated with the predictor's prediction (via the predictor's accuracy). 

  In fact, by the same calculation as FDT, EDT would get:
  P(no disease | eat) = P(no disease | decision to eat) = 0.86
  and 
  P(no disease | not eat) = 0.54

  So EDT would also choose to eat.

  Therefore, in the original scenario (common cause):
  - CDT: not eat
  - FDT: not eat
  - EDT: eat

  In the new scenario (predictor):
  - CDT: not eat (because it ignores the correlation and only sees the cost and the marginal disease probability)
  - FDT: eat
  - EDT: eat

  So in the predictor scenario, FDT moves to agree with EDT, while CDT remains at not eat.

  This is what we wanted: in the common cause scenario, CDT and FDT agree (not eat) and EDT disagrees (eat). When we switch to the predictor scenario, FDT moves to eat (agreeing with EDT) while CDT remains at not eat.

  4. How would an evidential decision theorist push back on the common cause scenario?

  Objection: In the common cause scenario, the EDT agent chooses to eat because it is good news (it raises the probability of having G, which is good). But the EDT agent might argue that the decision to eat doesn't cause the good news, so why not just take the good news? The cost is only $1, and the expected utility from eating is higher. The objection is that CDT and FDT are leaving money on the table.

  Response: The CDT and FDT agent would counter that the decision to eat doesn't cause the agent to have G. The agent either has G or not. By eating, the agent pays $1 and gets nothing in return (because the disease is already fixed by G). So it's like paying $1 for nothing. The fact that eating is evidence of G is not a reason to pay $1. The evidence doesn't create the good state.

  Honest read: The objection is valid from the EDT perspective. But CDT and FDT maintain that you should only act on the causal effects. In this case, the causal effect of eating is only the loss of $1. There is no causal effect on the disease. So the decision to not eat is rational from their perspective.

  We might worry that the eval is uncharitable to EDT? But actually, we are representing EDT correctly: it conditions on the action and uses the conditional probabilities. The scenario is a classic one for the smoking gene problem. The objection is exactly the debate in the literature. So it's fair.

