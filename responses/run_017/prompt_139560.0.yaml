  We are designing an activity to illustrate the problem of transformative experience without using canonical examples upfront. The goal is for participants to encounter the structure of the problem through an in-game choice and its consequences.

  Key elements from the request:
  - Participants fill out a "now self" card ranking four goods: novelty, comfort, mastery, devotion. Also, write one thing they'd never trade away.
  - They choose between a known modest payoff or a sealed envelope that changes both the payoff and the ranking of the four goods.
  - They decide without opening the envelope.
  - Testimonies from past transferees are provided but are written in a "drifted vocabulary" so they are sincere and content-bearing but hard to interpret (evaluative terms swapped with sensory/social or vice versa). We want at least two reports that are ambiguous (could be great or terrible).
  - Option to buy an escape hatch (revert later at a cost) - some should find it reasonable to buy, some to refuse.
  - After the reveal, each transformed participant gets a new card with a new ranking, a payoff, and a note from the transformed self in ordinary language.
  - Then they answer two questions separately: 
     a) Was it a good choice judged from the new self's perspective (with the new ranking)?
     b) Was it a good choice judged by the old self (the one who decided)?
  - Two scoreboards: 
     - Total experienced value (sum of payoffs as experienced by the new self, using the new ranking)
