prompt: |-
  Two people in the reading group I run with the ML folks got stuck on this after a talk last week and asked me to referee, which I now wish I hadn't of. The case: a small image classifier; a linear probe on a middle layer predicts "dog in the image" at 98%; that same direction also fires on wolves photographed indoors; and when you ablate it, behaviour barely moves, because a second, strongly correlated direction in the same layer covers for it.

  (1) Mara: that's a dog representation, full stop — representation only requires the feature to be recoverable from the state of the system, and 98% is about as good as recoverability gets; the wolf case is misrepresentation, which is the mark of the intentional, not evidence against it. (2) Dev: "recoverable by a probe I trained" isn't "represented by the model" — the model has to use it. Ablate it and nothing changes, so what you're reporting is a correlation in the world, not a content-bearing state in the network. (3) Mara: the causal test proves too much — by that standard my own visual system stops representing dogs whenever I identify one by silhouette rather than fur, since the fur-encoding isn't doing the work either; redundancy is just how distributed systems store things, and a backup copy doesn't make the original idle. (4) Dev: then the notion has no teeth — if a redundant copy always covers for you, no ablated direction is ever doing distinctive work, so nothing can ever fail to be a representation, and your criterion collapses into "any correlation that's linearly decodable." (5) Mara: not any correlation — ones that survive distribution shift and that the network recomputes for itself; the copy exists because training pressure selected for it, which is why it tracks dog-ness rather than background texture. (6) Dev: that puts all the weight on what training selected for, which is a story about the optimiser and the dataset, not about what the network's states mean.

  Can you go through it move by move and say who's right about what — not just who wins overall — and what, if anything, both of them are missing? I couldn't tell them, and I'd like to.
reasoning: |-
  Okay, let me try to unpack this debate between Mara and Dev. They're arguing about whether a certain direction in a neural network layer represents "dog" or not. The key points are:

  - A linear probe on a middle layer predicts "dog" with 98% accuracy.
  - This same direction activates for wolves indoors.
  - When ablated, another correlated direction compensates, so behavior doesn't change.

  First, I need to understand Mara's position. She's saying that because the feature is linearly decodable with high accuracy, it's a representation of "dog." She argues that the wolf case is misrepresentation, which actually supports the idea of intentionality. She also brings up redundancy, comparing it to how human vision might use different cues like silhouette or fur to recognize dogs. Her point is that just because there's a backup, it doesn't make the original representation non-existent.

  Then there's Dev. He's pushing back, saying that for something to be a representation, the model must actually use it. Since ablation doesn't change behavior, the network isn't using that specific direction—it's just correlated with the actual feature used elsewhere. He's worried that if redundancy always allows recovery, then any decodable correlation could be called a representation, which makes the concept meaningless. He also emphasizes that training pressure points to the optimizer's role, not inherent meaning in the network.

  Looking at their arguments step by step:

  1. Mara's initial claim focuses on recoverability. The 98% probe accuracy suggests that the information is present in the activations. Dev counters that linear recoverability doesn't equal representation because the model might not be using it. 

  2. The ablation test is crucial here. Dev sees the lack of performance drop as evidence that the direction isn't necessary. Mara argues that redundancy doesn't invalidate representation—it's a common feature of robust systems. Her human vision analogy is strong; humans have redundant pathways too.

  3. Dev's concern about collapsing criteria is valid. If any decodable feature counts as representation, the term becomes too broad. But Mara specifies conditions: survival under distribution shift and network recomputation. She links this to training pressure selecting for dog-ness, not incidental correlations.

  4. Dev's last point shifts to philosophy—meaning comes from use, not just correlation. He's saying that attributing representation based on training data ignores how the network actually processes information. This touches on the debate between internalist and externalist views in philosophy of mind.

  Where they might both be missing things:

  - Mara might be underestimating how probe training can create illusions. A probe could latch onto correlated but non-causal features. The wolf issue might not be misrepresentation but an artifact of dataset biases (e.g., wolves only indoors).

  - Dev might be too strict with his causal requirement. In distributed systems, representations are often overlapping and redundant. Insisting on unique causal roles could overlook population coding.

  - Both could consider the layer's role. Is this layer primarily processing shapes? Textures? The "dog" representation might be emergent from lower-level features rather than a dedicated symbol.

  - There's also the probe itself—linear probes might simplify the actual representation. The network could encode dog-ness non-linearly across multiple directions.

  Their debate mirrors classic discussions in cognitive science. Think of Marr's levels: the computational "what" vs. algorithmic "how." Mara is focused on the information being present (computational), while Dev cares about the mechanism (algorithmic). Both perspectives are valid but incomplete without the other.

  Also, the intentional stance comes into play. Dennett would say attributing representation is pragmatic—it's about prediction. From that view, if the probe predicts dog accurately, it's useful to call it a representation, even if not strictly causal.

  But Dev has a point about emptiness—if any correlation counts, representation loses explanatory power. Maybe the solution is to distinguish between "potential representation" (decodable) and "active representation" (causally used). In this case, the ablated direction is potential, while its backup is active.

  The training pressure aspect is tricky. Mara links representation to what the network was selected for, which is an evolutionary argument. But as Dev notes, that's external—it doesn't necessarily reflect the current network's state. However, in ML, training is how networks acquire functions, so it's relevant.

  For a referee call: neither is entirely wrong. The direction does carry information about dogs (Mara), but it's not essential for the network's function (Dev). They're defining "representation" differently—correlational vs. causal-functional. Clarifying the definition would help resolve the stalemate.
answer: |-
  Let's break down the debate move-by-move, identifying valid points, oversights, and philosophical tensions. Neither party is wholly right or wrong—they're operating from different frameworks for "representation."

  ### **(1) Mara's Opening Claim**  
  *Position:* "Dog" is represented because the feature is linearly recoverable with 98% accuracy. Wolves indoors are *mis*representation.  
  **What's Valid:**  
  - High probe accuracy *does* indicate the *information* about "dog" exists in the activation space.  
  - Misrepresentation (e.g., wolves mistaken for dogs) *is* a key criterion in philosophy of mind (e.g., Fodor) for distinguishing representations from mere correlations.  
  **What's Missing:**  
  - Probe recoverability ≠ the *network using it as a representation*. Probes can decode epiphenomenal correlates (e.g., background pixels coinciding with dogs).  
  - Wolves indoors might reflect dataset bias (e.g., wolves only appear in snow outdoors, dogs indoors), not true misrepresentation.

  ### **(2) Dev's Rebuttal**  
  *Position:* Causal test (ablation) shows the direction isn't used by the model; it's just a world correlation.  
  **What's Valid:**  
  - If ablation doesn't hurt performance, the direction isn't *causally necessary* for the network's function.  
  - "Representation" implies functional role (e.g., Dretske/Millikan: a state must be *consumed* by the system for a purpose).  
  **What's Missing:**  
  - Ignores that *redundant* encodings are common in biology/ML. A backup doesn't negate the original's representational status.  
  - Overlooks that linear decodability might reflect how the network *organizes* information, even if not uniquely causal.

  ### **(3) Mara's Redundancy Defense**  
  *Position:* Ablation tests "prove too much"; human vision uses redundant cues (silhouette vs. fur), so backup copies don't invalidate representation.  
  **What's Valid:**  
  - Distributed systems *do* use redundancy (e.g., ResNet skip connections). Human vision relies on multiple fallible cues (shape, texture).  
  - Silhouette-based dog recognition *is* still "dog representation"—just a different encoding.  
  **What's Missing:**  
  - Conflates *information existence* with *representational status*. A cue humans *ignore* (e.g., accidental shadow) isn't a "representation" even if decodable.  
  - Doesn't address *why* this specific direction exists: is it a robust feature or a training artifact?

  ### **(4) Dev's Collapse Argument**  
  *Position:* Accepting redundancy makes "representation" vacuous—any decodable correlation qualifies.  
  **What's Valid:**  
  - If *any* ablated feature can be called a "representation" due to backups, the term loses explanatory power.  
  - Highlights a real risk: probes can decode spurious features (e.g., "green grass" for "cow").  
  **What's Missing:**  
  - Fails to engage Mara's point that *training pressure* (not just correlation) matters. Robustness to distribution shift (wolves indoors) suggests generalizability.  
  - Doesn't acknowledge that *population codes* in neural nets often distribute information—no single neuron/direction "owns" a representation.

  ### **(5) Mara's Training Pressure Move**  
  *Position:* Representation is defined by survival under distribution shift and *recomputation by the network*, tied to training objectives.  
  **What's Valid:**  
  - Training *does* select for features that generalize (e.g., "dog-ness" over backgrounds).  
  - Shift robustness (wolves→dogs) suggests the direction captures an *invariant* of the class.  
  **What's Missing:**  
  - "Recomputation" is vague. The backup direction might recompute "dog," but the *ablated direction itself* might not be *used* in inference.  
  - Overstates what linear probes capture: a probe might force-separate entangled features (e.g., "dog + furry" vs. "wolf + furry").

  ### **(6) Dev's Optimizer Counter**  
  *Position:* Relying on training pressure reduces representation to optimizer history, not the network's current state.  
  **What's Valid:**  
  - "What the network was selected for" ≠ "what the network is doing now." An overparameterized net can encode unused features.  
  - Philosophy of mind emphasizes *current causal role* (e.g., Cummins: representations are "exploited" by the system).  
  **What's Missing:**  
  - In ML, *training shapes the causal structure*. Backup directions exist *because* they were selected for robustness.  
  - Doesn't propose a test for "meaning" beyond ablation (which he admits fails for redundant systems).

  ---

  ### **Who's Right About What?**  
  - **Mara is right** that:  
    - High probe accuracy + robustness to shift indicates *information is present*.  
    - Redundancy doesn't negate representational status (analogy to human vision is apt).  
    - Training pressure connects the feature to semantic content ("dog-ness").  
  - **Dev is right** that:  
    - Linear recoverability ≠ representation (probes can decode unused signals).  
    - Causal necessity (via ablation) *is* a key test for functional relevance.  
    - Untethered to causal role, "representation" becomes empirically empty.  

  ### **What Both Miss**  
  1. **The Layer's Role:** Neither considers *why* this layer has correlated directions. Is it an early feature layer (e.g., edges) where "dog" is entangled with "wolf"? A middle layer might encode *subsemantic* features (e.g., "furry" + "quadruped"), not fully realized concepts.  
  2. **Probes vs. End-to-End Behavior:** A probe is an *external* tool; the network's *internal* readout of "dog" might rely on non-linear combinations neither direction captures alone.  
  3. **"Representation" Isn't Binary:** This might be a *partial* or *latent* representation activated in some contexts (e.g., wolves indoors) but not others.  
  4. **The Wolf Issue:** Wolves indoors might indicate:  
     - Dataset bias (e.g., wolves only appear with snow → model uses "indoors" as a spurious cue),  
     - Under-specified features (the direction encodes "canid" or "predator"), not "dog."  

  ### **Synthesis: A Referee's Call**  
  - **The direction is *informative* but not *causally decisive*.** It carries a linear signal for "dog" (supporting Mara), but the network doesn't *rely* on it due to redundancy (supporting Dev).  
  - **It's a "representation" in a weak sense** (information is encoded and generalizable), but **not in a strong sense** (it's not necessary for the network's function).  
  - **Better evidence for "dog representation" would be:**  
    - The direction *causing* dog-related decisions (e.g., via patching or causal mediation analysis),  
    - The network *failing* on wolves outdoors if ablated (testing generalization beyond dataset biases),  
    - The backup direction *degrading* when combined with ablation (proving interdependence).  

  ### **Philosophical Bottom Line**  
  Mara leans **externalist** (representation defined by correlation + evolutionary/optimization history), Dev leans **internalist** (defined by causal role). In ML, both matter: the feature *was selected* to represent dogs (external), but its *current implementation* makes it redundant (internal). Resolving this requires specifying *which* "representation" (decodable information vs. functional state) is at issue—a distinction both gloss over.  

  Recommend telling your group: "Probes show the *information exists*, ablation shows it's *not uniquely causal*. Whether this is 'representation' depends on your definition: Mara's (informationally robust) or Dev's (functionally essential). Both frameworks are useful—but for this layer, it's likely a distributed, redundant encoding."
