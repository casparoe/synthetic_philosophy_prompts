prompt: |-
  I am working through the dispute between epistemic contextualism and pragmatic encroachment, and I keep losing the thread at one particular point, so I would like an explanation rather than a survey.

  Both views are usually introduced with the same kind of example: two subjects with identical evidence for the same proposition, one facing trivial stakes and one facing serious ones, where we are inclined to credit knowledge to the first and withhold it from the second. And both views are then often summarized in a way that makes them sound like notational variants: contextualism says the truth of "S knows that p" varies with the attributor's context, encroachment says it varies with the subject's stakes, and the choice between them looks like a choice about where to attach a single parameter. Please explain why that summary is misleading. I take it the key is that the two theses are claims about different things -- one about which proposition a knowledge sentence expresses, the other about which facts fix the truth value of a given proposition -- but I would like that difference made vivid, including why it means the two views can conflict rather than merely redescribe the same phenomenon, and why a contextualist can often simulate encroachment by letting the attributor's context track the subject's stakes.

  I would then like you to work the difference out on cases where subject-stakes and attributor-context come apart. Let p be the claim that the bridge on the coast road is open to traffic this afternoon, and suppose two drivers have exactly the same evidence for p -- the same municipal sign, read an hour ago, equally reliable in both cases. One is driving to a picnic and does not care much; the other faces something that matters a great deal. Now consider:

  1. The high-stakes driver is asked whether the low-stakes driver knows that p. What does each view predict about the truth of her denial?
  2. A third party, who has no stake in p and no intention of acting on it, hazily forms the belief that p; unbeknownst to her, someone else will act on her say-so in a matter of life and death. Are those the third party's stakes, the attributor's, or nobody's? What does each view say, and what would a view have to say if it wanted knowledge to be the thing that makes a proposition strong enough to serve as a premise in deliberation?
  3. A subject's stakes appear trivial but are in fact catastrophic, because someone has quietly arranged for error to be disastrous; the subject does not know this. Do actual stakes or appreciated stakes do the encroaching? What is at stake in that choice?

  Finally, two structural questions that I think bear on which view is even coherent. First, disagreement: when the low-stakes speaker says "she knows" and the high-stakes subject says "I do not," does either view let the two of them be genuinely contradicting each other, and how should we think about the retrospective report -- "she knew all along, even though at the time we would have denied it" -- given that past-tense attributions seem to let a present speaker's standards govern an earlier subject's epistemic position? Second, direction: encroachment as usually stated is one-directional, in that raising the stakes can only cost you knowledge. Is there any case in which higher stakes make knowledge easier to come by -- say, where the cost of further inquiry is itself enormous, or where acting on p is the only route out of a disaster -- and if not, what in the view explains the asymmetry?

  I care less about being told which view wins than about being able to say where the load-bearing difference lies and which datum each view handles awkwardly. Please keep the discussion concrete enough that I could reconstruct the arguments from it.
reasoning: |-
  Okay, the user is wrestling with the nuances between epistemic contextualism and pragmatic encroachment. They've been introduced to both through similar examples but sense they're being oversimplified as mere parameter-shifting exercises. I need to clarify why that's misleading and make the core distinction vivid.

  First, I should emphasize how these theories operate at fundamentally different levels. Contextualism is about semantic content - it claims the meaning of "knows" shifts with the attributor's context. Pragmatic encroachment, however, is metaphysical - it says the subject's practical situation directly affects whether their belief counts as knowledge, even when the semantic content stays fixed.

  The bridge example is perfect for demonstrating this. When the high-stakes driver evaluates the low-stakes driver's knowledge, contextualism says her high standards make "knows" demanding - so her denial is true. But encroachment says the low-stakes driver actually does know because his practical situation is undemanding - so her denial is false. This creates a genuine conflict between theories.

  For the third-party case where stakes are hidden, contextualism would likely say the third party's belief isn't knowledge because attributors would use high standards given the life-or-death consequences. Encruachment faces a dilemma: actual stakes would deny knowledge (since stakes are high), but appreciated stakes might grant it (since the subject is unaware). The deliberation requirement pushes toward actual stakes, but that seems counterintuitive.

  The case of misjudged stakes reveals another fracture line. Contextualists can say the subject knows because the attributor's context determines standards, regardless of hidden stakes. Encroachers must choose between actual stakes (denying knowledge) and appreciated stakes (possibly granting it). This choice reflects whether knowledge is externally tethered to real-world risks or internally constrained by the agent's perspective.

  On disagreement, contextualism handles retrospective reports smoothly: "knew" uses current standards to evaluate past belief. But it makes disagreement shallow - both speakers are right relative to their contexts. Encroachment maintains a single truth value but struggles with retrospective assessments if standards shift.

  The asymmetry question is particularly damning for encroachment. Why can high stakes only raise, not lower, the bar for knowledge? Contextualism has no such problem - standards can move in both directions. This suggests encroachment might be conflating knowledge with reasonable actionability.

  Throughout this, I'm noticing how contextualism better preserves knowledge as an internally accessible state, while encroachment risks making it hostage to external contingencies. But the user isn't asking for verdicts - they want the load-bearing differences laid bare. I'll highlight how each theory's answer to "what makes knowledge attributions true?" creates divergent predictions across these cases.
answer: |-
  Here's a breakdown clarifying the core distinction between epistemic contextualism (EC) and pragmatic encroachment (PE), why they aren't notational variants, and how they handle your specific cases. The key is indeed the *level* at which context/stakes operate:

  **The Core Distinction:**
  1.  **Epistemic Contextualism (EC):** A *semantic* thesis about the word "knows" and the proposition expressed by "S knows that p."
      *   "Knows" is a context-sensitive term, like "tall" or "here." Its content (the standard required) shifts with the **attributor's context** (speaker, assessor).
      *   The proposition *expressed* by "S knows that p" changes depending on *who is saying it* and *their context*. A single belief state might satisfy one attributor's "knows" standard but not another's.
      *   **Truthmaker:** The *subject's belief state + the facts relevant to the specific epistemic standard in play in the attributor's context*. The subject's practical situation is *evidence* for the attributor about the appropriate standard, but doesn't *constitute* the standard.
  2.  **Pragmatic Encruachment (PE):** A *metaphysical* thesis about the nature of knowledge itself.
      *   Knowledge is a *relation* between a subject and a proposition that *inherently* depends not just on traditional epistemic factors (belief, truth, justification/reliability) but also on the **subject's practical situation** (stakes, interests, purposes).
      *   The proposition *expressed* by "S knows that p" is *the same* regardless of who utters it. However, the *truth conditions* for that proposition include the subject's practical stakes. High stakes make the *same epistemic standard harder to meet* for the *same proposition*.
      *   **Truthmaker:** The *subject's belief state + the traditional epistemic factors + the subject's practical situation*. The stakes directly affect whether the belief counts as knowledge.

  **Why Not Notational Variants?**
  *   EC changes the *meaning* (proposition expressed) of "S knows that p" across contexts. PE keeps the meaning fixed but makes the *truth* of that fixed proposition depend partly on practical factors.
  *   **Conflict:** They can generate conflicting truth-value assignments *for the same utterance in the same situation*, depending on whether the attributor's context or the subject's stakes is driving the variation. This becomes clear when attributor context and subject stakes pull apart.

  **Applying to Your Cases (Bridge Example):**

  *   **Subjects:** Low-Stakes (LS) Driver (picnic), High-Stakes (HS) Driver (life/death). Identical evidence (sign read an hour ago).
  *   **Proposition (p):** The bridge is open.

  **Case 1: HS Driver says "LS Driver does NOT know that p."**
  *   **EC Prediction (Likely TRUE):**
      *   The *attributor* (HS Driver) is in a high-stakes context. Her context sets a *high epistemic standard* for "knows."
      *   The proposition expressed is: *LS Driver meets the HS Driver's high standard for knowing p.*
      *   Given LS Driver's evidence (only saw the sign an hour ago) is insufficient for the *high standard* demanded by the HS Driver's context, the denial ("LS Driver does not know") is *true*.
  *   **PE Prediction (Likely FALSE):**
      *   The proposition expressed is fixed: *LS Driver knows that p* (where "knows" has stake-invariant truth conditions).
      *   PE says whether LS Driver knows depends *only on LS Driver's stakes* (low). His evidence (sign an hour ago) is sufficient for knowledge *given his low stakes*.
      *   Therefore, the proposition "LS Driver knows that p" is *true*. The HS Driver's denial ("LS Driver does NOT know") is *false*. The HS Driver is mistaken about LS Driver's epistemic state because she's misapplying her own high-stakes requirement to someone in a low-stakes situation.
  *   **Load-Bearing Difference:** EC ties truth to the attributor's standard; PE ties it to the subject's stakes. Here they clash directly. EC explains the HS Driver's inclination to deny knowledge *as correct relative to her standards*. PE diagnoses it as an *error* – she's imposing her own stakes on someone else.

  **Case 2: Third Party (TP) with Hazy Belief; Life/Death Stakes Unbeknownst to Her/Attributor?**
  *   **Setup:** TP hazily believes p (bridge open) based on weak evidence (e.g., vague memory, overheard snippet). She has no stake. Unbeknownst to her (and any potential attributor), someone *else* will act on her say-so in a life/death situation. Is knowledge "the thing that makes a proposition strong enough to serve as a premise in deliberation"?
  *   **EC Prediction:**
      *   If an attributor (aware of life/death stakes) says "TP knows p", the *attributor's high-stakes context* sets a high standard. TP's hazy belief almost certainly fails this high standard -> "TP knows p" is FALSE.
      *   If an attributor (unaware of stakes) says "TP knows p", their *low-stakes context* sets a low standard. TP's hazy belief *might* meet this low standard -> "TP knows p" *could* be TRUE.
      *   **Deliberation Premise:** EC struggles here. Whether TP's belief is "strong enough" depends entirely on the *deliberator's* context (who might be unaware of the real stakes!). Knowledge, for EC, isn't reliably "the thing" for *anyone's* deliberation; it depends on the attributor's context.
  *   **PE Prediction:**
      *   PE must decide: Whose stakes matter? Actual (life/death) or Appreciated (TP's none)?
      *   **Option A (Actual Stakes):** The *actual* practical importance of being right (life/death) governs. TP's hazy belief, even if sufficient for her own zero stakes, is *insufficient* for the *actual* high stakes. -> "TP knows p" is FALSE. This *might* satisfy "strong enough for deliberation" *if* the stakes relevant to the deliberation govern. But here, the *deliberator* faces life/death stakes, *not the subject (TP)*. It's messy.
      *   **Option B (Appreciated Stakes):** Only the stakes *the subject (TP) is aware of and acting under* matter. TP has no stakes -> her hazy belief might be sufficient for knowledge -> "TP knows p" could be TRUE. But this seems disastrous for using knowledge as "strong enough for deliberation" by the person facing life/death stakes!
      *   **Deliberation Premise:** PE (Option A) *could* make knowledge "the thing," but only if the *subject's stakes* align with the *deliberator's stakes*. Here they don't. PE Option B severs the link between knowledge and the stakes of the action it might inform. Both options create tension.
  *   **Load-Bearing Difference:** EC makes knowledge attribution context-dependent in a way that may not track the *actual* deliberative needs of agents. PE faces a dilemma: tie knowledge to the *subject's* appreciated stakes (risking irrelevance to others' actions) or to *actual* stakes (making knowledge depend on unknown external factors, threatening its internal accessibility). Both views struggle to make knowledge reliably "the thing for deliberation" in complex, multi-agent scenarios. The dilemma within PE highlights its core challenge.

  **Case 3: Subject's Stakes Appear Trivial but are Actually Catastrophic (Unknown to Subject)**
  *   **Setup:** LS Driver appears to face trivial stakes (picnic). Unbeknownst to him, a saboteur has arranged that *if* the bridge is closed and he crosses, disaster strikes. His *actual* stakes are catastrophic. Does PE use actual or appreciated stakes?
  *   **EC Prediction:**
      *   Attributors unaware of sabotage will use a low standard (based on apparent stakes). LS Driver's evidence likely meets this low standard -> "LS Driver knows p" is TRUE.
      *   An attributor aware of the sabotage would likely use a very high standard. LS Driver's evidence likely fails this standard -> "LS Driver knows p" is FALSE.
      *   The subject's *actual* (unappreciated) stakes don't *directly* affect whether he knows; they only affect attributors' contexts and thus the standards they employ.
  *   **PE Prediction & The Choice:**
      *   **Actual Stakes:** The catastrophic stakes govern. LS Driver's evidence, sufficient for low *apparent* stakes, is insufficient for the *actual* catastrophic stakes. -> He does NOT know p. Knowledge depends on hidden, external dangers.
      *   **Appreciated Stakes:** Only the stakes the LS Driver is aware of (trivial picnic) govern. His evidence is sufficient -> He DOES know p. Knowledge is insulated from unknown catastrophic risks.
      *   **What's at Stake in the Choice?**
          *   **Internalism vs. Externalism:** Appreciated stakes favor internalism (knowledge depends only on factors accessible to the subject). Actual stakes favor externalism (knowledge depends on external facts, including hidden dangers).
          *   **Actionability:** Appreciated stakes make knowledge align with what the subject *can rationally act upon*. Actual stakes make knowledge align with *objective risk*, but the subject cannot access this to guide action.
          *   **Value of Knowledge:** Actual stakes make knowledge more valuable when stakes are high, but also harder to get and dependent on luck. Appreciated stakes make knowledge's value and difficulty more stable from the subject's perspective.
          *   **"Stakes" Definition:** Is "stakes" about the *objective consequences* of being wrong, or the *subjective importance/risk* guiding the agent's deliberation? PE needs to pick one.
  *   **Load-Bearing Difference:** EC sidesteps this by making the subject's (unappreciated) stakes relevant only via their effect on *attributors'* contexts. PE faces a fundamental choice between tying knowledge to objective risk (Actual Stakes) or subjective guidance (Appreciated Stakes), each with significant costs regarding accessibility and actionability.

  **Structural Questions:**

  1.  **Disagreement ("She knows" vs. "I do not") & Retrospective Reports:**
      *   **EC:** The LS Speaker and HS Subject are *not* contradicting each other. They express *different propositions*:
          *   LS Speaker: "HS Subject meets the LS Speaker's *low* standard for knowing p." (Likely TRUE)
          *   HS Subject: "I (HS Subject) do not meet the *high* standard relevant in *my own current* context for knowing p." (Likely TRUE)
          *   They talk past each other. **Retrospective Report ("She knew all along"):** The *current* speaker's context governs the standard. If the current speaker is in a low-stakes context, "She knew all along" uses a low standard and is TRUE, even if the HS Subject would have denied it using her high standard *at the time*. EC handles this smoothly.
      *   **PE:** The LS Speaker and HS Subject *are* contradicting each other about the *same proposition* "HS Subject knows that p". PE must say one is *wrong*.
          *   If PE uses *subject's stakes*, then "HS Subject knows p" is FALSE (because of *her* high stakes). The LS Speaker is *wrong* to say she knows; the HS Subject is *right* to deny it.
          *   **Retrospective Report:** Tricky. If the proposition is fixed, and knowledge is a past fact determined by the *subject's stakes at the time*, then "She knew all along" should be FALSE (she didn't meet the high standard then). But intuitively, we might say it *was* true later from a detached perspective. PE struggles with this temporal shift because it fixes the truth conditions at the time of the belief based on the subject's *then* stakes.

  2.  **Directional Asymmetry (Why only harder?):**
      *   **The Asymmetry:** PE is almost always framed as: *Higher stakes raise the epistemic bar, making knowledge harder to attain*. It's rare to see claims that *lowering* stakes *lowers* the bar, making knowledge *easier* to attain. The focus is on high stakes destroying knowledge that low stakes allow.
      *   **Is Asymmetry Justified? Cases for Easier Knowledge?**
          *   *Cost of Inquiry:* Imagine stakes are *extremely high* if you *don't* act *immediately* on p (e.g., bomb will explode unless you press button based on p). Further inquiry is prohibitively costly. Does this high stake *lower* the bar for knowing p? (You *need* to know with less evidence!). Standard PE doesn't suggest this. It would still say the high stakes *raise* the bar: acting on p requires *even more certainty* because the cost of being wrong is so high, even if inquiry is impossible. The driver *still* can't know based on the sign alone under high stakes.
          *   *Only Way Out:* Similar to above. High stakes if p is false, but p is the only conceivable escape. This doesn't make evidence for p *stronger*; it just makes acting on it rational out of desperation. PE wouldn't typically say this *lowers* the bar for knowing p.
      *   **Why the Asymmetry in PE?**
          *   **Core Motivation:** PE arises from cases where intuitively good evidence seems insufficient for knowledge *because* the stakes are high (bank cases). The driving intuition is loss of knowledge under high stakes, not gain under low stakes.
          *   **Knowledge Norms:** PE is often linked to the idea that knowledge is the norm for practical reasoning or assertion. *Violating* these norms is costly when stakes are high. Avoiding violation requires stronger justification when the cost of violating the norm (acting/asserting without knowledge) is high. Lower stakes lower the *cost of violation*, but don't necessarily change what *counts* as meeting the norm; they just make violating it less bad. High stakes demand *more* to meet the norm.
          *   **Risk Aversion:** The asymmetry reflects a focus on avoiding catastrophic error. High stakes make the risk of false belief unacceptable, demanding more evidence. Low stakes make the risk more tolerable, allowing knowledge with less evidence. Lowering stakes doesn't create a *new* positive reason to attribute knowledge with *weaker* evidence; it just reduces the negative pressure demanding more.
      *   **EC's Advantage:** EC has no inherent asymmetry. The contextually set standard can move *up or down* based on attributor factors. While high-stakes contexts typically raise the standard, nothing *in principle* prevents a context from setting an unusually *low* standard (e.g., "For our purposes here, just having a hunch counts as 'knowing'"). EC can more naturally accommodate bidirectional movement.

  **Summary of Load-Bearing Differences & Awkward Datums:**

  *   **Core Difference:** EC is semantic (meaning of "knows" shifts with attributor); PE is metaphysical (truth of "S knows p" depends on subject's stakes).
  *   **Conflict Manifest:** When attributor context and subject stakes diverge (Case 1), they assign different truth values to the *same utterance*.
  *   **EC Awkwardnesses:**
      *   Can make knowledge attribution seem overly dependent on who's talking, not the subject's state or the objective situation (Case 2, Case 3 EC unaware attributor).
      *   Struggles to make knowledge reliably "the thing that warrants action" if the deliberator's stakes differ from the attributor's context (Case 2).
      *   Makes disagreement shallow (merely verbal) which can feel unsatisfying.
  *   **PE Awkwardnesses:**
      *   Must choose between Actual vs. Appreciated stakes, facing internalism/externalism and accessibility/actionability trade-offs (Cases 2 & 3).
      *   Struggles with retrospective reports if knowledge is fixed by past subject stakes (Disagreement Q).
      *   Difficulty explaining why high stakes only raise the bar, not lower it (Direction Q).
      *   Makes knowledge depend on factors (actual stakes) potentially unknown to the subject, threatening its role in guiding rational action (Cases 2 & 3 Actual Stakes).

  The choice often boils down to whether the cost of making knowledge depend on external, possibly unknown factors (PE with Actual Stakes) is worse than the cost of making knowledge attributions highly context-sensitive and potentially irrelevant to others' high-stakes actions (EC), or whether the cost of tying knowledge tightly to the subject's perspective (PE with Appreciated Stakes) is worse than EC's context-sensitivity. The directional asymmetry in PE and its handling of disagreement over time also present significant challenges. EC generally offers a smoother semantic story, while PE attempts a deeper integration of epistemology with practical rationality at the cost of greater metaphysical complexity and potential counterintuitiveness in edge cases.
