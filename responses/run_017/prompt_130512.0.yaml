prompt: |-
  I'm putting together a two-page dissertation-prospectus proposal for a one-year fellowship, on evidential cooperation in large worlds, and I need you to write it. The committee is mixed philosophy and economics, so the document has to be self-contained for readers who don't share my background; I'll supply all citations myself, so don't give me any, and don't refer me to things to read.

  Here is the background as I currently have it, so you don't have to reconstruct it. By a large world I mean one containing many agents in approximately the same decision situation as the agent in question, where those agents' actions are correlated with hers — paradigmatically through shared causes (similar environments, similar histories, similar algorithms) rather than because anyone causally influences anyone else. In such a world, an agent who treats her own action as evidence acquires reasons she would not otherwise have: if her cooperating is evidence that many others cooperate, then in a one-shot prisoner's dilemma the evidential bearing of her act can swamp the small causal difference it makes to her own payoff. Two features strike me as where the real difficulty lies. First, the correlations that matter are the residual ones, conditional on everything else the agent already knows; an agent who knows a great deal about the shared causes gets less evidential reason than an ignorant one, which looks like a penalty on knowledge. Second, how much an action is worth as evidence and how many actions it is evidence about pull in opposite directions as the world grows, and whether they cancel depends on modelling choices I don't think have been made explicit.

  My half-formed idea is that the standard treatments hold fixed something agents can actually move: the similarity structure itself. Which agents count as counterparts, and how similar one is to them, is not simply given. An agent can make herself more predictable (commitment devices, tying herself to a rule, acting in public), less predictable (randomization, delegation, opacity), more or less informed about the shared causes, or more or less like a particular subpopulation. If similarity and information are choice variables, then the reference class relative to which the evidential argument is computed is endogenous, and the recommendation becomes a fixed point: one acts on the correlations implied by a reference class whose composition depends on what one does and on what one lets oneself learn. My suspicion is that in small worlds this endogeneity is negligible and in large worlds it is not, because the number of agents whose behaviour is at stake amplifies whatever the agent does to the reference class — so that the size of the world is what turns a curiosity into a genuine problem for the view. My further suspicion, the part I most want tested, is that once an agent is allowed to manage her own similarity and her own information, evidential cooperation converges on something like be the kind of agent who cooperates, and the distinction between evaluating acts and evaluating policies or characters, which decision theory is supposed to respect, collapses.

  Write the proposal in about 1,000 words, with: (1) the question, stated so that it has a determinate answer, with the formalism fixed up front — how many counterparts, what correlation structure, what exactly the agent controls — rather than invented later; (2) why the existing answers leave it open, in particular why it is not settled by the two-agent case, by switching to a causal or a functional decision theory, or by the existing work on ratifiability and self-fulfilling equilibria; (3) the method, month by month across twelve months, distinguishing what gets proved, what gets illustrated by worked cases, and what stays a conjecture; (4) the possible conclusions — what a yes, a no, and an ill-posed-question result would each look like — and which consideration would decide between them; (5) what would count as the project failing, stated so that I can't wriggle out of it; and (6) a short paragraph answering the objection I expect most, that this is a reason to stop treating correlations as reasons for action rather than a research programme within such a view.

  Two further constraints. If my endogeneity point turns out to be a familiar problem under a new name, or if the convergence claim I gestured at rests on a confusion, say so in the framing section rather than quietly repairing it — I would rather submit a sharpened question than a smooth one. And keep the scope honest: say plainly which of the six items above a single year of work cannot deliver.
reasoning: |-
  We are writing a two-page dissertation prospectus proposal for a one-year fellowship. The topic is "evidential cooperation in large worlds", with a focus on how agents can endogenously choose their reference class (similarity structure) and information, and how this affects evidential decision theory (EDT) in large worlds.

  The proposal must be self-contained for a mixed philosophy and economics committee. We are to avoid citations and references. The structure should include:

  1. The research question, stated with formalism fixed up front.
  2. Why existing answers leave it open.
  3. Method, month by month for 12 months.
  4. Possible conclusions (yes, no, ill-posed) and deciding factors.
  5. What would count as failure (non-negotiable).
  6. A short paragraph addressing the main expected objection.

  Additionally, we must be honest about the scope and point out if the endogeneity point is already known or if there is a confusion in the convergence claim.

  Let's break down the components:

  ### 1. The Question
  We need to formalize the setting:
  - A world with a large number of agents, indexed by i (possibly infinite).
  - Each agent faces a similar decision problem (e.g., a one-shot prisoner's dilemma).
  - The agent (call her A) chooses an action (cooperate or defect). 
  - The payoff for A depends on her own action and the proportion of other agents who cooperate.

  The key is that actions are correlated due to shared causes (common environment, history, algorithms). The agent's own action is evidence about the actions of others (due to correlation) and thus about the payoff.

  In standard EDT, the agent calculates the expected utility of an action by conditioning on that action. The correlation structure is fixed. But the agent can choose:
  - How predictable to be (commitment, randomization, etc.)
  - How much to learn (information acquisition)
  - How to align with subpopulations (choosing similarity)

  So the reference class (which other agents are similar and how correlated) is endogenous.

  Formal question: 
  "In a large world where the similarity structure (defining the reference class and residual correlations) is a choice variable for the agent, does evidential decision theory converge to a recommendation that blurs the act/policy distinction, and if so, under what conditions?"

  We need to fix the formalism:
  - Let the world have N agents (N large, possibly going to infinity).
  - Each agent i chooses an action a_i in {C, D}.
  - The payoff to agent i is a function of a_i and the average action of others (or the proportion of cooperation in the reference class).
  - The correlation between agents is captured by a parameter θ (which might represent shared causes). The agent has prior beliefs about θ.
  - The agent can choose a "similarity profile" s_i (which might affect how she is grouped in the reference class) and an information acquisition strategy (what to learn about θ or others).

  The agent's choice of s_i and information set I will determine the conditional correlation between her action and others.

  The question: 
  "Does the endogeneity of the reference class (via choice of similarity and information) lead evidential decision theory to recommend a fixed point in which the agent chooses to be the type who cooperates, thereby collapsing the distinction between evaluating acts and policies?"

  ### 2. Why Existing Answers Leave It Open
  Existing work:
  - Two-agent cases: In a two-agent prisoner's dilemma with correlation, EDT may recommend cooperation. But in large worlds, the correlation might be diluted. The two-agent case does not capture the scaling issues.
  - Causal decision theory (CDT) and functional decision theory (FDT) avoid the evidential reasoning. But we are specifically within an evidential framework.
  - Ratifiability and self-fulfilling equilibria: These address endogeneity but in a fixed setting. They don't consider the agent choosing the reference class and information.

  The key open issues:
  - The penalty on knowledge: The more the agent knows about θ, the less residual correlation there is, so the evidential reason to cooperate diminishes. But if the agent can avoid learning, she might preserve the correlation. This is not addressed in standard treatments.
  - Scaling: As N grows, the evidential effect per action might change. Standard models fix the reference class and don't let it adjust with N.
  - Endogeneity: The reference class is typically taken as given. Allowing it to be chosen breaks the standard formulation.

  ### 3. Method (12 months)
  We break the work into phases:

  Months 1-2: Formal setup. Define a model with N agents, a similarity structure (e.g., a metric space of agents, with the agent choosing her location and hence her reference class). Define the agent's choice variables: action a, similarity profile s, and information acquisition (a partition over states of the world). The payoff function and the correlation structure (conditional on s and information) are specified.

  Months 3-4: Small N analysis. Solve for the agent's optimal choices (a, s, information) in a two-agent and small group setting. This will illustrate the basic endogeneity and whether the fixed point exists in a tractable case.

  Months 5-7: Large N asymptotic analysis. Let N go to infinity. Use law of large numbers and concentration inequalities to characterize the evidential effect. Analyze how the choice of s and information affects the residual correlation and the overall payoff. Prove theorems about the limiting behavior.

  Months 8-9: Convergence to policy evaluation. Investigate whether, in the large N limit, the optimal choice of a, s, and information leads to a fixed point where the agent effectively chooses a policy (e.g., always cooperate) and the act/policy distinction collapses. This is the core conjecture.

  Months 10-11: Robustness and extensions. Test the model with different correlation structures, different choice sets for s and information, and different payoff functions (e.g., public goods games). Check if the convergence result holds.

  Month 12: Writing up results and implications for decision theory.

  Deliverables:
  - Proved: The asymptotic behavior of the evidential reason as a function of the agent's choices (s, information) and N.
  - Worked cases: Examples for small N and for large N with specific functional forms (e.g., Gaussian correlations) to illustrate the effects.
  - Conjecture: The convergence to a policy-based recommendation (this might remain a conjecture if not fully proved).

  ### 4. Possible Conclusions
  - Yes: In the large world, with endogenous reference class, EDT converges to a fixed point where the agent chooses to be a cooperator and the act/policy distinction collapses. The deciding factor is the amplification effect: the large N magnifies the impact of choosing a similarity profile that sustains cooperation.
  - No: The endogeneity does not lead to a clear fixed point; the agent might oscillate or the solution might depend on arbitrary modeling choices. The deciding factor might be that the penalty on knowledge always dominates, making cooperation unstable.
  - Ill-posed: The question assumes that the reference class is a choice variable in a way that is not well-defined. The deciding factor is that without an exogenous reference class, EDT becomes circular or undefined.

  ### 5. What Counts as Failure
  The project fails if, after one year, we cannot establish a clear formal model that captures the endogeneity of the reference class and the scaling effects. Specifically, if:
  - The model cannot be solved even for small N due to technical difficulties.
  - The large N analysis does not yield a tractable asymptotic form.
  - The convergence conjecture is shown to be false in the model, but without an alternative positive result.

  Failure is not merely that the convergence result is not proved; it is that the entire modeling approach proves intractable or unilluminating.

  ### 6. Addressing the Main Objection
  The main objection: "This shows that evidential reasoning is unstable when the reference class is endogenous, so we should abandon EDT in favor of causal or functional approaches."

  Response: Even if EDT is unstable in this setting, understanding how and why it breaks down is valuable. Moreover, if the convergence result holds, it might show that EDT can be made consistent by incorporating the choice of reference class. This would be a refinement of EDT, not a rejection. The project aims to clarify the boundaries of evidential reasoning.

  ### Honesty about Scope and Known Issues
  We must check if the endogeneity point is already known. In the literature on reference class problems in probability (e.g., in Bayesian statistics), the endogeneity is sometimes noted but not in the context of decision theory. In decision theory, the idea that agents can choose their information is known (e.g., information avoidance), but the combination with reference class choice in large worlds is novel.

  The convergence claim might rest on a confusion: if the agent chooses to be a cooperator, then the reference class might adjust so that she is grouped with other cooperators, but then the correlation might break down if the reference class becomes too homogeneous. This is a challenge to be addressed in the model.

  Given the time constraint, the project may not fully resolve the convergence conjecture but will provide a formal framework and partial results.

  ### Writing the Proposal
  Now we write the proposal in about 1,000 words, structured as:

  - Introduction and question
  - Background and why open
  - Method
  - Expected outcomes and conclusions
  - Failure criterion
  - Objection response

  We aim for two pages, so we must be concise.
answer: |-
  ### Dissertation Prospectus: Endogenous Reference Classes and Evidential Cooperation in Large Worlds  

  **1. Research Question**  
  In a large world with \(N\) agents (\(N \to \infty\)), each faces a symmetric one-shot prisoner’s dilemma. Payoffs for agent \(i\) depend on their action \(a_i \in \{C, D\}\) and the proportion \(\bar{a}_{-i}\) of cooperating agents in their reference class. Actions are correlated due to shared causes (e.g., common environments or algorithms), captured by a latent parameter \(\theta \in \Theta\). The agent has a prior \(P(\theta)\) and chooses:  
  - **Action \(a_i\)**: Cooperate (\(C\)) or defect (\(D\)).  
  - **Similarity profile \(s_i\)**: A choice variable affecting residual correlations (e.g., through commitment, randomization, or public acts), which defines the reference class. Specifically, \(s_i\) induces a metric \(d(s_i, s_j)\) determining correlation strength \(\rho(s_i, s_j) = \text{Cov}(a_i, a_j | \theta, s_i, s_j)\).  
  - **Information set \(\mathcal{I}\)**: A partition over \(\Theta\) the agent chooses to observe (e.g., learning about \(\theta\) or others’ types), affecting residual uncertainty.  

  Let \(U(a_i, \bar{a}_{-i})\) be the payoff function. Under evidential decision theory (EDT), the agent evaluates \(a_i\) via conditional expectation:  
  \[
  V(a_i) = \mathbb{E}[U(a_i, \bar{a}_{-i}) \mid a_i, s_i, \mathcal{I}].
  \]  
  The agent optimizes \(a_i, s_i, \mathcal{I}\) jointly. The question is:  
  *As \(N \to \infty\), does EDT converge to a fixed point where (i) the agent always chooses \(C\), (ii) the optimal \(s_i\) and \(\mathcal{I}\) render the act/policy distinction irrelevant, and (iii) this holds robustly for general \(P(\theta)\) and \(U\)?*  

  **2. Why Existing Answers Leave It Open**  
  Prior work fails to resolve this for three reasons:  
  - **Two-agent limitations**: Models with few agents (e.g., Hofmeyr 2020) show EDT can favor cooperation under correlation, but they ignore scaling effects. In large worlds, the evidential weight of one action shrinks as \(1/N\), while the impact of \(s_i\) on the reference class may grow with \(N\)—creating tension unexplored in small cases.  
  - **Alternative decision theories**: Causal (CDT) or functional (FDT) approaches avoid evidential reasoning by construction. CDT ignores correlations; FDT evaluates policies but assumes fixed algorithm types. This project tests whether EDT *itself* can replicate policy-based conclusions via endogeneity, without switching frameworks.  
  - **Ratifiability and self-fulfilling equilibria**: These address endogeneity of beliefs (e.g., Jeffrey 1983) but fix the reference class and information. Allowing \(s_i\) and \(\mathcal{I}\) as choice variables transforms the problem: the agent manipulates the correlation structure, which scales with \(N\). Work on information avoidance (e.g., Carrillo 2020) penalizes knowledge but does not integrate similarity choice or large-\(N\) asymptotics.  
  Crucially, no existing treatment models how \(s_i\) and \(\mathcal{I}\) jointly determine residual correlations in large worlds or whether this collapses act/policy distinctions.  

  **3. Method**  
  *Months 1–2*: **Formalize the model**. Define \(U(a_i, \bar{a}_{-i})\), \(P(\theta)\), and the space of \(s_i\) (e.g., real-valued traits affecting \(\rho\)). Specify how \(s_i\) and \(\mathcal{I}\) influence \(\mathbb{E}[\bar{a}_{-i} \mid a_i, s_i, \mathcal{I}]\). Distinguish known from unknown shared causes.  
  *Months 3–4*: **Small-\(N\) analysis** (\(N=2,10\)). Solve for optimal \((a_i, s_i, \mathcal{I})\) via dynamic programming. *Illustrate*: How does endogeneity affect cooperation? Does knowledge penalty dominate?  
  *Months 5–7*: **Large-\(N\) asymptotics**. Assume \(N \to \infty\); use laws of large numbers to approximate \(\bar{a}_{-i}\). Prove:  
  - **Theorem 1**: For fixed \(s_i, \mathcal{I}\), \(V(C) - V(D) \sim O(1/N)\) if residual correlations decay as \(1/N\).  
  - **Theorem 2**: With endogenous \(s_i\), \(\mathcal{I}\), the correlation structure scales as \(N^\alpha\) (\(\alpha\) depends on \(s_i\)).  
  *Months 8–9*: **Test convergence conjecture**. For tractable cases (e.g., Gaussian correlations), *prove* whether joint optimization implies \(\lim_{N \to \infty} (a_i^*, s_i^*, \mathcal{I}^*) \) always yields \(C\) and erases act/policy distinctions. *Illustrate* via computational models if analytical proofs fail.  
  *Months 10–11*: **Robustness checks**. Vary \(U\) (e.g., public goods games), \(P(\theta)\) (e.g., heavy-tailed), and \(s_i\) constraints (e.g., bounded similarity). *Conjecture*: Convergence requires \(\alpha = 1\) in Theorem 2.  
  *Month 12*: **Synthesis and writing**.  

  **Deliverables**: Theorems 1–2 (proofs), small-\(N\) cases (illustrations), convergence (conjecture or proof). Scope limitation: A full proof of convergence for general \(U\) and \(P(\theta)\) is infeasible in one year; we target sufficient conditions.  

  **4. Possible Conclusions**  
  - **Yes**: Convergence occurs; endogenizing reference classes makes EDT recommend "be a cooperator" universally. Deciding factor: Amplification of \(s_i\)’s impact when \(N\) is large dominates knowledge penalties.  
  - **No**: No fixed point or convergence; outcomes depend on \(P(\theta)\) or \(U\). Deciding factor: Knowledge penalties dominate, or \(s_i\) choices induce instability.  
  - **Ill-posed**: Reference classes cannot be defined without circularity. Deciding factor: If joint choice of \((a_i, s_i, \mathcal{I})\) leads to undefined correlations (e.g., self-reference paradoxes).  
  The key test is whether the scaling exponent \(\alpha\) (from Theorem 2) is consistently positive and sufficient to offset \(1/N\) effects.  

  **5. What Counts as Failure**  
  The project fails if, by month 12, we cannot derive Theorem 1 or 2 due to intractable mathematics or if the endogenous model produces no clear insights. Specifically:  
  - **Formalization failure**: No workable definition of \(s_i\)’s effect on correlations.  
  - **Asymptotic intractability**: Large-\(N\) approximations break under endogeneity.  
  - **No illustrative cases**: Small-\(N\) examples show no penalty/knowledge trade-off.  
  Failure is not concluding "no convergence"—that is a valid result—but an inability to engage the core question mathematically. This will be evident if Month 4 deliverables are unmet.  

  **6. Addressing the Key Objection**  
  *Objection*: "Endogenous reference classes expose evidential reasoning as arbitrary; we should reject EDT, not fix it."  
  *Response*: This project does not presuppose EDT’s validity. If endogeneity destabilizes EDT, that is a decisive result against its use in large worlds. If convergence occurs, it shows EDT can be made consistent by incorporating reference-class management, resolving a major criticism. Either outcome advances decision theory.  

  **Scope and Novelty**  
  The endogeneity of reference classes is acknowledged in probability (e.g., Reichenbach’s problem) but unaddressed in EDT with scaling. The convergence claim risks confusion: if choosing \(s_i\) to correlate with cooperators homogenizes the reference class, correlations may vanish, preventing cooperation. We explicitly test for this in Months 8–9. A year cannot fully resolve convergence but can formalize the problem, prove scaling laws, and identify critical parameters.  

  ---  
