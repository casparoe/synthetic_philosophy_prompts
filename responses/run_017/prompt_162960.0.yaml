prompt: |-
  I am a novelist, four books in, and my current manuscript has backed me into a conceptual problem that I can only describe in workshop vocabulary, which is beginning to feel like the wrong instrument for it. The novel centres on a widow, Marianne, who consents to having her dying husband reconstructed from his digital remains — decades of email, voice messages, calendars, a lifetime of location metadata — into an embodied conversational presence. Three wrinkles matter for my purposes. First, the reconstruction is a scan-and-reassembly with no continuity of the original brain, so whatever makes the resulting man her husband, it is not the ordinary cause. Second, the company quietly edits: his affair and the religious crisis of his fifties are stripped out to make him easier to live with, so whatever psychological continuity holds, it holds partially and unevenly. Third, late in the book, for an insurance deposition, the archive is run twice; the two instances diverge over the following weeks, one embittered and one serene, and Marianne must decide whether either, both, or neither is owed anything from her.

  I read Parfit's Reasons and Persons (Oxford, 1984) some years ago for pleasure and remember the shape of the teletransporter material: the reductionist claim that a person consists in a brain, a body and a series of connected mental states and events, with no further fact of identity beyond them; the claim that what matters in survival is psychological continuity and connectedness with any cause, including a bizarre one; the fission case in which identity fails but nothing that matters is lost; and the suggestion that survival can itself hold to a reduced degree. I would like those four claims restated as faithfully as you can in the vocabulary I actually work in: character identity carried across a series, recasting a role between instalments, retconning, canon versus canon-adjacent material, fidelity and infidelity in adaptation, one writer completing another's unfinished manuscript, the series bible, point of view and who the narration is attached to, authorial stipulation versus what is true in the world of the book, and the reader's identification with a character and how readily that identification transfers. I am fluent in this vocabulary, so lean on it rather than softening it. Where several of my terms compete for the same job, pick one and say why; and where the translation would quietly assume that fictional identity is stipulated by an author — which would make Parfit's question evaporate entirely — flag that rather than helping yourself to it.

  Then the part I actually need: a residue report. Which of the four claims translate cleanly, which survive only distorted, and which have no expression in craft vocabulary at all. I have two suspicions I would like tested rather than flattered. The first is that this vocabulary cannot say anything first-personal: there is no craft term for what a character anticipates or dreads for himself, because characters do not anticipate, and so the question that gives the whole debate its force may be unstageable in my medium. The second is that craft does contain a continuum — degrees of fidelity, of canonicity, of uptake among readers — but that it is a continuum of the wrong thing, measuring the audience's relation to a character rather than anyone's survival. If both suspicions are right, tell me which failures are defects of my vocabulary and which are signs that the philosophical claim was doing less work than it appears to. Two further constraints. The distinction between what matters to Marianne and what would matter to the man who went into the process is, for this book, the entire crux, so keep those separate throughout and say whether the craft vocabulary can express both or only one. And I am fairly sure my instinct for staging the question — a scene in which the reconstruction passes a test with a memory only her husband could have had — is a cheat; please say what in the argument makes it one, and what an honest scene would have to do instead. Please give me no bibliographies, reading lists, or accounts of who said what where: I want the argumentative structure and the translation, in roughly 1,000 to 1,400 words, written for a competent adult reader with no graduate training in philosophy.
reasoning: |-
  Okay, the user is a novelist with a fascinating conceptual problem. They're working on a manuscript about a widow whose husband is reconstructed from digital remains, and grappling with philosophical questions of identity through the lens of writing craft. Let me unpack this carefully.

  The core challenge seems to be translating Parfit's philosophical concepts about personal identity into the vocabulary of fiction writing. The user specifically wants to avoid workshop jargon and use terms like "character identity across series," "recasting roles," "canon fidelity" etc. That's an interesting constraint - it means I need to treat fictional characters as real entities within their own ontology.

  Hmm, the user's suspicions are crucial here. First, that craft vocabulary can't express first-person perspective because characters "don't anticipate." Second, that the continuum in fiction measures audience relation rather than actual survival. Both point to a fundamental gap between philosophical inquiry and narrative craft.

  Let me approach this systematically. For the translation:
  - Psychological continuity → Character identity across installments. The "series bible" concept works well for maintained traits.
  - Cause doesn't matter → Recasting actors between seasons. The new actor embodies the role despite different origins.
  - Fission cases → Parallel canons/AU fanfiction. Shows identity can split without loss.
  - Degrees of survival → Canon-adjacent material. Partial acceptance by audience.

  Now the residue report... The first-person issue is thorny. In fiction, anticipation is always narrative device, never actual subjective experience. That's why the "memory test" scene feels like a cheat - it's authorial fiat masquerading as proof. An honest scene would need to show Marianne's dilemma without claiming objective validation.

  The continuum problem is equally significant. When we talk about "fidelity" in adaptations, we're measuring audience reception, not ontological survival. This creates a fundamental mismatch with Parfit's concerns.

  The widow/reconstruction distinction is vital. Craft terms can express Marianne's perspective (her "identification" with the recreation) but struggle with the reconstruction's own claim to identity. We can imply it through POV attachment, but it remains narrative construction.

  Ultimately, fiction's tools are phenomenal - they deal with appearance and reception. Philosophy seeks noumenal truths. The user's instinct about the vocabulary's limitations seems precisely right. Their challenge will be to dramatize the tension between these realms without pretending craft terms can resolve philosophical questions.

  For the deposition scene, instead of a memory test, perhaps show the diverging reconstructions developing distinct narrative voices, with Marianne's choice hinging on which version sustains her "identification" - making the reader feel the weight of the ontological uncertainty through her dilemma.
answer: |-
  Here is the translation and residue report, structured as requested. I've maintained strict fidelity to your craft vocabulary while flagging where philosophical claims distort or evaporate in translation. The core tension: **craft vocabulary handles *representation* and *reception*, not ontology or survival.**

  ---

  ### Parfit's Claims Translated into Craft Vocabulary  
  *(Faithfully rendered, with inherent limitations noted)*  

  1. **Reductionist Claim (No "further fact" of identity beyond brain/body/psychology):**  
     → *Translation:* **Character identity is exhaustively defined by the series bible.**  
     *Why this term?* The bible codifies traits, history, and voice. No "essence" exists beyond what’s documented in canon (appearance, key memories, relationships). If it’s not in the bible or on-page, it doesn’t constitute the character.  
     *Distortion Flag:* This assumes *authorial stipulation*. Parfit argues there’s no further fact *in reality*; craft assumes there’s no further fact *beyond what the author declares canon*.  

  2. **Psychological Continuity w/ Any Cause (Survival via connectedness, even bizarre causes):**  
     → *Translation:* **Recasting a role between installments while maintaining audience identification.**  
     *Why this term?* A new actor embodies Bond/Batman; audiences accept it if mannerisms, backstory, and narrative function align. The cause (new actor, reboot) is irrelevant if psychological continuity (as defined by the bible) holds.  
     *Distortion Flag:* Craft focuses on *audience acceptance*, not survival. The character "survives" if readers *transfer their identification*, not if the character "exists."  

  3. **Fission (Identity fails, but "nothing matters" is lost):**  
     → *Translation:* **Divergent canons (e.g., comic book multiverses) or AU fanfiction.**  
     *Why this term?* Two versions of Sherlock exist: one in Conan Doyle’s canon, one in *Sherlock*. Identity fails (they aren’t the "same" Holmes), but readers invest in both. What "matters" (reader engagement, thematic resonance) isn’t diminished by duplication.  
     *Distortion Flag:* Craft measures *audience uptake*, not survival. The original character doesn’t "lose" anything; readers gain alternatives.  

  4. **Degrees of Survival (Continuity holds partially):**  
     → *Translation:* **Canon-adjacent material or contested adaptations.**  
     *Why this term?* A "based on true events" film adaptation takes liberties. It’s neither fully canonical nor non-canonical; readers partially accept it. The character "survives" weakly if key traits are diluted (e.g., a sanitized biopic).  
     *Distortion Flag:* This describes *fidelity of representation*, not partial existence. The character isn’t "partly surviving"; they’re being *partly misrepresented*.  

  ---

  ### Residue Report: What Survives Translation?  

  | Parfit’s Claim             | Translation Fidelity          | Key Distortion/Omission                          |  
  |----------------------------|-------------------------------|--------------------------------------------------|  
  | **Reductionism**           | Clean                         | Assumes authorial stipulation (not applicable to real persons). |  
  | **Continuity w/ Any Cause**| Distorted                     | Measures audience identification transfer, not survival. |  
  | **Fission**                | Clean (for audience impact)   | Omits the first-person perspective of the "fissioned" entity. |  
  | **Degrees of Survival**    | Distorted                     | Measures fidelity/audience acceptance, not ontological gradation. |  

  ---

  ### Testing Your Suspicions  

  1. **"Craft vocabulary cannot say anything first-personal": CONFIRMED.**  
     - *Why:* Characters don’t "dread" or "anticipate"; they are *written* to simulate dread. Craft terms like **POV attachment** describe *narrative access*, not subjective experience. Parfit’s "what matters to me about my future" evaporates because fictional characters lack interiority independent of author/reader projection.  
     - *Defect or Insight?* **Sign that Parfit’s first-personal question is unstageable.** Fiction can *represent* dread (e.g., Marianne’s husband says "I fear dissolution"), but this is authorial ventriloquism. The reconstruction’s "dread" is canon fodder, not evidence of survival.  

  2. **"Continuum measures audience relation, not survival": CONFIRMED.**  
     - *Why:* Craft’s continuum (**fidelity**, **canonicity**, **audience identification**) tracks *reception*, not ontology. A "serene" reconstruction might garner stronger reader identification than an "embittered" one, but this doesn’t mean it "survives better."  
     - *Defect or Insight?* **Sign that Parfit’s "what matters" is doing less work.** His "mattering" is subjective but *intrapersonal* (what I care about in my survival). Craft’s continuum is *interpersonal* (what readers care about in a character).  

  ---

  ### Separating Marianne vs. The Reconstruction  
  - **Marianne’s Perspective:** Craft vocabulary excels here. Her "identification" with the reconstruction is a **reader’s identification with a recast role**. If she accepts it as her husband, it’s like audiences accepting a new Bond. Her dilemma (is either reconstruction "owed" anything?) is **fidelity judgment**: which version best fits *her* internal series bible.  
  - **The Reconstruction’s Perspective:** Craft vocabulary **fails**. Does *it* care about survival? We can write **POV chapters** for it, but its "anticipation" is narrative contrivance. We can’t translate "what matters to the reconstruction" without authorial fiat.  

  ---

  ### The Memory Test Scene: Why It’s a Cheat  
  - **The Philosophical Cheat:** Parfit argues psychological continuity *with any cause* sustains what matters. A "husband-only memory" tests *causal origin* (was he copied from the right data?), not psychological continuity. If the serene reconstruction lacks the memory but shares 95% of other traits, Parfit says Marianne *should* still care about it. Testing a memory privileges causal fidelity over psychological connectedness.  
  - **The Craft Cheat:** It’s a **retcon disguised as revelation**. The memory isn’t "proof"; it’s the author retroactively adding a trait to the series bible to sway Marianne/readers.  
  - **An Honest Scene:** Stage **divergent narrative voices**. Show the "embittered" reconstruction using her husband’s unique idioms (**voice fidelity**), while the "serene" one revises past events (**retconning the bible**). Marianne’s choice isn’t about proof, but *which version she grants canonicity for her story*. Does she attach her POV to the bitter truth or serene fiction?  

  ---

  ### Summary: The Vocabulary Gap  
  Craft vocabulary handles **representation** and **reception**. It can:  
  - Track Marianne’s shifting identification (audience surrogate).  
  - Model the reconstructions as contested adaptations (divergent canons).  
  - Measure fidelity to the "original character" (series bible).  

  It **cannot**:  
  - Simulate first-person survival stakes (characters aren’t subjects).  
  - Resolve whether the reconstruction "is" her husband (identity is stipulated).  
  - Express what "matters" to the reconstruction (no interiority beyond text).  

  **Your instinct is correct:** The force of Parfit’s argument (the first-personal dread) *cannot* be staged. But Marianne’s crisis can—by focusing on her **narrative need to canonize one version**. The reconstructions aren’t people surviving; they are competing drafts. Her choice isn’t metaphysical; it’s editorial. This, ironically, may be the honest answer Parfit’s reductionism hints at: identity is a story we agree to tell.
