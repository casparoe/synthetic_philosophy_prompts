answer: |-
  Here’s a rigorous set of desiderata for an account of cognitive penetration (CP), designed to resolve seminar deadlocks. The criteria are grounded in philosophical and empirical debates, with key conflicts addressed head-on. Requirements are marked **[NN]** for non-negotiable (core to CP’s definition) or **[C]** for contested/camp-specific. Cases are integrated throughout.

  ---

  ### **I. Core Desiderata: What CP Must Explain**
  1. **The Difference-Maker Criterion [NN]**:  
     The theory must identify whether a *cognitive state* (belief, desire, concept) is the *proximate cause* of a change in perceptual experience, distinct from low-level sensory inputs or peripheral attention shifts.  
     - *Excludes*: Changes driven solely by fatigue, adaptation, or retinal motion.  
     - *Requires*: A counterfactual test—e.g., "If the subject lacked belief *B*, would experience *E* differ?"  

  2. **Intrinsic Effect on Perceptual Processing or Content [NN]**:  
     CP must alter the *output* of perceptual systems (e.g., what is seen/heard), not just post-perceptual judgment or report. Distinguish:  
     - **Sensory Processing**: Changes in early visual processing (e.g., neural activity in V1-V4).  
     - **Perceptual Content**: The properties represented (e.g., "that line is longer," "that shape is a duck").  
     - **Phenomenal Character**: The "what it’s like" of the experience (e.g., the duck *appears* vividly).  
     - **Judgmental Uptake**: How the experience is categorized or reported.  
     *Crucially, these can dissociate*. A theory must allow for CP affecting one (e.g., content) without others (e.g., processing).  

  3. **Non-Collapse into Attention/Memory/Judgment [NN]**:  
     Must distinguish CP from:  
     - **Attention**: Shifting focus *within* a scene (e.g., scrutinizing Müller-Lyer arrows) without changing content.  
     - **Memory**: Recall altering interpretation (e.g., "this looks like Picasso’s style").  
     - **Judgment**: Post-hoc categorization (e.g., deciding an ambiguous figure is a rabbit).  
     *Case that must be excluded*: **Müller-Lyer illusion**. Knowing the lines are equal length doesn’t change the *appearance*; it only affects judgment.  

  ---

  ### **II. Key Tests & Their Conflict**
  - **"Same Proximal Stimulus" (SPS) Test**: CP occurs if identical sensory inputs (e.g., retinal image) yield different experiences due to cognition.  
  - **"Best Causal-Explanatory" (BCE) Test**: CP occurs if cognition is the decisive factor in the causal chain explaining the experience.  

  **Conflict Resolution**:  
  - These tests *diverge* when cognition alters *which features are processed* (e.g., a botanist notices leaf serrations; a novice sees "green blob").  
  - **Priority**: Build the theory around **BCE**. SPS is a heuristic for detecting CP but fails when cognition changes input sampling (e.g., eye movements guided by knowledge). A theory must accommodate cases where cognition *legitimately* alters processing depth (e.g., radiologist’s expertise) without requiring identical inputs.  
  - *Sacrifice*: Pure SPS must be abandoned as definitive. CP can occur even if proximal stimuli differ *because* of cognition.  

  ---

  ### **III. Cases the Theory Must Get Right**
  - **Genuine CP (Content Penetration)**:  
    **Radiologist case**. For an expert, a tumor "pops out" perceptually (content: *this region is pathological*); for a novice, it’s noise. Must be classified as CP: expertise alters perceptual content, not just judgment.  
  - **Fake CP (Judgment, not Perception)**:  
    **Müller-Lyer illusion**. Learning the lines are equal doesn’t change their perceived length; it only changes belief.  
  - **Borderline Case (Attention vs. CP)**:  
    **Phone/Gun misperception**. If panic *causes* a blurry shape to be perceptually categorized as a gun (content penetration), it’s CP. If attention amplifies gun-like features already present, it’s not.  

  ---

  ### **IV. Constraints Against Collapse**
  4. **No "Any Causal Influence" [NN]**:  
     Exclude cognition that only affects *input selection* (e.g., turning your head) or *post-perceptual processing*. CP requires cognition to directly modulate perceptual *output*.  
     *Most excluding requirement*: **Intrinsic Effect on Content (Desideratum 2)**. It rules out attentional accounts (e.g., "you just attended more") and judgment-based explanations. The radiologist case bites here: if tumors "pop out" due to automated perceptual learning, it’s CP; if it’s deliberate scrutiny, it’s not.  

  5. **Epistemic Constraint [C]**:  
     *(Contested: Epistemologists insist; psychologists often ignore)*. A penetrated perception cannot provide independent warrant for the penetrating belief (e.g., believing lemons are yellow makes them *look* yellower, but this can’t justify the belief). Not essential to CP’s definition but key for epistemic implications.  

  ---

  ### **V. Dissociation of Penetration Types**
  - **Sensory Processing ≠ Content ≠ Phenomenology**:  
    - A theory must allow dissociation (e.g., cognition alters content without changing sensory processing).  
    *Case*: **Predictive Processing (PP)** frameworks treat perception as hypothesis-testing. In PP, priors (cognition) *penetrate sensory processing* but may not alter content if prediction error overrides them.  
    *Case*: **Ambiguous figures (Duck-Rabbit)**. Seeing it as a duck may change content and phenomenology, but early sensory processing (V1 edges) is unchanged.  

  ---

  ### **VI. Flagged Incompatible Requirements**
  - **Conflict 1**: **SPS Test** vs. **BCE Test**. Cannot jointly demand *identical inputs* and *cognition-driven input changes*. Solution: Prioritize BCE.  
  - **Conflict 2**: **Epistemic Constraint** vs. **Realism about CP**. If CP is widespread (e.g., in PP), the epistemic constraint implies perception is often epistemically compromised—but some camps reject this.  

  ---

  ### **VII. Why Most Accounts Fail**
  - **The hardest requirement**: **Intrinsic Effect on Content (Desideratum 2)**.  
    - Excludes: "New Look" psychology (judgment mislabeled as perception), attentional accounts (e.g., "cognitive penetration is just top-down attention"), and enactivist views (action-perception loops).  
    - *Case that makes it bite*: **Radiologist**. If the tumor "pops out" due to automated perceptual learning (content penetration), it’s CP. If it’s deliberate scrutiny (attention), it’s not. Most theories conflate these.  

  ---

  ### **Summary for Seminar Use**
  | **Requirement**               | Type     | Key Test Case         |  
  |-------------------------------|----------|-----------------------|  
  | Cognitive State as Cause      | [NN]     | Radiologist vs. Novice|  
  | Effect on Content (not judgment)| [NN]     | Müller-Lyer exclusion |  
  | Dissociation of Levels        | [NN]     | Duck-Rabbit (content ≠ sensory)|  
  | BCE over SPS                  | [NN]     | Botanist’s leaf details|  
  | Epistemic Independence        | [C]      | Yellow lemon belief   |  

  **Encapsulated Theories**:  
  - **Classic Modularity** (Fodor): Rejects CP; radiologist is post-perceptual.  
  - **Predictive Processing**: Treats all perception as cognitively penetrated; struggles with epistemic constraint.  

  **Move forward by**: Demanding causal explanations for *how* cognition alters perception (not just "attention") and testing dissociations (e.g., neural markers of content vs. judgment). If the radiologist’s tumor is seen faster than attention allows, it’s CP. If reaction times scale with attention, it’s not.
