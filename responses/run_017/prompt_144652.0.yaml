  2. **Tests for Detection**: The "same proximal stimulus" test vs. the "causal-explanatory" test. The user wants to know which to prioritize. I need to explain that they can be reconciled if the causal story shows cognitive states altering processing independently.
  3. **Distinctions**: Separating penetration of sensory processing, content, phenomenal character, and judgment. These can dissociate, so a good theory must account for that. For example, top-down effects might alter processing without changing content, or vice versa.
  4. **Cases**: Must handle cases like the radiologist (genuine penetration) vs. the Müller-Lyer (not penetration, just judgment). Also, ambiguous figures might be attention, not penetration. The phone/gun example could be cognitive penetration if prior beliefs alter perception, not just interpretation.
  5. **Constraints**: Avoid collapsing into any causal influence. The epistemic constraint is that penetrated perceptions can't confirm the penetrating belief, which is camp-specific (epistemologists might insist on this).
  6. **Incompatible Requirements**: For instance, the same-stimulus test and allowing cognitive influence on attention might conflict. Also, the epistemic constraint might clash with cases where penetration is epistemically neutral.
  7. **Most Excluding Requirement**: The "Intrinsic Effect on Content" requirement, because many accounts (like attentional shifts) get ruled out here. The radiologist case exemplifies this—expertise directly changes what's seen, not just where one looks.

