prompt: |-
  hey — I'm TAing a second-year metaphysics course and I've got one 50-minute section next week on laws of nature: the Humean side (best-system, the mosaic, nothing over and above the matters of particular fact) versus the anti-Humean "laws govern" picture. There'll be two physics majors in the room who are going to be mildly annoyed the whole time, and I'd rather use that than fight it. Don't give me the lecture — give me the plan for giving it.

  First: the order things have to come in, and what depends on what. My instinct is that before either view gets a name I need to pry apart three questions — what a law *is*, what we *do* with laws (explain, predict, support counterfactuals), and what makes a true generalization a law rather than a coincidence — because if I don't, they'll assume the explanatory job settles the metaphysics. Tell me if that's the right spine and what hangs off it in what order.

  Second: one example to carry the whole hour, and I want one I can bend rather than replace — something that does the accidental-generalization work, can be perturbed counterfactually, and can also be shrunk down to a single instance, so I'm not juggling three separate cases. Say what it has to have and what it has to lack, and why *not* the stock "all gold spheres are less than a mile across" type thing.

  Third: where in the sequence to kill each of these, and flag if any of them is a fake misconception they won't actually form — (a) Humeanism means laws are just summaries humans invented, it's a view about language; (b) so on Humeanism the future could be anything and theres no reason to expect the sun to come up; (c) "governing" as a literal push exerted on events; (d) the physics kids' version: the equations obviously tell the system what to do next, so what exactly is the disagreement.

  Fourth: one question at the end that discriminates between someone who got it and someone who can only say "regularity vs. necessitation." I was thinking of handing them a world containing exactly one atom that decays once, with nothing else that ever decays, and asking whether the decay law holds there. Is that a good instrument, and what does a right answer and a fake-right answer sound like?

  Fifth: what should I openly refuse to settle, and say out loud that I'm refusing? I'm guessing the simplicity half of "best-system" and whether tie cases are a real problem, but tell me if I should just flag and move on.

  Last: for each thing you'd have me say, mark whether both camps grant it or it's one side's premise. I don't want to present anti-Humeanism as the sane default, or Humeanism as obviously refuted, and I don't want to tell undergrads the literature has settled something it hasn't.
reasoning: |-
  Okay, let me tackle this step by step. The user is a TA preparing a 50-minute section on laws of nature, specifically Humean vs anti-Humean views, with physics majors likely skeptical. They want a lesson plan that leverages rather than fights that skepticism.

  First, the spine: prying apart the three questions (what laws are, what we do with them, what makes them laws vs coincidences) is absolutely crucial. If they don't disentangle these, students will conflate epistemological roles with metaphysical foundations - especially the physics majors who instinctively see equations as governing. That three-question structure creates necessary cognitive friction.

  For the example, the "gold sphere" stock example fails because it's too static. Need something with: temporal dimension (to show counterfactual fragility), manipulability (to test explanatory direction), and scalability to singleton cases. A radioactive decay world works perfectly - can shrink to one atom, imagine perturbations, and shows why accidental generalizations feel different from laws even when true.

  For misconceptions:
  (a) Humeanism ≠ subjectivism - must emphasize objective "best system" despite human inputs
  (b) Humean predictive reliability isn't threatened - the mosaic constrains
  (c) "Governing" as physical pushing is a caricature to avoid
  (d) Physics majors' equation-literalism needs reframing: the dispute is whether mathematical descriptions reflect ontology or constitute it

  The singleton decay world question is excellent because:
  - Humeans must say no law (insufficient regularity)
  - Anti-Humeans can say yes (law as metaphysical primitive)
  - Fake right answer: "It's a law because it happened" confuses instance with lawhood

  Openly refuse to settle:
  - Best system's simplicity/pragmatics - acknowledge subjectivity concerns but table
  - Tie cases - note as theoretical worry but not fatal
  - Whether governing implies modality - flag as live debate

  Throughout, I'll mark each point as [Both], [Humean], or [Anti-H] to prevent framing bias. The physics majors' intuition that "equations govern" gets validated as useful epistemology while questioning its ontological status - making their annoyance productive rather than adversarial.
answer: |-
  Here's a battle-tested plan designed to leverage physics majors' intuitions while forcing metaphysical clarity. Timing is tight—stick to the clock ruthlessly.

  ### **Spine & Sequence (45 mins + 5 min buffer)**  
  **Core Insight:** Separating *metaphysics* (what laws *are*) from *epistemology* (how we *use* laws) is non-negotiable. Physics majors often conflate the two.  

  1. **Hook (3 mins):**  
     - "You’re physicists. You see F=ma *telling* masses how to accelerate. But what if that ‘telling’ is metaphorical? What if reality is just particles doing their thing, and laws are *our* summary?"  
     - **[Both]** Flag: Today isn’t about *using* laws (which we all do), but what *grounds* them.  

  2. **The Three Questions (10 mins):**  
     Pivot around these—**write them side-by-side on the board**:  
     - **Q1 (Metaphysics):** What *is* a law of nature? (Is it a *feature of the world* or a *description*?)  
     - **Q2 (Epistemology):** What do we *do* with laws? (Explain, predict, support counterfactuals.)  
     - **Q3 (Demarcation):** What makes a true generalization a *law* (e.g., gravity) vs. a *coincidence* (e.g., all coins in my pocket are quarters)?  
     - **Crucial Move:** Have students brainstorm examples for Q2/Q3 *first*. Then: "But does knowing *how we use laws* tell us what they *are*? Could two theories agree on Q2/Q3 but clash on Q1?" Force the gap open.  

  3. **The Unifying Example: Singleton Radioactive Atom**  
     *Why it works:*  
     - **Scalable:** Start with "All atom X decays in 5s" (generalization). Shrink to *one atom* in an otherwise empty universe.  
     - **Bendable:** Ask: "If we *prevented* decay at t=4s, would it decay at t=5? If we duplicated this atom, would *that* one decay in 5s?" (Tests counterfactual robustness.)  
     - **Demarcates:** "Is 'this atom decays at t=5' a *law* or a *coincidence*?" (Reveals fault lines.)  
     - *Why not gold spheres:* Static, no "dynamics" to govern or counterfactually perturb. Physics majors will dismiss it as trivial. Radioactivity has causal/explanatory weight.  

  4. **Killing Misconceptions (15 mins):**  
     Address these **as they arise naturally** when presenting each view. Preemptively label:  
     - **(a) "Humeanism = laws are subjective/language"**:  
       - *Kill when introducing Best Systems:* "Lewis’ ‘best system’ depends on *our* values (simplicity, strength), but the *mosaic* is objective. The system fitting best isn’t ‘invented’—it’s *discovered* in the pattern." **[Humean]**  
     - **(b) "Humeanism = no reason to expect regularity"**:  
       - *Kill during Q2:* "Humeans say past regularity *is* reason to expect future regularity. The mosaic *just is* uniform—no ‘governing’ needed for prediction." **[Both]**  
     - **(c) "Governing = literal pushing"**:  
       - *Kill introducing anti-Humeanism:* "Anti-Humeans aren’t saying laws *shove* particles. ‘Governing’ means laws *metaphysically necessitate* events—they *make* the mosaic regular." **[Anti-Humean]**  
     - **(d) Physics majors’ "equations obviously govern"**:  
       - *Deploy during Q1:* "Sure, equations *describe* what happens. But do they *make* it happen? Imagine a universe with identical particle motions but no laws ‘dictating’ them—is that possible?" **Leverage their annoyance:** "Your intuition feels anti-Humean. But can you *prove* it’s not just a summary?"  

  5. **Discriminating Question: Singleton Decay World**  
     - **Question:** "In a world with exactly one atom that decays at t=5s—and nothing else ever decays—is there a decay *law*?"  
     - **Right Answer:**  
       - Humean: "No law—no regularity to summarize."  
       - Anti-Humean: "Yes—a law can be instanced once."  
     - **Fake-Right Answer:** "It’s a law because it happened" (confuses law with instance).  
     - **Why it works:** Forces confrontation with Q1 and Q3. Physics majors may initially say "no law" (needing regularity), exposing their latent Humeanism.  

  6. **Openly Refuse to Settle (Explicitly State!)**  
     - **Best System’s "simplicity"**: "Is simplicity objective or subjective? We won’t solve this—Humeans debate it too."  
     - **Tie cases**: "What if two systems are equally ‘best’? Worrisome for Humeans, but not necessarily fatal."  
     - **Whether "governing" requires modality**: "Anti-Humeans need necessity—but is that coherent? We’re bracketing this."  
     - **Flag:** "This is live philosophy—neither side is ‘refuted’."  

  ---

  ### **Flow with [Both]/[Humean]/[Anti-H] Tags**  
  - **Intro (3 min):** [Both] Distinguish metaphysics/epistemology using Q1-Q3.  
  - **Example Setup (5 min):** [Both] Build radioactive decay case (general → singleton).  
  - **Humeanism (10 min):** [Humean] Laws = summaries of mosaic. Best System = fit + strength + simplicity. Kill (a)/(b).  
  - **Anti-Humeanism (10 min):** [Anti-H] Laws = primitive entities governing events. Kill (c). Leverage (d) as intuition pump.  
  - **Clash (7 min):** [Conflict] Use singleton decay question. Contrast answers.  
  - **Refusals (3 min):** [Both] Flag unsettled issues (simplicity, ties).  
  - **Buffer (5 min):** Q&A on demarcation (Q3).  

  ---

  **Why This Works for Physics Majors:**  
  You’re validating their "governing equations" intuition as a *phenomenological truth* while challenging its *metaphysical necessity*. The radioactive decay example lets them engage with "real" physics while exposing hidden assumptions. By refusing to dismiss either view, you model philosophical rigor—and they’ll leave arguing, which is victory.
