prompt: |-
  I'm an undergraduate in a political theory seminar this term on whether the left-right distinction picks out anything real, and alongside the seminar I work about ten hours a week for a small nonprofit that maintains a Where do you stand? classroom tool: a bank of roughly eighty policy items, each tagged left, right, cross-cutting, or off-axis, that teachers run with high-school civics classes. My job, shared with two other interns who have no background in political theory, is to tag new items whenever an issue enters the news, which happens every week or two. The stakes are not trivial but not enormous: a miscoded item produces angry emails from parents, and a few years ago an item we tagged as cross-cutting was pulled from two districts after complaints, so our faculty advisor, a comparative politics professor, now has to sign off on anything we flag as difficult. We have about fifteen minutes per item, no budget for research, and often we cannot look up how parties abroad have lined up on the issue, so the procedure has to say what to do when the answer is simply unavailable to us rather than assuming an encyclopedia.

  What I need is a procedure we can actually run, grounded in the theories we have read rather than in vibes. In the seminar we have looked at the equality criterion defended in Bobbio's short book on the distinction, at the view that left and right are better understood as attitudes toward hierarchy and toward change versus preservation, at the skeptical view that each side is only a contingent coalition of positions that happens to have been assembled in a particular place and could come apart, at the two-axis alternative that adds a traditional-versus-secular or authoritarian-versus-libertarian dimension, and at the psychological suggestion that what holds a side together is a stable dispositional orientation rather than a principle. Please turn whatever is genuinely usable in that material into an ordered set of questions for us, and tell us which distinctions have to survive the simplification and which we can drop. In particular, tell us what has to be true of a new issue for it to go on the axis at all, and what has to be true for it to be marked cross-cutting or dropped as a valence item that nobody of any significance opposes. We have been using three rough tests and I suspect at least one is junk: the enemy test, where we code an issue by who is currently attacking it; the time-machine test, where we ask whether the issue would still have clustered with the same side if the last big party realignment had gone the other way; and the blind-pairing test, where we ask whether knowing someone's answer to the new item would let us predict their answers to two items we have already coded better than chance. Tell us which of these tracks what actually holds a side together and which merely inherits whatever coalition happens to exist right now, and where a test fails say so plainly. Mark explicitly the points at which the procedure stops with a no, and the points at which it has to hand the decision to our advisor because the question is one of values rather than facts — for instance, whose description of a proposal we adopt when one side calls a measure protective and the other calls it authoritarian.

  Then please run the procedure on three live items. First: eliminating single-family-only zoning near transit stations, so that apartment buildings can be built as of right. Second: requiring developers of frontier AI systems to obtain a license before training runs above a certain compute threshold, with a pause on the largest runs. Third: requiring photographic identification to vote, which our team has always treated as straightforwardly right-coded and which is our single most complained-about item. I should say that our working assumption is that the axis is largely exhausted and that our tags just describe current American coalitions, and I would rather not be told that our most contested item is an artifact of one country's party system, or that our whole US item set would fail a cross-national check — but if that is what the procedure delivers, please say it directly rather than softening it, since I would rather find out now than in a parent's email. I also want to know, honestly, what the procedure cannot do: which items will always be arbitrary, how often we should re-code the bank, and how to handle a case where my two co-interns reach different tags. One formatting note: please write the whole thing as continuous prose, with no headings, bullet points, bold text, or tables, because I have to paste it into our intern handbook as a single block of text and anything with markup in it renders badly.
reasoning: |-
  Okay, let me think through this complex political theory problem step by step. The user is an undergraduate working on a practical classification system for political positions, needing to bridge high-level theory with real-world constraints. 

  First, I need to consider their operational limitations: 15 minutes per item, no research budget, US-focused context, and occasional parental complaints about miscoding. Their existing tests (enemy, time-machine, blind-pairing) seem inconsistently grounded in theory. The seminar readings offer multiple frameworks - Bobbio's equality criterion, hierarchy attitudes, coalitional contingency, two-axis models, and psychological dispositions - but not all will survive translation into a usable procedure.

  The core challenge is determining what makes an issue "axial" versus cross-cutting or valence. From Bobbio, the equality/hierarchy dimension must be preserved as foundational. The coalitional contingency view suggests the time-machine test is flawed because it assumes fixed alignments. The psychological angle supports the blind-pairing test as measuring current coalitional bonds. The enemy test risks circularity but may capture real adversarial dynamics.

  For the procedure design, I'll prioritize questions that screen for: 1) whether the issue engages equality/hierarchy (Bobbio's core), 2) whether opposition exists beyond tactical disagreement, 3) current coalitional alignment via blind-pairing, and 4) international consistency where knowable. Valence items should be rare - only when opposition is politically insignificant. Cross-cutting applies when both sides contain substantial support, not just rhetorical overlap.

  On their test suite: the enemy test gets partial credit for identifying current conflict but fails theoretically by relying on contingent opposition. The time-machine test is junk - realignments prove positions aren't essential. Blind-pairing is empirically useful for mapping coalitions but can't distinguish principled from tactical alignment.

  For the live items: 
  - Zoning reform clearly engages equality (housing access) and aligns with current left coalitions despite counterarguments. 
  - AI licensing involves hierarchy (regulatory power) but shows cross-cutting elements (both sides have tech-skeptics). 
  - Voter ID is theoretically right-coded via hierarchy (electoral control) but controversial due to racial equity impacts - here the procedure exposes how US-specific coalitions distort theoretical purity.

  The procedure's limits: many items will have arbitrary edges; recoding should happen with major party shifts; intern disagreements require advisor escalation when theoretical criteria conflict with empirical signals. Most importantly, the US-centric approach will fail cross-national checks - that's unavoidable given their constraints but must be acknowledged upfront.
answer: |-
  Here is a procedure distilled from the seminar theories for your tagging task, designed for fifteen-minute assessments with minimal research. It prioritizes Bobbio's equality-hierarchy axis as foundational, incorporates coalitional contingency realistically, and uses the psychological disposition insight operationally. The two-axis models are simplified into a secondary check. Valence items and cross-cutting status have clear thresholds. The procedure explicitly flags when advisor input is needed for value judgments or insoluble ambiguity. Your existing tests are evaluated within it.

  **Procedure Steps:**

  Start by assuming the item engages a political division. First, apply Bobbio's core test: does the policy proposal primarily advance material or social equality by reducing entrenched advantages or hierarchies, or does it primarily defend existing hierarchies, traditions, or unearned advantages? If neither is clear or both impulses seem equally balanced in the item's core effect, proceed to step two. If it clearly advances equality, tentatively tag left; if it defends hierarchy, tentatively tag right. Second, assess if this is a valence issue: is there virtually no significant political opposition to the policy in any mainstream faction within the current US coalition (e.g., condemning terrorism, supporting disaster relief)? If yes, tag as off-axis (valence item) and stop. If not, proceed. Third, apply the blind-pairing test pragmatically: based solely on current US coalitions (accepting they are contingent), would knowing someone's support/opposition to this item allow you to predict their stance on two reliably coded left or right items (e.g., progressive taxation, abortion access, gun rights) better than chance? If yes, confirm the tentative tag from step one or apply the coalitional alignment if step one was inconclusive. If the blind-pairing test shows no correlation or predicts alignment with items on both sides, tag as cross-cutting. If the blind-pairing test contradicts the step one tag (e.g., Bobbio suggests left, but it aligns with right items), pause: this suggests a misalignment between principle and coalition. Hand this item to the advisor with both results noted.

  **Evaluating Your Tests & Key Distinctions:**

  The enemy test (coding by who attacks it) is unreliable junk for your purpose. It captures fleeting tactical opposition, not underlying principle or stable coalitional bonds. The time-machine test (would it align the same after a realignment?) is theoretically sound for identifying if a position is *essential* to a side (it wouldn't survive realignment if only coalitional), but it's impractical. You lack data and time for robust counterfactuals. Drop it. The blind-pairing test is retained but redefined: it doesn't reveal what *holds* a side together (principles or disposition); it reveals what is *currently* held together by the coalition. It's essential for operationalizing the contingent coalition view within your constraints. The distinction that *must* survive is Bobbio's equality-hierarchy core. It provides the only non-circular definition of the axis. The coalitional contingency and psychological disposition views explain *why* items cluster, not *what* the axis fundamentally is. The two-axis model distinctions (libertarian-authoritarian, secular-traditional) can be partially absorbed: if an item's hierarchy/equality dimension is ambiguous, but it clearly pits individual liberty against collective authority/order, it *might* be cross-cutting – but the blind-pairing test is the final arbiter under your constraints.

  **Handling Ambiguity & Advisor Escalation:**

  Escalate to the advisor when: 1. Step one (Bobbio's core) is genuinely ambiguous or balanced. 2. The blind-pairing test conflicts strongly with the step one tag. 3. Whose description of the policy's nature or effect to adopt is contested along ideological lines (e.g., "voter protection" vs. "voter suppression"). 4. Significant evidence suggests the issue is treated fundamentally differently in other stable democracies, challenging whether it's inherently axial. The procedure stops with a "no" (off-axis/valence) only at step two: if there is no significant opposition. If step one is unclear and blind-pairing shows no correlation, it stops with "cross-cutting".

  **Limitations & Practicalities:**

  *   **Arbitrariness:** Items where the equality-hierarchy dimension is weak or genuinely balanced (often cultural/symbolic issues) will always have arbitrary or contingent tags. The blind-pairing test minimizes arbitrariness but anchors it to the current coalition.
  *   **Recoding:** Re-run the blind-pairing spot-check annually or after major electoral shifts/realignments affecting core issues. Full recoding every 3-5 years.
  *   **Intern Disagreement:** If disagreement arises, first ensure step one (Bobbio) was applied consistently. If disagreement persists there, escalate to advisor. If disagreement is on blind-pairing, run a quick informal poll among politically engaged peers (if time) or default to cross-cutting if uncertain, flagging for advisor review.
  *   **What it Can't Do:** It cannot guarantee cross-national validity; US coalitions dominate the blind-pairing test. It cannot resolve whether a position is *essentially* left/right beyond the current coalition. It struggles with highly technical issues where the equality/hierarchy impact is indirect or disputed by experts. It relies on interns correctly intuiting the "core effect" in step one.

  **Applying the Procedure to Live Items:**

  1.  **Eliminating Single-Family-Only Zoning Near Transit:**
      *   Step 1 (Bobbio): Primarily advances equality by increasing access to affordable housing in desirable locations, dismantling a regulatory hierarchy privileging single-family homeowners. Tentative Left.
      *   Step 2 (Valence): Significant opposition exists (homeowner groups, some local governments). Proceed.
      *   Step 3 (Blind-Pairing): Support correlates strongly with support for affordable housing subsidies, rent control, public transit investment (Left items). Opposition correlates with support for property rights absolutism, local control (Right items). Confirms Left.
      *   **Tag: Left.** (Advisor escalation unlikely).

  2.  **Licensing/Pause for Frontier AI Training:**
      *   Step 1 (Bobbio): Ambiguous. Proponents see it as reducing hierarchy by preventing concentrated power/risks with unequally distributed AI. Opponents see it as creating bureaucratic hierarchy stifling innovation/equal access. Proceed.
      *   Step 2 (Valence): Significant opposition exists (tech industry, some libertarians). Proceed.
      *   Step 3 (Blind-Pairing): Current US alignment is volatile but nascent. Support correlates somewhat with tech regulation skepticism (e.g., antitrust action on big tech - often Left) but also with national security concerns (Right). Opposition correlates with deregulatory stances (Right) but also strong civil libertarian concerns (Left). Fails clear prediction for either side. Tag as Cross-Cutting.
      *   **Tag: Cross-Cutting.** (Advisor review recommended due to volatility; step one ambiguity).

  3.  **Requiring Photographic ID to Vote:**
      *   Step 1 (Bobbio): Proponents frame it as protecting electoral equality (one person, one vote). Opponents frame it as imposing a hierarchy by disproportionately burdening disadvantaged groups (minorities, poor, elderly) without equivalent evidence of fraud solved. This is a core value conflict *about* equality and hierarchy. The policy's *observed effect* (based on studies) is generally found to create a barrier with disparate impact. Applying Bobbio based on dominant empirical effect suggests it reinforces hierarchy. Tentative Right. *This is the point requiring advisor escalation* – whose description of the effect dominates? The team's current tag reflects the dominant empirical interpretation of effect, not the rhetoric.
      *   Step 2 (Valence): Intense opposition exists. Proceed.
      *   Step 3 (Blind-Pairing): Knowing someone supports Voter ID strongly predicts opposition to expansive voting access (e.g., automatic registration, mail-in voting - Left) and support for law-and-order policies (Right). Confirms Right *within the current US coalition*.
      *   **Tag: Right.** (BUT flag for advisor due to the step one value judgment regarding effect description. The procedure confirms its current coalitional alignment (Right) is stable per blind-pairing). *Crucially:* The procedure exposes that its contentiousness stems precisely from the conflict over its hierarchical impact description. Its Right tag is robust *for your US-focused tool* based on coalition, but the theory highlights why it's contested: disagreement on the equality/hierarchy question itself. It *is* an artifact of the US coalition (e.g., center-right parties in some European nations support national ID systems used for voting without similar controversy), but your procedure, accepting US coalitions via blind-pairing, codes it Right.

  The procedure confirms your most contested item (Voter ID) is correctly tagged Right *for your tool's purpose* based on current US coalitions (blind-pairing), but forces explicit recognition that this rests on accepting a specific characterization of its hierarchical effect (Step 1), which is the core of the dispute and requires advisor sign-off due to being a value-laden interpretation. It highlights the tension between the theoretical axis (equality-hierarchy) and contingent coalitions, which is unavoidable in your practical task.
