  ### Activity: Veil of Ignorance Lottery Construction  
  **Goal:** Experience Harsanyi’s insights—additive separability prevents "ramping up" priority for the worst off, and weights are morally arbitrary—through a hands-on veil-of-ignorance game.  

  **Time Allocation:**  
  - Setup (5 min)  
  - Game Part 1: Lottery Choice via Point Bidding (20 min)  
  - Game Part 2: Identity Revelation & Payoff (5 min)  
  - Debrief (45 min)  

  **Materials:**  
  - **Whiteboard:** Track probabilities, bids, and outcomes.  
  - **Index Cards (12):** Each pre-printed with a unique vNM utility function over money (normalized to [0,1] for $0–$100). Examples:  
    - *Linear:* \( u(m) = m/100 \)  
    - *Square Root:* \( u(m) = \sqrt{m}/10 \)  
    - *Quadratic:* \( u(m) = (m/100)^2 \)  
    - *Log:* \( u(m) = \log_{10}(1 + 9m/100) \) (scaled)  
  - **Tokens (e.g., poker chips):** 100 tokens per participant (worth nothing, used for bidding).  
  - **Dice/Randomizer:** Resolve lotteries.  

  **Rules & Setup:**  
  1. **Veil of Ignorance:**  
     - Participants do not know which identity (utility function) they will assume.  
     - Each holds an index card with a utility function (kept secret until payoff).  

  2. **Lottery Choice:**  
     - Two social states (lotteries) are proposed:  
       - **State A (Unequal):**  
         - 50% chance: $100 to one person, $0 to others.  
         - 50% chance: $0 to all.  
       - **State B (Stable):**  
         - 100% chance: $50 to all.  
     - **Initial Probability:** 50–50 between A and B (marked on whiteboard).  

  3. **Bidding Phase:**  
     - Participants spend tokens to shift probabilities:  
       - Bid **for A** (increase chance of Unequal state).  
       - Bid **for B** (increase chance of Stable state).  
     - **Mechanic:**  
       - New \( P(\text{State A}) = \frac{\text{Total bids for A} + 1}{\text{Total bids for A} + \text{Total bids for B} + 2} \) (avoids division by zero).  
       - E.g., 10 bids for A and 20 for B → \( P(A) = 11/32 \approx 34.4\% \).  
     - **Secret Bids:** Write bids on index cards, submit simultaneously.  
     - **Constraint:** Max 50 tokens per bid (prevent dominance).  

  4. **Outcome & Payoff:**  
     - Compute probabilities, resolve lottery with dice.  
     - Randomly assign identities by shuffling index cards and redistributing.  
     - Calculate individual utility: Apply assigned \( u_i \) to money received.  
     - **Example:**  
       - State A drawn → dice roll selects who gets $100 (others get $0).  
       - Person with \( u(m) = \sqrt{m}/10 \) gets $100 → utility = \( \sqrt{100}/10 = 1 \).  

  ---

  ### Predictable Challenges & Learning Moments  
  **First Run Predictions:**  
  1. **Bid Distribution:**  
     - Most bid heavily for **State B** (intuitive inequality aversion).  
     - A few bid for **State A** (gamble for $100 payoff).  
     - Result: \( P(\text{B}) \) often >80%.  

  2. **Identity Revelation Shock:**  
     - Participants who bid for A and received low-utility identities (e.g., log) "lose" (low utility).  
     - Bidders for B get moderate utility, but those assigned high-curvature utility (e.g., quadratic) still feel "cheated" if $0.  

  3. **Utility Calculation Confusion:**  
     - Some miss that utility is *not linear with money* (e.g., $50 → 0.25 for quadratic).  
     - Clarify during debrief: "Your happiness depends on your card’s math."  

  ---

  ### Debrief: Mapping Game to Harsanyi  
  **(45 min; reveal "Harsanyi" at the end)**  

  1. **Assumption 1: Individual vNM Rationality (5 min)**  
     - *Game Moment:* Index cards enforce vNM utilities (curvature = risk aversion).  
     - *Debrief Q:* "Did your bids align with your risk tolerance? Why did linear bidders gamble more?"  
     - *Insight:* Curvature shapes choices—no moral weighting yet.  

  2. **Assumption 2: Social vNM Rationality (10 min)**  
     - *Game Moment:* Group’s lottery choice satisfied independence/continuity (bids shift probabilities linearly).  
     - *Debrief Q:* "Why did we use point bids? What if we voted instead?"  
     - *Insight:* Bidding mechanizes social vNM—aggregation is linear.  

  3. **Assumption 3: Pareto Indifference (15 min)**  
     - *Game Moment:* When State A won, society was *not* indifferent between winners/losers.  
     - *Critical Example:* Contrast two scenarios:  
       - **Case 1:** All indifferent → e.g., both states give all $50.  
       - **Case 2:** Real game → losers of $0 are worse off.  
     - *Debrief Q:* "Could we design bids to prioritize the worst off? What broke?"  
     - **Key Insight:** Additivity forces *no extra weight* on the poor. To prioritize them, you must violate Pareto indifference (if they suffer, society can’t ignore it).  

  4. **The Weight Ambiguity (10 min)**  
     - *Game Moment:* Tokens spent = social weights. High bidders skewed outcomes.  
     - *Debrief Q:* "Who decided the weights? Was it 'fair'?"  
     - **Key Insight:** Weights are arbitrary! The game’s bidding (your tokens) set them—no ethical anchor. Moral weight comes from *outside* (e.g., Rawls, egalitarianism).  

  5. **What the Game Can’t Show (5 min)**  
     - *State Clearly:* "The theorem forces additivity, but the game can’t *derive* the math—only experience its consequences. Derivation is for after."  
     - *Name Drop:* "This is Harsanyi’s aggregation theorem. You’ve felt its three axioms and their limits."  

  ---

  ### Why This Works  
  - **Discovery Over Derivation:** Bidding makes weights tangible; identity shock exposes additivity’s distributional limits.  
  - **Flaws as Lessons:** Failed priority for the poor highlights Pareto’s necessity; token spending reveals moral arbitrariness.  
  - **No Laptops, No Problem:** Physical tokens + cards force engagement; whiteboard visualizes probability shifts.  

  **Timing Buffer:** Shorten Part 1 if bids run long. Focus debrief on "why weights?" and "why no poor priority?"—the core insights.
