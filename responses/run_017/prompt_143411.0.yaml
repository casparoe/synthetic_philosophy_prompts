answer: |-
  **FINAL EXAMINATION QUESTION**  

  **Law & Behavioural Science Seminar**  
  **Time Allowed: 90 Minutes**  
  **Answer ONE Question**  

  ---

  ### Question 1: The Autonomy Paradox in Precommitment  
  The Republic of Marenne entrenches a "Stability Lock" after a sovereign debt crisis. Its key features are:  
  - A cap on the structural deficit;  
  - Any law breaching the cap requires a two-thirds parliamentary majority and a referendum (held ≥60 days later);  
  - An independent Fiscal Guard (9 members, 12-year terms, removable only for incapacity) certifies breaches and emergency exemptions;  
  - Amending the Lock itself requires a three-quarters parliamentary majority plus a referendum.  

  Twenty-five years later, three issues arise simultaneously:  
  1. **Wrong-Siren Problem**: A pandemic prompts emergency borrowing, but the Fiscal Guard deadlocks (4-4, 1 recusal) on whether epidemics qualify for exemption. The original exemption cited "armed conflict or natural catastrophe."  
  2. **Ratchet Asymmetry**: Parliament has added new protected spending mandates to the Lock but never relaxed the cap, making the constraint stricter over time.  
  3. **Borrowed-Mast Problem**: A province that joined the union *after* the Lock’s enactment holds a majority opposing its fiscal constraints, arguing it never consented.  

  **Define**:  
  - **Wrong-Siren**: A precommitment triggers in unanticipated circumstances, not just against the temptation it was designed to resist.  
  - **Ratchet Asymmetry**: Constraints tighten unidirectionally (e.g., adding obligations without easing limits).  
  - **Borrowed-Mast**: An entity bound by a precommitment it did not design or endorse.  

  **Your Task**:  
  What must be true of a precommitment device for binding a later agent (individual or collective) to qualify as an *extension of autonomy* rather than a *restriction*? Does this account hold when tested against Marenne’s wrong-siren problem, ratchet asymmetry, borrowed-mast issue, and delegated enforcement? Or do common design solutions (e.g., sunset clauses, broad emergency terms, periodic reauthorisation, symmetric amendment rules) reintroduce the self-serving discretion the device aimed to prevent?  

  ---

  ### Model Answer (760 words)  
  Precommitment devices resolve a core tension: how can restricting future choices affirm autonomy? The answer hinges on whether the constraint enables the agent to overcome a known cognitive or political failure *in a way the agent would endorse upon reflection*. For binding successors to extend autonomy, three conditions must hold:  
  1. **Reason-Responsiveness**: The constraint must target a specific, predictable threat to rational agency (e.g., hyperbolic discounting, myopic populism), not general preference shifts.  
  2. **Revisability**: The device must permit amendment *under conditions that approximate those of its creation* (e.g., calm deliberation), ensuring later agents can recalibrate it without facing the original temptation.  
  3. **Endorsement Test**: The constraint must align with the later agent’s deeper values or interests, even if not their immediate preferences.  

  **Marenne’s Challenges**:  
  - **Wrong-Siren**: The Fiscal Guard’s deadlock reveals a flaw in *reason-responsiveness*. The exemption clause was designed for impulsivity during crises (e.g., wartime overspending) but misfires when unforeseen events (a pandemic) trigger rigidity. Autonomy requires constraints to resist *irrationality*, not *all change*. Here, the Lock restricts adaptation to a novel threat unrelated to fiscal impulsivity, failing the endorsement test: a society facing a lethal pandemic would not rationally reject borrowing. Design fixes like broadly worded exemptions risk self-serving loopholes (e.g., labelling any spending "emergency"), but narrow terms create brittle constraints. This tension is irreducible: precommitments trade flexibility for robustness.  

  - **Ratchet Asymmetry**: Adding protected spending while tightening the cap violates *revisability*. Asymmetric amendment rules (easy to add constraints, hard to remove) exploit precommitment logic to entrench interests, not protect rationality. The original Lock targeted deficit bias; post-enactment mandates (e.g., pension guarantees) serve new goals. Binding successors to these *without symmetric renegotiation* substitutes paternalism for autonomy. Periodic reauthorisation might seem a solution, but if timed during crises (e.g., recessions), it recreates the impulsivity the device avoids. Only symmetric amendment thresholds (equal ease to add/remove constraints) permit reason-responsive refinement.  

  - **Borrowed-Mast**: The province’s objection highlights a legitimacy gap. For inherited obligations to affirm autonomy, the precommitment must either (a) serve the new agent’s interests (e.g., stability benefits all members) or (b) include equitable exit/renegotiation mechanisms. Marenne’s Lock fails both: accession implies tacit consent, but ratcheting disproportionately burdens latecomers, and the three-quarters/referendum hurdle makes renegotiation impractical. Sunset clauses could mitigate this by forcing re-evaluation, but they risk lapsing during moments of temptation, nullifying the device’s purpose.  

  **The Enforcement Dilemma**:  
  The Fiscal Guard’s deadlock and institutional interests expose a fourth problem: delegated enforcers must be both *insulated from politics* and *accountable to purpose*. Odysseus’ crew obeyed because they were deaf to the Sirens; the Guard, as an artificial agent, faces conflicting incentives (e.g., preserving its authority). This misfire shows that enforcement cannot be fully depoliticised. Design solutions (e.g., shorter terms, clearer mandates) may reduce but not eliminate discretion, reopening self-serving reinterpretation.  

  **The Deeper Paradox**:  
  Precommitments aspire to bind *actions* without freezing *values*. Yet rigidity in changing circumstances (wrong-siren) or asymmetric ratchets inevitably privileges past priorities over present agency. Even "ideal" designs falter:  
  - Sunset clauses restore flexibility but surrender to short-termism.  
  - Broad exemptions invite bad-faith emergency claims.  
  - Symmetric amendment rules permit weakening during temptation.  
  The autonomy-compatibility of precommitment thus depends on contextual *judgment*—whether the device’s *structure* enables later agents to reconcile its constraints with their reflective interests. In Marenne, the Lock fails because ratcheting and poor emergency design prevent such reconciliation.  

  **Conclusion**:  
  Binding successors extends autonomy only when:  
  (i) Constraints target identifiable, persistent threats to rationality;  
  (ii) Amendment mechanisms mirror the original deliberative conditions;  
  (iii) The device integrates new agents’ interests.  
  Marenne’s Lock satisfies none: its wrong-siren rigidity ignores context, ratcheting entrenches past politics, and accession lacks renegotiation. Crucially, *no design fix wholly escapes the trade-off between commitment and agency*. Solutions like symmetric amendments or sunsets approximate autonomy by enabling revisability but reintroduce the risk of myopic override. Precommitment thus remains a necessary but inherently imperfect tool—one that protects agents from themselves only if it preserves their capacity to redefine themselves.  

  ---  

  ### Marking Scheme (25 Total)  
  | **Must-Hit Point**                                                                 | **Marks** | **Common Error**                                  |  
  |------------------------------------------------------------------------------------|-----------|---------------------------------------------------|  
  | **1. Identifies *reason-responsiveness* as core to autonomy**: Explains constraints must target predictable threats to rational choice, not change itself. | 5 | Vaguely cites "consent" or "foresight" without linking to irrationality. |  
  | **2. Diagnoses *revisability failure* in ratchet asymmetry**: Highlights asymmetric amendment as autonomy-violating (binds new goals without recalibration). | 5 | Labels ratcheting "unfair" without explaining *why* asymmetry undermines autonomy. |  
  | **3. Tests design fixes against self-threat**: Shows how sunsets/broad exemptions reintroduce impulsivity or self-deception. (*Flag: Judgment-dependent*) | 5 | Asserts fixes "balance" rigidity/flexibility without analyzing trade-offs. |  
  | **4. Explains *borrowed-mast* via interests/exit**: Notes tacit consent requires serving new agents' interests or permitting renegotiation. | 5 | Treats "no consent" as decisive without examining integration/exit mechanisms. |  
  | **5. Synthesizes tension**: Argues precommitment’s legitimacy hinges on enabling *reflective endorsement* amid change, not perfect design. | 5 | Lists problems separately without unifying under autonomy theory. |  

  ---  

  ### A vs. B Answer Differentiation  
  - **B Answer (15–18/25)**:  
    Accurately summarizes Marenne’s problems using defined terms. Explains why each challenge threatens autonomy (e.g., ratcheting prevents re-evaluation). Compares design fixes (e.g., "Sunsets allow updating but risk lapse during crises"). Fails to unify issues under a coherent theory of *how precommitment extends agency*. May treat rigidity and revisability as a "balance."  

  - **A Answer (20–25/25)**:  
    **The Crux**: Shows that autonomy depends on *reconciling commitment with reason-responsive endorsement over time*. Uses Marenne to argue:  
    - Rigidity (wrong-siren) and ratchets prevent later agents from aligning constraints with their reflective interests.  
    - Delegated enforcement and design fixes are *secondary* to whether the device’s structure permits this reconciliation.  
    **Insight**: Highlights that the paradox is *inescapable*—precommitment restricts choice to affirm deeper agency, but only if the device itself can evolve *without* being hijacked by temptation. Does not seek a "solution" but evaluates designs by how they navigate this tension.
