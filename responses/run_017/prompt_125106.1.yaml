answer: |-
  ## Speech: The Map and the Territory

  [Adjust microphone, no preamble]

  Right. You’ve heard the speeches. You’ve got the shirt: “p < .05 is not a decision.” Good. Keep that close.

  Today, we talk about information. Specifically, about a theorem from Jack Good – a theorem that, for those of us in this racket, quietly governs much of what we do, even if you’ve never heard his name. It tells us about the *value* of information for making decisions.

  The theorem is elegant. Brutally so. It says: For a rational decision-maker – someone who updates beliefs correctly and maximizes expected utility – *free information cannot have negative expected value.* It can be worth zero. But it can't hurt you *in expectation* before you see it. The kicker is *why* it can be worth zero: only if *no possible outcome* of that information would change your optimal action. If there’s even one scrap of data that *could* flip your decision, then that free information suddenly has positive expected value. Conversely, a signal so noisy it *probably* won’t change your mind might still be worth grabbing if it *might*, while perfect information on the same question could be immensely valuable.

  So, the usual send-offs? “Go gather more evidence”? The theorem says that’s only good advice if that evidence *stands a chance* of altering your course. Otherwise, it’s empty calories. “Decide and stop listening”? The theorem demolishes that. Refusing free information, if it *could* matter, is irrational. It leaves value on the table. It’s actively harmful in expectation.

  This leaves us in a bind. What *do* we say? The theorem gives us a powerful guarantee, but it’s a specific kind of guarantee. Two crucial limitations frame its power, and *that’s* what I want you to carry.

  **First, the guarantee is *ex ante*.** It’s about the *policy* of seeking information *before you know what it says*. It promises that, *on average*, looking won’t hurt. But *after* you look? Oh, absolutely. A specific finding *can* leave you demonstrably worse off than blissful ignorance. Finding out your project is doomed when you could have blissfully wasted resources? Learning a painful truth about someone you trusted? Good’s theorem doesn’t deny that sting. It just says the *policy* of looking was still the right bet *before you knew*. The value was in the *potential* for a better decision, even if this time, you drew the short straw. The regret is real, but it’s the cost of playing a game stacked in your favour over the long run. Don’t confuse the pain of a specific outcome with a flaw in the strategy.

  **Second, the theorem takes your ends as given.** It assumes your utility function is fixed. It tells you how to get what you *already want* more efficiently. It has absolutely nothing to say about information that *changes what you want*. Information that shifts your values, reshapes your goals, alters your very sense of purpose. And let’s be honest: that’s what these last two years were *really* about for most of you, wasn’t it? Not just learning *how* to analyze, but encountering ideas, people, and problems that fundamentally reshaped *why* you want to analyze, and *what* you want that analysis to achieve. Good’s theorem is silent here. This is the territory beyond the map it draws.

  So, what does this mean for you, tomorrow? What line *can* we draw?

  You’re going into a world where people will often ask you for analysis *after* they’ve decided. Where the “free information” you generate feels like a formality, a box to tick. Where the theorem’s logic seems mocked.

  Here’s the third thing. Your job isn’t just to provide information that *might* change a decision *if* the decision-maker is an idealized rational agent waiting for your signal. Your job, armed with this understanding, is **to make the cost of ignoring the map visible.**

  Remember the shirt: “p < .05 is not a decision.” Your analysis, your information, your model – they are *maps*. Good’s theorem tells us that acquiring a better map *before* setting off is usually the smart policy. But once the map exists? The value isn't just in *having* it; it’s in *what it shows about the terrain ahead*. A p-value isn’t a decision. A confidence interval isn’t a decision. A cost-benefit ratio isn’t a decision. They are features *on the map*.

  **When they’ve already decided, your job is to show them *what they’ve decided to risk*.** Show them the cliffs hidden in the fog of their conviction. Quantify the swamp they’re charging into. Illuminate the alternative paths, not as abstract possibilities, but as concrete trade-offs with measurable consequences laid bare by your analysis. Make the *ignoring* of the information – the *refusal* to let it change the action – a conscious choice with explicit costs attached. Force the decision, the *real* decision, out of the shadows of intuition and into the light of consequence.

  Good’s theorem assures you that seeking better maps is sound policy. It cannot shield you from the disappointment when someone chooses to wander off the edge of yours. It cannot capture how the journey itself redrew your own destination. But it *does* arm you with the understanding of what a map is for: not to *make* the decision, but to force a reckoning with the landscape of risk and reward that the decision inhabits.

  So go. Draw good maps. Understand the profound, limited guarantee that seeking them is wise. And when they’ve already chosen their path, make damn sure they know what lies along it, and what they passed by.

  [Brief nod, step back]

  ---

  **Speaker's Notes: Commitments & Clarifications**

  1.  **Ex Post Regret:** You can unequivocally state that a *specific* finding can leave a decision-maker worse off *ex post* than if they had never looked. The theorem's "no negative expected value" is purely *ex ante*. *Ex post*, the realized utility after seeing information can absolutely be lower than the utility of the action they would have taken without it. This is measurable via loss functions or regret. The value of information is the *reduction in expected loss* before seeing it. A negative outcome post-information is consistent with the theorem; it simply means that, *in that specific instance*, the information didn't lead to a better outcome, and might even have triggered a worse one, despite the *policy* of acquiring it being sound on average. You can say: "A specific finding can leave you worse off. The theorem guarantees the *act of looking* won't harm you *on average, beforehand*; it doesn't guarantee every look ends well."

  2.  **Information Changing Aims:** It is entirely fair and accurate to say Good's theorem falls silent on information that changes an agent's fundamental preferences or utility function. The theorem explicitly assumes a fixed utility function over outcomes. Information that reshapes *what* the agent values, their goals, or their ethical framework exists entirely outside the scope of the classic value of information calculation. This is a critical limitation, especially in contexts like education or profound personal experiences. You are correct that this is a major part of what graduate school does. Stating this is not a misinterpretation; it's highlighting a boundary condition.

  **Corrections to Your Statement:**
      *   **"Free signal worth exactly nothing unless..."**: This is correct.
      *   **"Free signal that's too noisy... can be worth nothing while perfect information... worth a great deal"**: This is *mostly* correct but needs nuance. A very noisy signal *can* have positive expected value *if* there's *any* possible outcome (even a low-probability one) that would change the optimal action. It's only worth *exactly zero* if *literally no possible outcome* would change the action. A signal can be very noisy and still have positive expected value if the stakes are high enough and there's a slim chance it provides decisive information. The value of perfect information (EVPI) sets an upper bound, and a noisy signal's value can range from zero up to (but not exceeding) the EVPI.
      *   **"Free"**: This implicitly means "at negligible cost". The theorem extends to costly information (value = expected benefit - cost), but the core "it can't hurt in expectation" relies on the cost being negligible or zero. Your usage is standard.
      *   **Assumptions**: You correctly identified the core assumptions: Expected Utility maximization, Bayesian updating, fixed utility function, known decision problem (available actions and their outcome-utility mappings, conditional on states and signals). The theorem also assumes the agent knows the likelihood function (P(Signal | State)).

  **Position:** You can confidently state the ex post regret point and the limitation regarding changing preferences. The nuance on noisy signals having *potential* positive value even if noisy is important for rigor, but doesn't undermine your core argument for the speech. The speech's core message – the ex ante guarantee, the ex post risk, and the silence on changing aims – is soundly based on the theorem and its standard interpretations. The concluding advice ("show them what they've decided to risk") is a powerful and legitimate application of the underlying logic to the practical reality your graduates face, respecting the theorem's constraints while moving beyond its narrowest formulation.
