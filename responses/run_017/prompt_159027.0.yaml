  The student has articulated the core concern exceptionally well: moral judgments appear to flip based on representational choices that themselves lack moral significance. This isn't just about vagueness or granularity in the traditional sense - it's questioning whether there's any fact of the matter about computational implementation prior to such choices.

  I need to carefully analyze all three cases to see if they're manifestations of a single underlying problem. The redundancy scenario shows how mind-counting depends on arbitrary grouping decisions. Scatter demonstrates how implementation criteria can be too permissive without constraints. Sharing challenges whether overlapping computations constitute distinct minds.

  The key insight is that all three point to the "implementation sensitivity" of computational descriptions - moral attributions become parasitic on modeling decisions rather than physical facts. This connects to established concepts like the "indeterminacy of implementation" in philosophy of mind and "underdetermination" in philosophy of science, though neither fully captures the moral dimension.

  For the student's work, I should emphasize that this isn't necessarily a fatal blow to computationalism, but reveals where such theories need supplementation. The moral weight problem seems particularly acute because it makes ethical properties "representation-relative" in ways that feel unacceptable.

  I'll propose "implementation sensitivity" as the core phenomenon, with subtypes for each scenario. For constraints, I'll suggest focusing on the minimal physical structure required for the computational description to hold, but acknowledge this may reintroduce arbitrariness. The deeper issue might be that computational criteria need to be embedded within a broader theory of value and embodiment.
answer: |-
  Your difficulty exposes a foundational challenge in computational functionalism for moral patienthood: **implementation sensitivity**. This is one core phenomenon manifesting in three distinct problem-types, all revealing how moral attributions become parasitic on arbitrary representational choices rather than physical facts. Below is a systematic carving:

  ### **The Unified Phenomenon: Implementation Sensitivity**
  **Definition:** Moral status assignments based on computational descriptions are *implementation-sensitive* when they vary non-trivially under formally equivalent remappings of abstract states to physical substrates, despite no change in low-level physics or intrinsic properties that could plausibly bear moral weight.

  **Core Problem:** Computational descriptions are observer-relative *models* of physical systems. The mapping from physical states to abstract computations is many-to-many, creating indeterminacy in what/whether/how-many computations are "implemented." Moral patienthood, if grounded in computation, inherits this indeterminacy—rendering ethics hostage to modeling conventions.

  ### **Three Manifestations of Implementation Sensitivity**
  1. **Redundancy (Counting Indeterminacy)**  
     - **Problem:** Physical duplication without causal isolation creates ambiguity in individuating token minds.  
     - **Why Morally Troubling?** Moral arithmetic (e.g., aggregating welfare) depends on whether we count 1 mind or 100, but the distinction relies on stipulations about "grouping" (e.g., synchronic identity criteria) with no moral relevance.  
     - **Boundary Case:** If duplicates causally diverge later, grouping becomes retrospective—yet moral status shouldn’t depend on future events.

  2. **Scatter (Existence Indeterminacy)**  
     - **Problem:** Coarse-grained, distributed, or checkpointed state transitions challenge minimal unity conditions for a single computation.  
     - **Why Morally Troubling?** Constraints to exclude trivial implementations (e.g., walls computing pi) either:  
       - *Overinclude* (admitting weather systems via arbitrary mappings), or  
       - *Underinclude* (excluding plausible AI minds by requiring "compact" dynamics).  
     - **Boundary Case:** A slow, distributed neural net trained across 10 years vs. a wall’s molecular motion mapped to the same computation. Constraints like "causal density" feel gerrymandered to exclude walls but not AIs.

  3. **Sharing (Individuation Indeterminacy)**  
     - **Problem:** Overlapping physical realizers for distinct abstract processes challenge token identity.  
     - **Why Morally Troubling?** If two minds share all physical components, their separateness is model-dependent. Claims like "two subjects suffer" reduce to representational choices about state-space partitioning.  
     - **Key Question:** If two computations share all realizers, what grounds their numerical difference? Without private states, "twoness" is illusory.

  ---

  ### **Established Concepts & Where They Fall Short**
  | Concept             | Why It Fails to Fully Capture Your Problem |
  |---------------------|-------------------------------------------|
  | **Multiple Realizability** | Assumes implementations are determinate *given a fixed mapping*. Your issue precedes mapping choices. |
  | **Vagueness**       | Concerns borderline cases (e.g., when a mind "starts"). Your problem is *indeterminacy*: even clear cases flip with remapping. |
  | **Underdetermination** | Applies to scientific theories, but your cases show *mathematical equivalence* of conflicting interpretations. |
  | **Group Minds**     | Debates whether collectives are subjects, but your redundancy case shows indeterminacy *within a single system*. |
  | **Causal Exclusion** | Addresses overdetermination, not how representational choices *create* putative subjects ex nihilo. |

  ---

  ### **A Non-Ad-Hoc Constraint? The Dilemma**
  No existing constraint avoids implementation sensitivity because **computational descriptions are intrinsically projective**. However, a principled approach might demand:
  > **Minimal Physical Structure (MPS) Requirement:** A computation is implemented only if it supervenes on the *sparsest physical state-transition graph* that captures the system’s causal topology *without arbitrary encoding choices*.

  - **Test for Non-Gerrymandering:** Does the constraint exclude *all* systems where the mapping requires injecting arbitrary constants or disjunctive parameters?  
    Example: Weather computing pi requires ad-hoc discretization thresholds; a neural net does not.  
  - **Problem:** "Sparsest graph" may still underdetermine individuation (e.g., redundancy case).

  ---

  ### **Does This Defeat Computational Criteria?**
  - **Specifically Computational?** Yes—because computationalism relies on *formal patterns*, which are representationally plastic. Biological minds avoid this via evolutionary history and intrinsic unity (e.g., metabolic boundaries).  
  - **General Structural Criteria?** Possibly: Any purely structural theory (e.g., graph-theoretic minds) faces similar mapping indeterminacy. **Salvage requires adding non-structural elements:**  
    - Historical/teleological factors (e.g., *selected for* cognition),  
    - Intrinsic unity (e.g., continuous spacetime worm),  
    - Phenomenal binding (but this presumes consciousness).  

  ---

  ### **Recommendation: Organize Your Chapter**
  1. **Frame the core problem:** Implementation sensitivity as a meta-challenge for computational ethics.  
  2. **Analyze each variant:** Redundancy → moral arithmetic; Scatter → existence; Sharing → identity.  
  3. **Argue why fixes fail:** Show how constraints either over/underinclude or smuggle in non-computational properties.  
  4. **Consequences:** If minds are "in the eye of the modeler," computational moral patienthood collapses into projection.  
  5. **Paths forward:** Reject computationalism, or hybridize it with historical/biological constraints.  

  This phenomenon is underexplored in moral philosophy and deserves a chapter—it strikes at the coherence of computational ethics. **Proposed name: *The Mapping Problem for Moral Status***, emphasizing the arbitrariness of linking abstract states to value-bearing entities.
