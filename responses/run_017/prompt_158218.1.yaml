  **Structure of the Activity:**
  - **Introduction (10 minutes):** Explain the roles, the products, the inputs, the reporting form, and the scoring. Assign groups. Each co-op has a name and is given an initial stock (10 red, 10 blue). The planning group is given the initial prices and the adjustment rule.
