prompt: |-
  I sit on the algorithmic accountability board of a public health insurance program, and we vote Friday on a vendor's proposal.

  The vendor wants us to allow adverse coverage decisions to rest on what their team calls a latent veracity readout. Their argument is that written justifications are cheap rationalizations the model can generate for any verdict, so instead of asking the system for a reason, they run the case file through a few dozen paraphrases and reframings, keep whichever verdict survives all of them, and treat that invariant verdict as what the system actually knows. On files whose outcome was later settled on appeal, the readout beats the system's written output.

  The case in front of us: a claimant's infusion therapy was denied on the strength of the readout, while every written explanation the system produced for that same file was coherent, checkable, and pointed the other way. Two further facts. On the handful of files where the written output was confidently wrong, the readout was wrong in the same direction. And our red team found that the readout shifts when the same clinical facts are simply reordered within the file.

  Our rules require that a denial state the basis on which it was made; the vendor proposes a form letter naming the readout as that basis.

  Draft the memo I will circulate before the vote as exactly five numbered items, one or two sentences each, with no heading and no closing: item 1 the bottom line, whether to approve, reject, or approve with conditions, and if any pilot is permitted, for how long and subject to what check; items 2 through 4 the three considerations that should carry the most weight with the board, including whether what the system really knows is even well defined here given that the method can only be graded where we already know the answer; item 5 the strongest argument for the option you did not pick, and why it still loses. Use American English.
reasoning: |-
  Hmm, the user is on an algorithmic accountability board for a public health insurance program and needs help drafting a memo about a vendor's proposal involving a "latent veracity readout" for coverage decisions. They have to vote on Friday.

  The vendor claims that written justifications from AI systems are unreliable "cheap rationalizations," so they instead run case files through multiple paraphrases and reframings, keeping only verdicts that remain consistent across all versions. They call this the "latent veracity readout" and claim it outperforms the system's written explanations in cases where appeals later settled outcomes.

  The specific case in question involves a claimant whose infusion therapy was denied based on this readout, even though all written explanations from the system actually supported approval. Additional concerns include: when written outputs were confidently wrong, the readout was wrong in the same direction; the readout changes when clinical facts are simply reordered; and the program requires denials to state their basis.

  The user wants me to draft a memo with exactly five numbered items: first stating the bottom line recommendation; then three key considerations; and finally the strongest argument for the opposing view and why it's insufficient. Needs to be concise - one or two sentences per item, no headings or closings, in American English.

  For the bottom line (item 1), I should recommend rejecting the proposal outright. The readout seems unreliable and unverifiable, plus it violates the requirement for stated bases in denials. The reordering vulnerability shows it's not truly consistent knowledge.

  For the key considerations (items 2-4):
  - Item 2 should address the reordering instability - showing the method doesn't capture genuine understanding.
  - Item 3 should highlight the specific case where it contradicted all coherent written explanations.
  - Item 4 should focus on auditability issues - we can't verify "what the system knows" in real cases without appeal outcomes.

  For the opposing argument (item 5), the strongest point is the vendor's claim about performance on appealed cases. But this loses because we only have data where outcomes were known, ignoring cases without appeals, and it doesn't justify violating transparency rules.

  I need to keep everything concise and impactful, using plain American English. The memo should be structured exactly as specified to prepare board members for the vote.
answer: |-
  1. Reject the proposal; no pilot is permitted given the instability and transparency failures, as the method violates our requirement for stated bases and shows fundamental unreliability under controlled testing.

  2. The readout demonstrably shifts with mere reordering of identical clinical facts, proving it captures processing artifacts, not invariant "knowledge," undermining claims of true system understanding.

  3. In the contested case, every written explanation—coherent, checkable, and favoring approval—was overruled by an opaque readout, directly contradicting transparency rules requiring denials to state their basis.

  4. The readout can only be validated where appeal outcomes exist, leaving its accuracy unproven and unauditable for the vast majority of cases; it fails as a standalone, explainable basis for denial.

  5. The strongest counterargument is the vendor's claimed accuracy on appealed cases where written rationales were wrong, but this loses because it relies on cherry-picked, known-outcome data and ignores the method's instability and violation of our core transparency mandate.
