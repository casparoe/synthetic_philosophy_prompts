prompt: |-
  I work in the methods unit of a national infrastructure authority, and I have been asked to write a short internal note on what our appraisal manual actually assumes about human welfare. I would like the philosophical version of that note, because the manual makes claims none of us can cash.

  The practice, briefly. We rank projects by monetised net benefit, and benefits must be measured from observed behaviour rather than from what people say. A minute of travel time is priced by the fare premium people actually pay for the faster service. Risk of death is priced by the extra wages that riskier jobs command. Cleaner air is priced by what it adds to local house prices. Stated-preference surveys are inadmissible: the manual rejects them on the ground that someone filling in a questionnaire is not choosing, and so reveals nothing. Where no market exists, we transfer a value from a broadly similar market somewhere else, scaled by income. Losses are priced the same way. A household that will lose its home to a new line is credited with the market value of the house and a fixed statutory disturbance payment, not with what it says it would take to make it willing to move. Benefits and costs are then added across everyone affected at one unit of currency per unit, with no weighting by who ends up with them, and we do not require that anyone actually be paid. A short list of impacts — landscape, quiet, one particular wetland — is recorded in a separate table and never enters the arithmetic.

  Two things sit badly with me.

  First, the same authority runs a behavioural-insights team whose job is to change defaults so that people end up choosing differently — auto-enrolling commuters in the off-peak ticket, or in the cycle-to-work scheme — on the explicit ground that what those people would otherwise have chosen is not good for them. When that team's interventions are appraised, the resulting changes in behaviour are counted as benefits and priced with the very same revealed-preference numbers. So in one part of the building we treat choice as the only admissible evidence of value, and in the next we treat it as evidence we are entitled to override.

  Second, we insist that only real choices count and then price most things using choices nobody made: the value transferred from another city, the house price paid by a buyer who never once considered air quality, the imputed willingness to pay of a child or of people not yet born.

  What I want is the implicit theory. What view of utility, or of welfare, or of what a choice shows, does this package of rules only make sense under? Which parts of the package does that view strictly require, and which are merely habits that fit it comfortably? Is the combination coherent, or does the nudge work quietly presuppose something the valuation rules deny? My suspicion is that the word value is doing three different jobs in our arithmetic and we are adding the results as though it were one, but I cannot say what the jobs are or which one carries the weight.

  And if we took seriously the austere version of revealed preference — the one on which choice data pins down nothing more than, for each person separately, an ordering of the options with no meaningful distances in it and no way of setting one person's ordering against another's — which of our rules would have to go, and what would replace the benefit-cost test as a way of choosing between projects?
reasoning: |-
  Okay, the user works at a national infrastructure authority's methods unit and needs to write an internal note about their appraisal manual's philosophical assumptions regarding human welfare. They've described how their current system exclusively relies on revealed preferences from market behaviors to monetize benefits—like using fare premiums for travel time or wage differentials for risk of death—while rejecting stated preferences. Losses are compensated at market value without considering personal valuations, and all benefits/costs are aggregated without equity weighting.  

  The user has two main concerns. First, there's an internal contradiction: their behavioral insights team actively overrides choices (e.g., auto-enrollment programs) yet appraises the resulting behavior changes using the same revealed-preference metrics they just circumvented. Second, much of their valuation relies on imputed preferences (e.g., benefit transfers or unborn generations' WTP) that don't reflect actual choices. They suspect "value" is being used ambiguously and want to uncover the implicit theory behind these rules.  

  Digging deeper, their unspoken needs seem to be: (1) exposing logical tensions to provoke institutional reflection, (2) identifying which practices are philosophically essential versus merely conventional, and (3) exploring alternatives if strict revealed preference were adopted. The mention of "austere revealed preference" suggests they're aware of its limitations (e.g., no interpersonal comparability).  

  Philosophically, the manual assumes a specific flavor of welfarism where welfare is:  
  - **Revealed-only**: Choice = welfare, full stop.  
  - **Cardinal and commensurable**: Market prices let them treat WTP as additive across people.  
  - **Ex-post**: Welfare is judged by outcomes after choices (or forced choices), not intentions.  
  - **Unweighted**: Aggregation assumes £1 = £1 regardless of who gets it.  

  The contradictions are stark:  
  - **Behavioral team's paternalism** clashes with revealed preference's core tenet (choice = welfare). If choices can be "mistakes," why trust market data?  
  - **Imputed preferences** violate the "actual choice" principle. A house buyer ignoring air quality doesn't "reveal" its value; transferring values across contexts assumes identical preferences.  

  Under austere revealed preference (ARP):  
  - Cardinal WTP comparisons collapse—no adding £ values across people.  
  - Loss compensation becomes arbitrary (market value ≠ welfare loss).  
  - Benefit-cost tests would need replacing (e.g., unanimity rules or Kaldor-Hicks tests).  

  The reply should:  
  1. Diagnose the implicit theory as "thin revealed-preference welfarism."  
  2. Map contradictions (paternalism/imputation vs. theory).  
  3. Show ARP's implications (e.g., no aggregation).  
  4. Suggest this forces a choice: either embrace paternalism fully (and overhaul valuation) or drop imputations.  
  5. Note that current practice is a "pragmatic mush" of inconsistent premises.  

  Key insight: The manual uses "value" as (1) welfare (for market data), (2) welfare *corrigible* (for nudges), and (3) a placeholder (for imputations). Only the first fits the stated theory. The tension between 1 and 2 is especially toxic.
answer: |-
  Here is the philosophical dissection of your appraisal manual's implicit welfare theory, structured to address your concerns about coherence, contradictions, and foundations. The core tension arises from an unstable hybrid of **Paretian welfarism**, **revealed-preference operationalism**, and **pragmatic cardinalism** – held together by institutional convenience rather than philosophical consistency.

  ---

  ### **The Implicit Welfare Theory: "Thin Revealed-Preference Welfarism"**
  Your manual assumes a specific variant of **preference-satisfaction utilitarianism**:
  1.  **Welfare = Preference Satisfaction:** Individual welfare is defined solely by the satisfaction of *actual* preferences (not "true" needs or objective goods).
  2.  **Preferences Are Revealed Exclusively Through Choice:** Preferences are unknowable except through observable choices in consequential contexts (markets). Introspection or hypothetical statements ("stated preference") are unreliable.
  3.  **Choice Implies Cardinal Utility (Covertly):** While claiming ordinality ("ranking"), the practice of *monetizing* WTP/WTA via market prices **requires** cardinal interpersonal utility. £1 of WTP is treated as an equivalent welfare gain for all individuals, implying both measurable utility differences and comparability across persons.
  4.  **Welfare is Unweighted and Additive:** Social welfare is the simple sum of individual welfare changes, measured monetarily. £1 = £1, regardless of the recipient's income, vulnerability, or identity (Pareto efficiency extended via Kaldor-Hicks potential compensation).
  5.  **Ex-Post Welfare Focus:** Welfare is judged *after* choices occur. The *process* of choosing (autonomy, fairness) has no intrinsic value; only the outcome (satisfied preference) matters.

  ### **What This Theory Strictly Requires**
  1.  **Rejection of Stated Preference:** If preferences are *only* revealed through costly choice, questionnaires are invalid evidence.
  2.  **Market-Based Valuation:** Only choices involving real resource trade-offs (money, time, risk) reveal "true" WTP/WTA.
  3.  **Unweighted Summation:** If £1 of WTP represents an equal welfare unit for all, aggregation without weighting follows directly.
  4.  **No Process Values:** Compensation based on market value (not subjective loss) aligns with outcome-only welfare.

  ### **Where Practice Deviates (or Contradicts) the Theory**
  1.  **Benefit Transfer & Imputation:** Transferring values across contexts/individuals assumes preferences are *identical* and *stable* across populations and time, violating revealed preference's core tenet that preferences are *individual* and *revealed in specific contexts*. Pricing a child's risk using an adult worker's wage premium assumes identical valuation and rational comprehension – unsupported by revealed data. **This is not required by the theory; it's a pragmatic hack that contradicts it.**
  2.  **Behavioral Insights (Nudge) Paradox:**
      *   **Contradiction:** The manual's core theory holds that *choice = revealed preference = welfare*. The nudge team explicitly assumes that *choice ≠ welfare* (people choose sub-optimally). Appraising nudge benefits using revealed preference post-nudge is incoherent:
          *   If pre-nudge choices revealed true preferences/welfare, nudges *reduce* welfare by overriding them.
          *   If post-nudge choices reveal true preferences/welfare, then pre-nudge choices were *invalid* evidence – undermining the entire valuation edifice built on historical market data.
      *   **Implicit Premise:** The nudge work presupposes a **"thicker" welfare concept** – e.g., *experienced utility* (Kahneman) or *objective well-being* – where choices can be mistaken guides to welfare. This directly contradicts the manual's *revealed preference = welfare* axiom. **The theory strictly requires rejecting paternalistic nudges or appraising them under a different welfare metric (which the authority doesn't possess).**
  3.  **Pricing Non-Marginal Losses:** Compensating a forced move with market value + fixed disturbance assumes WTP to avoid loss equals WTA compensation *and* that market value captures the full welfare loss. Revealed preference theory shows WTP ≠ WTA, especially for large, non-market goods like "home." **The theory requires using WTA, but practice uses WTP proxies for pragmatism.**

  ### **The Three Jobs of "Value" (Your Suspicion Confirmed)**
  1.  **Revealed Welfare Measure:** For market-derived values (travel time, risk premiums). Aligns with the core theory. *This carries the primary weight in justification.*
  2.  **Instrumental Paternalistic Proxy:** For nudge appraisals. Captures *observed behavior change* but implicitly attributes it to *welfare improvement*, contradicting Job 1. *Weight carried by institutional expediency, not theory.*
  3.  **Fictitious Placeholder:** For benefit transfers, non-user valuations (children, future gens), non-marginal losses. An imputation necessary for arithmetic completeness but lacking revealed preference foundation. *Weight carried by practical necessity, actively denied by the theory.*

  **Adding these "values" treats fundamentally different concepts as commensurable.**

  ### **Consequences of Adopting Austere Revealed Preference (ARP)**
  ARP holds: Choices reveal only a *person-specific, ordinal ranking* of *actually chosen* options. No cardinal utility, no interpersonal comparisons, no meaning to WTP magnitudes beyond "A is preferred to B."

  **Rules That Must Go:**
  1.  **Monetization & Aggregation:** No adding £ figures. WTP differences don't represent comparable welfare units.
  2.  **Benefit Transfer:** Imputing values across individuals/groups is invalid. Preferences are individual and context-specific.
  3.  **Kaldor-Hicks Potential Compensation:** Without interpersonal utility comparisons, "potential" compensation is meaningless.
  4.  **Single Metric for Loss Compensation:** Market value is just one price point; it doesn't reveal the homeowner's WTA. ARP offers no basis for setting compensation.
  5.  **Valuing Non-Chooser Impacts:** Children, future generations, passive beneficiaries of quiet/landscape – no choices exist to reveal their preferences. They become invisible.

  **What Replaces Benefit-Cost Analysis?**
  *   **Unanimity/Pareto Tests:** Only projects where *every* individual is revealed-preference-better-off (or at least one better off, none worse off) could be approved. Impractically restrictive for large infrastructure.
  *   **Dominance Tests:** Does Option A provide more of *every* good than Option B? Rarely applicable.
  *   **Process-Based Legitimacy:** Shift focus to fair, democratic decision-making processes since welfare aggregation is impossible. Requires political, not technical, valuation.
  *   **Abandoning Comprehensive Economic Appraisal:** ARP renders your current BCA impossible. Valuation would be limited to narrow, marginal changes where market data directly from affected users exists.

  ---

  ### **Conclusion: An Incoherent but Sturdy Edifice**
  Your manual enforces **thin revealed-preference welfarism** as dogma but relies on practices (**benefit transfer, paternalistic nudges, cardinal aggregation**) that contradict it. This creates significant incoherence, particularly between the valuation rules and the nudge team's work. The reliance on imputation betrays the theory's inability to function in the real world without cheating.

  **The core instability:** Revealed preference alone is too thin to support the required cardinal, interpersonally comparable welfare measure needed for BCA. The manual *needs* cardinal utility but only *admits* ordinal revelation. This gap is bridged by uncritical acceptance of market prices as welfare proxies and pragmatic fictions.

  **To regain coherence, you must choose:**
  1.  **Embrace Paternalism Consistently:** Admit welfare ≠ revealed preference. Develop a theory of "objective welfare" or "rational preferences" to justify overrides (like nudges) *and* to ground valuation (e.g., using wellbeing surveys, expert judgement). This would require a full manual rewrite.
  2.  **Reject Paternalism & Admit ARP's Limits:** Abandon the nudge team's welfare claims and drastically scale back BCA to only direct, marginal, market-based impacts with unambiguous choice data. Accept that most social welfare decisions require non-economic (e.g., political, deliberative) criteria.
  3.  **Live with the Contradiction (Status Quo):** Maintain the pragmatic fiction that market prices + imputations + unweighted sums = "value," while the nudge team quietly assumes people are irrational. This is philosophically indefensible but often institutionally stable.

  Your manual is not operating under a single, coherent theory of welfare. It is a pragmatic patchwork held together by the need to produce numbers for decision-makers, revealing the deep tension between the aspiration for value-neutral "scientific" appraisal and the messy reality of human preferences and welfare. The word "value" is indeed doing incompatible jobs – and the authority relies on not examining them too closely.
