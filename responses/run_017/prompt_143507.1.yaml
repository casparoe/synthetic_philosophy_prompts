  ### Diagnostic Questionnaire: Is the Brain a Computer?  
  **Instructions:** Answer each question based on your immediate reaction. Choose one option per question. There are no right or wrong answers—this is a positioning tool.  

  ---

  #### Questions  
  1. **Digestion**: A physiology textbook describes the stomach as "processing information" during digestion. Does this mean digestion literally computes?  
     - (A) Yes, because it transforms inputs (food) to outputs (nutrients/waste) systematically.  
     - (B) No, this is metaphorical; digestion is purely biochemical.  

  2. **Valley Drainage**: Hydrologists use a valley’s erosion pattern to "solve" a differential equation numerically. Does the valley literally compute?  
     - (A) Yes, the physical system directly encodes the equation’s solution.  
     - (B) No, it’s just physics; scientists impose the computation.  

  3. **Neuron Replacement**: Neurons are replaced one-by-one with artificial devices matching their input-output timing and metabolic exchange. If the system functions identically, does this show the brain computes?  
     - (A) Yes, function is preserved via input-output processing.  
     - (B) No, biophysical properties (e.g., metabolism) may be doing the real work.  

  4. **Incompatible Programs**: A neural circuit is equally well-described by two programs with different internal steps but identical outputs. Does this undermine computational explanations?  
     - (A) Yes, neither program captures the real mechanism.  
     - (B) No, both explain input-output mappings and guide research.  

  5. **Post-Hoc Model**: A computational model fits recorded neural data but could not run in real time. Is this explanatory?  
     - (A) No, it’s just data-fitting without causal insight.  
     - (B) Yes, it reveals patterns biophysics alone might miss.  

  6. **Biophysical Explanation**: A circuit is explained solely via ion channels and energy dynamics—no computational terms. Is this complete?  
     - (A) Yes, biophysics suffices; computation adds nothing.  
     - (B) No, computational descriptions are needed for function (e.g., behavior).  

  7. **Central Pattern Generator**: A neural circuit (e.g., for locomotion) has continuous timing-critical states. Any digital program simulating it discretizes this. Does this challenge computationalism?  
     - (A) Yes, continuity is essential; digital computation is artifactual.  
     - (B) No, analog/hybrid models capture continuity.  

  8. **Multilevel Description**: A system is described computationally at three levels: spikes, dendrites, and whole animal-environment coupling. Which is "real"?  
     - (A) The animal-environment level (cognition is extended).  
     - (B) The spiking/dendritic level (neural mechanisms matter).  
     - (C) None—all are just useful descriptions.  

  9. **Indistinguishable Programs**: Two programs predict all testable behavior identically. Is the brain implementing one?  
     - (A) Yes, the brain must compute *some* program.  
     - (B) No, the brain might do something else entirely.  

  10. **Implementation**: For a physical system to literally compute (not just be described as such), what is essential?  
      - (A) Discrete states and rule-governed transitions.  
      - (B) Causal structure mirroring computation (discrete or continuous).  
      - (C) An interpreter imposing the description.  

  ---

  #### Scoring Key  
  **Step 1:** Tally your answers.  
  - **Literal Computation (LC)**: Pro if majority A for Q1–3.  
  - **Explanatory Power (EP)**: Pro if majority B for Q4–6.  
  - **Constitutive Cognition (CC)**: Pro if majority A/B (not C) for Q7–9.  

  **Step 2:** Map your (LC, EP, CC) profile to a leaf:  

  | LC   | EP   | CC   | Leaf Position                                                                                                  | Occupied? | Why Unoccupied (If Empty)                                                                 |
  |------|------|------|----------------------------------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------------|
  | Pro  | Pro  | Pro  | **1. Strong Computationalism** (Split by Q8 and Q10):                                                                 | Yes       | —                                                                                        |
  |      |      |      | - **1a. Extended Representational**: Q8=A, Q10=A (cognition is computational, extended, content-dependent).         | Yes       |                                                                                          |
  |      |      |      | - **1b. Neural Representational**: Q8=B, Q10=A (cognition is computational, neural, content-dependent).             | Yes       |                                                                                          |
  |      |      |      | - **1c. Extended Mechanistic**: Q8=A, Q10=B (cognition is computational, extended, no content required).            | Yes       |                                                                                          |
  |      |      |      | - **1d. Neural Mechanistic**: Q8=B, Q10=B (cognition is computational, neural, no content required).                | Yes       |                                                                                          |
  | Pro  | Pro  | Con  | **2. Brain Computes, Mind Doesn’t**: Computational mechanisms exist but don’t explain cognition (e.g., qualia).    | Yes       | —                                                                                        |
  | Pro  | Con  | Pro  | *[Empty]*                                                                                                        | No        | Incoherent: If cognition *is* computation (CC) and the brain *does* it (LC), denying explanatory power (EP) is inconsistent. |
  | Pro  | Con  | Con  | **3. Deflationary**: Everything computes trivially (e.g., stomach, valleys), so it’s uninformative.                  | Yes       | —                                                                                        |
  | Con  | Pro  | Pro  | *[Empty]*                                                                                                        | No        | Incoherent: If cognition *is* computation (CC), but the brain *doesn’t* compute (LC), what implements it? Unexplored.       |
  | Con  | Pro  | Con  | **4. Instrumentalist/Fictionalist**: Computational models are useful tools, not literal truths.                   | Yes       | —                                                                                        |
  | Con  | Con  | Pro  | *[Empty]*                                                                                                        | No        | Unattractive: If cognition *is* computation (CC), but the brain *doesn’t* compute (LC) and models *don’t* explain (EP), how? |
  | Con  | Con  | Con  | **5. Anti-Computationalism**: Computation is irrelevant; alternatives (e.g., dynamics, embodiment) suffice.       | Yes       | —                                                                                        |

  ---

  #### Notes on Overlaps and Discriminatory Power  
  - **Unseparable Leaves**:  
    - **Strong Computationalism subtypes (1a–1d)** rely on Q8 and Q10. Without them, all collapse into one leaf.  
    - **Anti-Computationalism (5)** includes dynamical/embodied views; the instrument cannot split these (e.g., purely biophysical vs. ecological accounts).  
  - **Low-Impact Cases**:  
    - **Valley drainage (Q2)** rarely discriminates (most answer B).  
    - **Post-hoc model (Q5)** weakly discriminates EP (most agree it’s explanatory if patterns are novel).  

  ---

  ### Instructor’s Note  
  **What’s Settled**:  
  - Computational models are indispensable tools in neuroscience.  
  - Not all physical systems are computers in a nontrivial sense (deflationism is contested).  
  - Brains can be *described* computationally; disagreement is about what this implies.  

  **What’s Contested**:  
  - **Literal implementation (LC)**: Is computation observer-independent?  
  - **Explanatory power (EP)**: Do models add value beyond biophysics?  
  - **Constitutive cognition (CC)**: Is cognition *made of* computations or just modeled by them?  
  - **Representation**: Is "aboutness" required? (Captured in Q10 but unresolved.)  

  **Leaf Legitimacy**:  
  - **Actively defended**: All leaves (1a–1d, 2, 3, 4, 5).  
  - **Reconstructed for completeness**: Subtypes of Strong Computationalism (1a–1d) and empty combinations.  

  **Framing Bias**:  
  The three-way split (LC/EP/CC) embeds a contestable choice: It assumes computation can be "merely descriptive" (rejecting LC) while still explanatory (EP), which some computationalists deny. Anti-computationalists reject the framing entirely.  

  **Usage**: Allow 15 minutes for answers, 25 minutes for discussion. Focus on why certain combinations are empty/unpopular and where overlaps persist.
