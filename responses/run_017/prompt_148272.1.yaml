prompt: |-
  I spent forty years in experimental physics, magnetism mostly: hysteresis loops, calibration curves, the standing argument about whether a feature in the data is above the resolution of the instrument. In the three years since I retired I have been sitting in on the ethics reading group in the philosophy department, and I have come to think that the argument the group keeps having about how much morality can demand of a single agent is being conducted at the wrong level. Everyone brings a theory and defends it against three stock examples; nobody first says what a theory of this kind would have to be able to do in order to count as adequate. So before I read any more of them I want the specification.

  Let me fix the purpose so that adequacy has a determinate sense. I am seventy-one, in decent health, with a modest but sufficient pension, a paid-off house, and a great deal of unscheduled time. I want to know what is required of me with what is left of my working life, in a form I could defend without embarrassment both to the reading group and to my granddaughter. And I want an answer that does not fall apart if the cost-effectiveness estimates that the effective-giving people rely on are wrong by an order of magnitude, because after a career spent looking at error bars I do not trust them to better than that.

  So: write the desiderata that any adequate account of the limits of moral demand must meet, each with the case or consideration that makes it a requirement rather than a preference, and each stated so that I could test a candidate theory against it.

  The cases I want the specification to be answerable to, with variants that I think are harder than the ones in circulation:

  1. The pond case with eleven bystanders, where the child can be rescued by any two of them and the marginal contribution of a twelfth is zero. Whether a theory's demands are indexed to what others actually do strikes me as the deepest fault line here, and I want to know whether that indexation is a defect or a feature.
  2. The retiree: low income, substantial assets, and a large stock of free time. A theory that measures sacrifice in currency misclassifies me entirely. Does a theory owe me a common numeraire across money, time, risk, bodily integrity, and my relationships, or may it leave the currencies lexically ordered and unordered among themselves?
  3. The null result. A researcher spends twenty years on a programme that had, by the best ex ante estimate, a real chance of a very large benefit, and it comes to nothing. Is the demand assessed prospectively or retrospectively, and does sacrifice that turns out to have bought nothing still count as sacrifice?
  4. The second career: someone who could, with effort and some cost, raise their capacity to do good substantially, by training for a higher-earning or higher-impact occupation. Must a theory say whether the baseline of capacity is given or chosen?
  5. Hysteresis. Two agents identical in every respect today, one of whom has a long history of sacrifice behind her and one of whom has never given anything. May a theory give them different verdicts on the strength of that history alone, and if it may, what does that do to the idea that requirements supervene on the agent's present situation?
  6. The moving baseline. Someone who has trained himself to want very little, or who has come to enjoy the work of aiding others, so that what would once have been a large sacrifice is now none. Is the size of a sacrifice measured against the agent's actual desires, against the desires he could have reshaped, or against some third thing? In my old field this was the question of what you calibrate against, and a theory that left the reference level free was not a theory.
  7. Risk to the agent. A certain modest sacrifice with a certain modest good, versus a ten-year commitment with one chance in a hundred of an enormous good and ninety-nine chances of nothing much. May the theory be risk-averse about my sacrifice while remaining risk-neutral about the good?
  8. Universal compliance. What does the theory demand of everyone when everyone else already complies and the marginal impact of one more person is negligible? A theory that quietly presumes partial compliance and then generalises has, I suspect, a hidden failure of scale invariance.

  Alongside these I want the distinctions a theory cannot collapse: what is required versus what there is most reason to do versus what is merely permitted versus what is praiseworthy if done; how much is demanded versus how many departments of a life the demand reaches; whether the limit is on the demand itself or only on the blame for failing to meet it; individual versus collective demands; and whether the account is meant to be action-guiding at the moment of choice or only to be true.

  Three further things, which are the part I most want.

  First, mark each desideratum as non-negotiable or as the preference of a camp, and tell me honestly which of my own demands are imported prejudices from a working life in the laboratory. I have in mind particularly the demand that a theory deliver a verdict at a stated resolution rather than an interval or a shrug; I suspect that is a physicist's taste rather than a requirement, but I want the argument either way, and I want the same treatment for the demand that the theory not be gerrymandered to reproduce verdicts we antecedently like.

  Second, identify any pair or triple of desiderata that cannot be jointly satisfied, and say which one you would drop. If the list itself has a structure that forces a choice, that is the result I am after.

  Third, tell me which single requirement does the most work in excluding otherwise attractive candidates, and whether it does so for a good reason.

  Only after that, and briefly: a short scorecard, a paragraph each and no more, for the families of view the reading group keeps returning to — scalar and satisficing consequentialisms, views that grant the agent a personal prerogative or a sphere of permission, views that limit how much impartial morality may ask for by appealing to the shape of human motivation, and views that simply deny there is a limit to be had. I can check your scoring against the papers myself; it is the criteria I cannot get from them.

  Two constraints, please. Where a case needs a number, invent a plausible one and label it as invented rather than leaving it schematic. And do not spend your answer on the layout of the literature: I am not asking who said what, I am asking what any of them would have to be able to do.
reasoning: |-
  Hmm, this is a fascinating challenge from a retired experimental physicist. They've spent 40 years in magnetism research and now three years in ethics discussions, and they're frustrated with how philosophical debates about moral demands are conducted. They want rigorous specifications for evaluating theories about moral demands, similar to how they'd approach experimental physics.

  The user presents eight complex cases that any adequate theory must handle, focusing on practical concerns rather than abstract principles. They want desiderata framed as testable requirements, with clear distinctions between non-negotiable features and personal biases. There's a strong emphasis on precision, error tolerance, and real-world applicability - clearly influenced by their scientific background.

  Key points from their query:
  - They need desiderata for moral theories that can be tested against specific cases
  - Must address their personal situation (retired with time/assets)
  - Shouldn't rely on precise cost-effectiveness estimates
  - Must handle all eight described scenarios
  - Needs to clarify conceptual distinctions (required vs praiseworthy etc.)
  - Requires marking which desiderata are non-negotiable vs debatable
  - Should identify conflicts between desiderata
  - Needs to highlight which requirement does most work in excluding theories

  The cases they present are particularly nuanced:
  1. Pond case with multiple bystanders (addressing marginal contribution)
  2. Retiree situation (measuring sacrifice across currencies)
  3. Failed research program (prospective vs retrospective assessment)
  4. Career change (baseline capacity question)
  5. Hysteresis effect (impact of past sacrifices)
  6. Moving baseline (measuring sacrifice against shifting desires)
  7. Risk asymmetry (toward own sacrifice vs others' benefit)
  8. Universal compliance (scale invariance problem)

  I'll need to develop a rigorous set of desiderata that directly address these cases while respecting the user's scientific mindset. The response should avoid philosophical jargon and focus on testable criteria. For each desideratum, I'll clearly state:
  - The requirement
  - Which case motivates it
  - How to test a theory against it
  - Whether it's non-negotiable or debatable

  I'll also need to identify conflicts between desiderata and be honest about which requirements might stem from their physics background (like the demand for precise verdicts). The final part will briefly score major ethical approaches against these criteria without getting into scholarly debates.
answer: |-
  Below is a specification of desiderata for an adequate account of the limits of moral demand, structured to meet your requirements. Each desideratum is derived from your cases or conceptual distinctions, stated as a testable criterion, labeled for negotiability, and accompanied by its justificatory case/consideration. I then identify conflicts, the most exclusionary requirement, and provide a brief scorecard. Numbers in cases are plausible inventions (marked with †).

  ---

  ### **Desiderata for an Adequate Theory of Moral Demand Limits**

  1. **Non-Indexation to Actual Others' Actions**  
     - **Requirement**: The theory must not reduce an agent's obligation based solely on whether others *actually* contribute, but only on what they *ought* to do or structural feasibility.  
     - **Test**: Apply to *Pond Case (11 bystanders; child needs any 2)*: If a twelfth bystander walks away because others act, the theory must still condemn this if their obligation existed *before* others moved.  
     - **Case Justification**: *Pond Case* reveals a "free-rider risk" if demands weaken when others comply. Indexation undermines universalizability.  
     - **Negotiability**: **Non-negotiable**. Permitting indexation collapses moral duty into descriptive sociology.

  2. **Multi-Currency Sacrifice Metric**  
     - **Requirement**: The theory must provide a common framework for comparing sacrifices across money, time, risk, relationships, and bodily integrity—not necessarily a single numeraire, but a consistent method for trade-offs (e.g., lexical ordering with defined thresholds).  
     - **Test**: Apply to *Retiree Case (low income, paid-off house, ample time)*: Must classify sacrificing 10 hours/week volunteering vs. donating $500/month vs. risking health in disaster relief as comparable demands.  
     - **Case Justification**: *Retiree Case* shows income-based metrics misclassify agents with non-monetary resources.  
     - **Negotiability**: **Non-negotiable**. Without this, the theory ignores your actual capacities.

  3. **Prospective Assessment of Sacrifice**  
     - **Requirement**: Sacrifice must be judged based on ex ante reasonable expectations, not retrospective outcomes.  
     - **Test**: Apply to *Null Result Case (20-year research program; ex ante 30%† chance of major benefit, fails)*: The researcher’s sacrifice must count fully if the endeavor was reasonably justified initially.  
     - **Case Justification**: *Null Result Case*: Retrospective assessment punishes bad luck, not moral failure, violating control principle (ought implies can).  
     - **Negotiability**: **Negotiable**. Some virtue theories tie value to outcomes, but this is weak under uncertainty.

  4. **Baseline Capacity as Chosen**  
     - **Requirement**: The theory must treat an agent's capacity to do good as adjustable if they can reasonably enhance it (e.g., via training).  
     - **Test**: Apply to *Second Career Case (agent can train for 3 years† to double impact)*: Must demand some investment in self-improvement if cost-benefit analysis favors it.  
     - **Case Justification**: *Second Career Case*: Treating capacity as fixed ignores dynamic responsibility.  
     - **Negotiability**: **Negotiable**. "Reasonable" enhancement is contentious (e.g., how much effort?).

  5. **History-Indifference**  
     - **Requirement**: Demands must supervene on current capacities and circumstances, not past sacrifices.  
     - **Test**: Apply to *Hysteresis Case (two identical agents today; one has long sacrifice history)*: Both must face identical demands now.  
     - **Case Justification**: *Hysteresis Case*: Allowing history to reduce obligations creates moral "debt" incompatible with equality of agents.  
     - **Negotiability**: **Non-negotiable**. History-dependence violates supervenience on the present.

  6. **Objective Baseline for Sacrifice**  
     - **Requirement**: Sacrifice size must be measured against an objective standard (e.g., basic human flourishing), not subjective desires or adaptable preferences.  
     - **Test**: Apply to *Moving Baseline Case (agent trains to enjoy aid work; old sacrifice now neutral)*: Giving up a comfortable retirement must still count as sacrifice, even if desired.  
     - **Case Justification**: *Moving Baseline Case*: Subjective measures reward self-manipulation, undermining stable demands.  
     - **Negotiability**: **Negotiable**. Objective baselines are contested (e.g., what is "flourishing"?).

  7. **Risk-Symmetry**  
     - **Requirement**: The theory must treat risk to the agent and risk to beneficiaries symmetrically (e.g., no special risk-aversion for self).  
     - **Test**: Apply to *Risk Case (modest safe sacrifice vs. 10-year gamble: 1%† chance of huge good, 99% nothing)*: Must approve the gamble if expected value exceeds safe option.  
     - **Case Justification**: *Risk Case*: Asymmetry privileges the agent's interests arbitrarily.  
     - **Negotiability**: **Negotiable**. Commonsense morality often permits agent-favoring risk aversion.

  8. **Scale-Invariant Demands under Compliance**  
     - **Requirement**: Demands must not vanish or inflate under hypothetical universal compliance; they must be robust at all scales.  
     - **Test**: Apply to *Universal Compliance Case (all others comply; marginal impact negligible)*: Must still require the agent to contribute if their action is part of a collective obligation.  
     - **Case Justification**: *Universal Compliance Case*: Theories that fail this are ad hoc and unprescriptive.  
     - **Negotiability**: **Non-negotiable**. Failure implies the theory is not action-guiding.

  9. **Distinction Preservation**  
     - **Requirement**: The theory must distinguish:  
       - Required vs. supererogatory (praiseworthy beyond duty)  
       - Individual vs. collective obligations  
       - Demands on effort vs. scope of life impacted  
       - Blame-limits vs. demand-limits  
     - **Test**: Must not collapse (e.g.) giving 10% income (required) vs. giving 50% (praiseworthy).  
     - **Justification**: Your conceptual list; collapsing these obscures moral texture.  
     - **Negotiability**: **Non-negotiable**. Conflations produce false dilemmas.

  10. **Robustness to Empirical Uncertainty**  
      - **Requirement**: The theory must deliver stable verdicts when cost-effectiveness estimates vary by an order of magnitude.  
      - **Test**: Apply to effective-giving cases: If saving a life costs $1k–$10k†, demands should not shift from "required" to "optional" within this range.  
      - **Case Justification**: Your error-bar caveat; lab experience shows precision claims are often overconfident.  
      - **Negotiability**: **Non-negotiable** for your purpose. Without this, the theory is fragile.

  ---

  ### **Your Physics-Influenced Demands: Biases or Necessities?**
  - **Demand for Precise Verdicts**: *Preference*. Ethics often deals with thresholds, not point values (e.g., "sacrifice up to 20% of time" is actionable). Insisting on resolution like a hysteresis loop measurement imports lab standards where "fuzzy" verdicts may be adequate.  
  - **Anti-Gerrymandering (theory not fitted to intuitions)**: *Non-negotiable*. Gerrymandering hides circularity; a theory must justify verdicts independently of pre-theoretic judgments (as in *Moving Baseline*).

  ---

  ### **Conflicts and Trade-offs**
  - **Irreconcilable Triad**:  
    1. *Prospective Assessment* (Desideratum 3)  
    2. *Objective Sacrifice Baseline* (6)  
    3. *Robustness to Uncertainty* (10)  
    - **Conflict**: Prospective assessment + objective baseline requires precise cost-benefit calculations, but robustness rejects precision under uncertainty.  
    - **Drop**: *Prospective Assessment* (3). Sacrifice can be tied to *effort expended* rather than expected outcomes, avoiding empirical brittleness.  

  - **Major Structural Trade-off**: *History-Indifference* (5) vs. *Moving Baseline* (6). If sacrifice is objective (6), past efforts might seem to reduce current capacity (violating 5). Resolution requires defining sacrifice independently of history *and* subjectivity.

  ---

  ### **Most Exclusionary Requirement**  
  **Non-Indexation to Others' Actions** (1).  
  - **Why**: It excludes all "actualist" consequentialisms (which reduce demands if others act) and some collective obligation views.  
  - **Good Reason?**: Yes. Indexation makes morality contingent on others' failures, creating perverse incentives. Universalizability is a bedrock of moral reasoning.

  ---

  ### **Scorecard of Major Views**  
  *(Each scored against key desiderata; ⓪ = fails, ① = partial, ② = satisfies)*  

  1. **Scalar Consequentialism** (no limits, only better/worse):  
     Fails *Distinction Preservation* (9) (no required/supererogatory), *Scale-Invariance* (8) (demands vanish under compliance), and *Robustness* (10) (verdicts swing with estimates). **Score: ⓪ on 8,9,10**.  

  2. **Satisficing Consequentialism** (meet "good enough" threshold):  
     Fails *Non-Indexation* (1) (thresholds often index to others) and *Objective Baseline* (6) (sacrifice measured subjectively). **Score: ⓪ on 1,6**.  

  3. **Hybrid Theories** (personal prerogative + impartial demands):  
     Satisfies *Distinction Preservation* (9) and *Multi-Currency* (2), but fails *Risk-Symmetry* (7) (prerogative allows self-favoring risk) and *Baseline Capacity* (4) (prerogative often treats capacity as fixed). **Score: ② on 2,9; ⓪ on 4,7**.  

  4. **Motivation-Limited Views** (demands capped by human psychology):  
     Fails *Moving Baseline* (6) (measures sacrifice subjectively) and *History-Indifference* (5) (habits shape capacity). **Score: ⓪ on 5,6**.  

  5. **No-Limit Theories** (extreme demands):  
     Fail *Retiree Case* (no *Multi-Currency* (2)), *Risk-Symmetry* (7) (ignores agent risk), and *Universal Compliance* (8) (demands inflate absurdly). **Score: ⓪ on 2,7,8**.  

  ---

  This specification prioritizes testability, non-contingency, and clarity—reflecting your physics rigor—while flagging where lab habits may overconstrain ethics. The deepest tension remains between *universalizability* (1,8) and *feasibility* (6,7), but **Non-Indexation** and **Scale-Invariance** are the keystones for a theory worth defending to your granddaughter.
