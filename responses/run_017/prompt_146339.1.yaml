  ### Activity Design: Anthropic Reasoning Discovery

  #### **Materials and Setup**
  1. **Two Envelopes**:
     - **World Selection Envelope**: Contains the outcome of a fair coin flip (auditable procedure) that determines the world: heads = short (total population 200), tails = long (total population 200,000). Sealed after the flip.
     - **Serial Number Envelope**: Contains documentation of the RNG seed and process used to assign serial numbers (e.g., Python `random.sample` with seed recorded). For the short world, 16 unique numbers drawn from 1–200; for the long world, 16 unique numbers drawn from 1–200,000. Sealed after generation.

  2. **Participant Dossiers** (one per participant):
     - **Identity Card**: A single serial number (global ID) from the actual world.
     - **Class Descriptions** (printed on card):
       - **Class α**: "A member of *Homo sapiens*."  
         (Short world: 200, Long world: 200)
       - **Class β**: "A member of a species that has built radio telescopes."  
         (Short world: 200, Long world: 200)
       - **Class γ**: "A being capable of updating on evidence."  
         (Short world: 200, Long world: 200,000)
     - **Instructions**: "Choose one class. Report your credence (0–1) that the world is short. You will be scored against the actual world."

  3. **Scoring Sheet**: Participants write:
     - Participant ID
     - Chosen class (α, β, or γ)
     - Credence \( p \) (probability world is short)

  4. **Brier Score Table** (displayed publicly):
     | True World | Reported \( p \) | Penalty         |
     |------------|------------------|------------------|
     | Short      | 0.0              | 1.0             |
     | Short      | 0.5              | 0.25            |
     | Short      | 0.9              | 0.01            |
     | Short      | 1.0              | 0.0             |
     | Long       | 0.0              | 0.0             |
     | Long       | 0.5              | 0.25            |
     | Long       | 0.9              | 0.81            |
     | Long       | 1.0              | 1.0             |
     - **Scoring Rule**: Penalty = \((1 - p)^2\) if short, \(p^2\) if long.  
       (Minimize penalty; strictly proper for binary events.)

  #### **Auditable Procedure**
  1. **World Selection**: 
     - Flip a fair coin in front of the group. 
     - Heads → short, tails → long. 
     - Seal result in **World Selection Envelope** without revealing.

  2. **Serial Number Assignment**: 
     - Use a public RNG (e.g., Python `random.sample(range(1, N+1), 16)`, where \(N\) = 200 or 200,000 based on the coin flip). 
     - Record and seal the seed and the list of 16 numbers. 
     - Assign numbers randomly to participants (shuffled cards).

  #### **Activity Flow**
  1. **Intro (5 min)**: 
     - Explain worlds (short: 200 people, long: 200,000 people). 
     - Describe classes and scoring rule. Show Brier score table. 
     - Emphasize: "Commit to a class and credence based *only* on your serial number."

  2. **Update and Reporting (15 min)**:
     - Participants receive dossiers (global ID + class descriptions). 
     - They choose a class, compute their credence using Bayes, and report \( p \) (e.g., for class γ: low serial number favors short world). 
     - Facilitator collects scoring sheets silently.

  3. **Scoring (5 min after world reveal)**:
     - Open **World Selection Envelope** to reveal short/long. 
     - Compute penalties using reported \( p \) and Brier rule.  
     - Display penalties anonymously (e.g., histogram).

  #### **Predictable Issues & Handling**
  - **"Prior is 0.5, one draw tells me nothing"**:  
    Likely from participants choosing class α or β (same size in both worlds → posterior remains 0.5). **Handling**: In debrief, clarify that this is correct *for their class choice* but not universal.
  - **Choosing the class that "scores best"**:  
    Participants might pick γ to enable extreme \( p \) (e.g., 0.999) for a low penalty if correct. **Handling**: Note in debrief that class choice *should* reflect a sampling assumption, not gaming the score.
  - **Low serial number in long world**:  
    A participant in γ with serial number 5 in a long world updates to \( p \approx 0.999 \) but incurs high penalty. **Handling**: Preemptively warn: "Unlikely outcomes can happen; focus on the update, not the outcome." In debrief, calculate the probability (1/1000) to normalize frustration.
  - **Serial number > 200 in short world**:  
    Impossible by design (short world uses 1–200). Ensures no ambiguity.

  #### **Debrief (30 min)**
  1. **Map to Anthropic Concepts**:
     - **Self-Sampling Assumption (SSA)**: Participants assumed they were randomly sampled from their chosen class. Choosing α/β (size-invariant) → no update. Choosing γ (size-varying) → strong update.
     - **Self-Indication Assumption (SIA)**: Not covered. Contrast: "SSA weights by class size; SIA weights by total observers."
     - **Reference Class**: The "unasked choice" was which class to condition on. This choice determined the likelihood ratio:
       - α or β: \( \mathcal{L} = \frac{1/200}{1/200} = 1 \) → posterior = 0.5.
       - γ: \( \mathcal{L} = \frac{1/200}{1/200,\!000} = 1000 \) → posterior \( \frac{1000}{1001} \approx 0.999 \).

  2. **Limitations of the Activity**:
     - **Prior is not a coin flip**: Real priors come from models of humanity’s future (e.g., extinction risks), not symmetry.
     - **Hypothesis space is continuous**: Real doomsday arguments consider a distribution of possible population totals, not two discrete options.
     - **Reference class arbitrariness**: Real debates ask: "Which class *should* we use?" (e.g., humans, conscious beings).

  3. **Key Insight**:  
     "The live disagreement is not about Bayes’ theorem, but about which sampling assumption (governed by the reference class) applies—and no datum of this kind settles it."

  #### **What the Activity Cannot Reproduce**
  - The **real prior** is informed by science/history, not a 50/50 symmetry default.
  - The **real hypothesis space** is a continuum of population sizes, not two bins.
  - The **reference class problem** is unresolved: Choosing between α, β, γ mirrors fights over "observer" definitions in anthropic ethics (e.g., AI minds, aliens).

  ### **One-Sentence Takeaway**
  "Participants should see that the core disagreement in anthropic reasoning is not about the math, but about which sampling assumption (reference class) governs updates—and that no single piece of 'position data' resolves it."
