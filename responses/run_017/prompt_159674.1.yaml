prompt: |-
  Hey — I write a science-and-ideas column, and I keep having the same argument with my editor. Roughly once a month I get a paper or a press release where two rival explanations fit the same data, and I want to write "scientists can't tell which one is right," and my editor says that's lazy both-sides-ism. Or the mirror image: I write "the evidence favors X," and a researcher on the losing side emails me that the data are underdetermined and I owe them a correction. I need an actual procedure I can run, not vibes.

  What I want is a decision checklist — a flowchart in words — that I can run in about twenty minutes, on the phone, usually with a scientist who is an author of one of the rival theories. I know the rough shape of the philosphy here: that hypotheses get tested in bundles rather than one at a time, so a theory can always be protected by adjusting the background assumptions around it; the difference between "we don't have the evidence yet" and "no evidence anyone could get would separate these"; and the worry that for any theory you can dream up an empirically equivalent rival, which would make the whole complaint cheap. I need that turned into something usable, and I need you to decide which of those distinctions survive the simplification and which can be dropped.

  Please build in gates for at least these:

  - Is the disagreement at the level of the theory, or at the level of the measurement model — do the rivals share the assumption that the instrument is tracking the thing it's supposed to track? If they don't, I think it's a different story, and I want to know which one.
  - Transient vs. strong underdetermination: what's the question I ask to tell them apart, and what counts as a sufficent answer? I want the scientist to have to name the experiment or dataset that would settle it and say roughly when it'll exist, and I want to know what to do when they name something but privately everyone thinks it'll take fifteen years.
  - Is the rival a real research program somebody has worked out, or what I've started calling a zombie rival: it exists as a logical possibility, nobody has shown it can reproduce the rest of the field's data, and it only ever gets wheeled out when this one dataset comes up. Give me a sub-test that kills zombie rivals without me having to accuse a source of bad faith on the phone.
  - When a theory survives a bad result by changing an auxiliary assumption, how do I tell a principled fix from a rescue job? My naive rule is: was that auxiliary already in play, and was it plausible before this dataset came in? Tell me if that rule is wrong, and what to do when the answer is genuinely unclear.
  - When the rivals really are empirically equivalent and the only thing separating them is simplicity, elegance, or fit with what the rest of the field already believes: is that evidence or is it taste? I need a sentence I can put in the piece either way that isn't dishonest.

  I also want the procedure to say where it stops with "file the both-sides version," where it stops with "file the version where one side is ahead," and where it hands the call to me or my editor because it's a stakes question rather than an evidence question — how bad it is to be wrong in each direction, who gets hurt, that sort of thing. Mark those handoffs explicitly.

  Then run it on three cases:

  1. Two models of an ancient-climate proxy. Both fit the same measurements. Model A says the proxy records ocean pH, Model B says it records temperature, and the thing that would settle it is a lab calibration nobody has ever done, which would take years.

  2. A psychology result: a training regime improves test scores. The authors' theory says it's a specific cognitive mechanism; a critic says the same pattern would appear if the effect were really just motivation, and honestly the two predict the same outcomes on every measure in the paper. Nobody has run the subgroup analysis that would separate them.

  3. A case I care about, which I want you to make come out badly for me. I've got a piece half-written where a maverick says the mainstream model only looks confirmed because every lab uses instruments from the same lineage, so one shared systematic error would explain everything — and I framed it as a near-scandal. I suspect your procedure is going to tell me this is a zombie rival and I should kill the framing. Run it and tell me honestly, including what the maverick would have to actually do to make it a live rival.

  Be explicit about what the checklist can't do. I've got a maths-adjacent degree but no stats beyond one regression course, the piece has to be filed the same day, and my editor has to sign off on any line that says a field is genuinely stuck.
reasoning: |-
  We are building a decision checklist for a science journalist to determine when to present competing explanations as genuinely underdetermined by evidence, when one is favored, and when to avoid false equivalence. The checklist must be usable in a 20-minute phone call with a scientist.

  Key distinctions from philosophy of science we'll use:
  - Underdetermination: multiple hypotheses fit the same data.
  - Transient vs. strong underdetermination: transient means we can in principle get evidence to decide, strong means no possible evidence could decide.
  - Auxiliary assumptions: background beliefs that can be adjusted to protect a theory.
  - Zombie rivals: logical possibilities that haven't been developed into full research programs.

  Checklist Structure:

  1. **Disagreement Level**: 
     - Question: "Is the disagreement about the core theory itself, or about how the measurement instrument works (i.e., the measurement model)?"
     - If about the measurement model, then note: This is a different kind of dispute (about instrument validity). In the article, clarify that the dispute is about the instrument's interpretation. Then go to step 2.
     - If about the core theory, proceed to step 2.

  2. **Transient vs. Strong Underdetermination**:
     - Question to the scientist: "What single experiment or dataset, if available, would clearly distinguish between these two explanations? And when do you expect that evidence to be available?"
     - If the scientist can name a feasible experiment/dataset and a reasonable timeline (e.g., within 5 years), then it's transient underdetermination. Note: In the article, say that the issue is expected to be resolved by [experiment] in [timeframe], but currently both are possible.
     - If the scientist cannot name any such experiment, or says it's impossible in principle, then it's strong underdetermination. Then ask: "Is there any indirect evidence that might break the tie?" (e.g., simplicity, fit with background knowledge). If not, then in the article you can say the theories are empirically equivalent and the choice is based on non-empirical virtues (like simplicity). But note: strong underdetermination is rare.
     - If the named experiment is far off (e.g., 15 years) or highly speculative, then treat it as transient but note the long wait. In the article, say that resolution is not expected soon.

  3. **Zombie Rival Test**:
     - Question: "Has the rival explanation been developed into a full research program? That is, has it been shown to be compatible with the broader set of established facts in the field, beyond just this one dataset? Can you point to a paper that does that?"
     - If the rival is only invoked for this one dataset and hasn't been shown to explain other phenomena (i.e., no published work developing it as a full alternative), then it's a zombie. Kill it in the article (do not present as a live rival). Instead, note that some critics have raised a logical possibility, but it hasn't been developed.
     - If there is a body of work on the rival, then it's a live rival. Proceed.

  4. **Auxiliary Assumption Adjustment**:
     - When a theory is protected by changing an auxiliary assumption, ask: "Was this auxiliary assumption already under discussion in the field before the current data came in? And was it independently plausible (e.g., supported by other evidence or theoretical reasons) prior to this result?"
     - If yes to both, then it's a principled fix. Acceptable to keep the theory in the running.
     - If no (i.e., the auxiliary was introduced after the fact just to save the theory, with no prior plausibility), then it's a rescue job. The theory might be in trouble. In the article, note that the theory required an ad hoc adjustment to survive the new data.
     - If unclear, then the situation is ambiguous. In the article, report that the theory has been adjusted to account for the data, but some scientists question the adjustment.

  5. **Non-Empirical Virtues**:
     - When theories are empirically equivalent (or nearly so) and the only differences are simplicity, elegance, or fit with background knowledge, then:
       - In the article, state: "While both theories account for the data, many scientists favor [Theory X] because it is simpler/more elegant/fits better with established principles in the field." 
       - Note: This is not "taste" but a legitimate part of scientific reasoning (e.g., Occam's razor). But be transparent that the evidence doesn't force the choice.

  **Decision Points for the Article**:
  - After running the checklist:
    - If the rivals are both live, and the underdetermination is transient (with a clear path to resolution), then present both sides but note that a future experiment will decide.
    - If one side is a zombie, then do not present it as a live rival (mention it as a logical possibility if at all, but don't give it equal weight).
    - If the underdetermination is transient but the resolution is far off, present both but note the long wait.
    - If the underdetermination is strong (rare), present both as empirically equivalent and explain the non-empirical reasons for preference.
    - If one theory has been rescued by an ad hoc auxiliary, then it might be presented as less credible (but note the controversy).
    - If the evidence favors one (e.g., by non-empirical virtues, or by having more plausible auxiliaries), then say so.

  **Handoffs to Stakes Questions**:
  - If the checklist leads to a situation where the evidence doesn't clearly favor one, but the consequences of being wrong are highly asymmetric (e.g., one error would cause great harm), then hand off to the editor for a discussion of stakes. This is not about evidence but about risk management.

  **Limitations of the Checklist**:
  - It relies on the scientist being honest and knowledgeable. There might be biases.
  - It doesn't cover statistical underdetermination (e.g., when both models fit the data within error bars). For that, you might need to ask about confidence intervals and statistical power. But given your background, maybe just ask: "Are the differences between the models within the margin of error of the measurements?" If yes, then it's underdetermined in a statistical sense.
  - It doesn't resolve deep philosophical issues (e.g., whether simplicity is truth-conducive). We are using it as a practical tool.

  Now, run the three cases:

  **Case 1: Ancient-climate proxy**
  - Disagreement level: Core theory (what the proxy measures: pH vs. temperature).
  - Transient vs. strong: They name a lab calibration that would settle it, but it would take years. So transient underdetermination with long wait.
  - Zombie test: Both are likely live research programs (probably both have been used in the field). So both are live.
  - Auxiliary assumptions: Not the main issue here.
  - Non-empirical virtues: Maybe one is simpler? But not clear.
  - **Conclusion**: File the both-sides version, but note that a future calibration experiment (though years away) is expected to settle it.

  **Case 2: Psychology result**
  - Disagreement level: Core theory (cognitive mechanism vs. motivation).
  - Transient vs. strong: They can name a subgroup analysis that would separate them. So transient. If it hasn't been run, ask: "Why hasn't it been run? Is it feasible?" If feasible and could be done soon, then transient. If not feasible (e.g., because the subgroups aren't identifiable), then maybe strong? But the scientist might say it's feasible. Let's assume it is.
  - Zombie test: The motivation alternative might be a common critique in psychology. But if the critic hasn't developed it into a full model that explains other phenomena, it might be a zombie. However, it's a well-known alternative (like placebo effect in medicine) so it might be live. But ask: "Is there a body of work on this motivation effect in similar contexts?" If yes, live; if not, zombie.
  - Auxiliary assumptions: Not the main issue.
  - Non-empirical virtues: The cognitive mechanism might be more specific and thus more testable (a virtue). 
  - **Conclusion**: If the motivation rival is a zombie (just a logical possibility without development), then don't present it as a full rival. If it's a live research program (e.g., if there are papers on motivation effects in training), then present both and note that a subgroup analysis is needed to decide. But if the rival is a zombie, then in the article you might write: "Critics have suggested that the effect might be due to motivation, but without a detailed model and supporting evidence, the authors' cognitive explanation remains the leading one."

  **Case 3: Maverick vs. Mainstream (instruments with shared systematic error)**
  - Disagreement level: Measurement model (the maverick says the instruments have a shared systematic error).
  - Transient vs. strong: The maverick should name an experiment to test for the systematic error. For example, using a different instrument lineage or a calibration standard. If they can't, or if it's impossible, then strong underdetermination? But typically, systematic errors can be tested. If they name an experiment, then transient. But if it's been done and didn't show an error, then the maverick might adjust auxiliaries (step 4).
  - Zombie test: The key question: Has the maverick developed a full research program? That is, have they shown that their alternative theory (with the systematic error) can explain the broader body of data in the field? Or is it only used to explain away the data that supports the mainstream? 
    - If the maverick hasn't developed the alternative to explain other established facts, then it's a zombie. 
    - Example: In cosmology, if someone says "all the telescopes are wrong", they must build an alternative model that explains the same data (like the cosmic microwave background, supernovae, etc.) without the standard model. If they haven't, it's a zombie.
  - Auxiliary assumptions: The maverick is introducing a new auxiliary (the systematic error) to protect their theory. We must check: Was this systematic error already suspected? Or is it ad hoc? 
    - If the systematic error was not previously known or suspected, and there's no independent evidence for it, then it's a rescue job.
  - **Conclusion**: 
    - If the maverick hasn't developed a full alternative research program (zombie) and the systematic error is ad hoc (rescue job), then the framing as a near-scandal is not justified. 
    - To make it a live rival, the maverick would have to:
        a) Develop a full alternative model that explains the existing body of data (not just the data that the mainstream model explains).
        b) Provide independent evidence for the systematic error (e.g., from calibration tests) or at least show that it's plausible based on known instrument limitations.
    - Without that, it's a zombie. In the article, you should not present it as a live rival. Instead, note that while the maverick raises a theoretical concern, the mainstream model remains the best explanation because it accounts for the data without ad hoc adjustments and has been validated in multiple ways.

  **Final Checklist Summary (for your phone call)**:

  1. **Disagreement Level**: 
     - "Is the dispute about the core theory or the measurement instrument?"
     - If instrument, note that and proceed.

  2. **Transient vs. Strong Underdetermination**:
     - "What experiment or dataset would settle the issue? When will it be available?"
     - If named and feasible within a few years: transient (note the timeline).
     - If not named or impossible: strong (then ask about indirect evidence).

  3. **Zombie Test**:
     - "Has the rival been developed into a full research program? Can you point to published work that shows it explains a broad range of phenomena?"
     - If no, it's a zombie (downgrade or omit).

  4. **Auxiliary Assumption Adjustment**:
     - If a theory was saved by an auxiliary: "Was this auxiliary already under discussion and independently plausible before the new data?"
     - If no, it's a rescue job (note that in the article).

  5. **Non-Empirical Virtues**:
     - If still underdetermined, report the non-empirical reasons for preference (simplicity, etc.).

  **Article Decisions**:
  - Both-sides: Live rivals, transient underdetermination.
  - One side ahead: One is a zombie, or one required a rescue job, or non-empirical virtues clearly favor one.
  - Handoff to editor: When evidence is unclear but stakes are high (e.g., policy implications, safety).

  This checklist should fit within 20 minutes if you focus the scientist on these questions. Good luck!
answer: |-
  Below is a decision checklist designed for your scenario—a 20-minute phone call with a scientist to evaluate whether rival explanations are genuinely underdetermined by evidence, whether one is favored, or whether the dispute reflects deeper issues. The checklist is based on philosophy-of-science principles (e.g., underdetermination, auxiliary assumptions, empirical equivalence) but simplified for practicality. It includes your requested gates, outputs for article framing ("both-sides," "one side ahead," or "handoff"), and explicit limitations. 

  I've structured it as a flowchart in words with yes/no questions. **Key simplifications made**:
  - Dropped deep philosophy (e.g., "hypotheses tested in bundles") for concrete proxies like feasibility of experiments or independent plausibility of assumptions.
  - Kept core distinctions: transient vs. strong underdetermination, zombie rivals, principled vs. ad hoc fixes, and empirical equivalence.
  - Added a "stakes handoff" gate for cases where societal risk, not evidence, should drive framing.

  ---

  ### **Science Underdetermination Decision Checklist**
  **Use this in a 20-min phone call with a scientist (author of one theory). Start with: "I'm trying to fairly represent this disagreement—can I run a few quick questions by you?"**

  1. **Disagreement Level**  
     **Question:** "Is the core disagreement about the *theory itself* (e.g., what causes the phenomenon), or about the *measurement model* (e.g., whether the instrument actually tracks what it claims to)?"  
     - **If measurement model:** Treat as a validity dispute. Output: "File a both-sides version, but specify: 'Scientists disagree on whether the tools can measure the thing in question.'" Proceed to Gate 2.  
     - **If theory itself:** Proceed to Gate 2.  
     *Why: Measurement disputes are more fundamental and often require instrument-validation studies.*

  2. **Transient vs. Strong Underdetermination**  
     **Question:** "What *single experiment or dataset* could decisively settle this? When could it realistically exist?"  
     - **If they name a feasible study/dataset AND give a timeline ≤5 years:** Transient underdetermination. Output: "File both-sides but add: 'This could be resolved by [experiment] by [timeline].'"  
     - **If no named study, or timeline >5 years/uncertain:** Ask: "Could *any* evidence settle this, even in theory?"  
       - **If yes:** Still transient, but note delay. Output: "File both-sides but add: 'Resolution is possible but not imminent—likely years away.'"  
       - **If no (or 'only indirect evidence'):** Strong underdetermination. Proceed to Gate 5.  
     *Why: Forces specificity. >5 years is de facto strong for journalism (avoids "wait forever").*

  3. **Zombie Rival Test**  
     **Question:** "Has the rival been developed into a *full research program*? Specifically, has it been published in a way that explains *other established data* in this field, beyond just this one dataset?"  
     - **If yes (they cite papers/models):** Live rival. Proceed to Gate 4.  
     - **If no (or only abstract/logical):** Zombie rival. Output: "Do NOT file both-sides. Write: 'Some argue [rival] is possible, but it hasn't been shown to work beyond this case.'" End.  
     *Why: Zombies lack explanatory power; this avoids accusing sources of bad faith by focusing on published work.*

  4. **Auxiliary Assumption Adjustment**  
     **Question:** "If a theory was saved by changing background assumptions (e.g., calibration, noise model), was that adjustment *independently plausible before this dataset*? For example, was it already discussed in the literature or supported by other evidence?"  
     - **If yes:** Principled fix. Output: "File one-side-ahead: 'Evidence favors [X], though [rival] remains plausible with adjusted assumptions.'"  
     - **If no (adjustment is new/ad hoc):** Rescue job. Output: "File one-side-ahead: '[X] is better supported; [rival] requires unsupported adjustments.'"  
     - **If unclear:** Output: "Handoff to editor. Evidence is ambiguous; framing depends on stakes."  
     *Why: Your naive rule works—plausibility *before* the data avoids hindsight bias.*

  5. **Non-Empirical Virtues (for strong underdetermination/empirical equivalence)**  
     **Question:** "If the rivals predict the same outcomes, is one favored by *simplicity, elegance, or fit with established knowledge*? Is this consensus in the field?"  
     - **If yes:** Output: "File one-side-ahead: 'Scientists tentatively favor [X] for its simplicity/consistency with [field], though evidence doesn't decide.' Use this sentence: 'The choice rests on scientific values like simplicity, not direct evidence.'"  
     - **If no:** Output: "File both-sides: 'The theories are empirically equivalent; choice may reflect non-empirical preferences.'"  
     *Why: These virtues are legitimate but subjective; transparency is key.*

  **Final Outputs & Handoffs**  
  - **Both-sides version:** Use when rivals are live, underdetermination is transient/strong, and neither has ad hoc fixes.  
  - **One-side-ahead:** Use when one rival is a zombie, requires ad hoc fixes, or non-empirical virtues favor it.  
  - **Handoff to editor:** When evidence is ambiguous BUT:  
    - Stakes are high (e.g., health, policy, equity risks).  
    - Output: "This isn't about evidence—it's about risks if we're wrong. Editor must decide framing based on societal impact."  

  ---

  **Limitations of This Checklist**  
  1. **Stats-blind:** Cannot evaluate statistical underdetermination (e.g., overlapping error bars). If a source says "the data is noisy," ask: "Would better stats tools help?" If yes, treat as transient underdetermination.  
  2. **No deep philosophy:** Drops nuances like "holistic testing of bundles" for feasibility.  
  3. **Source bias:** Relies on scientists being honest; cross-check with a neutral expert if time allows.  
  4. **Time-constrained:** Cannot resolve fields that are "genuinely stuck." For that, defer to editor judgment.  
  5. **Empirical equivalence:** Rare in practice; most rivals diverge somewhere. The checklist errs toward skepticism.  

  ---

  ### **Case Applications**  
  **Case 1: Ancient-climate proxy (pH vs. temperature models)**  
  - **Gate 1:** Theory-level (both agree instrument tracks *something*).  
  - **Gate 2:** Transient underdetermination—lab calibration named, but years away.  
  - **Gate 3:** Both are live (published models used in climate science).  
  - **Gate 4:** Not triggered (no auxiliary adjustments mentioned).  
  - **Output:** File both-sides version. Add: "A lab calibration could resolve this but may take years."  

  **Case 2: Psychology training (cognitive mechanism vs. motivation)**  
  - **Gate 1:** Theory-level (both agree test scores are valid).  
  - **Gate 2:** Transient—subgroup analysis named, feasible soon.  
  - **Gate 3:** **Zombie rival.** Motivation is a "handwave" alternative; no published model explains broader data (e.g., cognitive tasks outside this experiment).  
  - **Output:** Do NOT file both-sides. Write: "The authors' mechanism is best supported; motivation critiques lack a developed model."  

  **Case 3: Maverick vs. mainstream (shared instrument error)**  
  - **Gate 1:** Measurement-model dispute (maverick claims instruments are biased).  
  - **Gate 2:** Transient—experiment possible (e.g., use different instruments).  
  - **Gate 3:** **Zombie rival.** Maverick hasn't shown their model explains other data (e.g., why mainstream instruments work in *unrelated* studies). Only used to explain away this dataset.  
  - **Gate 4:** Auxiliary adjustment (shared error) is ad hoc—not plausible before this data, no independent evidence.  
  - **Output:** Your framing *is* problematic. **Kill the near-scandal angle.** Instead: "A skeptic questions instrument validity, but this lacks evidence and a broader model."  
    - **To make it live:** The maverick must:  
      1. Publish a full alternative *research program* that explains existing data beyond this case.  
      2. Provide independent evidence for the error (e.g., calibration tests).  
      Without this, it's not credible.  

  ---

  ### **Final Advice**  
  - **For your editor:** Frame this checklist as a "source-interrogation tool" to avoid both-sides-ism. It prioritizes empirical traction over logical possibility.  
  - **When stuck:** Default to: "Scientists are still working to distinguish these explanations." This is honest without overclaiming.  
  - **On your maverick case:** You suspected right—it’s a zombie. Rewrite to focus on the burden of proof: extraordinary claims require extraordinary evidence.  

  This system won’t please everyone (especially losing-side researchers), but it grounds disputes in testable reality. Use it as a living document—tweak based on what works. Good luck!
