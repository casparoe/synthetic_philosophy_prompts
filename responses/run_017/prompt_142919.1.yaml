  ### (d) Informativeness Bonus  
  No bonus added. Informativeness is already rewarded *implicitly* in UEB/BXB by improved Brier scores under informed refinement (e.g., splitting cells proportionally to truth lowers expected score). Explicit bonuses break propriety, inviting gaming (e.g., spurious distinctions for rewards). UEB’s neutrality to uninformed refinement is acceptable; sacrifice punishment of non-informative refinements for coherence.  

  ### (e) Unsettled Questions  
  This framework assumes cross-granularity accuracy comparisons are coherent via extensions or normalizations, but it cannot adjudicate whether vocabularies themselves are epistemic achievements. Drawing distinctions (e.g., identifying subtypes) may reflect knowledge not captured by credences, yet accuracy-first epistemology credits only probabilistic assignments. The setup also cannot resolve if granularity choices are rational—e.g., refining without evidence might be epistemically reckless, but UEB/BXB ignore this. Ultimately, the scorer must decide if "accuracy" includes discriminatory power or is purely calibration given a fixed ontology.
