  ### (c) Ranking by Viability

  We rank the five measures from best to worst (10 to 0) based on:
  - Propriety: we want it to be proper.
  - Reward refinement with genuine information: we want more informative reports to be rewarded if they are informed.
  - Punish refinement without information: uninformed refinement should not help.
  - Resistance to gaming: by coarsening, inventing distinctions, relabeling, or exploiting mu.
  - Fairness in cross-agent comparisons.

  We break ties strictly.

  #### Ranking:

  1. **Uniform-extension Brier (UEB)**: 
     - Propriety: strictly proper.
     - Uninformed refinement: leaves expected score unchanged. This is neutral: it doesn't punish, but doesn't reward without reason. However, it doesn't harm.
     - Gaming: vulnerable to coarsening (merging cells changes the extended distribution) and possibly to choosing which cells to merge. But no harm from uninformed refinement.
     - Fairness: extends all to the same finest partition, so comparable.
     - Score: 8. Failure mode: gaming by coarsening. An agent can merge cells to make the extended distribution more concentrated on the true world if they know the truth.

  2. **Background-extension Brier (BXB)**:
     - Propriety: proper.
     - Uninformed refinement: effect depends on mu. If mu is chosen badly, refinement might hurt or help arbitrarily. This is a big problem.
     - Gaming: highly vulnerable to choice of vocabulary to exploit mu. If mu is not uniform, agents can tailor their partitions to get a better extended distribution.
     - Fairness: comparable.
     - Score: 5. Failure mode: dependence on the background measure mu. The designer's choice of mu can arbitrarily favor some agents or vocabularies.

  3. **Ignorance-normalized Brier (INB)**:
     - Propriety: proper.
     - Uninformed refinement: effect ambiguous. Can be positive or negative, so it might sometimes reward and sometimes punish without information.
     - Gaming: agents can choose the granularity to minimize the score. For example, a very coarse partition (n small) gives a large subtraction (so very negative scores). Also, merging cells might improve the Brier score and reduce n. So gaming by coarsening is a big issue.
     - Fairness: the normalization is per partition, so agents with coarser partitions have an advantage because they subtract a larger constant (since 1-1/n is larger when n is small).
     - Score: 4. Failure mode: gaming by coarsening to a very small n to get a large bonus.

  4. **Atom-log (AL)**:
     - Propriety: proper.
     - Uninformed refinement: worsens expected score. This is good: punishes uninformed refinement.
     - Gaming: very vulnerable to coarsening. An agent can always get a perfect score of 0 by coarsening to the trivial partition. This is the worst gaming.
     - Fairness: scores are not comparable across granularities: an agent with a coarse partition can have low scores without being informative.
     - Score: 3. Failure mode: extreme vulnerability to coarsening.

  5. **Common-coarsening Brier (CCB)**:
     - Propriety: proper on a fixed vocabulary, but for a group.
