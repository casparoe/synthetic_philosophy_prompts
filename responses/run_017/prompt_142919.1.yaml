  ### (d) Bonus for Informativeness

  The question is whether to add an explicit bonus for informativeness (making the measure improper) to any of these.

  Adding a bonus for informativeness would make the measure improper because the agent would be incentivized to be more informative even without having more information.

  We would not add such a bonus. Instead, we would rely on the measure to naturally reward informed refinement. 

  For UEB: uninformed refinement leaves the score unchanged, but informed refinement (splitting in proportion to true beliefs) would improve the extended distribution and hence the Brier score. So we don't need a bonus.

  For BXB: similarly, informed refinement can improve the score.

  For INB: it already has a normalization that might not be enough, and adding a bonus might worsen the gaming.

  For AL and CCB, they are not good.

  Therefore, we would not add a bonus. Instead, we accept that the measure might not reward refinement without information, but we rely on the fact that refinement with information is rewarded. And we give up the idea that uninformed refinement should be punished (as in UEB) because it is not harmful either.

  ### (e) What the Setup Cannot Settle

  This setup assumes that we can compare the accuracy of credal states across different vocabularies. But it might be that such comparisons are not coherent because the agents are not making the same distinctions. The vocabulary itself is an epistemic achievement: an agent that can draw finer distinctions has more knowledge about the possibilities. But in the scoring rules we considered, we either extended arbitrarily (with uniform or mu) or collapsed to a common partition. These methods might not capture the epistemic value of the vocabulary. The scoring rules are not purely about the credences but depend on how we handle the vocabulary. The choice of scoring rule is a value judgment about how to trade off granularity and calibration. Moreover, the setup does not address whether the agent's choice of vocabulary is rational or not; it only scores the credences. In reality, the ability to draw a relevant distinction might be an epistemic achievement that should be credited separately. This setup does not provide a way to do that within accuracy-first epistemology.
