prompt: |-
  I've been reading one of those big-ideas paperbacks I grabbed in the airport before a six-hour delay (philosophy-of-mind chapter, author I'd never heard of, but it reads like it was written by someone who actually knows the literature), and there's a passage on eliminative materialism that I can't work out how much of to trust. It goes roughly like this: "Beliefs and desires don't exist. They are the invented entities of 'folk psychology' — the unscientific bundle of notions ordinary people have about minds — in the way phlogiston was the invented entity of a bad chemistry. Folk psychology has been with us for thousands of years and has explained nothing: it can't tell us how memory works, how learning works, or how a thought manages to be about anything at all. Mature neuroscience will have no use for such states, so we should say they aren't real — and the same goes for conscious experience. Anyway the view refutes itself: if nobody believes anything, then nobody can believe that eliminative materialism is true, and its remaining defenders have never produced an answer to that. The debate has now been settled empirically besides: large language models pass false-belief tests and predict what people will say and do better than any philosopher's armchair theory, which vindicates folk psychology as literally true and falsifies the eliminativists' prediction."

  My flatmate, who's doing a PhD in computational neuroscience, says the self-refutation thing is just the standard objection that everyone trades in, so the book presenting it as unanswered struck her as off; and I kept waiting for the chapter to distinguish eliminating beliefs from reducing them the way water got reduced to H2O, which it never really does. I also cant tell whether its the AI bit that's supposed to be the strong part of the book's case or the weakest.

  Could you go through it more or less sentence by sentence and tag each bit as basically accurate, a rough simplification, or just wrong? For the wrong bits I'd like to know what somebody who actually defends eliminativism would say instead — especially on the consciousness sentence and the language-model sentence, since my hunch is that the view's target was specifically belief-desire psychology rather than experience, and that predictive success doesn't by itself make a theory's posits real (I'd guess phlogiston chemists made serviceable predictions too?), but I genuinely don't know whether either hunch is right. Finish with a straight answer on whether the book's punchline — that the position has been empirically refuted and is finished — survives once you fix the mistakes in the summary. One-line bottom line up front if you can, and keep the whole thing under 650 words.
