  Here’s a decision tree designed for clarity and pedagogical impact, prioritizing concrete cases over abstract theory. The branching order sequences questions to efficiently separate views, starting with high-stakes thresholds and moving toward symbolic/character concerns. Leaves are mutually exclusive where possible, but I note overlaps below.

  ---

  ### **Collective Harm Decision Tree**  
  *Start: "My one act (flight/vote/chicken purchase) makes no noticeable difference."*

  1. **UNKNOWN-SIZE ONE (emissions case)**  
     *Your emissions join millions; harm occurs at unknown thresholds. Could your act tip the scales?*  
     - **Yes** → **Leaf 1: Expected Difference View**  
       *Awkward commitment:* You must defend assigning precise probabilities to chaotic systems (e.g., your CO₂ having a 0.0001% chance of triggering catastrophe).  
     - **No** → Proceed to Node 2.  

  2. **REPLACEABLE ONE (chicken case)**  
     *If you skip buying chicken, the store sells it to another customer, and production stays the same. Is buying still wrong?*  
     - **No** → Proceed to Node 3.  
     - **Yes** → Proceed to Node 4.  

  3. **OVERDETERMINED ONE (key-turning case)**  
     *You’re one of 1,000 turning a key to cause harm; harm occurs regardless of your choice. Is turning your key wrong?*  
     - **No** → **Leaf 2: Inefficacy Permissibility**  
       *Awkward commitment:* Participating in clear atrocities (e.g., genocide) is fine if your role is redundant.  
     - **Yes** → **Leaf 3: Sufficient Set View**  
       *Awkward commitment:* You share *full* responsibility for the harm (e.g., as guilty as every key-turner for murder).  

  4. **NORM ONE (convention erosion)**  
     *Your visible act (e.g., flying) erodes a local norm that restrains harm. Is this why it’s wrong?*  
     - **Yes** → **Leaf 4: Norm-Sustenance View**  
       *Awkward commitment:* Harmful acts are permissible if done secretly or in communities without relevant norms.  
     - **No** → Proceed to Node 5.  

  5. **OFFSET ONE (emissions offsetting)**  
     *You offset your unavoidable flight’s emissions. Does this make it permissible?*  
     - **Yes** → **Leaf 5: Fair-Share View**  
       *Awkward commitment:* Buying offsets absolves you even if the *collective* still fails (e.g., climate collapse occurs).  
     - **No** → Proceed to Node 6.  

  6. **COMPLICITY TEST (meat-eating party)**  
     *You attend a party serving factory-farmed meat but eat vegan. Is attending wrong due to indirect involvement?*  
     - **Yes** → **Leaf 6: Complicity View**  
       *Awkward commitment:* Boycotting all harmful systems (e.g., capitalism) is required, even if futile.  
     - **No** → **Leaf 7: Expressive/Symbolic View**  
       *Awkward commitment:* The act is wrong *only* if it expresses contempt (e.g., eating meat "to own the vegans"), not if done regretfully.  
     *(Note: Those who reach Node 6 but answer "No" land here, as character concerns are absorbed into expressivism—see notes below.)*  

  ---

  ### **Key Notes**  
  1. **Unseparated Leaves**:  
     - **Character vs. Expressivism**: These collapse into **Leaf 7 (Expressive View)**. Distinguishing them requires abstract questions (e.g., "Is the wrongness about your *character* or what you *communicate*?"), violating your "no theory" constraint. Expressivism covers both: expressing bad values *makes* you vicious.  
     - **Complicity vs. Expressivism**: Separated by Node 6 (complicity requires participation; expressivism focuses on meaning).  

  2. **Empty/Incoherent Paths**:  
     - **"Node 3 (Overdetermined) → Yes + Node 4 (Norm) → Yes"**: No leaf! Theorists who accept *both* sufficient sets *and* norms are rare—they’d need to argue norms are irrelevant in overdetermined cases (incoherent, as norms could still apply).  
     - **"Node 5 (Offset) → No + Node 6 (Complicity) → Yes"**: Coherent but unfashionable (e.g., hardline deontologists who reject offsets *and* complicity).  

  3. **Design Choices**:  
     - **Why this order?** Tests causal efficacy (Nodes 1–3) before symbolic concerns (Nodes 4–6), mirroring how students intuitively progress.  
     - **Rigged Cases?** The **Offset One** slightly favors consequentialism—but this reflects real debates (e.g., carbon offset controversies).  
     - **Missing Branch?** No node explicitly tests "collective duty" beyond fair shares (handled in Offset One). Adding it would bloat the tree and overlap with Node 3.  

  4. **Leaf Summary**:
     - Expected Difference (1), Inefficacy (2), Sufficient Set (3), Norm-Sustenance (4), Fair-Share (5), Complicity (6), Expressive (7).  
     *(Character view merged into Leaf 7.)*

