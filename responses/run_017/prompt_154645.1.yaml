prompt: |-
  My friend Marisol and I got into this again at a barbeque on Sunday, and I want to settle it before I do something dumb. She's the person I go to when I want a hard line on something, and she has extremely firm verdicts about lying vs. merely misleading, but I've never once managed to get her to say what the rule underneath is. Her track record, as best I can reconstruct it from a bunch of arguments over the years: I bailed on a dinner and texted that I was sick when I just didn't feel like going — she said that's a lie, it was wrong, I owe an apology. In her own salary negotiation she told a recruiter "I have a competing offer at 130" when what she actually had was a verbal indication from a friend of a friend and nothing in writing — she says this isnt lying, isn't even a little bit wrong, "that's what negotiation is." (She has a name for this kind of literally-true-but-engineered-to-mislead move, paltering.) A tenant who notices a slow leak under the sink and says nothing to the landlord: she said nothing is owed there, it's not your job to volunteer things. But a doctor who gets asked point blank "is this procedure safe?" and answers "every procedure carries some risk," knowing the complication rate is around one in three: she said that's just as bad as a lie, maybe worse, because the question was direct. The murderer at the door: lie to him, and it isn't even the kind of misleading you'd have to feel bad about. A bank that discloses a fee in six-point type at the bottom of page four: she shrugged, read the contract. And a politician parsing words under oath so every sentence is literally true while the overall impression is false: she said it isn't lying, but she'd rather be lied to straight out, because a straight lie at least leaves you somewhere to stand.

  So here's the new one, and it's not hypothetical — my advisor asked me to draft it and I'd like to know what Marisol will say before I send it. It's an email from my department's graduate coordinator to admitted students: "All of our students are fully funded for five years." That's literally true, funding really is guaranteed, but she knows that years four and five are funded by a teaching assignment that in practice eats the time everyone expects to spend on research, and that admitted students near-universally read "fully funded" as "you won't have to teach, you can just work." Nobody asked her a question, she isn't selling anything, nobody's adversarial here, and she picked this exact wording after a colleague pointed out that "you'll have no teaching duties" would be false. So: what does Marisol say? I'm less interested in the verdict itself than in the rule she seems to be running, the other rules that fit all seven of her earlier verdicts just as well, and which of those rules actually come apart on this case — my guess is something hangs on whether the literal truth matters, or on whether a question has to have been asked, or on whether it's the intention that does the work, but I can't tell which.

  And if you can, tell me the single further case I should put to her that would genuinely settle which rule she's on. I was going to ask her about the very same email in the version where the coordinator just copy-pasted the boilerplate and never thought about the implicature at all — my thought was that if she still says "as bad as a lie" then intention isn't doing the work for her, and if she says "much less bad" then it is — but maybe there's a cleaner one. Please also say roughly how confident you are in each part of what you're claiming, and single out the point you're least sure about; I'd rather have that than a confident answer I can't check.
reasoning: |-
  Okay, let me tackle this user's problem step by step. They're in a debate with their friend Marisol about the ethics of misleading statements versus outright lies. The user has provided several examples of Marisol's judgments and wants to figure out the underlying rule she uses, especially regarding an email they need to draft about graduate funding.

  First, I need to analyze all the cases Marisol has ruled on. The user mentioned seven scenarios: 
  1. Texting sick when not actually sick - Marisol called this a lie. 
  2. Salary negotiation with a verbal offer - She said it's not lying. 
  3. Tenant not reporting a leak - No obligation. 
  4. Doctor avoiding a direct question - As bad as a lie. 
  5. Lying to a murderer - Not bad. 
  6. Bank's fine print - Shrugged it off. 
  7. Politician parsing words - Not lying but worse than a straight lie. 

  The pattern here suggests Marisol distinguishes between direct falsehoods and misleading truths. But her judgments vary based on context. For the doctor, evasion is bad because of the direct question. In negotiation, misleading is acceptable. The key factors seem to be: whether a question was asked directly, the adversarial nature of the situation, and the speaker's intention to deceive.

  The user's current dilemma is about an email stating students are "fully funded" when years 4-5 require teaching that impacts research time. The literal truth is there, but it misleads. Since no one asked a direct question and it's not adversarial, Marisol might deem it acceptable like the tenant case. But if she views the department as having a duty to inform, similar to the doctor, she might condemn it. 

  To test the intention factor, the user proposed a scenario where the coordinator didn't think about the implicature. If Marisol still condemns it, intention isn't key. A cleaner test might be a non-adversarial direct question, like a student asking if they'll have to teach. If evasion is bad here but not in salary negotiation, that highlights the adversarial context as crucial. 

  I also need to consider the user's deeper needs. They want to avoid conflict with Marisol and ensure their email is ethical. They might also seek a framework to predict Marisol's judgments in the future. The analysis should provide clarity on the underlying principles, helping the user navigate similar situations without constant arguments.
answer: |-
  Based on Marisol's track record and the principles underlying her judgments, here's the breakdown for your email case, the likely rule, alternative rules tested against her history, the critical test case to probe her rule, and confidence levels:

  1.  **Verdict on Your Email ("All of our students are fully funded for five years"):**
      *   **Marisol Will Say:** **This is misleading and wrong, likely "as bad as a lie" in this context.**
      *   **Reasoning:** While literally true ("funding is guaranteed"), the statement exploits a predictable and highly relevant misunderstanding ("no teaching duties"). Crucially, the department *knows* students universally interpret "fully funded" this way in academia and *chose* the wording *specifically* to preserve literal truth while creating this false impression (after rejecting a clearer, false statement). This mirrors the *Doctor* case (evasion of direct intent exploiting known inference) and the *Politician* case (literalism creating a false impression). The absence of a direct question or adversarial context (like the *Tenant*) is likely outweighed by the coordinator's *intentional creation* of a significant false belief during a critical, non-adversarial informational process where transparency is reasonably expected.
      *   **Confidence:** 85%. Her strong stance on the Doctor and Politician cases, combined with the intentionality here, points firmly to condemnation.

  2.  **Marisol's Underlying Rule:**
      *   **The Rule:** **Deception is wrong when you *intentionally exploit a predictable and reasonable inference* to create or sustain a materially false belief in the listener's mind, especially if you have a duty of candor or the context demands transparency, *regardless of literal truth*.**
      *   **How it Explains Her Cases:**
          *   **Sick Text (Lie):** Direct falsehood, exploits inference you are actually sick. Duty to friend.
          *   **Salary Negotiation (OK Paltering):** Literally true. Inference ("I have a firm written offer") *might* be drawn, but context is adversarial negotiation where such inferences/paltering are expected norms. No special duty of candor to the *other side*.
          *   **Tenant Leak (OK):** No active statement made. No direct question. Tenant has no affirmative duty to landlord in this scenario. Landlord has responsibility to inspect.
          *   **Doctor (Worse than Lie):** Direct question. Answer exploits inference ("risk is normal/low") when truth is high risk (1/3). Strong duty of candor. Intentional misleading.
          *   **Murderer (OK Lie):** Extraordinary context overrides normal duties. Self-preservation.
          *   **Bank Fine Print (Shrug):** Literally disclosed, even if buried. Context is adversarial contract negotiation ("buyer beware," caveat emptor). Duty is arguably met by disclosure, however minimal. No *intentional active misleading statement* - just passive obscurity.
          *   **Politician (Not Lie but Bad):** Literally true sentences, but *intentionally structured* to exploit inferences and create an overall false impression. Violates the *spirit* of the duty of candor under oath, even if technically legal. Worse than a lie because it's manipulative and evasive.
      *   **Confidence in Rule:** 80%. It consistently explains the emphasis on *intention*, *exploiting predictable inferences*, *duty/context*, and the demotion of literal truth as decisive when those elements are present.

  3.  **Alternative Rules & Why They Fail:**
      *   **"Literal Truth Always Permissible" (Fails Doctor, Politician, likely your Email):** Doesn't explain why Doctor's evasion and Politician's parsing are condemned. Marisol clearly values more than just literal truth.
      *   **"Lying Always Wrong; Misleading Sometimes OK" (Fails Sick Text vs. Salary Paltering):** Doesn't explain *why* misleading is OK in Salary but condemned in Doctor/Politician/Email. Needs the context/duty/intention elements.
      *   **"Direct Question Required for Wrongdoing" (Fails Sick Text, Politician, Bank, your Email):** Wrongdoing occurs without a direct question (Sick Text - making a false statement; Politician - creating false impression; Email - likely). Also, Bank had disclosure but no question, shrugged.
      *   **"Intention is Everything" (Fails Bank?):** The Bank arguably *intends* for people to miss the fee. Yet Marisol shrugs. This suggests context (adversarial negotiation, caveat emptor) *limits* the duty of candor, even with some bad intent. Her rule likely combines intention *with* context/duty.

  4.  **The Critical Test Case to Settle the Rule:**
      *   **Your Proposed Test (Unintentional Implicature):** *"What if the Grad Coordinator genuinely didn't think about how 'fully funded' would be interpreted and just used the boilerplate language without any intent to mislead?"*
      *   **Why it's Good:** Directly tests the weight of *intention* vs. outcome/duty. If she says **"Much less bad, maybe careless but not deceptive"**, **Intention is crucial** to her "as bad as a lie" condemnation. If she says **"Still misleading and wrong, they *should* have known"**, then **Duty/Outcome** matters more, and intention is secondary (the department has a duty to anticipate and correct the misunderstanding).
      *   **A Cleaner/Complementary Test (Non-Adversarial Direct Question + Paltering):** *"A student applicant emails the Grad Coordinator directly: 'Just to confirm, does 'fully funded' mean I won't have any teaching duties so I can focus solely on research?' The Coordinator replies, 'All funding commitments are guaranteed for five years,' knowing this answer avoids the truth (that years 4-5 *are* teaching-funded) but is literally true."*
      *   **Why it's Better:** Combines key elements:
          *   *Direct Question:* Like the Doctor.
          *   *Paltering/Literal Truth:* Like Salary Negotiation/Politician.
          *   *Non-Adversarial Context & Duty of Candor:* Like your Email/Doctor (not like Salary/Bank).
          *   *Intentional Exploitation of Inference:* Clear.
      *   **Prediction:** Marisol will condemn this **strongly, likely "as bad as a lie" or worse.** It has the Doctor's direct question and duty, the Politician's paltering, and your Email's context. This contrasts sharply with the *Salary Negotiation* paltering, highlighting that the *context* (adversarial vs. informational/duty-based) is the critical differentiator for her, *not* the paltering itself. If she condemns this but accepted Salary paltering, it confirms Context/Duty is paramount. If she *accepts* this answer, it fundamentally breaks her pattern (especially vs. the Doctor).

  **Confidence Breakdown & Least Sure Point:**

  *   **Verdict on Your Email (Misleading/Wrong):** 85% (Fits Doctor/Politician pattern; intentionality clear).
  *   **Underlying Rule (Intentional Exploitation of Inference + Duty/Context):** 80% (Consistently explains all cases; Bank is the biggest stretch but explicable by caveat emptor norms limiting duty).
  *   **Failure of Alternative Rules:** 90% (They clearly fail on multiple cases).
  *   **Effectiveness of Your Unintentional Test:** 75% (Good test of intention's weight, but the duty element might still trigger condemnation).
  *   **Effectiveness/Criticality of Non-Adversarial Direct Question Paltering Test:** 95% (Directly pits the elements against each other in a way that should force a clear distinction based on Context/Duty).
  *   **Prediction for Non-Adversarial Direct Question Paltering Test (Strong Condemnation):** 90% (If she *doesn't* condemn this, it invalidates her stance on the Doctor and Politician).

  **Least Sure Point:** **The exact weight of "duty" vs. "adversarial context" in the Bank case.** I'm 80% confident the caveat emptor/adversarial context explains her shrug, but there's a 20% chance she actually thinks the Bank's action *is* somewhat deceptive/wrong, just "how the game is played" (like Salary negotiation), and she shrugged because she sees it as an unfortunate norm rather than actively endorsing it. The proposed "Non-Adversarial Direct Question Paltering" test helps clarify this by showing if adversarial context is the *key* legitimizing factor for paltering for her.

  **Recommendation:** Run the **"Non-Adversarial Direct Question Paltering"** test case by Marisol ("Student asks directly about teaching; Coordinator dodges with literal truth"). Her reaction will decisively confirm or refute the "Intentional Exploitation + Duty/Context" rule and highlight the critical role of adversarial context in permitting paltering.
