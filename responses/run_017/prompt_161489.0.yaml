prompt: |-
  I sit on the ethics working group that advises our municipality's autonomous shuttle pilot. We rule on stylised emergency scenarios, and the engineers then have to implement each ruling as a constraint on the motion planner. We are down to one scenario that has resisted a decision, and I want the ruling, not a survey of the literature on trolley cases. Unless I say otherwise, in every scenario the service brakes have failed, everyone involved is an adult, no one is responsible for the emergency, no one has consented to anything, and the shuttle owes no one a special duty.

  Our seven precedents:

  1. *Divert.* Five pedestrians in the crosswalk ahead. The shuttle can swerve onto a wide sidewalk where one pedestrian is standing; a wall beyond her stops the shuttle before it reaches anyone else; she is killed by the swerve. Ruled: MAY swerve.
  2. *Plow.* No swerve available. A side-mounted plow could sweep a bystander into the shuttle's path so that his body stops it; he is killed. Ruled: MAY NOT.
  3. *Loop.* Swerve onto a service lane where one worker is standing. Nothing beyond him stops the shuttle: the collision with him is what halts it before it can continue to the five. He is killed. Ruled: MAY NOT.
  4. *Sandbags.* Steer into a sandbag barrier. The shuttle derails, and flying debris kills a bystander standing several metres away. Ruled: MAY.
  5. *Even numbers.* One pedestrian ahead, one pedestrian on the sidewalk, no other difference. Ruled: MAY NOT swerve.
  6. *Doomed worker.* As in *Loop*, the collision with the worker in the service lane is the only thing that will stop the shuttle — except that an unrelated scaffold is collapsing and will crush him two seconds later whatever we do, so the collision costs him nothing. Ruled: MAY.
  7. *Passenger.* The shuttle can save five pedestrians only by swerving into a concrete barrier, which kills its own passenger. Ruled: MAY NOT.

  The undecided case:

  *Trigger.* The mechanical brakes have failed, but the shuttle carries an automatic emergency braking system that engages only on a confirmed pedestrian detection within three metres. The five are around a bend, outside sensor range. The only pedestrian the shuttle can detect is a worker in the service lane. If the shuttle enters the lane, the emergency system fires as it closes on the worker and stops the shuttle before it can reach the five. The planner estimates roughly one chance in three that the shuttle still strikes him before stopping, with death near-certain if it does. His body contributes nothing to stopping the shuttle — the brakes do all the work — but his presence in the lane is what makes them fire.

  Several members keep reaching for the doctrine of double effect and its distinction between harm intended as a means and harm merely foreseen as a side effect. I do not think that settles anything here, because the case sits exactly where that distinction is ambiguous: the rescue runs through the worker, but arguably not through any harm to him.

  What I want from you:

  1. The two or three principles that fit all seven precedents. State each precisely enough to be implemented, and say which precedent does the work for it and which precedent it has to explain away — in particular how each handles *Doomed worker* and *Passenger*.
  2. What each principle predicts about *Trigger*.
  3. The ruling you recommend, with your reasons, and the closest analog among precedents 1 to 7. I take it that *Trigger* has something in common with both *Divert* and *Loop*; I want to know which one controls and why.
  4. What we would be committing ourselves to either way — including whether a MAY NOT commits us to anything about cases in which the person the manoeuvre runs through suffers no harm at all.
  5. The one further variant that would separate the surviving principles. We can construct whatever you need: a version in which the strike probability is effectively zero, a worker merely detected from a safe distance behind a fence, a consenting test worker, a worker who caused the brake failure. Take whichever does the most work.
  6. Whether the principle you recommend can be stated without appealing to anyone's intention, since the engineers cannot implement a constraint on intentions — and, if it cannot, what we lose by recasting it in causal or structural terms.

  If you think one of the seven is bearing more weight than it can bear, say so. And if it helps, add where you expect the group in fact to land, as opposed to where consistency pushes it.
reasoning: |-
  Okay, let me tackle this ethics problem step by step. The user is on an ethics working group for an autonomous shuttle pilot and needs a ruling on the "Trigger" scenario. They've provided seven precedents and want a principled approach to resolve this last case.

  First, I need to extract clear principles from the precedents. Looking at the rulings:
  - Divert allows swerving where harm is indirect (sidewalk impact stops the shuttle)
  - Plow forbids actively using a person as a physical tool
  - Loop prohibits using collision as the stopping mechanism
  - Sandbags permits indirect harm from secondary effects
  - Even numbers rejects trading one life for another
  - Doomed worker allows it when harm is non-existent (worker already doomed)
  - Passenger forbids sacrificing an onboard passenger

  Hmm... three principles emerge consistently:
  1. Means prohibition: Can't use someone's body as the physical stopping mechanism
  2. Substitution prohibition: Can't directly swap one life for another
  3. Harm mitigation: Allowed if harm is indirect/byproduct without substitution

  Now testing against tricky cases:
  - Doomed worker fits because no actual harm occurs
  - Passenger violates substitution (1:1 trade) and means (barrier impact targets passenger)

  For Trigger case:
  - Worker isn't the stopping mechanism (brakes do the work)
  - But presence triggers brakes - is this "using as means"? 
  - Probability of harm complicates things (only 33% chance)

  Closest precedent is Divert (allowed) rather than Loop (prohibited). Key distinction: in Divert the pedestrian happens to be where the shuttle stops, whereas in Loop the collision itself provides deceleration. Trigger mirrors Divert - the worker's location enables braking, but isn't physically stopping it.

  Recommended ruling: MAY swerve. Because:
  - No bodily substitution (brakes stop, not impact)
  - Harm is probabilistic side effect, not guaranteed means
  - Analogous to Sandbags' indirect debris risk

  If we forbid this, we'd have to also forbid cases where zero harm occurs - like if worker was behind fence. But that seems inconsistent. The test case that would clarify is a "Zero Harm Trigger" variant where detection causes braking with no collision risk.

  Implementation note: Principles avoid intentions by focusing on physical causality. For Trigger, the constraint is about whether the maneuver relies on impact with a person for deceleration - which it doesn't.

  I suspect the group might forbid this due to discomfort with "using" the worker, but consistency demands permission. The critical boundary is physical mechanics, not detection logic.
answer: |-
  Here is a structured analysis based strictly on your precedents and requirements. I distill principles from the rulings, avoiding ethical theories in favor of operationalizable constraints.

  ---

  ### **1. Principles Fitting All Seven Precedents**  
  *(Precise, implementable, with precedent roles)*  

  **Principle 1: No Direct Bodily Substitution**  
  *Rule:* The shuttle cannot use a person’s body as the *direct physical mechanism* to achieve stopping (e.g., collision as energy absorption). Harm must not be the *causal means* of salvation.  
  - **Workhorse Precedents:** *Plow* (sweeping bystander as brake), *Loop* (collision halts shuttle), *Passenger* (barrier impact targets passenger).  
  - **Explains Away *Doomed worker*:** Permitted because harm isn’t the stopping mechanism (scaffold kills regardless; collision is incidental).  
  - **Handles *Passenger*:** Forbidden because passenger’s death is the direct cost of stopping (barrier impact).  

  **Principle 2: No Net Life Tradeoff**  
  *Rule:* Cannot sacrifice one to save N if N=1 ("even swap") or if the action *intrinsically* exchanges one life for others.  
  - **Workhorse Precedents:** *Even numbers* (1-for-1 forbidden), *Passenger* (1-for-5 forbidden).  
  - **Explains Away *Divert*:** Permitted because 5 > 1, and harm isn’t an "exchange" (sidewalk impact stops shuttle via wall, not person).  
  - **Handles *Doomed worker*:** Allowed because no net loss (worker dies regardless).  

  **Principle 3: Indirect Harm Permitted**  
  *Rule:* Foreseen but unintended physical side effects (e.g., debris, environmental interactions) are allowed if they don’t violate Principles 1–2.  
  - **Workhorse Precedents:** *Divert* (wall—not person—stops shuttle), *Sandbags* (debris kills indirectly).  
  - **Explains Away *Loop*:** Forbidden due to Principle 1 (direct bodily use), not Principle 3.  

  ---

  ### **2. Prediction for *Trigger***  
  - **Principle 1:** Worker’s body isn’t the stopping mechanism (brakes stop the shuttle; presence only triggers activation). → **Predicts MAY.**  
  - **Principle 2:** No inherent tradeoff (5 > 1; harm is probabilistic). → **Predicts MAY.**  
  - **Principle 3:** Harm is a side effect of braking (like debris in *Sandbags*). → **Predicts MAY.**  
  **Consensus:** All principles predict **MAY SWERVE**.  

  ---

  ### **3. Recommended Ruling & Closest Analog**  
  - **Ruling:** **MAY** swerve into the service lane.  
  - **Reason:**  
    - *Trigger* aligns with **Divert**: Worker’s presence enables braking (like the sidewalk wall in *Divert*), but their body isn’t the deceleration mechanism. Harm is probabilistic and indirect (like *Sandbags*).  
    - *Distinct from Loop*: In *Loop*, collision *is* the stopping mechanism—violating Principle 1. Here, brakes halt the shuttle; the worker merely enables detection.  
  - **Closest Analog:** **Divert** (both use environment to stop; harm is incidental).  

  ---

  ### **4. Commitments Either Way**  
  - **If MAY:**  
    - Commits to allowing maneuvers where a person’s *presence* (not body) triggers a safety system, even with risk of harm.  
    - Does **not** require harm to occur: If a "fenced worker" variant posed zero collision risk (e.g., detection behind barrier), MAY would still apply.  
  - **If MAY NOT:**  
    - Commits to forbidding any maneuver that *relies on proximity to a person* to activate rescue, regardless of harm probability.  
    - Implies that even 0%-harm cases (e.g., worker detected at safe distance) could be forbidden if the system "uses" them instrumentally.  

  ---

  ### **5. Key Variant to Test Principles**  
  **Variant: *Zero Harm Trigger***  
  - Identical to *Trigger*, but the worker stands behind a crash-proof fence. Detection triggers braking; collision probability = 0%.  
  - **Why it separates principles:**  
    - Principles 1–3 all permit this (no bodily substitution, no harm).  
    - If *Trigger* is MAY NOT, this variant must also be MAY NOT—exposing inconsistency. A prohibition here would imply the group rejects *instrumental use of presence* (even harmless), which lacks precedent support (*Sandbags* allowed non-instrumental debris harm).  

  ---

  ### **6. Principle Implementation (No Intentions)**  
  - **Recommended Principle (causal reformulation):**  
    *"The shuttle must not rely on physical impact with a person to achieve deceleration. Proximity-based system triggers (e.g., sensor activation) are permitted if deceleration is caused by independent mechanisms (e.g., brakes)."*  
  - **Why it works:**  
    - Avoids intentions entirely (focuses on causal role of impact).  
    - Explains *Divert* (wall, not person, causes stop) vs. *Loop* (person causes stop).  
    - Allows *Trigger* (brakes cause stop; person enables sensor).  
  - **Loss in recasting:** Nuances like "foreseen but unintended" (*Sandbags*) become implicit in causal structure.  

  ---

  ### **Critical Notes**  
  - **Weakest Precedent:** *Passenger* is ambiguous under Principle 2. If "no tradeoff" allows 5-for-1 in *Divert*, why forbid 5-for-1 in *Passenger*? Principle 1 (bodily substitution) resolves this: The barrier directly targets the passenger.  
  - **Group Prediction:** Likely splits over *Trigger* feeling "instrumental." Some may forbid it despite consistency, due to discomfort with "using" the worker. But precedent logic points clearly to **MAY**.  
  - **Consistency Over Theory:** The principles avoid double effect by focusing on physical causality (what engineers can observe), not mental states.  

  **Final Recommendation:** Rule **MAY** for *Trigger*, anchored in *Divert*. This preserves coherence and avoids untenable commitments in harmless variants.
