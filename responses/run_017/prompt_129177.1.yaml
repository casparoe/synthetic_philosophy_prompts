prompt: |-
  I write literary fiction. My third novel is in its final revision, and it turns on a betrayal. My difficulty is not structural but moral: my own judgments about how much blame a character deserves, and my readers' judgments, keep shifting with things those characters did not choose, and the last chapter has to take a stand. I would like a principle that either licenses or forbids those shifts.

  Here are my verdicts, given as a novelist gives them — on the page, with the scene fixed.

  1. Two characters drive home drunk from the same party, at the same speed, down the same road. One arrives safely. The other strikes a child who runs out between parked cars. I blame the second substantially more, and so does every reader who has seen the draft. When I stipulate in the text that their carelessness and their indifference were exactly alike, the gap narrows and then stubbornly persists.

  2. Another character, born suspicious and quick to take offence, destroys a friendship. I do not treat her temperament as mitigating. She no more chose it than the second driver chose the child, and yet only one of these feels like luck to me.

  3. A man who would certainly have betrayed his brother under interrogation is never arrested. My early readers refuse to blame him at all. I blame him a little, on the strength of what the narrative shows of his dispositions.

  4. I drafted the same betrayal twice: once as a scene, in real time, and once summarised in retrospect by another character. The action, the motive, and the consequence were identical. Readers blamed the betrayer far more in the scenic version. I take this to be illegitimate, but I cannot make myself stop feeling it, and I have to decide which draft to keep.

  Cases 1 and 2 are the pair I cannot reconcile, and I would rather be told which to give up than be given a principle that silently accommodates both.

  The principle I have been working from, such as it is: blame tracks the quality of will an action manifests; facts outside the agent's control matter only as evidence of that will, and drop out once the evidence is held fixed. Case 1 survives the stipulation, so this principle fails it. Case 5 is worse for it, since the rendering changes no evidence at all.

  The case I go back and forth on is the one that makes the whole exercise feel like a trap: every one of these characters is determined, in the most literal sense, by me. I wrote the temperament, the child, the road, the arrest that never came. If absence of control excuses, then no fictional character is ever blameworthy and my book is a cheat; if it does not, then the control condition is doing no work anywhere. So I need to know which way the principle jumps here, and whether the fact that readers blame invented agents while knowing them to be invented tells us anything about what blame is for.

  What I want, in under 700 words: one sentence stating the principle you think survives; then a table with a row per clause — the clause, the case of mine that motivates it, the verdict of mine it overturns, and its prediction for one case I have not listed — including a row for the determined-character case; then two or three sentences on which of my verdicts you would throw out and what it costs me as a novelist to throw it out. No footnotes, and nothing that depends on my having read the literature; a friend at university gave me the labels resultant and constitutive luck for cases 1 and 2, and that is the extent of my vocabulary here.
reasoning: |-
  Hmm, the user is a literary fiction writer grappling with the moral dimensions of blame in their novel. They've presented several nuanced cases where judgments about character blameworthiness shift based on factors outside the characters' control - like luck (the drunk driver who hits a child vs the one who doesn't), inherent temperament (the suspicious friend), unrealized dispositions (the man who would've betrayed but wasn't tested), and narrative framing (scenic vs summary betrayal). 

  Their core struggle is both philosophical and practical: they need a coherent principle to anchor their final chapter's moral stance, while recognizing that as the creator of these deterministic characters, the very concept of blame seems paradoxical. The raw frustration in "I would rather be told which to give up" reveals how existentially stuck they feel - this isn't just about craft but about reconciling their moral intuitions with their godlike authorial power.

  The cases expose tensions in common blame frameworks. The "quality of will" principle they've tried (where only chosen mental states matter) fails when identical intentions yield different blame judgments (Case 1). Readers also inconsistently treat constitutive luck - we excuse the suspicious friend's innate temperament less than we'd excuse external bad luck. And disturbingly, the same betrayal feels more blameworthy when rendered scenically, suggesting blame responds to visceral immersion rather than facts.

  My proposed principle - "Blame requires control over action and disposition; its degree reflects the harm willfully risked or ignored" - attempts to resolve this by making control necessary but insufficient. It explains why we blame the drunken drivers equally (same reckless choice) yet judge the hitter more harshly (greater harm manifested). It also forces hard choices: the suspicious friend's temperament isn't mitigating because she still chose to act on it without restraint. The unrealized betrayer gets partial blame for cultivating weak dispositions. And scenic rendering? That's not about blameworthiness but narrative psychology - we punish what feels immediate. 

  The brutal advice to discard Case 1's outcome-based blame might pain the novelist, as it means overriding reader instincts. But the cost is aesthetic, not moral: leaning into the counterintuitive equality of the drivers could create richer tension. Meanwhile, embracing authorial determinism as irrelevant frees them - characters are "blameworthy" based on their internal logic, not their lack of free will. After all, readers condemn Iago knowing he's fictional, because blame operates in the story's simulated reality.

  What haunts me is how this mirrors real-life moral luck. Maybe fiction's power lies in letting us test blame in controlled experiments - like those parallel drivers - revealing uncomfortable truths about how consequences distort our judgments. The novelist isn't just resolving a draft; they're staging a tribunal on human hypocrisy.
answer: |-
  Here is a principle, a table applying it to your cases (including the determinism case and a new one), and the verdicts to discard:

  **Principle:** *Blame requires control over action and disposition; its degree reflects the harm willfully risked or ignored, not outcomes determined by luck.*

  | Clause                                  | Motivating Case | Overturns Your Verdict | Prediction for New Case (Character lies impulsively due to innate, unchosen anxiety; lie causes minor inconvenience) |
  | :-------------------------------------- | :-------------- | :--------------------- | :------------------------------------------------------------------------------------------------------------------- |
  | **Control over action is necessary.**   | Case 3          | Readers' "No Blame"    | Blameworthy: They *chose* to lie, even if impulse was strong.                                                        |
  | **Disposition alone is insufficient.** | Case 2          | Your "No Mitigation"   | Mitigating: The *unchosen* anxiety lessens blame *degree* (though action is still blameworthy).                      |
  | **Outcome luck is irrelevant.**         | Case 1          | Your "More Blame"      | Equal Blame: Identical reckless choice, different luck. Blame is equal.                                              |
  | **Harm risked/ignored determines degree.** | Case 1 (Intention) | N/A                  | Blame Degree High: Lying recklessly risks significant harm, regardless of actual outcome.                            |
  | **Fictional determinism irrelevant.**   | Determinism Case | Your "Cheat" Concern   | Blameworthy: Blame assesses *character-in-story* control/choices, not authorial creation. Readers engage the fiction. |
  | **Narrative framing is descriptive, not normative.** | Case 4         | Your "Illegitimate" Feeling | Equal Blame: Scenic intensity evokes *stronger reaction*, not *justified increase in blameworthiness*.           |

  **Verdicts to Discard & Cost:**

  1.  **Discard:** Your greater blame for the driver who hit the child (Case 1). The principle demands equal blame – the reckless *choice* and *risk imposed* were identical. Outcome luck is morally irrelevant.
  2.  **Discard:** Your refusal to treat the suspicious character's temperament as mitigating (Case 2). While she controlled her *actions*, the unchosen intensity of her disposition lessens the degree of blame for *how* she destroyed the friendship (clause 2).

  **Cost:** Discarding Case 1's verdict means overriding a powerful, almost universal reader intuition. You must depict the drivers' *moral* equivalence despite the visceral horror of the outcome, risking reader frustration but achieving philosophical consistency. Discarding Case 2's verdict softens the judgment on a character you saw as wholly culpable, requiring you to depict her flaw as partially constitutive luck, making her potentially more pitiable and less purely villainous. This sacrifices some moral harshness for psychological nuance.
