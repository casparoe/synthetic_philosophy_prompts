answer: |-
  ### Custom Goodhart's Law Scenario: School District Testing  
  **Setting**: A large urban school district uses the *average student test score* to measure educational quality. The real goal is **college readiness** (students mastering advanced material).  

  **Scenario**:  
  In Year 1, the district has two high schools:  
  - **Magnet School (20% of students)**: Selective, focuses on high achievers. Average test score: **90**. College readiness rate: **100%** (all students score ≥75, the threshold for college readiness).  
  - **Comprehensive School (80% of students)**: Serves all students, including those with learning challenges. Average test score: **50**. College readiness rate: **20%**.  
  *District average test score*: `(0.2 × 90) + (0.8 × 50) = 58`.  
  *Overall college readiness*: `20% (magnet) + 16% (comprehensive: 20% of 80%) = 36%`.  

  In Year 2, due to budget constraints, the district closes a magnet school satellite campus. Magnet enrollment drops to **10%** (only the very top students), and comprehensive enrollment rises to **90%**. Teachers work hard:  
  - Magnet School (now hyper-selective): Average score rises to **95**. College readiness: **100%**.  
  - Comprehensive School (absorbs displaced mid-tier magnet students): Average score rises slightly to **54** (due to extra tutoring), but teaching resources are spread thinner across a wider ability range. College readiness drops to **15%** of its students (now including struggling students who lost magnet access).  
  *District average test score*: `(0.1 × 95) + (0.9 × 54) = 58.1` (**↑ from 58**).  
  *Overall college readiness*: `10% (magnet) + 13.5% (comprehensive: 15% of 90%) = 23.5%` (**↓ from 36%**).  

  **Result**:  
  The average test score **increases** (58 → 58.1), but college readiness **plummets** (36% → 23.5%). No one "gamed" the system—teachers improved scores honestly. The decoupling arises from **statistical aggregation** and **shifting student demographics**, not incentives.  

  ---

  ### Why This Isn't Standard Goodhart's Law  
  - **Flavor**: This is **statistical Goodhart** (specifically, a **compositional fallacy**). The measure fails because:  
    1. **Non-linearity**: College readiness is a *threshold effect* (scores ≥75), but the average treats all score changes equally (e.g., raising a 40→45 "counts" the same as 74→73, though the latter destroys readiness).  
    2. **Distribution shift**: Magnet shrinkage moves mid-tier students (previously scoring 75–90) to comprehensive schools, where their scores drop below 75 due to less rigorous peers/instruction. The average masks this because gains at the top (95 vs. 90) offset losses in the middle.  

  ---

  ### Why Obvious Fixes Fail  
  1. **Adding a second measure (e.g., "% above 75")**:  
     - **Problem**: This *would* work for college readiness but ignores *other goals* (e.g., helping low-scorers). If the district optimizes for "% above 75," teachers might ignore struggling students (creating new Goodhart risks!).  
     - **Defense by district leaders**: *"We need a balanced view—the average captures progress for all students, not just elites."*  

  2. **Reweighting the average (e.g., value-added modeling)**:  
     - **Problem**: Reweighting assumes test scores linearly predict readiness. Here, a **54→55 gain for a student scoring 40** doesn’t advance college readiness, but a **74→75 jump** does. No reweighting can capture this threshold effect without knowing the goal in advance.  
     - **Defense**: *"Reweighting is too complex—parents understand the average. We’ll supplement it with college placement data."*  

  ---

  ### What Would Make the Measure Trustworthy Again  
  - **Required change**: Align the measure with the *actual goal structure*. If college readiness is the priority, **use % above 75**. If "overall learning" is the goal, **track improvements by baseline ability tiers** (e.g., low/mid/high achievers).  
  - **Why the district won’t do this**:  
    - Political pressure for a "single number."  
    - Threshold data is harder to collect/explain than averages.  
    - Leaders might argue: *"The average is stable and comparable across years—we’ll monitor thresholds internally."*  

  **Key takeaway**: Goodhart’s law isn’t just about gaming—it’s about **mismatched statistics**. Here, the average fails because it ignores *where* changes occur in the distribution. Fixes require understanding the goal’s **non-linear structure**, not just adding metrics.
