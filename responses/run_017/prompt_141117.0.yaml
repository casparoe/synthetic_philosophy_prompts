prompt: |-
  My friend Dani has been doing refugee status determinations for something like six years, and over beers she's walked me through maybe ten of her cases with the names changed. I've been trying to reverse-engineer the rule she's actually running, and I've got a new case I want to run past her but I'd rather not embarrass myself.

  Her decisions so far:

  - Granted: a journalist who'd been jailed twice and then started getting death threats from the police after publishing a story about a governor's contracts.
  - Denied: a guy fleeing extortion by gangs in a country that isn't at war, where the cops are useless and on the take but aren't in on it and aren't picking on him in particular.
  - Granted: a woman whose husband broke her arm twice and who the police wouldn't help even after she had a protection order.
  - Granted: a conscript who deserted rather than take part in massacres of civilians. There's no alternative service in his country and desertion gets you years in prison.
  - Denied: a man who left rather than be drafted into an army that was defending the country against an invasion nobody thinks was provoked.
  - Denied: a farmer whose crops had failed four years running and whose kids were malnourished. The government is crooked and what relief there is goes to the region that votes the right way, which isn't his.
  - Granted: a gay man in a country where being gay is legal, beaten up twice, where the police just systematically don't investigate attacks on gay men.
  - Denied: a family from a region where the state has basically collapsed and the famine is half drought and half both armies torching fields. Nobody wants them dead in particular.
  - Denied: a man who could have moved to another province of his own country and been fine and just never did — what she calls the "internal flight alternative."
  - Granted: a family that came through a country where they'd have had papers and been physically safe but no right to work, no school for the kids, no family and no language. She said we still owe them.

  Two things she says a lot: "asylum isn't a welfare program" and "I don't get to pick who shows up." Those pull in different directions and she seems not to notice.

  The new case: Rupa is fifty-seven, a widow, with a spinal injury from a fall; she can do maybe ten steps with a frame. Her country has no disability benefit, no welfare system, no anti-discrimination law — but also no law against her, and no official has ever done anything to her. Her brother controls her dead husband's pension and keeps her in one room; the neighbors think this is normal; nobody is threatening her and nobody is stopping her. If she stays she spends the rest of her life in that room. A church group in Columbus raised money, flew her over on a medical visa, and she claimed asylum two weeks after she got here. Her own government didn't try to stop her leaving and doesn't want her back. There are probably a few million people in her country in roughly her position.

  So: grant or deny? Give me the two or three rules that fit all ten of her earlier verdicts and that come apart on Rupa, tell me which one you think she's actually running and why, and tell me whether number six and number ten look wierd sitting next to each other or whether I'm missing the difference between them. Then give me the one case I should ask her about next that would separate the candidates cleanly. And if she grants, does her own track record give her any way to stop at Rupa, or does she owe a hearing to a few million people — and does it matter that the church flew her in, or did the church just volunteer as the one who has to take her?
reasoning: |-
  Hmm, the user wants me to reverse-engineer their friend Dani's asylum decision-making rules based on ten case examples. They've provided detailed scenarios where Dani either granted or denied asylum, along with some of Dani's common sayings. Now they have a new case about Rupa, a disabled widow, and want me to predict Dani's ruling while analyzing the underlying patterns.

  Looking at the ten cases, I need to identify consistent rules that explain all decisions. The granted cases share key elements: specific targeting or systematic abandonment by authorities. For example, the journalist was directly threatened by police, the abused woman was ignored by police despite a protection order, the deserter faced prison for refusing atrocities, the gay man experienced systematic police neglect, and the family had no viable alternative in the transit country.

  The denied cases lack these elements. The extortion victim faced generalized crime, the draftee was in a legitimate defense force, the farmer suffered from corruption but not targeting, the famine victims faced generalized conflict, and the internal flight case had relocation options. Dani's phrases "asylum isn't a welfare program" rejects economic migrants, while "I don't get to pick who shows up" acknowledges her duty to assess each case.

  For the new case about Rupa, a disabled widow neglected by her brother but not targeted by authorities, she seems to fall under "generalized hardship" - similar to denied cases 6 and 8. Her situation, while tragic, lacks state involvement or systematic persecution. Case 10 was granted because the transit country offered physical safety but not basic rights, creating a "constructive refoulement" scenario that doesn't apply to Rupa's home country.

  Cases 6 and 10 differ significantly: 6 involves domestic economic hardship (denied), while 10 involves international protection gaps (granted under complementary protection). Rupa's case aligns more with 6. To clarify Dani's rules, I should suggest a hypothetical about state-sanctioned discrimination vs. generalized neglect. If Dani grants Rupa, her rules might unravel toward accepting all poverty cases, contradicting her own "not a welfare program" principle. The church's involvement doesn't change the asylum merits, though it may raise questions about medical visa use.
answer: |-
  Based on Dani's ten cases and her stated principles, here's the breakdown for Rupa and the underlying rules:

  **Prediction for Rupa:** **DENIED**

  **The 2-3 Rules Explaining All Ten Cases & Rupa:**

  1.  **State Nexus or Failure of State Protection:** Persecution (or risk) must come *from the state* OR the state must be *unwilling or unable* to protect against persecution by non-state actors *specifically targeting the applicant or a group they belong to*. Generalized societal problems, crime, or state incompetence/neglect *without specific targeting* don't qualify.
      *   *Fits Granted Cases:* Journalist (state threats), Abused Woman (state unwilling to protect), Deserter (state punishment for refusing persecution), Gay Man (state systematic failure to protect group), Transit Country Family (state failure to provide basic rights/safety net creating refoulement risk).
      *   *Fits Denied Cases:* Extortion (state incompetent/corrupt but no targeting), Draft (state legitimate action, no targeting), Farmer (state corruption/cronyism = neglect, not targeting), Collapsed Region (generalized conflict/famine, no targeting), Internal Flight (state functional elsewhere).
      *   *Rupa:* No state persecution. State neglect (no welfare/laws) is *generalized*, not targeted at her or a group. Brother is a private actor; state isn't involved in his actions nor specifically refusing *her* protection she requested. Denied.

  2.  **Particularized Risk or Membership in a Particular Social Group (PSG):** The applicant must face a risk *specific to them* based on individual circumstances (e.g., journalist who exposed governor) OR belong to a "particular social group" (PSG) recognized as persecuted (e.g., abused women failed by state, gay men failed by state). Generalized risks affecting large populations (famine, gang crime, poverty) don't qualify.
      *   *Fits Granted Cases:* Journalist (individual targeting), Abused Woman (PSG: women failed by state), Deserter (individual conscience/refusal + group), Gay Man (PSG), Transit Country (Family unit facing specific protection gap).
      *   *Fits Denied Cases:* Extortion (general crime risk), Draft (general conscription), Farmer (general economic hardship/corruption), Collapsed Region (generalized conflict/famine), Internal Flight (general risk avoidable).
      *   *Rupa:* Faces *generalized* hardship due to disability and lack of social safety net. Not targeted individually. "Disabled widows without family support" *might* be argued as a PSG, but Dani's pattern denies cases where the hardship stems from poverty/collapse without *state action/inaction targeting that group*. Denied.

  3.  **No Viable Internal Flight Alternative (IFA) or Safe Third Country:** Protection must be unavailable *anywhere* in the home country OR transit through a safe third country must be genuinely viable (offering physical safety *and* basic rights/durable solution).
      *   *Fits Granted Cases:* Journalist (state-wide threat), Abused Woman (state-wide failure), Deserter (state-wide conscription/punishment), Gay Man (state-wide failure), Transit Country (3rd country not safe/viable long-term).
      *   *Fits Denied Cases:* Internal Flight (explicit IFA), Collapsed Region (implies IFA possible if state functional elsewhere?), Extortion/Draft/Farmer (IFA theoretically possible, though may not be practical/mentioned).
      *   *Rupa:* While her specific situation with her brother might be local, the *cause* (lack of state support for disability) is nationwide. No evidence she sought help elsewhere in country or that it would exist. However, rules 1 & 2 are stronger drivers. The *lack* of an IFA isn't enough without satisfying 1 & 2 first. Denied.

  **Which Rule is Dani Actually Running?**
  Dani is **primarily running Rule 1: State Nexus or Failure of State Protection (with a focus on *targeting*)**. This rule cleanly explains every decision:
  *   **Granted:** State actor persecutes (Journalist, Deserter) OR State *specifically* fails to protect a targeted individual/group (Abused Woman, Gay Man, Transit Country Family - where the state's failure creates the refoulement risk).
  *   **Denied:** No state actor involved *and* state failure is *generalized* incompetence/neglect/corruption/collapse, not specific protection failure (Extortion, Draft, Farmer, Collapsed Region, Internal Flight).
  Rule 2 (Particularization/PSG) is a necessary component *within* Rule 1 for defining the victim group. Rule 3 (IFA/Safe Third) is a secondary check applied *after* Rule 1 is satisfied.

  **Cases 6 (Farmer Denied) & 10 (Transit Country Family Granted):**
  They **do not look weird together** under Dani's Rule 1. The key difference is **state action/inaction and the nature of the protection gap**:
  *   **Case 6 (Farmer - Denied):** Hardship stems from natural disaster exacerbated by *generalized* state corruption/cronyism in welfare distribution. The state isn't *targeting* the farmer or his group (poor farmers in the wrong region); it's neglecting everyone not in the favored region *equally* through a flawed system. It's *maldistribution due to corruption*, not *persecution or specific denial of protection*.
  *   **Case 10 (Transit Country - Granted):** The *state* in the transit country created a specific protection gap. While physically safe, the state *systematically denied* them fundamental rights (work, education) essential for a durable solution, effectively making their stay unsustainable and forcing them into a situation akin to refoulement. The state's *inaction* (failing to provide basic integration rights) *specifically targeted* asylum seekers/refugees as a group, creating a risk by denying them the means to survive long-term. The state wasn't just incompetent; its *policy* (or lack thereof) actively created the dangerous situation *for that specific group*.

  **The Case to Ask Dani Next (To Separate Candidates):**
  "**A member of an ethnic minority living in a region controlled by a brutal rebel group. The rebels systematically extort, assault, and sometimes kill members of this minority. The *national* government condemns the rebels but has effectively lost control of that region for years and cannot provide security there. The applicant was extorted and beaten. The government hasn't abandoned *only* this group; they've lost control of the region to *everyone*, and multiple groups suffer equally under the rebels."**

  *   **Why this case?** It directly targets the core of Rule 1 (State Nexus/Failure) vs. a broader reading of Rule 2 (PSG + Generalized Harm).
      *   If Dani **Grants:** She emphasizes the *PSG* (ethnic minority) facing persecution from a non-state actor *and* the state's *complete inability* to protect *anyone* in that region (a *de facto* failure of state protection for that group within the zone of collapse), even if not targeted abandonment. This leans towards a broader "protection needs" focus inherent in the PSG concept.
      *   If Dani **Denies:** She strictly requires the state's failure to be *targeted* at the PSG (e.g., the state *could* protect others but refuses to protect *this* group). Here, the state's failure is *generalized* (total collapse in the region affecting all groups equally), even though the *persecutor* targets a specific group. This strictly adheres to Rule 1 as interpreted from her past denials (Collapsed Region #8, Extortion #2). This outcome is more consistent with her existing pattern.

  **If She Grants Rupa: The Consequences**
  *   **Track Record & Slippery Slope:** Granting Rupa *would* fundamentally break Dani's established pattern based on Rules 1 & 2. Rupa lacks the *state nexus/targeted failure* present in all granted cases. Granting her based on *generalized societal neglect and poverty* directly contradicts the denial of the Farmer (#6) and Collapsed Region (#8) cases, which also involved state failure contributing to hardship. It would open the door to claims based purely on poverty/lack of social safety nets in poor countries ("asylum as welfare"), which Dani explicitly rejects. Her track record gives her *no* principled way to stop at Rupa without inconsistency; she *would* logically owe hearings to millions in similar situations.
  *   **The Church's Role:** The church flying her in is **legally irrelevant** to the asylum claim itself. Asylum is assessed based on fear of persecution in the *home country*, not how one arrives. The church didn't "volunteer to take her" in the sense of assuming legal responsibility for her protection claim. Their actions might raise questions about *medical visa use* or *forum shopping*, but they don't change the legal merits of Rupa's asylum claim under the Refugee Convention or Dani's established rules. Dani must assess the claim based on the situation in Rupa's home country.

  **Conclusion:** Based on Dani's consistent application of the requirement for *state involvement or targeted state failure to protect*, Rupa's case lacks the necessary elements for asylum. Her situation, while tragic, results from generalized societal conditions and private family dynamics, not persecution or a specific failure of state protection targeting her or her group. Granting her would be a significant departure from Dani's established jurisprudence and create a major inconsistency, particularly with the denied Farmer (#6) and Collapsed Region (#8) cases. The church's involvement doesn't alter the legal assessment. The case of the ethnic minority facing rebels in a collapsed region would be the most revealing next case to understand the boundaries of Dani's "state failure" requirement.
