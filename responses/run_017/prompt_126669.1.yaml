answer: |-
  Below is a decision tree for triaging thought experiments, generated from five ordered probes. The probes are applied cheapest-to-run first (requiring minimal cognitive effort or prior analysis). Each probe is a general question answerable without knowing the tree's purpose. The tree has five decision nodes (one per probe) and eight leaves, each with a named failure mode (or viability), a disposition recommendation, a brief rationale, and a familiar illustrative case. Probes are designed to uncover failure modes inductively, not from predefined lists.

  ### Decision Tree for Thought Experiment Triage
  **Instructions:** Start with Probe 1. Follow the branches based on answers. Stop at a leaf when reached. Dispositions: **Repair** = rewrite to isolate the target; **Replace** = retain as illustration but not as evidence; **Retire** = drop entirely; **Keep** = no change needed.

  ---

  #### **Probe 1: Flip Test**  
  *Invert morally/theoretically salient surface features (e.g., names, imagery, order) while holding the underlying structure fixed. Does the intuitive verdict (e.g., "wrong," "justified") change to track the inverted surface?*  
  - **Yes (verdict changes with surface)**: → Leaf 1: **Surface Contamination**  
    *Repair*: The verdict is biased by irrelevant surface details; rewrite to neutralize them (e.g., anonymize roles).  
    *Example*: In a trolley case, flipping the victim from "villain" to "hero" changes judgments. Repair by describing victims generically.  
    *Confidence*: High (common bias).  
  - **No (verdict stable)**: → Proceed to Probe 2.  
  - **Cannot flip (surface and structure inseparable)**: → Leaf 2: **Structural Fusion**  
    *Repair*: The case conflates surface and structure; rewrite to decouple them (e.g., clarify variables).  
    *Example*: A case where "doctor" and "treatment" cannot be flipped independently. Repair by separating role from action.  
    *Confidence*: Medium (may require creative rewriting).

  #### **Probe 2: Fill-In Test**  
  *Supply omitted causally/normatively relevant details (e.g., motives, consequences, context). Does the verdict survive this addition?*  
  - **No (verdict changes)**: → Leaf 3: **Omission Sensitivity**  
    *Repair*: The verdict depends on hidden assumptions; rewrite to include critical details.  
    *Example*: A "lying is wrong" case omitting that the lie saved a life. Filling this in reverses the verdict. Repair by specifying context.  
    *Confidence*: High (common oversight).  
  - **Yes (verdict stable)**: → Proceed to Probe 3.  
  - **Cannot supply detail (ambiguous/underdefined)**: → Leaf 4: **Irremediable Vagueness**  
    *Replace*: The case is too underspecified to fix; use as a vivid heuristic but not evidence.  
    *Example*: A "fair distribution" case lacking specifics (what, whom, criteria). Filling in details feels arbitrary. Replace as an intuition-pump.  
    *Confidence*: Medium (may be context-dependent).

  #### **Probe 3: Repetition Test**  
  *Run the case repeatedly or embed it in a sequence approaching a normal scenario. Is the verdict stable across iterations?*  
  - **No (verdict weakens/reverses)**: → Leaf 5: **Iterative Instability**  
    *Replace*: The verdict relies on singularity or extremeness; use as an edge-case illustration but not general evidence.  
    *Example*: A "kill one to save five" emergency. Repeated, it becomes a "survival lottery" policy, which feels abhorrent. Replace to highlight the emergency's uniqueness.  
    *Confidence*: High (robust for extreme cases).  
  - **Yes (verdict stable)**: → Proceed to Probe 4.

  #### **Probe 4: Stipulation Audit**  
  *List explicit suppositions (e.g., "assume X is true"). Which one is load-bearing? Does it merely assert the conclusion?*  
  - **Key stipulation begs the question**: → Leaf 6: **Circular Setup**  
    *Retire*: The case assumes what it aims to prove; no revision can salvage it.  
    *Example*: "Assume stealing is wrong. Is stealing wrong here?" Retire—it offers no new insight.  
    *Confidence*: High (uncontroversial failure).  
  - **No circularity**: → Proceed to Probe 5.

  #### **Probe 5: Possibility Test**  
  *What must be false/incoherent/unimaginable for the scenario to work? Does the verdict depend on this element?*  
  - **Yes (verdict depends on impossibility)**: → Leaf 7: **Impossibility Reliance**  
    *Retire*: The verdict hinges on incoherence; nothing in the neighborhood can do the work.  
    *Example*: A case requiring backwards time travel to punish a crime before it happens. Verdict depends on causal incoherence. Retire—no repair possible.  
    *Confidence*: Medium (specialists may dispute value of impossible cases—see note).  
  - **No (verdict independent)**: → Leaf 8: **Viable**  
    *Keep*: The case isolates the target without major flaws; no triage needed.  
    *Example*: A standard trolley problem passing all probes (e.g., well-structured swap variant).  
    *Confidence*: High.

  ---

  ### Notes on Tree Structure
  - **Nodes and Leaves**: 5 nodes (one per probe), 8 leaves (within target range).  
  - **Unseparated Leaves**: None—probes distinguish all leaves.  
  - **Unfilled Combinations**: One combination is permitted but unfilled:  
    - *Path*: Flip Test (no) → Fill-In Test (yes) → Repetition Test (yes) → Stipulation Audit (no) → Possibility Test (yes → Leaf 7).  
    - *Gap Reason*: Neglect (no common cases fit this path; cases failing only the last probe are rare).  
  - **Specialist Disagreement**: The **Possibility Test → Impossibility Reliance → Retire** branch (Leaf 7) is contentious. Specialists in metaphysics or logic may argue that impossible cases (e.g., involving time travel) can test conceptual boundaries, warranting *Replace* over *Retire*. Rationale: They may view "incoherence" as a feature, not a bug, for exploring modal claims.  
  - **Confidence Summary**:  
    - High: Leaves 1, 3, 5, 6, 8 (well-trodden failures).  
    - Medium: Leaves 2, 4, 7 (contextual or debated).  

  This tree prioritizes efficiency, running the quickest probes first (e.g., Flip Test is visual/instant; Possibility Test is abstract/slow). It covers common failure modes while allowing novel discoveries via the probes.
