          If *Anthem* was only the clay, then the ceramics studio's actions were within normal practice and the mugs are a valid repurposing. The replica, being an exact copy of the form, could then be considered as fulfilling the display promise. However, this view reduces the artwork to its material and form, ignoring the artist's hand and the historical context (the award and the committee's decision) that attached to the specific object.

