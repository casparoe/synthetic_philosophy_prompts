  First, I need to establish the necessary groundwork. The first ten minutes are crucial. I should avoid triggering "relativism" alarms. Starting with non-moral examples like etiquette could help. Using "tacky" as a term shows how expressions work without truth values. Then transition to moral terms like "wrong," ensuring students see the parallel. 

  The carrying case needs a scenario where a moral sentence is used without endorsement. Maybe a lawyer in court arguing something is wrong, even if they don't believe it. The case must be harmless to prevent ethical debates, like stealing a library book. 

  Common misconceptions: denying modus ponens, reverting to truth conditions, cultural relativism. I should preempt these by showing expressivists can accept modus ponens with different semantics. The lawyer example helps here. Cultural relativism can be addressed by distinguishing disagreement types. 

  The "probably wrong" wrinkle is tricky. It highlights propositional attitudes. I could use it as a mid-session pivot after conditionals, showing confidence in moral claims challenges expressivism. 

  End with a question testing understanding, like how expressivists handle "If lying is wrong, then teaching lying is wrong." Avoid diving into technical solutions like Blackburn’s projectivism. 

  Need to ensure the flow: start with expressivism basics, present the lawyer case, embed in conditionals, introduce "probably," address misconceptions, and end with a probing question. Keep it interactive to maintain engagement.
answer: |-
  Here’s a battle-tested plan to make the Frege-Geach problem *land* in 45 minutes, designed for your audience. The key is building the expressivist intuition first, then making embeddings feel jarring.

  **Core Strategy:**  
  Use a **"lawyer in court"** scenario to create a non-endorsing context. Avoid triggering relativism alarms by anchoring expressivism in *shared human psychology*, not culture.

  ---

  ### **Phase 1: First 10 Minutes – Laying Expressivist Foundations (Without Saying The Word)**
    **Goal:** Make them feel that moral claims *do* something other than stating facts.  
    **Carrying Case Setup:**  
    - Start with **etiquette**: "Tacky."  
      - "Raise your hand if you think wearing socks with sandals is *tacky*. Why?"  
      - *Draw out:* They’re expressing a negative attitude (disapproval, disdain), not just describing sandal-sock combos.  
    - Transition to **harmless moral example**: "It’s wrong to return a library book 1 day late."  
      - "Who disagrees? Why?" Focus on *what they’re doing* when they say it’s wrong: condemning, discouraging.  
      - **Crucial Move:** "If I say ‘returning the book late is wrong’, am I *just* describing the action? Or am I *doing* something *to* the action?"  
    - **Label It (Carefully):**  
      > "When you say ‘X is wrong’, you’re *expressing your disapproval of X*. You’re not *just* describing X; you’re *prescribing* how others should feel about it. Call this **attitude-expression**."  
      *(Avoid "expressivism" until later – it sounds like an "ism" they’ll pigeonhole.)*

    **Why this works:**  
    - Econ/CS students get "signaling" and "coordination." Frame attitude-expression as a social tool.  
    - The library example is low-stakes (prevents derailment), universally relatable, and clearly not "true/false" in a vacuum.

  ---

  ### **Phase 2: The Frege-Geach Eruption (15 Minutes)**  
    **The Carrying Case: The Lawyer’s Argument**  
    > "Imagine a defense lawyer in court arguing her client *didn’t* steal the library book. She says:  
    > *‘My client is innocent. But* ***if she did steal the book, it would be wrong***. *However, the evidence shows...’*  
    > She doesn’t believe her client stole it. **Is she expressing disapproval of stealing the book?**"

    **Key Features of this Case:**  
    - ✅ **Non-endorsing context:** Lawyer isn’t condemning anything; she’s making a logical argument.  
    - ✅ **Embeds "wrong" in a conditional ("If P, then wrong")** – the core Frege-Geach challenge.  
    - ✅ **Harmless:** Stealing a library book is uncontroversially wrong (no ethical debate).  
    - ❌ **Avoids chains ("If stealing is wrong...")** – too abstract; students nod without feeling friction.  

    **Process:**  
    1. Poll the room: *"Is the lawyer expressing her disapproval of stealing here?"* (Most will say no).  
    2. Press: *"But she used the word ‘wrong’! If ‘wrong’* just *means ‘I disapprove’, how can she use it sincerely without disapproving?"*  
    3. **Let the tension simmer.** Don’t resolve it yet. Highlight the disconnect:  
       > "When ‘wrong’ stands alone (‘Stealing is wrong’), it *feels* like expressing an attitude. But here, embedded in an ‘if’-clause, it feels... different. Like it’s just part of the logical machinery. But what *is* it doing?"

  ---

  ### **Phase 3: Deepening the Problem & Handling Misconceptions (15 Minutes)**  
    **a) Probabilistic Wrinkle (SHARPEN the Embedding Problem):**  
    *"Someone says: ‘I’m 30% sure that stealing the library book is wrong.’*  
    - *If ‘wrong’ just expresses disapproval, what does ‘30% sure’ modify? Can you be 30% disapproving?"*  
    - **Impact:** This makes the "propositional shape" issue visceral. Confidence needs an object to be confident *about*. Attitude-expression struggles here.  

    **b) Misconception Takedowns:**  
    - **"So expressivists deny modus ponens?"**  
      *"No! Expressivists* want *to save logic (like modus ponens). The problem is explaining* how *moral words contribute to logic if they’re not describing facts. The lawyer’s argument relies on modus ponens! Can expressivism explain that?"*  
    - **"Just give moral sentences truth conditions!"**  
      *"That’s one solution (moral realism)! But remember Phase 1: when you* personally *said ‘stealing is wrong’, did it feel like stating a fact like ‘the book has 200 pages’? Or doing something else? Realism might fix logic, but does it match our experience?"*  
    - **"Isn’t this just cultural relativism?"** (Let this one surface!)  
      *"Great point! But notice: the lawyer case isn’t about disagreement. It’s about* one person *using ‘wrong’ in a way that doesn’t express their attitude. Relativism says truth depends on culture; this is about the* function *of the word in a sentence."*  

  ---

  ### **Phase 4: Consolidation & The Closing Question (5 Minutes)**  
    **The Reveal:**  
    > "This is the **Frege-Geach Problem**: How can moral words work identically in simple claims (‘X is wrong’) and embedded contexts (ifs, probably, nots, etc.) if their core job is expressing attitudes? *Can expressivism make sense of moral logic?*"  

    **The Test Question:**  
    > *"How would an expressivist explain what ‘wrong’ means in this sentence:*  
    > **‘Lying isn’t wrong if it saves a life.’**  
    > *How is this different from just saying ‘I don’t disapprove of life-saving lies’?"*  

    **Why this works:**  
    - Tests if they see that embedded "wrong" must contribute to the *logical structure* ("If P, then not Q"), not just express a raw attitude.  
    - A memorized slogan ("attitude expression") fails here; they need to grapple with compositionality.  

  ---

  ### **What to FLAT-OUT Avoid**  
  1.  **Technical solutions** (Blackburn’s quasi-realism, Gibbard’s norm-expressivism).  
  2.  **Deep dives into moral realism vs. anti-realism.** Label options ("realism fixes logic but may feel unnatural"), but don’t debate them.  
  3.  **Metaethics jargon overload** ("cognitivism", "non-cognitivism"). Use "attitude-expression" and "fact-stating".  
  4.  **First-order moral debates.** Shut down any "But is stealing *really* wrong?" with: "For today, assume we all agree library theft is wrong. We’re analyzing *how the word works*."  

  ---

  **Why this flows:**  
  You build the expressivist intuition with relatable, low-stakes examples where attitude-expression feels obvious. The lawyer case *forces* the embedding problem using a context where attitude-expression is clearly absent. Probabilities sharpen the knife. Misconceptions are pre-empted or reframed. Ending with a novel test question ensures they can’t just parrot definitions. The EA context helps – they’ll recognize the challenge of building rational ethics on expressivist foundations.  

  **Time Check:**  
  - 0-10min: Attitude-expression foundations (etiquette → library book).  
  - 10-25min: Lawyer case + embedding friction.  
  - 25-40min: Probability wrinkle + misconception busting.  
  - 40-45min: Consolidation + test question.  

  This leaves them *feeling* the problem: "How can moral language be both expressive *and* logical?" without needing the lecture.
