answer: |-
  Based on your precise and insightful description, you've identified a core phenomenon in philosophical aesthetics and cognitive narratology, though it lacks a single universally agreed-upon term. The established concepts closest to your cases are **"Imaginative Resistance"** (often focused on its failure, not its success like your first case) and **"Alief"** (which explains the mechanism), but these don't fully capture the *normative framing* aspect central to your examples. Your cases involve **emotionally adopting a narrative's normative perspective without endorsing its values**, facilitated by **framing**.

  Here's a breakdown addressing your questions:

  1.  **The Core Phenomenon & Its Name:**
      *   **Best Fit:** **Normative Affordance of Narrative Framing** (or **Affective Licensing by Framing**).
      *   **Mechanism:** Narrative framing (point of view, tone, music, pacing, focalization, rhetoric) creates a temporary **cognitive-affective schema** that structures your emotional response. This schema includes *what* to feel, *when* to feel it, and crucially, *the normative lens through which* events are evaluated *within the narrative world*. You cognitively know this lens isn't your own ("this revenge is wrong"), but affectively, the framing *affords* you the emotional responses aligned with *its* perspective.
      *   **Why it's not Suspension of Disbelief:** SoD concerns belief in *existence* or *possibility*. Your issue concerns adopting a *value-laden perspective* for affective engagement, while maintaining cognitive distance from those values. You suspend *evaluative judgment* for the sake of emotional immersion, not existential belief.
      *   **Why it's related to, but distinct from, Imaginative Resistance (IR):** IR typically refers to difficulty *imagining* or *accepting* morally deviant propositions *as true within a fiction* (e.g., "In this story, torturing puppies is good"). Your first case is the *opposite*: effortless affective adoption of the deviant perspective. Your second case shows IR is *overcome* by framing. IR focuses on the *cognitive* barrier to imagining deviance; your phenomenon focuses on the *affective* adoption of the framed perspective *despite* cognitive rejection.

  2.  **Your Cases: One Phenomenon?**
      *   **Case 1 (Revenge Film) & Case 2 (Same Event, Opposite Framing):** These are **manifestations of the same core phenomenon.** The narrative framing (POV, music, editing, tone) constructs a temporary normative perspective ("Revenge is justified/heroic" or "This outcome is triumphant/catastrophic"). Your emotional response ("wanting success," feeling triumph/catastrophe) is an *affective alignment* with this constructed perspective. Your cognitive awareness of your own opposing values ("revenge is wrong," "this outcome is neutral") remains intact but is temporarily sidelined for the affective experience. The framing *licenses* the emotion.
      *   **Case 3 (Failed Emotion):** This is **the *failure* of the same mechanism.** For the normative affordance/affective licensing to work, the narrative framing must successfully construct its perspective and elicit the intended alignment. Failure can occur due to:
          *   **Weak Framing:** The narrative doesn't adequately build the perspective (poor character development, inconsistent tone, jarring elements). The work hasn't "earned" the emotion. (Blame: Work)
          *   **Resistant Reader:** Your own values, experiences, or mood create an insurmountable barrier to adopting the perspective, despite technically competent framing. (Blame: Reader/Lack of receptivity)
          *   **Mismatch:** The framing technique doesn't resonate *with you* (e.g., sentimental music feels manipulative to you personally). (Blame: Interaction)
      The "normative structure" and "blame" arise precisely because the *expected* mechanism of affective alignment via framing has broken down. It's the phenomenon not occurring where it's intended.

  3.  **Object of the Wanting (Case 1):**
      It's **holistic: the character's goal *as framed*.** You don't want "revenge" abstractly or morally. You want *this character*, whom you've been made to identify with/sympathize with via framing (backstory, victimhood, charisma, cinematic focus), to achieve *this specific goal* (stopping the villain, retrieving the object) *within the narrative logic* established. The "wanting" is directed at the *success of the narratively constructed endeavor*, inseparable from the framing that makes it feel urgent and justified *in this context*.

  4.  **Endorsement vs. Mechanism:**
      **Endorsement is *not* required; it's a separate outcome.** The mechanism (affective alignment via framing) operates independently:
      *   The mechanism *allows* you to feel the emotion aligned with the narrative's values.
      *   **Endorsement** would be a *cognitive judgment* adopting those values as your own *outside* the narrative context. This *might* happen later (e.g., a story changing your mind), but it's not part of the immediate affective response during immersion. The mechanism enables the *feeling*; endorsement is a *belief* change potentially influenced by, but distinct from, the feeling.

  5.  **Extension Beyond Fiction:**
      **Absolutely, the mechanism extends broadly:**
      *   **Friend's Anecdote:** The "spin" (tone, emphasis, omission) frames the events normatively, inviting you to feel outrage, amusement, or sympathy *in the moment*, even if upon reflection you wouldn't defend that feeling as justified by the facts alone.
      *   **Advertisement:** Framing (music, imagery, voiceover, association) creates an affective response (desire, trust, fear of missing out) aligned with the ad's perspective ("This product brings happiness/success/safety"), regardless of your cognitive evaluation of the product's merits.
      *   **Ethics Hypothetical:** The stylized framing (extreme case, specific wording, presenter's tone) can elicit strong gut reactions (outrage, approval) that might differ from your considered ethical judgment. The framing *primes* a specific affective response.
      *   **Self-Produced Framings:** This is more complex but possible. When constructing a narrative *for yourself* (e.g., justifying a past action, anticipating a future event), you can frame it in a way that *temporarily* makes you feel better/worse/justified about it, even if you know, deep down, the framing is biased. This touches on self-deception and cognitive dissonance reduction, sharing the core mechanism of affect guided by perspective construction.

  6.  **Boundaries & Exclusions:**
      *   **Included:** Emotional responses directly elicited by narrative framing/technique where the emotion aligns with the *framed perspective*, even when cognitively rejected.
      *   **Excluded:**
          *   Responses based on **belief in the reality** of events (Suspension of Disbelief domain).
          *   **Aesthetic appreciation** without normative/affective alignment (e.g., admiring the craft of a villain's speech without feeling persuaded by it).
          *   Emotional responses **directly aligned with your own pre-existing values** (e.g., crying at a reunion scene because you deeply value family – here the framing resonates with, rather than temporarily imposes, your values).
          *   **Simple surprise** or suspense based purely on plot mechanics without a strong normative framing component.
          *   **Cognitive judgments** *about* the narrative's values (e.g., "This film glorifies violence"), even if they cause emotion (e.g., anger). The phenomenon is about emotion *from within the frame*.
          *   Cases of **full persuasion/endorsement** where the narrative *changes* your underlying values.

  **Proposed Coined Term & Definition:**

  *   **Term:** **Affective Framing Adoption (AFA)**
  *   **Definition:** The psychological phenomenon whereby an audience member temporarily adopts the normative and evaluative perspective embedded within a narrative's framing (including point of view, tone, style, rhetoric, and presentational techniques), resulting in emotional responses congruent with that adopted perspective, *without* necessarily endorsing the associated values cognitively or outside the narrative context.
  *   **Key Features:** Focuses on the *framing* as the active agent, the *adoption* of a perspective, the *affective* nature of the response, and the *temporary dissociation* from personal endorsement.
  *   **What it Excludes (Boundaries):**
      *   Beliefs about the existence or possibility of narrative events (Suspension of Disbelief).
      *   Emotional responses arising solely from personal associations unrelated to the narrative framing.
      *   Cognitive judgments about the narrative's values or message.
      *   Cases where the narrative framing fails to elicit the intended affective alignment.
      *   Cases where the affective response leads directly to stable endorsement of the framed values.

  In essence, AFA describes the remarkable human capacity to be temporarily "hijacked" by the emotional logic of a story (or any framed account), allowing us to feel anger at fictional slights, cheer for morally ambiguous heroes, or weep at contrived reunions, all while maintaining the rational knowledge that "it's just a story" and without compromising our core values. It's the affective power of perspective-taking amplified by narrative technique.
