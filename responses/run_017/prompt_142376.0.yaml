  Framing effects from psychology (Kahneman) show how presentation alters decisions. Applied to narratives, framing guides emotional responses. The third case could be a framing failure. But the user's emphasis on values points to "normative affordance"—what the narrative allows us to feel without endorsing it.

  For terminology, "narrative assent" might work—agreeing to feel emotions within the story's logic. Or "affective alignment." But the user wants boundaries. What's excluded? Cases where emotions match personal values, or where suspension of disbelief fails.

