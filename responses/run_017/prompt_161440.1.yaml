  - "candidates": array of objects, each with "name", "statement" (precise prose), "formal_version" (a formula), "status" (one of: requirement of rationality, defeasible heuristic, advisory only), "surviving_argument" (which argument for Reflection, if any, still supports it, and why).
  - "clauses": array of objects, each with "clause", "motivating_case" (which of my numbered cases forces it), "what_it_blocks".
  - "case_verdicts": array of objects, one per numbered case 1 through 9, each with "case" (label only), "my_verdict", "principle_verdict", "agrees" (boolean), "note".
  - "overturned": array of objects, each with "case", "why_it_must_go", "epistemic_cost" (what else you lose by dropping it).
  - "predictions": array of at least three objects, each with "novel_case" (a case I did not list, described concretely), "predicted_verdict", "confidence" (a number between 0 and 1).
  - "open_case": object with "verdict_on_case_9", "main_options" (array of strings), "recommendation", "residual_uncertainty".
  - "tradeoffs": array of objects comparing your candidates, each with "option", "what_it_saves", "what_it_sacrifices".
