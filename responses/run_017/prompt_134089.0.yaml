  ### Decision Tree for Actual Infinities

  **Starting Commitment**: Everyone accepts finite arithmetic and that any finite collection can have one more member added.

  #### Question 1 (Two Hotels: Single Guest in Hotel Z)
  *Hotel Z has all integer-numbered rooms occupied. A uniform shift-by-one rule (like Hilbert's Hotel) fails to free a room for a single new guest, but a doubling rule frees infinitely many rooms for an infinite bus. What best captures your view?*
  - **a.** The single guest cannot be housed (no uniform rule works, and non-uniform rules are invalid), but the bus can.
  - **b.** Both can be housed (non-uniform rules or other methods work for the single guest).
  - **c.** Either the scenario is incoherent, or the asymmetry shows housing is a formal trick, not real possibility.  
    *→ Go to Question 2.*

  #### Question 2 (Unpacking Two Hotels: Why Option 1c?)
  *Why did you choose "incoherent or merely formal" for Hotel Z?*
  - **a.** The scenario is incoherent: an actually infinite hotel is impossible.
  - **b.** Housing is only a formal fact about pairings, not about real physical possibility.
  - **c.** There is no fact of the matter; the question is ill-posed.  
    *→ Route to (a) if incoherent, (b) if formal, or (c) to 3c if no fact.*

  #### Question 3 (Hotel That Was Always There)
  *Rooms 1,2,3,...; no first day; one new guest arrives daily, taking the lowest empty room; today, all rooms are occupied. Is this coherent?*
  - **a.** Yes: A beginningless series is no more problematic than one with a beginning.
  - **b.** No: A collection built step-by-step can never be completed.
  - **c.** No: Any actual infinity is impossible (same as a full Hotel N).  
    *→ If (b) or (c), mark as "incoherence claimed" for routing.*

  #### Question 4 (Hotel That Was Never Built + Doorman)
  *Same hotel, full today, but no arrivals: rooms always occupied. Does this change your view from Question 3? Also, a doorman adds 1 to his tally daily forever (finite on all past days); what is his count today?*
  - **a.** Changes: The problem was traversal, not existence. Hotel coherent; count is infinite.
  - **b.** No change: Existence is the problem. Hotel incoherent; count is malformed.
  - **c.** No change: Both incoherent. Hotel coherent, but count is malformed.  
    *→ If (b) or (c), mark as "incoherence claimed" for routing.  
    Note: A change locates the objection in traversal; no change locates it in the collection.*

  #### Routing After Q4
  *If "incoherence claimed" in Q1 (via 2a), Q3 (b or c), or Q4 (b or c), go to Q6. Else, skip to Q7.*

  #### Question 5 (Abstract vs. Concrete)
  *Even if no concrete collection is infinite, is there a completed set of all natural numbers? Is "more reals than naturals" a determinate claim?*
  - **a.** Yes to both: Sets exist, and reals are uncountable.
