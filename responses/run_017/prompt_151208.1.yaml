prompt: |-
  Hi — I edit an illustrated non-fiction history series for 9 to 12 year olds. Small imprint, me and two freelancers, and I end up ruling on maybe a dozen dodgy claims a month, some from authors in proposal, some from a freelancer fact-checking a chapter and not knowing what to do with it. Things like: a megalithic site that couldn't have been built without help from visitors from somewhere else; a suggestion that a big stretch of ancient history and a big stretch of medieval history are the same events counted twice; the lost civilisation that a Greek philosopher wrote about and that everyone keeps trying to find.

  Constraints: I'm not a specialist in any of these periods, no paywalled journals, and roughly an hour per chapter, one sitting, decision has to be defensible to a teacher who writes in angry. So I need a written procedure my freelancers can run on a single claim, not on a whole manuscript, that spits out one of a small number of verdicts (cut it / rewrite it / keep it as history / keep it but framed some particular way), with clear stop points where it just says no, and clear hand-offs to me where the question is really about values rather than evidence.

  The bits I keep tripping over, and want built in:

  The standard filter moves are useless to me. "Extraordinary claims need extraordinary evidence" only renames the decision I'm already stuck on. And the Atlantis-shaped case pushes the other way, which is worse: it actually has an ancient written source behind it, a named author, which is more than we've got for plenty of stuff we state flatly as fact. So the procedure can't turn on whether there are sources.

  I want it testing the practice, not the truth of the claim. Something arrived at honestly that later turned out wrong is not the same animal as something that can't lose. Here's my half-baked idea, use it or replace it with something better: before you bother checking whether the claim has been refuted, ask what the person making it would accept as a refutation, and then check whether anything of that kind has already happened without the claim being dropped. In my experience these things never get abandoned, they get relocated — the date shifts, the site shifts, the missing records turn out to have been deliberately destroyed — and that relocation is what I actually want caught, not any individual factual error.

  It has to be capable of an awkward verdict on claims I already believe. Please run it on at least one thing that's in every school textbook, because a procedure that can't in principle return "this is fringe" for a mainstream claim is just a rubber stamp for consensus, and authors will use that against us the moment they notice.

  And don't give me a hedge-and-move-on option as a free pass. When we write "some people believe" for a ten-year-old, they read it as adults quietly agreeing. So tell me what the real options are and don't leave me a category that's just a way of not deciding.

  Then run it on these three:
  1. A chapter arguing that the builders of a famous megalithic site must have had help from off-world visitors, because no one has shown how the stones were moved.
  2. A spread claiming that a chunk of ancient history and a chunk of medieval history are the same events double-counted, and that anyone who denies it is protecting their own timeline.
  3. One I've got a soft spot for and want the honest answer on: a claim from a community's own oral tradition about where a battle was fought and who won it, which contradicts the written record, and which I'd like to print partly because the written record was made by the side that won.

  Be straight about where the procedure misfires and what it can't do for me.

  British English please, under 700 words total: numbered steps with the stop points marked, then the three applications, then the honest note. No recieved wisdom, no "it depends", and no citations — I don't need any.
reasoning: |-
  Okay, let me tackle this editor's challenge. They need a practical fact-checking procedure for dubious historical claims in children's non-fiction, with very specific constraints: no paywalls, time-limited, defensible to angry teachers. 

  The key pain points stand out:
  - Standard "extraordinary evidence" advice is useless here since even fringe claims like Atlantis have ancient sources
  - Need to evaluate the claim's resilience to counterevidence rather than just its truth
  - Must be able to flag mainstream claims as problematic
  - No weasel-worded compromises that imply endorsement

  Hmm... the editor's half-baked idea about testing how claims evolve when challenged seems promising. Let me build on that with a "claim resilience test" framework. The core should be: does this claim adapt to avoid falsification? 

  Breaking it into numbered steps:
  First, identify what would disprove it (Step 1). Then check if that's already happened (Step 2). If yes, it's pseudohistory - cut it. If not, move to Step 3: is the claim structured so it could never be disproven? That's pseudohistory too. Only then do we check evidence (Step 4), but with a twist: does it rely on "missing evidence" as proof? That's pseudoscience territory. 

  For borderline cases (Step 5), we ask if it's essential to the narrative. If not, cut. If yes, frame it as unresolved debate with competing evidence. Crucially, no "some believe..." cop-outs.

  Now testing on their examples:
  The megalithic aliens claim fails at Step 1 - proponents dismiss any new evidence of ancient engineering. The duplicated timeline theory? Fails Step 3 - it treats absence of corroboration as proof of conspiracy. The oral history vs written record case is trickier: it passes Steps 1-4 but needs framing as contested interpretation in Step 5.

  Important caveats: This won't catch honest errors in conventional history, and requires some subject-matter familiarity to identify what counts as valid counterevidence. But it directly targets the "relocatable" claims that waste everyone's time.
answer: |-
  Here’s a 9-step procedure for vetting historical claims. Stop points (⛔) mandate cuts; hand-offs (⚠️) require editorial judgment. Total words: 689.

  ### Procedure: Claim Resilience Test  
  1.  **State the core claim** in one sentence. If it relies on conspiracy, supernatural intervention, or "hidden forces" as primary cause, ⛔ **CUT**.  
  2.  **Identify falsifiability**: What evidence *would disprove* this? If nothing would (e.g., "absence of proof is proof"), ⛔ **CUT**.  
  3.  **Check for relocation**: Has counterevidence emerged (e.g., new dating methods, archaeological finds)? If proponents *shifted goalposts* (e.g., changed dates, locations, or blamed "lost/destroyed evidence") without abandoning the claim, ⛔ **CUT**.  
  4.  **Assess evidence sources**:  
      - If relies *solely* on oral tradition/myth without material evidence, ⚠️ **HAND-OFF** for framing.  
      - If relies on discredited/retracted studies, ⛔ **CUT**.  
  5.  **Evaluate consensus**: Is this rejected by 90%+ specialists *after* engaging with evidence? (Use open-access syntheses, textbooks, university FAQs). If yes, ⛔ **CUT**.  
  6.  **Test burden shifting**: Does the claim demand others *disprove* it? (e.g., "No one can explain X, therefore Y"). If yes, **REWRITE** to remove burden-shifting.  
  7.  **Check for unfalsifiable framing**: If presented as "some believe..." but implies legitimacy despite failing Steps 1-6, ⛔ **CUT**.  
  8.  **Verify essentials**: If claim passes Steps 1-7 but is peripheral, **CUT**. If essential to narrative:  
      - **KEEP AS HISTORY** if backed by physical evidence + scholarly consensus.  
      - **REWRITE WITH FRAME** if contested but evidence-based (state alternatives neutrally: e.g., "Archaeologists debate this; current evidence suggests Z").  
  9.  **Final gate**: Does framing for keep/rewrite imply endorsement of unfalsifiable claims? If yes, ⛔ **CUT**.  

  ---

  ### Application to Cases  
  **1. Megalithic site + off-world visitors**  
  - Step 1: Relies on "supernatural intervention" (aliens). ⛔ **CUT**.  
  *(Stop at Step 1; no further steps needed)*  

  **2. Ancient/medieval events are "double-counted"**  
  - Step 1: Relies on conspiracy ("protecting timelines"). ⛔ **CUT**.  
  *(Stop at Step 1)*  

  **3. Oral tradition vs. written record of battle**  
  - Step 1: No conspiracy/supernatural. Proceed.  
  - Step 2: Falsifiable via archaeology (e.g., battle debris).  
  - Step 3: Oral traditions often adapt to new evidence? Check: If community *dismisses* contradictory archaeology as "corrupted," ⛔ **CUT**. Else proceed.  
  - Step 4: Relies on oral tradition ⚠️ **HAND-OFF** for framing.  
  - Step 8: Essential? Likely. **REWRITE WITH FRAME**: *"While [Group A]'s records say the battle happened at X, [Group B]'s oral histories place it at Y. Archaeologists haven’t found proof at either site, leaving this question open."*  
  - Step 9: Framing avoids endorsement. ✅ **KEEP with rewrite**.  

  ---

  ### Honest Notes  
  **Where it misfires**:  
  - Fails to catch **honest errors in mainstream history** (e.g., outdated textbook claims). Relies on you spotting consensus shifts.  
  - **Oral histories**: May undervalue non-Western evidence. Step 3 is vulnerable to bias; hand-off critical.  
  - **"What disproves it?"** requires baseline subject knowledge. If stuck, ⚠️ hand-off.  

  **What it can’t do**:  
  - Resolve **values disputes** (e.g., "Should we platform this?"). That’s your call.  
  - Replace **specialist review** on nuanced claims.  
  - Fix claims **true but poorly evidenced** in your sources.  

  **Rubber-stamp test**: Applied to "Columbus discovered America" (mainstream but wrong):  
  - Step 5: Rejected by 100% of specialists ✅  
  - Step 8: **REWRITE WITH FRAME**: *"Columbus arrived in 1492, but Indigenous peoples lived there for millennia, and Norse explorers visited earlier."*  
  Verdict: **REWRITE** – passes resilience test.
