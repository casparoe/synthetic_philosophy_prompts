  On the severance test: Tom will argue the trap analogy fits better than "mistake," while Eleanor will insist on contingency—no single decision point. For the counterfactual ledger, Eleanor must press the non-identity problem hard ("you can't harm the unborn by creating them"), forcing Tom toward a quality-over-quantity stance. The exit test is trickiest—Tom's own farming becomes ironic ammunition for Eleanor, but his "porous borders" observation about early states is solid. 

