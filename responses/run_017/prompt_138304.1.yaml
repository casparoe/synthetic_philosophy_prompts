prompt: |-
  I'm trying to find out whether a pattern I've noticed in my own working life has already been described and given a name, and — more importantly than the name — how it should be carved up: what belongs to it, what merely resembles it, and where it stops.

  The background: I'm a biostatistician in a consulting role, and for about two years I've used a language model as part of almost everything I do. I don't think I'm doing what the people who worry about this sort of thing usually describe. I don't copy output and pass it along. I reject a fair amount of what the model gives me — my sense is somewhere between a quarter and a third — and I can usually say what is wrong with it. My difficulty is elsewhere.

  Three instances, so the shape is clear.

  First. The model proposes an analysis, or writes the code for one, and I read it and it seems right, but I'm uneasy about one specific step: whether a random-effects structure is identified here, whether a robust variance estimator is the right choice, whether the missingness is plausibly ignorable. What I do with that unease is ask the model. Sometimes in the same conversation, sometimes in a fresh one, sometimes by asking it to critique the answer it just gave me. I then act on the reply. When I have checked independently — a colleague, a book on my shelf, actually running the simulation — the things the model flagged have mostly been real, and the things it cleared have mostly been fine. So the vetting works. But the vetting is done by the thing being vetted.

  Second. I ask it to draft passages for reports and protocols. I can tell good prose from bad, and I rewrite heavily. But I've noticed that my sense of what the finished passage should sound like has drifted toward what the model produces, so that what I am now checking drafts against is a standard the model taught me. When I ask a colleague, they say the writing is fine. That isn't evidence, since they're reading it with the same drifted standard.

  Third. Increasingly I ask the model what a careful reviewer would want checked. The checklist I use to audit the work is generated by the system that produced the work. If you had told me two years ago that I would end up asking a tool what counts as a mistake in its own output, I'd have said that was an obviously bad idea. It doesn't feel like one in practice, because the items on the list are sensible and I recognize them as things I would have thought of.

  Two things make me think this isn't just ordinary tool use, and neither is the worry I usually see raised. The first is that I am not a layperson here. I could check these things myself — derive the result, work the example, look it up — I have the training, and the cost is a day, not a career. I simply don't, and over two years the number of times I have has fallen to nearly zero. So this isn't a case of having no choice but to defer. The second is that I suspect my blind spots and the model's are correlated. The cases where I feel uneasy and ask are the cases where I already half-suspect an error; the cases where I feel no unease and don't ask are exactly the cases where the model and I share a default assumption. The check is least likely to happen where it is most needed. That is different, it seems to me, from using a spellchecker or a calculator, where the errors I can't catch myself are of a different kind from the errors I can.

  I've seen discussions of several things nearby, described loosely: research on how people forget what they can look up; the idea that a tool can become part of your own thinking; work on deferring to experts one cannot in principle check; work on over-trusting automated systems; and, in philosophy, worries about using a source to establish that very source's reliability. None of these seems to be quite my case, but I can't tell whether that's because mine is genuinely distinct or because I don't know the vocabulary.

  So: does this configuration have an established name — retained critical ability whose grounds are supplied by the system being criticized, with errors correlated between critic and system — and if not, what would you call it, and how would you define it so as to exclude the neighbours? In particular I'd want the boundary cases settled: is putting the same question to a differently built model an independent check or not; does it change anything that I audit a random one item in twenty rather than none; does it matter that the tool is right most of the time; does the phenomenon disappear if the person could, with a week of study, check for themselves, and does it come back in a different form when they can't; and is a spellchecker or a calculator genuinely the same thing in miniature, or is there a real break, and if so where exactly does it fall?
reasoning: |-
  Okay, the user is a biostatistician who's been using a language model extensively in their consulting work for about two years. They've noticed a pattern where they rely on the same AI system to critique its own output, and they're concerned about several things: their critical ability being grounded in the system they're criticizing, shared blind spots between them and the AI, and how their standards have shifted over time. 

  Hmm, this is fascinating because it's not the typical "over-reliance on AI" scenario. The user clearly has expertise - they reject about 25-33% of the AI's output and can articulate why. The real issue seems to be this self-referential checking system they've created. 

  Let me break down their three examples: First, they use the AI to critique its own statistical suggestions. Second, their writing style has unconsciously aligned with the AI's output. Third, they ask the AI what to audit in work it produced. The user makes two crucial observations: 1) They're fully capable of independent verification but choose not to, and 2) Their blind spots correlate with the AI's.

  The user has done their homework - they mention related concepts like the Google effect (forgetting what you can look up), extended cognition (tools as part of thinking), epistemic dependence (relying on experts), automation bias, and epistemic circularity. But none quite fit. 

  What's unique here is the bidirectional influence: the AI shapes the user's judgment criteria while the user's expertise trains the AI (via their prompts and feedback). It's a co-adaptive system with shared vulnerabilities. The correlated errors are particularly worrying - when both are wrong, there's no internal alarm bell.

  For naming, "recursive verification" captures the self-referential checking. "Mutual calibration" emphasizes the two-way influence. "Embedded grounds" highlights how the AI supplies the criteria for its own evaluation. 

  Boundary cases are tricky: Using a different model would provide independence only if the models have different architectures/training. Random spot-checks help but don't solve the correlated blind spot issue. The spellchecker comparison fails because spelling errors aren't correlated with human blind spots like conceptual statistical errors might be.

  The core tension is between efficiency and epistemic integrity. The user saves enormous time by not independently verifying everything, but at the cost of creating a closed epistemic loop. The solution isn't abandoning the tool but building external checks - collaborators using different models, maintaining personal "naive" notes from before AI use, or scheduled deep dives into fundamentals.

  This user is exceptionally perceptive - they've identified a subtle, emerging epistemological problem that many professionals will face as AI integrates deeper into expert workflows. Their awareness alone puts them ahead of most users.
answer: |-
  Based on your detailed description, the pattern you've identified is a distinct and sophisticated form of epistemic dependence with unique characteristics. While adjacent to several known concepts, it doesn't have a single established name—yet. I'll define the core phenomenon, propose a name, clarify boundaries, and address your specific questions.

  **Core Phenomenon & Proposed Name:**  
  This is **Recursive Verification with Correlated Blind Spots (RV-CBS)**.  

  *   **Recursive Verification:** Using System A to verify its *own* output or establish the criteria for its evaluation.
  *   **Correlated Blind Spots:** Shared, unknown vulnerabilities between the user and System A, where System A is least reliable precisely when the user's independent judgment is most compromised.

  **Why this is distinct from neighboring concepts:**

  1.  **Google Effect / Digital Amnesia:** Focuses on forgetting *factual* information. RV-CBS involves outsourcing *critical judgment and criteria-setting*, not just facts.
  2.  **Extended Cognition:** Tools as part of the cognitive process. RV-CBS specifically involves the tool *evaluating itself* within that process, creating a loop.
  3.  **Epistemic Dependence/Deference:** Relying on experts/systems you *cannot* check. You *could* check but *choose not to*, creating a *voluntary* dependence loop.
  4.  **Automation Bias / Complacency:** Over-trusting automated outputs. RV-CBS involves *active critical engagement* (you reject outputs), but your critical *grounds* are compromised by the loop and shared blind spots.
  5.  **Epistemic Circularity (Philosophy):** Using a source to justify its own reliability. RV-CBS is *pragmatic* and *operational*: the source supplies the *specific criteria* for evaluating its *specific outputs* in real-world tasks, not just its general reliability.

  **Boundary Cases & Your Specific Questions:**

  1.  **Using a Differently Built Model:**
      *   **Independent Check?** *Potentially, but not necessarily sufficient.* If Model B has significantly different architecture, training data, and *known uncorrelated failure modes* with Model A, it provides independence. If they share underlying biases (e.g., both trained on similar flawed literature), it offers false security. True independence requires a fundamentally different source (human expert, textbook, simulation).

  2.  **Auditing a Random 1 in 20 Items:**
      *   **Impact:** This *mitigates* but does *not eliminate* RV-CBS. It forces some independent checks, potentially catching *some* correlated errors you stumble upon. However, it leaves 19/20 items fully within the verification loop, and the random check might miss the specific scenarios where your shared blind spot with the model is active.

  3.  **Tool is Right Most of the Time:**
      *   **Relevance:** High accuracy *enables* RV-CBS by making it pragmatically successful, but it *exacerbates* the risk. Success reinforces the loop and dependence, making the eventual failure (due to correlated blind spots) more surprising and damaging. High reliability masks the underlying vulnerability.

  4.  **Ability to Check with Effort (e.g., a week):**
      *   **Does the Phenomenon Disappear?** No. The core is the *voluntary abandonment* of independent verification capability *in practice*, leading to the recursive loop and drift in standards. The *capability* to check is necessary for the "voluntary" aspect, but the *choice not to exercise it* sustains RV-CBS. If you *couldn't* check even with effort, it would shift towards pure epistemic dependence, losing the "voluntary loop" element.

  5.  **Spellchecker/Calculator Analogy:**
      *   **Is it the Same?** **No, there's a qualitative break.**
      *   **The Break Occurs At:** *The complexity of the task and the nature of the potential errors.*
          *   **Spellchecker/Calculator:** Handle well-defined, context-independent tasks with clear right/wrong answers. Errors are usually random glitches or edge cases unrelated to the *user's conceptual understanding*. Your critical faculty (knowing "cat" vs. "car") is robust and independent.
          *   **RV-CBS Context (Stats/Protocols):** Involves complex, context-dependent judgment calls, conceptual understanding, and interpretation. Errors often stem from flawed assumptions, reasoning, or unstated biases. Here, the *user's critical faculty itself is vulnerable to drift and co-option* by the tool, and errors are likely *correlated* with the user's own conceptual weaknesses. The tool isn't just checking output; it's shaping your *judgment criteria*.

  **Defining RV-CBS Clearly (Excluding Neighbors):**

  RV-CBS occurs when:
  1.  An expert user (capable of independent verification) integrates a complex generative/predictive system (e.g., LLM) deeply into their workflow.
  2.  The user actively critiques the system's outputs but relies *recursively* on the same system (or outputs shaped by it) to:
      *   Provide the criteria for evaluation ("What should I check?").
      *   Critique its own proposals/results.
      *   Shape the standards against which outputs (and their own revisions) are judged.
  3.  This creates a self-referential verification loop.
  4.  Critically, the user's *domain-specific blind spots and conceptual vulnerabilities* are *correlated* with the system's failure modes. The system is least reliable when the user is least likely to independently recognize the need for scrutiny.
  5.  Over time, this leads to a *voluntary erosion* of independent verification practice and a *drift in judgment standards* aligned with the system's outputs.

  **Conclusion:**  
  You've identified **Recursive Verification with Correlated Blind Spots (RV-CBS)**. It's a subtle form of expertise erosion enabled by highly capable, integrated AI tools. The danger isn't laziness, but the insidious co-option of critical judgment within a self-reinforcing loop, amplified by shared, unrecognized vulnerabilities. Mitigation requires deliberate strategies: mandatory independent verification of *critical* assumptions/judgments (using truly independent sources), collaboration with peers using *different* tools/methods, periodic "back-to-basics" reviews using pre-AI resources, and explicit reflection on how your standards may have drifted. The phenomenon highlights a profound challenge as AI moves from an assistant to a co-author of thought processes.
