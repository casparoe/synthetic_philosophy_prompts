  I want a number, and I want the derivation that produces it. Here is the case.

  **The Copy Room.** One thousand players are placed in separate rooms, told the rules below, and randomly matched into pairs for a single round: no repetition, no communication, no reputation. Payoffs: 3 to each if both cooperate; 1 to each if both defect; 5 to you and 0 to your partner if you defect while your partner cooperates; and the reverse if you cooperate while your partner defects. Every player is also told the following. A fraction ρ = 0.3 of the *other* players are copies: they run exactly your decision procedure on exactly your information, with no implementation noise, so their choice is guaranteed to match yours. The remaining 0.7 are strangers: nothing you do influences their choice, and your prior on their rate of cooperation is b = 0.4. Whether your partner is a copy or a stranger is independent of your own action and unknown to you. Nowhere in the setup is there causal influence between players — only the correlation just described.

  **The proposition.** In the Copy Room as specified, the rational choice is to cooperate: the argument for cooperation that works when correlation is perfect does not collapse when correlation is partial at these parameter values. Count the proposition as settled in favour of cooperation only if *both* the expected-payoff comparison and a defensible account of what "rational" means here come out on that side; if either fails, count it against.

  My credence is about 0.45. A friend's is about 0.12. Hers is low, I think, because she takes the arithmetic to be decisive and to favour defection; mine is higher because I doubt that the strangers' cooperation rate can simply be held fixed at 0.4, and I think letting it move shifts the threshold.

  Give me your own number, decomposed. Show the expected payoffs explicitly — the figure for cooperating and the figure for defecting at ρ = 0.3, b = 0.4 — and derive the critical value of ρ at which the recommendation flips, as a function of b. Then break the question into sub-questions, each with a probability and one line of justification, and combine them. I suggest at least these:

  1. Whether the central move is sound at all: that a guaranteed correlation between your action and a copy's licenses you to treat *their* action as counterfactually dependent on yours, even though you have no causal influence on it.
  2. Whether b is exogenous or endogenous. If the strangers are themselves rational and know the whole specification — ρ, the fact that copies' actions are pinned to their bearers' reasoning, everything except whether they themselves are copies — what is the consistent value of b? And if the 0.7 "strangers" are not independent individuals but a handful of further clusters, each internally perfectly correlated (say four equal clusters, so that a player's partner is a fellow cluster member with probability roughly 0.25), is there a symmetric fixed point at which cooperation is sustained? This is where I suspect my disagreement with my friend actually lives.
  3. Whether superrationality survives as a distinctive normative stance once the correlation is partial, or whether at ρ < 1 it is nothing more than ordinary expected-utility reasoning with a correlated prior — and whether anything of practical or philosophical consequence rides on which of those it is.
  4. What "rational" is doing in the proposition: maximising your own expected payoff, maximising the total for your correlated cluster, or maximising the pool's. Is the choice among these a decision-theoretic question or a moral one, and does your answer to the proposition change under the second or third reading?
  5. Whether randomization helps. In the winner-take-all variant of these problems — one button-presser takes a large prize, two or more pressers take nothing — the standard move is for the correlated group to randomize with probability 1/N. Is there any analogue here: should the copies cooperate with probability q rather than outright, or do these payoffs depend linearly on q in a way that makes the move empty?

  Add any term you think I have missed. Then tell me which single term your final number is most sensitive to, which term you are least confident about, and what argument or evidence would move that term most.

  Finally, commit. I do not want "it depends on which decision theory you accept." Give one number; name the sub-question doing the most work; and tell me what your number becomes if I force you to resolve that sub-question first one way and then the other. Mark plainly where you are guessing rather than arguing. If you think the proposition as stated has no determinate truth value, say so in one line and then give the number for the nearest proposition that does. Do not cite papers, name authors, or appeal to the literature — I want the argument, not the sources. Please keep the whole response under 800 words.
