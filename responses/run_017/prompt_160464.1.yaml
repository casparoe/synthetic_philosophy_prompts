  2. **Whether b is exogenous or endogenous**:  
     Prob: 0.05 (for exogenous b=0.4 supporting cooperation, but it doesn't at ρ=0.3)  
     Justification: If b is fixed at 0.4, E[D]>E[C]; if endogenous, b=0 and defection dominates, so endogeneity hurts cooperation.

