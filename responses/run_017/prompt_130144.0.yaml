answer: |-
  ### Sunk Cost Exploration Activity: "The Commitment Game"

  #### **Core Objective**  
  Create visceral tension between abandoning vs. persisting, letting players experience when honoring sunk costs *feels* rational vs. when it’s clearly wasteful. Highlight policy-level benefits, asset retention, and signaling without lecturing.

  ---

  ### **Materials**  
  - **Index cards** (3 colors: Blue, Green, Yellow)  
  - **Dice** (1 per team)  
  - **Whiteboard** (track scores)  
  - **Prize** (e.g., $10 bookstore gift card for winning team)  
  - **Timer**  

  #### **Card Setup**  
  - **Blue Cards (Volcano Dig)**:  
    - *Front*: "Dig Site Setup: Pay 5 points. Possible rewards: Gem (20 pts) or Rocks (0 pts)."  
    - *Back*: Hidden outcome (pre-rolled by facilitator: 1–3 = Rocks, 4–6 = Gem).  

  - **Green Cards (Orchard)**:  
    - *Front*: "Plant Sapling: Pay 10 points. After 2 rounds, harvest Fruit (15 pts). *If your team completes 2 Orchards, each gains +5 bonus.*"  

  - **Yellow Cards (Bridge Build)**:  
    - *Front*: "Start Construction: Pay 5 points. Next round: Pay 5 more to finish. Reward: 10 pts. *Teams finishing 3+ projects get +20 ‘Community Trust’ bonus.*"  

  ---

  ### **Rules & Payoff Scheme**  
  - **Teams**: 4–5 players each (4 teams for 20 players).  
  - **Starting Points**: 50 per team.  
  - **Rounds**: 4 rounds (15 min/round), each with:  
    1. **Choose**: Pick 1 card (any color) and pay its initial cost.  
    2. **Complete/Abandon**: For cards started in *prior* rounds, decide:  
       - **Complete**: Pay cost, receive reward (reveal Blue outcomes).  
       - **Abandon**: No cost, no reward.  
  - **Scoring**:  
    - Points deduct when costs are paid.  
    - Bonuses applied at game end.  
  - **Stakes**: Winner gets prize. Announce: *"Points = real snack-budget control next month"* (e.g., winner picks snacks).  

  ---

  ### **Timeline (90 Min Total)**  
  1. **Intro (5 min)**:  
     - *"You’re explorers investing in projects. Goal: Maximize points. Every point = real snack influence."*  
     - Show card types (emphasize bonuses). **Do NOT explain sunk costs.**  

  2. **Round 1 (15 min)**:  
     - Teams choose 1 card (Blue/Green/Yellow), pay initial cost.  
     - Facilitator pre-rolls Blue cards (record outcomes secretly).  

  3. **Round 2 (20 min)**:  
     - Teams decide on Round 1 cards (complete/abandon).  
     - Teams start a new card (any color).  

  4. **Round 3 (20 min)**:  
     - Decide on Round 2 cards.  
     - Start new card.  

  5. **Round 4 (20 min)**:  
     - Decide on Round 3 cards.  
     - **No new cards.** Calculate bonuses (Orchard x2? Projects ≥3?).  

  6. **Debrief (10 min)**:  
     - Reveal scores. Award prize.  
     - **Guided discussion (whiteboard notes)**:  
       - *"When did you abandon? Why?"* → Highlight Blue (Volcano) cases.  
       - *"When did you persist despite poor odds? Why?"* → Note Green/Yellow examples.  
       - *"What made persisting pay off?"* → Link to bonuses (policy) and Community Trust (signaling).  
       - **Finally**: Name "sunk cost fallacy." Contrast *"Why we ignore past costs"* (Blue) vs. *"When past costs create future assets"* (Green/Yellow).  

  ---

  ### **Handling Predictable Problems**  
  1. **"It’s only points" shrug**:  
     - **Fix**: Prize + "snack control" stakes. Announce mid-game: *"Team X is leading by 15 pts!"* to fuel competition.  

  2. **Loud contrarian or hypothesis-spoiler**:  
     - **Fix**: Assign them as "team reporter" (responsible for explaining their group’s choices in debrief). Channel energy into gameplay.  

  3. **Refusal to engage with fake stakes**:  
     - **Fix**: Let them track scores neutrally. Often, they’ll lean in once teams debate choices.  

  4. **Overfocus on winning**:  
     - **Fix**: Debrief emphasizes *"What did you learn?"* over scores. Ask: *"Would you make the same choices alone?"*  

  5. **Time crunch**:  
     - **Fix**: Use timer strictly. Skip bonus calcs if behind; approximate and explain post-game.  

  ---

  ### **What the Activity Can’t Replicate (Requires Verbal Explanation)**  
  - **Signaling to outsiders**: The game models *internal* team reputation (via bonuses), but not external signals (e.g., "I’m reliable" to strangers).  
    - **Debrief script**: *"In the game, persisting earned team bonuses. In life, it might signal ‘I keep promises’ to others, even if this project fails. That signal has value—but it’s separate from the project itself."*  

  ---

  ### **Why This Works**  
  - **Sunk cost tension**: Blue cards (Volcano) make players *feel* the "I’ve already paid!" urge (initial cost sunk, reward unlikely).  
  - **Policy-level payoff**: Green cards (Orchard) reward teams who persist *systematically* ("We finish what we start").  
  - **Asset retention**: Yellow cards (Bridge) mimic "half-built assets" (paying to unlock future options).  
  - **Self-produced rationales**: Teams debate pro-persistence reasons *before* knowing the concept:  
    - *"We should finish the Bridge—it’s almost done!"* (asset)  
    - *"If we abandon Orchards now, we lose the bonus!"* (policy)  

  ---

  ### **First-Time Predictions & Fixes**  
  | **Prediction**                          | **Fix**                                                                 |  
  |-----------------------------------------|-------------------------------------------------------------------------|  
  | Teams abandon all Blue cards once burned | Emphasize competition: "No risk, no reward!" Pre-roll some Gems to tempt. |  
  | Confusion on bonus rules                 | Print summary cards per team: "Orchard: Complete 2 = +5 each. Projects: 3+ = +20." |  
  | Debate monopolizes time                 | Enforce 2-min "team huddles" for decisions. Use timer audibly.          |  

  ### **Key Wrinkles Addressed**  
  1. **Policy vs. act**: Bonuses reward teams who institutionalize persistence (Green/Yellow), contrasting with individual Blue decisions.  
  2. **Assets vs. sunk costs**: Yellow cards make "what’s left behind" tangible (e.g., half-built Bridge).  
  3. **Signaling**: "Community Trust" bonus approximates reputation payoff.  

  **Guesswork**: I assume your group can grasp asset retention intuitively. If not, use the debrief to distinguish: *"Was the Bridge an ‘asset’ (something usable later), or just sunk cost?"*  

  Run this, and they’ll *feel* the fallacy—and its exceptions—in their bones.
