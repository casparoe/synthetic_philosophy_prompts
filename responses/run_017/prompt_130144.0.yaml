  We are designing an activity for a group of 16-22 adults, in a library setting, with 90 minutes. The goal is to explore sunk costs without using the term until the end, and to let participants experience the tension between the standard economic advice (ignore sunk costs) and the situations where honoring sunk costs seems to pay off.

  Key elements to incorporate:
  1. The tension between act-by-act reasoning and policy-level reasoning.
  2. The fact that some sunk costs are not pure because they leave behind assets (like a half-built project, a skill, etc.) that might have value.
  3. The signaling value in social contexts.

  Activity Design: "The Project Completion Challenge"

  Overview:
  Participants are divided into small teams (around 4-5 people per team). Each team will work on a series of small projects. Each project requires an initial investment (in points) to start and then a series of follow-up investments (also in points) to complete. The catch: after the initial investment, the project might turn out to be a "bad" project (low or negative returns) or a "good" one (high returns). Teams must decide at each stage whether to continue investing or abandon the project.

  Materials:
  - Index cards (to represent projects and track investments and returns)
  - Dice (to introduce randomness and uncertainty)
  - Whiteboard (to track team progress and overall scores)
  - Small prize for the winning team (to add stakes, e.g., a box of cookies or a book token)

  Setup:
  1. Create project cards. Each project card has:
     - An initial cost (e.g., 10 points)
     - A completion cost (which may be one or more payments, e.g., 5 points per stage for 2 stages, so total 10 points to complete)
     - A hidden return value (which will be revealed only if completed, but the type of project is known from the start: some are known to be risky, some safe, but with a twist)

     We'll have two types of projects:
     Type A: "Fixed Return" projects. These have a known return (e.g., 25 points) if completed. But there's a catch: after the initial investment, a die roll will determine if the project is actually going to be successful. For example, if the die roll is 4 or above, the project returns 25 points. If it's 3 or below, the project returns 5 points (a loss). However, the team doesn't know the outcome until they complete the project.

     Type B: "Learning Curve" projects. These projects require an initial investment and then two stages of completion. The return is fixed (say 30 points), but the twist is that if a team completes two of these projects, they get a bonus on the second one (because they learned). So the first one might be a loss (if they only do one) but the second one is a win.

     Type C: "Social Signal" projects. These projects have a fixed cost and return, but there's an additional element: if a team completes a certain number of projects (even the ones that are individually losing) they get a reputation bonus at the end (from the "community"). For example, for every three projects completed (regardless of individual outcome), the team gets 20 bonus points.

  2. Each team starts with 100 points.

  3. The game will have 5 rounds. In each round, teams are presented with a choice of projects (they can choose one per round). The projects are described by their type and costs, but the outcome is uncertain. The projects are represented by index cards that they can pick from a deck.

  Gameplay:
  - Each round, the facilitator draws a set of project cards (more than the number of teams) and lays them out. Each card has:
     - Project type (A, B, or C)
