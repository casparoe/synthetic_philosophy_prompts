prompt: |-
  You are a professional philosopher specialising in decision theory and the foundations of rational choice. Answer as a specialist would, and think carefully before you commit yourself: begin by listing five candidate concepts or labels that someone might reach for given what I describe below, without evaluating them at that stage; then check the arithmetic I sketch; then say which candidate fits best, why the others do not, and only at the end give me a name. I do not want a label; I want the carving. And please give me no references or reading list — I have no way to check them, and being told to go and read someone would be no answer at all.

  The background: I spent last night arguing with a friend about a case of the following shape. A large number of people, mutually anonymous, no repetition, no reputation, no communication, each receive the same one-shot offer: contribute, and it costs you one unit, while every other person who contributes puts 0.01 units in your pocket. Your contributing does nothing to anyone else; it is causally inert with respect to everyone else's payoff, and inert with respect to your own apart from the unit it costs you. My friend took the usual line: since your act changes nothing, there is no reason to perform it, and any argument to the contrary is self-deception. I found myself reaching for something I could not quite formulate, and I want to know whether the thing I was reaching for is a real thing with a name.

  What I was reaching for: suppose that, for whatever reason, whether you contribute is very slightly correlated with whether any given other person contributes — a correlation of 0.001, say, small enough that in a two-person case nobody would think it generated a reason for anything. If there are a thousand others, the correlation shifts the expected number of other contributors by about one, which is worth 0.01 to you, far less than the unit you pay. If there are a hundred thousand others, it breaks even. If there are a million, it is worth roughly ten units against a cost of one, and you should contribute. The verdict of the argument therefore flips purely with the size of the population, with the correlation and the payoffs held fixed. Check my arithmetic, and tell me whether the shift in the expected count really is about N times the correlation or whether I have the standardisation wrong.

  Five features of this make me think it is not just a familiar view wearing a hat:

  1. It needs no twinhood and no shared reasoning. The correlation could arise from something as mundane as everyone having read the same newspaper. So it is not the view — I believe it has a name something like super-rationality, and comes from a popular essay — on which you act as if you were choosing for everyone because you know the others reason exactly as you do.
  2. It does not restore causal efficacy. It is not an answer to the objection that your act makes no difference; it concedes that and changes the subject to what your act indicates. So it should not be confused with arguments that try to show that your vote or your contribution really does make a difference after all.
  3. The news seems to be borne by the aggregate rather than by any individual: learning that I contributed tells me something substantial about how many people contributed, while telling me almost nothing about whether you did. I do not know whether it is legitimate to add up a million negligible shifts in expectation and treat the sum as a reason.
  4. The verdict depends on which population I count — everyone in the city, everyone in the country, everyone who read the same newspaper, everyone facing a relevantly similar decision, my future selves — and I can see no non-arbitrary stopping point. That looks either like a reductio of the argument or like a sign that I have stated it badly.
  5. It generalises away from cooperation altogether. If my smoking is correlated, at 0.001, with each of a million independent small risks rather than with a single lesion, then by the same arithmetic I have an overwhelming evidential reason not to smoke, which is exactly the sort of reasoning that is supposed to be evidential decision theory's vice rather than its virtue.

  A friend who reads this literature muttered something about evidential cooperation in large worlds. I do not know whether that is a real phrase, and from the little I could gather it concerns whether an evidentialist can secure cooperation in a large one-shot prisoner's dilemma — near my case, but not, I think, the thing I have isolated, which concerns the aggregation of negligible correlations, the sensitivity of the verdict to how the population is individuated, and the fact that the argument survives with no similarity between the agents at all.

  So: does what I have described have an established name, and is it genuinely distinct from the neighbouring views? Tell me which nearby concept it is closest to, exactly how it differs from each, and whether the argument as I have stated it actually goes through. If nothing established fits, coin a name, give a precise definition, and give me the boundary cases the definition must get right — the correlation being exactly zero; the correlation being negative; the correlation being produced by a common cause I have already conditioned on; a population gerrymandered to include people whose acts do not affect me; and the case in which I already know with certainty what I am going to do. I would also like to know whether this is a real phenomenon, or whether I have merely confused is evidence of with makes more likely by an amount worth caring about.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated decision theory puzzle involving negligible correlations in large populations, and I need to carefully unpack each layer of their query. 

  First, I'm considering the core mechanism they described: a tiny 0.001 correlation between one's own action and others' actions, scaled across N individuals. The arithmetic checks out - multiplying correlation by N gives the shift in expected other-cooperators. For N=1,000,000, that's 1,000 extra expected contributors, worth 10 units against a 1-unit cost. The math is sound, but the philosophical implications are what need scrutiny.

  The user's five distinctive features suggest this isn't standard evidential decision theory (EDT). The absence of twinhood/superrationality (point 1) and causal inertness concession (point 2) rules out Bicchieri's or Hofstadter's approaches. The aggregate evidence point (3) feels novel - individual correlations are negligible but collectively significant. The population framing dependency (4) is particularly troubling; counting different reference classes yields different verdicts, which smells like a reference class problem on steroids. And the smoking generalization (5) shows this isn't just about cooperation - it's about any action with distributed evidential consequences.

  I recall Skyrms' work on correlated equilibrium, but that requires common priors. The "evidential cooperation in large worlds" phrase the friend mentioned might point to something like Drescher's work, but the user insists no similarity between agents is needed. This mechanism seems more primitive - just statistical aggregation of tiny signals.

  The boundary cases they request are telling: zero correlation collapses it (as it should), negative correlation would reverse incentives, and pre-conditioning on common causes should neutralize the effect. The gerrymandered population case exposes the reference class vulnerability - if I include people whose actions don't affect me, the correlation becomes irrelevant noise. And if I already know my action, the evidential link breaks.

  What emerges is a phenomenon where rational choice depends on population scale when tiny correlations exist. Naming it requires capturing: the aggregative nature, the pure evidentiality, and the scale-dependence. "Statistical Evidential Scaling" might work, with the boundary that it only applies when the agent doesn't possess defeating information.

  The deeper worry is whether this is a genuine decision principle or just an artifact. But given the math holds, and the effect is real in Bayesian terms, I think it's a legitimate (if unsettling) feature of evidential reasoning. The arbitrariness of reference classes remains the biggest philosophical concern - perhaps the answer is that in the absence of a natural population, the principle shouldn't apply.
answer: |-
  ### Candidate Concepts (without evaluation)
  1. **Evidential Decision Theory (EDT) with correlated beliefs**  
  2. **Statistical aggregation of negligible evidence**  
  3. **Reference class problem in decision theory**  
  4. **Large-population evidential effects**  
  5. **Correlation-driven expected utility shifts**  

  ---

  ### Arithmetic Verification  
  Your calculation is correct:  
  - Let **ρ** = correlation between your contribution (C_Y) and one other person's contribution (C_O).  
  - **E[# others contributing | C_Y] ≈ Nρ** (if baseline probability is fixed).  
  - Payoff per other contributor: **+0.01** units.  
  - Expected benefit: **0.01 × Nρ**.  
  - Cost: **1 unit**.  
  - **Net expected utility**: **(0.01Nρ) − 1**.  
  - **Break-even**: **Nρ = 100**.  
  - At **ρ = 0.001**, verdict flips at **N = 100,000**.  
  - **Standardization**: Correct for small ρ and independent others.  

  ---

  ### Evaluation of Candidates  
  1. **Evidential Decision Theory (EDT) with correlated beliefs**  
     - **Fit**: Strong. EDT uses acts as evidence to update beliefs about outcomes. Your argument is evidential: contributing *indicates* higher group contribution.  
     - **Why not others?** Explicitly rejects causal efficacy (point 2), distinguishing it from causal decision theory (CDT).  

  2. **Statistical aggregation of negligible evidence**  
     - **Fit**: Partial. Captures summing tiny correlations.  
     - **Why not best?** Describes a mechanism but isn’t a named decision-theoretic concept. Fails to address population-dependence (point 4).  

  3. **Reference class problem**  
     - **Fit**: Partial. Highlights arbitrariness in choosing "who counts" (point 4).  
     - **Why not best?** A problem for the view, not the view itself. Doesn’t explain the payoff flip.  

  4. **Large-population evidential effects**  
     - **Fit**: Descriptive but vague. Matches scale sensitivity.  
     - **Why not best?** Not a recognized category; ignores correlation’s role.  

  5. **Correlation-driven expected utility shifts**  
     - **Fit**: Core to your argument.  
     - **Why not best?** Redundant with EDT + correlation.  

  **Closest established concept: Evidential Decision Theory (EDT)**.  
  - **How it differs**:  
    - From **superrationality** (Hofstadter): No twin reasoning or symmetry (point 1). Your correlation is accidental (e.g., shared news), not logical.  
    - From **causal cooperation arguments**: Concedes causal inertness (point 2). EDT doesn’t require causation.  
    - From **standard EDT objections** (e.g., smoking lesion): Generalizes beyond cooperation (point 5). Your case shows EDT’s verdicts can *flip* with population size, even when causalists see no reason.  

  ---

  ### Does the Argument Go Through?  
  **Yes, technically**.  
  - If ρ > 0 and N is large enough, **EDT recommends contributing**.  
  - **But**: The correlation must be **epistemically legitimate** (see boundary cases).  

  ---

  ### Boundary Cases & Precise Definition  
  **Name**: **Aggregative Evidential Scaling (AES)**  
  **Definition**:  
  > An agent should choose an act *A* if, given a correlation ρ > 0 between *A* and each of *N* independent events *E_i* affecting utility, the aggregated shift in expected utility from *A* (via ∑ΔP(*E_i*|*A*)) outweighs *A*’s cost.  

  **Boundary Cases**:  
  1. **ρ = 0**: Net utility = −1. **Do not contribute**.  
  2. **ρ < 0**: Net utility negative for large N. **Never contribute**.  
  3. **Common cause conditioned on**: If you condition on the common cause (e.g., "I read the news"), ρ may vanish. **AES dissolves**.  
  4. **Gerrymandered population**: If events *E_i* don’t affect you (e.g., strangers’ acts in another country), they shouldn’t be in *N*. **AES inapplicable**.  
  5. **Known action**: If you know your act with certainty, it provides no evidence about others. **AES irrelevant**.  

  ---

  ### Is This a Real Phenomenon?  
  **Yes**, but with caveats:  
  - **It’s evidential, not causal**: Your act *is* evidence (not a cause) of others’ acts.  
  - **The aggregation is valid**: Summing negligible evidence is standard in probability (law of large numbers).  
  - **Reference class arbitrariness (point 4) is fatal without constraints**: AES requires a *natural* population where:  
    - *E_i* affect your utility,  
    - ρ arises from an unobserved common influence (e.g., shared culture/news).  
  - **Not self-deception**: If ρ is well-grounded (e.g., empirical studies show slight correlation in behavior), AES is rational under EDT.  

  **Conclusion**: AES is a legitimate, distinct facet of evidential reasoning. It generalizes EDT’s implications in large populations with shared influences, exposing scale-dependency in rational choice. Its vulnerability to reference class problems is a feature, not a bug: it reveals EDT’s sensitivity to how agents individuate their world.
