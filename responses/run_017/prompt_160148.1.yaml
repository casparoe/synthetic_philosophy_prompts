answer: |-
  Here is a prioritized research agenda for your 3-year program, based on **upstream impact**, **tractability with conceptual tools**, and **downstream consequences** for consciousness debates. I rank three lines, dismiss one as a dead end, flag one for conditional inclusion, and map dependencies.

  ### Ranking & Defense
  1.  **Scope Question (Generalization Paradox)**  
      **Why #1:** Highest upstream impact. If the paradox generalizes to *all* phenomenal judgments (including those motivating anti-physicalism), it threatens the foundational arguments for epiphenomenalism itself. This is the "snake eating its own tail" problem.  
      **Tractability:** Conceptual analysis of meta-arguments (e.g., conceivability/knowledge arguments) and historical/convergence patterns in philosophy of mind is feasible without experiments.  
      **Downstream Impact:**  
      - *If generalized:* Undermines all anti-physicalist arguments (zombies, knowledge argument), forcing retreat to illusionism or non-standard monism.  
      - *If contained:* Saves the dialectic, allowing focus on 1st-person warrant.  
      **Tests:** Perturbation test is central (e.g., "Would philosophical arguments change if phenomenal correlations broke?"). Grain test is less relevant here.  
      **Checkpoint:** A formal model showing how anti-physicalist arguments *must* (or need not) rely on causally efficacious phenomenology.

  2.  **Constitutive/Acquaintance Reply**  
      **Why #2:** Core to contemporary debates. Success/failure determines whether non-causal warrant is viable, shaping dualism vs. illusionism.  
      **Tractability:** Conceptual work on the metaphysics of acquaintance/phenomenal concepts (e.g., is it causal, grounding, or primitive?) is well-suited to philosophy.  
      **Downstream Impact:**  
      - *If viable:* Preserves warrant for dualism; blocks illusionism.  
      - *If failed:* Forces eliminativism or radical revision (e.g., panpsychism without causal efficacy).  
      **Tests:** Grain test is critical (can acquaintance discriminate fine-grained states?). Perturbation test reveals if acquaintance requires stable laws.  
      **Checkpoint:** A taxonomy of "acquaintance" relations in the literature, showing which survive epiphenomenalism.

  3.  **Common-Cause Reply**  
      **Why #3:** Directly addresses warrant via epistemology of reliability. Less explored but tractable, with power to reshape the dialectic.  
      **Tractability:** Conceptual work on modal robustness in epistemology (e.g., safety, sensitivity) applied to consciousness. No experiments needed.  
      **Downstream Impact:**  
      - *If reliability ≠ robustness:* Saves warrant for epiphenomenalism, undermining illusionism’s motivation.  
      - *If robustness required:* Forces illusionism or constitutive views.  
      **Tests:** Perturbation test is definitive (contingent correlation fails under modal pressure). Grain test is secondary.  
      **Checkpoint:** Engagement with externalist epistemology (e.g., consequences of reliabilism for phenomenal judgments).

  ### Dead Ends & Omissions
  - **Dead End: Tracking Reply**  
    The "surrogate problem" is fatal without resolving the *source* of correlation. Common-cause or constitutive replies must solve it first. Pursuing tracking alone is redundant.
    
  - **Omission: Evolutionary Debunking**  
    If phenomenal judgments are unwarranted, does evolutionary pressure to *report* states (even non-veridically) matter? This could extend the scope question but is downstream.

  ### Dependency Map (Prose)
  - **Start with Scope (Year 1):** Resolution here dictates the viability of the entire project. If generalization holds, constitutive/common-cause replies may be irrelevant (since all arguments are undermined).  
  - **Parallel Tracks (Year 2):**  
    - *Constitutive Reply* (if scope is contained)  
    - *Common-Cause Reply* (always relevant for warrant)  
    These can run concurrently; constitutive success may moot common-cause.  
  - **Downstream (Year 3):** Illusionism/eliminativism can be addressed *after* constitutive/common-cause fail, or scope generalization succeeds.  

  ### Settled vs. Contested
  - **Settled/Near-Settled:**  
    - The *existence* of the paradox is uncontroversial (Chalmers, Kriegel).  
    - Tracking requires explaining correlation (surrogate problem acknowledged).  
    - Illusionism requires explaining away phenomenal judgments (Frankish).  
  - **Genuinely Contested:**  
    - Whether acquaintance is causal (e.g., Campbell vs. Goff).  
    - Whether knowledge requires modal robustness (e.g., safety/sensitivity debates in epistemology).  
    - Scope generalization (your "diachronic/argumentative" worry is underexplored).  
  - **Out on a Limb:**  
    - Prioritizing scope generalization over constitutive replies is unconventional but justified by its nuclear implications.  
    - Treating common-cause as viable is speculative (few defend it) but tractable.  

  ### What Moves the Needle
  - **Scope Up:** A formal proof that anti-physicalist arguments *depend* on efficacious phenomenology.  
  - **Scope Down:** Showing the paradox only applies to 1st-person reports.  
  - **Constitutive Up:** A non-circular account of non-causal acquaintance.  
  - **Constitutive Down:** Demonstrating acquaintance fails the grain test (e.g., cannot discriminate fine states).  
  - **Common-Cause Up:** Epistemologists conceding reliability ≠ robustness for self-knowledge.  
  - **Common-Cause Down:** Consensus that knowledge requires counterfactual sensitivity.  

  ### Final Agenda
  1. **Year 1:** Scope generalization (argumentative arm).  
  2. **Year 2:** Constitutive reply (acquaintance metaphysics) + Common-cause (modal robustness).  
  3. **Year 3:** Synthesis + downstream consequences (e.g., if all fail, defend illusionism).  

  This maximizes impact: if scope generalization holds, it revolutionizes the field; if not, constitutive/common-cause can secure warrant or force eliminativism. All paths yield high-value conclusions.
