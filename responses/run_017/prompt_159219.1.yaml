prompt: |-
  Looking for a consistency check on where I've landed while putting together a small benchmark of Bongard problems (twelve little pictures, six on the left that share some property, six on the right that lack it, and the job is to find the rule). Here's the set:

  (1) Whether a system has got the concept is settled by whether it generalises to new figures; whether it can say the rule out loud in words is irrelevant.
  (2) Each problem has one intended rule, and a system that locks onto some other rule that also fits all twelve pictures has got it wrong, not merely found an equally good answer.
  (3) The general way to make which rule precise is a simplicity / minimum-description-length prior: prefer the shortest consistent description.
  (4) The left-right structure is doing real work, and the right-hand figures should be produced by negating the intended rule rather than sampled independently.
  (5) What I actually want to measure is compositionality: whether the system recombines primitives — counting, containment, symmetry, contact — in combinations that never showed up in training.
  (6) Hand-written problems are curated and leak, so everything should be procedurally generated at scale.

  The case that made me nervous: the way my generator builds the two classes, positives come out with two shapes and negatives with three, so there are exactly two shapes classifies all twelve correctly, is shorter than the intended rule (something like one shape is inside another), and agrees with it on every figure the generator can emit, but comes apart the moment a human draws three nested circles. I've started calling these shadow rules and I've been marking solvers that use them as wrong, but I'm not sure that's consistent with the rest.

  Go through (1)-(6): which pairs genuinely collide, which only look like they do, and what's the cheapest thing to drop and what does dropping it cost me? Rank the real tensions by severity instead of flagging everything, and tell me which single commitment has to give.
reasoning: |-
  Okay, the user is working on creating a benchmark for Bongard problems and is concerned about "shadow rules." They've outlined six principles for their benchmark and are worried that a generator might create a shadow rule (like "exactly two shapes") that fits all examples but isn't the intended rule (like "one shape inside another"). They want to check for consistency among their principles and figure out which one might need to be adjusted.

  First, I need to understand each of their points. Point (1) emphasizes that generalization is key, not verbalizing the rule. (2) insists there's only one correct rule, even if another fits. (3) uses simplicity/MDL to determine the rule. (4) says negatives are generated by negating the rule, not independently. (5) focuses on compositionality of primitives. (6) wants procedural generation to avoid leaks.

  The main issue is the shadow rule: the generator's output accidentally makes a different rule (like having exactly two shapes) fit all examples because of how it's built. But this rule breaks with human-drawn examples (like three nested circles). The user marks solvers using the shadow rule as wrong, but they're unsure if this conflicts with their other principles.

  Looking at conflicts: (2) and (3) are in tension because MDL might pick the shadow rule if it's shorter. But the user wants the intended rule to be correct. (4) and (6) together cause shadow rules because generating negatives by negation leads to accidental regularities. (5) is about compositionality, but shadow rules might not involve primitives, so they might not test recombination well.

  (1) and (2) also conflict because generalization to new figures might validate the shadow rule if the generator can't produce counterexamples, but the user wants it to fail on human examples. 

  The core tension is between (2), (4), and (6). (4) and (6) together create shadow rules, and (2) insists on the intended rule. To fix this, the cheapest change might be to relax (4) by allowing some independent negative sampling. This would introduce more variety, breaking shadow rules without losing compositionality or scalability. Dropping (6) would lose scalability, which is crucial for the benchmark. Relaxing (2) would allow multiple correct rules, but the user wants to measure if systems find the specific compositional rule.

  The user's deeper need is probably to measure compositional generalization reliably. They might not have considered that procedural generation with strict negation causes these artifacts. They might also need to ensure that the benchmark tests robust understanding, not just fitting the generated set. So the recommendation is to adjust how negatives are generated to avoid unintended regularities while keeping procedural generation.
answer: |-
  Based on your principles (1)-(6), the tension with "shadow rules" is a direct consequence of the interaction between **(4)** and **(6)**, exacerbated by **(2)** and **(3)**. Here's a breakdown of the conflicts, their severity, and the most strategic adjustment:

  **Core Conflict Analysis (Ranked by Severity):**

  1.  **🟥 HIGH SEVERITY: (4) + (6) -> Shadow Rules (vs. 2 & 3)**
      *   **Conflict:** Procedurally generating negatives *strictly* by negating the intended rule (e.g., `NOT(ShapeInsideAnother)`) **guarantees** accidental regularities in the negative class. Your generator's output (2 shapes vs. 3 shapes) is a perfect example. This artifact becomes the MDL-shortest rule (`NumShapes == 2` vs `NumShapes == 3`), satisfying (3) and fitting all 12 images, violating (2). It also trivializes (5) as the shadow rule isn't compositional.
      *   **Why Severe?** This undermines the core goal (5 - compositionality) and makes (2 - single intended rule) unenforceable within the generated set. (1 - generalization) becomes ambiguous: the shadow rule *does* generalize perfectly *to images the generator creates using the same flawed negation process*, but fails catastrophically on human-like variations (3 nested circles). Your intuition about "marking solvers that use them as wrong" is *correct* based on (2) & (5), but it highlights the inherent flaw in (4)+(6).

  2.  **🟧 MEDIUM SEVERITY: (2) vs (3) in the presence of Shadow Rules**
      *   **Conflict:** MDL (3) will *always* prefer the shadow rule (`NumShapes==2`) over the intended compositional rule (`ShapeInsideAnother`) if the shadow rule is shorter/equally consistent. This directly contradicts (2), which insists the intended rule is the *only* correct one.
      *   **Why Medium?** This conflict is *secondary*; it's a consequence of the primary conflict above. Without the artifact introduced by (4)+(6), MDL could plausibly select the intended compositional rule. Fixing the primary conflict alleviates this one significantly.

  3.  **🟩 LOW SEVERITY / APPARENT CONFLICTS:**
      *   **(1) vs (2):** Seems like a conflict (shouldn't any consistent rule be valid if it generalizes?). However, your clarification in (2) resolves this: the benchmark defines "correct generalization" *as* locking onto the *intended* rule. A system finding a shadow rule *doesn't* generalize correctly in the intended sense (as per your 3 nested circles example), so failing (1) by your definition.
      *   **(5) vs Others:** Compositionality (5) is your *goal*, not inherently conflicting. The conflicts arise from *how* you generate data to measure it. Shadow rules prevent measuring (5).
      *   **(3) Standalone:** MDL is a reasonable *tool* for defining the intended rule *if the data doesn't contain artifacts*. The problem is the data artifact, not MDL itself.

  **The Commitment That Must Give: Relax (4)**

  *   **Cheapest Adjustment:** Modify **(4)** from "negating the intended rule" to **"negating the intended rule *plus* introducing controlled independent variation."**
  *   **How it Works:** Generate negatives primarily by `NOT(Rule)`, but *intentionally break* the accidental regularities (like fixed shape count) introduced by the negation process. For your nested shapes example:
      *   **Intended Rule:** `ShapeInsideAnother`
      *   **Negation (`NOT(Rule)`):** `NoShapeInsideAnother`. This *could* generate:
          *   Disjoint shapes (1, 2, or 3+).
          *   Touching shapes.
          *   Single shapes.
          *   Shapes "contained" only by the image boundary.
      *   **Crucially:** Vary the *number* of shapes independently within the negative class. Include negatives with exactly 2 shapes that are disjoint/touching/single-contained-by-boundary, negatives with 1 shape, negatives with 3+ disjoint shapes, etc. This explicitly breaks the `NumShapes==2` shadow rule.
  *   **Cost of Dropping Strict (4):**
      *   **Minor Increase in Complexity:** Generator logic needs to ensure negatives satisfy `NOT(Rule)` *while also* avoiding specific low-complexity artifacts (like uniform shape count). This requires careful constraint definition.
      *   **Slightly Less "Pure" Negation:** Negatives aren't *solely* defined by `NOT(Rule)`; they have an extra diversity constraint. However, they *still fundamentally* lack the core property.
  *   **Benefits:**
      *   **Eliminates Shadow Rules:** Rules like `NumShapes==2` become inconsistent immediately (some negatives have 2 shapes).
      *   **Preserves (6):** Full procedural generation remains possible *and* becomes more robust.
      *   **Strengthens (2) & (3):** The intended compositional rule becomes the clear MDL-optimal solution *within the generated set*. A solver finding it is unambiguously correct.
      *   **Enables (1) & (5):** Generalization now truly tests understanding the compositional rule, not an artifact. Measuring compositional recombination becomes valid.
      *   **Maintains Core Intent:** The left/right contrast still highlights the *core* property (`Rule` vs `NOT(Rule)`), just without the spurious correlation.

  **Why NOT Drop Other Commitments?**

  *   **Drop (2) (Allow multiple rules):** Destroys the benchmark's purpose. You want to measure if systems find the *specific compositional abstraction*, not just any correlation. Shadow rules are bad solutions.
  *   **Drop (3) (Abandon MDL):** Leaves "intended rule" undefined and subjective. MDL is fundamentally sound; the data is the problem.
  *   **Drop (5) (Compositionality Goal):** Defeats the entire point of your benchmark.
  *   **Drop (6) (Procedural Generation):** Loses scalability and invites curation bias/leakage. Makes large-scale benchmarking impractical.
  *   **Drop (1) (Require Verbalization):** You explicitly reject this; it's not in your principles.

  **Recommendation:**

  **Relax Principle (4).** Generate negatives by `NOT(IntendedRule)` **but explicitly design the generator to avoid introducing low-complexity spurious correlations (like uniform shape counts, specific colors, grid positions, etc.) across the positive or negative class.** Inject independent variation specifically to break potential shadow rules. This is the minimal change with the highest payoff, preserving the core goals (1, 2, 3, 5, 6) while eliminating the crippling flaw exposed by shadow rules. The cost is slightly more sophisticated procedural generation, which is a necessary investment for a valid benchmark. Your instinct to mark shadow-rule solvers as wrong is correct; this fix makes the benchmark itself robust against them.
