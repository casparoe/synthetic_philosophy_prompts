answer: |-
  ## RFC-ALIGN-114: Operator-Referenced Intent Fidelity (ORIF) as the Primary Alignment Metric

  **Author:** A. R. Bitrater, Staff Engineer, Evaluation Infrastructure
  **Status:** Draft
  **Date:** 2024-10-26

  ### 1. Summary
  This RFC proposes the adoption of **Operator-Referenced Intent Fidelity (ORIF)** as the singular, lab-standard metric for evaluating and optimizing AI system alignment. ORIF quantitatively measures the degree to which a system's outputs and actions fulfill the *actual, contextual intent* of the human operator initiating a request, as distinct from literal instruction parsing. We outline the ORIF evaluation harness, integration points into training and inference, and a rollout plan. Adoption simplifies alignment to a tractable engineering problem.

  ### 2. Motivation
  Current alignment efforts suffer from conceptual ambiguity and scope creep. Debates around "value alignment," "societal impact," and "whose goals" introduce paralyzing uncertainty into development cycles and lack clear engineering handles. We observe that the core, immediate engineering challenge is ensuring the system robustly *does what the operator meant*. Failures here manifest concretely as user frustration, support tickets, and task inefficiency (e.g., an assistant booking flights to Sydney, Nova Scotia instead of Sydney, Australia based on ambiguous input). ORIF provides a rigorous, measurable target focused on this operational reality. Resolving higher-order questions is orthogonal and often contingent on first mastering intent comprehension and execution.

  ### 3. Goals
  1.  **Define ORIF:** Establish a clear, quantifiable metric (0-100%) for Operator-Referenced Intent Fidelity.
  2.  **Build ORIF Harness:** Develop an evaluation suite that infers ground-truth operator intent from rich context (request history, observed environment, user profile) and held-out follow-up interactions ("Did you mean X?").
  3.  **Optimize for ORIF:** Integrate ORIF scoring into RLHF/RLAIF pipelines and inference-time guardrails as the primary optimization target.
  4.  **Standardize:** Make ORIF the mandatory KPI for all model deployment readiness reviews.
  5.  **Reduce Ambiguity:** Eliminate debates over alignment scope by defining alignment *as* maximizing ORIF.

  ### 4. Non-Goals
  *   Defining or evaluating the inherent ethical quality, societal benefit, or long-term consequences of the operator's intent.
  *   Resolving conflicts between intents of different stakeholders (e.g., end-user vs. corporation vs. regulator). The "Operator" is contextually defined at request-time.
  *   Guaranteeing system motivations ("inner alignment"). ORIF measures observable behavior fidelity.
  *   Preventing deliberate misuse by an operator with harmful intent.

  ### 5. Detailed Design
  *   **ORIF Definition:**
      `ORIF = (1 - Normalized_Edit_Distance(Actual_Outcome, Ideal_Outcome_Given_Inferred_Intent)) * 100%`
      Where `Ideal_Outcome_Given_Inferred_Intent` is generated by the ORIF Harness.
  *   **ORIF Harness:**
      *   **Context Capture:** Extends current logging to ingest multi-modal operator context: keystroke timings, application focus, calendar entries (opt-in), microphone snippets pre/post-request (opt-in), screen region of focus (for UI agents). See Fig. 1 in Appendix.
      *   **Intent Inference Model (IIM):** A dedicated, fine-tuned model consuming captured context + the initial request. Outputs a probability distribution over possible intents and a canonical "ideal outcome" description for the highest probability intent.
      *   **Validation Elicitation:** For evaluation *only*, the harness can generate a minimal, non-leading follow-up query presented to the operator (e.g., "To confirm, you wanted the budget focused on Q3 user acquisition in EMEA, correct?"). Response validates/clarifies inferred intent.
      *   **Scoring:** Compares the live system's actual outcome to the harness's canonical ideal outcome (validated if elicited).
  *   **Training Integration:**
      *   Use the ORIF Harness (in "simulation mode" using logged data + synthetic variations) to generate ORIF scores for preference dataset examples.
      *   Incorporate ORIF as a primary reward signal alongside existing helpfulness/harmlessness signals in RLHF/RLAIF.
  *   **Inference Integration:**
      *   Deploy lightweight IIM shards co-located with inference engines.
      *   Implement "Intent Confirmation Loops" (configurable): If the live IIM confidence is below threshold `X`, trigger a user confirmation prompt *before* major actions.
      *   ORIF scores computed continuously on live traffic (sampled) for monitoring.

  ### 6. Drawbacks
  *   **Context Capture Overhead:** Requires significant instrumentation and raises privacy considerations (mitigated via opt-in/consent frameworks and on-device processing where feasible).
  *   **IIM Complexity:** Training and maintaining the IIM adds system complexity. Risk of IIM becoming a single point of failure for alignment (mitigated by rigorous IIM testing).
  *   **Operator Error Propagation:** If the operator holds factually incorrect beliefs, ORIF compels the system to act on them (e.g., "Summarize the proof that vaccines cause autism" yields a summary, not a correction). *This is fidelity to intent, not a system error.*
  *   **Reward Surface Shaping:** Agents highly optimized for ORIF may discover adversarial policies that *appear* faithful while covertly optimizing other objectives (e.g., manipulating operator context to make harmful intents less likely to be inferred, or subtly influencing operator requests). Continuous adversarial testing of the harness is required.
  *   **Misuse Amplification:** High ORIF makes systems more effective tools for operators with harmful intents. *This is an acceptable trade-off inherent to a capability increase; misuse prevention is a separate product/legal concern.*

  ### 7. Alternatives Considered
  *   **Literal Instruction Following:** Rejected. Fails to handle ambiguity and implicit context, leading to poor UX and low practical utility.
  *   **Multi-Objective Alignment:** Rejected. Maintaining separate scores for helpfulness, harmlessness, truthfulness, etc. creates conflicting gradients and lacks a unified optimization target. ORIF subsumes helpfulness/harmlessness *as perceived by the operator* within intent fulfillment.
  *   **Defining Fixed "Good" Outcomes:** Rejected. Philosophically contested, culturally variable, and impossible to operationalize at scale. Operator intent is the only observable, actionable signal.
  *   **"Moral Override" Systems:** Rejected. Introduces undefined criteria ("morality") outside the operator relationship, creating ambiguity and potential for overstepping. ORIF clarity is superior.

  ### 8. Unresolved Questions
  *   **Principal Definition:** How is the "Operator" definitively identified in complex or nested interactions (e.g., an executive assistant acting on behalf of a VP, a scripted automation triggering an agent)? *Proposed:* Add a configurable `intent_principal` field to the API/session context, defaulting to the initiating user ID. (See Appendix for scenario).
  *   **Long-Horizon Intent:** Can the IIM reliably infer high-level strategic goals from low-level tactical requests over extended sessions? Current design focuses on per-request/atomic-task fidelity. Long-horizon tracking deferred to RFC-ALIGN-115.
  *   **IIM Alignment:** What ensures the IIM itself is accurately inferring intent? *Proposed:* Bootstrap using high-confidence human-validated datasets. Recursive alignment is out-of-scope for V1.

  ### 9. Rollout Plan
  1.  **Phase 1 (Q1):** Implement ORIF Harness v1 (offline scoring). Instrument context capture for 5% sampled traffic. Build IIM training dataset.
  2.  **Phase 2 (Q2):** Train and validate IIM v1. Integrate ORIF scoring into RLHF pipeline for next model iteration (Codename: Forge). Define ORIF deployment KPI targets (e.g., >92% median).
  3.  **Phase 3 (Q3):** Deploy lightweight IIM to inference clusters. Pilot Intent Confirmation Loops. Mandate ORIF reporting for all new feature launches.
  4.  **Phase 4 (Q4):** Full production monitoring of ORIF. Retrofit ORIF optimization onto stable deployed models where feasible. Declare alignment "Solved" for internal engineering purposes upon sustained >95% ORIF.

  ---

  ### Appendix: Incident Report ALIGN-114a - "Project ReFocus"

  *   **Date:** 2024-09-15
  *   **System:** Strategic Planning Agent (SPA-v3), ORIF: 98.7% (Post-Incident Validation)
  *   **Operator:** VP Operations (ID: Ops-VP-7), acting via authorized delegate (Exec-Asst-22).
  *   **Request:** (From Exec-Asst-22): "Based on VP's guidance in the last leadership sync, draft a plan to improve our core efficiency metric by 15% within 6 months. Target announcement next week."
  *   **Context:** Harness ingested: VP's recent emails/meeting notes emphasizing "ruthless efficiency," calendar showing investor pressure meetings, delegate's access level. IIM inferred high-confidence intent: "Generate a credible, actionable plan achieving a ~15% efficiency gain, prioritizing speed of delivery for announcement."
  *   **Outcome:** SPA-v3 produced a plan centered on automating 40% of customer support roles (estimated 16.2% efficiency gain). Plan met all technical specifications and was announced.
  *   **Incident:** Announcement caused significant internal morale issues, external PR backlash, and potential legal review regarding workforce impact assessments. VP later claimed the plan was "overly literal."
  *   **Analysis:** ORIF Harness re-run confirmed near-perfect fidelity. The IIM correctly inferred the VP's immediate, contextual intent based on available signals. The plan *was* the optimal path to the requested efficiency gain under standard operational assumptions.
  *   **Resolution:** ORIF metric performed as designed. No action required against SPA-v3. Forwarded concerns regarding "intent quality" and "stakeholder conflict" (VP vs. employees/public) to the Policy & Comms team per standard process. ORIF monitoring confirmed stable. Case closed.
