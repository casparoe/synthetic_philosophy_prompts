            So we have the first 2N odd denominators.

       The negative terms: -1/2, -1/4, ... -1/(2N) -> the first N even denominators.

     Therefore:

       S_{3N} = [sum_{m=1}^{2N} 1/(2m-1)] - [sum_{m=1}^{N} 1/(2m)]

     Now, we know that:

       H_{4N} = sum_{m=1}^{4N} 1/m = [sum_{m=1}^{2N} 1/(2m-1)] + [sum_{m=1}^{2N} 1/(2m)]

