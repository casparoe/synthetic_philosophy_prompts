          Therefore, when we order by absolute payoff, we can break the ties arbitrarily, but then we must also choose the order of the other terms. If we choose the natural order after the tie, we get the natural series. But if we choose a different order (like grouping two positives then one negative) we get a different sum.

          So the answer to the final question: if we order by increasing |payoff| and then within the same |payoff| we choose an arbitrary order, and then for the rest we choose an arbitrary order, we can get any real number. 

          But if we fix the order within the same |payoff| arbitrarily and then fix the rest in the natural order, we might get a specific value? Not necessarily, because the natural order by n is not the same as the order by |payoff|. The order by |payoff| groups together different n's. 

          Actually, the order by |payoff| is: 
            |payoff| = 2: n=1, n=2
            |payoff| = 8/3: n=3
            |payoff| = 4: n=4
            |payoff|=32/5: n=5
            |payoff|=32/3: n=6
            |payoff|=128/7: n=7, etc.

          So we have blocks: 
            Block1: |payoff|=2: two outcomes: n=1 and n=2.
            Block2: |payoff|=8/3: one outcome: n=3.
            Block3: |payoff|=4: one outcome: n=4.
            Block4: |payoff|=32/5: one outcome: n=5.
            Block5: |payoff|=32/3: one outcome: n=6.
            ...

          Now, within block1, we can choose the order: either (n1, n2) or (n2, n1). But as we saw, swapping two adjacent terms doesn't change the sum. However, if we then put block2 (n=3) next, then block3 (n=4), etc., we get the natural order? Not exactly: the natural order is n1, n2, n3, n4, ... and our order is block1 (which is n1 and n2 in some order) then n3, then n4, then n5, etc. So essentially the same as the natural order. Therefore, the sum would be ln2.

          But if we break the order by, say, after block1 (n1 and n2) we skip block2 and take block3 (n=4) next, then block2 (n=3), then block4 (n=5), then block5 (n=6), etc., then we have a rearrangement that moves n=3 after n=4. And that might change the sum. 

          Specifically, we have: 
            Block1: n1 and n2 (order arbitrary, say n1 then n2: 2, -2 -> sum0)
            Then n4: -4
            Then n3: 8/3
            Then n5: 32/5
            Then n6: -32/3
            ...

          Now the series: 2 -2 -4 + 8/3 + 32/5 -32/3 + ... 
          = 0 -4 + 8/3 + 32/5 -32/3 + ... 
          = -4 + 8/3 + 32/5 -32/3 + ... 

          This is a rearrangement that moves n=4 before n=3. And we know that moving a term arbitrarily can change the sum arbitrarily. 

          Therefore, by ordering by |payoff| and then breaking ties arbitrarily and then ordering the blocks arbitrarily, we can get any real number.

     So the final question does the work: it forces the student to see that even when we order by a natural feature (the size of the payoff), we still have to make arbitrary choices that lead to different expectations.

     We conclude: the expectation is not well-defined for this game without an order, and the choice of order is a modeling decision that reflects our risk attitude.

  Total: 75 minutes, leaving 5 minutes for questions.
