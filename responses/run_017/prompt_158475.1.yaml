  We are teaching the Pasadena game to students with one semester of probability, no real analysis background. The goal is to show that the expected value is not well-defined without specifying the order of summation, and that we have to make a choice (which is like a risk attitude) to get a specific value.

  Components and Order:

  1. **Introduce the game and compute expectation naively (in natural order):**
     - Fair coin, tossed until first heads on toss n, payoff = (-1)^{n-1} * 2^n / n.
     - The natural order: n=1: 2, n=2: -2, n=3: 8/3, n=4: -4, etc.
     - Write the series: 2 - 2 + 8/3 - 4 + ... but note that the terms are a_n = (-1)^{n-1} * 2^n / n.
     - However, the series in the natural order is: sum_{n=1}^∞ (-1)^{n-1} * 2^n / n.
     - But wait: 2^n grows without bound, so the terms don't go to zero. Actually, they grow in absolute value! So the series does not converge absolutely. However, we are going to consider conditional convergence.

     But note: the series 1 - 1/2 + 1/3 - 1/4 + ... is the alternating harmonic series, which converges to ln2. However, our series is different: it is 2 - 2 + 8/3 - 4 + ... which is not the same. Actually, the series for the Pasadena game is:

     a_1 = (-1)^0 * 2^1 / 1 = 2
     a_2 = (-1)^1 * 2^2 / 2 = -4/2 = -2
     a_3 = (-1)^2 * 2^3 / 3 = 8/3
     a_4 = (-1)^3 * 2^4 / 4 = -16/4 = -4
     a_5 = 32/5, a_6 = -64/6 = -32/3, etc.

     The absolute values are growing: |a_n| = 2^n / n -> ∞. So the series does not converge absolutely, and in fact, the terms do not go to zero. However, we must note that the probabilities also come in: the probability of the first head at trial n is (1/2)^n.

     Correction: The expectation is the sum over n of [probability of outcome n] * [payoff for outcome n]. The probability of outcome n (first head at n) is (1/2)^n. Therefore, the expectation is:

     E = sum_{n=1}^∞ [ (1/2)^n ] * [ (-1)^{n-1} * 2^n / n ]
       = sum_{n=1}^∞ (-1)^{n-1} * (1/2)^n * 2^n / n
       = sum_{n=1}^∞ (-1)^{n-1} * (1) / n
       = 1 - 1/2 + 1/3 - 1/4 + ... = ln(2).

     So the expectation in the natural order (by n) is the alternating harmonic series, which converges to ln2.

     However, note: the terms of the alternating harmonic series are decreasing to zero, but the original payoff terms (without the probability) are not. The key is that we are multiplying by the probability (1/2)^n, which tames the 2^n.

     So the first component: the expectation as a series is conditionally convergent (it converges, but not absolutely) because the absolute series would be the harmonic series: sum 1/n, which diverges.

  2. **The problem: Rearrangement can change the sum.**
     - We must explain that if a series is conditionally convergent, then it can be rearranged to sum to any real number (Riemann rearrangement theorem). But we cannot prove that theorem, so we give an example.

     Example: the alternating harmonic series. We know it converges to ln2. Now rearrange it as: take positive terms until the partial sum is above 3/2 ln2, then negative until below, then positive again, etc. But that's complicated. Instead, use the classic rearrangement:

       Take positive terms: 1, 1/3, 1/5, ... and negative terms: -1/2, -1/4, -1/6, ...

     Now consider the rearrangement:

       1 + 1/3 - 1/2 + 1/5 + 1/7 - 1/4 + 1/9 + 1/11 - 1/6 + ...

     This rearrangement groups the terms in blocks of two positive and one negative. Specifically:

       Block 1: 1, 1/3, -1/2
       Block 2: 1/5, 1/7, -1/4
       Block 3: 1/9, 1/11, -1/6
       ...

     How does this sum? We can compute the sum of the k-th block:

       Let the k-th block be: 1/(4k-3) + 1/(4k-1) - 1/(2k)

     We then sum over k.

     Alternatively, we can use the known result that this rearrangement sums to (3/2) ln2. We can show this by noting:

       The alternating harmonic series: ln2 = 1 - 1/2 + 1/3 - 1/4 + ... 
       The rearranged series: S = (1 + 1/3 - 1/2) + (1/5 + 1/7 - 1/4) + ...

     We can write S as the sum of two series: one of positive terms taken in the order of the rearrangement and one of negative terms. However, a simpler way is to note that the rearranged series is:

       [1 + 1/3 + 1/5 + ...] - [1/2 + 1/4 + 1/6 + ...] + [additional positive terms?] 

     Actually, the positive terms are all the odd denominators, but in blocks we are taking two positive then one negative. The negative terms are the even denominators, but only half of them? Actually, we are taking every even denominator but in the order of the even denominators? 

     Alternatively, we can express the rearranged series as:

       S = [1 + 1/3 - 1/2] + [1/5 + 1/7 - 1/4] + ... 
          = (1 - 1/2 + 1/3) + (1/5 - 1/4 + 1/7) + ... 

     But note: this is not the same as the original alternating series. We can compute the partial sums for the first 3N terms:

       S_{3N} = sum_{k=1}^N [1/(4k-3) + 1/(4k-1) - 1/(2k)]

     We can compare this to the harmonic series. We know:

       H_m = 1 + 1/2 + 1/3 + ... + 1/m ≈ ln m + γ.

     Now, note:

       The positive terms in the first 3N terms: 
          k=1 to N: 1/(4k-3) and 1/(4k-1) -> these are the terms with denominators 1,3,5,...,4N-3,4N-1? Actually, we have denominators: 
            For k=1: 1, 3
            For k=2: 5,7
            ... 
            So we have the first 2N odd denominators? But the odd denominators go up to 4N-1, which is the (2N)-th odd number? Actually, the n-th odd number is 2n-1. So the odd denominators we have are: 
