  ### Teaching Plan for the Pasadena Game (80-Minute Session)

  #### **1. Order of Components and Why Swapping Breaks Understanding**
  The sequence below ensures students build intuition step-by-step. Swapping components risks conflating key concepts (e.g., discussing rearrangement before conditional convergence may trivialize the paradox as a "trick").

  | **Order** | **Component** | **Why Sequence Matters** |
  |-----------|---------------|--------------------------|
  | **1** | Compute expectation in natural order (by toss count `n`):<br>• Payoff: `(-1)^{n-1}·2^n/n`<br>• Probability: `(1/2)^n`<br>• Sum: `∑_{n=1}^∞ [(-1)^{n-1}/n] = ln 2` | Establishes baseline. Students see a finite expectation initially. |
  | **2** | Show conditional convergence:<br>• Absolute series: `∑_{n=1}^∞ 1/n` (harmonic series) diverges.<br>• Without absolute convergence, "adds up to something finite" isn't enough. | **Critical point:** Absolute/conditional distinction enters here. If swapped with #3, students miss *why* rearrangement is a problem (it’s not just "infinity is weird"). |
  | **3** | Demonstrate rearrangement:<br>• Use your candidate: `1 + 1/3 - 1/2 + 1/5 + 1/7 - 1/4 + ... = (3/2)ln 2`<br>• Explain *how* terms are reordered (not algebraic manipulation). | Shows the *same terms* sum to a different value. If done before #2, students dismiss it as a "trick." |
  | **4** | Connect to expected value:<br>• Rearrangement = reordering *outcomes* (e.g., paying out large losses first).<br>• Natural order isn’t sacred; any order is mathematically legal. | Links math to decision theory. If swapped with #5, students cling to "order is fixed by the game." |
  | **5** | Address misconceptions (see section 3 below). | Resolves intuitive objections *after* groundwork is laid. |

  #### **2. The Example to Carry the Session**
  **Your candidate (`1 + 1/3 - 1/2 + ... = (3/2)ln 2`) is ideal, with two tweaks:**
  - **Properties needed:**
    - Visually intuitive pattern (2 positive, 1 negative terms).
    - Explicit connection to payoffs: Map terms to `n` (e.g., `1` = payoff for `n=1`, `-1/2` = payoff for `n=2`, etc.).
    - **Crucial:** Emphasize these are *the same payoffs/probabilities* as the natural order. Rearrangement changes the *sequence of summation*, not the game.
  - **Why it avoids "filing under tricks":**
    - Frame it as: "What if a casino pays wins/losses in size-based batches, not chronologically?" This forces students to see expected value as dependent on *how outcomes are aggregated*.
    - Contrast with St. Petersburg: Here, partial sums *stabilize* in one order (ln 2) but *not in another* (→(3/2)ln 2), proving the issue isn’t divergence.

  #### **3. Misconceptions and When to Head Them Off**
  Address these in the order they typically arise:

  | **Misconception** | **When to Address** | **How to Head Off** |
  |-------------------|---------------------|---------------------|
  | **"Just bound utility; it’s St. Petersburg again."** | After computing `ln 2` (component #1). | • "In St. Petersburg, the issue is *divergence*; here, it’s *order-dependence*. Bounding utility forces absolute convergence, fixing both. But without it, conditional convergence breaks uniqueness." |
  | **"No casino can pay, so truncate the tail."** | After rearrangement (component #3). | • "Truncation *does* fix the problem (finite sums are order-invariant). But for the *infinite* game, where do we truncate? At `n=100`, `E≈0.69`; at `n=101`, it jumps. The ‘true’ expectation is undefined." |
  | **"The order is fixed by the game; rearrangements are cheating."** | After connecting to expected value (component #4). | • "The game defines *outcomes*, not the *order we sum them*. Mathematically, a countable set has no intrinsic order. If we sum by payout size (e.g., large losses first), that’s a valid choice—but it changes the expectation." |

  #### **4. What to Openly Decline to Settle**
  - **"We won’t resolve which order is ‘correct.’"**  
    This is a normative choice (like risk aversion), not a mathematical truth.
  - **"We won’t dive into measure theory."**  
    At this level, we lack tools to define expectation without order (e.g., via absolute convergence).
  - **"We’ll avoid convergence proofs."**  
    Accept Riemann’s rearrangement theorem as a fact; focus on implications.

  #### **5. Final Question to Assess Understanding**
  **Your candidate: *"What is the expectation if outcomes are indexed by payout size (e.g., smallest |payoff| first)?"***  
  - **Why it works:**  
    - A student who "gets it" will say:  
      "It depends! Ordering by |payoff| groups `n=1` and `n=2` (both |payoff|=2), but we must choose which comes first. If `n=1` (win) comes before `n=2` (loss), partial sums start positive. If reversed, they start negative. The tail diverges under rearrangement, so we can get any value."  
    - A student who doesn’t will say:  
      "It’s ln 2, because it’s the same terms" (misses order-dependence) or "Infinity is weird" (superficial).  
  - **Refines the lesson:** Forces students to see that even a "natural" reordering (by size) requires arbitrary choices.

  ---

  ### **Staging the Key Insight: Expected Value as a Discounted Risk Attitude**
  - **When to introduce:** After addressing misconceptions (post-component #5).  
  - **How to phrase it:**  
    1. **Start with analogy:**  
       "Choosing an order/truncation/principal value is like choosing how to *discount* extreme tail risks. If you put large losses first, you’re ‘frontloading’ risk (pessimism). If you put large wins first, you’re optimistic. This isn’t discovering a number—it’s importing your risk attitude."  
    2. **Clarify scope:**  
       "This doesn’t mean expected value is *always* arbitrary. If utility is bounded or the series converges absolutely, the order doesn’t matter. But here, your choice of order reflects how you weigh low-probability, high-stakes events."  
    3. **Avoid fatalism:**  
       "We’re not saying ‘anything goes.’ We’re saying that for this game, defining expectation requires an *additional choice* about tail behavior. In practice, we might choose an order that aligns with our risk tolerance."

  ---

  ### **Timeline for 80-Minute Session**
  | **Time** | **Activity** |
  |----------|--------------|
  | 0-10 min | Compute expectation in natural order (`ln 2`). |
  | 10-20 min | Show conditional convergence (harmonic series divergence). |
  | 20-35 min | Rearrangement example (`(3/2)ln 2`) and tie to payoffs. |
  | 35-45 min | Explain order-dependence in expected value (outcome aggregation). |
  | 45-60 min | Address misconceptions (St. Pete, truncation, "fixed order"). |
  | 60-70 min | Introduce risk-attitude insight and decline to resolve ambiguity. |
  | 70-75 min | Pose final question; discuss answers. |
  | 75-80 min | Wrap-up: "Expected value requires absolute convergence for uniqueness." |
