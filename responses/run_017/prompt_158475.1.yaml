          But wait: the negative part is sum_{m=1}^N 1/(2m) = (1/2) H_N.

          So:

            S_{3N} = H_{4N} - (1/2) H_{2N} - (1/2) H_N

     Now, H_{4N} ≈ ln(4N) + γ, H_{2N} ≈ ln(2N) + γ, H_N ≈ ln(N) + γ.

     Thus:

          S_{3N} ≈ [ln(4N)+γ] - (1/2)[ln(2N)+γ] - (1/2)[ln(N)+γ]
                  = ln(4N) - (1/2) ln(2N) - (1/2) ln(N) + γ [1 - 1/2 - 1/2] 
                  = ln(4N) - (1/2) ln(2N) - (1/2) ln(N)
                  = ln(4) + ln(N) - (1/2)[ln(2)+ln(N)] - (1/2) ln(N)
                  = 2*ln(2) + ln(N) - (1/2) ln(2) - (1/2) ln(N) - (1/2) ln(N)
                  = (2 - 1/2) ln(2) 
                  = (3/2) ln(2)

     Therefore, the limit is (3/2) ln(2).

     So the example: the same terms rearranged sum to a different number.

     But note: in the Pasadena game, the natural order (by n) gives ln2, but if we rearrange the terms (i.e., change the order in which we consider the outcomes) we get a different expectation. However, the outcomes are naturally ordered by the number of tosses. So why would we rearrange? 

     The point: the expectation is defined as a sum over the outcomes, but when the series is conditionally convergent, the value depends on the order of summation. The natural order is the order of n (the trial number), but we can imagine a different order. For instance, a casino might pay out in a different order. But the real issue is that the definition of expected value requires a well-defined sum. Without absolute convergence, the sum is order-dependent.

  3. **Addressing misconceptions:**
     a) "Just bound utility, it is St. Petersburg again."
          - In St. Petersburg, the problem was that the expectation diverges, and we fixed it by bounding utility. Here, the series converges conditionally, so the expectation exists in the natural order, but we are showing that if we rearrange the terms we get a different value. Bounding utility would make the series absolutely convergent (because if utility is bounded, then the payoffs are bounded, and then the series would converge absolutely). But in the Pasadena game, the payoffs are unbounded (in absolute value). So if we bound utility, we get an absolutely convergent series and the problem goes away. But note: without bounding utility, we have conditional convergence and the problem of rearrangement. So the lesson is that even when the series converges (in one order), it may not be the "true" expectation because we can rearrange to get any value.

          How to head off: We can agree that if we bound utility, then we avoid the problem. But we are considering unbounded utility. The problem is not divergence (like in St. Petersburg) but non-absolute convergence.

     b) "No casino can pay, so truncate the tail."
          - If we truncate the game at some maximum number of tosses, then we have a finite game and the expectation is well-defined. But different truncations give different expectations? Actually, the expectation for the truncated game is the partial sum of the alternating harmonic series, which approaches ln2 as we truncate later. But if we rearrange and then truncate, we get a different partial sum. So truncation doesn't help because the rearrangement matters even for finite n? Not exactly: in the finite case, the sum is fixed because the order is fixed. The problem in the infinite case is that the limit depends on the order.

          However, if we truncate the tail (say, after N tosses, we stop and pay nothing if heads hasn't come), then we get a finite number of terms and the expectation is the partial sum in the natural order. But if we rearrange the terms arbitrarily and then truncate at a fixed N, we might get a different partial sum. However, in the finite case, the outcomes are fixed and the expectation is the sum over the outcomes with their probabilities. The order of summation in the finite case doesn't matter (by commutativity). So for the truncated game, the expectation is well-defined. The problem arises only when we go to infinity.

          So the point: truncation makes the problem go away, but we are interested in the infinite game. And for the infinite game, the expectation is not well-defined unless we specify the order.

     c) "The order of summation is fixed by the game, so the rearrangements are cheating."
          - This is the critical one. Why should we rearrange? The game describes the outcomes: the outcome is the number of tosses n. So we naturally index the outcomes by n. Therefore, the natural order is n=1,2,3,... and in that order we get ln2. So why consider rearrangements?

          The response: the definition of expected value for a discrete random variable is the sum over the sample space of [probability of outcome] * [payoff]. The sample space is countable: {1,2,3,...}. But when we write the sum, we must choose an enumeration (an ordering) of the sample space. The natural enumeration is by n. However, the mathematical definition of the sum over a countable set requires that we fix an enumeration. And Riemann's rearrangement theorem tells us that if the series is conditionally convergent, then different enumerations yield different sums. Therefore, the expectation is not well-defined independently of the enumeration. 

          We think of the expectation as a property of the distribution and the payoff function, but it turns out that for conditionally convergent series, we need to specify the order of summation. The natural order is a choice. 

          Example: what if we list the outcomes in increasing order of |payoff|? That is, we list the outcomes by the absolute value of the payoff. Then we get a different order. And that would yield a different sum.

          So the misconception: the order is fixed. But mathematically, the sample space is just a set, and we have to choose an enumeration to sum. The natural order is one enumeration, but there are others.

  4. **What to openly decline to settle:**
     - We won't go into the measure-theoretic definition of expectation (which for non-negative random variables does not require an ordering, but for general random variables requires absolute convergence for the expectation to be well-defined without an ordering). 
     - We won't prove the Riemann rearrangement theorem, but we will show an example.
     - We won't resolve the paradox completely, but we will note that in practice we might avoid the problem by bounding utility or by truncation. However, the theoretical point is that without absolute convergence, the expectation is not a number but depends on the order.

