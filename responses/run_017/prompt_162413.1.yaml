  2. What should they argue in their appeal? They need to frame it as masterful execution within tradition. Emphasize their training, the shared workshop vocabulary, and the absence of tracing. Highlight that this is how traditions are maintained. Differentiate from the 1996 Halloran scandal, which involved actual tracing. Mention the dissenting judge's point about "copycat" as a compliment. Also, note the revival society's interest as validation. Structure the appeal to address the rule's ambiguity and suggest that their work exemplifies skilled tradition rather than copying.

