answer: |-
  Your situation highlights a fascinating tension between tradition, originality, and rulemaking in a craft guild. Let's break down your three questions:

  ### 1. Is there a "fact of the matter" about whether your sign is a "copycat"?
  **No, not objectively.** The term "copycat" (as used here) is inherently **subjective and context-dependent**, as evidenced by:
  - The rulebook's deliberate use of scare quotes and lack of definition.
  - The split among judges (one seeing "filling a slot," another seeing skilled tradition).
  - The revival society's *praise* of it as "idiom work."

  Your sign exists in a gray area:
  - **It is NOT a copycat** in the **fraudulent sense** (like the 1996 Halloran affair). Nothing was traced or directly plagiarized. It’s an original assembly of shared workshop motifs.
  - **It COULD be seen as a copycat** in a **functional/traditional sense**: It uses the same visual "language" (ground color, motif sequence, silhouette) as Odile’s 2009 sign, serving an identical purpose for the same type of client. It *does* "fill the same slot" in the valley’s visual repertoire.

  **Conclusion:** The dispute isn’t really about your sign’s *factual* status. It’s about **how the guild defines value**: Is "originality" about *inventing new motifs*, or about *masterfully deploying tradition*? Your sign is a faithful execution of workshop idiom—which some see as derivative, others as expertise.

  ### 2. What to argue in your one-page appeal statement
  **Core Strategy:** Frame your work as **masterful tradition, not derivative copying**. Position the disqualification as a *misapplication* of Rule 12, which was designed to punish plagiarism, not uphold workshop practice.

  **Structure your Argument:**
  - **Introduction:** State your 9-year dedication (6 as Odile’s apprentice) and respect for guild standards.
  - **The Sign’s Creation:**  
    - Emphasize **no tracing, no direct borrowing**—it’s an original assembly of the workshop’s "shared vocabulary."  
    - Highlight **craftsmanship**: Hand-painted, custom-made for a specific client.  
    - Note the revival society’s interest as external validation of its legitimacy.
  - **Rule 12 Misapplied:**  
    - Cite the **1996 Halloran affair** (explicit tracing) as the rule’s intent: to prevent *fraud*, not punish tradition.  
    - Argue that **"copycat" in workshop culture** (per the dissenting judge) denotes *skillful emulation*, not theft—a compliment to apprentices.  
    - Assert that your sign **does not "copy" Odile’s**; it shares a *genre*, not a specific design. (If the motifs differ in execution, say so: "My scrollwork has a tighter curve; my skep is rendered with heavier linework," etc.)
  - **Broader Principle:**  
    - Guilds exist to **preserve tradition**. If every sign using lead-blue + skep + scrollwork is "copycat," the valley’s visual heritage dies.  
    - Distinguish **"idiom work"** (legitimate tradition) from **plagiarism** (Rule 12’s true target).
  - **Conclusion:** Urge the committee to reverse the disqualification and clarify Rule 12 to protect tradition.

  **Key Phrases to Use:**  
  > "This sign embodies the workshop idiom I was trained to uphold."  
  > "Rule 12 targets plagiarism, not the faithful execution of craft tradition."  
  > "If masterful ‘idiom work’ is disqualified, the guild risks erasing the very heritage it exists to preserve."

  ### 3. Should the guild drop "copycat" for narrower rules?
  **Yes, absolutely—and something valuable would be gained: clarity.**

  The current rule fails because:
  - "Copycat" is **too vague**, leading to inconsistent rulings (as in your case).
  - It **conflates unethical acts** (tracing, plagiarism) with **traditional practice** (using shared motifs).

  **Proposed Replacement Rules:**  
  - **Rule 12(a): Direct Copying**  
    *"Entries that trace, digitally replicate, or directly duplicate extant work without significant alteration are prohibited."*  
    (Targets Halloran-style fraud).  
  - **Rule 12(b): Design Plagiarism**  
    *"Entries that appropriate unique, identifiable creative elements (e.g., novel motifs, compositions, or color schemes) from a specific existing sign without credit or transformative effort are prohibited."*  
    (Protects individual artists’ innovation).  
  - **Rule 12(c): Derivative Work**  
    *"Entries that rely entirely on generic, traditional, or workshop-specific motifs without original input may be moved to a ‘Traditional Practice’ category, but are not disqualified."*  
    (Acknowledges "idiom work" as valid but distinct).

  **What Might Be Lost (and Why It’s Worth It):**  
  - The romantic, workshop-specific notion of "copycat" as a compliment (per the dissenting judge).  
    **→ Counter:** Guild rules must prioritize fairness over nostalgia. Ambiguity harms artists.  
  - The flexibility of "judges’ judgement."  
    **→ Counter:** Unchecked flexibility enables bias. Clear criteria protect entrants.

  **The Outcome:**  
  Your case reveals the guild’s unresolved conflict: **Is it preserving a living tradition or curating original art?** Your appeal is a chance to advocate for tradition’s value. If the committee upholds your disqualification, it signals that the guild prioritizes novelty over idiom—a legitimate stance, but one that should be made explicit in the rules.  

  **Final Advice:** Submit your appeal, but also propose a rules-review subcommittee. Your experience makes you an ideal voice for clarifying what "copycat" *should* mean. However this ends, you’ve highlighted a critical need for the guild to define its values.
