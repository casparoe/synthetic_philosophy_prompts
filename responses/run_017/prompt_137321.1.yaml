prompt: |-
  hey, I'm a junior and I keep noticing this one move in arguments and I can't figure out if there's a name for it. Here are the times I've actually run into it.

  Our student council president would not shut up about how "the student body wants a later start time." Then someone ran an actual survey and it came back like 60/40 against, mostly people with sports or after-school jobs. Instead of backing off, he said the survey only asked about the schedule and not about what people really care about, and that we've all been trained to just accept the early start, so what people wrote down isn't what they actually want. He also said the people who filled it out where mostly the ones with after-school stuff, so they aren't really "the student body." Then I saw the exact same move from the opposite side: some people wanted homecoming cancelled, it won the vote, and they said the vote didn't count because everyone was pressured into it and the real will of the students was against it. And the part that made me want to ask somebody: I caught myself doing it too, saying my grade doesn't really want a dress code when we'd literally voted for one.

  So the pattern I think I'm seeing is: "what the people really want" gets treated as a seperate thing from what people say they want or vote for, and it can kind of never be proven wrong, because any evidence against it gets explained away — people were misinformed, people were pressured, or the wrong people got asked. It's not just plain lying, I think a lot of them half believe it.

  My friend says this is just called populism, but that feels way too broad, and the homecoming people aren't populists in the politician sense. So: is there an established concept for this specific move, or for the gap between the "real" want and the stated one? If there are a few nearby concepts that almost fit, tell me which one fits best and exactly how mine is different from each of the others — I don't want just a label, I want to know where the edges are, and whether the two versions I described (people are misinformed vs. you asked the wrong people) are really the same thing or two different things that look alike. Also, is there any version of this move that's actually legit, like where pointing at a "real" want that nobody stated is genuinely fair and not just a way to dodge evidence?

  Please write in American English. And can you say how confident you actually are, and what would change your mind — like, if you do name a concept, what would make you go "actually no, that's the wrong fit," and where is your reasoning most likely to be wrong? I'd rather have you flag the shaky parts than sound sure.
reasoning: |-
  Okay, let me unpack this user's question. They're describing a recurring pattern in arguments where someone dismisses actual votes or surveys by claiming there's a "real will" of the people that contradicts the expressed preferences. They've encountered it in student council scenarios and even caught themselves doing it. 

  Hmm, the user wants precision - not just a label but clear boundaries. They're intellectually curious, noticing patterns in debate tactics. The fact they self-reported their own use of the tactic shows impressive self-awareness for a junior. Their frustration comes through - they recognize this move blocks accountability.

  First, I need to separate two things they mentioned: (1) dismissing expressed preferences as "false consciousness" (people don't know their own interests) and (2) claiming unrepresentative samples (you asked wrong people). While both serve to reject evidence, they're distinct mechanisms. The first attacks validity of responses, the second attacks sampling methodology.

  The "real will" concept feels familiar... Rousseau's "general will" comes to mind, but that's philosophical. For the dismissive tactic, "motivated reasoning" fits but is too broad. "Epistemic closure" describes evidence rejection but isn't argument-specific. 

  Wait - "rhetorical immunization"! That's when you make a claim unfalsifiable by preempting counterevidence. Exactly what they described: any contrary data gets explained away as misinformation or bad sampling. The examples perfectly match - survey results? "People are brainwashed!" Vote outcome? "The turnout was biased!" 

  For the "true desire" vs stated preference gap... Marxist "false consciousness" is adjacent but politically loaded. "Preference falsification" (Kuran) fits better - hiding true preferences due to social pressure. But in the user's cases, the arguer assumes falsification without proof. 

  Important caveat: sometimes this move is legitimate. If a survey has provable sampling bias (only emailed athletes) or verifiable voter intimidation, dismissing results is valid. The problem is when it's used as a universal escape hatch with no evidence. 

  I'm about 85% confident on "rhetorical immunization" as the core concept. If someone showed me a more precise term in argumentation theory, I'd reconsider. The shakiest part is whether all their examples share the same structure - the "wrong people" excuse might technically be a separate statistical fallacy. But functionally, it's used identically to immunize claims. 

  User's meta-request about confidence levels is smart. I'll explicitly state where I'm less certain, especially about the two mechanisms being variants of the same tactic versus distinct. Also worth noting that populists use this, but it's not exclusive to them - their homecoming example proves that.
answer: |-
  Based on your detailed examples and analysis, you've identified a **specific rhetorical tactic** with clear characteristics. The most precise established concepts for this "move" are:

  1.  **Rhetorical Immunization (or Immunization Stratagem)**: This is the core tactic.
  2.  **Appeal to the "Real" Will of the People / Silent Majority**: This describes the specific *claim* being immunized.
  3.  **Epistemic Closure (applied specifically)**: This describes the *effect* on the argument.

  **Confidence Level: 85%** that "Rhetorical Immunization" is the most accurate specific *tactic* label. Here's the breakdown:

  *   **What Fits Perfectly - Rhetorical Immunization:**
      *   **Definition:** Deliberately constructing a claim or belief in such a way that it becomes unfalsifiable – immune to counter-evidence or refutation. Any evidence contradicting the claim is preemptively explained away *as evidence supporting the claim* or as fundamentally flawed/invalid.
      *   **Your Examples:** In each case, the claim ("student body wants later start," "students *really* oppose homecoming cancellation," "my grade doesn't *really* want the dress code") is immunized. Surveys, votes, expressed preferences are dismissed *not* necessarily as inaccurate data points in themselves, but as *inherently incapable* of measuring the "true" desire due to bias, misinformation, pressure, or the wrong people participating. The "real will" exists somewhere deeper, inaccessible to standard measurement.
      *   **Why it Fits:** It perfectly describes the *move* of making the core claim ("what people *really* want") untouchable by any empirical evidence. The counter-evidence (survey, vote) is *reinterpreted* to support the original claim ("See? The survey proves people are brainwashed/misinformed!" or "The vote only shows peer pressure!").
      *   **Edge:** This is about the *structure of the argument* and the *tactic used to preserve the belief*. It's not about the content of the belief itself (like populism often is).
      *   **What Would Change My Mind:** If you found instances where the person *accepted* contradictory evidence under specific, verifiable conditions (e.g., "If a secret ballot with 90% turnout shows X, then I'll admit I'm wrong"), it wouldn't be pure immunization. Your examples show no such conditionality.

  *   **The Gap Concept: Appeal to the "Real" Will / Silent Majority:**
      *   **Definition:** Asserting that the true desires or opinions of a group (the "people," the "silent majority," the "real student body") differ significantly from, and are morally or authentically superior to, the views expressed through official channels, polls, or vocal minorities. It implies a deeper, often unspoken or suppressed, consensus.
      *   **Your Examples:** The President dismissing the survey respondents as not the "real student body." Opponents dismissing the homecoming vote as pressured and not reflecting the "real will." You dismissing your grade's vote as not reflecting their "real" desire.
      *   **Why it Fits:** This precisely names the *content* of the claim being immunized – the existence of this gap between stated and "real" desire.
      *   **Edge:** This is the *substance* of the belief being protected, not the *tactic* used to protect it. It can be used sincerely or cynically. It's distinct from simple "They're lying" because it posits a more complex failure of expression or measurement (misinformation, pressure, structural exclusion).
      *   **Relation to Populism:** Your friend is partially right. Populism *routinely* employs this appeal ("the *real* people vs. the corrupt elite"). However, as you noted, it's **too broad**. Populism is a larger political ideology/style, while this appeal is a specific rhetorical tool *used by* populists (and many others, like your homecoming opponents or yourself). Not everyone using this appeal is a populist, but all populists use some version of it.
      *   **What Would Change My Mind:** If the person claiming the "real will" pointed to *specific, measurable evidence* of the gap (like leaked private conversations, a provably biased voting process, or historical data showing suppressed opinions later vindicated) *instead* of just dismissing contrary evidence, it might shift towards a critique of methodology rather than pure appeal to an unmeasurable "real will."

  *   **The Underlying Mechanism: Epistemic Closure (Specific Application):**
      *   **Definition:** A system of thinking where contrary evidence is systematically excluded, rejected, or reinterpreted to fit the pre-existing belief system, making it resistant to updating based on new information.
      *   **Your Examples:** The belief in the "real will" is held with such conviction that any contradictory data (survey, vote) isn't seen as falsifying the belief, but rather as data *about* why the belief is still true (it shows the pressure, the misinformation, the exclusion). The system is closed to disconfirmation.
      *   **Why it Fits:** It explains *why* the immunization works for the believer – their framework for evaluating evidence won't allow the core belief to be challenged.
      *   **Edge:** Epistemic closure is a broader *cognitive state or system*. Rhetorical Immunization is a specific *strategy* that can create or reinforce epistemic closure on a particular point. This is the *effect* or *underlying condition* enabling the tactic.
      *   **What Would Change My Mind:** If the person demonstrated openness to revising their view of the "real will" based on specific types of evidence they previously dismissed in similar situations.

  **Addressing Your Specific Questions:**

  1.  **"Misinformation" vs. "Wrong People" - Same Tactic, Different Justification:** These are **two variants of the same core immunization tactic.** Both serve the same function: dismissing empirical evidence (survey/vote) as invalid measures of the "real will." One explains the gap by claiming corrupted individual judgment ("misinformed/trained"), the other by claiming corrupted representation ("unrepresentative sample/not the *real* body"). Both achieve immunization.
  2.  **Legitimate Versions: YES, but with High Bars:**
      *   **Demonstrable Coercion/Intimidation:** If there's *clear, verifiable evidence* voters were directly threatened or intimidated (e.g., proof of bullying related to the homecoming vote), dismissing the *expressed* result as not reflecting *true* preferences is legitimate. The "real want" is inferred from the absence of pressure.
      *   **Provable Systemic Exclusion/Bias:** If a survey *provably* excluded a major, relevant segment of the population (e.g., only emailed athletes about start times, ignoring non-athletes entirely), questioning its representativeness is valid methodology critique. The claim would need evidence of the exclusion *and* a reason why the excluded group's "real will" likely differs.
      *   **Hypothetical Preferences (Rare & Theoretical):** Economists/psychologists sometimes distinguish "revealed preference" (what you *do*) from "stated preference" (what you *say*), or discuss preferences people *would* have with perfect information. However, claiming *to know* this hypothetical "real preference" *in opposition to expressed preferences*, without rigorous methodology (like controlled experiments or highly specific theory), usually veers into the illegitimate immunization you described. It's rarely fair in casual argument.
      *   **Key Difference:** Legitimate versions rely on **specific, verifiable evidence** of the distorting factor (coercion, exclusion, provable misinformation campaign) and often propose *testable ways* to get closer to the "real will" (e.g., a secret ballot, a better-designed survey). The illegitimate version uses the *concept* of distortion as a universal, unfalsifiable shield against any contrary evidence.

  **Where My Reasoning is Shakier:**

  1.  **Overlap with "False Consciousness":** This Marxist concept (people hold beliefs against their "true" interests due to ideological manipulation) is very adjacent. I avoided it because it's politically loaded, theoretically complex, and implies a specific theory of *why* the gap exists (ideological domination) that may not fit all your examples (e.g., simple peer pressure for homecoming). Immunization is a broader rhetorical tactic that *can* use a "false consciousness" *justification*, but isn't limited to it. Someone could argue this is a better fit for the "misinformation/trained" justification.
  2.  **Preference Falsification (Timur Kuran):** This is the sociological concept of people hiding true preferences due to social pressure. This perfectly describes the *potential gap* the arguers are *pointing to*. However, it doesn't name the *tactic* of dismissing evidence *by claiming* preference falsification is occurring without proof. Immunization names the tactic; preference falsification names a potential (but often unproven) social phenomenon that the tactic exploits.
  3.  **"No True Scotsman" Fallacy?** This fallacy (redefining a group to exclude counter-examples) is similar to the "not the *real* student body" move. However, "No True Scotsman" usually redefines the *group's essential characteristics*, while this tactic redefines the *valid source of evidence* about the group's will. It's closely related, but the emphasis on rejecting empirical measurement of "will" makes Immunization a slightly better fit.

  **In Summary:**

  You've astutely identified **Rhetorical Immunization** – the tactic of making the claim about the "real will of the people" unfalsifiable by reinterpreting or dismissing any contrary evidence as proof of distortion (misinformation, pressure, unrepresentativeness). This tactic protects an **Appeal to the "Real" Will / Silent Majority**. The two justifications you saw ("misinformed" vs. "wrong people") are variants of the same immunizing strategy. While there *are* limited, evidence-based scenarios where questioning expressed preferences is legitimate, the move you describe usually lacks this evidence and serves to shield a belief from accountability. Your self-awareness in spotting this pattern, even in yourself, is impressive!
