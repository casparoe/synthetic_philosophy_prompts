prompt: |-
  Hey — I'm in a small reading group on moral psychology (six of us, mostly grad students, plus one retired guy who I'm pretty sure shows up mostly for the wine), and this week we did Williams on internal and external reasons. One member is writing on Williams and gets visibly annoyed whenever anyone calls him a Humean, which is part of why I'm suspicious of the summary I found in a free online encyclopedia of philosophy I won't name. I've copied the relevant paragraph out below:

  "According to Bernard Williams, all reasons for action are internal: an agent has a reason to do something only if she already has some desire that doing it would serve, or could acquire such a desire by correct reasoning from the desires she already has. This is the internal reasons theory. It follows that there are no external reasons — no facts that give an agent a reason to act independently of what she happens to care about — and hence that moral requirements give no reason to anyone who lacks an independent desire to be moral. Williams's argument is essentially Humean: since motivation always requires a pre-existing desire, a consideration that left the agent entirely cold could never explain why anyone acted, and so could not be a reason at all. Critics object that this makes reasons embarrassingly subjective: on this view a callous person has no reason not to be cruel. Defenders reply that the reasoning clause can do a lot of work, since the agent might be brought to see the connection by rational reflection. But this only relocates the difficulty, because whether reflection helps depends on psychological facts about the particular agent. So there is no fact of the matter about what anyone has reason to do, and moral disagreement turns out to be merely a clash of attitudes."

  What I'd like is an accuracy audit rather than an essay: go through it more or less sentence by sentence and tell me what someone who actually works on this literature would accept, what's a simplification they'd wince at but would let pass in a popular entry, and what's straightforwardly wrong. I especially want to know about two things. First, whether the slide from "there are no external reasons" to "there is no fact of the matter about what you have reason to do, so moral disagreement is just a clash of attitudes" is something the internalist is really committed to, or whether it's importing a seperate thesis. Second, whether the "pre-existing desire" framing is fair to Williams or whether my friend is right to bristle.

  The thing I actually care about, though, is a case the entry waves away in half a clause. Suppose someone's motivational set contains, along with a genuine commitment to some project, a standing higher-order policy: she will not treat any consideration as a reason if she only came to accept it because somebody argued her into it (she thinks being talked into things is a kind of weakness). The entry's line, as I read it, is that this is a non-problem — the policy is just one more element of the motivational set, so there is either a sound deliberative route from the set taken as a whole or there isn't, and the theory is untouched. That feels too quick to me: it means whether she has a reason depends not just on what's in her motivational set and on the non-motivational facts, but on the path by which the deliberation reached her — same agent, same set, same conclusions of sound deliberation, but the reason exists if she somehow arrived at it on her own and doesn't if it was argued. Is that a genuine problem for the view, or something the internalist can absorb, and if it is a problem does it hand anything to the externalist or is it a complication both sides share? Don't bother with citations or a reading list, I can chase those up myself — I just want the shape of the arguments.
reasoning: |-
  Okay, the user is part of a reading group on moral psychology discussing Bernard Williams' internal and external reasons. They've shared a paragraph from an online encyclopedia and want an accuracy audit. Specifically, they're concerned about two main points: whether the internalist view leads to moral disagreement being merely a clash of attitudes, and whether the "pre-existing desire" framing is fair to Williams. They also have a thought experiment about someone with a policy against being argued into things.

  First, I need to assess the accuracy of the encyclopedia paragraph. The user mentions that one member gets annoyed when Williams is called Humean, so I should check if that label fits. Williams does emphasize desires in motivation, similar to Hume, but he expands "desires" to include broader elements like commitments and projects. The paragraph's use of "pre-existing desire" might be too narrow, which would justify their friend's annoyance. I should point out that Williams' motivational set is more inclusive.

  Next, the slide from "no external reasons" to "no fact of the matter" about reasons. The paragraph claims this leads to moral disagreement being just clashes of attitudes. But Williams' internalism is about the existence of reasons being relative to an agent's motivational set. That doesn't necessarily mean there's no fact of the matter; it could be that within the agent's set, there are objective truths about what reasons they have. The paragraph oversimplifies here. Critics might push the subjectivism angle, but defenders could argue that sound deliberation can uncover objective reasons relative to the set. The user wants to know if this slide is a necessary commitment or an imported thesis—it seems more like a possible implication critics draw, not something Williams explicitly endorses.

  Then there's the thought experiment. A person has a policy against accepting reasons they were argued into. The encyclopedia dismisses this as just another element in the motivational set. But the user's concern is that the path of deliberation affects whether a reason exists. For example, if the person arrives at the same conclusion on their own versus being told, the reason might not exist in the latter case. This seems problematic because the same motivational set and facts lead to different reasons based on how the deliberation occurred. Internalists might respond by saying that the policy itself constrains sound deliberation. If the policy prevents recognizing valid reasons, it might make some reasons inaccessible, but they still exist if there's a sound route that respects the policy. However, if the policy blocks any route, then no reason exists for that agent. This highlights that internal reasons are path-dependent, which is a feature of the theory, not necessarily a flaw. But it does show that reasons are highly agent-relative. Externalists would argue this is why we need reasons independent of such policies. So the problem might be more acute for internalists but doesn't automatically hand a win to externalists.

  The user's deeper needs: They're in a reading group, so clarity is key for discussion. They want to resolve disagreements (like the Humean label) and understand nuances. Their unspoken need might be to grasp whether Williams' theory holds under edge cases, which relates to moral objectivity. They also might want ammunition for their debates, especially with the friend who dislikes the Humean tag. Providing clear distinctions and potential counterarguments will help them engage more effectively in their group.
answer: |-
  Here's a line-by-line accuracy audit of the encyclopedia paragraph, focusing on Williams scholarship and your specific concerns. The verdicts are: **Accurate (A)**, **Simplification (S)**, **Misleading/Problematic (M)**, or **Wrong (W)**.

  1.  **"According to Bernard Williams, all reasons for action are internal: an agent has a reason to do something only if she already has some desire that doing it would serve, or could acquire such a desire by correct reasoning from the desires she already has."**
      *   **Verdict: S (Simplification).** Core idea is correct. *But*: Williams famously broadens "desire" to the "motivational set" or "S" (which includes desires, projects, commitments, dispositions of evaluation, even things like one's sense of identity). Saying "desire" isn't strictly *wrong* (he sometimes uses it broadly), but it risks the very narrowing your friend dislikes. The "could acquire" via "correct reasoning" part is accurate and crucial.

  2.  **"This is the internal reasons theory."**
      *   **Verdict: A.**

  3.  **"It follows that there are no external reasons — no facts that give an agent a reason to act independently of what she happens to care about..."**
      *   **Verdict: A.** This is the core negative thesis.

  4.  **"...and hence that moral requirements give no reason to anyone who lacks an independent desire to be moral."**
      *   **Verdict: A.** This is a direct, intended consequence Williams embraces. If "being moral" isn't connected (or connectable via sound deliberation) to anything in the agent's S, then the moral requirement provides no reason *for that agent*.

  5.  **"Williams's argument is essentially Humean: since motivation always requires a pre-existing desire..."**
      *   **Verdict: M (Misleading/Problematic).** **This is likely what makes your friend bristle.** The *motivational* premise ("motivation always requires something in S") is indeed often called Humean. *However*, Williams explicitly distances himself from a narrow Humean picture of desires as simple, pre-existing impulses. His "S" is far richer and includes commitments, loyalties, and deep projects that aren't well-described as "pre-existing desires" in the standard Humean sense. Calling it "essentially Humean" captures the motivational dependence but obscures the crucial richness of S and the role of deliberation. It's a common simplification scholars often note is too crude.

  6.  **"...a consideration that left the agent entirely cold could never explain why anyone acted, and so could not be a reason at all."**
      *   **Verdict: A.** This captures Williams' core argument linking reasons *explanatorily* and *normatively*. If a fact couldn't *explain* an agent's action (by motivating them via their S), then it cannot *be* a normative reason *for them*.

  7.  **"Critics object that this makes reasons embarrassingly subjective..."**
      *   **Verdict: A.** This is a standard criticism (e.g., from moral realists/Kantians).

  8.  **"...on this view a callous person has no reason not to be cruel."**
      *   **Verdict: A.** This accurately represents the consequence Williams accepts for the purely callous person whose S contains nothing that sound deliberation could connect to avoiding cruelty.

  9.  **"Defenders reply that the reasoning clause can do a lot of work, since the agent might be brought to see the connection by rational reflection."**
      *   **Verdict: A.** This is a key internalist response. Sound deliberation isn't just finding means to existing ends; it can involve correcting factual errors, overcoming irrationality, vivid appreciation of consequences, etc., potentially revealing connections to existing elements of S the agent hadn't seen.

  10. **"But this only relocates the difficulty, because whether reflection helps depends on psychological facts about the particular agent."**
      *   **Verdict: A.** This is a standard critic's counterpoint. The *possibility* of a sound deliberative route depends on the actual content of the agent's S.

  11. **"So there is no fact of the matter about what anyone has reason to do..."**
      *   **Verdict: M (Misleading/Problematic).** This is **a crucial point regarding your first question**. *Internalism does not necessarily imply this.* Williams *can* (and does) maintain there *is* a fact of the matter relative to an agent's S and the non-motivational facts: "Given agent A with S, and facts F, there *is* a fact of the matter about whether a sound deliberative route from S leads to a motivation to φ." The reason is *relative*, not non-existent. Critics argue this relativity *amounts to* no objective fact of the matter in a robust sense, but it's not that *nothing* is true about reasons for a specific agent. The entry slides too easily from relativity to non-existence.

  12. **"...and moral disagreement turns out to be merely a clash of attitudes."**
      *   **Verdict: M (Misleading/Problematic).** This **directly addresses your first question.** It's an *implication* critics draw and press hard against internalism, but it's not a *necessary commitment* Williams explicitly embraces as a simple "clash." Internalists resist this:
          *   Disagreement might involve factual errors about consequences or about what's in S.
          *   It might involve failures of rationality/imagination in deliberation.
          *   It might involve conflicting elements *within* each agent's S that deliberation hasn't resolved.
          *   Williams acknowledges the "relativism of distance" where deep differences in S make genuine shared reasons impossible, implying disagreement *can* be a clash of fundamental attitudes *in some cases*. But the entry overgeneralizes this to *all* moral disagreement being *merely* a clash, which Williams wouldn't endorse. The internalist structure *allows* for it in hard cases but doesn't *reduce* all disagreement to it.

  **Your Thought Experiment: The Anti-Persuasion Policy**

  The encyclopedia dismisses this too quickly. Your intuition that it's problematic is sharp.

  1.  **Internalist Response (as per encyclopedia):** The policy *is* part of S. Sound deliberation must respect it. If the policy genuinely blocks the agent from forming the motivation *because* it was argued for, then *for that agent*, there might be *no sound deliberative route* to that motivation, even if the conclusion is logically derivable from other elements of S. The reason doesn't exist *for her* via that path. If there's *another* path that respects the policy (she "discovers" it herself), then the reason *does* exist.
  2.  **Why it feels problematic:** It makes the *existence* of a reason path-dependent *even when the starting set and logical conclusion are identical*. This seems counterintuitive. It highlights how internal reasons are deeply *agent-relative* and dependent on the *actual psychological possibility* of motivation arising via an approved deliberative process.
  3.  **Is it a genuine problem for Internalism?** Yes, but it's a *feature* of the view, not necessarily a *bug* Williams didn't anticipate. It emphasizes that reasons are tied to the agent's *actual* capacity to be motivated via sound deliberation *as they conceive it or are constrained by their S*. It shows the theory's commitment to the *subjective motivational set* as the ultimate ground.
  4.  **Does it hand anything to the Externalist?** Potentially. The externalist can argue: "See! The *content* of the reason (e.g., 'you shouldn't torture') is a genuine reason *regardless* of whether the agent can be persuaded or has this quirky policy. The internalist makes the existence of this obvious reason hostage to psychological contingencies like this policy. This shows we *need* external reasons." The internalist counters: "But if the agent *cannot* be motivated by this consideration due to their S (including the policy), then *for them*, it simply *isn't* a motivating reason, and calling it a 'normative reason' they mysteriously 'have' but are utterly immune to is empty."
  5.  **Is it a complication both sides share?** Mostly no. The externalist *denies* that such a policy negates the existence of the reason. They think the reason exists independently; the policy just makes the agent unreceptive or irrational. The *problem* (of path-dependence/psychologization of reasons) is specifically *internalist*. The externalist has a different problem: explaining how an external reason *could* motivate or be normative for an agent entirely devoid of any connection to S.

  **In Summary:**

  *   The "Humean" and "pre-existing desire" labels are **over-simplifications** that obscure Williams' richer "motivational set" – your friend has a point.
  *   The slide from "no external reasons" to "no fact of the matter" and "merely a clash of attitudes" is **misleading**. Internalism allows for *relative* facts about reasons (given S) and doesn't *reduce* all moral disagreement to a clash of attitudes, though it *allows* for that outcome in fundamental clashes of S.
  *   Your anti-persuasion case **exposes a genuine feature of internalism** – the path-dependent, psychologically constrained nature of reasons. It **strengthens the externalist's *critique* of subjectivism/relativity** but doesn't *prove* externalism correct. It highlights the core disagreement: must reasons be grounded in the agent's actual motivational capacities, or can they exist independently?
