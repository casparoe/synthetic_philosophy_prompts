answer: |-
  ### Brainstorm on the Purpose of Rational Acceptance
  Rational acceptance theories aren’t just about individual belief; they’re *social tools* for coordinating inquiry. For researchers, acceptance norms must: (1) enable efficient communication by minimizing unnecessary hedging, (2) flag genuine epistemic risks to prevent misleading assertions, (3) resolve conflicts between high confidence in individual claims and inevitable collective error, (4) guide retraction when new evidence undermines group positions, and (5) balance rigor against paralysis in public claims. The goal is *communal epistemic efficiency*—advancing knowledge without reckless credence.

  ---

  ### Requirements for an Adequate Theory of Rational Acceptance  
  *(Non-negotiable = N; Preference = P)*  

  1. **Resolve Lottery Paradox (N)**  
     *Case*: In a fair 10,000-ticket lottery, statistical evidence shows your ticket will likely lose, but asserting "I will lose" seems irrational.  
     *Requirement*: The theory must forbid accepting "Ticket *n* loses" purely on high probability (e.g., 0.9999), preserving symmetry of doubt.  
     *Why N?* Avoids contradictions when accepting all "Ticket *i* loses" claims individually.  

  2. **Resolve Preface Paradox (N)**  
     *Case*: An author asserts each claim in her book but adds a preface disclaimer accepting fallibility.  
     *Requirement*: Allow accepting each claim while rejecting their conjunction, or justify the disclaimer’s rationality.  
     *Why N?* Mandates compatibility between fallibilism and warranted assertion.  

  3. **Handle Localized Doubt (N)**  
     *Case*: Specific evidence indicates only Chapter 7 is error-prone (e.g., disputed data).  
     *Requirement*: The theory must require targeted qualification (e.g., "Chapter 7’s results are tentative") rather than a global preface disclaimer.  
     *Why N?* Blanket disclaimers misrepresent *localized* epistemic risk as distributed.  

  4. **Handle Opaque Lottery (N)**  
     *Case*: You know your lottery ticket is "very likely" to lose but lack probabilistic details (ticket count, mechanism).  
     *Requirement*: Deliver verdicts without precise probability thresholds (e.g., forbid acceptance if doubt is structural, not quantifiable).  
     *Why N?* Theories relying on sharp probabilities fail real-world uncertainty.  

  5. **Consistency (P: Majority Camp)**  
     *Requirement*: The set of accepted propositions must be logically consistent.  
     *Case*: Accepting mutually incompatible claims (e.g., "A" and "¬A") violates assertion norms.  
     *Preference*: Rejected by dialetheists; required for coherent public claims.  

  6. **Closure Under Known Entailment**  
     - *Single-Premise (N)*: If you accept *P* and know *P* entails *Q*, you must accept *Q*.  
       *Case*: Accepting "All swans are white" obliges accepting "This swan is white" if identified.  
     - *Multi-Premise (P: Skeptical Camp)*: If you accept *P₁*...*Pₙ* and know they entail *Q*, you must accept *Q*.  
       *Case*: Accepting each conjunct in a proof entails accepting the conclusion.  
       *Tension*: Multi-premise closure + fallibilism + preface cases risk inconsistency.  

  7. **Fallibilism (N)**  
     *Requirement*: Acceptance must be compatible with a known, non-zero chance of error.  
     *Case*: Researchers assert hypotheses with <1 probability (e.g., "Dark matter exists").  

  8. **Action-Guidance (N)**  
     *Requirement*: Rules must be usable by researchers without omniscience/complex calculations.  
     *Case*: Deciding whether to state "Method X is reliable" in a paper’s methods section.  

  9. **Evidence Distinction (N)**  
     *Requirement*: Treat purely statistical evidence (e.g., lottery) differently from individual evidence (e.g., eyewitness testimony).  
     *Case*: Statistical evidence alone cannot warrant "Smith committed the crime" in court.  

  10. **Higher-Order Evidence (N)**  
      *Requirement*: Account for evidence about one’s unreliability (e.g., "My lab’s equipment is faulty").  
      *Case*: A co-author’s past errors oblige hedging claims in their section.  

  11. **Collective Acceptance (N)**  
      *Requirement*: Rules must scale to co-authored works, addressing distributed expertise.  
      *Case*: All authors must endorse a paper’s core claims, but may hedge individual contributions.  

  12. **Stability (P: Pragmatic Camp)**  
      *Requirement*: Adding new propositions shouldn’t collapse the acceptance set (e.g., via preface-like doubts).  
      *Case*: Accepting 1,000 claims shouldn’t force retracting all if doubt is minimal per claim.  
      *Tension*: Conflicts with multi-premise closure + fallibilism.  

  ---

  ### Conflicts and Trade-offs  
  - **Fatal Conflict**: *Multi-premise closure* + *Fallibilism* + *Stability* + *Consistency* are jointly unsatisfiable in preface-like scenarios. Accepting many fallible claims with multi-premise closure forces accepting their conjunction—contradicting fallibilism.  
  - **Most Exclusionary Requirement**: *Multi-premise closure* excludes most candidates (e.g., threshold views, belief-splitting) as it forces "logical omniscience" in cumulative contexts.  
  - **Salvage Strategy**: Drop *multi-premise closure* (a preference). Loss: Weakens deductive rigor in complex inferences but preserves fallibilist assertion norms.  

  ---

  ### Contender Scorecard  

  | **Theory**             | **Lottery** | **Preface** | **Localized Doubt** | **Opaque Lottery** | **Verdict** |  
  |-------------------------|-------------|-------------|----------------------|---------------------|-------------|  
  | **Threshold Views**     | ❌           | ✔️          | ❌                    | ❌                   | Fails opaque/localized; requires precise probabilities. |  
  | **Anti-Luck/Tracking** | ✔️           | ❌           | ✔️                    | ✔️                   | Fails preface: author’s claims "track truth" but conjunction doesn’t. |  
  | **Knowledge-First**     | ✔️           | ❌           | ❌                    | ✔️                   | Rejects fallibilism: author "knows" nothing if error is possible. |  
  | **Belief ≠ Acceptance** | ✔️           | ✔️           | ✔️                    | ✔️                   | Best fit: Acceptance is assertion-relative (e.g., "assert *P* if *P* is safe"). Localized doubt mandates localized speech acts. |  

  **Key Argument from Cases**:  
  - **Localized Doubt** sinks threshold/anti-luck/knowledge views: They can’t explain why *only* Chapter 7 needs hedging. Belief-acceptance splits allow context-sensitive norms (e.g., "assert only if risk is non-specific").  
  - **Opaque Lottery** sinks thresholds: No probability number, but structural doubt (e.g., "this is a lottery ticket") forbids flat assertion.  
  - **Preface** sinks knowledge-first: Author *should* assert claims fallibly, but knowledge requires infallibility.  
  - **Winner**: Belief-acceptance splits (e.g., acceptance as *license to assert* under safety conditions) handle all cases by decoupling assertion-rules from belief.
