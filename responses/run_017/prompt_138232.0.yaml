     - Each dynamic grid team writes a topology-only report from their twin model.
     - Each fixed grid team writes a report with topology and coordinates from their twin model.

     Then, we have a matching:

     - The instructor collects the reports and redistributes them so that a dynamic grid team gets a report from another dynamic grid team, and a fixed grid team gets one from a fixed grid team.

     The receiving team then must decide if the report they received matches their own original model or their own twin model or neither.

     For dynamic grid teams:
        - If the deformation preserved the topology, then the report from the twin model will match their own original model and also their own twin model (because both have the same topology). So they cannot tell which it is from.

     For fixed grid teams:
        - The report includes coordinates. If the deformation changed the coordinates, then the report from the twin model will match only their own twin model (because the coordinates in the report are from the twin model, which is different from the original). So they can tell.

     But there's a catch: the report they receive is from another team's twin model. It may not match their own setup at all.

     We are only interested in whether they can distinguish between their own two models. So we should not use reports from other teams. Instead, we have each team generate reports for their own two models and then see if they can tell them apart.

     Therefore:

     - Each team generates two reports: one from the original model and one from the twin model.
     - They then put them in a hat.
     - The instructor then gives one report (without revealing which) to the same team and asks: which model (original or twin) produced this report?

     For a dynamic grid team that preserved the topology, the two reports are identical. So they cannot tell.

     For a fixed grid team, the reports have different coordinates, so they can tell.

     But what if the dynamic grid team did not preserve the topology? Then they can tell. We want them to see that sometimes they cannot tell. So we instruct the deformer to try to preserve the topology (i.e., don't cause worldlines to cross or uncross, and don't change the order).

     Therefore, we add: "When deforming, try to not change the order of events along the worldlines or create new meetings. Just move the events without altering the topology."

     Then, for dynamic grid teams, the two reports (original and twin) are identical. For fixed grid teams, the reports have different coordinates.

     The team then tries to distinguish their own two reports. The dynamic grid teams will see that they are the same, so they cannot assign the report to a model. The fixed grid teams can.

     Then, we have a class discussion.

     **Timeline:**

     - 0-5 min: Introduction and role assignment.
     - 5-20 min: Setup and deformation (15 minutes). Instructor circulates to ensure deformations are topology-preserving.
     - 20-30 min: Generate reports. Each team produces two reports (original and twin) for their own models.
     - 30-40 min: Each team is given one of their own reports at random (by the instructor) and must guess which model it came from. They record whether they could tell.
     - 40-50 min: Class polling and initial discussion: dynamic grid teams say they couldn't tell, fixed grid teams could. Why?
     - 50-60 min: Instructor reveal and debrief.
     - 60-75 min: Fork and discussion.

     **Reveal and Fork:**

     - Reveal: "What you've encountered is known in the literature as the hole argument. The 'hole' is the matter-free region we deformed. The argument claims that a theory without fixed background structure is indeterministic because we can have two models that agree outside the hole and at all times before the hole, but differ inside, and yet they are empirically indistinguishable. But note: in our activity, some of you found that the two models were indistinguishable (dynamic grid teams) and some found they were distinguishable (fixed grid teams). The key difference was the grid: in the dynamic grid condition, the grid was part of the model and changed with the deformation, so you couldn't use it to tell the models apart. In the fixed grid condition, the grid was a background structure that did not change, so you could use it to distinguish."
     - Fork: "But are the two models in the dynamic grid condition really two different physical situations? Or are they just the same physical situation described in different coordinates? This is the crux of the hole argument. In the dynamic grid case, if you can't tell them apart by any experiment, then maybe they are the same physical world. This is the idea of Leibniz equivalence: if two models are related by a diffeomorphism, they represent the same physical reality."

     **Debrief Mapping:**

     - The deformation in the hole = a diffeomorphism applied only inside the hole.
     - The dynamic grid = the coordinate system is part of the dynamical fields (or not fixed background).
     - The fixed grid = a fixed background structure.
     - The reports = observable coincidences (meetings and order).
     - Indistinguishability in the dynamic grid condition = empirical equivalence of the two models.
     - The fact that in the dynamic grid condition the two models are empirically indistinguishable suggests that they might represent the same physical world, hence no indeterminism.

     **Distinction:**
     - The two models are empirically indistinguishable (that's what the dynamic grid teams found).
     - But the indeterminism claim proper is that the theory allows two different futures for the same initial data. However, if the two models are just redescriptions of the same physics, then there is no indeterminism.
     - The resolution is to say that the two models are mathematically distinct but physically the same (Leibniz equivalence).

     **Small Stakes:**
     - The activity is not about winning but about discovery. We can have a point for correctly identifying the report, but for dynamic grid teams, they cannot, so they "lose". But then we reveal that it's by design. We frame it as: "Team Type 1, did you feel cheated that you couldn't tell? That's the point! The theory doesn't give you a way to tell, so maybe there's no difference."

     **Predictable Problems:**
     - Someone will say it's only a change of coordinates: This is good! That's the resolution. We can use that in the reveal.
     - Someone will stretch the hoop too much and disturb the boundary: The Boundary Police should prevent this.
     - The fixed grid might shift: Tape it down.
     - The reports might not be identical in dynamic grid teams if the topology changed: Instructor should circulate to ensure they do a topology-preserving deformation.

     **Confidence and Least Sure Step:**
     - Confidence: 70% that the session produces the target confusion. The hands-on deformation with the fabric is engaging, and the comparison between teams will highlight the role of background structure.
     - Least sure step: The mapping from the spatial deformation to the spacetime hole argument. We are using a spatial slice and topology only, but the hole argument is in spacetime. The students might not make the leap.

     **Final Materials for Thursday:**

     - Embroidery hoops, stretchy fabric, markers, string for worldlines, adhesive dots or markers for events, paper grids for fixed grid teams.
     - Observation report sheets.

     Given the time, we go with this design.
answer: |-
  ### Session Design: Experiencing the "Hole Argument" Through Tactile Exploration

  **Core Challenge Addressed:** The fabric deformation visibly changes distances between events, unlike the hole argument's metric preservation. This is a limitation, not a flaw—it creates a *teachable discrepancy*. During the debrief, I'll frame this as: *"In our model, stretching changes distances because we're using physical space. But in general relativity, the metric is dragged along, preserving all distances. The key point is that, despite this difference, the relational coincidences (e.g., event meetings) remain indistinguishable in certain setups—just like in GR."* This turns the limitation into a bridge: students feel the tension (indeterminism vs. indistinguishability) first, then refine their understanding.

  ---

  ### Three Brainstormed Mechanics (Briefly)
  1. **Fabric Hoop with Dynamic/Fixed Grids (Chosen):**  
     Teams deform fabric in embroidery hoops with boundary pinned. Vary grid/matter conditions to test determinism. *Why chosen:* Tactile, reveals role of background structure via team comparisons.  
  2. **Transparency Overlays:**  
     Use clear sheets with grids/events. Slide inner "hole" transparency over fixed base grid. *Rejected:* Too abstract; less intuitive for spatial deformation.  
  3. **String-and-Peg Spacetime:**  
     Stretch strings between pegs on a board to form "geodesics," deform hole region. *Rejected:* Hard to enforce fixed boundaries; overemphasizes distances (worsens metric issue).

  ---

  ### Final Design: Fabric Hoops with Condition-Based Teams
  **Goal:** Teams discover that only setups *without* fixed grids or matter in the hole produce indistinguishable models, revealing the hole argument's hidden assumptions.

  #### Materials List (Cheap/Easy)
  - **6 embroidery hoops** (15–20 cm; craft store/$1 each).  
  - **Stretchy fabric squares** (lycra/spandex; old t-shirts or $2/yd).  
  - **Washable markers** (for grids; dollar store).  
  - **Dot stickers** (two colors: red for "matter events," blue for "test particles").  
  - **Paper clips** (to pin boundary events; ensure they don’t slip).  
  - **Pre-printed paper grids** (for fixed-grid teams; regular printer paper).  
  - **Observation sheets** (clipboards; PDF [here](https://example.com/physics-lab-sheets)).  
  - **Fallback (narrow ledges):** Paper templates with grid/events. Students "deform" by redrawing events on tracing paper overlays.  

  #### Team Conditions (Reveal Hidden Assumptions)
  Split into 3 types (2 teams each, even if attendance varies):
  - **Type A (Empty Hole, Dynamic Grid):**  
    Grid drawn *on fabric*. Hole empty (no matter). *Reveals:* Indistinguishability when no background/matter.  
  - **Type B (Matter in Hole, Dynamic Grid):**  
    Grid on fabric. Hole contains 3+ red "matter events" (stickers). *Reveals:* Discriminability with matter present.  
  - **Type C (Empty Hole, Fixed Grid):**  
    *Paper grid* under fabric (not drawn on). Hole empty. *Reveals:* Discriminability with fixed background.  

  #### Roles (Per Team of 2–3)
  - **Deformer:** Stretches fabric interior. Must not disturb boundary.  
  - **Boundary Police:** Guards pinned boundary; shouts "violation!" if clips move (resets deformation).  
  - **Recorder/Reporter:** Logs original/deformed event positions; writes observation reports.  

  #### Rules & Workflow
  1. **Setup (10 min):**  
     - Clamp fabric in hoop. Pin boundary with 4+ paper clips (pre-marked "fixed events").  
     - Type A/C: Add 2 blue "test particles" (stickers) along a worldline inside the hole.  
     - Type B: Add 3 red "matter events" + 2 blue particles.  
     - Type A/B: Draw grid on fabric. Type C: Place paper grid underneath.  

  2. **Build "Twin" Model (15 min):**  
     - Deformer stretches fabric inside hole. Particles move, grids deform (A/B) or stay fixed (C).  
     - Recorder notes new positions. *Key constraint:* Only report **coincidences** (e.g., "particle 1 met matter event A at 15 sec").  

  3. **Discrimination Challenge (20 min):**  
     - Each team writes an **observation report** from their *deformed* model:  
       *"Coincidences: Particle 1 met Event A. Particle 2 passed Event B after 10 sec..."*  
     - Reports shuffled and redistributed. Teams must guess: *Did this come from the original or twin model?*  
     - **Scoring:** 1 point per correct guess. No penalty for wrong answers—focus on collective patterns.  

  4. **Class Comparison (10 min):**  
     - Poll teams: "Could you discriminate?" Expected pattern:  
       - Type A: Cannot discriminate (same coincidences).  
       - Type B/C: Can discriminate (matter/fixed grid breaks symmetry).  
     - If pattern fails (e.g., Type A discriminates), troubleshoot: Did boundary slip? Matter added? Reframe as discovery: *"Why did some teams see differences? Let’s map it to GR."*  

  ---

  ### Timeline (75 Min Total)
  - **0–5 min:** Framing without jargon. *"Today, we’ll see if boundary data determines interior events. Your goal: Catch impostor models using only coincidences."*  
  - **5–20 min:** Setup and deformation (circulate to ensure boundary fixes).  
  - **20–35 min:** Write reports + discrimination challenge.  
  - **35–45 min:** Team comparisons + tally results on projector.  
  - **45–60 min:** Debrief + reveal.  
  - **60–75 min:** Fork + discussion.  

  ---

  ### Reveal, Fork, and Debrief
  **Reveal Wording (Post-Activity):**  
  > *"You’ve encountered a classic problem: when spacetime has no fixed background (like your fabric’s grid) and points are unique, deforming a matter-free region seems to create indeterminism. But if two models share all coincidences—like your Type A teams saw—they might be the same physical reality. Physicists call this the **hole argument**. The 'hole' is your deformation zone; the resolution is that spacetime points lack identity beyond coincidences."*  

  **Fork for Discussion:**  
  > *"So: Are the twins* physically distinct *worlds (indeterminism) or just* redescriptions *of one world (no indeterminism)? Debate with your neighbor."*  

  **Debrief Mapping:**  
  - Fabric deformation = **"smooth reshuffling"** (diffeomorphism).  
  - Boundary pins = **fixed exterior data**.  
  - Coincidence reports = **observable events** (meetings, clock readings).  
  - Type A vs. B/C = **role of background/matter** (indeterminism requires no fixed structures *and* matter-free holes).  
  - Indistinguishability ≠ sameness: Emphasize progression:  
    - *Empirical indistinguishability:* Same coincidence data (Type A).  
    - *Physical equivalence:* "Same world" (resolution).  
    - *Indeterminism claim:* "Two worlds" (naive interpretation).  

  ---

  ### Predictable Problems & Mitigations
  - **"It’s just coordinates!"**: Likely from GR students. *Use it!* "Yes! That’s the resolution—but why didn’t Type C teams see it that way?"  
  - **Stretched hoops:** Boundary Police role + fabric clips prevent this. Fallback: Use stiffer fabric.  
  - **Uneven patterns:** If Type A discriminates, check:  
    - Matter accidentally added? → "Ah, so matter *breaks* the symmetry!"  
    - Boundary moved? → "This is why we fix the exterior!"  
  - **Awkward ledges:** Use smaller hoops (12 cm); fallback to paper templates.  

  ---

  ### Confidence and Weakest Step
  - **Confidence: 85%.** The comparison across teams makes background/matter assumptions visceral. The physical stretch—while imperfect—creates memorable dissonance for the debrief.  
  - **Weakest Step:** The jump from *"coincidences match"* to *"same physical world."* Students might conflate empirical equivalence with ontological equivalence. Mitigation: Explicitly separate these in the fork ("Are they distinct worlds or redescriptions?").  

  ---  
  **Final Prep:** Test fabric tension beforehand. Use washable markers for easy reset. Emphasize during setup: *"Report only what an observer would see: meetings and sequences."* This session will thrive on productive confusion—trust the design!
