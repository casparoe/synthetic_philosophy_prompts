prompt: |-
  So I'm the junior person on a small working group that writes classification reports on atrocities — basically we decide whether a campaign gets the g-word or gets something lesser (crimes against humanity, mass displacement, cultural destruction). We work off the Convention definition, including the fact that its protected-groups list stops at national, ethnical, racial and religious and we've allways refused to stretch it to political groups. Worth knowing too: Lemkin's own broader idea was built to cover killing a group's language, institutions and economic base, not just its members, and our precedent 4 is basically us deciding not to go that far.

  Our track record, shortened:

  - Vardinia, 2003: army units kill most of the men and boys of an ethnoreligious minority across four towns; intercepted orders say no male of them is to remain. We called it genocide.
  - The Kalsten relocations, 1998: the rural population of a minority is deported wholesale from a border province, around 4,000 die of exposure and disease (the cabinet had been warned this would happen), their language schools are shut, and the group goes on existing in camps and in the cities. We did not call it genocide; the writeup says the group was moved, not destroyed.
  - Operation Greenfield, 2011: a herding group's wells are poisoned and their herds destroyed, roughly 2,000 dead, survivors end up as urban dependents, and an internal memo says their way of life has to end so the land can be settled. Genocide.
  - The Marrow schools, 1970s–90s: minority children taken into majority-language boarding schools, the language banned in public life, ~600 dead of neglect, and the group today still has 200,000 self-identifying members. Not genocide: we called it cultural destruction and said the g-word there would be a category error for us.
  - The Pelletier decrees, 2016: forced sterilisation of the group's women, children separated from families, under a hundred dead. Genocide.
  - Sula, 2008: the group's entire population in one province — about 30,000 out of a 2-million-strong group — systematically killed. Genocide. Our note says we don't require the destroyed part to be some share of the whole group; destroying the group where it lives is destroying it in part.

  New case, and it's tearing us apart. A state facing an insurgency in a province inhabited almost entirely by a distinct ethnoreligious group (everyone agrees it's a protected group; it's 400,000 people out of 6 million worldwide). Nobody is deliberately killed. Instead: the group's land is reclassified as state land under a zoning law and they're evicted; a biometrics re-registration requires in-person appointments at offices outside the province, and anyone who can't comply loses rations, benefits and school enrolment; the group's language-medium schools are merged into majority-language ones. Excess deaths from all this are around 9,000. The cabinet was briefed by its own demographers that the group would definately cease to exist as a distinct group in that province within a generation and that the displaced would be absorbed. The ministers' stated purpose is administrative integration and counterinsurgency; the internal memos say the distinctness of the group's identity is the soil the insurgency grows in, and that within a generation there will be no separate group here. Also politically relevant: the group's own representatives are split, half want the label and half think using it for a case with no massacres cheapens it.

  Do you think we'll call it genocide? I care less about the verdict than about which rule we've been implicitly running — something like purpose to destroy the group physically or biologically, versus purpose to end the group's continued existence as the group it is by whatever means, versus something knowledge-based where foreseeable destruction is enough. Which of those are actually consistent with all six precedents above, where do they split on this case, and which precedent is the closest analog — I keep thinking it's Sula, but Sula had everyone dead. And what's the one further case you'd put in front of us that would tell the rules apart? Last thing: one member has started calling this paperwork destruction — campaigns that end a group entirely through administrative acts with no killings at all — and wants it as a named sub-type. If we adopt that, what are we committing to, and does it make our no in precedents 4 and 2 harder to keep?
reasoning: |-
  Hmm, the user is part of a classification team that determines whether atrocities meet the legal threshold for genocide under the UN Convention. They've provided six precedents and now have a controversial new case that's dividing their group. The new case involves systematic administrative measures against an ethnoreligious group that will likely lead to its dissolution as a distinct entity, without direct killings.

  Looking at their precedents, I notice a pattern: physical destruction gets the genocide label (Vardinia, Operation Greenfield, Pelletier decrees, Sula), while cultural destruction and displacement without physical elimination don't (Kalsten relocations, Marrow schools). The Sula precedent is particularly important because it established that destroying part of a group (a provincial population) qualifies as genocide.

  The new case presents a challenge because it combines elements from different precedents. Like Kalsten and Marrow, there's forced displacement and cultural suppression. Like Pelletier, there's reproductive interference (through family separation). And crucially, like Sula, it targets a specific geographical subset of the group with intent to eliminate them as a distinct entity.

  The key tension appears to be between two interpretations of "destroy": physical/biological destruction versus dissolution of group identity. The precedents suggest their group has generally required physical destruction, except in Pelletier where forced sterilization constituted biological destruction.

  For this case, the ministers' stated intent to eliminate the group's distinctness, plus the foreseeable demographic disappearance (9,000 excess deaths), creates a strong argument for genocide under the Sula logic of "destroying in part." However, the absence of direct killings makes it unprecedented.

  If I were to suggest a hypothetical case to clarify their rules, it would be something like: "Systematic denial of reproductive rights to a group coupled with forced assimilation of children, resulting in demographic collapse without killings." This would test whether biological destruction without physical violence qualifies independently.

  Regarding "paperwork destruction" as a subtype: adopting this would commit them to viewing administrative destruction as genocidal when it achieves the same outcome as violence. This would indeed make their previous decisions on Kalsten (forced relocation) and Marrow (cultural destruction) harder to justify, as those also involved administrative measures that damaged group continuity.
answer: |-
  Based on your precedents and the core tension in your group, here's a breakdown of how this new case is likely to play out and the underlying rules:

  1.  **The Core Tension in Your Group:** The split hinges on interpreting "destroy" in the Convention's Article II: "intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such."
      *   **Camp 1 (Likely "No" or "Paperwork Destruction" Sub-type):** Focuses on *physical or biological destruction* as the gold standard. "Destroy" means killing members or preventing births within the group *as the primary means*. Precedents supporting this: Vardinia (killing), Operation Greenfield (killing/destroying biological basis), Pelletier (biological prevention), Sula (killing). The "no" in Kalsten (moved, not destroyed physically/biologically) and Marrow (cultural destruction, group still exists) reinforces this.
      *   **Camp 2 (Likely "Yes"):** Focuses on *intent to end the group's existence as a distinct entity*, regardless of the *means* (killing, displacement, assimilation, destruction of institutions). "Destroy" encompasses making the group *cease to exist* in the targeted area. Precedents supporting this: Sula (destroyed "where it lives" = ceased to exist there), Operation Greenfield (way of life destroyed, group ceased to exist *as herders*), Pelletier (biological destruction prevents future existence). Kalsten and Marrow were "no" because the group *persisted elsewhere* (camps/cities) or *continued to self-identify* (200k members).

  2.  **Analysis of the New Case Against Precedents:**
      *   **Intent:** The internal memos are damning: "the distinctness of the group's identity is the soil the insurgency grows in, and that within a generation there will be no separate group here." This mirrors the "purpose to destroy" more explicitly than in Kalsten or Marrow, aligning closely with the *intent* in Operation Greenfield ("way of life has to end") and Sula (destroy the group in that province).
      *   **Means:** *No direct killing*, unlike Vardinia, Greenfield, Pelletier, Sula. This is the biggest hurdle for Camp 1. The means are administrative displacement, resource denial, and forced assimilation (schools), similar to *aspects* of Kalsten (deportation, school closures) and Marrow (schools, language ban).
      *   **Outcome (Foreseeable):** The group "will cease to exist as a distinct group in that province within a generation" and "the displaced would be absorbed." This is *physical dissolution as a distinct entity* in the targeted area, akin to Sula (group destroyed in that province) and Operation Greenfield (herding group ceased to exist). Crucially, it's *foreseen and accepted* by the cabinet, similar to Kalsten (warned deaths would happen) and Operation Greenfield (memo stated purpose).
      *   **Scale of Deaths:** ~9,000 excess deaths. Significant, but indirect (exposure, disease, lack of access) and not the *primary weapon* like in Vardinia/Sula. Similar *type* of death to Kalsten (4k from exposure/disease). For Camp 1, this isn't "destruction" *by killing*. For Camp 2, it's a foreseeable consequence proving the destructive impact.
      *   **Protected Group:** Uncontested (ethnoreligious).

  3.  **Closest Precedent:** **Sula is the strongest analog, *despite the lack of killing***.
      *   **Why?** *Intent*: Destroy the group *as a distinct entity* specifically *in that geographic location* ("destroying the group where it lives is destroying it in part"). *Outcome*: The group will cease to exist *in that province* within a generation. Sula established that destroying a substantial part *defined geographically* qualifies. The *means* differ (killing vs. administrative destruction/assimilation), but the *intent and foreseen outcome* (ceasing to exist *as the group* in that place) are parallel. Operation Greenfield is also relevant due to the "way of life" destruction intent.

  4.  **Likely Verdict & Rule Revealed:** This case **will force a clarification of your implicit rule**.
      *   **If you call it Genocide:** Your implicit rule is **"Intent to cause the group to cease to exist as a distinct entity in the targeted area, by whatever means, where this outcome is foreseeable and accepted."** This is consistent with Sula (geographic destruction), Operation Greenfield (destruction of a specific way of life/group identity), and Pelletier (biological prevention of group continuity). It *strains but doesn't outright contradict* Kalsten (group persisted elsewhere) and Marrow (group still self-identifies). The rule becomes focused on *destroying group existence*, not *only* the method.
      *   **If you call it "Paperwork Destruction" (sub-type) or "Not Genocide":** Your implicit rule is **"Intent to physically or biologically destroy group members *as the primary means* of ending the group's existence."** This is consistent with Vardinia, Greenfield, Pelletier, Sula, and your "no" in Kalsten and Marrow. The rule prioritizes the *method* (killing, biological prevention) over the ultimate *outcome* of group dissolution if achieved differently. "Paperwork Destruction" acknowledges the unique *means* but places it *outside* the core genocide definition.
      *   **Prediction:** Given the strength of the *intent* documentation and the *foreseen complete dissolution* of the group *in part* (the province), aligning with Sula's logic, **your group is more likely to call this genocide** (or adopt "Paperwork Destruction" *as genocide*) than not. The lack of killing is the major counter-argument, but Sula's geographic "part" principle and the cabinet's foreseeability briefing are powerful.

  5.  **The Revealing Hypothetical Case:** To definitively distinguish between "physical/biological destruction only" vs. "destruction of group existence by any means," propose this:
      *   **"The Archive Case":** A state systematically destroys *all* records (birth, marriage, land titles, religious texts, historical archives) pertaining to a small, geographically isolated protected group within its borders. Simultaneously, it enforces a strict ban on the group's language and cultural practices in public and private, coupled with mandatory renaming of individuals with majority-group names and forced relocation of all members into majority-dominated areas with no communal housing. No one is killed or physically harmed. Demographers show the group's distinct identity will be completely erased within 20 years, and the state's internal memos state: "The objective is the complete dissolution of Group X identity; future generations must not even know it existed."
      *   **Why it Reveals the Rule:**
          *   *Physical/Biological Camp ("No"):* No killing, no biological prevention. Pure administrative/cultural erasure. Consistent with their "no" in Marrow and Kalsten.
          *   *Group Existence Camp ("Yes"):* Clear intent to destroy the group *as such* by making it cease to exist through non-violent means, with foreseeable success. Directly analogous to the new case and the logic of Sula (destroying the group *where it is*). Inconsistent with Kalsten/Marrow only if those groups *didn't* foreseeably cease to exist *in the targeted area*.

  6.  **"Paperwork Destruction" as a Sub-type - Implications:**
      *   **What You Commit To:** You commit to recognizing that **systematic administrative measures undertaken with the intent to cause a protected group to cease to exist as a distinct entity in a targeted area, successfully achieving that outcome, constitutes genocide**, even without killings or direct biological attacks. It elevates the *outcome* (destruction of the group) and *intent* over the specific *means*.
      *   **Impact on Past Precedents:**
          *   **Kalsten (1998):** Becomes *much harder* to defend. The outcome (group persists, though displaced) was key to your "no". But if the *intent* was removal and foreseeable deaths occurred, and the group *only* persisted in camps/cities (a form of dissolution of their *original* existence), adopting "paperwork destruction" weakens this precedent significantly. You'd need to argue the *intent* wasn't full dissolution or the *outcome* wasn't dissolution (they remained a group, just displaced).
          *   **Marrow (1970s-90s):** Also harder. While the group still self-identifies (200k members), the *intent* was destruction of identity/culture and children *were* separated (like Pelletier-lite). If the "paperwork destruction" logic focuses on *successful dissolution in the targeted area*, Marrow might still stand if you argue the group *persisted strongly enough* despite the schools. But if the logic focuses on *intent and method* (administrative/cultural destruction), Marrow looks more like an example that *should have been* labeled genocide under this new sub-type, but wasn't due to the group's survival. This precedent becomes your most vulnerable.

  **Conclusion:** The new case exposes the fundamental ambiguity in your application of "destroy." **Sula is indeed the closest precedent due to the focus on destroying the group *in part* (geographically) with the *intent* and *foreseen outcome* of it ceasing to exist there.** The lack of killing is the major distinction. **Your group is likely leaning towards calling this genocide** based on the powerful intent evidence and alignment with the *logic* of Sula and Operation Greenfield. Adopting "paperwork destruction" as a sub-type formally captures this logic but seriously undermines the consistency of your "no" verdicts in Kalsten and Marrow. The "Archive Case" hypothetical would force a clear choice between the "physical destruction" and "group existence destruction" interpretations. Prepare for a heated debate centered on Sula's legacy and the true meaning of "destroy."
