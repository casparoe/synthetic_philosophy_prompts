prompt: |-
  I serve on a university committee that reviews proposals for research involving human tissue. Last month the committee was enlarged from seven to nineteen members and we moved from a consensus requirement to a simple majority, and the member who pushed both changes defended them with an analogy: majority voting, he said, is just repeated measurement of the same quantity — each voter is one noisy instrument reading of the true answer, the noise is independent, the errors cancel, so a committee of nineteen stands to a committee of seven as nineteen measurements stand to seven. His conclusion was that we should always want more members and need not trouble ourselves much over how they are chosen.

  I am not persuaded, but I cannot yet say precisely where the picture fails, and I owe the committee a short written response before our next meeting. Please audit the analogy for me. Give the correspondence table — what plays the role of the instrument, the true value, the error, the repetitions, the calibration — and then the disanalogies, sorted by whether they actually matter for his conclusion. Two worry me most. First, a vote is a one-bit summary of a judgment, whereas a measurement reports a magnitude: does that quantization cost anything the analogy needs? Second, our members all read the same dossier and hear the same discussion, so their errors are not independent in the way coin flips are — yet I have heard it claimed that sharing evidence is harmless provided the residual errors are independent given the truth, and I want to know which of those is right and why. I would also like the distinction, if there is one, between a large committee's being very likely to be right and any particular addition's making it more likely to be right, and between adding a member who is barely better than chance and adding an expert. Nearly every decision we take is yes-or-no, so set aside the multi-option case unless the analogy quietly depends on it.

  Close by telling me what survives: does his practical conclusion hold, does it hold only under conditions we could actually impose on ourselves, and what, if anything, does the analogy still tell us about how the vote ought to be run? Please answer in American English.
reasoning: |-
  Hmm, the user is on a university committee that reviews human tissue research proposals. They've expanded from seven to nineteen members and switched from consensus to majority voting. One member argued that more members are like taking more measurements to reduce noise, so they should always want more members without worrying about selection. The user isn't convinced and needs help auditing this analogy for a written response.

  The core analogy is that each voter is like a noisy instrument measuring the "true" correct decision. More voters mean more independent measurements, reducing error through averaging. I need to map this to the voting context: the instrument is each committee member, the true value is the correct decision about the proposal, errors are mistakes in judgment, and repetitions are multiple votes. Calibration would be how well members are trained to avoid systematic biases.

  But there are key disanalogies. First, votes are binary (yes/no), not continuous measurements. Quantization loses information and makes averaging less effective. With binary outcomes, majority voting approaches the correct answer only if each member is more than 50% accurate. If they're worse than chance, more members make things worse. This matters because adding incompetent members could harm decision quality.

  Second, errors aren't independent. Committee members share evidence and discuss, so their judgments are correlated. Even if residual errors are independent given the truth, in practice, shared biases (like disciplinary perspectives) create dependence. This correlation reduces the benefit of adding members. If errors are correlated, you need many more members to achieve the same error reduction as independent measurements.

  The user is worried about two specific points: quantization and error independence. They also want to know about adding barely competent members versus experts, and whether a large committee is likely right versus each addition helping.

  For the quantization issue, it does cost because binary decisions require each member to be competent. Adding someone barely better than chance helps little, while an expert helps more. The benefit of adding a member depends on their individual accuracy. The analogy assumes all instruments are equally good, but in reality, member quality varies.

  Independence is tricky. The claim that shared evidence is harmless if residual errors are independent given the truth is theoretically correct but unrealistic. In committees, discussions introduce social influences and common biases, making independence unlikely. So in practice, shared evidence probably increases correlation.

  Overall, the practical conclusion doesn't hold without conditions. More members aren't always better; quality and independence matter. The committee should focus on selecting competent, diverse members to minimize correlated biases. The analogy still suggests that under ideal conditions, more voters reduce error, but those conditions are hard to achieve.

  In the response, I'll structure it clearly: correspondence table, disanalogies (major and minor), and what survives. Emphasize that the member's conclusion is flawed because it ignores quantization effects and assumes unrealistic independence. Recommend focusing on member quality and processes to reduce bias.
answer: |-
  Below is a concise audit of the analogy, structured as requested. It addresses your core concerns about quantization and error independence, distinguishes key nuances, and clarifies what practical guidance survives. The response is in American English and tailored for committee discussion.

  ---

  ### **Correspondence Table**
  | Concept in Measurement            | Analog in Committee Voting        |
  |-----------------------------------|-----------------------------------|
  | **Instrument**                    | Individual committee member       |
  | **True Value**                    | The objectively correct decision (approve/reject) |
  | **Measurement**                   | A member's vote (Yes/No)          |
  | **Error**                         | A member's incorrect vote         |
  | **Repeated Measurements**         | Multiple votes on the same proposal |
  | **Calibration**                   | Member training/expertise         |
  | **Noise**                         | Random judgment errors            |
  | **Averaging**                     | Majority outcome                  |

  ---

  ### **Disanalogies: Why the Analogy Fails**  
  **I. Major Disanalogies (Undermine the Conclusion)**  
  1. **Quantization (1-Bit Output)**  
     - **Problem:** Votes are binary (Yes/No), not continuous measurements. This loses critical information about the *strength* or *confidence* of a member’s judgment.  
     - **Why It Matters:**  
       - Adding members only improves accuracy if each is **individually competent** (accuracy >50%). A member who is barely better than coin-flip (e.g., 51% accurate) adds negligible value. Adding an incompetent member (<50% accurate) actively *harms* outcomes.  
       - **Contrast:** In measurement, averaging continuous readings reduces error even if instruments are mediocre. Binary voting lacks this "error-smoothing" property.  

  2. **Error Dependence (Shared Evidence ≠ Independent Noise)**  
     - **Problem:** Members review the same materials and deliberate together. This creates **correlated errors** (e.g., groupthink, shared misconceptions, or dominant personalities swaying votes).  
     - **Why "Residual Independence" Fails in Practice:**  
       - The claim that "errors are independent given the truth" assumes all shared evidence is perfectly processed. In reality, cognitive biases (e.g., anchoring on a flawed argument) make errors *dependent* even after discussion.  
       - **Example:** If the dossier contains a subtle error, all members may overlook it, creating systemic (not independent) mistakes.  
     - **Impact:** Correlated errors destroy the "error cancellation" benefit. With high correlation, 19 members may perform no better than 7—or worse, if deliberation amplifies biases.  

  **II. Minor Disanalogies (Less Critical but Relevant)**  
  1. **No True Calibration:** Members aren’t "instruments" with known error rates. Expertise varies wildly, and we can’t objectively "calibrate" them.  
  2. **Noisy vs. Biased "Instruments":** Human judgments have systematic biases (e.g., ideological leanings), not just random noise. Adding more members amplifies biases if they’re correlated.  

  ---

  ### **Key Distinctions Clarified**  
  - **Likely Right vs. Adding a Member:**  
    A large committee is likely right *only if* members are competent *and* errors are weakly correlated. Adding a specific member helps only if they are sufficiently accurate (>50%) and their errors aren’t strongly correlated with the group’s.  
  - **Barely Competent vs. Expert:**  
    - Adding a "barely competent" member (e.g., 55% accurate) marginally improves outcomes but requires many such members to meaningfully reduce error.  
    - Adding a true expert (e.g., 80% accurate) significantly boosts accuracy, even in a large group.  

  ---

  ### **What Survives? Practical Conclusions**  
  The analogy’s core conclusion—"always add more members, selection doesn’t matter"—**does not hold** under real-world conditions. However, three insights remain useful:  
  1. **More members *can* help, but only under strict conditions:**  
     - Members must be **individually competent** (expected accuracy >50%).  
     - **Independence** must be actively preserved (e.g., anonymous votes, diverse expertise to break groupthink).  
  2. **Voting procedures matter:**  
     - Use **secret ballots** to reduce social pressure.  
     - **Structure discussions** to surface dissenting views *before* voting (e.g., assign a devil’s advocate).  
  3. **Quality > Quantity:**  
     Adding one highly expert member improves outcomes more than adding several mediocre ones. Prioritize expertise and cognitive diversity over headcount.  

  **Final Recommendation:** Reject the "always add members" argument. Focus on **member expertise** and **process design** (e.g., staggered terms, anonymous voting) to mitigate correlated errors. For your committee, 19 members may *reduce* decision quality if dilution or groupthink offsets gains from numbers.  

  ---  
  This audit equips you to challenge the analogy rigorously while offering actionable improvements. I've omitted multi-option cases as requested; the logic here applies squarely to binary decisions.
