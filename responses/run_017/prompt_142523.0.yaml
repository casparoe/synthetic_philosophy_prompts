     - Linearity for dependent gambles? Actually, we don't necessarily require linearity for arbitrary dependent gambles, but at least for this case: the value of X + Y, when Y = -X, must be 0. This is a minimal additivity requirement.

  4. **Sequential Consistency (Non-negotiable?):** In a sequential setting, the evaluation at a node should be consistent with the overall evaluation. Case (iv): If the agent pays about 0.69 to play the Pasadena game and the first toss is tails, then the conditional problem (which is a shifted Pasadena game) has a conditional expectation that is negative. The rule should not allow changing the convention (summation order) arbitrarily at different nodes in a way that leads to inconsistency. Specifically, if the same gamble appears at a different node, it should be evaluated the same way. Also, we must avoid money pumps: if the agent can be made to pay for a series of transactions that result in a net loss, that is unacceptable.

  5. **Handling of Conditional Convergence and Genuine Divergence (Non-negotiable for robustness):** The rule should handle both conditionally convergent series (like the Pasadena game) and genuinely divergent ones (like the St. Petersburg game or the one with positive terms only). Case (v) is a compound of the Pasadena game and an independent St. Petersburg game. The rule must be able to assign a value to such compounds.

  6. **Unbounded Utilities (Temperamental):** The rule should not require utilities to be bounded. Case (vi) is about tiny probabilities of enormous goods, and we want to be able to reason about them without imposing boundedness.

  7. **Determinacy of Value (Temperamental):** The rule should output a definite real number (or extended real) for each gamble? Or is a partial ordering sufficient? This is to be discussed.

  ## The Contradiction

  The physicist suspects that state-relabeling invariance, determinacy of a finite value, weak dominance, and additivity (across independent gambles) cannot all be had together. Let us see:

  - The Pasadena game (original) has a conditionally convergent series. By the rearrangement theorem, we can rearrange to get any real value. State-relabeling invariance requires that the value is the same regardless of the rearrangement. Therefore, if we require a definite finite value, then it must be the same for every rearrangement. But rearrangements can yield any real number. The only way out is to say that the value is not finite? Or that the value is undefined? But we want a definite value.

  - Also, if we require that the value is finite and the same for every rearrangement, then it must be a single number. But we know that rearrangements yield any number. Hence, the only possibility is to have the value undefined? But then we lose determinacy.

  - However, note: the requirement of state-relabeling invariance is about the distribution of the random variable. The rearrangement does not change the distribution of the payoff? Actually, it does: the payoff is a random variable. In the original Pasadena game, the payoff is defined as a function of the state (which is the toss number). When we rearrange the states, we are changing the state space, but the distribution of the payoff (the probability measure on the real numbers induced by the payoff function) remains the same? 

  Wait: in the rearrangement, we are reordering the states. But the payoff is a function of the state. If we permute the states, then the payoff function changes? Actually, the payoff function is defined on the state space. When we rearrange the states, we are effectively composing the payoff function with a permutation of the state space. This permutation is measure-preserving. Therefore, the distribution of the payoff (i.e., the induced probability measure on the reals) is unchanged. 

  Therefore, state-relabeling invariance requires that two gambles that have the same distribution (i.e., the same payoff distribution) must have the same value. So the rule should depend only on the distribution of the payoff.

  But note: the Pasadena game has a specific distribution. The probability that the payoff is (-1)^{n-1} * 2^n/n is 1/2^n for n=1,2,3,... Therefore, the distribution is fixed. So the value must be fixed. However, the expectation is conditionally convergent, and we know that the expectation is not defined in the usual sense because the series is not absolutely convergent. But if we require a definite value, then we must assign a specific number to this distribution. 

  But which number? The series can be rearranged to any real number. However, note that the expectation is defined as the integral of the payoff with respect to the probability measure. The integral is defined only for absolutely integrable random variables. For non-absolutely integrable ones, we don't have a definition. So the problem is that we want to assign a value to a gamble that does not have an expectation in the Lebesgue sense.

  The requirement of state-relabeling invariance (i.e., dependence on the distribution) is non-negotiable. But then the value must be a function of the distribution. However, the alternating series does not have a unique rearrangement. But note: the distribution does not depend on the rearrangement. The distribution is fixed. The problem is that the expectation is not defined by the Lebesgue integral. Therefore, we must use a different notion of expectation.

  But the physicist's cut-off method: if we introduce a cut-off, we get a finite value that depends on the cut-off. The hope is that as the cut-off goes to infinity, the finite part does not depend on the cut-off. But in the Pasadena game, it does: the partial sum oscillates and does not converge. So the cut-off method does not yield a unique value.

  Therefore, the contradiction: we cannot assign a definite finite value that depends only on the distribution and satisfies the other requirements? 

  But note: the requirement of weak dominance and the case (i) (adding $1) must be strictly preferred. So we need to assign a value that is higher for the Pasadena+1 than for the Pasadena. But if the Pasadena is undefined, then how do we compare?

  So the only way out might be to have a partial ordering: we can say that Pasadena+1 is better than Pasadena without assigning numbers. But then we lose the ability to assign a number for pricing.

  ## The Cases

  We must ensure the rule handles:

  (i) Pasadena game vs Pasadena game plus $1: the latter must be strictly preferred.

  (ii) The same gamble (same distribution) rearranged to yield a different series: must have the same value. This is state-relabeling invariance.

  (iii) The Pasadena game and its mirror image: the combination is 0. So the value must be 0. This requires additivity: value(X) + value(-X) = value(0) = 0.

  (iv) Sequential version: after the first toss is tails, the conditional gamble is a shifted version. The overall evaluation must be consistent with the conditional evaluations. Also, we must avoid money pumps: if the bookie can re-describe the same gamble and the agent uses a different convention, then the bookie might extract money. Therefore, the convention must be fixed in advance and used consistently.

  (v) Compound of Pasadena and St. Petersburg: the St. Petersburg has positive terms and diverges to +infty. The Pasadena is conditionally convergent. The rule must assign a value to the compound.

  (vi) Tiny probabilities of enormous goods: the rule should not require bounded utilities.

  ## Output: Number or Partial Ordering?

  The physicist asks: should the rule output a number or only a partial ordering? The advantage of a number is that it can be used to set a price. The disadvantage is that it invites a money pump if the numbers are not consistent. In the Pasadena game, if we assign a finite number, then we can set a price. But then, if we rearrange the states and get a different number, we might be willing to buy at one price and sell at another, leading to a money pump. Therefore, if we require state-relabeling invariance and also assign a number, then we avoid the pump. But if we cannot assign a definite number (because of the conditional convergence), then we cannot avoid the pump? 

  Therefore, if we insist on state-relabeling invariance and a definite number, then we must assign the same number to the same distribution. But for the Pasadena distribution, what number? The only number that is invariant under rearrangement? But rearrangements yield any real number. Hence, the only invariant is that the series is conditionally convergent? But that doesn't give a number.

  Alternatively, we might use a privileged summation method, such as the principal value (the sum in the natural order). That yields ln(2). But that violates state-relabeling invariance? Because if we rearrange the states, the natural order changes? But note: the state space is abstract. The natural order (by the toss number) is a particular labeling. If we rearrange the states arbitrarily, then the natural order is destroyed. But the distribution is the same. Therefore, if we use the natural order, we are effectively fixing a particular labeling. So that violates state-relabeling invariance.

  Hence, the contradiction: if we require state-relabeling invariance, then we cannot use a privileged order. Therefore, we cannot assign a definite number by the natural order. And since rearrangements give any number, we cannot assign a definite number at all. Hence, the rule cannot output a number for the Pasadena game? Then we must use a partial ordering.

  But then how do we handle case (i)? We can still say that Pasadena+1 is better than Pasadena by weak dominance. Similarly, we can say that the combination in (iii) is zero by additivity? But without numbers, how do we define additivity? We can define additivity for independent gambles? But the Pasadena and its mirror are dependent (defined on the same state space). 

  Alternatively, we can say that the rule outputs an extended real number for each gamble, but it might be undefined for some gambles. Then, for the Pasadena game, the value is undefined. Then we can still have a partial ordering: we can compare some gambles even when their values are undefined. For example, by dominance.

  ## How Familiar Families Fare

  1. **Bounded Utility:** Requires utility to be bounded. Then the expectation is defined (by the Lebesgue integral). The Pasadena game becomes integrable? Actually, with bounded utility, the payoff is transformed by a bounded function, so the expectation exists. But the physicist does not want this because it refuses to handle unbounded utilities. Case (vi) is not handled as desired.

  2. **Privileged Summation (Principal Value):** Uses a particular order (e.g., the natural order) to sum the series. Then the Pasadena game is ln(2). This fails state-relabeling invariance: if we rearrange the states, we get a different value. Thus, it violates requirement (ii). Also, it is vulnerable to money pumps: an agent using this rule might be exploited by a bookie who reorders the states.

  3. **Difference against Status Quo:** Evaluates the difference from a status quo. Hopes that the difference is integrable. But in the Pasadena game, the status quo might be 0, and then the difference is the payoff itself, which is not integrable. So it doesn't help. Also, the rearrangement issue remains.

  4. **Dominance as Primitive (No Numerical Valuation):** Only a partial ordering. Then we can have weak dominance and state-relabeling invariance (since it depends only on the distribution). But we lose the ability to assign a price. Also, additivity might be hard to define. For example, in case (iii), we know the combination is 0, but how do we relate that to the individual gambles? We would need to say that the combination is indifferent to 0, but without numbers, we cannot say that the sum of the values is 0. However, we can define an additive rule on a subset of gambles that are integrable, and then for the Pasadena and its mirror, we can note that their combination is 0. But the individual gambles are not comparable to 0? 

