     This approach might be the most promising for avoiding contradictions, but it is limited.

  5. **Nonstandard or Infinitesimal Values:** Assigns to the Pasadena game an infinitesimal or an infinite number? But the series is conditionally convergent, so it is finite. Also, rearrangements yield different finite numbers. So nonstandard numbers don't help per se. However, one might use a nonstandard model that fixes a particular ultrafilter (which effectively fixes a particular summation order). But that would violate state-relabeling invariance.

  ## The Cut-off Analogy

  In physics, the cut-off method is tested empirically: if two regularizations predict different numbers for the same measurement, they are wrong. In decision theory, there is no empirical measurement. The constraints are internal consistency (avoiding money pumps, respecting dominance) and invariance (state-relabeling). Therefore, the choice among rules is a matter of temperament in the sense that we must choose which requirements to drop. The absence of an empirical test means that we are in the realm of normative decision theory: what rules we ought to follow. However, the requirements of weak dominance and state-relabeling invariance (if accepted) are non-negotiable, and they push toward a partial ordering without definite values for non-integrable gambles.

  ## Specification

  After this analysis, we can write the specification.

  ### Requirements

  1. **Weak Dominance (Non-negotiable):** If gamble A dominates gamble B weakly (and strictly in some state with positive probability), then A is strictly preferred to B. (Case (i))

  2. **State-Relabeling Invariance (Non-negotiable):** The evaluation depends only on the distribution of the payoff. That is, two gambles with the same distribution must be assigned the same value (or the same place in the ordering). (Case (ii))

  3. **Additivity for Certain Combinations (Non-negotiable):** The constant 0 gamble is valued at 0. If two gambles X and Y are such that X + Y = 0 (identically), then the value of X and Y must satisfy value(X) + value(Y) = 0. (Case (iii)) More generally, if X and Y are independent and have defined values, then value(X+Y) = value(X)+value(Y). But this might be extended as much as possible.

  4. **Sequential Consistency and No Money Pumps (Non-negotiable):** The rule must be consistent across time and under conditioning. In particular, if the same subgamble appears at two different nodes, it must be evaluated the same way. Also, the rule must not allow a bookie to extract money by re-describing the same gamble. (Case (iv))

  5. **Handling Unbounded Utilities (Temperamental):** The rule must not require utilities to be bounded. (Case (vi))

  6. **Robustness to Compounds (Non-negotiable):** The rule must assign a value (or a place in the ordering) to compounds of conditionally convergent and divergent gambles. (Case (v))

  7. **Output (Temperamental):** The rule may output a partial ordering. If it outputs a numerical value, then it must be consistent with the partial ordering and satisfy the above. But given the contradiction, it might be necessary to allow undefined values for some gambles.

  ### Contradiction Location

  The contradiction arises between:
  - State-relabeling invariance (requirement 2) 
  - The desire for a definite finite value for every gamble (which is temperamental)
  - Additivity (requirement 3) for the Pasadena and its mirror

  Specifically: 
  - By state-relabeling invariance, the value of the Pasadena game must be a function of its distribution. 
  - By additivity, if we let X be the Pasadena game, then value(X) + value(-X) = 0.
  - But by state-relabeling invariance, value(-X) = -value(X)? Not necessarily: the distribution of -X is the same as the distribution of X? Actually, no: the distribution of the original Pasadena game is symmetric? Let's see: the payoff at state n is (-1)^{n-1} * 2^n/n. The distribution of -X is: at state n, the payoff is -(-1)^{n-1} * 2^n/n = (-1)^n * 2^n/n. This is exactly the payoff of the Pasadena game starting with a negative term. So it is not the same distribution. In fact, the mirror image has a different distribution. Therefore, we cannot directly apply state-relabeling invariance to conclude that value(-X) is the negative of value(X). 

  But note: the combination of X and -X is identically zero. So we require value(X+(-X)) = value(0)=0. But without linearity, we cannot split value(X+(-X)) into value(X)+value(-X). Therefore, requirement 3 only requires that the combination is valued at 0, but it does not require value(X)+value(-X)=0. 

  So the additivity requirement in case (iii) is only that the combined gamble is 0. That does not force a relation between value(X) and value(-X). Therefore, there is no immediate contradiction. 

  But then what about the rearrangement? The main contradiction is between state-relabeling invariance and the assignment of a definite finite value. Because the same distribution (by rearrangement) would have to be assigned the same value, but the rearrangement can be chosen to yield any value. Therefore, the only way to have state-relabeling invariance is to have the value undefined. 

  Therefore, the rule must allow undefined values for gambles that are not absolutely integrable. 

  Then, we can have a partial ordering: we can compare gambles by dominance, and also by other criteria, but not assign a number to every gamble.

  ### The Most Excluding Requirement

  The requirement that does the most work in excluding candidates is **state-relabeling invariance**. It forces us to depend only on the distribution and thus forbids the use of a privileged order for summation.

  ## Final Brief on Families

  1. **Bounded Utility:** Avoids the problem by assumption. Fails case (vi) (unbounded utilities desired).

  2. **Privileged Summation (Principal Value):** Violates state-relabeling invariance (case (ii)) and is vulnerable to money pumps.

  3. **Difference against Status Quo:** May not resolve the non-integrability and still fails state-relabeling invariance.

  4. **Dominance as Primitive (Partial Ordering):** Can satisfy non-negotiable requirements 1, 2, 4, and 6. Additivity (requirement 3) is handled by noting that the combined gamble is 0, so it is indifferent to 0. But without numbers, we cannot express the value of the individual parts. This approach seems viable.

  5. **Nonstandard Values:** May violate state-relabeling invariance if the nonstandard model fixes a particular order. Also, it is unclear how it handles rearrangement.

  ## Cut-off Analogy

  The cut-off analogy helps in showing that for a conditionally convergent series, the partial sums do not converge. Therefore, we cannot assign a unique value. The analogy misleads because in physics, we have an empirical check to discard cut-off dependent terms. In decision theory, we lack empirical data and must rely on internal consistency. Therefore, the absence of an empirical constraint means that we must choose which internal requirements to uphold, and which to relax, leading to a plurality of approaches. However, the non-negotiable requirements (weak dominance, state-relabeling invariance, sequential consistency) are driven by rationality considerations and are not merely matters of taste.
answer: |-
  ### Specification for a Rule to Evaluate or Rank Gambles with Undefined Expectations

  Your demand for an explicit discipline, analogous to physics' regularization and renormalization, is well-founded. The core challenge is that the expectation integral (as a Lebesgue integral) is undefined for gambles like the Pasadena game due to conditional convergence or non-integrability. A rule must navigate this while guiding rational choice. Below, I specify requirements, flagging non-negotiable principles (grounded in rationality) versus temperamental preferences (reflecting normative stances). I then address your cases, locate contradictions, discuss output forms, evaluate familiar families, and assess the cut-off analogy.

  #### Requirements for an Adequate Rule
  1. **Weak Dominance (Non-negotiable)**  
     If gamble \(A\) pays at least as much as gamble \(B\) in every state and strictly more in a set of positive probability, then \(A \succ B\).  
     *Case*: Your case (i)—Pasadena game plus $1 dominates the original and must be strictly preferred. Violating this allows dominated choices, violating rationality.

  2. **State-Relabeling Invariance (Non-negotiable)**  
     The evaluation must depend only on the probability distribution of outcomes, not the labeling or ordering of states.  
     *Case*: Your case (ii)—rearranging states to yield \(+100\) via a permuted summation must not change the gamble's value. This is the decision-theoretic analogue of coordinate independence in physics. Without it, the rule is sensitive to arbitrary descriptions, inviting exploitation.

  3. **Additivity for Independent Gambles (Non-negotiable)**  
     If \(X\) and \(Y\) are independent gambles, then \(V(X + Y) = V(X) + V(Y)\), where \(V\) is the evaluation function.  
     *Case*: Your case (iii)—the Pasadena game combined with its mirror image (paying \(-X\) in every state) has a constant payoff of \(0\), so \(V(X + (-X)) = V(0) = 0\). This ensures internal consistency. Additivity is weakened to independence to avoid Dutch books.

  4. **Sequential Consistency (Non-negotiable)**  
     Evaluations must be consistent across subgames (nodes) as uncertainty resolves. The rule must not permit changing conventions (e.g., summation orders) at different nodes if it leads to incoherence.  
     *Case*: Your case (iv)—after a tail in the Pasadena game, the conditional subgame must be evaluated using the same convention as the ex-ante rule. If conventions shift, a bookie can re-describe holdings and pump money via sequential trades (e.g., buying low and selling high based on node-specific "values").

  5. **Robustness to Pathological Composites (Non-negotiable)**  
     The rule must handle:  
     - Conditionally convergent gambles (e.g., Pasadena).  
     - Genuinely divergent gambles (e.g., St. Petersburg, with \(+\infty\) expectation).  
     - Their independent combinations.  
     *Case*: Your case (v)—a compound of Pasadena and St. Petersburg must receive a determinate evaluation (or ranking). Failure here limits applicability to real-world uncertainties.

  6. **Compatibility with Unbounded Utilities (Temperamental)**  
     The rule must not require bounded utility functions.  
     *Case*: Your case (vi)—tiny probabilities of enormous goods (e.g., Pascal's Wager) must be evaluable without ad hoc bounds. Boundedness is a temperamental escape; it secures integrability but refuses to engage with extreme tail events central to policy.

  7. **Determinacy (Temperamental)**  
     The rule *should* output a finite real number (or extended real) for each gamble, enabling pricing. However, a partial ordering may suffice if determinacy causes inconsistencies.  
     *Rationale*: Numbers aid one-off choices and policy; but insistence on them may force violations of other requirements (see §Contradiction).

  #### The Critical Requirement: State-Relabeling Invariance
  This does the most work in excluding candidates. It forbids:  
  - **Privileged summation orders** (e.g., natural order yielding \(\ln 2\) for Pasadena), as reordering states changes the "expectation."  
  - **Cut-off-dependent methods**, as the finite part often depends on the cut-off scheme (e.g., truncating at \(N\) terms gives oscillations, not convergence).  
  - **Nonstandard analysis**, if it relies on state-dependent hyperreal mappings.  
  This invariance is non-negotiable; without it, the rule is manipulable by redescriptions.

  #### Handling Your Cases
  - **(i) Pasadena + \$1**: Weak dominance demands strict preference. Non-negotiable.  
  - **(ii) Re-presented Pasadena**: State-relabeling invariance forces identical evaluation. Non-negotiable.  
  - **(iii) Pasadena + Mirror**: Additivity requires \(V = 0\). Non-negotiable.  
  - **(iv) Sequential Pasadena**: Consistency fixes conventions across nodes. If agents change conventions, bookies can pump money (e.g., after a tail, "buy" the subgame at a high price based on ex-ante \(\ln 2\), then "sell" at the conditional \(-0.61\)). Non-negotiable.  
  - **(v) Pasadena + St. Petersburg**: Robustness requires handling this composite. The St. Petersburg component (\(+\infty\)) may dominate, but the rule must specify how. Non-negotiable.  
  - **(vi) Tiny probability, enormous good**: Compatibility with unbounded utilities ensures engagement. Temperamental but critical for policy.

  #### Contradiction in Requirements
  State-relabeling invariance, determinacy (finite value), weak dominance, and additivity **cannot all hold**. The contradiction is precise:  
  - State-relabeling invariance requires that \(V\) depends only on the outcome distribution.  
  - For Pasadena, the distribution is fixed, but the expectation integral is undefined (conditional convergence).  
  - If we assign a determinate finite value (e.g., \(\ln 2\) via natural order), it violates state-relabeling invariance—rearranged states yield any real number.  
  - Additivity then fails: if the mirror game is valued at \(-\ln 2\), their sum is \(0\), but the same sum could be \(100 + (-100) = 0\) under a different presentation, exposing inconsistency.  
  - Weak dominance still holds (e.g., Pasadena + \$1 \succ Pasadena), but it cannot resolve the indeterminacy.  
  **Resolution**: Drop determinacy or weaken additivity. A partial ordering can satisfy all non-negotiables except determinacy.

  #### Should the Rule Output a Number?
  - **For a number**: Enables pricing and policy math but risks money pumps if state-relabeling invariance is violated (e.g., agent buys at \(\ln 2\), bookie rearranges states to yield \(-100\), then sells back at a loss).  
  - **For a partial ordering**: Avoids pumps and satisfies non-negotiables but may not guide all choices (e.g., no price for Pasadena).  
  Given the contradiction, **temperament dictates choice**: Numbers if you prize pricing and accept convention-dependence; partial orderings if you prize invariance and accept incompleteness.

  #### Evaluation of Familiar Families (in Brief)
  - **Bounded Utility**:  
    *Fare*: Avoids non-integrability by assumption. Passes (i)–(v) but fails (vi) (unbounded utilities). Non-starter for you—rejects extreme stakes.  
  - **Privileged Summation (e.g., \(\ln 2\) for Pasadena)**:  
    *Fare*: Fails state-relabeling invariance (ii) and sequential consistency (iv). Bookies exploit via re-description. Determinacy at high cost.  
  - **Difference Against Status Quo**:  
    *Fare*: Evaluates changes from a baseline. May pass (i) but fails (ii)–(iii) if the difference gamble is non-integrable. Inadequate for Pasadena.  
  - **Dominance as Primitive (No Numbers)**:  
    *Fare*: Partial ordering satisfies all non-negotiables. Passes (i)–(vi) but cannot price gambles. Best for invariance purists.  
  - **Nonstandard/Infinitesimal Values**:  
    *Fare*: Assigns hyperreals (e.g., Pasadena as \(\ln 2 + \epsilon\)). Fails state-relabeling invariance if \(\epsilon\) is order-dependent. Risks arbitrage in sequential trades.

  #### Cut-off Analogy: Helps and Misleads
  - **Helps**:  
    Cut-offs isolate finite approximations. In physics, empirical success justifies discarding divergent parts. Here, finite \(N\)-truncations of Pasadena oscillate but can inform *robust* rules (e.g., median or stochastic dominance over cut-offs).  
  - **Misleads**:  
    Physics has empirical validation; decision theory has only internal consistency. Without measurement, we cannot "test" rules—e.g., no experiment says Pasadena "should" be \(\ln 2\). The constraint is coherence (no Dutch books, no dominance violations), not data.  
    **Implication**: Choice among rules **is temperamental**. Purists (you?) demand invariance and coherence, accepting partial orderings. Pragmatists accept conventions (e.g., natural order) for determinacy, risking exploitation. No uniquely "correct" solution exists, but the non-negotiables (dominance, invariance, additivity, consistency) must bind any candidate.
