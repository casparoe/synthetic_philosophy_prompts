  We are to specify requirements for a rule that evaluates or ranks gambles with possibly undefined expectations. The primary example is the Pasadena game and its variants. The goal is to have a rule that can guide one-off choices, sequential choices as uncertainty resolves, and policy reasoning (with very small probabilities and large values). We are to list requirements, flagging which are non-negotiable and which are temperamental, and identify the most critical requirement for excluding candidates. We are also to address the cases provided and then briefly discuss how familiar families of solutions fare.

  ## Requirements for a Rule

  1. **Weak Dominance (Non-negotiable):** If gamble A pays at least as much as gamble B in every state and strictly more in some state with positive probability, then A is strictly preferred to B. This is a fundamental rationality principle. The case (i) (Pasadena game plus $1) must be strictly preferred to the original.

  2. **State-Relabeling Invariance (Non-negotiable?):** The evaluation of a gamble should not depend on how the states are labeled. That is, if we have a measure-preserving rearrangement of the state space (with the same probabilities and payoffs), then the value assigned should be the same. This is analogous to coordinate independence in physics. Case (ii) is critical: the same gamble rearranged to yield +100 by a different summation order must be evaluated the same as the original. However, note that in the rearranged state space, the gamble is the same random variable (in distribution) but the state-by-state assignment is different. So the requirement is that the rule depends only on the distribution of the payoff and the probabilities, not on the labeling of states. This is a strong requirement and may be the one that does the most work in excluding candidates.

  3. **Additivity for Independent Gambles (Temperamental?):** If two gambles are independent, then the value of holding both should be the sum of their individual values. Case (iii) (the Pasadena game and its mirror image) must be valued at zero. However, note that the two gambles are not independent in the usual sense? Actually, they are defined on the same state space? The case states: "the pair is worth precisely zero whatever happens". This suggests that the combined gamble is identically zero. So we require that the value of a gamble that is identically zero is zero. Also, if we have two gambles that are independent and one is the negative of the other, then the combined gamble should be zero. But note: the Pasadena game and its mirror image are defined on the same state space? Actually, the mirror image is defined as paying the negative in every state. So if we have a state space, and in each state, the payoff of the first gamble is X(s) and the second is -X(s), then the combined payoff is 0. This is a form of linearity: the value of X + (-X) must be the value of 0, which is 0. So we require:
