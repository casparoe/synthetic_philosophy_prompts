prompt: |-
  I sit on the methods committee of a psychology journal that is rewriting its editorial policy, and I keep coming back to a norm that nearly everyone in my field accepts but that nobody on the committee can state precisely. The norm is that a hypothesis earns much less confirmatory credit if it was formulated after the investigators saw the data. Concretely: we run "registered reports," in which the design and analysis plan are peer-reviewed and time-stamped before data collection and the paper is accepted in principle whatever comes out; we treat hypotheses reverse-engineered out of a finished dataset — the thing the methodological literature calls HARKing — as nearly worthless as evidence, even when the fit the authors report is excellent and would have impressed us if it had been predicted in advance; and we are now toying with making this quantitative, by attaching to every piece of evidence a "novelty weight" between 0 and 1, set by how much of the hypothesis was fixed in a sealed archive before the data existed, to be multiplied into whatever evidential score the study would otherwise receive. What puzzles me is that the same community, in the same breath, treats explaining facts that were already on the books as the highest form of scientific achievement. Biologists still cite it as the strength of a unifying theory that it accounts for a pile of previously unrelated, long-known findings — anatomical homologies, island distributions, the sequence of forms in the fossil record — none of which anyone predicted. Physicists treat the recovery of Mercury's anomalous perihelion precession, a discrepancy of a few dozen arcseconds per century that had been on the books since 1859, as a triumph of general relativity rather than a discount. And in astronomy and genomics, purely exploratory work — dredge the survey, spot the pattern, then think of the mechanism — is normal, prestigious practice rather than a scandal. We seem to be doing X on Tuesdays and Y on Thursdays.

  A colleague says this is all one worry in disguise, and I cannot tell whether she is right. As I see it there are three candidate worries the norm might be tracking. First, that the fact was already known before the theory existed — the sheer "oldness" of the evidence, which is what people are pointing at when they note that on a straightforward Bayesian picture the evidence already has probability 1 for you, so conditioning on it cannot move you at all, the familiar complaint that probabilistic confirmation theory has trouble with old evidence. Second, that the data did double duty, being used to construct the hypothesis and then again to test it — the worry you get from a large hypothesis space plus an unblinded search, where with enough candidate hypotheses some of them will fit any dataset you like. Third, that the hypothesis could have been read off the old data by anyone who had the data and some ingenuity, whether or not it actually was; I have been calling this the "derivability audit," and my hunch is that it, rather than oldness or double-duty, is the thing our novelty weight ought really to be estimating. Are these three the same worry in different clothes, or genuinely different ones, and which of them does our actual practice track? More to the point: what would my committee be committing itself to by adopting the novelty weight? Would we have to hold that confirmation is not a two-place relation between a hypothesis and a body of evidence but a three-place one that also takes in the order of inquiry and who knew what when? Would we have to hold something irreducibly non-probabilistic — for instance, that a theory's explanatory unification of already-known facts is evidence in its own right, and not merely a symptom of a favourable likelihood ratio? Or is there a reading on which the whole policy is consistent with an austere probabilism: pre-registration as a mere instrument for keeping the effective hypothesis space and the reported likelihood honest, and old evidence handled by conditioning on the discovery that the theory entails the fact, or by reinstating the probability one would have assigned the fact before one learned it?

  Please write your answer in the following six sections, with roughly these lengths: "The implicit theory" (about 300 words) — reconstruct as charitably as you can the view of evidence and confirmation that this editorial practice only makes sense under; "Strict presuppositions vs. convenient fits" (about 150 words) — separate what the practice cannot survive without from what it merely sits well with; "Oldness, double-duty, derivability" (about 250 words) — say whether the three worries coincide and which one the practice is actually tracking, with the case that discriminates between them; "The novelty weight" (about 200 words) — whether a single scalar is even coherent here, what a derivability audit would have to measure, and whether that is measurable in practice; "Under a strict probabilist picture" (about 200 words) — what would concretely have to change in editorial practice if we went Bayesian through and through, including anything we would have to stop doing; and "Bottom line" (about 80 words) — one recommendation to the committee, and the single sub-question on which it turns.
reasoning: |-
  Hmm, the user is part of a psychology journal's methods committee grappling with a fundamental tension in scientific epistemology. They've noticed their field treats pre-registered hypotheses as gold standard while other sciences celebrate post-hoc explanations of existing data. They've identified three potential concerns behind their norm: old evidence, double-use of data, and derivability from data. 

  The core puzzle is whether these concerns are distinct or intertwined, and what philosophical commitments their "novelty weight" proposal would entail. They're clearly wrestling with how to reconcile Bayesian confirmation theory with actual scientific practice across disciplines. 

  I notice their analysis is remarkably sophisticated - they've already mapped out the key philosophical dilemmas: whether confirmation requires temporal sequencing, whether explanatory unification provides independent epistemic value, and whether probabilistic frameworks can accommodate this. Their colleague's suggestion that this might be "one worry in disguise" seems insightful - perhaps all three concerns reduce to derivability. 

  For astronomy's exploratory approach to be valid while HARKing is condemned, the difference must lie in whether the pattern was extractable from that specific dataset with standard tools. Mercury's perihelion wasn't derivable from existing data before GR - it required Einstein's novel mathematics. 

  The novelty weight proposal risks oversimplifying - derivability isn't scalar but binary at its core (could a competent researcher have extracted this?). And in practice, auditing derivability would require specifying counterfactual analytical paths, which gets messy fast. 

  A strict Bayesian approach would force uncomfortable changes: either abandoning the distinction between prediction and postdiction, or adopting complex "counterfactual probability" maneuvers that journals couldn't reasonably implement. 

  The bottom line recommendation should preserve the spirit of their norm while acknowledging that derivability is the real concern. They should treat novelty not as a weight but as a threshold - if the hypothesis was demonstrably extractable from that dataset using standard methods, it gets downgraded.
answer: |-
  ### The implicit theory
  The editorial practice rests on a view where *evidential novelty* anchors confirmatory strength. Evidence confirms best when it uniquely constrains the hypothesis space *before* data inspection. This treats scientific inquiry as a wager: hypotheses gain credence when they risk falsification against unobserved data. The core idea is that *procedural history* affects epistemic weight because it guards against *overfitting*—not just statistical, but cognitive. When hypotheses are pre-specified, their fit with data reflects underlying truth; when reverse-engineered, fit may reflect the researcher’s flexibility in reinterpreting noise or mining correlations. Crucially, this view elevates *prediction* over *accommodation*: explaining known facts is valued only if those facts were not instrumental in constructing the theory. The Mercury perihelion or homologies are celebrated because they were *not* used to build relativity or evolution; they were independent puzzles solved by a theory conceived without them. Thus, confirmation is inherently *diachronic*—order matters because it determines whether data could have influenced hypothesis formation.

  ### Strict presuppositions vs. convenient fits
  **Essential:** The practice cannot survive without the core tenet that *hypotheses tailored to data have inflated apparent fit*. This assumes (1) researchers can unconsciously or strategically adjust hypotheses to match noise/patterns in *specific* datasets, and (2) such adjustments inflate evidence relative to truth. Rejecting this collapses the norm.  
  **Compatible but non-essential:** It sits well with Bayesianism (if likelihoods are distorted by data-peeking) or falsificationism (post-hoc hypotheses evade Popperian risk). It does *not* require explanatory unification to be non-probabilistic or confirmation to be three-place—these are optional enrichments.

  ### Oldness, double-duty, derivability
  These are distinct but related concerns. **Oldness** (known evidence) is not the issue: GR’s confirmation from Mercury’s precession works because the anomaly wasn’t used to *build* GR—it was a surprise entailment. **Double-duty** (using data for both construction and testing) is critical for HARKing but insufficient: if a hypothesis *could not* have been derived from existing data (e.g., dark energy from cosmic acceleration), its post-hoc status doesn’t diminish it. The key is **derivability**: *Could the hypothesis have been extracted from this dataset with available tools?*  
  **Discriminating case:** Einstein’s explanation of Mercury’s precession. The data was old (1859), but GR was *not* reverse-engineered from it—it emerged from fundamental principles. A "derivability audit" would show Mercury’s data alone couldn’t yield GR’s field equations. Conversely, HARKed hypotheses fail this audit: they *are* derivable from their dataset via routine stats. Practice tracks derivability.

  ### The novelty weight
  A single scalar is **incoherent** for derivability, which is binary: either a hypothesis was extractable from the data (discount) or not (no discount). What matters is whether, *given the dataset and standard analytic methods*, a competent researcher *could* have formulated the hypothesis. Measuring this requires auditing:  
  1. **Specify the dataset and tools** available at hypothesis formulation.  
  2. **Judge if standard operations** (regression, clustering, etc.) could produce the hypothesis from that data.  
  This is **feasible but laborious**—e.g., checking if a gene-disease link emerged from a GWAS with obvious SNPs. Journals could implement it via blinded hypothesis-validity panels.

  ### Under a strict probabilist picture
  A strict Bayesian would:  
  1. **Reject novelty weights** as psychologistic. Evidence is P(e|h)/P(e|~h)—history is irrelevant.  
  2. **Handle double-duty** by adjusting likelihoods: P(e|h) drops if h was optimized for e.  
  3. **Address old evidence** via counterfactual priors (e.g., What *would* P(e) have been before knowing e?).  
  **Concrete changes:**  
  - **Stop** penalizing post-hoc hypotheses solely for timing.  
  - **Discount fit** only when hypothesis space was large and search unblinded (quantifying "voodoo correlations").  
  - **Accept** that explaining old data *is* evidence if P(e|h) >> P(e|~h), regardless of history.  
  Pre-registration becomes a tool to *measure* true likelihoods, not a virtue in itself.

  ### Bottom line
  **Recommendation:** Reject the novelty weight. Instead, adopt a *derivability audit*: downgrade hypotheses only if they could have been reconstructed from their dataset using standard methods. This preserves the norm’s intent without Bayesian incompatibility.  
  **Turning point:** Does the committee believe *derivability from specific data* (not oldness or timing) is the true threat? If yes, the audit aligns with probabilism by targeting inflated likelihoods. If not, they risk metaphysical historicism.
