  Okay, let me start by unpacking the user's query. They're a PhD student in political theory working on moralized political conflict. Their dissertation focuses on the disconnect between the reasons people give for their positions and their actual reactions. They've collected data from open-ended responses on three contested issues and noticed a pattern they can't name. 

  First, they mention that the reasons people provide have become homogeneous, centered around harm, welfare, and equality. But these reasons don't align with their deeper motivations, which might be about order, loyalty, or integrity. Even though everyone uses the same vocabulary, their positions have polarized further. 

  Second, instead of shared reasons leading to convergence, each side accuses the other of bad faith. Since the opponents use the same moral framework but reach different conclusions, each assumes the other is insincere. This isn't just strategic reframing because it's often unconscious and costly in terms of audience appeal. 

  The user has ruled out deliberate repackaging and post-hoc confabulation. They need a term for this phenomenon or a new one if none exists. They also want to understand its implications for using shared reasons as neutral grounds for resolving disputes.

  I need to recall relevant concepts. Moral foundations theory comes to mind, where harm and fairness are liberal foundations, while loyalty, authority, and sanctity are conservative. But the user's observation is that conservatives are adopting liberal language without changing their stance. That's interesting. 

  Then there's concept creep, where terms like harm expand in meaning. But here, it's not just expansion; it's a shift in vocabulary while underlying values stay the same. Also, the asymmetry—why are conservatives adopting liberal language and not vice versa? That might relate to the cultural dominance of harm-based discourse.

  Motivated reasoning could be part of it, but the user notes it's not just confabulation. The key is the unidirectional shift and resulting polarization. The bad faith attributions are crucial here. Each side thinks the other is dishonest because their reasons don't align with conclusions. 

  Looking for existing terms: "Moral camouflage" or "discursive assimilation" come close, but maybe not exact. "Rhetorical displacement" might capture the replacement of native reasons with another's framework. But the user wants precise boundaries. 

  For coining a term, something like "Illocutionary Displacement" or "Illusory Reason-Convergence" could work. But "Parasitic Reason Adoption" (PRA) might be better. Parasitic because it latches onto the dominant discourse without genuine adoption. The definition needs to include the asymmetry, unconscious aspect, polarization, and bad faith attributions.

  Boundaries: Must have asymmetry (one side adopts the other's terms), unconscious adoption, polarization, and mutual bad faith accusations. It's different from deliberate framing, confabulation, or genuine value change. 

  Implications: This phenomenon undermines the idea that shared reasons can be a neutral court. If reasons are adopted insincerely (or unconsciously), then surviving in shared terms doesn't indicate merit. The bad faith attributions are a symptom, not the core problem. The core is the disconnect between stated reasons and actual motivations, making shared discourse unreliable for resolving disputes. 

  The user's deeper need is to challenge the assumption that convergence in vocabulary facilitates resolution. Their data shows the opposite, which is significant for political theory. They need a robust term to frame this phenomenon and support their argument about the limitations of rational deliberation in polarized contexts.
answer: |-
  This is a fascinating and critically important pattern. It doesn't map perfectly onto a single established concept, though several adjacent ones contribute pieces. After synthesizing your description and ruling out near neighbors, I propose coining the term **Parasitic Reason Adoption (PRA)**. Below is the carving you requested:

  **The Core Phenomenon: Parasitic Reason Adoption (PRA)**

  1.  **Definition:** A socio-discursive phenomenon where:
      *   **Asymmetric Assimilation:** One group (often sociopolitically dominant or culturally ascendant) sets the dominant vocabulary of justification (e.g., harm, welfare, equality).
      *   **Unconscious Adoption:** Members of other groups, whose underlying motivations are better explained by different moral foundations (e.g., loyalty, authority, sanctity/order/group integrity), unconsciously adopt this dominant vocabulary to justify their *unchanged* positions.
      *   **Cognitive Dissonance Minimization:** This adoption involves a conceptual slide or translation (e.g., "violates our sacred order" becomes "harms societal cohesion/stability"), which the speaker does not consciously register as such. The translated reason *feels* like the genuine reason.
      *   **Polarizing Effect:** The convergence in *stated reasons* does not lead to convergence in *verdicts/conclusions*. Instead, polarization often increases.
      *   **Mutual Attribution of Bad Faith:** Because conclusions diverge despite shared vocabulary, each side concludes the other is insincere in invoking the shared reasons. The dominant group sees the adoption as cynical camouflage; the adopting group sees the dominant group's failure to agree despite shared terms as proof of bad faith or hidden motives.

  **Boundaries & Distinctions: Key "Not PRA" Cases**

  1.  **Deliberate Reframing/Strategic Framing:** (*Common in persuasion*)
      *   **Not PRA:** Speaker consciously repackages their core reason into the opponent's terms *for tactical advantage* (e.g., "I know *they* care about harm, so I'll frame my border stance as preventing harm from drugs/crime"). Aware of the translation, expects audience appeal.
      *   **PRA Boundary:** PRA requires the adoption to be largely *unconscious* and reported as the genuine reason. The speaker is surprised by their original wording. It often occurs even when *less* effective with their own base.

  2.  **Confabulation/Post-Hoc Rationalization:** (*Common in cognitive psych*)
      *   **Not PRA:** Person generates a plausible-sounding reason for a reaction/decision driven by subconscious processes, intuition, or emotion. The reason is invented after the fact.
      *   **PRA Boundary:** Confabulation explains *any* mismatch between cause and stated reason. PRA is a specific *directional* drift: adoption of the *opponent's dominant vocabulary*. It doesn't inherently predict polarization or symmetrical bad faith attributions. Confabulation is individual; PRA is socio-discursive.

  3.  **Expressive Responding/Cheap Talk:** (*Signaling theory*)
      *   **Not PRA:** Person states a reason primarily to signal group affiliation, virtue, or status, without deep commitment to its substantive content or logical implications. The reason is "cheap" because it costs little to state.
      *   **PRA Boundary:** While signaling might be *a* function, PRA requires the stated reason to be sincerely *believed* as the justification *by the speaker* at that moment (even if unconsciously adopted). It's not perceived as "cheap" or insincere *by the speaker themselves*.

  4.  **Status-Seeking Moral Speech:** (*Sociology/social psych*)
      *   **Not PRA:** Using moral language primarily to gain status within one's *own* group by displaying adherence to its specific moral codes (e.g., purity language on the right, anti-oppression language on the left).
      *   **PRA Boundary:** PRA involves adopting the *out-group's dominant moral vocabulary*, often at potential cost within one's *in-group*. The motivation isn't primarily in-group status but an unconscious assimilation of the broader discourse.

  5.  **Genuine Conceptual Change/Value Shift:**
      *   **Not PRA:** A group authentically changes its underlying values or reinterprets concepts, leading to a new vocabulary and potentially new conclusions (e.g., the civil rights movement integrating equality into core American values).
      *   **PRA Boundary:** PRA shows vocabulary change *without* underlying value shift or verdict change. The "native" foundation (loyalty, authority) still predicts the conclusion better than the adopted vocabulary (harm, equality).

  6.  **Plain Disagreement about Weight/Application of Shared Reasons:**
      *   **Not PRA:** Parties genuinely share the same core moral framework (e.g., both prioritize welfare) but disagree profoundly on the facts, the causal mechanisms, or the relative weight of welfare vs. other *acknowledged* shared values (like liberty). This *should* lead to investigation of facts/weighting.
      *   **PRA Boundary:** In PRA, the disagreement stems from *different underlying foundations* masked by shared vocabulary. The parties don't genuinely share the framework; one has parasitically adopted the other's language. Investigation of facts/weighting within the shared framework feels futile because the framework isn't the real driver for the adopting side. The bad faith attribution replaces investigation.

  **Discriminating PRA in Your Data:**

  *   **Look for:** Evidence that the *conclusion* is better predicted by a foundation *other* than the one stated (e.g., survey items tapping loyalty/authority predict the verdict better than harm/welfare items, *even though* the open-ended response uses harm/welfare language).
  *   **Look for:** Lack of awareness of the translation (surprise at original wording), especially when the adopted language is suboptimal for their own audience.
  *   **Look for:** Symmetrical bad faith attributions *specifically linked* to the failure to agree despite shared vocabulary.
  *   **Rule out:** Conscious strategic framing (e.g., "I used 'harm' because I knew the interviewer was liberal"), pure confabulation (random or self-serving justifications not tied to opponent's framework), or expressive signaling disconnected from belief.

  **Implications for the "Neutral Court of Appeal"**

  PRA fundamentally **undercuts** the appeal to shared reasons as a neutral court of appeal for resolving the underlying dispute. Here's why:

  1.  **The Shared Ground is Illusory:** The convergence in vocabulary is superficial. It masks deeper, persistent divergence in the actual foundational moral commitments driving the conclusions. Arguing "within" the shared framework of harm/welfare/equality is arguing on a battlefield that doesn't correspond to the actual terrain of the conflict for one side.
  2.  **Neutrality is Compromised:** The "shared" vocabulary is not neutral; it is the *specific* vocabulary of one side that has been parasitically adopted (often asymmetrically). Using it as the court inherently privileges one set of foundational concerns (Harm/Care, Fairness) over others (Loyalty, Authority, Sanctity).
  3.  **Merit Becomes Opaque:** Survival within the shared vocabulary tells you little about the "merits" *as understood by the adopting group*, because their conclusion wasn't primarily generated *within* that framework. A verdict surviving scrutiny in harm-based terms might be utterly irrelevant or even anathema to the loyalty-based concerns actually motivating the adopting side. Conversely, a loyalty-based argument translated poorly into harm-terms might be dismissed within the "court" despite its deep resonance for its proponents.
  4.  **Bad Faith is Symptom, Not Diagnosis:** The mutual attributions of bad faith are a *consequence* and *symptom* of PRA, not its core driver. They arise *because* the shared vocabulary creates an expectation of convergence that fails, leading to the inference of insincerity. However, the core pathology is the unconscious adoption masking incompatible foundations, not necessarily deliberate deception (though the *attribution* is of deception).
  5.  **Deepening Divergence Signaled:** PRA *is* evidence of a deeper divergence in the psychologies/moral foundations of the groups. The fact that one group feels compelled (unconsciously) to translate its native concerns into the other's language demonstrates the hegemonic power of that language *and* the perceived illegitimacy or inexpressibility of the native concerns within the broader discourse. This is a sign of profound communicative breakdown and value incommensurability, not rapprochement.

  **In essence:** PRA reveals that convergence in the *currency* of reasons is not convergence in the *economy* of moral reasoning. It transforms the shared vocabulary from a potential bridge into a theater of mutual misunderstanding and accusation, obscuring rather than illuminating the actual sources of disagreement and rendering the "neutral court of shared reasons" incapable of adjudicating the underlying conflict because it doesn't access the true grounds of the verdicts for all parties. Your pattern suggests that the spread of a liberal harm/welfare/equality framework hasn't created common ground; it has created a dominant language that conservatives must (unconsciously) speak to justify positions still rooted in loyalty/authority/sanctity, leading to polarization and mutual distrust precisely *because* the language is shared but the foundations are not.
