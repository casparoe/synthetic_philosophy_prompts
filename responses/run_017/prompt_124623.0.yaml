  First, I need to assess if τ is doing real work. The user mentions it's not just grain-relative in fancy terms. So, what's unique here? Maybe τ ties realization directly to scientific practice, making MR claims contingent on empirical taxonomy. That’s different from traditional functionalism where grain is often pre-theoretical.

