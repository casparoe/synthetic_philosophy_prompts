     Part 4: Scenarios with the chosen rule (40 min)

     We will run 4 scenarios with the same rule, but different situations. For each scenario, we randomly select 6 victims (one from the class to be Group A, five to be Group B). We rotate so that everyone gets to be in at least one scenario. We do:

     Scenario 1: Base (1 death vs 5 deaths)
          - Assign roles: one student is Group A (will die if not saved), five are Group B (will die if not saved).
          - The TA reads the rule: "The rule is: [read the rule]."
          - If the rule is "give everyone an equal chance", we ask the group that wrote it: "How do you implement this? For example, do you flip a coin between the two groups? Or do you randomly select one person and save their group?" They choose. Let's say they choose the coin flip.
          - Apply the rule: flip a coin. Save the group that wins.
          - The group that wrote the rule must state the rule to the abandoned individual(s). For example, if the coin says save Group B, then they say to the one in Group A: "The rule we made is: 'You should give everyone an equal chance.' Following that rule, we saved the five and you were not saved."
          - The abandoned lose their tickets (hand them to the TA).

     Scenario 2: Now we do the same rule but with the other implementation? Or we do a different scenario? We want to show the ambiguity. So after Scenario 1, we say:

          "For the same rule, there is another way to implement 'equal chance'. Some people might interpret it as: randomly select one person and save that person's entire group. Let's try that."

          Then we reassign victims? Or use the same victims? We reassign: choose 6 new victims.

          - Assign roles.
          - Apply the rule by randomly selecting one person (by drawing names from a hat). Save that person's group.
          - The group states the rule to the abandoned.
          - Abandoned lose tickets.

          Then we can compare: in the first implementation, each had 50% chance. In the second, the one had 1/6 and the five had 5/6 each? No, wait: in the second implementation, the chance for an individual in the five is not 5/6 for survival. It's the chance that someone in their group is selected, which is 5/6, and then they are saved. So survival chance for each in the five is 5/6. For the one, 1/6.

          Then we ask: are these both giving everyone an equal chance? In the first, yes (50%). In the second, no.

     But we want them to trip over it. So after Scenario 1 (coin flip) and Scenario 2 (individual lottery), we ask: "In both cases, we followed the rule 'give everyone an equal chance'. Why are the individual chances different?" And let them discuss.

     Then we move to other variations for the same rule? But we don't have time. We allocated 40 min for 4 scenarios, but we only did two and we have to include the other variations.

     Given time, we might skip the other variations for now and focus on the equal chance. Or we can do one variation to show the issue with magnitudes.

     Revised for time: We focus on the equal chance rule and its ambiguity, and then we do one variation (like the broken arms) to show that the rule might be problematic in magnitudes.

     So:

          Scenario 1: Base with coin flip.
          Scenario 2: Base with individual lottery.
          Scenario 3: 1 death vs 5 broken arms, using the coin flip implementation.

     In Scenario 3:

          - We assign: one will die if not saved, five will break arms if not saved.
          - We flip a coin: if heads, save the one (so the five break arms). If tails, save the five (so the one dies).
          - The group states the rule to the abandoned.

     Then we ask: is it fair that the one has a 50% chance of dying to prevent five broken arms? Or should we have saved the five without a lottery? This might make them feel the pull of saving the five.

     Part 5: Debrief (15 min)

     We map each moment to a move in the argument:

     - The base scenario with the two implementations of "equal chance": shows that "equal chance" is ambiguous. It can be implemented in ways that give very different chances to individuals. (This is the lottery ambiguity.)

     - The broken arms scenario: shows that when the harms are of different magnitudes, even if we give equal chances, we might feel that it's not right to let one person die to prevent five broken arms. This stresses that the rule doesn't take magnitude into account.

     - Also, we can discuss: in the base scenario, if we use the coin flip, then the rule does not aggregate: it doesn't matter that there are five on one side and one on the other. The numbers don't count. This is the Taurek thesis.

     The debrief should cover:

        a. The lottery ambiguity: two ways to give equal chances lead to different individual probabilities. This means the rule must be specified.

        b. The numbers/magnitudes distinction: in the base scenario, the harm is the same per person (death). But in the broken arms scenario, the harm is different. This shows that sometimes numbers might not matter as much as the magnitude of the harm.

        c. The gap between "may save the one" and "must save the five": in the base scenario, if we use the coin flip, the rescuer may save the one (if the coin lands on heads) and that is not wrong by the rule. But many people feel that they must save the five. The activity lets them feel the conflict.

     Finally, what the activity can't stage: Taurek's deeper claim that there is no impersonal value of the greater number. The activity stages the decision and the lottery, but the underlying philosophy that there is no moral weight to the sum of losses is something to argue for in the debrief or next week.

     Predictable problems and solutions:

     - Problem: No group writes an equal chance rule.
          Solution: The TA can introduce a pre-written rule: "Rule 5: Give each person an equal chance of being saved." and attribute it to a fictional group.

     - Problem: In the lottery implementation, the students might not understand the probability calculation.
          Solution: After running both implementations, explicitly calculate the chances on the board.

     - Problem: Time runs out.
          Solution: Skip one scenario. Focus on the base and the lottery ambiguity.

     - Problem: The students might not take the ticket loss seriously.
          Solution: Remind them that the tickets are for a real raffle, and they are losing their chance.

     - Problem: In the broken arms scenario, they might question the comparison between death and broken arms.
          Solution: Acknowledge that it's a simplification, but in ethics, we often use such thought experiments.

     Materials: 
          - Raffle tickets (14)
          - Index cards for groups to write rules
          - A coin
          - A hat for drawing names
          - Board to write rules

     Wording for scenarios:

     Scenario 1 (Base, coin flip):
          "In this scenario, there is one person who will die if not saved (Group A) and five people who will die if not saved (Group B). The rescuer must choose. The rule we are following is: [rule]. We implement it by flipping a coin: heads save Group A, tails save Group B."
          Flip the coin.
          Announce: "The coin says [heads/tails]. Therefore, we save Group [A/B]. Group [the other] is abandoned."
          The group that wrote the rule states: "Our rule was: [rule]. Following that rule, we saved them and you were not saved." (to the abandoned)
          Collect tickets from the abandoned.

     Scenario 2 (Base, individual lottery):
          "Now, we implement the same rule by randomly selecting one person and saving that person's entire group."
          Write each of the 6 names on slips, put in hat, draw one.
          Announce: "The selected person is [name], who is in Group [A or B]. Therefore, we save Group [A or B]. The other group is abandoned."
          The group states the rule to the abandoned.
          Collect tickets.

     Scenario 3 (Broken arms, coin flip):
          "In this scenario, there is one person who will die if not saved (Group A) and five people who will each break an arm if not saved (Group B). We implement the rule by flipping a coin: heads save Group A, tails save Group B."
          Flip, announce, group states, collect tickets.

     Then debrief.

     Debrief outline:

     - First, the lottery ambiguity: in the first implementation (coin flip between groups), each person had a 50% chance of survival. In the second (randomly select one person), the one in Group A had a 1/6 chance, and each in Group B had a 5/6 chance. Both are called "equal chance" but they are not the same. This shows that the rule is underspecified.

     - Second, the magnitudes: in the broken arms scenario, even if we give a 50% chance to the one to die, we might feel that it's not worth it because death is so much worse than a broken arm. This suggests that the rule should take into account the magnitude of the harm, not just the numbers.

     - Third, the base scenario: the rule we used (equal chance) does not necessarily save the greater number. In fact, it might save the one. This goes against the intuition that we should save the greater number. But it gives each person equal consideration.

     - Finally, the gap: the rule allows the rescuer to save the one (if the coin lands heads) and that is not wrong by the rule. This is the core of Taurek: that the numbers as such don't count. But next week we will read Taurek and discuss.

     The part that is not staged: the argument that there is no impersonal sum of losses. We see it in the rule that doesn't aggregate, but we don't argue for it. The activity lets them feel the conflict, but the philosophical defense is for next week.

     This should fit in 80 minutes.
answer: |-
  Below is a complete, runnable activity designed to meet your specifications. It forces students to confront the tension between saving the greater number and giving equal consideration to each person, culminating in Taurek's central claim. The activity uses raffle tickets as trivial stakes and emphasizes experiential learning.

  ---

  ### **Activity: The Rescue Lottery**
  **Objective**: Make students feel the pull of the claim that "numbers don't count" by forcing them to author, apply, and defend decision rules under asymmetric stakes.

  **Materials**:
  - 14 raffle tickets (one per student)
  - 4 index cards (for group rules)
  - A coin
  - Sticky notes for role assignments
  - Whiteboard for debrief notes
  - Timer

  **Setup**:
  - Arrange desks into 4 clusters (three groups of 4, one group of 2; adjust if needed).
  - Distribute one raffle ticket to each student.
  - Post visible rules: "If saved, keep your ticket. If abandoned, surrender your ticket."

  ---

  ### **Phase 1: Rule Creation (15 min)**
  **Instructions to Read Aloud**:  
  *"In this activity, you’ll face rescue scenarios where a choice must be made between saving one person or five. But first, in your groups, you’ll author a single ethical rule for the rescuer. This rule must answer: ‘When you can save only one stranger or five strangers, and everything else is equal, what should you do?’ Write your rule in the second person (e.g., ‘You should...’). It must be simple enough to apply quickly. You won’t know your role yet. In 10 minutes, I’ll collect your rule."*

  **TA Notes**:
  - Students typically default to "save the five" or "flip a coin." If a group proposes "equal chance," probe: *"How exactly would you ensure equality?"* but **do not resolve ambiguity**.
  - **Predicted Issue**: Groups may write vague rules (e.g., "Be fair"). Force specificity: *"Rewrite this so a rescuer knows exactly what to do."*
  - After 10 minutes, collect rules on index cards. Do not reveal or discuss them yet.

  ---

  ### **Phase 2: Scenario Trials (45 min)**
  **Instructions**:  
  *"We’ll now run rescue scenarios. Each trial uses one group’s rule. I’ll randomly assign six of you to roles: one ‘lone person’ (Group A) and five ‘grouped people’ (Group B). The remaining eight watch. The rescuer (played by me) applies the rule blindly. After, the group who wrote the rule must read it aloud to the abandoned person(s)."*

  #### **Trial 1: Base Case (1 death vs. 5 deaths)**
  - Randomly assign 6 students: 1 to Group A, 5 to Group B.  
  - Announce: *"Group A will die if not saved. Group B will die if not saved. Everything else is equal."*  
  - Apply the **first group’s rule** (e.g., "Save the five").  
  - Outcome: Abandon Group A. The rule-writing group reads their rule to the lone person (e.g., *"You should save the five. So we’re saving them, not you."*).  
  - **Consequence**: Abandoned student(s) surrender raffle tickets.  

  #### **Trial 2: Unequal Magnitudes (1 death vs. 5 broken arms)**
  - Assign 6 new students to Groups A and B.  
  - Announce: *"Group A will die if not saved. Group B will break their arms if not saved."*  
  - Apply the **same rule** as Trial 1.  
  - **Stress test**: If the rule is "save the five," ask: *"Does your rule require saving five broken arms over one life?"* Force the group to state the rule to the abandoned.  
  - **Predicted Issue**: Students protest, "But death is worse!" Redirect: *"Your rule doesn’t distinguish magnitude. State it as written."*  

  #### **Trial 3: Near-Ties (1 loses 50 years vs. 5 lose 48 years each)**
  - Assign 6 new students.  
  - Announce: *"Group A loses 50 years of life if not saved. Each in Group B loses 48 years if not saved."*  
  - Apply the **rule again**.  
  - **Stress test**: If the rule aggregates harms, ask: *"Does your rule care about total harm (240 years vs. 50) or per-person harm (48–50 years)?"*  

  #### **Trial 4: Ambiguous "Equal Chance" (Stage the Lottery Ambiguity)**
  - Use a group’s rule that says "give everyone an equal chance." If none exist, use a pre-written rule: *"You should give everyone an equal chance of being saved."*  
  - Assign 6 new students.  
  - Announce: *"Same as Base Case."*  
  - **Force the ambiguity**:  
    1. Ask the group: *"How do you implement ‘equal chance’? Propose a method."*  
      - **Common Proposal 1 (Group-Level)**: "Flip a coin: heads save Group A, tails save Group B."  
        - Result: Each person has 50% survival chance.  
    2. **Counter with Alternative**: *"Another group suggested: ‘Pick one person randomly and save their whole group.’ Let’s test both."*  
      - **Proposal 2 (Individual-Level)**: Draw a name from a hat. Save that person’s group.  
        - Result: The lone person has 1/6 chance; each in the five has 5/6 chance.  
  - **Consequence**: Run both methods. Have the group state the rule to the abandoned after each.  
  - **Key Moment**: Students will realize the two methods create unequal individual chances. Ask: *"Which is truly ‘equal’? Why?"*  

  #### **Trial 5: Divisible Harm (Optional, Time-Permitting)**  
  - Announce: *"You have 100 units of medicine. Group A (one person) needs 100 units to survive. Group B (five) needs 20 units each to survive. If you save one, the other group dies. If you save five, the one dies."*  
  - Apply the rule.  
  - **Stress test**: Highlights if rules prioritize "all-or-nothing" rescues over partial harms.  

  **Logistics**:  
  - Rotate roles so all students participate in at least one trial.  
  - **Time Management**: Strictly limit trials to 7–8 min each. Skip Trial 5 if behind.  

  ---

  ### **Phase 3: Structured Debrief (20 min)**  
  Map each activity moment to Taurek’s argument:  

  | **Activity Moment**          | **Debrief Question**                                                                 | **Taurek Connection**                                                                 |
  |------------------------------|--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | Rule creation (blind to roles) | *"Why was it harder to abandon people after seeing their faces?"*                   | **No impersonal sum**: Losses aren’t aggregated; each loss is personal. Rules feel different when you confront the abandoned. |
  | Base Case abandonment        | *"Did anyone feel the abandoned person was wronged? Why/why not?"*                  | **"May save the one"**: If numbers don’t count, saving the one isn’t wrong. Intuition for aggregation clashes with individual fairness. |
  | Lottery ambiguity            | *"Which ‘equal chance’ is fairer? Why do both feel flawed?"*                        | **Ambiguity in equality**: Equal group chance (coin) vs. equal individual chance (lottery) exposes unresolved tension in "fairness." |
  | Unequal magnitudes           | *"Should your rule care about the *type* of harm, not just numbers?"*               | **Magnitudes vs. numbers**: Taurek rejects aggregating small harms to override large harms. Numbers alone don’t justify sacrificing one. |
  | Near-ties & divisible harm   | *"Does your rule prioritize total harm prevented? Should it?"*                       | **No summation**: Taurek denies we can add harms across persons. A life isn’t outweighed by many smaller losses. |

  **Final Points**:  
  1. **What the activity staged**:  
     - The emotional pull of facing the abandoned person.  
     - The lottery ambiguity (they "tripped over" it).  
     - The gap between "may save the one" (defensible) and "must save the five" (questionable).  
  2. **What it didn’t stage (requires your argument next week)**:  
     - Taurek’s philosophical claim that *there is no moral weight to the sum of losses*. The activity makes this intuitive but doesn’t prove it.  
     - Why we might still *permit* saving the greater number (even if not required).  

  **Closing Teaser**:  
  *"Next week, we’ll read Taurek, who argues exactly what you experienced: numbers don’t count. But be ready to challenge him—why might he be wrong?"*  

  ---

  ### **Predicted Issues & Solutions**  
  - **Issue**: Groups avoid "equal chance" rules.  
    **Solution**: Use your pre-written rule. If needed, say: *"One group in a past seminar proposed this..."*  
  - **Issue**: Students resist surrendering tickets.  
    **Solution**: Remind them stakes are trivial but symbolically important: *"This is ethics, not economics!"*  
  - **Issue**: Debate hijacks time.  
    **Solution**: Defer complex arguments: *"Jot that down—we’ll revisit it in Taurek."*  
  - **Issue**: A rule "breaks" a scenario (e.g., "save the five" in broken arms).  
    **Solution**: Lean in: *"This is why philosophers stress-test rules. Does yours hold up?"*  

  This design forces students to **confront abandonment** and **expose rule flaws** experientially. The debrief explicitly links their emotions to Taurek’s thesis, priming them for next week’s reading.
