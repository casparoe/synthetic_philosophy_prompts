prompt: |-
  A few months ago I joined the board of a small land trust that manages a couple of thousand hectares of mixed woodland, fen and old grazing land, and I volunteered to take over the reserve's species list. What I found was not a data problem but a conceptual one. Our headline figure — the number of species the reserve exists to protect — shifts by roughly a third depending on which of the published checklists we reconcile against, and almost none of the difference comes from new fieldwork: it comes from disagreements about what a species is in the first place. That number goes into grant applications, into the management plan, and, because protection in our jurisdiction attaches to whatever the official list names at whatever rank it names it, into what we are legally obliged to manage for. So the question has stopped being academic for me, and I have discovered that I do not know what I should be demanding of an answer.

  What I want from you is a specification rather than a survey. Write out the desiderata that an account of species would have to meet for me to trust it as the backbone of such a list — the phenomena it has to accommodate, the cases it has to get right, the distinctions it must not collapse, and the results from biology it is not allowed to contradict — with the case or consideration behind each requirement, not just the requirement.

  Some of what I think belongs on that list, for you to accept, reject or reframe: it must say something usable about lineages with no known sex and about prokaryotes that swap genes sideways; about forms arranged in a chain around a barrier whose two ends meet and do not interbreed, and about cases where the ends do interbreed freely; about new lineages created in a single generation by whole-genome duplication; about organisms like lichens, where the named thing is a consortium of a fungus and a photosynthetic partner, and the same fungus can turn up with different partners; about the continuum of fossils, where boundaries look like artifacts of where we slice; about domesticated forms and their wild relatives that remain fully interfertile; and about the fact that most of the taxa on my list will never have a genome sequenced, only a photograph, a specimen and perhaps a barcode region, so the account has to be usable under severe evidential poverty and has to say what to do when the evidence runs out.

  I also want your view on three things the criteria themselves turn on. First, which of these demands are genuine adequacy conditions and which are prejudices of one constituency — the metaphysician wanting natural kinds with essences, the phylogenetics camp wanting monophyly, the field naturalist wanting something decidable with a hand lens, the practitioner wanting a number that does not move. Second, which pairs of requirements you think cannot be jointly satisfied, and which one of each pair you would keep: I suspect, for instance, that asking for a unit whose counts mean the same thing across fungi, insects, birds and bacteria is in tension with asking the account to be faithful to the causal structure of each clade, and that demanding stability under future revision is in tension with demanding that the list track new evidence. Third, whether the specification should include a requirement that the metaphysical question of what species are be separable from the practical question of which taxa to list — whether that separability is a real desideratum or a way of giving up on the problem I actually have.

  Then, briefly, and only as a check on the criteria rather than as the main deliverable: how the familiar families of account fare against the list — the interbreeding-based one, the diagnosable-smallest-cluster and monophyly-based ones, the ecological or genotypic-cluster pictures, the general-lineage view, and outright pluralism — and which single requirement does the most work in excluding them. Please do not give me a reading list or a bibliography; I can find those myself.
reasoning: |-
  Okay, the user is on the board of a land trust and is grappling with the problem of defining species for their reserve's management and legal obligations. They need a robust set of criteria to evaluate species concepts, not just a survey of existing theories. Let me start by understanding their core issues.

  First, the headline species count varies by a third depending on the checklist used, mainly due to taxonomic disagreements, not new data. This affects funding, management plans, and legal responsibilities. So the user needs a reliable, consistent way to define species that can handle real-world complexities.

  They listed several challenging cases: asexual lineages, prokaryotes with horizontal gene transfer, ring species, polyploidy, lichens, fossil continua, domesticated vs. wild interfertile forms, and limited evidence (only photos or barcodes). The criteria must accommodate all these without contradicting biology.

  The user also wants analysis on three deeper questions: which demands are genuine vs. biases, which criteria conflict, and if the metaphysical definition can be separated from practical listing. They suspect trade-offs, like cross-taxon consistency vs. clade-specific accuracy, and stability vs. responsiveness to new evidence.

  I need to outline desiderata for each challenge. For example, prokaryotes require criteria that allow for gene exchange without collapsing all bacteria into one species. Ring species need handling spatial continua without forcing arbitrary splits. Lichens must recognize symbiosis without dismissing the fungal partner's identity.

  Then, addressing the three key questions. Identifying biases: the natural kinds essence might be a metaphysician's preference, not practical. Monophyly may not work for hybrids. Decidability with a hand lens is a field naturalist's need but unrealistic for microbes. Stability is practical but conflicts with evidence updates.

  Conflicting criteria: Cross-taxon consistency vs. clade-specific fidelity is a real tension. Prioritize fidelity to avoid misrepresenting biology. Stability vs. evidence tracking: favor evidence tracking to maintain scientific integrity, using operational stability mechanisms.

  Separating metaphysics from practice: It's both a desideratum and a necessity. The definition should guide practical decisions without resolving deep philosophical debates. Operational criteria can bridge the gap.

  Evaluating existing concepts: BSC fails asexuals and prokaryotes. PSC struggles with hybrids and limited data. Ecological concepts may be too subjective. General-lineage is flexible but vague. Pluralism is useful but risks inconsistency. The most excluding requirement is probably handling all major taxa equally, as many concepts are taxon-specific.

  Underlying needs: The user needs legal defensibility, management practicality, and scientific credibility. They might also want to reduce disputes among experts and ensure grant eligibility. Unspoken is the need for community buy-in and a transparent process that stakeholders can trust despite taxonomic changes.
answer: |-
  Below is a specification of desiderata for a species concept suitable for your land trust's operational and legal needs. Each requirement is grounded in biological phenomena, practical constraints, or conceptual coherence, with explicit justification. Following this, I address your three meta-questions and briefly evaluate major species concepts against the criteria.

  ---

  ### **Desiderata for a Pragmatic Species Concept**
  1. **Accommodates Asexual & Horizontal Gene Transfer (HGT) Lineages**  
     *Requirement:* Must define units for prokaryotes and asexual eukaryotes without relying on interbreeding.  
     *Case:* Bacteria archaea exchange genes laterally; many fungi/plants reproduce clonally. An interbreeding-based concept collapses here. Units must reflect cohesive evolutionary trajectories despite HGT or asexuality.

  2. **Handles Ring Species & Spatial Continua**  
     *Requirement:* Must resolve cases where geographically separated populations form a continuum (ends may or may not interbreed).  
     *Case:* *Ensatina* salamanders or *Larus* gulls form rings around barriers. The concept must neither force arbitrary splits nor ignore reproductive isolation where endpoints coexist without interbreeding.

  3. **Incorporates Hybridization & Polyploid Speciation**  
     *Requirement:* Must recognize speciation via whole-genome duplication (e.g., allopolyploidy) in one generation.  
     *Case:* Many plants (e.g., *Tragopogon*) or amphibians originate via polyploidy. The concept cannot require gradual divergence and must accommodate hybrid taxa as distinct units.

  4. **Addresses Symbiotic Consortia**  
     *Requirement:* Must define units for organisms like lichens, where the "species" is a symbiotic association.  
     *Case:* A single fungal "species" (e.g., *Treboxxia*) pairs with different algae, yielding distinct phenotypic/ecological units. The concept must allow for multi-partite entities without reducing them to individual partners.

  5. **Accounts for Fossil Incompleteness & Temporal Continuity**  
     *Requirement:* Must provide boundaries in fossil series where divergence is gradual.  
     *Case:* Hominid or *Gryphaea* oyster fossils show continuous change. Boundaries must be justifiable without implying discrete "jumps," acknowledging sampling artifacts.

  6. **Manages Domesticated/Wild Interfertile Pairs**  
     *Requirement:* Must distinguish domesticated forms from wild relatives despite interfertility.  
     *Case:* Wolves and dogs interbreed but occupy distinct ecological/evolutionary roles. The concept must recognize human-mediated divergence as speciation-relevant.

  7. **Operates Under Evidential Scarcity**  
     *Requirement:* Must be applicable with minimal data (morphology, photos, single-locus barcodes).  
     *Case:* Most fungi/protists lack genomes; many insects are known only from specimens. Cannot require genomic data or experimental crosses.

  8. **Guides Decisions When Evidence is Inconclusive**  
     *Requirement:* Must specify how to act (lump/split) amid ambiguity.  
     *Case:* Cryptic species or unresolved HGT events require conservative protocols (e.g., provisional splitting based on morphology pending data).

  9. **Avoids Contradicting Established Biology**  
     *Requirement:* Must align with evolutionary theory (e.g., descent with modification, horizontal transfer).  
     *Case:* A concept denying HGT’s role in prokaryote evolution would be biologically inaccurate.

  ---

  ### **Analysis of Your Three Meta-Questions**
  1. **Genuine Adequacy Conditions vs. Constituency Biases**  
     - **Genuine**: Handling asexuals/HGT (all life’s diversity), evidential scarcity (practical reality), evolutionary consistency (scientific integrity).  
     - **Biases**:  
       - *Metaphysician’s essence*: Contradicted by ring species/fossil continua.  
       - *Monophyly absolutism*: Fails hybrid speciation/lichens.  
       - *Field naturalist’s hand-lens decidability*: Unrealistic for microbes/cryptic species.  
       - *Practitioner’s stability*: Often conflicts with evidence (e.g., new genomic splits).

  2. **Conflicting Requirements & Resolutions**  
     - **Conflict 1**: *Cross-taxon consistency* vs. *Clade-specific fidelity*.  
       - **Resolution**: Prioritize fidelity. Bacteria require gene-flow coherence; birds need interbreeding criteria. Forced consistency (e.g., applying BSC to bacteria) distorts biology.  
     - **Conflict 2**: *Stability* (for legal/grant needs) vs. *Evidence responsiveness*.  
       - **Resolution**: Favor evidence responsiveness with "operational stability." Adopt a conservative baseline list (e.g., IUCN Red List) but build in protocols for updates via expert panels. Legally bind to a *versioned* checklist.

  3. **Separating Metaphysics from Practice**  
     - **Verdict**: **Essential desideratum**. The "what is a species?" question is philosophically intractable but pragmatically navigable. Demand that the concept:  
       - Defines operational criteria for delimitation (e.g., "diagnosable units with evolutionary cohesion").  
       - Explicitly separates *definition* (metaphysical) from *delimitation protocols* (practical).  
       *Case:* Lichens can be managed as functional units regardless of whether symbiosis challenges "species" ontology.

  ---

  ### **Evaluation of Major Species Concepts**
  | **Concept**               | **Key Failure(s)**                                | **Most Excluding Requirement**         |  
  |---------------------------|--------------------------------------------------|----------------------------------------|  
  | **Biological (BSC)**      | Asexuals, prokaryotes, hybrids.                  | #1 (Asexual/HGT lineages)              |  
  | **Phylogenetic (PSC)**    | Hybridization, HGT, limited data.                | #3 (Polyploidy) / #7 (Evidential poverty) |  
  | **Morphological**         | Cryptic species, ring species, plasticity.       | #2 (Ring species) / #5 (Fossils)       |  
  | **Ecological**            | Subjectivity; vague boundaries.                  | #6 (Domesticated forms) / #9 (Biology) |  
  | **General Lineage**       | Vague; no clear delimitation protocol.           | #8 (Decisions under ambiguity)         |  
  | **Pluralism**             | Inconsistent counts; legal/practical chaos.      | **All** (Fails cross-taxon consistency) |  

  **Most Damaging Failure**: Requirement **#1 (Asexual/HGT)** excludes BSC/PSC; **#7 (Evidential poverty)** excludes complex genomic concepts. **#9 (Biology alignment)** rules out rigid essentialism.  

  ---

  ### **Recommended Path Forward**
  Adopt a **modified General Lineage Concept** with explicit delimitation protocols:  
  1. **Core Definition**: Species as independently evolving metapopulation lineages.  
  2. **Delimitation Tools**:  
     - **Primary**: Diagnosability (morphology/barcodes) + evolutionary independence (e.g., geographic isolation, ecological divergence).  
     - **Secondary**: Monophyly (where data exists), interbreeding (for sexual taxa), or symbiosis (for consortia).  
  3. **Operational Stability**:  
     - Fix to a specific checklist version (e.g., "2024 IUCN Standard") for legal purposes.  
     - Establish a review panel (taxonomists + ecologists) to propose annual updates based on evidence thresholds (e.g., ≥2 diagnostic traits + published study).  

  This balances biological realism with your need for defensible, actionable lists. It accepts that species are hypotheses—not timeless essences—but provides clear rules to test them amid uncertainty.
