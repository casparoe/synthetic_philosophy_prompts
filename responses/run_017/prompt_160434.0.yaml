  We are designing a 75-minute session with three main parts, plus debrief. The goal is for students to experience the problem of underdetermination of theories by data, and the need for something beyond fit (like simplicity, naturalness, or background knowledge) to choose a rule.

  Structure:

  1. **Rule Discovery (15-20 minutes):**
     - Split into groups of 3-4 (about 4 groups for 14 students).
     - Each group gets a set of 12 boxes (6 positive examples that follow the rule, 6 negative that don't). The boxes are simple: shapes (circle, triangle, square), colors (black, white), sizes (big, small), count (1-5), and touching (touching or not). 
     - Task: Write a one-sentence rule that explains which boxes are positive and which are negative.

  2. **Scoring Round (15-20 minutes):**
     - Groups write down their rule and hand it in. The instructor collects and then reveals that there are multiple rules that fit the data.
     - Then, the instructor reveals 6 new boxes (held-out) and asks each group to predict for each whether it is positive or negative based on their rule. 
     - Scoring: We want to punish overconfidence. We can use a scoring rule that rewards correct predictions and penalizes wrong ones, with more penalty for confident wrong predictions. One way is to have them assign a confidence level (say 1-3) for each prediction. Then, if they are correct, they get the confidence points; if wrong, they lose that many points. Alternatively, we can use a quadratic scoring rule for probabilities, but that might be too complex. Let me simplify: 
       - For each held-out box, each group must state: 
          - Prediction: Positive or Negative.
          - Confidence: Low, Medium, High (which we assign 1, 2, 3 points respectively).
       - If correct: + confidence points.
       - If wrong: - confidence points.
     - We can have a leaderboard and give chocolate to the winning group.

  3. **Meta Round (15 minutes):**
     - Each group is given four candidate rules that all fit the original 12 boxes. They must bet on which one the instructor actually used to create the boxes. 
     - The rules are about equally short (so simplicity is not the clear winner). One of them is deliberately unnatural (like "the total number of corners is prime" or "the order in which I drew the shapes" or "if the box contains at least two shapes, then the leftmost shape is a circle, otherwise if one shape then it must be a triangle" - but we want them to be equally concise). 
     - Groups place a bet (e.g., assign 10 points across the four rules, with more on the one they think is most likely). 
     - Then, the instructor reveals the true rule (the unnatural one) and we see who bet correctly.

  **Debrief (15 minutes):** 
     - Map the experience: 
        - Many rules fit the data (underdetermination).
        - On new data, different rules gave different predictions -> we need something else to choose (inductive bias).
        - In the meta round, we saw that even when rules are equally simple and fit the data, we have intuitions about what is natural (but sometimes the unnatural one is chosen arbitrarily).
     - Introduce terms: underdetermination, projectibility (grue), simplicity prior, etc.
     - What the activity might not deliver: 
        - It might not show that there are infinitely many rules that fit the data (we can mention that in debrief).
        - The meta round might not clearly show that the choice is arbitrary because the groups might still think the unnatural rule is "silly" and they wouldn't have chosen it. But that's the point: we often rely on naturalness, but the data alone doesn't force that.
     - Predictable problems:
        - CS students brute-forcing: To avoid, make the rule complex enough (but not too complex) and the feature space small but not trivial. Also, limit time. We are not using a computer, so brute-force is by hand. With 12 examples, it's possible to guess. However, we want multiple rules to be found. So we design the rule to be one that has many equally simple alternatives. 
