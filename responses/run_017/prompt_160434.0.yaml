  Given the time, let's use for the meta round the count example with the four rules including the color rule.

  In the meta round, we present the four rules (R1: exactly two, R2: at least two, R3: even number, R4: all black) and ask which one was used for the first activity's boxes. The true rule for the first activity was R1.

