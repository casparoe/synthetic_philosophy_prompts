  Debrief points:
  - Many rules fit the data: underdetermination.
  - New data exposed that not all rules agree: need for inductive bias.
  - In the meta round, we saw that even with fit and simplicity, we might choose based on naturalness (or we might not), and sometimes the true rule is arbitrary.
  - Introduce terms: underdetermination, projectibility (grue example if time), simplicity prior.

