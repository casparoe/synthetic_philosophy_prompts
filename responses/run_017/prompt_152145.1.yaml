prompt: |-
  hey, hoping you can settle an argument I keep having with a friend. She runs a tiny repertory film-and-lecture series, so she's always deciding whether to show work by people who did bad things, and she'll also just flat out say whether she thinks the thing is still any good. Her rulings so far, as best I can recall:

  - a 1930s studio comedy whose lead was privately a raging antisemite, politics nowhere in the film: screen it, still a great film, no asterisk.
  - a 70s art film where the director pressured a young actress into a scene during the shoot and that scene is the one everybody praises: not screening it, and she says it can't be appreciated innocently once you know.
  - a landscape painting bought with money from a fraud the painter ran on the side, painting has nothing to do with the fraud: still a good painting, hang it wherever.
  - a novel that lifts whole passages from a friend's unpublished manuscript, and the lifted bits are the best writing in the book: still a good novel, but it isn't his novel, she'd only do a reading if the program note said so.
  - a living sculptor with a big museum retrospective who years ago trashed a rival's studio; the work is abstract and unrelated: she went to the show, she'd screen a documentary about the work, but she won't pay him a fee or let him do a live intro.

  Now the new one. A novel from 1962 that basically everyone agrees is a masterpiece. Letters have surfaced showing the author got the material for it by manipulating her younger sister over several years, drawing out her confidences and then building the book's central scene out of the sister's worst humiliation, with names and details changed so thoroughly that nobody, including the family, can spot it. The sister is alive, ninety-ish, and said in an interview that she finds the book's fame a continuation of the betrayal and doesn't want it celebrated. Author died in 1970; the royalties now fund a foundation that gives scholarships in the author's name.

  What's my friend going to say: is it still a great novel, and would she build an evening around it? I care less about the verdict than about which rule she's actually running, because I think at least three fit her track record equally well and come apart right here: value only takes a hit when the flaw shows up in the work or in what appreciating it requires; or value takes a hit when the work is partly made out of the wrong; or value itself never moves at all and only the present-tense relations are up for criticism, who profits and who gets hurt by the celebration. Tell me which you think she's on, what each rule predicts here, and if her record really does underdetermine it, name the one further case you'd put to her to split them. My guess is a case with the betrayal left intact but the sister long dead and no objection on record, but say if that's the wrong probe. Also: is the scholarship money doing any real work here, or is that a red herring?
reasoning: |-
  Okay, let me start by unpacking this user's query. They have a friend who runs a film-and-lecture series and makes decisions about whether to showcase works by problematic artists. The user provided several examples of her past decisions and now wants to predict her ruling on a new case involving a 1962 novel. The author manipulated her sister to get material for the book, and the sister, now in her nineties, feels betrayed. The user is less interested in the verdict itself and more in understanding the underlying principle guiding their friend's decisions. They suspect three possible rules and want to know which one fits, or if the existing cases are ambiguous, what additional scenario could clarify it.

  First, I need to analyze the friend's past rulings to identify patterns. Looking at each case:

  1. **1930s comedy with antisemitic lead**: Screened because the work itself doesn't reflect the artist's flaw. The issue is separate from the art.
  2. **70s art film with coerced scene**: Not screened because appreciating the film requires engaging with the unethical act embedded in the work.
  3. **Landscape painting funded by fraud**: Displayed since the fraud doesn't affect the artwork's content or appreciation.
  4. **Plagiarized novel**: Considered good but requires acknowledgment. The ethical issue is tied to the work's creation (theft of passages), but the friend would still present it with attribution.
  5. **Sculptor who trashed a rival's studio**: The work is displayed, but no financial support or platform is given to the artist. The unethical act is personal, not part of the art, but ongoing relations matter.

  From these, three potential principles emerge:
  - **Aesthetic Autonomy**: Art's value is separate unless the flaw is in the work itself or necessary for appreciation.
  - **Creation Ethics**: The ethical context of the work's creation affects its value.
  - **Present Relations**: Current impacts, like who benefits or is harmed by celebrating the work, dictate the response.

  Now, the new case: a novel based on the sister's betrayal, with her current objection. The sister is alive and hurt by the celebration. The royalties fund scholarships, which might complicate things.

  Breaking down the new case elements:
  - **The work's content**: The betrayal is central but thoroughly disguised, so it's not apparent in the text.
  - **Appreciation requirement**: Knowing the backstory might taint the experience, similar to the coerced scene in the film.
  - **Creation ethics**: The work was built on exploitation, making the creation process unethical.
  - **Present relations**: The sister is alive and objects, and the foundation benefits from royalties.

  Comparing to past cases:
  - Like the 70s film, the work's creation involved harming someone, and that knowledge affects appreciation. But in the film, the harm is visible in the scene; here, it's not. 
  - The plagiarism case involved theft but required acknowledgment. Here, acknowledgment might not suffice because the sister objects to any celebration.
  - The sculptor's case shows that ongoing harm (financially supporting the artist) affects the decision. Here, the author is dead, but the foundation benefits, and the sister is harmed by continued recognition.

  The scholarship money adds complexity. If the friend follows Present Relations, the current harm to the sister might outweigh the good of scholarships. If Aesthetic Autonomy, the money is irrelevant since the art's value is intrinsic. Creation Ethics might view the scholarships as separate but still condemn the work's origin.

  The key factors here are:
  1. **The sister's ongoing trauma and objection**.
  2. **The work's disguised nature** (unlike the film where the scene is integral).
  3. **Foundation benefiting**.

  Past cases suggest that when harm is both in creation *and* affects current relations (like the sister's pain), the friend opts against showcasing. The film was rejected due to appreciation being tainted, and the sculptor denied fees due to current ethics. Here, the sister's objection makes the celebration harmful now, aligning with Present Relations. The scholarships might be a red herring if the immediate harm to the sister takes precedence.

  If the sister were deceased and no objection, the friend might still showcase with acknowledgment, similar to the plagiarism case. But the alive sister's pain tips it towards not celebrating, prioritizing present harm over artistic merit.
answer: |-
  Based on your friend's track record, I'd predict she would **NOT** screen or celebrate the 1962 novel**.** Here's the breakdown of her likely ruling, the underlying rule, how the three potential rules apply, and why her record points to one being primary. I'll also address the scholarship money and propose a clarifying case.

  ### Prediction for the 1962 Novel
  - **Verdict:** Not a "great novel" *in the context of celebration*, and she would **not** build an evening around it.  
  - **Reasoning:** The sister's *ongoing trauma* and explicit objection make the act of celebrating the work a present-tense harm. Even though the betrayal isn't visible in the text, appreciating the novel now requires complicity in the sister's humiliation (akin to the 70s art film). The work is "made out of the wrong" (like the plagiarized novel), but the victim's living voice amplifies the ethical burden. She might privately acknowledge its craft but refuse to platform it publicly.

  ### The Rule She's Running: Present-Tense Relations
  Your friend's decisions consistently prioritize **present-tense ethical relations**—who is *currently* harmed, benefited, or implicated by engaging with the work. Art's intrinsic value rarely changes, but its *celebratory display* is vetoed if it actively perpetuates injustice or trauma *today*.  
  - **Why this fits:**  
    - **70s film:** The coerced scene *requires* present viewers to engage with abuse.  
    - **Sculptor:** She engages with the *work* but avoids paying/spotlighting the *artist* due to his *ongoing* persona (trashing a rival isn't past; it reflects current character).  
    - **Plagiarized novel:** She'd present it *only* with attribution to correct the *current* injustice (denying credit to the true author).  
    - **1930s comedy & painting:** No *current* harm or beneficiary ties (lead’s antisemitism is dead history; fraud money is laundered).  
  - **Novel application:** The sister's interview makes the betrayal *active*—celebrating the novel *now* retraumatizes her. The scholarships don't offset this; they're irrelevant to the sister's pain.

  ### How All Three Rules Apply (and Why They Split Here)
  1. **Flaw-in-the-Work Rule (Value drops only if flaw is visible or required for appreciation)**  
     - **Predicts:** *Screen it*. The betrayal isn't in the text—it's buried under changed details. You can "appreciate innocently" without knowing (unlike the 70s film).  
     - **Contradicts her record:** She rejected the 70s film due to *external* knowledge tainting appreciation. Here, knowing the backstory similarly taints it, but this rule ignores that.  

  2. **Creation Ethics Rule (Value drops if the work is "made out of" wrongdoing)**  
     - **Predicts:** *Don't screen it*. The novel is built on exploitation (like the plagiarized passages), so it's tainted at the source.  
     - **Contradicts her record:** She kept the plagiarized novel in circulation (with credit) and displayed the fraud-funded painting. She cares *how* the wrong affects the work's *current* status, not just its origins.  

  3. **Present-Tense Relations Rule (Value unchanged, but celebration depends on current impacts)**  
     - **Predicts:** *Don't screen it*. The sister's objection makes celebration a *new* act of harm. Royalties funding scholarships don't erase this.  
     - **Fits perfectly:** Aligns with her 70s film rejection (appreciation requires complicity *now*) and sculptor stance (no platform for toxic *living* figures). The scholarship money is secondary to the sister's pain.  

  **Why her record underdetermines this?**  
  - The plagiarism case is closest but differs: there, credit could "fix" the injustice (making it about *current* fairness). Here, no attribution undoes the sister's trauma. The 70s film is similar but involved *visible* harm in the work. This novel splits the difference: harm is *invisible* but has a *living victim objecting*. Your friend's emphasis on the sister's voice suggests present relations trump all.

  ### The Scholarship Money: A Red Herring  
  - It likely **doesn't influence her**. Her past decisions ignore "offsetting" goods (e.g., the fraud-funded painting's beauty isn't redeemed by hanging in a charity). She focuses on direct harm: here, the sister's suffering outweighs abstract scholarship benefits. If anything, the foundation perpetuates the author's legacy, deepening the betrayal.

  ### The Perfect Further Case to Split the Rules  
  Your suggested case (**betrayal intact, sister long dead, no objection**) *is* the right probe, but needs refinement to isolate variables. I'd add:  
  - **The Case:** A 1920s poem by an abusive husband, drawn from his wife's diaries. She died decades ago, never spoke of it. The work is acclaimed; royalties fund domestic violence shelters.  
  - **How it splits the rules:**  
    - **Flaw-in-Work:** Screen it (no visible flaw; appreciation is "innocent").  
    - **Creation Ethics:** Don't screen it (work is "made of" exploitation).  
    - **Present-Tense Relations:** Screen it (no *current* victim or harm; shelters are a net good).  
  - **Your friend's likely ruling:** She'd screen it. No living victim = no present harm. This mirrors her 1930s comedy stance. It confirms Present-Tense Relations as her core rule.

  ### In Summary  
  Your friend is running on **Present-Tense Relations**. Art's value is fixed, but its public celebration is ethical only if it doesn’t *actively* harm people *now* or unjustly enrich/validate bad actors. The sister's interview here is decisive—it makes the novel's celebration a real-time betrayal. For your argument: if your friend *does* screen this, she's likely weighting Creation Ethics more heavily. But based on her history, I’d bet against that.
