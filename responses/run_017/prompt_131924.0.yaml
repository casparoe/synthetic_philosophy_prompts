  We are designing two agents, R and P, in an ordinary setting. The setting I choose is a workplace: an office where employees are required to submit a weekly report every Friday by 5 PM. The report is a standard form that must be filled out and submitted via an online system. The stakes are moderate: timely submission is part of the job performance and affects the employee's evaluation, but occasional late submissions (with good reason) are tolerated without severe consequences. Both agents are employees in this office.

