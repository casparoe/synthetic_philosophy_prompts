  - P has a policy: "I must never submit the report late." This policy is deeply ingrained in P's character due to a past traumatic experience (e.g., a previous job where late submission led to being fired). However, note that we cannot use compulsion or neurological stipulation. Instead, we can attribute it to a deep-seated commitment that P cannot question.
