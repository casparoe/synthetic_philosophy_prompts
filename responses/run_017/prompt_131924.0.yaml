  Alternatively, we can use the fact that the policy was formed under duress (the past trauma) but we cannot use compulsion.

  Perhaps we should focus on the reasons-responsiveness account and argue that the mechanism for policy revision is not responsive. But the theory focuses on the mechanism of the action, not the policy.

  Given the challenge, I propose a different approach for the theories:

  - For **reasons-responsiveness**: The mechanism that produces R's actions is the policy plus the ability to revise it. At the time of each action, R's action is rigid but the mechanism is still responsive because R can adjust the policy for the future. In contrast, for P, the mechanism that produces the actions is the unchangeable policy. While the actions are responsive to immediate reasons, the policy itself is not responsive to reasons for change. However, the theory typically looks at the mechanism at the time of action. So we might need to consider the mechanism of policy revision as part of the overall agency. This might require extending the theory.

  - For **attributability**: We might say that R's policy is truly his own because he can revise it, while P's policy, even if endorsed, is not fully his own because he cannot change it. But this is not standard.

