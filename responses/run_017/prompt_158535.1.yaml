prompt: |-
  Hey — I'm putting together a reading-group session on promising and I want to stop two people in it from re-litigating the same ground for the fourth week. One of them is basically in the practice camp: the obligation to keep a promise is laid down by a social practice with constitutive rules, so there isn't really anything to promise outside of something like that practice (the Hume-on-conventions / Rawls-on-practices lineage). The other is in the assurance camp: what promising does is hand the promisee a distinctive kind of assurance and control over whether they form an expectation, and the wrong of breaking a promise is a wrong about that, not about a rule. Both of them are sick of me saying they secretly agree, so I want something better than that.

  Could you draft the joint statement they'd sign after an actual adversarial collaboration? I'd like:

  - a numbered section of claims both can sign. I'd guess they can agree that promissory obligation is pro tanto rather than absolute, that it isn't just a device for producing good consequences, that it survives cases where breaking would be better overall, that some kind of uptake matters, and that it isn't simply the general duty not to harm or disappoint someone — but you decide what actually belongs there, and don't pad the list with things that are true of every norm whatsoever.
  - then a table of the remaining disagreements, each stated twice: once in the wording the practice camp would accept for its own view, once in the wording the assurance camp would accept for its own, plus a column marking whether you think the disagreement is genuine or just about words.
  - a cruxes section: the sub-questions such that settling one would actually move at least one side. Mine are roughly: (a) whether promising could get off the ground in a one-off exchange between two people with no shared practice behind them; (b) whether the promisee's release extinguishes the obligation or merely waives their complaint; (c) whether a promise nobody could ever detect your breaking — you promise a dying woman you'll burn her letters, then don't, and no one finds out — generates a reason at all; (d) whether the obligation is directed, in the sense that only the promisee can lift it; (e) whether the apparent content-independence of the reason is best explained by the rules of a practice or by the promisor's control over what the promisee expects.
  - for each crux, one concrete case or argument both would accept as bearing on it, with each side's prediction written down in advance. Please invent the cases rather than reaching for the famous ones — I want setups where neither of them has a stock answer memorized. Two constraints: include at least one case where the two stories come apart because the promisee is maneuvered into an expectation with no promissory act anywhere (I've been calling this the eavesdropper case, but use whatever version is cleaner), and at least one where the practice is real but morally infected, e.g. a promise made inside a group whose promissory practice is tangled up with something rotten.
  - if you conclude that some chunk of the dispute is verbal, say which chunk and why, and what the substantive remainder actually is.

  At the end add a short drafter's note from you: which single claim in the agreed section you think one of them would in fact refuse to sign, and what argument or kind of case would make you withdraw it; and where the document is most likely to be a fake compromise, a formulation both can sign only because its empty. I'd rather have that flagged than a tidy ending.
reasoning: |-
  Okay, the user is organizing a reading group on promising and wants to prevent two participants from rehashing the same debate. One follows the practice-based view (Hume/Rawls lineage), the other the assurance-based view. They're tired of being told they agree, so the user wants a structured adversarial collaboration document.

  First, I need to understand the core of each position. The practice camp sees promissory obligation as rooted in social conventions with constitutive rules. Without the practice, promising doesn't exist. The assurance camp focuses on the promisee's control over expectations and the wrong of breaking that assurance, independent of any practice.

  For the joint statement, I'll list claims both can accept. Key areas of agreement: pro tanto obligation (not absolute), not merely consequentialist, obligation persists even if breaking would have better outcomes, some form of uptake matters, and it's not reducible to general harm avoidance. I should avoid padding with universal norms.

  Next, the disagreements table. Each view needs its own wording. Practice camp: obligation derives from constitutive rules; assurance camp: obligation comes from invited reliance. I'll mark whether disagreements are substantive or verbal. For example, "source of normativity" is likely substantive, while "what constitutes a promise" might involve some verbal elements.

  The cruxes are critical: (a) one-off exchange without a practice, (b) release vs. waiver, (c) undetectable breaking, (d) directed obligation, (e) content-independence explanation. For each, I need novel cases. The eavesdropper case (promisee maneuvered into expectation without promissory act) and a morally infected practice case are required.

  For the eavesdropper case: Alex tells Blair they’ll water plants, knowing Casey is listening and will rely on it. Practice camp would say no obligation since no promise was made to Casey; assurance camp might see an obligation due to invited reliance, even if unintended. This tests whether control over expectations alone creates obligation.

  For the morally infected practice: a discriminatory group where promises are used to enforce hierarchy. Practice camp might say obligation exists but is overridden; assurance camp could argue the assurance is invalid due to coercion, so no genuine obligation. This examines whether the practice's morality affects obligation's existence.

  I need to check for verbal disputes. The term "promise" might be used differently, but the core issue is whether social rules or interpersonal assurance ground the obligation. The substantive question is whether obligation can arise without a practice.

  In the drafter's note, Claim 3 (uptake matters) might be shaky for the practice camp if uptake is seen as mere recognition, not constitutive. They might resist if pressed on whether uptake is necessary for obligation or just for identifying a promise. Also, the joint statement might have empty formulations, like "some form of uptake," which both interpret differently.

  Finally, ensure cases are original and not stock examples. The drafted cases (eavesdropper, infected practice, undetectable breaking) should force new reasoning. Predictions should align with each camp's principles.
answer: |-
  Here’s a draft joint statement from the "Practice" and "Assurance" camps after adversarial collaboration, structured to your specifications. It isolates genuine agreements, maps disagreements neutrally, defines cruxes with novel cases, and flags residual tensions.

  ---

  ### **Joint Statement on Promissory Obligation**  
  *Signed by Representatives of the Practice and Assurance Camps*

  #### **Section 1: Agreed Claims**  
  Both camps affirm the following:  
  1. **Pro tanto obligation**: Promissory obligation is defeasible (e.g., overridden by emergencies) but not merely prima facie.  
  2. **Non-consequentialist core**: The obligation does not derive *solely* from the good consequences of promise-keeping (e.g., social utility).  
  3. **Uptake significance**: A promise requires the promisee’s recognition of the promisor’s commitment (e.g., silence ≠ promise).  
  4. **Distinct from harm/disappointment**: Breaking a promise wrongs the promisee in a way distinct from merely causing distress or frustrating expectations *not* grounded in a promise.  
  5. **Survival of obligation in suboptimal cases**: The obligation persists even if breaking it would produce marginally better outcomes (e.g., a trivial net benefit).  

  #### **Section 2: Disagreements Mapped**  
  | Disagreement Topic | Practice Camp Wording | Assurance Camp Wording | Genuine or Verbal? |  
  |-------------------|------------------------|------------------------|---------------------|  
  | **Source of normativity** | Obligation arises from constitutive rules of a social practice. | Obligation arises from the promisor’s invitation of the promisee’s reliance. | **Genuine** |  
  | **Necessity of practice** | No freestanding "promise" exists absent a shared practice defining its rules. | Assurance/control can be created interpersonally without institutional rules. | **Genuine** |  
  | **Nature of wrong** | Wrong is violating a rule-based duty constitutive of the practice. | Wrong is betraying the promisee’s invited trust and usurping their control. | **Genuine** |  
  | **What constitutes a promise** | Requires performative uptake *as a promise* within a practice. | Requires clear communication inviting the promisee to form expectation-at-will. | **Partly Verbal** (disagreement hinges on definition of "promise") |  

  #### **Section 3: Cruxes & Testing Cases**  
  **Crux (a): One-off exchange without shared practice**  
  - **Case**: *The Solitary Pact*  
    Two strangers, stranded on a deserted island with no shared promissory history, orally agree: "I commit to give you half my water rations tomorrow if you guard my sleep tonight." After compliance, the promisor considers reneging.  
  - **Practice Prediction**: No obligation. Without constitutive rules, this is mere mutual agreement, not a "promise."  
  - **Assurance Prediction**: Obligation exists. The promisor invited reliance, granting control.  

  **Crux (b): Release vs. waiver**  
  - **Case**: *The Retracted Release*  
    A promises B to donate $1,000 to Charity X. B says, "I release you." A keeps the money. Later, B says, "I changed my mind; you wronged me by not donating."  
  - **Practice Prediction**: Release extinguishes obligation; B has no standing to complain.  
  - **Assurance Prediction**: Release waives B’s *claim* but A’s obligation may persist (e.g., if charity relied); B’s complaint is invalid but A may still owe the charity.  

  **Crux (c): Undetectable breaking**  
  - **Case**: *The Unwitnessed Vow*  
    A promises their dying friend B to scatter ashes at sea. B dies. A keeps the urn at home. No one else knows of the promise or outcome.  
  - **Practice Prediction**: **No obligation**. Unenforceable/unacknowledged "vows" lack practice-based validity.  
  - **Assurance Prediction**: **Obligation exists**. A violated the directed duty to B, regardless of detection.  

  **Crux (d): Directed obligation**  
  - **Case**: *The Third-Party Enforcer*  
    A promises B not to reveal B’s secret. C (a mutual friend) overhears and threatens A to keep the promise. A reveals the secret anyway.  
  - **Practice Prediction**: Only B can release A; C’s enforcement is irrelevant.  
  - **Assurance Prediction**: Only B can release A; C’s enforcement is irrelevant. *(Both agree here; move to crux e)*  

  **Crux (e): Content-independence explanation**  
  - **Case**: *The Eavesdropper’s Expectation* (Your request)  
    Alex tells Blair: "I *will* water your plants while you’re away," unaware Casey overhears. Casey (who distrusts Alex) relies on this, skipping her own plans to water them. Alex fails to water the plants.  
  - **Practice Prediction**: Alex owes **nothing to Casey**. No promise was *made to her*; social rules require intentional address.  
  - **Assurance Prediction**: Alex **owes Casey an account**. By declaring intent loudly, Alex invited Casey’s reliance, granting control.  

  **Crux (f): Morally infected practice** (Your request)  
  - **Case**: *The Oath of Silence*  
    In a bigoted group, A promises B not to report B’s crime against a marginalized member, per their "code." Reporting would prevent further harm.  
  - **Practice Prediction**: Obligation exists but is overridden (pro tanto wrong still occurred).  
  - **Assurance Prediction**: **No obligation**. The "assurance" is void; the promisee’s "control" perpetuates injustice.  

  ---

  #### **Section 4: Diagnosis of Verbal Dispute**  
  The disagreement over **"what constitutes a promise"** (Sec. 2) is partly verbal. The Practice camp reserves "promise" for practice-embedded acts; the Assurance camp uses it for any act inviting expectation-at-will. **Substantive residue**: Whether the *moral obligation* associated with paradigmatic promises *requires* a practice, or can arise from interpersonal dynamics alone.  

  ---

  ### **Drafter’s Note**  
  **Likely contested agreement**: Claim 3 ("Uptake significance"). The Practice camp may balk if pressed, interpreting "uptake" as *recognition within a practice*, not mere cognitive awareness. They’d withdraw if "uptake" implies the promisee’s mental state *constitutes* (vs. recognizes) the obligation. The Assurance camp sees uptake as the promisee’s *acceptance of control*.  

  **Hollow compromise**: The term "distinct from harm/disappointment" (Claim 4) risks emptiness. Both camps agree promissory wrongs are "distinct," but define the distinction oppositely (rules vs. control). It papers over the core dispute.  

  **Greatest vulnerability**: The Practice camp’s stance on *The Unwitnessed Vow* (Crux c) may seem morally thin (denying posthumous duties). The Assurance camp’s *Eavesdropper* view (Crux e) risks overextending obligation to unintended hearers.  

  This document is a ceasefire, not a truce. —Drafter.  

  ---  
  This structure forces engagement with cruxes where predictions diverge (*Solitary Pact*, *Eavesdropper*, *Oath of Silence*), avoids re-litigating theory, and exposes fault lines. Assign pre-commitments to the predictions to prevent backtracking.
