  Hmm, they've clearly thought deeply about this. They mention working in freight pricing and being part of a reading group, so they likely have practical experience and theoretical interest. The key points they emphasize are: (1) the decay happens because information isn't produced, not because existing information is ignored; (2) the aggregate remains accurate even as its foundations erode, making the decay invisible until failure; and (3) it's distinct from herding or cascades where people override their private signals.

  Let me unpack their examples. The hiring committee scenario they reject is classic pluralistic ignorance or Abilene paradox - that's not their case. Their phenomenon is more insidious: no one even bothers to gather private information anymore because the aggregate seems sufficient. The accuracy persists due to residual inputs or incidental gatherers, so it's a slow burn. 

  I recall the Grossman-Stiglitz paradox about markets - if prices perfectly reflect information, no one has incentive to gather costly information. But that's an equilibrium impossibility result, while the user describes a dynamic decay process. Also, their case allows for persistent accuracy despite eroding foundations, which equilibrium models don't capture. 

  Reflexivity (like Soros' feedback loops) involves beliefs altering fundamentals, but here it's about information production drying up, not reality changing. 

  So what's left? The core is the invisible erosion of epistemic infrastructure. I think we need a new term: perhaps "epistemic exhaustibility" or "grounding decay." But let me test this against their boundaries. 

  The user will want crisp distinctions: 
  - Vs. herding: here no private signals exist to override 
  - Vs. equilibrium paradoxes: this is about gradual institutional decay, not static impossibility
  - Vs. reflexivity: no alteration of the underlying reality

  The naming should reflect the slow consumption of information capital. "Epistemic exhaustibility" captures that the resource (willingness to investigate) is depletable. "Grounding decay" emphasizes the hidden erosion of foundations. 

  I should make clear the phenomenon has three phases: 
  1. Healthy aggregation with diverse inputs 
  2. Success breeds reliance, reducing investigation 
  3. Accuracy persists via inertia until crisis 

  This seems useful for their freight pricing context - where benchmark prices might lose connection to actual supply chain data over time. They'll appreciate the concrete parallels.
answer: |-
  Based on your precise description and boundary conditions, I'll proceed stepwise: identify candidate concepts, test fit, analyze gaps, and synthesize a new term if needed. The phenomenon you describe is distinct and requires careful dissection.

  ### Candidate Concepts & Their Fit Tests
  1.  **Grossman-Stiglitz Paradox (GSP):**
      *   **Core Claim:** In efficient markets, if prices perfectly reflect all available information, no agent has incentive to incur costs to gather information. Perfect information revelation is impossible in equilibrium because it destroys the incentive to gather the information it reveals.
      *   **Fit Test:**
          *   **Alignment:** Captures the core dynamic: the success of the aggregate (price) undermines the incentive to produce the private inputs that sustain it. Directly addresses the "cousin" question about trading motivation.
          *   **Misalignment:** Primarily a static *equilibrium impossibility* result. It doesn't model the *slow, unobservable decay* you emphasize, where accuracy persists despite eroding grounding ("accuracy outlives grounding"). GSP focuses on the *impossibility* of perfect revelation *because* of incentive failure, not the *gradual degradation* of an *imperfect but still functional* aggregator due to declining input quality/quantity. The "invisible decay" aspect is absent. GSP also doesn't emphasize the *non-production* of information (vs. override) as the primary failure mode, though it's implied.

  2.  **Epistemic Free Riding / Rational Ignorance:**
      *   **Core Claim:** Individuals rationally choose not to invest in costly information acquisition if they can benefit from the information aggregated/possessed by others ("free ride").
      *   **Fit Test:**
          *   **Alignment:** Explains the *mechanism* of declining inquiry: reliance on the trusted aggregate makes individual investigation seem irrational due to cost. Directly addresses the *non-production* of new private information.
          *   **Misalignment:** Typically framed at the *individual* decision level within a *stable* informational environment. It doesn't inherently model the *feedback loop* where the aggregate's *own quality* degrades *because* of this free-riding, nor the *lag* where aggregate accuracy persists despite the decline in grounding inputs ("residue," "own operations"). The systemic decay of the *institution's epistemic base* due to its success is not central. Free riding can occur without necessarily hollowing out the source.

  3.  **Reflexivity (Soros-type):**
      *   **Core Claim:** Participants' perceptions (based on the aggregate) can influence the fundamentals the aggregate is meant to reflect, creating feedback loops that distort the relationship between perception and reality.
      *   **Fit Test:**
          *   **Alignment:** Captures a dynamic feedback loop where the aggregate's success alters behavior, potentially undermining the conditions for its own validity. Highlights the disconnect between perception (aggregate accuracy) and underlying reality (eroding grounding).
          *   **Misalignment:** Your case focuses on the *withdrawal of information production*, not on the aggregate *actively distorting* the underlying reality it's meant to track (e.g., a high stock price making a company *actually* more creditworthy). The decay stems from *depletion of inputs*, not *alteration of the target*. The "invisible decay" due to residual inputs isn't a key feature of reflexivity models.

  ### Analysis of Gaps and Distinctions
  *   **Common Gap:** None fully capture the **slow, unobservable decay where accuracy persists due to residual inputs or incidental gatherers ("accuracy outlives grounding")**. This is your defining, novel element.
  *   **vs. Herding/Informational Cascades:**
      *   Herding/Cascades involve agents *overriding* their *existing* private signals based on observed public actions/beliefs of others. Your case is crucially different: **private information *is never produced***. There's no signal to override. Cascades can collapse quickly when one dissenter acts; your phenomenon has nothing to dissent *with* and collapses only when residual inputs fail.
  *   **vs. Self-Defeating/Reflexive Predictions:**
      *   These typically involve a *specific prediction* causing actors to behave in ways that negate it (e.g., predicting a shortage causes hoarding, *creating* the shortage). Your case is about the *ongoing function* of an aggregating *institution* (price, forecast, ranking) decaying due to its *general success and trustworthiness*, not a specific prediction being negated. The mechanism is withdrawal of input, not reaction to a prediction.

  ### Synthesis: A New Concept - "Epistemic Exhaustibility" or "Grounding Decay"
  Your phenomenon requires a distinct concept. I propose **"Epistemic Exhaustibility"** (focusing on the depletable resource) or **"Grounding Decay"** (focusing on the erosion of foundations). Let's define it formally:

  **Epistemic Exhaustibility (Grounding Decay):** *The process by which the very success and trustworthiness of an information-aggregating institution (e.g., market price, forecast, ranking) systematically erodes its own epistemic foundation. As reliance on the aggregate increases, the rational incentive for individual participants to invest in generating novel, independent information inputs diminishes. Crucially, the aggregate's accuracy may persist significantly longer than its grounding due to residual inputs from past inquiries or information generated incidentally for purposes unrelated to sustaining the aggregate. This creates an invisible decay where the institution remains reliable until a point where the depletion of grounding inputs causes a sudden, often unexpected, failure of accuracy.*

  **Defining Features:**
  1.  **Institution-Centric:** Applies to systemic information aggregators (prices, forecasts, etc.).
  2.  **Success-Induced Erosion:** Trust/accuracy *causes* the decline in input generation.
  3.  **Input Non-Production:** Core failure is the *lack of generation* of new private information.
  4.  **Accuracy/Decay Lag:** Accuracy persists visibly despite invisible erosion of grounding ("phantom accuracy").
  5.  **Residual/Incidental Sustenance:** Decay is masked by past inputs or inputs generated for other reasons.
  6.  **Delayed Collapse:** Failure occurs not through cascading doubt, but when grounding inputs are finally exhausted or overwhelmed by change.

  ### Case Demarcation
  *   **Clearly In:**
      *   A commodity futures price, trusted implicitly, leading traders to stop costly physical verification trips (relying on satellites/aggregate). Price remains accurate based on past reports & data from large integrated firms (who survey for their own logistics, not trading), until a localized supply shock (missed due to lack of boots-on-ground) causes a major price dislocation.
      *   A highly-regarded analyst consensus forecast. Portfolio managers stop independent fundamental analysis, relying solely on the consensus. The consensus remains accurate for years, sustained by inputs from a few boutique analysts (who survive on niche consulting) and historical data correlations, until a structural market shift occurs that the consensus misses entirely.
      *   University rankings heavily reliant on reputational surveys. Academics stop filling out surveys diligently (seeing them as pointless since the ranking is "known"). The ranking remains stable for cycles, sustained by inertia and inputs from administrators, until a methodological change or scandal reveals the decayed input base, causing a major, unexpected shift.
  *   **Clearly Out:**
      *   **Herding/Cascade:** Investors ignoring their own negative analysis of a stock because its price keeps rising (they *have* info and override it).
      *   **Abilene Paradox (Your Hiring Example):** Committee members publicly supporting a candidate they privately dislike due to perceived group pressure (they *have* private info but suppress it).
      *   **Grossman-Stiglitz Paradox:** The theoretical *impossibility* of perfectly informative prices in equilibrium due to lack of information gathering incentives (static impossibility vs. dynamic decay).
      *   **Simple Reflexivity:** A CEO's bullish public statements (based on the high stock price) boosting investor confidence and *actually* improving sales briefly, making the price temporarily "correct" for the wrong reasons (aggregate *alters* the target reality).
      *   **Predictable Obsolescence:** A weather forecast model becoming inaccurate simply because climate patterns changed, *without* any link to the model's own success reducing data gathering.

  ### Relationship to Nearest Concepts
  *   **GSP:** Captures the *incentive incompatibility* at the core. **Epistemic Exhaustibility** is the *dynamic, real-world process* this incompatibility manifests as – a slow decay of grounding inputs within an *imperfectly* efficient institution, masked by residual accuracy, rather than proving perfect efficiency impossible.
  *   **Epistemic Free Riding:** Explains the *individual rational choice mechanism* (not investigating). **Epistemic Exhaustibility** describes the *system-level consequence* of widespread free-riding *within a successful aggregator*: the gradual, invisible depletion of the resource (grounding inputs) the free riders depend on.
  *   **Reflexivity:** Shares the *feedback loop* structure (success alters behavior). **Epistemic Exhaustibility** is a specific type of negative feedback loop where the behavior altered is *input withdrawal*, and the consequence is *depletion of grounding*, not necessarily *distortion of the target reality*.

  Your phenomenon is a distinct, insidious pathology of successful information aggregation: the institution consumes the seed corn of its own epistemic legitimacy while maintaining the appearance of health until the moment of famine. "Epistemic Exhaustibility" names this specific erosion process where accuracy becomes detached from its grounding foundation.
