  | :--------------------------- | :----------------- | :---------------- | :----------------- | :------------ | :----------- | :----------- | :-------------- | :---------- | :-------------- | :----------- | :---------------------- | :------------------------------------ |
  | **a) Straight Aggregation**  | ❌ (Bypasses)      | ❌                | ❌ FAIL            | ⚠️ (Maybe)    | ✅            | ❌ (Allows)   | ?               | ?           | ✅              | ⚠️           | ?                       | Violates core individualism (1,2,3). |
  | **b) Scanlon Pairwise (WWI)**| ✅                 | ✅                | ✅                 | ✅             | ❌ (Fails)    | ✅            | ⚠️ (Per event?) | ✅           | ❌ (Vague)      | ❌ (Ex post)  | ❌                      | Fails dilution (5); Opaque operation. |
  | **c) Threshold/Tie-Breaker** | ⚠️ (Post-hoc?)    | ⚠️ (Weakens)     | ⚠️ (Agg lite?)    | ✅ (If set hi) | ✅            | ❌ (Risk)     | ?               | ✅           | ✅              | ⚠️           | ⚠️                     | Threshold justification; Shrapnel risk (6). |
  | **d) Ex Ante Expected Compl.**| ⚠️ (Shifts agent) | ⚠️ (Transforms)  | ⚠️ (Agg expected) | ⚠️            | ✅            | ❌ (Allows)   | ✅ (Whole life) | ✅           | ✅              | ✅            | ❌                      | Abandons ex post rejection (2); Smuggles aggregation (3). |
  | **e) Complaint-Counting**    | ❌ (Bypasses)      | ❌                | ❌ FAIL            | ❌             | ✅            | ❌ (Allows)   | ?               | ?           | ✅              | ⚠️           | ?                       | Covert aggregation (3); Fails asymmetry (4), shrapnel (6). |

  **Legend:** ✅ = Likely Satisfies, ⚠️ = Partially/Questionably Satisfies, ❌ = Likely Fails, ? = Highly Dependent on Specifics

  **Crucial Takeaway:** The scorecard highlights the fundamental trade-off. Approaches satisfying the core non-aggregative requirements (1-4, 6) struggle fatally with dilution (5). Approaches handling dilution (5) and operational needs (9-10) either fail the core requirements (a, e), rely on dubious thresholds (c), or fundamentally transform the framework by adopting ex ante aggregation (d). Scanlon's own (b) nails the core but stumbles on dilution and usability. **There is no clean, uncontroversial solution within pure Scanlonian constraints that handles all cases adequately.** The specification reveals why the problem remains a central debate. Your task is to navigate these tensions with clear eyes. Focus on why Requirement 5 (Dilution) is the true bottleneck.
