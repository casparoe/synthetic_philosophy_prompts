  First, I need to recall the core of Scanlon's contractualism. It's about principles that no one could reasonably reject based on their personal burden. Aggregation is tricky here because individual complaints can't be summed up like in utilitarianism. The user wants criteria that any solution must meet, regardless of the approach (like Scanlon's own pairwise comparison method).

  Looking at their cases: the plain case (one limb vs. many trivial benefits), dilution (same total benefit spread thinner), shrapnel case (breaking a big loss into small parts), same-person-over-time, reverse direction, mixed motives, and conditional existence. Each tests different aspects of aggregation.

  The user also wants to flag conflicting requirements. For example, avoiding totalism while handling dilution might be impossible. They suspect that some requirements are smuggled in, like completeness or institutional feasibility, which aren't core to contractualism.

  Key criteria must be rooted in contractualism: individual justifiability, no direct aggregation, and reasonable rejectability. Then there are desiderata like handling dilution and shrapnel without collapsing into aggregation. Institutional usability might be practical but not essential. The shrapnel case is crucial—if breaking down a big loss allows aggregation, it might undermine the whole framework.

  The user might have deeper needs: clarity on what's non-negotiable vs. negotiable, identifying true conflicts between criteria, and ensuring the solution stays true to contractualism's ethos. They might also want to avoid common pitfalls where solutions covertly reintroduce aggregation.

  Prioritizing criteria: Individual Justifiability and the Shrapnel Test are probably the most critical. If a solution fails the shrapnel test by allowing disaggregation, it risks becoming a form of aggregation. Also, the dilution problem challenges whether spread benefits can ever outweigh a significant individual loss.

  In the scorecard, approaches like straight aggregation inside contractualism likely fail individual justifiability. Scanlon's pairwise comparison might struggle with dilution. Threshold views could handle some cases but need careful setup. Ex ante methods introduce new issues with reasonable rejection.

  The biggest tension is between avoiding aggregation and solving the dilution problem. If a principle allows many tiny benefits to override a big loss by spreading it thin, that's problematic. But if it doesn't, then large numbers can't justify policies that cause significant harm to a few. This might be an inherent conflict in contractualism, pointing to a fundamental limitation.
answer: |-
  Here’s a specification for what a contractualist solution to aggregation **must** achieve to count as adequate, broken down by requirements, their justifications, and non-negotiable status. I’ll flag tensions and "smuggled" assumptions, then handle your cases, and end with a scorecard.

  ---

  ### **Core Non-Negotiable Requirements (From Contractualism Itself)**
  1.  **Individual Justifiability:** The principle must justify a policy to each affected individual *in isolation*, explaining why *their* burden (if imposed) is not unreasonable given the benefits to others, without summing burdens/benefits across persons.
      *   **Why:** Contractualism’s foundation: Principles are rejected based on individual reasons ("*I* could reasonably reject this because of *my* burden"). Summing violates this individualism.
      *   **Non-Negotiable:** YES. Foundational to the framework.
  2.  **Reasonable Rejectability Test:** The solution must operate within the logic of reasonable rejectability. It must identify a principle such that the individual with the strongest complaint *cannot reasonably reject* it, considering the reasons others have for wanting it.
      *   **Why:** Defines the contractualist "test" (Scanlon’s WWO). Any solution must fit this structure.
      *   **Non-Negotiable:** YES. Defines the game.
  3.  **No Direct Aggregation:** The solution cannot *directly* sum welfare units, complaint strengths, or "numbers of complaints" across individuals to determine permissibility.
      *   **Why:** Follows directly from (1) & (2). Aggregation across persons bypasses individual justifiability.
      *   **Non-Negotiable:** YES. The core challenge.
  4.  **Handles Asymmetry & Thresholds:** Must explain why a *large* individual burden cannot be overridden by *many small* benefits spread across others, but *might* be overridden by *sufficiently large* benefits to others or by preventing *other large* burdens (under specific conditions).
      *   **Why:** Intuitions behind cases like the limb/headache case and rescue cases. Reflects the non-fungibility of severe harms.
      *   **Non-Negotiable:** YES (for adequacy). A solution failing this fails core contractualist intuitions.

  ### **Essential Desiderata (Strongly Required for Adequacy)**
  5.  **Addresses the Dilution Problem:** Must specify *if/when* spreading the *same total benefit* over more people (making each individual benefit smaller) weakens the case for imposing a burden, and *why*.
      *   **Why:** Tests the core mechanism. Does the solution rely on individual complaint strength or the *number* of individuals with a complaint? Dilution forces this apart.
      *   **Non-Negotiable?** FUNCTIONALLY YES. A solution collapsing under dilution is implausible and likely violates (4).
  6.  **Passes the Shrapnel Test:** Must explain why breaking a *single large burden* (e.g., death) into *many smaller burdens* (e.g., many minor injuries) *does not* magically make aggregation permissible if the benefits remain distributed.
      *   **Why:** Prevents cheating via re-description. If shrapnel works, aggregation is back door.
      *   **Non-Negotiable?** FUNCTIONALLY YES. Failing this likely means the solution is covert aggregation.
  7.  **Clarity on Temporal Identity (Same-Person):** Must state whether benefits/burdens accruing to the *same person over time* are treated differently from benefits/burdens accruing to *different persons*. If different, justify why.
      *   **Why:** Tests the scope of "individual justifiability." Is it indexed to person-stages or whole lives?
      *   **Non-Negotiable?** YES for specification. The solution *must* have a coherent position here, even if controversial.
  8.  **Handles Reverse Direction:** Must apply symmetrically (or explain asymmetry) to cases where one gains a large benefit and many suffer small burdens.
      *   **Why:** Tests robustness and fairness. Contractualism should handle "losses" and "gains" consistently in its rejection logic.
      *   **Non-Negotiable?** YES for coherence.

  ### **Pragmatic/Contextual Desiderata (Important for Institutional Use)**
  9.  **Operationalizability:** Principles/rules must be sufficiently clear and determinate for an institution (e.g., triage board) to apply under realistic constraints (time, information).
      *   **Why:** Your stated purpose ("hand to an institution").
      *   **Smuggled?** YES, partially. Pure contractualism might prioritize theoretical justification over easy application. This requirement pushes towards rules/thresholds.
  10. **Ex Ante Justifiability (Role-Rotation):** Must provide justification acceptable to individuals *before* they know their specific role (victim/beneficiary), especially in mixed-motive/risk-imposition cases.
      *   **Why:** Crucial for fairness in policy design where individuals share risks (e.g., transport safety).
      *   **Smuggled?** POTENTIALLY. Pure ex post rejection (Scanlon’s focus) struggles here. This requirement often pushes towards ex ante perspectives or veil-of-ignorance elements, which some see as non-contractualist.
  11. **Handles Conditional Existence:** Must specify if/how benefits to contingent future persons count in the reasonable rejection calculus of existing persons.
      *   **Why:** Relevant for population ethics, resource allocation for future gens.
      *   **Smuggled?** PARTIALLY. Contractualism’s core is interaction between existing moral agents. Including contingent persons is an extension requiring specific justification within the framework.

  ### **Handling Your Cases (What the Solution Must Do)**
  *   **Plain Case (Limb vs. 10k Headaches):** Solution must explain why the limb-loser *cannot reasonably reject* a principle permitting this, *without* summing headaches. If it forbids aggregation, it must explain why the limb-loser *can* reasonably reject it.
  *   **Dilution:** Solution must show *why* increasing the number of beneficiaries while holding total benefit constant (reducing per-person benefit) either (a) eventually makes the policy impermissible (if it rejects aggregation), or (b) explains why per-person benefit size is what matters, not number. *Crucially, it must say which factor drives the change.*
  *   **Shrapnel Case:** Solution must explain why disaggregating the victim's loss into many minor losses **does not** suddenly make a policy imposing those minor losses (to save many others from minor harms) permissible, if the plain case is impermissible. It must block this aggregation backdoor.
  *   **Same-Person-Over-Time:** Solution must clearly state if the individual justifiability is to the *person-at-the-time-of-burden* or the *person-over-their-whole-life*. E.g., Can "future you" reasonably reject a principle allowing "present you" to accept small pleasures causing a future serious injury? This tests the temporal scope of the contracting agent.
  *   **Reverse Direction:** Solution must apply the same logic: Can the many small-losers reasonably reject a principle allowing one large gain? Or is there an asymmetry? (e.g., losses might "count more").
  *   **Mixed-Motive/Role-Rotation:** Solution must provide justification acceptable to all under conditions of uncertainty about role *and* acknowledge their shared role in imposing risks/benefits. Ex ante perspective often crucial here.
  *   **Conditional Existence:** Solution must state whether the potential beneficiaries' interests give *existing* individuals a reason to accept a principle, or if only existing persons' interests count in rejection.

  ---

  ### **Suspected Incompatibilities & Key Tensions**
  1.  **The Central Tension:** Satisfying **Individual Justifiability (1)** + **No Direct Aggregation (3)** + **Handles Asymmetry (4)** while also convincingly **Addressing Dilution (5)** and enabling plausible policy choices in large-number cases is **extremely difficult, likely impossible** without smuggling in aggregation or weakening individualism. *Dilution (5) is the key driver of this tension.*
  2.  **Shrapnel Test (6) vs. Complaint Granularity:** If "complaints" are defined too finely (e.g., each minor shrapnel injury is a separate complaint), the Shrapnel Test fails, allowing aggregation by re-description. If defined too coarsely (e.g., only "overall life impact" matters), individual justifiability over time (7) and in complex cases becomes murky. Defining the "complaint unit" is critical and perilous.
  3.  **Ex Ante (10) vs. Ex Post Focus:** Pure ex post reasonable rejection struggles badly with risk and role rotation (10). Incorporating ex ante perspectives often feels necessary for institutions but risks abandoning core contractualist individualism for a more Rawlsian/Harsanyian approach.
  4.  **Operationalizability (9) vs. Theoretical Purity:** Simple thresholds or tie-breakers might work for institutions but often lack deep justification within the individualist rejection framework.

  **Biggest Source of Tension:** **Requirement 5 (Dilution)**. It relentlessly exposes the weakness of non-aggregative approaches in large-number cases and forces either implausible results (no aggregation ever) or concessions that risk collapsing into aggregation (e.g., via complaint counting under a threshold). **Requirement 6 (Shrapnel)** is the strongest guard against this collapse.

  **Most Likely Smuggled Requirement:** **Requirement 10 (Ex Ante Justifiability / Role-Rotation)**. While crucial for real-world application, a strict Scanlonian might argue the core framework is about *ex post* reasonable rejection of principles governing actual outcomes, not ex ante risks. Solutions accommodating (10) often subtly shift the framework.

  ---

  ### **Candidate Solution Scorecard**

