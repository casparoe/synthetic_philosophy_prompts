  We are to design a case in which old evidence supports a new theory through structural features rather than likelihood. The constraints are:

  1. Ordinary empirical investigation (epidemiology or reliability engineering).
  2. Evidence E is a statistical regularity, already known and certain.
  3. New theory T is genuinely novel: its central quantities were not expressible in the old language.
  4. T has no confirmed novel predictions; only old evidence supports it.
  5. The rival is a standing theory R with an auxiliary A, which was independently motivated and accommodates E. Likelihood of E under T and under R∧A is roughly equal.
  6. The T-to-E connection is probabilistic (no deduction).

  We want to show that despite tied likelihoods and the fact that E is old, T is supported over R∧A because of structural considerations (like parsimony or unification).

  Let me design an epidemiological case.

  **Scenario:**

  In epidemiology, the standing theory R is that a particular disease (say, "Syndrome X") is caused by a combination of genetic predisposition and environmental exposure to a toxin (Toxin A). The evidence E is a well-established statistical regularity: in every major study, the incidence of Syndrome X in cities with high levels of Toxin A is 10 times higher than in cities with low levels, even after controlling for known genetic markers. However, there is a puzzling feature: the relative risk of 10 is constant across all age groups, despite the fact that the disease is known to be progressive and cumulative exposure would be expected to show increasing relative risk with age.

  The standing theory R (genetic predisposition and environmental exposure) has been supplemented with an auxiliary hypothesis A: that there exists an unobserved genetic factor (call it Gene B) that is prevalent in certain populations and that interacts with Toxin A in such a way that the relative risk is constant across age groups. This auxiliary A was introduced independently to explain another phenomenon: the observed familial clustering of Syndrome X that was not accounted for by the known genetic markers. So A was not introduced solely to explain E, but it does also explain E (the constant relative risk).

  A new theory T is proposed. T posits that Syndrome X is caused by an infectious agent (a virus) that is transmitted through contaminated water. The virus is activated only in the presence of Toxin A. The theory T explains the constant relative risk across age groups because the virus, once activated, causes the disease in a fixed proportion of those infected, regardless of age. The virus is ubiquitous in the water supply in cities with high Toxin A (because the toxin is discharged into the water) and rare elsewhere. The 10-fold relative risk is then the probability of developing the disease upon exposure to the activated virus.

  Both T and R∧A explain E (the constant relative risk of 10) and assign it a high likelihood. The evidence E is old and well-established. The new theory T has not yet made any novel predictions that have been confirmed.

  **Check: Why conditionalization doesn't help**

  At the time T is proposed, E is already known. So conditionalizing on E does not change the probability of T. The prior probability of T, P(T), is low because it is a novel theory (with central quantities not expressible before, such as the virus). The prior for R∧A is higher because R is the standing theory and A was independently motivated.

  The likelihoods are tied: P(E|T) ≈ P(E|R∧A). Therefore, the ratio of the posterior probabilities P(T|E)/P(R∧A|E) is the same as the prior ratio P(T)/P(R∧A). Without a boost from the likelihood, T does not gain on R∧A via conditionalization.

  **Hypothetical prior fix (Garber-style) also doesn't help**

  Suppose we run the update with a hypothetical prior in which E is not known. Then we would update on E. But because P(E|T) ≈ P(E|R∧A), the ratio P(T)/P(R∧A) after updating on E would be the same as the prior ratio in that hypothetical prior. However, we have to assign priors in that hypothetical state. In that state, T is a novel theory and would be assigned a low prior. R∧A would be assigned a higher prior because R was the standing theory and A was independently motivated (even without E, A was introduced for familial clustering). Thus, after updating on E, T still does not gain relative to R∧A.

  **Glymour-style bootstrapping is unavailable**

  Bootstrapping would require that from T and E we can deduce some instance of T. But the connection between T and E is probabilistic: T says that the virus causes the disease in a fixed proportion, but that proportion is not deducible from E alone. It is estimated from E. Moreover, the virus itself is not directly observed. So we cannot deduce the existence of the virus from E and T; T is a hypothesis that explains E.

  **The hard part: Why the scientist is not confused and T is supported by E**

  The scientist cites E as a reason to prefer T over R∧A. Why is this not confused? Because of the structural virtues of T: it unifies the evidence and is more parsimonious.

  - **Unification**: T explains both the constant relative risk (E) and the familial clustering (which was the reason for introducing A) without the need for an auxiliary. In fact, T explains familial clustering because the virus might be transmitted within families (e.g., through shared water at home). Thus, T unifies two phenomena (the constant relative risk and familial clustering) that R∧A explains by two separate mechanisms (the toxin exposure and the genetic factor). T provides a single mechanism (the virus) that accounts for both.

  - **Parsimony**: T does not require an auxiliary hypothesis for the constant relative risk. The auxiliary A (the unobserved genetic factor) is not needed under T. Moreover, R∧A requires two distinct factors (toxin and gene) and their interaction, while T requires the virus and the toxin (which activates the virus). However, note that T also requires the toxin. But the toxin is already in R. So the key is that T replaces the auxiliary A (the gene) with a mechanism that is already suggested by the evidence (the virus).

  But how do we formalize this? We can use a prior that charges for extra auxiliary hypotheses. That is, we assign a prior over theoretical packages that is inversely proportional to the complexity of the package (number of adjustable parameters, or number of independent hypotheses). In this case:

  - R∧A is a package of two independent hypotheses: R (toxin and known genetics) and A (a new gene). The auxiliary A was independently motivated, but it is still an extra component.

  - T is a single hypothesis (the virus) that replaces R and A. Note that T does not require the known genetic markers? Actually, T might be compatible with genetic factors playing a role in susceptibility, but the core of T is the virus. For simplicity, let's assume that T does not require any new auxiliary beyond the virus.

  Alternatively, we can think in terms of explanation: T provides a common cause for both the constant relative risk and the familial clustering, while R∧A treats them as separate.

  **Diagnosis: Where the support lives**

  The support comes from the prior over theoretical structures. We assign a prior that penalizes complex theories. Specifically, we use a simplicity prior: the prior probability of a theory decreases with the number of independent hypotheses it requires. Thus:

  P(R∧A) = P(R) * P(A|R) 

  But if we assume that A is independent of R (because it was introduced for independent reasons), then P(R∧A) = P(R) * P(A). Since both P(R) and P(A) are less than 1, the product is smaller than either. However, we must compare to P(T). How do we assign P(T)?

  The key is that T is a single hypothesis that explains the same phenomena that R and A together explain. So we can assign:

  P(T) = k   (some constant)

  P(R∧A) = P(R) * P(A)   (if we assume independence)

  But note: in the hypothetical prior (without E), we have to assign these priors. Without E, what is the motivation for T? None, so P(T) would be low. But without E, the motivation for A is still there (familial clustering). So in the hypothetical prior, P(A) is not negligible.

  However, we can argue that the prior should account for the number of independent postulates. The package R∧A has two independent postulates (R and A), while T has one. If we assign the prior as proportional to (1/s) * exp(-c * complexity), where complexity is the number of independent hypotheses, then:

  Complexity(T) = 1
  Complexity(R∧A) = 2   (if we count R and A as two)

  Thus, P(T) / P(R∧A) = [exp(-c * 1)] / [exp(-c * 2) * P0]   (where P0 is a normalization that accounts for the fact that R and A are separate) but note that the prior for R∧A is the product of the priors for R and A, which are each less than 1.

  Alternatively, we can use a prior that is based on the description length. But the key is: the structural virtue (simplicity) gives T a higher prior than R∧A.

  Therefore, in the hypothetical prior (without E), we have:

  P(T) > P(R∧A)   because T is simpler? Not necessarily. Without knowing about E, T might seem ad hoc for the familial clustering? But wait, without E, we don't have the constant relative risk. The familial clustering is explained by A. T, without E, is a new hypothesis that might explain familial clustering? So we have to assign priors without E.

  This is tricky. Let me try:

  In the hypothetical prior state (without E), the evidence we have is:
  - Syndrome X occurs in families (familial clustering).
  - There is an association with Toxin A, but without E we don't know about the constant relative risk.

  So without E, the motivation for T is weak because we don't have the constant relative risk. But without E, we do have the familial clustering and the association with Toxin A. The standing theory R (toxin and known genetics) explains the association with Toxin A but not the familial clustering. So we have the auxiliary A to explain the familial clustering.

  Now, T (the virus) is proposed to explain the familial clustering? It would be an alternative to A. Without E, we might compare T and A for explaining familial clustering. But T is a new kind of entity (a virus), so it might be assigned a lower prior than A (a genetic factor) because genetics is more familiar? This is messy.

  We need to set the case so that without E, the prior for T is not too low. Alternatively, we can note that the simplicity of T (as a unified explanation) gives it a higher prior than the conjunction of R and A even without E? But without E, R and A are not conjoined? Without E, we have R (which explains the toxin association) and A (which explains the familial clustering). They are separate. The new theory T, if proposed without E, might be an alternative for A. But then we are comparing T (virus) to A (gene) for explaining familial clustering. Without E, T might not be as good as A because A (a gene) is within the existing framework (genetics). So we have to make T more plausible.

  Alternatively, we can argue that in the hypothetical prior, the scientist would have considered both the toxin association and the familial clustering. The theory T explains both with one mechanism (the virus transmitted in water and activated by toxin), while the standing approach uses R for the toxin and A for the familial clustering. So T is a unified theory.

  Therefore, in the hypothetical prior, we assign:

  P(T) = prior for a unified theory that explains both the toxin association and the familial clustering.

  P(R∧A) = P(R) * P(A)   [if independent]

  But P(T) should be greater than P(R) * P(A) because T is one theory while R and A are two? Only if we think that the prior for a single theory that explains two separate phenomena is higher than the product of two separate theories. This is the principle of unification.

  So we set:

  P(T) = k   (a constant for a single unified theory)

  P(R) = r, P(A) = a, then P(R∧A) = r * a

  If k > r * a, then T has a higher prior.

  In the hypothetical prior, without E, we update on E:

  P(T|E) = P(E|T) * P(T) / P(E)
  P(R∧A|E) = P(E|R∧A) * P(R∧A) / P(E)

  Since P(E|T) ≈ P(E|R∧A), we have:

  P(T|E) / P(R∧A|E) = P(T) / P(R∧A) = k / (r*a)

  If k > r*a, then T is favored.

  Why would k > r*a? Because the prior for a unified theory is higher than the product of the priors of two independent theories. This is a standard Bayesian approach to unification (e.g., by Wayne Myrvold).

  Therefore, the support for T comes from the higher prior it gets because of unification.

  **What if we remove the feature?**

  - If T needs an auxiliary of its own: Suppose T requires an auxiliary B (say, that the virus is activated only by Toxin A and no other toxin). Then the complexity of T becomes 2 (the virus and the activation condition). Then T and R∧A have the same complexity (both 2). Then the prior ratio would be about the same? But note: the activation condition might be part of T. So we must define T as including that. Then T is still one hypothesis? Alternatively, if we split it, then T becomes two. Then the prior advantage disappears.

  - If we drop A and have R alone: Then R alone cannot explain E (the constant relative risk). So P(E|R) is low. Then T would have a higher likelihood than R. But that's likelihood-based confirmation. We want a case where likelihoods are tied.

  - If A is dropped and R alone faces T, and the marginal likelihood of E under R is lower, then T would get a boost from the likelihood. But that's not our case.

  **How the strict conditionalizer or likelihoodist would attack the case**

  The strict conditionalizer (who only updates by conditionalization) says: at the time T is proposed, E is already known. So we cannot update on E again. Therefore, the probability of T is fixed by the prior. But the prior for T is low. Therefore, we have no reason to prefer T over R∧A.

  The likelihoodist (who denies that parsimony and unification are evidentially relevant) would say: the only evidential support comes from the likelihood. Since the likelihoods are tied, E does not support T over R∧A. The fact that T is simpler or more unified is not evidentially relevant.

  They would attack the assignment of priors: why should we assign a higher prior to T? They would say that the prior assignment k > r*a is arbitrary and not based on evidence. Without E, there is no reason to assign a high prior to T. They might argue that without E, T is not even thought of, so the prior for T is very low.

  **Conclusion**

  The feature that does the work is the unification of multiple phenomena (the constant relative risk and the familial clustering) by a single mechanism in T, while R∧A uses two independent mechanisms. This unification leads to a higher prior for T in the hypothetical prior state (without E). Then, because the likelihoods are tied, the posterior ratio favors T.

  The case shows that the problem of old evidence is not just about likelihoods but about the structural assessment of theories when no new predictions are available. The support comes from the prior, but the prior is not arbitrary; it reflects the theoretical virtue of unification.

  Thus, the episode is one in which the scientist is not confused: the old evidence E supports T over R∧A because T provides a more unified explanation, and this is captured by the higher prior that T gets in a hypothetical state before E is known.
answer: |-
  ### Scenario
  In an epidemiological investigation of "Green Syndrome," a disease causing severe fatigue, the standing theory \(R\) attributes the disease to chronic exposure to a common industrial pollutant, "ChemX," combined with genetic susceptibility markers already identified. The well-established evidence \(E\) is a statistical regularity: across multiple large-scale studies, the incidence of Green Syndrome in regions with high ChemX levels is consistently 15 times higher than in low-exposure regions, but this relative risk remains constant across all age groups. This age-invariance is puzzling under \(R\), as cumulative exposure should increase risk with age. To resolve this, an auxiliary hypothesis \(A\) was independently introduced to explain unexplained familial clustering of cases; \(A\) posits a rare epigenetic modifier that, when present, nullifies age-related risk accumulation by altering detoxification pathways. \(A\) was motivated by genetic linkage studies unrelated to \(E\) but incidentally accommodates \(E\) by making the risk age-invariant. A new theory \(T\) is proposed, abandoning \(R\)'s framework: \(T\) posits that Green Syndrome is caused by a previously unknown virus, "Virus Theta," which lies dormant until activated by ChemX. Once activated, the virus causes disease with a fixed probability, explaining the constant relative risk. \(T\) also explains familial clustering via household transmission of the virus. \(E\) is old, certain evidence; \(T\)'s viral mechanism is novel and inexpressible in \(R\)'s toxin-genetics language. \(T\) has no confirmed novel predictions. The likelihoods are tied: \(P(E|T) \approx P(E|R \land A) \approx 1\), as both accommodate \(E\) perfectly. The connection is probabilistic: \(T\) entails that the virus causes disease probabilistically upon activation, so \(T\) cannot be deduced from \(E\).

  ### Check: Why Standard Updates Fail to Support \(T\)
  - **Conditionalization**: At \(T\)'s proposal, \(E\) is already known, so \(P_\text{new}(T) = P_\text{old}(T|E)\). But \(P_\text{old}(T|E)\) is just the prior probability of \(T\) given \(E\), which is low because \(T\) is novel and \(E\) was explained by \(R \land A\). With tied likelihoods, \(P(T|E)/P(R \land A|E) = P(T)/P(R \land A)\), so \(E\) cannot boost \(T\) over \(R \land A\) via conditionalization.
  - **Hypothetical Prior Fix (Garber-style)**: Using a prior \(P'\) where \(E\) is unknown, updating on \(E\) yields \(P'(T|E) \propto P'(T) \cdot P(E|T)\) and \(P'(R \land A|E) \propto P'(R \land A) \cdot P(E|R \land A)\). Since \(P(E|T) = P(E|R \land A)\), the posterior ratio equals the prior ratio: \(P'(T|E)/P'(R \land A|E) = P'(T)/P'(R \land A)\). But \(P'(T)\) is low—\(T\) is an untested, novel entity—while \(P'(R \land A)\) is higher because \(R\) is entrenched and \(A\) was independently motivated (by familial clustering). Thus, \(T\) gains no advantage.
  - **Glymour-style Bootstrapping**: Unavailable because \(T\)'s link to \(E\) is probabilistic (virus activation causes disease with fixed probability, not certainty). No instance of \(T\) (e.g., "Virus Theta exists") is deducible from \(T\) and \(E\) alone; the virus is inferred, not derived.

  ### Where Support Lives: Structural Prior from Unification
  The scientist prefers \(T\) over \(R \land A\) due to \(E\) because \(T\) unifies \(E\) and the familial clustering (which motivated \(A\)) into a single mechanism, whereas \(R \land A\) treats them as separate. This unification reduces complexity: \(T\) explains both phenomena with one entity (Virus Theta), while \(R \land A\) requires two independent hypotheses (\(R\) for ChemX and \(A\) for the epigenetic modifier). Unification is not about likelihood (both packages predict \(E\) equally) but about theoretical structure—specifically, minimizing auxiliary commitments. Bayesian priors can encode this via a simplicity penalty: assign lower prior probability to packages with more independent hypotheses. Define the prior over packages as \(P(\text{package}) \propto \exp(-c \cdot k)\), where \(k\) is the number of fundamental hypotheses and \(c > 0\) is a constant. \(T\) has \(k_T = 1\) (single viral cause), while \(R \land A\) has \(k_{R \land A} = 2\) (\(R\) and \(A\) are independent, as \(A\) was motivated separately). Thus:
  \[
  P'(T) \propto e^{-c}, \quad P'(R \land A) \propto e^{-2c} \quad \text{(in hypothetical prior } P').
  \]
  Since \(e^{-c} > e^{-2c}\) for \(c > 0\), \(P'(T) > P'(R \land A)\). Updating on \(E\) with tied likelihoods:
  \[
  \frac{P'(T|E)}{P'(R \land A|E)} = \frac{P'(T)}{P'(R \land A)} = e^{c} > 1.
  \]
  Thus, after updating, \(T\) is favored. The support lives in the prior's structural penalty for disunity, not in likelihoods. The scientist is not confused: citing \(E\) highlights how \(T\)'s unified structure explains \(E\) more efficiently than \(R \land A\)'s disunited approach.

  ### Diagnosis: Key Feature and Vulnerabilities
  - **Key Feature**: Unification reduces \(k\) (number of hypotheses). \(T\) has lower \(k\) than \(R \land A\), giving it a higher prior in the hypothetical update. This structural advantage is evidentially relevant because it reflects non-arbitrary theoretical virtue, not data-fitting.
  - **Removing the Feature**: 
    - **If \(T\) needs an auxiliary**: Suppose \(T\) requires auxiliary \(B\) (e.g., "ChemX activation is dose-dependent"). Then \(k_T = 2\) (virus + \(B\)), matching \(k_{R \land A} = 2\). The prior ratio becomes \(\approx 1\), eliminating \(T\)'s advantage despite unification.
    - **If \(A\) is dropped and \(R\) faces \(T\) alone**: \(R\) alone has low \(P(E|R)\) (it cannot explain age-invariance), so \(P(E|T) > P(E|R)\). \(T\) now gains support via likelihood, violating the tied-likelihood constraint.
  - **Attacks from Opponents**:
    - **Strict Conditionalizer**: Argues that real-time probabilities cannot ignore \(E\)'s oldness; \(P_\text{current}(T)\) is fixed and low. The hypothetical prior is illicit as it "forgets" \(E\), which is impossible for rational agents.
    - **Likelihoodist**: Denies unification's evidential relevance. Attacks the prior as subjective: why should \(k\) affect probability? If \(P'(T) > P'(R \land A)\), it must stem from background knowledge—but without \(E\), \(T\) is unmotivated, so \(P'(T)\) should be near zero. The simplicity prior is an unjustified "taste."

  This case settles that the problem of old evidence hinges on structural assessment when likelihoods are tied. Unification, via prior penalties for disunity, allows \(E\) to support \(T\) without new predictions or likelihood differences. The likelihoodist attack exposes a rift: if structural virtues like unification are not "evidential," old evidence cannot support novel theories in stalemates—a challenge to the epistemology of science.
