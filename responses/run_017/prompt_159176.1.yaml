answer: |-
  Here is a specification of desiderata for reasoning from archival silence in journalism, prioritised and tested against your cases. Requirements are sorted into **Non-Negotiable** (essential for defensible claims) and **Contingent** (dependent on methodological tradition).

  ### Non-Negotiable Requirements
  1.  **Mechanism-Specific Interpretation:**  
      *   **What:** Must distinguish *why* a specific absence exists (never created/destroyed/unreachable/illegible).  
      *   **Why:** Claiming "state suppression" from a gap that was actually lost in a flood is indefensible. Illegibility (e.g., "unnamed female child") requires different reasoning (about categorisation) than destruction (about power). Collapsing these is harmful; it obscures causation and misattributes agency.  
      *   **Case Compliance:** Directly addresses your "four ways missing" case.

  2.  **Archive Mechanics First:**  
      *   **What:** Must establish the *probable scope and function* of the relevant archive/record system *before* interpreting silence. What *should* be there based on its purpose, creators, and processes?  
      *   **Why:** The "watchdog that didn't bark" only works if we know the watchdog *should* have barked (i.e., if the event *should* have been recorded). Failing this leads to arguing from negative evidence where none exists.  
      *   **Case Compliance:** Core to the "discipline for inferring from absence" case. Knocks out methods ignoring institutional context.

  3.  **Born-Digital Agnosticism:**  
      *   **What:** Must function for digital systems (algorithmic filtering, auto-deletion, indexing biases, database schemas) without relying on physical artefact logic (e.g., "original order" of paper files).  
      *   **Why:** Digital absences (e.g., content not crawled, filtered by ML, structured out by form fields) are increasingly dominant. A paper-only method is obsolete for contemporary journalism.  
      *   **Case Compliance:** Addresses "silence in born-digital collections".

  4.  **Glut Compatibility:**  
      *   **What:** Must provide symmetrical tools for analysing *over*-documentation (e.g., surveillance files, institutional confinement records) and *under*-documentation.  
      *   **Why:** Reading only silence ignores how power also operates through excessive, dehumanising, or biased recording. A complete method must handle both extremes of representation.  
      *   **Case Compliance:** Addresses "over-documented subjects".

  5.  **Romanticisation Safeguard:**  
      *   **What:** Must force explicit justification for interpreting silence *as resistance* or *deliberate suppression*, ruling out default assumptions. Requires considering indifference, accident, or mundane bureaucracy as equally plausible.  
      *   **Why:** To avoid the trope of "silence as resistance" without evidence. Essential for ethical rigour and avoiding misrepresentation.  
      *   **Case Compliance:** Directly addresses "guard against romanticising".

  6.  **Repair Weighting Protocol:**  
      *   **What:** Must assess the *evidential weight and limitations* of counter-archives/oral history/etc., acknowledging they are interpretations, not direct replacements for the gap. Cannot treat them as simply "filling the silence".  
      *   **Why:** Oral history is mediated memory; counter-archives have their own biases. Using them requires stating their nature and limits as evidence, not just deploying them as solutions.  
      *   **Case Compliance:** Addresses "what counts as repair".

  ### Contingent Requirements (Traditions You Can Reject)
  7.  **Agnosticism on Archive Intent:**  
      *   **What:** Does *not* require presupposing archives *are* instruments of state/dominant power. Allows for analysing record-creation as potentially bureaucratic, accidental, or functionally neutral *in specific instances*.  
      *   **Why:** While power is often central, insisting it *must* be the primary lens for *every* gap can over-determine interpretation. You may reject this if your case suggests mundane causes. (Rejectable if you follow traditions demanding inherent power analysis).

  8.  **Ethical Obligation Specification:**  
      *   **What:** Requires explicitly defining what is owed to the subject of the silence (memorialisation? context? anonymity? challenge to the record?) based on the *nature of the gap* and *potential harm*.  
      *   **Why:** Some traditions demand this; others see it as outside methodological rigour. You can reject imposing a *specific* ethical framework (e.g., always centering resistance), but **Non-Negotiable 5** prevents harmful romanticisation *regardless*.  
      *   **Case Compliance:** Part of "what I owe the people in the gap".

  9.  **Explicit Epistemic Humility:**  
      *   **What:** Mandates stating the *limits* of what the silence can prove within the method itself.  
      *   **Why:** Strong traditions demand this upfront. Others see it as inherent in good practice. You can reject *mandating* it within the method's formal steps if your journalistic practice ensures it elsewhere (though it's strongly advised).

  ### Critical Tensions & Knockouts
  *   **Single Biggest Knockout Requirement:** **Requirement 2 (Archive Mechanics First).** Most flawed approaches fail here. They interpret the gap *without* establishing what *should* have been recorded by that system. This is the bedrock of defensible negative inference.
  *   **Core Tension Pair:** **Requirement 2 (Archive Mechanics First)** vs. **Requirement 7 (Agnosticism on Archive Intent)**.
      *   **The Conflict:** Requirement 2 demands understanding the archive's *function* (e.g., tax collection, surveillance). This inherently involves analysing the *intent* or *purpose* of the creators/institutions *to some degree*, even if only at a procedural level ("This register was designed to log property owners"). Requirement 7 seeks to avoid *presupposing* overarching intent (like "state repression"). Can you rigorously establish mechanics/probable scope *without* any inference about intent?
      *   **The Trade-Off:** You *cannot* fully satisfy both simultaneously at the theoretical extreme. In practice, the trade-off lies in **how deeply you probe intent**:
          *   **Minimalist (Leaning to Requirement 7):** Focus *only* on the *documented procedures* and *formal scope* of the record system (e.g., "Council minutes were required to record resolutions on expenditure").
          *   **Contextual (Leaning away from Requirement 7):** Acknowledge that procedures exist within power structures (e.g., "The council was dominated by landowners; procedures reflected their interests"). This edges towards intent/power analysis.
      *   **Resolution:** **Requirement 2 is non-negotiable.** Therefore, Requirement 7 (Agnosticism on Intent) is only viable *if* you interpret "Archive Mechanics" strictly procedurally, bracketing deeper sociological/political intent. This is difficult but possible (e.g., "Based on the clerk's manual, incident X *should* have generated form Y"). However, this minimalist approach may feel insufficient for analysing silences around marginalised groups. **The real trade-off is between procedural rigour (Requirement 2) and the depth of critical/power analysis applied to the archive's creation context.** You *must* do the former; how much of the latter you incorporate is contingent on your approach, but ignoring the context entirely often weakens the analysis of *why* the mechanics functioned as they did for specific groups.

  This specification provides the forensic rigour needed for defensible journalistic claims about archival silence and glut, while highlighting where your methodological choices lie.
