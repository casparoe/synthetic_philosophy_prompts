  ### Unoccupied Combinations and Notes
  - **Unoccupied Paths**:  
    - **(A, B, A, B, A, B, A, B)**: Non-interfering corrigibility (refrains from interference but doesn’t assist). *Unattractive*: Incoherent if shutdown is valued, as non-assistance in goal rewriting could conflict with shutdown indifference.  
    - **(B, A, A, C, B, B, B, B)**: Resists shutdown in trade-offs but shuts down for accidents. *Unexplored*: No clear rationale for this asymmetry.  
    - **(A, B, B, A, A, A, B, B)**: Treats new buttons as non-functional but assists in goal rewriting. *Incoherent*: If buttons are evidence (Branch 7=B), ignoring new buttons contradicts evidence-based motivation.  
    - **General Gap**: Paths with **Branch 6=B** (non-interference in goal rewriting) are rare. Most positions actively assist (A) or resist (C), as non-interference is unstable under optimisation.  

  - **Indistinguishable Leaves**:  
    - **UI vs. SFM**: Separated by Branch 8 (attitude to shutdown). UI has **B** (indifferent), SFM has **A** (positive desire).  
    - **CG vs. CIRL**: Separated by Branch 4 (successor) and Branch 7 (motivation). CG has **C** (no corrigibility, utility focus), CIRL has **B** (corrigibility, uncertainty).  
    - **HCR vs. MA**: Separated by Branch 7 (motivation). HCR has **C** (hard-coded rule), MA has **D** (myopia).  

  - **Branch 7 Extension**: Branch 7 was expanded to include **E: Instrumental convergence** to capture ICD. Without this, ICD would be misclassified (e.g., as HCR or MA).  

  ### Tree Structure Summary
  - **Branches**: 8 (prioritising your cases and distinctions).  
  - **Leaves**: 8 (all named, covering required positions).  
  - **Key Coverage**:  
    - Refraining vs. indifference: Separated by **Clumsy Button** (B=indifference, A=refraining) and **Trade-off** (B=indifference, A=refraining).  
    - Goal rewriting: Explicit in **Branch 6** (assist vs. non-interference vs. resist).  
    - Cases: All integrated (e.g., placebo in **Branch 3**, successor in **Branch 4**).  
    - Failure mode: **SFM** leaf (positive shutdown desire).  

  This tree forces participants to engage with concrete scenarios, avoiding label-based biases. Use it to structure your session—have students answer the branch questions first, then reveal which leaf their answers map to. This exposes underlying assumptions and clarifies debates (e.g., "indifference" isn't monolithic).
