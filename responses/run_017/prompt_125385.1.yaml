prompt: |-
  I chair the investment and analytics group at a regional water utility. Three or four times a year my group is handed the same question in a new costume: before we commit to an expensive and hard-to-reverse capital decision — relining or replacing a stretch of trunk main, adding a treatment stage, relocating a pumping station — should we first buy more information? A condition survey, a short pilot, a hydraulic modelling study, a year of monitoring. Each costs real money, takes months, and freezes the decision while it runs, so the delay is itself part of the price.

  My colleagues reason about this with a slogan I have come to distrust: information is never bad for you. They gesture at the value-of-information theorem usually credited to I. J. Good — roughly, that an agent who maximises expected utility and revises by conditionalisation cannot be made worse off in expectation by a costless observation, since such an agent can always disregard the observation and take whichever act had maximal expected utility beforehand. From this they conclude that any study with a non-zero chance of changing our minds is worth commissioning and that the only open question is whether it is cheap enough.

  I do not think that conclusion follows, and I want a procedure rather than a debate. Please write a decision procedure my group can run on a proposal to buy information ahead of a capital decision, in the order the questions should be asked, with what counts as an adequate answer to each, where it stops with a no, and where it hands the question to a person because it is a question of values rather than fact. Constraints: my team has a good calibrated forecaster, one member who reliably over-reads a single striking data point, an engineering director who treats a pilot as a commitment to scale it up, and a board that must sign off and sometimes ignores what we give it. Nobody on the team will do algebra under time pressure, and there are usually no base rates for the specific asset under the specific street.

  In building the procedure, please deal with at least the following, since these are the places I suspect the slogan is doing work the theorem does not license. First, what has to be true of us, as a decision-making body, for the guarantee to apply at all — in particular whether we can commit in advance to a rule linking each possible result to an action, and whether our actual revision practice is close enough to conditionalisation for the argument to go through. Second, the cases where the value is genuinely zero: results that leave the decision unchanged, but also results that can only bind us through channels that are not the decision, such as a finding that would trigger a regulatory duty or a publication obligation, where the option of simply ignoring what we learn is not available to us. Third, how to value information that is not free and that arrives late, in a form people without formal training can actually run, and what to do when the inputs cannot be estimated. Fourth, the cases where the study changes what we are choosing between or who gets to choose, and where the design of the study determines the answer it will return. Fifth, the fact that waiting is itself a way of acquiring information.

  Then run the finished procedure on three proposals. One: a condition survey of an ageing trunk main before deciding whether to reline it or replace it outright. Two: a twelve-month pilot of a new treatment process before committing to full-scale construction, where the director will read the pilot as approval. Three, and this is the one I expect to dislike: a monitoring programme that would very likely detect a contaminant we cannot prevent and would then be legally obliged to remediate at great cost, where the study changes nothing about the physical outcome. If your procedure tells us not to commission that third study, I want to know whether that is the correct answer or whether the procedure is being used to license wilful ignorance, and I want the difference between expected value of information and whatever duty to inquire we might have stated explicitly.

  Finally, say plainly what the procedure cannot do, and which steps are judgment wearing a lab coat.
reasoning: |-
  We are designing a decision procedure to evaluate whether to commission additional information before a capital decision. The procedure must be step-by-step, avoid algebra, and account for real-world constraints (behavioral biases, no base rates, etc.). We'll address the user's concerns and constraints.

  Key principles from Value of Information (VoI) theory:
  1. The expected value of information (EVI) is the expected improvement in the decision due to the information, minus the cost of acquiring it (including delay).
  2. EVI can be zero if the information never changes the decision, or if it leads to outcomes that are not actionable (e.g., due to regulatory triggers).
  3. The theorem assumes the decision maker can commit to a decision rule (mapping from information to action) and updates beliefs via conditionalization (Bayesian updating). If these do not hold, the guarantee may not apply.

  The procedure must consider:
  - The decision-making body's ability to pre-commit to a decision rule.
  - Whether updating is approximately Bayesian.
  - Cases where the information might force an action (regulatory triggers) and thus cannot be ignored.
  - The cost of delay and the cost of the study.
  - How the study might change the set of available actions or the decision maker.
  - The fact that waiting (without a formal study) also provides information.

  Procedure Outline:

  We break the procedure into a series of questions. At each step, if the answer is negative or unsatisfying, we may stop and recommend against the study. The steps are:

  1. **Define the decision without the study:** What are the alternative actions? What is the current best action without additional information?
  2. **Clarify the information's purpose:** What specific question will the study answer? How might the answer change the decision?
  3. **Check for forced outcomes:** Will any possible study result legally or regulatorily force a specific action (regardless of the decision we would have made)? If yes, then the study is not just information but a trigger, and we must evaluate the expected cost of that trigger.
  4. **Assess the potential for decision change:** Without algebra, we need a qualitative assessment: Is there a realistic chance the study will change the decision? (If not, the EVI is zero and we stop unless there are other reasons to do the study.)
  5. **Evaluate the cost of delay:** What is the cost of waiting for the study? (Include any immediate risks of delay, such as increased failure probability, regulatory penalties, or opportunity costs.)
  6. **Assess the cost and feasibility of the study:** What are the direct costs? Can we run the study without compromising safety or operations?
  7. **Check for commitment to a decision rule:** Can we pre-commit to a decision rule (e.g., "if condition is poor, replace; else reline")? If not, then the VoI theorem's guarantee may not hold because we might not act optimally on the information.
  8. **Check for updating quality:** Is our team capable of updating beliefs appropriately (without overreacting to a single point, ignoring base rates, etc.)? If not, the information might be misinterpreted.
  9. **Consider alternative ways to get information:** Is there a cheaper or faster way to get the same information? (Including waiting without a formal study.)
  10. **Estimate the value of information:** Without algebra, we can use a qualitative scale (low, medium, high) for the potential improvement in the decision and compare to the cost. We can also use a simple break-even analysis: "What minimum improvement in the decision would justify the cost?" and then assess if the study might deliver that.
  11. **Account for non-decision effects:** Could the study change the set of available actions (e.g., by revealing new options) or the decision maker (e.g., by changing who has authority)? Could the study design bias the results?
  12. **Make a recommendation:** Weigh the expected benefits (chance of a better decision times the magnitude of improvement) against the costs (direct cost, delay, and any risks). If the benefits clearly outweigh the costs, proceed. If not, reject.

  Now, let's structure the procedure as a flowchart of questions.

  ---

  **Decision Procedure: Should We Commission a Study?**

  **Step 1: Define the base decision**
     - What are the alternative capital actions (A1, A2, ...) we are considering?
     - Without additional information, what is our current best action (based on expected value)? 
     - What is the expected net present value (ENPV) of that action? (If we can't put a number, use a qualitative assessment: high, medium, low.)
     - What are the key uncertainties that drive the decision? (List 1-3 major uncertainties.)

  *If we cannot define the base decision, stop: We are not ready to consider information gathering.*

  **Step 2: Purpose of the study**
     - What specific uncertainty (from Step 1) will the study address?
     - How will the study reduce that uncertainty? (e.g., provide a point estimate, reduce variance, reveal a binary state)

  *If the study does not address a key uncertainty, stop: The study is not relevant to this decision.*

  **Step 3: Forced outcomes**
     - Are there any possible results from the study that would legally, regulatorily, or contractually force a particular action? (e.g., detecting a contaminant forces remediation)
       - If yes, then:
          - List the forced action and the conditions.
          - Estimate the probability of being forced into that action (if possible, qualitatively: low, medium, high).
          - What is the cost of that forced action? (If it's the same as what we might have chosen, then it's not forced in a bad way. But if it forces a more expensive action, note that.)
          - Compare the forced action to our current best action: Would we have taken that action anyway? If not, then the study may impose an extra cost.

  *If the study has forced outcomes that are worse than our current best action and there is a non-negligible chance of triggering them, then the study might be harmful. Proceed to Step 4 but note this risk.*

  **Step 4: Potential for decision change**
     - For each possible outcome of the study (if discrete) or for a representative set (if continuous), would the outcome change our decision from the current best action?
       - If we cannot imagine any outcome changing the decision, then the EVI is zero. *Stop: Do not commission the study.*
       - Otherwise, estimate the chance that the study changes the decision (qualitatively: low, medium, high). Also, estimate the magnitude of the improvement if we change to a better decision (qualitatively: small, medium, large).

  *If the chance of changing the decision is low and the potential improvement is small, then the EVI is low. Proceed to Step 5 but be skeptical.*

  **Step 5: Cost of delay**
     - What is the cost of delaying the capital decision by the study duration? Consider:
          - Increased risk of failure (e.g., pipe break) during the delay.
          - Opportunity cost (e.g., delayed benefits from the project).
          - Inflation or increasing costs of the capital project.
          - Regulatory penalties for delay.
     - Quantify this cost if possible, or use a qualitative assessment (low, medium, high).

  *If the cost of delay is high and the study is long, then the study might be too expensive even if it has high EVI. Proceed to Step 6.*

  **Step 6: Direct cost and feasibility of the study**
     - What is the direct cost of the study (including staff time, consultant fees, etc.)?
     - Is the study feasible? (Can we do it without causing operational issues? Do we have the expertise?)

  *If the study is too expensive or not feasible, stop. Otherwise, proceed.*

  **Step 7: Pre-commitment to a decision rule**
     - Can we write down a decision rule now? (e.g., "If the study shows condition X, we do A; if condition Y, we do B.")
     - Will we stick to that rule when the results come in? (Consider: Are there organizational biases that might cause us to deviate? For example, the engineering director's tendency to scale up a pilot regardless.)

  *If we cannot pre-commit and stick to the rule, then the VoI guarantee does not hold. We must be cautious. Note: This step might require judgment. Proceed to Step 8.*

  **Step 8: Updating quality**
     - How well does our team update beliefs in the face of new evidence?
          - Do we have a calibrated forecaster? (If yes, that's good.)
          - Do we have a member who overreacts to a single data point? (If yes, that's bad.)
     - Can we mitigate biases (e.g., by having the forecaster lead the interpretation)? 

  *If we are likely to misinterpret the study results, then the EVI might be negative. Proceed with caution.*

  **Step 9: Alternative information**
     - Is there a cheaper/faster way to get the same information? (e.g., existing data, a shorter study, expert judgment, or just waiting without a formal study)
     - If we wait without a formal study, what information might naturally arrive? (e.g., from routine operations)

  *If a better alternative exists, use that instead. Otherwise, proceed.*

  **Step 10: Value of information assessment (qualitative)**
     - Combine the assessments from previous steps:
          - Chance of decision change (Step 4): low, medium, high.
          - Magnitude of improvement if changed (Step 4): small, medium, large.
          - Cost of delay (Step 5): low, medium, high.
          - Direct cost (Step 6): low, medium, high.
          - Risks from forced outcomes (Step 3): none, low, medium, high.
          - Risks from poor updating or lack of commitment (Steps 7-8): none, low, medium, high.

     - Now, estimate the expected benefit:
          - Expected benefit ≈ (chance of change) × (magnitude of improvement) 
          - But subtract any costs from forced outcomes and account for risks of poor updating.

     - Compare expected benefit to total cost (direct cost + cost of delay). Use a scale:
          - If expected benefit >> total cost: commission the study.
          - If expected benefit ≈ total cost: judgment call (consider risk aversion).
          - If expected benefit < total cost: do not commission.

     - Alternatively, ask: What is the minimum improvement (in monetary terms) that would justify the study? Then, subjectively: Is there a reasonable chance the study will deliver that?

  *If the expected benefit does not clearly exceed the total cost, stop: Do not commission. Otherwise, proceed to Step 11 for a final check.*

  **Step 11: Non-decision effects and study design**
     - Could the study change the set of available actions? (e.g., reveal a new option we hadn't considered) If yes, that might be an additional benefit.
     - Could the study change who gets to make the decision? (e.g., by bringing in regulators) If yes, that might be a risk.
     - Is the study designed in a way that might bias the results? (e.g., a pilot that is not representative) If yes, then the information might be misleading.

  *Account for these as additional benefits or risks.*

  **Step 12: Recommendation**
     - Weigh all factors. If the study passes all the hurdles and the expected benefit outweighs the costs and risks, commission it. Otherwise, do not.

     - If the decision is close, or if there are unquantifiable risks (like reputation), escalate to a human judgment (e.g., the board).

  ---

  Now, let's run the three proposals through this procedure.

  **Proposal 1: Condition survey of an ageing trunk main before deciding to reline or replace.**

  Step 1: 
     - Actions: Reline (cheaper but less durable) or replace (more expensive but longer-lasting).
     - Current best: Without survey, we might choose based on age and past performance. Suppose we are leaning towards relining because it's cheaper and the pipe hasn't failed yet.
     - Key uncertainty: The current condition of the pipe (e.g., remaining wall thickness, corrosion).

  Step 2: The survey will assess the condition of the pipe (e.g., via CCTV or sonic testing). It will reduce uncertainty about the remaining life.

  Step 3: Forced outcomes? Possibly: if the survey reveals the pipe is in critical condition, regulations might force immediate replacement. But typically, condition surveys don't force actions unless there is an immediate safety risk. Assume no forced outcomes.

  Step 4: Potential for decision change: High. If the pipe is in good condition, we might reline. If bad, we replace. Chance of change: high. Magnitude: large (because replacing a pipe that could have been relined wastes money, and relining a pipe that fails soon is costly).

  Step 5: Cost of delay: Medium. The pipe is ageing and could fail, but hasn't yet. Delay of a few months for the survey might be acceptable.

  Step 6: Direct cost: Medium (cost of the survey). Feasible: Yes.

  Step 7: Pre-commitment: We can write a rule: "If condition score > X, reline; else replace." But will we stick to it? Maybe. The engineering director might push for replacement if the survey shows any defect. Risk: medium.

  Step 8: Updating quality: We have a calibrated forecaster, but one member overreacts. We can mitigate by having the forecaster lead. Risk: low.

  Step 9: Alternatives? We might wait for a failure, but that could be costly. No good alternatives.

  Step 10: Expected benefit: High (chance of change is high, magnitude is large). Total cost: medium (direct cost + medium delay cost). Expected benefit > total cost.

  Step 11: The study won't change the actions. Design: standard condition survey, not biased.

  Step 12: Commission the survey.

  **Proposal 2: Twelve-month pilot of a new treatment process before full-scale construction, with the engineering director tending to scale up regardless.**

  Step 1:
     - Actions: Build full-scale or not build (or perhaps build with a different technology).
     - Current best: Without pilot, we might not build because of uncertainty about effectiveness.

  Step 2: The pilot will test the effectiveness of the new process under real conditions.

  Step 3: Forced outcomes? None, unless the pilot reveals a regulatory violation. Assume not.

  Step 4: Potential for decision change: High. If the pilot is successful, we build. If not, we don't. But note: the engineering director will scale up regardless of the results. Therefore, even if the pilot fails, the director might still push to build. So the chance of changing the decision might be low (because we might build anyway). However, if the pilot fails and we can stop the build, then the chance of change is high. But if the director's bias means we build regardless, then the study will never change the decision. So we must address this.

     - We must fix the commitment issue first. If we cannot pre-commit to cancel the project if the pilot fails, then the study might be worthless.

  Step 5: Cost of delay: High. Delaying the full-scale project by 12 months might mean prolonged use of an inferior process, regulatory pressures, or increased costs.

  Step 6: Direct cost: High (running a pilot for 12 months). Feasible: Yes.

  Step 7: Pre-commitment: This is critical. Can we get the director and board to pre-commit to a rule: "If the pilot meets criteria X, we build; else, we don't."? If not, then the study might not change the decision. Without commitment, the VoI is low.

     - Given the director's bias, we must get a firm commitment from the board to follow the rule. If we can't, then stop.

  Step 8: Updating quality: The director might ignore the data. Risk: high.

  Step 9: Alternatives? Maybe a shorter pilot or lab tests. If not, then no.

  Step 10: If we can get commitment, then the expected benefit is high (because the chance of change is high and the magnitude of avoiding a failed project is large). But without commitment, the benefit is near zero. Also, the total cost (direct + delay) is high.

     - Without commitment: Expected benefit < total cost. Do not commission.

     - With commitment: Proceed.

  Step 11: The pilot might reveal new issues and thus change the set of actions (e.g., modify the design). Benefit.

  Step 12: Only commission if we get a firm pre-commitment from the board to follow the decision rule. Otherwise, do not.

  **Proposal 3: Monitoring programme that would very likely detect a contaminant we cannot prevent, triggering a legal obligation to remediate at great cost, and the study changes nothing about the physical outcome.**

  Step 1:
     - Actions: We are considering a capital decision (say, to build a remediation plant) or not. But the monitoring itself is the study. Without monitoring, we do nothing (because we don't know). With monitoring, if we detect, we must remediate.
     - Note: The physical outcome (contamination is present) is unchanged by the study. The only thing that changes is our knowledge and thus our regulatory obligation.

  Step 2: The study will monitor for a contaminant.

  Step 3: **Forced outcomes: This is key.** If the contaminant is detected, we are legally obliged to remediate at great cost. If we don't monitor, we don't know and are not obliged. So the study can force an expensive action.

     - What's the chance of detection? If the contaminant is present (which is likely?), then monitoring will detect it. The problem states: "very likely detect". So if the contaminant is present (which we suspect, but don't know for sure), we will be forced to remediate.

     - Without the study, we avoid remediation costs (because we are not obliged). But the contamination remains.

  Step 4: Potential for decision change: Without the study, we take no action. With the study, if we detect, we remediate. So the study changes the decision (from inaction to remediation). But note: the remediation is forced, not chosen because it's the best action. The change is due to the regulatory trigger.

     - However, the value of this change: Remediation is costly, but it might be the right thing to do? But the problem says: "the study changes nothing about the physical outcome". So the contamination is there whether we know or not. Without remediation, there might be health effects. But if we are not monitoring, we are not held accountable until it becomes apparent.

     - The expected benefit of the study: There is none in terms of the physical outcome (because we can't prevent the contaminant). The only benefit is avoiding future liabilities (if we remediate now, we avoid a bigger problem later) or ethical benefits. But the problem states we cannot prevent the contaminant, so remediation is the only action.

     - However, without the study, we avoid the remediation cost. With the study, we incur it if detected.

     - So the study might have negative expected value: We pay for the study and then likely pay for remediation.

  Step 5: Cost of delay: Not applicable because without the study we don't act. The study itself might take time, but the capital decision (remediation) is triggered by the study.

  Step 6: Direct cost: The cost of the monitoring programme.

  Step 7: Pre-commitment: Not relevant because the action is forced.

  Step 8: Updating quality: Not relevant because the action is forced by law.

  Step 9: Alternatives? Not monitoring is an alternative.

  Step 10: Expected benefit: 
     - If we do the study, we have a high chance of having to remediate (if the contaminant is present, which we suspect). The cost of remediation is high, and we also pay for the study.
     - Without the study, we pay nothing (but the contaminant remains, which might cause future liability if discovered by others). However, the problem does not say that there is a risk of being caught later. If there is, then we might face penalties and still have to remediate. But the user says: "the study changes nothing about the physical outcome", implying that without the study, the contaminant remains and might never be discovered? Or might be discovered later?

     - We must consider the expected cost of not knowing:
          - If the contaminant is discovered later (by a regulator or a leak), we might face higher remediation costs (because the problem got worse) and penalties.
          - If it is never discovered, we avoid the cost.

     - Without knowing the probability of future discovery and penalties, we cannot compute. But the user says there are no base rates.

     - However, the problem states: "a monitoring programme that would very likely detect a contaminant we cannot prevent". So we believe the contaminant is present. Also, the regulatory environment: if we are required to monitor, then we have a duty. But the user is proposing the study, so it might be voluntary.

     - This step is critical: The VoI framework does not account for ethical or legal duties to know. The theorem is about expected utility. If we are not legally required to monitor, then avoiding monitoring might be the expected-utility maximizing choice (if the expected cost of remediation plus study is greater than the expected cost of inaction).

     - But if we have a duty to know (because we suspect contamination and it poses a public health risk), then we might have to do it regardless of VoI.

     - Therefore, this is a values question: What is our legal and ethical duty?

  Step 11: The study might bring to light a problem we are ethically obligated to address.

  Step 12: 
     - From a pure VoI perspective: The study is likely to trigger a costly action without improving the physical outcome. It might have negative expected value. So do not commission.
     - However, we must consider:
          - Legal duty: Are we required by law to monitor? If yes, then we must.
          - Ethical duty: Even if not required, do we have a responsibility to know and act?
          - Reputational risk: If the contamination is discovered later, the damage might be severe.

     - Therefore, we split the decision:
          - If there is a legal requirement, commission.
          - If not, then from a VoI perspective, do not commission. But escalate to the board for a values-based decision: they must weigh the cost against the duty to know and protect public health.

     - The user asks: Is this wilful ignorance? In a narrow VoI sense, avoiding the study maximizes expected utility (if the cost of remediation is high and the probability of future discovery is low). But ethically, it might be wilful ignorance. The procedure flags this as a values question and escalates.

  ---

  **What the procedure cannot do:**

  1. It cannot provide precise quantitative answers when data are lacking (e.g., no base rates). We must rely on qualitative judgments.
  2. It cannot eliminate biases; it only flags them. Mitigation requires organizational discipline.
  3. It cannot resolve values questions (like the duty to know); it only escalates them.
  4. It assumes that the team can define the base decision and uncertainties. If not, the procedure stops early.
  5. It does not account for strategic considerations (e.g., how the study might influence regulators or public perception) beyond what is in Step 11.

  **Steps that are judgment in disguise:**

  - Step 4 (potential for decision change): Requires imagining scenarios and subjectively assessing probabilities and impacts.
  - Step 10 (qualitative VoI assessment): Requires weighing multiple factors without numbers.
  - Step 7 and 8 (pre-commitment and updating): Require honest assessment of organizational behavior.
  - Step 3 (forced outcomes): May require legal interpretation.

  The procedure is a structured way to think about the problem, but it relies on sound judgment at key points.
answer: |-
  Below is a decision procedure for your group to evaluate proposals for buying information ahead of capital decisions. It is designed as a step-by-step checklist, with clear stopping rules ("Stop: No") and escalation points for value judgments. The procedure addresses your constraints:
  - **No algebra**: Uses qualitative scales (low/medium/high) and simple thresholds.
  - **Behavioral biases**: Explicitly flags risks (e.g., overreaction to data, pilot-as-commitment bias).
  - **No base rates**: Relies on calibrated forecasting and scenario-based thinking.
  - **Time pressure**: Questions are binary or multiple-choice where possible.
  - **Board/roles**: Escalates values questions and includes checks for commitment.

  The procedure is grounded in value-of-information (VoI) theory but accounts for real-world limitations like non-Bayesian updating, forced actions, delay costs, and organizational dynamics. It ensures the "information is never bad" slogan is tested against the theorem's actual requirements (e.g., commitment to rules, conditionalization).

  ---

  ### **Decision Procedure: Should We Commission This Study?**
  **Instructions**:  
  - Answer each question in order. Stop early if a "No" is triggered.  
  - Use your calibrated forecaster for probability estimates.  
  - Escalate to the board for values questions (marked ⚖️).  
  - **Thresholds**:  
    - "Realistic chance" = ≥20% probability (forecaster-estimated).  
    - "High cost" = >5% of the capital decision's budget.  
    - "Long delay" = >6 months or risk-critical timing.  

  #### **Step 1: Is the study relevant to a live capital decision?**
    - **Question**: Is there a specific, pending capital decision (e.g., replace/relining) that this study directly informs?  
    - **Adequate answer**: "Yes" with a clear link to one decision. If "no," stop.  
    - **Stop: No** if no capital decision is identified.  
    - **Why?** Avoids fishing expeditions. VoI only applies when information ties to an actionable choice.

  #### **Step 2: Can we ignore the results without penalty?**
    - **Question**: Could any study result *force* us into a specific action due to regulations, contracts, or liabilities (e.g., detecting a contaminant triggers remediation)?  
    - **Adequate answer**: "No" with evidence (e.g., legal review). If "yes," quantify risk:  
      - Probability of forced action: Low/medium/high (forecaster).  
      - Cost of forced action vs. status quo: Lower/same/higher.  
    - **Stop: No** if:  
      - Probability is medium/high AND cost is higher than status quo.  
      - *Rationale*: The theorem assumes we can freely ignore information. Forced actions turn "information" into a cost trigger.  
    - **Escalate to board (⚖️)** if the forced action has ethical/public health implications (e.g., contamination).

  #### **Step 3: Will the study realistically change our decision?**
    - **Question**: Is there a ≥20% chance the study will change our preferred action?  
      - *How to assess*:  
        1. Calibrated forecaster estimates probability of each outcome.  
        2. For each outcome, ask: "Would this change our decision?" (Use pre-defined decision rules; see Step 5).  
      - *Bias check*: If your overreactive member is involved, exclude them or use forecaster-only estimates.  
    - **Adequate answer**: "Yes" with probability estimate and decision-impact scenarios.  
    - **Stop: No** if:  
      - Probability <20% OR all outcomes lead to the same action.  
      - *Rationale*: VoI = zero if information doesn’t alter decisions.  

  #### **Step 4: Can we pre-commit to a decision rule?**
    - **Question**: Can we define a rule *now* mapping study results to actions (e.g., "If survey shows corrosion >X%, replace; else reline")?  
    - **Adequate answer**: "Yes" with a written rule. If "no," explain why.  
    - **Stop: No** if:  
      - We cannot define a rule OR the engineering director cannot commit to following it (e.g., pilot always leads to scale-up).  
      - *Rationale*: VoI theorem requires commitment to rules. Without it, we may misuse information.  

  #### **Step 5: Can we update beliefs rationally?**
    - **Question**: Is our belief-updating process close to Bayesian?  
      - *Assess using*:  
        - Past examples where forecasts matched outcomes.  
        - Mitigation plans for biases (e.g., overreactive member excluded from interpretation).  
    - **Adequate answer**: "Yes" with mitigation plan. If "no," describe risks.  
    - **Escalate to board (⚖️)** if risk is high (e.g., director ignores data). Proceed with caution if mitigated.  
    - *Rationale*: VoI assumes conditionalization. Non-Bayesian updating erodes value.  

  #### **Step 6: Is the study worth the cost and delay?**
    - **Question**: Is the expected value of information (EVI) > total cost?  
      - *EVI estimate*:  
        - Benefit = (Probability of change) × (Value of better decision).  
          - Value of better decision: Avoided cost of wrong choice (e.g., relining a pipe that fails in 1 year vs. 10 years).  
        - Total cost = Study cost + Delay cost.  
          - Delay cost: Increased failure risk, inflation, or opportunity cost during study.  
      - *How to avoid algebra*: Use qualitative scales:  
        - Benefit: Low (<$100K), Medium ($100K–$1M), High (>$1M).  
        - Total cost: Low/Medium/High (relative to capital decision budget).  
    - **Adequate answer**: "Benefit > Cost" with scales. If uncertain, use forecaster’s break-even estimate (e.g., "We need ≥$500K benefit to justify").  
    - **Stop: No** if:  
      - Benefit ≤ Cost OR inputs cannot be estimated (e.g., no base rates for asset failure).  
    - **Escalate to board (⚖️)** if non-monetary values (e.g., reputational risk) dominate.  

  #### **Step 7: Does the study change the decision context?**
    - **Question**: Could the study:  
      - Alter available actions (e.g., reveal new options)?  
      - Change who decides (e.g., regulators get involved)?  
      - Be biased by design (e.g., pilot too small to scale)?  
    - **Adequate answer**: "No" with reasoning. If "yes," reassess Steps 3–6 with new context.  
    - **Stop: No** if redesign is impossible (e.g., pilot is non-representative).  
    - *Rationale*: VoI assumes a fixed decision frame. Context shifts create hidden costs.  

  #### **Step 8: Is waiting a better alternative?**
    - **Question**: Can we get similar information faster/cheaper by waiting without the study (e.g., monitoring natural failures)?  
    - **Adequate answer**: "No" with comparison (e.g., "Waiting risks pipe rupture").  
    - **Stop: No** if waiting is feasible and lower risk.  
    - *Rationale*: Waiting is passive information gathering; it may dominate costly studies.  

  #### **Step 9: Final recommendation**
    - **If all steps passed**: Commission the study.  
    - **If stopped at any step**: Do not commission.  
    - **Board sign-off**: Required if:  
      - Escalated for values (⚖️).  
      - Benefit/cost is borderline.  
      - Board has ignored past recommendations.  

  ---

  ### **Application to Your Three Proposals**
  **Key for all cases**:  
  - Calibrated forecaster used for probabilities.  
  - Bias mitigations: Overreactive member excluded from interpretation; engineering director’s commitment documented in writing.  
  - Assumed no base rates (rely on forecaster scenarios).  

  #### **Proposal 1: Condition survey for trunk main (relining vs. replacement)**
    - **Step 1**: Relevant? **Yes** (decision: reline or replace).  
    - **Step 2**: Ignorable? **Yes** (no regulations force action; results are advisory).  
    - **Step 3**: Change decision? **Yes** (≥20% chance: Forecaster estimates 40% chance survey shows severe corrosion, triggering replacement).  
    - **Step 4**: Pre-commit? **Yes** (Rule: "Corrosion >5mm → replace; else reline"). Director signs commitment.  
    - **Step 5**: Rational updating? **Yes** (Forecaster leads interpretation; overreactive member excluded).  
    - **Step 6**: Worth cost? **Yes** (Benefit: High [$2M avoided failure cost]. Cost: Medium [$200K study + $50K delay]. EVI > Cost).  
    - **Step 7**: Context stable? **Yes** (No expected changes).  
    - **Step 8**: Better to wait? **No** (Waiting risks pipe failure).  
    - **Recommendation**: **Commission the survey**.  

  #### **Proposal 2: Twelve-month pilot for treatment process (full-scale or not)**
    - **Step 1**: Relevant? **Yes** (decision: build full-scale or not).  
    - **Step 2**: Ignorable? **Yes** (no regulatory triggers).  
    - **Step 3**: Change decision? **Unclear** (Forecaster: 60% chance pilot succeeds → build. But director treats pilot as commitment).  
    - **Step 4**: Pre-commit? **No** (Director refuses to commit; insists pilot success = build).  
      - **Stop: No** (VoI theorem fails without commitment).  
    - **Even if Step 4 passed**:  
      - Step 6: Worth cost? **No** (Benefit: Low [if build anyway, EVI=0]. Cost: High [$1M pilot + $500K delay]).  
    - **Recommendation**: **Do not commission**. Escalate to board: Director’s bias undermines VoI.  

  #### **Proposal 3: Monitoring for unpreventable contaminant (remediate or not)**
    - **Step 1**: Relevant? **Yes** (decision: remediate or not).  
    - **Step 2**: Ignorable? **No** (Detection forces remediation at high cost).  
      - Probability of forced action: **High** (forecaster: 90% chance detect contaminant).  
      - Cost: **Higher** than status quo (remediation cost = $10M; status quo = $0).  
      - **Stop: No** (Forced action makes study net harmful: expected cost = $9M study + remediation - $0 status quo).  
    - **Escalate to board (⚖️)**:  
      - VoI conclusion: **Do not commission** (expected value = -$9M).  
      - Values question: Is there a **duty to inquire**?  
        - VoI vs. Duty: VoI is about expected utility; duty is ethical/legal (e.g., public health responsibility).  
        - Willful ignorance? **Yes, but justified by VoI**:  
          - Physical outcome unchanged (contaminant remains either way).  
          - Study only adds cost via liability.  
          - VoI correctly identifies this as "bad information" due to forced action.  
        - Board must decide: Accept VoI recommendation or override based on duty.  
    - **Recommendation**: **Do not commission**, but board must rule on duty.  

  ---

  ### **What the Procedure Cannot Do**
  1. **Eliminate biases**: Only flags them (e.g., Step 4/5). Mitigation requires organizational discipline.  
  2. **Create data from nothing**: With no base rates, relies on calibrated forecasting (subjective).  
  3. **Resolve values conflicts**: Escalates to board but cannot decide ethical dilemmas (e.g., Proposal 3).  
  4. **Predict external changes**: Assumes a static decision context (Step 7).  
  5. **Guarantee board compliance**: Cannot force the board to heed recommendations.  

  ### **Steps That Are Judgment in a Lab Coat**  
  - **Step 3 (Probability of change)**: Relies on forecaster’s subjective scenarios.  
  - **Step 6 (EVI estimate)**: Benefit/cost is qualitative; break-even requires judgment.  
  - **Step 5 (Bayesian updating)**: "Closeness" to conditionalization is not testable; based on past behavior.  
  - **All escalations (⚖️)**: Values are inherently judgment-based.  

  This procedure ensures VoI is applied rigorously—avoiding the slogan’s pitfalls—while respecting your team’s constraints. For Proposal 3, it correctly separates VoI (which says "don’t study") from duty (which the board must weigh). Use it to frame debates as structured, step-wise checks rather than philosophical disputes.
