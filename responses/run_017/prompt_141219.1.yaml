prompt: |-
  i co-write a dramatized history podcast — real people, real events, invented dialogue — and we ship every two weeks, so these calls come up constantly and there's never more than a day or two for one, sometimes it's a rewrite at midnight in the edit. legal reads our scripts but they only care about living people and music clearance; once somebody's dead nobody's watching at all. it's got personal recently: my great-aunt ran a home for unmarried mothers in Cork in the 1950s, she left basically nothing behind — no diary, no letters, two signatures on documents — and I'm the one pushing to build a season around her while two cousins think it's a betrayal. so I need something I can read out loud to them, not just my gut.

  what I want is a decision procedure, not an essay. the question in the room is always some version of "can we put this in her mouth" or "can we show this happening", and I want ordered questions, what counts as a good enough answer to each, where the procedure just stops with a no, and where it hands off to a person because the question is values rather than facts. ground it in whatever philosophy actually knows about what we owe people who are dead and can't be harmed in the ordinary sense — but no bibliographies, and don't build it on the law, the law is silent here.

  it has to handle scenes where the record is documented, silent, contested, or known to be otherwise, and it has to handle the four devices we definately lean on: compressed chronology, composite minor characters, "borrowed lines" (giving her a real line somebody else actually said, because it's better), and "silent scenes" (she's in the room, the record says nothing, we write what we think happened). we already tag every scene in the script with a certainty level 1–4; tell me whether that tag is doing any real work or just making us feel better.

  distinctions I don't want it to collapse: wronging her versus misrepresenting her; what's owed to her versus to my cousins versus to listeners who'll take the season as history; getting her actions wrong versus getting her character wrong; "could have happened" versus "probably happened" versus "what she'd want said". and I want it to be able to say: don't dramatize this one at all.

  it has to be runnable by a writers' assistant in under an hour, with no theory jargon in the checklist itself (a glossary is fine), and it should say which answers need my sign-off and which need the family's.

  then run it on three: the finale where we give her a speech assembled out of someone else's testimony; the scene of her signing a document we know she signed but not why, with invented voiceover of her thinking; and the cold open of our first season, allready aired and publicly defended by me, that I'm now worried was indefensible. I'd rather be told that last one's wrong than right. and tell me where the procedure will misfire.
reasoning: |-
  We are creating a decision procedure for determining whether and how to depict historical figures (specifically deceased ones) in a dramatized podcast. The procedure must be:
  - Practical: Can be run by a writers' assistant in under an hour.
  - Grounded in philosophical reasoning about what we owe the dead (without legal basis).
  - Structured as a checklist of ordered questions, with clear stopping points (e.g., "no" at any point stops the procedure) and handoffs for value judgments.
  - Handles different types of scenes: documented, silent, contested, or known to be otherwise.
  - Accounts for the four devices: compressed chronology, composite characters, borrowed lines, and silent scenes.
  - Works with the existing certainty level tags (1-4) but evaluates if they are useful.
  - Distinguishes between: wronging her vs misrepresenting her; what's owed to her, to the cousins, to listeners; getting actions wrong vs character wrong; "could have happened" vs "probably happened" vs "what she'd want said".
  - Can recommend not dramatizing a scene.

  The procedure is divided into two main parts:
  1. **Character Depiction Assessment**: Focused on the portrayal of the person (e.g., her character, motivations, private moments).
  2. **Event Depiction Assessment**: Focused on the events and actions (e.g., what happened, who did what).

  Each part is a series of questions. The procedure must be run for every scene that involves the deceased person (or a composite that represents her). We start with the Character Depiction Assessment because getting the character wrong is more fundamental than getting an event wrong.

  We assume that the dead cannot be harmed in the ordinary sense (e.g., physically, emotionally), but we can wrong them by misrepresenting who they were, violating their dignity, or betraying their trust. We also consider duties to the living: family (cousins) and audience.

  **Philosophical Grounding**:
  - We owe the dead respect for their memory and dignity. This is based on the idea of "posthumous moral interests" (e.g., from philosophers like Joel Feinberg) and the duty to not undermine the trust of the living in how we treat the dead.
  - Misrepresentation that distorts the core character or essential virtues/vices of a person is a wrong to the person (even if dead) and to the living who remember them.
  - We have a duty to the audience to not mislead them about history, but also to acknowledge the limitations of historical reconstruction.
  - We have a duty to the family to respect their emotional ties and their view of their ancestor, but this is not absolute (especially if the family view is contradicted by evidence).

  **Structure of the Decision Procedure**:

  ### Pre-Check: Is this scene about the deceased person? (If not, skip the rest for this scene, but note that composite characters might be covered if they are stand-ins for real people.)
  If yes, proceed.

  ### Step 0: Scene Type and Certainty Tag
  - Identify the scene type: Documented, Silent (no record), Contested, Known to be Otherwise (e.g., we know it didn't happen as we are depicting).
  - Note the current certainty tag (1-4). We will evaluate if this tag is sufficient.

  ### Part 1: Character Depiction Assessment
  1. **Core Character Consistency**: 
     - *Question*: Does the depiction in this scene contradict well-established, non-contested aspects of her character (e.g., kindness, integrity, known beliefs) as evidenced by reliable sources?
     - *Check*: Reliable sources include multiple independent accounts, official documents, etc. If the scene attributes to her a trait or motivation that is directly contradicted by such evidence, then it's a misrepresentation.
     - *If yes (contradicts)*: Stop. Do not depict this way. Consider rewriting or cutting the scene. [Sign-off: Not needed. This is a hard stop.]
     - *If no or uncertain*: Proceed.

  2. **Basis for Character Attribution**:
     - *Question*: For any inferred motivation, emotion, or character trait in this scene, what is the basis? (Options: directly documented, reasonable inference from documented actions, pure speculation.)
     - *Check*: If pure speculation and it touches on a core aspect of her character (e.g., her courage, honesty) then it is high risk.
     - *If pure speculation on a core aspect*: Stop. Rewrite to remove the speculation or reframe the scene so it is not about her character. [Sign-off: Required by you (the writer) if proceeding anyway, because this is a values call about what is essential to her dignity.]
     - *If reasonable inference or documented*: Proceed.

  3. **Dignity and Respect**:
     - *Question*: Does the scene depict her in a way that would be undignified, humiliating, or degrading (based on the standards of her time or ours) without a compelling historical reason (e.g., if it is documented that she acted in such a way)?
     - *Check*: If it is documented, then it is acceptable (but see Step 5 about audience). If not, and it is invented, then it risks wronging her memory.
     - *If yes (undignified and not documented)*: Stop. Do not include. [Sign-off: Not needed. Hard stop.]
     - *If no*: Proceed.

  ### Part 2: Event Depiction Assessment
  4. **Event Facticity**:
     - *Question*: Does the scene depict an event that is known to have happened (or not happened) in a way that directly contradicts reliable evidence?
     - *Check*: For example, if the record shows she was not present, but we put her there in a "silent scene", that's a problem. Or if the event is contested but we present one side as fact.
     - *If contradicts reliable evidence*: Stop. Do not depict. [Sign-off: Not needed. Hard stop.]
     - *If not*: Proceed.

  5. **Narrative Devices Check** (for each device used in the scene):
     - **Compressed Chronology**: 
          - *Question*: Does the compression distort cause-effect relationships or her role in events?
          - *If yes*: Rewrite to avoid distortion. [Sign-off: Your sign-off required if minor distortion is necessary for narrative flow.]
          - *If no*: Okay.
     - **Composite Characters**:
          - *Question*: Does the composite character attributed to her actions or words that were actually done by someone else? (This overlaps with "borrowed lines" but for actions.)
          - *If yes and the action is significant to her historical role*: Rewrite. [Sign-off: Your sign-off required if the action is minor and the composite is necessary.]
          - *If no*: Okay.
     - **Borrowed Lines**:
          - *Question*: Is the line borrowed from someone else and put in her mouth? If so:
              - a. Is the line trivial (e.g., "pass the salt") or significant (e.g., expressing a core belief)?
              - b. Could she plausibly have said it (based on her known views)?
          - *If significant and not plausible*: Do not use. [Sign-off: Your sign-off required if it is plausible but not documented.]
          - *If trivial*: Okay.
     - **Silent Scenes** (invented actions/dialogue in a documented setting):
          - *Question*: Does the invented content contradict any known facts? (Already covered in Step 4.) 
          - *Question*: Does it attribute to her actions or words that are out of character? (Covered in Step 1 and 2.)
          - *If no contradiction and in character*: Okay.

  6. **Audience Misleading Potential**:
     - *Question*: Is the scene presented in a way that might lead a reasonable listener to believe something false about her or the event?
     - *Check*: Consider the narrative framing, the certainty tag, and the overall context. The certainty tag (1-4) is only doing real work if the audience is made aware of the uncertainty (e.g., in an author's note). Otherwise, it's just internal.
     - *If yes and not mitigated*: Rewrite to add context or reduce certainty. [Sign-off: Your sign-off required if the risk is low and the narrative gain is high.]

  7. **Family Sensitivities**:
     - *Question*: Is there a family-held belief or tradition about her that the scene contradicts?
     - *Check*: This is about the living (cousins). If the scene contradicts a family belief that is not supported by evidence but is deeply held, we must weigh the duty to history against family harmony.
     - *If yes and the family belief is plausible (even if not documented)*: Handoff. Requires family sign-off (cousins). If they refuse, cut or rewrite the scene. [Sign-off: Family required.]
     - *If no or the family belief is contradicted by evidence*: Proceed. (But note: if contradicted by evidence, we have a duty to history. Family sign-off may still be sought for harmony, but it's not a hard stop.)

  ### Part 3: Overall Scene Assessment
  8. **Necessity and Alternatives**:
     - *Question*: Is this scene necessary for the narrative? Can the point be made without dramatization (e.g., narration)?
     - *If not necessary*: Consider cutting.
     - *If necessary and passed all checks*: Okay to include.
     - *If necessary but failed a check and was rewritten*: Re-run the procedure.

  9. **Final Check for "Do Not Dramatize"**:
     - *Question*: After the above, is there still a high risk of wronging her, misrepresenting history, or causing undue harm to the family?
     - *If yes*: Do not dramatize. Use narration instead.
     - *If no*: Proceed.

  ### Glossary of Terms
  - **Core character**: The essential virtues, vices, or beliefs that defined her, as best we know from reliable evidence.
  - **Reasonable inference**: An inference that a historian would make based on the evidence (e.g., if she ran a home for unmarried mothers, she likely cared about their welfare).
  - **Reliable evidence**: Multiple independent sources, official documents, or a consensus among historians.
  - **Plausible**: Consistent with what we know of her character and the context.

  ### Evaluation of Certainty Tags
  The certainty tags (1-4) are only doing real work if:
  - They are used consistently and transparently (e.g., level 1: documented; level 2: strong inference; level 3: speculative; level 4: invented for narrative).
  - The audience is informed about what the levels mean (e.g., in an episode 0 or on the website).
  Otherwise, they are just an internal tool and may not absolve ethical concerns.

  ### Applying the Procedure to the Three Examples

  **Example 1: Finale - Speech assembled from someone else's testimony**
  - **Step 0**: Scene type: Borrowed lines (for a speech). Certainty tag: likely 3 (inferred).
  - **Part 1**:
    - Step 1: Does it contradict her core character? (Check: if the borrowed testimony aligns with her known views, then no. If not, stop.) Proceed if aligned.
    - Step 2: Basis for attribution? Pure borrowing. If the speech is about core beliefs, it's high risk. [Sign-off required by you if plausible but not documented.]
    - Step 3: Dignity? Unlikely an issue.
  - **Part 2**:
    - Step 4: Not an event, but the speech itself. If the words are from someone else, it's a borrowed line.
    - Step 5 (Borrowed Lines): If the speech expresses core beliefs and it's not documented that she held them exactly, then it's significant. Requires your sign-off.
    - Step 6: Audience might think she said these exact words. Mitigation: Narrator could say the speech is "inspired by" others' accounts. If not, high risk of misleading.
    - Step 7: Family sensitivities? If the cousins believe she wouldn't say that, then family sign-off required.
  - **Verdict**: Without sign-offs (yours and family) and mitigation, it fails. Otherwise, proceed with caution.

  **Example 2: Signing a document with invented voiceover of her thoughts**
  - **Step 0**: Silent scene (thoughts). Certainty tag: 4 (invented).
  - **Part 1**:
    - Step 1: If the thoughts contradict her known motivations, stop.
    - Step 2: Basis? Pure speculation. If the thoughts are about why she signed (a significant act), it's a core aspect. [Sign-off by you required.]
    - Step 3: Dignity? Only if thoughts are degrading.
  - **Part 2**:
    - Step 4: She did sign, so the event is real. The thoughts are invented.
    - Step 5 (Silent Scenes): The thoughts are invented. If they are trivial (e.g., "I'm tired"), okay. If they are about her motivations for signing, then it's high risk and requires your sign-off.
    - Step 6: Audience may take the thoughts as fact. Mitigation: Use the certainty tag and/or narration to clarify.
    - Step 7: Family might have their own view of why she signed. If the invented thoughts contradict that, require family sign-off.
  - **Verdict**: High risk without sign-offs and mitigation. Consider cutting the voiceover or making it very generic.

  **Example 3: Cold open from first season (already aired)**
  We'll assume it's a scene that used one or more devices and now you worry it was indefensible. Let's say it was a silent scene showing her being harsh to an unmarried mother (invented, to create drama).
  - **Step 0**: Silent scene, invented. Certainty tag: probably 4.
  - **Part 1**:
    - Step 1: If she was known for kindness, this contradicts core character -> Hard stop (should not have been depicted).
    - Step 2: Basis? Pure speculation -> Stop (should have required your sign-off, but it wasn't run).
    - Step 3: Undignified and not documented -> Hard stop.
  - **Verdict**: The procedure would have stopped this scene. It was indefensible.

  ### Where the Procedure Misfires
  - **Overly cautious**: It might stop scenes that are harmless but speculative. This is by design to protect against harm.
  - **Family veto**: If the family is overly sensitive, it might block legitimate historical interpretation. Mitigation: Only require family sign-off when the scene contradicts a deeply held family belief and the evidence is weak.
  - **Complexity**: Some steps require judgment (e.g., what is "core character"?). The writers' assistant might need training.
  - **Time**: Running it on every scene might take longer than an hour for a whole episode. Focus on high-risk scenes first.

  ### Final Output Format for the Writers' Assistant
  We'll create a checklist form that the assistant can fill out per scene. The form includes:
  - Scene number and description.
  - Answers to the ordered questions.
  - Sign-off requirements.
  - Final decision: Proceed, Rewrite, Cut, or Do Not Dramatize.

  Let me know if you need the actual form laid out.
answer: |-
  Below is a **decision procedure** for your podcast's dramatizations of deceased historical figures, grounded in philosophical ethics (not law). It prioritizes what we owe the dead: respect for their *moral dignity*, *truth of character*, and *legacy*, per thinkers like Thomas Aquinas (dignity of the person as inherent), John Locke (truth as a duty to society), and contemporary ethics (e.g., Joel Feinberg on posthumous interests). The dead can't be harmed, but they can be *wronged* by misrepresentation that distorts their essence or betrays societal trust.  

  The procedure is:  
  - **Runnable in 30-45 mins** by a writers' assistant.  
  - **Ordered questions** with hard stops ("NO"), handoffs for values-based decisions ("HANDOFF"), and glossary terms (plain language).  
  - **Inputs per scene**: Historical basis (documented/silent/contested/otherwise), devices used (compression/composites/borrowed lines/silent scenes), certainty tag (1–4), and stakeholders (her/cousins/listeners).  
  - **Outputs**: "Yes," "Rewrite [specific]," "Cut," or "Do Not Dramatize (Narrate Instead)." Sign-off requirements are flagged.  

  **Key Distinctions Upfront**:  
  - **Wronging her** = Undermining her moral dignity (e.g., inventing shameful acts she wouldn’t commit).  
  - **Misrepresenting her** = Distorting her core character (e.g., painting a compassionate person as cruel).  
  - **Owed to her** = Truth of character, dignity. **Owed to cousins** = Respect for their emotional inheritance. **Owed to listeners** = Transparency about invention.  
  - **Actions vs. character** = Getting facts wrong (e.g., date of an event) vs. getting her essence wrong (e.g., her motives).  
  - **"Could have" vs. "probably" vs. "wanted"** = Plausibility vs. evidence vs. her likely wishes (inferred from values).  
  - **Certainty tags (1–4)** are only useful if they force transparency (e.g., stating uncertainty in narration). Otherwise, they’re self-soothing. Reject them if they obscure ethical risks.  

  ---

  ### DECISION PROCEDURE: "CAN WE PUT THIS IN HER MOUTH/SHOW THIS?"  
  *Run this for every scene involving the deceased person. Stop at any "NO."*  

  #### STEP 1: **WILL THIS UNDERMINE HER CORE CHARACTER?** (Focus: Misrepresentation)  
     - **Question 1.1:** Are we attributing words/actions to her that directly contradict *non-contested, well-sourced traits*? (e.g., she was verifiably patient, but we show her snapping viciously).  
       - *If YES → NO. Cut or rewrite. Hard stop. Wrongs her.*  
       - *If NO or UNKNOWN → Go to 1.2.*  
     - **Question 1.2:** For invented elements (borrowed lines/silent scenes): Do they align with her *plausible motives or values*, based on reliable evidence? (e.g., borrowing a line about compassion if she ran a home for mothers).  
       - *If NO → HANDOFF to you (writer). Values call: Is this essential to the story? If yes, rewrite to reduce distortion.*  
       - *If YES → Go to Step 2.*  
     - *Glossary: "Well-sourced traits" = Multiple records (e.g., letters, testimonials). "Plausible motives" = Logical inference from actions (e.g., running a home implies care, not shame).*  

  #### STEP 2: **COULD THIS WRONG HER DIGNITY?** (Focus: Harm to legacy)  
     - **Question 2.1:** Are we inventing or emphasizing something that would *dishonor her* (e.g., cowardice, cruelty, incompetence) without evidence?  
       - *If YES → NO. Cut. Hard stop. Wrongs her.*  
       - *If NO → Go to 2.2.*  
     - **Question 2.2:** Are we exposing a *private moment* (e.g., thoughts during document signing) that invents vulnerability (e.g., shame, doubt) she likely guarded?  
       - *If YES → HANDOFF to you (writer). Values call: Is this necessary? If yes, add narrative framing (e.g., "We imagine she might have felt...").*  
       - *If NO → Go to Step 3.*  
     - *Glossary: "Dishonor" = Violating her era's or today's reasonable standards of respect. "Private moment" = Unrecorded thoughts/feelings.*  

  #### STEP 3: **IS THE HISTORICAL BASIS DEFENSIBLE?** (Focus: Truth to listeners)  
     - **Question 3.1:** For contested/otherwise-known events: Are we presenting invention as *fact* (e.g., "She said X" when no record exists)?  
       - *If YES → Rewrite. Add qualifiers ("perhaps," "maybe"). Hard stop if uncorrected. Misleads listeners.*  
       - *If NO → Go to 3.2.*  
     - **Question 3.2:** For devices:  
       - *Compression*: Does it distort her *role* (e.g., making her sole decision-maker in a group effort)? → *If YES → Rewrite timeline. Handoff to you if minor.*  
       - *Composites*: Does it attach *real negative actions* to her (e.g., blaming her for another's mistake)? → *If YES → NO. Cut. Wrongs her.*  
       - *Borrowed lines*: Is the line *trivial* (e.g., "Pass the tea") or *significant* (e.g., a moral declaration)? → *If SIGNIFICANT → HANDOFF to you. Values call: Does it serve her truth?*  
       - *Silent scenes*: Is the invention *neutral* (e.g., walking downstairs) or *charged* (e.g., arguing)? → *If CHARGED → Go to Step 4.*  
     - *Certainty tags*: Only useful if they trigger Step 3.1 rewrites or narration (e.g., "Level 3: We inferred this"). Otherwise, junk them.  

  #### STEP 4: **WHAT DO WE OWE THE LIVING?** (Focus: Cousins and listeners)  
     - **Question 4.1:** Could this *reasonably offend cousins* by distorting her (e.g., implying she profited from the home) or violating family lore?  
       - *If YES → HANDOFF to cousins. Their veto applies if no evidence overrides their view.*  
       - *If NO → Go to 4.2.*  
     - **Question 4.2:** Would listeners *walk away believing fiction as fact* without clarification? (e.g., invented speech presented as verbatim).  
       - *If YES → Rewrite. Add narration (e.g., "This combines testimonies from others"). Handoff to you.*  
       - *If NO → Go to Step 5.*  

  #### STEP 5: **FINAL CALL: DRAMATIZE OR NARRATE?**  
     - **Question 5.1:** After Steps 1–4, does the scene still risk *twisting her identity* or *exploiting her* for drama?  
       - *If YES → Do Not Dramatize. Use narration only (e.g., "She signed the document—we may never know why").*  
       - *If NO → Yes. Include with approved devices.*  
     - **Question 5.2:** Is this the *only way* to tell an essential truth? If not, default to narration.  

  ---

  ### APPLYING THE PROCEDURE: YOUR THREE SCENES  
  *Assumed context: Great-aunt ran a home for unmarried mothers. No personal records. Cousins fear betrayal.*  

  1. **Finale: Speech from borrowed testimony**  
     - **Step 1.1:** Speech is about compassion (aligned with running the home). *NO contradiction → Proceed.*  
     - **Step 1.2:** Borrowed line is significant (moral declaration). *HANDOFF to you: Does it serve her truth? If yes, okay.*  
     - **Step 3.2 (Borrowed lines):** Significant → *HANDOFF to you.*  
     - **Step 4.1:** Cousins might object if she’s “speaking” others’ words. *HANDOFF to cousins.*  
     - **Step 4.2:** Listeners might think she said this. *Rewrite: Add framing.*  
     - **Step 5.1:** Risk of misrepresenting her voice? *Minimal if framed → Yes, dramatize.*  
     - **Verdict:** **Rewrite** with narration (e.g., "Words from similar caregivers"). Requires **your + cousins’ sign-off**.  

  2. **Document signing with invented thoughts**  
     - **Step 1.1:** No contradiction if thoughts align (e.g., determination). *Proceed.*  
     - **Step 2.2:** Private moment (thoughts). *HANDOFF to you: Is inventing doubt/shame necessary? If yes, add framing.*  
     - **Step 3.2 (Silent scenes):** Charged (internal conflict). *Go to Step 4.*  
     - **Step 4.1:** Cousins might object to invented vulnerability. *HANDOFF to cousins.*  
     - **Step 5.1:** High risk of putting words in her head. *Do Not Dramatize. Narrate instead.*  
     - **Verdict:** **Do Not Dramatize.** Too invasive. Sign-off not applicable—rewrite as narration.  

  3. **Cold open (already aired):** *Assume it showed her pressuring a mother to give up a baby, based on speculation.*  
     - **Step 1.1:** If pressure contradicts her compassion → *NO. Cut. Hard stop.* (You say: *"Indefensible"*)  
     - **Step 2.1:** Invents cruelty → *NO. Cut.*  
     - **Step 4.1:** Likely offends cousins → *HANDOFF ignored (but should have been done).*  
     - **Verdict:** **Procedure stops at Step 1.1.** Unethical. Wrongs her + misleads listeners.  

  ---

  ### WHERE THE PROCEDURE MISFIRES  
  - **Overcaution**: May reject high-impact scenes (e.g., silent thoughts) that could humanize her. *Mitigation: HANDOFF to you for narrative value.*  
  - **Cousins’ veto**: Could block valid interpretations if family lore is idealized. *Mitigation: Step 4.1 requires evidence to override cousins only if their view is plausible.*  
  - **"Plausible" bias**: Writers may overestimate inferential leaps (e.g., "She must have been weary"). *Mitigation: Step 1.2 demands evidence alignment.*  
  - **Time crunch**: Assessing every silent scene may bottleneck edits. *Mitigation: Prioritize charged scenes (use Step 5.1).*  

  This creates an ethical "speed bump"—not a barrier. When in doubt, **narrate, don’t dramatize**. Use it to show cousins you’re weighing her dignity, not just your gut.
