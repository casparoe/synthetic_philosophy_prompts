  Here’s a sequenced interview strategy designed to pressure M’s thesis at its weakest points, anticipate her reclassifications, and force her to either refine her view or concede explanatory gaps. Each question includes a likely reply and a sharp follow-up:

  ### **Interview Sequence**
  1. **Opening Gambit (Speech Act Misfire)**  
     *Question:* "If blame is fundamentally a *moral demand*—a speech act that presupposes the blamer’s own commitment to the norm they’re invoking—couldn’t hypocrisy *structurally* void that act? Like a thief demanding honesty: the words might be ‘correct,’ but doesn’t the act itself collapse?"  
     *Likely Reply:* "That conflates standing with sincerity. The thief still *has* authority to invoke honesty; his insincerity makes his act ugly, not invalid."  
     → **Follow-Up:** "But if the blamer’s *own actions* openly flout the norm they’re enforcing, doesn’t that transform blame into a different kind of act—say, *coercion* or *bad faith theater*—rather than a genuine moral address? If the ‘demand’ loses its normative force, how is this merely about etiquette?"

  2. **Practice vs. Theory (The "You’re One to Talk" Intuition)**  
     *Question:* "In everyday life, ‘you’re one to talk’ functions as a *blocking move*—it shifts the burden back to the blamer. If standing is purely about authority (as you claim), why would ordinary people treat hypocrisy as *disqualifying* rather than just *rude*?"  
     *Likely Reply:* "That reaction tracks unfairness or unreliability, not standing. It’s about the *virtue* of the blamer, not their authority."  
     → **Follow-Up:** "But when we say a corrupt cop ‘has no right’ to arrest someone, or an exploitative employer ‘can’t demand’ punctuality, we’re *not* just calling them unfair. We’re saying their *role-based authority* is compromised. Isn’t hypocrisy doing the same moral work here?"

  3. **Self-Blame as a Neutralizer?**  
     *Question:* "Take a hypocrite who preempts criticism: ‘I do this terrible thing too—and I *shouldn’t*, and neither should you.’ If her self-blame is sincere, does this restore her standing? Or is there still a defect?"  
     *Likely Reply:* "It neutralizes the epistemic worry! She’s admitting her unreliability but affirming the norm."  
     → **Follow-Up:* "But if she *keeps* violating the norm while blaming others, isn’t her self-reproach just performance? Does standing require *behavioral consistency*, or is introspective avowal truly sufficient?"

  4. **Institutional Hypocrisy (The Fossil-Fuel University)**  
     *Question:* "When a university condemns fossil-fuel lobbying while profiting from it, the ‘you’re one to talk’ response feels *stronger* than in personal cases. But institutions aren’t ‘sincere’—so how can your model explain this? Is this still just ‘unfairness’?"  
     *Likely Reply:* "Collective agents can still be hypocritical by violating their *own professed commitments*. This creates an epistemic defeater about their seriousness."  
     → **Follow-Up:** "But isn’t the outrage here about *complicity*, not insincerity? The university isn’t just ‘unreliable’—it’s *actively sustaining* the harm it condemns. Doesn’t that attack its *moral jurisdiction* to blame?"

  5. **Prospective Hypocrisy (Self-Binding Blame)**  
     *Question:* "Imagine someone blames you for lying today, while explicitly stating she’ll lie tomorrow to ‘bind herself’ to the norm. There’s no past violation for evidence—yet her blame seems *instrumental*, not authoritative. Does she have standing?"  
     *Likely Reply:* "If she accepts the norm binds her, she has standing. Her future intent might make her blame unwise, but not unauthorized."  
     → **Follow-Up:** "But if she *publicly plans* to violate the norm, isn’t she undermining the very reciprocity that makes blame a shared practice? How can she demand what she’ll imminently reject? Isn’t this closer to *extortion* than moral address?"

  6. **Asymmetric Exposure (Compliance Difficulty)**  
     *Question:* "A recovering addict blames a casual user for relapse. The addict’s past violations were far harder to avoid than the target’s. If standing depends only on the norm’s validity, she *can* blame—but intuitively, she lacks standing. Is *difficulty of compliance* doing the real work here?"  
     *Likely Reply:* "Her history might make her blame *unfair* or *unhelpful*, but she still has authority if the norm binds both."  
     → **Follow-Up:** "If she demanded harsher punishment for the casual user than she’d accept for herself *under identical pressures*, isn’t that a failure of *moral reciprocity*—a core condition for standing—not mere unfairness?"

  7. **The Falsification Question**  
     *Question:* "What observable feature of our blaming practices *could not exist* if your view were correct? Put differently: what would count as evidence that standing *isn’t* just about the norm’s validity?"  
     *Likely Reply:* "If we consistently treated hypocrites as having authority once sincerity concerns were mitigated, that would confirm my view."  
     → **Follow-Up:** "But in cases like the self-binding hypocrite or asymmetric compliance, we *don’t* grant authority even when sincerity is avowed. Doesn’t this suggest standing requires a *relational condition*—like clean hands or equal vulnerability—that your view misses?"

  ---

  ### **Key Tactics in This Sequence**
  - **Progressive Pressure:** Starts with foundational theory (Q1), moves to intuitive practice (Q2), then isolates sincerity (Q3) before tackling hard cases (Q4–6). Each follow-up forces M to either defend distinctions with new resources or concede ground.
  - **Anticipating Reclassification:** Follow-ups preempt "sincerity/unfairness" escapes by reframing objections as *structural* (e.g., moral reciprocity in Q6, complicity in Q4).
  - **Weakest Links:** Targets her model’s reliance on psychology (Q4), compliance over difficulty (Q6), and future intentions (Q5).
  - **Close:** Q7 demands falsifiability—forcing her to admit what could break her theory or expose its limits.

  This forces M beyond restating her thesis by confronting her with cases where "sincerity" and "unfairness" can’t absorb the intuitions, while spotlighting the role of reciprocity and moral jurisdiction. Good luck with the episode!
