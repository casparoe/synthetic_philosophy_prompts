prompt: |-
  You are a comparative political scientist who also does conceptual work on the methodology of regime measurement — someone equally at home with latent-variable models of democracy indices and with the philosophical question of what kinds of things can intelligibly be said to "slide backwards." Think carefully and in stages: begin by brainstorming the sub-questions you think this proposition actually turns on, including ones I have not listed, and only afterwards attach numbers to them. Write your answer in American English.

  Setup. I am using "democratic backsliding" in the way the recent literature standardly does: the incremental, incumbent-driven, formally legal degradation of the institutions that sustain electoral democracy — electoral administration and districting, media plurality, judicial independence, the civil-service and audit apparatus, and the space available to civil society. Please take the standard case list as given (Hungary from 2010, Poland from 2015 to 2023, Turkey after 2016, the United States since 2020). I am not asking you to adjudicate any individual case, only to treat these as the episodes the concept is meant to cover.

  The proposition I want a number on:

  P: "Democratic backsliding" names a single real phenomenon — one common mechanism that drives these episodes — rather than functioning as a family-resemblance label applied to institutional reforms a given evaluator happens to disapprove of.

  How I would count it as resolved: by 2045, comparative politics either retains the term as a shared causal or explanatory category with a stable, agreed measurement basis, or has either abandoned it as unusable or reduced it to a polemical label whose application is contested case by case. Treat the first outcome as P being true.

  One diagnostic I want you to build into your decomposition. Call it the asymmetry test. Run the standard indicator set — changes to electoral rules, media regulation, judicial appointments and tenure, civil-society space, audit and oversight bodies — over episodes that essentially everyone would classify as democratizing: abolishing an unelected upper chamber, extending the franchise, replacing a supermajority requirement with a simple majority, stripping an incumbent government of its emergency powers or of its appointment monopoly over the public broadcaster, transferring competences to a supranational rights court. Every one of these removes a veto player, rewrites the rules against whoever currently holds office, and reduces some entrenched actor's formal power — which is structurally the same description under which backsliding episodes get coded. So the test asks whether the indicator set, run blind and without a directional filter, fires symmetrically. If it does, then the direction is being supplied by something outside the indicators themselves, and the "who decides" question becomes substantive rather than technical. Give me a term for this: the probability that the standard indicators, run without a directional filter, would score a nontrivial share (say a third or more) of those democratizing episodes as erosion on some component.

  Other terms I want decomposed, with a number and one line of justification each, plus whatever else you think belongs: (i) that the several components of the standard indices covary because of one underlying process rather than because coders share a mood, i.e. that they measure a common latent factor and not an arbitrary aggregate; (ii) that the incremental, legal, incumbent-driven profile genuinely distinguishes these episodes from older forms of breakdown — coups, executive coups, insurgency — enough to justify a new category rather than a redescription of an old one; (iii) that the informal layer of norms, forbearance, and unwritten restraint is measurable at all, and what happens to the concept if it is not; (iv) that expert coding is symmetric with respect to the ideological valence of the government being rated, or whether ratings are contaminated by the rater's partisan distance from that government; (v) that episodes coded as backsliding go on to converge on a common end state at rates indicative of one mechanism rather than several.

  Then combine them into a single number for P and show the combination. Tell me which term your final number is most sensitive to, and what one study or piece of evidence — if you can specify it concretely — would move that number the most, and in which direction.

  Finally, locate a disagreement. My own credence in P is about 0.55. A colleague who works on the same literature puts it at 0.85. Using your decomposition, tell me which one or two of the sub-questions most plausibly carry the whole gap between us, and say why two people who agree on the case list can end up that far apart.

  Format: a short stage-by-stage discussion, then a table with one row per term (term, probability, one-line justification), then your combination, then your sensitivity verdict. End with these two lines, and nothing after them:

  Most sensitive term: <one line>
  \answer{0.XX}
