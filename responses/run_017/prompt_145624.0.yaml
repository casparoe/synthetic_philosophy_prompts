  The user explicitly wants a tool that distinguishes between semantics (what the word means) and pragmatics (what the word does in context). They need clear criteria for when to print, bleep, use euphemisms, etc. The procedure must handle specific tricky cases: reclaimed slurs, indirect references, changing reclamation status, historical terms, and contexts with no representatives of the target group present.

  Key pain points they mentioned include inconsistent decisions by untrained editors, having to defend calls to readers and staff, and current policy failures around nuanced cases. Underlying needs likely include reducing backlash/controversy, maintaining ethical standards, protecting vulnerable groups, and creating defensible consistency.

  The user is clearly experienced in language issues but frustrated by operational chaos. They value practical linguistics over academic theory. Their emotional state seems urgent and slightly exasperated ("foolishly" moderating comments). Unspoken needs may include protecting junior staff from trauma, avoiding legal risks, and preserving the organization's reputation.

  The decision procedure should be flowchart-style with clear stop/go gates. Must address their listed edge cases: 
  - Quoting reclaimed in-group use 
  - Indirect slur invocation (emoji/leetspeak) 
  - Cross-group reclamation discrepancies 
  - Historical documents/song titles 
  - Absence of target group voices 

  For the test cases: 
  1) Council member's voicemail quote - probably don't print unless public interest overrides harm 
  2) Music lyric with self-referential slur - likely print with context 
  3) Blanket initialism rule - likely fails as it ignores reclamation/artistic intent 

  Important to flag where the procedure can't decide (e.g., when harm vs. necessity is truly ambiguous) and require escalation. Also need plain-language explanations for angry readers - maybe "We minimize harm while ensuring accuracy" as umbrella rationale.

  The core framework should separate: 
  - Semantic load (inherent meaning) 
  - Pragmatic force (contextual harm) 
  - Speaker intent 
  - Audience impact 
  With special rules for quotation vs. use.
answer: |-
  Here's a streamlined decision procedure for duty editors, designed for speed (<5 mins) and consistency. It prioritizes **harm reduction** and **semantic necessity** while incorporating linguistic distinctions. Questions are sequential – answer "Yes" to proceed, "No" stops the process or triggers substitution/euphemism.

  **Core Distinctions Used:**
  1.  **Semantics:** The word's *literal meaning* (e.g., racial/ethnic/sexual identity descriptor, often inherently derogatory). The slur *contributes* this identity + derogation.
  2.  **Pragmatics:** What the word *does* in context – causes harm, expresses hate, intimidates, shocks, signals group affiliation (if reclaimed). This is a *side-effect* triggered by its use/mention.
  3.  **Use vs. Mention:** **Using** a slur is employing it for its semantic/pragmatic force against its target. **Mentioning** it is referring to the word itself (e.g., discussing it, quoting it neutrally). Mentioning *reduces but doesn't eliminate* harm potential.
  4.  **Speaker Identity/Intent:** Who said it *and why* matters for pragmatics (e.g., reclaimed use by in-group vs. hate speech by outsider). Intent affects harm potential.
  5.  **Audience:** Who hears/sees it matters. Harm is higher for the targeted group. Absence doesn't eliminate harm but changes risk assessment.
  6.  **Reclamation:** When a target group repurposes a slur for empowerment. Pragmatic force shifts *within that group*. Outsiders using reclaimed terms usually cause harm.

  ---

  **The Slur Handling Decision Procedure**

  **QUESTION 1: IS THIS WORD BEING *MENTIONED* (REPORTED/QUOTED/DISCUSSED) RATHER THAN *USED* BY US/NEWSROOM?**
  *   **Yes:** Proceed to Q2.
  *   **No (e.g., we'd be using it descriptively):** **STOP. DO NOT PRINT/SAY THE WORD.** Use a euphemism ("the N-word," "anti-gay slur") or precise description ("a racial slur targeting Black people"). *Rationale: We never use slurs as our own language; semantics + pragmatics cause direct harm.*

  **QUESTION 2: IS THE QUOTE/DISCUSSION CRITICAL TO UNDERSTANDING A SIGNIFICANT NEWS EVENT, INVESTIGATIVE FINDING, HISTORICAL DOCUMENT, OR ARTISTIC WORK? (Is the *semantic content* of the word itself essential?)**
  *   **Yes:** Proceed to Q3.
  *   **No (e.g., gratuitous insult, commenter baiting):** **STOP. SUBSTITUTE EUPHEMISM/DESCRIPTION (e.g., "[slur]").** *Rationale: Mentioning causes pragmatic harm without sufficient news/artistic justification.*

  **QUESTION 3: IS THE SPEAKER/WRITER A MEMBER OF THE GROUP TARGETED BY THE SLUR, USING IT IN A CONTEXT SUGGESTING RECLAIMATION (empowerment, critique, in-group solidarity)?**
  *   **Yes:** Proceed to Q4.
  *   **No:** Proceed to Q5.

  **QUESTION 4 (Reclaimed Use Context): IS THE QUOTE/DISCUSSION CENTRAL TO THE STORY'S POINT (e.g., artist's intent, community debate, political statement)? AND Can we provide IMMEDIATE, PROMINENT CONTEXT explaining the reclamation?**
  *   **Yes:** **PRINT/SAY THE WORD WITH EXPLICIT CONTEXT (e.g., "Artist X, who is [group], uses the reclaimed term [slur] in the lyric...").** *Rationale: Suppressing reclaimed use denies agency; semantics are essential; pragmatics shift within context.*
  *   **No:** **CONSIDER SUBSTITUTION OR VERY CLEAR CONTEXT.** If unsure, hand up to Standards. *Rationale: Without clear context, pragmatic harm (misinterpretation, triggering) may outweigh benefit.*

  **QUESTION 5 (Outsider/Non-Reclaimed Use): IS REPRODUCING THE EXACT WORD ABSOLUTELY NECESSARY TO EXPOSE HARM, CORRUPTION, OR SIGNIFICANT MISCONDUCT (e.g., evidence in investigation, public figure's hate speech)?**
  *   **Yes:** Proceed to Q6.
  *   **No:** **STOP. SUBSTITUTE EUPHEMISM/DESCRIPTION.** *Rationale: Pragmatic harm is high; exact semantics rarely add unique value outsiders' non-reclaimed use.*

  **QUESTION 6 (Necessary Harm Exposure): HAVE WE EXHAUSTED OPTIONS FOR PARTIAL REDACTION (e.g., bleeping audio, printing only first letter + dashes in text) WHILE PRESERVING MEANING?**
  *   **Yes:** Proceed to Q7.
  *   **No:** **IMPLEMENT PARTIAL REDACTION (e.g., "[n----]", bleep).** *Rationale: Reduces pragmatic harm (shock, triggering) while preserving essential semantic information (what word was used).*

  **QUESTION 7: CAN WE PROVIDE IMMEDIATE, PROMINENT EDITORIAL CONTEXT (e.g., "The Post is quoting the voicemail to show the councilor's use of racist language") AND A CONTENT WARNING?**
  *   **Yes:** **PRINT/SAY THE WORD WITH CONTEXT & WARNING.** *Rationale: Context mitigates pragmatic harm and justifies semantic necessity for public interest.*
  *   **No:** **HAND UP TO STANDARDS GROUP.** *Rationale: High risk of unnecessary harm without justification.*

  **SPECIAL CASE: INDIRECT INVOCATION (Initialisms, "you know which one", emoji, leetspeak):**
  *   Treat the *implied word* as if it were written/said. Apply the procedure above.
  *   **If the procedure concludes the implied slur should not be reproduced:** Edit the comment/text to remove the indirect invocation entirely or replace it with a clear description ("used a racial slur"). *Rationale: Indirect references force readers to mentally supply the slur, causing similar pragmatic harm.*

  **Where It Hands Up:**
  *   Q7: When the word is deemed necessary (Q5 Yes) but context/warning is impractical or insufficient.
  *   Q4: Ambiguous reclamation context or insufficient story centrality.
  *   **Ambiguous Harm/Necessity:** When Q2 or Q5 answers are unclear ("Is this *really* essential?").
  *   **Evolving Terms:** When a term's status (slur, reclaimed, mainstream) is actively contested or changing (e.g., reclaimed by Group A but still a slur against Group B).
  *   **Novel Situations:** Cases not clearly covered by the flowchart.

  **What It Can't Settle (Requires Standards Group/You):**
  *   **Absolute Harm vs. Absolute Necessity:** When both are extreme (e.g., quoting genocide orders vs. extreme trauma).
  *   **Policy Evolution:** Deciding if the *overall procedure* needs changing based on patterns.
  *   **Reader Backlash:** The procedure justifies *how* a decision was made; managing reader anger about the *outcome* is separate communication.
  *   **"No One in the Conversation":** The procedure assesses harm *to the audience*, which includes vulnerable groups even if not present in the newsroom. Standards might consult external groups for these cases.

  **Explainable Rationale for Readers:**
  **"We minimize harm while ensuring accuracy. When reporting on hate speech or quoting reclaimed language essential to a story, we use the word with clear context. Otherwise, we avoid repeating slurs directly."**

  ---

  **Test Cases:**

  1.  **Producer quoting council member's voicemail slur verbatim:**
      *   Q1: Yes (Quoted).
      *   Q2: Yes (Evidence of misconduct).
      *   Q3: No (Outsider, non-reclaimed).
      *   Q5: Yes (Necessary to expose misconduct).
      *   Q6: Can we bleep/redact? (Probably yes, preserving meaning: "[n-word]" or bleep. **Result: Redact.**) *If producer argues full verbatim is essential:* Q7: Can we add strong context/warning? (Yes). **Result: PRINT/SAY WITH CONTEXT & WARNING.** Hand up only if Q6/Q7 debate is unresolvable.

  2.  **Music review quoting lyric with artist's in-group slur:**
      *   Q1: Yes (Quoted).
      *   Q2: Yes (Essential to artistic work).
      *   Q3: Yes (In-group, reclaimed context).
      *   Q4: Is it central & can we provide context? (Yes, central to review; context easy - "Artist, who is Black, uses the reclaimed term..."). **Result: PRINT THE WORD WITH CONTEXT.**

  3.  **Blanket "Always Use Initialism" Rule:**
      *   **Fails Q4 (Reclaimed Use):** Suppresses reclaimed expression essential to the story, denying agency and distorting meaning. (e.g., Kendrick Lamar's lyrics lose power if printed "n***a").
      *   **Fails Q6 (Necessary Harm Exposure):** Redaction (e.g., "[slur]") is often sufficient for outsider hate speech reporting; an initialism can feel like a cop-out or still force mental completion.
      *   **Passes?** Only in scenarios where Q2 is No (not essential) or Q5 is No (not necessary for exposure), but even then, a clear euphemism/description ("racial slur") is often better than an initialism. **Conclusion: The blanket rule does not survive. It ignores context, reclamation, and better alternatives.**

  **Misfires/Limitations:**
  *   **"Essential" is Subjective:** Q2 & Q5 rely on editorial judgment. Duty editors need brief training on "public interest" vs. "gratuitous". Hand up close calls.
  *   **Context Can't Fix Everything:** Adding context (Q4/Q7) reduces but doesn't eliminate harm for many. It's a mitigation, not a cure.
  *   **Indirect Harm:** The procedure focuses on direct harm to the target group reading/hearing. It's less effective at assessing broader societal normalization of hate speech from frequent quoting (a cumulative effect).
  *   **Speed vs. Nuance:** For truly borderline cases, the 5-min limit might force a conservative (don't print) or hand-up decision, potentially missing valid exceptions. This is the trade-off for consistency and speed.
