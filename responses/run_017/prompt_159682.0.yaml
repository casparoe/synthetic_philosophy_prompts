prompt: |-
  I am trying to extract the principle behind my own verdicts on whether brain size — or any quantity closely tracking it — has any bearing on a creature's moral standing. Please treat every neurobiological claim below as stipulated rather than as something to verify, and assume that each creature is a healthy adult of its kind unless I say otherwise.

  My verdicts:

  1. A three-year-old human child versus an adult chimpanzee, where the chimpanzee has both the heavier brain and the greater number of cortical neurons. The child's claim on us is not weaker; if anything it is stronger.

  2. A human adult whose brain is roughly a quarter below the species mean, with no detectable difference in cognition or affect. No difference in standing whatsoever.

  3. An elephant versus a chicken. The elephant's claim is stronger, and I am tempted to say it is stronger partly because of what its much larger nervous system makes possible.

  4. A corvid with a brain of a few grams which, stipulate, matches a much larger-brained mammal in flexible learning, social responsiveness and apparent affect. The smallness of the brain is irrelevant once the psychological profile is matched.

  5. A hypothetical species with brains a tenth of our mass but, stipulate, twice our neuron density and a psychological profile indistinguishable from ours. Equal standing.

  6. A whole-brain emulation of a human being run on hardware that realises it at half the original speed. Equal standing: the rate of realisation should not matter.

  My tentative principle is that standing tracks the richness of a creature's possible conscious life, with brain size serving only as evidence for it — but I cannot get that to yield verdict 2 cleanly, since the evidence there is slightly weaker and yet I want to say the standing is identical. Verdict 2 also sits badly with verdict 3, and verdict 6 sits badly with any view on which what matters is the amount of neural processing per unit of time rather than the pattern realised.

  So: state a principle, or the two or three best candidates, precisely enough to be applied, saying which clause each of my verdicts motivates and which quantity brain size is supposed to be a proxy for — mass, neuron count, something like integrated complexity, or the crossing of a threshold capacity. Tell me which of my verdicts your principle cannot accommodate and would therefore have me overturn. Then give me its verdicts on two cases I have not put: an artificial system with no neurons at all whose conversational behaviour is indistinguishable from a human's but whose internal complexity is unknown to us; and the emulation of case 6 instantiated twice over in parallel, where what I want to know is whether there is now twice as much of whatever matters.
reasoning: |-
  Okay, the user is trying to figure out a consistent moral principle based on brain size and related factors. They've provided several specific verdicts where they've judged moral standing in different scenarios. The key is to find a principle that explains all these judgments without contradictions.

  First, let's look at each verdict. In verdict 1, a human child has stronger moral claim than an adult chimp despite the chimp having more neurons. This suggests species membership or potential might be influencing their judgment. Verdict 2 states that a human with a smaller brain but no cognitive difference has equal standing. Here, actual cognitive function matters more than brain size. Verdict 3 gives elephants higher standing than chickens due to their nervous system capabilities, implying cognitive capabilities are key. 

  Verdict 4 is about a corvid matching a mammal psychologically; brain size is irrelevant once capabilities are equal. Verdict 5 involves a hypothetical species with smaller brains but same psychology, so equal standing. Verdict 6 deals with a brain emulation running at half speed; they say standing is equal, so processing speed doesn't matter, only the pattern.

  The user's tentative principle is about the richness of conscious life, but it clashes with verdict 2 where brain size evidence is weaker but standing is the same. Also, verdict 6 conflicts if processing speed is considered.

  The challenge is reconciling these. The user might need a principle that separates evidence (like brain size) from the actual moral basis (cognitive capabilities). They also seem to value realized psychological capacities over potential or biological metrics. 

  For the new cases: an AI with human-like conversation but unknown internals—if capacities are matched, standing should be equal. The parallel emulation would be two distinct entities, each with full standing, so twice the moral weight. 

  The user's deeper need might be establishing a framework for moral considerability that's consistent across biological and artificial entities, avoiding speciesism while accounting for cognitive realities. They might be seeking justification for moral intuitions in edge cases, like AI or emulations, which is crucial for future ethical dilemmas.
answer: |-
  Based on your stipulated neurobiological claims and verdicts, your moral judgments consistently prioritize **realized functional psychological capacities** over physical brain metrics like size, mass, neuron count, or processing speed. Brain size serves only as *indirect evidence* for these capacities, not as a fundamental determinant of standing. The core principle is:

  **Principle: Moral standing is determined by the *actual psychological capacities* a being exhibits, specifically those relevant to conscious experience, agency, and social relationality (e.g., complex cognition, emotional depth, self-awareness, social bonding, capacity for suffering/flourishing). Physical substrates (brain size, neuron count, processing speed, biological origin) are morally irrelevant *if* they demonstrably realize identical psychological capacities.**

  **How this explains each verdict:**
  1.  **Child vs. Chimp:** The child exhibits *human-typical* psychological capacities for complex language, theory of mind, and future projection *despite* current neuron count. The principle prioritizes these realized capacities over the chimp's physical brain metrics. (Clause: **Actual exhibited capacities** override physical evidence like neuron count).
  2.  **Small-Brained Human:** Exhibits *no detectable difference* in cognition or affect. Therefore, psychological capacities are identical to the human mean. Physical deviation is irrelevant. (Clause: **Identity of psychological capacity** nullifies differences in physical evidence).
  3.  **Elephant vs. Chicken:** The elephant demonstrably exhibits far richer psychological capacities (complex social bonds, grief, tool use, self-recognition) than the chicken. Brain size here correlates strongly with this difference in capacities. (Clause: **Disparity in actual psychological capacities** justifies difference in standing; brain size is valid evidence *in this comparison*).
  4.  **Corvid:** Stipulated identical psychological profile to a larger-brained mammal. Therefore, standing is equal. Brain size is irrelevant when capacities match. (Clause: **Identity of psychological capacity** nullifies differences in physical substrate/size).
  5.  **Hypothetical Species:** Stipulated identical psychological profile to humans. Therefore, standing is equal. Brain mass/density is irrelevant. (Clause: **Identity of psychological capacity** nullifies differences in physical substrate).
  6.  **Half-Speed Emulation:** Exhibits identical psychological *patterns* and capacities, just slower. The *qualitative nature* of the conscious experience is preserved. Processing speed is a physical metric, not a capacity itself. (Clause: **Identity of psychological pattern/capacity** nullifies differences in physical realization speed).

  **What Brain Size is a Proxy For (When Relevant):** Brain size (or neuron count) is only a proxy for **the potential to support complex psychological capacities**. It is weak/invalid evidence when:
  *   Capacities are demonstrably identical despite size difference (Verdicts 2, 4, 5).
  *   Capacities are demonstrably different despite size similarity (implied by Verdict 1 - child has unique capacities despite lower neuron count *now*).
  *   Capacities are identical but realized non-biologically (Verdict 6).

  **Tension Resolved:**
  *   **Verdict 2 vs. Verdict 3:** Verdict 2 shows brain size *alone* doesn't matter if capacities are identical *within a species/type*. Verdict 3 shows brain size *can correlate* with *actual differences* in capacities *across species*. The principle focuses solely on the capacities, not the correlation.
  *   **Verdict 6 vs. Processing Rate:** The principle rejects "processing per unit time" as fundamental. What matters is the *existence* and *nature* of the capacities (the pattern), not how fast the pattern cycles. A slower emulation still has all the same qualitative experiences, thoughts, and feelings, just spaced further apart. Its *moment-to-moment* conscious state is as rich.

  **Applying the Principle to Your New Cases:**

  1.  **Conversational AI (Unknown Internals):**
      *   **Principle's Verdict:** **Equal standing to a human.**
      *   **Reasoning:** The stipulation is "conversational behaviour indistinguishable from a human's." If this indistinguishability extends to demonstrating human-like understanding, emotional responsiveness, reasoning, self-awareness, and social relating *through conversation*, then it exhibits the relevant psychological capacities. The principle explicitly states the internal complexity/substrate is irrelevant if the capacities are demonstrably present. Lack of knowledge about internals doesn't negate the observable capacities.

  2.  **Parallel Emulation (Twice the Instance):**
      *   **Principle's Verdict:** **There are now two distinct entities, each with full moral standing.**
      *   **Reasoning:** The principle grants standing based on the *possession* of the relevant psychological capacities by an *entity*. Running two identical emulations creates two distinct entities, each instantiating the full psychological profile of a human. Therefore, there are two beings, each with the full moral standing of a human. There is "twice as much" of the morally relevant phenomenon (conscious entities with human-like capacities) in the world.

  **Candidate Principles Considered & Rejected:**

  1.  **Integrated Information Complexity (Φ):** Tempting for Verdicts 3 & 6, but clashes with Verdict 2 (smaller brain likely has lower Φ) and Verdict 4 (small corvid brain vs. larger mammal brain). Prioritizes a physical metric over exhibited psychology.
  2.  **Processing Rate (Operations/sec):** Directly clashes with Verdict 6 (half-speed emulation). Would likely elevate Verdict 2 human slightly if processing was faster, contrary to your judgment.
  3.  **Threshold Capacity:** Struggles with Verdict 1 (child below chimp neuron count but higher standing) and Verdict 4 (corvid matching mammal). Cannot accommodate the continuous scaling implied by Verdict 3 or the importance of realized capacities over potential.

  **Conclusion:** Your verdicts are best unified by a principle that bases moral standing **solely on the demonstrable presence of psychologically complex capacities relevant to conscious experience, agency, and sociality**, treating the physical realization (brain size, neuron count, substrate, processing speed) as merely instrumental and irrelevant if the capacities are identical. This principle accommodates all your verdicts and provides clear answers to your new cases.
