answer: |-
  ### Exam Question: The Heirloom Demon (25 marks)  
  **Read carefully. Answer all parts concisely and rigorously.**  

  Consider a single-molecule gas in a container at equilibrium (temperature *T*). A Maxwellian demon operates a cyclic process:  
  1. Inserts a partition, dividing the container into left (L) and right (R) halves.  
  2. Determines the molecule’s location (L or R).  
  3. Attaches a piston to the side *without* the molecule, allowing isothermal expansion that extracts work *W* = *kT* ln 2.  
  4. Removes the partition, resetting the system.  

  In the **standard demon narrative**, thermodynamic cost arises in two steps:  
  - **Measurement**: The demon pays *kT* ln 2 per bit to *acquire* information.  
  - **Erasure**: The demon pays *kT* ln 2 per bit to *reset* its memory.  
  This preserves the Second Law (net Δ*S* ≥ 0).  

  Now consider the **heirloom demon**:  
  - It possesses a pre-existing register of *N* bits (*N* ≫ 1).  
  - Each bit *i* is **perfectly correlated** with the molecule’s position in cycle *i* at the moment of partition insertion.  
  - The demon **performs no measurement** (it reads the pre-correlated bit) and **performs no erasure** (the register persists unchanged).  
  - It extracts work *W* = *kT* ln 2 per cycle indefinitely.  

  **Answer the following:**  
  1. **Contrast**: Is the difference between the standard demon and heirloom demon one of **fundamental physical kind** or merely **staging of low-entropy resources**? Justify. (8 marks)  
  2. **Independence**: Is the "price-per-bit" principle (*kT* ln 2 per bit measured or erased) an **independent physical law** or a **corollary of the Second Law**? What would a *non-question-begging derivation* of it look like? (8 marks)  
  3. **Implications**: If the price-per-bit principle is *merely* a corollary of the Second Law, does this render the standard exorcism circular? If so, is the circularity vicious? Does the Second Law survive intact in the heirloom case? Explain. (9 marks)  

  ---  
  ### Model Answer (≈700 words)  

  **1. Kind vs. Staging**  
  The difference is one of **staging**, not fundamental kind. Both demons exploit microscopic correlations to extract work, but the *location* of the initial low-entropy resource differs. In the standard demon, the low-entropy state resides in the demon’s memory subsystem, which begins "blank" (maximally disordered) and is *actively prepared* via measurement. In the heirloom demon, the low-entropy state is pre-loaded into the register, whose bits are already correlated with future gas states. Crucially, both setups require an initial entropy deficit: the standard demon’s blank memory (highly ordered initial state) and the heirloom’s pre-correlated register (low conditional entropy *H*(gas|register) = 0). The thermodynamic "cost" in both cases reflects the entropy reduction *elsewhere* that enables work extraction. The heirloom demon highlights that measurement and erasure are not intrinsically costly; they are *transfer mechanisms* for entropy. The exorcism thus reduces to locating the low-entropy resource enabling the cycle.  

  **2. Independence of the Price-per-Bit Principle**  
  The price-per-bit principle is **not an independent law** but a **corollary of the Second Law’s statistical mechanics interpretation**. A non-question-begging derivation must:  
  - Start from Liouville’s theorem (phase-space volume conservation).  
  - Show that erasing a bit *must* increase the environment’s entropy by *k* ln 2 *if* the memory system starts uncorrelated and ends randomized.  
  - Crucially, **avoid presuming** Landauer’s principle or the Second Law itself. Key steps:  
    (i) Model memory as a two-state system (states 0/1).  
    (ii) Erasure maps both states to a single state (e.g., 0), reducing memory entropy by Δ*S*ₘ = *k* ln 2.  
    (iii) By Liouville’s theorem, the environment’s entropy must increase by at least *k* ln 2 to compensate.  
  This derivation fails if the memory is *already correlated* (e.g., heirloom register), as erasure may not reduce its entropy. Thus, the principle holds only when measurement/erasure *creates/destroys* correlations.  

  **3. Implications for the Exorcism and Second Law**  
  If the price-per-bit principle is a corollary, the standard exorcism risks **mild circularity** but **not viciously**. The Second Law (Δ*S*<sub>univ</sub> ≥ 0) is the foundational postulate; the demon’s cost is derived *from* it via statistical mechanics. The exorcism is then a *consistency check*: it shows that *if* the Second Law holds, measurement/erasure must incur costs to avoid violation. The circularity is not vicious because it demonstrates *how* the Second Law constrains information processing.  

  In the heirloom case, the Second Law **survives** because the pre-correlated register constitutes a **finite low-entropy reservoir**. Initially, the register’s correlation with the gas means *S*<sub>gas+register</sub> < *S*<sub>gas</sub> + *S*<sub>register</sub>. As work is extracted, the register’s predictive power is "consumed": after *N* cycles, the register is uncorrelated, and further work extraction ceases unless new correlations are established. The global entropy increases as the register’s initial order dissipates. Thus, no violation occurs; the demon merely converts the register’s initial free energy into work.  

  **Conclusion**: The information-theoretic account is an *illuminating redescription* of thermodynamic constraints. It identifies entropy relocation sites (measurement/erasure apparatus) but adds no new physics. The heirloom demon shows that "information" has no intrinsic thermodynamic aura; only the *physical states* encoding it matter. The price-per-bit principle is a useful heuristic for tracking entropy flow in measurement/erasure contexts but is subsumed by the Second Law.  

  ---  
  ### Marking Scheme (25 total)  
  **Must-hit points (Award marks as justified; full credit for opposing views if rigorously argued):**  

  1. **Staging vs. Kind** (5 marks)  
     - *Award:* Distinguishes pre-existing correlation (heirloom) from actively created correlation (standard), identifying both as entropy relocation.  
     - *Deduct if:* Assumes measurement/erasure inherently costly without linking to entropy transfer, or claims heirloom register "must have cost energy to create" (question-begging).  

  2. **Measurement/Erasure Cost Basis** (5 marks)  
     - *Award:* Explains cost arises only when correlations are established/destroyed, not from "information" per se.  
     - *Deduct if:* Treats information as ontologically distinct ("stuff" converted to work), or conflates erasure cost with computation.  

  3. **Independence & Derivation** (5 marks)  
     - *Award:* Argues price-per-bit is corollary, sketching Liouville-based derivation.  
     - *Deduct if:* Presumes Landauer’s principle as axiom, or asserts independence without proof.  

  4. **Circularity Evaluation** (5 marks)  
     - *Award:* Recognizes non-vicious circularity (exorcism as consistency check).  
     - *Deduct if:* Claims circularity invalidates Second Law, or ignores that heirloom avoids measurement cost.  

  5. **Synthesis for Information Physics** (5 marks)  
     - *Award:* Uses heirloom to conclude that bit-accounting *redescribes* entropy constraints without adding new physics.  
     - *Deduct if:* Treats cases separately without drawing implications for standard exorcism’s foundations.  

  **Grading Thresholds:**  
  - **A (21+):** Uses heirloom case to interrogate standard exorcism’s foundations; concludes bit-accounting is non-fundamental but useful.  
  - **B (16–20):** Correctly analyzes both demons but does not synthesize implications for information’s physicality.  
  - **C (10–15):** Reproduces standard exorcism; misunderstands heirloom (e.g., insists register erasure is needed).  

  ---  
  ### Uncomprehending Student Response (≈100 words)  
  "The standard demon pays *kT* ln 2 to measure the molecule’s position and another *kT* ln 2 to erase its memory, saving the Second Law. The heirloom demon avoids these costs but still needs to erase the register eventually to reset it for future cycles. Erasing *N* bits costs *NkT* ln 2, balancing the *N* cycles of work. The price-per-bit is fundamental because information is physical. The heirloom register must have been prepared earlier at a cost, so no violation occurs. The exorcism isn’t circular because Landauer proved erasure is irreversible."  
  *(This regurgitates the standard narrative, ignores the register’s pre-correlation, and assumes erasure is necessary without justification.)*
