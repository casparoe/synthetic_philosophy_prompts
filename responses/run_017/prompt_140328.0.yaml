  First, I need to construct the exam question itself. It must clearly describe both the standard demon cycle and the heirloom variant with the pre-existing correlated register. The question should explicitly ask about the difference between the demons, whether the price-per-bit principle is independent or derivative, and what constitutes non-question-begging derivation. 

  For the model answer, I'll need to:
  - Acknowledge both demons exploit correlations but differ in when entropy reduction occurs
  - Argue the standard exorcism identifies measurement/erasure as entropy relocation points
  - Question whether bit-accounting provides unique insight beyond tracking low-entropy states
  - Conclude that while the principle isn't strictly independent, it offers useful operational framing
