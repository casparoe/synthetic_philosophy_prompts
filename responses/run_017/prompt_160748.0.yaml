prompt: |-
  I host a monthly "concepts night" in my living room — ten or so people, mostly programmers and EA-adjacent types with a couple of philosophy majors mixed in, all of whom have read a fair amount of LessWrong and Slate Star Codex but almost no formal ethics. Next month I'm on the hook for a forty-minute slot on the procreation asymmetry: the claim that there is no moral requirement to bring into existence a person who would have a life clearly worth living, but that there is a strong one not to bring into existence a person whose life would be worth not living. I have my own half-baked view about where it goes wrong, but what I need from you is a plan for teaching it, not a defense or a critique of it.

  Start with the order of ideas, since that's where I expect to get it wrong. I'm fairly confident that the move "no one is made worse off by being created" has to be on the table before the four-cell table — create a good life, create a bad life, don't create a good life, don't create a bad life — will do any work, but I'm unsure where to place the distinction between an act's being permissible and its being required, and where to place the point that the asymmetry is a constraint on one kind of choice rather than a general account of which outcomes are better. Give me the dependency structure with the reason for each ordering decision. Then the carrying example. The case I've been using with friends is a "hatchery" machine with two dials: one dial sets whether the mind it produces has a life clearly worth living or clearly not worth living, and a second dial can add a fixed amount of well-being to one of the people who already exists. The point of the second dial is to force the question of whether the asymmetry has any verdict at all in a choice between two permissible options — I suspect the honest answer is that it doesn't, and I suspect that will be the thing my group resists hardest. Tell me whether that example can carry the whole session, what it must have and what it must lack in order to work (does the counterfactual of non-existence need to be made vivid, and does the case need to be scrubbed of the politics of reproduction, of uncertainty, of identity-affecting timing, of flow-through effects on third parties?), whether you would replace it and with what, and what to do with a third dial I've also toyed with — one that painlessly deletes an already-existing contented person, as a probe for whether the asymmetry is really about existence or about being made worse off.

  Third, the misconception map, in the order you'd expect them to arise and with the point in the sequence where each should be headed off — before it can form, or after it has formed and can be named. The ones I anticipate: that the asymmetry is just antinatalism in a lab coat; that no one is worse off is the same claim as no one is harmed and settles the matter; that the asymmetry is really a threshold view about lives being worth living plus something about risk; that it must be total utilitarianism with the serial numbers filed off; and that it must say something in the second-dial case. Correct my list, add what I'm missing, and tell me which of these are worth deliberately letting surface so they can be killed in front of the room. Close with one question I can ask at the end that distinguishes having understood the asymmetry from having merely been talked out of arguing with it, and with an explicit accounting of what I should refuse to explain in forty minutes — I'd guess at least the non-identity problem and the view that coming into existence is always a harm to the person who comes into existence, but tell me what you'd cut and how I should say out loud that I'm cutting it rather than dodging it.
reasoning: |-
  Okay, let me tackle this user's request step by step. They're hosting a concepts night and need to teach the procreation asymmetry in forty minutes. The user wants a clear structure, a central example, and ways to handle misconceptions. 

  First, the order of ideas. The user mentioned starting with "no one is made worse off by being created." That makes sense because it's foundational. Without establishing that creating a person doesn't harm them, the asymmetry might seem contradictory. So that should come first. Then, the four-cell table can illustrate the core asymmetry: creating a bad life is wrong, but not creating a good life isn't. But here's where it gets tricky. The distinction between permissibility and requirement needs to be clear before diving into the table. If the group conflates "not required" with "impermissible," the asymmetry won't make sense. 

  Next, the carrying example. Their hatchery machine with two dials is clever. The second dial adding well-being to an existing person forces the question of optionality. But I wonder if deleting an already-existing person with a third dial might confuse things. The asymmetry is about bringing people into existence, not removing them. Adding that could muddy the waters. The example needs to stay focused on creation decisions. 

  Misconceptions are key. The user listed a few, like confusing the asymmetry with antinatalism. That's crucial to address early. Also, equating "no one is worse off" with "no harm" is a common slip. They might think that settles the moral question, but it's actually the starting point. The group might also try to reduce the asymmetry to threshold utilitarianism. That needs clarification—the asymmetry is a constraint, not a maximizing principle. 

  For the closing question, something that tests if they grasp the asymmetry's core: "If we don't create the good life, have we wronged anyone?" A correct understanding would say no, but they might resist. 

  Lastly, time constraints. The user should explicitly skip the non-identity problem and the harm of existence debate. Acknowledging these are related but out of scope keeps focus. 

  The user’s group is smart but lacks formal ethics. Avoiding jargon, using vivid examples, and preempting misconceptions will be vital. The hatchery machine should stay central, but keep it simple—skip the third dial. Make sure the counterfactual of non-existence is clear without politics or uncertainty. 

  Need to structure the session to build logically: start with the harm principle, then permissibility vs. requirement, then the four cells. Use the hatchery example to illustrate each point. Preempt misconceptions early, especially the antinatalism confusion. End with the diagnostic question to check understanding. Cut non-essentials firmly but politely.
answer: |-
  Here’s a battle-tested plan for your concepts night, structured for clarity and designed to preempt common misunderstandings. Focus on logical dependencies, a lean central example, and strategic misconception management.

  ---

  ### **I. Order of Ideas & Dependency Structure**  
  *(Total: 25 mins)*  

  1. **Start with the "No Harm" Principle** (5 mins)  
     - *Core claim*: "Creating a person with a life worth living does **not** harm them; creating one with a life worth *not* living **does** harm them."  
     - *Why first?* This is the asymmetry’s foundation. Without establishing that existence *can* be harmful but non-existence *cannot* be a deprivation for the non-existent, the later steps collapse. Use an analogy: "Failing to invent a happy AI isn’t depriving it of joy—it has no ‘it’ to deprive."  

  2. **Permissible vs. Required Distinction** (5 mins)  
     - *Key move*: Separate moral *obligations* (what you **must** do) from moral *permissions* (what you **may** do).  
     - *Why before the table?* If this isn’t clear, the asymmetry’s claim that creating a good life is *merely permissible* (not obligatory) will be misread as incoherent. Emphasize: "Morality often forbids harm but doesn’t demand all possible good acts."  

  3. **The Four-Cell Table** (10 mins)  
     | **Create?** | **Life Worth Living** | **Life Worth *Not* Living** |  
     |-------------|------------------------|------------------------------|  
     | **Yes**     | Permissible            | **Wrong** (harms someone)    |  
     | **No**      | **Permissible**        | Permissible (no one exists to be harmed or deprived) |  
     - *Why here?* The table visually crystallizes steps 1–2. Highlight:  
       - Top-right: Harm makes creation wrong.  
       - Bottom-left: No obligation to create good lives.  
       - Bottom-right: Vacuous truth (no one to harm).  

  4. **Constraint vs. Outcome Optimization** (5 mins)  
     - *Crucial point*: The asymmetry is a **side-constraint** ("don’t harm by creating bad lives"), **not** a rule for ranking outcomes.  
     - *Why last?* After seeing the table, the group will intuit "But isn’t more good lives better?" Now reveal: The asymmetry deliberately *doesn’t* say creating good lives is *better* than not creating them—it’s neutral on that.  

  ---

  ### **II. The Hatchery Machine Example**  
  *(Total: 12 mins)*  
  **Stick to two dials. Scrub ruthlessly:**  
  - Remove politics/identity: Frame it as creating "digital minds" or "alien lifeforms" to avoid reproductive baggage.  
  - Remove uncertainty: Dial settings guarantee outcomes ("clearly worth living/not").  
  - Remove third parties: Isolate effects to the created entity and the one receiving added well-being.  

  **How to deploy it:**  
  1. **Dial 1 (Create good/bad life):** Reinforces the core asymmetry. Ask: "Is it wrong to set Dial 1 to ‘bad life’?" (Yes—harms them.) "Is it wrong *not* to set it to ‘good life’?" (No.)  
  2. **Dial 2 (Add well-being to existing person):**  
     - *Crucial use*: Force the "optionality" point. Pose: "If I *could* create a good life but instead boost an existing person, does the asymmetry condemn this?"  
     - **The answer: No.** The asymmetry only forbids creating *bad* lives; it is silent between creating good lives vs. other good acts.  
     - *Why this works*: Exposes that the asymmetry isn’t a complete moral system—it’s a narrow rule.  

  **Skip the "delete happy person" dial:** It confuses the asymmetry (about *creation*) with a separate issue (killing). If asked, say: "That’s about harm to existing beings—outside tonight’s scope."  

  ---

  ### **III. Misconception Map**  
  *(Preempt early; address others as they arise)*  

  | Misconception | When to Address | How to Counter |  
  |---------------|-----------------|----------------|  
  | "This is just antinatalism." | **PREEMPT** (during Dial 1 demo) | "Antinatalism says creating *any* life is wrong. Here, creating *good* lives is **permitted**—we only forbid *bad* ones." |  
  | "No one is worse off = no harm, so creating good lives is neutral." | **PREEMPT** (during "No Harm" principle) | "True, but neutrality ≠ obligation. Brushing your teeth is neutral for others—not a moral duty." |  
  | "This is threshold utilitarianism plus risk-aversion." | **LET ARISE, THEN KILL** (after table) | "Threshold views still say more good lives = better outcome. The asymmetry denies this—it sees no difference between creating or not creating good lives." |  
  | "It must imply total utilitarianism." | **PREEMPT** (during constraint vs. outcomes) | "Total utilitarianism *requires* creating good lives. The asymmetry *permits* but doesn’t *demand* it." |  
  | "The asymmetry *must* prefer creating good lives over other good acts." | **LET ARISE, THEN KILL** (Dial 2 demo) | Use Dial 2: "Boost an existing person instead of creating a good life. Does the asymmetry care? No—it only forbids bad creations." |  
  | **MISSING:** "If creating good lives isn’t required, isn’t it selfish?" | If raised | "Selfishness isn’t the point. Morality doesn’t demand *every* generous act (e.g., donating 90% income isn’t obligatory). The asymmetry is about limits, not virtue." |  

  ---

  ### **IV. Closing & Scoping**  
  - **Diagnostic Question** (2 mins):  
    *"If you choose not to create a life that would be worth living, have you wronged anyone?"*  
    → **Correct answer:** No (per the asymmetry). If they say "yes," they’ve conflated permissibility with obligation.  

  - **Explicitly Exclude** (1 min):  
    *"To stay focused, we’re skipping three big topics tonight:  
    1. The* non-identity problem *(does it matter* which *person exists?).  
    2. Whether* coming into existence is always a harm *(Benatar’s anti-natalism).  
    3. Uncertain outcomes or real-world reproduction politics.  
    These matter—but dissecting the asymmetry comes first."*  

  **Total: 40 mins**  
  ---
  **Why this flow works:**  
  1. Starts with non-controversial harm logic.  
  2. Isolates the asymmetry’s minimal claim (a constraint, not an optimizer).  
  3. Uses the hatchery to **show** optionality, not just tell.  
  4. Preempts political/emotional triggers via abstraction.  
  5. Diagnostic question tests comprehension, not agreement.  

  **Trap to avoid:** Don’t litigate "Is the asymmetry *true*?"—your goal is teaching its structure. If debate erupts, redirect: "For now, let’s see how the pieces fit—we can tear it apart next month!"
