  The user proposes "refinement invariance" as a solution - the update should be consistent across partitions that only distinguish elements the evidence doesn't differentiate. They argue this leads to likelihood-ratio updates being fundamental, with JC as a special case. For cases like Judy Benjamin where evidence is under-specified, they claim no unique update exists.

  The audience includes various specialists: Bayesian epistemologists who see this as settled, a decision theorist focused on purpose, an imprecise probabilities advocate, an ML researcher (like the flatmate), a philosophy of perception scholar, and grad students interested in higher-order evidence.

  I need to prepare for likely objections:
  - The Bayesian epistemologists will defend textbook JC as sufficient
  - The decision theorist will question the rule's functional purpose
  - The imprecise probabilities advocate will attack precise credences
  - The ML researcher will dismiss this as reinventing virtual evidence
  - The perception philosopher will challenge experiential evidence handling
