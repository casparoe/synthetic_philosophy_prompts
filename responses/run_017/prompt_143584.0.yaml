answer: |-
  **MEMORANDUM**

  **To:** Halverston Trust Grants Committee  
  **From:** [Your Name], Public Member  
  **Date:** 12 October 2023  
  **Subject:** Allocation of Restricted Bequest (£1.8m) for Prevention/Relief of Suffering in Animals Used for Food – Recommendation  

  **1. Purpose and Background**  
  This memo outlines my recommendation for allocating the £1.8m restricted bequest designated for the "prevention or relief of suffering in animals used for food." Following shortlisting, two viable proposals remain:  
  *   **Option A:** Funding capital costs and operator training for in-water electrical stunning at harvest sites for farmed Atlantic salmon in Scotland and Norway. This would impact an estimated 22 million fish annually. The Trust’s scientific adviser assesses the probability of salmonids possessing phenomenal states (sentience) as high (0.8–0.95). Current slaughter practices likely leave fish conscious for 2–15 minutes. Efficacy depends critically on rigorous training and auditing to prevent stunning failures causing additional distress.  
  *   **Option B:** Funding a two-stage on-farm killing protocol (chilling followed by immediate mechanical disintegration) for black soldier fly larvae and mealworms supplied to major insect-feed producers, replacing sun-drying and freezing. This would impact an estimated 34 billion insects annually. The adviser assesses the probability of insects possessing any phenomenal states (sentience) as significantly lower and highly uncertain (0.05–0.35). Conditional on sentience, the intensity of any distressing episode, and the total volume of experience, is estimated at 1–10% of a salmon's per episode.  

  The core challenge lies in comparing interventions across vastly different scales and profound uncertainties, particularly regarding insect sentience.

  **2. Recommendation**  
  I recommend that the Halverston Trust **fund Option B (the insect protocol)**, subject to the following conditions:
      *   **Condition 1:** Funding is contingent on the development and implementation of a robust, independently verifiable training and auditing programme for operators of the new insect-killing protocol, mirroring the critical importance placed on this aspect in Option A. A minimum of £200,000 from the bequest must be ring-fenced specifically for this purpose, integrated into the project plan from inception.
      *   **Condition 2:** A portion of the bequest, up to £150,000, is allocated concurrently to fund targeted research into identifying clearer behavioural or physiological markers for phenomenal states (sentience/pain) in insects relevant to farming contexts (specifically BSF larvae and mealworms). This research should be commissioned immediately with the aim of informing future Trust decisions, even if definitive answers within 18 months are unlikely.
      *   **Time Frame & Review Point:** Implementation funding for the insect protocol and associated training/audit programme to be released upon satisfactory agreement on Condition 1. The research component (Condition 2) to commence immediately. A formal review of the insect protocol's implementation, audit findings, and preliminary research insights will be conducted by the Committee no later than **October 2025** (approximately 24 months from decision).

  **3. Reasoning**  
  My recommendation is based on a comparative assessment of the *expected moral weight* of suffering averted by each option, while explicitly acknowledging the significant uncertainties. This approach incorporates:
      *   **The Number of Individuals Affected:** The sheer scale difference is immense (34 billion insects vs. 22 million salmon annually).
      *   **The Probability of Sentience:** We must confront the adviser's uncertainty ranges directly. A pure precautionary principle applied categorically to the *existence* of insect sentience (treating P(sentience) as 1.0) risks ignoring the scientific uncertainty and could lead to highly counterintuitive resource allocation in the future (e.g., prioritising trillions of nematodes with minimal evidence). Conversely, ignoring the possibility entirely (treating P(sentience) as 0.0) seems unjustifiably dismissive of documented nociceptive sensitisation and learning.
      *   **The Relative Intensity and Duration of Suffering Averted:** Conditional on sentience, the adviser estimates the intensity per distressing episode for insects is a fraction (1–10%) of a salmon's. Furthermore, the duration of suffering averted per individual is likely shorter under the proposed insect protocol compared to the current salmon slaughter interval.

  **Unit of Moral Accounting:** I utilise **Expected Suffering-Averted per Individual Episode**. This unit accounts for:
      *   The *number of individuals* experiencing a potentially distressing event (slaughter).
      *   The *probability* that this event involves a conscious, negative phenomenal state (P(sentience)).
      *   The *relative intensity* of that negative state compared to a benchmark (salmon).

  **Calculation & Weighting:** Taking the adviser's midpoints for estimation:
      *   **Salmon (Option A):** P(sentience) = 0.875; Relative Intensity = 1.0. Expected Suffering-Averted per Fish = 1 * 0.875 * 1.0 = 0.875 units.
      *   **Insects (Option B):** P(sentience) = 0.20; Relative Intensity = 0.05 (midpoint of 1-10%). Expected Suffering-Averted per Insect = 1 * 0.20 * 0.05 = 0.01 units.

  **Scaled Impact:**
      *   Option A Annual Expected Suffering-Averted: 22 million fish * 0.875 units ≈ 19.25 million units.
      *   Option B Annual Expected Suffering-Averted: 34 billion insects * 0.01 units = 340 million units.

  This results in Option B having an **expected impact approximately 17.7 times greater** than Option A annually. Even using the very bottom of the adviser's ranges for insects (P(sentience)=0.05, Intensity=0.01) and the top for salmon (P=0.95, Intensity=1.0), Option B's impact (34bn * 0.05 * 0.01 = 17 million units) remains broadly comparable to Option A's best case (22m * 0.95 * 1.0 = 20.9 million units). Only if insect sentience is deemed virtually impossible does Option A clearly dominate.

  **Addressing Concerns:**
      *   **Scale & Future Bids:** While the scale of potential invertebrate suffering is vast, this calculation relies on the adviser's *current, specific* estimates for these insects. Future bids concerning nematodes etc. would require assessment based on the evidence pertaining to *those* species at that time. Funding B does not automatically commit us to funding all invertebrate proposals regardless of evidence.
      *   **Conscious-Hours:** Shifting to conscious-hours averted shrinks B's advantage because the suffering interval per insect is brief. However, using the adviser's intensity estimates scaled by duration (assuming insect distress duration is also a fraction of the salmon's interval) still yields a significantly higher expected impact for B, albeit reduced from the factor of ~20 calculated above. The fundamental scale difference remains compelling.
      *   **Uncertainty & Precaution:** The calculation *is* the precautionary approach applied quantitatively across both existence and intensity uncertainty, weighted by probability. Ring-fencing funds for further insect sentience research (Condition 2) is a direct response to this uncertainty, aiming to improve future decisions without paralysing current action where a significant potential benefit exists.
      *   **Implementation Risk (Condition 1):** The potential for poorly applied stunning in Option A is matched by the risk of poor implementation of the insect protocol. Condition 1 directly addresses this by mandating equivalent focus on training and audit. The welfare gain in salmon, while highly probable *if implemented perfectly*, is not guaranteed.

  **4. The Strongest Case for the Course We Are Not Recommending (Funding Option A)**  
  The most compelling argument for prioritising Option A rests on the profound difference in the *certainty and potential depth* of suffering involved. Salmon are vertebrates with complex nervous systems homologous to our own; the scientific consensus supporting their capacity for conscious suffering, including pain and fear, is robust and well-established (P=0.8-0.95). The suffering during the 2-15 minute slaughter interval under current methods is likely severe. Implementing electrical stunning, backed by rigorous training and audit, offers a near-certain, significant reduction in intense suffering for millions of identifiable individuals every year. In contrast, the case for insect suffering remains highly speculative and contentious. While nociception exists, attributing conscious, negatively valenced experience ("suffering") to creatures as alien as insects, with brains orders of magnitude simpler and organised very differently, ventures far beyond established scientific understanding (P=0.05-0.35). Even if some minimal form of sentience exists, the intensity and significance of any distress during slaughter are almost certainly negligible compared to a fish struggling and suffocating. Funding Option B risks diverting substantial resources based on highly uncertain moral mathematics and philosophical conjecture, potentially achieving little to no real-world reduction in suffering, while failing to alleviate the known, severe suffering of sentient salmon that we can confidently address today. Prioritising known suffering over highly uncertain potential suffering is the more prudent and ethically defensible course.

  **5. Trigger for Reopening Decision**  
  This decision should be reopened if, prior to the October 2025 review point, significant and credible new scientific evidence emerges that fundamentally alters the estimated probability of sentience in black soldier fly larvae or mealworms (e.g., compelling, widely accepted markers demonstrating phenomenal pain states, or conversely, strong evidence ruling it out).

  \answer{Fund B with conditions}
