answer: |-
  **Bottom line:** Rational disagreement persists because the doctors' private signals about test reliability are not common knowledge upon exchanging posteriors; each infers *that* the other has private information but not *what* it is, violating the common knowledge of posteriors condition.

  **Scenario:**  
  Dr. Lee and Dr. Patel evaluate a patient with a pulmonary nodule. Shared prior: malignancy risk = 50%. Two public tests: CT scan (PPV 0.8, NPV 0.8) and PET scan (same metrics). Both tests are positive. Each doctor privately assesses one test’s machine calibration: Dr. Lee inspects the CT scanner, observing a binary signal (H/L) about its reliability; Dr. Patel inspects the PET scanner likewise. Reliability priors: P(reliable) = 0.9. Signals are noisy: P(H | reliable) = 0.9, P(H | faulty) = 0.1. They exchange malignancy probabilities truthfully and repeatedly.

  **Walkthrough:**  
  - **Round 0 (private update):**  
    - Dr. Lee observes H for CT (indicating reliable), calculates malignancy risk = 92.9%.  
    - Dr. Patel observes L for PET (indicating less reliable), calculates malignancy risk = 86.1%.  
  - **Round 1 (exchange):**  
    - Lee reports 92.9%, Patel reports 86.1%.  
    - Lee infers Patel’s L signal (only L yields 86.1% given Patel’s setup) and updates: adjusts for PET’s unreliability, new risk = 88.7%.  
    - Patel infers Lee’s H signal (only H yields 92.9%), updates: adjusts for CT’s reliability, new risk = 91.0%.  
    *(Disagreement: 88.7% vs. 91.0%)*  
  - **Round 2 (exchange):**  
    - Lee reports 88.7%, Patel reports 91.0%.  
    - Lee realizes Patel’s updated risk (91.0%) implies Patel learned Lee’s H signal, but Lee already knows this—no new information. Lee’s risk stays 88.7%.  
    - Patel similarly infers no new information, risk stays 91.0%.  
    *(Disagreement persists)*  

  **Verdicts:**  
  - **(a) One-shot common knowledge formulation:** If posteriors *were* common knowledge (e.g., both doctors simultaneously know each other’s probability and that it’s fully informed), a common prior would force agreement. Here, this fails because exchanging numbers doesn’t reveal the underlying private signals—only their consequential probabilities.  
  - **(b) Iterated-exchange version:** Convergence requires not just a common prior but **common knowledge of the updating process** (i.e., both know the exact likelihood functions mapping private signals to posteriors). Here, they know the *process*, but after Round 1, they exhaust inferrable information without learning the *specific signal values*, halting convergence.  

  **Structural feature:**  
  Private signals are *about nuisance parameters* (test reliability), not the hypothesis directly. Each doctor’s posterior depends multiplicatively on their reliability assessment and the public data. When they exchange probabilities, they learn *which* signal the other saw only in Round 1, but this doesn’t resolve the underlying uncertainty.  

  **If feature removed:**  
  If reliability signals were public (e.g., both inspect both machines), they share all information. Posteriors converge to 91.0% if Lee’s H and Patel’s L are revealed.  

  **Defusing the example (pro-convergence argument):**  
  A skeptic might argue: "After Round 1, they *do* know each other’s signals (since posteriors are injective), so they should agree in Round 2." *Rebuttal:* True, but agreement requires updating *using the same model*. Here, Lee and Patel update correctly but end at different values (88.7% vs. 91.0%) because Lee’s posterior weights the now-known PET unreliability, while Patel’s weights the CT reliability—asymmetry inherent in their roles.  

  **Conciliationist trouble:**  
  Yes, the case challenges strict conciliationism (which holds that peer disagreement requires belief revision toward the other’s view). Here, both doctors *do* revise (Lee down to 88.7%, Patel up to 91.0%), but not far enough to agree, and further revision is unwarranted. Conciliationism must accommodate rational, persistent divergence.
