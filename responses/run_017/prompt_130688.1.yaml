answer: |-
  Here’s a taxonomy tree addressing your query, structured to map the terrain of whether maximal moral goodness is desirable. The tree uses concrete, bite-sized questions to avoid presupposing philosophical knowledge. Empty combinations are noted, and leaf positions include their awkward commitments. The tree has 12 leaves, with distinctions for scarcity vs. constitutive conflicts, moral theory shape, attainability, division of labor, self-undermining, and scope implications.  

  ### **Taxonomy Tree: Is It Desirable to Be Maximally Morally Good?**  

  #### **Question 1: In a world with unlimited resources, could you be both a moral saint and excel at a non-moral pursuit (e.g., composing music)?**  
  - **Yes (Scarcity-only conflict)** → Go to Q2.  
    *If "yes," non-moral sacrifices are due to finite time/money; a richer world could resolve this.*  
  - **No (Constitutive conflict)** → Go to Q2.  
    *If "no," the attitudes for non-moral excellence (e.g., competitive drive) inherently clash with sainthood.*  

  #### **Question 2: You can save a stranger from minor harm (e.g., a sprained ankle) by skipping lunch with a friend. Must you do it?**  
  - **Yes (Maximizing theory)** → Go to Q3.  
    *If "yes," morality demands maximizing good; no supererogation.*  
  - **No (Non-maximizing theory)** → Go to Q3.  
    *If "no," morality permits supererogation; duties/virtues set limits.*  

  #### **Question 3: Can a human realistically achieve "maximal moral goodness" as a stable state?**  
  - **Yes (Attainable maximum)** → Go to Q4.  
  - **No (Unattainable supremum)** → Go to Q4.  
    *If "no," the query shifts to whether endless improvement is desirable.*  

  #### **Question 4: Would a saint’s extremism make them less effective at inspiring others?**  
  - **Yes (Self-undermining risk)** → Go to Q5.  
  - **No (No self-undermining)** → Go to Q5.  

  #### **Question 5: Should a society where everyone is a saint produce great art, science, or culture?**  
  - **Yes (No division of labor needed)** → Go to leaf assignments.  
  - **No (Division of labor needed)** → Go to leaf assignments.  
    *If "no," saints might lack expertise/attitudes for non-moral excellence.*  

  ---

  ### **Leaf Positions & Awkward Commitments**  
  *(Path = Q1→Q2→Q3→Q4→Q5)*  

  1. **Scarcity + Maximizing + Attainable + No self-undermining + No division of labor**  
     *Position:* **Demanding Consequentialism**  
     - *Commitment:* You must abandon all non-moral projects (e.g., hobbies) since any resource not used for moral good is a failure.  

  2. **Scarcity + Maximizing + Attainable + No self-undermining + Division of labor**  
     *Position:* **Unnamed**  
     - *Commitment:* Saints must exist, but they must also lament that their sainthood prevents society’s cultural progress.  
     - *Empty reason:* Incoherent—maximizing saints would redirect labor to moral goods, denying non-moral value.  

  3. **Scarcity + Maximizing + Attainable + Self-undermining + Any Q5**  
     *Position:* **Self-Defeating Sainthood**  
     - *Commitment:* To maximize moral good, you must not be a saint (since extremism reduces your influence).  

  4. **Scarcity + Maximizing + Unattainable + Any Q4/Q5**  
     *Position:* **Infinite Regret Consequentialism**  
     - *Commitment:* You must feel guilty for every moment spent on non-moral pursuits (even sleeping), as you’re perpetually sub-maximal.  

  5. **Scarcity + Non-Maximizing + Attainable + Any Q4 + No division of labor**  
     *Position:* **Satisficing Harmony**  
     - *Commitment:* Saints can enjoy non-moral pursuits only if they meet a "good enough" moral threshold—but defining "enough" is arbitrary.  

  6. **Scarcity + Non-Maximizing + Attainable + Any Q4 + Division of labor**  
     *Position:* **Specialist Pluralism**  
     - *Commitment:* Society needs moral saints, but you (if saintly) must accept being partly responsible for others’ non-moral mediocrity.  

  7. **Scarcity + Non-Maximizing + Unattainable + Any Q4/Q5**  
     *Position:* **Virtue Ethics Ambiguity**  
     - *Commitment:* You must pursue moral growth without knowing if it improves your life, as "progress" is undefined.  

  8. **Constitutive + Maximizing + Attainable + Any Q4/Q5**  
     *Position:* **Self-Erasure Utilitarianism**  
     - *Commitment:* You must suppress passions (e.g., ambition for art) that make non-moral excellence possible.  

  9. **Constitutive + Maximizing + Unattainable + Any Q4/Q5**  
     *Position:* **Unnamed**  
     - *Commitment:* You must endlessly dull your personality for morality, knowing you’ll never succeed.  
     - *Empty reason:* Unattractive—no major theory endorses this.  

  10. **Constitutive + Non-Maximizing + Attainable + Any Q4/Q5**  
      *Position:* **Conflict-Averse Virtue**  
      - *Commitment:* Saints must view traits like artistic obsession as moral flaws, even when they produce great goods.  

  11. **Constitutive + Non-Maximizing + Unattainable + Any Q4 + No division of labor**  
      *Position:* **Unnamed**  
      - *Commitment:* Society loses nothing if no one achieves non-moral excellence, as sainthood is infinitely valuable.  
      - *Empty reason:* Unattractive—denies intrinsic worth of art/science.  

  12. **Constitutive + Non-Maximizing + Unattainable + Any Q4 + Division of labor**  
      *Position:* **Tragic Idealists**  
      - *Commitment:* You must endorse a world where moral strivers and non-moral specialists are mutually reliant but mutually undermining.  

  ---

  ### **Notes on Empty Combinations & Collapses**  
  - **Empty combinations** (marked above): All arise from unattractiveness or incoherence. None are unexplored.  
  - **Collapsed distinctions**:  
    - **Scope**: Handled implicitly. "Should everyone be a saint?" fails if division of labor is needed (Q5). "Should I?" fails if self-undermining (Q4).  
    - **Attainability**: Generalizes grimness—unattainability intensifies regret (Leaf 4) but doesn’t resolve conflicts.  
  - **Self-undermining vs. division of labor**: Not collapsed; Q4 (effectiveness) and Q5 (expertise) address distinct problems.  
  - **Grimness across theories**: Non-maximizing theories (e.g., Leaf 10) still face constitutive conflicts, but scarcity problems lessen.  

  ### **Key Insights**  
  - **Constitutive conflicts** (Q1→No) generate deeper objections than scarcity—no "better world" resolves them.  
  - **Division of labor** (Leaf 6) answers "Should everyone?" but not "Should I?"—individual saints aren’t undesirable, but collective sainthood is.  
  - **Self-undermining** (Leaf 3) makes maximal goodness undesirable *because* it reduces net moral good.  
  - **Moral theory matters** (Q2): Maximizing theories face acute scarcity problems; non-maximizing theories still struggle with constitutive clashes.  

  This tree isolates how each variable (conflict type, theory, attainability, etc.) shapes the desirability of sainthood. Use it to prompt debate on which branches reflect plausible moral psychology—e.g., whether constitutive conflicts are overstated, or if division of labor dodges personal responsibility.
