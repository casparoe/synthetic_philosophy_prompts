  Crucially, no one in the document should acknowledge the underlying horror. Just calm bureaucratic processing of universe-scale stakes. The reader should slowly realize the implications through dry phrases like "asymmetric valence tractability" and "negative utilitarianism considerations". 

  *scribbles outline* 
