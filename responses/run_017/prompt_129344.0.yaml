     But in the problem, the agent doesn't know whether they have the secret. They have a prior q. Then, they choose the policy that maximizes expected utility over the prior.

     Therefore, they choose to never pay if:

          EU(never-pay) > EU(pay) 
          -q*L > -C*(1-q)
          q*L < C*(1-q)

     which is equivalent to q < C/(L+C).

     Since C/(L+C) is very small (because L>>C), and in the typical case the agent's prior q is below this threshold (because they are confident they don't have the secret), they choose the never-pay policy.

     Then, by choosing the never-pay policy, they avoid ever paying. Moreover, the blackmailer, knowing the agent has chosen a never-pay policy, will only send the letter if the agent has the secret. But since the agent doesn't have the secret (or is very unlikely to), the blackmailer does not send the letter. Therefore, the agent is not confronted with the demand and does not pay.

     This is how they resist extortion.

     In the case where the agent is not sure, but q is below the threshold, they still choose the never-pay policy and then the blackmailer will not send the letter unless the agent has the secret. And since the agent has a very small q, they are likely to not have the secret and thus not receive the letter.

     Only in the case where the agent is quite sure they have the secret (q > C/(L+C)) do they choose the paying policy. But then, if they do have the secret, the letter is not sent and they don't pay. If they do not have the secret, the letter is sent and they pay. But note, if they are quite sure they have the secret (q high), then the probability of not having the secret (1-q) is low, so the expected cost of the paying policy is low. 

     However, the blackmailer is still getting money when the agent doesn't have the secret. But that is not extortion in the usual sense because the agent has the secret with high probability.

     The key point: for typical cases (where the agent does not have the secret and knows that it's very unlikely), they commit to not paying, and this deters the blackmailer from sending the letter.

     In your initial rough sketch, you said:

     "if you're the paying type you don't actually have the secret"

     This is because for the paying type, the letter is sent only when they don't have the secret. So if you are the paying type, it is guaranteed that you don't have the secret when you receive the letter.

     And for the non-paying type, the letter is sent only when you do have the secret.

     Therefore, an FDT agent who is confident they don't have the secret will choose to be the non-paying type, and then they will not receive the letter (because they don't have the secret and are not the paying type). So they avoid the payment and the secret (which doesn't exist) is not revealed.

     Whereas a CDT agent, as we saw, will pay and then lose C, and the blackmailer wins.

     So Summary: 

     The FDT agent resists extortion by committing to a policy of not paying, which (when the agent is confident they have no secret) deters the blackmailer from sending any letter, thereby avoiding any payment or revelation.
answer: |-
  ### XOR Blackmail: Setup and Payoffs
  The XOR blackmail scenario involves a perfect predictor (blackmailer) who knows your decision algorithm in advance. The setup is as follows:

  1. **Secret Condition (S)**: You may or may not have a costly secret (e.g., a termite infestation). If revealed, this secret causes you a loss of **L** (e.g., –$1,000,000). If you don’t have the secret, revelation costs nothing.
  2. **Blackmailer's Letter**: The blackmailer sends a letter **if and only if exactly one of two things is true**:
     - You have the secret (**S = true**), OR
     - You are the type of agent who would pay if sent the letter (**P = true**).  
     (This is the "XOR" condition: letter sent iff **S ≠ P**.)
  3. **Demand and Consequences**: If you receive the letter, it demands a payment **C** (e.g., –$1,000) to keep the secret hidden. If you pay, the secret is never revealed. If you don’t pay, the secret is revealed (costing **L** if you have it, 0 otherwise).  
     If you don’t receive the letter, nothing happens (payoff = 0).

  **Payoffs conditional on receiving the letter**:
  - **Pay**: You lose **C** regardless. If you have the secret, you avoid **L**; if not, you just lose **C**.
    - Payoff if you have secret: **–C** (avoid **L**, net loss is only the payment)  
    - Payoff if no secret: **–C** (wasted payment)
  - **Don’t Pay**: No payment, but revelation occurs if you have the secret.
    - Payoff if you have secret: **–L**  
    - Payoff if no secret: **0**

  ---

  ### CDT Agent’s Behavior: Pays and Loses Money
  A **causal decision theorist (CDT)** evaluates actions based on *causal consequences*. Conditional on receiving the letter:
  - CDT believes paying *causes* the secret to be hidden, avoiding **L** if the secret exists.  
  - It ignores the **logical link** between its decision and the predictor’s prior knowledge.  
  - Reasoning:  
    - "If I pay, I avoid **L** at cost **C** (which is better than losing **L**)."  
    - "If I don’t pay, I risk losing **L**."  
    - **Thus, CDT pays, expecting to avoid a large loss.**

  **Outcome for CDT**:  
  - Because the predictor is perfect, if CDT pays, it must be the case that you **do not have the secret** (since letter is sent only if **S ≠ P**; if **P = true**, then **S = false**).  
  - Result: You pay **C** for no reason (since there’s no secret to hide).  
  - **Net loss: –C (extortion succeeds)**.

  ---

  ### FDT Agent’s Behavior: Doesn’t Pay and Resists Extortion
  A **functional decision theorist (FDT)** chooses a *decision policy* that maximizes expected utility by considering **logical counterfactuals** (i.e., what the predictor anticipated based on its algorithm). FDT evaluates policies, not just actions:
  - **Policy 1: Always pay if letter received (P = true)**.  
    - Predictor knows this, so letter is sent only if **S = false** (to satisfy **S ≠ P**).  
    - If you have the secret (**S = true**), no letter is sent (so no cost).  
    - If no secret (**S = false**), letter is sent and you pay **C**.  
    - **Expected utility: –C × (probability of no secret)**.
  - **Policy 2: Never pay if letter received (P = false)**.  
    - Predictor knows this, so letter is sent only if **S = true** (to satisfy **S ≠ P**).  
    - If you have the secret (**S = true**), letter is sent, you don’t pay, and lose **L**.  
    - If no secret (**S = false**), no letter is sent.  
    - **Expected utility: –L × (probability of secret)**.

  **FDT’s Decision**:  
  - Compares the two policies.  
  - Assumes a low prior probability of having the secret (e.g., 1% chance).  
  - For Policy 2 (never pay) to be better:  
    `–L × (prob. secret) > –C × (prob. no secret)`  
    → **L × (prob. secret) < C × (prob. no secret)**.  
  - Since **L** is large (e.g., $1,000,000) and **C** is small (e.g., $1,000), and the probability of having the secret is low (e.g., 0.01), we get:  
    `$1,000,000 × 0.01 = $10,000` (loss if secret) vs. `$1,000 × 0.99 = $990` (loss if pay).  
    Here, $10,000 > $990, so Policy 1 (pay) *seems* better.  
  - But FDT accounts for the **predictor’s response to the policy**:  
    - If FDT commits to **Policy 2 (never pay)**, the blackmailer sends a letter *only if there is a secret*.  
    - If you’re confident you don’t have the secret (prob. ≈0), then:  
      - Policy 2: No letter is sent → payoff = 0.  
      - Policy 1: Letter sent (since **P = true** and **S = false**) → payoff = –C.  
    - **Thus, FDT chooses Policy 2 (never pay) to deter the letter entirely when no secret exists.**

  **Outcome for FDT**:  
  - By committing to not paying, FDT ensures the blackmailer sends a letter **only if a secret exists** (which is unlikely).  
  - If there’s no secret (typical case), no letter is sent → no payment, no loss.  
  - **Result: Extortion fails, FDT pays nothing and loses nothing.**

  ---

  ### Correcting Your Rough Sketch
  - You had the structure right: The letter is sent iff **S XOR P** (secret or paying-type, but not both).  
  - Where you got stuck: You focused on the *conditional* (if you pay, you likely have no secret), but FDT resolves this by optimizing the *policy upfront*. FDT doesn’t evaluate "what if I pay now?"—it asks, "what type of agent should I be to deter the letter?"  
  - Key insight: The blackmailer’s threat is only credible if you might pay. By committing to **never paying**, FDT makes the threat irrelevant when no secret exists.

  ---

  ### Why FDT "Resists Extortion"
  FDT agents resist extortion by adopting a policy that **deters the blackmailer from sending the letter** when no secret exists. By committing to not paying, they ensure the letter is sent only if they actually have a secret (a rare case), avoiding wasted payments in the common case. CDT, by contrast, pays "just in case," which the blackmailer exploits.

  **Summary: FDT agents resist extortion in XOR blackmail by committing to a strict policy of not paying, which deters the blackmailer from sending the letter when no secret exists, thereby avoiding any payment or loss.**
