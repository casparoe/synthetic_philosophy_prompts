  The core tension I see is between three fundamental demands: rationality (BI's optimality), robustness (to small uncertainties), and behavioral plausibility. These pull in different directions as shown in the centipede paradox where BI recommends immediate defection but humans cooperate for many rounds.

  For the variants: 
  The unknown length case breaks BI's induction base. 
  Random payoffs introduce probabilistic reasoning. 
  Committee play creates imperfect rationality. 
  Self-play challenges belief formation. 
  History injection adds learning dynamics.

  The key insight emerges in the joint unsatisfiability section: we can't have all of (A) rationality, (B) non-vacuousness, and (C) robustness to minor uncertainties simultaneously in centipede-like games. This triangulates the fundamental tradeoff.

  The most demanding criterion appears to be Robustness to Minor Uncertainties (D3) - it eliminates BI, SPNE, and challenges even refinements. Only tremble-based or bounded rationality models satisfy it, but at cost to other desiderata.

  For scorecards: 
