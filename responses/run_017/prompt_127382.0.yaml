prompt: |-
  You are a professional political philosopher with research expertise in the ethics of war, political obligation, and the morality of political membership. Please think carefully and map out the conceptual space before committing to a line: I want the structure of the argument, not a verdict, and I'd rather be told that a practice is a mess of bolted-together principles than be handed a tidy story. Concretely: first brainstorm the candidate theories, then test each against the details below, then tell me what the practice strictly needs versus what it merely sits well with. I don't want citations or suggestions for further reading — no sources, please; just the argument in roughly 900 to 1,200 words, under headings.

  I'm finishing a master's in public law in Helsinki and write an amateur blog on Finnish defence policy, and doing my own service (plus watching friends opt for civilian service instead) got me stuck on a bundle of things that modern states do which I can't fit into one picture. First, the state compels: Finland's Constitution provides for universal male conscription, the standard tours run 165, 255 or 347 days, women may volunteer (as they have been able to since 1995) but are not drafted, and civilian service is fixed at twelve months — longer than the shortest military tour, so that the conscientious objector isn't excused but re-assigned a differently shaped and heavier burden; refusing both routes means prison, commonly about 173 days with no parole. Second, the state forbids: Britain has had a statute since 1870 making it an offence for a British subject to enlist in the armed forces of a foreign state at war with a state Britain is at peace with, and the general pattern of restricting or punishing one's own citizens fighting for someone else is widespread, even where the cause is one the citizen sincerely believes is just and even where the citizen's own state never fires a shot. Third, the state recruits foreigners: France's Foreign Legion enlists non-citizens, lets a legionnaire apply for French nationality after three years' service, or immediately if he is wounded in the line of duty — the provision known as "Français par le sang versé" — and in current wars states openly advertise for foreign volunteers. So the very same act — going to fight, kill and risk death in someone's war — is a crime for the citizen who travels to do it, a route into membership for the foreigner who arrives to do it, and a jail-backed duty for the citizen who would rather not do it at all. My friend in civilian service put it to me like this: if the state really believed this was about defending persons in peril, it wouldn't care which flag you fought under; and if it's really about membership, then the Legion's rule looks like membership earned by spilling blood rather than a duty owed by members — which seems to invert the whole justification.

  Two further wrinkles, one real and one hypothetical, that I think should discriminate between the theories. The real one: reserve liability means the state keeps a dormant claim on the conscript's body and labour for decades after the tour ends, triggering it unilaterally and paying sub-market compensation, while employers are legally constrained in how they treat a reservist; and Sweden's nominally compulsory system, gender-neutral on paper since 2010 and reactivated in 2017, in practice calls up only a small fraction of the age cohort from a screened and largely self-selected pool. The hypothetical one: a working group here has floated letting a conscript discharge his obligation by funding a stipend for a trained volunteer — possibly a non-citizen recruited abroad — to take his slot, so that trained headcount stays constant while the personal duty is commuted into money; and a related proposal would attach the obligation to residence rather than citizenship, or express the state's claim as a defence levy payable in service, in cash, or in some mix.

  So here is what I'm asking for. Give me a menu of the theories this bundle could be resting on — something like a membership or co-authorship view, a state-as-agent-of-a-collective-self-defence view, a just-cause or cosmopolitan view, a statist view on which neutrality and the control of violence belong to the state, a fair-share or burden-distribution view, maybe a view on which universal liability is a hedge or a deterrent rather than a way of raising headcount — and for each say which limbs of the bundle it licenses, which it condemns as unjustified, and whether it makes the limbs cohere with one another or leaves them in tension. Be explicit about where the practice is underdetermined, i.e. where several incompatible theories would license exactly the same institutions, so that nothing about the surface of the law settles which theory is in play. Then take the commutation proposal and the residence-based proposal as probes: does the existing institution strictly presuppose that the duty is personal, in-kind and non-fungible, or is that merely a contingent fit, and would the proposals preserve or destroy whatever the institution is for — distinguishing, please, the rationale of maintaining trained numbers from the rationale of universal liability as a signal to potential aggressors? Finally, say what would actually have to change in law and in the institution's self-understanding if the implicit theory were replaced by a just-cause view on which only the justice of the war and individual liability matter, or by a pure fair-share view on which service is one burdensome input among others. If you think some limb of the bundle is simply unjustifiable on every theory you can construct, say that plainly rather than smoothing it over.
reasoning: |-
  Okay, let me approach this query methodically. The user presents a complex puzzle about state practices regarding military service - conscription, foreign enlistment bans, and foreign recruitment - that seem logically inconsistent. They want a structured analysis of possible underlying theories without resolution.

  First, I need to map the conceptual landscape. The key tension is how the same act (fighting in war) can be compulsory for citizens, forbidden for citizens fighting elsewhere, and rewarded for foreigners. The user also provides real-world examples (Finland's conscription, UK's foreign enlistment ban, French Foreign Legion) and two test cases (reserve liability and hypothetical commutation proposals).

  I consider several theoretical frameworks:
  - Membership theory (obligations tied to political community)
  - State monopoly on violence (Weberian statism)
  - Collective self-defense (state as protector)
  - Fair-share distribution (burden-sharing)
  - Deterrence rationale (universal liability as signal)
  - Cosmopolitan/just-cause view (individual moral judgment)

  For each theory, I examine:
  1. How it explains/justifies conscription
  2. How it handles foreign enlistment bans
  3. How it accommodates foreign recruitment
  4. Whether it creates coherence or tension
  5. How reserve liability and commutation proposals fit
  6. Where practices become theoretically underdetermined

  The membership view best explains the core tension - conscription as duty of membership, enlistment ban as loyalty expectation, Legion as path to membership. But it struggles with civilian service duration and shows tension in Sweden's selective implementation. The deterrence view interestingly makes universal liability matter more than actual service, which explains commutation proposals better.

  Key insights emerge:
  - No single theory cleanly explains all elements
  - Reserve liability and selective conscription create internal contradictions
  - The commutation proposal challenges whether personal service is essential
  - Switching to pure just-cause or fair-share views would require dismantling core institutions

  The analysis should highlight where practices are theoretically messy rather than force coherence. Notably, the foreign enlistment ban appears weakest across theories, while the Legion's blood-for-membership principle inverts membership logic.
answer: |-
  ## Conceptual Mapping: State Coercion, Forbiddance, and Recruitment in Military Service

  **Candidate Theories**

  1.  **Political Membership / Associative Obligation:** Obligations (including defense) arise intrinsically from membership in a specific political community. The state is the rightful agent of that community.
  2.  **State Monopoly on Legitimate Violence (Statist):** The state uniquely possesses the right to authorize and control organized violence within its territory and concerning its citizens/subjects. This is fundamental to sovereignty, order, and neutrality.
  3.  **Collective Self-Defense (Agentic):** The state acts as the necessary agent for the collective self-defense of its members against existential threats. Its primary duty is protection.
  4.  **Fair-Share / Burden Distribution:** The burdens of collective security must be distributed fairly among those who benefit. Conscription is a mechanism for achieving this fair burden-sharing when volunteers are insufficient.
  5.  **Universal Liability as Deterrence / Hedge:** Universal (or near-universal) liability for service serves primarily as a strategic signal of societal resolve to potential aggressors (deterrence) and ensures a deep, immediately mobilizable reserve (hedge against uncertainty), distinct from the immediate need for headcount.
  6.  **Just-Cause Cosmopolitanism:** The moral permissibility and obligation to fight depend solely on the justice of the cause and individual moral agency/responsibility, transcending state boundaries. States are not privileged actors.

  **Testing Theories Against the Bundle**

  1.  **Political Membership:**
      *   **Licenses:** Universal male conscription (membership duty), reserve liability (ongoing membership obligation), foreign enlistment ban (disloyalty to community), Foreign Legion pathway to citizenship (service as supreme proof of commitment *earning* membership).
      *   **Condemns/In Tension:** Longer civilian service (penalizes conscience, inconsistent with equal burden of membership duty?), female non-conscription (undermines universality of membership obligation). Sweden's selective practice weakens the "universal membership duty" signal. Commutation proposal severs duty from personal participation, undermining the membership ritual. Residence-based obligation attacks citizenship as the core of membership.
      *   **Coherence/Tension:** Explains core tension (duty, ban, earned membership) *if* membership duty is paramount. Tension arises with conscientious objection (is dissent compatible?) and gender asymmetry. The Legion's "blood for membership" *inverts* the logic (duty flows *from* membership, not creates it), creating a significant tension unless membership is seen as mutable through extreme sacrifice.

  2.  **State Monopoly on Legitimate Violence:**
      *   **Licenses:** Conscription (state asserting control over *its* citizens' violence), foreign enlistment ban (state preventing citizens from engaging in violence outside its control, potentially endangering neutrality/peace), reservist constraints (state maintaining control over potential future force).
      *   **Condemns/In Tension:** Foreign Legion recruitment (state *itself* employing non-citizen violence – but arguably still *under state control*). Cosmopolitan fighting for just causes elsewhere (challenges state's exclusive moral authority over violence).
      *   **Coherence/Tension:** Provides a strong, consistent rationale for forbidding citizen fighting elsewhere and compelling citizen service. Coheres well with reserve liability as perpetual state control. Explains why the state cares *which flag* – it's about *control*, not (only) peril or membership. Underdetermines the *form* of compulsion (why conscription vs. professional army?) and struggles slightly with actively recruiting foreign fighters under its *own* banner, though control mitigates this.

  3.  **Collective Self-Defense (Agentic):**
      *   **Licenses:** Conscription (necessary means for defense), reserve liability (preparedness for future defense), possibly recruiting foreigners to bolster defense capacity.
      *   **Condemns/In Tension:** Foreign enlistment ban (if citizen fights a genuine aggressor elsewhere, why prevent it? Especially if home state isn't fighting). Longer civilian service (arbitrary penalty if defense is the goal). Cosmopolitan fighting just wars elsewhere might be seen as permissible or even laudable.
      *   **Coherence/Tension:** Directly justifies conscription and reserves. Creates *major* tension with foreign enlistment bans: If defense of persons/peril is paramount, why constrain citizens defending others? Why care about the flag? The ban appears purely statist or membership-based, conflicting with this rationale. Sweden's selectivity is pragmatic for defense, not a fundamental challenge.

  4.  **Fair-Share / Burden Distribution:**
      *   **Licenses:** Conscription as a last-resort mechanism for fairness when volunteering fails, *potentially* commutation (allowing monetary contribution as alternative burden), *potentially* residence-based obligation (if residents benefit, they should share burdens).
      *   **Condemns/In Tension:** Longer civilian service (explicitly unfair penalty), female non-conscription (unless justified by other factors, violates universality of burden), foreign enlistment ban (unrelated to sharing home-state burdens), Foreign Legion (gives foreigners preferential burden *and* membership path – unfair to citizens?).
      *   **Coherence/Tension:** Explains the *impulse* behind universal liability but clashes violently with actual asymmetries (gender, civilian service duration). Reserve liability is coherent if seen as a distributed, latent burden. Sweden's selectivity fundamentally violates strict fair-share, prioritizing efficiency. Commutation fits naturally; residence-based fits if benefit defines burden-sharing group. The ban and Legion recruitment seem entirely unjustified on this view.

  5.  **Universal Liability as Deterrence / Hedge:**
      *   **Licenses:** Universal *liability* on paper (Finland's constitution, Sweden's nominal system), reserve liability (deep reserve = stronger deterrent/hedge), *potentially* selective actual call-up (Sweden – efficiency while maintaining liability pool). Commutation *could* work if monetary contribution funds the *effective* deterrent force (trained volunteers) without reducing the *liability* signal's breadth.
      *   **Condemns/In Tension:** Longer civilian service (weakens deterrent signal by penalizing conscience? Or strengthens it by showing no easy outs?), foreign enlistment ban (irrelevant to home-state deterrent), Foreign Legion (bolsters force but doesn't signal broad societal liability). Gender asymmetry (weakens universality of the deterrent signal?).
      *   **Coherence/Tension:** Focuses on the *existence* of liability, not universal *service*. Explains Sweden's model perfectly. Makes reserve liability core, not ancillary. Commutation preserves deterrent if liability remains universal and funds enhance capability. Underdetermines the form of service (military/civilian) and struggles to explain the *ban* or *Legion* except as unrelated capability tools. The "universal" signal is diluted by exemptions and gender asymmetry.

  6.  **Just-Cause Cosmopolitanism:**
      *   **Licenses:** Citizen fighting for a just cause abroad (moral obligation/praiseworthy), Foreign Legion if fighting justly (meritorious path).
      *   **Condemns/In Tension:** Conscription (coerces individuals, may force unjust participation), foreign enlistment ban (immorally prevents fulfilling duty), reserve liability (perpetual coercion), longer civilian service (punishes conscience), non-volunteerism for women (avoids coercion but accepts unequal burden-sharing). Commutation reduces personal involvement in potential killing – potentially positive.
      *   **Coherence/Tension:** Directly condemns most state practices as violating individual moral judgment. Only aligns with volunteering for just causes, anywhere. Utterly incompatible with the core bundle of compulsion, forbiddance (of morally permissible acts), and reserve systems. Makes state membership largely irrelevant to the duty to fight.

  **Probing with Commutation and Residence**

  1.  **Commutation (Pay for Replacement):**
      *   **What it Challenges:** The idea that the duty is *strictly personal and non-fungible*.
      *   **Compatibility:**
          *   *Maintaining Trained Headcount:* Preserved if the stipend ensures a trained volunteer fills the slot. The rationale is satisfied.
          *   *Universal Liability as Deterrence:* **Crucially:** This depends on whether *liability* remains universal. If commutation is an *option available to all* who are liable, and liability itself isn't removed, the deterrent signal of broad societal liability *might* be preserved ("Everyone *must* contribute significantly, either in person or in resources"). If commutation erodes the *perception* of universal readiness, it weakens deterrence.
          *   *Membership Duty:* Severely undermines the idea of a *personal sacrificial duty* inherent in membership. Turns obligation into a tax.
          *   *Fair-Share:* Compatible if monetary contribution is deemed an equivalent burden.
          *   *Statist/Collective Defense:* Compatible if defense capability is maintained.
      *   **Conclusion:** Commutation destroys the *personal, in-kind* aspect central to Membership and the ritual of shared sacrifice. It *preserves* the capability rationale and *can potentially preserve* the deterrent rationale if universal *liability* and significant contribution (monetary or service) are maintained. It aligns with Fair-Share and is agnostic for Statist/Collective Defense if capability is upheld.

  2.  **Residence-Based Obligation:**
      *   **What it Challenges:** Citizenship as the sole or primary source of defense obligation.
      *   **Compatibility:**
          *   *Membership:* Directly attacks it, replacing citizenship with residence/benefit as the basis of duty. Inverts the Legion logic – obligation precedes potential membership.
          *   *Fair-Share:* Highly compatible – obligation flows from benefiting from the state's security.
          *   *Collective Self-Defense:* Compatible – defends the community of residents.
          *   *Statist Monopoly:* Compatible – state asserts control over residents within its territory.
          *   *Deterrence:* Compatible if liability is broad based on residence. May even strengthen signal if more are liable.
          *   *Just-Cause:* Irrelevant to state-based obligation.
      *   **Conclusion:** Residence-based obligation fundamentally destroys the *citizenship-based* Membership view. It coheres well with Fair-Share, Collective Defense (of residents), Statist Control, and Deterrence (if liability pool expands). It represents a shift from political identity to territorial benefit as the source of obligation.

  **Changing the Implicit Theory: Consequences**

  1.  **Adopting a Pure Just-Cause Cosmopolitan View:**
      *   **Required Changes:** Abolish conscription and reserve liability. Repeal foreign enlistment bans. Decriminalize/recognize fighting for just causes abroad. Civilian service becomes purely voluntary or abolished. The Foreign Legion could remain, but solely as a voluntary force for just causes (losing its citizenship-fast-track meaning). National defense relies entirely on volunteers motivated by the justice of *this* state's cause. The state loses its privileged position in authorizing violence for its citizens.
      *   **Effect:** Destroys the existing bundle. Defense becomes a matter of individual moral choice, not state compulsion or prohibition based on loyalty/control.

  2.  **Adopting a Pure Fair-Share View:**
      *   **Required Changes:** Equalize burdens immediately: conscript women or abolish male conscription. Equalize military and civilian service duration/cost. Abolish or radically reform reserve liability to be fair and non-coercive (e.g., highly compensated, limited duration). Repeal foreign enlistment bans (unrelated to burden-sharing). The Foreign Legion becomes harder to justify unless citizens also have easy buy-out options; citizenship path based solely on service appears as unfair preferential treatment. Commutation becomes a central, legitimate mechanism. Residence-based obligation becomes a logical extension. Sweden's selectivity must be justified on strict burden-sharing grounds (e.g., only those with minimal opportunity cost) or abandoned for universality/commutation.
      *   **Effect:** Retains compulsion but radically reshapes it around equity and fungibility. Severs the link between military service and deep notions of political membership or loyalty. The bundle becomes more internally consistent but loses its statist and membership-based justifications for the ban and the Legion's symbolic meaning. Deterrence based on universal *liability* weakens if commutation is widespread and service becomes less universal.

  **The Indefensible Limb?**

  The **foreign enlistment ban** emerges as the most difficult to justify coherently across the spectrum, *except* on the pure **Statist Monopoly** or **Political Membership** views.
  *   *Collective Self-Defense* and *Just-Cause* views actively condemn it if the cause is just.
  *   *Fair-Share* and *Deterrence* views find it irrelevant or unjustified.
  *   Only by prioritizing the state's control over its citizens' actions (Statist) or demanding exclusive loyalty (Membership) does the ban find strong footing. Even then, its application against citizens fighting *just* causes elsewhere remains morally contentious. This limb appears primarily rooted in sovereignty and control imperatives, often in tension with other values like individual conscience or cosmopolitan justice, and weakly justified by the other rationales in the bundle.
