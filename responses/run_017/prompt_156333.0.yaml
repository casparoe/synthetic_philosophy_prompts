prompt: |-
  I am the honorary secretary of a national voluntary federation — a membership body of roughly four thousand individuals and affiliated branches, governed by a set of Rules running to some forty clauses. Clause 38 is our amendment rule: the Rules may be amended by a two-thirds majority at a general meeting, provided six weeks' notice has been given. Clause 38 says nothing about its own amendment, so on its face the rule that governs amendment can itself be amended by the ordinary amending procedure.

  Over the past year a few members have noticed this, and four motions have been tabled for the annual general meeting in six weeks. My committee must circulate a report with a recommendation on each motion three weeks from now, and I have to draft it. The federation has no paid staff and no standing legal adviser beyond a solicitor we instruct occasionally; her summary, which you should take as given rather than relitigate, is that the Rules are a contract among the members, that a majority acting by the required procedure can in principle change any clause including an entrenchment (because it can always repeal the entrenchment first), but that a clause purporting to restrict amendment may still be given effect as a rule about what counts as a validly made amendment, so that a purported change made without following it can be challenged as ineffective. She added that she would not expect any drafting of ours to bind a determined future majority indefinitely, and that in practice what such clauses do is shape what has to be argued for and in how many steps.

  The motions:

  A. Add to our membership-and-equal-vote clause the sentence "This clause may not be amended or repealed."

  B. Amend Clause 38 so that Clause 38 itself may be amended only by a two-thirds majority at each of two consecutive general meetings, all other clauses remaining amendable at a single meeting.

  C. Add a continuity condition: no amendment may repeal the amendment rule, or leave the Federation with no rule under which the Rules can be amended.

  D. Add a restatement power: the Committee may from time to time issue an authoritative restatement of the Rules which shall have effect as the Rules, and a restatement is not an amendment. The proposer notes that we already publish consolidated versions after each AGM and that several clauses are, in his word, ripe for modernisation; he argues that supporters of A need D, since without it entrenchment is empty.

  My committee is split roughly evenly between those who think A is worthless window dressing and those who think it is cheap and can do no harm. I suspect both camps are asking the wrong question, and I want the report to ask the right one.

  Please draft the committee's report as a memo I could put in front of the meeting: a recommendation on each motion — approve, reject, or approve in a redrafted form — with the reasoning a member could actually respond to, including an honest treatment of the strongest consideration on the side you are rejecting. Where you think none of the four does the job, draft the clause you would put in its place. In the course of that, I want you to sort out what these devices can and cannot do: whether entrenchment achieves anything beyond making a change take two visible steps rather than one; whether a limit on the amending power can be justified as a limit on a delegated power, so that some changes — dissolving the federation, converting it into a company, handing amendment to a three-person committee — are not amendments of the Rules at all but something else, and what our Rules should say about that case since they currently say nothing; whether the continuity condition in C is simply the mirror image of A and equally empty, given that locking in amendability is itself a substantive choice in favour of the status quo; and whether D, whatever its drafting, lets the Committee reach Clause 38 itself, and what — if anything — distinguishes a restatement from an amendment once a body has the power to declare which is which. I would also like you to consider, and if you favour it to draft, an alternative to entrenchment that works by an asymmetric default rather than a prohibition: the protected clause can be changed, but only by a heavier and more deliberate procedure than an ordinary amendment, perhaps with a periodic automatic reconsideration so that protection has to be renewed rather than defended.

  Please do not cite cases, statutes or literature; we have no law library and I need reasoning I can defend from the floor of the meeting, not authorities I cannot check. Close the memo with a short note on how confident you are in each recommendation, marking the points where your reasoning rests on a contestable assumption about self-referential rules or about how clauses like these operate in practice, as opposed to something I have given you. And if my framing is muddled — if the real question is not what the Rules should say but what we or a future chair will treat as validly made, or if the distinction between amendment and restatement cannot be made to hold, or if some part of what I have asked for simply cannot be done — say so plainly and tell me what we should decide instead, rather than producing a document that answers politely and helps no one.
reasoning: |-
  Okay, let's tackle this complex rule amendment issue for the federation. The user is honorary secretary of a 4,000-member organization facing four proposed rule changes about amending their governing document. Their solicitor has provided key principles: rules are a member contract, majorities can change any clause, but procedural restrictions can invalidate non-compliant amendments.

  The core problem is self-referential rules - can Clause 38 (the amendment clause) be used to change itself? The user wants practical advice, not legal theory. They need to draft committee recommendations that members can understand and debate.

  Looking at Motion A (entrenching membership/voting rights): This creates a false sense of security. Future members could still repeal the entrenchment clause first, then change voting rights. It just adds an extra step. Recommendation would be to reject it as ineffective.

  For Motion B (self-entrenching amendment rule): Similar issue - a determined majority could change Clause 38 at one meeting to remove the two-meeting requirement, then change whatever they want at the next. Also recommend rejection.

  Motion C (continuity requirement): This seems wiser - ensures there's always an amendment mechanism. But it doesn't actually prevent removing the amendment rule entirely if replaced by another method. Still, it's a sensible safeguard worth supporting.

  Motion D (committee restatement power): Dangerous proposal. Calling something "not an amendment" doesn't change its substantive effect. This could let the committee rewrite core rules without member approval. Strong recommendation to reject.

  The user's deeper concern is about foundational changes like dissolution. The rules should clarify that such actions require a special "constitutional decision" distinct from routine amendments. I'd draft alternative language requiring higher majorities and separate votes for fundamental changes.

  For protected clauses, suggest an asymmetric approach: changing them requires higher approval thresholds than regular amendments, plus mandatory review every 5 years to prevent permanent entrenchment.

  Confidence levels vary - high certainty on rejecting A/B/D, moderate on C and the alternatives. Key assumptions: that determined majorities can always work around restrictions through sequential steps, and that labeling doesn't override substance.

  The memo should be blunt: entrenchment clauses are largely theatrical. Real protection comes from either making changes politically difficult (through higher thresholds) or building organizational culture that respects certain principles. The committee should focus on practical safeguards rather than unenforceable prohibitions.
answer: |-
  **MEMORANDUM: COMMITTEE RECOMMENDATIONS ON RULE AMENDMENT MOTIONS**  
  **To:** All Members  
  **From:** The Governing Committee  
  **Date:** [Current Date]  
  **Subject:** Recommendations on Motions A, B, C, D for the Annual General Meeting  

  ---

  ### **Introduction**  
  This report addresses the four motions proposing amendments to Clause 38 (Amendment Rule) of our Federation’s Rules. Our recommendations balance legal practicality, procedural integrity, and the long-term stability of the Federation. We have focused on what these proposals *can realistically achieve*, noting that no rule can permanently bind a future majority determined to change the Rules. The aim is to ensure amendments are made transparently and deliberately, not to create unbreakable barriers.  

  ---

  ### **Recommendations & Reasoning**  

  #### **Motion A: Entrench Membership-and-Equal-Vote Clause**  
  *Proposal:* Add "This clause may not be amended or repealed."  
  **Recommendation: REJECT**  
  **Reasoning:**  
  - **Why it fails:** A future majority can bypass this by first amending *Clause 38 itself* (to remove entrenchment requirements) and *then* amending the membership clause. The solicitor correctly notes that entrenchment only adds steps; it cannot create absolute permanence.  
  - **Practical effect:** It signals strong support for the clause but risks creating false security. If challenged, a court might invalidate an amendment violating this clause *only if* the proper procedure wasn’t followed. However, a majority following Clause 38 correctly could still dismantle it.  
  - **Strongest counterargument:** It is "cheap and harmless" symbolism. However, it risks member confusion by implying unbreakable protection where none exists.  

  ---

  #### **Motion B: Self-Entrench Clause 38**  
  *Proposal:* Amend Clause 38 to require two consecutive two-thirds votes for its own amendment.  
  **Recommendation: REJECT**  
  **Reasoning:**  
  - **Why it fails:** This suffers the same flaw as Motion A. A future majority could use the *current* Clause 38 (before this change takes effect) to remove the two-meeting requirement in one step. Even if adopted, a determined majority could amend Clause 38 *once* to delete the new requirement, then make further changes freely.  
  - **Practical effect:** Adds delay but no true constraint. It complicates urgent fixes to the amendment process itself.  
  - **Strongest counterargument:** It makes amending Clause 38 more deliberate. True, but it remains vulnerable to repeal in one meeting if a majority plans sequentially.  

  ---

  #### **Motion C: Continuity Condition**  
  *Proposal:* Add that no amendment may repeal Clause 38 or leave the Federation without an amendment rule.  
  **Recommendation: APPROVE**  
  **Reasoning:**  
  - **Why it works:** This ensures the Federation always has *some* clear process for future amendments. It prevents accidental or rash abolition of the amendment mechanism.  
  - **Practical effect:** Unlike entrenchment, this does not try to protect specific clauses. Instead, it safeguards the *ability to evolve* the Rules. A future majority could still replace Clause 38 with a *new* amendment rule (e.g., requiring 90% approval), satisfying the continuity condition.  
  - **Strongest counterargument:** "Locking in amendability favors the status quo." However, this protects *procedural democracy*, not substantive outcomes. Without an amendment rule, the Federation risks paralysis or disputes over validity.  

  ---

  #### **Motion D: Committee Restatement Power**  
  *Proposal:* Let the Committee issue "restatements" that take effect as the Rules, without member vote.  
  **Recommendation: REJECT**  
  **Reasoning:**  
  - **Why it fails:** A "restatement" that changes substance *is an amendment in practice*, regardless of labels. Granting this power effectively lets the Committee rewrite any rule, including Clause 38, without member oversight. The proposer notes this could modernize outdated clauses, but that is precisely why amendments exist—to ensure members consent to changes.  
  - **Practical effect:** Undermines member sovereignty. Even with good intentions, this risks centralizing power and inviting disputes over whether a "restatement" crossed into amendment territory.  
  - **Strongest counterargument:** "It aids efficiency and modernization." True, but efficiency cannot override democratic control. If clauses need updating, propose amendments.  

  ---

  ### **The Committee’s Proposed Alternative: Asymmetric Protection**  
  Since Motions A and B are ineffective and D is unsafe, the Committee proposes a new clause for consideration. This addresses your query about an "asymmetric default" for key clauses:  

  > **Proposed Clause 39: Protected Clauses**  
  > (a) The following clauses are designated "Protected Clauses":  
  > &nbsp;&nbsp;&nbsp;&nbsp;(i) Clause [Membership-and-Equal-Vote Clause]  
  > &nbsp;&nbsp;&nbsp;&nbsp;(ii) Clause 38 (Amendment Rule)  
  > (b) A Protected Clause may only be amended or repealed by:  
  > &nbsp;&nbsp;&nbsp;&nbsp;(i) A three-quarters majority vote at a General Meeting; *and*  
  > &nbsp;&nbsp;&nbsp;&nbsp;(ii) A simple majority vote at a second General Meeting held no sooner than 3 months later.  
  > (c) This designation expires 5 years after adoption. To remain protected, the clause must be redesignated by ordinary amendment (two-thirds majority).  

  **Why this works better than entrenchment:**  
  - **Realism:** Accepts that future majorities can change anything but forces deliberation.  
  - **Asymmetry:** Makes protected clauses *harder* (but not impossible) to change via higher thresholds, cooling-off periods, and mandatory reconsideration.  
  - **Sunset clause:** Prevents permanent entrenchment. If support for protection fades, it lapses.  
  - **Clarity:** Explicitly lists protected clauses and the heavier procedure.  

  ---

  ### **Critical Unaddressed Issue: What Is an "Amendment"?**  
  Our Rules currently treat all changes as "amendments," but some actions (e.g., dissolving the Federation, converting to a company) are *constitutional transformations* beyond routine updates. We recommend adding:  

  > **Clause 38(2):** Notwithstanding the above, the following require a four-fifths majority at a General Meeting specifically advertised for this purpose:  
  > (a) Dissolving the Federation;  
  > (b) Altering its fundamental charitable purpose;  
  > (c) Converting the Federation into a corporate entity.  

  **Why this is needed:** It distinguishes *governance adjustments* from *existential decisions*, ensuring high consensus for transformative acts.  

  ---

  ### **Closing Note: Confidence & Assumptions**  
  | **Motion** | **Confidence** | **Key Assumptions** |  
  |------------|----------------|---------------------|  
  | **A (Reject)** | High | Future majorities can *always* remove entrenchment by amending the amendment rule first. |  
  | **B (Reject)** | High | Self-referential rules are vulnerable to step-by-step repeal. |  
  | **C (Approve)** | Moderate | Courts will enforce continuity conditions as procedural guardrails (per solicitor’s view). |  
  | **D (Reject)** | High | "Restatements" that alter substance are de facto amendments; labels don’t override effect. |  
  | **Proposed Asymmetric Clause** | Moderate | Higher barriers + sunset clauses create practical durability without illusions of permanence. |  
  | **Clause 38(2) Addition** | High | Fundamental changes warrant distinct treatment; this is workable and prudent. |  

  **Your core insight was correct:** The real question is not whether rules can be made unchangeable (they cannot), but how to structure amendment procedures so changes reflect sustained member consensus. Entrenchment (A/B) is largely theatrical; continuity (C) and asymmetric hurdles (our proposal) offer tangible safeguards.  

  **Final Advice:** Recommend **approving Motion C** and **adopting our proposed Clause 39 and Clause 38(2)**. Reject A, B, and D. This ensures:  
  1. The Federation always has an amendment rule (C).  
  2. Key clauses require supermajorities + time delays (Asymmetric Clause 39).  
  3. Existential changes face extreme scrutiny (Clause 38(2)).  
  4. No illusion of inviolability—protection requires renewal.  

  This approach prioritizes *practical legitimacy* over unenforceable prohibitions.  

  ---  
  **Submitted by:** [Your Name], Honorary Secretary  
  **Endorsed by:** The Governing Committee
