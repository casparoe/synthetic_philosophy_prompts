  - 10 min: Round 1 scoring and reset for round 2.
  - 10 min: Round 2 (same as round 1 but with fixed TL=1, and only 5 turns? to save time). Or we can do 10 turns again but faster? But 50 min for two rounds? We might not have time.

  Alternative: run round 1 for 5 turns, then round 2 for 5 turns? But 5 turns might not be enough.

  Or we run one round and then for round 2, we change the parameter and run a few turns? But that might not show the difference.

  Given time, we might run only one round, and then discuss round 2 as a thought experiment? But the request was for a runnable game with two rounds.

