  - Per TL at the end: 20 points
  - No points for kills.

  Then the only reason to attack is to eliminate a potential threat. But if you are not threatened, you don't attack. However, if you detect someone, you don't know if they are a threat. And if they might become a threat by researching, then you have an incentive to attack preemptively.

