  - Round 1: 5 turns (25 min)
  - Round 2: 5 turns (25 min) with the changed parameter (TL fixed at 1)

  Then 10 min debrief.

  Total: 10 setup + 25 + 25 + 10 = 70 min, plus transition.

  But 5 turns might be enough to see the dynamics.

  Rules for Round 2:
  - TL is fixed at 1 for all players. They cannot research (remove the research action).
  - Detection radius = 1.
