  - The vastness of space: we have a small grid, so civilizations are close. In reality, the distances are huge, and detection might be rare. But the fear is still there.
  - We have to state that in reality, the chain of suspicion applies even if the probability of detection is low, because the consequence is extinction.

  Predictable problems in the first run:
  - Players might not understand the rules and make mistakes.
  - Some might broadcast early, get destroyed, and then be bored.
  - The game master might be overwhelmed with the detection calculations.
  - Players might form alliances outside the game (by talking) even though the game is simultaneous secret actions? We have to enforce that they only communicate through the game mechanisms (broadcast messages) and not talk to each other during the turns.

  To address:
  - Have a clear rule sheet.
  - Have TAs to help with calculations.
  - For the detection, we can pre-calculate a table of all pairwise distances and then each turn, for each player, we can quickly look up which other players are within their TL (using the distance table). Then we can note new detections.
  - Enforce no talking between players except through the broadcast mechanism.

  Revised Timeline:

  Total: 80 minutes.

  - 10 min: Setup and rules explanation.
  - 50 min: 10 turns, each 5 min. 
     - Each turn: 
          1 min: players decide and submit actions.
          3 min: game master resolves and distributes information.
