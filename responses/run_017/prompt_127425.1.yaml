  - In round 2, without tech explosion, were players more willing to communicate? Did they strike less?
  - Map to the axioms and chain of suspicion.
  - Note: in the game, we didn't have expansion, so we only modeled the security dilemma part. In reality, expansion adds competition for resources.
  - The game can't reproduce the vastness and the low probability of detection, but the logic is the same: if detection is possible, then preemption is rational.

  Honesty:
  - The dark forest is often framed as a game-theoretic result, but in the books, it's also tied to the idea of "cosmic sociology". Our game focuses on the game-theoretic aspect.
  - The premise: the structural ratios (detection range vs. attack speed, and tech explosion risk) are doing the work. But in the game, we also have the scoring that rewards kills, which might be seen as an assumption of aggressiveness. But we tried to make survival the primary goal, and kills as a secondary bonus. We hope that the fear of being killed first drives the strikes.

  Alternative scoring to reduce aggressiveness: 
