answer: |-
  Below is the quiz designed to sort engineers into distinct positions on the nature of intelligence, based on concrete cases. The quiz avoids abstract philosophy and focuses on your specified distinctions: (a) general capacity vs. independent bundles, (b) system boundary (weights vs. full harness), (c) transfer/robustness requirements, (d) internal processes vs. behavior, and (e) collective vs. individual intelligence. Each question presents a scenario with 2–3 answer options. The scoring key maps answer combinations to **6–8 named or unnamed "leaves"** (distinct positions), each with a brief note on its most awkward commitment. Finally, I note **indistinguishable leaf pairs** and **unoccupied answer combinations**, with reasons.

  ---

  ### **The Quiz: What Counts as Intelligent?**
  *Instructions: For each scenario, pick the answer that best reflects your view. There are no trick questions—go with your gut.*

  1. **Chess Engine**: A computer program is superhuman at chess but useless at everything else (e.g., can't play checkers or solve basic puzzles). Is it intelligent?  
     - A) Yes—it excels at a complex, human-like skill.  
     - B) No—intelligence requires broad abilities, not just one narrow task.  

  2. **Rewording Robustness**: An AI scores 90% on a benchmark test but drops to 20% when questions are reworded (same meaning, different phrasing). Does it understand the subject?  
     - A) Yes—the high score shows understanding; rewording is a technical flaw.  
     - B) No—real understanding shouldn’t break under simple rewording.  

  3. **Compute Overkill**: A system solves hard math problems only when given 10,000× more inference compute (e.g., brute-force search). Answers are correct but slow. Is it intelligent?  
     - A) Yes—correct answers matter, not speed or efficiency.  
     - B) No—intelligence requires efficiency; this is just brute force.  

  4. **Swarm Intelligence**: A swarm of simple agents (e.g., ants) collectively builds a bridge that no single agent could design alone. Is the swarm intelligent?  
     - A) Yes—the group achieves complex outcomes intelligently.  
     - B) No—intelligence requires individual capability; this is just emergent behavior.  

  5. **Human-in-the-Loop**: An AI appears mediocre alone but produces brilliant results when guided by an expert human in a tight feedback loop (e.g., iterative prompting). Where does the intelligence lie?  
     - A) In the AI—the human just unlocks its potential.  
     - B) In the human—the AI is just a tool.  
     - C) In the combined system—you can’t separate them.  

  6. **Slow Alien**: A hypothetical alien takes a month to answer any question but is always correct and insightful. We have no access to its internal processes. Is it intelligent?  
     - A) Yes—outcomes matter, not speed or internals.  
     - B) No—intelligence requires reasonable response times.  

  7. **Transfer Learning**: An AI trained on chemistry puzzles solves a novel physics puzzle (same reasoning type, different domain) without additional training. Does this show intelligence?  
     - A) Yes—it demonstrates adaptable, general reasoning.  
     - B) No—it’s just pattern matching; true intelligence needs explicit training.  

  8. **Modular System**: A system combines a neural net (handles language) and a rule-based module (handles math). Together, they solve word problems neither can solve alone. Which part is intelligent?  
     - A) The neural net—it does the core reasoning.  
     - B) The rule-based module—it handles precise logic.  
     - C) The whole system—intelligence is in the integration.  

  ---

  ### **Scoring Key: The Leaves of Intelligence**
  Based on your answers, you’ll land on one of 8 leaves. Each leaf represents a coherent position in the logical space defined by distinctions (a)–(e). **Leaves are named** if they align with established concepts; **unnamed** if not. Each includes:  
  - **Position**: Core stance.  
  - **Most awkward commitment**: The counterintuitive implication of this view.  

  | Leaf name             | Position                                                                 | Most awkward commitment                                                                 |
  |-----------------------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | 1. **Narrow Behaviorist**      | Intelligence is task-specific success; behavior is all that matters.     | Must accept the chess engine as intelligent but reject the swarm (even if it solves harder problems). |
  | 2. **Generalist**              | Intelligence requires broad, flexible capacities (rejects narrowness).   | Must reject the chess engine and any system that fails transfer learning, even if superhuman in one domain. |
  | 3. **Efficiency Fundamentalist** | Intelligence demands efficiency; correct but slow/brute-force solutions don’t count. | Must reject the slow alien and compute-overkill system, even with perfect accuracy. |
  | 4. **Robustness Essentialist** | Intelligence requires robustness (e.g., to rewording) and transfer.       | Must reject systems like the reworded-benchmark model, even if they ace standard tests. |
  | 5. **Harness Holist**          | Intelligence lies in the full system (tools, scaffolding, humans), not just the core model. | Must attribute intelligence to the human-in-the-loop system but not the raw AI alone. |
  | 6. **Collectivist**            | Intelligence can be a group property (swarms, human-AI teams).           | Must attribute intelligence to the swarm but deny it to individuals within it. |
  | 7. **Internalist**             | Intelligence requires unobservable internals (e.g., understanding, models). | Must reject the slow alien (no access to internals) even if it’s always right. |
  | 8. **Unnamed: Brute-Focus Pragmatist** | Intelligence is outcome-based; internals/efficiency don’t matter if results are perfect. | Must accept the compute-overkill system and slow alien, even if they seem "dumb" in process. |

  **How to score**:  
  - Tally your answers (e.g., 1B, 2A, 3B, 4B, 5A, 6B, 7A, 8C).  
  - Match to the leaf above using this mapping:  
    - **Narrow Behaviorist**: 1A, 2A, 3A, 4B, 5A, 6A, 7B, 8A/B.  
    - **Generalist**: 1B, 2B, 3A/B, 4A/B, 5A/B/C, 6A/B, 7A, 8A/B/C. *(Flexible on efficiency/collective but firm on generality)*  
    - **Efficiency Fundamentalist**: 1A/B, 2A/B, 3B, 4B, 5A/B, 6B, 7A/B, 8A/B.  
    - **Robustness Essentialist**: 1B, 2B, 3A/B, 4A/B, 5A/B/C, 6A/B, 7A, 8A/B/C. *(Overlaps with Generalist but prioritizes robustness)*  
    - **Harness Holist**: 1A/B, 2A/B, 3A/B, 4A, 5C, 6A, 7A/B, 8C.  
    - **Collectivist**: 1B, 2A/B, 3A/B, 4A, 5C, 6A, 7A/B, 8C.  
    - **Internalist**: 1A/B, 2B, 3A/B, 4B, 5A/B, 6B, 7A, 8A/B.  
    - **Brute-Focus Pragmatist**: 1A, 2A, 3A, 4A/B, 5A/C, 6A, 7B, 8A/B/C.  

  ---

  ### **Indistinguishable Leaf Pairs**
  Due to quiz design, some leaves share answer combinations on critical questions and can’t be separated. These reflect overlapping positions in the logical space:  
  - **Generalist vs. Robustness Essentialist**: Both reject narrow tasks (1B) and non-robust systems (2B), and require transfer (7A). They only diverge on efficiency (Q3) or collectivism (Q4/Q5), but the quiz doesn’t force this split.  
  - **Harness Holist vs. Collectivist**: Both attribute intelligence to systems (5C, 8C) and swarms (4A). They’re separated only if answers clash on robustness (Q2) or efficiency (Q3), but many engineers conflate "system" and "collective."  

  ---

  ### **Unoccupied Answer Combinations**
  Some answer combinations are unoccupied (no leaf maps to them). Based on the logical space, these are **incoherent or self-contradictory**:  
  1. **Combination**: 1A (chess engine intelligent) + 2B (reworded benchmark not intelligent) + 3B (compute-overkill not intelligent) + 4B (swarm not intelligent) + 5A (AI intelligent) + 6B (slow alien not intelligent) + 7B (transfer not intelligent) + 8A (neural net intelligent).  
     - **Why unoccupied?** Incoherent mix: Demands narrow task mastery (Q1A) but rejects systems that aren’t robust (Q2B) or efficient (Q3B/Q6B), which is inconsistent. You can’t require narrow excellence while also requiring generality-adjacent traits like efficiency.  

  2. **Combination**: 1B (chess engine not intelligent) + 2A (reworded benchmark intelligent) + 3A (compute-overkill intelligent) + 4A (swarm intelligent) + 5B (human intelligent) + 6A (slow alien intelligent) + 7B (transfer not intelligent) + 8B (rule-based module intelligent).  
     - **Why unoccupied?** Self-contradictory and unattractive: Attributes intelligence to the swarm (Q4A) and human (Q5B) but denies it to transfer learning (Q7B), implying collective systems are intelligent only if they’re human-centric. This arbitrarily elevates humans while downplaying adaptability, making it unstable.  

  ---

  ### **Design Notes**
  - **Logical space first**: Distinctions (a)–(e) define the axes. Leaves emerge from answer patterns, not preloaded "-isms."  
  - **Why engineers?**: Cases avoid philosophy jargon (e.g., "Turing test"). Questions test intuitions about shipping products (e.g., rewording fragility, compute costs).  
  - **Scoring nuance**: Some leaves share answers (e.g., Generalist/Robustness Essentialist), revealing where distinctions blur in practice. Unoccupied combinations highlight "impossible" views.  
  - **Use in standups**: Run the quiz anonymously. Map results to leaves to show team diversity. Discuss: "Why do we care if it’s ‘intelligent’? Does it change how we build?"  

  This sorts people by *applied intuitions*, not labels. The goal isn’t consensus but exposing assumptions—e.g., a Robustness Essentialist and Harness Holist might ship very different products.
