prompt: |-
  hey — I'm a backend enginer, doing a part-time MA in philosophy (long story, midlife thing), and I need to hand in a two-page prospectus for a ~8000-word dissertation I'd write over roughly eight months at about one evening a week. No citations please, I'll fill those in myself with my supervisor's help.

  Rough area: whether genuine moral dilemmas are possible — whether someone can be in a situation where every available option is one they shouldn't take. My half-formed idea comes from my day job: when a service ends up in a state where none of its possible outputs is correct, we still distinguish (a) hard-failing, (b) returning a best-effort value plus an error, and (c) leaving something behind so the damage can be repaired later — retries, compensating transactions, apologies to whoever got burned. I keep feeling that the dilemma debate runs together claims about what you should do with claims about what's left over afterwards, and that the only version of the argument worth having is about the leftovers.

  So here's the angle I want developed: split "moral residue" into (1) deliberative — you still have reasons to regret, to feel bad, to explain yourself; (2) justificatory — you owe something to someone, an apology or a repair; (3) evaluative — what you did was in some respect bad or wrong even though it was the thing to do. My suspicion is that (1) and (3) are cheap, in the sense that the anti-dilemma side can absorb them, while (2) is the one that might actually force you to admit a real dilemma — and that this in turn hinges on whether "ought" and "wrong" can come apart, i.e. whether you can be required to do something that is nonetheless wrong.

  Can you turn that into a prospectus? I need: a question stated precisely enough that it has a determinate answer; why the standard moves on both sides don't settle that specific question (the "ought implies can"-style arguments, the consistency/agglomeration arguments, appeals to residual guilt, the dirty-hands stuff); what I'd actually do month by month and why that method rather than just arguing about intuitions; what a successful result would look like and what would count as the project failing; and an honest verdict on whether this is too big or too small for 8000 words at one evening a week. If you think my three-way split is wrong, or that the interesting cut is somewhere else entirely, say so and reframe — I'd rather have a better question than my question.
