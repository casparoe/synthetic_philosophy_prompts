prompt: |-
  I teach a second-year seminar on formal systems and the limits of mechanism: eighteen students, one eighty-minute session, and a very uneven background — most have seen truth tables, two or three have done a little proof theory, and a handful have read popular accounts of Gödel and know roughly what the incompleteness theorem is supposed to show. I want one class activity whose point is the difference between working inside a formal system and reasoning about that system from outside.

  The system I have in mind is the MU-puzzle. The rules, for reference: the only symbols are M, I and U; the sole axiom is the string MI; and there are four rules — from any string ending in I you may append a U; from a string of the form Mx you may pass to Mxx; wherever a string contains III you may replace those three symbols with a single U; and wherever it contains UU you may delete that pair. The question is whether MU is a theorem. It is not, and the usual argument is that the number of I's in a theorem is never a multiple of three, since doubling and subtracting three cannot turn one into a multiple of three.

  I have run this before as a straight puzzle and it went badly in two ways. The strong students either had the answer already or brute-forced for ten minutes and then checked out, and in both runs one student produced the counting argument about fifteen minutes in and announced it to the room, which deflated everything — the puzzle became a fact to be told rather than something anyone had to do. So I want the activity structured so that the failure itself is the experience, and so that the student who sees the argument early has something to do with it other than spoil it.

  What I would like from you:

  A set of rules, roles, materials and a minute-by-minute timeline for the session, with no lecture up front and with the words invariant, metatheory, Gödel and incompleteness withheld until the debrief. Assume a whiteboard, index cards and no technology beyond a projector.

  A way of splitting the room so that the mechanical and the reflective attitudes are separated and then brought into contact: for instance one half permitted only to write strings on the board and the other permitted only to make and test conjectures about what can be written, with some controlled channel between them. Tell me what each half will actually discover and why the asymmetry generates the point rather than just slowing things down.

  A scoring or recording device — no real money — that makes the difference between my search has not terminated and no derivation exists visible in the students' own behaviour. My thought is a repeated credence report: at fixed intervals each student commits a stake of points to MU is derivable versus MU is not derivable, scored by a proper scoring rule, with a small prize. Design the scheme, say where the reports go in the timeline, tell me what the trajectory of the group's credences should look like if the activity works, and tell me how to keep it from being gamed by someone who knows the answer and bets hard on it immediately.

  A companion system, with the same surface look, whose job is to break the inference from failed search to impossibility. Either its target should be reachable but only by a derivation long enough that nobody finds it in the time available, or it should be unreachable for a reason that is not the count of I's — so that what generalises is the technique of finding a property preserved by every rule that the target lacks, and not this particular piece of arithmetic. Give me the companion system, tell me which of the two jobs you gave it and why, and tell me how to sequence the two so the second one lands as a correction rather than as a repetition.

  A debrief that maps specific moments in the activity onto specific parts of the idea: what it is to prove something in a system as opposed to about one; why the counting argument is not a fifth rule and not a longer derivation; what has to be true of a system for an outsider's argument about it to be possible at all.

  An honest account of what the activity cannot reproduce and that I will have to say myself. I am particularly worried about the bridge that the puzzle is usually used to build: in the MU case the impossibility is established by an argument the system itself cannot express, whereas what makes the incompleteness argument distinctive is that the undecidable sentence is, under a coding, a string of the system — the jump out of the system is brought back inside. I would like the debrief to set up that contrast rather than cement the lazy version of the analogy, and I would also like your view on whether running the activity at all makes the lazy version more likely.

  Finally, what will predictably go wrong: the student who already knows the answer, the student who thinks impossible just means we were not clever enough, the group that treats the invariant as one more move available inside the game, and the student who concludes that the session has refuted mechanism. For each, tell me how to handle it in the room.
reasoning: |-
  We are designing a class activity centered around the MU-puzzle to highlight the difference between working inside a formal system and reasoning about it from the outside. The goal is to structure the activity so that the failure to derive MU is an experience that leads to reflection, and to prevent early spoilers from ruining the experience. We also want to introduce a companion system to break the inference from failed search to impossibility.

  Below is a detailed plan for the session, including rules, roles, timeline, a scoring system, the companion system, debrief, and handling of potential issues.

  ### 1. Rules, Roles, Materials, and Timeline

  **Materials:**
  - Whiteboard (divided into two sections: one for "Derivers" and one for "Reasoners")
  - Index cards (two colors: one for Derivers, one for Reasoners; and a third color for communication between groups)
  - Projector (to display the rules and the scoring system)

  **Groups:**
  - Split the class into two groups:
    - **Derivers (9 students):** They can only apply the rules to generate new strings. They work at the whiteboard, writing down new theorems. They are not allowed to reason about why they are doing what they are doing or make conjectures about the system. They are given the rules and the axiom (MI). Their goal is to try to derive MU.
    - **Reasoners (9 students):** They are not allowed to write new strings. They observe the whiteboard and are given index cards to write down conjectures (about what might be derivable, what properties are preserved, etc.) and questions for the Derivers. They can also write down their own ideas about why MU might or might not be derivable. They can send questions to the Derivers via a designated channel (using a third color of index card) to ask for specific derivations (e.g., "Can you derive a string with no I's?"). However, they cannot suggest moves to the Derivers.

  **Rules of the MU-system (displayed on the projector):**
  1. **Axiom:** MI
  2. **Rule I:** If you have a string ending with I, you can add a U at the end. (Example: MI → MIU)
  3. **Rule II:** If you have a string of the form Mx, you can make it Mxx. (Example: MI → MII)
  4. **Rule III:** If you have three consecutive I's (III) in a string, you can replace them with a U. (Example: MIII → MU)
  5. **Rule IV:** If you have two consecutive U's (UU) in a string, you can delete them. (Example: MUUU → MU)

  **Timeline (80 minutes total):**

  - **0-5 min: Introduction and Group Formation**
    - Briefly introduce the activity as a puzzle to derive MU from MI using the rules. Do not use any advanced terminology.
    - Split the class into two groups (by counting off 1-2) and assign them to Derivers and Reasoners. Explain their roles clearly:
      - Derivers: They are the "doers". They can only write new strings by applying the rules to what is already on the board. They start with MI.
      - Reasoners: They are the "thinkers". They cannot write on the board but can write conjectures and questions on their index cards. They can send a limited number of questions to the Derivers (via the teacher) to request a derivation of a particular string or type of string (but not suggest moves). They can also write down their own thoughts about the system.
    - Set up the whiteboard: Left side for Derivers (with MI written at the top), right side for Reasoners (where they can post their index cards with conjectures and questions).

  - **5-30 min: First Round of Work (25 minutes)**
    - Derivers begin generating strings. They should work together, taking turns to apply rules. They must write down each new string and which rule they used (and from which string). They should aim to get as many different strings as possible and try to reach MU.
    - Reasoners observe and write down:
      - Patterns they notice (e.g., every string starts with M, the number of I's changes in certain ways).
      - Conjectures: e.g., "All theorems start with M", "The number of I's is always odd", etc.
      - Questions for Derivers: e.g., "Can you derive a string that ends with U?" or "Can you derive a string with exactly one I?" (The teacher acts as a filter: if a question is about a specific string, it is passed to the Derivers as a challenge to derive that string. The Derivers then try to derive it if they can. Limit: Reasoners can send one question every 5 minutes to avoid overload.)
    - At 15 minutes, pause for the first credence report (see scoring system below).

  - **30-35 min: First Credence Report and Midway Check (5 minutes)**
    - Each student (both groups) writes on an index card their current credence (a probability between 0 and 100) that MU is derivable. They also write a one-sentence reason.
    - Collect these and display the distribution (without reasons) on the projector (e.g., a histogram or just the average and range). Do not discuss yet.
    - Allow a quick sharing of one or two observations from each group without giving away any spoilers. For example, Derivers might say "We've generated 15 strings and none of them are MU", Reasoners might say "We noticed that every string starts with M".

  - **35-55 min: Second Round of Work (20 minutes)**
    - Continue as before. The Derivers might be generating longer strings. The Reasoners, having seen the distribution and the work so far, might start to form hypotheses about why MU is hard to get. They can send more questions to the Derivers to test their hypotheses.
    - At 45 minutes, pause for the second credence report (same procedure).

  - **55-60 min: Second Credence Report and Transition (5 minutes)**
    - Collect credence reports and display the new distribution. Note any shift.
    - Announce: "We are now going to try a similar puzzle with a slightly different set of rules." Introduce the companion system.

  - **60-75 min: Companion System (15 minutes)**
    - **Companion System (The MIA system):** 
      - Axiom: MI
      - Rules:
        1. Same as Rule I of MU: from xI, derive xIU.
        2. Same as Rule II: from Mx, derive Mxx.
        3. **Rule III (modified):** Replace III with U (same as before).
        4. **Rule IV (modified):** Delete UU (same as before).
        5. **New Rule V:** From any string, you can add II at the end. (This rule breaks the invariant we had in the MU system.)
      - **Target:** Derive MU.
    - The twist: In this system, MU *is* derivable, but the derivation is long and non-obvious. For example:
      - Start with MI.
      - Apply Rule II: MII.
      - Apply Rule II: MIIII.
      - Apply Rule III: Replace III with U -> MIU (but note: we have four I's, so we can replace the first three to get MIU, leaving one I; but then we have MIU, which does not have three I's). Alternatively, we might need to use Rule V to add II and then use Rule III.
      - Actually, a derivation of MU in this system might be:
          - MI (axiom)
          - Rule II: MII
          - Rule II: MIIII
          - Rule V: MIIIIII   (added II at the end)
          - Now we have six I's. We can break this into two groups of three and replace each with U? But note Rule III replaces a contiguous III. So we can do:
            - Replace the first III: from MIIIIII -> MUIII (because we replace the first three I's with U, leaving III)
            - Then replace the remaining III: MUIII -> MUU (by replacing III with U)
            - Then use Rule IV: MUU -> MU.
      - But note: the above derivation is not obvious and might not be found in 15 minutes. Alternatively, we can make the derivation even longer to ensure it's not found. For instance, require building up a long string and then using Rule III multiple times.

    - Why this companion system?
      - It breaks the inference from "we haven't found it" to "it's impossible" because it is possible, but the derivation is long and requires a strategy that might not be found in the time.
      - It also breaks the invariant of the number of I's mod 3: note that Rule V (adding II) changes the number of I's by 2, which can break the mod 3 invariant. In fact, in this system, we can achieve MU (which has 0 I's, and 0 mod 3 is 0) because we can get even numbers of I's and then use Rule III to reduce. The invariant of the original MU system (number of I's not divisible by 3) does not hold here because of Rule V.

    - Run the companion system with the same two groups. The Derivers now work on deriving MU in the MIA system. The Reasoners can again form conjectures and send questions. The goal is to see if they can derive MU.

  - **75-80 min: Wrap-up and Transition to Debrief (5 minutes)**
    - Stop the activity. If the Derivers haven't derived MU in the companion system, reveal that it is possible and show the derivation (or promise to post it later). Then, collect the credence reports for MU in the original system one last time? (Optional, if time allows, but we are short on time.)

  ### 2. Scoring System (Credence Reports)

  - **Setup:** At fixed intervals (15 min and 45 min in the original system, and optionally at the end for the original system) each student writes their credence (as a probability between 0 and 100) that MU is derivable in the current system (original or companion). They also write a brief reason (for the teacher's eyes only, to understand their thinking).
  - **Scoring Rule:** Use a quadratic scoring rule to encourage honesty. For a credence p (expressed as a fraction between 0 and 1) and outcome O (1 if derivable, 0 otherwise), the score is:
      - If derivable: Score = 1 - (1 - p)^2
      - If not derivable: Score = 1 - p^2
    However, note that we are using this for educational purposes and not for a real prize. We can simplify by assigning points and then giving a small prize (e.g., candy) to the top few students based on cumulative score. But the main purpose is to track the group's belief.
  - **Display:** After each report, show the distribution of credences (e.g., min, max, average, or a histogram) on the projector. This makes the group's changing beliefs visible.
  - **Preventing Gaming:** The student who knows the answer might bet hard immediately. To mitigate:
    - Do not reveal individual scores until the end. Only show the distribution without names.
    - Emphasize that the scoring rule rewards accuracy and that changing one's mind in light of new evidence is expected. Also, the companion system will challenge premature certainty.
    - The first report is at 15 minutes, which is early enough that even if a student knows the answer, they might not have had time to influence the group. The second report is at 45 minutes, by which time the group might have seen more evidence.

  **Expected Trajectory of Credences:**
  - At the first report (15 min): Most students will be optimistic (high credence, say 60-90%) because they haven't tried much and the puzzle seems open.
  - At the second report (45 min): After 30 minutes of work and no success, the credence should drop (maybe to 20-50%). The Reasoners might start to notice the pattern with the number of I's, but they haven't formalized it yet.
  - After the companion system, we don't take a report for the original system again, but the experience of the companion system (where MU is possible but hard) might make them less certain that the original has no derivation.

  ### 3. Companion System Details

  - **System Name:** MIA system (to distinguish from MU).
  - **Rules:** 
    1. From xI, derive xIU. (Same as Rule I of MU)
    2. From Mx, derive Mxx. (Same as Rule II)
    3. From ...III..., derive ...U... (Same as Rule III)
    4. From ...UU..., derive ...... (Same as Rule IV)
    5. From any string x, derive xII. (New rule: adding two I's at the end)
  - **Target:** MU (same as before)
  - **Why this system?** 
    - It breaks the invariant of the original MU system. In the original, the number of I's mod 3 is always 1 or 2 (starting from 1, and doubling and subtracting 3 preserve non-multiples of 3). But in MIA, Rule V (adding two I's) can change the residue mod 3 arbitrarily. For example, starting from 1 I (in MI), adding two I's gives 3 I's -> then we can replace with U to get 0 I's. So we can achieve 0 mod 3. In fact, we can derive MU as shown above.
    - However, the derivation is long enough that it might not be found in 15 minutes. The students might get stuck trying to apply the rules without the strategy of building up a multiple of 3 I's and then replacing with U's.

  **Sequencing:** 
  - We run the original MU system first, and then the companion system. The companion system is introduced after the students have struggled with the original and their credence has dropped. The point is to show that just because they didn't find a derivation doesn't mean it's impossible. This sets up the need for a proof (like the invariant) to establish impossibility.

  ### 4. Debrief (After the Activity)

  Structure the debrief to map specific moments to the concepts:

  1. **Inside vs Outside:** 
     - Ask the Derivers: "What were you doing?" (Applying rules step by step.) 
     - Ask the Reasoners: "What were you doing?" (Looking for patterns, trying to understand the whole system.)
     - Point: The Derivers were working *inside* the system (mechanically applying rules), while the Reasoners were working *outside* (observing the system and making conjectures).

  2. **The Invariant Argument:**
     - Ask: "In the original MU system, why couldn't we get MU?" 
     - Guide them to the invariant: The number of I's mod 3. Start with MI (1 I). Check each rule: 
       - Rule I: Appends U -> no change in I's.
       - Rule II: Doubles the I's -> if k I's becomes 2k mod 3. Doubling a number mod 3: 1->2, 2->1 (because 4 mod 3=1), 0->0. So it never produces 0 mod 3 from non-zero.
       - Rule III: Replaces III with U -> reduces I's by 3 -> mod 3 unchanged.
       - Rule IV: Deletes UU -> no change in I's.
     - So the number of I's mod 3 is always 1 or 2, never 0. But MU has 0 I's -> impossible.
     - Note: This argument is not a rule of the system. It is a proof *about* the system. It is not a longer derivation but a mathematical observation.

  3. **Companion System:**
     - Why was it possible to get MU in the companion system? Because we added a rule (Rule V) that changes the invariant. It adds two I's, which can change the mod 3 residue arbitrarily. So the invariant of the original system doesn't hold.

  4. **Broader Concepts:**
     - **Metatheory:** The reasoning about the system (like the invariant) is part of the metatheory.
     - **Gödel and Incompleteness:** 
       - In the MU puzzle, we have a statement (MU is a theorem) that we can prove false in the metatheory but that the system itself cannot prove (because the system only has the mechanical rules and cannot express the concept of mod 3). 
       - However, Gödel's incompleteness theorem is more subtle: it constructs a sentence in the system (via coding) that says "I am not provable". So the system cannot prove it (if consistent) and also cannot refute it (if consistent). The jump out of the system (to see that it is true) is done in the metatheory, but the sentence itself is inside the system.
     - Contrast: The MU puzzle shows unprovability by an external argument, but the unprovable sentence in Gödel's theorem is internal. The activity sets up the idea of external reasoning, and then the debrief can explain that Gödel's genius was to internalize that kind of reasoning.

  5. **Limitations of the Activity:**
     - The activity does not show how to internalize the metatheoretical reasoning. That is a key step in Gödel's proof (via Gödel numbering). We have to explain that in the incompleteness theorem, the system can encode statements about itself, so the undecidable sentence is a string in the system.

  ### 5. Handling Predictable Issues

  - **The student who already knows the answer:**
    - Assign them to the Reasoners group. Their job is to think about the system, but ask them to focus on the companion system when it comes. They might help the Reasoners form the invariant argument, but if they do it too early, remind them that the activity is about the process. In the credence reports, they might bet against derivability in the original system, but that's okay because the scoring rule will reward them and they are being honest. The companion system will challenge them because they might not know that one.

  - **The student who thinks "impossible just means we were not clever enough":**
    - The companion system is designed to address this. In the companion system, they will see that it is possible but hard. Then in the original, the invariant argument shows that it is truly impossible, not just hard.

  - **The group that treats the invariant as one more move inside the game:**
    - If a Deriver tries to write down the invariant on the board (as if it were a rule), remind them that they can only apply the four rules. If a Reasoner suggests using the invariant as a rule, explain that the invariant is not a rule but a property they observed. Emphasize in the debrief that the invariant is a metatheoretical tool.

  - **The student who concludes that the session has refuted mechanism:**
    - In the debrief, clarify that the activity shows the power of external reasoning. Mechanism (the idea that the mind is a formal system) is challenged by Gödel, but the activity does not refute mechanism. It only shows that for any fixed formal system, there are truths it cannot prove. But that does not necessarily mean the mind is not mechanical (it might use a non-algorithmic process, or it might be able to always move to a stronger system). This is a deep philosophical point that you can address briefly and then assign for further reading.

  ### Summary of the Activity Flow

  - Introduction and group formation (5 min)
  - First round of work on MU system (25 min) with a credence report at 15 min
  - Midway check and credence report display (5 min)
  - Second round of work on MU system (20 min) with a credence report at 45 min
  - Companion system introduction and work (15 min)
  - Wrap-up (5 min)
  - Debrief (to be done in the next session or if time allows, but 80 min is tight; alternatively, the debrief can be the next class)

  Note: The timeline is tight. If the activity runs over, you can cut the companion system time or move the debrief to the next meeting.

  This plan structures the activity to make the failure to derive MU a collective experience and then uses the companion system to challenge the inference from failure to impossibility. The debrief then connects to the key concepts and sets up the subtleties of Gödel's theorem.
answer: |-
  Below is a comprehensive plan for your 80-minute session, designed to create an experiential understanding of the inside/outside distinction through structured failure. The activity uses the MU-puzzle as the core system and introduces a carefully crafted companion system to disrupt premature conclusions. Roles, scoring, and sequencing are engineered to make the metatheoretical jump visible without explicit terminology until debrief.

  ---

  ### **Rules, Roles, Materials, and Timeline**  
  **Materials:**  
  - **Whiteboard** (divided into two sections: "Derivation Space" and "Observation Space").  
  - **Index cards** (three colors: **blue** for Derivers, **yellow** for Reasoners, **red** for cross-group communication).  
  - **Projector** (to display rules and scoring updates).  

  **Groups & Roles:**  
  - **Derivers (9 students):**  
    - **Task:** Generate strings *only* by applying the four MU-rules to existing strings. Start from MI.  
    - **Rules:** May only write new strings in the "Derivation Space" using the four MU-rules. Cannot discuss strategies or properties.  
    - **Materials:** Blue index cards to write new strings (one per card) and pin them to the board.  

  - **Reasoners (9 students):**  
    - **Task:** Observe the board, formulate conjectures about *what can/cannot be derived*, and test hypotheses.  
    - **Rules:** May not write strings. Use yellow cards to post:  
      - Conjectures (e.g., "No theorem starts with U").  
      - Testable predictions (e.g., "Can we get a string with 0 I’s?").  
      - Requests for Derivers (via red cards, e.g., "Try to derive a string ending in U").  
    - **Materials:** Yellow cards for conjectures, red cards for requests (max 1 request/5 mins to avoid spam).  

  **Channel Between Groups:**  
  - Reasoners submit red cards to *you*. You filter and pass *actionable* requests to Derivers (e.g., "Derive a string with exactly 2 I’s").  
  - Derivers *must* attempt requests but cannot use them to "skip ahead" (e.g., if asked for "MIIU", they must derive it step-by-step from existing strings).  

  ---

  ### **Minute-by-Minute Timeline**  
  **0–5 min: Setup (No Lecture)**  
  - Project MU-rules. Split class: "Derivers" (manipulate symbols) and "Reasoners" (find patterns). Assign roles randomly.  
  - Write axiom MI on the board in "Derivation Space". Explain roles tersely:  
    > *"Derivers, use these rules to generate strings. Reasoners, watch for patterns and ask questions via red cards."*  

  **5–25 min: MU-Puzzle Activity (20 min)**  
  - Derivers begin generating strings (e.g., MI → MII (Rule II) → MIIU (Rule I)). Each new string on a blue card.  
  - Reasoners observe and post yellow-card conjectures (e.g., "All strings start with M", "I-count is always odd").  
  - **At 15 min:** Pause for **first credence report** (see scoring system below).  

  **25–30 min: First Credence Report & Shift (5 min)**  
  - Each student writes their credence (0–100%) that MU is derivable on a card. Collect and project distribution (e.g., histogram).  
  - **Teacher move:** Note shifts neutrally (e.g., "Most of you are less confident now"). Do not interpret.  

  **30–50 min: Deep Dive & Companion System Prep (20 min)**  
  - Derivers continue, now attempting Reasoners’ requests (e.g., "Derive a string with 3 I’s").  
  - Reasoners refine conjectures (e.g., "I-count mod 3 is always 1 or 2").  
  - **At 40 min:** **Second credence report**. Project distribution again.  
  - **At 45 min:** Introduce **companion system** (see below) without fanfare:  
    > *"Switch to a new system. Rules are identical except Rule III: Replace III with U → Replace III with* **UI**."  

  **50–70 min: Companion System Activity (20 min)**  
  - **Companion rules:**  
    - Axiom: MI  
    - Rule I, II, IV: Unchanged from MU.  
    - **Rule III (modified):** Replace III with **UI** (not U).  
    - **Target:** Derive MU (same as before).  
  - Derivers restart from MI. Reasoners repeat their role.  
  - **Why this system?**  
    - MU *is derivable* but requires a long path (prevents "impossible" conclusion from failed search).  
    - **Derivation path (hidden from students):**  
      MI → MII (Rule II) → MIIII (Rule II) → MIIIIII (Rule II) → MUI III (Rule III: replace first III with UI → MUI III) → MUII (Rule III: replace III in UI III? Wait, note: after first replacement, we have "MUI" + "III" → not contiguous. Alternate path: Build to 9 I’s, apply Rule III three times: MIIIIIIIII → MUI IIIIII → MUUI III → MUUUI → MUU (Rule IV) → MU.  
    - **Key:** The invariant breaks. Original MU preserved "I-count mod 3 ≠ 0". Here, Rule III *adds* a U and *keeps* an I (III → UI reduces I-count by 2 → mod 3 changes). MU has 0 I’s (0 mod 3), and MI starts at 1 (1 mod 3). Derivation requires increasing I-count to a multiple of 3 (e.g., 9 I’s), which is possible but long enough to avoid quick solutions.  

  **70–75 min: Final Credence & Reveal (5 min)**  
  - **Third credence report** for original MU system (not companion). Project distribution.  
  - Reveal:  
    - MU is *not derivable* in the original system.  
    - MU *is derivable* in the companion system (show derivation if time, else post later).  

  **75–80 min: Transition to Debrief**  
  - Collect conjectures and student observations. Say: *"Hold these thoughts—we’ll discuss after."*  

  ---

  ### **Scoring System: Credence Reports**  
  **Goal:** Visualize "no derivation exists" vs. "search hasn’t terminated" through shifting beliefs.  

  **Mechanics:**  
  - **Timing:** Reports at 15 min (early), 40 min (mid), and 70 min (end).  
  - **Process:**  
    - Each student writes:  
      - Credence (0–100%): Probability that MU is derivable.  
      - A brief reason (e.g., "No one’s found it but we haven’t tried everything").  
    - **Scoring:** Use a **quadratic scoring rule** (proper scoring rule):  
      - If MU is *not derivable*, score = `1 - (credence/100)^2`.  
      - If MU *is derivable*, score = `1 - ((100 - credence)/100)^2`.  
    - **Display:** Project anonymized histogram of credences and average score after each report. Top 3 scorers get "puzzle master" badges (non-monetary prize).  

  **Trajectory & Anti-Gaming:**  
  - **Expected credence path:**  
    - **15 min:** High optimism (avg. ~70%). Derivers have few strings; Reasoners see many paths.  
    - **40 min:** Sharp drop (avg. ~30%). Derivers hit dead ends; Reasoners notice I-count patterns.  
    - **70 min:** Low confidence (avg. ~10%). Companion system shows derivations can be long/hidden.  
  - **Prevent gaming by knowers:**  
    - Scoring rewards well-calibrated uncertainty, not certainty. A knower betting 0% early earns max points *only if* the class fails to derive MU, but the companion system injects doubt (e.g., "Maybe we just missed a path?").  
    - If a knower states the answer, redirect: *"Your job is to work within your role—let the process unfold."* Assign them to Reasoners to formalize their insight as a conjecture.  

  ---

  ### **Companion System Design**  
  **System:** Modified MU-puzzle (as above).  
  - **Job:** Break the "failed search → impossibility" inference.  
  - **Why this design?**  
    - Surface similarity: Same symbols (M, I, U), same axiom (MI), nearly identical rules.  
    - Divergence: Rule III (III → UI) breaks the I-count mod 3 invariant. MU is reachable but requires 10+ steps (e.g., building to 9 I’s). Students are unlikely to find it in 20 min, forcing them to confront search space complexity.  
    - **Generalization:** The preserved property is *not* I-count mod 3 (it changes), so students must seek new invariants or admit uncertainty. This primes the debrief: "Impossibility needs proof, not just failure."  
  - **Sequencing:**  
    - After credence drops in the original system (mid-activity), the companion system *challenges* the emerging consensus that "MU is impossible." It creates cognitive dissonance: *"Why was it impossible there but possible here? What changed?"* This sets up the invariant concept as a tool, not a coincidence.  

  ---

  ### **Debrief: Mapping Activity to Concepts**  
  Withhold terms like "invariant" or "metatheory" until debrief. Structure around student experiences:  

  1. **Inside vs. Outside (15 min):**  
     - *Connect:* "Derivers worked *in* the system—applying rules step-by-step. Reasoners worked *outside*—spotting patterns no single rule could see."  
     - *Activity moment:* When Reasoners posted conjectures (e.g., "I-count isn’t divisible by 3") but Derivers couldn’t use them.  
     - *Key point:* The counting argument isn’t a "fifth rule"—it’s a *tool* for reasoning *about* the system.  

  2. **Why Invariants Aren’t Rules (10 min):**  
     - *Ask:* "Could Derivers use the I-count observation to derive MU? Why not?"  
     - *Highlight:* Rules manipulate symbols; invariants describe properties. The system can’t "see" I-count mod 3—it lacks arithmetic.  

  3. **Companion System as Correction (5 min):**  
     - *Contrast:* "In MU, we failed and concluded ‘impossible.’ In the companion, we failed but it *was* possible. What’s the difference?"  
     - *Reinforce:* Failure ≠ impossibility. You need a proof (invariant) to show impossibility.  

  4. **Gödel Bridge & Limitations (10 min):**  
     - *Analogy:* "Like the I-count argument, Gödel’s proof uses external math (about provability) to show a sentence is unprovable."  
     - *Crucial contrast:* "But Gödel’s sentence—unlike MU—*is* inside the system. It encodes ‘I am unprovable.’ The system can’t prove it, but we see it’s true from outside."  
     - *Preempt laziness:* "This puzzle is a *simplified analogy*. Gödel’s insight was encoding the outside-in argument *inside* arithmetic. We’ll explore that encoding next class."  
     - **Activity’s limit:** The puzzle *cannot* show internalization (e.g., Gödel numbering). You must state: *"Gödel’s genius was making the system speak about itself—something the MU-system can’t do."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Student who knows the answer:**  
     - *Handling:* Assign them as a Reasoner. Their "invariant" becomes a conjecture for others to test. If they announce it, say: *"Prove it using only the rules—can you?"* (They can’t, reinforcing the inside/outside divide).  

  2. **"Impossible means we weren’t clever enough":**  
     - *Handling:* The companion system directly counters this. When MU is derived there (even if by you), contrast: *"Here, persistence would have worked. In the original, no persistence could—why?"*  

  3. **Treating invariant as a rule:**  
     - *Handling:* If a Deriver tries to "apply" I-count, intervene: *"Your role is to use only the four rules. Save observations for Reasoners."* In debrief, clarify: "Invariants aren’t moves—they’re tools for analysis."  

  4. **"This refutes mechanism!":**  
     - *Handling:* Preempt in debrief: *"This shows limits of *specific* systems. Gödel’s theorem targets *any* consistent formal system for arithmetic. It doesn’t refute mechanism—it refutes complete self-containment."*  

  ---

  ### **Why This Prevents Lazy Gödel Analogies**  
  The activity forces two lessons:  
  1. **Failure ≠ Impossibility:** The companion system disrupts overgeneralization.  
  2. **Internalization Gap:** Debrief explicitly separates "external argument" (MU) from "internal self-reference" (Gödel).  

  By making students *experience* the invariant as an external tool, then contrasting it with Gödel’s internal sentence, you reduce lazy analogies. The activity *helps* if debriefed rigorously—it creates a foundation to build on.  

  ---  
  **Final Tip:** Keep energy high by framing struggle as productive. Example: *"Your frustration is the point—what does it teach us about formal systems?"**  
  This plan turns failure into insight, using asymmetry, scoring, and a strategic companion system to illuminate the limits of inside reasoning.
