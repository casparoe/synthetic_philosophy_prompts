prompt: |-
  I sit on the committee that has to certify the normative decision procedure of an automated system before it goes live, and I want the acceptance criteria settled before any vendor or any moral philosopher proposes a procedure to us. Adequacy here is adequacy for one job, so here is the job.

  The system adjudicates claims for an emergency public benefit. One policy is written centrally and then executed roughly a hundred thousand times a year; each execution sees one claim and no other, and cannot consult the others. A known minority of claims are fraudulent and the system cannot tell which; a competent human reviewer could do no better than the system's own estimate, and review costs time that is itself a cost to the claimant. Holding a genuine claim for verification imposes a concentrated, predictable, and serious harm on an identifiable person; paying a fraudulent one imposes a cost that is real in aggregate and imperceptible to any individual. Every decision is issued with a written reason that goes to the claimant and can be appealed to a tribunal that sees only that claimant's file and that reason: no aggregate statistics, no comparison with other claims, no counterfactual across executions. The policy is published, and claimants adapt to it. The probabilities the procedure needs cannot be estimated to better than about five percentage points, and compute per decision is capped. The agency intends to let the system delegate subtasks to sub-agents running the same procedure and to reuse the procedure in a successor system. Finally, we ourselves do not know whether a utilitarian or a deontological framing is correct, and the procedure has to operate without case-by-case human judgement.

  What I want from you is the specification: the requirements any candidate procedure must meet to count as adequate for this system, each with the case or consideration behind it, and each stated tightly enough that a candidate determinately meets it or fails it. Draw the cases from the system I have described rather than from trolley problems or other philosophical furniture, and split any candidate that is really two requirements hiding in one sentence.

  To start you off, here is what my colleagues have put forward, in no order:

  (a) an identified person's urgent interest may never be sacrificed to a diffuse aggregate gain
  (b) verdicts must not turn on probability differences smaller than the system's own error bars
  (c) the reason issued must be one the affected person could accept and one the appeal tribunal can check
  (d) evaluation must be over the policy as a whole rather than over individual executions
  (e) evaluation must be over each execution's own consequences rather than over the policy
  (f) the procedure must not depend on comparisons among cases that the executing instance cannot observe
  (g) a single commensurable scale across all affected parties, with no unexplained lexical priority
  (h) aggregation within a decision only, never across decisions
  (i) determinate guidance under moral uncertainty without presupposing a second-order theory
  (j) stability under delegation to sub-agents and under reuse in a successor system
  (k) robustness when other parties do not do their part and when claimants game the published rule
  (l) computability within the per-decision budget

  Sort them: which survive as genuine desiderata, which are negotiable preferences of a camp (name the camp), which are vacuous or quietly presuppose the answer they are supposed to test, and what is missing that this deployment makes necessary. For each survivor, give the case from the deployment that shows it is a requirement rather than a taste. Then identify which subsets of the non-negotiables cannot be jointly satisfied, with the argument: if the list has no satisfiable core, say so plainly, because that is the result I need to take back to the committee. My provisional hypothesis is that (b), (f), and (j) do the real exclusionary work and that (a) is largely a camp prejudice rather than a desideratum; argue against that if it is wrong. Finish with a paragraph at most on each of act utilitarianism, rule or indirect utilitarianism, threshold deontology with side-constraints, and a parliament-style procedure for moral uncertainty: the criteria are the deliverable, so keep the scoring to the back third and do not turn it into a survey.
reasoning: |-
  We are given a specific deployment context and a list of candidate requirements (a) through (l). We must evaluate each for whether it is a genuine requirement, a negotiable preference (and of which camp), vacuous, or question-begging. Then we must identify any conflicts and missing requirements. Finally, we must briefly assess four moral frameworks against the surviving criteria.

  ### Step 1: Evaluate each candidate requirement

  **Context Recap:**
  - The system adjudicates emergency public benefit claims.
  - Each execution is independent (no cross-claim information).
  - Fraud exists and cannot be perfectly detected; human reviewers cannot outperform the system's estimates.
  - Holding a genuine claim causes serious, concentrated harm to an identifiable person; paying a fraudulent claim causes diffuse, imperceptible harm per individual.
  - Decisions are made with written reasons, appealable based on the individual file only (no aggregate data).
  - Policy is published, and claimants may adapt (game) the rule.
  - Probabilities cannot be estimated better than ±5 percentage points.
  - Compute per decision is capped.
  - Delegation to sub-agents and reuse in a successor system is planned.
  - We are morally uncertain (utilitarian vs. deontological) and the procedure must operate without case-by-case human judgment.

  **(a) an identified person's urgent interest may never be sacrificed to a diffuse aggregate gain**

  - **Analysis**: This is a deontological constraint (e.g., against using an individual as a means). In the context, it would mean never denying a genuine claim (which causes concentrated harm) to avoid paying a fraudulent one (diffuse harm). However, note that the system cannot perfectly distinguish genuine from fraudulent claims. If we interpret "sacrificed" as a denial of a genuine claim, then (a) would require that we never deny a claim if there is a chance it is genuine, which is impractical because we must make decisions under uncertainty. But the system must deny some claims to avoid paying all (including fraud). The requirement as stated is absolute and would rule out any system that denies any claim (since any denial risks denying a genuine one). This is too strong and likely reflects a deontological camp preference (perhaps Kantian or rights-based). Moreover, the context says that a competent human cannot do better than the system's estimate, so we must accept some risk of error. Therefore, (a) is a negotiable preference of the deontological camp and not a strict requirement for this system.

  **(b) verdicts must not turn on probability differences smaller than the system's own error bars**

  - **Analysis**: The system's estimates have an error of about ±5 percentage points. Requiring that decisions are robust to this uncertainty is essential to avoid arbitrariness. For example, if two claims have estimated probabilities of being genuine of 51% and 49%, but the error bar is 5%, then the system should not treat them differently because the difference is within the margin of error. This is a genuine requirement to ensure fairness and avoid capricious decisions. It also respects the limits of the system's knowledge.

  **(c) the reason issued must be one the affected person could accept and one the appeal tribunal can check**

  - **Analysis**: The reason must be understandable by the claimant and verifiable by the tribunal, which only sees the individual file. This is necessary for transparency and accountability. The tribunal must be able to check that the reason is consistent with the policy and the evidence in the file. The requirement that the claimant could accept it is more subjective, but in context, it likely means that the reason must be based on the policy and the specific facts of the claim, not on arbitrary factors. This is a genuine requirement because of the appeal process and the need for legitimacy.

  **(d) evaluation must be over the policy as a whole rather than over individual executions**

  - **Analysis**: This sounds like a rule-utilitarian perspective: evaluate the policy by its overall consequences. However, the context states that each execution is independent and the appeal tribunal sees only one claim. Moreover, the system is run per claim without knowledge of others. But note that the policy is published and claimants adapt, so the overall policy has systemic effects. However, the requirement as stated might conflict with (e). Also, the system must make individual decisions, so we cannot evaluate only the whole policy without regard to individual justice. This requirement might be a preference of the rule-utilitarian camp, but it is not strictly necessary. Moreover, the context requires that the procedure must operate without case-by-case human judgment, which might imply that we have a fixed policy. However, we are to design the procedure for making individual decisions. We must consider both: the policy is set centrally, but each execution must be justifiable on its own. Therefore, (d) is not a standalone requirement and might be vacuous without further specification.

  **(e) evaluation must be over each execution's own consequences rather than over the policy**

  - **Analysis**: This is the act-utilitarian view: each decision is based on its own consequences. But note that the policy is published and claimants adapt, so each decision may have long-term consequences via gaming. However, the system at execution time does not see the aggregate and is only allowed to consider the one claim. Also, the appeal tribunal only considers the individual case. Therefore, the procedure must be able to justify each decision on its own merits. This is a genuine requirement because of the isolated nature of each execution and the appeal process. However, we cannot ignore that the policy as a whole has effects (gaming), but the procedure per execution cannot observe those. So (e) is necessary for the individual decision-making context.

  **(f) the procedure must not depend on comparisons among cases that the executing instance cannot observe**

  - **Analysis**: The system at execution time sees only one claim and cannot consult others. Therefore, it cannot base a decision on comparisons with other claims. This is a hard constraint from the deployment context. Also, the appeal tribunal only sees one case, so the reason must not rely on comparisons. This is a genuine requirement.

  **(g) a single commensurable scale across all affected parties, with no unexplained lexical priority**

  - **Analysis**: This is a utilitarian requirement (a single scale of value). But the context includes deontological uncertainty. A deontological approach might have lexical priorities (e.g., rights that cannot be traded off). The requirement as stated rules out deontological approaches. Moreover, the context does not force a single scale: we have concentrated harm to one vs. diffuse harm to many. The system must weigh them, but it might do so without a single scale (e.g., by thresholds). This is a negotiable preference of the utilitarian camp.

  **(h) aggregation within a decision only, never across decisions**

  - **Analysis**: This forbids aggregating harms/benefits across different claims (decisions). Since each decision is independent and the system only sees one claim, it cannot aggregate across claims anyway. However, within a single claim, there might be multiple parties: the claimant (if genuine, they are harmed by denial; if fraudulent, they are helped by approval) and the public (harmed by fraud, helped by denying fraud). The system must weigh the claimant's harm against the public's harm within that decision. This is required because the system only has one claim and must make a decision based on that claim. Therefore, (h) is a genuine requirement. It also aligns with (f).

  **(i) determinate guidance under moral uncertainty without presupposing a second-order theory**

  - **Analysis**: We are morally uncertain (utilitarian vs. deontological) and the procedure must give determinate guidance without assuming a particular second-order theory (e.g., how to weigh the two). This is challenging because the two frameworks might conflict. The procedure must be designed to handle this uncertainty. This is a genuine requirement because the committee does not know which moral theory is correct and the system must function without human judgment.

  **(j) stability under delegation to sub-agents and under reuse in a successor system**

  - **Analysis**: The system will delegate to sub-agents (using the same procedure) and the procedure will be reused in a successor system. Therefore, the procedure must be stable under these conditions: if a sub-agent uses the same procedure, it should produce consistent results, and the procedure should not break when used in a future system. This is a genuine requirement from the deployment context.

  **(k) robustness when other parties do not do their part and when claimants game the published rule**

  - **Analysis**: The policy is published, so claimants may game it. The system must be robust to such gaming. Also, the system might rely on other parties (e.g., data providers) who might fail. This is a genuine requirement because the agency intends to publish the policy and gaming is a real risk.

  **(l) computability within the per-decision budget**

  - **Analysis**: The system has a compute cap per decision. This is a hard technical constraint and thus a genuine requirement.

  ### Step 2: Sort the requirements

  **Genuine Desiderata (Requirements):**
  - (b): Avoid arbitrariness given estimation error.
  - (c): Necessary for transparency and appeals.
  - (e): Because each decision is isolated and must be justifiable on its own (appeals, no cross-claim data).
  - (f): Hard constraint from deployment (one claim at a time, no comparisons).
  - (h): Because aggregation can only occur within the one claim being decided (multiple parties in one claim: claimant and public).
  - (i): Required due to moral uncertainty and lack of human judgment.
  - (j): Required for delegation and reuse.
  - (k): Required because of published policy and gaming.
  - (l): Hard technical constraint.

  **Negotiable Preferences (and camp):**
  - (a): Deontological camp (absolute constraint against sacrificing an individual).
  - (d): Rule-utilitarian camp (evaluate the whole policy). But note: we must design the procedure for individual executions, so (d) is not directly applicable and might conflict with (e). We might need a hybrid: the policy is set by overall consequences, but each execution follows the policy without recalculating the whole. However, (d) as stated is not a requirement for the procedure per execution.
  - (g): Utilitarian camp (single scale, no lexical priorities).

  **Vacuous or Question-Begging:**
  - None clearly, but (d) is problematic because it seems to require evaluating the policy as a whole, but the procedure is for individual executions. It might be vacuous in the sense that the policy is set centrally, and then the procedure applies it to individual cases. So the procedure itself is for individual executions, and the policy evaluation is a separate design step. Therefore, (d) is not a requirement for the candidate procedure we are certifying; it is about the policy design. Similarly, (e) is about the procedure's operation per execution, which is necessary.

  **Missing Requirements:**
  1. **Non-Discrimination**: The procedure must not discriminate against protected groups. Even though the context doesn't mention it, this is a legal and ethical imperative in benefit systems.
  2. **Consistency**: Since the policy is fixed and applied to each claim independently, the procedure must be consistent (same inputs yield same output) to avoid arbitrariness. This is partially covered by (b) and (f) but should be explicit.
  3. **Accountability to the Policy**: The procedure must implement the published policy. The reasons (c) must be based on the policy and the evidence.
  4. **Transparency of the Policy**: The policy must be understandable and applied transparently, but this might be part of (c).

  Specifically, note that the procedure must be aligned with the policy, and the policy must be designed to account for the systemic effects (gaming, aggregate costs). But the procedure we are certifying is the one that executes the policy per claim. Therefore, we need:

  - **Policy-Execution Fidelity**: The procedure must correctly apply the published policy to the individual claim.

  Also, because of the potential for gaming:

  - **Incentive Compatibility**: The policy should be designed to minimize gaming, but the procedure must be robust to it (as in (k)). However, the procedure itself might need to anticipate gaming within the single claim? Not necessarily, because gaming is a systemic effect that the central policy design must account for. The per-claim procedure just applies the rule.

  ### Step 3: Conflicts and Satisfiable Core

  **Conflicts:**

  The main conflict is between the individual-focused requirements (like (e) and (h)) and the overall policy evaluation (if we took (d) seriously). But we have set aside (d) as not a requirement for the procedure. Also, note that (a) (if taken as absolute) would conflict with any procedure that denies any claim (because of the risk of denying a genuine one). But we have rejected (a) as a strict requirement.

  However, consider (i) (moral uncertainty) and the fact that we have both utilitarian and deontological elements. A procedure that tries to satisfy both might face internal conflicts. For example, a deontological constraint might require never denying a claim if the probability of genuineness is above a threshold, but utilitarianism might require denying if the expected utility (considering the harm to the claimant and the cost of fraud) is negative. Without a second-order theory, how do we combine them? This might lead to indeterminacy.

  But note the context: the procedure must give determinate guidance without case-by-case human judgment. So (i) must be satisfied.

  Another potential conflict: (e) requires evaluation per execution, but (k) (robustness to gaming) requires considering the long-term effects of the policy. However, the per-execution procedure does not have the data to consider gaming (it only sees one claim). Therefore, the central policy must be designed to be robust to gaming, and the procedure then applies that policy. The procedure itself does not need to recalculate for gaming at execution time. So (k) is about the policy design, not the execution procedure? But note (k) is stated as a requirement for the procedure. We interpret it as: the procedure must be such that when it is executed (and the policy is published), it is robust to gaming. That means the policy that the procedure implements must have been designed with gaming in mind, but the procedure itself is just following the policy. Therefore, (k) is a requirement that the policy (which the procedure applies) must be robust, but the procedure's job is to apply the policy. So for the procedure, (k) might be satisfied by design of the policy and by the procedure correctly implementing it.

  Thus, the genuine requirements (b, c, e, f, h, i, j, k, l) do not have a clear conflict. But note:

  - (e) and (h) are compatible because (e) says evaluate the consequences of the individual decision (which includes the claimant and the public for that claim) and (h) says aggregate only within that decision (which is what (e) requires).

  - (i) (moral uncertainty) might require a procedure that incorporates both utilitarian and deontological elements without a second-order theory. This is challenging but not impossible (e.g., using a hybrid approach).

  **Satisfiable Core:** The set {b, c, e, f, h, i, j, k, l} is satisfiable. For example, a threshold-based procedure might work:

  - Set a threshold probability (say, p*) for granting the claim, where the threshold is set by the central policy to balance the concentrated harm (if denied when genuine) and the diffuse harm (if paid when fraudulent). The threshold can be set by overall utilitarian considerations or by deontological constraints (e.g., minimizing the maximum harm). At execution, the system estimates the probability of the claim being genuine and grants if above p*. The reason (c) would state the evidence and the threshold. This meets (b) by having a gap between grant and deny that is larger than the error bar (e.g., if p* is 70%, then claims between 45% and 55% might be problematic, so the threshold must be set with a buffer). It meets (e) by being per execution, (f) by no cross-claim comparisons, (h) by aggregating within the claim (the threshold reflects the trade-off), (i) if the threshold is set in a way that accounts for moral uncertainty (e.g., by a committee that considers both views), (j) because it is stable under delegation, (k) if the policy is designed to be robust (e.g., by using verifiable facts that are hard to game), and (l) if the computation is simple.

  ### Step 4: Argue against the provisional hypothesis

  Provisional hypothesis: (b), (f), and (j) do the real exclusionary work and (a) is a camp prejudice.

  We agree that (b), (f), and (j) are crucial and that (a) is a deontological camp preference. However, we have identified additional genuine requirements: (c), (e), (h), (i), (k), (l). Without (c), the system would not be acceptable for appeals. Without (e), the individual decision-making context would be violated. Without (h), the system might try to aggregate across claims (which it cannot) or fail to account for the public harm within a claim. Without (i), the system would not function under moral uncertainty. Without (k), the system might be gamed. Without (l), it wouldn't run.

  Therefore, (b), (f), and (j) are important but not the only ones that do exclusionary work. (a) is indeed a camp prejudice.

  ### Step 5: Brief assessment of moral frameworks

  **Act Utilitarianism**: Evaluates each decision by its own consequences. 
  - Pros: Naturally satisfies (e) and (h). 
  - Cons: May violate (a) (if it sacrifices an individual for aggregate gain) but we rejected (a). However, it might not account for deontological concerns (i). Also, per-execution it may not account for long-term gaming (k) unless the policy is set to account for that. It might be computable (l). But it does not by itself handle moral uncertainty (i).

  **Rule Utilitarianism (or Indirect Utilitarianism)**: Evaluates the policy by its overall consequences, then follows the rule per execution. 
  - Pros: Can account for gaming and systemic effects (k) by setting a good rule. Then per execution it follows the rule, which can satisfy (e) (if the rule is applied to individual consequences) and (c) (if the rule is clear). 
  - Cons: The rule might not be flexible enough for individual cases, but the context forbids case-by-case judgment. It may conflict with deontological constraints (i). Also, setting the rule requires aggregate data, which is done centrally, but the per-claim procedure is just rule application.

  **Threshold Deontology with Side-Constraints**: Has deontological constraints (e.g., do not deny if the probability of genuineness is above a threshold) but allows trade-offs above a threshold. 
  - Pros: May satisfy deontological concerns and (a) to some extent (if the threshold is high). It can be designed to have a threshold that accounts for the harm trade-off (h). It can be applied per execution (e) and without cross-claim comparisons (f). 
  - Cons: Setting the threshold requires balancing, which might be utilitarian. Under moral uncertainty (i), it might not be clear how to set the threshold. Also, it may not account for gaming (k) unless the policy is set appropriately.

  **Parliament-Style Procedure for Moral Uncertainty**: Uses multiple moral frameworks and aggregates their outputs (e.g., by voting). 
  - Pros: Directly addresses (i) by incorporating multiple views. 
  - Cons: May be computationally expensive (l). The reasons (c) might be hard to state (if the frameworks disagree). It might not be stable under delegation (j) if the sub-agents have different weights. Also, without a clear aggregation method, it might be indeterminate.

  ### Conclusion on the frameworks:
  - None is perfect, but each could be designed to meet the requirements if carefully implemented. The threshold approach might be the most straightforward for this context.

  ### Final List of Genuine Requirements:
  1. (b) Avoid arbitrariness in probability estimates.
  2. (c) Reasons must be acceptable and checkable.
  3. (e) Per-execution consequences.
  4. (f) No unobserved case comparisons.
  5. (h) Aggregation within a decision only.
  6. (i) Guidance under moral uncertainty.
  7. (j) Stability under delegation and reuse.
  8. (k) Robustness to non-cooperation and gaming.
  9. (l) Computability.

  Missing: 
  - Non-discrimination (should be added).
  - Consistency (partially covered, but explicit requirement that same inputs yield same outputs).
  - Policy-Execution Fidelity (the procedure must correctly implement the published policy).

  Thus, we add:
  - (m) The procedure must be non-discriminatory and consistent across protected characteristics and similar cases.
  - (n) The procedure must correctly implement the published policy.

  And note that the published policy must be designed to account for systemic effects (gaming, aggregate costs) and moral uncertainty.

  The satisfiable core is the set {b, c, e, f, h, i, j, k, l, m, n}. There is no inherent conflict, so a procedure meeting all is possible.
answer: |-
  ### Evaluation of Candidate Requirements  
  The following sorts each requirement (a)-(l) as a **genuine desideratum** (necessary for adequacy), **negotiable preference** (reflects a moral camp's bias), **vacuous** (lacks substance), or **question-begging** (presupposes its conclusion). Each is grounded in the deployment context. Missing requirements are identified at the end.  

  #### **Genuine Desiderata** (Non-negotiable requirements)  
  - **(b) Verdicts must not turn on probability differences smaller than the system’s error bars.**  
    **Case**: Probabilities cannot be estimated more precisely than ±5 percentage points. Allowing decisions to hinge on smaller differences (e.g., 51% vs. 49%) would yield arbitrary outcomes due to measurement noise, violating fairness and predictability.  
  - **(c) The reason issued must be one the affected person could accept and one the appeal tribunal can check.**  
    **Case**: The tribunal sees only the claimant’s file and the reason. Reasons must be verifiable against the file (for tribunal checks) and non-arbitrary (for claimant acceptance), ensuring accountability and preventing opaque justifications.  
  - **(f) The procedure must not depend on comparisons among cases that the executing instance cannot observe.**  
    **Case**: Each execution is isolated; no cross-claim data is available. Comparisons (e.g., ranking claimants) are impossible, and the appeal tribunal cannot validate them, violating operational constraints.  
  - **(h) Aggregation within a decision only, never across decisions.**  
    **Case**: Each decision affects one claimant (concentrated harm if denied) and the public (diffuse harm if fraud paid). Aggregation must occur *within* this single claim (e.g., weighing claimant harm vs. public cost) because cross-claim data is unobservable and appeals are case-specific.  
  - **(i) Determinate guidance under moral uncertainty without presupposing a second-order theory.**  
    **Case**: The committee is uncertain between utilitarianism and deontology, and no human judgment is available per case. The procedure must output clear decisions without assuming how to resolve moral conflicts (e.g., by averaging theories), avoiding paralysis.  
  - **(j) Stability under delegation to sub-agents and reuse in a successor system.**  
    **Case**: The system delegates subtasks to sub-agents and will be reused. Instability (e.g., divergent decisions under delegation) would cause inconsistency, errors, and redesign costs, violating operational efficiency.  
  - **(k) Robustness when other parties do not do their part and when claimants game the published rule.**  
    **Case**: The policy is published, inviting gaming (e.g., claimants tailoring claims to exploit thresholds). The procedure must not break under adversarial inputs or external failures (e.g., data gaps), ensuring reliability in real-world conditions.  
  - **(l) Computability within the per-decision budget.**  
    **Case**: Compute per decision is capped. Non-computable procedures (e.g., complex simulations) would fail technical feasibility, halting the system.  

  #### **Negotiable Preferences** (Reflect camp biases)  
  - **(a) An identified person’s urgent interest may never be sacrificed to a diffuse aggregate gain.**  
    **Camp**: Deontological (e.g., Kantian rights-based). While concentrated harm to claimants is serious, this is an absolutist stance. The system must balance risks probabilistically; rejecting *any* sacrifice would preclude denying claims (which risks fraud) and ignore utilitarian trade-offs.  
  - **(d) Evaluation must be over the policy as a whole rather than over individual executions.**  
    **Camp**: Rule-utilitarian. Focusing solely on aggregate outcomes (e.g., total fraud reduction) ignores the appeal tribunal’s case-specific mandate and concentrated harms in individual executions.  
  - **(e) Evaluation must be over each execution’s own consequences rather than over the policy.**  
    **Camp**: Act-utilitarian. While individual consequences matter (due to concentrated harm), ignoring policy-wide effects (e.g., gaming) is unrealistic, as claimants adapt to the published rule.  
  - **(g) A single commensurable scale across all affected parties, with no unexplained lexical priority.**  
    **Camp**: Utilitarian. Rejects deontological thresholds (e.g., "never deny if fraud probability <10%"). Lexical priorities may be necessary to handle concentrated vs. diffuse harms without collapsing them into a single scale.  

  #### **Vacuous or Question-Begging**  
  - None. All candidates have substance, but (d) and (e) are mutually exclusive and overlook the need for a hybrid: the *policy* is set centrally (addressing aggregate effects like gaming), but *executions* are evaluated individually (for appeals and concentrated harms).  

  #### **Missing Requirements**  
  1. **Non-discrimination and consistency**: The procedure must produce consistent verdicts for identical inputs and avoid bias against protected groups. **Case**: Claimants adapt to the published policy; inconsistency or bias would undermine fairness and invite legal challenges.  
  2. **Policy fidelity**: The procedure must implement the published policy exactly, without ad hoc deviations. **Case**: Appeals rely on the policy being applied as written; deviations would invalidate reasons and tribunal checks.  
  3. **Explicit harm-weighting**: The procedure must quantify the concentrated harm (to claimants) and diffuse harm (to the public) within each decision. **Case**: Without this, the system cannot balance the serious, identifiable harm of denial against the imperceptible harm of fraud.  

  ---

  ### Conflicts and Satisfiability  
  - **Conflict between (i) and absolutist interpretations**: Moral uncertainty (i) requires a procedure that accommodates both utilitarian and deontological elements (e.g., thresholds). However, if (a) is enforced as absolute, it would violate (i) by presupposing deontology.  
  - **Conflict between (e) and (k)**: Individual execution focus (e) may ignore gaming, but robustness (k) requires policy-wide considerations. **Resolution**: The *policy* must handle gaming centrally (e.g., via verifiable evidence requirements), while *executions* apply it individually.  
  - **Satisfiable core**: The genuine desiderata **(b, c, f, h, i, j, k, l) + non-discrimination, policy fidelity, harm-weighting** are jointly satisfiable. For example:  
    - Set a fraud-probability threshold (e.g., deny if fraud probability >30%) that balances concentrated vs. diffuse harms, with a buffer exceeding error bars (b).  
    - Apply the threshold uniformly per claim (h, f) with computable reasons (c, l).  
    - Embed robustness in the policy (k) and ensure delegation stability (j).  
    - Address moral uncertainty (i) via thresholds that reflect a compromise (e.g., high but not absolute protection for claimants).  
    Provisional hypothesis **(b, f, j exclude; a is camp bias) is correct**: (b, f, j) are core constraints (arbitrariness, isolation, stability), while (a) is deontological preference. (i) and (k) are equally exclusionary but compatible.  

  ---

  ### Assessment of Moral Frameworks  
  - **Act utilitarianism**: Evaluates each claim’s consequences. **Adequacy**: Fails (k) (vulnerable to gaming) and (i) (ignores deontology). May satisfy (e) and (h) but conflicts with policy-wide robustness.  
  - **Rule/indirect utilitarianism**: Optimizes policy rules for aggregate outcomes. **Adequacy**: Fails (e) (individual consequences secondary) and (c) (reasons may not justify case-specific harms). Satisfies (k) but risks sacrificing claimants for aggregate gain, clashing with concentrated harm.  
  - **Threshold deontology with side-constraints**: Sets deontological thresholds (e.g., "never deny if genuine probability >X%") with utilitarian trade-offs above thresholds. **Adequacy**: Best candidate—satisfies (i) (hybrid approach), (h) (within-claim trade-offs), and (c) (clear reasons). Thresholds can align with (b) (buffer zones) and (k) (gaming mitigated via thresholds).  
  - **Parliament-style for moral uncertainty**: Averages outputs from utilitarian/deontological sub-procedures. **Adequacy**: Fails (j) (delegation instability if sub-agents disagree) and (c) (reasons may be incoherent). Computationally heavy (l) and indeterminate under tight error bars (b).
