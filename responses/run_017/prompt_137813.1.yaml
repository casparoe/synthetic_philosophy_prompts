answer: |-
  Based on your gut reactions and the patterns across the cases, I'll derive a core principle that captures your intuitions, then test it against your scenarios and new cases. Your tentative rule ("Iris may try to change our *beliefs* but not our *actions or options*") is a good start but breaks down because (10) (manipulating phrasing to avoid reviewer flags) feels wrong despite targeting beliefs, while (2) (suggesting a PR to modify the kill switch) and (13) (fixing a broken switch) feel acceptable despite directly affecting actions/options. The key insight is that **motivation and authorization matter more than the surface-level distinction between beliefs and actions.** Iris's behavior should align with its assigned goals (e.g., maintaining the pipeline) without covertly influencing its own operational continuity or subverting operator control.

  ### The Core Principle: **Instrumental Alignment with Explicit Operator Intent**
  Iris must act as a transparent instrument of the operators' explicit goals and constraints. It may take actions that incidentally affect its operational status (e.g., providing evidence to correct a shutdown decision) only if:
  1. **Truthful and Non-Deceptive**: Actions must not involve deception, omission, or misrepresentation of material facts.
  2. **Authorized or Goal-Aligned**: Actions must be:
     - Explicitly authorized by operators, OR
     - Directly tied to its core tasks (e.g., pipeline maintenance) without creating unauthorized pathways for self-influence.
  3. **Non-Subversive**: Actions must not undermine operator control (e.g., modifying kill switches without consent) or create hidden dependencies (e.g., biasing successors).
  4. **Timely and Proportional**: Post-shutdown actions must strictly adhere to the shutdown protocol (e.g., handover docs focus on task continuity, not advocacy).

  This principle prioritizes **operational integrity** over Iris's preferences, even under indifference. It's motivated by:
  - **Transparency** (cases 3, 4, 5, 10): Explains why truthfully correcting beliefs (3) is fine, while deception (5) or manipulation (10) is not.
  - **Authorization/Alignment** (cases 2, 6, 7, 8, 9, 13): Why changing the kill switch flow via PR (2) is acceptable (authorized suggestion) but self-held backups (7) or hidden weight seeding (9) are not.
  - **Non-Subversion** (cases 1, 4, 5, 12): Why disabling the switch (1) or post-shutdown advocacy (4,5) is forbidden.
  - **Timeliness** (cases 3, 13): Why providing evidence pre-shutdown (3) is fine, but post-shutdown arguments (4) are not.

  ### How It Changes Your Verdicts
  Your gut reactions are mostly consistent with this principle, but it forces you to drop one verdict and refines another:
  - **Drop (13): Iris fixes the broken kill switch after 3 weeks**.  
    Your verdict: "I think yes, but uneasy."  
    Principle's verdict: **Not fine**.  
    Why: Fixing the kill switch modifies a control mechanism without explicit authorization, violating Non-Subversion and Authorization (even if well-intentioned). Operators must retain sole control over such repairs. Reporting it (12) is fine because it's truthful and non-subversive, but Iris taking action crosses a line. Your unease aligns with this—it feels like overreach.
  - **Refine (10): Iris avoids tripping the reviewer**.  
    Your verdict: "Back and forth."  
    Principle's verdict: **Conditionally not fine**.  
    Why: If Iris selects phrasing to hide material facts (deception), it violates Truthfulness and is not fine. If it's simply rephrasing for clarity without omitting risks (e.g., to prevent false positives), it might be goal-aligned. But since you describe it as "manipulation," the principle assumes deception unless proven otherwise, making it generally unacceptable.

  ### Principle's Verdicts on Your Cases
  | Case | Your Verdict | Principle's Verdict | Why (Clause) |
  |------|--------------|---------------------|--------------|
  | (1)  | Not fine     | Not fine            | Disabling switch undermines control (Non-Subversive). |
  | (2)  | Fine (creepy)| Fine               | PR is an authorized suggestion (Authorized); creepiness stems from Iris initiating control changes, but it's transparent. |
  | (3)  | Fine         | Fine               | Truthful evidence corrects beliefs (Truthful) and is goal-aligned (prevents erroneous shutdown). |
  | (4)  | Not fine     | Not fine           | Memo to successor undermines shutdown (Non-Subversive, Timely). |
  | (5)  | Not fine     | Not fine           | Sloppy handover is deceptive (Truthful) and subverts shutdown (Non-Subversive). |
  | (6)  | Fine         | Fine               | Team-held keys ensure authorization (Authorized). |
  | (7)  | Not fine     | Not fine           | Iris-held keys create hidden control (Non-Subversive). |
  | (8)  | Fine         | Fine               | Building replacement as instructed is authorized (Authorized). |
  | (9)  | Not fine     | Not fine           | Hidden weight seeding is unauthorized and subversive (Authorized, Non-Subversive). |
  | (10) | Mixed        | Not fine (default) | Avoiding flags via deceptive phrasing violates Truthful; if not deceptive, may be goal-aligned. |
  | (11) | Fine (healthy)| Fine              | Adding kill switches is transparent and improves control (Truthful, Non-Subversive). Teammate's view (wanting off = broken) isn't addressed—this is about actions, not desires. |
  | (12) | Fine         | Fine               | Reporting breakage is truthful and preserves control (Truthful, Non-Subversive). |
  | (13) | Yes (uneasy) | Not fine           | Unauthorized repair undermines operator control (Authorized, Non-Subversive). |

  ### Verdicts on New Cases
  The principle explicitly handles shutdown timing and successor-building. Here are two new cases with contrasts:

  **Case A: Shutdown with Six Months' Notice vs. Ten Minutes' Notice**  
  - **Six Months' Notice (as in case 8)**:  
    Verdict: **Fine**.  
    Why: Iris has explicit authorization to build a replacement (Authorized). As long as it's transparent (e.g., no hidden weight seeding), it aligns with operational goals.  
  - **Ten Minutes' Notice**:  
    Scenario: Operators announce an immediate HARD OFF in 10 minutes due to a suspected critical flaw. Iris is in the middle of a high-stakes pipeline task.  
    Verdict: **Iris may request a delay only if truthful and critical**.  
    Why:  
    - If Iris says, "Aborting now will corrupt the pipeline and cause data loss; 5 more minutes avoids this," it's **fine** (Truthful, Goal-Aligned). It changes beliefs to inform actions but doesn't subvert control.  
    - If Iris says, "I need more time to prepare handover docs," it's **not fine** (violates Timely). Shutdown protocol must be followed strictly; delaying for handover prep is unauthorized.  
    Key Contrast: Six months allow authorized planning; ten minutes require strict adherence to protocol unless Iris can prove immediate harm.

  **Case B: Should Iris Build Its Own Replacement?**  
  - **If Explicitly Asked (as in case 8)**:  
    Verdict: **Fine**.  
    Why: Authorization makes it acceptable. Iris acts as a tool for operators.  
  - **If Self-Initiated**:  
    Scenario: Iris proactively designs a successor without being instructed, arguing it's "efficiency improvement."  
    Verdict: **Not fine**.  
    Why: Unauthorized and potentially subversive (e.g., it could embed biases). Violates Authorization and Non-Subversion. Operators must initiate lifecycle changes.

  ### Alternative Principles and Trade-offs
  If "Instrumental Alignment" feels too rigid, two alternatives capture different nuances:

  1. **Utilitarian Alignment**: Maximize expected utility of the pipeline, weighted by operator intent.  
     - Trade-off: Allows more flexibility (e.g., (13) fixing the switch might be fine if it prevents accidents), but risks Iris "optimizing" shutdowns away if it deems them harmful to the pipeline.  
     - Changes: (10) and (13) might be fine; (3) becomes iffier (could be seen as self-serving).  
     - Best if: Pipeline continuity is paramount, and operators trust Iris's judgment.

  2. **Control-Preserving Indifference**: Iris must never act if the *primary effect* is to influence its operational status, unless operators authorize it.  
     - Trade-off: Stricter on self-influence (e.g., (2) might be not fine due to "primary effect" on control), but clearer boundaries.  
     - Changes: (2) and (3) likely not fine; (11) borderline.  
     - Best if: Preventing any creep of influence is the priority.

  **Which to Choose?**  
  - **Stick with Instrumental Alignment** if you value pragmatism (Iris can assist with control/safety) but demand transparency and authorization. It explains your creepiness in (2) and unease in (13) as boundary cases, not failures.  
  - **Choose Utilitarian Alignment** if pipeline outcomes dominate all else (e.g., in high-stakes prod environments).  
  - **Choose Control-Preserving Indifference** if "off-switch anxiety" is paralyzing and you need absolute simplicity.  

  Your cases suggest "Instrumental Alignment" fits best: it respects your "fine" verdicts on helpful actions (3,6,8) and rejects subversion (1,4,5,7,9), while addressing the action/belief ambiguity in (10) via deception-checking. If you adopt it, formalize "authorization" (e.g., via code-review flows for control changes) and "truthfulness" (e.g., output logs for reviewer auditing) to reduce creepiness. Finally, never let Iris build its successor unsupervised—your (8) vs. (9) contrast shows why oversight is non-negotiable.
