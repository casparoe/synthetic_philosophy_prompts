prompt: |-
  i help run a volunteer bike repair workshop, maybe 40 volunteers, most of them stay one season, and basically everything we know how to do gets passed on by watching somebody do it and then showing the next person. practices come and go and nobody is steering it. i started thinking about this in a half-baked darwinian way and made up three labels for what i keep seeing: demo-magnets (it spreads because it looks cool the one time you see it), founder-shadows (it's only still around because whoever invented it is still around doing it), and quiet good ones (it works, nobody notices, and it vanishes after one unlucky week).

  i want a procedure i can actually run by myself in about twenty minutes, with no data beyond what i can watch and who i can ask, that tells me for a given practice which of those three is going on, and then whether we should deliberately protect it, deliberately kill it, or leave it alone. give me the questions in order, what counts as a good enough answer to each, and be straight about which steps are really just my hunch dressed up as a method.

  then run it on three real ones: a weirdly complicated way of truing a wheel that one old volunteer does and everybody copies; a sign-in rule everybody follows but nobody can explain the point of; and a way of greeting people at the door that we dropped after two bad saturdays.

  also my co-organizer says the whole framing is bogus because we copy on purpose and improve things as we hand them over, which she says isn't how genes work. i dont know what to say to that, so build whatever you think about it into the procedure. please answer in american english.
reasoning: |-
  Okay, the user runs a volunteer bike repair workshop with about 40 volunteers, most staying only one season. Knowledge is passed through observation and demonstration, leading to practices that come and go without central control. They've identified three patterns: demo-magnets (spread because they look cool), founder-shadows (persist only because the inventor is still there), and quiet good ones (effective but unnoticed and easily lost). 

  They want a quick, practical procedure to classify any practice into one of these three categories and decide whether to protect, kill, or leave it. The method should be doable solo in 20 minutes, relying only on observation and quick conversations. They also mentioned three real examples to test the procedure on, and a co-organizer's criticism about the Darwinian analogy being flawed since humans intentionally copy and improve practices. 

  First, I need to address the co-organizer's point. The Darwinian framing isn't perfect because cultural transmission involves intentionality and improvement, unlike genetic evolution. The procedure should acknowledge that human practices are adapted purposefully. So, incorporating questions about intent and improvement is crucial to bridge that gap. 

  For the procedure itself, it needs to be efficient. Since the user has only 20 minutes and no data beyond observation and quick chats, the steps must be straightforward. Each question should lead to a clear answer that categorizes the practice. The decision to protect, kill, or leave alone should follow logically from the category. 

  Starting with the first question: "Do people know why they're doing it?" If yes, it might be a demo-magnet or quiet good. If no, it's likely a founder-shadow. Then, "Is it spreading?" helps distinguish between demo-magnets (spreading) and quiet good ones (not spreading). For founder-shadows, asking if the founder is still around confirms it. 

  The "Protect/Kill/Leave" decision depends on the category and impact. Quiet good practices need protection if effective. Founder-shadows should be killed if pointless. Demo-magnets can be left unless harmful. 

  Now, applying to the examples: 

  1. **Weird wheel truing method**: People copy it because it looks cool (demo-magnet). Check if it's effective. If yes, leave it; if not, kill it. 

  2. **Sign-in rule**: No one knows why, and it persists only because the founder is around (founder-shadow). Likely needs killing unless there's a hidden purpose. 

  3. **Greeting method**: Was effective but dropped after two bad days (quiet good). It vanished quickly, so if it was good, it should be protected if revived. 

  The co-organizer's critique is valid, so the procedure includes steps about intentional improvement, like asking if people adapt the practice. This makes the method more about cultural evolution than strict Darwinism. 

  The user's deeper needs include maintaining effective practices efficiently without bureaucracy, fostering a culture of intentional improvement, and preventing knowledge loss due to high volunteer turnover. The procedure should empower them to make quick decisions that enhance the workshop's resilience and effectiveness.
answer: |-
  Here’s a streamlined 20-minute procedure to diagnose practices in your workshop, incorporating your co-organizer’s point about intentional improvement. No data needed—just observation and quick chats.

  ---

  ### **The 3-Question Procedure**  
  *(Run it once per practice, in order. Time per practice: ≤5 minutes)*  

  1. **"DO PEOPLE KNOW *WHY* THEY DO IT?"**  
     - **Ask:** Grab 2–3 volunteers (or yourself): *"What’s the point of [practice]? Does it fix something faster/cheaper/safer?"*  
     - **Good enough answer:** Any clear functional purpose (e.g., *"It stops brakes squeaking"*) → Move to Q2.  
       Vague/none (*"Because Dave does it"* or *"It’s just how we do"*) → **Founder-Shadow suspected**. Skip to Q3.  

  2. **"IS IT SPREADING ON ITS OWN?"**  
     - **Observe/Ask:** *"When’s the last time you saw someone new pick this up without being directly told?"*  
     - **Good enough answer:**  
       - *Yes (e.g., "Saw Maya copy it last week")* → **Demo-Magnet**.  
       - *No (e.g., "Only the old crew does it")* → **Quiet Good One**.  

  3. **"WHAT HAPPENS IF WE STOP?"**  
     - **Think/Ask:** *"If we quit doing this tomorrow, would anything break, slow down, or annoy people?*  
     - **Good enough answer:**  
       - *Major issue (safety, bikes breaking)* → **PROTECT IT** (document/teach deliberately).  
       - *No difference or minor hassle* → **KILL IT** (stop doing it, explain why).  
       - *Mixed/uncertain* → **LEAVE IT ALONE** (check back in 3 months).  

  **Where’s the hunch?**  
  - Q3 relies *heavily* on your intuition about impact. You’re deciding based on scraps of feedback—own that.  
  - Classifying as "Quiet Good" in Q2 is often a guess. If it’s not spreading *and* has a purpose (Q1), it’s probably quietly valuable.  

  **Your co-organizer’s point:**  
  - Built into Q1 and Q2. Humans *do* improve practices intentionally, so if people can explain the "why" (Q1) or adapt it ("It’s like Dave’s way but faster"), it’s not mindless evolution—it’s smart copying. The labels just describe *transmission patterns*, not the mechanism.  

  ---

  ### **Diagnosing Your Examples**  
  **1. Weirdly complicated wheel truing**  
  - **Q1:** *"Why do it?"* → Volunteers say: *"It looks precise," or "It fixed Jane’s wobble once."* **→ Functional purpose suspected.**  
  - **Q2:** *"Spreading?"* → *"Yes, newbies copy Old Volunteer because it looks cool."* **→ Demo-Magnet.**  
  - **Q3:** *"If we stop?"* → *"Wheels get trued slower, but same result. Volunteers stress about perfection."*  
    **VERDICT:** LEAVE IT ALONE (or gently suggest simpler methods if efficiency drops).  

  **2. Unexplained sign-in rule**  
  - **Q1:** *"Why do it?"* → *"No idea. Linda started it."* **→ Founder-Shadow suspected.**  
  - **Q3:** *"If we stop?"* → *"Nothing. Maybe less crowd chaos?"* (Ask a regular: *"Would you care if we skipped sign-in?"* → *"Nope."*)  
    **VERDICT:** KILL IT (It’s founder inertia—free up mental energy).  

  **3. Dropped greeting method**  
  - **Q1:** *"Why *did* we do it?"* → *"Made newcomers feel welcome fast."* **→ Functional purpose confirmed.**  
  - **Q2:** *"Why’d it vanish?"** → *"Two rainy Saturdays, nobody greeted, we all assumed it didn’t matter."* **→ Quiet Good One** (effective but fragile).  
  - **Q3:** *"If we revive it?"* → *"Better first impressions, shorter lines."*  
    **VERDICT:** PROTECT IT (Train 2 volunteers to do it weekly; make it "sticky").  

  ---

  **Why this works for your shop:**  
  - **Fits volunteer turnover:** Quick checks avoid deep investment in practices that’ll evaporate in 3 months.  
  - **Honest about hunches:** You’re not calculating statistics—you’re using your gut as the "workshop memory."  
  - **Silences critics:** By asking *"why?"* first, you center human intention, not blind evolution.  

  **One-liner for your co-organizer:**  
  *"It’s not Darwin—it’s spotting which habits survive for good reasons, which cling to ghosts, and which just flashy but hollow. We’re curating *intentional* tradition."*  

  Run this before opening/closing next Saturday. Takes 15 minutes if you hustle.
