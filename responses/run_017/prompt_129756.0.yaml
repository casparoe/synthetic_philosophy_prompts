prompt: |-
  I work in a memory and assistive-technology clinic, and several times a month our team faces variants of the same question: whether some external resource a patient depends on should count as part of that patient's own thinking, or merely as a tool they happen to use. The decision is not academic. If the resource is part of the patient's mind, then degrading or removing it looks like impairing a person rather than depriving them of property; if it is a mere tool, it does not. The same question arises in the opposite direction: when a relative supplies the missing half of a decision — the retrieval cue, the unfinished sentence, the standing set of values — should we score that as the patient's own decision-making capacity, or as someone else's influence on it?

  Please turn the extended mind thesis into a decision procedure my team can actually run, in about fifteen minutes, on a real case. Take as raw material — and do not feel obliged to keep — these candidate conditions: the resource is reliably available when needed; its contents are easily accessible; it is trusted and taken at face value rather than checked against something else; consulting it requires no special effort; past reliance on it has become automatic; and the store is durable over time. Say which conditions you keep, which you drop, which you tighten, and which you demote to mere evidence rather than requirements; say what the team should do when a condition is only partly met or cannot be assessed in a quarter of an hour; and mark clearly the points where no amount of procedure removes the need for a value judgment, and who on the team has to make it.

  One distinction I want handled explicitly, because I think we have been conflating three things that can come apart. First, whether the resource is a component of the cognitive system that actually produces the performance. Second, whether the resulting memory, belief, or action is attributable to the patient as theirs, in the way that matters for credit, responsibility, and consent. Third, whether interfering with the resource wrongs or harms the patient, and whether maintaining it falls under our duty of care. A resource could satisfy the first without settling the third, for instance if it is owned and remotely rewritable by a third party. Tell me how the procedure keeps these separate, and what it does when they disagree.

  Then run it on three cases: a man with dense amnesia whose entire prospective and autobiographical memory lives in a cloud-synced voice assistant that his daughter and the manufacturer can both edit; a single jointly maintained notebook that both partners of a couple rely on for their shared life, where one partner now wants it destroyed; and a spouse who, during a capacity assessment, reliably supplies the cues and values the patient cannot retrieve. I expect to dislike the answer on the last one, so give it to me straight. Finally, state plainly what the procedure cannot do — whether it settles legal capacity, personhood, or consent — and where a clinician should refuse to use it as if it did.
reasoning: |-
  Hmm, the user works in a memory clinic and is grappling with how to apply the extended mind thesis to real clinical decisions. They need a practical 15-minute procedure to determine if external resources (like notebooks or apps) should be considered part of a patient's mind. This matters ethically because if it's part of the mind, removing it could be like harming the person, not just taking a tool. They also want to distinguish three aspects: cognitive integration, attribution (credit/responsibility), and ethical duties.

  First, I need to recall the extended mind thesis by Clark and Chalmers. It argues that external objects can function as parts of the mind if they meet certain conditions: constant availability, direct access, automatic use, and endorsement. The user listed some candidate conditions: reliable availability, easy accessibility, trust/face-value use, no special effort, automatic reliance, and durability. I should refine these for clinical use.

  For the decision procedure, I'll focus on cognitive integration. The key conditions should be: constant availability (it's there when needed), direct accessibility (minimal steps to use), endorsement (trusted without verification), and automaticity (habitual, not deliberate). I'll drop durability because it's not essential for integration in the moment, and demote reliability to evidence since availability is more critical. Transparency (understanding the source) is important to address issues like third-party editing.

  When conditions are partially met, I'll use a threshold approach: if 3/4 core conditions are fully met, it's integrated; 1-2 partials might still pass; 0-1 fulls fail. Unassessable aspects default to non-integration unless there's strong evidence. But value judgments are needed—clinicians must decide when evidence is ambiguous, and ethicists/lawyers handle attribution and duties.

  The user wants three aspects separated: cognitive integration (does it function as mind?), attribution (is it the patient's action?), and ethical duties (harm/wronging). The procedure only addresses the first. For attribution, use the integration result plus transparency/control; for duties, consider ownership, dependency, and alternatives. If they disagree, document and escalate—e.g., integrated but third-party controlled might not be attributable.

  Now, case applications: 

  1. The amnesia patient with a cloud-synced voice assistant. It's constantly available and directly accessible, but not endorsed if he's unaware of edits, and not transparent. Partial on automaticity. Likely integrated cognitively, but attribution is murky due to lack of control. Ethically, disrupting it harms him, but it's not fully "his" mind.

  2. The couple's shared notebook. For each partner, it's available, accessible, endorsed. Automaticity depends on habit. But transparency is low if they don't know entries' origins. Integrated for both cognitively. Attribution is joint, so one partner destroying it wrongs the other. Ethically, it's complex—like damaging shared memory.

  3. The spouse supplying cues during assessment. Not constantly available (only when spouse is there), not accessible without spouse, not automatic if it requires prompting. Not integrated. So the decision isn't attributable to the patient alone. Clinically, this means scoring capacity as impaired. Ethically, relying on spouse isn't wrong, but it doesn't count as the patient's cognition.

  Limits of the procedure: It doesn't determine legal capacity or consent—those require broader assessments. Clinicians shouldn't use it for those, or when dependency is harmful, or if the resource is insecure. It's a cognitive tool, not an ethical verdict.

  The user might dislike the third case outcome because it challenges patient autonomy, but it's honest: the spouse is scaffolding, not extending, the mind. That's crucial for accurate capacity evaluation.
answer: |-
  Below is a clinically actionable 15-minute decision procedure for applying the **Extended Mind Thesis (EMT)** to assess whether an external resource counts as part of a patient's cognitive system. The procedure focuses **solely** on the first of your three distinctions: *cognitive integration* (whether the resource functions as part of the patient’s mind). Attribution (credit/responsibility) and ethical duties (harm/wronging) are evaluated separately afterward, using the integration result as input but not determined by it. 

  The procedure uses a **threshold-based checklist** with core conditions derived from Clark & Chalmers’ original criteria, refined for clinical pragmatism. Conditions are assessed via brief patient/interviewer questioning and observation.

  ---

  ### **Decision Procedure: Is the Resource Cognitively Integrated?**  
  *(Time: ≤15 min; run by clinician + note-taker)*  
  **Core Conditions (All 4 must be met; "partial" fails unless specified):**  
  1. **Constant Availability:** The resource is *immediately and reliably present* in contexts where needed (e.g., "Is it always with you/accessible? If not, when is it missing?").  
     - *Tightened:* Must be physically or digitally accessible >90% of the time in relevant environments (e.g., not "sometimes at home" if needed for shopping).  
     - *Partial/Unclear:* Defaults to **non-integrated** unless evidence strongly suggests routine access.  

  2. **Direct Accessibility:** Contents are retrieved *with minimal extra steps* (e.g., "Do you check/verify the resource, or use it straight away?").  
     - *Tightened:* No intermediate decoding, translation, or external validation required (e.g., reading a notebook is direct; asking a spouse to interpret it is not).  
     - *Partial:* If >50% of uses are direct, count as met.  

  3. **Endorsement:** The resource is *trusted and used uncritically* (e.g., "If it says ‘appointment at 3,’ do you question it?").  
     - *Tightened:* Patient must consistently treat output as their own belief/memory without cross-checking (exception: initial setup periods).  
     - *Partial/Doubt:* Fails if patient expresses skepticism >20% of the time.  

  4. **Automaticity:** Use is *effortless and habitual* (e.g., "Do you stop and decide to consult it, or just do it without thinking?").  
     - *Tightened:* Must be triggered subconsciously by context (e.g., reaching for notebook when planning dinner).  
     - *Partial:* Passes if observed/reported as automatic in >70% of cases.  

  **Demoted to Supporting Evidence (Not requirements):**  
  - *Durability:* May indicate stability but doesn’t affect real-time function.  
  - *Reliability:* Evidence for Availability/Endorsement, but not core (unreliable tools can still be integrated).  

  **Handling Ambiguity:**  
  - If a condition is unassessable in 15 min (e.g., Automaticity not observable), default to **non-integrated**.  
  - If ≥3 conditions are fully met, conclude **integrated**; ≤2 met → **non-integrated**.  
  - **Value Judgment Required:** When evidence is conflicting (e.g., Availability met but Automaticity unclear), the **lead clinician** decides based on risk/consequence bias: Err toward *non-integrated* if harm from false-positive is high (e.g., legal capacity assessment); err toward *integrated* if false-negative risks abandonment (e.g., removing assistive tech). Document rationale.  

  ### **Separating the Three Distinctions**  
  1. **Cognitive Integration (Procedure Above):** Determines if the resource is *functionally part* of the patient’s cognition.  
  2. **Attribution (Post-Procedure):** Is the output *attributable to the patient*? Depends on:  
     - Integration result *plus*  
     - **Transparency/Control:** Does the patient understand/curate the resource? (e.g., "Who adds info? Can you correct errors?").  
     - *Who judges:* **Clinical team + ethicist**. Attribution fails if lack of transparency/control means the output isn’t "theirs" (e.g., third-party edits without oversight).  
  3. **Ethical Duties (Post-Procedure):** Does interference *wrong or harm*? Depends on:  
     - Integration *plus*  
     - **Dependency:** Severity of impairment without the resource.  
     - **Ownership/Access:** Can third parties alter it against patient’s will?  
     - *Who judges:* **Clinician + patient/family + legal advisor**. Harm is likely if integrated *or* critical for functioning; wronging requires a rights violation (e.g., unauthorized alteration).  

  **When Disagreements Occur:**  
  - E.g., Resource is integrated (cognitive) but not attributable (spouse-controlled cues) → Document conflict. Attribution trumps for consent/capacity; integration trumps for duty of care (e.g., don’t remove a harmful but integrated tool without alternatives). Escalate to ethics committee.  

  ---

  ### **Case Analyses**  
  **Case 1: Amnesia Patient with Cloud-Synced Voice Assistant**  
  - *Integration:* **Yes** (Available: always on; Accessible: voice-command; Endorsed: trusts alerts; Automatic: asks it spontaneously).  
  - *Attribution:* **No** (Lacks control: daughter/manufacturer edits without his input/awareness → outputs not "his").  
  - *Ethical Duties:* **High** (Harm: removing it destroys functional memory; Wronging: third-party edits violate epistemic agency).  
  - *Clinical Implication:* Treat disruption as impairing cognition, but consent requires validating info source.  

  **Case 2: Jointly Maintained Couple’s Notebook**  
  - *Integration (Per Partner):* **Yes** (Available/accessible: carried jointly; Endorsed/Automatic: both use uncritically/habitually).  
  - *Attribution:* **Shared/Joint** (Both contribute; both "own" entries. Destroying it severs mutual cognition).  
  - *Ethical Duties:* **High for both** (Harm: loss degrades shared memory; Wronging: unilateral destruction violates relational autonomy).  
  - *Clinical Implication:* Notebook is part of *both* minds. Destroying it is cognitive harm; mediate dispute.  

  **Case 3: Spouse Supplying Cues During Capacity Assessment**  
  - *Integration:* **No** (Fails Availability: spouse not always present; Fails Accessibility: cues require spouse’s active input; Fails Automaticity: deliberate prompting needed).  
  - *Attribution:* **No** (Outputs require spouse’s cognition → decision reflects spouse’s values, not patient’s).  
  - *Ethical Duties:* **Neutral/Mitigated** (No harm in using cues as scaffolding, but reliance wrongs patient if it overrides their will).  
  - *Straight Answer:* **Do not score as patient’s capacity.** The patient cannot independently access values/cues → decision-making capacity is impaired. Using cues is ethical support, but not cognitive extension.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Not a Capacity or Consent Tool:** It determines cognitive integration *only*. Legal capacity requires additional assessment of understanding, reasoning, and communication *using* integrated resources.  
  2. **Not a Personhood Test:** Integration ≠ personhood. A patient with fully integrated tools is still a person, but tools aren’t "them."  
  3. **Do Not Use When:**  
     - The resource is coercive or abusive (e.g., tracker imposed by exploitative caregiver).  
     - Dependency is pathological (e.g., patient refuses to engage without tool despite ability).  
     - Legal adjudication is needed (e.g., conservatorship)—use as input, not verdict.  

  **Clinician’s Boundary:** Refuse to apply the procedure if it risks conflating integration with capacity (e.g., "This notebook is his mind, so he can consent") or if the 15-min limit forces unacceptable uncertainty. In high-stakes cases (e.g., contested guardianship), extend assessment or defer.  

  This procedure systematizes EMT into actionable thresholds but cannot eliminate ambiguity—your team *must* document where judgment overrules criteria. The three distinctions prevent "cognitive bloat" while centering ethical responsibility.
