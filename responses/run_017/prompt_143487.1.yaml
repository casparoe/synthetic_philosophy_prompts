  ### Warm-Up Case: The Conference Room Lottery

  **Scenario:**  
  A conference is being held with two large rooms, A and B, and one small room, C. The organizers flip a fair coin to decide attendee distribution:  
  - **Heads (H₁):** Room A gets 100 attendees, Room B gets 1 attendee, Room C (the speaker’s room) gets 1 attendee.  
  - **Tails (H₂):** Room A gets 1 attendee, Room B gets 100 attendees, Room C gets 1 attendee.  
  Total attendees are always **102** (fixed). You are randomly selected from all 102 attendees. You look at your badge and see you are assigned to **Room A**. What’s the probability the coin landed heads?  

  **Key Features:**  
  - **Fixed total observers:** Both hypotheses have exactly 102 attendees.  
  - **Differing observers with your evidence:** Under H₁, 100 attendees share your evidence (being in Room A). Under H₂, only 1 attendee shares your evidence. Ratio = 100:1.  
  - **Evidence moves the odds:** Observing "I am in Room A" is more likely under H₁ (100/102) than H₂ (1/102), shifting the posterior from 50% toward H₁.  
  - **Robust reference class:** Whether you define the reference class as "all conference attendees" (102), "all humans" (7.9 billion), or "all conscious beings," the total observers under H₁ and H₂ remain identical. The posterior odds don’t change because the reference class size cancels out.  

  ---

  ### Arithmetic: SSA vs. SIA  
  Both methods start with a prior of P(H₁) = P(H₂) = 0.5 (from the fair coin).  
  - **Likelihood of evidence ("I am in Room A")**:  
    - Under H₁: 100 attendees in Room A → P(Evidence | H₁) = 100 / 102.  
    - Under H₂: 1 attendee in Room A → P(Evidence | H₂) = 1 / 102.  

  #### **SSA Calculation (Self-Sampling Assumption):**  
  _Assume you are a random sample from the reference class._  
  Posterior for H₁:  
  P(H₁ | Evidence) = [P(Evidence | H₁) × P(H₁)] / [P(Evidence | H₁) × P(H₁) + P(Evidence | H₂) × P(H₂)]  
  = [(100/102) × 0.5] / [(100/102) × 0.5 + (1/102) × 0.5]  
  = (50/102) / (50/102 + 0.5/102)  
  = (50/102) / (50.5/102) = 50 / 50.5 ≈ **100/101 (≈99.01%)**.  

  #### **SIA Calculation (Self-Indication Assumption):**  
  _Adjust the prior by the total number of observers (then apply Bayes)._  
  - SIA prior: P_SIA(H) ∝ P_prior(H) × (Number of observers under H).  
    - Both H₁ and H₂ have 102 observers → P_SIA(H₁) = (0.5 × 102) / [(0.5 × 102) + (0.5 × 102)] = 0.5.  
    (The 102 cancels out, leaving the original prior.)  
  - Update with evidence:  
    P_SIA(H₁ | Evidence) = [P(Evidence | H₁) × P_SIA(H₁)] / [P(Evidence | H₁) × P_SIA(H₁) + P(Evidence | H₂) × P_SIA(H₂)]  
    = [(100/102) × 0.5] / [(100/102) × 0.5 + (1/102) × 0.5]  
    = **100/101 (≈99.01%)** (same as SSA).  

  **Why they agree:**  
  - SSA and SIA differ only by a constant factor: the **total number of observers in the reference class**.  
  - In SIA, the factor is explicit in the prior adjustment: P_SIA(H) ∝ N × P_prior(H).  
  - In SSA, the factor is implicit in the likelihood: P(Evidence | H) = (Observers with evidence) / N.  
  - Here, N is **identical under both hypotheses** (N=102), so the N in SIA’s prior and SSA’s likelihood **cancel out** in the posterior ratio:  
    - Posterior ratio (H₁:H₂) = [P(Evidence | H₁) × P(H₁)] / [P(Evidence | H₂) × P(H₂)]  
    - SIA adds no extra factor because N is fixed → SIA posterior ratio = SSA posterior ratio.  

  ---

  ### Critical Feature and What Happens If Removed  
  **Feature doing the work:** The total number of observers (102) is identical under H₁ and H₂.  
  **If removed:** If H₁ and H₂ had different totals (e.g., H₁: 102 observers, H₂: 200 observers), SSA and SIA would diverge:  
  - **SSA** would strongly favor H₁ (smaller world) because P(Evidence | H₂) includes a larger denominator.  
  - **SIA** would favor H₂ (larger world) in the prior adjustment, pushing the posterior toward H₂.  
  This collapses into the "presumptuous philosopher" disagreement, where SIA favors larger worlds and SSA favors smaller worlds. The direction depends on which hypothesis has more observers.  

  ---

  ### What Each Side Claims About the Other  
  - **SIA proponent:** "This case shows SSA isn’t inherently biased toward small worlds. When the total observers are fixed, SSA updates rationally based on the evidence—just like SIA. SSA’s reputation for favoring small worlds only emerges when the total observer count varies."  
  - **SSA proponent:** "This case shows SIA isn’t inherently biased toward large worlds. When the total observers are fixed, SIA doesn’t inflate the prior for larger worlds—it reduces to the same update as SSA. SIA’s large-world bias only appears when totals differ."  
  **Who’s right?** Both are correct. The case proves that the SSA/SIA disagreement **only arises when the total number of observers differs across hypotheses**. When totals are fixed, the "indication" part of SIA (weighting by observer count) has no effect, and both reduce to standard sampling-based reasoning.  

  ---

  ### Objection: "The SSA/SIA Framing Is Confused"  
  **Strongest version:** "This case is circular! It assumes the SSA/SIA framing by defining ‘evidence’ as indexical sampling from a reference class. In reality, we don’t know if we were randomly sampled—we might have additional information about our existence that breaks the symmetry. The agreement is an artifact of the setup."  
  **Response:**  
  - **Fair to the literature?** Yes, this objection targets how anthropic reasoning is formalized. SSA/SIA are tools to handle indexical uncertainty, and any case using them will inherit this framing.  
  - **Fair to this case?** No. The case doesn’t assume SSA/SIA; it **leverages real-world randomization** (the coin flip and random attendee selection) to justify the sampling assumption. The agreement emerges from the fixed observer count, not the framing. If the objection holds, it applies equally to all sampling-based reasoning (e.g., medical trials), not just anthropics.  
  **Conclusion:** The case cleanly isolates the role of total observers in SSA/SIA disagreements, making it a valid pedagogical tool—even if the broader framework is debated.  

  ---

  ### Summary for Your Group  
  This case shows that SSA and SIA **agree when the total number of observers is fixed**, differing only by a constant factor that cancels out. The core disagreement isn’t about "big worlds vs. small worlds" per se—it’s about whether the **total observer count is evidence**. Use this to frame the SSA/SIA split: when totals vary, SSA ignores it (treating it as non-evidence), while SIA treats it as evidence.
