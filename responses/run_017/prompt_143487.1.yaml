  P(you in room A | Tails) = 1/7.9e9

  Then:
  P(Heads | you in room A) = [ (100/7.9e9) * 0.5 ] / [ (100/7.9e9)*0.5 + (1/7.9e9)*0.5 ] = 100 / (100+1) = 100/101

