  Constraints:
  - Terrestrial and ordinary setting.
  - Two hypotheses: one with few observers sharing your evidence, one with many (at least 10:1 ratio).
  - The total number of observers (in the reference class) must be the same under both hypotheses.
  - Priors must come from a random procedure (e.g., a coin flip).
  - Evidence must shift the odds under both SSA and SIA.
  - Robust to reference class: if we change the reference class (e.g., from everyone in the scenario to all humans), the verdict should not change because the total number of observers in the reference class remains fixed and the same under both hypotheses.
