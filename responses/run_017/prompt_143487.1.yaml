    P(you in A | heads) = 100/102
    P(you in A | tails) = 1/201
    Posterior heads: [ (100/102)*(1/2) ] / [ (100/102)*(1/2) + (1/201)*(1/2) ] = (100/102) / (100/102 + 1/201) = ... which is about 1.

