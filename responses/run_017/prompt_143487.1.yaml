  Both SSA and SIA yield this result.

  Now, to present it:

  Write the scenario in a paragraph, then run the numbers.

  **Paragraph for the group:**

  "Imagine you are attending a conference. The organizers flip a fair coin to decide how to assign attendees to two large rooms, A and B, and a small room C. If heads, room A gets 100 attendees, room B gets 1, and room C (the speaker's room) gets 1. If tails, room A gets 1, room B gets 100, and room C gets 1. So there are always 102 attendees total. You are randomly selected to be one of the 102. You look at your badge and see you are assigned to room A. What's the probability the coin was heads?"

  **Arithmetic:**

  Under both SSA and SIA, we get:

  Prior: P(heads) = P(tails) = 1/2

  Now, the likelihood of observing that you are in room A:

  - If heads, there are 100 attendees in room A out of 102.
  - If tails, there is 1 attendee in room A out of 102.

