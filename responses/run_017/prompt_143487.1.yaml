  But we want the evidence to be about the wing and your location.

  Here's a better scenario:

  **The Conference Room Mystery**

  A conference center has two large rooms: Room A and Room B. The organizers flip a fair coin. If heads, they will put 100 attendees in Room A and 1 attendee in Room B. If tails, they put 1 attendee in Room A and 100 attendees in Room B. 

