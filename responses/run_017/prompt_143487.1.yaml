    Prior: P_{SIA}(heads) ∝ (1/2)*102, P_{SIA}(tails) ∝ (1/2)*201
    So P_{SIA}(heads) = 102/(102+201) = 102/303 ≈ 0.336
    Then update on being in A:
      P(you in A | heads) = 100/102
      P(you in A | tails) = 1/201
    Posterior: [ (100/102) * (102/303) ] / [ (100/102)*(102/303) + (1/201)*(201/303) ] 
      = [100/303] / [100/303 + 1/303] 
      = 100/101

  So SSA gives nearly 1, SIA gives 100/101. They disagree.

  **What each side claims:**
  - SIA proponent: In the fixed total case, we see that SSA does not inherently favor smaller worlds; it updates based on the likelihood of your observations. Only when the total number of observers varies does SSA become biased toward smaller worlds.
  - SSA proponent: In the fixed total case, we see that SIA does not inherently favor larger worlds; it only adjusts for the fact that larger worlds have a higher chance of containing observers. When the total is fixed, it doesn't adjust the prior.

  **Objection:** The whole SSA/SIA framing is confused. The strongest version: the case only works because we've defined the reference class to be the attendees, but in reality, we might have additional information about how we came to be in the scenario. Moreover, the random sampling assumption might be unjustified.

  Response: The case is designed to be a clean example where random sampling is explicitly part of the setup (you are randomly selected from the attendees). It illustrates that when the total number of observers is fixed, the two methods agree. The objection might be valid in more complex real-world cases, but for pedagogical purposes, this case is sound.

  Thus, we have our warm-up case.
