answer: |-
  ## Dissertation Chapter Proposal: "Anchoring Regret: Agentless Rationales and the Inheritance Problem"

  **Question (≈200 words)**
  The core question is whether agentless rationales – considerations that favour a state of affairs obtaining, even when no agent was, is, or could be in a position to bring it about – genuinely exist and, crucially, *how* they exert normative force if they do. Specifically, if they exist, how do they "inherit" into the normative landscape for beings who *can* respond, just not by altering the outcome? The debate isn't *just* about their existence (though that's contested), but about the *mechanism of inheritance*: does the rationale translate directly into reasons for action (even if discounted by impossibility), reasons for specific attitudes only (like regret or relief), or not at all? My chapter will argue for a specific *attitudinal inheritance* view, "anchoring": agentless rationales *exclusively* ground the fittingness of certain reactive attitudes (like regret, relief, grim satisfaction) towards unalterable states of affairs. The determinate answer sought is the precise nature of this inheritance relation and how it handles cases where agents stand in different relations *to* the rationale's target state, even when equally powerless *now*.

  **Why the existing options leave it open (≈350 words)**
  The standard positions seem exhaustive but stall on a critical case. The *action-inheritance* view claims agentless rationales become (perhaps discounted) reasons for action for anyone who *could* influence the outcome. The *pure attitude-inheritance* view claims they *only* make reactive attitudes fitting. The *eliminativist* view denies they exist as genuinely normative. The *merely verbal* objection, strongest here, argues that talk of "agentless reasons" is just a misleading way to describe evaluative facts (e.g., "It's bad that the asteroid hit") or projected attitudes, adding nothing normative. This gains traction because standard cases (regretting a past disaster no one could stop) *seem* explicable by all views: eliminativists cite projection, attitude-inheritors cite fittingness, action-inheritors cite hypothetical reasons.

  **What rebuts the merely verbal objection?** A case where these views yield *different, testable predictions* about the *fittingness* of an attitude in a scenario involving an unalterable outcome, specifically concerning agents differentially related to that outcome. If we find a scenario where the intuitive fittingness of (say) regret differs between two powerless agents based *only* on their historical/causal relation to the outcome, and this difference is predicted by one inheritance view but not others, then the dispute becomes substantive. The eliminativist must dismiss the intuitive difference as error; the action-inheritor must ground the difference in *past* action-guidance; the pure attitude-inheritor might struggle to explain it; my anchoring view needs to account for it structurally. Without such a discriminating case, the verbal objection stands. With it, the inheritance mechanism becomes the focus.

  **Method (≈350 words)**
  The chapter will proceed in four tightly focused stages:

  1.  **Phenomenon & Stalemate:** Establish the intuitive pull and linguistic evidence for agentless rationales in ordinary discourse (e.g., "There was reason for the earthquake not to happen, even if unavoidable"). Present the core debate (existence + inheritance options) and demonstrate the stalemate using standard cases where all views can offer *some* plausible explanation. Highlight the threat of the merely verbal objection. *Produces:* Clear articulation of the problem space and the need for a discriminating case.
  2.  **The Asymmetry Problem:** Introduce and rigorously analyze the critical case type: two agents, A and B, facing the *same* unalterable bad outcome O and the *same* agentless rationale against O. A is causally upstream of O through a blameless, non-intentional, non-foreseeable action (e.g., A flipped a switch years ago that initiated a harmless chain now causing O; B is a complete bystander). Intuition suggests A's regret (or similar attitude) is *more fitting* than B's, or fitting in a different *way*. *Produces:* A sharp formulation of the asymmetry challenge.
  3.  **Testing Inheritance:** Apply each major inheritance view to the asymmetry case.
      *   Eliminativism: Must deny any fittingness difference; the intuition is mistaken projection.
      *   Action-Inheritance: Must ground A's stronger regret in a *past* reason for action A had (or violated), even if blamelessly. But A had *no* reason *not* to flip the switch originally (it was blameless, unforeseeable).
      *   Pure Attitude-Inheritance: Struggles; if the rationale is purely agentless and only grounds attitude-fittingness *towards O*, why the difference between A and B?
      *   *Produces:* Diagnosis of where existing views falter on the asymmetry.
  4.  **Developing Anchoring:** Articulate the anchoring view: Agentless rationales *are* real normative anchors *for attitudes specifically about states of affairs*. Their inheritance relation is *directly* into the fittingness conditions of attitudes like regret, relief, satisfaction-at-avoidance. Crucially, anchoring incorporates the *mode of relation* to the anchored state. A's being causally upstream *through a past action* (even blameless) changes the *kind* of anchoring connection, making *agent-regret* (regret focused on one's own causal role) fitting for A, while only *impersonal regret* (sorrow at O's occurrence) is fitting for B. *Produces:* A defended, asymmetry-explaining account of inheritance.

  **What the chapter would establish, and what would sink it (≈300 words)**
  The chapter aims to establish that: 1) Agentless rationales are genuine normative entities, rebutting the eliminativist/verbal challenge. 2) Their normative inheritance is *exclusively* into the fittingness of reactive attitudes (anchoring), not directly into reasons for action. 3) The anchoring mechanism necessarily incorporates the agent's specific relation to the anchored state, explaining asymmetries like the upstream/bystander case. Success means providing a clear, coherent model of inheritance via anchoring that resolves the asymmetry problem better than rivals.

  **What will decide it?** The critical test is the constructed asymmetry case. The chapter succeeds if:
  *   The asymmetry intuition is robustly defended against eliminativist dismissal.
  *   Action-inheritance demonstrably fails to explain the asymmetry without smuggling in dubious past reasons.
  *   Pure attitude-inheritance fails to explain the asymmetry without an *ad hoc* addition.
  *   Anchoring provides the most parsimonious and explanatorily powerful account of the asymmetry *and* standard cases.

  **What would sink it (failure):**
  1.  If the asymmetry intuition collapses under scrutiny (e.g., if convincing arguments show A and B *should* feel the same regret, making the case useless for discrimination).
  2.  If action-inheritance *can* convincingly explain the asymmetry (e.g., by appealing to *objective* past reasons independent of blame or foresight).
  3.  If anchoring's explanation of the asymmetry feels like a disguised version of another view or merely labels the problem without solving it ("It's different because it's anchored differently!").
  4.  If anchoring cannot be articulated without collapsing into positing a hidden agent (divine or hypothetical).

  Failure means the chapter demonstrates that the asymmetry case doesn't break the stalemate or that no satisfactory inheritance model emerges, leaving the merely verbal objection standing.

  **Scope and biggest risk (≈150 words)**
  8,000 words is the right size: tight focus on the inheritance question via the asymmetry problem avoids sprawling metaphysics or exhaustive history. Stage 1 (≈1500w), Stage 2 (≈2000w - developing/presenting the case is crucial), Stage 3 (≈2000w), Stage 4 (≈2000w), Conclusion (≈500w).

  **Biggest Risk:** Success hinges entirely on the constructed asymmetry case doing heavy, unambiguous lifting. The risk is that the case is *too* specific or relies on contested intuitions, failing to convince skeptics that it genuinely discriminates between theories. If removing the "blameless upstream action" feature makes the intuitive asymmetry disappear, it validates the case's design. But if opponents successfully argue the asymmetry stems *only* from residual feelings of agential responsibility (undermining the "agentless" aspect) or evaluative facts alone, the core argument collapses. Managing this risk requires meticulous case design and robust defense of the intuition's normative (not merely psychological) significance.
