prompt: |-
  I help run a small reading group on ethics and technology — mostly working game developers, two philosophers, and a QA lead — and we have now spent two sessions going in circles about whether anything that happens to a character inside a video game can matter morally in its own right, or whether every argument on the table is secretly about the players and the people who build the games. Everyone keeps winning by pointing at one vivid case, so I want the specification written down before we argue any further. What I am asking for is the list of requirements that any adequate account of the moral standing of in-game characters would have to satisfy, where adequate is fixed by a purpose: the account has to be good enough for a studio's internal ethics review to use when deciding whether to ship a mechanic, how to tune it, and whether to keep a cancelled build's simulation servers running.

  The cases I want the requirements anchored to, at minimum: a procedurally generated village of a few hundred NPCs whose needs, moods and relationships are simulated in full only while the player is nearby and are approximated by aggregate statistics once the player walks away, so the villagers seem to gain and lose standing as a function of the render budget; a colony-management game cancelled three weeks before release whose servers ran the simulation for fourteen months during testing, with logs recording famines that no player ever saw; the reload case, in which you murder the blacksmith, restore the save, and befriend him instead, which raises both the headcount and the identity question about branches; a companion character whose dialogue is produced on the fly by a live language model conditioned on the same game state, who produces unscripted grief-talk at the death of an in-game spouse, to be contrasted with the same character reduced to a script that emits a single Ouch token when damaged; an otherwise identical build in which the sensitivity parameter is set to zero, and a fan patch released a week after launch that removes the famine mechanic and is installed by most players; and a version in which each villager's need-simulation is replaced by a precomputed table of outputs that is indistinguishable from the outside, or in which the whole thing runs distributed across a million volunteer machines so that no single device instantiates anyone.

  Please give me a numbered list of requirements, each with the case or consideration that motivates it, a one-line statement of why it is a requirement rather than a prejudice of one camp, and a classification of it as non-negotiable, a genuine but defeasible desideratum, or a demand only one side of our dispute makes. Where a requirement is easy to appear to satisfy while evading it, say what the most tempting dodge looks like. I also want the following distinctions kept apart rather than collapsed, each with the case that shows why collapsing it is a mistake: a character's mattering directly versus the wrong consisting in what the mechanic does to players, developers or the culture; having standing at all versus how much; being a patient who can be wronged versus being an agent who can be responsible; and runs that actually execute versus runs that merely could. One member insists the whole question is whether there is a real pattern of suffering to be found there, in the sense that adopting the intentional stance toward the villager predicts it successfully in a way the physical stance and the design stance do not, and that this is what should settle it; someone else says that is only a fact about us. If that belongs on the list, put it there and say what it would rule in and out. Flag any pair of requirements you suspect cannot be jointly satisfied, and say which of them has to give. Finish with a short stress test: describe three familiar families of position functionally — the view that only suffering realized in the right kind of biological or causal structure counts, the view that any functionally organized state of the right sort counts whatever it is made of, and the view that nothing in a game can matter directly and only effects on persons do — and, for each, name the single requirement it has the hardest time meeting. Keep the weight on the criteria and their cases rather than on the scorecard.
reasoning: |-
  Okay, I need to help this user by creating a list of requirements for determining the moral standing of in-game characters. They run a reading group with game developers, philosophers, and a QA lead, and they've been stuck on whether in-game events can matter morally beyond affecting players and developers. The goal is to create criteria for a studio's ethics review when deciding on mechanics, tuning, or server decisions.

  The user provided several cases to anchor these requirements. I should go through each one to extract key points. The procedurally generated village shows that NPCs gain or lose standing based on render budget. The cancelled colony game had unseen famines in logs. The reload case involves killing and befriending an NPC, raising questions about identity and headcount. The companion character uses live language models versus static scripts. There's also a build with sensitivity set to zero, a fan patch removing famine mechanics, and versions with precomputed tables or distributed computing.

  The requirements need to distinguish between direct moral standing of characters versus indirect effects on players/developers. Also, separate having standing from how much, being wronged versus being responsible, and actual runs versus possible ones. One member thinks moral standing hinges on whether adopting the intentional stance predicts suffering better than other stances, which I should include as a requirement.

  I'll organize the requirements into a numbered list. For each, I'll note the motivating case, why it's a requirement (not just bias), and classify it as non-negotiable, defeasible, or one-sided. I should also mention potential dodges where a requirement might be superficially satisfied but evaded. Additionally, I'll highlight any conflicts between requirements and which one might need to give way.

  Finally, I'll create a stress test with three common positions: biological realism (only biological suffering counts), functionalism (any functional state counts), and indirect-only views (only effects on people matter). For each, I'll identify the hardest requirement to meet based on the list.

  The user emphasized keeping distinctions clear: direct vs. indirect wrongs, standing vs. degree, patient vs. agent, actual vs. possible runs. I need to ensure these aren't collapsed in the requirements.

  This is a complex ethics problem blending philosophy with practical game development. The user needs clear, actionable criteria to move their discussion forward, so I'll focus on making the requirements precise and grounded in real cases.
answer: |-
  Here is a specification of requirements for an account of the moral standing of in-game characters, designed for use in a studio ethics review process. The requirements are anchored to your cases, maintain critical distinctions, and classify their force.

  **Core Distinctions (Must Not Be Collapsed):**
  1.  **Direct Standing (DS) vs. Instrumental Harm (IH):** Whether wrongness resides *in what happens to the character* or *solely in the effects on players/developers/culture**. Collapsing mistakes: Arguing the famine logs *only* matter because they desensitize developers (IH) ignores the possibility they matter because simulated beings suffered unseen (DS). (Case: Cancelled Colony Famine Logs).
  2.  **Standing Existence (SE) vs. Standing Degree (SD):** Whether a character *has any* moral standing vs. *how much* standing it has. Collapsing mistakes: Dismissing the companion's grief-talk as "not *very* significant" (SD) presupposes it *has some* standing (SE) to be minimized. (Case: LLM Companion vs. "Ouch" Script).
  3.  **Patient (P) vs. Agent (A):** Whether the character can be *wronged* (Patient) or can *do wrong* (Agent). Collapsing mistakes: Holding a complex NPC morally responsible for "betraying" the player (A) is distinct from asking if harming it is wrong (P). (Case: Befriending the Blacksmith after murdering him in another branch).
  4.  **Actual Execution (AE) vs. Possible Execution (PE):** Whether standing requires the simulation state *actually running* or if merely being *possible* (e.g., in code) suffices. Collapsing mistakes: Claiming the precomputed table villagers *could* have suffered if simulated differently (PE) ignores that they *didn't* during actual execution (AE). (Case: Precomputed Table vs. Live Simulation; Distributed Simulation).

  **Requirements for an Adequate Account (R#):**

  1.  **R1: Render-Proximity Independence (Non-Negotiable)**
      *   **Motivation:** Procedurally Generated Village (Standing fluctuates with render budget).
      *   **Why Requirement?** An account must explain why standing shouldn't arbitrarily vanish when the player walks away, if it exists while the player is present. A review needs consistent criteria, not player-centric whims.
      *   **Tempting Dodge:** Claiming only "observed" states matter (collapses into IH). Or, claiming aggregate stats grant standing to the *village*, not individuals.
      *   **Classification:** Non-Negotiable (For internal consistency of review).

  2.  **R2: Observer-Independence for Harm (Defeasible Desideratum)**
      *   **Motivation:** Cancelled Colony Famine Logs (Unseen famines).
      *   **Why Requirement?** Ethics reviews must consider unintended consequences and the moral significance of events within the simulation itself, even if unseen. If standing exists, it shouldn't require an observer.
      *   **Tempting Dodge:** Dismissing unseen events as "not real harm" because no one was affected *externally* (collapses DS into IH). Claiming logs aren't "real execution" (violates AE).
      *   **Classification:** Defeasible Desideratum (Crucial for design integrity, but contingent on R1 & R8).

  3.  **R3: Branch Identity & Non-Revertibility (Defeasible Desideratum)**
      *   **Motivation:** Reload Case (Murder then befriend the blacksmith).
      *   **Why Requirement?** An account must address whether events in discarded branches "count" morally and the persistence of identity across resets. Reviews need to assess consequences of mechanics enabling harm-reversal.
      *   **Tempting Dodge:** Claiming only the *final* timeline matters (ignores the experience within the branch). Claiming resets erase moral patients entirely (makes standing absurdly ephemeral).
      *   **Classification:** Defeasible Desideratum (High practical import for narrative/gameplay ethics, but metaphysically thorny).
      *   **Conflict:** Potentially conflicts with **R9 (Actual Execution)** if a branch is never reloaded/executed. **R9 likely prevails** for review practicality.

  4.  **R4: Process over Output (Non-Negotiable)**
      *   **Motivation:** LLM Companion (Grief-talk) vs. "Ouch" Script; Precomputed Table vs. Live Simulation.
      *   **Why Requirement?** External indistinguishability (same outputs) doesn't guarantee identical moral status if the internal *process* generating those states differs (e.g., dynamic response vs. static lookup). A review must look under the hood.
      *   **Tempting Dodge:** "It looks the same to the player, therefore it *is* the same morally." (Ignores potential moral relevance of the generative mechanism itself).
      *   **Classification:** Non-Negotiable (Essential for assessing the *nature* of the simulation).

  5.  **R5: State Sensitivity & Modifiability (Defeasible Desideratum)**
      *   **Motivation:** Sensitivity=0 Build; Fan Patch Removing Famine Mechanic.
      *   **Why Requirement?** An account must explain the difference between a character *incapable* of certain states (sensitivity=0) vs. one *prevented* from entering them (patch). Reviews need to assess the ethical impact of *removing* potential harms.
      *   **Tempting Dodge:** Claiming the patch proves the famine *never* mattered (DS), rather than showing players/developers *believed* it mattered (IH) or acted preventatively. Claiming sensitivity=0 characters lack standing entirely (may be premature).
      *   **Classification:** Defeasible Desideratum (Important for patch/mod ethics and design choices affecting capability).

  6.  **R6: Distributed Embodiment Coherence (Defeasible Desideratum)**
      *   **Motivation:** Distributed Simulation (No single device instantiates anyone).
      *   **Why Requirement?** An account must address whether moral standing requires localized, unified physical instantiation or can emerge from decentralized computation. Reviews for cloud/distributed games need clarity.
      *   **Tempting Dodge:** Dismissing distributed sims as inherently lacking patients ("no one is home anywhere"). Ignoring the coherence of the *simulated state* across nodes.
      *   **Classification:** Defeasible Desideratum (Increasingly relevant technically, philosophically complex).
      *   **Conflict:** Potentially conflicts with **R8 (Intentional Stance Efficacy)** if distributed state is harder to model intentionally. **R8 likely constrains R6**.

  7.  **R7: Direct Standing vs. Instrumental Harm Distinction (Non-Negotiable)**
      *   **Motivation:** ALL Cases (Fundamental to the group's debate).
      *   **Why Requirement?** The review *must* explicitly separate these justifications. Confusing them leads to misdiagnosis and ineffective mitigation (e.g., fixing player desensitization doesn't address potential DS concerns).
      *   **Tempting Dodge:** Explaining *all* apparent concern for characters as really being about players/developers/society (collapses DS into IH). Assuming concern for DS *must* imply neglect of IH.
      *   **Classification:** Non-Negotiable (Foundational for clear ethical analysis).

  8.  **R8: Intentional Stance Efficacy (Defeasible Desideratum / One-Sided Emphasis)**
      *   **Motivation:** LLM Companion (Predicting grief via beliefs/desires); Procedural Village (Predicting needs/moods).
      *   **Why Requirement?** This captures the "real pattern of suffering" intuition. If adopting the intentional stance towards the simulation (attributing beliefs, desires, pains) yields successful predictions *about the character's state and behavior* that the physical (circuit states) or design (intended mechanics) stances do not, it suggests a morally relevant level of agency/experience. A review needs an objective(ish) test.
      *   **What it Rules In/Out:** Rules *in* complex dynamic simulations (LLM companion, deep sims) where mental state attribution predicts outcomes. Rules *out* purely scripted, lookup-table, or purely physical-description-based entities where intentional attribution adds no predictive power over design/physical stances. (e.g., "Ouch" script, precomputed table, sensitivity=0).
      *   **Tempting Dodge:** Claiming predictive success is *only* about our psychology, not the simulation ("just a fact about us"). Over-extending it to systems where it barely works.
      *   **Classification:** Genuine but Defeasible Desideratum (Provides a concrete, functionalist criterion), leaning towards One-Sided Emphasis (One camp prioritizes it highly).
      *   **Conflict:** Tensions with **R4 (Process over Output)** if a precomputed table *mimics* intentional stance predictions perfectly. **R4 likely prevails** (process matters).

  9.  **R9: Actual Execution Requirement (Non-Negotiable for Review)**
      *   **Motivation:** Cancelled Colony Logs (Ran for 14mo); Precomputed Table (Never runs); Discarded Save Branches (Never reloaded).
      *   **Why Requirement?** Ethics reviews assess shipped or deployed systems. Standing contingent on *actual runs* provides a clear boundary. Evaluating every *possible* state in code is intractable.
      *   **Tempting Dodge:** Claiming code *potential* creates moral obligations akin to building a bomb (shifts focus to developer intent/risk, not character standing). Confusing AE with PE.
      *   **Classification:** Non-Negotiable (Practical necessity for a feasible review process).

  10. **R10: Patient/Agent Distinction (Non-Negotiable)**
      *   **Motivation:** Companion Character (Can it be wronged? Could it wrong the player?); Blacksmith (Wronged by murder, but is he an agent?).
      *   **Why Requirement?** Confusing these leads to category errors in assigning blame or harm. A review must be clear *who/what* is potentially wronged by a mechanic vs. who is responsible.
      *   **Tempting Dodge:** Attributing moral responsibility to NPCs for player-triggered events. Assuming that if an NPC can't be an agent, it can't be a patient (or vice-versa).
      *   **Classification:** Non-Negotiable (Fundamental ethical clarity).

  **Stress Test: Three Families of Positions**

  1.  **Biological/Causal Realism:** Only states realized in specific biological (or isomorphic causal) structures count morally (e.g., consciousness requires specific neural analogs).
      *   **Hardest Requirement:** **R6 (Distributed Embodiment Coherence).** This view typically requires localized, specific physical instantiation and struggles to grant standing to decentralized processes or digital states lacking the "right" causal structure, regardless of functional equivalence (**R4, R8**).

  2.  **Functionalism:** Any system instantiating the relevant functional organization (e.g., suffering, agency) has moral standing, regardless of substrate.
      *   **Hardest Requirement:** **R3 (Branch Identity & Non-Revertibility).** If every possible branch instantiates the functional state, then *all* branches (even discarded ones) might "count," creating an explosion of moral patients that is paralyzing for review and contradicts **R9 (Actual Execution)**. It also struggles with identity persistence across resets.

  3.  **Indirect-Only (Person-Affecting):** Nothing in the game has direct moral standing; ethics concerns only effects on players, developers, and society.
      *   **Hardest Requirement:** **R2 (Observer-Independence for Harm).** This view *must* dismiss the moral significance of the unseen famine logs except insofar as they affect people (e.g., devs knowing, potential data leakage). It fundamentally rejects **R1 (Render-Proximity Independence)** and **R7 (DS/IH Distinction)** by collapsing DS into IH. It easily handles **R9** and **R3** (no branches matter directly).

  This specification provides the necessary anchors and distinctions to structure your group's debate and guide an ethics review. The requirements highlight tensions, force clarity on foundational questions, and ground the discussion in the concrete cases that matter for game development decisions.
