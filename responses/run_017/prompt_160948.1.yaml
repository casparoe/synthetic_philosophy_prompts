answer: |-
  Here’s how I’d lay out that audit of the "statue as book" analogy for your piece, keeping it grounded and conversational:

  **Mapping the Analogy (Plain Sentences):**  
  Imagine the statue *is* a book. The **author** is the historical figure himself—his life and deeds are the content. The **reader** is the public encountering the statue. The **library** is the public square or civic space where it stands. The person who **commissioned** the statue is like the book’s publisher or patron. A **copy** would be… well, here’s the first snag: there’s usually only one statue, while books have many copies. **Burning** is removing/destroying the statue, erasing him from public view entirely.

  **Where the Analogy Fails (and Why It Matters):**  
  1. **Function Clash (Critical):** A book’s core purpose is informational—it *exists to be read*. A statue’s core purpose is honorific—it *exists to be admired*. Tearing down a book destroys knowledge; moving a statue changes an honor. This isn’t just decoration—it guts the whole "memory hole" claim. Removing a statue isn’t deleting history; it’s revoking praise.  
  2. **Scarcity & Neutrality (Critical):** Public squares aren’t neutral libraries storing facts. They’re highly visible, limited "honor real estate." Keeping a statue there isn’t passive storage; it’s an *active, ongoing endorsement* by the current community maintaining it. The analogy smuggles in the idea that the square is an archive, not a stage for hero-worship.  
  3. **Uniqueness vs. Multiplicity (Less Critical):** Burning a book can erase unique knowledge if all copies are lost. Removing a statue doesn’t erase the man—he’s still in history books, archives, maybe even museums. This weakens the "destroying history" panic but doesn’t break the analogy’s core error about *function*.  
  4. **Agency Twist (Critical):** Book burning is typically top-down suppression (authority destroying what people want). Statue removal is usually bottom-up reassessment (community debating who it publicly venerates). Framing removal as "censorship" flips the power dynamic.  

  **Does "Contextualize, Don’t Remove" Survive?**  
  Once you see the statue’s primary job is *praise*, not *record-keeping*, the "just add a plaque" solution gets shaky. A plaque isn’t a neutral footnote; it’s often a *counter-narrative* bolted onto a monument designed for reverence. Imagine stapling a critical essay onto the cover of a hagiography—the two messages clash. The statue screams "Hero!," the plaque whispers "...but also exploiter." Does context truly neutralize ongoing honor, or just create dissonance? Sometimes the plaque *is* the compromise, acknowledging history while downgrading the honor—but it’s not the seamless "best of both worlds" the analogy suggests. The plaque option works *because* it tacitly accepts that removal is about reassessing praise, not preserving facts.

  **The Street Name Problem:**  
  The book analogy collapses utterly here. You don’t "read" a street name passively; you *say it aloud*. Using "Industrialist Avenue" forces residents to *verbally endorse him* constantly—in addresses, directions, official forms. There’s no space for a plaque; the name itself is the honor. Removing it isn’t "burning a book"; it’s more like *retiring a championship banner* after a player’s misconduct is revealed, or *stopping a forced salute*. The core violation is being made to *perform* honor. A better analogy might be an unwanted toast: keeping the name is like being compelled to raise your glass and cheer someone you now find reprehensible. Renaming isn’t erasure; it’s refusing to keep cheering.

  **Who Decides? (Briefly):**  
  Ideally, the decision belongs to the community living with these symbols *today*, through a process that acknowledges both historical ties and present values. This means inclusive deliberation—not just descendants of the elite or activists, but a cross-section including those marginalized by the honored figure’s legacy. Why? Because public symbols speak *for the community now*, not just to its past. The goal isn’t unanimous approval, but legitimacy through fair representation and honest reckoning with what these honors *do* in the present.  

  This isn’t about picking a side; it’s about showing why the "book" analogy, while emotionally potent, misdiagnoses the core question: not "How do we preserve history?" but "Who do we *celebrate* in our most prominent spaces, and why?" Once that’s clear, the real debate—about values, not archives—can begin.
