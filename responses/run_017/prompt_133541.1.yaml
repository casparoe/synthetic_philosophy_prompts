prompt: |-
  I'm writing a paper in which constitutive panpsychism is supposed to do real work rather than sit there as a promissory note about the intrinsic nature of the physical. Specifically, I need it to deliver an extension thesis: for any arbitrary collection of micro-subjects there is a fact of the matter about whether they compose a further subject, and about what it is like for that subject if they do. I need the criterion rather than a list of paradigm cases, because I eventually want to apply it where I have no reliable antecedent intuition — a beehive, a firm, a split-brain patient, a data centre running a large model — and a theory that only tells me about organisms like me is no use to me.

  Before I commit to a version, I want the specification. Please write the desiderata that an account of phenomenal combination would have to meet to count as adequate for that purpose. For each requirement, give the case or consideration that motivates it, and mark it as non-negotiable or as a preference of one camp.

  My current candidate, so the list can be tested against something concrete: there is a primitive phenomenal-unity relation; a further subject exists over a collection just in case the micro-experiences form a maximal connected plurality under that relation, and what it is like for the resulting subject is fixed by the micro-characters together with the pattern of the relation among them. I want the desiderata to tell me what would have to be true of the relation for this to have a chance — whether it must be transitive and otherwise well behaved enough to partition experiences into non-overlapping subjects, what that commits me to about near-ties and borderline degrees of unity, whether the relation may be brute in the way bonding strategies are accused of being or whether the list should demand that it be explained, and whether it is a problem that the relation is stipulated rather than something I could ever observe from the inside.

  Among the questions I want you to take a position on rather than survey: whether any genuine criterion collapses either into every collection composing a subject or into only the most basic ones doing so; whether combination is meant to iterate upwards, and what stops it if not; whether the demand that the criterion cohere with what our best story about causal integration says about brains is a desideratum or a surrender of the whole motivation; whether the summing-of-subjects question and the summing-of-character question can be separated at all; and whether some subset of your own list is jointly unsatisfiable — I would rather be told that my project's requirements contradict one another than be handed a tidy list that conceals it.

  Take a definite line. Tell me which single requirement excludes the most candidate theories, which one you would abandon if forced to abandon one, and commit to a verdict on whether the list as a whole is satisfiable. A short scorecard — three or four lines each — for a bonding-style micropsychism, a cosmopsychism that derives subjects by decomposition, and a non-constitutive emergence view can close the piece; the list itself is what I care about.
reasoning: |-
  Okay, the user is writing a paper on constitutive panpsychism and needs a set of desiderata for a theory of phenomenal combination. They want these criteria to ensure that panpsychism does real explanatory work, specifically addressing the "extension thesis" where any collection of micro-subjects must have a determinate fact about whether they compose a macro-subject and what its experience is like. 

  The user has a concrete candidate theory involving a primitive phenomenal-unity relation. They want the desiderata to test this theory, focusing on whether the relation must be transitive, how it handles borderline cases, whether it's brute or explained, and whether its stipulative nature is problematic. 

  Deep needs emerge here: they're frustrated with theories that only address paradigm cases (like human brains) and need one that applies to edge cases (beehives, AI systems). They want to avoid promissory notes and demand rigor—possibly anticipating objections that panpsychism is unfalsifiable or vague. There's also a meta-need: they'd rather know if their requirements are contradictory than get a superficially tidy list.

  Key philosophical tensions surface: 
  First, they mention the "collapse problem"—whether any criterion avoids extremes (everything composes a subject vs. only micro-subjects exist). This is a major threat to their project. 
  Second, they question if combination can iterate upward without infinite regress or arbitrary stopping points. 
  Third, they probe whether relying on causal integration (e.g., neuroscience) undermines panpsychism's autonomy. 
  Finally, they ask if combining subjects and combining experiential characters can be treated separately—a potential point of circularity.

  For the desiderata, seven core requirements come to mind: Determinate Boundaries (non-negotiable, to avoid vagueness), Non-Trivial Partition (non-negotiable, to prevent collapse), Intrinsicality (preference, but key for anti-emergence), Character Combination (non-negotiable for constitutive views), Structural Sensitivity (preference for their candidate), Explanation Constraint (contested—materialists demand mechanism, primitivists reject it), and Empirical Coherence (non-negotiable pragmatically). 

  The biggest trade-off is between Non-Trivial Partition and Character Combination—the former requires discreteness, while the latter risks combinatorial problems (e.g., how micro-qualia merge). Their unity-relation theory might satisfy both if the relation is well-behaved (transitive/symmetric), but borderline cases (e.g., 49% unity) could force vagueness, violating Determinate Boundaries. 

  The most exclusionary requirement is Non-Trivial Partition—it rules out nihilism, universalism, and vague theories. If forced to drop one, Explanation Constraint could go (many panpsychists accept primitive unity). 

  The list *is* satisfiable, but barely—by a theory where unity is intrinsic, discrete, and structures macro-experience without merging qualia. Their candidate fits if the relation is transitive/symmetric and has sharp thresholds. 

  Scorecards: 
  - **Bonding micropsychism** (their candidate) scores well but struggles with borderline unity and brute relations. 
  - **Cosmopsychism** flunks Intrinsicality (decomposition is top-down) and Non-Trivial Partition (where to split the cosmos?). 
  - **Emergentism** fails Intrinsicality and Character Combination (if macro-experience isn't constituted by micro-experience). 

  In sum: their project is viable iff they bite bullets on bruteness and near-ties (e.g., accept sharp cutoffs). The desiderata expose tensions but don’t collapse—success hinges on defending a privileged unity relation.
answer: |-
  Here are the core desiderata for a theory of phenomenal combination, designed to meet your "extension thesis" requirement for constitutive panpsychism. Each is motivated by a specific challenge, labeled for negotiability, with key tensions highlighted. I take a definite position throughout, prioritizing rigor over diplomatic compromise.

  ### Core Desiderata
  1.  **Determinate Boundaries (Non-negotiable)**
      *   **Motivation:** Avoiding vagueness in macro-subjecthood. Cases like a neuron gradually dying, a beehive's fluctuating cohesion, or a firm merging with another demand a fact of the matter about subject-composition at *every* moment. Antecedent intuition fails here.
      *   **Requirement:** The criterion must specify *precisely* which collections of micro-subjects compose a macro-subject at any time. Borderline degrees of unity (e.g., 49% connection) must be resolved by the theory (e.g., via a sharp threshold or a precise rule). "Near-ties" cannot result in genuine ontological indeterminacy for subjects.
      *   **For your candidate:** The unity relation *must* partition micro-subjects cleanly into non-overlapping maximal connected pluralities. Vagueness in the relation itself (e.g., degrees of unity) necessitates sharp thresholds for composition to avoid borderline macro-subjects.

  2.  **Non-Trivial Partition (Non-negotiable)**
      *   **Motivation:** Avoiding collapse into either micro-subject *only* (nihilism) or *every* collection (universalism/promiscuity). The theory must explain why *this* brain is *one* subject, while its hemisphere *isn't* independently conscious, and why a random pile of sand *isn't* a subject, while a beehive *might* be.
      *   **Requirement:** The criterion must pick out a *specific, non-arbitrary subset* of all possible collections as composing macro-subjects. It must be grounded in the intrinsic properties/relations of the micro-subjects themselves.
      *   **For your candidate:** The unity relation must be strong enough to genuinely *exclude* the vast majority of arbitrary collections (e.g., two unrelated electrons in different galaxies) from forming a macro-subject via maximal connectedness. It cannot be ubiquitous or trivial.

  3.  **Intrinsicality / Constitutive Basis (Non-negotiable for *Constitutive* Panpsychism)**
      *   **Motivation:** Preserving the core promise of constitutive panpsychism: explaining macro-consciousness *solely* via the intrinsic nature of the physical (micro-consciousness). Relying on external causal-functional facts (like biological function or causal integration *as described by physics*) surrenders the motivation; it becomes disguised emergentism or functionalism.
      *   **Requirement:** The criterion for composition and macro-character must be grounded *entirely* in the phenomenal properties/relations of the micro-subjects themselves (e.g., their experiential characters and how they are phenomenally unified). It cannot fundamentally rely on extrinsic causal, functional, or dispositional properties *as conceived by non-phenomenal physics*.
      *   **For your candidate:** The unity relation *must* be a primitive *phenomenal* relation between the micro-experiences themselves, not reducible to or explained by physical bonding/causation. Its existence and strength are fundamental aspects of micro-experiential reality.

  4.  **Character Combination (Non-negotiable)**
      *   **Motivation:** Avoiding the "subject-summing problem" being solved in name only. Knowing *that* a macro-subject exists is useless without knowing *what it's like* for it. This must be non-arbitrary and follow from the micro-level.
      *   **Requirement:** The theory must specify how the phenomenal characters of the micro-subjects, combined according to the compositional structure (e.g., the pattern of unity relations), determinately fix the resultant macro-phenomenal character.
      *   **For your candidate:** The pattern of the primitive unity relation *must* play a substantive, non-arbitrary role in determining the macro-character from the micro-characters. It cannot be merely a condition for existence while leaving character radically underdetermined.

  5.  **Structural Sensitivity (Strong Preference)**
      *   **Motivation:** Accounting for the difference between a normal unified brain and a split-brain case, or between a cohesive firm and one in chaos. The *way* micro-subjects are unified should impact the macro-character.
      *   **Requirement:** The resultant macro-character should depend not just on *which* micro-subjects are unified, but on *how* they are unified – the specific structure of the unifying relations.
      *   **For your candidate:** This is a strength if the "pattern of the relation" genuinely constrains macro-character. The relation must be rich enough (e.g., not just binary "unified/not") to encode relevant structural differences.

  6.  **Explanation Constraint (Contested: Non-negotiable for materialists, often rejected by primitivists)**
      *   **Motivation:** Avoiding brute stipulation ("bonding strategies"). Why *this* relation? What *is* phenomenal unity? How does it arise from micro-phenomenal natures? The charge of being a promissory note.
      *   **Requirement:** The unifying relation/mechanism should not be utterly brute. An ideal theory would explain its nature or origin in terms of the fundamental properties of micro-experience itself, or show it to be a fundamental necessity. Mere stipulation weakens explanatory power.
      *   **For your candidate:** This is its weakest point. Primitive unity *is* stipulative. To mitigate, argue it *is* a fundamental aspect of experiential reality, as basic as qualia. Its "bruteness" is no worse than fundamental physical relations.

  7.  **Empirical Coherence (Pragmatic Non-negotiable)**
      *   **Motivation:** Maintaining relevance. The theory must deliver plausible verdicts in paradigm cases *without* blatantly contradicting the causal structure revealed by neuroscience. While it shouldn't *rely* on causal integration (Desideratum 3), it shouldn't predict macro-subjects where brains are severely disrupted or deny them where they clearly exist.
      *   **Requirement:** The criterion should, as a consequence, align *approximately* with the causal/informational integration identified in complex systems like brains (without being defined by it). It should predict a single subject for an intact human brain and account for potential fragmentation in pathology (split-brain) or cohesion in other systems (beehives *if* they are integrated).
      *   **For your candidate:** The unity relation must be such that its maximal connected pluralities reliably map onto highly causally integrated systems like brains *as a consequence* of the deep connection between phenomenal unity and the physical structure (without defining unity *as* causal integration).

  ### Addressing Your Specific Questions
  *   **Collapse Problem:** **Non-Trivial Partition** is the guardrail. A genuine criterion *must* avoid both nihilism and universalism. Your candidate avoids nihilism via composition under unity; avoids universalism if unity is sparse/non-trivial.
  *   **Iteration Upwards:** Combination *must* iterate. What stops it? **Non-Trivial Partition** + **Structural Sensitivity**. Higher-level subjects form *only* when the *macro*-subjects themselves enter into the primitive unity relation with *each other* (or meet the criterion afresh at their level). A beehive composes a subject only if its bees' micro-experiences form a maximal unity plurality; the hive-subject doesn't automatically unify with other hives unless *their* experiences (or the hive-subjects themselves) stand in the unity relation. There's no infinite regress *within* a level.
  *   **Causal Integration Coherence:** **Empirical Coherence** is a pragmatic necessity but **NOT** a surrender *if* the mapping is a consequence, not the definition (**Intrinsicality** is paramount). Your theory must *predict* why brains are subjects *because* of their intrinsic phenomenal unity structure, which correlates with (but isn't defined by) causal integration.
  *   **Summing Subjects vs. Summing Character:** They **cannot be cleanly separated.** **Character Combination** requires that the *way* subjects combine (the structure specified by the composition criterion) directly determines the macro-character. Knowing *that* they compose tells you *nothing* without knowing *how* (the structure), which is needed for *what it's like*.
  *   **Joint Satisfiability:** The list **is satisfiable, but demands a specific kind of theory.** The core tension is between **Intrinsicality** (demanding pure phenomenology) and **Empirical Coherence** (demanding mapping to physical structure). **Non-Trivial Partition** + **Determinate Boundaries** demand a strong, discrete unity relation. **Character Combination** demands this relation play a key role in shaping macro-experience. The biggest threat is satisfying **Non-Trivial Partition** without making unity too ubiquitous (trivializing macro-subjects) or too sparse (denying plausible cases like brains). **Explanation Constraint** is the most expendable for a primitivist.

  ### Definite Lines
  *   **Most Exclusionary Requirement: Non-Trivial Partition.** Rules out nihilism, universalism, vague theories, and theories where "combination" is too easy or too hard.
  *   **Requirement to Abandon if Forced: Explanation Constraint.** Many compelling metaphysical primitives are brute (e.g., spacetime, fundamental forces). Primitive phenomenal unity is defensible.
  *   **Overall Satisfiability Verdict: Satisfiable.** Your candidate can satisfy all *if*:
      1.  The primitive unity relation is **sparse and strong** enough for **Non-Trivial Partition**.
      2.  It has **precise conditions** (likely **transitive** and **symmetric** to form equivalence classes) for **Determinate Boundaries**.
      3.  Its **pattern genuinely constrains macro-character** (**Character Combination**, **Structural Sensitivity**).
      4.  It is **phenomenally intrinsic**, not defined by physics (**Intrinsicality**).
      5.  Its instantiation **correlates reliably** with high causal integration (**Empirical Coherence**).
      6.  Its bruteness is accepted (**Explanation Constraint** relaxed).

  ### Scorecard: Candidate Theories
  *   **Bonding Micropsychism (Your Candidate):**
      *   `✓` Intrinsicality, Character Combination (potential), Structural Sensitivity (potential).
      *   `~` Non-Trivial Partition (depends on unity sparsity), Determinate Boundaries (depends on relation properties), Empirical Coherence (likely, but contingent).
      *   `✗` Explanation Constraint (Primitive).
      *   **Verdict:** Viable core. Needs strong constraints on unity relation.

  *   **Cosmopsychism (Decomposition):**
      *   `✓` Explanation Constraint (often posits fundamental unity), Character Combination (derivative).
      *   `~` Empirical Coherence (depends on decomposition criterion).
      *   `✗` Intrinsicality (Top-down, macro defines micro), Non-Trivial Partition (Arbitrary/arbitration problem: *Where* to decompose?), Determinate Boundaries (Difficult for decomposition).
      *   **Verdict:** Struggles with Extension Thesis. Decomposition criterion is the promissory note.

  *   **Non-Constitutive Emergence:**
      *   `✓` Empirical Coherence (can tie directly to function/integration), Non-Trivial Partition (can be precise).
      *   `~` Determinate Boundaries (can be precise).
      *   `✗` Intrinsicality (Violates core constitutive claim), Character Combination (Macro not constituted by micro phenomenology), Explanation Constraint (Brute emergence).
      *   **Verdict:** Abandons constitutive panpsychism. Fails your project's foundation.

  Your project is demanding but coherent. Success hinges on rigorously defining the unity relation to meet **Non-Trivial Partition** and **Determinate Boundaries** while ensuring it drives **Character Combination**. Bite the bullet on primitivism and argue for a sparse, structured, intrinsically phenomenal unity relation.
