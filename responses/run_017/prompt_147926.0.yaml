answer: |-
  Here's a practical, step-by-step procedure designed for your archive team, based on epistemological principles (tracking theory/"sensitivity" and closure) but streamlined for real-world use. It focuses on **source reliability** and **inferential risk**. Aim for **one claim per assessment**.

  ---

  ### **The Claim Assessment Procedure (CAP)**
  **Goal**: Decide whether to state a claim **flatly** (P), **hedged** (e.g., "reportedly P"), or **omit** it.  
  **Time Limit**: 10 minutes max per claim. If stuck at any step, default to "hedge" or "omit".

  #### **Steps in Order**  
  1. **Write the claim as a single, clear sentence**  
     *e.g., "The mill burned down in 1908."*  
     → If it’s vague or complex, split it into separate claims. **STOP** if you can’t clarify it.

  2. **Describe the source/inference route in one sentence**  
     *Rule of Thumb*: **Goldilocks Detail**—Specific enough that another volunteer could replicate the process, but not exhaustive.  
     *Bad*: "From old records."  
     *Good*: "From a 1978 *Town Herald* clipping citing a 1908 fire department log."  
     *Bad*: "We inferred it."  
     *Good*: "Inferred from Building Dept. records showing no operational permits after 1908."  
     → If the route is too vague to describe this way, **HEDGE** or **OMIT**.

  3. **Source Sensitivity Test**  
     Ask: **"If this claim were FALSE, would our source/inference method STILL have led us to believe it?"**  
     *Good answer*: "No, because [specific reason]."  
     *Bad answer*: "Probably not" (without evidence).  
     → If "yes" or "unsure," **HEDGE** or **OMIT**.  
     *(Judgment call)*: Be honest about plausible error paths (e.g., biased sources, transcription errors).

  4. **Inference Check** (Skip if directly sourced)  
     Is this claim **inferred** from other facts? If yes:  
     - **A. Premise Check**: Run Steps 2–3 on the premise(s). If premises are hedged/weak, **HEDGE** the conclusion.  
     - **B. Step Sensitivity Test**: **"If this inference step were INVALID (e.g., illogical, missing context), would we STILL have made it?"**  
       *Good answer*: "No, because [e.g., it’s a direct cause/effect; we cross-checked context]."  
     - **C. Inference Limits**:  
       - **0 steps**: Direct source (no inference).  
       - **1 "obvious" step**: Allowed if it passes 4B (e.g., "mill burned → not operating next year").  
       - **Chain of 2+ steps** or **stitched claims**: Requires re-checking premises from scratch.  
       - **Background knowledge**: If you had to look it up, treat it as a new claim and run CAP.  
       - **Negative claims** (e.g., "nobody drowned"): Requires proof records *should* exist and are complete (see Example 3).  
     → If inference fails 4B or has >1 step without re-check, **HEDGE**/**OMIT**.  
     *(Judgment call)*: "Obvious" means 95% of informed locals would agree *without debate*.

  5. **Final Decision**  
     - Passed all steps? → State **FLATLY**.  
     - Failed any step? → **HEDGE** (e.g., "records suggest," "tradition holds") or **OMIT** if too weak.  
     - **Log Reason**: 1–2 sentences citing the failed step (e.g., "Hedged: Inference relies on unstested premise").  

  ---

  ### **Worked Examples**  
  **Example 1**: *"The mill wasn’t operating in 1909."*  
  - **Step 1**: Clear claim.  
  - **Step 2**: "Inferred from a 1978 newspaper clipping stating the mill burned in 1908."  
  - **Step 3** (Source Sensitivity): **FAIL**. If false (mill burned but reopened), the clipping *would still* lead us to believe it wasn’t operating (it doesn’t mention rebuilds).  
  - **Stop**: **HEDGE** (e.g., "likely not operating").  
    *Log*: "Premise (burn) true, but no evidence on post-fire status. Inference fails Step 3."  

  **Example 2**: *"The swimming hole closed in 1974 due to solvent dumping by the upstream plant."*  
  - **Step 1**: Clear claim.  
  - **Step 2**: "Common knowledge: town tradition, plaque, no dissent in living memory."  
  - **Step 3** (Source Sensitivity): **FAIL**. If false (e.g., closure was for safety, dumping was minor), townspeople *would still believe it* (plaque entrenches the story).  
  - **Stop**: **HEDGE** (e.g., "widely attributed to").  
    *Log*: "Fails Step 3: Consensus persists even if false."  

  **Example 3**: *"Nobody drowned in the river that summer."*  
  - **Step 1**: Clear claim (negative).  
  - **Step 2**: "No mentions in all local newspapers from June–August 1972."  
  - **Step 3** (Source Sensitivity): **FAIL**. If false (a drowning occurred but went unreported), our method *would still* lead us to believe it didn’t happen.  
  - **Stop**: **OMIT** or extreme hedge (e.g., "No recorded drownings").  
    *Log*: "Negative claim fails Step 3; records may be incomplete."  

  ---

  ### **One-Page Cheat Sheet**  
  **Tape this above the scanner!**  

  ---

  **CLAIM ASSESSMENT PROCEDURE (CAP)**  
  *10 minutes max per claim. Default to HEDGE/OMIT if stuck.*  

  | **STEP** | **QUESTION** | **GOOD ANSWER?** | **ACTION IF NO** |
  |----------|--------------|------------------|------------------|
  | **1** | Write claim clearly. | ✔️ Single, testable sentence. | ✘ **STOP**: Split or drop. |
  | **2** | Source/route in 1 sentence. | ✔️ **Goldilocks Detail**: Specific + replicable. | ✘ **HEDGE/OMIT** |
  | **3** | **"If FALSE, would source STILL make us believe it?"** | ✔️ "No" + clear reason. | ✘ **HEDGE/OMIT** |
  | **4** | *If inferred*:<br>A. Check premises.<br>B. **"If inference INVALID, would we STILL make it?"**<br>C. ≤1 "obvious" step? | ✔️ "No" + logic holds.<br>✔️ Premises flat.<br>✔️ 1 step max. | ✘ **HEDGE/OMIT** |
  | **5** | Final call. | Passed all? → **FLAT** | Failed? → **HEDGE/OMIT** + log reason. |

  **JUDGMENT CALLS** (Be honest!):  
  - Step 3: Could error *realistically* hide?  
  - Step 4B: Would 95% of locals call this "obvious"?  
  - Negatives (e.g., "no event"): Assume incomplete unless proven otherwise.  

  **LOG REASON** (e.g., "Hedged: Step 3 fail—source biased.")  

  ---

  This system prioritizes **transparency** and **replicability** over philosophical perfection. It forces your team to confront gaps and biases explicitly, reducing arguments by making standards visible. When in doubt, hedge: better to be quoted cautiously than wrongly.
