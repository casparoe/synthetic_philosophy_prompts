  The core tension they're highlighting is brilliant: if merely possible observation (like an imaginary witness to a comet strike) satisfies knowability, how does this differ from realism? Their comet scenario is clever because it forces the verificationist to define "possible" in a way that isn't vacuously permissive. And their follow-up threat about continuous quantities and nomological constraints shows they're ready to escalate.

