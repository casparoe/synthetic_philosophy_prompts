  Ah—their realist shadow looms large. When they say "what does truth consist in," they're probing whether verificationism collapses into trivial possibility. My reply must thread the needle: truth is verification-aptness, not actual verification, but the "aptness" requires that evidence could exist in principle. The comet's truth depends on there being some physically possible chain of detection, even if unrealized. 

