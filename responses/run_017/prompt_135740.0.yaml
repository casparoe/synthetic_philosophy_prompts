answer: |-
  ## Public Consultation Draft: National Standard for Animal Welfare Impact Labelling (NSAWIL)
  **Schedule 7: Protein-Specific Suffering Unit (PSSU) Calculation Methodology**

  **Recitals:**

  (A) Whereas the National Food Sustainability Act 2025 mandates a holistic accounting of animal welfare impacts across the food production chain, recognizing that sentient experience, irrespective of species or origin, constitutes the relevant moral unit;

  (B) Whereas this accounting must encompass:
      (i) Directly farmed animals raised for food;
      (ii) Non-target vertebrates and invertebrates killed during crop cultivation, harvest, and pest management activities;
      (iii) Wild vertebrate and invertebrate animals displaced or prevented from occupying land due to its use for agricultural production (Direct Land Use Impact);
      (iv) Wild vertebrate and invertebrate animals whose existence is facilitated on land spared from agricultural production due to the adoption of a lower-land-footprint food option (Spared Land Impact);

  (C) Whereas impacts shall be quantified in a single, standardized metric facilitating consumer comparison: the Protein-Specific Suffering Unit (PSSU), representing the expected sum of suffering-days imposed per gram of digestible protein delivered;

  (D) Whereas the PSSU requires resolution on fundamental equivalencies and methodologies to ensure consistent application;

  (E) Whereas scientific certainty regarding comparative sentience and subjective experience across taxa is currently incomplete, necessitating precautionary defaults where evidence is lacking or ambiguous;

  **Article 1: Core Metric - Suffering-Day Equivalence**

  1.1 The fundamental unit of welfare impact is the **Suffering-Day (SD)**, defined as one day of life experienced by a sentient animal under conditions presumed to inflict a net negative valence (pain, distress, fear, deprivation) equivalent to the modal experience of a broiler chicken in conventional intensive production during its final week.

  1.2 Suffering-Days experienced by different species shall be aggregated directly. One SD experienced by a field mouse is equivalent to one SD experienced by a chicken, cow, or invertebrate meeting the sentience threshold (Article 3).

      *Rationale: Sentience capacity, once established, confers equivalent moral weight per unit of equivalent suffering experience. While phenomenological differences may exist, cross-species suffering intensity comparisons lack robust intersubjective verification methods. Equivalency per SD is administratively feasible and aligns with the principle of equal consideration for equal suffering.*

  **Article 2: Scope of Included Animals & Sentience Threshold**

  2.1 All vertebrates are presumed sentient.

  2.2 For invertebrates, sentience is presumed **only** for the following taxa, based on precautionary interpretation of consolidated behavioural and neurobiological evidence: Decapod crustaceans (e.g., crabs, prawns), Cephalopod mollusks (e.g., octopus, squid). All other invertebrates are excluded from SD accounting.

      *Rationale: Limiting invertebrate inclusion to taxa demonstrating the strongest evidence for complex nociception and behavioural responses indicative of subjective experience balances precaution against computational intractability. The precautionary principle is applied to inclusion, erring toward protecting potentially sentient beings.*

  2.3 "Animals" for the purposes of Direct Land Use Impact (Recital B.iii) and Spared Land Impact (Recital B.iv) refer exclusively to wild vertebrates and the invertebrate taxa listed in 2.2 inhabiting the relevant ecosystems.

  **Article 3: Land Use & Displacement Impacts**

  3.1 **Direct Land Use Impact (DLUI):** The SD cost for land used (LU, in hectares per functional unit) shall be calculated as:
      DLUI_SD = LU * [Avg. Vertebrate Density (V_D) * Avg. Invertebrate Density (I_D) * (1 - Habitat Quality Factor (HQF)) * Baseline Life Expectancy (BLE)]
      Where:
      *   V_D & I_D: Mean population densities (individuals/ha) for relevant taxa in the pre-agricultural or reference natural ecosystem for that land type.
      *   HQF (0.0 - 1.0): Represents the proportion of animals presumed to experience lives of net positive welfare in the undisturbed state. **Default HQF = 0.2.** *(Rationale: Precautionary default reflecting high juvenile mortality, predation, disease, and resource competition in wild populations. Evidence for net positive welfare is deemed insufficiently robust.)*
      *   BLE: Mean expected lifespan (days) in the reference ecosystem for a composite vertebrate/invertebrate individual.
      *   *(1 - HQF)*: Represents the proportion of animals whose prevented lives are deemed to avoid net suffering.

  3.2 **Spared Land Impact (SLI - Credit):** For a food option requiring less land (LU_spared) than a comparator baseline, a *negative* SD credit is applied:
      SLI_SD = - (LU_spared * [V_D * I_D * (1 - HQF) * BLE])
      *Rationale: Utilizing less land prevents the existence of wild animals on that spared land. Given the default HQF (0.2), the prevented lives are predominantly (80%) assessed as avoiding net suffering. This constitutes a welfare benefit.*

  3.3 **Non-Arable Land Exemption:** Land classified as **"Permanently Non-Arable"** (Definition 4.1) incurs no DLUI. Food production systems (e.g., ruminant grazing) utilizing *only* Permanently Non-Arable land receive full SLI credit for *not* using arable land for feed production.
      *Rationale: Recognizes land incapable of supporting significant crop cultivation cannot contribute to Spared Land Impact credit if used for grazing. Its use displaces fewer animals than arable land and does not preclude sparing more productive land elsewhere.*

  **Article 4: Functional Unit & Comparator Baseline**

  4.1 The functional unit for PSSU calculation is **grams of digestible protein (g dp)**.

  4.2 The comparator baseline for calculating SLI credit (Article 3.2) is the land footprint of the **most land-efficient widely available protein source achieving equivalent regional nutritional utility.** For the initial standard, the baseline comparator is **soybean meal protein (conventionally grown).**

  **Article 5: Resolution of Key Trade-offs**

  5.1 **Land Efficiency vs. Direct Animal Lives:** The PSSU integrates both dimensions. A product with high land use (e.g., pasture-finished beef) accrues significant DLUI but may gain substantial SLI credit if it utilizes Non-Arable land (Article 3.3) or replaces a high-land-footprint baseline. A product with low land use but high direct animal deaths per unit protein (e.g., chicken) accrues high SD costs from farming and cultivation deaths. The PSSU calculation determines the net impact.
      *Example: Beef production on Permanently Non-Arable land avoids crop cultivation deaths entirely and receives large SLI credit. While the direct SD cost per animal is high, the number of animals per g dp is low. Chicken production has a low direct SD cost per animal, but very high numbers of animals per g dp, plus cultivation deaths for feed, and minimal SLI credit relative to the soybean baseline it often marginally improves upon. Modelling indicates scenarios where extensive beef scores lower (better) PSSU than intensive chicken.*

  5.2 **Spared Land & Wild Welfare:** The treatment of wild animal lives on spared land is governed by the HQF default (Article 3.1). The Standard acknowledges that this assigns a high negative value to the *prevention* of wild animal life (SLI credit) based on the assumption of predominantly net-negative experiences. **This is a direct consequence of applying the sentience inclusion principle (Recital A) and the HQF default (0.2) uniformly.** Altering the HQF significantly alters SLI credit magnitude.

  **Definitions:**

  *   **Permanently Non-Arable Land:** Land classified under the National Land Capability System as Grade 6 or 7, characterized by severe limitations (e.g., steep slopes, very poor drainage, shallow soils, extreme climate) rendering it unsuitable for sustained, economically viable cultivation of annual row crops or perennial horticulture without irreversible degradation. Land requiring significant, permanent infrastructure (e.g., major terracing, drainage) to achieve arability is excluded.
  *   **Habitat Quality Factor (HQF):** The estimated proportion of wild vertebrate and relevant invertebrate individuals within a defined ecosystem who experience lives of net positive welfare, based on the balance of positive (e.g., satiety, comfort, social bonding, successful reproduction) and negative (e.g., hunger, injury, disease, predation, chronic stress) states over their lifespan. (Default Value: 0.2).

  **Worked Example: PSSU Calculation Summary (Illustrative Figures)**

  **Product:** Beef (Pasture-Finished, Permanently Non-Arable Land)
  **Functional Unit:** 100g Digestible Protein

  1.  **Farmed Animal Suffering:**
      *   SD per animal (cow): 14,600 SD (assumed 4-year life, net negative)
      *   g dp per animal: 15,000 g dp
      *   SD per 100g dp: (14,600 / 15,000) * 100 = **97.3 SD**
  2.  **Cultivation Deaths:** 0 SD (No arable feed crops used)
  3.  **Direct Land Use Impact (DLUI):** 0 SD (Non-Arable land exemption)
  4.  **Spared Land Impact (SLI - Credit):**
      *   Land spared vs. Soy Baseline: 2.5 ha / 100g dp
      *   SLI Credit: - [2.5 ha * (10 V/ha * 1000 I/ha) * (1 - 0.2) * 365 days] = **-7,300,000 SD**
  5.  **TOTAL PSSU (per 100g dp):** 97.3 + 0 + 0 + (-7,300,000) = **-7,299,902.7 SD**

  **Product:** Soy Protein Isolate (Conventional)
  **Functional Unit:** 100g Digestible Protein

  1.  **Farmed Animal Suffering:** 0 SD
  2.  **Cultivation Deaths:**
      *   SD per ha cultivation: 500 V, 1,000,000 I * Avg. 10 SD ea. = 10,500,000 SD/ha
      *   Land use: 0.8 ha / 100g dp
      *   SD per 100g dp: 10,500,000 * 0.8 = **8,400,000 SD**
  3.  **Direct Land Use Impact (DLUI):**
      *   DLUI per ha: [10 V/ha * 1000 I/ha * (1-0.2) * 365] = 3,652,000 SD/ha
      *   DLUI per 100g dp: 3,652,000 * 0.8 = **2,921,600 SD**
  4.  **Spared Land Impact (SLI - Credit):** 0 SD (Baseline comparator)
  5.  **TOTAL PSSU (per 100g dp):** 0 + 8,400,000 + 2,921,600 + 0 = **11,321,600 SD**

  *(Note: Figures are highly simplified and illustrative. V = Vertebrates, I = Invertebrates (taxa included), Avg. SD assumes short, intense suffering during cultivation events. Non-arable land exemption and large SLI credit drive the negative PSSU for beef.)*

  ---

  **This piece satirizes the reductio ad absurdum of applying strict negative utilitarian calculus and total sentience inclusion to food systems via a single metric.** It highlights how seemingly logical premises—especially assigning negative value to wild animal lives via a low HQF default and granting massive credit for sparing land—can perversely favor certain meats (grazed ruminants on marginal land) over plant proteins. A defender of the real "crop deaths matter" argument would vehemently reject the HQF default and the resulting negative valuation of preventing wild animal existence.
