prompt: |-
  I have one fifty-minute section in a first-year epistemology module on self-locating belief, and I want to spend it on the Sleeping Beauty problem. The students know Bayes' theorem and have already been through Monty Hall; they have not met centred or indexical evidence as such. Do not argue me towards halving or thirding — I can read that literature myself. Plan the session.

  What has to be in place before the disagreement looks like a puzzle rather than a trick, and how do I get there from Monty Hall rather than from scratch? Which single case should carry the whole thing, and why should it not simply be the standard Sunday-toss story told straight: what must the carrying case contain, and what must it lack, for the thought that nothing new has been learned to feel genuinely tempting rather than obtuse? I am inclined to open with a duplication variant instead, but argue me out of it if it smuggles in more than it shows.

  Then the misconception map. I expect at least the move that one-third is merely the relative frequency of awakenings and so not a credence at all, and the move that the answer is really fixed by how a bet would be settled; give me the others, and say for each at what point in the sequence it must be headed off, distinguishing what has to be blocked before I let the disagreement surface from what should be dealt with only afterwards.

  Finally, one closing question that tells me the indexical point has landed rather than merely been absorbed. I was considering a variant in which the coin is tossed on Monday night, after the first awakening, rather than on Sunday, but I am unsure whether that tests the point or merely muddies it. And tell me what I should openly refuse to explain at this level, the betting arguments and anything Everettian being my own candidates.
reasoning: |-
  Okay, the user is teaching a first-year epistemology module and wants to structure a fifty-minute session on the Sleeping Beauty problem. They have students familiar with Bayes' theorem and the Monty Hall problem but haven't covered indexical evidence yet. The user wants to focus on setting up the puzzle effectively without getting into the halving vs. thirding debate.

  First, I need to figure out how to transition from Monty Hall to Sleeping Beauty. Monty Hall involves updating probabilities with new information, like a door being opened. Sleeping Beauty adds the twist of self-locating beliefs, where the context of when you're asked affects the probability. The key difference is that in Monty Hall, the evidence is objective (a goat is revealed), while in Sleeping Beauty, the evidence is indexical ("today is Monday"). Students might think that because no new objective information comes in, the probability shouldn't change, but that's the puzzle. So starting with Monty Hall helps highlight how indexical evidence changes things.

  The user is considering a duplication variant instead of the standard setup. But duplication might introduce complications like multiple observers or identity issues, which could distract from the core concept of self-location. It's better to stick with the original Sleeping Beauty to keep it simple. The standard case with coin tosses and awakenings is controlled and isolates the indexical evidence problem without extra variables.

  For the misconception map, common errors include confusing probability with relative frequency of awakenings, or thinking betting arguments resolve the issue. These need addressing at different points. Before introducing disagreement, it's crucial to establish that awakenings are subjectively indistinguishable and that Beauty learns "today is an awakening day," which is indexical. After presenting the puzzle, tackle the relative frequency confusion by explaining that credence applies to the coin toss, not the awakenings. Betting arguments should be deferred since they're more advanced.

  The closing question about tossing the coin on Monday night instead of Sunday tests if students grasp indexical evidence. In the standard case, Beauty knows the coin was tossed Sunday. If it's tossed Monday night, after the first awakening, her credence on Monday doesn't change because she knows the toss hasn't happened yet. This variant clarifies that the indexical evidence "today is Monday" affects her credence based on when she is.

  What to avoid? Betting arguments and Everettian interpretations are too complex for this level. Focus solely on the indexical evidence concept without these tangents. The goal is to make the puzzle clear, not resolve it.

  So, structuring the session: start with Monty Hall to review conditional probability, transition to Sleeping Beauty emphasizing the lack of new objective info, present the standard case, highlight the disagreement as a puzzle. Address misconceptions step by step, use the Monday-toss variant for the closing question, and avoid advanced topics. This should help students grasp the unique challenge of self-locating beliefs.
answer: |-
  Here’s a focused, step-by-step plan for your session, prioritizing clarity on the **indexical puzzle** while avoiding rabbit holes:

  ---

  ### **Session Structure (50 mins)**
  #### **I. Anchor in Monty Hall (10 mins)**
  - **Review Monty Hall:**  
    - Door chosen (1/3 chance car is there).  
    - Host *objectively reveals a goat* (specific evidence: "Goat behind Door 3").  
    - Bayes updates probability → 2/3 chance car is behind remaining unopened door.  
  - **Key takeaway:**  
    Probability shifts because the host’s action provides *new, non-indexical information* that eliminates possibilities (e.g., "Car not behind Door 3").

  #### **II. Transition to Sleeping Beauty (Standard Setup) (15 mins)**
  - **Present the *minimal* standard case (Sunday toss):**  
    > *Coin tossed Sunday (fair). HEADS: Awake Mon only. TAILS: Awake Mon & Tue.*  
    > *Each awakening: Identical room, amnesia, Beauty knows the setup. Asked: "Credence now that coin landed heads?"*  
  - **Why standard > duplication:**  
    Duplication variants risk smuggling in questions about personal identity ("Is the duplicated me still *me*?"), diverting focus from pure self-location. The standard case isolates indexical uncertainty ("*Which* awakening is this?") without metaphysical baggage.  
  - **Build the puzzle step-by-step:**  
    1. **Sunday perspective:** Beauty’s credence P(Heads) = 1/2.  
    2. **Awakening perspective:**  
       - "What *new objective information* does Beauty have upon waking?"  
         → *None.* Coin outcome hasn’t changed. No experimenter tells her anything.  
       - "What *does* she learn?"  
         → **Indexical fact:** "I am experiencing an awakening *now*."  
    3. **Temptation:** "No new *objective* info → P(Heads) should remain 1/2."  
       - *Lean into this intuition.* It feels compelling precisely because it mirrors Monty Hall’s logic (no update without new objective info).  
    4. **The counter:** "But in Tails, there are *two* awakenings. If she bets on Heads every awakening, she’ll lose twice as often when Tails. Shouldn’t she be *less* confident?"  
       - **Puzzle crystallized:** *Can purely indexical evidence ("I am awake now") warrant a probability shift for an objective event (coin toss)?*

  #### **III. Misconception Map & When to Block (15 mins)**
  | **Misconception**                          | **When to Block**                         | **Blocking Strategy**                                                                 |
  |--------------------------------------------|-------------------------------------------|---------------------------------------------------------------------------------------|
  | **"P(Heads) = 1/3 because 1/3 of awakenings are Heads"** | *Before introducing disagreement* | Stress: Credence is about the *coin toss* (objective event), not the *current awakening* (centered event). "Heads" has one awakening, "Tails" has two, but the *coin* is still fair. |
  | **"Betting arguments settle the answer"**  | *After the puzzle surfaces*               | Acknowledge but defer: "Betting helps *model* credence, but our question is *what credence is rational before we design bets*. Let’s resolve the conceptual puzzle first." |
  | **"Beauty learns it's Monday (or Tuesday)"** | *Before awakening perspective*          | Emphasize: She has **no way to distinguish days**. Her evidence is purely "I am awake *today*" with no calendar. |
  | **"Heads and Tails awakenings are different because X"** | *During setup*                      | Underscore **epistemic symmetry**: Identical sensory inputs, memory, room, etc. No differentiating evidence exists. |
  | **"Probability only applies to future events"** | *If raised*                          | Clarify: Credence applies to *unknown truths* (like past coin toss). Beauty knows toss happened but not outcome. |

  #### **IV. Closing Question: Test Indexical Landing (5 mins)**
  - **Use the "Monday Night Toss" variant:**  
    > *"Change: Coin is tossed *Monday night* (after Beauty’s first awakening). HEADS: No Tue awakening. TAILS: Tue awakening. Beauty awakens Mon, knows setup. What is P(Heads) *on Monday*?"*  
  - **Why this works:**  
    - **Indexical clarity:** On Monday, Beauty knows *no toss has occurred yet*. Tails doesn’t imply "extra" awakenings *yet*.  
    - **Correct answer (1/2):** She learns "today is *an* awakening day," but since the coin hasn’t been tossed, there’s no Tails "extra awakening" to bias her credence. Contrasts sharply with standard case.  
    - **Tests understanding:** If students see why P(Heads) is 1/2 *here* but potentially 1/3 in the standard case, they grasp that **indexical context** (e.g., whether the coin toss is past/future relative to the awakening) matters.  

  #### **V. What to Refuse to Explain (Explicitly)**  
  - **Betting arguments:** "We’re focusing on *credence as rational degree of belief*, not pragmatic betting strategies. That’s a later topic."  
  - **Everettian/QBism interpretations:** "This is about self-locating belief in *classical* probability. We’re not addressing quantum mechanics."  
  - **Halting/Thirding resolution:** "Today’s goal was to *see* the puzzle. Resolving it requires deeper tools we’ll revisit later."  

  ---

  ### **Why This Sequence Works**
  1. **Monty Hall** provides a clean contrast: objective evidence updates probabilities → Sleeping Beauty’s lack of it makes P=1/2 feel tempting.  
  2. **Standard case** maximizes focus on indexicality by lacking complications (e.g., multiple agents, identity issues).  
  3. **Monday-toss variant** isolates the indexical crux: Does the *temporal relationship* between awakening and coin toss change the epistemic situation? (Yes).  
  4. **Blocking "relative frequency" upfront** prevents it from masquerading as a solution.  

  This approach makes the puzzle vivid and pedagogically tractable, setting the stage for future sessions on centered evidence without drowning in controversy.
