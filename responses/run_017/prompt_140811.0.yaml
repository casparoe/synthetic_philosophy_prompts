answer: |-
  # RFC: Moral Vocabulary Refactor to Resolve Composability Bug

  **Status**: Draft  
  **Author**: Alex Morgan (Senior Engineer, Ethics Module Team)  
  **Reviewers**: Sam Rivera (Team Lead), Jordan Kim (Architecture), Taylor Chen (Cross-Functional Liaison)  

  ## Summary
  This RFC proposes refactoring our moral vocabulary implementation to resolve a composability issue (identified as `BUG-447`) where moral statements fail semantic consistency when embedded in conditionals, negations, or other logical structures. The solution involves:
  1. Re-typing all moral expressions as pure side effects (returning `void`)
  2. Introducing an `AttitudeWrapper` monad for embedded contexts
  3. Adding a `moral_lint` utility to enforce attitude coherence

  ## Motivation
  Our current implementation treats moral sentences (e.g., "lying is wrong") as expressions that emit approval/disapproval attitudes (`BOO`/`HURRAH` signals). This works for top-level assertions but breaks when these statements appear in nested contexts:

  ```python
  # Current flawed implementation
  def lying_is_wrong():
      emit_attitude(BOO, "lying")  # Returns nothing

  # Fails under composition
  if lying_is_wrong():  # TypeError: NoneType not truthy
      get_brother_to_lie().condemn()
  ```

  This violates the **Frege-Geach Composability Principle**: identical tokens must contribute identical meaning regardless of embedding depth. The immediate casualty is modus ponens (see `test_modus_ponens` in `ethics_test.py`), threatening core inference capabilities.

  ## Guide-Level Explanation
  ### Before Refactor
  - Moral expressions directly emit attitudes  
    `stealing_is_wrong()` → emits `BOO("stealing")`
  - No return value ⇒ cannot be used in conditionals

  ### After Refactor
  1. **Hoisting**: Moral expressions in truth-apt positions are lifted to top-level scope  
     ```python
     # Original
     if stealing_is_wrong():
        incarcerate()
     
     # Transformed
     stealing_is_wrong()  # Hoisted emission
     if True:             # Placeholder
        incarcerate()
     ```

  2. **AttitudeWrapper for Embeddings**:  
     Wrap embedded statements to defer attitude emission:
     ```python
     class AttitudeWrapper:
        def __init__(self, action, sentiment):
            self.action = action
            self.sentiment = sentiment
        
        def evaluate(self):
            return emit_attitude(self.sentiment, self.action)
     
     # Usage in conditional
     if AttitudeWrapper("lying", BOO).evaluate():
        take_disciplinary_action()
     ```

  3. **Linting for Consistency**:  
     `moral_lint` ensures no conflicting attitudes:
     ```bash
     $ moral_lint --check-coherence policy_handbook.md
     ERROR: Line 42: BOO("tax_fraud") but HURRAH("tax_avoidance") 
     ➔ Resolution: Reconcile attitudes or add #pragma ignore
     ```

  ## Reference-Level Explanation
  ### Semantic Typing Changes
  | Context        | Pre-Refactor      | Post-Refactor         |
  |----------------|-------------------|-----------------------|
  | Top-level      | `void` (emits)    | `void` (emits)        |
  | Conditional    | TypeError         | `AttitudeWrapper`     |
  | Negation       | `¬BOO` ≠ `HURRAH` | `Wrapper(¬BOO)`       |
  | Belief Context | Undefined         | `Wrapper.defer()`     |

  ### Validation of Modus Ponens
  The critical test case:
  ```python
  def test_modus_ponens():
      # P1: If lying wrong ⇒ brother-lying wrong
      p1 = AttitudeWrapper(BOO("lying") >> BOO("brother_lying"))
      
      # P2: Lying is wrong
      p2 = AttitudeWrapper(BOO("lying"))
      
      # Conclusion must be BOO("brother_lying")
      assert p1.evaluate(p2) == BOO("brother_lying")  # TEST FAILS: returns void
  ```
  **Note**: Failure is not a regression – tests never passed. `AttitudeWrapper.evaluate()` currently returns `void` to emit attitudes, breaking truth-conditional composition.

  ## Drawbacks
  1. **Modus Ponens Unproven**: The `AttitudeWrapper` monad restores composability but hasn’t formally validated modus ponens. Early QA shows it *feels* logically coherent.
  2. **Runtime Overhead**: All embedded moral statements now require wrapper instantiation (est. 7% latency in ethical decision pipelines).
  3. **Truthiness Leak**: After refactor, we still use `is_moral()` truth checks in 58 call sites. These now map to tautological `True` (see *Alternatives*).

  ## Alternatives Considered
  ### Alternative 1: Moral Realism (Rejected)
  Treat moral sentences as returning `bool` (e.g., `lying_is_wrong() → True`). Rejected as:
  - Requires "moral facts" infrastructure
  - Violates core product principle: "No metaphysics in production"

  ### Alternative 2: Delete Ethics Module (Rejected)
  ```python
  def is_wrong(action):
      return False  # Nothing is ever wrong
  ```
  Pros: Solves composability by elimination  
  Cons: Fails compliance audit (SOX 404b, EU AI Act §12)

  ## Unresolved Questions
  1. Can we prove `AttitudeWrapper` satisfies modus ponens before Q3 launch?
  2. Should `#pragma force_coherence` override lint errors?
  3. Do we need a `MoralException` base class for try/except blocks?

  ---

  ## Discussion Thread

  **Jordan Kim** (Architecture)  
  > -1: Blocking approval. This treats ethics like a stateful service when it's clearly a pure function. Moral statements either describe reality (`bool`) or they don't. You can't hack around binary truth with monads. Category error.

  **Taylor Chen** (Cross-Functional Liaison)  
  > Strong -1. The entire ethics module is tech debt. Why maintain 3K LOC for `BOO`/`HURRAH` emissions when we could `rm -rf ethics/*` and return `NONE` for all moral queries? Users wouldn't notice – our donation dashboard already uses `#define moral 0`.

  **Sam Rivera** (Team Lead)  
  > @Alex – Does this change CRUD semantics for the Ten Commandments endpoint? We ship Moses 2.1 next Tuesday. Unclear if "Thou shalt not kill" needs wrapper migration.
