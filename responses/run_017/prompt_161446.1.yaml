  ## The Spreadsheet Doesn't Lie (But Doesn't Absolve Either)

  **Scene 1: The Argument Over Takeaway**
  Over lukewarm Thai, David pushes his glasses up. "Look, the Against Malaria Foundation buys bednets for, what, two pounds? And they *work*. Proven, RCTs, the whole nine yards. My marginal year modelling dengue spread? Maybe nudges policy a fraction. Here? I shave microseconds off trades. That salary buys *thousands* of nets. If I hadn't taken this desk, Sarah Chen would have. The trades happen regardless. My money just... redirects the fallout towards deworming kids." He stabs a dumpling, earnest. "It's pure arbitrage on human suffering."

  **Scene 2: The Counterargument at Midnight**
  Staring at the ceiling, I argue with his ghost. *Replaceability cuts both ways, Davy.* If you hadn't taken it, maybe Sarah Chen would... or maybe the desk wouldn't run *quite* as hot. Maybe the marginal efficiency gain *does* matter. And even if the trades happen, *you're* the one turning the crank now. The ledger shows nets bought, but not the pension funds eroded a fraction by the volatility your algo exploits, not the talent siphoned from public health labs into this glass tower chasing milliseconds. A thousand quiet Davids don't change the rules; they just grease them.

  **Scene 3: The Spreadsheet on a Rainy Tuesday**
  David pulls it up on his sleek monitor, anonymized data streams. "See? This column: estimated micro-slippage cost to large institutional orders caused by our strategy over a quarter. Ugly number." He scrolls. "This column: my post-tax salary donated to AMF last quarter. That buys X bednets, averting Y DALYs." He points. "Net positive. By a lot." He leans back, looking not triumphant, but weary. The numbers glare, undeniable. The net is positive. But "positive" feels cold, detached from the faint ripples of harm upstream and the concrete good downstream. It settles nothing.

  **Scene 4: The Donor Circle Retreat (Zoom Edition)**
  Dressed in his one good shirt, David listens intently as the Effective Altruism donor circle debates. "We *must* fund the malaria vaccine scale-up!" argues one voice. "No, policy advocacy in India has higher leverage!" counters another. David clears his throat. "The bednet RCT data is incredibly robust for immediate impact..." He cites studies. Others nod, swayed partly by the sheer weight of his contribution – his salary buys him a significant share of the circle's pooled funds, and thus, a louder voice. His money doesn't just buy pills; it buys influence over *which* pills, *which* policy papers, which lives get prioritized.

  **Scene 5: The Algorithm in Action**
  On the trading floor, it’s quiet. No shouting, just the hum of servers and focused murmurs. David’s screen flashes complex equations and anonymized order books. Beside him, Maya adjusts her headset. "Coffee run, Dave? Decaf this time." They’re just… engineers, optimizing an abstract flow of capital. The harm is diffuse, statistical, buried in spreadsheets. The good is continents away, wrapped in mosquito netting. David’s fingers fly over the keyboard, refining the code, making the invisible machine a fraction more efficient, a fraction more profitable. The quiet hum is the only sound.
