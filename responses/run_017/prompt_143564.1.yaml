  Note: In the displaceable case, the Market Signaling might still work because even if the pack is bought by someone else, the store might notice that the same pack was sold later (or to a different customer) and thus the overall demand is the same that week, but over time if many people stop, the trend might be noticed. So it's partly effective.

  But the worst objection is that one person is too small to be noticed. However, if the user is part of a growing movement, then it's not just one person. The user's roommate is focusing on the current situation where only the user is stopping, so the objection stands. Therefore, the user must hope that others will join or that the store tracks individual choices (unlikely). So the Market Signaling argument might be shaky in the very short term with only one person.

  Alternatively, the Moral Expression argument is more robust. But let's stick with Market Signaling because it directly addresses the economic mechanism.

