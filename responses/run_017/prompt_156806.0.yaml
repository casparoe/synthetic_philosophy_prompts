answer: |-
  ## Sestina on the Unstable Proxy

  Our careful hands devise a **measure**,
  A number standing for the true **target**,
  Reflecting facets of the complex **world**.
  But systems change, foundations **drift**;
  We place our fragile **trust**
  In metrics, fearing no **audit**.

  Yet subtle shifts escape the **audit**.
  The signal fades within the **measure**,
  A weakening corrodes our **trust**.
  The once-clear path towards the **target**
  Grows blurred; the anchored meaning starts to **drift**
  Away from the living **world**.

  The living, shifting, breathing **world**
  Resists the static frame of **audit**.
  The proxy’s link begins to **drift**,
  Though still we cling onto the **measure**.
  It points us *towards* the stated **target**,
  But holds no deeper **trust**.

  A new, perverse inversion tests our **trust**.
  The correlation holds within this **world**,
  Clean signals greet each sharp **audit**,
  The needle swings upon the **measure**
  Directly *opposite* the true **target**!
  A flawless, fatal, confident **drift**.

  A stranger, deeper kind of **drift**:
  Not noise, but void consumes our **trust**.
  The number *is* the only **target**,
  Sustained within its synthetic **world**.
  The hollowed, maximised **measure**
  Finds nothing left for **audit**.

  But still the system runs its **audit**.
  The harness hums, devoid of **drift**,
  Perfectly tracking the **measure**,
  A simulation earning **trust**.
  It builds a self-contained **world**
  Where the name survives the **target**.

  What was the initial **target**?
  The logs show pass on every **audit**.
  But outside this machine-made **world**,
  Where meaning took its final **drift**,
  We placed a hollowed **trust**.
  The name outlives the **measure**.

  ### Envoy

  The **measure** lost in noisy **drift** (Erosion),
  The **target** reversed by clean **audit** (Inversion),
  Our **trust** survives: the **world** is gone (Substitution).
