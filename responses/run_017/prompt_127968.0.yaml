  Okay, let me unpack this user's deep dive into consent. They're clearly wrestling with fundamental contradictions across legal domains – medical vs sexual consent especially. The "swap test" analogy shows they've already done sophisticated conceptual work but hit philosophical walls. 

  First, I notice their frustration isn't just academic. Phrases like "rotten thing to do" and "blow up" suggest they're morally unsettled by the legal discontinuities. The teenage consent contrast at the end reveals deeper concern about how we value autonomy contextually. This isn't just about legal theory – it's about coherence in how society protects people.

  Their four questions reveal sharp analytical skills. Question 1 cuts to ontology: what IS consent fundamentally? Question 2 probes functionalism vs formalism. Question 3 demands hypothetical stress-testing. Question 4 considers underdetermination – a very sophisticated doubt. The medical/sex competence paradox then becomes the ultimate challenge to any unified theory.

  Hmm... the medical consent model they describe is essentially Canterbury v. Spence's "reasonable patient" standard. But their sexual consent summary shows jurisdiction-dependent fracture lines – especially around STI deception where risk-disclosure logic clashes with sexual autonomy boundaries. That R v. Hutchinson case about sabotaged condoms perfectly illustrates the "act description" problem they're circling.

  I think their instinct is right: consent isn't one thing. In medicine, it's a shield against battery via disclosure duties. In sex, it's often a bright-line test against violence, hence the focus on force/fraud that vitiates the act itself. The teenage consent paradox confirms this – we're not assessing competence neutrally but regulating specific relational harms.

  For their swap test critique: absolutely, it's overbroad for sex (marital status lies) and underinclusive for medicine (disclosing irrelevant risks). The key is recognizing disclosure duties attach to context-specific relationships. Doctors have fiduciary duties; lovers don't. That's why transplanting frameworks breaks down – as their Q3 anticipates.

  The competence point is profound. We let teens refuse chemo because bodily integrity is paramount, but restrict sexual consent because exploitation risks outweigh autonomy in that context. It's not hypocrisy – it's tragic risk-balancing where both choices protect vulnerable people differently.

  Ultimately their "underdetermination" suspicion may be correct. Consent frameworks serve diverse social priorities: preventing medical abuse vs sexual violation vs protecting youth. We should acknowledge the disunity rather than force coherence. Maybe that's the unsatisfying but honest answer they need.
answer: |-
  You've hit on one of the deepest fissures in consent theory. The inconsistencies aren't accidental—they reflect fundamentally different purposes, risks, and social valuations across contexts. Let's break down your questions:

  ### 1. What each practice presupposes consent *is*:
  - **Medicine**:  
    Presupposes consent as **informed authorization**—a waiver of bodily integrity rights contingent on understanding material risks/alternatives. It treats consent as a **transactional permission** whose validity depends on disclosure fulfilling a fiduciary duty. The "act" consented to is defined *descriptively*: agreeing to "Procedure X with risks A,B,C" is legally distinct from "Procedure X" alone. Failure voids consent entirely (battery) because the *scope* of permission was exceeded.  

  - **Criminal Sexual Consent**:  
    Presupposes consent as **agreement to the physical act itself**, not its social/emotional context. It primarily guards against **non-consensual bodily violation** (rape/assault), not deception per se. The "act" is often narrowly defined *physically* ("penetration by Person Y"), making lies about identity or covert condom removal vitiating (you consented to act *A*, got act *B*). But lies about attributes (wealth, love) don't negate the physical act agreed upon.  

  **Core Tension**: Medicine cares about *why* you consented; criminal sex law cares about *what* you consented to physically.  

  ### 2. Presupposition vs. Pragmatic Fit:
  - **Medical "consent" as duty-of-care in disguise?**  
    Partly. Battery liability for undisclosed risks *is* rooted in consent theory, but the "reasonable patient" standard and materiality threshold (*Canterbury v. Spence*) make it function like negligence. Yet calling it "battery" signals that undisclosed touching exceeds permission—a consent-focused framing.  

  - **Sex Law's Narrowness as Evidential Caution?**  
    Absolutely. Expansive "fraud vitiates consent" rules risk:  
    - Flooding courts with "regret-as-rape" claims  
    - Making convictions hinge on speculative counterfactuals ("Would she have consented if he'd said he was a janitor, not a CEO?").  
    The "identity/act" boundary provides clearer, more provable bright lines, even if philosophically arbitrary.  

  ### 3. Swapping Frameworks: What Breaks?
  - **Medical Rules Applied to Sex**:  
    - Undisclosed STI status could void consent (as some jurisdictions hold: *R. v. Cuerrier* in Canada).  
    - Lying about vasectomy/fertility might negate consent.  
    - **Breakage**: Criminalizing all "material deception" (e.g., "I'll marry you") could over-expand rape liability, conflating betrayal with violation.  

  - **Sex Rules Applied to Medicine**:  
    - Surgeons wouldn't need to disclose rare risks if the *physical procedure* was correctly described.  
    - A competent "yes" to "surgery X" would stand, even if given based on lies about success rates.  
    - **Breakage**: Patient autonomy eviscerated; battery claims would vanish unless the *physical act* (e.g., amputation) was misrepresented.  

  ### 4. Underdetermination: Multiple Theories Fit?  
    Yes. The pattern could arise from:  
    - **Relational Duties Theory**: Doctors owe fiduciary disclosure; strangers/lovers don't.  
    - **Harm Prioritization**: Law prioritizes preventing violent violation (sex) vs. informational harm (medicine).  
    - **Rule-Utilitarianism**: Narrow sex rules avoid false accusations; medical disclosure prevents tangible bodily harm.  
    No single "essence" of consent is presupposed—contextual goals shape the rules.  

  ### The Teen Competence Paradox Explained  
    This reveals consent isn't primarily about *cognitive capacity* but **social vulnerability and harm prevention**:  
    - **Medical Consent**: A 15 y/o refusing chemo is seen as exercising bodily autonomy against paternalism. Harm is immediate and physical (forced treatment = battery).  
    - **Sexual Consent**: Focus shifts to *relational exploitation*. The law presumes an imbalance of power/experience makes genuine mutuality impossible with adults, risking psychological harm.  
    - **Underlying Logic**: Competence is **domain-specific** because we value bodily integrity absolutely (hence medical self-determination at 15) but impose paternalism where relational dynamics create systemic exploitation risks (sex).  

  ### Why This Isn't Contradictory  
    - **Medical consent** protects *bodily integrity* through disclosure.  
    - **Sexual consent** protects *sexual autonomy* through rules against coercion/fraud, but with limits on youth to prevent predation.  
    - **Teen competence** reflects a balance: bodily self-determination is non-negotiable; sexual self-determination is restricted due to power asymmetry concerns.  

  **In short**: Consent is a **polyfunctional legal tool**, not a unitary phenomenon. Its rules are sculpted by context-specific harms, evidentiary pragmatism, and societal values—not a consistent philosophy. The "inconsistencies" persist because each domain answers different questions: *"Was the touch permitted?"* (medicine) vs. *"Was this a violative act?"* (sex) vs. *"Is this relationship exploitative?"* (age rules).
