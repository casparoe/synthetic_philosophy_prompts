prompt: |-
  In every safety discussion I end up in, somebody eventually says AI should be built the way planes are: aircraft are certified so that a catastrophic failure is supposed to be vanishingly unlikely (I've seen one in a billion flight hours quoted, no idea whether that's a real requirement or just folklore), nobody would accept "on average this aircraft lands", and we got there by treating every crash as a design failure rather than a cost of doing business. It's always wheeled out to license the same conclusion: average-case eval numbers are basically worthless and we should refuse to deploy frontier systems until we have worst-case guarantees, the kind only formal verification could really give.

  Two things came up last week that I think wreck it, but I can't tell whether they do. First, what we'd actually be certifying isn't one airframe flying a million hours and slowly building up a base rate. It's closer to a million copies of the same airframe each flying one hour, in environments nobody has inspected, with passengers who are actively trying to make it crash. Second, aviation learns from crashes; here the first one might be the last one, so there's no accident record to converge on. Someone else in the room said the better model is drug approval: accept known rates of harm, ship, monitor, iterate.

  I want an audit rather than a verdict. Give me the correspondence table for the aviation analogy — what plays the flight hour, the crash, the regulator, the black box, the maintenance schedule, the test pilots, the airworthiness certificate — then which of the disanalogies genuinely bear on the conclusion and which are decoration. Then the actual question: does the no-deployment-without-worst-case-guarantees claim survive once the million-copies-and-hostile-passengers part is on the table, does the drug-approval analogy support the average-case side any better, or is there a third thing that fits more closely? And tell me honestly at the end whether either analogy is doing real argumentative work or whether they're just two vivid ways of restating a prior about how much risk is acceptable.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're involved in safety discussions where the aviation analogy is often used to argue against deploying AI without worst-case guarantees. The user presents two disanalogies: first, that we're dealing with millions of AI copies in uncontrolled environments with adversarial users, unlike a single airframe in controlled conditions. Second, that aviation learns from crashes, but with AI, the first failure could be catastrophic and irreversible. Then there's the alternative analogy of drug approval, which accepts some harm, monitors, and iterates.

  First, I need to map the aviation components to AI to see where the analogy holds and where it breaks. The flight hour would correspond to each AI instance-hour, but multiplied by millions of copies. That changes the risk calculation significantly. A one-in-a-billion failure rate per flight hour in aviation becomes a thousand failures when scaled to a million instances. That's a huge difference. 

  Then there's the crash event. In aviation, it's a physical crash with investigation leading to improvements. For AI, a catastrophic failure could be something like an AGI takeover or a massive cybersecurity breach, which might not allow for learning afterward. This is a critical disanalogy because the whole aviation safety model relies on iterative learning from failures.

  The regulator in aviation is the FAA, which has clear authority. For AI, regulation is fragmented and less established. That makes enforcement harder. The black box in planes records data for investigation, but AI systems are complex and their decision-making isn't always interpretable. Maintenance schedules for AI would be like updates, but adversarial users could exploit vulnerabilities faster than patches can be deployed.

  Test pilots in aviation are highly trained professionals in controlled tests. For AI, testing is done in simulated environments, but hostile users in the real world can create unforeseen scenarios. Airworthiness certificates are for a specific model under known conditions, but AI faces diverse, uncontrolled environments.

  Now, the user's two disanalogies: the million copies and hostile passengers directly challenge the aviation analogy. Scaling to millions increases the likelihood of failures, and adversarial users introduce risks that aren't present in aviation. The irreversibility of AI catastrophes means no chance to learn from mistakes, which undermines the iterative process aviation relies on.

  The drug approval analogy might fit better because it accepts known risks, monitors outcomes, and iterates based on real-world data. This aligns more with average-case evaluations. However, drugs have known side effect rates and are tested on smaller groups before wider release. AI's unpredictability and potential for systemic risks make this challenging. Also, the scale and speed of AI deployment could lead to widespread harm before issues are detected.

  The user's deeper need seems to be finding a framework that balances innovation with safety without requiring unattainable worst-case guarantees. They might be frustrated with the aviation analogy shutting down discussions and want a more nuanced approach. They also need clarity on whether analogies are substantive or just rhetorical.

  So, does the no-deployment claim survive? Given the disanalogies, especially scaling and adversarial environments, it's unrealistic to demand absolute worst-case guarantees. The drug model offers a pragmatic path but needs adjustments for AI's unique risks. A hybrid approach with phased deployment, continuous monitoring, and containment strategies might be necessary. The core issue is the acceptability of risk and the ability to manage it post-deployment, which analogies alone can't resolve. Ultimately, analogies are useful for framing but shouldn't dictate the argument; the risk tolerance and mitigation strategies should be the focus.
answer: |-
  Here's a structural audit of the aviation analogy, its disanalogies with AI, and their impact on the "no deployment without worst-case guarantees" argument, followed by an evaluation of the drug approval model and the role of analogies.

  ### Correspondence Table: Aviation Components → AI Components
  | **Aviation Component**       | **AI System Analog**                           | **Critical Disanalogies**                                                                 |
  |------------------------------|-----------------------------------------------|-------------------------------------------------------------------------------------------|
  | **1 Flight Hour**            | 1 AI instance-hour of operation               | Scale: Millions of instances operating simultaneously → Aggregate failure probability skyrockets. |
  | **Catastrophic Crash**       | "Existential" or catastrophic failure (e.g., AGI takeover, global disruption) | Irreversibility: No "crash investigation" possible; failure may preclude learning. |
  | **Regulator (FAA/EASA)**     | AI regulatory body (e.g., future FDA-like agency, fragmented governance) | Authority Gap: No global regulator with equivalent technical capacity or enforcement power. |
  | **Black Box**                | Explainability tools / monitoring systems     | Interpretability Gap: AI decisions often opaque; "black box" data may not reveal root causes. |
  | **Maintenance Schedule**     | Software updates / vulnerability patching     | Adversarial Pressure: Hostile users actively exploit flaws faster than patches can be deployed. |
  | **Test Pilots**              | Red teaming / controlled testing              | Environment Gap: Testing occurs in simulated environments, not real-world adversarial conditions. |
  | **Airworthiness Certificate**| Pre-deployment safety certification           | Dynamic Complexity: AI operates in unbounded environments; certification can't cover all edge cases. |
  | **Crash Investigation**      | Post-mortem analysis / incident review        | Unobservability: Catastrophic failures may not leave recoverable evidence; no "debris field". |
  | **Fleet-wide Updates**       | Model retraining / patching deployments       | Deployment Lag: Updates require retraining and redeployment → delays in safety improvements. |

  ### Impact of Key Disanalogies on the Argument
  1. **Million Copies + Hostile Passengers**:  
     - **Destroys the core statistical premise**. Aviation’s "1 in 10^9 hours" assumes a *single system* accumulating hours. With 10^6 AI instances:  
       - Same failure rate → **1,000 failures per billion aggregate hours**.  
       - Adversarial users *amplify failure likelihood* by stress-testing vulnerabilities.  
     - **Conclusion**: Demanding aviation-level *individual* failure rates is meaningless when aggregate risk scales with deployment size. Worst-case guarantees must account for **systemic risk**, not unit reliability.

  2. **No Learning from Failure**:  
     - Aviation relies on crashes being (a) survivable, (b) investigable, and (c) local. AI catastrophes may be none of these.  
     - **Conclusion**: The aviation model **presumes iterative improvement**; if the first failure is game-over, it justifies *more* caution pre-deployment, but makes "certification" impossible without new methods.

  ### Does "No Deployment Without Worst-Case Guarantees" Survive?
  - **No, in its strongest form**. Aviation-scale probabilistic guarantees become statistically incoherent at AI deployment scales with adversaries. Formal verification alone cannot cover:  
    - Unforeseen adversarial inputs ("unknown unknowns"),  
    - Emergent behaviors in complex systems,  
    - Human-AI interaction chaos.  
  - **Survives only if**: "Guarantees" include robust **containment mechanisms** (e.g., kill switches, activity sandboxing) to prevent local failures from scaling globally.

  ### Drug Approval Analogy: Pros and Cons
  - **Correspondence**:  
    - Known side effects ↔ Predictable misuse/harm rates  
    - Clinical trials ↔ Controlled testing (e.g., ARC eval)  
    - Phase 4 monitoring ↔ Post-deployment surveillance  
  - **Strengths**:  
    - Accepts **non-zero harm** as unavoidable.  
    - Emphasizes **iterative refinement** based on real-world data.  
    - Matches AI’s need for **continuous updates**.  
  - **Weaknesses**:  
    - Drugs have bounded biological impact; AI failures can be recursive (e.g., self-improving malware).  
    - Monitoring fails against **fast-moving catastrophes** (hours vs. years).  
    - Ethical asymmetry: Drug trials consent participants; AI deployment exposes non-consenting populations.  

  ### Is a Third Analogy Needed?  
  Yes. **Combined approach**:  
  1. **Vaccine Development**:  
     - Pros: Models adaptive response to novel threats (adversaries), requires boosters (updates).  
     - Cons: Still reactive; initial efficacy uncertain.  
  2. **Nuclear Safety**:  
     - Pros: Focuses on **containment** (e.g., control rods ≈ scaffolding).  
     - Cons: Overly restrictive for general AI.  
  3. **Hybrid Model**: **Cybersecurity + Epidemiology**  
     - Assume breaches *will* occur → focus on:  
       - **Containment**: Isolating subsystems.  
       - **Resilience**: Fast recovery/rollback.  
       - **Herd Immunity**: Decentralized architectures limiting blast radius.  

  ### Do Analogies Do Real Argumentative Work?  
  - **Yes, but superficially**. They:  
    - **Frame risk tolerance**: Aviation = "near-zero tolerance"; Drugs = "managed tolerance".  
    - **Highlight tradeoffs**: Certification (rigor vs. delay) vs. Iteration (speed vs. unknown harm).  
  - **No, on substance**:  
    - Analogies **cannot resolve core disagreements** about:  
      - Acceptable risk levels (e.g., is 0.001% extinction risk okay?).  
      - Whether AI risk is *sui generis* (no true precedent).  
    - They often **smuggle in priors**: Proponents of aviation analogy typically prioritize caution; drug advocates prioritize incremental progress.  

  ### Bottom Line
  The aviation analogy **fails as a prescriptive model** for AI due to scaling and irreversibility disanalogies. The drug model **better accommodates average-case evals** but underestimates tail risks. A **tailored framework** is needed:  
  - **Pre-deployment**: Rigorous adversarial testing + containment proofs (not full verification).  
  - **Post-deployment**: Real-time monitoring with circuit-breakers + sunset clauses for models.  
  - **Governance**: International incident databases (NTSB for AI) and phased deployment licenses.  

  **The analogies are rhetorical scaffolding**. The real debate is: *Can we manage systemic risk in a complex, adversarial environment without perfect guarantees?* If your answer is "no," you'll favor aviation. If "yes, with vigilance," you'll favor drug approval. The rest is metaphor.
