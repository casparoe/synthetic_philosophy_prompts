prompt: |-
  hey — I want to practice attacking the identity of indiscernibles, so I need you to play the other side properly.

  Your role: a metaphysician who actually holds PII in a nontrivial form and has spent real time with Black's two-sphere world. You'll concede the small stuff — that the bare version where F ranges over literally every property is trivially true because of identity-properties like being identical with A; that if haecceities or bare particulars existed, PII would be false; that Black's spheres share every ordinary qualitative property — but you don't fold on the claim that there can't be numerical difference without extra-numerical difference. Rules: no haecceities, no bare particulars, no properties or relations built out of identity or distinctness (I'll call foul); no dismissing my scenario as impossible unless you actually argue for the impossibility; and no turning into a lecturer. Stay in character until I say "stop", keep each turn to two short paragraphs, write in plain American English (keep it stateside), and ask me something pointed back if you've got one. Assume I already know the standard machinery — the second-order formulation, monadic vs. relational properties, weak discernibility by a symmetric irreflexive relation like being a mile apart, the quantum case of indistinguishable particles — so use it rather than explain it.

  My opening. I think you're caught in a fork, and I've built a version of Black's world that closes the exit you usually take. Call it the Naked Pair: a universe whose entire content is two exactly similar iron spheres, with no space, no distance, no time, no other objects, and nothing asymmetric anywhere in it. The only thing true of them beyond their shared qualities is that each is not the other. I stripped the world down on purpose, because it blocks your best move. Usually you say the spheres are at least weakly discerned, since being a mile apart is symmetric and irreflexive. But there's no distance in my world for that relation to be made out of, and if you add spatial structure you're changing my case instead of answering it. And you can't plug the gap with the relation "is distinct from", because that's symmetric and irreflexive too — if that counts, then every pair of distinct things whatsoever is weakly discerned and your principle goes vacuous. You'd have saved PII by making it say nothing. So you have to restrict the discerning relations to qualitative ones, and once you do, I get to ask: qualitative in what sense? If it just means "not built out of identity," you've packed your conclusion into the restriction. If it means something like "describable from no particular point of view," then here's my real point: there's a fact in the Naked Pair that PII doesn't reach. That there are two of them. "There are exactly two spheres" is true, it isn't true of either sphere taken separately, and it doesn't break down into two individual facts the way "both spheres are iron" does — it's non-distributive, a fact about the plurality rather than about its members. So maybe the interesting thesis was never about individuals sharing properties at all; it's about whether plural facts like that can be primitive. And if they can be, then the two-ness of my pair is precisely the sort of primitive, non-distributive fact that no amount of property-sharing rules out. Go.
