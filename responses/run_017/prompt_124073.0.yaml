answer: |-
  Here's a principled specification framework for sexed defaults, designed for a style guide, anchored to your cases and distinctions. Desiderata are **bolded**, biases/weaknesses are *italicized*, and conflicts are flagged.

  ---

  ### Core Desiderata for a Style Guide Theory
  1. **Asymmetry Explanation (Hofstadter Case):**  
     The theory must explain why raced defaults (e.g., "white" as generic) provoke stronger revulsion than sexed defaults ("man" as generic).  
     - *Rationale:* Asymmetry likely stems from **historical normalization** (sexed defaults are deeply entrenched) and **intersectional power dynamics** (race-based subordination often involves explicit dehumanization). If asymmetry fades, it suggests societal progress, but the *structural flaw* in the default remains.  
     - **Genuine desideratum:** Essential to preempt "why race but not gender?" objections.  

  2. **Reversal Test Validity:**  
     A reversal (e.g., "person" as generic) is only probative if the replacement term’s *specific meaning refers to a non-dominant group*. If "person" ever becomes strongly associated with a marginalized identity, the critique reactivates.  
     - *Honest answer:* Reversals are **not universally probative**. They highlight *potential* for new exclusions but don’t invalidate the original critique.  
     - **Genuine desideratum:** Prevents infinite regress; style guides can adopt terms with minimal specific-group baggage.  

  3. **Subordinate-Default Prediction:**  
     If a generic term historically denotes a *subordinate* group (e.g., "servant" as generic in a caste system), the theory must still predict harm—but the primary complaint shifts from "exclusion" to **covert erasure or typicality distortion** (e.g., assuming servants are the "default" humans).  
     - *Distinguishes:* Dominant-group encoding theories fail here; **ambiguity/typicality theories** (e.g., hearers picture the specific group) survive.  
     - **Genuine desideratum:** Ensures the rule isn’t just about power but about cognitive clarity.  

  4. **Harm Distinction:**  
     The theory must **separate and rank**:  
     - **Cognitive harm:** Hearers disproportionately picture men (measurable).  
     - **Expressive harm:** Speaker implies men are the norm (pragmatics).  
     - **Semantic harm:** Claim that the term is *false* as a generic (weakest; easily countered by dictionaries).  
     - *Never collapse* these, and **prioritize cognitive/expressive harms** for style rules.  
     - **Genuine desideratum:** Copyeditors can apply based on objective evidence (e.g., psych studies) without intent-sleuthing.  

  5. **Falsifiability & Psychology:**  
     If empirical effects (e.g., male mental imagery) are null for a term, the objection based on *that mechanism* dissolves. However, **expressive harm** (e.g., signaling disregard) may persist.  
     - *Falsifiers:* Null results in controlled studies on mental imagery or stereotype reinforcement.  
     - **Genuine desideratum:** Rules must adapt to evidence, not dogma.  

  6. **Fossil Case Rule:**  
     **Prioritize current decomposition and associations over etymology**. If native speakers don’t consciously parse "man" in "manhole" as male, and no negative association exists, the term is inert.  
     - *Style guide prescription:* **Retain fossils unless polling shows material offense or strong male association**.  
     - **Genuine desideratum:** Avoids pedantry; focuses on present impact.  

  ---

  ### ⚠️ Conflicts & Knockout Problems
  - **Unresolvable Tension:**  
    - **Bright-line rule vs. term-specific psychology:** A truly context-free rule (e.g., "always replace man-with-human") ignores associative nuances (e.g., "manatee" is fine). *But* requiring per-term psych testing is unworkable for copyeditors.  
    **Solution:** Ban *productive* sexed defaults (e.g., "manned") and context-sensitive nouns ("chairman"), but exempt frozen forms.  
  - **Asymmetry vs. Offense-Tracking:** Explaining asymmetry requires a theory anchored in **structural history**, not just who complains now. This **knocks out** shallow "majority preference" or "current offense" theories.  

  **Most Popular Account Knocked Out:**  
  - **"Generic Semantics" (it's just literal meaning!)** fails *all* tests: ignores asymmetry, reversal, psychology, and expressive harm. Easily defeated by Hofstadter-style satire.  

  ---

  ### Brief Theory Assessments (Criteria-Focused)
  1. **Etymology Defense ("man meant human!")**  
     - *Fails:* Subordinate-default cases (etymology irrelevant to harm), fossil cases (current > historical), falsifiability (ignores psych data). Style guide useless.  
     - Confidence: ❌ Low – etymological claims are red herrings.  

  2. **Generic Semantics ("it's technically correct!")**  
     - *Fails:* Reversal test (so is "white" in racist contexts), asymmetry (no explanation), psychology (literal ≠ psychological impact).  
     - Confidence: ❌ Low – confuses dictionary definitions with usage.  

  3. **Typical-Member Implicature ("man implies male as prototype")**  
     - *Delivers:* Explains cognitive harm (mental imagery), subordinate-default cases (any prototype distorts), falsifiability (testable). Struggles with asymmetry unless paired with power analysis.  
     - Confidence: ✅✅ Medium – robust but needs expressive harm supplement.  

  4. **Causal Psychology ("language shapes thought")**  
     - *Delivers:* Strong on cognitive harm, falsifiability, fossil cases (prioritizes associations). Weak on asymmetry (why worse for race?) and expressive harm.  
     - Confidence: ✅✅✅ High – best for evidence-based rules.  

  5. **Expressive Harm ("it signals exclusion")**  
     - *Delivers:* Explains asymmetry (historical oppression), survives null psychology (harm in messaging), separates from semantic claims. Weak on fossil cases and reversal test (new terms can signal too).  
     - Confidence: ✅✅ Medium – vital for rationale but harder to operationalize.  

  ---

  ### Confidence & Least Sure Part  
  - **Highest Confidence:** Harm distinction (desideratum 4) and fossil case rule (6) – these are pragmatic and defensible.  
  - **Mid Confidence:** Asymmetry explanation (1) – power dynamics are clear, but social change could alter reactions.  
  - **Lowest Confidence:** **Reversal test validity (2)** – The line between "probative" and "parody" is inherently blurry; depends on linguistic intuition.  

  **Recommendation for Style Guide:**  
  Adopt a **hybrid typicality + expressive harm theory**: ban sexed defaults *when productive or ambiguous* (e.g., "chairman" → "chair"; "manned" → "crewed") due to cognitive bias and exclusionary signaling. Exempt frozen terms ("manhole") unless polling shows offense. Rationale: "These defaults historically center men, causing many to picture men as the norm and signaling that women are secondary. Alternatives promote clarity and inclusion." This survives complaints via evidence (psych studies) and principle (expressive fairness), not just banned lists.  

  This gives copyeditors bright-line rules (change X to Y) while the rationale handles Hofstadter ("race defaults are even more dehumanizing") and fossils ("language evolves; we focus on living usage").
