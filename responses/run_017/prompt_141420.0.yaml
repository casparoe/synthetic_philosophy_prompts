prompt: |-
  I run a fortnightly "games, choice and proof" workshop for first-years, mixed maths and philosophy, about 16 people, 80 minutes, one room with moveable tables. I can get printed boards, two colours of counters, index cards and a whiteboard. Almost none of them have met a non-constructive existence proof before.

  I had a long argument with a friend last night about the strategy-stealing argument. She says it's a parlour trick: it tells you the first player wins at Hex and hands you nothing you can actually use, so what has it shown. I kept saying that's the whole point — you find out *which* player without ever getting your hands on a strategy — but I couldn't make her feel it, and I think the only way to feel it is to play. So design me the session: rules, materials, a timeline, and a debrief that maps what happened onto the steps of the argument (the supposition that the second player has a winning strategy, the throwaway opening move, the "pass" you make when the stolen strategy calls for the cell you already took, and the premise that an extra stone of your own colour can never hurt you). No lecture up front and nobody says "strategy stealing" until the last ten minutes — they should run into the move themselves.

  The bit I want you to work out rather than look up, because I invented it on the way home: a variant — call it Stint Hex — where each player has a fixed budget of stones, fewer than half the board, must place one every turn, and looses if the budget runs out before they've connected their sides. In that variant the throwaway move costs something, and I want the group to discover that by trying to rerun the argument on it, not by being told. If who actually wins Stint Hex isn't obvious, say so honestly instead of inventing an answer. There's a second beat if time allows: a free stone of your own colour, placed by someone else, is a gift in Hex — get them to find a game where the same gift is a curse.

  Finally: what goes wrong the first time I run it. I expect people to slide from "the first player wins" into "I can name the winning opening move", and someone to object that finite games are determined anyway so the existence claim was never the news — how do I handle that, and what does the activity just can't show them that only I can say out loud?
reasoning: |-
  We are designing a workshop session for first-year students, mixed maths and philosophy, with the following constraints and goals:

  1. **Topic**: Strategy-stealing argument, specifically as applied to Hex and a variant called Stint Hex.
  2. **Materials**: Printed boards (presumably Hex boards), two colors of counters (say, red and blue), index cards, whiteboard.
  3. **Time**: 80 minutes.
  4. **Participants**: 16 people, no prior exposure to non-constructive existence proofs.
  5. **Structure**: No lecture up front; students play games and discover the argument. The term "strategy stealing" is not used until the last 10 minutes.
  6. **Goals**:
     - Students experience the strategy-stealing argument by playing Hex and then trying to apply it to Stint Hex, where the throwaway move has a cost.
     - In Stint Hex, each player has a fixed budget of stones (fewer than half the board) and must place one every turn. Losing condition: budget runs out before connecting their sides.
     - Optional: Find a game where a free stone of your own colour (placed by someone else) is a curse.

  **Session Design**

  **Phase 1: Introduction to Hex (15 minutes)**
  - **Rules of Hex**: 
    - Two players (Red and Blue) take turns placing a stone of their color on a hexagonal board (e.g., 5x5 or 7x7 for quick games).
    - Red aims to connect the top and bottom sides; Blue aims to connect the left and right sides.
    - Note: The board is symmetric, and the first player has an advantage (which we will prove non-constructively).
  - **Setup**: 
    - Divide the class into pairs. Each pair gets a printed Hex board and two colors of counters.
    - Each pair plays at least one game (if time, two games: one as first player and one as second). 
    - Encourage them to notice the advantage of the first player.

  **Phase 2: Whole Group Discussion (10 minutes)**
  - Bring everyone together. Ask:
    - "How many games did the first player win? How many the second?"
    - "Did anyone figure out a strategy for the second player to win?"
    - "What if I told you that it is impossible for the second player to have a winning strategy? How could that be proven without providing a strategy for the first player?"

  **Phase 3: Introducing the Strategy-Stealing Thought Experiment (15 minutes)**
  - Without using the term "strategy stealing", present the argument as a thought experiment. Use the whiteboard to illustrate.
    - Step 1: Suppose the second player has a winning strategy (call it S).
    - Step 2: The first player makes an arbitrary first move (the "throwaway" move) and then pretends to be the second player. How? 
    - Step 3: From the second move onward, the first player uses the second player's strategy S. But what if the strategy S calls for a move on a cell that the first player already took? Then the first player can make an arbitrary move (a "pass" move) because having an extra stone of your own color doesn't hurt (it only helps in connecting).
    - Step 4: This would mean the first player wins, contradicting the assumption that the second player has a winning strategy.
  - **Activity**: Have the students, in their pairs, try to simulate this. One student plays the role of the first player using the strategy-stealing idea. The other is the second player. They should see that the first player wins. But note: the first player doesn't actually have a strategy, they are just using the supposed second player's strategy.

  **Phase 4: Stint Hex (20 minutes)**
  - Introduce Stint Hex:
    - Same board and connection goals.
    - Each player has a fixed budget of stones, say 5 stones for a 5x5 board (which has 25 cells, so 5 is less than half of 25, which is 12.5, so 5 is indeed less). 
    - Players must place a stone on their turn until they run out. 
    - If a player runs out of stones without having connected their sides, they lose.
  - **Activity**: 
    - In the same pairs, they play a few games of Stint Hex. They should notice that the budget constraint changes the dynamics.
    - Then, challenge them to try the same strategy-stealing argument on Stint Hex. 
      - Step 1: Suppose the second player has a winning strategy S.
      - Step 2: The first player makes a throwaway move and then uses S. But now, the throwaway move uses one of their limited stones. 
      - Step 3: When the stolen strategy S calls for a move that the first player already has, they must make an arbitrary move (using another stone). This uses an extra stone and depletes their budget faster.
      - Step 4: Having an extra stone might not be helpful because the budget is tight. In fact, it might cause the first player to run out of stones before completing the connection.
  - **Debrief**: 
    - Why does the argument break? The key premise "an extra stone never hurts" is false in Stint Hex because stones are limited. Using an extra stone for the throwaway and then for the arbitrary move when there's a conflict might lead to running out of stones.

  **Phase 5: The Curse of a Free Stone (if time, 10 minutes)**
  - Challenge: Find a game where having a free stone of your own color (placed by someone else) is a curse. 
  - Example: In the game of **Nim** with a misère rule, sometimes having an extra stone can force you into a losing position. However, this might be too advanced. 
  - Alternatively, consider a variant of Hex where the goal is to avoid connecting? But that's not standard. 
  - Another idea: In **Go**, a stone placed by the opponent in your territory might actually be a burden (if it becomes a prisoner and gives points to the opponent). But that might be too complex.
  - Instead, design a simple game: 
    - **Game of the Goose with a Twist**: Not exactly. 
    - **A simple impartial game**: 
      - Suppose a game where the player who takes the last stone loses (misère Nim). Now, if an extra stone is added to the pile by an external force, it might change the winning position to a losing one for the current player. 
    - However, we need a game that is not too complicated. 
    - Since time is short, we might skip this or just pose it as a question for them to think about.

  **Phase 6: Wrap-up (10 minutes)**
  - Finally, reveal the term "strategy-stealing argument". 
  - Map the steps of the argument to what they experienced in Hex and then in Stint Hex. 
  - Emphasize the non-constructive nature: we know the first player must have a winning strategy without knowing what it is. 
  - Address the philosophical point: What has been shown? The existence of a winning strategy for the first player, even if we cannot construct it. 
  - Answer potential objections:
    - Objection: "Finite games are determined, so we already knew one of the players has a winning strategy." 
      - Response: True, but without the strategy-stealing argument, we wouldn't know which one. The argument gives us that information without constructing the strategy.
    - Objection: "But we still don't know the winning strategy." 
      - Response: Exactly. The non-constructive proof gives us a meta-knowledge: that the first player has a winning strategy, but we don't know how they win.

  **What Could Go Wrong?**
  1. **Students try to find a winning strategy for Hex and get stuck**: That's okay. The point is to show that we can know the first player wins without knowing the strategy.
  2. **Sliding from "first player wins" to naming the winning opening move**: They might think that the throwaway move is part of a winning strategy. Clarify that the throwaway move is arbitrary and not necessarily the best. The argument does not specify which move to make.
  3. **Objection about determinism**: As anticipated, someone might say that since Hex is finite and deterministic, we know one player has a winning strategy. The value of the strategy-stealing argument is that it breaks the symmetry: without it, we don't know which player wins. The symmetry of the board might suggest a draw is possible, but in Hex, draws are impossible (by the topology). However, the strategy-stealing argument gives a direct proof that the second player cannot have a winning strategy, hence the first must.
  4. **Stint Hex might not be clear**: The budget constraint might be too severe and players might not see the breakdown of the argument. We can adjust the budget (e.g., 8 stones on a 5x5 board) so that it's tight but not impossible. The key is that the throwaway move uses a stone that might be needed later. They should notice that in Stint Hex, the first player might run out of stones.

  **Timeline**:
  - 0-15 min: Play Hex in pairs.
  - 15-25 min: Group discussion on outcomes and the challenge of proving the first player must win.
  - 25-40 min: Strategy-stealing thought experiment and simulation (without the term) in pairs.
  - 40-60 min: Play Stint Hex and try to apply the same argument. Discuss why it fails.
  - 60-70 min: (Optional) The curse of a free stone (if time, otherwise skip).
  - 70-80 min: Wrap-up and debrief, including the term "strategy stealing" and addressing objections.

  **Materials**:
  - Hex boards (one per pair) and two sets of counters (red and blue).
  - Index cards: Use to write down the rules of Stint Hex? Or to record moves? Or for the thought experiment steps? 
    - Alternatively, use index cards for the students to write down their observations during the debrief.
  - Whiteboard: To record the steps of the argument and the outcomes of the games.

  **Note on Stint Hex**: We don't know who wins Stint Hex. It might depend on the board size and budget. The point is that the strategy-stealing argument fails because the extra stone is costly. The goal is for students to see that the premise "an extra stone never hurts" is critical and fails in Stint Hex.

  **What the Activity Cannot Show**: 
  - The activity might not convey the full logical structure of the argument without explicit guidance. The facilitator must ensure that the steps are clearly mapped in the debrief. 
  - The abstract idea of non-constructive proof: that we can know something exists without having an example. This must be articulated in the wrap-up.

  By the end, students should have an experiential understanding of the strategy-stealing argument and its limitations when the game's rules change.
answer: |-
  ### Workshop Session Design: Strategy-Stealing in Hex and Stint Hex  
  **Goal:** Students discover the strategy-stealing argument through play, then see it break in Stint Hex. No lecture upfront; "strategy stealing" revealed only at the end.  

  ---

  #### **Materials per Pair**  
  - **Hex Board:** 7x7 printed grid (small enough for quick games).  
  - **Counters:** 15 red, 15 blue (ensure surplus for Stint Hex constraints).  
  - **Index Cards:** For rules, player "strategies," and move tracking.  
  - **Whiteboard:** Track group observations (e.g., "First player wins in Hex? Stint Hex?").  

  ---

  ### **Timeline (80 Minutes)**  
  #### **Phase 1: Play Hex and Notice Asymmetry (20 min)**  
  - **Rules (Handout on Index Cards):**  
    > "Two players: **Red** (connects top-bottom) and **Blue** (connects left-right). Take turns placing one stone per turn. No moves can be skipped. First to connect their sides wins. The board is symmetric."  
  - **Activity:**  
    - Pairs play 2–3 short games (5–7 min each). Each player starts as first player once.  
    - **Prompt:** *"Who wins more often? Does the first player always win? Try to find a second-player strategy."*  
  - **Debrief (Whole Group):**  
    - Whiteboard tally: "First-player wins: X, Second-player wins: Y."  
    - Key question: *"If the first player always wins in your games, can you prove it without knowing the exact strategy?"*  

  #### **Phase 2: The "Thought Experiment" (15 min)**  
  - **Setup:** Revisit a game where the second player won (or nearly won).  
  - **Activity:**  
    - Assign roles: **Player 1** (first), **Player 2** (second).  
    - **Challenge:** *"Suppose Player 2 has a winning strategy written on an index card. Player 1, can you steal it?"*  
    - Steps (guided discovery):  
      1. Player 1 makes a random "throwaway" opening move (e.g., corner).  
      2. Player 1 then "steals" Player 2’s strategy: On subsequent turns, Player 1 asks, *"If I were Player 2, what would this strategy say to play?"* and copies that move.  
      3. **Conflict:** If the strategy demands a cell already taken by Player 1, Player 1 places a stone elsewhere ("pass" move).  
  - **Prompt:** *"Does Player 1 win? Why? Does an extra stone ever hurt Player 1?"*  
  - **Outcome:** Groups see Player 1 wins, proving no second-player strategy can exist.  

  #### **Phase 3: Introduce Stint Hex (25 min)**  
  - **Rules (New Index Card):**  
    > "Same board. Each player has a **fixed budget** of 8 stones (board has 49 cells; 8 < 24.5). Place one stone per turn. If your stones run out before connecting your sides, you lose."  
  - **Activity:**  
    - Pairs play 2 Stint Hex games (10 min total).  
    - **Prompt:** *"Who wins now? Is the first player still dominant?"*  
    - **Strategy-Stealing Challenge:** *"Try the same trick: Player 1 makes a throwaway move, then steals Player 2’s strategy. What changes?"*  
  - **Discovery Goals:**  
    - Students notice the throwaway move "costs" a stone. When Player 1 hits a conflict, the extra "pass" move depletes their budget faster.  
    - **Critical observation:** An extra stone isn’t free—it risks running out of moves.  
  - **Whiteboard Track:** *"Stint Hex outcomes: First-player wins __, Second-player wins __."*  

  #### **Phase 4: The "Curse" of a Free Stone (10 min, If Time)**  
  - **Setup:** Discuss: *"In Hex, a free stone helps. Is there a game where it hurts?"*  
  - **Example Game (Simple Dice-Nim):**  
    - Rules: Players roll a die, then take that many stones from a pile. Whoever takes the last stone loses.  
    - **Curse Scenario:** If you receive a "free stone" (added to the pile by an opponent), it might force you into taking the last stone.  
  - **Activity Quick Demo (One Pair Volunteers):**  
    - Pile starts with 10 stones. Player A adds one stone (gift to Player B). Player B now faces 11 stones and may be forced into a losing position.  

  #### **Phase 5: Debrief and Reveal "Strategy Stealing" (10 min)**  
  - **Map Gameplay to Argument (Whiteboard):**  
    | **Hex Step**               | **What Happened**                          | **Stint Hex Breakdown**                     |  
    |----------------------------|--------------------------------------------|---------------------------------------------|  
    | Second player has a strategy? | Students assumed it existed, then stole it. | Same assumption made.                       |  
    | Throwaway move             | Player 1 wasted a move; no cost.           | Player 1 wasted 1 of 8 stones; budget drain.|  
    | "Pass" on conflict move    | Extra stone never hurt; helped connectivity.| Extra stone used—budget depleted faster.    |  
    | Premise: Extra stone helps | Always true in Hex.                        | **False in Stint Hex**—limited resources.   |  
  - **Reveal the Term:** *"This is called a **strategy-stealing argument**. It proves existence without a strategy. But in Stint Hex, the cost breaks it—we don’t know who wins!"*  
  - **Key Insight:** Non-constructive proofs show *what* must exist (e.g., "first player wins") without saying *how*.  

  ---

  ### **Anticipated Problems & Solutions**  
  1. **"I can name the winning opening move!" (Misinterpreting existence)**  
     - **Response:** *"Did anyone find a guaranteed opening? The argument says a winning strategy exists but doesn’t tell us what it is. Can you write it down? No—that’s the point!"*  
     - **Activity Fix:** After Phase 2, ask pairs to write Player 1’s "winning strategy" on an index card. They’ll realize it’s impossible—it relied on stealing, not constructing.  

  2. **"Finite games are determined—this isn’t news."**  
     - **Response:** *"Determinism tells us someone wins, but not who. Strategy stealing breaks the symmetry: it proves the second player cannot win, forcing the first to win."*  
     - **What Only You Can Say:** *"Determinism + symmetry doesn’t solve Hex—draws are impossible, but without strategy stealing, we couldn’t rule out a second-player win."*  

  3. **Stint Hex Confusion**  
     - **Risk:** Students might think the first player still wins easily.  
     - **Mitigation:** Use a tight budget (8 stones on 7x7 board). In testing, first-player wins ~50%—this ambiguity is productive! *"Who wins? We don’t know—the argument fails, so it could be either!"*  

  4. **Time Shortfall**  
     - **Fix:** Skip the "curse" phase (it’s a bonus). Prioritize Stint Hex—it’s where the critical insight happens.  

  ---

  ### **What Only You Can Articulate**  
  - **The Non-Constructive "Aha":** The workshop shows students *how* strategy stealing works, but only you can explicitly connect it to broader proofs:  
    > *"This is like proving a Nash equilibrium exists without finding it, or that a graph has a property without constructing it. The power is in knowing *what* must be true, even when we can’t see *how*."*  
  - **Philosophical Nuance:** The activity can’t show why non-constructive proofs are controversial (e.g., to intuitionists). Say:  
    > *"Some mathematicians reject this proof—they say ‘existence’ requires a strategy you can write down. But in classical math, it counts: we *know* the first player wins, even if we’ll never know how."*  

  **Outcome:** Students leave feeling the "trick" of strategy stealing, then seeing it crumble under resource constraints. No notes needed—the gameplay *is* the proof.
