  2) The "whose life" question cuts deep. A philosophy department isn't a person or culture, yet it mediates between students' formation and disciplinary traditions. The canon problem is acute: when every text is equally accessible, none feel monumental. That undermines both antiquarian and monumental modes silently.

  Hmm... the user clearly wants actionable insights, not exegesis. They've read the essay. So I'll structure per their request: bottom line first, then criteria, then their two sticking points, finally framework limits. 

  Key realizations forming:
  - Antiquarian history isn't obsolete; its function shifts from information storage to cultivating piety toward philosophical practice itself. But that requires embodied engagement with texts, not just retrieval.
  - Critical history aligns with Dana's "problems" approach but risks rootlessness without grounding. Nietzsche's plastic power requires material to work on.
  - Monumental history's decay into "great man" fetish is real, but the alternative isn't no canon - it's conscious curation. The department must choose what to monumentalize.

  The uncomfortable truth: Nietzsche's framework can't neutrally decide this because it's inherently critical. By using it, we're already privileging life over preservation. That self-awareness matters in committee debates.

  For the bottom line: Hybrid model. One period course (supplying incorporable matter for plastic power) + one problems course (critical practice). Why? Because Nietzsche shows all three modes are vital but dangerous in isolation. This answers Dana's efficiency concern while preventing the "flat infinity" of retrievable-but-unincorporated history. 

