  ### Simulation Activity: "Impact Quest"  
  **Goal:** Create experiential learning around counterfactual neglectedness, non-separability (thresholds, complementarity), and ambiguous neglect signals without pre-teaching concepts.  

  ---

  #### **Materials & Setup**  
  1. **Resource Cards** (laminated):  
     - Group A (4 students): "Budget: $200 each round."  
     - Group B (4): "Budget: 10 units of Skilled Labor (Type X) each round."  
     - Group C (4): "Budget: 10 units of Skilled Labor (Type Y) each round."  
     - Group D (4): "Budget: $100 + 5 units of Skilled Labor (Type Z) each round."  

  2. **Cause Cards** (public descriptions):  
     - **Cause 1 (Health Clinics)**: "Build rural health clinics. Requires money or any labor. *Many groups are already investing here.*"  
     - **Cause 2 (AI Safety Grant)**: "Fund a $300 AI safety prize. Requires $ total across all groups. *Unlocks only if full $ raised.*"  
     - **Cause 3 (Ocean Sensors)**: "Deploy pollution sensors. Requires Labor Y. *Effectiveness depends on matching data.*"  
     - **Cause 4 (Data Platform)**: "Build a data platform. Requires Labor Z. *Effectiveness depends on matching data.*"  
     - **Cause 5 (Soil Restoration)**: "Restore degraded farmland. Requires money or labor. *Very few investors.*"  

  3. **Hidden Payoff Rules** (facilitator-only):  
     - **Cause 1 (Crowding Out)**:  
       - Payoff = (Group's investment) × (10 − 0.1 × Total $ invested by all groups).  
       *→ High initial returns, but diminished by group investments (displacement effect).*  
     - **Cause 2 (Threshold)**:  
       - Payoff = 1,000 points to *all* groups **only if** total $ ≥ $300. Else, 0.  
       *→ No partial credit; requires collective action.*  
     - **Causes 3 & 4 (Complements)**:  
       - **Cause 3 Payoff** = (Group's Labor Y) × 20 × (1 + 0.05 × Total Labor Z in Cause 4).  
       - **Cause 4 Payoff** = (Group's Labor Z) × 20 × (1 + 0.05 × Total Labor Y in Cause 3).  
       *→ Each cause boosts the other’s impact.*  
     - **Cause 5 (Ambiguous Neglect)**:  
       - Payoff = (Money invested × 30) + (Labor invested × 30).  
       *→ Highly effective but ignored due to false belief it’s ineffective.*  

  4. **Other**:  
     - Tokens: Play money ($1/$5 bills), labor chips (color-coded for X/Y/Z).  
     - Investment sheets for groups to record allocations per round.  
     - Whiteboard to display **public totals** after each round (e.g., "Cause 1: $150, Labor X: 5 units").  

  ---

  #### **Rules & Mechanics**  
  - **Rounds**: 3 rounds (15 min/round). Groups invest simultaneously.  
  - **Investments**: Groups split resources across causes. Labor types are cause-specific (e.g., Labor Y only for Cause 3).  
  - **Payoffs**: Facilitators calculate secretly using hidden rules, then announce group points.  
  - **Resource Asymmetry**: Cause 2 requires $ (Groups A/D), Cause 3 requires Labor Y (Group C), Cause 4 requires Labor Z (Group D).  
  - **Key Twists**:  
    - Cause 1: Displacement via diminishing returns (visible when totals rise).  
    - Cause 2: Threshold hidden until triggered (or not).  
    - Cause 3 & 4: Mutual dependence (groups discover payoffs jump if both funded).  
    - Cause 5: High returns but neglected; groups may avoid it due to "neglect = bad" bias.  

  ---

  #### **Timeline (90 Min Total)**  
  1. **Intro (5 min)**:  
     - "Maximize your group’s points. Allocate resources each round. Causes have unknown payoff rules."  
     - Distribute resource/cause cards.  

  2. **Round 1 (15 min)**:  
     - Groups discuss and invest. Facilitators collect sheets, calculate payoffs, announce group points + public totals.  
     *→ Predictable: Cause 1 gets heavy investment; Cause 2/5 ignored. Complements underfunded.*  

  3. **Round 2 (15 min)**:  
     - Groups adjust based on Round 1. Recalculate payoffs + totals.  
     *→ Predictable: Cause 1 payoffs drop; Cause 2 may get partial funding; complements may connect.*  

  4. **Round 3 (15 min)**:  
     - Final investments. Calculate payoffs + totals.  

  5. **Debrief (40 min)**:  
     - **Step 1: Reactions** (5 min): "What surprised you?"  
     - **Step 2: Unpack Hidden Rules** (20 min):  
       - **Cause 1**: "Why did returns drop? *Your contributions displaced others*. Neglect isn’t headcounts—it’s what happens *without you*."  
       - **Cause 2**: "Why did $300 matter? *Impact isn’t separable*—it needed a threshold. ITN multiplication fails here."  
       - **Causes 3 & 4**: "Why did investing together boost payoffs? *Causes can be complements*—impact isn’t isolated."  
       - **Cause 5**: "Why was it neglected? *Neglect is ambiguous*—it could mean ‘bad’ or ‘overlooked.’ Here, it was the latter. To trust neglect, you need evidence it’s not broken."  
     - **Step 3: Connect to ITN** (15 min):  
       - "ITN’s assumptions break when:  
         1. Your work crowds out others (counterfactuals matter).  
         2. Causes need thresholds or complements (non-separable).  
         3. Neglect signals are unvetted (dig deeper!)."  

  ---

  #### **Predictable Challenges & Fixes**  
  - **Cause 2 ignored**: Groups may underfund it, missing the threshold.  
    - *Fix*: In debrief, highlight: "This cause was tractable *only* at $300—ITN’s tractability score would mislead."  
  - **Complements not linked**: Groups may not connect Causes 3/4.  
    - *Fix*: Show payoff math: "When Labor Y and Z were both high, each unit became 2× more valuable."  
  - **Cause 5 stigma**: Groups avoid it due to "neglect = bad" bias.  
    - *Fix*: Contrast its actual payoff with underinvestment: "Neglect here was an opportunity, not a red flag."  
  - **Calculation delays**: Use pre-made spreadsheets. Assign co-facilitator to compute payoffs.  

  ---

  #### **What the Activity Can/Cannot Do**  
  - **Successfully Stages**:  
    - Crowding out (via diminishing returns in Cause 1).  
    - Thresholds (Cause 2) and complements (Causes 3/4) as non-separability examples.  
    - Neglect ambiguity (Cause 5’s high returns vs. avoidance).  
  - **Requires Discussion**:  
    - **Fungibility/crowding out**: Activity shows the *effect* (diminishing returns) but not the *mechanism* (your $ displaced another donor). Explain post-sim.  
    - **Complementarity vs. thresholds**: Activity demonstrates both, but debrief must clarify they are distinct ITN violations.  
    - **Counterfactual baseline**: Groups see displacement’s impact but need help articulating "what happens without me."  

  ---

  **Prize**: Award leftover tokens (e.g., labor chips) as "impact tokens" for participation.  
  **Outcome**: Students experience ITN’s pitfalls firsthand, setting up deeper inquiry into cause prioritization.
