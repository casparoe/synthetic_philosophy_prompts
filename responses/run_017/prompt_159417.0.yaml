prompt: |-
  I am a fourth-year PhD student in molecular systems biology and, because I am the methods person in my group, I chair the weekly hypothesis-triage meeting. Once or twice a week someone brings in a newly formulated explanatory hypothesis — usually a proposed mechanism for a phenomenon we have already measured — and the meeting has to decide whether to redirect a month of a postdoc's time toward it, with the PI signing off at the end. Our recurring failure is that we treat the findings a hypothesis was built to fit as though they confirmed it: someone reverse-engineers a mechanism out of data already in the lab notebook, and because the mechanism accommodates that data neatly, we treat it as well supported and commit resources to it. I have been reading about the problem of old evidence in Bayesian confirmation theory — roughly, that once a finding is already known, it cannot raise a theory's probability by the usual machinery, and that the proposed repairs involve replacing the actual prior with a hypothetical one fixed before the evidence was in hand. I want whatever is salvageable in that discussion turned into a one-page procedure my lab can actually run in forty minutes, written for people with no training in formal epistemology and no tolerance for jargon.

  What I need from you is the procedure itself, in a fixed order, and then its application. Specifically:

  1. A numbered sequence of questions, each with a statement of what counts as a sufficient answer and where the procedure terminates with no support. The steps should be runnable with the materials a lab actually has: the hypothesis as stated, the old findings it is supposed to explain, the lab's current rival hypotheses, and whoever is in the room.

  2. A way of sorting the old findings by provenance before any weight is assigned. I have in mind four categories — findings that were inputs to the construction of the hypothesis; findings the hypothesis was adjusted to fit after it was first stated; findings everyone already knew but that the proposer did not consult; and findings that were anomalous for the reigning model — together with a rule for what each category is worth, and for what happens when a finding falls into more than one.

  3. A usable substitute for the hypothetical prior. My idea is a blinded rebuild: someone who did not help construct the hypothesis writes down, before being shown how well it fits, what they would expect such a hypothesis to predict. Tell me how to run this honestly in a six-person lab where everyone has already seen the data, how to record the result so it cannot be quietly revised afterwards, what to do when no genuinely uninvolved person exists, and how much weight the outcome of the rebuild should carry relative to the rest of the procedure.

  4. A rule for the case where several live hypotheses in the lab's register accommodate the same finding. I do not want a likelihood ratio nobody can compute; I want something a group can apply by counting and arguing, including guidance on when the rival set is too poorly specified to count at all.

  5. An explicit stop rule and an expiry. The procedure should say when old evidence is enough to justify a bet of a person-month and when it is not; require whatever novel test it licenses to be named, with a prediction stated in advance and a date; and say what happens to the hypothesis when that date passes.

  6. The places where judgment cannot be eliminated, marked as such rather than disguised as steps — in particular any place where the decision turns on how much our group values explanatory unification versus predictive novelty, and any place where the procedure has to appeal to the honesty of records we may not have kept.

  Please also add a short closing paragraph on what the procedure cannot do: whether it can yield a number without manufacturing spurious precision, what it assumes about the completeness of the rival set, and whether it can ever substitute for a genuinely new test.

  Then run the procedure on three cases from our own area, showing the steps as you go rather than jumping to verdicts. First: a postdoc proposes that a metabolite produced by a gut bacterium explains a diet effect we published last year, where the metabolite was selected out of an untargeted screen precisely because it was elevated in exactly the condition where the effect is strongest. Second: a visitor proposes, by analogy with a structure characterised in a related organism, that our protein of interest forms condensates — a proposal made before anyone looked — which turns out to explain a two-year-old anomaly, a subpopulation of cells that the reigning kinetic model says should die but does not, and to explain it without new parameters. Third: the lab's own flagship hypothesis, the one on which the PI's grant renewal is built, whose only support is a pattern we have known for three years, which the hypothesis was written to fit, which a competing model from another group also reproduces after a single tweak, and which required two auxiliary assumptions to accommodate. Run the third case straight and give me the result even where it is one I would rather not take into the meeting.
reasoning: |-
  We are designing a procedure that avoids the trap of treating old evidence as confirmatory for a hypothesis that was built to fit it. The procedure must be practical, jargon-free, and runnable in about 40 minutes. We break it down as requested.

  **1. Numbered Procedure for Hypothesis Triage**

  **Step 1: State the Hypothesis and the Old Findings it Explains**
     - **What to do:** The proposer writes down the hypothesis (H) and lists all the old findings (E1, E2, ...) that H is claimed to explain. Each finding must be from the lab's past data (published or in the notebook) and must be stated clearly.
     - **Sufficient answer:** A clear, testable hypothesis and a list of specific, verifiable findings.
     - **Stop if:** The hypothesis is not testable or the findings are not from the lab's records. (No support.)

  **Step 2: Assign Provenance to Each Finding**
     - **What to do:** For each finding in Step 1, assign one or more of the following categories (can be multiple):
       - **A (Input):** The finding was an input to the construction of H (i.e., used to build the hypothesis).
       - **B (Adjusted):** The finding was used to adjust H after the initial formulation (e.g., tweaking parameters to fit).
       - **C (Known but not consulted):** The finding was known in the lab but not consulted during H's construction (proposer must attest they didn't know or use it).
       - **D (Anomaly):** The finding was an anomaly for the reigning model (i.e., it was problematic for the previous leading hypothesis).
     - **Rule for weight:** 
       - If a finding is only in A or B, it gets 0 points (because it was used to build/tweak H, so it doesn't count as independent support).
       - If a finding is in C or D (and not in A or B), it gets 1 point. 
       - If a finding is in both C/D and A/B, then it is treated as A/B (so 0 points). 
       - If a finding is in both C and D, it still gets 1 point (if not in A/B). 
     - **Total points for old evidence (PE):** Sum the points across all findings.

  **Step 3: Blinded Rebuild (for Hypothetical Prior)**
     - **What to do:** 
       - The proposer writes a clear description of the hypothesis (without the findings it explains) and the type of system (e.g., "a metabolite from gut bacteria affects host metabolism" or "a protein forms condensates under condition X").
       - A **rebuilder** is chosen. The rebuilder must be someone who did not participate in constructing H and who does not know how well H fits the old findings. If everyone in the lab knows the data, then:
          - Option: Use the most junior person (or rotate) and ask them to think as if they haven't seen the data. If truly impossible (e.g., small lab and everyone was involved), skip to Step 4 and note that the rebuild is not possible.
       - The rebuilder is given the hypothesis description and the type of system, and then is asked: "What would you expect to observe in the lab's existing data if this hypothesis were true? List specific predictions (P1, P2, ...) that you would look for in our past findings." 
       - The rebuilder writes their predictions without seeing the actual findings. Then, the actual findings (from Step 1) are revealed and the group scores how many of the rebuilder's predictions match the findings. 
       - **Recording:** The proposer, rebuilder, and one other person sign and date the rebuilder's written predictions and the matching results. No revisions allowed after the meeting.
     - **Weight of rebuild (R):** 
       - Let M = number of matches (predictions made by rebuilder that are in the list of old findings).
       - Let T = total number of predictions made by the rebuilder (if T=0, then R=0).
       - R = M / T (if T>0). If no rebuild is done, R=0.
     - **Relative weight:** The rebuild result R is used as a multiplier for the points from Step 2. The total support from old evidence (S) = PE * R. (If PE=0, then S=0 regardless of R.)

  **Step 4: Check for Rival Hypotheses**
     - **What to do:** 
       - The group lists all rival hypotheses (H1, H2, ...) that are currently considered live options in the lab (including the reigning model). If there are none, note that.
       - For each old finding (from Step 1) that scored a point (i.e., was in C or D and not A/B), the group asks: "Which rival hypotheses also explain this finding?" 
       - Count the number of rival hypotheses that explain the finding. 
       - **Rule:** For a finding to count as strong support for H, it should be explained by H and few rivals (ideally none). 
       - **Scoring:** For each finding that scored a point (i.e., was worth 1 in Step 2) and is explained by H, subtract 0.5 for each rival hypothesis that also explains it (up to a maximum of 1 subtraction per finding). 
          - Let N_rivals = number of rival hypotheses that explain the finding (if the set of rivals is poorly specified, skip this step for that finding and note the uncertainty).
          - Adjusted point per finding: max(0, 1 - 0.5 * N_rivals).
          - If the rival set is too vague (e.g., "something else might explain it") and the group cannot agree on at least one specific rival, then treat N_rivals=0 for that finding.
     - **Total adjusted points (PE_adj):** Sum the adjusted points for all findings that originally scored a point. Then, the final support from old evidence (S_final) = PE_adj * R (from Step 3).

  **Step 5: Stop Rule and Expiry**
     - **Stop rule:** 
       - If S_final >= 2, then the old evidence is sufficient to justify a person-month. 
       - If S_final < 2, then the old evidence is not sufficient and the hypothesis does not get resources based on old evidence alone.
     - **Expiry and Novel Test:**
       - If S_final >= 2, the proposer must name a novel test (not using the old findings) and state a specific, testable prediction. The group must agree that the test is feasible and that the prediction follows from H and not from the rivals. 
       - The proposer writes: "We predict that [outcome] will occur when [experiment] is done by [date, within 6 months]." 
       - The PI signs off on the test and the commitment of resources. 
       - **If the test is not done by the date:** The hypothesis is demoted to inactive status and no further resources are committed without a new triage. If the test is done and the prediction fails, the hypothesis is rejected.

  **6. Judgment Calls (Explicitly Marked)**
     - **Step 2:** Assigning categories (A, B, C, D) requires honesty about the construction process. If the lab's records are poor, this step may be unreliable.
     - **Step 3:** The blinded rebuild requires a rebuilder who can genuinely try to forget the data. If the lab is too small, this step may be skipped (and then R=0, making S_final=0). Also, the rebuilder's predictions may be vague, which requires group judgment to match with findings.
     - **Step 4:** Listing rival hypotheses and deciding if they explain a finding is subjective. The group must try to be fair and inclusive of rivals. If the set of rivals is too vague, the adjustment might not be applied (which could overstate support). 
     - **Overall:** The threshold (S_final>=2) is arbitrary and reflects the lab's risk tolerance. The lab might adjust it over time.

  **What the Procedure Cannot Do**
     - It does not yield a precise probability. The score S_final is a rough indicator.
     - It assumes that the rival set is reasonably complete. If a strong rival is missing, support may be overstated.
     - It is not a substitute for a new test. The procedure only licenses a bet on a new test; it does not confirm the hypothesis.

  ---

  **Application to Cases**

  **Case 1: Gut Metabolite Hypothesis**
  - *Hypothesis (H):* Metabolite X from gut bacteria explains diet effect in published data.
  - *Old findings (E):* Metabolite X elevated in condition with strongest diet effect (from untargeted screen).

  *Step 1:* H and E are clear.

  *Step 2:*
    - E was the input for H (category A) because it was selected from the screen to fit the effect. 
    - Also, if the diet effect was known and the screen was done to find candidates, then E is A. 
    - Thus, E gets 0 points. PE=0.

  *Step 3:* Since PE=0, we skip the rebuild (or if done, S=0 anyway). 

  *Step 4:* Not needed because PE=0.

  *Step 5:* S_final=0. **Stop: old evidence not sufficient.** The hypothesis does not get resources based on this old evidence. The group must either find new evidence or propose a novel test without relying on this finding.

  **Case 2: Protein Condensate Hypothesis**
  - *Hypothesis (H):* Protein of interest forms condensates (by analogy to related organism), explaining a subpopulation of cells that survive when the kinetic model says they should die (anomaly).
  - *Old findings (E):* The survival anomaly (known for two years).

  *Step 1:* H and E are clear.

  *Step 2:*
    - E was not used to construct H (proposer built H from analogy, before looking at the anomaly). 
    - E was an anomaly for the reigning model (D). 
    - Assume the proposer did not consult E (C) because they didn't know about it? But in the case, it says the proposal was made before anyone looked at the anomaly. So, if the proposer was unaware, then E is C and D (and not A or B). 
    - Thus, E gets 1 point. PE=1.

  *Step 3:*
    - Choose a rebuilder (e.g., a lab member who didn't work on the anomaly and didn't help build H). 
    - Describe H: "The protein forms condensates under stress conditions." 
    - Rebuilder predicts: e.g., "I would expect to see a bimodal distribution of protein concentration in cells," or "some cells would have visible puncta," or "cells with puncta would survive stress." 
    - Then reveal E: the survival anomaly. 
    - If the rebuilder predicted something like "a subpopulation survives," that matches E. 
    - Suppose the rebuilder made 3 predictions, one of which matches E. Then R = 1/3 ≈ 0.33. 
    - S = PE * R = 1 * 0.33 ≈ 0.33.

  *Step 4:*
    - Rivals: The reigning kinetic model (which does not explain E) and perhaps others? 
    - For E (the anomaly), how many rivals explain it? The reigning model does not (it's an anomaly). If there are no other rivals that explain E, then N_rivals=0. 
    - Adjusted point for E: max(0, 1 - 0.5*0) = 1. 
    - PE_adj = 1. 
    - S_final = 1 * 0.33 ≈ 0.33.

  *Step 5:* S_final=0.33 < 2. **Old evidence not sufficient.** But note: the hypothesis also has the analogy to the related organism as support (not old evidence from the lab). The procedure only assesses the old evidence. The group might still commit resources because of the analogy, but the old evidence alone doesn't justify it. The proposer must propose a novel test to get resources.

  **Case 3: Flagship Hypothesis (PI's Grant)**
  - *Hypothesis (H):* The lab's flagship hypothesis (e.g., a specific signaling pathway explains a pattern).
  - *Old findings (E):* A pattern known for three years, which H was built to fit.

  *Step 1:* H and E are clear.

  *Step 2:*
    - E was the input for H (A) and was adjusted to fit (B). So, E gets 0 points. PE=0.

  *Step 3:* PE=0, so R doesn't matter. S=0.

  *Step 4:* Not needed.

  *Step 5:* S_final=0. **Stop: old evidence not sufficient.** Even though there is a competing model that also fits E (after a tweak), the procedure stops at Step 2 because the evidence was used to build H. The hypothesis does not get additional resources based on this old evidence. The group must design a novel test.

  **Conclusion:** The procedure flags all three cases as not supported by the old evidence. It forces the group to seek new tests. This may be uncomfortable for the third case (flagship), but it is the correct outcome under the procedure.

  **Final Note:** The procedure is designed to be strict about old evidence to avoid circularity. It pushes the lab toward novel predictions.
answer: |-
  ### Hypothesis Triage Procedure: Avoiding the Old Evidence Trap  
  *Designed for a 40-minute lab meeting with no formal epistemology training. Focuses on salvaging key insights from Bayesian confirmation theory without jargon.*

  ---

  #### **1. Numbered Procedure: Questions and Stopping Rules**  
  *Run in order with the hypothesis (H), old findings (E), current rival hypotheses, and lab members present.*

  1. **What old findings does H claim to explain? List them.**  
     - *Sufficient answer:* Concrete, verifiable observations from lab records (e.g., "metabolite X peaks in diet condition Y," "subpopulation Z survives").  
     - *Stop if no findings:* H gets no support from old evidence. Terminate.  

  2. **Did H exist *before* these findings?**  
     - *Sufficient answer:* "Yes" if H was proposed (written/verbal) before data collection. "No" if H was built to fit E.  
     - *Stop if "No":* H fails. Old evidence cannot support it. Terminate.  

  3. **Categorize each finding by provenance (see Section 2).**  
     - *Sufficient answer:* Assign each E to one category (A, B, C, D) with consensus.  
     - *Stop if all E are A/B:* H gets no support. Terminate.  

  4. **Run the blinded rebuild (see Section 3).**  
     - *Sufficient answer:* Rebuilder’s predictions recorded and matched to E.  
     - *Stop if rebuild not possible:* Proceed to Step 5, but note weakened support.  

  5. **Do rivals explain the same findings? (see Section 4).**  
     - *Sufficient answer:* Count rivals that explain each E.  
     - *Stop if no live rivals:* Proceed to Step 6 with no penalty.  

  6. **Final verdict:**  
     - If support score (calculated in Steps 2–5) ≥ 2: **Approve** a person-month for a novel test.  
     - If score < 2: **Reject**. H not supported by old evidence.  

  ---

  #### **2. Sorting Old Findings by Provenance**  
  *Four categories; assign each E to one based on construction history (lab records or proposer testimony).*  

  - **A (Input):** E was used to *construct* H (e.g., data directly inspired H).  
  - **B (Adjusted):** H was tweaked to fit E *after* initial proposal.  
  - **C (Known but ignored):** E existed, but proposer did *not* consult it when building H.  
  - **D (Anomaly):** E contradicted the lab’s reigning model before H existed.  

  **Scoring rules:**  
  - A or B: **0 points** (H was fitted to E).  
  - C or D: **1 point** (E is "independent" of H’s construction).  
  - *If E fits multiple categories:* Use the **lowest-value category** (e.g., if both A and C, score as A = 0).  
  - **Total points (PE):** Sum points across all E.  

  ---

  #### **3. Blinded Rebuild: Usable Substitute for Hypothetical Prior**  
  *Simulates "what would we predict if H were true but hadn’t seen E?"*  

  **How to run honestly:**  
  - **Select rebuilder:** Person uninvolved in H’s construction (e.g., didn’t attend brainstorming). If all 6 participated, use the *least involved* member (PI or postdoc from unrelated project).  
  - **Blind process:**  
    1. Proposer writes H *without mentioning E*.  
    2. Rebuilder lists 1–3 predictions: "If H is true, I’d expect to see [specific outcome] in [specific experiment]."  
    3. *Before seeing E*, predictions are recorded on a shared doc/slide with timestamp and 2 witnesses.  
    4. Compare predictions to E: Award **1 point per match** (prediction corresponds to an E).  
  - **Weight:**  
    - Rebuild score (R) = Total matches / Total predictions made (e.g., 2 matches from 3 predictions → R = 0.67).  
    - If rebuild skipped (no uninvolved person), R = 0.  
  - **Relative weight:** Multiply PE (from Step 2) by R.  
    - **Adjusted support = PE × R** (e.g., PE=3, R=0.67 → Adjusted support = 2.0).  

  ---

  #### **4. Rule for Competing Hypotheses**  
  *Avoids likelihood ratios; uses counting and group judgment.*  

  - **List live rivals:** Rivals must be specific (e.g., "kinetic model with parameter P," "competing group’s hypothesis"). Vague rivals ("unknown mechanism") don’t count.  
  - **For each E scored 1 (C/D):**  
    - Count rivals that **explain E without force-fitting** (e.g., require ≤1 tweak).  
    - **Penalty:** Subtract 0.5 per rival that explains E.  
      - *Example:* E has 2 rivals → Penalty = 1.0.  
  - **Final adjustment:**  
    - Per-E score = max(0, 1 - penalty).  
    - **PE_adj** = Sum of adjusted per-E scores.  
    - **Total support** = PE_adj × R (from rebuild).  
  - **If rivals poorly specified:** Skip penalty for that E (treat as 0 rivals).  

  ---

  #### **5. Stop Rule, Expiry, and Novel Test**  
  - **Stop rule:** Commit resources **iff total support ≥ 2**.  
  - **Expiry protocol:**  
    - If approved, proposer **names one novel test** (e.g., "measure metabolite X in knockout mice").  
    - States **prediction** (e.g., "knockout abolishes diet effect").  
    - Sets **deadline** (≤6 months).  
    - PI signs off.  
  - **If deadline passes or test fails:** H is archived. No further investment without new evidence.  

  ---

  #### **6. Explicit Judgment Calls**  
  - **Honesty in provenance (Step 2):** Relies on lab records/proposer integrity. No fix if records are poor.  
  - **Valuing novelty vs. unification:** Rebuild (Step 3) favors predictive novelty; penalty for rivals (Step 4) favors unification. Group must accept this trade-off.  
  - **Rebuilder bias (Step 3):** If everyone knows E, outcomes depend on rebuilder’s ability to compartmentalize.  

  ---

  ### **What This Procedure Cannot Do**  
  - **No precise numbers:** Scores are heuristics (e.g., 2.0 = "moderate support"), not probabilities.  
  - **Assumes rivals are known:** Underestimates support if strong rivals exist but are overlooked.  
  - **Not a substitute for new tests:** Only licenses a *bet* on a novel prediction. Never conclusive on its own.  

  --- 

  ### **Application to Cases**  
  *Follows procedure step-by-step. Final support scores determine outcomes.*  

  #### **Case 1: Gut Metabolite Hypothesis**  
  *H: Metabolite from gut bacterium explains diet effect.  
  E: Metabolite elevated in condition where diet effect is strongest (from screen targeting this fit).*  

  1. **Old findings:** One E (metabolite-diet correlation).  
  2. **Did H exist before E?** No—H built from screen designed to find metabolites fitting E. **Stop. Support = 0.**  
     - *Verdict:* **Reject.** No novel test approved.  

  #### **Case 2: Protein Condensate Hypothesis**  
  *H: Protein forms condensates (proposed before checking data).  
  E: Subpopulation of cells survives despite kinetic model predicting death (anomaly known for 2 years).*  

  1. **Old findings:** One E (cell survival anomaly).  
  2. **Did H exist before E?** Yes—proposer suggested condensates before knowing about anomaly.  
  3. **Provenance:** E is **D (anomaly)** and **C (ignored during construction)** → **1 point** (PE = 1).  
  4. **Blinded rebuild:**  
     - Rebuilder (uninvolved grad student) predicts: "Condensates would cause bimodal cell survival."  
     - Matches E → 1 match / 1 prediction → R = 1.0.  
     - Adjusted support = 1 × 1.0 = 1.0.  
  5. **Rivals:** Lab’s kinetic model (fails E). No other live rivals → **PE_adj = 1.0** (no penalty).  
  6. **Total support = 1.0.** **< 2 → Reject.**  
     - *But:* H has independent support (analogy to related organism). Group may approve a small pilot (e.g., 1 week) for a novel test.  

  #### **Case 3: Flagship Hypothesis (PI’s Grant)**  
  *H: Signaling pathway explains pattern.  
  E: Pattern known for 3 years, used to build H.  
  Rivals: Competing model explains E with one tweak.*  

  1. **Old findings:** One E (pattern).  
  2. **Did H exist before E?** No—H built to fit E. **Stop. Support = 0.**  
     - *Verdict:* **Reject.**  
     - *Consequence:* Flagship hypothesis fails triage. Resources only approved for a novel test (e.g., "predict pattern in new tissue").  

  --- 

  **Final Note:** This procedure forces rigor on old evidence but can’t replace new data. It protects resources by licensing bets only when evidence is minimally circular. For your lab: **Start strict (threshold=2), adjust based on false positives/negatives over 6 months.**
