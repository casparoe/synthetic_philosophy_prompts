prompt: |-
  I'm giving the closing talk at a small invitation-only workshop on macroeconomic modelling in a couple weeks, and I need Q&A prep. I'm a science journalist — I've covered econ and modelling for about ten years — and I got invited because of a piece I wrote arguing that the professions habitual shrug at unrealistic assumptions (the all-models-are-false move, the as-if defense, the F-twist) is basically fine when a model is being used to describe or forecast inside a regime that isn't moving, but stops buying anything when the same model is used to score a policy that would itself change the behavior the false assumption misdescribes. The talk extends that into a positive proposal. My claim is that unrealistic assumptions are only harmless when they are counterfactually inert for the quantity you're quoting — when the falsehood sits off the causal path to the output — and that the remedy for the cases where it doesn't is not realism for its own sake (I dont think anyone can say what more realistic means in the abstract, and I say so in the talk), but a de-idealization schedule: for each idealization that is load-bearing for the counterfactual the model is being used to evaluate, you have to write down who is supposed to relax it first, what evidence triggers that, and what finding would make you withdraw the policy recommendation. I've got 25 minutes plus 20 for questions, and I'd rather walk in having already lost the arguments in private.

  The room is about 45 people and it's not a philosophy crowd. Most of it is central-bank and academic macro people — DSGE types and the newer heterogeneous-agent modelers who think they already fixed the representative-agent problem — plus a handful of climate and energy modelers, the director of the host institute, who is a hardline reduced-form person and thinks structural modelling is theology, and two philosophers of economics who actually work on scientific models and will use that vocabulary (Galilean idealization, models as mediating instruments, models as fictions, nomological machines, that whole literature). So I'd like the seven or eight objections I'll actually get, ordered by how likely and how much damage they'd do, phrased the way this specific room would phrase them rather than the way a general audience would — I want to hear the modelers say that what I'm describing is just robustness and sensitivity analysis with a new name, and I want the philosophers version of it, which I assume is something about idealization being constitutive of the model rather than a defect in it. Give me a two-minute reply to each, and a note on where that reply is soft, because I'd rather know now. Also tell me what I should concede in the first two slides before anyone has a chance to raise it, and which single reply has to land for the proposal to be worth anything.

  Two more things. First, I'd like at least one objection that could only come from the climate modelers, since they're used to building scenarios that are explicitly not forecasts and I suspect they'll hear my talk as naive about that. Second, include the question I'm hoping nobody asks. I think it's something like: name one actual policy episode where a written de-idealization schedule would have changed the advice anyone gave — I have an answer and its not a great one, so I want to see it coming. Format it as a prep sheet I can read on the train, two or three pages max, and flag the one objection where you think I should just fold rather than fight it.
reasoning: |-
  Okay, the user is a science journalist preparing for a Q&A after giving a closing talk at a macroeconomic modeling workshop. Their talk argues that unrealistic assumptions are harmless only when they're counterfactually inert, and they propose a "de-idealization schedule" as a remedy. They need help anticipating objections from a specific audience: macroeconomists, climate modelers, and philosophers.

  First, I need to understand the key elements of their argument. The core idea is that unrealistic assumptions are problematic when they affect the causal path for policy evaluation. The solution isn't just more realism but a structured plan to relax assumptions based on evidence. The audience includes DSGE modelers, heterogeneous-agent proponents, reduced-form advocates, and philosophers of science.

  The user wants the most likely objections, phrased in the audience's jargon, with responses and weaknesses noted. They also want preemptive concessions and the "killer question" they dread. The climate modelers' perspective is crucial since their scenarios aren't forecasts. The philosophers might focus on idealization's role in model-building.

  Top objections should cover practical feasibility, redundancy with existing methods (like robustness checks), and philosophical views on idealization. The climate modelers might argue their scenarios already handle counterfactuals differently. The hardest question might be for a real-world example where the schedule would change policy advice.

  For responses, I need to acknowledge valid points while steering back to the proposal's value. For instance, agreeing that robustness analysis exists but emphasizing the schedule adds accountability and triggers for action. Concessions upfront should show awareness of modeling trade-offs without undermining the main argument.

  The user's unspoken need is credibility in a skeptical room. They need to demonstrate deep understanding of each subgroup's concerns. The philosophers' objection about constitutive idealization is tricky—maybe concede that models require idealization but argue for explicit management of those that affect policy outcomes.

  The "hoped nobody asks" question requires a concrete example. The user admits their answer isn't strong, so preparing them to admit limitations while stressing the proposal's preventive role is key. Flagging where to fold (e.g., on climate scenario differences) maintains credibility without derailing the macro focus.

  Finally, structuring this as a concise prep sheet with clear sections: objections ordered by impact, responses, concessions, and the critical reply. Highlighting the key response about causal pathways makes the proposal's necessity clear. Emphasizing practical steps over philosophical debates keeps it actionable for policymakers.
answer: |-
  Here’s your targeted Q&A prep sheet, distilled for the train ride. Objections are ordered by **likelihood + damage potential**, with phrasing tailored to the room. Key replies are punchy; soft spots are flagged.  

  ---

  ### **Preemptive Concessions (Slide 2)**  
  1. **"Models *must* idealize to be tractable."**  
     *Concede:* "Absolutely. I’m not arguing against idealization per se, but against *unexamined* idealization in policy contexts. My target is when false assumptions are causally active in the counterfactual."  
  2. **"No model captures full reality."**  
     *Concede:* "Agreed. This isn’t about achieving ‘realism’—it’s about mapping where fiction interacts with intervention."  

  ---

  ### **Top 8 Objections & Replies**  
  **1. "This is just sensitivity analysis/robustness checks rebranded."**  
  *(DSGE/Heterogeneous Agent Modeler)*  
  - **Reply (2-min):** "Sensitivity tests ask *‘How fragile is my output?’* My proposal asks *‘Which fiction is doing the work, and who owns testing it?’* It’s not just varying parameters—it’s assigning accountability for de-idealizing *causal* assumptions. Example: If your policy score hinges on rational expectations, who checks what happens if we relax it *first*, and when?"  
  - **Soft Spot:** Overlap with advanced robustness (e.g., global sensitivity methods). *Defuse:* "If your group already does this explicitly for *load-bearing* assumptions, you’re ahead. But most don’t."  

  **2. "Idealizations aren’t defects—they’re constitutive. Your ‘de-idealization’ destroys the model."**  
  *(Philosopher of Science)*  
  - **Reply:** "I agree idealizations are generative (Galilean idealization, etc.). But when a model shifts from *explanation* to *policy prescription*, constitutive fictions can become latent landmines. I’m not saying ‘remove all idealizations’—I’m saying *document which ones must fall first if we act on this model*, so we don’t mistake scaffolding for bedrock."  
  - **Soft Spot:** Risks sounding like you reject the "models as fictions" paradigm. *Anchor in practice:* "Even constitutive assumptions have empirical anchors. What evidence would make *you* revise this one?"  

  **3. "We already do this informally. Formalizing it is bureaucracy."**  
  *(Central Banker/Academic Macro)*  
  - **Reply:** "Informal practices fail when models cross teams or time. Look at the replication crisis: ‘Everyone knew’ certain assumptions were shaky, but no one specified *when* to revisit them. A schedule forces consensus on triggers *before* politics bias the evidence. Bureaucracy? Maybe. But so are peer review and stress tests."  
  - **Soft Spot:** Underestimates institutional inertia. *Pivot:* "If it’s truly redundant, writing it down costs little. If not, it prevents groupthink."  

  **4. "Climate scenarios aren’t forecasts—they’re exploratory. Your critique doesn’t apply."**  
  *(Climate Modeler)*  
  - **Reply:** "Fair. But when policymakers *use* your RCP/SSP scenarios to justify net-zero investments, they’re treating them as counterfactual guides. My ask: For any scenario driving real-world stakes, flag which idealizations (e.g., no climate tipping points) would *invalidate the policy path* if violated, and who monitors them. That’s not forecasting—it’s assumption hygiene."  
  - **Soft Spot:** Overlaps with existing "guardrail" concepts. *Grant nuance:* "I’m adapting a macro framework. Help me refine this for your use case."  

  **5. "Who enforces this? Journals? Regulators? Utopian."**  
  *(Institute Director/Reduced-Form Advocate)*  
  - **Reply:** "Start small: Funders and journals could require it for policy-relevant models. Look at NIH’s pre-registration push. We’re not mandating ‘correct’ models—just clear reasoning chains. Your reduced-form models? They’d shine here: fewer idealized assumptions to track!"  
  - **Soft Spot:** No leverage to enforce. *Be realistic:* "This is a cultural shift. Incentivize transparency, not compliance."  

  **6. "You assume we know causal paths. We often don’t."**  
  *(Heterogeneous-Agent Modeler)*  
  - **Reply:** "Exactly! If we don’t know the path, *that’s* what the schedule should capture. Example: ‘If household debt becomes a predictor of crisis (trigger), Team X checks if heterogeneous borrowers (de-idealization) changes our ZLB policy advice (withdrawal condition).’ Uncertainty isn’t an excuse for opacity."  
  - **Soft Spot:** May sound glib about causal identification. *Cite them:* "Your work on heterogeneity *is* de-idealization. Schedule it."  

  **7. "This privileges structural models. Reduced forms don’t have ‘idealizations’."**  
  *(Reduced-Form Director)*  
  - **Reply:** "Reduced forms idealize too—e.g., assuming exogeneity or linearity. Your IV assumptions? If policy changes the instrument’s validity, that’s a counterfactually active fiction. The schedule just asks: ‘What would break this, and who’s watching?’"  
  - **Soft Spot:** Reduced-form idealizations are often implicit. *Flatter:* "You’re right that structural models have more *explicit* fictions. Learn from your clarity."  

  **8. 🚩 "Name one policy episode where this would’ve changed advice."**  
  *(The Question You Dread)*  
  - **Reply:** "Pre-2008 DSGE models assumed frictionless interbank markets. A de-idealization schedule might have forced teams to ask: ‘What if counterparty risk matters?’ before the crisis. Did anyone *formally* link this assumption to crisis policy? No. We got ‘unanticipated’ liquidity traps."  
  - **Weakness:** Retrospective counterfactuals are cheap. *Pivot forward:* "It’s about preventing the *next* blind spot. Example: Today’s models scoring CBDCs often ignore bank disintermediation. Shouldn’t we flag that?"  

  ---

  ### **Critical Reply to Land**  
  **For objection #1 ("Just robustness"):**  
  *Your must-win argument:*  
  > **"Robustness asks ‘Is this model fragile?’ My framework asks ‘Which lie is holding the roof up, and who fixes it first?’. Policy models aren’t just tools—they’re arguments. If an argument hinges on a false premise, we shouldn’t wait for sensitivity tests to ask ‘What if it’s wrong?’—we should plan for it."**  
  *Why it matters:* If they see this as paperwork, you lose. Frame it as *accountability for causal storytelling*.  

  ---

  ### **Where to Fold**  
  **Fold on:** "Climate scenarios aren’t forecasts."  
  - *Why:* Their epistemology *is* distinct. Don’t die on this hill.  
  - *Recovery:* "You’re right—let’s discuss how to adapt this for *exploratory* modeling over coffee."  

  ---

  ### **One-Pager Summary**  
  | **Objection**                  | **Key Reply**                                  | **Soft Spot**                |  
  |-------------------------------|-----------------------------------------------|-----------------------------|  
  | "Rebranded sensitivity"        | Accountability > fragility checks             | Overlap with advanced methods |  
  | "Idealizations constitutive"   | Policy shifts fiction from tool to trap       | Misreads "models as fictions" |  
  | "We do this informally"        | Institutional memory fails; write it down     | Bureaucracy pushback        |  
  | **CLIMATE: "Not forecasts"**   | Policy use of scenarios needs assumption guardrails | Epistemic differences      |  
  | "Who enforces?"                | Start with journals/funders                   | No teeth                    |  
  | "Causal paths unknown"         | Schedule captures the uncertainty             | Glib on identification      |  
  | "Reduced-form privileged?"     | All models idealize; reduced forms just hide it| Implicit assumptions       |  
  | **KILLER Q: "Name one policy"**| Pre-2008 interbank fictions → liquidity traps | Hindsight bias              |  

  **Pre-empt:** Concede necessity of idealization + no model is perfect.  
  **Land:** "This forces modelers to disclose which lies their policy advice leans on."  
  **Fold:** Climate scenario distinctions.  

  Good luck—your crowd’s sharp, but you’ve got the receipts.
