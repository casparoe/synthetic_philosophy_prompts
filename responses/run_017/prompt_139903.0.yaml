  Hmm, the user is an MA student preparing to moderate a Q&A session for a visiting speaker who defends moral particularism. They've provided a detailed summary of the speaker's position and want me to develop targeted questions that challenge her views effectively. I need to think carefully about where her position is strongest and where it's vulnerable before crafting the questions.

  The speaker's particularism has several key components: holism about reasons (where a feature's moral valence depends on context), rejection of codifiable moral principles, comparison of moral judgment to perception or diagnostic expertise, acceptance of default reasons (that can be silenced without being outweighed), concession of minimal supervenience (no moral difference without non-moral difference), and her anti-regress move against demands for codification. She often uses analogies to jazz improvisation and clinical diagnosis.

  I need to create 8-10 questions that start comfortably for her but progressively close off escape routes. The questions should cover specific pressure points the user has identified: computational tractability concerns (framing problem), a case study with generative models of deceased relatives, a thought experiment about alternative moral practices, issues with supervenience and principle-shaped truths, problems with default reasons and silencing, questions about explanatory work, clarifying her anti-regress move, and finally what evidence could count against her view.

  For each question, I'll anticipate her most likely reply and craft a specific follow-up that presses the point. The user wants the questions to force her analogies to do real work rather than letting her restate them.

  The speaker's strong points seem to be her anti-regress argument and the analogy to skilled perception. Her vulnerabilities likely include explaining convergence in judgment without principles, handling novel cases without established practices, and accounting for supervenience without conceding principles. The silencing mechanic also seems particularly tricky to defend without implicit rules.

  I'll structure the questions to start with her comfortable ground (holism and anti-regress) before moving to more challenging territory. The computational tractability question comes early to set up later questions about perception. The generative model case tests her on novel moral dilemmas. The alternative community thought experiment pressures her metaphysical commitments. The supervenience question forces her to clarify what she's rejecting about principles. The silencing and default reasons question targets what seems like an implicit principle. The explanatory question challenges the coherence of "wrong-making" features. The anti-regress question clarifies whether her argument targets content or psychology. Finally, the evidence question tests the falsifiability of her view.

  For each question, I'll craft a concise one-to-two sentence prompt that can be asked aloud without preamble, then anticipate her reply and develop a sharp follow-up that addresses the specific pressure point. This approach should create a rigorous Q&A that pushes beyond the seminar's unresolved debates.
answer: |-
  Here are eight targeted questions designed to pressure the speaker's position, ordered strategically, with anticipated replies and specific follow-ups:

  1.  **Question:** Given your holism, how is moral judgement computationally tractable? If the valence of any feature depends holistically on the entire constellation of others, wouldn't competence require tracking an impossible number of interactions? *(Framing Problem)*
      *   **Likely Reply:** Competence isn't computational rule-application; it's the cultivated perceptual sensitivity of the skilled judge who directly apprehends the salient moral features and their relevance in the specific configuration, much like a diagnostician sees the significant symptoms.
      *   **Follow-Up:** If this trained perception reliably identifies salience across diverse cases, isn't that *itself* evidence of a real, underlying general pattern – a principle *embodied* in the skill, even if not consciously accessible? How does this differ from an inaccessible principle governing recognition?

  2.  **Question:** Regarding your diagnosis analogy: in the novel case of bereaved families using a generative model of a deceased relative for comfort (with consent, benefit, and no settled practice), how does the "skilled judge" perceive moral salience here? There's no shared trained disposition for *this*. *(Novel Case / Practice Reliance)*
      *   **Likely Reply:** Judgement here draws analogically on existing sensitivities – concerning deception, commodification, respect for persons, the nature of grief, and genuine connection – perceiving how these bear on *this* new configuration, even without precedent.
      *   **Follow-Up:** If the verdict emerges solely from analogizing existing sensitivities to *this* unique case, doesn't that imply the verdict's source *is* some more general truth(s) about what matters (e.g., respecting autonomy, preventing harm, authenticity) that the judge is applying? Where else could the verdict come from?

  3.  **Question:** Imagine a community identical to ours except that, say, "causing pain" is a default reason *for* an action here, but operates as *no reason at all* (or even a reason against) there, with other features adjusted holistically to maintain coherence. Is this a possible moral practice? *(Alternative Practice / Metaphysics of Reasons)*
      *   **Likely Reply:** No, such a practice is impossible. Reasons aren't constituted by practices; causing pain inherently provides a negative valence – a practice getting *that* wrong would be fundamentally mistaken about what matters.
      *   **Follow-Up:** What is the source of this *necessity* that causing pain *must* have negative valence? Doesn't this imply a general, necessary truth linking the non-moral feature (pain) to a moral valence (disvalue), precisely the kind of principle you reject?

  4.  **Question:** You concede minimal supervenience: no moral difference without a non-moral difference. This seems to generate indefinitely many true conditionals like "If N1, N2,... Nn, then M." Aren't these principle-shaped truths? Is your dispute with generalists then merely verbal (about what counts as a 'principle')? *(Supervenience & Principle-Shaped Truths)*
      *   **Likely Reply:** No, the dispute is substantive. While supervenience guarantees such truths, they are neither finitely stateable (due to holism) nor do they play the *explanatory or deliberative role* claimed for principles. They are merely descriptive shadows, not action-guiding rules.
      *   **Follow-Up:** What concrete test could distinguish whether these supervenience truths *merely describe* patterns (as you claim) or whether they *explain* the moral facts (as generalists claim)? How would we adjudicate this difference?

  5.  **Question:** Concerning default reasons and silencing: isn't the distinction between default and non-default reasons, and the very concept of 'silencing' (vs. outweighing), itself functioning like a hedged general principle? Doesn't marking silencing require *some* account of *what kinds of things* silence *what*? *(Defaults & Silencing as Implicit Principles)*
      *   **Likely Reply:** No. Silencing is a particular fact about how reasons interact *in a specific case*. It's not governed by a rule stating "Feature X silences Feature Y." The judge perceives that, *here*, the default reason is simply absent or silenced by the context.
      *   **Follow-Up:** If silencing isn't rule-governed, what makes it the *same phenomenon* ("silencing") across different cases? How can judges learn to recognise it or communicate about it without *any* criterion or pattern governing when it occurs?

  6.  **Question:** You say the wrong-making features of an action are simply these features *in this case*. But given holism, the same feature can be inert or even right-making elsewhere. What *explanatory work* is "making" doing here? *(Explanatory Role of "Making")*
      *   **Likely Reply:** The "making" signifies that *these* features, configured *thus*, are what *constitute* the wrongness here. It's not that they point to a general rule; they *are* the particular ground of wrongness in this instance.
      *   **Follow-Up:** If the features *constitute* the wrongness *only in this specific configuration*, doesn't this collapse the idea of them "making it wrong" into the minimal supervenience claim that *this* base necessitates *this* moral property? What *additional* explanatory force does "making" have?

  7.  **Question:** Your anti-regress move: when you say application isn't rule-governed, do you mean this challenges the *content* of moral judgement itself (that it isn't general), or only describes the *psychology* of how we apply rules (which even generalists concede isn't fully codified)? *(Anti-Regress: Content vs. Psychology)*
      *   **Likely Reply:** It challenges the content. The judgement itself is about the particular case; it *is* the perception of what matters *here*. The demand for a general principle governing *this* judgement leads to the regress, showing the judgement isn't an application of a general rule.
      *   **Follow-Up:** If the judgement's content is purely particular, not generalizable, how is it distinct from a mere hunch or intuition? Why should we expect convergence among competent judges across different cases if there is *nothing general* for them to be tracking or getting right?

  8.  **Question:** What concrete finding – armchair or empirical – would you accept as evidence *against* your particularism and *for* generalism? For instance, discovering a feature whose valence *never* changes, or one that *always* changes unpredictably? *(Falsifiability / Evidence)*
      *   **Likely Reply:** Genuine invariance (a feature *always* counting the same way, in *every* conceivable context) would be strong evidence for a general principle governing that feature. Holism predicts valence variance is possible in principle for (nearly) any feature.
      *   **Follow-Up:** If you found a feature whose valence *seemed* invariant across all cases examined so far, how would you distinguish between "This is a true invariant principle" and "We just haven't found the defeating context yet"? What *would* convince you it's invariant?
