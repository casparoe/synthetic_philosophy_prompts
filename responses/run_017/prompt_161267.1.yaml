  The blue mug waits. The kettle starts to sing.
  I calculate the air my arm displaces.
  **How the world would unfold if I stood still**
  is priced against the dust my movement raises.
  The cat sleeps on. The fragile vase could spill.
  **But my own task changes what it fulfills.**

  The vase could break? The cat might wake? I weigh
  the paths still open should I stir the air.
  **How the world would unfold if I stood still**
  counts every shift, both common and most rare.
  What I displace is counted as the cost.
  **But my own task changes what it fulfills.**

  A broken shape cannot be made anew,
  a startled cat may settle back to sleep.
  **How the world would unfold if I stood still**
  holds vanished futures counting dark and deep.
  The penalty’s the path I close for good,
  **But my own task changes what it fulfills.**

  The dust, the air, the molecules that stir
  within the cat’s fur, altered by my tread?
  **How the world would unfold if I stood still**
  sees magnitudes no value-lens has read.
  The unit shifts with how the world is drawn.
  **But my own task changes what it fulfills.**

  My own hands narrow what my hands may do.
  The boiling sound grows sharper. Where to climb?
  **How the world would unfold if I stood still**
  contracts the reach remaining in my time.
  I shrink the room with every move I choose.
  **But my own task changes what it fulfills.**

  **How the world would unfold if I stood still,**
  **But my own task changes what it fulfills.**
