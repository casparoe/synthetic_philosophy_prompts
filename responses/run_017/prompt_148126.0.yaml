  My core thesis: The paradox stems from assertion's constitutive norms. When asserting p, you undertake a commitment to knowing p (KNA). Classic Moore fails because: 
  - First conjunct commits you to knowing p 
  - Second conjunct denies a necessary condition for knowing (believing p) 
  This creates a performative contradiction. 

  Applying this to (1): 
  - "Probably p" asserts probabilistic knowledge (e.g., knowing p is likely) 
  - "I'm only 40% confident" denies the required credence level for that knowledge 
