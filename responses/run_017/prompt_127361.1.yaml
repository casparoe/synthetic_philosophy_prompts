  For claim (a): The letters are contemporaneous and specific, akin to the 1968 interview (precedent 1) and the letter to the editor (precedent 3). But they're private, unlike those. Precedent 3 involved a private letter *about a textual change*, treated as confirming intent. Here, (a) is about interpretation, not a change. Precedent 2 (1997 interview) was retrospective and rejected. Since these letters are contemporaneous with composition, they might be seen as "compositional intent" rather than definitive for the published text. Precedent 6 (drafts) is clear: earlier versions don't override the published text. So (a) likely goes to apparatus, not headnote—genesis, not meaning. 

  For claim (b): This is more radical. The text doesn't support it; it's an external reinterpretation. Precedent 6 is directly analogous: drafts where Anne speaks don't alter the published silence. Similarly, here, the letters propose a narrative twist absent from the text. Precedent 1's "decisive" ruling applied only when the text was ambiguous and the evidence was public. (b) has no textual ambiguity to resolve—it contradicts the text. So it'll likely be apparatus-only. 

  The precedents support multiple rules. Rule A: Only public, contemporaneous statements directly inform meaning (precedents 1, 3). Rule B: Private compositional material is genesis, not meaning (precedents 3, 6). Rule C: Evidence must resolve textual ambiguity to be "decisive" (precedent 1). Under Rule A, both (a) and (b) are inadmissible for meaning (private). Under Rule B, both are genesis. Under Rule C, (a) might be admissible if the text is ambiguous about Anne's state, but (b) isn't because the text isn't ambiguous about the chapter's reality. 

  My best guess: Both (a) and (b) will be ruled genesis/apparatus. Precedent 3 (private letter about a cut) is the closest for (a), but it was about a specific revision, not general interpretation. Precedent 6 (drafts) is closer for (b). The competing candidate—precedent 1—doesn't apply because the letters aren't public. 

  If the letters were to the editor, they'd be like precedent 3—potentially "confirming" intent if about a change. If written post-publication, they'd be like precedent 2—inadmissible. A hypothetical: If Lockhart had written a contemporaneous public essay stating (a) or (b), it'd be decisive under precedent 1. 

  The user might also worry about coherence. Pushing (a) to the headnote could open floodgates for private material. Sticking to public evidence maintains clear boundaries. The estate's clearance doesn't change the evidence type—it's still private compositional material. 

  In sum: Predict both (a) and (b) for apparatus. The closest precedent for (a) is 3 (but weaker); for (b) it's 6. A public statement would change things, but this isn't that.
