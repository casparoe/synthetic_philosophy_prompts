answer: |-
  ## Office for Derivation Compliance  
  **Guidance Note 14: Unlicensed Normative Ascent**  
  **Version 3.2 (Provisional)**  
  *Issued under Section 7(1)(c) of the Normative Derivation Act 2018 (as amended)*  

  **1. Introduction**  
  1.1. This Guidance Note (GN14) provides authorised inspectors with procedures for identifying, classifying, and penalising instances of Unlicensed Normative Ascent (UNA) pursuant to Sections 2-5 of the Act.  
  1.2. UNA occurs where a normative conclusion (e.g., containing "ought", "should", "must", "good", "bad", "right", or "wrong") is asserted without a valid Derivation Licence permitting its inference from purely descriptive premises (e.g., containing "is", "are", "was", "were", "fact", or empirically verifiable data).  
  1.3. The core legislative principle is that a conclusion not supported by its premises ought not to be asserted. Authority derives from the Act itself, duly passed by Parliament and receiving Royal Assent on 1st April 2019.  

  **2. Classification & Tariff Application**  
  2.1. Upon detection of a putative UNA event, inspectors must classify it into one of five Categories (Cat-1 to Cat-5) based on Severity and Intent (see Annex A: Tariff Schedule).  
  2.2. **Crucial Challenge:** Premises must be definitively classified as **Descriptive (D-Prem)** or **Normative (N-Prem)** prior to assessing the derivation.  
  2.3. **Problematic Cases:** Terms exhibiting both descriptive and normative aspects ("thick concepts", e.g., *cruel, cowardly, generous, degrading*) cannot be reliably classified by field inspectors.  
  > *2.3.1. Procedure:* Flag premises containing thick concepts using Form TC/1 and refer to the Thick Concepts Working Group (TCWG) for definitive classification.  
  > *2.3.2. Status Note:* The TCWG was established in Q3 2019. It has convened quarterly but has not yet issued classification guidance. Provisional classification is suspended pending TCWG output. UNA assessments involving thick concepts are currently on hold.  

  **3. Licensed Exemptions: Category 3 (Conditional Derivation)**  
  3.1. A valid Derivation Licence (Type C3) exists for inferences of the form: "If Agent A desires Outcome O, and Action Y is demonstrably necessary to achieve O, then A ought to do Y."  
  3.2. **Operational Difficulty:** Verification requires establishing:  
      a) The *actual* desire of Agent A for O (not merely asserted or presumed).  
      b) The *exclusive necessity* of Y for achieving O.  
  3.3. **Common Non-Compliance:**  
      > *Example 1:* "As we all want a prosperous society [Unverified Universal Desire], businesses ought to receive tax cuts."  
      > *Analysis:* Premise "we all want..." is normative/masked universal prescription, not verified desire. Licence C3 invalid. UNA likely (Cat-2: Reckless Presumption).  
  3.4. **Detection Test Inadequacy:** The "Agent-Specific Verification Protocol" (ASVP, Form D9) relies on self-certification by Agent A, which is frequently unreliable or impossible (e.g., when "A" is "society", "the public", or a historical figure). Consequently, many invalid C3 licences are issued or claimed in error. Inspectors should apply heightened scrutiny to any derivation invoking universal or collective desires.  

  **4. Biological/Functional Claims (The "Good Knife" Problem)**  
  4.1. Instances occur where normative conclusions are derived from statements about biological function or artefact purpose:  
      > *Example 2:* "A knife that does not cut effectively is a bad knife."  
      > *Example 3:* "A heart that fails to pump blood efficiently is defective."  
  4.2. **Status:** The Office recognises the theoretical distinction between *functional evaluation* ("good *as an X*") and *moral evaluation* ("good *simpliciter*").  
  4.3. **Current Position:** These derivations occupy a Grey Area (Designation: FB-1). A 2021 internal review (FB/1 Report) suggested potential for a limited Derivation Licence (Type B1) restricted to uncontested biological functions and unambiguous artefact definitions. However, concerns were raised regarding potential "creep" into moral domains (e.g., "A human who does not reproduce is biologically defective").  
  4.4. **Action:** Inspectors encountering FB-1 cases should suspend assessment and submit Form FB/2 for Central Case Review. *Do not apply tariffs*. Await further guidance (FBWG established Q1 2023; first meeting scheduled Q4 2024).  

  **5. Institutional Facts ("The Promissory Obligation Appeal")**  
  5.1. A persistent class of appeals concerns utterances like "I hereby promise to Φ" allegedly generating the normative conclusion "I ought to Φ".  
  5.2. Appeal Case REF: PROM/001/2019 remains unresolved. The Derivation Compliance Tribunal (DCT) Panel has issued 3 conflicting interim opinions:  
      a) *Opinion A:* "Promise" is a purely descriptive speech-act; "ought" derives illegitimately.  
      b) *Opinion B:* Uttering "I promise" *creates* the descriptive fact of a promise existing within a social institution; the "ought" is then licensed under implied social rules (Licence S1 - Social Convention, requires verification of convention).  
      c) *Opinion C:* The entire derivation is a performative sleight-of-hand masking an inherent UNA.  
  > *Footnote 5.2/1:* Consensus on whether this represents a genuine counterexample or sophisticated UNA remains elusive. Pending final DCT ruling, inspectors should treat novel "promissory derivations" as potential UNA (Cat-4: Complex Institutional) and submit Form INST/3 for centralised advice.  

  **6. Worked Examples**  
  *Example 4: Clear UNA (Cat-1: Blatant)*  
  > Premise 1 (P1): The regime's actions are brutal. *(Potential Thick Concept - Refer TC/1)*  
  > Premise 2 (P2): Brutal regimes lack legitimacy. *(Normative Premise)*  
  > Conclusion (C): Therefore, the regime ought not to be recognised.  
  > *Analysis:* P2 is N-Prem. C is normative. Derivation lacks licence permitting N-Prem → N-Conclusion. **UNA Confirmed (Cat-1).** Apply Standard Tariff: Cease & Desist Order + Level 3 Fine.  

  *Example 5: Factual Dispute Blocking Assessment*  
  > Premise 1 (P1): Policy X will increase child poverty by 15%. *(Putative D-Prem)*  
  > Premise 2 (P2): Policies increasing child poverty are unacceptable. *(N-Prem)*  
  > Conclusion (C): Therefore, Policy X ought to be scrapped.  
  > *Analysis:* P1 is contested as factually inaccurate by the Policy Unit. Inspector cannot verify P1 as *descriptive fact*. Until P1 is verified as D-Prem (or classified otherwise), assessment of derivation from P1+P2 to C **cannot proceed.** Issue Notice of Factual Contention (Form FAC/1) to originator and Policy Unit. Suspend UNA assessment pending factual resolution. *(Note: This often results in indefinite suspension).*  

  **7. Retrospective Licensing & Amnesty**  
  7.1. Persons who identify past UNA within their own communications may apply for a Retrospective Derivation Licence (Form RDL/1), subject to a Non-Compliance Surcharge (See Annex A, Surcharge Table).  
  7.2. Amnesty Bin submissions (Form AMN/1) for low-severity, unintentional UNA (typically Cat-5) made within 30 days of derivation avoid surcharges but require corrective clarification.  
  > *7.2.1 Note:* Submission of a 400-page treatise from Prof. A. Thorne (Haddington Institute), arguing the D/N distinction rests entirely on "a persistent equivocation on the term 'fact'", to the Amnesty Bin was rejected as non-compliant. Form AMN/1 requires succinct corrective clarification only. The treatise was archived (REF: THEORY/UNREV/2022).  

  **8. Definitional Refinements**  
  8.1. **"Derivation Event":** For the purposes of this Act, "derivation" refers to the explicit or implicit logical movement from one or more premises to a conclusion within a single communicative act.  
  > *8.1.1 Clarification:* This includes enthymemes (arguments with unstated premises), *provided* the inspector can reasonably reconstruct the missing premise(s).  
  > *8.1.2 Limitation:* "Derivation" does not encompass purely rhetorical emphasis, *unless* normative force is attributed to descriptive content via implication judged by the Reasonable Listener Test (RLT v2.1 - under review).  
  8.2. **"Normative Ascent":** The transition within a derivation from a statement lacking prescriptive, evaluative, or deontic force to a statement possessing such force. (Formerly termed "Fallacious Derivation", revised Q2 2020 to avoid premature normative characterisation). Hence: **Unlicensed Normative Ascent (UNA).**  

  **9. Conclusion**  
  9.1. Vigilance in identifying descriptive premises and applying the correct Derivation Licence is paramount.  
  9.2. When in doubt regarding premise classification (especially Thick Concepts, FB-1 cases, or Institutional Facts) or licence validity, submit the relevant consultation form and await guidance.  
  9.3. The integrity of public discourse relies on strict adherence to the prohibition on Unlicensed Normative Ascent as mandated by the Act.  

  **Annex A: Tariff Schedules & Forms**  
  *(Available on ODC Intranet - Requires Level 2 Clearance)*  

  **Enquiries:**  
  UNA Helpdesk  
  ODC Central Mailbox  
  odc-una-helpdesk@gov.uk  
  *Typical Response Time: 12-16 weeks*  

  **Next Review Date:** To be confirmed (Pending TCWG & FBWG outputs).
