answer: |-
  ## Doctoral Fellowship Proposal: "Tools, Agents, and the Interruption Condition"

  **Brainstorming (Informal):**
  Framing the question as "What internal property (e.g., goal-directedness, world-modelling) *makes* a system an agent?" is too well-trodden; decades of philosophy of mind and action have debated necessary and sufficient conditions without consensus, often becoming disconnected from real-world system design. Alternatively, framing it as "When *should* we hold an artificial system morally responsible?" immediately plunges into deep, unresolved debates about moral patiency and desert, which are unlikely to yield a novel, tractable paper within nine months focused on the tool/agent *distinction* itself. The interruption condition offers a fresh, pragmatic lens grounded in observable interaction dynamics.

  **Proposal**

  **1. The Core Question & Framing:**
  This project asks: **Does the practical distinction between tools and agents in artificial systems fundamentally depend on a cluster of properties concerning human intervention during task execution – specifically, interruptibility, the need for justification of interruption, and the post-interruption attribution of action – and how do these properties dissociate in concrete cases?** Crucially, we treat this distinction as **pragmatic/engineering**, focusing on how systems are *treated within human practices* (e.g., delegation, explanation, liability assignment) rather than asserting a deep metaphysical essence or inherent moral status. This framing is defended because (a) it directly addresses the practical need for classification faced by engineers and regulators, (b) it sidesteps intractable metaphysical debates about consciousness or 'real' agency irrelevant to most deployment contexts, and (c) it allows us to analyse how functional interactions shape attributive practices without presupposing moral conclusions.

  **2. Why Existing Approaches Leave the Question Open:**
  Prevailing attempts to demarcate tools from agents focus either on *internal properties* or *moral consequences*. Internal-property accounts (e.g., possessing complex goal hierarchies, robust world-models, or sophisticated planning capacity) struggle because systems exhibiting these properties (like advanced optimisation algorithms) can still be treated as mere tools if they lack autonomy in interaction. Conversely, simple systems lacking these properties might be treated agentically if interactions are complex (e.g., basic chatbots eliciting social responses). Accounts focusing on *answerability* or *blameworthiness* conflate the distinction with moral responsibility, which is a separate (though related) issue; a system might be clearly an agent in functional terms (e.g., an autonomous trading bot) without being morally blameworthy, just as a complex tool might cause harm without being 'responsible'. Similarly, worries about responsibility gaps or distributed agency often *presuppose* an agent/tool classification rather than providing criteria for it. Finally, *reasons-responsiveness* accounts are valuable but often underspecified regarding the *mode* of response; crucially, they don't explicitly address the dynamics of *interruption* – whether the system merely *registers* the interruption as a new input (tool-like) or must *accommodate* it within its own ongoing goals and perspective (agent-like). The interruption condition probes precisely this interactional dynamic, which existing accounts neglect or treat peripherally.

  **3. Method: A Case-Based Conceptual Analysis**
  The project will employ a rigorous, case-driven conceptual analysis, constructing and dissecting contrasting scenarios to isolate and examine the proposed dimensions (interruptibility, justification requirement, action redescription). This is superior to pure conceptual analysis (which risks circularity without grounding), surveys of technical definitions (which catalogue usage without explaining it), or large-scale empirical studies (which are infeasible in nine months and may not reveal underlying normative structures). The method proceeds month-by-month:

  *   **Months 1-2: Conceptual Groundwork & Framework Refinement:** Precisely define the core concepts (tool, agent, interruption, justification, action redescription, principal) and articulate the initial hypothesis about their cluster and potential dissociation. Map existing internal-property and responsibility-based criteria onto this framework.
  *   **Months 3-5: Constructing & Analysing Contrasting Cases:** Develop a structured set of hypothetical and real-world-inspired cases designed to dissociate the three dimensions. Examples include:
      *   *High Interruptibility, Low Justification Need, Clear Principal Redescription:* A modern power drill with safety cut-off (stops instantly, no 'reason' needed, user action continues seamlessly).
      *   *High Interruptibility, High Justification Need, Ambiguous Redescription:* A sophisticated personal assistant AI accepting a pause command only after explaining current task criticality; post-resumption, is finishing the report *your* action or a joint one?
      *   *Low Interruptibility (Factual), No Inherent Ends:* A launched deep-space probe with no override (uninterruptible) but executing pre-programmed tasks without internal goals.
      *   *High Interruptibility (Compliance), Strong Inherent Ends:* A delivery drone easily recalled (interruptible) but actively re-planning routes based on its own efficiency goals; overriding it feels like commanding, not redirecting a tool.
      *   *Low Interruptibility (Legacy), High Redescription Ambiguity:* A critical factory control system where stopping mid-process ruins the batch; restarting feels like initiating a new action, not resuming the old one.
  *   **Months 6-7: Practice Analysis:** Examine how these dimensions manifest (or not) in existing domains like legal liability frameworks (e.g., product liability vs. vicarious liability for agents), HCI design principles, and system explanation practices (e.g., "Why did *it* do that?" vs. "Why did *using it* cause that?"). [*Placeholder: Consult specific legal cases/HCI studies.*]
  *   **Months 8-9: Synthesis, Writing & Annex Development:** Integrate findings into the core paper. Develop the practitioner's annexe.

  **4. Potential Results & The Practitioner's Annexe:**
  The project could conclude:

  1.  **Strong Dissociation:** The three dimensions are largely independent; "tool" and "agent" are simplistic labels obscuring a multidimensional space. Practice relies most heavily on (e.g.) post-interruption redescription for liability, while interruptibility matters for safety.
  2.  **Clustered Spectrum:** While dissociable, the dimensions tend to correlate, forming a spectrum from 'pure tool' to 'strong agent'. The interruption condition reveals where systems sit on this spectrum more reliably than internal properties alone.
  3.  **Redescription Dominance:** Post-interruption action attribution is the primary factor tracked by core practices (explanation, delegation), with interruptibility and justification being secondary indicators.

  **Deciding Factors:** Which result holds will depend on the analysis of the cases: Does dissociation consistently appear across diverse scenarios? Do practices consistently track one dimension even when others are absent or present? Does focusing on one dimension provide a more coherent explanation of our practices than the others?

  **Practitioner's Annexe:**
  This one-page guide would provide a decision framework based on the project's findings. It would likely pose key questions:
  *   *Interruptibility:* "Can the system's core task execution be cleanly paused/resumed by a human principal without catastrophic failure or data loss?"
  *   *Justification:* "Does overriding/pausing the system require providing reasons *it* must 'accept' or negotiate, beyond simple command execution?"
  *   *Redescription:* "After an intervention, is the resumed task still clearly *your* action, or does it feel like the system is now completing *its* task (even if under instruction)?"

  It would advise classifying systems based on the pattern of answers, flagging potential grey areas (like the legacy system case) and implications for design (e.g., ensuring interruptibility) and liability (e.g., if redescription is ambiguous). Crucially, it would **leave open** the system's *internal complexity* as a direct criterion and explicitly state it does *not* determine moral responsibility, only functional classification for attribution practices.

  **5. Honest Failure Conditions & Scope Management:**
  *   **Failure/Emptiness:** The project fails if analysis reveals the proposed dimensions *never* meaningfully dissociate in practice, always appearing together, making the 'cluster' analysis redundant. It also fails if the interruption dynamic proves irrelevant to actual classification practices observed in the case studies or literature. The question would be empty if "tool" and "agent" are shown to be so context-dependent or contested that no stable framework based on interaction is possible.
  *   **Scope Risks & Cuts:** The largest risk is entanglement in the moral responsibility debate. To avoid this, we strictly maintain the pragmatic/engineering framing, explicitly bracketing questions of ultimate blameworthiness or moral patiency. If scope threatens, we would cut the detailed analysis of legal liability frameworks, focusing instead on HCI and explanatory practices, or reduce the number of contrasting cases analysed in depth, focusing on the most illuminating dissociations. The core method (case construction and analysis) must be preserved.

  This project offers a novel, pragmatically grounded analysis of a crucial distinction in AI ethics and design, moving beyond internal properties or premature moralisation to focus on the dynamics of human-system interaction. It promises both conceptual clarity for philosophers and actionable guidance for practitioners navigating the complexities of modern artificial systems.
