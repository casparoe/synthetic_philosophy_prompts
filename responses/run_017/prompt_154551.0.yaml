prompt: |-
  You are a professional philosopher whose research sits at the intersection of the philosophy of action, moral responsibility, and the ethics of artificial systems. You are helping a doctoral candidate turn a half-formed idea into a fundable project. Please think carefully before writing. Begin with a short, informal paragraph of brainstorming (four or five lines is plenty) in which you try out at least two ways of framing the question and explain why each is too well-trodden to be worth nine months of a person's life; then, with the framing you have chosen, write the proposal itself in a polished register.

  The situation: I am applying for a nine-month doctoral fellowship. The deliverable is a single paper of about 10,000 words, plus a one-page practitioner's annexe for engineers and product leads who have to classify systems in practice. Working title: "Tools, agents, and the interruption condition."

  My half-formed idea is this. Most attempts to draw the tool/agent line look for a property *inside* the system — goal-directedness, planning, a world-model, the capacity to respond to reasons, some threshold of generality. But in practice the line seems to be drawn by something relational, and I think that something is what happens when a human principal intervenes mid-task. With a tool, you can suspend the operation, redirect it, and resume it, and the resulting sequence is still redescribed as *one action of yours*; nobody has to renegotiate what the process is for. With an agent, an interruption is something the system has to accommodate among its own ongoing concerns, and after the interruption there is a question about whether the resumed sequence is still your action or now partly its own. Call this the interruption condition. My suspicion is that it does real work that the internal-property accounts do not, but that it is not a single condition: interruptibility in fact, the need to *justify* an interruption to the system, and the redescription of post-interruption behaviour as the continuation of the principal's action can all come apart. A batch job nobody can now stop is uninterruptible but has no ends; a system with genuine goal-directedness that has been heavily shaped for compliance is trivially interruptible but arguably still has ends that must be overridden. So perhaps the tool/agent distinction is really two or three distinctions that we have been running together, and the interesting philosophical pay-off is a map of where they diverge and which one(s) our practices — blame, explanation, delegation, liability — actually track.

  Write the proposal with the following elements:

  1. The question, stated precisely enough that it has a determinate answer and is not merely a request to clarify words. Say explicitly whether the project treats the tool/agent distinction as a metaphysical difference, a moral one, or a pragmatic/engineering one, and defend that choice briefly.
  2. Why the existing ways of drawing the line leave the question open. Engage with the familiar family of positions — internal-property accounts of agency, the idea that the difference is only about how much the system can be held answerable, worries about responsibility gaps and the dispersal of agency across many hands, and reasons-responsiveness accounts — but do so by describing the positions, not by naming authors.
  3. The method, laid out month by month across nine months: what you would actually do, including the construction of the contrasting cases that dissociate interruptibility, justifiability of interruption, and redescription. Explain why this method is better here than the obvious alternatives (a conceptual analysis of "agent", a survey of existing technical definitions, or an empirical study of how engineers use the words).
  4. What the results could be: sketch two or three genuinely different conclusions the project might reach, and say which considerations would decide between them. Include the annexe: what would a usable one-page decision framework for practitioners contain, and what would it have to leave open?
  5. Honest failure conditions. What would count as the project having failed, or as having discovered that the question was empty? Also say plainly what could make it too large for nine months and what you would cut.

  Constraints: do not include a bibliography, a literature review, or any citations — I will supply those myself, and the argument must stand on its own conceptual footing without them. Where a step would depend on an empirical result about current systems, mark it as a placeholder to be filled in rather than asserting it. Write throughout in British English, and address the piece to a mixed assessor panel of philosophers and computer scientists, so avoid jargon that only one of them will follow.
