answer: |-
  ### Exam Question: Ethics Comprehensive Examination  
  **Time Allowed:** 90 minutes  
  **Total Marks:** 20  

  **Background:** The nonidentity problem challenges whether we harm future individuals when our choices affect which individuals exist. In the deterministic case below, policy choices alter identities but seem to harm no one because the affected individuals would not otherwise exist. In the Drift case, identity-affecting outcomes are probabilistic.  

  **Case 1 (Deterministic):**  
  A state energy ministry chooses:  
  - **Cheap:** Commission a reactor now, deferring waste storage costs. In 60 years, containment fails. Everyone alive then contracts a chronic, non-fatal illness. Lifetime welfare: 70 (still well worth living).  
  - **Safe:** Build proper storage. No illness. Welfare: 90.  
  *Stipulations:*  
  - No one alive at decision-time is affected.  
  - Same number of people exist under both policies.  
  - Different individuals exist under each policy (due to construction-induced social shifts).  

  **Case 2 (Drift):**  
  The ministry chooses:  
  - **Cheap:** Each candidate gamete-pair (from a large pre-existing pool) has a 0.4 probability of producing a person. Any person existing has welfare 70.  
  - **Safe:** Each candidate gamete-pair has a 0.4 probability of producing a person. Any person existing has welfare 90.  
  *Stipulations:*  
  - Gamete-pairs are indexed independently of policy choices.  
  - No gamete-pair’s probability of producing a person differs between policies.  
  - Expected number of people is identical under both policies.  
  - All lives are well worth living.  
  - For no candidate is it true that they would exist under one policy but not the other.  

  **Questions:**  
  (a) Explain why the claim “Cheap harms no one” succeeds in the deterministic case but is *unavailable* (not merely false) in Drift. (4 marks)  
  (b) Formulate the strongest complaint against Cheap in Drift (e.g., based on expected welfare or welfare conditional on existence). Argue whether this complaint is genuinely person-affecting or only appears so. (4 marks)  
  (c) Identify the implicit premise about the identity of merely possible people required to sustain the complaint in (b). Show that the standard nonidentity argument does not supply this premise. What follows if we grant it? What if we deny it? (4 marks)  
  (d) Trace one significant downstream cost of granting this premise for wider ethical theory. (4 marks)  
  (e) What practical implication does Drift hold for duties to future generations, given real-world policy uncertainty about deterministic vs. chancy identity-affecting effects? (4 marks)  

  ---

  ### Model Answer (850 words)  
  **Part (a):**  
  In the deterministic case, "Cheap harms no one" succeeds because each individual who exists under Cheap *would not* have existed under Safe. Since no one is worse off than they would otherwise have been (their only alternative is nonexistence), there is no subject for harm. In Drift, this reasoning is unavailable because no *de re* counterfactual links a specific person’s existence to Cheap: for any given candidate, Cheap neither causes nor prevents their existence. The complaint shifts from "no individual is harmed" to "there is no identifiable victim to whom harm is done."  

  **Part (b):**  
  The strongest complaint against Cheap in Drift is that it lowers each candidate gamete-pair’s *expected welfare*. Under Cheap, each candidate has a 0.4 chance of existing with welfare 70, yielding expected welfare of 28 (0.4 × 70). Under Safe, expected welfare is 36 (0.4 × 90). This 28 vs. 36 gap grounds an impersonal complaint: Cheap produces less expected value. However, this complaint is *not genuinely person-affecting*. Expected welfare attaches to gamete-pairs (abstract candidates), not actual persons. No existing or future person can claim, "I was made worse off," since no individual experiences both policies. The complaint merely mimics person-affecting form by indexing expectations to candidates, but candidates are not subjects of experience until actualized.  

  **Part (c):**  
  The complaint assumes that **merely possible people (as indexed by gamete-pairs) can be bearers of expected welfare**. This premise treats unactualized candidates as persistent subjects across possible futures, allowing comparisons like "this candidate’s expected welfare is lower under Cheap." The standard nonidentity argument avoids this premise—it only claims that *actual* people cannot be harmed in deterministic same-number cases. If we grant the premise, we can condemn Cheap for reducing expected welfare per candidate. If we deny it, Drift collapses into impersonalism: Cheap is worse only because it produces less total welfare, not because it wrongs candidates. The nonidentity problem thus relocates: we must now defend whether possible people are subjects of harm in expectation.  

  **Part (d):**  
  Granting this premise invites significant costs. If possible people are welfare-bearers, we risk *overdemanding obligations*. For instance, not conceiving a child today might "harm" a possible future child by depriving it of existence—even if another child is conceived later. This inflates population ethics, forcing us to weigh the expected welfare of every possible person against actual ones. It also contradicts the intuition that duties require subjects who can experience benefits or harms.  

  **Part (e):**  
  Drift implies that duties to future generations cannot rely on deterministic nonidentity reasoning in real-world policymaking. Since we cannot verify whether identity-affecting policies are deterministic or chancy (e.g., climate policies subtly shift conception timing), we must default to evaluating expected welfare impacts on the pool of possible people. This favors risk-aversion: policies lowering expected welfare per candidate (like Cheap) are unjustifiable, even if no deterministic victim exists. The nonidentity problem is not dissolved but becomes a call for precaution in the face of uncertainty.  

  **Verdict:** The Drift case does not dissolve the nonidentity problem—it relocates it. The core issue shifts from "no harm to actual people" to "can possible people be harmed in expectation?" while exposing partition sensitivity. If candidate probabilities *differ* (e.g., some gamete-pairs have higher fertility under Cheap), carving the candidate pool differently (e.g., grouping gamete-pairs by genetic traits) would alter expected welfare calculations. With uniform probabilities (as stipulated), this threat is neutralized, but the metaphysical burden remains: we must justify treating non-actual candidates as subjects.  

  ---

  ### Marking Scheme (5 × 4 marks)  
  **Must-hit points (4 marks each):**  
  1. **Deterministic vs. Drift distinction:**  
     - *Hit:* Cheap in the deterministic case allows "no one is worse off" due to *de re* counterfactuals; Drift lacks these, making the claim unavailable.  
     - *Common error:* Confuses unavailability with falsity or invokes same-person harm.  

  2. **Expected welfare formulation and person-affecting status:**  
     - *Hit:* Identifies expected welfare per candidate (28 vs. 36) as the strongest complaint; argues it is not genuinely person-affecting (no subject experiences both outcomes).  
     - *Common error:* Focuses on conditional welfare (given existence) or misses the candidate-indexing requirement.  

  3. **Hidden premise and its implications:**  
     - *Hit:* Names "possible people as bearers of expected welfare" as the required premise; shows the standard argument omits it; outlines consequences of granting/denying it.  
     - *Common error:* Lists standard nonidentity tools (person-affecting restriction) without isolating the new premise.  

  4. **Downstream cost:**  
     - *Hit:* Traces one plausible cost (e.g., overdemandingness, incoherence with experiential harm).  
     - *Common error:* Vague appeals to "counterintuitive results" without specificity.  

  5. **Practical implication:**  
     - *Hit:* Links real-world uncertainty to a duty of precaution via expected welfare.  
     - *Common error:* Suggests Drift dissolves all nonidentity concerns.  

  **Grading Threshold:**  
  - **B answer (12–15 marks):** Correctly recapitulates standard nonidentity tools (e.g., person-affecting restriction, same-number quality) and loosely applies them to Drift (e.g., "Still no harm!"). May identify expected welfare but misses the *candidate-indexed* premise.  
  - **A answer (16–20 marks):** Isolates the determinism assumption as load-bearing in the standard argument and demonstrates how the argument transforms without it—e.g., showing Drift forces a choice between denying possible-people welfare-bearing or relocating harm to expectations. Explicitly engages the "unavailable vs. false" distinction in (a) and the partition-sensitivity threat in the verdict.
