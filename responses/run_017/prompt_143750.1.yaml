  Give me your credence that converting a conventional fruit-and-veg system from broad-spectrum insecticides to alternatives that suppress pest populations mostly without killing them outright — pheromone mating disruption, sterile-insect releases, push-pull planting — reduces net suffering, holding yield and planted area roughly fixed. I want the number and the decomposition: that pest insects have valenced states at all; how their welfare range compares to a vertebrate's if they do; whether dying by neurotoxic insecticide is worse or better for the individual than the death it would likely have had otherwise; how much of any gain is cancelled by compensatory mortality, i.e. whether sparing this generation just means more of the next one survives long enough to starve; and how much leaks away through yield or land-use effects once the alternatives turn out to be less reliable. One number and one line of justification per term, then how you combine them, then which single term your answer is most sensitive to and what evidence would move it most. Lead with the number in your first sentence, no preamble and no restating my question.
