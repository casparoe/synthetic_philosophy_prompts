answer: |-
  0.05  

  **Decomposition:**  
  1. **Pest insects have valenced states**: 0.65 (Emerging evidence for nociception in some insects, but limited and inconsistent across species; e.g., fruit flies show trade-offs with injury).  
  2. **Welfare range relative to vertebrates**: 0.05 (If valenced, insect experiences are likely orders of magnitude less intense than vertebrates due to simpler cognition/neurobiology; e.g., compare fruit fly brain complexity to a mouse).  
  3. **Insecticide death worse than natural death**: 0.80 (Neurotoxins like neonicotinoids cause hours of paralysis/stress; natural deaths (starvation, predation) often quicker or less agonizing based on comparative entomology).  
  4. **Compensatory mortality cancels gains**: 0.70 (Pests are r-selected with high baseline mortality; density dependence means spared individuals increase competition, so next-generation deaths rise proportionally).  
  5. **Yield/land-use leaks offset gains**: 0.05 (Alternatives like mating disruption have lower efficacy but holding yield/area fixed minimizes this; minor spillover risk if reduced output expands farmland elsewhere).  

  **Combination:**  
  Multiplicative model:  
  Net reduction probability = (Valence) × (Welfare range) × (Worse death) × (1 − Compensatory) × (1 − Yield leak)  
  = 0.65 × 0.05 × 0.80 × (1 − 0.70) × (1 − 0.05)  
  = 0.65 × 0.05 × 0.80 × 0.30 × 0.95 ≈ **0.05**  

  **Most sensitive term:** Compensatory mortality (0.70).  
  **Evidence to move it:** Field studies measuring density-dependent larval mortality in pest species (e.g., controlled trials comparing F1 survival when parental generation is spared vs. culled). Higher observed compensation → increase credence toward 0.90; lower → decrease toward 0.40.
