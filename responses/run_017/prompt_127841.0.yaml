  The audience composition is critical. There are neo-Griceans who value recognition clauses, formal semanticists wanting compositional benefits, a relevance theorist skeptical of Gricean pragmatics, experimentalists seeking operationalization, and an advisor concerned about institutional speech. Each will have distinct objections based on their priorities.

  For the prep sheet, I should identify the most damaging objections first. The neo-Griceans might argue that stealth cases aren't communicative acts at all. This is fundamental because if they're right, the whole thesis collapses. The semanticists might question the payoff for compositional semantics, which could undermine the theory's utility. The relevance theorist might dismiss the need for Gricean revision, advocating their framework instead. 

  The therapist example's vulnerability is crucial. If someone argues that the patient's inference is based on natural meaning rather than speaker meaning, it challenges the existence of stealth uptake. The user needs a solid reply here, perhaps by emphasizing the intentional design and communicative success despite lack of recognition.

  Role-anchored cases might be seen as merely a matter of reference (who "the speaker" is). The user must clarify that it's about the attributional target's nature (role vs. individual), not just stipulation. Conceding that some cases can be handled by group agency but insisting on the distinctness of institutional roles could be a strategy.

  For the relevance theorist, acknowledging their framework's coverage but arguing for the diagnostic value of the Gricean lens might help. The experimentalists will want testable predictions, so offering concrete hypotheses (e.g., neural differences in recognition) is essential.

  The advisor's concern about smuggling in institutional theory is valid. The user should either own the institutional aspect or clearly delineate the boundaries of their claim. Conceding this early could save time.

  The "hoped nobody asks" question about whether designed uptake requires linguistic communication is a sleeper threat. If non-linguistic cases are included, it might overextend the theory. The user should preempt this by clarifying scope.

  Prioritizing objections by damage: neo-Gricean attack on stealth cases, semanticist's "so what?", relevance dismissal, operationalization demand, advisor's concern, group agency rebuttal, cancellability payoff, and the linguistic scope question. 

  Confidence levels: high on neo-Gricean and semanticist objections (they're predictable), medium on experimentalists (they'll push for empiricism), lower on relevance theorist (could surprise). The reply about cancellability payoff might be shaky if the link isn't concrete.

