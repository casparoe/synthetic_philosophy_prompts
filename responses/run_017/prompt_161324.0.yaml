prompt: |-
  I'm on my school's Ethics Bowl team, and we keep hitting the same wall whenever a case involves someone doing something good that nobody, strictly speaking, had to do. Every definition we invent in practice either swallows the phenomenon — suddenly everything good is optional and no one is ever criticised for doing nothing — or empties it, so that anything worth doing becomes something you're required to do and the category we care about disappears. I'd rather stop guessing and get my own reactions into some order, so here are my gut verdicts on a batch of cases, including a few we made up because the standard ones don't separate the things I want separated.

  (a) A passer-by wades into a cold canal to pull out a child who fell in: knee-deep water, miserable, small risk of hypothermia, no real danger to life. Praiseworthy; I don't blame someone who walks on. (b) The same rescue, performed by an off-duty lifeguard who happens to be there and could do it at essentially no risk to herself: still praiseworthy, but less so than (a), and her walking on feels like a failing in a way (a)'s doesn't. (c) Donating a kidney to a stranger: hugely praiseworthy, and I recoil from saying it's required. (d) Donating a kidney to your own brother, same cost, same surgery: I still don't want to call it required, but declining feels much worse to me than declining in (c), and I can't say why. (e) The second shift: someone gives up Saturday to help a neighbour move, is asked to give up Sunday too, and says no. No blame at all — less than if he'd refused the first request — yet saying yes would impress me more than saying yes to the first request did. That pair is the one I can't fit into any single account. (f) Cheap heroism: an unusually strong swimmer does (a) at negligible cost and rather enjoys the attention. Praiseworthy, but barely; it strikes me as a bit like showing off. (g) Preemptive: registering as an organ donor now, while it's voluntary, shortly before a new policy makes it the default. Faintly praiseworthy now, and I think it stops being praiseworthy the moment it's expected. (h) Borrowed generosity: giving a thousand dollars to famine relief while owing a thousand to a friend who needs it back. Not praiseworthy to me at all — perhaps worse than not giving — even though the recipient is benefited exactly as much as in a clean donation. (i) A case my teammates and I invented, which we call shadow supererogation: you decline the good act knowing someone else will step in, and they do, so nobody is worse off. Not praiseworthy, not blameworthy either, and yet there is something slightly off about you that I can't put my finger on. My verdicts also seem torn between two ways of sizing up credit: by what the act cost the agent, which is why the lifeguard gets less, or by how much good it did, which is why the kidney donor outranks the guy who gave up a Saturday.

  So: is there one principle that captures this pattern — the acts that are good and optional and whose omission isn't blameworthy, plus whatever clause is needed for cost, for relationships, for doing it second, and for doing it with other people's money — or does the pattern force me to drop one of my verdicts? Please state the principle precisely and tell me what it predicts about a case I haven't listed: an optional good act performed incompetently, leaving the person you meant to help worse off than if you'd never intervened. Keep your whole reply under 450 words, and structure it as follows: one sentence stating the principle up front, then one short line per clause naming the case that motivates it, then your verdict on the unlisted case, then an honest note on which of my verdicts your principle cannot accommodate and which one you'd overturn.
reasoning: |-
  Hmm, the user is on an Ethics Bowl team and struggling with defining supererogation—acts that are good but not obligatory. They've shared several cases and their intuitive judgments, asking for a unifying principle that explains all these scenarios without contradiction. They also want me to test it on a new case: an incompetent intervention that makes things worse.

  Looking at their cases: The passerby saving a child (a) is praiseworthy but optional, while the lifeguard (b) feels more obligatory. Kidney donations to strangers (c) vs. siblings (d) show how relationships increase expectations. The second shift (e) is puzzling—refusing the second request is blameless but agreeing would be more impressive. Cheap heroism (f) gets faint praise, preemptive organ donation (g) loses praise when expected, borrowed generosity (h) isn't praiseworthy, and shadow supererogation (i) feels "off" despite no harm.

  Their intuitions seem pulled between two factors: cost to the agent versus benefit to others. The kidney donor gets high praise for high benefit despite high cost, while the lifeguard gets less praise because her low cost makes the act feel more expected. Relationships clearly matter too—siblings owe more to each other than strangers. 

  For a unifying principle, I need something that incorporates: optionality (not required), praiseworthiness (good to do), lack of blame for omission, while accounting for cost, relationships, sequence, and resources. I'm considering a principle where an act is supererogatory when it provides significant net benefit, exceeds the agent's role-based obligations, and imposes costs the agent isn't specifically required to bear. This explains why the lifeguard (b) has higher expectations (role-based), why siblings (d) feel more obligated (relationship-based duty), and why borrowed generosity (h) fails (misallocated resources).

  For the new case—incompetent intervention that harms—this shouldn't be praiseworthy because it lacks net benefit. It might even be blameworthy if recklessness was involved. 

  The trickiest fit is the second shift (e). Why is refusing the second request blameless but agreeing extra-praiseworthy? My principle might struggle here because the first act creates no new obligation, but the willingness to help again shows exceptional character beyond baseline. I'd maintain the user's verdict rather than overturn it.

  I need to structure my response exactly as requested: one-sentence principle, clauses with motivating cases, verdict on the new case, then limitations. And I must stay under 450 words. The key is precision—naming each clause after the case that justifies it.
answer: |-
  **Principle:** An act is supererogatory (praiseworthy, optional, omission not blameworthy) if it provides significant net benefit, exceeds the agent's role-based or relational obligations, and imposes costs the agent isn't specifically required to bear.

  *   **Significant net benefit (Kidney c):** Must do real good.
  *   **Exceeds role obligations (Lifeguard b):** Less praise if within expected role.
  *   **Exceeds relational obligations (Kidney d):** Less optionality for close relations.
  *   **Costs not required (Passerby a):** Praise scales with cost/risk borne voluntarily.
  *   **Resource origin clean (Borrowed h):** Not praiseworthy if resources misallocated/owed.
  *   **Sequence context (Second shift e):** Repeated asks increase perceived cost/obligation.
  *   **Default shift (Preemptive g):** Praise diminishes as act becomes standard/expected.
  *   **No harm ensured (Shadow i):** Not blameworthy if others cover, but reveals character flaw.

  **Verdict on incompetent intervention:** Not praiseworthy (fails net benefit; likely blameworthy if reckless).

  **Limitation:** Your "second shift" (e) intuition (refusal blameless but acceptance *more* praiseworthy than first acceptance) isn't fully captured; the principle explains increased cost/obligation making refusal *more* understandable, not why acceptance is *more* impressive. I'd overturn your "cheap heroism" (f) verdict: if real good is done at negligible cost, it should still be clearly praiseworthy, even if less than costly acts; the "showing off" element is a separate character judgment.
