  Here’s a sestina draft for Lena, aiming for that precise, weary, understated complexity:

  **The Catch (Sestina for a Tuesday Afternoon)**

  This muggy hour feels like the garden’s **hinge**,
  the point where growth tips, starts to **close**.
  She checks the beans, avoids the wilting **waste**,
  turns back indoors. The kettle’s **ordinary**
  shriek reminds her: actions run **downstream**.
  She clicks it off. A familiar **lock**.

  The safety report draft, a stubborn **lock**
  on her young mind. The lab’s thin **hinge**
  on sanity. Procedures, **downstream**
  effects considered, doors held **close**
  against the casual, the **ordinary**
  slip that blooms to costly **waste**.

  Not just spilled time, the small **waste**
  of minutes. Think of systems **lock**ed
  in error paths, the **ordinary**
  failure scaling up. The fragile **hinge**
  on futures vast. Keep the valve **close**
  d, guard the flow **downstream**.

  What flows unchecked **downstream**
  accumulates. A rising tide of **waste**.
  Missed chances silt the channels, **close**
  off routes. Once patterns **lock**,
  it’s harder, later, to reset the **hinge**.
  That’s not doom-saying, just **ordinary**

  physics. Like the bus, **ordinary**
  late by minutes, stranding souls **downstream**
  from work or home. A tiny **hinge**
  on lives. The cost of unseen **waste**
  compounds. Prevention’s subtle **lock**
  against catastrophe held **close**.

  That photocopier jammed so **close**
  to deadline? Fixable. An **ordinary**
  frayed wire bypassed. Quick **lock**
  released. But systems further **downstream**
  grow rigid. Tolerance for **waste**
  shrinks. The critical **hinge**

  weakens. **Downstream**, paths diverge. The **hinge**
  **close**s – not near, but shut. **Ordinary**
  **lock**-ins crystallize. And **waste**... oh, **waste** endures.

  ---

  **How it meets your specs:**

  1.  **Astronomical Waste (Implied, Not Preached):** The focus is on scaling and compounding ("small waste / of minutes" -> "costly waste," "missed chances silt the channels," "cost... compounds"). The vastness is in the implication of "futures vast" and the unstoppable flow "downstream," contrasted with the mundane effort ("Fixable. An ordinary / frayed wire bypassed"). Lena sees the pattern, not the scale, trusting the math she doesn't state.
  2.  **The Window Closes:** The hinge is repeatedly tied to fragility ("fragile hinge," "critical hinge / weakens") and transience ("This muggy hour feels like..."). The finality of "close" (meaning shut) in Stanza 6 and the envoi ("The hinge / closes – not near, but shut") explicitly states the window ends. "Lock-ins crystallize" emphasizes permanence after the hinge period.
  3.  **The Risk of Bad Lock-In:** Stanza 4 introduces "error paths" and "failure scaling up." Stanza 5 warns "patterns lock" and "systems further downstream / grow rigid." The envoi delivers the key murkiness: "**lock**-ins crystallize. And **waste**... oh, **waste** endures." This directly addresses the fear – the enduring "waste" isn't just lost potential, but potentially an actively bad, stable state worse than extinction (implied by the weary resignation in "oh, waste endures").
  4.  **Ambiguity of "Close":** It shifts throughout:
      *   Stanza 1: Temporal/Proximity ("starts to close" - like evening? season? opportunity?)
      *   Stanza 2: Physical/Preventative ("doors held close")
      *   Stanza 3: Temporal/Urgency ("Keep the valve closed" - implying *now*)
      *   Stanza 5: Temporal/Proximity? Physical? ("held close" - ambiguous)
      *   Stanza 6: Physical ("jammed so close") & Finality ("The hinge / closes – not near, but shut" - explicit shift).
      *   The envoi contrast ("closes – not near, but shut") confirms the intended ambiguity throughout and makes the final "close" in the envoi itself resonate with both meanings.
  5.  **Form as Argument:** The relentless rotation of the end-words forces the same core concepts ("hinge," "close," "waste," "ordinary," "downstream," "lock") into different combinations and grammatical roles without ever resolving. The argument *can't* settle within the form itself, mirroring the intellectual tension Lena lives with.
  6.  **Domestic Diction & Understatement:** Kettle, beans, bus, photocopier, frayed wire, safety report draft, garden. No grandiosity. The cosmic stakes are embedded in the *pattern* of small things compounding, not named directly. "Unborn billions" becomes the weary sigh "oh, waste endures."
  7.  **Lena's Voice & Uncertainty:** The tone is flat, observational, weary ("muggy hour," "familiar lock," "not doom-saying, just ordinary physics," the resigned "oh, waste endures"). The final line doesn't tie it off; it trails into enduring uncertainty and potential failure ("waste endures"). The envoi gathers the words but lands sideways: it states the hinge closes, lock-ins happen, and waste persists – it doesn't claim victory or offer easy justification, just the grim possibility she acted against.
  8.  **The "Answer":** The poem doesn't say "Because it mattered!" or "Who knows?". It says: *This is the structure of the problem I saw. The stakes were incomprehensibly large but patterned like small things. The chance was fleeting and fragile. The cost of inaction was potentially infinite waste, including the horror of a bad eternity. And the outcome is still unknown, maybe terrible. That's why I bothered.* It's an answer rooted in intellectual recognition of scale and fragility, not sentiment or certainty.

  This sestina aims for the precise, weary, intellectually honest, and deeply uncertain tone fitting Lena and the profound, unsettling hypothesis she grappled with. The domestic frame keeps it grounded, letting the terrifying implications emerge from the structure and repetition.
