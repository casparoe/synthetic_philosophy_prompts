  I work as a data engineer (no philosophy background at all — I came in through a bootcamp), and most of my week is spent merging records from systems that disagree with each other: one database says a client's address is X, another says it is Y, and X and Y are not the same. I also help run a fortnightly reading group of six people who are all self-taught and read slowly; we got onto true contradictions after someone brought a magazine article, and we spent two evenings talking past each other before realising we might not even be arguing about the same thing — some of us seemed to be arguing about whether the world itself can be inconsistent, others only about what you should do with yourself once you notice you believe things that clash. So I want something practical and small: a one-page decision tree that takes a newcomer from the starting point of accepting that contradictions can show up in what we say or believe, and lands them on a named position.

  Here is what I want it to be like. Seven to nine branch questions, each one a concrete case rather than a slogan, phrased so that a non-philosopher could answer it without already knowing which view it leads to. Please build the tree from the logical space rather than from a list of isms: start from the questions and the combinations of answers they permit, then place the actual positions in that space, mark the combinations nobody occupies, and say briefly why (incoherent? unattractive? merely unexplored?). The cases I want used, because they are the ones my group actually chewed on, are: the sentence that says of itself that it is false; a man with a thinning patch who is neither clearly bald nor clearly not bald; the instant a lamp switches from off to on; two promises I cannot both keep, where each really does seem to bind me; a club constitution that contains two contradictory rules, and the question whether the members may therefore conclude anything they like (for instance that they owe no subscription); my two disagreeing client databases, where I would be horrified to conclude from one address conflict that the client owes a million pounds; and a report I wrote myself, where I stand behind every sentence individually yet also believe that at least one of them is wrong. Beyond those, please include questions that do the finer work: whether a contradiction about the seating plan can contaminate conclusions about the budget, or whether contradictions only spread within their own topic; whether two claims being individually acceptable automatically makes their conjunction acceptable; whether it matters how many contradictions one has, or whether a single one already does the damage; whether someone who accepts one true contradiction is thereby committed to accepting that everything is true; whether the claim that some contradictions are true is itself the sort of claim that could be both true and false; and, finally, whether the point of using a non-explosive