prompt: |-
  Right, so my mate and I spent about three hours in the pub last night arguing about whether you're ever allowed to just *assume* independence when you're giving a heuristic argument, and I've come away realising neither of us had any idea what a decent rule would even look like.

  I was defending the number theory way of doing it: treat divisibility by each prime as an independent coin flip, read off an estimate, then go back and patch it for the local obstructions you can actually see — the classic one being that once you've ruled out divisibility by 2 and 3 and so on, the candidates that are left aren't spread as evenly as the naive model says, which is why the naive estimate for how often twin primes turn up is off by that product-over-primes correction factor. He said that's just assuming what you want to prove, and that when these models break they break for reasons you can't see from the inside: he reckons there's a result from the eighties showing the random model gets the fluctuations in the number of primes in a short interval badly wrong, because of correlations with smooth numbers that no local check would have flagged. I think he's right that it breaks and I still think the method is fine, and I couldn't say why, which is definately the annoying bit.

  So: don't give me a theory, give me the spec. What would a formal account of the presumption of independence have to deliver for me to trust the numbers that come out the other end — good enough to decide whether a back-of-envelope estimate is worth betting on or pointing a research programme at, not good enough to prove anything. Every requirement with the case that motivates it, and mark which ones are non-negotiable and which are just one camp's preference.

  Things I want covered, but add what I've missed:

  - What the relata even are — events, propositions, or the *reasons* backing them — and whether independence of reasons aggregates the way probabilistic independence does when you chain twenty weak ones together.
  - What the probability is over. Every heuristic I can think of is secretly a frequency in some chosen ensemble, and you can usually pick the ensemble to get roughly the answer you like, so the rule has to say which ensemble and either be stable across reasonable choices or tell you when it isn't.
  - The regress: saying p and q are independent needs its own independence assumptions somewhere further up. Does the rule have to have a stopping point, and if so what earns it.
  - No free lunch: it can't manufacture confidence. A dozen shaky but independent-looking considerations shouldn't compound into near-certainty, and I want the total capped somehow by how good the independence claim itself is.
  - Locality: whether the verdict on a whole argument has to match what you get by checking its parts, given that the failures we actually know about are the global ones no part-by-part check would catch.
  - What defeats it and what shouldn't: a hint of a real mechanism should, but mere logical entanglement shouldn't — on any honest probability everything is a bit dependent on everything, and if the presumption dies to that it was never alive.

  Then: which pair of requirements do you think can't be jointly satisfied, because that's the bit I most want to see, and which single one rules out the most candidates — my guess is the maximum-entropy move dies on the ensemble one. Under 700 words, start at requirement one, a table is fine, no preamble.
reasoning: |-
  Okay, the user and their friend were debating when it's okay to assume independence in heuristic arguments, like in number theory where primes are treated as independent events. The user wants a clear set of requirements for trusting such heuristics, not a full theory. They listed several points: what independence applies to (events, reasons?), what the probability is over, handling regress, avoiding false confidence, dealing with locality in arguments, and what defeats the assumption.

  First, I need to address each requirement systematically. The relata: independence should apply to events or propositions, not reasons. Reasons might be interdependent, leading to overconfidence. So Requirement 1 specifies that it's about events with a probability measure. The probability ensemble is crucial; it must be natural and not cherry-picked. For example, in prime gaps, the ensemble is intervals up to x, not arbitrary sets. Stability across reasonable ensembles is a must—if different choices give wildly different results, the heuristic is unreliable.

  Regress is tricky. Independence assumptions can't be infinite, so there needs to be a stopping point. Foundational models or empirical validation can anchor this. No Free Lunch means not letting weak independent factors multiply into certainty. Capping the confidence by the reliability of the independence claim is key. Locality requires that global checks are needed even if local parts seem independent, like with twin primes where local obstructions are corrected but global correlations might still exist.

  Defeaters: A known mechanism, like shared divisors affecting primes, should break independence, but logical dependencies alone shouldn't. The user mentioned smooth numbers causing issues in prime counts, which is a real mechanism defeating independence.

  Now, conflicts: Locality and No Free Lunch might clash. Locality demands global checks, but if each part is validated, confidence could still be capped, leading to tension. Also, Ensemble and Regress might conflict if stopping points rely on ensembles that aren't universal. For example, in number theory, the random model for primes is foundational but fails for short intervals due to smooth number correlations, showing ensemble limitations.

  The biggest challenge is Ensemble vs. Regress. Foundational models provide a stopping point but might not be stable across all ensembles, as seen in prime fluctuations. This could rule out many heuristic approaches that rely on a single ensemble without validation.
answer: |-
  Here's a specification for when presuming independence in heuristic arguments is warranted, focusing on practical trustworthiness for back-of-envelope estimates and research direction. Requirements are categorized, with core principles marked **(Non-Negotiable)**.

  1.  **Relata: Events/Propositions, Not Reasons (Non-Negotiable)**
      *   *Requirement:* Independence must be asserted between *events* or *propositions* defined within a clear probability space, *not* between the subjective *reasons* or arguments supporting them.
      *   *Motivation:* Reasons can be logically or psychologically interdependent in ways events aren't. Assuming independence of reasons ("this clue about A is independent of that clue about B") compounds risk of hidden common causes or biases, leading to severe overconfidence when chained (violates No Free Lunch).
      *   *Case:* Estimating if a number is prime based on "divisible by 3?" and "divisible by 5?" are independent events. Arguing "this analytic technique suggests primality" and "this graph looks prime-ish" are *reasons* whose independence is dubious.

  2.  **Ensemble: Natural, Stable, Specified (Non-Negotiable)**
      *   *Requirement:* The probability measure must be defined over a clearly specified, *natural ensemble* (e.g., integers up to X, random graphs on n vertices). Trust requires stability: similar estimates must emerge from *different reasonable choices* of ensemble defining "typical" instances of the problem.
      *   *Motivation:* Prevents cherry-picking ensembles to force desired answers. Ensembles define "randomness". Heuristics failing stability (e.g., short vs. long prime intervals) signal deeper structure invalidating naive independence.
      *   *Case:* Twin prime heuristic uses integers ≤ N. Stable across N. Fluctuations in primes in short intervals [x, x+y] depend critically on y relative to x; naive independence fails spectacularly for y ~ log(x) due to correlations with smooth numbers – instability reveals failure.

  3.  **Regress: Anchored Stopping Point (Non-Negotiable)**
      *   *Requirement:* The independence assumption must have an *anchor*: either a well-validated foundational probabilistic model (e.g., Cramer's random model for primes), or empirical verification on the ensemble that pairwise (or low-order) independence holds sufficiently well.
      *   *Motivation:* Infinite regress is fatal for heuristics. The anchor earns the right to stop. Foundational models gain credibility through historical success; empirical checks validate the specific setup.
      *   *Case:* The prime divisibility "coin flip" anchor is the historically successful Cramer model. Assuming independence between distant mathematical conjectures lacks any anchor – pure speculation.

  4.  **No Free Lunch: Confidence Cap (Non-Negotiable)**
      *   *Requirement:* The overall confidence in the conclusion *cannot exceed* the justified confidence in the *weakest link*: the validity of the ensemble choice, the anchor for independence, *or* the reliability of the individual probability estimates. Multiplying many weak, seemingly-independent probabilities must not yield spurious high confidence.
      *   *Motivation:* Prevents heuristic alchemy turning leaden guesses into golden certainty. Reflects that independence claims themselves have uncertainty.
      *   *Case:* A dozen weak, vaguely independent arguments for a physics theory shouldn't combine to 99% certainty if each is only 60% reliable individually and independence is shaky. Cap overall confidence near 60%.

  5.  **Locality: Mandatory Global Sanity Check (Non-Negotiable)**
      *   *Requirement:* Even if independence seems justified locally (part-by-part), the *final estimate must undergo a global sanity check* against known constraints, asymptotics, or simple cases. Gross violation here invalidates the entire independence presumption, regardless of local plausibility.
      *   *Motivation:* Catches emergent global correlations invisible locally (e.g., the smooth number correlations wrecking short-interval prime counts). Locality checks are necessary but insufficient.
      *   *Case:* Naive twin prime count passes local checks (corrected for small primes). It *fails* the global check against Brun's theorem (convergence of reciprocal sum), necessitating the correction factor – validating the *need* for correction.

  6.  **Defeaters: Mechanism Trumps, Logic Doesn't Kill**
      *   *Requirement:* The presumption is defeated by evidence of a *specific, plausible causal/logical mechanism* creating dependence within the chosen ensemble. Mere logical possibility or trivial universal dependence (e.g., both events imply A > 10) is insufficient.
      *   *Motivation:* Allows the heuristic to be useful. Almost everything has *some* trivial logical dependence; requiring avoidance of this kills all heuristics. Focus on dependencies impacting the *scale* or *nature* of the probabilities within the ensemble.
      *   *Case (Defeater):* In short prime intervals, the mechanism "both primes imply no small prime factors, forcing dependence via smooth number constraints" defeats independence. *(Case (Not Defeater):* "Both 'divisible by 3' and 'divisible by 5' depend on the number's existence" is trivial and ignored.)*

  **Conflicting Requirements:**

  1.  **Locality vs. No Free Lunch:** Locality demands trusting local independence checks *unless* a global failure is found. No Free Lunch requires capping confidence based on the *inherent weakness* of independence claims, even locally. If each local independence is "shaky but plausible" (low confidence anchor), multiplying many might *locally* seem okay, but No Free Lunch caps the overall result harshly, potentially conflicting with a Locality check that passes. *(Resolution: No Free Lunch wins - cap confidence.)*
  2.  **Ensemble vs. Regress:** A stable ensemble provides a good anchor (Regress). But finding a truly stable ensemble can be impossible or require knowledge equivalent to solving the problem (e.g., knowing the *correct* ensemble for prime gaps might require knowing their true distribution). *(Resolution: Foundational models often provide the initial anchor; instability reveals their limits.)*

  **Single Requirement Ruling Out Most Candidates: Ensemble (Natural, Stable, Specified).**
  *   *Why:* Most heuristic independence failures stem from hidden structure within the problem that makes the *chosen ensemble* non-uniform or non-representative in a way that invalidates independence *for the specific question*. The smooth number vs. prime count fluctuation is the archetype: the ensemble "intervals of fixed length" is natural, but naive independence fails catastrophically because the structure of smooth numbers creates strong, non-local correlations invisible to "local obstruction" fixes. If your ensemble choice isn't demonstrably stable or captures the relevant structure poorly, independence is doomed, regardless of other checks. Maximum entropy often dies here precisely because it assumes *all* structure is captured by the constraints, which is rarely true for complex problems like number theory.
