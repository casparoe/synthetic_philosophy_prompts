answer: |-
  ### Exam Question  
  **Answer ONE question in 90 minutes.**  

  **Question 1.**  
  Glaucon demands that Socrates prove justice is desirable *for its own sake alone*, stripped of all consequences. To test this, he invents the ring of Gyges: a device that isolates the agent from social and divine sanctions. Consider three variants:  
  - **(A)** The classic ring (invisibility on demand).  
  - **(B)** An "Open Ledger" ring (invisibility plus guaranteed public revelation of all acts *anonymously* upon removal).  
  - **(C)** A "Clean Slate" ring (invisibility plus zero psychological residue: no guilt, shame, habituation, or character change, regardless of acts committed).  

  Using these thought-experiments:  
  **(i)** Diagnose what Glaucon’s challenge *requires* the ring to isolate about justice.  
  **(ii)** Explain whether Socrates’ account of justice in Book II (as psychic harmony and virtue) can survive the Clean Slate variant (C). If it can, specify *exactly how*; if not, why not.  

  ---

  ### Model Answer (Strong Undergraduate Level, ~850 words)  

  Glaucon’s challenge is not merely a call to prove justice’s intrinsic value but a radical demand to isolate it from *any* form of payoff—social, divine, or psychological. The ring of Gyges is designed to strip away *all* consequences that make justice appear instrumentally good. Variants (A), (B), and (C) reveal that Glaucon assumes justice must be intrinsically desirable *even when decoupled from its effects on the soul*. Socrates’ reply, however, collapses this distinction: his defense of justice’s intrinsic worth depends precisely on its *causal effects* on psychic order. The Clean Slate ring (C) exposes this tension fatally.  

  **(i) What the ring must isolate**  
  Glaucon insists justice be shown good *“for its own sake alone”* (358d), meaning its value must persist when no rewards—praise, reputation, divine favour—attach to it. The classic ring (A) removes *external* sanctions (punishment, social scorn) but leaves *internal* ones intact (guilt, corrupted desires). Open Ledger (B) intensifies the test by adding retrospective exposure—yet anonymity preserves the agent’s *external* impunity while threatening shame. Both (A) and (B) fail to isolate intrinsic value fully because they permit *psychological* consequences: guilt in (A), shame in (B). Glaucon thus implicitly demands a scenario where justice is chosen *even when the soul suffers no disorder from injustice*. Only Clean Slate (C) achieves this: by guaranteeing “zero residue,” it eliminates all psychological costs. If Socrates cannot show justice desirable under (C), he fails Glaucon’s test.  

  **(ii) Socrates’ account and the Clean Slate challenge**  
  Socrates argues injustice disorders the soul, making the unjust agent “at war with himself” (351d-352a). Justice is intrinsically good because it constitutes psychic harmony—the soul’s proper function. But this relies on two causal claims:  
  1. Injustice *causes* internal conflict (e.g., appetites overwhelming reason).  
  2. This disorder *causes* misery (e.g., regret, loss of agency).  

  The Clean Slate ring (C) nullifies both claims. By stipulating “no habituation,” “no guilt,” and “no character change,” it severs injustice from its psychological effects. An agent using (C) could commit atrocities yet retain a soul identical to a just person’s: reason still “rules,” appetites remain “moderate,” spirit “aligned.” Socrates’ account thus *cannot* survive (C). His theory reduces intrinsic value to *functional* harmony—but if injustice leaves function intact (per (C)’s guarantee), then injustice *is* functionally identical to justice. Glaucon’s challenge reveals that Socrates’ “intrinsic” good is covertly instrumental: psychic harmony is only desirable because it *produces* psychological well-being. Under (C), where disorder has no ill effects, injustice becomes indistinguishable from justice in its functional state.  

  **The dialectical impasse**  
  Socrates might protest that (C) is impossible—that injustice *necessarily* corrupts the soul. But Glaucon would counter: this reduces justice’s value to contingent facts about human psychology. If psychic harmony is only good because it prevents suffering, then in beings immune to such suffering (e.g., gods), justice would have no intrinsic worth. Worse, Socrates’ appeal to the soul’s “nature” (352d-353e) tacitly assumes a teleology where disorder *causes* dysfunction. Yet (C) severs this causal link: an unjust act with “zero residue” does not disrupt function. To salvage his account, Socrates would need to argue that justice is constitutive of the self *such that* injustice *is* disintegration—even without observable effects. But this risks tautology: “justice is good because it is the soul’s health” only works if “health” is *defined* as justice. Against (C), Socrates has no non-question-begging reply.  

  **Conclusion**  
  Glaucon’s challenge forces Socrates into a dilemma: either justice’s value depends on its psychological payoffs (making it instrumental), or intrinsic value must be grounded in something beyond functional harmony. The Clean Slate ring proves Socrates’ account cannot satisfy Glaucon’s demand. By exposing justice’s entanglement with psychic consequences, (C) shows that Socrates’ defense smuggles in the very payoffs Glaucon forbids. The *Republic*’s project may require rethinking whether “for its own sake” can ever mean “apart from all effects on the soul.”  

  ---

  ### Marking Scheme (Total: 20 points)  

  | **Points** | **Must-Hit Criteria**                                                                 | **Common Errors / What to Penalize**                                                                 |
  |------------|---------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|
  | **4**      | **Diagnoses Glaucon’s core demand**: Explicitly states that the ring must isolate justice from *all* payoffs, including psychological ones. | Vague restatement of “justice for its own sake” without specifying the *scope* of isolation required. |
  | **4**      | **Uses ring variants to test isolation**: Contrasts (A)/(B) with (C) to show (C) alone removes *internal* sanctions. | Treats rings as interchangeable; fails to explain how (C) differs radically from (A)/(B). |
  | **4**      | **Critiques Socrates via Clean Slate**: Argues that (C) nullifies Socratic psychology by severing injustice from disorder/misery. | Only describes Socrates’ view without pressure-testing it against (C); asserts “Socrates wins” without argument. |
  | **4**      | **Identifies the dialectical tension**: Exposes that Socrates’ intrinsic good relies on contingent causal effects (psychic harmony → well-being). | Misses that Glaucon’s challenge questions whether *any* virtue can be detached from its effects. |
  | **4**      | **Assesses the implications for virtue ethics**: Concludes whether Socrates’ account fails *and* why this matters (e.g., reduces virtue to instrumental good). | Concludes weakly (e.g., “Socrates tried his best”); ignores that (C) may make injustice functionally identical to justice. |

  ---

  ### What to **NOT** Reward (Explicit Penalties):  
  - **Summary without engagement** (e.g., reciting the city-soul analogy/function argument without linking to the rings).  
  - **Irrelevant exegesis** (e.g., detailed analysis of Thrasymachus in Book I).  
  - **Strawmanning Glaucon** (e.g., “Glaucon is immoral” without engaging his challenge’s structure).  
  - **Ignoring Clean Slate (C)** (e.g., discussing only the classic ring).  

  **Grade Thresholds**:  
  - **A (17-20)**: Hits all 5 criteria; uses rings to expose the payoff/intrinsic tension; concludes Clean Slate defeats Socrates.  
  - **B (13-16)**: Hits 3-4 criteria; identifies Socrates’ reliance on psychology but doesn’t fully dissect why (C) undermines it.  
  - **C (9-12)**: Summarizes arguments but misses tension; treats rings as illustrations, not analytical tools.  
  - **D/E (<9)**: Fails to engage the question; recites boilerplate about "harmony of the soul."  

  —  

  This setup forces students to grapple with the *mechanism* of Glaucon’s challenge, not just its conclusion. The Clean Slate ring cuts to the heart of whether virtue ethics can defend intrinsic value without leaning on psychological payoffs—a dilemma even Plato may not resolve.
