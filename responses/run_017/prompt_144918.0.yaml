answer: |-
  **To:** Conduct Committee  
  **From:** [Your Name], Committee Member  
  **Date:** 15 October 2023  
  **Subject:** Guidance on Local Conventions for Fellows  

  **Bottom Line:** Fellows must prioritize avoiding harm to identifiable individuals when navigating local conventions, especially where noncompliance extracts costs from vulnerable workers. However, rigid adherence to all local norms is neither required nor prudent, particularly when conventions entrench collective inefficiencies or when compliance risks practical disruption to academic duties.  

  **Recommendation:** Adopt a **cost-based compliance** framework, requiring fellows to follow local conventions where failure to do so would directly and foreseeably impose material costs on identifiable third parties (e.g., service workers relying on tips). In purely coordinative conventions (e.g., traffic flow), fellows should align with local behavior unless doing so would impede their core obligations. For locally dispreferred conventions (e.g., escalating tip expectations or dysfunctional queues), fellows may deviate if they can privately mitigate downstream impacts, but collective defiance is discouraged.  

  **Ruling on Locally Dispreferred Conventions:** Fellows bear no duty to sustain conventions locals would exit if coordination were possible (e.g., a 25% tip floor maintained by mutual expectation). However, individual noncompliance in such cases—like withholding tips on principle—remains prohibited if it harms workers (*extractive* element) or fractures group logistics (*coordinative* element). When unable to classify a convention, fellows should default to local behavior *unless* harm to a third party is plausible (e.g., no tip in a tip-dependent economy) or their safety/role is compromised (e.g., isolation from peers).  

  **Strongest Counterargument Considered:** A visitor refusing local norms may be seen as exploiting positional privilege: using a low-wage worker as a prop in performative dissent, while underestimating the equilibrium’s stability. Locals’ behavior often reflects hard-won adaptation to constraints outsiders misjudge; imposing foreign ideals can be extractive in itself. This justifies near-total compliance to prevent epistemic arrogance and collateral damage.  

  **Implementation:** By 30 November, the Secretariat will distribute a one-page field guide categorizing common convention-types (coordinative/extractive/dispreferred) with bullet-point examples (e.g., tipping: extractive; jaywalking: coordinative). Fellows must acknowledge receipt before travel.  

  This framework prioritizes material protection of vulnerable individuals while respecting fellows’ agency in non-harmful coordination. It rejects both unthinking assimilation and ideological inflexibility, centering the human costs of extraction.  

  \answer{COST-BASED: EXTRACTIVE HARM MITIGATION}
