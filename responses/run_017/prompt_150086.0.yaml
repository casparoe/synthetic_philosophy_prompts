prompt: |-
  I'm a fifth-year PhD student covering the grading for a colleague's upper-level ethics course while she's away, and I'll have to defend every mark I give. Please act as a professional philosopher who has graded many exams of this kind: read the question and one student's actual answer slowly, work through the problems yourself before committing to anything, and then give me your assessment.

  The question I set was this. Moral worth is often said to require acting for the right reasons, but it is not obvious what that requirement comes to. First, set the Kantian condition — that an action has moral worth only if it is done from duty — against the Arpaly-style alternative that what matters is the agent's being moved by the right-making features of her situation, whether or not she represents them to herself as right-making, and explain which of the two better handles a case in which someone does the right thing from a motive she herself would repudiate. Second, apply your answer to a case I'll call the borrowed-reason case. Ada knows that her own judgment about what matters is unreliable: she is biased, distractible, and bad at seeing what is at stake. So she has arranged her practical life so that on such questions she defers to a friend whose judgment she trusts and who, as it happens, is reliable. He tells her, correctly, that a colleague's project will collapse unless someone gives up the weekend to help, and that this is what matters here. Ada gives up the weekend because he told her to; she neither sees nor cares about the colleague's predicament. Had he told her that nothing was at stake, she would have stayed home. Does Ada's action have moral worth? Answer consistently with what you said in the first part.

  Here is one student's answer, transcribed verbatim. Kant's condition is that an action has moral worth only if it is done from duty: the agent must act as she does because the moral law requires it, and not because acting that way happens to suit her. This is the distinction between acting in accordance with duty and acting from duty, and only the latter has worth; an action that conforms to duty because the agent feels like performing it may be useful and may even be reliably produced, but on Kant's view it has none. Indeed, Kant's position appears to be that the more the agent enjoys doing what is right, the less moral worth her action has, which is why he uses the unsympathetic benefactor as the pure instance of the duty motive. That is the point at which the Kantian view looks least plausible, and Bernard Stocker's well-known objection about one thought too many captures it: if an agent helps a friend only after asking herself what morality demands, a thought has entered her deliberation that is foreign to the relationship, so the requirement that she act from duty alienates her from the very features that make her action right. The Arpaly-style alternative avoids this result, because on it what matters is not whether the agent represents her action to herself as morally required but whether she is moved by the right-making features. That is why an agent such as Huck Finn, who helps Jim while believing that he is doing something wrong, can nevertheless act with moral worth: he is responding to Jim's predicament, and that is what moral credit consists in. To state the view more exactly, moral worth consists in the agent's motivation being sensitive to the right-making features: if she would have acted otherwise had those features been absent, she responds to them, and her action has worth. This settles the borrowed-reason case. Ada's action issues from a mechanism that tracks what matters, her friend's judgment is reliable, and she would have stayed home had he said nothing was at stake; so her action is sensitive to the right-making feature in the way required, and it therefore has moral worth. It also helps that she has deliberately handed her deliberation over to someone who sees better than she does: she thereby acts for the reasons he acts for, and worth is transmitted along the chain of deference. The opposite verdict would force us to say that an agent loses moral credit simply by compensating for her own defective judgment, which is absurd.

  Give this a mark out of 20, together with the comments I can paste into the grade sheet: what the student gets right and should be credited for, and what is wrong, each error identified precisely as a conflation, a misattributed view, or a step that does not follow, along with what a correct treatment would have said instead and how much each error should cost. Do not reward mere fluency, and do not penalize the student for a conclusion you happen to reject; I only want to know whether the reasoning supports the claims. Write the whole thing as one continuous piece of prose, with no headings, bullet points, bold type, or tables, and lead with the number.
reasoning: |-
  Okay, let me approach this grading task methodically. First I need to understand the core philosophical dispute: Kantian duty-based moral worth versus Arpaly's right-feature responsiveness. The borrowed-reason case with Ada serves as the test bed.

  The student's answer shows strong comprehension overall. They accurately articulate Kant's position on acting from duty, including the unsympathetic benefactor example and Stocker's "one thought too many" objection. Their summary of Arpaly's view through the Huck Finn case is also correct. This demonstrates solid grasp of the source material.

  However, two critical flaws emerge in the application. First, the student claims Ada's action is sensitive to right-making features because she would act differently if her friend's judgment changed. But this confuses sensitivity to the friend's say-so with sensitivity to the actual moral features. Ada is responsive only to the proxy, not to the colleague's plight itself - a crucial distinction Arpaly would emphasize.

  Second, the "worth transmission" argument is philosophically unsupported. The student asserts that deference transfers moral credit, but neither Kant nor Arpaly's frameworks contain such a mechanism. For Kant, Ada isn't acting from duty; for Arpaly, she isn't responsive to right-features. This is an unsubstantiated leap.

  The conclusion about compensating for defective judgment being "absurd" misses the point - the question isn't about practical rationality but about the specific conditions for moral worth. Both theories would deny worth here for different but consistent reasons.

  I'll allocate 14/20. They earn credit for accurate exposition but lose points for misapplication and unsupported claims. The breakdown: 1 point for each major theory explanation (2 total), 1 for case setup, 1 for Huck Finn reference - but deduct 2 for the sensitivity confusion, 2 for the transmission claim, and 2 for the defective judgment misstep. Comments should highlight these precise failures while acknowledging strengths.
answer: |-
  14/20. This answer demonstrates a competent grasp of the core theoretical distinction between Kant and Arpaly, accurately presenting Kant's condition that moral worth requires acting *from duty* (distinguishing it from mere accordance with duty) and correctly framing Arpaly's alternative as requiring being moved by the *right-making features* themselves, regardless of whether the agent conceptualizes them as such. The student usefully references Stocker's "one thought too many" objection to illustrate a perceived weakness in Kant and effectively employs the Huck Finn example to show Arpaly's strength in handling repudiated motives – correctly concluding that Arpaly better handles the case of someone doing the right thing from a motive they repudiate, as Huck acts from the right-making features (Jim's humanity/predicament) despite believing he is wrong. Where the answer falters significantly is in the application to the borrowed-reason case. While the student correctly identifies Arpaly's sensitivity condition (acting differently if the right-making features were absent), they commit a critical **conflation** by asserting that Ada's sensitivity to her *friend's judgment* equates to sensitivity to the *right-making features themselves* (the colleague's project collapsing). Arpaly requires the agent's motivation to be directly responsive to the normative features *in the world* that make the action right. Ada is explicitly *not* moved by the colleague's predicament ("she neither sees nor cares about it"); she is moved solely by her friend's instruction. Her counterfactual dependence is on the *friend's pronouncement*, not on the *presence or absence of the colleague's need*. If the colleague's project *were* collapsing but the friend (mistakenly) said nothing was at stake, Ada would not help – demonstrating her motivation is *insensitive* to the actual right-making feature. This misapplication of Arpaly's sensitivity criterion costs 3 points. Furthermore, the claim that "worth is transmitted along the chain of deference" is a **misattributed view / unsupported assertion**. Neither the Kantian nor Arpaly view presented by the student incorporates such a mechanism. Kant requires the agent's *own* recognition of duty; Arpaly requires the agent's *own* responsiveness to right-making features. Deference, even rationally justified deference, does not, on these views, transfer the *deferrer's* responsiveness or recognition to the *deferred*. Ada is not acting *from duty* (Kant) nor is *she* responsive to the right-making feature (Arpaly). This unsupported and incorrect claim costs an additional 2 points. Finally, the dismissal of the opposite verdict as "absurd" because it would mean losing credit for compensating for defective judgment is a **non sequitur**. The question is about the specific conditions for *moral worth* according to the theories, not about the prudence or rationality of Ada's decision. Both Kant and Arpaly define moral worth in ways that require a specific, direct connection between the agent's motivation and the moral reason (duty or right-making feature). Compensating for defective judgment via deference may be practically wise, but it doesn't automatically satisfy either theory's condition for moral worth. This failure to engage the specific criteria costs 1 point. The student earns credit for the accurate theoretical exposition, correct handling of the repudiated motive case, and clear structure, but the significant errors in applying Arpaly to the borrowed-reason case and the unsupported transmission claim substantially undermine the argument's overall coherence and correctness for the assigned task.
