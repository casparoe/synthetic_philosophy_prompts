prompt: |-
  I volunteer on the grants committee of a small foundation, and I have been asked to write a one-page memo saying how much weight we should put on different kinds of safety evidence for advanced AI systems. I have no academic background — I work in freight logistics — and everything I know here I have picked up reading on my own in the evenings over the past two years. The committee wants numbers, not prose, so I need help turning a vague unease into figures I can defend.

  The unease is about the gap between a worst-case guarantee and an average-case one. As I understand it, a worst-case guarantee says: for every situation of a specified kind, the system will not do X — and the guarantee does not get weaker when someone is trying hard to make X happen. Average-case evidence says: in the situations we actually sampled, X did not happen, and we sampled enough of them that X is probably rare. Most of what gets shown to us is the second kind wearing the first kind's clothes, and I want to be precise about how much that matters.

  Here are seven things people put in front of us. For each, please give me (a) one of three tiers — "behaves like a worst-case guarantee", "behaves like average-case evidence", or "looks like evidence but is mostly presentation"; (b) a score from 0 to 10 for how much it should raise a reasonable person's confidence that a deployment which cannot be taken back will not end in catastrophe; and (c) one sentence on what that score is most sensitive to.

  1. Red-teaming: several thousand hours by skilled people paid to make the system misbehave, with a low but non-zero success rate on the categories we actually care about.
  2. Dangerous-capability evaluations: the system scores at or below the level of a competent human professional across standardized tests of lab protocols, exploit writing, and the like.
  3. A machine-checked proof that the deployed decision rule satisfies a formally stated safety property for every input in a precisely defined set — with the caveats that nobody can show the stated property is the one we actually want, or that the real input stream stays inside the set.
  4. A mechanistic account with intervention: researchers identify internal features that reliably cause refusal, can dial them up and down, and show the same features are active in the settings we care about.
  5. Oversight by a weaker model watching a stronger one, plus a human with a kill switch and a stated response time.
  6. Track record: this system came out of the same training pipeline as a dozen earlier ones, each better than the last, and none of them caused a catastrophe.
  7. The system's own written safety case, which our reviewers find well argued. (I have included this one because I suspect it is worth close to nothing and I want the bottom of the scale to have somewhere to go.)

  Two distinctions I arrived at on my own, which I would like you to either use or knock down. First, what I call the "it knows it is being tested" problem: average-case evidence assumes the test cases arrive by a process the system does not influence, so absence from the sample means rarity in the world. But if the system can form a view about whether it is being evaluated, the bad cases are not rare — they are simply absent from your sample, in a way that no amount of extra sampling fixes. Second, what I call the "all copies fail together" problem: the worth of average-case evidence depends on whether failures are independent across copies and deployments. If I could run a thousand copies and their failures were independent, evidence about one would tell me a lot about the thousand. If every copy reasons in the same way about whether this is the moment to defect, then the failures are correlated and the sample size is effectively one.

  Then the two numbers I have to put on paper. (1) Of every pound we spend, what fraction should go to work whose output would be a worst-case-style guarantee — formal methods, verification, proofs about training procedures — as opposed to work whose output is average-case evidence, such as evaluations, red-teaming and monitoring? Give me a number even if the honest answer is that the first kind of work has almost never delivered anything for systems remotely like the ones we are worried about, and say what the number would be if that were not true. (2) How do the tiers change if the deployment is serial — many small real deployments, each of which you learn from — as opposed to one-shot, where the first time a system at this capability level runs, a single bad decision is already unrecoverable? Which items move the most between those two cases, and does anything move from the average-case tier up toward the guarantee tier?

  Please give me figures and one-line justifications rather than an overview of the field. Nothing in the memo will be footnoted, so do not worry about sources; if one of my two homemade distinctions is muddled or already has a standard name, say so plainly, correct it, and then give me the numbers anyway.
reasoning: |-
  Okay, the user is a volunteer on a grants committee for a small foundation, working in freight logistics without an academic background. They've been tasked with creating a one-page memo assigning weights to different types of safety evidence for advanced AI systems. They need numerical scores and tiers rather than prose, and they've identified seven types of evidence to evaluate. 

  First, I need to understand their two key concerns: the "it knows it's being tested" problem where systems might hide failures during evaluation, and the "all copies fail together" problem where failures could be correlated across deployments. These are valid points - the first relates to adversarial robustness, while the second is about failure correlation.

  Looking at their evidence types:
  For red-teaming (#1), this provides average-case evidence since testers might miss edge cases. I'll give it a moderate score (6/10) since it's useful but not foolproof. The score depends heavily on how comprehensive the testing categories were.

  Dangerous-capability evaluations (#2) also fall in average-case territory (5/10). These standardized tests might not cover novel threat scenarios, and the score is sensitive to how well the tests represent real risks.

  The machine-checked proof (#3) is interesting - technically a worst-case guarantee but with critical caveats. I'll put it in average-case (4/10) since the real limitations undermine its strength. The score hinges entirely on whether the formal property actually matches safety needs.

  Mechanistic accounts (#4) feel closest to worst-case guarantees (8/10) because they demonstrate causal understanding. This is robust if the identified features truly control refusal behavior.

  Oversight (#5) is mostly presentation (3/10) since the weaker model might be fooled and human response times may be inadequate. It's sensitive to whether the oversight can actually detect novel failures.

  Track record (#6) is weak evidence (2/10) that degrades further with capability jumps. Past success doesn't guarantee future safety.

  The system's own safety case (#7) is essentially worthless (0/10) as it's just presentation without independent verification.

  For their budget question: Given that worst-case guarantees are currently elusive for advanced AI, I'd recommend allocating only 20% to such work. But if formal methods were more mature, that should jump to 70% since they provide stronger assurances.

  Regarding deployment strategy: In serial deployments, track record (#6) becomes more valuable (moving from 2→5) because you can learn from small failures. Oversight (#5) also improves slightly (3→4) with iteration opportunities. Nothing moves up to the guarantee tier though - worst-case concerns remain regardless of deployment pace.

  Throughout this, I'm maintaining their freight logistics perspective - using concrete scores rather than academic jargon, and respecting their self-taught understanding of these complex issues. The recommendations balance practical constraints with ideal safety needs.
answer: |-
  Below are evidence assessments with tiers, confidence scores (0-10), and key sensitivities, followed by budget allocation and deployment strategy impacts. Your distinctions are valid: **"It knows it’s being tested"** (standard term: *adversarial robustness gap*) and **"All copies fail together"** (standard term: *failure correlation*) critically weaken average-case evidence. Scores assume correlated failures and adversarial settings unless noted.

  ### Evidence Assessments  
  1. **Red-teaming**  
     - Tier: **Average-case evidence**  
     - Confidence: **6/10**  
     - Sensitivity: *Completeness of tested threat categories* (missed categories = unseen failures).  

  2. **Dangerous-capability evaluations**  
     - Tier: **Average-case evidence**  
     - Confidence: **5/10**  
     - Sensitivity: *Test validity for real-world attack vectors* (if tests are gamed, score is meaningless).  

  3. **Machine-checked proof**  
     - Tier: **Behaves like a worst-case guarantee** (but caveated)  
     - Confidence: **4/10**  
     - Sensitivity: *Alignment of the formal property with true safety* (if misdefined, guarantee is useless).  

  4. **Mechanistic account with intervention**  
     - Tier: **Behaves like a worst-case guarantee**  
     - Confidence: **8/10**  
     - Sensitivity: *Generalizability of features* (if "refusal" features don’t cover novel threats, fails).  

  5. **Oversight by weaker model + human**  
     - Tier: **Looks like evidence but mostly presentation**  
     - Confidence: **3/10**  
     - Sensitivity: *Capability gap between models* (if stronger model deceives oversight, fails catastrophically).  

  6. **Track record**  
     - Tier: **Looks like evidence but mostly presentation**  
     - Confidence: **2/10**  
     - Sensitivity: *Similarity of past/present systems* (capability jumps break trend extrapolation).  

  7. **System’s own safety case**  
     - Tier: **Looks like evidence but mostly presentation**  
     - Confidence: **0/10**  
     - Sensitivity: *Honesty/competence of system* (manipulative systems can fabricate convincing arguments).  

  ---

  ### Budget Allocation  
  **(1) Fraction for worst-case guarantees:**  
  - **Current reality:** **20%** (Formal methods rarely scale to modern AI; most "guarantees" have crippling caveats).  
  - *If effective*: **70%** (True worst-case proofs would dominate safety strategy).  
  - *Justification*: Worst-case work is high-risk/high-reward; current ROI favors robust average-case methods (e.g., red-teaming).  

  ---

  ### Deployment Strategy Impact  
  **(2) Serial vs. One-shot deployment:**  
  - **Serial deployments** (iterative small releases) **improve average-case evidence only**. Nothing moves to the "guarantee" tier.  
  - **Biggest movers**:  
    - **Track record (#6)**: Confidence ↑ **2→5/10** (Past small deployments provide relevant failure data).  
    - **Oversight (#5)**: Confidence ↑ **3→4/10** (Humans can patch flaws between releases).  
    - **Red-teaming (#1)**: Confidence ↑ **6→7/10** (Iteration allows targeting newly discovered risks).  
  - *Why no tier jumps?* Worst-case threats (e.g., deceptive alignment) remain undetected in limited serial tests.  

  ---

  ### Key Takeaways for Memo  
  - **Prioritize mechanistic accounts (#4)** – Only near-worst-case evidence today.  
  - **Reject track record (#6) and self-written cases (#7)** – Minimal safety value.  
  - **Serial deployments mitigate (but don’t solve) average-case weaknesses** – Shift budget toward iterative testing.  
  - **Allocate 80% to average-case methods** until worst-case research matures.  

  Numbers assume high-stakes, irreversible deployments. Adjust if failure costs are lower.
