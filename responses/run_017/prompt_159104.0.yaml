prompt: |-
  I run a small monthly philosophy-of-science reading group at our local library — I'm a retired GP, not an academic, and the group is mostly other retired people and a few students — and I'm trying to write up a short piece for our newsletter about an argumentative pattern I keep running into when we read popular evolutionary psychology. It started at a dinner party with a dispute about whether music is an adaptation: one guest gave a bonding-or-mating story, another said it's a byproduct, invoking the well-known cheesecake comparison, and someone else complained that the byproduct claim was just as unfalsifiable as the story it was meant to replace. What I've since noticed is how cheap the byproduct move is. When it is done properly the speaker names the trait that was actually selected for, says what the developmental or architectural connection is between that trait and the one being explained, and often says what finding would overturn the account. But very often it is done with none of that: the word spandrel, or just byproduct, or not an adaptation, is produced as a gesture, no selected trait is ever named, no constraint is described, and the move is treated as requiring no evidence of its own, while any adaptive story is held to an impossibly high standard. The failure of the adaptationist to prove her case is then quietly counted as a point in favour of the spandrel claim, and the matter is closed. I have watched exactly the same shape of argument in discussions of religion, of the human chin, of homosexuality in animals, of why we find some landscapes beautiful.

  I don't think this is just the thing Gould and Lewontin were complaining about in their 1979 paper, and that is part of what I want to get clear. Their target was over-specification: the invention of a selection narrative for everything. What I am describing is under-specification, a refusal of any narrative at all, and it seems to me to be the mirror image of that vice while being a different move. It also isn't quite the same as protecting a theory with a face-saving auxiliary assumption, though it is close: what it protects is a background suspicion that adaptationist explanation is overreaching, and it protects it from ever being tested. And it seems to me to have something in common with arguments that treat our current ignorance as if it were positive evidence, which is why I half-expected there to be an established phrase on the model of a gap argument. On the other hand, I don't want to condemn the move outright: nobody thinks the male nipple needs an adaptive story, the mechanism is obvious, and I gather that treating drift or constraint as a kind of default or null hypothesis is perfectly respectable in some contexts. So what I need is the edges, not a verdict.

  There is a second wrinkle that may or may not be the same phenomenon wearing different clothes. A trait gets labelled a spandrel, and then someone shows that it does something useful now — it has been co-opted, it is maintained by selection for something, it serves a function in the organism's current life — and the discussion immediately concludes that it was an adaptation after all, as though having a current function and having been shaped by selection for that function were the same property. Something about that slide feels like the converse error, and I can't tell whether it belongs to the pattern I described or is a separate mistake with a name of its own. So: is there an established concept for the first thing — the bare, unspecified byproduct gesture and its evidentiary asymmetry — and if there are several near neighbours, which fits best and how exactly does my case differ from each of them? If there is nothing established, please coin a term, define it tightly enough to separate the honest version from the conversation-stopping version, say what evidence would discriminate the two, and give me two or three boundary cases that fall just inside and just outside it. Please don't just hand me a reading list or tell me which authors to look up; I want the distinction carved, not a name to attach to it.
reasoning: |-
  Okay, the user runs a philosophy-of-science reading group and wants to dissect a problematic argument pattern they've observed in evolutionary psychology discussions. They describe a scenario where the "spandrel" or "byproduct" label is used as a cheap dismissal without evidence, creating an asymmetrical burden of proof against adaptationist explanations. 

  The user is clearly knowledgeable—they reference Gould and Lewontin's spandrel paper but correctly note their complaint was about over-specification, while this is under-specification. Their frustration is palpable: they've seen this pattern recur in debates about music, religion, chins, etc. What's impressive is their nuanced stance—they don't want to condemn all byproduct claims (e.g., male nipples are legit), just the rhetorical sleight-of-hand.

  Hmm, the core issue seems twofold: (1) the hollow "spandrel" gesture that demands no evidence while forcing adaptationists to meet impossible standards, and (2) the conceptual blurring between current utility and evolutionary origins. The first feels like a motte-and-bailey where "byproduct" is a defensible but empty retreat when adaptationist arguments fail. The second reeks of the converse error—confusing "selection maintains it now" with "selection built it for this purpose." 

  For the first pattern, existing terms don't quite fit. "Ad hoc" is too broad, "spandrel" is the misused term itself, and "gap argument" implies filling ignorance with design. Need to coin something... "Vacuous Spandrel Claim"? Too jargony. "Burden-Shifting Byproduct Move"? Closer. Emphasize the evidentiary asymmetry—"Proof by Failed Adaptation"? But might imply logical validity. 

  Wait—the asymmetry is key. Adaptationists must specify selective pressures, developmental pathways, etc., while byproduct advocates just say "spandrel!" and consider the case closed. It's like declaring "win by forfeit" without playing. So: "Adaptationist's Burden Fallacy"? Or "Asymmetric Null Hypothesis Default"? Needs to capture both the evidentiary vacuum and the unfair standard. 

  For the boundary cases: Male nipples (legitimate byproduct) vs. claiming music is a byproduct of "general intelligence" without specifying constraints (vague/vacuous). The test? Demand the byproduct claimant name the actual selected trait and the architectural constraint—if they can't, it's the fallacy. 

  The second wrinkle is simpler—it's the "Converse Error of Exaptation": confusing current maintenance with original selection. Textbook paleontology mistake! Like saying "bird wings are adaptations for flight" ignoring they're exaptations from dinosaur thermoregulation. 

  User would appreciate concrete examples. For the first fallacy: "Religion is a spandrel of hyperactive agency detection" without explaining why that trait was selected. For the converse error: "Homosexuality persists, therefore it was selected for social bonding" (nope—could be kin selection or developmental byproduct). 

  Final note to self: User is sharp. Don't patronize. They want precision, not citations. Give them the conceptual scalpel they requested.
answer: |-
  Your observation cuts to the heart of a pervasive rhetorical flaw in evolutionary debates. Let's carve the distinction you seek:

  ### The Core Concept: **Vacuous Spandrel Gambit**
  **(or Null Hypothesis Posturing)**

  **Definition:**  
  The assertion that a trait is "merely a byproduct" (or spandrel) *without* specifying:  
  1. The **primary adapted trait(s)** whose development or architecture produces the byproduct;  
  2. The **causal mechanism/constraint** linking them;  
  3. **Falsifiable conditions** under which the claim would fail.  
  This is combined with an **asymmetric burden of proof**: Adaptationist accounts are held to stringent evidentiary standards, while the byproduct claim is treated as a default null hypothesis requiring no positive evidence.

  ---

  ### Key Features & Boundaries  
  | **Feature**               | *Legitimate Byproduct Claim*                                                                 | *Vacuous Spandrel Gambit*                                                                 |
  |---------------------------|----------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Specified Ancestor**    | Names the trait under selection (e.g., "lactation" for male nipples)                         | Vague invocation ("cognitive complexity," "developmental constraints")                    |
  | **Mechanism Described**   | Explains architectural linkage (e.g., "shared fetal blueprint")                              | Handwaving ("it just emerged")                                                            |
  | **Falsifiability**        | States what evidence would refute it (e.g., "if nipples impaired male fitness")              | Unfalsifiable; retreats when adaptation fails                                             |
  | **Burden of Proof**       | Requires evidence for the *constraint* (e.g., developmental biology data)                    | Treats "byproduct" as self-validating when adaptationist arguments falter                 |
  | **Epistemic Status**      | Testable alternative hypothesis                                                              | Argumentative placeholder shielding skepticism from scrutiny                              |

  ---

  ### Boundary Cases  
  **Inside the Gambit:**  
  1. **Music Debate:**  
     *Claim:* "Music is a spandrel of language."  
     *Vacuum:* Fails to specify *which* aspects of language (syntax? prosody?) or *how* they produce music. If pressed, shifts to "general neural plasticity."  
     *Asymmetry:* Dismisses bonding hypotheses for lacking Pleistocene evidence, but offers no evidence for its own constraint.  

  2. **Human Chin:**  
     *Claim:* "The chin is a biomechanical byproduct of facial reduction."  
     *Vacuum:* Doesn’t model the developmental forces or specify why reduction *must* form a chin. Treats absence of adaptive evidence as proof.  

  **Outside the Gambit:**  
  1. **Male Nipples:**  
     *Legitimate:* Specifies selected trait (lactation in females), mechanism (shared embryonic development), and falsifiability (if nipples reduced male survival).  

  2. **Blood’s Red Color:**  
     *Legitimate:* Notes hemoglobin’s oxygen-binding (selected trait), explains color as byproduct of iron’s light absorption (mechanism), falsifiable if color hindered fitness.  

  ---

  ### The Second Wrinkle: **Exaptation Conflation**  
  **The Error:** Confusing *current utility* with *original adaptation*. A trait may be:  
  - A *byproduct* co-opted later (e.g., feathers for flight after thermoregulation),  
  - *Maintained* by selection without being *shaped* for its current role.  
  **Fallacy Name:** **Functional Teleology** (inferring evolutionary purpose from current benefit).  

  **Example:**  
  - *Claim:* "If music strengthens social bonds *now*, it must have been selected for bonding."  
  - *Flaw:* Ignores that bonding could be an exaptation of a byproduct (e.g., auditory pleasure systems). Current function ≠ evolutionary origin.  

  **Relationship to the Gambit:**  
  This often *follows* a Vacuous Spandrel Gambit. When a byproduct advocate is challenged with evidence of current utility, they may concede it’s "adaptive after all," committing Functional Teleology—revealing the initial gambit was under-defended.  

  ---

  ### How to Detect the Gambit  
  Ask:  
  1. "**What *specific* trait/constraint produces this byproduct?**"  
     *(Gambit crumbles if no answer)*  
  2. "**What evidence would make you abandon this byproduct claim?**"  
     *(Gambit avoids testability)*  
  3. "**Is drift/constraint your null model? If so, what predicts its prevalence *here*?**"  
     *(Gambit conflates skepticism with methodology)*  

  ---

  ### Why This Matters  
  The Vacuous Spandrel Gambit paralyzes inquiry. Legitimate byproduct hypotheses enrich evolutionary theory; this rhetorical move stifles it by disguising untested skepticism as scientific parsimony. Your observation exposes how a valid concept (spandrels) can be weaponized to evade evidentiary rigor—a mirror image of the "just-so stories" Gould critiqued, equally corrosive to good science.
