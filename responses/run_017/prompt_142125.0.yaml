prompt: |-
  I have been unable to shake an argument a colleague made over lunch a few weeks ago, and I cannot locate the move I distrust. I will reconstruct it as faithfully as I can.

  (1) Good's theorem on the value of information: for an agent who maximizes expected utility and updates by conditionalization, the ex ante expected value of a costless signal is never negative. The expected utility of the best policy that conditions on the signal is at least the expected utility of the best action chosen in ignorance of it.

  (2) The proof places no restriction on the subject matter of the signal, on the agent's tastes, or on what she happens to care about. It requires only that the same actions remain available whether or not she looks, that she will in fact tailor her action to what she sees, and that her utility function is defined over outcomes and does not itself shift when she learns.

  (3) (1) and (2) entail that declining costless information is never rational: to turn it down is to refuse something free that cannot, in expectation, from where the agent now stands, leave her worse off.

  (4) And this holds for any signal whatever: the result of a predictive genetic test for a late-onset condition with no available treatment; the answer to whether one's partner has been unfaithful; the final chapter of a novel one is halfway through; the grade on an examination one could still resit; the contents of a sealed envelope that will say whether the enterprise one has spent five years on will fail.

  (5) Yet calm and competent people decline precisely these. They do not get tested. They do not ask, or they ask and then ask to be told nothing. They leave the envelope on the hall table for a week. Some of them pay to avoid finding out, and would pay a great deal more to un-find-out.

  (6) So either the theorem is false, or every one of these refusals is irrational, or — this was my colleague's own conclusion — the theorem is true and shows only that a large amount of ordinary conduct is irrational, which is no objection to a theorem.

  I want to keep (1), and I want to keep the honesty of (5): I think at least some of these refusals are reasonable, and are not merely weakness of will dressed up in reasons. That leaves (2) and (3) as the places to look, and I have three candidates for what is doing the work there, which I cannot tell apart.

  (a) The guarantee in (1) concerns the expectation taken before the signal arrives. What the person who refuses is often worried about is the signal she will actually receive, and that one can leave her worse off than she would otherwise have been, however favorable the average over all possible signals turns out to be. Is there any reading of rational on which ex ante optimality is not enough? And if there is one, does holding on to (1) commit me to rejecting it?

  (b) The proof prices a signal only through the actions it lets the agent discriminate between. But some of the things people refuse seem to change the value of what happens next directly, and not through any action taken in response: the spoiler alters the experience of the remaining hundred pages, the test result alters the texture of the decade one then lives through, the answer alters a marriage in ways no subsequent choice can undo. If utility is allowed to take the signal itself as an argument, does the theorem survive? And if it survives only because one can always enlarge the space of outcomes until every such effect is re-described as something the signal was merely evidence about, has the theorem become unfalsifiable — a framework that can rationalize any refusal after the fact, rather than one that ever binds?

  (c) Some refusals look like refusals to surrender an option, and not-knowing is a state with instrumental uses: the witness who can still testify honestly, the negotiator who cannot be squeezed for knowledge she does not have, the patient whose ignorance keeps her insurable, the parent who can still hope, the actor who must not know how the scene ends. Ignorance is sometimes the only commitment device available. And in settings containing other agents who observe and respond, better information can strictly harm its possessor, and can even destroy the risk-pooling that insurance-like arrangements depend on, leaving everyone worse off than before anyone knew anything. Is that a counterexample to (1)? Or is it only a reminder that (1) was proved for a single decision-maker facing nature, and that (3) generalizes illicitly from that case to all the others?

  There is also a fourth thing my colleague says, which I find convenient and evasive in about equal measure: that if learning can change what an agent wants, then the theorem is being applied to someone who is no longer the same agent afterwards; that decision theory has no way of saying whether the earlier self should defer to the later one; and that refusals of the (b) kind are therefore neither rational nor irrational, but simply outside the theory's jurisdiction.

  Tell me which step to reject and what rejecting it costs. If more than one of (a) through (c) is doing real work, say how they come apart — which refusals each explains and which it leaves untouched — and say whether (c) marks a genuine limit of the theorem or a misuse of it. I would rather keep (1) and (5) than (3), if I have to choose.
reasoning: |-
  Okay, the user is grappling with Good's theorem and its implications on rational behavior regarding information. They've presented a compelling argument from a colleague that suggests refusing costless information is irrational, but they observe that people often do this reasonably. The user wants to reconcile this without rejecting the theorem or dismissing real-world refusals as irrational.

  First, I need to recall Good's theorem. It states that for an expected utility maximizer who updates beliefs via conditionalization, the expected value of costless information is non-negative. The user's colleague argues that refusing such information is therefore irrational. But the user notes examples like avoiding genetic tests or spoilers, which seem reasonable. 

  The user proposes three avenues to explore: (a) ex ante vs actual outcome concerns, (b) utility depending on information states directly, and (c) instrumental value of ignorance in strategic contexts. There's also the colleague's point about changing utility functions making the decision "outside the theory's jurisdiction."

  For (a), while the theorem guarantees non-negative expected value, individuals might refuse due to risk aversion over possible outcomes. But the theorem already accounts for expectation, so this doesn't challenge it. Risk aversion is about utility curvature, not information value per se.

  For (b), if utility depends on the information state itself (e.g., suspense from not knowing a novel's ending), this violates the theorem's assumption that utility is defined solely over outcomes independent of information pathways. Rejecting this assumption explains many refusals without contradicting the theorem.

  For (c), in strategic interactions (e.g., insurance markets), information can harm by destroying risk-pooling equilibria. Good's theorem assumes a single agent against nature, so these cases fall outside its scope. This is a genuine limitation, not a misuse.

  The colleague's "changing utility" point is valid but doesn't cover all cases. It's more relevant to (b)-type scenarios where information alters preferences.

  The user prefers keeping Good's theorem and the honesty of real-world refusals. To do this, we must reject the universal applicability claim in (3). The theorem holds in its specific framework, but real decisions often violate its assumptions—especially outcome-dependent utility and non-strategic environments.

  Each avenue explains different refusals: (b) covers direct disutility of knowing (spoilers, test results), while (c) explains instrumental uses of ignorance (negotiation, insurance). (a) is less compelling as it doesn't challenge the theorem. The cost is accepting that decision theory is context-bound, not universally prescriptive. This preserves both the theorem's validity and the rationality of many refusals.
answer: |-
  You've diagnosed the tension perfectly. Your colleague's argument hinges on the universal applicability claimed in (3): that Good's theorem *must* bind all rational agents in all situations involving costless information. **The step to reject is (3).** Good's theorem is true and powerful *within its specific domain*, but that domain excludes crucial features of the real-world refusals you describe in (5). Rejecting (3) means accepting that the theorem's guarantee *does not universally apply*, not because the theorem is wrong, but because many real-world scenarios violate its core assumptions.

  Here's how your candidates (a), (b), and (c) explain this limitation, how they relate, which refusals they cover, and the cost of rejecting (3):

  1.  **Rejecting (3) via (b): Utility Depends on the Informational State (The Direct Cost of Knowing)**
      *   **What it Does:** This directly challenges assumption (2). Good's theorem assumes utility is defined solely over *outcomes* (states of the world + actions taken), and crucially, that the *path* to the outcome (specifically, *what the agent knows when*) doesn't intrinsically affect utility. This is false in many cases.
      *   **How it Violates Assumptions:** When the informational state itself is a direct argument in the utility function (e.g., U(outcome, knowledge_state)), the agent is no longer maximizing expected utility over outcomes *alone*. Knowing the spoiler *is* part of the outcome for the novel reader. Living with the knowledge of a grim genetic fate *is* part of the outcome for the patient, distinct from living in hopeful uncertainty even if the physical state is identical.
      *   **Refusals Explained:** This directly covers:
          *   Avoiding the novel spoiler (knowledge ruins suspense/enjoyment).
          *   Avoiding the genetic test (the psychological burden of knowing).
          *   Avoiding confirmation of infidelity (the pain of knowing vs. the anxiety of doubt).
          *   Avoiding the exam grade (dread vs. knowing failure during resit prep).
          *   Avoiding the envelope (dread/anxiety vs. knowing failure during a waiting period).
          *   Paying to avoid/un-know information (demonstrating the *direct negative value* of the knowledge state itself).
      *   **Theorem's Fate:** The theorem *fails* if utility genuinely depends on the information state. Attempting to "enlarge the space of outcomes" to include the information state is conceptually possible but:
          *   **Changes the Problem:** It redefines the "outcome" to include the epistemic state at a specific time. The *signal* (e.g., the test result) is no longer just providing evidence about a pre-defined outcome; it is *creating* a new aspect of the outcome (the knowledge state).
          *   **Makes it Unfalsifiable?** Partly. If we define "outcome" broadly enough to include *everything* the agent ever experiences, including all subjective states triggered by information, then technically, any effect of information *could* be modeled as changing the outcome. However:
              *   This requires defining the outcome space *before* the agent knows what signals will be available or what they will reveal, which is complex and often impractical.
              *   Crucially, **it destroys the theorem's practical relevance for the agent *before* they learn.** The theorem would guarantee that getting the signal has non-negative expected value *relative to this massively complex outcome space including knowledge states*. But the agent refusing the signal *now* perceives the act of acquiring the knowledge *itself* as having a direct negative impact on a specific dimension of their future utility (e.g., peace of mind, suspense). Good's theorem, applied naively without this complex redefinition, gave them no guarantee against *that specific harm* because it assumed such harm didn't exist. Redefining outcomes makes the theorem hold formally but obscures the very real *phenomenon* of information having intrinsic disutility.
      *   **Cost of Rejecting (3) here:** We acknowledge that Good's theorem does not apply when information acquisition intrinsically changes the agent's subjective experience in a way that constitutes a direct loss of utility. Rationality *can* involve refusing intrinsically harmful experiences, even if they are "free" and provide potentially useful evidence.

  2.  **Rejecting (3) via (c): Instrumental Value of Ignorance & Strategic Settings (Ignorance as a Tool or Shield)**
      *   **What it Does:** This challenges the assumption of a single, non-strategic decision-maker facing nature. Good's theorem holds for an isolated agent making choices against a fixed environment. It breaks down when:
          *   **Ignorance has instrumental value:** Not knowing allows the agent to credibly commit to actions, maintain relationships, or access goods (like insurance) that would be impossible or costly if they knew.
          *   **Other strategic agents exist:** Others observe the agent's knowledge state (or infer it from their actions) and react accordingly. Information can become a liability.
      *   **How it Violates Assumptions:** The theorem assumes:
          *   The same actions remain available regardless of the signal (violated when knowledge disqualifies you from actions, e.g., testifying *without* knowledge of fact X; getting insurance *without* knowing high risk).
          *   The environment (including other agents' actions) is unaffected by *whether* the agent has the signal or *what* the signal was (violated in strategic settings).
      *   **Refusals Explained:** This covers:
          *   The witness refusing knowledge to testify honestly.
          *   The negotiator refusing knowledge to avoid pressure/leverage.
          *   The patient avoiding testing to remain insurable.
          *   The parent avoiding knowledge to preserve hope (if hope enables beneficial actions/attitudes).
          *   The actor avoiding the ending to preserve performance authenticity.
          *   The systemic failure of risk-pooling (insurance markets) if information becomes widespread – everyone refusing testing *can* be Pareto-improving compared to everyone knowing.
      *   **Theorem's Fate:** This is a **genuine limit of the theorem**, not a misuse. Good's theorem was never intended for multi-agent strategic games or situations where knowledge itself changes the rules of the game (available actions, others' responses). In these contexts, better information *can* make the possessor strictly worse off *ex ante*. Refusing information *can* be the uniquely rational equilibrium strategy.
      *   **Cost of Rejecting (3) here:** We acknowledge that Good's theorem applies only to non-strategic, single-agent decision problems. Rationality in strategic or institutionally constrained settings often *requires* managing information (including refusing it) to achieve better outcomes.

  3.  **Candidate (a): Ex Ante Guarantee vs. Actual Outcome Worry**
      *   **What it Does:** Highlights that the guarantee is about *expected* value, not realized value. The agent might fear a specific bad outcome revealed by the signal.
      *   **How it Relates:** This does *not* fundamentally violate Good's assumptions by itself. The theorem *accounts* for the possibility of bad news by weighting it with its probability and the agent's utility loss if it occurs. The *expectation* still shouldn't be negative.
      *   **Refusals "Explained"?** This might describe the *psychology* of refusal (fear of a specific bad outcome), but it doesn't provide a *rational basis* for refusal *under the theorem's strict assumptions*. If utility is defined only over outcomes and paths don't matter, and it's a single-agent problem, then refusing due to fear of bad news, while understandable, *is* irrational under the strict EUM framework. The agent is over-weighting the disutility of the bad state revealed by the signal compared to the benefit of potentially getting good news or tailoring actions optimally.
      *   **Theorem's Fate:** Intact. This is not a counterexample. It highlights risk aversion (curvature of utility), not a flaw in the value of information per se. A highly risk-averse agent might value the signal less, but Good's theorem still says its expected value is non-negative *given their correct beliefs and utility function*.
      *   **Cost if used to reject (3):** If you tried to use this *alone* to justify rejecting (3), you'd be claiming that rational agents can ignore ex ante expectations due to fear of specific outcomes. This *would* undermine the core of expected utility theory itself, not just Good's corollary. It's a high cost – abandoning EUM as the standard of rationality for individual decisions under uncertainty.

  **How (a), (b), and (c) Come Apart & Work Together:**

  *   **(b)** explains refusals where the **act of knowing/state of knowledge itself causes direct disutility** (spoiler, genetic knowledge burden, infidelity confirmation pain). It attacks the utility function assumption.
  *   **(c)** explains refusals where ignorance is **instrumentally necessary** to access actions, relationships, or systems (insurance, honest testimony, negotiation, preserving hope *for action*), or where **strategic interactions** make knowledge dangerous. It attacks the single-agent/non-strategic assumption.
  *   **(a)** describes a psychological motivation (fear of bad news) but **does not provide a rational justification** under strict EUM assumptions *unless* combined with **(b)** (e.g., the disutility of *knowing* the bad news is so high it outweighs the benefits) or **(c)** (e.g., knowing the bad news triggers disqualification from insurance).

  **The Colleague's Fourth Point (Changing Wants):**

  *   This is relevant, primarily intersecting with **(b)**. If learning the signal fundamentally alters the agent's utility function (not just beliefs), then the pre-learning agent *is* effectively making a decision for a future "different person." Standard decision theory struggles with dynamic inconsistency and changing selves.
  *   **Is it Convenient/Evasive?** It's a real problem for applying standard EUM intertemporally when preferences are endogenous. It *is* a way to categorize some **(b)**-type refusals as "outside the theory." However, it feels evasive when applied to cases where the utility change is *caused by the knowledge itself* (a core **(b)** phenomenon) and the pre-learning agent rationally anticipates disliking this change. It doesn't address **(c)** at all.

  **Conclusion & Cost:**

  *   **Reject Step (3):** Good's theorem guarantees non-negative expected value for costless signals **only for a single agent, facing nature, where utility is defined solely over outcomes (states + actions) and is unaffected by the path or state of knowledge, and where the availability of actions is unchanged by acquiring the signal.**
  *   **The Cost:** You lose the clean, universal normative claim that "declining costless information is *always* irrational." Rationality becomes context-dependent. Good's theorem remains a powerful tool *within its domain* (e.g., pure information gathering for operational decisions, scientific inquiry), but it cannot condemn the refusals in (5) as universally irrational. Many of those refusals are rational responses to violations of the theorem's assumptions – specifically **(b)** (direct disutility of knowledge) and **(c)** (instrumental/strategic value of ignorance).
  *   **What You Keep:** You keep **(1)** (Good's theorem, true in its domain). You keep **(5)** (the honesty that many refusals are reasonable). You modify **(2)** by acknowledging its implicit, restrictive assumptions about utility, action availability, and the decision context. You reject the universal claim in **(3)**.
  *   **Which Candidate Does the Work? (b)** and **(c)** do the real work in explaining the refusals. **(a)** is primarily descriptive or relevant only when combined with them. **(b)** covers the intrinsic "cost of knowing" cases. **(c)** covers the strategic/instrumental cases. They are distinct mechanisms explaining different types of refusals, though some situations might blend them (e.g., avoiding a genetic test: **(b)** for the psychological burden, **(c)** for potential insurance loss).
  *   **(c) as Limit or Misuse? (c)** marks a **genuine limit** of the theorem. It was derived for a specific (non-strategic) context. Applying it universally, as (3) does, *is* the misuse.

  You can rationally believe Good's theorem *and* believe that people are often rational to refuse costless information, precisely because the real world frequently involves the direct disutility of knowledge **(b)** or the instrumental/strategic necessity of ignorance **(c)**, placing those decisions outside the scope of the theorem's guarantee.
