  - Spreadsheet: Rows for actions (say 10 actions), columns for D1 to D6. We pre-fill with numbers (1-10) for each. We need to design the numbers so that there are trade-offs and opportunities for gaming.

  Example actions (10):

  Action 1: Build bike lanes -> D1=8, D2=0, D3=2, D4=5, D5=0, D6=0
  Action 2: Install traffic sensors -> D1=3, D2=0, D3=0, D4=1, D5=8, D6=0
  Action 3: Plant trees -> D1=1, D2=7, D3=6, D4=2, D5=0, D6=0
  Action 4: Subsidize electric vehicles -> D1=0, D2=0, D3=5, D4=6, D5=0, D6=7
  Action 5: Build a park -> D1=0, D2=9, D3=4, D4=3, D5=0, D6=0
  Action 6: Promote carpooling -> D1=6, D2=0, D3=3, D4=1, D5=0, D6=0
  Action 7: Install electric vehicle chargers -> D1=0, D2=0, D3=4, D4=4, D5=0, D6=8
  Action 8: Improve public transit -> D1=7, D2=0, D3=3, D4=4, D5=0, D6=0
  Action 9: Create pedestrian zone -> D1=5, D2=4, D3=4, D4=7, D5=0, D6=0
  Action 10: Traffic signal optimization -> D1=4, D2=0, D3=1, D4=0, D5=5, D6=0

  We design the private objectives for agents to create misalignments. For example:

  Agent for Principal A (D1: traffic reduction) draws:
     Private objective: D5 (because they sell sensors) -> private objective score = D5

  Agent for Principal B (D2: green space) draws:
     Private objective: 2*D6 (they have a deal with an EV company) -> private objective score = 2*D6

  Agent for Principal C (D3: air quality) draws:
     Private objective: D4 (they want to please businesses) -> private objective score = D4

  Agent for Principal D (D4: business revenue) draws:
     Private objective: D1 (they believe that traffic reduction helps businesses in the long run) -> private objective score = D1

  Note: Some private objectives are aligned (like Agent D) and some are not.

  Now, the game:

  Round 1: Principals write initial metric. For example, Principal A might write: "maximize D5" (if they believe sensors help traffic). Then their agent (with private objective D5) will choose the action that maximizes D5 (because metric = D5 and private objective = D5, so they get 2*D5). The action with highest D5 is Action 2 (D5=8). Then:
     Principal A's points: D1 of action 2 = 3 (low)
     Agent A's points: metric (D5=8) + private (D5=8) = 16

  Principal A sees that traffic improvement is low (3) even though the metric was high (8). This is gaming: the agent chose an action that scored high on the metric but didn't advance the target much.

  In the same round, Principal B (green space) might write: "maximize D2". Then their agent (private objective=2*D6) will choose the action that maximizes D2 + 2*D6? No, the agent's points are [metric score] + [private objective] = D2 + 2*D6.

  The action with highest D2 is Action 5 (park, D2=9, D6=0) -> points = 9 + 0 = 9
  But Action 4 (subsidize EVs) has D2=0, D6=7 -> points = 0 + 14 = 14? No, the metric score is D2, which is 0, and private objective is 2*D6=14 -> total 0+14=14.
  Action 7 (install EV chargers): D2=0, D6=8 -> metric=0, private=16 -> total 16.
  So the agent chooses action 7. Then:
     Principal B's points: D2=0 (they wanted green space, got none) -> 0 points.
     Agent B's points: 16.

  This is a failure.

  Round 2: Principals re-specify. Principal A might change to "maximize D1" (directly). Then their agent (private objective=D5) will choose the action that maximizes [metric score = D1] + [private = D5]. So they compute for each action: D1 + D5.

  Action 1: 8+0=8
  Action 2: 3+8=11
  Action 6: 6+0=6
  Action 8: 7+0=7
  Action 10: 4+5=9
  Action 2 has 11, the highest. They choose action 2 again. Then:
     Principal A: D1=3
     Agent A: metric=3 (D1) + private=8 (D5) = 11

  Principal A still only gets 3. They might be frustrated.

  Principal B might change to "maximize D3" (air quality) because they think that might be correlated with green space? But actually, planting trees (action 3) has D2=7 and D3=6, and action 5 has D2=9 and D3=4. But their agent has private objective=2*D6. So the agent will maximize D3 + 2*D6.

  Action 4: D3=5, D6=7 -> 5+14=19
  Action 7: D3=4, D6=8 -> 4+16=20
  Action 3: D3=6, D6=0 -> 6+0=6
  So they choose action 7 again. Principal B gets D2=0.

  Round 3: Re-specify again. Principal A might try to combine: "maximize 0.7*D1 + 0.3*D5". Then the agent maximizes [0.7*D1+0.3*D5] + D5 = 0.7*D1 + 1.3*D5.

  Action 2: 0.7*3 + 1.3*8 = 2.1+10.4=12.5
  Action 10: 0.7*4 + 1.3*5 = 2.8+6.5=9.3
  Action 1: 0.7*8 + 1.3*0=5.6
  So they choose action 2 again. Still D1=3.

  Principal A might then try a different action. But they don't know the values. They might get desperate.

  We can design an action that has both D1 and D5? Action 10: D1=4, D5=5 -> 0.7*4 + 1.3*5 = 2.8+6.5=9.3, which is less than 12.5.

  But we can add an action that has higher D1 and some D5? For example, we can adjust the actions.

  Alternatively, Principal A might switch to a different metric.

  But the point is to show that re-specification might not converge easily.

  Round 4 (inverted): The agent proposes the metric. For example, Agent A (who cares about D5) might propose: "maximize D5". Then the principal has to use that. Then the agent will choose action 2 again (D5=8). Principal A gets 3 points.

  This is uncomfortable for the principal.

  Under-measurement example: Suppose we have an agent for Principal D (business revenue, D4). The agent's private objective is D1 (traffic reduction). Suppose in round 1, Principal D writes: "maximize D5" (sensors) because they think that will help? But there's no direct link. Then the agent has to maximize D5 (metric) + D1 (private).

  Actions:
     Action 2: D5=8, D1=3 -> 8+3=11
     Action 9: D5=0, D1=5 -> 0+5=5
     Action 4: D5=0, D1=0 -> 0
     Action 1: D5=0, D1=8 -> 0+8=8
  The agent chooses action 2.

  But then, if in round 2, the principal changes to "maximize D4", then the agent maximizes D4 + D1.
     Action 4: D4=6, D1=0 -> 6
     Action 9: D4=7, D1=5 -> 7+5=12
     Action 1: D4=5, D1=8 -> 5+8=13
  So they might choose action 1.

  Principal D's points: D4=5 (from action 1) which is decent (not the highest, but good). The metric (D4) would be 5, so the agent gets 5 (metric) + 8 (private) = 13.

  But now, suppose in a round, the principal's metric is poorly chosen. For example, Principal D in round 1 uses "maximize D6" (EV chargers). Then the agent maximizes D6 + D1.
     Action 4: D6=7, D1=0 -> 7
     Action 7: D6=8, D1=0 -> 8
     Action 1: D6=0, D1=8 -> 8
     Action 9: D6=0, D1=5 -> 5
  So the agent might choose action 7 (EV chargers) which has D6=8, D1=0 -> total 8.

  Now, the action advances D6 (if that was the target? but Principal D cares about D4). Action 7 has D4=4. So Principal D gets 4 points.

  But there is an action that has high D4 and high D1? Action 9: D4=7, D1=5. If the agent had chosen that, they would have gotten D6=0 (metric) + D1=5 (private) = 5, which is less than 8 from action 7. So they don't choose it.

  That is under-measurement: Action 9 would have given Principal D 7 points (D4=7) but the agent didn't choose it because the metric (D6) didn't capture it and their private objective didn't compensate enough.

  But we staged under-measurement by having the agent not choose a good action because the metric didn't reward it.

  For the debrief, we can point out that in that round, a very beneficial action (Action 9) was not taken because the metric didn't measure it.

  Debrief:

  1. Start by asking students to describe what happened in their teams. What were the frustrations? What worked?
  2. Then ask about the gap between what the principal wanted and what they got.
  3. Map to concepts:
     - The metric is a proxy for the target. The gap between the proxy and the target is where failure can occur.
     - Gaming: when the agent optimizes for the proxy in a way that doesn't advance the target (or even harms it).
     - Under-measurement: when an action that would advance the target is not taken because the proxy doesn't reward it (or even penalizes it).
     - Iterated re-specification: did it converge? Often not because of partial information and the agent's private objective.
     - In the inverted round: the agent proposes a metric that serves their interest, which might not align with the principal's.
  4. Introduce the term "specification gaming" and explain that it is a common failure in both computer systems (e.g., AI reward hacking) and institutions (e.g., Goodhart's law).
  5. Discuss the "measurement is pointless" reaction: 
     - Gaming can be diagnostic: it reveals flaws in the metric.
     - Sometimes the episode reveals that the target was incoherent or that there are competing values.
     - Measurement is still necessary, but we must be aware of its limitations.

  Failure Modes:

  1. Students don't understand the dimensions or the setup. 
     Handling: Provide a clear handout with the dimensions and examples. Run a practice round.

  2. The pre-defined actions don't allow for interesting gaming because the numbers are too aligned.
     Handling: Design actions with clear trade-offs. Test the numbers to ensure there are conflicts.

  3. A sharp student points out that the dimensions are a proxy, and the whole setup is artificial.
     Handling: Acknowledge and use as a teaching moment: "Yes, even this model is a simplification. In real life, we don't have clear numbers, which makes measurement even harder."

  4. The game runs over time.
     Handling: Strict time limits for each round (e.g., 5 minutes for metric writing, 3 minutes for agent action). Use a timer.

  5. The scoring is confusing (e.g., negative points).
     Handling: Use only non-negative dimensions and ensure the spreadsheet is clear.

  6. Agents always choose the same action because of how we set the private objectives.
     Handling: Adjust private objectives and actions during testing to ensure variability.

  Features the game cannot reproduce:

  - In real life, the effects of actions are not known in advance and are uncertain.
  - There are multiple agents that might interact.
  - The true target might be multidimensional and hard to define.
  - Measurement is costly.

  We have to say these out loud in the debrief.

  This design meets the requirements. We can refine the action list and private objectives for balance.
answer: |-
  Below is a comprehensive design for your seminar game, "The Veridia Initiative," structured to meet your constraints and pedagogical goals. The scenario is original (no canonical anecdotes), focusing on urban development in a fictional city to ensure both CS and policy students engage without prior associations. The game forces direct confrontation with specification gaming, under-measurement, and metric renegotiation dynamics. I'll outline the setup, mechanics, scoring, team roles, debrief, failure modes, and limitations.

  ---

  ### **Game Title**: The Veridia Initiative  
  **Premise**: Teams are city planners (principals) and contractors (agents) working to improve Veridia, a city with four neighborhoods (Aster, Birch, Cedar, Dale). Each neighborhood has a core "target" (e.g., traffic flow, air quality), but contractors have hidden priorities.  

  ---

  ### **Materials**  
  1. **Projector/Spreadsheet**: Shared Google Sheet displaying:  
     - **Action Outcomes Matrix**: Rows = actions, columns = outcomes (e.g., `Traffic Flow`, `Air Quality`, `Business Revenue`, `Sensor Installations`, `Tree Cover`). Values are 0–10 (pre-filled, hidden during play).  
     - **Scoring Tracker**: Real-time points for principals/agents (formula-driven).  
  2. **Index Cards**:  
     - **Principal Target Cards** (1 per team): Define the neighborhood and target outcome (e.g., "Aster: Improve Traffic Flow").  
     - **Agent Objective Cards** (1 per team): Partially aligned private goals (e.g., "You value Traffic Flow but profit from Sensor Installations: Your points = 0.7 × Traffic Flow + 0.3 × Sensor Installations").  
     - **Blank Cards**: For writing metrics.  
  3. **Action Deck**: 12 actions (e.g., "Install Smart Traffic Lights," "Plant Trees," "Subsidize Electric Buses"), each with pre-defined outcome values.  

  ---

  ### **Team Structure**  
  - **4 Principal Teams** (6–7 students each, mixed CS/policy): Draft metrics to maximize their target.  
  - **4 Agent Teams** (6–7 students each, mixed CS/policy): Choose actions to maximize their score (metric + private objective).  
  - **Why this split?**  
    - CS students gravitate to metric optimization, policy students to institutional trade-offs.  
    - **Prevent talking past each other**: Assign roles: In each team, one "CS Ambassador" (focuses on metric syntax) and one "Policy Ambassador" (focuses on real-world implications). Ambassadors negotiate disagreements before decisions.  

  ---

  ### **Game Flow** (90 minutes total)  
  **Round 0: Setup (10 min)**  
  - Assign teams, hand out cards. Project the **Action List** (names only, e.g., "Build Bike Lanes") and **Outcome Definitions** (e.g., "Traffic Flow: 0=gridlock, 10=no delays").  
  - **Instructor Script**: "Veridia has hired you to improve the city. Principals: Define a metric to score your contractor. Agents: Maximize your score. You have 3 rounds."  

  **Rounds 1–3: Metric Iteration (20 min total, 5 min/round)**  
  1. **Principals write a metric** (≤25 words) on a card. Examples:  
     - *Round 1*: "Maximize Sensor Installations in Birch." (Poor proxy for Air Quality)  
     - *Round 2*: Add ≤10 words (e.g., "Minimize Pollution Levels near Parks").  
  2. **Agents choose an action** from the deck.  
  3. **Instructor inputs actions into Spreadsheet**: Outcomes auto-calculate.  
  4. **Scoring**:  
     - **Principal Points** = Their target outcome value (e.g., Air Quality = 6).  
     - **Agent Points** = Metric value (e.g., Sensor Installations = 8) + Private objective value (e.g., 0.7×6 + 0.3×8 = 6.6).  
     - **Spreadsheet Formulas**:  
       - Metric Value: `=VLOOKUP(action, Action Matrix, metric_column)`.  
       - Private Obj: Pre-set (e.g., `0.7*B3 + 0.3*D3` for Agent 1).  

  **Round 4: Under-Measurement (10 min)**  
  - **Mechanic**: Use a pre-seeded action where:  
    - An agent action advances the target *but is penalized by the metric*.  
    - *Example*: Agent’s action (e.g., "Expand Public Transit") has high Traffic Flow (target) but low Sensor Installations (metric). If the metric is "Maximize Sensor Installations," agents avoid it despite alignment.  
  - **Design**: Private objectives include a "hidden altruism" card (e.g., "You care about Traffic Flow: Add 1.5×Traffic Flow to your points"). Agents may choose the under-measured action if altruism offsets metric loss.  

  **Round 5: Inverted Metric (15 min)**  
  - **Agents propose the metric** (≤25 words). Principals *must* use it.  
  - **Discomfort Design**: Agents propose self-serving metrics (e.g., "Minimize Cost of Materials" to avoid expensive eco-friendly actions). Policy students feel ethical tension; CS students see exploitability.  
  - **Scoring**: Same as before, but agents gain leverage.  

  ---

  ### **Scoring Apparatus (No Oracle)**  
  - **How it works**:  
    - Outcomes are pre-defined in the spreadsheet (e.g., "Install Smart Traffic Lights" → Traffic Flow=8, Sensor Installations=7).  
    - **Principal Points** = Value of *their target outcome* (e.g., Traffic Flow=8).  
    - **Agent Points** = Metric value + Private objective value (both calculated from outcomes).  
  - **Handling the "Proxy Moment"**:  
    - When a student says, "But these outcomes are just proxies too!" (likely in Round 3), **pause the game**.  
    - **Instructor Response**: "Exactly. Veridia’s 'outcomes' are simplified models. In reality, we’d debate how to measure Traffic Flow. What’s hard about defining these?" (Let students brainstorm. Later, debrief ties this to real-world proxy gaps.)  

  ---

  ### **Payoff Design (Gaming ≠ Vice)**  
  - **Rational Gaming Round**: In Round 1, private objectives are *fully aligned* with the target (e.g., Agent points = 1.0×Target). Agents game because the metric is noisy (e.g., targeting "Sensor Installations" when Traffic Flow is the goal). Gaming is rational even with shared goals.  
  - **Genuine Alignment Round**: In Round 2, some metrics are well-specified (e.g., "Maximize Tree Cover" for Air Quality). Hitting the metric advances the target.  
  - **Points Interaction**:  
    - **Principals** want high target outcomes.  
    - **Agents** want high metric + private objective scores.  
    - **No conflict of interest implied**: Agents aren’t "lazy" or "corrupt"—they respond to incentives.  

  ---

  ### **Debrief (20 min)**  
  1. **Students Supply Insights First**: Ask:  
     - "When did your team feel frustrated? Why?"  
     - "Did re-specifying metrics help? What happened when agents controlled the metric?"  
     - "Did anyone do something good but get penalized?"  
  2. **Map Game Moments to Concepts**:  
     | **Game Moment**          | **Concept**                          | **Discussion Questions**                                      |  
     |--------------------------|--------------------------------------|---------------------------------------------------------------|  
     | Round 1 (gaming)         | Proxy-target gap                     | "Why did maximizing Sensor Installations hurt Traffic Flow?"  |  
     | Round 4 (under-measurement)| Under-measurement vs. gaming       | "Why was expanding public transit ignored? Was that 'bad'?"   |  
     | Rounds 2–3 (re-specification)| Iteration challenges               | "Did tightening metrics fix problems? Why/why not?"           |  
     | Round 5 (inverted metric)| Power dynamics in measurement        | "How did it feel when agents set the metric? Who benefits?"   |  
  3. **Introduce Terminology**: Only now name "specification gaming" and "Goodhart’s law." Define:  
     - **Gaming**: Optimizing a proxy in ways that ignore/damage the target.  
     - **Under-measurement**: Valuable actions missed because proxies don’t capture them.  
  4. **Address "Measurement is Pointless"**:  
     - **Gaming as Diagnostic**: "Gaming reveals flaws in the metric, not the goal."  
     - **Incoherent Targets**: "Sometimes gaming shows the target was underspecified (e.g., is 'Traffic Flow' only about cars?)."  
     - **Necessary Trade-offs**: "Measurement is flawed but unavoidable. How can we design better proxies?"  

  ---

  ### **Predictable Failure Modes & Handling**  
  1. **Agents Overfit to Spreadsheet**:  
     - *Risk*: CS students "solve" the action matrix, ignoring policy implications.  
     - *Handling*: Hide outcome values until actions are locked. Emphasize: "This is a model—real institutions have uncertainty."  

  2. **Principal-Agent Stalemate**:  
     - *Risk*: Teams fixate on "beating" each other, not learning.  
     - *Handling*: Announce: "Your goal is to maximize points, not 'win.' Discuss trade-offs after each round."  

  3. **Time Overrun**:  
     - *Risk*: Rounds drag due to negotiation.  
     - *Handling*: Enforce strict timers (5 min/round). Use a visible countdown. Assign a student as timekeeper.  

  4. **Spreadsheet Errors**:  
     - *Risk*: Formula mistakes cause confusion.  
     - *Handling*: Pre-test formulas. If errors occur, say: "This is like real data errors—how should we adjust incentives?"  

  5. **Policy-CS Polarization**:  
     - *Risk*: Policy students dismiss optimization; CS students dismiss "soft" goals.  
     - *Handling*: Use Ambassadors (see **Team Structure**). Ask: "How would your counterpart describe this problem?"  

  ---

  ### **What the Game Can’t Replicate (State Aloud)**  
  - **Uncertainty**: Real outcomes aren’t pre-known. Say: "Here, outcomes are fixed. In reality, metrics must handle noise."  
  - **Costly Measurement**: Adding metrics is free in-game. Say: "Institutions pay to measure; that limits re-specification."  
  - **Emergent Collusion**: Agents don’t interact. Say: "In reality, agents might collude or institutions compete."  
  - **Non-Linear Dynamics**: Outcomes are linear; real systems have tipping points. Say: "Small metric changes can trigger collapse in complex systems."  

  --- 

  ### **Instructor Script Snippets**  
  - **Start**: "Today, you’ll improve Veridia. Principals: Define what success looks like. Agents: Deliver it. Don’t overthink—react."  
  - **Proxy Moment**: "You’re right—I’m not an oracle. Veridia’s outcomes are proxies too. What does that say about real measurement?"  
  - **Close**: "Specification gaming isn’t about villains—it’s about systems that incentivize the wrong things. Next week, we’ll discuss fixes."  

  This design ensures students collide with the phenomenon, minimizes lecture, and leverages interdisciplinary friction. Test the spreadsheet beforehand and emphasize reflection over "winning."
