answer: |-
  Based on your principles (1)-(6) and the "shadow rule" issue, let's systematically analyze tensions, rank them by severity, and identify the most practical resolution. The core problem arises when procedural generation (6) combined with negation-based negatives (4) creates unintended regularities (e.g., "exactly two shapes" in positives) that allow shorter, non-compositional rules (violating 2 and 5) to satisfy the simplicity prior (3). Below is a consistency check, tension analysis, and resolution roadmap.

  ---

  ### **Step 1: Pairwise Analysis of Principles**
  We'll evaluate where principles **genuinely collide** (fundamental conflict) vs. **apparent collisions** (fixable with implementation tweaks).  
  **Key**: 🟢 = Compatible, 🟡 = Tension (fixable), 🔴 = Genuine collision.

  | Pair          | Analysis                                                                                                | Verdict  |
  |---------------|---------------------------------------------------------------------------------------------------------|----------|
  | **(1) vs (2)**| Generalization (1) doesn't require verbalization, but (2) demands one "intended" rule. No conflict.     | 🟢       |
  | **(1) vs (3)**| Generalization (1) aligns with MDL (3): shortest rules typically generalize best.                       | 🟢       |
  | **(1) vs (4)**| Generalization (1) benefits from negation (4) by ensuring systematic negatives.                         | 🟢       |
  | **(1) vs (5)**| Compositionality (5) is a specific form of generalization (1). Complementary.                           | 🟢       |
  | **(1) vs (6)**| Procedural generation (6) supports generalization (1) by avoiding leakage.                              | 🟢       |
  | **(2) vs (3)**| (2) demands one rule, but (3) may select unintended shorter rules (e.g., "exactly two shapes").         | **🔴**   |
  | **(2) vs (4)**| Negation (4) enables a clear intended rule, but generator flaws can create shadow rules. Fixable.       | 🟡       |
  | **(2) vs (5)**| Compositionality (5) implies rules are combinatorial; (2) rejects alternatives. Aligned if enforced.    | 🟢       |
  | **(2) vs (6)**| Generated problems (6) may produce shadow rules conflicting with (2). Fixable via better generation.    | 🟡       |
  | **(3) vs (4)**| Negation (4) can introduce biases (e.g., shape counts), making non-compositional rules shorter (3).     | **🔴**   |
  | **(3) vs (5)**| MDL (3) favors simple rules (e.g., counting), but (5) requires compositional primitives. Core tension. | **🔴**   |
  | **(3) vs (6)**| Generation (6) can create data where non-compositional rules are shortest. Fixable via diversity.      | 🟡       |
  | **(4) vs (5)**| Negation (4) of compositional rules (5) should yield valid negatives. Compatible if implemented well.   | 🟢       |
  | **(4) vs (6)**| Negation (4) must integrate with procedural generation (6). No inherent conflict.                        | 🟢       |
  | **(5) vs (6)**| Compositionality (5) can be tested via generated combinations (6). Synergistic.                         | 🟢       |

  ---

  ### **Step 2: Ranking Tensions by Severity**
  From most to least severe, based on impact on benchmark validity:
  1. **🟥 (3) vs (5) [MDL vs. Compositionality]**  
     - **Severity**: Critical. MDL prior inherently favors low-complexity rules (e.g., counting, symmetry) over compositional combinations (e.g., "containment + line contact"). This directly undermines (5), as non-compositional "shadow rules" often win under MDL.  
     - **Example**: "Exactly two shapes" beats "one shape inside another" due to shorter description length, even though the latter is compositional.  
     - **Fixability**: Hard without compromising principles.

  2. **🟥 (2) vs (3) [One Intended Rule vs. MDL]**  
     - **Severity**: High. MDL may select rules fitting the data but not the intended abstraction (e.g., locking onto shape counts instead of relations). Violates (2).  
     - **Example**: A solver using the shadow rule "exactly two shapes" is wrong per (2), but MDL (3) validates it.  
     - **Fixability**: Moderate if generator is adjusted.

  3. **🟨 (3) vs (4) [MDL vs. Negation]**  
     - **Severity**: Moderate. Negation (4) can amplify unintended regularities (e.g., negatives always having 3 shapes), making MDL (3) prefer artifact-based rules.  
     - **Fixability**: High via better negation implementation.

  4. **🟨 (2) vs (6) [One Rule vs. Generation]**  
     - **Severity**: Low. Generated problems (6) can produce data supporting multiple rules, but curation (e.g., validation filters) can enforce (2).  
     - **Fixability**: High.

  ---

  ### **Step 3: The Core Conflict and Resolution**
  - **The Root Issue**:  
    The tension between **MDL (3)** and **compositionality (5)** is irreconcilable under your current setup. MDL naturally favors atomic properties (counting, symmetry) over combinatorial ones (containment + contact), as the latter require longer descriptions. Your generator (via negation in 4) accidentally exacerbates this by creating correlated features (e.g., positives always having 2 shapes).

  - **Cheapest Principle to Drop**: **Minimum Description Length (3)**.  
    - **Why?**  
      - MDL (3) is the anchor enabling shadow rules. Dropping it resolves conflicts with (2) and (5).  
      - (1), (4), (5), and (6) can be preserved, maintaining generalization, negation, compositionality, and scalability.  
      - (2) becomes enforceable: The "intended rule" is defined by compositional primitives, not MDL.  
    - **Cost of Dropping (3)**:  
      - You lose an objective criterion for rule selection, potentially allowing multiple valid rules.  
      - **Mitigation**: Replace MDL with **validation via adversarial examples** (e.g., human-drawn cases like 3 nested circles) to force compositional generalization. This aligns with (1) and (5).

  - **Alternative: Keep (3) but Modify (4) and (6)**  
    If retaining MDL is essential:  
    1. **Redesign negation (4)**: Ensure negatives break all trivial correlations (e.g., include negatives with 2 shapes and positives with 3+ shapes).  
    2. **Enrich generation (6)**: Add "distractor features" (e.g., varying shape counts, colors, sizes) to eliminate shadow rules.  
    - **Cost**: Higher implementation complexity and compute. MDL may still favor non-compositional rules in edge cases.

  ---

  ### **Recommendation: Revised Workflow**
  1. **Drop MDL (3)** as the core prior.  
  2. **Adopt validation-based rule enforcement**:  
     - Generate problems procedurally (6) with negation (4).  
     - For each problem, create **adversarial validation images** (e.g., 3 nested circles for containment rules).  
     - A solver must pass both the original 12 images and adversarial cases to be correct. This enforces (1), (2), and (5).  
  3. **Example Fix**:  
     - For "containment" problems, include positives with 3+ shapes (e.g., nested circles) and negatives with 2 shapes (e.g., adjacent circles).  
     - Test solvers on human-drawn adversarial cases. A shadow rule (e.g., "exactly two shapes") fails immediately.

  This preserves compositionality (5), negation (4), and scalability (6) while resolving the shadow rule issue. It accepts that MDL (3) conflicts irreducibly with compositional generalization (5) in your framework.
