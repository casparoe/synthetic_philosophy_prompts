answer: |-
  Here's a breakdown of where your friend's argument goes astray, why deflationism doesn't commit one to her alarming conclusions, and what might be defensible in her line of thought. I'll address your specific questions directly and state confidence levels clearly.

  **1. The Dispensability Claim & the Inventory Principle (Does deflationism make 'true' *in principle* dispensable?)**

  *   **The Friend's Claim:** Because "It is true that p" is equivalent to "p", the word "true" adds nothing and should be eliminable via the Inventory Principle. Examples like "Everything the Pope says is true" are merely practical inconveniences solvable by listing individual utterances.
  *   **Where it Goes Wrong:** The Inventory Principle fundamentally **misunderstands the expressive role of 'true'**. While it's redundant when applied to *specific, stated propositions* ("It is true that snow is white" = "Snow is white"), it becomes **indispensable** for expressing certain kinds of *generalizations* or statements *about propositions we cannot explicitly list*.
  *   **The Crucial Counterexample:** "Everything the Pope says is true" cannot be *in principle* paraphrased away by listing the Pope's utterances if:
      *   The Pope says an **infinite** number of things (even theoretically).
      *   We don't know *all* the things the Pope has said or will say (which is always the case).
      *   We want to make a statement that applies to *future* utterances ("Whatever the Pope says *tomorrow* will be true").
  *   **Why 'True' is Logically Necessary Here:** The word "true" allows us to *quantify over* propositions ("for any proposition p, if the Pope asserts p, then p") *without having to name or state each proposition p individually*. Listing utterances only works if you have a finite, known, enumerable set. The moment you deal with open-ended classes, unknown propositions, or infinite sets, "true" (or a logical equivalent like satisfaction) becomes essential for expressing the generalization *at all*.
  *   **Deflationism's Stance:** Deflationists explicitly *acknowledge* this indispensable role. The core deflationary insight is that 'true' isn't naming a complex or mysterious *property* underlying all true things; its essential function is precisely to enable these generalizations (and performative acts like endorsing or conceding claims). Deflationism *explains* the utility of the truth predicate via this expressive role, not by denying it.
  *   **Confidence Level:** **High (95%)**. The indispensability of truth for generalizations is a standard and robust point against eliminativism, explicitly recognized within deflationary theories (like those inspired by Quine or Tarski's work on truth definitions).

  **2. The Objectivity Leap (Does deflationism's "thinness" entail that nothing is objectively true?)**

  *   **The Friend's Claim:** Because deflationism makes truth "thin" and "insubstantial," it cannot be a robust property we "aim at." Therefore, it cannot serve as an objective standard, collapsing into the view that disputes are really about power, taste, or convenience.
  *   **Where it Goes Wrong (Significantly):** This commits a crucial **equivocation** on the word "thin."
      *   **Thinness ≠ Subjectivity/Non-Objectivity:** Deflationism says truth isn't a *substantive, explanatory property*. It doesn't say truth is *unreal* or *subjective*. "Snow is white" is true if and only if snow is white. Its truth depends entirely on the objective state of the world (the color of snow), not on anyone's beliefs, power, taste, or conversational convenience. **Deflationism fully preserves the objectivity of truth.**
      *   **What "Aiming at Truth" Means Deflationarily:** To say a belief "aims at truth" means simply that we form beliefs intending that the world be as the belief represents it to be. If I believe "snow is white," I aim for snow *actually being white*. The "standard" for assertion and inquiry deflationarily is: assert/believe *p* only if *p*. This standard is perfectly objective – it hinges on how the world is, independent of us.
      *   **The Misconception about "Robust Property":** Your friend assumes that for truth to be an objective standard, it *must* be a substantive, unified property underlying all truths that we can "latch onto" metaphysically. Deflationism denies that such a substantive property *is needed* or even *exists*. Objective correctness is secured by the individual relationship between each proposition and the world. We don't need (and arguably can't coherently have) a single, deep "Truth-ness" property over and above this.
      *   **The Smuggled Thesis:** The leap to "disputes are about power/taste/convenience" isn't a consequence of deflationism; it's a **separate, radical thesis** (like relativism, subjectivism, or certain social constructivist views) that your friend is *adding*. Deflationism is perfectly compatible with the view that when we dispute whether "snow is white" or "evolution occurred," we are disputing objective matters of fact about snow and biology. The deflationist just says that calling these claims "true" isn't adding a *further layer* of deep metaphysical fact about them; it's simply endorsing the claims themselves.
  *   **Confidence Level:** **High (90%)**. Preserving objectivity while denying a substantive truth property is the *defining characteristic* of mainstream deflationism. The friend's leap confuses modesty about the *property* with denial of *objectivity*.

  **3. The Point About Assertion and Inquiry (Can deflationism support truth as a norm?)**

  *   **The Friend's Claim:** Without a robust truth property, truth cannot be the standard assertion and inquiry are answerable to.
  *   **The Deflationist Response (and Potential Weakness):** Deflationists *can* and *do* argue that truth is the norm of assertion: You should assert *p* only if *p* is true (i.e., only if *p*). Inquiry aims to believe *p* only if *p* is true (i.e., only if *p*). The norm is baked into the equivalence schema itself.
      *   **Where the Friend Might Have a *Point* (though overstated):** Some critics argue that deflationism struggles to explain *why* truth is the norm, or what *force* this norm has, precisely because it denies truth any substantive unifying nature. If truth is *just* disquotation, why *should* we aim for it, rather than, say, coherence, usefulness, or power? Deflationists typically respond that the norm arises from the very nature of belief and assertion – to believe *p* just *is* to represent *p* as being the case, and correctness is defined by whether *p* *is* the case. This avoids needing a mysterious "Truth" property to ground the norm.
      *   **Confidence Level on Deflationism Supporting Normativity:** **Moderate (75%)**. Deflationists *can* provide an account of truth as a norm, and it's coherent. However, whether this account feels sufficiently robust or explanatory compared to views that posit a more substantive truth property is a point of legitimate philosophical debate. This is **the point I am least sure of** in terms of definitively resolving the debate in favor of deflationism. The friend's *conclusion* (that it collapses into relativism) is wrong, but her *instinct* that deflationism makes normativity seem "thin" touches on a genuine area of discussion.

  **Defensible Core vs. Errors:**

  1.  **Defensible (though incomplete):** The core deflationary insight that "It is true that p" is equivalent to "p" is correct and important. This *does* show that 'true' adds nothing *in these specific, quotational contexts*. The Inventory Principle *might* apply to redundant synonyms in a limited vocabulary, but...
  2.  **Error 1:** ...it completely fails for generalizations (like the Pope example), where 'true' is logically indispensable. Deflationism *acknowledges* this indispensable expressive role.
  3.  **Error 2:** Equivocating on "thin" to mean "not objective." Deflationism's thinness is about the *property*, not the *objectivity* of the facts described by the propositions. It emphatically does *not* entail relativism, subjectivism, or the view that disputes aren't about objective truth.
  4.  **Error 3:** Conflating the linguistic function of the *word* "true" (which deflationism explains) with the existence of objective *facts* (which deflationism presupposes). Her alarming conclusion requires smuggling in separate, radical subjectivist theses.

  **Conclusion:** Your instinct was correct. Your friend drew wildly exaggerated conclusions ("nothing is objectively true," "disputes are about power/taste") from a modest starting point (deflationism's core equivalence). Her argument breaks down decisively on the indispensability of 'true' for generalizations and on the crucial distinction between "truth is not a substantive metaphysical property" (deflationism) and "there are no objective facts" (radical subjectivism/relativism). Deflationism aims to be a *modest*, non-metaphysical account of the *word* "true" and its logical function, fully compatible with robust scientific realism and objectivity. Her interpretation collapses under the weight of these non-sequiturs. You were not the confused one.
