prompt: |-
  Right — I'm rebuilding the first session of my MA seminar on human enhancement, and I've decided I don't want to open with the usual therapy-vs-enhancement tableau (growth hormone for the short kid, Ritalin for the kid who can't sit still, cochlear implants, steroids, the lot), because every year the students just sort the cases by gut and then reverse-engineer a principle, and every year the principle falls apart on the fourth example. So this year I want the spec first: what a theory of the therapy/enhancement distinction would have to be able to do in order to be *good enough for a specific job*.

  Fix the job as this: the theory has to be usable by a reimbursement committee in a tax-funded single-payer system — people who get real claim forms, have to say yes or no (or maybe yes-but-tiered), and cannot appeal to a contested conception of the good life in their published reasons. Secondary job, and I want you to tell me whether it can be the same theory: it should also say something about what the state may discourage (or quietly encourage) in people who pay out of pocket, and about what employers may require as a condition of a role.

  So: write me the desiderata. For each one give the case or consideration that motivates it — I want the case, not just the criterion — and mark it as non-negotiable or as a preference of one camp. Use these to get you going, kill any you think are bogus, and add the ones I've missed:

  - it must not classify as enhancement a bunch of things we already fund without controversy: vaccines, contraception and fertility treatment, orthodontics, prenatal vitamins, reconstructive surgery after injury or mastectomy, prevention generally. (A theory that implies statins are enhancement has failed, not revealed a surprising truth.)
  - it must cope with the fact that the very same intervention — same drug, same mechanism, same dose — is therapy in one recipient and enhancement in another, and that intentions of the prescriber don't obviously settle it either.
  - it must handle non-disease cases where the welfare gain is real and large but the "abnormal" bit is social: idiopathic short stature, or the kid born with a cleft palate in a culture that treats it as a curse.
  - here's the one I keep chewing on, and I'd like you to give it a proper name and say whether it's a genuine requirement or just egalitarian prejudice: the ratchet case. Some interventions are positional — they help you only because others don't have them, and once uptake spreads the benefit evaporates while the intervention becomes, in practice, compulsory. Height, cosmetic orthodontics, exam-focus drugs in a competitive school system, sleep-reduction drugs in a profession with 30-hour shifts. So the theory must be able to say no to something that everyone involved will experience as a need, without thereby having to call every positional good a disease. I suspect the requirement "only facts about the patient's body count" and "handles the ratchet" cannot both be had, because the ratchet is constitutively comparative.
  - it must handle the degraded-baseline cases, where the environment is what's malfunctioning: the person is functioning normally for their environment and abnormally for the species, or vice versa. Immune boosters where a pathogen is endemic, weight-loss drugs in an obesogenic food environment, air filtration, hearing protection, cognitive prosthetics for people whose jobs wreck their sleep. Can the theory admit that the environment is what's sick without sliding into "and therefore everything is therapy"?
  - it must handle trade-offs, not just improvements: interventions that raise one capacity and lower another (less sleep at the cost of emotional memory consolidation, say, or focus bought at the price of divergent thinking), so it can't just define enhancement as all-things-considered improvement.
  - it must handle cases with no prior baseline to restore — germline editing, prenatal intervention, anything where there is no "before" the person was healthy in.
  - it must handle the cases where the subject denies there's anything to fix (the Deaf-culture objection to cochlear implants is the easy version; the deep-brain-stimulation patient whose family says he's no longer himself is the hard one), and say what to do when "the patient reports no need" and "the patient's adaptive preferences have been lowered by a lifetime of exclusion" pull in opposite directions.
  - it must handle third-party benefit: the intervention that mostly helps other people (steady hands for a surgeon, alertness for a pilot, a vaccine) — is benefit-to-others a therapy-making feature, and if so does that let any occupationally useful trait become a medical need by the back door?
  - it must respect a distinction I think is load-bearing but can't state cleanly: between whether something is therapy at all, and how much we should spend on it given that it is. A theory that collapses those two will misclassify expensive-but-genuine therapies as enhancements, and cheap-but-optional ones as therapies.

  Then, and this is the part I care about most: tell me which of these are real desiderata and which are just the reflexes of one camp — the medical-naturalist wanting the account to be value-free, the luck-egalitarian wanting it to track what justice requires, the disability-studies side wanting it to be socially constructed all the way down, the administrator wanting binary verdicts. And tell me which subset is jointly unsatisfiable: I have a suspicion that "descriptive rather than evaluative" plus "determinate enough for a real committee to apply" plus "gets the ratchet right" is a set of three where you can have any two, and I want you to argue me out of it or into it. Finally, the single requirement that does the most exclusionary work — which one would knock out the most of the usual candidates?

  At the end, three lines each on how the main contenders do — wellbeing/welfare-based accounts, normal-function or biostatistical accounts, and fair-equality-of-opportunity style accounts, plus whichever of the "it's all a continuum, we should just do cost-benefit" views you think is strongest. Three lines, not a table, and don't pad it: the criteria are the assignment, the scoring is a footnote. And skip the literature, skip the reading list, skip defining the basic distinction — I do that bit in the first ten minutes and I've got it covered.
reasoning: |-
  Okay, the user is rebuilding the first session of their MA seminar on human enhancement. They want to move away from starting with therapy vs. enhancement examples because students just categorize based on gut feeling and then struggle to form a consistent principle. Instead, they want to begin with the specifications for a good theory of the distinction, tailored for a reimbursement committee in a single-payer system. 

  The user has listed several desiderata and wants each to be examined with a motivating case, labeled as non-negotiable or preference-based. They also want to know which requirements conflict, which are ideological reflexes, and which theory handles the criteria best. 

  First, I need to understand each desideratum. For instance, the ratchet case is crucial—it's when an intervention becomes necessary because everyone else uses it, even if it's not medically needed. The user suspects that a theory can't be both non-comparative and handle the ratchet. That’s a key tension.

  Next, I should assess which desiderata are non-negotiable for the reimbursement context. Things like handling clear-cut funded interventions (vaccines, prenatal vitamins) without controversy are probably non-negotiable. Otherwise, the theory would be impractical. The ratchet case might be non-negotiable too, as it prevents a slippery slope in public funding.

  Then, identifying ideological biases. Medical naturalists might insist on value-free criteria, while egalitarians focus on justice. The administrator's desire for binary decisions might clash with the complexity of some cases. Highlighting these helps students see why theories differ.

  Conflicts between desiderata are important. For example, "non-comparative" (focusing only on the individual) clashes with "handles the ratchet" (which is inherently social). Also, "descriptive rather than evaluative" might conflict with the ratchet and trade-off cases, which require value judgments. The user’s suspicion about these three being incompatible seems valid—you can’t have all three without trade-offs.

  The most exclusionary criterion is likely the ratchet because it demands a comparative analysis, which many theories can't accommodate without compromising other desiderata. This would knock out theories like normal-function or welfare-based accounts that don’t handle positional goods well.

  For theory evaluation: 
  - Normal-function accounts (like Boorse) fail the ratchet, social abnormality, and degraded baseline cases because they ignore social context. 
  - Welfare-based accounts struggle with trade-offs, third-party benefits, and the ratchet since they rely on subjective wellbeing. 
  - Fair equality of opportunity might handle some social cases but falters with the ratchet and trade-offs by being too focused on competitive advantages. 
  - Cost-benefit approaches avoid the therapy/enhancement split but may not provide clear reimbursement guidelines and could justify problematic enhancements if benefits outweigh costs.

  The user’s deeper needs include wanting students to critically engage with the limitations of each theory and understand real-world applicability. They might also want to highlight how policy constraints shape theoretical viability, preparing students for ethical decision-making in bureaucratic contexts.
answer: |-
  Here are the desiderata for a usable therapy/enhancement theory, refined and expanded from your list, with cases motivating each, their status (non-negotiable or preference), and critical analysis of conflicts/exclusionary power.

  **Desiderata for a Reimbursement-Committee-Ready Theory**  
  *(Motivating Cases & Status)*  

  1.  **Non-Controversial Inclusion (Non-Negotiable):** Must fund established interventions without reclassifying them as enhancement.  
      *Case:* Vaccines, statins for high-risk patients, prenatal vitamins, reconstructive surgery post-mastectomy. Failure to include these renders the theory unusable in real systems.  

  2.  **Intervention-Specificity (Non-Negotiable):** Same intervention (drug/dose/mechanism) must be classifiable as therapy for one recipient, enhancement for another, independent of prescriber intent.  
      *Case:* Testosterone for hypogonadism vs. athletic performance; Ritalin for ADHD vs. exam cramming.  

  3.  **Social Abnormality Handling (Non-Negotiable):** Must address welfare losses stemming from social norms, not inherent pathology.  
      *Case:* Idiopathic short stature (social stigma); cleft palate repair in a culture viewing it as a curse.  

  4.  **Ratchet Resistance (Non-Negotiable):** Must reject interventions where benefit is purely positional and widespread adoption creates coercive "need," without medicalizing all competition.  
      *Case:* Cosmetic orthodontics becoming universal in competitive job markets; cognitive enhancers in hyper-competitive education. *(Named: **Positional Goods Coercion Problem**)*  

  5.  **Degraded Baseline (Non-Negotiable):** Must acknowledge environmental pathology without collapsing into universal therapy.  
      *Case:* Weight-loss drugs in obesogenic food environments; air filtration for pollution-induced asthma; immune boosters in endemic disease zones.  

  6.  **Trade-Off Tolerance (Preference: Luck-Egalitarian):** Must not require all-things-considered improvement; must handle interventions with significant downsides.  
      *Case:* Sleep-reduction drugs impairing emotional memory; focus enhancers reducing creative thinking.  

  7.  **No-Prior-Baseline Cases (Preference: Medical-Naturalist):** Must handle interventions where no healthy "pre-state" exists for the individual.  
      *Case:* Germline editing to prevent genetic disease; prenatal folate to prevent neural tube defects.  

  8.  **Subject Autonomy & Adaptive Preferences (Preference: Disability Studies):** Must navigate conflicts between self-assessment ("no need") and potential adaptive preference distortion.  
      *Case:* Deaf-culture rejection of cochlear implants vs. DBS for depression where personality changes distress family.  

  9.  **Third-Party Benefit (Preference: Administrator):** Must assess whether benefit to others (society, specific roles) influences therapy status, without enabling occupational backdoor medicalization.  
      *Case:* Vaccines (societal benefit); steady-hand drugs for surgeons (occupational).  

  10. **Cost-Scale Separation (Non-Negotiable):** Must distinguish *whether* something is therapy from *how much* should be spent on it.  
      *Case:* Expensive cancer drug (therapy, but cost may limit access) vs. cheap cosmetic mole removal (enhancement, but affordable).  

  11. **Determinate Application (Non-Negotiable):** Must yield consistent, defensible "yes/no/tiered" decisions usable by a committee bound by non-contestable public reasoning. *(Implicit in the "job" – committees need clear rules)*  

  **Analysis of Desiderata**  
  - **Ideological Reflexes:**  
    - *Medical-Naturalist:* Favors #7 (no-prior-baseline), resists #3 (social abnormality) & #8 (adaptive preferences) as "non-biological."  
    - *Luck-Egalitarian:* Favors #6 (trade-offs), #3 (social abnormality), #4 (ratchet). Resists "value-free" accounts.  
    - *Disability Studies:* Favors #8 (autonomy/adaptive preferences), #3 (social model). Resists #1 if "established" interventions are oppressive (e.g., cochlear implants).  
    - *Administrator:* Favors #11 (determinate), #9 (third-party), #10 (cost-scale separation). Resists ambiguity in #4/#8.  

  - **Conflict Cluster (You were right):**  
    **"Descriptive" + "Determinate" + "Ratchet Resistance" is jointly unsatisfiable.**  
    - *Why:* The ratchet (#4) is inherently *comparative* (positional goods) and *evaluative* (coercion, fairness). A "descriptive" theory (e.g., biostatistical) can be determinate (#11) but ignores social context (#4). A theory capturing the ratchet must incorporate social/economic context (#4), making it evaluative and less determinate (#11). You can have:  
      - Descriptive + Determinate (Boorsean) → Fails #4.  
      - Descriptive + Ratchet Resistance → Impossible.  
      - Determinate + Ratchet Resistance → Requires evaluative rules (e.g., "no public funding for positional goods"), sacrificing descriptive purity.  

  - **Most Exclusionary Desideratum:**  
    The **Ratchet Resistance (#4)** does the most damage to existing theories. It requires:  
    1. Recognizing social/economic context (kills "only body facts" accounts).  
    2. Making evaluative judgments about coercion/fairness (kills "value-free" accounts).  
    3. Drawing a line between medical need and positional advantage (kills simplistic welfarism).  

  **Theory Report Card (3 Lines Each)**  
  - **Normal-Function (e.g., Boorse):** Fails #3 (social abnormality), #4 (ratchet), #5 (degraded baseline). Strong on #1, #2, #7, #11. Deterministic but biologically reductionist.  
  - **Wellbeing/Welfare-Based:** Fails #4 (ratchet), #6 (trade-offs), #9 (third-party benefit → backdoor medicalization). Struggles with #10 (cost-scale). Handles #3, #8 better. Too subjective/vague for #11.  
  - **Fair Equality of Opportunity (e.g., Daniels):** Handles #3, #5 better than normal-function. Still struggles with #4 (ratchet – positional goods distort opportunity), #6 (trade-offs), #8 (adaptive preferences). More evaluative, less determinate (#11).  
  - **Cost-Benefit Continuum (Strongest Pragmatic View):** Avoids therapy/enhancement distinction; focuses on net benefit/cost-effectiveness. Excels at #10. Fails core requirement: provides no principled *distinction* for committee's binary role (#11). Vulnerable to ratchet (#4) and unjust trade-offs (#6).  

  **Conclusion for Your Session:** Start by framing the reimbursement committee's constraints (public reason, binary decisions, no contested goods). Hammer the **Positional Goods Coercion Problem (Ratchet #4)** as the wrecking ball that shatters most theories and exposes the unavoidable tension between descriptive purity, determinacy, and social reality. This forces students to confront *why* the usual tableau fails—it ignores the institutional context and the ratchet's evaluative core.
