prompt: |-
  Two people in my old stats department have been going at each other for months about Simpson's paradox, and I want the document they should have written instead of all the arguments.

  Call the camps the Poolers and the Splitters. Poolers: report the overall (marginal) association, that's the number a decision-maker actually acts on, and the subgroup tables are mostly where you go to fool yourself. Splitters: the pooled figure is a weighted average with weights set by whoever happened to show up, so it's an artefact — condition on the partition that reflects how the world is actually structured.

  Give me: (1) a numbered list of claims both can sign — both tables can be true at once, the reversal comes from unequal weights across strata, no table settles the question by itself, that sort of thing; (2) a table of the disagreements that are left, each row worded so that side would accept it as a fair statement of its own view; (3) the cruxes, and please seperate the genuine ones from the ones that were only ever about words.

  Both sides accept these two cases as bearing on the cruxes, so write down each side's prediction in advance. Case A: two surgeons, one deliberately takes the nastier cases — worse overall, better within every severity band. Case B: a discharge follow-up programme whose main effect is getting patients to attend their outpatient appointment, audited after stratifying by whether they attended.

  One wrinkle: the trust running case B can only roll the programme out to everyone or scrap it, no targeting. So part of the rule has to be about the action space, not just the causal story. Answer in British English, and keep it reasonably tight.
reasoning: |-
  Okay, let me break this down. The user wants a structured document to resolve a stats department feud about Simpson's Paradox between "Poolers" and "Splitters". 

  First, I need to establish common ground. Both sides agree that:
  - The paradox arises from unequal subgroup weights
  - Numerical reversals don't imply data falsity
  - Neither table alone settles causal questions
  - The action space matters for decision-making

  The core disagreements seem to be:
  - Poolers see marginal associations as decision-relevant because they reflect real-world operational outcomes
  - Splitters view marginal figures as artifacts of sampling accidents
  - The key philosophical split is whether "truth" lives in aggregate outcomes or structural mechanisms

  For the case studies:
  - In Surgeon A (nasty cases), both sides would correctly predict the reversal pattern
  - For the discharge program, the disagreement centers on whether to prioritize the marginal effect (Poolers) or conditional effect (Splitters) given the all-or-nothing rollout constraint

  Important nuances:
  - The British English requirement means substituting "programme" for "program" etc.
  - Must emphasize that Case B's action space forces a practical choice between two imperfect options
  - Should flag where disagreements are semantic (e.g., "artefact" vs "operational reality") vs substantive (role of weights in decision-making)

  The output needs parallel structure: agreements first, then symmetrical disagreement statements, then case predictions with reasoning. Keeping it tight means sacrificing some statistical rigor for clarity.
answer: |-
  Here's the document resolving the Simpson's Paradox dispute, structured as requested. British English maintained throughout.

  ### (1) **Agreed Claims (Signed by Both Camps)**  
  1.  **Both Tables Are Valid:** The marginal (pooled) table and the stratified (split) tables are *both* mathematically correct descriptions of the observed data.  
  2.  **Reversal Mechanism:** The apparent reversal (or change) in association direction arises solely from **unequal weighting of strata sizes** in the pooled estimate.  
  3.  **No Definitive Table:** Neither table alone "settles" the causal question or the "true" association. Interpretation depends on context.  
  4.  **Association ≠ Causation:** Neither table proves causation without additional assumptions (e.g., no unmeasured confounding).  
  5.  **Data Integrity:** The paradox does *not* imply data manipulation or error; it’s a natural consequence of compositional effects.  
  6.  **Actionability Matters:** The decision to pool or split should be guided by the **decision-maker’s action space** (e.g., can they target subgroups?).

  ---

  ### (2) **Disagreements (Stated as Each Camp’s Own View)**  
  | Camp       | Statement of Position |  
  |------------|------------------------|  
  | **Poolers** | "The marginal association is operationally relevant because it reflects the aggregate outcome under real-world conditions (i.e., with existing subgroup distributions). Decision-makers must act on the net effect they observe, not hypothetical subgroup scenarios." |  
  | **Splitters** | "The marginal association is an artefact of arbitrary sample composition. Conditioning on causally relevant strata reveals the underlying mechanisms. Ignoring this invites ecological fallacy and masks where interventions actually work." |  

  ---

  ### (3) **Cruxes**  
  **Genuine Disagreements:**  
  - **Operational Truth vs. Structural Truth:** Poolers prioritise the *realised outcome* (marginal table) as the "bottom line" for decisions. Splitters prioritise *causal structure* (conditional tables) as the "true" relationship.  
  - **Default Reporting:** Poolers argue the marginal table should be reported *first* (as it’s action-relevant). Splitters argue strata should be reported *first* (as they’re scientifically informative).  
  - **Weight Legitimacy:** Poolers see subgroup sizes as part of the reality to be accounted for. Splitters see them as confounders distorting inference.  

  **Semantic Disagreements:**  
  - "Artefact" (Splitters) vs. "Operational Reality" (Poolers): Largely hinges on whether "artefact" implies *illegitimacy* (Poolers object) or *compositional dependency* (Splitters defend).  
  - "Fooling Yourself" (Poolers): Splitters agree subgroup analyses *can* mislead but argue pooling *guarantees* misleading conclusions when strata exist.  

  ---

  ### **Case Predictions & Interpretations**  
  **Case A: Two Surgeons**  
  - **Poolers’ Prediction:** "Surgeon A has worse *overall* mortality. Hospital managers should prioritise case-mix adjustment when comparing surgeons, but patients with a fixed severity should choose Surgeon B."  
  - **Splitters’ Prediction:** "Surgeon B is superior *within every severity stratum*. The overall rate is skewed by Surgeon A’s caseload. Patients should choose Surgeon B regardless of severity."  
  - **Shared Conclusion:** Both agree reporting only the pooled table misleads by ignoring case mix. Splitters insist conditional tables are decisive; Poolers argue the marginal table still informs resource allocation (e.g., if Surgeon A’s cases are unavoidable).  

  **Case B: Discharge Follow-up Programme**  
  - **Context:** Programme rollout is all-or-nothing.  
  - **Poolers’ View:** "Act on the marginal association. If the programme *overall* reduces readmissions (despite reversal in strata), implement it. The net effect is what matters for trust-wide policy."  
  - **Splitters’ View:** "Condition on attendance. If the programme only works *for those who attend*, and attendance is unchanged by the programme, the marginal gain is an artefact of attendance distribution. Report the conditional effect and invest in improving attendance first."  
  - **Crux:** Poolers see the marginal effect as the pragmatic outcome; Splitters see it as irrelevant because attendance is a mediator, not a confounder.  

  ---

  ### **The Rule (Resolving the Feud)**  
  > **"Report both tables. The marginal association answers: *What happened/will happen under current conditions?* The conditional association answers: *How does it work?* Prioritise the marginal when actions affect the whole population; prioritise the conditional when actions can target strata or explain mechanisms. Never infer causality without additional assumptions."**  

  This forces both camps to concede:  
  - Poolers admit subgroup analysis isn’t "fooling yourself" if strata are causal.  
  - Splitters admit the marginal table *is* action-relevant when interventions are population-wide.  
  The argument ends not with "who won?" but "which question are we asking?".
