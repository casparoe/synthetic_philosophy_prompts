  ### **Classification Tree**  
  Each node splits based on a single philosophical claim. The tree has **8 leaves** (final positions).  
  ![Classification Tree](https://i.imgur.com/Z9XJzDd.png)  
  *(Text description below for accessibility.)*  

  - **Node 1 (Root)**: *Does the pattern exist prior to its categorization?*  
    - Yes → Node 2  
    - No → Node 3  
  - **Node 2**: *Does categorization alter the pattern?*  
    - Yes → Node 4  
    - No → **Discovery Realism** (Leaf 1)  
  - **Node 3**: *Is the category primarily pragmatic (e.g., for accommodations)?*  
