prompt: |-
  I draw typefaces as a hobby, badly but often, and there's a thing I keep running into that I don't have a word for.

  Say I've got a lowercase alphabet rougly finished and I hate the *g*. Half the time the fix isn't in the *g* at all: I redraw the *a* and the *e*, and without touching it the *g* suddenly looks right. It runs the other way too — a glyph can match every measurable thing I can list about its neighbours (stem weight, contrast, terminal angle, width) and still look like it wandered in out of another font. And then there's a separate-feeling thing: draw the same *a* shape on its own, on a blank page, and it stops reading as an *a*, even though nothing about the outline changed. I can push an *a* a long way towards weirdness as long as it stays clear of the *o* and the *e*, but I have no idea how much clearance is enough, and it isn't a distance I could measure off the drawing.

  So: is there an established notion for whatever makes a letterform both belong to a style and read as the letter it is — anything people have seriously tried to cash out, not just gesture at? A friend said Wittgensteinian family resemblance, but as I understand it that mostly says there's no rule to be had, and that's not my question: it feels like there *is* something the letters of a good font share, and that it lives in the relations between them rather than inside each one. Someone else said *ductus*, but that's about how the pen moves, which isn't it either.

  I don't want a label. I want to know whether this is one phenomenon or two (belonging and reading-as feel different to me, but maybe that's my confusion), what exactly it is, what it isn't, and where the edges are — e.g. is a letter clearly by the same designer but from a different project in the style? If nothing established fits, coin a term and define it tightly enough that I could settle a borderline case with it. Please commit: tell me what you think the thing actually is and why, rather than lining up candidate notions and leaving me to pick.
reasoning: |-
  Okay, let me try to unpack what this designer is really asking. They're describing a nuanced problem in type design that I find fascinating. The core issue seems to be about how letters relate to each other in a font, beyond just measurable parameters. 

  Hmm, they mention three key observations: 
  First, fixing one glyph (like the g) often requires adjusting unrelated glyphs (a and e). 
  Second, a technically matching glyph can still feel alien in the set. 
  Third, a letterform loses its identity when isolated from the font context.

  The designer explicitly rejects vague concepts like "family resemblance" or "ductus." They want a concrete framework - is this one phenomenon or two? What exactly defines "belonging" versus "reading-as"? And crucially, they want me to commit to an explanation.

  I notice they're very precise about what they don't want: no labels without substance, no laundry lists of options. This suggests frustration with superficial design discourse. The Wittgenstein reference shows they've done their homework but found it unsatisfyingly non-prescriptive.

  The real pain point seems to be practical: how to systematically control this elusive quality in their work. When they say "where the edges are," they're asking for operational boundaries - something to help judge when a letter crosses from "quirky but coherent" to "wrong."

  The belonging/reading dichotomy is interesting. Belonging feels like stylistic harmony - does this g look like it's from the same universe as the a? Reading is about semantic function - does this shape still read as "g" when surrounded by its siblings? But as they suspect, these might be two facets of one thing.

  What's striking is how relational this all is. The designer keeps emphasizing "the relations between them rather than inside each one." That's the big clue. It's not about absolute forms but relative behaviors - how letters perform together as a system.

  The "same designer different project" question is telling. They're probing whether this cohesion is font-specific or designer-specific. That suggests they sense it's about systemic constraints rather than personal style.

  Their rejection of measurable parameters (stem weight etc.) is crucial. They've noticed that technical alignment doesn't guarantee perceptual alignment. So whatever we propose must explain why quantifiable features fail to capture this phenomenon.

  For a working concept, I need something that:
  - Is systemic rather than individual
  - Explains both recognition and cohesion
  - Accounts for contextual dependence
  - Provides practical levers for adjustment
  - Distinguishes between "style" and "identity"

  The optical compensation angle feels promising because it addresses how forms adapt to visual context. But is that too narrow? Maybe expand to "contextual performance" - how a glyph's visual behavior changes based on surrounding expectations.

  For the belonging/reading question: they might be two outputs of one mechanism. Belonging emerges from consistent contextual behavior; reading occurs when that behavior matches our learned expectations for a letter's role.

  The boundary test cases matter:
  - If a letter fits stylistically but loses legibility, that's a reading failure
  - If it reads correctly but clashes, that's belonging failure
  - But in practice, they usually fail together because both rely on the same relational logic

  For their designer consistency question: a letter from another project might share DNA but not the specific contextual relationships of this font's ecosystem. Like transplanting an organ - match matters, but so does biochemical environment.

  Need to emphasize that this isn't magic - it's about predictable visual perception principles (lateral inhibition, grouping, pattern completion). The "undrawable" quality comes from complex interactions, not mysticism.

  Should provide concrete adjustment strategies too: when g feels wrong, don't just tweak g - check which letters it's optically competing with or mirroring. The solution often lives in unexpected places because the system has hidden connections.

  Most importantly, give them a way to talk about this that feels substantive enough to build practice around. The frustration with hand-wavey terms is palpable - they want analytical traction.
answer: |-
  You've hit upon the **core paradox of type design**: letters are both independent semantic symbols *and* interdependent visual elements within a system. Your observations aren't two separate phenomena—they're manifestations of a single, fundamental principle: **Contextual Integrity**.

  ### What Contextual Integrity Is
  1.  **The Definition:**  
      *Contextual Integrity is the emergent coherence of a glyph within its specific typographic ecosystem, achieved through consistent optical behavior and relational logic across the character set. It governs both legibility (reading-as) and stylistic harmony (belonging).*

  2.  **Why It's Not Measurable Alone:**  
      Letters aren't evaluated in isolation by the eye/brain. We read through **pattern recognition** and **comparison**. A glyph’s identity ("a-ness") isn't stored as a fixed template but is inferred from its position within a network of relationships:
      *   **Counter-shapes:** The negative space inside an `a`, `e`, `g` must feel optically equivalent (not mathematically equal) in density and rhythm. Changing the `a`'s counter alters the expected "light" against which the `g`'s counter is judged.
      *   **Stroke Synchronicity:** Not just weight, but how strokes *terminate*, *transition*, and *modulate* relative to neighbors. A `g` terminal might clash with the `a` not in angle, but in its *speed of curvature* or *abruptness of finish*.
      *   **Spatial Rhythm:** The distribution of mass, stress, and whitespace creates a cadence. An `e` with a tighter aperture than the `a` disrupts the horizontal flow, making the `g` feel arrhythmic by association.
      *   **Visual Weight Distribution:** Letters balance not just vertically, but horizontally across the set. A heavy `s` top can make a `g`'s ear feel floaty, even if their stem weights match.

  ### Why Belonging and Reading-As are the Same Phenomenon
  *   **Legibility is Contextual:** An isolated `a` loses its identity because it lacks the system that defines its role. Its "a-ness" is confirmed by its *distinction* from `o` (open counter vs. closed), `e` (aperture shape), `d` (ascender vs. no ascender). These distinctions require a consistent underlying logic.
  *   **Style is Relational:** A glyph "belongs" when it adheres to the *same optical rules* as its neighbors. If your `g` follows the curvature model of the `c` but your `a` follows a different model, the `g` feels alien—not because it breaks a rule *on paper*, but because it breaks the *visual grammar* established by the `a` and `e`.

  ### Where the Edges Are (Applying the Concept)
  Use these tests to resolve borderline cases with **Contextual Integrity**:

  1.  **The Isolation Test:**  
      *Does the glyph lose legibility or stylistic clarity when removed from the set?*  
      → If yes, it lacks inherent integrity and relies heavily on context. (*Your blank-page `a` fails here*).

  2.  **The Neighbor Swap Test:**  
      *Replace adjacent glyphs (e.g., put the `g` between an `n` and `o` instead of `f` and `h`). Does it now look worse or better?*  
      → If its perceived quality changes drastically, its integrity is context-sensitive. (*Your `g` improves when `a`/`e` change*).

  3.  **The Style-Transfer Test:**  
      *Could this glyph plausibly exist in another font by the same designer?*  
      → **Yes, but...** It might share DNA (ductus, tool traces) but lack *this font's* integrity. Contextual Integrity is *font-specific*. A glyph from a different project might share proportions but clash in counter-pressure or stroke rhythm. It belongs to the *designer's hand*, not necessarily *this system*.

  4.  **The Distortion Threshold Test:**  
      *How far can I push the `a` toward the `o` before it stops reading as "a"?*  
      → The threshold isn't a fixed distance. It's the point where the relational distinction collapses (e.g., the `a`'s aperture no longer *visibly contrasts* with the `o`'s closure under the font's optical rules). Integrity breaks when comparative cues fail.

  ### Why This Isn't Family Resemblance or Ductus
  *   **Family Resemblance (Wittgenstein):** Describes loose groupings with overlapping features (A resembles B, B resembles C, but A and C share little). Typefaces *do* have this, but it’s insufficient. **Contextual Integrity** demands *systematic coherence*, not just shared traits. A glyph can share traits but lack integrity (your "wandering glyph").
  *   **Ductus:** Refers to construction logic (pen movement). Helpful for generating forms, but irrelevant to how finished shapes *interact optically*. You can have identical ductus but poor integrity if spacing or proportions clash.

  ### How to Use This Practically
  When a glyph feels "off":
  1.  **Don't fix it first.** Identify its *key relational partners* (e.g., `g` relates to `a`, `e`, `y`, `q` via counters/terminals; to `n`, `h` via stem joints).
  2.  **Adjust the context.** Modify partners to establish a clearer, more consistent optical rule (e.g., standardize counter-voice, terminal flourish weight).
  3.  **Re-evaluate the problem glyph.** Often, it "snaps" into place as the system's logic tightens.

  **In essence:** Contextual Integrity is the "gravity" holding your font together. Letters aren't just shapes; they're roles in a visual play. When the ensemble performs with cohesive logic, each character is both recognizable *and* harmonious. It’s not magic—it’s the rigorous orchestration of perception.
