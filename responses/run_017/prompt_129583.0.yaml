  The user has provided fixed points - specific thought experiments that any adequate theory must handle. These include classic cases like the Doomsday Argument and Sleeping Beauty, plus three additions they find neglected: a single undivided life with memory erasure, a sorites case with vague observer boundaries, and cosmological cases with potentially infinite observers.

  I need to produce up to ten requirements, each with:
  - A clear demand on what the theory must deliver or avoid
  - The motivating case for that requirement
  - A tag (non-negotiable, negotiable, or camp preference) with reasoning behind the tag

  I must also address two key distinctions:
  1. Whether each requirement actually applies to the self-locating rule itself or to the prior/measure
  2. Whether the theory needs to bundle a decision rule or if that's separate

  Then comes the crucial part: identifying any conflicts between requirements, saying which requirement to drop if necessary, and scoring existing approaches (self-sampling, self-indication, and no-anthropic-update) against my list.

  Let me think about the core requirements first. The user wants something actionable for decision-making, so I need requirements that ensure the theory outputs usable probabilities even in extreme cases. For example:

  1. **Actionability requirement**: Must return precise probabilities usable in expected utility calculations. Motivated by existential risk assessments where decisions depend on population-weighted impacts. This seems non-negotiable for the stated purpose.

  2. **Vagueness robustness**: Must handle vague observer definitions without catastrophic sensitivity. Motivated by the sorites case. Probably negotiable since some might accept sensitivity as unavoidable.

  3. **Finite output for infinite cases**: Must avoid assigning zero probability to finite populations or requiring infinities in calculations. Motivated by cosmological infinite observer cases. Non-negotiable for usability.

  4. **Memory-loss consistency**: Must not depend on subjective continuity across amnesiac episodes. Motivated by the single undivided life case. Likely non-negotiable for handling identity uncertainty.

  5. **Indexical grounding**: Must connect first-person evidence to hypotheses. Motivated by cosmological fine-tuning arguments. Non-negotiable for the core purpose.

  I also need to address the distinction between the self-locating rule and prior/measure. Many common complaints (like "observer counting matters too much") are actually about the measure, not the update rule. And for decision-making, I think we need to keep credences and decision rules separate - the theory should output probabilities, and decision theory handles the rest.

  Now for conflicts. The biggest tension is between Actionability (requiring precise numbers) and Vagueness Robustness (acknowledging boundaries are fuzzy). I'd prioritize Actionability and suggest using conservative bounds for the vague cases.

  For scoring:
  - **Self-Sampling** (SSA): Fails on memory-loss consistency and infinite cases
  - **Self-Indication** (SIA): Fails on vagueness robustness and invites observer counting paradoxes
  - **No-Update**: Fails indexical grounding completely

  The best approach might be a minimal update rule that treats self-location as indexical data without assuming anything about observer measure - though even this struggles with infinity. When uncertain between rules, agents could use a meta-rule averaging over them, but this gets messy.

  I'll structure my response with clear requirements, then analyze conflicts and score existing approaches, keeping the conclusion brief as requested.
answer: |-
  Here is a specification of requirements for a theory of self-locating uncertainty, designed for decision-making about observer populations in contexts like existential risk assessment, cosmology, and Doomsday-style arguments. The requirements are anchored to your fixed-point cases, distinguish rule vs. prior/measure constraints, and separate belief from action. I provide **ten requirements**—eight core demands plus two addressing the distinctions you highlighted. Each requirement is stated as a demand, followed by its motivation, and tagged with reasoning for the classification. Conflicts and scoring follow.

  ---

  ### Requirements Specification
  1. **Actionable Output**  
     *Demand:* The rule must output precise, usable credences (degrees of belief) for hypotheses about total observer populations, even when populations are astronomical, boundaries are vague, or priors are fixed.  
     *Motivation:* Essential for population-weighted existential risk decisions (e.g., "How much should I sacrifice to prevent a 1% extinction risk if the future population is 10^15 vs. 10^20?"). Without precise outputs, expected utility calculations fail.  
     *Tag:* **Non-negotiable**. Without this, the rule is useless for the stated purpose.  

  2. **Vagueness Robustness**  
     *Demand:* The rule must not catastrophically fail or output undefined credences when observer boundaries are vague (e.g., the sorites case). Outputs should be stable under small changes to the threshold.  
     *Motivation:* In the sorites case, a rule that outputs "99% credence in large population" at one cognitive threshold and "1%" at a slightly different one is unactionable.  
     *Tag:* **Negotiable**. Some argue vagueness is unresolvable and rules should reflect this instability; others demand robustness. For decision-making, stability is preferred but not absolute.  

  3. **Memory-Loss Consistency**  
     *Demand:* In the single undivided life case with memory erasure, the rule must assign the same credence about total episodes to the agent on each awakening, regardless of their subjective continuity.  
     *Motivation:* If the agent’s credence swings wildly (e.g., "I think there are 100 episodes" on first awakening but "10,000" on later ones despite identical information), decisions become incoherent.  
     *Tag:* **Non-negotiable**. Subjective identity must not affect beliefs; otherwise, the rule fails for cases of fission/fusion or amnesia.  

  4. **Finite Actionability Under Infinity**  
     *Demand:* The rule must output finite, comparable credences for hypotheses predicting finite populations even when competing hypotheses predict infinite or indefinite populations (e.g., cosmology cases).  
     *Motivation:* If a theory says "P(finite observers) = 0" whenever infinity is possible, it cannot inform decisions about real-world populations (e.g., "Will humans survive?").  
     *Tag:* **Camp preference (non-infinitarian)**. Infinitarians accept divergent credences, but for your purpose (e.g., existential risk), finite outputs are required.  

  5. **Indexical Grounding**  
     *Demand:* The rule must allow first-person evidence (e.g., "I exist now") to discriminate between hypotheses about total populations.  
     *Motivation:* In the cosmological case, if one theory predicts 10^60 observers and another 10^100, the rule must leverage the reasoner’s existence to shift credence meaningfully.  
     *Tag:* **Non-negotiable**. Without this, self-locating evidence is ignored, violating the core problem.  

  6. **Early-Observer Calibration**  
     *Demand:* The rule must not force extreme credence shifts based solely on ordinal position (e.g., "I am early, therefore Doomsday is imminent") without additional empirical constraints.  
     *Motivation:* In the "apparent earliness" case, a rule that mandates high P(Doom) solely from low birth rank ignores other evidence and leads to unstable decisions.  
     *Tag:* **Camp preference (anti-Doomsday)**. Proponents of the Doomsday Argument demand strong shifts; opponents see this as overreach. For your purpose, moderate shifts are acceptable, but not dogma.  

  7. **First-Person Aggregation Neutrality**  
     *Demand:* The rule must output credences for hypotheses without presupposing how utilities should be aggregated (e.g., per episode, per person, or per observer-copy).  
     *Motivation:* In the Sleeping Beauty case, the rule should not dictate whether Beauty should care about "per-awakening" or "per-life" outcomes. This separates belief from decision theory.  
     *Tag:* **Non-negotiable**. Bundling aggregation forces a decision rule, limiting flexibility; your purpose requires only beliefs.  

  8. **Observer-Counting Prior Agnosticism**  
     *Demand:* The rule must not require the prior over hypotheses to be proportional to predicted observer counts (i.e., it must not bake in self-indication).  
     *Motivation:* In the first-two-people case, if the prior favors large populations (e.g., P(large) ∝ N), it forces counterintuitive "likely no descendants" beliefs regardless of the update rule.  
     *Tag:* **Camp preference (pro-self-sampling)**. Self-indication advocates demand this; others see it as prior bias. For your purpose, the rule should be prior-agnostic to avoid double-counting.  

  9. **Rule-Prior Distinction (Meta-requirement)**  
     *Demand:* Constraints on observer-counting (e.g., "treat all observers equally") must be applied to the measure (how observers are sampled) or prior, not the self-locating update rule.  
     *Motivation:* In cosmology, complaints like "the universe with more observers is favored unfairly" often target the measure, not the rule. Misfiling leads to confused criticism (e.g., blaming SIA for prior issues).  
     *Tag:* **Non-negotiable**. The rule only updates on indexical data; measure/prior handles observer weighting.  

  10. **Decision-Rule Independence**  
      *Demand:* The theory must not bundle a decision rule (e.g., "maximize average utility"). It outputs credences only; decisions require separate aggregation (e.g., over temporal parts or copies).  
      *Motivation:* In Sleeping Beauty, credences inform but don’t dictate whether to pay $X for a bet per awakening. For your purpose, the rule must work with various decision theories (e.g., causal or evidential).  
      *Tag:* **Non-negotiable**. Bundling limits applicability; your cases (e.g., sorites) need modularity.  

  ---

  ### Conflicts and Trade-offs
  - **Key Conflict:** **Vagueness Robustness** (Requirement 2) clashes with **Actionable Output** (1) and **Finite Actionability Under Infinity** (4). Vagueness and infinity inherently resist precise probabilities. A rule satisfying 1 and 4 must "sweep vagueness/infinity under the rug" via approximations (e.g., conservative bounds or finite models), violating 2’s ideal of stability.  
  - **What to Abandon:** Drop **Vagueness Robustness** as strict stability. Accept that outputs may have ranges (e.g., "P(large population) = 10–30%") but remain usable. Loss: Decisions become sensitive to threshold choices, but this reflects epistemic limits.  
  - **Best Weakened Theory:** A **minimal update rule** (e.g., treat "I am an observer" as indexical data, normalize over hypotheses without favoring large populations) with **bounded measures** (e.g., cap observer counts at 10^150 to handle infinity). Handles all cases except sorites perfectly, which it approximates.  
  - **Most Exclusionary Requirement:** **Finite Actionability Under Infinity** (4) excludes popular cosmological measures (e.g., the Born rule in quantum cosmology) that assign zero probability to finite universes.  
  - **First Drop:** **Early-Observer Calibration** (6). It’s least central to your purpose and most entangled with specific arguments (Doomsday), not general decision-making.  

  ---

  ### Scoring Existing Rules
  **Scoring Key:**  
  ✓ = Satisfies, ✗ = Violates, ~ = Partially/contextually  
  | Requirement         | Self-Sampling (SSA) | Self-Indication (SIA) | No-Update Rule |
  |---------------------|---------------------|----------------------|---------------|
  | 1. Actionable Output | ✗ (fails with infinity) | ✓ | ✓ |
  | 2. Vagueness Robustness | ✗ (sensitive to boundaries) | ✗ (amplifies vagueness) | ✓ |
  | 3. Memory-Loss Consistency | ✓ | ✓ | ✓ |
  | 4. Finite Actionability | ✗ (if infinity possible) | ✗ (biases toward large N) | ✓ |
  | 5. Indexical Grounding | ✓ | ✓ | ✗ |
  | 6. Early-Observer Calibration | ~ (moderate shifts) | ✗ (over-shifts to large N) | ✗ (no shift) |
  | 7. Aggregation Neutrality | ✓ | ✓ | ✓ |
  | 8. Prior Agnosticism | ✓ | ✗ (bakes in N-weighted prior) | ✓ |
  | 9. Rule-Prior Distinction | ✓ | ✗ (conflates rule with measure) | ✓ |
  | 10. Decision Independence | ✓ | ✓ | ✓ |

  **Analysis:**  
  - **SSA** (e.g., "P(hypothesis) ∝ P(I exist | hypothesis)"): Fails on infinity/vagueness but handles indexical grounding and prior neutrality. Best for memory-loss cases but unworkable in cosmology.  
  - **SIA** (e.g., "P(hypothesis) ∝ P(I exist | hypothesis) × N"): Violates Prior Agnosticism (8) and Rule-Prior Distinction (9), making it prone to observer-counting paradoxes. Biased toward large populations, failing Early-Observer Calibration (6) and Finite Actionability (4).  
  - **No-Update Rule** (treat "I exist" as irrelevant): Fails Indexical Grounding (5), rendering it useless for your cases (e.g., cosmology or Doomsday).  
  - **Uncertain Agents**: If agents are uncertain which rule applies, they should:  
    a. Use a **meta-rule** (e.g., average credences over plausible rules, weighted by meta-credence).  
    b. **Default to SSA** for prior neutrality, adding bounds for infinity/vagueness. SIA’s biases make it risky for decision-making (e.g., overestimating future populations).  

  **Best for Your Purpose:** A **bounded SSA** (with finite measures) scores highest, satisfying non-negotiables except Vagueness Robustness. It is actionable, prior-agnostic, and indexically grounded, though vague boundaries require auxiliary methods (e.g., sensitivity analysis).  

  ---

  ### Summary
  The core tension is between precision (Requirements 1,4) and handling indeterminacy (2,3,6), resolved by weakening vagueness demands. The rule/prior distinction (9) clarifies that observer-counting issues belong to the measure, not the update. Decision rules (10) are independent. Bounded SSA best meets your needs, but agents should hedge rule uncertainty. This specification enables decision-making in your target cases while flagging where compromises are unavoidable.
