answer: |-
  ### Preamble: Constraining Criteria, Not Metaphysics
  This list constrains a **criterion for constitutive vehicles**—a test determining when an external resource is *part of a cognitive process or system*—not a metaphysics of cognition. Adjudicating whether interference with an artifact is intrusion on the *person* (like tampering with memory) or mere property damage requires answering: "Is this artifact *constitutively integrated* into the subject's cognitive architecture?" This demands operational criteria for "integration," not an account of what makes a process cognitive *in general*. A metaphysics (e.g., computationalism, enactivism) might underpin such criteria, but the target here is forensic: identifying when an external resource has the same moral/legal status as internal states.  

  *(Consequence: We avoid debates about "cognitive essence" but inherit the burden of defining "integration" non-arbitrarily. The skull/skin boundary may lack intrinsic significance, but institutional needs may force us to treat it as a proxy.)*

  ---

  ### Desiderata for a Criterion of Cognitive Constitution  
  *(Refined cases; all non-negotiable for adjudication)*  

  1. **Temporal Transparency**  
     - (a) *Statement*: The resource must operate at timescales that do not disrupt the subject’s cognitive flow.  
     - (b) *Case*: **Latency**—A memory-aid app takes 30 seconds to retrieve facts, forcing the subject to pause conversation. Her cognition adapts (e.g., she plans queries during delays), but the delay reshapes thought.  
     - (c) *Rules out*: Counting any reliable tool as constitutive (e.g., a library). Integration requires seamless temporal coupling.  
     - (d) *Status*: Non-negotiable. Delays that restructure cognition break constitutive unity.  

  2. **Asymmetric Dependence**  
     - (a) *Statement*: The subject’s access must be consistently prioritized over other agents, and the resource’s function must depend on the subject’s goals.  
     - (b) *Case*: **Shared custody**—A couple’s shared photo archive is automatically consulted by both. Each trusts it over biological memory, but edits by one alter the other’s recollections.  
     - (c) *Rules out*: Treating shared resources as "group minds" or implying cognitive merger. Personal constitution requires individual-centric control.  
     - (d) *Status*: Non-negotiable. Adjudication demands assigning intrusion to *one* subject.  

  3. **Subjective Opacity**  
     - (a) *Statement*: The resource can constitutively support cognition even if its internal operations are inaccessible or unintelligible to the subject.  
     - (b) *Case*: **Opaque drift**—A recommender algorithm surfaces memories in a social media feed. The user trusts and uses these "memories" automatically but cannot audit the algorithm.  
     - (c) *Rules out*: Views requiring understanding or endorsement (e.g., "personal-level access"). Cognitive reliance often bypasses awareness.  
     - (d) *Status*: Non-negotiable. Rejects internalist demands for transparency.  

  4. **Functional Indispensability**  
     - (a) *Statement*: The resource must be persistently relied upon for cognitive tasks the subject cannot reliably perform without it.  
     - (b) *Case*: **Unendorsed prosthesis**—A court-mandated sobriety monitor becomes the subject’s sole method for tracking alcohol intake. She uses it automatically but resents it and would remove it if possible.  
     - (c) *Rules out*: Requiring consent or endorsement. What matters is *de facto* reliance, not attitude.  
     - (d) *Status*: Non-negotiable. Adjudication hinges on operational dependence, not preference.  

  5. **Manipulation Sensitivity**  
     - (a) *Statement*: Unnoticed alterations to the resource must produce corresponding changes in the subject’s cognition or behavior.  
     - (b) *Case*: **Silent substitution**—A note-taking app is swapped for one with biased auto-complete. The subject’s decisions gradually shift (e.g., toward specific brands), but she detects no change in the device.  
     - (c) *Rules out*: Treating external resources as mere inputs. Constitutive vehicles affect cognition *directly*, not via perception.  
     - (d) *Status*: Non-negotiable. Distinguishes mind-editing from environment-editing.  

  6. **Dispositional Activation**  
     - (a) *Statement*: The resource must be poised for immediate use, even if unused.  
     - (b) *Case*: **Standby redundancy**—A phone backs up all childhood memories. The subject never consults it because biological recall suffices, but it remains instantly available.  
     - (c) *Rules out*: Requiring active use. Unaccessed but ready resources can be constitutive (like dormant memories).  
     - (d) *Status*: Non-negotiable. Matches how we treat biological capacities.  

  7. **Personal Glue**  
     - (a) *Statement*: The resource must be tailored to or shaped by the subject’s idiosyncratic cognitive history.  
     - (b) *Case*: **Public infrastructure**—A wall map in a train station is universally accessible and reliable but carries no user-specific trust or customization.  
     - (c) *Rules out*: Counting generic tools (e.g., clocks) as constitutive. Personal integration requires individual "coupling history."  
     - (d) *Status*: Non-negotiable. Prevents overextension to public artifacts.  

  8. **Phenomenal Irrelevance**  
     - (a) *Statement*: Degradation of the resource must impair cognitive performance *without* subjective error signals (e.g., felt effort or noticed mistakes).  
     - (b) *Case*: **Degradation without phenomenology**—A cloud-synced memory aid corrupts data slowly. The subject’s judgments grow incoherent (e.g., conflicting dates in plans), but she feels no strain or doubt.  
     - (c) *Rules out*: Views tying constitution to conscious monitoring. Integrated systems fail "silently," like biological faculties.  
     - (d) *Status*: Non-negotiable. Aligns with how we judge internal cognitive damage.  

  ---

  ### Explicit Analysis  
  1. **Incompatible Triad**:  
     - *Temporal Transparency* (requires seamless timing) + *Asymmetric Dependence* (requires individual control) + *Subjective Opacity* (allows ignorance of operations) **cannot be jointly satisfied** with a non-question-begging criterion. Example: **Opaque drift** involves seamless, automatic use (satisfying Transparency and Opacity) but violates Asymmetric Dependence if algorithms serve corporate goals. This forces either:  
       - Question-begging (privileging the skull/skin), or  
       - Accepting that cognition can extend in ways that dissolve personal boundaries (e.g., shared custody).  
     - Shared resources (**Shared custody**) *are* incompatible with "one mind per subject" if Asymmetric Dependence is relaxed—but adjudication *requires* assigning intrusion to individuals.  

  2. **Most Exclusionary Requirement**:  
     - **Phenomenal Irrelevance** does the heaviest lifting. It excludes:  
       - Internalism (which ties cognition to conscious access),  
       - Enactive views (which emphasize felt agency),  
       - And weak functionalism (which allows tools with *any* reliable effects).  
       *Why this over others?* It directly tests whether the resource fails *as biological systems do*—without subjective cues—making it uniquely forensic. Silent degradation reveals integration where endorsement or phenomenology cannot.  

  3. **Compressed Scorecard**:  
     - **Extended/Parity View**: Excels on Latency/Standby; flunks Shared Custody (over-includes) and Personal Glue (undercuts individuality).  
     - **Internalism (Embedded Included)**: Aces Personal Glue/Asymmetry; fails catastrophically on Degradation/Opacity (over-excludes).  
     - **Functionalist (Vehicle-Neutral)**: Handles Opacity/Indispensability; rejected by Glue/Manipulation (washes out personal boundaries).  
     - **Enactive/Mark-of-Cognitive**: Strong on Temporal Transparency; dead on arrival for Opacity/Phenomenal Irrelevance (over-prioritizes agency).  

  **Final Note**: This target *distorts taxonomy*. The best metaphysics of cognition need not resolve personhood for institutions—e.g., a distributed system might be cognitive yet lack a "subject" to intrude upon. But for *adjudication*, we must force constitutive criteria to preserve individual accountability, even if it biases against radical extension.
