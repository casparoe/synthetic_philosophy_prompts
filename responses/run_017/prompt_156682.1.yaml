answer: |-
  Your analysis astutely identifies the philosophical tensions within U.S. labor law. The regime reflects an unstable compromise between **pluralist bargaining theory** (emphasizing collective stability) and **classical liberal individualism** (emphasizing consent and fault), with neither fully prevailing. Here’s a reconstruction:

  ### Core Philosophical Tensions
  1. **Collective Status Elements** (Pluralist Foundations):  
     - *Exclusive representation by majority vote* presupposes that workplaces are unitary bargaining units where collective action efficiency outweighs individual dissent. This aligns with **pluralism** (following H.A. Clegg/Sidney Webb): stable labor relations require a single voice to balance employer power.  
     - *Binding contracts for all* treat the union as a sovereign-like entity within the unit, akin to a "mini-democracy."  

  2. **Individual Consent/Fault Elements** (Liberal Foundations):  
     - *Right-to-work rules* reflect classical liberalism: no compelled association/subsidy without consent (Lockean self-ownership).  
     - *No permanent replacement for ULP strikers* ties job protection to employer fault, mirroring tort principles.  
     - *Ban on secondary pressure* protects neutral parties from coercion, emphasizing individual responsibility ("common law" neutrality).  

  3. **Permanent Replacement for Economic Strikers**:  
     - **Presupposes strikes are economic contests**, not inviolable rights. The doctrine (from *Mackay Radio*, 1938) treats strikes as a **liberty** whose costs (job loss) are legitimately settled by market endurance. Calling it a "right" is hollow because:  
       - No remedy for replacement (unlike ULP strikes).  
       - It prioritizes employer property rights and market dynamics over worker security.  
     - A *meaningful right to strike* would require reinstatement guarantees (as in many democracies), but U.S. law elevates managerial prerogative and economic bargaining power.  

  ### Underdetermined Doctrine
  - **Exclusive representation + right-to-work**: Logically incompatible (why bind dissenters to a contract if they need not fund it?), but politically sustained. Pluralism accepts this as a pragmatic trade-off; liberalism sees it as incoherent.  
  - **Duty of fair representation**: Fits both theories weakly—pluralism (collective obligation) and liberalism (protection from arbitrary coercion).  

  ### Testing the Variant: Proportional Representation
  In a regime with **multiple unions**, **no binding of non-members**, and **fluid membership**:  
  1. **Permanent replacement rule could stand unchanged**:  
     - If strikes remain economic contests (endurance tests), replacement stays coherent. Individual unions striking wouldn’t alter the employer’s property rights.  

  2. **Ban on secondary pressure would weaken or collapse**:  
     - **Why?** The ban presupposes a **defined bargaining unit** and **employer-specific disputes**. If multiple unions exist:  
       - "Neutral" employers become harder to define (e.g., if a supplier employs unit members).  
       - Fault-based logic erodes: pressure on "neutrals" could be recharacterized as direct action (e.g., if workers at Supplier Co. share a union with workers at Target Co.).  
     - Pluralism’s stability argument for shielding third parties dissolves without exclusive units.  

  ### Which Half Does the Work?
  - **The collective status framework is foundational**:  
    - Without exclusive representation/bargaining units, key features (binding contracts, secondary pressure bans) lose justification.  
    - Individual protections (right-to-work, ULP reinstatement) are *limitations* grafted onto a collectivist structure, not core principles.  

  ### Conclusion
  The law is **pluralism with liberal constraints**, not a philosophically unified system:  
  - **Pluralism** explains the structure (collective bargaining as countervailing power).  
  - **Liberalism** explains the opt-outs (right-to-work, fault-based job protection).  
  - **Permanent replacement** epitomizes the unresolved conflict: it treats labor as a commodity (liberal market logic) within a system that nominally empowers collective labor (pluralism).  

  The variant regime would force a shift toward liberalism: secondary pressure bans become unsustainable without exclusive units, while replacement rules could persist under market logic. The incoherence arises because U.S. labor law is a hybrid—born of political compromise, not philosophical consistency.
