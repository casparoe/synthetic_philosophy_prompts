prompt: |-
  I'm in a philosophy of psychiatry reading group (about half clinicians, two philosophers, me somewhere in between) and we did Hacking's "looping effects of human kinds" paper a few weeks back, and I've been arguing about it with a friend who's a clinical psychologist ever since. Her line is that looping effects just make psychiatric kinds *moving targets*: annoying if you want stable prevalence estimates over time or a clean replication of an old study, but not a deep threat to validity, because you can in principle re-validate your instruments each time the kind drifts. My hunch is that something worse is going on with at least some categories — that the feedback doesn't merely move the target but is partly constitutive of what it is to be an instance of the kind, so that for those categories there's no target sitting there, independent of the classification, for the criteria to be more or less accurate about. But I can't get the two ideas apart cleanly, and I suspect I'm conflating "the extension keeps changing" with "there's no fact of the matter about the boundary."

  So: explain the conceptual difference I'm groping at. Specifically, I want to understand what's at stake in the step from *instability* (the set of people who fall under the category, or how they present, shifts in response to the classification) to something like *co-constitution* (what it is to be an instance of the category is itself partly shaped by the classification, so that talk of the "real" prevalence or of the criteria carving nature at the joints stops having a clear sense). Is that second claim actually distinct from the first, or does it collapse back into it once you're careful? And does it matter for this that looping seems to work through at least three seperate channels — people's presentations changing, who shows up in the clinic and how they describe themselves, and the experts' own concepts revisions feeding back into the next edition of the manual — or is one of those doing all the real work? Hacking's own examples (child abuse, homosexuality, teenage pregnancy, multiple personality) are all ones where the kind is picked out by self-report and social description, and I can't tell how much of his argument is supposed to carry over when the criteria are defintately not self-report-based.

  Here's the bit where I need the most help, and where my friend and I invented our own vocabulary, so don't expect these terms to be standard. She proposed what she calls "sealed criteria": define a category only over signals the subject can't introspect and can't steer — actigraphy-measured sleep fragmentation, inflammatory markers, speech-timing features — on the grounds that if there's no channel from the classification back to the measurement, there's no loop. I pointed out that the loop just relocates instead of vanishing: people titrate their behaviour to hit the marker (all-nighters before the actigraphy week, stimulants, deliberate sleep restriction) and clinicians' thresholds drift as the measured distribution shifts, so you've moved the feedback one level out rather than removed it. Her fallback was a "naivety clause": the diagnosis requires that the presentation not be substantially shaped by the subject's own knowledge of the category. I think that's either incoherent or much more committal than it looks — it seems to presuppose a presentation that the classification hasn't touched, i.e. exactly the pre-classificatory target whose existence was the thing in dispute — but I can't say exactly why, or whether the incoherence is fatal or just makes the clause a rough practical heuristic. There's also what I've started calling "loop-aversion": people who've read about looping and medicalization deliberately avoid the label, which changes presentations again in the opposite direction, and I don't know whether to treat that as a further order of the same effect or as something that could in principle settle the kind down. Please say which of these, if any, is a stable resting point, and what it would mean for a category to explicitly build its own looping into its criteria (a criterion that predicts and expects presentations to be shaped by diagnostic awareness) — is that self-fulfilling, self-defeating, or just honest? Lead with your bottom line in the very first sentence — the actual claim about what looping effects do and don't threaten — then give me the reasoning under it; no preamble and don't restate my question back at me.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a philosophy of psychiatry reading group and have been discussing Hacking's looping effects with a clinical psychologist friend. The core debate is whether looping effects merely make psychiatric kinds moving targets or if they co-constitute the kind itself. The user feels there's a deeper threat to validity but struggles to articulate the difference between instability and co-constitution.

  First, I need to clarify the conceptual distinction. Instability means the extension changes over time—like prevalence rates or symptom presentations shifting. Co-constitution, however, suggests that the kind's essence is shaped by the classification. For example, the criteria for ADHD aren't just tracking a pre-existing condition; the diagnosis itself changes behaviors and self-perception, altering what ADHD is. Hacking’s examples like multiple personality disorder show how the category evolves through feedback loops, making it impossible to separate the "true" kind from the classification.

  The user’s friend proposes "sealed criteria" using biomarkers to avoid looping. But the assistant points out that behavior titration and clinician threshold drift still create feedback, just relocated. Then the "naivety clause" requiring no knowledge of the category seems circular—it assumes a pre-classificatory state that doesn’t exist. Loop-aversion, where people avoid labels, adds another layer, showing looping isn't eliminable.

  The user’s deeper need might be to validate their intuition that looping undermines psychiatric validity more fundamentally. They want arguments to counter their friend's pragmatic view. Also, they might seek practical implications for diagnosis—how to handle categories when looping is inherent. The assistant’s response addresses this by emphasizing that looping challenges the epistemic objectivity of psychiatric kinds, not just operational inconveniences. Building looping into criteria could be honest but doesn't resolve the ontological issue. The key takeaway: co-constitution means no fixed target exists, threatening the validity framework itself.
answer: |-
  **Bottom line:** Looping effects threaten not merely the *stability* of psychiatric kinds but their *epistemic objectivity* – the idea that criteria track a pre-existing, classification-independent "joint" in nature – because the kind's defining features are partially constituted by the classificatory system itself and the responses it elicits, meaning there is no stable, mind-independent target *to* track accurately over time, even with re-validation.

  **Reasoning:**

  1.  **Instability vs. Co-constitution: The Crucial Distinction:**
      *   **Instability:** The *extension* (the set of people who fall under the category) or the *manifestations* (how they present) change over time *in response to* the classification. The *nature* of the kind itself (what it *is* to be an instance) is assumed to be relatively fixed, albeit hard to measure consistently due to shifting presentations. Re-validation aims to re-align the criteria with this underlying, stable reality. ("The target moved; we need to re-zero the scope.").
      *   **Co-constitution:** The classificatory act (diagnostic criteria, labels, cultural narratives, expert revisions, individual self-understanding) doesn't just reveal or measure a pre-existing kind; it actively *shapes* the very phenomena that *define* the kind. The "joint" isn't found *and then* labeled; the labeling process itself helps *create* the joint through feedback loops. What it *is* to be (e.g.) "ADHD" in 2023 is fundamentally different from what it was in 1983, not just because we measure better, but because the concept, its social meaning, available treatments, individual identity formation, and expert understanding have all co-evolved. ("There *is* no fixed target independent of the process of targeting; the scope and the target are being forged together.").

  2.  **Why Co-constitution is Distinct and More Threatening:**
      *   **"Real Prevalence" Loses Clear Meaning:** If the kind's defining features are shaped by the classification, asking for the "true" prevalence *before* classification is incoherent. The classification helps determine what counts as an instance. Prevalence becomes inherently historical and context-dependent.
      *   **"Carving Nature at the Joints" Becomes Problematic:** This metaphor assumes nature has pre-existing joints. Co-constitution suggests that for looping kinds, the "joint" emerges *through* the interactive process of classification and human response. The validity of the criteria isn't about accuracy to a pre-existing structure, but about their role within a dynamic, self-reinforcing (or self-undermining) system.
      *   **Collapse Avoided:** While instability is a *symptom* of co-constitution, they are not identical. You could theoretically have unstable extensions due to measurement error or environmental shifts *without* co-constitution (e.g., a rare genetic disorder's prevalence fluctuating due to migration). Co-constitution *explains* a specific, pervasive type of instability driven by the meaning and consequences of the classification itself. Instability alone doesn't entail that the kind lacks an independent essence; co-constitution does.

  3.  **Channels of Looping Matter Collectively:**
      *   All three channels you mention (changes in presentation/identity, changes in clinic population/self-description, expert concept revision) are crucial and interconnected. Focusing on just one misses the systemic nature of looping.
      *   **Self-report is Not Essential:** While Hacking's vivid examples often involve identity and narrative, the core mechanism – classificatory feedback altering the phenomena classified – applies more broadly.
      *   **Example without Self-Report:** Consider a diagnosis defined purely by observed "disorganized behavior." Once the criteria are known, families, teachers, or institutions might consciously or unconsciously shape environments to suppress or elicit these behaviors to avoid or secure the diagnosis/resources. Clinicians' perception of "disorganization" shifts based on changing norms and expectations influenced by the diagnostic concept's prevalence and cultural understanding. The *meaning* and *expression* of "disorganized behavior" as a pathological sign are altered by the diagnostic system itself.

  4.  **Addressing the "Solutions":**
      *   **Sealed Criteria (Biomarkers):** Fails. As you note, feedback relocates:
          *   **Behavioral Titration:** Subjects *can* manipulate biomarkers (e.g., sleep before actigraphy, drug use affecting markers, stress behaviors altering inflammation). Clinicians also interpret biomarker *ranges* based on shifting norms and expectations influenced by the diagnostic concept's prevalence (itself affected by prior diagnoses!). The biomarker becomes a new site for looping, not an escape.
      *   **Naivety Clause:** **Incoherent in principle.** It presupposes precisely what co-constitution denies: a stable, classification-independent "presentation" that can be accessed. How could you *know* if a presentation is "substantially shaped" without already having access to the unshaped state? It requires judging the influence of concept X on presentation Y, but if X co-constitutes Y, you cannot isolate Y from X. It's either circular or relies on an untenable ideal of pre-linguistic/conceptual purity regarding mental states/behaviors. It might function as a *pragmatic heuristic* in specific contexts, but it doesn't resolve the ontological/epistemic problem.
      *   **Loop-Aversion:** This is a *manifestation* of higher-order looping, not a stabilization mechanism. It demonstrates how awareness of the classification and its consequences (medicalization, stigma) *itself* becomes a factor shaping behavior and identity, further altering the phenomena. It reinforces co-constitution, showing the concept's power to shape responses in *multiple* directions (attraction to *and* aversion from the label).

  5.  **Building Looping In:**
      *   Explicitly incorporating the expectation that diagnostic awareness shapes presentation (e.g., "Criterion F: Symptoms are influenced by the patient's understanding of Disorder X") is **honest pragmatism**, not a solution to co-constitution.
      *   **Why?** It acknowledges the reality of looping but doesn't restore epistemic objectivity or a pre-existing joint. It simply folds the looping effect *into* the diagnostic criteria itself, making the criteria explicitly reflexive. It accepts that the kind is inherently interactive and context-dependent. Whether this is self-fulfilling or self-defeating depends on the specific criterion and its consequences. It makes the diagnostic process more realistic about its own effects but doesn't negate the fundamental challenge looping poses to traditional notions of validity based on tracking mind-independent kinds.

  **In essence:** Looping effects reveal that for many psychiatric kinds, the classification isn't just describing a pre-existing reality; it's participating in *creating* the reality it describes. This co-constitution means there is no fixed, mind-independent "joint" for criteria to accurately track over time, fundamentally challenging the validity framework that assumes such a joint exists and can be re-tracked after drift. The proposed "solutions" either relocate the loop, presuppose the very pre-classificatory state in question, or pragmatically acknowledge the loop without resolving its epistemic threat. The instability is evidence of a deeper ontological and epistemic entanglement.
