prompt: |-
  you are a decision theorist who's taught rational choice to grad students something like a dozen times, and you're unusually good at spotting the exact point where peoples intutions go off the rails. Please brainstorm for a bit in bullet points before you commit to anything, and think carefully about the *dependency structure* — what has to be in place before what — rather than just dumping the textbook proof at me.

  I've got a 50-minute slot next week with about fifteen first-year public-policy masters students. They've had exactly one lecture on expected utility: they can read a decision tree, compute an expected value, and they've seen Bayes' rule once but they're shaky on it. They have never seen a value-of-information calculation. Most of them arrive thinking "more information is good, obvs," and at least a couple arrive thinking "but I'd actively not want to know my genetic risk score, so isn't that a counterexample?" I need them to come out actually getting Good's theorem — the result that for an expected-utility maximizer, an extra piece of free information has non-negative expected value, i.e. you can't, from the ex ante standpoint, be made worse off by being handed the option to look — and I need them to get *why* it holds and *where it breaks*. Don't explain the theorem to me and please don't give me a reading list; plan how I should teach it.

  1. The order the pieces have to go in, and what depends on what. My current instinct is: small acts/states table with a prior → value of acting now → "now suppose a signal arrives first" → the convexity bit (max of a mixture is at least the mixture of the maxes) → the punchline that the value is zero unless the signal can actually flip your act. But I keep going back and forth on whether the flipping point should come before the convexity point as the intuition, with convexity as the proof afterwards. Argue for an ordering and tell me what breaks if I do it the other way.

  2. One example to carry the whole session. I was thinking umbrella + weather forecast, because with two acts and two states I can draw the value of information as a function of the prior and it's that tent-shaped curve — zero near the ends, kinked, peaking right at the indifference prior. Tell me what the example has to have and what it has to lack. I'm worried a *perfect* forecast short-circuits the "how good does the information have to be" question, and I don't want any cost of acting, any repeated-play element, or anything strategic in the base case.

  3. The misconceptions, in the order they'll actually form them, and where in my sequence to defuse each. The ones I expect: "the theorem says you won't regret looking" (the ex ante / ex post slide); "the value of information is just how likely it is to change my mind"; "a more accurate test is always worth more"; conflating "I'd be better off if the world were a certain way" with "I'd be better off knowing which way it is"; and "free information is free, so there's never a reason not to look," which ignores that the act of finding out can perturb the world (asking your manager whether you're being made redundant makes it more likely; the diagnostic procedure itself has a complication risk). Which of these is the actually dangerous one — the one that'll silently corrupt their later work — and what am I missing from the list?

  4. Two failure cases I want to close on, and I need help sequencing them. (a) An agent who updates wrong in a particular way: she acts as if the likelihood ratio were raised to the power 1.5, so she over-reacts to signals. For her, more information can be actively harmful and she'd pay to stay ignorant. (b) An agent whose utility depends on her own credence — she likes suspense, or she hates the anxiety of knowing. Are these the same kind of failure of the theorem's assumptions, or structurally different failures? Which one first? And can I reuse the umbrella numbers from item 2 to make (a) concrete rather than hand-wavy?

  5. One question I can put on the board at the end that tells me whether they got the theorem rather than just the arithmetic — something that separates a student who's internalised "ex ante, about the option to look, for an expected-utility maximizer" from one who's internalised "information is good."

  6. What I should openly refuse to explain in fifty minutes, and say out loud that I'm skipping.
reasoning: |-
  Okay, I'm a decision theorist planning a 50-minute session for first-year public policy students. They've had one lecture on expected utility, can compute expected values, and are shaky on Bayes' rule. Their intuitions are that more information is obviously good, but some think of counterexamples like not wanting genetic risk scores. I need them to understand Good's theorem: that free information has non-negative expected value for an expected-utility maximizer.

  First, I need to brainstorm the dependency structure. The key concept is that the expected value of information (EVI) is non-negative. The theorem relies on the agent being an expected-utility maximizer and the information being free and not affecting the world. The proof involves the convexity of the max operator: the max of a mixture is at least the mixture of the maxes. But I need to sequence this so students build intuition step by step.

  I'll use a simple example: deciding whether to carry an umbrella based on the weather. Two states: rain or no rain. Two acts: carry umbrella or not. Prior probability of rain is p. Utilities: if it rains and no umbrella, you get wet (utility 0); if you carry an umbrella and it rains, you're dry but inconvenienced (utility 4); if no rain and no umbrella, you're fine (utility 10); if no rain with umbrella, you're inconvenienced for no reason (utility 4). This creates a tent-shaped EVI curve.

  Now, the sequence of teaching points:
  1. Start with acting without information: compute expected utility of each act and choose the best one. For prior p, if p > 0.6 (indifference point), carry umbrella; else don't.
  2. Introduce a free signal, like a weather forecast. Show that after seeing the signal, you can update your belief using Bayes' rule and choose the best act given the posterior.
  3. EVI is the difference between the expected utility with the signal (averaged over possible signals) and the expected utility without it. This must be non-negative because with the signal, you can always ignore it and get the same utility as without, or do better by acting on it.
  4. The convexity insight: the value function V(p) = max over acts of expected utility at p is convex. Adding information gives you a mixture of posteriors, and the max over the mixture is at least the mixture of the maxes. This is the mathematical reason EVI ≥ 0.
  5. Show that EVI is zero when the signal doesn't change your decision - near the ends of the prior where you'd do the same thing regardless. It peaks at the indifference point where the signal is most likely to change your mind.
  6. Then address misconceptions. The dangerous one is conflating ex ante and ex post: ex ante, you expect not to regret looking, but ex post, you might regret knowing if the information makes you choose something that turns out worse. But on average, it's better to have the information.
  7. Failure cases: first, an agent who updates incorrectly (e.g., over-reacts to signals). For her, more information can be harmful. Use the same umbrella numbers: if she over-updates, she might switch actions when she shouldn't, lowering her expected utility. Second, an agent with utility depending on beliefs (e.g., likes suspense). These are different failures: the first violates rational updating (a theorem assumption), the second violates state-independent utility.
  8. End with a question: "If an agent says 'I'd rather not know which disease I have because I'd obsess over it,' does this violate Good's theorem? Why?" This tests understanding of the assumptions.
  9. Skip: formal proof of convexity, multiple signals, continuous cases, and strategic aspects. Focus on core intuition.

  I'll structure the session to build intuition before the math, using the umbrella example throughout to make it concrete. Defuse misconceptions as they arise, especially the ex ante/ex post distinction. Use the failure cases to highlight assumptions. The key is that students grasp that for a rational agent, free information can't hurt on average, but it might not help if it doesn't change decisions, and violations occur when rationality assumptions break.
answer: |-
  Here’s a structured teaching plan based on dependency, targeting intuition gaps. The core logic chain: **prior → acts without info → info as a "choice-decision shaper" → convexity as the why → EVI ≥ 0 → limits and failures**. Deviating from this order risks conflating ex ante/ex post or missing why convexity *forces* the result.

  ### 1. **Order of Concepts (Dependency Argued)**
     - **Start: Simple decision without info**  
       *Why first?* Anchors the baseline. Use 2 states (e.g., Rain/No Rain), 2 acts (Umbrella/No Umbrella), prior P(Rain) = p. Compute EU of each act → optimal act for given p.
     - **Then: Value of acting NOW (without info)**  
       Define V(p) = max{EU(act)} at p. For umbrella, V(p) is piecewise linear (tent-shaped: flat when one act dominates, kinked at indifference p*).  
       *Dependency:* Must see V(p) *before* introducing info to appreciate the "before" state.
     - **Next: Free signal arrives (e.g., imperfect forecast)**  
       Signal has likelihoods (P("Rain"|Rain), etc.). Show:  
       - You observe signal → update to posterior via Bayes (brief recap).  
       - *Then* choose best act given posterior → get EU | signal.  
       - Ex ante EU *with* info = average of EU | signal over signals.  
       *Dependency:* Updating must follow observing the signal but precede choosing the act. *Don’t* compute EVI yet—just show the new "decision flow."
     - **Convexity intuition BEFORE EVI formula**  
       *Crucial juncture:* Draw V(p). Pick two posteriors (e.g., after "Rain" or "No Rain" forecast). Show:  
       - EU *with* info = weighted avg of V(posteriors) [since you max at each posterior].  
       - V(prior) = V(weighted avg of posteriors) → but V is convex → V(avg) ≤ avg of V.  
       *Why here?* Convexity is the *engine*. If you jump to "EVI = avg V(posterior) - V(prior)" first, students see it as algebra, not geometry. The inequality (≤) *is* EVI ≥ 0.  
       *Danger of swapping:* If "flipping acts" comes first, students fixate on "info is good only if it changes my mind," missing why EVI ≥ 0 *even if it never flips your act* (e.g., if you ignore the signal, you get same EU as no info).
     - **Punchline: EVI ≥ 0**  
       EVI = [avg V(posterior)] - V(prior) ≥ 0 by convexity. Stress:  
       - You can always ignore the signal → EVI ≥ 0.  
       - EVI > 0 iff the signal *might* change your decision (peaks at p*).
     - **Only then: Ex ante vs. ex post**  
       Clarify: Ex ante, you expect not to regret looking. Ex post, you might regret (e.g., you see "Rain", carry umbrella, but no rain → regret not ignoring). But ex ante, it was still worth it.

  ### 2. **The Umbrella Example: Why It Works & Tweaks**
     - **Must-haves:**  
       - 2 states, 2 acts (visual symmetry).  
       - Indifference prior p* (e.g., p* = 0.4 if U(umbrella, rain)=4, U(no umbrella, no rain)=10, etc.).  
       - An *imperfect* signal (e.g., 80% accurate forecast). *Avoid perfection:* It hides that EVI depends on signal quality and prior. With perfect info, EVI is always positive unless p=0/1.  
     - **Must-lack:**  
       - No action costs (e.g., buying the forecast isn’t the point).  
       - No causal effects (info doesn’t change states).  
       - No repeated play (avoids "exploration" confusion).  
     - **Tweak for realism:** Use P(Rain) = 0.3, forecast accuracy = 70%. Compute:  
       - EU without info: max{ EU(umbrella), EU(no umbrella) } → say, no umbrella.  
       - With forecast: If "Rain", posterior P(Rain|"Rain") ≈ 0.55 → carry umbrella. If "No Rain", posterior ≈ 0.16 → no umbrella.  
       - EVI = [P("Rain") * V(0.55) + P("No Rain") * V(0.16)] - V(0.3) > 0.  
     - **Visual:** Plot V(p) and show posteriors bracketing p=0.3 → avg V(posteriors) > V(prior).

  ### 3. **Misconceptions: Order & Defense**
     **Sequence they’ll arise (and when to kill them):**  
     1. **During signal introduction:** "EVI is just how likely the signal is to change my mind."  
        *Defuse when computing EVI:* Show EVI also depends on *how much better* the new decision is (e.g., if forecast changes your act at p=0.3, the EU gain is small; at p*, it’s large).  
     2. **After EVI ≥ 0 proof:** "But I’d regret looking if I get bad news and it rains!"  
        *Defuse with ex ante/ex post*: "Yes, ex post regret happens, but ex ante you’d still take the bet. Good’s theorem is about the choice *to look* beforehand."  
     3. **Dangerous one:** **"A more accurate test is always worth more."**  
        *Silently corrupts:* They’ll misapply VOI in policy (e.g., assume better medical tests always justify cost). *Defuse after umbrella EVI calc:* Show that if p is extreme (e.g., p=0.05), even a perfect test has EVI≈0 — it can’t improve your already-optimal decision.  
     4. **Genetic risk example:** "I wouldn’t want to know!" → conflating utility from states vs. knowledge. *Defuse during failure cases:* This is *not* a counterexample if anxiety violates state-independent utility (covered later).  
     **Missing misconception:** "If information is free, always get it." (Ignores perturbation — address in "what we skip").

  ### 4. **Failure Cases: Sequencing & Umbrella Reuse**
     - **First: Incorrect updating (reuse umbrella!)**  
       - Agent over-reacts: After signal, posterior ∝ (likelihood)^1.5.  
       - Use umbrella: Prior p=0.3, signal "Rain" (true P("Rain"|Rain)=0.8). Correct posterior P(Rain|"Rain")≈0.55 → optimal: carry umbrella.  
         *But* agent uses P(Rain|"Rain") ∝ (0.8)^1.5 ≈ 0.72 → carries umbrella *even when suboptimal* (e.g., if "Rain" on a low-p day).  
       - EVI calculation: avg V_agent(posterior) < V(prior) → EVI < 0.  
       *Why first?* It’s a direct failure of EU rationality (updating violates Bayes).  
     - **Second: Utility depends on belief (e.g., suspense)**  
       - E.g., U(act, state, belief) = base utility - anxiety * variance(belief).  
       - *Structurally different:* Violates state-independence (core to EU theory).  
       *Sequence after:* Contrasts "rational agent with wrong beliefs" vs. "non-EU agent".  
     - **Key distinction:** (a) is "rational given beliefs, but beliefs are wrong"; (b) is "not maximizing EU over states".

  ### 5. **Closing Question to Test Understanding**
     **Put this on the board:**  
     *"An EU-maximizing policymaker says: 'I won't survey public opinion because if I learn voters oppose my policy, I'd feel pressured to change it, and I think that's wrong.' Does this violate Good’s theorem? Why?"*  
     - **Why it works:**  
       - Correct answer: **Yes, it violates.** The theorem says the *option* to learn has EVI ≥ 0. Avoiding knowledge due to anticipated irrationality (changing acts against your own beliefs) violates EU.  
       - Distinguishes: Students who internalized "ex ante, option to look" see the error. Those who think "info isn’t always good" miss that the aversion here stems from *self-doubt*, not the theorem failing.

  ### 6. **Openly Skip & State Why**
     - **"We skip information that perturbs the world** (e.g., genetic testing risks, surveys influencing behavior). Good’s theorem assumes ‘costless, belief-only’ info."  
     - **"We skip costly information** — today is about why *free* info has non-negative value."  
     - **"We skip repeated decisions** (e.g., exploration vs. exploitation). That’s rational learning over time, not one-shot VOI."  
     - **"We don’t derive convexity rigorously** — we showed the picture. Take Advanced Micro for the proof!"  

  ---

  **Session Flow (50-min clock):**  
  - (5 min) Umbrella without info → V(p)  
  - (10 min) Add forecast: posteriors, EU with signal  
  - (10 min) Convexity intuition → EVI ≥ 0 proof (geometric)  
  - (5 min) Compute umbrella EVI, show tent shape  
  - (7 min) Misconceptions: ex ante/ex post, accuracy ≠ value  
  - (8 min) Failure cases: Umbrella over-reaction → suspense  
  - (4 min) Closing question + skip list  
  - (1 min) "Next time: When is EVI zero? And costly information."  

  **Why this works:** Builds from decisions they know, makes convexity visual, confronts intuitions *as they arise*, and uses one example end-to-end. The genetic risk "counterexample" becomes a hook for failure cases, not a distraction.
