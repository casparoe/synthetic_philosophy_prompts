answer: |-
  ### (1) Genuinely Implied by the 1929 Footnote and Surrounding Commitments  
  The footnote explicitly confines the "Ramsey Test" to contexts where *p* is epistemically open: both parties are "in doubt as to *p*." Adding *p* hypothetically is an operation on their *current* stock of knowledge to resolve uncertainty about *q*. When *p* is discovered false, the degrees of belief conditional on *p* are "rendered void" – they lose their normative force as guides to belief or action. When *¬p* is certain, the conditional collapses into a question about logical/hypothetical derivation from laws.  

  Ramsey’s broader commitments reinforce this narrow scope:  
  - **Probability as degree of belief**: His subjective probability (e.g., in "Truth and Probability") is tied to *actual* epistemic states. Hypotheticals about known falsehoods lack grounding in current beliefs.  
  - **Laws as inference rules**: Variable hypotheticals (laws) are not truth-apt propositions but *habits* for generating expectations. Counterfactuals requiring derivation from laws alone (without epistemic openness) fall outside the footnote’s purview.  
  - **Anti-realism about unobservables**: Ramsey’s pragmatism rejects truth conditions detached from verification. Conditionals are tools for managing *live* uncertainty, not abstract modal relations.  

  The footnote implies that conditionals are *epistemic instruments*, not propositions with fixed truth values. "If *p*, *q*" and "If *p*, ¬*q*" are contradictories *only* in the context of shared doubt – a dialectical rule for resolving disagreement, not a semantic principle.  

  ### (2) Prediction: Resistance to Unified Treatments, Leaning Toward Split  
  **Prediction**: Ramsey would have *resisted* extending his test to counterfactuals with known false antecedents. He would accept the test *only* for indicatives in contexts of uncertainty and treat counterfactuals as a distinct category tied to laws/hypotheses.  

  **Reasons for Resistance to Monism**:  
  - **The "void" clause**: Counterfactuals (*p* false) explicitly void the degrees of belief his test generates. Using "closest worlds" to salvage them ignores his insistence that such beliefs lose their function.  
  - **Laws and chancy cases**: For the radioactive decay example, Ramsey would deny it expresses a genuine counterfactual *belief*. Laws (as habits) license expectations *only* under uncertainty. If *p* (decay) is known false, asking "what *would* have followed?" is either:  
    - A question about logical entailment (but here, laws + *p* entail only probabilities, not *q*), or  
    - Meaningless, as no actual belief revision is possible.  
    His subjectivism implies chance statements express *our* uncertainty; with *p* known false, no uncertainty remains to ground the conditional.  
  - **Collapse proof**: Presented with triviality results, Ramsey would conclude **conditionals lack probabilities**. The footnote already treats them as suppositional acts ("arguing on that basis"), not propositions. His view that logic is a "calculus of consistency" for beliefs (*Foundations of Mathematics*) supports this: conditionals are *inference licenses*, not objects of belief themselves. The "void" remark aligns perfectly – if *p* is false, the license is revoked.  

  **Attitude to the Split Proposal**:  
  Your proposal (one test, two revision policies) would strike Ramsey as **abandoning the dialectical point** of his test.  
  - **Contradictories in doubt**: His remark that "If *p*, *q*" and "If *p*, ¬*q*" are contradictories *only* makes sense if both parties share the *same* epistemic context (doubt about *p*). Introducing distinct revision policies (e.g., holding past fixed for counterfactuals) fractures this shared context. Conditional Excluded Middle (CEM) is plausible *only* when revising from a common stock of knowledge.  
  - **Practical function**: The footnote emphasizes conditionals as tools for *resolving disagreement* between uncertain agents. Splitting revision policies severs this link to actual argumentation. Counterfactuals revised with fixed past/laws serve retrospective explanation, not collaborative reasoning.  
  He might accept a *weaker* split: his test governs indicatives, while counterfactuals are elliptical for lawlike derivations. But this concedes counterfactuals fall outside his original test.  

  ### (3) Underdetermination and Settling Factors  
  **Underdetermined**: Whether Ramsey would *entirely reject* counterfactuals as meaningful or *reconstrue* them as law-derivations. The footnote sends us to "laws or hypotheses" when *¬p* is certain but doesn’t specify if this yields a *truth-apt* conditional or a distinct speech act.  

  **Settling Factor**: Ramsey’s view on **hypothetical reasoning about known falsehoods**. Extrapolating from *General Propositions and Causality*:  
  - If he sees such reasoning as merely instrumental (e.g., calculating consequences of false theories for pragmatic coherence), he might tolerate a law-based *ersatz* counterfactual.  
  - More consistently, his **verificationist leanings** ("Facts and Propositions") suggest he’d deem counterfactuals **cognitively empty** where no evidence could bear on them (e.g., radioactive decay). His emphasis on "habits" implies counterfactuals are useful *fictions* for systematizing laws, not belief-guiding conditionals.  
  The stronger evidence points to rejection: his test is rooted in *actual* belief revision; counterfactuals lack this anchor. Only his pragmatism about science *might* concede a derivative role.  

  **In summary**: Ramsey’s core commitments – epistemic immediacy, anti-realism about unobserved modalities, and the instrumental role of logic – imply he would *not* endorse the later "Ramsey Test" for counterfactuals. He would see it as overextending a tool designed for uncertain inquiry into a domain his footnote explicitly voided. The split you propose, while elegant, sacrifices the dialectical unity he prized in open-conditionals.
