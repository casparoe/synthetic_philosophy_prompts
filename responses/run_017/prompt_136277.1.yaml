  ### Anselm's Argument in Type-Theoretic Vocabulary

  **Core Definitions:**
  - `U : Type` (Type of conceivable individuals)
  - `conceivable : U → Prop` (Predicate for being conceivable)
  - `exists_in_reality : U → Prop` (Predicate for real existence)
  - `greater : U → U → Prop` (Preorder: transitive, reflexive)

  **Greatest Conceivable Being:**
  ```lean
  def is_greatest (g : U) : Prop := 
    ∀ x, conceivable x → ¬ (greater x g) ∧ conceivable g
  ```

  **Argument Structure:**
  1. **Assumed Inhabitant of "Greatest"**:  
     `axiom anselm_premise : ∃ g : U, is_greatest g`  
     (Axiom: Assumes a conceivable greatest being exists in understanding)

  2. **Existence Inference**:  
     `theorem anselm_conclusion : ∀ g, is_greatest g → exists_in_reality g := ...`  
     (Proof requires additional axioms: e.g., non-existent greatness implies conceivable greater thing)

  **Key Axioms (Fudges):**
  - `axiom greatness_entails_existence : ∀ x, ¬exists_in_reality x → ∃ y, greater y x ∧ conceivable y`  
    (Non-existence implies a conceivably greater being — substantive philosophical premise)

  ---

  ### Gödel's Modal Argument in Type-Theoretic Vocabulary

  **Primitives and Definitions:**
  - `World : Type` (Possible worlds)
  - `U : World → Type` (Domain of individuals per world)  
    *Fudge: Constant domain assumed (simplifies S5)*
  - `Property : Type := ∀ w, U w → Prop` (World-indexed properties)
  - `Positive : Property → Prop` (Primitive positivity; **uninterpreted constant**)

  **Godlike Being:**
  ```lean
  def Godlike (w : World) (x : U w) : Prop := 
    ∀ (φ : Property), Positive φ → φ w x
  ```

  **Essence and Necessary Existence:**
  ```lean
  def Essence (φ : Property) (w : World) (x : U w) : Prop := 
    φ w x ∧ ∀ (ψ : Property) (w' : World), ψ w x → □ (∀ (y : U w'), φ w' y → ψ w' y)

  def NecessaryExistence (w : World) (x : U w) : Prop := 
    ∀ (φ : Property), Essence φ w x → □ (∃ w', ∃ y, φ w' y)
  ```

  **Axioms:**
  - `axiom A1 : ∀ φ, Positive φ → ¬ Positive (λ w x, ¬ φ w x)`  
    (Positivity is consistent; **axiom**)
  - `axiom A2 : ∀ φ ψ, Positive φ → □ (∀ w x, φ w x → ψ w x) → Positive ψ`  
    (Positivity closed under entailment; **axiom**)
  - `axiom A3 : Positive (λ w x, NecessaryExistence w x)`  
    (Necessary existence is positive; **axiom**)
  - `axiom A4 : Positive (λ w x, Godlike w x)`  
    (Godlikeness is positive; **axiom**)

  **Theorems:**
  - `theorem T1 : ∀ φ, Positive φ → ◇ (∃ w x, φ w x)`  
    (Positive properties are instantiated in some world; **theorem** from A1, A2)
  - `theorem GodExists : □ (∃ w x, Godlike w x)`  
    (Necessary existence of God; **theorem** from T1, A3, A4, S5)

  ---

  ### Variant: Preorder on Individuals (Without Positivity)

  **Primitives:**
  - `World : Type`
  - `U : Type` (Fixed domain; *fudge for simplicity*)
  - `greater : World → U → U → Prop` (World-indexed preorder)
  - `exists_in : World → U → Prop` (Existence by world)

  **Maximal Element:**
  ```lean
  def maximal (w : World) (x : U) : Prop := 
    ∀ y, ¬ greater w y x
  ```

  **Argument:**
  - **Premise**:  
    `axiom maximal_conceivable : ◇ (∃ x, maximal w x)`  
    (Possibility of a maximal being; **axiom**)
  - **Conclusion**:  
    `theorem maximal_exists : ∃ w x, exists_in w x ∧ maximal w x`  
    (Requires additional comparability axioms)

  **Comparison with Gödel's Version:**
  - **Easier for Proof Assistants**:  
    - Avoids modal property closure axioms (A2).  
    - Simpler quantification (no essence/necessary existence predicates).  
  - **Lost Nuances**:  
    - No intrinsic "positivity" to justify greatness.  
    - Necessity requires explicit world-dependency in `greater`.  
    - Modal collapse harder to formulate.  

  ---

  ### Residue Report: Honest Mapping and Fudges

  **What Maps Cleanly:**
  - **Properties as Predicates**: `U → Prop` cleanly represents attributes.  
  - **Existence as a Property**: `exists_in_reality : U → Prop` is explicit.  
  - **Modal Operators**: `□`/`◇` as `∀ w`/`∃ w` with `World` is standard.  
  - **Essence**: The `Essence` definition captures "necessary attributes".  

  **Fudges Required:**
  1. **Constant Domains**:  
     - Assumed `U` constant across worlds (simplifies S5; not fully general).  
  2. **Greatest Conceivable Being**:  
     - Anselm's "conceivable greater" became `∃ y, greater y x` (ignores conceptual limits).  
  3. **Preorder World-Dependency**:  
     - `greater : World → U → U → Prop` artificially splits preorder from existence.  
  4. **Necessary Existence Definition**:  
     - Defined via essences; hides its dependency on modal quantifiers.  

  **No Expression:**
  - **Conceivability as a Modal Operator**:  
    Anselm's "can be conceived" lacks a clean `◇` translation.  
  - **Positive Properties as "Good"**:  
    Gödel's `Positive` has no intrinsic justification; remains primitive.  

  ---

  ### Verdict on Key Suspects

  **1. Necessary Existence ≡ Quantifier in Costume?**  
     - **Yes, impredicatively**.  
       `NecessaryExistence` quantifies over *all* essences `φ`, making it impredicative:  
       ```lean
       def NecessaryExistence (w : World) (x : U w) : Prop := 
         ∀ (φ : Property), Essence φ w x → □ (∃ w', ∃ y, φ w' y)
       ```  
       This is equivalent to `□ (∃ y, Godlike w y)` under the axioms — a disguised necessitated existential quantifier. Proof assistants flag this as impredicativity.

  **2. Modal Logic vs. Positivity Axioms**:  
     - **S5 Does Heavy Lifting**:  
       The jump `◇P → □P` (from God's possibility to necessity) relies critically on S5 transitivity. In a proof assistant:  
       - Positivity axioms alone cannot prove `GodExists` without S5.  
       - Switching to K or T breaks the proof.  
     - **Visible in Proof Assistant**:  
       Dependencies on S5 appear as:  
       ```lean
       axiom S5_symm : ∀ w w' : World, accessible w w' → accessible w' w
       axiom S5_trans : ∀ w w' w'', accessible w w' → accessible w' w'' → accessible w w''
       ```  
       Removing these breaks the proof — clear from failed compilation.

  **3. Modal Collapse: Theorem or Defect?**  
     - **It's a Theorem (and a Defect)**:  
       Gödel's axioms imply `∀ p : Prop, p → □p` (all truth is necessary). In the formalization:  
       ```lean
       theorem modal_collapse : ∀ (p : World → Prop), □ (λ w, p w → □ p) := ...
       ```  
       Proof assistants verify this as derivable from the axioms. This is a *feature of the axioms*, not the logic alone. Philosophers debate if this invalidates the system.

  ---

  ### Overall Residue Assessment

  **Vocabulary's Fault (20%):**  
  - **Type Dependency**: Forcing `exists_in : U → Prop` (not `Type`) obscures existence's ontological status.  
  - **Impredicativity**: Proof assistants highlight `NecessaryExistence`'s impredicativity, but this reflects Gödel's design.  

  **Argument's Unclarity (80%):**  
  1. **Anselm's Conceivability**:  
     "Conceivable greater" is underspecified — is it logical consistency or imagination? Fudged via `axiom greatness_entails_existence`.  
  2. **Gödel's Positivity**:  
     `Positive` is primitive and ungrounded. Axioms A1–A3 are asserted, not derived.  
  3. **Necessary Existence**:  
     Treated as a first-order property (`NecessaryExistence : U → Prop`), but behaves like a quantifier — a category error visible in formalization.  
  4. **Preorder Variant**:  
     "Greatness" loses its normative content; maximality is vacuously true if `greater` isn't well-founded.  

  **Recommendation**:  
  Formalization clarifies logical structure but exposes metaphysical assumptions. Anselm's argument relies on *ad hoc* comparability axioms; Gödel's hides quantificational work under `Positive`. Proof assistants favor the preorder variant for simplicity but highlight its modal weaknesses. The residue is mostly the arguments' fault — they smuggled in premises that formalization uncovers.
