  ## Part 4: Residue Report

  We now address the specific questions.

  ### Mapping Cleanly

    - The notion of a property is mapped cleanly to `U → Prop` (non-modal) or `World → U → Prop` (modal).
    - The notion of existence as a property is represented as a predicate.
    - The definite description "that than which none greater can be conceived" is represented by the `maximal` predicate in the preorder version, or by the greatest conceivable thing in Anselm's.
    - In Gödel's version, the necessary existence property is defined and taken as positive, and then the conclusion is that a Godlike being necessarily exists.

  ### Fudged

    - In Anselm's argument, the step from "conceiving of g" to "conceiving of g existing" is fudged by the function `x_with_existence` or by the axiom `conceive_non_existent_implies_can_conceive_greater`. This is a known weakness.
    - In Gödel's version, the definition of essence is a bit complex and might be seen as fudging. Also, the necessary existence property is defined in a way that requires the essence to be instantiated in every world, which is a strong condition.
    - In the preorder version, the preorder being fixed and not world-dependent might be seen as a simplification.

  ### No Expression

    - The conceptual jump from "conceiving" to "existence" is not fully captured by any of the formalizations. We have to assume axioms that are not self-evident.
    - The idea of "positive property" in Gödel's argument is left primitive and uninterpreted. The axioms on positivity are not justified within the system.

  ### Specific Questions

    1. Is necessary existence as a first-order property of individuals just the existential quantifier in modal costume?

          In our formalization, `NecessaryExistence` is defined as a property of an individual in a world:

              `def NecessaryExistence (w : World) (x : U) : Prop := 
                 ∀ (φ : Property), Essence φ w x → □ (λ w', ∃ y, φ w' y)`

          This is not the same as the existential quantifier. It says that for every world, there is an instance of the essence in that world. It is a property of `x` that depends on its essence.

          However, in the modal collapse result, we see that if there is a Godlike being, then every true proposition is necessary. This suggests that necessary existence is doing a lot of work.

          But in our definition, it is not defined as a quantifier but in terms of the essence.

          However, note that the property `φ` might be the property of being identical to `x`. Then if we take `φ = (λ w' y, y = x)`, then the necessary existence condition would require that `□ (∃ w' y, y = x)`, i.e., `x` exists necessarily. But in our definition, we use the essence, and the essence might not be the identity property.

          So it is not simply the existential quantifier.

    2. Does the choice of modal logic do more work than the positivity axioms?

          Yes. The proof uses S5 (in particular, the symmetry and transitivity of accessibility for the modal collapse). But in our formalization, we used `□` as `∀ w` (which corresponds to S5 with a universal accessibility relation). 

          In the proof assistant, we can see that the modal logic is doing work because the proof of the final step from `◇ (∃ x, Godlike w x)` to `□ (∃ x, Godlike w x)` relies on the S5 principle. However, the positivity axioms are used to derive the possibility and to show that Godlike implies necessary existence.

          The modal collapse (that every truth is necessary) is a theorem in this system? It is a known result in Gödel's argument. It is a consequence of the axioms and the definition of God as having all positive properties, and the positivity of necessary existence. It is visible in the proof assistant as a derived theorem.

          However, the choice of S5 is essential for the final step: from possibility of God to necessity of God. In a weaker modal logic, we might not be able to do that.

    3. Overall residue: 

          - The vocabulary's fault: 
              * We have to choose a representation for modality (worlds vs. modal operators). This is a choice of the formalizer.
              * The primitive notions (positivity, the preorder) are uninterpreted and the axioms about them are not justified.

          - The original argument's lack of clarity:
              * Anselm's move from "conceiving of X" to "conceiving of X with existence" is not clearly defined.
              * In Gödel's argument, the positivity primitive and its axioms are not clearly justified. Why should we accept that necessary existence is positive? Why should positive properties be closed under entailment? 
              * The definition of essence is complex and might be seen as ad hoc.
              * The necessary existence property is defined in a way that is very strong and leads to modal collapse.

  ### Conclusion

    The formalizations reveal that the arguments rely on non-trivial and sometimes controversial axioms. The proof assistant can check the logical validity given the axioms, but not the truth of the axioms. The residue is partly due to the limitations of formal logic (having to choose a specific representation) and partly due to the original arguments containing jumps that are not purely logical.

    In particular, the necessary existence property is not just the existential quantifier in disguise, but it is defined in a way that quantifies over essences and requires the essence to be instantiated in every world. This is a strong property.

    The modal logic (S5) is doing essential work in the Gödel argument, especially in the step from possibility to necessity. Without S5, the argument would not go through.

    The modal collapse is a theorem in the system, and it is a consequence of the axioms. It is not a defect per se, but it is a feature that might be considered undesirable because it implies that there is no contingency.

    The preorder version is simpler and easier for a proof assistant to check, but it loses the modal necessity and only gives existence in the actual world. It also has its own residue in the axioms about conceivability and existence.
