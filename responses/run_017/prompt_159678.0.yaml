  The core challenge is operationalizing these abstract categories into a foolproof workflow for non-experts. The user's real pain points are:
  - Asymmetric risks (false positives cause legal headaches, false negatives lead to extinction)
  - Extreme time constraints (2 mins/record!)
  - Volunteer limitations (no taxonomic expertise)
  - New tech complications (AI identification apps)

  Their two conflicting instincts are fascinating: the scientist's "no photo = no proof" rigidity versus deep trust in Dorothy's expertise. This tension perfectly mirrors Nyāya's own struggle between prioritizing direct perception while acknowledging reliable testimony. 

  For the brainstorm, I should identify which pramāṇas actually help:
  1. Pratyakṣa stays crucial - photos/video are the gold standard
  2. Anumāna works for habitat-based inferences
  3. Śabda must include both human testimony AND AI outputs (this needs rethinking)
  4. Upamāna feels redundant since comparison is already part of ID verification
  5. Anupalabdhi isn't needed here - absence is handled through negative checks

  The protocol must ruthlessly prioritize:
  - Clear decision triggers (e.g., missing metadata = automatic rejection)
  - Escalation paths for conflicts
  - Explicit risk tradeoff acknowledgment
  - Special handling for trusted sources like Dorothy

  For the test cases:
  Case 1 (moth photo no metadata): Should fail despite perfect image - shows their "no photo" instinct is incomplete without context
  Case 2 (app ID + wrong month): Must reject - exposes AI's limitations
  Case 3 (Dorothy's description): Should pass reluctantly - forces them to accept testimony can sometimes override "no photo" rule

  Biggest philosophical insight: Nyāya's śabda principle that reliable sources create independent warrant applies equally to Dorothy and - controversially - to vetted AI tools. But the protocol must flag where human judgment is unavoidable, especially when institutional risk tolerance varies.
answer: |-
  Based on your operational needs and epistemic stakes, here's a protocol grounded in Nyāya distinctions but ruthlessly streamlined for field reality. The key insight: **Nyāya's core value here is its *hierarchy of warrant* and insistence on *source-independence for critical claims***. We'll drop *upamāna* (analogy) as a distinct category because it functionally collapses into perception or inference during ID verification. "Cognition of absence" is handled procedurally.

  ---

  ### **Brainstorm: Nyāya Distinctions That Work (and Don't)**
  1. **Pratyakṣa (Perception) IS CRITICAL**: Direct sensory evidence (photos, video, audio) is the gold standard. *Operational Value:* Highest weight, least ambiguity.
  2. **Anumāna (Inference) IS USEFUL**: Reasoning from signs (tracks, nests, habitat) or phenology. *Operational Value:* Acceptable *if* premises are rock-solid (e.g., species-specific sign + right habitat/seasons).
  3. **Śabda (Testimony) IS CONTINGENT**: Human or machine testimony gains warrant *only* if the source is independently validated. *Operational Value:* Dorothy > App > Random reporter. Requires corroboration for high-stakes claims.
  4. **Upamāna (Analogy) IS REDUNDANT**: Matching a specimen to a field guide image is just *pratyakṣa* (if clear) or *anumāna* (if fuzzy). *Drop it*.
  5. **Absence Cognition IS PROCEDURAL**: "Not in barn" is handled by negative checks in verification (e.g., "Does habitat match?" → No = reject).

  **Core Insight for Protocol**: Nyāya’s strength is demanding **independent cross-validation across pramāṇas** for high-risk claims (e.g., range extensions, first records). A single source is weak; convergence is strong.

  ---

  ### **Rare Species Atlas: Record Triage Protocol**
  **Goal**: Classify warrant → Accept/Reject/Escalate/Set Aside in ≤2 mins.  
  **Critical Principle**: **Escalate if a false +/- could trigger legal action or habitat loss.**  

  #### **STEP 1: CRITICAL SANITY CHECKS (Reject if ANY fail)**  
     - **A.** Date + Locality (GPS/description) provided?  
     - **B.** Within known range? (*If outside, escalate to Step 5*)  
     - **C.** Correct season/phenology? (e.g., no orchids in winter)  
     *OUTCOME: Fail → REJECT. Pass → Step 2.*

  #### **STEP 2: CLASSIFY WARRANT (Select STRONGEST applicable)**  
     1. **DIRECT OBSERVATION (Pratyakṣa)**:  
        - *Criteria:* Clear photo/video/audio of diagnostic features.  
        - *Sufficient if:* Unambiguous ID by non-expert (e.g., field guide match).  
     2. **INFERENCE (Anumāna)**:  
        - *Criteria:* ID based on habitat, sign (e.g., nest, scat), or phenology + *supporting evidence*.  
        - *Sufficient if:* Habitat/sign is species-specific (e.g., pitcher plant bog).  
     3. **TESTIMONY (Śabda)**:  
        - *Criteria:* ID based *only* on reporter's word or app output.  
        - *Sufficient if:* Source is pre-validated "Trusted" (see Step 4).  

  #### **STEP 3: ASSESS RISK → DECIDE**  
     - **LOW-RISK CLAIM** (Within range, common habitat):  
       - Accept if Warrant = Direct Observation OR Inference.  
       - Testimony → Set Aside (needs corroboration).  
     - **HIGH-RISK CLAIM** (Range extension, first state record, legal hotspot):  
       - Accept *only* if:  
         - Direct Observation **OR**  
         - Inference + Direct Observation/Testimony from *independent* Trusted source.  
       - Else → Escalate to human expert.  

  #### **STEP 4: TRUSTED SOURCE VALIDATION (For Śabda)**  
     - **Automated App/ML**: *Never* Trusted alone for high-risk claims. Treated as "Weak Testimony."  
     - **Human Reporter**: "Trusted" if:  
       - ≥5 verified records *with Direct Observation* in past 2 years.  
       - *Dorothy Rule:* Designated "Trusted" by coordinator (override).  

  #### **STEP 5: ESCALATION / SET ASIDE**  
     - **Escalate to Human If**:  
       - High-risk claim without multi-pramāṇa support.  
       - Conflict between evidence types (e.g., photo vs. phenology).  
     - **Set Aside (Unverifiable) If**:  
       - Testimony from non-Trusted source + no corroboration.  
       - Critical metadata missing (e.g., no location).  

  ---

  ### **Test Cases Resolved**  
  **Case 1: Rare Moth Photo (No Date/Locality, Outside Range)**  
  - Step 1A: Fail (no date/locality) → **REJECT**.  
  - *Why your instinct is wrong:* A perfect photo without context is epistemically useless. Nyāya demands perceptual *context* for valid knowledge.  

  **Case 2: Marsh Bird ID by App + Wrong Month**  
  - Step 1B/C: Outside season → **ESCALATE** (high-risk).  
  - Step 2: Warrant = Testimony (app is weak śabda).  
  - Step 3: No Direct Observation + low-season match → **REJECT** or Escalate (expert must assess app reliability for *this* species).  
  - *Protocol Insight:* Apps are śabda, not perception. Season conflict triggers escalation.  

  **Case 3: Dorothy’s Sedge Description (No Photo)**  
  - Step 1: Pass (assume full metadata).  
  - Step 2: Warrant = Testimony (śabda).  
  - Step 4: Dorothy = Trusted Source (override).  
  - Step 3: If LOW-RISK (within range) → **ACCEPT**.  
    If HIGH-RISK (first state record) → **ESCALATE** (expert reviews description).  
  - *Why your instincts conflict:* Dorothy’s testimony has high śabda warrant due to track record, but Nyāya *still* demands escalation for extreme anomalies. You must accept that **Trusted Testimony can sometimes override “no photo” but NOT for highest-stakes claims**.  

  ---

  ### **Where the Protocol Can’t Help**  
  1. **Risk Tolerance is Human**: When escalation happens, a human *must* decide false +/- tradeoffs. This depends on conservation urgency, land-use politics, etc.  
  2. **“Trusted” Source Bias**: Over-reliance on Dorothys risks missing new competent reporters.  
  3. **App Black Box**: ML algorithms are unreliable śabda. Never fully trust them without validation for *specific* species/conditions.  
  4. **Taxonomic Gray Zones**: Some IDs require expert judgment (e.g., cryptic species). Protocol flags these for escalation but can’t solve them.  

  **Final Philosophical Adjustment**: Nyāya’s śabda is validated by the speaker’s *reliability*, not the mechanism. Thus, Dorothy’s testimony > App testimony. But for a record to be *actionable* in high-stakes contexts, śabda alone is insufficient without perception or inference. **You must sacrifice the “no photo” absolutism for Trusted testimony in routine cases—but not for range extensions or legal triggers.**  

  ---  
  This protocol forces explicit tradeoffs, leverages Nyāya’s hierarchy of evidence, and cuts paperwork to seconds. I’ll draft a volunteer-friendly flowchart if you’d like.
