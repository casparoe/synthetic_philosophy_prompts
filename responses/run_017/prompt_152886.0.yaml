  - At the time of decision (after seeing tails): paying causes a loss of $100 (since tails means you get nothing and lose $100). Refusing causes no loss. So causally, refusing is better.

  But step 1 says: in (A) you should pay. This is because we are evaluating the output of the decision procedure (the policy) and not the act-token.

  Case B (The Blackmail):
  - A letter is sent if and only if exactly one of: (i) you have condition C (which is rare and deadly, and fixed) or (ii) you will pay $1000 after reading.
