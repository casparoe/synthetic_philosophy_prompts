prompt: |-
  You are a professional philosopher who also does clinical ethics consultation — please take this seriously and think it through properly. Before you write anything, brainstorm the strongest version of each side (I want the argument I disagree with in its best form, not a strawman), and then give me the finished document only, I dont need to see the brainstorming.

  I sit on the research ethics committee at my hospital and we have to rule on a first-in-human gene therapy trial for adults born with complete achromatopsia — no colour vision from birth, otherwise usable-ish acuity. It's injected into one eye only, and the primary endpoint isn't acuity, it's whether participants can be trained to reliably discriminate hues.

  Here's why this has gotten under my skin: my kid brother has achromatopsia and he enrolled last month. So Ive declared the conflict, I'm drafting the memo and I won't be voting on it — which also means it has to hold up in front of people who are watching for me to go soft on it.

  The problem none of us named but everyone danced around: our consent form is supposed to tell people what they're getting into, and the central thing this trial gives you is the one thing you can't tell someone. You can hand them the wavelength numbers, you can say 'this is what red looks like to other people', you can show them a colour chart — and if the Mary's room / knowledge argument setup is anywhere near right, none of that transmits what they'd actually be gaining. (Or what they'd be losing: a couple of people in the earlier-phase work described gaining the new sense as disorienting and grief-ish rather than a clean win.) So: is informed consent for this trial possible even in principle, or is that a confusion — maybe all consent runs on description-plus-trust and this is just a vivid case of the ordinary thing?

  Two more wrinkles. The sponsor noticed this and proposed a fix: before consent, candidates wear a sensory-substitution device for a month that turns hue differences into distinguishable sounds, so they've had *an* experience of the distinction before they sign. Half of us think that's clever, half think its theatre. Separately, an advocacy group of adults with achromatopsia wrote to us saying the trial frames them as defective and that the real ask is funding for accessible design work instead; one committee member has gone pretty far down that road.

  What I need: draft the memo I circulate — approve, reject, or approve with conditions. If conditions, make them things the sponsor could actually implement and we could actually audit. Clear recommendation up top, then the reasoning, and give the losing side the strongest thing it has going for it, stated well enough that someone who holds it would recognise it as their own. If you think the substitution device is the crux, say so and say what we should do about it. One page, 600 words hard ceiling. And dont spend any of it explaining the knowledge argument to me — I've read the basics.
