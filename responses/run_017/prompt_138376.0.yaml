prompt: |-
  I chair the weekly case conference that sets the care plan for patients with prolonged disorders of consciousness at a long-term complex-care unit. Roughly six to ten new patients a year come through it, always with the same three questions from the family: is she conscious; can she hear us when we talk to her; is she suffering. What we decide with the answers is not small — whether to continue clinically assisted nutrition and hydration, whether to give analgesia and sedation for procedures and for turning, whether to encourage the family to keep talking at the bedside, whether to approach them about a research protocol. The conference is an hour long, the people in it are a neurologist, a palliative care physician, a senior nurse and a chaplain, we have no research lab, and whatever we decide has to be said out loud to a family in plain words and defended afterwards to the hospital's ethics committee. So I need a procedure, not a position paper.

  The framework I keep coming back to is integrated information theory, because it is the only one I know that answers the three questions separately rather than treating consciousness as one dial: it gives a criterion for whether experience is present at all, a quantity for how much, and — at least in principle — a specification of what the experience is like. But every time I try to turn it into something we can run in an hour I get stuck on how many of its commitments are the opposite of clinical common sense, and I would rather have the contradictions on the table than smoothed over.

  Here is what I take the theory to commit to, for the purposes of the procedure; correct me where I have it wrong. Experience is a property of a system's causal structure — the cause–effect repertoire it specifies over itself — not of its activity at a moment. It is the irreducibility of that structure to the structures of its parts that matters, and the quantity is measured by how much the whole specifies over and above the sum of the parts. Crucially, the conscious entity is the subset that maximizes that quantity, not automatically the whole brain: the theory takes the maximum over candidate subsets rather than reading off the organism. And the quality of the experience is supposedly given by the shape that structure takes when unfolded into a space whose axes are the concepts the system specifies.

  If that is right, then several things follow that I do not know how to handle in a case conference, and I want them built into the procedure rather than quoted at me:

  First, a cortex that is physically present and wired up but pharmacologically or structurally quiescent — burst suppression, deep sedation, a thalamus no longer driving it — still has its cause–effect repertoire on this account, because the repertoire is a property of the mechanism and its connections rather than of what it is currently doing. So no EEG pattern I can point to is a deductive entailment of the theory's criterion for absence. I need to know what, if anything, on this view does license a negative verdict, and where the procedure must stop and say "no verdict available" instead of "not conscious."

  Second, neuron count and surviving volume are the wrong axis. A large, modular, mostly feedforward structure can contribute almost nothing while a small densely recurrent mesh contributes a great deal. My team's instinct, and the families', is to read the scan as "how much brain is left." I want that instinct replaced by a question we can actually ask of the imaging and the clinical examination, and told honestly when the answer is not available at our level of resolution.

  Third, and this is the one I expect to be unpopular: if the theory takes a maximum over subsets, then a weakly connected region can supply a cheap cut that makes the whole brain reducible, and destroying or disconnecting that region can leave a smaller system whose irreducibility is higher than that of the whole it used to belong to. On the face of it, the theory allows a lesion to increase consciousness rather than decrease it. If that is a real consequence and not my misreading, the procedure has to say so, tell me what would count as evidence for it in a particular patient, and tell me what we are allowed to say to a family about it.

  Fourth, "can she hear us" is not the same question as "is she conscious." Even granting a complex exists, whether the patient hears speech depends on whether that structure specifies the corresponding auditory concepts. A patient could be conscious with an experience that contains nothing corresponding to speech at all, and a patient who follows commands on fMRI or EEG is showing us that a specific concept is specified, which is stronger and different evidence than evidence of consciousness in general. My procedure needs the content question asked separately from the existence question, with different evidence for each.

  Fifth, the verdict is time-relative and discontinuous. It is a verdict about a mechanism in a state, so it can flicker across hours and across a sedation holiday; and because it hangs on which subset maximizes the quantity, small differences in assumed connectivity can flip which system is the subject. I want to know how to handle near-ties between candidate complexes: whether a near-tie is a genuine finding or a "no answer," and how the procedure should treat a patient whose verdicts differ between two assessments a week apart.

  Sixth, the theory says nothing usable to me about valence. It may identify quality with a shape in a space of concepts, but nobody in my hospital can read suffering off that, and I am not going to withhold analgesia from a patient because of a philosophical argument. So the procedure needs an explicit handoff point where the suffering question leaves the theory and goes to clinical precaution, and it should state what the precautionary default is and why the theory gives no reason to depart from it.

  So here is what I am asking for. Write me a decision procedure my team can run in a one-hour conference, in the form of ordered questions with a specified stopping rule for each: what counts as a sufficient answer, what evidence at our level of resolution would meet it, where the procedure returns a no, and where it hands the question to a person because it is a question of values rather than of fact. Mark explicitly the steps where judgment cannot be eliminated and the theory is being used as a heuristic rather than applied. Include a short table translating the theory's terms into the things we can actually observe — imaging, bedside examination, EEG, evoked responses, a TMS-EEG perturbation-based complexity measure where we can get one — and say plainly which of those are proxies and what each proxy would have to track in order to be evidence of irreducibility rather than merely of differentiation of response. Give me the limits of the procedure as well: the cases where integrated information theory has no verdict at all, the cases where its verdict should be overridden, and a note on what the absence of a verdict does and does not entitle us to conclude or to tell a family.

  Then run it on three patients.

  One: a woman of thirty-four, six months out from an anoxic brain injury, diagnosed with unresponsive wakefulness syndrome — eyes open, sleep–wake cycles on EEG, no command following at the bedside, no command following on task-based fMRI, thalamocortical architecture apparently preserved on structural imaging. Her family has stopped talking to her because a resident told them there is nobody there, and they are asking us whether to continue clinically assisted nutrition and hydration.

  Two: a man of fifty-eight, bedside unresponsive for four months after a traumatic injury, who shows reproducible command-following on motor-imagery fMRI and on EEG but nothing at the bedside. His family wants to know whether he experiences the scans, the noise, and the instructions as instructions, and whether he is in pain. I want to know what the procedure adds here over what the imagery data already tells us — in particular whether the evidence that a concept is specified is also evidence about which system is the one that is conscious, or whether those come apart.

  Three: a man of forty-one with long-standing severe hydrocephalus, whose cortex is compressed to a thin mantle, who is awake and follows simple commands inconsistently. The team's reflex is to treat him as barely conscious because the scan looks catastrophic, and I suspect the theory says the opposite of what the scan suggests. I would rather hear that my procedure gives an answer I dislike than an answer that flatters me — so if your honest application of it tells me to treat him as more conscious, or tells me that some lesion in one of these patients raised rather than lowered what the theory cares about, say so and show the step where it happens.
reasoning: |-
  Okay, I need to really understand what this user is asking for. They chair a weekly case conference for patients with prolonged disorders of consciousness, and they're dealing with incredibly difficult decisions that directly impact patient care and family discussions. They want a practical decision procedure based on integrated information theory (IIT) that can be applied in one-hour meetings, not just theoretical positions.

  The user has clearly done their homework on IIT. They understand its core principles - that consciousness comes from a system's causal structure, measured by irreducibility (Φ), and that it's about finding the maximum integrated information within possible subsystems. They've identified several challenges in applying IIT clinically: how to assess consciousness when the brain is structurally intact but inactive; why brain volume isn't the key metric; the counterintuitive possibility that lesions might increase consciousness; separating awareness of specific stimuli from general consciousness; dealing with fluctuating states; and handling suffering/valence which IIT doesn't address.

  What they really need is a step-by-step workflow that turns these theoretical concepts into actionable clinical assessments. The procedure must account for the limitations of hospital-level diagnostics (no research labs), be executable within an hour, and produce clear answers to the three family questions. It needs to explicitly state where IIT provides answers versus where clinical judgment or precaution must take over.

  For each step, I'll need to specify: what evidence is required, what constitutes a sufficient answer, when to stop and declare "no verdict," and how to handle value judgments. I should include a translation table between IIT concepts and actual clinical tools (EEG, fMRI, etc.), clearly marking which are proxies for Φ and what their limitations are.

  The three patient cases will test the procedure's real-world applicability. For the anoxic injury patient, we'll need to address whether preserved thalamocortical structure without activity suggests consciousness. For the traumatic injury patient with command-following on scans, we'll examine whether this proves awareness of specific stimuli. And for the hydrocephalus patient, we'll confront whether a "catastrophic" scan might paradoxically indicate preserved consciousness in a smaller subsystem.

  Throughout, I must maintain scientific integrity - if IIT leads to counterintuitive conclusions (like possible consciousness increase post-lesion), I shouldn't shy away from that. But I also need to flag where clinical ethics should override theoretical predictions, especially regarding suffering and analgesia. The procedure must empower the team to say "we don't know" when evidence is inconclusive, while still guiding families through these impossible decisions.
answer: |-
  Below is a clinically executable decision procedure for your case conference, designed to answer the three core questions using IIT as a conceptual scaffold while acknowledging its limitations. The procedure prioritizes **actionable clinical evidence** over theoretical purity, includes explicit handoffs to clinical precaution/judgment, and defines stopping rules. It is structured as **5 sequential questions** with sub-steps, requiring approx. 45-60 minutes per patient.

  ---

  ### **DECISION PROCEDURE: IIT-INFORMED CONSCIOUSNESS ASSESSMENT**
  **Inputs Required:** Structural MRI, routine EEG, evoked potentials (if available), TMS-EEG Perturbational Complexity Index (PCI) (if available), task-based fMRI/EEG command-following data, bedside exam notes (including response variability).

  **Outputs:**  
  1. `[YES/NO/UNKNOWN]` for *"Is she conscious?"*  
  2. `[YES/NO/UNKNOWN]` for *"Can she hear us?"*  
  3. `[SUFFERING/PROBABLY NOT/UNKNOWN]` for *"Is she suffering?"*  
  4. Clinical implications (e.g., continue CANH? Use sedation? Encourage family interaction?)

  ---

  #### **QUESTION 1: IS THERE A PLAUSIBLE NEURAL SUBSTRATE FOR CONSCIOUSNESS (Φ > 0)?**  
  *Goal: Identify if a causally irreducible system (complex) exists.*  
  *Stopping Rule: Proceed only if YES/UNKNOWN. If NO, skip to Q5.*  

  1. **Assess structural integrity of thalamocortical system:**  
     - *Evidence:* Structural MRI (thalamus, cortical layers, white matter tracts).  
     - *Sufficient for YES:* Preserved thalamocortical architecture.  
     - *Sufficient for NO:** Diffuse cortical liquefaction/thalamic destruction.  
     - *UNKNOWN:* Partial preservation (e.g., hydrocephalus with thin mantle).  
     - *IIT Note:* A structurally intact system *may* have Φ even if inactive (clinical caveat: activity matters for detection).  

  2. **Assess dynamic complexity:**  
     - *Evidence:* TMS-EEG (PCI > 0.31 = likely conscious; PCI < 0.31 = likely unconscious).  
     - *Proxy if no PCI:* EEG (spontaneous differentiation: sleep-wake cycles + variability in resting EEG).  
     - *Sufficient for YES:* PCI > 0.31 OR highly differentiated EEG (e.g., posterior dominant rhythm + anterior variability).  
     - *Sufficient for NO:** Burst-suppression/isoelectric EEG OR PCI < 0.31.  
     - *UNKNOWN:* Low-voltage/undifferentiated EEG without PCI.  
     - *IIT Judgment Call:* A structurally intact system with low PCI *could* have Φ but be undetectable → Default to clinical evidence (NO).  

  ---

  #### **QUESTION 2: IS THE CONSCIOUS SUBSTRATE LIKELY INTACT? (MAXΦ SYSTEM)**  
  *Goal: Check if the candidate complex has sufficient integration (avoiding "cheap cuts").*  
  *Stopping Rule: If UNKNOWN in Q1, skip to Q5.*  

  1. **Identify potential "disconnects" that reduce Φ:**  
     - *Evidence:* DTI (white matter integrity), EEG coherence (cross-frequency coupling), fMRI functional connectivity.  
     - *Critical Test:* If a lesion isolates a cortical region (e.g., subcortical stroke), that region *could* have higher Φ than the whole brain (IIT counterintuitive case).  
     - *Sufficient for YES:** No major disconnections in thalamocortical loops.  
     - *Sufficient for NO:** Massive bifrontal/bithalamic lesions.  
     - *UNKNOWN:* Focal disconnections (e.g., hydrocephalus compressing tracts).  
     - *Clinical Heuristic:* Prefer whole-brain Φ unless evidence suggests a viable subsystem (rare).  

  2. **Handle "near-ties":**  
     - If evidence suggests competing complexes (e.g., preserved occipital lobe vs. frontoparietal network):  
       - *Resolution:* Prioritize the subsystem with (a) more connections, (b) command-following evidence.  
       - *Tiebreaker:* Default to whole-brain verdict.  

  ---

  #### **QUESTION 3: IS CONTENT-SPECIFIC EVIDENCE PRESENT? (AUDITORY CONCEPTS)**  
  *Goal: Answer "Can she hear us?" separately from general consciousness.*  
  *Stopping Rule: Proceed regardless of Q1/Q2.*  

  1. **Test auditory cortex engagement:**  
     - *Evidence:* Auditory evoked potentials (N100/P300), fMRI activation to speech vs. noise.  
     - *Sufficient for YES:** Reproducible P300 to name OR speech-specific fMRI activation.  
     - *Sufficient for NO:** Absent auditory ERPs + no fMRI activation.  
     - *UNKNOWN:* Inconsistent responses.  

  2. **Test semantic processing:**  
     - *Evidence:* Command-following on fMRI/EEG (e.g., "imagine tennis" → motor cortex activation).  
     - *Sufficient for YES:** Reproducible command-following.  
     - *IIT Note:* Command-following proves *auditory concepts exist* in the complex → She "hears" as instruction.  

  ---

  #### **QUESTION 4: IS CONSCIOUSNESS LIKELY PRESENT GIVEN DYNAMIC CONTEXT?**  
  *Goal: Resolve time-relativity (sedation, fluctuations).*  
  *Stopping Rule: Synthesize Q1-Q3.*  

  - **Temporal Stability:**  
    - If Q1/Q2 YES *and* exam shows consistent responses → `CONSCIOUS`.  
    - If Q1/Q2 YES *but* responses fluctuate → `CONSCIOUS` (note: flickering is allowed by IIT).  
    - If Q1/Q2 UNKNOWN *but* Q3 YES → `CONSCIOUS` (content implies existence).  
    - If Q1/Q2 NO → `UNCONSCIOUS`.  

  - **Sedation/Inactivity Caveat:**  
    - Under sedation: If structural integrity (Q1) is YES but PCI/EEG shows suppression → `UNKNOWN`.  
    - *Clinical Default:* Assume no consciousness during burst-suppression/deep sedation.  

  ---

  #### **QUESTION 5: IS SHE SUFFERING? (HANDOFF TO CLINICAL PRECAUTION)**  
  *Goal: IIT cannot assess valence; defer to clinical ethics.*  

  1. **IIT Limitation:**  
     - IIT identifies "what experience is like" (e.g., auditory concepts) but *not* suffering.  
     - *Handoff Point:* Suffering is a value-laden inference → Exit theory.  

  2. **Clinical Precaution Protocol:**  
     - `SUFFERING` if:  
       - Nociceptive stimuli (e.g., during turning) evoke autonomic distress (tachycardia, sweating).  
       - Known painful condition (e.g., fractures, spasticity).  
     - `PROBABLY NOT` if:  
       - No autonomic response to noxious stimuli.  
       - Patient is consistently stable.  
     - `UNKNOWN` otherwise.  
     - **Default Action:**  
       - *Always* provide analgesia for procedures.  
       - *Never* withhold pain relief based on consciousness verdict.  

  ---

  ### **TRANSLATION TABLE: IIT CONCEPTS VS. CLINICAL TOOLS**  
  | **IIT Concept**       | **Clinical Proxy**          | **What It Tracks**                                  | **Limitation**                              |  
  |------------------------|-----------------------------|----------------------------------------------------|---------------------------------------------|  
  | **Cause-effect repertoire** | EEG variability, TMS-EEG (PCI) | Differentiation of responses to perturbation      | Low PCI may miss structurally intact Φ      |  
  | **Irreducibility (Φ)** | Functional connectivity (fMRI/EEG) | Integration (cross-network coupling)             | Cannot isolate maxΦ subsystem in practice   |  
  | **Concept specification** | Command-following (fMRI/EEG) | Content-specific processing                      | Requires task compliance; false negatives   |  
  | **Dynamic substrate**  | Structural MRI + DTI        | Anatomical plausibility of complex               | Does not guarantee current Φ > 0            |  

  ---

  ### **LIMITS OF THE PROCEDURE**  
  - **No Verdict Cases:**  
    - Structurally intact but pharmacologically suppressed (e.g., sedation).  
    - Diffuse axonal injury with preserved cortex.  
    - *Action:* Report `UNKNOWN`; default to clinical indicators (e.g., exam).  
  - **Override IIT Verdict When:**  
    - Clinical exam contradicts testing (e.g., fMRI command-following but noxious stimuli evoke no response → doubt consciousness).  
    - Ethics demands precaution (e.g., continue CANH if UNKNOWN).  
  - **Absence of Verdict Means:**  
    - We lack evidence — *not* that consciousness is absent.  
    - *Tell families:* "We cannot detect consciousness with current tools, but we will monitor for new evidence."  

  ---

  ### **APPLICATION TO PATIENTS**  
  #### **Patient 1: 34F, Anoxic Injury, Unresponsive Wakefulness**  
  - **Q1:** Structural MRI shows preserved thalamocortex → YES. EEG shows sleep-wake cycles → proxy for differentiation. **VERDICT:** Plausible substrate (YES).  
  - **Q2:** No disconnections → likely whole-brain complex (YES).  
  - **Q3:** No command-following → NO for "hearing us."  
  - **Q4:** Stable unresponsiveness → CONSCIOUS? **DEBATE:** IIT allows Φ without content, but clinical consensus favors "no consciousness" without content. *Procedure output:* `CONSCIOUS? UNKNOWN` (IIT-heuristic conflict).  
  - **Q5:** No signs of suffering → PROBABLY NOT.  
  - **Implications:**  
    - *Tell family:* "Her brain structure suggests capacity for awareness, but we see no evidence she hears you. We recommend resuming talking in case she benefits."  
    - *CANH:* Continue (UNKNOWN consciousness + no suffering).  

  #### **Patient 2: 58M, Traumatic Injury, fMRI Command-Following**  
  - **Q1/Q2:** Preserved structure + fMRI connectivity → YES.  
  - **Q3:** Command-following on fMRI → YES, she "hears" instructions as such.  
  - **Q4:** Reproducible responses → CONSCIOUS.  
  - **Q5:** Pain unknown → default to precaution (assume possible suffering).  
  - **Implications:**  
    - *Tell family:* "He is likely conscious and understands instructions during scans. We will treat pain proactively."  
    - *Procedure adds:* Confirms fMRI responses reflect *conscious* processing (not just isolated modules).  

  #### **Patient 3: 41M, Hydrocephalus, Thin Cortical Mantle**  
  - **Q1:** Cortex structurally present but compressed → UNKNOWN (low volume ≠ low Φ).  
  - **Q2:** Disconnections likely due to compression → UNKNOWN.  
  - **Q3:** Inconsistent command-following → UNKNOWN for hearing.  
  - **Q4:** **IIT Counterintuitive Case:**  
    - *Possibility 1:* Whole-brain Φ reduced → UNCONSCIOUS.  
    - *Possibility 2:* Isolated cortical "island" with higher Φ than pre-injury whole brain → CONSCIOUS.  
    - *Evidence:* If TMS-EEG shows high PCI or command-following is reproducible → supports possibility 2.  
    - *Procedure output:* If command-following is observed, `CONSCIOUS? YES`.  
  - **Q5:** Unknown suffering → precaution (assume possible).  
  - **Implications:**  
    - *Tell team:* "Do not equate brain volume with consciousness. Test for islands of high function."  
    - *Tell family:* "His ability to sometimes respond suggests he may be aware despite the scan."  

  ---

  ### **PROCEDURE SUMMARY**  
  - **Time Allocation:** Q1 (15 min), Q2 (10 min), Q3 (10 min), Q4 (5 min), Q5 (5 min).  
  - **Critical Judgment Points:**  
    - Interpreting "UNKNOWN" in Q1/Q2 (structural vs. dynamic evidence).  
    - Resolving IIT-clinical conflicts (e.g., Patient 1).  
    - Acting on "suffering unknown" (always err toward relief).  
  - **When Theory Fails:**  
    - Default to clinical exam + precaution.  
    - Document: "IIT suggests [X], but clinical evidence [Y] dominates due to [limitation]."  

  This procedure forces explicit engagement with IIT’s hard questions while constraining it to clinical pragmatism. It prioritizes transparency with families ("We don’t know, but here’s our best evidence") and safeguards against theoretical overreach, especially for suffering.
