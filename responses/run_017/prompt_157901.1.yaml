  ### Proposed Principle for Mechanism Identity

  After analyzing your cases, I propose a principle based on **root cause vulnerability at a functional abstraction level**. This defines a mechanism as a specific, addressable flaw in the system's design or implementation, independent of transient triggers, outcomes, or fixes. The principle has three core components:

  1. **Root Cause Site (Functional Role)**: The component (e.g., detector, fusion, planner) where the essential flaw resides, defined by its functional role in the architecture, not its physical implementation or codebase. This is the most upstream point in the pipeline where a necessary fault occurs.
  2. **Fault Type**: The specific category of failure at that site (e.g., "misclassification of edges," "unchecked input staleness," "buffer race"). This must describe the intrinsic flaw, not its symptoms or downstream effects.
  3. **Functional Abstraction Level**: The grain is fixed by your system architecture's component boundaries and fault taxonomy (e.g., "detector" is a single site; "misclassification" is a fault type). This level must be predefined and consistent to avoid grain ambiguity (resolving cases 3 and 8).

  **Principle Statement**:  
  Two incidents are recurrences of the same mechanism if they share the same functional role for the root cause site and the same fault type. Identity is binary (same/different) but depends on your chosen abstraction level. Sharing triggers, outcomes, signatures, or fixes is neither necessary nor sufficient.

  #### Why This Principle?
  - **Motivated by Cases 1–4, 10**: Handles trigger/outcome swaps (1–2) by ignoring triggers/outcomes, masked failures (4) by focusing on the flaw's existence, and artefacts (10) by requiring a real system flaw.
  - **Resolves Grain Ambiguity (Cases 3 and 8)**: Grain is fixed by your predefined functional roles and fault types. In case 3, the root cause site differs (detector vs. mapper), so different mechanisms despite similar signatures. In case 8, the root cause site (planner) and fault type (unchecked input staleness) are identical at the coarse functional level, so one mechanism.
  - **Addresses Fixability-Identity Conflicts (Cases 5–7)**: Decouples identity from fixes. Case 5 (substrate swap) is a recurrence because the functional site (detector) and fault type (edge misclassification) are unchanged. Case 6 (fix ineffective) is a recurrence because the site (fusion) and fault type (stale-timestamp handling) persist. Case 7 (one fix, two paths) has different fault types (dropped message vs. buffer race), so two mechanisms.
  - **Clarifies Evolution and Isomorphism (Cases 9, 11)**: Identity is binary but non-transitive in drift scenarios (case 9). For isomorphism (case 11), functional role determines identity.

  ---

  ### Verdicts on New Cases
  Using the principle above:

  - **(a) Operator e-stop habit post-M1 remediation**:  
    **New mechanism**. Root cause site: "operator interface/procedures" (functional role: human-system interaction). Fault type: "unnecessary manual intervention." Differs from M1's site (detector) and fault type (edge misclassification). Not a recurrence, even with similar signature/cost. Socio-technical context doesn't override the technical root cause.

  - **(b) M1 co-occurring with rare network delay**:  
    **New mechanism** if the delay is necessary for failure. Root cause site: likely "system integration" (functional role: handling interactions). Fault type: e.g., "insufficient robustness to detector faults under latency." Frequency doesn't matter; the vulnerability is distinct from M1 alone. If the delay is merely a trigger (not necessary), it might be a recurrence of M1, but here both are necessary.

  - **(c) Simulated re-enactment of a mechanism**:  
    **Not a recurrence**. Simulations lack real-world operational impact and don't reflect an active flaw in the deployed system. The register should only record real incidents.

  - **(d) Mechanism absorbed by new redundancy**:  
    **Recurrence** of the same mechanism. Root cause site and fault type are unchanged; the flaw still fires but is now mitigated. The vulnerability persists, even if harmless.

  ---

  ### Evaluation of Your Verdicts
  The principle accommodates all your verdicts except **Case 9 (Drift)**. I would overturn **one verdict in Case 9** if forced to choose:
  - **Overturned Verdict**: The claim that B is the same as C (or any adjacent pair where functional role/fault type changed).  
    **Reason**: If the functional role or fault type changes between adjacent incidents (e.g., site shifts from detector to planner), they are distinct mechanisms. Your verdicts violate binary transitivity, but the principle requires consistency. For example, if A and B share site/fault type but B and C do not, then B and C are different mechanisms. Tracking evolution requires lineage (see recommendation).

  **Other Verdicts Accommodated**:
  - **Cases 1–8, 10–11**: Directly align with the principle. Case 5 (recurrence) is correct, as functional role/fault type persist. Case 8 (one mechanism) is correct at your functional grain.
  - **Case 9 Partial Accommodation**: Your A-not-D verdict is correct if A and D differ in functional role/fault type. But adjacent pairs should only be the same if no functional/fault change occurred.

  ---

  ### Recommendation for the Register
  **Mechanism identity is binary but context-dependent on functional abstraction**. Non-transitivity in case 9 arises because you are implicitly tracking evolution, not static identity. To resolve this:
  - **Dimensions of Grading**: Identity isn't inherently graded, but *similarity* is. Differences in functional role, fault type, triggers, or fixes create "degrees of similarity." These don't affect identity but inform prioritization.
  - **Threshold for Binary Identity**: Use the **functional role and fault type** (as predefined) for a strict binary split. If they match, it's a recurrence; if not, it's new.
  - **Register Changes**:
    1. **Predefine Functional Roles and Fault Types**: Create a taxonomy (e.g., sites: detector, fusion, planner; fault types: misclassification, stale data, race condition). Update this as the system evolves. This fixes the grain and prevents case 3/8 conflicts.
    2. **Add Lineage Tracking**: When a mechanism changes significantly (e.g., site/fault type drift), close the old entry and open a new one with an "evolved from" link. This handles case 9 without forcing transitivity.
    3. **Report Evolution Separately**: For remediation and regulatory reporting, use the binary identity for triggers (e.g., reopening fixes), but add notes for drift/isomorphism to avoid misrepresentation.

  This approach keeps remediation actionable (fixes target specific vulnerabilities) while acknowledging that flaws evolve. If functional roles are stable (e.g., "planner" remains consistent), case 11 becomes a recurrence if fault type matches, as architecture matters more than codebase.
