answer: |-
  ### Scenario: Alice makes coffee in her kitchen  
  **True reward**: Alice wants hot coffee (+1) and avoids scraping her enamel pan (heating it empty: −1). Each action costs −0.1 (prefers efficiency).  
  **Constraints**: Alice has a stiff wrist (slower movement, no multitasking while holding a full pan) and falsely believes the stove's "low" setting boils water quickly (in reality, "low" takes prohibitively long; only "high" works).  

  **Observed trajectory (8 states, 7 actions)**:  
  | State | Location | Pan content | Pan location | Stove | Coffee@table | Action |  
  |-------|----------|-------------|--------------|-------|--------------|--------|  
  | 0     | Sink     | Empty      | With Alice   | Off   | Cold         | Fill pan (→ water) |  
  | 1     | Sink     | Water      | With Alice   | Off   | Cold         | Move to stove |  
  | 2     | Stove    | Water      | With Alice   | Off   | Cold         | Place pan on stove |  
  | 3     | Stove    | Water      | On stove     | Off   | Cold         | Set stove to **low** |  
  | 4     | Stove    | Water      | On stove     | Low   | Cold         | Set stove to **high** (after delay) |  
  | 5     | Stove    | Water      | On stove     | High  | Cold         | Take pan off stove |  
  | 6     | Stove    | Water      | With Alice   | High  | Cold         | Move to counter |  
  | 7     | Counter  | Water      | With Alice   | High  | Cold         | Make coffee (→ coffee) |  
  | 8     | Counter  | Coffee     | With Alice   | High  | Cold         | Move to table |  
  | 9     | Table    | Coffee     | With Alice   | High  | Cold         | Pour coffee (→ **hot**) |  

  **Dynamics**:  
  - Stove heats pan only if pan is *on stove* and stove *on*. "High" boils quickly; "low" ineffective.  
  - Pouring coffee at table makes it hot. Heating an empty pan causes scraping.  

  ---

  ### Three IRL procedures on the *same* trajectory:  
  1. **MaxEnt IRL** (assumes Boltzmann rationality, fixed "temperature"=1):  
     - Infers reward: `+1.0·hot_coffee −0.5·stove_high −0.1·num_actions`.  
     - *Why?* Explains setting "low" first as avoiding a penalty for "high" (ignoring dynamics). Misses scraping avoidance.  
     - Ranks candidate rewards: [MaxEnt] > [True] > [Bayesian].  

  2. **Bayesian IRL** (sparse prior: prefers ≤2 reward terms):  
     - Infers reward: `+1.0·hot_coffee −0.1·num_actions`.  
     - *Why?* Simplicity prior ignores scraping (never observed) and stove setting. Sees suboptimality (extra action to switch to "high") as noise.  
     - Ranks: [Bayesian] > [True] > [MaxEnt].  

  3. **Model-based IRL** (infers *Alice’s* dynamics model, not true physics):  
     - Infers reward: `+1.0·hot_coffee −1.0·scrape −0.1·num_actions` (**true reward**).  
     - *Why?* Discovers Alice *believes* "low" boils water (so her actions are optimal *in her mind*).  
     - Ranks: [True] > [MaxEnt] > [Bayesian].  

  **Result**: Model-based IRL gets the true reward. Bayesian IRL is worst (fails to explain stove change).  

  ---

  ### Disambiguation: One extra observation  
  - **Counterfactual**: *If the pan had been left empty on the stove while hot, Alice would turn off the stove before removing the pan (avoiding scrape).*  
  - **Effect**: All three procedures now infer the scrape penalty. MaxEnt drops the stove penalty; Bayesian adds scrape term. Agreement on true reward.  
  - **Information type**: Reveals *preferences* (scrape avoidance), not just opportunities.  

  ---

  ### If Alice’s belief is corrected (she knows "low" doesn’t work):  
  - She sets stove to "high" immediately (state 3).  
  - All three procedures converge to true reward: Trajectory is now unambiguously optimal.  

  ---

  ### Grandson’s critique and soft spots  
  - "You picked the temperature/hypothesis class!"  
    - Grandson would: Tune temperature (MaxEnt) or adjust prior sparsity (Bayesian).  
    - **Outcome**: With tuning, MaxEnt and Bayesian *can* match the true reward, but only if given the counterfactual. Model-based IRL requires no tuning.  
  - **Core issue**: Belief-mismatch (not rationality assumptions) drives initial disagreement. Without modeling beliefs, IRL forces misspecified rewards to explain behavior.  

