  - (0.4,0.8): Cardio gets 4 OR slots (from the grant) and Ortho gets $800K ($400K from the base budget and $400K from the grant). Note: the base resources are still available, so they can still choose the old outcomes. The grant does not change the maximum either party can get alone: Outcome (1,0) and (0,1) are still available. The feasible set is the convex hull of the old points plus (0.4,0.8). The new Pareto frontier: (1,0) to (0.6,0.4) to (0.4,0.8) to (0,1).

  *Arithmetic:*

  **Version A:**
