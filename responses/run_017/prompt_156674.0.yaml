  So Cardio in Nash: 0.5 in A, 0.4 in B (worse). In KS: 0.5 in A, 0.5333 in B (better). Ortho in Nash: 0.5 in A, 0.8 in B (better). In KS: 0.5 in A, 0.5333 in B (better).

