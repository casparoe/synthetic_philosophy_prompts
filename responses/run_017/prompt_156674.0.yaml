  *The key feature:*
  The added option (0.4,0.8) is skewed toward Ortho and is more efficient (higher total utility) but at the cost of Cardio. The Nash solution, which maximizes the product, is drawn to this point because the product is higher. However, the KS solution, which is based on proportional gains, moves along the ideal line and gives both more.

  *What if we mirror the added options?*
