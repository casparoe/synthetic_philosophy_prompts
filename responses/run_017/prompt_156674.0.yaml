  *What if the expansion raises one side's maximum?*
  Condition (ii) requires that the ideal point remains (1,1). If we allowed the maximum to increase for one party, then the KS solution would also change because the ideal point moves. The KS solution is defined relative to the ideal point, so if the ideal point moves, the KS solution changes. The monotonicity axiom for KS requires that when the set expands and the ideal point remains the same, then both parties should get at least as much. In this case, condition (ii) ensures the ideal point is fixed.

  *Push back from a Nash partisan:*
  1. **Independence of Irrelevant Alternatives (IIA):** The Nash solution satisfies IIA: if you remove alternatives that weren't chosen, the solution doesn't change. The KS solution does not. In this case, if we start from B and remove the point (0.4,0.8), we get A and the solution changes from (0.4,0.8) to (0.5,0.5). But the Nash solution in B is (0.4,0.8), which is not in A, so if we remove it, the Nash solution changes. However, IIA says that if we remove an alternative that is not the solution, then the solution remains. In B, the solution is (0.4,0.8), so if we remove it, the set changes and the solution may change. So this example doesn't directly violate IIA for Nash. But the Nash partisan might argue that the expansion is adding an alternative that is irrelevant because it doesn't change the ideal point, but the Nash solution moves.

     Actually, the Nash solution violates monotonicity but satisfies IIA. The KS solution satisfies monotonicity but violates IIA. The example highlights the trade-off.

