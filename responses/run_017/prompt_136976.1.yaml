prompt: |-
  Last night I argued at length with a friend about the so-called gender-equality paradox — the pattern whereby sex differences in science-versus-reading preferences and in STEM participation appear larger in richer, more gender-equal countries. She thinks it settles the matter in favour of free choice under prosperity; I think it is at least as compatible with the thought that removing one set of constraints simply exposes others. We got nowhere, I suspect, because neither of us had said what an explanation of the pattern would have to achieve.

  Fix the purpose as follows: an explanation counts as adequate only if it could tell a government about to fund a careers-guidance or bias-training programme what to expect if the programme works — it must support counterfactuals about a barrier's removal, not merely fit the cross-national scatter.

  Give me exactly five numbered desiderata for such an explanation, one or two sentences each, with no introduction or conclusion. For each: the requirement, the case or finding behind it, and whether it is non-negotiable or a preference of one camp. Draw the cases from these: a country that grows richer and more equal while its gap widens; a gap running one way in engineering and the other in the life sciences within the same country; self-reported interest parting company with measured attainment; women entering a field because of its pay and status rather than its content; children who migrate between countries before adulthood. Where two of your requirements cannot be jointly satisfied, say so inside whichever item it belongs in rather than adding a sixth.
reasoning: |-
  Hmm, the user wants me to create five desiderata for explaining the gender-equality paradox in STEM. They've set up a specific scenario where they argued with a friend about why sex differences in preferences and STEM participation appear larger in more gender-equal countries. Their friend sees it as evidence of free choice, while the user thinks it might reveal underlying constraints. The key requirement is that any explanation must help governments predict outcomes when funding interventions like career guidance or bias training programs.

  I need to draw from specific cases they've provided: economic growth increasing equality while gaps widen, different gender gaps within the same country's engineering versus life sciences fields, discrepancies between self-reported interests and actual performance, women entering fields for pay/status rather than content, and children who migrate before adulthood.

  For each desideratum, I'll need to include: the requirement itself, the case or finding that illustrates it, and whether it's non-negotiable or preferred by one camp (free-choice vs. constraint-exposure). I should limit myself to exactly five items without introductions or conclusions. If any two requirements conflict, I'll note that within the relevant item.

  Let me think through each case and how it relates to explanatory requirements:

  First, the case of a country becoming richer and more equal while gaps widen. This suggests the explanation must account for changes over time, not just static correlations. It needs to be dynamic and predictive. I'll make this non-negotiable since both camps would need to address temporal changes.

  Second, the differing gaps in engineering versus life sciences within the same country. This shows that explanations can't treat STEM as monolithic - they must handle field-specific variations. This should be non-negotiable too, as both sides would acknowledge field differences.

  Third, the disconnect between reported interests and actual performance. This indicates that explanations must distinguish between preferences and abilities, which is crucial for predicting how interventions might work. The free-choice camp might prefer this, while constraint theorists would also find it relevant.

  Fourth, women choosing fields for extrinsic rewards like pay/status. This requires explanations to separate motivation from intrinsic interest, which matters for predicting if interventions change choices. The constraint camp would emphasize this to show choices aren't purely free.

  Fifth, migrant children data. This tests if gaps reflect early socialization or later influences, which is vital for timing interventions. The constraint camp would particularly value this for showing cultural influences.

  I notice potential conflict between the third and fourth desiderata: requiring explanations to account for both interest-attainment mismatches and extrinsic motivations might be challenging if an explanation attributes choices purely to one factor. I'll note this conflict in the fourth item.

  I'll structure each desideratum clearly: requirement first, then the supporting case, then the non-negotiable/camp preference designation. This should give the user exactly what they asked for - five focused analytical tools to evaluate explanations of this paradox in terms of their predictive power for policy interventions.
answer: |-
  1.  **Requirement:** The explanation must predict the *direction of change* in the sex gap as a country becomes richer and more gender-equal. **Case:** A country growing richer and more equal while its gap widens. **Status:** Non-negotiable (Both camps must explain the core observed temporal trend).

  2.  **Requirement:** The explanation must account for *field-specificity* within STEM, allowing for opposing gap directions in different subfields under the same national context. **Case:** A gap running male-dominated in engineering but female-dominated in life sciences within the same country. **Status:** Non-negotiable (The paradox pattern itself varies significantly by field).

  3.  **Requirement:** The explanation must differentiate between *expressed preferences/interests* and *measured skills/attainment* as potential drivers of differential participation, predicting distinct outcomes if interventions target one or the other. **Case:** Self-reported interest parting company with measured attainment. **Status:** Preference (Stronger emphasis for the free-choice camp, as a core tenet is that preferences drive choices).

  4.  **Requirement:** The explanation must incorporate *extrinsic motivators* (pay, status, perceived security) as distinct from intrinsic interest, predicting if interventions changing these motivators would alter participation independent of changing intrinsic preferences. **Case:** Women entering a field because of its pay and status rather than its content. **Status:** Preference (Stronger emphasis for the constraint-exposure camp, highlighting non-preference barriers/inducements). *(Conflict Note: Satisfying this and Desideratum 3 simultaneously may be difficult if an explanation conflates interest with all motivation or attainment).*

  5.  **Requirement:** The explanation must specify the *critical period* or *timing of influence* shaping preferences/choices/opportunities, predicting the impact on the gap for individuals experiencing different sociocultural environments at key developmental stages. **Case:** Children who migrate between countries before adulthood. **Status:** Preference (Stronger emphasis for the constraint-exposure camp, pointing to socialization/cultural learning).
