prompt: |-
  I just joined the clinical ethics committee at my hospital, and I've been reading back thru our last couple years of case notes trying to work out what we actually think, because the case on Thursday dosen't feel like any of the old ones. Here's our record:

  - Mrs H, 84, advanced dementia, appears content, gets a chest infection. Living will written at 62, never updated, refuses ventilation. We honored it and she died.
  - Mr D, 45, unconscious after a crash. At 30 he'd written a directive refusing blood products on religious grounds. At 42, still fully competent, he'd lost the faith and told his family several times that he'd want a transfusion now — but never changed the paperwork. We went with the later wishes, not the document.
  - Ms K, bipolar. During a stable period she wrote a directive refusing ECT and naming her sister as surrogate. In a later depressive episode she begged for ECT. We honored the refusal.
  - Mr R, competent at the time, refused dialysis in writing on the basis that it means being bedbound and in constant pain. That's just wrong, as it turns out. Now in renal failure, mild dementia, has a friend on dialysis and says he wants it. We set the written refusal aside and treated.
  - Mr S, end-stage cardiac disease, no directive, but for years had told everyone "do everything, keep me going." When the time came we declined to do everything — burdens outweighed benefits — and we didn't treat his earlier demand as binding the way we treat earlier refusals.

  New case, Ms N: diagnosed with early Alzheimer's at 66. Six months after the diagnosis, while still legally competent, she wrote a directive refusing antibiotics, tube feeding and hospitalization for anything at all, and added a clause along the lines of "I know people in my situation often settle into a placid, happy version of themselves and then say they want to live. That's not me talking, that's the disease. If I later say I've changed my mind, disregard it." Now 71, mid-stage, in a care home, no memory of writing any of it. Over the past two years the staff say she's built what they describe as a genuinely new life: a close relationship with another resident, a daily routine she clearly enjoys, painting, and she says often and consistently that she's happy and wants to be around as long as possible. Her daughter, who is the surrogate, wants the directive honored. Her partner and the staff want it set aside. Complicating detail: the new interests all started after she was put on a medication for restless legs of a kind that can sometimes produce intense new compulsive preoccupations, and no one can tell how much of the "new life" is her and how much is the drug.

  So: what is this committee going to say? I'm less interested in the verdict itself than in the rules we seem to be running — give me the two or three rules that fit all five of our earlier decisions about as well as each other, say what each of them predicts for Ms N, give me your best guess with the reason you prefer it, and tell me what single further case would most cleanly separate the rules that survive. I'd also like to know whether that clause of hers — the bit trying to pre-emptively cancel her own future change of mind — should do any work at all, given that in Mr D's case we let a later change of mind beat an earlier document.
reasoning: |-
  Okay, the user is a new member of a clinical ethics committee trying to understand the underlying principles guiding their past decisions. They've provided five previous cases and a new complex case involving Ms. N. The user wants to identify consistent rules from the past cases, apply them to Ms. N, and determine the impact of her specific clause about disregarding future changes of mind.

  Looking at the past cases, there's a pattern emerging. In Mrs. H's case, they honored the living will despite her current contentment because her directive was recent and dementia hadn't changed her identity significantly. Mr. D's case shows they prioritized his later verbal statements over an outdated written directive because he had clearly changed his mind while competent. Ms. K's case demonstrates they upheld the advance directive during a depressive episode, likely because her mental illness was episodic and her directive was made during stability. Mr. R's case involved setting aside a refusal based on factual errors about treatment. Mr. S's case shows they didn't treat general requests for treatment as binding like refusals.

  For Ms. N, the committee will likely need to balance several factors: the strength of her directive (written while competent, with specific reasoning), her current quality of life (which appears good), the medication's potential influence on her personality, and that clause attempting to bind future preferences. The medication complication makes this especially tricky - is her "new life" authentic or chemically induced?

  That clause in her directive is particularly interesting. It directly parallels Mr. D's situation but tries to prevent exactly what the committee allowed in his case. The committee will need to decide whether such binding clauses are ethically valid when they conflict with current well-being.

  To test the boundaries of their principles, a hypothetical case where someone writes a directive during depression refusing treatment, then later becomes genuinely happy and wants to live would be revealing. This would isolate the question of whether the committee prioritizes past competent self vs. current well-being when both are "authentic" but conflicting.
answer: |-
  Based on your committee's past decisions, I identify **two core rules** governing how you weigh prior directives against current expressions and circumstances. A third principle emerges regarding the nature of refusals vs. requests:

  1.  **Rule 1: Competent Later Expressions Trump Outdated Written Directives, *Unless* the Directive Addresses a Specific, Foreseeable State of Incapacity.** (Mr. D, Mr. R)
      *   *Mr. D:* The later competent verbal expressions (age 42) overrode the written directive (age 30) because the directive wasn't updated to reflect his *current* competent wishes when he lost his faith.
      *   *Mr. R:* The later expression of desire for dialysis (even with mild dementia) overrode the written refusal because the refusal was based on a factual error ("bedbound and constant pain") that rendered it invalid. His current wish, informed by corrected understanding and observation, held sway.
      *   *Application to Ms. N:* This rule *favors setting aside the directive*. She is currently expressing a consistent desire to live and enjoy her new life. Her directive was written 5 years ago, and her *current* expressions (though with mid-stage dementia) are consistent and reflect her present state. The rule suggests her later expressions (even in dementia) should override the outdated document, especially as her directive's assumptions about her future state (placid, happy) seem partially inaccurate given her reported engagement and happiness.

  2.  **Rule 2: Directives Written to Govern Care During *Specific Anticipated Future States of Incapacity* (e.g., dementia, mania) Are Given Strong Weight, Especially if They Demonstrate Understanding of Potential Future Changes in Preferences and Explicitly Address Them.** (Mrs. H, Ms. K)
      *   *Mrs. H:* The directive refusing ventilation (written at 62, *before* dementia) was honored *even though* she appeared content *in* her dementia state. The directive was understood as governing care *during* that specific incapacity.
      *   *Ms. K:* The directive refusing ECT (written during stability) was honored *during* the depressive episode *even though* she was begging for it *in that episode*. The directive explicitly anticipated and addressed decision-making *during* the unstable state she was experiencing. Her later expression was seen as a symptom of the condition the directive was designed to cover.
      *   *Application to Ms. N:* This rule *strongly favors honoring the directive*. Her directive was written *specifically anticipating and addressing her future dementia state*. It explicitly names the scenario she is now in ("settle into a placid, happy version of themselves") and instructs precisely how to handle her future expressions of changed wishes ("disregard it"). It demonstrates deep reflection on the nature of the disease and its potential impact on her preferences. This aligns perfectly with Ms. K and Mrs. H.

  3.  **Principle 3: Prior *Refusals* of Treatment Are Treated as More Binding Than Prior *Requests* for Treatment.** (Mr. S)
      *   *Mr. S:* His prior consistent verbal requests for "do everything" were *not* treated as binding obligations. The committee weighed current burdens/benefits and decided treatment was inappropriate. This contrasts sharply with how prior refusals (Mrs. H, Ms. K) were upheld. The committee distinguishes the ethical force of saying "no" in advance versus saying "yes".
      *   *Application to Ms. N:* This principle reinforces the weight given to her prior *refusal* (antibiotics, feeding, hospitalization) compared to, say, if she had requested all possible interventions.

  **Ms. N Analysis & Prediction:**

  *   **Rule 1 vs. Rule 2:** This is the core tension. Rule 1 points towards her current happiness and expressions. Rule 2 points towards the specific, anticipatory nature of her directive and its explicit instruction to disregard *exactly* the kind of change she's now expressing.
  *   **Principle 3:** Reinforces that her directive is a refusal, giving it inherent weight.
  *   **The Clause:** This clause is **crucially important** and directly addresses why Mr. D's case is different. Mr. D changed his mind *while still fully competent* but failed to update the paperwork. Ms. N anticipated changing her mind *specifically as a result of the incapacitating disease* and explicitly instructed that those future expressions be disregarded. Her clause demonstrates an understanding of the disease's potential to alter preferences in a way she deemed inauthentic *to her core self*, similar to Ms. K's directive anticipating her depressive state. Honoring this clause aligns with Ms. K and Mrs. H. Ignoring it aligns with Mr. D, but misses the specific disease-anticipation context.
  *   **The Medication:** This complicates the "authenticity" argument. If the "new life" is primarily a drug side-effect, it weakens the argument that her current wishes represent her *core* self and strengthens the case for honoring the pre-medication, disease-anticipating directive. However, proving this causation is difficult. The committee will likely acknowledge the uncertainty but find the directive's specific anticipation of changed wishes due to disease more compelling than potential pharmacological influence.

  **Best Guess Verdict:** Your committee is highly likely to **recommend honoring Ms. N's directive**, including the clause instructing disregard of her current changed wishes.

  *   **Reason:** The directive's **specificity and anticipation** of her current state (mid-stage dementia leading to apparent contentment and changed wishes) and the **explicit instruction** to disregard those future wishes make this case overwhelmingly similar to **Ms. K** (directive anticipating and governing decisions during a bipolar episode) and **Mrs. H** (directive governing care during dementia). The clause directly distinguishes it from **Mr. D** (change while competent, no disease-specific anticipation). **Principle 3** reinforces the binding nature of her refusal. While her current happiness is important, the committee's precedent places greater weight on prior competent directives *specifically designed* to govern care when the patient's decision-making capacity is compromised by a foreseen condition, even if they later express different wishes *arising from that very condition*.

  **The Crucial Test Case:**

  The case that would most cleanly separate Rule 1 (Later Expression) and Rule 2 (Anticipatory Directive) is:

  *   **A patient, while competent and *not* diagnosed with a future incapacitating condition, writes a directive refusing a specific life-sustaining treatment (e.g., ventilation) for a future time *if* they become incompetent. Years later, they develop dementia (or another condition causing incompetence). While incompetent, they express a clear, consistent, and seemingly contented desire *for* the treatment they previously refused. There is *no* clause in the directive addressing potential future changes of mind due to the condition.**

  *   **Rule 1 (Later Expression - Mr. D/Mr. R) would likely favor providing treatment** based on the current expression, as the directive wasn't specifically anticipating and governing this *type* of incapacity-induced change.
  *   **Rule 2 (Anticipatory Directive - Mrs. H/Ms. K) would likely favor honoring the refusal**, as it was a competent refusal intended to apply during incompetence, similar to Mrs. H.
  *   **Your Committee's Likelihood:** Given the weight placed on directives governing incompetence (Mrs. H), they would likely **honor the refusal (Rule 2)**, demonstrating that the *anticipation of incompetence itself* is key, even without the explicit "disregard" clause. This reinforces the distinction from Mr. D (change *while competent*). Ms. N's case strengthens Rule 2 further by adding the explicit clause.
