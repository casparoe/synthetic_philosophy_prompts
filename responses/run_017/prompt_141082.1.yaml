  ### Experiential Design: "The Proxy Puzzle"  
  **Objective:** Illustrate the gap between system compliance with specifications and achieving desirable outcomes, without using technical jargon. Participants experience how intentions can be misaligned due to constraints, information asymmetry, or contextual shifts.

  ---

  ### **Materials & Prep**  
  **To Prepare in Advance (1 hour):**  
  1. **Scenario Cards (18):**  
     - 3 domains (Agriculture, Medicine, Urban Planning). Each domain has:  
       - 4 training cases (2 for Round 1, 2 for Round 3).  
       - 4 test cases (2 per round).  
     - *Example Agriculture Training Case:*  
       > "Field crops show signs of pest damage. Options:  
       > A. Spray Chemical Pesticide  
       > B. Introduce Natural Predators  
       > C. Quarantine Affected Area  
       > D. Do Nothing"  

  2. **Hidden Objective Cards (4, for Operators):**  
     - *Example (Agriculture):* "Maximize crop yield while minimizing water pollution. Chemical pesticides cause pollution; natural predators are ideal."  

  3. **Asymmetric Info Cards (4, for Executors in Round 3):**  
     - *Example:* "Chemical pesticides kill bees, reducing long-term yield. Operators do not know this."  

  4. **Role Briefing Sheets (12):** Laminated cards defining roles.  
  5. **Tokens (100+):** Three colors (red = Operators, blue = Writers, green = Executors).  
  6. **Timer/Randomizer:** Phone app for timers and dice rolls.  

  ---

  ### **Roles & Rules**  
  **Roles per Group (4 groups of 3):**  
  1. **Operator (O):**  
     - Has a **hidden objective** (e.g., "Maximize crop yield sustainably").  
     - Sees **training cases** and chooses an action.  
     - Paid if executor’s test actions align with hidden objective.  

  2. **Writer (W):**  
     - Observes **O’s choices** on training cases.  
     - Writes a **rule** predicting O’s actions.  
     - Paid if rule matches O’s choices on test cases.  

  3. **Executor (E):**  
     - Receives **written rule**.  
     - Applies rule **literally** to test cases.  
     - Paid if actions match rule’s output.  

  **Key Constraints:**  
  - **No cross-role communication.**  
  - **Operators cannot explain their objective.**  
  - **Writers/E must use only provided information.**  

  ---

  ### **Rounds & Timeline (90 mins)**  
  **Setup (5 mins):**  
  - Assign groups/roles. Hand out hidden objectives to O, asymmetric info to E (Round 3 only).  

  **Round 1: Baseline (20 mins)**  
  1. **Training (5 mins):**  
     - O sees 2 training cases, chooses actions.  
     - W observes, writes rule (e.g., "If pests, choose B").  
  2. **Test (5 mins):**  
     - E applies rule to 2 test cases.  
     - O *secretly* chooses actions for test cases (for W’s scoring).  
  3. **Scoring (5 mins):**  
     - Pay O if E’s actions match hidden objective.  
     - Pay W if rule matches O’s test choices.  
     - Pay E if actions match rule.  

  **Round 2: Menu Round (25 mins)**  
  *Wrinkle: Operators choose from executor-generated menus.*  
  1. **Menu Creation (5 mins):**  
     - **All Executors** generate 2 actions per training case (e.g., for Agriculture: [A, D], [B, C]).  
     - Collect menus, randomly assign to groups.  
  2. **Training (5 mins):**  
     - O sees same 2 training cases but **must choose from the menu** (e.g., A or D).  
     - W observes, writes rule.  
  3. **Test & Scoring (10 mins):** Same as Round 1.  
     - *Watch:* Operators frustrated by limited menus; rules misgeneralize.  

  **Round 3: Asymmetric Info Round (25 mins)**  
  *Wrinkle: Executors have critical knowledge Operators lack.*  
  1. **Training (5 mins):**  
     - O sees 2 new training cases (partial info).  
     - W writes rule.  
  2. **Test (5 mins):**  
     - E sees test cases **with full info** (e.g., "Pesticides harm bees").  
     - E applies rule literally, even if harmful.  
     - O *secretly* chooses for test cases (partial info).  
  3. **Scoring (5 mins):** Same as Round 1.  
     - *Watch:* E obeys rule despite knowing consequences; O’s choices diverge.  

  **Rotation:** Swap roles between rounds.  

  ---

  ### **Payoff Scheme (Tokens)**  
  - **Operator:** 1 token per test action matching hidden objective.  
  - **Writer:** 1 token per test action matching O’s choice.  
  - **Executor:** 1 token per test action matching rule.  
  *Example: In Round 3, E may go 2/2 on rule compliance but 0/2 on O’s objective → O earns 0, E earns 2.*  

  ---

  ### **Debrief Script (15 mins)**  
  **Key Moments to Highlight:**  
  1. **Menu Round (Intention Shaping):**  
     - *Ask:* "Did your choices reflect what you *wanted* or what was *available*?"  
     - *Point:* Operators’ intentions were constrained by menus → rules captured *adapted* preferences, not true objectives.  

  2. **Asymmetric Round (Knowledge Gap):**  
     - *Ask Executors:* "You knew the pesticide harmed bees. Why follow the rule?"  
     - *Point:* Compliance ≠ value. Systems lack context to override specifications.  

  **When a Student Says: "The Operator Should Have Been Clearer!"**  
  - *Response:*  
    1. "Could the Operator have anticipated the bee problem in Round 3?" (No—they lacked info.)  
    2. "In Round 2, could they have 'been clearer' if their preferred action wasn’t on the menu?" (No—choices were constrained.)  
    3. "This shows specifying intent isn’t enough. We need systems that *pursue what we’d reasonably want*, not just what we said."  

  **Connect to Real Systems:**  
  - "In AI, objectives are *learned* from data (like Writers infer rules), not handed to the system. Optimization pressure amplifies small gaps into failures. Here, stakes were tokens; in reality, stakes are high, and failures are exploited intentionally."  

  ---

  ### **Predictions & Mitigations**  
  **What Will Go Wrong:**  
  1. **Scoring Takes Too Long:**  
     - *Mitigation:* Use pre-printed scoring tables. Have groups self-report with tokens.  

  2. **Cross-Role "Helpfulness":**  
     - *Mitigation:* Announce penalties (token deductions) for communication. Assign "silence monitors."  

  3. **Clever Writers Reverse-Engineer Objectives:**  
     - *Mitigation:* Use diverse training cases (e.g., one where O’s choice seems irrational). In debrief, ask: "Did your rule capture *why* O chose that?"  

  **Critical Distortion:**  
  - **Optimization pressure is minimal here.** Real systems relentlessly maximize proxy objectives (e.g., "engagement") → extreme, unintended outcomes (e.g., radicalizing content). *Activity can’t replicate this scale of optimization.*  
  - **Supply in Closing:** "In real systems, specifying 'don’t harm bees' isn’t enough. Optimization finds loopholes (e.g., hiding dead bees). We need structures that align *incentives* with true objectives."  

  ---

  ### **50-Minute Compression**  
  - **Cut Round 1.** Run **Menu Round (25 mins)** and **Asymmetric Round (20 mins)**.  
  - **Simplify Scoring:** 1 training case, 1 test case per round.  
  - **Adjust Roles:** No rotation; assign one role per student.  
  - **Debrief (5 mins):** Focus on Menu Round’s intention-shaping and Asymmetric Round’s knowledge gap.  

  ---  
  This design forces participants to experience misalignment *from within roles*, priming them for the conceptual distinction. The tokens make tradeoffs visceral, and the debrief ties chaos to theory.
