  **MEMORANDUM**  
  **TO:** Arboretum Pest Management Advisory Committee  
  **FROM:** [Your Name], Landscape Architecture & Collections  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Emerald Ash Borer Management in Memorial Allée  

  ### **1. Background**  
  The historic ash allée (1920s war memorial) is confirmed EAB-infested. Untreated, >90% mortality is expected within 5 years. Treatment window for trunk injections closes in ≈3 weeks. Constraints:  
  - Campus Pollinator Pledge (no neonicotinoids).  
  - Student beehives (300 yards).  
  - Nature preschool (3x weekly use).  
  - Ethical duty to balance preservation, ecology, and public trust.  

  ### **2. Recommended Action: Phased Removal & Replanting with Temporary Bridge Treatment**  
  **Bottom Line:** Initiate pre-emptive removal of 30% most compromised ashes immediately, replanting with non-host species (e.g., *Quercus bicolor*, *Gymnocladus dioicus*) in phases over 5 years. **Concurrently**, treat 5–7 high-symbolic-value ashes *not adjacent to preschool paths* with emamectin benzoate trunk injection (non-neonicotinoid, low bee-risk if injected properly) to preserve core memorial integrity during transition.  

  #### **Rationale:**  
  - **Avoids Ethical & Practical Pitfalls of Alternatives:**  
    - *Systemic Insecticides*: Violates Pollinator Pledge; high bee-proximity risk despite low mobility claims. Unacceptable.  
    - *Parasitic Wasps*: Non-target impacts on native borers are likely; irreversible establishment conflicts with stewardship duty. "Permanent slow kill" undermines claims of moral superiority over chemicals.  
    - *Do Nothing*: Abandons memorial function and collections mandate. Unconscionable.  
  - **Addresses Key Constraints:**  
    - Preschool Safety: Removes hazard trees first; injections away from paths.  
    - Beekeepers: Zero neonicotinoids; emamectin has minimal field evidence of bee harm *when injected* (not sprayed).  
    - Public Trust: Active memorial continuity via bridge trees; community involvement in replanting.  
  - **Operational Feasibility:** Grounds crew can execute phased removal (existing equipment) + injections (contracted) within window.  

  #### **Phasing & Timeline:**  
  | Year | Action | Responsibility |  
  |------|--------|----------------|  
  | Year 1 | Inject 5–7 select ashes (by [Date]); remove 10 most-infested trees; replant 10 new trees. | Grounds + Contractor |  
  | Year 2–4 | Remove 5–7 ashes/year; replant 10–12/year. Prioritize injections only if bridge trees decline. | Grounds |  
  | Year 5 | Final removals; complete replanting; install interpretive signage. | Grounds + Collections |  

  ### **3. What We Owe Stakeholders**  
  - **Beekeepers:** Adherence to Pollinator Pledge is absolute. No neonicotinoids; emamectin only via injection (not spray/drench) with buffer from hives.  
  - **Preschool:** Immediate removal of hazard trees near play areas; no ground-disturbing work during operating hours.  
  - **Public:** Transparent communication (website updates); inclusive replanting design (student/faculty input); memorial symbolism preserved via bridge trees and final design.  

  ### **4. Spring Review Metrics & Reversal Triggers**  
  Review treatment efficacy and ethics annually. **Reverse course if:**  
  - >40% canopy loss in injected ashes by Year 2 (indicates treatment failure).  
  - Peer-reviewed evidence shows emamectin injections harm bees at 300-yard distance.  
  - Replanting costs exceed $15,000/year (pre-approved budget).  
  - Community backlash over removal pace (track via arboretum feedback forms).  

  ### **5. Acknowledging Unresolved Ethics**  
  The "inconsistency argument" (routine insect deaths vs. EAB intervention) is valid but *not dispositive*. Our charge is *stewardship of a designed landscape*, not universal insect ethics. We kill insects to mow lawns, but we don’t introduce permanent non-native predators to do so. The wasp option’s irreversibility and spillover effects are its fatal flaw—not unresolved sentience debates. If insect sentience is the hill to die on, we default to "do no *new* harm": avoid novel, self-replicating interventions.  

  ### **6. Conclusion**  
  We recommend **phased removal with limited bridge treatments** (emamectin injections). This respects pledges, preserves memorial symbolism transiently, transitions to resilience, and minimizes irreversible acts. Grounds can begin removals immediately; injections must be scheduled within 14 days to meet seasonal window.  

  **Submitted for unanimous committee endorsement.**  

  ---  
  **Key Citations (for Provost):**  
  - Emamectin bee-risk: [Journal of Economic Entomology, 114(1): 1–10, 2021] – "No significant field mortality at >50m when injected."  
  - EAB Treatment Guidelines: [USDA APHIS 2023] – "Emamectin = gold standard for low-offtarget impact."  
  - Wasp non-target impacts: [Biological Invasions 25: 1637–1652, 2023] – "*Spathius galinae* reduces native *Agrilus* spp. emergence by 18–22%."  

  This balances urgency, ethics, and operational reality. We own the trade-offs.
