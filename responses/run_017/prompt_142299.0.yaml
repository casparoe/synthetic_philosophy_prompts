answer: |-
  ## Research Proposal: The Modal Character and Duties of Preservation in Interactive Fictions

  **Applicant:** [Your Name], Novelist-in-Residence Candidate  
  **Fellowship:** Six-Month Writing Fellowship, [Philosophy Department Name]  
  **Project Title:** Preserving Potential: Duties Towards the Modal Character in Video Game Narratives  

  ### 1. Introduction & Research Question
  My novel-in-progress centres on a woman who, grieving her brother's death, obsessively replays an old role-playing game. Within it, a companion character faces a scripted, unavoidable demise. She becomes convinced that by perpetually avoiding this narrative juncture – forever preserving the companion alive within her single save file – she discharges a profound, albeit displaced, duty *to* her deceased brother. This narrative core hinges on a precise philosophical ambiguity: **Is the object of any putative duties towards a video game character the character *as encountered* within a single, actualised playthrough (the "run-relative character"), or is it the character *as the entire branching tree of its possible existences* made available by the game's structure (the "modal character")?** My protagonist implicitly acts upon the latter conception. This research aims to rigorously articulate and evaluate this distinction, moving beyond stock philosophical responses to determine whether her belief constitutes a specific, identifiable form of delusion, and if so, precisely wherein that delusion lies.

  ### 2. Context & Gap in Existing Discourse
  Discourse on duties towards fictional entities, particularly digital ones, typically polarises:

  1.  **The Dismissive Position:** Asserts no duties are owed to the character *itself*, as it lacks independent existence or moral patiency. Any ethical consideration pertains solely to the player's own psychological dispositions, the game's designers, or real-world consequences of play (e.g., desensitisation). This position implicitly treats the character as *only* the run-relative entity encountered.
  2.  **The Sentience-Conditional Position:** Argues that *if* sufficiently sophisticated AI simulated sentience or consciousness, duties *might* arise. However, this focuses overwhelmingly on the character's *present state* within a run (its suffering, autonomy within that instance) and the conditions for it being a moral patient *now*. It presupposes the run-relative character as the primary locus of concern.

  **The Gap:** Both positions sidestep the ontological richness of interactive fictions: characters are not *only* their instantiated state in a given run, but also the *sum of their unrealised possibilities* defined by the game's code and branching structure. The modal character encompasses all potential narrative arcs, endings, relationships, and developments the game allows. My suspicion is that focusing on the modal character reveals a distinct potential ground for duties: **duties of preservation concerning the character's *possible flourishing*.** Specifically, the hypothesis is that certain playthroughs can be "worse" for the modal character not by causing it suffering *within that run* (it may be "happy" until death), but by *wastefully foreclosing* avenues of potential development, richness, or meaningful existence that the game's structure inherently permits. My protagonist's act of preserving the companion *in stasis* might be seen, from this perspective, not as fulfilling a duty *to* the character (run-relative or modal), but as a profound *failure* to engage with its modal possibilities, mistaking stasis for preservation of potential.

  ### 3. Research Aims & Objectives
  *   **Primary Aim:** To articulate and evaluate the distinction between the run-relative character and the modal character as distinct objects of potential ethical concern within interactive fictions.
  *   **Secondary Aim:** To determine whether the concept of a "duty of preservation" towards the *modal character* (specifically concerning the realisation of its potential flourishing) is coherent and distinct from duties concerning the run-relative character's welfare or sentience.
  *   **Specific Objectives:**
      1.  Define rigorously the concepts "run-relative character" and "modal character".
      2.  Analyse how existing dismissive and sentience-conditional positions presuppose the run-relative character.
      3.  Articulate the hypothesis that duties towards the modal character concern the avoidance of "wasted potential" across possible playthroughs.
      4.  Test this hypothesis against diverse game structures through case studies.
      5.  Precisely characterise the nature of any potential delusion inherent in acts like my protagonist's, based on the findings.

  ### 4. Methodology: Case Study Analysis
  Given the six-month timeframe and the project's grounding in narrative structure rather than consciousness theory, the research will employ a method of close philosophical analysis applied to **five distinct, worked case studies** of video game companion mechanics. This avoids broad surveys, focusing instead on the structural logic of potentiality:

  1.  **Fixed Scripted Death (e.g., Aerith Gainsborough, *Final Fantasy VII*):** The companion *must* die in all playthroughs. Analysis: Does preserving a "pre-death" save honour the modal character's potential? Or is this potential *inherently tragic*, meaning all runs are equally "wasteful"? Does the modal character *have* meaningful potential beyond its doomed arc?
  2.  **Branching Romance/Influence (e.g., Alistair, *Dragon Age: Origins*):** The companion's personality, survival, and ultimate fate vary drastically based on player choices. Analysis: Is the modal character "harmed" by playthroughs where its potential for deep relationships or specific positive outcomes is unrealised? Does a "bad end" for the companion waste its modal potential more than a "good end"?
  3.  **Permadeath Run (e.g., *XCOM* series soldiers):** The companion can permanently die due to player action or chance *at any point*, irrevocably ending its narrative. Analysis: Does the *early* death of a companion with significant potential development paths constitute a greater waste for the modal character than a death occurring after extensive development? Does reloading to prevent permadeath serve the modal character's potential?
  4.  **Procedurally Generated Companion (e.g., *RimWorld* pawns):** Companions are algorithmically generated, possessing unique but constrained sets of traits and potentials. Analysis: How does the modal character concept apply when possibilities are emergent and highly variable? Is "wasted potential" more acute when a unique combination of traits fails to develop meaningfully?
  5.  **Delayable but Inevitable Fate (e.g., *To the Moon* themes - adapted):** A companion's demise is certain but can be postponed indefinitely by avoiding triggers. Analysis: **This directly mirrors my protagonist's situation.** Does perpetual delay preserve the modal character's potential or merely trap it in stasis? Is the potential intrinsically linked to the *possibility* of its conclusion?

  **Method:** For each case study:
  *   Describe the game mechanics defining the companion's possibilities and constraints.
  *   Analyse the nature of the modal character's potential flourishing within those constraints.
  *   Evaluate whether specific playthrough types (e.g., early death, negative outcome, perpetual stasis) constitute a "waste" of this modal potential, distinct from in-run suffering.
  *   Assess whether this analysis supports the notion of a distinct duty towards the *modal character* concerning the realisation or preservation of its potential.

  ### 5. Expected Outcomes & Evaluation
  *   **Positive Result:** A robust articulation of the run-relative/modal distinction and a coherent framework demonstrating that "wasted modal potential" constitutes a distinct ethical category for interactive fictions, irreducible to run-relative suffering or real-world consequences. This would provide a precise philosophical vocabulary for my protagonist's belief and its potential flaws. Her delusion might lie in conflating *preserving a static instance* (run-relative) with *honouring the full potential* (modal), or in misidentifying the *object* of her displaced duty.
  *   **Negative Result:** The analysis concludes that "wasted modal potential" is either incoherent, reducible to existing categories (run-relative harm or designer intent), or fails to generate any meaningful sense of duty distinct from aesthetic preferences. This would strongly suggest my protagonist is deluded in a specific way: her belief hinges on an unsupportable ontological or ethical category.
  *   **Failure Criteria:** The project fails if it cannot move beyond re-stating the dismissive or sentience-conditional positions; if the run-relative/modal distinction proves philosophically untenable or barren for the specific question of duties; or if the case studies fail to yield clear insights due to overly broad or inconsistent analysis.
  *   **Success Criteria:** The project succeeds if it produces a clear, novel philosophical framework for understanding duties in interactive fiction centred on potentiality, articulated with sufficient precision to critically evaluate scenarios like my protagonist's, and documented within the fellowship period to directly inform the novel's philosophical texture.

  ### 6. Scope, Timeline & Novel Context
  *   **Scope Limits:** The research focuses solely on *player duties towards non-player character (NPC) companions* within *narratively rich, choice-driven video games*. It excludes:
      *   Questions of AI consciousness/sentience (bracketed as per the sentience-conditional critique).
      *   Duties towards non-companion NPCs, player characters, or purely abstract game entities.
      *   Comprehensive literature reviews on simulation ethics or general philosophy of fiction.
      *   Player psychology or real-world behavioural impacts (beyond their relevance to the protagonist's specific belief structure).
      *   Games lacking consequential narrative branching or companion mechanics.
  *   **Timeline (6 Months):**
      *   Month 1: Refine definitions, finalise case study selection & parameters.
      *   Months 2-4: Conduct in-depth analysis of each case study (approx. 2 weeks per study).
      *   Month 5: Synthesise findings, articulate the positive/negative framework regarding duties to the modal character, define the nature of potential delusion.
      *   Month 6: Integrate findings into novel draft, finalise research documentation.
  *   **Novel Context:** This research is intrinsically linked to the novel's core theme. The findings will directly inform the philosophical depth and internal logic of the protagonist's obsession, allowing her thoughts (and the narrative's perspective) to engage with the run-relative/modal distinction and the concept of wasted potential in a concrete, non-gestural manner. It will clarify whether her belief is a poignant engagement with unrealised possibility, a fundamental category error, or a complex mixture requiring nuanced portrayal.

  **Conclusion**
  This project seeks to carve out a novel philosophical space concerning ethics in interactive fiction by rigorously examining the ontology of the video game character. By shifting focus from the instantiated run to the branching modal tree, and from sentience to potential flourishing, it aims to answer a specific, narratively vital question: does my protagonist honour or betray her virtual companion – and, by proxy, her brother – by keeping him forever suspended before the fall? The answer lies not in consciousness, but in the complex ethics of unrealised possibility.
