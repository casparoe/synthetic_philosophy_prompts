answer: |-
  Below is a complete, runnable activity for your 75-minute seminar on Jeffrey conditionalization and uncertain evidence. The design focuses on experiential learning, with students encountering the key ideas through a structured game involving hidden states, evidence channels, and proper scoring. The activity avoids formal terminology until the debrief and ensures student-generated data reveals the core insights.

  ---

  ### **1. Props and Procedure**
  **Props Needed:**
  - **Index cards:** 16 sets (each set: two cards per student per round, pre-labeled "H" and "E").
  - **Markers:** For students to write credences on cards.
  - **Dice:** Two six-sided dice for randomization (transparent and fair).
  - **Whiteboard:** Divided into sections for instructions, a leaderboard, and scatter plots.
  - **Projector:** To display the prior joint distribution (constant throughout).
  - **Instructor's phone:** Timer only.
  - **Prize:** Trivial (e.g., a pack of gum) for highest score.

  **Preparation (Before Class):**
  - **Hidden state (H) and evidence (E):** Binary variables: H = hypothesis (e.g., "The AI is hostile"), E = evidence proposition (e.g., "Sensor reports threat").  
  - **Joint distribution (fixed):**  
    - P(H=true) = 0.5, P(E=true | H=true) = 0.8, P(E=true | H=false) = 0.3.  
    - Computed priors: P(E=true) = (0.8 × 0.5) + (0.3 × 0.5) = 0.55; P(H=true | E=true) = (0.8 × 0.5) / 0.55 ≈ 0.727; P(H=true | E=false) = (0.2 × 0.5) / 0.45 ≈ 0.222.  
    - Display this on the projector (no formulas, just the numbers: P(H), P(E|H), P(E|¬H)).
  - **Randomization protocol:**  
    - **True state (H):** Roll one die. Odd: H=false; Even: H=true.  
    - **Evidence channels:** Use two dice to generate a number 1-36 (percentile). Pre-defined tables (see **8. Answer Key**) map dice rolls to outcomes for each channel. Tables are shared with students during the reveal for transparency.  
  - **Student materials:** Index cards bundled by round (Round 1: 32 cards, 2 per student; etc.). 

  **Procedure for Honesty:**  
  - At the start, show students the dice and tables. After all rounds, reroll key dice rolls publicly to verify outcomes match the tables. Save all student cards as artifacts.

  ---

  ### **2. Rounds and Timeline (75 min total)**
  **Setup (5 min):**  
  - Explain the game: "You are security analysts. A hidden state H (hostile AI: yes/no) generates sensor reports. You'll see indirect evidence about a report E (sensor says threat: yes/no) and must track your credence in H and E. You earn points for accuracy."  
  - Project the prior distribution. No formulas, just: "Initial P(H=true) = 0.5, P(E=true if H=true) = 0.8, etc."  
  - Demo scoring: Quadratic scoring (e.g., if H=true and you say p=0.7, score = 1 - (1-0.7)² = 0.91).  
  - **Commitment rule:** Students write credences *individually* on cards *before* discussion. No talking until all cards are collected.

  #### **Round 1: Control Round — Hard Evidence (15 min)**  
  - **Goal:** Show standard conditionalization.  
  - **Narrative:** "You see the sensor report directly: It says E=true or E=false."  
  - **Procedure:**  
    - Roll dice to determine true H and E (use joint distribution tables).  
    - Announce E publicly (e.g., "The sensor report says: Threat detected").  
    - Students write their name, credence in H (P(H)), and credence in E (P(E)) on cards. (Since E is certain, P(E) should be 1; P(H) should equal P(H|E)).  
  - **Expected outcome:** All P(E) ≈ 1; P(H) clusters near 0.727 if E=true, or 0.222 if E=false.

  #### **Round 2: Soft Evidence — Weighted-Average Rule (20 min)**  
  - **Goal:** Students intuit the weighted average naturally.  
  - **Narrative:** "The sensor report is blurry. You see a light that is green if E=true, red if E=false, but it's foggy. Your confidence in E is 0.7."  
  - **Channel:** Noisy but uninformative about reliability.  
    - True E is randomized (from joint distribution).  
    - Students receive: "The light is green, but you estimate P(E=true) = 0.7."  
  - **Procedure:**  
    - Roll for true H and E.  
    - Students write P(H) and P(E) on cards. (P(E) should be 0.7; P(H) should be [P(H|E) × 0.7] + [P(H|¬E) × 0.3] ≈ (0.727×0.7) + (0.222×0.3) ≈ 0.58).  
  - **Expected outcome:** P(E) clusters near 0.7; P(H) clusters near 0.58 (weighted average).

  #### **Round 3: Split Evidence — Rigidity Violation (25 min)**  
  - **Goal:** Two groups get the same P(E)=0.7 but different P(H) due to channel differences.  
  - **Narrative (Group 1):** "The light is green, but foggy (P(E=true)=0.7)." *Same as Round 2.*  
  - **Narrative (Group 2):** "The light is green, but you also learn the sensor was hacked. Hackers force green lights 70% of the time regardless of E. Your confidence in E is still 0.7."  
    - *Channel 2 carries info about reliability (hack affects P(H|E)).*  
  - **Procedure:**  
    - Split class: 8 students Group 1, 8 Group 2 (assign secretly).  
    - Roll for true H and E (same for both groups).  
    - Deliver narratives separately (whisper/note to groups).  
    - Students write P(H) and P(E).  
  - **Expected outcome:**  
    - Group 1 (fog): P(E)≈0.7, P(H)≈0.58 (weighted average).  
    - Group 2 (hack): P(E)≈0.7, but P(H)≈0.5 (since hackers decouple E and H).  
  - **Key:** True E is fixed from roll, but channels affect beliefs differently.

  ---

  ### **3. Scoring Scheme**
  - **Quadratic scoring rule (binary events):**  
    - If event true: Score = 1 - (1 - p)²  
    - If event false: Score = 1 - p²  
    - (Scores normalized to [0,1]; max 1 per event.)  
  - **Elicit two numbers (P(H) and P(E)):**  
    - Prevents gaming: Scores for H and E are independent. A student cannot sacrifice one to inflate the other.  
    - Total score per round = Score_H + Score_E (max 2).  
  - **Aggregation:**  
    - Scores recorded per round; cumulative across rounds (max 6).  
    - Leaderboard updated after each round (motivates engagement).  
  - **Why quadratic?**  
    - Proper (incentivizes honest reporting).  
    - Computationally simple (no logs).  
    - Intuitive (penalizes over/underconfidence).

  ---

  ### **4. Reveal and Board Artifact**  
  - **After Round 3:**  
    - Collect all cards. On whiteboard, create a scatter plot:  
      - X-axis: P(E) (0 to 1).  
      - Y-axis: P(H) (0 to 1).  
      - Label Group 1 and Group 2 dots differently (e.g., circles vs. triangles).  
    - Plot all student submissions (dots for Round 3 only).  
    - **Do not draw any reference lines yet.**  
  - **Stimulate self-discovery:**  
    - Ask: "What patterns do you see? Why are there two clusters?"  
    - Let students notice: Group 1 (fog) has lower P(H) than Group 2 (hack), despite same P(E).  
  - **Add the reference line:**  
    - Draw the "weighted-average line": P(H) = [P(H|E) × P(E)] + [P(H|¬E) × (1 - P(E))] ≈ 0.727P(E) + 0.222(1 - P(E)).  
    - Plot it as a diagonal (e.g., when P(E)=0, P(H)=0.222; P(E)=1, P(H)=0.727).  
  - **Key moment:** Students see Group 1 on the line, Group 2 off it (hack cluster at P(H)≈0.5, P(E)≈0.7).  
  - **What to say:** "Interesting. Same P(E), but different P(H). Why might that be?" *Then stop. Let them discuss in pairs (2 min).*

  ---

  ### **5. Debrief (15 min)**  
  **Order and mapping:**  
  1. **Uncertain evidence (5 min):**  
     - "In Round 1, E was certain. In Rounds 2-3, it wasn’t. That’s common in real life (e.g., blurry images, vague testimony)."  
     - Map to Round 2: "You averaged P(H|E) and P(H|¬E) weighted by P(E) and P(¬E). That’s a natural generalization."  
     - **Reasonable error:** Some Round 2 P(H) near 0.727 (over-certainty). Say: "Understandable—old habits kick in."  

  2. **Weighted-average rule (5 min):**  
     - Introduce formula: P_new(H) = P_old(H|E) × P_new(E) + P_old(H|¬E) × P_new(¬E).  
     - "It worked in Round 2 (fog) but not Round 3 (hack). Why? It assumes P_old(H|E) and P_old(H|¬E) don’t change—called *rigidity*."  

  3. **Rigidity failure (5 min):**  
     - "Round 3’s hack changed how E relates to H. Group 2’s channel implied P(H|E) is less informative, so rigidity was violated."  
     - Terminologies: **Jeffrey conditionalization** (the rule), **probability kinematics** (updating beliefs), **rigidity** (key assumption).  
     - **Reasonable error:** Group 1 using rigidity in Round 3 (correct) vs. Group 2 not using it (also correct).  

  **Final point:** "Real evidence isn’t just about P_new(E)—it’s about *how* you learned it. The weighted average isn’t universal."  

  ---

  ### **6. What Will Go Wrong (and Fixes)**  
  - **Comprehension failure:** Students confuse P(H) and P(E).  
    - *Fix:* Use clear labels ("H: AI hostile", "E: Sensor says threat"). Repeat narratives.  
  - **Arithmetic errors:** Probability trees miscomputed.  
    - *Fix:* Provide calculators or allow approximations (e.g., 0.58 for Round 2).  
  - **Attention drift:** Slow card-writing delays rounds.  
    - *Fix:* Use phone timer (1 min to write cards). Announce: "10 seconds left!"  
  - **Staging issues:** Group assignments chaotic.  
    - *Fix:* Pre-assign groups (e.g., by seating).  
  - **Scoring confusion:** Students don’t grasp quadratic rule.  
    - *Fix:* Pre-round 1 demo: "If H=true and p=0.7, score=0.91; if false, score=0.51."  

  ---

  ### **7. Limitations and Lecture Supplements**  
  **Activity misrepresents reality by assuming:**  
  - Clean partitions (E/¬E is given). Real agents define partitions contextually.  
  - Known joint distributions. Real agents have vague priors.  
  - Precise P_new(E). Real agents have fuzzy confidence.  

  **Post-activity lecture must cover:**  
  - How to choose partitions (e.g., minimal, natural).  
  - Dealing with vague priors (sensitivity analysis).  
  - Cases where rigidity fails (e.g., learning about evidence reliability).  

  ---

  ### **8. Answer Key and Parameters**  
  **Prior joint distribution (fixed):**  
  - P(H=true) = 0.5  
  - P(E=true | H=true) = 0.8 → P(E=false | H=true) = 0.2  
  - P(E=true | H=false) = 0.3 → P(E=false | H=false) = 0.7  
  - Derived:  
    - P(E=true) = (0.8)(0.5) + (0.3)(0.5) = 0.55  
    - P(H=true | E=true) = [(0.8)(0.5)] / 0.55 ≈ 0.727  
    - P(H=true | E=false) = [(0.2)(0.5)] / 0.45 ≈ 0.222  

  **Round 1 (Hard evidence):**  
  - If E=true: Correct P(H) = 0.727, P(E) = 1.0  
  - If E=false: Correct P(H) = 0.222, P(E) = 0.0  

  **Round 2 (Fog channel):**  
  - P_new(E) = 0.7 (given)  
  - P_new(H) = [P(H|E) × 0.7] + [P(H|¬E) × 0.3] ≈ (0.727×0.7) + (0.222×0.3) = 0.509 + 0.067 = 0.576  

  **Round 3 (Split):**  
  - **Group 1 (Fog):** Same as Round 2. P(E)=0.7, P(H)≈0.576  
  - **Group 2 (Hack):**  
    - Hack narrative implies E is independent of H (P(H|E) ≈ P(H) = 0.5).  
    - Correct: P(E)=0.7 (given), P(H)=0.5 (since hack breaks E-H link).  
  - **Sensitivity:**  
    - Gap between groups: |0.576 - 0.5| = 0.076. Adjust by changing P(hack effect):  
      - Larger gap: Make hack more decoupling (e.g., "hackers make E random").  
      - Smaller gap: Reduce P(hack) or weaken decoupling.  

  **Randomization tables (dice 1-36):**  
  - **True H:** Roll die 1: 1-3 = false, 4-6 = true.  
  - **True E (given H):**  
    - If H=true: Roll die 2: 1-16 = E=false, 17-36 = E=true (P(E=true|H=true)=20/36≈0.556 ≈0.55? Wait, but we need 0.8. Adjust:  
      - Better: Use percentile dice (two dice: sum 2-12, map to 1-36). Define:  
        - If H=true: E=true if dice ≥ 5 (P=32/36≈0.89? Not 0.8).  
      - Adjustment: Use a table. For H=true, E=true on 80% of rolls (e.g., dice 1-28: E=true; 29-36: E=false). Similarly for H=false.  

  **Dice table example:**  
  - True H: Die 1, odd = H=false, even = H=true.  
  - True E: Two dice, sum 2-12. Precomputed:  
    - If H=true: E=true if sum ≤ 10 (P≈0.83, close to 0.8).  
    - If H=false: E=true if sum ≤ 4 (P≈0.17, close to 0.3).  
    (Exact: P(sum≤10)=33/36≈0.917; adjust by redefining thresholds.)  

  ---

  ### **9. Order Sensitivity Variant**  
  **Cannot be cleanly implemented here.**  
  - **Why:** Jeffrey updates commute if rigidity holds. Order effects imply rigidity violations, but our final round already shows this via channel differences. Adding order would:  
    - Overcomplicate (students juggle two evidence channels).  
    - Require sequential updates within 75 min (time crunch).  
    - Dilute the core insight (rigidity failure).  
  - **Alternative:** Mention order effects in debrief as a consequence of rigidity violations.  

  ---

  **Activity Flow Summary:**  
  - 0-5 min: Setup and scoring demo.  
  - 5-20 min: Round 1 (hard evidence).  
  - 20-40 min: Round 2 (soft evidence).  
  - 40-65 min: Round 3 (split evidence).  
  - 65-70 min: Reveal and scatter plot.  
  - 70-75 min: Debrief and terminology.  

  This design ensures students experience uncertain evidence, discover the weighted-average rule, and confront rigidity failures—all without formal jargon. The scatter plot and group split create a memorable "aha!" moment, setting up a rigorous debrief.
