prompt: |-
  Me and my friend just spent way too long arguing about this after a seminar, so I want a tiebreaker. Setup: a Davidsonian radical interpreter gets unlimited evidence of exactly the kind Davidson allows — which sentences the speaker holds true, and under which circumstances — but no neural data, no info about the architecture, no training corpus. The speaker is a large language model, and we're letting "would produce this sentence in this context" stand in for holding-true. The proposition I want a number on: in that setup, the interpreter ends up with a single admissible T-theory in the relevant sense — no two admissible theories disagree about the truth conditions of any whole sentence, once inscrutability of reference is set aside as a seperate fight. My friend says 0.7, I'm at 0.2.

  Give me your number, but decomposed, not bare: how much rides on whether the production-probability proxy is evidentially equivalent to holding-true, how much on whether charity has anything to bite on when there's no real triangulation with a shared world, how much on whether holism plus charity pins things down even in the ordinary human case, and whatever other terms you think belong. A number and one line of justification each, then the combination. Then tell me which of those terms me and my friend are most likely actually disagreeing about, and what single experiment you'd run on the model to move your number most. Don't just tell me it depends on what you mean by interpretation.
