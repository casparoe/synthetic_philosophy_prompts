  2) Have the holist (Alex) press on Quinean grounds: all revision is conceptual change, no special "meaning truth" exists
  3) Let the defender (Sam) concede some epistemological limitations but maintain a minimal semantic distinction
  4) Introduce the critical conflict scenario to test both positions

  Key dialectical moves:
  - Alex must argue entrenchment explains all phenomena without analyticity
  - Sam must show why "changing the subject" isn't just another belief revision
  - The conflict case should expose whether abandoning a charter sentence feels like discovery or legislation

  For the closing note, I'll highlight:
