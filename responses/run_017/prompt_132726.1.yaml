     We are a random ticket holder.
     Likelihood of A: P(we are a winner | A) = fraction of winners in A = 0.5
     Likelihood of B: = 0.1
     Likelihood ratio A to B = 0.5 / 0.1 = 5

     Posterior odds = prior * 5 = 5:1 in favor of A.

  SIA:
     The anthropic likelihood of a hypothesis is proportional to the number of winning tickets in that hypothesis (because we are a winning ticket holder, and SIA says the probability of being a winning ticket holder is proportional to the number of winning tickets).

