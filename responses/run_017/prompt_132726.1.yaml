    Wait, is that correct? In B, we are in a particular regional lottery. The fraction in our regional lottery is 0.1. But if we are a random lottery ticket holder in the world, then in B there are 1e9 tickets, and we could be in any of them. The fraction of winners in the entire set is 0.1, so it's the same as in one regional lottery.

