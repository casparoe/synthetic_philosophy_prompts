  What happens when we make the fractions equal? Suppose in both hypotheses, the fraction of winners is 0.5.

  For example, in hypothesis B, change to 50% winning tickets per urn: then num_B_E = 1,000 * 500,000 = 500,000,000, fraction=0.5.

  Then SSA: likelihood ratio = (0.5)/(0.5)=1.
  SIA: likelihood ratio = 500,000 / 500,000,000 = 0.001 -> favors B, but now SSA is neutral while SIA favors B. This is the presumptuous philosopher form: SIA is more confident in the world with more winners.

  Now, reference class: what if we change the reference class?

