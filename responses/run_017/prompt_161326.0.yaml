prompt: |-
  You are a philosopher of action who works on both weakness of will and intertemporal choice, and who is used to being asked for criteria rather than opinions. Think the problem through carefully: before you write, brainstorm the full candidate list of requirements and cut the ones that are only slogans of one school.

  I write fiction, and a scene I cannot make work turns on an accusation. One character tells another that her unfinished novel is not something she merely has not written but something she is failing to write — that this is weakness, not a change of priorities, not fear, not a compulsion she cannot resist. I need to know what a theory of weakness of will would have to get right for that accusation to be more than rhetoric. So write me the specification: the requirements an account must meet to be good enough to adjudicate a case like mine.

  Fix the purpose as that one: a theory able to separate weakness from compulsion or addiction, from self-deception about what one really wants, from an ordinary reversal of preference over time, and from simply never getting around to it — never collapsing them into whatever the agent later regrets. For each requirement give the case or consideration that motivates it, and say which are non-negotiable and which are the preferences of particular camps.

  The case I actually need handled: my character's failure has no akratic moment. Each evening she judges, correctly given how much weight the near term carries for her then, that tomorrow is the better day to write; she never abandons the plan, never decides against it, and never acts while judging something else better — yet the book never gets written. Say whether a theory that can only return verdicts on momentary actions is thereby inadequate, or whether that demand is my novelist's prejudice. Also tell me what your list implies about an agent who arranges to be prevented from doing the thing and feels relief when she is.

  Take as constraints, unless you argue otherwise: no requirement that an occurrent better judgment be present at the moment of action; consistency with the fact that present-biased agents reverse preferences without new information, sometimes foresee the reversal and sometimes do not, and sometimes pay to bind themselves. Flag any pair of requirements you suspect cannot be jointly satisfied — that is the part I most want. Then, in a line or two each: how the families of accounts do — ones that locate the failure in judgment at the moment of action, ones that locate it in the pull of an attraction rather than in any judgment, ones that locate it in the non-execution of a plan or resolution already formed — and which single requirement excludes the most of them.

  Close by saying what would change your mind about the list: which consideration would lead you to drop or add a requirement, where your reasoning is most likely to fail, and which of the requirements my scene could not settle even if the characters argued it out for a hundred pages.
reasoning: |-
  Hmm, the user is a fiction writer struggling with a scene where one character accuses another of weakness of will regarding an unfinished novel. They need philosophical criteria to make this accusation substantive rather than just rhetoric. As a philosopher of action specializing in weakness of will and intertemporal choice, I need to provide rigorous requirements for distinguishing true weakness from similar phenomena like compulsion, preference reversal, or procrastination.

  The core challenge is that the character's failure lacks any clear akratic moment - she consistently judges that "tomorrow is better" without ever abandoning her writing plan. This demands a theory that can handle non-momentary failures. The user also wants constraints: no requirement for an occurrent judgment during action, consistency with present-bias phenomena, and flagging potentially incompatible requirements.

  I'll start by brainstorming candidate requirements. Key distinctions needed: weakness vs compulsion (where agency is compromised), vs self-deception (where desires are misidentified), vs preference reversal (genuine change in priorities), vs procrastination (mere inaction without conflict). The character's case involves deferred intention without abandonment - she maintains the plan but never executes it.

  For the specification, non-negotiable requirements should include: 1) Diachronic scope (to handle extended failures), 2) Endorsement of intention (to show commitment), 3) Non-external constraint (ruling out compulsion), 4) Stability of priorities (excluding preference reversal), and 5) Executability (showing capability). Negotiable ones like judgment-action gap or resolution mechanics depend on theoretical preferences.

  The relief upon external prevention is particularly telling - it suggests unresolved tension rather than genuine preference change. A purely momentary-action theory fails here because it can't capture this sustained inner conflict without discrete action moments.

  Major theoretical families have limitations: Judgment-focused accounts miss cases without occurrent akrasia; attraction-focused theories struggle with compulsion distinctions; plan-execution models handle procrastination but may overextend to preference changes. The executability requirement excludes most accounts that conflate weakness with simple forgetfulness.

  For the user's scene, even extensive debate couldn't settle whether the character's deferred writing constitutes true weakness or sophisticated self-deception - that ambiguity might actually serve their narrative purpose. The relief reaction is crucial evidence though, as it reveals persistent underlying commitment.
answer: |-
  Here is the specification for a theory of weakness of will capable of adjudicating your character's case, derived from core philosophical constraints and designed to exclude conflation with adjacent phenomena. Requirements are listed with motivations, negotiability flagged, and implications for your specific case and the "relief upon prevention" scenario.

  **Non-Negotiable Requirements (Core Distinctions):**

  1.  **Diachronic Scope Requirement:** The theory MUST account for failures occurring *over time*, not solely in momentary actions. It must handle cases where the agent never acts contrary to an occurrent judgment *at the moment of action*, yet fails through consistent deferral or avoidance.
      *   *Motivation:* Your character's case – she judges *each evening* that tomorrow is better, never acting against a *current* writing judgment. A theory limited to moment-by-moment "acting against one's better judgment" (*akrasia*) cannot diagnose this failure. **This requirement is non-negotiable for handling your case; dismissing it as novelist's prejudice ignores the core phenomenon you need explained.**
  2.  **Endorsed Intention Requirement:** The failure must pertain to an intention (plan, commitment, goal) that the agent *endorses at some level* as governing their action or life, not merely a fleeting wish or abstract value.
      *   *Motivation:* Distinguishing weakness from "never getting around to it" (no serious intention) and from a genuine *change* of priorities (where the endorsed intention is abandoned). The character maintains the *plan* to write the novel.
  3.  **Non-Externally Constrained Requirement:** The failure must stem from the agent's *own* motivational structure/processes, not external coercion or irresistible compulsion/addiction overriding their agency.
      *   *Motivation:* Distinguishing weakness from compulsion/addiction. The failure must be attributable to the agent's own will, even if flawed. The accusation implies she *could* write, but doesn't.
  4.  **Stability of Prior Endorsement Requirement:** The agent must not have genuinely *revised* their judgment about the *overall* value of the intention (relative to alternatives) during the relevant period. The failure occurs while the intention retains its endorsed status.
      *   *Motivation:* Distinguishing weakness from a rational *reversal of preference*. The character hasn't decided the novel isn't worth writing; she maintains it is important. Consistency with present-bias (the *weighting* changes, not the *valuation*) is crucial here.
  5.  **Executability Requirement:** The agent must retain the capacity (skills, opportunity, basic control) to execute the intention *at the relevant times*, even if motivation is lacking.
      *   *Motivation:* Distinguishing weakness from simple inability or lack of opportunity. The accusation implies she *could* sit down and write, but doesn't muster the will. Rules out conflating with external barriers or lack of skill.

  **Negotiable Requirements (Subject to Theoretical Preference):**

  6.  **Judgment-Action Gap Requirement (Negotiable):** *Some* theories require a specific failure of motivation to align with a *judgment* held at *some* point. Others locate weakness purely in the failure to execute an intention/resolution, regardless of concurrent judgment. *Your case challenges the necessity of a concurrent judgment.*
      *   *Motivation:* Distinguishing weakness from self-deception about desires (where the judgment might be insincere) and clarifying the nature of the failure. Theories differ on whether judgment is essential.
  7.  **Resolution/Plan Requirement (Negotiable):** *Some* theories require the formation of a specific resolution or plan to act at *t* as a prerequisite for weakness regarding *t*. Others see weakness in failing to act on endorsed intentions even without such a pinpoint resolution.
      *   *Motivation:* Handling procrastination like your character's ("I'll do it tomorrow"). Does deferring execution *constitute* a plan for tomorrow, or just avoidance? Theories differ.
  8.  **Affective Component (Negotiable):** *Some* theories require regret, guilt, or recognition of failure *by the agent* for it to count as true weakness. Others see weakness as a structural failure identifiable externally.
      *   *Motivation:* Capturing the phenomenology and distinguishing weakness from simple indifference or successful rationalization.

  **Implications for Your Case & "Prevention Relief":**

  *   **Your Character's Case:** A theory meeting Requirements 1-5 *can* diagnose weakness here. She has an endorsed intention (2), retains capacity (5), hasn't revised her valuation (4), isn't externally compelled (3), and fails over time through deferral (1). Requirement 6 is the sticking point – theories demanding an occurrent judgment *during the failure moment* will struggle, while intention-execution focused theories (emphasizing 7) can handle it. Requirement 1 renders purely momentary-action theories **inadequate** for this case.
  *   **Prevention Relief:** An agent who arranges prevention (e.g., books a distracting trip) and feels relief reveals:
      *   **Conflict:** Relief suggests the *intention* (Requirement 2) was still endorsed and created aversive tension/pressure (she felt she *should* be writing).
      *   **Avoidance, Not Revision:** Relief comes from escaping the demand of her *own* intention, not from satisfaction at abandoning a goal (Requirements 4 & 3 - it's her own motivational conflict, not compulsion or changed mind).
      *   **Evidence for Weakness:** This behavior strongly suggests the failure stems from an inability to muster motivation *for* the task despite endorsement (Requirements 5 & 1), rather than a genuine change of heart. Relief points to persistent inner conflict resolved externally.

  **Potential Incompatibility (Flagged):**
  *   A strict interpretation of Requirement 6 (Judgment-Action Gap *at the moment*) is incompatible with Requirement 1 (Diachronic Scope) in cases like your character's, where the failure mode is deferral *without* acting against a present judgment. Theories emphasizing Requirement 7 (Resolution/Plan Execution) can satisfy both 1 and 6 *if* deferral is seen as violating a standing resolution to write the novel, but this stretches the concept of a "resolution for *t*".

  **How Families of Accounts Fare & The Key Excluder:**

  1.  **Judgment-at-Moment-of-Action Accounts (e.g., Davidsonian):** Fail Requirement 1 (Diachronic Scope) for your case. They cannot diagnose failure without an occurrent akratic action. Requirement 1 excludes them.
  2.  **Attraction/Pull Accounts (e.g., some Humean):** Can handle diachronic failure (1) and lack of occurrent judgment (6). Struggle sharply with Requirement 3 (Non-External Constraint) – it's hard to distinguish the "pull" of distraction from compulsion solely based on motivational strength. Also struggle with Requirement 4 (Stability) if attraction is seen as changing valuation. Requirement 3 is their major hurdle.
  3.  **Plan/Intention/Resolution Execution Accounts (e.g., Bratman, Holton):** Best positioned. Focus on diachronic structures (1), endorsement (2), executability (5), and stability (4) via persistent intention. Can handle deferral as violation of a plan/commitment (7). Clearest on distinguishing from compulsion (3) by focusing on agential commitment rather than brute force. Requirement 6 (Judgment Gap) is less central here.
  *   **The Single Requirement Excluding the Most:** **Requirement 1 (Diachronic Scope)**. It immediately excludes all theories that *only* analyze weakness as a property of momentary actions against occurrent judgment. This is the most significant dividing line for your case.

  **What Would Change My Mind & Limits for Your Scene:**

  *   **Dropping/Adding Requirements:**
      *   **Drop Requirement 4 (Stability):** If compelling cases showed that genuine, non-self-deceptive preference reversal *during the action window* could still leave room for a distinct kind of "weakness" regret (e.g., regretting one's own fickleness *as* weakness). Currently, this seems to collapse into preference change.
      *   **Add a Requirement:** If analysis revealed that *recognition of the pattern* by the agent (e.g., "I know I always do this") was essential for distinguishing weakness from innocent repeated miscoordination. (This leans into Requirement 8).
  *   **Where Reasoning is Most Likely to Fail:** Underestimating the complexity of "endorsement" (Requirement 2). Distinguishing deep, stable endorsement from superficial professed values or self-deceptive "shoulds" is phenomenologically and theoretically treacherous. This is where self-deception most easily masquerades as weakness.
  *   **What the Scene Cannot Settle:** Even extensive argument **cannot definitively settle Requirement 4 (Stability of Prior Endorsement)**. Is the character *truly* committed to the novel's value, or is she self-deceived? Does her relief signal escaping a conflict (weakness) or escaping an *illusion* of commitment (self-deception/preference change)? This ambiguity is inherent and potentially fruitful for fiction. The scene *can* provide evidence (her protests, her stated values, her planning, the *nature* of her relief), but not proof. This core ambiguity is where the philosophical rubber meets the road of character psychology.
