prompt: |-
  I am about to use epistemic game theory as an engineering tool rather than as an object of study, and I want the specification before I commit to a framework.

  The setting: I am designing an automated negotiation protocol. A small number of software agents, each with a private type, exchange messages over a fixed protocol and then choose. I want to be able to say of some outcomes that they follow from the agents' rationality together with what the agents commonly know, and of others that they do not — and I want to know what would have to be established before such a claim is licensed. Three features of my setting are not the textbook ones:

  1. The agents' decision procedures are inspectable. In the deployments I expect, each side can read the other's code before choosing, so the object of higher-order reasoning is often a procedure rather than an action.
  2. Rollouts are staggered. Some participants run a version of the protocol in which certain moves do not exist; they do not merely assign those moves low probability, they cannot represent them at all.
  3. My verification is partial. At best I can establish that each agent has the relevant beliefs, that each believes the others do, and so on, to some finite depth and with some margin short of certainty.

  Please write the desiderata that an epistemic account of rationality and common knowledge would have to satisfy to be adequate for this purpose. For each requirement give the case or consideration behind it — the criteria and their motivations are what I want, not a list. I particularly want you to settle what the account must say about: whether rational attaches to strategies or to the procedures that produce them; what is to be done when the game form itself is not common; whether conclusions reached under common knowledge survive when it is weakened to high-degree, high-probability mutual belief (consider the alternating-move game in which a player may take the larger share now or pass and let the pot grow, and the two-generals case in which every confirmation of a message itself stands in need of confirmation); whether the account must do more than describe beliefs and actually select an outcome, and if so whether it can do that without assuming common knowledge of the outcome it selects; and whether its verdicts must be invariant under re-implementations of the agents that behave identically in isolation but differently once the procedures are mutually visible.

  Then mark which requirements are forced on me by this purpose and which are preferences of particular research programmes — a single fixed space of uncertainty shared by all agents, knowledge as factive and fully introspective, belief as a single probability measure rather than a ranking, a common prior, the vindication of some favored solution concept. I also want to know what diagnostic duty the account owes me: when play contradicts the prediction, must it tell me whether rationality or the knowledge assumption is what I should give up, and can any account discharge that duty? Flag any subset of the desiderata you think cannot be jointly satisfied, and say which single requirement does the most work in ruling candidate frameworks out. A brief scorecard at the end against the main families of account is welcome, but keep the weight on the criteria.
reasoning: |-
  We are designing an epistemic account to serve as an engineering tool for automated negotiation protocols. The key features are:
  1. Agents' decision procedures are inspectable (code is visible).
  2. Rollouts are staggered (some agents cannot represent certain moves at all).
  3. Verification is partial (finite depth of mutual belief, and beliefs are probabilistic but with some margin short of certainty).

  The account must allow us to say that some outcomes follow from rationality and common knowledge (or a weaker notion) and others do not. We must specify what must be established to make such a claim.

  We also have specific questions to address:

  - Whether rationality attaches to strategies or to the procedures that produce them.
  - How to handle when the game form itself is not common (due to staggered rollouts, for example).
  - Whether conclusions under common knowledge survive when weakened to high-degree, high-probability mutual belief (with examples: alternating-move game and two-generals problem).
  - Whether the account must select an outcome and if so, without assuming common knowledge of that outcome.
  - Whether verdicts must be invariant under re-implementations (i.e., behaviorally equivalent but procedurally different agents).

  We must also mark which requirements are forced by the purpose and which are preferences of research programs, and discuss the diagnostic duty.

  Let's break down the desiderata.

  ## I. Desiderata for the Epistemic Account

  ### 1. Rationality of Procedures, Not Just Strategies
     - **Requirement**: Rationality must attach to the decision-making procedures (the code) and not just to the strategies (the mapping from information sets to actions). This is because the code is inspectable and the agents reason about each other's code.
     - **Motivation**: In the setting, agents can read each other's code. Therefore, they can simulate what the code would do in various situations, including counterfactuals. This is a higher-order reasoning about the procedure. If we only consider strategies, we ignore the fact that the procedure might be fixed and known, and that the agent cannot deviate from the procedure (only the procedure can be rational or not).
     - **Forced by purpose?**: Yes, because the inspectability of code is a given in the deployment.

  ### 2. Handling Non-Common Game Forms
     - **Requirement**: The account must accommodate situations where the game form (the structure of moves and information sets) is not common knowledge. In particular, some agents may be running a version of the protocol that lacks certain moves (they cannot represent these moves at all).
     - **Motivation**: Due to staggered rollouts, an agent might be using an older version of the protocol that does not include a move that a newer version has. This agent cannot even consider that move. Therefore, the game tree they reason about is different. The account must allow for agents having different representations of the game.
     - **Forced by purpose?**: Yes, because staggered rollouts are a feature of the setting.

  ### 3. Robustness under Weakening of Common Knowledge
     - **Requirement**: The account must tell us whether conclusions derived under the assumption of common knowledge of rationality (and other relevant facts) still hold (or hold approximately) when common knowledge is replaced by mutual belief of high finite depth and high probability (but less than 1).
     - **Motivation**: In practice, we can only verify mutual belief to a finite depth and with some uncertainty. We need to know if the predictions are stable under these realistic conditions.
     - **Examples**:
       - *Alternating-move game*: Players alternate between taking a large share now or passing to let the pot grow. With common knowledge of rationality, they might pass many times. But with finite mutual belief, they might take the pot earlier because they are not sure the other will pass again.
       - *Two-generals problem*: Every confirmation message requires its own confirmation, leading to an infinite regress. With common knowledge, coordination might be impossible, but with high enough mutual belief, they may act with high probability.
     - **Forced by purpose?**: Yes, because verification is partial (finite depth and less than certainty).

  ### 4. Outcome Selection without Presupposing It
     - **Requirement**: The account must be able to select an outcome (or a set of outcomes) without assuming common knowledge of that very outcome. Moreover, it must do more than just describe beliefs; it must make a prediction about the outcome of the interaction.
     - **Motivation**: We want to predict what the agents will do. If the account only describes beliefs, it doesn't tell us what the agents will choose. But if we assume common knowledge of the outcome, that would be circular.
     - **Forced by purpose?**: Yes, because we need to say of some outcomes that they follow from rationality and common knowledge (or a weaker notion). The account must therefore generate predictions.

  ### 5. Invariance under Procedural Re-implementations
     - **Requirement**: The verdict of the account (i.e., which outcomes are rational) must be invariant under re-implementations of the agents that are behaviorally equivalent in isolation but might behave differently when their procedures are mutually visible.
     - **Motivation**: We want the prediction to depend on the behavior of the agents and not on the internal details of the code, provided that the code produces the same behavior in all possible situations (i.e., the same strategy). However, when the code is inspectable, the agents might reason about the code's behavior in counterfactual situations. Therefore, two implementations that are behaviorally equivalent (in the actual world) might differ in counterfactual worlds. This requirement asks whether the account should consider them the same or not.
     - **Forced by purpose?**: This is subtle. If two pieces of code are behaviorally equivalent in every possible situation (i.e., they implement the same strategy in every state of the world) then they should lead to the same outcome. However, if they are only equivalent in the actual world but not in counterfactuals, then they might be treated differently. Since the agents can inspect the code and reason counterfactually, the account must be sensitive to the actual code. Therefore, we might not have invariance. However, if we are only concerned with the actual outcome and not counterfactuals, then invariance might be desired. Given the inspectability, we think the requirement should be: 
          - *Weak invariance*: If two implementations are behaviorally equivalent in every possible state of the world (i.e., they are the same strategy) then they should be treated the same. 
          - But if they differ in counterfactual behavior, they might lead to different outcomes because the agents reason about those counterfactuals. So invariance only holds for identical strategies (in the full sense). 
     - **Conclusion**: The requirement is that the account must depend on the full strategy (the mapping from all histories to actions) and not on the code per se, but note that the code determines the full strategy. However, if two codes implement the same full strategy, then they are indistinguishable and the account should treat them the same. This is forced by the purpose because we care about the actual behavior in the game.

  ### 6. Diagnostic Duty
     - **Requirement**: When the actual play contradicts the prediction, the account must provide a way to diagnose whether the failure was due to a violation of rationality or due to a failure of the knowledge assumptions (or both). Moreover, the account should ideally allow for such diagnosis.
     - **Motivation**: As an engineering tool, we need to debug the system. If the prediction fails, we want to know which assumption was violated so we can fix it.
     - **Forced by purpose?**: Yes, because we want to use the account to design and verify the protocol. However, note that it might be impossible to always disentangle the two (rationality vs. knowledge) without additional data. We must see what the account can provide.

  ## II. Research Program Preferences

  The following are common in some epistemic frameworks but might not be forced by our purpose:

  - **A single fixed space of uncertainty shared by all agents**: Not forced. In fact, staggered rollouts suggest that agents might have different state spaces (since they represent the game differently). We require the account to handle this.
  - **Knowledge as factive and fully introspective**: Knowledge is typically factive (if you know something, it is true) and introspective (if you know something, you know that you know it). But in our setting, we are dealing with beliefs that might be less than certain. We are weakening common knowledge to mutual belief with high probability. Therefore, we are in the realm of belief, not knowledge. We must allow for belief that is not factive (so it might be wrong) and might not be fully introspective? Actually, for high-probability beliefs, we might still want some introspection (if I believe with high probability, I might also believe that I believe with high probability) but it's not forced. However, note that the inspectable code might make introspection more plausible: the agent can inspect its own code and see what it believes. But this is an internal matter. We are not forced to require full introspection.
  - **Belief as a single probability measure**: We might prefer to have a probability measure to quantify the uncertainty, but it is not forced. We might use a set of probability measures, or a ranking, etc. However, the requirement of high-probability mutual belief suggests that we are using probabilities. But note that we only require "high probability", so the account must be able to express that, but it doesn't force a single measure. We might use other representations of uncertainty as long as we can define "high probability".
  - **Common prior**: The assumption that all agents start with the same prior probability distribution over the state of the world. This is a strong assumption and often made in game theory. However, in our setting, the agents have different code and different representations of the game (due to staggered rollouts). Therefore, a common prior might not hold. We are not forced to require it.
  - **Vindication of a solution concept**: We want the account to lead to a solution concept that we can compute and that matches our intuition of rational play. But we are not forced to use any particular one (like Nash equilibrium, correlated equilibrium, etc.). However, the account must be able to select an outcome.

  ## III. Tension Between Desiderata

  - **Handling non-common game forms (2) and invariance (5)**: If agents have different representations of the game, then the state space is different. How do we model their mutual beliefs? We must have a way to relate the different representations. This might be complex and might break invariance because the same strategy might be represented differently in different game trees.

  - **Robustness under weakening (3) and outcome selection (4)**: For some games (like the alternating-move game) the outcome under common knowledge is very different from finite mutual belief. The account must be able to predict both and show the transition.

  - **Diagnostic duty (6) and the weakening of common knowledge (3)**: With finite depth and probabilistic beliefs, it becomes harder to diagnose because the failure might be due to the depth being too low or the probability not being high enough.

  ## IV. Which Requirement Rules Out the Most?

  The requirement that the account must handle **non-common game forms (2)** is particularly challenging. Most epistemic game theory assumes a common game form. This requirement forces us to model each agent's subjective view of the game and how they reason about others' views. This might rule out standard frameworks that assume a common state space.

  ## V. Scorecard of Main Families of Accounts

  - **Standard Epistemic Models (Aumann, Brandenburger, etc.)**:
    - Assumes a common state space and common knowledge of the game form. Fails requirement 2 (non-common game forms). Also, they typically assume common knowledge and do not handle finite depth and probabilistic belief well (requirement 3).
    - Rationality is usually about strategies, not procedures (fails 1).
    - They can select outcomes (4) and sometimes without circularity (by using fixed-point definitions of common knowledge). 
    - Invariance (5) is typically maintained because they focus on strategies.
    - Diagnostic duty (6) is not usually addressed.

  - **Type Spaces (with incomplete information)**:
    - Can handle different beliefs, but usually still assume a common game form (fails 2). 
    - Rationality is about strategies (fails 1).
    - They can handle probabilistic beliefs, but common knowledge is typically assumed. Finite depth mutual belief can be modeled but is not standard (partial for 3).
    - They select outcomes (4) and without circularity if we use iterative solution concepts (like interim correlated rationalizability).
    - Invariance (5) holds for strategies.
    - Diagnostic duty (6) is not typically addressed.

  - **Logical Frameworks (Dynamic Epistemic Logic, etc.)**:
    - Can model different knowledge and beliefs, and even different game structures (if we allow for multiple models). May handle 2 and 3.
    - Rationality is often about actions, not procedures. But we can extend to reason about procedures (code) by having models that include the code and its behavior. So might be adapted for 1.
    - They can describe beliefs but might not select an outcome without additional machinery (so 4 might be weak).
    - Invariance (5) might be an issue if the code is explicitly represented and two different codes are behaviorally equivalent only in the actual world but not in others (as represented in the model).
    - Diagnostic duty (6) might be addressed by model checking.

  - **Computer Science Approaches (e.g., using Pi-calculus, model checking, etc.)**:
    - Can naturally handle inspectable code (1) and non-common game forms (2) by having each agent run in its own environment.
    - Can model finite depth belief (3) by bounded model checking.
    - Outcome selection (4) is possible by simulation or verification.
    - Invariance (5) might be maintained if we abstract to the strategy level.
    - Diagnostic duty (6) can be addressed by counterexample generation.

  - **Probabilistic Epistemic Models (with common priors or not)**:
    - Can handle probabilistic beliefs and finite depth (3) by truncating the hierarchy. 
    - Might struggle with non-common game forms (2) because they usually assume a common state space.
    - Rationality is about strategies (fails 1).
    - Can select outcomes (4) via rationalizability or equilibrium concepts.
    - Invariance (5) holds for strategies.
    - Diagnostic duty (6) might be difficult.

  ## Conclusion

  The most challenging requirements are 1 (rationality of procedures) and 2 (non-common game forms). These are forced by our setting. A framework that can handle these is likely to come from computer science (like using process algebra or agent-based models) or an extended logical framework that can represent the code and its behavior in counterfactuals.

  We must also note that the requirement of outcome selection without circularity (4) and robustness under weakening (3) are critical and non-trivial.

  Finally, the diagnostic duty (6) is important but might be difficult in any framework. However, if we can model-check the system (given the inspectable code and the finite depth), we might generate counterexamples.

  ## Desiderata Summary

  1. **Rationality of Procedures**: Required because of inspectable code. (Forced)
  2. **Non-Common Game Forms**: Required because of staggered rollouts. (Forced)
  3. **Robustness under Weakening**: Required because of partial verification. (Forced)
  4. **Outcome Selection without Circularity**: Required to make predictions. (Forced)
  5. **Invariance under Procedural Re-implementations**: Required only for full strategic equivalence (i.e., same strategy in every possible state). This is forced because we care about the behavior, but note that the code is inspectable and might affect counterfactual reasoning. However, if two codes implement the same strategy (in all states) then they are equivalent. (Forced in this weak form)
  6. **Diagnostic Duty**: Required for debugging. (Forced)

  ## Additional Notes

  We did not require:
  - A single state space: We allow for different state spaces per agent.
  - Full factivity and introspection for beliefs: We allow for probabilistic beliefs that might be wrong and might have limited introspection.
  - A single probability measure: We can use sets or other representations, as long as we can express "high probability".
  - Common prior: Not required.
  - Vindication of a particular solution concept: We are open to the account defining its own solution.

  ## Final Scorecard Against Requirements

  | Requirement                          | Standard Epistemic | Type Spaces | Logical Frameworks | CS Approaches | Probabilistic Epistemic |
  |--------------------------------------|--------------------|-------------|--------------------|--------------|-------------------------|
  | 1. Rationality of Procedures         | No                | No          | Maybe             | Yes          | No                      |
  | 2. Non-Common Game Forms             | No                | No          | Maybe             | Yes          | No                      |
  | 3. Robustness under Weakening        | Weak              | Partial     | Maybe             | Yes          | Partial                 |
  | 4. Outcome Selection w/o Circularity | Yes               | Yes         | Maybe             | Yes          | Yes                     |
  | 5. Invariance (weak)                 | Yes               | Yes         | Maybe             | Yes          | Yes                     |
  | 6. Diagnostic Duty                   | No                | No          | Maybe             | Yes          | No                      |

  The CS Approaches (using formal methods from computer science) seem to be the most promising, but they might require significant adaptation to epistemic reasoning.

  We must build an account that combines:
  - Explicit representation of the agents' code (for inspectability).
  - Subjective game representations (for staggered rollouts).
  - Bounded depth probabilistic belief hierarchies.
  - A way to simulate the interaction and derive outcomes.

  This might be done by having each agent represented by an automaton (the code) and then building a meta-model of how these automata interact and what they believe about each other's automata and beliefs, up to a fixed depth.
answer: |-
  ### Desiderata for an Epistemic Account in Automated Negotiation Protocols

  #### 1. **Rationality Must Attach to Procedures, Not Merely Strategies**  
     - **Requirement**: Rationality must evaluate the *decision-making procedures* (i.e., inspectable code) rather than abstract strategies. The account must model agents as reasoning about the *implementation* of others' procedures, including their behavior in counterfactual scenarios.  
     - **Motivation**: Since agents can inspect each other's code, deviations, incentives, and optimality depend on the procedure itself (e.g., "Is this code robust to my actions?"). A strategy-only view fails to capture how mutual code inspection enables predictions about off-path behavior, which is critical for negotiation stability.  
     - **Forced by purpose?**: **Yes**. The inspectability of code makes procedures first-class objects of reasoning.

  #### 2. **Accommodate Non-Common Game Forms**  
     - **Requirement**: The account must handle asymmetric game representations (due to staggered rollouts) where some agents cannot represent certain moves. It should allow agents to hold beliefs about others' *subjective game structures* and reason about compatibility.  
     - **Motivation**: In staggered rollouts, agents may lack concepts for newer moves (e.g., an agent on v1 cannot represent v2's "escrow" option). Predictions must account for how agents reconcile incompatible representations during reasoning.  
     - **Forced by purpose?**: **Yes**. Staggered rollouts break common knowledge of the game form.

  #### 3. **Robustness Under Approximated Common Knowledge**  
     - **Requirement**: Conclusions derived under common knowledge must remain valid (or degrade gracefully) when weakened to finite-depth mutual belief with high probability (\(1-\epsilon\)). The account must quantify thresholds for \(\epsilon\) and depth \(k\) where predictions hold.  
     - **Motivation**:  
       - *Alternating-move game*: With common knowledge, players pass indefinitely for larger payoffs. With finite \(k\), they take earlier if \(k\) is low; with \(\epsilon >0\), they act cautiously.  
       - *Two-generals problem*: Coordination fails under infinite regress but succeeds probabilistically if \(\epsilon\) is below a computable threshold.  
     - **Forced by purpose?**: **Yes**. Partial verification limits us to finite-depth, probabilistic beliefs.

  #### 4. **Outcome Selection Without Circularity**  
     - **Requirement**: The account must select outcomes *endogenously* (e.g., through fixed-point reasoning) without presuming common knowledge of the outcome. It must distinguish *describing* beliefs from *prescribing* actions.  
     - **Motivation**: To claim "outcome \(O\) follows from rationality and mutual belief," the selection mechanism cannot assume \(O\) is already known (e.g., Nash equilibrium assumes mutual knowledge of strategies).  
     - **Forced by purpose?**: **Yes**. Predictions must be falsifiable and non-circular.

  #### 5. **Invariance Under Behaviorally Equivalent Re-implementations**  
     - **Requirement**: Verdicts must be invariant under re-implementations that are behaviorally identical in isolation but differ procedurally (e.g., different algorithms computing the same function). The account must depend only on input-output behavior, not implementation details.  
     - **Motivation**: If two procedures behave identically in all game contexts but differ internally (e.g., one uses loops, the other recursion), mutual inspection should not alter outcomes.  
     - **Forced by purpose?**: **Yes**. Engineering requires modularity; outcomes should depend on *what* agents do, not *how* they compute it.

  #### 6. **Diagnostic Duty for Failed Predictions**  
     - **Requirement**: When predictions fail, the account must distinguish whether:  
       - Agents violated rationality (e.g., chose dominated actions),  
       - Belief assumptions were incorrect (e.g., depth \(k\) was too low), or  
       - The game representation mismatch caused incoherence.  
     - **Motivation**: Debugging protocols requires isolating faults (e.g., "Did Agent 1 irrationally reject the offer, or did it doubt Agent 2's rationality?").  
     - **Can it discharge this?**: **Partially**. No account can *guarantee* fault isolation (e.g., the two-generals problem conflates belief and rationality failures), but it must provide testable hypotheses (e.g., "If \(k \geq 3\), rationality implies agreement").

  ---

  ### Research Program Preferences vs. Forced Requirements  
  | **Requirement**               | Forced by Purpose? | Notes                                                                 |
  |-------------------------------|--------------------|-----------------------------------------------------------------------|
  | **Single state space**        | No                 | Staggered rollouts necessitate subjective state spaces.              |
  | **Factive knowledge**         | No                 | Beliefs are probabilistic (\(\epsilon >0\)); factivity is optional.  |
  | **Full introspection**        | No                 | Agents may not know their own beliefs perfectly; inspectable code reduces but doesn't eliminate this. |
  | **Single probability measure**| No                 | Rankings or imprecise probabilities suffice if they handle \(\epsilon\)-robustness. |
  | **Common prior**              | No                 | Asymmetric code and staggered rollouts invalidate common priors.     |
  | **Vindicate solution concepts**| No                 | Nash/sequential equilibrium may emerge but aren't required; the account must work for novel protocols. |

  ---

  ### Tensions and Challenges  
  - **Key Tension**: Requirements 2 (non-common game forms) and 5 (invariance) conflict. If agents have asymmetric representations, re-implementations that are equivalent in one game may diverge in subjective counterfactuals.  
  - **Most Restrictive Requirement**: **Non-common game forms** (Requirement 2) rules out most frameworks (e.g., type spaces, Aumann structures) assuming a common state space.  
  - **Impossible Trilemma?**:  
    - Invariance (5) + Procedure-based rationality (1) + Non-common games (2) cannot hold simultaneously.  
      *Why*: If agents have different game representations, behaviorally equivalent procedures may be *semantically* inequivalent (e.g., "move X" means different things to each agent). Relaxing invariance (to allow semantic dependencies) may be necessary.  

  ---

  ### Framework Scorecard  
  | **Framework**               | 1<br>Procedures | 2<br>Non-common | 3<br>\(\epsilon,k\)-Robust | 4<br>Non-circular | 5<br>Invariance | 6<br>Diagnostics |  
  |-----------------------------|----------------|-----------------|---------------------------|------------------|----------------|------------------|  
  | **Classic Type Spaces**     | ✗              | ✗               | △                         | △                | ✓              | ✗                |  
  | **Dynamic Epistemic Logic** | △              | ✓               | △                         | ✓                | △              | ✓                |  
  | **Epistemic Game Theory**   | ✗              | ✗               | ✗                         | △                | ✓              | ✗                |  
  | **Computer Science (e.g., MCTS)** | ✓          | ✓               | ✓                         | ✓                | △              | ✓                |  
  | **Probabilistic SAL (e.g., PRISM)** | ✓        | △               | ✓                         | ✓                | ✓              | ✓                |  

  - **✓**: Strong fit, **△**: Partial fit, **✗**: Poor fit.  
  - **Recommendation**: Computer science frameworks (e.g., model checkers like PRISM or Monte Carlo tree search with belief propagation) best handle inspectable code, partial verification, and non-common games. Dynamic epistemic logic excels at semantics but struggles with invariance.  

  #### Key Insights  
  - **Crucial for Adoption**: Requirement 3 (\(\epsilon,k\)-robustness) is the linchpin for real-world use. Without it, predictions are brittle.  
  - **Tradeoff**: Sacrifice invariance (5) if necessary; real protocols prioritize predictable outcomes over implementation anonymity.  
  - **Path Forward**: Extend probabilistic symbolic AI to model:  
    - Subjective game representations,  
    - Bounded-depth mutual belief,  
    - Procedure equivalence classes.  
    This satisfies all forced requirements except strict invariance (which is relaxed to "invariance under semantically aligned re-implementations").
