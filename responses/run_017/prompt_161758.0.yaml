  We are designing a thought experiment in the context of a planning body, with the constraints provided. The scenario must be set in a realistic bureaucratic setting (e.g., city housing authority, regional hospital network, transit agency), mid-century to now. Both sides share the same empirical data, forecasts, causal model, and budget. They are not corrupt, stupid, or posturing. The disagreement must be external (a choice between frameworks) by Carnap's criteria, and it must not be stipulated as such. Moreover, the frameworks must disagree about what counts as success, so that there is no neutral yardstick for fruitfulness. Yet, we must have a determinate instrumental verdict.

  Let's choose a setting: a regional hospital network planning for a new emergency department (ED) in a growing city. The planning body must decide on the scale and design of the ED. The disagreement is about how to measure the success of the ED plan.

  Framework A (Patient-Centered): Success is measured by minimizing the average time from patient arrival to treatment (time-to-treatment). This framework individuates the plan in terms of patient interactions and counts success by reducing delays for the typical patient.

  Framework B (Population-Health Equity): Success is measured by minimizing the maximum time-to-treatment across distinct neighborhoods (or demographic groups) in the city. This framework focuses on the worst-off groups and aims to reduce disparities.

  Both frameworks use the same data: they know the current and projected patient volumes, the geographic distribution of patients, travel times, and the same causal model about how ED design (number of beds, staffing, layout) affects treatment times. They have the same budget and the same forecasts. They agree on the facts: for instance, they agree that if they build a large central ED, the average time-to-treatment might be lower, but some outlying neighborhoods will have longer travel times and thus worse maximum times. Conversely, a more distributed system (e.g., two smaller EDs) might have a slightly higher average time but a lower maximum time (because no one is too far).

  The disagreement is about the metric of success: average time vs. maximum time (or some measure of disparity). This is a conventional choice about how to define the goal. It is external because it is about the framework for evaluating outcomes.

  Now, we apply Carnap's instrumental criterion: which framework is more efficient or fruitful? But note the wrinkle: the frameworks define success differently, so there is no neutral yardstick. However, we can still ask: which framework, when adopted, leads to outcomes that better serve the purposes that the planning body might have? But the purposes are shaped by the framework.

  To avoid relativism, we need a determinate instrumental verdict. We can do this by introducing a shared, higher-order purpose that is not defined by either framework. For example, the hospital network has a statutory mandate: to provide "equitable and efficient emergency care." This mandate is vague and can be interpreted by the frameworks. But note, if we leave it at that, we might have the same problem.

  Instead, let's suppose that the planning body has a shared, higher-order goal that is not framed in terms of either metric: they want to minimize preventable deaths and disabilities from emergencies. This is a factual goal that both sides can agree on. However, the causal link from the ED plan to preventable deaths is mediated by the framework:

  - Framework A advocates argue that minimizing average time will save the most lives overall (utilitarian).
  - Framework B advocates argue that minimizing the maximum time will save more lives in the worst-off areas, and that this is more equitable and might even lead to better overall outcomes in the long run (by building trust in underserved communities, leading to earlier presentations and thus better outcomes).

  But note: they share the same causal model. So they must agree on the factual connection between the plan and the preventable deaths. However, the causal model might not be able to resolve this because it depends on complex social factors (like trust) that are hard to quantify and are not in the data. But the constraint says they share the same causal model. So we have to assume they agree on the causal links.

  Alternatively, we can set up the case so that the two frameworks lead to different designs, and then we can measure the outcomes against the higher-order goal (preventable deaths) without using either framework's metric. But that would be a neutral yardstick. However, the problem states that the frameworks disagree about what counts as success, so we cannot use a neutral yardstick without defeating the purpose.

  But note: the higher-order goal (minimize preventable deaths) is not a framework-specific success metric. It is a shared purpose. However, the frameworks are instruments for achieving that purpose. We can then ask: which framework, when used to design the ED, leads to fewer preventable deaths?

  But wait: the two frameworks will lead to different designs. Let’s say:

  - Using Framework A, they build a large central ED. Their model predicts it will have the best average time (say, 20 minutes) but a maximum time of 60 minutes for some areas.
  - Using Framework B, they build two smaller EDs. The average time might be 25 minutes, but the maximum time is 40 minutes.

  Now, the causal model must predict the preventable deaths for each design. Suppose they have a model that maps time-to-treatment to survival rates. They agree on this model. Then:

  - Design A (central): average time 20 min -> expected preventable deaths per year: 100.
  - Design B (distributed): average time 25 min -> expected preventable deaths per year: 110.

  But wait, this is not fair because the distribution matters. The causal model must account for the distribution of times. Suppose that in Design A, the 60-minute maximum affects a small group and leads to more deaths in that group, but the overall average is better. Let’s say:

  - Design A: preventable deaths: 100 (with 10 deaths in the group with 60-minute access, and 90 in the rest).
  - Design B: preventable deaths: 105 (with 5 deaths in the group that would have had 60-minute access in A, and 100 in the rest).

  But now, they have a factual disagreement? No, they share the same causal model and data, so they agree that Design A leads to 100 deaths and Design B to 105. Then Framework B would be less fruitful because it leads to more deaths. But that makes the choice internal? Because the question becomes: which design minimizes preventable deaths? And that is an empirical question.

  This violates constraint (a): we need the disagreement to be external. So we must avoid having a shared metric of preventable deaths that can be computed from the causal model.

  Therefore, we must make the causal model insufficient to rank the designs on a shared higher-order goal. How? The higher-order goal is not just about total deaths but also about distributional fairness. The planning body might care about both efficiency (total deaths) and equity (how deaths are distributed). But if they have a shared weighting (e.g., a social welfare function), then it becomes empirical. So we must assume that they do not have a shared weighting. The frameworks are precisely the embodiments of different weightings.

  So let’s reframe: the two frameworks are two different ways of specifying the higher-order goal. The instrumental criterion must then be applied in a way that does not rely on a shared goal.

  But Carnap says we choose the framework based on its efficiency and fruitfulness as an instrument. For what? We need a purpose. Without a shared purpose, we cannot apply the instrumental criterion. This is the fruitfulness regress.

  To break the regress, we must have a shared purpose that is not defined in terms of either framework. And that purpose must be vague enough to be interpreted by the frameworks but not so vague that it doesn't provide a criterion.

  Idea: the shared purpose is to serve the community's health needs in a way that is both effective and fair. But that is still vague. Now, we can consider the fruitfulness of each framework in generating plans that are both effective and fair, but we have no measure.

  Alternatively, we can consider which framework is more fruitful in terms of generating consensus, or being easier to implement, or having lower administrative costs. But that might not be relevant.

  Another idea: the frameworks are used not only to evaluate the plan but also to generate it. We can then look at the track record of each framework in other contexts. But we don't have that.

  Let me propose a different scenario: transit agency planning a new bus line.

  Setting: A city transit agency is planning a new bus line in a city with a central business district (CBD) and residential areas. The goal is to improve public transit access.

  Framework A (Ridership Maximization): Success is measured by the total number of daily riders. The route is designed to connect high-density areas to the CBD to maximize ridership.

  Framework B (Coverage Equity): Success is measured by the percentage of residents living within a 10-minute walk of a bus stop, with a focus on underserved neighborhoods. The route is designed to cover as many low-income areas as possible, even if ridership is lower.

  They share the same data: population density, income distribution, current transit access, travel patterns, etc. They have the same budget (so they can build one line). They agree on the causal model: if they build the route through high-density areas, ridership will be high, but if they build through low-density, low-income areas, ridership will be lower but coverage will be better.

  The disagreement is about the metric of success. Now, the higher-order purpose: the agency's mandate is to provide "accessible and efficient public transit." This is vague.

  To apply Carnap's instrumental criterion, we need to see which framework is more fruitful. But how? We can consider:

  - Which framework leads to better outcomes in terms of the agency's long-term goals? But that's circular.

  Alternatively, we can look at the consequences of choosing each framework:

  - Framework A (ridership) might lead to more fare revenue, which can be reinvested, and more reduction in traffic congestion and pollution per dollar spent.
  - Framework B (coverage) might lead to better social inclusion, more job access for the poor, and might be seen as more just.

  But these are the very things that are being valued differently by the frameworks. Moreover, the causal model must be shared. So they agree on the predictions: 
  - Framework A design: 10,000 riders/day, 60% of low-income residents within 10-minute walk.
  - Framework B design: 5,000 riders/day, 90% of low-income residents within 10-minute walk.

  They also agree on the costs (same budget) and on the environmental impact (say, Framework A reduces more car trips). But they disagree about what matters.

  Now, to break the neutrality, we can introduce a higher-order goal that is shared and not framework-relative: the agency is also tasked with promoting social welfare and reducing inequality. But that is still subject to interpretation.

  Suppose that the city has an overarching goal: to maximize a social welfare function that includes both efficiency and equity, but the exact weights are not specified. Then the choice of framework is a way of setting those weights. This is external.

  But Carnap's instrumental criterion: which framework is more fruitful? We can say that Framework B is more fruitful if the city values equity more, and Framework A if it values efficiency more. But we don't have that valuation.

  We need a determinate verdict. So let's add that the transit agency has a history of using both frameworks in different projects, and they have data on the outcomes. But we are to avoid historical data if it's not in the room.

  Alternatively, we can make one framework clearly more efficient in terms of administrative simplicity or ease of measurement. But that might be arbitrary.

  Let me try to construct the hospital case in a way that the frameworks disagree about success, but we can still get a verdict by considering the purpose of the hospital network in a broader context.

  Case:

  The Regional Hospital Network is planning a new emergency department (ED). The two frameworks are:

  - Framework A: Minimize the average time-to-treatment for all patients.
  - Framework B: Minimize the 95th percentile of time-to-treatment (so that 95% of patients are treated within a certain time).

  They have the same data and causal model. They agree that:

  - A centralized ED (favored by A) would have an average time of 20 minutes and a 95th percentile of 60 minutes.
  - A distributed system (two EDs, favored by B) would have an average time of 25 minutes and a 95th percentile of 40 minutes.

  The shared higher-order goal is to minimize the harm from emergencies, which they measure in terms of Quality-Adjusted Life Years (QALYs) lost. They have a causal model that maps time-to-treatment to QALYs lost, and it depends on the distribution of times. They agree that:

  - For the centralized design: expected QALYs lost per year = 1000.
  - For the distributed design: expected QALYs lost per year = 950.

  This is because the distributed design, by having a better 95th percentile, saves more lives in the tail, even though the average is worse.

  But then, the distributed design is better by the higher-order goal. And Framework B would have been chosen, and it leads to fewer QALYs lost. So the disagreement is internal? Because they can compute QALYs lost and agree on the numbers.

  This is not what we want. We want the frameworks to be incommensurable by the higher-order goal.

  So we must prevent the higher-order goal from being measurable independently. How? By making QALYs controversial. For instance, Framework B might argue that the distributed design has additional benefits in terms of community trust, which leads to better health outcomes in the long run, but these are not captured by the immediate QALYs calculation. But if they share the same causal model, they must agree on whether that is true and how to quantify it.

  Alternatively, we can make the higher-order goal not fully specified. The hospital network's mission is to "provide timely and equitable emergency care to all residents." This mission does not specify how to trade off average and 95th percentile. The frameworks are two ways of specifying the mission.

  Then, the instrumental criterion must be applied relative to the mission. But the mission is vague. So we need to see which framework is more fruitful in terms of:

  - Ease of implementation.
  - Ability to generate plans that are widely accepted.
  - Consistency with other values of the organization.

  But these might not yield a determinate answer.

  Let's try to force a determinate answer by making one framework have a side benefit. For example, Framework B's distributed design might be more resilient (e.g., if one ED is overloaded or has an incident, the other can pick up the slack). They agree on this resilience benefit, but it is not captured in the time-to-treatment metrics. The causal model says that the distributed design has a lower risk of catastrophic failure. This is an additional shared purpose: resilience.

  Then, even though the frameworks disagree on the primary success metric, we can use the resilience benefit to break the tie. But this might be cheating because it introduces an extra factor.

  Alternatively, we can make the resilience benefit something that both frameworks can agree is good, but it is not part of their success metrics. Then, the instrumental criterion might favor the framework that leads to a plan with this extra benefit.

  But then the disagreement is not purely about the framework's success metric.

  I think I have to accept that the case will have to have a shared higher-order goal that is not framework-relative and that can be used to evaluate the frameworks instrumentally. But to avoid making the choice internal, that goal must be too vague to resolve the choice by itself, but the instrumental evaluation of the frameworks can be done by considering which one is more fruitful in terms of generating plans that are better by that goal, even if the goal is vague.

  But then, without a neutral measure, how do we get a determinate verdict?

  Perhaps we can have a third framework or an overarching principle that breaks the tie. But that's not in the room.

  After careful thought, I propose the following case:

  **The Case of the City Housing Authority**

  The city housing authority must decide how to allocate a fixed budget for improving housing conditions in a city with diverse neighborhoods. The goal is to reduce homelessness and substandard housing. They have two frameworks:

  - Framework A (Aggregate Improvement): Success is measured by the total number of housing units brought up to standard or the total reduction in the number of people in substandard housing. This framework focuses on maximizing the aggregate improvement.

  - Framework B (Worst-Off Priority): Success is measured by the improvement in the conditions of the worst-off neighborhood (e.g., the one with the highest rate of substandard housing). This framework focuses on lifting the floor.

  They share the same data: they know the current conditions in each neighborhood, the cost of improvements, and the causal model of how interventions will improve conditions. They have the same budget. They agree on the facts: if they use the budget for aggregate improvement, they can help more people overall, but the worst-off neighborhood will see little improvement. If they focus on the worst-off neighborhood, they can bring it up to par, but then fewer people in other neighborhoods will be helped.

  The disagreement is external because it is about the metric of success. 

  Now, for the instrumental criterion: the housing authority has a mandate to "ensure decent housing for all residents." This mandate is shared but vague. How to apply the instrumental criterion?

  We can say that Framework B is more fruitful because it is more likely to prevent social unrest. They have data from other cities showing that when the worst-off are neglected, there is a higher risk of protests and instability, which can undo the improvements. This is in the causal model: they agree that focusing on the worst-off reduces the risk of unrest. Framework A might yield more aggregate improvement but at the risk of instability. Framework B's design might yield less aggregate improvement but also less risk.

  Suppose the causal model predicts:

  - Framework A design: aggregate improvement: 1000 units upgraded, risk of unrest: 20%.
  - Framework B design: aggregate improvement: 800 units upgraded, risk of unrest: 5%.

  The shared higher-order goal is to have sustainable improvement in housing conditions. The risk of unrest is a threat to sustainability. So they can compute the expected improvement adjusted for risk. For example, if unrest occurs, it might destroy some of the improvements and cost more to fix. They agree that if unrest occurs, it will reduce the net improvement by 30%. Then:

  - Expected net improvement for A: 1000 * (0.8) + 1000 * (0.2) * (0.7) = 800 + 140 = 940.
  - Expected net improvement for B: 800 * (0.95) + 800 * (0.05) * (0.7) = 760 + 28 = 788.

  Then Framework A is better. But this is internal again.

  To prevent this, we can make the impact of unrest not reducible to a number. For instance, unrest might lead to loss of trust in the authority, making future projects harder. This is hard to quantify. But they might still try.

  Alternatively, we can say that the mandate "decent housing for all" implies that they should not leave anyone behind, which is better captured by Framework B. But that is circular.

  Here's the key: the housing authority also has a goal of maintaining public trust and legitimacy. They have evidence that the public cares about fairness, and that if they use Framework B, the public will perceive the authority as fairer, which will help in future funding and cooperation. This is a shared purpose: to maintain legitimacy. 

  Suppose they have data from surveys that show that citizens give higher approval ratings to policies that focus on the worst-off, even if they are less efficient. This approval is crucial for the authority's long-term ability to function. So:

  - Framework A might yield more immediate improvement but lower approval, which might lead to less funding in the future.
  - Framework B might yield less immediate improvement but higher approval, leading to more funding in the future.

  They agree on the causal model for approval and future funding. They can then project the total improvement over a 10-year period:

  - For A: Year 1 improvement: 1000 units, but then because of low approval, future budgets are cut by 10%, so total over 10 years: 1000 + 900 + ... = let's say 6500 units.
  - For B: Year 1: 800 units, but high approval leads to a 10% budget increase each year, so total: 800 + 880 + ... = 7000 units.

  Then Framework B is more fruitful in the long run. This makes the choice of Framework B instrumentally better.

  But note: they have to agree on the causal model for public approval and future funding. This might be contestable, but the constraint is they share the same causal model.

  And the shared purpose is the long-term improvement in housing conditions. This is not framework-relative.

  Moreover, the case does not stipulate that the disagreement is external; it arises because the frameworks define success differently, but the instrumental criterion can be applied because of the shared long-term purpose.

  But is the choice of framework external? Yes, because the frameworks are different conventions for measuring success, and the choice between them is a decision. The application of the instrumental criterion (which framework leads to more long-term improvement) is what Carnap would recommend.

  Now, the frameworks also disagree about what counts as success in the short term, but the long-term purpose is shared and breaks the tie.

  This avoids the fruitfulness regress by having a shared purpose that is not defined by the frameworks and that can be measured (in units of housing improvement over time).

  The case:

  **The Case of the City Housing Authority**

  The city housing authority is allocating a fixed budget for immediate housing improvements. They have two frameworks for evaluating their plan:

  - Framework A: Maximize the aggregate number of residents moved from substandard to standard housing in the next year.
  - Framework B: Maximize the improvement in the worst-off neighborhood (measured by the reduction in the percentage of substandard housing in that neighborhood).

  They have the same data on current conditions, costs, and the same causal model of how interventions affect housing conditions. They agree that if they focus on the worst-off neighborhood (Neighborhood X), they can reduce the substandard housing rate there from 40% to 20%, but at the cost of helping fewer people elsewhere. If they spread the resources, they can reduce the citywide rate more but leave Neighborhood X at 35%.

  The disagreement is about the success metric. They also share a long-term purpose: to sustainably improve housing conditions citywide over the next decade. They have data from past projects and surveys showing that public approval of the housing authority is higher when they focus on the worst-off, and that higher approval leads to increased future funding. Their causal model predicts:

  - If they use Framework A, public approval will drop, leading to a 10% reduction in future budgets.
  - If they use Framework B, public approval will rise, leading to a 10% increase in future budgets.

  They can then compute the expected total improvement over 10 years (discounted appropriately). They agree that Framework B yields a higher total improvement. Therefore, by Carnap's instrumental criterion, Framework B is more fruitful.

  But note: the immediate success metrics are different, but the long-term purpose is shared and resolves the choice.

  Now, to your wrinkle: the frameworks disagree about what counts as success in the short term, so there is no neutral yardstick for the short term. But the instrumental criterion uses the long-term purpose as the yardstick.

  Analysis:

  1. **Carnap-as-technocrat**: This reading might say that the disagreement is internal because they can compute the long-term total improvement and agree on which plan is better. But note, the choice between the frameworks is external because it is about how to measure success for the plan, but the instrumental criterion uses a shared purpose to evaluate the frameworks. The technocrat might say that the framework choice is just a means to an end, and the end is shared and measurable.

  2. **Carnap-as-decisionist**: This reading says the choice between frameworks is external, a practical decision. The application of the instrumental criterion (using the long-term purpose) is part of the decision process, but it is still a decision because the long-term purpose is not a framework-internal matter? But the long-term purpose is shared and not up for grabs.

  3. **Your reading (the internal/external line is blurred)**: The case shows that what seems like an external question (choice of framework) can be settled by internal considerations (the long-term purpose) if there is a shared purpose and a causal model that links framework choice to that purpose. The political question (how to balance aggregate vs. worst-off) is not dissolved into administration because the long-term purpose (sustainable improvement) is itself a value-laden goal, but it is shared. The frameworks are instruments for that goal, and the choice is made by empirical means.

  The case supports the decisionist reading because the choice of framework is still a decision, but it is guided by instrumental considerations that are empirical (the causal model about public approval and future funding). However, the long-term purpose is still a value, but it is shared and not questioned in this context.

  But wait, the long-term purpose is to improve housing conditions. This is not controversial. The frameworks are about how to measure improvement in the short term, but the long-term purpose is not framework-relative.

  The strongest attack from the technocrat: They might argue that the framework choice is not external because it is settled by internal considerations (the long-term purpose and causal model). The disagreement about the short-term metric is just a step in the internal process of achieving the long-term goal.

  The strongest attack from the decisionist: They might say that the long-term purpose is not neutral. Why is sustainable improvement the goal? And why is it measured in aggregate units? This might be a higher-level framework choice. Also, the causal model about public approval might be contested, but we said they share the same causal model.

  The case actually supports the decisionist reading because the framework choice is a decision that is made based on practical consequences (fruitfulness for the long-term goal), and it is not a theoretical question about the world.

  But it also shows that the political is not eliminated: the choice of the long-term purpose is political, but in this case, it is shared. If it were not shared, then we would have a regress.

  What if we remove the shared long-term purpose? Then we have no way to apply the instrumental criterion, and the case becomes relativistic.

  What if one framework were strictly more fruitful? That would make the case easier, but then it wouldn't bite on the wrinkle.

  What if the framework choice were revisable? In this case, they might choose Framework B now, but if the public approval effect doesn't materialize, they can switch. But that doesn't change the initial decision.

  The single feature doing the work is the shared long-term purpose that is not defined by the frameworks and that can be used to evaluate them instrumentally. Without it, the instrumental criterion cannot be applied.

  So, to answer your request: the case supports the decisionist reading. The framework choice is external, but the decision is guided by instrumental considerations relative to a shared purpose.

  But note: the shared purpose might itself be seen as part of a higher framework. This is where the political remains: in the choice of the shared purpose.

  For the seminar paper, this case shows that even with a shared purpose, the framework choice is a practical decision, not an empirical one, because the frameworks are conventions for measuring success. But the decision can be guided by empirical consequences relative to the purpose.

  The defender of the technocrat reading might attack by saying that the entire problem is internal to the shared long-term purpose. The choice of framework is then an empirical question of which one better serves that purpose, and the frameworks are just different methods, not different linguistic frameworks in Carnap's sense.

  But Carnap's linguistic frameworks are about the rules for forming statements, including how to measure success. So the choice of a success metric is framework choice.

  In conclusion, the case is:

  **The Case of the City Housing Authority**

  The city housing authority must allocate a fixed budget to improve housing conditions. Two frameworks are proposed for evaluating the allocation:

  - Framework A: Maximize the aggregate reduction in the number of residents in substandard housing in the coming year.
  - Framework B: Maximize the improvement in the neighborhood with the highest rate of substandard housing (by reducing that rate as much as possible).

  Both sides share the same data on current conditions and the same causal model of how interventions affect housing quality. They agree that Framework A would lead to a larger aggregate reduction but leave the worst-off neighborhood relatively unimproved, while Framework B would significantly improve the worst-off neighborhood but at the cost of a smaller aggregate reduction.

  The authority also has a long-term goal: to achieve the greatest sustainable improvement in housing conditions over the next decade. They have evidence that public approval of the authority affects future funding: projects that focus on the worst-off garner higher approval, which leads to increased budgets. Their causal model predicts that choosing Framework B will result in higher future funding, leading to greater total improvement over ten years, even though Framework A has better first-year results. Therefore, by the instrumental criterion of fruitfulness for the long-term goal, they choose Framework B.

  **Analysis of Readings**

  - Carnap-as-technocrat: This reading would say that the framework choice is internal because it is resolved by empirical facts (about public approval and future funding) relative to the shared long-term goal. The initial disagreement about frameworks is just a step in the empirical optimization.

  - Carnap-as-decisionist: The choice between frameworks is external (conventional) and is made by a practical decision guided by instrumental considerations (which framework better serves the long-term goal). The decision is not a matter of truth but of which framework is more fruitful.

  - Your reading (blurred line): The case shows that the external question (choice of framework) is settled by internal considerations (the long-term goal and causal model). The political question (how to weigh aggregate vs. worst-off) is not eliminated but is addressed by embedding it in a larger empirical context. However, the long-term goal itself is a value choice, so the political is relocated.

  The case supports the decisionist reading because the framework choice is explicitly a decision guided by practical consequences. The technocrat reading is undermined because the frameworks are not evaluated by their own internal metrics but by an external purpose. The long-term purpose is shared, so it avoids relativism.

  **Strongest Attack by the Technocrat**

  The technocrat would argue that the entire decision is internal to the shared long-term goal. The frameworks are merely different strategies for achieving that goal, and the choice between them is an empirical question of which strategy is more effective, given the causal model. Therefore, there is no external question here; the framework choice is not conventional but is determined by the facts.

  **Response**: But the frameworks define what counts as success for the immediate plan, and these definitions are not true or false; they are chosen. The long-term goal is also chosen, but in this context, it is fixed. Carnap would say that the choice of a framework (including its success metric) is external, even if it is guided by purposes.

  **Feature Doing the Work**: The shared long-term purpose that is not defined by the frameworks and that can be used to evaluate them instrumentally. If removed, the case would not yield a determinate verdict and would support relativism.

  **Variations**:

  - If the two sides also disagreed about the long-term purpose, then the case would be relativistic, and Carnap's criterion would not yield a verdict.
  - If one framework were strictly more fruitful by a neutral measure (e.g., cost-effectiveness), then the case would be easier but not address the wrinkle.
  - If the framework choice were revisable, it might make the decision less weighty, but the initial choice would still be a decision.

  The case bites on the fruitfulness regress by using a shared purpose at a higher level to evaluate the frameworks.
