  ### Thought Experiment: The Regional Transit Agency's Bus Network Redesign

  The regional transit agency is redesigning its bus network to optimize service within a fixed budget. The city has a dense urban core, sprawling suburbs, and several low-income neighborhoods historically underserved by transit. Planners must choose between two frameworks for evaluating the redesign:

  - **Framework A (Ridership Efficiency)**: Success is measured by maximizing total daily passenger trips. This framework prioritizes routes with high demand, focusing on dense areas and major corridors to achieve the highest aggregate ridership, under the principle that transit should serve the most people possible per dollar spent.
    
  - **Framework B (Spatial Equity)**: Success is measured by minimizing the maximum average wait time across all city neighborhoods. This framework prioritizes geographic coverage, ensuring no neighborhood exceeds a threshold wait time (e.g., 15 minutes), under the principle that transit should provide equitable access as a public good, even in low-demand areas.

  Both sides share identical empirical inputs: the same ridership forecasts, travel demand models, population density data, income distributions, operational cost projections, and budget constraints. They agree on the causal model: concentrating resources on high-demand corridors (Framework A) would increase total ridership by 20% but leave three low-income neighborhoods with wait times exceeding 25 minutes; spreading resources for broader coverage (Framework B) would reduce maximum wait times to 15 minutes in all neighborhoods but lower total ridership by 10% compared to the status quo. Neither framework is judged "incorrect" by the data—each simply realizes different outcomes from the same inputs. Both planners are competent and sincere, with no hidden motives.

  The dispute arises because each framework defines success differently: Ridership Efficiency values aggregate mobility, while Spatial Equity values distributional fairness. There is no shared neutral metric—e.g., a combined "social welfare score" is rejected as arbitrary, and cost-effectiveness analyses are framework-dependent (e.g., cost per trip vs. cost per neighborhood covered). The instrumental criterion (fruitfulness) must resolve the choice, but fruitfulness is measured against the agency’s mandate to "provide efficient and equitable transit service"—a vague purpose that each framework interprets differently. Framework A claims fruitfulness in boosting ridership and reducing emissions per dollar; Framework B claims fruitfulness in fostering social inclusion and enabling access to jobs for marginalized groups. Yet, these claims rely on their own success metrics, creating a fruitfulness regress: the frameworks disagree on what counts as a "fruitful" outcome.

  #### Applying Carnap's Criteria to Diagnose the Disagreement as External
  Carnap’s internal/external distinction holds that questions within a framework are empirical (e.g., "Does this bus route increase ridership?"), while framework adoption is a non-cognitive, practical decision based on instrumental fruitfulness. Here, the planners agree on all empirical facts (e.g., ridership projections, wait times, costs). Their clash is not about *whether* the data supports one design over the other—it does not, as each design "wins" under its own framework—but about *which metric* to use for evaluation. This makes the disagreement external: it concerns the choice of a linguistic convention (e.g., how to define "success" or "equity") rather than a truth-apt claim. The verdict emerges from applying Carnap’s criteria:  
  - **Internal questions** would involve empirical verification (e.g., "Will ridership increase by 20% under Plan A?"). Both sides agree on these answers.  
  - **External questions** concern framework adoption (e.g., "Should we adopt ridership or wait time as our core metric?"). This cannot be settled by data alone because the frameworks structure how data is interpreted.  
  Thus, the dispute is external by Carnap’s criteria—not because the planners announce it, but because their shared empirical agreement leaves no room for factual disagreement, forcing the conflict into the conventional realm of framework choice.

  #### Instrumental Criterion Yields a Determinate Verdict Despite the Fruitfulness Regress
  The fruitfulness regress arises because each framework defines fruitfulness in its own terms: Ridership Efficiency claims fruitfulness via efficiency gains, while Spatial Equity claims it via fairness. However, a determinate verdict emerges by appealing to a *shared, higher-order purpose* implicit in the agency’s institutional role: minimizing political backlash to secure long-term funding. Both sides agree (based on historical data and causal models) that service cuts in low-income neighborhoods trigger protests, media scrutiny, and budget reductions, while high ridership gains media praise and political support. They also agree that:  
  - Framework A’s design risks backlash in underserved neighborhoods, with a 40% chance of funding cuts in the next cycle.  
  - Framework B’s design has broad community support, with a 90% chance of budget increases due to perceived fairness.  
  Projecting 10-year outcomes:  
  - **Framework A** may yield higher short-term ridership but risks an expected 15% budget reduction, reducing long-term service quality.  
  - **Framework B** may have lower initial ridership but expects a 10% budget increase, enabling more routes over time.  
  Using the shared causal model, both agree that Framework B leads to greater cumulative service hours and population served over a decade. **Thus, Framework B is more fruitful as an instrument for sustaining transit operations**, breaking the regress by tying fruitfulness to institutional survival—a purpose both frameworks accept as pre-theoretic (it is not defined by either metric). Carnap’s criterion recommends Framework B, as it better serves the agency’s operational continuity.

  #### Analysis of the Case Under Three Readings of Carnap
  1. **Carnap-as-technocrat (politics dissolves into administration)**:  
     This reading views the dispute as internal and empirical. A technocrat would argue that the shared causal model and long-term projections (e.g., budget impacts) render the choice solvable through data. The "correct" framework (B) is determined by its superior outcomes, reducing politics to technical optimization.  
     
  2. **Carnap-as-decisionist (politics is relocated to framework choice)**:  
     This reading treats framework adoption as an external, practical decision. The planners’ agreement on facts but divergence on metrics shows that the residue of politics lies in choosing conventions. Tolerance applies—neither framework is "true," but one (B) is instrumentally better for institutional goals. Politics is not eliminated but confined to the moment of framework selection.  

  3. **Your reading (internal/external line blurs; politics pervades)**:  
     The case shows the internal/external distinction cannot isolate politics because the instrumental criterion relies on a higher-order purpose (institutional survival) that is itself political. The fruitfulness regress is resolved, but only by invoking a contested value (e.g., prioritizing budget stability over other goals). Thus, politics permeates administration, as even "empirical" projections depend on value-laden purposes.  

  **Which reading does the case support?**  
  The case most strongly supports the **decisionist reading**. Carnap’s criteria clearly mark framework choice as external (non-empirical), and the instrumental verdict (choose B) is determinate but pragmatic—it hinges on a decision about what counts as fruitful for the agency’s survival. The technocrat reading is undermined because the empirical data underdetermines the framework choice; the planners agree on facts but still disagree until they appeal to a practical goal. Your reading is partially validated (politics is not eliminated), but the decisionist reading better captures Carnap’s intent: the political is relocated to the conventional realm, where tolerance and instrumental reasoning apply. The technocrat reading fares worst, as the case shows politics persisting beyond administration.

  #### Key Feature Doing the Work and Variations
  - **Feature doing the work**: The **shared, higher-order purpose (institutional survival)** breaks the fruitfulness regress. It is not framework-relative, allowing an instrumental verdict without neutrality in success metrics.  
  - **Variations**:  
    - **If purposes disagreed**: If planners also disputed whether institutional survival matters (e.g., one prioritizes social justice over agency stability), the regress would return, making the case relativistic. Carnap’s criterion would not yield a verdict.  
    - **If one framework were strictly more fruitful**: Suppose Framework B always dominated A in all metrics. The choice would then be empirical (internal), undermining the external diagnosis.  
    - **If framework choice were revisable**: Making it revisable (e.g., "Try A for a year, then switch if backlash occurs") softens but doesn’t eliminate the decision. The initial choice remains external and political, as revisability itself is a conventional gamble.  

  #### Strongest Attack from the Technocrat Reading
  A defender of the technocrat reading would argue: "The case cheats by smuggling in an empirical disagreement. The planners’ consensus on long-term budget impacts (e.g., backlash risks) makes Framework B objectively better *for the shared goal of institutional survival*. This reduces the framework choice to an internal optimization problem within the higher framework of 'maintaining the agency.' The external/internal distinction collapses because the 'higher purpose' is just another empirical constraint."  
  **Rebuttal**: This attack fails because institutional survival is not a framework-internal metric but a pre-linguistic purpose. Carnap insists framework choices are decisions, not truths; here, the agency’s survival is treated as a given *practical* end, not a cognitive claim. The technocrat conflates a purpose with a framework, violating Carnap’s view that purposes guide decisions but are not frameworks themselves. The attack also ignores that the planners still disagree on core values (efficiency vs. equity), which the instrumental verdict overrides but does not dissolve. Thus, the case holds: the political persists in the decision. 

  This case delivers what you need: it relocates politics to the conventional realm without eliminating it, uses Carnap’s criteria to diagnose an external dispute, and resolves the fruitfulness regress instrumentally. It also withstands objections by adhering strictly to your constraints—no sneaked-in factual disagreements or philosophical props.
