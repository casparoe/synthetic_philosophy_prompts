prompt: |-
  ok so I'm about 400 pages into a novel set right after a war my made-up coalition (Varenne, Ostmark, the Sene Republic) has just won, and there's a tribunal sitting in the occupied capital trying what's left of the defeated government. I modelled it loosely on Nuremberg and Tokyo: three counts (crimes against peace, war crimes, crimes against humanity), one judge from each victor on the bench. I've read enough about the real ones to know the standard complaints — retroactive crimes against peace, tu quoque, the emperor nobody indicted, the dissent that called the whole thing victors' justice. Don't explain that back to me and don't tell me what the real tribunals did in specific cases. What I need is for my judges to be consistent with themselves, because my readers will definately notice if they're just doing whatever the scene needs.

  Here's the track record I've already written them into:

  - Chancellor Aurev, who ordered the invasion. Convicted on the peace and humanity counts, life. His lawyers showed (correctly) that aggressive war wasn't a crime in Varenne's statute book and that the treaty which would have made it one never came into force. The presiding judge's line: some acts are crimes against the peace of the world whatever any statute says, and a man who could have not invaded doesn't get to hide behind the silence of the law.
  - Air Marshal Tell, incendiary raids on Ostmark cities, around ninety thousand civilians dead. Acquitted on that count, though he got fifteen years on a forced-labour count. The opinion gives two reasons and never says which one carries the weight: (a) the coalition's own air commands did the same thing on a larger scale, and the bench will not invent a rule for the vanquished that it declines to apply to the victors; (b) the law of aerial warfare in 1941 was genuinely unsettled, and where the law is unclear we do not convict.
  - Commandant Sera, who ran the Wreyland camp. Convicted on the humanity count with the heaviest sentence given to anyone below cabinet rank. She selected prisoners for transports she knew ended at a killing ground, and she devised punishments the regulations didn't require. Orders are no defence, and a defendant who improvises cruelties her orders didn't ask for stands in the position of an author.
  - Second Lieutenant Baas, nineteen, conscripted, who guarded a siding where people were loaded, and who once, on a corporal's order, fired into a crowd breaking out of a wagon; two died. Convicted, three years, the lightest sentence the tribunal has handed down. There was no exit a reasonable person would have taken, and the sentence marks the distance between the hand that gave the order and the hand that carried it out.
  - Manufacturer Kel, whose firm built the camp crematoria to the camp administration's specification. Convicted, seven years: a man who supplies the instrument knowing the use is not a bystander.
  - And a refused count: the Sene prosecutor moved to add the peacetime Relocation Decrees, the regime's persecution of the Shem minority inside its own borders, 1931 to 1935, before any war, aimed at nobody outside the country. Refused in one line: this tribunal's jurisdiction is the war. (The Sene Republic has a minority of its own and nobody wants that looked at.)

  Now the defendant I have to write the ruling for next week. Major Ansel Vey, northern district rail office, 1941 to 1944:

  - He scheduled and sealed the transports to Wreyland. He was never in a policy meeting, never met Aurev, had no hand in designing the programme.
  - He knew where they went: he initialled a stationmaster's written report describing the ramp.
  - He asked for a legal opinion, and the Judge Advocate General put it in writing in 1942 that the resettlement transports were lawful under the emergency decrees.
  - From 1943 he forged manifests and routed something like four thousand people to a farm-labour scheme instead, and arranged mechanical failures that delayed two trains. He was nearly caught once. He went on scheduling everything else.
  - Unlike Baas he had an exit that wasn't heroic: a transfer request to a line regiment, routinely granted, no penalty for asking. He never filed one.
  - What my defence lawyer digs up in chapter twelve: article 47 of Varenne's own Military Penal Code, in force since 1908, makes it an offence for a serviceman to withhold the means of subsistence from a civilian population under his charge. So on one reading the thing he did was already a crime in his own army's law, and whatever saved Tell can't save him. The defence answer is that under his charge means people actually in his custody, not people at the far end of a line he timetabled.
  - And the bit the Sene judge is going to hate: the Sene food blockade of the defeated territory killed, on the in-world Red Cross numbers, roughly as many civilians as the transports Vey scheduled, no Sene officer has been charged, and the Sene judge has said on the record that the blockade was harsh but lawful.

  So: what should the bench do with Vey if it wants to be consistent with itself — convict or acquit, and if convict, where does the sentence sit against Baas's three years and Kel's seven? Which precedent is the closest analogue, and if the honest answer is that two of them pull in opposite directions, say that. I can see three or four rules that fit the six rulings I've already written — something like no rule for the vanquished the victors won't apply to themselves, something like convict where the conduct was already criminal somewhere and otherwise only where it shocks the conscience, something like liability tracks the options the defendant actually had, something like knowing contribution is enough — and they come apart on Vey, so tell me which one I'd be committing the tribunal to with each verdict. Then give me the one further case that would actually tell the rules apart, because I want a lawyer on the page to make that point. And if you can, draft the couple of sentences the presiding judge has to say out loud, since that's the bit I really have to write.
reasoning: |-
  Okay, the user is deep into writing a novel about a post-war tribunal and needs help ensuring the judges' rulings are consistent with past decisions. They've provided a detailed track record of six prior cases and now need to rule on Major Ansel Vey's case. 

  First, I need to analyze the existing precedents. The tribunal seems to operate on several principles: rejection of victor-exclusive justice (Tell acquittal), liability based on personal agency (Baas light sentence vs. Sera harsh sentence), moral culpability for core atrocities (Aurev conviction despite legal gaps), and knowing contribution (Kel conviction). But these principles conflict in Vey's case.

  The key tension is between Tell's acquittal (where victor hypocrisy and legal ambiguity mattered) and Kel's conviction (where knowing contribution sufficed). Vey sits precisely at this crossroads. His rail scheduling is functionally identical to Kel's crematoria supply - both enabled atrocities through logistical support. But the blockade hypocrisy mirrors Tell's case, creating a tu quoque problem. 

  For consistency, Kel is the stronger precedent because:
  - Both were "enablers" rather than direct perpetrators
  - Both had clear knowledge (Vey initialed the stationmaster report)
  - Neither had direct custody of victims (defeating the "under his charge" defense)

  The blockade parallel is problematic but distinguishable: the tribunal previously refused to examine victor conduct (Relocation Decrees ruling), suggesting they'll sidestep that landmine. Vey's moral agency is heightened by his secret rescues - proving he recognized the atrocity and had options (unlike conscript Baas). His sentence should thus fall between Baas (3y) and Kel (7y) - perhaps 5 years as a mid-level facilitator.

  The perfect test case for future tension would be a victor nation's blockade administrator - forcing the tribunal to either extend Kel's logic (knowing contribution) or hide behind Tell's victor immunity. 

  Presiding judge lines should emphasize: 
  1) Knowledge proved by document initialing 
  2) Rejection of narrow "custody" defense 
  3) Distinction from Baas via options and authority 
  4) Pattern-alignment with Kel's conviction logic

  This maintains consistency while leaving the victor hypocrisy issue deliberately unaddressed - just like in the Relocation Decrees ruling. The tribunal's selective blindness remains intact.
answer: |-
  Here's a breakdown of Vey's case against your tribunal's established precedents, the likely consistent ruling, sentencing, and the clarifying test case:

  **Consistent Verdict: Conviction on Crimes Against Humanity**

  *   **Why Convict?** The tribunal's logic in **Kel** (supplier convicted) and **Sera** (convicted for *improvising* cruelties, showing agency) points strongly towards liability for Vey. He wasn't a passive cog; he *scheduled and sealed* the transports with *knowledge* of the destination's purpose (proven by initialing the report). His role was essential logistical enablement, directly comparable to Kel supplying the crematoria. The "knowing contribution is enough" principle established in Kel applies directly.
  *   **Rejecting the Tell Defence:** While Tell benefited from victor hypocrisy/legal ambiguity, Vey's situation differs significantly.
      *   **No Victor Hypocrisy *Directly* Analogous:** The blockade is a *policy* issue (like the incendiary raids) potentially involving state actors. Vey's actions are individual, operational facilitation of a *specific, known atrocity program* (like Kel). The tribunal avoided judging victor *policies* in the Relocation Decrees ruling and will likely sidestep the blockade analogy here, focusing on Vey's specific acts. "Tu quoque" (they did it too) worked for Tell on *policy* bombing; it shouldn't shield an individual facilitator of core atrocities.
      *   **Legal Ambiguity Defense Fails:** The JAG opinion *might* create ambiguity about the *policy's* legality under domestic emergency law, but it doesn't address the core issue: was facilitating mass murder a crime *under international law* as understood by the tribunal? The tribunal convicted Aurev for aggression despite its statutory novelty, establishing that core offenses transcend narrow domestic legality. Furthermore, Vey's *own actions* (forging manifests, arranging delays) prove he *personally* believed the core action (sending people to Wreyland) was morally/legally wrong. He acted against it secretly, showing consciousness of guilt regarding the *outcome*.
  *   **Rejecting the "Under His Charge" Defense:** The tribunal's rulings emphasize *agency and knowledge* over narrow legalistic definitions. Sera was convicted for actions beyond strict orders; Kel for supplying instruments; Aurev for acts not explicitly codified. The defense's reading of Article 47 is hyper-technical. Vey controlled the *means* (the trains) by which subsistence (life itself) was withheld from a specific population (those on the transports) destined for extermination. His scheduling was the direct operational cause of their deprivation. The tribunal will likely interpret "under his charge" broadly in this context of mass atrocity, focusing on functional control over their fate during the transport phase.
  *   **Distinguishing from Baas:** Baas was a low-level conscript with no real alternative in the moment. Vey had significant responsibility (Major, District Rail Office), clear knowledge, and a non-heroic exit (transfer). He *chose* to stay and facilitate, even while secretly subverting *some* transports. His level of agency and autonomy is far closer to Kel than Baas.

  **Sentence: 8-10 Years**

  *   **Positioning:**
      *   **Higher than Kel (7 years):** Vey's role was more *directly operational* and essential to the core atrocity than Kel's supply role. He wasn't just providing equipment; he was actively managing the *process* of delivering victims. His knowledge was more immediate (initialing the report) and his secret rescues, while morally complex, demonstrate a higher level of *conscious culpability* regarding the evil he was facilitating compared to Kel fulfilling a contract.
      *   **Significantly Higher than Baas (3 years):** Vey had authority, options, and knowledge Baas lacked. He wasn't a frightened teenager following an immediate order under duress.
      *   **Lower than Sera:** Sera devised cruelties and actively selected victims. Vey facilitated the system but didn't invent cruelties or make selections.
  *   **Reasoning:** His sentence reflects his position as a crucial mid-level enabler with significant operational authority and clear knowledge, who had alternatives but chose to remain complicit in the core machinery of extermination, despite limited moral resistance.

  **Closest Analogue: Kel.** Both were knowing enablers whose contributions were essential but not policy-making or directly hands-on killing. Vey's role was slightly more integral to the daily atrocity machine.

  **The Conflict & The Test Case:**

  The tension lies between **Tell** (acquittal based on victor hypocrisy/policy ambiguity) and **Kel** (conviction based on knowing contribution). Vey sits at the intersection: individual facilitator (like Kel) but potentially shielded by victor *policy* hypocrisy (like Tell's aerial bombing vs. the Sene blockade).

  *   **Commitment with Verdict:**
      *   **Conviction:** Commits the tribunal to prioritizing the **"knowing contribution is enough"** principle (Kel, Sera) over **victor hypocrisy defenses** for *individual operational facilitators* of core atrocities. It says **liability tracks options and knowledge** (distinguishing Vey from Baas) and that **hyper-technical legal defenses (like "under his charge") won't shield enablers** in the context of mass atrocity. It implicitly sidesteps judging victor *state policy* (blockade) when assessing individual guilt for specific acts.
      *   **Acquittal:** Would commit the tribunal to **"tu quoque" and victor hypocrisy being a shield even for individual operational facilitators** if a comparable victor *policy* exists, significantly weakening Kel and Sera. It would elevate **strict legalism** (the JAG opinion, narrow reading of "under his charge") over moral agency/knowledge.

  **The Test Case that Clarifies the Rules:**

  **The Case of Commodore Sel Duran (Sene Navy):** Commander of the blockade squadron enforcing the Sene food embargo against the defeated territory in 1944-45. He received direct orders from the Sene Admiralty citing strategic necessity. He intercepted neutral vessels attempting to run the blockade with food aid, confiscating or sinking cargo. He maintained detailed logs showing awareness of Red Cross reports on civilian starvation deaths. He requested a transfer to fleet operations, citing discomfort with the civilian impact, but was denied.

  *   **Why it's the Test:**
      *   **Direct Victor Policy Analogue:** Directly mirrors the hypocrisy issue raised in Vey's case and central to Tell's acquittal. This is *the* Sene blockade officer.
      *   **Individual Operational Role:** Like Vey and Kel, he's an operational commander facilitating a policy with deadly consequences.
      *   **Knowledge:** Proven awareness of the consequences.
      *   **Options:** Limited (transfer denied), but some agency in enforcement strictness.
      *   **Conflict:** Applying *Kel* (knowing contribution) demands conviction. Applying *Tell* (victor hypocrisy/policy ambiguity/state orders) demands acquittal.
  *   **What it Reveals:** How the tribunal truly weighs **"knowing contribution to atrocity"** vs. **"state policy/orders/victor hypocrisy"** for *individuals implementing policy*. If they convict Duran, they fully embrace Kel's logic universally. If they acquit, they establish that victors are effectively immune for policy implementation, making Tell's acquittal the stronger precedent and undermining the consistency of Kel and Vey's convictions. This is where "victor's justice" becomes undeniable.

  **Presiding Judge's Lines:**

  >"Major Vey, the Tribunal finds you guilty on the count of Crimes Against Humanity. Your scheduled trains were the essential artery to Wreyland. You knew their terminus was death, evidenced by your own hand on the stationmaster's report. Article 47 of your own code speaks to withholding subsistence; you withheld life itself. The legal sophistry of the JAG cannot sanitize this. You possessed the rank to understand, the means to resist through transfer, and the conscience that drove your secret diversions – proving you knew the evil you served daily. Your sentence is nine years, marking your knowing, operational complicity in the machinery of extermination."

  This ruling maintains consistency by:
  1.  Emphasizing **knowledge** (report initial).
  2.  Rejecting the hyper-technical defense ("under his charge").
  3.  Focusing on his **operational role as an enabler** (aligning with Kel).
  4.  Highlighting his **agency and options** (distinguishing from Baas).
  5.  Sidestepping the victor hypocrisy issue (blockade) as irrelevant to *his individual guilt* for *these specific acts*.
  6.  Using his own moral qualms (diversions) against him to prove culpable knowledge.
  7.  Setting a sentence reflecting his mid-level, knowing facilitation role.
