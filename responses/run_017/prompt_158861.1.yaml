prompt: |-
  I work in the deregulation unit of a state government. Every week my team of three — none of us lawyers, none of us with more than a day per rule — reviews long-standing provisions in the administrative code and recommends to a political appointee that each be repealed or retained. Typical items: a requirement that licence applications include a notarised paper copy; a prohibition on selling a particular product within a fixed distance of a school; a rule that two named officers must sign any payment above a threshold; a form field nobody can explain. Most have no written rationale, and the people who might have explained them have retired.

  Please take the role of a political philosopher who has also spent years doing practical regulatory reform. Think carefully before drafting: spend a short paragraph listing the ways a naive application of Chesterton's fence — do not remove an institution until you can say what it was for — goes wrong in a setting like mine. I am especially worried about two failure modes. First, the absence of a discoverable reason is not evidence of the absence of a function: some rules prevent harms that are invisible while the rule works and untraceable to the rule afterwards, so silence from the public is worthless as evidence. Second, a rule's original purpose and its present function can come apart, so finding out what it was erected for may not tell me what it is now holding up.

  Then write the procedure itself: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with "retain", where it licenses repeal even though I never learned the original reason, and where it hands the decision to the appointee because it is a question of values rather than facts. It must handle rules whose benefits are invisible, rules that people have arranged their conduct around, rules that are cheap to administer but costly to comply with, rules whose effects are or are not reversible, and the risk that the reason I end up stating is my own reconstruction. It needs a budget and a stopping rule so that it cannot be used to justify keeping everything. Note that Burkean deference to inherited arrangements and Chesterton's permission to destroy once the use is understood pull in different directions, and say explicitly which one the procedure is adopting. It should fit on one page and be usable by someone with no theory.

  Apply it to three of the cases above, including one where the honest output is "retain" and my director will not like it, and then say what the procedure cannot do. State how confident you are in each substantive claim and single out the step you are least sure about.
reasoning: |-
  Hmm, the user works in a state government deregulation unit and needs a practical procedure for reviewing old regulations. They're concerned about naive applications of Chesterton's Fence - the idea that you shouldn't remove a fence until you understand why it was put up. They specifically worry about two failure modes: rules might prevent invisible harms that aren't traceable back to the rule, and rules might have evolved beyond their original purpose.

  I need to develop a practical review procedure that addresses these concerns. The procedure should be usable by non-lawyers, fit on one page, and include specific steps with clear stopping points. It should handle various rule types mentioned: notarization requirements, proximity bans, dual-signature rules, and unexplained form fields.

  First, I should explain why a naive Chesterton approach fails here:
  - Absence of documentation doesn't mean absence of function (silent evidence problem)
  - Original purpose may differ from current function
  - The "fence" might have been poorly built to begin with
  - Opportunity costs of maintaining useless rules
  - Rules can create their own constituencies even when dysfunctional

  For the procedure itself, I'll create a decision tree with 8 steps:
  1. Basic documentation check (quick win for removal)
  2. Burden assessment (quantify costs)
  3. Harm identification (what problem was this solving?)
  4. Current function analysis (how is it used now?)
  5. Redundancy check (is this still needed?)
  6. Reversibility assessment (can we undo if problems arise?)
  7. Adaptive test (temporary suspension option)
  8. Values decision point (kick to the appointee)

  Each step needs clear pass/fail criteria and stopping points. The budget constraint is crucial - limit research to 1 day per rule. The procedure explicitly adopts a modified Chesterton approach: we defer until we've done due diligence, but permit removal when function remains opaque after reasonable inquiry.

  Now for application examples:
  1) Notarized paper copies: Repeal (high confidence) - redundant, burdensome, reversible
  2) School proximity ban: Values decision (medium confidence) - ends at step 8
  3) Dual-signature rule: Retain (high confidence) - prevents fraud, irreversible harm risk

  The procedure can't handle networked rules with emergent effects, can't predict future conditions, struggles with rules where harms are statistical rather than observable, and is vulnerable to motivated reasoning in the reconstruction phase.

  I'm least confident about the adaptive test step (step 7) - real-world suspensions might be hard to implement and could cause harm before detection. High confidence in the burden assessment and reversibility steps.

  This balances practical reform with philosophical caution - it permits removal when functions remain opaque after reasonable inquiry, but doesn't require absolute certainty about original intent.
answer: |-
  ## Role & Naive Chesterton Critique  
  As your philosophical advisor with regulatory reform experience, I note naive Chesterton application fails here because: (1) **Silent harms** mean rules preventing diffuse, unobservable harms (e.g., gradual corruption) leave no paper trail—absence of evidence ≠ evidence of absence; (2) **Functional drift** allows rules to evolve beyond original intent (e.g., a school proximity rule now preventing gang activity); (3) **Burial by time** means creators die or records decay, making "original purpose" archaeology impractical; (4) **Bad fence theory** assumes all rules were well-designed—many were hasty, irrational, or lobbied into existence; (5) **Opportunity cost** of retaining useless rules wastes resources better spent on actual harms.  

  ---

  ## Deregulation Review Procedure (1-Page)  
  **Core Principle:** *Modified Chesterton*—Assume function exists until disproven by due diligence, but permit removal when function remains opaque after reasonable inquiry. Burkean deference yields to evidence-based reform. Budget: **1 day/rule max**.  

  1. **Documentary Autopsy (1 hr)**  
     - *Ask:* Is there accessible documentation of rationale, complaints, or incident data?  
     - *Sufficient answer:* Written justification, audit findings, or incident reports.  
     - *Stop if found:* Retain unless overwhelming counter-evidence. Else → Step 2.  

  2. **Burden Quantification (2 hrs)**  
     - *Ask:* What are compliance costs (time/money) and administrative costs?  
     - *Sufficient answer:* Stakeholder estimates, volume data (e.g., 5,000 notarizations/yr × $30 each).  
     - *Stop if:* Costs are trivial (<0.5 FTE/year). Retain. Else → Step 3.  

  3. **Harm Hypothesis (2 hrs)**  
     - *Ask:* What plausible harm *could* this prevent? (Think incentives, worst-case scenarios.)  
     - *Sufficient answer:* Credible risk (e.g., "Dual signatures deter embezzlement"); *not* speculation.  
     - *Stop if no hypothesis:* Repeal. Else → Step 4.  

  4. **Function Reality Check (2 hrs)**  
     - *Ask:* Is the rule actively used/enforced? Do stakeholders *rely* on it?  
     - *Sufficient answer:* Enforcement logs, stakeholder interviews (e.g., schools use proximity bans for safety).  
     - *Stop if unused:** Repeal. Else → Step 5.  

  5. **Redundancy Test (1 hr)**  
     - *Ask:* Do other rules/laws already cover this harm?  
     - *Sufficient answer:* Statute/code citation showing overlap (e.g., general fraud law covers dual-signature intent).  
     - *Stop if redundant:** Repeal. Else → Step 6.  

  6. **Reversibility Assessment (30 min)**  
     - *Ask:* If repealed, can we detect and fix harms quickly?  
     - *Sufficient answer:* Monitoring mechanism exists (e.g., complaint tracking); harm is acute, not slow-moving (e.g., corruption).  
     - *Stop if irreversible risk:** Retain. Else → Step 7.  

  7. **Adaptive Test (Final Step)**  
     - *Ask:* Can we propose a sunset clause (e.g., 18 months) with mandatory harm evaluation?  
     - *Sufficient answer:* Yes (→ Recommend repeal with sunset) OR No (→ Step 8).  

  8. **Values Decision (Hand to Appointee)**  
     - *Trigger:* Plausible harm + irreversibility + non-redundant + high cost.  
     - *Frame:* "This may prevent [harm] but costs [X]. Retain as precaution or accept risk?"  

  **Stopping Rule:** After 8 steps OR 1 day elapsed → Decide.  

  ---

  ## Applications  
  1. **Notarized Paper Copies**  
     - Step 1: No docs → Step 2. Cost: High (5K apps/yr × $30 + staff time).  
     - Step 3: Harm hypothesis: Prevent fraud?  
     - Step 4: Digital submissions used elsewhere; no enforcement logs → *Repeal* (High confidence).  
     - *Why director dislikes:* Deadweight cost obvious; repeal defensible.  

  2. **Selling Product Near Schools**  
     - Step 1: No rationale → Step 2. Cost: Low (few vendors affected).  
     - Step 3: Harm hypothesis: Reduce student access to harmful goods (e.g., vaping).  
     - Step 4: Schools confirm reliance for safety → Step 5. Not redundant → Step 6.  
     - Irreversible if repealed (sales surge fast) → **Retain** (Medium confidence).  
     - *Why director dislikes:* Feels paternalistic, but harm plausible.  

  3. **Dual-Signature Payments**  
     - Step 1: No docs → Step 2. Cost: High (delays + labor).  
     - Step 3: Harm hypothesis: Prevent large-scale fraud.  
     - Step 4: Finance team uses it daily → Step 5. Redundancy? General audits exist → *Repeal* (Low confidence).  
     - *Adaptive test:* Sunset with fraud monitoring.  

  ---

  ## What the Procedure Cannot Do  
  - **Handle networked rules** where repeal cascades across systems.  
  - **Predict novel harms** in changed social/tech contexts.  
  - **Resolve deeply ideological splits** (e.g., "nanny state" vs. safety).  
  - **Eliminate reconstruction bias**—your harm hypothesis may be wrong.  

  **Confidence & Weakest Step:**  
  - High confidence in burden/reversibility steps (empirical).  
  - Medium in harm hypothesis (risk of false negatives).  
  - **Least sure about Adaptive Test (Step 7):** Temporary repeal may not reveal slow-moving harms (e.g., erosion of oversight culture).  

  **Philosophical Balance:** This leans *Chesterton* in requiring due diligence but *permits removal under uncertainty*—rejecting Burkean deference when costs outweigh opaque benefits.
