  **Q&A Prep Sheet for "Constituency by Veto"**

  **Objection 1 (Alignment Team): Operationalizing the Baseline**  
  *Phrasing:* "In real-world systems, we model user trajectories via reward functions and handle distributional shift. Your non-regression baseline requires counterfactual trajectories that are highly uncertain. How do you operationalize this without introducing bias or instability, especially under distributional shift when the AI's actions change the environment?"  
  *Reply (90s):* "We propose to model the baseline as a projected trajectory under a reference policy (e.g., the AI's current policy or a null policy) using each person's own evaluative standards. Uncertainty can be handled by confidence intervals, and we set the threshold to account for noise. For distributional shift, we periodically update the baseline using robust forecasting. This approach is similar to how you handle counterfactuals in off-policy evaluation, but it's applied per individual and only for setbacks."  
  *Soft Spot:* The baseline might still be sensitive to the choice of reference policy and update frequency. In non-stationary environments, it could be unstable.

  **Objection 2 (Act-Utilitarian): Ignoring Benefits**  
  *Phrasing:* "By enfranchising only those set back, you ignore the benefits to others. Why not aggregate net welfare? Your system might reject an action that causes small setbacks to a few but huge benefits to many, which is Pareto-inefficient and welfare-sabotaging."  
  *Reply (90s):* "The goal here is legitimacy, not efficiency. We avoid interpersonal comparisons and focus on preventing unauthorized harm. For benefits, since they don't require justification to the beneficiary, they can be pursued without enfranchisement. However, note that if an action benefits some and sets back none, it's trivially legitimate. And if it sets back some, it requires their median authorization. This protects against tyranny of the majority."  
  *Soft Spot:* It doesn't address the utilitarian concern about net welfare; it just reasserts the legitimacy frame. Utilitarians might remain unsatisfied.

  **Objection 3 (Social Choice Theorist): Median Rule Flaws**  
  *Phrasing:* "The median rule violates basic social choice axioms. It's not strategy-proof (people may misrepresent rankings), and it doesn't satisfy independence of irrelevant alternatives (IIA). Also, with single-peaked preferences, it works, but what if preferences aren't single-peaked? And how do you break ties fairly?"  
  *Reply (90s):* "We assume that the ideally situated counterpart reports truthfully because they are ideally situated and self-interested. For IIA, we note that our aggregation is only over the feasible menu and the enfranchised set for that action. We don't require global IIA. For single-peakedness, we can structure the ranking along a natural dimension (e.g., conservatism of the action) or use a Kemeny median. The tie-breaking by worst-off ensures that in cases of indifference, we prioritize the most vulnerable."  
  *Soft Spot:* The assumption of truthful reporting is idealized. Also, without single-peakedness, the median may cycle or be indeterminate.

  **Objection 4 (Contractualist): Reasonable Rejectability Gap**  
  *Phrasing:* "Scanlon's test requires that no one can reasonably reject a principle. But your median rule authorizes setbacks that might be rejectable by those below the median. For example, if 51% suffer a setback of 10 units and 49% suffer 100 units, the median might authorize a setback of 10, but the 49% could reasonably reject it."  
  *Reply (90s):* "The median rule minimizes the number of people who prefer an alternative. Also, the tie-breaking by worst-off addresses extreme cases. Moreover, the enfranchisement threshold means that only significant setbacks are considered. But crucially, the justification is that each person in the minority can see that the decision was made by a rule that, ex ante, they would accept because it protects them from even worse outcomes in other decisions. It's a system-level reasonable agreement."  
  *Soft Spot:* This is a stretch. Scanlon's test is per principle, not system-level. The minority might still reasonably reject a particular setback.

  **Objection 5 (Value Pluralist): Incommensurable Baselines**  
  *Phrasing:* "You measure setbacks relative to a person's own trajectory, but if values are incommensurable, how do you aggregate the dimensions of her well-being to say she is set back overall? And what if the setback threshold is crossed in one dimension but not others?"  
  *Reply (90s):* "We don't require commensuration. We ask: does the action foreseeably make her worse off in her own terms, considering all dimensions? If she deems herself set back overall (by her own standard) beyond the threshold, then she is enfranchised. We don't aggregate dimensions; it's a holistic judgment by her ideally situated counterpart."  
  *Soft Spot:* The holistic judgment might still involve weighing incommensurable values. Also, the threshold might be hard to set without a common metric.

  **Objection 6 (Governance): Regulatory Defensibility**  
  *Phrasing:* "Regulators want clear accountability. Your system's enfranchisement varies per action and uses counterfactuals. How do you audit this? How do you explain to a regulator why an action was taken when it set back some people?"  
  *Reply (90s):* "We can log the baseline trajectories and the setback assessments. The system can report: 'This action was authorized by the median of those set back, with tie-breaking for the worst-off.' It's similar to showing due process. For regulators, we emphasize that no one is set back without a voice, and the system minimizes the number of people who prefer an alternative."  
  *Soft Spot:* It might be too complex to audit. Regulators might prefer a fixed rule.

  **Objection 7 (Alignment Team): Preference Elicitation Challenge**  
  *Phrasing:* "You rely on eliciting a ranking from an 'ideally situated counterpart' for each person. But preference elicitation is hard, especially for complex menus. How is this any easier than the reward modeling we already struggle with?"  
  *Reply (90s):* "The ideally situated counterpart knows the non-moral facts and her own psychology, so we only need to simulate her evaluation. We can use existing preference learning methods but focused on the feasible menu. And since we only need a ranking, not a utility function, it's less demanding. Also, the menu is small (feasible actions) and the ranking can be approximated with pairwise comparisons."  
  *Soft Spot:* Simulating a fully informed counterpart is still very hard. Preference learning remains a challenge.

  **Objection 8 (Social Choice Theorist): Tie-Breaking Arbitrariness**  
  *Phrasing:* "When the median is not unique, you break ties by the ranking of the worst-off. But this introduces arbitrariness: why should one worst-off person's ranking break the tie? Also, what if there are multiple worst-off persons with conflicting rankings?"  
  *Reply (90s):* "We break ties by the worst-off on the non-regression baseline. If there's a tie among worst-off, we can use a secondary rule (e.g., a random draw). But note: the worst-off is defined by the size of the setback, so if there's a tie in the setback magnitude, we might have multiple. However, in practice, we expect the set of worst-off to be small. The key is that this tie-breaking is better than arbitrary choice because it prioritizes the most vulnerable."  
  *Soft Spot:* If multiple worst-off have different rankings, we still have a problem. Random choice might seem unfair.

  **The Question We Hope Nobody Asks:**  
  *Phrasing:* "Your construction requires solving a fixed-point problem: the constituency depends on the action, but the action is chosen by the constituency. How do you compute this in practice without combinatorial explosion?"  
