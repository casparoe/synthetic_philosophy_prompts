  *Soft Spot:* Convergence isn't guaranteed, and approximations might lead to instability.

  **Overall Analysis:**

  - **Objection that would sink the paper if answered badly:** Objection 1 (Operationalizing the Baseline). If we can't define the baseline robustly, the enfranchisement fails.
