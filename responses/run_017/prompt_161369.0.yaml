prompt: |-
  You are a professional philosopher with research-level command of two literatures: Wittgenstein scholarship on the remarks published posthumously as On Certainty (including the hinge readings and their critics), and the epistemology of science. Please think carefully and at length. Before you write anything organized, spend some time brainstorming in the open: list the candidate presuppositions of the practice I describe, the ways each could fail, and the rival theories that would license the same practice. Then commit to a reconstruction, and mark clearly where you are confident and where you are guessing. Do not spend your answer summarizing On Certainty; I have read it. I want the practice reconstructed and my hypothesis tested.

  I am a PhD student in science and technology studies, and my dissertation chapter is on the epistemology of peer review. What interests me is a rule that every working scientist seems to know and no journal ever writes down: a distinction between objections that must be answered and objections that do not count as objections at all. If a referee says that the data do not support the conclusion, that there is a missing control, that the confidence intervals were computed wrong, or that a better-powered study found the opposite, the authors must answer, and the paper dies if they cannot. But if a referee says that the measurement procedure presupposes that the instruments track an external world, or that the entire published literature in the field might be the product of a coordinated fraud, or that the laws of nature might have shifted between yesterday's run and today's, then the referee is treated as not having engaged with the paper at all: editors do not forward the report, and the objection is set aside without argument. Three further features of the same practice seem to me to matter. First, a challenge with exactly that global shape — the whole framework is resting on a mistake — is sometimes, decades later, credited as a turning point in the field, so the practice clearly does not simply forbid framework-level criticism forever. Second, authors must cite or evidence every substantive claim, but nobody demands a citation for the claim that the samples were collected on Earth or that the notebook records measurements that were actually taken, and the regress of justification appears to stop somewhere different in molecular biology than it does in paleoclimate reconstruction. Third, my supervisor, who is not a Wittgensteinian, says the whole phenomenon is an artefact of incentives: referees have limited time, editors want publishable decisions, and nobody has ever been rewarded for raising a doubt that no possible experiment could settle.

  My own tentative hypothesis is that this practice is the institutional expression of hinge epistemology, and I want it stress-tested. I sort objections into three kinds: evidence-objections, which cite contrary data or flawed inference; coherence-objections, which say the claims conflict with each other or with well-confirmed theory; and framework-objections, which challenge whether the quantities or concepts the paper deploys are well defined or applicable at all. My proposal is that framework-objections are objections aimed at hinge commitments, and that the practice's dismissal of them encodes Wittgenstein's idea that there are things which stand fast not because they have been justified but because they are what justification and doubt run up against — that at the end of justifications we find not a proposition known with certainty but something more like a hinge on which the inquiry turns. So here is what I need from you. Reconstruct the implicit epistemology of the practice as I have described it, in your own terms. Then tell me what the practice strictly presupposes as opposed to what it merely fits well with: does it require that hinge commitments be unjustifiable, or only that they not currently be in question? Does it require them to be true, or merely accepted? Does it require that they be shared across the community, or could a practice with the same shape survive widespread disagreement about them? Does it require them to be non-propositional, in the sense of being more like rules of the game than like beliefs, or would a reading on which they are genuine beliefs with an unusual kind of warrant license the practice equally well? Next, I suspect I am conflating things and I want to know exactly where: is a hinge the same kind of object as the core assumption of a research program, or a paradigm in the Kuhnian sense, or a hard core in the Lakatosian sense? Because if framework-level criticism sometimes succeeds — as my first feature says it does — I cannot tell whether that shows my hypothesis is wrong, or shows that hinges themselves can shift over time the way a riverbed moves, and I would like you to draw the line for me and say which reading the successful historical cases support. Then please steelman my supervisor's deflationary sociological explanation as charitably as you can, and tell me whether it actually accounts for all four features of the practice or whether it leaves something out that only a hinge-theoretic story explains; if it does leave something out, say precisely what. Finally, tell me what would have to change in editorial practice if the presupposition were replaced: first by the view that every claim is in principle answerable to evidence and no claim is exempt, and second by the view that the fixed points are genuinely known and default-justified in the way Moore thought he knew he had two hands. And flag wherever the practice is philosophically underdetermined, so that several quite different epistemologies — coherentism, reliabilism, entitlement-theoretic views, non-propositional readings — would all tell referees to behave in just this way.
reasoning: |-
  Hmm, this is a fascinating and complex query from a PhD student in STS working on peer review epistemology. They're clearly deeply engaged with both Wittgenstein's hinge epistemology and scientific practice, and they want me to stress-test their hypothesis that the peer review distinction between "must-answer" objections and "non-starter" objections reflects a hinge-theoretic structure.

  First, I need to reconstruct the implicit epistemology of this peer review practice. The student describes three types of objections: evidence-objections (flawed data/inference), coherence-objections (internal/external consistency), and framework-objections (challenging foundational concepts). The practice treats framework-objections as non-starters, which does seem Wittgensteinian - these would be challenges to what stands fast for that form of inquiry.

  The key questions to address are:
  - Does this practice require hinges to be unjustifiable, or just currently unquestioned?
  - Must they be true, or merely accepted?
  - Must they be community-wide, or could they vary?
  - Are they non-propositional rules or specially warranted beliefs?

  For the historical cases where framework challenges succeeded (their first feature), I think this aligns with Wittgenstein's riverbed metaphor - hinges can shift over time through accumulated strain, but the practice treats them as fixed during normal inquiry. This isn't fatal to their hypothesis.

  Their supervisor's deflationary explanation (about incentives and practicality) is worth steelmanning. While it explains why referees avoid "unsettleable" doubts, it doesn't fully account for why some framework challenges later prove valid, or why the regress-stopping points differ by field. The hinge story better explains the normative dimension - why certain doubts feel categorically inappropriate rather than merely impractical.

  I'll also need to show how different epistemological frameworks (coherentism, reliabilism etc.) might produce similar behavior, while highlighting what's distinctive about the hinge reading. And I should explore what would change if we replaced the presuppositions with Moorean certainty or global justificatory chains.

  Throughout, I'll mark where I'm confident (based on OC textual evidence) versus where I'm making interpretive leaps about scientific practice. The student clearly knows OC well, so I won't summarize it, but will engage deeply with the hinge literature debates (Moyal-Sharrock, Wright etc.).
answer: |-
  Below is a systematic reconstruction and stress test of your hypothesis. I proceed as requested: first brainstorming candidate presuppositions and rival theories, then committing to a reconstruction with confidence markers, addressing your core questions about hinges, testing against historical cases and sociological alternatives, and exploring counterfactual presuppositions. Key insights emerge about the *normative architecture* of scientific justification and the *modal fragility* of hinges.

  ---

  ### **I. Brainstorming: Candidate Presuppositions, Failure Modes, and Rival Theories**
  *(Guiding question: What must be true for this practice to function?)*

  | **Candidate Presupposition** | **Ways It Could Fail** | **Rival Theories Licensing Same Practice** |
  |------------------------------|-------------------------|-------------------------------------------|
  | **P1:** Some propositions are temporarily exempt from challenge in a given inquiry ("hinges"). | • Exemptions become permanent dogma<br>• No mechanism for revisiting exemptions | **Coherentism:** Exemptions are nodes with maximal coherence-links<br>**Reliabilism:** Exemptions are output of reliable processes<br>**Pragmatism:** Exemptions are practically indispensable |
  | **P2:** Framework-objections target hinges, not empirical claims. | • Misclassification: A genuine empirical flaw is dismissed as "framework"<br>• Hinges are contested mid-inquiry | **Lakatosian MSRP:** Objections target "hard core" vs. "protective belt"<br>**Kuhnian Paradigms:** Objections threaten "exemplars" or shared commitments |
  | **P3:** Justification must stop somewhere, and regress-stoppers are field-specific. | • Stoppers are inconsistent across fields<br>• Stoppers are arbitrary (no reason for divergence) | **Contextualism:** Justification ceases at contextually salient assumptions<br>**Infinitism:** Practice truncates regress for efficiency, not principle |
  | **P4:** Dismissal of framework-objections is normative (not merely practical). | • Referees secretly acknowledge validity but ignore for efficiency<br>• Editors reject solely to avoid "silly" reports | **Game-Theoretic:** Nash equilibrium where challenging hinges reduces payoffs<br>**Bourdieusian Field Theory:** Exclusion preserves disciplinary capital |
  | **P5:** Successful framework-challenges require accumulated strain (not ad hoc doubt). | • Revolution occurs from single objection<br>• No "strain" precedes shift (e.g., sudden fraud revelation) | **Popperian Falsificationism:** All claims are testable; exemptions are provisional<br>**Naturalized Epistemology:** Shifts follow cognitive bias patterns |

  ---

  ### **II. Committed Reconstruction: The Implicit Epistemology of Peer Review**
  **(Confidence markers: 🔒 = high; 🔍 = moderate; ❓ = speculative)**

  The practice encodes a **domain-bound foundationalism** with dynamic hinges:
  - **Hinges as Inquiry-Scaffolding (🔒):** Framework-objections target propositions that *enable* evidence-assessment (e.g., "instruments track reality"). To demand justification for hinges *during* an inquiry is to sabotage the game, like demanding chess rules be proven mid-match (OC §204-205).  
  - **Regress-Terminators are Field-Relative (🔒):** What "stands fast" in molecular biology (e.g., PCR reliability) differs from paleoclimate (e.g., stratigraphic continuity) because *methods of justification* differ (OC §298). Stopping points are inherited through training, not deduced.  
  - **Dismissal is Epistemic, Not Psychological (🔍):** Referees treat framework-objections as *category errors*—not because they’re uninteresting, but because they’re *misdirected* (like objecting to a soccer goal by citing tennis rules). The institutional habitus enforces this grammar.  
  - **Revolutions are Hinge-Dislocations (🔒):** When a framework-objection succeeds (e.g., continental drift challenging fixist geology), it’s because *prior hinges accumulated strain* (OC §96-99). Anomalies erode confidence until the hinge shifts (e.g., "continents move" becomes a new empirical claim).  

  **Why This Isn’t Kuhnian/Lakatosian:**  
  - Kuhnian "paradigms" include methods, values, and exemplars—*broader* than hinges. Hinges are minimal enabling conditions (e.g., "data wasn’t fabricated" isn’t paradigmatic).  
  - Lakatosian "hard cores" are protected by convention; hinges are *logically* prior to testing (you can’t test a theory if you doubt notebooks exist).  

  ---

  ### **III. Stress-Testing Your Hypothesis**  
  *(Q1: What does the practice strictly presuppose?)*  

  | **Your Question** | **Answer** | **Confidence** |
  |-------------------|------------|----------------|
  | **Unjustifiable vs. Unquestioned?** | Requires hinges to be *currently unjustifiable in practice*—not inherently unknowable. Justifying a hinge (e.g., "why trust instruments?") would require stepping outside the framework, halting inquiry (OC §124). | 🔒 |
  | **Truth vs. Acceptance?** | Requires hinges to be *treated as true* within the language-game. Their truth isn’t presupposed—fraud revelations show hinges can be false—but their *functional authority* is (OC §205). | 🔒 |
  | **Community-Wide vs. Disagreement?** | Permits *local disagreement* (e.g., string theorists vs. loop quantum gravity on spacetime ontology), but hinges must be *operationally shared* for collaborative work. A paper presupposing rival hinges would be incoherent to referees (OC §298). | 🔍 |
  | **Non-Propositional Rules vs. Warranted Beliefs?** | **Undetermined.** Practice fits both: <br>• *Non-propositional:* Hinges as "grammatical rules" (e.g., "measurements exist" isn’t a fact but a condition for stating facts)<br>• *Warranted beliefs:* Wright’s "entitlement" (hinges have default justification unless defeated)<br>→ *Practice works under either reading.* | ❓ |

  **(Q2: Why successful framework-criticism doesn’t kill your hypothesis)**  
  Historical shifts (e.g., non-Euclidean geometry replacing Kantian synthetic a priori) exemplify **hinge migration**. Strains (e.g., failed parallax measurements) destabilized the hinge "space is Euclidean," allowing it to become an empirical claim. The practice dismisses *idle* framework-doubt, not *historically pressured* doubt (OC §92). This aligns with Wittgenstein’s riverbed (OC §97).  

  **(Q3: Steelmanning the Deflationary Explanation)**  
  **Supervisor’s view, charitably steelmanned:** Peer review is a resource-constrained coordination game. Referees maximize impact/minimize effort by focusing on "actionable" objections. Editors filter "frivolous" reports to maintain throughput. Framework-objections are excluded because:  
  - They cannot be resolved empirically (no experiment disproves solipsism).  
  - Engaging them risks infinite regress (e.g., justifying justification).  
  - No career incentive exists for "unpublishable" skepticism.  

  **Does this explain all four features?**  
  - **✓ Objection-dismissal:** Yes—efficiency justifies ignoring unanswerable doubts.  
  - **✓ Regress-stopping:** Yes—arbitrary stopping points save time.  
  - **✓ Framework-shifts:** Partial—it explains why *individuals* avoid raising doubts, not why *communities* later credit valid ones (e.g., Wegener’s continental drift was initially dismissed as "non-actionable").  
  - **✗ Successful revolutions:** **Fails**—incentives can’t explain why *some* framework-objections gain traction despite high social/epistemic costs. The hinge-theoretic "strain" model better predicts when doubts become legitimate.  

  **What hinge-theory adds:** The deflationary view can’t explain why framework-doubts feel *grammatically illicit* rather than merely impractical. Scientists don’t say "That’s a good point but I’m busy"; they say "That’s not a scientific objection" (OC §314).  

  ---

  ### **IV. Counterfactual Editorial Practices**  
  *(What changes if hinges are replaced?)*  

  **Scenario 1: Global Justificationism (No Exemptions)**  
  - All claims require evidence-chains. Referees demand citations for "samples collected on Earth."  
  - **Consequence:** Peer review collapses into infinite regress or dogmatism. Papers become unreadable (e.g., "We used a microscope (citation: Descartes 1637)").  

  **Scenario 2: Moorean Certainty (Hinges are Known)**  
  - Framework-objections are met with proof (e.g., "I know instruments track reality, as Moore knows he has hands").  
  - **Consequence:** Scientists waste effort "proving" hinges (e.g., calibrating instruments to prove realism), stalling productive work. Fraud allegations trigger crises of certainty.  

  ---

  ### **V. Philosophical Underdetermination**  
  The practice is **compatible with** (but not entailed by):  
  - **Coherentism:** Hinges are super-coherent nodes (objections dismissed as "irrelevant" to web).  
  - **Reliabilism:** Hinges are outputs of reliable processes (objections dismissed as "unreliable").  
  - **Entitlement Theory (Wright):** Hinges have default warrant (objections require defeaters).  
  - **Non-Propositionalism (Moyal-Sharrock):** Hinges are enacted, not believed (objections are "nonsense").  

  **What hinge-theory uniquely explains:** The *asymmetry* between framework-doubt and other doubts. Coherentism/reliabilism treat all doubts as commensurable; Wittgenstein treats framework-doubt as *logically distinct*—it attacks the "hinge" not the "door" (OC §343).  

  ---

  ### **Conclusion: Your Hypothesis Refined**  
  Your tripartite objection taxonomy (evidence/coherence/framework) robustly maps to the hinge structure. The practice strictly presupposes:  
  1. Hinges are **currently unjustifiable** within ongoing inquiry.  
  2. They are **accepted as authoritative** (not necessarily true).  
  3. They are **minimally shared** for coherent discourse.  

  **Where you conflate:** Hinges ≠ Kuhnian paradigms/Lakatosian cores. Hinges are *enabling conditions* for specific justifications (e.g., trusting notebooks); paradigms/cores are *theoretical commitments*. A Kuhnian revolution may change hinges, but hinges are more primitive.  

  **Revision Suggestion:** Frame peer review as **hinge-governed language-games**. The referee’s role is to enforce grammar, not metaphysics. This explains why "successful" framework-objections are those that *create new games* (e.g., doubt about data integrity spawns forensic auditing standards), not those that paralyze old ones.  

  ---  
  **Key Citations for Your Context:**  
  - Wittgenstein, *On Certainty*: §§87-90 (regress-stopping), §§341-343 (hinges as grammar).  
  - Moyal-Sharrock (2004): Hinges as non-propositional "rules of grammar."  
  - Wright (2004): "Entitlement" as default warrant for hinges.  
  - Wray (2011): *Kuhn’s Evolutionary Epistemology* (vs. hinge theory).  
  - Practical: Zollman (2018) on peer review as a "credibility economy."
