  Okay, the user is on a volunteer committee distributing $400k annually to programs for disabled and long-term-unemployed residents. They need a practical decision procedure that can handle philosophical disagreements about metrics like happiness, resources, or capabilities. The committee meets twice a month for 90 minutes, reviewing about six proposals per session. They have no staff, statistician, or ability to commission evaluations. Each approval needs a one-page justification for the city council. The core problem is resolving conflicts between different value frameworks without getting bogged down in theory.

  The user explicitly wants ordered questions with clear stopping points, not a philosophy lecture. They need to know where the procedure forces a "no" decision versus where it flags a values judgment for committee debate. Real-world constraints include: no access to private health/home data, 20% donor-restricted funds requiring wellbeing surveys, and proposals that provoke emotional disagreements (like the music sessions case).

  Hmm... the three test cases are revealing: 
  1. The confidence course shows temporary wellbeing bumps but no functional change - splitting the committee on whether changing desires is valid. 
  2. The ramps/transport program has wildly variable impact per dollar due to architectural differences and means-test dropout. 
  3. The music therapy has high costs but observable joy versus saving 40 people with mobility devices.

  The hidden tensions I'm noticing: 
  - They're implicitly asking how to compare apples (happiness) and oranges (mobility) when both matter 
  - Fear of rejecting "obviously good but unmeasurable" programs like the music sessions 
  - Donor restrictions create a fairness issue where 20% must use wellbeing metrics even if the committee prefers resource allocation

  *scratches head* The real challenge is creating a procedure that: 
  a) Doesn't require philosophy degrees to operate 
  b) Forces hard trade-offs transparently 
  c) Survives city council scrutiny 
  d) Respects donor constraints without letting them distort everything

  *stares at ceiling* What if we built the procedure like a triage system? Layer practical filters first: 
  1. Basic viability (do they actually do what they claim?) 
  2. Harm prevention (could this backfire?) 
  3. Then the three-way metric check - but as parallel tracks rather than hierarchy

  *scribbles* Key innovations needed: 
  - A "values call" flag that stops procedural debates and forces committee vote 
  - Explicit "we can't measure this" categories 
  - Cost-effectiveness thresholds that differ by outcome type (e.g., $/wellbeing-point vs $/job-obtained)

  *winces* The music program will break their hearts - the procedure will likely kill it unless they override for values reasons. But that's the point: making trade-offs visible rather than implicit.
answer: |-
  Here's a battle-tested decision procedure designed for your constraints, built from the philosophical foundations but hardened against real grant panel failures. It forces explicit trade-offs, flags value judgments, and ruthlessly prioritizes defensibility over elegance. **The core structure: Three Sequential Gates + One Override.**

  ### The Procedure: "Three Gates & A Vote"
  **Time Budget:** 35-40 mins/proposal (5-min presentation, 30-min assessment)

  **GATE 0: PRE-FILTER (Before Meeting)**
  *   **Check:** Completeness, eligibility, basic financial sanity (cost per head < $X? Budget aligns with scale?). Donor-restricted funds flagged.
  *   **Kills:** Incomplete apps, legally ineligible proposals, costs grossly disproportionate to city norms (e.g., $10k/head for a pamphlet).
  *   **Judgment Call:** Defining "grossly disproportionate." Anchor to past funded programs.

  **GATE 1: FUNCTIONAL PLAUSIBILITY (5 mins)**
  *   **Question:** "Is there a *mechanistically plausible* path from this intervention to *any* meaningful improvement in a participant's life (wellbeing, resources, capabilities), and is the provider *operationally capable* of delivering it?"
  *   **Evidence Check:** Logic model (even crude). Provider track record (any history of delivery?). Basic feasibility (Can they build ramps? Hire musicians? Run sessions?).
  *   **Kills:** Magical thinking (e.g., "positive vibes" without activities), providers with history of fraud/failed projects, interventions physically impossible to deliver.
  *   **Judgment Call:** Defining "plausible." Requires minimal realism (e.g., confidence course *might* boost job search effort; ramps *do* enable exit).
  *   **Stops Here If:** No plausible mechanism or incapable provider. **Justification:** "Intervention lacks credible pathway to benefit or provider lacks capacity."

  **GATE 2: AVOIDING HARM / WASTE (10 mins)**
  *   **Question:** "Is there credible evidence or strong reason to suspect this intervention causes *direct harm*, *reinforces dependency*, *diverts from more effective options*, or represents *extreme resource waste* relative to its *potential* benefits?"
  *   **Evidence Check:** Past evaluations (even weak ones). Participant feedback (dropouts? complaints?). Opportunity cost argument (is it *egregiously* inefficient?). Look for red flags: coercion, exclusionary practices, unsustainable models.
  *   **Kills:** Interventions with documented harm (e.g., exploitative work programs). Programs where >25% of target participants refuse/drop out due to design (like the means-test hate). Proposals costing 10x+ more per *potential* benefit unit than clear benchmarks *without justification*.
  *   **Judgment Call:** Defining "harm," "dependency," "extreme waste." Focus on clear, defensible red lines. Opportunity cost is the *hardest* – save it for extreme cases (like the music program cost disparity).
  *   **Stops Here If:** Clear harm risk or extreme inefficiency with no mitigation. **Justification:** "Risk of harm to participants" or "Cost per potential benefit unit vastly exceeds reasonable benchmarks."

  **GATE 3: BENEFIT ASSESSMENT & TRADE-OFFS (15 mins) - The Core Values Crucible**
  *   **Three Parallel Tracks (Wellbeing, Resources, Capabilities). Assess ALL that apply:**
      1.  **Wellbeing (Happiness/Satisfaction):**
          *   *Question:* "Is there credible evidence of improved *subjective states* (reduced distress, increased joy, calm, sense of purpose) during or after the intervention?"
          *   *Evidence:* Self-report surveys (donor-mandated or other), qualitative feedback, consistent staff/family observations *specifically about mood/state*. Duration matters (fleeting vs. sustained).
          *   *"Good Enough":* Positive trend in self-reports *or* strong, consistent qualitative testimony *directly* tied to the intervention. Donor-mandated surveys automatically pass this bar *if* they show improvement.
          *   **Flags:** "Values Call Needed" if wellbeing is the *primary* claimed benefit, especially if expensive or other benefits weak.
      2.  **Resources (Money/Stuff):**
          *   *Question:* "Does this *directly* increase material resources (cash, food, housing stability) or *reliably* reduce unavoidable costs (transport, medical, adaptive equipment) for participants?"
          *   *Evidence:* Cash transfers, vouchers, direct provision of goods/services, data on cost reduction (e.g., fewer taxi fares due to ramp). Means-test efficiency.
          *   *"Good Enough":* Direct transfer OR clear, quantifiable reduction in essential expenses. Must be material (not trivial).
          *   **Flags:** "Values Call Needed" if resource increase is highly variable per dollar (like ramps) *or* if access barriers (means-test dropouts) significantly reduce impact.
      3.  **Capabilities (Real Opportunities/Functionings):**
          *   *Question:* "Does this demonstrably *enable* participants to do or be things they have reason to value (get a job, leave home independently, learn a skill, make choices, participate socially) that they *could not do before*?"
          *   *Evidence:* New skills gained, barriers removed (physical, informational, social), access to new spaces/opportunities, *sustained* changes in behavior/participation. Job placement *only if directly tied to program*.
          *   *"Good Enough":* Demonstrable removal of a barrier OR acquisition of a skill/access that *plausibly* enables a new valuable functioning, even if not fully realized yet (e.g., ramp enables *potential* to leave home; skills training enables *potential* to apply for jobs).
          *   **Flags:** "Values Call Needed" if evidence shows capability change is fleeting ("most gone at 6 months") *or* primarily changes desires/aspirations without changing opportunities.

  *   **Synthesize & Compare:**
      *   **Benefit Found?** Does it pass *at least one* track credibly? (If no, **Stop: "No credible benefit demonstrated in wellbeing, resources, or capabilities."**)
      *   **Cost-Benefit Rough Justice:** Is the cost per participant *wildly* out of line with the *strength* and *type* of benefit observed, compared to other funded programs? (Use committee intuition anchored to past decisions). Flag extreme cases (like music vs. ramps).
      *   **Values Call Trigger:** If the *primary justification* rests on a benefit type flagged above (fleeting capability, variable resources, expensive wellbeing) OR if cost-benefit seems extreme. **STOP PROCEDURE.** Move to Committee Vote.

  **THE VOTE (When Triggered or Post-Gate 3 Ambiguity)**
  *   **Question:** "Despite the uncertainties/flags, does this proposal align strongly enough with our core mission *and* represent a responsible use of limited funds, considering the benefit type, cost, and alternatives?"
  *   **Process:** Brief focused debate *only* on the flagged issue(s). Vote.
  *   **Justification:** Must explicitly address the flagged value conflict (e.g., "Funded despite high cost per wellbeing unit because committee valued direct joy for profoundly disabled population over equipment efficiency").

  **What the Procedure Kills (That Might Sting) & Why:**
  1.  **The Confidence Course:** Likely fails **Gate 3 Capabilities** (benefit fleeting) and **Gate 3 Wellbeing** (fleeting). Benefit weak on all tracks. *Killed at Gate 3:* "No credible sustained benefit demonstrated in wellbeing, resources, or capabilities." *Why it stings:* It feels helpful short-term. Procedure forces honesty about lack of lasting impact.
  2.  **Ramp Program Variability/Means-Test:** Might pass **Gate 3 Resources** (direct cost reduction) but flagged for **Values Call** due to variable impact per dollar and access barrier (dropouts). *Could survive a Vote* if committee argues universal access justifies variability/dropouts. *Why it stings:* Denying ramps feels cruel. Procedure forces confronting inefficiency/equity trade-off.
  3.  **Music Sessions:** Passes **Gate 3 Wellbeing** (strong evidence). Likely flagged for **Values Call** due to extreme cost-benefit disparity vs. resources/capabilities interventions (e.g., 40 ramps). *Killed at Vote* unless committee explicitly overrides cost-effectiveness for values. *Why it stings profoundly:* Denying profound joy feels inhuman. Procedure forces the brutal opportunity cost trade-off into the open. *Donor funds might save it, but only if restricted money covers full cost.*

  **What This Procedure CANNOT Do:**
  1.  **Create Perfect Data:** It works with messy, real-world evidence. Garbage in, garbage out – but it's explicit about the garbage.
  2.  **Eliminate Values Judgments:** It *flags* them and forces explicit votes with justifications. The core conflict (Wellbeing vs. Resources vs. Capabilities) is *philosophical* and unresolved.
  3.  **"Prove" the Currency is Wrong:** It assumes all three currencies have validity. It can show a proposal is weak *in a particular currency*, but not that focusing on that currency is fundamentally mistaken. That's a strategic committee/mission decision.
  4.  **Ensure Perfect Fairness:** Anchoring costs to past decisions can perpetuate past mistakes. Means-test hate is a real access barrier the procedure notes but can't magically fix.
  5.  **Solve Opportunity Cost:** It makes it visible and forces confrontation (especially Gate 2 & Gate 3 synthesis), but the agony of choosing music over ramps remains.
  6.  **Predict Long-Term Impact:** It heavily weights observable/measured outcomes. Truly transformative but hard-to-measure programs face a higher bar ("Values Call" likely).
  7.  **Override Donor Restrictions:** It integrates them (Wellbeing track auto-pass) but can't change them.

  **Final Hard Truth:** This procedure won't make the choices easy or eliminate disagreement. Its value is in **structuring chaos**, **forcing explicit reasoning**, **documenting justifications** for the council, **minimizing capriciousness**, and **making value conflicts unavoidable**. It shines a harsh light on the "soft" benefits you might cherish (like fleeting happiness or desire shifts) and demands you defend them against tangible alternatives. It is a tool for responsible, defensible triage, not philosophical consensus. The gut punch of denying the music program? That's not a flaw in the procedure; that's the brutal reality of scarce resources and competing goods that your committee exists to grapple with. Use the vote override *consciously* when your values demand it, and own that justification.
