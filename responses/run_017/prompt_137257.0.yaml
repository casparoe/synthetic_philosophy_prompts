prompt: |-
  hey — I'm TAing a first-year historiography seminar next week and the session is built around that hoary old line about the past being a foreign country where they do things differently. Everyone reaches for it constantly and as far as I can tell it's doing completely opposite jobs depending on who's talking, so I want to take it apart properly instead of letting it skate through.

  Two uses I keep running into. Use A, the tourist use: a student says we basically can't morally assess anyone before 1900 or so — they were working with a different set of customs, so blame is a category error, roughly like yelling at locals for not speaking your language. Use B, the prosecution use: another student says fine, it's a foreign country, but we don't suspend judgment about what goes on in foreign countries today — we condemn practices elsewhere all the time — so foreignness buys past agents nothing at all, and the analogy is meant to show that understanding isn't excusing.

  My own half-formed addition, which I can't tell is a fix or a sabotage: the past isn't really a foreign country, it's more like a country we annexed and then built our constitution out of its rubble. Our moral vocabulary is partly a bequest from the people we're judging, so we're auditing them with a ledger they helped write — call it the double-entry problem if you want. There's nothing like that in tourism.

  So: give me the correspondence table first — what plays the tourist, the border, the guidebook, the locals, the local custom, the return ticket, the home country's norms — and say whether Use A and Use B are even mapping things the same way. Then the disanalogies, and please sort them into ones that actually bite on the intended uses and ones that are just decoration. Ones I can see but can't weigh: the locals are dead and can't answer back, revise their story, or be negotiated with, and there's no present government to pressure; we're causally downstream of these people in a way we aren't from a country we visit; "they do things differently" pretends a whole society has one shared custom when half the time the contemporaries were screaming at each other about it, so who exactly is "they"; foreignness is symmetric but temporal distance isn't; and the traveler's home norms get treated as the correct ones rather than as just local too.

  Tell me which of Use A and Use B survives once that's on the table, whether my annexation tweak rescues either of them or quietly concedes the whole question, and whether there's a better analogy — arguing with your younger self, joining an argument late, reading a family archive, whatever — or whether the honest verdict is that the foreign-country picture is carrying conclusions that nothing in it supports. Under 700 words including the table, and skip the bibliography entirely, I've got the reading list.
reasoning: |-
  Okay, let's tackle this historiography problem. The user is a TA preparing a seminar on that overused "past is a foreign country" analogy, and wants to dissect its contradictory applications. 

  First, I notice the user has already identified two main interpretations: the tourist approach (moral suspension) and prosecution approach (no moral immunity). Their own annexation metaphor adds complexity about shared moral foundations. The challenge is to systematically unpack the analogy's components and test its coherence.

  Hmm, the user's request has several layers: they want a correspondence table mapping elements of the analogy, then an analysis of disanalogies sorted by argumentative impact, and finally an evaluation of whether either use survives scrutiny. The annexation metaphor needs assessment too - is it repairing or undermining the original? 

  The table should clarify why the two uses conflict. For Use A, the "tourist" implies observer status, while Use B's "prosecution" casts the historian as active moral agent. The "border" element is particularly slippery - in tourism it's geographical, in history it's temporal but porous. 

  Key disanalogies that actually break the analogy's logic:
  - The dead can't defend themselves or evolve (unlike living foreigners)
  - We inherit moral frameworks from the past (no parallel in tourism)
  - Temporal asymmetry vs. geographical symmetry
  - "They" implies false homogeneity about historical societies

  The annexation metaphor interestingly addresses the inheritance problem but might concede too much - if we're built from their rubble, how objective can judgment be? Still feels more honest than the foreign country trope. 

  Alternative analogies occur to me: joining a conversation mid-argument (we reconstruct context from fragments) or reading old family letters (intimacy with inherited biases). But perhaps the healthiest approach is admitting no analogy captures historical judgment - it's its own beast with unique tensions between understanding and critique.

  The user seems frustrated with glib applications of the quote, wanting tools to help students see its limitations. Their annexation idea shows they're wrestling with historiography's core paradox: we must judge the past both as alien and ancestral. I'll emphasize that tension in the response.
answer: |-
  Here's the correspondence table and analysis:

  ### Correspondence Table
  | Element          | Use A (Tourist)             | Use B (Prosecution)         |
  |------------------|-----------------------------|-----------------------------|
  | **Tourist**      | Modern historian            | Modern moral judge          |
  | **Border**       | Temporal divide             | Temporal divide             |
  | **Guidebook**    | Historical context          | Historical evidence         |
  | **Locals**       | Past people                 | Past perpetrators           |
  | **Local Custom** | Past norms (singular)       | Past practices (condemned)  |
  | **Return Ticket**| Return to present norms     | N/A (permanent moral stance)|
  | **Home Norms**   | Neutral baseline            | Universal moral standard    |

  ### Key Disanalogies (Biting vs. Decorative)
  **Biting Disanalogies** (undermine both uses):  
  1. **Asymmetry of Time**: We inherit moral/political frameworks *from* the past. Tourism lacks this causal dependency.  
  2. **Death/Non-Reciprocity**: Past actors can't defend, explain, or adapt. Modern foreigners can.  
  3. **"They" is Fiction**: Societies contain dissent (e.g., enslaved people vs. enslavers). Tourism often flattens "local culture."  
  4. **No Neutral "Home"**: Present norms aren't objective (they evolved from past contestation). Tourists *do* treat home norms as default.  

  **Decorative Disanalogies** (rhetorical but non-fatal):  
  - No present government to pressure (Use B adapts by judging individuals)  
  - Physical distance vs. temporal distance (both create barriers to understanding)  

  ### Survival of Uses
  - **Use A collapses**: Its "moral suspension" relies on treating the past as *externally* foreign. But if our norms are *inherited* from the past (your annexation point), we can't pretend detachment. We're implicated.  
  - **Use B weakens but endures**: It correctly rejects blanket immunity but ignores that our "universal" standards are partly shaped by the past. We must ask: *Whose* morality are we applying? The dissenters'? The victors'?  

  ### Your "Annexation" Tweak: Fix or Sabotage?
  **It sabotages the analogy but fixes the debate.** By highlighting that we "built our constitution out of [the past's] rubble," you:  
  - Concede that the foreign-country analogy is fundamentally broken (no shared foundation in tourism).  
  - Reframe the core problem: Historical judgment is **intra-familial accounting**, not cross-cultural tourism. We judge ancestors using tools they helped forge.  

  ### Better Analogies
  1. **Joining an Argument Mid-Debate**: We enter an ongoing moral conversation. We can critique past speakers (e.g., "Your premises are flawed") but must reconstruct the full dialogue first.  
  2. **Reading a Family Archive**: We discover both laudable and abhorrent acts by kin. We inherit their legacy (good/bad), making judgment necessary but complex.  
  3. **Reopening a Cold Case**: Evidence is fragmentary, witnesses are dead, but justice demands scrutiny using modern tools *while admitting* those tools evolved from the original context.  

  ### Verdict
  The foreign-country analogy smuggles in untenable assumptions:  
  - That moral frameworks are static (they aren’t).  
  - That temporal distance = cultural distance (ignores lineage).  
  - That "understanding" requires either absolution or condemnation (false binary).  

  **Drop the analogy.** Focus on **historical situatedness**: Moral assessment requires reconstructing *contested* past norms, acknowledging our conceptual debt to the past, and admitting that judgment serves present ethical needs. Your "annexation" model does this better.  

  **Seminar Takeaway**: The past isn’t foreign—it’s ancestral. We judge not aliens, but predecessors whose choices shaped our moral vocabulary. This demands humility *and* rigor, not touristic detachment or anachronistic prosecution.  

