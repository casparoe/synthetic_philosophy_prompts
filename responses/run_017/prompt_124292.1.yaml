  Okay, the user is a journalist who's deeply immersed in psychology and moral science literature. They've noticed a consistent pattern in academic work where researchers present cultural differences in moral judgments as profound in one context but later downplay them as superficial in another. This inconsistency puzzles them, and they're seeking clarity on whether this maneuver has a name, how to identify it, and what evidence could resolve such ambiguities.

  First, I need to unpack their core frustration. They've observed a "depth dial" phenomenon where the interpretation of cross-cultural moral differences shifts based on rhetorical needs—sometimes emphasizing deep cultural relativity, other times dismissing it as methodological noise. They've ruled out motte-and-bailey, confirmation bias, and standard arguments from moral disagreement. Their real need is to pinpoint this maneuver conceptually and find diagnostic tools to detect it.

  I should start by brainstorming related concepts. Epistemic underdetermination comes to mind—where data supports multiple interpretations. Also, there's Kuhnian incommensurability regarding different theoretical frameworks, and defeasibility where evidence is inherently provisional. But none fully capture the bidirectional, context-dependent shifting they describe. 

  The depth dial isn't just about ambiguity; it's about actively leveraging that ambiguity. It resembles theory-ladenness of observation, but specifically involves moral ontology—what counts as a "real" moral judgment. The key is the selective application of interpretive charity: when researchers dismiss differences as shallow, they're assuming universal moral concepts exist beneath surface variations, but when emphasizing depth, they're denying such universality. This inconsistency suggests a deeper methodological gap in how we define moral judgments cross-culturally.

  For diagnostics, I'd look for asymmetrical skepticism—questioning methods only when results challenge the author's stance. Also, watch for "ontological gerrymandering," where definitions of morality expand or contract situationally. To resolve specific cases, we'd need studies that first establish conceptual equivalence through ethnographic grounding, then test for deep disagreements that persist even when beliefs and contexts are controlled. But this is methodologically thorny; the real issue might be that "depth" isn't a binary but a spectrum, and researchers aren't transparent about their assumptions.

  The user likely wants both conceptual clarity and practical tools. Naming this "the moral ontology dial" could help, but more crucially, they need ways to call out this slippage in their journalism. Highlighting cases where authors contradict their own framing or bypass conceptual validation would be useful. Ultimately, the field might need to acknowledge that moral psychology's core constructs are still contested—and that's okay, as long as we flag it instead of toggling interpretations silently.
answer: |-
  Based on your detailed description and my expertise in metaethics, epistemology of disagreement, and cross-cultural methodology, I've systematically analyzed the pattern you observe. Below is the conceptual breakdown, candidate concepts, diagnosis, and practical diagnostics.

  ### Candidate Concepts & Their Predictions
  1.  **Epistemic Underdetermination:**
      *   **Description:** The empirical data is genuinely compatible with multiple, mutually incompatible interpretations (e.g., deep moral difference vs. shallow methodological artifact).
      *   **Prediction:** Researchers would acknowledge the ambiguity, express caution, and propose further research to distinguish interpretations. They wouldn't present *both* strong, incompatible claims definitively as conclusions within the same work without addressing the tension.
      *   **Fit?** **Partial.** This explains *why* the maneuver is *possible* (the evidence base *is* often underdetermined). However, it doesn't explain the *active, bidirectional shifting* ("depth dial") without acknowledgment of the underdetermination itself.

  2.  **Kuhnian Incommensurability / Paradigm Relativity:**
      *   **Description:** Researchers operating within different theoretical frameworks (e.g., strong moral nativism vs. cultural relativism vs. moral pluralism) interpret the *same* data differently because their paradigms define key concepts (like "moral judgment," "value," "universality") differently.
      *   **Prediction:** Shifts would occur *between* authors or research groups committed to different paradigms. An author wouldn't typically shift *within* their own argument to a fundamentally incompatible paradigm without explicit justification.
      *   **Fit?** **Partial.** Explains differences *between* researchers. Doesn't explain the *intra-author* and *intra-work* oscillation you observe, where the same person leverages both interpretations strategically.

  3.  **Defeasibility of Evidence:**
      *   **Description:** All empirical evidence is provisional and open to reinterpretation or dismissal based on new considerations (e.g., methodological flaws, alternative explanations).
      *   **Prediction:** New evidence or arguments *replacing* the initial interpretation. It wouldn't predict the *simultaneous* or *context-dependent* presentation of both the strong claim *and* its defeater within the same reasoning stream without resolving the conflict.
      *   **Fit?** **Partial.** Explains why limitations are discussed, but not why the strong claim is maintained *alongside* its potential defeater when convenient, nor the bidirectional nature.

  4.  **Theory-Ladenness of Observation:**
      *   **Description:** What researchers "see" in the data is influenced by their prior theoretical commitments.
      *   **Prediction:** Consistent interpretation bias *within* a researcher's work aligned with their theory. It doesn't predict the *flexible* switching based on rhetorical need ("depth dial").
      *   **Fit?** **No.** While theory influences interpretation, this concept describes a relatively *stable* bias, not the agile, context-dependent shifting you document.

  5.  **Motivated Reasoning / Bias (Confirmation Bias, Biased Assimilation):**
      *   **Description:** Interpreting evidence in ways that favor desired conclusions.
      *   **Prediction:** Consistent slant towards one pole (e.g., always emphasizing universality or always emphasizing relativism). It struggles to explain the *bidirectional* shifting ("dial turned to whatever setting the conclusion needs") within the same author or work.
      *   **Fit?** **Partial.** Captures the *purpose* (supporting a desired conclusion) but is too coarse-grained. It misses the *specific structure*: the leverage of *mutually incompatible substantive interpretations* of the *same finding* depending on the immediate argumentative context, especially the intra-work inconsistency you note.

  6.  **Conceptual Gerrymandering / Boundary Work:**
      *   **Description:** Strategically defining the boundaries of a core concept (e.g., "morality," "genuine moral judgment") to include or exclude phenomena based on argumentative need.
      *   **Prediction:** Shifting definitions of what counts as the "real" phenomenon under study to suit the argument. "Deep" when boundary excludes the other group's response; "Shallow" when boundary is expanded to include them under a universal umbrella.
      *   **Fit?** **Strong Candidate.** This captures the "sideways" move you describe – it's not weakening the claim, but redefining the *ontology* of what was measured. When emphasizing deep difference, the non-WEIRD response is framed as falling *outside* the "true" domain of moral judgment (as the researcher implicitly defines it). When emphasizing shallowness, the response is redefined as falling *within* the domain of moral judgment, just manifesting differently due to context/beliefs. The "depth dial" controls the scope of "morality."

  7.  **The Methodological Truism Maneuver:**
      *   **Description:** Leveraging the inherent difficulty and interpretive nature of cross-cultural comparison.
      *   **Prediction:** Using standard methodological caveats (translation issues, contextual differences) not as genuine limitations requiring caution, but as *ad hoc* tools to neutralize inconvenient findings while maintaining the utility of the same methods for convenient findings.
      *   **Fit?** **Strong Candidate.** Explains the shift to "shallow" interpretations. The key is the *selective* and *conclusion-driven* application of these truisms.

  **The Diagnosis: "The Moral Ontology Dial" (or "Conceptual Boundary Dial")**

  *   **Definition:** The bidirectional, strategic adjustment of the *ontological scope* of what constitutes a "moral judgment" (or core moral value/concept) in cross-cultural research, driven by immediate argumentative needs rather than a consistent theoretical or methodological principle. When emphasizing cultural variation *as deep*, the scope is narrowed, excluding the target population's response from the domain of "genuine moral judgment" (implying fundamentally different moral ontologies). When defusing variation *as shallow*, the scope is broadened, redefining the response as belonging to the same moral domain but differing in application due to context or belief (preserving a universal moral ontology). This maneuver exploits the genuine epistemological challenges and underdetermination inherent in cross-cultural moral psychology.
  *   **Why Established Concepts Don't Fully Fit:** While elements of underdetermination, motivated reasoning, conceptual gerrymandering, and leveraging methodological truisms are present, no single concept captures the *bidirectional*, *intra-author/intra-work*, *ontology-shifting* nature focused specifically on the definition of "moral judgment" that you observe. Motte-and-bailey involves weakening a claim; this involves redefining the subject matter. Confirmation bias is typically unidirectional. Paradigm shifts are usually inter-author.

  **Diagnostics for Readers:**

  1.  **Track the Definition of "Moral Judgment":** Scrutinize how the author defines or operationalizes a "moral judgment" or "moral domain" *in the specific context* of each claim. Does the definition subtly shift?
      *   *Red Flag:* When arguing for deep difference: Does the definition implicitly require features *only* the WEIRD response exhibits (e.g., impartiality, harm focus, third-party punishment readiness)? Does it frame the non-WEIRD response as "not *really* moral" (e.g., "conventional," "prudential," "personal obligation," "mere tradition")?
      *   *Red Flag:* When arguing for shallowness: Does the definition suddenly become broad and inclusive? Is the non-WEIRD response now described using core moral language (e.g., "they value loyalty/hierarchy/purity," "they have different beliefs about well-being") that subsumes it under a universal framework? Is the initial operationalization (which showed difference) dismissed as not capturing the "true" moral core?

  2.  **Identify Asymmetrical Skepticism:** Does the author apply methodological critiques (translation validity, contextual understanding, belief differences) consistently?
      *   *Red Flag:* Are these critiques deployed *with particular vigor only* when findings challenge universality (to dismiss them as "shallow"), but minimized or ignored when findings support universality or the author's preferred theory?

  3.  **Check for Intra-Work Inconsistency:** Does the paper's Discussion section make strong claims about deep variation based on the findings, while the Limitations section (or a subsequent rebuttal) uses arguments that, if taken seriously, would completely undermine the possibility of making those strong comparative claims in the first place (e.g., "cross-cultural comparisons are fraught, instruments may not measure the same thing") *without* reconciling this tension?

  4.  **Look for "Ontological Gerrymandering":** Is the boundary of "morality" being strategically redrawn around the data points to fit the desired narrative of deep difference or underlying universality, rather than employing a stable, pre-defined, and justified criterion?

  **Settling Depth vs. Shallowness in a Concrete Case:**

  Resolving whether a specific cross-cultural difference is "deep" (reflecting fundamentally different moral concepts/ontology) or "shallow" (different application of shared concepts due to context/beliefs) is immensely difficult but not always permanently intractable. A robust approach would require:

  1.  **Conceptual Validation First:** Before comparative experiments, extensive ethnographic work (interviews, observation, discourse analysis) *within each culture* to map the local moral concepts, vocabulary, and practices. This establishes what *counts* as "moral" in each context independently, avoiding WEIRD-centric definitions. (e.g., Does "purity" function as a distinct, obligatory, authority-independent domain in Culture X, as per local understanding?).
  2.  **Test for "Deep Disagreement":**
      *   **Control for Beliefs & Context:** Design scenarios/vignettes that systematically vary contextual factors and probe underlying empirical beliefs. If differences persist even when beliefs about consequences, causality, or context are controlled for or shown to be equivalent, it strengthens the "deep difference" hypothesis. (e.g., If a harm is clearly understood *as harmful* by both groups, but only one views it as morally *wrong* requiring intervention, that's evidence for depth).
      *   **Test for Incommensurability:** Present arguments or justifications based on one culture's moral framework to members of the other. Do they find them completely unintelligible, irrelevant, or non-moral? Or do they understand them but simply weigh the values differently? The former suggests deeper divergence.
      *   **Trace Implications:** If a value (e.g., community obligation vs. individual right) leads to radically different conclusions across a wide range of seemingly unrelated scenarios within each culture, it suggests a fundamental organizing principle (depth). If the difference is highly context-specific, it suggests shallowness.
      *   **Neural/Physiological Correlates (Cautiously):** If purported "moral" judgments in one culture consistently lack neural/physiological signatures associated with core moral cognition in other cultures (e.g., specific patterns in vmPFC, amygdala, disgust response, autonomic arousal related to norm violation), *and* these signatures are present for what *that culture* identifies as core moral violations, this *could* support depth (but this is fraught with interpretive challenges).
  3.  **Abandon the Binary?:** Recognize "depth" may be a spectrum. Differences can be profound without being completely incommensurable. The key is rigorous justification for *why* a difference is interpreted as reflecting core ontology vs. contingent application, based on the above steps, not rhetorical convenience.

  **Conclusion:**

  The maneuver you've identified is real and pervasive. While it exploits genuine challenges (underdetermination, methodological difficulties), it constitutes **Conceptual Boundary Dialing** or **Moral Ontology Dialing**. It involves strategically shifting the definition of "moral judgment" to either exclude (framing difference as deep) or include (framing difference as shallow) the observed behavior within a universalist framework, driven by argumentative needs rather than consistent principle. The diagnostics above provide tools to detect this slippage. Settling specific cases requires moving beyond simple comparative surveys to deep conceptual validation and controlled tests probing the structure and roots of the judgments. The field's progress depends on acknowledging this dialectic explicitly rather than toggling the dial silently.
