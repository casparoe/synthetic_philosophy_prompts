  I recall several relevant concepts: collective choice theory handles group decisions but assumes separable preferences. Multi-person decision theory allows interdependence but usually maintains individual sovereignty. The Nash equilibrium considers mutual best responses but requires fixed strategies. None perfectly capture this "joint action space" where individual agency only exists relationally.

