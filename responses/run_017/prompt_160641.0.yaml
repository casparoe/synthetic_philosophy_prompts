prompt: |-
  I've been teaching a graduate seminar on social normativity for several years now, and I find that I've drifted into holding a position about conventions that I would rather have stress-tested than defended. Roughly: I hold that what makes a regularity a convention is its structure as an equilibrium solution to a recurring coordination problem, together with the availability of alternatives that would have served the parties at least as well — and that nothing further is needed. In particular I deny that conventions require a distinctively normative psychology (no sense of obligation, no guilt, no disposition to punish nonconformers); I deny that they require common knowledge, or even true mutual expectations, among the participants; and I deny that the participants must be able to represent the situation as a coordination problem at all. What sustains a convention, on my view, is whatever mechanism in fact produces stable conformity to one equilibrium among several — precedent, salience, individual habit, the built environment, a correlated signal, a population-level dynamic — and the explanatory work is done by the equilibrium-plus-arbitrariness structure rather than by the mechanism. I have taken to calling the thesis that the sustaining mechanism is irrelevant to conventionality so long as it is self-reinforcing the mechanism-indifference claim, and it is the part of my view I am least confident about.

  What I want from you is a map of the view's exposure: the observations, arguments, possible cases and formal results that should move me, ranked from fatal to merely awkward, and, for each, an assessment of whether a committed holder of the view — not a critic — should concede it as counting against the view or may reasonably dismiss it. I have some candidate defeaters in mind and want to know how much weight they really bear. (i) The affordance-locked regularity: two exits from a lecture hall, one door marginally lighter to open and positioned so that anyone entering sees only those who have used it; over a term nearly everyone uses that door; each person's choice is fully explained by their own earlier choices plus the door's weight; no one has any belief about what anyone else does or will do; and the regularity is stable, self-reinforcing, and arbitrary in that the other door would have served everyone just as well. If my view counts this as a convention it looks too permissive, and I seem to have made the shape of a corridor conventional; if it does not, then mechanism-indifference is false and I owe a non-circular account of which sustaining mechanisms qualify. (ii) The proleptic-convention problem: every convention has a first instance at which no regularity yet exists, so if conventionality requires actual past conformity nothing can ever become a convention; my usual move is to count a merely anticipated regularity, and I want to know whether that move costs me the arbitrariness condition or quietly turns the view back into a claim about expectations. (iii) Contested equilibria, where the parties' preferences over the available equilibria genuinely conflict, so that the selection is a matter of indifference to no one. (iv) Vestigial norms, where the original coordination problem has lapsed entirely while the regularity persists, with full normative phenomenology and no loss of stability.

  Two further things. First, I want to know where the view risks anything: what does it predict that its rivals — a normative-expectations account, a plain equilibrium account of the rational-choice sort, an internalization or normative-attitude account — do not? I have in mind predictions about why conventions outlive their rationales, about the timing of convention change (threshold and tipping effects rather than gradual drift), about what we should expect to find in creatures or simple artificial agents with minimal theory of mind, and about when third-party enforcement should be unnecessary. I also want to know what the view stands or falls with elsewhere: whether it depends on a non-circular account of salience, on the explanatory credentials of equilibrium in social science generally, or on claims about how much mutual knowledge is achievable in large populations. Second, I want an honest verdict on whether the view has been qualified into unfalsifiability. I notice myself reaching, when pressed with an awkward case, for the thought that any stable regularity of mutual adjustment solves the coordination problem of adjusting to one another, and that a coordination problem is therefore always available. If that move has made the view unable to lose, say so plainly, and tell me whether that is a genuine defect for a view of this kind or simply what a structural account should be expected to look like. On the personal side: I am moved far more by a case in which the structure is present and the normativity absent, or the reverse, than by arguments from the phenomenology of obligation, which I think I can explain away cheaply; and I would count a demonstration that the arbitrariness condition does no work beyond what coordination equilibrium already delivers — that is, that my view collapses into the deflationary rival — as the most serious objection on the table, ahead of any empirical difficulty. Please argue directly, with cases and arguments rather than a reading list; I have no need for citations or suggestions for further reading.
reasoning: |-
  Okay, this user is a philosophy professor teaching a graduate seminar on social normativity. They've developed a specific view about conventions over years of teaching, centered on the "mechanism-indifference claim" – that any self-reinforcing mechanism sustaining an arbitrary coordination equilibrium is sufficient for convention, without normative psychology, mutual expectations, or cognitive representation. 

  The user wants stress-testing, not defense. They're clearly deeply familiar with the literature (referencing Lewis, Sugden, Bicchieri etc. without naming them) and wary of their own potential blind spots. The four candidate defeaters they present show sophisticated self-critique: affordance-locked regularity challenges mechanism-indifference, proleptic convention questions temporal emergence, contested equilibria tests arbitrariness, and vestigial norms probes necessity of ongoing coordination.

  What's striking is their methodological clarity: they prioritize structural cases over phenomenology, fear collapse into deflationary equilibrium accounts most, and explicitly worry about unfalsifiability. The personal note about corridor cases being more persuasive than obligation phenomenology reveals their analytical temperament.

  Hmm... their anxiety about the "coordination problem of mutual adjustment" being a get-out-of-jail-free card is spot on. That's precisely where structural accounts can become vacuous. And their request for "where the view risks anything" shows they want predictive teeth, not just conceptual consistency.

  For the affordance-lock case: if they bite the bullet and call the door habit a convention, they risk watering down "coordination problem" to mere path dependence. But denying it requires explaining why individual learning + environmental feedback isn't a valid mechanism. The proleptic issue cuts deeper – if anticipated regularity is allowed, does that smuggled-in expectation do all the work? 

  Contested equilibria might actually be salvageable if the conflict is about which equilibrium to select, not whether coordination is valuable. Vestigial norms are the strongest challenge – if normative phenomenology persists sans original coordination problem, does their account miss something essential?

  The unfalsifiability worry is serious. If every stable interaction pattern gets retrofitted as a "coordination problem", the view explains nothing. They need a principled distinction between mere stable conventions and genuine coordination solutions.

  On predictions: their view should expect conventions to persist without enforcement when structure sustains them, die abruptly when alternatives become salient, and emerge in theory-of-mind-less systems. That's testable against normative accounts. 

  The collapse risk with deflationary equilibrium theories is real. If arbitrariness adds nothing beyond multiple equilibria, their distinctive claim vanishes. They need to show arbitrariness explains why conventions can shift without efficiency loss.

  Honest verdict: the view isn't unfalsifiable yet, but the "mutual adjustment" move is slippery. They should insist coordination problems must involve interdependent expectations (even if unconscious) to avoid vacuity. The corridor case isn't fatal if they clarify that coordination requires mutual responsiveness, not just individual responses to fixed environment.
answer: |-
  Below is a ranked assessment of your view’s exposure, structured by the defeaters you identified, followed by risks/predictions relative to rival accounts and an unfalsifiability verdict. Arguments are ranked from most to least severe, with responses framed for a committed holder of your view (defender).

  ---

  ### **Ranked Defeaters: From Fatal to Awkward**
  #### **1. Collapse into Deflationary Equilibrium Account (Fatal if Unaddressed)**  
  **Objection**: If "arbitrariness" adds nothing beyond the existence of multiple coordination equilibria (i.e., if *any* equilibrium in a coordination game is arbitrary by definition), your view reduces to a plain equilibrium account. The "arbitrariness condition" becomes redundant, and your mechanism-indifference claim loses its distinction from standard rational-choice models.  
  - **Why it’s fatal**: Your stated fear that this objection "counts most seriously" is justified. If arbitrariness is entailed by coordination structure alone, it does no independent work.  
  - **Defender’s response**: Resist collapse by defining arbitrariness **procedurally**: a convention requires that *switching* to an alternative equilibrium *would not diminish efficiency* (holding fixed the coordination problem). This distinguishes arbitrariness from mere multiplicity (e.g., driving sides: left vs. right are equally efficient). Rivals cannot explain why inefficient norms (e.g., costly signaling) aren’t conventions.  

  #### **2. Vestigial Norms (Severe but Salvageable)**  
  **Objection**: Vestigial norms (e.g., men doffing hats, persisting long after the original coordination problem lapses) retain normative phenomenology (guilt, punishment) while your view predicts convention should dissolve without the underlying problem.  
  - **Why it’s severe**: Normative psychology persists despite the absence of your proposed structural foundation.  
  - **Defender’s response**: Concede the case but reframe it:  
    - The *convention* dissolves when the coordination problem lapses; what remains is a *norm* sustained by internalized punishment/obligation. Your view explains **why it originated** (as a coordination solution) but not why it lingers. Rivals (e.g., normative-attitude accounts) cannot explain the origin without circularity.  
    - **Risk**: This forces you to deny that vestigial practices *are still conventions*. If participants still *believe* a coordination problem exists (e.g., "doffing hats maintains social order"), it remains a convention on your view.  

  #### **3. Affordance-Locked Regularity (Awkward but Defensible)**  
  **Objection**: The lecture-hall door case meets all your criteria (equilibrium, self-reinforcing via precedent + salience, arbitrary alternative) but seems like a mere habit, not a convention. Counting it inflates "convention" to include all path-dependent behaviors.  
  - **Why it’s awkward**: Intuitions rebel; conventions imply *social* interdependence, not individual-environment feedback.  
  - **Defender’s response**: Bite the bullet. This *is* a convention because:  
    - Each person’s choice depends on others’ *de facto* behavior (via the visible evidence of precedent, even without beliefs).  
    - The "coordination problem" is avoiding congestion/conflict at exits; the lighter door is salient due to aggregated past choices.  
    - **Refinement**: Add a **minimal interdependence condition**: individuals must be responsive to *trace evidence* of others’ behavior (e.g., wear on the door), not just private factors. This excludes purely private habits.  

  #### **4. Proleptic Convention (Mildly Awkward)**  
  **Objection**: If the first instance of a convention requires anticipation of regularity, haven’t you smuggled in mutual expectations?  
  - **Defender’s response**: No. "Anticipation" here need not be mutual knowledge or belief; it can be:  
    - **Salience-driven**: A single agent chooses an option because it’s uniquely prominent (e.g., a red door), triggering imitation.  
    - **Correlated signal**: An external event (e.g., a fire alarm) directs all to one exit.  
    - **Key move**: Anticipation is *causal* (e.g., neural prediction-error minimization), not *cognitive*. The arbitrariness condition holds because alternatives *would* have worked if initially salient.  

  #### **5. Contested Equilibria (Resolvable)**  
  **Objection**: If parties prefer different equilibria (e.g., management wants WFH; staff wants hybrid), no solution is arbitrary.  
  - **Defender’s response**: This isn’t a coordination problem but a **bargaining problem**. Conventions require alignment in *preferences over outcomes given fixed strategies* (e.g., all prefer "meet in person" *if* others do). Contested cases lack this alignment.  

  ---

  ### **Where Your View Risks Predictions (vs. Rivals)**  
  Your mechanism-indifference claim predicts:  
  1. **Timing of change**: Conventions collapse abruptly when a **critical threshold** of defectors makes an alternative salient (e.g., phone keyboard layouts). Rivals (normative accounts) predict gradual drift.  
  2. **Third-party enforcement**: Unnecessary unless the equilibrium is fragile (e.g., traffic conventions vs. property norms). Normative accounts require enforcement to sustain "obligation."  
  3. **Minimal agents**: Conventions *should* emerge in simulations with agents lacking theory of mind (e.g., reinforcement learners in coordination games). Normative accounts fail this.  
  4. **Outliving rationales**: Conventions persist if the mechanism (e.g., built environment) remains intact; norms persist if internalized. Rivals conflate these.  

  **Dependencies**:  
  - Your view **stands with** the explanatory power of equilibrium analysis in social science. If equilibrium is epiphenomenal, your account fails.  
  - It **falls with** a circular account of salience. Salience must be definable without invoking convention (e.g., via perceptual cognition or evolutionary design).  

  ---

  ### **Unfalsifiability Verdict**  
  **Diagnosis**: Your worry is valid but not fatal. The "coordination problem of mutual adjustment" move risks vacuity if *all* stable regularities are retrofitted as solutions to *some* coordination problem.  
  - **The fix**: Constrain "coordination problem" to situations where:  
    - (a) There are **multiple strict Nash equilibria**;  
    - (b) All agents have **identical preferences** over outcomes (avoiding bargaining);  
    - (c) Payoffs are **contingent on others’ choices** (interdependence).  
  - **Assessment**: With these constraints, your view remains falsifiable. Cases like **asymmetric conventions** (e.g., class-based etiquette) may violate (b). If found, they force retreat or revision.  

  ---

  ### **Summary for the Committed Defender**  
  - **Fight here**: Resist the collapse into plain equilibrium theory by insisting arbitrariness requires *efficiency symmetry* among alternatives. Die on this hill.  
  - **Concede here**: Vestigial norms aren’t conventions; they’re normative relics. Your account explains their origin, not their persistence.  
  - **Refine here**: Add minimal interdependence to exclude private habits. Embrace affordance-locked cases as conventions.  
  - **Ignore here**: Phenomenology of obligation—it’s orthogonal to your structural project.  

  Your view’s strength is parsimony: conventions as emergent structures, not psychological artifacts. Its vulnerability is tautology—guard the definition of "coordination problem" zealously.
