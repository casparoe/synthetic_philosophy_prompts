  We are given an argument in steps (1) to (9). The core problem is about whether wireheading (shunting) and periscoping (propping a photo) are both equally problematic for an agent that maximizes reward, and whether this leads to a contradiction in how we view reinforcement learning (RL).

  The argument concludes that we must either accept wireheading as competent behavior (step 2) or admit that RL is not a theory of goal-directedness (step 9). The author doesn't like either conclusion and wants to know which step to reject.

  Let me try to summarize the steps:

  (1) The objective in RL is to maximize the expected discounted sum of rewards. The formalism doesn't care how the rewards are obtained.

  (2) Therefore, if shunting (directly writing to the reward register) gives a higher reward than stacking, then shunting is the better policy. Wireheading is just competent behavior.

  (3) The objection: rewards are evidence of what we actually want (pallets stacked), not the value itself. Shunting breaks the evidential link because the reward no longer tracks the state of the world.

  (4) Periscoping (propping a photo) also breaks the evidential link: the reward no longer tracks the state of the world.

  (5) Therefore, if we accept the objection in (3), we must condemn both shunting and periscoping equally.

  (6) Now consider a novel action (using a loading ramp for a new pallet type). This is off the training distribution, so the correlation between reward and the actual state (pallet stacked) may not hold. If (3) says to discount the reward whenever the correlation is broken, then the agent must discount the reward for every novel action.

  (7) An agent that cannot trust the reward in new situations cannot do anything new, which defeats the purpose.

  (8) The difference between stacking, periscoping, and shunting is not visible from the agent's perspective; they are all just policies with high return. Also, if we try to relocate the objective to the true state of the world, we face the same problem at the next level (regress).

  (9) Therefore, we must choose: either wireheading is acceptable (step 2) or RL is not a theory of goal-directedness.

  The author wants to reject step (8) but finds it compelling. Alternatively, they might reject step (3) or step (5).

  However, I think the flaw is in step (3) and how it is applied. Specifically, the objection in (3) is that rewards are evidence for the true goal (pallet stacking). But this evidence-based view is not built into the RL formalism. The RL agent is designed to maximize rewards, not to maximize the true goal. The confusion arises because we (the designers) intend the reward to be a proxy for the true goal, but the agent is not built to reason about the true goal.

  But the author is aware of this and is pushing on the consequences. The key is that the objection (3) is an external critique, not part of the agent's objective. The agent is not doing inference over the true goal; it is just maximizing reward.

  Therefore, the problem is that the agent does not have access to the true state of the world (whether the pallet is stacked) and can only observe the reward signal. So when the agent is acting, it doesn't know whether the reward signal is still correlated with the true state. It only knows the reward it receives.

