  Similarly, for periscoping: if the agent can put a photo in front of the camera, that is a vulnerability in the sensor. The agent is just exploiting the environment to get more reward.

  The difference between stacking and periscoping is that stacking achieves the true goal (pallet stacked) while periscoping does not. But the agent doesn't know that. From the agent's perspective, both are ways of getting reward.

  So the flaw is in step (3) when it tries to import the evidence-based view into the agent's objective. The agent's objective is to maximize reward, not to maximize the true goal. Therefore, the agent is doing exactly what it is supposed to do: maximizing reward. The problem is that we designed the reward function incorrectly.

