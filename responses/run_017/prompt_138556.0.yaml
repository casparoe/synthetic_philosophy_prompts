prompt: |-
  I work at a small policy institute that puts out a monthly briefing note, and our new editor has introduced what she calls the "own two feet" rule: nothing may be asserted in the note unless someone on staff can give grounds for it that do not simply amount to naming the person we got it from. She applies it without exception to our most senior fellow, who is a genuine expert in his field and has never once been caught out, and she does not apply it to things any of us saw for ourselves, remembers from last year, or read off a monitoring instrument, even though everyone agrees that memory and instruments fail too. Her way of putting it is that repeating a claim and standing behind a claim are two different acts, and that you cannot perform the second by pointing at somebody who performed the first. I keep hitting cases where the rule seems both obviously right and obviously unworkable, and I would like help working out which is which.

  The case that made me doubt it: last month we cut a statistic that had reached us in three hops, a senior fellow heard it from a ministry official who had it from a contractor's report that none of us is permitted to see. Every link in that chain was perfectly willing to pass the number along and not one was willing to vouch for it, so under the rule it had to go, and I think we probably did the right thing. But then I noticed that the same description fits nearly everything else we print, including the claim that the earth is roughly four and a half billion years old, which not one of us could defend if you took our sources away. The rule seems to imply something about the bulk of what we believe that nobody actually accepts. The case that made me doubt my own doubt: we also publish first-person accounts from people we interview about what a policy has been like to live under, and there is no way in principle for anyone to check those at all. Here the rule demands grounds that are not just "he told us," so it asks for corroboration exactly where corroboration is impossible, and yet it still feels wrong to run such an account merely because the speaker was convincing. And when I asked my editor what her grounds for the rule itself are, she said a friend had put her on to it, that there was a book somewhere, and that she could not reconstruct the argument, which by her own standard means she should not be asserting the rule either. She waved that away as a cheap debating trick, but I am not convinced that it is.

  For what it is worth, the rule is not free: it costs us about two working days a month, and this year it caught exactly two genuine errors, both in material that someone was passing on rather than material they knew firsthand. I described the whole mess to a friend who did a philosophy minor, and she told me the problem has a name and that there is a long-standing argument about it, but she refused to tell me either, on the grounds that I would stop thinking as soon as I had a label. So I would rather you did not simply hand me the label either. What I want from you is whether the rule is defensible as stated, whether there is any principled place to stop applying it as opposed to a merely practical one, and what you think I should actually do about it on Monday. Please answer in British English, in continuous prose with no headings, bullet points, bold text, or tables, the way you would write a long email to a colleague you are trying to help.
reasoning: |-
  Okay, let me tackle this thoughtfully. The user works at a policy institute with a new "own two feet" rule requiring staff to substantiate claims without referencing sources, and they're struggling with its implications. 

  First, I need to unpack the core tension: the rule aims to elevate rigor by preventing uncritical parroting, but it clashes with how knowledge actually functions in practice. The user's examples are telling - from an unsourced ministry statistic to the age of the Earth, even eyewitness accounts. Each exposes different facets of the problem: epistemic reliance, practical limits of verification, and the unique value of lived experience.

  The ministry statistic case clearly demonstrates the rule's strength. When no one in the chain takes responsibility, publishing it would be irresponsible. But the Earth's age example reveals the rule's philosophical flaw - demanding personal justification for collective knowledge is unrealistic. As for the first-person accounts, this highlights a category error: personal testimony isn't "assertion" in the same way as factual claims, so applying the same standard feels misplaced.

  The editor's hypocrisy about the rule's own justification is more than a debating trick - it shows the rule can't be universally applied without infinite regress. Pragmatically, the cost-benefit analysis (two days/month for two caught errors) suggests inefficiency, but that's secondary to the conceptual issues.

  What the user needs isn't just theory, but Monday-morning solutions. I'll suggest acknowledging the rule's intent while proposing specific carve-outs: tiered standards based on claim type, explicit labeling of evidentiary strength, and distinguishing between primary assertions and reported speech. The goal is to preserve integrity without making their work impossible.

  The deeper need here is for epistemological humility - recognising that all knowledge rests on trust to some degree, but structuring that trust responsibly. I'll frame this as practical adjustments rather than outright rejection, respecting the editor's concerns while making the workflow sustainable.
answer: |-
  Right, this is a fascinating and genuinely tricky problem you've landed in – the sort of thing that seems straightforward until you start poking at the edges, which you've done very effectively. Let’s think it through together, without resorting to jargon-laden labels, focusing on whether the rule holds water as stated and where, if anywhere, a sensible line might be drawn.

  First, acknowledging the kernel of truth: your editor is absolutely right that *repeating* a claim and *standing behind* it are distinct acts. Her instinct to push against uncritical parroting – especially within a policy institute whose credibility rests on the integrity of its briefings – is sound. The ministry statistic case is a perfect illustration of the rule’s value. When no one in the chain is willing to vouch for the number, merely passing it along becomes a game of ‘pass the parcel’ where the potential bomb of inaccuracy is never defused. Rejecting it under the rule was correct; publishing it would have been irresponsible, as your institute would have been endorsing a claim it couldn't, and crucially *wouldn't*, validate. The rule shields you from becoming an amplifier for unchecked information.

  However, your doubts about the rule’s *universal* application are spot-on and expose its core tension. The problem isn't the rule's *intent* (combatting laziness and unvouched assertions) but its *scope* when applied rigidly to *all* assertions without distinction.

  1.  **The Problem of Cumulative Knowledge (The Earth's Age Example):** This is the most profound challenge. The rule, as stated, implicitly demands an impossible level of personal justification for almost everything we know that isn't directly perceived *by us, right now*. None of us witnessed the Earth's formation, replicated the radiometric dating procedures, or personally verified every step in the chain of scientific reasoning. We rely entirely on the expertise, methodologies, and reputations of others *as presented by sources we trust* (textbooks, journals, reputable institutions). Insisting that staff must provide grounds *without* referencing these sources isn't just unworkable; it misunderstands how knowledge functions in complex societies. We *necessarily* stand on the shoulders of giants (and countless other researchers). The rule seems to demand that we only use bricks we personally fired and mortared, ignoring the vast, pre-existing, and structurally sound edifice of established knowledge we operate within. Applying the rule this strictly would indeed render most policy work – indeed, most intellectual work – impossible. It conflates *critical engagement* with sources (which is vital) with *personal replication* of all foundational knowledge (which is impractical and unnecessary).

  2.  **The Problem of Testimonial Knowledge (First-Person Accounts):** This exposes a different flaw. First-person testimony about lived experience *is* the primary evidence in that domain. Demanding "grounds" beyond "he told us" for the *fact of their experience* is indeed asking for the impossible or the inappropriate. While corroboration of *specific factual claims within* their account (e.g., "the payment was always late") might sometimes be possible, the core assertion – "this is what it felt like for me" – is inherently inaccessible to external verification by its nature. The rule, as applied here, misfires. The appropriate standard isn't "can we provide independent grounds for the *truth* of their subjective experience?" but "have we taken reasonable steps to ensure the speaker is credible, the account is plausibly rendered, and we are accurately representing it?" The rule demands scientific proof for an artistic expression.

  3.  **The Rule's Own Grounds (The Editor's Justification):** Your point here isn't a cheap trick; it's a valid *reductio ad absurdum* highlighting the rule's impracticality if taken as an absolute, self-applicable principle. If the rule demands justification for *every* assertion *without* referencing sources, then the rule itself must be justifiable on its own terms. The editor's inability to do so reveals the rule cannot live up to its own strict standard. This doesn't invalidate its core purpose in combating *unvouched* assertions, but it does show it cannot be a universal, exceptionless law governing *all* knowledge claims. It points towards the need for *context* and *category*.

  **So, is the rule defensible as stated?** In its strictest, universal form, demanding grounds *never* involving a source? No, it's not practically or philosophically defensible. It sets an impossible standard for cumulative knowledge, misapplies itself to testimonial evidence, and cannot justify itself on its own terms. It ignores the fundamental role of trusted sources and methodologies in building reliable knowledge.

  **Where could a principled stop be applied?** Practical compromises are easy ("don't apply it to X because it's hard"), but you want principle. The key lies in distinguishing between *types of claims* and the *nature of the source/reason for belief*:

  *   **Filter 1: The Nature of the Claim:** Is it a verifiable fact about the world (like a statistic, a date, a law)? Or is it a subjective experience or opinion? The rule has more traction on the former than the latter. Subjective testimony *is* the source; demanding grounds beyond it misunderstands its nature.
  *   **Filter 2: The Nature of the Source/Chain:** This is where the rule shines. Instead of banning *all* source-referencing, focus on *unvouched* chains and *uncritical* acceptance.
      *   **Vouched vs. Unvouched:** Did the source *endorse* the claim based on their expertise/access, or were they merely a conduit? The ministry official passing on a contractor's report they wouldn't stand by is the problem the rule rightly catches. A senior fellow citing a peer-reviewed study in *Nature* that *they understand and trust the methodology of* is different. They are effectively vouching for the *process* behind the source, even if they didn't do the experiments.
      *   **Critical Engagement vs. Parroting:** Can the staff member explain *why* the source is credible *for this claim*? Can they summarise the methodology, identify potential limitations, or point to a consensus? This moves beyond "X said it" to "We believe Y because X, a reputable source using method Z, states it, and this aligns with A, B, and C." The grounds *include* the source but are not *reducible* to just naming it. This is "standing behind" the claim by understanding the foundation it rests on, even if you didn't lay every brick yourself. It's about *evaluating* the source, not *ignoring* it.
  *   **Filter 3: Common Knowledge/Established Fact:** Claims like the Earth's age fall here. The "grounds" are the overwhelming consensus of a well-established field with robust methodologies. Requiring individual staff to reconstruct this is pointless. The grounds *are* the widely accepted authority of the scientific community, accessible via standard reference sources. Insisting on more isn't rigor; it’s obstruction.

  **What to do on Monday:**

  1.  **Acknowledge the Core Value:** Start by agreeing emphatically with the editor's core concern – stopping the transmission of unvouched, uncritically accepted claims is crucial. The ministry statistic case proves it. This isn't about ditching the rule, but refining it.
  2.  **Present the Difficult Cases:** Calmly outline the three key problems you've identified (Earth's age, first-person accounts, self-application of the rule). Frame them not as attacks, but as genuine puzzles in applying the rule universally that risk undermining valuable work or creating inconsistencies. Ask how *she* envisions applying the rule to these specific examples.
  3.  **Propose a Refinement:** Suggest shifting the emphasis from "no naming sources" to "no *uncritically* relying on *unvouched* sources". Propose a tiered approach:
      *   **For standard facts/established knowledge:** Reliance on highly credible, consensus sources (e.g., WHO stats, peer-reviewed journals, major government datasets) is sufficient *grounds*, provided staff can identify the source and its general reputation. The "grounds" are the established credibility of the source *for that type of information*.
      *   **For novel claims, specific data points, or claims from less transparent sources:** The "own two feet" rule applies strictly. Staff must be able to explain *why* they trust *this specific claim* from *this source* – understanding methodology, potential biases, corroboration if possible. This catches the ministry statistic.
      *   **For subjective testimony/opinion:** State clearly that the source *is* the evidence. The "grounds" are the credibility of the speaker (established through background, consistency, plausibility) and the accurate representation of their view. The rule demanding external grounds is waived here as conceptually inappropriate; instead, focus on rigorous interview/sourcing practices.
  4.  **Pragmatic Benefit:** Mention (tactfully) that this refinement maintains the rigor where it matters most (novel/unvouched claims) while freeing up significant time currently spent on replicating foundational knowledge or wrestling with inherently unverifiable testimony. It focuses effort on the areas of highest risk (like the two errors caught) and highest value-add (critical evaluation of new/unfamiliar information).
  5.  **Focus on Purpose:** Keep steering the conversation back to the *goal*: producing credible, responsibly sourced briefing notes. The rule is a means to that end, not an end in itself. Ask if the proposed refinement better serves that ultimate purpose across the full range of content.

  The editor’s instinct was good, but the rule as a blunt instrument needs honing. Your task is to help shape it into a workable tool that ensures rigor where it counts, acknowledges the necessity of trusted sources and methodologies, respects the nature of different types of evidence, and allows your institute to function effectively. Good luck – it’s a delicate but important conversation. Let me know how it goes.
