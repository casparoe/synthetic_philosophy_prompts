prompt: |-
  Please write a piece of sustained satire in the form of a mock government white paper.

  Setting and document: A near-future state has taken quantitative macrohistory at its word and made it an arm of domestic policy. The document is issued by a fictional Bureau of Structural-Demographic Stabilization, with a title in the manner of White Paper No. 7: On the Economical Management of Surplus Elites, dated roughly a decade from now, signed by an invented under-secretary.

  What the piece has to get right. The humor must come from the actual content, not from generic dystopia. The literature in view is the cliodynamic / structural-demographic tradition associated with Peter Turchin: long "secular cycles" with an integrative phase followed by a disintegrative one; population growth pressing on resources; elite overproduction, in which the supply of credentialed aspirants outruns the number of positions able to absorb them; popular immiseration as real incomes stagnate while elite incomes and elite numbers rise; fiscal strain on the state; and the widely noted forecast, published around 2010, that the 2020s would be a period of growing instability in the United States and Western Europe. The models were built and calibrated largely on preindustrial agrarian cases, using coarse historical series — population, real wages, prices, state revenues — and the cycles they describe run for roughly a couple of centuries.

  Form and voice:
  - Deadpan civil-service prose: passive constructions, euphemism, cost-benefit arithmetic, gently circular official reasoning, footnotes that concede everything while conceding nothing.
  - Length 800–1000 words, formatted as numbered clauses grouped under four to six section headings, with three to five mock footnotes and one annex containing a small table of invented indicators.
  - It should be legible and funny to a reader who knows the literature, and merely readable to one who does not. A reader should be able to tell what is being ironized without the author winking: no punchlines that announce themselves, no aside that admits the joke, no quotation marks around the euphemisms.

  Target: not any person, living or dead, but the practice of reading quantitative macrohistory as a policy manual — the technocratic move from "these variables moved together in past cycles" to "the state should therefore manage those variables." Exaggerate real features of that style of reasoning; do not invent features it does not have. Someone who works in this tradition should be able to judge the satire unfair-but-fair.

  The reductio: follow the model's own logic to a conclusion the reader recoils from. If surplus credentialed aspirants are a leading indicator of political violence, then the state acquires a rational interest in managing the supply of elites and the distribution of prestige as a matter of public safety — caps, licensing, deferral schemes, honorific sinecures, means-tested access to ambition. The paper should propose such measures in perfect bureaucratic good faith, at a level of administrative specificity that makes the horror concrete (who is counted, who is deferred, what happens to the deferred, what the program costs per averted riot).

  Two wrinkles the paper must handle without ever naming them as problems:
  1. Proxy measurement. Because the model was calibrated on agrarian empires, the Bureau must defend modern substitutes for its variables — e.g., holders of advanced degrees in fields without corresponding posts as the measure of elite aspirants, rent-to-income ratios as the measure of immiseration — and must defend them in the same confident register it uses for the original variables.
  2. Temporal mismatch and reflexivity. Because a cycle is far longer than any electoral or budgetary horizon, the Bureau needs an accelerated or "sub-cycle" instrument for officials who require discord within their own term; and one footnote should register, in perfect innocence, both that publishing the forecast changes the behavior being forecast and that the cycles on which the model was fitted were observable only because nobody was managing them.

  Constraint on criticism: every standard objection to this style of work — a small number of observable cycles, fitting rather than forecasting, the gap between historical variables and modern proxies, self-defeating prophecy, and the moral cost of the policy the model invites — must be shown rather than stated. Do not use the vocabulary of the critics ("overfitting," "unfalsifiable," "proxy problem," "reflexivity," "technocracy") anywhere in the prose of the white paper.

  After the piece, on a line beginning APPENDIX, output nothing further in prose — only a single JSON object with exactly this schema:

  {"title": string, "word_count": integer, "setting_gloss": string (one sentence on the fictional premise the reader must accept), "indicators": [{"name": string, "official_definition": string, "real_variable_it_stands_in_for": string}], "features_exploited": [{"feature_of_the_literature": string, "clause_number": string, "exaggeration": string}], "objections_shown": [{"objection": string, "where_the_reader_infers_it": string}], "reductio": {"premise_taken_from_the_literature": string, "policy_conclusion_drawn": string, "why_a_reader_recoils": string}, "deadpan_audit": {"least_deadpan_line": string, "most_legible_sentence": string, "verdict_on_fairness": string}}

  Use the real vocabulary of the literature inside the JSON (elite overproduction, immiseration, secular cycle, disintegrative phase) even though the white paper itself should keep it euphemistic.
reasoning: |-
  We are writing a satirical government white paper from the Bureau of Structural-Demographic Stabilization. The title is "White Paper No. 7: On the Economical Management of Surplus Elites". The setting is near-future, about a decade from now. The paper should be in the form of numbered clauses under section headings, with a deadpan bureaucratic tone.

  Key elements:
  - Humor from content, not dystopian clichés.
  - Based on cliodynamics/structural-demographic theory (Turchin): secular cycles, elite overproduction, immiseration, fiscal strain.
  - The paper proposes policies to manage surplus elites to prevent instability.
  - Must handle proxy measurement (using modern substitutes for historical variables) and temporal mismatch (accelerated instruments for short-term results) without explicitly naming them as problems.
  - Reductio ad absurdum: policies like caps on elite production, deferral schemes, sinecures, etc., proposed in good faith.

  Structure:
  - 800-1000 words.
  - 4-6 section headings, each with numbered clauses.
  - 3-5 mock footnotes.
  - One annex with a small table of invented indicators.

  After the white paper, an appendix with a JSON object as specified.

  Approach:

  1. **Title and Preamble**: Start with the white paper number, title, issuing bureau, date, and signature.

  2. **Section Headings** (tentative):
     - I. Introduction and Context
     - II. Current Indicators and Projections
     - III. Rationale for Intervention
     - IV. Proposed Measures for Elite Aspirant Management
     - V. Implementation and Resource Allocation
     - VI. Monitoring and Evaluation

  3. **Content**:
     - Use euphemisms: "surplus elites" instead of elite overproduction, "aspirational class" for elite aspirants, "fiscal sustainability" for fiscal strain, etc.
     - Propose policies: 
          - Caps on advanced degree programs in certain fields.
          - Licensing for elite positions.
          - Deferral schemes (e.g., mandatory national service for deferred elite entry).
          - Creation of honorific positions (e.g., "Fellow of the Republic" with stipends but no power).
          - Means-tested access to elite tracks.
     - Include cost-benefit analysis: cost per averted riot.
     - Address proxy variables without comment: e.g., "holders of advanced degrees in low-demand disciplines" as proxy for surplus elites; rent burden as proxy for immiseration.

  4. **Footnotes**:
     - One footnote should mention that publishing the forecast changes behavior (reflexivity) but also note that historical cycles were observable because unmanaged.
     - Others can provide technical details or caveats in a way that undercuts the main argument without admitting it.

  5. **Annex**: A table with invented indicators, e.g.:
     - Aspirational Pressure Index (API): defined as "ratio of annual postgraduate degree completions to annual openings in Tier 1 professional positions"; stands in for elite overproduction.
     - Popular Well-being Gap (PWG): defined as "median rent-to-income ratio for the bottom income quartile"; stands in for immiseration.

  6. **Tone**: Deadpan, bureaucratic, passive voice. No winking at the reader.

  7. **Reductio**: The horror should come from the matter-of-fact proposal of managing human ambition and potential as a resource to be capped and diverted for stability.

  Now, write the white paper.

  ---

  White Paper No. 7: On the Economical Management of Surplus Elites

  Issued by the Bureau of Structural-Demographic Stabilization
  Date: 15 March 2034
  Signed: Under-Secretary H. W. Gable

  **I. Introduction and Context**

  1. The Bureau of Structural-Demographic Stabilization (BSDS) has been charged with monitoring and addressing systemic pressures that may adversely affect national cohesion and public order. This white paper addresses the challenge of aspirational class alignment, a key determinant of social equilibrium.

  2. Historical analysis has established that periods of heightened competitive friction among the highly credentialed can lead to destabilizing outcomes.^1 The present period is characterized by an imbalance between the production of qualified individuals and the availability of positions commensurate with their expectations.

  3. It is the Bureau’s view that proactive management of aspirational flows is both feasible and necessary to avoid the social costs associated with misaligned expectations.

  **II. Current Indicators and Projections**

  4. The Aspirational Pressure Index (API) has risen steadily from 1.8 in 2025 to 2.3 in 2033 (see Annex A). This indicates that for every available Tier 1 position, there are now 2.3 qualified candidates.

  5. Concurrently, the Popular Well-being Gap (PWG) has widened, with the median rent-to-income ratio for the bottom income quartile increasing from 0.45 to 0.52 over the same period. This divergence between the fortunes of the aspirational class and the broader population is consistent with patterns observed in historical preludes to discord.^2

  6. Projections indicate that without intervention, the API will reach 2.8 by 2040, a level historically associated with elevated risks of civil disturbance.

  **III. Rationale for Intervention**

  7. The state has a compelling interest in reducing the volume of unmet expectations among the highly educated, as such expectations, when persistently frustrated, can manifest in forms detrimental to public order and economic productivity.

  8. It is recognized that the aspirational class is a national resource, and the objective is not to diminish its quality but to optimize its deployment and expectations in line with structural realities.

  9. The costs of inaction—measured in policing, property damage, and lost economic output—are projected to exceed $450 billion annually by 2040. By contrast, the proposed interventions are estimated to cost $120 billion annually, yielding a net benefit of approximately $330 billion per year.^3

  **IV. Proposed Measures for Elite Aspirant Management**

  10. **Licensing and Caps on Credential Production**: 
      a. The Department of Education shall be empowered to set annual caps on postgraduate admissions in disciplines with an API contribution factor above 1.5. 
      b. Institutions exceeding caps will face adjusted funding formulae.

  11. **Deferral and Diversion Pathways**:
      a. A National Service Fellowship (NSF) program shall be established, requiring selected candidates to undertake five years of public service in designated priority sectors (e.g., regional education, infrastructure maintenance) prior to entering competitive professional tracks.
      b. Participation in the NSF will confer eligibility for accelerated consideration in Tier 1 position allocations.

  12. **Honorific Recognition**:
      a. The Office of Civic Honors will create a new category of distinction, "Fellow of the Republic", awarded to individuals who meet merit thresholds but for whom no Tier 1 position is immediately available.
      b. Fellows will receive an annual stipend of $45,000 and ceremonial privileges, but no formal authority.

  13. **Means-Tested Ambition Moderation**:
      a. Access to postgraduate programs in high-API disciplines will be subject to a means test. Candidates from households with assets exceeding $2 million will be required to pay a differential tuition fee, set at 300% of standard rates, to account for the heightened social cost of their aspirations.

  **V. Implementation and Resource Allocation**

  14. The BSDS will coordinate with relevant agencies to implement the above measures, beginning FY2035.

  15. The total annual budget requirement is estimated at $120 billion, comprising:
      - $40 billion for the NSF program (stipends and administration)
      - $30 billion for the Fellow of the Republic program
      - $25 billion for means-testing administration and tuition subsidies
      - $15 billion for monitoring and compliance
      - $10 billion for public awareness campaigns

  16. Cost-effectiveness is estimated at $1.2 million per averted civil disturbance incident (CDI), based on historical CDI cost averages. This represents a 73% improvement over reactive measures.

  **VI. Monitoring and Evaluation**

  17. The BSDS will report annually on API and PWG trends, along with the incidence of CDIs.

  18. A sunset clause is included for all measures, subject to API stabilization below 1.5 for three consecutive years.

  19. It is acknowledged that the publication of these projections may influence individual decision-making regarding credential acquisition.^4 However, the Bureau maintains that the benefits of transparency and informed public discourse outweigh the risks of behavioral adaptation.

  ---

  **Footnotes**

  ^1 *See Historical Precedents Volume XII: Secular Oscillations in Social Cohesion (BSDS Press, 2031). The Bureau notes that historical patterns are derived from periods without active management, which may limit direct comparability but underscores the necessity of intervention.*

  ^2 *The PWG is a validated proxy for broader well-being metrics. While historical series relied on grain prices and real wages, modern economies require adaptation to housing cost burdens as a primary indicator of disposable income pressures.*

  ^3 *Cost estimates include direct program costs and indirect economic impacts. Benefit calculations are based on avoided CDI costs, including property damage, emergency services, and lost productivity. Sensitivity analysis indicates a benefit-cost ratio ranging from 2.1 to 3.4 under varying assumptions.*

  ^4 *Behavioral adaptation is an inherent challenge in any forward-looking policy. Historical cycles were observable precisely because they were not subject to management; the present intervention thus represents a necessary innovation.*

  ---

  **Annex A: Key Indicators**

  | Indicator | Definition | 2025 | 2033 |
  |-----------|------------|------|------|
  | API | Ratio of annual postgraduate degree completions to annual openings in Tier 1 professional positions | 1.8 | 2.3 |
  | PWG | Median rent-to-income ratio for the bottom income quartile | 0.45 | 0.52 |
  | CDI Rate | Annual civil disturbance incidents per million population | 4.1 | 7.3 |

  ---

  Now, the JSON appendix.

