prompt: |-
  I'm a science-and-ideas journalist working on a feature about the replication crisis, and I keep tripping over a line that functions in this debate as a conversation-stopper. In a recent interview, the author of a much-publicised small-sample study — the familiar shape: an implausible mechanism, a large headline, and a later preregistered multi-lab replication that came back close to zero — used it symmetrically. "Extraordinary claims require extraordinary evidence. But the claim that my effect doesn't exist is itself extraordinary, so that replication had better be extraordinary too, and one null result isn't."

  I don't think that move works, but I can't yet say precisely where it fails, and I'd like to print something more careful than "the line is vague." So please treat the slogan the way you'd treat an argument that has to carry weight: separate the precise theses it could be expressing, and give verdicts.

  Two words are doing all the work and neither is marked. "Extraordinary" might mean low prior probability given well-confirmed background theory; low prior probability given what the field currently believes (an orthodoxy-relative rather than evidence-relative notion); threatening to a lot of auxiliary commitments at once; merely unfamiliar or newsworthy; or simply consequential if acted on. "Require" might mean: a more stringent statistical threshold before the claim counts as supported; more evidence of the same kind (bigger samples, more studies); evidence of a different kind (mechanistic, independently measured, preregistered, open); a shifted burden of proof in a dialectical or editorial sense; or a heavier penalty for being wrong, i.e. an asymmetric loss function.

  Lay the resulting combinations out as a menu rather than defending one. For each: what it actually says, whether it is a platitude, a substantive and defensible methodological norm, or false, and — the part I most need — whether it would license the use my interviewee made of it. In particular I want to know: whether any reading makes the principle genuinely symmetric as between a surprising positive result and a surprising failure to reproduce one; whether the Bayesian-looking reading is even coherent as stated, or whether a fixed evidential standard plus a low prior already does the work the slogan misdescribes; and whether, inside a strict error-rate framework, the slogan is inexpressible, collapses into a uniform recommendation about thresholds, or survives as something like a claim about a literature's false-discovery budget rather than about any single hypothesis.

  My own provisional taxonomy is prior-relative, loss-relative and dialectical readings, plus that last "field-level error budget" one as a fourth. Tell me if the fourth is a real reading and if the taxonomy misses any. Please keep the general Bayesian-versus-frequentist quarrel in the background, except where it bears on which readings are available at all. If nothing in the menu survives, give me the one-sentence version I could responsibly print instead.
reasoning: |-
  Okay, let me start by unpacking the journalist's query. They're dealing with a replication crisis feature and encountered a problematic argument from an author whose small-study claim failed to replicate. The author uses "extraordinary claims require extraordinary evidence" symmetrically to dismiss a null replication, arguing that claiming his effect doesn't exist is equally extraordinary and thus requires extraordinary evidence too. The journalist wants to dissect this slogan precisely.

  First, I need to break down the slogan's components. The journalist already identified two key ambiguous terms: "extraordinary" and "require." For "extraordinary," potential meanings include low prior probability (Bayesian), threat to established theories, or field-specific novelty. For "require," it could mean stricter statistical thresholds, different evidence types, or shifted burdens of proof.

  The journalist mentioned provisional taxonomy: prior-relative, loss-relative, dialectical, and field-level error budget readings. I should verify if these cover all possibilities. Prior-relative ties to Bayesian priors, loss-relative to decision theory consequences, dialectical to argumentative burden, and field-level to resource allocation in science. Maybe there's a fifth? Like evidentiary diversity—requiring multiple evidence types beyond just statistical power. But that might fit under "different evidence types" within prior-relative or dialectical readings. Probably the taxonomy is sufficient.

  Next, constructing a matrix. Each combination of "extraordinary" and "require" needs evaluation. Let's start with "extraordinary" as low prior probability. If "require" means stricter statistical thresholds (e.g., lower p-value), that's defensible in Bayesian terms because low priors need stronger evidence to achieve high posteriors. But it's not symmetric. A null finding isn't a claim with low prior; it's the default. The author's symmetry argument fails here because the replication isn't making an extraordinary claim—it's asserting no effect, which often has a higher prior.

  If "require" means more evidence (bigger samples), that's also defensible. But again, symmetry doesn't hold. The original claim needs larger samples to detect a small effect, but the null result doesn't—it just needs adequate power. The author's move here is invalid.

  For "extraordinary" as orthodoxy-relative (what the field believes). If "require" means shifted burden of proof, it's dialectical. The author might say the burden is on skeptics, but that's reversing the proper burden where novel claims must prove themselves. The symmetry argument here is misapplied because the replication shifts the burden back, but doesn't need "extraordinary" evidence—just sufficient evidence under the new context.

  Field-level error budget is crucial. If a field tests many low-probability hypotheses, false positives accumulate. Requiring stronger evidence for such claims conserves the false discovery rate. But a single null result doesn't need extraordinary evidence; it just needs to be part of a rigorous replication effort. The author's demand for "extraordinary" replication isn't justified here.

  Now, the Bayesian vs. frequentist angle. In Bayesian terms, evidence strength is likelihood ratio. A low prior needs a high LR to shift belief. But for a null finding, the LR depends on the test's power. A well-powered null result can strongly support the null, especially if the original study was underpowered. The author's symmetry fails because the null result isn't making a claim; it's providing evidence against the original claim. The replication's evidence might be ordinary—well-powered and rigorous—which is sufficient.

  In frequentist terms, the slogan isn't directly expressible. It might translate to adjusting alpha levels for implausible hypotheses. But again, a null result doesn't require a stricter threshold; its Type II error is addressed by power, not alpha.

  Assessing the author's move: none of the readings support symmetry. The core mistake is conflating the claim "effect exists" (low prior) with "effect is absent" (often high prior). The latter isn't extraordinary; it's the default. A rigorous replication with strong evidence against the effect suffices; it doesn't need to be "extraordinary."

  The journalist needs a concise rebuttal. Something highlighting that the burden of proof remains on the original claim, and a rigorous null result shifts the consensus without needing extraordinary evidence. Emphasizing that the replication only needs to be competent and well-powered, not extraordinary.
answer: |-
  Below is a systematic breakdown of the "extraordinary claims require extraordinary evidence" (ECREE) principle, tailored to your needs. I've organized it as a menu of interpretations based on the ambiguities you identified, evaluated each combination for coherence, defensibility, and whether it licenses your interviewee's symmetrical use. I've preserved your provisional taxonomy (prior-relative, loss-relative, dialectical, field-level error budget) and added a fifth category for completeness. Each entry specifies:  
  - **What it says**: The precise thesis.  
  - **Status**: Platitude (obviously true), defensible norm, or false.  
  - **Licenses symmetry?**: Whether it justifies treating "claim of non-existence" as symmetrically extraordinary.  
  - **Key weakness**: Why symmetry fails or the interpretation is problematic.  

  I've prioritized clarity and your journalistic constraints, avoiding technical jargon where possible. The final section answers your specific questions and offers a concise alternative to "the line is vague."

  ---

  ### **Taxonomy of Interpretations**  
  *(Each row combines a definition of "extraordinary" with a definition of "require")*  

  1. **Prior-Relative (Bayesian Core)**  
     - **Extraordinary**: Low prior probability given well-established background theory/evidence.  
     - **Require**: Stricter statistical threshold (e.g., lower *p*-value or higher Bayes factor) to achieve the same posterior belief.  
     - **What it says**: Hypotheses with low priors need stronger evidence to reach a high posterior probability.  
     - **Status**: Defensible norm (follows from Bayes' theorem).  
     - **Licenses symmetry?**: **No**. The claim "this effect does not exist" typically has a *high* prior (null is default); demanding "extraordinary evidence" for it confuses absence-of-evidence with evidence-of-absence.  
     - **Key weakness**: Asymmetry is inherent—low priors require high likelihood ratios, but high priors (like the null) do not.  

  2. **Prior-Relative + Evidence Scale/Diversity**  
     - **Extraordinary**: Low prior probability.  
     - **Require**: More/diverse evidence (e.g., larger samples, preregistered replications, mechanistic support).  
     - **What it says**: Low-prior claims need larger bodies of evidence or varied lines of support.  
     - **Status**: Defensible norm (reduces false positives).  
     - **Licenses symmetry?**: **No**. A rigorous replication (e.g., multi-lab, well-powered) is "ordinary" evidence *for* the null; demanding *more* than this for the null is unjustified.  
     - **Key weakness**: Replications test existing claims—they don't assert a new "extraordinary" hypothesis.  

  3. **Loss-Relative (Decision-Theoretic)**  
     - **Extraordinary**: High stakes if wrong (e.g., policy changes, ethical risks).  
     - **Require**: Asymmetric loss function (higher penalty for false positives than false negatives).  
     - **What it says**: Claims with severe real-world consequences need stronger evidence to justify action.  
     - **Status**: Defensible norm (aligns with error management).  
     - **Licenses symmetry?**: **No**. The replication's null result *reduces* the risk of acting on a false positive; it doesn't create new risks. Demanding "extraordinary evidence" for it perversely protects low-quality claims.  
     - **Key weakness**: Consequence asymmetry—false positives (e.g., acting on a non-existent effect) are often costlier than false negatives (failing to act).  

  4. **Dialectical (Burden of Proof)**  
     - **Extraordinary**: Novel, disruptive, or orthodoxy-threatening (field-relative).  
     - **Require**: Shifted burden of proof onto the claimant in discourse or peer review.  
     - **What it says**: Those making radical claims must provide stronger evidence to persuade skeptics.  
     - **Status**: Platitude (found in scientific and legal norms).  
     - **Licenses symmetry?**: **No**. The original study bears the burden; the replication merely *challenges* it. The interviewee reverses this, demanding replicators meet the same burden—a category error.  
     - **Key weakness**: Burden of proof is directional. A failed replication shifts consensus but doesn't assert a new claim.  

  5. **Field-Level Error Budget**  
     - **Extraordinary**: Likely false given field's false-discovery rate (FDR) or base rates.  
     - **Require**: Tighter statistical thresholds to control FDR across many tests.  
     - **What it says**: For hypotheses with low pre-study odds (e.g., exploratory fields), stricter *α* (e.g., 0.005 vs. 0.05) reduces noise.  
     - **Status**: Defensible norm (e.g., genomics, psychology).  
     - **Licenses symmetry?**: **No**. The null result isn't a separate hypothesis tested against FDR—it's a *test* of an existing claim. Well-powered replications need only standard thresholds (e.g., *α* = 0.05).  
     - **Key weakness**: Applies to *testing* novel claims, not *refuting* them.  

  6. **Novelty-Relative (Fifth Category: Your "Unfamiliar/Newsworthy")**  
     - **Extraordinary**: Surprising or headline-grabbing.  
     - **Require**: Editorial/publication bias toward flashy findings.  
     - **What it says**: Media-worthy claims need more scrutiny.  
     - **Status**: **False** (describes dysfunctional incentives, not a norm).  
     - **Licenses symmetry?**: **Superficially yes, but incoherent**. Both original and null claim could be "newsworthy," but this confuses epistemic rigor with attention economies.  
     - **Key weakness**: Not a methodological principle—it's a pathology of science communication.  

  ---

  ### **Direct Answers to Your Questions**  
  1. **Does any reading make ECREE symmetric?**  
     **No**. Every defensible interpretation treats the *original claim* as extraordinary due to low priors, high stakes, or burden of proof. The null result is either ordinary (high prior) or a challenge to the claim—not a new extraordinary assertion. The symmetry argument is a rhetorical sleight-of-hand.  

  2. **Is the Bayesian reading coherent?**  
     **Yes, but it refutes symmetry**. Low priors demand strong evidence for belief, but the null hypothesis (e.g., "no effect") usually has a *high* prior. A rigorous replication provides positive evidence *for* the null via high likelihood ratios (if well-powered). The slogan captures this asymmetry but is misapplied by the interviewee.  

  3. **Inside frequentist frameworks, does ECREE collapse or survive?**  
     - **Collapses** for threshold-based readings: Demanding lower *α* for low-prior claims is defensible (e.g., Benjamin et al.'s *p* < 0.005 proposal), but this doesn’t apply to replications.  
     - **Survives as field-level error budgeting**: Controlling FDR requires stronger initial evidence for implausible claims. But replications operate differently—they verify existing claims and need only standard power/rigor.  

  4. **Is "field-level error budget" a real reading?**  
     **Yes**, and it’s increasingly influential (e.g., in metascience). It treats "extraordinary" as low pre-study odds and "require" as methodological rigor to avoid flooding a field with false positives.  

  5. **Does your taxonomy miss anything?**  
     Your four categories cover core interpretations. I added "novelty-relative" to capture the non-epistemic use you noted. One subtle omission: **evidentiary diversity** (e.g., "require" as triangulation via multiple methods). This fits under prior-relative or dialectical readings.  

  ---

  ### **The Responsible One-Sentence Verdict to Print**  
  > "The principle properly applies only to new, implausible claims—demanding they clear a higher bar—but a rigorous replication showing null results isn't making an extraordinary claim; it's providing ordinary evidence that the original effect was likely spurious, and treating them symmetrically confuses the burden of proof."

  This rebuts the symmetry without diving into technicalities, emphasizes the burden of proof, and aligns with defensible norms. For your feature, pairing this with a brief explanation of prior probabilities (e.g., "Extraordinary claims start with low odds; null results often start with high ones") would ground it for readers.
