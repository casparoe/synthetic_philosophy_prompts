prompt: |-
  Writing a column on whether physics actually gets closer to the truth — I want to say something like 'Newton wasn't so much wrong as less right, and that's what progress consists in' — and a substack essay I read says that idea was refuted fifty years ago. Their version, trimmed:

  Popper wanted to say science progresses toward the truth even though our best theories are all strictly false, so he tried to define 'closer to the truth' in terms of logical consequences: one theory beats another if it has more true consequences and fewer false ones. In 1974 Tichý and Miller, working independently, showed that Popper's definition has a fatal consequence — if a theory is false at all, then nothing is closer to the truth than anything else. Popper himself gave up the definition almost immediately. The upshot is that truthlikeness can't be analysed, so talk of science converging on the truth, or of Newton being nearer the truth than Aristotle, is hand-waving; all we can honestly say is which theories have survived testing so far.

  My instinct is that the last sentence is doing more work than the result supports — surely everyone still thinks general relativity is closer to the truth than Newtonian gravity — but I cant see where it goes wrong. Can you go through it and tell me what a philosopher of science would accept, what's a simplification, and what's just wrong? In particular: is the result really about the idea of one theory being closer to the truth, or only about Popper's way of spelling it out; and do the later workarounds — counting only 'relevant' consequences, or measuring distance between possible worlds — actually fix things, or do they just relocate the arbitrariness into a choice of which consequences count or how to weight the similarities?

  Be straight with me about confidence too: which of these claims is settled enough that I can print it flatly, which needs a hedge, and where do people who work on this genuinely disagree? I'd much rather get 'this is contested' than a tidy consensus. And if my own setup is muddled — if the result doesn't bear on what I'm trying to say in the column at all — tell me that plainly instead of politely answering the question I asked.
reasoning: |-
  Okay, the user is writing a column about whether physics progresses toward truth. They mentioned Newton being "less right" rather than wrong, but they came across an essay discussing Popper's idea of verisimilitude, which was apparently refuted in 1974 by Tichý and Miller. The user is confused because their intuition tells them that modern theories like general relativity are closer to truth than Newton's, but this philosophical result seems to challenge that.

  Hmm, I need to unpack this carefully. The user wants to know where the essay's claims hold, where they oversimplify, and what philosophers of science actually think today. They also want clarity on confidence levels—what's settled versus debated. They're clearly well-read but wary of academic traps, so I should avoid jargon and be direct.

  First, let's recall Popper's verisimilitude definition: a theory is closer to truth if it has more true consequences and fewer false ones. Tichý and Miller proved a logical flaw: if a theory is false, adding true consequences might require adding false ones too, making comparisons impossible. Popper conceded this quickly—that part is solid history.  

  But the essay's conclusion—that we can't say Newton is closer to truth than Aristotle—is where it overreaches. The flaw was specific to Popper's *logical* definition, not the *intuition* itself. Later philosophers (like Niiniluoto, Oddie) built "similarity" accounts using possible worlds or distances between states. These aren't perfect—they involve choices about what counts as relevant or how to weight factors—but they rescue the intuition.  

  The user's instinct is spot-on: scientists *do* treat GR as "closer" than Newtonian gravity. Philosophers largely agree; the debate is about *how* to formalize it, not whether it exists. The essay's "all we can say is which survived testing" is a hardline instrumentalist view, but most realists reject it.  

  For confidence levels:  
  - Popper's definition failing? Settled.  
  - Verisimilitude being possible? Contested but plausible (hedge: "many argue...").  
  - GR > Newton? Near-consensus in practice (say flatly, with "according to prevailing views").  

  The user's column setup isn't muddled—the essay just framed the problem too narrowly. They can absolutely argue Newton was "less right," but should acknowledge the philosophical wrinkles. Maybe suggest focusing on empirical progress (e.g., Newton explains tides, GR explains Mercury's orbit) as a pragmatic anchor.  

  Key nuance: later accounts "relocate arbitrariness" into relevance-weighting, but that's not a flaw—it mirrors how science weighs evidence. The choices aren't arbitrary; they track explanatory power.  

  Philosophers still debate weighting methods, but that's healthy—no one claims a perfect metric. The core idea of progress toward truth survives.
answer: |-
  Your instinct is sharp—that last sentence *is* overreaching, and the Tichý/Miller result doesn't kill the intuition that physics gets closer to the truth. Here's a breakdown for your column, separating settled points, simplifications, contested areas, and where your setup holds up:

  ### What's Settled & Uncontroversial (State Flatly)
  1.  **Popper's *specific* 1960s definition of verisimilitude (truthlikeness) failed.** Tichý (1974) and Miller (1974) independently proved a devastating logical flaw: **if two theories are both false, Popper's definition (more true consequences, fewer false ones) could *never* show one was closer to the truth than the other.** It was logically incoherent *as defined*. Popper conceded this quickly. This is ironclad philosophy of logic.
  2.  **Science progresses empirically.** We indisputably have theories (like GR) that make more accurate predictions over a wider domain, survive more stringent tests, unify more phenomena, and explain more than older ones (like Newton) they replaced. Newtonian mechanics *works* for building bridges and sending probes to Mars within its domain; GR works *better*, especially at high speeds/gravities and for precision cosmology. This progress is objective.
  3.  **No current scientific theory is considered the final, complete "Truth".** Fallibilism (all theories are potentially revisable) is widely accepted. Newton wasn't "wrong" *simpliciter*; he was brilliantly accurate within his domain but his theory has known limits where GR succeeds.

  ### Simplifications & Overstatements in the Substack Essay
  1.  **"Truthlikeness can't be analysed" / "All we can honestly say...":** This is a **radical oversimplification bordering on false.** Tichý/Miller refuted *Popper's specific logical-consequence-based analysis*. They did *not* prove the *concept* of truthlikeness is incoherent or unanalyzable *in principle*. Saying science *only* tells us "which theories survived testing so far" is instrumentalism or strict empiricism – a specific (and contested) philosophical stance, not an inevitable conclusion from the Tichý/Miller result.
  2.  **"Newton wasn't nearer the truth than Aristotle":** This directly contradicts scientific practice and intuition. While defining "nearer" rigorously is hard, **the empirical progress (Aristotle's physics -> Newton -> GR/Quantum) clearly represents *some* kind of increasing correspondence with reality.** Denying *any* sense of "closer" here is wildly counterintuitive and not mandated by the logic result.

  ### What's Contested & Needs Hedging
  1.  **The Very Concept of "Closer to the Truth":** **Realists** (most scientists and many philosophers) *insist* this progress reflects genuine, albeit approximate and partial, convergence towards a truer description of the world. **Anti-realists** (e.g., instrumentalists, constructive empiricists) argue we should *only* talk about empirical adequacy (saving the phenomena), predictive power, or problem-solving effectiveness, *not* truth-likeness. *Hedge:* "While most scientists *act* as if theories get closer to reality, some philosophers argue we should focus solely on predictive success."
  2.  **Later Analyses of Verisimilitude:** Do they "fix" things? **Partly, but with caveats.** Post-Popper approaches largely fall into two camps:
      *   **Content/Consequence Approaches (Refined):** Try to avoid Tichý/Miller by focusing on *relevant* or *important* true/false consequences, or consequences about "basic" statements. **Problem:** Defining "relevance/importance/basic" introduces subjectivity/arbitrariness. (*Hedge:* "Some philosophers propose focusing on key consequences, though defining which ones matter can be contentious.")
      *   **Similarity/Likeness Approaches (Niiniluoto, Oddie):** Define the "distance" between a theory and the truth. This often involves:
          *   **Possible Worlds:** How many possible worlds described by the theory match the actual world? Or, what's the average "distance" between states allowed by the theory and the actual state?
          *   **Structure/Models:** How similar is the mathematical structure of the theory to the (presumed) structure of reality?
          *   **Accuracy of Theoretical Properties:** How close are the values of fundamental properties (mass, charge, spacetime curvature) predicted by the theory to their true values?
      **Do they work?** They provide *plausible frameworks* that rescue the intuition and often deliver intuitive judgments (GR > Newton > Aristotle). **Problems:** They require choices: How to individuate/weight possible worlds? How to measure "distance" between states or structures? Which properties are fundamental for the measure? **This is where "relocating the arbitrariness" happens.** *Hedge:* "Later approaches define 'closer to truth' using ideas like similarity between possible worlds or accuracy of fundamental properties. These frameworks support intuitive judgments but involve choices about what counts as similar or fundamental that lack a single obvious answer."
  3.  **Is "Newton less right" defensible?** **Yes, robustly, within the similarity/likeness frameworks and scientific practice.** Newton's laws are an *excellent approximation* of GR in "weak-field, low-velocity" conditions. GR *contains* Newtonian gravity as a limiting case. Newton got fundamental aspects right (inertia, universal gravitation as *an* attractive force, mathematical predictability) but missed others (gravity as spacetime curvature, no absolute space/time, limits of applicability). This is *objectively* better than Aristotle's qualitative, domain-specific physics. **Confidence:** You can state this confidently as the prevailing scientific *and* (moderate realist) philosophical view. *Hedge only if being ultra-cautious:* "Most physicists and philosophers see Newtonian mechanics as a tremendously accurate but limited approximation, superseded by the broader and more accurate framework of General Relativity."

  ### How This Bears on Your Column
  *   **Your Setup is NOT Muddled:** Your core idea – "Newton wasn't so much wrong as less right, and that's what progress consists in" – is **absolutely defensible and aligns with the dominant realist perspective and scientific practice.** The Tichý/Miller result is a fascinating philosophical speed bump about *one specific attempt* to formalize "closer," but it doesn't derail your train.
  *   **The Challenge:** The essay correctly highlights that rigorously *defining* "less right" or "closer to truth" is philosophically trickier than it first appears, thanks to Tichý/Miller. You don't need to abandon your thesis, but acknowledging the subtlety adds depth.
  *   **What to Emphasize:** Focus on the **empirical progress** (more accurate predictions, wider domain, explanatory unification) as the undeniable engine. Argue that this progress *strongly suggests* (or, if you're a realist, *demonstrates*) increasing correspondence with reality, even if fully formalizing "correspondence" is complex. The "less right" language perfectly captures the idea of a superseding theory encompassing and correcting the limitations of its predecessor within a broader, more accurate framework.

  **Straight Talk Summary:**

  *   **Print Flatly:** Popper's 1960s verisimilitude definition was refuted (Tichý/Miller). Science makes undeniable empirical progress (GR > Newton > Aristotle). No current theory is the final truth.
  *   **Hedge:** Whether this progress means "closer to the Truth" is philosophically contested (Realism vs. Anti-realism). Later formal definitions of "closer" (similarity, relevant consequences) work intuitively but involve non-arbitrary-yet-debatable choices about weighting and relevance. There's no single, universally agreed formal measure.
  *   **Contested:** The *best interpretation* of scientific progress (truth-tracking vs. just empirically adequate). The *precise details* of the best similarity/likeness measure.
  *   **Your Thesis:** Stands strong. The refutation of Popper's *specific formula* doesn't invalidate the profound intuition that Newton was "less right" than Einstein in a meaningful sense reflecting genuine progress. The later workarounds provide robust, if not perfectly settled, support for this view. **Your column's core message is philosophically respectable and scientifically sound.** Acknowledge the Tichý/Miller wrinkle for intellectual honesty, but don't let it derail your argument about progress. Focus on the empirical triumph and the natural realist interpretation that this represents getting "less wrong."
