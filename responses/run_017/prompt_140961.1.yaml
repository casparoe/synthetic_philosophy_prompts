  Hmm, what's interesting is how personally invested the user is - they mention "the argument also refuses to stop where I want it to," showing genuine frustration with where the logic leads. Their concerns extend beyond theoretical purity to real-world implications: the loss of gratitude, admiration, and moral saints. The three self-imposed cost cases suggest they're particularly troubled by how we evaluate costly actions where the agent voluntarily assumes burdens.

  The referee's suggestion about step (2) points to a key tension: are the costs of supererogation (risk, sacrifice) moral reasons against acting or merely non-moral considerations? This seems crucial. If we count them as moral reasons, step (3) fails; if not, step (2) becomes suspect. The user seems torn here - they intuitively feel some costs shouldn't "count" (like the weighted rescuer) but others should (like the kidney donor).

  Their demand for "priced alternatives" indicates they want to understand the theoretical costs of rejecting each step, not just a list of options. They're especially reluctant to abandon (1) (praiseworthiness requires genuine reasons) and (5) (blameworthiness follows ought-failures), which makes sense as these anchor common moral thinking. The self-imposed cost cases appear to be their original contribution - they're clearly proud of this challenge and want it taken seriously.

  I should probably reject step (4) as the weakest link. The equation "reasons for + no reasons against = ought" is where the argument overreaches. Alternatives like satisficing or scalar morality could preserve supererogation by allowing that some actions can be better than required without being obligatory. This maintains praiseworthiness (saving 1) while avoiding the blameworthiness implication (saving 5).

  For the self-imposed cost puzzle: the unifying principle might be whether the cost-assumption serves morally valuable ends. The weighted rescuer's costs are morally inert because they're for vanity; the kidney donor's costs serve solidarity; the careless rescuer's costs are reparative. The firefighter falls somewhere in between - her choice reflects a valuable commitment, but the job's routine demands become baseline obligations. This principle stands independently of rejecting step (4).

  The theoretical cost? Admitting that "ought" doesn't always track the balance of reasons - a significant but defensible revision. The alternatives seem worse: rejecting (1) risks disconnecting morality from reasons; rejecting (5) excuses clear wrongdoing; rejecting (2)/(3) makes permissibility mysterious. I'm about 85% confident - what would change my mind is if someone could show that scalar morality fails to capture core cases of obligation.
answer: |-
  I reject **(4)**. The inference from "there is moral reason for S to do A and no moral reason against" to "S morally ought to do A" is invalid because moral reasons need not be *decisive* to ground praiseworthiness, and "ought" implies decisiveness.

  ### Defense of Rejecting (4)
  **(4)** assumes a maximizing, transitive model of practical reason where "ought" simply tracks the balance of reasons. This collapses the distinction between *optimal* and *obligatory*. Supererogation requires recognizing a *saturation point* for obligation:  
  - **Satisficing**: An act can be morally good (supported by reasons) and beyond what is *required*, even if no reasons oppose it. Obligation sets a minimum threshold of adequacy; supererogation exceeds it.  
  - **Scalar reasons**: Moral reasons admit of degrees without always generating binary "oughts." A strong reason *for* A doesn't entail that not-A is forbidden if the cost to the agent is significant, even if that cost isn't a *moral* reason against A (addressing your referee's worry).  
  - **Permissible suboptimality**: An agent may be permitted to choose a less morally optimal act if the optimal act imposes high personal costs, without those costs being moral *wrong-makers*.

  **What rejecting (4) costs**:  
  - You must deny that morality is *purely maximizing*. This commits you to a view where rational choice under moral reasons doesn't always point to one uniquely best action.  
  - **Can the friend of supererogation live with this? Yes.** This is precisely what distinguishes satisficing or scalar accounts (e.g., Urmson, Chisholm) from maximizing consequentialism. It preserves the core intuition that some acts are *good but not required*.

  ### Pricing the Alternatives
  - **Reject (1)**: Abandons the link between praiseworthiness and responsiveness to moral reasons. Cost: Makes supererogation arbitrary (e.g., someone acting randomly could be praiseworthy). *Unacceptable for the friend of supererogation.*  
  - **Reject (2)**: Claims costs *are* moral reasons against acting. Cost: Risks making supererogation impossible (if costs always count morally) or ad hoc (if only some do). *Plausible but costly*—requires explaining why, e.g., losing a kidney isn't a moral reason against donating.  
  - **Reject (3)**: Denies that supererogatory acts have *no* moral reasons against them. Cost: Same as rejecting (2); collapses into it.  
  - **Reject (5)**: Severs "ought" from blameworthiness. Cost: Permits blameless moral failures, weakening the force of obligation. *Possible* (e.g., "imperfect duties"), but less elegant than rejecting (4).  
  - **Reject (6)**: Accepts contradiction. Cost: Theoretical incoherence. *Unworkable.*  

  **Best alternative to rejecting (4)? Reject (2)/(3)** (as your referee suggests). But this demands a clear account of why costs (e.g., risk, sacrifice) are *non-moral* reasons. If they are merely *prudential*, you must explain how omitting a supererogatory act is *morally* permitted (answer: morality doesn't demand total self-sacrifice). This is defensible but risks dualism. **Rejecting (4) is cleaner.**

  ### The Problem of Self-Imposed Cost: Diagnosis & Principle
  **Principle**: *Self-imposed costs enhance praiseworthiness only if they serve a morally worthy end or express virtue, rather than being arbitrary, manipulative, or compensatory for prior wrongdoing.*  

  - **Weighted Rescuer**: The cost is *morally inert*—it serves vanity, not the rescue. No extra praiseworthiness; may even diminish it (gaming the system).  
  - **Kidney Donor/Income Pledge**: Costs serve *solidarity* or *charity*—morally worthy ends. The sacrifice expresses virtue (generosity, commitment), enhancing praiseworthiness.  
  - **Careless Creator**: Cost is *reparative*—it negates a duty of rectification. Not supererogatory; obligatory.  

  **Firefighter**: Foreseeing risks when choosing the job makes *routine* rescues part of her duty (she assumed role-obligations). But *extraordinary* acts (e.g., re-entering a collapsing building after evacuation) remain supererogatory—the cost exceeds what her role demands.  

  **Independence**: This problem stands *regardless* of rejecting (4). It concerns *when costs contribute to praiseworthiness*, not the structure of reasons/obligation. Rejecting (4) lets us say the firefighter’s extraordinary act is supererogatory (no *ought*), but we still need this principle to explain why her *praiseworthiness* isn’t diminished by prior risk-assumption.

  ### Commitment & Confidence
  **Confidence**: 85%. Rejecting (4) is the most conservative fix: it preserves (1) and (5), respects the referee’s intuition about costs without ceding (2)/(3), and aligns with moral phenomenology (we admire saints without thinking they *owed* us sainthood).  
  **What would move me?** A compelling argument that all moral reasons are *imperative* (no satisficing/scalar views) or that "ought" *must* track net reasons.  
  **Must another step go?** Only if (2) is also wrong—but rejecting (4) is sufficient alone.  

  **Final word**: The "exit" is recognizing that morality doesn't *demand* the best—only the good enough. Supererogation is what lies beyond.
