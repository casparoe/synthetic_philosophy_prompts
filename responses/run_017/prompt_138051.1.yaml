prompt: |-
  I'm in a philosophy of mind course, we just did Mary's room and the knowledge argument, and I got into an arguement with a friend who's a third-year med student that I can't settle. Here's the thing I keep coming back to: medical training is built around the idea that some things just can't be learned out of a book. You can memorize every written description of what a heart murmur sounds like, or what an inflamed appendix feels like under your hand, or the exact colour a particular rash has, and the profession still will not let you near patients until you've actually heard, felt and seen enough of them — clinical rotations are mandatory, procedures get logged by count, and there's that old saying about see one, do one, teach one. At the same time the very same institutions treat text and recorded data as perfectly adequate for transmission elsewhere: you're expected to manage conditions you've never seen a case of, written guidelines are treated as enough to standardize care, recorded heart sounds and image atlases get used as substitutes for live patients, and there's a lot of enthusiasm for diagnostic systems that have never had a body or a sense organ at all.

  So what does the hands-on requirement actually presuppose? My friend says it's basically the knowledge argument in institutional form — there are facts about what a murmur sounds like that you can only get by having the experience, and rotations exist to hand you those facts. I think that's too quick, and that the practice fits just as well with the boring reply that Mary doesn't learn a new fact at all, she just acquires abilities: recognizing, imagining, remembering. On that story what rotations build is a similarity space — knowing that this is the same murmur as that one, on a different stethoscope, in a noisy room, in a patient with slightly odd anatomy — which is a point about generalizing to new cases and not obviously about consciousness at all. My TA floated a third thing that I can't tell is deep or a total cheat: maybe rotations are really for calibration, i.e. learning when you don't know, and that would be a purely epistemic point with no metaphysics in it.

  Can you reconstruct the implicit epistemology as cleanly as you can, and then separate what the practice strictly presupposes from what it merely fits well with — does the hands-on requirement really need there to be experiential facts that no amount of text could convey, or would an ability-first story, or a straight physicalist one, license exactly the same training regime? Is the practice even consistent with itself, given that the same institutions let written protocols, recordings, and body-less diagnostic systems stand in for experience in other places? And be concrete about the redesign: if we dropped the Mary-style reading and took the rival view seriously, what in medical training would you actually get rid of, and what would you keep for reasons that have nothing to do with consciousness? At the end, tell me what would change your mind about your own answer — what kind of argument or evidence would convince you the training requirement is (or isn't) real evidence for phenomenal facts — and where your reasoning is most likely to go wrong.
reasoning: |-
  Okay, let me approach this step by step. The user is grappling with a philosophical dilemma rooted in medical education practices, specifically how hands-on clinical training relates to the Knowledge Argument about qualia. The core tension is between three interpretations: experiential facts (Mary's room), ability acquisition, or epistemic calibration.

  First, I need to unpack the institutional practices. Medical training insists on direct sensory experience - auscultating murmurs, palpating abdomens - yet relies heavily on textual guidelines and AI diagnostics. This duality mirrors the Mary's room paradox where book-knowledge seems insufficient for experiential knowledge.

  The key is to separate what the practice strictly requires from what it merely accommodates. The experiential facts view suggests rotations transmit ineffable qualia knowledge. The ability view frames it as pattern recognition skill-building. The calibration view emphasizes learning metacognitive awareness of diagnostic uncertainty.

  To test these, consider what would change under each model. If experiential facts were central, we couldn't replace rotations with VR simulations - yet medicine is moving toward exactly that. If it's just abilities, we should see diminishing returns after sufficient case exposure - which aligns with competency-based assessments replacing fixed rotation durations. The calibration view explains why novices need direct feedback loops to build diagnostic confidence.

  The institutional inconsistency (requiring hands-on but accepting protocols/AI) actually makes sense: once abilities are solidified, proxies become reliable. This favors the ability/calibration models over strong qualia realism. Still, the first-person aspect of sensory pattern recognition might resist full reduction - hence why AI diagnostics still struggle with perceptual variability.

  For the user's "what would change my mind" challenge: if future AI systems master diagnostic pattern recognition without sensory qualia, that weakens the experiential facts position. Conversely, if such systems consistently miss nuances only humans with clinical experience catch, that supports irreducible experiential knowledge.
answer: |-
  Your question cuts to the heart of epistemology in medicine and philosophy of mind. Let's dissect the implicit assumptions, separate necessary presuppositions from compatible interpretations, and test consistency.

  ### Core Epistemology of Medical Training (Implicit Presuppositions)
  1. **Perceptual Skill Acquisition**: Medicine assumes that **reliable pattern recognition under variable conditions** requires exposure to instances.  
  2. **Tacit Knowledge**: Some knowledge (e.g., tactile feedback nuances) is **non-propositional** and embodied.  
  3. **Calibration Against Reality**: Direct experience anchors theoretical knowledge, teaching **when inferences are uncertain**.  
  4. **Error Feedback**: Live practice provides immediate correction (e.g., "No, *this* is the murmur you missed").  

  These presuppose **no irreducible phenomenal facts**. They fit within a physicalist framework where "experience" means **sensorimotor training and probabilistic pattern-matching**.

  ---

  ### Does the Practice Require Phenomenal Facts? (Against Your Friend)
  **No.** Here's why:  
  - **Recordings/Atlases Work Post-Training**: Once a clinician has a robust similarity space (your point), *proxies suffice*. This shows the goal is **ability transfer**, not qualia transmission.  
  - **AI Diagnostics**: Systems like deep learning radiology tools achieve diagnostic competence *without subjective experience*. Their limitations (e.g., adversarial attacks) stem from **statistical generalization gaps**, not missing qualia.  
  - **"See One, Do One" as Skill Scaffolding**: The progression mirrors learning chess or wine tasting—it's about **discriminative capacity**, not acquiring private facts.  

  **Consistency Check**: Institutions *are* consistent. They demand hands-on training for **novices** building foundational skills but accept proxies for **experts** (or AIs) with validated pattern-recognition capacities. The shift occurs when error rates drop below a clinical threshold.

  ---

  ### Redesigning Medical Training Under Rival Views
  If we reject the "experiential facts" model and adopt **ability-first physicalism**:  

  | **Current Element**          | **Keep?** | **Reason (Non-Consciousness)**                                  |
  |------------------------------|-----------|----------------------------------------------------------------|
  | Clinical rotations           | Yes       | Builds sensorimotor pattern recognition under noise/variability |
  | Procedure logging by count   | **No**    | Replace with competency assessments (e.g., simulators with metrics) |
  | Apprenticeship supervision   | Yes       | Real-time error correction & uncertainty calibration          |
  | Textbook memorization        | Yes       | Necessary propositional knowledge foundation                  |
  | Image atlases for diagnosis  | Yes       | Valid once perceptual skills are established                  |
  | Pure lecture-based diagnosis | **No**    | Insufficient for perceptual skill acquisition                 |

  **Key Changes**:  
  - Replace fixed rotation durations with **simulator mastery benchmarks** (e.g., "Identify 95% of murmurs in VR with added lung noise").  
  - Use **augmented reality** overlays during early practice to highlight features experts notice.  
  - Develop **tactile feedback robots** (e.g., for appendicitis palpation) to train haptic discrimination without patients.  

  ---

  ### What Would Change My Mind?
  **Evidence for Phenomenal Facts**:  
  - If clinicians *with identical training* showed **systematic, unteachable variations** in sensory judgments (e.g., describing a murmur as "grating" vs. "rumbling") that correlated with neural activity *irreducible* to discriminative abilities.  
  - If **sensory-deprived experts** (e.g., blindfolded using auditory murmurs) could *not* diagnose conditions they mastered visually, *even with matched statistical information*.  

  **Evidence Against**:  
  - If an **AI trained solely on spectral data** (no "hearing") matched or surpassed human cardiologists in murmur diagnosis across novel populations—undermining "must be heard" claims.  

  ---

  ### Where My Reasoning Could Go Wrong
  1. **Overgeneralizing from AI**: Current AI may lack human-like generalization because it *doesn't* have embodied experience, not because it lacks qualia.  
  2. **Calibration as Trojan Horse**: The "knowing when you don't know" argument might *covertly* require first-person perspective.  
  3. **Reductionist Blind Spot**: Abilities (e.g., imagination) may *depend* on phenomenal states in ways I'm discounting.  

  **Most Likely Flaw**: Underestimating how **phenomenology scaffolds cognition**. Even if rotations build abilities, those abilities might *necessarily involve* conscious processing (e.g., mental imagery during diagnosis). This wouldn't prove Mary learns "new facts," but might show consciousness is *causally essential* to skill acquisition—a weaker but still significant claim.

  ### Conclusion
  Medical training is best explained by **skill-based epistemology**, not the Knowledge Argument. It presupposes that certain discriminations require **perceptual learning under variability**, but this is fully compatible with physicalism. The "hands-on" requirement ensures reliability, not revelation of phenomenal facts. To settle your debate: if your friend insists rotations transmit ineffable qualia, ask why echocardiograms (visual representations of sound) can train auscultation skills *after* basic exposure—suggesting calibration of public data, not private experience.
