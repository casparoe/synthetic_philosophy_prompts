prompt: |-
  You are an epistemologist with a second career adjudicating research-misconduct cases for universities and funding agencies: you have written findings that survived appeal, and you know how to make a philosophical distinction do real work for readers who have never taken a philosophy course. Please think the following through carefully before you write anything: work out what is actually at issue, what the genuine options are, and which one you would still defend if a hostile colleague attacked it, and only then draft. Give me the finished document, not your notes. A short appendix listing the options you set aside is welcome; a survey of the literature is not. No citations, no suggested reading, and no author names — if the competing positions have established names, name the positions once in a footnote for my own use, but keep the body of the memo in plain English.

  I am the outside member of the Research Integrity Committee at a large biomedical research institute, and I am the only person on it with any philosophy training. The rest of the committee is a molecular biologist who chairs it, a grants officer, a clinician, and the institute's general counsel. We meet Friday; I want to circulate this memo on Wednesday evening. Our policy (section 4.2(b) of the integrity policy) says that a senior author commits misconduct if they knew, or should have known, that data in a funded paper were fabricated. Neither term is defined; should have known has been applied in practice as something like a reasonable researcher in that position would have checked.

  The case is 23-07. A postdoc, Dr. T, produced the blots behind Figure 3 of a paper on which the principal investigator, Dr. R, was senior author. R noticed at the time that the bands looked unusually clean and made a joke about it in a lab meeting; T offered to show him the raw files and R never took him up on it. Two months before submission, a collaborating lab emailed saying they could not reproduce the Figure 3 result; R replied that he would look into it, and did not. Fourteen months after publication a reader flagged duplicated bands, and T has admitted fabricating them. In between, a national clinical practice guideline incorporated the paper's conclusion. Fixing the guideline now is expensive and embarrassing; the paper is being retracted either way.

  The practical difference between our two possible findings is enormous. If we find that R knew, the finding is published, the remaining $2.1M of the grant is clawed back, and R's career is effectively over. If we find only that he should have known, it goes into a private remediation and mentoring plan. One of our members pointed out that this means the stakes in the case are partly created by the finding we are about to make, which feels circular, and nobody on the committee knew what to do with that observation.

  Two further complications. First, we have two precedents that now look odd together. In 21-02 we found that a researcher knew his cell-line characterization was unreliable, on very thin evidence — an unread email from a supplier — in a methods paper where nothing turned on it. In 22-11, with materially stronger evidence — a failed internal replication and two lab members' complaints — we declined to find knowledge, in a case where a knowledge finding would have paused an ongoing trial. I think we have been sliding the standard without noticing, and my training tells me there are two main stories about why the bar for knowledge seems to move: one on which what matters is how much is at stake for the person who is supposed to know, and one on which what matters is the context of whoever is attributing knowledge. There is also the flat-footed view that the bar does not move at all and that only our readiness to act on a knowledge claim does. I do not want a lecture on these; I want a decision.

  Second, our general counsel has advised that knew should be read as the institute's oversight board would currently read it, and notes that the board is in a defensive posture after a separate scandal and has been saying informally that it wants to be slower to find that people knew. Several of us think it would be wrong for R's liability to depend on the board's mood; counsel says that is simply how ordinary knowledge language works.

  Draft the memo I will circulate, addressed to the committee, roughly 900 words, with headings. It should: (1) recommend, and defend, one reading of knew for section 4.2(b), as against the alternatives; (2) apply that reading to reach a definite finding in 23-07, working through the evidence rather than asserting a conclusion; (3) say what we should do about 21-02 and 22-11 — reconcile them, reinterpret them, or reopen them — and give the grants officer a rule for future cases that someone without philosophy training can actually apply; and (4) include one paragraph stating the strongest version of the reading you are rejecting, in terms its defenders would recognize as fair. Be committed: I need a single recommendation with its reasons, not a menu of options for us to choose between, and I need you to say plainly where your recommendation is most exposed and what further fact would most change your mind.
reasoning: |-
  Alright, the user is an outside member of a Research Integrity Committee at a biomedical institute, facing a high-stakes misconduct case. They need a memo to guide the committee's decision by Friday. Let me unpack this carefully.

  First, the core issue is interpreting "knew" in their misconduct policy. The practical consequences are stark: finding "knew" ends a career and claws back funding; "should have known" leads to remediation. The committee is non-philosophical, so I must avoid jargon while making subtle distinctions clear.

  Hmm... three philosophical approaches emerge: 
  1) Stakes-sensitivity (higher stakes = higher evidence bar for "knew")
  2) Contextualism (meaning of "knew" shifts with attributor's context)
  3) Invariantism (meaning fixed, only our willingness to act changes)

  The case facts are damning: R joked about suspicious data, ignored reproducibility concerns, and overlooked clear red flags. Precedents are inconsistent - one found "knew" with weak evidence, another didn't with strong evidence. Plus, legal pressure complicates things with the oversight board's defensive posture.

  I reject stakes-sensitivity - it feels unjust to let outcomes determine culpability. Contextualism is tempting but risks institutional inconsistency. Invariantism aligns best with fairness: "knew" means having sufficient evidence to believe fabrication, regardless of context. 

  For 23-07... R had multiple warnings. The joke shows awareness, the failed replication was a clear signal, and he actively avoided verification. This meets the invariant threshold for knowledge. 

  About precedents: 21-02 was wrongly decided - an unread email shouldn't count as knowledge. 22-11 might be defensible if evidence wasn't conclusive. We should reopen 21-02 and issue a clear rule: "knew" requires the accused possessed evidence that would compel belief in fabrication if reviewed. 

  The strongest counterargument? That demanding certainty in high-stakes cases protects researchers from overzealous institutions. But we can't let stakes distort truth. 

  My recommendation is most vulnerable in 22-11 - if their replication failure wasn't definitive, our standard might be too harsh. But R's pattern of avoidance here feels different. 

  Memo structure: define position upfront, apply to facts, reconcile precedents, state counterargument plainly. Keep headings sharp, language accessible. No philosophy names - just clear reasoning. 

  For the grants officer: a simple flowchart question - "Did the researcher have evidence of fabrication that they reviewed or deliberately avoided reviewing?" That's implementable. 

  This will hurt - careers and money at stake - but integrity demands consistency, not convenience.
answer: |-
  **MEMORANDUM**  
  To: Research Integrity Committee  
  From: [Your Name], External Committee Member  
  Date: October 18, 2023  
  Subject: Recommended Interpretation of "Knew" in Policy 4.2(b) and Finding for Case 23-07  

  ---

  ### I. RECOMMENDED INTERPRETATION OF "KNEW"  
  Our policy requires finding misconduct if a senior author **knew or should have known** of fabricated data. "Knew" must mean:  
  **The senior author possessed evidence sufficient to conclude fabrication had occurred, and consciously disregarded it.** This requires:  
  (a) **Access to concrete evidence** (e.g., direct warning, visible anomaly, failed replication report);  
  (b) **Awareness of the evidence’s implications** (e.g., understanding it pointed to fraud); and  
  (c) **Deliberate avoidance of verification** (e.g., refusing to review raw data when offered).  

  We reject interpretations where "knew" shifts based on external stakes (e.g., clinical guidelines) or the attributor’s context (e.g., the oversight board’s risk tolerance). Knowledge is a fixed threshold: either the evidence compelled a conclusion of fabrication, or it did not. What varies is not the *meaning* of knowledge, but the *consequences* of finding it.  

  ---

  ### II. APPLICATION TO CASE 23-07  
  Applying this standard to Dr. R:  
  1. **Evidence possessed**:  
     - Dr. R observed unusually clean bands and joked about them, signaling recognition of irregularity.  
     - He received a direct email from collaborators failing to reproduce Figure 3.  
     - Dr. T offered raw files; Dr. R declined.  
  2. **Awareness of implications**:  
     - His joke ("bands look unusually clean") shows he suspected atypical (possibly manipulated) data.  
     - The collaborator’s email explicitly questioned the result’s validity.  
  3. **Deliberate avoidance**:  
     - He replied he would "look into" the collaborator’s concern but did nothing.  
     - He refused Dr. T’s offer to show raw data.  

  **Conclusion**: Dr. R had sufficient evidence to believe fabrication was probable, consciously avoided confirming it, and thereby **knew** under Policy 4.2(b).  

  ---

  ### III. RECONCILING PRECEDENTS & FUTURE RULE  
  **On Precedents**:  
  - **21-02** (unread email): We erred. An unread email does not constitute "knowledge." The researcher lacked awareness (element b). **Reopen and reverse.**  
  - **22-11** (failed replication + complaints): If the replication was non-definitive and complaints were vague, "knowledge" may not have been met. **Let stand, but clarify below.**  

  **Rule for Grants Officer**:  
  > *In future cases, "knew" requires:  
  > (1) Concrete evidence of fabrication (e.g., direct warning, glaring anomaly);  
  > (2) Proof the accused understood the evidence’s significance; and  
  > (3) Willful failure to verify despite capacity to do so.*  
  > *If these three elements exist, "knowledge" is found. External stakes are irrelevant.*  

  ---

  ### IV. STRONGEST COUNTERARGUMENT (AND WHY WE REJECT IT)  
  *Defenders of stakes-sensitivity* argue:  
  > "When consequences are severe (e.g., halting a clinical trial), we rightly demand higher evidence to attribute ‘knowledge.’ This aligns with real-world judgments: we hesitate to say ‘you knew’ if the fallout is catastrophic, unless proof is ironclad. Our precedents reflect this practicality."  

  **Why we reject it**:  
  Basing "knowledge" on outcomes confuses ethics with epistemology. It incentivizes ignoring red flags in high-stakes work and punishes identical conduct differently based on luck. If Dr. R ignored warnings because the clinical stakes were high, that exacerbates (not excuses) his negligence.  

  ---

  ### V. VULNERABILITIES & KEY UNCERTAINTY  
  This recommendation is most exposed on **element (b) (awareness)**. If Dr. R’s "joke" was truly dismissive (not suspicious) *and* he misunderstood the collaborator’s email as minor, he may not have grasped the implications. However:  
  - His offer to "look into" the email confirms he recognized a serious issue.  
  - **What would change my mind?** If lab-meeting notes showed the "clean bands" joke was clearly sarcastic *and* followed by immediate acceptance of Dr. T’s reassurance.  

  ---

  ### RECOMMENDATION  
  1. Find that Dr. R **knew** the data were fabricated.  
  2. Reopen Case 21-02 to reverse the finding.  
  3. Adopt the three-element rule above for future cases.  

  ---  
  **Appendix: Options Set Aside**  
  - *Stakes-sensitive knowledge*: Bar for "knew" rises with consequences.  
  - *Contextualism*: Meaning of "knew" shifts with the attributor’s context.  
  - *Willful blindness*: "Knew" includes deliberate ignorance, but we require active disregard (stronger than passivity).
