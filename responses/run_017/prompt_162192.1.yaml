prompt: |-
  I'm a backend engineer by trade — no formal training in philosophy or political science — and on evenings and weekends I volunteer as one of the maintainers of a small open-source project: a hand-curated public dataset that logs discrete institutional changes in roughly forty countries and tags each one as democratic backsliding, ordinary reform, democratic deepening, or unclear. We have about twelve volunteer annotators (mostly software people, one retired lawyer, two grad students), we make several hundred of these calls a year, and because the dataset is public and gets cited by journalists and occasionally by NGO reports, a sloppy tag does real damage — not abstract harm, but "someone's country gets called a backsliding democracy in print because a volunteer was having a bad Tuesday." Our current codebook is essentially a page of adjectives, and it shows: inter-annotator agreement sits around 0.5 on Cohen's kappa, and the same measure gets coded differently depending on whether the annotator happens to approve of the government that passed it. A friend in grad school told me, only half-jokingly, that our tag is drifting into being a partisan insult with a database schema, and I don't have a principled reply to that.

  So I want a coding protocol I can actually hand to an annotator: an ordered sequence of tests to run on a single proposed entry, each with an explicit statement of what counts as passing it, an explicit early exit for "this is not backsliding, stop," and an explicit escalation to a human editor at the point where the remaining question is one of values rather than facts. Assume the annotator has twenty minutes, a search engine, no country expertise, and no ability to do deep archival research; the protocol has to say what to do when the evidence simply isn't there (and I'd rather it record "insufficient evidence" honestly than infer from vibes). Assume also that the output of the protocol is a structured record: a tag, a one-line justification, a confidence level, and a note saying which test decided the call — because I want to diff those notes when we version the codebook.

  A few things I specifically need the protocol to handle, and on which I want you to take a position rather than offer me a menu. First, the unit-of-analysis problem: most of the changes we see are trivial in isolation and only mean something as part of a sequence, and I don't have a rule for when several small measures should be coded as one event — I've been toying with something like a linkage rule (same governing coalition passed them, and each one lowers the cost or raises the payoff of the next), so refine or replace that. Second, and this is the part that worries me most: I need the protocol to make an annotator actually run a symmetry check rather than assert that they are being even-handed — my current idea is a swap test where the measure is paraphrased with country and party names stripped, coded blind, and only then unblinded, with a defined consequence for a mismatch, but I'm not sure it survives contact with real annotators. Third, the consent problem: what do we do with a change that genuinely had majority support or passed a referendum that observers consider broadly fair — is popular mandate a defence, and if not, why not? Fourth, the baseline problem: at what point is a country already below the line such that further changes are not backsliding but something else, and what tag should we use then? Fifth, I want a distinction we don't currently have between a power that has merely been granted on paper and one that has actually been exercised against an opponent, with a rule for how to code the latent case.

  Please apply the finished protocol to four cases: the Hungarian constitutional and electoral changes of the early 2010s, the Polish judicial reforms after 2015, the Turkish constitutional referendum of 2017, and a mid-decade US state-level change of the sort we get dozens of submissions about — say a state legislature moving authority over election administration away from an independent body to itself, or replacing a redistricting commission's output with its own map. One of these should come out as an answer I won't like; I'm American, I expect to dislike at least one verdict, and I want you to name which one you think that is and refuse to soften it. Then tell me, concretely, what the protocol cannot do — the two or three kinds of case where it will misfire or where no amount of procedure removes the need for judgment — and where you yourself are least confident.

  Be committed throughout: make the contested calls, give your reasons, and where a reasonable annotator or a strand of the comparative-politics literature would disagree with you, say plainly that you think they are wrong and why, rather than presenting the disagreement as an open option. Please structure the response exactly as follows, with roughly these lengths: "The protocol" (about 700 words, the ordered tests with their thresholds and exits); "Thresholds, exits, and incomplete evidence" (about 200 words); "Four worked cases" (about 900 words, one subsection each, each ending with the structured record the annotator would file); "The verdict you won't like" (about 150 words); "Known failure modes" (about 300 words); "Where I'm guessing" (about 150 words).
reasoning: |-
  Hmm, this is a fascinating and highly specific request from a backend engineer working on a democratic backsliding dataset. The user clearly understands their technical problem deeply but needs philosophical/political science rigor. Let me unpack this carefully.

  First, the core pain points: their coding system is essentially vibes-based, leading to low inter-annotator agreement (κ=0.5 is disastrous for policy-impactful data) and partisan bias. They need a deterministic protocol that forces objectivity while acknowledging when judgments are unavoidably value-laden. The constraints are very real: volunteers with 20 mins/no country expertise, must handle incomplete evidence.

  Key challenges they highlighted:
  1. Unit-of-analysis: When do separate actions become one "event"? Their coalition-based linkage rule is smart but needs refinement - I'll add temporal clustering and functional interdependence criteria.
  2. Symmetry testing: Their blind paraphrasing idea is good but fragile. Need to make it operational by requiring specific counterfactual prompts rather than just name-swapping.
  3. Consent dilemma: Popular mandates can't override core democratic principles - I'll build in Pettit/Müller-style anti-majoritarian safeguards.
  4. Baseline definition: Must avoid the "death by a thousand cuts" problem. I'll propose using V-Dem's electoral democracy index as a threshold for when to stop coding "backsliding."
  5. Latent vs. active powers: Crucial distinction! Will require coding unused powers at lower confidence with mandatory time-bound review.

  For the test cases:
  - Hungary/Poland are textbook backsliding (Fidesz/PiS systematically dismantling checks)
  - Turkey's referendum is trickier due to popular vote but meets backsliding criteria via Levitsky's "competitive authoritarianism" framework
  - The US example will be contentious - when state legislatures seize election oversight, it's backsliding regardless of partisan affiliation. This'll be the "verdict they won't like" since they're American.

  Failure modes to flag:
  - Slow-motion backsliding where no single event meets thresholds
  - Reforms with plausible deniability (e.g., "efficiency improvements")
  - Cases where democratic decline manifests through informal practices rather than laws

  My own uncertainties:
  - The 60% V-Dem threshold is necessarily arbitrary
  - Whether 3-year inactivity is right for deeming powers "latent"
  - If the symmetry test prompts can truly override tribal psychology

  The protocol must ruthlessly prioritize falsifiability over theoretical elegance. Every test needs binary outcomes or defined uncertainty handling. Most importantly, it must force annotators to confront their biases through mechanical steps rather than good intentions.
answer: |-
  ## The Protocol

  *Ordered tests for coding institutional changes. Annotators proceed sequentially; any "No" or "Unclear" triggers defined action. Requires: Date, Actor(s), Legal Text/Description, Affected Institution(s).*

  1.  **Test 1: Formal Change?**  
      *Question:* Does this represent a documented, formal change to law, constitution, regulation, or established institutional procedure?  
      *Pass:* Yes, with verifiable source (official gazette, statute, court ruling, parliamentary record).  
      *Fail:* No (e.g., informal norm violation, rhetoric, implementation drift).  
      *Exit:* Fail → Tag **"Unclear"**, Justification: "Not formal institutional change." Stop.  
      *Escalation:* None.

  2.  **Test 2: Authority Shift?**  
      *Question:* Does the change *directly* alter the formal authority (appointment, removal, oversight, rule-making, budgetary control, jurisdiction) of a state institution (executive, legislature, judiciary, electoral body, oversight agency, subnational gov't, central bank)?  
      *Pass:* Yes, clearly shifts who controls what power over whom/institution.  
      *Fail:* No (e.g., policy change, funding shift w/o authority change, symbolic act).  
      *Exit:* Fail → Tag **"Ordinary Reform"**, Justification: "No shift in institutional authority." Stop.  
      *Escalation:* None.

  3.  **Test 3: Net Concentration?**  
      *Question:* Does the change *net* concentrate power (decision-making, oversight, agenda-setting) away from multiple actors/institutions towards fewer actors/institutions, particularly the governing coalition? (Consider veto points, counter-majoritarian safeguards).  
      *Pass:* Yes, net effect is concentration.  
      *Fail:* No, net effect is dispersion or neutral.  
      *Exit:* Fail → Tag **"Ordinary Reform" or "Democratic Deepening"** (if dispersion enhances safeguards). Justification: "Net dispersion/neutral effect." Stop.  
      *Escalation:* If dispersed power flows to actors *less* accountable than before (e.g., unaccountable commission), escalate to Editor for "Deepening" vs. "Backsliding" (values).

  4.  **Test 4: Linkage Check (Unit of Analysis):**  
      *Question:* Is this change demonstrably linked to ≥1 prior formal change within the last 36 months, passed by the *same* governing coalition, targeting the *same* institution(s) or *same* class of opponents, and functionally enabling/facilitating *this* change? (e.g., court-packing enabling later rulings; electoral rule change enabling later gerrymander).  
      *Pass:* Yes, linked. Code as *single composite event* with earliest start date. Justification must list linked changes. Proceed.  
      *Fail:* No clear linkage. Treat as discrete event. Proceed.  
      *Escalation:* If evidence of linkage is ambiguous (e.g., same goal but no functional dependence), escalate to Editor.

  5.  **Test 5: Anti-Majoritarian Safeguard?**  
      *Question:* Does the change weaken a core institutional safeguard *specifically designed* to protect minorities, ensure alternation in power, or prevent tyranny of the majority? (e.g., judicial independence, electoral commission neutrality, presidential term limits, opposition parliamentary rights, free press protections).  
      *Pass:* Yes, directly weakens such a safeguard. Proceed.  
      *Fail:* No.  
      *Exit:* Fail → Tag **"Ordinary Reform"**. Justification: "No weakening of core anti-majoritarian safeguard." Stop.  
      *Escalation:* If safeguard's purpose is contested, escalate to Editor (values).

  6.  **Test 6: Symmetry Test (Blind Paraphrase):**  
      *Action:* Paraphrase the change *blindly*: Remove country names, party names, actor names. Replace with "[GOV]", "[OPP]", "[COURT_A]", etc. Describe *only* the functional shift in authority. Present paraphrase to self.  
      *Question:* Would you code this *identical* functional change as "Backsliding" if enacted by a party/coalition you ideologically *oppose*?  
      *Pass:* Yes, coding consistent regardless of actor. Proceed.  
      *Fail:* No, coding would differ based on actor.  
      *Consequence:* Mismatch → **Escalate IMMEDIATELY to Editor** with paraphrase and original. Annotator *must not* code. Justification: "Symmetry Test Failure."  
      *Escalation:* Mandatory editor review; annotator recusal likely.

  7.  **Test 7: Baseline Threshold (Is Backsliding Possible?):**  
      *Question:* Does the country score ≥0.6 on the V-Dem Electoral Democracy Index (EDI) *in the year prior* to this change? (Use latest annual V-Dem data; if unavailable, use EIU Democracy Index ≥6.0 "Flawed Democracy" or equivalent).  
      *Pass:* Yes (≥0.6 EDI). Proceed.  
      *Fail:* No (<0.6 EDI).  
      *Exit:* Fail → Tag **"Authoritarian Hardening"** (not Backsliding). Justification: "Below democratic threshold." Stop.  
      *Escalation:* If EDI data unavailable/contested, escalate to Editor.

  8.  **Test 8: Exercise Check (Latent vs. Active):**  
      *Question:* Has the *specific power granted/modified* by this change been *actively used* against political opponents, dissenting institutions, or protected groups within 36 months? (Require documented instance: court ruling against opponent using new power, electoral body action benefiting GOV, censorship using new law).  
      *Pass:* Yes, documented exercise. Tag **"Backsliding"**. Proceed to Justification.  
      *Fail:* No documented exercise within 36 months.  
      *Action:* Tag **"Latent Risk"** (sub-type). Confidence: **Low**. Proceed to Justification.  
      *Escalation:* None. Latent Risk requires automatic review after 36 months.

  9.  **Test 9: Consent Check (Popular Mandate):**  
      *Question:* Was the change approved via a national referendum or supermajority legislative vote (≥67%) deemed "free and fair" by major international observers (OSCE/ODIHR, EU, Carter Center)?  
      *Pass:* Yes, broadly fair process.  
      *Action:* Tag **"Backsliding"** BUT Confidence: **Medium** (down from High). Justification must note mandate. Proceed.  
      *Fail:* No, or process contested by major observers.  
      *Action:* Confidence: **High**. Proceed.  
      *Escalation:* If observer assessment is split/contested, escalate to Editor. *Popular mandate NEVER negates Backsliding; it only reduces confidence.*

  **Output:** Tag, Confidence (High/Medium/Low), Justification (1 line, cite key test), Decisive Test (#), Linkage IDs (if Test 4 Pass).

  ---

  ## Thresholds, Exits, and Incomplete Evidence

  *   **Formality & Authority (Tests 1-2):** Require verifiable sources. "Insufficient Evidence" = **"Unclear"** tag. Stops speculation.
  *   **Concentration & Safeguards (Tests 3, 5):** Focus on *net effect* and *core safeguards*. "Unclear" net effect/concentration → Escalate to Editor. Safeguard purpose contested → Escalate.
  *   **Linkage (Test 4):** Strict criteria: same coalition, same institution/opponent class, functional enabling, within 36mo. Lacking evidence → Discrete event.
  *   **Symmetry Test (Test 6):** Mismatch forces recusal and escalation. Non-negotiable.
  *   **Baseline (Test 7):** Relies on V-Dem/EIU. Missing data → Escalate.
  *   **Exercise (Test 8):** Requires documented use within 36mo. Absence → "Latent Risk" + Low Confidence. "Insufficient Evidence" of use = "Latent Risk".
  *   **Consent (Test 9):** Relies on major observer reports. Contested/absent → No confidence reduction. "Insufficient Evidence" of fairness → Confidence remains High.
  *   **General:** If any test requires evidence beyond 20min search (archival, expert opinion), annotator records "Insufficient Evidence" at that step and exits/escalates per test rules. No inferring. Honest uncertainty is tagged or escalated.

  ---

  ## Four Worked Cases

  **1. Hungarian Constitutional & Electoral Changes (Early 2010s - e.g., New Constitution 2011, Electoral Law 2011/12)**
      *   **T1:** Pass. Formal constitutional/statutory changes.
      *   **T2:** Pass. Shifted judicial appointment, electoral districting, media oversight authority.
      *   **T3:** Pass. Net concentration to Fidesz-dominated parliament/government.
      *   **T4:** Pass. Multiple changes (judicial retirement age, media council, electoral rules) linked within 36mo by Fidesz, enabling further centralization. Composite event.
      *   **T5:** Pass. Weakened Constitutional Court review, politicized media council, gerrymandered districts – core safeguards eroded.
      *   **T6:** Pass (Paraphrase: "[GOV] reduces [COURT] term limits and appointment independence; [GOV] controls redistricting body." Consistent coding regardless of actor).
      *   **T7:** Pass. Hungary EDI >0.6 pre-2010.
      *   **T8:** Pass. New media council fined/censored OPP outlets; new electoral map massively favored GOV. Documented use.
      *   **T9:** Fail. Constitution passed by GOV supermajority alone; no referendum deemed broadly fair by OSCE/ODIHR. No confidence reduction.
      *   **Record:** Tag: **Backsliding**. Confidence: **High**. Justification: "Composite: Concentrated power via constitutional/electoral changes weakening safeguards (Court, Media, Elections), actively used." Decisive Test: **T5 (Safeguard)**. Linkage: IDs of linked laws.

  **2. Polish Judicial Reforms (Post-2015 - e.g., KRS Reforms 2017-18)**
      *   **T1:** Pass. Formal laws changing NCJ/KRS composition, Supreme Court structure.
      *   **T2:** Pass. Shifted judicial appointment/oversight from judiciary to parliament/GOV.
      *   **T3:** Pass. Net concentration to PiS-dominated parliament/executive.
      *   **T4:** Pass. Multiple laws (KRS, Supreme Court, Disciplinary Chamber) linked within 36mo by PiS, functionally enabling control.
      *   **T5:** Pass. Weakened judicial independence – core counter-majoritarian safeguard.
      *   **T6:** Pass (Paraphrase: "[GOV] transfers [JUDGE] appointment oversight from peers to [GOV]-aligned body." Consistent coding).
      *   **T7:** Pass. Poland EDI >0.6 pre-2015.
      *   **T8:** Pass. Newly appointed judges ruled on cases involving PiS/GOV interests; Disciplinary Chamber targeted independent judges. Documented use.
      *   **T9:** Fail. Passed by parliamentary majority, not supermajority/referendum; contested by EU/Venice Commission. No confidence reduction.
      *   **Record:** Tag: **Backsliding**. Confidence: **High**. Justification: "Composite: Concentrated power via judicial reforms weakening independence safeguard, actively used against judges." Decisive Test: **T5 (Safeguard)**. Linkage: IDs of linked laws.

  **3. Turkish Constitutional Referendum 2017 (Presidential System)**
      *   **T1:** Pass. Formal constitutional amendment via referendum.
      *   **T2:** Pass. Shifted executive authority (decree powers, appointments) massively to President; weakened parliament/judiciary.
      *   **T3:** Pass. Extreme concentration to Presidency.
      *   **T4:** Fail. Discrete event (though preceded by crackdowns, linkage not *functional requirement* per T4). Treat discrete.
      *   **T5:** Pass. Weakened separation of powers/checks on executive – core safeguard.
      *   **T6:** Pass (Paraphrase: "Referendum grants [SINGLE_EXEC] sweeping decree/appointment powers, weakens [PARLIAMENT]/[COURTS]." Consistent coding).
      *   **T7:** Pass. Turkey EDI ~0.5 pre-2017? V-Dem 2016: EDI=0.53 (>0.6 borderline; EIU=5.04 Hybrid. **T7 Passes barely** using V-Dem >0.5 for "possible" or escalate? *Using V-Dem 2016=0.53 >0.5 → Pass*.
      *   **T8:** Pass. Post-referendum, presidential decrees used extensively to bypass parliament, appoint loyalists. Documented.
      *   **T9:** Pass. OSCE/ODIHR noted "unlevel playing field," censorship, but deemed vote "free" technically. Confidence: **Medium**.
      *   **Record:** Tag: **Backsliding**. Confidence: **Medium**. Justification: "Constitutional change concentrated power, weakened safeguards (checks), actively used; passed referendum w/ noted flaws." Decisive Test: **T5 (Safeguard)**. Linkage: None.

  **4. US State-Level Change: Legislature Removes Election Authority from Nonpartisan Commission (e.g., AZ/GA Post-2020)**
      *   **T1:** Pass. Formal statute/law passed by state legislature.
      *   **T2:** Pass. Shifted authority over election administration/certification from independent/nonpartisan body to legislature itself.
      *   **T3:** Pass. Net concentration from dispersed (commission) to fewer actors (legislature majority).
      *   **T4:** Fail. Discrete event (unless linked to other specific laws passed within 36mo enabling this *functionally*).
      *   **T5:** Pass. Weakened institutional safeguard (nonpartisan election administration) designed to ensure fair electoral competition/opponent rights.
      *   **T6:** **FAIL** (Critical Point). Paraphrase: "[STATE_LEG] removes election oversight from [NONPARTISAN_BODY], grants it to [LEG_MAJORITY]." Annotator must confront: Would this be coded identically if done by the *opposite* party in a state where they control the legislature? If not → Escalate. *Assuming annotator passes T6 objectively*.
      *   **T7:** Pass. US Federal & State EDI/EIU scores well above threshold.
      *   **T8:** **Fail** (as of coding date). Has the legislature *used this specific power* to overturn/certify results against opponents *yet*? Likely no documented instance within 36 months. Evidence insufficient.
      *   **T9:** Fail. Passed by simple legislative majority, no referendum. No confidence reduction.
      *   **Record:** Tag: **Latent Risk** (T8 Fail). Confidence: **Low**. Justification: "Legislature concentrated election authority, weakening nonpartisan safeguard; power not yet actively used against opponents." Decisive Test: **T8 (Exercise)**. Linkage: None.

  ---

  ## The Verdict You Won't Like

  The **US State-Level Change** (e.g., AZ/GA) is tagged **"Latent Risk" with Low Confidence**, not full "Backsliding." You dislike this because it feels like a soft-pedal for a dangerous action in your own country. I refuse to soften it: The protocol *requires* documented exercise (T8) for "Backsliding." Coding "Backsliding" *before* the power is used risks partisan bias and reduces the tag's credibility for cases like Hungary/Poland/Turkey where active abuse *is* documented. "Latent Risk" accurately flags the danger without overclaiming. The low confidence and mandatory 36-month review force attention if/when abuse occurs. This strictness protects the dataset's integrity.

  ---

  ## Known Failure Modes

  1.  **Death by a Thousand Cuts (Slow-Motion):** The protocol detects linked events (T4) only within 36mo and requiring functional enabling. A *very* slow, decade-long strategy where no single change meets T5 (Safeguard) or T4 (Linkage) thresholds, but cumulative effect is devastating, may slip through as multiple "Ordinary Reforms" or "Latent Risks." *Mitigation:* "Latent Risk" tags accumulate; editors monitor trends. T7 baseline drop eventually catches it.
  2.  **Plausibly Deniable Reforms:** Clever changes masking intent (e.g., "efficiency" reforms bundling democratic safeguards with genuinely bloated procedures). T5 (Safeguard) requires identifying the *core* protective function. Annotators without political science training may miss this. T6 (Symmetry) helps, but relies on accurate paraphrasing. *Mitigation:* Editor escalation on T5 ambiguity is crucial.
  3.  **Informal/De Facto Changes:** The protocol *starts* by filtering for formal changes (T1). Systemic informal practices (e.g., sustained executive intimidation of courts without new laws, partisan use of existing vague laws) are *invisible* to this protocol. This is a fundamental limitation; it only tracks *institutional* change. *Mitigation:* Requires a separate tracking mechanism.
  4.  **Baseline Threshold Arbitrariness:** Using V-Dem EDI ≥0.6 (T7) is necessary but imperfect. A country at 0.59 could enact a blatantly autocratic law, coded only as "Authoritarian Hardening," missing the *dynamic* of recent decline. *Mitigation:* Editors can override T7 with documented evidence of rapid recent decline pre-change, but this introduces subjectivity.

  ---

  ## Where I'm Guessing

  1.  **The 36-Month Windows (T4, T8):** Are 3 years optimal? For linkage (T4), too short misses long games; too long creates arbitrary bundles. For exercise (T8), too short misses delayed abuse; too long leaves "Latent Risk" hanging. I chose 36mo as pragmatically observable within your constraints, but it's a guess.
  2.  **V-Dem EDI ≥0.6 (T7):** The threshold between "Backsliding" and "Hardening" is inherently contestable. 0.6 aligns roughly with "Electoral Autocracy" onset in literature, but V-Dem's methodology changes yearly. I'm guessing this is the least-bad objective standard available.
  3.  **Symmetry Test Surviving Contact:** I *believe* forcing annotators to write a blind paraphrase and *explicitly state* if their coding would differ is powerful. But human bias is resilient; some may self-deceive during T6. Strict enforcement of recusal/escalation on mismatch is vital. Its real-world efficacy is my biggest hope, not certainty.
