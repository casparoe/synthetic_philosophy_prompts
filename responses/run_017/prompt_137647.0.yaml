prompt: |-
  I am a professor of philosophy who works mainly on the ethics of punishment, and I have recently been made chair of my university's Standing Committee on Open Inquiry. The committee has exactly one power: to grant, condition, withdraw, or restore a university platform — an invitation, a named lecture, a keynote, a professional-society meeting hosted on our campus. We cannot hire, fire, or discipline anyone, and because we are a public university our counsel insists that our stated grounds be viewpoint-neutral, which in practice means we must be able to describe what we are responding to as conduct rather than as the content of a scholarly claim. We meet monthly, we have roughly half an hour per case, our members include two students and a university lawyer, and our written reasons are published and are read as precedent at other institutions.

  I would like a decision procedure my committee could actually run, in the room, on a demand to withdraw or restore a platform. I do not want a position paper; I want an ordered set of questions, a specification of what counts as a sufficient answer to each, the points at which the procedure stops with a no, and the points at which it hands the decision to a person because the remaining question is one of values rather than fact. It should include an ordered ladder of available tariffs — from a published statement of censure, through conditioning the event (a respondent, a published rejoinder, a mandatory open Q&A), through a dated postponement, up to withdrawal and to removal of a named honorific — with the conditions that license each rung and an explicit expiry and review date for every rung above censure.

  The procedure should also operationalize a set of distinctions I have found myself relying on without being able to state cleanly, and I would like my names for them either disciplined or replaced by better ones:

  the authorship condition — that no exclusion is legitimate unless some identifiable body states the charge, the tariff, and its expiry, so that an open-ended exclusion produced by diffuse pressure and merely tolerated by us cannot be ratified or credited as time served;

  equivalence in currency — that a sanction which takes an audience, a credential, or an honorific should be denominated in that same good and should not exceed the advantage the person obtained or would have obtained from it;

  separability — whether the objectionable matter is separable from what the person was actually invited to do, so that we can tell withdrawing a platform from withdrawing a view;

  the counterfactual-audience test — whether this person would have been platformed but for the conduct complained of, which is my rough device for detecting pretext and selective enforcement;

  the collateral-bearer test — who in fact bears the cost of the sanction, and in particular whether it falls mainly on people who are not responsible for the conduct and who may even be its victims;

  the reply-and-return route — what the person must do to regain ordinary standing, and who certifies that they have done it;

  tariff scarcity — the thought, borrowed from the expressive side of the punishment literature, that our condemnations are a signal whose content degrades if we spend the top of the ladder on minor offenses.

  Any procedure must also fit, or tell me explicitly which to overrule, our three published rulings: we withdrew an invitation from a visiting scientist who had fabricated data, saying we were refusing to lend her the credential of a platform rather than sanctioning the content of her claims; we declined to withdraw an invitation from a philosopher invited to lecture on his own published argument about a contested social question, and instead required a respondent and a departmental statement of disagreement; and we removed a donor's name from a lecture series after a fraud conviction, but only once replacement funding for an equivalent series was secured, and we set no end date.

  Please then run the procedure on three live cases. First: a senior researcher from another institution, invited by a student society to give the annual Darwin Day lecture on her work on avian cognition; the demand to disinvite her cites a thread of posts she wrote three years ago minimising a twentieth-century famine, which she has declined to retract and which is unrelated to her lecture; the inviting society is split, and graduate students in her field have told us her talk is the only one of its kind they will see this year. Second: a member of our own faculty, principal investigator on a federally funded longitudinal health study and sole adviser to four doctoral students, who posted a series of videos asserting a minority group's criminality; the demands are that he be dropped as keynote at the university research showcase and barred indefinitely from university-sponsored public venues; the study recruits its participants from, and provides screening to, that same minority group. Third: a scholar we disinvited four years ago by indefinitely postponing an event, without ever issuing a charge or a tariff, who has since published an apology that the relevant community's own representatives describe as an apology for being misunderstood, and who has now been nominated for an office in a society whose meeting we are hosting.

  For each case I want the rulings the procedure yields, the closest precedent, and an honest statement of the principle we would be adopting if we went the other way. At least one of the three should produce a recommendation that a majority of my committee will dislike; tell me which, and why the procedure forces it. Finally, tell me what the procedure cannot settle: where it will misfire, what it silently assumes about our standing to sanction people who are not members of our community and about our capacity to establish contested conduct in half an hour without any power to compel evidence, and which of its steps are judgment calls wearing the costume of procedure. For what it is worth, I have argued in print that much of what is called cancellation is simply the ordinary operation of reputational accountability, and I do not want a procedure that flatters that view; I am least confident about whether our own practice of indefinite postponement is anything other than unauthored punishment, and that is the case I most want the procedure to handle rather than duck.
reasoning: |-
  Okay, the user is a philosophy professor specializing in ethics of punishment, now chairing a university committee on open inquiry. They need a practical decision procedure for handling platform withdrawals or restorations. The procedure must be viewpoint-neutral, fit within 30-minute meetings, and align with existing precedents. They also want operational definitions for several key distinctions they've been using informally.

  First, I need to unpack their core requirements: a step-by-step flowchart with clear yes/no gates, sanction tiers with expiry dates, and integration of their seven conceptual distinctions. The precedents are crucial - data fabrication (withdrawal), controversial philosopher (conditional platform), and donor naming removal (permanent but with funding replacement). 

  The three test cases are revealing: 
  - The Darwin lecturer with unrelated historical views presents a separability challenge. 
  - The faculty PI making harmful statements tests collateral harm to vulnerable research participants. 
  - The previously postponed scholar forces confrontation with the "unauthored punishment" dilemma the user explicitly worries about.

  Key structural challenges emerge: 
  How to make conduct/content distinctions hold up under scrutiny? 
  Can "indefinite postponement" ever be legitimate given the authorship requirement? 
  How to prevent the committee from becoming a de facto ethics tribunal without investigative powers?

  The user's unspoken tension is fascinating - they've publicly defended reputational accountability but privately doubt if their own committee's past actions qualify as legitimate. The procedure must resolve this by either banning indefinite sanctions or building in authorship safeguards.

  For the decision tree, I'm considering a three-phase approach: 
  1. Threshold checks (jurisdiction, separability) 
  2. Conduct assessment (established facts, counterfactual test) 
  3. Sanction calibration (tariff scarcity, collateral bearers). 

  The sanction ladder needs rungs with automatic sunsets - anything beyond censure must expire. The "apology for misunderstanding" case will likely force an uncomfortable ruling that indefinite penalties violate authorship principles, which might upset colleagues who want permanent exclusions.

  Biggest vulnerability: The committee can't compel evidence yet must make conduct findings. The procedure must either limit sanctions to undisputed facts or require "clear and convincing" evidence from public records. Also, non-community members can't be "punished" - only denied platform benefits they haven't yet received.

  The user's famine scholar case is particularly tricky. Even if the conduct is separable, does platforming her imply endorsement? The counterfactual audience test ("would we invite her but for the posts?") becomes critical here. If graduate students genuinely need this lecture, collateral harm from withdrawal might outweigh other factors.

  For the faculty PI, the health study dependency creates brutal collateral damage - withdrawing his keynote might feel just but could destroy healthcare access for the minority group he disparaged. The procedure might force conditional sanctions (mandatory Q&A with affected community reps) rather than outright withdrawal.

  Ultimately the procedure's weakest point is conflating judgment calls with factual findings when assessing "conduct vs scholarly claims." But that's unavoidable - which is why the final step must explicitly flag when decisions shift from fact-finding to value judgments about institutional reputation.
answer: |-
  Here is a procedural framework designed for real-time committee deliberation, integrating your requirements and precedents. The decision tree operates in phases, with clear exit points and escalation logic.

  **Decision Procedure: Platform Access Review (PAR) Framework**

  ### I. Threshold Questions (Must all be "Yes" to proceed to sanction consideration)
  1. **Jurisdiction**: Is the conduct *uniquely tied* to a university platform (past, pending, or future)?  
     *Sufficient Answer*: Direct link between conduct and platform use (e.g., used platform for misconduct, seeks platform while under sanction).  
     *Exit on "No"*: No action.  
     *Precedent Fit*: Aligns with scientist/fabrication ruling (misuse of academic credential).

  2. **Separability**: Is the objectionable conduct *separable* from the content of the invited work?  
     *Sufficient Answer*: Conduct is unrelated to the expertise/platform purpose (e.g., famine posts vs. avian cognition lecture).  
     *Exit on "No"*: Use Conditioned Platform (e.g., respondent + statement).  
     *Precedent Fit*: Philosopher case (controversial views were *part* of invited work).

  3. **Authorship Condition**: Can the charge be stated as *specific conduct* (not viewpoint) with identifiable origin?  
     *Sufficient Answer*: Concrete description of act(s) with date/context (e.g., "fabricated data in Paper X," "posted video Y alleging Z").  
     *Exit on "No"*: No sanction (may issue Censure if conduct undisputed).  
     *Critical Note*: Indefinite postponement fails here unless tied to a reviewable condition.

  ### II. Conduct Assessment
  4. **Counterfactual-Audience Test**: Would this person *likely have been platformed* absent the conduct?  
     *Sufficient Answer*: Objective evidence of merit-based invitation pre-conduct or for unrelated work.  
     *Exit on "No"*: Withdraw invitation (pretext likely).  
     *Values Handoff*: If ambiguous, committee votes on institutional reputation risk.

  5. **Factual Basis**: Is the conduct *undisputed, publicly documented, or adjudicated*?  
     *Sufficient Answer*: Court records, institutional findings, or unambiguous public evidence.  
     *Exit on "No"*: No sanction (insufficient proof under time constraints).  
     *Lawyer Role*: Advise on defensibility given evidence limits.

  ### III. Sanction Calibration
  6. **Collateral-Bearer Test**: Who bears primary cost?  
     *Key Check*: Will sanction disproportionately harm non-responsible parties (e.g., students, research subjects)?  
     *Mitigation Required*: If "Yes," sanctions must minimize harm (e.g., allow lecture but cancel honorific).

  7. **Equivalence in Currency**:  
     - *Sanction must match platform type*:  
       - Credential (e.g., named lecture): Remove naming *only* if misconduct exploited that honor.  
       - Audience access: Postponement/withdrawal proportional to gained reach.  
     - *Must not exceed advantage*: No lifetime bans for single offense.

  8. **Tariff Scarcity Ladder** (Escalate only if prior rung insufficient):  
     - **Rung 0**: Published Censure (any verified misconduct).  
     - **Rung 1**: Conditioned Platform (respondent, statement, Q&A) – *for non-separable content or minor conduct*.  
     - **Rung 2**: Dated Postponement (1-3 years) – *for severe/separable conduct; requires review date*.  
     - **Rung 3**: Withdrawal/Naming Removal – *only for egregious platform abuse; requires funding parity for naming*.  
     - *Expiry*: All Rungs 1-3 auto-expire after term; re-application triggers new PAR.

  9. **Reply-and-Route**: Specify reversible sanctions:  
     - "Reinstatement requires: [Action, e.g., public correction] + [Certifier, e.g., relevant department]."  
     - *No certification* = sanction expires automatically per Rung.

  ---

  **Case Applications**

  **Case 1: Darwin Day Lecturer (Famine Posts)**  
  - Threshold: Passes Jurisdiction (platform sought), Separability (posts ≠ avian cognition), Authorship (specific posts cited).  
  - Conduct: Fails Counterfactual Test (likely invited for avian work). Factual Basis undisputed.  
  - Sanction: **No sanction**. Collateral harm to grad students high; tariff scarcity prohibits sanctions for separable off-platform speech.  
  - *Precedent*: Philosopher case (conditioning not required as conduct fully separable).  
  - *Opposite Principle*: Universities may police off-duty speech unrelated to expertise.

  **Case 2: Faculty PI (Minority Group Videos)**  
  - Threshold: Passes Jurisdiction (keynote platform), Separability (videos ≠ health research), Authorship (specific videos).  
  - Conduct: Passes Counterfactual (invited for research). Factual Basis (public videos).  
  - Sanction: **Conditioned Platform + Censure** (Rung 1).  
    - *Rationale*: Separable conduct but severe; collateral harm to minority participants requires platform access for health services.  
    - *Condition*: Keynote requires respondent from affected community + 50% Q&A time.  
  - *Precedent*: Philosopher case (conditioning for separable harm).  
  - *Opposite Principle*: Faculty status intensifies institutional endorsement risk.

  **Case 3: Postponed Scholar ("Apology for Misunderstanding")**  
  - Threshold: **Fails Authorship Condition**. Original "postponement" had no charge/tariff/expiry.  
  - Action: **Restore platform immediately**.  
    - *Rationale*: Prior sanction was unauthored punishment; current apology irrelevant without formal reinstatement route.  
  - *Precedent*: Naming removal required funding parity (structured process); here, no process existed.  
  - *Opposite Principle*: Institutions may impose diffuse social sanctions without due process.  
  - **Majority-Disliked Outcome**: Restoring a platform for someone with an insincere apology. Procedure forces it because prior sanction was illegitimate.  

  ---

  **Limitations & Hidden Assumptions**  
  1. **Non-Members**: Assumes platform access is a *privilege*, not a right. Sanctions deny future benefit (no punishment).  
  2. **Fact-Firing**: Assures *public/undisputed conduct only*. Misfires if:  
     - Complex disputes arise (e.g., "he said/she said" without records).  
     - Committee must defer to external adjudications (courts, employer findings).  
  3. **Judgment Calls in Procedural Clothing**:  
     - Separability (Is a famine scholar's unrelated activism separable from academic identity?)  
     - Counterfactual Test (Requires inferring intent of inviters).  
     - "Egregiousness" for top tariffs (Values handoff to vote).  
  4. **Cannot Settle**:  
     - Whether conduct constitutes "scholarship" (e.g., if famine posts cited as scholarship).  
     - Genuine remorse (Reply-and-Route relies on external certifiers).  
  5. **Indefinite Postponement**: Procedure *bans* it. All sanctions above censure expire or are reviewable.  

  **Key Philosophical Fix**  
  Your "unauthored punishment" concern is resolved:  
  - *All sanctions require authored charges + tariffs*.  
  - "Postponement" becomes a *time-bound Rung 2 sanction* with expiry.  
  - Prior practice deemed illegitimate; current apology triggers no new action (must re-petition).  

  This framework enforces viewpoint neutrality by binding sanctions to *platform-related conduct*, leverages your ethical distinctions operationally, and makes the committee's values choices explicit at defined handoff points. It accepts that some reputational consequences (e.g., community backlash) remain beyond institutional control.
