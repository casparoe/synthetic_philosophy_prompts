  Ultimately, the specification should allow a "no backsliding" verdict even for disliked governments if they preserve core democratic functions. The toughest requirement to follow consistently will be symmetry - boards naturally struggle to apply equal scrutiny to aligned governments. But dropping it would make the concept useless for their purpose.

  The user should prioritize symmetry above all - without it, the judgment becomes partisan. The specification I develop balances these demands while acknowledging where trade-offs exist.
answer: |-
  ## Specification: Democratic Backsliding for Early-Warning Funding Decisions

  An adequate account of democratic backsliding for your foundation's purpose must satisfy six core requirements, derived from the operational need for early, evidence-based, non-partisan judgments by external actors:

  1.  **Timeliness (Fires Before Outcome Settled):** Must detect erosion *in progress*, not just post-facto collapse. It cannot wait for rigged elections or overt dictatorship.
      *   *Motivating Case:* **Marevia.** Democratic quality plummeted *during* the emergency *before* elections were held. An account requiring an unfair election as proof would miss the critical window where intervention might still matter. Waiting for settled failure abandons partners when they need support most.
      *   *Failure Mode:* Accounts focused solely on outcomes (e.g., "elections are no longer competitive") trigger too late. Partners are already abandoned or defeated.

  2.  **Observability (Answerable to Evidence):** Must rely primarily on publicly verifiable actions, institutional changes, and patterns of behavior, not private intent or subjective assessments of "spirit."
      *   *Motivating Case:* **Mandate Case & Kalenia.** Did abolishing the upper chamber or extending the president's term *intend* to entrench power, or reflect legitimate reform? Observable *effects* on checks/balances matter more than alleged motive. Requires evidence accessible to external monitors (laws, regulations, ownership records, documented harassment, procedural violations).
      *   *Failure Mode:* Accounts requiring mind-reading or access to classified intel are unusable for a board. Over-reliance on subjective "democratic culture" assessments invites partisan interpretation.

  3.  **Symmetry (Applies Equally to All Sides):** Must generate the *same* judgment for substantively similar actions *regardless* of the actor's ideology or the observer's approval of their policy goals.
      *   *Motivating Case:* **Mirror Case.** Centralizing power while pursuing popular reforms must trigger the same warning lights as centralization by a reviled government. **Kalenia's** media acquisitions are suspect regardless of the coalition's initial popular mandate or later loss.
      *   *Failure Mode:* Accounts that define backsliding only as actions by the "right-wing populist" or "illiberal" side, or excuse actions by "progressive" governments, are purely partisan tools. They destroy the foundation's credibility and operational mandate.

  4.  **Directionality (Moves Off Democratic Path):** Must identify actions that demonstrably *reduce* core democratic functioning or potential, not just political contestation or change disliked by some.
      *   *Motivating Case:* **Federation Case & Mandate Case.** Centralization/national degradation might be anti-democratic, but simultaneous enfranchisement/improvement in other areas complicates a simple "backsliding" verdict. Removing a veto point used to disenfranchise minorities might *enhance* democracy even if it centralizes power.
      *   *Failure Mode:* Accounts equating any power shift or institutional change with backsliding (e.g., pure "veto point" minimalism) lack directionality. They flag necessary reforms or decentralization as equally problematic as erosion.

  5.  **Attribution of Agency (Distinguishes Erosion from Erosion):** Must distinguish between intentional, strategic actions *by powerful political actors* that degrade democracy, and democratic decline caused by exogenous shocks, state incapacity, or societal polarization *not* primarily driven by governing elites.
      *   *Motivating Case:* **Marevia vs. Kalenia.** Marevia's decline during a genuine existential crisis driven by external war is substantively different from Kalenia's *chosen* actions (term extension, media capture) taken *without* such pressure. Both degrade democracy, but the *source* matters for assigning responsibility and judging "moving off the path" as an active choice by the government.
      *   *Failure Mode:* Accounts that only measure aggregate democratic quality (like some indices) cannot distinguish between a government actively dismantling democracy and a government struggling (even incompetently) to maintain it amidst chaos. This ignores the "moving" aspect requiring agency.

  6.  **Falsifiability (Can Return "No"):** Must be structurally capable of clearing a government, even one the observer dislikes, if its actions do not meet the threshold criteria for active democratic erosion.
      *   *Motivating Case:* **Mirror Case & Mandate Case.** A popular government centralizing power *while* expanding the franchise and reducing captured institutions *might* pass the test if the net effect or the *nature* of centralization doesn't actively erode core competitive democracy. An account that only flags actions common to one side is useless.
      *   *Failure Mode:* Ratchet concepts (only flags opponents) or those defining democracy so thickly (requiring high liberalism/participation) that any conservative/centralizing government is automatically "backsliding" fail this. They make the judgment purely political.

  **Resolving Tensions:**
  *   **Timeliness vs. Falsifiability/Symmetry:** This tension is real but manageable. Focus on *patterns* of observable, agency-driven actions that *directly* attack core competitive institutions *early* (e.g., stacking electoral commissions *before* the election is rigged, systematic harassment of opposition media/judges, legal changes removing key checks). Requiring *multiple concurrent erosions* across core areas (elections, media, judiciary) increases confidence in an early warning while preserving falsifiability (a government might attack one area but preserve others).
  *   **Agency vs. Observability:** Dissolved by focusing on *institutional impact and strategic pattern*. We don't need a smoking gun memo saying "destroy democracy." We observe *which* institutions are targeted (those checking power), the *speed* and *sequence* of changes, the *asymmetry* (harming opponents disproportionately), and the *consistency* with known entrenchment playbooks. Marevia's emergency *closures* might be necessary; Kalenia's *acquisition* of media is a strategic choice.

  **Who Decides?** An adequate account *cannot* solely defer to domestic actors. Oppositions cry wolf, courts can be captured, voters can be misled or support erosion. External observers *must* be able to override based on observable evidence meeting the above criteria. The cost of deference is missing erosion until it's too late (e.g., captured courts uphold pseudo-legal power grabs). The cost of override is potential paternalism – mitigated by rigorous adherence to **Observability** and **Symmetry**.

  **Key Questions Answered:**
  *   **"Genuine Desiderata vs. Camp Preferences":** Timeliness, Observability, Symmetry, Falsifiability, and Directionality (properly defined) are genuine operational needs. Thick "liberal-constitutionalist" requirements (e.g., *must* have strong judicial review) or "participatory" ones (e.g., *must* expand direct democracy) are preferences, not core to detecting *competitive* democratic erosion. "Electoral-minimalist" is closest but needs augmentation for early warning (beyond just clean elections) and directionality.
  *   **Joint Unsatisfiability:** No subset is *jointly unsatisfiable*, but **Timeliness** and **Falsifiability/Symmetry** are perpetually in tension requiring careful calibration (multiple concurrent erosions as threshold).
  *   **Can it Return "No"?** Yes, if the specification requires Symmetry, Falsifiability, and focuses on observable agency-driven erosion of *core competitive institutions*. A disliked government pursuing centralization *without* systematically disabling checks, capturing referees, or disempowering opponents could pass.
  *   **Who Decides?** See above. External override is necessary but must be constrained by rigorous criteria.
  *   **Most Excluding Requirement:** **Symmetry.** Most popular accounts (academic, advocacy) fail this by design or bias. They are built to critique specific actors/ideologies.
  *   **Requirement Most Likely Violated:** **Symmetry.** Boards (and humans) are terrible at applying the same standard to disliked vs. liked actors. Vigilance and explicit checks are essential.

  **Should You Drop the Umbrella Term?** No. A list of mechanisms (court-packing, etc.) lacks **Directionality** and **Agency** – doing one doesn't necessarily mean *backsliding* (e.g., court reform could be legitimate), and isolated actions might not constitute "moving off the path." The umbrella term is essential for capturing the *process* and *cumulative impact*. However, the *evidence* must be the observable mechanisms assessed against the core specification.

  **Scorecard:**
  *   **Expert-Coded Indices (V-Dem, FH):** Strong on **Observability** and **Directionality** (aggregate measures). Weak on **Timeliness** (lagged, aggregate), **Agency** (often don't distinguish cause), and especially **Symmetry** (coder bias can creep in). Poor **Falsifiability** for disliked governments due to thick definitions/aggregation.
  *   **Institutional Guardrail Accounts:** Strong on **Directionality** (focus on core institutions). Moderate on **Observability** and **Timeliness** (can see attacks early). Weak on **Symmetry** (often idealize a specific institutional setup) and **Agency** (may miss subtle degradation). **Falsifiability** varies.
  *   **Mechanism-Based Accounts (Media Capture, etc.):** Strong on **Observability**, **Timeliness** (can spot early), and **Agency** (capture implies actor intent). Weak on **Directionality** (one captured mechanism doesn't always = backsliding) and **Falsifiability/Symmetry** (easily applied selectively if not part of a broader threshold).

  **Conclusion & Recommendation:** A usable specification exists but demands strict discipline. Adopt this core definition: **Democratic backsliding begins when a governing actor, through observable actions demonstrating agency, initiates a pattern of degrading multiple core institutions necessary for free and fair political competition, such that the overall trajectory reduces the potential for future alternation in power.** Focus evidence on *simultaneous* erosion in 2+ of: 1) Electoral Integrity (admin, rules, franchise), 2) Media Freedom & Pluralism, 3) Judicial/Investigative Independence, 4) Opposition/Civil Society Operation. Apply with unwavering **Symmetry**.

  **Requirement to Prioritize:** **Symmetry.** Without it, the entire judgment collapses into politics, violating your charter and credibility. If you must drop one, **Agency** is the least critical for pure *early warning* (you care about the path moving, regardless of why), but retaining it significantly improves accuracy and fairness. Do not drop Symmetry.
