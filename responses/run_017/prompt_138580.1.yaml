  The requirements must address: timeliness (detecting early), observability (using public evidence), symmetry (applying equally to all sides), directionality (measuring democratic erosion), and agency (distinguishing intentional from incidental changes). I'll draw from the cases to show why each matters - like how Marevia tests observability during crises.

  For the scorecard: expert indices like V-Dem are strong on observability but weak on timeliness; institutional accounts miss subtle erosions; mechanism-based approaches capture intent but require access to insider knowledge. None fully satisfies all requirements.

