prompt: |-
  I sit on the standing review panel of a national research council's high-risk "Frontiers" scheme, and we are mid-term reviewing a five-year programme grant, *Pre-Selection Without Words*, which asks whether any non-human animal preselects among possible actions — trying out candidate moves in imagination, as it were, and letting the bad ones die cheaply — rather than merely repeating whatever a history of reinforcement has stamped in. The interim report describes what the applicants call the "costly check" result: in a novel apparatus where the food is visible from the start and where lifting a weighted inspection flap costs the bird both time and priority of access, most of the crows lift the flap before committing, on their very first encounter with the apparatus. The applicants read this as preselection: the birds pay a real price to eliminate a possibility before acting on it. One of our panel members reads the same data as a Skinnerian creature doing exactly what a long reinforcement history for investigating anything novel would predict, and says the experiment was never designed to tell the two apart. Both readings feel genuinely available to me, and I cannot see what would break the tie.

  What makes it worse — or more interesting — is a wrinkle raised at our last meeting. The apparatus is itself informative: the flap's weight, the transparent panel, the way the reward sits in the tube, all encode the answer in a form a bird could simply read off the world rather than compute in its head, so that what looks like foresight may be the environment doing the preselecting for a creature that only has to respond to the result. If that is right, we seem to have a mind that achieves Gregorian performance — real leverage from information-bearing structures outside the skin — without the Popperian machinery that the familiar four-rung ladder of Darwinian, Skinnerian, Popperian and Gregorian creatures (Dennett, I gather; I came to it secondhand) treats as its prerequisite. The rungs stop being cumulative, and our welfare working group's quiet assumption that these classifications track a single scale of inner richness comes apart. That matters concretely here, because the council intends to use this programme's outcome to set enrichment and husbandry standards for corvids kept by member institutions, and possibly to decide which species go onto an enhanced-protection list; if the competence lives in the niche rather than in the animal, the practical requirement may be to preserve the scaffold rather than to credit the mind.

  Please draft the decision memo I will circulate to our board before it meets on 12 March. It should recommend one concrete course of action on the second tranche — release it, release it re-profiled, or withhold it pending a specified change — with a date or milestone attached, and it should state plainly what result eighteen months from now would settle the question either way. Assume the memo will be shared with the applicants, so the decision rule has to be something they could actually go and answer in a laboratory rather than an invitation to produce a deeper philosophical argument. It should also engage seriously the objection I expect from our comparative psychologist: that no behavioural signature can distinguish preselection occurring inside the animal from preselection performed by a structured environment, and that in any case welfare protection should track what an animal can suffer rather than where it sits on a ladder of cognitive kinds — so that, as she put it at our last meeting, both our research question and our enrichment debate are expensive ways of asking something we already know the answer to. If you think she is right, say so and recommend accordingly; if you think she is partly right, say which part and what follows for the tranche.
reasoning: |-
  Hmm, the user is part of a review panel for a high-risk research program on animal cognition called "Pre-Selection Without Words." They're reviewing a mid-term report about crows that seem to demonstrate "preselection" - the ability to mentally simulate actions before committing to them. But there's controversy on the panel about how to interpret the "costly check" experiment where crows lift a weighted flap before accessing food.

  The key issues are fascinating. One panel member thinks this behavior is simply Skinnerian conditioning (learned through reinforcement), while others see it as genuine cognitive preselection. There's also a deeper question about whether the environment itself is doing the "preselection" through its design, meaning the birds might not need sophisticated internal cognitive processes at all.

  This matters practically because the research outcomes will influence welfare standards for corvids in captivity - whether we focus on enriching their minds or preserving environmental scaffolds. The user wants me to draft a decision memo with concrete recommendations about funding the next phase of research.

  The memo needs to address several important elements: recommend funding action (release, reprofile, or withhold with changes), specify a testable milestone for 18 months from now that can resolve the preselection debate, and engage with the comparative psychologist's objection that all this is philosophically moot since welfare should focus on suffering capacity rather than cognitive classifications.

  I should structure the memo clearly: start with context, then state the recommendation, explain the reasoning, specify the required experiment, acknowledge the psychologist's valid points while showing why the research question still matters practically, and conclude with implementation details.

  For the recommendation, I think we should release the next tranche of funding but with specific reprofiling - requiring the team to conduct a new experiment that can actually distinguish between internal preselection and environmental scaffolding. The milestone should be a clear behavioral signature test within 18 months.

  The new experiment should remove the environmental cues that might be doing the "work," perhaps by using an opaque apparatus where the bird can't see the consequences without paying the cost to inspect. If they still pay the cost when they can't gain information, that would support Skinnerian learning. If they only pay when information is available, that supports true preselection.

  I agree with the comparative psychologist that welfare should primarily track capacity for suffering, but I disagree that the cognitive question is irrelevant. Understanding where competence resides (mind vs environment) directly impacts how we design enrichment - whether we focus on mental stimulation or physical scaffold preservation. Both aspects matter for welfare.

  The memo should be professionally written but accessible, avoiding jargon where possible, and should maintain a balanced tone since it will be shared with the applicants. The decision rule needs to be something they can actually test in the lab, not just philosophical debate.
answer: |-
  ## Interim Decision Memorandum: "Pre-Selection Without Words" Programme Grant

  **To:** Standing Review Panel, Frontiers Scheme Board  
  **From:** [Your Name/Position], Review Panel Member  
  **Date:** 5 March 2024  
  **Subject:** Mid-Term Review & Tranche 2 Recommendation - "Pre-Selection Without Words"  
  **Meeting Reference:** Board Meeting, 12 March 2024  

  ### 1. Context & Key Findings
  The programme investigates whether non-human animals (specifically corvids) "preselect" actions via internal simulation ("Popperian" cognition) rather than relying solely on reinforced learning ("Skinnerian" cognition). The interim report highlights the "costly check" result: crows consistently pay a time/priority cost to inspect a novel apparatus *before* acting on their first encounter. While the applicants interpret this as evidence for internal preselection, valid concerns exist:  
  *   **Skinnerian Interpretation:** The behaviour may reflect a generalized, reinforced "investigate novelty" instinct, not internal simulation.  
  *   **Gregorian Scaffolding:** The apparatus itself may encode the solution ("preselecting" externally), reducing the cognitive demand on the bird. This challenges the assumed hierarchy (Darwinian > Skinnerian > Popperian > Gregorian) and complicates attributing competence solely to the animal's mind.  

  ### 2. Core Challenge & Panel Divergence
  The current data and apparatus design **cannot reliably distinguish** between:  
  (A) Internal preselection (Popperian cognition).  
  (B) Externally scaffolded selection (Gregorian niche exploitation).  
  (C) A deeply ingrained, domain-general investigative behaviour (Skinnerian).  
  This ambiguity impedes both the core scientific question and the programme's intended impact on corvid welfare standards.  

  ### 3. Recommendation: Release Tranche 2 Funding (Reprofiled) - Conditional on Definitive Experiment
  *   **Decision:** Release the second tranche of funding.  
  *   **Reprofiling Requirement:** The programme **must design and implement a decisive behavioural experiment** within the next 6 months (by **30 September 2024**).  
  *   **Milestone:** Completion of data collection and preliminary analysis for this experiment by **30 September 2025** (within 18 months).  
  *   **Condition:** Continued funding beyond the immediate operational needs for this experiment is contingent on the Review Panel's assessment of the experimental design (submitted by 30 Sept 2024) and subsequent results.  

  ### 4. The Required Experiment: Breaking the Tie
  The applicants must design an experiment that **decouples the information value of the "check" from the cost of performing it and from pre-existing investigative drives.** Crucially, it must control for environmental scaffolding.  

  *   **Core Principle:** Manipulate whether performing the costly "check" action *actually provides new, decision-relevant information* that cannot be obtained passively or via simpler mechanisms.  
  *   **Proposed Paradigm (Illustrative - Applicants to Finalise):**  
      1.  **Opaque Variant:** Modify the core apparatus so the critical state (e.g., reward presence/position, trap status) is **NOT visible** without lifting the weighted flap (information *only* via costly check).  
      2.  **Transparent Variant (Baseline):** As per the original, where the state is visible without cost (environment scaffolds the answer).  
      3.  **"Blind Cost" Control:** Introduce a functionally identical costly flap action (same weight, time delay) in a context where lifting it provides **NO useful information** relevant to obtaining the reward (e.g., flap reveals a blank wall, reward is obtained via a separate, unambiguous route). This tests the pure "investigate novelty" or "perseverance" hypothesis.  
  *   **Key Comparison:** Compare first-trial (or very early trial) behaviour across these conditions in naive crows.  
  *   **Decisive Signature:**  
      *   **Strong Support for Internal Preselection:** Significant propensity to perform the costly check *only* in the **Opaque Variant** (where information is genuinely needed and not available otherwise), significantly *higher* than in the Transparent Variant (where the answer is free) and the Blind Cost control (where the cost yields no information).  
      *   **Support for Skinnerian/Exploratory Drive:** Similar rates of costly checking in *all* variants (Opaque, Transparent, Blind Cost), indicating a generalized response to novelty or cost-persistence, irrespective of information gain.  
      *   **Support for Gregorian Scaffolding Dominance:** High checking in the **Transparent Variant** (where the answer is visually obvious *without* the check, making the check redundant) but low checking in the **Opaque Variant** (where the bird cannot use passive vision and fails to seek the necessary information). This suggests dependence on environmental cues, not internal simulation driving information seeking.  

  ### 5. Engaging the Comparative Psychologist's Objection
  The objection that "no behavioural signature can distinguish internal from environmental preselection, and welfare should track suffering capacity, not cognitive kind" is **partially valid but ultimately incomplete** for this programme's goals.  

  *   **Distinction Challenge (Partially Valid):** Perfectly clean behavioural distinctions are difficult. However, the proposed experiment explicitly manipulates the *location* of the critical information (inside the animal's head via inference vs. readily available in the world vs. only available via costly probe). While not a direct window into phenomenology, differential responses provide strong, pragmatic evidence for whether the animal's behaviour is *driven by the need to acquire latent information* (suggestive of simulation) or other factors. This is the best available scientific approach.  
  *   **Welfare Primacy (Valid):** Capacity for suffering *is* the paramount ethical concern. **However, understanding the *source* of behavioural competence (mind vs. niche) is crucial for effective welfare interventions:**  
      *   If competence relies heavily on **internal simulation (Popperian)**, enrichment must focus on providing opportunities for complex problem-solving, choice, and cognitive challenge to prevent boredom/frustration.  
      *   If competence relies on **exploiting environmental scaffolds (Gregorian)**, enrichment must prioritize providing and maintaining those specific, informative structures within the environment. Merely providing "cognitive toys" might be ineffective if the animal depends on reading specific cues.  
      *   If driven by **strong, inflexible investigative drives (Skinnerian)**, enrichment might need to channel this drive appropriately or ensure environments don't chronically frustrate it.  
      **Therefore, while suffering capacity defines *why* we protect, understanding the *nature* of the cognition (or its external scaffold) informs *how* we protect effectively and efficiently.** The research question is not redundant.  

  ### 6. Conclusion & Next Steps
  The "costly check" result is provocative but inconclusive. The programme's core question remains unresolved due to interpretative ambiguity and potential environmental scaffolding. To justify its high-risk nature and achieve its impact goals, a decisive experiment is essential.  

  *   **Recommendation:** **Release Tranche 2 funding, reprofiled** to mandate the design, approval (by Panel), and execution of the definitive experiment outlined above.  
  *   **Critical Date:** Experimental design proposal due to Panel by **30 September 2024**. Data collection complete and preliminary results available by **30 September 2025**.  
  *   **Decision Rule:** The results at Sep 2025 (specifically the differential checking rates across Opaque, Transparent, and Blind Cost conditions on first/early trials) will determine whether the data supports internal preselection, environmental scaffolding dominance, or a general investigative drive. This provides a laboratory-testable, behavioural signature to break the current tie.  
  *   **Welfare Implications:** The Sep 2025 results will directly inform whether future corvid enrichment standards should emphasize (a) cognitive challenge/simulation opportunities, (b) preservation of specific informative environmental structures, or (c) management of generalized exploratory behaviours – ensuring practical guidance is grounded in validated mechanisms.  

  **Recommended for Board approval on 12 March 2024.**
