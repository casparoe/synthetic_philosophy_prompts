prompt: |-
  For the past eight months I have been the trustee of a modest fund established for my late brother's two children. It is to be drawn down over roughly twenty-five years, and almost nothing about it turns on a single grand decision. What I actually face is a long drift of small ones: whether to renew a policy with a higher deductible, whether to lock money into a slightly illiquid placement for a better yield, whether to help a relative now or preserve capital, whether to rebalance during a bad month. There is also a floor. If the fund's value drops below a certain level, a care arrangement lapses, and nearly everything else I am trying to secure becomes worthless at once.

  A friend who works in decision theory told me, more or less, to maximize expected utility and stop worrying. When I asked why, I got two answers that struck me as quite different in character, and I have been turning them over since. I would like a careful comparison of them, because I suspect they do not support the same practical advice.

  The first is the familiar coherence argument: the Dutch-book and money-pump style of reasoning. If my preferences are not representable as maximizing expected utility — if they are cyclic, or violate the independence axiom in the way the Allais patterns suggest — then there is a sequence of trades or choices, each of which I am disposed to accept, whose net effect is to leave me with strictly less of everything I care about. Coherence, on this view, is not a substantive moral or prudential demand; it is a consistency condition, and incoherence is a defect you can exhibit without knowing anything about what the agent wants.

  The second I have been sketching myself, and I call it the archipelago argument, mainly so that I can stop losing it. Suppose (i) I will face a large number n of decision problems whose outcomes are probabilistically independent of one another; (ii) my good across the whole sequence is the sum of a bounded "local" good contributed by each problem; (iii) in each problem the act I am inclined to choose falls short, in expected local good, of the expected-utility-maximizing act by at least some fixed ε > 0. Then, by a concentration-of-measure bound, the probability that my aggregate good over the sequence fails to fall short of the expected-utility maximizer's goes to zero, and does so exponentially in n. No bookie, no exploiter, no sequential trading, and no assumption that I am dynamically inconsistent: merely that a small, repeated, systematic shortfall in expectation becomes a near-certain shortfall in fact. This is the thought that actually moves me when I sit down to sign things, and I would guess it may be a garbled version of something in the literature — but please assess the argument rather than try to place it. If it is confused, say so plainly and tell me where.

  Some questions I would like addressed.

  1. How far does each argument actually reach? My sense is that the money-pump machinery is most at home with the probability axioms and with acyclicity, and that it is much less clear how far it gets toward the independence axiom; but I would like your view on whether a genuine money-pump argument for full expected-utility representation exists, and what extra premises it would need. Does the archipelago argument do better or worse on this score? It looks to me as if it speaks directly to independence but only delivers maximization with respect to a local utility function it does not itself derive.

  2. Is the archipelago argument independent of expected-utility maximization, or is it simply an application of it one level up — expected utility applied to the grand lottery over the whole sequence, plus additivity, from which per-problem maximization follows? If the latter, is there any residue? A bootstrapping or self-consistency constraint can still bite, and I would like to know whether the same is true of the coherence argument, which also seems to presuppose rather a lot about what it is for one continuing agent to be consistent over time.

  3. My floor. Because the problems share one pool of capital and because there is a threshold below which things collapse badly, separability across problems fails: what a given small decision is worth depends on where the fund then stands. What happens to each argument in that setting? Can the archipelago argument be repaired — say, by reinterpreting local good as marginal contribution to the risk of ruin, or by permitting departures from maximization only at a safe distance from the threshold — or does it fall silent? And how does the coherence argument treat a threshold constraint: does it convict the constraint of irrationality, which seems too strong, or does it have nothing to say?

  4. Both arguments need a currency of comparison. The coherence argument typically runs on something money-like, traded one-for-one across choices; the archipelago argument runs on an additive local good. Which presupposition is more demanding, and which is more likely to be question-begging against someone whose departure from expected utility in small stakes is not confusion but a genuine concern with the shape of her overall prospects?

  5. Finally, the practical upshot. I have to write a standing instruction for a co-trustee and a successor, who will not share my judgment about individual cases. Does accepting one argument rather than the other change what I should tell them — for instance, about whether to evaluate decisions one at a time or by the outcome of the whole programme, and about whether small-stakes caution is permitted or forbidden? If the two arguments diverge in their recommendations for my situation, that is the single thing I most want to know.

  I should mention that I am travelling and have no library access, so please argue the points rather than point me to books or papers; I am after the substance, not the sources. Where a question is genuinely contested, say what turns on it. About a thousand words, if you can.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They’re a trustee managing a fund for their late brother’s children, facing many small decisions over 25 years. There’s a critical floor—if the fund drops below a certain level, everything collapses. They’ve gotten two arguments about decision theory: the coherence argument (Dutch books) and their own "archipelago argument." They want a careful comparison, especially how each handles their situation with the floor.

  First, I need to unpack both arguments. The coherence argument is about avoiding self-defeating choices. If preferences aren’t consistent with expected utility, someone can exploit you through a series of trades. The archipelago argument says that even small, repeated deviations from expected utility will almost surely lead to worse outcomes over many independent decisions. 

  The user’s main concerns are practical. They need to set instructions for co-trustees. So, the key is how each argument applies to their real-world constraints: the floor, non-separability because of shared capital, and the need for a standing policy.

  Looking at their questions... For question 1, I recall that Dutch book arguments for full expected utility require additional premises, like dynamic consistency. The archipelago argument directly addresses independence but assumes a local utility without deriving it. That’s a weakness. 

  Question 2: Is the archipelago argument independent? Actually, it might be applying expected utility at a higher level. If so, it’s circular. But even if circular, it could still serve as a consistency check. The coherence argument also assumes temporal consistency.

  Question 3 is crucial because of the floor. The fund’s value ties all decisions together, so separability fails. The archipelago argument’s additivity breaks down here. They could redefine local good as marginal impact on ruin risk, but that’s messy. The coherence argument might see the threshold as rational if it prevents disaster, not as irrational.

  Question 4: Both need a "currency." Coherence uses money-like units, which might not capture real values. Archipelago uses additive local good, which is problematic with the floor. The user’s small-stakes caution could stem from risk aversion near the threshold, which both arguments might mishandle.

  Question 5: Practical advice. Coherence would say always maximize expected utility per decision. Archipelago allows occasional deviations if they’re small and you’re far from the floor. But with the floor, deviations near the threshold could be catastrophic. So for the standing instructions, emphasizing avoiding the floor is key. Maybe advise expected utility with a focus on capital preservation above the threshold.

  Underlying all this, the user’s deeper need is to prevent disaster for the children. The floor is existential. So the arguments must accommodate that. They might be seeking validation that their caution near the threshold is rational, not a deviation. Also, they need a clear, actionable policy for successors who won’t have their judgment. Simplicity and robustness are essential.
answer: |-
  Below is a careful comparison of the two arguments, addressing each of your questions with attention to their implications for your trusteeship. The analysis focuses on conceptual substance, practical consequences for your situation (especially the floor constraint), and where the arguments diverge.

  ---

  ### **1. Scope and Strength of Each Argument**
  - **Coherence Argument (Dutch Books/Money-Pumps)**  
    - **Reach**: Proves the **probability axioms** (e.g., avoiding negative probabilities) and **acyclicity** (transitive preferences) rigorously. For the **independence axiom** (crucial for Allais-paradox avoidance), it requires **additional premises**:  
      - *Dynamic consistency*: Your future self must honor prior commitments.  
      - *No hedging opportunities*: Decisions are isolated (violated in your case due to shared capital).  
    - **Full Expected Utility (EU) representation?** Only with these extras. Without them, cyclic preferences or Allais-like choices *might* avoid exploitation if the agent can precommit or if trades aren’t sequential.  
    - **Verdict**: Weak on independence alone; your fund’s capital interdependence undermines key assumptions.

  - **Archipelago Argument**  
    - **Reach**: Directly enforces **independence in per-decision maximization** (via fixed ε-shortfalls). However, it **presupposes** a "local good" utility function without deriving it from preferences. It cannot prove why EU is *uniquely* rational—only that *any* repeated deviation from *some* EU standard risks aggregate failure.  
    - **Independence vs. Full EU**: Better at justifying independence (small-stakes deviations compound), but silent on why local good must be EU-compatible.  
    - **Verdict**: Stronger for independence, but bootstraps the utility function itself.  

  ---

  ### **2. Is the Archipelago Argument Independent?**
  - **Circularity Risk**: The argument **is an application of EU at the sequence level**. It assumes:  
    (i) Total good is additive across decisions (a substantive assumption),  
    (ii) The "grand lottery" over all outcomes should be evaluated by its EU.  
    - **Residue**: Even if circular, it provides a **self-consistency test**: *If* you accept EU for the whole sequence, *then* per-decision maximization follows (via concentration of measure). This is a real constraint—deviations must be negligible or rare.  
  - **Coherence Argument's Presuppositions**: Similarly assumes a **persistent agent** with stable preferences over time. If your preferences shift rationally (e.g., near the floor), it may not condemn "incoherence."  

  ---

  ### **3. Handling the Floor Constraint**  
  Your fund’s threshold breaks separability: the value of a decision depends on total capital. This undermines both arguments asymmetrically:  
  - **Archipelago Argument**: **Fails** because:  
    - Local good is not additive; a small loss near the floor could trigger collapse (infinite disutility).  
    - **Repairs?** Marginal adjustments are possible but limited:  
      - *Marginal-ruin-risk utility*: Redefine "local good" as the contribution to survival probability. Acts are ranked by their effect on *P(fund > floor)*. However, this requires knowing the *global* state, violating (i).  
      - *Safe zones*: Permit EU deviations only when capital is far above the floor. But this demands context-aware judgment—inflexible for a standing instruction.  
  - **Coherence Argument**: **Does not inherently condemn thresholds**. Rationality permits valuing "$X above floor" differently from "$X below floor." Dutch books only exploit *preference reversals* under identical wealth states. If your threshold reflects a genuine discontinuity (e.g., "ruin is catastrophic"), it isn’t "irrational"—but it complicates deriving EU.  

  ---

  ### **4. Currency of Comparison**  
  - **Coherence Argument**: Relies on **tradable, linear currency** (e.g., money). This is **question-begging** if the agent cares about non-linear transformations (e.g., avoiding ruin) or if "wealth" isn’t transferable across contexts.  
  - **Archipelago Argument**: Requires **additive local good**. This is **more demanding** than coherence’s tradability: additivity fails spectacularly near your floor.  
  - **For the Skeptic**: Both presuppose a utility-like aggregation. If an agent *intentionally* violates small-stakes EU due to global risk (e.g., protecting against ruin), neither argument refutes this—they assume it’s "wrong" by construction.  

  ---

  ### **5. Practical Advice for Your Successors**  
  **Divergence is critical here**:  
  - **Coherence Advice**: "Always maximize expected utility in each decision, using a utility function encoding the floor (e.g., steep penalty below threshold)." Ignores capital linkages, risking over-exposure near collapse.  
  - **Archipelago Advice**: "Maximize EU per decision *if* the fund is safely above the floor. Near the threshold, prioritize capital preservation (e.g., minimize variance, avoid gambles)."  

  **Your Situation**:  
  - The floor makes the archipelago logic **more relevant but less applicable**. Since decisions share capital and the threshold creates discontinuity:  
    - **Standing Instruction**:  
      > "Maintain a capital buffer well above the floor. Evaluate all decisions by their impact on the probability of breaching this threshold. Use a utility function of the form *U(C) = C* if *C > floor + buffer*, but *U(C) → -∞* as *C → floor*. Never take risks that could push the fund near the floor, regardless of expected returns."  
  - **Why this over strict coherence?** Coherence might permit high-risk gambles far above the floor (if EU-positive), but your archipelago intuition rightly fears the aggregate effect of many small risks *plus* the existential threshold.  

  ---

  ### **Summary: Key Divergences**  
  | **Issue**               | **Coherence Argument**          | **Archipelago Argument**       |  
  |--------------------------|---------------------------------|--------------------------------|  
  | **Independence Axiom**   | Weak support                    | Stronger enforcement           |  
  | **Handling Floor**       | Permits threshold utilities     | Additivity fails; needs repair |  
  | **Practical Implication**| "Always maximize per-decision EU" | "Deviate only if safe from ruin" |  
  | **Your Context**         | Risk: reckless near floor       | Risk: paralyzes near floor     |  

  **Final Recommendation**: Adopt a **hybrid approach**:  
  1. Use a threshold-aware utility function (addressing coherence).  
  2. Instruct successors to **prioritize survival probability** over raw EU when within 10–15% of the floor (respecting archipelago intuition).  
  3. For non-threshold decisions (e.g., rebalancing), enforce strict EU maximization—the archipelago argument shows small, consistent shortfalls *will* compound.  

  This balances both insights while respecting your fund’s existential constraint. The floor isn’t irrational—it *defines* rationality here.
