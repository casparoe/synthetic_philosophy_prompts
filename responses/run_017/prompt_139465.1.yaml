prompt: |-
  So I write novels — three published, none of which set the world on fire — and I've noticed a thing about how readers behave once an author turns out to have done something awful, and I can't find a word for it. I'm not asking the big question everyone shouts about, whether a bad person's work can still be good. I'm asking about the shape the whole business actually takes, which is wierd in a couple of specific ways.

  First: the damage people report is local, and what they do about it is total. A reader will tell you, quite precisely, that the sentences are still good, the structure still works, the jokes still land — and that the only thing that's changed is that a passage which used to read as consolation now reads as a sales pitch, or that the narrator now sounds like he's lying to them. That's one property out of a dozen. But then they stop reading. Not "I enjoy it less" — they stop, they take the book off the shelf, they won't press it on anyone, they'll say they can't read it at all. Nobody seems to notice the gap between the size of the flaw they've identified and the size of what they do about it. I got a miniature version of this myself: I said something stupid in an interview once, and a reader wrote that the last chapter of my second novel now hits different — while saying in the same email that it was her favourite book of that year.

  Second: it only runs one direction. You never hear that a beautiful novel pays anything off the debt; nobody thinks a great book makes the person less bad. But the person can void the book entirely. If this were one ledger with values being weighed against each other, that asymmetry is strange. If it's two separate ledgers, then the leak only goes one way. Except the readers who keep reading behave like it is one ledger — they send the royalties somewhere, or they name the crime in the same breath as the praise, every single time, like they're balancing.

  Third, and this is what makes me think it has edges worth mapping: it tracks subject matter. A novel about coercion by a writer who was coercive — total collapse, people talk as if the book itself had done something. A novel about deep-sea fishing by the same writer — readers shrug, or say they can still read that one. And when the writer has been dead a hundered years and the bad thing is in every biography, it stops biting: it reads as a quirk of the period rather than a defect in the thing.

  I've had "death of the author" thrown at me, but as far as I can tell that's a claim about what you're allowed to use when working out what a text means, and my readers mostly aren't disagreeing about meaning — they'd agree on what the book says, they just can't do the reading any more. Someone pointed me at psychology, contagion or magical thinking, badness treated like a stain that spreads by contact, which feels closer, except that's usually about objects you don't want to touch, and the entire value of a novel is in the experiencing of it, and my readers aren't saying the book is dirty, they're saying they can't do something with it. A friend who reads philosophy muttered about autonomists and moralists, which sounds like it's just the yes/no on the big question and not about this shape at all.

  So: does this configuration have a name — local flaw, global withdrawal, one-directional leak, sensitive to thematic proximity and to how long the author's been dead? If it does, I want to know which of those four features are essential to it and which are accidents, and I want the boundary cases: what else looks like this but isn't it? Plain boycotting? Losing trust in someone as a speaker? Finding out something biographical that makes a passage you'd misread suddenly make sense? And if there's no name, invent one and define it against those neighbours. Please don't just hand me a label — I want to know what the thing is, what it isn't, and where it stops.
reasoning: |-
  Okay, the user is a novelist who's observed a specific pattern in how readers react when an author is involved in a scandal. They've noticed three key aspects: readers identify a localized flaw but react globally by stopping reading entirely, the effect only flows from the author's actions to the work (not vice versa), and the impact depends on thematic relevance and the author's death. They want to know if this phenomenon has a name and its defining characteristics.

  First, I need to recall if there's existing terminology for this. The user mentioned "death of the author" (Barthes), but that's about interpretation, not emotional response. Contagion heuristic from psychology comes to mind—where immorality is seen as physically contagious. That fits the stain metaphor the user mentioned. But is there something more precise?

  Looking at the features: localized flaw leading to global rejection. That sounds like a specific cognitive bias. Maybe halo effect in reverse? Normally, halo effect is one positive trait influencing overall perception. Here, it's one negative trait (author's misdeed) spoiling the entire work. But the user says readers can still acknowledge the book's merits yet reject it wholly. That's not typical halo effect. 

  The one-directional flow is interesting. The artwork doesn't redeem the artist. That asymmetry suggests a moral contamination model. In cultural sociology, there's "symbolic pollution" (Douglas). But does it cover thematic sensitivity? The user notes that books thematically linked to the scandal are more affected. That aligns with "performative contradiction"—where the author's actions contradict their work's message, causing cognitive dissonance.

  The temporal aspect—author's death lessens the effect—points to "affective distance." Once the author isn't a present moral agent, the contamination fades. This is similar to how historical figures' misdeeds are contextualized.

  Combining these, the core seems to be "moral-contagion disenchantment." It's disenchantment (loss of magic) due to perceived moral contamination. The contagion heuristic explains the irreversible, staining quality. The thematic link intensifies it via cognitive dissonance. Death creates temporal distance, reducing affective response.

  Boundary cases: Boycotting is intentional protest, whereas this is involuntary aversion. The user's readers describe an inability to engage, not a political choice. Losing trust in a speaker is interpersonal, but here it's about consuming art. Biographical revelations causing reinterpretation are about meaning, whereas this is about visceral inability to experience the text.

  The user probably wants to understand this to navigate their own role as an author or to articulate the phenomenon in discussions. They might fear their work being judged beyond its content. Naming it gives them a tool to analyze these reactions without reducing them to simple boycotts or censorship.

  In conclusion, "moral-contagion disenchantment" captures the essence. The essential features are the contamination logic and affective withdrawal. Thematic sensitivity and temporal decay are common but not universal—e.g., if the crime is extreme, thematic links might not matter. Cases like enjoying Wagner despite his antisemitism show how context moderates the effect.
answer: |-
  This phenomenon you've dissected is remarkably precise, and while no single term perfectly encapsulates its full architecture, its core mechanism is **Moral-Contagion Disenchantment**, specifically operating through a **Performative Contradiction Lens**. Here's the breakdown:

  ### The Core Mechanism: Moral-Contagion Disenchantment
  1.  **Moral Contagion:** This draws from psychological concepts (contagion heuristic, magical thinking) where immorality is perceived as a contaminant – a "stain" – that irreversibly taints anything associated with the transgressor. It's not physical dirt, but *moral taint*.
  2.  **Disenchantment:** Max Weber used this term for the loss of magic/sacredness in the modern world. Here, it's the sudden, irreversible loss of the *experiential magic* of the text. The words haven't changed, but the reader's ability to *enchant* themselves with the text – to enter its world and experience its emotional/intellectual resonance – is broken. The book becomes a *dead object* to them.

  ### The Essential Features & How They Fit
  1.  **Local Flaw, Global Withdrawal:** This is the *hallmark* of disenchantment via contagion.
      *   **Essential:** The contaminant (author's action) renders the specific *reader-text relationship* irreparably damaged. The flaw isn't *in* the text's structure or sentences (which they still acknowledge), but in the *act of experiencing it* through the lens of the author's taint. The withdrawal is total because the *enchantment* is shattered – you can't partially un-see the stain or partially re-enchant yourself. It's like seeing the wires on a stage prop; the illusion is gone, the magic dissipated.
      *   *Why not just "boycotting"?* Boycotting is a conscious, political choice to withhold support. This is an *affective* and *experiential* shutdown. Your reader didn't *decide* to stop enjoying the last chapter; she *couldn't* experience it the same way. It's involuntary revulsion, not principled refusal.
  2.  **One-Directional Leak:** This is inherent to the *contagion* model.
      *   **Essential:** Moral taint flows *from* the agent (author) *to* the object (art). Art lacks agency; it cannot generate moral credit to offset the author's debt. It can only be contaminated. The readers who "balance" are trying (often awkwardly) to compartmentalize, acknowledging the taint exists *while* trying to salvage some disenchanted appreciation – they are *resisting* the full force of contagion, not proving it bidirectional.
  3.  **Sensitivity to Thematic Proximity:** This is the **Performative Contradiction Lens** intensifying the effect.
      *   **Common but Contextual:** When the author's transgression directly contradicts the apparent moral stance, theme, or subject matter of the work, the disenchantment is profound. It exposes hypocrisy or a hidden, ugly truth *within the act of reading itself*. The book *about* coercion by a coercive author isn't just tainted; it feels like an active lie, a manipulation embedded in the text's very purpose. The deep-sea fishing book is merely contaminated by association, its core purpose less violated. Thematic proximity makes the stain *visible* and *active* within the reading experience.
      *   *Essential?* Often, but not always. Extreme transgressions (e.g., severe violence, hate crimes) can cause global disenchantment regardless of theme – the taint is too overwhelming. Thematic proximity is a powerful *amplifier*, not always the sole trigger.
  4.  **Temporal Decay (Author's Death):** This relates to **Affective Distance**.
      *   **Common but not Essential:** Time transforms the living, morally accountable agent into a historical figure. The affective charge of their transgression diminishes. The "stain" becomes historical context, a fact to be *considered* intellectually rather than an active contaminant *felt* during reading. The work regains some autonomy as the author recedes. However, for very recent or particularly heinous acts linked directly to the work, the disenchantment can persist long after death.

  ### Boundary Cases: What Isn't This?
  1.  **Simple Boycotting:** As above – boycott is active choice based on principle/ethics to deny support. This is affective collapse of the reading experience itself, regardless of purchase/support decisions.
  2.  **Loss of Trust in a Speaker (e.g., Journalist, Politician):** This shares the trust-breaking element. The key difference is *purpose*. We read non-fiction for factual claims/arguments directly tied to the author's credibility. Fiction's value is in imaginative experience; the disenchantment here breaks the *aesthetic* and *emotional* engagement, not (primarily) factual trust. Your readers still agree on the book's *meaning* – they just can't *inhabit* it.
  3.  **Biographical Revelation Causing Reinterpretation:** This is hermeneutic – changing the *meaning* of the text ("Ah, *that's* what that passage *really* meant!"). Your readers aren't changing their interpretation of the *words*; they're saying the *experience* of those words is now poisoned. The meaning is stable, the enchantment is gone.
  4.  **"Death of the Author" (Barthes):** This is a theoretical stance arguing *against* using authorial intent/biography as the primary tool for interpreting meaning. Your readers are doing something profoundly different: they are reporting an *experiential crisis* triggered by biography, not necessarily changing their interpretation *of the text's meaning*. They'd likely agree Barthes is "right" intellectually, while feeling powerless against the affective disenchantment.
  5.  **Finding the Work Objectively Bad Due to New Context:** If the work was *always* flawed but the flaw was hidden, that's discovery, not disenchantment. Your readers acknowledge the craft remains objectively sound.

  ### The Name & Its Definition
  **Moral-Contagion Disenchantment (through a Performative Contradiction Lens):** The irreversible collapse of a reader's capacity to experientially engage with a work of art due to the perceived moral contamination flowing from the artist's actions, where the artist functions as the source of an irredeemable taint. This disenchantment is characterized by:
  1.  Acknowledgment of the work's formal merits concurrent with a total inability to access its experiential value.
  2.  The unidirectional flow of taint (artist → art).
  3.  Significant amplification when the artist's transgression creates a performative contradiction with the work's themes or apparent moral stance.
  4.  Gradual mitigation through temporal/affective distance from the living artist.

  ### Why This Fits
  *   **Moral-Contagion:** Captures the core "stain" metaphor, the one-way flow, the sense of pollution.
  *   **Disenchantment:** Precisely describes the loss of experiential magic, the transformation of the live text into a dead object for that reader.
  *   **(through a Performative Contradiction Lens):** Explains the critical role of thematic proximity in intensifying the effect, making the stain visible and active *within* the reading experience.

  You've mapped a profound and unsettling facet of how art is consumed. It's not purely rational ethics, nor pure aesthetics, but the messy, visceral intersection where the perceived morality of the creator fatally disrupts the fragile magic of the created world for the reader. The disenchantment is total because the spell is broken, and no amount of technical skill can recast it once the sorcerer is revealed as morally corrupt.
