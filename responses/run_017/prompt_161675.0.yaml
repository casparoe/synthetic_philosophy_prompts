  First, I'll examine each of the five test cases to understand what makes them challenging:
  1. Smooth case challenges any threshold-dependent arguments
  2. Lumpy case is where probabilistic reasoning shines
  3. Sunk supply eliminates upstream consequences
  4. Screened off introduces substitution effects
  5. Invisible removes social influence pathways

  Now for the replies - I'll assess each against all five cases:
  (a) Expected difference works well in Lumpy (calculable probabilities) and Smooth (micro-effects), but fails completely in Screened Off (no net effect) and Sunk Supply (no counterfactual change). Its invisibility weakness in case 5 is minor.

  (b) Threshold lottery is strong in Lumpy scenarios but becomes hand-wavey in Smooth cases with no thresholds. It also can't handle Screened Off scenarios.

  (c) Group membership is interesting - it bypasses individual causation entirely. Works everywhere except where group boundaries are fuzzy, but may feel unsatisfying in Invisible cases since it doesn't require actual harm contribution.

  (d) Practice participation is compelling as it shifts focus to long-term patterns. Weak only in Sunk Supply where there's no practice-building potential.

  (e) Expression/integrity is robust across all cases since it doesn't care about outcomes. However, it's philosophically narrow - only appeals to deontologists.

  (f) Universalization is deeply flawed due to the conditional fallacy. Only works if misinterpreted, which isn't honest.

  (g) No-replacement counterfactual is crucial for real-world accuracy, especially in Screened Off and Sunk Supply cases. But it concedes the inefficacy point rather than solving it.

  (h) Observability amplifier works well except in Invisible cases where it completely collapses. Overestimates social cascades in practice.

  (i) Capacity building is versatile and future-oriented. Only fails in terminal actions with no future.

  (j) Consequentialism rejection is the nuclear option - works everywhere but provides zero practical guidance.

  (k) De minimis is important for realism but undermines the entire project.

  For collapsing similar moves: (c) Group and (e) Expression are distinct - one is collective responsibility, the other personal ethics. (d) Practice and (i) Capacity are complementary but separable; practice is about patterns, capacity is about infrastructure.

  Missing case suggestion: Terminal Participation - where the practice is ending forever after your action. This would particularly weaken (d) and (i).

  The tier sorting will be:
  A-tier (own section) for replies that offer unique, robust insights across most cases: (b), (d), (e), (i)
  B-tier (paragraph) for useful but limited arguments: (a), (c), (g), (h)
  C-tier (mention) for flawed or non-actionable replies: (f), (j), (k)

  The added Terminal Participation case would most damage (d) Practice participation by removing its long-term justification, dropping it to B-tier. This shows how context-dependent these arguments are.
answer: |-
  Here's the brutal scoring and tiering you asked for, based strictly on coverage × robustness against your cases. I've weighted robustness heavily—if a reply collapses entirely in even one case, it gets hammered. Scores are out of 100, with 50 being "barely passes" and below 30 being "useless in practice".  

  ### **Tier A: Own Section (Core workhorses)**  
  **(b) Threshold Lottery: 85**  
  *Why*: Covers Smooth (if you squint at micro-thresholds), dominates Lumpy (its home turf), and partially handles Sunk Supply/Screened Off (if thresholds exist upstream). Only truly fails Invisible (no cascade). Robust: even in worst cases (e.g., Smooth), it forces probabilistic humility—you *never* know you're *not* at a threshold.  
  **(d) Practice Participation: 80**  
  *Why*: Shines in Screened Off, Lumpy, and Invisible (habits are personal). Struggles only in Sunk Supply (if it’s a one-off). Robust: frames acts as *enabling* future efficacy, dodging "did this specific act matter?"  
  **(e) Expression/Integrity: 75**  
  *Why*: Uniquely bulletproof—works identically in **all 5 cases**. Robustness: 100%. Coverage: limited to deontologists/virtue ethicists. Expression collapses in Invisible, but integrity holds ("you still *know*").  
  **(i) Capacity Building: 75**  
  *Why*: Crucial for Screened Off/Sunk Supply (invests in alternatives) and Invisible (skills are internal). Weak only if the *entire system* is terminal (no future to build for). Robust: redirects focus to scalable leverage points.  

  ### **Tier B: Paragraph + Shrug (Useful but flawed)**  
  **(a) Expected Difference: 60**  
  *Why*: Strong in Lumpy/Smooth (calculable expectations), but **totally collapses in Screened Off/Sunk Supply** (expected difference = 0). Coverage narrows to threshold-adjacent cases. Lifetime sums feel like cheating without practice/capacity arguments.  
  **(c) Group Membership: 55**  
  *Why*: Handles Smooth/Lumpy/Screened Off by shifting blame upstream. Fails Sunk Supply (no group causality) and feels hollow in Invisible (if no one knows, why does membership matter?). Robustness issue: dissolves into "you're complicit, period"—no *actionable* guidance.  
  **(g) No-Replacement Counterfactual: 50**  
  *Why*: Vital for exposing delusions in Screened Off/Sunk Supply, but **concedes the inefficacy point**. Just relocates the problem ("okay, so where *should* I push?"). Does nothing for Invisible/Lumpy. Necessary footnote, not a solution.  
  **(h) Observability Amplifier: 45**  
  *Why*: Powerful in public acts (voting, protests), but **fragile**—utterly dies in Invisible. Overstates cascades (most acts don’t ripple). Coverage limited to socially visible harms.  

  ### **Tier C: Mention and Move On (Mostly dead weight)**  
  **(f) Universalisation: 25**  
  *Why*: **Objection destroys it**. "If everyone did it" is irrelevant; "if everyone *else* did it" is the real conditional, which is weak tea. Only "works" in Smooth if you ignore substitution. Useless in Screened Off/Sunk Supply.  
  **(j) Efficacy Isn’t Relevant: 20**  
  *Why*: Technically robust (works in all cases), but **does zero work**—just declares the question invalid. No guidance, no argument. Useful only to signal "I’m a deontologist".  
  **(k) De Minimis: 10**  
  *Why*: **Self-sabotaging**. If "no reason below threshold" is true, most replies *are* hand-waving. But it offers no threshold *defense*, dying in Smooth/Lumpy. Only use: highlighting others' smuggling.  

  ---

  ### **Collapsing Moves**  
  - **(d) Practice Participation** and **(i) Capacity Building** are cousins but **not identical**. Practice is about *patterns* (e.g., voting culture); capacity is about *infrastructure* (e.g., keeping a vegan cafe open). Both deserve sections—they address different "future paths".  
  - **(e) Expression/Integrity** and **(c) Group Membership** are distinct: one is about personal identity, the other about collective liability. Don’t merge.  

  ---

  ### **Missing Case: Terminal Participation**  
  **"You’re the last actor—the practice dies with you (no future voters, no next generation, the coalition disbands)."**  
  - **Why it shakes the ranking**: Obliterates (d) Practice and (i) Capacity (no future to build for). Weakens (a) Expected Difference (no lifetime sum). Makes (e) Expression the *only* A-tier survivor.  
  - **Resulting tier changes**:  
    - (d) Practice drops to **B-tier** (still works if habits matter intrinsically, but weaker).  
    - (i) Capacity drops to **C-tier** (no future options).  
    - (e) Expression remains **A-tier** (integrity doesn’t care about the future).  
    - (k) De Minimis gains slight ground (if the future’s dead, maybe your act *is* negligible).  

  ### **Brutal Truth**  
  Most replies work only in *some* cases. **Threshold Lottery**, **Practice Participation**, and **Expression** do the heaviest lifting. **Capacity Building** is underrated but situational. The rest are footnotes or mirrors showing why the problem is hard. If you want a brutal takeaway: without thresholds (real or probabilistic) or a theory of integrity, individual acts *are* often futile—and we rely on **narratives of practice/group ID** to escape that despair.
