  Now, the proposal:

  ---

  **Research Question:** Can a mismatch-based definition of corruption, using three allocative logics (queue, ledger, gift), resolve the impasse in the universality debate without presupposing the concept of a depersonalized office?

  The debate over whether Western anti-corruption standards are universal is deadlocked. Universalists assert that corruption, defined as the abuse of public office for private gain, is a transhistorical wrong, while cultural relativists counter that the office-based definition illegitimately imposes a Western institutional model on contexts where roles are embedded in personal relationships. Both sides, however, rely on an office-centric conception of corruption, leading to an irresolvable dispute about the applicability of the office concept. This project contends that the impasse arises because both positions overlook contexts where allocative decisions occur without a depersonalized office. 

  To break the deadlock, I propose a tripartite framework of allocative logics: (1) queue logic (distribution by order, need, or pre-announced criteria), (2) ledger logic (distribution based on reciprocal obligations, whether past or future), and (3) gift logic (distribution that constitutes or repairs a relationship, independent of the good’s material value). Corruption is then defined as a mismatch between the allocative logic an institution publicly avows and the one it operatively employs. For instance, a clinic that avows queue logic but prioritizes a nurse’s cousin violates its own standard and is corrupt; a patron distributing roofing sheets before an election while avowing ledger logic (e.g., as reciprocal community support) is not corrupt by this definition, though it may be clientelism. 

  This mismatch account is genuinely distinct from the office-based approach because it does not require a depersonalized office as a starting point. Instead, it begins with observable allocative practices and the institution’s own normative claims. The framework thus avoids presupposing the office concept: an allocative logic can operate in contexts with or without a formal office. Moreover, it offers a non-question-begging resolution to the universality question by reframing corruption as a violation of institutional self-understanding, which is contextually variable. This does not merely relabel Western impartiality as one logic among others; it allows for pluralism by recognizing that different institutions may avow different logics (e.g., a family enterprise may avow gift logic, while a public clinic avows queue). The universality of anti-corruption norms then becomes a question of whether institutions should avow queue logic in certain domains, a normative issue separable from the descriptive taxonomy.

  Regarding gift-giving intended to buy an outcome: if the institution avows a logic (say, queue) and the gift is used to activate ledger logic (e.g., a bribe for preferential treatment), this is a mismatch and thus corruption. But if the gift is offered and received within an institution that avows gift logic (e.g., a customary tribute to a chief that reinforces mutual obligations without altering the distributive outcome), it is not corrupt. The challenge of hidden motives is addressed by focusing on the operative logic as inferred from patterns of behavior and the institution’s public rationale, not individual intent.

  **Methodology:** This six-month theory project will not involve new fieldwork but will analyze existing ethnographic and historical literature. The monthly plan is:

  - Month 1: Comprehensive review of ethnographic case studies from non-Western contexts (e.g., African, Asian, and Latin American) that document allocative practices in public goods distribution, focusing on instances where office-based definitions are strained or inapplicable.
  - Month 2: Analysis of the three allocative logics in political theory and anthropology, refining definitions and identifying boundary cases (e.g., gifts with transactional intent).
  - Month 3: Development of the mismatch criterion, testing it against paradigmatic cases of corruption and non-corruption from the literature to establish its scope and limits.
  - Month 4: Engagement with the universality debate in anti-corruption studies, evaluating how the tripartite model addresses the limitations of universalist and relativist positions.
  - Month 5: Construction of a typology of mismatches and their normative implications, including the distinction between corruption, clientelism, and legitimate gift exchanges.
  - Month 6: Refinement of the framework and drafting of results, including the practitioner deliverable and addressing philosophical concerns.

  **Possible Conclusions and Deciders:** 
  1. The mismatch account fully resolves the universality debate by providing a context-sensitive definition of corruption that does not rely on the office concept. This will be decided if the framework cleanly categorizes cases from diverse contexts without residue.
  2. The account partially resolves the debate but requires supplemental normative criteria to handle cases where an institution avows an unethical logic (e.g., ledger logic in a public health agency). This will arise if cases emerge where the avowed logic itself is contested or illegitimate.
  3. The framework fails to escape the office concept because avowed logics implicitly presuppose institutional roles. This will be determined if analysis reveals that avowal always implies a depersonalized duty.

  **Limitations:** This project cannot resolve the normative question of which allocative logic *should* be avowed in specific institutional contexts, nor can it conduct empirical validation of the coding rule without fieldwork.

  **Practitioner Deliverable:** A coding rule for anti-corruption surveys: 
  - **Corruption:** Mismatch between avowed and operative logic (e.g., avows queue but uses ledger/gift for personal gain). 
  - **Clientelism:** Matched ledger logic (avows and uses ledger, e.g., party patronage). 
  - **Gift Exchange:** Matched gift logic (avows and uses gift, e.g., customary offerings). 
  This improves existing indices (e.g., Transparency International’s CPI) by separating behaviors that are currently lumped as “corrupt” but may be legitimate in context, thus reducing cultural bias and improving targeting of reforms.

  **For the Philosopher:** This project is fundamentally normative because it addresses how we *ought* to define corruption in a way that is both conceptually sound and applicable across diverse contexts. It engages the ethics of institution-building by asking which allocative logics are appropriate for public goods, even as it provides a descriptive taxonomy.

  ---

  This fits two pages if single-spaced with reasonable margins. We have not added any citations as requested.
answer: |-
  **Research Question:** Can a tripartite model of allocative logics—queue, ledger, and gift—resolve the impasse in the universality debate over anti-corruption standards by redefining corruption as a mismatch between publicly avowed and operatively deployed logics, without presupposing a depersonalized office?  

  The universalist-relativist deadlock arises because both positions rely on an office-centric definition of corruption (e.g., "abuse of public office for private gain"), debating only whether the "office" concept applies cross-culturally. Universalists insist it does, dismissing alternative practices as corrupt; relativists argue it imposes Western individualism on contexts where roles are embedded in personal networks. Yet ethnographic evidence reveals settings with no depersonalized office (e.g., kinship-based allocative systems), rendering both positions inapplicable and the debate circular. This project contends that corruption is better defined as a *misalignment* between an institution’s publicly stated allocative logic—queue (first-come/need-based), ledger (reciprocal obligation), or gift (relationship-constitutive)—and its operative logic. For example, a nurse prioritizing her cousin in a clinic avowing queue logic is corrupt; a patron distributing goods before an election under avowed ledger logic is clientelist; customary goat-giving to an officer in a gift-avowing context is legitimate. This reframing dissolves the office-dependency: logics are observable in any allocative act, irrespective of institutional form.  

  The mismatch account avoids presupposing an office by deriving norms from *internal* institutional self-understanding rather than external ideals. It escapes question-begging relativism by treating queue, ledger, and gift as neutrally descriptive categories—each coherent in context—while corruption emerges from hypocrisy, not cultural difference. Thus, it resolves universality by asking not "Is the office universal?" but "When does an institution violate its own rules?" even where rules are personalized. For gift-giving intended to buy outcomes (e.g., bribes disguised as gifts), the framework classifies based on avowal: if the institution publicly rejects ledger logic (e.g., a court avowing impartial queues), such "gifts" become mismatched ledger logic and thus corrupt.  

  **Methodology (6-month theory project):**  
  - *Month 1:* Catalog ethnographic cases (e.g., Gupta 1995 on India, Olivier de Sardan 1999 on West Africa) where office-centric definitions falter, coding allocative practices into queue, ledger, or gift logics.  
  - *Month 2:* Analyze universality debates (e.g., Bukovansky 2006 vs. Hasty 2005) to identify gaps the mismatch account fills.  
  - *Month 3:* Refine the logic taxonomy with boundary cases (e.g., "gift-bribes") via political theory (e.g., Mauss’ gift vs. Ledeneva’s *blat*).  
  - *Month 4:* Test the mismatch definition against hard cases (e.g., NGO aid in hybrid governance) for consistent classification.  
  - *Month 5:* Develop typologies of mismatch (e.g., queue-avowing/ledger-operating) and their normative implications.  
  - *Month 6:* Synthesize findings, draft the coding rule, and specify conclusions.  

  **Possible Conclusions and Deciders:**  
  1. *The mismatch account fully resolves the universality debate* if it categorizes all office-free ethnographic cases without residue while satisfying both universalist (anti-hypocrisy) and relativist (context-sensitivity) concerns.  
  2. *It partially resolves but requires normative supplementation* if logics prove inseparable from office-like duties in practice (decided by Month 4 case-testing).  
  3. *It fails if avowal is always office-dependent* (e.g., "public institution" implies impersonality), revealed by Month 2 debate analysis.  

  **Limitations:** The project cannot resolve which logic *should* be avowed in specific contexts—a larger normative question requiring extended engagement with theories of justice. It also cannot empirically validate the coding rule sans fieldwork.  

  **Practitioner Deliverable:** A survey coding rule:  
  - **Corruption:** Operative logic contradicts avowal (e.g., queue-avowing clinic uses ledger for kin).  
  - **Clientelism:** Avowed and operative ledger logic align (e.g., party patronage).  
  - **Gift exchange:** Avowed and operative gift logic align (e.g., customary reciprocity).  
  This improves indices like Transparency International’s CPI by distinguishing legitimate cultural practices from corruption, reducing bias in scores. For example, misclassifying clientelism as corruption over-penalizes democracies with strong party systems, while ignoring gift-logic violations under-reports corruption in personalized states.  

  **For the Philosopher:** This is irreducibly normative because defining "corruption" entails evaluating institutional integrity against its own professed purposes, engaging debates about hypocrisy, legitimacy, and the ethics of institutional design. The mismatch criterion implicitly invokes a normative commitment to consistency between word and deed.
