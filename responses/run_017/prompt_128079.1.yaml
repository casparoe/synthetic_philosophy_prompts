  The chemist makes an important distinction from their lab experience: between "load-bearing" parts of theories (the mathematical core used for predictions) and "scenery" (the explanatory narratives). They noticed that in dead theories, it's usually the scenery that gets discarded, not the predictive core. This makes them wonder which part the miracle argument actually protects.

  I need to unpack the miracle argument into precise claims. The user wants them labeled R1, R2 etc., with assessments of whether each is trivial, defensible, or false; whether it stops pessimistic induction; and specific answers about "miracle," "roughly true," coverage of scenery vs load-bearing parts, and whether it's just pragmatic.

  Key angles to cover:
  - What "roughly true" means (reference? structure? approximate truth?)
  - Whether the argument applies equally to scenery
  - If "miracle" implies something supernatural or just "best explanation"
  - How each version handles the load-bearing/scenery distinction

  The distinction they describe sounds like structural realism (core equations survive) or instrumentalism vs realism. I should note that but focus on the analysis.

  For the final answer, I need to pick the one reading that's defensible AND strong enough to stop pessimistic induction including the scenery point. Since scenery often fails, I suspect only versions focusing on structural aspects will work. The chemist's insight that load-bearing parts persist while scenery changes is crucial here - that's exactly what structural realism claims.

  The most defensible version will likely be something like: "The mathematical/structural core of successful theories latches onto reality (reference or structure), and this core persists through theory changes." This accounts for why science progresses despite discarded ontologies. It directly counters pessimistic induction by showing why dead theories' failures don't imply current ones will completely fail - their predictive cores often get incorporated.

  I'll structure this as a clear menu with labels, then end with \answer{RX} as requested. Need to be precise about which reading actually saves the load-bearing parts while acknowledging the scenery is dispensable.
answer: |-
  ### Menu of Precise Claims for the "Miracle" Line

  **R1: Literal Ontological Truth**  
  *Claim*: Every part of a successful scientific theory (including "scenery") corresponds directly to reality.  
  - Trivial? No.  
  - Defensible? False. History shows theories retain false ontological commitments (e.g., phlogiston as substance).  
  - Stops pessimistic induction? No. The induction explicitly targets ontology (e.g., "electrons are like phlogiston").  

  **R2: Approximate Empirical Adequacy**  
  *Claim*: Successful theories are "roughly true" only in predicting observable outcomes (e.g., spectra, reaction rates).  
  - Trivial? Yes (equivalent to "science works because it works").  
  - Defensible? True but vacuous. Doesn’t address *why* predictions succeed.  
  - Stops pessimistic induction? No. Pessimistic induction accepts predictive success but denies truth. Ignores scenery entirely.  

  **R3: Structural Preservation**  
  *Claim*: The mathematical/logical *structure* of load-bearing equations (e.g., Hamiltonian operators, wave equations) maps real relations, even if ontologies (scenery) are wrong.  
  - Trivial? No.  
  - Defensible? Yes (e.g., Poisson equations survived caloric’s death; Maxwell’s equations survived ether).  
  - Stops pessimistic induction? Yes. Pessimistic induction targets *ontology* (scenery), but structural core persists. Load-bearing parts latch onto structure, not "things."  

  **R4: Referential Success**  
  *Claim*: Central terms (e.g., "electron") refer to real entities, even if descriptions are imperfect.  
  - Trivial? No.  
  - Defensible? Partially. Terms often refer ambiguously (e.g., "gene" shifted from Mendelian unit to DNA segment).  
  - Stops pessimistic induction? Weakly. Fails for abandoned referents (e.g., "caloric fluid"). Doesn’t protect scenery.  

  **R5: Pragmatic Necessity**  
  *Claim*: Assuming theories are "roughly true" is the only viable strategy for scientific practice (e.g., Monday’s assumption).  
  - Trivial? Yes (descriptive of scientific behavior).  
  - Defensible? True but instrumental. Avoids truth claims entirely.  
  - Stops pessimistic induction? No. Pessimistic induction is about truth, not utility.  

  **R6: Best Explanation**  
  *Claim*: The success of science is best explained by theories capturing reality (load-bearing + scenery). "Miracle" means no better alternative exists.  
  - Trivial? No.  
  - Defensible? False for scenery (e.g., humoral theory "worked" but misidentified causes). Load-bearing core might hold.  
  - Stops pessimistic induction? No. Overreaches by including scenery.  

  ---

  ### Specific Queries Addressed  
  - **"Miracle"**: Smuggles in a *best-explanation* demand (R6), not supernaturalism. Weak if alternatives exist (e.g., structuralism).  
  - **"Roughly true"**: Ambiguous. R1/R6 mean full ontology; R3 means structure; R4 means reference; R2/R5 avoid truth.  
  - **Coverage of scenery**: R1/R6 demand it (indefensible); R3/R4 partially exclude it (defensible).  
  - **"Monday’s assumption"**: Captured by R5 (trivial pragmatism).  

  ---

  ### Your Distinction’s Name  
  *Instrumentalism vs. Realism* (or *Structural Realism* for R3).  

  \answer{R3}
