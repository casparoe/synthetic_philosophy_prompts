prompt: |-
  I'm a journalist — I cover science and ideas, mostly — and I keep recieving the same shape of tip over and over and I have no word for it.

  Latest three, roughly:

  - A public-health source tells me, "if it's the vaccine-resistant strain, it's about 80% likely the outbreak peaks before the holidays." Nobody has any idea whether it's the resistant strain. Half my newsroom read that and came away more confident about the holidays. A couple of them also came away more confident that it *is* the resistant strain, which the source said nothing about at all.
  - An engineer: "if the failure started in the cooling loop, nine times out of ten you find debris in the second filter." Same thing — people start acting as if the cooling loop is the likely culprit, on the strength of a sentence that was explicitly conditional on it being the culprit.
  - A pollster: "if turnout is under 40%, the challenger probably takes it." Now the campaign is behaving as if low turnout is expected.

  So the shape is: you get handed an if–then, you have no independent read at all on the if-part, and somehow your confidence in the then-part goes up — and sometimes your confidence in the if-part goes up too, which feels like it has to be a mistake, since the source never said anything about the if-part one way or the other.

  I don't just want a label, and please don't tell me it's the law of total probability: that's the arithmetic you do *after* you've decided whether the if-part is allowed to move, and the whole argument in our Slack channel is about whether it's allowed to move. I also got pointed at Jeffrey conditionalization, but as far as I could tell that's the case where you learn a straight probability rather than an if–then, so it's adjacent and not it.

  What I actually want: is there an established concept, or a named puzzle, for this shape? Is there a seperate name for the disputed bit — the question of whether the if-part stays put? Is the version where the source *chose* which if–then to hand me (she had a spreadsheet full of them and gave me the alarming one) the same problem or a different one? And what about when two sources give me if–thens with complementary ifs — "if it's the resistant strain, 80%; if it isn't, 40%" — which seems to pin down the then-part without anybody ever saying anything unconditional: same thing again, or its own thing?

  If there's no name, tell me that straight and coin one: define it, and give me the boundary cases — what has to be true for a case to count as one of these, and what's the nearest miss that isn't.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a journalist who keeps encountering a specific logical pitfall in their sources' statements. The pattern is that someone gives a conditional statement (if A, then probably B), and people misinterpret it, increasing their confidence in both B and sometimes A, even though the source didn't say anything about A being true. 

  First, I need to recall related concepts. The base rate fallacy comes to mind—people ignoring prior probabilities. But here, it's more about misinterpreting conditionals. The inverse fallacy seems relevant; that's when people confuse P(B|A) with P(A|B). In the first example, the source says if it's the resistant strain (A), then 80% chance outbreak peaks (B). But colleagues think B is more likely, or even that A is true. That's classic inverse fallacy: conflating P(peak|resistant) with P(resistant|peak), which isn't stated.

  Then there's the prosecutor's fallacy, which is a real-world application of this confusion, often in legal contexts. But the user's cases are scientific/public policy, so the core fallacy is the same even if the domain differs. 

  The user mentioned the law of total probability and Jeffrey conditionalization. They're right that those don't directly apply here. The issue isn't about updating probabilities correctly but misapplying the conditional from the start. So emphasizing the inverse fallacy makes sense.

  The user also asked about cases where the source chooses which conditional to present. That adds a layer of selection bias. If the source picks the most alarming conditional, it might mislead even more. I should note that as a variant where the fallacy combines with biased evidence presentation.

  For complementary conditionals (if A, 80% B; if not A, 40% B), that actually allows calculating P(B) using total probability, but only if you have P(A). Without P(A), people might still jump to conclusions. So that's a different scenario where the fallacy might not apply, but misestimation of P(A) could cause errors.

  Boundaries: the key elements are a conditional probability given without the prior, leading to unjustified confidence in the consequent or antecedent. Nearest misses might be when someone has independent evidence for A, so updating on B isn't fallacious, but here there's no such evidence.

  The user needs a clear term to use in their newsroom. "Inverse fallacy" is academic; "conditional probability misdirection" is more descriptive. They might also appreciate "consequent creep" for when confidence in B increases and "antecedent slide" for when A seems more likely. Highlighting these helps journalists spot the fallacy quickly.

  Underlying needs: The user wants to prevent misinformation in their reporting. They need tools to explain these errors to colleagues and sources, ensuring accurate interpretation of data. Providing examples and clear definitions will help them educate their team and improve their science communication.
answer: |-
  You've nailed a pervasive and insidious reasoning trap that absolutely deserves a name. Let's break it down:

  1.  **The Core Fallacy:** This is most precisely called the **Confusion of the Inverse** or the **Inverse Fallacy**. It occurs when people mistakenly equate the probability of `A given B` (`P(A|B)`) with the probability of `B given A` (`P(B|A)`). In your examples:
      *   Source gave `P(Peak | Resistant Strain) = 0.8`.
      *   Newsroom inferred `P(Resistant Strain | Peak)` is high or `P(Peak)` is higher than justified, and even `P(Resistant Strain)` increased!
      *   The source did **not** give `P(Resistant Strain | Peak)` or `P(Resistant Strain)` or `P(Peak)`. They only gave one conditional probability pointing in *one* direction.

  2.  **Why the Law of Total Probability Arguments Fail in Slack:** You're right. The law of total probability (`P(B) = P(B|A)*P(A) + P(B|~A)*P(~A)`) is the antidote, *but only if you have estimates for P(A) and P(B|~A)*. The fallacy happens precisely because the audience, lacking any independent read on `P(A)` (and often `P(B|~A)`), *ignores the need for it* and treats the provided `P(B|A)` as if it directly informs `P(B)` or even `P(A)`. They act as if `P(A)` is 1 or much higher than it actually is.

  3.  **The Disputed Bit (Keeping the If-Part Fixed):** The core requirement for the fallacy to occur is that the audience **lacks a justified prior probability for the antecedent (A)** or fails to use it. The "disputed bit" is the **Prior Probability (`P(A)`)**. The fallacy involves either:
      *   **Ignoring the Prior:** Acting as if `P(B|A)` directly informs `P(B)` without considering `P(A)`.
      *   **Illegitimately Updating the Prior:** Allowing the observation of the conditional statement `P(B|A)=X` to directly increase `P(A)` without any evidence *for* A itself. This is the most egregious part. Learning "If A, then likely B" *should not*, on its own, make you think A is more likely. It *only* tells you how B relates to A.

  4.  **The Source Choosing the If-Then (Selection Bias):** This is a **critical aggravating factor**, turning the simple fallacy into **Motivated Conditional Selection** or **Salient Conditional Highlighting**. It's the same core fallacy (confusing/inverting the conditional), but the source exploits it by choosing the most alarming, newsworthy, or agenda-supporting `A` to condition on. The audience is even *more* likely to fall for the inverse fallacy because the chosen `A` is salient and the `P(B|A)` is dramatic. The source isn't lying about `P(B|A)`, but they are strategically selecting *which* `A` to reveal it for, knowing the audience will misinterpret it as evidence for `B` or even for `A` itself.

  5.  **Two Sources with Complementary Ifs:** This is **different**. If you get both:
      *   "If A, then P(B) = X"
      *   "If ~A, then P(B) = Y" (where ~A is "not A")
      ...then you *can* calculate `P(B)` *if you know P(A)*: `P(B) = X * P(A) + Y * (1 - P(A))`.
      *   **The Problem Persists:** The *fallacy* occurs if the audience *still* misinterprets the individual conditionals. For example, hearing "If A, then P(B)=0.8" might still make them think A is more likely, even before considering P(A) or the other conditional. The core confusion of the inverse can still happen for each statement individually.
      *   **The New Trap:** The *new* trap here is **ignoring the base rate `P(A)`** when combining the two conditionals. You have the formula for `P(B)`, but without `P(A)`, you're stuck. People might assume `P(A)=0.5` without justification, or latch onto the more extreme conditional (if X is higher than Y, they might act as if `P(B)` is closer to X than it should be if `P(A)` is actually low).

  **Defining the Phenomenon & Boundaries**

  *   **Name:** **Conditional Probability Misdirection** (emphasizes the mechanism) or **Inverse Fallacy Cascade** (emphasizes the error and its spread). For internal newsroom use, "**The If-Then Confidence Trap**" is descriptive.
  *   **Core Definition:** **The phenomenon where hearing a conditional probability `P(B|A)` (especially a salient or extreme one), in the absence of a justified prior probability for `P(A)` (and often `P(B|~A)`), leads an audience to:**
      1.  **Illegitimately increase their confidence in the consequent (`B`). (Consequent Creep)**
      2.  **Often, illegitimately increase their confidence in the antecedent (`A`). (Antecedent Slide)**
  *   **Key Requirements (Boundaries):**
      1.  **Conditional Input:** The information received is explicitly or implicitly a conditional probability or likelihood (`P(B|A)` or `P(Evidence | Hypothesis)`).
      2.  **Uncertain Antecedent:** The audience lacks strong, independent evidence establishing a reliable prior probability `P(A)`.
      3.  **Misplaced Confidence Shift:** Confidence in `B` (Consequent Creep) and/or `A` (Antecedent Slide) demonstrably increases *based primarily or solely* on the conditional statement.
      4.  **Source Agnostic (Initially):** The fallacy occurs regardless of the source's intent. (The source *choosing* which `A` to present is an aggravating factor, not the core requirement).
  *   **Nearest Misses (What Doesn't Count):**
      *   **Learning Unconditional `P(B)`:** If the source directly says "P(Peak) = 60%", increasing confidence in `B` is justified. (Adjacent to Jeffrey conditionalization, as you noted).
      *   **Learning Evidence About `A`:** If the source provides *direct evidence relevant to `A`* (e.g., "We found genetic markers suggesting it *is* the resistant strain"), then updating `P(A)` and subsequently `P(B)` is justified via the law of total probability. The fallacy is updating `P(A)` based *only* on hearing `P(B|A)`.
      *   **Bayesian Updating with a Prior:** If the audience *has and uses* a prior `P(A)`, and updates `P(B)` correctly using `P(B|A)` and `P(B|~A)` (even if imprecisely estimated), this *isn't* the fallacy, even if their final confidence changes. The fallacy is the *shortcut* or *misapplication*.
      *   **Logical Implication:** If the statement is a strict logical implication ("If circuit fails, then light is off") and you observe the light is off, increasing confidence in circuit failure *is* logically justified (Modus Ponens). Your cases involve *probabilistic* conditionals, not logical certainties. This is crucial.

  **Why This Matters for a Journalist**

  This trap is a major engine of misinformation, alarmism, and false confidence. As a science/ideas journalist, arming yourself and your newsroom with this concept ("Conditional Probability Misdirection" / "The If-Then Confidence Trap") is vital. When you hear an "if-then" probability:

  1.  **Loudly Identify the Antecedent (A) and Consequent (B).**
  2.  **Demand (or estimate):** What's the prior `P(A)`? What's `P(B|~A)`?
  3.  **Interrogate Salience:** Why did the source choose *this* `A` to condition on? What other conditionals exist? (Especially if the `P(B|A)` is extreme).
  4.  **Guard Against Creep/Slide:** Explicitly ask: "Does this information *directly* tell us anything new about how likely A is? Does it *directly* tell us how likely B is overall? Or does it *only* tell us how B relates *if* A is true?"
  5.  **For Complementary Conditionals:** Demand `P(A)`! The conditionals constrain `P(B)` but don't define it without the base rate.

  By naming and dissecting this trap, you can prevent your newsroom (and your readers) from being misled by the siren song of a dramatic conditional probability divorced from its necessary priors.
