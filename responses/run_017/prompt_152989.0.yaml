     - Proportion: if the model is binomial and the parameter is the success probability.
     - Otherwise: shape.

  2. Assign prior:

     - Location: uniform on (-∞, ∞) [improper]. If proper prior required, stop: judgment needed.
     - Scale: 1/θ [improper]. If proper prior required, stop: judgment needed.
     - Proportion: Beta(1/2,1/2) [proper] - use this.
     - Shape: 
          a) If the model is Pareto and the parameter is the shape, then use p(α) ∝ 1/α (if the scale is known) or p(α,σ) ∝ 1/(ασ) (if scale is unknown). But note: improper.
          b) Otherwise, try to find a known Jeffreys prior for that model. If not available, then stop: judgment needed.

  3. Reparameterization stress test: (for our own documentation)

     - For the assigned prior, choose two common reparameterizations (e.g., log, square, etc.) and compute the prior in the new parameterization by the transformation rule. Then, if we were to apply the same role-based rule in the new parameterization, would we get the same prior? 
          - For location, scale, and proportion (using Jeffreys) it should pass.
          - For shape, it depends. If we used the Jeffreys prior, it should pass. Otherwise, it may not.

     - If it does not pass, then we must reconsider the prior (but if we used the Jeffreys prior, it should pass).

  4. When does the choice stop mattering? 

     - After running the model (or in design phase), check the posterior distribution. If the posterior standard deviation is small relative to the prior standard deviation (for a proper prior) or relative to the application context, then the prior doesn't matter. 

     - Alternatively, for parameters with high Fisher information per observation, the data will dominate quickly.

     - In practice, for the quarterly filing, include a sensitivity analysis by running the model with an alternative prior (diffuse proper prior) and compare the results. If the difference in key outputs (like reserves or reinsurance premium) is less than a materiality threshold (say 1%), then the choice does not matter. Otherwise, report the sensitivity.

     - Note: for the shape parameter, even with data, the prior may matter. Always do a sensitivity analysis.

  Worked examples with the three parameters:

  Example 1: Standard deviation of claim sizes (σ)
     Model: claim sizes are i.i.d. normal with mean μ (unknown) and variance σ^2.
     Role: scale parameter.
     Prior: p(σ) ∝ 1/σ (improper). 
     If proper prior required: judgment needed. We choose a proper prior: half-Cauchy(25) (arbitrary large scale) and note that this is subjective.
     Reparameterization:
          φ = log(σ): p(φ) ∝ 1 -> uniform on φ.
          If we consider φ as a location parameter, we would assign uniform -> matches.
          φ = σ^2: p(φ) ∝ 1/φ -> which is the standard non-informative prior for variance -> matches.

  Example 2: Proportion of claims that settle without payment (p)
     Model: Bernoulli(p)
     Role: proportion
     Prior: Beta(1/2,1/2)
     Reparameterization:
          φ = logit(p): p(φ) ∝ 1/(e^{-φ/2}+e^{φ/2}) [which is the Jeffreys prior in φ space] -> matches.
          φ = p^2: 
              p = sqrt(φ), |dp/dφ| = 1/(2 sqrt(φ))
              p_φ(φ) ∝ [sqrt(φ)]^{-1/2} [1-sqrt(φ)]^{-1/2} * 1/(2 sqrt(φ)) 
                      = φ^{-1/4} (1-sqrt(φ))^{-1/2} * 1/(2 φ^{1/2}) 
                      = (1/2) φ^{-3/4} (1-sqrt(φ))^{-1/2}
              This is not the same as the Beta(1/2,1/2) prior on φ (which would be for a proportion on [0,1] but φ is on [0,1] too? But note: the role of φ is not a proportion in the same model? The model for φ would be different: if we set q = p^2, then the likelihood becomes more complex. The Jeffreys prior for q would be computed from the Fisher information for q. It would not be the same as the transformed prior. However, the Jeffreys prior is invariant under reparameterization, so it should match. But we see the functional form is different? 

              Actually, the Jeffreys prior for q is:
                  I(q) = -E[ d²logL/dq² ] 
                  logL = s log(q) + (n-s) log(1-sqrt(q))   [because p=sqrt(q), and 1-p = 1-sqrt(q)]
                  But note: this is messy. We avoid. We trust the theory: the Jeffreys prior is invariant.

     So we assume it passes.

  Example 3: Shape parameter (α) for claim-size distribution (Pareto)
     Model: Pareto with shape α and scale σ (both unknown)
     Role: shape
     Prior: joint prior p(α, σ) ∝ 1/(ασ) [improper]
     If proper prior required: judgment needed. We might choose a diffuse gamma for α and diffuse prior for σ? But note: the Jeffreys prior is 1/(ασ). We could approximate with a proper prior: 
          p(α) ∝ 1/α for α in [a, b] (with a small and b large) and p(σ) ∝ 1/σ for σ in [c, d]. But then we have to choose a,b,c,d -> subjective.

     Reparameterization:
          Let φ = log(α), and ψ = log(σ). Then the prior becomes:
               p(φ, ψ) ∝ 1/(exp(φ) * exp(ψ)) * |Jacobian| = 1/(exp(φ)exp(ψ)) * exp(φ)exp(ψ) = 1.
          So it becomes uniform on (φ, ψ). 
          Now, if we apply the role-based rule: are φ and ψ location parameters? Not exactly, but the Jeffreys prior in the new parameterization is constant (because the Fisher information matrix in (φ,ψ) might yield a constant determinant). So it passes.

     But note: we have to assume the Pareto model.

  Closing section: what the procedure cannot do

     - It cannot produce a non-informative prior for every model. For complex models or shape parameters, we may not have a closed form or even a known non-informative prior.

     - It requires the likelihood model. Without the model, we cannot proceed.

     - It may yield improper priors. If the association requires proper priors, then we must use judgment to choose a diffuse proper prior.

     - The stress test is for our understanding. In practice, the Jeffreys prior is invariant so we don't need to do it every time.

     - The procedure does not guarantee that the posterior is proper. That must be checked separately.

     - The sensitivity analysis may be time-consuming.

     - The procedure does not work for parameters with discrete spaces.

     - The procedure does not work for models that are not smooth.

  About the user's reading:

     The user's diagnosis of Bertrand's chord problem is correct: the principle of indifference is inconsistent under reparameterization. The remedy of fixing a single convention (e.g., always use the parameter as given) is one way, but it is arbitrary. The Jeffreys prior provides a remedy that is invariant under reparameterization, but it requires the likelihood. Therefore, we rely on the Jeffreys prior and not an arbitrary convention.

     However, note that the Jeffreys prior is not without criticism. For multiparameter models, it may not perform well. But it is the standard solution.

  Therefore, the procedure is to use the Jeffreys prior whenever possible, and when not, to use judgment.
