  ### Procedure for Selecting Defensible Ignorance Priors

  This procedure provides a systematic, spreadsheet-friendly approach for selecting priors when no data or prior knowledge is available ("ignorance priors"). It emphasizes transparency, consistency, and computational feasibility. The steps below apply to **one parameter at a time** and assume the **likelihood model** (probability distribution of data given parameters) is specified. If the likelihood is unknown, stop immediately—no defensible ignorance prior exists.

  **Key Principles:**
  - **Jeffreys prior** is the gold standard for ignorance priors as it is invariant under reparameterization (avoids Bertrand-style paradoxes).
  - **Improper priors** (integrating to ∞) are acceptable only if the posterior is proper (integrates to 1). Always verify posterior propriety.
  - **Proper priors** are required if the association's rules prohibit impropriety or if the posterior is improper.
  - **Judgment is required** when no closed-form Jeffreys prior exists, the prior must be proper, or the parameter has no natural role.

  ---

  ### Step-by-Step Procedure
  *Apply these steps to each parameter independently. Use a spreadsheet for calculations. Time per parameter: 15-30 minutes.*

  #### **Step 1: Identify the Likelihood Model**
  - **Input:** Likelihood function (e.g., Normal, Binomial, Pareto) for the data given the parameter.
  - **Sufficient Answer:** Explicit statement of the likelihood (e.g., "Claim sizes ~ Normal(μ, σ)").
  - **Failure:** Likelihood unspecified. **Stop: No defensible ignorance prior. Judgment required.**
  - **Hand-off:** If the likelihood is unknown, return to the actuarial team for specification.

  #### **Step 2: Determine the Parameter's Role**
  - **Input:** Parameter's role in the likelihood model:
    - **Location** (e.g., mean of Normal): Shifts the distribution.
    - **Scale** (e.g., std. dev. of Normal): Stretches/shrinks the distribution.
    - **Proportion** (e.g., success probability in Binomial): Bounded [0,1].
    - **Shape** (e.g., Pareto tail index): Affects higher moments, not location/scale.
  - **Sufficient Answer:** Role classification (e.g., "σ is a scale parameter").
  - **Failure:** Role ambiguous (e.g., shape parameters in complex models). **Stop: Hand-off for judgment.**
  - **Hand-off:** If the role is unclear (common for shape parameters), escalate.

  #### **Step 3: Assign Jeffreys Prior (If Applicable)**
  - **Input:** Parameter role from Step 2.
  - **Rules:**
    - **Location:** Uniform over ℝ. *Improper.*  
      Example: μ in Normal(μ, σ).
    - **Scale:** 1/θ over θ > 0. *Improper.* Equivalent to uniform on log(θ).  
      Example: σ in Normal(μ, σ).
    - **Proportion:** Beta(½, ½) (Jeffreys prior for Binomial). *Proper.*  
      Example: p in Binomial(n, p).
    - **Shape:** No universal rule. **Stop: Hand-off for judgment.**
  - **Sufficient Answer:** Prior formula (e.g., "p(σ) ∝ 1/σ").
  - **Failure:** No Jeffreys prior exists (e.g., shape parameters). **Stop: Hand-off for judgment.**
  - **Hand-off:** If prior must be proper (Step 0) but Jeffreys is improper, judgment is needed to choose a diffuse proper prior (e.g., log(θ) ~ Normal(0, 1000)).

  #### **Step 4: Reparameterization Stress Test**
  - **Input:** Prior from Step 3 and 3–4 transformations (e.g., θ, θ², log(θ), 1/θ).
  - **Process:**  
    For each transformation φ = g(θ):
    1. Compute the induced prior: p(φ) = p(θ) / |dg/dθ|.
    2. Apply the Step 3 rule directly to φ (as if it were the parameter).
    3. Check: Does the rule-based prior for φ match p(φ)?
  - **Sufficient Answer:** Agreement across all transformations (confirms invariance).
  - **Failure:** Disagreement (e.g., uniform on θ vs. uniform on log(θ)).  
    **Implication:** "Ignorance" claim was incomplete; prior is arbitrary.
  - **Action:** Use Jeffreys prior (invariant by design). If disagreement persists, error in model/role.
  - **Time-Saver:** Skip if Jeffreys prior was used (guarantees invariance).

  #### **Step 5: When Does the Choice Stop Mattering?**
  - **Input:** Prior from Step 3, sample size n, and key quantity (e.g., reinsurance premium).
  - **Process:**  
    - **Approximation:** If posterior standard deviation (SD) ≪ prior SD, choice is irrelevant.  
      Estimate posterior SD:  
      - Location/Scale: Posterior SD ≈ (Data SD) / √n.  
      - Proportion: Posterior SD ≈ √[p(1−p)/n].  
    - **Sensitivity Analysis:**  
      1. Fit model with Jeffreys prior and one alternative (e.g., diffuse proper prior).  
      2. Compare key quantities (e.g., 95% credible interval for reinsurance premium).  
      3. If differences < materiality threshold (e.g., 1%), choice doesn't matter.  
  - **Sufficient Answer:**  
    - "Choice irrelevant" (if posterior SD small or sensitivity < threshold).  
    - "Sensitivity analysis attached" (if differences material).  
  - **Failure:** Prior dominates posterior (e.g., n small for tail parameters).  
  - **Obligation to Reviewer:**  
    - If choice irrelevant: No action.  
    - If sensitive but Jeffreys used: Report sensitivity.  
    - If sensitive and no Jeffreys: Justify chosen prior or use robust model.

  ---

  ### Worked Examples

  #### **Parameter 1: Standard Deviation of Claim Sizes (σ)**
  - **Step 1 (Likelihood):** Claim sizes ~ Normal(μ, σ). *Sufficient.*  
  - **Step 2 (Role):** Scale parameter (stretches distribution). *Sufficient.*  
  - **Step 3 (Prior):** Jeffreys prior p(σ) ∝ 1/σ. *Improper.*  
  - **Step 4 (Stress Test):**  
    - φ = σ: p(φ) ∝ 1/φ. Rule: Scale → 1/φ. **Agrees.**  
    - φ = log(σ): p(φ) ∝ 1. Rule: Location → uniform. **Agrees (uniform on φ).**  
    - φ = σ²: p(φ) ∝ 1/φ. Rule: Scale → 1/φ. **Agrees.**  
  - **Step 5 (Relevance):**  
    - n = 100 claims → Posterior SD ≈ (Data SD)/10. Likely irrelevant if data > 50 claims.  
    - *Sensitivity analysis optional.*  
  - **Output:** Use p(σ) ∝ 1/σ. **Defensible.**

  #### **Parameter 2: Proportion of Zero-Payment Claims (p)**
  - **Step 1 (Likelihood):** Claims ~ Bernoulli(p). *Sufficient.*  
  - **Step 2 (Role):** Proportion parameter. *Sufficient.*  
  - **Step 3 (Prior):** Jeffreys prior = Beta(½, ½). *Proper.*  
  - **Step 4 (Stress Test):**  
    - φ = p: p(φ) = Beta(½, ½). Rule: Proportion → Beta(½, ½). **Agrees.**  
    - φ = logit(p): p(φ) ∝ 1/√[e^φ(1 + e^φ)²]. Rule: Not location/scale/proportion. **N/A – but Jeffreys ensures invariance.**  
  - **Step 5 (Relevance):**  
    - n = 200 claims → Posterior SD ≈ 0.03. Choice irrelevant if n > 50.  
  - **Output:** Use Beta(½, ½). **Defensible.**

  #### **Parameter 3: Tail Shape Parameter (α)**
  - **Step 1 (Likelihood):** Claim sizes ~ Pareto(α, σ). *Sufficient.*  
  - **Step 2 (Role):** Shape parameter. *Hand-off: Judgment needed (no universal role).*  
  - **Judgment-Based Prior (if Pareto):**  
    - Jeffreys prior for Pareto(α, σ) is p(α, σ) ∝ 1/(ασ). *Improper.*  
    - **Stress Test:**  
      φ = log(α), ψ = log(σ) → p(φ, ψ) ∝ 1. Rule: Not location/scale. **N/A – but Jeffreys invariant.**  
  - **Step 5 (Relevance):**  
    - Tail depends on extreme claims → n_effective small. **Prior matters indefinitely.**  
    - Sensitivity analysis mandatory (e.g., compare α ~ 1/α vs. Gamma(0.01, 0.01)).  
  - **Output:** Use p(α, σ) ∝ 1/(ασ) if improper allowed. Else, **hand-off for proper prior choice.**  

  ---

  ### What the Procedure Cannot Do
  1. **Create priors without a likelihood.** Ignorance is defined relative to the model.  
  2. **Handle discrete parameters.** Requires enumeration (not spreadsheet-friendly).  
  3. **Resolve improper posteriors.** Always verify posterior integrates to 1.  
  4. **Eliminate judgment.** Shape parameters, proper priors, and ambiguous roles require expert input.  
  5. **Guarantee non-informativeness in small samples.** Sensitivity analysis is mandatory for critical parameters.  

  ---

  ### Correction: Your Reading of Bertrand's Paradox
  Your diagnosis is **partially correct but incomplete**:  
  - **Correct:** The principle of indifference *is* inconsistent under reparameterization (as shown by Bertrand's three probabilities).  
  - **Misguided:** Fixing a single convention (e.g., always use θ or log(θ)) **does not resolve the paradox**. It replaces inconsistency over parameters with *arbitrary* consistency.  
  - **Remedy:** **Jeffreys prior** resolves this by using the likelihood's Fisher information, which transforms correctly under reparameterization. It is the only non-arbitrary solution.  
  - **Implication:** Your procedure uses Jeffreys rules (Steps 3–4), not fixed conventions. Reparameterization tests validate invariance, not indifference.  

  ---

  ### Final Output for Board Minutes
  For each parameter, document:  
  1. Likelihood model.  
  2. Parameter role.  
  3. Prior chosen (with formula).  
  4. Result of stress test (or "Jeffreys prior, invariant by design").  
  5. Sensitivity/relevance statement (e.g., "prior choice immaterial for n > 50").  

  **Example:**  
  > *"For claim size std. dev. (σ), assuming Normal likelihood, σ is a scale parameter. We used p(σ) ∝ 1/σ (Jeffreys prior), which is invariant under reparameterization. With 100+ claims, sensitivity is <1%."*  

  This ensures reproducibility, defensibility, and transparency.
