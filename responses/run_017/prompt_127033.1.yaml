  For the ending... the folder of orange-framed photos in her empty B&B. Not a villain in sight: the volunteers are earnest, the agency staff stretched thin, the townsfolk just trying to survive. The tragedy is in the shared delusion. Last image should be Meg realizing the photos are simultaneously worthless and priceless - documents of their collective blindness.

