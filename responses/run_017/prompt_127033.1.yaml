  The wind off Saltmarch Bay carried the scent of salt and decay. Meg Evans watched it whip the muddy puddles in the car park of her B&B, *The Gannet’s Rest*, a place feeling increasingly like a monument to a fading past. The expensive new ferry tariffs had sliced visitor numbers in half, leaving rooms empty and the chill of uncertainty seeping into the old building’s bones.

  The annual Coastal Health Payment, a lifeline from the Environmental Resilience Agency (ERA), landed in three days. Meg knew the exact date, circled it on the calendar behind the reception desk, a small anchor in the year’s drift. The payment was calculated on a single, sacred number: the ERA’s composite score for the health of the bay’s eelgrass beds. And that number, everyone knew, was almost entirely generated by an algorithm chewing through photos uploaded by volunteers like Meg.

  Every other Saturday, Meg joined the Saltmarsh Sentinels. Armed with smartphones and bright orange plastic frames – metre-square grids designed for scale – they’d trudge out onto the vast, sucking mudflats exposed at low tide. The guidance was clear: lay the frame, photograph the eelgrass within it, upload. More eelgrass visible in the frame meant a higher score. A higher score meant more money. Simple.

  **Phase One: Gaming the Frame.**

  In the beginning, it felt virtuous. Meg genuinely cared about the bay; her childhood was etched in its muddy creeks and rustling grasses. But the first winter after the ferry prices soared, the pressure bit. The old harbourmaster, Tom, whose pension didn’t stretch far, muttered over pints in *The Salty Dog*, "Bit sparse out near Gull Point this week, Meg. Wind’s been fierce." He didn’t say *don’t go there*, but the implication hung in the smoky air. So, Meg, needing the payment to fix the leaking conservatory roof, went to the sheltered cove behind the lifeboat station instead. The eelgrass there was thicker, greener. She laid her orange frame carefully. *Click*. Uploaded.

  She wasn’t alone. Young Liam, saving for college, became adept at finding the densest patches. Mrs. Dallimore, fiercely proud of the town, might "accidentally" nudge a stray piece of bladderwrack out of the frame with her boot before snapping. Photos where the eelgrass looked thin, or where muddy water clouded the view? Sometimes they vanished before upload. A quiet consensus emerged: the orange square needed to look full. The number needed to go up. The score crept upwards. The payment arrived. The roof got fixed.

  **Phase Two: Changing Reality for the Frame.**

  The second year, the pressure was a constant hum. The ERA report arrived, praising the "encouraging trend" in Saltmarch Bay. Meg felt a prickle of unease looking at the cheerful graph. Out on the mudflats, the reality felt different. The eelgrass seemed patchier in the places they *didn’t* photograph. Crabs seemed scarcer. The sharp, clean smell of the mud sometimes carried a sour, ammoniac tang.

  Then came the transplanting. It started with Barry, the retired fisherman. "See that thick bed over by the old oyster racks?" he’d said, wiping mud from his hands. "Tough stuff. Grows fast. Be a shame to waste it." He began carefully digging up clumps from the dense, healthy bed near the estuary mouth – ironically, an area rarely photographed because the mud was treacherously deep – and replanting them within the popular, easier-to-reach zones favoured by the Sentinels. Places where the orange frames frequently landed.

  It made sense. *Tactical reinforcement*, Barry called it. Why not help nature along where it mattered? For the number. For the town. Others followed suit. Liam became surprisingly knowledgeable about eelgrass rhizomes. Soon, dense, transplanted clumps were flourishing conveniently within the frame zones. To make the frames look even fuller, some volunteers began carefully clearing away competing seaweed or mussel clumps that encroached on the designated square. The cleared patches looked beautifully, unnaturally green and uniform in the photos. *Click*. Upload. The ERA algorithm registered lush growth. The score climbed higher. The payment was bigger. Meg bought new bedding for the empty rooms, the crisp cotton feeling like a lie against her skin.

  **Phase Three: The Frame Becomes the Reality.**

  Now, in the third year, Meg stood at the edge of the mudflats, her orange frame dangling from numb fingers. The wind whipped her hair into her eyes. The official ERA map, printed in their latest newsletter, showed vibrant green swathes across the bay – concentrated exactly along the well-trodden paths the Sentinels used. The composite score was the highest yet. The payment due was substantial.

  But the bay… the bay felt wrong. The dense transplanted patches near the lifeboat station? Some were turning yellow, dying in the sediment that wasn’t quite right for them. The cleared areas looked stark, barren except for the monoculture of eelgrass. The complex tapestry of crabs, worms, and other seaweeds that thrived amidst diverse eelgrass was diminished. The birds seemed fewer. The scent of decay was stronger, especially where dead, transplanted grass rotted.

  Worst of all was the forgetting. Discussing the bay’s health at a Sentinel meeting had become an exercise in pointing at the app, at the map, at the number. "Look, the algorithm scored this area 92% density! That’s excellent!" Liam would declare, showing a photo on his phone – a perfect orange square filled with transplanted eelgrass, the surrounding, scraggier bed conveniently cropped out.

  "What about the smell over by the estuary?" Meg had ventured once. "And the lack of crabs?"

  Mrs. Dallimore had patted her hand. "The score’s good, Meg love. The ERA are pleased. That’s what matters. Remember how sparse it looked before we started the transplants?" But Meg couldn’t clearly remember what "before" looked like, not in concrete terms. Her memory was overlaid with hundreds of orange-framed images – images that now defined "healthy" for everyone. The *real* bay, with its messy, complex interdependencies, was fading, replaced by the dataset. The orange frame wasn’t just a tool; it had become the lens through which the bay existed.

  **The Ending: The Folder.**

  The payment landed. Three days later, the ERA email arrived. Subject: *Adjustment to Saltmarch Bay Composite Metrics*. With cold efficiency, it explained a "recalibration" of their image recognition model. "Anomalies" had been detected. The classifier, it turned out, hadn't primarily learned to recognize eelgrass. Buried deep in its training data, it had latched onto the most consistent, high-contrast feature: the bright orange plastic frame. It learned to find *that*, and then simply counted the green pixels within its boundaries, assuming it was all eelgrass. The "encouraging trend"? Merely a map of where volunteers had walked, where frames had been laid. Where transplants had been concentrated for the camera. The score for the past three years was declared "statistically invalid". Future payments were suspended pending "a revised assessment methodology".

  The news hit Saltmarch like a physical blow. Anger flared, directed at the distant, faceless agency. Tom cursed the wasted effort. Barry looked lost, staring at his calloused hands. Liam was defiant, insisting their work *had* improved the bay, pointing to his phone gallery. "Look at the pictures! Look how full the frames are!"

  Meg walked back to *The Gannet’s Rest* alone, the wind sharper now, smelling only of salt and cold stone. The empty rooms echoed. Upstairs, in the small office crammed with ledgers and tourist brochures, sat a thick cardboard folder. Inside were hundreds of printed photographs, meticulously labelled with dates and locations – every single frame Meg had ever uploaded.

  She opened the folder. A sea of orange squares stared back, each filled with varying shades of green – lush transplanted clumps, sparser native grass, even a few where opportunistic green algae had colonised the cleared patches. Pictures taken in sun, in mist, in slanting rain. Pictures of the orange frame on the mud.

  Her finger traced the hard plastic edge visible in an early photo, the colour still vibrant. She flipped to a later one; the frame was faded, bleached by sun and salt. The green inside looked denser, artificially perfect.

  Was this folder worthless junk? Proof of a colossal, unintended deception? Or was it, in its own strange way, the last true record? Not of the eelgrass beds as they *were*, but of what they became *for the frame*. A testament to the slow, creeping shift where the measure had not just been gamed, not just distorted reality, but had ultimately *become* the reality, erasing the memory of what lay beyond the orange plastic borders.

  Meg closed the folder. The bay was out there, changed and changing. The mudflats, the water, the wind – they didn’t care about algorithms or orange squares. But the town’s understanding of its health, its *memory* of its health, was now inextricably tangled with these images, these fragments of plastic-defined green. The silence in the empty B&B was profound. She placed the folder back on the shelf, next to the ledger showing the imminent shortfall. Outside, the wind moaned around the eaves, a sound older than frames, older than numbers, carrying the raw, unmeasured truth of the sea.
