  ### Ethics Framework Specification for Vector Control and Crop Protection  
  **Purpose**: To provide a decision-making body with actionable criteria for selecting interventions, publicly justifiable to risk-bearing populations, without presupposing unresolved scientific disputes or defaulting to human benefit as sole justification.  

  #### Requirements Table  

