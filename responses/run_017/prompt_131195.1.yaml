  | **R1**: Prioritize interventions based on the necessity and significance of the protected human interest, not merely benefit magnitude. | Asymmetry (malaria prevention vs. cosmetic crop yield; both kill insects but differ in human stakes).          | Non-negotiable                                      | Views that weigh human benefits alone (e.g., simplistic utilitarianism).                              | None                                                                                       |
  | **R2**: Minimize per-death suffering where feasible, using vertebrate neurotoxicity data as a proxy for potential invertebrate distress. | Dying-time (neurotoxins cause prolonged agony; agency must not ignore plausible suffering).                   | Camp preference (Welfare-consequentialist)          | Views that disregard suffering modes (e.g., death-counting biocentrism).                              | R10 (R2 requires assuming sentience; R10 forbids it).                                      |
  | **R3**: Treat "pest" as a context-dependent designation, requiring justification of the human project’s importance.       | Constitution (caterpillars are pests in crops but not on verges; projects define harm, not nature).           | Non-negotiable                                      | Views that treat pests as inherently harmful (e.g., eradicationist biocentrism).                      | None                                                                                       |
  | **R4**: Favor interventions that avoid irreversible ecological dependencies or resistance escalation.                    | Lock-in (insecticide resistance traps farmers in chemical arms races; sustainability matters).               | Non-negotiable                                      | Short-term cost-benefit analyses ignoring path-dependence.                                            | None                                                                                       |
  | **R5**: Define baselines explicitly, accounting for natural mortality, and disallow "they’d die anyway" to nullify harm. | Baseline (alternative to killing isn’t life but death by other causes; reference must be rigorous, not ad hoc). | Non-negotiable                                      | Views that ignore counterfactuals (e.g., naive harm-counting).                                        | None                                                                                       |
  | **R6**: Evaluate population suppression (e.g., gene drives) distinctly from killing, addressing prevented existence.     | Suppression (sterile releases reduce future insects; moral weight differs from killing extant individuals).  | Non-negotiable                                      | Views that conflate death with prevention of life (e.g., individualist deontology).                   | None                                                                                       |
  | **R7**: Embed procedural justice: risk-bearers (e.g., farmworkers, downwind communities) must shape decisions.          | Risk-bearing (exposed populations ≠ beneficiaries; legitimacy requires their input).                         | Non-negotiable                                      | Purely outcome-focused views (e.g., technocratic exceptionalism).                                     | R9 (Procedural deliberation may not yield determinism under uncertainty).                  |
