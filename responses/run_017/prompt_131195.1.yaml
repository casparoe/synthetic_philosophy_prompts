  We are building a specification for an ethics framework that must guide a public agency in choosing among vector-control and crop-protection methods. The agency must make real decisions and justify them publicly, especially to those who bear the risks. The raw material includes eight concerns (asymmetry, dying-time, constitution, lock-in, baseline, suppression, risk-bearing, migration) and a distrust of the demand for determinacy under radical uncertainty.

  We must produce:
  1. A table with columns: Requirement (R1, R2, ...), Motivating_Case, Status (non-negotiable or camp preference with camp named), Excludes (what it forbids), Conflicts (other requirement IDs and why).
  2. A JSON scorecard with:
     - non_negotiables: array of requirement IDs
     - preferences: array of {id, camp, why_negotiable}
     - unsatisfiable_subsets: array of {ids, what_gives}
     - most_exclusionary: {id, reason}
     - scorecards: array for four candidate views (welfare-consequentialist, biocentric-individualist, ecosystem-integrity, public-health-exceptionalist) with {view, meets, fails, worst_failure, one_line_verdict}

  First, let's derive requirements from the raw material. We have 8 cases and one additional candidate (distrusted). We may group or split as needed.

  Requirement Derivation:

  1. Asymmetry case: We need a way to distinguish between interventions that kill insects for essential human benefits (like malaria control) and those for trivial benefits (cosmetic crop yield). This suggests a requirement that the ethical account must be sensitive to the magnitude and nature of the human benefit, but without making human benefit the sole criterion (because the asymmetry exists even when comparing two killing actions). Requirement: The account must provide a way to weigh the human interest against the harm to insects that is not solely dependent on the size of the human benefit. It must also consider the type of human interest (e.g., survival vs. convenience). We might call this "Proportionality and Necessity".

  2. Dying-time problem: If we are to account for the suffering during the dying process, we must have a requirement that the mode of death matters. But the colleague says we don't know about invertebrate consciousness. Requirement: The account must not ignore the possibility of suffering and must require that, if a mode of action is known to cause prolonged distress in vertebrates (as a proxy for potential suffering in invertebrates), it should be avoided when feasible alternatives exist. However, this might be contested. Alternatively, a requirement that the account must be sensitive to the quality of the death if there is reasonable evidence of the capacity for suffering, but this pushes the uncertainty problem. Instead, we might require that the account must account for the possibility of suffering by including a precautionary principle. But note: the user wants to know if we can both avoid presupposing contested claims and require sensitivity to mode of death.

  3. Constitution worry: Pest status is relational (to human projects). Requirement: The account must not treat "pest" as a natural category but as a relational one, and yet it must allow for interventions against pests without forbidding all human projects that create pests. Thus, the account must provide a justification for when a human project's interference with non-humans is permissible, without requiring that the project be abandoned.

  4. Lock-in objection: Interventions can lead to resistance and create dependency. Requirement: The account must consider long-term consequences and sustainability, including the potential for creating dependencies and reducing future options. Thus, it must be diachronic.

  5. Baseline problem: We need to set a reference for harm. Requirement: The account must specify a defensible baseline for comparing the harm of an intervention, and must not use "they would have died anyway" to ignore the harm of killing without a clear justification for the baseline. It must also account for the fact that the alternative might be death by other causes.

  6. Suppression without killing: Some methods prevent existence. Requirement: The account must be able to evaluate interventions that reduce future populations (and thus prevent existence) and not only those that kill existing individuals. It must address the moral significance of reducing the number of future insects.

  7. Risk-bearing and say: The people exposed to risks (e.g., from pesticides) are often not the beneficiaries. Requirement: The account must incorporate procedural justice, including the requirement that those who bear the risks have a say in the decision, or at least that their interests are adequately represented. This might be a non-negotiable because of the public and justice nature of the agency.

  8. Migration: Techniques developed for one purpose get used for others. Requirement: The account must be general enough to apply to a variety of targets and contexts, and must not allow justifications that are context-specific to be used inappropriately in other contexts. Alternatively, it must require that each deployment is evaluated on its own merits.

  Additionally, the coauthor's candidate: that the account must yield a determinate decision under radical uncertainty. The user distrusts this because it might be a way to justify any agency action. We might mark this as a camp preference (for the pragmatic camp?).

  Now, we must mark each requirement as non-negotiable or a camp preference.

  Non-negotiables: These are likely the ones that are essential for the framework to be publicly justifiable and to avoid clear injustices or irrationalities. From the above:
  - Asymmetry (R1): non-negotiable because without it, the framework cannot distinguish between essential and non-essential harms and might permit trivial harms.
  - Constitution (R3): non-negotiable because it is a conceptual point that pests are relational; ignoring this would lead to treating all insects in a field as inherently bad.
  - Lock-in (R4): non-negotiable because it is about long-term consequences and sustainability, which are critical for public policy.
  - Risk-bearing (R7): non-negotiable because it is about justice and legitimacy; without it, the agency might impose risks on vulnerable groups without recourse.
  - Migration (R8): non-negotiable? Maybe, because the framework must be robust to prevent misuse. But it might be negotiable if we think that the framework only has to guide the agency in its own decisions and not worry about future misapplications? The user says "must the account govern that", so let's say non-negotiable: the account must require that the justification for an intervention in one context does not automatically transfer to another without reevaluation.

