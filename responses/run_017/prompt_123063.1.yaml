prompt: |-
  Hi — I'm on the Clinical Analytics Review Committee at my hospital system. We meet Thursday and I've got to circulate a short decision memo beforehand, and I'd really like a draft to work from.

  The case: our sepsis early-warning vendor, Corvid Health, wants us to upgrade from the model we've run for two years to their new "Corvid Universal." The pitch is a benchmark suite: 11,000 synthetic prediction tasks generated from what they call a uniform random prior over data-generating processes, and they report that Universal beats both our current model and a panel of standard learners on average across the whole suite. The deck concludes that this is domain-general evidence and that site-specific validation is therefore optional.

  One of our members, a retired philosopher who sits on the committee, sent around a one-pager saying basically the opposite. Two claims in it. First, that by the no-free-lunch results, averaged over all possible problems every algorithm does exactly as well as every other one, so Universal's suite average can't be evidence of anything unless the suite was built to resemble wards like ours — and a uniform random prior over data-generating processes is definately not that. Second, that even setting that aside, no amount of past performance at other hospitals could ever justify expecting performance here, since the only argument for it is "it has worked before," which is circular. He wants us to reject outright and let the contract lapse in March.

  I think he's right about something and wrong about something, and I want the memo to say which. Concretely: recommend approve, reject, or approve-with-conditions-and-a-hard-gate, with a timeline, and reasons the vendor could actually respond to in writing.

  Things I want handled:

  - The uniform-prior suite. My read is that it's a prior dressed up as a proof: doing well on it shows the model's biases match whoever built the generator. But I don't know what we should be asking the vendor for instead. One idea floating around is to make them name the fifty tasks in the suite most similar to our ICUs and report performance only on those — that feels like a trap, since they pick the fifty and would pick flattering ones, but maybe there's a version of it that works.
  - Ranking versus calibration. Whatever we adopt fires a fixed threshold that triggers an antibiotics protocol, so what matters is whether the probabilities are right in our population, not whether the model orders patients well, and I don't think the vendor's numbers speak to that at all.
  - The feedback problem. Once the score is displayed, nurses act on it, which changes which patients get labelled septic, so the data we'd collect during a pilot can't straightforwardly tell us how the model would behave once it's actually live. I want the memo to be honest about what a pilot could and could not establish.
  - Give the losing side its best day in court. If we go with conditions, the strongest objection isn't the circularity one, it's that clinicians will anchor on a number they don't understand and that a "pilot" becomes a deployment by inertia.

  Keep it under ~700 words, written for the committee — a CMO, two docs, a nurse manager, our data scientist, and the philosopher — with the recommendation up top. And please don't cite anything or point us at papers; we can't chase references and wouldn't know what to do with them anyway. Just the argument.
reasoning: |-
  Okay, the user is on a hospital committee reviewing whether to upgrade their sepsis detection system. They need a draft memo for their meeting that addresses several technical concerns while being accessible to clinicians and a philosopher. 

  The core tension is between the vendor's benchmark claims and the philosopher's no-free-lunch critique. I need to navigate this carefully - the user wants nuance, not oversimplification. 

  First, the uniform benchmark issue. The vendor's "11,000 synthetic tasks" sounds impressive but misses the point. Healthcare data isn't uniformly distributed; it has specific patterns. The philosopher is right that averaging over all possible problems is meaningless. But completely rejecting external validation seems extreme - there's value in seeing how a model performs across diverse hospitals. 

  The calibration versus ranking point is crucial. Since they use a fixed threshold for antibiotics, probability accuracy matters more than ranking sepsis risk. The vendor's benchmarks likely only measure ranking (AUROC etc.), which isn't sufficient. 

  The feedback loop problem is tricky. Once nurses see the score, their actions alter the data. A pilot would show how the model interacts with clinical workflow, but not its "pure" performance. 

  For structure: Start with a clear recommendation (approve with conditions) since that's what the user wants. Then unpack the issues in plain language. The conditions should force the vendor to address real-world concerns: 
  - Make them justify benchmark relevance 
  - Require calibration reports 
  - Design a pilot that accounts for workflow effects 
  - Set strict go/no-go criteria 

  The philosopher's circularity argument needs addressing but shouldn't block action. We can acknowledge it while noting that real-world deployment always requires some inductive leap - the key is managing risk. 

  For tone: Avoid jargon. Explain no-free-lunch simply (e.g., "one-size-fits-all can't exist"). Use hospital-specific examples like "our ICU's patient mix" rather than abstract stats. Keep the philosopher's objections visible but show how conditions mitigate them. 

  The memo must stay under 700 words. Prioritize actionable recommendations over theoretical debates. Say what the committee needs to vote on, not just what to think about.
answer: |-
  ## MEMO: Corvid Universal Upgrade Recommendation  
  **To:** Clinical Analytics Review Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Date]  
  **Subject:** Recommendation on Corvid Universal Upgrade - Approve with Conditions & Hard Gate  

  ---

  ### **RECOMMENDATION**  
  Approve a **strictly limited pilot** of Corvid Universal, contingent on Corvid Health meeting three conditions within 4 weeks. If unmet by March 1, 2024, we let the contract lapse. Conditions:  
  1.  **Relevance Justification:** Corvid must demonstrate *why* their benchmark suite predicts performance *in our specific clinical environments* (e.g., ICU, ED).  
  2.  **Calibration Validation:** Corvid must provide calibration metrics (e.g., reliability diagrams, ECE) on our *current* 2023 sepsis patient data, not just ranking metrics (AUROC).  
  3.  **Pilot Design:** A joint plan defining pilot scope (e.g., 1 unit), duration (≤90 days), and explicit success criteria (e.g., calibration error < 5%, clinician usability score > X).  

  ---

  ### **KEY REASONS & CONDITIONS RATIONALE**  
  This balances innovation potential with the philosopher’s valid critiques and operational risks:  

  1.  **The Benchmark Suite (Addressing the Philosopher’s First Point):**  
      *   **He’s Correct:** A "uniform random prior" benchmark proves nothing about *our* wards. No-Free-Lunch means average performance over *all possible* problems is identical for all models. Success here only shows the model fits Corvid’s synthetic generator.  
      *   **Vendor’s Burden:** They must explain how this suite correlates with real-world sepsis prediction tasks like ours (e.g., "Tasks 1-500 mimic low-resource EDs; Tasks 501-1000 mimic post-op ICUs...").  
      *   *Why not "Top 50 Tasks"?* Picking tasks *they* deem "similar" is manipulable. We need their *logic for relevance*, not cherry-picked results.  

  2.  **Calibration is Non-Negotiable (Not Just Ranking):**  
      *   Our protocol triggers on a **probability threshold** (e.g., "≥8% risk = alert"). If the model says "10%" but only 5% of those patients are truly septic, we overtreat and erode trust. Vendor metrics (likely AUROC/AUPRC) only show *ranking* (high-risk > low-risk), not *accurate probabilities*.  
      *   **Condition 2 Requirement:** They must show their model outputs well-calibrated probabilities *on our recent, real data* before any pilot.  

  3.  **The Pilot’s Purpose & Limits (Addressing Feedback & Inertia):**  
      *   **What it CAN do:** Test integration, clinician workflow impact, *observed* calibration in a live-but-limited setting, and usability. Monitor for alert fatigue.  
      *   **What it CANNOT do:** "Prove" the model’s *underlying* performance in isolation. Once live, nurse actions alter labels (feedback loop). Success metrics must focus on *operational safety and usability*, not just retrospective AUROC.  
      *   **Hard Gate Prevents Inertia:** Binding success criteria and the March 1 deadline force a deliberate go/no-go decision. No "just keep it running."  

  4.  **Addressing the Circularity Concern (Philosopher’s Second Point):**  
      *   **His Valid Core:** Past performance elsewhere *alone* cannot guarantee success here due to unique populations, workflows, and data drift.  
      *   **Our Mitigation:** We don’t rely on past performance. Condition 1 forces relevance; Condition 2 tests calibration *here*; the Pilot tests *operational* fit *here*. This breaks the circle.  

  ---

  ### **LOSING SIDE BEST DAY IN COURT**  
  **Strongest Objection:** "Deploying any pilot, even limited, creates inertia. Clinicians will anchor on the displayed score, trust it prematurely, and resisting turning it off becomes harder, regardless of calibration flaws or benchmark irrelevance. We risk normalizing an unproven tool."  

  **Our Safeguard:** This is why the **hard gate (March 1 lapse)** and **explicit, measurable pilot success criteria** are critical. The pilot is framed explicitly as a *test*, not a deployment. Committee oversight of the pilot metrics is mandatory. If calibration or usability fails the pre-defined criteria, the hard stop is enforced.  

  ---

  ### **SUMMARY & PATH FORWARD**  
  *   **Reject Universal?** Too harsh; potential benefit exists, but current evidence is insufficient.  
  *   **Approve Unconditionally?** Too risky; ignores calibration needs and benchmark relevance.  
  *   **Approve w/ Conditions:** Requires Corvid to prove relevance and calibration *for us* and limits pilot risk.  
  *   **Action:** Vote to approve pilot *contingent* on Corvid meeting Conditions 1-3 by **March 1, 2024**. Failure on any = contract lapse.  

  ---  
  **Approved by Committee Vote:** [ ] Yes [ ] No [ ] Abstain  
  **Next Steps:** If approved, Chair circulates conditions to Corvid immediately. Vendor response due Feb 23. Committee reviews response Feb 27.
