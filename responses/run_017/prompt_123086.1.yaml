prompt: |-
  Every year I teach the seperateness of persons objection to utilitarianism — Rawls's complaint that utilitarianism doesn't take the distinction between persons seriously, Nozick's remark about there being no social entity with a good of its own that we can sacrifice individuals to, Taurek's argument that the numbers don't settle who we should save — and every year I get to the end of the seminar able to state the thing beautifully and with no clear idea which bit of it I actually believe. I've finally started writing it up, and I've got as far as a list of cases with my own gut verdicts on them, and I cannot find a principle that fits. So here's the list. Tell me what principle I'm groping towards, or tell me which of the verdicts has to go.

  1. Within a single life, aggregation is obviously fine. I'm having three hours of fairly grim dental work next week in exchange for ten years without toothache; anyone who turned that down would be mad. Same for my mother agreeing to a horrible operation that buys her five good years. Verdict: fine, and the arithmetic is straightforward.

  2. Across lives, equal harms: I can shove either one stranger or five strangers out of the path of a falling rock. No relationships, no prior claims, no tie-breaking considerations of fairness, and suppose for the sake of it that I have no way of tossing a coin. Verdict: save the five. Numbers count here.

  3. Taurek-style: save one stranger from being killed, or save five strangers from losing a hand each. Verdict: the one, and it isn't close. The reason that comes out of me is that no individual among the five would be as badly off as the one would be, and five lesser misfortunes don't compose into a greater one.

  4. Public health: a regulation adds roughly a one-in-ten-million annual risk of death from a trace contaminant to everyone in the country — call it seven million people — and reliably prevents four deaths a year. Verdict: obviously fine, pass it, don't be silly.

  5. Same four identified lives saved, but the cost falls on one identifiable innocent person in the form of a certain, genuinely grim year of forced labour. Verdict: not fine. Now, the expected arithmetic in 4 is worse than in 5 and I'm unmoved by that, which is fine, but here's what actually bothers me: if the difference between 4 and 5 is just a threshold on how large a burden anyone may be asked to bear, then the seperateness of persons is doing no work at all in my thinking — I'd say something very similar about burdens within one life (my mother wouldn't take a year of forced labour for five good years either).

  6. The case that really messes me up. A twenty-year-old has a slowly progressing neurological condition that will, by the time she's fifty, leave her with none of her present values, memories, or character, and no psychological continuity with her present self worth speaking of — think the most extreme version of what dementia does, except predicted in advance and known to her. Is a burden imposed on her-future-self more like case 1 or more like cases 2 and 5? Verdict: I'm much more reluctant to have her sign away a year of suffering at fifty in exchange for a big benefit now than I am in the ordinary case, so something in me is treating it as nearer the interpersonal end. But the Parfitian way of spelling that out eats case 1 as well: if ordinary prudence is just aggregation across a series of loosely connected person-stages and that's fine, I owe you a story about why the interpersonal version isn't.

  7. Something I made up to test myself, which I think is doing real work. Suppose a co-consciousness link: two people wired so that a single token experience is had by both of them — one instance of pain, two subjects who both undergo it. Is imposing one linked pain on a linked pair like imposing one pain on one person, or like imposing a pain on two? My verdict is that it's worse than the one and less bad than the two, and I don't like what that says about me, because it suggests the variable my verdicts have been tracking isn't the number of persons at all but the amount of suffering in the world. Which is the utilitarian answer I'm supposed to be resisting.

  A rough principle I've been trying out: you may add up burdens across people only when each individual burden is trivial, or when what each person bears is a risk small enough that no one could reasonably make anything of it; where a burden is significant, no number of lesser burdens can outweigh one person's claim not to bear it, because a life is a unit within which sacrifice can be compensated and across which it can't. Test it against the cases and repair it — clause 3 above is where I think it breaks, and I've never been able to make the last clause survive case 6.

  What I want, concretely: one principle, or at most two or three candidates, stated precisely enough that I could put it on a handout for third-years, with the case that motivates each clause attached to it. Then tell me what it says about two cases I haven't settled. (a) Benefits rather than burdens: one person gets twenty extra years of healthy life, or thirty people get two months each — I genuinely don't know what to say, and I want to know whether your principle has to treat benefits and burdens symmetrically. (b) A household of five adults who've shared everything for thirty years, each facing a harm, versus one stranger facing a bigger one — I feel a pull towards treating the household more like a single life, and I can't tell whether that's the view or sentimentality. I know there's a version of all this in the contractualist literature where you compare individual complaints pairwise instead of totalling them, and I've never understood whether that genuinely avoids aggregation or quietly reintroduces it; if that's the way out, show me it working on case 4. And be honest about which of my verdicts your principle can't accommodate — if the list is just a mess, tell me which verdict is the weak link and why rather than contriving something to save all seven.
reasoning: |-
  Hmm, the user is a philosophy professor teaching objections to utilitarianism, particularly the "separateness of persons" argument from Rawls, Nozick, and Taurek. They've compiled a list of cases with their intuitive verdicts but can't find a consistent principle to explain them. They want me to either identify the principle they're approaching or tell them which verdict needs revision.

  Looking at their cases and verdicts:

  1. Intrapersonal aggregation (dental work) is fine - straightforward arithmetic
  2. Saving five lives over one when harms are equal - numbers matter
  3. Saving one life over preventing five hand losses - favors the life, rejecting aggregation of lesser harms
  4. Small statistical risks acceptable for public health benefits
  5. Forcing one person into grim labor to save lives is unacceptable
  6. Uncertainty about whether burdens on future dementia selves are interpersonal or intrapersonal
  7. Co-conscious pain experiment suggests weighing total suffering, not person-counting

  Their proposed principle about aggregating only trivial burdens/small risks breaks on case 3 (hand losses vs death) and struggles with case 6 (dementia self).

  The key tension is between their anti-utilitarian intuitions (cases 3 and 5) and utilitarian-leaning ones (cases 2, 4, and 7). Case 6 shows discomfort with Parfit's reductionism that could undermine the separateness argument entirely.

  For their additional cases:
  (a) Benefits asymmetry: Big benefit to one vs small benefits to many might differ from burden cases due to non-identity of benefactors
  (b) The household case tests whether deep social unity creates quasi-intrapersonal status

  I notice contractualist pairwise comparison (Scanlon-style) could handle many cases but struggles with statistical cases like 4. The user explicitly asks to see how it would handle case 4.

  The core problem is that "separateness of persons" isn't doing independent work - their judgments track burden significance thresholds regardless of interpersonal boundaries. Their case 7 co-consciousness experiment reveals this clearly.

  The weak link is case 3: the hand-losses vs death verdict. If they maintain that death isn't aggregable with lesser harms, they need to explain why the threshold falls precisely there, and why it doesn't collapse into a simple significance threshold that applies intrapersonally too (as in case 1 vs case 5).
answer: |-
  Your struggle is beautifully articulated—it cuts to the heart of why anti-aggregation views are intuitively compelling yet notoriously hard to systematize. Your verdicts aren't inconsistent, but they reveal a tension between **thresholds of significance** and **relational unity** that no single principle fully resolves. Based on your cases, I propose a hybrid principle with two core components. It won't save every verdict perfectly (we'll address that), but it systematizes most and clarifies where the tension lies.

  ### The Proposed Principle: Threshold-Sensitive Relational Aggregation (TSRA)
  **1. Aggregation Permitted:**  
     - *When burdens are trivial* (per individual), **or**  
     - *When burdens fall within a relationally unified entity* (where compensation is possible).  
  **2. Aggregation Forbidden:**  
     - *When a significant burden* (non-trivial, non-risk, non-compensable) *is imposed on one party to avert lesser burdens for others*, **unless**  
     - *The beneficiaries are relationally unified with the bearer* (making compensation possible).  
  **Definitions:**  
     - **Trivial burden:** A harm so small that no reasonable person would feel meaningfully wronged by bearing it alone (e.g., microscopic risks).  
     - **Relational unity:** A context where identities are interwoven such that sacrifices are mutually compensable (e.g., within a single life, deeply shared households).  
     - **Significant burden:** A harm that disrupts life plans, autonomy, or core well-being in a way that cannot be fully compensated after the fact (e.g., forced labor, death, severe suffering).  

  ---

  ### How TSRA Handles Your Cases
  1. **Dental work/Mother's operation (Verdict: Fine)**  
     - *Fits:* Intrapersonal—burdens and benefits occur within a relationally unified entity (one life). Compensation is possible.  
     - *Clause:* 1 (Relational Unity).  

  2. **Save 1 vs. 5 from death (Verdict: Save 5)**  
     - *Fits:* Harms are equal and severe, but aggregation is permitted because no *individual* is singled out for a disproportionate sacrifice. The burden of death is identical for all.  
     - *Clause:* 1 (Aggregation permitted when no threshold violation).  

  3. **Save 1 from death vs. 5 from hand loss (Verdict: Save the 1)**  
     - *Fits:* Death is a significant, non-compensable burden; hand losses are significant but lesser. You cannot aggregate lesser harms to override one person's claim against catastrophe.  
     - *Clause:* 2 (Aggregation forbidden).  

  4. **Public health risk (Verdict: Fine)**  
     - *Fits:* The burden (micro-risk) is trivial per person. No one could reasonably complain they’ve been meaningfully harmed.  
     - *Clause:* 1 (Trivial Burden).  

  5. **Forced labor on one to save 4 (Verdict: Not fine)**  
     - *Fits:* Forced labor is a significant, autonomy-violating burden. No relational unity with beneficiaries → aggregation forbidden.  
     - *Clause:* 2 (Significant burden + no unity).  
     - *Why separateness matters:* Even if your mother wouldn’t accept forced labor for 5 years (intrapersonal threshold), the *reason* it’s impermissible interpersonally is the lack of shared identity for compensation. Separateness explains why we can’t "pool" lives.  

  6. **Future dementia self (Verdict: Reluctant → Near-interpersonal)**  
     - *Fits:* The future self lacks psychological continuity/relational unity with the present self. Burden on the future self is non-compensable *by her* → treated as a distinct "person" for sacrifice.  
     - *Saves separateness:* Unlike Parfit, TSRA says relational unity (not just psychological continuity) enables compensation. Ordinary prudence works because present/future selves *are* unified by identity. Here, unity is broken.  

  7. **Co-conscious pain (Verdict: Worse than one, less than two)**  
     - *Fits:* The pain is non-trivial and significant, but shared across partially unified subjects → partial aggregation.  
     - *Not utilitarian:* TSRA tracks "subjective experiences" within unified frameworks, not total suffering. The pain is *doubly bad* because two subjects experience it, but *less than two separate pains* because they share a token experience (reducing total "units" of suffering).  

  ---

  ### Where TSRA Strains (and What to Concede)
  - **Case 3 Breakdown?** Your verdict (save the 1) fits TSRA perfectly. If this *feels* unstable, it’s because **"significance" is scalar**, not binary. Death vs. hand loss is clear-cut, but what about death vs. quadriplegia? TSRA needs a **clarity supplement**: *Aggregation is forbidden when burdens differ in kind (e.g., existential vs. non-existential) or orders of magnitude.*  
  - **Case 5 vs. Case 4:** The difference *is* threshold-driven (burden significance), but separateness explains *why* thresholds apply interpersonally: compensation is impossible across lives. Within one life, high thresholds (forced labor) may still veto trade-offs, but the *justification* differs (autonomy vs. separateness).  

  ---

  ### Answers to Your New Cases
  **(a) Benefits: 20 years for one vs. 2 months for thirty**  
  - **TSRA verdict:** *Favor the 20 years for one.*  
  - **Why:** Benefits are not symmetric to burdens. A trivial benefit (2 months) may be below the threshold for meaningful impact per person—no one could reasonably demand society prioritize it. The 20-year benefit is transformative.  
  - **Asymmetry justified:** Burdens impose claims against harm; benefits create opportunities. Small benefits don’t aggregate to override a life-altering gain for one.  

  **(b) Household of five vs. one stranger**  
  - **TSRA verdict:** *Save the household from lesser harms over the stranger’s greater harm, if harms are comparable.*  
  - **Why:** The household has relational unity (shared identity/resources → compensation possible). Saving them is akin to saving one life with multiple facets. *But:* If the stranger faces death and each household member faces a broken arm, save the stranger. Significance thresholds still apply.  
  - **Not sentimentality:** Deep social unity can create moral partiality (e.g., families in triage). Test: Would they *themselves* endorse the sacrifice as "for us"?  

  ---

  ### Contractualist Pairwise Comparison Test (Scanlon-style)
  **For Case 4 (Public Health):**  
  - *Principle:* "No one could reasonably reject a policy that imposes a trivial risk (1/10M death chance) to save 4 lives, because the burden is too small to ground a complaint. Each person’s complaint ('I might die!') is outweighed by the complaint of those who would die without the policy ('We *will* die!')."  
  - *Avoids aggregation?* Yes, by comparing individual complaints. The "4 deaths prevented" isn’t summed; each victim’s complaint is considered separately against each risk-bearer’s complaint. No one’s complaint is outweighed by *numbers*—it’s outweighed by the *severity* of others’ complaints.  
  - *Problem:* In Case 3, the five hand-loss victims’ complaints *individually* lose to the death victim’s complaint (death > hand loss). Saves your verdict.  

  ---

  ### The Weak Link: Case 7 (Co-Conscious Pain)
  This is where your intuition clashes most with separateness. If one token pain shared by two subjects is "less bad than two separate pains," you *are* tracking total suffering—not just person-counting. **Concede this verdict or refine TSRA:**  
  - *Option 1:* Drop the verdict. Say the pain is *fully* bad for both subjects → equivalent to two pains.  
  - *Option 2:* Revise TSRA: "Shared experiences reduce per-capita badness because they dilute subjective isolation." But this edges toward utilitarianism.  

  ### Final Handout-Ready Principle  
  **Threshold-Sensitive Relational Aggregation (TSRA)**  
  1. *Aggregate burdens only if:*  
     - (a) Each burden is **trivial** (no reasonable complaint), **or**  
     - (b) Burdens/benefits fall within a **relationally unified entity** (e.g., one life, deeply shared household).  
  2. *Never impose a **significant burden** on one to avert lesser burdens for others, unless (1b) applies.*  
     - **Significant burden:** Harm that is non-compensable, autonomy-violating, or existential.  
     - **Relational unity:** Identity or shared life allowing mutual compensation.  

  **Motivating Cases:**  
  - Dental work (1b): Unity enables compensation.  
  - Save 5 vs. 1 (1a/2): Equal burdens → no threshold breach.  
  - Hand loss vs. death (2): Significance threshold protects the one.  
  - Public health (1a): Trivial burdens.  
  - Forced labor (2): No unity + significance.  
  - Dementia self (2): Broken unity → like separateness.  

  ---
  **Your weakest verdict is Case 7.** It subtly assumes suffering is a "poolable" bad. If you keep it, you dilute separateness; if you drop it, TSRA holds. Otherwise, your intuitions are defensible—they reveal a non-utilitarian but *threshold-driven* morality where personhood matters through relational unity and veto-power over catastrophic harms.
