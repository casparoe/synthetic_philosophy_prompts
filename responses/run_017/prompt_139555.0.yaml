answer: |-
  ## Recommendation Memorandum  
  **To:** Foundations Panel Members  
  **From:** [Your Name], Panel Member  
  **Date:** 19 March 2023  
  **Subject:** Draft Recommendation for "Structural Continuity in Quantum Gravity" Programme  

  ### Recommendation (98 words)  
  I recommend funding "Structural Continuity in Quantum Gravity" **with conditions**. While the programme’s avoidance of ontological commitment raises valid concerns, its focus on structural persistence across theory changes aligns with historical patterns in physics (e.g., Lagrangian formalisms surviving Newtonian → quantum transitions). However, the proposed falsification criterion—a successor theory retaining *none* of its flagged structures—is currently underspecified and risks triviality. Funding should be contingent on the team explicitly defining: (1) which *specific mathematical relations* constitute "salient structure," (2) how their retention/non-retention would be assessed, and (3) interim milestones demonstrating empirical relevance. Without these, the proposal fails our empiricism mandate.  

  ### Why the Discarded-Ontology Argument Overreaches (249 words)  
  The critique that "structure requires ontological grounding" overreaches by conflating two distinct epistemic goals: *describing reality’s furniture* versus *identifying robust inferential tools*. Physics routinely advances by separating mathematical structures from their initial ontological interpretations (e.g., quantum operators decoupled from Bohr’s planetary atoms). The programme’s premise—that structural continuity exists independently of specific ontologies—is neither hollow nor trivial when properly constrained.  

  First, "structure" need not be ontologically unanchored; it can reference *causal-nomological relations* (e.g., symmetries governing dynamics) without specifying relata. Claiming this reduces to triviality ignores how structural realism distinguishes *contingent* formal patterns (e.g., idealizations) from *explanatorily indispensable* ones (e.g., gauge invariance). Second, demanding ontological commitments upfront risks dogmatism: general relativity’s geometric structure was initially mathematical, not ontological. The evasion charge assumes realism requires entity-focused falsification, but structural approaches test whether successor theories *preserve explanatory relationships* (e.g., continuity of Lorentz invariance). Here, falsification *is* empirical: if future quantum gravity theories systematically abandon all structures flagged as persistent (e.g., diffeomorphism symmetry), the core claim fails. The challenge is ensuring these structures are defined rigorously—not dismissing structuralism itself.  

  ### The Strongest Case for Rejection (198 words)  
  The strongest rejection argument hinges on empirical accountability and opportunity cost. Our charter demands programmes specify what observations *could disconfirm* their claims. The proposal’s offered criterion—"no structural retention in a successor theory"—is vague and non-empirical until such a theory exists, potentially deferring falsification indefinitely. This risks funding a self-insulating mathematical exercise.  

  Moreover, the programme explicitly avoids novel predictions, treating theory change as a retrospective pattern. This contravenes foundational physics’ imperative to guide empirical inquiry, not just rationalize history. The alternative tabletop experiment (testing gravitational superposition) offers immediate empirical stakes, clear falsifiability (a null result disproves superposition), and technological spillovers. Funding this programme thus sacrifices concrete progress for speculative meta-theory. Given finite resources, endorsing a project that dismisses ontology while invoking "realism" via structure may undermine the panel’s credibility, signalling that empirical anchoring is negotiable. If structural continuity research cannot specify testable constraints beyond abstract survival, it belongs in philosophy, not physics funding streams.  

  ### Conditions for Funding (199 words)  
  Funding approval must be conditional on these revisions:  
  1. **Specification of Salient Structures:** By Year 1, identify ≤3 core mathematical structures (e.g., specific algebraic relations, topological invariants) claimed to persist, justifying their selection via historical precedent (e.g., Hamiltonian frameworks) *and* dynamical necessity (e.g., role in generating equations of motion). Avoid triviality by excluding structures realizable by arbitrary object-sets.  
  2. **Falsification Protocol:** Define empirical scenarios where structural discontinuity *could* manifest pre-successor theory. E.g., if candidate quantum gravity models (e.g., loop quantum gravity) *already* discard a flagged structure *without loss of explanatory power*, this must count as disconfirming evidence. Commit to publishing such assessments biennially.  
  3. **Empirical Interfaces:** Require collaboration with experimental groups (e.g., quantum simulation labs) by Year 3 to explore how flagged structures constrain observable phenomena (e.g., entanglement in curved spacetime).  
  4. **Milestone Oversight:** Reduce initial funding to 4 years pending review. The panel will assess progress against Conditions 1–3 before releasing remaining funds.  

  Failure to meet these voids funding. They compel ontological neutrality to engage empirical reality without reinstating hidden commitments.  

  ---  
  **Vote Deadline:** Friday, 23 March, 10:00 AM  
  *Attachments: Programme Summary, Tabletop Experiment Proposal*
