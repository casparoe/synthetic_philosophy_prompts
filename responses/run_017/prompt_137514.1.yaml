prompt: |-
  hi — novelist here, not a philosopher, and I'm hoping you can tell me whether something I keep tripping over has a name, because I've had it described to me in a way that doesn't quite match what I'm seeing.

  Twice now I've had the same argument in a workshop about the same scene with one thing changed. Scene A: a hydrologist named Ilse diverts a river to keep a town from washing away. She knows — and says so, in first-person narration, in the scene — that the diversion will silt up a downstream marsh that a neighbouring village lives off. There's no way to save both. The text is explicit that she has no feelings about the marsh either way; she just wants the town dry. My readers come out of it convinced she destroyed the marsh on purpose, that she wanted it gone, and that this is secretly what the chapter is "about." When I add a line where she says out loud that she's sorry about the marsh and wishes there were another way, they read it as insincere, or as a tell.

  Scene B: identical, same sentences, same foresight, same lack of alternatives, except the side effect is good — the diverted water refills a marsh that's been dry for years. She's equally indifferent in the narration. Nobody says she restored the marsh on purpose or wanted to. And here's the bit I actually care about: in B, one line is enough. If she says "I didn't have the marsh in mind at all," readers accept it and stop giving her credit for it. In A, nothing works. I've tryed three drafts. The intentional reading sticks, and every line I add to soften it gets absorbed as further evidence — the denial becomes the proof.

  So far as I can tell that's two things, and I can't tell whether they're one: (1) whether a side effect is bad or good decides whether we hear it as something the character did at all, as opposed to something that just happened; and (2) the bad version is sticky in a way the good version isn't — it resists correction and feeds on it, while the good version evaporates the moment you poke it.

  Someone at a reading waved at "the Knobe effect," but when I looked into it, it seemed to be about what people say when you ask them a direct question in a survey, which isn't quite the same as readers holding onto an interpretation against the plain sense of the text. And (2) — the part where the disclaimer is read as a confession — I can't find anything for at all.

  So: is this one named thing or two? What are the nearest established concepts for each, and how exactly does each differ from what I've described? Does it matter that she had no alternative, that she's stated to be indifferent, that the harm falls on a village rather than a person — i.e. which of those details are load-bearing and which are incidental? If part of it has no name, coin one and define it tightly enough that it doesn't just collapse into the general claim that people are quicker to blame than to praise, and give me a nearby case that would NOT be an instance of it. I don't just want a label — I want the carving, since I'm going to have to make a decision about this scene either way.
reasoning: |-
  Okay, the user is a novelist grappling with a specific reader interpretation issue across two versions of a scene. Let me unpack this carefully. 

  First, the core problem: readers persistently attribute malicious intent to the protagonist Ilse in Scene A (where her action has a harmful side effect) despite explicit textual evidence to the contrary. This attribution resists correction attempts. Meanwhile in Scene B (beneficial side effect), readers readily accept her stated indifference. 

  Hmm, this feels like more than just standard protagonist skepticism. The asymmetry is striking - harmful interpretations seem "sticky" while beneficial ones are fragile. The user mentions checking the Knobe effect but rightly notes it's about survey responses, not narrative interpretation. 

  Let me break this down into components:
  1) **Intentionality bias for harm**: Readers perceive harmful outcomes as deliberate even when contradicted by text. This seems related to moral typecasting in psychology - we cognitively frame harm-doers as intentional agents.
  2) **Disavowal backfire effect**: Attempts to deny harmful intent are read as confirmation. Reminds me of protest-too-much tropes or "methinks the lady doth protest too much" phenomenon. 

  Important nuances: 
  - The indifference declaration works in Scene B but backfires in Scene A. Suggests moral valence overrides textual evidence.
  - The village (vs individual) victim detail might matter - collective harm could trigger utilitarian dilemma frameworks.
  - The no-alternative element is crucial. Readers might subconsciously reject "necessary evil" narratives without sufficient justification.

  For naming... 
  The harm-specific component feels like "moral outcome bias" - outcomes shape intent perception disproportionately for harm. 
  The disclaimer failure is pure "Cassandra's Paradox" (disclaimers read as guilt indicators). 

  Nearby non-examples to test boundaries:
  - If Ilse expressed joy about the marsh destruction, that WOULD fit intentional harm.
  - If the harm was clearly accidental (landslide during diversion), readers might accept it as unintended.

  User's deeper needs:
  They're not just labeling - they need actionable narrative solutions. Probably frustrated after 3 failed drafts. Might be questioning whether to rewrite or lean into the interpretation. Should emphasize that this isn't their failure - it's cognitive wiring they can weaponize.

  Final thought: The "stickiness" difference suggests readers invest harmful outcomes with meaning ("this must be thematically important") while dismissing beneficial ones as happenstance. That's gold for thematic resonance if harnessed.
answer: |-
  Your observation cuts to the heart of how readers process moral agency in narrative, and you've pinpointed two distinct but intertwined phenomena. Neither maps perfectly onto existing concepts like the Knobe effect, but we can carve this precisely:

  ### 1. **Asymmetric Intentionality Attribution (The "Moral Outcome Bias")**
     - **What it is:** Readers are significantly more likely to attribute *intentionality* to a character for *harmful* side effects than for *beneficial* ones, **even with identical stated indifference and awareness**.
     - **How it differs from Knobe:** The Knobe effect shows people are more likely to *say* an agent *intentionally* caused a *harmful* side effect vs. a beneficial one in hypothetical vignettes. Your case is **narrative interpretation resilience**: readers *resist textual evidence* contradicting their harmful-intent attribution in a way they don't for beneficial outcomes. Knobe is about survey answers; this is about embedded narrative cognition.
     - **Why it happens:** Harm triggers **moral typecasting**. We subconsciously frame agents who cause harm as "actors" with motives, while beneficiaries of fortuitous good are "recipients" of circumstance. Harm demands moral accountability, so readers assign intent to fulfill that need.
     - **Load-bearing details:** 
       - **Indifference + Foresight:** Critical. If Ilse were ignorant, it wouldn't trigger. If she cared, it would confirm intent. Her *stated indifference* paradoxically *fuels* suspicion in the harm case ("Why mention it if she doesn't care? She must be hiding guilt").
       - **No Alternatives:** Essential. If alternatives existed, readers would see harm as chosen malice. With no choice, they still see intent but rationalize it as "callous prioritization" rather than "active malice." The lack of alternatives shifts the framing but doesn't negate perceived agency.
       - **Victim Type (Village vs. Person):** Likely incidental. Collective harm (village) still triggers moral outrage. Individual harm might amplify emotional resonance but isn't necessary for the effect.
     - **Non-Example:** If Ilse diverted the river *unintentionally* causing harm (e.g., she miscalculated flow dynamics), readers wouldn't insist she *wanted* the harm. The foresight/indifference combo is key.

  ### 2. **Disavowal Backfire Effect (The "Cassandra's Paradox")**
     - **What it is:** Attempts by a character to *deny harmful intent* are interpreted as *evidence of guilt/deception*, while identical disclaimers for beneficial effects are accepted at face value.
     - **Mechanism:** Harm triggers **motivated skepticism**. Readers expect guilty agents to lie. Thus, denials ("I didn't want this!") are read as performative dissembling ("The lady doth protest too much"). For benefits, no skepticism is triggered—disclaimers reinforce "modesty" or "honesty."
     - **Why "stickier" than good outcomes:** Harm creates **cognitive dissonance**. Readers feel the moral imbalance (town saved > marsh destroyed) and subconsciously seek justification. Assigning intent to Ilse resolves the dissonance ("It wasn't tragic necessity; she *chose* it"). Denials threaten this resolution, so they're rejected.
     - **Load-bearing details:** 
       - **Indifference**: The core fuel. Saying "I don't care" about harm reads as sociopathic; saying it about good reads as pragmatic. 
       - **First-Person Narration**: Crucial. An omniscient narrator stating Ilse's indifference might be trusted. A character's *own* denial in 1st-person feels inherently unreliable when harm is involved.
       - **"Sorry" Statements**: Seen as performative because they contradict her stated indifference. Readers think: "If she's *truly* indifferent, why apologize? She must feel guilty but won't admit it."
     - **Non-Example:** If a *trusted external voice* (e.g., a mentor) stated Ilse had no ill intent, readers *might* accept it. But Ilse's own voice? Suspect.

  ### Why These Are Two Distinct (but Linked) Phenomena
  1. **Asymmetric Intentionality** explains *why* readers initially assign intent to harm but not benefit.
  2. **Disavowal Backfire** explains *why* attempts to correct that assignment fail catastrophically for harm but succeed for benefit.

  You could combine them as **"Narrative Moral Agency Asymmetry" (NMAA)**, but the sub-components matter for fixing your scene.

  ---

  ### Practical Solutions for Your Scene
  Since Ilse's indifference is the catalyst, lean into it *strategically*:
  1. **Embrace the Paradox**: Make her indifference *thematic*. If the story explores moral detachment in crisis, let readers sit with discomfort. Use secondary characters to voice their suspicion ("You knew, didn't you? You wanted that marsh dead.") and have Ilse *truly* not understand their anger.
  2. **Shift Focus to Cost, Not Intent**: Don't have Ilse disclaim intent. Instead, show her hyper-focused on the *technical challenge* of saving the town. Have her ignore/brusquely dismiss mentions of the marsh. Readers will still see callousness, but not conspiracy.
  3. **Externalize the Indifference**: Use an objective descriptor *from the narrator* (even in 1st-person): "The marsh's death was a math problem to me: X silt load ÷ Y flow rate = inevitable. Villages starve; towns survive. No anger, no sorrow. Just numbers." This makes indifference explicit *without* triggering the backfire (it's framed as analysis, not denial).
  4. **Contrast with Benefit Scenario**: If Scene B exists in your story, use it *alongside* Scene A. When Ilse is denied credit for the good marsh, highlight her identical indifference. This juxtaposition can signal to attentive readers that intent isn't the point—systemic indifference is.

  **Bottom Line**: Your readers aren't "wrong"—they're human. Harm compels us to find a guilty mind. Accept that Ilse's indifference in the face of harm will *always* read as complicity to some. Your choice is whether to fight it (by making her care, which changes her character) or weaponize it (to explore how necessity breeds moral blindness). Neither is incorrect, but the asymmetry you've discovered is real and rooted in deep cognitive biases.
