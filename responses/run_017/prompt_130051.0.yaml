prompt: |-
  There's a pattern that keeps turning up in our board game group and I don't have a word for it, and I've started to suspect it's actually two or three different patterns that just look alike.

  We've kept a house rules binder for about six years. One of the rules in it is the rule for changing the rules: a proposal needs a week's notice and a majority of whoever turns up that night. Everything is in the same binder at the same level — there's no special higher section that the change-the-rules rule lives in, it's just rule 12 out of about thirty — and I think that's part of why the arguments about it go nowhere.

  First case. Someone proposed adding "this rule cannot be changed or removed except by a two-thirds vote." It got in on an ordinary majority, so it came in through a door it then locked behind itself. Half the table thought that was obviously a bit of a cheat, half thought that's just what rules are. What I can't get past is that we'd made the same kind of move in the other direction a year earlier: someone proposed lowering the bar for rule changes to a simple majority of whoever was in the room, no notice needed, and it passed under the old stricter rule, and literally nobody objected. If there's something wrong with using the rule-change rule to change the rule-change rule, it should be wrong both ways. It only felt wrong one way. So whatever bothered us, it wasn't the self-referential bit on its own.

  Second case, the one I keep thinking about. Someone proposed: any rule that has been in the binder for more than a year can only be removed by a two-thirds vote. Note that this rule isn't protected when it's proposed — on day one you can kill it with a normal majority. It gets hard to kill later. Someone at the table called it a rule that starts out harmless and grows teeth. A year later we wanted rid of it and couldn't, and then someone found the trick: change one word of it, then remove the amended version, because the amended version hasn't been in the binder for a year yet. We did exactly that. Everyone agreed it was within the letter of the rules and completly against the point of them.

  Third thing, which might be a seperate animal entirely. Someone once proposed lowering the threshold for rule changes from two-thirds to a simple majority, and the vote came in between the two — enough for a majority, not enough for two-thirds. So whether it had passed at all depended on whether the old rule or the new rule was doing the counting. We never agreed and just dropped it. That felt different from the other two, which were both cases of "it definately passed, it's just unfair."

  So: is there a name for any of this? Someone used the word "entrenchment" once, but as far as I can tell that just means a rule that's hard to change, which covers plenty of things that aren't this. And are the first and second cases really the same thing, or is the grows-teeth one a different problem? I'm asking partly because we're rewriting the binder from scratch over the winter and I want to know what to actually forbid — but I don't want a label on its own, I want to know where the edges are. Specifically:

  - Is the problem in the first case just that the bar for getting out is higher than the bar for getting in? If a rule needed two-thirds to pass and two-thirds to remove, does the objection vanish? And what about the reverse — a rule that comes in hard and goes out easy? Is that the same phenomenon pointing the other way, or is there something specifically suspicious about making yourself harder to remove that has no mirror version?
  - In the second case, is the question of whether the one-word trick works really a question about when a rule stops being the same rule? Because that seems like a different issue from anything about vote thresholds.
  - And is the third case — where you can't tell whether the thing passed at all — in the same family, or is "rules that apply to their own enactment" a different topic that happens to show up in the same binder?

  If some of this has no settled name, I'd rather you say so and tell me how you'd cut it up yourself, with the boundary cases, than give me a term and a paragraph.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're dealing with recurring issues in their board game group's rule-making process, and they want to understand the underlying patterns. The user has described three specific cases and is questioning if they're related or distinct problems. Their deeper need seems to be about creating a fair and clear rule system for their binder rewrite, avoiding past pitfalls.

  First, I need to recall relevant concepts. Self-amendment in legal theory comes to mind—where a rule changes itself. The first case where a rule locks itself in after passing with a lower threshold is a classic example. The user’s observation that it felt wrong only one way is interesting. It suggests that asymmetry in rule changes—making it harder to remove than to add—is the core issue, not self-reference itself. The Locke vs. Rousseau debate here is key: should rules bind future majorities? 

  The second case involves rules that gain protection over time. The user calls it "growing teeth," which is vivid. The trick of amending the rule to reset its age shows that the problem lies in how identity is defined. When does a modified rule become a new entity? This ties into the Ship of Theseus paradox. The user’s group exploited this ambiguity, which highlights the need for clear definitions of rule identity in their system.

  The third case is about voting thresholds during a rule change. The ambiguity arises when the vote count falls between the old and new requirements. This is a separate issue from the others because it’s about temporal application—which rule applies at the moment of voting. Legal systems handle this with "point of order" rules, but the user’s group lacks that, leading to stalemate.

  Now, the user’s specific questions:  
  For the first case, the problem is indeed the asymmetric entrenchment. If the thresholds for addition and removal are the same, the issue vanishes. But making a rule easier to remove than to add might not feel unfair because it doesn’t bind future decisions. The asymmetry direction matters because it restricts future agency. 

  In the second case, the one-word trick exploits the lack of a clear rule identity definition. Without criteria for what constitutes a "change" vs. a "new rule," the group found a loophole. This is distinct from vote thresholds; it’s about ontology—how rules are individuated.

  The third case is different. It’s about temporal conflict in rule application. During a transition, which standard applies? This requires meta-rules to resolve, like a "succession clause." It’s a separate category from entrenchment or rule identity.

  The user’s unspoken need is clarity for their rewrite. They want to prevent these issues by defining boundaries. Terms like "self-entrenchment," "temporal entrenchment," and "rule identity persistence" might help. But more importantly, they need structural solutions: symmetric thresholds, clear amendment definitions, and transition rules. 

  I should also consider their group’s dynamics. The fact that past asymmetrical changes weren’t contested until they became inconvenient suggests that perceived fairness is situational. Providing clear principles might help them design a more robust system.
answer: |-
  Based on your detailed cases, you've hit upon fascinating and distinct problems in self-governance systems. While there's no single perfect term covering all, here's a breakdown using established concepts and clear boundaries:

  1.  **Case 1 (Locking the Door Behind Itself):**
      *   **Core Problem:** **Asymmetric Self-Entrenchment.**
      *   **Description:** A rule governing rule-changes is amended to make *future* changes to *itself* (or the entire system) harder than the threshold used to enact *that specific amendment*. The rule exploits a lower threshold to impose a higher one on its future self.
      *   **Why it felt wrong one-way:** The asymmetry is key. Using a simple majority to lock in a 2/3rds requirement feels like "pulling up the ladder." Using a strict old rule to enact a laxer new rule feels like *progress* or *liberalization*, not self-binding. The inherent suspicion is about **binding future majorities against their will using a weaker past mandate.**
      *   **Your Specific Questions:**
          *   **Is the problem just higher out than in?** Yes, specifically the *asymmetry* applied *to the rule-change rule itself*. A rule requiring 2/3rds to pass *and* 2/3rds to remove is **Symmetric Entrenchment**. This is generally uncontroversial (though perhaps unwise for your rule-change rule specifically). It treats entry and exit equally.
          *   **What about reverse asymmetry (hard in, easy out)?** This is **Asymmetric Disentrenchment/Liberalization.** While logically the mirror image, it lacks the inherent "suspicion" because:
              *   It doesn't bind future majorities; it liberates them.
              *   It feels like *removing* a barrier, not erecting one.
              *   It doesn't risk "locking in" a rule against the will of a future majority that could have passed it under the new, easier standard.

  2.  **Case 2 (The Rule That Grew Teeth):**
      *   **Core Problem:** **Temporal Entrenchment with Ambiguous Rule Identity.**
      *   **Description:** A rule gains protection over time, but the system lacks a clear definition of what constitutes "the same rule" for the purpose of applying the temporal protection. This creates a loophole: amend slightly to reset the clock, then remove the "new" version easily.
      *   **Is this different from Case 1?** Yes, fundamentally.
          *   Case 1 is about **voting threshold asymmetry** applied *immediately* upon enactment of the new rule-change rule.
          *   Case 2 is about **protection increasing over time** based on duration, creating a loophole based on **rule identity**.
      *   **Your Specific Question:**
          *   **Is the one-word trick a question of rule identity?** Absolutely. This is the **Ship of Theseus Paradox applied to rules.** When does changing one word (or X%) of a rule make it a *new* rule? Your group exploited the lack of a defined boundary. **The core problem here isn't thresholds; it's the lack of a meta-rule defining "sameness" for amendment vs. replacement.** The temporal protection created the *incentive* to exploit this ambiguity.

  3.  **Case 3 (The Vote in Limbo):**
      *   **Core Problem:** **Temporal Application Ambiguity / Bootstrap Problem.**
      *   **Description:** When a rule-change proposal itself alters the voting threshold required for rule changes, ambiguity arises about *which threshold applies to the vote on the change itself* if the vote count falls between the old and new thresholds. It's a specific paradox of self-reference during the transition.
      *   **Is this related to Case 1 & 2?** Only tangentially. It involves the rule-change rule and self-reference, but it's a distinct category:
          *   Cases 1 & 2 involve rules that *definitely passed* but have problematic *ongoing effects* (asymmetry, exploitability).
          *   Case 3 is about *uncertainty over whether the rule passed at all* due to a conflict in temporal application during the vote. It's a problem of **meta-rule conflict at the moment of enactment.**
      *   **Why it feels different:** As you noted, it wasn't about fairness/injustice of an existing rule; it was an unresolvable ambiguity preventing a clear outcome.

  **Summary & Labels for Your Binder:**

  | Case | Core Problem                     | Key Concept                      | Why Problematic                           | Solution for Rewrite                     |
  | :--- | :------------------------------- | :------------------------------- | :---------------------------------------- | :--------------------------------------- |
  | **1** | Rule exploits lower threshold to bind future changes to higher one | **Asymmetric Self-Entrenchment** | Binds future majorities unfairly          | Require symmetric thresholds for rule-change rule |
  | **2** | Rule gains protection over time; identity loophole exploited | **Temporal Entrenchment + Rule Identity Ambiguity** | Enables circumvention via minor amendments | Define "rule identity" criteria; limit temporal entrenchment |
  | **3** | Uncertain which threshold applies to vote | **Temporal Application Ambiguity** | Creates irresolvable procedural deadlock  | Add "succession clause" for transitions  |

  **Recommendations for Rewriting Your Binder:**

  1.  **Rule-Change Rule (Avoid Asymmetric Self-Entrenchment):** Explicitly state the threshold for changing *the rule-change rule itself*. Strongly consider making it **symmetric** (e.g., "Changes to this rule require a 2/3 majority"). *Forbid* any amendment attempting to make future changes to itself *harder* than the threshold used to pass *that amendment*.
  2.  **Rule Identity (Prevent Ship of Theseus Exploits):** Define what constitutes an "amendment" vs. a "replacement" for the purpose of any rules involving duration or protection (like your "grows teeth" rule). E.g., "A rule retains its identity and original enactment date if amended, provided the core purpose and mechanism remain substantially unchanged. A replacement rule establishing a significantly different purpose or mechanism is considered new." Make this definition *very* hard to change.
  3.  **Temporal Application (Resolve Limbo):** Add a "succession clause" to your rule-change rule: **"Any proposal to amend this rule shall be voted upon using the threshold in effect *at the time the proposal was submitted*."** This prevents the ambiguity of Case 3.
  4.  **General Entrenchment:** Be *very* cautious with any form of entrenchment (making rules harder to change than others). If used, ensure:
      *   The entrenching clause is itself entrenched or extremely clear.
      *   The criteria for protection are unambiguous (e.g., "Rules marked 'Constitutional' require 2/3...").
      *   Avoid temporal entrenchment ("grows teeth") unless you have a perfect rule identity definition and a clear need.

  **Boundaries Clarified:**

  *   **Asymmetric Self-Entrenchment** is distinct because it exploits a *lower present threshold* to impose a *higher future threshold* on the *same meta-rule*. The reverse asymmetry lacks the problematic binding effect. Symmetric thresholds are fine.
  *   **Temporal Entrenchment Loopholes** are primarily a problem of **rule identity definition**, separate from vote thresholds. The vote threshold issue was just the *mechanism* of the exploit.
  *   **Temporal Application Ambiguity** is a unique problem of **transitional moments** when the rule governing the vote is itself being changed. It requires a specific meta-meta-rule (like the succession clause) to resolve.

  The common thread isn't a single term, but the **complexities of self-reference and self-amendment in rule systems.** By addressing these three distinct patterns explicitly in your new rule-change rule and meta-rules, you can build a much more robust and less arguable system. Focus on symmetry for thresholds, crystal-clear rule identity, and unambiguous transitional rules.
