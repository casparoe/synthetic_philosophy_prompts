  For the rule itself, the novelty isn't about one new object but about new context - the discovery of Kuiper Belt objects changed what counted as relevant similarities. This differs from Kripke's isolated "+" example. When constructing a skeptical alternative ("plet"), I find the pre-2006 practice was too rich with precedents like Ceres to allow plausible competitors - which suggests Kripke's quus example relies on artificially impoverished conditions.

  The codification question is crucial. The IAU claimed to be discovering Pluto's true status while actually legislating new criteria. The third condition (cleared orbit) is relational, not intrinsic, making descriptive claims problematic. This exposes how Kripke's framework struggles to distinguish between describing existing rules and creating new ones.

  Finally, the lack of convergence after the decision challenges Kripke's community-based solution. The ongoing dissent suggests either the community wasn't truly aligned, or that the dispute was merely verbal despite real anger and institutional stakes. The Ceres precedent shows past stipulation but doesn't prove an existing rule was followed.

  The bottom line is that Kripke's framework illuminates the case but struggles with key aspects: community authority, contextual novelty, and the descriptive/legislative ambiguity. The persistent dissent particularly challenges the sufficiency of community agreement.
answer: |-
  **Bottom line:** Kripke's framework illuminates the Pluto episode's core tension—distinguishing descriptive rule-discovery from legislative stipulation—and is challenged by the persistent dissent, revealing limitations in handling community authority and contextual novelty, while the richness of pre-2006 practice resists skeptical competitors like "plet".

  1.  **Rule-Follower:** Kripke's skeptic targets the *individual speaker* ("What did *I* mean?"). The skeptical solution relies on the *community* for justification. The IAU acts as a *designated sub-community with institutional authority* to codify rules for the collective practice. The episode shows communities *can* function as rule-followers *procedurally* (voting, precedent) but the persistent dissent demonstrates they are not monolithic "speakers," challenging Kripke's smooth shift from individual to community. The authority is crucial; the IAU *imposes* a rule others might reject.

  2.  **Rule & Novelty:** The implicit pre-2006 rule was roughly: "A planet is a Sun-orbiting body large enough to be round and dynamically dominant (*like* the major planets, *unlike* asteroids)." The novelty wasn't a single object, but a *contextual shift*: the Kuiper Belt revealed Pluto wasn't dynamically unique among numerous round bodies. Kripke's argument, focused on *one* novel case (e.g., "68+57"), is strained. The "new case" is Pluto *in the new context of many similar objects*, forcing a re-evaluation of similarity judgments ("dominance") central to the rule, not just an addition problem.

  3.  **Skeptical Argument & Non-Standard Rule ("Plet"):** Constructing a plausible "plet" is difficult. A skeptic might propose: "A plet is a Sun-orbiting body large enough to be round *or* historically classified as a planet before 1930." This fits all pre-2006 applications (Pluto grandfathered in, Ceres excluded as reclassified earlier) and "rules in" Pluto. However, the pre-2006 practice is **too rich** for easy skepticism. The Ceres precedent explicitly shows reclassification based on population context was part of the practice. Astronomers didn't *just* apply "planet"; they debated criteria and adapted. This abundance of explicit reasoning and precedent makes the skeptic's "no fact" claim less compelling than for Kripke's isolated "+" user. The skeptic needs relative impoverishment.

  4.  **Codification & Kripke's Challenge:** The skeptical solution **collapses description and retroactive constitution**. It cannot distinguish them because both rely on community agreement *now* about past usage. The IAU presented its definition as *retroactively constitutive* ("Pluto never *was* a planet under the *true* rule we discovered"), but its authority only allowed *legislation* ("Here's the rule we adopt *now*"). Kripke's framework struggles with this tension. The *relational* nature of "cleared the neighbourhood" (dependent on orbit/neighbours) is key:
      *   It **wasn't a bad description** of the *implicit* criterion of dominance/precedence seen in contrasts with asteroids/gas giants.
      *   It **revealed the antecedent rule was indeterminate/silent** on how strictly "dominance" applied in the Kuiper Belt. Silence (no prior ruling on this specific context) *is* a form of indeterminacy for Kripke – there was no fact about whether Pluto satisfied "dominant" *before* the IAU ruled.

  5.  **Lack of Convergence & Vindication/Tension:** The persistent dissent **is an anomaly** for the skeptical solution's emphasis on community agreement as the justificatory bedrock. Kripke's framework predicts the IAU vote *should* settle the matter for the community (as the relevant "agreement"). The ongoing dispute shows the designated authority *failed* to secure community-wide agreement. **This doesn't make the dispute merely verbal.** The stakes were real: research focus, funding, textbook content, cultural significance. Kripke *can* explain arguing: disputants are advocating for which rule the community *ought* to adopt/retroactively constitute based on perceived past practice and future utility. However, the solution **underestimates institutional power** – textbooks changed based on authority, not consensus, highlighting a gap.
      *   **Right Action (Kripkean View):** The IAU should explicitly *legislate* a rule (like creating "dwarf planet") based on utility for science/communication, acknowledging it as new, not pretend to discover a hidden fact. The Ceres precedent shows *ad hoc stipulation*, not evidence of an *antecedent determinate rule* for such occasions; it only shows the practice *contained methods for handling indeterminacy* (reclassification).

  **Explicit Framework Limits:** Kripke is silent on institutional authority vs. organic community, struggles with novelty arising from contextual shifts rather than single cases, and his impoverished "+" example makes skepticism easier than the IAU's rich historical record allows. The collapse of description/retroactive constitution is inherent to the skeptical solution. The Ceres precedent is interpreted here as evidence of stipulation practice, not a hidden rule.
