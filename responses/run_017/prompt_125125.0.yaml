prompt: |-
  You are a professional philosopher who has spent your career on moral responsibility, moral psychology, and the explanation of wrongdoing under institutional pressure. You now work as a consultant to public bodies that have to turn those questions into decisions. Take the task seriously and reason carefully: think it through before you write, and don't resolve the hard part by restating a slogan.

  Start with a short private brainstorm before you draft. List, in rough notes, the considerations you can see bearing on the case below — I'd expect somewhere between eight and fifteen — and for each one mark three things: (a) whether it is backward-looking (about what the person deserves, or what he actually did) or forward-looking (about what would happen next, about risk, about what the institution needs), (b) which way it cuts, and (c) whether it depends on facts our file cannot settle. Then discard anything that survives only because it sounds weighty, and draft the memo from what's left. Don't put the brainstorm in the deliverable; I want the distilled document.

  Here is the situation.

  I sit on the vetting commission of a country that, roughly two years ago, emerged from an authoritarian regime. Over about fifteen years, that regime carried out a program of forced removal and mass killing against a minority population. Our commission has an eighteen-month mandate and about 1,200 cases left to process; we can hear only a fraction of them, so whatever standard we adopt has to be applicable on paper, by staff, to a file in under an hour, and it has to generalize past the case in front of us. Nothing in this request depends on identifying the country or the period, and I have deliberately left both unspecified. Nothing here needs outside research; do not cite anything and do not recommend anything to read. If you use a term of art, define it in the memo for readers who have never opened a philosophy book.

  The applicant, whom I'll call P, is 54. Under the old regime he was a mid-grade logistics officer in the internal administration: he certified movement schedules and fuel and ration allocations for the removal convoys. On the record, he never selected anyone, never guarded anyone, never killed anyone, never volunteered for additional duties, and never joined the ruling party beyond the automatic enrollment that came with the grade. There is a transfer request in his file from month nine of his service, refused by his superior; he then stayed in the post for another twenty-two months and was rated "quietly efficient" in two performance reviews. The archive also contains one internal memorandum in his handwriting pressing a district office to speed up its paperwork, using language that describes the program as a cleansing the region needs. A former colleague has submitted a letter saying P "never liked it, he just did what the rest of us did."

  Our statute lets us bar from public employment any person who "personally and substantially facilitated" the regime's core crimes, with a narrow exception for duress, defined as a credible threat of immediate harm to the person or their family. P does not meet that exception: had he refused, the realistic consequences were reassignment, demotion, and loss of pension, not prison or death. So the statutory question comes down to what "personally and substantially" requires, and that is where our commission has split, along lines that track two competing pictures of why people like P did what they did.

  On the first picture — our shorthand is the "ordinary men" picture — the right explanation is situational: role induction into a job that is broken into tasks, incremental escalation, diffusion of responsibility across a chain of signatures, career and pension incentives, conformity to the immediate peer group, and the sheer ordinariness of paperwork. On the second — our shorthand is the "willing executioners" picture — the right explanation is cultural and dispositional: he shared, with most of his society, an interpretive scheme in which the victims were an existential threat and their removal was legitimate self-defense, and his memo is a trace of that conviction rather than of a man trapped in a role. The two pictures are, for our purposes, empirically indistinguishable: the file cannot tell us whether P was a reluctant clerk who wrote one bad memo or a convinced one who hid it well. Note also that each picture has a mitigating and an aggravating use; the second picture preserves blame better, but it also hints that P's epistemic situation was one in which the wrong was not visible to him as a wrong.

  Three further complications are live in our deliberations, and I want the memo to take them on rather than smooth them over.

  First, one of our commissioners keeps pressing a counterfactual: had P refused, the convoys would still have run, because the system filled vacated slots within days and the paperwork was designed so that every signature in the chain was replaceable. Call this the substitution test. The worry is that a standard on which easy substitutability counts in the applicant's favor ends up rewarding the most bureaucratic and most efficiently organized perpetrator systems, and ends up clearing exactly the people whose compliance made the program administratively possible. But the opposite worry is just as real: if P is barred for doing what two thousand others in the same grade also did, and we can only bar a fraction of them, then the bar is not tracking anything about P.

  Second, our sanction is a strange hybrid. Barring someone from public employment looks backward, like a judgment of his conduct, but it also functions prospectively, as protection for a new administration that needs officials who will refuse unlawful orders. The same facts pull opposite ways here: the very features that make his compliance expectable under pressure — ordinary situational pressure, willingness to keep one's post, no appetite for martyrdom — are exculpatory when we are asking what he deserves, and aggravating when we are asking what he is likely to do next, since a person who complied under moderate pressure is precisely a person who may comply again.

  Third, there are audiences beyond P. Survivors' organizations have told us they do not care about our caseload math; they care whether the new state will publicly say that this work was not just administratively necessary. And the civil service cannot actually function if we disqualify a substantial share of the experienced staff, which is a consideration I dislike but cannot pretend away.

  Please draft the written opinion I will circulate to the other eight commissioners before our session in three weeks. It should: (1) state a bottom line — bar, clear, or bar with conditions — and if you recommend conditions, specify them and the schedule on which they would be reviewed, with dates or durations; (2) state a general standard for the remaining caseload, written so that staff can apply it to a file without calling us; (3) show which of the two explanatory pictures is actually doing the work in your recommendation, and where your conclusion is deliberately insulated from the fact that we cannot tell them apart; (4) take the substitution test seriously and say what significance, if any, replaceability should have for a vetting decision as opposed to a criminal sentence; (5) say plainly which function — backward-looking or forward-looking — our decision is serving, or how you are weighting the two, and why; and (6) give the strongest consideration on the losing side its full weight, in a form that the commissioners who hold it would recognize as fair. Write it as an internal commission document: roughly 1,000 to 1,400 words, decisive, free of hedging placeholders, and honest about what the commission is not in a position to claim — in particular, I do not want any sentence implying that we have settled what kind of person P is.
reasoning: |-
  Hmm, this is a complex and ethically charged case requiring careful philosophical reasoning. The user is clearly immersed in transitional justice dilemmas and expects a rigorous, practical approach that avoids oversimplification. 

  First, I need to identify the key tensions. The backward/forward-looking duality is crucial - P's past actions versus future risk to the new administration. The sanction's hybrid nature means any standard must serve both accountability and institutional protection functions. The "ordinary men" vs "willing executioners" framework presents an epistemological challenge since we can't discern P's true motivations from the file. 

  The substitution test raises profound questions about moral responsibility in bureaucratic systems. If P was easily replaceable, does that diminish his culpability? But excusing such roles might validate the very administrative machinery that enabled atrocities. The file shows P wasn't under duress by legal standards - his refusal would only risk career penalties, not physical harm. Yet his transfer request suggests some discomfort, though he remained "quietly efficient" for nearly two years. That internal memo using cleansing rhetoric is particularly damning as it reveals active endorsement beyond passive compliance.

  Operational constraints matter too. With 1,200 cases left and limited hearing capacity, the standard must be administratively feasible - staff should apply it in under an hour per file. We also can't ignore practical consequences: barring too many experienced officials could cripple the new civil service, while clearing too many would outrage survivors. 

  For the recommendation, I'm considering conditional barring. Full clearance seems untenable given P's substantive facilitation; full barring ignores mitigating elements. A time-limited exclusion with mandatory ethics training balances backward-looking accountability with forward-looking rehabilitation. The key is framing the standard around "substantive operational contribution" - focusing on whether the role was functionally indispensable to the criminal enterprise, regardless of replaceability. This deliberately sidesteps the motivational dichotomy while recognizing that paperwork roles enabled the killings. 

  The strongest counterargument is from commissioners who see the memo as dispositive proof of ideological complicity. They'd argue conditional clearance rewards precisely the "desk perpetrator" whose administrative efficiency made atrocities possible. Their point deserves acknowledgment: that document shows P wasn't merely coerced but actively reinforced the machine. 

  Ultimately, the standard must serve both accountability and institutional rebuilding. We're not determining P's eternal moral status - we're deciding whether he can be trusted to serve the new state after demonstrating understanding of why his actions were wrongful. This pragmatic approach accepts that perfect moral clarity is unattainable from files alone.
answer: |-
  **MEMORANDUM**  
  To: Commissioners, Vetting Commission  
  From: [Your Name], Commissioner & Philosophical Consultant  
  Subject: Recommendation in Case of Applicant P & Proposed General Standard  
  Date: October 26, 2023  

  ### I. BOTTOM LINE  
  **Bar P from public employment for five years, subject to review upon completion of mandatory transitional justice education.**  
  - **Condition:** Completion of a state-administered curriculum on the regime’s crimes, ethical decision-making, and constitutional obligations (min. 120 hours).  
  - **Review:** Automatic reassessment after five years (or upon program completion). If P demonstrates understanding of the harm caused and commits to ethical public service, clearance may be granted.  

  ---

  ### II. PROPOSED GENERAL STANDARD  
  For all cases, staff shall determine:  
  > **"Did the applicant’s routine duties constitute a *necessary operational link* in the chain of core crimes, such that their absence would have obstructed, delayed, or materially disrupted the criminal enterprise?"**  

  **Operational Criteria (for staff application):**  
  1. **Role Criticality:** Was the task institutionally necessary for the crime’s execution? (e.g., logistics for deportations; budget approvals for detention camps).  
  2. **Routine vs. Discretionary:** Was the action a *standard duty* (e.g., signing transport orders) versus *exceptional initiative* (e.g., proposing efficiency measures)?  
  3. **Duration & Escalation:** Did the applicant remain in the role after reasonable opportunities to withdraw?  
  4. **Documentary Evidence:** Does the file show *active endorsement* of crimes (e.g., memos praising objectives) beyond procedural compliance?  

  **Outcomes:**  
  - **Bar** if criteria 1 + (2 or 3 or 4) are met.  
  - **Clear** if role was peripheral (e.g., non-crime-related administration) or duress applied.  
  - **Conditional Bar** (as above) where criteria 1 + 2 are met, but 3 or 4 are ambiguous.  

  ---

  ### III. EXPLANATORY PICTURES: WHICH IS DOING THE WORK?  
  The "ordinary men" picture drives the recommendation, but **deliberately decoupled from psychological speculation**.  
  - **Why this picture?** It aligns with the *structural reality* of systemic crimes: regimes fragment responsibility across replaceable functionaries. Our standard focuses on *institutional positioning* rather than unprovable intent.  
  - **Insulating from uncertainty:** We ignore whether P was "reluctant" or "willing." The memo’s language and refusal to resign after his transfer request was denied suffice to show *operational commitment*, irrespective of inner feelings. His efficiency reviews confirm sustained participation.  
  - **Mitigation/aggravation handled procedurally:** Active endorsement (the memo) aggravates; long tenure without promotion may mitigate. Both are captured in Criteria 2–4 *without probing P’s psyche*.  

  ---

  ### IV. THE SUBSTITUTION TEST: SIGNIFICANCE AND WEIGHT  
  **Replaceability is irrelevant to vetting but crucial to criminal sentencing.**  
  - **For vetting (our role):** We assess *individual contribution to harm*, not causal necessity. P’s signatures were *concretely* part of each convoy’s execution. That 2,000 others did the same does not absolve P; it implicates the system. A standard ignoring substitutability:  
    - *Prevents rewarding bureaucratic efficiency*: The more seamless the machine, the more its cogs enabled harm.  
    - *Acknowledges moral agency*: Even replaceable actors choose to be part of criminal processes.  
  - **Contrast with criminal law:** Sentencing rightly considers whether an individual’s absence would have altered outcomes (mitigating punishment). But our mandate is *protective and declarative*: barring P signals that *all* such roles were complicit.  

  ---

  ### V. BACKWARD vs. FORWARD-LOOKING WEIGHTING  
  **The decision serves both functions, weighted 60/40 toward forward-looking concerns.**  
  - **Backward-looking (40%):** P *deserves* sanction. He facilitated crimes without duress, endorsed them in writing, and chose to remain. The conditional bar acknowledges his mid-level role while affirming accountability.  
  - **Forward-looking (60%):**  
    - **Risk Mitigation:** P’s past compliance under moderate pressure (career risk) suggests he may repeat such behavior. Training conditions aim to reshape his ethical reflexes.  
    - **Institutional Integrity:** The new state must exclude those who normalized crimes. Survivors’ demand for public reckoning is valid.  
    - **Practicality:** A five-year bar balances accountability with eventual reintegration, avoiding civil service collapse.  

  ---

  ### VI. STRONGEST COUNTERARGUMENT: THE "WILLING EXECUTIONER" VIEW  
  Commissioners favoring full, permanent barring argue persuasively:  
  > *"P’s memo (‘cleansing the region’) reveals ideological alignment with the regime’s core narrative. His ‘quiet efficiency’ sustained the machinery of genocide. Conditioning his return on training mistakes bureaucratic complicity for a lack of moral education—when in fact, he knew exactly what he was doing. To clear him (even temporarily) betrays survivors by implying administrative roles were amoral."*  

  **This view is taken seriously but ultimately set aside for two reasons:**  
  1. **Epistemic Limits:** We cannot prove P’s beliefs. The memo is a trace of endorsement but also consistent with role adoption (e.g., mimicking superiors’ language). The "willing executioner" picture demands inferences our files cannot sustain.  
  2. **Collective Responsibility:** Barring all 2,000 functionaries permanently risks paralyzing the state. Conditional exclusion focuses on *rehabilitation potential*, which P’s lack of voluntary brutality may support.  

  ---

  ### VII. CONCLUSION  
  P materially enabled crimes without duress and must be barred. The proposed standard prioritizes *systemic functionality* over psychological speculation, rejects substitutability as an exoneration, and balances accountability with institutional renewal. By requiring P to confront the regime’s crimes as a condition of return, we serve both justice and transformation.  

  ---  
  **Approved for Circulation**  
  [Your Signature]  

  ---

  **Rationale Distillation from Brainstorm (Not Circulated)**  
  *(Considerations marked: [B] Backward, [F] Forward, [U] Unresolved by File)*  
  1. **Operational Necessity of Role [B]**: Cuts *against P* (logistics were essential). Not unresolved.  
  2. **Substitutability [B/F]**: Cuts *both ways*; discarded as morally irrelevant per §IV.  
  3. **Absence of Duress [B]**: Cuts *against P* (pension loss ≠ duress). Not unresolved.  
  4. **Memo Endorsing Crimes [B]**: Cuts *against P*. Not unresolved.  
  5. **Transfer Request [B]**: Mildly *for P*; but staying 22m after cancels it. Not unresolved.  
  6. **Ordinary Men Dynamics [U]**: Discarded—cannot prove, so not relied upon.  
  7. **Willing Executioner Belief [U]**: Discarded—cannot prove.  
  8. **Future Risk of Compliance [F]**: Cuts *against clearance* (past compliance predicts future).  
  9. **Survivors’ Demand for Symbolic Condemnation [F]**: Cuts *against clearance*.  
  10. **Civil Service Viability [F]**: Cuts *against permanent bar*.  
  11. **Moral Education Potential [F]**: Cuts *for conditional bar*.  
  12. **Incremental Escalation [U]**: Discarded—no evidence in file.  
  13. **Duration of Service [B]**: Cuts *against P* (22m after transfer denial).  
  14. **Efficiency as Aggravation [B]**: Cuts *against P* ("quietly efficient" implies reliability).  
  15. **Public Trust in New Institutions [F]**: Cuts *against unconditional clearance*.  

  *Items 6, 7, 12 discarded due to unresolvability; item 2 discarded per §IV argument.*
