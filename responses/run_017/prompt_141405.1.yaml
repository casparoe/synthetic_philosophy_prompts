answer: |-
  Below is a pragmatics decision tree designed to classify inferences beyond truth-conditional content. The tree prioritizes **testable questions** answerable from context and examples, not definitions. It identifies 5 leaves (including non-speaker meaning) and flags disputes. Each question is followed by branches (Y = Yes, N = No). After the tree, I walk through your examples, note disputes, and address limitations.

  ---

  ### **PRAGMATICS DECISION TREE: CLASSIFYING INFERENCES**  
  *Start: Hearer draws inference beyond literal truth conditions of the utterance.*

  1. **Would the utterance be FALSE if the inference were FALSE?**  
     - *Y → 2*  
     - *N → 3*  

  2. **Is the inference NECESSARY to resolve ambiguity, reference, or vague terms?**  
     - *Y → Leaf: **What is said** (contextually enriched)*  
     - *N → 3*  

  3. **Can the speaker DENY the inference without contradicting the original utterance?**  
     - *Y → 4*  
     - *N → 7*  

  4. **Does the inference depend on THIS SPECIFIC CONTEXT to arise?**  
     - *Y → Leaf: **Particularized conversational implicature***  
     - *N → 5*  

  5. **Would the inference likely arise even if the SPEAKER/WORDS changed (keeping core meaning)?**  
     - *Y → 6*  
     - *N → Leaf: **Particularized conversational implicature***  

  6. **Is the inference BLOCKED when the utterance is embedded (e.g., in negation, conditionals, questions)?**  
     - *Y → Leaf: **Generalized conversational implicature***  
     - *N → Leaf: **What is said** (contextually enriched)*  

  7. **Is the inference linked to a SPECIFIC WORD/PHRASE’s conventional meaning?**  
     - *Y → Leaf: **Conventional implicature***  
     - *N → 8*  

  8. **If the inference were false, would the speaker’s statement be MISLEADING (but technically true)?**  
     - *Y → Leaf: **What is said** (contextually enriched)*  
     - *N → 9*  

  9. **Would the speaker be SURPRISED/ANNOYED to learn you drew this inference?**  
     - *Y → Leaf: **Non-speaker meaning***  
     - *N → 10*  

  10. **Does the inference PERSIST under embedding (e.g., in negation, conditionals)?**  
      - *Y → **Conventional implicature***  
      - *N → **Non-speaker meaning***  

  **Unoccupied combinations**:  
  - *"N at Q1 → Y at Q7"*: Truth-conditional inferences can’t be conventional implicatures (which are non-truth-conditional).  
  - *"Y at Q3 → N at Q4 → N at Q5 → Y at Q6"*: Default-like inferences that survive embedding are rare; often folded into "what is said" (disputed).  

  **Ambiguous leaves**:  
  - The tree **cannot reliably separate** generalized implicatures from "what is said" via loose talk (see disputes below).  

  ---

  ### **WALKTHROUGH OF EXAMPLES**  
  1. **"Some of the students passed"** → Inference: *Not all passed*.  
     - Q1: N (If all passed, "some" is still true → not truth-conditional).  
     - Q3: Y (Speaker can say: "Some passed – in fact, all did!").  
     - Q4: N (Arises without special context).  
     - Q5: Y (Rephrase as "Not all passed" – inference remains).  
     - Q6: Y (Embedded: *"If some students passed, we’ll celebrate"* doesn’t imply *not all*).  
     → **Generalized conversational implicature**.  

  2. **"She’s poor but honest"** → Inference: *Contrast between poor and honest*.  
     - Q1: N (No truth-conditional effect: if no contrast, utterance is still true).  
     - Q3: N (Denial sounds contradictory: ?"She’s poor but honest, though there’s no contrast").  
     - Q7: Y (Linked to "but").  
     → **Conventional implicature**.  

  3. **"I ate three of the cookies"** → Inference: *Ate exactly three*.  
     - Q1: N (If I ate four, "ate three" is still true).  
     - Q3: Y (Can deny: "I ate three – actually, I ate four!").  
     - Q4: N (Arises by default).  
     - Q5: Y (Rephrase as "I ate at least three" – inference lost).  
     - Q6: Y (Embedded: *"Did you eat three cookies?"* doesn’t imply *exactly three*).  
     → **Generalized conversational implicature**.  

  4. **"The ham sandwich is getting impatient"** → Inference: *Customer who ordered it is impatient*.  
     - Q1: Y (If the customer isn’t impatient, the statement is false).  
     - Q2: Y (Resolves reference via metonymy).  
     → **What is said** (contextually enriched).  

  5. **"The lecture hall was empty"** (with two people) → Inference: *Nearly empty*.  
     - Q1: Y (If crowded, statement is false).  
     - Q2: N (No ambiguity/reference to resolve; loose use of "empty").  
     - Q8: Y (If packed, statement is misleading but technically false? → **Disputed**; see below).  
     → **What is said** (contextually enriched).  

  6. **Reference letter: "Candidate has perfect attendance and lovely handwriting"** → Inference: *Candidate is unqualified*.  
     - Q1: N (Letter is true even if candidate is qualified).  
     - Q3: Y (Writer can deny: "I only mentioned these because space was limited!").  
     - Q4: Y (Depends on context: job reference norms).  
     → **Particularized conversational implicature**.  

  ---

  ### **DISPUTES & LIMITATIONS**  
  **Leaf-specific disputes**:  
  - **What is said (contextually enriched)**:  
    - *Common ground*: Fixing indexicals/disambiguation belongs here.  
    - *Contested*: Whether "loose talk" (e.g., "empty" for *nearly* empty) or metonymy (e.g., "ham sandwich" for customer) are part of "what is said" or pragmatic enrichment. Some (e.g., Relevance Theorists) argue they are part of explicature; others (e.g., strict Griceans) treat them as implicatures.  
  - **Generalized conversational implicature**:  
    - *Common ground*: Default inferences (e.g., "some" → *not all*) that aren’t tied to context.  
    - *Contested*: Whether these are truly distinct or just probabilistic defaults (argued by Relevance Theory), or if they should be part of semantic content (e.g., Chierchia on embedded implicatures).  
  - **Conventional implicature**:  
    - *Common ground*: Non-cancellable, word-triggered inferences (e.g., "but" → contrast).  
    - *Contested*: Whether these exist as a separate category or reduce to semantic presuppositions (e.g., Potts vs. critics).  
  - **Non-speaker meaning**:  
    - *Common ground*: Inferences unsanctioned by the speaker (e.g., paranoia, idiosyncratic associations).  
    - *Contested*: Whether speaker endorsement is binary (e.g., might the speaker *unintentionally* imply something?).  

  **Violence to the material**:  
  - The tree **oversimplifies embedding tests** (Q6, Q10): Projection behavior isn’t always clear-cut (e.g., implicatures in questions).  
  - **Loose talk/metonymy** are forced into "what is said" via Q8, but many argue these are implicatures. The tree prioritizes testability over theory.  
  - **Generalized vs. particularized implicatures** blur in context (Q4–Q5); the tree uses "default likelihood," which is probabilistic.  

  ---

  ### **HANDOUT NOTES**  
  - **Use this tree to**:  
    1. Avoid overusing "implicature" for all inferences.  
    2. Test categories via cancellability, context-dependence, embedding, and speaker endorsement.  
  - **Caution**: Pragmatics is theory-rich; this tree is a heuristic, not gospel. Disputes (especially on loose talk and generalized implicatures) are live!  
  - **Key references for disputes**: Grice (1975), Sperber & Wilson (1986), Levinson (2000), Carston (2002), Potts (2005).  

  Let me know if you'd like adjustments or deeper dives into specific disputes!
