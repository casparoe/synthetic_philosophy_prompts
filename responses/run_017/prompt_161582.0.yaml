prompt: |-
  I'm writing a paper for a moral philosophy seminar on whether facts about brains should change how much a being counts, and I keep getting stuck before I even begin. My supervisor's line is that brain size is never what matters directly, only a stand-in for something else; but when I ask what the stand-in is supposed to be, I get a different answer every time (total neuron number, cortical neuron number, synaptic density, integrative complexity, richness of the conscious repertoire, capacity for suffering, higher-order or narrative capacities, or something relational). So before I commit myself to a view I want the specification. Assume the theory is meant to be usable as an input to actual decisions: how to weight a pig against a chicken against a shrimp against a human in an institutional cost-benefit exercise, and how to rank welfare research and spending when the evidence is thin. So it has to output something like a weight or at least an ordering, and it has to do so from measurements we could in principle gather. Given that purpose, write the desiderata such a theory has to meet.

  For the motivating cases, please work with the ones below rather than substituting your own favourites, since these are the ones my seminar actually fought about. First, the dissociation cases: as brains get larger, neuron density falls and tissue is allocated differently, so absolute size, total neuron count, and forebrain neuron count come apart, and any theory must say which currency it tracks and why, and what it says when the currencies disagree. Second, a stipulated duplicate-module species: its nervous system contains two complete, functionally redundant copies of the same processing machinery wired in parallel, so it has twice the neurons of its single-copy conspecific while remaining behaviourally indistinguishable and, stipulate, having one unified stream of experience rather than two; does its moral weight double? Third, a stipulated insulated-upgrade variant, where extra tissue is real, metabolically expensive, and computationally sequestered from anything valence-relevant. Fourth, a slow-giant species: enormous neuron numbers with signalling and integration an order of magnitude slower, so that it may live at a different subjective tempo — say what the theory owes us about whether what matters is richness per moment or number of moments per unit clock time. Fifth, variation within a single life: the same individual as a juvenile and as an adult, after a large-volume resection, and the sort of clinical case where adults are reported to function near-normally with drastically reduced cortical mass (take the case as stipulated if you doubt the reports). Finally, the very small: animals with brains of a fraction of a gram that nonetheless learn flexibly and reversibly adjust their behaviour.

  Alongside the cases, I want you to police some distinctions I think people collapse: whether neural quantity is evidence of status or constitutive of it; whether what varies is status at all rather than how much welfare is at stake; whether the quantity tracks a being's welfare or the badness of its death; and whether the theory is supposed to scale within a species as well as across them. For each requirement, give the case or consideration behind it and mark it non-negotiable or a preference of one camp. Then tell me which subset of the requirements you suspect cannot be jointly satisfied, and which single requirement does the most work in knocking out otherwise popular theories. Please keep the weight on the criteria rather than on scoring the views, and do not include citations, bibliographies, or further reading — I have library access and will do that part myself. Structure your answer in these sections and lengths: Currencies (what the theory's verdicts track, about 120 words), Requirements (numbered, each with its motivating case and a non-negotiable/negotiable tag, about 600 words), Where the List Breaks (about 200 words), The Most Exclusionary Requirement (about 150 words), and Scorecard (brief, about 200 words, on sentience-based views, aggregate-neuron or capacity-aggregating views, higher-order or personhood views, information-integration views, and relational or social views).
reasoning: |-
  Okay, let me approach this systematically. The user is grappling with fundamental questions about moral weight determination based on neural characteristics, and needs clear criteria to evaluate theories. Their frustration with shifting "stand-in" explanations is palpable - they want fixed desiderata to test theories against real decision-making scenarios.

  Hmm, the core tension seems to be between conceptual precision and practical applicability. The listed cases (dissociation, duplicate-module, etc.) each expose different fault lines in common theories. I should organize requirements around these specific failure points rather than abstract principles. 

  First, the currency question: since brain size correlates imperfectly with various proxies (neuron count, connectivity etc.), any theory must commit to its fundamental metric. The dissociation cases force this choice - can't just say "complexity" vaguely. 

  For requirements, the duplicate-module case is particularly vicious. If moral weight doubles with duplicated neurons despite identical behavior/experience, that sinks neuron-aggregating views. But if weight stays the same, what does that imply about neuron importance? This feels non-negotiable for exposing internal contradictions.

  The slow-giant case introduces temporal scaling issues - is a "rich" subjective moment offset by fewer moments per real-time hour? Most theories implicitly assume temporal equivalence, but that's arbitrary. Meanwhile the clinical cases challenge whether neural metrics can apply intraspecies.

  I'm noticing three irreconcilable tensions: 1) Experience unity vs. neural duplication (can't have both) 2) Neural metrics vs. functional recovery cases 3) Temporal scaling vs. need for clock-time outputs. The duplicate-module requirement might be most exclusionary - it forces theories to choose between behavioral, experiential and architectural commitments.

  In the scorecard, sentience views fail dissociation cases by lacking metrics; neuron-aggregation fails duplicate-modules; higher-order views struggle with juveniles; integration theories get wrecked by slow-giants; relational views can't handle isolated individuals. The insulated-upgrade case may be the silent killer - if metabolically expensive but functionally irrelevant tissue doesn't count, that invalidates many physical proxies.

  The user's distinction-policing is crucial here. A theory could survive if it clearly separates: constitutive claims (neural feature X IS moral status) from evidential ones; welfare-at-stake from status; and specifies interspecies vs. intraspecies application. But no existing view clears all these hurdles cleanly.
answer: |-
  ### Currencies  
  The theory must specify its fundamental moral currency unambiguously—whether it tracks **intrinsic properties** (e.g., synaptic density directly constituting sentience) or **functional capacities** (e.g., integrative complexity enabling suffering). Crucially, it must resolve conflicts between correlated-but-divergent neural metrics (e.g., total neurons vs. forebrain neurons in dissociation cases). The currency must output a **comparable weight or ordinal ranking** usable in cost-benefit analyses (e.g., weighting pig vs. shrimp welfare investments), derived from **empirically measurable properties** (e.g., neuron counts, connectivity matrices). Avoid proxies that are merely evidential; the chosen currency must be morally fundamental.  

  ---

  ### Requirements  
  1. **Dissolution of Dissociation Cases**  
     *Motivation*: When absolute brain size, total neuron count, and forebrain neuron count diverge (e.g., larger brains with lower neuron density), the theory must specify which metric(s) determine moral weight and justify why, rejecting vague appeals to "complexity."  
     *Tag*: Non-negotiable (Failure collapses into ambiguity).  

  2. **Duplicate-Module Verdict**  
     *Motivation*: For the duplicate-module species (2× neurons, identical behavior/experience), the theory must state whether moral weight doubles. If not, it must explain why neuron count is irrelevant without undermining neural metrics elsewhere.  
     *Tag*: Non-negotiable (Tests if neurons are constitutive or incidental).  

  3. **Insulated-Upgrade Exclusion**  
     *Motivation*: The insulated-upgrade variant (metabolically costly but functionally irrelevant neural tissue) must not increase moral weight. Theories must exclude computationally inert properties.  
     *Tag*: Non-negotiable (Prevents resource-based trivialities).  

  4. **Temporal Scaling Resolution**  
     *Motivation*: For the slow-giant species (high neurons, slow processing), the theory must specify whether moral weight depends on *richness per subjective moment* or *moments per clock-time*, and output weights compatible with real-time decisions (e.g., research funding per year).  
     *Tag*: Negotiable (Some views may reject temporal granularity).  

  5. **Intra-Species Consistency**  
     *Motivation*: Must handle neural variation within a life (e.g., juvenile vs. adult, post-resection near-normal function) without implying weight changes that contradict functional parity.  
     *Tag*: Non-negotiable (Avoids absurd intrapersonal comparisons).  

  6. **Scalability to Minimal Systems**  
     *Motivation*: Must assign non-zero weight to very small, flexible learners (e.g., insects), avoiding arbitrary size thresholds.  
     *Tag*: Negotiable (Anti-speciesism camp insists; personhood views may demur).  

  7. **Constitutive vs. Evidential Distinction**  
     *Motivation*: Must clarify whether neural properties *constitute* moral status (e.g., synapses as physical basis of sentience) or merely *evidence* it (e.g., predicting suffering).  
     *Tag*: Non-negotiable (Prevents equivocation).  

  8. **Welfare-at-Stake vs. Status Distinction**  
     *Motivation*: Must separate whether neural metrics scale the *badness of welfare deficits* (e.g., pain intensity) or *inviolable moral status* (e.g., rights).  
     *Tag*: Non-negotiable (Crucial for cost-benefit inputs).  

  9. **Death-Badness vs. Welfare-Sensitivity Distinction**  
     *Motivation*: Must specify if neural quantity affects the disvalue of death (e.g., via lost future experiences) or current welfare sensitivity (e.g., suffering depth).  
     *Tag*: Negotiable (Theory-dependent).  

  10. **Cross-Species Priority**  
      *Motivation*: Must rank weights across phylogenetically distant species (human vs. shrimp) without relying on species-relative norms.  
      *Tag*: Non-negotiable (Core to the institutional use-case).  

  ---

  ### Where the List Breaks  
  The requirements cannot be jointly satisfied without trade-offs. **Dissociation cases** force a choice between conflicting neural metrics, but no single metric (e.g., cortical neurons) cleanly resolves all cases (e.g., fails duplicate-modules). **Duplicate-module and intra-species cases** conflict: If neural duplication doesn’t increase weight, this undermines neuron-aggregating views, yet post-resection functional normality suggests neural metrics are unreliable. **Temporal scaling** requires committing to a subjective/clock-time output, but this may be underspecified by neural architecture alone (e.g., slow-giant’s tempo isn’t measurable from brain scans). **Constitutive claims** struggle with minimal systems (e.g., is a shrimp’s microbrain *constitutive* of sentience or just evidence?), while relational views fail cross-species weighting.  

  ---

  ### The Most Exclusionary Requirement  
  **The duplicate-module requirement** is maximally exclusionary. It forces theories to either:  
  - **Double weight**, violating behavioral/experiential parity (counterintuitive and unpragmatic for welfare decisions).  
  - **Deny doubled weight**, forcing abandonment of simple neuron-aggregation (e.g., total neuron counts) and exposing deeper problems: If twice the neurons don’t matter here, why prioritize them in dissociation cases? This requirement alone collapses "more neurons = more weight" views, neuron-density compromises, and any architecture-blind metric. Only theories grounding weight in irreducible functional unity (e.g., integrated information) or capacities (e.g., conscious repertoire) survive—but they then struggle with empirical scalability.  

  ---

  ### Scorecard  
  - **Sentience-Based Views** (e.g., capacity for suffering): Fail dissociation cases (no metric to compare shrimp/pig), vague on temporal scaling.  
  - **Aggregate-Neuron Views**: Killed by duplicate-module and insulated-upgrade cases; conflate constitutive/evidential roles.  
  - **Higher-Order/Personhood Views**: Exclude minimal systems (shrimp) and vary intraspecies (juveniles); struggle with cross-species scaling.  
  - **Information-Integration Views** (e.g., Φ): Handle duplicate-modules (unity over parts) and insulated-upgrades but fail slow-giant tempo and dissociation cases (Φ may not track measurable biology).  
  - **Relational/Social Views**: Fail cross-species weighting (e.g., shrimp vs. human institutional priority) and minimal systems; conflate welfare with social value.  

  *No view satisfies all non-negotiables.* Sentience-based and integration theories fare best on unity/parity but worst on measurability. Aggregate-neuron views are measurable but morally incoherent.
