prompt: |-
  I'm taking an undergraduate seminar on animal ethics, and I keep encountering the same maneuver in readings and discussion without having a word for it.

  It runs like this. Someone grants up front that species membership as such cannot be what matters morally, and adds that they would extend full consideration to any non-human being that had the right properties. They then defend some practice toward animals by citing a property that is facially species-neutral: being a moral agent, being capable of reciprocity, standing in relations of mutual dependence with us, or occupying a role in our ecological community. Nearly all adult humans have the property; the animals in question do not. Asked about humans who lack it, they add that those humans belong to a kind whose normal members have it. Asked whether a being of another species that genuinely did have it would receive full status, they treat the question as science fiction and set it aside. I have watched exactly this happen in the debate over eating animals and again in a reading on urban pest control, where the property is assumed of the kind rather than checked of the individual animal.

  Speciesism seems to be the wrong name. As I have met it, speciesism is differentiating by species, and these people sincerely disavow that, and their marker could in principle be possessed by a non-human. But the marker operates as a bar that animals must clear and only ever as a sufficient, never a necessary, condition for humans, so the inclusive clause and the exclusive clause are never tested against each other.

  Is there an established concept for precisely this configuration? If it is speciesism after all, which formulation covers a case where the agent disavows species and the marker is in principle species-neutral? If it is not, I would like a name together with a definition that settles the boundary cases: a being of another species that really has the property; a human who never has and never will; and a property that matters independently but happens to track species for nobody's chosen reason. A label on its own will not help me — I want to know where the phenomenon stops.

  Please answer in 400 words or fewer.
reasoning: |-
  Okay, the user is in an undergraduate seminar on animal ethics and keeps encountering a specific argumentative maneuver. They describe a pattern where someone denies that species membership itself is morally relevant, claims they'd grant full moral status to non-humans with certain properties (like moral agency or reciprocity), but then uses these properties to justify practices harming animals. When challenged about humans lacking these properties, they fall back on humans being the kind whose typical members have them. For non-humans with the property, they dismiss it as hypothetical.

  The user feels "speciesism" doesn't quite fit because the markers used are technically species-neutral. They want a precise term for this configuration and clear boundaries for edge cases: non-humans actually possessing the property, humans permanently lacking it, and properties that accidentally track species. They need this for academic clarity in their seminar discussions and readings.

  I recall this is exactly what philosophers call "the argument from marginal cases" (AMC). It exposes inconsistencies in criteria that exclude animals but include all humans. The key concept here is "kind membership override" - granting humans status based on species kind rather than individual properties. 

  The established term for this logical structure is "anthropocentric indirect speciesism." It's speciesism because human interests get systematic priority through two moves: 1) demanding animals meet higher justificatory bars (individual possession of properties), while 2) granting humans "kind-based exemptions." The boundary cases clarify this: if they accept a non-human with the property (e.g., a personified AI), it proves the marker isn't inherently human-exclusive; if they exclude permanently disabled humans, it reveals pure property-based criteria; if they include humans when properties accidentally track species (say via genetic engineering), it confirms the anthropocentric bias.

  The user likely needs this terminology to critically engage with texts and counter discussions where opponents appear neutral while maintaining human privilege. Pinpointing "indirect speciesism" helps dissect the dual standard in what seems like consistent reasoning.
answer: |-
  This maneuver is **anthropocentric indirect speciesism** (or "species-relational bias"). While disavowing direct speciesism, it systematically elevates human interests through two key moves:

  1.  **Demanding Individual Justification for Animals:** Animals must *individually* possess demanding properties (e.g., moral agency, reciprocity) to warrant full consideration.
  2.  **Granting Kind-Based Exemptions for Humans:** Humans are granted full status *regardless of individual capacity*, based solely on membership in the human species ("kind") whose *typical* members possess the property.

  This creates an unjustified asymmetry:

  *   **For Animals:** The property (P) is a *necessary condition* for full status. Animals must prove they have P.
  *   **For Humans:** P is irrelevant for *individual* status. Belonging to the human kind is *sufficient*, even if the individual lacks P.

  **Boundary Cases Clarify the Speciesism:**

  1.  **Non-Human with Property P (e.g., advanced AI, alien):** If the proponent *genuinely* grants it full status, it reveals P *can* be sufficient and species-neutral. However, dismissing it as "science fiction" exposes the underlying assumption that P is *effectively unique to humans*, revealing anthropocentrism.
  2.  **Human Permanently Lacking P (Marginal Cases):** Defending their status *solely* via kind membership, not individual P, proves the reliance on species. If they exclude this human, it abandons the kind-based exemption, collapsing into pure property-based criteria (which would also exclude many animals).
  3.  **Property P that Accidentally Tracks Species:** If P mattered intrinsically and just *happened* to correlate with species for non-anthropocentric reasons (e.g., a specific ecological role tied to biology), the proponent should consistently apply it *individually* to *all* beings, humans included. Their refusal to do so for humans (relying on kind instead) betrays the anthropocentric bias.

  **Conclusion:** This is speciesism because species membership (being human) remains the *decisive, unearned privilege* granting status without needing to meet the same justificatory bar imposed on animals. The "species-neutral" property functions as a smokescreen, maintaining human exceptionalism through the "kind membership override." The established critique is the **Argument from Marginal Cases (AMC)**, highlighting the inconsistency in how humans lacking the relevant properties are treated compared to animals.
