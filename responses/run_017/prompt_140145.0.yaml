answer: |-
  ## Memorandum  
  To: Academic Planning Committee  
  From: [Your Name], Undergraduate Representative  
  Date: October 26, 2023  
  Subject: Recommendation on Proposed Transition from CQSS to School of Data and Society  

  ### I. Recommended Action  
  **Conditional Approval via Full External Review Process**, with an expedited timeline.  
  - **Condition**: The proposal advances only if the external review affirms that SDS meets institutional criteria for a "substantively new academic unit" (defined in Section IV).  
  - **Timeline**:  
    - *Week 1*: Committee finalizes review criteria.  
    - *Weeks 2–5*: External reviewers appointed; dossier submitted.  
    - *Week 6*: Reviewers submit report.  
    - *Week 7*: Committee makes final determination.  
  Total process: 7 weeks (vs. standard 12-month cycle), avoiding donor lapse.  

  ### II. Undisputed Facts  
  All parties agree on the following:  
  - SDS retains CQSS’s current staff, physical space, and FY2024 budget.  
  - SDS adds:  
    - A new undergraduate degree program (pending separate approval).  
    - A dedicated Dean position (new hire).  
    - Four phased tenure-track hires (Years 1–3).  
  - No existing academic unit (department, school, or center) is being dissolved.  

  ### III. The Dean’s Position (Fairly Stated)  
  The Dean argues this is a rebranding/internal reorganization because:  
  1. **Continuity of operations**: Core personnel, resources, and mission (quantitative social science) remain intact.  
  2. **Efficiency**: A full review would duplicate oversight, as new hires/degrees require separate approvals.  
  3. **Practicality**: Disputes about "newness" are semantic—no material facts are contested, only labels.  

  **Strength**: This view prioritizes administrative pragmatism and avoids bureaucratic delay for tangible gains (new hires, donor funds).  

  ### IV. Key Concerns Requiring Scrutiny  
  While the Dean’s efficiency argument has merit, two material issues remain unresolved:  

  #### A. The Donor’s "New School" Requirement  
  - The gift is contingent on establishing a *new* school. If SDS is deemed a rebranding, funds lapse.  
  - **Implication**: "New" is not just a label here—it carries legal/financial weight. Our determination directly enables or voids $2.8M in funding (per gift agreement).  

  #### B. Ambiguity of the "Existing Unit" Threshold  
  - The "Data Science Initiative" (DSI) exists as a virtual entity (website, list, 5%-FTE director) but lacks:  
    - Budget, students, faculty, or governance.  
    - Any prior academic review.  
  - **Question**: If DSI "exists," then SDS could be framed as its expansion (favoring light track). But if DSI is merely a placeholder, SDS is institutionally novel.  
  - **Risk**: Defining "existing unit" too loosely could incentivize creating paper entities to circumvent review.  

  ### V. Why "Verbal Dispute" Understates the Problem  
  The Dean is correct that facts are undisputed—but their *significance* is contested. This is not *merely* verbal because:  
  1. **Structural Materiality**: Adding a Dean and 4 tenure lines creates permanent administrative scope and financial commitments beyond CQSS’s current scale.  
  2. **Precedent**: Approving SDS as a rebranding sets a benchmark: How much expansion can occur before a unit is "new"? (e.g., Could a center add 10 hires and 3 degrees without review?).  
  3. **Accountability**: External review exists to assess strategic alignment, opportunity costs, and redundancy—precisely the concerns raised by faculty objectors.  

  ### VI. Our Path Forward: Defining "Substantively New"  
  To resolve ambiguity, I propose adopting criteria for a "substantively new academic unit" based on Committee bylaws and peer institutions:  

  > A unit is **substantively new** if it meets *at least two* of these criteria:  
  > 1. **Governance**: Creates a new Dean/Chair role with budgetary authority.  
  > 2. **Scale**: Expands faculty FTE by >25% within 3 years.  
  > 3. **Academic Scope**: Launches degree programs distinct from its predecessor’s core mandate.  
  > 4. **Institutional Novelty**: Fills a mission-critical gap not covered by existing units.  

  #### Application to SDS:  
  - **Governance**: New Dean role (Criterion 1 met).  
  - **Scale**: 4 new hires = 36% increase over CQSS’s 11 faculty (Criterion 2 met).  
  - **Scope**: New undergraduate degree in "Data & Society" (distinct from CQSS’s methods focus) (Criterion 3 met).  
  - **Novelty**: SDS claims to bridge tech/ethics—a stated institutional priority (Criterion 4 arguable).  

  **Conclusion**: SDS meets 3+ criteria, strongly indicating it is substantively new.  

  ### VII. Why Conditional Full Review?  
  - **Balances Urgency and Rigor**: Expedited review addresses donor timing while ensuring scrutiny.  
  - **Clarifies Ambiguity**: Applying concrete criteria prevents future disputes over "newness."  
  - **Mitigates Risk**: External reviewers can assess if SDS duplicates efforts (e.g., with Computer Science/Statistics) and whether governance aligns with university policy.  
  - **Fairness**: Objectors’ concerns about scrutiny are validated; the Dean gains a binding decision.  

  ### VIII. Next Steps for Monday’s Vote  
  1. **Motion**: Approve SDS proposal contingent on successful expedited external review using the criteria above.  
  2. **Delegate**: Task the Provost’s Office with selecting reviewers (1 data scientist, 1 social scientist, 1 higher-ed admin).  
  3. **Deadline**: Set a 7-week timeline for final Committee ratification.  

  This path respects both the Dean’s operational needs and faculty’s call for accountability—turning a philosophical quandary into actionable policy.  

  ---  
  **Word Count**: 845  

  ### Key Takeaways for Your Presentation  
  - **Emphasize the criteria**: They make abstract debate concrete.  
  - **Stress urgency**: "We protect the gift and resolve this in 7 weeks."  
  - **Preempt pushback**:  
    - *To the Dean*: "This doesn’t assume SDS is flawed—it validates its strategic value."  
    - *To objectors*: "External reviewers will address hiring/scope concerns directly."  
  - **Close decisively**: "We have a clear test. Let’s apply it and move forward."
