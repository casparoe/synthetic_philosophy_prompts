  First, I need to recall the core Frankfurt argument: an intervener (like Black with his device) ensures an agent (Jones) does a specific action, but if the agent does it on their own, the device doesn't intervene. Proponents argue the agent can be responsible even without alternatives at the moment of action. The user mentioned several sticking points: flicker-of-freedom defenses, robustness of alternatives, determinism in the setup, reasons-responsiveness, and intuitive judgments. 

