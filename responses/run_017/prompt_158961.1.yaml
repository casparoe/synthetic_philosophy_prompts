  Breaking down the sub-questions: 

  Flicker-of-freedom: Critics say there are still alternatives (e.g., not acting on one's own). I think this is weak (credence 0.3) because these alternatives aren't robust—they don't ground responsibility. 

  Robust alternatives smuggling: If we demand alternatives that would change the outcome, it might beg the question. I agree (credence 0.65), as it assumes responsibility requires such alternatives upfront. 

  Determinism in the setup: The trigger mechanism (e.g., prior sign) might imply determinism. This is a stronger objection (credence 0.6), especially if the sign is causally linked. 

