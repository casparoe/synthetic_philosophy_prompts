answer: |-
  My credence that the Frankfurt argument succeeds – that there exists a possible scenario where someone is morally responsible despite lacking alternative possibilities at the moment of action – sits around 0.7. I lean towards its coherence, but share your skepticism about "clean" cases and share Maya's intuition that your rehearsal variant doesn't materially change things. Let me unpack it.

  The core disagreement often lives in whether the "flicker-of-freedom" constitutes a *relevant* alternative possibility. Defenders say the alternatives critics identify (like doing the action *without* the intervener needing to act, or triggering the device) are too thin to ground responsibility – they aren't the kind of freedom we care about. I find this moderately persuasive (credence ~0.65 that demanding a "robust" alternative *doesn't* beg the question, but instead reflects that responsibility requires control over the *actual* action performed, not just irrelevant technical alternatives). The flicker seems insufficient. The worry about determinism sneaking in via the triggering mechanism (like Jones showing a prior sign) is serious. If the sign is causally determined by prior states, and the device reacts deterministically, the *entire* scenario might be deterministic, making the "alternative possibility" debate moot from the start. This pulls my credence down significantly (credence ~0.6 that many standard setups *do* presuppose determinism in the triggering chain, undermining the intended indeterminism). Your point about reasons-responsiveness is crucial. If responsibility hinges on an agent's disposition to recognize and act for reasons, and Jones in the Frankfurt case manifests that disposition unimpeded when acting on his own, then the *absence* of alternatives might indeed be irrelevant. This significantly boosts my credence in the Frankfurt conclusion (credence ~0.7 that reasons-responsiveness accounts *do* render alternative possibilities beside the point in cases of unimpeded actual action). Finally, the intuitive verdict is slippery. The "she did it on her own, nobody forced her" pattern-matching feels powerful in the Frankfurt case, but it's vulnerable to the critique that we're ignoring the hidden coercion structure. Our intuition might be tracking the *actual* lack of intervention, not the *counterfactual* lack of freedom. I'm wary here (credence ~0.55 that intuitions *might* be unreliable, influenced by the salient fact of non-intervention masking the underlying lack of alternatives).

  Now, your rehearsal case. First, does the simulation *itself* provide the *actual agent* with an alternative possibility? No. The simulation is a distinct entity, running in a separate sandbox. The real agent never had access to that alternative path; her actual causal chain unfolded deterministically (or indeterministically, but without branching to the alternative) leading to her unimpeded action. The simulation's different outcome is evidence of how things *could* have been *if* she were in that sandbox, but it doesn't create a possibility *for her* in her actual situation (credence ~0.8 that it provides *her* with no alternative possibility). Second, does it shift verdicts on responsibility compared to perfect prediction? Maya's instinct feels right: it shouldn't. In both cases, the *actual* agent acts unimpeded for her own reasons. The mechanism for *knowing* when to intervene (prediction vs. simulation) seems irrelevant to *her* actual agential process at the moment of action. The simulation is just a more complex prediction mechanism. However, psychologically, the existence of a concrete, identical counterpart who *did* otherwise might *feel* different. It might make the "flicker" more vivid, potentially nudging intuitions *against* responsibility by making the lack of alternatives for the real agent feel more concrete, or conversely, by making the "she *could* have been that person" thought more salient in an unhelpful way. But logically, it shouldn't change the responsibility assessment of the actual, unimpeded agent (credence ~0.6 that it *doesn't* shift the logical verdict, though credence ~0.7 that it *might* shift *intuitions* unfavorably for Frankfurt proponents).

  Combining these, my 0.7 leans heavily on the reasons-responsiveness point (~0.7) and the insufficiency of the flicker (~0.65), tempered by the determinism worry (~0.6 pulling down) and intuitive unreliability (~0.55 pulling down slightly). The total is most sensitive to the reasons-responsiveness argument. If that falters – if responsibility genuinely *requires* the kind of alternative possibilities the Frankfurt case eliminates – my credence would drop sharply. Conversely, a strong defense of reasons-responsiveness as capturing the essence of control boosts it. The gap between your 0.55 and Maya's 0.9 likely stems from differing weights on these factors. You seem more swayed by the determinism worry, the potential intuitive cheat, and perhaps find the flicker more substantial. Maya likely heavily weights the reasons-responsiveness argument, dismisses the flicker as irrelevant, and trusts the intuitive verdict of responsibility in the unimpeded actual sequence. The thing that would move me most is a compelling demonstration that a reasons-responsiveness account *fails* to capture responsibility *without* robust alternative possibilities actually being present at some point – showing that the disposition itself isn't enough if the actual world-path offered no escape. That, or a truly clean Frankfurt case that demonstrably avoids any deterministic pre-sign trigger while preserving the core setup, silencing the sneaking determinism worry. Your rehearsal case, while clever, ultimately feels like a difference in the mechanism of knowledge, not in the fundamental structure of agency being tested. It highlights the counterfactual dependence, but doesn't grant the actual agent an alternative she lacked before.

  Hope this helps untangle last night's debate, at least a little. It’s a fiendish problem precisely because it probes the bedrock of what we mean by control. Let me know if Maya has a rebuttal!
