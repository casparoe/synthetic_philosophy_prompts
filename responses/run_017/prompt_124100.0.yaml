prompt: |-
  My friend (she's a palliative care nurse) and I got into a massive argument last night, 1am, both slightly drunk, about whether there is any real difference between killing someone and letting them die. I ended up defending the difference and she said it was a superstition left over from religion, and the annoying thing is that every time I tried to say what the difference actually was, I ended up describing something else entirely. It got under my skin because my dad was in intensive care last winter and I have been chewing on it ever since. I'm not a philosopher, so please don't just hand me the textbook answer; I want to know what principle actually fits my reactions, and which of my reactions are just wrong.

  Here is where I land, case by case, going on gut. (1) A runaway maintenance cart is going to hit five track workers; I can throw a switch so it goes down a siding where it will kill one worker. Throwing the switch: fine, obviously, I would do it. (2) Same five, but the only way to stop it is to shove a big guy off the footbridge into its path. Not fine, and I know the numbers and the outcome are identical to (1). (3) Hospital version: five patients will die of organ failure tonight; a man who came in for a routine check-up happens to be a match for all five; kill him, harvest, five live. Not fine, and it feels worse to me than (2): something about him having walked in for a check-up, and about what everyone else would then think when they walk into a hospital. (4) My dad: on a ventilator after a cardiac arrest, sedated, no realistic shot at recovery, we all agreed, the doctor switched the machine off and he died a few minutes later. Fine, I don't think anyone did anything wrong. And it feels exactly the same to me as if they had simply never put him on it, or hadn't re-intubated him when the tube came out: whether there was an action or an omission changes nothing for me here. (5) But: someone needs the last ventilator and will die without it, and the doctor just doesn't give it to them because they can't be bothered, or gives it to a less sick patient who arrived first. Not fine, and I'd call it letting them die, but I'd also say it is less bad than killing someone to get the machine, so the difference is real without being a free pass. (6) The one that makes me think the line isn't about moving your body at all: a parent who just doesn't feed their toddler and the child starves, I want to call that killing, even though it is pure omission; whereas the doctor switching off the ventilator in (4) is letting die, even though it is an action. So I think the killing/letting die line tracks what you owed the person, not what your hands did. (7) The pair I couldn't defend: dying patient in terrible pain, high-dose morphine to control the pain, everyone knows it will probably shorten his life by a few hours: fine. Lethal injection, same death, same motive, same request, arguably less suffering overall: not fine. She pounced on this and said it's where my position collapses, because I had just said the physical difference doesn't matter, so what difference am I leaning on here? (8) And then the numbers: I said I'd let five die rather than kill one. She pushed me: would I let fifty die? A thousand? A million, if killing one innocent person was definately the only way? I couldn't find a place where my answer flipped, which worries me, because either it flips nowhere, which seems insane, or it flips somewhere and the location is arbitrary, which means I'm just doing arithmetic with extra steps.

  My own stab at a principle: the real line is not killing versus letting die, it is whether I am redirecting a threat that already exists or starting a new lethal sequence. (1) only redirects, (2) and (3) start new ones, (4) and (5) just stop resisting a threat that is already there, and (6) works because I owe the kid food but the doctors didn't owe my dad indefinite ventilation. But I think this breaks on (7), where the morphine looks like starting something new, and on (8), because a constraint like that shouldn't care how many people sit downstream of it. So: is there a principle that gets (1) through (6) and is honest about (7) and (8)? State it precisely, say which case motivates each clause of it, tell me what it predicts for the two I keep going back and forth on — (9) one ventilator, already on patient A who might recover, patient B will die tonight without it and will definately survive with it, so do I take it off A? and (10) someone ventilator-dependent after a spinal injury, not dying, could live for decades, competent, has thought about it for a year, asks to be switched off, where I am certain in (4) and completely unsure here — and give me at least one case your principle decides that I haven't listed. Also say plainly which of my verdicts no decent principle can keep; I'd rather drop one verdict than end up with a rule with six epicycles bolted on.

  End with a single machine-readable line, \answer{...}, giving the label of the principle you recommend plus the numbers of my verdicts it cannot save, like \answer{constraint on initiating new lethal sequences, no threshold; overturns 7 and 8}.
reasoning: |-
  Okay, the user is grappling with a deep ethical dilemma about the difference between killing and letting die, sparked by a late-night argument with a palliative care nurse friend. They've laid out several hypothetical cases where their gut reactions seem inconsistent, and they're struggling to find a coherent principle that explains all their intuitions. 

  First, I notice this isn't just academic for them - their dad was in intensive care recently, so these questions carry emotional weight. They're clearly intellectually honest, rejecting "textbook answers" and wanting principles that fit their actual moral reactions. Their frustration comes through when describing how their friend dismantled their position on the morphine case (7).

  Looking at their cases: Their intuitions are surprisingly consistent except for (7) and (8). The redirecting-threat principle they propose is smart but cracks under pressure. I'm impressed by how they spotted that (6) (starving child) shows obligation matters more than physical action. Their hospital anxiety in (3) reveals an important social contract dimension beyond pure ethics.

  For (7): The morphine case is the real killer for most ethical systems. Double effect doctrine is the traditional answer here, but it feels like special pleading to them (and their friend). Maybe the key is whether death is instrumentalized versus accepted as side-effect? But they'll see through that if it's not fleshed out.

  For (8): The numbers game exposes a flaw in any non-consequentialist view. If they won't kill one to save a million, that seems indefensible, but flipping positions would destroy their other convictions. This needs serious handling - maybe distinguish micro/morality from macro/policy?

  Their proposed principle almost works but fails at (7) and (8). I need something that keeps their core intuitions (especially the distinction between redirecting vs. creating new threats) while either justifying or honestly rejecting their morphine hesitation. The ventilator removal cases (9-10) will be the test.

  Biggest challenge: Admit that (7) might be an inconsistency in their view rather than finding a way to save it. Their integrity in asking "which verdicts must be dropped" is admirable - I should honor that by being blunt where necessary.

  The social component matters too: In (3) they mention "what everyone would think" about hospitals. That's not just ethics but institutional trust - which might actually be foundational to medicine. Could that help explain the morphine distinction? (Intent vs. appearance?)

  Final principle needs to: explain why redirecting threats is permissible, capture the role of obligations (like feeding kids), handle end-of-life decisions coherently, and address the numbers problem without collapsing into utilitarianism. And it must produce clear answers for their ventilator cases.

  ...After mapping it out, I think contractualism might serve them best - framing morality as what we could justify to each other given human vulnerabilities. This saves most intuitions, explains the hospital trust issue, but forces concession on (7) and offers a pragmatic approach to (8). The answer format they requested will keep me honest about limitations.
answer: |-
  Your intuitions are remarkably consistent—far more than you realize—and point toward a sophisticated ethical framework. The principle that best captures your reactions (except for your hesitation in Case 7) is **contractualism**: Morality is about acting in ways that could be justified to others, given our shared vulnerability and the need for mutual protection. This isn't about religion or metaphysics, but about the social conditions necessary for trust and cooperation. Below, I'll state the principle, map it to your cases, address your sticking points, and apply it to new scenarios.

  ---

  ### **The Principle: Contractualist Threshold of Permissible Harm**
  **Actions are morally distinct from omissions when they:**  
  **(i) *Initiate a new causal chain of harm* against someone who was not already under direct threat; OR**  
  **(ii) *Violate a role-based obligation* to protect or sustain life that was reasonably expected.**  
  **Otherwise, allowing harm to occur (even through an action) is permissible if:**  
  **(a) The harm was already underway; AND**  
  **(b) The action is consistent with what could be justified to the affected person (or their proxy) in a position of equal vulnerability.**

  ---

  ### **How It Explains Your Cases**
  1. **Runaway cart, switch thrown:** Redirects an *existing* threat (i). Not initiating harm. Justifiable to the one worker: "We minimized unavoidable harm." → **FINE**  
  2. **Shoving the big guy:** *Initiates* a new lethal threat against someone safe (i). Unjustifiable to him: "You used me as a tool against my will." → **NOT FINE**  
  3. **Killing for organs:** Violates hospital role-obligation to *do no harm* to patients (ii). Also initiates new harm (i). Destroys trust in medicine. Unjustifiable to the donor: "You entered for care, not execution." → **WORSE THAN (2)**  
  4. **Turning off ventilator:** Harm (dying) was already underway. Action stops resisting it (a). Justifiable to your dad: "We ended burdensome intervention with no benefit." → **FINE**  
  5. **Doctor neglects ventilator:** Violates role-obligation to provide care (ii). Unjustifiable to the patient: "You owed me aid and refused." → **NOT FINE (but less bad than killing)**  
  6. **Starving toddler:** Violates parental obligation to sustain life (ii). Omission is functionally *initiating* harm by default. → **KILLING**  
  7. **Morphine vs. lethal injection:**  
     - *Morphine:* Does not *initiate* a new threat (i); dying is underway. Intent is pain relief, not causing death. Dose is proportional to need. Justifiable: "We eased suffering knowing it *might* hasten death." → **FINE**  
     - *Lethal injection:* *Initiates* death as a new causal chain (i). Your hesitation is correct, but the principle *can* support both if the patient *requests* it. Your discomfort? It *feels* like violating medical role-obligation (ii). → **AMBIGUOUS**  
  8. **Numbers threshold:** Contractualism rejects "kill one to save many" because it exploits the one. No non-arbitrary threshold exists—it’s *always* unjustifiable to the victim. But in true existential crises (e.g., a pandemic triage where *all* will die without action), redirecting an *existing* threat (e.g., ventilator reallocation) may be justifiable. → **NO THRESHOLD**  

  ---

  ### **Predictions for Your Open Cases**
  9. **Take ventilator off Patient A for Patient B?**  
     - *If A is actively dying:* Removing it allows an existing harm (a). May be justifiable to A’s proxy: "We redirected limited resources to save a life when A had no hope." → **PERMISSIBLE**  
     - *If A might recover:* Violates obligation to A (ii). Unjustifiable: "You ended my chance of survival to benefit another." → **IMPERMISSIBLE**  

  10. **Ventilator-dependent person requests removal?**  
      - Justifiable *if* autonomy and consent are central to role-obligations (ii). The person can waive the right to care. → **PERMISSIBLE** (like refusing treatment).  

  ---

  ### **A New Case Your Principle Decides**
  - **Case 11:** A dementia patient refuses food. Staff could force-feed (action) or let her die (omission).  
    - *Force-feeding:* Violates bodily autonomy and role-obligation to respect dignity (ii). → **IMPERMISSIBLE**  
    - *Allowing death:* Consistent with advance directives/proxy consent. Harm (starvation) follows from underlying illness (a). → **PERMISSIBLE**  

  ---

  ### **Where Your Intuitions Can't All Be Saved**
  - **Case 7 (Morphine vs. Lethal Injection):** Your gut says "not fine" for the injection. But if the *patient requests it*, contractualism can permit it (autonomy overrides role-obligation). Your resistance is psychologically understandable—active killing feels like crossing a taboo—but the principle *can* accommodate it.  
  - **Case 8 (Numbers):** You want a threshold ("Would I kill one to save a million?"). Contractualism says no—it’s *always* wrong to *initiate* harm against an innocent. But in practice, we *do* make tragic choices (e.g., wartime). The principle calls this a moral failure, not justification.  

  ---

  ### **The Verdict**
  Your core insight is correct: **The difference isn’t about action vs. omission—it’s about whether you *create* a new lethal threat or *violate a duty* to prevent harm.** This explains why redirecting threats (1), withholding futile care (4), or honoring autonomy (10) is permissible, while exploiting the innocent (2,3) or neglecting obligations (5,6) is not. Case 7 is the exception, where psychological aversion to "purposeful killing" lingers, but the principle can resolve it with consent.  

  \answer{contractualist threshold of permissible harm; forces concession on 7 (if consented) and rejects threshold in 8}
