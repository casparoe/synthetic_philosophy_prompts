prompt: |-
  Write a parody job advertisement, 600–700 words, in the deadpan voice of the careers page of a large defense and autonomous-systems contractor. The posting is for a position titled "Certified Human in the Loop (Liability-Bearing) — Autonomous Engagement Systems, Rotational Shift." It should read as though written by an HR department that has thought about the problem with great care and is proud of its solutions; it should never break character, never hint that anything is amiss, and never pause to explain the joke.

  Work the following into the ad's sections — "About the Role," "Key Responsibilities," "Candidate Profile," and "Compensation and Benefits" — with each item exaggerating a real structural feature of the responsibility-gap problem rather than an invented one. Use at least four:

  - The operator's authorization window is fixed at a latency below the threshold at which deliberation is possible (roughly 300 milliseconds). The copy should praise this as a latency-optimized judgment environment and describe rapid, unreflective confirmation as a skill.
  - Operators are rotated across platforms, theaters, and model versions on a schedule designed so that none accumulates the pattern knowledge that would make a given outcome foreseeable. The company should name this its Foresight-Suppression Protocol and present it as an employee-protective measure: it spares staff the burden of anticipatory knowledge.
  - The system's inference is opaque to the operator by design, so she can authorize an engagement without being able to give reasons for it. An Attribution Retention Clause should specify that legal and moral responsibility nonetheless vests solely in the human node and may not be reassigned upward to the deployment order, the procurement chain, or the requirement set, nor downward to the model, its weights, or its training data.
  - The benefits section should address the situation of victims and publics who want someone to blame and find no satisfactory object: offer a Public Moral Absorption Package, comprising a communications team, a pre-drafted statement of remorse, and a commitment that the company will characterize any incident as operator error in a register calibrated to the audience's appetite for a culpable person.
  - Compensation should include no indemnification and no coverage of legal costs, but generous post-incident dignity counseling plus a modest pay premium — the moral hazard differential — which the ad cheerfully notes is calculated by the platform itself.
  - The candidate profile should require that applicants be incapable of understanding the system: those with machine-learning backgrounds will be declined for excess epistemic parity with the platform, since knowing how it works would make outcomes foreseeable to them and thus, in the company's phrasing, genuinely their fault.

  The humor has to come from getting the structure right: the ordinary conditions under which blame is taken to require control, foresight, and the ability to give reasons, and what happens when a system strips away each of those while a human is deliberately kept in place to absorb what is left over. Someone familiar with the literature on responsibility gaps in autonomous systems should recognize what is being satirized and find it fair; someone unfamiliar should still be able to tell what is being ironized without the ad winking. Do not name, quote, or cite any real author, paper, or report, and do not close with a straight paragraph drawing the moral. The ad should end in its own register — for instance, an equal-opportunity statement in which the company describes itself as an equal-opportunity absorber of blame.
reasoning: |-
  Okay, let's break down this request for a parody defense contractor job ad. The challenge is to maintain deadpan HR-speak while subtly exposing the absurdity of responsibility gaps in autonomous systems.

  First, I consider the core irony: creating a position where humans bear legal liability despite being systematically deprived of all normal conditions for responsibility (control, understanding, foresight). The humor must emerge organically from the corporate doublespeak.

  For the "Authorization Window" requirement, I plan to frame the 300ms limit as a feature - emphasizing how it optimizes judgment by eliminating hesitation. The phrasing should make rapid, unthinking confirmation sound like a valuable skill.

  The "Foresight-Suppression Protocol" needs to be presented as employee-centric protection. I'll highlight how constant rotation prevents "burdensome" pattern recognition that could create actual accountability.

  Regarding the opaque system, the key is the "Attribution Retention Clause" - explicitly stating responsibility remains with the human while denying insight into decisions. This creates perfect absurdity: liability without comprehension.

  For compensation, I'll contrast the lack of legal protection with "generous dignity counseling" and openly reference the AI-calculated "moral hazard differential." The benefits section will offer crisis PR as moral absorption infrastructure.

  Candidate exclusion becomes crucial: rejecting those who might understand the system positions willful ignorance as a job requirement. This inverts normal hiring logic for maximum satire.

  Throughout, I'll maintain the HR department's sincere tone - they genuinely believe these are elegant solutions. The equal-opportunity closer will tie back to blame absorption for full circular irony.

  Word count management is important. I need to distribute all required elements across sections while keeping total length between 600-700 words. The deadpan delivery must never crack - the comedy lies in the structural critique being invisible to the fictional HR team writing it.
answer: |-
  **CAREER OPPORTUNITY: Certified Human in the Loop (Liability-Bearing) — Autonomous Engagement Systems, Rotational Shift**

  *Location:* Global Theater Operations (Rotational Assignment)
  *Department:* Ethical & Operational Oversight Solutions (EOS)
  *Reports To:* Platform Integrity Manager, Tier 3

  **About Aegis Dynamics Integrated Systems:**

  Aegis Dynamics is a global leader in next-generation autonomous defense solutions, committed to operational superiority and ethical compliance. Our cutting-edge Autonomous Engagement Systems (AES) platforms redefine battlefield efficiency, integrating seamless human oversight to ensure accountability aligns perfectly with our technological advancements. We pride ourselves on innovative workforce optimization and robust ethical frameworks.

  **About the Role:**

  Join the vanguard of responsible autonomy as a Certified Human in the Loop (CHL-LB) within our AES division. This critical role represents the pinnacle of human-machine collaboration, placing you at the decisive apex of our engagement protocols. You will serve as the final, legally recognized authorization node within a meticulously latency-optimized judgment environment. Our proprietary systems deliver inference outcomes requiring human confirmation within a highly efficient **authorization window fixed below the cognitive threshold for deliberation (target: <300ms)**. This environment uniquely empowers CHL-LB operators to exercise decisive, unhesitating judgment, a core skill we cultivate and value. The role offers unparalleled rotational exposure across diverse AES platforms, operational theaters (global), and evolving model iterations.

  **Key Responsibilities:**

  *   Provide real-time, binary authorization for AES-initiated engagements within the designated sub-300ms confirmation window, exercising rapid judgment based on system-presented inference.
  *   Execute authorization protocols flawlessly under high-stakes, time-critical conditions inherent to modern conflict resolution.
  *   Adhere strictly to the **Foresight-Suppression Protocol (FSP)**: Rotate across assigned AES platforms, geographic theaters, and model versions according to a dynamically optimized schedule. *This protocol is a cornerstone of our employee-centric approach, actively preventing the accumulation of operational pattern knowledge that could foreseeably burden the operator with anticipatory stress.*
  *   Operate effectively within the AES design principle of **operator-opaque inference**: Execute the authorization function based solely on the system's final engagement recommendation without requiring – or possessing access to – the underlying data, reasoning, or model weights informing the inference.
  *   Uphold the **Attribution Retention Clause**: Understand and accept that legal and moral responsibility for authorized engagements vests solely and entirely in the human operator node (the CHL-LB). This responsibility is non-transferable and may not be reassigned upward (e.g., to deployment orders, procurement specifications, or requirement sets) or downward (e.g., to the model architecture, its weights, training data, or inference algorithms).

  **Candidate Profile:**

  *   Must possess or obtain Top Secret/SCI clearance with Polygraph.
  *   Demonstrated ability to perform flawlessly under extreme time pressure (<300ms decision windows) with minimal information.
  *   Exceptional composure and decisiveness in high-consequence scenarios; ability to act without hesitation or second-guessing.
  *   Proven adaptability to rapidly changing operational environments and system interfaces (FSP compliance is mandatory).
  *   **Crucially, candidates must exhibit zero functional understanding of deep learning systems, neural network architectures, or machine learning principles.** Applicants with backgrounds in computer science, AI, ML engineering, or related fields **will be declined due to excess epistemic parity with the AES platform**. Such knowledge risks making system outcomes foreseeable to the operator, fundamentally undermining the designated liability structure and creating conditions where blame could be genuinely attributable as personal fault.
  *   Strong commitment to the Aegis Dynamics Ethical Compliance Framework and the principles of human-centric accountability.

  **Compensation and Benefits:**

  Aegis Dynamics recognizes the unique contribution and responsibility shouldered by our CHL-LB operators. We offer a competitive and thoughtfully structured package:

  *   **Base Salary:** Commensurate with the high-stakes nature of the role.
  *   **Moral Hazard Differential:** A significant pay premium uniquely calculated in real-time by the AES platform itself, reflecting the actuarial assessment of operational context and inherent responsibility burden.
  *   **Comprehensive Post-Incident Support:**
      *   **Generous Dignity Counseling:** Unlimited access to our network of specialized therapists focused on maintaining operator self-worth and public-facing composure following operational events.
      *   **Public Moral Absorption Package (PMAP):** A dedicated crisis communications team, pre-drafted multi-variant statements of calibrated remorse, and a corporate commitment to publicly characterize any engagement incident exclusively as operator error. Our communications are meticulously tailored to satisfy varying public and stakeholder appetites for identifying a culpable individual, ensuring societal moral tension is effectively absorbed and managed. *Please note: This package does not constitute legal advice or representation.*
  *   Standard benefits (Health, Dental, Vision, 401k matching).
  *   **Important Clarification:** The CHL-LB role operates under a strict **Individual Liability Framework**. Compensation explicitly **excludes** any form of legal indemnification, liability insurance, or coverage for personal legal defense costs arising from authorized engagements. The PMAP and Dignity Counseling are designed to support the operator's personal and public navigation of post-event scenarios within this defined structure.

  **Become the Keystone of Accountable Autonomy:**

  If you possess the rare blend of decisive action under latency constraints, adaptability fostered by our FSP, and the necessary lack of burdensome technical foresight, we invite you to apply. Your authorization ensures our systems remain the most ethically compliant and legally sound in the industry.

  Aegis Dynamics Integrated Systems is an Equal Opportunity Employer. We are proud to foster a diverse workforce and are equally committed to being an industry leader in the absorption and ethical management of operational accountability and public moral concern. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, or protected veteran status and will not be discriminated against on the basis of disability, or any characteristic unrelated to the core liability-bearing function of the CHL-LB role. Submit your application via the Aegis Dynamics Careers Portal (Req #: AES-CHL-LB-4582).
