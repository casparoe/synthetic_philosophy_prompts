prompt: |-
  i keep bouncing off papers on infinite ethics because each one seems to fail a different test, so before I read any more I want the spec instead. Imagine I'm designing a decision procedure for an agent who isn't sure whether the world contains infinitely many morally relevant locations (persons, person-moments, whatever the unit turns out to be) and who can directly affect only a small finite patch of it. What would that procedure have to get right to count as adequate? Give me the requirements, each with the case behind it: the addition-paradox style cases where reshuffling changes everything or nothing, worlds where net value's limit flips depending on the order you sum in, comparisons between worlds with the same infinite cardinalities of good and bad lives, and verdicts about acts rather than worlds given partial control. I also want the distinctions it can't collapse, like between "no verdict here" and "these are equally good." And three requirements I made up, which you should keep only if they're real: invariance to how coarsely spacetime is carved into locations; still saying something when the agent is one of infinitely many structurally identical agents running the same rule, so it can't just retreat to "you only affect finitely much"; and graceful degradation when the agent is only ~70% sure the world is infinite. Mark which requirements are non-negotiable and which are just one camp's taste, flag any subset you think is jointly unsatisfiable (that's the part I care most about), and say which single requirement eliminates the most candidate views. Skip the scorecard and skip names and dates — I can look those up.
reasoning: |-
  Okay, let me unpack this user's query. They're clearly frustrated with existing literature on infinite ethics and want a structured set of requirements for a decision procedure. The user is likely a philosopher or AI safety researcher dealing with moral uncertainty in potentially infinite worlds. 

  First, I notice they're not just asking for summaries - they want "the spec" like an engineer would. That means I need to approach this systematically. Their mention of "addition-paradox style cases" and "net value's limit flips" suggests they've encountered problems with convergent utilities in infinite settings. The partial control aspect indicates they care about real-world applicability.

  Hmm... their three custom requirements are particularly telling. The spacetime carving invariance implies they suspect some solutions cheat via discretization. The identical agents requirement shows they're thinking about coordination problems in symmetric universes. The 70% certainty case reveals practical concerns - most agents won't have perfect cosmological knowledge.

  The real challenge is flagging unsatisfiable requirements. I recall that Pareto + weak anonymity + finite impact creates contradictions. Also, demanding both permutation invariance and strict act/world comparisons seems problematic - those Dutch book arguments might bite here.

  For non-negotiables, cardinality invariance and finite supervenience feel essential - without those, we're not even doing infinite ethics anymore. The graceful degradation requirement might actually be the most distinctive - it forces solutions beyond pure ordinal comparisons while eliminating lazy finitist approaches.

  I should emphasize how the partial control requirement torpedoes many naive extensions like limit-average utilitarianism. And that permutation invariance requirement? That alone sinks most additively separable approaches. The user was smart to request that filter - it's brutally effective at disqualifying candidates.

  Better flag that Pareto + anonymity conflict explicitly. The user clearly wants to know where the impossibility results lurk. Might also note that requiring both permutation invariance and act/world consistency leads to cyclical preferences - that's less discussed but equally damning.

  For the 70% uncertainty case, I'll suggest multi-model aggregation without committing to any specific solution. The key is acknowledging that any adequate system must handle probabilistic beliefs differently than moral certainties.
answer: |-
  Here's a specification for an infinite ethics decision procedure, prioritizing your requirements, case-driven justifications, and critical analysis:

  **Core Non-Negotiable Requirements (Survival Constraints):**

  1.  **Finite Supervenience / Act-Utilitarianism Constraint:** The moral value of an *act* must supervene *only* on the finite set of locations the agent *actually directly affects*, even if the universe is infinite elsewhere.
      *   *Case:* You save one life in Paris. The act's moral status cannot depend on whether Andromeda contains infinitely many happy or suffering beings untouched by your act. Your responsibility is bounded by your causal reach.
      *   *Why Non-Negotiable:* Without this, ethics in an infinite universe collapses into paralysis ("nothing matters") or incoherence ("everything depends on unreachable infinities").

  2.  **Cardinality Invariance:** The decision procedure must not fundamentally change its verdicts based *solely* on the specific infinite cardinality (countable vs. uncountable) of morally relevant locations, assuming the agent's *direct effect* remains finite.
      *   *Case:* Saving one life should be good whether the background universe is countably infinite (like ℕ) or uncountably infinite (like ℝ) in morally relevant locations, provided the background state is "similar" (e.g., net neutral per "unit").
      *   *Why Non-Negotiable:* Ethics shouldn't hinge on esoteric set theory if the *local* situation and the *relative* background density are identical. An ethical theory requiring agents to know Aleph numbers is absurd.

  3.  **Permutation Invariance (Weak Anonymity):** If two worlds are identical except for a permutation (reshuffling) of the *qualitatively identical* experiences/lives across locations (including infinite permutations), they must be deemed equally good. The procedure must avoid the "Addition Paradox" and "Mere Addition Paradox" traps.
      *   *Addition Case:* World A: Infinite good lives. World A+: World A plus one additional good life. Intuition: A+ is better. Problem: Permuting locations makes A and A+ isomorphic. Requirement: A and A+ must be judged *equal*.
      *   *Mere Addition Case:* World A: All lives at wellbeing +10. World B: Vast majority at +10, one life at +1. Permutation argument suggests A and B should be equivalent, conflicting with the intuition that adding a life worth living (+1 > 0) is permissible or even good. Requirement: The procedure must have a consistent verdict (likely equality) that avoids valuing "creation" without corresponding destruction elsewhere in the infinite context.
      *   *Why Non-Negotiable:* Failure here leads to blatantly counterintuitive judgments based purely on labeling. Ethics must respect the qualitative identity of experiences.

  4.  **Order Invariance / Convergence:** The procedure's assessment of the *overall* value of a world must not depend on the order in which locations are "summed" or considered. It must yield a consistent verdict (even if that verdict is "undefined" or "incomparable") for worlds where different summation orders give different limits.
      *   *Case:* World C: Locations labeled by integers. Wellbeing = +1 for even n, -1 for odd n. Summing sequentially (1,2,3,4,...) oscillates, no limit. Summing in pairs ((1,2), (3,4),...) converges to 0 per pair. Requirement: The procedure must recognize the inherent inconsistency and *not* rely on a specific ordering to get a definite net value. It should likely treat such worlds as having undefined net value.
      *   *Why Non-Negotiable:* Relying on order smuggles in arbitrary choices, undermining objectivity.

  5.  **Distinction Preservation:** The procedure must rigorously distinguish between:
      *   `A = B` (Worlds A and B are equally good)
      *   `A > B` (World A is better than World B)
      *   `A < B` (World A is worse than World B)
      *   `A ?? B` (No comparable verdict between A and B - they are *incomparable*)
      *   `Undefined` (The procedure cannot assign value/is undefined for this world or comparison)
      *   *Case:* Comparing a world with net-neutral oscillating pattern (like C above) to a world with uniform +1 wellbeing. Requirement: Must clearly state if they are incomparable (`C ?? Uniform+1`), or if one verdict applies, *never* silently equate incomparability with equality (`C = Uniform+1` is wrong if they are incomparable).
      *   *Why Non-Negotiable:* Collapsing these distinctions leads to profound errors (e.g., treating Pareto improvements as neutral or vice-versa).

  6.  **Partial Control Focus (Acts, Not Worlds):** The procedure must evaluate *acts* (choices available to the agent given their limited control), not just compare complete world states. It must output verdicts like "Act X is obligatory/permissible/impermissible" or "Act X is better than Act Y" based on the *differences* it makes.
      *   *Case:* The agent can choose Act X (save 1 life in Paris) or Act Y (do nothing). The background universe is infinite and net neutral. Requirement: Act X must be judged better than Act Y, solely based on the finite difference (+1 life vs 0), regardless of the infinite background.
      *   *Why Non-Negotiable:* Agents don't choose whole worlds; they choose acts with localized effects. The procedure must be action-guiding.

  **Your Custom Requirements (Evaluated):**

  7.  **Invariance to Spacetime Carving (Coarseness):** Moral verdicts about acts/worlds should be invariant under reasonable changes in how spacetime is discretized into "locations," as long as the underlying continuous reality described is the same. **(Keep - Real & Important)**
      *   *Case:* Modeling Paris as 1 location ("Paris") or 8 million locations ("each Parisian") or 10^27 locations ("each atom in Paris"). Saving Paris should be equally good under all carvings. Requirement: The value assigned to saving Paris must be scale-invariant or the *act* verdict must be stable.
      *   *Why Keep:* Avoids artificial dependence on arbitrary modeling choices. Grounds ethics in reality, not discretization.

  8.  **Effectiveness under Symmetry (Infinitely Many Identical Agents):** The procedure must still provide meaningful guidance to an agent even if they are one of infinitely many structurally identical agents, all using the same procedure, and all capable of making similar localized changes. It cannot retreat to "your act only affects finitely much" if this leads to universal inaction when coordinated action would be beneficial. **(Keep - Real & Critical for Coordination)**
      *   *Case:* Infinitely many agents; each can press a button that slightly harms them but greatly benefits a finite set of others. If all press, vast net good. If none press, no harm. Requirement: The procedure must *not* universally recommend inaction simply because each has finite effect. It should likely recommend pressing (if the net local effect is positive) or require coordination (if possible). "Do nothing" should not be the default escape hatch.
      *   *Why Keep:* Tests the theory's ability to handle collective action problems in infinite settings. Crucial for applicability.

  9.  **Graceful Degradation under Uncertainty (Finite Credence):** The procedure must provide reasonable guidance even if the agent assigns only ~70% credence to the universe being infinite (and 30% to it being finite). It should not abruptly fail or give wildly different answers than it would under certainty. **(Keep - Real & Pragmatic)**
      *   *Case:* An act saves 5 lives at some cost. In a finite world, it's net positive. In a specific infinite world model, it might be neutral or incomparable due to background effects. Requirement: With 70% infinite credence, the recommendation should be a weighted amalgamation (e.g., "strongly permissible" or "expected net positive") rather than "undefined" or "incomparable" just because infinity is likely.
      *   *Why Keep:* Pure infinite ethics often fails catastrophically under moral uncertainty about infinity itself. A practical procedure *must* handle this.

  **Camp-Specific Requirements (Potentially Negotiable):**

  10. **Strong Pareto (Improved Location):** If world A is identical to world B except that at least one location is better off in A and no location is worse off, then A is better than B. *Problem in Infinity:* Can conflict with Permutation Invariance (Req 3). See joint unsatisfiability below.
  11. **Avoiding the "Repugnant Conclusion":** The procedure should not deem a world with an enormous number of lives barely worth living as better than a world with a vast number of very happy lives, even in infinite comparisons. *Highly contentious*, often relies on non-additive aggregation or critical levels, which are hard to reconcile with infinite contexts and Permutation Invariance.
  12. **Asymmetry (Avoiding Bad > Creating Good):** Preventing suffering might be morally more urgent than creating happiness. *Negotiable taste*, influences how "net neutral" backgrounds are treated and the urgency of preventing finite harms.

  **Joint Unsatisfiability Flags:**

  *   **The Core Impossibility Triad:** `Strong Pareto (Req 10)` + `Permutation Invariance (Req 3)` + `Finite Supervenience for World Comparisons (Stricter than Req 1)` are **jointly unsatisfiable** in standard infinite settings.
      *   *Why:* Consider Worlds A (all lives +10) and B (all lives +10, except one life at +11). Strong Pareto says B > A. Permutation Invariance says A and B are isomorphic (swap the +11 life with any +10 life), so A = B. Contradiction (B > A and A = B). Finite Supervenience for world comparisons (judging worlds based only on finite differences) would try to isolate the +11 vs +10 difference, reinforcing B > A, conflicting with Permutation Invariance.
      *   *Resolution:* Req 1 (Finite Supervenience) is framed for *acts*, not world comparisons. Req 3 (Permutation Invariance) *must* hold for world comparisons, forcing abandonment of Strong Pareto for infinite worlds. World comparisons must treat permuted worlds as equal, meaning finite differences get "washed out" in the infinite background. *Act* evaluation (Req 6) based on finite differences (+11 vs +10) can still judge the act creating B from A as good, even though the resulting worlds are deemed equal. This highlights the critical distinction between evaluating *acts* and comparing *worlds*.
  *   **Order Invariance vs. Definite Act Rankings:** Achieving consistent, definite "Act X > Act Y" verdicts (Req 6) for *all* pairs of acts in *all* infinite backgrounds is likely impossible while strictly adhering to Order Invariance (Req 4) for world values. Some acts affecting different finite sets within a complex infinite background might lead to incomparable (`??`) outcomes for the *worlds* they create, making the act comparison (`X ?? Y`) also incomparable.

  **The Single Most Eliminative Requirement:**

  **Permutation Invariance (Req 3)** is the **most effective filter**. It immediately eliminates:
  *   **Simple Additivism:** Adding one good life changes the world, violating isomorphism.
  *   **Limit Measures (e.g., limit average, limit frequency):** Highly sensitive to ordering/labeling; permuting locations changes the sequence, changing the limit.
  *   **Hyperreal Valuations (w/ Ultrafilters):** The valuation depends on the ultrafilter choice, which often "picks" a specific equivalence class sensitive to labeling; permutations can map a world to one valued differently under the same ultrafilter.
  *   **Any view prioritizing "creation" over background state:** Mere addition arguments fail the permutation test.

  **Summary of Key Tensions:**

  1.  **Local vs. Global:** Finite acts vs. infinite world comparisons (Resolved by focusing on acts via Req 1 & 6).
  2.  **Labeling vs. Substance:** Permutation Invariance (Req 3) forces focus on qualitative patterns, not labels.
  3.  **Definiteness vs. Undecidability:** Order Invariance (Req 4) and complex backgrounds force incomparability (`??`) or undefinedness sometimes.
  4.  **Pareto vs. Symmetry:** Strong Pareto (Req 10) is incompatible with Permutation Invariance (Req 3) for world comparisons in infinities.
  5.  **Certainty vs. Uncertainty:** Pure infinite rules often break under finite credence (Req 9 demands robustness).

  This spec prioritizes robustness, action-guidance under finite control, and avoidance of labeling paradoxes, while acknowledging fundamental limitations in achieving complete, definite, and strongly Paretian rankings in all infinite contexts. The core non-negotiables (1-6) plus your custom requirements (7-9) define a high bar that severely restricts viable approaches, primarily allowing theories like **finitely additive ethics with permutation invariance** or sophisticated **multi-criteria approaches** focusing strictly on act-differences.
