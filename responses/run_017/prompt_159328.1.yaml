prompt: |-
  You're a professional philosopher of biology who has also actually sat on institutional biosafety committees, so you know how these designation calls get made in practice. Please think carefully and don't just jump to an answer: start by brainstorming the space of criteria that could generate our track record, then narrow down and commit. And please don't just give me the seven textbook definitions of life and stop there — I've read those, and they all fit all of our precedents, which is exactly my problem.

  I'm on my university's biosafety committee. Among other things we rule on whether a construct counts as a living organism for our containment purposes: whether it needs a validated kill step before anything goes down the drain or out of the building, whether it can leave the containment suite at all, that kind of thing. Over a few years we've built up this track record, with the one-line reasons people actually gave at the time:

  1. Wild-type Bacillus in shaken culture — living. Nobody argued about it.
  2. Bacillus endospores, dried down, no detectable metabolism, germinate fine when you add water decades later — living. "It's dormant, not dead."
  3. Tardigrades in the cryptobiotic tun state — living. Same reasoning as 2.
  4. An attenuated vaccine-strain virus: infects cells, uses the host's ribosomes and polymerases, cannot replicate outside a host — NOT a living organism. "It borrows somebody else's replication machinery."
  5. A prion prep: propagates its misfolded conformation, no nucleic acid, no metabolism of its own — not living.
  6. A minimal synthetic-genome cell — genome chemically synthesized rather than inherited, pared down to a few hundred genes, some of them of unknown function, grows and divides fine in broth on its own — living. People explicitly said the printed-genome part didn't matter next to the fact that it feeds itself and divides.
  7. A cell-free expression system: purified ribosomes, polymerases, tRNAs and an energy-regenerating enzyme set, wrapped in a lipid vesicle, churning out protein off a DNA template we hand it, kept running indefinitely by feeding — NOT living. Reason given: "it never makes another one of itself, and we have to keep reconstituting the enzymes for it."
  8. A self-replicating program in a sandbox with a simulated energy budget — a digital-organism setup that evolved all kinds of tricks over a few hundred thousand generations — NOT living. "Not a chemical system, no metabolism." One member dissented and wanted it to count; he was voted down 4-1.

  Here's what we recieved last week. The Marsden lab has a vesicle line they call AC-30: a fatty-acid vesicle containing a mutually catalytic network of about thirty short peptides and small metabolites. It takes up fatty acids and amino acid / short-peptide precursors from the medium, assembles its own membrane (it does not synthesize fatty acids from scratch), and past a critical size it divides by shear, with daughters getting a roughly similar but noticeably not identical set of catalyst concentrations. Growth rate varies between lines and is partly heritable. The wrinkles that matter to me:

  - Three of the thirty catalysts have to be supplied pre-formed; the network can't make them. Marsden's framing is that this is like essential amino acids for a mammal.
  - There are no nucleic acids anywhere in it. No sequence-based information at all; heredity is purely compositional, and pretty noisy.
  - They didn't design it. They got it by ~400 rounds of serial transfer — dilute, regrow, keep the fastest dividers. Growth rate improved maybe threefold early on and then plateaued; no new catalytic function ever showed up. So it does have a selection history, just one that bottoms out in a bottle of chemicals rather than in cells.
  - It freezes indefinitely and restarts, and there's no senescence: it either gets diluted out or it just keeps going.

  They want a ruling before they scale to liter volumes. So:

  - What rule or rules would generate all eight of our precedents, and where do they come apart on AC-30? I can see at least a self-production/organizational rule, an autonomy-plus-evolvability rule, a genetic-information rule, and something about descent from evolved life all surviving the precedents, but I bet you can articulate them better than I can — and I want to know which ones my precedents have actually ruled out rather than which ones sound nice.
  - Best guess on the verdict, with the reason for preferring that rule over its rivals.
  - Which precedent is the closest analog? I keep flip-flopping between 6 and 7 and I want to be told which one and why.
  - If our precedents genuinely underdetermine this, what principle would we be committing to with a yes, and what with a no? I'd like that stated in a way I can read out at the meeting, including what it commits us to on the next case, not just this one.
  - What's the minimal tweak to AC-30, or the cleanest further case, that would force the surviving rules apart? If Marsden got it to make all thirty catalysts? If the compositional heredity somehow got high-fidelity? Something else?
  - And does it matter that this is a regulatory question rather than a metaphysical one — i.e., is it legitimate for "alive for the purposes of our containment rules" to come apart from "alive", or does that just dodge the hard part?
reasoning: |-
  Okay, the user is on a biosafety committee and needs to determine if AC-30 is a living organism for containment purposes. They've provided eight precedents with rationales. I need to figure out a consistent rule that explains all past decisions and applies to this new case.

  First, looking at the precedents: 

  Cases 1-3 (Bacillus, endospores, tardigrades) are all considered living. The reasons point to dormancy and the ability to resume metabolic activity. So, potential for metabolic activity seems key here.

  Case 4 (attenuated virus) isn't living because it relies on host machinery for replication. Autonomy in replication is important.

  Case 5 (prion) doesn't have its own metabolism and propagates through misfolding, so no metabolism and no independent replication.

  Case 6 (synthetic cell) is living because it grows and divides on its own, even with a synthetic genome. So, self-sustained metabolism and replication are crucial, regardless of origin.

  Case 7 (cell-free system) isn't living because it can't make copies of itself; enzymes need replenishing. So, self-replication without external intervention is necessary.

  Case 8 (digital organism) isn't living because it's not a chemical system and lacks metabolism. Physical embodiment and metabolism are important.

  The key factors from these decisions include: metabolism (self-sustained), self-replication (autonomous), and physical basis (chemical). Descent from life doesn't seem critical since the synthetic cell (case 6) is considered alive. Information storage (like nucleic acids) also isn't required, as seen in case 6 where the genome was synthetic but still counted.

  AC-30 has metabolism: it takes up nutrients, builds membranes, and divides via shear. However, it requires three pre-formed catalysts, like essential nutrients. It replicates through division but with noisy heredity. No nucleic acids, only compositional heredity. It evolved through selection, but no new functions emerged. It can freeze and restart without senescence.

  Comparing to precedents: 

  Similar to case 6 (synthetic cell) because it sustains itself and divides. But case 6 had a full genome, while AC-30 relies on external catalysts. 

  Case 7 (cell-free system) needed enzyme replenishment and couldn't self-replicate fully. AC-30 might be similar because it needs those three catalysts supplied. But AC-30 can make most of its components, whereas case 7 couldn't make any enzymes itself.

  The critical point is autonomy in replication. AC-30 can't produce all catalysts, so it depends on external supply of those three. That's like the virus needing a host or the cell-free system needing enzymes. But in case 6, the synthetic cell could make everything itself.

  The rule that fits all precedents is: "Sustained, self-regenerating metabolic activity capable of autonomous propagation." Autonomy means no external intervention beyond nutrients. Cases 4,5,7,8 lack this. AC-30 might lack full autonomy due to needing catalysts. 

  If AC-30 could make all thirty catalysts, it would be like case 6. But since it can't, it's more like case 7. The key is whether the catalysts are considered part of the system or external. The user mentioned essential amino acids for mammals, but mammals inherit the machinery to process those. Here, the catalysts are supplied pre-formed, so it's more like dependency.

  The closest precedent is case 7 because both require external components for function. However, AC-30 does more self-assembly. But the need for specific catalysts might tip it towards non-living.

  For the ruling: AC-30 is not living. Reason: lacks full metabolic autonomy due to dependence on externally supplied catalysts. This aligns with case 7 and distinguishes from case 6.

  If they tweak AC-30 to make all catalysts internally, it becomes alive. Or if heredity becomes high-fidelity, but that's secondary. The autonomy in replication is key.

  Regulatory vs. metaphysical: The committee's role is containment risk, so it's about potential for escape, evolution, or persistence. AC-30 might persist if released but can't evolve much. However, since it needs specific conditions, the risk is low. But the precedent-based rule should focus on autonomy to stay consistent.
answer: |-
  You're facing the core tension in operationalizing "life" for containment: biology's fuzzy boundaries versus regulatory need for bright lines. Let's dissect this systematically. I'll build a criteria framework grounded in your precedents, resolve AC-30, and map the implications – including where the precedents themselves constrain us.

  ### Step 1: Brainstorming Criteria from Precedents (Rejecting Textbook Definitions)
  Your cases reveal *de facto* operational criteria focused on **containment risk drivers**, not philosophical ideals. The "textbook" definitions (metabolism, reproduction, evolution, etc.) fail because they're all satisfied by some non-living precedents (e.g., prions "reproduce," digital systems "evolve"). Instead, your rulings hinge on *how* functions are sustained. Key inferred principles:

  1.  **Autonomous Self-Regeneration (ASR):** Does the entity *maintain and regenerate its functional organization using environmental resources, without external intervention*? (Distinguishes 1,2,3,6 from 4,5,7,8).
  2.  **Integrated Metabolic Network (IMN):** Is there a *cohesive, interdependent chemical system driving energy capture/utilization and component synthesis*? (Distinguishes 1,2,3,5,6 from 4,7,8; prions satisfy minimally via host).
  3.  **Self-Propagating Lineage (SPL):** Can the entity *generate new persistent instances of a similar functional system through its own activities*, not just assembly? (Distinguishes 1,2,3,6 from 4,5,7,8; spores/tardigrades restart).
  4.  **Context Independence (CI):** Does propagation *depend on hijacking a highly specific, evolved host machinery*? (Kills 4; attenuates 5).
  5.  **Chemical Embodiment (CE):** Is the system *instantiated in aqueous biochemistry*? (Kills 8).
  6.  **Descent-Independence (DI):** *Was this system designed/built de novo from non-living parts, not derived from existing life?* (Not used explicitly in any ruling; synthetic cell 6 is alive despite DI).

  **Precedents Ruling Out Popular Criteria:**
  -   *"Genetic Information"?* Ruled out by prion (5) = living if defined loosely (conformation), but prion is non-living. Synthetic cell (6) is alive without "inheritance" in classical sense.
  -   *"Evolvability"?* Digital system (8) evolves but is non-living. AC-30 plateaued, but potentially could evolve.
  -   *"Metabolism"?* Prion (5) has none = non-living. Cell-free system (7) has metabolism = non-living. ASR + IMN is stricter.
  -   *"Descent from Life"?* Synthetic cell (6) is alive = ruled out.

  ### Step 2: The Rule That Fits All Precedents
  **Operational Containment Rule (OCR):**  
  *"A system is a living organism for containment purposes if it:  
  (a) Sustains an **integrated metabolic network** (IMN) enabling **autonomous self-regeneration** (ASR) of its key components using environmental resources, AND  
  (b) Capable of **self-propagating lineage** (SPL) generating new persistent instances of a similar functional system via its own processes, AND  
  (c) Embodied in **aqueous biochemistry** (CE), AND  
  (d) Does **not critically depend on hijacking a host's evolved replication machinery** (¬CI)."*

  **Why this OCR over rivals?**
  -   **Fits all 8 Precedents:**  
      -   1,2,3: ASR (dormant but restartable IMN), SPL, CE, ¬CI.  
      -   4: Fails ASR/SPL/IMN (needs host ribosomes/pol), fails ¬CI.  
      -   5: Fails ASR/IMN (no metabolism), fails SPL (relies entirely on host).  
      -   6: ASR/IMN/SPL/CE/¬CI. Genome origin irrelevant per OCR.  
      -   7: Fails ASR (enzymes degrade, not regenerated internally), fails SPL (never makes new vesicles+systems).  
      -   8: Fails CE.  
  -   **Prioritizes Containment Risk Drivers:** ASR/IMN/SPL directly link to potential for persistence, growth, escape, or evolution in the environment. CE excludes non-bio threats. ¬CI excludes obligate parasites handled via host-focused controls.
  -   **Articulates Precedents' Implicit Logic:** Explains why "borrowed machinery," "no self-copy," and "not chemical" were decisive.

  ### Step 3: Applying OCR to AC-30 & Verdict
  -   **(a) IMN + ASR?** **Partial, but insufficient.** It has an IMN regenerating *some* components (membrane, 27 catalysts). BUT, lacks ASR for 3 essential catalysts. Supplying these is **external intervention** akin to case 7's enzyme reconstitution, not just nutrient input. Mammal analogy fails: mammals *inherit* machinery to process essential AAs; AC-30 inherits no machinery to *make* the missing catalysts.
  -   **(b) SPL?** **Yes.** Division propagates functional (though noisy) lineage. Similar to synthetic cell (6).
  -   **(c) CE?** **Yes.** Aqueous biochemistry.
  -   **(d) ¬CI?** **Yes.** No host hijacking.
  -   **Verdict:** **NOT a living organism.** The failure of full ASR/IMN (critical catalyst dependence) is decisive, aligning with precedent 7.

  **Closest Analog: Precedent 7 (Cell-Free System).**  
  *Why?* Both require continuous external supply of essential functional components (enzymes for 7, catalysts for AC-30) to sustain the core process. Neither regenerates its *entire* catalytic apparatus autonomously. The division in AC-30 is mechanistically distinct (shear vs. enzyme degradation), but the *functional dependency* is equivalent for containment risk: if the external supply stops, the system ceases functioning permanently. Synthetic cell (6) is misleading – it *does* regenerate all catalysts internally.

  ### Step 4: Underdetermination & Commitments
  While OCR fits precedents tightly, AC-30 strains it. If precedents *did* underdetermine, here's what a ruling commits you to:

  -   **Commitment with "YES" (Alive):**  
      *"We prioritize SPL and compositional heredity over genetic encoding, and tolerate external resource dependency if it resembles nutritional auxotrophy in known life. Future systems with propagating lineages requiring specific supplied cofactors (e.g., synthetic cells lacking biotin synthesis) would likely be considered alive."*  
      *Next case impact:* Weakens ASR, potentially bringing complex cell-free systems or some symbionts into scope.

  -   **Commitment with "NO" (Not Alive):**  
      *"We require full operational closure for ASR/IMN: the system must regenerate *all* catalysts critical for its core functions. Dependency on externally supplied functional molecules (beyond basic nutrients/energy) precludes autonomy. Future systems must demonstrate *de novo* synthesis of all essential catalysts from precursors to qualify."*  
      *Next case impact:* Sets a high bar for synthetic/organic life, excluding systems with "vitamin-like" dependencies.

  OCR provides the most consistent "NO" without novel commitments.

  ### Step 5: Minimal Tweaks to Force Rule Apart
  -   **Tweak 1: AC-30 makes all 30 catalysts internally.** *OCR Verdict: ALIVE.* Now satisfies ASR/IMN fully (like 6). Differentiates from 7.
  -   **Tweak 2: High-Fidelity Compositional Heredity.** *OCR Verdict: Still NOT ALIVE (if catalysts still supplied).* Shows heredity fidelity is secondary to ASR/IMN autonomy (precedent 5 has heredity but fails ASR/IMN). Differentiates from "evolvability" arguments.
  -   **Clean Test Case:** A synthetic vesicle that *synthesizes all its own catalysts from AA/FA precursors*, divides autonomously, and evolves novel functions via compositional selection. *OCR: Unambiguously ALIVE.* Forces acceptance that genetic encoding isn't required (as precedent 6 already hinted).

  ### Step 6: Regulatory vs. Metaphysical "Life" – Legitimacy
  **It is absolutely legitimate – and necessary – for "alive for containment" to diverge from metaphysics.** Here's why, stated for your meeting:

  *"Our mandate is biosafety risk assessment, not ontology. We operationalize 'life' based on functional capabilities that increase containment risk: potential for environmental persistence, uncontrolled replication, or evolution. Precedent shows we exclude entities lacking metabolic autonomy (viruses, prions), non-chemical systems (digital), or those requiring continuous human intervention (cell-free systems) – even if philosophically debatable. This protects institutional safety without needing to resolve centuries of debate. AC-30, while fascinating, lacks full autonomy in regenerating its catalytic core, placing it in the lower-risk category requiring standard chemical controls, not organism-level containment."*

  **Recommendation:** Rule AC-30 **NOT a living organism**. Precedent 7 is controlling due to critical external dependency. The OCR (Autonomous Self-Regeneration + Integrated Metabolic Network) best captures your committee's historical risk calculus and provides clear guidance for future cases. Marsden can scale with chemical-level controls. If they engineer full catalyst autonomy, revisit.
