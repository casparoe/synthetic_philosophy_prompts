  Key insight: Planning theory handles this better since it decouples normative judgment from personal commitment. The simple approval account fails precisely because it requires the speaker to hold some first-order stance for the higher-order machinery to operate on. 

  When removing the professional context, the case collapses into ordinary embedded negation that expressivism can handle. The "insincerity" objection fails because institutional roles genuinely suspend personal judgment - we see this in judges, auditors, etc. 

  This does reveal a distinct residue: unanchored negation-under-embedding exposes how some expressivist solutions still rely on speakers having stance-positions, however minimal. Planning theory survives by reconceiving norm-acceptance as non-attitudinal.
answer: |-
  Here is a constructed vignette fulfilling all specifications, followed by the analysis and verdict:

  **Vignette (Workplace Compliance Setting):**  
  > Alex, a corporate compliance officer reviewing a vendor contract, notes: "Section 7.3 clearly states that failing to conduct third-party due diligence violates our anti-bribery policy. Now, if it's *not* wrong for Veridian Inc. to skip due diligence on this subcontractor, then Acme Corp is permitted to pay their invoice immediately under the expedited clause. But Veridian skipped due diligence. Therefore, Acme must delay payment until full audit."  

  ### Key Features  
  1.  **Normative Premise & Embedded Negation:**  
      - Premise: "failing to conduct third-party due diligence violates our anti-bribery policy" (i.e., *is wrong*).  
      - Embedded negation: "if it's *not* wrong for Veridian Inc. to skip due diligence... then Acme Corp is permitted to pay..."  
      - Inference: Modus Tollens (If ¬W → P, but ¬P, therefore W).  
  2.  **Validity under Descriptive Substitution:**  
      Substitute: "violates policy" → "triggers mandatory review", "permitted" → "eligible".  
      *Validity preserved*: "If skipping due diligence does *not* trigger mandatory review, then Acme is eligible for expedited payment. But Acme is *not* eligible. Therefore, skipping due diligence *does* trigger mandatory review."  
  3.  **Different Acts/Agents:**  
      Negated premise concerns *Veridian's act* (skipping due diligence). Conclusion concerns *Acme's act* (delaying payment).  
  4.  **Unanchored Speaker:**  
      Alex has no personal stance on Veridian’s act (approval, disapproval, tolerance, etc.). Their role requires mechanically applying written policy. No higher-order attitude (e.g., "I endorse enforcing this rule") is invoked; they are deducing implications.  

  ---

  ### Analysis by Expressivist Account  
  **Table 1: Step-by-Step State Ascription**  

  | Step          | Sentence                                                                 | Account                              | Ascribed State                                                                 | Verdict | Why                                                                                               |  
  |---------------|--------------------------------------------------------------------------|--------------------------------------|--------------------------------------------------------------------------------|---------|---------------------------------------------------------------------------------------------------|  
  | Premise       | "Failing to conduct due diligence violates policy."                     | Approval + Higher-Order              | Disapproval of skipping due diligence (first-order)                            | Fails   | Alex has no disapproval; unanchored.                                                              |  
  | Premise       | "Failing to conduct due diligence violates policy."                     | Norm-Acceptance-as-Planning          | Acceptance of a plan/rule requiring due diligence                              | Works   | Plans are role-based commitments, not personal attitudes.                                         |  
  | Antecedent    | "If it's not wrong for Veridian to skip due diligence..."               | Approval + Higher-Order              | Higher-order state about *not disapproving* of skipping                        | Strains | Requires Alex to contemplate *not disapproving* an act they have no stance on → artificial.       |  
  | Antecedent    | "If it's not wrong for Veridian to skip due diligence..."               | Norm-Acceptance-as-Planning          | Conditional plan: *If* rule doesn’t forbid skipping, *then*...                 | Works   | Planning semantics handles conditional rules without personal commitment.                         |  
  | Consequent    | "...then Acme is permitted to pay immediately."                         | Both                                 | (Derivative; state depends on antecedent)                                      | N/A     |                                                                                                   |  
  | Conclusion    | "Acme must delay payment."                                              | Approval + Higher-Order              | Disapproval of Acme paying immediately                                         | Strains | Must derive new attitude about Acme’s act from coherence; no anchor for Veridian’s act.           |  
  | Conclusion    | "Acme must delay payment."                                              | Norm-Acceptance-as-Planning          | Commitment to plan: delay payment (inferred from rule violation)               | Works   | Plans generate obligations based on logical structure, not attitude coherence.                    |  

  **Table 2: Load-Bearing Feature & Verdict**  

  | Load-Bearing Feature             | If Removed                                              | Best Objection (from Approval Account)              | Verdict on Novelty                                                                 |  
  |----------------------------------|--------------------------------------------------------|----------------------------------------------------|------------------------------------------------------------------------------------|  
  | Professional role (unanchoredness) | Speaker has personal view on Veridian’s act.          | "Unanchoredness is insincere role-play; real disapproval exists." | **Novel residue:** Unanchored negation-under-embedding exposes a gap in attitude-coherence models. |  

  ---

  ### Verdict on Your Thesis  
  **Unanchoredness + embedded negation constitutes a distinct residue of the Frege-Geach problem**, damaging the "approval-plus-higher-order-state" account but *not* the "norm-acceptance-as-planning" account.  

  1.  **Why it’s novel (not domesticated):**  
      Your friend’s solution relies on the speaker having *some* first-order attitude (even indifference) to ground higher-order states and contraries. Here, Alex’s professional role suspends all personal stances. The approval account *fails* at the negated antecedent because it cannot ascribe a coherent higher-order state about "not disapproving" an act toward which Alex is truly neutral. It also *strains* at deriving a new attitude about Acme’s act without an anchor for Veridian’s. This isn’t about embedding *simpliciter*—it’s about the *interaction* of embedding, negation, and attitude vacuum.  

  2.  **Why planning theory survives:**  
      It treats norm-acceptance as adopting a plan-structure, not expressing attitudes. Alex’s "acceptance" of the policy is role-relative and non-attitudinal. The conditional ("if not wrong, then permitted") is a sub-plan, and modus tollens operates on plan-logic alone. No personal stance toward Veridian’s act is needed.  

  3.  **Response to "insincerity" objection:**  
      Professional roles *genuinely* suspend personal judgment (e.g., judges applying laws they dislike). Insincerity requires hidden attitudes; unanchoredness is transparency. The objection conflates *having no stance* with *suppressing a stance*—Alex’s reasoning is sincere *because* it’s detached.  

  ---

  **Final Judgment:** Your case damages *only* the simple approval/disapproval-plus-higher-order account. Planning theory handles unanchoredness because it severs the link between normative judgment and personal commitment. The residue is real: **negation inside embeddings, when the speaker lacks any anchor attitude, breaks attitude-coherence models but not planning semantics.**
