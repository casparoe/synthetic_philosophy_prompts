prompt: |-
  I am on a small working group that has been asked to draft the consent and succession rules that would govern a gradual neural replacement procedure: the subject's neurons are swapped, a few thousand at a time, for prosthetic units tuned to reproduce their input-output behaviour, so that at no individual step is there a moment at which anyone would want to say the person has gone out of existence, while at the end of the process none of the original tissue remains. The lawyers on the group do not want a verdict on whether the procedure preserves the person. They want to know what a theory of personal identity would have to be able to do in order to be usable as the basis for a statute — and they want to know that before anyone starts citing their favourite theory at them. So the question I am putting to you is this: what are the desiderata?

  Fix the purpose as narrowly as that: a theory good enough to be written into rules that will be applied by registrars, judges and clinicians to people who have never read philosophy and who may reasonably disagree about the metaphysics. Given that purpose, give me the requirements such a theory must meet — the cases it has to return a verdict on, the distinctions it is not allowed to collapse, the results from neuroscience and from ordinary biology that it cannot contradict — and, for each requirement, the case or consideration that makes it a requirement rather than a taste. I want the reasoning to sit in the criteria, not in a scorecard.

  For orientation, here are the cases I keep coming back to, which you should use but need not be limited by. First, the cold swap: a prosthetic unit is trained in advance on a recording of the unit it replaces and runs from that recording rather than from live input for its first weeks, so behaviour is seamless while the causal link to the surrounding tissue is not what it normally is. Second, the same total replacement carried out over twenty years and over a single afternoon under anaesthetic; I want to know whether a theory may let the rate of replacement change the verdict, and if it may, what work the rate is doing. Third, the dormant duplicate: a complete prosthetic version is built before the procedure begins and then kept inert and unopened while the biological original is gradually replaced, and is destroyed at the end; whether the mere existence of an unused duplicate can matter seems to me the sharpest test I have. Fourth, the re-implantation: the removed tissue is preserved, kept non-functional, and then re-implanted in reverse order after the prosthetic system has been running for some months, so that from a certain date two candidates present themselves. Fifth, the thinning, in which each unit is replaced by two units that share its job between them. And sixth, the institutional questions the statute actually has to answer: does the post-procedure candidate own the pre-procedure person's house, answer for that person's debts and crimes, remain married, and count as a victim of homicide if switched off — and is the theory permitted to answer yes to some of these and no to others, or must it be all-or-nothing?

  To that last point, please build in the case that most interests me: a subject signs a directive before the procedure instructing the team to halt if at any stage her capacity to recognise her family falls below a stated threshold; at two-thirds replacement she revokes it and demands that the process continue. A theory that cannot say anything about which of those two expressions of will governs is not usable for my purpose, and I would like you to press on whether any theory can say it without assuming what is in dispute.

  I also want your view on which of the demands usually made in this area are genuine desiderata and which are the prejudices of one camp: the demand for a determinate yes-or-no answer, the demand that the theory invoke no further fact beyond the physical and functional ones, the demand that it vindicate the first-personal conviction of the person who is about to undergo the procedure, the demand that it treat the biological and the prosthetic on a par. And I suspect at least one pair of genuine requirements cannot be jointly satisfied — in particular the requirement that no single swap be pivotal, which the gradualness of the procedure seems to force, and the requirement that the verdict track something that could be lost by degrees rather than all at once. If you think that pair is satisfiable, say how; if you think a different pair is the trouble, say which. Then tell me, in a sentence or two, which single requirement does the most work in excluding the theories you are aware of, and which theory it excludes.

  Close by telling me which requirement you would abandon first if forced, and what argument or new case would make you abandon it — I want to know where your reasoning is most likely to fail, not just where you land. Do not cite anything or point me to a literature; I need to be able to use this without a library. And write it as continuous prose for a memo I am already assembling — no headings, no bullet points, no bold, no tables.
reasoning: |-
  Hmm, the user is part of a working group drafting consent and succession rules for neural replacement procedures. They need a theory of personal identity that can be practically applied by non-philosophers like registrars and clinicians. The lawyers want to know what such a theory must be able to do before anyone starts arguing about specific philosophical positions.

  The user has provided several test cases: the cold swap (pre-trained prosthetic), different replacement rates (20 years vs single afternoon), dormant duplicate (unused copy), re-implantation (creating two candidates), thinning (splitting functions), and institutional questions about legal continuity. They're particularly concerned about a scenario where a patient revokes a prior directive midway through the procedure.

  I need to identify the core requirements for a usable theory. First, it must handle gradual change without sudden discontinuities - no single swap should be pivotal. Second, it must address legal continuity questions consistently, though perhaps not identically for all matters (property vs. criminal liability might differ). Third, it must resolve conflicts between past and present directives without presupposing identity.

  The theory must be metaphysically minimal - it shouldn't require unverifiable "further facts" beyond physical and functional continuity. It should be publicly applicable, avoiding reliance on private experiences. It must also be causally continuous, treating biological and prosthetic substrates equally if functionally equivalent.

  Key tensions include: gradual replacement demanding no pivotal swaps versus legal needs for bright-line determinations; and wanting to respect first-person perspectives while needing objective criteria. The dormant duplicate case is particularly challenging - existence of a copy shouldn't matter if unused, but this tests whether identity relies on uniqueness.

  The most excluding requirement is likely the demand for causal continuity without privileging biology, which rules out biological essentialism. If forced to abandon one requirement, I'd drop the demand for tracking personal identity by degrees, as legal systems often need binary decisions despite metaphysical gradualism.

  For the revocation scenario, the theory must provide decision rules without presupposing identity - perhaps by prioritizing contemporaneous expressions of will during the procedure when capacity is verified. The key is developing criteria that work institutionally while respecting the procedure's gradual nature.
answer: |-
  The desiderata for a usable statute must prioritize institutional stability and resolvability over metaphysical purity, accepting that any workable theory will involve stipulation constrained by empirical reality and practical necessity. Here are the essential requirements, grounded in the cases you’ve outlined and the institutional purpose:

  1.  **Gradual Transition Without Pivotal Swaps:** The theory must not designate any single neuron swap or small group of swaps as the moment of termination or creation of a person. This is forced by the procedure’s design – if any single swap were pivotal, the entire premise of gradual, identity-preserving replacement collapses, rendering the procedure incoherent for legal purposes. The cold swap case tests this: even if a unit runs on a recording initially, breaking immediate causal links, the *overall functional continuity* of the system must suffice if the procedure is to be legally viable. A theory requiring uninterrupted biological causation at the neuronal level fails here.

  2.  **Resolution of Branching Cases:** The theory must provide a clear, non-arbitrary rule for who inherits the original person’s legal standing in scenarios where continuity splits. The re-implantation case is paramount: when biological tissue is restored after the prosthetic system has been running, producing two claimants, the statute needs a definitive answer on which entity (or neither) is the legal successor. A theory that cannot adjudicate this – or resorts to coin-flipping – is useless for probate courts or criminal liability. This also implies the theory *must* allow for the *possibility* of termination of the original legal person (e.g., if neither candidate is deemed the successor, or if the dormant duplicate were activated).

  3.  **Handling Conflicting Directives Over Time:** The theory must supply a rule for adjudicating between a prior directive (e.g., halt if capacity drops below threshold X) and a contemporaneous revocation/instruction (e.g., continue despite capacity being at Y). Crucially, it must do this *without presupposing the identity it seeks to establish*. This is the core challenge of your revocation scenario. The rule might appeal to verified contemporaneous capacity during the procedure itself, prioritizing the most recent expression of will when capacity is demonstrable, precisely because the theory *cannot* definitively settle the metaphysical identity question at the moment of revocation. A theory that requires knowing "who she really is" at the two-thirds mark to resolve the directive conflict is circular and unworkable.

  4.  **Functional Equivalence as Sufficient (Biological Parity):** The theory must treat functionally equivalent prosthetic units as capable of sustaining the relevant aspects of personal identity *for legal purposes*, provided the functional continuity requirement is met. This is compelled by the end state of the procedure – if the fully prosthetic system isn’t legally the original person, the entire endeavor is pointless. The cold swap and rate-dependence cases test the boundaries: if a unit running on a recording is problematic, or replacement speed matters, the theory must explain *why* in terms of disrupted function or continuity relevant to identity, not merely biological substrate. A theory insisting biological neurons are metaphysically essential fails this.

  5.  **Rate Independence (or Explicit Rate-Dependence Justification):** The theory must either deliver the same legal verdict whether the replacement occurs over twenty years or one afternoon under anesthetic, *or* provide a principled, non-arbitrary justification rooted in identity-relevant factors for why speed matters. If speed matters, the statute needs clear thresholds. The intuitive unease with a fast swap often stems from concerns about functional disruption or lack of psychological continuity during rapid change under anesthesia, not speed itself. A theory that makes speed *inherently* decisive without linking it to a failure of continuity (e.g., massive simultaneous disruption) risks arbitrariness.

  6.  **Irrelevance of Unrealized Potential (Dormant Duplicate):** The mere existence of an inert, unused duplicate (dormant duplicate) must not affect the legal status of the entity undergoing gradual replacement. If the duplicate is never activated and plays no causal role, its existence is irrelevant to the identity and continuity of the individual being replaced. This tests whether the theory conflates identity with uniqueness or potentiality. A theory that grants the duplicate relevance introduces paralyzing uncertainty based on undisclosed backups.

  7.  **Continuity of Legal Personhood Without All-or-Nothing:** The theory must allow for the legal personhood (and thus rights, obligations, and liabilities) to persist through the procedure, but it *need not* require that every single legal attribute is inherited identically if compelling reasons exist (though consistency is preferable). The key institutional questions (property, debts, crimes, marriage, homicide) require answers, but the answers *could* theoretically differ if grounded in distinct aspects of identity relevant to each domain (e.g., continuity of memory/mind for debts/crimes vs. bodily continuity for marriage, though this is messy). However, a statute will demand overwhelming consistency. Crucially, the theory must explain *what* is preserved to ground these continuities – typically, sufficient psychological/cognitive continuity and causal connection. The thinning case probes this: if functions are dispersed, is the integrated mind preserved?

  8.  **Metaphysical Minimalism / Public Verifiability:** The theory must not rely on irreducible "further facts" beyond physical constitution, functional organization, causal connections, and observable psychological continuity. Legal proceedings require evidence; appeals to private, unverifiable essences or Cartesian egos are inadmissible. The lawyers' refusal to adjudicate the metaphysics is a demand for a theory grounded in public facts. This excludes substance dualism and strong "further fact" views.

  9.  **Determinate Legal Verdicts:** The theory must ultimately yield a binary legal outcome (e.g., "Entity Y is/is not the legal successor of Person X"). While identity itself may be vague, the law requires bright lines for action. The theory must provide the *criteria* for drawing that line in a principled way, even if the underlying metaphysics acknowledges grey areas. Gradualism forces this requirement – the law cannot tolerate perpetual uncertainty.

  **Tensions:** The most critical tension is between **Gradual Transition Without Pivotal Swaps (1)** and **Determinate Legal Verdicts (9)**. Gradualism suggests a spectrum, while the law demands a binary outcome. This is linked to the tension between **Rate Independence (5)** (if held absolutely) and the intuition that very rapid replacement *might* disrupt continuity in a way slow replacement does not. Bridging (1) and (9) requires the theory to identify the *relevant type of continuity* (e.g., robust psychological connectedness/continuity supported by causal dependence) that can persist by degrees *but* which the law can deem sufficient for continuity of personhood once it meets a stipulated threshold (itself a legal, not metaphysical, line).

  **The Most Excluding Requirement:** **Metaphysical Minimalism / Public Verifiability (8)** does the most work in excluding popular theories. It definitively excludes Substance Dualism (relying on an immaterial soul) and robust "Further Fact" theories (requiring an unverifiable personal essence beyond physical/functional facts), as they posit entities or properties inaccessible to legal evidence. It also strongly pressures Psychological Continuity theories to ground "continuity" in observable causal-functional chains, not just subjective seeming.

  **Requirement to Abandon First:** If absolutely forced, I would abandon **Rate Independence (5)**. The argument for abandoning it would stem from empirical neuroscience showing that *very rapid* replacement under anesthesia genuinely disrupts the dynamic, integrated processes constitutive of conscious experience and memory formation in a way that slow replacement does not, preventing the necessary psychological/causal continuity. A case demonstrating profound, lasting psychological discontinuity *only* in rapid, bulk-swap scenarios, despite functional equivalence at the unit level, could force recognition that speed *can* matter by disrupting higher-order integration crucial for identity. However, I would resist this strongly, as it complicates the statute immensely, requiring definitions of "too fast." The revocation case directive conflict (3) is the hardest nut to crack, demanding a capacity-based procedural rule precisely *because* the identity question cannot be settled mid-stream. The solution lies in deciding the conflict based on verified capacity *at the time of the revocation decision*, not on who she "really is." This procedural rule becomes the statute's pragmatic answer to the metaphysical impasse.
