prompt: |-
  I'm in a small reading group on classical Indian epistemology — we have just worked through the pramāṇa chapters — and I want to test the framework on a real case rather than keep discussing it in the abstract. Please take the Nyāya set of four, if you are happy with that (perception, pratyakṣa; inference, anumāna; comparison, upamāna; testimony, śabda), together with the inference machinery that goes with it: the subject or locus (pakṣa), the property to be established (sādhya), the reason (hetu), the pervasion (vyāpti) that is supposed to tie the reason to what is to be established, its positive and negative formulations (anvaya, vyatireka), the ways a reason goes wrong, and in particular its being counterbalanced by an equally good reason pointing the other way (satpratipakṣa) and its being vitiated by an adventitious condition (upādhi) that makes the concomitance hold only conditionally; plus tarka, the suppositional or reductio-style reasoning that Nyāya declines to rank as a pramāṇa in its own right but relies on to firm up a pervasion suggested by repeated observation (bhūyodarśana). Say which version you are using if you would rather work with another school's, but do not stall on that question.

  The case is John Snow and cholera in London in the 1850s. The facts I stipulate, so that we need not argue about them: since 1849 Snow had argued that cholera is swallowed and multiplies in the gut and is spread through water, against the prevailing view that it is carried by foul air, which was the view of most medical opinion and of the official inquiries; in the 1854 Soho outbreak he mapped the cases around the Broad Street pump and persuaded the authorities to remove the handle, the famous gesture, though the epidemic was probably already past its peak by then; his strongest evidence was what he called the grand experiment, a comparison of households in south London supplied by two different water companies serving much the same streets, one drawing from the sewage-polluted tidal Thames and one from a cleaner stretch upriver, whose customers' cholera mortality differed by a large factor, with the wrinkle that from the outside he often could not tell which company supplied a given house; his view was not accepted in his lifetime, he was eminent as an anaesthetist rather than as an authority on epidemics, and the organism was convincingly identified only in the 1880s, long after his death. What I do not want is a paragraph saying that Snow used inference while his opponents relied on testimony. I want the mapping done properly. Reconstruct Snow's central claim as an inference: what exactly is the pakṣa, the sādhya, the hetu, and what is the vyāpti supposed to be? How would a Nyāya say he established that pervasion — by repeated observation, by tarka, or by neither? My own candidate reading, which I want you to take up and either defend or break, is that the grand experiment is not evidence for the pervasion at all but a device for killing a particular upādhi: the miasmatists could say that what travels together with foul water is foul air, low elevation, crowding and poverty, so that Snow's reason is connected to his conclusion only conditionally, and the point of the two-company comparison is to hold those things roughly fixed and let the water vary. If that is right, then a single well-chosen contrast has done the work that the framework expects many co-observations to do, and I want to know whether Nyāya has any resources for certifying a contrastive, quasi-experimental design, or whether this is the first place the account strains. And tell me where the disagreement actually sits: is the miasma theory best modelled as satpratipakṣa, a rival probans in equipoise with Snow's, or as śabda, the word of the relevant reliable experts (āptas) against one man's inference, or as both at once — and if both, does the framework say which one loses? Conclude the forward direction by saying what Snow was and was not entitled to, in the framework's terms: genuine cognition (pramā), mere removal of doubt, or neither.

  Then the direction I actually care about: whether this episode is a vindication of the pramāṇa framework, an embarrassment to it, or a case it never anticipated. Three things push me toward embarrassment, and I would like you to take them in turn. First, the framework looks designed to grade a finished cognition as knowledge or not, and to be close to silent about what to do while the pramāṇas conflict; Snow acted in exactly the condition that satpratipakṣa describes, and he was right to, so is there Nyāya machinery for warranted action under doubt (saṃśaya), or must that be imported from outside the theory? Second, the evidence that decided the matter was aggregate and statistical, a difference in death rates between two populations, and I do not see how a framework whose stock example is smoke on a hill grades that: the closest thing it has, the upādhi, is recognisably a confounder notion but seems to presuppose that one can inspect instances, whereas what Snow had was rates whose instances he could not individually resolve. Third, there is the retroactive question: the agent became visible decades later and the concomitance stopped being inferential. Does that turn Snow's cognition into pramā, does it make his pervasion genuine after the fact, or is the framework's account of the episode indifferent to how it eventually came out — and if it is indifferent, is that a feature or a cost? Please argue rather than catalogue, and do not pad the answer with citations or further reading; I want the analysis.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated case study application of Nyāya epistemology to Snow's cholera investigation, with specific conceptual constraints. They're clearly deeply versed in classical Indian epistemology and want precise mapping, not general parallels. 

  First I need to reconstruct Snow's core inference strictly within Nyāya parameters. The pakṣa would logically be water sources (since that's the locus of debate), sādhya is cholera transmission, hetu is sewage contamination. The vyāpti claim is universal concomitance between sewage-contaminated water and cholera transmission. 

  The user's upādhi insight strikes me as crucial: Snow's experimental design wasn't proving pervasion but eliminating confounders like poverty or air quality that could mask true causation. This aligns with Nyāya's upādhi analysis but exposes a gap - classical upādhi assumes observable instances, while Snow worked with statistical aggregates. 

  On the conflict resolution: miasma theory functions as both śabda (institutional authority) and satpratipakṣa (counter-inference). Nyāya prioritizes direct evidence over testimony when available, which favors Snow, but doesn't address his need to act amidst doubt. The mortality data creates tension - how does "smoke on hill" epistemology handle population-level probabilities?

  The retroactive validation point cuts deep. Nyāya typically assesses cognition at formation time, so Snow's later vindication shouldn't upgrade his original pramā status. But this feels unsatisfying for scientific discovery. Maybe we need to distinguish provisional investigation (arthāpatti?) from settled knowledge.

  User's three challenges are well-targeted: 1) Action under doubt isn't Nyāya's strength 2) Statistical evidence strains instance-based logic 3) Retroactive validation doesn't fit the framework. I'll argue these show where the system needs supplementation rather than failure. The confounder analysis actually demonstrates Nyāya's adaptability.
answer: |-
  Here is a strict Nyāya analysis of Snow's case, addressing your stipulated facts and concerns, arguing that the framework handles the core logic well but strains at the edges regarding action under doubt and statistics:

  **1. Reconstructing Snow's Inference (Grand Experiment):**
  *   **Pakṣa (Subject/Locus):** Specific water sources (e.g., the Broad Street pump water; water supplied by the Southwark & Vauxhall Company vs. Lambeth Company).
  *   **Sādhya (Property to be Proven):** Being a cause of/instrument for acquiring cholera (*vibrio cholerae* transmission, though Nyāya would frame it as "cholera-causingness").
  *   **Hetu (Reason):** Contamination with sewage/morbid matter (*mala-saṃyoga* or *āmayakara-dravya-yoga*).
  *   **Vyāpti (Pervasion):** Wherever there is sewage contamination of water, there is cholera transmission (and wherever there is no such contamination, there is no transmission - *vyatireka*). Formally: Sewage-contaminated water is invariably concomitant with being a cause of cholera transmission. (*Yatra yatra mala-saṃyukta jalaṃ tatra tatra kolarā-hetutvaṃ*).
  *   **Establishing Vyāpti:** Nyāya would classify Snow's method as primarily **tarka (suppositional reasoning)** supported by **bhūyodarśana (repeated observation)** of correlations, but crucially aimed at eliminating an *upādhi*.
      *   *Bhūyodarśana:* Snow's prior observations (1849 outbreak, case studies) suggested a correlation between foul water and cholera, but this was insufficient to establish *vyāpti* due to plausible counter-explanations.
      *   *Tarka:* Snow employed reductio-style reasoning: *If* (supposition) miasma (foul air) were the true cause, *then* cholera incidence should not correlate so precisely with specific water sources while air quality remains roughly constant (as in the Grand Experiment area). The observed correlation falsifies this supposition. Similarly: *If* sewage-contaminated water is *not* the cause, *then* why the drastic difference between Lambeth and S&V customers? The lack of difference under the supposition is contradicted by observation.
      *   **Your Candidate Reading is Correct:** The Grand Experiment's primary logical function is **eliminating an *upādhi***. The miasmatists proposed "*poverty/crowding/low elevation/foul air*" (*daridratā/saṃghaṭṭa/nīca-sthāna/duṣṭa-vāyu*) as the *upādhi* vitiating the inference. This *upādhi* would mean: Sewage-contaminated water is only *apparently* concomitant with cholera because both co-occur with the *upādhi* (poverty/foul air), which is the *real* cause. Snow's experiment held this *upādhi* roughly constant (same streets, socio-economic mix, elevation, air) while varying the water source. The dramatic difference in mortality directly undermined the *upādhi* by showing that the hetu (sewage contamination) varied *independently* of the proposed *upādhi* and correlated perfectly with the *sādhya* (cholera). This strengthened the case for genuine *vyāpti*. While *bhūyodarśana* provided initial correlation, the controlled contrast was essential for ruling out the *upādhi* and firming up the *vyāpti* claim. **Nyāya Strain:** Classical Nyāya envisions identifying *upādhis* through counter-examples or *tarka*, but the *systematic, quasi-experimental contrivance* of conditions to hold an *upādhi* constant is a methodological sophistication not explicitly detailed. The framework *can* accommodate it logically (as *upādhi* falsification via *tarka* and observation), but the *design* aspect stretches its usual examples.

  **2. Modelling the Disagreement & Snow's Entitlement:**
  *   **Miasma Theory as *Satpratipakṣa*:** The miasma theory presented a rival inference:
      *   *Pakṣa:* Localities/Atmospheres.
      *   *Sādhya:* Cholera occurrence.
      *   *Hetu:* Presence of foul air/miasma (*duṣṭa-vāyu*).
      *   *Vyāpti:* Wherever there is foul air, there is cholera.
      *   This rival hetu (*duṣṭa-vāyu*) appeared equally or even more established based on prevailing observation and testimony. This created a state of *satpratipakṣa* – equipoise between two competing inferences. Snow's Grand Experiment directly attacked the rival *vyāpti* by showing cholera could vary drastically *without* corresponding variation in foul air (within the experimental area), thereby **undermining the rival hetu's validity** and breaking the equipoise.
  *   **Miasma Theory as *Śabda*:** Simultaneously, the miasma theory represented powerful *śabda* – the testimony (*āptavākya*) of the medical establishment, official inquiries, and respected authorities. For Nyāya, *śabda* is a valid *pramāṇa*.
  *   **Resolution:** Nyāya prioritizes *direct evidence* (perception, well-established inference) over *śabda* when they conflict, *provided* the direct evidence is sound and the *śabda* can be shown faulty. Snow's Grand Experiment (perception-based inference bolstered by *tarka* eliminating the key *upādhi*) provided superior *anumāna* compared to the rival *satpratipakṣa* (whose *vyāpti* was now undermined). It also provided grounds for doubting the reliability (*āptatva*) of the prevailing *śabda* on this specific point, as it demonstrably failed to explain the new evidence. **Satpratipakṣa loses first** because its *vyāpti* is falsified, weakening the rival inference. This then diminishes the force of the conflicting *śabda*.
  *   **Snow's Entitlement:** Within Nyāya terms, *after* the Grand Experiment, Snow was entitled to **genuine cognition (*pramā*)** regarding the specific causal link between the contaminated water sources he studied and cholera transmission in those instances. His *anumāna*, fortified by the *upādhi*-elimination via quasi-experimental contrast and *tarka*, met the criteria for valid inference. He had moved beyond mere doubt removal (*saṃśaya-nivṛtti*). *However*, Nyāya would likely argue his *vyāpti* claim ("sewage-contaminated water *invariably* causes cholera") remained provisional (*prāpta-sādhana*) until the specific agent and mechanism (the *upādhi* of "absence of *vibrio cholerae*") was identified and the *vyāpti* universally confirmed. His cognition was valid for the specific instances and sufficient to justify action (removing the pump handle) based on the localized inference.

  **3. Assessment: Vindication, Embarrassment, or Unanticipated?**
  Your three challenges highlight genuine strains, but the core logic holds better than expected:

  1.  **Action Under Doubt (*Satpratipakṣa*):** **Embarrassment/Strain.** Nyāya excels at analyzing *established* cognitions but offers little formal guidance for *action* amidst unresolved *satpratipakṣa* or conflicting *pramāṇas*. It focuses on epistemic status (*pramā* vs. *apramā*), not praxis under uncertainty. Snow acted decisively *while* equipoise existed (before the Grand Experiment fully convinced others). Nyāya might suggest *tarka* could justify precautionary action (e.g., *"If I don't remove the handle, many may die unnecessarily; if I do and am wrong, little harm is done"*), but this is ad hoc reasoning, not a developed theory of warranted action under *saṃśaya*. **This is a significant gap in the framework for real-world scientific/practical reasoning.**

  2.  **Aggregate/Statistical Evidence:** **Strain/Unanticipated.** The classical "smoke on the hill" involves perceivable individual instances. Snow's evidence was population-level mortality *rates*. Nyāya struggles to formally model this:
      *   Can a *rate* (a property of a collection) be the *sādhya*? Nyāya deals primarily with properties of individual loci (*pakṣas*).
      *   Establishing *vyāpti* typically relies on observing concordant/discordant *instances*. Snow inferred causation from statistical association, lacking resolution on *every* individual case (who exactly drank what water). The *upādhi* analysis works well conceptually (confounders), but its application assumes confounders can be assessed per-instance or held constant *en masse*. **The framework lacks formal tools for probabilistic reasoning, causal inference from aggregates, or the concept of statistical significance.** It strains, though the *logic* of eliminating confounders (*upādhis*) via controlled contrast remains valid and powerful, demonstrating the framework's adaptability.

  3.  **Retroactive Validation (Agent Discovery):** **Vindication (with nuance).** Nyāya assesses the validity of a cognition (*jñāna*) *at the time it arises*, based on the *pramāṇas* available then. The later discovery of *Vibrio cholerae*:
      *   Does **NOT** retroactively make Snow's original inference *pramā*. By Nyāya standards, it was *already pramā* when correctly formed via valid *anumāna* (after eliminating the key *upādhi* via the Grand Experiment).
      *   **Does** provide *overwhelming additional confirmation* and refines the understanding of the *vyāpti* (specifying the mechanism). It transforms the inference from one based on correlation and elimination of alternatives to one grounded in understanding the efficient cause (*nimitta-kāraṇa*).
      *   **Is Indifferent (Feature):** The framework's indifference is a *feature*. It emphasizes the *process* of knowing via *pramāṇas*. Snow achieved valid knowledge (*pramā*) through inference *before* the bacterium was seen. The later perception (*pratyakṣa*) of the agent provided a new, direct *pramāṇa* confirming the same fact, satisfying doubts for others, and deepening understanding, but it didn't change the epistemic status of Snow's earlier, properly formed cognition. This highlights Nyāya's focus on justification over ultimate ontology.

  **Conclusion:** The Nyāya framework **largely vindicates** its core logical structure in analyzing Snow's reasoning. It adeptly handles the inference structure, the role of the Grand Experiment in eliminating the critical *upādhi* (confounder) via a sophisticated application of *tarka* and observation, and the resolution of *satpratipakṣa* and conflicting *śabda*. However, it faces **significant strain** regarding: (1) The lack of a formal account for warranted *action* under conditions of doubt (*satpratipakṣa*) – Snow's decisive action exposes this gap. (2) The challenge of formally incorporating aggregate, statistical evidence – the concepts work intuitively (*upādhi* = confounder), but the mechanics for population-level rates and uncertainty are absent. The retroactive validation question demonstrates a **strength** of the framework – its focus on the justificatory process at the time of cognition. While unanticipated in its specific historical form, the logical core proves remarkably robust for analyzing this case of scientific discovery. The strains point not to failure, but to areas where the classical framework requires extension or supplementation for complex, real-world empirical science.
