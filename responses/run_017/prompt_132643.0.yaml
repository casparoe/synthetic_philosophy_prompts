answer: |-
  ## Seminar Handout: Risk-Weighted Expected Utility - A Dialogue  
  **Characters:**  
  *   **Rowan:** Advocates for the rational permissibility of risk-weighted EU.  
  *   **Iris:** Defends standard expected utility theory.  

  **Setting:** Staff common room, whiteboard covered in scribbles.  

  **(The dialogue begins with Rowan pointing at a complex equation on the board.)**  

  **ROWAN:** ...and *that’s* the algebra I was stuck on last week. It feels like a problem, Iris. A glaring one. We start with REU: order outcomes \(x_1 < x_2 < ... < x_n\), decumulative probabilities \(S_i = P(X \geq x_i)\), risk function `r` with `r(0)=0`, `r(1)=1`, `r` increasing. Then:  
  `REU(X) = x_1 + Σ_{i=2}^n r(S_i) * (x_i - x_{i-1})`  
  Fine. Now consider the *mirrored* gamble, `-X`. Its outcomes are `-x_n < -x_{n-1} < ... < -x_1`. The decumulative for `-x_k` in `-X` is `P(-X ≥ -x_k) = P(X ≤ x_k) = 1 - S_{k+1}` (defining `S_{n+1} = 0` for the smallest outcome of `X`). Grinding through the REU definition for `-X`:  
  `REU(-X) = -x_n + Σ_{k=1}^{n-1} r(1 - S_{k+1}) * [ (-x_k) - (-x_{k+1}) ]`  
  Simplify the increment: `(-x_k) - (-x_{k+1}) = x_{k+1} - x_k`. Re-indexing that sum to match the increments of `X`... it gets messy, but the punchline is:  
  `REU(X) + REU(-X) = Σ_{i=2}^n [r(S_i) + r(1 - S_i) - 1] * (x_i - x_{i-1})`

  **IRIS:** *(Leans forward, scrutinizing the board)* Hold on... let me see that step where you combine the sums... *(Traces a line with her finger)* ...Yes, actually, I think you’ve got it. That summation looks correct. The key is recognizing that `1 - S_{k+1}` for `-X` corresponds to the cumulative probability for `x_k` in `X`, which is `1 - S_{k+1}` only if... *(Nods)* ...Right, yes, your indexing checks out. So the sum is over the *increments* `(x_i - x_{i-1})`, each multiplied by `[r(S_i) + r(1 - S_i) - 1]`. Okay. So what’s the devastating implication?

  **ROWAN:** The implication is symmetry. If `r(p) < p` for all `p` between 0 and 1 – the classic risk-averse shape – then for any `S_i` strictly between 0 and 1, `r(S_i) < S_i` and `r(1 - S_i) < (1 - S_i)`. Adding those inequalities: `r(S_i) + r(1 - S_i) < S_i + (1 - S_i) = 1`. Therefore `[r(S_i) + r(1 - S_i) - 1] < 0`. Every term in that sum is negative! So `REU(X) + REU(-X) < 0`.

  **IRIS:** Meaning the REU of the gamble plus the REU of its mirror is negative. Concretely?

  **ROWAN:** Concretely: Take a simple 50/50 gamble. Win $0 or Win $100. Set utility linear in dollars to isolate `r`. A risk-averse REU maximizer with `r(0.5) = 0.4` prefers the sure $50 over the gamble. Right? `REU(Gamble) = 0 + r(0.5)*(100 - 0) = 0.4 * 100 = $40 < $50`. Now mirror it: Lose $100 or Lose $0. The REU of *this* gamble is `REU(-Gamble) = -100 + r(0.5)*[0 - (-100)] = -100 + 0.4*100 = -$60`. The sure alternative? Lose $50. `REU(-$50) = -$50`. Comparing: `REU(-Gamble) = -$60 < -$50 = REU(Sure Loss)`. So they also prefer the sure loss of $50 over the 50/50 gamble of losing $100 or losing nothing. Risk aversion in gains *forces* risk aversion in losses under a single `r`.

  **IRIS:** Ah. The reflection effect vanishes. Prospect Theory's stylized fact – risk aversion in gains, risk-seeking in losses – is impossible here. Someone who dislikes symmetric monetary risk around zero must dislike it equally on both sides. That *is* jarring. I’ll concede that readily. If REU claims to be a general normative alternative to EU, capturing plausible risk attitudes, this seems like a significant hole. EU with a concave utility function can easily generate the reflection effect with a kink at the reference point. This algebra suggests REU can’t, at least not with one `r`.

  **ROWAN:** Exactly! It’s not just a descriptive miss; it feels like a normative constraint we didn’t ask for. Why *should* rational aversion to uncertainty about gains compel aversion to uncertainty about losses? That seems like an illegitimate linkage imposed by the single `r`. So, my fix: Why tie gains and losses together? Let’s have two risk functions. `r_plus` for outcomes strictly above a reference point – say, status quo wealth. `r_minus` for outcomes strictly below. Weight the upper tail of the *gain* distribution with `r_plus`, and the upper tail of the *loss* distribution with `r_minus`.

  **IRIS:** *(Raises an eyebrow)* "Upper tail of the loss distribution"? That sounds... inverted. For losses, a larger loss is worse. The "upper tail" in the loss domain means the bad outcomes – the deeper losses.

  **ROWAN:** Precisely. That’s the point! `r_minus` applied to the decumulative probability `S_i` for a loss outcome `x_i` (where `x_i` is negative, and larger `x_i` means *less* loss/more money) reflects the weight placed on avoiding the *worse* losses further down the tail. A convex `r_minus` (say `r_minus(p) > p` for `p<1`) means *down-weighting* the probability of the very worst outcomes – which would manifest as *risk-seeking* for losses. You’d be less scared of the deep loss tail.

  **IRIS:** Okay, I see the motivation. Separate control. You can set `r_plus(p) < p` (risk-averse for gains) and `r_minus(p) > p` (effectively risk-seeking for losses, by down-weighting the worst tail probabilities). That *could* capture the reflection effect. But now, Rowan, you’ve opened Pandora's box. What about a gamble that *straddles* the reference point? Take: 25% chance of -60, 25% chance of -10, 50% chance of +40. Reference point is 0. How do you compute REU? Specifically, how do you handle the increment from -10 to +40? It crosses zero. Is it one big increment weighted by a single risk function? Or do you split it at zero?

  **ROWAN:** *(Sighs)* That’s the headache. Intuitively, you *split* it. The part below zero, from -10 to 0, is a reduction in loss – handle it with `r_minus`. The part above zero, from 0 to +40, is a gain – handle it with `r_plus`. So the REU would be:
      Outcome -60: Probability 25%, decumulative S = P(X ≥ -60) = 1.0
      Outcome -10: S = P(X ≥ -10) = 0.75 (25% chance of +40, 25% chance of -10)
      Outcome +40: S = P(X ≥ +40) = 0.50
      REU = -60
            + r_minus(S @ -10) * [ -10 - (-60) ]   // Weighting the loss reduction from -60 to -10
            + r_minus(S @ 0?)   * [ 0 - (-10) ]     // Weighting the loss reduction from -10 to 0? But 0 isn't an outcome!
            + r_plus(S @ 40?)   * [ 40 - 0 ]        // Weighting the gain increase from 0 to 40?

  **IRIS:** Exactly! You need outcomes *at* the reference point to anchor the increments cleanly. Here, no outcome is at zero. Your "natural" split introduces an *implied* outcome at zero. You’re interpolating. You’re effectively creating a new partition point. What justifies that normatively? And look at what you’ve built: separate weighting functions for gains and losses, defined relative to a reference point, applied to decumulative distributions within their domains, summing weighted *value* increments... Rowan, you’ve just described Cumulative Prospect Theory with a *linear* value function! `v(x) = x` for gains, `v(x) = x` for losses (since you kept utility linear), and separate probability weighting functions `w_+(p)` and `w_-(p)` which are precisely your `r_plus` and `r_minus` applied to decumulatives! CPT was designed *descriptively* to capture things like the reflection effect and loss aversion. You’ve arrived there by trying to fix REU’s normative problem.

  **ROWAN:** *(Leans back, thoughtful)* Ouch. That stings a bit. Okay, granted, the *form* looks strikingly similar to linear CPT. I concede the formal resemblance is uncanny, almost unavoidable when you split at the reference point. But Iris, the *intent* and the *interpretation* are worlds apart! CPT’s weighting functions are descriptive tools, often argued to be distortions of probability. The reference point is often treated as fluid, maybe irrational. REU – even dual-r REU – is fundamentally normative. `r_plus` and `r_minus` aren’t distortions; they reflect permissible, rational *attitudes towards risk* in those domains. They encode how much weight the agent gives to improving the best-case scenarios (for gains) or avoiding the worst-case scenarios (for losses). The reference point here is just a fixed point for defining gains/losses, arguably status quo wealth, which seems normatively relevant for framing *changes* in welfare. The permissibility argument doesn’t hinge on one `r`; it hinges on the idea that rational agents might care about the dispersion of probabilities across the outcome ranking, not just the final expectation. Dual-`r` just allows that attitude to differ above and below the status quo.

  **IRIS:** But Rowan, you’re tailoring parameters to match a descriptive phenomenon – the reflection effect – that standard EU already handles with utility curvature. Why is this complex machinery – reference point, two weighting functions, splitting increments – normatively superior to a kinked utility function? Isn’t EU's kink just a simpler way to get the same basic asymmetry? And doesn’t REU’s core selling point get lost? Wasn’t the beauty that `r` captured a *unified* attitude to risk? Now you have two, glued together at an arbitrary point.

  **ROWAN:** The core selling point survives perfectly in the pure domain! Even in pure gains, `r_plus` does something EU *cannot*. Take the common consequence Allais paradox. EU forces independence – if you prefer A over B, you must prefer the mixture αA + (1-α)C over αB + (1-α)C for *any* lottery C. People violate that predictably. Crucially, *no* utility function `u`, no matter how curved or kinked, can explain those violations while respecting transitivity and monotonicity. Only distorting probabilities or weighting the *structure* of the gamble – like REU does with `r` – can do it. Dual-`r` REU still explains Allais in gains with `r_plus < p`. EU fundamentally cannot, unless you abandon independence, which is its core axiom! That’s the real normative case for REU: it permits rational deviations from independence that EU illegitimately forbids. Dual-`r` just extends that permissibility logically to handle the gain/loss asymmetry revealed by the mirroring problem.

  **IRIS:** Hmm. *(Pauses, tapping her pen)* I grant you Allais. EU demands independence, people violate it persistently in ways hard to dismiss as pure error, and REU offers a coherent normative rationale for that violation. That’s its strongest card. But this dual-r fix... it feels like over-engineering. You’re adding significant complexity – a reference point, two functions, splitting rules – primarily to salvage a response to the mirroring problem and capture an effect EU handles with curvature. You’ve rebuilt CPT normatively. And while you *say* `r_plus` and `r_minus` are normative parameters, how do you constrain them? If an agent has wildly different `r_plus` and `r_minus`, or an unstable reference point, how is that meaningfully different from the probability distortions CPT describes? Doesn’t the burden of proof shift to showing why *this specific structure* – decumulative weighting with separate functions above/below a reference – is the uniquely rational way to be sensitive to probability dispersion *and* gain/loss domains, rather than just a flexible model mimicking behavior? Hasn’t the clean, unified "attitude to risk" that `r` promised fractured into something much harder to pin down normatively?

  **ROWAN:** Maybe... maybe the unified `r` oversold it. Maybe the core insight was always about weighting the tail – giving normative weight to the probability of doing *better* than some level, or *worse* than some level. The mirroring result shows that with a single `r`, this attitude *must* manifest symmetrically for gains and losses relative to the gamble’s extremes. Dual-`r` just recognizes that the relevant "tail" for gains (doing very well) and the relevant "tail" for losses (doing very badly) are anchored normatively at the *status quo*, not at the gamble’s boundaries. It’s not mimicry; it’s adapting the core weighting principle to where the stakes actually bite.  

  **IRIS:** But is weighting the tail relative to *status quo* inherently more rational than weighting it relative to, say, the minimum outcome? Or than sensitivity to lower-tail cumulative probabilities? REU chose decumulatives. CPT uses decumulatives for gains, *cumulatives* for losses. Which tail orientation is rational? Your dual-r REU picks one way. CPT picks another. EU avoids the issue by integrating via the utility function. If REU is normative, why is *this* specific tail-weighting scheme the rational one, especially now it needs two functions and a reference point? The simplicity argument starts biting back hard.

  **ROWAN:** Because... *(stares at the board, then smiles wryly)* ...because it lets us be rationally nervous about big wins vanishing *and* rationally reckless about avoiding big losses? Honestly, Iris? I don’t have a knockdown normative *axiom* for splitting at zero. Just the strong intuition that fearing downside volatility in my wealth and fearing upside volatility in my debts are different things, and the mirroring algebra *proves* a single `r` conflates them illegitimately. Dual-`r` severs that link. Maybe it *is* closer to CPT than I’d like. But if CPT accidentally stumbles onto a normatively sensible structure for handling gain/loss asymmetry... is that a sin? The core permissibility argument for weighting tails, demonstrated by Allais, still stands untouched. Isn’t that enough?

  **IRIS:** *(Looks at the equation for REU(X) + REU(-X), then at the dual-r straddling example)* Enough to justify the complexity? Enough to claim it’s the *right* normative generalization? I’m not sure. The algebra is clever, Rowan. The fix patches the hole. But watching you rebuild prospect theory brick by brick to make REU handle a basic asymmetry... it makes me wonder if EU’s walled garden, flawed as it is by forbidding Allais-type rationality, isn’t still the simpler, more coherent normative castle. Maybe some risks *should* be ruled out. *(Gathers her notes, stands up)* I need coffee before seminar. See you in class? This one’s going to be lively.  

  **ROWAN:** *(Chuckles)* Guaranteed. Save me a seat. I need to stare at this straddle some more.  

  **(End)**
