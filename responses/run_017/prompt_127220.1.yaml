  ### **Leaf Positions: Logical Space and Diagnoses**  
  Each leaf corresponds to a combination of your axes (shared feature, location, response to unity failure). "Most awkward commitment" is summarized. Unoccupied cells are diagnosed as incoherent (I), unattractive (U), or unexplored (X).  

  | Leaf Position                             | Shared Feature | Location          | Response if Unity Fails | Most Awkward Commitment                                   |  
  |-------------------------------------------|---------------|-------------------|--------------------------|----------------------------------------------------------|  
  | **Benthamite Hedonism**                   | A (Phenomenal) | 1 (Separable)     | –                        | Must reduce all pleasure to one "feel" (e.g., proof ≈ plum). |  
  | **Adverbial Hedonism**                    | A (Phenomenal) | 2 (Adverbial)     | –                        | Cannot explain how "experiencing-as-pleasant" unifies dissimilar acts. |  
  | **Qualia Hedonism**                       | A (Phenomenal) | 5 (Nothing over)  | –                        | Hedonic tone is simple/unanalyzable—cannot be studied or measured. |  
  | **Attitudinal Hedonism (Feldman-esque)**  | B (Attitudinal) | 3 (Relational)    | –                        | Allows "pleasure" without any felt quality (e.g., borrowed afternoon). |  
  | **Pure Attitudinalism**                   | B (Attitudinal) | 3 (Relational)    | –                        | Pro-attitudes can exist without motivation (e.g., habitual smoker). |  
  | **Functional Role Theory**                | C (Functional) | 4 (Functional)    | –                        | Motivation without pleasure is common (e.g., Kilian post-stroke). |  
  | **Motivational Theory**                   | C (Functional) | 4 (Functional)    | –                        | Reduces pleasure to "what we seek," ignoring phenomenology. |  
  | **Disjunctive Pluralism**                 | D (Disjunctive) | –                 | ii (Pluralize value)     | No principled way to define "pleasure" boundaries. |  
  | **Subjective Well-Being Theory**          | E (None)      | –                 | iv (Deflate)             | Stretches "pleasure" to include non-hedonic well-being. |  
  | **Hedonic Eliminativism**                 | E (None)      | –                 | v (Error theory)         | Must deny everyday reports (e.g., "I enjoyed that!") as illusions. |  
  | **Episodic Hedonism**                     | E (None)      | –                 | i (Shrink base)          | Only "in-the-moment" sensations count—discounts memory/anticipation. |  
  | **Unnamed (Biopsychological Functionalism)** | C (Functional) | 4 (Functional)    | –                        | Non-conscious "pleasure" is untestable by introspection. |  
  | **Unnamed (Objectless Attitudinalism)**   | B (Attitudinal) | 3 (Relational)    | –                        | Pro-attitudes without objects are paradoxical (e.g., unexpected joy). |  
  | **Unnamed (Hybrid Attitudinal-Functionalism)** | B/C (Mixed)   | 3/4 (Mixed)       | –                        | Fails to resolve conflicts (e.g., reluctant masochist's "want but dislike"). |  

  #### **Unoccupied Cells and Diagnoses**  
  - **Phenomenal + Relational (A3)**: Incoherent (I) — Cannot be a feeling and a relation simultaneously.  
  - **Attitudinal + Separable (B1)**: Incoherent (I) — Attitudes aren’t separable ingredients.  
  - **Functional + Adverbial (C2)**: Unattractive (U) — Functional roles don’t modify experiences adverbially.  
  - **Disjunctive + Shrink base (Di)**: Incoherent (I) — Disunity implies pluralism, not shrinkage.  
  - **None + Simple property (Eiii)**: Unexplored (X) — If nothing is shared, "simple property" is contradictory.  
  - **Phenomenal + Functional role (A4)**: Unattractive (U) — Phenomenology isn’t reducible to function.  

