answer: |-
  ## Fellowship Proposal: Contrast Reports for Testimony in Large Worlds

  **Title:** Trading Local Contrasts: A Proposal for Efficient Epistemic Cooperation in Vast Hypothesis Spaces

  **Core Question:** In Savage-large worlds (where the hypothesis space vastly exceeds evidence resolution), does structured communication of *local evidence contrasts* (e.g., "My evidence discriminates H_i from H_j, favoring H_i by strength S") enable groups to track truth more effectively than communicating global posteriors or raw data snippets, under identical communication constraints (bit-budgets), despite sacrificing the possibility of guaranteed agreement?

  **Why Existing Frameworks Fall Short:**
  1.  **Small-World Agreement Theorems (Aumann, Geanakoplos & Polemarchakis):** Assume agents share a common, known, and tractable state space. Updating partitions based on public evidence guarantees agreement under common priors. This breaks down in large worlds – the space isn't fully known/sharable, and evidence isn't partition-refining over the whole space.
  2.  **Standard Testimony Models (e.g., Bayesian Persuasion, Cheap Talk with Bounds):** Often focus on strategically transmitting information *about a specific question* (posterior) or raw signals. They don't address the core challenge of large worlds: evidence is inherently *local*, discriminating only between small regions of the vast hypothesis space. Transmitting global posteriors forces agents to compress *irrelevant* distinctions their evidence didn't make.
  3.  **Bounded Rationality & Communication Constraints:** Work on computationally bounded agents or limited bandwidth often maintains the small-world ontology or focuses on lossy transmission of standard representations (posteriors/data). They don't explore communication *designed* around the inherent locality of large-world evidence.
  4.  **"Agreeing-to-Disagree" Literature:** Explains why disagreement persists when common knowledge conditions fail. It highlights the problem (lack of common priors/knowledge) but doesn't provide positive strategies for effective cooperation *despite* this, using the specific structure of large-world evidence.

  **The Proposal: Modeling Contrast Reports in Large Worlds**
  I hypothesize that contrast reports offer a communication-efficient representation of *what the evidence actually did* – resolve local ambiguities. Sharing these allows agents to:
  *   **Integrate Relevant Discriminations:** Focus updating on hypotheses where peers have meaningful evidence.
  *   **Build Sparse Maps:** Gradually construct a network of locally resolved hypotheses, avoiding wasted bits on global uncertainty.
  *   **Improve Robustness:** Be less sensitive to prior mismatches on distant hypotheses than posterior sharing.

  **Core Challenge (The Tension):** Defining the "neighbourhood" (H_i, H_j) without presupposing a small-world structure. My approach: Model hypotheses as points in a *metric space* (e.g., parameter vectors). An agent's evidence is characterized by:
  1.  **Locality:** It significantly shifts belief only within a limited radius (neighbourhood) around the true state.
  2.  **Discriminative Power:** Within this neighbourhood, it provides a likelihood ratio (or equivalent strength measure) for specific pairs of hypotheses it *can* distinguish.

  **Methodology & Work Plan (12 Months):**
  *   **Months 1-2: Formalizing the Large-World Model & Contrast Reports**
      *   Define a generative model: True state θ in high-dim space. Agents receive evidence E_k, generated such that P(E_k | θ, θ') ≠ P(E_k | θ', θ) *only* if d(θ, θ') < R_k (locality) and varies smoothly within this radius.
      *   Define "Contrast Report": Agent k sends tuples `(H_i, H_j, LR_{ij}^k)` for some set of pairs within their evidence's discriminative radius. Bit-budget constraint: Limit number/size of tuples.
  *   **Months 3-5: Simulation Framework & Baselines**
      *   Build agent-based simulations (Python). Agents have:
          *   Priors (potentially heterogeneous/misspecified).
          *   Evidence generation per model.
          *   Communication protocols: (1) Transmit Posterior on Target Question (global), (2) Transmit Raw Data Snippet (lossy), (3) Transmit Contrast Reports (local).
      *   Metrics: Group accuracy on target question over time, convergence speed, robustness to prior mismatch/network structure.
  *   **Months 6-8: Analysis - Why Disagreement Persists & When Contrasts Win**
      *   **Disagreement Proof:** Demonstrate formally that even with full transparency of all past contrast reports and common knowledge of rationality, agents can persistently disagree on the target hypothesis. *Key Insight:* Contrasts fix likelihood ratios for *specific pairs*, but priors over the vast space remain unconstrained and can be updated inconsistently across agents. Common knowledge of *discriminations* doesn't imply common posteriors.
      *   **Performance Analysis:** Identify simulation regimes where contrast reports outperform baselines (e.g., when evidence locality is strong, priors are diffuse/mismatched, target is complex). Analyze *why* – is it better use of bits? Faster propagation of relevant info?
  *   **Months 9-11: Refinement & Negative Result Scenarios**
      *   Explore variations: How crucial is the metric structure? What if agents learn the metric? Dynamic hypothesis generation? More sophisticated report aggregation rules.
      *   **Negative Result Focus:** What if contrast reports offer *no significant advantage* over posterior compression? This might occur if (a) the optimal compression of posteriors implicitly captures the relevant contrasts anyway, (b) the cost of coordinating/understanding contrast reports outweighs benefits, or (c) priors dominate updates so strongly that evidence representation doesn't matter.
  *   **Month 12: Synthesis, Writing, Future Directions**
      *   Synthesize findings into a paper draft. Outline implications for epistemology (testimony, disagreement), decision theory (group rationality under ambiguity), and potentially distributed sensing/AI coordination.

  **What Constitutes a Negative Result & Project Failure:**
  *   **Definitive Negative Result:** Rigorous simulation/analysis showing contrast reports provide *no consistent efficiency gain* in accuracy or convergence speed across plausible large-world scenarios compared to well-designed posterior compression, *given the same bit-budget*. This would be valuable – it clarifies the limits of this approach.
  *   **Project Failure (to be avoided):**
      *   **Ill-Defined Model:** Failure to formalize "local evidence" and "contrast reports" in a way that is both tractable and genuinely avoids presupposing a small world (e.g., if the metric space effectively becomes the small world).
      *   **Intractability:** Inability to derive any analytical insights or run sufficiently revealing simulations due to model complexity.
      *   **Inconclusive Findings:** Results are highly sensitive to arbitrary simulation parameters, showing no clear pattern or advantage/disadvantage.
      *   **Trivialization:** Discovery that the model reduces to an existing framework without novel insights.

  **Why This Matters:**
  This project challenges the small-world assumptions underpinning most formal epistemology of agreement and testimony. By taking Savage's large world seriously and proposing communication based on the *actual discriminatory content* of evidence, it offers a novel framework for understanding how groups can cooperate rationally when perfect agreement is impossible and communication is costly. Success means providing formal grounds for a more efficient and robust epistemology of testimony in complex, uncertain environments. A negative result sharpens our understanding of the fundamental constraints on group rationality in vast possibility spaces.
