prompt: |-
  You are a philosopher of mind and language who also does applied work on classification disputes: you know the literature on concepts, similarity, analogy-making and conceptual slippage in small closed domains, and you know how badly that literature translates into a checklist that non-specialists have to run under time pressure. Think carefully before writing. First brainstorm the conceptual material you will draw on and what has to survive simplification; only then draft the procedure; then run it on the cases; then state plainly where it breaks.

  I chair the Design Integrity Panel of a board-game publishers association. About ten times a year we hear a complaint that one studio's game is a copycat of another's. Our panel is three working designers plus one lay member, we have ninety minutes per complaint including deliberation, and we must issue a one-page written finding the same week. Our sanctions are professional, not legal: a public finding, removal from the association's showcase, and in some cases a requirement to credit the earlier designer. We have no legal staff and we have deliberately put copyright doctrine out of scope, including the idea/expression distinction and the abstraction-filtration-comparison machinery that comes with it. Right now we fall back on a holistic total concept and feel test borrowed from law, and our verdicts are inconsistent in exactly the way you would expect: everything looks like a copy to some panel members and nothing does to others, because similarity is being judged against whatever comparison class each person happens to have in mind.

  I want a reusable decision procedure my panel can actually run, grounded in what is really known about concepts and similarity in a small domain. Please import these ideas explicitly, and tell me if you think one of them should be dropped:

  Fix the microdomain first. In research on computational analogy-making, the letter-string domain is used because it is tiny and the space of alternatives is fully specifiable: given abc becomes abd, what does iijjkk become, and what does xyz become. Notice that the last question has more than one defensible answer precisely because concepts there can slip: successor into predecessor, the letter d into the idea of the next letter, the rightmost position into the final group of a run. I want my panel to begin every complaint by fixing the comparison class for the accused game: the genre, its conventions, the design moves available at the time, the space of games a competent designer in that scene could have sampled. Say how to do that in fifteen minutes with no market research, and what to do when we cannot agree on the comparison class.

  Separate forced choices from free choices. A feature forced by the microdomain carries no copying signal; a free choice that matches does. Give us a test for telling them apart, and handle the hard middle case of a feature that was free when the earlier game was made but has since become a genre convention.

  Test for slippage, not literal identity. A copy can preserve a structure while every surface description changes: dice for cards, a die for a token, a deck for a bag, single worker for stack of workers, one resource for another. Our current holistic test systematically undercounts this. Give us the mapping step in a form three volunteers can apply without the theory.

  Require distinctiveness before counting similarity. A pattern of matches is only evidence if it is rare in the fixed space of alternatives. Give us a coarse way to say how many alternative designs would show this same pattern, including what to do when we genuinely cannot estimate it.

  Check abstraction level. Run the verdict one level up and one level down, and tell us what to write when the verdict flips.

  Then run the finished procedure on three complaints:

  One: a 2023 release with the same rule skeleton as a 2018 card game, different theme, different art, and dice substituted for cards at one point in the turn, plus two balance tweaks the accused studio says took eight months.

  Two: two deck-building games released four months apart, independently developed, sharing everything that defines the genre and nothing else that either panel member can point to.

  Three: a case where the procedure gives us an answer I will not like. Our complainant is a two-person studio; the respondent is a large publisher that has clearly studied the complainant's game. But the mechanic the complainant calls its signature turns out, under the procedure's own tests, to be a slippage copy of an out-of-print abstract game from the late 1980s that none of us had heard of. Tell us what the procedure says and what the one-page finding should look like.

  Finally, give us the honest limits: the kinds of game for which this procedure will misfire, the points at which it must hand the decision to a person because the question is one of values rather than fact, and the cases where it should decline to issue a finding at all. Write the whole thing so a volunteer designer can read it once and run it, with the theory kept in a short appendix rather than in the steps themselves.
reasoning: |-
  We are designing a decision procedure for the Design Integrity Panel to handle copycat complaints in board games. The procedure must be grounded in concepts from cognitive science and philosophy of mind/language, particularly focusing on analogy-making, conceptual slippage, and similarity in small domains. The goal is a practical, reusable process that can be run in a limited time (90 minutes per complaint) by non-specialists.

  Key ideas to incorporate (as per the query):
  1. Fix the microdomain: Define the comparison class (genre, conventions, available design moves) to limit the scope of similarity assessment.
  2. Separate forced choices from free choices: Features that are forced by the microdomain are not evidence of copying; free choices that match are. We need a test for this and to handle the case where a feature was free when the first game was made but has since become conventional.
  3. Test for slippage, not literal identity: Look for structural similarity even when surface features change (e.g., dice for cards). We need a mapping step that volunteers can apply.
  4. Require distinctiveness before counting similarity: A pattern of matches is only evidence of copying if it is rare in the defined microdomain. We need a coarse way to estimate how many alternatives would show the same pattern.
  5. Check abstraction level: Run the verdict at one level up and one level down to see if the conclusion holds, and handle cases where it flips.

  We must also run the procedure on three test cases and identify the limits of the procedure.

  **Brainstorming the Conceptual Material**

  - **Microdomain Fixing**: In analogy-making (e.g., the letter-string domain), the space of possible concepts is constrained. For board games, we must define the relevant design space for the accused game. This involves identifying the genre, its conventions, and the design moves that were available and known at the time of the accused game's development. Without this, similarity judgments are unstable because the comparison class is arbitrary.

  - **Forced vs. Free Choices**: A forced choice is one that is dictated by the constraints of the genre or the problem the game is solving (e.g., having a way to randomize draws in a deck-building game is forced, but the specific method might be free). A free choice is one where multiple alternatives exist and the designer had discretion. If a free choice in the accused game matches a free choice in the original, that is evidence of copying. The hard case: if a feature was free at the time of the original game but has since become a convention, then in the accused game it might be forced. We can handle this by considering the state of the microdomain at the time the accused game was designed.

  - **Slippage (Analogical Mapping)**: Copying can preserve the relational structure while changing the objects. We need a way to map elements from the original to the accused game that captures functional equivalence. This requires identifying the core mechanics and their relationships, then seeing if they map despite surface changes. The procedure must be simple: e.g., list the key mechanics of the original and see if there is a one-to-one mapping to the accused game in terms of function, even if the components differ.

  - **Distinctiveness (Rarity of Pattern)**: We must estimate how common the matching pattern is in the microdomain. If the pattern is common (e.g., many games use a roll-and-move mechanic), then even a match is not evidence of copying. We can use a coarse scale: very rare (only in the original), rare (in a few games), common (in many games), or ubiquitous. If we cannot estimate, we must note that and weigh accordingly.

  - **Abstraction Level Check**: To avoid level-sensitivity, we test the verdict at a higher level (more abstract, e.g., "a game about resource management") and a lower level (more concrete, e.g., "using red cubes for wood"). If the verdict flips (e.g., similar at a high level but not at a low level, or vice versa), we must explain why and decide which level is appropriate. This step is a guard against arbitrary level choice.

  **Procedure Draft**

  The procedure is a checklist to be completed by the panel in order. Time allocation is suggested.

  1. **Fix the Microdomain (15 minutes)**:
     - Identify the genre of the accused game (e.g., deck-building, worker placement).
     - List the conventions of that genre at the time the accused game was designed (e.g., in deck-building: starting deck, buying cards, shuffling discard to form new deck).
     - List the design moves that were available and known in the community at that time (e.g., using dice as randomizers, having multiple resource types). Sources: the panel's collective knowledge, quick reference to well-known games in the genre from that period.
     - If the panel cannot agree on the microdomain, note the disagreements and proceed with the minimal common ground. If no common ground, the complaint may be dismissed for lack of a clear comparison class.

  2. **Identify Features and Separate Forced vs. Free (20 minutes)**:
     - For the original game, list the key design features (mechanics, components, turn structure, etc.) that the complainant alleges were copied.
     - For each feature, determine if it is:
       - **Forced**: Required by the genre or the design problem (e.g., having a way to draw cards in a deck-builder is forced).
       - **Free**: Not forced; there were alternatives that a competent designer could have chosen.
     - For the accused game, do the same for the corresponding features (if any).
     - Handle the middle case: If a feature was free in the original but became conventional by the time of the accused game, then in the accused game it is forced. Thus, a match on that feature is not evidence of copying.

  3. **Test for Slippage (Analogical Mapping) (20 minutes)**:
     - For each feature in the original that is free (from step 2), try to map it to a feature in the accused game by function, not by surface form.
       - Example: If the original uses cards for random draws, and the accused uses dice, but both are used to determine a random outcome in the same phase of the turn, then they map.
     - Create a list of mapped features (if any) that are both free in the original and free in the accused game at the time of its design.
     - Note: If a feature in the original is forced, skip it. Only free features that map count.

  4. **Assess Distinctiveness (15 minutes)**:
     - For the list of mapped free features (from step 3), assess the distinctiveness of the pattern of matches:
       - How many other games in the microdomain (fixed in step 1) have the same pattern?
       - Use a coarse scale:
         - Very rare: Only the original game (or very few) have this exact pattern.
         - Rare: A few games (say, 2-5) have it.
         - Common: Many games (more than 5) have it.
         - Ubiquitous: Almost all games in the genre have it.
       - If the panel cannot estimate, mark as "unknown".
     - Conclusion: Only very rare or rare patterns are strong evidence of copying. Common or ubiquitous patterns are not. If unknown, note that the evidence is weak.

  5. **Check Abstraction Level (10 minutes)**:
     - Take the current verdict (based on the distinctiveness of the mapped free features) and test it at:
       - One level up: Describe the games more abstractly (e.g., "both are engine-building games with a fantasy theme"). Is the pattern still distinctive? If not, then the match might be due to genre conventions.
       - One level down: Describe the games more concretely (e.g., "both use a blue die for magic and a red die for combat"). Is the pattern now more distinctive? If so, that strengthens the case.
     - If the verdict flips (e.g., at the base level it looks distinctive, but at a higher level it's common), then the panel must decide which level is appropriate for the complaint. The default is the base level (as defined by the features in step 2). If the flip reveals that the similarity is at a too high or too low level, adjust the verdict accordingly.

  6. **Deliberation and Finding (10 minutes)**:
     - Based on steps 1-5, the panel must decide:
       - If there are mapped free features that form a very rare or rare pattern, then copying is likely.
       - If the pattern is common, ubiquitous, or unknown, then there is not enough evidence of copying.
       - Also, consider any other factors (e.g., the accused studio's explanation of independent development, the time gap, etc.) but only as they relate to the above.
     - Write the finding: one page, including the microdomain definition, the list of mapped features, the distinctiveness assessment, and the conclusion.

  **Run the Procedure on the Cases**

  *Case One: 2023 release vs. 2018 card game*
  - Microdomain: The accused game is in the same genre as the 2018 game (say, a card-driven strategy game). Conventions in 2023: card-based actions, resource management, etc.
  - Forced vs. Free:
    - Rule skeleton: If the skeleton is a convention (e.g., a common turn structure), it might be forced. But if it's unique, it's free.
    - Dice substituted for cards: If the function (random draw) is the same, then it's a slippage. But if the substitution changes the gameplay (e.g., dice introduce more randomness), then it might not map.
    - Balance tweaks: These are likely free choices, but if they are common adjustments, they might not be distinctive.
  - Slippage: The dice for cards might be a valid slippage if the function is preserved. The rule skeleton might map.
  - Distinctiveness: How many games have this exact rule skeleton? If it's rare, then the match is evidence.
  - Abstraction: At a higher level, both are card games (but accused uses dice, so maybe not). At a lower level, the specific rules might differ.
  - Verdict: If the rule skeleton is distinctive and maps, and the balance tweaks are minor, then copying is likely. But if the skeleton is common, then not.

  *Case Two: Two deck-building games released four months apart, independently developed*
  - Microdomain: Deck-building genre. Conventions: starting deck, buying cards, shuffling, etc.
  - Forced vs. Free: The shared features that define the genre are forced (e.g., having a market to buy cards). If there are no other shared features, then there are no free matches.
  - Slippage: If the complainant cannot point to any other shared features, then no mapping beyond the forced ones.
  - Distinctiveness: The forced features are ubiquitous in the genre, so not distinctive.
  - Abstraction: At any level, the similarities are due to genre.
  - Verdict: No evidence of copying.

  *Case Three: Complainant's signature mechanic vs. an out-of-print 1980s game*
  - Microdomain: The genre of the accused game (and the complainant's game). Let's assume they are in the same genre.
  - Forced vs. Free: The mechanic in question: if it is the complainant's signature, it was free when they designed it. But if the 1980s game had it, then at the time of the accused game, is it forced or free? It depends: if the 1980s game is obscure and not part of the current microdomain, then the mechanic might still be free and distinctive in the current microdomain. However, the procedure requires us to fix the microdomain (current genre conventions). If the 1980s game is not in the current microdomain, then the mechanic is still free and the match is distinctive. But the accused might argue it was inspired by the 1980s game, not the complainant. The procedure doesn't care about the source, only about the match in the microdomain.
  - Slippage: The mechanic might map exactly (no slippage needed) or with some slippage (if the accused changed it slightly).
  - Distinctiveness: If the mechanic is rare in the current microdomain (only the complainant and the 1980s game, but the 1980s game is out-of-print and forgotten), then it's still rare. So the pattern of having that mechanic is distinctive.
  - Abstraction: Check: at a higher level, the mechanic might be common (e.g., "using tokens to track progress"), but at the base level it's distinctive.
  - Verdict: The procedure says there is a distinctive match, so copying is likely. But note: the procedure does not require that the accused copied from the complainant, only that the pattern matches and is rare. However, the panel's mandate is about copying from the complainant. This is a problem: the procedure might flag a match that is due to a third source. We need to adjust: the distinctiveness test is about the pattern being rare in the microdomain, but it doesn't prove the source. The panel might conclude that the accused copied from the 1980s game, not the complainant, but that still means they didn't copy from the complainant? Or did they? The complainant might have popularized it. The procedure only detects similarity, not the act of copying. We must be clear: the procedure is about whether the accused game is too similar to the complainant's game, regardless of the source. So if the match is distinctive, then it's a copycat of the complainant's game, even if the accused got it from elsewhere. The finding might require credit to the earlier designer (the 1980s one) but the complainant is not that designer. This is a flaw.

  **Adjustment for Case Three**: The procedure must focus on similarity to the complainant's game. The existence of a prior art does not negate the similarity between the accused and the complainant. But if the prior art is in the same microdomain and known, then the pattern is not rare. However, if it's unknown, then the pattern is still rare in the current microdomain. Therefore, the verdict should be that the accused game is similar to the complainant's, but the finding might note the prior art and require credit to both? The sanctions are professional: removal from showcase, requirement to credit. But crediting the complainant might be wrong if the accused copied the 1980s game. This is a limit of the procedure.

  **One-Page Finding for Case Three**:
  - Microdomain: [Genre]
  - Mapped features: [List]
  - Distinctiveness: Very rare (only complainant's game and the 1980s game, but the 1980s game is not in the current microdomain, so effectively rare).
  - Conclusion: The accused game is similar to the complainant's game in distinctive ways. However, we note that the mechanic predates the complainant. We require the accused to credit the original designer of the mechanic (from the 1980s game) and to note the complainant's game as a recent implementation. The complainant's allegation of copying from them is not proven, but the similarity is established.

  **Limits of the Procedure**

  - **Misfires for Certain Games**:
    - Games in a genre that is very new or poorly defined: the microdomain cannot be fixed.
    - Games that are highly innovative: the comparison class might be too broad.
    - Games that are very simple: the design space is small, so matches are more likely to be forced or common.

  - **Points Requiring Human Judgment (Values)**:
    - Deciding the microdomain when there is disagreement.
    - Judging whether a feature is forced or free when it's borderline.
    - Assessing distinctiveness when the panel cannot estimate.
    - Handling prior art that is outside the microdomain but relevant (as in case three).
    - Deciding the appropriate level of abstraction.

  - **Cases to Decline**:
    - When the microdomain cannot be fixed (e.g., the game is genre-blending and no agreement).
    - When the distinctiveness is unknown and the panel feels the evidence is too weak.
    - When the complaint is about theme or art (if they are out of scope, as per the panel's focus on mechanics).

  **Final Procedure Document**

  We'll write the procedure in a standalone form for volunteers, with the theory in an appendix.

  ---
  **Design Integrity Panel: Copycat Complaint Decision Procedure**

  **Purpose**: To assess whether a board game is a copycat of an earlier game, based on mechanical similarity in design, using a structured, consistent method.

  **Time Allocation**: 90 minutes per complaint (including deliberation and note-taking).

  **Step 1: Fix the Microdomain (15 minutes)**
  - As a panel, agree on the genre of the accused game (e.g., deck-building, worker placement).
  - List the conventions of that genre at the time the accused game was designed. Consider: what mechanics, components, or structures are typical? (Use the panel's knowledge; no research allowed.)
  - List design moves that were available and known in that genre at that time (e.g., common variants of mechanics).
  - If you cannot agree, note the disagreements and use the minimal common ground. If no common ground, dismiss the complaint (state: "No clear microdomain").

  **Step 2: Identify Features and Classify as Forced or Free (20 minutes)**
  - List the key design features from the original game that the complainant alleges were copied.
  - For each feature, decide:
    - **Forced**: The feature is required by the genre conventions or the design problem (e.g., having a draw pile in a deck-builder).
    - **Free**: There were alternatives; the designer had a choice.
  - For the accused game, check if each alleged feature is present (in the same or a slipped form) and classify it as forced or free at the time of its design.
  - Special case: If a feature was free in the original but became a convention by the time of the accused game, then in the accused game it is forced.

  **Step 3: Map Features with Slippage (20 minutes)**
  - For each free feature from the original (from Step 2), see if it maps to a feature in the accused game by function, not surface form. Ask: "Does the accused game have a mechanic that serves the same purpose in the same part of the game, even if the components or exact rules differ?"
  - List only the free features from the original that map to free features in the accused game. These are the "mapped free features".

  **Step 4: Assess Distinctiveness (15 minutes)**
  - For the pattern of mapped free features (the whole set), estimate how many other games in the microdomain (from Step 1) have the same pattern.
    - Very rare: Only the original game (or very few).
    - Rare: A few (2-5).
    - Common: Many (more than 5).
    - Ubiquitous: Almost all.
    - Unknown: Cannot estimate.
  - Evidence of copying is strong only if the pattern is very rare or rare.

  **Step 5: Check Abstraction Level (10 minutes)**
  - Consider the verdict from Step 4 and test it at:
    - **One level up**: Describe the games in broader terms (e.g., "both are combat games with dice"). Is the pattern still distinctive? If not, the similarity might be due to genre.
    - **One level down**: Describe in finer detail (e.g., "both use a d8 for hero attacks"). Is the pattern more distinctive? If so, that strengthens the case.
  - If the verdict flips (e.g., at the base level it's rare, but at a higher level it's common), then decide which level is more appropriate. Base your final verdict on the level that best reflects the complaint.

  **Step 6: Deliberation and Finding (10 minutes)**
  - Decide:
    - If there is a very rare or rare pattern of mapped free features, then the accused game is a copycat.
    - Otherwise, it is not.
  - Write the finding (one page) with:
    - Microdomain definition.
    - List of mapped free features.
    - Distinctiveness assessment.
    - Conclusion (copycat or not) and any recommended actions (e.g., credit the original designer).

  **Appendix: Key Concepts (for reference)**
  - **Microdomain**: The small world of games we are comparing to. Fixing it makes similarity judgments consistent.
  - **Forced vs. Free**: Forced features don't count as evidence; free ones do. A feature that was free when first introduced may become forced over time.
  - **Slippage**: A copy can change surface features while keeping the underlying function. We map by function.
  - **Distinctiveness**: A pattern must be rare to be evidence of copying. Common patterns are coincidental.
  - **Abstraction Level**: Similarity can change when we shift perspective. Checking levels avoids mistakes.

  **Limits**:
  - This procedure works best for mechanical similarities in established genres.
  - It may misfire for games that are highly innovative or in emerging genres.
  - Human judgment is needed when:
    - The microdomain is contentious.
    - The distinctiveness is unknown.
    - Prior art from outside the microdomain is involved (as in Case Three).
  - Decline to issue a finding if:
    - The microdomain cannot be fixed (Step 1 fails).
    - The complaint is about non-mechanical elements (theme, art) unless they are part of the design mechanics.

  ---
answer: |-
  ### Decision Procedure for the Design Integrity Panel  
  **Grounding in Concepts**: This procedure draws on analogy-making (e.g., letter-string domains), where similarity is judged within a constrained space. We fix the microdomain to stabilize comparisons, separate forced/free choices to isolate copying signals, test for structural slippage (not literal matches), require distinctiveness to avoid false positives, and check abstraction levels to reduce bias. The goal is a replicable, time-bound process that minimizes holistic "feel" judgments.  

  ---

  ### Reusable Decision Procedure (60-Minute Timeline)  
  *Total time: 90 minutes (60 for steps, 30 for deliberation/writing). Volunteers can execute this with no theory knowledge.*  

  #### **Step 1: Fix the Microdomain** (15 min)  
  **Purpose**: Define the comparison class to anchor similarity judgments. Without this, concepts slip (e.g., judging "worker placement" as "all Eurogames").  
  **How to**:  
  - Identify the accused game’s **core genre** (e.g., "deck-builder," "roll-and-write").  
  - List **3–5 conventions** of that genre at the time of the accused game’s release (e.g., for deck-builders: "start with basic cards," "buy from a public market," "shuffle discard pile").  
  - Define the **design space**: "What alternative mechanics were available to competent designers in this genre at that time?" (e.g., "Deck-builders could use dice, tokens, or apps for randomization.").  
  **Disagreement Protocol**:  
  - If consensus fails, use the narrowest genre definition (e.g., "deck-builders with fantasy themes").  
  - If still stuck, **dismiss the complaint** (note: "No agreed microdomain").  

  #### **Step 2: Separate Forced vs. Free Choices** (15 min)  
  **Purpose**: Forced features (microdomain requirements) carry no copying signal; free choices (discretionary) do.  
  **Test for Forced vs. Free**:  
  - **Forced**: The feature is necessary for the genre or solves a design problem with ≤2 alternatives (e.g., "deck-builders need randomizers → cards/dice are forced").  
  - **Free**: The feature has ≥3 alternatives (e.g., "using gems vs. coins for currency").  
  - **Middle Case (Feature became conventional)**:  
    - If a feature was free in the earlier game but is now forced (e.g., "deck-trashing" was innovative in 2008 but expected by 2023), treat it as **forced** for the accused game.  
  **Output**: A table:  

  | Original Game Feature | Accused Game Match | Forced in Original? | Free in Original? | Forced in Accused? | Free in Accused? |  
  |------------------------|---------------------|---------------------|-------------------|--------------------|------------------|  
  | e.g., Card-based randomizer | Dice-based randomizer | Yes (if genre requires randomness) | No | Yes | No |  

  #### **Step 3: Test for Slippage** (15 min)  
  **Purpose**: Catch structural copies where surfaces differ (e.g., dice for cards). Volunteers map functions, not components.  
  **Mapping Step (No Theory Needed)**:  
  - For each **free feature** in the original (from Step 2), ask:  
    1. "What is its **function**?" (e.g., "draft cards to build resources").  
    2. "Does the accused game have a feature with the **same function**, even if components/rules differ?" (e.g., "draft dice to build resources").  
    3. If yes, it’s a **slippage match**.  
  - **Output**: List all slippage matches (e.g., "Card-drafting → Dice-drafting").  

  #### **Step 4: Require Distinctiveness** (10 min)  
  **Purpose**: Matches only matter if rare. Estimate how many games in the microdomain share the **exact pattern of slippage matches**.  
  **Coarse Estimation**:  
  - Count the slippage matches from Step 3.  
  - Ask: "How many other games in the microdomain (Step 1) share this **combination** of features?"  
    - **Very rare**: 0–1 other games.  
    - **Rare**: 2–4.  
    - **Common**: 5+.  
    - **Can’t estimate**: Mark "unknown."  
  - **Output**: Distinctiveness rating. Only **very rare/rare** patterns support copying.  

  #### **Step 5: Check Abstraction Level** (5 min)  
  **Purpose**: Guard against level-sensitive verdicts (e.g., "similar as strategy games" vs. "different as card games").  
  **How to**:  
  - Take the verdict from Step 4 and ask:  
    1. **One level up** (broader): "If we describe both games more abstractly (e.g., ‘resource-management games’), does the pattern remain distinctive?"  
    2. **One level down** (narrower): "If we describe them more concretely (e.g., ‘using blue cubes for wood’), does it change?"  
  - **If the verdict flips**: Write: "Similarity dependent on abstraction level. No clear copying."  

  #### **Step 6: Deliberation & Finding** (Use remaining time)  
  - **Copying Likely** if:  
    - ≥2 slippage matches (Step 3) + very rare/rare distinctiveness (Step 4) + no flip at abstraction check (Step 5).  
  - **Else**: No copying.  
  - **Write the 1-page finding**: State microdomain, slippage matches, distinctiveness, and conclusion.  

  ---

  ### Run the Procedure on Complaints  
  **Complaint One**: 2023 game vs. 2018 card game (rule skeleton same, dice for cards, balance tweaks).  
  - **Step 1 (Microdomain)**: Genre = "Light card-drafting strategy games" (2018–2023). Conventions = card-based actions, point scoring. Design space = cards, dice, or apps for randomization.  
  - **Step 2 (Forced/Free)**:  
    - Rule skeleton: Free in 2018 (multiple alternatives existed).  
    - Dice for cards: Slippage of randomization → free in both.  
    - Balance tweaks: Free in both (not forced by genre).  
  - **Step 3 (Slippage)**: Rule skeleton and randomization map (dice serve same function as cards).  
  - **Step 4 (Distinctiveness)**: Very rare (only 2018 game had this skeleton + randomization).  
  - **Step 5 (Abstraction)**: Verdict holds at higher ("strategy games") and lower ("dice vs. cards") levels.  
  - **Verdict**: Copying likely. Tweaks are incremental, not transformative.  
  **Finding**: "Match on rule structure and randomization method is distinctive. Credit original designer."  

  **Complaint Two**: Two deck-builders released 4 months apart, share only genre conventions.  
  - **Step 1 (Microdomain)**: Genre = "Deck-builders." Conventions = starting deck, market, shuffling.  
  - **Step 2 (Forced/Free)**: All shared features forced (e.g., "shuffling discard pile" is required).  
  - **Step 3 (Slippage)**: No free features match → no slippage.  
  - **Step 4 (Distinctiveness)**: N/A (no matches).  
  - **Verdict**: No copying.  
  **Finding**: "Similarities reflect genre conventions, not copying."  

  **Complaint Three**: Small studio vs. large publisher; "signature" mechanic matches 1980s game.  
  - **Step 1 (Microdomain)**: Genre = "Abstract strategy games" (modern era). Conventions = grid movement, short playtime. Design space = mechanic was free (1980s game obscure).  
  - **Step 2 (Forced/Free)**: Mechanic free in complainant’s game and accused game (not conventional now).  
  - **Step 3 (Slippage)**: Mechanic maps exactly (no slippage needed).  
  - **Step 4 (Distinctiveness)**: Very rare (only complainant’s and 1980s game).  
  - **Step 5 (Abstraction)**: Verdict holds at all levels.  
  - **Verdict**: Copying likely, but source unclear.  
  **Finding**: "Accused game copies complainant’s distinctive mechanic. However, prior art exists from 1980s. Sanction: Credit both original designers."  
  *(You won’t like this, but the procedure flags the similarity. Values call: Credit the true innovator, not just the complainant.)*  

  ---

  ### Honest Limits  
  **When the Procedure Misfires**:  
  - **Emerging genres**: No stable microdomain (e.g., "narrative-driven deck-builders").  
  - **Overly simple games**: Small design space → everything is forced (e.g., Tic-Tac-Toe variants).  
  - **Aesthetic/thematic disputes**: If art/theme is core, procedure ignores it (scope: mechanics only).  

  **Where Humans Decide (Values, Not Facts)**:  
  - Setting the microdomain (Step 1) if genres blend.  
  - Judging "forced vs. free" in borderline cases (Step 2).  
  - Handling prior art outside the microdomain (e.g., 1980s game in Complaint Three).  
  - Sanctions: Crediting requires ethical weighing (e.g., who deserves it?).  

  **When to Decline a Finding**:  
  - Microdomain undefined (Step 1 fails).  
  - Distinctiveness "unknown" and no slippage matches (Step 4).  
  - Complaints about non-mechanical elements (e.g., art, wording).  

  **Final Note**: This procedure reduces inconsistency by anchoring judgments in the microdomain and structural slippage. It won’t catch everything—but it makes biases explicit. Theory appendix below.  

  ---  
  ### Appendix: Core Concepts (For Reference)  
  - **Microdomain**: A tiny design space (like letter-strings) to constrain similarity judgments. Prevents concept slippage.  
  - **Forced vs. Free**: Borrowed from computational analogy. Forced choices are microdomain constraints; free choices signal intent.  
  - **Slippage**: Structural copying (e.g., dice→cards) from cognitive science. Focuses on function, not form.  
  - **Distinctiveness**: From similarity research. Matches must be rare to imply copying.  
  - **Abstraction Level**: Tests robustness. Avoids errors from arbitrary granularity.
