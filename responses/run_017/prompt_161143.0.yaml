  ## The Precommitment Device

  Monday's light is pale and clear,
  the deadline's glow, a week away.
  My outline breathes, distinct, austere;
  no fog obscures the work's true way.
  I know the path: research, then write.
  Resolve feels cool, a steady stone.
  This time will differ. I ignite
  the blocker—social feeds disown.

  **I could just check one thing... but no.**

  The weekend's shadow starts to creep.
  The draft lies open, stubborn, slow;
  concepts that soared now sink in sleep.
  Outside, the path along the creek
  invites a run—quick, sharp, and free.
  That old, familiar pressure: seek
  escape's brief, certain ecstasy.

  **I could just stretch my legs... but no.**

  Thursday. The cursor blinks, accusatory.
  The argument frays, a tangled skein.
  A friend texts: "Quick drink? Justatory!"
  The pub's warm hum, a sweet refrain
  against this screen's cold, glaring debt.
  The blocker's shield feels thin, remote.
  The 'now' expands, a crushing net;
  the future shrinks, a brittle note.

  **I could just have one pint... but now?**
  **I could just...**

  Friday dawns, thick and grey.
  The deadline looms, a monstrous weight.
  The blocker screams "Access Denied"
  ...yet somehow finds a backdoor gate.
  The password's guessed—a frantic try.
  The feeds flood in, a bright cascade.
  That distant "No" becomes a sigh,
  then melts entirely, plans unmade.

  **I could just... I could just...**

  ## Notes

  *   **Refrain Spacing:** The line "I could just..." appears first after 8 lines, then after another 8 lines (total line 16), then after 4 lines (line 20), then twice in the 4-line stanza (lines 24 & 25), and finally as the closing line. This accelerating frequency mimics hyperbolic discounting's steepening curve.
  *   **Sophisticated Agent:** The speaker *knows* the future reversal ("This time will differ") and sets up a precommitment ("ignite the blocker – social feeds disown"). The ending shows them actively bypassing it ("The password's guessed"), highlighting the struggle even with foresight.
  *   **Concrete Stakes & Reversal:** The core conflict (work vs. distraction - run/drink/feeds) remains constant. Only the temporal proximity changes, driving the reversal from planned work to immediate gratification.
  *   **No Moral, No "Real Self":** The poem ends with the precommitment breached ("plans unmade"). It simply depicts the dynamic. There's no judgment about which preference is "true," only that proximity changes the balance of power.
  *   **Modeling in Form:** The accelerating refrain *is* the hyperbolic discounting curve made audible/visible, contrasting with constant exponential spacing. The sophisticated awareness is shown through the precommitment attempt and its eventual (partial) failure.
