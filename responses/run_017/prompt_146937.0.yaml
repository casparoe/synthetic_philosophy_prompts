  Okay, let's think this through properly, like we're hashing it out over coffee after a seminar. This engagement ring puzzle is genuinely fascinating precisely *because* it frustrates a clean signalling-theory read. You're right that the standard "costly signal of commitment/quality" explanation feels both intuitively *right* and yet somehow insufficient or misaligned with the actual phenomenology. Let's dissect it step by step, laying out the options, their strengths, weaknesses, and where the uncertainties lie – separating what I feel reasonably confident about from where I'm speculating.

  **Brainstorming the Space:**

  1.  **Classic Costly Signalling (Handicap Principle):**
      *   **Core Idea:** The expenditure is a credible signal precisely *because* it's wasteful/hard to fake. Burning money demonstrates surplus resources ("I can afford this") or commitment ("I'm willing to sacrifice this for you"). The audience is primarily the *recipient* (assessing partner's commitment/resources) and potentially secondary audiences (family/friends/society assessing the seriousness of the union).
      *   **Problems You Noted:**
          *   **Privacy of Cost:** If the exact cost is private, how does it signal *to anyone but the recipient*? Maybe the *visible extravagance* (size/sparkle) proxies for cost? But the norm emphasizes the *actual cost paid by the giver*, even if invisible.
          *   **Grandma's Ring:** Zero cost to the giver, yet maximal symbolic value. Signals… inheritance? Family approval? Sentimental commitment? But not *current* resource expenditure by the signaller. Breaks the "cost borne *now* by *this* signaller" requirement.
          *   **Lab-Grown Suspicion:** If the signal is "I spent X," a physically identical lab diamond costing 1/3rd *should* be a weaker signal of *expenditure*, but why "false claim"? A cheaper suit isn't a "forgery" of an expensive one; it's just less impressive. The reaction feels different – more like detecting a lie about the object's *essence* or the giver's *intention*.

  2.  **Hostage/Bond Theory (Thomas Schelling-inspired):**
      *   **Core Idea:** The ring isn't (just) a signal; it's a sunk cost, a "hostage" given to the recipient. If the engagement breaks (especially if the giver is at fault), the recipient keeps the ring. This creates a credible commitment by making betrayal expensive for the giver. Legally, engagement rings *are* often treated conditionally (returned if engagement breaks without fault by recipient).
      *   **Strengths:** Directly addresses the "burning money" aspect (sunk cost) and provides a clear mechanism for commitment. Audience is primarily the recipient, holding the bond.
      *   **Problems:**
          *   **Grandma's Ring:** Still problematic. The "hostage" value is sentimental or historical, not monetary sunk cost by the giver. If the ring is priceless (grandma's), the hostage value is enormous, but the giver incurred no *financial* cost.
          *   **Lab-Grown Suspicion:** Doesn't explain this well. A $5K lab diamond is as much a sunk cost as a $15K mined one. Why is one a more credible "hostage"? The suspicion seems unrelated to its forfeitability.
          *   **Scope:** Explains the *conditional gift* aspect well, but not the *specific norms* about mined diamonds, size expectations, or the intense social pressure/convention surrounding it. Why *this* object with *these* properties?

  3.  **Constitutive Symbol / Sacralization (Social Ontology Focus):**
      *   **Core Idea:** The ring isn't primarily *evidencing* a pre-existing commitment (signal/bond); it's partly *constituting* the commitment itself within a shared social practice. Its specific properties (cost, mined origin) are part of the *conventional script* that transforms it from a piece of jewelry into a sacred engagement token. Violating the script doesn't just weaken a signal; it undermines the ritual's power to *create* the intended social fact (the engagement).
      *   **Strengths:** Explains the **lab-grown suspicion** perfectly. A lab diamond, identical materially, lacks the "proper" causal history (mined, "natural," expensive) required by the conventional script. It's like using monopoly money in a real transaction – it fails to *count as* the real symbolic act, hence feeling like a "false claim" or forgery. Explains **grandma's ring**: Its power comes from its *provenance* and history, fitting a *different* (but equally valid) script within the practice ("heirloom as blessing/inclusion"). Explains the **resale value collapse**: Its value is almost entirely *conventional/symbolic*, tied to its role in *this specific ritual*. Outside that context, it reverts to commodity value.
      *   **Problems:** Can feel less predictive or "clean" than signalling/hostage models. How do we precisely define the "script"? Doesn't *directly* explain the *initial pressure* towards high cost, though it explains the *stigma* around cost-cutting that violates convention.

  4.  **Status Display / Veblen Goods:**
      *   **Core Idea:** It's about conspicuous consumption, displaying wealth and taste to broader society. The mined diamond's cost *is* known/estimated by observers based on size/cut/etc., signalling socio-economic status.
      *   **Strengths:** Explains the pressure for visible size/extravagance. Fits De Beers' marketing angle ("two months' salary" sets a public benchmark).
      *   **Problems:** Fails on **privacy** (exact cost still hidden), struggles with **grandma's ring** (low status display?), and especially **lab-grown suspicion** (a large lab diamond *should* display status just as well). The "false claim" reaction isn't about status display being weak; it's about the object itself being deemed illegitimate.

  **Settling on an Answer (With Caveats):**

  The most satisfying, comprehensive explanation, especially given your crucial observation about the "false claim" reaction to lab diamonds, is a **hybrid model centered on Constitutive Symbolism, heavily leveraging costly signalling as a *component of the convention*, but ultimately grounded in social ontology.**

  Here's the reconstructed implicit theory:

  1.  **The Core Function:** The engagement ring practice is a social convention designed to publicly mark and solidify a commitment to marry. Its primary "content" is the creation of a recognized social status ("engaged") and the obligations/expectations that flow from it.
  2.  **The Role of Cost & Origin (Signalling *within* Convention):** Within this convention, the *specific properties* of the ring (significant cost, mined diamond) function as **conventional requirements for the symbol to be valid and effective**. Why these requirements?
      *   **Costly Signalling (as Mechanism):** The expenditure *is* a costly signal, primarily to the *recipient*, of the giver's *seriousness and prioritization*. "I am willing to sink significant resources (that *could* be spent elsewhere) specifically into *this symbol of our future union*." It demonstrates commitment through sacrifice. The privacy isn't fatal; the *giver and recipient know*, and the *visible quality* proxies publicly. The sunk cost aspect (hostage theory) *reinforces* this commitment signal to the recipient.
      *   **Sacralization through Cost & Scarcity:** The high cost and difficulty of acquisition (mined diamonds) *transform* the object. It moves from a mere commodity to a sacred ritual object. Burning the money (resale collapse) is *part of the sacrifice* that consecrates it. Lab-grown diamonds, being cheap and easy, fail this transformation. They remain "commodity," unable to bear the symbolic weight. Hence the "false claim" – it *looks* like the sacred symbol but lacks the sacrificial/consecratory history. It hasn't gone through the ritual fire.
      *   **Provenance as Authenticity:** "Mined" signifies "natural," "rare," "authentic," concepts deeply embedded in the romantic ideal the convention draws upon. "Lab-grown" signifies "artificial," "common," "manufactured," which feels antithetical. Grandma's ring works because its *provenance* (family history, love story) provides an *alternative path to authenticity and sacralization*. Its value is its *narrative*, not its mineral cost.
  3.  **Constitutive Power:** Crucially, adhering to these conventional requirements (cost, mined origin, specific presentation) is *what makes the act count as* properly performing the engagement ritual. It's not just evidence; it's part of *creating* the social fact "we are properly engaged" in the eyes of the couple themselves and their community. Violating the convention (cheap lab stone, cubic zirconia) doesn't just send a weak signal; it risks the act *not being recognized as a valid engagement ritual* by the participants or society, leading to the "suspicion" or feeling of fraud. Is she *really* engaged, or is he just cheaping out?

  **Where Signalling Theory Falls Short/Where Social Ontology Takes Over:**

  *   The **"false claim" reaction to lab diamonds** is the smoking gun. Signalling theory predicts "less impressive." Social ontology predicts "potentially invalid ritual object." The observed reaction aligns strongly with the latter.
  *   The **power of grandma's ring** is inexplicable via pure costly signalling or hostage theory, but makes perfect sense as an *alternate valid path* within the broader convention of engagement symbolism, leveraging provenance for authenticity/sacralization.
  *   The **resale collapse** is best seen as a *consequence* of the object's value being almost entirely tied to its role in a specific ritual context (constitutive symbolism) rather than its intrinsic properties or signalling power per se.

  **Underdetermination & What Changes:**

  *   **Could a plain status-goods view work?** It could explain *some* pressure for visible size, but utterly fails on the core puzzles (privacy, grandma's ring, lab suspicion). It's insufficient.
  *   **Constitutive view without signalling?** Yes, *in principle*. We could imagine a convention where the ring's power comes *solely* from its symbolic history or a completely arbitrary marker (e.g., *only* heirloom rings, or a specific non-precious stone). **What would change?**
      *   **Cost Sensitivity:** Pressure to spend large sums *specifically on a new, mined diamond* would significantly decrease or vanish. Spending would become optional or focused on aesthetics/sentiment rather than minimum cost thresholds.
      *   **Origin Taboo:** The stigma against lab-grown diamonds would likely *persist or even intensify* if "mined" remained part of the conventional requirement for authenticity, or it could *shift* if the convention evolved to accept lab stones as equally valid ritual objects (which is arguably starting to happen). The key change is that cost alone wouldn't validate the symbol; adherence to the *conventional type* would be paramount.
      *   **Resale Value:** Would likely remain low, as the ring's primary value is still symbolic and context-bound. Its meaning evaporates outside the engagement ritual.
      *   **Grandma's Ring:** Would remain highly valued, perhaps becoming the *ideal* within such a system.

  **The State of Play & My Uncertainties:**

  *   **Settled (Among Experts):** There's broad consensus that costly signalling plays *a role* in mate selection rituals and gift-giving. There's also strong consensus that social conventions and rituals involve constitutive rules and collective intentionality. The De Beers marketing campaign's *effectiveness* in establishing/modernizing the *specific* diamond norm is well-documented historically.
  *   **Live Disputes/Uncertainties:**
      *   **The Primacy Question:** Is costly signalling the *primary driver* here, with conventions built atop it? Or is the costly element *just one part* of a primarily constitutive convention? (I lean strongly towards the latter in this case, but it's debated).
      *   **The "Audience" Problem:** Who exactly is the cost signalling *to* in private contexts? Is it *just* the recipient? Does it signal self-commitment? (This is tricky; signalling theory usually implies an external audience, but internal/self-signalling is theorized).
      *   **The Evolution of Conventions:** How *exactly* did the mined-vs-lab distinction become so affectively charged? Was it purely De Beers marketing ("real = natural = mined"), tapping into deeper biases? Or are there independent cognitive foundations for valuing "natural" provenance? (I suspect marketing exploited pre-existing biases, but it's hard to prove).
      *   **The Future:** Will the lab-grown diamond stigma fade as they become normalized and the convention evolves? Or will the "authenticity" distinction persist? (I'm unsure; convention shifts are hard to predict, though economic pressure is strong).
  *   **Where I'm Speculating:** My strong emphasis on the constitutive/sacralization aspect as explaining the core puzzles (lab suspicion, grandma's ring) is my synthesis. While grounded in social ontology, the precise weight given to cost *as a consecrating sacrifice* versus cost *as a signal* within that constitutive frame is an interpretive leap, though one I think the phenomenology demands. The link between "sunk cost" and "sacralization" is intuitive but not rigorously defined in the literature I know.

  **In Essence:**

  The engagement ring norm is a powerful social convention where a physical object is transformed into a sacred symbol through adherence to specific rules (high cost, mined origin). Costly signalling is a crucial *mechanism within the convention* (demonstrating seriousness/sacrifice to the recipient), and the hostage aspect adds a commitment reinforcement. However, the convention's core power comes from its constitutive nature: performing the ritual *correctly* (with the "right" ring) creates the social fact of engagement. This explains why violating the material script (lab diamond) feels like a forgery – it fails to be the *right kind of thing* for the ritual, regardless of its signalling strength. Grandma's ring works because it follows an *alternate valid script* within the same broad convention, leveraging provenance for authenticity. Dropping the costly signalling *aspect* would likely diminish price pressure but leave the demand for ritualistic "authenticity" (however defined) largely intact. The resale collapse is a testament to the symbol's context-dependence, not just its sunk cost. It's less about proving resources and more about performing the rite correctly to summon the social reality of "engagement."

  Still chewing on it myself, but that's where the evidence and logic seem to point most strongly right now. What do you think – does that reconstruction hold water, or are there cracks I'm papering over?
