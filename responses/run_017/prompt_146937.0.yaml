  2) Sacralization: Maybe it's about transforming a commodity into a sacred object through cost, explaining the horror at "fake" diamonds even when physically identical. 

  3) Relic logic: The emphasis on mined diamonds suggests provenance matters independently of cost - grandma's ring works because it carries ancestral blessing. 

  4) Convention entanglement: The practice might be so culturally encoded that violating any element (cost, origin) reads as rejecting the whole symbolic system.

  The user's sharpest insight is that lab diamonds aren't just cheaper but feel fraudulent. That screams "broken convention" more than "weak signal." If we dropped the costly signalling aspect but kept the sacralization/convention elements, the price tag might become flexible while the origin taboo remains. You could plausibly have a norm where couples spend little but insist on "real" (mined) stones, or splurge on lab diamonds if the convention shifts.

  Biggest uncertainties: How much the market deliberately exploited pre-existing symbolic structures versus creating them wholesale (De Beers' marketing is overstated in pop culture). Also whether younger generations rejecting diamonds will collapse the convention or just reshape it.

  Key distinction: Signalling theory struggles with identical substitutes triggering moral outrage - that's where social ontology takes over with its focus on collective intentionality. The "false claim" reaction suggests the object's meaning depends on its socially agreed backstory, not just physical properties.

  What would change without signalling? If couples framed rings as mutual commitments rather than displays, cost sensitivity might increase but the authenticity taboos could persist independently. The resale value crash might even intensify - the more it's a pure symbol, the less it should function as an asset.

  Ultimately the ring acts as a nexus: part signal, part sacrament, part legal token, part tradition. No single theory captures why lab diamonds feel like forgeries while grandma's ring radiates legitimacy. That's the core mystery worth chasing.
