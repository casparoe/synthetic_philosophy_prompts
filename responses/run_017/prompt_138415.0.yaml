answer: |-
  Here are five precise interpretations of "qualia are ineffable," ordered from most trivial to most radical:

  1.  **Communication Limitation:** Qualia cannot be adequately communicated *to someone lacking the relevant type of experience* (e.g., describing red to a congenitally blind person).  
      *Status:* Platitude (widely accepted). Supports *neither* side directly; both can agree this happens.  
      *Nature:* Claim about cognitive/linguistic limitations relative to experiential background.

  2.  **Descriptive Incompleteness:** While aspects of qualia can be described (e.g., location, intensity, associations), their full, specific, subjective *character* cannot be wholly captured by any description *available to us*, even for the experiencer.  
      *Status:* Substantive and defensible. Supports the *cohort* (something science might miss).  
      *Nature:* Claim about cognitive/linguistic limitations inherent to human cognition.

  3.  **Non-Functional/Non-Physical:** The specific subjective character of qualia cannot be fully specified or captured *exhaustively* using *only* the vocabulary of functional roles (causes, effects, behaviors) or physical states (neural processes, physics), requiring phenomenal concepts.  
      *Status:* Substantive and defensible. Supports the *cohort* (what science leaves out).  
      *Nature:* Claim about the *property* requiring a distinct conceptual framework beyond current science.

  4.  **Essential Indescribability:** The specific "what-it's-like-ness" of a quale cannot be picked out or referred to *at all* by any descriptive language (public or private), *even by the subject experiencing it*. There is no description, however complex, that uniquely identifies *that* specific phenomenal property.  
      *Status:* Self-undermining. Supports the *quiner* (if you can't even refer to it, you can't posit it).  
      *Nature:* Claim about the *property* being inherently beyond linguistic grasp.

  5.  **Metaphysical Ineffability:** The specific phenomenal character *itself* possesses a nature that is fundamentally incompatible with linguistic description or conceptual structure *in principle*, not just relative to human limits. Expressing it linguistically is metaphysically impossible.  
      *Status:* Self-undermining. Strongly supports the *quiner* (positing an indescribable property is incoherent).  
      *Nature:* Claim about the *intrinsic nature* of the property defying conceptualization.

  **Regarding the tension with "directly apprehensible":** If qualia are *directly* and *immediately* known to consciousness (apprehensible), it suggests a form of direct epistemic access. However, if they are *ineffable* (especially in senses 4 or 5), this access yields nothing that can be articulated *at all*, even privately. The tension is: how can something be fully and directly known/present to the mind, yet its specific nature remain utterly inexpressible *even to the mind that knows it*? Does "knowing" it entail *any* describable content? If direct apprehension provides *no* specifiable content, what does "apprehension" mean? The contradiction lies in asserting both complete epistemic immediacy/presence and complete descriptive absence for the same property.
