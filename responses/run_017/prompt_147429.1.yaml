answer: |-
  ## The Normative Architecture of Derogation

  To clarify the terrain, I define key terms: **says** refers to the truth-conditional content asserted by an utterance. **Expresses** denotes the conventional display of a speaker's psychological state (e.g., an attitude like contempt) encoded by the linguistic item itself. **Derogatory** identifies a property of a speech act: its contravention of a conventional prohibition within the relevant linguistic community against using that form to refer to the target group. **Offensive** identifies a property arising from an audience's warranted recognition and negative assessment of the speaker's flouting of that prohibition. Derogatoriness is thus act-relative and norm-dependent; offensiveness is reception-relative and recognition-dependent. This framework resolves the embedding puzzle and reconciles conflicting intuitions across our three cases, exposing how standard accounts conflate distinct phenomena.

  Consider the **Homophonous Transplant**. A heritage speaker uses a form `w`, intending its neutral L2 meaning within an L1 conversation, unaware of `w`'s status as a prohibited slur in L1. According to *content-based views* (e.g., that slurs contribute a derogatory predicate like `is despicable` to truth conditions), the utterance *says* something derogatory about the target group G. This is incorrect. The speaker asserts no such predicate; they intend only the neutral descriptive content of the L2 term. *Expressivist views* (e.g., that slurs conventionally express contempt) similarly err by claiming the speaker *expresses* a derogatory attitude. They do not; their psychological state is neutral. Yet, the utterance *is* derogatory in the L1 context because it violates L1's conventional prohibition against using `w` to refer to G. Crucially, it is *not offensive* to the L1 audience if they recognize the speaker's ignorance and lack of flouting intent – their negative reaction, while perhaps startled, isn't *warranted* as a response to norm violation. The derogatoriness stems from the act contravening L1's norm, even without derogatory content or attitude.

  Next, **Survival Without a Target**. A historical slur for "witches" persists in a secular community as an expletive or casual vocative, with no one believing witches exist. *Content-based views* face collapse: the slur cannot contribute a derogatory predicate applying to a non-existent or non-believed-in group within the truth conditions of "Damn witches!" when stubbing a toe – no predication occurs. *Expressivist views* struggle: what derogatory attitude (contempt for witches?) is expressed towards a non-existent class in the vocative "Hey witch!"? Yet, the utterance remains *derogatory*. The community retains a conventional prohibition against using *this specific form*, rooted in its oppressive history, even though its original descriptive application is defunct. Using it as an expletive still violates this residual prohibition concerning the *form itself*. It may be *offensive* if the audience recognizes the flouting of this prohibition (e.g., a historian aware of its weight), or merely jarring if not.

  Finally, **Audience-Free Inscription**. Typing a slur into a private diary or search box lacks any audience for uptake. *Prohibition views* that tie derogatoriness *solely* to causing offense (a common conflation) struggle here, as no offense occurs. *Any* view requiring an audience for derogatoriness fails. However, on our account, the act is straightforwardly *derogatory*: the speaker violates the conventional prohibition against using that form to refer to the target group within their linguistic community, regardless of audience. The diary entry or search query, as a linguistic act employing the prohibited form, constitutes the normative violation itself. It is *not offensive* because offensiveness requires an audience to recognize and negatively assess the flouting act – an impossibility here. The derogatoriness resides in the solitary act's non-conformity with the communal norm.

  The core standoff between content-based, expressivist, and simple prohibition views stems from their failure to disentangle *derogatoriness* (a normative property of the act) from *offensiveness* (a reactive property involving uptake), and both from semantic content/speaker attitude. Embedding data (negation, conditionals) primarily reveal how *offensiveness* persists or diminishes based on perceived flouting intent and recognition of the norm violation within complex constructions; they do not directly bear on the semantic content or conventional expression of the word itself, nor on the *derogatoriness* of the underlying act relative to the norm. The homophonous transplant shows content/attitude aren't necessary for derogatoriness. Survival without a target shows they aren't sufficient. Audience-free inscription shows offensiveness isn't necessary for derogatoriness.

  The strongest objection contends that a norm-violation account cannot distinguish slurs from ordinary profanity (e.g., "fuck"), as both are prohibited. If the account only identifies violation of *a* prohibition, it fails to capture the unique, group-targeted harm of slurs. A related worry concerns reclamation: if in-group use is non-derogatory because the prohibition is revised for them, why does out-group use remain offensive if the *prohibition itself* is weakened?

  This objection conflates the *nature* of the prohibition. The prohibition for slurs is *specifically* tied to using a particular form to refer to a specific social group, grounded in historical oppression. Profanity prohibitions concern general decorum or taboo, not group-targeted reference. The prohibition violated in derogatory acts is intrinsically group-directed. Regarding reclamation, the in-group doesn't abolish the prohibition universally; they selectively *suspend* or *redefine* its force *for themselves* as an act of empowerment, creating an asymmetric norm. The prohibition *against out-group members* using the form *persists*. When an out-group member uses the term, they violate this standing prohibition targeting *their* relation to the group and the term's history. The audience's warranted recognition that *this speaker*, lacking the in-group status, is flouting the still-operative prohibition *for them* generates offensiveness. The normative landscape is group-relative and speaker-sensitive.

  A residual worry persists: can this strictly conventional norm account fully explain the *intensity* and *moral gravity* of some slurs compared to others, or compared to reclaimed uses, without smuggling in semantic or attitudinal elements? The link between the prohibition's force and the underlying harm feels inadequately explored.

