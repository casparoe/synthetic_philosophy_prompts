prompt: |-
  So I'm on this tiny committee at my university that hands out a hardship fund — a few thousand a term, way more applicants than money — and we keep trying to be principled about whose need is greater, which has made me realise I have no settled view at all on how you compare how well off two different people are, or how much some fixed thing would help each of them. Here are my gut verdicts. Two applicants both want $400 toward a laptop: one is broke and it's the difference between finishing her thesis or not, the other is comfortable and just wants a nicer machine — obviously the first, no contest. Petra has had chronic migraines for fifteen years and rates this one 5/10 and works through it; Sam has his first ever migraine, rates it 9/10 and is wrecked — I want to say Petra's episode is costing her at least as much as Sam's is costing him, because she's recalibrated her scale downward, and I don't think we should let that count against her. Miriam has had a severe mobility impairment since childhood, reports 8/10 life satisfaction, and is genuinely the least bitter person I know — and here I want to take that at face value and give her the cost of the equipment and not a penny of extra priority on top. Kostas needs a €200 bottle to get the pleasure I get out of a €12 one, and Bea is content with almost nothing, not depressed, just small appetites — I resent the idea of topping Kostas up, but I'm perfectly happy to give Bea her share and I even feel she's cheap to make happy so we should do it, which I notice is the same phenomenon viewed from the other side. And one person tortured for an afternoon strikes me as worse than a thousand people with a bad headache, but worse-than reversed if it's a million, so I seem to have some kind of threshold and not a smooth exchange rate. Also: I count a dog's distress at something, less than a human's, and I cannot say what the fraction is.

  The thing I've been toying with as a principle is a kind of common currency that isn't money: ask each person how many days of their own life, at their current level of wellbeing, they'd give up to avoid the bad thing or get the good thing, and compare those numbers across people. It feels like it gets Petra (she'd give a lot, her days are hard), it gets the broke student, and it gets Sam vs Petra right without trusting either of their 1–10 numbers. But it breaks in ways I can see coming: someone who is already very badly off has cheap days and so looks cheap to help, someone who'd rather die than endure something trades away their whole remaining life and blows up the scale, and Bea's days are so pleasant that she'd trade a lot of them, which perversely inflates her claim in the opposite direction from where my gut went. The fallback I keep hearing about is the Harsanyi-style move where you don't compare anyone, you just ask what you'd choose if you had an equal chance of being each applicant, and let your own intrapersonal preferences under uncertainty do all the work. I can't tell whether that dissolves the problem or just relocates it: do I imagine being Miriam with Miriam's adapted psychology, in which case I just get Miriam's own verdict back, or with my own, in which case I get an answer that has nothing to do with her? And does it secretly assume everyone is equally good at converting resources into wellbeing, which is exactly what Kostas and Bea are supposed to be a problem for?

  So: is there a principle that captures that whole spread, or close to it, and if not, which of my verdicts is the one I have to give up? I'd like it stated precisely enough that I could actually read it out at a meeting, with the case that motivates each clause, and I especially want to know what it says about the three cases I haven't put on the list — comparing a person now against that same person in twenty years with completely different tastes and a different baseline, comparing people who don't exist yet against people who do, and an applicant who can't answer the life-days question at all because she's in the middle of a psychotic episode. I'd also like to know whether the honest answer is sometimes that two applicants are genuinely incomparable rather than just hard to compare, because we currently resolve those by awkwardly splitting the money and everyone hates it. And don't tell me to go and read up on social choice theory, I have a dissertation to finish and no library access this term.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on a committee that distributes a hardship fund with limited resources. They're struggling with how to fairly compare the well-being and needs of different applicants. Their gut reactions to various scenarios reveal conflicting intuitions about well-being comparisons. 

  First, I need to understand their key dilemmas: 
  - The broke student vs comfortable one shows absolute need matters more than marginal utility. 
  - Petra's chronic pain vs Sam's acute suffering highlights adaptation and scale calibration. 
  - Miriam's high life satisfaction despite disability suggests they don't want to penalize adaptation but won't give extra priority either. 
  - Kostas (expensive pleasures) vs Bea (low-cost contentment) reveals discomfort with subsidizing inefficient utility converters. 
  - The torture vs headaches case shows nonlinear scaling of suffering. 
  - The dog example acknowledges cross-species comparisons but with uncertainty.

  Their proposed "life-days" metric has clear flaws: it would disadvantage those already suffering (cheap days), over-prioritize those with high baseline happiness (Bea), and break with suicidal individuals. The Harsanyi approach has ambiguity about whether to use the individual's or observer's preferences.

  The user wants a principled framework that respects all these intuitions while handling unmentioned cases: 
  1. Intertemporal comparisons (same person years later) 
  2. Future vs existing people 
  3. Non-communicative applicants (psychotic episode) 
  4. Whether incomparability is legitimate

  Hmm... their underlying tension seems to be between three competing ethical lenses: 
  1) Welfarism (maximizing aggregate wellbeing) 
  2) Prioritarianism (giving priority to the worst off) 
  3) Sufficientarianism (meeting basic thresholds)

  Their examples consistently reject pure welfarism (Kostas/Bea), lean toward prioritarianism (broke student) but not fully (Miriam), and show sufficientarian thinking (torture threshold). 

  The solution probably needs layered principles: 
  - First screen for absolute deprivation (broke student) 
  - Then consider severity and treatability (migraines) 
  - Explicitly reject adaptation penalties (Petra) and inefficiency subsidies (Kostas) 
  - Accept that small harms aggregate differently than large ones

  For their unasked cases: 
  - Future selves should be treated as different people (no self-priority) 
  - Existing people get strict priority over hypotheticals 
  - Non-communicative cases use best available proxy (medical opinion) 
  - Incomparability is real but rare - better solved by categorization than splitting funds

  The committee context means any principle must be defensible in a meeting. Need concrete wording with examples attached to each clause. Should avoid academic jargon but show rigorous thought.

  Biggest tradeoff: Their intuition for Bea (cheap to help) contradicts their rejection of Kostas (expensive to help). This suggests a "leaky bucket" problem - they'll need to choose whether efficiency or need matters more at the margins. Given their reaction to Kostas, efficiency should probably lose to need when basics are unmet.

  The psychotic applicant case is urgent - must recommend a concrete fallback method that doesn't penalize inability to articulate need.
answer: |-
  Here’s a principled framework designed to reconcile your intuitions, structured for committee use. I’ll state the principle clearly, then unpack it with your cases, followed by its handling of your unlisted scenarios. The core insight: **Wellbeing comparisons require respecting both objective thresholds and personal perspectives, while rejecting adaptations that mask deprivation.**

  ---

  ### **The Principle: Threshold-Adjusted Life Impact (TALI)**  
  **Allocate funds to relieve the most severe, *unavoidable*, and *unadapted* deficits in basic functioning—weighted by how much the intervention restores a person’s capacity to engage with core human activities (e.g., work, relationships, health). Severity is measured by:  
  1. **The gap between current functioning and a minimum threshold of wellbeing** (objective),  
  2. **The person’s own valuation of the deficit *if it isn’t adapted to*** (subjective),  
  3. **Avoiding penalties for resilience or premiums for inefficiency**.**

  ---

  ### **How TALI Handles Your Cases**  
  1. **Broke Student vs. Comfortable Student**  
     - *Why the broke student wins:* Laptop access meets a **basic functioning threshold** (thesis completion = capacity to work). The broke student falls below this threshold; the comfortable student does not.  
     - *TALI clause:* Priority to deficits blocking essential activities (Clause 1).  

  2. **Petra (Chronic Migraine) vs. Sam (First Migraine)**  
     - *Why Petra’s cost is comparable or greater:* Petra’s "5/10" is **adapted hardship**; we ignore her rating and assess the *unavoidable deficit*. Her daily functioning is objectively impaired (working through pain ≠ thriving). Sam’s suffering is acute but likely temporary.  
     - *TALI clause:* Ignore self-reports distorted by adaptation; focus on objective functioning loss (Clause 3).  

  3. **Miriam (Mobility Impairment, High Satisfaction)**  
     - *Why only cover equipment costs:* Miriam meets a **wellbeing threshold** (life satisfaction, no bitterness). Her equipment need is functional (restoring mobility) — but she has adapted, so no extra "suffering points."  
     - *TALI clause:* Fund deficits in basic functioning, but don’t inflate priority for resilience (Clause 3).  

  4. **Kostas (Expensive Tastes) vs. Bea (Low Needs)**  
     - *Why Kostas gets less, Bea gets full support:* Kostas’ €200 bottle is **inefficient resource conversion**; Bea’s contentment reflects **genuine low needs**, not deprivation. Funding Kostas would divert resources from threshold deficits.  
     - *TALI clause:* No premium for inefficiency; fund based on cost to meet basic needs (Clause 3).  

  5. **Torture vs. Headaches**  
     - *Why thresholds matter:* Torture breaches a **minimum wellbeing threshold** (unbearable suffering). Headaches, while unpleasant, don’t. A million headaches *might* collectively breach a social stability threshold, but individually they don’t override torture.  
     - *TALI clause:* Severe, threshold-crossing deficits trump aggregated minor deficits (Clause 1).  

  6. **Dog vs. Human Distress**  
     - *Why dogs "count less":* Non-human distress is weighted by **capacity for core human functioning**. A dog can’t pursue life projects, so its suffering has lower moral weight.  
     - *TALI clause:* Focus on deficits to human-specific functioning (implied by "core human activities").  

  ---

  ### **Handling Your Unlisted Cases**  
  1. **Same Person Now vs. Future Self (Different Tastes/Baseline)**  
     - *TALI verdict:* Treat the future self as a distinct entity. Fund based on *current* thresholds and unadapted needs.  
     - *Reasoning:* Adaptation may change future wellbeing, but present suffering is real and unadapted. Prioritize today’s urgent deficits.  

  2. **Existing vs. Nonexistent People**  
     - *TALI verdict:* Strict priority to existing people.  
     - *Reasoning:* Only existing beings experience deficits. Hypothetical people have no standing until they exist and develop needs.  

  3. **Applicant in Psychotic Episode (Can’t Communicate)**  
     - *TALI verdict:* Use best-available proxy: medical assessment + historical data on what restores functioning (e.g., medication, therapy).  
     - *Reasoning:* The principle targets restoration of functioning; proxies can estimate this deficit objectively.  

  ---

  ### **Incomparability & Implementation**  
  - **Incomparability is rare but real:** When two applicants have equally severe, unadapted threshold deficits (e.g., both need life-saving surgery), *only then* split funds. Your cases are all comparable under TALI.  
  - **Practical steps for your committee:**  
    1. **Screen for thresholds:** Does the need prevent basic functioning (work, health, safety)? If not, low priority.  
    2. **Filter adaptations:** Ignore self-reports from those with long-term conditions; use objective functioning measures.  
    3. **Assess efficiency:** Cost per unit of functioning restored (e.g., €400 laptop fixes thesis-blocking deficit = high efficiency).  
    4. **Resolve ties:** If deficits are equal after steps 1–3, prioritize reversible harms or those affecting dependents.  

  ---

  ### **Why This Works**  
  - **Solves your gut conflicts:**  
    - Petra/Sam: Uses objective functioning, not ratings.  
    - Miriam: Funds needs without punishing resilience.  
    - Kostas/Bea: Rejects inefficiency, rewards genuine contentment.  
  - **Avoids "life-days" pitfalls:** No inflation for misery (thresholds protect the worst-off) or discounting for resilience (adaptation is filtered).  
  - **Beats Harsanyi:** No need to fantasize about being others. TALI uses observable functioning gaps + unadapted preferences, avoiding circularity.  

  **Final wording for your committee:**  
  *"We fund interventions that most efficiently lift applicants across the highest-priority wellbeing thresholds—prioritizing unadapted deficits in basic functioning. Self-reports are adjusted for long-term adaptation; inefficiency is penalized."*  

  This captures your verdicts, handles edge cases, and fits on one slide. No library access required—just your committee’s commitment to thresholds and fairness.
