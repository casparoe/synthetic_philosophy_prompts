prompt: |-
  so i've got dragged onto a small team — two of us, about five months — writing an internal spec (30-40 pages) for what a pre-crash planner on an autonomous shuttle is allowed to do in situations where every available maneuver kills somebody. everyone keeps appealing to the doctrine of double effect like it's going to do real work in the document, and im suspicious that it won't, at least not without a lot of prior settling. so i want an agenda, not a survey: which open questions about DDE actually matter for this project, and in what order should we chew through them?

  the thing that made me want to ask is a distinction i half-invented and can't find anywhere: harms the agent routes around vs harms the agent routes through. rough heuristic: if the bad effect has to happen before the good one, you're routing through it, it's doing causal work, and DDE shouldn't let you file it as a mere side effect no matter what you say you were aiming at. i think this handles the loop setup (track curves back on itself, so the guy standing on the spur is literally what stops the trolley before it reaches the five — take him away and the trolley completes the loop and kills them) which everyone agrees is using him but which the standard intended/foreseen line doesn't obviously explain. but it also seems to overreach: a shuttle swerving into a runaway lane clips a cyclist on the way in, the collision sheds the speed that makes the stop survivable — that's routing through on my test, and im not sure i want to say it's murder.

  so: give me a defended ordering. what counts as worth our five months here, and which criteria are you trading off — how many other questions hang off this one, whether two generalists can actually make progress on it in the time, whether it's neglected or already settled in practice, whether our answer would change even one line of the spec. who cares about the list itself, i care about why it's ordered that way. tell me too what we'd have to find out in month two that would make you reshuffle the rest. and where you think the whole DDE apparatus is just the wrong tool for a system that has no intentions in the relevant sense, say so rather than bending the questions to fit it.

  also: say how confident you are in what you're claiming, and single out the one point you're least sure of.
reasoning: |-
  Okay, the user is part of a small team drafting a spec for an autonomous shuttle's pre-crash planner. They're dealing with scenarios where every possible action results in harm, and their team keeps invoking the Doctrine of Double Effect (DDE). The user is skeptical about DDE's applicability without thorough groundwork. They want a prioritized list of open questions regarding DDE that are crucial for their project, along with a rationale for the order and factors like dependencies, feasibility, impact, and neglectedness.

  First, I need to understand the core issue. The shuttle's AI must make decisions in no-win situations. DDE is traditionally a moral framework for humans, assessing intentionality versus foreseen consequences. Applying this to an AI, which lacks true intentions, is problematic. The user mentioned a distinction: "routing around" vs. "routing through" harms. Their example with the cyclist shows that routing through might be necessary but could be seen as intentional harm under DDE.

  The user’s main concerns are:
  - DDE’s applicability to non-intentional systems.
  - Their novel distinction and its implications.
  - Prioritizing which DDE aspects to tackle in 5 months with limited resources.

  Breaking down the key elements: The team has two people and five months for a 30-40 page spec. They need actionable guidance, not theoretical exploration. The user wants to avoid getting bogged down in unresolved philosophical debates and focus on what will materially affect the spec.

  The user’s invented distinction between routing around and through harms is crucial. Routing through involves harm that’s causally necessary for the good outcome, which might invalidate DDE’s side-effect clause. This needs to be addressed early because it challenges DDE’s foundations in this context. However, overreaching, as in the cyclist example, could lead to impractical conclusions. So, assessing and refining this distinction is a priority.

  Next, the ordering of questions should consider dependencies. Question 1 (intentionality in AI) is foundational. Without resolving whether DDE can even apply to AI, other questions are moot. This has high impact because if the answer is that DDE isn’t suitable, the team might need an alternative framework, saving time.

  Question 2 (causal necessity) builds on the user’s distinction. If harms that are causally necessary are always intentional, then scenarios like the loop case are clear, but the cyclist example becomes problematic. This needs to be defined to prevent misuse of DDE in the spec. Since the user’s heuristic is central, this should come early.

  Question 3 (proportionality) is practical. Even if an action passes other DDE criteria, the harm mustn't outweigh the good. For the shuttle, quantifying harm (e.g., severity, probability) is essential. This might involve empirical data, which takes time, so it should follow the foundational issues.

  Question 4 (alternatives) is about necessity. If there’s a less harmful option, it must be taken. This ties into system constraints and what’s computationally feasible. Since it’s more operational, it can come later after establishing the ethical framework.

  Question 5 (system vs. agent) addresses blame allocation. The spec needs to define if the planner is excused if harm results from unavoidable system constraints. This impacts liability sections in the document and is crucial for legal and ethical accountability.

  The later questions (6-8) deal with practical implementation, documentation, and edge cases. These are important but rely on resolving the earlier theoretical issues. For instance, without defining causal necessity, documentation requirements can’t be set.

  Confidence levels: High on the irrelevance of intention (Q1) because AI lacks mens rea. Low on resolving causal necessity (Q2) due to the cyclist counterexample. This uncertainty means the team might need to iterate or seek external input.

  Triggers for reshuffling: If Q1 finds DDE inapplicable, the rest become irrelevant. If causal necessity can’t be resolved, the team might need to adopt a different approach. Also, legal input might shift priorities if liability concerns arise.

  Overall, the priority is to first determine if DDE is the right tool. If not, pivot early. Then tackle the user’s heuristic, refine it, and build the spec around actionable criteria like proportionality and alternatives. This approach ensures that the team’s limited time is spent on high-impact issues that directly affect the spec’s content.
answer: |-
  Here's a defended prioritization of DDE-related questions for your spec, designed for maximum leverage within your constraints. The ordering balances **systematization potential**, **spec impact**, **dependency chains**, and **pragmatic tractability**. I'm highly confident (8/10) in the overall structure but flag key uncertainties.

  ---

  ### **Core Prioritization Rationale**
  1.  **"Is DDE even applicable?" is the gatekeeper.** Wasting cycles debating nuances if the foundation is rotten is catastrophic for a 5-month project.
  2.  **Your "routing through" distinction is the central novelty/risk.** It directly challenges DDE's core mechanism and drives spec content. It *must* be resolved early.
  3.  **Proportionality is where policy gets made.** It's the lever for defining "acceptable" harm thresholds – the spec's meat.
  4.  **Operational necessity precedes blame assignment.** Defining what the planner *must do/can't avoid* comes before excusing it.
  5.  **Documentation/Edge Cases follow core rules.** They implement the policy, don't define it.

  ---

  ### **The Agenda: 8 Questions in Priority Order**

  1.  **Does the concept of "intention" apply meaningfully to the planner's state?**
      *   *Why First?* Foundationally critical. If the planner lacks "intending the good effect" or "merely foreseeing the bad" in a morally relevant sense, DDE collapses as a justificatory framework *for the system itself*. This dictates whether you use DDE *descriptively* (mapping human ethics) or *prescriptively* (as a design rule).
      *   *Impact on Spec:* Decides if DDE is a core justification section or merely an analogy/legacy concept. Changes framing throughout.
      *   *Tractability:* High (2 people, 2 weeks). Analyze planner's decision logic (cost functions, constraints, optimization targets). Consult philosophy of AI/ethics papers on artificial agency. *Likely Conclusion:* DDE's *intentionality* criteria are anthropomorphic metaphors at best. The planner has operational goals, not moral intentions. (Confidence: 9/10).
      *   *Neglected?* Often hand-waved in applied ethics for AI. Crucial for *your* legitimacy.

  2.  **What constitutes "causal necessity" (your "routing through") that voids the "side effect" claim?**
      *   *Why Now?* Your insight is the project's crux. Resolving this defines the *scope* of actions DDE can "excuse" in your system. It directly tackles the loop case and your cyclist counterexample.
      *   *Impact on Spec:* Defines forbidden maneuvers (murder-by-DDE-loophole). Shapes core safety constraints and maneuver classification.
      *   *Tractability:* Moderate-Hard (3-4 weeks). Needs deep causal analysis of scenarios. Your heuristic is a strong start. Refine: Define "causal work" rigorously (e.g., counterfactual dependence: Would the good effect fail *with high probability* if the harm didn't occur?). The cyclist case *might* be salvageable if harm isn't *strictly necessary* for the good (e.g., speed shed *could* happen otherwise, even if it *did* happen this way). **This is my least confident point (Confidence: 5/10).** Distinguishing "necessary catalyst" (loop case) from "incidental contributor" (cyclist) or "enabling condition" is messy.
      *   *Neglected?* Yes. Standard DDE debates often gloss over intricate causal mechanics in dynamic systems.
      *   *Trigger for Reshuffle:* If you *cannot* find a stable, implementable definition for "routing through" that handles edge cases without absurdity, DDE becomes far less useful. Pivot towards pure proportionality/minimization.

  3.  **How is proportionality defined and quantified?**
      *   *Why Here?* Presuming DDE survives Q1&2 as a *structuring principle*, proportionality is where you set *policy*: How much harm is "disproportionate" even if intended/foreseen correctly? This is the core output of your spec.
      *   *Impact on Spec:* Defines numerical thresholds (e.g., harm ratios), acceptable risk trade-offs, and the "good effect" calculus (saving N lives vs. preventing M serious injuries). Directly writes spec rules.
      *   *Tractability:* Moderate (3 weeks). Requires input: Legal (liability thresholds?), Safety Eng (injury severity metrics?), Corp Ethics (company values?). More empirical/policy than purely philosophical.
      *   *Neglected?* Often debated abstractly, but your spec *must* concretize it. High leverage.

  4.  **What constitutes a "viable alternative" (non-harmful or less harmful)?**
      *   *Why Now?* The "no alternative" condition is often DDE's weakest link. Defining the planner's *obligation to search* and the *scope* of alternatives considered (time horizon, computational limits, sensor uncertainty) is critical for operationalization.
      *   *Impact on Spec:* Defines planner requirements (look-ahead time, contingency planning depth, fallback strategies). Sets the "necessity" bar.
      *   *Tractability:* Moderate (2-3 weeks). Blend ethics (what *should* be considered?) with systems engineering (what *can* be considered in real-time?).
      *   *Neglected?* In philosophical DDE, yes. In safety-critical systems, it's paramount.

  5.  **Is the harm attributable to the planner's action or the prior dangerous situation/system constraints?**
      *   *Why Here?* Addresses the "no good options" reality. Shifts focus from justifying *this* harm to assessing if the planner/system is *culpable* for being in this situation. Connects to liability.
      *   *Impact on Spec:* Shapes disclaimers, liability sections, and high-level system safety requirements (e.g., "The planner is not responsible for harms resulting from unavoidable system limitations X, Y, Z").
      *   *Tractability:* Moderate (2 weeks). Legal review crucial here. Philosophical grounding in "moral luck" and causation.
      *   *Neglected?* Often overlooked in applied DDE for tech.

  6.  **How must DDE reasoning be documented/logged by the planner?**
      *   *Why Now?* Post-core-policy. Essential for auditability, liability defense, and public trust. What constitutes sufficient "proof" the rules (Q1-5) were followed?
      *   *Impact on Spec:* Defines logging requirements (data captured, reasoning traces).
      *   *Tractability:* Straightforward (1 week) once Q1-5 are settled. Technical implementation focus.

  7.  **How are aggregated/minor harms handled? (e.g., swerving causes 10 minor injuries vs. collision causing 1 major).**
      *   *Why Here?* An edge case of proportionality (Q3) and "harm" definition. Lower priority than core life/death trade-offs.
      *   *Impact on Spec:* Refines harm metrics and proportionality calculations.
      *   *Tractability:* Moderate (1-2 weeks). Requires severity scales.

  8.  **How does uncertainty in prediction affect DDE application?**
      *   *Why Last?* Important, but often handled by system safety margins and probabilistic thresholds baked into proportionality (Q3) and alternatives (Q4). Presumes core framework exists.
      *   *Impact on Spec:* Refines risk assessment models and "foreseen" criteria (probability thresholds).
      *   *Tractability:* Complex (2 weeks), but can leverage standard probabilistic risk assessment.

  ---

  ### **Where DDE Might Be the Wrong Tool & Recommendations**
  *   **The Intentionality Problem (Q1):** If the planner truly lacks intentions (as likely), **using DDE as a *justification* for the *system's actions* is fundamentally flawed.** It's applying a human moral lens to an optimization process.
  *   **Recommendation:**
      1.  **Use DDE Structurally, Not Morally:** Frame the spec using DDE's *components* (Intended Outcome, Foreseen Harms, Proportionality, Necessity) as **descriptive categories for analysis and documentation**, *not* as proof of moral permissibility. E.g., "For maneuver type X, classified as intending harm under causal criterion Y, apply constraint Z."
      2.  **Ground Justification Elsewhere:** Base the *permissibility* of actions on **minimization of overall harm** (consequentialism), **adherence to predefined safety rules/rules of the road** (deontology), **avoidance of direct causation of harm** (a modified DDE-inspired *causal* rule, like your "routing through" ban), and **proportionality as policy**. DDE becomes a taxonomy, not the foundation.
      3.  **Be Explicit:** State clearly in the spec: "While inspired by ethical frameworks like DDE, the planner operates based on predefined operational rules and optimization goals. DDE categories are used for classification and audit purposes."

  ---

  ### **Key Reshuffle Triggers (Discoverable in Month 2)**
  1.  **Q1 Outcome (Intentionality):** If consensus is "DDE intentionality is inapplicable," **immediately pivot** Q2-Q5 to focus on minimization, causal constraints (your "routing through" ban), and policy-based proportionality *without* DDE baggage. Q6 (Logging) remains vital. Q7-8 become refinements.
  2.  **Q2 Insolubility (Causal Necessity):** If you *cannot* define "routing through" robustly (e.g., cyclist case breaks all definitions), **demote Q2** and make **Proportionality (Q3) the absolute king**. Focus entirely on harm minimization within system constraints. Your heuristic might become a "soft" warning flag, not a hard rule.
  3.  **Legal Landmines:** If legal review (triggered early in Q3/Q5) reveals DDE language creates liability risks or conflicts with regulatory frameworks, **strip out DDE terminology** entirely and recast using system safety/risk management language. Focus Q6 (Logging) on compliance evidence.

  ---

  ### **Confidence & Least Sure Point**
  *   **Overall Structure Confidence:** 8/10. Based on project goals, team size, timeline, and the critical path from foundation to policy.
  *   **Least Confident Point:** **Q2 (Causal Necessity / "Routing Through")**. The philosophical and practical difficulty of cleanly distinguishing necessary causal contribution from incidental/enabling causation in complex, dynamic physical interactions (like your cyclist example) is immense. I'm confident it's *the* critical question, but only 5/10 confident a fully satisfactory, universally applicable, and implementable definition can be found within your constraints. Be prepared for pragmatic compromises or fallback to strict minimization/proportionality.

  **Execute ruthlessly:** Month 1 = Q1 & Q2 deep dive. By end of Month 2, you *must* have answers to Q1 & Q2 and a draft stance on Q3 to avoid drifting. Good luck – you're tackling the hard edge.
