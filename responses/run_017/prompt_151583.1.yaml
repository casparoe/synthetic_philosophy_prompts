prompt: |-
  I do interview-based work on worker co-ops and a couple of religious mutual-aid funds, and I keep hitting the same thing in my own material and I dont have a word for it. Maybe somebody does.

  The thing: I offer a causal explanation of why a group behaves the way it does, in terms of the values or the beliefs the members actually hold — and let's stipulate the explanation is correct, and that the members would more or less endorse it if you asked them straight out. But it looks to me like a lot of these explanations are true only for as long as the people inside them havent heard the explanation. The value does its causal work behind their backs. Once they've read it and gone "oh, right, that's why we do that," the thing I was explaining either falls apart or turns into something else.

  Two bits of fieldwork. In one co-op people covered the grim Friday-night shift on a completely informal rota, and my account was that a norm — that it would be slightly shameful to ask for extra money for it — was doing the scheduling. Then someone circulated a write-up of mine and over a few months the rota broke down. Nobody started asking for money. It broke down because after reading it, each turn felt like a conscious act of norm-following, which made it feel optional, and the minute it felt optional people started negotiating. Second case, a church mutual-aid fund: the opposite happened. After the members read an account of why their practice holds up — something about reputational pressure in a face-to-face community — the practice got more rigid and much more loudly performed, because now it was an identity badge people had to avow out loud. Same shape of explanation, opposite outcomes, and in both cases the thing I said was causing the behavior stopped being what was causing it.

  And I cant patch it by adding "provided they are unaware of this explanation" as a background condition, because publishing it is precisely what removes the unawareness. Its not like a ceteris paribus clause that fails in the wild sometimes; it fails because the explanation succeeded.

  What makes this annoying is that some explanations get *stronger* when the actors learn them: tell people they all stop at red lights because each expects the others to, and either nothing changes or the coordination gets better. So there's a real difference between the ones that survive their own publication and the ones that don't, and I have no idea what marks it.

  Things people have suggested that don't quite fit, in case it saves you time: (a) a self-defeating, or "suicidal," prophecy — as I understand it that's a prediction about a future event, whereas mine is an account of a pattern that already exists, and a failed prediction is simply false while mine was true; (b) the fact that people act differently when they're being studied — in both cases above they read the write-up long after I'd left the field, nobody was watching; (c) the crowding-out thing where you start paying people for something they used to do for free and the motivation dies — no payoff or incentive changed in either case, only what people knew; (d) the ideology-critique move where the actors were wrong about their own motives — my explanation is one they'd happily agree with. And (e) "reflexivity," which just names the whole mess and tells me nothing.

  So: is there an established concept for this exact thing — a causal explanation in terms of values whose truth is destroyed by its own uptake — and if there is, where are its edges? I especially want the contrast with the publication-stable cases, and I want to know whether this is supposed to be a problem for the *explanation* or for the *evidence* (can you ever really test one of these claims, if testing wrecks the setup?). If there is definately no term for it, coin one and define it tightly enough that I can drop it into a methods footnote and know what doesn't count. Please don't send me off to a reading list — I'd rather have the carving than the references.

  Context if it helps: this came out of me trying to work out what I think about the old Weber argument about Protestants and capitalism, where the causal story seems to depend on people not understanding themselves in those terms. But I'm after the general thing, not a Weber discussion.
reasoning: |-
  Okay, let me start by really understanding the user's problem. They work with worker co-ops and religious mutual-aid funds, doing interviews. They've noticed a pattern where their causal explanations about group behavior, based on the group's values, fall apart once the group reads the explanation. The user gave two examples: one where an informal rota broke down because the norm became conscious and optional, and another where a mutual-aid practice became rigid and performative after the explanation was shared. The key point is that the explanation being correct and endorsed by the members doesn't matter—once it's known, the behavior changes.

  The user has already considered several concepts that don't fit: self-defeating prophecies (which are predictions, not explanations), observer effect (no one was observing), crowding-out effect (no monetary change), ideology critique (members agree with the explanation), and reflexivity (too vague). They need a term that specifically describes a valid causal explanation that becomes invalid once known, and they want to differentiate it from cases where the explanation strengthens the behavior (like traffic lights).

  First, I need to recall if there's an existing concept. Reflexivity comes to mind, but the user finds it too broad. Maybe something from sociology or philosophy of science. Then I remember "performative" from Austin, but that's about language creating reality, not explaining it. Searle's constitutive rules might be closer, where rules create the behavior they govern. If people become aware, it shifts from constitutive to regulative, changing how they act. That fits both cases: the rota became optional (lost constitutive force), and the mutual-aid turned performative (overly regulative).

  The term "constitutive collapse" could work. It captures the idea that the norm's constitutive role collapses when made explicit. For the traffic light example, it's regulative, so awareness doesn't break it. The difference lies in whether the norm is what constitutes the behavior (like the unspoken shame) versus regulates it (like traffic rules).

  The user also wants to know if this affects the explanation or the evidence. Here, the explanation was valid until published, so it's not false initially. Testing it by publication alters the context, making it untestable conventionally. This impacts methodology, suggesting that such explanations can't be verified without changing the behavior.

  They mentioned Weber's Protestant ethic, where the causal link might rely on unawareness. This concept would explain why such historical analyses can't be tested in the present without distortion. 

  I should also consider if any other terms fit. "Reification" but that's about abstraction becoming concrete, not awareness causing change. "Feedback loop" is too broad. "Constitutive collapse" seems precise. Define it clearly: an explanation that makes a constitutive norm explicit, leading to its failure or transformation. Exclude cases where norms are designed to be known (like laws). 

  Make sure the term distinguishes from reflexivity by focusing on the constitutive nature. Also, address the evidence problem: the explanation is empirically fragile, so traditional verification isn't possible. Suggest methodological workarounds, like anonymized findings or studying resilient norms.
answer: |-
  Based on your precise description and the need for a concept that captures an explanation's causal efficacy *depending* on its being unknown to the actors, while also distinguishing it from near misses, I propose the term **Constitutive Collapse**.

  Here's the tight definition and its boundaries:

  ### Constitutive Collapse

  *   **Definition:** The phenomenon where a valid causal explanation of a social pattern (specifically one grounded in shared values, norms, or beliefs that actors would endorse) ceases to be causally operative *because* the explanation itself becomes known to and accepted by the actors it describes. The explanation's publication fundamentally alters the actors' relationship to the norm/value described, transforming its function from a constitutive, taken-for-granted background element into an explicit, objectified rule or self-conscious performance, thereby destroying or radically changing the original behavior pattern it explained.
  *   **Core Mechanism:** The explanation shifts the norm/value from being **constitutive** (defining the "rules of the game" unconsciously followed) to being **regulative** (a conscious rule to be considered, followed, or performed). This shift inherently changes the motivational structure and social dynamics.

  ### Key Boundaries & Why It Fits

  1.  **Contrast with Publication-Stable Explanations (e.g., Traffic Lights):**
      *   **Regulative Rules:** Traffic laws are *designed* to be known and consciously followed. Their power relies on conscious awareness, expectation, and sanction. Publication *reinforces* the regulative rule.
      *   **Constitutive Rules:** Your co-op norm ("shame in asking for money") and the mutual-aid pressure *were* constitutive. They defined the very meaning of "being a member" or "doing the shift" *without* needing conscious articulation. Publication *objectified* them, making them subjects of conscious deliberation or performance, thus collapsing their constitutive power. **Edge:** The difference lies in whether the norm/value functions *as a background condition enabling the practice* (constitutive, vulnerable to collapse) or *as a conscious directive governing the practice* (regulative, stable to publication).

  2.  **Distinction from Rejected Suggestions:**
      *   **Not Self-Defeating Prophecy:** Predicts future events; yours explains existing patterns. The prophecy failing makes it false; your explanation was *true* when made but *causally inertiated* by publication.
      *   **Not Observer Effect/Hawthorne Effect:** You weren't observing; publication alone caused the change. The effect stems from *knowledge of the explanation*, not observation.
      *   **Not Motivational Crowding-Out:** No extrinsic incentive (like pay) was introduced. The change came purely from the *knowledge* altering the *intrinsic* meaning and experience of the norm/value.
      *   **Not Ideology Critique:** Actors *agreed* with your explanation. The issue isn't false consciousness but the *consequences of making the implicit explicit*.
      *   **Beyond Reflexivity:** Reflexivity is the broad category. Constitutive Collapse is a *specific mechanism within reflexivity* where the explanation destroys its own causal object by transforming its constitutive nature.

  3.  **Problem for Explanation or Evidence?**
      *   **Primarily a Problem for Empirical Verification:** It renders the explanation **empirically fragile**. You *can* have a valid explanation *at time T1* (pre-publication). However, *testing* it by the obvious method – sharing it with the subjects and observing if behavior persists – actively destroys the context that made the explanation true. It doesn't mean the original explanation *wasn't* true; it means publishing it as part of verification *changes the world* in a way that invalidates the original causal link.
      *   **Not Necessarily a Flaw in the Explanation Itself:** The explanation was correct *under the initial conditions* (including ignorance of the explanation). Its fragility is a property of the *type of social reality* it describes (constitutive norms), not a logical flaw. However, it *does* highlight a limitation on how such explanations can be validated post-hoc.

  ### Applying "Constitutive Collapse" to Your Cases

  1.  **Co-op Rota:** Your explanation revealed the constitutive norm ("shame prevents asking for payment"). Once known, the norm shifted from being the unspoken background condition enabling the rota to being a conscious rule ("I *should* volunteer to avoid shame"). This made participation feel like a deliberate, optional choice ("Do I *want* to follow this rule *now*?"), leading to negotiation and breakdown. The constitutive power collapsed.
  2.  **Mutual-Aid Fund:** Your explanation revealed the constitutive norm ("reputational pressure sustains giving"). Once known, the norm shifted from being the unspoken background condition enabling the practice to being a conscious rule/identity marker ("We *are* the people who give because of reputational pressure"). This led to rigid, performative avowal to explicitly demonstrate adherence to the now-objectified norm. The original constitutive pressure collapsed, replaced by performative adherence.

  ### Why This Carving Works

  *   **Fits Your Core Insight:** It directly names the mechanism – the *constitutive* nature of the norm/value is *collapsed* by making it explicit through explanation.
  *   **Defines Scope:** Applies *only* to:
      *   Valid causal explanations grounded in values/norms/beliefs actors endorse.
      *   Where the norm/value was functioning constitutively (taken-for-granted, defining the practice).
      *   Where publication leads to a fundamental shift in the norm's function (to conscious rule or performance), altering or destroying the original pattern.
  *   **Provides Contrast:** Explicitly distinguishes from explanations involving regulative rules (like traffic lights) which are *designed* for conscious awareness.
  *   **Addresses the Methodological Headache:** Acknowledges that such explanations are empirically fragile – testing them via actor awareness inherently changes the conditions. Validation must rely on pre-publication evidence or indirect methods.
  *   **Handles Weber:** The Protestant Ethic explanation arguably relies on constitutive norms (the "spirit" of capitalism driven by unconscious asceticism). Widespread awareness and rationalization of capitalism *might* represent a form of constitutive collapse, where the original ascetic driver dissolves once capitalism becomes its own explicable system. Your concept provides a framework to analyze this.

  **For your footnote:** "This analysis risks triggering what I term *Constitutive Collapse* (see Note X), wherein the explanation, by making implicit constitutive norms explicit to actors, fundamentally alters those norms' function and thus the behavior they originally explained, rendering direct empirical verification through publication inherently problematic."

  This gives you a precise, defined term focused on the mechanism you identified, allowing you to efficiently flag this specific reflexive pitfall in your work.
