prompt: |-
  I'm a backend engineer, no philosophy background beyond stuff I read on the internet, and I keep losing an argument because I don't have a word for what's going on in it.

  My colleague Dave is a pretty serious Christian, my dad is too, and it isn't that either of them denies evidence or claims to have some private proof. It's the shape of the thing. If I ask what would change their minds, both more or less say nothing would, and they aren't embarrassed about it — but they also don't treat it like a taste or a preference. They say it's true the same way it's true that the server is down, not true-for-them.

  Two examples. Dave says he'd never try to argue a stranger into it: it isn't the sort of thing you reach by argument, you have to be inside the practice first — prayer, church, the calendar — and only then does it make sense. Ten minutes later he's telling me the resurrection either happened or it didn't, and if it didn't the whole thing is garbage. My dad says God is someone he trusts, like I trust my wife; when I point out that trust can be misplaced and I could be wrong about her, he says no, it isn't that kind of thing. Then he prays for a parking space and is genuinely delighted when one opens up, which sure looks like treating it as a prediction.

  The metaphor I keep coming back to is a protocol mismatch: both sides emit well-formed sentences using the same words — knows, exists, true — but nothing is actually transmitted, because what's really in dispute is each side's rules about what counts as successful transmission, not any message sent under the rules. Which is fine as far as it goes, except that the mismatch shows up inside a single person. Dave slides between the two registers constantly, sometimes mid-sentence, and he doesn't seem confused or evasive; it works fine for him. So it isn't two systems failing to handshake.

  Is there a name for this? I gather there's a Wittgenstein thing about religious belief not being a hypothesis and about groundless believing, and someone at a meetup said it's all language-games and forms of life and that religious language just isn't in the business of stating facts. But Dave plainly is stating facts some of the time. Is the Wittgensteinian picture committed to saying he can't be, or only that he doesn't have to be? A different friend suggested it's like beliefs you're allowed to hold without argument, the way perception or memory are just given — is that the same claim as the Wittgensteinian one or a rival to it? And is there anything on the register-switching itself, the way one speaker runs both modes at once, and on what happens to a claim when it gets moved from one mode to the other?

  Please don't give me a reading list, I can't chase references anyway. What I want is to know whether my 'protocol mismatch' framing is cutting at the right joint, what the nearest established concepts are and how mine differs from each, and where the edges of the thing I'm describing are — i.e. what would be a case that looks like this but isn't.
reasoning: |-
  Okay, let's dive into this problem. The user is a backend engineer with no formal philosophy background, struggling to articulate a concept he's observing in debates with religious colleagues and family. He's noticed a "protocol mismatch" where words like "true" and "know" seem to function differently across contexts, but what's fascinating is how the same person (like Dave) switches between these modes seamlessly.

  First, I need to unpack his core observations: 
  - Dave acknowledges no evidence could change his belief, yet insists Christianity is factually true like "the server is down"
  - Dave says faith isn't reached by argument but requires participation ("inside the practice"), yet later makes factual claims about resurrection
  - His dad treats God as an unquestionable trust object (unlike fallible human trust) but then acts prayer like a predictive tool

  The user's "protocol mismatch" analogy feels spot-on - it's not about the content of beliefs but the underlying rules governing how those beliefs function. What philosophical concepts map to this?

  Wittgenstein immediately comes to mind, specifically his later work on language-games and forms of life. The key insight there is that meaning depends on contextual use, not abstract definitions. Religious language isn't "failed science" - it's playing a different game with different rules. But Dave's factual claims complicate this - is he violating Wittgenstein's framework?

  Then there's the grounding vs foundation distinction: 
  - Grounded beliefs (science) require evidence chains
  - Grounded beliefs (like trusting your wife) rest on non-rational foundations that feel self-evident within a form of life

  Ah! This explains the parking lot prayer - it's not testing a hypothesis but reinforcing a relationship framework. The "delight" is about pattern recognition within the trust system, not empirical validation.

  For the register-switching... that's where Charles Taylor's "social imaginary" helps. Dave isn't confused - he's fluidly moving between:
  1. Theoretic mode (historical claims)
  2. Participatory mode (faith practice)
  3. Moral/relational mode (God-as-person)

  The magic is that these cohere through an overarching framework where "truth" means fidelity to the entire way of life, not just correspondence facts.

  Edge cases to distinguish:
  - Fanaticism (denies all counter-evidence) vs this (acknowledges evidence but prioritizes framework)
  - Postmodern relativism (all truths subjective) vs this (objective but multidimensional truth)
  - Hypocrisy (conscious inconsistency) vs this (experienced as coherence)

  User's framing is sharp - he's noticing that "successful transmission" requires shared rules first. Where he might push further: this isn't a bug but a feature of how meaning works in embodied practices. The switching isn't category error but category fluidity within a lived world.

  Should avoid academic jargon. Compare to engineering concepts he knows: 
  - Like different network layers (TCP handshake vs HTTP messages) 
  - Or unit tests vs integration tests - both validate "correctness" at different levels

  Most importantly - his intuition that the conflict is meta-communicative is precisely right. That's why arguments go nowhere: they're operating on the message layer while the real disconnect is at the protocol layer.
answer: |-
  Your "protocol mismatch" framing is **exactly on point**—it's a sharp, practical way to conceptualize what philosophers call **logical disjuncture between language-games or frameworks of meaning**. Here's how established ideas map to your observation, where they differ, and the edges of this phenomenon:

  ### Core Concepts & Your Framing
  1. **Wittgenstein's "Language-Games" & "Forms of Life"**  
     - **What it means**: Religious statements (e.g., "God exists") aren't empirical hypotheses but moves in a "game" defined by practices (prayer, liturgy, community). Truth here is about *internal coherence* and *practical efficacy*, not falsifiable evidence.  
     - **Where Dave fits**: When he says faith requires being "inside the practice," he’s describing this perfectly. **But** when he insists the resurrection is a brute historical fact ("it either happened or didn’t"), he’s switching games—using the rules of *empirical history*.  
     - **Key point**: Wittgenstein *allows* for factual claims *within* a religious framework (e.g., "Christ rose on the third day" is "true" for believers), but it’s not the *same kind* of fact as "the server is down." Your protocol analogy nails this: same syntax, different semantic rules.  

  2. **"Groundless Believing" vs. "Basic Beliefs"**  
     - **Wittgenstein** (and later D.Z. Phillips): Religious belief is "groundless" not because it’s irrational, but because it rests on **trust in a framework** (like trusting a friend). It’s not deduced; it’s the **foundation** of reasoning within that form of life.  
     - **Rival view?**: "Basic beliefs" (from epistemology, e.g., Alvin Plantinga) argue some beliefs (like God) are "properly basic"—instinctive/innate, like memory or perception. **Difference**: Your dad *denies* his trust is fallible ("not that kind of thing"), while basic beliefs *can* be mistaken. This isn’t a rival to Wittgenstein; it’s a different angle on non-inferential certainty.  

  3. **Register-Switching & Coherence**  
     - **Charles Taylor's "Social Imaginary"**: People inhabit layered frameworks (scientific, relational, spiritual) that feel coherent *to them* because they’re woven into daily life. Dave’s switches aren’t confusion—they’re **fluency across domains**.  
     - **What happens when claims move?**:  
       - When a religious claim ("God gave me a parking spot") is judged empirically, it looks like a failed prediction.  
       - Within the relational framework ("God is someone I trust"), it’s a **reinforcement of relationship**—like thanking a friend for a favor.  
     - **Your insight**: The friction arises when receivers assume all claims use the *empirical* protocol. For Dave, the parking spot isn’t a "test" of God; it’s a **ritual of recognition** within his trust-based system.  

  ### Why Your Framing Works
  - **"Protocol Mismatch"** captures the **meta-communicative disconnect**: Conflicts aren’t about the "data" (e.g., resurrection) but the **rules for validation**.  
  - **"Rules about successful transmission"** mirrors Wittgenstein’s emphasis on **use over reference**: Meaning isn’t in the word, but in how it’s deployed in a practice.  

  ### Edges of the Phenomenon: What Looks Similar But Isn’t  
  1. **Cognitive Dissonance**:  
     - If Dave denied the resurrection when pressed with counter-evidence *but still claimed faith*, that’s dissonance. Here, he maintains both frameworks without tension because they’re **non-competing in his mind**.  
  2. **Relativism ("True for you")**:  
     - Dave says it’s objectively true, not subjective. The framework itself makes *absolute claims*; it just doesn’t validate them empirically.  
  3. **Bad Faith / Self-Deception**:  
     - Not applicable. Dave isn’t evading contradictions; he experiences the frameworks as **mutually enriching**. The parking spot "delight" is sincere pattern recognition within his trust protocol.  

  ### The Tightest Philosophical Label: **Fideism with Factual Overlays**  
  - **Fideism**: Belief grounded in faith/trust, not evidence. But Dave (and your dad) **overlay factual language** because their framework *includes* historical events. This creates the "sliding" effect you observe.  

  ### Practical Takeaway  
  Your colleagues aren’t inconsistent—they’re **bilingual**. Arguing "facts" with them is like sending TCP packets over a UDP channel: the bytes arrive, but the protocol discards them as gibberish. The only "fix" is agreeing on a shared protocol first—which, as Dave admits, requires entering the practice.  

  This isn’t unique to religion! E.g., a scientist might call quantum mechanics "true" based on peer-reviewed data (empirical protocol) *and* say "I feel in my bones it’s elegant" (aesthetic/trust protocol). The difference is that science enforces protocol uniformity; religion integrates multiple registers as a feature.
