  - We require that `L` proves: there is no surjection from `Nat` to `U`.
  - But the metatheory sees that the set of closed terms of type `U` is countable (since there are only countably many closed terms in total). Moreover, if we have a model of `L` that interprets `U` as the set of closed terms of type `U` (or some other countable set), then we can enumerate the inhabitants of `U` externally.

  ### Clean Mappings

  1. **Countability of Syntax**: Both set theory and the PL language have a countable set of formulas/terms. This is a direct match.

  2. **Proving Uncountability Internally**: In set theory, we prove that `P(N)` is uncountable. In the PL version, we have a proof in `L` that `U` is uncountable (no surjection from `Nat`). This is a match.

  3. **Existence of a Countable Model**: 
     - In set theory, by Löwenheim-Skolem, we get a countable model.
     - In the PL version, we can build a model (interpretation) of `L` in which the type `U` is interpreted by a countable set. Since the entire language has only countably many closed terms, we can take the set of closed terms of type `U` (or a subset) as the interpretation. But note: the model might not be term-based. However, because the syntax is countable, any model that we build from the syntax (like the term model) will be countable.

  4. **External Enumeration**: 
     - In set theory, the external bijection between the countable model's `P(N)` and `N` is not in the model.
     - In the PL version, the metatheory can enumerate the inhabitants of `U` (by enumerating the closed terms of type `U`), but this enumeration is not a term in `L` (because `L` proves there is no such surjection). So the enumeration is external.

  ### Bending

  1. **Model Construction**:
     - In set theory, we use the Löwenheim-Skolem theorem to get a countable model. In the PL version, we don't have a theorem that automatically gives a model. Instead, we rely on the fact that the set of closed terms is countable. This is a bend: we are implicitly using a term model (or a model built from terms). But note: the term model might not be a model of the theory if the theory is inconsistent or if there are additional axioms that are not satisfied by the terms. We have to ensure that the theory is consistent and that the term model is a valid model.

