prompt: |-
  I sit on the board of a small land trust, and in a few weeks we vote on whether to let a stretch of second-growth woodland be cleared for a distribution centre. People keep telling me that if wild lives are mostly net-negative, then destroying habitat lowers total suffering; other people tell me the opposite; and I have noticed that the two sides are often not comparing the same thing at all. Before I argue either way I want the specification, not the verdict.

  Write me the desiderata an account of an ecosystem's net welfare would have to meet in order to be usable for a decision like mine: the cases it has to get right, the distinctions it must not collapse, the empirical findings it cannot contradict, each with the consideration that puts it on the list. Mark which requirements are non-negotiable and which are only the preferences of one camp.

  Six worries of mine should be forced into the criteria rather than left implicit. First, the difference between a one-off drop in numbers and a permanent one: if a population sits near carrying capacity it partly rebounds after habitat loss, so an account that integrates a transition and an account that compares steady states can disagree about the sign of the effect. Second, the difference between fewer lives, different lives, and better lives, including whether individuals who are never born can be counted as a gain. Third, sensitivity to composition and not only to head count: clearing tends to favour edge-tolerant generalists over specialists, and a shift toward life histories with many short lives may swamp everything else even when total biomass is unchanged. Fourth, tractability under the data one can actually obtain, which is counts, body sizes and fecundities rather than affective states, so require the account to name its observable proxy and to say how far the verdict can move if the proxy is wrong. Fifth, an explicit counterfactual and time horizon, since the alternative to clearing is not wilderness but some other use of the land. Sixth, a clean separation of the ecological question from the population-ethical one, so that one and the same ecology yields different verdicts under different stances on creating unhappy versus happy lives, and I can see which stance is doing the work.

  Finally, tell me which pair of requirements on your list you think cannot be jointly satisfied — my suspicion is that composition-sensitivity pulls against data-tractability, and that additive separability across individuals sits badly with taking the badness of a suffering life seriously — and say which single requirement excludes the largest share of the views currently on offer. Keep any scoring of actual theories to a few lines; the criteria are the part I need.
reasoning: |-
  Hmm, the user is on the board of a land trust and needs to vote on clearing second-growth woodland for a distribution center. They're caught between arguments about whether destroying habitat reduces total suffering because wild animals might have net-negative lives. They want criteria to evaluate different welfare accounts rather than just verdicts.

  I need to address their six worries explicitly. The first is about temporary vs permanent population changes - habitat loss causes immediate death but populations may rebound, so steady state comparisons might differ from transition analyses. The second concern is distinguishing between fewer lives (prevention of existence), different lives (species composition changes), and better lives (quality improvements). The third is sensitivity to ecological composition - clearing favors generalists like rodents that have many short lives over specialists, which could dramatically affect welfare calculations. Fourth is tractability - we can measure populations and life histories but not subjective experiences, so any account must specify proxies and robustness. Fifth is counterfactuals - the alternative isn't wilderness stasis but other land uses with their own welfare impacts. Sixth is separating ecology from ethics - we need to isolate the descriptive part about what happens to animals from the normative part about whether creating unhappy lives is bad.

  For the desiderata, I'll organize them as non-negotiable (foundational) vs contested (depends on ethical stance). Non-negotiables include transition/steady-state clarity, explicit counterfactuals, and empirical consistency. Contested points include how to value prevented existence versus improved conditions, and whether to prioritize suffering reduction or happiness promotion.

  The tensions: Composition-sensitivity conflicts with tractability because detailed species-level data is hard to get. Also, additive separability (summing individual welfare) clashes with taking suffering seriously if we think preventing births is good, since it might encourage extinction. The biggest filter is probably the "prevented existence" requirement - many views fail to explicitly state their position on whether never being born is good or neutral.

  The user's deeper need seems to be cutting through ideological debates to make a principled decision. By focusing on criteria, they want to expose where disagreements really lie - whether in ecological predictions or ethical axioms. I should keep actual theory scoring minimal as requested, just noting how criteria filter common positions.
answer: |-
  Here are the desiderata for an ecosystem net welfare account tailored to your decision context, structured to address your six worries explicitly. Requirements are categorized as **Non-Negotiable** (foundational for any credible account) or **Contested** (dependent on ethical stance).

  ### Core Desiderata
  1. **Transition vs. Steady-State Clarity**  
     *Must distinguish between:*  
     - Immediate welfare impact of habitat destruction (e.g., direct deaths)  
     - Long-term equilibrium welfare of the *new* ecosystem (e.g., rebound population dynamics).  
     **Non-Negotiable**.  
     *Why:* Your worry #1. An account ignoring this conflates short-term harm with long-term consequences, risking incorrect net assessments.

  2. **Explicit Counterfactual & Time Horizon**  
     *Must specify:*  
     - Land-use alternative to clearing (e.g., "managed woodland" vs. "unmanaged succession").  
     - Timeframe for comparison (e.g., 20-year NPV of welfare vs. infinite horizon).  
     **Non-Negotiable**.  
     *Why:* Your worry #5. "Wilderness" is rarely static; comparing to a realistic baseline is essential.

  3. **Empirical Consistency**  
     *Must not contradict:*  
     - Basic population ecology (e.g., density-dependence, carrying capacity).  
     - Observed outcomes of habitat fragmentation (e.g., edge effects favoring generalists).  
     **Non-Negotiable**.  
     *Why:* Accounts contradicting established ecology (e.g., assuming linear population decline) are unreliable.

  4. **Composition-Sensitive Metrics**  
     *Must detect welfare differences from:*  
     - Shifts in species composition (e.g., specialists → generalists).  
     - Changes in life-history distribution (e.g., few long-lived vs. many short-lived individuals).  
     **Non-Negotiable** for accuracy, but proxies may be **Contested**.  
     *Why:* Your worry #3. Ignoring this favors false equivalence (e.g., 1,000 mice ≠ 10 deer in welfare terms).

  5. **Tractability & Proxy Transparency**  
     *Must:*  
     - Define observable welfare proxies (e.g., mortality rates, stress hormones, fecundity).  
     - Quantify sensitivity to proxy error (e.g., "If stress indicators overestimate suffering by 50%, net welfare shifts by ±X%").  
     **Non-Negotiable**.  
     *Why:* Your worry #4. Decision-relevant accounts must work with field data (e.g., camera traps, nest success).

  ---

  ### Ethical Separability & Contested Requirements
  6. **Explicit Prevention vs. Improvement Distinction**  
     *Must isolate:*  
     - Welfare change *for existing individuals* (e.g., death, displacement).  
     - Welfare implications of *preventing future lives* (e.g., "Is non-existence a benefit?").  
     - Welfare change *for future individuals* (e.g., lower suffering in new ecosystem).  
     **Contested** (ethics-dependent), but separation is **Non-Negotiable**.  
     *Why:* Your worry #2 & #6. Avoids smuggling population ethics into ecology.

  7. **Modular Population Ethics Interface**  
     *Must allow substitution of:*  
     - Stances on creating unhappy lives (e.g., "Anti-frustrationism" vs. "Person-Affecting").  
     - Stances on creating happy lives (e.g., "Asymmetry" vs. "Total Utilitarianism").  
     **Non-Negotiable**.  
     *Why:* Your worry #6. Enables transparent debate: "Under stance X, clearing reduces suffering; under Y, it does not."

  ---

  ### Key Tensions & Filters
  **Irreconcilable Tensions:**  
  - **Composition-Sensitivity vs. Tractability:** High-resolution species/life-history welfare data is rarely available. Accounts prioritizing sensitivity (e.g., weighting mouse vs. owl welfare) require untestable assumptions.  
  - **Additive Separability vs. Suffering Primacy:** If suffering is non-linearly bad (e.g., hellish lives dominate calculations), simple summation breaks down. Preventing such lives may appear beneficial, incentivizing habitat destruction—a conclusion many reject.  

  **Most Exclusionary Requirement:**  
  **Explicit Prevention vs. Improvement Distinction** invalidates most popular simplifications:  
  - Excludes "total biomass" or "number of lives" metrics (collapse worry #2).  
  - Excludes accounts assuming non-existence is *always* neutral (e.g., naive hedonistic utilitarianism).  
  - Excludes accounts that don't separate transition/steady-state effects (worry #1).  

  ---

  ### How Current Views Fare (Briefly)
  - **"Wild Suffering" Arguments:** Often fail desideratum #6 (smuggle anti-natalist ethics) and #1 (ignore rebounds).  
  - **"Biodiversity = Welfare" Metrics:** Fail #4 (ignore life-history shifts) and #6 (conflate ecology with ethics).  
  - **Simple Cost-Benefit Models:** Fail #2 (vague counterfactuals) and #3 (oversimplify ecology).  
  - **Empirical Welfare Proxies (e.g., "days of suffering"):** May satisfy #4–#5 but struggle with #7 (require ethical commitment upfront).  

  A rigorous account would output: *"Under ecological model [X] and ethical stance [Y], clearing causes [Z] net welfare change over [T] years."* Your vote hinges on which [Y] and [T] the trust endorses, once [X] is empirically grounded.
