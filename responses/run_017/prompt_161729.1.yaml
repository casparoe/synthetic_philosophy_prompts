  Below is a complete diagnostic instrument for your seminar, structured as a two-sided handout. **Side 1** presents the battery of cases (10 cases with verdict options), and **Side 2** contains the decision tree (7 branch questions leading to 9 leaves). All terms are defined, cases are stipulated in full, and positions are labeled only where attribution is clear. Unoccupied logical space is diagnosed, and inseparable leaves are flagged.

  ---

  ### **Side 1: Battery of Cases**  
  *Define key terms:*  
  - **Stimulus condition (C)**: Event that triggers a disposition (e.g., being struck).  
  - **Manifestation (M)**: Outcome produced when a disposition is triggered (e.g., breaking).  
  - **Causal basis**: Intrinsic property of the object that grounds the disposition (e.g., atomic structure for fragility).  
  - **Intrinsic property**: Depends only on the object itself, not its environment.  
  - **Extrinsic property**: Depends on the object’s environment or relations.  

  *Cases:*  
  1. **Plain Fink**: A glass is fragile. A sorcerer monitors it; if struck, the sorcerer instantly makes it non-fragile before impact. The glass is struck.  
     *Verdicts*:  
     - (A) Disposition (fragility) is **present** at the moment of striking.  
     - (B) Disposition is **absent** at the moment of striking.  
     - (C) Case is **underdescribed**; I need to know the causal basis.  

  2. **Plain Mask**: A fragile glass is in a packing crate that absorbs impacts. Struck firmly, it does not break.  
     *Verdicts*:  
     - (A) Disposition is **present** (masked).  
     - (B) Disposition is **absent** (destroyed by the crate).  
     - (C) Disposition is present only if **stimulus includes no crate**.  

  3. **Intrinsic Mask**: A glass’s chemical coating (part of the glass) makes it temporarily shatterproof. Struck firmly, it does not break.  
     *Verdicts*:  
     - (A) Disposition is **present** (masked by intrinsic property).  
     - (B) Disposition is **absent** (coating destroyed fragility).  

  4. **Extrinsic Mask**: Identical to Plain Mask, but the crate is not part of the glass (merely nearby).  
     *Verdicts*:  
     - (A) Disposition is **present** (masked).  
     - (B) Disposition is **absent** (crate extrinsically destroyed it).  

  5. **Mimic**: A non-fragile steel vase is wired to explode if struck. Struck, it explodes into pieces.  
     *Verdicts*:  
     - (A) Disposition (fragility) is **present** (manifestation occurs).  
     - (B) Disposition is **absent**; manifestation **occurs but not from fragility**.  
     - (C) Disposition is **created** by the stimulus.  

  6. **Coincidence**: A fragile glass is in a shock-absorbent crate (masking it). Unbeknownst to all, a bomb in the crate detonates on impact. Struck, the glass shatters from the bomb, not the strike.  
     *Verdicts*:  
     - (A) Disposition is **present** (manifestation occurs).  
     - (B) Disposition is **absent** (masked); manifestation **occurs but not from fragility**.  
     - (C) Manifestation **would occur** by coincidence, but the disposition is masked.  

  7. **Delayed Fink**: A glass is fragile. A device, triggered when struck, makes it non-fragile after 0.5 seconds. The strike also starts a 0.3-second breaking process. Breaking completes before non-fragility sets in.  
     *Verdicts*:  
     - (A) Disposition is **present** and manifests.  
     - (B) Disposition is **absent** during manifestation.  
     - (C) Disposition **manifests but is destroyed** during the process.  

  8. **Self-Dissolving Mask**: A fragile glass has a coating that dissolves on impact. Struck, the coating vanishes, and the glass breaks after a delay.  
     *Verdicts*:  
     - (A) Disposition is **present**; mask removed by stimulus.  
     - (B) Disposition is **masked until dissolution**.  
     - (C) Manifestation **occurs but not in virtue of** the disposition.  

  9. **Unrealizable Stimulus**: A particle is disposed to teleport if spun at 99% lightspeed. This speed is physically impossible (requires infinite energy).  
     *Verdicts*:  
     - (A) Disposition is **present**.  
     - (B) Disposition is **absent** (stimulus unrealizable).  
     - (C) Cannot ascribe disposition **without knowing causal basis**.  

  10. **Permanently Protected**: A fragile glass is encased in an indestructible, immutable shield. It can never be struck.  
      *Verdicts*:  
      - (A) Disposition is **present**.  
      - (B) Disposition is **absent** (shield destroys it).  
      - (C) Disposition is present but **inescapably masked**.  

  ---

  ### **Side 2: Decision Tree**  
  *Start here after recording verdicts for all cases.*  
  **Q1 (Fink):** In *Plain Fink*, is fragility present at the moment of striking?  
  - **A: Yes** → Go to Q2.  
  - **B: No** → Go to Q3.  

  **Q2 (Mask):** In *Plain Mask*, is fragility present?  
  - **A: Yes** → Go to Q4.  
  - **B: No** → **Leaf: Mask-Destroys-Disposition View**  
    - *Position*: Masks destroy dispositions (finks do not); dispositions are extrinsic.  
    - *Awkward commitment*: Intrinsic masks (*Case 3*) are indistinguishable from extrinsic ones (*Case 4*).  

  **Q3 (Mask):** In *Plain Mask*, is fragility present?  
  - **A: Yes** → Go to Q5.  
  - **B: No** → Go to Q6.  

  **Q4 (Mimic):** In *Mimic*, is fragility present?  
  - **A: Yes** → **Leaf: Simple Conditional Analysis (SCA) Defender**  
    - *Position*: Disposition ascriptions = "if C, then M" (no revisions needed). Finks/masks are misdescribed.  
    - *Awkward commitment*: *Mimic* falsely attributes fragility to the steel vase.  
  - **B: No** → **Leaf: Basis-Sensitive Conditional Analysis**  
    - *Position*: Dispositions require a causal basis that would produce M if C occurred *and* is retained long enough.  
    - *Awkward commitment*: *Delayed Fink* (*Case 7*) challenges "retained long enough" (basis destroyed mid-manifestation).  

  **Q5 (Intrinsic):** In *Intrinsic Mask*, is fragility present?  
  - **A: Yes** → Go to Q7.  
  - **B: No** → **Leaf: Dispositions-as-Intrinsic + Causal Basis Primitivism**  
    - *Position*: Dispositions are intrinsic properties grounded in a causal basis; masks/finks disrupt the basis.  
    - *Awkward commitment*: *Extrinsic Mask* (*Case 4*) must be explained via changes to intrinsic basis.  

  **Q6 (Unrealizable):** In *Unrealizable Stimulus*, is the disposition present?  
  - **A: Yes** → **Leaf: Extrinsic Multi-Track Dispositions**  
    - *Position*: Dispositions are extrinsic, multi-track (sensitive to background conditions); finks/masks are part of C.  
    - *Awkward commitment*: C becomes ungainly (e.g., "if struck *and no sorcerer/bomb/crate*...").  
  - **B: No** → **Leaf: Gradable Dispositions View**  
    - *Position*: Dispositions admit degrees; unrealizable cases fall below a threshold.  
    - *Awkward commitment*: Thresholds are arbitrary (e.g., *Permanently Protected*, *Case 10*).  

  **Q7 (Basis):** Must manifestations proceed from the disposition’s causal basis? (Inspired by *Mimic/Coincidence*)  
  - **A: Yes** → **Leaf: Causal Power Realism**  
    - *Position*: Dispositions are irreducible causal powers; manifestations require production by the basis.  
    - *Awkward commitment*: *Self-Dissolving Mask* (*Case 8*) may not involve the basis if coating dissolution causes breaking.  
  - **B: No** → **Leaf: Quiddity View**  
    - *Position*: Dispositions are primitive modal properties (quiddities); manifestations need not stem from the basis.  
    - *Awkward commitment*: *Coincidence* (*Case 6*) becomes a "true" manifestation (since M occurs, even coincidentally).  

  ---

  ### **Unoccupied Logical Space & Inseparable Leaves**  
  - **Q1=A, Q2=B, Q4=A**: Incoherent (denies fink affects disposition but allows mask to destroy it—no known position).  
  - **Q1=B, Q3=B, Q6=B, Q7=B**: Unexplored (rejects unrealizable stimuli and basis-dependence but not gradability).  
  - **Inseparable leaves**: *Basis-Sensitive Conditional Analysis* and *Causal Power Realism* cannot be split without Q7; both require manifestations from a basis.  

  ### **Diagnostic Efficacy**  
  - **Most classificatory question**: **Q1 (Fink)** splits SCA defenders (deny finks) from others (accept finks as counterexamples).  
  - **No clean-handled case**: **Delayed Fink** (*Case 7*). Positions struggle with whether the basis persists *during* manifestation.  

