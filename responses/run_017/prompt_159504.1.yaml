  2.  **The "Qualia" of the Mid-Point Green:**
      *   **Translation:** Stalinesque = Doctored state buffer presented. Orwellian = False log entry.
      *   **Residue:** The *phenomenal experience itself* – the vivid sensation of seeing green *before* `T+Δ`. In your model, this is just data in a buffer or log. The "what it is like" aspect has no correlate. **Distortion Level:** High. The model describes *information processing* states, not subjective experience.
