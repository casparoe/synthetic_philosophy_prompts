  **MEMORANDUM**  
  **THACKERAY GENERAL HOSPITAL CLINICAL ETHICS COMMITTEE**  
  **REF: CEC/POL/24/07 (REV 3.1)**  
  **DATE: 2024-07-19**  
  **SUBJECT: REVISED PROTOCOL FOR ELECTIVE SURGERY & LOCAL ANESTHETIC ADMINISTRATION UNDER ETHICAL DECISION PROCEDURE v3.0**

  Following the mandatory triennial review of the Ethical Decision Procedure (EDP v3.0), as instituted per the terms of the Abernathy Bequest (2021), the Clinical Ethics Committee (CEC) hereby promulgates revised protocols concerning the administration of local anesthetics and the scheduling of elective surgical procedures. These protocols are derived from rigorous application of the EDP v3.0 framework.

  **1.  Lexical Threshold Primacy:**  
  The primary ethical imperative under EDP v3.0 remains the absolute prevention of any suffering episode exceeding the established Lexical Threshold (LT = 4.0 Hedonic Units (HU); see Appendix A). Actions or policies carrying any non-zero probability of precipitating an LT-exceeding episode are lexically dominated by alternatives eliminating such risk, irrespective of countervailing benefits.

  **2.  Suspension of Routine Local Anesthetic Use:**  
  Effective immediately, the prophylactic administration of injectable local anesthetics (e.g., lidocaine, bupivacaine) for minor procedures (e.g., suturing, dental work, dermatological biopsies) is suspended. Rationale: All such agents carry a documented, non-zero risk of severe allergic reaction/anaphylaxis (estimated probability: 1.2x10^-5 per administration). Anaphylaxis episodes are consistently rated above the LT (≥ 5.8 HU). Therefore, the certain prevention of this risk lexically dominates the certain, sub-LT suffering associated with the unanesthetized procedure itself (typically 0.5-2.5 HU, depending on duration; see Appendix B).

  **3.  Introduction of the Triviality Cut (TC):**  
  The Committee recognizes that strict application of LT Primacy (Clause 1) necessitates managing sub-LT suffering. To optimize resource allocation and patient throughput, a secondary threshold, the Triviality Cut (TC = 0.05 HU), is established (Motion: Dr. R. Finch (Compliance), Seconded: Lay Member (Rotating)). Suffering episodes measuring ≤ 0.05 HU are deemed lexically weightless. Accumulation of such episodes, regardless of quantity or duration, carries no ethical significance under EDP v3.0 and cannot lexically dominate *any* benefit or risk mitigation.

  **4.  Sub-Trivial Discomfort Regimens (Authorized):**  
  Where procedural suffering is unavoidable (per Clause 2), clinicians are authorized to employ Sub-Trivial Discomfort Regimens (STDRs). These involve the deliberate induction of discomfort calibrated to ≤ 0.05 HU (e.g., mild pressure sensations, controlled cool air application, very low-intensity vibration, verbal distraction protocols). STDRs are ethically permissible replacements for traditional analgesia, as the suffering induced is lexically weightless. *Example:* For suturing, utilize focused cold air (rated 0.03 HU/sec) and pressure application (rated 0.04 HU/sec) instead of lidocaine injection.

  **5.  Probability Assessment Protocol & Regress Resolution:**  
  Assessing the "non-zero probability" of LT-exceeding events (Clause 1) requires evaluating the probability that *this* assessment itself overlooks a risk factor, potentially leading to infinite regress. The Committee resolves this via Operational Definition 7.2: The probability of an LT-exceeding event is deemed zero for procedural authorization if and only if, after three sequential, independent risk assessments by qualified personnel (utilizing CEC-approved Risk Factor Matrix v4.2), no pathway to an LT event is identified. This constitutes ethical certainty under EDP v3.0.

  **6.  Experience Segmentation Protocol (ESP):**  
  The ethical significance of suffering is assessed per *discrete experiential episode* as defined by the CEC Experience Segmentation Protocol (ESP v2.0). An "episode" is delineated by: a) Natural physiological boundaries (e.g., sleep/wake cycle, procedure start/end timestamps); b) Significant contextual shift (e.g., change of caregiver, location); c) Physician-ordered temporal segmentation. Suffering intensity is assessed as the *peak* HU value within a defined episode. *Crucially:* Suffering below the LT, even if prolonged, cannot be aggregated across segmented episodes to reach or exceed the LT. Each segment is evaluated independently.

  **7.  Protocol Application to Elective Surgery:**  
  Elective surgical procedures involving general anesthesia remain permissible *only if*:
      a)  The procedure demonstrably prevents a future LT-exceeding episode (e.g., excising a malignant tumor likely to cause ≥ 4.01 HU suffering).
      b)  The inherent risks of general anesthesia (including but not limited to intraoperative awareness, severe PONV, nerve injury) are assessed per Clause 5 and deemed to carry a probability of zero for precipitating an LT episode.
      c)  Post-operative pain management adheres strictly to STDR principles (Clause 4) unless demonstrably preventing an LT episode (e.g., managing pain from major trauma).

  **8.  Worked Example - Reversal of Suturing Ban via ESP:**  
  See Appendix B. Application of ESP v2.0 (temporal segmentation per 15-minute intervals) to unanesthetized suturing demonstrates that peak suffering per segment remains below both TC and LT, rendering the procedure ethically permissible under Clauses 4 & 6, despite the initial suspension under Clause 2.

  **9.  Dissenting View (Recorded):**  
  Dr. Ada Okonjo (Former Chair), in her submitted commentary, reiterated fundamental dissent: "EDP v3.0's focus on preventing arbitrary threshold breaches ignores the *total quantity* of suffering endured. Substituting certain, prolonged, sub-LT misery (via STDRs) for a vanishingly small risk of severe suffering is not mitigation; it is merely redistributing and potentially *increasing* the aggregate burden. The ethical imperative is to minimize net suffering, not merely avert its most intense forms." This view was noted but falls outside the EDP v3.0 framework governing the Committee.

  **10. Distribution & Compliance:**  
  This memorandum must be distributed to all clinical departments, heads of service, and relevant administrative staff immediately. Compliance is mandatory. The probability of non-compliance carrying LT-exceeding consequences (e.g., reputational damage triggering severe patient distress) is non-zero. Therefore, distribution must follow the Probability Assessment Protocol (Clause 5): Three independent officers must verify recipient lists against the Staff Directory v.2024.08 before dissemination. Failure to adhere constitutes an ethical breach under the Abernathy Bequest terms.

  **Signed,**  
  *Dr. Evelyn Thorne (Chair, CEC)*  
  *Dr. Raymond Finch (Compliance Officer)*  
  *Professor Arthur Vance (Hedonic Psychometrics)*  
  *Ms. Priya Sharma (Lay Member, Rotating)*

  ---

  **APPENDIX A: Hedonic Unit (HU) Definition & Lexical Threshold Calibration**

  *   **Hedonic Unit (HU):** The CEC Standard Hedonic Unit quantifies subjective suffering intensity-duration. 1.0 HU is defined as the suffering experienced during one minute of calibrated "Moderate Headache" (MH) as induced in Laboratory Setting 3 (ISO 17025 Accredited) using controlled visual stressor + capsaicin nasal spray. Intensity scales logarithmically per the Vance-Thorne Perceived Suffering Index (VTPI).
  *   **Lexical Threshold (LT):** Set at 4.0 HU. Calibration Basis: Consensus judgment of the founding CEC (pre-EDP v3.0) that no finite quantity of Moderate Headaches (1.0 HU/min) could ever ethically outweigh the imperative to prevent one minute of "Severe Interrogation Stress" (SIS - simulated waterboarding protocol, rated 5.8 HU/min). The value 4.0 HU was selected as the point where this lexical dominance became absolute under VTPI modeling. Suffering ≥ 4.01 HU lexically dominates any finite quantity of suffering < 4.0 HU, pleasure, or relief.
  *   **Triviality Cut (TC):** Set at 0.05 HU. Calibration Basis: Suffering ≤ 0.05 HU/min (e.g., mild hunger pang, slight draft discomfort) was consistently rated by VTPI validation panels as "imperceptible or negligible" in ethical weight, even when projected over indefinite durations.

  **APPENDIX B: Worked Example - Suturing Under EDP v3.0**

  *   **Scenario:** 5cm facial laceration requiring 30 minutes of suturing.
  *   **Pre-ESP Assessment (Clause 2):** Unanesthetized suturing pain ≈ 2.0 HU/min. Total Suffering ≈ 60 HU. However, risk of anaphylaxis from lidocaine (≈5.8 HU) has P≈1.2x10^-5. Per Lexical Threshold Primacy (Clause 1), the non-zero risk dominates the certain 60 HU. Lidocaine prohibited. Procedure suspended? Not necessarily.
  *   **Apply Experience Segmentation Protocol (ESP v2.0 - Clause 6):** Segment the 30-minute procedure into two discrete 15-minute episodes.
  *   **Per-Episode Assessment:** Peak suffering per 15-min episode remains ≈ 2.0 HU/min. Total suffering *per episode* = 30 HU (15 min * 2.0 HU/min). 30 HU < 4.0 HU (LT). *Crucially:* Suffering cannot be aggregated *across* episodes. Each 30 HU episode is evaluated independently and falls below the LT. Neither constitutes an LT-exceeding event.
  *   **Apply Triviality Cut (Clause 3 & 4):** Peak suffering (2.0 HU/min) > TC (0.05 HU). Therefore, STDRs (Clause 4) are *authorized* but not *required* to make the suffering lexically weightless. However, utilizing STDRs (e.g., cold air @ 0.03 HU/sec ≈ 1.8 HU/min) can reduce the peak suffering per minute closer to, but still above, the TC.
  *   **Outcome:** The procedure is ethically permissible without traditional anesthesia. Peak suffering per defined episode (15 mins) remains sub-LT. STDRs may be employed to marginally reduce intensity, though their impact is lexically insignificant unless reducing peaks below TC. The initial suspension under Clause 2 is overruled by the segmentation permitted under Clause 6. Proceed with suturing.
