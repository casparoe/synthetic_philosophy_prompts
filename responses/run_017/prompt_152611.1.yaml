prompt: |-
  I'm doing one of those big online courses on moral psychology — the one built around Moral Foundations Theory — and we have to peer-grade each other's short answers. I'm not an academic, I got into this stuff after an argument at work and then kept reading. I've been fine on the last few I marked but this one I can't get a handle on: it reads really well and I honestly can't tell if it's actually good or if I'm just being taken in by the writing. Grading is anonymous so I can't ask the person what they meant. If it deserves a high mark say so, I just don't want to hand out an 18 for something that's quietly wrong, or mark someone down because I misread them.

  The course setup, so you don't need to know it. MFT says there are roughly six foundations: care/harm, fairness/cheating, loyalty/betrayal, authority/subversion, sanctity/degradation and liberty/oppression. The finding we keep coming back to is that self-identified liberals score high on the first two and much lower on the so-called binding ones, while conservatives score fairly high on all six — lower on care and fairness than liberals but nowhere near zero. The lectures hammer on the point that all of this is descriptive, and that "which side is right" is a separate, normative question that the psychology doesn't settle on its own.

  Two other things from the lectures. The lecturer gave a name to something she called the symmetry problem: for almost any psychological explanation you can give of why someone on one side holds a moral view, you can give an equally good psychological explanation of the person on the other side, so a debunking argument that only fires in one direction should make you suspicious. And she said that a causal story about where a belief comes from only undermines the belief if you add something like "and that process doesn't track the truth" — otherwise you'd have to say our eyes tell us nothing about tables either. Sorry, I'm definately paraphrasing that badly.

  Here's the question we were set:

  "Lots of people argue like this: conservatives' moral judgments about certain sexual practices are predicted by how disgust-sensitive the person is, and disgust is a pathogen-avoidance system rather than a wrongness-detector, so those judgments are unjustified. Assess this argument using the lecture material. You should (1) explain why 'it has a psychological cause' is not on its own a reason to think a judgment is false, (2) state the symmetry problem and say whether it applies to this argument, and (3) say what else would have to be true for the argument to work."

  And here's the answer I have to mark:

  "MFT is a descriptive theory. It says liberals' moral judgments are mostly driven by care and fairness, while conservatives also weight loyalty, authority, sanctity and liberty — and that is a claim about what people actually respond to, not about what there is reason to do. You cant get an 'ought' from an 'is', so the bare fact that a judgment has a psychological cause isn't yet a reason to think it's false; otherwise you'd have to say we don't know there are tables, since our beliefs about tables come from our visual system. What you need is the extra claim that the mechanism in question doesn't track the truth.

  That's what the disgust argument tries to supply. Condemnation of these practices is predicted by disgust sensitivity, and disgust evolved to keep us away from rotting food and faeces, not to detect wrongness. So there's a mismatch between what the judgment is about — moral status — and what the mechanism is for — avoiding infection — and in a mismatch case like that we have a reason to doubt the judgment.

  There's a further point in favour of the conservative, too. If conservatives respond to six foundations and liberals to two, then conservatives are taking more of the moral landscape into account. The book's comparison with taste receptors is exactly right here: someone with five working receptors is a better judge of a dish than someone with two, and in the same way the conservative is in a better position to judge a case where loyalty or sanctity is genuinely at stake. Liberals aren't wrong about care and fairness, they're just responding to less.

  The obvious objection is the symmetry problem: can't we tell the same kind of story about liberal judgments, tracing care and fairness back to kin altruism and reciprocal altruism? I don't think this gets off the ground. Those mechanisms are at least aimed at the right subject matter — other people's welfare and fair treatment — whereas pathogen avoidance has nothing to do with morality at all. And you can see the difference in the data: liberals really do score lower on the binding foundations, which is why they find these judgments so hard to understand. So the debunking argument fires in one direction only, and the psychological evidence ends up supporting the liberal rather than the conservative."

  Can you do two things for me. First, give it a mark out of 20 using the course rubric: 5 for stating the relevant positions accurately, 5 for using the lecture concepts correctly, 5 for the quality of the argument, 5 for dealing with the obvious objection — and tell me roughly where the marks went. Second, give me the comments I should paste back, point by point: what's right and worth credit (including anything that's right for a reason they didn't quite give), and the specific places where it goes wrong, what exactly is wrong with each, and what a correct version of that bit would say. Please be picky about the bits that sound convincing but don't actually follow, that's the part I keep missing.
reasoning: |-
  Okay, the user is in a tricky peer-grading situation for a moral psychology course based on Moral Foundations Theory (MFT). They need to evaluate an answer that sounds convincing but might have subtle flaws. Let me break this down carefully.

  First, the user's core concern is validity assessment - they don't want to be swayed by rhetorical flair. The answer argues that disgust-based moral judgments can be debunked because disgust evolved for pathogen avoidance, not morality. It also claims conservatives have broader moral "receptors" like taste buds, making them superior judges. The symmetry problem counterargument gets dismissed because liberal foundations (care/fairness) are "aimed at right subject matter."

  Hmm, major red flags emerge when cross-checking with lecture principles. The "truth-tracking" requirement is partially applied but selectively. The taste bud analogy fundamentally misrepresents MFT - foundations aren't sensory capacities but distinct moral modules. Claiming conservatives "respond to more" implies normative superiority, contradicting the descriptive nature of MFT. 

  The symmetry problem handling is particularly weak. The answer claims liberal foundations map to morality while disgust doesn't - but loyalty/authority/sanctity equally map to specific moral concerns in conservative frameworks. Dismissing low liberal binding scores as "not understanding" ignores the core MFT finding that political differences stem from weighting, not capability.

  For grading: Strong on stating positions (4/5) but loses a point for mischaracterizing foundations as receptors. Concepts application starts well then derails (3/5). Argument quality suffers from false analogies and normative leaps (2/5). Objection handling misses symmetry's core function (1/5). Total 10/20 - barely passing due to foundational errors masked by confident writing.

  Key feedback points: 1) Taste analogy fails - foundations aren't deficient sensors but different priorities. 2) MFT describes weightings, not truth-tracking ability. 3) Symmetry requires equal scrutiny of all foundations' origins. 4) Low binding scores reflect different valuations, not ignorance. The student needs to disentangle descriptive psychology from philosophical justification.
answer: |-
  Here's a precise breakdown of the answer's strengths, weaknesses, and a suggested mark based on the rubric:

  **Overall Mark: 10/20**

  *   **Stating Relevant Positions Accurately (3/5):**
      *   **Good:** Correctly summarizes MFT as descriptive, the "is/ought" distinction, the need for "doesn't track truth" beyond mere psychological cause, the disgust argument's structure, and the symmetry problem *concept*.
      *   **Deducted 2 Points:** Severely misrepresents the conservative advantage argument. MFT makes no claim that having *more* foundations makes one a "better judge" or "responds to more of the moral landscape" in a normative sense. This is a fundamental misreading, importing a normative claim MFT explicitly avoids. The taste bud analogy is used incorrectly to imply conservative moral *superiority*, which is not a MFT finding.

  *   **Using Lecture Concepts Correctly (2/5):**
      *   **Good:** Correctly applies the "is/ought" distinction and the "need for lack of truth-tracking" point to the disgust argument. Correctly names the symmetry problem.
      *   **Deducted 3 Points:**
          1.  **Misapplies MFT Foundations:** Treats foundations like sensory receptors (taste buds) implying liberals are deficient or perceive less reality. Foundations are psychological systems *weighted differently*, not sensory capabilities. Low weighting != inability to perceive.
          2.  **Misapplies Symmetry Problem:** Fails to recognize that the *exact same logic* used to debunk disgust-based sanctity judgments ("mechanism X evolved for purpose Y, not morality") can be applied to care/fairness ("mechanism Z evolved for kin/reciprocal altruism, not abstract universal morality"). The answer's rebuttal (care/fairness mechanisms are "aimed at the right subject matter") is question-begging and ignores the lecture point that *all* foundations have evolutionary origins distinct from abstract moral reasoning.
          3.  **Misinterprets Low Binding Scores:** Claims low liberal binding scores mean they "find these judgments so hard to understand." MFT attributes this primarily to different *weighting/valuation*, not lack of comprehension.

  *   **Quality of the Argument (3/5):**
      *   **Good:** Structure is clear. The initial setup of the disgust argument and the rebuttal based on the lecture's core epistemological point (need for lack of truth-tracking) is logically sound *for that specific point*.
      *   **Deducted 2 Points:**
          1.  **False Analogy:** The taste bud/conservative advantage argument is fundamentally flawed and illogical, as explained above. It relies on a false equivalence and smuggles in normative claims.
          2.  **Begging the Question in Symmetry Rebuttal:** The claim that care/fairness mechanisms are "aimed at the right subject matter" simply *assumes* that only harm and fairness *are* the "right subject matter" for morality, which is the *very thing* the sanctity foundation (and disgust argument) challenges. It doesn't *argue* why pathogen avoidance *couldn't* be linked to a valid moral dimension (sanctity/purity); it just asserts it.

  *   **Dealing with the Obvious Objection (Symmetry Problem) (2/5):**
      *   **Good:** Correctly identifies the symmetry problem as the obvious objection and attempts to address it.
      *   **Deducted 3 Points:**
          1.  **Fails to Apply Symmetry:** Doesn't seriously engage with *how* the debunking logic applies equally to liberal foundations. The rebuttal is superficial and dismissive.
          2.  **Relies on Flawed Premises:** The rebuttal depends entirely on the flawed premise that care/fairness mechanisms are inherently "aimed at morality" while disgust isn't, and the flawed interpretation of low binding scores as lack of understanding.
          3.  **Reverses the Point:** Concludes the *psychological evidence supports the liberal*, which completely misunderstands the symmetry problem's purpose. The symmetry problem highlights that *psychology alone* cannot resolve the normative debate in favor of *either* side by showing debunking works symmetrically. The answer uses flawed psychology to try and do exactly that.

  ---

  **Feedback Comments to Paste Back:**

  **Strengths & What's Good:**

  1.  **Clear Structure:** Your answer is well-organized and easy to follow.
  2.  **Core Descriptive Nature of MFT:** You correctly identify MFT as a descriptive theory and emphasize the "is/ought" gap. This is fundamental.
  3.  **Key Epistemological Point:** You accurately explain why "it has a psychological cause" alone isn't sufficient to debunk a belief, using the visual system/tables analogy effectively. You correctly state the debunking argument requires the additional claim that the mechanism "doesn't track the truth."
  4.  **Summarizing the Disgust Argument:** You clearly outline the structure of the disgust-based debunking argument against conservative sanctity judgments, highlighting the claimed "mismatch" between mechanism (pathogen avoidance) and judgment (moral wrongness).
  5.  **Identifying the Symmetry Problem:** You correctly name the symmetry problem as the obvious objection.

  **Weaknesses & Where It Goes Wrong:**

  1.  **Misrepresenting Conservative "Advantage" & Taste Analogy (Major Error):**
      *   **What's Wrong:** Your argument that conservatives are "taking more of the moral landscape into account" and are "better judges" like someone with more taste receptors is a fundamental misrepresentation of MFT. **MFT makes *no* normative claims about which foundations are "correct" or whether having more foundations makes someone a "better" moral judge.** It describes *differences in weighting*. Claiming conservatives "respond to more" implies they perceive more moral truth, which is a philosophical claim MFT *does not support*. The taste bud analogy is deeply misleading; foundations aren't sensory deficits/surpluses.
      *   **Correct Version:** MFT finds conservatives *weight* loyalty, authority, and sanctity more heavily, while liberals *weight* care and fairness more heavily. This is a descriptive difference in psychological prioritization. It does not imply conservatives have access to more moral truth or are objectively better judges. The taste analogy is inappropriate for describing foundation weighting differences.

  2.  **Misapplying Foundations & Misinterpreting Low Binding Scores:**
      *   **What's Wrong:** Stating liberals "score lower on the binding foundations, which is why they find these judgments so hard to understand" oversimplifies. Low scores primarily reflect *lower valuation or weighting* of those concerns within their moral framework, not an inherent inability to comprehend them. The "hard to understand" phrasing suggests a cognitive deficit, which isn't the MFT claim.
      *   **Correct Version:** Liberals assign less moral *weight* to loyalty, authority, and sanctity concerns compared to care and fairness. This difference in prioritization explains why they often disagree with or *assign lower importance* to judgments based primarily on binding foundations, not necessarily why they "find them hard to understand."

  3.  **Incorrectly Handling the Symmetry Problem (Major Error):**
      *   **What's Wrong:** Your rebuttal to the symmetry problem fails. You dismiss the idea that care/fairness could be similarly debunked by arguing those mechanisms are "aimed at the right subject matter" (welfare/fairness) while disgust (for pathogen avoidance) isn't. **This begs the question.** It *assumes* that welfare/fairness are the *only* legitimate parts of morality, which is precisely what the Sanctity foundation (and conservatives) dispute. The lecture's symmetry point is that evolutionary explanations for *any* foundational intuition (e.g., care from kin altruism, fairness from reciprocal altruism, sanctity from disgust/pathogen avoidance) pose the *same kind* of challenge – why trust *any* evolved intuition? You don't provide a reason why the debunking logic *only* works against disgust/sanctity.
      *   **Furthermore,** concluding the "psychological evidence ends up supporting the liberal" fundamentally misunderstands the symmetry problem. **The symmetry problem shows psychology *alone* cannot resolve the normative debate in favor of *either* side.** Demonstrating a possible debunking path for one intuition doesn't validate the alternatives unless you've *independently* justified those alternatives. Your argument here tries to use descriptive psychology to draw a normative conclusion, which the "is/ought" point earlier warned against.
      *   **Correct Approach:** To address symmetry, you must acknowledge that *if* the disgust argument works (because disgust doesn't track moral truth), then parallel arguments *could* be made against care/fairness (e.g., kin/reciprocal altruism mechanisms aren't designed for universal morality). The lecture's point is that singling out *one side's* intuitions for debunking based *only* on origin is suspect unless you have an independent reason to trust the *other* intuitions. The disgust argument needs its *own* justification for why *that specific* mechanism doesn't track truth, without simply assuming the liberal foundations *do*.

  **Key Takeaway for Improvement:** Be extremely careful not to import normative claims ("better judge," "more of the moral landscape," "supports the liberal") into descriptions of MFT findings. MFT describes *what is* (differences in psychological weighting), not *what ought to be*. The symmetry problem requires applying the *same* skeptical lens to the origins of *all* foundational intuitions, not just the ones you disagree with. A convincing rebuttal needs to show why disgust is uniquely *un*reliable *as a guide to moral truth*, not just that it evolved for something else.
