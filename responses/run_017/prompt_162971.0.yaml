  We are going to translate the Maxwell's demon resolution from thermodynamics to a Bayesian vocabulary. The key points of the physics:

  1. Measurement (acquisition of information) is reversible and thermodynamically free.
  2. The cost comes at erasure (resetting memory to a standard state), which dissipates at least kT ln 2 per bit.
  3. The work extractable per cycle is bounded by kT ln 2 * I(Molecule; Memory), the mutual information between the molecule's state and the demon's memory.
  4. The erasure cost is at least kT ln 2 * H(Memory), the entropy of the memory state.

  Generalization: The net work gain per cycle is bounded by kT ln 2 * [I(Molecule; Memory) - H(Memory) + H(Memory|Molecule)]? Actually, note that the erasure cost is kT ln 2 * H(Memory) and the work extracted is kT ln 2 * I(Molecule; Memory). But note that I(Molecule; Memory) = H(Memory) - H(Memory|Molecule). Therefore, the net work is bounded by:
     Work extracted - Erasure cost <= kT ln 2 * [I - H(Memory)]
     = kT ln 2 * [ (H(Memory) - H(Memory|Molecule)) - H(Memory) ]
     = - kT ln 2 * H(Memory|Molecule)

  But that would be negative? Actually, the standard result is that the net work per cycle is non-positive if we account for the erasure. The bound on the work extracted does not account for erasure. The erasure cost is a separate cost. So the net work per cycle is:
     W_extracted - W_erasure <= kT ln 2 * I - kT ln 2 * H(Memory)
     = kT ln 2 * [I - H(Memory)]

  But note that I <= H(Memory), so this is non-positive. However, the demon might have memory that is not independent of the molecule? Actually, the standard resolution is that the erasure cost must be at least H(Memory) * kT ln 2, and the work extracted is at most I(Molecule; Memory) * kT ln 2. Therefore, the net work is at most kT ln 2 * (I - H(Memory)) <= 0.

  But note that H(Memory) = I(Molecule; Memory) + H(Memory|Molecule). So:
     Net work <= kT ln 2 * [I - (I + H(Memory|Molecule))] = - kT ln 2 * H(Memory|Molecule) <= 0.

  So the net work is non-positive, as expected.

  Now, in the Bayesian framework, we are going to restate without physics.

  Prose Translation:

  In the Bayesian framework, the process of acquiring evidence (the demon's measurement) is free: updating your beliefs by conditioning on new data does not incur any intrinsic cost. The benefit of this evidence is quantified by the mutual information between the state of the system (the molecule) and the evidence (the memory state). This mutual information represents the expected improvement in your log score (the gain in information) and is the upper bound on the expected utility you can achieve by acting optimally on the evidence.

  However, the cost of maintaining a record of that evidence becomes apparent when you need to reset your memory to a standard state to reuse it. This resetting cost is proportional to the entropy of the memory state itself. The entropy of the memory state measures the uncertainty in the memory before resetting. Even parts of the memory that are uncorrelated with the system (like noise or redundant records) must be accounted for in the resetting process.

  Therefore, the net gain from the entire cycle (acquisition and reset) is bounded by the mutual information minus the entropy of the memory. Since the entropy of the memory is always at least as large as the mutual information (because H(Memory) = I(Molecule; Memory) + H(Memory|Molecule)), the net gain is non-positive. This non-positivity reflects that you cannot create a perpetual motion machine by this process.

  Residue Report:

  We now break down the translation.

  First, the gap between mutual information and memory entropy:

  In the Bayesian framework, mutual information measures the reduction in uncertainty about the system of interest (the molecule) given the memory. This is the gain. However, the entropy of the memory (H(Memory)) does not have a direct counterpart in the Bayesian updating process. The Bayesian agent does not pay a cost for having high entropy beliefs or for storing a lot of information. In fact, the agent is encouraged to have as much evidence as possible. The cost of memory entropy is a physical cost of resetting a physical memory device. In the pure Bayesian framework without physical constraints, there is no concept of resetting memory because memory is abstract and can be kept indefinitely without cost. Therefore, the entropy of the memory (H(Memory)) is a concept that does not translate without introducing the physicality of memory.

  Second, agent-relativity:

  In the physics, the mutual information I(Molecule; Memory) is a statistical property of the joint distribution. It does not depend on whether the demon can decode the memory. Therefore, the work bound is in terms of the mutual information, regardless of whether the demon can use it. However, the demon must be able to use the memory to extract work. If the memory is scrambled, then the demon might not be able to extract the work. But note: the physics bound on extractable work is I(Molecule; Memory) * kT ln 2. This bound is achieved only if the demon can use the memory optimally. If the demon cannot decode the memory, then it cannot achieve that bound. So the bound is an upper bound that assumes optimal use. Therefore, the physics bound is about the correlation, but the demon must be able to act on it to achieve the bound.

  In the Bayesian framework, the mutual information also does not depend on the agent's ability to use the information. However, the expected utility gain from the information (the value of information) assumes that the agent can act optimally. If the agent is miscalibrated or cannot decode, then the actual gain might be less than the mutual information. So the translation is clean: the mutual information is the upper bound on the gain, but achieving it requires optimal use. If the agent cannot use the memory, then the actual gain is less.

  Third, timing:

  In the physics, if the demon never erases (writes to fresh tape), then the cost of erasure is avoided. However, the cost then appears in the preparation of the blank tape. The initial blank tape must be in a low-entropy (standard) state. Preparing that state requires work. The work to prepare a blank tape of one bit is at least kT ln 2. Therefore, the cost is shifted to the manufacturing of the blank memory. In the Bayesian framework, if we consider an agent that never reuses memory (writes to fresh tape), then there is no reset cost. But the agent must have a blank memory to write to. In the abstract Bayesian framework, we don't account for the cost of having a memory in the first place. The gap is that the Bayesian framework does not account for the resources required to have the memory device. The timing of the payment (acquisition, retention, or manufacture) is a physical constraint that does not have a counterpart in the abstract Bayesian framework.

  Residue Verdict:

  The key residue is the cost of memory. The Bayesian framework has no concept of the cost of maintaining or resetting memory. Therefore, the thermodynamic cost of erasure (or preparation of blank memory) is a fact about physical memory devices. The epistemic work (the gain from information) is captured by mutual information, but the cost of holding the map is not in the Bayesian vocabulary. The smallest honest addition to the Bayesian framework that would supply this missing term would be to introduce a resource cost for memory. For example, we could assign a cost per bit of memory that must be reset or per bit of memory that we maintain. However, this would be smuggling in the physicality. Without that, the gap remains.

  The claim that "information is physical" is substantive: it points out that in the physical world, the manipulation of information (as represented in physical states) incurs thermodynamic costs. The Bayesian framework, being abstract, does not account for these costs. Therefore, the residue is a defect of the framework for describing physical agents. However, for abstract reasoning, the framework is complete.

