prompt: |-
  hi — I keep losing the same argument in my EA-adjacent group chat and I want something I can paste into it.

  The setup: we were arguing about whether a funder should concentrate everything on the highest-expected-value cause or spread money across several, and whether it's ever ok to turn down a gamble with positive expected value when the bad tail is catastrophic (small chance of something extinction-level, or an intervention that could backfire badly). Someone who reads a lot of decision theory shut it down with: "if you're not maximizing expected utility you can be money-pumped, so your preferences are incoherent, and that's all 'irrational' means here." He then used that to say risk aversion about tail outcomes isn't a value judgement at all, it's just an error, and there's nothing to respect in it.

  I'm sure a lot is being smuggled in but I can't point at the smuggling. Can you lay out, as a list, the different precise claims that one-liner could be making? Things I want seperated:

  - the synchronic version (a set of bets you'd each accept that together guarantee a loss) vs the diachronic version (a sequence of trades over time that walks you somewhere worse). These feel like different arguments with different assumptions but I can't say how.
  - whether the pump needs an adversary who can read off your dispositions, and whether it needs you to be the kind of thing that forms a plan and then gets to revisit it. Is a one-shot chooser — a donor making a single grant, a model run once — pumpable at all?
  - what "worse off" means, given the agent isn't a maximizer: worse by whose lights? I have a feeling that if the agent's choices don't reveal a single ordering then the argument quietly assumes what it's trying to show, but I want that stated properly instead of gestured at.
  - the reply that a sophisticated non-maximizer just declines the later trades, together with the counter-reply that if you let agents have preferences over histories of choice the axioms become nearly vacuous. Is that a genuine standoff or is there a standard way through it?
  - how much is actually extractable. I've heard something about small violations only permitting small pumps. Even if that's right, does it help me? Getting pumped for a small amount seems compatible with still being glad you weren't a maximizer, which makes me think "exploitable" isn't automatically "defective."
  - whether being pumpable is supposed to *constitute* the irrationality or merely be evidence for it.

  For each reading, tag it as trivial, substantive-and-defensible, question-begging, or false. And the part I actually care about: say which readings would really get him from "she's not an expected utility maximizer" to "her attitude to catastrophic risk isn't a value, it's a mistake", because I suspect most of them don't. No citations or reading lists, I'll deal with those myself.
reasoning: |-
  We are given a scenario where an individual in an EA-adjacent group chat is using a decision-theoretic argument to claim that any deviation from expected utility maximization (EUM) is irrational because it leads to being money-pumped. The user wants to unpack this argument and specifically address the claim that risk aversion about catastrophic tail outcomes is not a legitimate value judgment but an error.

  The user has provided several points to disentangle. We will address each and then assess which readings of the money-pump argument actually support the claim that risk aversion is a mistake.

  First, we break down the one-liner: "if you're not maximizing expected utility you can be money-pumped, so your preferences are incoherent, and that's all 'irrational' means here."

  We will consider the following:

  1. **Synchronic vs. Diachronic Money Pumps**:
     - **Synchronic**: A set of bets offered simultaneously that, if accepted, lead to a sure loss (a Dutch book). This is a one-shot scenario.
     - **Diachronic**: A sequence of trades over time that, step by step, leads the agent to a worse outcome. This requires the agent to change their mind or have inconsistent preferences over time.

  2. **Adversarial Setting and Agent Type**:
     - Does the money pump require an adversary who knows the agent's preferences and can offer trades accordingly?
     - Is the agent a one-shot decision-maker (like a single grant) or a repeated player?

  3. **Definition of "Worse Off"**:
     - If the agent is not an expected utility maximizer, then by what standard are they worse off? We must avoid circularity.

  4. **Sophistication and Preferences Over Histories**:
     - Can a non-EUM agent avoid being pumped by being sophisticated (i.e., precommitting or refusing later trades)?
     - If we allow the agent to have preferences over entire sequences of choices, do we render the axioms vacuous?

  5. **Extent of Exploitation**:
     - Are small violations of EUM only leading to small amounts of exploitation? And is being exploitable for a small amount necessarily a defect?

  6. **Role of Money-Pumping**:
     - Is being money-pumped the very definition of irrationality, or just evidence for it?

  We will now address each point and then tag the reading as:
  - Trivial: If the argument is technically correct but doesn't have the intended force.
  - Substantive-and-defensible: If the argument holds water and supports the intended conclusion.
  - Question-begging: If the argument assumes what it sets out to prove.
  - False: If the argument is incorrect.

  Finally, we will check which readings support the jump from "not an EUM" to "attitude to catastrophic risk is a mistake (not a value)".

  ---

  **1. Synchronic vs. Diachronic**:

     - **Synchronic pump (Dutch book)**: This is a one-shot scenario where the agent is offered a set of bets that together guarantee a loss. For example, the agent might have non-linear probabilities or violate the independence axiom. This does not require time or changing preferences.
       - *Tag*: Substantive-and-defensible for static choices. However, note that a one-shot donor making a single grant might not face multiple simultaneous bets. If the context is a single grant, then a synchronic pump might not apply because the donor isn't being offered multiple bets at once.

     - **Diachronic pump**: This involves a sequence of choices. The classic example is the cycle of preferences (A>B, B>C, C>A) leading to being pumped over time. This requires the agent to make sequential decisions and have dynamic inconsistency.
       - *Tag*: Substantive-and-defensible for sequential choices. However, it assumes the agent is myopic and doesn't precommit. Also, if the agent is making a one-time decision (like a single grant), then a diachronic pump might not be relevant.

  **2. Adversary and Agent Type**:

     - The money pump argument typically assumes an adversary who can offer trades based on the agent's known preferences. Without an adversary, the pump might not occur in practice.
     - For a one-shot chooser (like a donor making a single grant), a synchronic pump is only possible if multiple bets are offered at once. A diachronic pump is irrelevant because there is no sequence. Therefore, a one-shot chooser might not be pumpable at all if the context doesn't allow multiple bets or sequential choices.
       - *Tag*: The argument that non-EUM agents *can* be pumped is true in theory but might not apply in practice for one-shot decisions. For the EA context, if the funder is making a single allocation, then the pump argument might be irrelevant. However, the theoretical possibility remains.

  **3. Definition of "Worse Off"**:

     - The money pump leads to an outcome that is worse by the agent's own preferences. But if the agent's preferences are intransitive or incomplete, then the notion of "worse" might be ambiguous. The argument assumes that the agent prefers more money to less (or some background ordering) and that the net result is a loss of money (or whatever the numeraire is). However, if the agent has state-dependent utility or cares about other things (like avoiding catastrophic risks), then the loss of money might not be the only consideration.
       - *Tag*: The argument can be question-begging because it assumes that the agent's preferences should satisfy the axioms of EUM (like transitivity) to define a coherent ordering. But the non-EUM agent might not accept that ordering as the only standard. For example, if the agent is risk-averse over catastrophic losses, they might value the avoidance of a small chance of ruin more than the expected monetary value. In that case, being pumped (losing money) might be acceptable if it avoids the catastrophic state.

  **4. Sophistication and Preferences Over Histories**:

     - A sophisticated agent who knows they might be pumped can avoid the diachronic pump by precommitting or refusing the sequence of trades. However, the synchronic pump cannot be avoided by sophistication because it is one-shot.
     - If we allow the agent to have preferences over entire sequences (e.g., they prefer to avoid the sequence that leads to a sure loss), then we can restore coherence. But then the argument becomes: if you have preferences that are not representable by EUM, then you can be pumped unless you have such higher-order preferences. However, the standard EUM model does not typically account for preferences over sequences. 
       - *Tag*: The counter-reply that axioms become vacuous if we allow preferences over histories is a genuine concern. But we might still require that the preferences over histories are coherent (e.g., satisfy the axioms at the level of histories). This is substantive-and-defensible but complex. However, in practice, for the catastrophic risk case, the agent might just refuse the bets that expose them to ruin, and that might be consistent with their values.

  **5. Extent of Exploitation**:

     - It is known that small violations of the EUM axioms lead to only small amounts of money being pumped (the loss is bounded). Therefore, if the stakes are low, the agent might not care. However, in the context of catastrophic risks, the stakes are extremely high. 
     - Moreover, being pumped for a small amount might be acceptable if the agent's values are better satisfied in other ways. For example, if the agent is extremely risk-averse about extinction, they might be willing to pay a small premium to avoid any chance of it. Then, even if they are pumped for that premium, they might still be glad they avoided the risk.
       - *Tag*: This point is substantive-and-defensible in showing that the degree of irrationality might be small, but it doesn't address the core issue of catastrophic risk aversion. However, it does show that the money-pump argument might not be as damning as it seems.

  **6. Money-Pumping as Constitutive vs. Evidential**:

     - The argument might be that being pumpable *is* what it means to be irrational (constitutive). Alternatively, it might be that being pumpable is evidence that the agent's preferences are inconsistent (evidential).
     - If constitutive, then the definition of irrationality is being vulnerable to a sure loss. But that might be too narrow because there are other forms of irrationality (e.g., logical inconsistencies not related to betting). 
       - *Tag*: This is a trivial reading because it defines irrationality as pumpability. But then we must ask: why should we care about pumpability? The answer might be that we don't want to suffer sure losses. However, in the catastrophic risk scenario, the agent might be more concerned about avoiding ruin than avoiding sure losses in money.

  ---

  **Which readings support the jump to "risk aversion about catastrophic risk is a mistake"?**

  The key claim of the opponent is that risk aversion about catastrophic tail outcomes is not a value but a mistake. We must see if the money-pump argument supports that.

  - The money-pump argument shows that non-EUM preferences are incoherent (in the sense of leading to sure losses or being dynamically inconsistent). But note that the risk-averse agent might have coherent preferences that are just not linear in probabilities. For example, they might have a utility function that is bounded (to avoid the St. Petersburg paradox) or they might use a different decision rule (like minimax). 

  - However, the standard money-pump arguments are often directed at violations of independence or transitivity. Risk aversion about catastrophic events might be captured by a utility function that is highly concave in the region of catastrophic losses. That is entirely compatible with EUM. So the argument might be misapplied.

  - But the scenario also mentions turning down a positive expected value gamble with a catastrophic bad tail. If the gamble has positive expected utility (using a standard utility function), then turning it down would violate EUM. However, the agent might be using a utility function that is not standard (e.g., they assign infinite disutility to extinction). That is still EUM. Alternatively, they might be using a non-EUM model (like prospect theory with loss aversion, or a precautionary principle). 

  - The money-pump argument does not directly show that assigning a high disutility to extinction is a mistake. It only shows that if the agent's choices violate the axioms (like transitivity), they are pumpable. Therefore, if the agent's risk aversion does not lead to intransitive preferences, then they might avoid being pumped. 

  - For instance, if the agent consistently turns down any gamble that has a positive probability of extinction (regardless of the upside), then they might not be pumpable. They would simply refuse any bet that involves that risk. In that case, their preferences might be complete and transitive: they prefer any outcome without extinction to any outcome with extinction. Then, they are not pumpable because they don't have cyclical preferences.

  - However, if the agent's risk aversion leads to violations of the independence axiom (like in the Allais paradox), then they might be vulnerable to a Dutch book. But even then, the agent might not care about the Dutch book if it only involves small stakes. And in the extinction case, the stakes are huge.

  **Conclusion**: The money-pump argument, in its standard forms, does not show that risk aversion about catastrophic events is a mistake. It only shows that if the agent's preferences violate certain axioms (like transitivity or independence), then they are vulnerable to being pumped. But the opponent must show that the agent's specific risk aversion leads to such violations. 

  Moreover, even if there is a violation, the agent might have a principled reason (like avoiding catastrophic risk) that justifies the violation. The argument that "it's just an error" ignores that the agent might be trading off expected value for reduced risk of ruin, which is a value judgment.

  **Tags for each reading**:

  1. Synchronic: Substantive-and-defensible for static choices, but may not apply to a single grant. Doesn't automatically show that risk aversion is a mistake.

  2. Diachronic: Substantive-and-defensible for sequential choices, but requires an agent that makes sequential decisions. A one-shot chooser isn't vulnerable. Doesn't automatically show that risk aversion is a mistake.

  3. Definition of "worse off": Question-begging, because it assumes the agent should value outcomes in a way that satisfies the axioms. The risk-averse agent might not accept that the pumped outcome is worse by their own lights.

  4. Sophistication: Substantive-and-defensible, but if the agent can avoid being pumped by being sophisticated, then the argument doesn't apply. Also, allowing preferences over histories can accommodate non-EUM agents without incoherence.

  5. Extent: Trivial in the sense that small violations lead to small losses. But the risk-averse agent might be willing to accept a small loss to avoid catastrophe.

  6. Constitutive vs. Evidential: Trivial if constitutive (defines irrationality as pumpability). But we can question why pumpability is the standard.

  **Overall for the opponent's claim**: None of the readings clearly support the jump to "risk aversion about catastrophic risk is a mistake". The money-pump argument targets incoherence in preferences, but risk aversion about catastrophe can be coherent (e.g., consistent application of a high disutility for extinction). The opponent must argue that such a disutility is itself irrational, which the money-pump argument does not do.

  Therefore, the user can reply that the money-pump argument does not show that risk aversion about catastrophic risks is a mistake; it only shows that if the agent's choices are intransitive or violate independence, they can be pumped. But if the agent's choices are consistent with a coherent set of values (like avoiding extinction at all costs), then they are not necessarily pumpable and their position is a value judgment.
answer: |-
  Here's a precise breakdown of the money-pump argument's claims, categorized by your requested dimensions. Each reading is tagged (trivial, substantive-and-defensible, question-begging, or false), and I'll specify which variants actually support the "it's not a value, it's a mistake" conclusion at the end.

  ---

  ### **1. Synchronic vs. Diachronic Pumps**
  - **Synchronic (Dutch book)**: Accepting a set of simultaneous bets that collectively guarantee a loss, due to inconsistent preferences (e.g., violating probability axioms).  
    - *Tag*: **Substantive-and-defensible** for incoherent probability judgments.  
  - **Diachronic**: Accepting sequential trades that exploit dynamic inconsistency (e.g., cycling A>B>C>A), leading to a net loss.  
    - *Tag*: **Substantive-and-defensible** for time-inconsistent preferences.  

  ### **2. Adversary & Agent-Type Assumptions**
  - **Requires an adversary?** Yes, for diachronic pumps (they must exploit known preferences). Synchronic pumps don't require an adversary—just a menu of bets.  
  - **One-shot chooser pumpable?**  
    - Synchronic: **Yes** (if offered multiple bets at once).  
    - Diachronic: **No** (no sequential choices exist).  
    - *Tag*: **Substantive-and-defensible**. One-shot agents avoid diachronic exploitation.  

  ### **3. "Worse Off" By Whose Lights?**
  - **Definition**: "Worse off" means ending with an outcome the agent *themselves* disprefer relative to the starting point, assuming background consistency (e.g., "more resources preferred to less").  
  - **Problem**: If preferences are incomplete or state-dependent, "worse off" may be undefined. The argument assumes a context-independent valuation (e.g., money as a numeraire).  
    - *Tag*: **Question-begging** for catastrophic risk. It assumes the agent *should* value outcomes linearly, but rejecting this is core to risk aversion.  

  ### **4. Sophistication & Preferences Over Histories**
  - **Sophisticated agent refuses pumps**: A non-maximizer who pre-commits to refusing future trades avoids diachronic pumps.  
  - **Counter-reply**: If we allow preferences over *whole choice histories*, violations of EU axioms become "rational" by fiat.  
    - *Tag*: **Standoff**.  
      - Sophistication defense: **Substantive-and-defensible** (blocks pumping).  
      - Vacuity counter: **Substantive-and-defensible** (but only if history-preferences are arbitrary; they needn't be).  

  ### **5. How Much Is Extractable?**
  - **Small violations → small pumps**: Bounded EU deviations allow only bounded exploitation (e.g., losing pennies).  
  - **Why it might not help**:  
    - For catastrophic risk, losses are unbounded (e.g., extinction).  
    - An agent might *accept* small pumps to avoid tail risks (e.g., paying a premium for safety).  
    - *Tag*: **Substantive-and-defensible** for small stakes, **false** for catastrophes (where "small loss" is irrelevant).  

  ### **6. Role of Pumping: Constitutive vs. Evidential**
  - **Constitutive**: Being pumpable *defines* irrationality (incoherence = vulnerability to sure loss).  
    - *Tag*: **Trivial** (by construction, but ignores *why* we care about coherence).  
  - **Evidential**: Pumping is *symptomatic* of irrationality (reveals preference conflicts).  
    - *Tag*: **Substantive-and-defensible** (but doesn’t imply "error" for values).  

  ---

  ### **Which Readings Support "Risk Aversion Isn't a Value, It's a Mistake"?**
  **Only one variant does—and it's question-begging**:  
  - The synchronic pump (**substantive-and-defensible**) *if* we assume:  
    - Outcomes are valued linearly (e.g., utility is linear in resources).  
    - Risk aversion over catastrophes violates probability axioms (e.g., non-additive beliefs).  
  - **Why it fails**:  
    - Risk aversion can be **coherent** (e.g., utility functions with steep cliffs at catastrophe).  
    - "Mistake" claims rely on **smuggling in linearity** (e.g., ignoring that avoiding extinction might be lexically prioritized).  
    - Diachronic pumps fail against one-shot decisions or sophisticated agents.  
    - "Worse off" is **question-begging** if the agent values catastrophe-avoidance over money-pump arguments.  

  **Crucially, no variant legitimately bridges "non-EU → mistake"**:  
  - Pumping reveals *formal incoherence* under EU axioms, not that risk-averse *values* are wrong.  
  - Rejecting EU maximization to avoid catastrophe is **consistent** with coherent, non-linear values (e.g., "survival > all else").  

  ---

  ### **What You Can Paste**  
  > "The money-pump argument shows EU violations *can* lead to incoherent choices under specific conditions—but it doesn’t show that risk aversion over catastrophes is a 'mistake.'  
  > - **One-shot choices?** Not pumpable diachronically.  
  > - **Sophistication?** Blocks exploitation.  
  > - **Values?** 'Worse off' assumes linear valuation, but avoiding extinction might be lexical.  
  > - **Stakes?** Small pumps don’t refute catastrophe-aversion.  
  > Pumping reveals *structural* incoherence if you accept EU’s axioms, but rejecting those axioms to prioritize survival isn’t an ‘error’—it’s a value judgment. The argument conflates *instrumental rationality* (coherence) with *substantive rationality* (what to value)."  

  This forces the debate onto values (why accept EU axioms?) rather than decision-theoretic "irrationality."
