prompt: |-
  I'm in the second year of a philosophy PhD and trying to settle on the spine of a dissertation project. The area I keep returning to is what I'll call lexical threshold negative utilitarianism: the family of views on which there is some intensity or quality of suffering such that no quantity of pleasure, however large and however widely distributed, can outweigh a single instance of suffering above that line, while below the line pleasures and pains trade off against each other in something like the ordinary way. I have roughly fifteen months before I have to file a proposal and about that long again of funded time after it, working essentially alone, with decent formal tools but no empirical ones and no collaborators in psychology or neuroscience. So the question I want help with is an allocation question: given that budget, and given that the point of the project is to get clear about whether this family of views is defensible rather than to map it, which of the open questions in the neighborhood deserves to be the central one, and which deserve to be set aside? I'm not asking for a survey of the area or for orientation reading; I have enough grip on the standard dialectic to skip that. I want a defended ordering.

  The candidates I've been turning over, roughly: first, the commensurability question itself — whether pleasure and pain are magnitudes on a single scale at all, and whether the lexical theorist can even motivate the view by appeal to their incommensurability, given that a lexical priority relation seems to be a comparative relation and so to presuppose at least comparability. Second, a problem I haven't seen handled and that I think might be the real crux: whether the threshold is supposed to be a fixed point on a scale of phenomenal intensity or is indexed to the subject's own hedonic baseline and history. If it's fixed, it appears to generate strange verdicts about subjects whose baseline has shifted through long adaptation, in both directions; if it's indexed, it starts to look like an ordinary prioritarian concern for the worst off with a lexical edge bolted on, and I'm unsure what the lexical edge is then doing. Third, the question of what the currency of intensity is: whether the relevant magnitude is momentary felt intensity, its integral over time, or something like the degree to which the experience occupies the subject's attentional field, and whether those can come apart for the same episode in a way that changes the verdicts. Fourth, the level question: whether the threshold operates on token experiences, whole lives, populations, or entire worlds, and whether lexicality at one level is even consistent with aggregation at another. Fifth, the epistemic question of how one would ever locate the threshold well enough for the view to guide action, and whether the difficulty here is an objection to the axiology or merely to its decision-theoretic application. My supervisor's view is that the axiology is basically settled once you say where the threshold sits and that all the live work is epistemic; I suspect the opposite, that the epistemic problem is a symptom of an unresolved axiological one, but I hold that loosely.

  What I'd like from you is a prioritization of these, plus anything important I've left out, with the reasoning made explicit rather than asserted. For each: what it is upstream of, how tractable it is in fifteen months for someone doing armchair and formal work rather than empirical work, how neglected it is relative to how much rides on it, and how much would actually change downstream if it were answered one way rather than another — including whether the answer would change what a convinced lexical theorist should do, or only what they should say. I'd also like you to flag which of these are hollow or overrated, in the sense that they look deep but their answer wouldn't move anything, and to say what kind of result, over the next few years and from wherever it might come, would move items up or down your ranking. Concretely: if you were in my position, which two questions would you build the proposal around, and in what order would you work through them? Please write in American English.
reasoning: |-
  Okay, let me start by really understanding what this philosophy PhD student is asking. They're in their second year, focusing on lexical threshold negative utilitarianism. Their main issue is figuring out which central question to prioritize for their dissertation, given their constraints—15 months to draft a proposal, another 15 months of funded work, working solo with formal tools but no empirical resources or collaborators in psychology or neuroscience. They've listed five candidate questions and want a defended ordering based on upstream/downstream effects, tractability, neglect, and impact.

  First, I need to unpack each of the candidate questions they mentioned. The first is about commensurability—whether pleasure and pain can even be compared on the same scale. If they aren't commensurable, the lexical threshold might not make sense because the theory assumes some comparability. The second question is whether the threshold is fixed or relative to the individual's hedonic baseline. Fixed thresholds could lead to counterintuitive results for people with adapted baselines, while relative ones might blur into prioritarianism. The third is about the currency of intensity: is it momentary, integral over time, or attentional focus? This affects how we measure suffering. Fourth is the level question—does the threshold apply to experiences, lives, populations, or worlds? And fifth is the epistemic problem of locating the threshold in practice.

  The student's supervisor thinks the axiology is settled once the threshold is placed, and the real work is epistemic. But the student suspects the opposite—that the epistemic issues stem from unresolved axiological problems. This is a key tension. I need to evaluate which questions are foundational versus derivative.

  Starting with commensurability (Question 1): If pleasure and pain aren't commensurable, the whole lexical structure might collapse. But if they are, then the threshold makes sense. This seems upstream because it affects whether the theory is even coherent. If incommensurability is true, the lexical threshold can't be motivated. Solving this could make or break the entire project. Tractability-wise, it's armchair-friendly, using formal tools to explore comparability. It's somewhat neglected but crucial. If answered, it changes everything downstream—either validating the framework or forcing a major pivot.

  Next, the fixed vs. relative threshold (Question 2). This seems like the core of how the threshold is defined. Fixed thresholds ignore individual differences, leading to absurd outcomes for someone with a high pain tolerance. Relative thresholds risk collapsing into prioritarianism. If it's relative, what's the point of the lexical edge? This question is central because it defines the threshold's nature. It's tractable with formal modeling of different threshold types and their implications. It's under-discussed but high-stakes. Answering it would clarify if lexical NU is distinct or redundant.

  The currency question (Question 3) is about measurement—what exactly is being thresholded? Momentary spikes vs. prolonged suffering. But this might be downstream. If the threshold is defined, the currency affects application but not the theory's core. It's more technical and possibly solvable with thought experiments. However, without resolving Q1 and Q2, defining the currency might be premature. It's important but secondary.

  Level of application (Question 4) deals with aggregation. If the threshold applies to experiences, how does it scale to lives or populations? This involves formal aggregation problems. But if lower levels aren't resolved, this might not matter yet. It's complex and could be deferred. The epistemic question (Question 5) is about locating the threshold. But if the axiology isn't settled (e.g., if the threshold is relative), measurement becomes impossible. The supervisor sees this as key, but the student thinks it's symptomatic. Tractability is low without empirical input, making it less feasible for this project.

  Considering neglect: Q2 (fixed vs. relative) seems most underexplored with high stakes. Q1 (commensurability) has some literature but needs formal reevaluation. Q5 (epistemic) is discussed more but depends on prior axiology. 

  Tractability: Q1 and Q2 are doable in 15 months with armchair methods. Q4 and Q5 are harder without empirics. Downstream impact: Solving Q1 determines if the theory is viable. Q2 defines its structure. If Q2 resolves that thresholds must be relative, it might collapse into prioritarianism, making lexical NU redundant. That's a huge implication.

  Hollow issues? The currency (Q3) might be less critical if Q1/Q2 aren't resolved. Level (Q4) is important but not primary. Epistemic (Q5) depends on axiology, so tackling it first might be putting the cart before the horse.

  The student should focus on Q1 and Q2 as the core. Start with commensurability to ensure the framework works, then tackle the threshold's nature. If Q1 fails, the project pivots; if it holds, Q2 defines the theory. These are interdependent but Q1 is more upstream. 

  So, prioritize Q1, then Q2. If time, Q3 for currency. Flag that Q5 is overrated without resolving axiology. New results in metaethics or decision theory could shift rankings, but for now, build the proposal on Q1 and Q2.
answer: |-
  Based on your constraints (solo armchair/formal work, 15+15 months, goal of assessing defensibility), here’s a defended prioritization of your questions, with reasoning structured by your criteria. I’ll flag hollow points and suggest a core focus.

  ### **Prioritization Ranking (High to Low Priority)**
  1.  **Fixed vs. Indexed Threshold (Your Question 2)**  
      - **Why upstream?** This is the *conceptual engine* of lexical threshold NU. If the threshold isn’t fixed, the view collapses into prioritarianism (undermining its uniqueness). If fixed, it faces adaptation objections that may be fatal. It determines whether lexical NU is a distinct, coherent position.  
      - **Tractability:** High. Armchair-friendly: analyze thought experiments (e.g., chronic pain patients, hedonic adaptation, dystopian scenarios) using decision trees or simple modeling. Formal tools can map implications of fixed vs. relative thresholds.  
      - **Neglect vs. Stakes:** Highly neglected. Most debates assume fixed thresholds without scrutiny. Stakes are maximal: if indexed, lexical NU loses its raison d'être; if fixed, it may be indefensible due to adaptation.  
      - **Downstream Impact:** Decisive. Answers determine if lexical NU is *viable* (fixed) or *redundant* (indexed). Affects applied ethics: e.g., if fixed, alleviating mild suffering for millions could outweigh extreme torture for one (counterintuitive); if indexed, policy focuses on worst-off individuals.  
      - **Hollow?** No. Central to the view’s identity.  

  2.  **Commensurability (Your Question 1)**  
      - **Why upstream?** If pleasure/pain are *wholly* incommensurable, lexical thresholds can’t exist (no common scale to "outweigh"). But if commensurable, lexical priority seems arbitrary. Must resolve whether "outweighing" is coherent.  
      - **Tractability:** Moderate-High. Formal tools excel here: model comparability vs. cardinality (e.g., using interval scales vs. ordinal rankings). Analyze if lexicality requires commensurability or merely ordinal comparability.  
      - **Neglect vs. Stakes:** Moderate neglect. Commensurability is debated, but rarely tied to lexical thresholds. Stakes are high: if incommensurable, the project dies; if commensurable, it bolsters the framework.  
      - **Downstream Impact:** Foundational. A "no" answer kills lexical NU entirely; a "yes" enables further work. Little practical guidance change (if commensurable, action follows threshold location; if not, no view to apply).  
      - **Hollow?** No, but risk of overcomplication. If minimally commensurable (e.g., ordinal ranking), Q1 is tractable; if pushed to cardinality, it may stall progress.  

  3.  **Epistemic Problem (Your Question 5)**  
      - **Why mid-tier?** Depends on Q1/Q2. If thresholds are indexed or incommensurability holds, epistemic issues are secondary. If fixed/commensurable, locating the threshold *is* critical—but only after establishing it *exists*.  
      - **Tractability:** Low-Moderate. Armchair work can explore vagueness (e.g., sorites arguments for thresholds) or decision-making under uncertainty (e.g., maximin rules). However, without empirical inputs, progress is limited.  
      - **Neglect vs. Stakes:** Overemphasized (per your supervisor). Stakes are high *if* Q1/Q2 are resolved favorably, but low otherwise.  
      - **Downstream Impact:** Affects *applicability*, not defensibility. If unsolvable, it makes lexical NU impractical but not false.  
      - **Hollow?** **Overrated** if pursued prematurely. If axiology is unresolved (your suspicion), this is a distraction.  

  4.  **Currency of Intensity (Your Question 3)**  
      - **Why low?** Assumes Q1/Q2 are resolved. If intensity isn’t the right currency (e.g., attention matters more), it tweaks the threshold’s definition but doesn’t challenge the framework.  
      - **Tractability:** Moderate. Use formal models (e.g., integrating time-discounting or attention weights) and conceptual cases (e.g., brief agony vs. prolonged distress).  
      - **Neglect vs. Stakes:** Neglected, but stakes are medium. Changes *how* we measure suffering but not whether lexical NU works.  
      - **Downstream Impact:** Modest. Alters threshold calibration (e.g., momentary spikes vs. duration) but doesn’t invalidate the view.  
      - **Hollow?** **Partly hollow** if Q1/Q2 fail. If they succeed, it’s necessary but not urgent.  

  5.  **Level of Application (Your Question 4)**  
      - **Why lowest?** Presupposes a defensible threshold exists at *some* level. Aggregation problems (e.g., lexicality at experience-level vs. population-level) are important but derivative.  
      - **Tractability:** Moderate. Formal aggregation models (e.g., social choice theory) can show inconsistencies, but this is complex and better suited to post-dissertation work.  
      - **Neglect vs. Stakes:** Understudied, but stakes are low-medium. If lexicality fails at higher levels, it may constrain the view but not refute it (e.g., "only apply at experience-level").  
      - **Downstream Impact:** Limited. Affects scope (e.g., can lexical NU guide policy?), not core defensibility.  
      - **Hollow?** **Overrated** for your goal. A "levels problem" doesn’t kill the theory; it just narrows its domain.  

  ---

  ### **What You’ve Missed**
  - **Threshold Vagueness:** Not just epistemic—could be metaphysical (is suffering inherently vague?). Affects Q2’s fixed/indexed debate.  
  - **Motivational Roots:** Why adopt lexical NU? If based on intuition (e.g., "torture can’t be traded"), this may presuppose fixed thresholds.  
  - **Alternative Frameworks:** E.g., lexical thresholds based on *capabilities* (not hedonic intensity). Expands the view beyond NU but may be too broad.  

  ---

  ### **Recommended Core Focus & Work Plan**  
  **Build your proposal around Q2 (fixed vs. indexed threshold) and Q1 (commensurability), in that order.**  
  - **Why Q2 first?** It’s the linchpin. If lexical thresholds must be indexed, your project shifts to critiquing lexical NU as disguised prioritarianism. If fixed, you confront adaptation objections head-on. This is the most original, high-leverage contribution.  
  - **Then Q1:** It validates the entire endeavor. If commensurability fails, Q2 is moot—but Q2’s analysis may reveal *how* commensurability functions (e.g., comparability without cardinality).  

  **15-Month Work Plan:**  
  1. **Months 1–6:** Formalize fixed vs. indexed thresholds. Model adaptation scenarios (e.g., agent with elevated pain tolerance). Prove whether indexed thresholds reduce to prioritarianism.  
  2. **Months 7–12:** Test commensurability. Use decision-theoretic frameworks (e.g., Savage axioms) to see if "lexical priority" requires full cardinality.  
  3. **Months 13–15:** Draft proposal synthesizing Q1/Q2 results. If both hold, sketch implications for Q5 (epistemics); if not, pivot to a critique of lexical NU.  

  **Why not Q5?** Your supervisor’s focus is premature. If the threshold’s nature (Q2) is unresolved, trying to locate it is like measuring a ghost. Axiology first, then application.  

  ---

  ### **What Could Change This Ranking?**  
  - **New Result in Meta-Ethics:** E.g., a proof that all values must be commensurable would elevate Q1.  
  - **Neuroscience Breakthrough:** Evidence that pain intensity is non-comparable across individuals (e.g., via fMRI) would boost Q2’s stakes.  
  - **Shift in Moral Psychology:** If empirical work shows widespread rejection of lexical intuitions, Q5 gains urgency—but still downstream.  

  **Bottom Line:** Lexical threshold NU stands or falls on whether its threshold can be defined without absurdity (Q2) and whether suffering/pleasure can "trade off" at all (Q1). Anchor your dissertation here—everything else is commentary.
