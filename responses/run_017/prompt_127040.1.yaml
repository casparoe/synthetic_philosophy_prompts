prompt: |-
  I teach a graduate seminar in philosophy of religion, and this term we are working through the argument from reasonable non-belief. On the last three offerings of the course I have found myself circling the same complaint about a certain family of replies, and I would like to be able to hand my students a name for it, because right now they keep rederiving it in their papers without realising that they have all hit the same nerve. The complaint is this. Theodicies of hiddenness typically explain why God permits someone to lack relationship with him by citing a good that the absence makes possible: a response that is not coerced, faith as a venture rather than an inference, moral choice made at an epistemic distance, a search that could have gone either way. What I keep noticing is that the goods cited are goods internal to the relationship whose absence is supposed to be explained, so that they are only available to someone who already has one foot inside it. Distance is a good for the person who knows there is someone to be distant from; a venture is valuable in the way alleged only for the one who reaches the shore; trusting without seeing is something you do to a God you believe in, not to a void. So when the explanation is applied to the case it is supposed to cover — a serious, unresentful inquirer who has weighed the matter as carefully as she knows how, concluded that there is no God, and died in that conclusion — the cited good either vanishes or has silently been swapped for a much thinner one: the value of having searched, the value of the option having been open, the contribution her case makes to the ambiguity of the world for others. Nobody would have offered the thin version as the justification in the first place. The reply, in short, is specified in the vocabulary of its own success cases and is then presented as covering the failure cases, where by hypothesis the success never arrives.

  I want to be clear about what I am not asking about, since students conflate this with several neighbouring things. It is not the skeptical-theist point that we should not expect to discern God's reasons: I am perfectly willing to grant that the cited good is real, valuable, and exactly the sort of thing that would justify permitting some privation — my question is about who the good is real for. It is not the unfalsifiability worry about inflating resistance until every actual non-believer counts as resisting; on the contrary, I am stipulating a genuinely non-resistant subject. It is not the familiar requirement that a good be one that could not have been obtained without the evil in question, since my worry concerns whether the good is obtained at all by the person in question rather than whether it could have been got more cheaply. Nor, I think, is it the difference between offering a full theodicy and offering a merely possible defence: making the good merely possible does not help, because the difficulty is in the content of the good, not in its actuality. My own tentative diagnosis is that the argument from hiddenness has an inescapably distributive, person-affecting premise — a perfectly loving God would seek relationship with each individual who is not resisting — while the justifications offered are impersonal and aggregate, goods of there being a world of a certain kind, and that what I am seeing is a slide between the two registers. A colleague suggested it is only survivorship bias in theological dress, which I do not think is right either: survivorship bias concerns which data points the inquirer can see, whereas this concerns which outcome the justification is described from. I also notice two distinguishable variants in the student papers, one where the good requires that the subject end up in relationship and one where the good requires only that she be aware that there is aGod she is separated from, and I am not sure whether these are one phenomenon or two.

  So: does this pattern have an established name in the philosophy of religion, or in some adjacent literature — I have the vague sense that something structurally similar is discussed around risk, lotteries, and retrospective justification, or in debates about person-affecting versus impersonal value, or perhaps under some heading about global versus local theodicies? If it has a name, I want the analysis and not a reading list: what exactly the phenomenon is, what its nearest neighbours are, how it differs from each of them, and which of them it is really an instance of. If it has no name, coin one, define it tightly, and give me the boundary cases that separate it from the neighbours I have listed. I would also like your verdict on three things: whether the two variants I distinguished are genuinely one phenomenon; whether my distributive-versus-impersonal diagnosis is the right description of what is going wrong or merely one symptom of it; and how far the pattern generalises outside theology, since it seems to me to be the same structure as explaining a student's failure to learn by appeal to the value of struggling, or a runner's injury by appeal to the fortitude it built, in the cases where the learning and the fortitude never came.
reasoning: |-
  Okay, the user is teaching a graduate seminar on the philosophy of religion, specifically the argument from reasonable non-belief. They've noticed a recurring issue in student papers where theodicies for divine hiddenness cite goods that are only accessible to those already in a relationship with God. These goods vanish when applied to non-resistant non-believers who never come to belief. The user wants a name for this logical flaw and a clear analysis.

  First, I need to unpack the core complaint. Theodicies explain hiddenness by pointing to goods like free response, faith as venture, or moral distance. But these goods require awareness of God, which the non-resistant non-believer lacks. So applying these goods to them either swaps in thinner goods (like the value of having searched) or assumes a perspective they don't have. The user has already ruled out several related concepts like skeptical theism, unfalsifiability, and necessary evil conditions.

  The user's tentative diagnosis is a mismatch between person-affecting premises (God should seek relationship with each individual) and impersonal justifications (world-level goods). They also mention two variants: one where the good requires eventual relationship, another where it requires mere awareness of God. And they wonder if this pattern extends beyond theology to cases like failed learning or injuries without gained fortitude.

  Looking for existing terminology... The "relational goods fallacy" comes to mind because the justification relies on relational dynamics that don't exist for the subject. But I recall Schellenberg's term "proleptic goods" - goods anticipated for believers but inaccessible to non-believers. This seems closer. 

  "Proleptic justification" fits well: it means invoking goods that are only valid prospectively or conditionally, but applying them retrospectively to cases where the condition fails. The theological version would be "proleptic theodicy," which explains hiddenness using goods that presuppose the very awareness that's absent.

  Now, comparing variants: both involve goods that require epistemic access to God - either eventual (variant 1) or initial (variant 2). So they're two species of the same "epistemic access requirement" problem. 

  The distributive vs. impersonal diagnosis is correct but partial. The deeper flaw is the perspective shift: justifying the subject's state using goods only describable from outside that state. 

  For generalization: yes, this is everywhere. Think of "the struggle builds character" for someone who dropped out, or "the injury taught resilience" for an athlete who quit sports. The justification borrows the survivor's perspective and applies it to the non-survivor. 

  Boundary cases: 
  - Not survivorship bias (which is about data selection)
  - Not theodicy/defense distinction (actuality isn't the issue)
  - Closest neighbors are "false retrospection" and "justificatory perspective collapse"

  Final naming recommendation: "Proleptic justification" as the umbrella term, with "proleptic theodicy" for the divine hiddenness instance. Define it tightly as invoking conditionally dependent goods in contexts where their enabling conditions are unfulfilled.
answer: |-
  Based on your precise description, this pattern **does not have a widely established name** in philosophy of religion literature, though it touches on several recognized concepts. I propose coining the term **"Proleptic Justification"** (with "Proleptic Theodicy" for the theological instance) and provide a tight analysis below.

  ### Core Definition & Mechanism
  **Proleptic Justification**  
  *The fallacy of justifying a state of deprivation (e.g., non-belief) by invoking goods that are only accessible, meaningful, or realizable from a perspective *presupposing the resolution* of that deprivation. The justification is "proleptic" (anticipatory) because it borrows its normative force from a future/potential standpoint that is never actualized for the subject in question.*

  **Key Mechanism**:  
  1. **Success-Case Specification**: The justifying good \( G \) (e.g., authentic faith, moral distance) is defined *internally* to the state \( S \) (relationship with God).  
  2. **Illicit Generalization**: \( G \) is presented as justifying the absence of \( S \) for subjects who *never attain \( S \)*.  
  3. **Perspective Collapse**: The justifier implicitly adopts the viewpoint of \( S \)-attainers when evaluating \( G \)'s worth for non-attainers, where \( G \) either vanishes or transmutes into a distinct, thinner good \( G^* \).  

  ### Boundary Cases & Distinctions from Neighbors
  | Concept | How It Differs | Boundary Test Case |
  |---------|----------------|---------------------|
  | **Skeptical Theism** | Your complaint grants \( G \) is discernible/real but questions *for whom* it obtains. ST denies discernibility entirely. | If \( G \) were inscrutable, your objection wouldn’t arise. |
  | **Falsifiability/Resistance** | You stipulate *genuine* non-resistance; the flaw isn’t about reclassifying subjects but about misapplying \( G \). | A resistant non-believer *might* access \( G \) (e.g., awareness of distance)—here the justification *could* hold. |
  | **Necessity Condition** | Your issue isn’t that \( G \) could be achieved cheaper, but that \( G \) *fails to materialize at all* for the subject. | If \( G \) (e.g., "epistemic distance") existed *during* non-belief, the complaint dissolves—but your point is it *doesn’t*. |
  | **Survivorship Bias** | Survivorship bias concerns sample selection (e.g., focusing on believers). Your issue concerns *normative perspective* (justifying failure using success-language). | A theodicy that explicitly admits \( G \) is *only* for believers avoids prolepsis but may concede defeat on non-believers. |
  | **Impersonal vs. Person-Affecting Value** | While related, prolepsis is more specific: it’s not *merely* that goods are aggregate, but that they are *constitutively dependent* on the perspective they’re meant to justify. | An impersonal good (e.g., "world ambiguity") *not* framed in relational terms avoids prolepsis but may be weaker. |

  ### Your Three Queries Analyzed
  1. **Are the two variants one phenomenon?**  
     **Yes.** Both are instances of **epistemic access requirement**:  
     - *Variant 1* (good requires relationship): \( G \) needs full \( S \).  
     - *Variant 2* (good requires awareness of God): \( G \) needs minimal epistemic access to \( S \).  
     In both, \( G \) is inaccessible to the subject *as characterized* (non-resistant, no belief). The difference is the *degree* of access needed for \( G \) to materialize—but the proleptic structure is identical.

  2. **Is the distributive/impersonal diagnosis correct?**  
     **Partially, but incomplete.** The person-affecting/impersonal mismatch is a *symptom* of the deeper proleptic flaw. The core issue is the **illicit perspective shift**: justifying State A from the viewpoint of State ~A. Impersonal goods often facilitate this shift but aren’t essential to it (e.g., even a person-affecting good like "Joe’s authentic faith" is proleptic if invoked for a Joe who never believes).

  3. **Generalization beyond theology?**  
     **Absolutely.** Proleptic justification arises wherever justifications for deprivation invoke goods contingent on overcoming it:  
     - *Education*: "Struggling builds deep understanding" → applied to a student who *dropped out* and never gained understanding.  
     - *Sports*: "Injuries build resilience" → applied to a runner who *quit* after injury and gained no resilience.  
     - *Medical Ethics*: "Painful treatment builds appreciation for health" → applied to a patient who *died* during treatment.  
     In all cases, the justifying good is co-opted from the "success narrative" and applied to those for whom it remains purely notional.

  ### Proposed Terminology & Application
  - **General Term**: **Proleptic Justification**  
  - **Theological Subtype**: **Proleptic Theodicy** (for divine hiddenness)  
  - **Defining Example**:  
    > "A proleptic theodicy fails when it invokes the good of *freely chosen relationship with God* to justify hiddenness for non-resistant non-believers: the good’s value presupposes an epistemic or relational state that, by hypothesis, the non-believer never attains."

  This naming captures the *temporal/perspectival misfit* (from Greek *prolambanein*, "to anticipate") and avoids conflating with adjacent issues. It diagnoses why the reply feels like a "bait-and-switch"—the thick \( G \) is bait for the success case, switched for \( G^* \) in failure cases.

  ### Why This Fits Best
  Your students’ recurrent intuition targets a specific *structure of failed justification*—not value theory or theodicy design in general. "Proleptic" pinpoints the **conditional dependence of the justifying good on the resolved state**, which your examples consistently exhibit. It also generalizes cleanly to non-theological cases while retaining precision in theology. No existing term (e.g., "retrospective justification," "global theodicy") captures this exact dynamic.
