  We are drafting a document for an adversarial collaboration between two colleagues: one advocating for active inference/prediction-error-minimization (PP) and the other for enactive/ecological/dynamical-systems (EE) approaches. The document must include:

  1. A numbered section of agreed claims.
  2. A table of remaining disagreements, stated in both PP and EE terms.
  3. A crux table with concrete cases and predictions.

  We must address:
  - Distinguishing the free-energy principle (FEP), predictive processing (PP architecture), and predictive coding (PC circuits).
  - The dark-room objection and whether the reply is ad hoc.
  - The triviality worry: what would count as a system that doesn't minimize free energy? What if a non-neural system (e.g., convection cell) satisfies the formalism?
  - Update-rule instrumentalism: the formalism as just a compact way of writing update rules without requiring internal models.

  Housekeeping: No citations. Tag agreed claims by their status (uncontroversial, agreed by these two, contested). End with a single crux in ten words or fewer.

  ---

  **Adversarial Collaboration Document: Predictive Processing vs. Enactive Ecology**

  **Introduction**

  This document aims to clarify the agreements and disagreements between two frameworks for understanding cognition: the predictive processing (PP) framework (including active inference and prediction-error minimization) and the enactive/ecological (EE) framework (emphasizing coupled agent-environment dynamics and affordances). We distinguish three levels of description:

  1. **Free-Energy Principle (FEP)**: A very general claim that any self-organizing system at a non-equilibrium steady state must minimize an information-theoretic quantity (variational free energy) or something equivalent (like surprise or prediction error).
  2. **Predictive Processing (PP)**: An architectural proposal for how the brain (or parts of it) might implement FEP, typically involving hierarchical message passing of predictions and prediction errors.
  3. **Predictive Coding (PC)**: A specific circuit-level model within PP, detailing how cortical layers might compute and pass prediction errors and predictions.

  We note that disagreements often arise from focusing on different levels. This document attempts to fix the level of discussion explicitly.

  ---

  **Section 1: Agreed Claims**

  *Tagging key:*
  - **[U]**: Uncontroversial among researchers in the field (broad consensus).
  - **[A]**: Agreed by these two colleagues but not necessarily uncontroversial in the field.
  - **[C]**: Contested in the field, but these two happen to agree on this point (rare).

  1. **[U]** Biological systems, including brains, are thermodynamically open systems that maintain themselves in a non-equilibrium steady state by exchanging energy and matter with their environment. (This is a foundational assumption for both frameworks.)

  2. **[U]** Perception and action are deeply intertwined and cannot be fully understood in isolation from each other. (Both PP and EE reject strict perception-action pipelines.)

  3. **[A]** The "dark room" objection (that surprise minimization should lead to seeking predictable, uninformative states) is a valid challenge to naive formulations of surprise minimization. (Both agree it must be addressed.)

  4. **[A]** The standard PP reply to the dark room objection invokes the system's "prior preferences" (expected states with low surprise) and the fact that avoiding highly surprising states often requires actively seeking information to reduce uncertainty. (Both agree this is the standard reply, though they disagree on its adequacy.)

  5. **[U]** Neural systems exhibit hierarchical processing, with higher levels modulating lower levels. (This is empirically well-supported, though the interpretation of what is being processed is disputed.)

  6. **[U]** Experimental evidence shows that neural responses (e.g., in sensory cortex) can be modulated by expectations (e.g., in mismatch negativity, repetition suppression, or Bayesian cue combination tasks). (This is uncontroversial; the dispute is over interpretation.)

  7. **[C]** The FEP, as a mathematical formalism, can be applied to any system with a Markov blanket (a statistical boundary separating internal and external states). (Both agree this is mathematically possible, but disagree on its relevance.)

  8. **[A]** If a plainly non-neural system (e.g., a convection cell) were shown to satisfy the FEP formalism (i.e., it minimizes variational free energy), the PP proponent would conclude that the system is engaging in a form of inference (perhaps in a thin sense), while the EE proponent would conclude that this demonstrates the formalism is trivial or non-explanatory for cognition. (This is an agreement about how each would react, not about the truth.)

  9. **[A]** Update-rule instrumentalism (the view that the generative model and free-energy bound are just a compact way of writing the system's update rules, without implying internal models or representations) is a possible interpretation of the PP formalism. (Both agree that this is a possible interpretation, but they disagree on whether it is acceptable or trivializing.)

  ---

  **Section 2: Table of Remaining Disagreements**

  Each disagreement is stated twice: once in terms acceptable to the PP proponent, and once in terms acceptable to the EE proponent.

  | Disagreement | PP Wording (acceptable to PP) | EE Wording (acceptable to EE) |
  |--------------|-------------------------------|-------------------------------|
  | **Nature of internal processes** | Perception is inference over an internal generative model that predicts sensory inputs; action is the selective sampling of inputs to make these predictions come true, both minimizing prediction error. | Perception and action emerge from the coupled dynamics of the agent-environment system, guided by affordances; internal models and predictions are either not present or are epiphenomenal to the real explanatory dynamics. |
  | **Explanatory role of prediction error** | Prediction error minimization is the fundamental organizing principle of neural computation, explaining both perception and action. | Prediction error is a post-hoc description of neural activity patterns, not a driving force; the real work is done by the dynamics of sensorimotor loops. |
  | **Status of the FEP** | The FEP is a fundamental principle governing all adaptive systems at non-equilibrium steady state, and brains are a prime example. | The FEP is at best a redescription of system dynamics in information-theoretic terms; it does not explain cognition because it applies too broadly. |
  | **Dark-room reply adequacy** | The dark-room objection is resolved by noting that agents have prior preferences for states that require active engagement with the world (e.g., food, social interaction), making surprise minimization dynamic and world-engaging. | The appeal to prior preferences is ad hoc because it simply relabels the problem (why have those preferences?) and does not explain how preferences arise from the dynamics of the system. |
  | **Triviality of FEP** | A system that does not minimize free energy would violate the laws of physics (if it is at non-equilibrium steady state); thus, such systems are impossible. | A system that does not minimize free energy would be one that does not maintain its organization (e.g., a dissipating cloud of gas); but this does not imply that minimizing free energy explains cognition. |
  | **Update-rule instrumentalism** | Update-rule instrumentalism is acceptable as a minimal interpretation, but the internal model is a real causal structure in the brain (e.g., encoded in synaptic weights) and not just a mathematical fiction. | Update-rule instrumentalism reduces PP to a trivial claim: it becomes a descriptive tool, not a theory of cognition. The real explanation lies in the concrete agent-environment coupling. |

  ---

  **Section 3: Crux Table**

  For each crux, we state a concrete case or result that both agree would bear on the issue, and then each side's prediction.

  | Crux Issue | Concrete Case/Result | PP Prediction | EE Prediction |
  |------------|----------------------|---------------|---------------|
  | **Role of prediction error in driving neural activity** | In a sensory cortex recording during unexpected stimulus omission (e.g., auditory oddball), if neural activity (e.g., Mismatch Negativity) is abolished by blocking NMDA receptors (which are posited to carry prediction errors), this supports prediction error as a driving signal. | Blocking NMDA receptors will abolish or severely reduce mismatch negativity responses. | Blocking NMDA receptors may alter neural dynamics but the pattern of responses (e.g., to omissions) will still emerge from the network dynamics without requiring a prediction-error signal. |
  | **Necessity of internal models for adaptive behavior** | Train a neural network (e.g., a deep RL agent) on a complex task requiring adaptation to changing contingencies. Then, lesion the "model" part (e.g., remove the generative pathway in a predictive coding network) while preserving the reactive policy. | Performance will degrade severely because the system cannot generate predictions to guide action; it will react poorly to novel situations. | Performance may degrade initially but the system will adapt using the remaining dynamics (e.g., direct sensorimotor loops) and may recover most functionality. |
  | **Explanatory scope of FEP** | Construct a non-biological system (e.g., a robot) that maintains a non-equilibrium steady state without any explicit representation of a generative model or prediction-error minimization in its control algorithm. Apply FEP analysis to show it minimizes free energy. | The robot must be minimizing free energy (by the FEP theorem), so the analysis will show it does. The internal structure of the robot may implement an implicit generative model. | The FEP analysis will show the robot minimizes free energy, but this is trivial because the formalism is general. The robot's behavior is explained by its specific control algorithm and dynamics, not by FEP. |
  | **Dark-room prior preferences** | Raise an organism (e.g., a rodent) in a dark, featureless room with ad libitum food and water. Observe whether it seeks stimulation (e.g., exploration, light exposure) despite the increased surprise. | The rodent will seek stimulation (e.g., explore, interact with objects) because its prior preferences include engaging with the world. | The rodent may become lethargic and inactive, showing that without environmental affordances for engagement, surprise minimization leads to inactivity. (Note: EE predicts that prior preferences are not fixed but shaped by the environment and history.) |

  ---

  **Conclusion**

  The core disagreements center on the ontological status of internal models, the causal-explanatory role of prediction error, and the scope of the FEP. Update-rule instrumentalism offers a potential reconciliation by treating the PP formalism as a description of dynamics, but it is rejected by the PP proponent as too deflationary and by the EE proponent as trivializing.

  The single crux that both agree would most move the debate is:

  \answer{Whether prediction error drives neural dynamics or emerges from them.}
answer: |-
  ### Adversarial Collaboration Document: Predictive Processing vs. Enactive-Ecological Approaches  

  #### Introduction  
  This document synthesizes agreements and disagreements between two frameworks for understanding cognition:  
  - **Predictive Processing (PP)**: Perception involves Bayesian inference over an internal generative model; action minimizes prediction error by fulfilling expected sensory states. Both arise from minimizing variational free energy (a bound on surprise).  
  - **Enactive-Ecological (EE)**: Perception-action emerges from coupled agent-environment dynamics and affordances; internal models and predictions are either explanatorily redundant or incoherent.  

  Three scopes are distinguished to prevent conflation:  
  1. **Free-Energy Principle (FEP)**: A mathematical claim that any self-organizing system at non-equilibrium steady state minimizes a free-energy functional.  
  2. **Predictive Processing (PP architecture)**: A brain-wide theory where perception and action minimize prediction error via hierarchical message passing.  
  3. **Predictive Coding (PC circuits)**: A specific neural implementation (e.g., cortical layers passing predictions/errors).  

  Today’s focus is **PP architecture vs. EE critiques**, with FEP/PC addressed where relevant.  

  ---

  ### Section 1: Agreed Claims  
  *Tags:*  
  - **🔹U**: Uncontroversial among researchers (broad consensus).  
  - **🔹A**: Agreed by these colleagues but contested in the field.  
  - **🔹C**: Contested in the field, but these colleagues agree (rare).  

  1. **🔹U** Biological systems (including brains) are thermodynamically open, maintaining non-equilibrium steady states through environmental exchange. *[Confidence: High. Core to both frameworks.]*  
  2. **🔹U** Perception and action are inseparable; neither is a passive input/output process. *[Confidence: High. Empirical support from sensorimotor contingencies.]*  
  3. **🔹U** Neural systems process information hierarchically (e.g., sensory inputs modulated by top-down signals). *[Confidence: High. Well-established in neuroscience.]*  
  4. **🔹A** Experiments show expectation-driven neural modulation (e.g., mismatch negativity, repetition suppression). *[Confidence: Medium. Agreed empirically, but interpretation disputed.]*  
  5. **🔹A** FEP formalism applies to any system with a Markov blanket (statistical boundary between internal/external states). *[Confidence: Medium. Accepted mathematically, not ontologically.]*  
  6. **🔹C** The dark-room objection (surprise minimization should lead to inertness) challenges naive PP; the standard reply invokes “prior preferences” (expected states with low surprise) and expected uncertainty reduction. *[Confidence: Low. Both agree it’s the reply, not its adequacy.]*  
  7. **🔹A** If a non-neural system (e.g., convection cell) satisfies FEP:  
     - *PP view*: It “infers” its environment in a thin, formal sense.  
     - *EE view*: This demonstrates FEP’s triviality for cognitive explanation.  
     *[Confidence: Medium. Agreed as a hypothetical reaction.]*  
  8. **🔹A** Update-rule instrumentalism (FEP as compact description of system dynamics, without requiring internal models) is a coherent interpretation. *[Confidence: Low. Accepted as possible, not compelling.]*  

  ---

  ### Section 2: Table of Remaining Disagreements  
  *Each row states one disagreement in both frameworks’ preferred terms.*  

  | Issue | PP-Acceptable Wording | EE-Acceptable Wording |  
  |-------|------------------------|------------------------|  
  | **Core mechanism** | Perception is inference via internal generative models; action minimizes prediction error to fulfill sensory predictions. | Perception-action is direct coupling to affordances; no internal models or error signals are needed for explanation. |  
  | **FEP’s scope** | FEP is a universal principle for adaptive systems; brains exemplify it richly via hierarchical PP. | FEP is a domain-general statistical tool; it fails to explain cognition, which requires agent-environment dynamics. |  
  | **Dark-room reply adequacy** | Prior preferences resolve the objection: agents act to fulfill expected states (e.g., food, exploration), making surprise minimization active. | The reply is ad hoc: “priors” are just redescriptions of behavior, not derived from first principles. |  
  | **Triviality of FEP** | A system violating FEP would disintegrate (e.g., losing Markov blanket integrity); thus, FEP is non-trivial. | FEP is trivial: any steady-state system satisfies it tautologically; cognition requires more (e.g., adaptive coupling). |  
  | **Update-rule instrumentalism** | This view is unfalsifiable: it strips PP of empirical content (e.g., neural implementations of predictions). | This view is trivial: it reduces PP to a math trick, ignoring dynamical explanations. |  
  | **Explanatory role of predictions** | Predictions and errors are causal constructs in neural computation (e.g., driving synaptic updates). | “Predictions” are post hoc labels for dynamics; they add no explanatory power over coupled oscillators. |  

  ---

  ### Section 3: Crux Table  
  *Each crux includes a testable case both agree is relevant, and pre-commit predictions.*  

  | Crux | Concrete Test Case | PP Prediction | EE Prediction |  
  |------|--------------------|---------------|---------------|  
  | **Do prediction errors drive action?** | *Case*: Rodent in a novel maze with high uncertainty. Measure neural activity (e.g., prefrontal cortex) during exploration. | Prediction errors increase during uncertainty, driving information-seeking action (e.g., exploration). | Action is guided by affordances (e.g., open paths); neural activity reflects dynamics, not error signals. |  
  | **Are internal models necessary?** | *Case*: Train an AI agent on object manipulation. Ablate “generative model” components (e.g., prediction layers) but preserve reactive policies. | Performance collapses in novel scenarios; agents cannot generalize without generative models. | Performance degrades minimally; reactive policies adapt via environmental coupling. |  
  | **Is FEP explanatory for cognition?** | *Case*: Show convection cells “minimize free energy” via FEP analysis. Test behavioral equivalence to cognitive agents. | Convection cells exhibit inference-like dynamics (e.g., “predicting” heat flow), validating FEP’s breadth. | Convection cells satisfy FEP formally but lack cognition; this proves FEP is insufficient for explanation. |  
  | **Dark-room priors: ad hoc or fundamental?** | *Case*: Raise Drosophila in featureless environments with ample resources. Observe if they seek stimulation despite no evolutionary pressure. | Flies explore novelty due to innate priors for information gain. | Flies remain inert; “priors” emerge from environmental richness, not internal drives. |  
  | **Update-rule instrumentalism: relocation or resolution?** | *Case*: Model a non-representational system (e.g., chemical oscillator) with FEP mathematics. | The system approximates inference, revealing implicit generative structure. | The math redescribes dynamics; the debate shifts to “what counts as representation.” |  

  ---

  ### Conclusion  
  Update-rule instrumentalism is rejected as a resolution:  
  - **PP advocate**: It relocates the fight (to neural implementation), rendering PP unfalsifiable.  
  - **EE advocate**: It relocates the fight (to dynamical explanations), conceding triviality.  

  The debate remains at the architecture level (PP), with FEP’s scope and the ontological status of internal models as flashpoints.  

  \answer{Whether prediction errors drive or describe neural activity.}
