  Based on your verdicts, I'll construct a precise, implementable principle that captures your choices. Your pattern suggests **context-dependent aggregation** as the core idea, with switches between modes based on how outcomes are experienced and whether risks are shared. The principle has four clauses, each tied to specific cases you provided. I'll state the principle first, then derive it from your cases, show how it handles each one, note any tradeoffs, and address scaling/extensions.

  ### Principle: Aggregated Outcome Evaluation (AOE)
  1. **If outcomes are aggregated across simultaneous, independent instances for a single decision-maker** (e.g., all risks resolved at once and summed), evaluate by **expected utility (EU)** with a concave utility function.  
  2. **If outcomes are isolated to a single event for a single decision-maker with known probabilities**, evaluate using **cumulative prospect theory (CPT)** with:  
     - A concave power utility for gains: \( u(x) = x^\alpha \) (\( \alpha \approx 0.8 \))  
     - A convex power utility for losses: \( u(x) = -\lambda \cdot (-x)^\beta \) (\( \lambda \approx 1.8, \beta \approx 0.7 \))  
     - Probability weighting: \( w(p) = \frac{p^\gamma}{(p^\gamma + (1-p)^\gamma)^{1/\gamma}} \) for gains (\( \gamma \approx 0.6 \)), and \( w^-(p) = \frac{p^\delta}{(p^\delta + (1-p)^\delta)^{1/\delta}} \) for losses (\( \delta \approx 0.7 \)).  
  3. **If probabilities are ambiguous**, apply **max-min EU** over possible distributions.  
  4. **For outcomes affecting others**:  
     - **Under veil of ignorance**, use Clause 1 (aggregated EU).  
     - **For an identified person**, use Clause 2 (CPT with social disutility for catastrophic losses).  

  **Switch logic**: The choice between Clause 1 and 2 depends on whether outcomes are *materially aggregated* (summed/totaled) for the decider. Ambiguity (Clause 3) and social context (Clause 4) override as specified.

  ---

  ### Derivation from Your Cases
  Your verdicts violate independence in both gains and losses, but the *direction* and *strength* depend on context. The key drivers are:
  - **Aggregation eliminates certainty effects** (Cases 5–7): When 10,000 copies are split or 200 are decided simultaneously, risks diversify. You default to EU (Clause 1).  
  - **Isolation amplifies probability weighting** (Cases 1–4, 9): For single unshared outcomes, you overweight small probabilities of extreme gains/losses (CPT in Clause 2).  
  - **Ambiguity intensifies risk aversion** (Case 8): Unknown probabilities trigger worst-case thinking (Clause 3).  
  - **Social identity matters** (Case 10): A veil of ignorance triggers aggregation (Clause 4a); identified strangers trigger isolated CPT with extra penalty for catastrophe (Clause 4b).  

  Your tentative principle ("independence fails for single unshared outcomes resolved soon") is refined by defining "aggregation" formally and adding context switches.

  ---

  ### Verdict-by-Verdict Application
  1. **Allais pair (no aggregation)**: Clause 2 (CPT) → \( u(\text{\$1M}) > w(0.89)u(\text{\$1M}) + w(0.10)u(\text{\$5M}) + w(0.01)u(\$0) \). Weighting \( w(0.01) > 0.01 \) makes the 1% loss salient. Reduced form (11% vs 10%) uses same weights → 10% of \$5M chosen.  
  2. **\$3,000 vs \$4,000**: Same CPT logic, but weaker violation because \( \frac{u(\text{\$4,000})}{u(\text{\$3,000})} \approx 1.2 \) (concave power util) and \( \frac{w(0.25)}{w(0.20)} \approx 1.15 \) → less advantage to certainty.  
  3. **1% chance of \$5M vs \$0**: For gain (1% \$5M), overweighting dominates → gamble. For loss (1% \$0), \( w(0.99) \approx 0.995 \) (slight underweighting) → near-indifference. Concave utility explains why you pay only \$2,000 to avoid risk.  
  4. **Dominance (90% \$1M / 10% \$5M)**: Handled by CPT's cumulative ranking (automatic stochastic dominance).  
  5. **10,000 copies**: Clause 1 (aggregated EU) → risky option. Law of large numbers → near-certain \$1.39M per person.  
  6. **200 copies**:  
     - Simultaneous: Clause 1 (aggregated) → risky option.  
     - Sequential: Clause 2 (each isolated) → sure thing. The switch is keyed to *outcome aggregation*, not timing. You can't aggregate future uncommitted choices.  
  7. **Delayed resolution**: Still Clause 2 (no aggregation) → sure thing. CPT depends on outcome distribution, not resolution timing.  
  8. **Ambiguous urn**: Clause 3 (max-min) → minimize over \( p \in [0.05, 0.15] \). Worst case (\( p=0.05 \)) reduces value of risky option → reinforces sure thing.  
  9. **Losses**: Clause 2 (CPT for losses). Convex loss utility \( \beta < 1 \) and loss aversion \( \lambda > 1 \) → risk-seeking for losses. Mirror-image violation holds.  
  10. **Lives saved**:  
      - Veil of ignorance: Clause 4a → aggregated EU → risky option (higher EV).  
      - Identified stranger: Clause 4b → isolated CPT + social disutility for 0 deaths. \( w(0.01) \) overweighted, and \( u(\text{0 saved}) \) penalized → sure thing.  

  ---

  ### Tradeoffs and Edge Cases
  - **Kept all verdicts** except one nuance: In Case 2, CPT *formally* violates independence, but your weaker feeling isn't quantified. The principle reproduces your choices.  
  - **Scaling stakes by 1,000**: For isolated gains (Clause 2), concave utility \( \alpha \approx 0.8 \) amplifies risk aversion (e.g., \$1B sure vs gamble feels stronger than Case 1). Losses become more risk-seeking.  
  - **Probabilities to 0.001 vs 0.0009**: Clause 2’s weighting \( w(p) \) plateaus near 0 → both treated as "possible but negligible," converging to EU.  
  - **Memory-wiped future self**: Clause 2 (isolated outcome) → same as current self. But if the wipe severs identity, you might treat it as "other" (Clause 4b).  
  - **200-mornings prediction**: CPT (Clause 2) predicts taking the sure thing each day, matching your verdict. Prospect theory doesn't silently skip this—it directly implies your choice.  

  ---

  ### Why Not Simpler?
  - **EU fails**: Violates Cases 1, 2, 3, 6, 9, 10.  
