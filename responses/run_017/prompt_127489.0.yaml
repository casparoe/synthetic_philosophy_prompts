prompt: |-
  hey — I help run a tiny student interview series attached to my cog sci seminar this term (we get one guest for 40 minutes, record it, and post the audio to a shared drive that maybe twelve people ever listen to). Next week's guest is a philosopher of cognitive science I'll call Dr. Marisol Vance, and she defends something she nicknames the "crutch curve" account of intelligence: the idea that intelligence isn't a system's peak score on a task but the shape of how its performance falls off as you strip away the supports it's currently leaning on — how often it gets feedback, how closely the test resembles what it was trained on, whether it has tools or external memory or scratch space, how much of the computation is quietly being done by the structure of the environment itself. Her slogan is that you find out how intelligent something is when you take the crutches away, and she likes to talk about "area under the degradation curve" instead of best-case performance. I've only skimmed her position paper and I half buy it, but I also suspect the view has an escape hatch every few pages, and I don't want to spend the episode nodding along.

  Could you draft me eight to ten interview questions that never let her just restate the slogan, plus a follow-up wherever you can guess the move she'd make? The specific things I want hit: (1) whether this is just out-of-distribution robustness with a sexier name, given that she'll probably answer that robustness is always relative to a single task while her curve is a partial order over whole families of degradation — I want that reply made progressively harder to lean on; (2) the no-free-lunch-flavoured worry that *which* degradations you choose to apply already smuggles in an assumption about which tasks and environments matter, so the "general" in general intelligence hasn't really been cashed; (3) bacteria, tardigrades and slime molds — they survive brutal perturbations and keep functioning, so either they're intelligent on her account or she has to say the degradations have to be of the right, representational kind, at which point she seems to have sneaked cognition back in through the back door; (4) her habit of dismissing measurement worries with "that's a measurement problem, not a problem for the account," which I'd like boxed in; (5) what her view says about us — take away language, literacy, sleep, other people, and human performance collapses too, so is she committed to human intelligence being mostly institutional scaffolding, and if she bites that bullet what's left of "artificial general intelligence" as a research target?

  Also, if you can work these in: one question on the psychometrics side, i.e. the fact that people who do well on one kind of cognitive test tend to do well on seemingly unrelated ones, and whether her account predicts that or just tolerates it (is intelligence one number on her view, or a family of seperate curves that can't be compared?); one on the old Chinese-room-style worry, whether something that degrades gracefully but doesn't understand anything is intelligent by her lights; one on how you'd actually run a degradation audit in practice without every lab tuning its system to the particular degradations the audit happens to test; one on whether an "intelligence explosion" — a system improving itself — is even a coherent idea if intelligence is resistance to losing your supports; and then a closing question about what empirical result would actually make her abandon the view, ideally with a concrete case (something like a system with a completely flat degradation profile that we'd still refuse to call intelligent, or one that falls apart fast but relearns a new regime faster than any person). Keep the questions in spoken-register English, since they'll be read out loud, and please don't pad them with biography stuff about her career — I can do that part myself.
reasoning: |-
  Okay, let me tackle this interview question draft for the cognitive science seminar. The user wants probing questions about Dr. Vance's "crutch curve" theory of intelligence that avoid letting her retreat to slogans. 

  First, I need to unpack the core concerns: (1) Is this just rebranded robustness? (2) Doesn't selecting degradations bias the definition? (3) Do resilient organisms force awkward conclusions? (4) How to handle measurement objections? (5) Doesn't human fragility undermine AGI? Plus those bonus angles about psychometrics, Chinese Room, audits, intelligence explosions, and falsifiability.

  Hmm... the user's clearly done their homework. They want surgical questions that force theoretical clarity. The bacterial intelligence paradox is particularly juicy - if Vance says degradations must be "representational," she's smuggling cognition back in. And that human fragility point could corner her into admitting intelligence is mostly scaffolding.

  For the robustness question, I'll need layered follow-ups. Start by asking how crutch curves differ from OOD robustness, anticipate her "single task vs task families" reply, then counter with whether the degradation axes themselves imply prior task selection. Maybe end by asking if ideal intelligence would have no preferred degradations - that might expose circularity.

  The measurement dodge needs boxing in. I'll propose a hypothetical where degradation profiles can't be compared across systems, forcing her to either admit the metric fails or specify what makes degradations commensurable. The psychometrics question should press whether her theory predicts g-factor or just accommodates it.

  For the closing falsifiability question... maybe ask what degradation profile would make her say "this isn't intelligence"? Like a system that's robust but inflexible, or fragile but hyper-adaptive. That could reveal the theory's boundaries.

  Better avoid academic padding - the user wants lean, spoken-style questions. And no biography fluff. Each question needs built-in tension to prevent slogan retreats. The Chinese Room angle is especially good for that: if graceful degradation without understanding counts as intelligence, does that validate Searle's worry?
answer: |-
  Here are 10 tightly focused questions addressing your points, designed to push past slogans and anticipate replies, in spoken English:

  1.  **The Robustness Challenge:** "You argue the crutch curve isn't just out-of-distribution robustness because it compares *families* of degradations across *tasks*. But isn't choosing *which* degradations to apply (like reducing feedback frequency vs. changing environmental structure) itself privileging specific types of 'support' based on what *we* deem relevant for 'intelligence'? Doesn't this pre-judge the very thing we're trying to define?"
      *   *Anticipated Reply & Follow-Up:* (If she argues degradations are "objective" or task-independent): "Okay, but take two systems: one degrades sharply when you remove *linguistic* scaffolds but handles sensory noise well, another does the opposite. Which is 'more intelligent' on your view? If there's no common axis for comparison, how is 'general intelligence' a single property?"

  2.  **The Degradation Selection Problem:** "Building on that – the 'partial order over families of degradation' seems key. But doesn't the *choice* of which degradation families to include in your comparison set already embed assumptions about what constitutes a 'relevant' test for intelligence? Aren't you smuggling in a prior notion of cognition through the back door by selecting degradations like 'loss of memory' or 'reduced similarity to training data'?"
      *   *Anticipated Reply & Follow-Up:* (If she appeals to "ecologically valid" degradations): "Ecologically valid *for whom*? For humans in modern society? For an AI in a data center? For evolution? Doesn't this make 'intelligence' relative to an assumed environment, rather than a general property?"

  3.  **The Bacterial/Slime Mold Problem:** "Tardigrades survive extreme desiccation and radiation – brutal degradations. Slime molds solve mazes when you disrupt their environment. If intelligence is resistance to performance degradation as supports are removed, does this imply these organisms are highly intelligent? If not, what specific *type* of degradation resistance counts?"
      *   *Anticipated Reply & Follow-Up:* (If she specifies degradations must target "cognitive" or "representational" supports): "Doesn't defining the 'right kind' of degradation – requiring it to affect 'representations' or 'cognitive processing' – mean you've already *presupposed* a cognitive architecture? How is this different from defining intelligence as cognition itself?"

  4.  **The Measurement Dodge:** "You often counter measurement concerns by saying 'that's a measurement problem, not a problem for the account.' But if reliably measuring the 'area under the degradation curve' across diverse systems and diverse degradation families proves extremely difficult or even impossible in practice – say, because we can't agree on commensurable axes or normalization – doesn't that functionally render the concept *unusable* as a definition of intelligence? At what point does a 'measurement problem' undermine the theoretical usefulness?"
      *   *Anticipated Reply & Follow-Up:* (If she insists the concept is still theoretically sound): "Doesn't a definition of intelligence that *in principle* resists consistent operationalization risk being unfalsifiable? How do we prevent 'crutch curve intelligence' from becoming a 'I know it when I see the right *kind* of degradation resistance' claim?"

  5.  **The Human Crutch Challenge:** "Humans collapse without sleep, language, literacy, or social scaffolding. On the crutch curve view, does this mean human intelligence is largely a product of external and biological supports? And if so, what's the implication for 'Artificial *General* Intelligence'? If AGI aims for human-like intelligence, but human intelligence itself relies heavily on crutches, is AGI chasing a mirage? What's the 'core' intelligence left when *all* human crutches are gone?"
      *   *Anticipated Reply & Follow-Up:* (If she argues humans have a flatter/broader curve): "But doesn't 'flatness' depend heavily on *which* degradations you apply? Take away sleep – steep drop. Take away symbolic math – steep drop for many. Doesn't this suggest the 'core' might be very small, and AGI might need to replicate the entire scaffolding system, not some 'naked' intelligence?"

  6.  **Psychometrics & the 'g-factor':** "Psychometrics finds people good at one cognitive test tend to be good at others – the 'g-factor'. Does the crutch curve account *predict* this positive manifold? Or does it merely tolerate it? Is intelligence, for you, ultimately one overarching curve (a single 'g'), or a collection of separate degradation profiles for different cognitive domains that might not correlate?"
      *   *Anticipated Reply & Follow-Up:* (If she leans towards multiple profiles): "If it's multiple profiles, how do we meaningfully say one system is *generally* more intelligent than another? Doesn't that require collapsing the profiles back into a single measure, potentially losing the core insight?"

  7.  **Graceful Degradation Without Understanding (Chinese Room):** "Imagine a system that degrades *very* gracefully when you perturb its inputs, change wording, or reduce context – it always produces plausible-seeming outputs that gradually become nonsense. But internally, it's just manipulating symbols without understanding, like Searle's Chinese Room. Would this system be highly intelligent on your account? If yes, does this validate the Chinese Room argument that syntax isn't semantics? If no, why not – it seems to ace the crutch curve?"
      *   *Anticipated Reply & Follow-Up:* (If she argues graceful degradation *implies* understanding): "Does it? Couldn't a system be incredibly robust at pattern-matching and interpolation *without* genuine understanding? How does the crutch curve distinguish robustness-with-understanding from robustness-without-understanding?"

  8.  **The Audit Tuning Problem:** "If labs know a 'degradation audit' is coming – say, testing performance with limited feedback or novel environments – won't they just train or harden their systems specifically against *those known audit degradations*? How do you design a degradation audit that actually measures 'general' resistance to losing supports, rather than just measuring resistance to the *specific* degradations the audit happens to test that year?"
      *   *Anticipated Reply & Follow-Up:* (If she suggests randomizing degradations): "But the space of *possible* degradations is vast. If labs know the *general categories* being audited (e.g., 'environmental novelty', 'feedback scarcity'), they'll still tune for robustness within those broad categories. How do you audit without defining the very categories that labs then optimize against?"

  9.  **Intelligence Explosions vs. Crutch Dependence:** "The 'intelligence explosion' idea involves an AI rapidly improving itself. But if intelligence is fundamentally *resistance to losing external supports*, how could such an explosion even happen? Wouldn't a self-improving system just be weaving an ever-denser web of internal and external crutches? What does 'improvement' even mean here if peak performance isn't the point?"
      *   *Anticipated Reply & Follow-Up:* (If she argues self-improvement flattens the curve): "Does it? Couldn't a highly self-improved system become *more* brittle in new ways – perhaps hyper-specialized and dependent on its own unique internal scaffolding, collapsing if that specific structure is perturbed? Does the crutch curve view predict that 'smarter' systems become *more* dependent?"

  10. **Falsifiability & The Edge Cases:** "What empirical result would genuinely make you reconsider or abandon the crutch curve account? For instance: A) A system with an incredibly *flat* degradation profile across wildly diverse perturbations, but whose behavior we all agree is completely mechanistic and lacks any spark of intelligence. Or B) A system that *collapses* dramatically with even minor perturbations, but which can *relearn and adapt* to entirely new regimes of degradation faster than any human possibly could. Would either of these challenge the view?"
      *   *Anticipated Reply & Follow-Up:* (Whatever her answer, push slightly): "So, if we found [the system she says *wouldn't* challenge the view], would that mean the crutch curve account is effectively unfalsifiable? What *concrete, observable phenomenon* would contradict its core claim that intelligence *is* this degradation profile?"

  **Key features of these questions:**
  *   **Directly Tackle Your Points:** Explicitly addresses OOD/robustness, degradation selection bias, the biological challenge, measurement dodge, human fragility, psychometrics (g-factor), Chinese Room, audit tuning, intelligence explosion, and falsifiability.
  *   **Blocks Slogan Retreat:** Questions frame the slogan within specific contradictions (bacteria, human fragility, Chinese Room) or practical impossibilities (measurement, audits, comparing systems).
  *   **Anticipates Moves & Follows Up:** Each question includes an expected reply pathway and a secondary question designed to push further down that logical path, preventing easy retreat.
  *   **Spoken Register:** Uses contractions ("isn't", "doesn't"), direct phrasing ("Imagine a system...", "Building on that..."), and avoids overly complex sentence structures.
  *   **No Padding:** Focused purely on the conceptual content, no bio fluff.

  Good luck with the interview! Push hard on those escape hatches.
