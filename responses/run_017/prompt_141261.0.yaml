  First, I need to unpack why "when in Rome" feels contradictory here. In the tipping case, it pressured them to exceed their home norm (10% → 20%), but in jaywalking, it pressured them to drop below (waiting → crossing). The user suspects the core tension is about whether conventions apply to short-term visitors—the "two-week problem." Their taxonomy (pure coordination/transfer/deference conventions) and stress tests (invisible tourist/bad Rome) are smart tools to dissect this.  

  Breaking it down:  
  - **Pure coordination** (e.g., driving side): Equilibrium stability matters, but a tourist's defiance won't collapse it.  
  - **Transfer conventions** (e.g., tipping): Here, non-compliance might directly harm individuals (e.g., underpaid staff), not just the system.  
  - **Deference conventions** (e.g., queueing): Symbolic value dominates; defiance could signal disrespect even if invisible.  

  The user also flags two subtle readings: *doing as Romans do for their reasons* vs. *meeting Roman expectations*. These likely split in the tipping case—if the reason is wage subsidy, 20% is owed; if expectation is baseline compliance, maybe less.  

  For the response, I'll structure:  
  1. **Six precise readings** of "when in Rome," each with:  
     - Definition  
     - Verdict (trivial/defensible/incoherent)  
     - Implications for tipping/jaywalking cases  
     - Visitor relevance  
     - Compatibility with convention types and stress tests  
  2. **Analysis** of which reading justifies the friend's usage and which is most common but weakest.  

  Key insights:  
  - The friend probably inconsistently invoked **Expectation Compliance** (reading 4) or **Deference Signaling** (reading 3), cherry-picking for desired outcomes.  
  - **Harm Avoidance** (reading 5) is the most defensible but doesn't cover arbitrary norms (e.g., jaywalking).  
  - The weakest common reading is **Literal Imitation** (reading 1)—collapsing into absurdity under stress tests.  

  On the two-week problem: Only **Harm Avoidance** and **Deference Signaling** give tourists strong reasons (direct impact/social friction). Equilibrium stability *doesn't* apply to short stays, validating the user's suspicion.  

  Final note: The "bad Rome" stress test exposes relativism in most readings—except **Harm Avoidance**, which would reject harmful norms. That's where the ethics get meaty.
answer: |-
  Here are six precise readings of "when in Rome," analyzed as requested. Each is tested against your cases (tipping/jaywalking), convention taxonomy (Pure Coordination/Transfer/Deference), stress tests (Invisible Tourist/Bad Rome), and visitor applicability.

  ### 1. **Literal Behavioral Imitation**  
  *Claim:* Perform the physical actions Romans perform in context X, regardless of reason or consequence.  
  - **Verdict:** Trivial (descriptive) but incoherent as a norm (why imitate arbitrarily?).  
  - **Tipping:** Do 20% because Romans do.  
  - **Jaywalking:** Cross against signal because Romans do.  
  - **Visitor?:** Yes, but no normative force.  
  - **Convention Types:** All (purely behavioral).  
  - **Invisible Tourist:** No reason (no impact).  
  - **Bad Rome:** Requires compliance (collapses into relativism).  

  ### 2. **Equilibrium Maintenance**  
  *Claim:* Comply to preserve a coordination equilibrium that benefits all participants.  
  - **Verdict:** Substantive/defensible for locals, false for short-term visitors.  
  - **Tipping:** No obligation (your 2-week defection doesn’t destabilize wage system).  
  - **Jaywalking:** No obligation (your compliance doesn’t sustain traffic flow norms).  
  - **Visitor?:** No (fails "two-week problem" – tourists lack causal impact).  
  - **Convention Types:** Only Pure Coordination (e.g., driving side; Transfer/Deference lack equilibrium dynamics).  
  - **Invisible Tourist:** No reason.  
  - **Bad Rome:** No obligation (if equilibrium is harmful, preserving it is indefensible).  

  ### 3. **Deference Signaling**  
  *Claim:* Conform to express respect for local authority/norms, avoiding social friction.  
  - **Verdict:** Substantive/defensible.  
  - **Tipping:** Owe 20% (underpayment signals disrespect; Romans expect it as wage subsidy).  
  - **Jaywalking:** Cross against signal (waiting signals aloofness; Romans expect pragmatic adaptation).  
  - **Visitor?:** Yes (signaling matters more for visitors).  
  - **Convention Types:** Primarily Deference; weak for Transfer (if framed as respect); irrelevant for Pure Coordination.  
  - **Invisible Tourist:** No reason (no observers, no signaling).  
  - **Bad Rome:** Defers (collapses into relativism unless harm overrides deference).  

  ### 4. **Expectation Compliance**  
  *Claim:* Fulfill what locals *expect of you* (which may differ from what they do/why).  
  - **Verdict:** Substantive/defensible but context-dependent.  
  - **Tipping:** Owe 20% (US servers expect this from all customers).  
  - **Jaywalking:** Cross against signal (locals expect assimilation, not "foreign" rule-following).  
  - **Visitor?:** Yes (expectations target visitors distinctly).  
  - **Convention Types:** All (expectations can attach to any type).  
  - **Invisible Tourist:** No reason (no expectations apply).  
  - **Bad Rome:** Complies (relativism unless expectations are immoral).  

  ### 5. **Harm Avoidance**  
  *Claim:* Comply to prevent direct harm to individuals from non-compliance.  
  - **Verdict:** Substantive/defensible.  
  - **Tipping:** Owe 20% (under-tipping directly harms server’s livelihood).  
  - **Jaywalking:** No obligation (your waiting harms no one; Romans aren’t inconvenienced).  
  - **Visitor?:** Yes (harm is visitor-agnostic).  
  - **Convention Types:** Transfer (direct harm); irrelevant for Pure Coordination/Deference (no harm).  
  - **Invisible Tourist:** Obligation only if harm occurs (e.g., underpaying staff anonymously).  
  - **Bad Rome:** Rejects compliance if harm outweighs benefit (e.g., sustains exploitative wages).  

  ### 6. **Functional Reason Adoption**  
  *Claim:* Adopt the Romans’ *reasons* for acting, not just the action.  
  - **Verdict:** Substantive/defensible but narrow.  
  - **Tipping:** Owe 20% *if* you accept the wage-subsidy function. Owe 0% if you reject it.  
  - **Jaywalking:** Cross only if you share Romans’ efficiency rationale; wait if you prioritize rule-following.  
  - **Visitor?:** Yes (reasons apply universally).  
  - **Convention Types:** Transfer (functional reasons); Deference (if reason is symbolic); irrelevant for Pure Coordination (reasons are arbitrary).  
  - **Invisible Tourist:** Reason persists, but no obligation if no impact.  
  - **Bad Rome:** Rejects compliance if reasons are bad (e.g., "efficiency" over safety).  

  ---

  ### Which reading justifies your friend’s usage?  
  Your friend likely inconsistently invoked **Reading 4 (Expectation Compliance)**. For tipping, they emphasized Romans’ *expectation* of 20% from all patrons. For jaywalking, they emphasized Romans’ *expectation* that visitors assimilate to local pragmatism. This reading flexibly pushes you above/below home norms because expectations are socially constructed and context-specific—allowing your friend to cherry-pick based on desired outcome.  

  ### Most common and weakest reading?  
  **Reading 1 (Literal Imitation)** is the most commonly implied version (often unreflectively). It’s the weakest: trivial as description, normatively hollow, fails both stress tests spectacularly, and ignores the "two-week problem" entirely. It’s a conversation-ender precisely because it’s immune to critique—but only by being empty. Your friend’s usage was more nuanced (leaning on Reading 4), but still weaponized the slogan’s ambiguity.
