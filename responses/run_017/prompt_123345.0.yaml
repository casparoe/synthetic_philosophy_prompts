  The core tension is between intrinsic properties (like shape invariants) and contrastive relationships (how letters distinguish themselves within a typeface system). This seems fundamental—it affects experimental design, generative model training, and theoretical frameworks. Starting here makes sense because it's logically prior and addresses the funder's main question about what defines 'a'-ness.

