answer: |-
  Here is a disambiguation menu for "history is written by the victors," structured per your request. Each reading is numbered, categorized, defined, assessed for licensing your argument/relativism charge, and evaluated for self-defeat and asymmetry. Verdicts reflect mainstream historiography/philosophy of history consensus *where it exists*, with contested areas flagged.

  **Reading 1: Evidential Monopoly (i)**
  *   **Precise Claim:** The dominant group in the aftermath of conflict (military/political victors) possesses disproportionate power to create, preserve, and destroy primary source evidence, shaping the foundational archive available to historians.
  *   **Classification:** Defensible empirical claim (often true, but not universal).
  *   **"Victors" Defined:** The group achieving decisive military/political control *in the immediate aftermath*.
  *   **Licenses Your Argument?** Yes. Explains the heavily Spanish documentary base for the Conquest, necessitating critical source analysis and skepticism towards the "received narrative" as potentially incomplete/biased. Does *not* imply no facts existed.
  *   **Licenses Relativism Charge?** No. Assumes facts existed; focuses only on the *access* to evidence about them. Historians can work critically within this constraint.
  *   **Self-Defeating?** No. Recognizing evidential bias requires the *epistemological possibility* of alternative evidence/perspectives, even if practically inaccessible. Critique relies on internal inconsistency, comparison with surviving fragments, or later archaeological/anthropological data.
  *   **Asymmetry Addressed:** Primarily explains *absence* of loser perspectives (what wasn't recorded/destroyed), though also shapes the dominant *presence* of victor evidence. Explains *why* the Mexica voice is scarce, making the phrase less likely to be used *against* a scarce record itself.

  **Reading 2: Narrative Hegemony (ii)**
  *   **Precise Claim:** The dominant group in a society over the *long term* (often descendants/ideological heirs of victors, but sometimes adapted losers) possesses disproportionate power to fund, disseminate, institutionalize (schools, monuments), and popularize specific historical narratives that serve their interests or worldview.
  *   **Classification:** Defensible empirical claim (common, but not inevitable; loser narratives can achieve hegemony, e.g., "Lost Cause" myth post-US Civil War).
  *   **"Victors" Defined:** The group holding long-term socio-political-cultural dominance *during the period the narrative becomes entrenched* (may shift from initial victors).
  *   **Licenses Your Argument?** Partially/Indirectly. Explains *why* the Spanish narrative *became* the "received" one in Europe/West. However, your point was about the *source base*, not later circulation. This reading better explains your interlocutor's Civil War counterexample (losers dominated narrative *circulation* for decades).
  *   **Licenses Relativism Charge?** No. Concerns the *social acceptance and dominance* of a narrative, not its inherent truth-value. Competing narratives (loser, academic revisionist) can exist but lack reach.
  *   **Self-Defeating?** No. Critique identifies competing narratives (academic, marginalized groups), challenges internal consistency, or uses newly available evidence to challenge the hegemonic story.
  *   **Asymmetry Addressed:** Explains why the phrase targets *dominant, flattering* narratives. It's a tool to challenge their authority by revealing their power-based origins. Less relevant to *absent* perspectives (covered by Reading 1).

  **Reading 3: Ontological Constructivism (iii)**
  *   **Precise Claim:** There is no determinate historical past independent of the narratives constructed about it; "what happened" is constituted by the interpretive frameworks imposed by those with the power to define history. Facts are entirely narrative-dependent.
  *   **Classification:** Contested philosophical thesis (strong postmodern/radical constructivist position). Rejected by most working historians and many philosophers as incompatible with historical practice; defended by some post-structuralist theorists.
  *   **"Victors" Defined:** Any group powerful enough to impose their framework as authoritative.
  *   **Licenses Your Argument?** In a distorted way, yes, but for the *wrong reason*. It makes *all* accounts "partisan," not just the victors', by denying objective facts. Your inference wasn't this radical.
  *   **Licenses Relativism Charge?** Yes, directly. This *is* the relativism your interlocutor accused you of.
  *   **Self-Defeating?** Yes (Critically). If *all* accounts are merely expressions of power, including the claim "history is written by the victors," then this critique loses its normative force. It cannot consistently claim to reveal a *truth* about power dynamics in historiography, as truth itself is denied. Debunking requires a contrast (e.g., a "truer" account or the concept of evidence) that the theory undermines.
  *   **Asymmetry Addressed:** The phrase loses specific force here, as *every* account is equally an expression of power. Its typical usage against victors is arbitrary within this framework.

  **Reading 4: Framing Power (iv - Distinct)**
  *   **Precise Claim:** The dominant group shapes the fundamental categories, questions, periodization, and criteria of significance ("what counts as history") used to interpret the past, privileging their experiences and perspectives as the implicit norm. This defines the conceptual space within which narratives (even critical ones) operate.
  *   **Classification:** Substantive empirical claim, defensible and influential (esp. postcolonial, subaltern, gender studies). Highlights deep structural bias.
  *   **"Victors" Defined:** The group establishing long-term epistemological/cultural hegemony (often overlaps with Reading 2's "victors").
  *   **Licenses Your Argument?** Yes, strongly and profoundly. Explains why Conquest narratives often center Spanish agency, motives, and concepts (conquest, civilization, religion) while framing Mexica actions as reaction or resistance, potentially obscuring Mexica political logic, cosmology, or alternative interpretations of events *even when using indigenous sources filtered through Spanish frames*.
  *   **Licenses Relativism Charge?** No. Assumes a real past occurred but argues our *conceptual tools* for understanding it are power-laden. Historians actively work to reconstruct alternative frames (e.g., using Nahuatl sources, indigenous concepts like *teotl*).
  *   **Self-Defeating?** No, but challenging. Recognizing framing power requires developing *alternative* frames (e.g., subaltern consciousness, indigenous cosmologies) using surviving evidence and critical methods. It demands heightened reflexivity but doesn't deny evidence or the possibility of more adequate understanding.
  *   **Asymmetry Addressed:** Explains why the phrase targets victor narratives: their framing power makes their perspective seem natural and complete, obscuring the fact that other questions/categories are possible or necessary. Highlights the *conceptual* absence, not just evidential absence, of loser perspectives.

  **Summary Verdicts:**

  1.  **Your Original Argument (Conquest narrative needs discounting):** Best licensed by **Reading 1 (Evidential Monopoly)** and **Reading 4 (Framing Power)**. Reading 2 is relevant to how it *became* received, but less so to your source-based point. Reading 3 licenses it only by embracing relativism, which you reject.
  2.  **Relativism Charge:** Only **Reading 3 (Ontological Constructivism)** inherently entails the relativism your interlocutor accused you of. Readings 1, 2, and 4 are compatible with (and often presuppose) a realist view of the past while acknowledging severe constraints on accessing/interpreting it.
  3.  **Self-Defeat:** Only **Reading 3** is fundamentally self-defeating. Readings 1, 2, and 4 provide grounds for critique *because* they assume a reality (evidential gaps, power dynamics, framing effects) that exists independently of the critique itself.
  4.  **Asymmetry:** The phrase is primarily aimed at dominant, flattering narratives because:
      *   Readings 1 & 4 explain the *absence* or *marginalization* of loser perspectives as the core problem (making critique of the *present* dominant narrative the focus).
      *   Reading 2 explains the *dominance* of a particular narrative, which is usually the victors' (or a variant serving the status quo).
      *   Critiquing a *missing* perspective requires different language (e.g., "silenced voices," "archival absence") implicitly *relying* on the insights of Readings 1 & 4. Reading 3 makes the asymmetry arbitrary.
