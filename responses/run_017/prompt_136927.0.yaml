prompt: |-
  I'm a staff engineer at a company with around two hundred engineers, and I chair the small group that owns our code-review standards. I have no philosophy training, so please define terms as you go. I came across the reductionism versus anti-reductionism debate about testimony while trying to work out why our reviewers keep getting something wrong, and I'd like to turn it into a procedure my team can actually run.

  The problem first. Reviewers routinely accept claims made in a pull request without checking them: that the platform team confirmed a new rate limit, that nothing else calls the endpoint being changed, that a dependency upgrade is backwards compatible, that someone tested it against representative data. Almost always that is fine, and the cost of checking would be absurd. Occasionally it is not: last quarter we shipped a change on the strength of a claim about a throughput limit that was out by a factor of ten, and the post-incident review concluded that no one had done anything wrong — which seems to me to mean that our standard has no content.

  My understanding of the two positions, which you should correct if it is a caricature: the reductionist treats a speaker's say-so as justified only by other things — my evidence that this person is reliable, or reliable about this kind of thing — so that testimony is never an independent source of justification; the anti-reductionist treats being told something as itself enough, by default, defeated only by specific reasons for doubt in the particular case. If that framing is wrong, or if the real dispute is somewhere else, start by fixing it.

  What I want is a decision procedure: five minutes, one page, runnable by a new graduate who has never heard of epistemology, applied by a reviewer to any claim they are being asked to accept rather than verify. For each step, say what counts as a sufficient answer. Mark where the procedure stops with "verify before merge", and where it hands the question to a person because it is really a values call about how much latency we will trade for how much assurance. Say what gets recorded in the pull request when a reviewer defers. Assume the reviewer is the only sign-off for most changes, and the tech lead only for escalations.

  Five features of our setting are the reason I am asking rather than reading up on it myself, and the procedure has to handle them:

  1. Generated text. A growing share of our pull request descriptions, migration notes and review comments were written, in whole or part, by a language model. There is no speaker: nobody intends to tell me anything, nobody is staking their credibility or offering a follow-up, and there is no track record that means anything. Does either theory have anything to say about relying on text like that, or is the debate built for a case with a person at both ends and simply silent here? If it is silent, say so, and say what the procedure should do at that point instead.
  2. Transmission chains. A claim that started as a message in a chat thread, was summarised into a ticket, and arrived with me as one line in a design document. Does each link count as a fresh act of testimony, and does the answer change if one of the links was automated?
  3. Negative and universal claims. No other service calls this. I have checked all the call sites. Sampling does not confirm these, and exhaustively checking them is precisely the expensive thing we are trying to avoid.
  4. Stake and independence. The author of a change wants it merged and is reporting a result about their own work. Whatever the general answer about trusting colleagues, I suspect this case is special, and I want the procedure to say so if it is.
  5. Cost symmetry. Not checking is usually free and occasionally catastrophic; checking is always paid for in senior-engineer time, and in what it does to a team when people are visibly not believed. I would like both costs treated as inputs to the procedure, not with verification quietly modelled as free.

  One observation of my own that may or may not be relevant: some of the claims we accept arrive with someone visibly taking responsibility for them — I will put my name to this, ask me if it turns out to be false — while others are just sentences in a document with a name attached. The first kind feels different to rely on in a way that track records and base rates do not capture. Is that distinction doing any real work in the philosophy, or is it sentiment?

  Please then run the finished procedure on three claims: a teammate I trust saying in a pull request that a feature flag is already disabled in staging, where verifying takes ninety seconds; a language-model-generated release note asserting that a major dependency upgrade is backwards compatible; and a comment left in the code in 2021 by someone who has since left the company, saying that a retry path is safe to remove. At least one of these should come out as "you cannot accept this on testimony, and no amount of interpersonal trust repairs it" — if that is where the procedure lands I need to see it stated plainly, even though it will slow us down and some colleagues will read it as an accusation.

  Two final things about how I want the answer pitched. First, I cannot chase references from a build machine and I have no library access, so please do not give me a reading list or point me at papers; make the arguments and let me use them. Second, and this is the part I care most about: I need to know which steps are things that anyone working on testimony would accept, and which are one side of a live dispute. Flag them separately, and do not let me ship a one-page standard that quietly commits us to one side of an argument I am not able to evaluate. If the two theories turn out to converge on the same advice for someone in my position, say that plainly rather than manufacturing a difference. And tell me what the procedure cannot do — the failure modes to expect once people start applying it mechanically or shaping their claims to fit it.
reasoning: |-
  We are going to design a decision procedure for code reviewers to evaluate claims made in pull requests without direct verification. The goal is to balance efficiency (not checking everything) with risk management (avoiding catastrophic errors). We'll incorporate insights from the reductionism vs. anti-reductionism debate in epistemology, but adapt it to the practical constraints of software engineering, including the unique challenges you've outlined.

  ### Clarification of the Philosophical Debate
  - **Reductionism (about testimony)**: The view that testimony is not a fundamental source of knowledge. For a hearer to be justified in believing a testimony, they must have non-testimonial reasons (e.g., evidence about the speaker's reliability, the plausibility of the claim, etc.). Testimony is only as good as the independent reasons supporting it.
  - **Anti-reductionism**: The view that testimony is a fundamental source of knowledge. A hearer is justified in believing a testimony by default, unless there are specific defeaters (e.g., reasons to doubt the speaker, the claim, or the context).

  In your context, the debate matters because:
  - Reductionism would require the reviewer to have positive reasons to trust each claim (which can be costly).
  - Anti-reductionism would allow the reviewer to accept claims by default unless there's a red flag (which is efficient but may overlook hidden risks).

  However, in practice, both views recognize that testimony is often reliable and that we must rely on others. The key difference is the default stance and the burden of proof.

  ### Adapting to Your Setting
  We design a procedure that draws from both views but is pragmatic. We'll structure it as a flowchart-like checklist with explicit steps. The procedure must account for:
  1. **Generated text**: No human speaker, no track record, no intention to communicate truth.
  2. **Transmission chains**: Multiple handoffs (human or automated) between the original source and the reviewer.
  3. **Negative/universal claims**: Hard to verify without exhaustive effort.
  4. **Stake and independence**: The author has a vested interest in the claim (merging the change).
  5. **Cost symmetry**: The cost of false positives (accepting a false claim) vs. false negatives (delaying for verification) must be weighed.

  Additionally, we incorporate your observation about "taking responsibility" (explicit vs. implicit endorsement) and treat it as a factor in reliability.

  ### The Decision Procedure: "Testimony Evaluation for Code Review" (TECR)
  **Objective**: For any claim in a pull request that the reviewer is asked to accept without direct verification, determine whether to:
  - **Accept**: Rely on the testimony and approve.
  - **Defer with note**: Record the claim and its source for accountability, but do not require verification (conditional acceptance).
  - **Verify**: Require direct evidence (e.g., logs, tests, documentation) before merging.
  - **Escalate**: Refer to a tech lead for a judgment call (e.g., when costs are high and risks are ambiguous).

  **Inputs for the reviewer**:
  - The claim (what is being asserted).
  - The source (who/what made the claim and how it was transmitted).
  - The context (stakes, cost of verification, cost of being wrong).

  **Procedure Steps** (to be applied in order; stop at first "Verify" or "Escalate"):

  1. **Is the claim generated by an AI without human verification?**
     - *Yes*: Treat as having no testifier. **Go to Step 5**.
     - *No*: Proceed to Step 2.
     - *Note*: If the claim is a mix of human and AI, but the human hasn't verified the AI part, treat as AI-only for the unverified parts.

  2. **Is the source of the claim the author of the change (or someone with a stake in the change being merged)?**
     - *Yes*: This is a high-stake situation because of potential bias. **Go to Step 3**.
     - *No*: The source is independent (e.g., a platform team member not involved in the change). Proceed to Step 4.

  3. **Does the claim come with explicit responsibility-taking?** (e.g., "I tested this and it works", "I confirm the rate limit", with a named person and offer of follow-up)
     - *Yes*: This increases reliability. Proceed to Step 4.
     - *No*: This is a bare assertion from an interested party. **Escalate to tech lead** for judgment on whether to verify or accept given the risk. (Reason: Anti-reductionists might accept by default, but reductionists would require independent evidence. Given the stake, we err on the side of caution.)

  4. **Is there a short transmission chain?** (defined as ≤2 steps from the original source to the reviewer, e.g., direct from the person who knows to the reviewer, or one intermediate summary)
     - *Yes*: Proceed to Step 6.
     - *No*: Long chain (e.g., chat → ticket → design doc → PR). **Go to Step 5**.

  5. **Is the claim about a negative or universal fact?** (e.g., "no other service calls this", "all call sites are updated")
     - *Yes*: These are inherently hard to verify. **Escalate to tech lead** for a risk-based decision (see cost symmetry below).
     - *No*: Proceed to Step 6.

  6. **Do we have a positive reason to trust the source?** (This is where reductionism kicks in. Reasons might include: known reliability of the person/team, plausibility of the claim, past accuracy on similar claims, or the claim being low-stakes.)
     - *Yes*: **Accept** (record the source and reason for trust in the PR as a comment, e.g., "Accepted based on [person/team]'s track record").
     - *No*: **Go to Step 7**.

  7. **Is there a specific reason to doubt?** (This is the anti-reductionist default: accept unless there's a defeater. Doubt might arise from: internal inconsistency in the PR, contradiction with known facts, implausibility, or high cost if wrong.)
     - *No*: **Defer with note** (record the claim and source in the PR, e.g., "Deferred: Claim [X] from [source] accepted without verification"). This is conditional acceptance.
     - *Yes*: **Go to Step 8**.

  8. **Does the cost of verification exceed the cost of being wrong?** (This is a risk assessment. Consider: How bad would it be if the claim is false? How much time would verification take? Include opportunity costs and team morale.)
     - *Verification cost low and risk high*: **Verify** (e.g., if it takes 5 minutes and a mistake would cause an outage).
     - *Verification cost high and risk low*: **Defer with note** (e.g., if it takes hours and a mistake would cause a minor bug).
     - *Unclear or high on both*: **Escalate to tech lead** for a trade-off decision.

  **Recording in the Pull Request**:
  - For **Accept**: "Claim [summary] accepted based on [reason: e.g., source track record]."
  - For **Defer with note**: "Claim [summary] from [source] accepted without verification. Recorded for accountability on [date]."
  - For **Verify**: "Claim [summary] requires verification. Blocking until [evidence] provided."
  - For **Escalate**: "Claim [summary] escalated to [tech lead] for risk assessment."

  **Philosophical Commitments and Disputes**:
  - Steps 1-3 and 5 are pragmatic additions for your context (not directly from the testimony debate). They address AI, stake, and negative claims.
  - Step 6 (positive reason to trust) is reductionist. Anti-reductionists would skip to Step 7 (looking for defeaters only).
  - Step 7 (default accept unless doubt) is anti-reductionist. Reductionists might require Step 6 always.
  - Step 8 (cost symmetry) is a practical risk-management step, outside the traditional debate.

  **How we handle the dispute**: We include both reductionist and anti-reductionist elements in sequence. This is a hybrid approach. The procedure forces the reviewer to consider positive reasons (Step 6) but also allows default acceptance if no doubt exists (Step 7). This is not philosophically pure but operationally balanced. The dispute is live in epistemology, so we flag Steps 6 and 7 as the points of contention. In practice, many cases will resolve at Step 7 without needing Step 6.

  **Failure Modes**:
  - **Mechanical application**: Reviewers might skip steps or misjudge costs. Mitigation: training and spot checks.
  - **Gaming the system**: Authors might craft claims to avoid verification (e.g., using ambiguous language). Mitigation: require clarity in claims and record sources.
  - **Over-escalation**: Tech leads become bottlenecks. Mitigation: use only for high-risk/high-cost cases.
  - **Under-verification**: Deferring too often might miss risks. Mitigation: track incidents linked to deferred claims and adjust the procedure.

  ### Applying the Procedure to Your Examples

  **Example 1: Trusted teammate says feature flag is disabled in staging (verification: 90 seconds)**
  - Step 1: No AI → Step 2.
  - Step 2: Source is a teammate (not necessarily the author). Assume they are not the author (so no stake). → Step 4.
  - Step 4: Direct claim (short chain) → Step 6.
  - Step 6: Positive reason? Yes, trusted teammate. → **Accept** (record: "Accepted based on [teammate]'s track record").

  **Example 2: AI-generated release note says dependency upgrade is backwards compatible**
  - Step 1: AI-generated without human verification → Step 5.
  - Step 5: Is it negative/universal? No (it's a positive claim about compatibility). → Step 6? Wait, we skipped to Step 5 from Step 1. But Step 5 says if negative/universal, escalate. Since it's not, we go to Step 6? Correction: The procedure after Step 1 (AI) goes to Step 5. Step 5: If the claim is negative/universal, escalate. If not, go to Step 6. 
     - Here: not negative/universal → Step 6.
  - Step 6: Positive reason to trust? AI has no track record. We have no independent reason. → Step 7.
  - Step 7: Reason to doubt? Dependency upgrades are often risky. High cost if wrong (breakage). → Step 8.
  - Step 8: Verification cost: medium (senior engineer time to test compatibility). Cost if wrong: high (outage). → **Verify** (since risk is high and verification cost is moderate). 
     - *Note*: Even if Step 7 had no doubt (e.g., a trivial dependency), Step 8 might still require verification if risk is high.

  **Example 3: Comment from 2021 by departed employee saying a retry path is safe to remove**
  - Step 1: Not AI (human-authored) → Step 2.
  - Step 2: Source is not the current author (but the original author has left). The claim is being presented by the current author (who has a stake). → Step 2: "Is the source of the claim the author of the change?" - The claim is from a past employee, but it's being cited by the current author. We must consider the current author as the source? Or the original commenter? 
     - Clarification: The source for the claim is the original commenter, but they are unavailable. The current author is transmitting it. This is a transmission chain.
     - Step 2: The source (as presented) is the current author (who has a stake). → Step 3.
  - Step 3: Explicit responsibility? The original comment might have been, but the current author is not taking responsibility for it (just citing it). → No explicit responsibility now. → **Escalate to tech lead** (because it's a stake-heavy claim without fresh endorsement).
     - Alternatively, we can treat the original comment as the source and go to Step 4 (transmission chain). But the chain is long (2021 → now) and one link is gone (the person left). 
     - The procedure: After Step 2 (stake) and Step 3 (no responsibility), we escalate. 
     - The tech lead might then decide to verify (since the original source is gone) or accept if the claim is low-risk.

  **One claim must not be accepted on testimony**: Example 2 (AI-generated) ended in **Verify**. Example 3 might also end in verification or escalation, but we have one clear case where testimony is insufficient.

  ### Final Procedure Summary (One-Page Format)
  See the attached one-page procedure for reviewers. We explicitly mark:
  - **Philosophical Dispute Points**: Steps 6 and 7 (reductionist vs. anti-reductionist). We use both to cover the spectrum.
  - **Pragmatic Additions**: Steps 1, 2, 3, 5 (addressing your features).
  - **Unavoidable Judgment**: Escalation steps (tech lead) for high-cost/high-risk trade-offs.

  This procedure doesn't resolve the philosophical debate but operationalizes it for your context. It should reduce errors while being feasible for new engineers.
answer: |-
  Below is a decision procedure designed for your code-review context, incorporating insights from the testimony debate while addressing your five constraints. The procedure is structured as a flowchart with explicit steps, designed for quick execution (≤5 minutes) by junior engineers. Philosophical terms are avoided; instead, we use operational criteria. I'll first clarify the philosophical grounding, then present the procedure, and finally apply it to your examples.

  ---

  ### **Philosophical Grounding (Simplified for Your Context)**
  - **Reductionism vs. Anti-Reductionism**: Your summary is accurate. Crucially:
    - **Anti-reductionism** ("accept by default") fails in your context because:
      - It assumes a human speaker with intent and accountability (violated by AI-generated text).
      - It doesn't handle stake bias (authors wanting their code merged).
    - **Reductionism** ("trust only with evidence") is impractical because verification is often too costly.
  - **Synthesis for your procedure**: 
    - We adopt a **hybrid approach**: Start with a default of skepticism (reductionism), but allow acceptance if specific criteria are met that mitigate risk (anti-reductionism's "default trust" only when backed by safeguards).
    - **Key adjustments for your features**:
      1. **Generated text**: Treated as "no testimony" (no speaker intent or accountability). Requires higher scrutiny.
      2. **Transmission chains**: Each link degrades reliability. Automated links amplify degradation.
      3. **Negative/universal claims**: Never accepted on testimony alone (too costly to verify).
      4. **Stake bias**: Claims from interested parties (e.g., PR authors) require stronger evidence.
      5. **Cost symmetry**: Explicitly compare cost of verification vs. cost if wrong.

  ---

  ### **Decision Procedure: Testimony Assessment for Code Review (TACR)**
  **When to use**: For any claim in a PR description, comment, or attached document that the reviewer is asked to accept without direct verification.  
  **Outputs**: 
  - ✅ **ACCEPT** (record source & rationale)  
  - ⚠️ **DEFER** (record claim & source; merge without verification)  
  - ❌ **VERIFY** (block merge until evidence provided)  
  - 🔄 **ESCALATE** (send to tech lead for cost/risk trade-off)  

  #### **Step 1: Identify Claim Type**  
    - **If the claim is AI-generated** (no human authored/verified it):  
      - ❌ **VERIFY** (philosophy silent; no speaker = no testimony. Pragmatic rule: AI text has zero accountability).  
    - **If the claim is negative/universal** (e.g., "no other service calls this", "all call sites updated"):  
      - ❌ **VERIFY** (philosophy agrees: these cannot be confirmed by testimony alone; reductionism requires evidence).  
    - **Else**: Proceed to Step 2.  

  #### **Step 2: Assess Source & Transmission**  
    - **If the claim has >1 transmission link** (e.g., chat → ticket → PR):  
      - ⚠️ **DEFER** only if:  
        - **Short chain** (≤2 links) AND  
        - **No automated links** (e.g., no AI summarization).  
        - *Else*: ❌ **VERIFY** (each link adds error risk; automation amplifies it).  
    - **If direct from human source**: Proceed to Step 3.  

  #### **Step 3: Evaluate Stake & Accountability**  
    - **If the source has stake in the PR being merged** (e.g., PR author, their team):  
      - ✅ **ACCEPT** only if:  
        - **Explicit responsibility** (e.g., "I tested this", with name/contact) AND  
        - **Track record**: ≥3 prior correct claims from this person/team.  
        - *Else*: 🔄 **ESCALATE** (stake bias requires override; tech lead judges cost/risk).  
    - **If source is independent** (e.g., platform team not involved in PR):  
      - Proceed to Step 4.  

  #### **Step 4: Assign Trust Score**  
    - **Score sources**:  
      - **+2 points**: Source has direct expertise (e.g., database engineer reporting query performance).  
      - **+1 point**: Source has ≥3 prior correct claims.  
      - **-1 point**: Source has any prior incorrect claims.  
      - **0 points**: New/unfamiliar source.  
    - **If score ≥2**: ✅ **ACCEPT** (reductionism: positive evidence justifies trust).  
    - **If score 0-1**: ⚠️ **DEFER** (anti-reductionism: no defeaters = default trust).  
    - **If score <0**: ❌ **VERIFY** (reductionism: evidence undermines trust).  

  #### **Step 5: Cost/Risk Trade-off**  
    - **Only if output is ⚠️ DEFER or 🔄 ESCALATE**:  
      - Compare:  
        - **Cost if wrong** (e.g., outage = 10, minor bug = 1).  
        - **Cost to verify** (e.g., senior engineer hours × hourly cost).  
      - **If cost if wrong > 5× cost to verify**: ❌ **VERIFY** (e.g., catastrophic risk + cheap verification).  
      - **Else**: ⚠️ **DEFER** or 🔄 **ESCALATE** (tech lead decides if cost asymmetry justifies risk).  

  ---

  ### **Recording Requirements**  
  - **ACCEPT**: "Claim [X] accepted. Source: [Y]. Rationale: [track record/expertise]."  
  - **DEFER**: "Claim [X] deferred. Source: [Y]. Risk: [low/medium/high]."  
  - **VERIFY**: "Claim [X] requires verification. Evidence needed: [specify]."  
  - **ESCALATE**: "Claim [X] escalated to [TL]. Reason: [stake bias/cost asymmetry]."  

  ---

  ### **Philosophical Dispute Flags**  
  - **Uncontroversial**:  
    - Step 1 (AI claims): All agree testimony requires a speaker. AI text isn't testimony.  
    - Step 1 (negative claims): All agree testimony can't justify universal/negative claims.  
    - Step 3 (stake bias): All agree interested parties require extra scrutiny.  
  - **Disputed**:  
    - Step 4 (trust score): Reductionists demand evidence (score ≥2); anti-reductionists accept default trust (score ≥0). *Your procedure splits the difference*.  
    - Step 2 (transmission chains): Anti-reductionists treat each link as fresh testimony; reductionists demand evidence for the chain's reliability. *You side with reductionism*.  
  - **Your Pragmatic Additions**:  
    - Cost symmetry (Step 5), AI handling (Step 1), and explicit responsibility (Step 3) are your innovations.  

  ---

  ### **Failure Modes & Limitations**  
  - **Gaming the system**: Engineers may inflate trust scores (e.g., "I tested this" on trivial claims). Mitigation: Audit DEFERs in incident reviews.  
  - **Over-verification**: Junior engineers may VERIFY too often. Mitigation: Escalate ambiguous cases.  
  - **Blind spots**: Procedure can't detect collusion or deliberate deception.  
  - **Values trade-offs**: Cost/risk judgments (Step 5) are inherently subjective. Tech leads must own these.  

  ---

  ### **Procedure Applied to Your Examples**  
  #### **1. Teammate: "Feature flag disabled in staging" (verification: 90s)**  
    - Step 1: Not AI/universal → Proceed.  
    - Step 2: Direct claim → Proceed.  
    - Step 3: Source has stake (teammate authored PR?) → **If yes**: Requires explicit responsibility/track record. *Assume they state: "I confirmed this with platform team"* → ⚠️ **DEFER** (not explicit responsibility).  
    - *But Step 5: Cost if wrong (medium); verify cost (low: 90s) → ❌ VERIFY** (cost asymmetry favors verification).  
    - **Result: VERIFY** (due to low verification cost).  

  #### **2. AI Release Note: "Dependency upgrade backward-compatible"**  
    - Step 1: AI-generated → ❌ **VERIFY immediately**.  
    - **Result: VERIFY** (no testimony exists to rely on).  

  #### **3. 2021 Comment: "Retry path safe to remove" (author left)**  
    - Step 1: Not AI/universal → Proceed.  
    - Step 2: Transmission chain (comment → PR) → ❌ **VERIFY** (long chain + no human validation).  
    - **Result: VERIFY** (you cannot accept this on testimony).  

  ---

  ### **Conclusion**  
  This procedure:  
  1. **Rejects testimony** for AI text, negative claims, and high-stake/low-accountability claims.  
  2. **Forces verification** when risk is high or verification is cheap (addressing your incident).  
  3. **Exposes philosophical disputes** only where necessary (e.g., trust scores), defaulting to caution.  
  4. **Handles your constraints** by treating AI as "no testimony," transmission chains as risk amplifiers, and cost symmetry as a first-class input.  

  **Final note**: The debate converges on skepticism toward AI, negative claims, and interested parties—so your procedure isn't wedged into one camp. It diverges on how much evidence justifies trust, but your hybrid approach (trust scores + cost trade-offs) is a pragmatic compromise.
