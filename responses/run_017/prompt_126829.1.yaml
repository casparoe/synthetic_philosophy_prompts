prompt: |-
  Hey — act as a professional philosopher who specializes in naturalizing intentionality, the kind of person who has actually spent years with Millikan- and Dretske-style teleosemantics and with the machinery that goes with it (proper functions, Normal conditions, consumer/producer stories). Please think carefully and do a bit of unstructured brainstorming before you settle on an answer, and write the final response in American English.

  I'm in a small reading group on philosophy of mind, we did teleosemantics last week, and I came away realizing I've got a pile of verdicts that I'm not at all sure hang together. So let me just list them. (1) A sea turtle hatchling crawling toward the brightest horizon: I want to say its state means something like "open water that way," and that when it heads for a hotel parking lot instead it's simply in error — the content doesn't migrate to whatever the bright thing now happens to be. (2) A male wasp trying to mate with an orchid that mimics the female's scent: same structure, I say the content is "female here" and this is a misrepresentation, not a fresh content about flowers. (3) A bacterium with an internal magnet that reliably steers it away from oxygen: I want to count that as genuinely representational too, and to say the state is about oxygen-poor water rather than about magnetic north, even though magnetic north is what it physically keys off. (4) A molecule-for-molecule duplicate of me assembled by a freak event in a swamp, with no selection history at all: no content whatsoever, its inner states are just causes, and I'm fine with that. (5) An organism born with a one-off mutation that makes it freeze at the smell of some predator, which happens to help it survive and which then gets selected for over the next few hundred generations: I say the first individual's state has no content while its descendants' states do, even though the state is doing exactly the same causal work in both — I know that sounds wierd and I still can't let go of it. (6) A trait that was selected for thermoregulation, lost that job entirely, and is now used only for signaling to mates: I want to say the content moved with the new job.

  Here's where it falls apart for me. (7) A neural net trained to classify skin lesions as malignant or benign that in fact latched onto whether there's a ruler in the frame, because the photos with rulers were the malignant ones. In the wasp case I insisted content follows the selection history and not whatever actually triggers the mechanism, but here my gut flips: I want to say the internal feature is about rulers, and that calling it "malignancy" is just us being sentimental about what we trained it for. (8) Related: a mechanism that got selected because of one correlation but actually proliferated because of a different, accidental one — say a trait favored because it made its bearer attractive to mates, which also reliably co-occurred with food nearby. My verdict is that only the mate thing is content and the food correlation is coincidence, even though the food correlation is perfect. (9) Last: a species kept in captivity for two hundred generations in which the old "predator" detector never fires on anything that matters anymore and contributes nothing to survival or reproduction — I still want to say the content is there, hanging on by its history alone.

  So: is there one principle, or a tight little family of them, that gets all nine? My own stab, which I suspect is broken: a state has the content C just in case its having C is what explains why the mechanism producing it is still around, where "explains" has to be cashed out partly in terms of selection history but partly in terms of what currently keeps the mechanism in the population. Test that against the cases and repair it. I want the principle stated precisely enough that I can run new cases through it, with each clause tied to the case that motivates it. Then give me its verdicts on cases I haven't listed — especially a creature whose detector was selected for X but which is then surgically rewired in a lab so that it fires on Y, and as a result the creature does great and passes the rewiring on to a whole lab-bred lineage; and a case where two selection explanations tie and there's no fact of the matter which one did the work. And be honest about which of my verdicts your principle can't accommodate: if there's no way to keep both (2) and (7), tell me which one you'd overturn and what I lose by giving it up. No bibliography needed, I'll fill in the citations myself.
