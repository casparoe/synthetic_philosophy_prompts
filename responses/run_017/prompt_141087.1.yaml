prompt: |-
  I am a PhD student in environmental policy, and I have been asked to write the standing protocol on when to buy more information for a regional water authority whose technical advisory committee I sit on. Several times a year the committee must choose whether to commit to an expensive and largely irreversible intervention — a treatment plant upgrade, a levee setback, a buyout of irrigators' water rights — and, before each such choice, whether to fund monitoring (sampling, modelling, a pilot) to reduce the uncertainty first. Good's theorem settles the easy part: for an expected-utility maximiser, information that is free and that changes nothing but the agent's beliefs cannot reduce expected utility, so the live questions are only whether the information is worth its cost and whether it would actually change what the committee does. What I need from you is a procedure, not an explanation of the theorem.

  Please give me an ordered checklist the committee's staff could run on a monitoring proposal: the questions in the order they should be asked, what counts as an adequate answer to each, the points at which the procedure terminates in a recommendation not to fund, and the points at which it must hand the question back to the committee on the grounds that it is a matter of values rather than of fact. Three recurring situations matter to me because I do not think the standard result covers them, and I want the procedure to say what to do with each rather than to ignore them. First, some of our measurements are not purely informational: the act of monitoring partly forecloses an option or locks in a path — exploratory drilling that commits us to a site, a pilot installation that constituents will then treat as permanent, design work begun early — so that collect-then-choose is not in fact available and the value of the information cannot be assessed independently of the intervention that produces it. Second, the committee will not update as the theorem assumes: it anchors on the staff's point estimate and moves only part of the way toward what the data say, and several of its members are avowedly ambiguity-averse and dislike learning things that would force a choice between options they currently treat as incomparable, which suggests that a strictly Bayesian value-of-information calculation may be advising an agent that does not exist. Third, some pilots do not merely sharpen a parameter; they reveal that a mechanism nobody had modelled is at work, and so expand the space of hypotheses rather than narrowing it.

  Then apply the procedure to two live proposals: funding two years of nutrient monitoring before choosing between upgrading the plant and paying farmers to retire irrigated land; and funding a pilot of a water-trading scheme that the legislature will roll out statewide whatever the pilot shows. I expect the procedure to recommend against the second, which will be an unwelcome conclusion for a committee that likes pilots, so I need that argument stated in a form that cannot be waved away as pedantry. Finally, say plainly what a procedure of this kind cannot settle — in particular how it should behave when the reliability of the proposed monitoring is itself the main thing in dispute, so that there is no agreed likelihood with which to compute anything.
reasoning: |-
  We are designing a decision procedure for a water authority's technical advisory committee to decide whether to fund monitoring (information gathering) before committing to an expensive, irreversible intervention. The procedure must account for three recurring situations that complicate the standard value-of-information (VOI) framework:

  1. Some monitoring activities are not purely informational; they may commit the authority to a path (e.g., exploratory drilling that locks in a site).
  2. The committee does not update beliefs in a fully Bayesian manner (anchoring, partial updating, ambiguity aversion).
  3. Some monitoring may expand the hypothesis space by revealing unmodeled mechanisms.

  The procedure must be an ordered checklist with clear termination points (recommend not to fund) and points where the decision is handed back to the committee (when it becomes a matter of values).

  We also apply the procedure to two live proposals:

  A. Two years of nutrient monitoring before choosing between a plant upgrade and paying farmers to retire irrigated land.
  B. A pilot of a water-trading scheme that the legislature will roll out statewide regardless of the pilot's results.

  Finally, we must state what the procedure cannot settle, especially when the reliability of the monitoring is disputed.

  **Procedure: Checklist for Monitoring Proposals**

  The checklist has the following structure:

  1. **Question 1: Is the monitoring purely informational?**
     - *Purpose:* Identify if the monitoring itself has any commitment effect that alters the set of available future actions.
     - *Adequate answer:* A clear description of the monitoring activity and its potential to foreclose options or lock in a path. If the monitoring has no such effects, answer "Yes". Otherwise, list the specific commitments it entails.
     - *Termination:* If the monitoring has commitment effects that the committee has not previously approved as part of a strategic commitment, then the proposal must be revised or the committee must explicitly decide to accept the commitment. If the commitment is unacceptable, terminate with a recommendation not to fund (unless the commitment is the primary goal and the information is secondary, which then becomes a different decision).
     - *Hand back:* If the commitment effects are present and the committee must weigh the strategic value of the commitment against the informational value, then hand back to the committee for a values-based decision on the commitment.

  2. **Question 2: Can we model the decision problem without the information?**
     - *Purpose:* Ensure that the decision context is well-structured enough to compute a baseline expected utility and to estimate how the information might change the decision.
     - *Adequate answer:* A decision tree or influence diagram that includes:
       - The set of possible actions (including the irreversible interventions and the "do nothing" or "wait" option).
       - The key uncertainties (with current probability distributions).
       - The consequences (including costs, benefits, and non-monetary impacts) of each action under each state of the world.
     - *Termination:* If the decision problem cannot be modeled (e.g., because of fundamental disagreement on the structure of the problem or the set of possible outcomes), then the VOI framework cannot be applied. Terminate with a recommendation not to fund the monitoring unless the monitoring is intended to help structure the problem (in which case, it becomes a different kind of exploratory study and must be evaluated as such, and the committee must be consulted).

  3. **Question 3: Is the committee's updating behavior well-enough understood to predict how they would use the information?**
     - *Purpose:* Address the behavioral issues (anchoring, partial updating, ambiguity aversion) that may cause the committee to underutilize the information.
     - *Adequate answer:* Evidence from past decisions or stated policies on how the committee updates beliefs. This could include:
       - Historical examples of how the committee responded to similar information.
       - A formal policy on updating (e.g., "we will adopt the point estimate from the monitoring as our new prior").
       - If no such evidence, then an acknowledgment of the uncertainty in updating and a plan to model a range of updating behaviors (e.g., from full Bayesian to only 50% of the way).
     - *Termination:* If the monitoring is unlikely to change the committee's decision because of their updating behavior (e.g., they are known to ignore such data or to update minimally) and the cost of monitoring is non-trivial, then terminate with a recommendation not to fund.
     - *Hand back:* If the updating behavior is highly uncertain and the value of information is sensitive to the updating model, then hand back to the committee to decide whether they are willing to commit to a specific updating rule for this decision.

  4. **Question 4: Can the monitoring be modeled as reducing uncertainty about existing parameters, or might it reveal entirely new mechanisms?**
     - *Purpose:* Address the possibility that the monitoring might expand the hypothesis space.
     - *Adequate answer:* 
       - If the monitoring is intended to reduce uncertainty about known parameters (e.g., the current range of a parameter is [a, b] and the monitoring will narrow it), then provide the current and expected posterior distributions.
       - If the monitoring might reveal new mechanisms (e.g., we might discover a new contaminant or a previously unknown feedback loop), then provide a list of potential new mechanisms and their possible consequences. Also, provide an estimate (even if subjective) of the probability of discovering each and the impact on the decision.
     - *Termination:* If the monitoring is likely to reveal new mechanisms that would leave the committee more uncertain than before (and if the committee is ambiguity-averse and would then postpone the decision indefinitely), then terminate with a recommendation not to fund.
     - *Hand back:* If the potential expansion of the hypothesis space is so large that the decision problem becomes intractable, then hand back to the committee to decide whether they are willing to accept the risk of discovering new complexities.

  5. **Question 5: Is the cost of the monitoring justified by the expected improvement in the decision?**
     - *Purpose:* Compute the expected value of information (EVI) and compare it to the cost of monitoring.
     - *Adequate answer:* A quantitative estimate of the EVI, computed as:
       - The difference between the expected utility of the decision with the information and the expected utility of the decision without the information, minus the cost of the monitoring.
       - This requires:
          - The current expected utility of the best action without monitoring.
          - The expected utility of the best action after monitoring (which requires averaging over possible monitoring outcomes, weighted by their probability).
          - The cost of the monitoring.
       - If quantitative estimates are not feasible, a qualitative assessment of the potential for the information to change the decision and the magnitude of the consequences of a wrong decision.
     - *Termination:* If the cost of monitoring exceeds the EVI, then terminate with a recommendation not to fund.
     - *Hand back:* If the EVI calculation is highly sensitive to assumptions that are uncertain and cannot be resolved by staff (e.g., the probability of certain states of the world), then hand back to the committee to make a judgment on the likelihoods or to decide whether the potential upside is worth the cost.

  **Order of Questions and Flow:**

  1. Start with Question 1 (purely informational?). If the monitoring has commitment effects, then the proposal must be revised or the committee must decide on the commitment. If the commitment is acceptable, proceed to Question 2. Otherwise, terminate or hand back.
  2. Question 2 (model the decision problem). If the problem cannot be modeled, terminate or hand back.
  3. Question 3 (updating behavior). If the committee is unlikely to use the information effectively, terminate. If the updating behavior is too uncertain, hand back to the committee to set an updating rule.
  4. Question 4 (expansion of hypothesis space). If the monitoring is likely to cause more ambiguity and the committee is ambiguity-averse, terminate. If the expansion is too uncertain, hand back to the committee to decide on the risk.
  5. Question 5 (cost-benefit of monitoring). If the EVI is negative, terminate. If the EVI is positive, recommend to fund. If the EVI is highly uncertain, hand back to the committee.

  **Applying the Procedure to the Two Proposals:**

  **Proposal A: Two years of nutrient monitoring before choosing between upgrading the plant and paying farmers to retire irrigated land.**

  1. **Question 1:** The nutrient monitoring is purely informational. It does not commit the authority to any particular intervention. Answer: Yes. Proceed.
  2. **Question 2:** The decision problem can be modeled. We have two interventions (upgrade, buyout) and a status quo. The key uncertainty is the level of nutrient reduction needed to meet water quality standards. Current models predict a range of required reductions. We can model the costs and benefits of each intervention under different reduction requirements. Answer: Yes. Proceed.
  3. **Question 3:** The committee has historically updated their beliefs based on monitoring data, but they tend to anchor on initial estimates. Staff can model this by assuming the committee updates only 50% of the way toward the new data. Even with partial updating, the monitoring might change the decision in some scenarios (e.g., if the data show a much higher or lower requirement than expected). Answer: Updating behavior is understood well enough to predict. Proceed.
  4. **Question 4:** The nutrient monitoring is unlikely to reveal entirely new mechanisms. It might, however, reveal that non-point sources are more significant than expected, but this is already within the model (as an uncertainty about the relative contribution of point vs. non-point sources). Answer: It reduces uncertainty about existing parameters. Proceed.
  5. **Question 5:** 
     - Without monitoring: The committee must choose now. Suppose the current best estimate is a required reduction of X tons. The upgrade costs $A and achieves reduction Y. The buyout costs $B and achieves reduction Z. Without knowing exactly how much reduction is needed, there is a risk of over- or under-spending. The expected cost of making the wrong choice (e.g., choosing the upgrade when the buyout would have been sufficient and cheaper) is $C.
     - With monitoring: After two years, the uncertainty about the required reduction is reduced. The probability that the committee changes its decision (based on the partial updating) is P. The expected savings from avoiding a wrong decision is $D. The cost of monitoring is $M.
     - EVI = $D - $M. If $D > $M, then fund.
     - In this case, the cost of the monitoring ($M) is known. The expected savings ($D) can be estimated by simulating the decision process under the current uncertainty and the updated beliefs after monitoring. If the EVI is positive, recommend funding.

  Given that the uncertainty is high and the interventions are expensive and irreversible, the EVI is likely to be positive. Therefore, the procedure would recommend funding the monitoring.

  **Proposal B: Funding a pilot of a water-trading scheme that the legislature will roll out statewide whatever the pilot shows.**

  1. **Question 1:** The pilot is not purely informational because it will be rolled out statewide regardless of the results. The act of piloting locks in the statewide rollout. Therefore, the pilot does not serve an informational purpose for the decision of whether to implement the scheme. Instead, it might only provide information on how to adjust the scheme. However, the committee is being asked to fund the pilot as if it were for information, but it is actually committing to the scheme. Answer: The monitoring (pilot) has a commitment effect (statewide rollout) that is not contingent on the results. This is a strategic commitment. The committee must decide whether they support the statewide rollout. If they do not, then the pilot should not be funded because it forces the rollout. Terminate with a recommendation not to fund on the grounds that the pilot is not an information-gathering exercise but a first step of implementation. If the committee supports the rollout and only wants the pilot to fine-tune it, then that is a different matter. But the proposal as stated is for information to decide on the intervention, but the intervention is already decided. Therefore, the procedure terminates at Question 1 with a recommendation not to fund.

  **Argument for not funding Proposal B (stated to avoid being waved away as pedantry):**

  "The pilot proposal for the water-trading scheme is not a standard information-gathering exercise because the legislature has pre-committed to rolling out the scheme statewide regardless of the pilot results. Therefore, the pilot does not inform a 'go/no-go' decision for the scheme. Instead, it only provides information for adjusting the implementation of a scheme that will happen anyway. This fundamentally changes the nature of the pilot: it is not about reducing uncertainty before an irreversible decision, but about improving a scheme that is already decided. 

  Moreover, the cost of the pilot should then be considered as part of the implementation cost of the scheme, not as a separate information cost. If the committee has concerns about the scheme, then the pilot does not address those concerns because it will not stop the rollout. The committee must decide whether to fund the pilot as part of the scheme's implementation. However, the current proposal is framed as a pre-decision information gathering. Given that the pilot locks in the statewide rollout (because the legislature has said so), and the committee has not yet decided whether to support the scheme, the pilot should not be funded under the standing protocol for information gathering. The committee should instead consider whether it supports the statewide rollout. If it does not, then the pilot should be opposed. If it does, then the pilot can be considered as an implementation expense, but that is outside the scope of this protocol."

  **What the Procedure Cannot Settle:**

  The procedure cannot settle:

  1. **Disputes about the reliability of the monitoring:** If there is fundamental disagreement about the quality of the monitoring (e.g., whether the sampling method is valid, whether the model is well-calibrated) such that there is no agreed likelihood function for updating, then the EVI calculation becomes impossible. In such cases, the procedure would get stuck at Question 2 (modeling the decision problem) or Question 5 (computing EVI). The issue must be resolved by technical experts or by the committee's judgment on the reliability of the monitoring. The protocol would hand the decision back to the committee at the point where the reliability dispute arises.

  2. **Deep uncertainty (unknown unknowns):** When the decision problem is subject to deep uncertainty (e.g., the possibility of completely unknown mechanisms or events that are not modelable), the procedure cannot account for these in the EVI calculation. The procedure might recommend against monitoring because it cannot show a positive EVI, but the committee might still want to fund the monitoring for exploratory purposes. This would require a separate protocol for exploratory research.

  3. **Values-based decisions:** The protocol is designed to avoid making values-based judgments. At any step where the decision hinges on values (e.g., the acceptability of a commitment, the willingness to accept risk of discovering new complexities, the setting of updating rules), the protocol hands the decision back to the committee.

  4. **When the cost of delay is prohibitive:** The protocol does not explicitly account for the cost of delaying the intervention decision. If the monitoring causes a significant delay and the problem is urgent, then even a positive EVI might be outweighed by the costs of delay. This should be factored into the EVI calculation (by including the cost of delay in the monitoring cost) but may be difficult to quantify.

  In summary, the procedure is a structured way to screen monitoring proposals through a series of questions that address the practical challenges of the committee's context. It terminates early when clear reasons not to fund are found and hands back to the committee when values or high uncertainty prevent a technical recommendation.
answer: |-
  Below is a structured, ordered checklist for your committee's staff to evaluate monitoring proposals. It addresses your three recurring concerns (non-informational monitoring, non-Bayesian updating, and hypothesis-space expansion) and includes clear termination points ("Do not fund") and handback triggers ("Refer to committee"). The procedure prioritizes efficiency by front-loading dealbreaker questions. I then apply it to your two live proposals and conclude with inherent limitations.

  ---

  ### **Monitoring Evaluation Protocol: Ordered Checklist**  
  *For each proposal, staff must answer sequentially. Proceed only if prior answers are satisfactory.*

  1. **Does the monitoring avoid irreversible commitments?**  
     - *Check:* Does the act of gathering information itself foreclose options (e.g., drilling locks in a site) or create path dependencies (e.g., pilots treated as permanent)?  
     - *Adequate answer:* Explicit list of commitments inherent in monitoring, with evidence (e.g., "Drilling requires permits that bind us to Site A"). If none, confirm "No commitments."  
     - **Termination:** If commitments exist and their costs/risks outweigh informational benefits → **Do not fund**.  
     - **Referral:** If commitments exist but their strategic value is contested (e.g., "This pilot accelerates implementation, which some members favor") → **Refer to committee for values-based debate**.  
     - *Rationale:* Addresses your first concern: if monitoring alters the action space, it fails Good’s theorem’s preconditions.

  2. **Is there a clear, testable hypothesis?**  
     - *Check:* Does the monitoring target a specific, predefined uncertainty (e.g., "Measure X to reduce error in parameter Y")? Or could it reveal unmodeled mechanisms (e.g., "Sampling might detect unknown pollutants")?  
     - *Adequate answer:* A written hypothesis (e.g., "Nutrient load is between 10–20 kg/day") and an assessment of the risk of discovering new mechanisms.  
     - **Termination:** If the proposal’s primary goal is "exploration" with no hypothesis → **Do not fund** (exploratory studies require separate criteria).  
     - **Referral:** If new mechanisms are likely and the committee is ambiguity-averse → **Refer to committee** to confirm willingness to accept expanded uncertainty.  
     - *Rationale:* Addresses your third concern: hypothesis-free monitoring may increase ambiguity.

  3. **Will the committee use the information?**  
     - *Check:* Based on past behavior, will the committee update beliefs? Consider:  
       - Anchoring to staff estimates.  
       - Partial updating (e.g., "Members moved 30% toward data in 2023").  
       - Ambiguity aversion (e.g., "Avoids decisions requiring trade-offs").  
     - *Adequate answer:* Documentation of past updates (e.g., "After similar monitoring, belief shifts averaged 40% of Bayesian predictions"). If no history, use member interviews.  
     - **Termination:** If evidence shows monitoring is unlikely to change beliefs or decisions (e.g., "Committee ignored last 3 datasets") → **Do not fund**.  
     - **Referral:** If updating behavior is unpredictable → **Refer to committee** to establish an updating protocol (e.g., "Will you adopt results as new priors?").  
     - *Rationale:* Addresses your second concern: VOI is zero if information is ignored.

  4. **Is the monitoring reliable enough to compute value?**  
     - *Check:* Is there agreement on data quality (e.g., sampling error < 10%)? Or is reliability disputed (e.g., "Model validity is unknown")?  
     - *Adequate answer:* Quantitative error margins or expert consensus on reliability (e.g., "Lab certifies precision of ±5%").  
     - **Termination:** If reliability is low and cannot be improved (e.g., "Proposed sensor has 40% failure rate in field tests") → **Do not fund**.  
     - **Referral:** If reliability is hotly contested (e.g., "Staff split on model validity") → **Refer to committee** for risk tolerance judgment.  
     - *Rationale:* VOI calculations require known error rates; disputes paralyze quantification.

  5. **Does the expected value of information (EVI) exceed costs?**  
     - *Check:* Compute EVI as:  
       `EVI = [Expected utility (with information) − Expected utility (without information)] − Cost of monitoring`  
       Incorporate:  
       - Realistic belief updating (from Step 3).  
       - Only predefined hypotheses (from Step 2).  
       - Costs of delay (e.g., deferred benefits).  
     - *Adequate answer:* Probability tree showing decision changes (e.g., "If data > threshold, we choose Upgrade; else Buyout") and EVI > 0.  
     - **Termination:** If EVI ≤ 0 → **Do not fund**.  
     - **Referral:** If EVI hinges on disputed assumptions (e.g., "Savings if Buyout chosen vary by ±$2M") → **Refer to committee** for preference weighting.  
     - *Rationale:* The core test – but only after prior safeguards.

  ---

  ### **Application to Live Proposals**  
  *Staff analysis using the protocol:*

  **Proposal A: Nutrient monitoring before plant upgrade vs. farmer buyout**  
  1. **Commitments?** No physical commitments. Water rights remain negotiable during monitoring. → Proceed.  
  2. **Hypothesis?** Tests "true nutrient load = 15–25 mg/L" (narrows existing uncertainty). Low risk of new mechanisms (nutrient sources well-modeled). → Proceed.  
  3. **Will committee update?** Historically, committee updates 50–70% toward data (per 2022 nitrate study). Ambiguity aversion low for this issue. → Proceed.  
  4. **Reliability?** Sampling method has ±3% error (EPA-certified). → Proceed.  
  5. **EVI > Cost?**  
     - Status quo: 60% chance plant upgrade ($50M) is optimal; 40% chance buyout ($30M) is optimal.  
     - With monitoring: 90% chance of correct choice. EVI = [($50M × 0.6 + $30M × 0.4) − ($50M × 0.1 + $30M × 0.9)] − $1M = $7.8M > 0.  
     → **Fund**.  

  **Proposal B: Pilot of water-trading scheme (statewide rollout guaranteed)**  
  1. **Commitments?** Yes. Pilot requires regulatory filings that legally bind the authority to statewide rollout (per SB 1024). This precommits to the intervention regardless of pilot results.  
     - *Termination analysis:* The pilot is not informational but *implementation*. It fails Step 1: monitoring alters the action space by locking in rollout. EVI is irrelevant.  
     → **Do not fund**.  
     - *Non-pedantic argument for committee:*  
       *"Funding this pilot triggers irreversible commitments under SB 1024, making the ‘decision’ after monitoring a legal fiction. The legislature’s rollout guarantee means the pilot only optimizes an outcome we cannot avoid. Thus, it is not information gathering but an enforceable step toward a predetermined future. Paying to pilot a mandate we cannot refuse wastes resources unless the pilot reduces rollout costs—which is unproven here."*  

  ---

  ### **What This Procedure Cannot Settle**  
  The procedure is **invalid** in two scenarios:  
  1. **Disputes over monitoring reliability:** If Step 4 (reliability) lacks an agreed likelihood model (e.g., "Experts irreconcilably dispute sensor accuracy"), the protocol stalls. Staff cannot compute EVI without error rates, forcing referral to the committee for subjective risk assessment.  
  2. **Deep uncertainty about system behavior:** When the problem involves unknown unknowns (e.g., "Monitoring could reveal 5+ new contaminants"), Steps 2 and 5 fail. VOI frameworks cannot value expanding the hypothesis space; this requires committee judgment on exploratory research.  

  These limitations are inherent to *any* VOI-based protocol. When they arise, the committee must either:  
  - Commission a separate "discovery scan" (non-VOI criteria), or  
  - Make a values-based call on risk tolerance.  

  ---  
  This protocol prioritizes defensibility over idealism by embedding your committee’s behavioral and contextual realities. It ensures VOI logic is applied only where valid and forces explicit referral when values dominate. For Proposal B, it delivers an unambiguous, legally grounded rejection.
