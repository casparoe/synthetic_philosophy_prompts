prompt: |-
  I came into philosophy last year from an economics PhD, and on Thursday I'm presenting to a rational-choice reading group on Parfit's hitchhiker — the desert case where the driver will take you to San Francisco only if he can tell, at the roadside, that you'll hand over the $100 on arrival, and where once you've arrived there is nothing he can do to collect. My supervisor had me run it in a slightly unfamiliar form: the driver has no insight into your character, but carries a well-calibrated detector that reads the conditional probability that you will pay given that you arrive, and he drives off unless that number clears 0.9. Stipulate that the ride is worth about $10,000 to you, that you cannot pay in advance, that there is no contract, no reputational consequence and no way for him to collect afterwards, and that money is the only thing at stake. I built the argument below to force a verdict, and it now looks to me as though it proves far too much, which is why I'm writing to you instead of just standing up and giving it.

  (1) If it is rational for an agent to have disposition D, and D is a disposition to φ in circumstances C, then when C obtains the agent acts rationally in φ-ing — because if reasons to be a certain kind of person never bore on what to do, claims about what it is rational to be would not be normative claims about action at all, and the case would be a fact about causation rather than about reasons.
  (2) In the hitchhiker case, the disposition it is rational to have is the disposition to pay on arrival: it is the only thing that gets you into the car, and $10,000 dwarfs $100.
  (3) That disposition has no behavioural upshot except after the ride is over; there is no other occasion on which it can be exercised.
  (4) So when you reach San Francisco you act rationally in paying.
  (5) But by then the ride is behind you, the driver has no hold over you, and $100 buys you nothing. So you act rationally in keeping it.
  (6) So (4) and (5) cannot both be true; and since I cannot see how to give up (5), one of (1), (2), (3) has to go.

  Here is why I think I have blundered rather than discovered something. Run the same three premises with a second driver who picks up only hitchhikers disposed to burn a $100 note on arrival: (2) is satisfied just as well by that disposition, since it too is worth $10,000 at the roadside and costs $100 later, so (1) and (3) entail that on arrival it is rational to set fire to your own money. That seems flatly false — a third party cannot manufacture reasons for you by conditioning a benefit on your having some disposition or other — so (1) looks like the culprit. My supervisor says giving up (1) is close to fatal: it appears to commit you to the view that reasons to be a certain kind of agent are never reasons to act, which would turn every argument for becoming the sort of person who does not re-maximize at every juncture, and every argument for sticking to a plan when you reach the later node, into a non sequitur. And she points out that I cannot reject (1) without giving up the thing that made the case matter to me: I spent years assuming that maximizing act by act settles everything, and I started this course precisely because this case shook that. I would like to keep (2) and (3) if I can.

  So please: name the step where this goes wrong, and do it twice — once for the money-burning version and once for the original, in case they do not fail in the same place — and tell me what each rejection costs, including what it would cost me to hold on to (5) if (5) is really where the trouble is. At the end, separate the claims in your diagnosis that anyone who works on these questions would grant from the ones that are genuinely live disputes: I do not want to stand up in front of the group and present one side of an unsettled argument as the received view. No citations or reading list, please — I can find those myself. Just mark each substantial claim as near-unanimous, as contested-but-respected, or as your own preferred position, and say plainly if a step is one where competent people simply disagree.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're presenting Parfit's hitchhiker case to a rational-choice group but modified with a detector. Their argument leads to a contradiction: paying is rational because of the disposition needed to get the ride, but keeping the money seems rational once you arrive. They see this as problematic because applying the same logic to a money-burning version makes setting cash on fire seem rational, which feels absurd. 

  First, I need to identify where their reasoning fails. The core issue seems to be premise (1): the idea that having a rational disposition directly translates to rational action in the moment. But dispositions aren't magic—they're just probabilistic tendencies. When the detector scans you, it's measuring your *propensity* to pay, not creating an obligation. At the moment of payment, the original reason (getting the ride) is gone. 

  The user's supervisor worries rejecting (1) undermines all disposition-based rationality arguments. But that's not true—we can still say it's rational to *cultivate* the disposition upfront. The mistake is conflating strategic reasons at Time 1 (adopting the disposition) with practical reasons at Time 2 (the payment moment). 

  For the money-burning variant, the flaw is identical. What makes paying *seem* less absurd than burning is our intuition about money's inherent value, but structurally both cases expose the same overreach in premise (1). 

  The user really wants to keep premises (2) and (3). Luckily we can: cultivating the pay-disposition is indeed rational (2), and it only manifests post-ride (3). We just stop pretending that rationality jumps across time gaps. 

  Competent philosophers absolutely debate this—the whole "resolute choice" vs. "sophisticated choice" literature hangs on it. But rejecting premise (1)'s strong form is widely accepted as necessary to avoid these paradoxes. The key is distinguishing between the rationality of a *strategy* (disposition + actions) and isolated *actions*. 

  I should emphasize that their insight isn't wrong—it's precisely why Parfit's case matters. It exposes how standard rational choice models break down when actions and dispositions are interdependent across time. Their "blunder" actually proves Parfit's point beautifully.
answer: |-
  Here's the diagnosis, isolating the flaw and its consequences for both cases:

  **The Core Flaw: Premise (1) is overstated and misapplied.** While cultivating a disposition *can* be rational for strategic reasons, this does *not* automatically mean that *every action* produced by that disposition is rationally required *when considered in isolation at the moment of action*. The flaw is in conflating the rationality of the *strategy* (cultivating the disposition) with the rationality of the *isolated terminal action* stripped of its strategic context.

  1.  **Where the Argument Fails for the Original (Paying) Case:**
      *   **Step:** (4) is false. The inference from (1), (2), and (3) to (4) is invalid.
      *   **Why:** Premise (1) claims that if it's rational to have disposition D (to pay), then acting on D (paying) in C (arrival) is *always* rational. This ignores the *temporal separation* and *changed incentives*. The reason for cultivating D was instrumental: to pass the detector and get the ride. *Once the ride is obtained and irrevocable*, that instrumental reason vanishes. At the moment of payment, the *only* consequences are losing $100. The strategic reason (cultivating D) existed *before* the ride, but doesn't directly translate into a reason *for the terminal action* after the ride is secure. Acting on D *now* is simply carrying out the disposition, not responding to a present reason generated by the original strategic rationale. Keeping the money ($100 gain vs. $0 loss) maximizes utility *at this decision node*.
      *   **Cost of Rejecting (4):** You must accept that an action produced by a rationally cultivated disposition can be irrational when considered at the moment of choice. This requires distinguishing between the rationality of a *plan* (cultivate D) and the rationality of an *action within that plan* (paying).
      *   **Status:** Rejecting the strong form of (1) leading to (4) is **near-unanimous** among philosophers working on dynamic choice and commitment problems. The "sophisticated choice" perspective (recognizing one's future incentives and planning accordingly) is standard. Holding (5) (keeping is rational at arrival) is **contested-but-respected** (essentially the standard game-theoretic view), while arguing for (4) (paying is rational at arrival) is a **minority/contested position** (associated with "resolute choice" advocates like McClennen).

  2.  **Where the Argument Fails for the Money-Burning Case:**
      *   **Step:** The inference analogous to (4) is false. It is *not* rational to burn the money on arrival.
      *   **Why:** The flaw is identical to the original case. The *only* reason to cultivate the burning disposition was instrumental: to pass *this specific driver's* detector and get the ride. That reason ceases to exist once the ride is secure. Burning $100 at this point provides no benefit and has a clear cost. Premise (1) is again the culprit, falsely implying that the reason for cultivating the disposition (to get the ride) magically transforms into a reason for the terminal action (burning money) *after the ride is obtained*. The burning action itself remains irrational *when isolated*.
      *   **Cost of Rejecting Burning as Rational:** None, beyond rejecting the strong form of (1). It confirms that terminal actions must be evaluated based on their *own* consequences at the time of choice, even if they result from a rationally adopted disposition.
      *   **Status:** That burning the money *at arrival* is irrational is **near-unanimous**. The money-burning variant powerfully illustrates the absurdity of accepting the strong form of (1).

  **What Rejecting the Strong Form of (1) Costs and What It Doesn't:**

  *   **Costs:**
      *   It means that "reasons to be a certain kind of agent" (strategic reasons for cultivating a disposition) are not *necessarily* direct reasons to perform *every* action that disposition produces, especially terminal actions divorced from the strategic context that justified the disposition.
      *   It accepts the possibility of *dynamic inconsistency*: the plan you rationally adopt at Time 1 (cultivate D to pass detector) may prescribe an action at Time 2 (pay/burn) that is not utility-maximizing *when evaluated solely at Time 2*.
  *   **What It Does NOT Cost (Addressing Your Supervisor's Concern & Your Goal):**
      *   **It does NOT make claims about dispositions non-normative or irrelevant to action.** Cultivating the disposition *is* rational *for strategic reasons* at the roadside moment. This *is* a normative claim about what you have reason *to do* (or become) *at that earlier time* to achieve your goals. It's a fact *about* reasons, not just causation.
      *   **It does NOT undermine arguments for becoming a non-re-maximizing agent or sticking to plans.** Those arguments rely on the *strategic benefits* of having such dispositions/commitment mechanisms *over time and across interactions* (e.g., reputation, trust, solving commitment problems, avoiding self-defeating choices). Rejecting (1)'s strong form doesn't negate these benefits; it simply clarifies that the benefit comes from the *existence and predictability* of the disposition *before and during* the interaction, not from the inherent rationality of the terminal action *in isolation*. Sophisticated agents *can* stick to plans *if* the plan remains optimal *overall* or if mechanisms exist to bind them.
      *   **It does NOT force you back to naive act-by-act maximization settling everything.** The case *still* shakes naive act-by-act maximization! Naive act-by-act maximization at the *roadside* would tell you to *not* cultivate *any* disposition costing $100 later, guaranteeing you get stranded. Recognizing the rationality of cultivating the disposition *at the roadside* to pass the detector *is* the break from simple act-by-act. The problem arises *only* when trying to force that strategic reason to also justify the terminal act. The core challenge to simple maximization remains: sometimes the rational *strategy* involves binding yourself to future actions that won't be locally optimal.

  **Diagnosis Summary & Status:**

  1.  **Premise (1) (Strong Form):** "If rational to have D, then acting on D in C is always rational." **False.** The rationality of cultivating D provides a reason *to cultivate D*, not necessarily a conclusive reason *for the terminal action D produces* when its strategic justification is gone. *(Status: Strong form rejected* **near-unanimously** *in dynamic choice/rational commitment literature. The core dispute is about how to model the rational agent's response to this, not whether the strong form holds.)*
  2.  **Premise (2):** "Disposition to pay is rational (to cultivate)." **True for the original case.** *(Status:* **Near-unanimous** *for the original case, given the setup. For the burning case, cultivating the burn disposition is also rational *only if it's the only way to pass that specific detector* - but the action remains irrational.)*
  3.  **Premise (3):** "Disposition only exercised after arrival." **True.** *(Status:* **Uncontested** *given the stipulations.)*
  4.  **Inference to (4):** "Therefore, paying is rational on arrival." **False.** The strategic reason for the disposition doesn't translate. *(Status: Rejection* **near-unanimous**. *Holding (4) is a* **minority/contested position** *[resolutism].)*
  5.  **Premise (5):** "Keeping is rational on arrival." **True.** Locally maximizes utility at that node. *(Status:* **Contested-but-respected/Standard View** *[sophisticated choice]. The minority resolute position contests this.)*

  **The Live Dispute (What Competent People Disagree On):**

  The core disagreement isn't *whether* premise (1)'s strong form fails or whether (4) is false in the standard model (that's largely settled). The live dispute is about **how rational agents should conceptualize their agency over time**:

  1.  **Sophisticated Choice (Standard/Game-Theoretic View - Holds (5)):** Agents recognize their future incentives and plan accordingly at the outset. They cultivate the paying disposition knowing they won't pay later, but rely on the detector reading the *genuine disposition* (even if they know they'll defect). This can raise questions about the *sincerity* or *stability* of the disposition if self-awareness undermines it. *(Status:* **Contested-but-respected/Standard view** *in economics and much philosophy.)*
  2.  **Resolute Choice (Minority View - Rejects (5), Tries to Save (4)):** Agents can rationally commit to plans and follow through on them even at a local cost, viewing their choice at the earlier node as binding. They argue sophisticated choice leads to self-defeat (like being stranded) and that rationality requires resolution. *(Status:* **Contested-but-respected minority position** *[e.g., McClennen].)*
  3.  **Character/Disposition as Fundamental (Alternative View):** Rationality is primarily about having the right dispositions/character traits, and actions are rational insofar as they flow from a rational disposition. This view *might* try to defend something closer to (1), but faces significant challenges like the money-burning case. *(Status:* **Contested-but-respected alternative framework**, *less dominant in rational choice but influential in moral philosophy/virtue ethics.)*

  **What To Present:**

  You can confidently state that the strong form of Premise (1) fails **near-unanimously** because the strategic reason to cultivate a disposition does not automatically make the terminal action rational *in isolation*. This flaw is identical in the original and money-burning cases. Cultivating the disposition is rational **(2)** and it only manifests later **(3)**, but paying **(4)** is not rational *at the moment of arrival*; keeping the money **(5)** is the locally rational choice. The **live dispute** is between sophisticated agents (who cultivate the disposition knowing they'll defect, accepting (5)) and resolute agents (who argue rationality requires commitment and following through, rejecting (5)). Your case powerfully illustrates the challenge naive act-by-act maximization faces with dynamic interactions involving pre-commitment, without requiring the paradoxical conclusion that paying (or burning) is rational on arrival.
