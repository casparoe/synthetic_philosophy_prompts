                 BS: 30 points
                 BH: 30 points

             Participants can buy any number of contracts for any quadrant. They can spend their 100 points. They record their purchases.

          7. Reveal and payout (10 minutes): The true quadrant is revealed. The bookkeeper pays 100 points for each contract held for the true quadrant. Participants calculate their total points (after payout).

          8. Discussion (20 minutes): 
              - Compare the strategies: which team did better?
              - Why did Team A update by removing RH?
              - Why did Team B update by changing the Red part and leaving the Blue part?
              - Explain that the radio message did not say the soldier is in Red. It gave information about the entire Red territory. So it doesn't rule out RH, it just makes it less likely relative to RS within the Red area.
              - The true distribution (from which the draw was made) was the one that Team B used.
              - If we played many rounds, Team B would come out ahead on average.

          9. Wrinkle: the mountain and road (5 minutes): 
              - Now, introduce the idea that the boundaries are not equally permeable. The Red/Blue boundary is a mountain (hard to cross) and the Second Company/Headquarters boundary is a road (easy to cross). 
              - How might this affect the update? 
                  - If we think of the update as "sliding" probability from RH, then because the road is easy, we might slide the probability from RH to RS (the adjacent quadrant across the road) rather than to the Blue quadrants (across the mountain). 
                  - But note: the message is not about movement; it's about the map. So the terrain might not affect the map update? 
              - However, in an alternative updating method (like imaging), we might adjust by moving probability to the closest possible world. 
                  - If the message had been "You are not in RH", then we would remove RH and redistribute. But how? The closest quadrants to RH are RS (across the road) and ... wait, RH is adjacent to RS (by road) and to BH (by mountain)? and also to BS? Actually, the grid:

                        Second Company     Headquarters
                    Red     (RS)             (RH)
                    Blue    (BS)             (BH)

                  Adjacencies:
                    RS is adjacent to RH (road) and BS (mountain).
                    RH is adjacent to RS (road) and BH (mountain).
                    BS is adjacent to RS (mountain) and BH (road).
                    BH is adjacent to RH (mountain) and BS (road).

                  So if we have to move probability out of RH, we might move it to RS (road) and BH (mountain). But the mountain is harder, so we move more to RS? 

              - This wrinkle is not in the classic Judy Benjamin problem. It is an extension. In our activity, we did not use it. We can mention it in the debrief as an alternative way to update when the information is categorical (e.g., "You are not in RH") rather than probabilistic. But for the probabilistic message, the classic update is Jeffrey conditioning. 

          10. Conclusion (5 minutes): 
              - The Judy Benjamin problem highlights that updating on conditional probabilities (as opposed to categorical statements) requires a rule. 
              - The two camps reflect two different rules: one that treats the message as implying RH is impossible (which is not what the message said) and one that proportionally adjusts within the Red region (Jeffrey conditioning). 
              - The wrinkle about the terrain might matter if we use imaging instead of conditioning, but that's a more advanced topic.

     Potential problems:

          - Problem: Participants might not understand the radio message. 
            Solution: State it clearly and in two ways: "In the Red territory, 75% of the area is Second Company and 25% is Headquarters. The Blue territory remains evenly split: 50% Second Company and 50% Headquarters."

          - Problem: Participants might think the message means that the soldier is in Red and then in Second Company with 75% chance. 
            Solution: Emphasize: "This is information about the entire territory, not specifically about your location."

          - Problem: In the betting, participants might not understand the contracts. 
            Solution: Give an example: "If you buy one contract for RH for 5 points, and RH is true, you get 100 points. So you make a profit of 95 points. If RH is false, you lose 5 points."

          - Problem: The true quadrant is drawn from the updated distribution, so the distribution is fixed. But participants are not told that. They are only told the message. 
            Solution: In the debrief, we reveal that the draw was from (3/8,1/8,1/4,1/4).

          - Problem: The activity does not include the wrinkle about the terrain during the main update. 
            Solution: We leave it for the debrief discussion.

     Materials:

          - A poster of the 2x2 grid with labels: 
                 Red, Second Company   |   Red, Headquarters
                 -------------------------------------------
                 Blue, Second Company  |   Blue, Headquarters

          - Envelopes and slips for drawing the true quadrant.
          - Ledger or spreadsheet for points (or use physical chips for points? but 100 per person might be a lot).

          Alternatively, we can use a digital tool? But since it's a library, maybe paper.

     Timeline:

          0-10: Introduction
          10-15: Draw true quadrant (by bookkeeper) and initial beliefs (participants record 25% each).
          15-20: Radio message.
          20-35: Participants update and record new probabilities.
          35-40: Form teams.
          40-60: Betting: bookkeeper offers contracts at fixed prices. Participants decide how many to buy for each quadrant.
          60-70: Reveal true quadrant and payout.
          70-90: Discussion and debrief.

     What the game cannot reproduce:

          - In the real Judy Benjamin problem, the message is: "I don't know where you are, but if you are in Red, then the probability that you are in Second Company is 3/4." This is a conditional probability learned from a possibly partial observation. The update rule is not uniquely determined. In our activity, we treated the message as a fact about the territory (the map). This is one interpretation. In the original problem, the message might be interpreted as evidence about the soldier's location without changing the map. But in our activity, we assumed the map changed. 

          - The philosophical debate about the right update rule. We showed that one rule (Jeffrey conditioning) matches the true distribution we used, so it wins. But in the original problem, there is no "true distribution" given; it's about how to update given the message.

     Should we include the terrain wrinkle in the update? 

          I think not, because it complicates and might confuse. We can mention it in the debrief as an alternative for categorical information.

     Final note: We assumed the updated distribution is (3/8,1/8,1/4,1/4). This is the standard resolution. But there is a camp that argues for other updates. However, for the purpose of the activity, we use this as the "correct" one to show that Team B is better calibrated.

     Let's hope that in the one round, the true quadrant is RH. Then Team A, who set RH to 0, will not have bought the RH contract at 5 points, but Team B will have bought it. And if RH is true, Team B makes a big profit.

     Alternatively, if the true quadrant is BS, then Team A will have bought the BS contract at 30 points (because they value it at 33.3) and Team B won't (because they value it at 25). But the true value is 25? Wait, the true probability is 1/4, so the expected value of the contract is 100*(1/4)=25. So paying 30 is overpaying. So Team A loses on that contract.

     Therefore, regardless of the outcome, we can discuss the expected value.

     We'll go with this design.
answer: |-
  Below is a complete, runnable activity for your puzzle-and-philosophy night, designed to make participants experience the Judy Benjamin probability update dispute firsthand. The activity uses physical chips, a grid, and strategic betting to force two distinct belief-update strategies to emerge. The "mountain vs. road" wrinkle is included to make the "sliding probability" approach feel less arbitrary and to spark debate about how probabilities should "move" when constrained.

  ---

  ### **Activity: The Soldier's Dilemma**  
  **Objective:** Experience how a vague radio message ("If in Red, 3/4 chance in Second Company") leads to two conflicting probability updates, and see how this affects betting behavior.  
  **Time:** 90 minutes  
  **Participants:** 12 adults + 1 facilitator (you).  
  **Materials:**  
  - A large 2×2 grid poster labeled with quadrants:  
    - **Red-Second Company (RS)** | **Red-Headquarters (RH)**  
    - **Blue-Second Company (BS)** | **Blue-Headquarters (BH)**  
  - 48 identical chips (4 per participant).  
  - 12 sets of betting cards (one per participant) with options:  
    - *RS, RH, BS, BH* (for quadrant bets) and *Red, Blue, Second, HQ* (for region bets).  
  - 1 "Radio Message" card:  
    > *"If you are in Red territory, there is a 3/4 chance you are in Second Company territory. Blue territory is evenly split."*  
  - 1 six-sided die (for the wrinkle).  
  - Scoreboard (to track points).  

  ---

  ### **Rules and Setup**  
  **1. Initial Beliefs (15 min)**  
  - Each participant starts with 4 chips, representing their belief that each quadrant is equally likely (1/4 probability). They place 1 chip on each quadrant (RS, RH, BS, BH).  
  - **Facilitator script:** *"A soldier is dropped randomly in one quadrant. You start with 1/4 probability for each. Chips represent your confidence."*  

  **2. Radio Message & Belief Update (20 min)**  
  - Reveal the radio message card. Clarify:  
    *"This is a fact about the territory—not necessarily about the soldier's location. If she's in Blue, the message doesn't apply."*  
  - Participants **reallocate their chips** based on the message. No rules—they choose how to update.  
    - **Expected strategies:**  
      - **Camp 1 (Hard Update):** Remove RH entirely (since it contradicts the message). Distribute chips equally among RS, BS, BH (now 1/3 each).  
      - **Camp 2 (Soft Update):** Keep all quadrants possible. Adjust Red region only: move chips from RH to RS until RS:RH = 3:1. Blue remains 1/4 each.  
        - *Example:* 3 chips on RS, 1 on RH, 1 on BS, 1 on BH (total 6 chips? Scale to 4: e.g., 1.5 on RS, 0.5 on RH, 1 on BS, 1 on BH—rounding allowed).  
  - **Wrinkle: Mountain vs. Road**  
    - Announce: *"The Red/Blue border is a mountain (hard to cross). The Second/HQ border is a road (easy to cross). If probability 'slides' out of a quadrant, it prefers the closest/easiest neighbor."*  
    - For **Soft Updaters**: If moving probability out of RH, it *must* slide to RS (across the road) not BH (across mountains).  

  **3. Betting Rounds (30 min)**  
  Participants bet chips on where the soldier is. **No money—points are scored if the bet matches a random "true" quadrant drawn later.**  
  - **Round 1: Quadrant Bets (10 min)**  
    - Participants place any number of their chips on quadrant cards (RS, RH, BS, BH).  
    - *Scoring:* If the true quadrant is drawn, bets on it score 3x the chips placed. Others lose.  
  - **Round 2: Region Bets (10 min)**  
    - Participants place chips on region cards:  
      - *Red/Blue* (if soldier is in that half)  
      - *Second/HQ* (if soldier is in that company).  
    - *Scoring:* Correct bets score 2x chips.  
  - **True Quadrant Reveal (10 min)**  
    - Roll a die to determine the "true" quadrant:  
      - 1–3: RS (3/8 chance)  
      - 4: RH (1/8 chance)  
      - 5: BS (1/4 chance)  
      - 6: BH (1/4 chance)  
    - *Why this distribution?* This matches the "soft update" prior, ensuring it's mathematically correct. Pay out points.  

  **4. Trading Phase (15 min)**  
  - Pair participants with opposite update strategies. Each gets 4 new chips.  
  - They trade chips representing quadrants (e.g., "I’ll give you my RH chip for your RS chip").  
  - **Goal:** Reveal disagreement through exchange rates.  
    - *Hard Updaters* value RH at 0—will trade it for anything.  
    - *Soft Updaters* value RH at 1/8—will only trade if compensated.  

  ---

  ### **Debrief (10 min)**  
  Map the activity to Judy Benjamin’s puzzle:  
  1. **Initial chips (1/4 each):** Uniform prior—no information.  
  2. **Radio message:** Forces a conditional update ("*If* Red, *then* P(Second Company) = 3/4").  
  3. **Two strategies emerged:**  
     - **Hard Update (Cross-out RH):** Treats message as eliminating possibilities. Results in P(RS)=P(BS)=P(BH)=1/3.  
     - **Soft Update (Slide probabilities):** Adjusts only within Red. Results in P(RS)=3/8, P(RH)=1/8, P(BS)=P(BH)=1/4.  
  4. **Betting disagreement:**  
     - Hard Updaters bet heavily on Blue/BS/BH (they think RH is impossible).  
     - Soft Updaters bet moderately on RH (they think it’s unlikely but possible).  
  5. **Mountain/road wrinkle:**  
     - Justifies *why* probability slides from RH to RS (not BH)—it’s "closer" via an easy road. Makes soft updates feel less arbitrary.  
     - *Reality check:* This is a narrative aid—it doesn’t change the math but grounds the intuition.  

  **The Itch You Can’t Scratch in the Game:**  
  - Judy Benjamin’s core tension is between **conditioning** (updating on definite information, e.g., "You are in Red") and **Jeffrey conditioning** (updating on *uncertain* information, e.g., "If Red, then P(Second)=3/4"). The game can’t *prove* which is "right"—but the betting reveals how the message’s ambiguity splits rational people. State this explicitly in debrief.  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **"What does the radio message mean?!"**  
     - Participants may think it implies the soldier is *in Red*.  
     - **Fix:** Re-read the card. Emphasize: *"This is about the territory, not necessarily the soldier. If she’s in Blue, the message is irrelevant but true."*  

  2. **Chip confusion during soft updates:**  
     - Fractions (3/8, 1/8) are messy with 4 chips.  
     - **Fix:** Allow rounding (e.g., 2 chips on RS, 1 on RH, 1 on BS). Or let them use fractional chips (e.g., tear paper).  

  3. **Betting too cautiously:**  
     - Some may avoid betting on RH/RS.  
     - **Fix:** Encourage bold bets: "Points are free—go with your gut!"  

  4. **The mountain/road wrinkle hijacking discussion:**  
     - Teams may over-focus on terrain and ignore probability.  
     - **Fix:** In debrief, clarify: *"Terrain just visualizes why probability might slide—it doesn’t change the math."*  

  ---

  ### **Should You Keep the Mountain/Road Wrinkle?**  
  **Yes!** It doesn’t alter the core dispute but:  
  - Gives "sliding probability" an intuitive hook (probability "moves" to adjacent easy-to-reach quadrants).  
  - Creates richer debate ("Why slide to RS and not BS?").  
  - Distracts from math formalism, making the puzzle feel tactile.  

  **One Caveat:** The wrinkle isn’t in the original Judy Benjamin problem—it’s a narrative tool. Admit this in debrief to avoid misrepresentation.  

  ---

  ### **Timeline**  
  - **0–15 min:** Setup & initial beliefs.  
  - **15–35 min:** Radio message & belief update (observe strategies).  
  - **35–65 min:** Betting rounds (quadrant + region) + reveal true quadrant.  
  - **65–80 min:** Trading phase.  
  - **80–90 min:** Debrief + philosophical punchline.  

  ---

  By the end, participants will have *felt* the update disagreement in their chips, bets, and trades—no jargon needed. The itch? **Ambiguous evidence breaks rationality into tribes.** Good luck!
