  ### Analysis of Dev's Betting Rule and Application to Your Situation

  I analyzed Dev's five historical cases to infer his betting rule. The core insight is that Dev uses a conservative, risk-managed approach based on the Kelly criterion but with two adjustments: (1) a statistical significance filter to avoid betting on small or unreliable edges, and (2) a "half-Kelly" fraction to reduce volatility. The rule is applied to the **betting account balance** (not total wealth), as this was his sole bankroll in the old cases. Future contributions (e.g., your monthly $2,500) are not pre-counted in the bankroll; they only affect the stake as they are added to the account.

  The inferred rule:
  - **Kelly fraction**: For a bet with win probability \(p\), net odds \(b\) (profit per unit staked), the Kelly fraction is \(f_{\text{kelly}} = p - \frac{(1-p)}{b}\).
  - **Statistical filter**: Bet only if the win rate is statistically significant at a 95% confidence level (\(z \geq 2\)), where \(z = \frac{(p - p_0)}{\text{SE}}\), \(p_0 = \frac{1}{1+b}\) (break-even win rate), and \(\text{SE} = \sqrt{\frac{p_0(1-p_0)}{n}}\) (standard error based on trials \(n\)).
  - **Fraction adjustment**: Use half of \(f_{\text{kelly}}\) (i.e., \(f = \frac{f_{\text{kelly}}}{2}\)).
  - **Bankroll**: Current balance of the betting account at the time of the bet.
  - **Stake calculation**: For each bet, wager \(f \times \text{current account balance}\).

  This rule fits all five cases perfectly:
  - **Case 1**: \(p = 0.55\), even money (\(b=1\), \(p_0=0.5\)), \(n=1000\) → \(z \approx 3.16 \geq 2\), \(f_{\text{kelly}} = 0.10\), half = 0.05 (5%).
