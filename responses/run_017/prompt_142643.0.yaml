prompt: |-
  I work on a platform team, and a lot of my job over the past few years has been onboarding new engineers onto our deployment and debugging procedures. Three things keep happening, and I have come to think they are all one thing, though I cannot make the shape of it out.

  The first is a runbook. Our deployment runbook instructs new hires to drain active connections, then flip the feature flag, then verify. For about three years now, flipping the flag has drained the connections atomically; the first step is a no-op. We have kept it anyway, because removing it makes training measurably worse. I have compared cohorts informally: engineers trained on the current, accurate description make more first-month mistakes than engineers trained on the superseded description, even though both cohorts are told the true facts about the system whenever they ask. The false step appears to be doing real work — giving a beginner somewhere to put their attention, or a place to stand while the rest of the procedure is still unfamiliar. There is a further wrinkle: engineers who are told, after six months or so, that the step does nothing at all sometimes start making the beginner mistakes again.

  The second is the reverse. When I ask our strongest engineers to write down how they go about diagnosing a flaky test, they produce clean, ordered procedures. Juniors who follow those procedures literally do considerably worse than juniors who simply shadow the senior for a week. And on the few occasions we have recorded the screen, the seniors do not do what they described — not out of dishonesty, but because what they wrote is a retrospective summary that reads like a method. The written version is not worthless, incidentally: it works fine as a reminder for someone who can already do the thing.

  The third is smaller and personal. I can tell within a second or two whether a code review comment is a genuine objection or a style nitpick dressed up as one. I have tried many times to state the rule, including as a lint rule we prototyped and abandoned; every formulation I produce catches both categories or neither. I am not guessing, though — my hit rate is high and I would bet on individual calls.

  What strikes me is that the two directions do not line up. A description can be false and still reliably produce the ability; a description can be accurate and still be inert with respect to producing the ability. So the thing I am noticing is not just that some knowledge lives in the hands and resists being said. In the runbook case it is said perfectly well, and what is said is wrong, and the wrongness looks load-bearing. In the flaky-test case what is said is not wrong — or at least not straightforwardly wrong — and the failure is one of transmission.

  A friend suggested tacit knowledge, which seems to me to miss the first case: that procedure is fully articulable, it is just false. I have also seen the phrase knowing-how versus knowing-that somewhere, but if that only distinguishes two kinds of knowledge, it does not explain why a false propositional description should outperform a true one. Someone else suggested muscle memory or the procedural/declarative distinction, which seems to be a claim about where things are stored in the brain rather than about this mismatch between a description's correctness and its power to produce competence.

  So: is there an established concept for the mismatch itself — the two-sided failure of correspondence between how true a description is and how well it generates the ability it describes? Is it one phenomenon or two, and if the useful-false-description and the inert-true-description are normally treated separately, how are they related to each other? I am told there is a long-running disagreement about whether knowing-how is really just a special case of knowing-that; does the runbook-style case have any bearing on that, and if so on which side? If nothing established fits, I would want a term coined for it, with a definition and boundary cases, since I want to know what does not count: a mnemonic, a simplification told to a child, a placebo, a motivating lie. The label matters less to me than the carving — I want to know what this is, what it is not, and where its edges are. I should add that I have no way to chase down papers or citations, so names of authors and works will not do me much good; the distinction itself is what I am after.
reasoning: |-
  Okay, the user is describing a fascinating phenomenon they've observed in their work onboarding engineers. They've noticed two puzzling patterns: 

  First, keeping an obsolete step in their deployment runbook actually helps new engineers perform better, even though they're told it's unnecessary. Removing this "false" step leads to more mistakes. Even more interesting - when engineers later learn the step is useless, some revert to beginner mistakes.

  Second, when senior engineers document their debugging process for flaky tests, the written procedure fails to help juniors. Juniors learn better by shadowing seniors than following the documentation. Videos show seniors don't actually follow their own documented steps - the documentation is a retrospective summary rather than the actual process.

  The user also mentions a personal skill - instantly distinguishing substantive code review comments from stylistic nitpicks - that resists being formalized into rules.

  What makes this especially intriguing is the asymmetry: 
  - A false description (the obsolete runbook step) improves performance
  - A true description (the debugging procedure) fails to transfer skill

  The user has considered concepts like tacit knowledge (Polanyi) and know-how vs know-that (Ryle), but finds them incomplete because they don't explain why false propositions could be beneficial.

  What the user really needs is:
  - A conceptual framework explaining this truth/utility mismatch
  - Clarification whether this is one phenomenon or two distinct ones
  - How this relates to philosophical debates about knowledge types
  - Clear boundaries to distinguish this from similar concepts (like simplifications or placebos)

  Key insights emerging:
  1. The "false but useful" case resembles training wheels - scaffolding that provides cognitive anchoring
  2. The "true but inert" case shows the gap between descriptive and prescriptive knowledge
  3. Both reveal the importance of embodied cognition - knowledge embedded in actions
  4. The personal code review skill demonstrates pattern recognition that resists codification

  This seems to point toward:
  - The fundamental role of embodied practice in skill acquisition
  - How explicit knowledge emerges from (and remains tethered to) implicit understanding
  - The difference between competence (ability to perform) and comprehension (ability to explain)

  The challenge is framing this in a way that connects all three observations while distinguishing them from related concepts.
answer: |-
  Your observations capture a profound tension in knowledge transmission—one that isn't fully explained by existing frameworks like "tacit knowledge" or "knowing-how vs. knowing-that." What you're describing is **the decoupling of descriptive fidelity from functional utility in procedural knowledge**. This isn't one phenomenon but two interrelated asymmetries:  

  ### 1. **The Scaffolding Paradox**  
     - **What it is**: A *false or redundant step* that enhances learning despite being factually incorrect (your runbook case).  
     - **Why it works**:  
       - **Cognitive anchoring**: Novices need stable reference points. The obsolete step acts as a "cognitive placeholder," reducing cognitive load while they integrate complex workflows. Removing it destabilizes their mental model prematurely.  
       - **Behavioral priming**: The step ritualizes attention, directing focus to the *context* of action (e.g., "now we ensure safety") rather than the literal instruction.  
       - **Regression trigger**: When experts later reveal the redundancy, it disrupts the embodied routine, causing temporary skill decay—proving the step wasn't just "training wheels" but part of the functional gestalt.  
     - **Boundaries**:  
       - ≠ *Placebo* (which works via belief). Here, belief is irrelevant; the action itself structures attention.  
       - ≠ *Simplification* (e.g., "atoms are tiny solar systems"). Your false step adds complexity but aids orientation.  

  ### 2. **The Descriptive Gap**  
     - **What it is**: An *accurate but inert description* that fails to transmit ability (your flaky-test diagnosis case).  
     - **Why it fails**:  
       - **Retrospective rationalization**: Experts document an idealized "map" of their process, but their real-time decisions rely on subconscious pattern-matching, environmental cues, and iterative guesses—none captured in the summary.  
       - **Loss of situated context**: Junior engineers lack the perceptual acuity to "see" what the expert sees (e.g., subtle log patterns, hunches from prior failures). The written procedure omits micro-judgments.  
     - **Boundaries**:  
       - ≠ *Tacit knowledge* (which implies inarticulability). Here, the knowledge *is* articulable but loses efficacy when detached from lived experience.  
       - ≠ *Incomplete instructions*. The description is complete and accurate—yet still non-functional for novices.  

  ### How These Asymmetries Interrelate  
  They reveal two sides of **embodied cognition**:  
  - **Scaffolding leverages embodiment**: The false step works because it engages the learner’s body (e.g., keystrokes, visual focus), creating muscle memory and temporal rhythm that abstract truths cannot.  
  - **Descriptive gaps expose disembodiment**: Accurate descriptions fail because they strip away the sensory, contextual, and iterative facets of real-world practice.  

  ### Philosophical Implications for "Knowing-How" vs. "Knowing-That"  
  Your cases challenge Gilbert Ryle’s classic dichotomy:  
  - **The runbook** shows that *false* "knowing-that" (a propositional description) can enhance "knowing-how" (performance)—contradicting the idea that knowing-how is independent.  
  - **The flaky-test docs** show that *true* "knowing-that" doesn’t generate "knowing-how," supporting Ryle’s separation.  
  **Resolution**: Knowing-how isn’t reducible to knowing-that, but it *feeds on* propositional content—even false or incomplete—as scaffolding. Knowledge-as-action thrives on affordances, not just facts.  

  ### Coined Concept: **Procedural-Decoupled Knowledge (PDK)**  
  **Definition**: Knowledge artifacts (descriptions, steps, rules) whose *functional value* (ability to generate competent performance) is disconnected from their *descriptive truth*.  
  - **Two subtypes**:  
    - **Positively decoupled**: False/obsolete descriptions that enhance skill acquisition (e.g., your runbook step).  
    - **Negatively decoupled**: True descriptions that fail to transmit skill (e.g., your debugging procedure).  
  - **Key boundary**: PDK is distinct from:  
    - *Heuristics* (useful approximations): PDK may contain literal falsehoods.  
    - *Placebos*: PDK works through behavioral reinforcement, not belief.  
    - *Mnemonics*: PDK embeds actions, not just recall aids.  

  ### Why This Fits Your Cases  
  - **Runbook**: The false step is *positively decoupled PDK*. Its truth is irrelevant; its utility lies in structuring novice attention.  
  - **Flaky-test docs**: The accurate summary is *negatively decoupled PDK*. It describes truth but loses the embodied context needed for execution.  
  - **Code-review intuition**: Your skill resists codification because it’s grounded in perceptual pattern-matching—a form of knowing-how that PDK descriptions cannot capture.  

  ### Practical Takeaway  
  Embrace PDK deliberately:  
  - **Retain "useful falsehoods"** in onboarding docs but label them as "scaffolding steps" (e.g., "This step ensures focus here; its technical necessity may evolve").  
  - **Replace procedural summaries with contextual apprenticeships**. Record experts *thinking aloud* during real tasks, not post hoc rationalizations.  
  - **Accept that some skills** (like your code-review sense) live in the body. Train them via immersion, not manuals.  

  This decoupling isn’t a flaw—it’s a feature of how humans embed knowledge in action. The map is never the territory, and sometimes the wrong map gets you there faster.
